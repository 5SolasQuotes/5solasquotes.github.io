<main class="wrap"><figure class="quote" id="q-81eee0ccb1" data-kw="">
<blockquote><p>But at the same time we must observe that the covenant of grace is nothing more than the accomplishment of the eternal counsel of God. The righteousness of faith, of which the sacraments are the seals, and which is promised in the covenant, belongs exclusively to the elect.

Nor must we omit to observe what is here of no small consequence, that the promises of the covenant, including everything it embraces, are not conditional but absolute.

For in the covenant God promises to bestow even those qualifications that are to be regarded as the prerequisites of its ultimate and complete fruition (Jer. 31:32, 33; 32:39, 40). The reason is that the promises of this covenant are founded in the satisfaction and merits of Christ, who has merited for his people not only eternal life but likewise all those benefits without which that life could not be obtained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 136-37.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9c2b54c1ae" data-kw="">
<blockquote><p>Were all the promises of the covenant, made to Christ; and are they all “in him, yea, and Amen?” Then it follows, that they, in and with him, are freely offered to sinners of mankind in common, who hear the gospel. Reader, Christ and all the precious promises in him, are by Jehovah graciously offered, and in the offer, are directed to thee for thy acceptance. The authentic offer, brings them all within thy reach, and affords thee a Divine, an authoritative warrant, to come as a sinner, and to accept him, and them in him.

Come then, come as thou art; come without delay; come without looking into thy heart, or to thy life, for any good thing to recommend thee; and, upon the warrant of the free, full, and particular offer, so embrace the promises in Christ, as cordially to trust in him, for the performance of them to thy soul. Come, not on the ground of any good disposition wrought in thee, or of any good work done by thee, for these afford thee no right, but, come as a sinner, upon the warrant of the unlimited grant and call of the gospel, and trust in the Lord Jesus, for all the grace of the promise.

After thou hast begun, continue to trust in him. The believer’s turning away his eye from Christ and the covenant, is the cause, why he begins to sink under his pressures. His departing from Christ his living Redeemer, by “an evil heart of unbelief,” issues for ordinary, in his being torn asunder with a thousand anxieties. O beware of disbelieving the promise, of distrusting the grace, of a promising God; lest he measure to thee according to thy opinion of him. Since the spotless righteousness of Jesus Christ, is likewise offered to thee, and since the offer affords thee, an immediate warrant to receive it; O rely on it, for a right to the blessings promised.

Trust with assured confidence, that the promises will he fulfilled to thee, on the ground of that righteousness only, which is thine in offer; and not, on the ground of any works, which thou thyself hast done. Rely not even on thy acts of faith, for a title to the grace of the promise, but wholly on the righteousness, “revealed from faith to faith so shalt thou be an heir of promise, and shalt Christ “reign in life” eternal, “by one, Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 277-78.</span></figcaption>

</figure><figure class="quote" id="q-87a1170a38" data-kw="">
<blockquote><p>While the non-elect may belong to the external administration of the covenant of grace, only the elect are, properly speaking, in the covenant of grace (cf. Galatians 3:16, Romans 5:15-21, Isaiah 53:10, 11). This view is not a “Reformed Baptist” notion but is the official position of the Westminster Standards (see Larger Catechism 31). Moreover, we find the Westminster divine, Edmund Calamy, arguing for this position:

[A]ll men enter into Adam’s covenant by nature, but the Elect only enter into Christ’s covenant by grace …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-calamy.html">Edmund Calamy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two solemn covenants made between God and man: viz. the covenant of works and the covenant of grace</cite>, (London: Thomas Banks, 1647), p. 6.</span></figcaption>

</figure><figure class="quote" id="q-8b4f7d6ada" data-kw="">
<blockquote><p>As for the desire of the Repentance and life of Reprobates which you attribute unto God, you keep your course I confess in strange expressions, manifestly contradictious to the nature of God, and to your self.

Can you persuade your self that ever the world will be brought about to believe, or any intelligent or sober man amongst them, that God desires the repentance and life of them, whom he hath determined from everlasting to deprive of those helps without which no man can repent and bee saved? yet that he doth deprive them hereof, it is your own most express profession in the former Section.

As for hardening them; doth he not harden whom he will? and hath he not from everlasting ordained all Reprobates unto destruction? As for any desire hereof in God, I account it a very absurd thing, to treat of any will in God under the notion of desire in proper speech; Speak we of the desires of weak men, who cannot effect what they will; but be advised to spare to attribute any desires to God in proper speech, as you would spare to attribute to him, eyes and ears, and hands, and heart, in proper speech, and though God bee pleased in condescension to our capacities to take upon him our infirmities, let us not recompense his goodness so ill, as to conceive of his nature as obnoxious to the same imperfections whereto our natures are</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 233.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<main class="wrap"><figure class="quote" id="q-c361b29603" data-kw="">
<blockquote><p>Galatia is a Region of Lesser Asia, in which the Apostle had laboriously planted Churches, Act. 16. &amp; 18. certain Pharisees being come hither from Judea, who had embraced the Faith of Christ in profession, taught the observation of the Mosaical Law, together with the Faith of the Gospel, as necessary to bee conjoined to our salvation, and had corrupted many, if not all the Churches of that Region, by their error, in the mean while those Impostors did pretend that they were sent by the Apostles, Peter, James, and John, and did falsely affirm, that he (according to their Opinion) had taught all their Doctrines. Wherefore they highly extolled those three Apostles, but did take away the name and right of an Apostle from Paul, as if he was not chosen into the society of the Apostles by Christ, neither acknowledged for an Apostle, by the rest of the Apostles.

Wherefore in this Epistle (the accusation of the false Apostles being refuted) The Apostle deals with the Galatians, that they may return to the soundness of Faith.

Of the Epistle (besides the Preface and the Conclusion) there are three chief parts. In the first he deals with the Galatians, that they would renounce the errors which they had drunk in; but by the way, that he might prevent those that accuse him, he courageously asserts his Apostleship, lest he should give place to those three chief Apostles, in his Apostolical authority. In the first Chapter, and the first part of the second.

In the second part he purposely disputes of Justification by Faith, and of the temporary use and abrogation of the Mosaical Law, in the latter part of the second Chapter, also in the third and fourth.

Lastly, In the third part his Exhortation for perseverance in Christian Liberty being premised, he counsels them to use it well, and shews which are the true exercises of Christians, lest, either by a dissolute licentiousness, or the superstitious observation of Ceremonies, they should neglect the chief Christian duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 92-93.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-87ef79049c" data-kw="">

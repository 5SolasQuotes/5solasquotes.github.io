<main class="wrap"><figure class="quote" id="q-355accd44f" data-kw="">
<blockquote><p>If a sinner, being justified, has all things at once that are necessary for salvation? And if personal holiness, and progress in holy obedience, is not necessary to a justified persons’s possession of glory, in case of his continuing in life after his justification? …[F]or though the believer’s progress in holy obedience, by reason of the many stops interruptions, and assaults he frequently meets with from Satan, the world, and in-dwelling corruption, is far from being alike at all times, yet ‘the path of the just,’ though he frequently fall, will be ‘as the shining light, that shineth more and more unto the perfect day.’ Though he may, at time ‘become weary and faint in his mind,’ yet he shall he, by waiting on the Lord, ‘renew his strength, and mount up as with eagles’ wings,’ &amp;c. But still the believer has all this in and from Christ: for whence can our progress in holiness come, but from the supply of his Spirit? Our walking in holy obedience, and every good motion of ours, must be in him, and from him, who is the Way and the Life, who is our head of influences, and the fountain of our strength, and who ‘works in us both to will and to do.’ ‘Abide in me,’ says he ‘and I in you. For without me ye can do nothing. If a man abide not in me, he is cast forth as a branch, and is withered.’ But if the meaning of the query be, of such a necessity of holy obedience, in order to the possession of glory, as imports any kind of causality, we dare not answer in the affirmative; for we cannot look on personal holiness, or good works, as properly federal and conditional means of obtaining the possession of heaven, though we own they are necessary to make us meet for it. These answers, contained in this and the preceding pages, (viz. of the manuscript given in,) are subscribed at Edinburgh, March 12th, 1722, by us, James Hog, Carnock. Thomas Boston, Etterick. John Williamson, Inveresk. James Kid, Queensferry. Gabriel Wilson, Maxton. Ebenezer Erskine, Portmoack. Ralph Erskine, Dunfermline. James Wardlaw, Dunfermline. Henry Davidson, Galashiels. James Bathgate, Orwel. William Hunter, Lillieslead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, ed. Thomas Boston (Scotland, UK: Christian Focus Publications, repr. 2009), 358, 376.</span></figcaption>

<blockquote><p>Lastly, God’s spirit works not with ceremonies, and so they are as the offering of swines’ blood and the slaying of a man; and so abomination to God, Isa. 66:3.

2. The Holy Spirit is merited to us by Christ, Jn. 16:14, “He shall receive of mine and show unto you”: but who can say that the grace of joy in the Holy Ghost, wrought by the droning of organs and the holiness taught by surplice, is a work of the spirit merited by Christ as our High Priest?

3. God has made no promise that He will work by ceremonies, for the Spirit works not without the Word; so then I might resist the working of the Spirit and not sin against the Word; and this is Anabaptists’ Enthusiasm: If God work not by them, they be vain and fruitless; and the idol is unlawful for this [reason], that ‘it profits not’. Also, the Spirit’s action is either natural or supernatural here: If natural, it is a natural work, and a natural spirit, and to be rejected: If supernatural, we may devise means to produce supernatural effects: men’s ceremonies can produce supernatural joy, comfort, peace, and acts of grace purchased to us by Christs merit; this is a miracle.</p></blockquote>

<blockquote><p>II. A Voluntate Dei, ‘from the will of God’. This is the other reason: ‘For the Father seeks such to worship Him.’ [Jn. 4:23] God requires such worship and worshippers. The foundation of this reason is this: The rule of worship is not mans fancy, but God’s will: Men’s fancies and wills are infinitely various, and therefore those that have gone that way, have been divided into a thousand varieties; they worship they know not what, as v. 22. Only God’s will is the stable rule: None knows the mind of God but the Spirit of God: Now this is the worship God requires in Gospel times. Argument Second: From the end [design] of worship. Look what the ends of worship are, such must the worship be: And that was the reason why the Jewish worship was so much typical, because the end of it was to represent Christ; And that end being now attained, and Christ exhibited [revealed], we must consider what were and are the further ends of worship. Now the ends are of two sorts.

1. In reference to God.

2. In reference to men. And both will show us that the worship must be spiritual.

I. In relation to God; so it is double:

      1. To please God: this is finis operis &amp; operantis too [‘the end of the work, and of working’], (if a man be sincere) Ps. 19:14, ‘Let the words of my mouth and the meditation of my heart be acceptable in thy sight.’ Now it is only spiritual worship that can please God: That man does but little consider the nature of God, that thinks God is pleased with the bowing of the knee to an altar, no, it is the bending of the heart that God respects. It is not an organ in a church, but the organ of a gracious heart, and melody in the heart that pleases God.

      2. To exalt God amongst men, to render Him glorious in the eyes of the world: Now how is that done? Do you think that it makes God glorious, when men seek to honor Him with bodily and external services? No, you cannot dishonor God more than by giving Him such a worship as begets a carnal representation of God, etc. And when God would set Himself forth in his glory, He represents Himself in a spiritual manner, and He takes them off from all corporeal thoughts and fancies: ‘God is a Spirit.’ ‘To whom will you liken Me?’ ‘You saw no shape.’ ‘God dwells not in temples made with hands.’

II. In reference to men; so the ends of worship are purely spiritual: such as these (for I can but name them) the elevation of the soul to God, and its assimilation to Him, the union of man with his Creator, the supply of the soul’s spiritual necessities, and the conduct of a sinner to glory, and all these are spiritual works, and to be done by spiritual helps, and therefore evangelical worship must be spiritual worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660), pp. 13-14 Poole was an English puritan.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-48621d854f" data-kw="">
<blockquote><p>Eschew therefore idleness, I beseech you, and by the want ye find in others, learn instruction for yourselves. Be not forgetful how busy your enemy is, if he find you idle; first, he putteth you in mind of some vanity; then offereth opportunity to practise; then he craveth consent, and if you grant him that, he triumpheth by adding practice; he leaveth no means unattempted, whereby he may subvert and bring you to perdition.

To one, as to Eve, he promiseth the knowledge of good and evil, Gen. iii. Another he seduceth with lying speeches, as he did Pharaoh the king, whom he deceived by false prophets, Exod vii. 22. To the Jews he pretended the temple of the Lord, 1 Kings xiii. To the heathen he sheweth universalities and antiquities, 1 Cor. ii. And to other particulars, he leaveth nothing unattempted, whereby he may entangle the soul of the simple, and wrap them in the snare of death.

Fly idleness therefore, and seek virtue, and the way thereof; seek learning as for a jewel, make diligent search and inquisition after her; seek early and seek late; in the morning sow thy seed, and in the evening let not thy hand rest; seek him in the day of trouble, and he will deliver thee, and thou shalt glorify him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sinful Man’s Search</cite>, (1592) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2: 335.</span></figcaption>

<blockquote><p>The chief objects of this compassion are persons who have none to give them relief, as widows and orphans; but, in general, it comprehends all oppressed with misery, whether the poor, prisoners, the sick, the afflicted, &amp;c.

We have many motives or incentives to this affection of mercy.

1. We have the express and oft repeated command of God: Luke vi. 36, Be ye merciful: Rom. xii. 15, Weep with them that weep; and 1 Pet. iii. 8, Be ye kindly affectioned, &amp;c. Whence Gregory Nazianzen says, Orat. 16, If thou hast nothing, give but a tear; for pity is a great solace to the afflicted.

2. We have, besides, the examples of the prophets, of Christ, and the Apostles, and, lastly, of all good men: Jer. ix. 1; Matt. ix. 36; Luke xix. 41; 2 Cor. xi 29. Hence that saying of the Poet, The good are tear-abounding men.

3. We have, lastly, the conformity of nature, and the possibility of suffering similar things. For nothing is more agreeable to nature, than to be touched with the evils and misfortunes of those who are partakers of the same nature with us. This the Apostle points out, Heb. ii. 17, where he says of Christ, that it behoved him to be made like his brethren that he might be a merciful and faithful High priest. The possibility of suffering similar evils, when seriously considered, forces mercy from any man that is not destitute of feeling: For what has happened to some one may happen to any one; which even Aristotle acknowledges, Rhet.2. cap. 18.

Hence we conclude,

1. The apathy (απαθεια) of the Stoics must be exploded by a Christian; as not agreeing either with our natural condition or our supernatural regeneration. Prosper, De vit. contempl. 30, 31, well remarks, We are not in fault for having affections, but for making a bad use of them.

2. Bowels of mercy are found in every regenerate person: he is therefore moved at the very first view of another’s misery.

3. They who, ere they can be excited to mercy, must have much solicitation, bewailing, and clamour from the afflicted, can lay claim to little or nothing of the spiritual man: they who are not moved by these, have nothing human in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 103-04.</span></figcaption>

</figure><figure class="quote" id="q-07a2916b3b" data-kw="">
<blockquote><p>In the sacrament of baptism the Independents lay a pathway to Anabaptism, for first they come close up to the most rigid Brownists, denying baptism to the most part of Christian infants; yea they will grant it to a very few: to these alone whose immediate parents are members of their congregation, who are a wonderful poor handful: all other infants they will have unbaptized till they come to the years of understanding and declare not only their actual faith and holiness, but their subjection to the Kingdom of Christ, that is to their Independency: they will have no stipulation made for the infants’ education… … Secondly, they esteem not baptized infants to be members of their church before they have entered into their [church] covenant; till then they hold them from the Lord’s Table and all the acts of discipline, as people without the Church and not members of it: If it be so, their baptism was of so small use that well they might have wanted it to the time of their admission to be members.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (1645), ch. 6, pp. 119-20</span></figcaption>

</figure><figure class="quote" id="q-9c0fdfa1ba" data-kw="">
<blockquote><p>It is well known, indeed, that the blinded and superstitious followers of the Bishop of Rome claim the title of Catholic, as exclusively applicable to themselves. In their own estimation, they are the Church, the only true Church, the Catholic, or universal Church; and all the other classes of nominal Christians, throughout the world, are heretics, out of the way of salvation. This claim, however, in the estimation of all enlightened Christians, is as presumptuous as it is vain. That department of nominal Christendom, instead of being the only true Church, is considered by many as too far gone in corruption to be comprehended under the Christian name at all; and instead of there being no salvation out of her communion, the danger of eternal perdition is rather to those who are found within her pale.

It is not doubted, indeed, that there are many pious individuals within that pale; but it is believed that they are placed in circumstances deplorably unfavourable to their growth in grace; and that the multitudes around them, in the same communion, are immersed in darkness, superstition, and dreadful error, which place them in the utmost jeopardy of eternal perdition. This is that “Antichrist,” that “Man of sin,” and “Son of Perdition,” who exalteth himself above all that is called God, and who is yet to be “destroyed with the breath of Jehovah’s mouth, and with the brightness of his coming.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterianism: The Truly Primitive and Apostolic Constitution of the Church of Christ</cite>, (Philadelphia PA: Presbyterian Tract and Sunday School Society, 1836), p. 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is well known, indeed, that the blinded and superstitious followers of the Bishop of Rome claim the title of Catholic, as exclusively applicable to themselves. In their own estimation, they are the Church, the only true Church, the Catholic, or universal Church; and all the other classes of nominal Christians, throughout the world, are heretics, out of the way of salvation. This claim, however, in the estimation of all enlightened Christians, is as presumptuous as it is vain. That department of nominal Christendom, instead of being the only true Church, is considered by many as too far gone in corruption to be comprehended under the Christian name at all; and instead of there being no salvation out of her communion, the danger of eternal perdition is rather to those who are found within her pale.

— Samuel Miller, Presbyterianism: The Truly Primitive and Apostolic Constitution of the Church of Christ, (Philadelphia PA: Presbyterian Tract and Sunday School Society, 1836), p. 6.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+well+known%2C+indeed%2C+that+the+blinded+and+superstitious+followers+of+the+Bishop+of+Rome+claim+the+title+of+Catholic%2C+as+exclusively+applicable+to+themselves.+In+their+own+estimation%2C+they+are+the+Church%2C+the+only+true+Church%2C+the+Catholic%2C+or+universal+Church%3B+and+all+the+other+classes+of+nominal+Christians%2C+throughout+the+world%2C+are+heretics%2C+out+of+the+way+of+salvation.+This+claim%2C+however%2C+in+the+estimation+of+all+enlightened+Christians%2C+is+as+presumptuous+as+it+is+vain.+That+department+of+nominal+Christendom%2C+instead+of+being+the+only+true+Church%2C+is+considered+by+many+as+too+far+gone+in+corruption+to+be+comprehended+under+the+Christian+name+at+all%3B+and+instead+of+there+being+no+salvation+out+of+her+communion%2C+the+danger+of+eternal+perdition+is+rather+to+those+who+are+found+within+her+pale.%0A%0AIt+is+not+doubted%2C+indeed%2C+that+there+are+many+pious+individuals+within+that+pale%3B+but+it+is+believed+that+they+are+placed+in+circumstances+deplorably+unfavourable+to+their+growth+in+grace%3B+and+that+the+multitudes+around+them%2C+in+the+same+communion%2C+are+immersed+in+darkness%2C+superstition%2C+and+dreadful+error%2C+which+place+them+in+the+utmost+jeopardy+of+eternal+perdition.+This+is+that+%E2%80%9CAntichrist%2C%E2%80%9D+that+%E2%80%9CMan+of+sin%2C%E2%80%9D+and+%E2%80%9CSon+of+Perdition%2C%E2%80%9D+who+exalteth+himself+above+all+that+is+called+God%2C+and+who+is+yet+to+be+%E2%80%9Cdestroyed+with+the+breath+of+Jehovah%E2%80%99s+mouth%2C+and+with+the+brightness+of+his+coming.%E2%80%9D%0A%0A%E2%80%94+Samuel+Miller%2C+Presbyterianism%3A+The+Truly+Primitive+and+Apostolic+Constitution+of+the+Church+of+Christ%2C+%28Philadelphia+PA%3A+Presbyterian+Tract+and+Sunday+School+Society%2C+1836%29%2C+p.+6.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9c0fdfa1ba.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9c0fdfa1ba.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/05/22/samuel-miller-is-rome-the-catholic-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>We will call then the true and pure Churches all those wherein we find the Word of God and sacraments purely and lawfully administered, that is to say (as Cyprian says) according to the institution of the Lord. And we nothing doubt to communicate with them, and that God is there president, howsoever in some certain points of doctrine there have been some error, and in the outward policy some abuse and corruption, and impurity in manners: for it behooves that always we resort thither, when the chief points of the foundation of our salvation be there truly taught, seeing we are men, and the Churches are compounded of men…</p></blockquote>

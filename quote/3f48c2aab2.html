<blockquote><p>As the king is obliged to God for the maintenance of true religion, so are the people and princes no less in their place obliged to maintain true religion; for the people are rebuked because they burn incense in all high places, 2 Kings 17:11; 2 Chron. 33:17; Hos. 4:13. And the reason why the high places are not taken away is given in 2 Chron. 20:33, for as yet the people “had not prepared their heart unto the God of their fathers;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74d20fc2b2" data-kw="">
<blockquote><p>I find her Majesty’s [Queen Elizabeth I’s] proceedings to have been grounded upon two principles. The one, that consciences are not to be forced, but to be won and reduced by force of truth, with the aid of time, and use of all good means of instruction and persuasion. The other, that causes of consciences when they exceed their bounds, and grow to be matter of faction, loose their nature, and that soveriegn princes ought distinctly to punish their practices and contempt, though colored with the pretence of conscience and religion. According to these principles, her majesty at her coming to the crown, utterly disliking the tyranny of Rome, which had used by terror and rigor to settle commandments of men’s faiths and consciences. Though as a princess of great wisdom and magnanimity, she suffered but the exercise of one religion; yet her proceedings towards the Papists, was with great lenity: expecting the good effects which time might work in them… her Majesty not liking to make windows into men’s hearts and secret thoughts, except the abundance of them did overflow into overt and express acts or affirmations, tempered her law so… and that… the humors of most Papists were altered, and that they were no more Papists in conscience, and of softness, but Papists in faction: Then were there new laws made for the punishment of such as should submit themselves to such reconcilements, or renunciation of obedience… For the other party, which have been offensive to the State, though in another degree, which named themselves Reformers, and we commonly call ‘Puritans,’ this has been the proceeding towards them: A great while, when they inveighed against such abuses in the Church as pluralities [of benefices], non-residence [of ministers] and the like, their zeal was not condemned, only their violence was sometime censured. When they refused the use of some ceremonies and rites, as superstitious, they were tolerated with much connivancy and gentleness; yea, when they called in question the superiority of bishops, and pretended to a democracy into the Church [many were congregationalists]; yet their propositions were here considered, and by contrary writings debated and discussed. Yet all this while, it was perceived that their course was dangerous and very popular: as because Papistry was odious, therefore it was ever in their mouths that they sought to purge the Church from the relics of Papistry; a thing acceptable to the people, who love ever to run from one extreme to another. Because multitude of rogues and poverty was an eye-sore, and a dislike to every man; therefore they put into the people’s head that if discipline were planted, there should be no vagabonds nor beggars, a thing very plausible: and in like manner they promised the people many of the impossible wonders of their discipline; besides, they opened to the people a way to government by their consistory and presbytery [through ruling elders]; a thing, though in consequence no less prejudicial to the liberties of private men, than to the sovereignty of princes; yet in first show very popular. Nevertheless this, except it were in some few that entered into extreme contempt, was born with, because they pretended in dutiful manner to make propositions, and to leave it to the providence of God, and the authority of the magistrate. But now of later years, when there issued from them that affirmed the consent of the magistrate was not to be attended; when under pretense of a confession, to avoid slander and imputations, they combined themselves by classes and subscriptions, when they descended into that vile and base means of defacing the government of the Church, by ridiculous pasquils [works of satire], when they begun to make many subjects in doubt to take oaths, which is one of the fundamental parts of justice in this land, and in all places; when they began both to vaunt of their strength and number of their partisans and followers, and to use cominations [threatenings] that their cause would prevail, through uproar and violence, then it appeared to be no more zeal, no more conscience, but mere faction and division: and therefore though the State were compelled to hold somewhat a harder hand to retrain them than before, yet was it with as great moderation, as the peace of the State or Church could permit. And therefore, sir, to conclude, consider uprightly of these matters, and you shall see her Majesty is no more a temporizer in religion: It is not the success abroad, nor the change of servants here at home, can alter her; only as the things themselves alter, she applied her religious wisdom to methods correspondent unto them; still retaining the two rules before mentioned, in dealing tenderly with consciences, and yet in discovering faction from conscience, and softness from singularity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-walsingham.html">Francis Walsingham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Monsier Critoy, in Gilbert Burnet, The History of the Reformation of the Church of England 2nd ed. (London: T.H., 1683), vol. 2, pt. 2, bk. 3, pp. 418-20 Walsingham (c. 1532 – 1590) was principal secretary to Queen Elizabeth I of England from 1573 till his death.</cite></span></figcaption>

<blockquote><p>XXXVII… It is no schism to preach and gather churches, and elect and ordain pastors and assemble for God’s worship against the laws and will of heathen, Mahometan or infidel princes that forbid it. For thus did the Christians for 300 years [in the Early Church]. And if there be the same cause and need, it is no more schism to do it against the laws and will of a Christian prince, because: 1. Christ’s laws are equally obligatory, 2. Souls [are] equally precious, 3. The gospel and God’s worship equally necessary, 4. And his Christianity enables him not to do more hurt than a pagan may do, but more good. If therefore, either out of ungodly enmity to his own profession or for fear of displeasing his wicked or infidel subjects, he should forbid Christian churches, he is not to be therein obeyed. XXXVIII… If a prince (heathen, infidel or Christian) forbid God’s commanded worship and any commanded part of the pastor’s office (as in Papists’ kingdoms, prayer in a known tongue and the cup in the Lord’s Supper is forbidden, and as they say, all preaching save the reading of liturgies and homilies is forbidden in Moscovy [Russia], and as the use of the keys is elsewhere forbidden), it is no schism to disobey such laws (what prudence may pro hic et nunc [‘for here and now’] require of any single person, we now determine not). … XLIII… 2. No man has his power to destruction, but to edification. The bonum publicum [public good] is the end of government… 3. Every man (especially experienced Christians) have more sense and knowledge of what is profitable and congruous to them than standers-by have, how learned soever: As ignorance makes a few, short, plain, oft repeated words in a familiar style more profitable to low-bred persons than an accurate learned discourse would be, so men’s several tempers and vices makes that matter and manner of preaching profitable to them which to others seems otherwise; And as a nice lady must not tie her family of laboring persons to the matter and measure of her diet, nor revile them as gluttons or fools if they like it not: [So] no more must learned men confine plain people to wordy orations (whether learned or pedantic) and say, ‘This is best for them’. Much less must they silence causlessly such teachers as truly profit them, or tie them to homilies or liturgies only and say, ‘Here is as much as is necessary to salvation.’ Nor is it any schism in the people if they refuse to be so confined by them and denied such helps to their salvation as God has sent them and made their due. 4. Order is an excellent means of edification and of preserving truth, charity and peace, but it is but a means to the ends of the things ordered and the public good. Therefore if order should be made the advantage of heresy, Church-tyranny or iniquity, and be turned against the good of Church and souls (as it is in the policy of the Roman Church and in well ordered armies of rebels or such as have unlawful wars), this would make it no schism or sin to break such order. … LI. Objection 2: If there be able preachers in one part of the parishes, and the other part have such as deliver all that is necessary to salvation intelligibly, it is unlawful to preach against the will of the prince or prelates in such a country. Answer: We deny this unproved assertion… they should be thankful for so much [of that preaching, done against the will of the prince or prelates] and gladly accept it in such churches when they can have no better. But [it is] not [the case]: 1. That it is in the power of any man justly to forbid them better when God provides it; 2. Nor that they must obey such a prohibition, as such (though prudence may discern forbearance to be a duty by accident when the hurt would be greater than the good). … LIII. Objection 3: But the hurt of the people’s choosing teachers and assemblies without or against the ruler’s will is greater than the hurt that comes by the want [lack] of better teachers. Answer: 1. The people’s choice does hurt by accident, in those countries where the rulers put down necessary helps and where the people are erroneous, heretical and unruly, and so where the people would choose unsufferable men, supposing still that… the rulers alter not or violate not Christ’s laws by which He has appointed the ordering of assemblies; Therefore it is the ruler’s office to hinder the people from doing mischief, without hindering them from their duty and from doing well; to govern them in their work, and not to forbid it. 2… without holiness none shall see God, Heb. 12:14… It is not then easy to think of a greater hurt than to forbid men such means, without which experience assures us that few comparatively are thus enlightened and renewed to God, and with which more comparatively are renewed. To say that God can bless to us an ignorant heartless, carnal teacher, is no answer while experience certifies us that comparatively He does not do it. If the people would choose such pastors, rulers must do their best to change their minds and to provide better for them. But that’s not the case that we are now speaking to. If people would run into sects and heresies, rulers may punish and restrain false teachers that dangerously corrupt the Christian doctrine and seduce the people’s souls. But they may not therefore silence the faithful ministers of Christ; and adhering to such ministers does not any hurt of itself, nor any way tend to the furthering of so much hurt as the contrary would do. 3. For who knows where to bound his obedience to such silencers as aforesaid… if 1,000 or 2,000 or 3,000 parishes must choose the apparent hazard of their souls and refuse such helps as experience certifies us they greatly need, in obedience to man, why must not the rest of the parishes do so also? May I give away the needful helps to my salvation because others have them, as if their salvation might satisfy me instead of my own? 4… the old saying is true (owned even by the Papists, see Pet. De Marc•, De Eccl. Const.) that Ecclesia est in imperio [‘The Church is in the empire’, and therefore not usually of equal extent with it, and hence the Church needs to grow]… And the Temple [church building] is a prison and not a Church [so far] as men are there forcibly driven against their wills… Yet constraining the ignorant and heretical to hear sound teachers we are far from opposing. But when Paul has said [that there be the qualification for ministers:] ‘Not a novice,’ [1 Tim. 3:6] if rulers will silence better teachers and set up novices that are unskilful in that great and sacred work, and never felt that work of faith, love, and heavenliness on their own souls which they must preach to others, this will do more hurt than the people’s choice of better men. … … LX… He is not the physician whom we can trust that does not cure men… … LXII. If the people, conscious of their great necessity of pastoral oversight and help, and of Christ’s command to use it, do live in a parish or country where they cannot have it from those that the magistrate allows, either because they cannot perform it for them or because they will not: it is no schism for such to seek and use it from worthy, though prohibited men. We before spake of the schisms of teachers, and now [we will speak] of hearers… In several cases the people may possibly be [unfortunately] deprived of this [pastoral oversight]… 1. When public pastors are at so great a distance from them as that such pastors cannot come to them, nor they and their families go so far without such inconvenience and trouble as will frustrate the end of their endeavors: As in France where the Protestants must go twenty miles or ten to a church, which the weak, children and aged cannot do, nor the rest of the family without such cost and pains, and loss of time as will deprive them of the benefit… 2. Where parishes are so great that the allowed pastors cannot preach to half or a fourth or tenth part of the people, and cannot visit half the sick, and baptize, and administer the Lord’s Supper as is necessary, and have not time if the ignorant and doubting, and troubled persons should come to them for counsel, resolution or comfort… 3. Where the allowed pastors are so slothful or proud that they will not condescend to these offices of personal help to many thousands, especially of the poor. 4. Where they are young raw men, or ignorant of such matters, unable to counsel people as their necessities require, in order to their salvation… 5. Where they are so profane and malignant that if poor people come to them with cases of conscience, or for counsel what they must do to be saved, they will but deride them as scrupulous and precise, and make them believe that to be solicitous about salvation and afraid of sinning, and seriously godly, is but to be hypocrites, melancholy or mad… 6. When they are heretical and not to be trusted in point of faith. 7. And when they are so factious and schismatical as that their preaching and conference tends to render other good Christians odious, and stir up men to hate, persecute or separate from them, and so to destroy true love and concord. In any of these cases when the people or part of them are deprived of those pastoral helps which their necessity requires, and God commands, they may seek it where they can best have it. LXIII. In all these cases it is an unsatisfactory answer to tell them that religion is kept up in the land and that other persons or parishes have what they want, or that order and obedience must be preferred to their supply, or that God can save them without a pastor, etc. For so God can save the heathen world without the Gospel preached if He please: And so you might persuade the poor to famish rather than [go] against law to beg, because if thousands of them die of famine, yet other people are supplied and have plenty: Or you might tell men that they must use no physician, though they die for it, if they have no tolerable one allowed them by the magistrate, because others have physicians… What if the parish priest could baptize but one of many (or not all)? Must the rest be content to be unbaptized? If not, why must they be content without all public preaching and worshipping of God, and the Lord’s Supper, and personal helps of pastors which they need? LXIV. Yet here we must declare: 1. That in such necessity people must, caeteris paribus [‘other things being equal’], first seek their supply in that way that is most for peace and most for public good, and least scandalous or dividing, and that is most agreable to the ruler’s will and honour. 2. That for some short season in which his soul is not apparently hazarded, as also in the tolerable loss of some measures of pastoral help, a man must submit his own personal advantage to public interest and may hope that God will make it up. As also when it tends to his probable greater advantage afterward by putting by some present storm: But not statedly, to be without Christ’s instituted ordinances and helps. For example, parish order is desireable and is the ruler’s will: If therefore supply can be had in a neighbor parish for them that want [lack] it in their own, and by an allowed minister rather than a disallowed, it should be chosen, unless the disparity be so great as to weigh down the contrary inconveniences. And if for a time any be constrained to another way, they should do it but as an extraordinary necessity for the present time till they can be supplied in the allowed parochial way; and avoid as much as possibly they can all ways, though lawful, that encourage true schisms. 3. And we must profess that if any preachers or people shall out of self conceitedness pretend necessity when there is none, their pretence is no justification of their disorder or disobedience. Magistrates may regulate us in the circumstances of those duties which the Law of Nature or the Gospel [in an established Christian nation] do command: But if on such pretence of regulating circumstances, they will violate or contradict either the Law of Nature or the Gospel, and destroy the duty itself or its end, we are not bound in such cases to obey them, but must pariently suffer. … LXVI… 4. Cyprian’s conclusion before mentioned is known, inviting the people to forsake a bad pastor, Plebs maximam habet potestatem [‘The people have the greatest power’], etc. And he convinces the people that if they forsake not such they are guilty. … 6. The [English] law or canon forbids it to no man in England to desert men, sobeit they will but remove their dwelling into another parish, which is an extrinsic circumstance of human order… LXVII… God will have mercy rather than sacrifice [Hos. 6:6], and prefers men’s salvation to ceremony or Church laws. … LXIX… Where under any of the foresaid unjust prohibitions the silenced ministers and people shall gather no distinct churches, but only auditories or chapels as parts of the parish churches, and that only where there is (through the bigness of the parish or distance from the parish church, or paucity, or insufficiency, or unfaithfulness of parish priests) a true necessity, not unchurching or separating from the parish Church, but owning it and holding communion with it, and promoting the reputation of the true parish minister and communion, and persuading others to the like, we cannot see that this is any schism; but rather their practise [is schismatic] who fire and divide men’s minds by envious clamors against the innocent, and [who be] proudly calling others schismatic. LXX… we hold that gentle forbearing [of] tolerable differences, even in distinct churches guilty of schism, so they be kept from unpeaceable reviling of others, is a meeter way to avoid the mischiefs than with prison, sword or fire to exasperate them. It is noted that Nestorius the heretic was the first sharp persecutor of the Novatians: But most of the better bishops tolerated them, as did the emperors: And two prudent gentle bishops of Constantinople, Atticus and Proclus, reduced the Joannites and lenified other divided parties, which the flercer men had made and kept up by their violence.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XXXVII… It is no schism to preach and gather churches, and elect and ordain pastors and assemble for God’s worship against the laws and will of heathen, Mahometan or infidel princes that forbid it. For thus did the Christians for 300 years [in the Early Church]. And if there be the same cause and need, it is no more schism to do it against the laws and will of a Christian prince, because: 1. Christ’s laws are equally obligatory, 2. Souls [are] equally precious, 3. The gospel and God’s worship equally necessary, 4. And his Christianity enables him not to do more hurt than a pagan may do, but more good. If therefore, either out of ungodly enmity to his own profession or for fear of displeasing his wicked or infidel subjects, he should forbid Christian churches, he is not to be therein obeyed. XXXVIII… If a prince (heathen, infidel or Christian) forbid God’s commanded worship and any commanded part of the pastor’s office (as in Papists’ kingdoms, prayer in a known tongue and the cup in the Lord’s Supper is forbidden, and as they say, all preaching save the reading of liturgies and homilies is forbidden in Moscovy [Russia], and as the use of the keys is elsewhere forbidden), it is no schism to disobey such laws (what prudence may pro hic et nunc [‘for here and now’] require of any single person, we now determine not). … XLIII… 2. No man has his power to destruction, but to edification. The bonum publicum [public good] is the end of government… 3. Every man (especially experienced Christians) have more sense and knowledge of what is profitable and congruous to them than standers-by have, how learned soever: As ignorance makes a few, short, plain, oft repeated words in a familiar style more profitable to low-bred persons than an accurate learned discourse would be, so men’s several tempers and vices makes that matter and manner of preaching profitable to them which to others seems otherwise; And as a nice lady must not tie her family of laboring persons to the matter and measure of her diet, nor revile them as gluttons or fools if they like it not: [So] no more must learned men confine plain people to wordy orations (whether learned or pedantic) and say, ‘This is best for them’. Much less must they silence causlessly such teachers as truly profit them, or tie them to homilies or liturgies only and say, ‘Here is as much as is necessary to salvation.’ Nor is it any schism in the people if they refuse to be so confined by them and denied such helps to their salvation as God has sent them and made their due. 4. Order is an excellent means of edification and of preserving truth, charity and peace, but it is but a means to the ends of the things ordered and the public good. Therefore if order should be made the advantage of heresy, Church-tyranny or iniquity, and be turned against the good of Church and souls (as it is in the policy of the Roman Church and in well ordered armies of rebels or such as have unlawful wars), this would make it no schism or sin to break such order. … LI. Objection 2: If there be able preachers in one part of the parishes, and the other part have such as deliver all that is necessary to salvation intelligibly, it is unlawful to preach against the will of the prince or prelates in such a country. Answer: We deny this unproved assertion… they should be thankful for so much [of that preaching, done against the will of the prince or prelates] and gladly accept it in such churches when they can have no better. But [it is] not [the case]: 1. That it is in the power of any man justly to forbid them better when God provides it; 2. Nor that they must obey such a prohibition, as such (though prudence may discern forbearance to be a duty by accident when the hurt would be greater than the good). … LIII. Objection 3: But the hurt of the people’s choosing teachers and assemblies without or against the ruler’s will is greater than the hurt that comes by the want [lack] of t if on such pretence of regulating circumstances, they will violate or contradict either the Law of Nature or the Gospel, and destroy the duty itself or its end, we are not bound in such cases to obey them, but must pariently suffer. … LXVI… 4. Cyprian’s conclusion before mentioned is known, inviting the people to forsake a bad pastor, Plebs maximam habet potestatem [‘The people have the greatest power’], etc. And he convinces the people that if they forsake not such they are guilty. … 6. The [English] law or canon forbids it to no man in England to desert men, sobeit they will but remove their dwelling into another parish, which is an extrinsic circumstance of human order… LXVII… God will have mercy rather than sacrifice [Hos. 6:6], and prefers men’s salvation to ceremony or Church laws. … LXIX… Where under any of the foresaid unjust prohibitions the silenced ministers and people shall gather no distinct churches, but only auditories or chapels as parts of the parish churches, and that only where there is (through the bigness of the parish or distance from the parish church, or paucity, or insufficiency, or unfaithfulness of parish priests) a true necessity, not unchurching or separating from the parish Church, but owning it and holding communion with it, and promoting the reputation of the true parish minister and communion, and persuading others to the like, we cannot see that this is any schism; but rather their practise [is schismatic] who fire and divide men’s minds by envious clamors against the innocent, and [who be] proudly calling others schismatic. LXX… we hold that gentle forbearing [of] tolerable differences, even in distinct churches guilty of schism, so they be kept from unpeaceable reviling of others, is a meeter way to avoid the mischiefs than with prison, sword or fire to exasperate them. It is noted that Nestorius the heretic was the first sharp persecutor of the Novatians: But most of the better bishops tolerated them, as did the emperors: And two prudent gentle bishops of Constantinople, Atticus and Proclus, reduced the Joannites and lenified other divided parties, which the flercer men had made and kept up by their violence.”

— Richard Baxter, Gathering of Separate Churches | The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), sect. 6, pp. 47-49 &amp; 51-58, 85, 100-2, 118 | When Gathering of Separate Worship Assemblies or Churches is Lawful or Necessary">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXXXVII%E2%80%A6+It+is+no+schism+to+preach+and+gather+churches%2C+and+elect+and+ordain+pastors+and+assemble+for+God%E2%80%99s+worship+against+the+laws+and+will+of+heathen%2C+Mahometan+or+infidel+princes+that+forbid+it.+For+thus+did+the+Christians+for+300+years+%5Bin+the+Early+Church%5D.+And+if+there+be+the+same+cause+and+need%2C+it+is+no+more+schism+to+do+it+against+the+laws+and+will+of+a+Christian+prince%2C+because%3A+1.+Christ%E2%80%99s+laws+are+equally+obligatory%2C+2.+Souls+%5Bare%5D+equally+precious%2C+3.+The+gospel+and+God%E2%80%99s+worship+equally+necessary%2C+4.+And+his+Christianity+enables+him+not+to+do+more+hurt+than+a+pagan+may+do%2C+but+more+good.+If+therefore%2C+either+out+of+ungodly+enmity+to+his+own+profession+or+for+fear+of+displeasing+his+wicked+or+infidel+subjects%2C+he+should+forbid+Christian+churches%2C+he+is+not+to+be+therein+obeyed.+XXXVIII%E2%80%A6+If+a+prince+%28heathen%2C+infidel+or+Christian%29+forbid+God%E2%80%99s+commanded+worship+and+any+commanded+part+of+the+pastor%E2%80%99s+office+%28as+in+Papists%E2%80%99+kingdoms%2C+prayer+in+a+known+tongue+and+the+cup+in+the+Lord%E2%80%99s+Supper+is+forbidden%2C+and+as+they+say%2C+all+preaching+save+the+reading+of+liturgies+and+homilies+is+forbidden+in+Moscovy+%5BRussia%5D%2C+and+as+the+use+of+the+keys+is+elsewhere+forbidden%29%2C+it+is+no+schism+to+disobey+such+laws+%28what+prudence+may+pro+hic+et+nunc+%5B%E2%80%98for+here+and+now%E2%80%99%5D+require+of+any+single+person%2C+we+now+determine+not%29.+%E2%80%A6+XLIII%E2%80%A6+2.+No+man+has+his+power+to+destruction%2C+but+to+edification.+The+bonum+publicum+%5Bpublic+good%5D+is+the+end+of+government%E2%80%A6+3.+Every+man+%28especially+experienced+Christians%29+have+more+sense+and+knowledge+of+what+is+profitable+and+congruous+to+them+than+standers-by+have%2C+how+learned+soever%3A+As+ignorance+makes+a+few%2C+short%2C+plain%2C+oft+repeated+words+in+a+familiar+style+more+profitable+to+low-bred+persons+than+an+accurate+learned+discourse+would+be%2C+so+men%E2%80%99s+several+tempers+and+vices+makes+that+matter+and+manner+of+preaching+profitable+to+them+which+to+others+seems+otherwise%3B+And+as+a+nice+lady+must+not+tie+her+family+of+laboring+persons+to+the+matter+and+measure+of+her+diet%2C+nor+revile+them+as+gluttons+or+fools+if+they+like+it+not%3A+%5BSo%5D+no+more+must+learned+men+confine+plain+people+to+wordy+orations+%28whether+learned+or+pedantic%29+and+say%2C+%E2%80%98This+is+best+for+them%E2%80%99.+Much+less+must+they+silence+causlessly+such+teachers+as+truly+profit+them%2C+or+tie+them+to+homilies+or+liturgies+only+and+say%2C+%E2%80%98Here+is+as+much+as+is+necessary+to+salvation.%E2%80%99+Nor+is+it+any+schism+in+the+people+if+they+refuse+to+be+so+confined+by+them+and+denied+such+helps+to+their+salvation+as+God+has+sent+them+and+made+their+due.+4.+Order+is+an+excellent+means+of+edification+and+of+preserving+truth%2C+charity+and+peace%2C+but+it+is+but+a+means+to+the+ends+of+the+things+ordered+and+the+public+good.+Therefore+if+order+should+be+made+the+advantage+of+heresy%2C+Church-tyranny+or+iniquity%2C+and+be+turned+against+the+good+of+Church+and+souls+%28as+it+is+in+the+policy+of+the+Roman+Church+and+in+well+ordered+armies+of+rebels+or+such+as+have+unlawful+wars%29%2C+this+would+make+it+no+schism+or+sin+to+break+such+order.+%E2%80%A6+LI.+Objection+2%3A+If+there+be+able+preachers+in+one+part+of+the+parishes%2C+and+the+other+part+have+such+as+deliver+all+that+is+necessary+to+salvation+intelligibly%2C+it+is+unlawful+to+preach+against+the+will+of+the+prince+or+prelates+in+such+a+country.+Answer%3A+We+deny+this+unproved+assertion%E2%80%A6+they+should+be+thankful+for+so+much+%5Bof+that+preaching%2C+done+against+the+will+of+the+prince+or+prelates%5D+and+gladly+accept+it+in+such+churches+when+they+can+have+no+better.+But+%5Bit+is%5D+not+%5Bthe+case%5D%3A+1.+That+it+is+in+the+power+of+any+man+justly+to+forbid+them+better+when+God+provides+it%3B+2.+Nor+that+they+must+obey+such+a+prohibition%2C+as+such+%28though+prudence+may+discern+forbearance+to+be+a+duty+by+accident+when+the+hurt+would+be+greater+than+the+good%29.+%E2%80%A6+LIII.+Objection+3%3A+But+the+hurt+of+the+people%E2%80%99s+choosing+teachers+and+assemblies+without+or+against+the+ruler%E2%80%99s+will+is+greater+than+the+hurt+that+comes+by+the+want+%5Black%5D+of+better+teachers.+Answer%3A+1.+The+people%E2%80%99s+choice+does+hurt+by+accident%2C+in+those+countries+where+the+rulers+put+down+necessary+helps+and+where+the+people+are+erroneous%2C+heretical+and+unruly%2C+and+so+where+the+people+would+choose+unsufferable+men%2C+supposing+still+that%E2%80%A6+the+rulers+alter+not+or+violate+not+Christ%E2%80%99s+laws+by+which+He+has+appointed+the+ordering+of+assemblies%3B+Therefore+it+is+the+ruler%E2%80%99s+office+to+hinder+the+people+from+doing+mischief%2C+without+hindering+them+from+their+duty+and+from+doing+well%3B+to+govern+them+in+their+work%2C+and+not+to+forbid+it.+2%E2%80%A6+without+holiness+none+shall+see+God%2C+Heb.+12%3A14%E2%80%A6+It+is+not+then+easy+to+think+of+a+greater+hurt+than+to+forbid+men+such+means%2C+without+which+experience+assures+us+that+few+comparatively+are+thus+enlightened+and+renewed+to+God%2C+and+with+which+more+comparatively+are+renewed.+To+say+that+God+can+bless+to+us+an+ignorant+heartless%2C+carnal+teacher%2C+is+no+answer+while+experience+certifies+us+that+comparatively+He+does+not+do+it.+If+the+people+would+choose+such+pastors%2C+rulers+must+do+their+best+to+change+their+minds+and+to+provide+better+for+them.+But+that%E2%80%99s+not+the+case+that+we+are+now+speaking+to.+If+people+would+run+into+sects+and+heresies%2C+rulers+may+punish+and+restrain+false+teachers+that+dangerously+corrupt+the+Christian+doctrine+and+seduce+the+people%E2%80%99s+souls.+But+they+may+not+therefore+silence+the+faithful+ministers+of+Christ%3B+and+adhering+to+such+ministers+does+not+any+hurt+of+itself%2C+nor+any+way+tend+to+the+furthering+of+so+much+hurt+as+the+contrary+would+do.+3.+For+who+knows+where+to+bound+his+obedience+to+such+silencers+as+aforesaid%E2%80%A6+if+1%2C000+or+2%2C000+or+3%2C000+parishes+must+choose+the+apparent+hazard+of+their+souls+and+refuse+such+helps+as+experience+certifies+us+they+greatly+need%2C+in+obedience+to+man%2C+why+must+not+the+rest+of+the+parishes+do+so+also%3F+May+I+give+away+the+needful+helps+to+my+salvation+because+others+have+them%2C+as+if+their+salvation+might+satisfy+me+instead+of+my+own%3F+4%E2%80%A6+the+old+saying+is+true+%28owned+even+by+the+Papists%2C+see+Pet.+De+Marc%E2%80%A2%2C+De+Eccl.+Const.%29+that+Ecclesia+est+in+imperio+%5B%E2%80%98The+Church+is+in+the+empire%E2%80%99%2C+and+therefore+not+usually+of+equal+extent+with+it%2C+and+hence+the+Church+needs+to+grow%5D%E2%80%A6+And+the+Temple+%5Bchurch+building%5D+is+a+prison+and+not+a+Church+%5Bso+far%5D+as+men+are+there+forcibly+driven+against+their+wills%E2%80%A6+Yet+constraining+the+ignorant+and+heretical+to+hear+sound+teachers+we+are+far+from+opposing.+But+when+Paul+has+said+%5Bthat+there+be+the+qualification+for+ministers%3A%5D+%E2%80%98Not+a+novice%2C%E2%80%99+%5B1+Tim.+3%3A6%5D+if+rulers+will+silence+better+teachers+and+set+up+novices+that+are+unskilful+in+that+great+and+sacred+work%2C+and+never+felt+that+work+of+faith%2C+love%2C+and+heavenliness+on+their+own+souls+which+they+must+preach+to+others%2C+this+will+do+more+hurt+than+the+people%E2%80%99s+choice+of+better+men.+%E2%80%A6+%E2%80%A6+LX%E2%80%A6+He+is+not+the+physician+whom+we+can+trust+that+does+not+cure+men%E2%80%A6+%E2%80%A6+LXII.+If+the+people%2C+conscious+of+their+great+necessity+of+pastoral+oversight+and+help%2C+and+of+Christ%E2%80%99s+command+to+use+it%2C+do+live+in+a+parish+or+country+where+they+cannot+have+it+from+those+that+the+magistrate+allows%2C+either+because+they+cannot+perform+it+for+them+or+because+they+will+not%3A+it+is+no+schism+for+such+to+seek+and+use+it+from+worthy%2C+though+prohibited+men.+We+before+spake+of+the+schisms+of+teachers%2C+and+now+%5Bwe+will+speak%5D+of+hearers%E2%80%A6+In+several+cases+the+people+may+possibly+be+%5Bunfortunately%5D+deprived+of+this+%5Bpastoral+oversight%5D%E2%80%A6+1.+When+public+pastors+are+at+so+great+a+distance+from+them+as+that+such+pastors+cannot+come+to+them%2C+nor+they+and+their+families+go+so+far+without+such+inconvenience+and+trouble+as+will+frustrate+the+end+of+their+endeavors%3A+As+in+France+where+the+Protestants+must+go+twenty+miles+or+ten+to+a+church%2C+which+the+weak%2C+children+and+aged+cannot+do%2C+nor+the+rest+of+the+family+without+such+cost+and+pains%2C+and+loss+of+time+as+will+deprive+them+of+the+benefit%E2%80%A6+2.+Where+parishes+are+so+great+that+the+allowed+pastors+cannot+preach+to+half+or+a+fourth+or+tenth+part+of+the+people%2C+and+cannot+visit+half+the+sick%2C+and+baptize%2C+and+administer+the+Lord%E2%80%99s+Supper+as+is+necessary%2C+and+have+not+time+if+the+ignorant+and+doubting%2C+and+troubled+persons+should+come+to+them+for+counsel%2C+resolution+or+comfort%E2%80%A6+3.+Where+the+allowed+pastors+are+so+slothful+or+proud+that+they+will+not+condescend+to+these+offices+of+personal+help+to+many+thousands%2C+especially+of+the+poor.+4.+Where+they+are+young+raw+men%2C+or+ignorant+of+such+matters%2C+unable+to+counsel+people+as+their+necessities+require%2C+in+order+to+their+salvation%E2%80%A6+5.+Where+they+are+so+profane+and+malignant+that+if+poor+people+come+to+them+with+cases+of+conscience%2C+or+for+counsel+what+they+must+do+to+be+saved%2C+they+will+but+deride+them+as+scrupulous+and+precise%2C+and+make+them+believe+that+to+be+solicitous+about+salvation+and+afraid+of+sinning%2C+and+seriously+godly%2C+is+but+to+be+hypocrites%2C+melancholy+or+mad%E2%80%A6+6.+When+they+are+heretical+and+not+to+be+trusted+in+point+of+faith.+7.+And+when+they+are+so+factious+and+schismatical+as+that+their+preaching+and+conference+tends+to+render+other+good+Christians+odious%2C+and+stir+up+men+to+hate%2C+persecute+or+separate+from+them%2C+and+so+to+destroy+true+love+and+concord.+In+any+of+these+cases+when+the+people+or+part+of+them+are+deprived+of+those+pastoral+helps+which+their+necessity+requires%2C+and+God+commands%2C+they+may+seek+it+where+they+can+best+have+it.+LXIII.+In+all+these+cases+it+is+an+unsatisfactory+answer+to+tell+them+that+religion+is+kept+up+in+the+land+and+that+other+persons+or+parishes+have+what+they+want%2C+or+that+order+and+obedience+must+be+preferred+to+their+supply%2C+or+that+God+can+save+them+without+a+pastor%2C+etc.+For+so+God+can+save+the+heathen+world+without+the+Gospel+preached+if+He+please%3A+And+so+you+might+persuade+the+poor+to+famish+rather+than+%5Bgo%5D+against+law+to+beg%2C+because+if+thousands+of+them+die+of+famine%2C+yet+other+people+are+supplied+and+have+plenty%3A+Or+you+might+tell+men+that+they+must+use+no+physician%2C+though+they+die+for+it%2C+if+they+have+no+tolerable+one+allowed+them+by+the+magistrate%2C+because+others+have+physicians%E2%80%A6+What+if+the+parish+priest+could+baptize+but+one+of+many+%28or+not+all%29%3F+Must+the+rest+be+content+to+be+unbaptized%3F+If+not%2C+why+must+they+be+content+without+all+public+preaching+and+worshipping+of+God%2C+and+the+Lord%E2%80%99s+Supper%2C+and+personal+helps+of+pastors+which+they+need%3F+LXIV.+Yet+here+we+must+declare%3A+1.+That+in+such+necessity+people+must%2C+caeteris+paribus+%5B%E2%80%98other+things+being+equal%E2%80%99%5D%2C+first+seek+their+supply+in+that+way+that+is+most+for+peace+and+most+for+public+good%2C+and+least+scandalous+or+dividing%2C+and+that+is+most+agreable+to+the+ruler%E2%80%99s+will+and+honour.+2.+That+for+some+short+season+in+which+his+soul+is+not+apparently+hazarded%2C+as+also+in+the+tolerable+loss+of+some+measures+of+pastoral+help%2C+a+man+must+submit+his+own+personal+advantage+to+public+interest+and+may+hope+that+God+will+make+it+up.+As+also+when+it+tends+to+his+probable+greater+advantage+afterward+by+putting+by+some+present+storm%3A+But+not+statedly%2C+to+be+without+Christ%E2%80%99s+instituted+ordinances+and+helps.+For+example%2C+parish+order+is+desireable+and+is+the+ruler%E2%80%99s+will%3A+If+therefore+supply+can+be+had+in+a+neighbor+parish+for+them+that+want+%5Black%5D+it+in+their+own%2C+and+by+an+allowed+minister+rather+than+a+disallowed%2C+it+should+be+chosen%2C+unless+the+disparity+be+so+great+as+to+weigh+down+the+contrary+inconveniences.+And+if+for+a+time+any+be+constrained+to+another+way%2C+they+should+do+it+but+as+an+extraordinary+necessity+for+the+present+time+till+they+can+be+supplied+in+the+allowed+parochial+way%3B+and+avoid+as+much+as+possibly+they+can+all+ways%2C+though+lawful%2C+that+encourage+true+schisms.+3.+And+we+must+profess+that+if+any+preachers+or+people+shall+out+of+self+conceitedness+pretend+necessity+when+there+is+none%2C+their+pretence+is+no+justification+of+their+disorder+or+disobedience.+Magistrates+may+regulate+us+in+the+circumstances+of+those+duties+which+the+Law+of+Nature+or+the+Gospel+%5Bin+an+established+Christian+nation%5D+do+command%3A+But+if+on+such+pretence+of+regulating+circumstances%2C+they+will+violate+or+contradict+either+the+Law+of+Nature+or+the+Gospel%2C+and+destroy+the+duty+itself+or+its+end%2C+we+are+not+bound+in+such+cases+to+obey+them%2C+but+must+pariently+suffer.+%E2%80%A6+LXVI%E2%80%A6+4.+Cyprian%E2%80%99s+conclusion+before+mentioned+is+known%2C+inviting+the+people+to+forsake+a+bad+pastor%2C+Plebs+maximam+habet+potestatem+%5B%E2%80%98The+people+have+the+greatest+power%E2%80%99%5D%2C+etc.+And+he+convinces+the+people+that+if+they+forsake+not+such+they+are+guilty.+%E2%80%A6+6.+The+%5BEnglish%5D+law+or+canon+forbids+it+to+no+man+in+England+to+desert+men%2C+sobeit+they+will+but+remove+their+dwelling+into+another+parish%2C+which+is+an+extrinsic+circumstance+of+human+order%E2%80%A6+LXVII%E2%80%A6+God+will+have+mercy+rather+than+sacrifice+%5BHos.+6%3A6%5D%2C+and+prefers+men%E2%80%99s+salvation+to+ceremony+or+Church+laws.+%E2%80%A6+LXIX%E2%80%A6+Where+under+any+of+the+foresaid+unjust+prohibitions+the+silenced+ministers+and+people+shall+gather+no+distinct+churches%2C+but+only+auditories+or+chapels+as+parts+of+the+parish+churches%2C+and+that+only+where+there+is+%28through+the+bigness+of+the+parish+or+distance+from+the+parish+church%2C+or+paucity%2C+or+insufficiency%2C+or+unfaithfulness+of+parish+priests%29+a+true+necessity%2C+not+unchurching+or+separating+from+the+parish+Church%2C+but+owning+it+and+holding+communion+with+it%2C+and+promoting+the+reputation+of+the+true+parish+minister+and+communion%2C+and+persuading+others+to+the+like%2C+we+cannot+see+that+this+is+any+schism%3B+but+rather+their+practise+%5Bis+schismatic%5D+who+fire+and+divide+men%E2%80%99s+minds+by+envious+clamors+against+the+innocent%2C+and+%5Bwho+be%5D+proudly+calling+others+schismatic.+LXX%E2%80%A6+we+hold+that+gentle+forbearing+%5Bof%5D+tolerable+differences%2C+even+in+distinct+churches+guilty+of+schism%2C+so+they+be+kept+from+unpeaceable+reviling+of+others%2C+is+a+meeter+way+to+avoid+the+mischiefs+than+with+prison%2C+sword+or+fire+to+exasperate+them.+It+is+noted+that+Nestorius+the+heretic+was+the+first+sharp+persecutor+of+the+Novatians%3A+But+most+of+the+better+bishops+tolerated+them%2C+as+did+the+emperors%3A+And+two+prudent+gentle+bishops+of+Constantinople%2C+Atticus+and+Proclus%2C+reduced+the+Joannites+and+lenified+other+divided+parties%2C+which+the+flercer+men+had+made+and+kept+up+by+their+violence.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Gathering+of+Separate+Churches+%7C+The+Nonconformists%E2%80%99+Plea+for+Peace%2C+or+an+Account+of+their+Judgment+in+Certain+Things+in+which+they+are+Misunderstood%E2%80%A6+%28London%2C+1679%29%2C+sect.+6%2C+pp.+47-49+%26+51-58%2C+85%2C+100-2%2C+118+%7C+When+Gathering+of+Separate+Worship+Assemblies+or+Churches+is+Lawful+or+Necessary&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F66dab299f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/66dab299f8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=It%20is%20no%20schism%20to%20preach,and%20kept%20up%20by%20their%20violence&amp;text=It%20is%20no%20schism%20to%20preach%20and%20gather&amp;text=had%20made%20and%20kept%20up%20by%20their%20violence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. That by Divine as well as by human right the supreme Magistrate himself is appointed for managing business of this kind. In the Scriptures, 1 Kings 15 and 17, it is the express eulogy of the good kings that they “took away” the high places and removed the “idols”; on the contrary it is the perpetual stigma of the bad ones that they did not take away, did not remove them; 2 Kings 18 and 23… Hence it is evident from whom God expects the Reformation of the Church and of Religion… 2. Secondly, as the authority of reforming the Church is imposed upon kings, so it is removed from the people. For where a vocation is wanting [lacking], although the thing which is done, considered in itself, be laudable, yet there i blame attaching to the agent, on account of the defect of a lawful power. To offer sacrifices to God was in itself pious and religious; but in Saul, who had no call to this office, it was impious and sacrilegious; (1 Sam. 13:13)… Search the sacred Scriptures, you will find the people of God everywhere blamed because they worshipped the golden calves… but never censured by any prophet becaue they did not remove idolatry by force of arms, against the will of their kings. That this work, consequently, does not belong to the people, the prophets have taught by this their silence on the subject… Thirdly… 1… But what then [it may be asked] are those duties?… To beware of bowing down before idols; to avoid heresies, not to extirpate them by force of arms; to bewail the corruptions of the Church, not to remove them; in one word, to endure the severest punishments inflicted by the Magistrate rather than to desert the true religion; not to force the Magistrate to introduce true religion (1 Kings 19; Eze. 9)… ‘Religion certainly should be defended by all private individuals, though not by slaying, but by dying; not by severity, but by patience; not by wickedness, but by faith,’ as Lactantius has admirably said, Institutes 5.20. 2. Moreover, it is not allowable in the people when the magistrate refuses it, to put their hand to this business… For he who undertakes to reform religion when the magistrate is reluctant, first dethrones the magistrate himelf, tramples upon him, and must necessarily reduce him to the common level… cursed are they who stir up rebellion under the cloak of these things. It is a maxim of lawyers… ‘an equal has no power over his equal’: how much less inferior over superior… I thus sum up all: Equity does not allow it; necessity does not require it; utility does not advise it: therefore, it is unlawful for the people, againt the consent of the Magistrate, to attempt the Reformation of the Church.</p></blockquote>

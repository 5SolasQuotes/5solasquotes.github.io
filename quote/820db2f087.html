<main class="wrap"><figure class="quote" id="q-820db2f087" data-kw="">
<blockquote><p>If adversity with roughness were to compel those whose mind cannot be fully drawn by reason given back, it would drive them far away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-of-hales.html">Alexander of Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sum of Universal Theology (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 1 | ch. 3, ‘Whether Jews are to be Permitted to Observe their Rite in Solemnities and Other Things’ | [Solution]: | To this it must be said that they are to be permitted by a permission of tolerance, as is found in the Extra, Consuluit, where it is said (Decretals, V, tit. 6, c. 7 [n. 21] II, 773): For if they were forbidden (they ought to have as great [liberty] as in the old synagogues they are tolerated in their observances to keep their rites) they would now as it were be compelled to the Faith; but coerced services do not please God. Furthermore, Gregory says:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

</figure><figure class="quote" id="q-c3edeec990" data-kw="">
<blockquote><p>do constantly affirm what I set forth in my Apology, as I remember, whether in my own or the late Queen’s time, that conscience and religion have been the cause of the last extremity of punishment. For however much a man may be addicted to his religion, however much he may openly and constantly profess it, no danger of death will hang over him unless he shall have actually offended against the foreign laws in any act; or shall have been seen to be the very summit of a conspiracy of counsels pernicious to the commonwealth: except only such as relate to sacrifices, and other parts of the Pontifical system, who in transmarine regions insinuate themselves into sacred orders: who have so many conspiracies, so many treasons by them in England, either conceived or instigated or applauded, that from our borders they are driven back under the penalty of destruction. And yet none of them remains in the same thing which you would wish to call holy: that by the single case, being mulcted, death should immediately follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Works, vol. 3, Jesuita Vapulans, or the Castigation of the Notes of Sylvester Petrasancta Loyola’s Sectary, On the Letter of Peter Molinaeus to Balzac (1535), ch. 15 tr. AI by The Faith Received | He answered that the thing with Molinaeus was that this punishment is for all traitors, whether they profess our religion or yours: and rightly he denied that these punishments were on account of religion. You provoked yourself, you say, with the public plates of the Praetorium of London. Well it is, and having believed those fables you fell into the cause. Hear the words of that King James himself, “I,” he says</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

lzac+%281535%29%2C+ch.+15+tr.+AI+by+The+Faith+Received+%7C+He+answered+that+the+thing+with+Molinaeus+was+that+this+punishment+is+for+all+traitors%2C+whether+they+profess+our+religion+or+yours%3A+and+rightly+he+denied+that+these+punishments+were+on+account+of+religion.+You+provoked+yourself%2C+you+say%2C+with+the+public+plates+of+the+Praetorium+of+London.+Well+it+is%2C+and+having+believed+those+fables+you+fell+into+the+cause.+Hear+the+words+of+that+King+James+himself%2C+%E2%80%9CI%2C%E2%80%9D+he+says&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc3edeec990.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c3edeec990.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=do%20constantly%20affirm%20what%20I%20set,being%20mulcted%2C%20death%20should%20immediately%20follow." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-34c90feaa0" data-kw="">
<blockquote><p>earthly votes commend the divine faith, and Christ, destitute of his own virtue, is argued against, while ambition is reconciled to his name. The Church terrifies by exiles and prisons, and forces belief in itself, which was believed by exiles and prisons: it depends on the dignity of those who communicate, by which it is consecrated by the terror of those who persecute; it puts to flight priests, by which it was propagated by the priests who were put to flight: it loves itself, it boasts of the world (let the Jesuit note this and remember the argument of the first chapter of his famous pamphlet) by which Christ could not be, unless the world had hated him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Works, vol. 3, Jesuita Vapulans, or the Castigation of the Notes of Sylvester Petrasancta Loyola’s Sectary, On the Letter of Peter Molinaeus to Balzac (1535), ch. 15 tr. AI by The Faith Received | 13. Something perhaps similar was done long ago (though not in equal measure) by that Church which our Hilary describes against Auxentius, with the same spirit, no doubt, with which yours is now, and was long ago, agitated; “Now,” he says</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/jews-and-muslims.html">Jews and Muslims</a></span></div>

<blockquote><p>we ask you, with all the affection we can, that for the love of God, in view of piety and mercy, and by our intervention, you inflict no danger of death or mutilation upon this most miserable man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Works, vol. 3, Jesuita Vapulans, or the Castigation of the Notes of Sylvester Petrasancta Loyola’s Sectary, On the Letter of Peter Molinaeus to Balzac (1535), ch. 15 tr. AI by The Faith Received | 14. It is agreed among all that the instigators of all persecutions, slaughters, and exquisite tortures against innocent believers, whom these men call heretics, are the Church, as they say; who, to their inhumanity, even add this, that they mock the world with ludicrous spectacles; so that, like Pilate, washing their hands, they say, we are pure from the blood of these men. For after they have judged them heretics, they have handed them over to be punished by the secular arm, as they say, and with a feigned intercession they insult the miserable, and deceive the judges, with this or a similar formula, which is held by Gulielmus Benedict: IC. in the question of homicide. “Lord Judges,” they say</cite></span></figcaption>

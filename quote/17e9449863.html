<main class="wrap"><figure class="quote" id="q-17e9449863" data-kw="">
<blockquote><p>XXVI. What is said by some (“Infants are baptized in the faith of their parents”) does not mean that what is in adults is imputed to infants or answers for infants; both because each one lives by his own faith and because if the parents should be hypocrites, their infants would be excluded from salvation. But the faith of parents bears this relation—that they bring their children to be baptized from the faith by which they believe that the gospel promises belong to them and to their children; again, that by it they obtain the grace of God for their children (?Mk. 7:19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.26.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-655a1793c9" data-kw="">
<blockquote><p>Then, because to whomsoever the promise appertains, to them also belongs the sign, as therefore baptism is bestowed upon infants, is likewise the Supper of the Lord to be administered unto them? Certain of the fathers have thought so, as Cyprian (Sermon 5, De Lapsis [Of Falls]) and Augustine (Lib. de Eccle. dogmat., ch. 52), being moved by these words, Jn. 6:53, ‘Except ye shall eat the flesh of the son of man, and drink his blood, you shall have no life in you.’ But we deny the consequent. For this place speaks not of a sacramental eating, but of a spiritual eating, or of faith, by which the faithful are quickened, which are annexed unto Christ, who offered his body and shed his blood for us. And by this means the flesh of Christ is made unto us meat indeed, and his blood drink indeed. Secondly, that to whomsoever the promise appertains, to them also belongs the sign, is true, but according to the divine determination, appropriated to every sacrament: to wit, so that the sacrament of ingrafting be bestowed as well upon infants as those of years, but upon male children only, and that not before the eighth day, in the old Testament: but in the new, both to the male and female without any prefixed time. But the sacrament of nourishment to them of years only, and that for a certain peculiar end, and the diversity of the circumstance of the action. So the Eucharist hath his proper end, that the death of the Lord should be declared in the public congregation in the using thereof. It is also commanded, that everyone which comes to the Lord’s Supper should examine himself: yea and peculiar actions belong to the external rite, to wit, to eat and to drink, which are not fit for little children. So under the Old Testament circumcision was appointed for infants but the Passover to them only which by reason of their age were able to ask of the signification thereof. Hereupon came those vulgar verses: ‘Ebrius, infamis, erroneus, atque furentes, Cum pueris, Domini non debent sumere corpus.’ ‘To drunkards and thin-famous sort, to men misled and mad: To children, Christ’s body to give, it were an action bad.’</p></blockquote>

</figure><figure class="quote" id="q-c75cdbc07a" data-kw="">
<blockquote><p>The grace which is exhibited in or by the sacraments rightly used, is not conferred by any power in them; neither doth the efficacy of a sacrament depend upon the piety or intention of him that doth administer it: but upon the work of the Spirit, and the word of institution, which contains, together with a precept authorizing the use thereof, a promise of benefit to worthy receivers. … Although it be a great sin to contemn or neglect this ordinance, yet grace and salvation are not so inseparably annexed unto it, as that no person can be regenerated, or saved, without it; or, that all that are baptized are undoubtedly regenerated.</p></blockquote>

</figure><figure class="quote" id="q-53e153ff97" data-kw="">
<blockquote><p>1. It is certain that it is the parents great duty to bring up their children in the nurture and admonition of the Lord.

2. It is certain that God has appointed this to be the means of their actual knowledge, faith and holiness. (Eph. 6:4-5; Col. 3:21; Gen. 18:19; Dt. 6:6-8 &amp; 11:18-20)

3. And God does not appoint such means unnecessarily or in vain: nor may we ordinarily expect his grace but in the use of the means of grace, which He has appointed us to use.

4. It is certain that God’s receiving the children of the faithful is an act of God’s love to the parents as well as the children, and promised as a part of his blessing on themselves. …

6. Even before children are capable of instruction, there are certain duties imposed by God on the parents for their sanctification, viz.:

1. That the parents pray earnestly and believingly for them.

2. That they themselves so live towards God as may invite Him still to bless their children for their sakes, as he did Abraham’s, and usually did to the faithful’s seed. (2nd Commandment; Prov. 20:7)

7. It is certain that the Church ever required parents not only to enter their children into the Covenant, and so to leave them, but to do their after duty for their good, and to pray for them, and educate them according to their Covenant.

8. It is plain that if there were none to promise so to educate them, the Church would not baptize them. And God Himself, who allowed the Israelites, and still allows us, to bring our children into his Covenant, does it on this supposition, that we promise also to go on to do our duty for them, and that we actually do it.

9. All this set together maketh it plain:

1. That God never promises the adult in baptism, though true believers, that He will work in them all graces further by his sanctifying Spirit, let them never so much neglect or resist Him: or that He will absolutely see that they never shall resist Him: nor that the Spirit shall still help them, though they neglect all his means; or that He will keep them from neglecting the means (election may secure this to the elect as such; but the Baptismal Covenant as such secures it not to the baptized, nor to believers as such).

2. And consequently… that the Holy Ghost as your Sanctifier will afford you all necessary help in the use of those means which He has appointed you to receive his help in. …

11. And how dangerously parents may make partial forfeitures of the Spirit’s assistance to their children, and operations on them, by their own sinful lives, and neglect of prayer, and of prudent and holy education, even in particular acts, I fear many believing parents never well considered.

12. Yet is not this forfeiture such as obliges God to deny his Spirit: For He may do with his own, as a free benefactor, as He list; and may have mercy freely, beyond his promise (though not against his Word) on whom He will have mercy. But I say that He that considers the woeful unfaithfulness and neglect of most parents, even the religious, in the great work of holy educating their children, may take the blame of their ungodliness on themselves, and not lay it on Christ or the Spirit who was in Covenant with them as their Sanctifier, seeing He promised but conditionally to give them the sanctifying heavenly influences of his life, light, and love, in their just use of his appointed means, according to their abilities.

13. Also as soon as children come to a little use of reason, they stand conjunctly on their parents’ wills and on their own. As their parents are bound to teach and rule them, so they are bound to learn of them and be ruled by them for their good. And though every sin of a parent or a child be not a total forfeiture of grace, yet both their notable actual sins may justly be punished with a denial of some further help of the Spirit which they grieve and quench.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673) | Question 43, ‘Is the right of the baptized (infants or adult) to the sanctifying operations of the Holy Ghost, now absolute, or suspended on further conditions?…’, pp. 821-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, ... (London: 1673) | Question 43, ‘Is the right of the baptized (infants or adult) to the sanctifying operations of the Holy Ghost, now absolute, or suspended on further conditions?…’, pp. 821-22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+It+is+certain+that+it+is+the+parents+great+duty+to+bring+up+their+children+in+the+nurture+and+admonition+of+the+Lord.+2.+It+is+certain+that+God+has+appointed+this+to+be+the+means+of+their+actual+knowledge%2C+faith+and+holiness.+%28Eph.+6%3A4-5%3B+Col.+3%3A21%3B+Gen.+18%3A19%3B+Dt.+6%3A6-8+%26+11%3A18-20%29+3.+And+God+does+not+appoint+such+means+unnecessarily+or+in+vain%3A+nor+may+we+ordinarily+expect+his+grace+but+in+the+use+of+the+means+of+grace%2C+which+He+has+appointed+us+to+use.+4.+It+is+certain+that+God%E2%80%99s+receiving+the+children+of+the+faithful+is+an+act+of+God%E2%80%99s+love+to+the+parents+as+well+as+the+children%2C+and+promised+as+a+part+of+his+blessing+on+themselves.+%E2%80%A6+6.+Even+before+children+are+capable+of+instruction%2C+there+are+certain+duties+imposed+by+God+on+the+parents+for+their+sanctification%2C+viz.%3A+1.+That+the+parents+pray+earnestly+and+believingly+for+them.+2.+That+they+themselves+so+live+towards+God+as+may+invite+Him+still+to+bless+their+children+for+their+sakes%2C+as+he+did+Abraham%E2%80%99s%2C+and+usually+did+to+the+faithful%E2%80%99s+seed.+%282nd+Commandment%3B+Prov.+20%3A7%29+7.+It+is+certain+that+the+Church+ever+required+parents+not+only+to+enter+their+children+into+the+Covenant%2C+and+so+to+leave+them%2C+but+to+do+their+after+duty+for+their+good%2C+and+to+pray+for+them%2C+and+educate+them+according+to+their+Covenant.+8.+It+is+plain+that+if+there+were+none+to+promise+so+to+educate+them%2C+the+Church+would+not+baptize+them.+And+God+Himself%2C+who+allowed+the+Israelites%2C+and+still+allows+us%2C+to+bring+our+children+into+his+Covenant%2C+does+it+on+this+supposition%2C+that+we+promise+also+to+go+on+to+do+our+duty+for+them%2C+and+that+we+actually+do+it.+9.+All+this+set+together+maketh+it+plain%3A+1.+That+God+never+promises+the+adult+in+baptism%2C+though+true+believers%2C+that+He+will+work+in+them+all+graces+further+by+his+sanctifying+Spirit%2C+let+them+never+so+much+neglect+or+resist+Him%3A+or+that+He+will+absolutely+see+that+they+never+shall+resist+Him%3A+nor+that+the+Spirit+shall+still+help+them%2C+though+they+neglect+all+his+means%3B+or+that+He+will+keep+them+from+neglecting+the+means+%28election+may+secure+this+to+the+elect+as+such%3B+but+the+Baptismal+Covenant+as+such+secures+it+not+to+the+baptized%2C+nor+to+believers+as+such%29.+2.+And+consequently%E2%80%A6+that+the+Holy+Ghost+as+your+Sanctifier+will+afford+you+all+necessary+help+in+the+use+of+those+means+which+He+has+appointed+you+to+receive+his+help+in.+%E2%80%A6+11.+And+how+dangerously+parents+may+make+partial+forfeitures+of+the+Spirit%E2%80%99s+assistance+to+their+children%2C+and+operations+on+them%2C+by+their+own+sinful+lives%2C+and+neglect+of+prayer%2C+and+of+prudent+and+holy+education%2C+even+in+particular+acts%2C+I+fear+many+believing+parents+never+well+considered.+12.+Yet+is+not+this+forfeiture+such+as+obliges+God+to+deny+his+Spirit%3A+For+He+may+do+with+his+own%2C+as+a+free+benefactor%2C+as+He+list%3B+and+may+have+mercy+freely%2C+beyond+his+promise+%28though+not+against+his+Word%29+on+whom+He+will+have+mercy.+But+I+say+that+He+that+considers+the+woeful+unfaithfulness+and+neglect+of+most+parents%2C+even+the+religious%2C+in+the+great+work+of+holy+educating+their+children%2C+may+take+the+blame+of+their+ungodliness+on+themselves%2C+and+not+lay+it+on+Christ+or+the+Spirit+who+was+in+Covenant+with+them+as+their+Sanctifier%2C+seeing+He+promised+but+conditionally+to+give+them+the+sanctifying+heavenly+influences+of+his+life%2C+light%2C+and+love%2C+in+their+just+use+of+his+appointed+means%2C+according+to+their+abilities.+13.+Also+as+soon+as+children+come+to+a+little+use+of+reason%2C+they+stand+conjunctly+on+their+parents%E2%80%99+wills+and+on+their+own.+As+their+parents+are+bound+to+teach+and+rule+them%2C+so+they+are+bound+to+learn+of+them+and+be+ruled+by+them+for+their+good.+And+though+every+sin+of+a+parent+or+a+child+be+not+a+total+forfeiture+of+grace%2C+yet+both+their+notable+actual+sins+may+justly+be+punished+with+a+denial+of+some+further+help+of+the+Spirit+which+they+grieve+and+quench.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+...+%28London%3A+1673%29+%7C+Question+43%2C+%E2%80%98Is+the+right+of+the+baptized+%28infants+or+adult%29+to+the+sanctifying+operations+of+the+Holy+Ghost%2C+now+absolute%2C+or+suspended+on+further+conditions%3F%E2%80%A6%E2%80%99%2C+pp.+821-22&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F53e153ff97.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/53e153ff97.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=1.%20It%20is%20certain%20that%20it,Spirit%20which%20they%20grieve%20and%20quench&amp;text=1.%20It%20is%20certain%20that%20it%20is%20the&amp;text=of%20the%20Spirit%20which%20they%20grieve%20and%20quench" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>We reject the opinion of certain Ubiquitarians [Lutherans], who connect the regenerating power of the Holy Spirit in such a way with the external water in baptism that either it must exist in the water itself or at least can inchoate [begin] regeneration only in the very act of baptism, for this opinion is at variance with all those passages of Scripture in which faith and repentance, and therefore both the root and seed of regeneration, are demanded as a prerequisite in those who are to be baptized.</p></blockquote>

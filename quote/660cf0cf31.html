<blockquote><p>Sundry particular flocks may be called one flock, three ways: … 2. Respectu pabuli [in respect of food]: So Paul Baynes (Diocesan Trial, p. 21) speaking of the Low Countries [Netherlands], where sundry congregations in one city make but one Church, says that the sheep feed together into one common pasture, though they bite not on the same individuall grass.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6aa3248cec" data-kw="">
<blockquote><p>1. A stinted liturgy is in it self lawful. 2. A stinted liturgy in some parts of public holy service is ordinarily necessary. 3. In the parts where it is not of necessity, it may not only be submitted to, but desired when the peace of the Church requires it. 4. There is so great difference between ministers and people, and times, that it may be convenient and eligible to some, at some times, and unfit and not eligible to others, and at other times. 5. The ministers and Churches that earnestly desire it, should not by the magistrate be generally or absolutely forbidden the use of a convenient prescribed liturgy. 6. To prescribe a frame of stinted service, or prayer, etc. and lay a necessity, or the peace of the Church upon it, and to punish, silence, suspend, excommunicate, or reproach the able, peaceable, godly ministers, or people that (justly or unjustly) scruple the using of it, is so great a sin that no conscionable ministers should attempt it or desire it, nor any godly magistrate suffer it. 7. The safest way of composing such a public form is to take it all, for matter and words, out of the Holy Scriptures. 8. Yet is not this of such necessity, but that we may join in it, or use it, if the form of words be not from Scripture. 9. The matter of a common liturgy, in which we expect any general concord, should not be any unnecessary things, much less things doubtfull, or forbidden. 10. Forms of public prayer should not be constantly used by ministers that are able to pray without them: and none else should be admitted ordinarily to the ministry, but such as are able competently to pray without such forms; unless in great necessities of the Church.</p></blockquote>

</figure><figure class="quote" id="q-fdc303688e" data-kw="">
<blockquote><p>We see then how that the tithes which were contained in the law were especially for the people of Israel. And yet notwithstanding the tithes were very common amongst the Heathen, even for kings, princes and noblemen. We see likewise by profane histories, that they were also exacted, and that in some countries they exacted more than in other some… But be as be may, this word ‘Tithe’, or ‘Tenth’, has been a common and ordinary amongst all nations. And all Princes and great men as I have already said, sithens [since] the Gospel was received, have bestowed part of the tithes towards the maintenance of the Ministers of the word, as is very great reason, according to the saying of Saint Paul, “That they which ministered at the Altar in the old Testament were maintained, that they which at this day sacrifice unto God after a more excellent manner,” (1 Cor. 9:9-13) that is, which win souls unto Him, to make of them sacrifices unto his majesty, that they should also be as well provided for and maintained: and although God has not qualified how nor by what manner of revenue they should be maintained, yet is there a law for it. Now then, sith [since] God has been known through the preaching of the Gospel, a Christian order and law has been made for the giving and bestowing of one part of tithes [as opposed to other uses, such as giving to the poor, etc.]. And herein we may see the deceit of the Pope and of his shavelings [def: contemptuous epithet for a tonsured ecclesiastic, i.e. monk]: for, when they handle the law of tithes in their Canons, they take it as if it were transferred to them after that Jesus Christ had put an end unto the priesthood of Levi. All these are very leasings [lies], falsifying the holy scripture, and wickedly corrupting the same. For we see to the contrary, as has been before showed, that it is long ago sithence [since], that it was not known what the paying of tithes was by virtue of the law of Moses, and they were always paid either to the Emperor, or to some other particular great men. But now sith [since] the thing has been so ordained (so therein be no abuse, and to make men believe contrary to all truth, that it came from the holy scripture: but to be taken for a politic law). Let us hold that rule which Saint Paul sets down: to wit, “That we must not [muzzle] the mouth of the ox when he travels to feed us”: and therefore it stands with a far greater reason, that they which preach the doctrine of the gospel, ordained in so excellent an estate, should not be abridged and deprived of their maintenance, but be very well waged. Now as I have already said, when tithes and such like are bestowed unto a good use: we must not so straightly look into the matter, as to ask the cause of why it is so, as many fantastical fellows will, who at this day could be contented to turn the whole world upside down saying, O, it is no time now to pay tithes, for seeing the thing has been so long abused, it is no reason it should any longer continue. Then must we by their laying scrape out all: for they think that Christianity consists in changing the color of the sun and the moon. But if there be anything that is to be amended, as I have said, as if the Papists have brought in any false opinion, let that be utterly abolished. But in the meanwhile, let us hold unto all good ordinance: to wit, let the tithes and all such things that are for the maintenance of the poor, and the Ministers: let these things be reduced to their lawful use, and let not unsatiable wide gullets devour all. Let them not consume them upon their superfluities, in pomps, drunkeness, and other dissolutions: but let them know, that these are holy goods, which ought to be reserved for the use of the Church, as well for the maintenance of the poor as I have already said, as also for the feeding of those which serve God and his people.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We see then how that the tithes which were contained in the law were especially for the people of Israel. And yet notwithstanding the tithes were very common amongst the Heathen, even for kings, princes and noblemen. We see likewise by profane histories, that they were also exacted, and that in some countries they exacted more than in other some… But be as be may, this word ‘Tithe’, or ‘Tenth’, has been a common and ordinary amongst all nations. And all Princes and great men as I have already said, sithens [since] the Gospel was received, have bestowed part of the tithes towards the maintenance of the Ministers of the word, as is very great reason, according to the saying of Saint Paul, “That they which ministered at the Altar in the old Testament were maintained, that they which at this day sacrifice unto God after a more excellent manner,” (1 Cor. 9:9-13) that is, which win souls unto Him, to make of them sacrifices unto his majesty, that they should also be as well provided for and maintained: and although God has not qualified how nor by what manner of revenue they should be maintained, yet is there a law for it. Now then, sith [since] God has been known through the preaching of the Gospel, a Christian order and law has been made for the giving and bestowing of one part of tithes [as opposed to other uses, such as giving to the poor, etc.]. And herein we may see the deceit of the Pope and of his shavelings [def: contemptuous epithet for a tonsured ecclesiastic, i.e. monk]: for, when they handle the law of tithes in their Canons, they take it as if it were transferred to them after that Jesus Christ had put an end unto the priesthood of Levi. All these are very leasings [lies], falsifying the holy scripture, and wickedly corrupting the same. For we see to the contrary, as has been before showed, that it is long ago sithence [since], that it was not known what the paying of tithes was by virtue of the law of Moses, and they were always paid either to the Emperor, or to some other particular great men. But now sith [since] the thing has been so ordained (so therein be no abuse, and to make men believe contrary to all truth, that it came from the holy scripture: but to be taken for a politic law). Let us hold that rule which Saint Paul sets down: to wit, “That we must not [muzzle] the mouth of the ox when he travels to feed us”: and therefore it stands with a far greater reason, that they which preach the doctrine of the gospel, ordained in so excellent an estate, should not be abridged and deprived of their maintenance, but be very well waged. Now as I have already said, when tithes and such like are bestowed unto a good use: we must not so straightly look into the matter, as to ask the cause of why it is so, as many fantastical fellows will, who at this day could be contented to turn the whole world upside down saying, O, it is no time now to pay tithes, for seeing the thing has been so long abused, it is no reason it should any longer continue. Then must we by their laying scrape out all: for they think that Christianity consists in changing the color of the sun and the moon. But if there be anything that is to be amended, as I have said, as if the Papists have brought in any false opinion, let that be utterly abolished. But in the meanwhile, let us hold unto all good ordinance: to wit, let the tithes and all such things that are for the maintenance of the poor, and the Ministers: let these things be reduced to their lawful use, and let not unsatiable wide gullets devour all. Let them not consume them upon their superfluities, in pomps, drunkeness, and other dissolutions: but let them know, that these are holy goods, which ought to be reserved for the use of the Church, as well for the maintenance of the poor as I have already said, as also for the feeding of those which serve God and his people.”

— John Calvin, ‘The Third Sermon of Melchisedech, wherein is treated of the use and right of tithes, and also of an oath’, pp. 64-68 on Gen. 14:20-24 in Sermons on Melchizedek &amp; Abraham, Justification, Faith &amp; Obedience (1592; rep. Old Paths Publications: 2000)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+see+then+how+that+the+tithes+which+were+contained+in+the+law+were+especially+for+the+people+of+Israel.+And+yet+notwithstanding+the+tithes+were+very+common+amongst+the+Heathen%2C+even+for+kings%2C+princes+and+noblemen.+We+see+likewise+by+profane+histories%2C+that+they+were+also+exacted%2C+and+that+in+some+countries+they+exacted+more+than+in+other+some%E2%80%A6+But+be+as+be+may%2C+this+word+%E2%80%98Tithe%E2%80%99%2C+or+%E2%80%98Tenth%E2%80%99%2C+has+been+a+common+and+ordinary+amongst+all+nations.+And+all+Princes+and+great+men+as+I+have+already+said%2C+sithens+%5Bsince%5D+the+Gospel+was+received%2C+have+bestowed+part+of+the+tithes+towards+the+maintenance+of+the+Ministers+of+the+word%2C+as+is+very+great+reason%2C+according+to+the+saying+of+Saint+Paul%2C+%E2%80%9CThat+they+which+ministered+at+the+Altar+in+the+old+Testament+were+maintained%2C+that+they+which+at+this+day+sacrifice+unto+God+after+a+more+excellent+manner%2C%E2%80%9D+%281+Cor.+9%3A9-13%29+that+is%2C+which+win+souls+unto+Him%2C+to+make+of+them+sacrifices+unto+his+majesty%2C+that+they+should+also+be+as+well+provided+for+and+maintained%3A+and+although+God+has+not+qualified+how+nor+by+what+manner+of+revenue+they+should+be+maintained%2C+yet+is+there+a+law+for+it.+Now+then%2C+sith+%5Bsince%5D+God+has+been+known+through+the+preaching+of+the+Gospel%2C+a+Christian+order+and+law+has+been+made+for+the+giving+and+bestowing+of+one+part+of+tithes+%5Bas+opposed+to+other+uses%2C+such+as+giving+to+the+poor%2C+etc.%5D.+And+herein+we+may+see+the+deceit+of+the+Pope+and+of+his+shavelings+%5Bdef%3A+contemptuous+epithet+for+a+tonsured+ecclesiastic%2C+i.e.+monk%5D%3A+for%2C+when+they+handle+the+law+of+tithes+in+their+Canons%2C+they+take+it+as+if+it+were+transferred+to+them+after+that+Jesus+Christ+had+put+an+end+unto+the+priesthood+of+Levi.+All+these+are+very+leasings+%5Blies%5D%2C+falsifying+the+holy+scripture%2C+and+wickedly+corrupting+the+same.+For+we+see+to+the+contrary%2C+as+has+been+before+showed%2C+that+it+is+long+ago+sithence+%5Bsince%5D%2C+that+it+was+not+known+what+the+paying+of+tithes+was+by+virtue+of+the+law+of+Moses%2C+and+they+were+always+paid+either+to+the+Emperor%2C+or+to+some+other+particular+great+men.+But+now+sith+%5Bsince%5D+the+thing+has+been+so+ordained+%28so+therein+be+no+abuse%2C+and+to+make+men+believe+contrary+to+all+truth%2C+that+it+came+from+the+holy+scripture%3A+but+to+be+taken+for+a+politic+law%29.+Let+us+hold+that+rule+which+Saint+Paul+sets+down%3A+to+wit%2C+%E2%80%9CThat+we+must+not+%5Bmuzzle%5D+the+mouth+of+the+ox+when+he+travels+to+feed+us%E2%80%9D%3A+and+therefore+it+stands+with+a+far+greater+reason%2C+that+they+which+preach+the+doctrine+of+the+gospel%2C+ordained+in+so+excellent+an+estate%2C+should+not+be+abridged+and+deprived+of+their+maintenance%2C+but+be+very+well+waged.+Now+as+I+have+already+said%2C+when+tithes+and+such+like+are+bestowed+unto+a+good+use%3A+we+must+not+so+straightly+look+into+the+matter%2C+as+to+ask+the+cause+of+why+it+is+so%2C+as+many+fantastical+fellows+will%2C+who+at+this+day+could+be+contented+to+turn+the+whole+world+upside+down+saying%2C+O%2C+it+is+no+time+now+to+pay+tithes%2C+for+seeing+the+thing+has+been+so+long+abused%2C+it+is+no+reason+it+should+any+longer+continue.+Then+must+we+by+their+laying+scrape+out+all%3A+for+they+think+that+Christianity+consists+in+changing+the+color+of+the+sun+and+the+moon.+But+if+there+be+anything+that+is+to+be+amended%2C+as+I+have+said%2C+as+if+the+Papists+have+brought+in+any+false+opinion%2C+let+that+be+utterly+abolished.+But+in+the+meanwhile%2C+let+us+hold+unto+all+good+ordinance%3A+to+wit%2C+let+the+tithes+and+all+such+things+that+are+for+the+maintenance+of+the+poor%2C+and+the+Ministers%3A+let+these+things+be+reduced+to+their+lawful+use%2C+and+let+not+unsatiable+wide+gullets+devour+all.+Let+them+not+consume+them+upon+their+superfluities%2C+in+pomps%2C+drunkeness%2C+and+other+dissolutions%3A+but+let+them+know%2C+that+these+are+holy+goods%2C+which+ought+to+be+reserved+for+the+use+of+the+Church%2C+as+well+for+the+maintenance+of+the+poor+as+I+have+already+said%2C+as+also+for+the+feeding+of+those+which+serve+God+and+his+people.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+%E2%80%98The+Third+Sermon+of+Melchisedech%2C+wherein+is+treated+of+the+use+and+right+of+tithes%2C+and+also+of+an+oath%E2%80%99%2C+pp.+64-68+on+Gen.+14%3A20-24+in+Sermons+on+Melchizedek+%26+Abraham%2C+Justification%2C+Faith+%26+Obedience+%281592%3B+rep.+Old+Paths+Publications%3A+2000%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffdc303688e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fdc303688e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings#:~:text=We%20see%20then%20how%20that%20the,which%20serve%20God%20and%20his%20people&amp;text=We%20see%20then%20how%20that%20the%20tithes%20which&amp;text=of%20those%20which%20serve%20God%20and%20his%20people" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-50d992a476" data-kw="">
<blockquote><p>We too are in the habit of praying for trivial and insignificant things. When we pray, we don’t take into account the great majesty of God. If God wanted to give us only petty and superficial things, he wouldn’t have given us such a magnificent model for prayer: “Our Father in heaven, hallowed be your name, your kingdom come . . .” God has plenty of resources, and he’s not a tightwad. He generously offers us the best gifts available in heaven and on earth. He expects that we will ask him for many things and that we will sincerely believe we will get what we request. When we receive what we ask for in the Lord’s Prayer, we are, in effect, receiving heaven and earth and everything they contain. For when we ask for God’s name to be kept holy, for his kingdom to come, and for his will to be done, we are overpowering countless devils and engulfing the whole world with one prayer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone: A Daily Devotional</cite>, (Kindle Edition), 27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>So also no bodily sports, recreations and pleasures are to be tolerated or used merely to cherish the flesh, to refresh the body, and to procure bodily strength, but only such as are in very deed needful in themselves, and used and intended by God’s people with this purpose, and to this end, that they may with more ability, alacrity, and cheerfulness do the holy works and perform the holy duties of God’s worship and service which are proper to the Lord’s holy day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (1638), ch. 21 Westminster divine, p. 156</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-2eee176501" data-kw="">
<blockquote><p>A. 3: And God’s prohibition, Deut. 12, of adding or diminishing, is not washed away so easily as your words would make men believe. You say, It reaches to the whole duty of man, and government of the Church, etc. Answer: There be some things in the duty of man and church-matters that God has left to man: To do those is no addition to God’s laws: But to do the like work that God by his Law has done, which He never left to man, seems to me the addition there forbidden: e.g. If men had made another Tabernacle, another ark of the Covenant, another holy vestment for Aaron, another sacrament like circumcision or the Passover, He that so reproved their worshiping in the high places would have reproved these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baxter held</cite>, (per Joseph Bingham, Works, 10.124) that ministerial ‘ornaments’ are not unlawful in themselves, but rather that they should not be imposed by authority on ministers, with such dissenting ministers being deposed for this. Here are some excerpts from Baxter: | The Defence of the Nonconformists’ Plea for Peace (1680), Ch. 18, pp. 41-42</span></figcaption>

</figure><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>

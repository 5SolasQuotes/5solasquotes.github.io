<blockquote><p>Of the changeable State, and short Duration of Earthly Things; especially of Man, how little is considered and believed: how necessary it should be.

When I consider that yesterday was the conclusion of the last year, and that I now am entered on another; ’tis seasonable to reflect on the mutable Condition, and short Duration of all Thing in this World, which are measured by Time. That as they have their Beginning, so they have their End: And that the distance, or space of Time between the one and the other is very little. Let me not then, O my Soul! Rejoice and please myself too much in New Enjoyments, remembering a Change may be at hand, and the End is certain.

Many who were Rich and Flourishing the last year, may be reduced to Poverty and deep distress, before the end of this: who are now in a capacity to relieve others, within a few months, or a shorter space, may be objects of other Men’s charity. The thing which hath been, is that which may be; and that which hath been seen in one year, may happen in another; so easily, so quickly may a Change be made! Riches may unexpectedly change their Owners, and borrow wings of a thousand Accidents, wherewith to fly to Heaven for a new Disposal. They therefore who possess, should be as if they possessed not; for the Fashion of this world passeth away. Innumerable casualties may effect that change, which no human Art or Skill can possibly foresee or hinder.

Afflictive unexpected evils attend us everywhere: we cannot promise ourselves Tranquillity for a Day, much less one Year to come. They lay in wait for us on every side, enter at every crevice, and commonly overtake us, when we are least apprehensive of their approach. Man that is born of a woman is of few days, and full of Trouble: He cometh up as a flower, and is cut down: fleeth as a shadow and continueth not. What then are Riches, Beauty, Strength, and Honour, the accidents of this Substance, which is itself but a Shadow! How false is the Hope of Man, and how frail is all his glory! One day can make an end of all his Riches and Honours. And yet what solicitude, care and labour, to get what we desire of these things (though often we do not need ’em) and then to keep what we have gotten, and then to increase it, and then to defend it, and at last to enjoy it, and in a moment it is snatcht from us, or we from it. His Life is but a vapour, on which they all depend; then how much less are they? To how speedy an alteration are they subject! What numberless Instances of this doth one year’s experience furnish!

What saddening Disappointments and unexpected Calamities have befallen many since this Day Twelve-month! and multitudes who are now at ease, and think their mountains too strong to be removed, shall meet with sharper Trials before the end of this year. Alas! how few consider or believe it, till they find it so? All men should count upon trouble and disappointment, suffering and sorrow in this world; and he that hath the least share, is reckoned the most prosperous man; and yet he knows not how soon his Portion may be doubled. We reckon our Joys by the absence of some degrees of Sorrow and Calamity that others meet with; and before the end of this year, our condition may be as disconsolate as theirs. O my Soul! though I know this to be true; though I cannot, I dare not deny it; yet how difficult is it to conquer the Love of this World, and of this Body, to that degree I ought! to undervalue the interest of a short, a mutable, uncertain and troublesome Life, in comparison of the permanent possession of an everlasting Good!

Though I know that what is earthly and temporal must needs be thus changeable and fading; and that it is as true of Man himself as of anything under the Sun; yet how do I forget what Man is! not only mutable in his State, his Body, and his Life, but in his Mind too, so as to love and hate, to choose and neglect, to delight in, and abhor, such things at one time as he did not before. He doth not pass the same Judgment, nor retain the same Affections at one time as at another. How do I live, as if all this were as certainly false, as it is unquestionably true? admire, love, fear, trust in Man, as if he were the direct Contrary to what he is, and seek for Immortality upon Earth, and act as if I were assured of it, and were not liable to any Change; though I acknowledge and know the contrary.

Though the last year’s Experience, and the observation of every day doth convince me of it; though all History, and all the Records of the Grave attest it; though all Mankind in every Age have found it so; though it be a manifest notorious Truth, legible in the various changes and calamities, but especially in the dust and ashes of all who have lived before us (our Graves being often made of our Predecessors Dust, and the Earth we bury in having once been living) yet how little is it believed, how seldom considered!

The Confirmation of it which one year gives us, hath little influence on our hearts or lives, with respect to the next. We ought therefore to accustom ourselves to these thoughts, before such changes happen, to which our Final change shall e’er long succeed. They will be less efficacious, if never admitted till our minds are oppressed and feebled by the weight of Affliction. We shall then want that vigour of Reason which should co-operate with the Remedy; and which, if used beforehand, would help to support and stay our minds under all subsequent Revolutions. For those Considerations may be able to fix and stay our minds under Changes, that may not be sufficient to recover and raise our Spirits after they are dejected and fallen.</p></blockquote>

— John Cotton, A Practical Commentary, (d. 1652; 1658), on ch. 3, verse 2, doctrines 3-4, pp. 224-26">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+God+did+not+make+the+whole+fabric+of+the+world+at+once%2C+though+it+was+not+impossible+to+Him%2C+being+a+God+Almighty%2C+but+in+the+space+of+six+days%3A+So+does+God+deal+with+his+children%2C+in+creating+in+them+a+clean+heart%3B+first+he+suffers+their+hearts+to+be+as+a+rude+and+massy+lump%2C+full+of+darkness%2C+and+then+God+sends+his+Holy+Spirit+into+their+hearts%2C+and+it+does+illuminate+them%3B+and+drive+away+those+black+clouds+of+darkness+and+ignorance%E2%80%A6+4%E2%80%A6+As+the+sun+does+now+move+with+much+celerity%2C+so+fast%2C+that+it+does+in+the+space+of+a+day%2C+run+over+many+millions+of+miles.%E2%80%9D%0A%0A%E2%80%94+John+Cotton%2C+A+Practical+Commentary%2C+%28d.+1652%3B+1658%29%2C+on+ch.+3%2C+verse+2%2C+doctrines+3-4%2C+pp.+224-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7963400fc6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7963400fc6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=As%20God%20did%20not%20make%20the,run%20over%20many%20millions%20of%20miles&amp;text=As%20God%20did%20not%20make%20the%20whole%20fabric&amp;text=a%20day%2C%20run%20over%20many%20millions%20of%20miles" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-aa73327b22" data-kw="">
<blockquote><p>We know well that God created each and every man, and that of the whole human race some will be reprobate with devil, others will reign with Christ. But the Creator is not to be blamed because He created those who will fail to attain to eternal life, for He is the author of nature but not of the sin which nature has contracted.

Who is so dull as not to understand that the creation of the reprobate also serves for the beauty and variety of the present world, when he sees how the endeavours and exertions of unbelievers make for the convenience of this present life by the invention of the arts, the building of towns, by legislation, by the federation of the nations.</p></blockquote>

</figure><figure class="quote" id="q-374929b3fd" data-kw="">
<blockquote><p>God’s Word is pre-eminently a blessed word. It makes known most gracious views of the divine character, and draws by the most blessed persuasion, the hearts of God’s people to find ever increasing interest and delight in the divine ways and perfections. The more that we take our instruction regarding the divine character from the Bible, the more shall we be convinced, that, during our day of grace, God would allure our affections to himself, and would prevail upon us to receive in faith and love the most gracious manifestations of his divine excellencies. …

He that is addressing unto you truths of such marvellous condescension, is the high and lofty One that inhabiteth eternity. There is infinitely more embodied in that declaration, than it is possible for any one adequately to express. He, whose glory is infinite, whose perfections are divine, whose essence is unsullied holiness, is announcing from his abode of unutterable purity and splendour, truths of unsearchable grace and condescension.

No created being can approach his glory and excellence. In the simple grandeur of Scriptural expression, it is affirmed, that he is the “high and lofty One that inhabiteth eternity.” His inconceivable perfections, and excellence, and glory, are represented in the designation, that he is “the high and lofty One.” His abode is with unequalled sublimity brought before the believing admiration of the people of the Lord, “He inhabiteth eternity.” His immediate dwelling-place, in its undefined immensity, is eternity. The glory and the honour of the heavens encircle Jehovah.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mungo-fairlie-parker.html">Mungo Fairlie Parker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s Dwelling with the Humble and Contrite, the Source of their Revival’ in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-43b91ea3d2" data-kw="">
<blockquote><p>Now, as formerly, I durst not but yield all true allegiance to the civil magistrate: so after this I durst not refuse any longer to hear the ministers of the presbyterian establishment who preach precious Christ, our dear Redeemer, to be the way, the truth, and the life… Under the ministry of some of which worthy minsiters I lived many years… …till… the much to be lamented death of the eminently religious, brave, and valiant William, Prince of Orange, King of Great Britain, our never to be forgotten kind and compassionate deliverer, who died, March 1702… Thus, from the time I left the dissenters, I wrestled through all the reign of great King William and Queen Anne, enjoying the gospel, clearly and faithfully preached by several worthy ministers, to the great edification and comfort of my soul, meditating frequently on the Scriptures, and repeating the Shorter Catechism to myself, all which I found much sweetness and satisfaction in…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted: or Memoirs of the First Years of James Nisbet, one of the Scottish Covenanters</cite>, (Edinburgh: Oliphant, 1827), pp. 240-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-0fa862c215" data-kw="">
<blockquote><p>As for the Sanquhar declaration [1680], in so far as it denies the king’s authority and declares a war against him, it is a mere madness… it is no Christian duty to debate about these and the like things, and for such causes to raise a schism. Oh how sad is it that so many do place godliness in maintaining the Sanquhar declaration, and in separating from them who in their judgment are not so zealous in these or other circumstances. I admonish them to cease from these and such like courses, if they be lovers of Christ and his cause and love not their own bodily and spiritual ruin. I pray therefore, do not make such feckless things grounds of schism; do not I pray stain piety with such a blot. Why do you sport with God, religion and the church? Leave things of the state to statesmen. Leave off such debates; God’s anger is kindled against Scotland; do not kindle it more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Maurice Grant, Preacher to the Remnant: The Story of James Renwick</cite>, (Blue Banner Productions, 2009), pp. 140-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

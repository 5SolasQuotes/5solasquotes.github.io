<blockquote><p>The Papists say indeed that all additions corrupting the worship of God are forbidden, but such as further adorn and preserve it are not so, which implies a contradiction, for whereas every addition is principally a corruption because it is an addition, under which notion it is forbidden (and that in the worship of God which is forbidden, is a corruption of it), there can be no such preserving, adorning addition, unless we will allow a preserving and adorning corruption. Neither is it of more force which is pleaded by them that the additions which they make belong not unto the substance of the worship of God, but unto the circumstances of it, for every circumstance observed religiously, or to be observed in the worship of God, is of the substance of it, as were all those ceremonious observances of the [Mosaic] Law which had the same respect in the prohibitions of adding with the most weighty things whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites, as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers and render the worship itself in its performance more decent, beautiful and orderly…?’, pp. 64-65</span></figcaption>

</figure><figure class="quote" id="q-83a5c9bf20" data-kw="">
<blockquote><p>Now it is to be considered what kind of religious observations God has reserved to his own determination and forbidden to be devised or instituted by man. And these are first, such as are of the same reason with those ordinances which God has instituted to be observed by the universal Church to the world’s end, as to make an addition of another weekly day to the same holy intents for which the Lord’s Day is set apart, or to institute any ordinance that is of the same reason with the sacraments of the Covenant of Grace. … 2. No new integral part of divine worship, without which the worship of God is supposed not entire, but deficient in part, may be invented of man. For it were to invent a new part of the Christian religion and to augment it beyond the state thereof as settled by the Author and Founder of it. Here note that the accidental parts of religion being varied, or augmented, or diminished, make no variation, addition or diminution in the religion, no more than alteration in clothes makes an alteration in the man. 3. No ordinance that is of universal and perpetual use to the Church of God (if it be at all of use), so that it may in no place, in no age be omitted, may be devised of man. For the devising of such an ordinance supposes a defect in the divine ordinances of universal and perpetual use, to be made up by adding other ordinances by way of supplement. And it is but a presuming that those others are requisite, when they are not. Also if the universal Lawgiver has reserved anything to his own power, it can be no less than the making of such laws or ordinances as are of universal and perpetual use. And surely that He has reserved something to Himself, few among us will gainsay. Howbeit an arbitrary and temporary use of a religious observance by particular men for such ends as equally concern all Christians may not be unlawful upon this account, because therein Christ’s legislative power is not encroached upon, it not being made a law to the Church, but only a private arbitrary observation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship… in The Remains of the Reverend and Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684), pt. 3 | sect. 4, What of Divine Worship may not be Devised or Instituted by Man</span></figcaption>

</figure><figure class="quote" id="q-2c32178ba9" data-kw="">
<blockquote><p>That God is to be worshipped, and that according to his own will and appointment, is a (a) principal branch of the Law of our creation, written in our hearts; the (b) sense whereof is renewed in the Second Commandment; but the ways and means of that worship, depend merely on God’s (c) soveraign pleasure and institution. (a) Rom. 1:21, ch. 2:14-15; Acts 15:16-17; 17:23-24-29. (b) Exodus 20:4-6, (c) Jer. 7:31; Ex. 25:40; Heb. 3:1-6; John 1:18. Explication. These two things all men see by nature. First, that God, however they mistook in their apprehensions of Him, would be and was to be worshipped with some outward solemn worship. So that although some are reported to have even cast off all knowledge and sense of a divine being, yet never any were heard of that came to an acknowledgement of any God, true or false, but they all consented that he was constantly and solemnly to be worshipped. And that not only by individual persons, but by societies together, that so they might own and honour Him whom they took for their God. And thus far outward worship is required in the First Commandment; namely, that the inward be exercised and expressed. When we take God for our God, we take Him to worship Him, Dt. 10:12-13. Other thoughts, namely of inward worship without outward expression at all or any time, or in any way, are but a covert unto atheism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667) | Question 2, pp. 5-6</span></figcaption>

— John Owen, A Brief Instruction in the Worship of God… (London: 1667) | Question 2, pp. 5-6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+God+is+to+be+worshipped%2C+and+that+according+to+his+own+will+and+appointment%2C+is+a+%28a%29+principal+branch+of+the+Law+of+our+creation%2C+written+in+our+hearts%3B+the+%28b%29+sense+whereof+is+renewed+in+the+Second+Commandment%3B+but+the+ways+and+means+of+that+worship%2C+depend+merely+on+God%E2%80%99s+%28c%29+soveraign+pleasure+and+institution.+%28a%29+Rom.+1%3A21%2C+ch.+2%3A14-15%3B+Acts+15%3A16-17%3B+17%3A23-24-29.+%28b%29+Exodus+20%3A4-6%2C+%28c%29+Jer.+7%3A31%3B+Ex.+25%3A40%3B+Heb.+3%3A1-6%3B+John+1%3A18.+Explication.+These+two+things+all+men+see+by+nature.+First%2C+that+God%2C+however+they+mistook+in+their+apprehensions+of+Him%2C+would+be+and+was+to+be+worshipped+with+some+outward+solemn+worship.+So+that+although+some+are+reported+to+have+even+cast+off+all+knowledge+and+sense+of+a+divine+being%2C+yet+never+any+were+heard+of+that+came+to+an+acknowledgement+of+any+God%2C+true+or+false%2C+but+they+all+consented+that+he+was+constantly+and+solemnly+to+be+worshipped.+And+that+not+only+by+individual+persons%2C+but+by+societies+together%2C+that+so+they+might+own+and+honour+Him+whom+they+took+for+their+God.+And+thus+far+outward+worship+is+required+in+the+First+Commandment%3B+namely%2C+that+the+inward+be+exercised+and+expressed.+When+we+take+God+for+our+God%2C+we+take+Him+to+worship+Him%2C+Dt.+10%3A12-13.+Other+thoughts%2C+namely+of+inward+worship+without+outward+expression+at+all+or+any+time%2C+or+in+any+way%2C+are+but+a+covert+unto+atheism.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+A+Brief+Instruction+in+the+Worship+of+God%E2%80%A6+%28London%3A+1667%29+%7C+Question+2%2C+pp.+5-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c32178ba9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c32178ba9.html">Permalink</a><a class="src" href="https://ref

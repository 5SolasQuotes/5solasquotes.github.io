</figure><figure class="quote" id="q-94faf9202e" data-kw="">
<blockquote><p>Justification by faith is an answer to the greatest personal question ever asked by a human soul: “How shall I be right with God? How do I stand in God’s sight? With what favor does he look upon me?” There are those, I admit, who never raise that question. There are those who are concerned with the question of their standing before men but never with the question of their standing before God. There are those who are interested in what “people say” but not in the question of what God says. Such men, however, are not those who move the world. They are apt to go with the current. They are apt to do as others do. They are not the heroes who change the destinies of the race. The beginning of true nobility comes when a man ceases to be interested in the judgment of men and becomes interested in the judgment of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God Transcendent</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-efe1da18ef" data-kw="">
<blockquote><p>XIV… “And so that you may do this, we must distinguish between passive and active justification. In passive justification, we are persuaded that we are justified by God, or from it we conclude that we are justified by God. In this way it certainly can be said that we are justified by faith as an instrument, insofar as in the practical syllogism, by means of which we conclude that we are infallibly justified, faith stands as the middle term: “The one who believes is justified; I believe; therefore, I am justified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, sect. 14, ‘How faith influences justification: How it does not influence’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-8e85739b7f" data-kw="">
<blockquote><p>A man may be really justified before God, and yet not have the evidence or assurance of it in his own mind; wherefore that evidence or assurance is not of the nature or essence of that faith whereby we are justified, nor does necessarily accompany our justification. But this manifestation of a man’s own justification unto himself, although it depend on many especial causes, which are not necessary unto his justification absolutely before God, is not a second justification when it is attained; but only the application of the former unto his conscience by the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7413cf3ba2" data-kw="">
<blockquote><p>Out of these words, may be raised another profitable observation, to wit, What was the matter of Christ’s Doctrine, to wit, the Gospel and not the Law. For this cause came he out of the bosom of his Father. John 1. The Law was given by Moses, &amp;c. So that this doth richly commend the Office and benefit of Christ, for the Gospel far surmounts the Law.

But it may be said, Did not Christ teach the Law (Math. 5.) and other places, as to the young-man Luke 18. To this answer is made, He did it not as his chief Office, but as a preparing of men thereby to the Gospel; for as the proper office of a Carpenter is to build, not to pull down, [Simile.] and of a Physician to heal, not to make sick, yet they are forced oft to do both; Even so was CHRIST.

He saw that the Law was so taught, as that men were made to trust in it to look for Salvation by it, as being possible to be kept; and so to exclude all help and necessity of any other Saviour. So that most needful it was, that Christ should shew that the Law rightly understood was impossible to be kept, that so they might seek Salvation else-where.

This being remembered, to return to the Point, to wit, The excellency of the Gospel, it will soon appear by the riches and benefits it brings with it. As first, Pardon of Sins. Secondly, gift of Righteousness. Thirdly, adoption of Sons. Fourthly, acceptance into the favour of God, yea unto life everlasting. Fifthly, gift of the Spirit, Faith, Hope, Patience, Love, Holiness, &amp;c. Sixthly, freedom from the Curse of the Law, Hell, Death, and dominion of Sin. Seventhly, Communion with the blessed Trinity, 1 Joh. 1. at the beginning. Eighthly, access unto the throne of Grace. Ninthly Peace of Conscience, Perseverance: Sanctification of all afflictions, with all other riches of Christ, all which are wrought by the Gospel, which how great they are may be seen by the contrary or the want of them; as to be under the guilt of Sin, wrath of God, Children of Satan, Curse and Death bondage, sting and wo me of Conscience, debarred God’s presence, and reserved for the fearful society of Satan: And as the excellency of the Gospel doth partly appear hereby, so will it further, by considering how it differs from the Law.

For the Law, first is Natural; second the Gospel is Supernatural, both for matter and the manner of Revealing, (Joh. 1.18. Colos. 2.16. 1 Cor. 2.7.) Had not he wisdom of God found out this meanes of Salvation, and published the same; all the wits of Men and Angels had not been able to have devised such a way, whereby God’s justice might be fully satisfied, and yet infinite Mercy extended to miserable Man.

Secondly, The Law and Gospel differ in the way that leads to Righteousness and Salvation. For the Law says by Doing. The Gospel, by Believing. The Law teaches, it must be done by our Selves. The Gospel admits and sets forth Another, Philip. 3. Gal. 3. Rom. 10.5, 6, 7.

Thirdly, they differ in the manner and nature of the Promises annexed to either. For the Legal requires the condition of our Righteousness, and that every way perfect. But the Evangelical requires not our own but accepts another’s nor exacts Perfection in us, but only Sincerity. Rom. 4. By debt, and freely distinguishing the Law and the Gospel.

Fourthly, They differ in their effects, for the Law causes wrath, Increases sin, gives not strength to do the things Commanded. But the Gospel, brings Peace, Righteousness, and the Ministry of the Spirit. This is largely and excellently taught. 2 Corinth. 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brightman.html">Thomas Brightman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brightman redivivus: or The post-humian of-spring of Mr. Thomas Brightman, in IIII. sermons. Viz. 1. Of the two covenants. 2. The danger of scandals. 3. God’s commission to Christ to preach the Gospel. 4. The saint’s security</cite>, (London: John Rothwell, 1647), pp 59-61.</span></figcaption>

<blockquote><p>2. We deny also that by such a church-covenant [of the Independents] that right is obtained which the members of a Church in ecclesiastical communion have to the sacraments of grace, the privileges of the ecclesiastical ministry and other benefits which Christ has given to his Churches. The reasons of our denial are these:

1. Because the apostles have not ordained any such church-covenant between the members and the pastors of a church; neither in the admission of members into the Church did require such a covenant as necessary: but by the sacrament of baptism they received such as professed the truth and holiness into the Church-visible, and joined in the same exercises of divine worship with those who were without any such covenant received into an ecclesiastical body with themselves. See Acts 2:42,47; 5:13; 8:12; 9:6 &amp; 18:8.

2. Under the Old Testament the particular churches in the synagogues entered not into any solemn church-covenant in the admission of members: but only on extraordinary occasions, when they had made defection from God, all the faithful of the whole national Church renewed their Covenant with God, for restoring the decayed worship of God; or when they were by some other necessity called upon for renewing such a covenant.

3. No man can enjoin anything upon the consciences of men (as absolutely necessary to enjoying the sacraments of divine grace and the benefits of the ministry of the Church) which God hath not enjoined; without damnable will-worship. But God has not enjoined such a Covenant on the consciences of men as absolutely necessary: for there is no law of God wherein He has enjoined a necessity of this covenant as the essential form of Church-communion, so as that without it no man can be [a] member of a visible Church, or have right to the seals of the Covenant: Therefore the necessity of this covenant is a will-worship and so to be rejected.

4. The means whereby the members of a Church-visible are associated and united into external ecclesiastical communion, are baptism under the New Testament, as circumcision was under the Old Testament, 1 Cor. 12:13, as Cornelius, Acts 10:47, Lydia, Acts 16:15 and others, were by baptism engrafted into the body of the Church visible: which in those of years is joined with an embracing and profession of sound doctrine and subjection to the ordinances of God; as appears in the believers, Acts 2:41, the Bereans, Acts 17:10, and by Christ’s commandment, Mt. 28:19. Hence say the Professors of Leiden, that beside the primary uses of the sacrament of baptism, there are other secondary uses of it: to wit, the external engrafting them into a particular visible Church, Acts 2:41, the uniting of Christs members amongst themselves and into one body: 1 Cor. 12:12, and consequently upon these, a signification of our profession; and a distinction and separation from all other assemblies of unbelievers. This Church-covenant therefore is not the formal reason of our ecclesiastical communion in the Church-visible. Hence also our churches of the Netherlands in admitting of pastors or Church members do not enter into any such Church-covenant: which yet are true visible Churches of God; whose members have all essential requisites necessary to Church communion in the visible-Church. … 3. We reject also the opinion of those who affirm that the sacraments of the Old and New Testament are signs and seals to confirm this Church-covenant, and so instituted by God for the ratifying of it; that they are to be administered to those only, who are by such a Church-covenant united amongst themselves; but to be denied to others, though known to be godly, who be not in such a Church-communion and strict fellowship. Whereas it does most clearly appear out of the holy Scriptures that the sacraments were instituted by God in his Church, chiefly and in the first place to be signs and seals of the Covenant of Grace, and of the benefits promised in the Covenant of Grace, and of salvation procured by Christ for us, as is manifest by the sacrament of circumcision, Gen. 17:7,10; Rom. 4:11, of the Passover, 1 Cor. 5, of Baptism, Mark 1:4; Acts 2:38-39 and 22:16; Rom. 6:3-4; Titus 3:5, and of the Lord’s Supper, Mt. 26:26-28; 1 Cor. 11:24-26. But in a secondary respect we acknowledge the Sacraments to be seals of our outward engrafting into the Church-visible, and our conjunction into one body of the Church, Acts 2:41; 1 Cor. 12:12-13, and that, as we conceive, of the catholic Church; so that he that is baptized is not baptized into the communion only of this or that particular, or parochial Church, but is joined into that one body of the Church catholic and universal: as the whole ministry of the Church is given by Christ to men, to bring them to the unity and conjunction of the Church catholic and universal, and to engraft them as members into it, Eph. 4:11-12; 1 Cor. 12:28; Rom. 12:5-7. And as by Excommunication duly performed the person excommunicate is not cast out of this or that particular Church only, but is bound all the world over, and shut out from the brotherly communion of the Church universal, Mt. 18:17-18, so the sacraments of baptism and the Lord’s Supper are seals to a man of ecclesiastical communion, not only in a particular Church, but in the Church universal. And therefore we hold that these sacraments are to be administered not to those only who by a Church Covenant have joined themselves to some particular Church, but to all the members of the Church catholic, who have duly prepared themselves for the partaking of them. Thus our Belgic churches deny not the seal of Baptism to the children of those parents, who have not by a confession of faith and submission to ecclesiastical discipline, joined themselves to any particular church; according to the practice of the Jewish Church, Josh. 5:4-6, as neither do we deny the participation of the Lord’s Supper to those who by reason of the necessity of their calling cannot join themselves to any particular Church, but are forced to travel through diverse parochial churches.</p></blockquote>

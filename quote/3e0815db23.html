<main class="wrap"><figure class="quote" id="q-3e0815db23" data-kw="">
<blockquote><p>And yet by all this which hath been spoken, we do not go about so to disable natural reason, as to leave it no room at all in matters of supernatural assent. For though nature alone be not able to comprehend grace, yet grace is able to use nature: and being in itself a spiritual eye-salve, when it hath healed and rectified reason, it then applieth it as an instrument more exactly to discover the connexion and mutual consequences and joinings of spiritual doctrines together.

Besides, thus much vigour we may safely attribute to natural reason alone, that by the force of such premises as itself can frame, the falseness, vanity, and insufficiency unto human happiness of all other religions or doctrines which are not Christian, may, by a wise man, be evidently discovered. Neither have there been wanting, amongst infidels and idolaters, men of more generous, piercing, and impartial judgements, who have made bold to confess the vanity of that polytheism and corrupt worship which was amongst them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 145-46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Much less can he [a magistrate] on pretence of parish-order tie me to an ignorant, drunken, malignant, or an inexperienced sapless [religious] teacher, that is to my soul as a silly emperic [a medical practitioner who relies solely on observation and experiment] to my health. Scripture and the world’s experience tell how much God morally gives his light and grace according to the aptitude of means: Habitus infusi se habent ad modum acquisitorum [infused habits hold themselves unto the way of those things having been acquired], is common in the schools. Twenty sinners are usually sooner brought to repentance under skilful, fit teachers than under one unskilful or ungodly man. And no man has power from God to damn my soul or forbid me the needful means of my salvation.</p></blockquote>

</figure><figure class="quote" id="q-06a51df51a" data-kw="">
<blockquote><p>Her existence is independent of her civil establishment. Even her increase and prosperity may be attained in the midst of persecution. Yet her Establishment is a blessing, and every lawful means is to be employed for its maintenance. No principle must be sacrificed for it – but it is to be prized if it can be had consistently with principle.

We [the Irish Presbyterians] are to seek to procure for her what we enjoy ourselves, the patronage and support of the State, with uncontrolled freedom and independence. Let us ask our rulers to consider what they have done, and still do for us, and enquire why they should not do the same for them.

Do not our rulers know that our principles and practices are maintained without detriment to the State, and why should the same be refused to them? – Have not the rulers acknowledged, time after time, that to the Presbyterianism of Ireland they are mainly indebted for the security and peace of the country, and why should our privileges be denied to our parent Church of Scotland? We ask nothing for her which we have not ourselves enjoyed, and which we have not shown it is good for the State we should enjoy.

The voice of Irish Presbyterians should be heard in this question, and I trust that, for the sake of our rulers, as well as for our own, and for the Church of our Fathers, it shall be heard. Presbyterians are the friends of the Government, and they expect friendship in return. It would be a blunder in legislation to injure the Church of Scotland, which many years of regret and retraction might fail to correct. …

Presbyterians have their politics, but they value their religion more. And be the ruling powers who or what they may, the support of Presbyterian Ulster will be given to none who oppress the Church of their Fathers, and seek to suppress the fundamental principles of their ecclesiastical polity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast News-Letter</cite>, 18 March 1842.</span></figcaption>

</figure><figure class="quote" id="q-4ecf20077e" data-kw="">
<blockquote><p>[Job 15:15] ‘For God finds not steadfastness in his saints (that is to say in his angels), neither are the heavens clean in his sight:’… For first and foremost they [men] had need to be cleaner and purer than the angels, and they had need to surmount the brightness of the sun and the stars, seeing that the heavens themselves are infected before God, if comparison should be made between them and Him… But there is another higher righteousness in God, which surmounts all creatures, insomuch as no angel is able to satisfy it. And no wonder at all: for what comparison is there between an infinite thing and a thing that has bounds? Behold, although the angels have great glory in them: yet are they but creatures. And what is God? He is an infinite thing, insomuch that when we think upon Him, we ought to be ravished into astonishment. So then let us not think it strange, that God’s righteousness should be so high that when all creatures come to that point, all that is to be found in them shall be nothing at all, but they shall deserve to be utterly wiped out… And so far are we unable to stand upright that the very angels of heaven are confounded there. And why? Because the very heavens themselves are not clean. For whereas God has created the sun to give light to the world, and given some brightness to the stars also: it follows not therefore that they have a divine perfection. We must remember what has been said afore: namely that all the creatures that God made do keep still some marks of his grace. But if a man would compare that which is in the creatures with that which is in God: he shall find that the one is all and the other is nothing. Thus ye see how the heavens are not clean, that is to say, that there is always some imperfection in the creatures, so as they have not the power to stand before God, as in respect of the infinite glory that is in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Job</cite>, … upon the Book of Job (London: 1574), 2nd sermon on ch. 15, 58th Sermon, pp. 298-99</span></figcaption>

— John Calvin, Sermons on Job, … upon the Book of Job (London: 1574), 2nd sermon on ch. 15, 58th Sermon, pp. 298-99">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BJob+15%3A15%5D+%E2%80%98For+God+finds+not+steadfastness+in+his+saints+%28that+is+to+say+in+his+angels%29%2C+neither+are+the+heavens+clean+in+his+sight%3A%E2%80%99%E2%80%A6+For+first+and+foremost+they+%5Bmen%5D+had+need+to+be+cleaner+and+purer+than+the+angels%2C+and+they+had+need+to+surmount+the+brightness+of+the+sun+and+the+stars%2C+seeing+that+the+heavens+themselves+are+infected+before+God%2C+if+comparison+should+be+made+between+them+and+Him%E2%80%A6+But+there+is+another+higher+righteousness+in+God%2C+which+surmounts+all+creatures%2C+insomuch+as+no+angel+is+able+to+satisfy+it.+And+no+wonder+at+all%3A+for+what+comparison+is+there+between+an+infinite+thing+and+a+thing+that+has+bounds%3F+Behold%2C+although+the+angels+have+great+glory+in+them%3A+yet+are+they+but+creatures.+And+what+is+God%3F+He+is+an+infinite+thing%2C+insomuch+that+when+we+think+upon+Him%2C+we+ought+to+be+ravished+into+astonishment.+So+then+let+us+not+think+it+strange%2C+that+God%E2%80%99s+righteousness+should+be+so+high+that+when+all+creatures+come+to+that+point%2C+all+that+is+to+be+found+in+them+shall+be+nothing+at+all%2C+but+they+shall+deserve+to+be+utterly+wiped+out%E2%80%A6+And+so+far+are+we+unable+to+stand+upright+that+the+very+angels+of+heaven+are+confounded+there.+And+why%3F+Because+the+very+heavens+themselves+are+not+clean.+For+whereas+God+has+created+the+sun+to+give+light+to+the+world%2C+and+given+some+brightness+to+the+stars+also%3A+it+follows+not+therefore+that+they+have+a+divine+perfection.+We+must+remember+what+has+been+said+afore%3A+namely+that+all+the+creatures+that+God+made+do+keep+still+some+marks+of+his+grace.+But+if+a+man+would+compare+that+which+is+in+the+creatures+with+that+which+is+in+God%3A+he+shall+find+that+the+one+is+all+and+the+other+is+nothing.+Thus+ye+see+how+the+heavens+are+not+clean%2C+that+is+to+say%2C+that+there+is+always+some+imperfection+in+the+creatures%2C+so+as+they+have+not+the+power+to+stand+before+God%2C+as+in+respect+of+the+infinite+glory+that+is+in+Him.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Sermons+on+Job%2C+%E2%80%A6+upon+the+Book+of+Job+%28London%3A+1574%29%2C+2nd+sermon+on+ch.+15%2C+58th+Sermon%2C+pp.+298-99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4ecf20077e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4ecf20077e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Job%2015%3A15%5D%20%E2%80%98For%20God%20finds%20not,infinite%20glory%20that%20is%20in%20Him&amp;text=Job%2015%3A15%5D%20%E2%80%98For%20God%20finds%20not%20steadfastness%20in&amp;text=of%20the%20infinite%20glory%20that%20is%20in%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

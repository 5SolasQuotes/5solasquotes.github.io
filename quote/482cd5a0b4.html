<main class="wrap"><figure class="quote" id="q-482cd5a0b4" data-kw="">
<blockquote><p>51 To be for ever deprived of the beatifical vision of God, goes beyond all the Punishments in Hell.

52 Being squeezed under the unsupportable weight of Punishments, they shall wish they had no being: but it shall be all in vain. They shall desire to die; but death shall flee from them. Revel. 9.6.

53 They shall roar for the very disquietness of heart; they shall rage for madness, and gnash their teeth: There shall be weeping for grief, and gnashing of teeth for madness. Bern. Ser. 8. in Psal. 91.

54 Of all which some have a taste even in this Life.

55 The Company of the Devils, and the Quality of the Place do exceedingly increase the Torments of the Damned.

56 Neither shall the torments of the Damned be only Eternal, but they shall also be Without all intermission at any time. The smoke of their Torments ascendeth up for ever and ever. Revel. 14.11.

57 As in Heaven one is more glorious then another: So likewise in Hell one shall be more miserable then another. August. in Enchirid. Cap. 3.

58 We are very curious to know where Hell is: But we are not so careful to learn how we may escape it. Our thoughts were better spent in meditating upon it.

59 When we sit down to eat and drink, and when we rise from table again, when we lie down to sleep, and when we rise up again: at all times, and in all places, it is very good to think upon Hell.

60 For, To think upon Hell preserves a man from falling into it. Chrysost, Hom. 44 in Matth.

61 Dost thou think to quench the flames of Hell by not speaking of it or, Dost thou think thou kindlest the flame thereof by speaking of it? Whether thou speakest of it or no, the flame is always there alike. Idem in Homil. 2. in 2. Thess.

62 He deliver us from eternal death, who himself died for us: He bring us unto eternal Life, who himself is the Prince of Life blessed for ever. To whom with the Father and the Holy Spirit be all honour and glory World without end. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Doctrine</cite>, trans. Ralph Winterton (Cambridge: Roger Daniel, 1640), pp 301-03.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf2ceb2252" data-kw="">
<blockquote><p>However long our stay here below may be, it consists almost entirely of a continual revolution between evils and deliverances. These two things take each other by the hand; the end of the one is the beginning of the other. And this is one of the principal differences that distinguish heaven and hell from life on earth. In heaven there is nothing other than eternal happiness, and in hell there is nothing but eternal misery. But on earth rest is followed by trouble and trouble by rest. I assure you that this is a truth that is borne out by the experience of saints from all ages.

Scripture doesn’t stop drawing our attention to it for two reasons: First, because it is one of the most important lessons of religion and serves as a base and foundation for our wisdom. And the other is because it is the habit of humans only to cling to the present, only to think of the future as something far away, about which they don’t need to be concerned. They are proud in prosperity and cowardly in adversity. Good puffs them up, and bad wipes them out. David himself, although accustomed to changes in his circumstances, always recognized that he had fallen into this kind of excess. He says, “When I was in my prosperity, I said, ‘I will never be disturbed’, but when you hid your face, I became completely despairing.” It is therefore extremely necessary for us not to lose our ability to understand both of these days (the good and the bad), and it is for this reason that the Scripture speaks to us about it so often.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-claude.html">Jean Claude</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon on Ecclesiastes 7:14: Delivered during a Fast Day at The Hague, the Netherlands, on November 21, 1681 , trans. Charles K. Telfer in Mid-American Journal of Theology</cite></span></figcaption>

</figure><figure class="quote" id="q-56978ca130" data-kw="">
<blockquote><p>Obedience is Heaven begun, and the sons of God rejoice to see him take his honour, and call all worlds around him to esteem and love him, as most worthy. They are not under the law in whole or part, so far as it has sanctions, threats, or promises. But let us hear in mind — for there may he ere long another Antinomian outbreak — that in the measure in which we win Christ, it will be our meat to do the Father’s will as it was his beforehand. Our willingness to obey just shows how far we have tasted the sweetness of the promises, how far we have apprehended Christ.</p></blockquote>

</figure><figure class="quote" id="q-088949c4d2" data-kw="">
<blockquote><p>If it be man’s chief end to glorify God and enjoy Him for ever, then man has attained his end, the sole purpose for which he was made, the entire object for which he exists, when he enters into communion with God, abides in His presence, streaming out to Him in all the emotions, I do not say appropriate to a creature in the presence of his Maker and Lord, apprehended by him as the Good Lord and Righteous Ruler of the souls of men, but appropriate to the sinner who has been redeemed by the blood of God’s own Son and is inhabited by His Spirit and apprehends his Maker as also his Saviour, his Governor as also his Lover, and knows the supreme joy of him that was lost and is found, was dead and is alive again,—and all, through the glory of God’s seeking and saving love. He who attains to this experience has attained all that is to be attained. He is absorbed in the beatific vision. He that sees God shall be like Him.</p></blockquote>

<blockquote><p>Paradise signifies a garden, the word being translated out of Greek into Latin, and so into French and English. In Hebrew it is called Heden, which signifies delights, a garden of all manner of delights, a place beset with all kind of fruitful and beautiful trees. There were two special trees in it, one called the tree of life, the other of the knowledge of good and evil. Some say it was called the tree of life from the effect, because of the hidden power and force it had a of sustaining and prolonging man’s life.1 Although it be a dispute, whether it had this force as meat [food] to prolong life or as medicine to prevent death, old age and diseases, as likewise whether this power in the tree were natural or supernatural. Therefore others say it was called so not from the effect, but signification, because it was an outward sign, that God would give them immortality if they did continue. 1. Paradise was a little model of heaven, and a sign of the great heaven, assuring Adam, that if he continued in obedience to God, he should be translated into heaven, to enjoy God supernaturally, as there he did enjoy him naturally: for the Law saying, “Do this and live,” [Luke 10:28] means it of ever lasting life.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“Paradise signifies a garden, the word being translated out of Greek into Latin, and so into French and English. In Hebrew it is called Heden, which signifies delights, a garden of all manner of delights, a place beset with all kind of fruitful and beautiful trees. There were two special trees in it, one called the tree of life, the other of the knowledge of good and evil. Some say it was called the tree of life from the effect, because of the hidden power and force it had a of sustaining and prolonging man’s life.1 Although it be a dispute, whether it had this force as meat [food] to prolong life or as medicine to prevent death, old age and diseases, as likewise whether this power in the tree were natural or supernatural. Therefore others say it was called so not from the effect, but signification, because it was an outward sign, that God would give them immortality if they did continue. 1. Paradise was a little model of heaven, and a sign of the great heaven, assuring Adam, that if he continued in obedience to God, he should be translated into heaven, to enjoy God supernaturally, as there he did enjoy him naturally: for the Law saying, “Do this and live,” [Luke 10:28] means it of ever lasting life.”

— Edward Leigh, A Treatise Of Divinity Consisting Of Three Books, (London, 1646), 122 [Spelling and punctuation modernized].">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CParadise+signifies+a+garden%2C+the+word+being+translated+out+of+Greek+into+Latin%2C+and+so+into+French+and+English.+In+Hebrew+it+is+called+Heden%2C+which+signifies+delights%2C+a+garden+of+all+manner+of+delights%2C+a+place+beset+with+all+kind+of+fruitful+and+beautiful+trees.+There+were+two+special+trees+in+it%2C+one+called+the+tree+of+life%2C+the+other+of+the+knowledge+of+good+and+evil.+Some+say+it+was+called+the+tree+of+life+from+the+effect%2C+because+of+the+hidden+power+and+force+it+had+a+of+sustaining+and+prolonging+man%E2%80%99s+life.1+Although+it+be+a+dispute%2C+whether+it+had+this+force+as+meat+%5Bfood%5D+to+prolong+life+or+as+medicine+to+prevent+death%2C+old+age+and+diseases%2C+as+likewise+whether+this+power+in+the+tree+were+natural+or+supernatural.+Therefore+others+say+it+was+called+so+not+from+the+effect%2C+but+signification%2C+because+it+was+an+outward+sign%2C+that+God+would+give+them+immortality+if+they+did+continue.+1.+Paradise+was+a+little+model+of+heaven%2C+and+a+sign+of+the+great+heaven%2C+assuring+Adam%2C+that+if+he+continued+in+obedience+to+God%2C+he+should+be+translated+into+heaven%2C+to+enjoy+God+supernaturally%2C+as+there+he+did+enjoy+him+naturally%3A+for+the+Law+saying%2C+%E2%80%9CDo+this+and+live%2C%E2%80%9D+%5BLuke+10%3A28%5D+means+it+of+ever+lasting+life.%E2%80%9D%0A%0A%E2%80%94+Edward+Leigh%2C+A+Treatise+Of+Divinity+Consisting+Of+Three+Books%2C+%28London%2C+1646%29%2C+122+%5BSpelling+and+punctuation+modernized%5D.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd5273c7d9d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d5273c7d9d.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/02/leigh-paradise-was-a-little-model-of-heaven/" rel="noopener" target="_blank">Read it onlin

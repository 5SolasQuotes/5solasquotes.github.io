<main class="wrap"><figure class="quote" id="q-0d5a60135c" data-kw="">
<blockquote><p>What is Faith? It is believing what the Bible tells us about Jesus, and trusting our salvation in His hands. … Is this belief an act of the mind only? No; it is with the whole heart, so that we are led to love and obey Christ. … Are there many who believe the Bible who do not exercise faith? Yes; the greater part of those who have the Bible believe it with the mind, but do not trust with the heart also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-petigru-boyce.html">James Petigru Boyce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Catechism of Bible Doctrine</cite>, Repentance and Faith, Q. 5–7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a> › <a href="../topics/faith/nature-of-saving-faith/knowledge-assent-trust-fiducia.html">Knowledge, assent, trust (fiducia)</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-159631b248" data-kw="">
<blockquote><p>Faith consists not in ignorance, but in knowledge--knowledge not of God merely, but of the divine will. We do not obtain salvation either because we are prepared to embrace every dictate of the Church as true, or leave to the Church the province of inquiring and determining; but when we recognize God as a propitious Father through the reconciliation made by Christ, and Christ as given to us for righteousness, sanctification, and life.</p></blockquote>

</figure><figure class="quote" id="q-9bdcbd6029" data-kw="">
<blockquote><p>What is faith? It is made up of three things—knowledge, belief, and trust. Knowledge comes first. … Faith begins with knowledge. The mind goes on to believe that these things are true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, ch. 8 (“Faith, What Is It?”)</span></figcaption>

</figure><figure class="quote" id="q-c23310058e" data-kw="">
<blockquote><p>The next thing necessary is, that what the mind has imbibed be transferred into the heart. The word is not received in faith when it merely flutters in the brain, but when it has taken deep root in the heart, and become an invincible bulwark to withstand and repel all the assaults of temptation. But if the illumination of the Spirit is the true source of understanding in the intellect, much more manifest is his agency in the confirmation of the heart; inasmuch as there is more distrust in the heart than blindness in the mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.2.36</span></figcaption>

</figure><figure class="quote" id="q-bc48cf2972" data-kw="faith instrument receives Christ alone means union">
<blockquote><p>So great is the necessity of faith in the matter of salvation that as Christ alone is the cause of salvation, so faith alone is the means and way to Christ. Hence it is celebrated as the bond of our union with Christ because he dwells in us by faith (Eph. 3:17); as the condition of the covenant of grace under which salvation is promised to us; as the instrument by which we receive Christ with all his benefits. For as God calls by his word and offers the promise of grace, thus man responds by faith and receives and applies to himself the offered promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 15.7.1–2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5fae02486d" data-kw="unworthy">
<blockquote><p>The reasons are: (1) from the institution and the example of Christ. Christ broke the bread and all the evangelists, and Paul, who individually relate this, agree that he did. Now who would affirm that the Son of God in so sacred an action did anything superfluous, or that all the apostles would have related this with so great carefulness, if the thing was merely indifferent and free? Who, on the other hand, does not see that Christ wished to prescribe the sacramental rites and ceremonies by his example and command when he ordered his disciples “to do this” (i.e., with respect to those administering, to take the bread, to bless, to break and give it to the communicants)? Again, there ought to be the same reason for the breaking as the giving of thanks and for the distribution because it is placed between them. Now no one denies that these latter ceremonies are necessary, belonging to the instituted rite and not merely indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.24</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a64591cf5" data-kw="">
<blockquote><p>Third, their idolatry exceeds the idolatry of the heathen, in that they worship a breaden god, or Christ in and under the forms of bread and wine. And if Christ according to His humanity be absent from the earth, as I have proved, the popish host is as abominable an idol as ever was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, pp. 197–198</span></figcaption>

</figure><figure class="quote" id="q-c6ab7042a9" data-kw="spiritual presence">
<blockquote><p>From what has been said the statement of the question is clearly gathered. First, it is not inquired about the presence of Christ in general—whether Christ is present in the Eucharist (which is asserted on both sides)—but concerning the mode of this presence: Is it corporeal and by indistancy (adiastasian) or is it spiritual? The Romanists and Lutherans hold the former; we hold the latter. Second, the question is not whether the body of Christ is present to the mind of believers in the Eucharist, and whether it is united closely with them. Rather the question is whether it is united with the sacramental signs and locally present with them. This they maintain; we deny. Third, the question is not about the real and substantial presence as to efficacy and virtue; for thus we do not deny that Christ’s body is present in the sacrament, inasmuch as in the lawful use it exerts its power in the communicants according to God’s ordination. But the question (according to the sense of our opponents) concerns a real presence by nearness (indistantiam).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.28.4</span></figcaption>

</figure><figure class="quote" id="q-b1d9a0983e" data-kw="">

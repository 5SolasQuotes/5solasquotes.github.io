</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee80ccc32f" data-kw="">
<blockquote><p>Plato (5th-4th cent. B.C.), describing the parts of the human body, wrote of ‘the head which is the most divine part and which reigns (δεσποτέω) over all the parts within us’ (Timaeus 44.D). Plutarch (A.D. 46-120), one of the most prominent Greek authors from the New Testament period (and one who reflected secular thinking independent of Jewish or Christian influence), explained why the words soul (ψυχη) and head (κεφαλή) can be used to speak of the whole person: ‘We affectionately call a person ‘soul’ or ‘head’ from his ruling parts…’ (Table-Talk 692.D.11). Philo (Jewish philosopher, c. 30 B.C.—c. A.D. 45), representing one aspect of first century Judaism, had a similar understanding: ‘As the head in the living body is the ruling place… so Ptolemy became head among kings’ (Life of Moses 2.30). ‘The mind is the head and ruler… of the sense-perception in us’ (Life of Moses 2.82); ‘’Head’ we interpret allegorically to be the ruling… mind of the soul’ (On Dreams 2.207).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-grudem.html">Wayne Grudem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does Kefale</cite>, (‘Head’) Mean ‘Source’ Or ‘Authority Over’ in Greek Literature?: a Survey of 2,336 Examples’ Trinity Journal, no. 6.1 (Spring 1985), pp. 38-59, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-95f09a7369" data-kw="">
<blockquote><p>Yielding by concession, not by confession, that all the [English-Popish] ceremonies about which there is controversy now among us were of old used by the Fathers [of the early Church], yet that which these Formalists say, is (as Parker shows, Of the Cross, ch. 2, section 10) even as if a servant should be covered before his master, not as covering is a late sign of preeminence, but as it was of old a sign of subjection, or as if one should preach that the prelates are tyranni [tyrants] to their brethren, fures [thieves] to the Church, sophistae [sophists] to the truth, and excuse himself thus, ‘I use these words as of old [when] they signified, a ruler, a servant, a student of wisdom.’ All men know that words and actions must be interpreted, used and received according to their modern use, and not as they have been of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 3, pp. 46-47</span></figcaption>

</figure><figure class="quote" id="q-b55a47f3a4" data-kw="">
<blockquote><p>Of the Church of the New Testament, it was prophesied that God would give them one way, as well as one heart, Jer. 32:39, that there shall not only be one Lord, but his Name one, Zech. 14:9. We are exhorted to walk by the same rule, so far as we have attained, that is, to study uniformity, not diversity in those things which are agreed upon to be good and right, Phil. 3:16. Does not the apostle plainly intimate and commend a uniformity in the worship of God, 1 Cor. 14:27… verse 33, for God is not the author of confusion, but of peace, as in all the Churches of the saints, verse 40, ‘Let all things be done decently and in order.’ He limits the prophets to that same number, of two or three, even as he limits those that had the gift of tongues, verse 29. And was it not a great uniformity that he would have every man who prayed or prophesied, to have his head uncovered, and every woman covered, 1 Cor. 11? Does not the same apostle, besides the doctrine of faith and practical duties of a Christian life, deliver several canons to be observed in the ordination and admission of elders and deacons, concerning widows, concerning accusations, admonitions, censures and other things belonging to Church policy, as appears especially from the epistles to Timothy and Titus?… In the ancient Church, although there was not an uniformity in all particulars among all the churches, for instance in the point of fasting: some fasting on the Sabbath, some not, some taking the Lord’s Supper fasting, some after meals, which differences in fasting, gave occasion to the old rule: dissonantia jejunii non dissolvit consonantiam fidei [The dissonance of fasting does not dissolve the concord of the faith]. Although likewise, there was a great difference between the custom of one church and another in the time and manner of celebrating the Lords Supper and in other particulars, as Augustine, Socrates and the author of the Tripartite History record unto us. Yet the Centuries and other ecclesiastical historians show us in every century, a great uniformity in those ancient times, even in very many things belonging to Church government and form of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, … (Edinburgh, 1649), ch. 15, pp. 199-201</span></figcaption>

aith%5D.+Although+likewise%2C+there+was+a+great+difference+between+the+custom+of+one+church+and+another+in+the+time+and+manner+of+celebrating+the+Lords+Supper+and+in+other+particulars%2C+as+Augustine%2C+Socrates+and+the+author+of+the+Tripartite+History+record+unto+us.+Yet+the+Centuries+and+other+ecclesiastical+historians+show+us+in+every+century%2C+a+great+uniformity+in+those+ancient+times%2C+even+in+very+many+things+belonging+to+Church+government+and+form+of+worship.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Treatise+of+Miscellany+Questions%E2%80%A6+%28Edinburgh%2C+1649%29%2C+ch.+15%2C+pp.+199-201&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb55a47f3a4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b55a47f3a4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=Of%20the%20Church%20of%20the%20New,Church%20government%20and%20form%20of%20worship&amp;text=Of%20the%20Church%20of%20the%20New%20Testament%2C%20it&amp;text=belonging%20to%20Church%20government%20and%20form%20of%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

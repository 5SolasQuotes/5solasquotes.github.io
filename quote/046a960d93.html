<main class="wrap"><figure class="quote" id="q-046a960d93" data-kw="">
<blockquote><p>4. It is granted [by the most sober nonconformists] not to be idolatrous. So Mr. [Paul] Baynes: ‘Kneeling is neither an occasion, nor by participation idolatry: Kneeling never bred bread-worship.’ (Christian Letters, Letter 24, p. 201) And [Richard Baxter]: ‘Our doctrine of the sacrament [that one is kneeling to God], known to all the world, does free us from suspicion of adoration in it.’ (Baxter, Christian Directory, p. 616) To these Mr. [John] Tombes [a baptist] adds (Theodulia, p. 256, etc.): ‘1. That the Papists adore not the bread at putting it into their mouths, but at the elevation [of it], it being inconsistent with their principles to worship that which is not above them. 2. That the worship of God not directed to a creature, but before it, as an occasional object of adoration to God, is not idolatry. 3. That yet in the Church of England the elements are not occasionally so, but [rather] the benefits of Christ in the Lord’s Supper [are]. And 4. Kneeling is not to the bread, but as the signification of an humble and grateful mind; as he shows from the rubric [in the Anglican Book of Prayer].’ (T. D., Jerubbaal, p. 41 &amp; Mr. [Zachary] Crofton‘s Answer, p. 28; [William] Ames, Fresh Suit, ch. 4, §4, p. 382; [William] Perkins, Cases) Fifthly, Those that do account it inconvenient, yet account it not to be unlawful. Thus Mr. [Thomas] Cartwright: ‘Kneeling in receiving the sacrament, being incommodious in its own nature, and made far more incommodious by Popish superstition, is not therefore so to be rejected that we should abstain from the sacrament (if we cannot otherwise be partakers of it), because the thing is not in its own nature unlawful.’ (Evangelical Harmony, on Lk. 22:14, etc. Second Reply, p. 262) So it’s said of the old non-conformists: ‘Kneeling at the sacrament was disliked by all, but yet thought tolerable, and that it might be submitted to by some of the most Learned.’ (Troughton, An Apology for the Nonconformists [1681], p. 90) From all which we may conclude with Mr. [Richard] Vines [a Westminster divine], that the posture being a circumstance of action, as well as the time and place, ‘is not of the free-hold of the ordinance’ (On the Sacrament, p. 102); and with Mr. [Richard] Baxter that those that think they must not receive kneeling, ‘think erroneously.’ (Sacrilegious Desertion, p. 19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-williams.html">John Williams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London</cite>, (London, 1685), vol. 1, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’, pp. 73-72 Williams (d. 1709) was an Anglican bishop.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4e59f80931" data-kw="">
<blockquote><p>And for that gesture of stretching out and lifting up hands in prayer (see Ezra 9:5; Ps. 44:20 &amp; 63:4 &amp; 141:2; 1 Tim. 2.8, which was also the preacher of those who were in much sorrow, Jer. 4:31), it is an exercise of the body, witnessing much earnestness and resignation to God, as depending only upon Him. And so it implies that our whole man (even the outward man, whereof the hands are a part, as well as the inward) should be employed in prayer; that we should be fervent and earnest in prayer, not setting about it as a work in the by; that in prayer we should resign and give up ourselves to God, to be at his disposal, without murmuring or disputing; and that we should have all out hope and expectation fixed upon Him in our prayers.</p></blockquote>

</figure><figure class="quote" id="q-e13bf9dfd3" data-kw="">
<blockquote><p>Now, besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship [WCF 1.6]; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections; the rending of the garments signified the rending of the heart by sorrow; standing with a religious suspect [respect] to that which is before us signifies veneration or reverence, sitting at table signifies familiarity and fellowship. For ‘which of you’, says our Master, ‘having a servant ploughing, or feeding cattle, will say unto him by and by, when he is come from the field, Go and sit down to meat?’ (Lk. 17:7) All these signs have their significations from nature.</p></blockquote>

</figure><figure class="quote" id="q-a916fff20e" data-kw="">
<blockquote><p>What ought to be the gesture of him that prays? A diverse gesture is not prescribed, but yet is described in the Scriptures: 1. The Jews in time past did pray somtimes standing, but sometimes with bowed knees, as Solomon and Christ Himself kneeled down and prayed, as also Peter and Stephen; Paul also used bowing of the knees, Eph. 3:14, “For this cause (says he) I bow my knees unto the Father of our Lord Jesus Christ,” by which gesture a lowly subjection, and an emptying of ourselves before God is signified. 2. Moses lifts up his hands towards Heaven, and Paul wills, 1 Tim. 2:8, that pure hands should be lifted up unto God: which gesture belongs unto children who do reach their hand to the parents when they will obtain anything or are suppliant to them. But this ceremony of lifting up of hands does admonish us, that the heart and senses are to be lifted upon high, least they which desire to be heard of God should abide in their dregs, as David interprets Ps. 86:4; 25:1, “Unto Thee O Lord I lift up my soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (1606), p. 416</span></figcaption>

<div class="actions"><button class="copy" data-copy="“What ought to be the gesture of him that prays? A diverse gesture is not prescribed, but yet is described in the Scriptures: 1. The Jews in time past did pray somtimes standing, but sometimes with bowed knees, as Solomon and Christ Himself kneeled down and prayed, as also Peter and Stephen; Paul also used bowing of the knees, Eph. 3:14, “For this cause (says he) I bow my knees unto the Father of our Lord Jesus Christ,” by which gesture a lowly subjection, and an emptying of ourselves before God is signified. 2. Moses lifts up his hands towards Heaven, and Paul wills, 1 Tim. 2:8, that pure hands should be lifted up unto God: which gesture belongs unto children who do reach their hand to the parents when they will obtain anything or are suppliant to them. But this ceremony of lifting up of hands does admonish us, that the heart and senses are to be lifted upon high, least they which desire to be heard of God should abide in their dregs, as David interprets Ps. 86:4; 25:1, “Unto Thee O Lord I lift up my soul.”

— William Bucanus, Institutions of Christian Religion (1606), p. 416">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+ought+to+be+the+gesture+of+him+that+prays%3F+A+diverse+gesture+is+not+prescribed%2C+but+yet+is+described+in+the+Scriptures%3A+1.+The+Jews+in+time+past+did+pray+somtimes+standing%2C+but+sometimes+with+bowed+knees%2C+as+Solomon+and+Christ+Himself+kneeled+down+and+prayed%2C+as+also+Peter+and+Stephen%3B+Paul+also+used+bowing+of+the+knees%2C+Eph.+3%3A14%2C+%E2%80%9CFor+this+cause+%28says+he%29+I+bow+my+knees+unto+the+Father+of+our+Lord+Jesus+Christ%2C%E2%80%9D+by+which+gesture+a+lowly+subjection%2C+and+an+emptying+of+ourselves+before+God+is+signified.+2.+Moses+lifts+up+his+hands+towards+Heaven%2C+and+Paul+wills%2C+1+Tim.+2%3A8%2C+that+pure+hands+should+be+lifted+up+unto+God%3A+which+gesture+belongs+unto+children+who+do+reach+their+hand+to+the+parents+when+they+will+obtain+anything+or+are+suppliant+to+them.+But+this+ceremony+of+lifting+up+of+hands+does+admonish+us%2C+that+the+heart+and+senses+are+to+be+lifted+upon+high%2C+least+they+which+desire+to+be+heard+of+God+should+abide+in+their+dregs%2C+as+David+interprets+Ps.+86%3A4%3B+25%3A1%2C+%E2%80%9CUnto+Thee+O+Lord+I+lift+up+my+soul.%E2%80%9D%0A%0A%E2%80%94+William+Bucanus%2C+Institutions+of+Christian+Religion+%281606%29%2C+p.+416&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa916fff20e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a916fff20e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/posture-in-prayer/#:~:text=What%20ought%20to%20be%20the%20gesture,Lord%20I%20lift%20up%20my%20soul&amp;text=What%20ought%20to%20be%20the%20gesture%20of%20him&amp;text=Thee%20O%20Lord%20I%20lift%20up%20my%20soul" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cf76906b88" data-kw="">
<blockquote><p>But the more private the duties of worship are, the greater latitude is indulged in the external part, or signs of reverence and honor. For though these outward expressions, compositions, or gestures of the body, be the genuine effects of that inward reverence of the mind, and so due to the divine Majesty, yet it is with special reference unto men, that others may see how God is and ought to be feared of his saints. So that such things which are necessary in public worship, are not alway so necessary in private or secret; and that which a person finds to be most advantageous to the right performance of his worship in secret, may not be so expedient in public, because there is not the like reason in both.</p></blockquote>

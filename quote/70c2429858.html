</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05dd0db63e" data-kw="admin">
<blockquote><p>The nature of the things, for since they were still future and prophecies before their fulfillment are wont to be somewhat obscure (at least as to the manner of fulfillment), it is not to be wondered at that at first they were set forth more obscurely and then more clearly, the nearer the time of fulfillment approached. Thus the light increased more and more. There was a progress in revelation: prophet handed on to prophet, and he received the lamp of the gospel by which the church might be illuminated, adding a new measure of light. The same promises are repeated and illustrated. The more the time of fulfillment presses on, the clearer and fuller they become. Before the law given by Moses, the promise was somewhat obscure; from the giving of the law until the times of the prophets less obscure; from the times of the prophets until John the Baptist, clearer; after the preaching of John clear; after the coming of Christ most clear. Thus from the beginning, the Messiah was promised only as the seed of the woman (Gen. 3:15); afterwards as the son of Abraham (Gen. 12:2); to spring from Judah (Gen. 49:10); and in the tribe of Judah from the family of David (2 S. 7:13, 14).</p></blockquote>

<blockquote><p>The communication of grace effectual, producing infallibly the good things proposed and promised in the minds and hearts of men, belonged not unto that covenant. If, therefore, there be no more in the making of the new covenant but only the adding of more forcible outward means and motives, more suitable unto our reasons, and meet to work on our affections, it differs only in some unassignable degrees from the former. But this is directly contrary unto the promise in the prophet, that it shall not be according unto it, or of the same kind.</p></blockquote>

<blockquote><p>appetitus: appetite, desire; specifically, the appetitive faculty or capacity of a being, which seeks out or inclines toward a good. In all spiritual beings, including God, the exercise of will implies appetite. By extension, the propensities of inanimate objects, and even of matter, can be described as appetite… Scholastic theology and philosophy focus in particular upon the appetites of finite spiritual beings, which by nature seek out their own good. Since the fall has caused a deprivation and distortion of desire, a distinction must be made between appetitus rectus, right desire, and appetitus perversus or inordinatus, perverse or inordinate desire. It is characteristic of the desire of sinful beings that it misidentifies the good, particularly ultimate good, and perversely, or inordinately, desires finite things as ends in themselves (see frui). Thus appetitus perversus and appetitus inordinatus (q.v.) are synonyms for sin (peccatum, q.v.). Appetite can be distinguished further into natural appetite (appetitus naturalis), rational or voluntary appetite (appetitus rationalis sive voluntarius), and animal or sensual or sensitive appetite (appetitus animalis sive sensualis; appetitus sensitivus). Natural appetite is simply the nature of any existent thing to be what it is and to perform its proper acts or operations; e.g., human beings have a natural appetite for breathing! The rational or voluntary appetite, also called appetitus intellectualis, intellectual appetite, is the will (voluntas, q.v.). Whereas it is the intellect (intellectus, q.v.) that perceives and knows objects, it is the will that chooses. Since choice belongs to the will, the will must be exercised in the choice of even purely intellectual objects—thus appetitus intellectualis. In addition, since the will and the intellect are not really distinct, but only formally or rationally distinct (see distinctio), the appetitive function of will is also rational (rationalis). Thus the will desires the goodness, truth, and justice known by the intellect… The appetitus animalis sive sensualis or appetitus sensitivus is thus emotion or passion (affectus, passio), and it may be described in terms of the six concupiscible (concupiscibilis, q.v.) passions: love and hate, joy and sadness, desire and aversion; and of the five irascible (irascibilis, q.v.) passions: courage and fear, hope, despair, and anger. This appetite, because of its relation to the body, is usually described as being situated “below” the will in the hierarchy of human faculties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms: Drawn Principally from Protestant Scholastic Theology 1st</cite>, ed. (Baker Academic, 2017), pp. 41-42</span></figcaption>

<blockquote><p>God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfill it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 93</span></figcaption>

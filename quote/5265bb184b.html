<main class="wrap"><figure class="quote" id="q-5265bb184b" data-kw="">
<blockquote><p>3rd Conclusion. A visible profession of the truth and doctrine of godliness is that which essentially constitutes a visible church, and every member of the visible church; Only our [Independent] Brethren and we differ much about the nature of this profession which is required in members added to the Church. Our Brethren will have none members of the visible Church, but such as are satisfactory to the consciences of all the visible church, and give evidences so clear, as the judgement of discerning men can attain unto, that they are truly regenerated. We again do teach that the scandalously wicked are to be cast out of the Church by excommunication, and these of approved piety are undoubtedly members of the visible Church, so these of the middle sort are to be acknowledged members of the Church, though the Church have not a positive certainty of the judgement of charity that they are regenerated, so they be known: 1. to be baptized, 2. that they be free of gross scandals, 3. and profess that they be willing hearers of the doctrine of the Gospel. Such a profession as gives evidences to the positive certainty of the judgment of charity, of sound conversion, is not required to make and constitute a true, visible-Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>3rd Conclusion, pp. 251-255 of Ch. 9, Section 9, ‘Of the Addition of Members to the Church’ in The Due Right of Presbyteries... (1644), pt. 1</cite></span></figcaption>

</figure><figure class="quote" id="q-6dc426196a" data-kw="">
<blockquote><p>Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London: Cockerill, 1681)</cite>, p. 173</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-30eda1a183" data-kw="">
<blockquote><p>A man may administer sacraments where he preaches not, as the apostles baptized, but Christ only preached there. And he that baptized Cornelius and his company, did not preach unto them, but Peter only preached. We read not that the [Greek] or minister, which Paul and Barnabas carried about with them, did preach. A minister may both preach and administer sacraments where he rules not, as Philip to the eunuch, the apostles and the 70 in Christ’s time: and ministers that preach abroad in a journey, or at a lecture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Vindication of the Essence &amp; Unity of the Church catholic, Visible, &amp; the Priority Thereof in Regard of Particular Churches, in Answer to the Objections made Against it… (London, 1650), Question 1, ch. 7</cite>, p. 175</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<main class="wrap"><figure class="quote" id="q-5f317cf4ce" data-kw="">
<blockquote><p>Of what sort of men is election? Of such as are uncleane and ungodly in the sight of God. “For He has chosen us that we might be holy and without blame,” Eph. 1:4. But whereas He chose us before the world was made, it is effected that God set before his eyes all men that ever should be, and for as much as they would be ungodly and accursed, He likewise so considered them and so chose some out of the common lump and filth of men, and those freely according to the good pleasure of his will, leaving others in their sin and curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, (London: 1606), Place 36, ‘Of Predestination’, p. 433</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><figure class="quote" id="q-494727580c" data-kw="">
<blockquote><p>XVI. Moreover, it makes no difference for justification according to the law whether our good works proceed from our own free will or from the power of the Holy Spirit (even though, by the law, the Spirit is not received – Gal. 3:2). For in judgment according to the law, what matters is whether you have done what the law requires as it should be done, not where that obedience came from. Just as in judgment according to the Gospel, what matters is not how faith came about, but whether you believe. Thus, if it were possible for someone, by their own free will and without the work of the Holy Spirit, truly to believe in Christ, he would be just as justified before God as one in whom the Spirit has implanted faith—for with God there is no partiality (Rom. 11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, (1634), p. 4</span></figcaption>

</figure><figure class="quote" id="q-e20e4ab18a" data-kw="">
<blockquote><p>The Lord now and then takes a few, and picks them up through the nations where they are scattered; they were all of the same mass, of the same lump, lying in the same pit; Peter was no better than Judas, nor Judas any worse than Peter; Cain was no worse than Abel, and Abel was no better than Cain, till grace made the difference; when they were in the same womb at the same time, yet, says the Lord, ‘Jacob have I loved, and Esau have I hated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-trail.html">Robert Trail</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eleven Sermons on Important Subjects</cite>, Sermon 1, in Works, vol. 4, pp. 16-17</span></figcaption>

<main class="wrap"><figure class="quote" id="q-0629595fba" data-kw="">
<blockquote><p>Q. Is it unlawful to make an image of the Trinity, or of any Person in the Godhead? It is utterly unlawful, and a great dishonor to figure the incorruptible God by the shape of a base and corruptible man or bird, or other creature. Dt. 4:15-18; Rom. 1:23; Acts 17:24, 29; Isa. 40:15, 18-19; Hab. 2:8. It abuses our understandings: the party thinks there is some good in an image, else he would not make it; and that’s a lie: He lies that shows me a toad and says it is the picture of an angel; so, etc. All the pictures of Christ in the flesh, as that on Christ on the cross and resurrection are lies, false in their representations and false in the conceit of any good by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Principle[s] of Faith &amp; Good Conscience Digested into a Catechetical Form</cite>, … (Oxford: Hall, 1665), ch. 30, pp. 132-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>3. We acknowledge different opinions between Lutherans and Calvinians; so no doubt there are different opinions among the Lutherans themselves, and the Calvinians themselves, but we utterly deny there are different religions. The Lutherans we hold to be true Churches, agreeing with us in the fundamental points of faith, and likewise in being free from idolatry; for albeit they have images in their churches, which we conceive to be a very dangerous thing, yet they do not worship them; and although they hold real presence in the sacrament, yet they do not adore it. So that albeit we think some of their opinions are contrary to the Scripture, and they think the like of some of ours, yet neither we say of their religion, nor they of ours I trow, that it is contrary to the Scripture, much less that it is condemned in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doubting Conscience Resolved, in answer to a</cite>, (pretended) perplexing question, etc. Wherein is evidently proved that the holy Scriptures (not the Pope) is the foundation whereupon the Church is built (London: 1652), pp. 27-28</span></figcaption>

="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-eb69c2ef5b" data-kw="">
<blockquote><p>Representations of God, Angels, and Saints.; Copes, Surplisses, Roods, etc.; Organs. The Lords and Commons assembled in Parliament, the better to accomplish the blessed Reformation so happily begun, and to remove all offences and things illegal in the worship of God, do Ordain, That all Representations of any of the Persons of the Trinity, or of any Angel or Saint, in or about any Cathedral, Collegiate or Parish Church, or Chapel, or in any open place within this Kingdom, shall be taken away, defaced, and utterly demolished; And that no such shall hereafter be set up, And that the Chancel-ground of every such Church or Chapel, raised for any altar, or Communion Table to stand upon, shall be laid down and leveled; And that no copes, surplisses, superstitious vestments, roods, or roodlons, holy-water fonts, shall be, or be any more used in any Church or Chapel within this realm; And that no cross, crucifix, picture, or representation of any of the Persons of the Trinity, or of any angel or saint shall be, or continue upon any plate, or other thing used, or to be used in or about the worship of God; And that all organs, and the frames or cases wherein they stand in all Churches or Chapels aforesaid, shall be taken away, and utterly defaced, and none other hereafter set up in their places; and that all copes, surplisses, superstitious vestments, roods, and fonts aforesaid, be likewise utterly defaced; whereunto all persons within this Kingdom, whom it may concern, are hereby required at their peril to yield due obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-parliament.html">English Parliament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Ordinance for the Further Demolishing of Monuments of Idolatry &amp; Superstition’</cite></span></figcaption>

</figure><figure class="quote" id="q-05e609474e" data-kw="">
<blockquote><p>It is not lawful to have pictures of Jesus Christ, because his divine nature cannot be pictured at all, and because his body, as it is now glorified, cannot be pictured as it is; and because, if it do not stir up devotion, it is in vain; if it do stir up devotion, it is a worshipping by an image or picture, and so a palpable breach of the Second Commandment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-vincent.html">Thomas Vincent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explanation of the Assembly’s Shorter Catechism</cite>, (Philadelphia: Presbyterian Board of Publication, n.d.), p. 162</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-4d7f690453" data-kw="">
<blockquote><p>The replier to Dr. Mourton’s Particular Defence, observes (ch. 1, section 3), that this superstition about apparel in divine worship began first among the Frensh bishops, unto whom Caelestinus writes thus. Discernendi, etc. ‘We are to be distinguished from the common people and others by doctrine, not by garment, by conversation, not by habit [one’s dress], by the purity of mind, not by attire: for if we study to innovation, we tread underfoot the order which has been delivered unto us by our fathers, to make place to idle superstitions; wherefore we ought not lead the minds of the faithful into such things: for they are rather to be instructed than played withal: neither are we to blind and beguile their eyes, but to infuse instructions into their minds.’ In which words Caelestinus reprehends this apparel, as a novelty which tended to superstition, and made way to the mocking and deceiving of the faithful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 47.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

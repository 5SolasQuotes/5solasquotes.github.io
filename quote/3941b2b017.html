<main class="wrap"><figure class="quote" id="q-3941b2b017" data-kw="">
<blockquote><p>…this accommodation is not impossible: if indeed it were, God does not bind us to the seeking after it… If we look upon the nature of the things wherein they differ, they are not of such moment as to divide between brethren; their differences are not about fundamentals, but superstructures: there is no opinion expressly maintained by either side which is directly contrary to the substance of faith, or destructive to salvation; nay, whatever are such, they are condemned by both. Nor [is] the difference in those matters wherein they differ so wide but they may be composed and brought together, if men will act humility and self-denial. It was said of the differences between Luther and the [reformed] Helvetians, that there was not any impossibility in respect of the things themselves; if their spirits could be reconciled, their causes might easily be reconciled… where the difference is substantial, I do not see but if humility and self-denial might take place, if interests might be waved, if pre-engagements might be slighted, even in those things there might be an agreement; certainly, God does not make the difference so great as we ourselves do make it… It was the speech of one concerning the reconciliation of the German Churches: It is possible for the most hot and rigorous spirits to be reconciled, but it is easy for peaceable and moderate men to be agreed. The differences are not between enemies, but between brethren, and neither of them proud, imperious and contentious, but both of them humble, holy and peaceable…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, (London: Miller, 1646), pp. 349–50</span></figcaption>

<blockquote><p>…we must prove ourselves the true Church of God: Thus we do it: We are true Christians, for we were baptized into the name of Christ; we truly profess our continuance in the same faith, into which we were baptized: we join together in the public services of God: we maintain every point of the most ancient Creeds: we overthrow not the foundation by any consequence; Therefore whateuer is wanting to us, whatever is superfluous, in spite of all the gates of Hell, we are the true Church of God.</p></blockquote>

<blockquote><p>The true matter of a true church is such as profess saving truth taught in the Scriptures, and [this] is proved thus: That which makes a man a true member of a true church, that does make a true church (for members doe constitute the whole): but profession of saving truth makes a true member of a true church; for Simon Magus, upon his profession was admitted a member, till he fell away (Acts 8:13, 37, 38): and the eunuch upon the same profession was admitted too by baptism, and for ought we know continued forever. Now, that we in the church of England do profess saving truth, according to the Scriptures cannot be denied.</p></blockquote>

</figure><figure class="quote" id="q-59f4961e43" data-kw="">
<blockquote><p>§34. II. So much for what is necessary to the being of the sacred office: Now what is necessary to the well-being. And indeed, though the essential unity of the Church lie not upon this, yet the peace and concord of it does, and that so much as that no other means without this will attain it: And the want of what is necessary ad bene esse in the ministry and bishops [or ministers], is it that has caused the common calamities. §35. And I. Nothing is more wanting hereto than better qualifications in the persons: 1. That there be a strong wit, and good acquired gifts of knowledge, and a strong and lively faith from divine illumination, and good acquaintance with the oracles of God: A pastor or teacher should not only know the essentials of Christianity, which every Christian knows, but also the integrals [things that complete the whole of Christianity] and many accidents. And both essentials and integrals should be known by him by a more clear, distinct and orderly understanding, not only above the vulgus fidelium, (common Christians) but above the better sort of the flock. And some store of natural and common knowledge called learning is needful hereunto: But especially more illumination, faith and holy wisdom and skilfulness in matter, sense and method of the Word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms</cite>, (London: Hancock, 1680), pt. 2, ch. 5, ‘What are the terms necessary to the office and exercise of the sacred ministry?’, pp. 218-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-b016abb8db" data-kw="">
<blockquote><p>Reason 1. Because no man ought to separate himself from the true Church of Christ: Now such is an assembly professing the true faith, notwithstanding other corruption; for as holiness, if it might be supposed without true faith, cannot make a true Church, but false doctrine and error in the foundation overthrows it for being a Church: So e contra [from the contrary], corruptions in manners cannot make it no Church, when true faith is taught and maintained.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

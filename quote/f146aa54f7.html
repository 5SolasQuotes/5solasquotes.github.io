<blockquote><p>The brief text… will address… the following points: 1. The historical development of infinity as a divine attribute; 2. The teaching of Thomas Aquinas on divine infinity; 3. A philosophical appraisal of this teaching; 4. An appraisal of this teaching from the point of view of Christian faith; 5. Some remarks on alternative positions – especially on process theism and a non-theistic stance – in view of a critical dialogue.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c258ff2198" data-kw="">
<blockquote><p>Sufficiently therefore the threefold way is explained in which we concede Christ as He is man, reigns everywhere with the Father: and in the first place [in primis], in his elect. First, indeed, by the virture, power and wisdom of his deity and divine nature. Next, by his Spirit and the gifts and effects of his Spirit. Lastly, by the fellowship even of his body and blood produced through the Holy Spirit.</p></blockquote>

</figure><figure class="quote" id="q-39e752de40" data-kw="">
<blockquote><p>The affirmation of God as transcending all such distinction… is not an admission that God’s being is contentless, however, but, on the contrary, the ascription to him of the very plenitude of all content. He is this actual plenitude nonetheless in a way that remains unknown and unknowable, i.e., though affirmed by way of concepts and from a perspective provided by man’s concepts, he is not properly represented in any concept. To admit there could be a concept of God is to admit that his essence is something other than the act of being (esse)… Thus, God is what he is in a way that cannot be properly grasped in a concept because the latter expresses only a mode of being. … The determinateness of God, far from being exclusive of other determinations, is all-embracing in a unity transcendent to the rich diversity of the finite. All that is excluded is what pertains not to beings as such, but to their diminished or defective states, to being as it suffers privation in its finite instances with such sequelae to finitude as, e.g., evil. This is but to say: God is wholly infinite and nowise finite.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-j-hill.html">William J. Hill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘In What Sense is God Infinite? A Thomistic View’ in The Thomist XLII (1978), pp. 14-27</cite>, pp. 17-18</span></figcaption>

<blockquote><p>both in Plato and in Aristotle infinity is associated with the realm of the ‘more-or-Iess,’ with indefiniteness and consequently with imperfection. The First Unmoved Mover is infinite only as to his power insofar as it is the cause of an endless circular motion.</p></blockquote>

</figure><figure class="quote" id="q-ea4e2273a8" data-kw="">
<blockquote><p>The most fundamental reason [for Thomas] why God’s perfection is infinite is that act is limited only insofar as it is received in a potency. ‘But God is act in no way existing in another, for neither is He a form in matter… nor does His esse inhere in some form or nature, since He is His own esse… It remains, then, that God is infinite” (prgr. 5). In other words: “…God, Who is pure act (actus purus) is infinite in His actuality (in sua actualitate)” (prgr. 6). He possesses esse, goodness, perfection not as participated, but by essence (his very esse in His goodness) and, therefore, He is infinite in goodness (prgr. 8-9). A further argument… proceeds from the fact that our ‘intellect… extends to the infinite in understanding…. But this ordination of the intellect would be in vain unless an infinite intelligible existed” (prgr. 10).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-l-balas.html">David L. Balas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Thomist View on Divine Infinity’ in Proceedings of the American Catholic Philosophical Association, vol. 55 (1981), pp. 91-98</cite>, pp. 93-94</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/infinity-and-immensity.html">Infinity and Immensity</a></span></div>

<main class="wrap"><figure class="quote" id="q-09094bc7fc" data-kw="">
<blockquote><p>The Offering of Christ once made is that perfect redemption, propitiation, and satisfaction, for all the sins of the whole world, both original and actual; and there is none other satisfaction for sin, but that alone. Wherefore the sacrifices of Masses, in the which it was commonly said, that the Priest did offer Christ for the quick and the dead, to have remission of pain or guilt, were blasphemous fables, and dangerous deceits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/the-mass.html">The mass</a></span><span class="t"><a href="../topics/rome/last-things.html">Rome: Last Things</a> › <a href="../topics/rome/last-things/prayers-for-the-dead.html">Prayers for the dead</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-238d37b732" data-kw="">
<blockquote><p>&quot;Faith had in the Sacraments,&quot; saith Augustine, &quot;doth justify, and not the Sacraments.&quot; And Origen saith, &quot;Christ is the Priest, the Propitiation, and Sacrifice: which Propitiation cometh to every one by means of faith.&quot; So that by this reckoning, we say that the Sacraments of Christ without faith do not once profit these that be alive; a great deal less do they profit those that be dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

</figure><figure class="quote" id="q-89510b8bf5" data-kw="">
<blockquote><p>So with respect to the Antichrist, it is most appropriate he be traced back to the idolatry of Rome, for he honors and worships the wafer-God of the Mass, who was truly unknown to the Fathers. Indeed, he worships the Angels and the Saints as protectors, helpers, and defenders, honoring them magnificently with gold, silver and precious things, in ornate external displays, and by building immense shrines for their veneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist.html">Antichrist</a> › <a href="../topics/the-return-of-christ-antichrist-and-the-millennium/antichrist/the-papacy-as-antichrist.html">The papacy as Antichrist</a></span><span class="t"><a href="../topics/the-lords-supper/the-mass.html">The Mass</a> › <a href="../topics/the-lords-supper/the-mass/adoration-of-the-host.html">Adoration of the host</a></span><span class="t"><a href="../topics/rome/sacraments.html">Rome: Sacraments</a> › <a href="../topics/rome/sacraments/the-mass.html">The mass</a></span></div>

</figure><figure class="quote" id="q-d421357274" data-kw="Auricular confession">
<blockquote><p>It is not strange, therefore, that we condemn that auricular confession, as a thing pestilent in its nature, and in many ways injurious to the Church, and desire to see it abolished. But if the thing were in itself indifferent, yet, seeing it is of no use or benefit, and has given occasion to so much impiety, blasphemy, and error, who does not think that it ought to be immediately abolished?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.4.19</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is not strange, therefore, that we condemn that auricular confession, as a thing pestilent in its nature, and in many ways injurious to the Church, and desire to see it abolished. But if the thing were in itself indifferent, yet, seeing it is of no use or benefit, and has given occasion to so much impiety, blasphemy, and error, who does not think that it ought to be immediately abolished?”

— John Calvin, Institutes of the Christian Religion, 3.4.19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+not+strange%2C+therefore%2C+that+we+condemn+that+auricular+confession%2C+as+a+thing+pestilent+in+its+nature%2C+and+in+many+ways+injurious+to+the+Church%2C+and+desire+to+see+it+abolished.+But+if+the+thing+were+in+itself+indifferent%2C+yet%2C+seeing+it+is+of+no+use+or+benefit%2C+and+has+given+occasion+to+so+much+impiety%2C+blasphemy%2C+and+error%2C+who+does+not+think+that+it+ought+to+be+immediately+abolished%3F%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+3.4.19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd421357274.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d421357274.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-ff93b48a27" data-kw="">
<blockquote><p>Hence Romanists and Ritualists have inferred that the sign is inseparable from the grace signified, and that these spiritual effects are due to the outward ordinance. Hence the doctrine of baptismal regeneration. But it must be observed that the Scriptures do not assert these spiritual attributes of water baptism in itself considered, but of water baptism as the sign or emblem of baptism by the holy Ghost. These spiritual attributes belong only to baptism by the Spirit, and they accompany the sign only when the sign is accompanied by that which it signifies. It does not follow, however, that the sign is inseparable from the grace. The grace is sovereign; and experience teaches us that it is often absent from the sign, and that the sign is least frequently honoured by the presence of the grace when it is itself most implicitly relied upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, chs. 27–28 (on baptismal regeneration)</span></figcaption>

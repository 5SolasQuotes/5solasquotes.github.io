<blockquote><p>XXI… Rulers have authority to command that which is good, though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined…º And it’s to us a lawful circumstance, because [it is] necessary to concord and [is] commanded, though mistakingly. XXII. We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us. … XXIV. We never judged needless affected singularity a duty, but judge it best in lawful things for concord’s sake to conform to the custom of the Churches where we live or come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (London, 1689), ch. 2</cite>, pp. 11-16</span></figcaption>

</figure><figure class="quote" id="q-6c144e8327" data-kw="">
<blockquote><p>Some corruptions incident to God’s Church and worship I say are substantial and intrinsic (not arising out of God’s ordinance as the genuine product and effect thereof, but) entering into the very body of the Church and substance of God’s worship, as a spider into wine or venomous worm into an apple; so as to vitiate the subject (that it cannot be used with safety) and nullify the very ordinances of God, that it alters their very nature to the loss of their efficacy, and transmits certain destruction to such as sit under the same; Yea, which is done either by changing the matter and retaining the essential constitutive form, as by a solemn, regular cutting off a dog’s head or offering swine’s blood instead of a lamb or a kid, a baptizing (as some have done) by fire instead of water: Or retaining the matter, but changing the essential form, as did Jeroboam and the Samaritans worshipping the true God by the very sacrifices and in the very order Himself appointed, but before self-devised symbols, calves to the one and the dove to the other, in a self-appointed place, Dan and Bersheba to the one, Mount Gerizim to the other, and by self-consecrated priests, the lowest of the people, and so departing from the Temple in Jerusalem, God’s ark in it and the Tribe of Levi: all which were essential to the form of divine worship: And thus did the Corinthians eating and drinking at the idol sacrifices, which the apostle severely corrected, with a ‘ye cannot partake of the Table of the Lord and the table of devils…’ [1 Cor. 10:21] and by pointing them unto the essential form of the Sacrament, ‘the cup of blessing, which we bless, is it not the communion of the blood of Christ?…’ [1 Cor. 10:16] Of this nature is baptism by a midwife, or any other private hand, though with water and in the name of the Father, Son and holy Ghost; or by water and a lawful minister, but in the name of God the Father of all things and Truth the Mother of all things; as I have read some have done. Corruptions extrinsic and circumstantial are ordinances superadded unto, and so concomitant with, or conversant about God’s ordinances; but enter not into, nor do vitiate their subject: the which (these notwithstanding) do exist in matter, and essential form, perfect and entire, capable of due operation in their own course and nature, as stinking fish does nourish, or water puddled or in an unclean vessel does quench the thirst; And these are either some matter superadded (not intermingled with, or destructive to God’s ordinances), such as were the high places, posts by God’s posts, thresholds by his thresholds, altar by his altar in Israel, unto the very image of jealousy set up in God’s house, which yet remained his and as such was continued, preserved and acknowledged. The Lord Jesus found the Temple his Father’s house of prayer, though made a den of thieves; and such is our cross in baptism, though seemingly sacramental, yet distinct from God’s imitating seal of the Covenant; and such is a Roman linen vesture in ministration of God’s worship by a lawful minister, or some corrupt, rude and unsuitable ministerial method and order (which is the vessel, and only instrument of conveyance though unclean) of administration: Such was the violent, and unfitting snatching of the priests’ part of the sacrifice by the sons of Eli, the confused acclamations of the Church of Corinth, speaking all at once, different matters in different tongues; and our [Anglican] imposed method, disorderly method of public prayer, by versicles, responds, abruptions, abreviations and popular acclamations, with artificial singing by boys and base fellows thereunto appointed: under all which God’s ordinances abide a subject complete, truly and formerly existent and distinct from these superadded corruptions, operative unto salvation, and therefore [they] may not be declined, or disowned. Corruptions intrinsic are indeed such as do not only warrant, but necessitate non-communion, yea separation of the highest nature as a duty indispensable: In sense hereof all those in Israel who feared God and set their hearts to seek the Lord, prayed for, and (according to divine directions) departed from Dan and Bersheba, forsook the solemn assemblies Jeroboam had constituted and followed the Tribe of Levi, God’s only ministers, unto Jerusalem, God’s only place of public solemn worship; And our Savior resolved the woman of Samaria her enquiry concerning the place of worship with a ‘ye know not what ye worship; for salvation is of the Jews.’ [Jn. 4:22] This is the very ground of the Reformed Church’s departure and non-communion with Rome, who though she be (by original constitution) the Temple of God, is become the very seat of Antichrist; and by the same so vitiated that her ministrations are the cup of abomination… [she has] nullified Christ’s ordinances: and (by many other intrinsic evils) poisoned God’s whole worship and rendered it directly destructive to salvation… and so [she is] the object of our departure, advised with a ‘lest ye partake of her sins:’ [Rev. 18:4] which were and are so universally diffused, and has so far vitiated the subject, that a guilt will be contracted by mere communion. Corruptions extrinsic may and must grieve the spirits of God’s people, occasion their loud complaints, his ministers most zealous reproofs, and the studious endeavors of all to prevent and remove them; because scandals to the Church, prejudicial (though not directly destructive, to salvation) dishonorable to religion, and the God (whose prerogative it is to prescribe every pin and the very snuffers to be used in his House) and is therefore highly displeasing to God; provoking Him to rend a Kingdom from the house of David [1 Kings 11:1-13], to loathe and at last to leave his holy place, and remove his candlestick from such as will not fear Him in the simplicity of his own institutions without the vain and needless appendants of their own inventions: But yet these cannot warrant separation or voluntary non-communion, because the Church abides related to God as his Spouse; his worship and ordinances remain for matter and essential form entire and exactly his own; notwithstanding the concomitancy of some superadded matter; or the unfit ministerial method and order by which they are dispensed; and God’s presence is to them continued (though with a grieved, striving Spirit, threatening his departure) and thereby we are under a possibility of salvation (though engaged to more care and industry); This was the case of the prophets, our Savior and his disciples, the Church of the Jews and primitive Christians under the many parallel (yea transcending to ours) corruptions before mentioned, without any prescript or practice of separation or non-communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</cite>, pp. 20-23</span></figcaption>

their own inventions: But yet these cannot warrant separation or voluntary non-communion, because the Church abides related to God as his Spouse; his worship and ordinances remain for matter and essential form entire and exactly his own; notwithstanding the concomitancy of some superadded matter; or the unfit ministerial method and order by which they are dispensed; and God’s presence is to them continued (though with a grieved, striving Spirit, threatening his departure) and thereby we are under a possibility of salvation (though engaged to more care and industry); This was the case of the prophets, our Savior and his disciples, the Church of the Jews and primitive Christians under the many parallel (yea transcending to ours) corruptions before mentioned, without any prescript or practice of separation or non-communion.”

— Zachary Crofton, Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., pp. 20-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSome+corruptions+incident+to+God%E2%80%99s+Church+and+worship+I+say+are+substantial+and+intrinsic+%28not+arising+out+of+God%E2%80%99s+ordinance+as+the+genuine+product+and+effect+thereof%2C+but%29+entering+into+the+very+body+of+the+Church+and+substance+of+God%E2%80%99s+worship%2C+as+a+spider+into+wine+or+venomous+worm+into+an+apple%3B+so+as+to+vitiate+the+subject+%28that+it+cannot+be+used+with+safety%29+and+nullify+the+very+ordinances+of+God%2C+that+it+alters+their+very+nature+to+the+loss+of+their+efficacy%2C+and+transmits+certain+destruction+to+such+as+sit+under+the+same%3B+Yea%2C+which+is+done+either+by+changing+the+matter+and+retaining+the+essential+constitutive+form%2C+as+by+a+solemn%2C+regular+cutting+off+a+dog%E2%80%99s+head+or+offering+swine%E2%80%99s+blood+instead+of+a+lamb+or+a+kid%2C+a+baptizing+%28as+some+have+done%29+by+fire+instead+of+water%3A+Or+retaining+the+matter%2C+but+changing+the+essential+form%2C+as+did+Jeroboam+and+the+Samaritans+worshipping+the+true+God+by+the+very+sacrifices+and+in+the+very+order+Himself+appointed%2C+but+before+self-devised+symbols%2C+calves+to+the+one+and+the+dove+to+the+other%2C+in+a+self-appointed+place%2C+Dan+and+Bersheba+to+the+one%2C+Mount+Gerizim+to+the+other%2C+and+by+self-consecrated+priests%2C+the+lowest+of+the+people%2C+and+so+departing+from+the+Temple+in+Jerusalem%2C+God%E2%80%99s+ark+in+it+and+the+Tribe+of+Levi%3A+all+which+were+essential+to+the+form+of+divine+worship%3A+And+thus+did+the+Corinthians+eating+and+drinking+at+the+idol+sacrifices%2C+which+the+apostle+severely+corrected%2C+with+a+%E2%80%98ye+cannot+partake+of+the+Table+of+the+Lord+and+the+table+of+devils%E2%80%A6%E2%80%99+%5B1+Cor.+10%3A21%5D+and+by+pointing+them+unto+the+essential+form+of+the+Sacrament%2C+%E2%80%98the+cup+of+blessing%2C+which+we+bless%2C+is+it+not+the+communion+of+the+blood+of+Christ%3F%E2%80%A6%E2%80%99+%5B1+Cor.+10%3A16%5D+Of+this+nature+is+baptism+by+a+midwife%2C+or+any+other+private+hand%2C+though+with+water+and+in+the+name+of+the+Father%2C+Son+and+holy+Ghost%3B+or+by+water+and+a+lawful+minister%2C+but+in+the+name+of+God+the+Father+of+all+things+and+Truth+the+Mother+of+all+things%3B+as+I+have+read+some+have+done.+Corruptions+extrinsic+and+circumstantial+are+ordinances+superadded+unto%2C+and+so+concomitant+with%2C+or+conversant+about+God%E2%80%99s+ordinances%3B+but+enter+not+into%2C+nor+do+vitiate+their+subject%3A+the+which+%28these+notwithstanding%29+do+exist+in+matter%2C+and+essential+form%2C+perfect+and+entire%2C+capable+of+due+operation+in+their+own+course+and+nature%2C+as+stinking+fish+does+nourish%2C+or+water+puddled+or+in+an+unclean+vessel+does+quench+the+thirst%3B+And+these+are+either+some+matter+superadded+%28not+intermingled+with%2C+or+destructive+to+God%E2%80%99s+ordinances%29%2C+such+as+were+the+high+places%2C+posts+by+God%E2%80%99s+posts%2C+thresholds+by+his+thresholds%2C+altar+by+his+altar+in+Israel%2C+unto+the+very+image+of+jealousy+set+up+in+God%E2%80%99s+house%2C+which+yet+remained+his+and+as+such+was+continued%2C+preserved+and+acknowledged.+The+Lord+Jesus+found+the+Temple+his+Father%E2%80%99s+house+of+prayer%2C+though+made+a+den+of+thieves%3B+and+such+is+our+cross+in+baptism%2C+though+seemingly+sacramental%2C+yet+distinct+from+God%E2%80%99s+imitating+seal+of+the+Covenant%3B+and+such+is+a+Roman+linen+vesture+in+ministration+of+God%E2%80%99s+worship+by+a+lawful+minister%2C+or+some+corrupt%2C+rude+and+unsuitable+ministerial+method+and+order+%28which+is+the+vessel%2C+and+only+instrument+of+conveyance+though+unclean%29+of+administration%3A+Such+was+the+violent%2C+and+unfitting+snatching+of+the+priests%E2%80%99+part+of+the+sacrifice+by+the+sons+of+Eli%2C+the+confused+acclamations+of+the+Church+of+Corinth%2C+speaking+all+at+once%2C+different+matters+in+different+tongues%3B+and+our+%5BAnglican%5D+imposed+method%2C+disorderly+method+of+public+prayer%2C+by+versicles%2C+responds%2C+abruptions%2C+abreviations+and+popular+acclamations%2C+with+artificial+singing+by+boys+and+base+fellows+thereunto+appointed%3A+under+all+which+God%E2%80%99s+ordinances+abide+a+subject+complete%2C+truly+and+formerly+existent+and+distinct+from+these+superadded+corruptions%2C+operative+unto+salvation%2C+and+therefore+%5Bthey%5D+may+not+be+declined%2C+or+disowned.+Corruptions+intrinsic+are+indeed+such+as+do+not+only+warrant%2C+but+necessitate+non-communion%2C+yea+separation+of+the+highest+nature+as+a+duty+indispensable%3A+In+sense+hereof+all+those+in+Israel+who+feared+God+and+set+their+hearts+to+seek+the+Lord%2C+prayed+for%2C+and+%28according+to+divine+directions%29+departed+from+Dan+and+Bersheba%2C+forsook+the+solemn+assemblies+Jeroboam+had+constituted+and+followed+the+Tribe+of+Levi%2C+God%E2%80%99s+only+ministers%2C+unto+Jerusalem%2C+God%E2%80%99s+only+place+of+public+solemn+worship%3B+And+our+Savior+resolved+the+woman+of+Samaria+her+enquiry+concerning+the+place+of+worship+with+a+%E2%80%98ye+know+not+what+ye+worship%3B+for+salvation+is+of+the+Jews.%E2%80%99+%5BJn.+4%3A22%5D+This+is+the+very+ground+of+the+Reformed+Church%E2%80%99s+departure+and+non-communion+with+Rome%2C+who+though+she+be+%28by+original+constitution%29+the+Temple+of+God%2C+is+become+the+very+seat+of+Antichrist%3B+and+by+the+same+so+vitiated+that+her+ministrations+are+the+cup+of+abomination%E2%80%A6+%5Bshe+has%5D+nullified+Christ%E2%80%99s+ordinances%3A+and+%28by+many+other+intrinsic+evils%29+poisoned+God%E2%80%99s+whole+worship+and+rendered+it+directly+destructive+to+salvation%E2%80%A6+and+so+%5Bshe+is%5D+the+object+of+our+departure%2C+advised+with+a+%E2%80%98lest+ye+partake+of+her+sins%3A%E2%80%99+%5BRev.+18%3A4%5D+which+were+and+are+so+universally+diffused%2C+and+has+so+far+vitiated+the+subject%2C+that+a+guilt+will+be+contracted+by+mere+communion.+Corruptions+extrinsic+may+and+must+grieve+the+spirits+of+God%E2%80%99s+people%2C+occasion+their+loud+complaints%2C+his+ministers+most+zealous+reproofs%2C+and+the+studious+endeavors+of+all+to+prevent+and+remove+them%3B+because+scandals+to+the+Church%2C+prejudicial+%28though+not+directly+destructive%2C+to+salvation%29+dishonorable+to+religion%2C+and+the+God+%28whose+prerogative+it+is+to+prescribe+every+pin+and+the+very+snuffers+to+be+used+in+his+House%29+and+is+therefore+highly+displeasing+to+God%3B+provoking+Him+to+rend+a+Kingdom+from+the+house+of+David+%5B1+Kings+11%3A1-13%5D%2C+to+loathe+and+at+last+to+leave+his+holy+place%2C+and+remove+his+candlestick+from+such+as+will+not+fear+Him+in+the+simplicity+of+his+own+institutions+without+the+vain+and+needless+appendants+of+their+own+inventions%3A+But+yet+these+cannot+warrant+separation+or+voluntary+non-communion%2C+because+the+Church+abides+related+to+God+as+his+Spouse%3B+his+worship+and+ordinances+remain+for+matter+and+essential+form+entire+and+exactly+his+own%3B+notwithstanding+the+concomitancy+of+some+superadded+matter%3B+or+the+unfit+ministerial+method+and+order+by+which+they+are+dispensed%3B+and+God%E2%80%99s+presence+is+to+them+continued+%28though+with+a+grieved%2C+striving+Spirit%2C+threatening+his+departure%29+and+thereby+we+are+under+a+possibility+of+salvation+%28though+engaged+to+more+care+and+industry%29%3B+This+was+the+case+of+the+prophets%2C+our+Savior+and+his+disciples%2C+the+Church+of+the+Jews+and+primitive+Christians+under+the+many+parallel+%28yea+transcending+to+ours%29+corruptions+before+mentioned%2C+without+any+prescript+or+practice+of+separation+or+non-communion.%E2%80%9D%0A%0A%E2%80%94+Zachary+Crofton%2C+Reformation%2C+Not+Separation%2C+or%2C+Mr.+Crofton%E2%80%99s+Plea+for+Communion+with+the+Church%E2%80%A6+in+a+Letter%2C+written+July+20%2C+1661%E2%80%A6+%281662%29+Crofton+%281626-1672%29+was+a+presbyterian+and+puritan+born+and+raised+in+Ireland.%2C+ <blockquote><p>Go to the Word of God, look what is written; and then the Lord will accept the service, when thou strivest to come near the commandment. See what is punctually required, and then diligently set thyself awork. The Lord will accept weak endeavors, so they be suitable to the command; so you do but endeavour to perform what is written, the Lord will accept it more than all the pomp and outside of those that would supererogate in the outward part… lookest to what God requires; though thou dost not come near it but in thy purposes and desires, the Lord will accept thee. All that the faithful could say for themselves in the prophet was, ‘The desire of our soul is to thy name, and to the remembrance of Thee,’ Isa. 26:8. And all that Nehemiah could urge for the best Jews was that they did desire to fear God’s name, Neh. 1:11. I say, see thou hast prepared to meet the Lord in his own ordinances, and wouldest feign do what is written: remember the death of the Lord Jesus after the due order and right manner, then the Lord will be pleased with thy sacrifice.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c9e1276a9a" data-kw="">
<blockquote><p>First, that it does not follow necessarily that whosoever has that taste there mentioned [in 1 Pet. 2:3] shall not be saved: for men may have that taste, and finding it ineffectual, go on till they find a true taste: That taste is dangerous if men fall away, else there may be good use of those tastes: For it brings men near the kingdom of God and makes preparation for true grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Three First Chapters of the First Epistle General of St. Peter… (London: Miles, 1637) | on 1 Pet. 2:3</cite>, p. 244</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72ef6304b8" data-kw="">
<blockquote><p>The persons called by God, who yet are not chosen, are of two sorts, as you heard: First, those, who, though so graciously invited, do yet obstinately and peremptorily refuse, and these are actively only called on God’s part. The second sort is of those who do give consent, and yield to their call, but because they do not rise up fully to all that is required, therefore they are cast away. In this [latter] rank is the man, who being invited, made no opposition or excuse, but went in and sat down at the feast, was as confident as the other guests, seems to be conscious to himself of no fault, but having no wedding garment, the master is so wroth and displeased with him, that he is adjudged to everlasting torments; and from this instance our Savior gathers this conclusion in the text [circa Mt. 22:14]; so that the meaning is: Of those many that are called , and give a general acceptance of it, yet few are chosen to eternal glory: Those enjoy the feast of the ordinances here, who are to be tormented for ever hereafter; those are admitted to eat in God’s presence here, who shall be commanded to depart from Him hereafter, He knows them not: Many are admitted into the temple that may not enter into the holiest of holies… That men did receive the truth as to some particulars and some degrees, but not wholly and thoroughly… Thou receivest Christ and his ways but in parcels, though thou hast baptism, the title of a Christian, sittest down at the ordinances, yet where is the wedding-garment! where is the conversation that does agree and belong to so holy a matter? To open this doctrine, let us consider: First, Wherein lies this outward obedience to God’s call, which yet is ineffectual; for can anything more concern you than that you should not be Christians in vain? that all thy praying and frequenting of holy duties may not be in vain? that God may not take thee from this feast, as Haman was from his in which he so much boasted, to be put into confusion and everlasting fear?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining... (London: Miller, 1652), sermon 119, on Mt. 22:14</cite>, pp. 632-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

</figure><figure class="quote" id="q-06ea2b0dbe" data-kw="">
<blockquote><p>Fifthly, if thou art a holy person, if thou art one that hast that real holiness without which there is no happiness, then know for thy comfort, that thy holiness is a glorious witness and evidence of thy effectual vocation, 1 Pet. 1:15, ‘As He who hath called you is holy, so be ye holy in all manner of conversation.’ Many are externally called that are not internally called, and many are ineffectually called that are not effectually called. But now real holiness that speaks out an internal call, an effectual call, a call out of darkness into marvelous light… The Author of this call is a holy God; our holy calling depends upon the purpose of God, the power of God, and the grace and good pleasure of God; the means of our holy calling are the Spirit of God and the Word of God; and the ends of our calling are holiness and the glory of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity, or Holiness, the only way to happiness, discovered in 58 Sermons... (London: Crips, 1662), The Necessity, Excellency, Rarity &amp; Beauty of Holiness, Use 3</cite>, pp. 623-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/external-and-internal-call.html">External and Internal Call</a></span></div>

 it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-85efbc18ea" data-kw="">
<blockquote><p>Q. 1. What makes the difference between effectual and ineffectual calling? A. Ineffectual calling is when men have nothing but the external sound of the Gospel. Mt. 20:16, ‘For many be called, and few chosen.’ Effectual is, when the Spirit works in conjunction with the Word. Jn. 6:45: ‘It is written in the prophets, ‘And they shall be all taught of God;’ every man therefore that has heard, and has learned of the Father, comes unto Me.’ … Q. 11. What is the third instruction? A. It is dangerous to refuse God’s call. Prov. 1:24, ‘Because I have called, and ye refused; I have stretched out my hand and no man regarded.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the [Westminster] Assembly’s Catechism... (London: Cockerill, 1682), ‘Of Effectual Calling’</cite>, pp. 67-68</span></figcaption>

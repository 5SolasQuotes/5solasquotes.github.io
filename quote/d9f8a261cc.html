<blockquote><p>…when the Gospel is come to a people, if the question be, what gives to this man, not to this man true real right to membership, and ordinances, and seals, so as he may claim them before God and not sin: the meritorious right is Christ’s death, the condition upon his part is faith; hence visible profession as such cannot give right… Profession is in order to the rulers and members of the Church, which have hand according to their place, either formal or tacit consent, to receive in members… the question is, what profession is required in such as the rulers may without sin admit to membership and ordinances; we say a profession morally true, not real conversion judged to be real by men. Now this confession or profession doth not make a Church-member, but declare a Church-member, and it only declares him to the conscience of the rulers, that they sin not in admitting such: but declares him neither to have right before God nor to his own conscience. Yea, for all this profession [Simon] Magus sinned in being baptized, Magus usurped, and hath no true and real right, no not ecclesiastic, except in a most unproper sense; [yet] the Church hath right and command to receive him to member membership and seals…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 1, ch. 22, ‘Whether profession makes a member of the Church visible?’ in A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658)</cite>, p. 123</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a29675f5a3" data-kw="">
<blockquote><p>I confess, when persons are entered into a visible Church-society by baptism, if they will own that profession they were baptized into, and are not guilty either of plain ignorance of it, or manifest scandal, and demand as their right the other ordinances of the Gospel, I see not by what power they may be excluded. If we fix not in a serious visible profession as the ground of giving right, but require positive evidences of grace in every one to be admitted to ordinances as the only thing giving right, for my part, setting aside the many inconveniences besides which attend that in reference to the persons to be admitted, I see not how with a safe and good conscience ordinances can be administered by any. My reason is this: Every one, especially a minister, in that case ought to proceed upon certain grounds that the person admitted has right to the ordinance to be administered; but if positive signs of grace be required, a man’s conscience cannot proceed upon any certainty, without infallible knowledge of another’s spiritual state, which I suppose none will pretend to. My meaning is, that which gives right, must be something evident to the person admitting into it, if it be his duty to enquire after it; but if only positive signs of grace be looked on as giving right, the ground of right can never be so evident to another person, as to proceed with a good conscience, i.e. with a full persuasion of another’s right to the administration of any ordinance to him. If it be said that these are required only as tokens of a true visible profession, and it is that which gives the right, I reply, Our knowledge of, and assent to the conclusion can be no stronger, nor more certain than to the premises from whence it is inferred; if therefore true profession gives right, and our knowledge of that proceeds upon our knowledge of the work of grace, we are left at the same uncertainty we were at before. But if we say, that an outward profession of the Gospel (where there is nothing rendering men uncapable of owning it, which is ignorance, nor declaring they do not own it, which is scandal) is that which gives a visible right to the ordinances of the Church as visible, we have something to fix ourselves upon, and to bottom a persuasion of the right of persons to ordinances. Christ when He instituted Churches, did institute them as visible societies, that is, to have marks whereby to be known and distinguished, as other societies in the world are; now that which puts a difference between this and other societies, is an open profession of Christianity, which profession is looked upon as the outward expression of the internal consent of the soul to the doctrine and laws of the Gospel. Which outward evidence of consent, where there is nothing evidently and directly oppugning it, is that which the Church of God in admission of visible members is to proceed upon. I nowhere find that ever Christ or his apostles in making disciples, or admitting to Church-membership, did exact anymore than a professed willingness to adhere to the doctrine which they preached; nor that they refused any who did declare their desire to join with them. An owning Christianity is all we read of antecedent to admission of Church-members. And if anything else be further required as necessary, we must either say the Word of God is defective in institutions of necessity to the Church, which I suppose the assertors of it will not be so inconsistent to their own principles as to do; or else must produce where anything further is required by the Word of God. … 3. The reality of consent may be sufficiently manifested without an explicit [man-composed Church-] covenant, as in the joining with those who are under the same profession in the common acts of the society and acceptance of, and submission to the rulers of that society, which implicitly is that covenant which they would have expressed; and actions in this case, are as declarative and significative as words.</p></blockquote>

</figure><figure class="quote" id="q-0ee44f02bd" data-kw="">
<blockquote><p>It is a common infirmity with many men to wish their opinions turned into laws. They think certain things right and expedient, and instead of being content to act on their own judgment, and allow others to act on theirs, they desire their view of the matter to be made obligatory on all their brethren… Another thinks that a regular dismission of a Church member should be given only in certain cases, and he wishes his private judgment to be turned into a public law. In an extended Church like ours, there are few evils which ought to be more sedulously avoided than excessive legislation. Leave as much liberty to all concerned as possible, if you wish to preserve peace or union. As to this question of communion, it is well known that there are two very different views arising out of different theories of the nature and design of the Church. The one view is that of the great body of the Christian world, and is the clear doctrine of our standards. It assumes that the terms of Christian communion are unalterably fixed in the Word of God, and can be neither increased nor diminished by any human authority. This is one great principle. Another is, that nothing can justly be required as a term of Christian communion, which Christ has not made necessary to admission to heaven. In other words, that we are bound to receive and treat as Christian brethren all whom Christ receives as disciples. We are not to make ourselves stricter or holier than He… Every Church must receive, in fact, all whom she regards as the true followers of Christ. Therefore, the lowest terms of salvation are the highest admissible terms of communion. If these principles are correct, it follows that however restrictive are the conditions a Church may see fit to establish as the terms of ministerial fellowship, it must recognize as a sister Church every body which holds and teaches the fundamental doctrines of the gospel, however erroneous it may be in other respects; and, therefore, it cannot with any consistency refuse either to receive members from such Church, or to dismiss them to it. That is, so far as general principles are concerned. For there may be particular cases in which, for special reasons, it is proper to refuse to receive a member from another Presbyterian church, belonging to our own body… The other radically different view of Christian communion is that which is characteristic of our Scotch brethren, and especially of the secession portion of them. They regard the Church so much as a witness for the truth, that they overlook its wider aspect as a “congregation of faithful men,” or ” the communion of saints.” They consider themselves, therefore, as joining in the testimony of any Church with which they commune; and they require all who wish to commune with them to join in their peculiar testimony, whatever it may be. Of course they cannot consistently commune themselves, nor allow their members to commune with any other than their own churches. Even some of the leaders of the Free Church of Scotland seemed, at first, in danger of falling into this false theory. They were in their zeal for cutting off all communion with the Established Church [of Scotland], lest, as they said, they should vitiate their testimony. Happily for them and the cause of Christ, this was a passing cloud. That Church has adhered to the scriptural doctrine, which has ever been held sacred by the great body of Protestants. Christian communion is communion of men as Christians, not as Presbyterians, Methodists, or Episcopalians. We recognize those with whom we commune, or to whom we dismiss our members, as Christians, and as nothing more. We give no sanction to their peculiarities, whatever they may be… We have so often heard the strongest feeling expressed by our pastors on this subject, that we are persuaded that any attempt of the General Assembly to prevent their enjoying on this subject the liberty wherewith Christ hath made them free, would be followed by the most unhappy consequences. We rejoice, therefore, in the wise disposition of this matter recorded above.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is a common infirmity with many men to wish their opinions turned into laws. They think certain things right and expedient, and instead of being content to act on their own judgment, and allow others to act on theirs, they desire their view of the matter to be made obligatory on all their brethren… Another thinks that a regular dismission of a Church member should be given only in certain cases, and he wishes his private judgment to be turned into a public law. In an extended Church like ours, there are few evils which ought to be more sedulously avoided than excessive legislation. Leave as much liberty to all concerned as possible, if you wish to preserve peace or union. As to this question of communion, it is well known that there are two very different views arising out of different theories of the nature and design of the Church. The one view is that of the great body of the Christian world, and is the clear doctrine of our standards. It assumes that the terms of Christian communion are unalterably fixed in the Word of God, and can be neither increased nor diminished by any human authority. This is one great principle. Another is, that nothing can justly be required as a term of Christian communion, which Christ has not made necessary to admission to heaven. In other words, that we are bound to receive and treat as Christian brethren all whom Christ receives as disciples. We are not to make ourselves stricter or holier than He… Every Church must receive, in fact, all whom she regards as the true followers of Christ. Therefore, the lowest terms of salvation are the highest admissible terms of communion. If these principles are correct, it follows that however restrictive are the conditions a Church may see fit to establish as the terms of ministerial fellowship, it must recognize as a sister Church every body which holds and teaches the fundamental doctrines of the gospel, however erroneous it may be in other respects; and, therefore, it cannot with any consistency refuse either to receive members from such Church, or to dismiss them to it. That is, so far as general principles are concerned. For there may be particular cases in which, for special reasons, it is proper to refuse to receive a member from another Presbyterian church, belonging to our own body… The other radically different view of Christian communion is that which is characteristic of our Scotch brethren, and especially of the secession portion of them. They regard the Church so much as a witness for the truth, that they overlook its wider aspect as a “congregation of faithful men,” or ” the communion of saints.” They consider themselves, therefore, as joining in the testimony of any Church with which they commune; and they require all who wish to commune with them to join in their peculiar testimony, whatever it may be. Of course they cannot consistently commune themselves, nor allow their members to commune with any other than their own churches. Even some of the leaders of the Free Church of Scotland seemed, at first, in danger of falling into this false theory. They were in their zeal for cutting off all communion with the Established Church [of Scotland], lest, as they said, they should vitiate their testimony. Happily for them and the cause of Christ, this was a passing cloud. That Church has adhered to the scriptural doctrine, which has ever been held sacred by the great body of Protestants. Christian communion is communion of men as Christians, not as Presbyterians, Methodists, or Episcopalians. We recognize those with whom we commune, or to whom we dismiss our members, as Christians, and as nothing more. We give no sanction to their peculiarities, whatever they may be… We have so often heard the strongest feeling expressed by our pastors on this subject, that we are persuaded that any attempt of the General Assembly to prevent their enjoying on this subject the liberty wherewith Christ hath made them free, would be followed by the most unhappy consequences. We rejoice, therefore, in the wise disposition of this matter recorded above.”

— Charles Hodge, Discussions in Church Polity… (NY: Scribner’s Sons, 1878), pt. 2, ch. 12 | section 5, ‘Dismission of Members to other Churches’ (1873) 236-39">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+a+common+infirmity+with+many+men+to+wish+their+opinions+turned+into+laws.+They+think+certain+things+right+and+expedient%2C+and+instead+of+being+content+to+act+on+their+own+judgment%2C+and+allow+others+to+act+on+theirs%2C+they+desire+their+view+of+the+matter+to+be+made+obligatory+on+all+their+brethren%E2%80%A6+Another+thinks+that+a+regular+dismission+of+a+Church+member+should+be+given+only+in+certain+cases%2C+and+he+wishes+his+private+judgment+to+be+turned+into+a+public+law.+In+an+extended+Church+like+ours%2C+there+are+few+evils+which+ought+to+be+more+sedulously+avoided+than+excessive+legislation.+Leave+as+much+liberty+to+all+concerned+as+possible%2C+if+you+wish+to+preserve+peace+or+union.+As+to+this+question+of+communion%2C+it+is+well+known+that+there+are+two+very+different+views+arising+out+of+different+theories+of+the+nature+and+design+of+the+Church.+The+one+view+is+that+of+the+great+body+of+the+Christian+world%2C+and+is+the+clear+doctrine+of+our+standards.+It+assumes+that+the+terms+of+Christian+communion+are+unalterably+fixed+in+the+Word+of+God%2C+and+can+be+neither+increased+nor+diminished+by+any+human+authority.+This+is+one+great+principle.+Another+is%2C+that+nothing+can+justly+be+required+as+a+term+of+Christian+communion%2C+which+Christ+has+not+made+necessary+to+admission+to+heaven.+In+other+words%2C+that+we+are+bound+to+receive+and+treat+as+Christian+brethren+all+whom+Christ+receives+as+disciples.+We+are+not+to+make+ourselves+stricter+or+holier+than+He%E2%80%A6+Every+Church+must+receive%2C+in+fact%2C+all+whom+she+regards+as+the+true+followers+of+Christ.+Therefore%2C+the+lowest+terms+of+salvation+are+the+highest+admissible+terms+of+communion.+If+these+principles+are+correct%2C+it+follows+that+however+restrictive+are+the+conditions+a+Church+may+see+fit+to+establish+as+the+terms+of+ministerial+fellowship%2C+it+must+recognize+as+a+sister+Church+every+body+which+holds+and+teaches+the+fundamental+doctrines+of+the+gospel%2C+however+erroneous+it+may+be+in+other+respects%3B+and%2C+therefore%2C+it+cannot+with+any+consistency+refuse+either+to+receive+members+from+such+Church%2C+or+to+dismiss+them+to+it.+That+is%2C+so+far+as+general+principles+are+concerned.+For+there+may+be+particular+cases+in+which%2C+for+special+reasons%2C+it+is+proper+to+refuse+to+receive+a+member+from+another+Presbyterian+church%2C+belonging+to+our+own+body%E2%80%A6+The+other+radically+different+view+of+Christian+communion+is+that+which+is+characteristic+of+our+Scotch+brethren%2C+and+especially+of+the+secession+portion+of+them.+They+regard+the+Church+so+much+as+a+witness+for+the+truth%2C+that+they+overlook+its+wider+aspect+as+a+%E2%80%9Ccongregation+of+faithful+men%2C%E2%80%9D+or+%E2%80%9D+the+communion+of+saints.%E2%80%9D+They+consider+themselves%2C+therefore%2C+as+joining+in+the+testimony+of+any+Church+with+which+they+commune%3B+and+they+require+all+who+wish+to+commune+with+them+to+join+in+their+peculiar+testimony%2C+whatever+it+may+be.+Of+course+they+cannot+consistently+commune+themselves%2C+nor+allow+their+members+to+commune+with+any+other+than+their+own+churches.+Even+some+of+the+leaders+of+the+Free+Church+of+Scotland+seemed%2C+at+first%2C+in+danger+of+falling+into+this+false+theory.+They+were+in+their+zeal+for+cutting+off+all+communion+with+the+Established+Church+%5Bof+Scotland%5D%2C+lest%2C+as+they+said%2C+they+should+vitiate+their+testimony.+Happily+for+them+and+the+cause+of+Christ%2C+this+was+a+passing+cloud.+That+Church+has+adhered+to+the+scriptural+doctrine%2C+which+has+ever+been+held+sacred+by+the+great+body+of+Protestants.+Christian+communion+is+communion+of+men+as+Christians%2C+not+as+Presbyterians%2C+Methodists%2C+or+Episcopalians.+We+recognize+those+with+whom+we+commune%2C+or+to+whom+we+dismiss+our+members%2C+as+Christians%2C+and+as+nothing+more.+We+give+no+sanction+to+their+peculiarities%2C+whatever+they+may+be%E2%80%A6+We+have+so+often+heard+the+strongest+feeling+expressed+by+our+pastors+on+this+subject%2C+that+we+are+persuaded+that+any+attempt+of+the+General+Assembly+to+prevent+their+enjoying+on+this+subject+the+liberty+wherewith+Christ+hath+made+them+free%2C+would+be+followed+by+the+most+unhappy+consequences.+We+rejoice%2C+therefore%2C+in+the+wise+disposition+of+this+matter+recorded+above.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Discussions+in+Church+Polity%E2%80%A6+%28NY%3A+Scribner%E2%80%99s+Sons%2C+1878%29%2C+pt.+2%2C+ch.+12+%7C+section+5%2C+%E2%80%98Dismission+of+Members+to+other+Churches%E2%80%99+%281873%29+236-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0ee44f02bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0ee44f02bd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-leaving-a-congregation/#:~:text=It%20is%20a%20common%20infirmity%20with,disposition%20of%20this%20matter%20recorded%20above&amp;text=It%20is%20a%20common%20infirmity%20with%20many%20men&amp;text=the%20wise%20disposition%20of%20this%20matter%20recorded%20above" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6dc426196a" data-kw="">
<blockquote><p>Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].</p></blockquote>

</figure><figure class="quote" id="q-989e42eb34" data-kw="">
<blockquote><p>2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation… 3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty… 4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice… 5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful… 6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>

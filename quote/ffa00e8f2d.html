<main class="wrap"><figure class="quote" id="q-ffa00e8f2d" data-kw="">
<blockquote><p>There is none righteous, no, not one.” None are less disposed to dispute this humbling truth — this levelling doctrine — than those who are righteous, because by the grace of God they are so. They are all ready to acknowledge that they were by nature the children of disobedience and wrath, and to ascribe to the mercy of God the distinction which has been created between them and others of their race.

This, then, is the first mark by which you are to try yourselves. Have you been convinced of sin — brought to see and be affected with your disconformity to the holy law of God, in conduct, conversation, and thought? Have you been led to trace all your actual transgressions to the fountain of a heart deceitful and radically corrupted? And have you been persuaded that you were justly obnoxious to the divine displeasure, and lying under a sentence of condemnation, incapable of doing any thing for your own relief?

Such as are righteous have received the gift of righteousness by faith in Jesus Christ. This God offers to all freely in the gospel, and imputes to the believer. On the ground of it he justifies him from all the charges of the law, acquits or declares him righteous. Here is a second mark by which you are to try yourselves. Persuaded that the obedience and death of Christ furnish a righteousness commensurate to all the claims of the holy and violated law, and which God not only approves, but has provided and reveals for the express purpose of justifying the ungodly, have you, under the teaching and influence of the Holy Spirit, fled to it by faith as your refuge and the foundation of your rest?

Is it the sole ground of your peace, and hope, and confidence, in the prospect of death, and of appearing before the judgment-seat? Do you renounce all dependence on your own personal merits or goodness? and is it not only your wish, but also your lively and animating desire to be “found in Christ, not having your own righteousness, but that which is of God by faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Death of the Righteous in Sermons</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ee3a8211b" data-kw="">
<blockquote><p>…the everlasting and precise observation of this favorable precept [2nd Commandment] in the ancient, purely Christian Church… They observed the rule with the Cherubim, too; it was exactly as if they had not been put in the temple, even outside the gaze of all the Priests, and they were put forth as types of the Majesty of the Messiah who rules over the angels themselves, the truth of which we now maintain. [Note that numerous reformed theologians (such as Owen below), in accord with many in the Christian Church before them, irrespective of possibly a more direct figuring of Israel under Egyptian persecution, taught that the burning bush was a type of the majesty of the Messiah (the true Israel) who would join the divine nature to his human nature in his Person (who spoke both as the angel of the Lord, and God, out of the bush), and not be consumed. Beza’s and the Reformed’s caution is here evident.] But the other images, like the lions and the bulls, pertain in no way to this matter, (r) since they were like decorations of holy vases, lacking any danger of idolatry, and besides this, constructed in this way by the express word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism</cite>, (Concordia Publishing House, 2017), ch. 4, p. 462</span></figcaption>

</figure><figure class="quote" id="q-041822af0e" data-kw="angels spirits">
<blockquote><p>Are angels spiritual and incorporeal substances? We affirm. Scripture expressly calls them spirits; now for what purpose would they be called “spirits” if they are corporeal? Spirit is diametrically opposed to body: “A spirit hath not flesh and bones,” says Christ, “as ye see me have” (Lk. 24:39). For the same reason they are classed among things “invisible” (Col. 1:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 7.2.2</span></figcaption>

</figure><figure class="quote" id="q-4246cbe1f0" data-kw="">
<blockquote><p>Angels are intelligent spirits free from a body. Propositions …

IV. Angels are in a particular place not as if they were enclosed within it, but to the exclusion of being anywhere else [non circumscriptive sed definitive].

V. Angels cannot be in several places at once.

VI. Angels truly move from one place to another.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e94cf74e05" data-kw="">
<blockquote><p>Let them understand, that it is alike to have no minister at all, and to have an idol in the place of a true minister: Yea, and in some cases, it is worse; for those that be utterly destituted of ministers will be diligent to search for them: But those that have a vain shadow do commonly, without further care, content themselves with the same; and so remain they continually deceived, thinking that they have a minister, when in very deed they have none: For we cannot judge him a dispensator of God’s mysteries, that in no wise can break the Bread of Life to the fainting and hungry souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

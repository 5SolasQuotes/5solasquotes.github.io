<main class="wrap"><figure class="quote" id="q-65dcef411f" data-kw="">
<blockquote><p>Although I shall by Gods gracious assistance keep that station and distance from Popish errors where my judgement and conscience, guided by God’s Word, has set me, yet to leave the Romanists without excuse, as much as in me lies, I do most earnestly desire, and should most industriously promote, such a Christian and catholic accord as were most for the honor of Christ and the peace of Christendom. I know the youthful fervors of some are jealous of all such motions, and for fear of seeming lukewarm they resolve to boil over all bounds till they quench both truth and charity among Christians and make way for atheism, Turkism, confusion and barbarity. These hotter heads possibly dread what I calmly desire, that such a grand catholic convention of able ecclesiastics in these Western Churches might, by the consent of princes and chief magistrates, be so orderly convened with freedom, impartiality and due authority, as might enable them to consent in one canon or rule of Faith and good manners, that the clear and concurrent sense of Scriptures might be owned by all, in which all things necessary are contained either literally, or by just deductions; that what is dark or dubious should be left indifferently to Christians use and judgements; that all would agree in the same ancient fundamental articles of Faith, contained in primitive creeds, also in the same sacraments or holy mysteries, to be devoutly celebrated, so in the same way of good works to be practiced, that we might all have the same catechism, the same public liturgies, so composed that all Christians might with faith and charity say Amen to them and in their several languages understand them; that a commentary on Scriptures, and sermons containing all Christian necessary doctrine might be agreed upon, that neither curiosities nor controversies should be couched in public prayers or preachings, that all might enjoy the same catholic source and course of ecclesiastic ordination, ministry and authority, so tempering government and discipline in the Church, that none should justly think others too much exalted, nor themselves too much depressed, that catholic customs, ancient ceremonies and traditions, truly such, being consonant to God’s Word, and practically interpreting the meaning of it, might be observed by all, leaving yet such freedom in other things to particular Churches as might be most convenient, yet still subordinate to and to be regulated by the judgment of such a general council, contrary to which none should affect extravagant liberty to the ruin of Christian charity. Blessed Lord! What good Christian could be injured by such a Christian accord in the main concernments of religion, which cannot be impossible in the nature of the thing, because it was of old enjoyed, and many hundreds of years generally preserved among all Christians and Churches of any name and repute in all the world? Nor did either the heat of persecution or prosperity (as warm and soultry weather) dispirit this charity of Christians, who might still be as capable subjects of so great a blessing from God on earth, if passion, prejudice, partiality and private interests on all hands were laid aside, without parting with any true and real interest that concerns a wise or good man, either in conscience or honor, in civil or religious regards.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gauden.html">John Gauden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hiera dakrya, Ecclesiae anglicanae suspiria, The Tears, Sighs, Complaints &amp; Prayers of the Church of England setting forth her former Constitution compared with her Present Condition (London: J.G., 1659), bk. 3, ch. 17, pp. 315-16 Gauden (1605-1662) was an Anglican bishop and royalist.</cite></span></figcaption>

</figure><figure class="quote" id="q-61eea66ae6" data-kw="">
<blockquote><p>Therefore there is no binding men’s faith to that the Scripture avers not. The Papists do bind to things: 1. Citra fundamentum, besides the foundation; as traditions, untempered mortar daubed on the walls of truth to hide it. 2. Circa fundamentum, to things about the foundation, such as endanger it: as denial of Scripture to laymen. This is a wretched sin, to obtrude for matter of faith, that it is not lawful to read the Scriptures which are the rule of faith. 3. Contra fundamentum, to things against the foundation; as the sacrifice of the mass, distinction of mortal and venial sins, justification by works, etc. What is against that which is necessarily to be believed to salvation, is against the foundation. But it is necessary to trust in Christ’s blood and merits only, because there is no other name given under heaven whereby we may be saved. (Acts 4:12) Therefore to trust in others, to let angels or men share part of our faiths, is against the foundation. Indeed they boast that they only hold the foundation: but ‘I Paul say unto you, that if ye be circumcised, Christ shall profit you nothing.’ (Gal. 5:2) If you join your own merits with Christ’s merits, he shall profit you nothing.</p></blockquote>

<blockquote><p>The voluntary and unnecessary dividing and separation from a true Church is schismatical. When we put bounds and partitions between it and ourselves, we sin (say some) as did these seducers here taxed by Jude. If the Church be not heretical or idolatrous, or do not by excommunication, persecution, etc. thrust us out of its communion; if it be such an one as Christ the head has communion with, we the members ought not by separation to rend and divide the body. To separate from congregations where the word of truth and Gospel of salvation are held forth in an ordinary way (1 Tim. 3:15), as the proclamations of princes are held forth upon pillars to which they are affixed; where the light of the truth is set up as upon a candlestick to guide passengers to heaven. (Rev. 1:13) To separate from them to whom belong the covenants, and where the sacraments, the seals of the Covenant, and for substance rightly dispensed, where Christ walks in the midst of his golden candlesticks, and discovers his presence in his ordinances, whereby they are made effectual to the conversion and edification of souls, in an ordinary way; where the members are saints by a professed subjection to Christ and his Gospel, and haply have promised this explicitly and openly; where there are sundry who in the judgment of charity may be conceived to have the work of grace really wrought in their hearts by walking in some measure answerable to their profession: I say to separate from these, as those with whom Church communion is not to be held and maintaind, is unwarrantable and schismatical.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The voluntary and unnecessary dividing and separation from a true Church is schismatical. When we put bounds and partitions between it and ourselves, we sin (say some) as did these seducers here taxed by Jude. If the Church be not heretical or idolatrous, or do not by excommunication, persecution, etc. thrust us out of its communion; if it be such an one as Christ the head has communion with, we the members ought not by separation to rend and divide the body. To separate from congregations where the word of truth and Gospel of salvation are held forth in an ordinary way (1 Tim. 3:15), as the proclamations of princes are held forth upon pillars to which they are affixed; where the light of the truth is set up as upon a candlestick to guide passengers to heaven. (Rev. 1:13) To separate from them to whom belong the covenants, and where the sacraments, the seals of the Covenant, and for substance rightly dispensed, where Christ walks in the midst of his golden candlesticks, and discovers his presence in his ordinances, whereby they are made effectual to the conversion and edification of souls, in an ordinary way; where the members are saints by a professed subjection to Christ and his Gospel, and haply have promised this explicitly and openly; where there are sundry who in the judgment of charity may be conceived to have the work of grace really wrought in their hearts by walking in some measure answerable to their profession: I say to separate from these, as those with whom Church communion is not to be held and maintaind, is unwarrantable and schismatical.”

— William Jenkyn, An Exposition of the Epistle of Jude (London: Maxey, 1654), on vv. 17-19, pp. 589-90">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+voluntary+and+unnecessary+dividing+and+separation+from+a+true+Church+is+schismatical.+When+we+put+bounds+and+partitions+between+it+and+ourselves%2C+we+sin+%28say+some%29+as+did+these+seducers+here+taxed+by+Jude.+If+the+Church+be+not+heretical+or+idolatrous%2C+or+do+not+by+excommunication%2C+persecution%2C+etc.+thrust+us+out+of+its+communion%3B+if+it+be+such+an+one+as+Christ+the+head+has+communion+with%2C+we+the+members+ought+not+by+separation+to+rend+and+divide+the+body.+To+separate+from+congregations+where+the+word+of+truth+and+Gospel+of+salvation+are+held+forth+in+an+ordinary+way+%281+Tim.+3%3A15%29%2C+as+the+proclamations+of+princes+are+held+forth+upon+pillars+to+which+they+are+affixed%3B+where+the+light+of+the+truth+is+set+up+as+upon+a+candlestick+to+guide+passengers+to+heaven.+%28Rev.+1%3A13%29+To+separate+from+them+to+whom+belong+the+covenants%2C+and+where+the+sacraments%2C+the+seals+of+the+Covenant%2C+and+for+substance+rightly+dispensed%2C+where+Christ+walks+in+the+midst+of+his+golden+candlesticks%2C+and+discovers+his+presence+in+his+ordinances%2C+whereby+they+are+made+effectual+to+the+conversion+and+edification+of+souls%2C+in+an+ordinary+way%3B+where+the+members+are+saints+by+a+professed+subjection+to+Christ+and+his+Gospel%2C+and+haply+have+promised+this+explicitly+and+openly%3B+where+there+are+sundry+who+in+the+judgment+of+charity+may+be+conceived+to+have+the+work+of+grace+really+wrought+in+their+hearts+by+walking+in+some+measure+answerable+to+their+profession%3A+I+say+to+separate+from+these%2C+as+those+with+whom+Church+communion+is+not+to+be+held+and+maintaind%2C+is+unwarrantable+and+schismatical.%E2%80%9D%0A%0A%E2%80%94+William+Jenkyn%2C+An+Exposition+of+the+Epistle+of+Jude+%28London%3A+Maxey%2C+1654%29%2C+on+vv.+17-19%2C+pp.+589-90&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5c8d5afc64.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5c8d5afc64.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=The%20voluntary%20and%20unnecessary%20dividing%20and,and%20maintaind%2C%20is%20unwarrantable%20and%20schismatical." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And secondly, whereas they allege that we let the wicked continue in our Church without separation, whereas we should cut them off when we find them to be hypocrites. I answer: We doe separate, as much as in us lies, for we labor to have them separated from us, and also we labor to separate ourselves from them. First, we labor their separation from us, desiring their removal, bewailing their wickedness, and our condition that live in Mesech and Kedar, and reproving them for their sins; and if that will not serve, complaining against them to those that are in authority, that they may bee excommunicated, and withal we are instant with God by prayer to stir up the hearts of such as are in authority to execute his ordinances upon them: we do what we can to separate them from us, and it comes sometime to pass, that many are so separated from us; but if they should not, that indeed were the Churches sin, and a foul sin too; yet it destroyes not the true being of our Church. Secondly, if we cannot get them separated from us, yet we separate ourselves from them, and that is the separation that the Scripture so much beats upon in private persons, as we are more conscionable, so we doe more separate from them, from their wills, affections and courses; yea, we must separate as much as conveniently we may from their persons, at least from their sins, which for our parts we are persuaded to be the chief separation that the Scripture intends. Yea, but this is a secret separation, say they, under hand, not openly known. Nay, this is a notorious and known separation: For first, it is ingenuously professed on our part, to the moving of their after-hatred and despite against us; we disclaiming them that are lewd, swearing and profane wretches, and that openly, not caring who know it; and likewise it is known on their part, they upbraiding us therefore very reproachfully, with the names of Puritans, Precisions, holy Brethren, and such like, because we will not accompany with them; if this be not an holy and a plain separation, what is?… Yea, but say they, ye should separate from them in the assemblies, from the Word and the sacraments? I answer: Rather the wicked should separate from us in these things: where the assembly and business are naught in themselves, as at playhouses and such like, there the good must separate: but where the assembly and business is good in itself, there the bad must separate; and the reason is good, for it is none of theirs, and the good must tarry and be present, for it is their own right; and it is sin to refuse God’s ordinances for the pollution of others, 1 Sam. 2:17, 24… yet our holiness being true in us, and openly professed and practiced, it shall be enough to make us a true visible Church, yea, and an holy congregation in God’s acceptation, and in the charitable estimation of our brethren.</p></blockquote>

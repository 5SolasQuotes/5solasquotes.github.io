<main class="wrap"><figure class="quote" id="q-1ca5a91e18" data-kw="">
<blockquote><p>for as much as final infidelity and impenitency are the meritorious causes of damnation; but faith, repentance and good works are but the disposing causes of salvation. Yet like as God inflicts not damnation but by way of punishment, so he doth not bestow salvation, on any of ripe years, but by way of reward. Yet here also is a difference; for damnation is inflicted by way of punishment for the evil works’ sake which are committed: but salvation is not conferred by way of reward for the good works’ sake which are performed, but merely for Christ’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice</cite>, (1631), p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8453849f30" data-kw="">
<blockquote><p>Observe this yet, that more is required to salvation and eternal life than to justification. We are justified, that is we are absolved from sins, insofar as by it we are not condemned; not therefore because we give anything to God, but because from it is given righteousness, an acquisition we receive by the death of his son. Eternal life, truly, requires good works before it. By life eternal we mean the joy of conscience and glory; that good works confers something to those both is most plain. Nor therefore is it posited that a meritorious cause is in any way due to them, for the term ’cause’ broadly connotes something of merit. So the use of the sacraments, the study of the divine Word, the holy ministry are something of organic causes of salvation, even efficiently: yet not according to a principle of merit…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-martinius.html">Matthew Martinius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 435-36 in Notes to ch. 5, ‘Of the Fulfillment of the Covenant Respecting the Means’ in ‘Notes to the Method’ in A Sum of the Chapters of Christian Doctrine which are Contained in the Apostles’ Creed, the Decalogue, the Lord’s Prayer, the Institution of Church Discipline, of Holy Baptism &amp; of the Holy Supper, Briefly, Clearly, Popularly &amp; Distinctly Explained, even a Method of Holy Theology in Four Books Distributed… (Herborn, 1603), pp. 435-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Observe this yet, that more is required to salvation and eternal life than to justification. We are justified, that is we are absolved from sins, insofar as by it we are not condemned; not therefore because we give anything to God, but because from it is given righteousness, an acquisition we receive by the death of his son. Eternal life, truly, requires good works before it. By life eternal we mean the joy of conscience and glory; that good works confers something to those both is most plain. Nor therefore is it posited that a meritorious cause is in any way due to them, for the term ’cause’ broadly connotes something of merit. So the use of the sacraments, the study of the divine Word, the holy ministry are something of organic causes of salvation, even efficiently: yet not according to a principle of merit…”

</figure><figure class="quote" id="q-c699849847" data-kw="">
<blockquote><p>Faith, therefore, without works, is dead. We are saved by faith. But salvation includes deliverance from sin. If, therefore, our faith does not deliver us from sin, it does not save us. Antinomianism involves a contradiction in terms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 16, “Faith,” “Sanctification a Fruit of Faith”</span></figcaption>

</figure><figure class="quote" id="q-d163ded14a" data-kw="">
<blockquote><p>But if we attend to the four kinds of causes which philosophers bring under our view in regard to effects, we shall find that not one of them is applicable to works as a cause of salvation. The efficient cause of our eternal salvation the Scripture uniformly proclaims to be the mercy and free love of the heavenly Father towards us; the material cause to be Christ, with the obedience by which he purchased righteousness for us; and what can the formal or instrumental cause be but faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.17</span></figcaption>

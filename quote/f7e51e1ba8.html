<main class="wrap"><figure class="quote" id="q-f7e51e1ba8" data-kw="">
<blockquote><p>Like so many other efforts at reforming life in Protestant churches, Pietism and Methodism were right in their opposition to dead orthodoxy. Originally their intention was only to arouse a sleeping Christianity; they wished not to bring about a change in the confession of the Reformation but only to apply it in life. Yet, out of an understandable reaction, they frequently went too far in this endeavor and swung to another extreme. They, too, gradually shifted the center of gravity from the objective to the subjective work of salvation. In this connection it makes essentially no difference whether one makes salvation dependent on faith and obedience or on faith and experience. In both cases humanity itself steps into the foreground. Even though Pietism and Methodism did not deny the acquisition of salvation by Christ, they did not use this doctrine or relate it in any organic way to the application of salvation. It was, so to speak, dead capital. The official activity of the exalted Christ, the Lord from heaven, was overshadowed by the experiences of the subject. In Pietism, instead of being directed toward Christ, people were directed toward themselves. They had to travel a long road, meet all sorts of demands and conditions, and test themselves by numerous marks of genuineness before they might believe, appropriate Christ, and be assured of their salvation. Methodism indeed tried to bring all this—conversion, faith, assurance—together in one indivisible moment, but it systematized this method, in a most abbreviated way, in the same manner as Pietism. In both there is a failure to appreciate the activity of the Holy Spirit, the preparation of grace, and the connection between creation and re-creation. That is also the reason why in neither of them does the conversion experience lead to a truly developed Christian life. Whether in Pietistic fashion it withdraws from the world or in Methodist style acts aggressively in the world, it is always something separate, something that stands dualistically alongside the natural life, and therefore does not have an organic impact on the family, society, and the state, on science and art. With or without the Salvation Army uniform, Christians are a special sort of people who live not in but outside the world. The Reformation antithesis between sin and grace has more or less made way for the Catholic antithesis between the natural and the supernatural. Puritanism has been exchanged for asceticism. The essence of sanctification now consists in abstaining from ordinary things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: Sin and Salvation in Christ, trans. H. Bolt, J. Vriend (Grand Rapids, MI: Baker Academic, 2006), 3.567–68.</cite></span></figcaption>

</figure><figure class="quote" id="q-9d42b5302b" data-kw="">
<blockquote><p>That right means be used with speed and diligence for the healing of our divisions and the uniting of all the true Churches of Christ (at least in these nations; and O that your endeavors might be extended much further) to which end I shall mention but these two means of most evident necessity: 1. That there be one Scripture-creed, or confession of Faith, agreed on by a general assembly of able ministers duly and freely chosen hereunto, which shall contain nothing but matter of evident necessity and verity. This will serve: 1. For a test to the Churches, to discern the sound professors from the unsound (as to their doctrine) and to know them with whom they may close as brethren, and whom they must reject. 2. For a test to the magistrate, of the orthodox to be encouraged, and of the intollerably heterodox, which it seems is intended in the 37th Article [of the 39 Articles] of the late formed government, where all that will have liberty must profess (faith in God by Jesus Christ), which in a Christian sense must comprehend every true fundamental or article of our Faith: And, no doubt, it is not the bare speaking of those words in an unchristian sense that is intended (As if a Ranter should say that himself is God, and his mate is Jesus Christ). 2. That there be a public establishment of the necessary liberty of the Churches to meet by their officers and delegates on all just occasions, in assemblies smaller or greater (even national when it is necessary), seeing without such associations and communion in assemblies, the unity and concord of the Churches is not like to be maintained. I exclude not the magistrate’s interest or oversight, to see that they do not transgress their bounds. As you love Christ and his Church and Gospel, and men’s souls, neglect not these unquestionable points of his interest, and make them your first and chiefest business, and let none be preferred before Him till you know them to be of more authority over you and better friends to you than Christ is…</p></blockquote>

<blockquote><p>…a General Meeting met at Douglas, the 3rd of December, 1690… After this, Messrs Lining and Shields, spoke to the Meeting, to this effect, That they would not impose upon any person, yet they advised them to hear those ministers who were most free and faithful, that they could have the opportunity of, and to have a care of running upon extremes on the right hand. After which some debates ensued. Whereupon it was proposed to the meeting that a paper should be drawn up, containing a protestation against the defections of the [Church of Scotland] ministers they [Cameronian laypersons] were to hear (which they might give in either to the minister with whom they were to join, or to the presbytery of the bounds) and what induced them to join at that time; as also that their joining at present was neither a condemning of, nor receding from our former testimony and contending, nor approving of these defections they witnessed against before… Upon the morrow they convened again. The said paper was presented and read; but there were debatings concerning the same between our ministers and some of the meeting. As also, the Meeting were of different sentiments about it, some against it upon one account, and some upon another account, and some were for it, thinking it better to join with such a testimony than without any at all. Not coming to any agreement, it was left to people’s liberty and freedom to give it or not, as they thought fit. It was proposed to the meeting, that in regard debates did not much good, but rather hurt, it was fittest to leave them off, and part; which… they did. Some stayed and took copies of the paper, which they gave in to ministers before they joined; a transcript of which follows. To the right reverend Minister and Eldership of the Parish of ________ or Presbtyery of ________ Although among other calamities that we have been exercised with in these days of tribulation that have gone over us, these have been very grievous unto us, that not only we have labored under a sad famine of gospel-ordinances, but under the reproach that we despised and rejected the offer of them: Yet we have a witness in heaven and in our own consciences, that nothing has been more lamented in our lot than the want [lack] of such a privilege, nor anything so much desired as the recovery and enjoyment of these ordinances, administered in freedom and faithfulness, purity and power, which for a long time, in our judgment, have been so restrained and restricted, burdened and borne down under the bushel of Erastian and Antichristian usurpations, that not only they watned that liberty, light and luster which the Lord Jesus had set them in by his institutions, but seemed to be encompassed with and subjected to these wicked encroachments that we could not have access to them without some way acknowledging and bowing unto these idols of jealousy, which being set up in the very entry of the house of the Lord, did scar and fright us from coming thereunto, so long as these usurpations were standing. But now these things being removed, and the church’s freedom and power restored, the doctrine, worship, discipline and government, and all the ordinances of Christ re-established in purity, peace and freedom, we cannot any longer stand at a distance from them. Nevertheless, the indignities done to our Lord Jesus, and injuries done to his church by these Erastian and Antichristian usurpations of Prelacy, Supremacy and absolute power; and the defections of ministers in comliance therewisth not being as yet confessed nor condemned, and our complaints and petitions offered to the late General Assembly, not being received nor regarded as we expected, which was a great grievance, and an addition to all our former complaints; and yet being resolved to remain no longer in withdrawing as formerly, we think it altogether needful for our own exoneration, and for making our communion the more comfortable, and free of all accession to, or partaking with the guilt of these offenses, which made us withdraw in former times; To offer and give in our testimony against all the wrongs done to Christ and this reformed covenanted Church of Scotland, by the Popish, Prelatical and malignant faction, in their wicked overturning its blessed ancient reformation, rescinding the righteous laws, and breaking, burning and burying the holy covenants that fenced it, and establishing upon the ruins thereof abjured Prelacy, supremacy and tyranny, and by all the defections of ministers in compliance with, or submission to the same; such as, heaing of curates, taking any of the oaths and bonds repugnant to the covenants, embracing the indulgences and indemnities of tyrants, addressing for, and accepting of the late Popish toleration, their lying bye from, or unfaithfulness in the exercise of their ministry in times of abounding snares and their present offensive omissions in not renewing the covenants, nor purging out all the Episcopal curates, etc. And particularly, we cannot forbear to testify (with all reverence and respect to your ministry, which now we offer and promise subjection to in the Lord) against your sin of ___________________________________________ Thus having given in our testimony against these sins and all other defections and corruptions in this church; We protest that our present joining may not be interpreted an approving of any of these sins, nor a condemning of, or receding from our former or present testimony against the same; and humbly plead, that this our testimony and protestation may be registered in the books of Session or Presbytery. Subscribed by us ________ the ___ day of ______.</p></blockquote>

<blockquote><p>That it is contrary to our known principles and covenants that any Churchman should bear civil offices, or have power in the commonwealth;</p></blockquote>

<blockquote><p>…while he [the opponent] says: ‘That all Scots-men were generally of one Communion, and that the presbyterians (except the Cameronians) had returned to the Episcopal Church, and were become hearers, and many communicaters with her: That there was no separate meetings kept, at least publicly, but very rarely.’ This, I say, is most false: For though never any of the presbyterians would, directly nor undirectly, own episcopal government, yet many of the more sober and intelligent among them did not think it unlawful to hear them occasionally, who had complied with episcopacy; yet they chose rather to hear their own lawful pastors, though driven into corners, than these unfaithful men: And not only so, but there were many thousands, beside Cameronians, who would never hear them: And that many (who when they had occasion to hear others, made use of that opportunity) did go to hear these men, when their liberty of hearing others was taken away, it is no wonder. Yet this practice was far less general than he says, and meetings of nonconformists were not so rare (for all the horrid persecution that they were under) as he would make us believe: Many, who were no Cameronians, kept up their meetings, though I confess it was no wonder that their meetings were not public [after about 1680], when they were by such barbarous persecutions driven into corners… §2. Another falshood is, that the party which was then treated severely, was only the Cameronians: Whereas, though they had their share of the persecution, yet other presbyterians were most cruelly dealt with; and it was observed, that, indeed, the spite of his [episcopal / royalist] party appeared most against the most sober of the presbyterians, as being the persons most capable to do them hurt. …It is also most false and calumnibus, ‘that all presbyterians in Scotland were of one principle, only the Cameronians were more ingenuous’: For the sober presbyterians did always condemn many, both principles and practices, of that party. Such as that magistrates and ministers fall, ipso facto, from their authority, respective, and stations, when they are guilty of mis-managements, and that private persons may treat them as such, without a ••••enee [decree?] of State or Church. That the rest of the presbyterians condemned the Cameronians for keeping up their meetings, is also an untruth, for they also kept up meetings; but they condemned them for the manner of their meeting, with such contempt of, and bidding defiance to the authority of the magistrate.</p></blockquote>

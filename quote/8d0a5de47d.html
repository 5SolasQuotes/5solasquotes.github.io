<main class="wrap"><figure class="quote" id="q-8d0a5de47d" data-kw="">
<blockquote><p>5. Divine worship is internal only or external also. Internal worship is merely spiritual, and performed only within the temple of man’s heart, of which none are witnesses but God and a man’s own conscience. All the inward motions of the heart directed unto God are parts of this worship, as faith, hope, confidence, love, fear and joy in God, etc. which are all of them diverse acts and parts of inward worship, in everyone of which God is honored. All which spring from the apprehension of our own wants, and God’s infinite excellency and goodness towards us…

6. External worship is an expressing and setting forth of the internal by outward signs and rites: by which as by certain outward bodily shadows and colors the spiritual and inward worship of God is made visible and sensible to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Divine Worship</cite>, … (1604), ch. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33a10a09f9" data-kw="">
<blockquote><p>Civil worship is the honor done to men set above us by God Himself, either in respect of their excellent gifts, or in respect of their offices and authority whereby they govern others. The right end of this worship is to testify and declare that we reverence the gifts of God, and that power which He has placed in those that be his instruments. And this kind of worship is commanded only in the Second Table and in the First Commandment thereof, ‘Honor thy father and mother.’ Upon this distinction we may judge what honor is due to everyone. Honor is to be given to God, and to whom He commands. He commands that inferiors should honor or worship their betters… Good angels, because they excel men both in nature and gifts, when they appeared were lawfully honored: yet so, as when the least signification of honor was given that was proper to God, they refused it. And because they appear not now as in former times, not so much as civil adoration in any bodily gesture is to be done unto them. Lastly, governors and magistrates have civil adoration as their due: and it cannot be omitted without offense. Thus Abraham worshipped the Hittites, Gen. 23, and Joseph his brethren, Gen. 50. To come to the very point: upon the former distinction, we deny against the Papists that any civil worship in the bending of the knee or prostrating of the body is to be given to the saints, they being absent from us; much less any religious worship, as namely invocation signified by any bodily adoration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... (Cambridge, Legat, 1598), 14th Point, ‘Worshipping of Saints’, ‘The Dissent’, pp. 248-50</span></figcaption>

asquotes.github.io%2Fquote%2F33a10a09f9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33a10a09f9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=Civil%20worship%20is%20the%20honor%20done,invocation%20signified%20by%20any%20bodily%20adoration&amp;text=Civil%20worship%20is%20the%20honor%20done%20to%20men&amp;text=as%20namely%20invocation%20signified%20by%20any%20bodily%20adoration" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d2d1d6ebfb" data-kw="">
<blockquote><p>Upon the first day of the week, everyone lays by in store, as God prospers him, giving it into a broad [collection plate] at the church door, for the relief of the poor, as 1 Cor. 16:2. It is provided that ministers have competent stipends, as 1 Cor. 9:13, and that hospitals be upholden, Matt 25:35,36; Eccl. 11:1,2, and that the fabric [buildings and external furniture] of the Church be upholden by the [civil] patron and free-holders [civil town citizens],¹ as Mal. 1:10; Hag. 1:4; Hag. 2:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, 1642, London | Ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | 11th Article, Elders and Deacons</span></figcaption>

</figure><figure class="quote" id="q-1aff900802" data-kw="">
<blockquote><p>The second point is that the outward worship does not please God of itself, but by means of the inward before described. Again, it is spiritual, not by itself, because it stands in bodily actions; but by reason of the inward worship, whence it proceeds and whereof it is a sign. Moreover, being severed from inward worship, it is worship in show, and not worship in truth. If they eye be evil, the whole body is dark. (Mt. 6:13) Christ bids the Pharisees to wash the inside of the cup and platter, and then all shall be clean (Mt. 23:25-26).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 707</span></figcaption>

<blockquote><p>Dr. [Thomas] Jackson [d. 1640] in his Original of Unbelief [1625], pp. 334-35, very aptly to this purpose notes that some expressions may sometime be used, and observed well, which to use ordinarily (much more to institute) would be ridiculous or impious. As Jacob did unblameablely kiss his son Joseph’s coat, yet to have hanged it about his bed or table that it might receive such salutations evening and morning or at every meal time, might have countenanced many branches of superstition: once and use it not, may be discretion of those things whose continual use degenerates into abuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (Amsterdam: Thorp, 1633), Manuduction, ch. 4, ‘Concerning the nature and definition of a ceremony’, pp. 26-27</span></figcaption>

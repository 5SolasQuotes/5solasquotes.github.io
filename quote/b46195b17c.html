<blockquote><p>32. That no person, who shall deny the being of god or the truth of the Protestant religion, or the divine authority either of the Old or New Testaments, or who shall hold religious principles incompatible with the freedom and safety of the State, shall be capable of holding any office or place of trust or profit in the civil department within this State.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/north-carolina.html">State of North Carolina</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Constitution of North Carolina</cite>, 1776 (Thorpe, 5.2793)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

— North Carolina, Constitution of North Carolina, 1776 (Thorpe, 5.2793)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C32.+That+no+person%2C+who+shall+deny+the+being+of+god+or+the+truth+of+the+Protestant+religion%2C+or+the+divine+authority+either+of+the+Old+or+New+Testaments%2C+or+who+shall+hold+religious+principles+incompatible+with+the+freedom+and+safety+of+the+State%2C+shall+be+capable+of+holding+any+office+or+place+of+trust+or+profit+in+the+civil+department+within+this+State.%E2%80%9D%0A%0A%E2%80%94+North+Carolina%2C+Constitution+of+North+Carolina%2C+1776+%28Thorpe%2C+5.2793%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb46195b17c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b46195b17c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-establishment-principle-in-the-american-westminster-standards-and-early-american-states/#:~:text=32.%20That%20no%20person%2C%20who%20shall,the%20civil%20department%20within%20this%20State&amp;text=32.%20That%20no%20person%2C%20who%20shall%20deny%20the&amp;text=profit%20in%20the%20civil%20department%20within%20this%20State" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7bfc0ce6e" data-kw="">
<blockquote><p>48. For to that end also is the holy Scripture profitable, to show which is the best manner of governing a commonwealth, and that the Magistrate as being God’s Minister may by this guiding star be so directed, as that he may execute the parts of his office, according to the will of God, and may perfectly be instructed to every good work; yet the Minister is not said properly to treat of civil businesses, but of the scandals which arise about them, or of the cases of conscience which occur in the administration of the commonwealth: So also the Magistrate is not properly said to be exercised about the spiritual things of the Church, but rather about those external things which adhere unto and accompany the spiritual things. … 53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul… … 56. Surely the faithful and godly ministers, although they could do it unchallenged and uncontrolled, and were therein allowed by the Magistrate (as in the prelatical times it was), yet would not usurp the power of life and death, or judge and determine concerning men’s honors, goods, inheritance, division of families, or other civil businesses; seeing they well know these things to be heterogeneous to their office: But as they ought not to entangle themselves with the judging of civil causes… 86. What then? Shall it be lawful ordinarily for ministers and elders to do what they list, or shall the governors in the Churches, glorying in the Law, by their transgression dishonor God? God forbid. For first, if they shall trespass in anything against the Magistrate or municipal Laws, whether by intermeddling in judging of civil causes, or otherwise disturbing the peace and order of the commonwealth, they are liable to civil trial and judgments, and it is in the power of the Magistrate to restrain and punish them.</p></blockquote>

<blockquote><p>“We teach not that the prophet ought to compel any, nor that the sword is an ordinance of God to convert oppressors and murderers to turn meek and righteous judges; co-action by fire and sword in Old or New Testament can convert none to Christ; the word and the Spirit must ever do the turn: [but] by accident God can change the nature of the rod and sanctify it to Manasseh, for to bring him to humiliation and repentance.</p></blockquote>

</figure><figure class="quote" id="q-ef2014537d" data-kw="">
<blockquote><p>And so the kingly power in general as given for the good of all human societies in general, is from God the Creator for the good of all societies whither heathen or Christian. So Nebuchadnezzar, Darius, Nero, and Julian were essentially kings, and yet had not their kingly power immediately from the Mediator Christ, except in this general sense that the kingly power is a lawful ordinance of God warranted by the Word of God and Testament of our Testator Jesus Christ, because these are essentially kings and lawful magistrates who either never heard of Christ, nor any thing of God; but only that He is Creator of the world, or then who persecute and hate the name of Jesus Christ… Now Formalists, denying such to be lawful kings, as either know not Christ, or believe not in Him, join hands with Papists, and make way for Anabaptistical anarchy, that a persecuting or an unbelieving king is no king, not to be obeyed, but to be turned out of his throne: And to this meaning, Calvin, Viret and Cartwright teach that the kingly power flows immediately from God the Creator, not from God in the Mediator Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ... (1642), ch. 19, p. 295</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>90. To repress these arguments and scruples of the laity by force alone, and not to resolve them by giving reasons, is to expose the Church and the pope to the ridicule of their enemies, and to make Christians unhappy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 95 Theses (1517)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b4283b22d" data-kw="">
<blockquote><p>If the Church prescribe anything lawfully, so that she prescribe no more than she has power given her to prescribe, her ordinance must be accompanied with some good reason and warrant given for the satisfaction of tender consciences… It becomes not the spouse of Christ, endued with the spirit of meekness, to command anything imperiously, and without a reason given… Tertullian’s testimony is known (in Apologet.): Nulla lex, etc. ‘No law (says he) owes to itself alone the conscience of its equity, but to those from whom it expects obedience. Moreover, it is a suspected law which will not have itself to be proved, but a wicked law, which not being proved, yet bears rule.’… Neither can the Church prescribe anything lawfully which she shows not to have been convenient, even before her determination. … If the ceremonies be lawful to us because the law and ordinance of the Church prescribes them, then either the bare and naked prescription of the Church, having no other warrant than the Church’s own authority, make them to be thus lawful; or else the law of the Church, as grounded upon and warranted by the law of God and nature… If they take them (as needs they must) to the latter part, then let them either say that the ceremonies are lawful unto us, because the Church judges them to be agreeable to the law of God and nature, or because the Church proves unto us, by evident reasons, that they are indeed agreeable unto these laws. If they yield us the latter, then it is not the Church’s law, but the Church’s reasons given for her law, which can warrant the lawfulness of them unto us; which does elude and elide all that which they allege for the lawfulness of them from the power and authority of the Church. And further, if any such reasons be to be give forth for the ceremonies, why are they so long kept up from us?… It will be answered (I know), that if they Church command anything repugnant to God’s Word we are not bound to do it, nor to receive it as lawful, though the Church judge so of it; but otherwise, if that which the Church judges to be agreeable to the law of God and nature (and in that respect prescribes) be not repugnant to the Word of God, but in itself indifferent, then are we to embrace it as convenient, and consonant to the law of God and nature, neither ought we to call in question the lawfulness of it. But I reply, that [in this case] either we must judge a thing to be repugnant or not repugnant to the Word, to be indifferent or not indifferent in itself, [merely] because the Church judges so of it [which is insufficient to conscience], or else because the Church proves unto us by an evident reason that it is so… the argument is still set afoot [incomplete]; then we must receive everything (be it ever so bad) as indifferent, if only the Church happen so to judge of it; for quod competit alicui qua tale, etc. So that if we receive anything as indifferent, for this respect, because the Church judges it to be so, then shall we receive everything for indifferent which the Church shall so judge of [which is absurd].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), Pt. 3, Ch. 7, Sections 7, pp. 131-3</span></figcaption>

d&amp;text=If%20the%20Church%20prescribe%20anything%20lawfully%2C%20so%20that&amp;text=Church%20shall%20so%20judge%20of%20%5Bwhich%20is%20absurd" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ec975dbf30" data-kw="Councils Authority of councils Sola Scriptura">
<blockquote><p>What, then, you will say, is there no authority in the definitions of councils? Yes, indeed; for I do not contend that all councils are to be condemned, and all their acts rescinded, or, as it is said, made one complete erasure. But you are bringing them all (it will be said) under subordination, and so leaving every one at liberty to receive or reject the decrees of councils as he pleases. By no means; but whenever the decree of a council is produced, the first thing I would wish to be done is, to examine at what time it was held, on what occasion, with what intention, and who were present at it; next I would bring the subject discussed to the standard of Scripture. … In this way, councils would be duly respected, and yet the highest place would be given to Scripture, everything being brought to it as a test.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.8</span></figcaption>

<blockquote><p>…we shall premise some common and known truths concerning Church-judicatories and their decrees and sentences, as: 1. That (to express it in Calvin’s words, in the eighth chapter of the fourth book of his Institutions) whatsoever reverence or dignity is by the Spirit of God in the Scriptures given, whether to the priests, or prophets, or apostles, or their successors, all of it is given not properly to men themselves, but to the ministry, wherewith they are clothed; or (to speak more expeditely) to the Word; the ministry whereof is committed unto them, Ex. 3:4; 14:31; Deut. 17:•; Mal. 2:46; Deut. 17:10; Eze. 3:17; Jer. 23:28; Jer. 1:6; Mt. 28:19; Acts 15:10; etc. 2. That as their authority is founded upon, and wholly derived from the Word of God, so in the administration and exercise thereof, they are in all things to walk according to this rule, Isa. 8:19-20; Mal. 2:6-7; Mt. 28:19. 3. That Church-power is not a lordly and magisterial power, but a lowly and ministerial-power, not an absolute and autocratoric, but a limited and hyperetic-[below-kind-of-]power; and that Church decrees and sentences are all of them regulae regulatae, [rules being regulated] rules that are subordinated, and do not bind but in the Lord, and so far as they are conform to that first inflexible and unerring-rule, prescribed by Himself, Lk. 22:24-27; Gal. 6:16; 1 Peter 5:2-3; 1 Tim. 3:15-17; 1 Thess. 5:12; Eph. 6:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (1658), p. 95-6</span></figcaption>

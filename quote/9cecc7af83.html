<blockquote><p>2. …For the power of the keys is not given to the catholic presbytery as to the first subject, to be a mean of edification in an ordinary and constant way; but only in an extraordinary and occasional way, in those things which concern the power of jurisdiction belonging to the whole catholic Church. By ‘extraordinary’ here, I mean not that which is against a particular law of God, and cannot be done without a divine dispensation of providence, but by ‘extraordinary’ I mean that which is raro contingens, and does not oft fall out; as almost it never falls out that the universal Church has need to excommunicate a national Church, for all and every one of a national Church do never fall away from the faith. Yet a remote power for excommunication is in the catholic visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 299</span></figcaption>

<blockquote><p>Hence, by the way, a word of that necessary and judicious question moved by Calvin, Mt. 18:18, ‘What ye bind on earth,’ etc. Since the Church tolerateth many hypocrites and absolveth and looseth many who do but counterfeit and fancy repentance, shall we say that such are loosed and pardoned in heaven? Some say [that] by ‘heaven’ here is meant the visible Church; and they distinguish between sin and scandal: and therefore that by ‘binding and loosing’, here is meant, not forgiveness or justification, or absolution from the guilt of sin in Heaven, or in the Court of God, or condemnation for that sin, but only deliverance from scandal and the removing of scandal and admitting of the man into the visible Church as a member: suppose his repentance be but hypocritical, yet when the Church proceedeth impartially according to the Rule of Christ, the sentence is ratified by God, and the man is loosed from the scandal, though not from the sin; the sin is yet bound before God, because he hath not really repented; otherwise the Church, who knows not heart-actings and who really repent, who not, though proceeding right according to the rule of Christ, should not have the promise of ratifying in Heaven what they do on earth, fulfilled to them; which cannot be said. But taking it for a good observation that Calvin hath here, that Mt. 16, Christ speaketh of binding and loosing concional, by the Word preached; but here, Mt. 18, he speaketh especially of binding and loosing juridical in the court of the Church, by excommunication or absolution from that sentence. In the former consideration the question is easy. No pastor in preaching Gospel-promises or threatnings can bind, but conditionally: If the party do not believe and repent, the man’s sin is bound in Heaven; if he do believe and repent, his sin is loosed in heaven. As to the other [Mt. 18], we find in the Word no such signification of binding and loosing in regard of scandal, but they are ever spoken of in regard of sin and the guilt thereof. And therefore:

1. Calvin saith well that the speech of Christ is directed to no other than to those who duly and sincerely do reconcile themselves with the Church; and the Lord being willing to comfort trembling consciences, is not setting down a rule for comforting of hypocrites: But by the contrary, because hypocrites s[b?]oldly provoke to the Tribunal of God, when for gross scandals they are justly cast out; our Savior saith, The sentence of excommunication is ratified in Heaven. The Scripture-rule is for such as obey, and for those who fulfill the condition, non de obliquis [not for those who are crosswise]. As to the doubt that the Church often absolves such who really repent not, how then can the hypocrite be loosed in Heaven, when the Lord knows he does but fancy repentance? Answer: Two things here are to be distinguished:

1. The Church’s proceeding in the external Court as relating to them, if they impartially, according to the rule of Christ, proceed and be not sudden in re-admitting, but see [that] the incestuous man near swallowed up (though one man’s measure of visible repentance be not the rule to all) before they confirm their love to him, and forgive him, 2 Cor.

2. Suppose his repentance be but counterfeit, or not saving and real, as was that of Ahab, yet are they to receive him, and admit him to the ordinances, and the Lord ratifies what they do in Heaven. As:

1. The Lord ratifies Philip’s baptizing of Magus; and the Lord approves the servants inviting to the marriage-supper the man that wanted the wedding-garment: for what the Lord commands, that He must approve and ratify in Heaven.

2. What in charitable judgments is praise-worthy, that God also must ratify in Heaven; yea, it is praise-worthy in the disciples, when they heard Christ say, ‘One of you twelve hath a Devil, one of you shall betray the Son of Man;’ every one suspected and feared himself; none of the eleven suspected Judas, but gave him charity.

3. Without this God should not approve the gathering of Churches, nor the casting of the draw-net in the sea, nor the sowing of seed upon all sort of grounds, the way side, the thorny, the rocky, the good ground, that the chosen, who are yet in the state of nature, may be brought in and effectually called. But in receiving in excommunicates, the Church would not be sudden. In the ancient Church, sacrificers to Idols were six years before they were received; they that defiled themselves with beasts, were debarred from the sacrament thirty years; adulterers, seven; women who made away their births, ten years; such as uncompelled denied the faith, twelve years. What other years Burchardus and Gratianus have, may be seen. Something for edification sure there was here.

2. There is another thing here, which concerneth the conscience of him who is to be received, and when the Church-Court applies the sentence to the conscience for his personal pardon, sure whatever satisfaction the people have for removing of the scandal, the sentence of absolution so relating to him, is concional, not properly juridical; and conditional, not absolute; and therefore is to be pronounced by the mouth of the Church, the Pastor, thus: ‘Be it unto thee according to thy faith and repentance;’ and except the man really repent, his sin is not loosed in Heaven. So then, the Churches loosing from the scandal is conditional, upon a seen condition of outward repentance morally sincere to the Churches apprehension, but they simply and absolutely make him a citizen of the Church and admit him to ordinances according to the command of Christ, both in private and public Church offences (If thy brother who offended, repent, forgive him), but his loosing from the sin or guilt in heaven, is ever conditional and never absolutely to be pronounced by the Pastor, the mouth of the Church, who cannot certainly know the condition. Hence:

1. The scandal is loosed in earth and heaven; the Church impartially following the rule of Christ sometime when the sin remains and is bound in heaven.

2. The Church may say the man is absolutely freed from the scandal, so as the Church sins not in receiving him in, if they follow the rule; but he sins, and the scandal is bound in coming in, if he repent not: and also as to the guilt, he is freed from the sin only conditionally, for the condition of removal of the scandal is seen, and visible: but the condition of the loosing from sin is invisible.

3. Sometime the man is both loosed from the scandal and from the sin, and every way loosed in heaven and earth, when he both really and visibly repents.

4. The Church should go as near in readmitting a fallen sinner, and loosing him on earth as they can discern the Lord’s loosing in Heaven: the Corinthians seem to exceed in this, 2 Cor. 2:7, so that contrariwise, ye ought rather to forgive him.

5. There is more of real saintship required, to receive in again one who hath been once a member and hath fallen, and was cast out, than to admit a member newly come from paganism:

1. The larger the means of salvation have been, the greater guiltiness, as the scandal of a Christian is greater than the sin and scandal of a Sodomite, Mt. 10:15; Mt. 11:22; Mt. 12:41-42. And therefore the repentance of the one must be more signal and larger than the repentance of the other.

2. There is not such a measure of marriage-love required of a virgin before she be married, as after she hath been married, and born children to the husband; nor can any say there is so much knowledge required in a new entrant that knows not the first elements of philosophy, as in one who hath studied seven years. Hence 6, it is utterly false that as visible saintship and real repentance, as far as can be, is required of one excommunicate, before he can be received in again; so real visible saintship, as far as can be seen, must be required in members before they be first admitted. But I desire our [congregationalist] Brethren, if they judge the first receiving into the Church a loosing from sin and scandal, as readmission is, they will teach it me.</p></blockquote>

ormer+consideration+the+question+is+easy.+No+pastor+in+preaching+Gospel-promises+or+threatnings+can+bind%2C+but+conditionally%3A+If+the+party+do+not+believe+and+repent%2C+the+man%E2%80%99s+sin+is+bound+in+Heaven%3B+if+he+do+believe+and+repent%2C+his+sin+is+loosed+in+heaven.+As+to+the+other+%5BMt.+18%5D%2C+we+find+in+the+Word+no+such+signification+of+binding+and+loosing+in+regard+of+scandal%2C+but+they+are+ever+spoken+of+in+regard+of+sin+and+the+guilt+thereof.+And+therefore%3A+1.+Calvin+saith+well+that+the+speech+of+Christ+is+directed+to+no+other+than+to+those+who+duly+and+sincerely+do+reconcile+themselves+with+the+Church%3B+and+the+Lord+being+willing+to+comfort+trembling+consciences%2C+is+not+setting+down+a+rule+for+comforting+of+hypocrites%3A+But+by+the+contrary%2C+because+hypocrites+s%5Bb%3F%5Doldly+provoke+to+the+Tribunal+of+God%2C+when+for+gross+scandals+they+are+justly+cast+out%3B+our+Savior+saith%2C+The+sentence+of+excommunication+is+ratified+in+Heaven.+The+Scripture-rule+is+for+such+as+obey%2C+and+for+those+who+fulfill+the+condition%2C+non+de+obliquis+%5Bnot+for+those+who+are+crosswise%5D.+As+to+the+doubt+that+the+Church+often+absolves+such+who+really+repent+not%2C+how+then+can+the+hypocrite+be+loosed+in+Heaven%2C+when+the+Lord+knows+he+does+but+fancy+repentance%3F+Answer%3A+Two+things+here+are+to+be+distinguished%3A+1.+The+Church%E2%80%99s+proceeding+in+the+external+Court+as+relating+to+them%2C+if+they+impartially%2C+according+to+the+rule+of+Christ%2C+proceed+and+be+not+sudden+in+re-admitting%2C+but+see+%5Bthat%5D+the+incestuous+man+near+swallowed+up+%28though+one+man%E2%80%99s+measure+of+visible+repentance+be+not+the+rule+to+all%29+before+they+confirm+their+love+to+him%2C+and+forgive+him%2C+2+Cor.+2.+Suppose+his+repentance+be+but+counterfeit%2C+or+not+saving+and+real%2C+as+was+that+of+Ahab%2C+yet+are+they+to+receive+him%2C+and+admit+him+to+the+ordinances%2C+and+the+Lord+ratifies+what+they+do+in+Heaven.+As%3A+1.+The+Lord+ratifies+Philip%E2%80%99s+baptizing+of+Magus%3B+and+the+Lord+approves+the+servants+inviting+to+the+marriage-supper+the+man+that+wanted+the+wedding-garment%3A+for+what+the+Lord+commands%2C+that+He+must+approve+and+ratify+in+Heaven.+2.+What+in+charitable+judgments+is+praise-worthy%2C+that+God+also+must+ratify+in+Heaven%3B+yea%2C+it+is+praise-worthy+in+the+disciples%2C+when+they+heard+Christ+say%2C+%E2%80%98One+of+you+twelve+hath+a+Devil%2C+one+of+you+shall+betray+the+Son+of+Man%3B%E2%80%99+every+one+suspected+and+feared+himself%3B+none+of+the+eleven+suspected+Judas%2C+but+gave+him+charity.+3.+Without+this+God+should+not+approve+the+gathering+of+Churches%2C+nor+the+casting+of+the+draw-net+in+the+sea%2C+nor+the+sowing+of+seed+upon+all+sort+of+grounds%2C+the+way+side%2C+the+thorny%2C+the+rocky%2C+the+good+ground%2C+that+the+chosen%2C+who+are+yet+in+the+state+of+nature%2C+may+be+brought+in+and+effectually+called.+But+in+receiving+in+excommunicates%2C+the+Church+would+not+be+sudden.+In+the+ancient+Church%2C+sacrificers+to+Idols+were+six+years+before+they+were+received%3B+they+that+defiled+themselves+with+beasts%2C+were+debarred+from+the+sacrament+thirty+years%3B+adulterers%2C+seven%3B+women+who+made+away+their+births%2C+ten+years%3B+such+as+uncompelled+denied+the+faith%2C+twelve+years.+What+other+years+Burchardus+and+Gratianus+have%2C+may+be+seen.+Something+for+edification+sure+there+was+here.+2.+There+is+another+thing+here%2C+which+concerneth+the+conscience+of+him+who+is+to+be+received%2C+and+when+the+Church-Court+applies+the+sentence+to+the+conscience+for+his+personal+pardon%2C+sure+whatever+satisfaction+the+people+have+for+removing+of+the+scandal%2C+the+sentence+of+absolution+so+relating+to+him%2C+is+concional%2C+not+properly+juridical%3B+and+conditional%2C+not+absolute%3B+and+therefore+is+to+be+pronounced+by+the+mouth+of+the+Church%2C+the+Pastor%2C+thus%3A+%E2%80%98Be+it+unto+thee+according+to+thy+faith+and+repentance%3B%E2%80%99+and+except+the+man+really+repent%2C+his+sin+is+not+loosed+in+Heaven.+So+then%2C+the+Churches+loosing+from+the+scandal+is+conditional%2C+upon+a+seen+condition+of+outward+repentance+morally+sincere+to+the+Churches+apprehension%2C+but+they+simply+and+absolutely+make+him+a+citizen+of+the+Church+and+admit+him+to+ordinances+according+to+the+command+of+Christ%2C+both+in+private+and+public+Church+offences+%28If+thy+brother+who+offended%2C+repent%2C+forgive+him%29%2C+but+his+loosing+from+the+sin+or+guilt+in+heaven%2C+is+ever+conditional+and+never+absolutely+to+be+pronounced+by+the+Pastor%2C+the+mouth+of+the+Church%2C+who+cannot+certainly+know+the+condition.+Hence%3A+1.+The+scandal+is+loosed+in+earth+and+heaven%3B+the+Church+impartially+following+the+rule+of+Christ+sometime+when+the+sin+remains+and+is+bound+in+heaven.+2.+The+Church+may+say+the+man+is+absolutely+freed+from+the+scandal%2C+so+as+the+Church+sins+not+in+receiving+him+in%2C+if+they+follow+the+rule%3B+but+he+sins%2C+and+the+scandal+is+bound+in+coming+in%2C+if+he+repent+not%3A+and+also+as+to+the+guilt%2C+he+is+freed+from+the+sin+only+conditionally%2C+for+the+condition+of+removal+of+the+scandal+is+seen%2C+and+visible%3A+but+the+condition+of+the+loosing+from+sin+is+invisible.+3.+Sometime+the+man+is+both+loosed+from+the+scandal+and+from+the+sin%2C+and+every+way+loosed+in+heaven+and+earth%2C+when+he+both+really+and+visibly+repents.+4.+The+Church+should+go+as+near+in+readmitting+a+fallen+sinner%2C+and+loosing+him+on+earth+as+they+can+discern+the+Lord%E2%80%99s+loosing+in+Heaven%3A+the+Corinthians+seem+to+exceed+in+this%2C+2+Cor.+2%3A7%2C+so+that+contrariwise%2C+ye+ought+rather+to+forgive+him.+5.+There+is+more+of+real+saintship+required%2C+to+receive+in+again+one+who+hath+been+once+a+member+and+hath+fallen%2C+and+was+cast+out%2C+than+to+admit+a+member+newly+come+from+paganism%3A+1.+The+larger+the+means+of+salvation+have+been%2C+the+greater+guiltiness%2C+as+the+scandal+of+a+Christian+is+greater+than+the+sin+and+scandal+of+a+Sodomite%2C+Mt.+10%3A15%3B+Mt.+11%3A22%3B+Mt.+12%3A41-42.+And+therefore+the+repentance+of+the+one+must+be+more+signal+and+larger+than+the+repentance+of+the+other.+2.+There+is+not+such+a+measure+of+marriage-love+required+of+a+virgin+before+she+be+married%2C+as+after+she+hath+been+married%2C+and+born+children+to+the+husband%3B+nor+can+any+say+there+is+so+much+knowledge+required+in+a+new+entrant+that+knows+not+the+first+elements+of+philosophy%2C+as+in+one+who+hath+studied+seven+years.+Hence+6%2C+it+is+utterly+false+that+as+visible+saintship+and+real+repentance%2C+as+far+as+can+be%2C+is+required+of+one+excommunicate%2C+before+he+can+be+received+in+again%3B+so+real+visible+saintship%2C+as+far+as+can+be+seen%2C+must+be+required+in+members+before+they+be+first+admitted.+But+I+desire+our+%5Bcongregationalist%5D+Brethren%2C+if+they+judge+the+first+receiving+into+the+Church+a+loosing+from+sin+and+scandal%2C+as+readmission+is%2C+they+will+teach+it+me.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+Penned+by+Mr.+Thomas+Hooker%2C+%E2%80%A6+wherein+the+way+of+the+Churches+of+New+England+is+now+Re-examined+%28London%2C+1658%29%2C+Book+1%2C+ch.+14%2C+pp.+148-51&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F49bacb0323.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/49bacb0323.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-excommunication/#:~:text=Hence%2C%20by%20the%20way%2C%20a%20word,is%2C%20they%20will%20teach%20it%20me&amp;text=Hence%2C%20by%20the%20way%2C%20a%20word%20of%20that&amp;text=as%20readmission%20is%2C%20they%20will%20teach%20it%20me" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The O. S. [Old School] Assembly in 1853 decided that in some cases the Session may dismiss a member without specifying the church with which he is to unite. But the reunited Church in 1871 urged upon Sessions the importance of giving to members who remove from them either letters of dismission and recommendation to a particular church, or, in case of uncertain destination, letters of credence. The O. S. Assembly in 1869 recommended that the Session should furnish any member removing from their bounds, whether in full communion or member by baptism only, with testimonials of his standing, which should be presented as soon as possible to some church of our connection, and that such person be advised to transfer his relation at the earliest opportunity… … May a member connect himself with another church on profession of faith? If the church with which he unites [by profession of faith] be one of another denomination, the Session may order his name to be struck from the roll of communicants, or may, by process of discipline, suspend him from church privileges. The N. S. [New School] Assembly in 1839 recommended that no other action should be taken than to strike his name from the roll. This action was reaffirmed by the Assemblies of 1879 and 1882, and was in 1884 embodied in the revised Book of Discipline. How are absent members to be treated? … When one has been absent for years and his residence unknown, the Session should make record of the fact, and declare that he has forfeited his good standing until he returns and accounts for his absence. The O. S. As- sembly in 1865 passed a similar order. That body had in 1856 required that the names of absentees, whose whereabouts are unknown, be placed on a reserved list, and not be reported among the communicants until they return and satisfy the Session. The Assembly of the reunited Church ratified the above in 1872 by declaring, “It may nevertheless be well for each church to record on a separate list the names of those who have been absent for more than two years from their church relations, and whose residence is unknown; and the names thus recorded may be omitted in the statistical returns of the church. The ‘Book of Discipline’ adopted in 1884 authorized the Session to erase the names of absentees after three years and place them on the reserved list.</p></blockquote>

<blockquote><p>5. All our divines, standing for the certainty of the perseverance of the regenerated, answer Papists and Arminians alleging for the apostasy of the saints, the example of the regenerated who may be excommunicated, that excommunication does never evince [prove] that the person excommunicated is out of the state of grace, but only that he has fallen into a scandalous external fact, which deserves that he should be delivered to Satan; and that one may be a member [in some way] of the visible Church and converted to God, who is excommunicated.</p></blockquote>

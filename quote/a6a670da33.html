<main class="wrap"><figure class="quote" id="q-a6a670da33" data-kw="Affliction Comfort Love">
<blockquote><p>What a comfort it is to believe this doctrine. If we are poor, or sick, or bereaved, or defamed, how delightful it is to know that it is the Lord, and not man; the Lord and not Satan; a friend and not an enemy; a most tender father and not a capricious master—who thus ordains. David was wise when he said, &quot;Let me fall into the hand of the Lord, and not into the hand of man.&quot; Luther said, &quot;Smite, Lord, for you love me.&quot; Every child of God may say as much.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-plumer.html">William S. Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “Practical Remarks on the Nature of God’s Providence”</span></figcaption>

</figure><figure class="quote" id="q-9c2ff7740d" data-kw="Sovereignty Wisdom Comfort">
<blockquote><p>Our God is not only infinite in power. He is infinite in wisdom and goodness too. And herein is the preciousness of this truth. God wills only that which is good and His will is irreversible and irresistible! God is too wise to err and too loving to cause His child a needless tear. Therefore if God be perfect wisdom and perfect goodness how blessed is the assurance that everything is in His hand and molded by His will according to His eternal purpose!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sovereignty of God</cite>, ch. 12, “The Value of This Doctrine” (6. It supplies comfort in sorrow)</span></figcaption>

</figure><figure class="quote" id="q-70c5ed81b1" data-kw="Comfort Wisdom">

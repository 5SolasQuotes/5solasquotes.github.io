<main class="wrap"><figure class="quote" id="q-c952601d72" data-kw="">
<blockquote><p>…whereas original sin does necessarily incline him to sinful actions and courses in general; though to this kind of sin in special, or to this particular, in what kindsoever, it does not… when once God has planted in us a principle of new life, of the life of grace, by the spirit of regeneration, though all the powers thereof do incline only to that which is good, like as the powers of natural corruption incline only unto evil, yet the particular use and exercise of those is always free: Like as the particular use and exercise of the powers of our corruption is always free to the committing of this or that sin according unto emergent occasions standing in congruity to every man’s particular disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath</cite>, … (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, sect. 8, p. 103</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“…whereas original sin does necessarily incline him to sinful actions and courses in general; though to this kind of sin in special, or to this particular, in what kindsoever, it does not… when once God has planted in us a principle of new life, of the life of grace, by the spirit of regeneration, though all the powers thereof do incline only to that which is good, like as the powers of natural corruption incline only unto evil, yet the particular use and exercise of those is always free: Like as the particular use and exercise of the powers of our corruption is always free to the committing of this or that sin according unto emergent occasions standing in congruity to every man’s particular disposition.”

— William Twisse, The Riches of God’s Love unto the Vessels of Mercy… (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions, sect. 8, p. 103">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6whereas+original+sin+does+necessarily+incline+him+to+sinful+actions+and+courses+in+general%3B+though+to+this+kind+of+sin+in+special%2C+or+to+this+particular%2C+in+what+kindsoever%2C+it+does+not%E2%80%A6+when+once+God+has+planted+in+us+a+principle+of+new+life%2C+of+the+life+of+grace%2C+by+the+spirit+of+regeneration%2C+though+all+the+powers+thereof+do+incline+only+to+that+which+is+good%2C+like+as+the+powers+of+natural+corruption+incline+only+unto+evil%2C+yet+the+particular+use+and+exercise+of+those+is+always+free%3A+Like+as+the+particular+use+and+exercise+of+the+powers+of+our+corruption+is+always+free+to+the+committing+of+this+or+that+sin+according+unto+emergent+occasions+standing+in+congruity+to+every+man%E2%80%99s+particular+disposition.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%E2%80%A6+%28d.+1646%3B+Oxford%2C+1653%29%2C+bk.+2%2C+An+Examination+of+Certain+Passages+inserted+into+Mr.+Hord%E2%80%99s+Discourse%2C+Answer+to+the+Additions%2C+sect.+8%2C+p.+103&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc952601d72.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c952601d72.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/calvinism/total-depravity/#:~:text=whereas%20original%20sin%20does%20necessarily%20incline,congruity%20to%20every%20man%E2%80%99s%20particular%20disposition&amp;text=whereas%20original%20sin%20does%20necessarily%20incline%20him%20to&amp;text=standing%20in%20congruity%20to%20every%20man%E2%80%99s%20particular%20disposition" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></

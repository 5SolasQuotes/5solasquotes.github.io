</figure><figure class="quote" id="q-e9df0142ce" data-kw="">
<blockquote><p>There have been certain strange folk who have wished to suggest from this passage [Mt. 1:24-25] that the Virgin Mary had other children than the Son of God, and that Joseph had then dwelt with her later; but what folly this is! for the gospel writer did not wish to record what happened afterwards; he simply wished to make clear Joseph’s obedience [to the angel in Mt. 1:24] and to show also that Joseph had been well and truly assured that it was God who had sent His angel to Mary. He had therefore never dwelt with her nor had he shared her company. There we see that he had never known her person for he was separated from his wife. He could marry another all the more because he could not enjoy the woman to whom he was betrothed; but he rather desired to forfeit his rights and abstain from marriage [for the time?], being yet always married: he preferred, I say, to remain thus in the service of God rather than to consider what he might still feel that he could come to. He had forsaken everything in order that he might subject himself fully to the will of God. And besides this, our Lord Jesus Christ is called the first-born. This is not because there was a second or a third, but because the gospel writer is paying regard to the precedence. Scripture speaks thus of naming the first-born whether or no there was any question of the second. Thus we see the intention of the Holy Spirit. This is why to lend ourselves to foolish subtleties would be to abuse Holy Scripture, which is, as St. Paul says, “to be used for our edification.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon 22 on Matthew 1:22-25</cite>, (1562), from Corpus Reformatorum, vol. 46, pp. 259-272 (not currently on the net) as given in Max Thurian (a Protestant), Mary: Mother of All Christians, trans. Nevill B. Cryer (New York: Herder &amp; Herder, 1963), pp. 39-40. The French and this English excerpt, along with another larger translation of the French, has been provided by the Roman apologist Dave Armstrong, ‘John Calvin: Sermon 22 on Matthew 1:22-25 (Mary’s Perpetual Virginity)’.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-1b78151012" data-kw="">
<blockquote><p>8. Question: Since she was ordained by God to be the mother of our Savior, and was thus to remain a pure virgin, why then must she be married to Joseph according to God’s providence? Answer: So that she would have in him a carer and a guardian, who would partly shield her pregnant body from evil suspicion and the strictness of the Mosaic law, and partly protect her and her future son’s holy persons from all violence and inconvenience, and would be helpful to them with advice and deed. … 15th Question: Was the holy Virgin before, during &amp; after the birth, &amp; herewith an ever-pure virgin? Answer: That she was before and during the birth a pure virgin Holy Writ testifies clearly (Isa. 7:14 &amp; Mt. 1:23). Thus, we also do not doubt that after the birth and herewith she was an ever-pure virgin, partly because Holy Writ, if it had been otherwise, would not have concealed such; partly since otherwise the Lord Christ at the cross would not have entrusted her to John, if she had borne other more children. 16th Question: But why is the Lord Christ called (Mt. 1:25) the firstborn son of Mary; and why are the brothers of Christ mentioned (Mk. 6:3)? Answer: He is called the firstborn son of Mary the Lord not because others were after Him, but because no other was born before Him. And those who are named brothers of Christ were not his biological brothers, but according to the manner of speaking common in God’s Word, they were his closest friends and relatives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Short Instruction on the holy and highly lauded Virgin Mary, for a better understanding of the simple-minded, set up in a question and answer format’</cite>, tr. by AI by dvinb150 (Zurich: Gessner, 1673), pp. 5 &amp; 9 German in Schriftmässiger Bericht von der Jungfrauen Maria (Zürich: Gessner, 1673)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-2113e769cf" data-kw="">
<blockquote><p>‘And knew her not’; This passage afforded the pretext for great disturbances, which were introduced into the Church, at a former period, by Helvidius. The inference he drew from it was, that Mary remained a virgin no longer than till her first birth, and that afterwards she had other children by her husband. Jerome, on the other hand, earnestly and copiously defended Mary’s perpetual virginity. Let us rest satisfied with this, that no just and well-grounded inference can be drawn from these words of the Evangelist, as to what took place after the birth of Christ. He is called first-born; but it is for the sole purpose of informing us that he was born of a virgin. It is said that Joseph knew her not till she had brought forth her first-born son: but this is limited to that very time. What took place afterwards, the historian does not inform us. Such is well known to have been the practice of the inspired writers. Certainly, no man will ever raise a question on this subject, except from curiosity; and no man will obstinately keep up the argument, except from an extreme fondness for disputation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 1:25</span></figcaption>

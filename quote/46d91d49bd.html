<main class="wrap"><figure class="quote" id="q-46d91d49bd" data-kw="">
<blockquote><p>We look for truth in ourselves when we judge ourselves; in our neighbors when we have sympathy for their sufferings; in itself when we contemplate it with a clean heart. It is important to observe the order of these degrees as well as their number. First of all, truth teaches us that we must look for it in our neighbors before we seek it in itself. You will then see easily why you must seek it in yourself before you seek it in your neighbors. In the list of the beatitudes the merciful are spoken of before the clean of heart.

The merciful quickly grasp the truth in their neighbors when their heart goes out to them with a love that unites them so closely that they feel the neighbors’ good and ill as if it were their own. With the weak they are weak, with the scandalized they are on fire. They “rejoice with those who rejoice and weep with those weep.” Their hearts are made more clear-sighted by love and they experience the delight of contemplating truth, not now in others but in itself, and for love of it they bear their neighbors’ sorrows.

A man who does not live in harmony with his brothers, who mocks at those who weep and sneers at those who are glad, has no sympathy with them because their feelings do not affect him, he can never really see the truth in others. The proverb fits him well: the sound man feels not the sick man’s pains, nor the well-fed man the pangs of the hungry. It is fellow-sufferers that readily feel compassion for the sick and the hungry. For just as pure truth is seen only by the pure of heart, so also a brother’s miseries are truly experienced only by one who has misery in his own heart. You will never have real mercy for the failings of another until you know and realize that you have the same failings in your soul.

Our Savior has given us the example. He willed to suffer so that he might know compassion; to learn mercy he shared our misery. It is written: “He learned obedience from the things he suffered;” and he learned mercy in the same way. I do not mean that he did not know how to be merciful before; his mercy is from eternity to eternity; but what in his divine nature he knows from all eternity he learned by experience in time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Steps of Humility and Pride</cite>, (1124), trans. M. Ambrose Conway, Cistercian Fathers Series: Number Thirteen A (Trappist KY: Cistercian Publications, 1973), pp 34-35.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-024bd578e7" data-kw="">
<blockquote><p>What is meant by our forgiving them [Mt. 6:12]? It is our hearty forgiving them the injury done to us (to forgive the injury against God is not in our power), entertaining no hatred or malice against them, but loving them with a love of goodwill, heartily wishing their good, and being ready to do them good, Mt. 5:44-45: ‘But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, pray for them that despitefully use you, and persecute you; that ye may be the children of your Father which is in heaven, for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust.’ But it does not extend to a love of complacency or delight in them in whom there appears no ground for that, either as men or as Christians. Ps. 26:4, ‘I have not sat with vain persons,’ says David, ‘neither will I go in with dissemblers.’</p></blockquote>

<blockquote><p>3. When Christ commands his disciples to bless them that curse them and persecute them, He gives not therein a rule to public officers, whether in Church or commonweal, to suffer notorious sinners, either in life or doctrine, to pass away with a blessing: But to private Christians to suffer persecution patiently, yea and to pray for their persecutors. Again, it is true, Christ would have his disciples to be far from persecuting (for that is a sinful oppression of men for righteousness sake) but that hinders not but that He would have them execute upon all disobedience the judgement and vengeance required in the Word, 2 Cor. 10:6; Rom. 13:4.

4. Though it be true that wicked persons now may by the grace of God become true disciples and converts, yet we may not do evil that good may come thereof: And evil it would be to tolerate notorious evil-doers, whether seducing teachers or scandalous livers. Christ had something against the angel of the Church of Pergamus for tolerating them that held the doctrine of Balaam, and against the Church of Thiatira for tolerating Jezabel to teach and seduce, Rev. 2:14, 20.</p></blockquote>

<blockquote><p>This is the utmost curse of God; because, if men have no political government, they will hardly differ at all from beasts. Indeed, their condition will be far worse, for beasts can dispense with a governor, because they do not make war against their own kind; but nothing can be more cruel than man, if he be not held by some restraint, for every one be driven by the furious eagerness of his own passions to every kind of vicious indulgence.</p></blockquote>

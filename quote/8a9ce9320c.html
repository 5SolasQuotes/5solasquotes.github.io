<main class="wrap"><figure class="quote" id="q-8a9ce9320c" data-kw="necessity">
<blockquote><p>About the necessity of baptism, a double question is agitated. The first of the Socinians, who erring in defect, not only deny the necessity of the means, but do not wish to acknowledge even the necessity of the command. The other of the Romanists, who erring in excess, assert its absolute necessity. Concerning the former we now treat; hereafter we will treat of the latter. Statement of the question.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.12.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/baptism-in-rome.html">Baptism in Rome</a> › <a href="../topics/baptism/baptism-in-rome/necessity-of-baptism.html">Necessity of baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ff93b48a27" data-kw="">
<blockquote><p>Hence Romanists and Ritualists have inferred that the sign is inseparable from the grace signified, and that these spiritual effects are due to the outward ordinance. Hence the doctrine of baptismal regeneration. But it must be observed that the Scriptures do not assert these spiritual attributes of water baptism in itself considered, but of water baptism as the sign or emblem of baptism by the holy Ghost. These spiritual attributes belong only to baptism by the Spirit, and they accompany the sign only when the sign is accompanied by that which it signifies. It does not follow, however, that the sign is inseparable from the grace. The grace is sovereign; and experience teaches us that it is often absent from the sign, and that the sign is least frequently honoured by the presence of the grace when it is itself most implicitly relied upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, chs. 27–28 (on baptismal regeneration)</span></figcaption>

</figure><figure class="quote" id="q-4ddb9747d0" data-kw="covenant of grace">
<blockquote><p>Reply; How often have we shewed that this Text proves not that any Children, quatenus as such, should be baptized, nor, as such, that they are in the Covenant of Grace, or have the Promise made to them; the Promise runs to the Jews and to their Offspring, and not to them only, but to Gentiles also, who were said to be afar off: But pray observe, &#x27;tis to no more of the Jews and their Children or Offspring, and such who were afar off, than the Lord shall call or make Disciples by the Word and effectual Operations of the Holy Spirit. My Sons and Daughters are as much my Children when they are twenty or thirty Years old, as well as when Babes. Dr. Hammond also grants, Children in this Text doth not refer to Insants as such, but to the Posterity of the Jews, p. 490. Sect. 81. If ye be Christ&#x27;s, then you are Abraham&#x27;s Seed, and Heirs according to the Promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pedo-Baptism Disproved</cite></span></figcaption>

</figure><figure class="quote" id="q-b945658aed" data-kw="">
<blockquote><p>The first, the most obvious, and the most decisive argument against this doctrine is, that, so far as any work or act of the sinner is concerned, the Bible everywhere teaches that the only indispensable condition of salvation is faith in Jesus Christ.… Whosoever believes on the Son hath everlasting life. This stands firm. It matters not to what Church he may belong; it matters not whether he be Jew or Gentile, bond or free, learned or unlearned, good or bad, baptized or unbaptized, whosoever believes shall be saved.… Neither does the Bible anywhere teach that Christian baptism effects either pardon or regeneration in those still out of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, “Direct Arguments against the Doctrine of Baptismal Regeneration”</span></figcaption>

</figure><figure class="quote" id="q-d42412a951" data-kw="baptism of heretics">
<blockquote><p>What has been said in general of the baptism of heretics ought to be applied in particular to the baptism of the Romanists. Although we think it ought to be retained in those who come from them to us because the essentials of baptism remain with them; still we deny that it can rightly be sought or received from them, as will be proved more fully when we come to that subject. Sixteenth Question Was John’s baptism essentially the same as Christ’s baptism? We affirm against the Romanists I. Although this question appears to be less necessary in our day, when no one is baptized except with that baptism which the apostles administered; yet because it is wont to be fiercely agitated by the Romanists, we must speak briefly concerning it, in order that the truth of the orthodox doctrine concerning baptism may be the better illustrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19</span></figcaption>

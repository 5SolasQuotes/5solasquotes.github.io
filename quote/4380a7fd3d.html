<blockquote><p>I bless God they are not matters of compliance with sectaries, or designs or practices against his Majesty’s person or government, or the person or government of his royal father; my heart (I bless God) is conscious unto no disloyalty, nay, loyal I have been, and I commend it unto you to be loyal and obedient in the Lord: True piety is the foundation of true loyalty.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8161c95a42" data-kw="">
<blockquote><p>Lawyer: But why go you to the parish-churches when you might have better? Minister:

1. All non-conformists preach not better than many of them; yea, the liturgy is better words of prayer than some weak or faulty non-conformists often use.

2. A brown loaf and a white one both may be better than a white one alone; I found both best; and I knew it sin to renounce communion with any Church for weakness because they are not as good as others.

3. That is best at one time and place that is not so at another; praying in itself is better than working, and eating, sleeping. And yet in their proper time your servant’s working and your eating and sleeping is better than praying at that time. One that is a son, a servant, a wife who is commanded by the master of the family to hear a tolerable parish-minister may then find it better than disorderly and disobediently to hear an abler man; that may by variety of conditions be one man’s duty which is another’s sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, pp. 232-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>3. Nor does it belong to the essence of Presbyterial Government, that all members of this Church, and inferior judicatures, should so submit to the superior respective judicatures, that if they be grieved with the sentence, they ought to acquiesce thereunto, and not to contra-act, but only appeal, until there shall be a general assembly to determine the matter. This never was, and I trust, nor shall ever be their mind who are for presbyterial government; nor do our brethren justly father it upon the general Assembly, 1648, Session 30. For our Church acknowledges no subjection nor subordination of inferior judicatures unto superiors, but in the Lord, and so to submit to any sentence, and to forbear a duty of preaching the Gospel, praying, visiting, exhorting, catechizing pastorally in families, to abstain from the Lord’s Supper, and from acts of due censure necessary for the flock upon the known unjust sentence of a synod, until a general Assembly (which possibly cannot be convened in an age to determine) is to:

1. Obey men unjustly forbidding a called minister of Christ to preach in season, and out of season, rather than God; for they unjustly forbid, and the Lord justly commands; therefore the called minister must act and contra-act to their unjust sentence, and not forbear for an hour, as the Scripture clears, 2 Tim. 4:1-2; Acts 20:17-20; 1 Cor. 9:16; Isa. 58:1; Jer. 1:17; Eze. 2:3-5 &amp; 3:10,17; Acts 5:28-29; and so this is unjust.

2. It is to make synods and ecclesiastical judicatures lords of our faith, which the Reformed Churches detest in popish councils; for all men and councils most lawful can challenge only limited obedience and submission in the Lord to their determinations, if they speak and command ‘according to the Law and the Testimony’, Isa. 8:20, ‘otherwise there is no sight in them.’ And so it is popish.

3. We conceive in performing acts of that government which Christ owns in his Word, we do not sin; for no authority of a judicature can make that to be the word of God, and obedience to God, which was not, as to the matter, obedience to God before that authority, nor on the contrary. Now to abstain from preaching, praying, eating and drinking as the Lord’s Supper in a called minister, and in a visible professor, duly called and fitted, is sin; then cannot the authority of the Church, far less their known unjust sentence make it lawful.

4. Suppose the general Assembly should ratify and confirm the unjust sentence of the inferior judicature, or annul their just sentence, the people of God are not obliged to stand to either the one or the other. So we disown the point which our Brethren delivered to us in their papers for union sought by us, as nothing belonging to the essence of presbyterial government, but reject it as unsound, tyrannical and popish.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), Epistle to the Reader</span></figcaption>

</figure><figure class="quote" id="q-0823b12c19" data-kw="">
<blockquote><p>You must distinguish between: …

II. Between those parish-churches which have godly or tolerable pastors and those that have not.

III. Between ministry and lay-communion.

IV. Between stated and occasional communion.

V. Between preferring their churches before better, and not avoiding them as null, or as unlawful to be communicated with.</p></blockquote>

<blockquote><p>(6) Take heed of pretending to greater purity and strictness about Church-communion than the Word of God commends or the examples of Christ, of the apostles and the primitive Church commends. Nor be so extremely rigid as not to bear with things they have tolerated. Be not over-righteous, lest by over-straining ye both sin and do harm; yea, and plainly bewray it to be faction or humor, not conscience, which acts you. Calvin contra the Anabaptists, Act. 2, says, Cum sub specie studii perfectionis imperfectionem nullam tolerare possumus, tunc diabolum nos tume facere superbia, et hypocrisi se ducere, moneamur. Suppose your ministers were guilty (as they are not) of most of [the] things ye lay to their charge; Yet what an unparalleld, unheard of, unexamplified Separation is yours from them as to any warrantable precedent? (7) Make nothing necessary to the unity of the Church, or to the communion of pastors and people but what God has made necessary in his Word, or directed you to make. Put not every new opinion into your creed, nor every new course be added to the Decalogue, as if ye were to impose them upon or require them of others as such substantial articles of Faith or necessary duties that ye must renounce all religious fellowship with them who are not of that way, Acts 15:10. There is not a greater divider or separater than this tantizing or screwing up of debatable points wherein God has left us so much latitude, as not to make either the one or the other part of the controversy a necessary condition of Church-communion. O take no burden of strictness on you that is not of his imposing, Rev. 2:24-25.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“(6) Take heed of pretending to greater purity and strictness about Church-communion than the Word of God commends or the examples of Christ, of the apostles and the primitive Church commends. Nor be so extremely rigid as not to bear with things they have tolerated. Be not over-righteous, lest by over-straining ye both sin and do harm; yea, and plainly bewray it to be faction or humor, not conscience, which acts you. Calvin contra the Anabaptists, Act. 2, says, Cum sub specie studii perfectionis imperfectionem nullam tolerare possumus, tunc diabolum nos tume facere superbia, et hypocrisi se ducere, moneamur. Suppose your ministers were guilty (as they are not) of most of [the] things ye lay to their charge; Yet what an unparalleld, unheard of, unexamplified Separation is yours from them as to any warrantable precedent? (7) Make nothing necessary to the unity of the Church, or to the communion of pastors and people but what God has made necessary in his Word, or directed you to make. Put not every new opinion into your creed, nor every new course be added to the Decalogue, as if ye were to impose them upon or require them of others as such substantial articles of Faith or necessary duties that ye must renounce all religious fellowship with them who are not of that way, Acts 15:10. There is not a greater divider or separater than this tantizing or screwing up of debatable points wherein God has left us so much latitude, as not to make either the one or the other part of the controversy a necessary condition of Church-communion. O take no burden of strictness on you that is not of his imposing, Rev. 2:24-25.”

— John Bairdie, Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland (1674; London: Cockerill, 1681), pp. 181-82">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%286%29+Take+heed+of+pretending+to+greater+purity+and+strictness+about+Church-communion+than+the+Word+of+God+commends+or+the+examples+of+Christ%2C+of+the+apostles+and+the+primitive+Church+commends.+Nor+be+so+extremely+rigid+as+not+to+bear+with+things+they+have+tolerated.+Be+not+over-righteous%2C+lest+by+over-straining+ye+both+sin+and+do+harm%3B+yea%2C+and+plainly+bewray+it+to+be+faction+or+humor%2C+not+conscience%2C+which+acts+you.+Calvin+contra+the+Anabaptists%2C+Act.+2%2C+says%2C+Cum+sub+specie+studii+perfectionis+imperfectionem+nullam+tolerare+possumus%2C+tunc+diabolum+nos+tume+facere+superbia%2C+et+hypocrisi+se+ducere%2C+moneamur.+Suppose+your+ministers+were+guilty+%28as+they+are+not%29+of+most+of+%5Bthe%5D+things+ye+lay+to+their+charge%3B+Yet+what+an+unparalleld%2C+unheard+of%2C+unexamplified+Separation+is+yours+from+them+as+to+any+warrantable+precedent%3F+%287%29+Make+nothing+necessary+to+the+unity+of+the+Church%2C+or+to+the+communion+of+pastors+and+people+but+what+God+has+made+necessary+in+his+Word%2C+or+directed+you+to+make.+Put+not+every+new+opinion+into+your+creed%2C+nor+every+new+course+be+added+to+the+Decalogue%2C+as+if+ye+were+to+impose+them+upon+or+require+them+of+others+as+such+substantial+articles+of+Faith+or+necessary+duties+that+ye+must+renounce+all+religious+fellowship+with+them+who+are+not+of+that+way%2C+Acts+15%3A10.+There+is+not+a+greater+divider+or+separater+than+this+tantizing+or+screwing+up+of+debatable+points+wherein+God+has+left+us+so+much+latitude%2C+as+not+to+make+either+the+one+or+the+other+part+of+the+controversy+a+necessary+condition+of+Church-communion.+O+take+no+burden+of+strictness+on+you+that+is+not+of+his+imposing%2C+Rev.+2%3A24-25.%E2%80%9D%0A%0A%E2%80%94+John+Bairdie%2C+Balm+from+Gilead%2C+or+the+Differences+about+the+Indulgence+Stated+%26+Impleaded+in+a+Sober+%26+Serious+Letter+to+Ministers+%26+Christians+in+Scotland+%281674%3B+London%3A+Cockerill%2C+1681%29%2C+pp.+181-82&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F42ad36126d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/42ad36126d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=6%29%20Take%20heed%20of%20pretending%20to,not%20of%20his%20imposing%2C%20Rev.%202%3A24%2D25&amp;text=6%29%20Take%20heed%20of%20pretending%20to%20greater%20purity&amp;text=that%20is%20not%20of%20his%20imposing%2C%20Rev.%202%3A24%2D25" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

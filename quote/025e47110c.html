</figure><figure class="quote" id="q-14036e0edb" data-kw="">
<blockquote><p>You will have many factious zealots to please, who being strangers to the love of holiness, Christianity, and unity, are ruled by the interest of an opinion or sect: and these will never be pleased by you, unless you will be one of their side or party, and conform yourself to their opinions. If you be not against them, but set yourselves to reconcile and end the differences in the church, they will hate you as not promoting their opinions, but weakening them by some abhorred syncretisms. As in civil, so in ecclesiastical wars, the firebrands cannot endure the peaceable: if you will be neuters, you shall be used as enemies. If you be never so much for Christ, and holiness, and common truth, all is nothing, unless you be also for them, and their conceits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory in Practical Works</cite>, vol. 1, p. 187</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-2719866a3b" data-kw="">
<blockquote><p>Right from the beginning of the Revolution [of 1688-1689], there was an awareness by elements of the Societies’ leadership that the age of protests and remonstrances had come to an end and had been replaced by one of deft diplomatic manoeuvres and influencing outcomes. Instead of directly petitioning Orange for a Covenanted settlement, the Societies would renew the Covenants themselves in early March I689 and press other presbyterians to accept a Covenanted settlement through negotiation. Ultimately, that strategy failed. The pursuit of a Covenanted settlement within the fractured denominational landscape of post-Revolutionary Scotland was unrealistic, and in I69o, Shields, Boyd and Linning would lead the majority of the Societies to accept a uncovenanted presbyterian settlement of the Church under protest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-jardine.html">Mark Jardine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The United Societies: Militancy, Martyrdom &amp; the Presbyterian Movement in Late-Restoration Scotland</cite>, 1679 to 1688 PhD diss. (Univ. of Edinburgh, 2009), Conclusion, pp. 235-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

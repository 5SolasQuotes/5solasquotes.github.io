<main class="wrap"><figure class="quote" id="q-65b651acb9" data-kw="">
<blockquote><p>Now certain it is, that Women were not to Pray or to Prophesy in the Church as Teachers, for it was not permitted them to speak. They prayed therefore as joining in Prayer; and prophesy’d as attending upon Prophesying, that is, upon Preaching the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Two Covenants</cite>, (London: Richard Smith, 1712), p. 401.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>149. Seeing, then, that Covenants ought to embrace nothing but what is Scriptural and moral, and inasmuch as moral and Scriptural truth is in itself infinitely binding, are not Covenants, if not pernicious, at least unnecessary?

This objection, though plausible, is most deceptive. True, the obligation of the law of God is infinite, and hence this obligation cannot be increased: but, our obligation to keep the law of God may be increased. A Covenant superadds a new obligation, on our part, to keep the Divine law. An oath cannot make truth more true, but it increases our obligation to speak the truth; hence, the breach of an oath is not only lying, but perjury.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prize catechism on the principles and position of the Reformed Presbyterian Church</cite>, (Belfast, 1858), pp 62-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-f5684c4ef3" data-kw="">
<blockquote><p>She once of her own accord spake of her unsuccessfulness, in that she could not find God, or to that purpose. But on Thursday, the last day of July, about the middle of the day, the child being in the closet, where it used to retire, its mother heard it speaking aloud; which was unusual, and never had been observed before. And her voice seemed to be as of one exceedingly importunate and engaged; but her mother could distinctly hear only these words, spoken in a childish manner, but with extraordinary earnestness, and out of distress of soul, pray, blessed Lord, give me salvation! I pray, beg, pardon all my sins! When the child had done prayer, she came out of the closet, sat down by her mother, and cried out aloud. Her mother very earnestly asked her several times what the matter was, before she would make any answer; but she continued crying, and writhing her body to and fro, like one in anguish of spirit. Her mother then asked her, whether she was afraid that God would not give her salvation. She then answered, Yes, I am afraid I shall go to hell! Her mother then endeavored to quiet her, and told her she would not have her cry, she must be a good girl, and pray every day, and she hoped God would give her salvation. But this did not quiet her at all; she continued thus earnestly crying, and taking on for some time, till at length she suddenly ceased crying, and began to smile, and presently said with a smiling countenance, Mother, the kingdom of heaven is come to me! Her mother was surprised at the sudden alteration, and at the speech; and knew not what to make of it; but at first said nothing to her. The child presently spake again, and said, There is another come to me, and there is another, there is three; and being asked what she meant, she answered, One is, Thy will be done, and there is another, Enjoy Him for ever; by which it seems, that when the child said, There is three come to me; she meant three passages of her catechism that came to her mind.</p></blockquote>

</figure><figure class="quote" id="q-05e609474e" data-kw="">
<blockquote><p>It is not lawful to have pictures of Jesus Christ, because his divine nature cannot be pictured at all, and because his body, as it is now glorified, cannot be pictured as it is; and because, if it do not stir up devotion, it is in vain; if it do stir up devotion, it is a worshipping by an image or picture, and so a palpable breach of the Second Commandment.</p></blockquote>

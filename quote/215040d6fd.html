<main class="wrap"><figure class="quote" id="q-215040d6fd" data-kw="Author of sin Justice Satan The Fall">
<blockquote><p>Just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-debrecen.html">Synod of Debrecen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Documents of the Synod of Debrecen</cite>, 1567</span></figcaption>

<blockquote><p>Nor does he become the author of sin by his providence, because that lawlessness is nothing except a defect of operation, of which there cannot exist an author or efficient cause, but only a deficient cause, for which reason alone, the author of sin, insofar as it is such, is the creature, by its transgressing of the law.</p></blockquote>

</figure><figure class="quote" id="q-86e8b1fd52" data-kw="Permission Author of sin Holiness The Fall">
<blockquote><p>The almighty power, unsearchable wisdom, and infinite goodness of God, so far manifest themselves in His providence, that His determinate counsel extends itself even to the first fall, and all other sinful actions both of angels and men (Rom. 11:32–34; 2 Sam. 24:1; 1 Chron. 21:1); and that not by a bare permission, which also He most wisely and powerfully bounds, and otherwise orders and governs (2 Kings 19:28; Ps. 76:10), in a manifold dispensation to His most holy ends (Gen. 50:20; Isa. 10:6–7, 12); yet so, as the sinfulness of their acts proceeds only from the creatures, and not from God, who, being most holy and righteous, neither is nor can be the author or approver of sin (Ps. 50:21; 1 John 2:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 5.4</span></figcaption>

</figure><figure class="quote" id="q-4236adad7c" data-kw="">
<blockquote><p>Though their perdition depends on the predestination of God, the cause and matter of it is in themselves. The first man fell because the Lord deemed it meet that he should: why he deemed it meet, we know not. It is certain, however, that it was just, because he saw that his own glory would thereby be displayed. When you hear the glory of God mentioned, understand that his justice is included. For that which deserves praise must be just. Man therefore falls, divine providence so ordaining, but he falls by his own fault.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.23.8</span></figcaption>

</figure><figure class="quote" id="q-19b30684ec" data-kw="Permission Author of sin">
<blockquote><p>He wills it not by his effective will, but by his permissive will; and therefore cannot be chargeable with being the author of sin; since there is a wide difference between doing it himself, and doing it by others, or ordering it to be done, which only can make him the author of sin; and voluntarily permitting or suffering it to be done by others.</p></blockquote>

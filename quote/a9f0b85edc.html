<main class="wrap"><figure class="quote" id="q-a9f0b85edc" data-kw="">
<blockquote><p>[Durell:] ‘In all Reformed churches men use to enter into the places of public worship with their hats off.’ This is a most notorious — nothing being more usual in some Reformed churches than to pass through and through the places of worship, never stirring their hats: But if he would have the saying understood of men’s putting off their hats when they enter into the place of public worship, whilst the congregation is worshipping, then must this speech be placed where it is already placed, among the gentleman’s impertinencies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-hickman.html">Henry Hickman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bonasus vapulans</cite>, [A Bull being Whipped], or, Some Castigations given to Mr. John Durell for Fouling Himself &amp; Others in his English &amp; Latin Book by a Country Scholar (London, 1672) Hickman (bap.1629-1692) was an English puritan who was ejected in 1662., pp. 82-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-ee80ccc32f" data-kw="">
<blockquote><p>Plato (5th-4th cent. B.C.), describing the parts of the human body, wrote of ‘the head which is the most divine part and which reigns (δεσποτέω) over all the parts within us’ (Timaeus 44.D). Plutarch (A.D. 46-120), one of the most prominent Greek authors from the New Testament period (and one who reflected secular thinking independent of Jewish or Christian influence), explained why the words soul (ψυχη) and head (κεφαλή) can be used to speak of the whole person: ‘We affectionately call a person ‘soul’ or ‘head’ from his ruling parts…’ (Table-Talk 692.D.11). Philo (Jewish philosopher, c. 30 B.C.—c. A.D. 45), representing one aspect of first century Judaism, had a similar understanding: ‘As the head in the living body is the ruling place… so Ptolemy became head among kings’ (Life of Moses 2.30). ‘The mind is the head and ruler… of the sense-perception in us’ (Life of Moses 2.82); ‘’Head’ we interpret allegorically to be the ruling… mind of the soul’ (On Dreams 2.207).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-grudem.html">Wayne Grudem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does Kefale</cite>, (‘Head’) Mean ‘Source’ Or ‘Authority Over’ in Greek Literature?: a Survey of 2,336 Examples’ Trinity Journal, no. 6.1 (Spring 1985), pp. 38-59, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Plato (5th-4th cent. B.C.), describing the parts of the human body, wrote of ‘the head which is the most divine part and which reigns (δεσποτέω) over all the parts within us’ (Timaeus 44.D). Plutarch (A.D. 46-120), one of the most prominent Greek authors from the New Testament period (and one who reflected secular thinking independent of Jewish or Christian influence), explained why the words soul (ψυχη) and head (κεφαλή) can be used to speak of the whole person: ‘We affectionately call a person ‘soul’ or ‘head’ from his ruling parts…’ (Table-Talk 692.D.11). Philo (Jewish philosopher, c. 30 B.C.—c. A.D. 45), representing one aspect of first century Judaism, had a similar understanding: ‘As the head in the living body is the ruling place… so Ptolemy became head among kings’ (Life of Moses 2.30). ‘The mind is the head and ruler… of the sense-perception in us’ (Life of Moses 2.82); ‘’Head’ we interpret allegorically to be the ruling… mind of the soul’ (On Dreams 2.207).”

</figure><figure class="quote" id="q-62f4e9eeda" data-kw="">
<blockquote><p>…in 1 Cor. 11:6, ‘if the woman be not covered, let her also be shorn’: If she lays her vail aside and appears in the public assemblies without a covering, then I say, ‘let her also be shorn or shaved’, let her hair be cut close to the skin, let her go like some of the cropped philosophers among the Stoics. Not that he would have her do so, but only by this sarcastic way of speaking he signifies that one is as decent as the other. It is as disgraceful to be uncovered as to be shaved: for ’twas the laudable custom then in the Christian churches for the women to be vailed, and it was disgraceful and reproachful for any of that sex to appear bare-faced in the time of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Authority, Style &amp; Perfection of the Books of the Old &amp; New-Testament with a Continued Illustration of Several Difficult Texts of Scripture throughout the Whole Work</cite>, (London, 1693), ‘Of the Style of the Holy Scriptures’, ch. 4, pp. 132-33 See also, pp. 241-44.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

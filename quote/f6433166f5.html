<main class="wrap"><figure class="quote" id="q-f6433166f5" data-kw="">
<blockquote><p>When a people decline and grow cold in religion, there is a decay of outward strictness in religion. There is not that strictness in keeping the sabbath day; but it will be violated by people’s encroaching upon holy time at its beginning, and by their talking [of] worldly and profane things, or by such light and diverting talk which don’t show that reverence for the sabbath which is becoming. There is not that appearance of reverence and solemnity in public worship which is becoming.

There is great decay of family religion. There is great want of care and pains in instructing children and instilling principles of religion into ’em. There is not a strict care to keep up a constant attendance on family worship in the members of the family. There is want of care to keep God’s ordinances pure, and to hear a testimony against scandalous iniquity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dangers of Decline</cite>, (1730) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 91-92.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

There is great decay of family religion. There is great want of care and pains in instructing children and instilling principles of religion into ’em. There is not a strict care to keep up a constant attendance on family worship in the members of the family. There is want of care to keep God’s ordinances pure, and to hear a testimony against scandalous iniquity.”

</figure><figure class="quote" id="q-da1298814a" data-kw="">
<blockquote><p>When we were sat in Assembly, the three creeds were read, and many debates were held upon them, but especially about this word, in the eighth article, “they ought thoroughly to be received,” as if it set them in too high a place, in an equality with Scripture. At last it was resolved, that that article should be tendered to the Parliament, by way of humble advice, to be read thus, ‘The Creeds that go under the name of the Nice Creed, Athanasian Creed, and that which is commonly called the Apostles’ Creed, are thoroughly to be received and believed, for that the matter of them may be proved by most certain warrants of holy Scripture.’ Then was there a long agitation about translating the creeds anew, and about setting some gloss upon the preface and conclusion of Athanasius’ Creed, which seems to be something harsh; but at last it was concluded, that the creeds should be printed, at the end of the thirty-nine articles; so the determining of these matters referred thither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Journal of the Proceedings of the Assembly of Divines, from July 1, 1643, to December 31, 1644</cite>, ed. John Rogers Pitman (London: J. F. Dove, 1824), 18 August 1643, p. 10.</span></figcaption>

<blockquote><p>…the Protestant Reformation marked a sharp break in the pattern of ecclesiastical finance wherever it took root… by the end of 1525, however, he [Martin Luther] was assuring the elector of Saxony that the revenues of the church belonged to the state, and that after proper payments to clergy, schools and charity, the surplus could be employed by the prince. Huldrych Zwingli and Martin Bucer, on the other hand, held that church property belonged to the religious community and that the secular ruler merely administered it. … The Calvinist church was more fully separated from past modes of finance than its Lutheran and Anglican counterparts… Elsewhere [other than Geneva], Calvinism was often a minority faith and had to depend on the voluntary support of its members… The Dutch Reformed Church was funded by the magistracy after several false starts in the 1570’s, but not at a particularly generous level.</p></blockquote>

<blockquote><p>The custom in these parts [in France] is, to put off the hat, when in public acts the king is named: Moreover the Protestants [Anglicans] in England do ordain that men put off their hats at sermons when they hear the name of Jesus. In like manner all countries haue their customs: that which is ridiculous and superstitious in one place, is held and esteemed comely and religious in another. The most expedient way would be, instead of calling one another idolaters and heretics, to exhort one another charitably to do all to edification, to avoid the appearance of evil and excess, and not to scandalize the infidels and unbelievers.</p></blockquote>

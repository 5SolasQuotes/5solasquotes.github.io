<main class="wrap"><figure class="quote" id="q-cfd38b358f" data-kw="">
<blockquote><p>As, then, in civility, there is a respect and reverence different from adoration, so it is in religion also… We neither submit our minds nor humble [bow] our bodies to the sacrament, yet do we render to it veneration (Cartwright on 1 Cor. 11, sect. 18), forasmuch as we esteem highly of it, as a most holy thing, and meddle [handle] reverently with it, without all contempt or unworthy usage. ‘Inanimate things’, says the Archbishop of Spalato, ‘may indeed be as sacred as you please, they do not deserve other honor from us except in a negative sense (Dr Rep. Eccl., bk. 7, ch. 12, num. 50), as that they be not contemned, nor unworthily handled. If it is said that we ought not to contemn the Word, yet has it not that respect given to it which the sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more than [the absence of] profanatio [profanation], I answer, as honor both in the positive and negative sense, has various degrees, and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted… for the greater regard of those things which are more immediately divine, we are not in the usage of them, to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly, divine, and which are not from God so immediately as the other, but more by the intervention of means; and thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking aught from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, ‘nothing here is human, but everything divine’ (Didoclav., ubi supra, p. 808); for Christ’s own words are, or at least should be spoken to us when we receive the sacrament, and the elements also are, by Christ’s own institution, holy symbols of his blessed body and blood; whereas the Word preached to us is but fixedly and mediately divine; and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of god, we are bidden try the spirits, and are required, after the example of the Bereans, to search the Scriptures daily, whether these things which we hear preached be so or not. Now we are not in the like sort to try the elements, and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us, that the sacrament given, according to Christ’s institution, is more merely and immediately divine than is the Word preached…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Naphtali, 1993), pp. 218-9</span></figcaption>

<blockquote><p>VII. Sixth [Rule], ‘some precepts are affirmative’ (ordering things to be done, sins of omission); ‘others negative’ (prohibiting things to be avoided, sins of commission). ‘The former bind always, but not to always, the latter bind always to always.’ The virtues and duties commanded by the affirmative precepts cannot be exercised every moment together at once, and suppose certain conditions (which being absent, there is no place for them); for example, parents are not always alive or near us, so that we can render them their due respect. But the vices and crimes prohibited can be committed lawfully in no article of time. Here, however, we must make an exception of the general affirmative command to love God (which obliges always and to always) because there is no time or place or state in which man can be exempted from the duty of loving God. … XII. Fourth [Rule of Obedience], as the precepts do not have an equal degree of importance and necessity, so neither is the obedience to be reckoned of the same order and value… The omission of a command is one thing; opposition to it another; forgetfulness, neglect and contempt are different. Neglect proceeds from the langor of slothfulness…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, ‘The Law of God’, Question 6, ‘The Rules of Explanation and of Observance of the Decalogue’, Sections VII &amp; XII, pp. 35-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

<blockquote><p>…I shall desire you to consider the ground why such affirmative precepts, as command duties relating to others, do not bind to always. The duties that they command are principally to this end, that they do good to men for the curing of their evils, for the farthering of virtue in them. Wherefore when prudence shows that such actions will be fruitless in respect of the end, or contrariwise harmful, they are to be forborne.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper. Or a Brief &amp; Scholastical Debate of that Question which has so Wonderfully Perplexed Many, Both Ministers &amp; People: Whether or No the Sacrament of the Lord’s Supper may (according to Presbyterial Principles) be Lawfully Administered [by a Minister] in an un-presbyterated church, that is, a church destitute of ruling elders. Wherein the affirmative is confirmed… (London, 1650) Jeanes was an English presbyterian., p. 17</span></figcaption>

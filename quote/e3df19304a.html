<blockquote><p>It still continues equally true, upon the Protestant as upon the Romish doctrine of justification, that God requires of us faith and repentance, and requires them of us as indispensably necessary to our escaping His wrath and curse due to us for our sins, though not as exerting any causality or efficiency in procuring or obtaining for us pardon and acceptance, except instrumentally in the case of faith;</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-eb42c02a7a" data-kw="">
<blockquote><p>Whether of these goes before, faith or repentance? Whereas we have said before that repentance is sometimes used by a synecdoche for that which they call contrition, and have showed that contrition is legal or evangelical, we have placed faith as it were in the middle, between the former of those sorrows which comes of the acknowledgement of our sins and the accusations of the conscience, or which proceeds from the Law, and the latter, which proceeds from the Gospel, for godly sorrow is an effect of faith as well as joy and gladness of conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, … (London: Snowdon, 1606), 30th Place, ‘Of Repentance…’, ‘Whether of these goes before, faith or repentance?’, p. 313</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-18baa00e9e" data-kw="">
<blockquote><p>2. The wilderness of sorrow, contrition, repentance, call it what you please, though I know the latter term ‘repentance’ be controverted by some new opinionists. Yet I know not why we may not say that a man may repent without saving grace. And for that repentance which they say must be the effect of faith, if I were a schoolman, I should rather call it godly sorrow, but I desire not to play upon terms: and for their defining repentance to be a sorrow for sin out of the sense of the love of God revealed in Jesus Christ, it is a definition they have devised for their own purpose; and give them their premises according as they please, they would be poor logicians if they made the conclusion to displease them: for from hence they argue, if the love of God be the ground and cause of repentance (viz. the love of God manifested and sensible to us, we having apprehended it by faith), the special love of God, then faith must go before repentance, viz. an apprehension of God’s saving love and reliance upon it. But I answer: the definition which they give us of repentance is deceitful; it is a definition of a species instead of a genus (as we say in logic). As some unwary divines define faith, to be an assurance of God’s love in Jesus Christ: this is true, but this is a faith of the highest stamp, and many a precious soul is without this faith to his dying day. Faith of adherence is another thing; as if I should go to define a man to be a reasonable creature, skilled in all sorts of learning. Any man would understand me, that I did not go about to describe a man in general, but this or that particular man. And I say once again, if I were a schoolman, I should rather call this a godly sorrow, and define repentance in general to be a sorrow for sin, there is the genus and differentia: or if there be required a fuller definition with the ground, though I conceive such a definition would be more proper to give of repentance in its several kinds than of repentance in general; yet we may give it thus, it is a sorrow for sin, arising out of the fear of God’s wrath or apprehensions of God’s love. And I know not why we may not say that a man may repent without saving grace. Bishop [John] Davenant says, a man by exciting the grace of God, may peccata propria considerare, ad sensum eorundem expavescere et liberationem ab hoc metu exoptare, tremble for his sins and mourn for them, and desire deliverance out of them (Mk. 1:15; Lk. 17:3-4; Eze. 14:6); and if this be not repentance, I know not what is (not taking repentance for the whole work of conversion, as sometimes it is taken in Scripture), but taking repentance for a weariness of sin and sorrow for it. But those of our brethren here (that are so afraid of Babylon that they will run quite beyond Jerusalem, so afraid of being Arminians or Papists, to ascribe any desert to duties, or tie that God has to concur with our duties, that they are resolved they will not be sober Protestants: so afraid of being heterodox, that to avoid it, they will not be orthodox) tell us that this is a legal, not a saving repentance; it sounds ill to distinguish between a legal and saving repentance. I will digress a little to rend this fig-leaf, being all they have to cover the nakedness of their opinion: I would fain understand that term ‘saving repentance’ in what sense they take it; the Scripture warrants no such distinction.

1. If they mean by ‘saving repentance’, such a repentance as merits salvation, or such a repentance as God is tied necessarily to concur with, with his saving grace, I say, no repentance can be saving repentance. No repentance (says learned Davenant) can so dispose the heart, ut ex merito congrui teneatur Deus gratiam cuiquam infundere.

2. If they mean by ‘saving repentance’, such a repentance as of itself, without any more ado, shall be sufficient to salvation: I say again, no repentance can be called a saving repentance. For without faith it is impossible to please God.

3. If they mean by ‘saving repentance’, a repentance that conduces to salvation; I say, this kind of repentance (let them call it legal or what they please) is a saving repentance.

4. If they mean by ‘saving repentance’, such a repentance as is wrought ordinarily in such as shall be saved, I say, in that sense this repentance is a saving repentance. Now, whether it ought not to be preached, as well from law as gospel motives, is a question that lies not in my way to determine, only I hear my Savior (though He were Gospel itself) preaching it from a law-motive, Lk. 13:2, “Except ye repent, ye shall all likewise perish.” Let the unprejudiced reader judge if damnation be not there preached as a terrible motive to repentance: surely I then may learn to preach from the best of preachers and preach, ‘Repent, or you will go to hell; repent, or you will be damned,’ as well as ‘Repent, because God has loved you:’ yea, and John too preached repentance as well, because the axe was laid to the root of the tree and whatsoever tree brought not forth good fruit should be hewn down and cast into the fire, as because the kingdom of heaven was at hand. I dare not learn contrary to Christ and the Baptist’s copy; I will preach mercy and judgment: the law and the gospel go well together; I will not be accursed for separating what God has joined. But 5. Lastly, I conceive, we cannot call any repentance saving repentance till the work of conversion be fully wrought in our souls. Nay, I make a question whether any man (without the grace of assurance) can properly call his repentance ‘saving repentance’, till he comes into Heaven. And for my own part, I am full in the negative. But I have digressed too far, to convince some (who I fear are not so willing to suffer the word of conviction, as I to speak it.) We left the spouse in the second wilderness, the wilderness of sorrow; it is time we now return to her, and comfort her, and show you how she comes out of that, leaning upon her Beloved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved</cite>, … (London: 1646), pp. 46-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

2. If they mean by ‘saving repentance’, such a repentance as of itself, without any more ado, shall be sufficient to salvation: I say again, no repentance can be called a saving repentance. For without faith it is impossible to please God.

3. If they mean by ‘saving repentance’, a repentance that conduces to salvation; I say, this kind of repentance (let them call it legal or what they please) is a saving repentance.

4. If they mean by ‘saving repentance’, such a repentance as is wrought ordinarily in such as shall be saved, I say, in that sense this repentance is a saving repentance. Now, whether it ought not to be preached, as well from law as gospel motives, is a question that lies not in my way to determine, only I hear my Savior (though He were Gospel itself) preaching it from a law-motive, Lk. 13:2, “Except ye repent, ye shall all likewise perish.” Let the unprejudiced reader judge if damnation be not there preached as a terrible motive to repentance: surely I then may learn to preach from the best of preachers and preach, ‘Repent, or you will go to hell; repent, or you will be damned,’ as well as ‘Repent, because God has loved you:’ yea, and John too preached repentance as well, because the axe was laid to the root of the tree and whatsoever tree brought not forth good fruit should be hewn down and cast into the fire, as because the kingdom of heaven was at hand. I dare not learn contrary to Christ and the Baptist’s copy; I will preach mercy and judgment: the law and the gospel go well together; I will not be accursed for separating what God has joined. But 5. Lastly, I conceive, we cannot call any repentance saving repentance till the work of conversion be fully wrought in our souls. Nay, I make a question whether any man (without the grace of assurance) can properly call his repentance ‘saving repentance’, till he comes into Heaven. And for my own part, I am full in the negative. But I have digressed too far, to convince some (who I fear are not so willing to suffer the word of conviction, as I to speak it.) We left the spouse in the second wilderness, the wilderness of sorrow; it is time we now return to her, and comfort her, and show you how she comes out of that, leaning upon her Beloved.”

— John Collinges, The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons, … (London: 1646), pp. 46-49">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+The+wilderness+of+sorrow%2C+contrition%2C+repentance%2C+call+it+what+you+please%2C+though+I+know+the+latter+term+%E2%80%98repentance%E2%80%99+be+controverted+by+some+new+opinionists.+Yet+I+know+not+why+we+may+not+say+that+a+man+may+repent+without+saving+grace.+And+for+that+repentance+which+they+say+must+be+the+effect+of+faith%2C+if+I+were+a+schoolman%2C+I+should+rather+call+it+godly+sorrow%2C+but+I+desire+not+to+play+upon+terms%3A+and+for+their+defining+repentance+to+be+a+sorrow+for+sin+out+of+the+sense+of+the+love+of+God+revealed+in+Jesus+Christ%2C+it+is+a+definition+they+have+devised+for+their+own+purpose%3B+and+give+them+their+premises+according+as+they+please%2C+they+would+be+poor+logicians+if+they+made+the+conclusion+to+displease+them%3A+for+from+hence+they+argue%2C+if+the+love+of+God+be+the+ground+and+cause+of+repentance+%28viz.+the+love+of+God+manifested+and+sensible+to+us%2C+we+having+apprehended+it+by+faith%29%2C+the+special+love+of+God%2C+then+faith+must+go+before+repentance%2C+viz.+an+apprehension+of+God%E2%80%99s+saving+love+and+reliance+upon+it.+But+I+answer%3A+the+definition+which+they+give+us+of+repentance+is+deceitful%3B+it+is+a+definition+of+a+species+instead+of+a+genus+%28as+we+say+in+logic%29.+As+some+unwary+divines+define+faith%2C+to+be+an+assurance+of+God%E2%80%99s+love+in+Jesus+Christ%3A+this+is+true%2C+but+this+is+a+faith+of+the+highest+stamp%2C+and+many+a+precious+soul+is+without+this+faith+to+his+dying+day.+Faith+of+adherence+is+another+thing%3B+as+if+I+should+go+to+define+a+man+to+be+a+reasonable+creature%2C+skilled+in+all+sorts+of+learning.+Any+man+would+understand+me%2C+that+I+did+not+go+about+to+describe+a+man+in+general%2C+but+this+or+that+particular+man.+And+I+say+once+again%2C+if+I+were+a+schoolman%2C+I+should+rather+call+this+a+godly+sorrow%2C+and+define+repentance+in+general+to+be+a+sorrow+for+sin%2C+there+is+the+genus+and+differentia%3A+or+if+there+be+required+a+fuller+definition+with+the+ground%2C+though+I+conceive+such+a+definition+would+be+more+proper+to+give+of+repentance+in+its+several+kinds+than+of+repentance+in+general%3B+yet+we+may+give+it+thus%2C+it+is+a+sorrow+for+sin%2C+arising+out+of+the+fear+of+God%E2%80%99s+wrath+or+apprehensions+of+God%E2%80%99s+love.+And+I+know+not+why+we+may+not+say+that+a+man+may+repent+without+saving+grace.+Bishop+%5BJohn%5D+Davenant+says%2C+a+man+by+exciting+the+grace+of+God%2C+may+peccata+propria+considerare%2C+ad+sensum+eorundem+expavescere+et+liberationem+ab+hoc+metu+exoptare%2C+tremble+for+his+sins+and+mourn+for+them%2C+and+desire+deliverance+out+of+them+%28Mk.+1%3A15%3B+Lk.+17%3A3-4%3B+Eze.+14%3A6%29%3B+and+if+this+be+not+repentance%2C+I+know+not+what+is+%28not+taking+repentance+for+the+whole+work+of+conversion%2C+as+sometimes+it+is+taken+in+Scripture%29%2C+but+taking+repentance+for+a+weariness+of+sin+and+sorrow+for+it.+But+those+of+our+brethren+here+%28that+are+so+afraid+of+Babylon+that+they+will+run+quite+beyond+Jerusalem%2C+so+afraid+of+being+Arminians+or+Papists%2C+to+ascribe+any+desert+to+duties%2C+or+tie+that+God+has+to+concur+with+our+duties%2C+that+they+are+resolved+they+will+not+be+sober+Protestants%3A+so+afraid+of+being+heterodox%2C+that+to+avoid+it%2C+they+will+not+be+orthodox%29+tell+us+that+this+is+a+legal%2C+not+a+saving+repentance%3B+it+sounds+ill+to+distinguish+between+a+legal+and+saving+repentance.+I+will+digress+a+little+to+rend+this+fig-leaf%2C+being+all+they+have+to+cover+the+nakedness+of+their+opinion%3A+I+would+fain+understand+that+term+%E2%80%98saving+repentance%E2%80%99+in+what+sense+they+take+it%3B+the+Scripture+warrants+no+such+distinction.+1.+If+they+mean+by+%E2%80%98saving+repentance%E2%80%99%2C+such+a+repentance+as+merits+salvation%2C+or+such+a+repentance+as+God+is+tied+necessarily+to+concur+with%2C+with+his+saving+grace%2C+I+say%2C+no+repentance+can+be+saving+repentance.+No+repentance+%28says+learned+Davenant%29+can+so+dispose+the+heart%2C+ut+ex+merito+congrui+teneatur+Deus+gratiam+cuiquam+infundere.+2.+If+they+mean+by+%E2%80%98saving+repentance%E2%80%99%2C+such+a+repentance+as+of+itself%2C+without+any+more+ado%2C+shall+be+sufficient+to+salvation%3A+I+say+again%2C+no+repentance+can+be+called+a+saving+repentance.+For+without+faith+it+is+impossible+to+please+God.+3.+If+they+mean+by+%E2%80%98saving+repentance%E2%80%99%2C+a+repentance+that+conduces+to+salvation%3B+I+say%2C+this+kind+of+repentance+%28let+them+call+it+legal+or+what+they+please%29+is+a+saving+repentance.+4.+If+they+mean+by+%E2%80%98saving+repentance%E2%80%99%2C+such+a+repentance+as+is+wrought+ordinarily+in+such+as+shall+be+saved%2C+I+say%2C+in+that+sense+this+repentance+is+a+saving+repentance.+Now%2C+whether+it+ought+not+to+be+preached%2C+as+well+from+law+as+gospel+motives%2C+is+a+question+that+lies+not+in+my+way+to+determine%2C+only+I+hear+my+Savior+%28though+He+were+Gospel+itself%29+preaching+it+from+a+law-motive%2C+Lk.+13%3A2%2C+%E2%80%9CExcept+ye+repent%2C+ye+shall+all+likewise+perish.%E2%80%9D+Let+the+unprejudiced+reader+judge+if+damnation+be+not+there+preached+as+a+terrible+motive+to+repentance%3A+surely+I+then+may+learn+to+preach+from+the+best+of+preachers+and+preach%2C+%E2%80%98Repent%2C+or+you+will+go+to+hell%3B+repent%2C+or+you+will+be+damned%2C%E2%80%99+as+well+as+%E2%80%98Repent%2C+because+God+has+loved+you%3A%E2%80%99+yea%2C+and+John+too+preached+repentance+as+well%2C+because+the+axe+was+laid+to+the+root+of+the+tree+and+whatsoever+tree+brought+not+forth+good+fruit+should+be+hewn+down+and+cast+into+the+fire%2C+as+because+the+kingdom+of+heaven+was+at+hand.+I+dare+not+learn+contrary+to+Christ+and+the+Baptist%E2%80%99s+copy%3B+I+will+preach+mercy+and+judgment%3A+the+law+and+the+gospel+go+well+together%3B+I+will+not+be+accursed+for+separating+what+God+has+joined.+But+5.+Lastly%2C+I+conceive%2C+we+cannot+call+any+repentance+saving+repentance+till+the+work+of+conversion+be+fully+wrought+in+our+souls.+Nay%2C+I+make+a+question+whether+any+man+%28without+the+grace+of+assurance%29+can+properly+call+his+repentance+%E2%80%98saving+repentance%E2%80%99%2C+till+he+comes+into+Heaven.+And+for+my+own+part%2C+I+am+full+in+the+negative.+But+I+have+digressed+too+far%2C+to+convince+some+%28who+I+fear+are+not+so+willing+to+suffer+the+word+of+conviction%2C+as+I+to+speak+it.%29+We+left+the+spouse+in+the+second+wilderness%2C+the+wilderness+of+sorrow%3B+it+is+time+we+now+return+to+her%2C+and+comfort+her%2C+and+show+you+how+she+comes+out+of+that%2C+leaning+upon+her+Beloved.%E2%80%9D%0A%0A%E2%80%94+John+Collinges%2C+The+Spouse%E2%80%99s+Hidden+Glory+%26+Faithful+Leaning+upon+her+Well-Beloved%2C+wherein+is+laid+down+the+soul%E2%80%99s+glory+in+Christ+and+the+way+by+which+the+soul+comes+to+Christ%2C+delivered+in+two+lecture+sermons%2C+%E2%80%A6+%28London%3A+1646%29%2C+pp.+46-49&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F18baa00e9e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/18baa00e9e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=2.%20The%20wilderness%20of%20sorrow%2C%20contrition,of%20that%2C%20leaning%20upon%20her%20Beloved&amp;text=2.%20The%20wilderness%20of%20sorrow%2C%20contrition%2C%20repentance%2C%20call&amp;text=comes%20out%20of%20that%2C%20leaning%20upon%20her%20Beloved" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

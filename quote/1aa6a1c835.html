<blockquote><p>6. Above all, see that you be followers of peace and unity, both in the Church and among your selves. Remember what I taught you on Heb. 12:14, he that is not a son of peace is not a son of God. All other sins destroy the Church consequentially, but division and separation demolish it directly. Building the Church is but an orderly joining of the materials; and what then is disjoining, but pulling down? Many doctrinal differences must be tolerated in a Church: And why? but for unity and peace? Therefore disunion and separation is utterly intolerable. Believe not those to be the Church’s friends that would cure and reform her by cutting her throat. Those that say, ‘No truth must be concealed for peace,’ have usually as little of the one as the other. Study Gal. 2:2; Rom. 14:1, etc. Acts 21:24, 26; 1 Tim 1:4 and 6:4; Tit. 3:8-9. I hope sad experience speaks this lesson to your very hearts, if I should say nothing. Do not your hearts bleed to look upon the state of England? and to think how few towns or cities there be (where is any forwardness in religion) that are not cut into shreds and crumbled as to dust by separations and divisions? To think what a wound we have hereby given to the very Christian name? How we have hardened the ignorant? Confirmed the Papists? And are ourselves become the scorn of our enemies and the grief of our friends? And how many of our dearest, best esteemed friends are fain to notorious pride or impiety? yea, some to be worse then open infidels? These are pillars of salt; see that you remember them. You are yet eminent for your unity, steadfastness, and godliness; hold fast that you have, that no man take your crown from you… If there be erroneous practices in the Church, keep yourselves innocent with moderation and peace: Do your best to reform them and rather remove your dwellings if you cannot live innocently, than rend the Church. It must be no small error that must force a separation… You know I never conformed to the use of mystical, symbolical rites myself (but only to the determination of circumstantials necessary in genere) and yet I ever loved a godly, peaceable Conformist better than a turbulent, non-conformist. I yet differ from many in several doctrines of greater moment than baptism… and yet if I should zealously press my judgment on others, and seek to make a party for it, and disturb the peace of the Church, and separate from my brethren, I should fear lest I should prove a firebrand in Hell for being a firebrand in the Church. And for all the interest I have in your judgments and affections, I here charge you that if God should give me up to any factious Church-rending course (against which I daily pray) that you forsake me and follow me not a step.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Everlasting Rest (London: White, 1650), ‘To my dearly beloved friends’</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39efa5d0a2" data-kw="">
<blockquote><p>21… But the most of our acquaintance [being parish ministers in England in the 1650’s, under Cromwell] were peaceable, moderate men that thought several parties [of various views of Church government] had somewhat of the right, and that the points of difference were so few and small that they might well live in peace and love, and that none of the parties was so right as that in all things they should be followed, and others trod down to set them up: And many of these were young men that, being at the schools, had not been engaged in the first quarrels [in the 1640’s and before], and desired not to side with any dividing parties, and modestly professed that they had not maturity enough to study themselves to any great confidence in the controversies [about Church government]. 22. This last sort of men beginning in Worcestshire set on foot a work of reconciling [an] Association, in which the Episcopal, Presbyterians and Independants agreed to practise so much of Church government and ministration as they were all agreed in, with mutual love and assisting concord, and to forbear one another in the rest, till God should bring us nearer (and after[wards] they added another agreement, to catechize every person in their parishes old and young that would come to them, or receive them thereto, and personally to instruct and exhort them about the practicals of religion, and preparation for death and the life to come). This example was presently followed by the ministers in Cumberland and Westmorland, Wiltshire, Dorsetshire, Essex, and going on in other counties, till the confusions [of] 1659 interrupted it [when Cromwell died], and the return of the prelacy [in 1662] ended it and many such endeavors.</p></blockquote>

<blockquote><p>The exceeding great bitterness of the continued and increasing sad distractions amongst the people of God to the hindrance of their edification in faith and a godly life with charity and peace amongst themselves should put all the ministers of Christ to most serious thoughts in considering how far they may under the present dispensations of God, without sin, accommodate in following unquestionable duties with and under the established government of the Church. And although as to a cordial allowance of the present change they cannot yet attain, something remaining, whether of scruple or affection, which makes it unpleasing, and their concurrence with it, to lie heavy upon their spirits, yet if there be found no manifest transgression in concurring under the same, in matters of unquestionable duty, they would wisely put difference between gravamen spiritus [heaviness of spirit] and ligamen conscientiae [a tie of conscience]: something in the will that renders them averse, and [differenced from] the prevailing clear light of a well-informed conscience (to which, how uneasy it is to attain in this point of controversy, they can tell who have truly tried it) binding them up from concurrence, as a thing in itself unlawful. Men who walk in the fear of God and are zealous of His honor had need to be very jealous of their own zeal, that it carry them not to the rejecting of a real duty, which (to their apprehension) sits too near a sin… It is their duty to advert, lest, at this time too great animosity contribute to the laying of the foundation of a woeful division to be entailed to the generations to come, the evil whereof will preponder all the good that any one form of Church-government can, of itself, produce, viz. the dishonor of God, the weakening of the cause of the true protestant religion against the common adversaries thereof, the destroying of true charity and love amongst the people of God, the hinderance of their profiting under the several ministries they live under, and the creating continual confusions and distractions in the commonwealth (the ordinary fruit of schism in the Church) as too lamentable experience (whereof we carry the sad marks to this day) has taught us. 1. That there may and ought to be a brotherly accommodation and concurrence in matters of practice which are undoubted duty (albeit brethren be of different judgments anent the constitution of meetings or capacity of persons that act in these duties), grave and learned men have put it out of question. It is well known that in the [Westminster] Assembly of Divines at London, accommodation was mainly labored for (and far carried on) between presbyterians and independents, that they might concur in common actings for regulating the Church, with a reserve of liberty of their own several principles… Also, several of the most eminent presbyterians in England, as Mr. [Richard] Vines, Mr. [Richard] Baxter and others, accounting of un-preaching [ruling] elders, as of a human device (as now the office of a bishop is accounted of by many brethren), yet, not being able to attain to the exercise of presbyterial government without the intermixture of these; yea, of them, double the number to preaching presbyters in each meeting (which gave them an overswaying power in the government), notwithstanding they did concur with them in matters of unquestionable duty. Is it not also well known that amongst ourselves in this [Scottish] Church, [Resolutioner] brethren did ordinarily concur in synods and presbyteries, in doing their duties with these [the Protesters] whom they charged with a sinful schism? (a thing as much against the [Solemn League and] Covenant [1643], as that which is now pretended for withdrawing from the meetings of synods and presbyteries)… it is affirmed that they homologate with the tenet and practice of Separatism, denying the lawfulness of concurrence in a lawful necessary duty because of the personal sin of fellow-actors in it…</p></blockquote>

l+whereof+will+preponder+all+the+good+that+any+one+form+of+Church-government+can%2C+of+itself%2C+produce%2C+viz.+the+dishonor+of+God%2C+the+weakening+of+the+cause+of+the+true+protestant+religion+against+the+common+adversaries+thereof%2C+the+destroying+of+true+charity+and+love+amongst+the+people+of+God%2C+the+hinderance+of+their+profiting+under+the+several+ministries+they+live+under%2C+and+the+creating+continual+confusions+and+distractions+in+the+commonwealth+%28the+ordinary+fruit+of+schism+in+the+Church%29+as+too+lamentable+experience+%28whereof+we+carry+the+sad+marks+to+this+day%29+has+taught+us.+1.+That+there+may+and+ought+to+be+a+brotherly+accommodation+and+concurrence+in+matters+of+practice+which+are+undoubted+duty+%28albeit+brethren+be+of+different+judgments+anent+the+constitution+of+meetings+or+capacity+of+persons+that+act+in+these+duties%29%2C+grave+and+learned+men+have+put+it+out+of+question.+It+is+well+known+that+in+the+%5BWestminster%5D+Assembly+of+Divines+at+London%2C+accommodation+was+mainly+labored+for+%28and+far+carried+on%29+between+presbyterians+and+independents%2C+that+they+might+concur+in+common+actings+for+regulating+the+Church%2C+with+a+reserve+of+liberty+of+their+own+several+principles%E2%80%A6+Also%2C+several+of+the+most+eminent+presbyterians+in+England%2C+as+Mr.+%5BRichard%5D+Vines%2C+Mr.+%5BRichard%5D+Baxter+and+others%2C+accounting+of+un-preaching+%5Bruling%5D+elders%2C+as+of+a+human+device+%28as+now+the+office+of+a+bishop+is+accounted+of+by+many+brethren%29%2C+yet%2C+not+being+able+to+attain+to+the+exercise+of+presbyterial+government+without+the+intermixture+of+these%3B+yea%2C+of+them%2C+double+the+number+to+preaching+presbyters+in+each+meeting+%28which+gave+them+an+overswaying+power+in+the+government%29%2C+notwithstanding+they+did+concur+with+them+in+matters+of+unquestionable+duty.+Is+it+not+also+well+known+that+amongst+ourselves+in+this+%5BScottish%5D+Church%2C+%5BResolutioner%5D+brethren+did+ordinarily+concur+in+synods+and+presbyteries%2C+in+doing+their+duties+with+these+%5Bthe+Protesters%5D+whom+they+charged+with+a+sinful+schism%3F+%28a+thing+as+much+against+the+%5BSolemn+League+and%5D+Covenant+%5B1643%5D%2C+as+that+which+is+now+pretended+for+withdrawing+from+the+meetings+of+synods+and+presbyteries%29%E2%80%A6+it+is+affirmed+that+they+homologate+with+the+tenet+and+practice+of+Separatism%2C+denying+the+lawfulness+of+concurrence+in+a+lawful+necessary+duty+because+of+the+personal+sin+of+fellow-actors+in+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Andrew+Honyman%2C+The+Seasonable+Case+of+Submission+to+the+Church-Government+as+now+Re-established+by+Law%2C+briefly+stated+and+determined+by+a+Lover+of+the+Peace+of+this+Church+%26+Kingdom+%28Edinburgh%3A+Tyler%2C+1662%29+45+pp.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff600721bf9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f600721bf9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=The%20exceeding%20great%20bitterness%20of%20the,personal%20sin%20of%20fellow%2Dactors%20in%20it%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[About the Church of England:] She is the very eye of all the Churches, the peculiar of Christ, the refuge of the afflicted, the arsenal of the weak, the storehouse of the poor, the standard of better hope… [Diodati laments that] in the civil wars this illustrious fold of Christ should be torn in pieces, not by wild beasts indeed; and plundered, though not by robbers; but by the sheep themselves enraged against one another: A thing without example, and never heard of before in the Reformed Churches. We are all struck with horror when we hear of the battles that are fought by the people against their king; by brethren against brethren; by children against their parents; and by the flock of Christ against one another, and against the shepherds themselves.</p></blockquote>

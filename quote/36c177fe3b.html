<main class="wrap"><figure class="quote" id="q-36c177fe3b" data-kw="">
<blockquote><p>When addressing the Belfast Anti-Slavery Society in September 1840, a man by the name of Captain Stewart pointed out that the Covenanters were the only “Protestant” communion in the United States who did not practice the heresy of racial segregation in their churches:

[…] In the city of New York, a person who has one drop of Negro blood in his veins would not be admitted as a free sitter into any of the churches except the Covenanter, the Quaker, and Roman Catholic Churches. […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ulster-times.html">Ulster Times</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ulster Times</cite>, 10 Sep. 1840</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3d9f8b8c3a" data-kw="">
<blockquote><p>O Arian, the right inheritor to Lucifer, that would exalt his seat, and be like to the highest; whose fall shall be like, where the sin is equal. If God did highly allow the minister of Ephesus, for that he could in no wise abide such as said they were apostles, and were not in deed, how may any lay uncharitableness unto me, which for the love of my sweet Christ do abhor all fantastical Arians, in such sort as all men ought to do that love the Son of God unfeignedly? …

Was there ever heretic so bold and impudent as the Arian is, that durst take from the Son of God the glory which he had with the Father from the beginning? If Christ be the beginning and ending of all things (as he testifieth himself to St John), how may he be but a creature, like unto others? Who may dissemble such blasphemy that hath any spark of the Spirit of God? Who may hear with patience the right ways of the Lord perverted by these devilish holy Arians, and hold his peace?

A lively faith is not dumb, but is always ready to resist the gainsayers, as David saith, “I have believed, and therefore I have spoken.” Speak then, you that have tongues to praise and confess against these Arians; exalt your voice like a trumpet, that the simple people may beware of their Pharisaical venom, and be not deceived, as now many are unawares of simplicity. Suffer them not to pass by you unpointed at: yea, if they be so stout that they will not cease to speak against God our Saviour and Christ, (as they are all new baptized enemies thereto,) refrain not to spit at such inordinate swine as are not ashamed to tread under their feet the precious godhead of our Saviour Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-philpot.html">John Philpot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology for Spitting upon an Arian</cite>, (n.d.) in Robert Eden (ed.), The Examinations and Writings of John Philpot, B.C.L., Archdeacon of Winchester: Martyr, 1555 (Cambridge: The University Press, 1842), pp 300-01.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-1ae744ad4b" data-kw="">
<blockquote><p>And we must also add that whatever be their original and constitution, if all their governors were as the apostles, yet have they no power but what is for edification, and not for destruction; If they do or shall appoint and impose on men what tends unto the destruction of their souls, and not unto their edification, as it is fallen out in the Church of Rome; not only particular churches, but every individual believer is warranted to withdraw from their communion… Let none mistake themselves herein, believers are not made for churches, but churches are appointed for believers. Their edification, their guidance and direction in the profession of the faith and performance of divine worship in assemblies according to the mind of God, is their use and end; without which they are of no signification. The end of Christ in the constitution of his churches, was not the molding of his disciples into such ecclesiastical shapes, as might be subservient unto the power, interest, advantages and dignity of them that may in any season come to be over them; but to constitute a way and order of giving such officers unto them, as might be in all things useful and subservient unto their edification; as is expresly affirmed, Eph. 4:11-14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Vindication of the Non-Conformists from the Charge of Schism</cite>, … (1680), p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>We further confess and acknowledge, that such persons as are placed in authority are to be loved, honored, feared, and holden in most reverend estimation, because they are the lieutenants of God, in whose session God Himself does sit and judge. And further, we affirm that whosoever deny unto them their aid, counsel and comfort, while the princes vigilantly travail in the executing of their office, that the same men deny their help, support and counsel to God, who, by the presence of his lieutenant, craves it of them.</p></blockquote>

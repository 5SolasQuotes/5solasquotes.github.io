<main class="wrap"><figure class="quote" id="q-d30c665bdb" data-kw="">
<blockquote><p>18. Is justification an act that takes place once and for all, or an act that can be repeated?

a) The Roman Catholic church makes a distinction between a first and second justification. The first consists in the infusion of habitual grace, by which original sin is suppressed and expelled … The formal cause of the second justification is to be sought in good works that man himself performs. This is a confusion of sanctification and justification, and makes the fruits of the former meritorious. As justification becomes sanctification, so sanctification again becomes justification in the hands of Rome – naturally, a legalistic justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, trans. and ed. Richard B. Gaffin (1910; 5 vols, Bellingham WA: Lexham Press, 2015), 4: 157.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74ee5bf636" data-kw="">
<blockquote><p>X. The making of the charge is described by the metaphor of books or records in which the actions of the person who are being judged are written down. Revelation 20:12 ‘And the books were opened.’ By the word ‘books’ is to be understood both God’s omniscience and man’s conscience. XI.The wicked will be judged in accordance with their works and on account of their works; the righteousness according to the works of faith but not on account of their works. Thus in Revelation 20:12 it is said the that another book, the book of life, was opened, so that we may know that the salvation of the righteous depends not on works but on the eternal grace of God, through which they have been entered into the book of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, (1626), 25.10–11 in John W. Beardslee in Reformed Dogmatics (New York: Oxford University Press, 1965), 184.</span></figcaption>

<blockquote><p>It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no [legal] suffering [by the saint] for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.</p></blockquote>

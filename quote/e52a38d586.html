<main class="wrap"><figure class="quote" id="q-e52a38d586" data-kw="">
<blockquote><p>Humbly offer this: two sorts of signs: sacramental, these are from institution, sitting is not of this kind. 2. There are other sorts of signs, you may call it natural. This gesture belongs to it as it is cena [a supper], and convivium [a meal in company], though not as a sacrament. We can hardly part from it, nay, I may add, we may not posibly part from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes and Papers of the Westminster Assembly, ed. Chad Van Dixhoorn, vol. 3</cite>, Session 247</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4f0adf507" data-kw="">
<blockquote><p>II. …This latter opinion [of Martin Luther] is followed by the Lutherans of our day. They maintain that to break means nothing else than to distribute the bread and give it to another; although they do not deny that Christ properly broke the bread. But this ceremony [of breaking the bread] is merely free and indifferent, lacking a command, which the church can at pleasure observe or omit… III. The [reformed] orthodox retain the breaking which was employed by the Lord… They think it is not an accidental and indifferent ceremony, but according to the institution of Christ, no less necessary than taking it in the hand, delivering and communing. Nor yet do they wish to contend so rigidly about it that no fellowship can be retained with those who omit it. they think this want [lack] of a thing not unimportant should neither be left unnoticed, nor tolerated if it can be corrected. Thus they are to be rebuked who hold this opinion, although they are not to be absolutely condemned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 19th Topic, ‘The Sacraments’, section 3, p. 443</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-baa2cb457b" data-kw="">
<blockquote><p>It is so far from being a warrant and satisfying to a man’s conscience for approaching the Lord’s Table because the discipline of the church admits him, that even a man habitually gracious and prepared will not for ordinary adventure to approach it except he has made conscience of getting himself actually prepared and his graces put in exercise, and set apart some considerable time for that purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-steuart-of-pardovan.html">Walter Steuart of Pardovan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collections &amp; Observations Concerning the Worship, Discipline &amp; Government of the Church of Scotland</cite>, (1709) | 15. Secret Preparation</span></figcaption>

</figure><figure class="quote" id="q-8186843c7c" data-kw="">
<blockquote><p>3. By forgetting the difference between their private familiarity, where they are choosers of their company themselves, and their Church-communion, where the pastors are the rulers and judges of the fitness of the members. Or else not understanding that this use of the keys, and judging of the fitness of the members, is indeed the pastor’s office and not theirs.

4. By not considering that nothing must be done by discipline upon offenders but in a course of Church-justice, upon due accusations, summons, audience, proof and patient admonition: And not by casting out any irregularly upon the expectation of every one that will say that they are ungodly and scandalous. … 8. By forgetting that God has not left the Church at arbitrary liberty to judge any godly or ungodly at their pleasure; But has given us a set test or rule to judge them by, which is their sober profession of consent to the baptismal Covenant, upon which the adult and their infants have right to baptism; and being baptized have right to Church-communion in all the acts which their age and understanding makes them capable of: And it is Church-tyranny to refuse such as show this title, till they are openly proved to forfeit it, by impenitency in gross sin after public admonition and due means. This is the truth, and the method of Christ’s discipline, and the rule of our communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), ‘To those Readers…’, p. 3</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b2afeedd80" data-kw="">
<blockquote><p>The law, then, as a covenant of works, does, in the most authoritative manner, demand from every descendant of Adam who is under it perfect holiness of nature, perfect righteousness of life, and complete satisfaction for sin. And none of the race of fallen Adam can ever enter heaven unless he either answers these three demands perfectly in his own person or accepts by faith the consummate righteousness of the second Adam, who “is the end of the law for righteousness to every one that believeth” (Rom. 10:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 20.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83baa068be" data-kw="">
<blockquote><p>VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.7 [pp. 575–76].</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-560646ec17" data-kw="">
<blockquote><p>A Repetition of the Law of the Covenant of Works. In the ministry of Moses, there was a repetition of the doctrine concerning the law of the covenant of works. The Mosaic Covenant, then, seems to be a sort of republication of the covenant of works. Of course it is not identical to the prelapsarian covenant, but there is that condition «by which formula, the righteousness, which is of the law, is described, Rom. x. 5. And the terror of the covenant of works is increased by repeated comminations; and that voice heard, cursed be he that confirmeth not all the words of this law to do them, Deut. xxvii. as the requirement of obedience was rigid under the ministry of Moses, the promises of spiritual and saving grace were more rare and obscure, the measure of the Spirit granted to the Israelites, scanty and short, Deut. xxix. 4. and on the contrary, the denunciation of the curse frequent and express; hence the ministry of Moses is called, “the ministration of death and condemnation,” 2 Cor. iii. 7,9. doubtless because it mentioned the condemnation of the sinner, and obliged the Israelites to subscribe to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 187.</span></figcaption>

">Read it online · Heidelblog</a></div>

<blockquote><p>3. BASICALLY, THE COVENANT OF GRACE IS SIMPLY THE EXECUTION OF THE ORIGINAL AGREEMENT BY CHRIST AS OUR SURETY. He undertook freely to carry out the will of God. He placed Himself under the law, that He might redeem them that were under the law, and were no more in a position to obtain life by their own fulfilment of the law. He came to do what Adam failed to do, and did it in virtue of a covenant agreement. And if this is so, and the covenant of grace is, as far as Christ is concerned, simply the carrying out of the original agreement, it follows that the latter must also have been of the nature of a covenant. And since Christ met the condition of the covenant of works, man can now reap the fruit of the original agreement by faith in Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Grand Rapids, MI: Wm. B. Eerdmans publishing co., 1938), 214.</span></figcaption>

</figure><figure class="quote" id="q-04f1fbc8fb" data-kw="">
<blockquote><p>QUESTION II. What ground we have to speak of “God’s covenant with Adam,” and to call it “a covenant;” there being no mention of it here in the text, nor elsewhere in scripture do we read of “God’s covenant with Adam.” ANSWER. However the name be not here, yet the thing is here and elsewhere, comparing scripture with scripture. It is a nice cavil in Socinians to call for the word “satisfaction;” others, for the word “sacrament;” others, for the word “Trinity;” others, for the words “faith alone justifying;” others, for the word “sabbath” for Lord’s day, etc.; and thence to conclude against satisfaction, sacraments, Trinity, justification by faith alone, and sabbath, for want of express words, when the things themselves are lively set down in other words. So, in this case of God’s covenant with Adam, we have: God’s command, which lays man under an obligation. We have God’s promise upon condition of obedience. We have God’s threatening upon his disobedience. We have their understanding it so, as appears in Eve’s words to the serpent. ( Gen. iii. 3.) We have the two trees as signs and symbols of the covenant. We have a “second covenant” and a “new covenant;” therefore there was a first and old covenant: a covenant of grace supposes one of works. OBJECTION. If any shall say, “By ‘first and old covenant’ was meant God’s covenant with Israel, and not with Adam; and so, by ‘covenant of works’ the same is meant; namely, that which the Lord made at Mount Sinai:” (Heb. 8:7—9:) ANSWER. Hereunto I answer, There is a repetition of the covenant of works with Adam in the law of Moses; as in that of the apostle to the Galatians: “The law is not of faith: but, The man that does” these things “shall live in them.” (Gal. 3:12) So likewise to the Romans: “Moses describes the righteousness which is of the law, That the man who does those things shall live by them.” (Rom. 10:5.) Thus it was with Adam principally and properly: therefore he was under a covenant of works, when God gave him that command in my text. QUESTION III. Wherein, then, does this covenant of works consist? What is the nature, tenor, and end of it, as such? ANSWER 1. This covenant required working on our part, as the condition of it, for justification and happiness; [and is] therefore called “a covenant of works.” Thus before: “The man that does” these things “shall live in them.” (Gal. 3:12) Working, indeed, is also required under grace now; but, (1.) Not to justification; (2.) Not from our own power; (Eph. 2:8) (3.) Not previous to faith, which “works by love,” (Gal. 5:6) and lives by working; (James 2:20;) but man lives by faith. 2. A second characteristic sign of the covenant of works is this,— that in and under it man is left to stand upon his own legs and bottom, to live upon his own stock and by his own industry; he had a power to stand, and not to have fallen. This is meant, when it is said, “God created man in his own image.” (Gen. 1:27) And again: “Lo, this only have I found, that God made man upright.” (Eccles. 7:29) 3. In the first covenant, namely, that of works, man had no need of a mediator; God did then stipulate with Adam immediately: for, seeing as yet he had not made God his enemy by sin, he needed no daysman to make friends by intercession for him. After man’s creation God said, he “saw every thing which he had made, and, behold, it was very good.” (Gen. 1:31) And after the covenant made in Gen. ii., it is said, “They were naked, and were not ashamed:” (verse 25:) that is, they had not contracted guilt by committing of sin, from whence only arises shame. Therefore under the covenant [of works] there needs no mediator. And hence Moses’s law was not properly a covenant of works, because that law was given “in the hand of a mediator.” (Gal. 3:19) 4. The covenant of works once broken, God abates nothing of his justice, no, not upon repentance; but the soul that sinned, died. Mark our text: “Thou shalt die the death;” by which doubling of the words in the Hebrew idiom of speech, is meant vehemency and certainty; which was effected, and so had continued inevitably, without the help of another covenant, hinted in that first promise, Gen. 3:15. For the first covenant gives no relief to a poor sinner, when he hath broken it; but leaves him hopeless and helpless, under “a fearful expectation of” wrath “and fiery indignation.” (Heb. 10:27) 5. The Lord in the covenant of works accepts the person for the work’s sake: that is, he mainly looks at the work, how adequate it is to the command and rule; which he so exactly heeds, that upon the least failure his justice breaks out in wrath, neither can any personal excellency in the world salve the matter: “Cursed is he that continues not in all the words of the law to do them. And all the people shall say, Amen;” (Deut. 27:26; Gal. 3:10) a doleful Amen! And, “Whosoever shall keep the whole law, and yet offend in one point, he is guilty of all.” (James 2:1) Note that “whosoever;” God respects no man’s person in that case. 6. The covenant of works, in performance of the condition, leaves a man matter of boasting and glorying in himself, and makes God a debtor to him: “Where is boasting? It is excluded. By what law? of works? Nay.” (Rom. 3:27) As if he had said, “The covenant of works affords matter of boasting to him that workS to justification by his own personal power and righteousness.” “Now to him that works is the reward reckoned, not of grace, but of debt;” (Rom. 4:4) that is, it obliges God to pay it him as a due; which is the language of Pharisees and Papists; which were justly challenged and claimed, (1.) Were we indeed under a covenant of works, and not of grace; (2.) Were our works perfect; (3.) Did we not lie at God’s mercy, for our guilt:—all which declare man impotent, and grace necessary; and, withal, Jews and Papists to be enemies to the cross of Christ and covenant of grace, and under a covenant of works, of which more anon. 7. The covenant of works leaves a man still in doubt while resting in it, in that state; because it is a mutable state at best. He had all in his own hands, and then Satan cunningly rooked him of all. God puts him into a good bottom, and leaves him to be his own pilot at sea: the devil assaults him, and sinks him. And therefore the second covenant takes all into God’s hands, that it may continue safe under his fatherly care and custody; (1 Peter 1:4, 5; John 10:28, 29) and so gives the soul good security against death and danger, which Adam had not while he stood: much less can any rich or honorable man, in his fool’s paradise here in this world, say, his mountain is unmovable, his glory unchangeable; seeing it “passeth away” as a “pageant.” (1 Cor. 7:31) If Adam’s Paradise was so mutable, much more theirs: if he stood not in his integrity, how shall they stand in their iniquity? 8. The covenant of works was made with all men in Adam, who was made and stood as a public person, head and root, in a common and comprehensive capacity; I say, It was made with him as such, and with all in him: [Quo mansit remanente, et quo pereunte peribat; “He and all stood and fell together.” For even the elect may say, “We are all by nature the children of wrath, as well as others;” and that of St. Paul: “We know that what things soever the law saith, it saith to them who are under the law: that every mouth may be stopped, and all the world may become guilty before God.” (Rom.3:19) But the covenant of grace is a discriminating thing; it takes-in some, and leaves out others. Christ is not a head in covenant with all, as Adam was; but of his elect only: for we find many in the world under the headship of Satan and antichrist and old Adam, who are out of Christ; not only because unconverted, as saints themselves are before regeneration; but out of Christ in the account of God’s election, donation, and covenant; who have none of his special love, nor ever shall have. Thus I have briefly opened the distinguishing characters of the covenant of works; which might have been more enlarged by those of the covenant of grace, which is easily done by way of opposition and comparison one with the other….</p></blockquote>

<div class="actions"><button class="copy" data-copy="“QUESTION II. What ground we have to speak of “God’s covenant with Adam,” and to call it “a covenant;” there being no mention of it here in the text, nor elsewhere in scripture do we read of “God’s covenant with Adam.” ANSWER. However the name be not here, yet the thing is here and elsewhere, comparing scripture with scripture. It is a nice cavil in Socinians to call for the word “satisfaction;” others, for the word “sacrament;” others, for the word “Trinity;” others, for the words “faith alone justifying;” others, for the word “sabbath” for Lord’s day, etc.; and thence to conclude against satisfaction, sacraments, Trinity, justification by faith alone, and sabbath, for want of express words, when the things themselves are lively set down in other words. So, in this case of God’s covenant with Adam, we have: God’s command, which lays man under an obligation. We have God’s promise upon condition of obedience. We have God’s threatening upon his disobedience. We have their understanding it so, as appears in Eve’s words to the serpent. ( Gen. iii. 3.) We have the two trees as signs and symbols of the covenant. We have a “second covenant” and a “new covenant;” therefore there was a first and old covenant: a covenant of grace supposes one of works. OBJECTION. If any shall say, “By ‘first and old covenant’ was meant God’s covenant with Israel, and not with Adam; and so, by ‘covenant of works’ the same is meant; namely, that which the Lord made at Mount Sinai:” (Heb. 8:7—9:) ANSWER. Hereunto I answer, There is a repetition of the covenant of works with Adam in the law of Moses; as in that of the apostle to the Galatians: “The law is not of faith: but, The man that does” these things “shall live in them.” (Gal. 3:12) So likewise to the Romans: “Moses describes the righteousness which is of the law, That the man who does those things shall live by them.” (Rom. 10:5.) Thus it was with Adam principally and properly: therefore he was under a covenant of works, when God gave him that command in my text. QUESTION III. Wherein, then, does this covenant of works consist? What is the nature, tenor, and end of it, as such? ANSWER 1. This covenant required working on our part, as the condition of it, for justification and happiness; [and is] therefore called “a covenant of works.” Thus before: “The man that does” these things “shall live in them.” (Gal. 3:12) Working, indeed, is also required under grace now; but, (1.) Not to justification; (2.) Not from our own power; (Eph. 2:8) (3.) Not previous to faith, which “works by love,” (Gal. 5:6) and lives by working; (James 2:20;) but man lives by faith. 2. A second characteristic sign of the covenant of works is this,— that in and under it man is left to stand upon his own legs and bottom, to live upon his own stock and by his own industry; he had a power to stand, and not to have fallen. This is meant, when it is said, “God created man in his own image.” (Gen. 1:27) And again: “Lo, this only have I found, that God made man upright.” (Eccles. 7:29) 3. In the first covenant, namely, that of works, man had no need of a mediator; God did then stipulate with Adam immediately: for, seeing as yet he had not made God his enemy by sin, he needed no daysman to make friends by intercession for him. After man’s creation God said, he “saw every thing which he had made, and, behold, it was very good.” (Gen. 1:31) And after the covenant made in Gen. ii., it is said, “They were naked, and were not ashamed:” (verse 25:) that is, they had not contracted guilt by committing of sin, from whence only arises shame. Therefore under the covenant [of works] there needs no mediator. And hence Moses’s law was not properly a covenant of works, because that law was given “in the hand of a mediator.” (Gal. 3:19) 4. The covenant of works once broken, God abates nothing of his justice, no, not upon repentance; but the soul that sinned, died. Mark our text: “Thou shalt die the death;” by which doubling of the words in the Hebrew idiom of speech, is meant vehemency and certainty; which was effected, and so had continued inevitably, without the help of another covenant, hinted in that first promise, Gen. 3:15. For the first covenant gives no relief to a poor sinner, when he hath broken it; but leaves him hopeless and helpless, under “a fearful expectation of” wrath “and fiery indignation.” (Heb. 10:27) 5. The Lord in the covenant of works accepts the person for the work’s sake: that is, he mainly looks at the work, how adequate it is to the command and rule; which he so exactly heeds, that upon the least failure his justice breaks out in wrath, neither can any personal excellency in the world salve the matter: “Cursed is he that continues not in all the words of the law to do them. And all the people shall say, Amen;” (Deut. 27:26; Gal. 3:10) a doleful Amen! And, “Whosoever shall keep the whole law, and yet offend in one point, he is guilty of all.” (James 2:1) Note that “whosoever;” God respects no man’s person in that case. 6. The covenant of works, in performance of the condition, leaves a man matter of boasting and glorying in himself, and makes God a debtor to him: “Where is boasting? It is excluded. By what law? of works? Nay.” (Rom. 3:27) As if he had said, “The covenant of works affords matter of boasting to him that workS to justification by his own personal power and righteousness.” “Now to him that works is the reward reckoned, not of grace, but of debt;” (Rom. 4:4) that is, it obliges God to pay it him as a due; which is the language of Pharisees and Papists; which were justly challenged and claimed, (1.) Were we indeed under a covenant of works, and not of grace; (2.) Were our works perfect; (3.) Did we not lie at God’s mercy, for our guilt:—all which declare man impotent, and grace necessary; and, withal, Jews and Papists to be enemies to the cross of Christ and covenant of grace, and under a covenant of works, of which more anon. 7. The covenant of works leaves a man still in doubt while resting in it, in that state; because it is a mutable state at best. He had all in his own hands, and then Satan cunningly rooked him of all. God puts him into a good bottom, and leaves him to be his own pilot at sea: the devil assaults him, and sinks him. And therefore the second covenant takes all into God’s hands, that it may continue safe under his fatherly care and custody; (1 Peter 1:4, 5; John 10:28, 29) and so gives the soul good security against death and danger, which Adam had not while he stood: much less can any rich or honorable man, in his fool’s paradise here in this world, say, his mountain is unmovable, his glory unchangeable; seeing it “passeth away” as a “pageant.” (1 Cor. 7:31) If Adam’s Paradise was so mutable, much more theirs: if he stood not in his integrity, how shall they stand in their iniquity? 8. The covenant of works was made with all men in Adam, who was made and stood as a public person, head and root, in a common and comprehensive capacity; I say, It was made with him as such, and with all in him: [Quo mansit remanente, et quo pereunte peribat; “He and all stood and fell together.” For even the elect may say, “We are all by nature the children of wrath, as well as others;” and that of St. Paul: “We know that what things soever the law saith, it saith to them who are under the law: that every mouth may be stopped, and all the world may become guilty before God.” (Rom.3:19) But the covenant of grace is a discriminating thing; it takes-in some, and leaves out others. Christ is not a head in covenant with all, as Adam was; but of his elect only: for we find many in the world under the headship of Satan and antichrist and old Adam, who are out of Christ; not only because unconverted, as saints themselves are before regeneration; but out of Christ in the account of God’s election, donation, and covenant; who have none of his special love, nor ever shall have. Thus I have briefly opened the distinguishing characters of the covenant of works; which might have been more enlarged by those of the covenant of grace, which is easily done by way of opposition and comparison one with the other….”

— Samuel Annesley, The morning exercises at Cripplegate 1679–81, ed. James Nichols (London: Thomas Tegg, 1844), 5.96–99. [Spelling and Punctuation modernized]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQUESTION+II.+What+ground+we+have+to+speak+of+%E2%80%9CGod%E2%80%99s+covenant+with+Adam%2C%E2%80%9D+and+to+call+it+%E2%80%9Ca+covenant%3B%E2%80%9D+there+being+no+mention+of+it+here+in+the+text%2C+nor+elsewhere+in+scripture+do+we+read+of+%E2%80%9CGod%E2%80%99s+covenant+with+Adam.%E2%80%9D+ANSWER.+However+the+name+be+not+here%2C+yet+the+thing+is+here+and+elsewhere%2C+comparing+scripture+with+scripture.+It+is+a+nice+cavil+in+Socinians+to+call+for+the+word+%E2%80%9Csatisfaction%3B%E2%80%9D+others%2C+for+the+word+%E2%80%9Csacrament%3B%E2%80%9D+others%2C+for+the+word+%E2%80%9CTrinity%3B%E2%80%9D+others%2C+for+the+words+%E2%80%9Cfaith+alone+justifying%3B%E2%80%9D+others%2C+for+the+word+%E2%80%9Csabbath%E2%80%9D+for+Lord%E2%80%99s+day%2C+etc.%3B+and+thence+to+conclude+against+satisfaction%2C+sacraments%2C+Trinity%2C+justification+by+faith+alone%2C+and+sabbath%2C+for+want+of+express+words%2C+when+the+things+themselves+are+lively+set+down+in+other+words.+So%2C+in+this+case+of+God%E2%80%99s+covenant+with+Adam%2C+we+have%3A+God%E2%80%99s+command%2C+which+lays+man+under+an+obligation.+We+have+God%E2%80%99s+promise+upon+condition+of+obedience.+We+have+God%E2%80%99s+threatening+upon+his+disobedience.+We+have+their+understanding+it+so%2C+as+appears+in+Eve%E2%80%99s+words+to+the+serpent.+%28+Gen.+iii.+3.%29+We+have+the+two+trees+as+signs+and+symbols+of+the+covenant.+We+have+a+%E2%80%9Csecond+covenant%E2%80%9D+and+a+%E2%80%9Cnew+covenant%3B%E2%80%9D+therefore+there+was+a+first+and+old+covenant%3A+a+covenant+of+grace+supposes+one+of+works.+OBJECTION.+If+any+shall+say%2C+%E2%80%9CBy+%E2%80%98first+and+old+covenant%E2%80%99+was+meant+God%E2%80%99s+covenant+with+Israel%2C+and+not+with+Adam%3B+and+so%2C+by+%E2%80%98covenant+of+works%E2%80%99+the+same+is+meant%3B+namely%2C+that+which+the+Lord+made+at+Mount+Sinai%3A%E2%80%9D+%28Heb.+8%3A7%E2%80%949%3A%29+ANSWER.+Hereunto+I+answer%2C+There+is+a+repetition+of+the+covenant+of+works+with+Adam+in+the+law+of+Moses%3B+as+in+that+of+the+apostle+to+the+Galatians%3A+%E2%80%9CThe+law+is+not+of+faith%3A+but%2C+The+man+that+does%E2%80%9D+these+things+%E2%80%9Cshall+live+in+them.%E2%80%9D+%28Gal.+3%3A12%29+So+likewise+to+the+Romans%3A+%E2%80%9CMoses+describes+the+righteousness+which+is+of+the+law%2C+That+the+man+who+does+those+things+shall+live+by+them.%E2%80%9D+%28Rom.+10%3A5.%29+Thus+it+was+with+Adam+principally+and+properly%3A+therefore+he+was+under+a+covenant+of+works%2C+when+God+gave+him+that+command+in+my+text.+QUESTION+III.+Wherein%2C+then%2C+does+this+covenant+of+works+consist%3F+What+is+the+nature%2C+tenor%2C+and+end+of+it%2C+as+such%3F+ANSWER+1.+This+covenant+required+working+on+our+part%2C+as+the+condition+of+it%2C+for+justification+and+happiness%3B+%5Band+is%5D+therefore+called+%E2%80%9Ca+covenant+of+works.%E2%80%9D+Thus+before%3A+%E2%80%9CThe+man+that+does%E2%80%9D+these+things+%E2%80%9Cshall+live+in+them.%E2%80%9D+%28Gal.+3%3A12%29+Working%2C+indeed%2C+is+also+required+under+grace+now%3B+but%2C+%281.%29+Not+to+justification%3B+%282.%29+Not+from+our+own+power%3B+%28Eph.+2%3A8%29+%283.%29+Not+previous+to+faith%2C+which+%E2%80%9Cworks+by+love%2C%E2%80%9D+%28Gal.+5%3A6%29+and+lives+by+working%3B+%28James+2%3A20%3B%29+but+man+lives+by+faith.+2.+A+second+characteristic+sign+of+the+covenant+of+works+is+this%2C%E2%80%94+that+in+and+under+it+man+is+left+to+stand+upon+his+own+legs+and+bottom%2C+to+live+upon+his+own+stock+and+by+his+own+industry%3B+he+had+a+power+to+stand%2C+and+not+to+have+fallen.+This+is+meant%2C+when+it+is+said%2C+%E2%80%9CGod+created+man+in+his+own+image.%E2%80%9D+%28Gen.+1%3A27%29+And+again%3A+%E2%80%9CLo%2C+this+only+have+I+found%2C+that+God+made+man+upright.%E2%80%9D+%28Eccles.+7%3A29%29+3.+In+the+first+covenant%2C+namely%2C+that+of+works%2C+man+had+no+need+of+a+mediator%3B+God+did+then+stipulate+with+Adam+immediately%3A+for%2C+seeing+as+yet+he+had+not+made+God+his+enemy+by+sin%2C+he+needed+no+daysman+to+make+friends+by+intercession+for+him.+After+man%E2%80%99s+creation+God+said%2C+he+%E2%80%9Csaw+every+thing+which+he+had+made%2C+and%2C+behold%2C+it+was+very+good.%E2%80%9D+%28Gen.+1%3A31%29+And+after+the+covenant+made+in+Gen.+ii.%2C+it+is+said%2C+%E2%80%9CThey+were+naked%2C+and+were+not+ashamed%3A%E2%80%9D+%28verse+25%3A%29+that+is%2C+they+had+not+contracted+guilt+by+committing+of+sin%2C+from+whence+only+arises+shame.+Therefore+under+the+covenant+%5Bof+works%5D+there+needs+no+mediator.+And+hence+Moses%E2%80%99s+law+was+not+properly+a+covenant+of+works%2C+because+that+law+was+given+%E2%80%9Cin+the+hand+of+a+mediator.%E2%80%9D+%28Gal.+3%3A19%29+4.+The+covenant+of+works+once+broken%2C+God+abates+nothing+of+his+justice%2C+no%2C+not+upon+repentance%3B+but+the+soul+that+sinned%2C+died.+Mark+our+text%3A+%E2%80%9CThou+shalt+die+the+death%3B%E2%80%9D+by+which+doubling+of+the+words+in+the+Hebrew+idiom+of+speech%2C+is+meant+vehemency+and+certainty%3B+which+was+effected%2C+and+so+had+continued+inevitably%2C+without+the+help+of+another+covenant%2C+hinted+in+that+first+promise%2C+Gen.+3%3A15.+For+the+first+covenant+gives+no+relief+to+a+poor+sinner%2C+when+he+hath+broken+it%3B+but+leaves+him+hopeless+and+helpless%2C+under+%E2%80%9Ca+fearful+expectation+of%E2%80%9D+wrath+%E2%80%9Cand+fiery+indignation.%E2%80%9D+%28Heb.+10%3A27%29+5.+The+Lord+in+the+covenant+of+works+accepts+the+person+for+the+work%E2%80%99s+sake%3A+that+is%2C+he+mainly+looks+at+the+work%2C+how+adequate+it+is+to+the+command+and+rule%3B+which+he+so+exactly+heeds%2C+that+upon+the+least+failure+his+justice+breaks+out+in+wrath%2C+neither+can+any+personal+excellency+in+the+world+salve+the+matter%3A+%E2%80%9CCursed+is+he+that+continues+not+in+all+the+words+of+the+law+to+do+them.+And+all+the+people+shall+say%2C+Amen%3B%E2%80%9D+%28Deut.+27%3A26%3B+Gal.+3%3A10%29+a+doleful+Amen%21+And%2C+%E2%80%9CWhosoever+shall+keep+the+whole+law%2C+and+yet+offend+in+one+point%2C+he+is+guilty+of+all.%E2%80%9D+%28James+2%3A1%29+Note+that+%E2%80%9Cwhosoever%3B%E2%80%9D+God+respects+no+man%E2%80%99s+person+in+that+case.+6.+The+covenant+of+works%2C+in+performance+of+the+condition%2C+leaves+a+man+matter+of+boasting+and+glorying+in+himself%2C+and+makes+God+a+debtor+to+him%3A+%E2%80%9CWhere+is+boasting%3F+It+is+excluded.+By+what+law%3F+of+works%3F+Nay.%E2%80%9D+%28Rom.+3%3A27%29+As+if+he+had+said%2C+%E2%80%9CThe+covenant+of+works+affords+matter+of+boasting+to+him+that+workS+to+justification+by+his+own+personal+power+and+righteousness.%E2%80%9D+%E2%80%9CNow+to+him+that+works+is+the+reward+reckoned%2C+not+of+grace%2C+but+of+debt%3B%E2%80%9D+%28Rom.+4%3A4%29+that+is%2C+it+obliges+God+to+pay+it+him+as+a+due%3B+which+is+the+language+of+Pharisees+and+Papists%3B+which+were+justly+challenged+and+claimed%2C+%281.%29+Were+we+indeed+under+a+covenant+of+works%2C+and+not+of+grace%3B+%282.%29+Were+our+works+perfect%3B+%283.%29+Did+we+not+lie+at+God%E2%80%99s+mercy%2C+for+our+guilt%3A%E2%80%94all+which+declare+man+impotent%2C+and+grace+necessary%3B+and%2C+withal%2C+Jews+and+Papists+to+be+enemies+to+the+cross+of+Christ+and+covenant+of+grace%2C+and+under+a+covenant+of+works%2C+of+which+more+anon.+7.+The+covenant+of+works+leaves+a+man+still+in+doubt+while+resting+in+it%2C+in+that+state%3B+because+it+is+a+mutable+state+at+best.+He+had+all+in+his+own+hands%2C+and+then+Satan+cunningly+rooked+him+of+all.+God+puts+him+into+a+good+bottom%2C+and+leaves+him+to+be+his+own+pilot+at+sea%3A+the+devil+assaults+him%2C+and+sinks+him.+And+therefore+the+second+covenant+takes+all+into+God%E2%80%99s+hands%2C+that+it+may+continue+safe+under+his+fatherly+care+and+custody%3B+%281+Peter+1%3A4%2C+5%3B+John+10%3A28%2C+29%29+and+so+gives+the+soul+good+security+against+death+and+danger%2C+which+Adam+had+not+while+he+stood%3A+much+less+can+any+rich+or+honorable+man%2C+in+his+fool%E2%80%99s+paradise+here+in+this+world%2C+say%2C+his+mountain+is+unmovable%2C+his+glory+unchangeable%3B+seeing+it+%E2%80%9Cpasseth+away%E2%80%9D+as+a+%E2%80%9Cpageant.%E2%80%9D+%281+Cor.+7%3A31%29+If+Adam%E2%80%99s+Paradise+was+so+mutable%2C+much+more+theirs%3A+if+he+stood+not+in+his+integrity%2C+how+shall+they+stand+in+their+iniquity%3F+8.+The+covenant+of+works+was+made+with+all+men+in+Adam%2C+who+was+made+and+stood+as+a+public+person%2C+head+and+root%2C+in+a+common+and+comprehensive+capacity%3B+I+say%2C+It+was+made+with+him+as+such%2C+and+with+all+in+him%3A+%5BQuo+mansit+remanente%2C+et+quo+pereunte+peribat%3B+%E2%80%9CHe+and+all+stood+and+fell+together.%E2%80%9D+For+even+the+elect+may+say%2C+%E2%80%9CWe+are+all+by+nature+the+children+of+wrath%2C+as+well+as+others%3B%E2%80%9D+and+that+of+St.+Paul%3A+%E2%80%9CWe+know+that+what+things+soever+the+law+saith%2C+it+saith+to+them+who+are+under+the+law%3A+that+every+mouth+may+be+stopped%2C+and+all+the+world+may+become+guilty+before+God.%E2%80%9D+%28Rom.3%3A19%29+But+the+covenant+of+grace+is+a+discriminating+thing%3B+it+takes-in+some%2C+and+leaves+out+others.+Christ+is+not+a+head+in+covenant+with+all%2C+as+Adam+was%3B+but+of+his+elect+only%3A+for+we+find+many+in+the+world+under+the+headship+of+Satan+and+antichrist+and+old+Adam%2C+who+are+out+of+Christ%3B+not+only+because+unconverted%2C+as+saints+themselves+are+before+regeneration%3B+but+out+of+Christ+in+the+account+of+God%E2%80%99s+election%2C+donation%2C+and+covenant%3B+who+have+none+of+his+special+love%2C+nor+ever+shall+have.+Thus+I+have+briefly+opened+the+distinguishing+characters+of+the+covenant+of+works%3B+which+might+have+been+more+enlarged+by+those+of+the+covenant+of+grace%2C+which+is+easily+done+by+way+of+opposition+and+comparison+one+with+the+other%E2%80%A6.%E2%80%9D%0A%0A%E2%80%94+Samuel+Annesley%2C+The+morning+exercises+at+Cripplegate+1679%E2%80%9381%2C+ed.+James+Nichols+%28London%3A+Thomas+Tegg%2C+1844%29%2C+5.96%E2%80%9399.+%5BSpelling+and+Punctuation+modernized%5D&amp;url=https%3A%2F%

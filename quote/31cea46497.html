<blockquote><p>The universal moral law either impressed by God upon the mind of all people or immediately discerned by the reason in its encounter with the order of nature. The natural law was therefore available even to those pagans who did not have the advantage of the Sinaitic revelation and the lex Mosaica [Law of Moses], with the result that they were left without excuse in their sins, convicted by conscientia [conscience]. The scholastics argue the identity of the lex naturalis [Natural Law] with the lex Mosaica or lex moralis [Moral Law] quod substantiam, according to substance, and distinguish them quod formam, according to form. The lex naturalis is inward, written on the heart and therefore obscure, whereas the lex Mosaica is revealed externally and written on tablets and thus of greater clarity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Greek and Latin Theological Terms 1st</cite>, ed. (Baker, 1985), pp. 174-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-43d9e0e19c" data-kw="">
<blockquote><p>From this it follows, that subjects are no farther bound to obey the magistrate because of conscience, than in as far as he himself presides and enjoins with a good conscience, and on the authority of the Word of God: and besides, it is worthy of observation, that the wrath of the magistrate, unless directed against the disobedient, refusing to do their duty according to the injunction of Jehovah, is neither just, nor lawful, nor to be feared by his subjects, but Christians, in the Christian warfare, must pass through the midst of it to victory in Christ, by the power of the Spirit of God; as we see in the case of Daniel, who rose to victory through the lions’ den, with his three friends, who esteemed the wrath of the king as nothing in comparison with their duty to God, although the disobedient were threatened with a fiery furnace, the heat of which had been increased seven times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-ferme.html">Charles Ferme</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Logical Analysis of Romans</cite>, (†1617) on Rom. 13:5, p. 293. Ferme (1565-1617) was a reformed Scottish divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-72c5a026dc" data-kw="">
<blockquote><p>Did the Lord by Moses give to the Jews as a body politic sundry judicial laws which expired with their state? Yes. Do they oblige any other now, further than the general equity thereof may require? No (Ex. 21; 22:1-29; Gen. 49:10; 1 Cor. 9:8-10; 1 Pet. 2:13-14; Mt. 5:17,38-39). Well then, do not some err, though otherwise orthodox, who maintain that the whole judicial law of the Jews is yet alive and binding all of us who are Christian gentiles? Yes. By what reasons are they confuted?

1. Because the judicial law was delivered by Moses to the Israelites to be observed, as to a body politic (Ex. 21).

2. Because this law, in many things which are of particular right, was accommodated to the commonwealth of the Jews, and not to other nations also (Ex. 22:3; 21:2; Lev. 25:2-3; Dt. 24:1-3; 25:5-7).

3. Because, in other things which are not of particular right, it is neither from the law of nature obliging by reason; neither is it pressed upon believers under the gospel to be observed.

4. Because believers are appointed under the gospel to obey the civil law and commands of those under whose government they live, providing they be just, and that for conscience’ sake (Rom. 13:1; 1 Pet. 2:13-14; Titus 3:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error: a Commentary on the Westminster Confession of Faith</cite>, ch. 19, question 4 (the first commentary defending the Westminster Confession)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>The great writers of all ages are cited [by Grotius] with a superfluous lavishness… as to give a historic catholicity to his doctrine by showing that the laws he is endeavoring to formulate have, in fact, been accepted in all times and by all men.” – Intro, p. 10 For a summary of some of Grotius’s distinctive points, some of which disagree with Rutherford, see the Intro, p. 11. Rutherford cites Grotius 42 times in Lex Rex. Selden, John – Of the Dominion, or, Ownership of the Sea, Two Books. In the First is showed that the Sea, by the Law of Nature, or Nations, is not common to all men, but capable of private dominion or propriety, as well as the land. In the Second is proved that the dominion of the British Sea, or that which encompasses the isle of Great Britain, is, and ever has been, a part or appendant of the empire of that island (London: 1652) ToC Selden (1584-1654) was an Erastian, English jurist, a scholar of England’s ancient laws and constitution, and a scholar of Jewish law. He was known as a polymath; John Milton hailed Selden in 1644 as “the chief of learned men reputed in this land.</p></blockquote>

<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d01a75c6aa" data-kw="">
<blockquote><p>The testimonies of Cyprian, Ambrose, Augustine, are easily answered, in a few words: They speak not of mystical rites, or significant ceremonies, but of some civil external usages gotten into worship; different in diverse places; as Socrates [the early Church, ecclesiastical historian] tells us of many, in his time, as in observation of Easter or Lent: in receiving the Lord’s Supper at evening or morning, standing or sitting, etc. Such an usage in Reformed Churches, is, that somewhere the ministers preach with heads covered, otherwhere, bare-headed, and many the like: In such things, those ancients advise to conform to the usages of the places where they come: but surely, would never have wise people to comply in things inexpediently sinful, in worship, in any place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-bagshaw.html">Edward Bagshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The XXIV Cases concerning things Indifferent in Religious Worship Considered</cite>, … (London, 1663), The Grand Case Considered, I. Touching Things Inexpedient, pp. 41-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

e</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bcfb44bddb" data-kw="">
<blockquote><p>A habit is a mere accident of worship; the person, John or Thomas, is also an accident; but if God command such an ephod as Aaron and the priests were to wear, this is not a mere circumstance… And therefore these circumstances, taken in common and their universal nature, are merely physical circumstances; but taken in their particular and determinate restrictions, as such circumstances, they may be merely moral circumstances, such as are the common adjunct of the time of worship, the place, and the Sabbath time and the temple for Jewish worship. The former are circumstances merely physical, the latter merely moral; I mean, as they are restricted other ways… … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say in all morals because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not put forth such things, but supposes them]: The Scripture says not that the worship of God must have a time, a place, when, and where its to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be; because nature teaches that without time, place, person, habit, gesture, its unpossible that these or any human actions can be; And therefore prelatical formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all; yea, there is as good reason that they demand Scripture to prove he must be a living man, who has a reasonable soul and senses, and is born of a woman, who preaches and administrates sacraments, which is presupposed by nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction, pp. 4-5</span></figcaption>

</figure><figure class="quote" id="q-377ce1470e" data-kw="">
<blockquote><p>A wive’s outward reverence consists in her reverend gesture, speech. For the first, that a reverend gesture and carriage of herself to her husband, and in her husband’s presence, beseems a wife, was of old implied by the vail which the woman used to put on, when she was brought unto her husband, as is noted in the example of Rebekah (Gen. 24:65): whereunto the apostle alludes in these words, ‘the woman ought to have power on her head.’ (1 Cor. 11:10) That cover on the woman’s head, as in general it implied subjection, so in particular this kind of subjection, viz. a reverend carriage and gesture. But most expressly is this duty set down by Saint Peter who exhorts wives to order their conversation [conduct] before their husbands, so as it be pure, with reverence. This reverend conversation [conduct] consists in a wive-like sobriety, mildness, courtesy and modesty. [Gouge does not go on to mention veils]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Domestical Duties… (London: 1622) | 3rd Treatise, “Of Wives’ Particular Duties,” | section 9, p. 278</span></figcaption>

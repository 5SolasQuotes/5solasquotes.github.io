<main class="wrap"><figure class="quote" id="q-51218dfecc" data-kw="">
<blockquote><p>They [false professors] do not esteem all of Christ. If Christ be truly precious to the soul, then all of Christ must be precious; not only his name, and offices, and sufferings, but also his ordinances, ministers, members, and government. You must esteem everyone of these.

Many esteem Christ in one thing, but not in another; they may delight in his mercy, but not in his holiness; they may love him as a priest to die for them, but not as a king to rule over them; they will not submit to the laws of his kingdom; they find no sweetness in his ordinances; they despise his servants, they do not love a whole Christ. It is a fancy of their own making; they think they esteem Christ, but they esteem him not as he hath set forth himself in his word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 257-58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-918b01b664" data-kw="">
<blockquote><p>And for the command, ‘Come out from among them and be ye separate,’ it’s pity that any Christian should need to be told that it speaks only to the Church to come out of the heathen, infidel world (such as are Jews and Mohammedans, and heathens); but there is never a word in all the Bible that bids you ‘Come out of the Church and be ye separate!’ Wonderful! that God should be so abused by misunderstanding Christians! Because He commands men to come out of the infidel world into the Church, they plead it as if He commanded them to come out of the Church into a separated sect. The Church is the House of Christ: Forsake it not, while he stays in it: Forsake it not, for He has promised never to forsake it. Particular Churches indeed he may cast off, but never the universal: Dwell therefore where He dwells.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Catholic, &amp; Catholic Church Described</cite>, … (London: A.M., 1660), pp. 205-6</span></figcaption>

</figure><figure class="quote" id="q-a9a7b7065a" data-kw="">
<blockquote><p>I. Since a division arose among Protestants regarding certain key points of the Christian religion, and those who follow the Helvetic, French, and Belgic Confessions have openly separated from those who adhere more closely to the Augsburg Confession [1530], the former, known specifically as the Reformed, have always tried to reconcile with those [Lutherans] of the Augsburg Confession, and have attempted various ways to establish ecclesiastical peace and remove the schism between the two groups.

II. Although these latter ones have often rejected the offered peace [by the Reformed] and many of them still seem very averse to it, sometimes the effort has met with success. For example, a hundred years ago at the Synod of Sandomierz, ministers who taught the Gospel of Christ according to both the Augsburg Confession and the Confession of the Waldensian Brethren and the Helvetic Churches in both Poland, Lithuania, and Samogitia came together in a common confession and were reconciled. Recently, in the Colloquium of Kassel, between the theologians of Marburg and Rinteln, a mutual communion was agreed upon despite remaining disagreements on what were considered fundamental issues.

III. Furthermore, in this century, there have been among other theologians of the Augsburg Confession some highly learned and celebrated men who publicly declared in their writings their desire for such ecclesiastical peace between the two Protestant parties and outlined the means to achieve it. For instance, Matthias, Bishop of Strängnäs in Sweden, in his book Northern Olive Branch, and George Calixtus, professor of theology at the University of Helmstedt, in his book Judgment on Theological Controversies between the Reformed and Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), ‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows,’, pp. 950-57 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<main class="wrap"><figure class="quote" id="q-b4ae3141e7" data-kw="">
<blockquote><p>The extraordinary presence of God was by his miraculous apparitions and discovering Himself by some miraculous token, vision, sign, or manifestation of his presence, as now here in this burning, and not consumed bush; here was a miraculous token of God’s presence. We shall and in the fifth of Joshua… I conceive, hence it is, the mountain in which Christ was transfigured is called, ‘the holy mountain,’ 2 Pet. 1:18… Why holy? Not as if it were holy at that time when the apostle writ that epistle, but it were manifest there was an extraordinary manifestation and sign of God’s presence, and so long as this extraordinary manifestation of God’s presence continued it was called ‘holy.’… And remember this place now, of God’s extraordinary miraculous manifestation of Himself in the bush was holy for that time, and no longer, wherein He did manifest Himself; for otherwise, in the time of the Law, it were unholy to offer up sacrifice there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkins.html">William Jenkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exact Collection of Farewell Sermons preached by the Late London-Ministers… (London: 1662), Mr. Jenkin’s Afternoon Sermon</cite>, pp. 287-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (love as heart idolatry)</span></figcaption>

</figure><figure class="quote" id="q-cf84acc948" data-kw="">
<blockquote><p>Our Opposites here tell us of two things necessary to the making up of idolatry, neither of which is found in their kneeling. First, they say except there be an intention in the worshipper to adore the creature which is before his eyes, his kneeling before it is no idolatry… Answer. …Nay then the three children should not have been idolaters if they had kneeled before Nebuchadnezzar’s image, intending their worship to God only, and not to the image. Our Opposites here take the Nicodemites by the hand. But what says Calvin? ‘Si isti boni sapientesque Sophistae, ibi tum fuissent, simplicitatem illorum trium servorum Dei irrisissent. Nam hujusmodi credo cos verbis objurgassent: miseri homines istud quidem*non est adorare, quum vos in rebus nullam fidem adhibetis: nulla est Idololatria nisi ubi est devotio, hoc est quaedam animi ad idola colenda venerandasque adjunctio atque applicatio, &amp;c.’ (De fugiend. idololat., homily 1) If Paybody had been in Calvin’s place he could not have called the [protestant] Nicodemites idolaters, forasmuch as they have no intention to worship the Popish images when they kneel and worship before them. Nay, the grossest idolaters that ever were, shall by this doctrine be no idolaters, and Paul shall be censured for teaching that the Gentiles did worship devils, since they did not intend to worship devils. ‘Idololatrae nec olim in Paganismo intendebant, nec hodie in Papatu intendunt, Daemonibus offerre. Quid tum? Apostolus contrarium pronuntiat, quicquid illi intendant,’ says Pareus (Com. in illum locum, sect. 11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 4</cite>, pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-e3795a3263" data-kw="">
<blockquote><p>Nay thou worshippest them, who makest them that they may be worshipped. But in all other senses the making a picture is not making an idol; and therefore that severe sense of the commandment, though as it is most probable it did oblige the Jews, and all persons in equal danger; yet because the reason may cease, and the danger be secured, when it is ceased, the obligation also is null; and therefore though that was in the commandment, yet it is no part of its morality; but that excepted, every other clause [of the Second Commandment] is moral and eternal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium, or, The Rule of Conscience in all her General Measures serving as a great instrument for the determination of cases of conscience… (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook.</cite>, p. 342</span></figcaption>

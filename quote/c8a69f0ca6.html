<main class="wrap"><figure class="quote" id="q-c8a69f0ca6" data-kw="">
<blockquote><p>The Apostle S Paul doth notably amplify the honour due to the true and faithful Ministers. The Elders that rule well (saith he) let them be had in double honour, specially they which labour in the word and doctrine, as if he should say, let those Elders which are appointed to watch and look to the manners and behaviour of the children of God, if they execute this charge faithfully, be had in double honour: but above all, let the faithful Ministers, such as labour in the word, be honoured: for why? the other are overseers of your outward behaviour, but these have an other manner of office, they watch over your souls, which tendeth to the salvation both of body and soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fourteenth Sermon</cite>, in The works of the reverend and faithful servant of Jesus Christ M. Richard Greenham, minister and preacher of the Word of God collected into one volume: revised, corrected, and published, for the further building of all such as love the truth, and desire to know the power of godliness, ed. Henry Holland (5th edn, London: William Welby, 1612), p. 352.</span></figcaption>

<blockquote><p>If Paul is not referring to the wives of elders and deacons, and is not referring to women deacons in the same office as men deacons, then… The most logical and natural alternative would be to regard ‘women’ as referring to the servant-widow class that assists the deacons by ministering to the needs of women. [Hendricksen:] ‘… he regards these women as the deacons’ assistants in helping the poor and needy, etc. These are women who render auxiliary service, performing ministries for which women are better adapted…’… The interpretation of 1 Timothy 3:11 as referring to ‘women’ who assist the deacons who belong to the order of widows described in 1 Timothy 5:9ff. is also exegetically superior to the ‘women in the same office’ view when the broader contextual matters are considered.</p></blockquote>

</figure><figure class="quote" id="q-68b3706ba6" data-kw="">
<blockquote><p>He that ruleth, with diligence.] Although I doubt not that there were many kinds of government in the Church, yet to confess the truth, this as I think may most aptly be understood of those which were called praesbiteri, that is, elders, not of these which had the charge of the word and of doctrine, but of those which were appointed as helpers to the pastors. They as men of the wiser sort &amp; endowed with a greater zeal and piety, were chosen out of the Laity. Their office was chiefly to see unto discipline, and to look what every man did, and in every house &amp; family to see what every man needed, either as touching the soul, or as touching the body.

For the Church had his elders, or if I may so speak, his senate, which as time required provided for all things mete and profitable. Paul describeth this kind of ministry not only in this place but also in the first to Timothy: For thus he writeth. The elders, are worthy of double honour, especially they which labour in the word &amp; in doctrine. In which words he seemeth to signify, there are some praesbiteri which teach and set forth the word of God: and there are others, which although they do not this, yet are they governors in the Church as elders.

This thing Ambrose left not untouched, when he expounded that place, yea he complaineth, that even them either thorough the pride, or thorough the slothfulness of the priests they were in a manner worn away. For whilst they which have the government of the Church seek to draw all things to themselves, they diligently as much as they can, labour that in that room should be joined no fellow officers with them. Wherefore Paul willeth, that they which have this charge, doo put to their diligence, and expel slothfulness and sluggishness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most learned and fruitful commentaries of D. Peter Martir Vermilius Florentine, professor of divinity in the school of Tigure, upon the Epistle of S. Paul to the Romanes wherein are diligently [and] most profitably entreated all such matters and chief common places of religion touched in the same Ep</cite>, trans. Henry Billingsley (London: John Day, 1568), p. 418.</span></figcaption>

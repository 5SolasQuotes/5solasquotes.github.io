<main class="wrap"><figure class="quote" id="q-c396306b43" data-kw="">
<blockquote><p>I Might yet allege many other differences: but this little may suffice, to let you see, what are the main reasons which oblige us to separate from Rome. Whence it appears, how unjust a comparison it is (that I say not impertinent and silly) which some make of our Separation to that of the Donatists.

For they pretended not to find any thing in the doctrine of the Catholic Church from whence they separated, which was contrary to their belief. Both the one and the other taught the same faith, read the same books, exercised the same services. The Donatist entering with the Catholics found nothing either in their belief or discipline, which he had not seen and learned in his own.

But as for us, ’tis impossible that we should enter into the Communion of the Church of Rome, without swearing to many doctrines which we formerly never learned in the school of the Scriptures; without receiving Sacraments which are utterly unknown to us; without bowing our knees before images which is absolutely forbidden; without adoring a thing for God whose Deity we know not; without acknowledging him to be the Head and Husband of the Church whom we know to be but a mortal man; without subjecting those consciences to an human, which are taught and wont to submit unto none but a divine Authority. …

I would to God the case between the Roman Church and us had been the like! That we had seen nothing deplorable but only the faults of her Pastors, and the disorders of her manners! or That such of her doctrines which we cannot receive, had been the thoughts of some particular men only! Had there been nothing else we should have lived still together.

Our Fathers would never have separated from Her Communion; or if some strange passion, which we dream not of, had precipitated them into a rupture and schism like that of the Donatists; We do in our Consciences protest, that we would have been afraid to follow their error, and that we would have lost no time of uniting our selves with them, from whom we had been so imprudently separated.

For we cannot but confess, That ’tis a piece of very high injustice to impute the faults of men to their profession, and to accuse their Religion of those extravagancies which they commit, especially if against it. In such a case we should questionless practise the doctrine of our Saviour, speaking of them who sit in Moses chair; Matt. xxiii. 3. All those things which they bid you observe, those observe and do; but do not after their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), pp 13, 15.</span></figcaption>

</figure><figure class="quote" id="q-2a0e5d748a" data-kw="">
<blockquote><p>Our brethren of Scotland writing against the tyranny of Prelates, when they were under it, in that book entitled, English and Popish Ceremonies [by Gillespie], have this passage: ‘If the error of conscience be about things unnecessary, then it is tutior pars, ‘the surest and safest way’ not to urge men to do that which in their consciences they condemn.’ And the ministers of the protestant Churches in France, giving their judgments, De pace inter Evangelicos procuranda, How Peace amongst the Protestants in Germany may be had, set forth by [John] Duraeus, say thus: ‘Let all matters controversal be brought into such a certain model as may give satisfaction to both parties; and that if it be possible, framed out of the very words of Scripture: and let no man require anything else of his brother.’ [Jerome] Zanchi, on the 4th Commandment, has this notable speech, ‘That which I say,’ says he: ‘is diligently to be observed, that those who would stir up princes to have all people, kingdoms, commonwealths which (not overthrowing the fundamentals of religion), differ from them in anything, condemned of heresy, excluded from friendship, driven out of their territories: these are no friends,’ says he, ‘either to their princes or to the Church of Christ.’ Many think they do great service to Christ, the Church and State, if they can stir up magistrates to suppress whatsoever they conceive are errors; it may be their hearts are upright in the main, they aim at peace, but certainly they cause much disturbance in Church and State. Bishop [John] Davenant in a little book entitled his, Exhortation to Brotherly Love amongst Churches, the ninth chapter, has this title: ‘That brotherly communion between Churches evangelical is not to be cut asunder because of diverse opinions about questions controversial.’ And in the beginning of the 10th chapter: ‘This is to be premised: The bonds of the brotherly communion of Christian Churches ought not to be dissolved upon every difference of opinions, but only for the denying or opposing fundamentals.’ Here see the moderation of a prelate. Thus Cyprian of old delivered his opinion and practised it accordingly, differing from many of his brethren, but withal professes: That he meant not to prescribe or give laws to any, that he would not contend with any of his colleagues so as to break divine concord and the peace of our Lord; that he was far from judging or censuring any of his brethren or cutting off from his communion any that were of a different mind; and that in such case none ought to constrain his colleague by tyrannical violence (therein glancing at the violent proceeding of Stephen to whom he wrote) to a necessity of believing or following what he thinks meet. (Epistle 72, to Stephen; Epistle 73, to Jubajanum) This modesty and charity of Cyprian is very often and very deservedly commended by St. Augustine (Contra Donatists, bk. 1, ch. 18; bk. •, chs. 1-2), says Dr. Potter, an episcopal man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened</cite>, … (London: Robert Davvlman, 1653), ch. 9; pp. 55-56</span></figcaption>

2C+Exhortation+to+Brotherly+Love+amongst+Churches%2C+the+ninth+chapter%2C+has+this+title%3A+%E2%80%98That+brotherly+communion+between+Churches+evangelical+is+not+to+be+cut+asunder+because+of+diverse+opinions+about+questions+controversial.%E2%80%99+And+in+the+beginning+of+the+10th+chapter%3A+%E2%80%98This+is+to+be+premised%3A+The+bonds+of+the+brotherly+communion+of+Christian+Churches+ought+not+to+be+dissolved+upon+every+difference+of+opinions%2C+but+only+for+the+denying+or+opposing+fundamentals.%E2%80%99+Here+see+the+moderation+of+a+prelate.+Thus+Cyprian+of+old+delivered+his+opinion+and+practised+it+accordingly%2C+differing+from+many+of+his+brethren%2C+but+withal+professes%3A+That+he+meant+not+to+prescribe+or+give+laws+to+any%2C+that+he+would+not+contend+with+any+of+his+colleagues+so+as+to+break+divine+concord+and+the+peace+of+our+Lord%3B+that+he+was+far+from+judging+or+censuring+any+of+his+brethren+or+cutting+off+from+his+communion+any+that+were+of+a+different+mind%3B+and+that+in+such+case+none+ought+to+constrain+his+colleague+by+tyrannical+violence+%28therein+glancing+at+the+violent+proceeding+of+Stephen+to+whom+he+wrote%29+to+a+necessity+of+believing+or+following+what+he+thinks+meet.+%28Epistle+72%2C+to+Stephen%3B+Epistle+73%2C+to+Jubajanum%29+This+modesty+and+charity+of+Cyprian+is+very+often+and+very+deservedly+commended+by+St.+Augustine+%28Contra+Donatists%2C+bk.+1%2C+ch.+18%3B+bk.+%E2%80%A2%2C+chs.+1-2%29%2C+says+Dr.+Potter%2C+an+episcopal+man.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Irenicum%2C+to+the+Lovers+of+Truth+and+Peace.+Heart-Divisions+Opened%2C+%E2%80%A6+%28London%3A+Robert+Davvlman%2C+1653%29%2C+ch.+9%3B+pp.+55-56&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2a0e5d748a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2a0e5d748a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=Our%20brethren%20o <blockquote><p>Magistrates in their place have their influence on them to preserve them from corruption: but especially Ministers are useful that way. In such Nations where there is no Gospel Ministry, People are very corrupt: if by the light of Nature and severity of Rulers, they be preserved from grosser iniquities, yet they are always very corrupt. But the Faithful Services of Gospel-Ministers is a special help to preserve from corruptions.

A Gospel-Ministry is looked upon by some Persons as an heavy charge, they groan under the burden of it; but Men have little reason to think much of the charge considering the benefit that they are to a People, as they are means to prevent the growing of corruption. Ministers had need be careful that they do fulfil their Ministry, for their work is not only of great concernment to themselves, but also to Multitudes of others, by keeping the Country from corruption.</p></blockquote>

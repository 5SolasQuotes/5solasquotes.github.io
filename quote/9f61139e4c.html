<main class="wrap"><figure class="quote" id="q-9f61139e4c" data-kw="">
<blockquote><p>To me it is plain that these things do as much concern us now, as the Jews of old, which whosoever denies, must show that, either we may take no rules nor patterns from the Old Testament; or that the foresaid laws and practices were not intended by the Holy Ghost to bind us (as other things in the Old Testament do); but were ceremonial and typical, intended to bind the Jews only.

Mr. [Roger] Williams in his Bloody Tenet … perceiving that such arguments from the Old Testament cannot be taken off without this answer, that all these were typical and figurative; he therefore goes much upon that ground, and so devises more types and figures in the Old Testament than ever anybody did before him, and pleases himself with such fancies and conjectures therein as, I dare say, will satisfy no indifferent reader; and in effect making void by his principles all arguments from the Old Testament, so that we may not from the examples of the godly kings of Judah, teach Christian magistrates what their duty is; nor argue thus, God commanded that the kings of Judah should have a copy of the book of the law by them, and read therein, that they should not multiply wives, etc. (Deut. 17:17, 18:19); therefore Christian princes should search the scriptures, should not multiply wives, etc. or thus.

The priests and Levites had sufficient maintenance; therefore so should the ministers of the gospel thus. The Jews were commanded to rest from all servile labour on the sabbath day; therefore so should Christians on the Lord’s day. Or thus: Wars were lawful in the Old Testament; therefore they are lawful still. Or the like. All these shall be cast aside, upon this ground: they were typical, therefore no pattern to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A late dialogue between a civilian and a divine</cite>, (London, 1644) in The anonymous writings of George Gillespie, ed. Chris Coldwell (Dallas TX: Naphtali Press, 2008), pp 133-34.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4beebe13c1" data-kw="">
<blockquote><p>The Crimes of persons are grievous, but those of a State are more. The corruption of a member is not so grievous as of the whole Body; and the deformity of the Body Political, is not so unpleasant to the eye of God as of the Church: this is the Body, this is the Bride of Christ; nothing so much provokes the passion of a loving Husband, as the polluting of his Spouse. Church-grievances were the first and main causes of our present Troubles; the righting of these, will open the door of our first hope of deliverance.

Whoso will observe either the spring or progress of our present Woes in all the three Kingdoms, will find that the open Oppression and secret Undermining of the Common-wealth, by the craft and tyranny of the malignant Faction, did highly provoke the wrath of God, and was a great occasion of all this Discord which hath broke out among men: Yet it is evident, that the principal cause which hath kindled the Jealousie of God, and enflamed the spirits of men to shake off and break in pieces those Yokes of Civil Slavery, which ingenuous necks were no more able to bear, was the constuprating [sic] of the Church, the bringing in upon her by violence, and daily multiplying of Errors, Superstitions, Idolatries, and other Spiritual Burdens.

The Method of our Cure, if ever it prove solid, must lead our Physicians to the fountain of our Disease. All Treaties for accommodating State-differences, will be lost, if in the first place Religion be not provided for, according to the mind of God. If once the Temple were builded, and filled with the cloud, the Difficulties would be small in making up the breaches in the house of the Kingdom, and filling it with Peace and Prosperity. So long as the Temple lies desolate, it is not possible to rear up the walls of the City. […]

Interests of private persons and particular Factions, laid over with the colour of pretended State-reasons, may procrastinate days without number, settling of Religion: yet if we trust either ancient or late experience, these States-men provide best for the welfare of their Country, who give to the God of heaven, to his Worship and House, the first and most high place in all their studies and cares.

If we behold either the former, or the later Reformers of the State of Israel; if we consider the practice of Moses, of David, of Hezekiah, of Zerubbabel, and others, it is evident the Tabernacle, the Ark, the Temple, did first and most lie at all their hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dissuasive from the errors of the time</cite>, (London, 1645), pp 2-3.</span></figcaption>

<blockquote><p>But if that cannot be conveniently had, as in a national Church it may fall out, then the Magistrate as a preserver of peace and truth, may command the sincerer part [of the Church] to convene in a synod, and do their duty, as the good kings of the people of God did: 2 Chron. 15, Asa gathered together a people who entered in covenant to seek the Lord God with all their heart, and laid an obligation of punishment to death on the rest, vv. 12-13; and Jehoshaphat, 2 Chron. 23:4, he laid charge on Hilkiah the High Priest, and the priests of the second order, whom he knew to be better affected to the work, to bring out the vessels made for Baal; which proves that the king should put the sincerest to do that, which in common belongs to the whole, in which case of the erring of the most part of the Church, the prince indirectly condemns the erring part of the [ecclesiastical] synod, because it is his place to forbid and to punish with the sword, the transgressors of God’s Law. But because his power is accumulative [to build up, according to the truth], not privative [to take away], under that pretense he has not power to hinder the sincerer part to meet and determine according to the Word of God. … …but the king’s power cannot make Church-canons [determinations], for it is a part of the ministerial calling to make canons, and therefore he [the magistrate] cannot annul and dissolve canons: but some greater kingly power is due to the king in the case of the Church’s aberring, than in the case of the Church’s right administration; and as our divines do justly give to the prince an extraordinary kingly power in the case of universal apostasy of the Church, as Jehoshaphat, Hezekiah, Josiah, and other worthy reformers in the Church of the Jews, did warrantably use their kingly power, when the Church-men were corrupted and negligent in their duty; so in a particular case of a particular error of the synod, the king as king, may use his kingly power in this fact, that is, secundum quid extraordinarie [according to that which you must do extraordinarily], for the king is obliged as king to add his accumulative power of a civil sanction to all just and necessary Church constitutions, and if the canon or Church constitution be wicked and popish, he is obliged to deny his civil sanction, and not that only, (for he that is not with Christ is against him) but he is to employ his kingly power against such canons, and so is to deliver the Church of God in that, and in denying his accumulative power to unjust canons, he adds his kingly power accumulative to the true Church, in saving them from these unjust canons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), Pt. 2, pp. 412-414</span></figcaption>

</figure><figure class="quote" id="q-83e40f8274" data-kw="">
<blockquote><p>…who denies that the magistrate may command the husband and wife to do a duty to each other, the father not to provoke the son, the son not to disobey the father… the master and servant, the captaine and soldier to do a duty each, one to another? And there is a proper right and liberty, and power [in these relations] immediately given by God, without the king or magistrate’s interposing of their authority: to all these, the king’s authority makes not the man a father, nor the son subject to the father, nor the servant to the master, nor the soldier to the commander. God immediately made those powers, and God in the Law of Nature has given a power to the father over the son without the magistrate; yea, though there had never been a magistrate in the world… …now it no more follows that all fathers are equal to the magistrate, all masters, all captains to the king… for fathers, masters, captains, husbands have immediately from God in the Law of Nature a supreme, a high and independent authority… without any intervention of the will or authority of king or any earthly magistrate, and without any subordination as they are such to the prince. … 3. If the magistrate should usurp over husbands, and masters and fathers, their jus maritale, herile, paterum [right of marriage, being an heir, or a father], and spoil them of husband-power, and masterly and fatherly power, as our adversaries counsel the magistrate to take the spiritual right and power of the keys of the Kingdome of God from the Church and pastors, the former should complain, as do the latter.</p></blockquote>

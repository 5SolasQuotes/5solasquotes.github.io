<main class="wrap"><figure class="quote" id="q-706737c25c" data-kw="">
<blockquote><p>The Law—considered as a national covenant, by which their continued possession of the land of Canaan, and of all their privileges under the Theocracy, was left to depend on their external obedience to it,— might be called a national Covenant of Works, since their temporal welfare was suspended on the condition of their continued adherence to it; but, in that aspect of it, it had no relation to the spiritual salvation of individuals, otherwise than as this might be affected by their retaining, or forfeiting, their outward privileges and means of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification: An Outline of Its History in the Church and of Its Exposition from Scripture.(Edinburgh: T&amp;T Clark</cite>, (Oxford: Oxford University Press, 1867), 38–39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d2b2d7251f" data-kw="covenant of nature works">
<blockquote><p>The covenant of nature is that which God the Creator made with innocent man as his creature, concerning the giving of eternal happiness and life under the condition of perfect and personal obedience. It is called “natural,” not from natural obligation (which God does not have towards man), but because it is founded on the nature of man (as it was at first created by God) and on his integrity or powers. It is also called “legal” because the condition on man’s part was the observation of the law of nature engraved within him; and of “works” because it depended upon works or his proper obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a> › <a href="../topics/the-covenant-of-works/nature-of-the-covenant/of-works.html">Of works</a></span><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a> › <a href="../topics/the-covenant-of-works/nature-of-the-covenant/of-life.html">Of life</a></span><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a> › <a href="../topics/the-covenant-of-works/nature-of-the-covenant/covenant-of-nature.html">Covenant of nature</a></span></div>

</figure><figure class="quote" id="q-13bf37024c" data-kw="">
<blockquote><p>Everyone will have to agree that for Adam, perfect keeping of the law for a fixed period of time was the means to acquire eternal beatitude that cannot be lost. When the covenant of works was broken, God could have rescinded this promise. He was no longer bound to honor it. Nevertheless, He allowed the promise and the condition to stand and repeatedly be published anew, especially by the proclamation of the Sinaitic law (Lev 18:5, “The one who does them will live by them”; cf. Rom 10:5, “For Moses describes the righteousness that is by the law,” etc.; Gal 3:12). Fulfillment of this condition from man’s side was no longer conceivable; thus the repetition must have had a different significance. This significance can only be that after the fall God gave His covenant of grace, in which the same demand and promise are fulfilled in the Mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: A System of Christian Theology Single Volume Edition</cite>, ed. and trans. Richard B. Gaffin Jr., vol. 3 (Bellingham, WA: Lexham Press, 2012–16), 132.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-181685f20a" data-kw="">
<blockquote><p>…describes the entire biblical history as a series of events by which an original covenant of works is gradually annulled, bringing new phases in the history of the covenant of grace. He shows that God’s standard way of relating to mankind is through covenant, which, at its heart, is friendship with God.” – Bookflap Vlak, Johannes – Dissertation 1, On the Covenant of Works of God in A Triad of Dissertations: on the Covenants of God of Works &amp; of Peace, &amp; on Justification in Response to Leydekker (1689), pp. 71-170 trans. AI Latin Vlak (c.1635-1690) appears to have leaned towards Cocceius, contra Leydekker who was a Voetian. Flavel, John – Vindiciæ Legis &amp; Fœderis: or, A Reply to Mr. Philip Cary’s Solemn Call, wherein he Pretends to Answer All the Arguments of Mr. Allen, Mr. Baxter, Mr. Sydenham, Mr. Sedgwick, Mr. Roberts, and Dr. Burthogge for the Right of Believers’ Infants to Baptism, by Proving the Law at Sinai &amp; the Covenant of Circumcision with Abraham were the Very Same with Adam’s Covenant of Works, &amp; that Because the Gospel-Covenant is Absolute (London, 1690) . 1700’s Hopkins, Ezekiel – The Doctrine of the Two Covenants, wherein the Nature of Original Sin is at Large Explained… (London, 1712) Table of Contents This is also in vol. 2 of his Works. Hopkins (1634-1690) was a reformed, Anglican divine in the Church of Ireland. Hog, James – Some Select Notes Towards Detecting a Covered Mixture of the Covenant of Works, &amp; of Grace: With the Danger of that Evil; &amp; a Few Advices for Remedying Thereof. Contained in a Letter to a Friend Upon the Head Ref (1718) 20 pp. Hog (c.1658-1734) was a Scottish minister at Carnock, known for his role in the Marrow Controversy within the Church of Scotland. Taylor, Richard – Discourses on the Fall &amp; Misery of Man: &amp; on the Covenant of Grace (London: John Clark, 1725) 379 pp. Herman Witsius footnotes this work under the statement: “The formularies of the Protestant Churches in general, and the writings of the most eminent Reformed Divines…” – On the Apostles’ Creed, Note XII, p. 386 Wilson, David – Palæmon’s Creed Reviewed &amp; Examined: wherein Several Gross &amp; Dangerous Errors, Advanced by the Author of the Letters on Theron &amp; Aspasio, are Detected &amp; Refuted; &amp; the Protestant Doctrine Concerning the Covenant of Works &amp; the Covenant of Grace, Conviction of Sin, Regeneration, Faith, Justification, Inherent Grace, etc., Vindicated from the Cavils and Exceptions of that Author, and shown to be entirely conformable to the Apostolic Doctrine concerning the several points afore-mentioned, vol. 1, 2 (London, 1762) Wikipedia: “Theron and Aspasio, or a series of Letters upon the most important and interesting Subjects [by James Hervey, 1724-58, an Anglican clergyman], which appeared in 1755, and was equally well received, called forth some adverse criticism even from Calvinists, on account of tendencies which were considered to lead to antinomianism, and was strongly objected to by Wesley in his Preservative against unsettled Notions in Religion. Besides carrying into England the theological disputes to which the Marrow of Modern Divinity had given rise in Scotland (the Marrow Controversy), it also led to what is known as the Sandemanian controversy as to the nature of saving faith.</p></blockquote>

<blockquote><p>…In Hos. 6:7 we read: “But they like Adam have transgressed the covenant.” Attempts have been made to discredit this reading. Some have suggested the reading “at Adam,” which would imply that some well-known transgression occurred at a place called Adam. But the preposition forbids this rendering. Moreover, the Bible makes no mention whatever of such a well-known historical transgression at Adam. The Authorized Version renders “like men,” which would then mean, in human fashion. To this it may be objected that there is no plural in the original, and that such a statement would be rather inane, since man could hardly transgress in any other way. The rendering “like Adam” is after all the best. It is favored by the parallel passage in Job 31:33; and is adopted by the American Revised Version.</p></blockquote>

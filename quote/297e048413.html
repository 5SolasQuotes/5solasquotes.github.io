<blockquote><p>Basle ought to have sent [Wollebius] to that synod [of Dort] instead of the two mediocre delegates she sent, as he would have ranked up close to Diodati in ability.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-221fa855fe" data-kw="">
<blockquote><p>There are many cases in which local separation may be lawful: First, as if our callings justly remove us to another place or country. Secondly, if our spiritual advantage bind us to remove to a better minister and more suitable society when we are free. Thirdly, if our lawful pastors be turned out of the place, and we follow them, and turn away but from usurpers. Fourthly, if the pastors turn heretics or wolves. Fifthly, if the public good of the churches require my removal. Sixthly, if any sin be imposed on me, and I be refused by the Church unless I will commit it. In these and some other such cases a remove is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1 | Direction 59</cite>, p. 238</span></figcaption>

<blockquote><p>…a man may be a schismatic, forsaking communion with a true Church, and yet not be an heretic, in as much as he may rightly believe all the articles of the Faith. … Other divisions there are which are with separation, when men shall withdraw themselves from fellowship and communion with a true Church, so breaking themselves off from the body. And this (says our judicious [William] Ames)¹ by way of special appropriation, deserves most rightly to be called by the name of ‘schism’: in as much as heresy in this division is perfected and brought to a head, as also most clearly manifested, and declared, viz. in refusing of due Church-communion. ¹ Quia autem haec scissio maxime perficitur et apparet in debita communione Ecclesiastica recusanda, idcirco illa separatio per appropriationem singularium recte vocatur Schisma [But because this division is chiefly brought about and becomes evident in the refusing of due ecclesiastical communion, therefore that separation, by the appropriating of things to oneself, is rightly called ‘schism’]. Ames, Cases of Conscience on Schism Which refusal may be either partial, or total. Partial, in some particular acts and exercises, wherein a man cannot (or at least conceives he cannot) communicate without sin. Total, a rejecting, and renouncing of all religious communion. This latter all divines look upon as a schism, and that most properly so called. Which (again) may be either from the Church, or from a Church. From the Church catholic, the whole Church. That was properly Donatism (the direct error of the Seekers at this day): Or from a particular Church; and that is properly Separatism.</p></blockquote>

</figure><figure class="quote" id="q-162e363767" data-kw="">
<blockquote><p>And I exhort you to do nothing out of strife, but according to the doctrine of Christ. When I heard some saying, If I do not find it in the ancient Scriptures, I will not believe the Gospel; on my saying to them, ‘It is written,’ they answered me, ‘That remains to be proved.’ But to me Jesus Christ is in the place of all that is ancient: His cross, and death, and resurrection, and the faith which is by Him, are undefiled monuments of antiquity;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ignatius.html">Ignatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle of Ignatius to the Philadelphians, ch. 8 in ANF 1.84</cite></span></figcaption>

</figure><figure class="quote" id="q-0f21606d93" data-kw="">
<blockquote><p>If anyone comes to you and does not bring this doctrine, do not receive him into your house, nor say greeting to him,” etc. Since therefore from apostolic tradition it is clear that certain persons who differ in doctrine are altogether to be rejected and avoided, and again that certain others are to be received and held in the place of brothers, one must consider what diversity of doctrine breaks the Christian bond of peace, and what does not. This Paul, as in all things, teaches excellently. For in the First [Letter] to Timothy, chapter 1, after he had commanded him to warn certain persons not to follow a different doctrine which gave no edification [1 Tim. 1:3-4], he immediately added: “Now the end of the commandment is love from a pure heart, a good conscience, and unfeigned faith.” [v. 5] By which he taught plainly enough wherein the approved and genuine doctrine of our religion is to be placed and recognized—namely, in love that is alien to fraud in conscience and to deceit in faith, which love is altogether inimitable by all destitute of the Spirit of Christ. Therefore, whoever displays this love in such manner that his life does not disprove it is clearly to be regarded as a member of Christ, whatever errors he may be subject to, and is worthy of being cherished by the duties of Christian brotherhood. Thus in chapter 6, after he had set forth the doctrines of faith in Christ along with the commands of genuine love, he wrote in this manner: “These things teach and exhort…” [v. 2] How then will these people justify their judgment before Him who commanded these things through Paul—these people who dare immediately to hand over to Satan, and, as far as lies in them, to cast out of the kingdom of God, men who are truly good, who knowingly resist no sound doctrine, who listen with ready minds to every admonition in which the Spirit of God breathes and his Word is expressed—men who reject only a few things, and these of no great moment, which they cannot yet recognize as having proceeded from God? . Peter Martyr Vermigli Latin On 1 Corinthians, ch. 10, verse 11 It is a pitiable thing that, although we have so many clear and open statements in the sacred writings concerning faith, hope, love, and the duties of the other virtues—things in which there is nothing obscure—we altogether leave these neglected, and wish, with such great superstition, to pursue matters which are uncertain and contribute less to salvation. This the Devil is intent upon: that men should labor strenuously in endless and useless questions, while casting aside those things which are necessary to be kept. . King James I of Great Britain as reported by Isaac Casaubon, Epistle 710, to Cardinal Perron Latin But the King judges it to be most truly written, in the explanation of [the Greek phrase] “the things simply necessary,” that the number of things absolutely necessary for salvation is not great. Therefore His Majesty considers that there will be no shorter way to enter into concord than if the necessary things are carefully separated from the non-necessary, and that every effort be expended so that agreement may be reached concerning the necessary; in the non-necessary, room should be given to Christian liberty. The King calls those things “simply necessary” which either the Word of God expressly commands to be believed or done, or which the ancient Church drew out from the Word of God by necessary consequence. But the things which, apart from the Word of God, have been received into the use of the Church by human institution—although piously and prudently, according to the circumstances of the time—His Majesty considers can be changed, softened, or antiquated; and what Pius II said concerning clerical celibacy, that although it had once been rightly enacted, it would now be better abolished, the King believes that this, in general, may be applied to most ecclesiastical observances introduced apart from the Word of God. If, for deciding the controversies of the present day, this distinction were applied, and divine law were candidly separated from positive law, it appears that there would not be, among pious and moderate men, a long or bitter contention concerning those things which are absolutely necessary. For these things are few, as we just said, and are approved almost equally by all who claim to be called Christians. And the Most Serene King considers this distinction to be of such great weight for diminishing the controversies which today so greatly trouble the Church of God, that he judges it the duty of all who are devoted to peace to explain, teach, and press this distinction with the utmost diligence. . Francis Junius Latin Eirenicum, pt. 2, on Psalm 133 Therefore I can hardly express my astonishment at the audacity—or rather the madness—of those men who esteem so lightly this right of kinship, established by God Himself, founded upon divine power and constituted by means that are altogether divine, that they judge others not to be their brothers; or even if, in general terms, they acknowledge that we are brothers to one another, yet when it comes to particulars—this or that individual, this or that church—they think that such a person or such a church has nothing at all in common with them in respect of fellowship and brotherhood. But now—good God—what do I hear? A man cannot abolish the obligation of nature; nor can one man, by any private or individual act of his own, remove a human bond of kinship. And shall that bond which the divine institution of grace has established be dissolved at the will of man? O pitiable madness! Whoever allows himself to be carried away into such a state must, of necessity, already have torn himself away from God and from Christ before he can, even in thought, tear another away. For who hates his own flesh? What member devotes its efforts to mutilating its own body? He is no longer of the body of Christ who plans to cut off a member of Christ. And yet this disease (if I may speak so) is epidemic in our age: in which we are, nearly all of us, most daring in noticing, weighing, judging, condemning and exploding the deeds of our brethren, and in insolently deposing them; nor do we hesitate to assail men, churches, whole regions and authorities appointed by God with curses and anathemas, as though by some sovereign right—merely because they do not agree with us in all things, although they hold the mind of Christ. Our union remains, my brother, it remains; but the estrangement is yours (for which I feel pity). If you are willing to estrange yourself from me, you cannot avoid first estranging yourself from Christ, in whom we are brothers. I neither will nor can do this; for Christ has joined me to Himself as a brother, and has made me a brother to you. If you break the bond of brotherhood, I shall knit it again; if you unsew it, I shall labor to mend it; if you overturn it, I shall raise it anew; if you deny it, Christ affirms it—and I with Christ. If you will not listen, yet good men hear, and the Lord hears, before whom I grieve from the heart over your powerlessness. Led by mercy, I shall bear whatever I cannot cure; but in bearing it, I shall carefully maintain these two things: first, that I steadfastly await from the Lord the healing of this wretched infirmity of yours; second, that I myself watch for just opportunities to assist you in love and to lift you up again, if perchance God may at some time be pleased to use this my endeavor for your salvation. For why should we not bear with those who are disturbed in mind—even in matters of religion—just as readily as we bear with those whom anger, hatred or other such passions have driven out of the state of a sound mind? If such things arise among brothers, they are nonetheless brothers, and do not cease to be such. I shall therefore act unjustly if, because you deny that you are my brother, or deny the duty of a brother, I fall into the same fault. I am unwilling to heap my own wrongdoing upon your folly; but whatever wisdom I have received from the Lord, that I intend to preserve unimpaired, and by duty to procure your restoration—or at least, if nothing else, to testify before God and men to the obligation which is mine. What then do we suppose, poor wretches that we are? What do we imagine, when with such loftiness of brow we thrust one another out, as with a pitchfork, and apply a kind of censor’s rod indiscriminately to these and to those, as though we alone possessed the nose for judgment, or as though Christ had transferred to us this faculty, to be abused according to the caprice of our own spirits? Let such things indeed be done by the grooms of Satan; but it is not fitting for the sheep of Christ—least of all for pastors. Rather, let us yield to Christ, who most graciously admits both us and them into the communion of His body and Spirit. . David Pareus Latin Irenicum ch. 4 The first question will be: Which articles are fundamental, that is, in which heads of faith does the foundation of salvation truly consist? Here there must prudently be distinguished the articles of the catholic faith—which no Christian of adult age, whether learned or unlearned, may, without loss of salvation, either be ignorant of or fail to believe—from other questions that come into controversy among some theologians because of differing understandings of some particular passage of Scripture; and also from scholastic or ecclesiastical conclusions, the knowledge and assent of which, one way or the other, are indeed necessary for theologians for the sake of the scientific character of their theological profession, and for transmitting or defending a fuller knowledge of divine matters, but which can be unknown by Christians in general without danger to salvation. For most of these either do not touch fundamental articles directly, or not even indirectly; rather, they are such that they will not benefit those who know them, if they do not possess true faith in Christ, nor will they harm those who are ignorant of them, if they truly believe in Christ. For I would venture to affirm that the greater part of both the ancient heresies and the present dissensions in the Church has arisen, and still arises, chiefly from this: that councils, bishops, and doctors of the Church, without any distinction, have put forth whatever doctrines of the schools and whatever opinions of the chairs as articles of the catholic faith, and have imposed them upon consciences as to be believed with the same necessity for salvation; and that from every discrepancy in the interpretation of the Scriptures they have far too easily fashioned heresies or schisms. . ch. 29 A foundation, properly speaking, is that which is laid in the lowest place beneath for the support of a building, and without which the house cannot stand. Thus the foundation of our faith and salvation will be that which all Christians must strictly believe as necessary for salvation, and without faith in which none obtain salvation. This foundation, in one word, is Jesus Christ, according to the apostle, etc. But the foundation of the prophets and apostles is the sum of the doctrine of the prophets and apostles, etc. In the Church the “elements of the Christian faith,” containing the sum of the Law and the Gospel, are accustomed to be so called; and all these appear able to be reduced to four heads: The first head is the Decalogue, etc. The second is the Apostles’ Creed, etc. The third is the Lord’s Prayer, etc. The fourth, finally, is concerning the sacraments, etc. In these heads, in our judgment indeed—if one should speak popularly—the foundation of the Christian faith and salvation, taken in the widest sense, consists. For he who shall have held these by faith and shall have practiced them will undoubtedly be saved, although he may be ignorant of the remaining debates of the theologians… Yet in these very heads we have freely conceded that some distinction may exist. For some things are more or less necessary to salvation than others. . Georg Calixtus Latin Of the Judge of Theological Controversies, sect. 1 &amp; 3 Let it be far from us, therefore, to hate, avoid or abhor any Christian who has not ceased to be a Christian, who has not ceased to be a son of God, and therefore is our brother, and together with us a member of the body of Christ and a co-heir of eternal salvation. Far be it, I say, that we should abominate the fellowship of anyone whom Christ has received into communion. Far be it that to him to whom He will say, “Come, blessed of my Father,” we should say, “Depart, cursed Satan…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If anyone comes to you and does not bring this doctrine, do not receive him into your house, nor say greeting to him,” etc. Since therefore from apostolic tradition it is clear that certain persons who differ in doctrine are altogether to be rejected and avoided, and again that certain others are to be received and held in the place of brothers, one must consider what diversity of doctrine breaks the Christian bond of peace, and what does not. This Paul, as in all things, teaches excellently. For in the First [Letter] to Timothy, chapter 1, after he had commanded him to warn certain persons not to follow a different doctrine which gave no edification [1 Tim. 1:3-4], he immediately added: “Now the end of the commandment is love from a pure heart, a good conscience, and unfeigned faith.” [v. 5] By which he taught plainly enough wherein the approved and genuine doctrine of our religion is to be placed and recognized—namely, in love that is alien to fraud in conscience and to deceit in faith, which love is altogether inimitable by all destitute of the Spirit of Christ. Therefore, whoever displays this love in such manner that his life does not disprove it is clearly to be regarded as a member of Christ, whatever errors he may be subject to, and is worthy of being cherished by the duties of Christian brotherhood. Thus in chapter 6, after he had set forth the doctrines of faith in Christ along with the commands of genuine love, he wrote in this manner: “These things teach and exhort…” [v. 2] How then will these people justify their judgment before Him who commanded these things through Paul—these people who dare immediately to hand over to Satan, and, as far as lies in them, to cast out of the kingdom of God, men who are truly good, who knowingly resist no sound doctrine, who listen with ready minds to every admonition in which the Spirit of God breathes and his Word is expressed—men who reject only a few things, and these of no great moment, which they cannot yet recognize as having proceeded from God? . Peter Martyr Vermigli Latin On 1 Corinthians, ch. 10, verse 11 It is a pitiable thing that, although we have so many clear and open statements in the sacred writings concerning faith, hope, love, and the duties of the other virtues—things in which there is nothing obscure—we altogether leave these neglected, and wish, with such great superstition, to pursue matters which are uncertain and contribute less to salvation. This the Devil is intent upon: that men should labor strenuously in endless and useless questions, while casting aside those things which are necessary to be kept. . King James I of Great Britain as reported by Isaac Casaubon, Epistle 710, to Cardinal Perron Latin But the King judges it to be most truly written, in the explanation of [the Greek phrase] “the things simply necessary,” that the number of things absolutely necessary for salvation is not great. Therefore His Majesty considers that there will be no shorter way to enter into concord than if the necessary things are carefully separated from the non-necessary, and that every effort be expended so that agreement may be reached concerning the necessary; in the non-necessary, room should be given to Christian liberty. The King calls those things “simply necessary” which either the Word of God expressly commands to be believed or done, or which the ancient Church drew out from the Word of God by necessary consequence. But the things which, apart from the Word of God, have been received into the use of the Church by human institution—although piously and prudently, according to the circumstances of the time—His Majesty considers can be changed, softened, or antiquated; and what Pius II said concerning clerical celibacy, that although it had once been rightly enacted, it would now be better abolished, the King believes that this, in general, may be applied to most ecclesiastical observances introduced apart from the Word of God. If, for deciding the controversies of the present day, this distinction were applied, and divine law were candidly separated from positive law, it appears that there would not be, among pious and moderate men, a long or bitter contention concerning those things which are absolutely necessary. For these things are few, as we just said, and are approved almost equally by all who claim to be called Christians. And the Most Serene King considers this distinction to be of such great weight for diminishing the controversies which today so greatly trouble the Church of God, that he judges it the duty of all who are devoted to peace to explain, teach, and press this distinction with the utmost diligence. . Francis Junius Latin Eirenicum, pt. 2, on Psalm 133 Therefore I can hardly express my astonishment at the audacity—or rather the madness—of those men who esteem so lightly this right of kinship, established by God Himself, founded upon divine power and constituted by means that are altogether divine, that they judge others not to be their brothers; or even if, in general terms, they acknowledge that we are brothers to one another, yet when it comes to particulars—this or that individual, this or that church—they think that such a person or such a church has nothing at all in common with them in respect of fellowship and brotherhood. But now—good God—what do I hear? A man cannot abolish the obligation of nature; nor can one man, by any private or individual act of his own, remove a human bond of kinship. And shall that bond which the divine institution of grace has established be dissolved at the will of man? O pitiable madness! Whoever allows himself to be carried away into such a state must, of necessity, already have torn himself away from God and from Christ before he can, even in thought, tear another away. For who hates his own flesh? What member devotes its efforts to mutilating its own body? He is no longer of the body of Christ who plans to cut off a member of Christ. And yet this disease (if I may speak so) is epidemic in our age: in which we are, nearly all of us, most daring in noticing, weighing, judging, condemning and exploding the deeds of our brethren, and in insolently deposing them; nor do we hesitate to assail men, churches, whole regions and authorities appointed by God with curses and anathemas, as though by some sovereign right—merely because they do not agree with us in all things, although they hold the mind of Christ. Our union remains, my brother, it remains; but the estrangement is yours (for which I feel pity). If you are willing to estrange yourself from me, you cannot avoid first estranging yourself from Christ, in whom we are brothers. I neither will nor can do this; for Christ has joined me to Himself as a brother, and has made me a brother to you. If you break the bond of brotherhood, I shall knit it again; if you unsew it, I shall labor to mend it; if you overturn it, I shall raise it anew; if you deny it, Christ affirms it—and I with Christ. If you will not listen, yet good men hear, and the Lord hears, before whom I grieve from the heart over your powerlessness. Led by mercy, I shall bear whatever I cannot cure; but in bearing it, I shall carefully maintain these two things: first, that I steadfastly await from the Lord the healing of this wretched infirmity of yours; second, that I myself watch for just opportunities to assist you in love and to lift you up again, if perchance God may at some time be pleased to use this my endeavor for your salvation. For why should we not bear with those who are disturbed in mind—even in matters of religion—just as readily as we bear with those whom anger, hatred or other such passions have driven out of the state of a sound mind? If such things arise among brothers, they are nonetheless brothers, and do not cease to be such. I shall therefore act unjustly if, because you deny that you are my brother, or deny the duty of a brother, I fall into the same fault. I am unwilling to heap my own wrongdoing upon your folly; but whatever wisdom I have received from the Lord, that I intend to preserve unimpaired, and by duty to procure your restoration—or at least, if nothing else, to testify before God and men to the obligation which is mine. What then do we suppose, poor wretches that we are? What do we imagine, when with such loftiness of brow we thrust one another out, as with a pitchfork, and apply a kind of censor’s rod indiscriminately to these and to those, as though we alone possessed the nose for judgment, or as though Christ had transferred to us this faculty, to be abused according to the caprice of our own spirits? Let such things indeed be done by the grooms of Satan; but it is not fitting for the sheep of Christ—least of all for pastors. Rather, let us yield to Christ, who most graciously admits both us and them into the communion of His body and Spirit. . David Pareus Latin Irenicum ch. 4 The first question will be: Which articles are fundamental, that is, in which heads of faith does the foundation of salvation truly consist? Here there must prudently be distinguished the articles of the catholic faith—which no Christian of adult age, whether learned or unlearned, may, without loss of salvation, either be ignorant of or fail to believe—from other questions that come into controversy among some theologians because of differing understandings of some particular passage of Scripture; and also from scholastic or ecclesiastical conclusions, the knowledge and assent of which, one way or the other, are indeed necessary for theologians for the sake of the scientific character of their theological profession, and for transmitting or defending a fuller knowledge of divine matters, but which can be unknown by Christians in general without danger to salvation. For most of these either do not touch fundamental articles directly, or not even indirectly; rather, they are such that they will not benefit those who k t+agreement+may+be+reached+concerning+the+necessary%3B+in+the+non-necessary%2C+room+should+be+given+to+Christian+liberty.+The+King+calls+those+things+%E2%80%9Csimply+necessary%E2%80%9D+which+either+the+Word+of+God+expressly+commands+to+be+believed+or+done%2C+or+which+the+ancient+Church+drew+out+from+the+Word+of+God+by+necessary+consequence.+But+the+things+which%2C+apart+from+the+Word+of+God%2C+have+been+received+into+the+use+of+the+Church+by+human+institution%E2%80%94although+piously+and+prudently%2C+according+to+the+circumstances+of+the+time%E2%80%94His+Majesty+considers+can+be+changed%2C+softened%2C+or+antiquated%3B+and+what+Pius+II+said+concerning+clerical+celibacy%2C+that+although+it+had+once+been+rightly+enacted%2C+it+would+now+be+better+abolished%2C+the+King+believes+that+this%2C+in+general%2C+may+be+applied+to+most+ecclesiastical+observances+introduced+apart+from+the+Word+of+God.+If%2C+for+deciding+the+controversies+of+the+present+day%2C+this+distinction+were+applied%2C+and+divine+law+were+candidly+separated+from+positive+law%2C+it+appears+that+there+would+not+be%2C+among+pious+and+moderate+men%2C+a+long+or+bitter+contention+concerning+those+things+which+are+absolutely+necessary.+For+these+things+are+few%2C+as+we+just+said%2C+and+are+approved+almost+equally+by+all+who+claim+to+be+called+Christians.+And+the+Most+Serene+King+considers+this+distinction+to+be+of+such+great+weight+for+diminishing+the+controversies+which+today+so+greatly+trouble+the+Church+of+God%2C+that+he+judges+it+the+duty+of+all+who+are+devoted+to+peace+to+explain%2C+teach%2C+and+press+this+distinction+with+the+utmost+diligence.+.+Francis+Junius+Latin+Eirenicum%2C+pt.+2%2C+on+Psalm+133+Therefore+I+can+hardly+express+my+astonishment+at+the+audacity%E2%80%94or+rather+the+madness%E2%80%94of+those+men+who+esteem+so+lightly+this+right+of+kinship%2C+established+by+God+Himself%2C+founded+upon+divine+power+and+constituted+by+means+that+are+altogether+divine%2C+that+they+judge+others+not+to+be+their+bro t%3B+if+you+overturn+it%2C+I+shall+raise+it+anew%3B+if+you+deny+it%2C+Christ+affirms+it%E2%80%94and+I+with+Christ.+If+you+will+not+listen%2C+yet+good+men+hear%2C+and+the+Lord+hears%2C+before+whom+I+grieve+from+the+heart+over+your+powerlessness.+Led+by+mercy%2C+I+shall+bear+whatever+I+cannot+cure%3B+but+in+bearing+it%2C+I+shall+carefully+maintain+these+two+things%3A+first%2C+that+I+steadfastly+await+from+the+Lord+the+healing+of+this+wretched+infirmity+of+yours%3B+second%2C+that+I+myself+watch+for+just+opportunities+to+assist+you+in+love+and+to+lift+you+up+again%2C+if+perchance+God+may+at+some+time+be+pleased+to+use+this+my+endeavor+for+your+salvation.+For+why+should+we+not+bear+with+those+who+are+disturbed+in+mind%E2%80%94even+in+matters+of+religion%E2%80%94just+as+readily+as+we+bear+with+those+whom+anger%2C+hatred+or+other+such+passions+have+driven+out+of+the+state+of+a+sound+mind%3F+If+such+things+arise+among+brothers%2C+they+are+nonetheless+brothers%2C+and+do+not+cease+to+be+such.+I+shall+therefore+act+unjustly+if%2C+because+you+deny+that+you+are+my+brother%2C+or+deny+the+duty+of+a+brother%2C+I+fall+into+the+same+fault.+I+am+unwilling+to+heap+my+own+wrongdoing+upon+your+folly%3B+but+whatever+wisdom+I+have+received+from+the+Lord%2C+that+I+intend+to+preserve+unimpaired%2C+and+by+duty+to+procure+your+restoration%E2%80%94or+at+least%2C+if+nothing+else%2C+to+testify+before+God+and+men+to+the+obligation+which+is+mine.+What+then+do+we+suppose%2C+poor+wretches+that+we+are%3F+What+do+we+imagine%2C+when+with+such+loftiness+of+brow+we+thrust+one+another+out%2C+as+with+a+pitchfork%2C+and+apply+a+kind+of+censor%E2%80%99s+rod+indiscriminately+to+these+and+to+those%2C+as+though+we+alone+possessed+the+nose+for+judgment%2C+or+as+though+Christ+had+transferred+to+us+this+faculty%2C+to+be+abused+according+to+the+caprice+of+our+own+spirits%3F+Let+such+things+indeed+be+done+by+the+grooms+of+Satan%3B+but+it+is+not+fitting+for+the+sheep+of+Christ%E2%80%94least+of+all+for+pastors.+Rather%2C+let+us+yield+to+Christ%2C+who+most+graciously+admits+both+us+and+them+into+the+communion+of+His+body+and+Spirit.+.+David+Pareus+Latin+Irenicum+ch.+4+The+first+question+will+be%3A+Which+articles+are+fundamental%2C+that+is%2C+in+which+heads+of+faith+does+the+foundation+of+salvation+truly+consist%3F+Here+there+must+prudently+be+distinguished+the+articles+of+the+catholic+faith%E2%80%94which+no+Christian+of+adult+age%2C+whether+learned+or+unlearned%2C+may%2C+without+loss+of+salvation%2C+either+be+ignorant+of+or+fail+to+believe%E2%80%94from+other+questions+that+come+into+controversy+among+some+theologians+because+of+differing+understandings+of+some+particular+passage+of+Scripture%3B+and+also+from+scholastic+or+ecclesiastical+conclusions%2C+the+knowledge+and+assent+of+which%2C+one+way+or+the+other%2C+are+indeed+necessary+for+theologians+for+the+sake+of+the+scientific+character+of+their+theological+profession%2C+and+for+transmitting+or+defending+a+fuller+knowledge+of+divine+matters%2C+but+which+can+be+unknown+by+Christians+in+general+without+danger+to+salvation.+For+most+of+these+either+do+not+touch+fundamental+articles+directly%2C+or+not+even+indirectly%3B+rather%2C+they+are+such+that+they+will+not+benefit+those+who+know+them%2C+if+they+do+not+possess+true+faith+in+Christ%2C+nor+will+they+harm+those+who+are+ignorant+of+them%2C+if+they+truly+believe+in+Christ.+For+I+would+venture+to+affirm+that+the+greater+part+of+both+the+ancient+heresies+and+the+present+dissensions+in+the+Church+has+arisen%2C+and+still+arises%2C+chiefly+from+this%3A+that+councils%2C+bishops%2C+and+doctors+of+the+Church%2C+without+any+distinction%2C+have+put+forth+whatever+doctrines+of+the+schools+and+whatever+opinions+of+the+chairs+as+articles+of+the+catholic+faith%2C+and+have+imposed+them+upon+consciences+as+to+be+believed+with+the+same+necessity+for+salvation%3B+and+that+from+every+discrepancy+in+the+interpretation+of+the+Scriptures+they+have+far+too+easily+fashioned+heresies+or+schisms.+.+ch.+29+A+foundation%2C+properly+speaking%2C+is+that+which+is+laid+in+the+lowest+place+beneath+for+the+support+of+a+building%2C+and+without+which+the+house+cannot+stand.+Thus+the+foundation+of+our+faith+and+salvation+will+be+that+which+all+Christians+must+strictly+believe+as+necessary+for+salvation%2C+and+without+faith+in+which+none+obtain+salvation.+This+foundation%2C+in+one+word%2C+is+Jesus+Christ%2C+according+to+the+apostle%2C+etc.+But+the+foundation+of+the+prophets+and+apostles+is+the+sum+of+the+doctrine+of+the+prophets+and+apostles%2C+etc.+In+the+Church+the+%E2%80%9Celements+of+the+Christian+faith%2C%E2%80%9D+containing+the+sum+of+the+Law+and+the+Gospel%2C+are+accustomed+to+be+so+called%3B+and+all+these+appear+able+to+be+reduced+to+four+heads%3A+The+first+head+is+the+Decalogue%2C+etc.+The+second+is+the+Apostles%E2%80%99+Creed%2C+etc.+The+third+is+the+Lord%E2%80%99s+Prayer%2C+etc.+The+fourth%2C+finally%2C+is+concerning+the+sacraments%2C+etc.+In+these+heads%2C+in+our+judgment+indeed%E2%80%94if+one+should+speak+popularly%E2%80%94the+foundation+of+the+Christian+faith+and+salvation%2C+taken+in+the+widest+sense%2C+consists.+For+he+who+shall+have+held+these+by+faith+and+shall+have+practiced+them+will+undoubtedly+be+saved%2C+although+he+may+be+ignorant+of+the+remaining+debates+of+the+theologians%E2%80%A6+Yet+in+these+very+heads+we+have+freely+conceded+that+some+distinction+may+exist.+For+some+things+are+more+or+less+necessary+to+salvation+than+others.+.+Georg+Calixtus+Latin+Of+the+Judge+of+Theological+Controversies%2C+sect.+1+%26+3+Let+it+be+far+from+us%2C+therefore%2C+to+hate%2C+avoid+or+abhor+any+Christian+who+has+not+ceased+to+be+a+Christian%2C+who+has+not+ceased+to+be+a+son+of+God%2C+and+therefore+is+our+brother%2C+and+together+with+us+a+member+of+the+body+of+Christ+and+a+co-heir+of+eternal+salvation.+Far+be+it%2C+I+say%2C+that+we+should+abominate+the+fellowship+of+anyone+whom+Christ+has+received+into+communion.+Far+be+it+that+to+him+to+whom+He+will+say%2C+%E2%80%9CCome%2C+bl

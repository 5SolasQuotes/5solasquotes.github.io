<main class="wrap"><figure class="quote" id="q-1896ed22ae" data-kw="">
<blockquote><p>When preaching on 1 Peter 4:11, the English Reformer, John Jewel reminded his hearers of the early Christians’ emphasis on practical godliness:

That godliness is placed, not in outward shew and titles, but in soundness of life, and innocency of manners. That it is an ill thing with mouth and tongue only to worship GOD, and to give our mind and soul to (worship) the Devil, and to disagree from Idolaters, not in life and manners, but in words and profession (only.)

And because they had departed from the most ancient Ordinances and laws of their forefathers, and that they being but a few had stirred all kind of men against them, he warneth them that they yet would in all kind of duties practise charity among themselves, one toward another, lest they should be deluded at any time by any dissension of minds or studies.

That this is only the token of Jesus Christ, whereby the bondslaves of the Devil may be known from the Children of GOD. That so it shall come to pass shortly, that all the whole world shall embrace the Gospel and the heavenly doctrine, and that the enemies and the haters of the cross of Christ, whom godliness could not move, may through shame be overcome, and return to themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewell.html">John Jewell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon made in Latin in Oxford in the reign of King Edward the sixth, by the learned and godly father John Jewel, late Bishop of Salisbury, and translated into English, by R.V. Dedicated unto the Bishop of London, as appeareth in the Commentary of Ma. Caluine, upon the Galatians, in English</cite>, (London, [1581]), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ad9458481a" data-kw="">
<blockquote><p>It is necessary that theological topics be blended in our discourses on the gospel with the rules of practical godliness; that the doctrines should lead to the precepts, and that precepts should always flow from the doctrines, that the former may enlighten, and that the latter may stir up, and so quicken the heart, or to speak more correctly, these two must be so commingled as every where to pervade our preaching.

As the precious stones in the breastplate of the great high priest were distinct and separate, and so arranged that the one could easily be distinguished from the other, but nevertheless, as they all at once, threw out one common light, in which their individual lustre and brilliancy were confounded, so in the sermons of the ministers of Jesus Christ, the subjects which are introduced, however different, and however arranged in the order which distinguishes them, ought to constitute one blaze of light in which the truth of the doctrines is so completely mixed with the holiness of the virtues, that they may come into view at the same time, and that there may be found at one point the shining of the Urim and Thummim, (i.e.,) the splendour of instruction with the soundness of good regulations.

As the lightning and the thunder accompany each other in such a way that you cannot tell which goes first, the eye supposing the lightning, and reason, on the contrary, (in the opinion of many) the thunder, so ought it to be with the doctrines and the precepts in sermons, — they should be so arranged that one hardly knows to which of the two to give his attention, that when you notice them, almost at the same time, and in the same instant, if possible, the eye may be struck with the lightning of the one, and the ear with the noise and thunder of the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-bosc.html">Pierre Du Bosc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protestantism. Being a Series of Discourses on a Portion of the Epistle to the Ephesians</cite>, trans. J. B. Law (1699; London: A. Hall, Virtue, &amp; Co., 1853), pp 275-77.</span></figcaption>

</figure><figure class="quote" id="q-73ce228bfb" data-kw="">
<blockquote><p>It is one of the greatest objections against the suppressing… of… errors and schisms, ‘O,’ say they, ‘this is a persecuting of those that are godly; this is a wound to piety, and the power of godliness.’ I do not deny but there may be, and is, true piety in many who are somewhat infected with the leaven of false doctrine, and live in some erroneous opinion… Those that are truly godly may in diverse things differ in opinion. Every error is not inconsistent with holiness, yet every error doth pro tanto [by so much], and proportionably retard, hinder, and prejudge holiness; and although the devil sow his tares among Christ’s wheat (I mean in the same persons as well as in the same church), yet who will say that a field of wheat is nothing the worse for the tares?… And this I hold as a good rule in practical divinity… so error of judgment, if continued in, doth not only hinder growing, but makes a dangerous decreasing and falling short in true piety… It is to be observed that sometimes the Scripture speaks of an error of the judgment concerning the faith as a fountain and cause of ungodliness, profaneness… 2 Tim. 2:16-19; Gal. 5:4; 2 Jn. 9; as contrariwise, there is a light and knowledge which preserves from sin and ungodliness, and leads the soul in ways of holiness and obedience, Ps. 9:10; 119:33-34; Jn. 17:17. If the knowledge of God, of his Christ, and of his Word, and will, and name and statutes, preserve us from sin, and lead us in the ways of obedience, then, by the rule of contraries, error of judgment in these things will ensnare us in sin and wickedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ch. 12, ‘Whether a Sound Heart and an Unsound Head can Consist Together? and Vice Versa; or, Whether Truth and Holiness be not Insepararable Companions?’ in Works, vol. 2</span></figcaption>

<blockquote><p>There are some exercises of Religion which stand only in a form of godliness, when men draw near with their mouth and honour God with their lips, and bestow a little bodily exercise and attendance upon him, when in the mean time their hearts are far from him, running after other objects, Isaiah 29.13. Ezek. 33.31. Other duties there are which are more spiritual, and wherein the life and power of godliness doth consist. Among these, that of heavenly Meditation is one, when, (as the Apostle saith of the blessed Angels, 1 Pet. 1.12.) the heart desires to look into the mysteries of salvation.

Ever since the fall of Adam, sinful men have had the disposition of Adam, to fly away, and to hide from the presence of the Lord. Natural men are without God in the world, he is not in all their thoughts, they could be well enough content to have him cease from before them, Esay 30.11. He is every where else to be found, only shut out of the hearts of wicked men.

The heart never willingly fixeth on God, till he be the Treasure of it; for where a man’s treasure is, there will his heart be also. It cannot easily Meditate, but where it doth delight, Psalm 119.97. Love is the weight of the soul, it readily moves to the object which it loves. Mary will not away from the empty Sepulchre, where a little before her Lord had lien. Every good man is of David’s mind, Psalm 16.8. to set the Lord always before him, that he may be in his fear all the day long.

There is nothing of a more unstable and roving temper than the mind of man. Some have prescribed the study of Mathematics to fix the volatile agility thereof; but certainly the more serious, the more settled the soul is. Nothing therefore will so balance and compose it, as true holiness, which doth of all other things make it the most serious, the most willing to acquaint it self with God, that it may be at peace, Job 22.21. He is the Rest of the soul. Inquietum est cor nostrum donec requiescat in te. The more it knows of him, the more desirous it is to stay with him that it may know more. The more it tasteth of his favour, the more it longeth after his glory, as Moses did, Exod. 33.17, 18. What the Philosopher saith of all knowledge, is indeed true only of the knowledge of God and Christ, that it is quies intellectus. And therefore our Saviour calleth it eternal life, John 17.3. In which alone the soul doth Rest.

Now one excellent means of fixing the heart on God, is meditation, whereby a man calls together All that is within him to bless his name, Psalm 103.1. Meditation is the wing of the soul which carrieth the affections thereof to things above; by this, as Moses, it goeth up to the top of Pisgah to take a view of the promised land. It is as Clemens Alexandrinus saith of prayer, a conversing with God; as Chrysostom saith of faith, so may we of Meditation, It makes God, and Christ, and precepts, and promises ours, by giving us a fuller possession of them. Hereby we hold fast the things which we have learned, we awaken our faith, inflame our love, strengthen our hope, revive our desires, increase our joys in God; we furnish our hearts, and fill our mouths with materials of prayer, we loosen our affections from the world, we praeacquaint our selves with those glories which we yet but hope for, and get some knowledge of that love of Christ which passeth knowledge.

Meditation is the palate of the soul whereby we taste the goodness of God; the eye of the soul whereby we view the beauties of holiness; … whereby our spiritual senses are exercised, Acts 24.16. Heb. 5.14. it is the key to the wine-cellar, to the banqueting house, to the garden of spices, which letteth us in unto him whom our soul loveth; it is the arm whereby we embrace the promises at a distance, and bring Christ and our souls together.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“There are some exercises of Religion which stand only in a form of godliness, when men draw near with their mouth and honour God with their lips, and bestow a little bodily exercise and attendance upon him, when in the mean time their hearts are far from him, running after other objects, Isaiah 29.13. Ezek. 33.31. Other duties there are which are more spiritual, and wherein the life and power of godliness doth consist. Among these, that of heavenly Meditation is one, when, (as the Apostle saith of the blessed Angels, 1 Pet. 1.12.) the heart desires to look into the mysteries of salvation.

Ever since the fall of Adam, sinful men have had the disposition of Adam, to fly away, and to hide from the presence of the Lord. Natural men are without God in the world, he is not in all their thoughts, they could be well enough content to have him cease from before them, Esay 30.11. He is every where else to be found, only shut out of the hearts of wicked men.

The heart never willingly fixeth on God, till he be the Treasure of it; for where a man’s treasure is, there will his heart be also. It cannot easily Meditate, but where it doth delight, Psalm 119.97. Love is the weight of the soul, it readily moves to the object which it loves. Mary will not away from the empty Sepulchre, where a little before her Lord had lien. Every good man is of David’s mind, Psalm 16.8. to set the Lord always before him, that he may be in his fear all the day long.

There is nothing of a more unstable and roving temper than the mind of man. Some have prescribed the study of Mathematics to fix the volatile agility thereof; but certainly the more serious, the more settled the soul is. Nothing therefore will so balance and compose it, as true holiness, which doth of all other things make it the most serious, the most willing to acquaint it self with God, that it may be at peace, Job 22.21. He is the Rest of the soul. Inquietum est cor nostrum donec requiescat in te. The more it knows of him, the more desirous it is to stay with him that it may know more. The more it tasteth of his favour, the more it longeth after his glory, as Moses did, Exod. 33.17, 18. What the Philosopher saith of all knowledge, is indeed true only of the knowledge of God and Christ, that it is quies intellectus. And therefore our Saviour calleth it eternal life, John 17.3. In which alone the soul doth Rest.

Now one excellent means of fixing the heart on God, is meditation, whereby a man calls together All that is within him to bless his name, Psalm 103.1. Meditation is the wing of the soul which carrieth the affections thereof to things above; by this, as Moses, it goeth up to the top of Pisgah to take a view of the promised land. It is as Clemens Alexandrinus saith of prayer, a conversing with God; as Chrysostom saith of faith, so may we of Meditation, It makes God, and Christ, and precepts, and promises ours, by giving us a fuller possession of them. Hereby we hold fast the things which we have learned, we awaken our faith, inflame our love, strengthen our hope, revive our desires, increase our joys in God; we furnish our hearts, and fill our mouths with materials of prayer, we loosen our affections from the world, we praeacquaint our selves with those glories which we yet but hope for, and get some knowledge of that love of Christ which passeth knowledge.

Meditation is the palate of the soul whereby we taste the goodness of God; the eye of the soul whereby we view the beauties of holiness; … whereby our spiritual senses are exercised, Acts 24.16. Heb. 5.14. it is the key to the wine-cellar, to the banqueting house, to the garden of spices, which letteth us in unto him whom our soul loveth; it is the arm whereby we embrace the promises at a distance, and bring Christ and our souls together.”

— Edward Reynolds, Epistle to the reader in Thomas Watson, The saint’s delight. To which is annexed a treatise of meditation">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+are+some+exercises+of+Religion+which+stand+only+in+a+form+of+godliness%2C+when+men+draw+near+with+their+mouth+and+honour+God+with+their+lips%2C+and+bestow+a+little+bodily+exercise+and+attendance+upon+him%2C+when+in+the+mean+time+their+hearts+are+far+from+him%2C+running+after+other+objects%2C+Isaiah+29.13.+Ezek.+33.31.+Other+duties+there+are+which+are+more+spiritual%2C+and+wherein+the+life+and+power+of+godliness+doth+consist.+Among+these%2C+that+of+heavenly+Meditation+is+one%2C+when%2C+%28as+the+Apostle+saith+of+the+blessed+Angels%2C+1+Pet.+1.12.%29+the+heart+desires+to+look+into+the+mysteries+of+salvation.%0A%0AEver+since+the+fall+of+Adam%2C+sinful+men+have+had+the+disposition+of+Adam%2C+to+fly+away%2C+and+to+hide+from+the+presence+of+the+Lord.+Natural+men+are+without+God+in+the+world%2C+he+is+not+in+all+their+thoughts%2C+they+could+be+well+enough+content+to+have+him+cease+from+before+them%2C+Esay+30.11.+He+is+every+where+else+to+be+found%2C+only+shut+out+of+the+hearts+of+wicked+men.%0A%0AThe+heart+never+willingly+fixeth+on+God%2C+till+he+be+the+Treasure+of+it%3B+for+where+a+man%E2%80%99s+treasure+is%2C+there+will+his+heart+be+also.+It+cannot+easily+Meditate%2C+but+where+it+doth+delight%2C+Psalm+119.97.+Love+is+the+weight+of+the+soul%2C+it+readily+moves+to+the+object+which+it+loves.+Mary+will+not+away+from+the+empty+Sepulchre%2C+where+a+little+before+her+Lord+had+lien.+Every+good+man+is+of+David%E2%80%99s+mind%2C+Psalm+16.8.+to+set+the+Lord+always+before+him%2C+that+he+may+be+in+his+fear+all+the+day+long.%0A%0AThere+is+nothing+of+a+more+unstable+and+roving+temper+than+the+mind+of+man.+Some+have+prescribed+the+study+of+Mathematics+to+fix+the+volatile+agility+thereof%3B+but+certainly+the+more+serious%2C+the+more+settled+the+soul+is.+Nothing+therefore+will+so+balan ing+house%2C+to+the+garden+of+spices%2C+which+letteth+us+in+unto+him+whom+our+soul+loveth%3B+it+is+the+arm+whereby+we+embrace+the+promises+at+a+distance%2C+and+bring+Christ+and+our+souls+together.%E2%80%9D%0A%0A%E2%80%94+Edward+Reynolds%2C+Epistle+to+the+reader+in+Thomas+Watson%2C+The+saint%E2%80%99s+delight.+To+which+is+annexed+a+treatise+of+meditation&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F37ffda7880.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/37ffda7880.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/09/10/edward-reynolds-on-meditation/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Another means to be used diligently for the promoting the life of faith, is, examination of our state and ways, according to the word of God; whether we be, at present, in a state of sin and wrath, or of grace and salvation; that, if we be in a state of sin we may know our sickness, and come to the great physician, while it is called to-day; and, if we be in a state of grace, we may know that we are of the truth, and assure our hearts before God, with the greater confidence, by the testimony of a good concience, 1 John 3:19, 21: that so our hearts may be more strongly comforted by faith, and established in every good work; and that, if our ways be evil, we may turn from them to the Lord our God, through Christ; “without whom none cometh to the Father,” Lam. 3:40; John 14:6. But your great care, in this work of self-examination, must be, to perform it in such a manner, that it may not hinder and destroy the life of faith, as it doth in many, instead of promoting it. Therefore, beware, lest you trust upon your self-examination rather than upon Christ; as some do, that think they have made their peace with God, merely because they have examined themselves upon their sick-bed, or before receiving the Lord’s supper, though they have found themselves stark naught, and do not depend on Christ, to make them better, but on their own deceitful purposes and resolutions. Think not that you must begin this work with doubting, whether God will extend mercy to you, and save you; and that you must leave this a question wholly under debate, until you have found out how to resolve it by self-examination. This is a common and very pernicious error in the very foundation of this work, which is hereby laid in the great sin of unbelief; which, as soon as it prevaileth, doth, by its great influence, dash and obscure all inward gracious qualifications, of peace, hope, joy, love to God and his people, before they be at all tried, whether they can give any good evidence of their salvation. And it makes people willing to think their own qualifications better than they are, lest they should fall into an utter despair of their salvation; and thus it wholly marreth the good work of self-examination, and maketh it destructive to, our souls; for “to them that are defiled and unbelieving, there is nothing pure,” Titus 1:15. You should rather begin the work with much assurance of faith, that though you may at present find your heart never so wicked and reprobate, (as many of God’s choicest servants have found) yet the door of mercy is open for you, and that God will certainly save you forever, if you put your trust in his grace through Christ.</p></blockquote>

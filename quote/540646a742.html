</figure><figure class="quote" id="q-de4c0b5201" data-kw="">
<blockquote><p>My assurances are not the Marvels of Merlin, nor yet the dark sentences of profane prophesies, but: 1. the plain truth of God’s Word; 2. the invincible justice of the everlasting God, and 3. the ordinary course of his punishments and plagues from the beginning are my assurance and grounds. God’s Word threatens destruction to all unobedient; his immutable justice must require the same. The ordinary punishments and plagues show examples.</p></blockquote>

</figure><figure class="quote" id="q-0f063b57d5" data-kw="">
<blockquote><p>9. Heaven and Hell and the Last Judgement are nowhere, but within a man, in a spiritual manner; Heaven is in this life. Antinomians, as Town and Saltmarsh hold that in this life we have as much of Heaven in full and complete possession as the glorified in Heaven. … 11. Under David George is the time of perfection, when all ordinances shall be useless, so Antinomians, ut supra. … 14. The Resurrection of the Dead, the blowing of the last trumpet, the shout of the archangel, the coming of Christ to judge all are to be taken in a spiritual sense of the doctrine and discipline of David George, as Hymenaeus and Phyletus said; see hereafter the parallel between Antinomians and Libertines; so said Libertines (Calvin Against the Libertines, ch. 22, p. 458). … 18. The body or flesh sinneth, but not the soul.</p></blockquote>

</figure><figure class="quote" id="q-c00aba9715" data-kw="">
<blockquote><p>Both Roman Catholicism and liberal modernism, though fiercely opposed to each other through much of their history, draw from the same poisoned well: the exaltation of man over the Word of God. One exalts church leaders, especially the pope, as its divinely reliable guide. The other exalts human reasoning and/or feelings as the supreme judge of religion.</p></blockquote>

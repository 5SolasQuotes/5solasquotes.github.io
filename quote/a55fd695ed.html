<blockquote><p>Our sovereign lord and lady the king and queen’s majesties and three estates of parliament, conceiving it to be their bound duty, after the great deliverance that God has lately wrought for this country and kingdom [in 1689], in the first place to settle and secure therein the true Protestant religion according to the truth of God’s word as it has of a long time been professed within this land. As also the government of Christ’s church within this nation agreeable to the word of God and most conducive to the advancement of true piety and godliness and the establishing of peace and tranquillity within this realm… Therefore their majesties, with advice and consent of the said three estates, do hereby revive, ratify and perpetually confirm all laws, statutes and acts of parliament made against popery and papists and for the maintenance and preservation of the true reformed Protestant religion and for the true church of Christ within this kingdom, in so far as they confirm the same, or are made in favour thereof. Likewise they, by this act, ratify and establish the Confession of Faith now read in their presence and voted and approved by them as the public and avowed confession of this church, containing the sum and substance of the doctrine of the reformed churches; which Confession of Faith is subjoined to this present act; as also, they do establish, ratify and confirm the presbyterian church government and discipline…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-parliament.html">Civil Parliament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Act of June 7</cite>, 1690, Act ratifying the Confession of Faith and settling presbyterian church government in The Records of the Parliaments of Scotland to 1707, eds. K.M. Brown et al. (St Andrews, 2007-2025) On the interpretation of this see Cooper, pp. 45-49 &amp; 50-51.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<blockquote><p>If the question, ‘What is the meaning of the words, ‘the system of doctrines taught in the Holy Scriptures,’ as they occur in the formula which makes a part of the ordination service?’ were submitted to any intelligent and impartial jury in the country–to twelve men of plain common sense, who had never head of the subterfuges and refinements of modern subscribers to creeds–I cannot doubt that they would be unanimous in their verdict without quitting their seats. They would naturally decide thus: ‘Since the primary object of subscribing an ecclesiastical creed is to express agreement in doctrinal belief; since the manifest design of the Confession of Faith of the Presbyterian Church is to maintain what is commonly called the Calvinistic system, in opposition to the Socinian, the Arian, the Pelagian, and the Arminian systems; since almost every point which distinguishes these several forms of error are specifically exposed, disproved and rejected, under one or another of its several articles; and since this has notoriously been the universal understanding, ever since that Confession was formed, we judge that no man who is not a sincere Calvinist, that is, who does not ex animo [from the heart; sincerely] receive all the distinguishing articles of the Calvinistic system, can honestly subscribe it. We do not suppose, indeed, that among those who subscribe that formulary, it is necessary, in order to a candid subscription, that there should be entire agreement as to ‘every jot and tittle’ in the mode of explaining every doctrine which the Confession contains. But we cannot resist the conclusion, as fair and honorable men, that unless a candidate for admission… sincerely believes all these [previously listed doctrines], and the essentially allied doctrines which have ever been considered as the distinguishing features of the Calvinistic system, and believes them in substance, as they are laid down in the Confession, our verdict is that he cannot honestly subscribe it.</p></blockquote>

<blockquote><p>§40. II. It is greatly needful to the well-being of the ministry and the success that doctrine be kept sound: And therefore: 1. That the Christian simplicity be retained, and many subtle and curious decisions be not made necessary: A few great, necessary certain truths are easilier preserved than multitudes of uncertain controverted niceties. 2. It is needful that such as are ordained ministers, be tried men, of sound understanding in that which they must teach and do, and therefore that both the ordainers and the hearers try them. This account of their understanding is better than the imposing of human forms upon them for subscription: Not but that teachers should know more than the flock, that is, than the essentials; nor that I presume to condemn all the Churches that impose their confessions to be subscribed in their own and not in Scripture-words, while they keep only to necessary, certain things: But I shall afterward prove that this way, though tolerable, is not best, but unnecessary and dangerous: 1. The Scripture affording us apt words enough to form our confessions in, which are past controversy; 2. and there being no probability of bounding men’s impositions of this kind, when once they set upon this way; 3. and most confessions of that nature now extant, having some needless words which other Churches or good Christians do dissent from: 4. And the ancient Creeds understood (which the ordainers must try) and the old catechistical verities being sufficient to this use. 5. And there being means of restraining men from preaching and vending heresies which are more safe and congruous. 3. I add therefore that a certain confession containing the certainest and needfulest integrals of religion should or may well be drawn up as a law, forbidding all upon meet penalties to preach or speak against them, without any subscribing, promising or professing. 4. And upon proof of the violating of such a law, and preaching against such articles it is sufficient that both the Church and the Christian magistrate in their several ways may judge them and by just penalties correct them (of which more after in due place). For it is very hard so to form long confessions (beyond the old creeds, Lord’s Prayer, Decalogue, and the general belief of Scripture) and this not in Scripture-terms, which shall not have some words which sound and honest Ministers cannot assent to (without lying, which they will not do): But to silence many words which yet we conceive true, and forbear speaking against some things which yet he cannot profess assent to, there are very few sober men but will do. And an error never spoken or written hurts not others, nor is to be judged, being not known; Non apparere here is as non esse. And if it be vended, the person may be judged as well as if he had sworn, subscribed or promised. And they that will tell us yet what evil may befall secret whispering errors without such oaths, subscriptions or promises, do by this over-doing dangerously undo; and lest man should be man and the Church imperfect, on pretence of avoiding a possible unavoidable hurt, they will set up knaves that will say any thing, shut out honest men, and necessitate divisions, confusions and persecutions, where they can never stop on this side banishing or killing or continued imprisoning multitudes of faithful men, and never the more attain their ends. Sound doctrine may be kept up as far as is to be hoped by the aforesaid means.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms</cite>, (London: Hancock, 1680), pt. 2, ch. 5, ‘What are the terms necessary to the office and exercise of the sacred ministry?’, pp. 222-23</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§40. II. It is greatly needful to the well-being of the ministry and the success that doctrine be kept sound: And therefore: 1. That the Christian simplicity be retained, and many subtle and curious decisions be not made necessary: A few great, necessary certain truths are easilier preserved than multitudes of uncertain controverted niceties. 2. It is needful that such as are ordained ministers, be tried men, of sound understanding in that which they must teach and do, and therefore that both the ordainers and the hearers try them. This account of their understanding is better than the imposing of human forms upon them for subscription: Not but that teachers should know more than the flock, that is, than the essentials; nor that I presume to condemn all the Churches that impose their confessions to be subscribed in their own and not in Scripture-words, while they keep only to necessary, certain things: But I shall afterward prove that this way, though tolerable, is not best, but unnecessary and dangerous: 1. The Scripture affording us apt words enough to form our confessions in, which are past controversy; 2. and there being no probability of bounding men’s impositions of this kind, when once they set upon this way; 3. and most confessions of that nature now extant, having some needless words which other Churches or good Christians do dissent from: 4. And the ancient Creeds understood (which the ordainers must try) and the old catechistical verities being sufficient to this use. 5. And there being means of restraining men from preaching and vending heresies which are more safe and congruous. 3. I add therefore that a certain confession containing the certainest and needfulest integrals of religion should or may well be drawn up as a law, forbidding all upon meet penalties to preach or speak against them, without any subscribing, promising or professing. 4. And upon proof of the violating of such a law, and preaching against such articles it is sufficient that both the Church and the Christian magistrate in their several ways may judge them and by just penalties correct them (of which more after in due place). For it is very hard so to form long confessions (beyond the old creeds, Lord’s Prayer, Decalogue, and the general belief of Scripture) and this not in Scripture-terms, which shall not have some words which sound and honest Ministers cannot assent to (without lying, which they will not do): But to silence many words which yet we conceive true, and forbear speaking against some things which yet he cannot profess assent to, there are very few sober men but will do. And an error never spoken or written hurts not others, nor is to be judged, being not known; Non apparere here is as non esse. And if it be vended, the person may be judged as well as if he had sworn, subscribed or promised. And they that will tell us yet what evil may befall secret whispering errors without such oaths, subscriptions or promises, do by this over-doing dangerously undo; and lest man should be man and the Church imperfect, on pretence of avoiding a possible unavoidable hurt, they will set up knaves that will say any thing, shut out honest men, and necessitate divisions, confusions and persecutions, where they can never stop on this side banishing or killing or continued imprisoning multitudes of faithful men, and never the more attain their ends. Sound doctrine may be kept up as far as is to be hoped by the aforesaid means.”

— Richard Baxter, The True &amp; only Way of Concord of all the Christian Churches, the Desirableness of it &amp; the Detection of False Dividing Terms (London: Hancock, 1680), pt. 2, ch. 5, ‘What are the terms necessary to the office and exercise of the sacred ministry?’, pp. 222-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A740.+II.+It+is+greatly+needful+to+the+well-being+of+the+ministry+and+the+success+that+doctrine+be+kept+sound%3A+And+therefore%3A+1.+That+the+Christian+simplicity+be+retained%2C+and+many+subtle+and+curious+decisions+be+not+made+necessary%3A+A+few+great%2C+necessary+certain+truths+are+easilier+preserved+than+multitudes+of+uncertain+controverted+niceties.+2.+It+is+needful+that+such+as+are+ordained+ministers%2C+be+tried+men%2C+of+sound+understanding+in+that+which+they+must+teach+and+do%2C+and+therefore+that+both+the+ordainers+and+the+hearers+try+them.+This+account+of+their+understanding+is+better+than+the+imposing+of+human+forms+upon+them+for+subscription%3A+Not+but+that+teachers+should+know+more+than+the+flock%2C+that+is%2C+than+the+essentials%3B+nor+that+I+presume+to+condemn+all+the+Churches+that+impose+their+confessions+to+be+subscribed+in+their+own+and+not+in+Scripture-words%2C+while+they+keep+only+to+necessary%2C+certain+things%3A+But+I+shall+afterward+prove+that+this+way%2C+though+tolerable%2C+is+not+best%2C+but+unnecessary+and+dangerous%3A+1.+The+Scripture+affording+us+apt+words+enough+to+form+our+confessions+in%2C+which+are+past+controversy%3B+2.+and+there+being+no+probability+of+bounding+men%E2%80%99s+impositions+of+this+kind%2C+when+once+they+set+upon+this+way%3B+3.+and+most+confessions+of+that+nature+now+extant%2C+having+some+needless+words+which+other+Churches+or+good+Christians+do+dissent+from%3A+4.+And+the+ancient+Creeds+understood+%28which+the+ordainers+must+try%29+and+the+old+catechistical+verities+being+sufficient+to+this+use.+5.+And+there+being+means+of+restraining+men+from+preaching+and+vend

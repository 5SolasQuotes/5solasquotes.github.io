<main class="wrap"><figure class="quote" id="q-dce0b3aa99" data-kw="">
<blockquote><p>The Doctrine of the Jesuits, who albeit they teach the concurrence of the first cause, to be necessary unto each operation of the second cause: yet so, as it doth not determine, but is determined by the second cause: thus Bellarmine. So as not fore-going, only accompanying of the second cause: thus Vasquez. So as it co-operates with the second cause, not after the manner of a principle, but after the manner of an action: thus Suarez.

It determineth the second cause (say they) negatively, not by way of influence: which mystical sense of the Jesuits. Hurtado (himself also a Jesuit) opens by a familiar comparison, thus: As (saith he) in case you can write with two pens, and I holding one of them, hinder you writing with it, permitting you to write with the other: this permission compelleth not you to write, you are free to both: but if you write, it must be with that pen which I leave, not with that which I hold in my hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The orthodox evangelist. Or A treatise wherein many great evangelical truths (not a few whereof are much opposed and eclipsed in this perilous hour of the passion of the Gospel) are briefly discussed, cleared, and confirmed: as a further help, for the begetting, and establishing of the faith which i</cite>, (London: Henry Cripps and Lodowick Lloyd, 1654), p. 125.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e53b90bc25" data-kw="">
<blockquote><p>But this negative will in God is nothing other than that act of the will by which, most perfectly willing himself, he is averse to everything adverse to him and to his glory, which is the only end of all things… He does this so thoroughly, that by most perfectly willing his own goodness, he is also most perfectly averse to whatever is adverse to him… Thus, God’s negative will is occupied with what is evil in its own nature, not only because it is adverse to the norm of acting set before it by God, but also [insofar as it has not been decreed] because it could not be directed by the power of the creatures to a truly good end… Even if an evil does not exist, or never will, God is still adverse to it, as it is inimical to his nature, since he would abolish and destroy it if it existed, just as he loves a good that will never exist, because, as it is congruent to his own goodness, if it existed he would conserve it, cherish it, and so forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 2, bk. 2, ch. 15, section 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><figure class="quote" id="q-0afca7c940" data-kw="">
<blockquote><p>The doctrine of middle knowledge, however, represents contingent future events as contingent and free also in relation to God. This is with reference not only to God’s predestination but also his foreknowledge, for just as in Origen, things do not happen because God knows them, but God foreknows them because they are going to happen. Hence, the sequence is not necessary knowledge, the knowledge of vision, the decree to create (etc.); instead, it is necessary knowledge, middle knowledge, decree to create (etc.), and the knowledge of vision. God does not derive his knowledge of the free actions of human beings from his own being, his own decrees, but from the will of creatures. God, accordingly, becomes dependent on the world, derives knowledge from the world that he did not have and could not obtain from himself, and hence, in his knowledge, ceases to be one, simple, and independent – that is, God. Conversely, the creature in large part becomes independent vis-a-vis God. It did indeed at one time receive “being” (esse) and “being able” (posse) from God but now it has the “volition” (velle) completely in its own hand. It sovereignly makes it own decisions and either accomplishes something or does not accomplish something apart from any preceding divine decree. Something can therefore come into being quite apart from God’s will. The creature is now creator, autonomous, sovereign; the entire history of the world is taken out of God’s controlling hands and placed into human hands. First, humans decide; then God responds with a plan that corresponds to that decision.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite></span></figcaption>

<blockquote><p>Besides these two species of divine knowledge, a third was devised by the Jesuits, Fonseca, Lessius, Molina, which they called “middle knowledge.” Is there a middle knowledge in God between the natural and the free? We deny against the Jesuits, Socinians and Remonstrants. The free knowledge depends upon his will and decree by which things pass from a state of possibility to a state of futurition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.13.1–2</span></figcaption>

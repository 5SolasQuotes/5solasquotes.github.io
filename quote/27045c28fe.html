<blockquote><p>It is known to you all when the whore of Babylon was cast out of the church, that she left behind her a gold ring, and some lover tokens, I mean Episcopacy, and human ceremonies. This was the whore’s policy to leave a token behind her that she might find an errand in the house again. And she was indeed returning to the house to demand her love token again, but it shall be heavenly wisdom to make a perfect reformation; keep nothing that belongs to Babylon, and let not a stone to be a cornerstone or a foundation be taken out of Babylon for building of the Lord’s house, for they are cursed stones [cf. Jer. 50.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached to the honourable House of Commons at their late solemn fast, Wednesday, January 31, 1643/44 in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish commissioners to the Westminster Assembly of divines</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-075824cdf1" data-kw="">
<blockquote><p>Goodwin’s argument makes as much against Christ and the apostles as against us, for they could never in all their sermons and writings so frequently bottom and found the faith on &lt;Greek&gt; ‘as it is written in the Prophets,’ ‘as David saith,’ ‘as Isaiah saith,’ and Hosea, ‘as Daniel saith,’ as Moses and Samuel, and all the Prophets bear witness, if they had had no other certainty, that the writings of the Prophets, that came to their hands, was the very word of God, but the credit, learning and authority of men, as Mr. [John] Goodwin says, for sure Christ and the apostles and evangelists had not the authentic and first copies of Moses and the prophets, but only copies written by men, who might mistake, printers and translators not being then, more than now, immediately inspired Prophets, but fallibly men, and obnoxious to failings, mistakes and ignorance of ancient Hebraisms and force of words; and if ye remove an unerring providence, who doubts but men might add a &lt;Hebrew&gt; or subtract, and so vitiate the fountain sense? and omit points, change consonants, which in the Hebrew and Greek, both might quite alter the sense: Nor can any say, ‘Christ and the Apostles being infallible, could well cite the prophets without a mistake, though the copies might have been vitiate and corrupt, 2. Because the very citing of these testimonies by Christ and his apostles, made them Scripture, and so of infallible authority; but our citing of them, (since both printers and translators are not immediately inspired, and we also might err) cannot adopt them into canonical and authentic Scripture, such as was first written by the immediately inspired prophets.’ I shall answer that first, this objection presumes that Christ and the apostles might, and did, find errors and mis-printings even in written Scripture, which might reduce the Church in after ages to an invincible ignorance in matters of faith, and yet they gave no notice to the Church thereof; or if there was no error de facto, then for so many hundred years, yet there are now substantial errors, and so foul that it may be we have no Word of God at all, amongst us, and God has no Church, no believer on earth, but we must all take the word of printers and translators, which is merely the word of man: And what is become of all the martyrs that suffered by the bloody woman Babel? They died for mere conjectures and opinions, for they had not the first original copies of Moses and the Prophets, yea Stephen the first martyr, who according to all our copies, Acts 7, adds five to Moses, his 70 souls, that went down to Egypt, in that glorious sermon that he has before his death, when he sealed the truth with his blood and died gloriously, and said, ‘Lord Jesus receive my spirit,’ died but upon the faith of men’s fallible skill in grammar, printing and writing; for he cites the writings of Moses to his enemies that stoned him, according to the copies that they then had, who would quickly have controlled him if he had cited false copies, and Stephen’s own testimony was controverter, and therefore except we say that Stephen and Christ and the apostles cited the testimonies of the prophets as they were then obvious to the eyes and reading of both the people of God and the enemies, and that not simply as their own words which they spake as immediately inspired, but as the testimony of the prophets, according to the then written copies, we must say they spake not ingeniously the truth of God, for it was against truth, candor, ingenuity, to Christ and the apostles to say, ‘as it is written in your Law,’ John 8:17, and so often ‘it is written,’ if they would not have the hearers to receive with certainty of faith and full assurance, free from all doubting and fear of humane fallibility, that what they cited as written, was undoubtedly the same very truth of God, and no other, which Moses and the prophets spoke and wrote; and if they would not have them to read, search and believe these same Scriptures, and to conceive that they drew arguments in the New Testament to prove and confirm their doctrine from that which was written by Moses and the prophets in the Old Testament, and would not have them to believe them, only because New Testament writers immediately inspired had so said.

6. If God will have us to try and examine all spirits, all doctrines, by the Scriptures written, then are we certainly assured that the books we now have of the Old and New Testament, are the very Word of God, though we cannot by any possibility have the first and original authentic copies of Moses and the prophets and apostles. Because 1. God would not bid us try, and then leave us no rule to try withal but our own natural light, which must lead us into darkness.

2. The visible Church should not be guilty of unbelief if the written Word were not among us, or then Christ and his apostles speaking to us, as is clear, John 15:22; Rom. 10:14-15; Mt. 11:21-22. The assumption is clear by the commended practice of the Bereans, who tried Paul’s doctrine by the Scriptures, Acts 17. See Rivetus, Whitaker, Calvin.

3. By the command of God, 1 Thess. 5:2; 1 John 4:1; ‘Try all things,’ ‘try the sprits.’

7. John would not call those blessed who read and hear, Rev. 1:5, nor would Paul recommend reading to Timothy, and continuance in the doctrine of the Scriptures, and so extol the necessity and utility of the Scripture and the indwelling of the word of God in us as he does, 1 Tim. 4:16; 2 Tim. 3:14-16; Col. 3:16, nor could the things written by John ch. 21, by Moses and the prophets, Luke 16:29-31, be holden forth as sufficient to bring souls to heaven, and to cause them eschew Hell, if it were true that we ‘have no certainty that the Scripture of the old and New Testament are the very word of God, but such as is made of men’s credit and learning.’

8. Yea and so what God spake immediately to Abraham, Moses and the prophets, could not be infallibly and by certainty of faith to them the Word of God; for if God spake to them in a language intelligible, they had no certainty of faith that the words that came from God did signify thus and thus; for sure, God, by immediate inspiration, taught them not grammar and significations of words, and those that read the Law written by God’s finger on two tables of stone, those who heard Moses and the prophets preach in their mother-tongue, even the Jews who read the original first Hebrew copy of Moses and the prophets, must have had no warrant that that was the Word of God, but the authority of father, mother and nurses, who first taught them their mother-tongue, for sure the prophets were not school-masters to teach them Hebrew; so by this learning there was never since the world was any certainty of faith, but such conjectural human and fallible opinions in all the matters of God as is resolved ultimately (says Mr. Goodwin) into men’s fallible and topic authority and skill of grammar, and all divine faith is perished out of the earth, except God by a supernatural power taught men first grammar, and then to believe, for which we have no warrant, so all our faith must be dreams. And since Mr. Goodwin acknowledges a supernatural power of the Spirit of grace to believe; what else does this Spirit cause us believe, but lies? or at best fancies resolved into human credit? which may be false for any certainty of knowledge that Libertines allow us? … May not reading, interpunction, a parenthesis, a letter, an accent, alter the sense of all fundamentals in the Decalogue? of the principles of the Gospel? and turn the Scripture in all points (which Mr. Doctour restricts to some few darker places, whose senses are off the way to heaven, and less necessary) in a field of problems, and turn all believing into digladiations of wits? all our comforts of the Scriptures into the reelings of a Windmill, and fancies of seven moons at once in the firmament? this is to put our faith and the first-fruits of the Spirit, and Heaven and Hell to the press. But though printers and pens of men may err, it follows not ‘that heresies should be tolerated,’ except we say, 1. that our faith is ultimately resolved upon characters, and the faith of printers. 2. We must say we have not the clear and infallible word of God, because the Scripture comes to our hand by fallible means, which is a great inconsequence, for though scribes, translators, grammarians, printers, may all err, it follows not that an erring providence of Him that has seven eyes, has not delivered to the Church, the Scriptures containing the infallible truth of God. Say that Baruch might err in writing the prophesy of Jeremiah, it follows not that the prophesy of Jeremiah, which we have, is not the infallible Word of God; if all translators and printers did their alone watch over the Church, it were something, and if there were not one with seven eyes to care for the Scripture. But for tradition, councils, popes, fathers, they are all fallible means, and so far forth to be believed as they bring Scripture with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, (1649), pp. 333-38</span></figcaption>

o+Christ+and+the+apostles+to+say%2C+%E2%80%98as+it+is+written+in+your+Law%2C%E2%80%99+John+8%3A17%2C+and+so+often+%E2%80%98it+is+written%2C%E2%80%99+if+they+would+not+have+the+hearers+to+receive+with+certainty+of+faith+and+full+assurance%2C+free+from+all+doubting+and+fear+of+humane+fallibility%2C+that+what+they+cited+as+written%2C+was+undoubtedly+the+same+very+truth+of+God%2C+and+no+other%2C+which+Moses+and+the+prophets+spoke+and+wrote%3B+and+if+they+would+not+have+them+to+read%2C+search+and+believe+these+same+Scriptures%2C+and+to+conceive+that+they+drew+arguments+in+the+New+Testament+to+prove+and+confirm+their+doctrine+from+that+which+was+written+by+Moses+and+the+prophets+in+the+Old+Testament%2C+and+would+not+have+them+to+believe+them%2C+only+because+New+Testament+writers+immediately+inspired+had+so+said.+6.+If+God+will+have+us+to+try+and+examine+all+spirits%2C+all+doctrines%2C+by+the+Scriptures+written%2C+then+are+we+certainly+assured+that+the+books+we+now+have+of+the+Old+and+New+Testament%2C+are+the+very+Word+of+God%2C+though+we+cannot+by+any+possibility+have+the+first+and+original+authentic+copies+of+Moses+and+the+prophets+and+apostles.+Because+1.+God+would+not+bid+us+try%2C+and+then+leave+us+no+rule+to+try+withal+but+our+own+natural+light%2C+which+must+lead+us+into+darkness.+2.+The+visible+Church+should+not+be+guilty+of+unbelief+if+the+written+Word+were+not+among+us%2C+or+then+Christ+and+his+apostles+speaking+to+us%2C+as+is+clear%2C+John+15%3A22%3B+Rom.+10%3A14-15%3B+Mt.+11%3A21-22.+The+assumption+is+clear+by+the+commended+practice+of+the+Bereans%2C+who+tried+Paul%E2%80%99s+doctrine+by+the+Scriptures%2C+Acts+17.+See+Rivetus%2C+Whitaker%2C+Calvin.+3.+By+the+command+of+God%2C+1+Thess.+5%3A2%3B+1+John+4%3A1%3B+%E2%80%98Try+all+things%2C%E2%80%99+%E2%80%98try+the+sprits.%E2%80%99+7.+John+would+not+call+those+blessed+who+read+and+hear%2C+Rev.+1%3A5%2C+nor+would+Paul+recommend+reading+to+Timothy%2C+and+continuance+in+the+doctrine+of+the+Scriptures%2C+and+so+extol+the+necessity+and+utility+of+the+Scripture+and+the+indwelling+of+the+word+of+God+in+us+as+he+does%2C+1+Tim.+4%3A16%3B+2+Tim.+3%3A14-16%3B+Col.+3%3A16%2C+nor+could+the+things+written+by+John+ch.+21%2C+by+Moses+and+the+prophets%2C+Luke+16%3A29-31%2C+be+holden+forth+as+sufficient+to+bring+souls+to+heaven%2C+and+to+cause+them+eschew+Hell%2C+if+it+were+true+that+we+%E2%80%98have+no+certainty+that+the+Scripture+of+the+old+and+New+Testament+are+the+very+word+of+God%2C+but+such+as+is+made+of+men%E2%80%99s+credit+and+learning.%E2%80%99+8.+Yea+and+so+what+God+spake+immediately+to+Abraham%2C+Moses+and+the+prophets%2C+could+not+be+infallibly+and+by+certainty+of+faith+to+them+the+Word+of+God%3B+for+if+God+spake+to+them+in+a+language+intelligible%2C+they+had+no+certainty+of+faith+that+the+words+that+came+from+God+did+signify+thus+and+thus%3B+for+sure%2C+God%2C+by+immediate+inspiration%2C+taught+them+not+grammar+and+significations+of+words%2C+and+those+that+read+the+Law+written+by+God%E2%80%99s+finger+on+two+tables+of+stone%2C+those+who+heard+Moses+and+the+prophets+preach+in+their+mother-tongue%2C+even+the+Jews+who+read+the+original+first+Hebrew+copy+of+Moses+and+the+prophets%2C+must+have+had+no+warrant+that+that+was+the+Word+of+God%2C+but+the+authority+of+father%2C+mother+and+nurses%2C+who+first+taught+them+their+mother-tongue%2C+for+sure+the+prophets+were+not+school-masters+to+teach+them+Hebrew%3B+so+by+this+learning+there+was+never+since+the+world+was+any+certainty+of+faith%2C+but+such+conjectural+human+and+fallible+opinions+in+all+the+matters+of+God+as+is+resolved+ultimately+%28says+Mr.+Goodwin%29+into+men%E2%80%99s+fallible+and+topic+authority+and+skill+of+grammar%2C+and+all+divine+faith+is+perished+out+of+the+earth%2C+except+God+by+a+supernatural+power+taught+men+first+grammar%2C+and+then+to+believe%2C+for+which+we+have+no+warrant%2C+so+all+our+faith+must+be+dreams.+And+since+Mr.+Goodwin+acknowledges+a+supernatural+power+of+the+Spirit+of+grace+to+believe%3B+what+else+does+this+Spirit+cause+us+believe%2C+but+lies%3F+or+at+best+fancies+resolved+into+human+credit%3F+which+may+be+false+for+any+certainty+of+knowledge+that+Libertines+allow+us%3F+%E2%80%A6+May+not+reading%2C+interpunction%2C+a+parenthesis%2C+a+letter%2C+an+accent%2C+alter+the+sense+of+all+fundamentals+in+the+Decalogue%3F+of+the+principles+of+the+Gospel%3F+and+turn+the+Scripture+in+all+points+%28which+Mr.+Doctour+restricts+to+some+few+darker+places%2C+whose+senses+are+off+the+way+to+heaven%2C+and+less+necessary%29+in+a+field+of+problems%2C+and+turn+all+believing+into+digladiations+of+wits%3F+all+our+comforts+of+the+Scriptures+into+the+reelings+of+a+Windmill%2C+and+fancies+of+seven+moons+at+once+in+the+firmament%3F+this+is+to+put+our+faith+and+the+first-fruits+of+the+Spirit%2C+and+Heaven+and+Hell+to+the+press.+But+though+printers+and+pens+of+men+may+err%2C+it+follows+not+%E2%80%98that+heresies+should+be+tolerated%2C%E2%80%99+except+we+say%2C+1.+that+our+faith+is+ultimately+resolved+upon+characters%2C+and+the+faith+of+printers.+2.+We+must+say+we+have+not+the+clear+and+infallible+word+of+God%2C+because+the+Scripture+comes+to+our+hand+by+fallible+means%2C+which+is+a+great+inconsequence%2C+for+though+scribes%2C+translators%2C+grammarians%2C+printers%2C+may+all+err%2C+it+follows+not+that+an+erring+providence+of+Him+that+has+seven+eyes%2C+has+not+delivered+to+the+Church%2C+the+Scriptures+containing+the+infallible+truth+of+God.+Say+that+Baruch+might+err+in+writing+the+prophesy+of+Jeremiah%2C+it+follows+not+that+the+prophesy+of+Jeremiah%2C+which+we+have%2C+is+not+the+infallible+Word+of+God%3B+if+all+translators+and+printers+did+their+alone+watch+over+the+Church%2C+it+were+something%2C+and+if+there+were+not+one+with+seven+eyes+to+care+for+the+Scripture.+But+for+tradition%2C+councils%2C+popes%2C+fathers%2C+they+are+all+fallible+means%2C+and+so+far+forth+to+be+believed+as+they+bring+Scripture+with+them.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%2C+%281649%29%2C+pp.+333-38&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F075824cdf1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/075824cdf1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/original-manuscripts/the-majority-text/#:~:text=Goodwin%E2%80%99s%20argument%20makes%20as%20much%20against,as%20they%20bring%20Scripture%20with%20them&amp;text=Goodwin%E2%80%99s%20argument%20makes%20as%20much%20against%20Christ%20and&amp;text=be%20believed%20as%20they%20bring%20Scripture%20with%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…the question is, Why the bread is called Christ’s body and the cup Christ’s blood: that is, why the things signified are attributed to the signs, and the signs called by their name. There are two causes alleged hereof:

1. For the natural analogy or likeness, which Christs body and the bread have between themselves.

2. For the certainty or confirmation of the joint-exhibition of the sign, and the thing signified in the true use.</p></blockquote>

<blockquote><p>When we measure the goodness or the badness of a human action, we must not only measure it by the object and the end, but by all the circumstances which accompany it. Fed. Morellus upon those words of Seneca, Refert quid, cui, quando, quare, ubi, etc. says that without those circumstances of things, persons, times, places, facti ratio non constat [it does not consist with reason of fact]. Circumstances sometimes constituunt rerum earum quae aguntur speciem [establish those things which direct the species], say our divines, meaning that circumstances do make an action good or bad. Humani actus [a human action] say the Schoolmen, non solum ex objectis, verum ex circumstantiis boni vel mali esse dicuntur. It is not every mans part, (says one of our opposites) to judge de circumstantia, quae reddit actionem vel bonam vel malam. Some circumstances says another of them, are intrinsical and essential to actions, and specially making up their nature. The principal circumstances which here we speak of, are comprehended in this versicle: ‘Quis, Quid, Ubi, Quibus auxiliis, Cur, Quomodo, Quando.’ [‘Who, what, where, by what means, why, what way, when.’]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ([1637]), pt. 4, ch. 3, pp. 6-7</span></figcaption>

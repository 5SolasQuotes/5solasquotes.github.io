<main class="wrap"><figure class="quote" id="q-c93a06a4fc" data-kw="">
<blockquote><p>Once give over caring for the Sabbath, and in the end you will give over caring for your soul. … Begin with not honouring God’s day, and you will soon not honour God’s house; – cease to honour God’s house, and you will soon cease to honour God’s book; cease to honour God’s book, and by and by you will give God no honour at all. Let a man lay the foundation of having no Sabbath, and I am never surprised if he finishes with the top-stone of no God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Upper Room: Being a Few Truths for the Times</cite>, (1880; Edinburgh: Banner of Truth, 1970), p. 418.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>[Ralph] Erskine’s comparison of mental idolatry with mental adultery suggests some important clues. A man cannot always avoid seeing a beautiful woman or being attracted to her. Mental adultery does not consist in physical sight, but in cultivating the mental image of that woman for the purpose of sexual stimulation. In the same way, it is possible to walk past a portrait of Christ in a museum without yielding to any temptation to meditate on God through its instrumentality. Even if the picture is sinful, the viewer need not sin.</p></blockquote>

</figure><figure class="quote" id="q-b9bcfdcde3" data-kw="">
<blockquote><p>242. Of the use of Amen being added to a Speech …

1. Three duties especially are required of him that utters the speech whereunto ‘Amen’ is added. …

2. To speak audibly, so as they which are to say Amen, may hear what is said. The Levites under the Law were expressly enjoined to speak to the people with a loud voice. Accordingly the Levites that were the mouth of the people to God, and prayed in their presence, cried with a loud voice unto the Lord their God. Be a prayer made as intelligibly as may be, if it be not heard of them that are present, they cannot with assent, desire, and say Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Go to God</cite>, ... (1626; RHB, 2011) See the whole of the larger section, pp. 330-40.</span></figcaption>

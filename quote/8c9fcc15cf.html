<main class="wrap"><figure class="quote" id="q-8c9fcc15cf" data-kw="">
<blockquote><p>Who would have thought that our church would ever have given entertainment to these Belgic semi-Pelagians, who have cast dirt upon the faces and raked up the ashes of all those great and pious souls whom God magnified, in using as his instruments to reform his church; to the least of which the whole troop of Arminians shall never make themselves equal, though they swell till they break?

What benefit did ever come to this church by attempting to prove that the chief part in the several degrees of our salvation is to be ascribed unto ourselves, rather than God? — which is the head and sum of all the controversies between them and us. And must not the introducing and fomenting of a doctrine so opposite to that truth our church hath quietly enjoyed ever since the first Reformation necessarily bring along with it schisms and dissensions, so long as any remain who love the truth, or esteem the gospel above preferment?

Neither let any deceive your wisdoms, by affirming that they are differences of an inferior nature that are at this day agitated between the Arminians and the orthodox divines of the reformed church. Be pleased but to cast an eye on the following instances, and you will find them hewing at the very root of Christianity. Consider seriously their denying of that fundamental article of original sin. Is this but a small escape in theology? — why, what need of the gospel, what need of Christ himself, if our nature be not guilty, depraved, corrupted? Neither are many of the rest of less importance. Surely these are not things “in quibus possimus dissentire salvâ pace ac charitate,” as Austin [Augustine] speaks, — “about which we may differ without loss of peace or charity.” One church cannot wrap in her communion Austin and Pelagius, Calvin and Arminius.

I have here only given you a taste, whereby you may judge of the rest of their fruit, — “mors in olla, mors in olla;” their doctrine of the final apostasy of the elect, of true believers, of a wavering hesitancy concerning our present grace and future glory, with divers others, I have wholly omitted: those I have produced are enough to make their abettors incapable of our church-communion. The sacred bond of peace compasseth only the unity of that Spirit; which leadeth into all truth.

We must not offer the right hand of fellowship, but rather proclaim ἱερὸν πόλεμον, “a holy war,” to such enemies of God’s providence, Christ’s merit, and the powerful operation of the Holy Spirit. Neither let any object, that all the Arminians do not openly profess all these errors I have recounted. Let ours, then, show wherein they differ from their masters. We see their own confessions; we know their arts, βάθη καὶ μεθοδείας τοῦ Σατανᾶ, — “the depths and crafts of Satan;” we know the several ways they have to introduce and insinuate their heterodoxies into the minds of men.

With some they appear only to dislike our doctrine of reprobation; with others, to claim an allowable liberty of the will: but yet, for the most part, — like the serpent, wherever she gets in her head, she will wriggle in her whole body, sting and all, — give but the least admission, and the whole poison must be swallowed. What was the intention of the maintainers of these strange assertions amongst us I know not, — whether the efficacy of error prevailed really with them or no, or whether it were the better to comply with Popery, and thereby to draw us back again unto Egypt; — but this I have heard, that it was affirmed on knowledge, in a former parliament, that the introduction of Arminianism amongst us was the issue of a Spanish consultation.

It is a strange story that learned Zanchius tells us, how, upon the death of the Cardinal of Lorraine there was found in his study a note of the names of divers German doctors and ministers, being Lutherans, to whom was paid an annual pension, by the assignment of the cardinal, that they might take pains to oppose the Calvinists; and so, by cherishing dissension, reduce the people again to Popery.

If there be any such amongst us, who, upon such poor inconsiderable motives, would be won to betray the gospel of Christ, God grant them repentance before it be too late! However, upon what grounds, with what intentions, for what ends soever, these tares have been sowed amongst us by envious men, the hope of all the piously learned in the kingdom is, that, by your effectual care and diligence, some means may be found to root them out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ΘΕΟΜΑΧΙΑ ΑΥΤΕΞΟΥΣΙΑΣΤΙΚΗ</cite>, or, A display of Arminianism: being a discovery of the old Pelagian idol free-will, with the new goddess contingency (1643) in William H. Goold (ed.), The Works of John Owen (16 vols, Edinburgh: Banner of Truth, 1967), 10: 6-7.</span></figcaption>

<blockquote><p>John Davenant wrote to his fellow member of the British delegation to the Synod of Dort, Joseph Hall, to correct false aspersion of Arminianism cast upon the latter divine and to affirm that Arminianism was contrary to the doctrine of the Church of England:

As for the aspersion of Arminianism, I can testify that in our joint employment at the Synod of Dort you [Joseph Hall] were as far from it as myself. And I know that no man can embrace it in the Doctrine of Predestination and Grace but he must first desert the Articles agreed upon by the Church of England, nor in the point of perseverance but he must vary from the common Tenet and received opinion of our best approved Doctors in the English Church. And therefore be no more troubled with other men’s groundless suspicions, then you would be in like case, with their idle dreams. Thus I have enlarged my self beyond my first intent. But my love to your self, and the assurance of your constant love unto the Truth, enforced me thereunto.</p></blockquote>

— Robert Baillie, Satan leader in chief of all who resist the reparation of Sion. As is cleared in a sermon to the Honourable House of Commons at their late solemn fast, February 28, 1643/44 in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish Commissioners to the Westmins">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+wickedness+of+Arminius+%5B%E2%80%A6%5D+putting+free-will+in+the+place+of+grace%2C+and+instead+of+our+justification+by+Christ%2C+would+teach+us+that+old+fundamental+error+of+the+Papists%2C+justification+by+works%2C+and+inherent+righteousness%2C+to+wit%2C+by+faith+as+a+work+in+us.+Strange+that+any+Protestant+divines+should+yet+stumble+upon+that+infamous+stone.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Satan+leader+in+chief+of+all+who+resist+the+reparation+of+Sion.+As+is+cleared+in+a+sermon+to+the+Honourable+House+of+Commons+at+their+late+solemn+fast%2C+February+28%2C+1643%2F44+in+Chris+Coldwell+%28ed.%29%2C+Sermons+preached+before+the+English+Houses+of+Parliament+by+the+Scottish+Commissioners+to+the+Westmins&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd2a1509ba6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d2a1509ba6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/07/22/robert-baillie-arminianism-versus-protestantism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-568cf10111" data-kw="">
<blockquote><p>The Law holdeth forth a perfect righteousness, and will not admit of any other; but the Gospel, that condescends, and brings pardon through Christ. And this is the main difference, and in which they can never be made one. Now the Papists, Arminian, Socinian, and others do overthrow this grand and main difference holding justification by works under some notion, or other: whereas the Apostle maketh an immediate opposition, If of faith, then not of works. The Apostle doth not distinguish of works of nature, and works of grace, or of works of grace perfect imperfect: but speaketh absolutely, &amp; so doth also exclude that subtle opinion, of making faith to justify as a work; for the Apostle, making an opposition between faith and works, must necessarily take faith under such a notion, as cannot be a work. And this truth is that which is the pillar of the Church of God, and that which differenceth us from Jews, Turks, Papists, and many Hereticks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), p. 258.</span></figcaption>

l-distinction/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-23fccf8c36" data-kw="">
<blockquote><p>The hopes of the Arminians in England were but small so long as K[ing]. James did live, for that good Prince both in word and writing did threaten to burn these Hereticks if any of them should appear in his Dominions; see his Declaration against Vorstius: yea, so long as [George] Abbot was in grace at Court, the Arminians kept a low sail, but after that his Successor even in his own time had come in favour, that unhappy Sect under the patronage of Mountagu and White’s learning began to spread far and near, yea, at last silence in a public Edict was enjoined to their opposers, and all favours conferred on those who had skill and will to promote that Cause, &amp; many evident disgraces poured on well-deserving men for no other reason but their Anti-Arminian spirit.

All this time our Church [the Church of Scotland] was free of these evils; but so soon as the advancers of Arminianism at the English Court, began to intermeddle with the affairs of our Kingdom, at once these men were eyed, who inclined that way, prime places were put into their hands for no other virtue the World could discern in them, but their boldness to let out their inclination towards the Arminian Error.</p></blockquote>

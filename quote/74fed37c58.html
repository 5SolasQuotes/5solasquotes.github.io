<main class="wrap"><figure class="quote" id="q-74fed37c58" data-kw="">
<blockquote><p>…if the laws of the Church obliged the conscience in such a [absolute] manner, as that the transgression of them were a sin, the observance of them would then be a good action… …the persons against whom I dispute, pretend the violation of ecclesiastical laws to be therefore only sinful, because it implies an infraction of the law of God, who has commanded us to obey the Church: but if not to do what the Church enjoins be to violate the law of God, must it not be allowed, that to comply with her injunctions, is to observe the same divine law, and consequently to perform a good and virtuous act?… Lastly, if ecclesiastical laws obliged the conscience, the Church would only have changed her yoke by the establishment of Christianity: she would still continue a slave; and the only difference would be, that whereas under the [Mosaic] Law her servitude was terminated with respect to God, she would now be in bondage to men… …ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-323e74c17f" data-kw="">
<blockquote><p>A bishop ordained of God, or set up by the law of God, does declare nothing else but their calling, which by an other more special name, are called pastors, whom (says Luke [in Acts 20]) the holy Ghost has appointed bishops to feed the Church of God. And either of these names of pastor or of bishop is proper to them in the New Testament, whereby the apostle does distinguish them from apostles, prophets, and evangelists, which were callings to endure for a time, Eph. 4:11, and from deacons, 1 Tim. 3 and Phil. 1:1, for otherwise they are everywhere called elders… But they are called bishops in regard of the sheep committed unto them, as though a man should call them watchmen of [or?] overseers. These now were one alone, as where any church had but one pastor, or more if the church had more than one. And the meeting of them together jointly with their elders, whom Paul calls ‘governors’ [1 Cor. 12], of the other common name called, was the eldership. Their duty was to attend on the word and prayer, both publicly and privately, and in common to governe the Church, as appears by many places of Scripture. … Of the Bishop that is of Man The bishop that is of man, that is to say, brought into the Church by the alone wisdom of man, besides the express Word of God, is a certain power given to one certain pastor above his other fellows, yet limited with certain orders or rules provided against tyranny. They which did bear this office of bishop, are called bishops in regard of their fellow elders and the whole clergy, as watchmen set over the clergy. That this calling was not brought in by the Word, it is manifest by that, that there is not to be found in the New Testament so much as one syllable, whereby there may be the least surmise of any such thing. For although we doubt not, but all things ought to be done orderly in the Lord’s house, and therefore that some one should be president in every assembly… … The Answer to the First Question Where as Satan’s bishop has been the overthrow of the Church and all Christian kingdoms, whose head is the Roman Antichrist, it is to be looked unto of all hands, especially of all godly princes, that they at once abolish it, if they mind the reformation of the Church and their own safety. As for the bishop ordained by man and brought into the Church by little and little, whereby Satan made him a way for greater things, it had been tolerable… experience of so many ages does teach us too well, that unless this root also be plucked up, it will come to pass that the same fruit will sprout and bud forth again. Finally, seeing the Lord has so often decided this controversy of superiority among his own disciples, that He shut it clean out, seeing the rule both for doctrine and good order of the Church is to be sought for out of the very writings of the apostles: and it is manifested, the churches then prospered, when all this authority of one man over the rest, yet was not, but as that grew up, so all things fell to decay. Finally, seeing where the remnants of this government by a few are not clean taken away, the work of the Lord, is openly hindered: Our judgement is that after the chasing away of this device of man, the churches shall be well provided for, if they may be repaired according to the writings of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Judgment of a Most Reverend &amp; Learned Man from Beyond the Seas Concerning a Threefold Order of Bishops</cite>, [of God, of Man, of the Devil], with a Declaration of Certain Other Weighty Points Concerning the Discipline &amp; Government of the Church ([London, 1585]) 43, pp. ToC</span></figcaption>

e+whole+clergy%2C+as+watchmen+set+over+the+clergy.+That+this+calling+was+not+brought+in+by+the+Word%2C+it+is+manifest+by+that%2C+that+there+is+not+to+be+found+in+the+New+Testament+so+much+as+one+syllable%2C+whereby+there+may+be+the+least+surmise+of+any+such+thing.+For+although+we+doubt+not%2C+but+all+things+ought+to+be+done+orderly+in+the+Lord%E2%80%99s+house%2C+and+therefore+that+some+one+should+be+president+in+every+assembly%E2%80%A6+%E2%80%A6+The+Answer+to+the+First+Question+Where+as+Satan%E2%80%99s+bishop+has+been+the+overthrow+of+the+Church+and+all+Christian+kingdoms%2C+whose+head+is+the+Roman+Antichrist%2C+it+is+to+be+looked+unto+of+all+hands%2C+especially+of+all+godly+princes%2C+that+they+at+once+abolish+it%2C+if+they+mind+the+reformation+of+the+Church+and+their+own+safety.+As+for+the+bishop+ordained+by+man+and+brought+into+the+Church+by+little+and+little%2C+whereby+Satan+made+him+a+way+for+greater+things%2C+it+had+been+tolerable%E2%80%A6+experience+of+so+many+ages+does+teach+us+too+well%2C+that+unless+this+root+also+be+plucked+up%2C+it+will+come+to+pass+that+the+same+fruit+will+sprout+and+bud+forth+again.+Finally%2C+seeing+the+Lord+has+so+often+decided+this+controversy+of+superiority+among+his+own+disciples%2C+that+He+shut+it+clean+out%2C+seeing+the+rule+both+for+doctrine+and+good+order+of+the+Church+is+to+be+sought+for+out+of+the+very+writings+of+the+apostles%3A+and+it+is+manifested%2C+the+churches+then+prospered%2C+when+all+this+authority+of+one+man+over+the+rest%2C+yet+was+not%2C+but+as+that+grew+up%2C+so+all+things+fell+to+decay.+Finally%2C+seeing+where+the+remnants+of+this+government+by+a+few+are+not+clean+taken+away%2C+the+work+of+the+Lord%2C+is+openly+hindered%3A+Our+judgement+is+that+after+the+chasing+away+of+this+device+of+man%2C+the+churches+shall+be+well+provided+for%2C+if+they+may+be+repaired+according+to+the+writings+of+the+apostles.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Judgment+of+a+Most+Reverend+%26+Learned+Man+from+Beyond+the+Seas+Con </figure><figure class="quote" id="q-c1164c614a" data-kw="">
<blockquote><p>It is obvious that the Puritans, who obtained the charter of the Massachusetts Bay Company from Charles I and came to New England in 1630, were not Separatists. They, though being non-conformists, considered themselves as loyal members of the Church of England. Secession or separation from the national church, for them, was a sin of schism. Nevertheless, in less than seven years, Puritans in the mother country began to hear that their brethren in New England actually followed the ways of the Separatists. Accordingly, in 1637, a formal and written communication was made, in which Puritans in England put forward “Nine Propositions,” to which their “Reverend and beloved Brethren” in the New World replied in 1639. This early debate was compiled by Simeon Ash and William Rathband and, four years later, published with John Ball’s ‘Reply’, under the title ‘A Letter of Many Ministers in Old England’… The main purpose of these propositions was to find whether or not the New England brethren actually adopted the methods of the Separatists which they once denounced before they left England… Many ministers in Old England… were surprised at the rumor about their brethren’s sudden turn to Separatism. Particularly, they were frightened when they received a report that the above nine propositions were practiced by New Englander ‘as the only Church way, wherein the Lord is to be worshipped.’ Of course, this report seemed to be exaggerated. Thus, John Cotton, representing “the Elders of the Churches in New England,” provided an answer to this letter in which he assured them that New England Congregational churches had nothing to do with “the ways of rigid separation.”… Cotton’s above answer was sent to England in 1639 and Ball’s comments and reply were finished by 1640. For some reason, however, their works were not published until 1643.</p></blockquote>

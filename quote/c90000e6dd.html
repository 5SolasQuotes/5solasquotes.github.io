<main class="wrap"><figure class="quote" id="q-c90000e6dd" data-kw="">
<blockquote><p>6. Why holds he us [to be] contemners of the Church for not receiving the five Articles of Perth [1618]? We cannot be called contemners for not obeying, but for not subjecting ourselves, wherewith we cannot be charged. Could he not distinguish betwixt subjection and obedience? Art thou a doctor in Israel, and knowest not these things? Nay, art thou a conformist, and knowest not what thy fellow conformists do hold? (Field, Of the Church, bk. 4, ch. 34 &amp; Bilson, apud Parker of the Cross, pt. 2, p. 33)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, … (Edinburgh, 1637) | pt. 2, ch. 9, p. 46</span></figcaption>

</figure><figure class="quote" id="q-7db125d72f" data-kw="">
<blockquote><p>Not that our Lord by this intended to confirm all sentences of excommunication, or to patronize any cheat or hypocrisy in any, to gain an absolution, or restoration to the church. But only, as to the first, to assure stubborn and impenitent sinners that he would ratify what his church did, according to the rule He had given them to act by… If therefore any be cast out of any church for professing or standing to any truth of the gospel, or because he will not do what is sinful, we must not understand them bound in heaven, though they be bound on earth, nor have any such excommunications any terror in them. How forcible are right words! But these arguings, what do they reprove? The church is not by this text made infallible, nor is the holy God by it engaged to defend their errors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 18, verse 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><figure class="quote" id="q-c81ef37003" data-kw="">
<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches, and Gregory de Valentia, as I show[ed] before (supra, Question 6 of this treatise), when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo, it [the Church’s judgment] cannot remove my doubting and beget faith; and also the conscience is so much the bolder to venture on a sin against God for fear of eschewing a sin against men, which is questionable, and [that] in a matter indifferent; this is also the stout conscience of Bonaventura (2 Sentences, dist. 39), plus est standum praecepto Praelati quam conscientiae.

7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>

</figure><figure class="quote" id="q-afc5f31ec4" data-kw="">
<blockquote><p>3. Suppose that the suffrage and voice of a pastor and of an elder be voices different only in diverse relations to diverse officers, to wit, the pastor and the elder; yet in the matter of bearing weight in the conscience from force of truth, and not from the authority of men, they are equal; and therefore ruling elders having knowledge and light, and withal authority of office, may well have voices [in Church courts]: But it follows not hence that these who have knowledge are formal canon-makers, because the decrees and constitutions of synods lay two obligations upon the people: [1.] One for the matter, and so in respect that in the moral part thereof they must be agreeable to the Word, they bind the consciences to an obedience of conscience. 2. They impose an ecclesiastical tie from the authority of the council and canon-makers, and so they require subjection or obedience of reverence for the authority-official that is in the canon-makers: The second command lays on the first bond or tie, and the first command lays on the other bond and tie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London, 1642), ch. 19, pp. 290-1</span></figcaption>

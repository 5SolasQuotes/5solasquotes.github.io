<main class="wrap"><figure class="quote" id="q-35192567de" data-kw="">
<blockquote><p>There are two great concerns of that religion whose name thou bearest, the profession of its truth, and the practice or exercise of its power. And these are mutually assistant unto each other. Without the profession of faith in its truth, no man can express its power in obedience; and without obedience profession is little worth.

Whatever, therefore, doth contribute help and assistance unto us in either of these, according to the mind of God, is to be highly prized and valued. Especially it is so in such a season as this, wherein the former of them is greatly questioned, and the latter greatly neglected, if not despised.

But if there be any thing which doth equally confirm and strengthen them both, it is certainly of great necessity in and unto religion, and will be so esteemed by them who place their principal concerns in these things. Now, such is the solemn observation of a sacred weekly day of rest unto God; for amongst all the outward means of conveying to the present generation that religion which was at first taught and delivered unto men by Jesus Christ and his apostles, there hath been none more effectual than the catholic, uninterrupted observation of such a day for the celebration of the religious worship appointed in the gospel. And many material parts of it were unquestionably preserved by the successively-continued agreement of Christians in this practice. So far, then, the profession of our Christian religion in the world at this day doth depend upon it.

How much it tends to the exercise and expression of the power of religion cannot but be evident unto all, unless they be such as hate it, who are not a few. With others it will quickly appear unto a sober and unprejudicated consideration; for no small part hereof doth consist in the constant payment of that homage of spiritual worship which we owe unto God in Jesus Christ. And the duties designed thereunto are the means which he hath appointed for the communication of grace and spiritual strength unto the due performance of the remainder of our obedience. In these things consist the services of this day; and the end of its observation is their duo performance, unto the glory of God and the advantage of our own souls.

Whereas, therefore, Christian religion may be considered two ways; first, as it is publicly and solemnly professed in the world, whereon the glory of God and the honour of Jesus Christ do greatly depend: and, secondly, as it prevails and results in the minds and lives of private men, neither of them can be maintained without a due observance of a stated day of sacred rest. Take this away, neglect and confusion will quickly cast out all regard unto solemn worship.

Neither did it ever thrive or flourish in the world from the foundation of it, nor will do so unto its end, without a due religious attendance unto such a day. Any man may easily foresee the disorder and profaneness which would ensue upon the taking away of that whereby our solemn assemblies are guided and preserved. Wherefore, by God’s own appointment, it had its beginning and will have its end with his public worship in this world. And take this off from the basis whereon God hath fixed it, and all human substitutions of any thing in the like kind to the same purposes will quickly discover their own vanity.

Nor without the advantage which it affords, as it is the sacred repository of all sanctifying ordinances, will religion long prevail in the minds and lives of private men; for it would be just with God to leave them to their own weaknesses and decays, which are sufficient to ruin them, who despise the assistance which he hath provided for them, and which he tenders unto them. Thus, also, we have known it to have fallen out with many in our days, whose apostasies from God have hence taken their rise and occasion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations Concerning the Name, Original, Nature, Use, and Continuance of a Day of Sacred Rest</cite>, in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. W. H. Goold (1671; 7 vols, Edinburgh: Johnston and Hunter, 1854), 2: 263-64.</span></figcaption>

<blockquote><p>43. Vocal prayer is either in prose, or in meter.

44. In meter singing is joined, and therefore there must be more care of the speech and tone, then in prose.

45. But the melody of singing is ordained for a certain spiritual delight, whereby the mind is detained in the meditation of the thing that is sung. … 48. But because this religious melody has the respect of prayers: therefore it is not so fit, that the Decalogue, and other such like which do not partake the nature of prayer, be turned into meter and be sung instead of psalms.</p></blockquote>

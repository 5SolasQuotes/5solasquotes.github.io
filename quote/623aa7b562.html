<main class="wrap"><figure class="quote" id="q-623aa7b562" data-kw="">
<blockquote><p>Now, the Scripture never mentions such an infallible judge on earth. Neither Pope, nor councils, possess the properties requisite to constitute a supreme judge in controversies of religion; for they are fallible, and have often eyed, and contradicted one another. Although the Church or her ministers are the official guardians of the Scriptures, … yet their authority is only ministerial, and their interpretations and decisions are binding on the conscience only in so far as they accord with the mind of the Spirit in the Scriptures.</p></blockquote>
<figcaption>— <a href="../authors/robert-shaw.html">Robert Shaw</a>, <cite>The Reformed Faith: An Exposition of the Westminster Confession of Faith</cite>, on ch. 1, §§ 9–10</figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

<figcaption>— <a href="../authors/william-cunningham.html">William Cunningham</a>, <cite>The Romanist Theory of Development</cite>, p. 6</figcaption>

</figure><figure class="quote" id="q-3f153cbdb3" data-kw="">
<blockquote><p>Sola Scriptura (&quot;by Scripture alone&quot;). The Holy Scriptures are our supreme and only rule of faith and life; they, not human tradition and reasoning, determine our faith and command our obedience. … Our minds are servants to receive the Word, not to judge it.</p></blockquote>

</figure><figure class="quote" id="q-5a492649a0" data-kw="">
<blockquote><p>The authority of the Word is derived from the Word itself. The church cannot be the foundation upon which one believes that the Scriptures are the Word of God, for: First, the church derives all its authority from the Word. … Thus, we do not believe the Word to be the Word of God because the church affirms it, but on the contrary, we believe the church to be the true church because the Word validates her as such.</p></blockquote>
<figcaption>— <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a>, <cite>The Christian&#x27;s Reasonable Service</cite>, vol. 1, ch. 2, p. 29</figcaption>

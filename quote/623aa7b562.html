<main class="wrap"><figure class="quote" id="q-623aa7b562" data-kw="">
<blockquote><p>The Scripture never mentions such an infallible judge on earth. Neither Pope, nor councils, possess the properties requisite to constitute a supreme judge in controversies of religion; for they are fallible, and have often eyed, and contradicted one another. Although the Church or her ministers are the official guardians of the Scriptures, … yet their authority is only ministerial, and their interpretations and decisions are binding on the conscience only in so far as they accord with the mind of the Spirit in the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Faith: An Exposition of the Westminster Confession of Faith</cite>, on ch. 1, §§ 9–10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-694d9cd5ae" data-kw="">
<blockquote><p>Further, he took upon him power, rule, and authority over the Christian church, and over the Holy Scriptures, the Word of God; … They who, against God&#x27;s Word, boast of the church&#x27;s authority, are mere idiots. The pope attributes more power to the church, which is begotten and born, than to the Word, which has begotten, conceived, and borne the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Table Talk</cite>, Of the Pope, CCCCLIII, p. 269</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-churchs-authority-over-scripture.html">The church&#x27;s authority over Scripture</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“Further, he took upon him power, rule, and authority over the Christian church, and over the Holy Scriptures, the Word of God; … They who, against God&#x27;s Word, boast of the church&#x27;s authority, are mere idiots. The pope attributes more power to the church, which is begotten and born, than to the Word, which has begotten, conceived, and borne the church.”

— Martin Luther, Table Talk, Of the Pope, CCCCLIII, p. 269">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFurther%2C+he+took+upon+him+power%2C+rule%2C+and+authority+over+the+Christian+church%2C+and+over+the+Holy+Scriptures%2C+the+Word+of+God%3B+%E2%80%A6+They+who%2C+against+God%27s+Word%2C+boast+of+the+church%27s+authority%2C+are+mere+idiots.+The+pope+attributes+more+power+to+the+church%2C+which+is+begotten+and+born%2C+than+to+the+Word%2C+which+has+begotten%2C+conceived%2C+and+borne+the+church.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Table+Talk%2C+Of+the+Pope%2C+CCCCLIII%2C+p.+269&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F694d9cd5ae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/694d9cd5ae.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-a7d656db67" data-kw="Augustine Authority of the church">
<blockquote><p>Augustine, therefore, does not here say that the faith of the godly is founded on the authority of the Church; nor does he mean that the certainty of the gospel depends upon it; … the obvious inference from them is, that this holy man had no intention to suspend our faith in Scripture on the nod or decision of the Church, but only to intimate (what we too admit to be true) that those who are not yet enlightened by the Spirit of God, become teachable by reverence for the Church, and thus submit to learn the faith of Christ from the gospel. In this way, though the authority of the Church leads us on, and prepares us to believe in the gospel, it is plain that Augustine would have the certainty of the godly to rest on a very different foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.7.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-churchs-authority-over-scripture.html">The church&#x27;s authority over Scripture</a></span><span class="t"><a href="../topics/the-church/churchs-authority-and-power.html">Church&#x27;s Authority and Power</a> › <a href="../topics/the-church/churchs-authority-and-power/the-churchs-authority-over-scripture.html">The church&#x27;s authority over Scripture</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><figure class="quote" id="q-63559a9ac2" data-kw="Scripture interprets Scripture">
<blockquote><p>Whatever, then, the papists talk so vauntingly of fathers and of councils, yet it is to their ecclesiastical prince, that is to the pope, that all controversies are finally referred, and with that prince and supreme interpreter rests the whole meaning of scripture and the right of adjudicating upon it. But we do not acknowledge that prince, whom Christ never constituted; and we say that the scripture itself publicly set forth and propounded is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 7</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Whatever, then, the papists talk so vauntingly of fathers and of councils, yet it is to their ecclesiastical prince, that is to the pope, that all controversies are finally referred, and with that prince and supreme interpreter rests the whole meaning of scripture and the right of adjudicating upon it. But we do not acknowledge that prince, whom Christ never constituted; and we say that the scripture itself publicly set forth and propounded is its own interpreter.”

— William Whitaker, A Disputation on Holy Scripture, Question 5, ch. 7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhatever%2C+then%2C+the+papists+talk+so+vauntingly+of+fathers+and+of+councils%2C+yet+it+is+to+their+ecclesiastical+prince%2C+that+is+to+the+pope%2C+that+all+controversies+are+finally+referred%2C+and+with+that+prince+and+supreme+interpreter+rests+the+whole+meaning+of+scripture+and+the+right+of+adjudicating+upon+it.+But+we+do+not+acknowledge+that+prince%2C+whom+Christ+never+constituted%3B+and+we+say+that+the+scripture+itself+publicly+set+forth+and+propounded+is+its+own+interpreter.%E2%80%9D%0A%0A%E2%80%94+William+Whitaker%2C+A+Disputation+on+Holy+Scripture%2C+Question+5%2C+ch.+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F63559a9ac2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/63559a9ac2.html">Permalink</a><a class="src" href="https://archive.org/details/disputationonhol00whituoft" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-ee0846291f" data-kw="">
<blockquote><p>He studies not the Scripture as he should, which studies not providence as he should; we should compare Gods promises and providences together. What we hear of him in his Word, with what we see in his Works.</p></blockquote>

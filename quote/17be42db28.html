<blockquote><p>I lay down this maxim of divinity: Tyranny being a work of Satan, is not from God, because sin, either habitual or actual, is not from God; the power that ‘is’ [Rom. 13:1], must be from God; the magistrate as magistrate, is good, in nature of office, and the intrinsecal end of his office, Rom. 13:4, for he is the minister of God for thy good; and therefore a power ethical, politic, or moral, to oppress, is not from God, and is not a power, but a licentious deviation of a power, and is no more from God (but from sinful nature, and the old serpent) than a license to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), p. 34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+lay+down+this+maxim+of+divinity%3A+Tyranny+being+a+work+of+Satan%2C+is+not+from+God%2C+because+sin%2C+either+habitual+or+actual%2C+is+not+from+God%3B+the+power+that+%E2%80%98is%E2%80%99+%5BRom.+13%3A1%5D%2C+must+be+from+God%3B+the+magistrate+as+magistrate%2C+is+good%2C+in+nature+of+office%2C+and+the+intrinsecal+end+of+his+office%2C+Rom.+13%3A4%2C+for+he+is+the+minister+of+God+for+thy+good%3B+and+therefore+a+power+ethical%2C+politic%2C+or+moral%2C+to+oppress%2C+is+not+from+God%2C+and+is+not+a+power%2C+but+a+licentious+deviation+of+a+power%2C+and+is+no+more+from+God+%28but+from+sinful+nature%2C+and+the+old+serpent%29+than+a+license+to+sin.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcbf3704f54.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cbf3704f54.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=I%20lay%20down%20this%20maxim%20of,serpent%29%20than%20a%20license%20to%20sin&amp;text=I%20lay%20down%20this%20maxim%20of%20divinity%3A%20Tyranny&amp;text=the%20old%20serpent%29%20than%20a%20license%20to%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0dcd26448c" data-kw="">
<blockquote><p>From whence we take the freedom to entreat you for God’s sake, strictly to inspect into vocations and employments, that they be not mixed nor confounded to the detriment both of the one and other. The ministerial function is expressly limited by the Word of God as to its laws, ends, means and actings, it being altogether different from, yea and totally contrary to the secular government; And we conceive that there is no such difficulty in the matter, but that ministers may be kept within the inviolable bounds of their most holy calling, and yet be useful unto the public without glorying in those little arts of subtilties and surprisals, which abutt at no other mark than temporal and carnal profit. Besides that ’tis a very rare thing to find a man capable both of the one and other calling, there is this grand mischief in it, that flesh and blood seeing in the holy ministry nothing but what is mean and humble, despicable, and painful, difficult and dangerous, and contrariwise meeting in the management of secular affairs with food and fuel enough for pride, ambition and covetousness (the ground of all envies and jealousies), and with the means and helps to carry on designs of self-advancement and domination, as tricks, craft and dissimulation; It will be almost impossible to hinder the spreading of this contagion, which creeps insensibly into the greatest wits, and seizes upon them at unawares, and not as an affected and approved vice. We know very well, that necessity, the law of the present day, is pleaded and urged on behalf of this practice, too too much in use among you to vindicate and justify it. But for God’s sake, most dear brethren, we beseech you to consider, whether it were not better that your temporal affair should suffer some inconveniencies, than your spiritual ones to be contaminated; And whether the great risk you run in ruining and depraving your pastors should be preferred unto your temporal interests. And whether it were not better to have a reserve among you of some pure and savory salt against the general corruption, rather than to hazard all in this universal overthrow by the world, upon which theater we see the most valiant champions to be foiled. If the necessity be absolute, peremptory and indispensable, then let them go about such secular political affairs with regret and grief, troubled at their enforced distraction from their heavenly calling, lamenting as the spouse in the Canticles that they have made me the keeper of the vineyard, but mine own vineyard have I not kept. Let them go, but then only, when your businesses are in extreme danger, as it were at the last gasp, when you need the greatest circumspection, a most immovable fidelity, and unchangeable integrity, and without any affectation or introduction of ambition, or hidden, disguised interests. No man going to war entangles himself with the world, that so he may the better please his Captain that has listed him. That commination is very dreadful, the priest shall be as the people, and that lamentation exceeding doleful, All this evil and mischief is from the prophets, and the stones of the sanctuary are lying at the four corners of the streets. Let us, most dear and honored brethren, give up and resign ourselves to the conduct of true wisdom, speaking to us from the Word of God, which is, to forsake our own. This also, most honored brethren should be endeavored, that all persons whatsoever in the ministry, when called forth unto those secondary employments of the Church, do retain in their deportments and conversations the marks and characters of their first and most sacred vocation. Let their devotion, piety, gravity, self-denial, and sequestration from worldly pleasures, used with too great a liberty by many Christian statesmen serve to maintain the sweet odor and reputation of our Church government, and to keep up inviolably the authority of their most holy ministry, and to bind the souls and consciences of men by religious humility to an everlasting dependance on the majesty of their great Lord, whose holiness and sovereign wisdom shines forth most resplendently in the order of his service, as the Queen of Sheba saw and admired it in the Court of Solomon. Impiety and impudence are too much in vogue everywhere. But let the sanctuary, the Church of God be at least the receptacle and habitation of true and unfeigned piety, where it may act and breath freely at in the open air, with an uplifted countenance, in a courageous demonstration of the Spirit, and evidence of Truth, convincing and condemning the unfruitful works of darkness, and awakening with its bright shining flambeau the drowzy consciences of a perverse generation, it may encourage the faithful unto perseverance, and preserve the remnant of Jacob in this day of dispersions and desolations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Synod 21, of Tonneins, 1614, ch. 19, A Letter from the Church of Geneva. To the National Synod of the Reformed Churches of France assembled at Tonneins, pp. 441-42</span></figcaption>

— French Reformed, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Synod 21, of Tonneins, 1614, ch. 19, A Letter from the Church of Geneva. To the National Synod of the Reformed Churches of France assembled at Tonneins, pp. 441-42">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFrom+whence+we+take+the+freedom+to+entreat+you+for+God%E2%80%99s+sake%2C+strictly+to+inspect+into+vocations+and+employments%2C+that+they+be+not+mixed+nor+confounded+to+the+detriment+both+of+the+one+and+other.+The+ministerial+function+is+expressly+limited+by+the+Word+of+God+as+to+its+laws%2C+ends%2C+means+and+actings%2C+it+being+altogether+different+from%2C+yea+and+totally+contrary+to+the+secular+government%3B+And+we+conceive+that+there+is+no+such+difficulty+in+the+matter%2C+but+that+ministers+may+be+kept+within+the+inviolable+bounds+of+their+most+holy+calling%2C+and+yet+be+useful+unto+the+public+without+glorying+in+those+little+arts+of+subtilties+and+surprisals%2C+which+abutt+at+no+other+mark+than+temporal+and+carnal+profit.+Besides+that+%E2%80%99tis+a+very+rare+thing+to+find+a+man+capable+both+of+the+one+and+other+calling%2C+there+is+this+grand+mischief+in+it%2C+that+flesh+and+blood+seeing+in+the+holy+ministry+nothing+but+what+is+mean+and+humble%2C+despicable%2C+and+painful%2C+difficult+and+dangerous%2C+and+contrariwise+meeting+in+the+management+of+secular+affairs+with+food+and+fuel+enough+for+pride%2C+ambition+and+covetousness+%28the+ground+of+all+envies+and+jealousies%29%2C+and+with+the+means+and+helps+to+carry+on+designs+of+self-advancement+and+domination%2C+as+tricks%2C+craft+and+dissimulation%3B+It+will+be+almost+impossible+to+hinder+the+spreading+of+this+contagion%2C+which+creeps+insensibly+into+the+greatest+wits%2C+and+seizes+upon+them+at+unawares%2C+and+not+as+an+affected+and+approved+vice.+We+know+very+well%2C+that+n vored%2C+that+all+persons+whatsoever+in+the+ministry%2C+when+called+forth+unto+those+secondary+employments+of+the+Church%2C+do+retain+in+their+deportments+and+conversations+the+marks+and+characters+of+their+first+and+most+sacred+vocation.+Let+their+devotion%2C+piety%2C+gravity%2C+self-denial%2C+and+sequestration+from+worldly+pleasures%2C+used+with+too+great+a+liberty+by+many+Christian+statesmen+serve+to+maintain+the+sweet+odor+and+reputation+of+our+Church+government%2C+and+to+keep+up+inviolably+the+authority+of+their+most+holy+ministry%2C+and+to+bind+the+souls+and+consciences+of+men+by+religious+humility+to+an+everlasting+dependance+on+the+majesty+of+their+great+Lord%2C+whose+holiness+and+sovereign+wisdom+shines+forth+most+resplendently+in+the+order+of+his+service%2C+as+the+Queen+of+Sheba+saw+and+admired+it+in+the+Court+of+Solomon.+Impiety+and+impudence+are+too+much+in+vogue+everywhere.+But+let+the+sanctuary%2C+the+Church+of+God+be+at+least+the+receptacle+and+habitation+of+true+and+unfeigned+piety%2C+where+it+may+act+and+breath+freely+at+in+the+open+air%2C+with+an+uplifted+countenance%2C+in+a+courageous+demonstration+of+the+Spirit%2C+and+evidence+of+Truth%2C+convincing+and+condemning+the+unfruitful+works+of+darkness%2C+and+awakening+with+its+bright+shining+flambeau+the+drowzy+consciences+of+a+perverse+generation%2C+it+may+encourage+the+faithful+unto+perseverance%2C+and+preserve+the+remnant+of+Jacob+in+this+day+of+dispersions+and+desolations.%E2%80%9D%0A%0A%E2%80%94+French+Reformed%2C+ed.+John+Quick%2CSynodicon+in+Gallia+reformata%2C+or%2C+The+Acts%2C+Decisions%2C+Decrees+%26+Canons+of+those+Famous+National+Councils+of+the+Reformed+Churches+in+France+%28London%3A+Parkhurst%2C+1692%29%2C+Synod+21%2C+of+Tonneins%2C+1614%2C+ch.+19%2C+A+Letter+from+the+Church+of+Geneva.+To+the+National+Synod+of+the+Reformed+Churches+of+France+assembled+at+Tonneins%2C+pp.+441-42&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0dcd26448c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0dcd26448c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=From%20whence%20we%20take%20the%20freedom,this%20day%20of%20dispersions%20and%20desolations&amp;text=From%20whence%20we%20take%20the%20freedom%20to%20entreat&amp;text=Jacob%20in%20this%20day%20of%20dispersions%20and%20desolations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

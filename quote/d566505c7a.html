<main class="wrap"><figure class="quote" id="q-d566505c7a" data-kw="">
<blockquote><p>All other things were by him [God] brought out of nothing, in consequence of a free act of his will by means of his infinite power; so that they may be justly called mere contingencies, and he is the only necessarily existent being. Nay, he is the only really existent being. … This is likewise implied in the exalted name Jehovah, which expresses his being, and that he has it from himself … This idea of a first and eternal being is again inseparably connected with an infinite degree of all possible perfection, together with immutability, and absolute perseverance therein. … In life manner, if we suppose God to be the first of all beings, we must, unavoidably, therefrom, conclude his unity …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures, Read in the Publick Hall of the University of Edinburgh. Together with Exhortations to the Candidates for the Degree of Master of Arts</cite>, (London: Plato’s Head, 1763), Lect. XXI, pp 242, 244.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/spirituality-and-aseity.html">Spirituality and Aseity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c9a3fb49c" data-kw="">
<blockquote><p>God is independent altogether, and self-sufficient. This is his royal prerogative, wherein he infinitely transcends all created perfection. “He is of himself, and for himself,” from no other, and for no other, “but of him, and for him are all things.” He is the fountain-head; you ought to follow the streams up to it, and then to rest: for you can go no further. …

As God’s being is independent, so that he cannot be expressed by any name, more suitable than such as he takes to himself, “I am that I am;” importing a boundless, ineffable, absolute and transcendent being, beside which, no creature deserves so much as to have the name of being, or to be made mention of in one day with his name, because his glorious light makes the poor derived shadow of light in other creatures to disappear, and to evanish out of the world of beings: so it is the glorious perfection of his nature, that he doth all things for himself, for his own name, Prov. Xvi. 4, and his glory is as dear to him, as himself. Isa. xlii. 8, “I am the Lord, that is my name, and therefore my glory will I give to no other …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of the Christian Religion, Clearly Proved, and Singularly Improved. Or, A Practical Catechism</cite>, (1672) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), i, 9-10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/spirituality-and-aseity.html">Spirituality and Aseity</a></span></div>

</figure><figure class="quote" id="q-f561921893" data-kw="">
<blockquote><p>13 God gave being unto all things Therefore he is the first, chief and independent Being.

14 He is [a se], that is, He hath his Being from himself. Scal. He is … Being above all beings. Dionys. lib. 1 De Divinis nom. cap. 1.

15 He is the Essence of all essences the Creator of all creatures, the Life of all lives, the Cause of all causes.

16 He it is that giveth all unto all but receiveth not ought from any.

17 Above him, is nothing; without him, is nothing; beneath him, is nothing: Under him, is all; in him, is all with him, is all: From him, are all things by him, are all things; in him, are all things. Aug. De Spec. cap. 33.

18 Between the Essence of God and the essence of the creatures there is an infinite difference: God’s Essence is after a singular, peculiar, and supereminent manner.</p></blockquote>

</figure><figure class="quote" id="q-ddf232c959" data-kw="">
<blockquote><p>Some may not be used to thinking of God as an unmoved mover. Yet is not the first cause of all things God? If God is anything He is that. But many more attributes may be derived from the unmoved mover being pure act,ª which will show that we are dealing with God. ª This is not accidental. Just as (1) the attributes of a thing derive from its kind of existence, so (2) if God’s existence or being may be established and that it is of itself, or from itself (aseity), (3) its absoluteness, independence and primacy being herein established, (4) and everything else must flow out of this first principle and (5) must be systematically related to it, it ought to be expected that many attributes of the first principle may be further drawn out. See the footnote below on classic reformed theology and Mastricht. … While we could go on for some time deriving many of the attributes of the unmoved mover from nature’s light, such an exercise in natural theology is unnecessary here.° It is clear we are dealing with God. ° While classic reformed theology during the Post-Reformation varied with how far God’s attributes might be derived from nature’s light alone, especially with regard to epistemology after the Fall (in distinction from metaphysics from pure-nature), yet there is good reason, said Mastricht, to think “all the attributes of God are established in this primacy” of God’s being. All attributes of things depend upon and flow out of the characteristic being of the thing. If one establishes the greater, one establishes (at least theoretically) all the lesser. Thus if God’s “aseity [from Himself-ness], independence and primacy” (which things inhere from being pure act) are proved, from this may be deduced, according to Mastricht, God’s unity, immutability, infinity, simplicity, life, intellect, will, omnipotence and “the virtues of the intellect and will—wisdom, goodness, grace, holiness, and others…” Theoretical-Practical Theology, vol. 2, bk. 2, ch. 3, sect. 16, pp. 84-85 In most of the subsequent chapters on God’s attributes Mastricht has a specific section on how each attribute may be derived “from reasons”.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Proof for God’s Existence from Change’</cite>, (2024), 3. The Unmoved Mover is God: further Attributes</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/spirituality-and-aseity.html">Spirituality and Aseity</a></span></div>

</figure><figure class="quote" id="q-273e5c17f4" data-kw="Jehovah self-existent">
<blockquote><p>God is both a being singular in the highest sense, and in his own nature distinct from every thing whatsoever. He is Jehovah, independent of any other, self-existent—“I am that I am” (Ex. 3:14). Hence he is called simply the being, as the ancient philosophers and Plato especially acknowledged.</p></blockquote>

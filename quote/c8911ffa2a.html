<main class="wrap"><figure class="quote" id="q-c8911ffa2a" data-kw="">
<blockquote><p>IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1635), ch. 27, ‘How far, and in what sense Christ died for all’, pp. 226-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3256c57b2a" data-kw="">
<blockquote><p>Question 20. Did God leave all mankind to perish in the estate of sin and misery; A. God having out of his mere good pleasure, from all eternity, elected some to everlasting life… to deliver them out of an estate of sin and misery; and to bring them into an estate of salvation by a Redeemer. Q. 1. Are same persons chosen to salvation, and others left? A. Yes: God has chosen some to salvation, and passed by others; as the Scriptures speak; See Rom. 8:30… … Q. 7. What learn you from God’s election? What cause we have to admire free-grace in our choice, who were no better than others; Eph. 2:3. And were by nature children of wrath even as others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of the Salvation of God’s Elect &amp; of the Covenant of Grace’ on Question 20 in An Exposition of the Assembly’s Catechism in Works</cite>, (London: Baynes, 1820), vol. 6, pp. 174-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>
<div class="actions"><button class="copy" data-copy="“Question 20. Did God leave all mankind to perish in the estate of sin and misery; A. God having out of his mere good pleasure, from all eternity, elected some to everlasting life… to deliver them out of an estate of sin and misery; and to bring them into an estate of salvation by a Redeemer. Q. 1. Are same persons chosen to salvation, and others left? A. Yes: God has chosen some to salvation, and passed by others; as the Scriptures speak; See Rom. 8:30… … Q. 7. What learn you from God’s election? What cause we have to admire free-grace in our choice, who were no better than others; Eph. 2:3. And were by nature children of wrath even as others.”

</figure><figure class="quote" id="q-49d3983410" data-kw="unconditional election good pleasure">
<blockquote><p>Election was made from God’s mere good pleasure; therefore, not on account of Christ [as antecedent cause] because good pleasure excludes every cause out of God upon which election may depend. … “That the purpose of God according to election might stand, not of works, but of him that calleth” (Rom. 9:11); “It is not of him that willeth, nor of him that runneth, but of God that sheweth mercy” (Rom. 9:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.10.5</span></figcaption>

</figure><figure class="quote" id="q-3137406937" data-kw="">
<blockquote><p>As Muller perceptively notes, however, the concept of Christ as fundamentum electionis became problematic only when the name Christ was no longer “loosely” applied after the fashion of Calvin, but “strictly” applied as the title of the elected mediator. (Christ &amp; the Decree, 156– 57) Later generations arose to further the basic christological and soteriological insights of the earliest Reformers in a “new language” with “a more strict theological method.” (Christ &amp; the Decree, 131)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-pomplun.html">Robert Pomplun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Predestined a Passible Redeemer</cite>, “Predestined a Passible Redeemer: Scientia Media in Early Modern Christologies” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a></span></div>
<div class="actions"><button class="copy" data-copy="“As Muller perceptively notes, however, the concept of Christ as fundamentum electionis became problematic only when the name Christ was no longer “loosely” applied after the fashion of Calvin, but “strictly” applied as the title of the elected mediator. (Christ &amp; the Decree, 156– 57) Later generations arose to further the basic christological and soteriological insights of the earliest Reformers in a “new language” with “a more strict theological method.” (Christ &amp; the Decree, 131)”

— Robert Pomplun, “Predestined a Passible Redeemer: Scientia Media in Early Modern Christologies” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 89">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+Muller+perceptively+notes%2C+however%2C+the+concept+of+Christ+as+fundamentum+electionis+became+problematic+only+when+the+name+Christ+was+no+longer+%E2%80%9Cloosely%E2%80%9D+applied+after+the+fashion+of+Calvin%2C+but+%E2%80%9Cstrictly%E2%80%9D+applied+as+the+title+of+the+elected+mediator.+%28Christ+%26+the+Decree%2C+156%E2%80%93+57%29+Later+generations+arose+to+further+the+basic+christological+and+soteriological+insights+of+the+earliest+Reformers+in+a+%E2%80%9Cnew+language%E2%80%9D+with+%E2%80%9Ca+more+strict+theological+method.%E2%80%9D+%28Christ+%26+the+Decree%2C+131%29%E2%80%9D%0A%0A%E2%80%94+Robert+Pomplun%2C+%E2%80%9CPredestined+a+Passible+Redeemer%3A+Scientia+Media+in+Early+Modern+Christologies%E2%80%9D+in+eds.+Ballor%2C+Gaetano+%26+Sytsma%2C+Beyond+Dordt+%26+De+Auxiliis%3A+the+Dynamics+of+Protestant+%26+Catholic+Soteriology+in+the+Sixteenth+%26+Seventeenth+Centuries+%28Brill%2C+2019%29%2C+p.+89&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3137406937.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3137406937.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-decrees-of-god#:~:text=As%20Muller%20perceptively%20notes%2C%20however%2C%20the,method.%E2%80%9D%20%28Christ%20%26%20the%20Decree%2C%20131&amp;text=As%20Muller%20perceptively%20notes%2C%20however%2C%20the%20concept%20of&amp;text=strict%20theological%20method.%E2%80%9D%20%28Christ%20%26%20the%20Decree%2C%20131" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a8ae778da8" data-kw="">
<blockquote><p>Before the foundation of the world, by sheer grace, according to the free good pleasure of his will, God chose in Christ to salvation a definite number of particular people out of the entire human race, which had fallen by its own fault from its original innocence into sin and ruin. Those chosen were neither better nor more deserving than the others, but lay with them in the common misery. God did this in Christ, whom he also appointed from eternity to be the mediator, the head of all those chosen, and the foundation of their salvation. And so God decreed to give to Christ those chosen for salvation, and to call and draw them effectively into Christ’s fellowship through the Word and Spirit. In other words, God decreed to grant them true faith in Christ, to justify them, to sanctify them, and finally, after powerfully preserving them in the fellowship of the Son, to glorify them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 7</span></figcaption>

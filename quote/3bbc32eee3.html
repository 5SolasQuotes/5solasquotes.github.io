<blockquote><p>It is the parents’ office to teach and instruct their children. That teaching or instructing consisteth in three things, – in religion, in manners, and skill of an occupation. […] Let them often and many times cause them to repeat the catechism, and beat into their heads such sentences as are most necessary to put them in memory of their faith and duty of life.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5add384d7" data-kw="">
<blockquote><p>If you ask, ‘Whom must we learn of?’ I answer: Of those that know, and have learned themselves. No name or title, or relation, or habit will enable any man to teach you that which he knows not himself.

1. Children must learn of their parents and tutors.

2. People must learn of their able, faithful pastors and catechizers.

3. All Christians must be teachers by charitable helps to one another…

4. Take nothing as necessary to the being of Christianity and to salvation which is not recorded in the Scripture and has not been held as necessary by all true Christians in every age and place…

5. Maintain the unity of the Spirit in the bond of peace with all true Christians as such, and live in love in the communion of saints…

6. Prefer not any odd or singular sect before the universal consent of the faithful in your learning or communion, so far as the judgment of men is to be regarded…

7. Never set a doubtful opinion against a certain truth or duty: reduce not things certain to things uncertain; but contrarily uncertain things to certain: for instance, It is certain that you ought to live in love and peace with all that are true Christians, and to do good to all and wrong to none: Let not any doubtful difference make you violate this rule, and hate, and slander and backbite, and hurt them for a doubtful, indifferent or unnecessary thing…

8. Faithfully serve Christ as far as you have attained, and be true to all the truth that you know; sin not by omission or practice against the knowledge which you have, lest God in justice give up your understanding to believe a lie.

9. Remember that all men on earth are ignorant, and know but as in a glass, and in part, and therefore the best have many errors: No man knows the smallest grass or worm with an adequate, perfect knowledge. And if God bear with multitudes of errors in us all, we must bear with such as are tolerable in each other… Divinity is not less mysterious than Law and Physic, etc. where controversies abound.

10. Yet stilt not yourselves in knowledge, nor say we have learned enough, but continue as Christ’s scholars in learning more and more to the death: the wisest know little, and may still increase. There is a great difference in excellency, usefulness and comfort between men of clear digested knowledge, and confused undigested apprehensions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 283-87 in Sermon 11, ‘The Cure of Melancholy &amp; Overmuch Sorrow by Faith &amp; Physic’ in A Continuation of Morning-Exercise Questions &amp; Cases of Conscience Practicaly Resolved by Sundry Ministers in October, 1682 ed. Samuel Annesley (London: Dunton, 1683), pp. 285-87</span></figcaption>

</figure><figure class="quote" id="q-d2f770b046" data-kw="">
<blockquote><p>It remains, then, that the church founded in the covenant, and unto which all the promises did and do belong, abode at the coming of Christ, and doth abide ever since, in and among those who are the children of Abraham by faith. The old church was not taken away, and a new one set up, but the same church was continued, only in those who by faith inherited the promises. Great alterations, indeed, were then made in the outward state and condition of the church; as,— (1.) The carnal privilege of the Jews, in their separation to bring forth the Messiah, then failed; and therewith their claim on that account to be the children of Abraham. (2.) The ordinances of worship suited unto that privilege expired and came to an end. (3.) New ordinances of worship were appointed, suited unto the new light and grace then granted unto the church. (4.) The Gentiles came in to the faith of Abraham together with the Jews, to be fellow-heirs with them in his blessing. But none of these, nor all of them together, made any such alteration in the church but that it was still one and the same. The olive-tree was the same, only some branches were broken off, and others planted in; the Jews fell, and the Gentiles came in their room.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 1.124. Emphasis added.</span></figcaption>

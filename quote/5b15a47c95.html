<main class="wrap"><figure class="quote" id="q-5b15a47c95" data-kw="">
<blockquote><p>[And I lay down my life for the sheep.] Our Lord, to show how truly He is the Good Shepherd, declares that like a good shepherd He not only knows all His sheep, but lays down His life for them. By using the present tense He seems to say, “I am doing it. I am just about to do it. I came into the world to do it.” This can only refer to His own atoning death on the cross, the great propitiation He was about to make by shedding His life blood. It was the highest proof of love. “Greater love hath no man than this, that a man lay down his life for his friends.” (John xv.13.)

Taken alone and by itself, this sentence undoubtedly contains the doctrine of particular redemption. It declares that Christ “lays down His life for the sheep.” That He does so in a special sense I think none can deny. The “sheep” alone, or true believers, obtain any saving benefit from His death. But to argue from this text that in no sense and in no way did Christ die for any beside His “sheep” is to say what seems to me to contradict Scripture. The plain truth is that the extent of redemption is not the leading subject of this verse. Our Lord is saying what He does for His sheep; He loves them so that He dies for them. But it does not follow that we are to conclude that His death was not meant to influence and affect the position of all mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on John: Volume 2</cite>, (1869; Edinburgh: Banner of Truth, 1987), p. 221.</span></figcaption>

</figure><figure class="quote" id="q-d993dbab6f" data-kw="">
<blockquote><p>A Christian [according to the Westminster Confession of Faith] may take up the lawful calling of a magistrate, in contrast to Anabaptism. A magistrate must not exercise his rule in sacred things, in contrast to Erastianism. An infidel magistrate still possesses legal authority, in contrast with Romanism. Although Anabaptism, Erastianism, and Romanism are quite divergent systems, the three share one underlying assumption in their views of the relationship of the State to Christianity–they all teach that lawful civil power is, in some way or another, derived from Jesus Christ as Mediator. Anabaptists denied that non-Christian government is ordained of God. As Robert Baillie relates, they considered the saints to be those who were ‘joined to their Churches and received their Anabaptisme; all the rest of them were wicked and to be cut off.’ Erastians asserted, in the words of Thomas Coleman, ‘that God hath given all magistracy to Christ to be managed under him, for him.’ Romanists made magistrates servants to the papacy. Samuel Rutherford wrote, ‘Stapleton, Bellarmine, and Papists will have them [princes] to be brutish servants, to execute whatsoever the Pope and Councils shall decree, good or bad, without examination.’ All three systems differ as to the application of this principle and the place where ultimate jurisdiction is to be vested–Anabaptists placing it in the Conscience, Erastians in the King, and Romanists in the Pope–but they agree on the principle itself, that Jesus Christ as Mediator is the foundation of civil power. In opposing these three errors, the Westminster divines, with the exception of the Erastian representatives, rejected the view that the civil magistrate derives his authority from Christ as Mediator. Rather, it is from God as the Creator and Supreme Ruler that magistrates receive power… … In contrast to the teaching of the Confession and its framers, theonomy rejects the nature-grace distinction and teaches that the civil magistrate is subservient to Christ as Mediator. Greg Bahnsen claims that ‘A nature/grace dichotomy in the area of civil government is totally alien to the scriptural outlook’ (Theonomy in Christian Ethics, 433). It is taught that ‘the Lord’s Messiah has absolute, firm, and autocratic authority over all the magistrates of the nations; they are guided, directed, and chastised by Him’ (362). The apostle Paul is alleged to have ‘subordinated the authority of Caesar to that of King Jesus’ and ‘by his teaching of the Kingship of Christ Paul was opposing the decrees of autocratic Caesar’ (395).¹ ¹ The Westminster Annotations take the opposite view, and judge the allegation made against Paul and Silas [in Acts 17:7] to be nothing less than a false aspersion cast upon them by the Jews. It also comments, ‘Paul and Silas endeavored to advance the spiritual kingdom of Christ, without any injury to the Roman Empire… the ancient Christians were no disturbers of States.’ ‘Annotations on the Acts of the Apostle’s,’ in The Second Volume of Annotations, on Acts 17:7. Finally it is maintained [by Bahnsen], ‘The only ultimate King in civil government is Christ, and all rulers of the nations derive their authority from Him; hence all magistrates are subject to Christ’s word, even Christ’s confirmation of every bit of the law (Matt 17f.)… National leaders have no exemption from the law of God just as they have no escape from the universal Lordship of Christ’ (429). The civil magistrate, according to this [theonomic] view of it, is a ‘Christocracy’ (432). This means that ‘state leaders are just as obligated to follow Christ’s direction as the church elders are required to obey the Head of the Church’ (433).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-winzer.html">Matthew Winzer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Westminster Assembly and the Judicial Law’ in Confessional Presbyterian</cite>, vol. 5 (2009), pp. 74, 76-77</span></figcaption>

<blockquote><p>It is clear that a mediator and deliverer who will satisfy the claims of God’s holy justice on behalf of the impotent sinner must necessarily have a truly human soul and must possess a human body—and he must thus be very man. The nature of the satisfaction to be made to God’s justice on behalf of sinful man absolutely requires it, and therefore, as far as God is concerned, none but He who is very man can be our surety, mediator, and deliverer. …

God therefore caused this truth regarding the human nature of the mediator to be proclaimed to believers from the foundation of the world. He introduced Him to our first parents as the Seed of the woman (Gen. 3:15). Subsequently, God made this truth known to believers much more clearly and powerfully by shadows and types, as well as by prophecy. Consider especially this clear prophecy: “Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel” (Isa. 7:14). The name Immanuel means “God with us”; that is, God and man in one person.

All this makes it very clear that He who is to be the mediator and deliverer of impotent and guilty sinners in order to satisfy God’s holy justice and thereby reconcile and unite them to God must necessarily be very man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 74, 75.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is clear that a mediator and deliverer who will satisfy the claims of God’s holy justice on behalf of the impotent sinner must necessarily have a truly human soul and must possess a human body—and he must thus be very man. The nature of the satisfaction to be made to God’s justice on behalf of sinful man absolutely requires it, and therefore, as far as God is concerned, none but He who is very man can be our surety, mediator, and deliverer. …

God therefore caused this truth regarding the human nature of the mediator to be proclaimed to believers from the foundation of the world. He introduced Him to our first parents as the Seed of the woman (Gen. 3:15). Subsequently, God made this truth known to believers much more clearly and powerfully by shadows and types, as well as by prophecy. Consider especially this clear prophecy: “Behold, a virgin shall conceive, and bear a son, and shall call his name Immanuel” (Isa. 7:14). The name Immanuel means “God with us”; that is, God and man in one person.

All this makes it very clear that He who is to be the mediator and deliverer of impotent and guilty sinners in order to satisfy God’s holy justice and thereby reconcile and unite them to God must necessarily be very man.”

— Theodorus VanderGroe, The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 74, 75.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+clear+that+a+mediator+and+deliverer+who+will+satisfy+the+claims+of+God%E2%80%99s+holy+justice+on+behalf+of+the+impotent+sinner+must+necessarily+have+a+truly+human+soul+and+must+possess+a+human+body%E2%80%94and+he+must+thus+be+very+man.+The+nature+of+the+satisfaction+to+be+made+to+God%E2%80%99s+justice+on+behalf+of+sinful+man+absolutely+requires+it%2C+and+therefore%2C+as+far+as+God+is+concerned%2C+none+but+He+who+is+very+man+can+be+our+surety%2C+mediator%2C+and+deliverer.+%E2%80%A6%0A%0AGod+therefore+caused+this+truth+regarding+the+human+nature+of+the+mediator+to+be+proclaimed+to+believers+from+the+foundation+of+the+world.+He+introduced+Him+to+our+first+parents+as+the+Seed+of+the+woman+%28Gen.+3%3A15%29.+Subsequently%2C+God+made+this+truth+known+to+believers+much+more+clearly+and+powerfully+by+shadows+and+types%2C+as+well+as+by+prophecy.+Consider+especially+this+clear+prophecy%3A+%E2%80%9CBehold%2C+a+virgin+shall+conceive%2C+and+bear+a+son%2C+and+shall+call+his+name+Immanuel%E2%80%9D+%28Isa.+7%3A14%29.+The+name+Immanuel+means+%E2%80%9CGod+with+us%E2%80%9D%3B+that+is%2C+God+and+man+in+one+person.%0A%0AAll+this+makes+it+very+clear+that+He+who+is+to+be+the+mediator+and+deliverer+of+impotent+and+guilty+sinners+in+order+to+satisfy+God%E2%80%99s+holy+justice+and+thereby+reconcile+and+unite+them+to+God+must+necessarily+be+very+man.%E2%80%9D%0A%0A%E2%80%94+Theodorus+VanderGroe%2C+The+Christian%E2%80%99s+Only+Comfort+in+Life+and+Death%3A+An+Exposition+of+the+Heidelberg+Catechism%2C+trans.+Bartel+Elshout%2C+ed.+Joel+R.+Beeke+%281838-44%3B+2+vols%2C+Grand+Rapids+MI%3A+Reformation+Heritage+Books%2C+2016%29%2C+1%3A+74%2C+75.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fba745fdf7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ba745fdf7d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/03/theodorus-vandergroe-on-the-need-for-the-mediator-to-be-very-man/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8135c22a45" data-kw="">
<blockquote><p>This intercession consists of various acts. (1) The appearing of Christ for us by which he places himself before God the father as the only satisfier for our sins, representing the blood once shall (i.e., The merit of his death) and asking that at the side of it he would pardon our sins and bestow upon us all blessings necessary to salvation, until he has conducted us into the possession of full felicity: “Father, I will that they also whom thou hast given me, be with me where I am; that they may behold my glory” (Jn. 17:24). Hence the lamb is seen standing in heaven, as if it had been slain (hos esphagmenos, Rev. 5:6) because his blood is ever fresh and living (i.e., of eternal virtue and efficacy). (2) Our defense and protection against the thunderbolts of the law and the accusations of Satan, pleading our cause at the tribunal of God. (3) His suretyship for us by which as he demands grace from the Father and the gifts of the Spirit necessary to our perseverance, so in turn in our name he promises to God obedience and fidelity. (4) The offering of our persons and the sanctification of our prayers and of our entire worship, inasmuch as he presents all our prayers to God as spiritual sacrifices, perfumed with the most fragrant odor of his own sacrifice, so that in and through him they may be pleasing and acceptable to God. (1 Pet. 2:5). Hence he is represented as an angel with a burning censer (Rev 8:3) to whom is given much incense, that he should offer it with the prayers of saints. Elsewhere he is called an altar upon which all our sacrifices must be placed and on which alone the rational worship we render to God can be pleasing to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.15.14</span></figcaption>

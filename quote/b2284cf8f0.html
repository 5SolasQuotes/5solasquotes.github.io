<main class="wrap"><figure class="quote" id="q-b2284cf8f0" data-kw="">
<blockquote><p>Hence if the officers by these places [in the writings of reformed divines] have suffrages and votes in ordaining of officers, as why should the holy Ghost bid prophets separate Paul and Barnabas for such a ministry and command Timothy to lay hands suddenly on no man (1 Tim. 5:22) but on faithful men that are able to teach others (2 Tim. 2:2; Tit. 1:5,7-8) if officers have no official work in creating officers, but only to choose them, which any brother or woman may do?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker… (London, 1658) | The context is Rutherford arguing against congregationalists that Church officers, as officers, have a vote in calling a man to ordination.</cite>, p. 422</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>
<div class="actions"><button class="copy" data-copy="“Hence if the officers by these places [in the writings of reformed divines] have suffrages and votes in ordaining of officers, as why should the holy Ghost bid prophets separate Paul and Barnabas for such a ministry and command Timothy to lay hands suddenly on no man (1 Tim. 5:22) but on faithful men that are able to teach others (2 Tim. 2:2; Tit. 1:5,7-8) if officers have no official work in creating officers, but only to choose them, which any brother or woman may do?”

— Samuel Rutherford, A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker… (London, 1658) | The context is Rutherford arguing against congregationalists that Church officers, as officers, have a vote in calling a man to ordination., p. 422">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence+if+the+officers+by+these+places+%5Bin+the+writings+of+reformed+divines%5D+have+suffrages+and+votes+in+ordaining+of+officers%2C+as+why+should+the+holy+Ghost+bid+prophets+separate+Paul+and+Barnabas+for+such+a+ministry+and+command+Timothy+to+lay+hands+suddenly+on+no+man+%281+Tim.+5%3A22%29+but+on+faithful+men+that+are+able+to+teach+others+%282+Tim.+2%3A2%3B+Tit.+1%3A5%2C7-8%29+if+officers+have+no+official+work+in+creating+officers%2C+but+only+to+choose+them%2C+which+any+brother+or+woman+may+do%3F%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church+Discipline+Penned+by+Mr.+Thomas+Hooker%E2%80%A6+%28London%2C+1658%29+%7C+The+context+is+Rutherford+arguing+against+congregationalists+that+Church+officers%2C+as+officers%2C+have+a+vote+in+calling+a+man+to+ordination.%2C+p.+422&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb2284cf8f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b2284cf8f0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/whether-ladies-have-the-right-to-vote-for-church-officers/#:~:text=Hence%20if%20the%20officers%20by%20these,any%20brother%20or%20woman%20may%20do%3F" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66b7d80cb8" data-kw="">
<blockquote><p>A particular church, gathered and completely organized according to the mind of Christ, consists of officers and members; and the officers appointed by Christ to be chosen and set apart by the church (so called and gathered), for the peculiar administration of ordinances, and execution of power or duty, which he intrusts them with, or calls them to, to be continued to the end of the world, are bishops or elders, and deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 26.8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a> › <a href="../topics/church-government-and-the-ministry/forms-of-government/episcopal-presbyterian-congregational.html">Episcopal, presbyterian, congregational</a></span></div>
<div class="actions"><button class="copy" data-copy="“A particular church, gathered and completely organized according to the mind of Christ, consists of officers and members; and the officers appointed by Christ to be chosen and set apart by the church (so called and gathered), for the peculiar administration of ordinances, and execution of power or duty, which he intrusts them with, or calls them to, to be continued to the end of the world, are bishops or elders, and deacons.”

— Particular Baptists, Second London Baptist Confession of Faith, 1689, 26.8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA%20particular%20church%2C%20gathered%20and%20completely%20organized%20according%20to%20the%20mind%20of%20Christ%2C%20consists%20of%20officers%20and%20members%3B%20and%20the%20officers%20appointed%20by%20Christ%20to%20be%20chosen%20and%20set%20apart%20by%20the%20church%20%28so%20called%20and%20gathered%29%2C%20for%20the%20peculiar%20administration%20of%20ordinances%2C%20and%20execution%20of%20power%20or%20duty%2C%20which%20he%20intrusts%20them%20with%2C%20or%20calls%20them%20to%2C%20to%20be%20continued%20to%20the%20end%20of%20the%20world%2C%20are%20bishops%20or%20elders%2C%20and%20deacons.%E2%80%9D%0A%0A%E2%80%94%20Particular%20Baptists%2C%20Second%20London%20Baptist%20Confession%20of%20Faith%2C%201689%2C%2026.8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F66b7d80cb8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/66b7d80cb8.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/chapter-26-the-church/" rel="noopener" target="_blank">Read it online · Founders Ministries</a></div>
</figure><figure class="quote" id="q-fc7e78958b" data-kw="">
<blockquote><p>Diverse resolve that text [Rom. 12:6-7] thus, that first the apostle makes a general division of ecclesiastical offices, ‘prophesy’, comprehending these that labour in the Word and doctrine; ‘ministry’ comprehending those that labor not in the Word and doctrine… Ministry, he subdivides into the office of the ruling elder, deacon, and the other of showing mercy, which was committed sometimes to old men, sometimes to widows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions… (Edinburgh, 1649), ch. 5</cite>, p. 83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>
<div class="actions"><button class="copy" data-copy="“Diverse resolve that text [Rom. 12:6-7] thus, that first the apostle makes a general division of ecclesiastical offices, ‘prophesy’, comprehending these that labour in the Word and doctrine; ‘ministry’ comprehending those that labor not in the Word and doctrine… Ministry, he subdivides into the office of the ruling elder, deacon, and the other of showing mercy, which was committed sometimes to old men, sometimes to widows.”

— George Gillespie, A Treatise of Miscellany Questions… (Edinburgh, 1649), ch. 5, p. 83">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDiverse+resolve+that+text+%5BRom.+12%3A6-7%5D+thus%2C+that+first+the+apostle+makes+a+general+division+of+ecclesiastical+offices%2C+%E2%80%98prophesy%E2%80%99%2C+comprehending+these+that+labour+in+the+Word+and+doctrine%3B+%E2%80%98ministry%E2%80%99+comprehending+those+that+labor+not+in+the+Word+and+doctrine%E2%80%A6+Ministry%2C+he+subdivides+into+the+office+of+the+ruling+elder%2C+deacon%2C+and+the+other+of+showing+mercy%2C+which+was+committed+sometimes+to+old+men%2C+sometimes+to+widows.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+A+Treatise+of+Miscellany+Questions%E2%80%A6+%28Edinburgh%2C+1649%29%2C+ch.+5%2C+p.+83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffc7e78958b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fc7e78958b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-office-of-widows-the-churchs-ministry-to-the-needy/#:~:text=Diverse%20resolve%20that%20text%20%5BRom.%2012%3A6%2D7%5D,to%20old%20men%2C%20sometimes%20to%20widows." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0d368330bf" data-kw="">
<blockquote><p>In the churches, we know that there were many ἐπισκοποι (Acts 20:17, 28; Phil. 1:1), and this work of overseeing was specifically charged to the πρεσβυτεροι (Acts 20:17, 28; 1 Tim. 3:1–7; 5:17; Titus 1:5, 7; 1 Pet. 5:1–3). In line with this, Peter also calls himself an elder (πρεσβυτερος, 1 Pet. 5:1). Of a special institution of the episcopate alongside the presbyterate, accordingly, the New Testament knows nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>

</figure><figure class="quote" id="q-9b84dda9a4" data-kw="">
<blockquote><p>For the choosing of widows that are poor to take care of the poor and sick in hospitals, we think it just as necessary now as then, though no ways if there be none sick and poor in the Church: But that widows were Church-officers ordained, as were deacons, Acts 6:6, we never thought, and therefore we do not see that the wanting [lacking] of such widows, is the want of a positive institution of Church-policy; for other positive things of policy that should be of perpetual use, and not all of the same kind, and of equal necessity: I see no reason (which I speak for apostles) which were necessary then, and not now;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (London, 1646), Introduction</cite>, p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

<main class="wrap"><figure class="quote" id="q-1ba20bcd74" data-kw="">
<blockquote><p>When he [Karl Marx] fled to Brussels he joined a communistic society of German working men which had fostered conspiracy, but had now become educational and propagandist. It had been renamed the League of the Communists. For this League he wrote in 1848, along with Engels, the Communist Manifesto. Not until 1867 was there published in Hamburg the first volume of his great work — Capital.

This was an economic exposition supported by a labyrinth of statistics chiefly drawn from English sources. His design was to publish four volumes, but he died in 1886 leaving behind him a large number of manuscripts. Selections from these, edited by Engels, were published in a second, and then in a third volume at a date so late as 1895.

Marx’s Capital has been called the Bible of Socialism. It ought rather to be called the Talmud, for it is as difficult to read and often as tedious and contradictory as that famous Hebrew comment and exposition of the Old Testament literature. The real scripture of Marxian Socialism is the Communist Manifesto. It is the New Testament, or at least the Sermon on the Mount, of this great apostle. To read it along with the vehement pages which close the first volume of Capital is to find both the aims and the methods of Marxian Socialism set in clear light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-macallum-clow.html">William Macallum Clow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Marxian Socialism in Princeton Theological Review</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ec738a4a8b" data-kw="authority">
<blockquote><p>The authority of Scripture (concerning which we here inquire) is nothing else than the right and dignity of the sacred books, on account of which they are most worthy of faith with regard to those things which they propose to be believed and of our obedience in those things which they command us to omit or to do. The divine and infallible truth of these books (which have God for their author) is the foundation because he has the highest right to bind men to faith and duty. But this truth may be either intrinsic or extrinsic. The former is the credibility (axiopistia) in itself of the word which is always equal and consistent with itself, whether it has the testimony of men or not. The latter is the estimation or judgment of men in relation to the Scriptures, which is different as the subjects are different. Of history and of rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.4.3</span></figcaption>

</figure><figure class="quote" id="q-f8b91c1809" data-kw="">
<blockquote><p>And although ordinary believers are obliged to make diligent and conscientious use of the ministry of the church, among other things, as a means appointed of God to lead, guide, and instruct them in the knowledge of his mind and will revealed in the Scripture, which is the principal end of that ordinance; yet is not their understanding of the truth, their apprehension of it and faith in it, to rest upon or to be resolved into their authority, who are not appointed of God to be lords of their faith, but helpers of their joy.</p></blockquote>

</figure><figure class="quote" id="q-76dcfbe253" data-kw="">
<blockquote><p>This doctrine [of the inner testimony of the Holy Spirit] was opposed, however, from the side of Sociniaism, Remonstrantism, and Romanism. And gradually the doctrine of the internal testimony began to lose its place of honor even in Reformed theology. Already in Turretin, Amyrald, Molina, et al., it was weakened and identified with the so-called illumination of the Holy Spirit by which the intellect is enabled to note the marks and criteria of the divinity of the Holy Scripture. Faith no longer connects directly and immediately with Scripture but is the product of insight into the marks of truth and divinity it bears. Inserted between Scripture and faith, then, are the marks of the truth of Scripture. This occurred first in the sense that the recognition of those criteria was attributed to an illumination of the intellect by the Holy Spirit. But rationalism soon also considered this illumination unnecessary, assigned the study of the truth of revelation to reason, and base[d] the authority of Scripture on historical proofs. Even orthodox theologians scarcely dared any longer to speak of the internal testimony [Wilhelmus A’Brakel and Johannes Marck are cited as examples].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 1, pp. 584-85</span></figcaption>

cited%20as%20examples" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5a492649a0" data-kw="">
<blockquote><p>The authority of the Word is derived from the Word itself. The church cannot be the foundation upon which one believes that the Scriptures are the Word of God, for: First, the church derives all its authority from the Word. … Thus, we do not believe the Word to be the Word of God because the church affirms it, but on the contrary, we believe the church to be the true church because the Word validates her as such.</p></blockquote>

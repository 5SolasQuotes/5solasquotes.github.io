<main class="wrap"><figure class="quote" id="q-ce30e0ddff" data-kw="">
<blockquote><p>Love is properly placed first among the graces of the Spirit, not merely because of its supreme importance, but because it is the beginning and measure of all the graces in the soul. It is with equal propriety joy is placed immediately after it, for as soon as the love of God is shed abroad in the heart by the Holy Ghost, a sensation of joy naturally accompanies it.

This arises out of the new views, and feelings, and prospects, which then enter into the mind. And the grace of God is very conspicuous in thus causing the spirit of joy commonly to be experienced at the beginning of the divine life; for by this means the mind is reconciled to its new course, and prepared for the trials, and temptations, and difficulties, that speedily ensue. …

And it is easy to see what reasons of joy will appear hence to the soul. The perfections of God are looked upon as those of a Father, all engaged on their behalf; the promises of God are regarded as those of a Father, and therefore all secured to them; his glory is counted as an object of the highest interest, and felt to be reflected on themselves. Thus they feel assured of an exhaustless provision, an invincible protection, and the highest honour and happiness. God is their Father, and they have the joy of his children in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-morgan.html">James Morgan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fruit of the Spirit – Joy in Christian Miscellany</cite></span></figcaption>

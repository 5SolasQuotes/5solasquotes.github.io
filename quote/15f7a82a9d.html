<blockquote><p>[T]here is nothing which God, in his blessed word, defends with more exquisite jealousy than his worship; as there is nothing that he rebukes with more severity than the impertinent assumption of man to determine forms of worship for himself … [1]

No form of worship is acceptable to God which he has not prescribed. He hates will-worship, and classes it with idolatry. He rebukes his people for doing what he has not commanded, as well as for not doing what he has commanded (Jer. vii. 31; xix. 5; xxiii. 32.) [2]

[1] Thomas E. Peck, Liturgies, Instrumental, Music and Architecture (1855) in Miscellanies of Rev. Thomas E. Peck, ed. T. C. Johnson (3 vols, Richmond VA: Presbyterian Committee of Publication, 1895), 1: 68-69.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Address on the Subject of Systematic Beneficence</cite>, (1854) in Miscellanies of Rev. Thomas E. Peck, ed. T. C. Johnson (3 vols, Richmond VA: Presbyterian Committee of Publication, 1895), 1: 136.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6fafd94c7c" data-kw="">
<blockquote><p>And now especially in this solemn transaction, endeavour to render God great to your selves: Enlarge your minds, that as far as is possible and needful, they may take in the entire notion of him. As to what he is in himself, you must conceive of him as a Spirit, as his own Word, which can best tell us what he is, instructs us; and so as a Being of far higher excellency than any thing you can see with your eyes, or touch with your hands, or than can come under the notice of any of your senses.

You may easily apprehend Spiritual Being to be the source and spring of life, and self-moving power. This World were all a dead unmoving lump, if there were no such thing as Spirit; as your bodies when the soul is fled. You must conceive him to be an Eternal, Self-subsisting Spirit, not sprung up into Being from another, as our souls are: But who from the excellency of his own Being, was necessarily of, and from himself; comprehending originally and eternally in himself the fulness of all Life and Being.

I would fain lead you here, as by the hand, a few plain and easy steps. You are sure that somewhat now is, of this you can be in no doubt; and next you may be as sure that somewhat hath, of it self, ever been: For if nothing at all now were, you can easily apprehend it impossible that any thing should ever be, or of it self now begin to be, and spring up out of nothing. Do but make this supposition in your own minds, and the matter will be as plain to you as any thing can be, that if nothing at all were now in being, nothing could ever come into being; wherefore you may be sure, that because there is somewhat now in being, there must have been somewhat or other always in being, that was eternally of it self. And then to go a little farther, since you know there are many things in being that were not of themselves, you may be sure that what was always of it self, had in it a sufficiency of active power to produce other things, otherwise nothing that is not of it self could ever be. As you know that we were not of our selves; and the case is the same as to whatsoever else our eyes behold.

You must conceive of God therefore as comprehending originally in his own Being, which is most peculiar to himself, a power to produce all whatsoever Being, Excellency and Perfection is to be found in all the whole Creation. For there can be nothing which either is not, or arises not from, what was of it self. And therefore that he is an absolutely, universally, and infinitely perfect Being, and therefore that Life, Knowledge, Wisdom, Power, Goodness, Holiness, Justice, Truth, and whatsoever other conceivable Excellencies, do all in highest perfection, belong, as necessary Attributes, unchangeably and without possibility of diminution unto him. And all which his own Word (agreeably to the plain reason of things) doth in multitudes of places ascribe to him; as you that are acquainted with the Bible cannot but know. You must therefore conceive of him, as the All in All. So great, so excellent, so glorious a One he is, to whom you are to surrender and yield your selves.

You are to conceive of him as most essentially One, for there can be but one All. And so his Word teaches you to conceive. Hear, O Israel! the Lord our God is one Lord, Deut. 6. 4. We know there is no other God but one, &amp;c. 1 Cor. 8. 4, 5, 6. Your thoughts therefore need not be divided within you, nor your minds hang in doubt, to whom you are to betake and yield your selves: there is no place or pretence for halting between two Opinions. He most righteously lays the sole claim to you, a just God and a Saviour, and there is none besides him, Isa. 45. 21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two sermons preached at Thurlow in Suffolk on those words, Rom. 6.13 “Yield your selves to God”</cite>, (London: Tho. Parkhurst, 1688), pp 5-8.</span></figcaption>

<blockquote><p>About receiving the Lord’s Supper with inconvenient ceremonies and persons in differing doctrine: Peter Martyr, when he came into England first, and the opinion of the corporal presence of Christ in the Lord’s Supper was in force, and when the ministers, albeit differing from him in judgment, yet did not refuse to admit him with open confession of [the] contrary judgment, he joined with them and received the Lord’s Supper, Non obstantibus illorum ceremonijs sibilicet ipsi molestis, ‘notwithstanding the ceremonies, though very much troubling him.’ This counsel did P. Martyr give to [Zachary] Ursinus and to other Christians in Germany; Ursinus, Exercitat., lib 2, fol. 840.</p></blockquote>

</figure><figure class="quote" id="q-3211f65e7e" data-kw="">
<blockquote><p>Let us not abuse our selves, for it may seem to us that the things which we do to keep us in league with the children of this world, are not of great importance. Let us beware that Satan draw us not from obeying the commandment of GOD by the deceivableness of our flesh, as he withdrew Adam by the means of Eve, after that by his lie she was seduced, he thought with himself it was no great fault, to eat of the fruit of a Tree, but it was very great, sith GOD had forbidden it, as experience taught it afterward: for by this transgression all the lineage of man was destroyed and all creatures were made subject to Curse.

Let us never suffer therefore the word of God to be snatched out of our hands whatsoever reason, or whatsoever colour or cloak flesh can allege unto us: let us be as wary as we would be to fall into the fire, to draw back from this word, and to abandon it, one only step. For we need not go far aside to miss the way, to set us altogether out of the way, and when one is once fallen out of the way, the further he goeth on, the further he wandreth and multiplyeth error upon error: so that after it is very hard for him to find his right way, and to come thither, whether he purposed.

Wherefore to avoid the falling into the bottom of the depth of sin, let us get us away out of hand from the banks, least we plunge ourselves in deeper then we think for, and that there come not some wave which suddenly will set upon us, and in wray and plunge us in such sort among the waves, that we can never get out, but remain there all together drowned.</p></blockquote>

Let us never suffer therefore the word of God to be snatched out of our hands whatsoever reason, or whatsoever colour or cloak flesh can allege unto us: let us be as wary as we would be to fall into the fire, to draw back from this word, and to abandon it, one only step. For we need not go far aside to miss the way, to set us altogether out of the way, and when one is once fallen out of the way, the further he goeth on, the further he wandreth and multiplyeth error upon error: so that after it is very hard for him to find his right way, and to come thither, whether he purposed.

Wherefore to avoid the falling into the bottom of the depth of sin, let us get us away out of hand from the banks, least we plunge ourselves in deeper then we think for, and that there come not some wave which suddenly will set upon us, and in wray and plunge us in such sort among the waves, that we can never get out, but remain there all together drowned.”

ly+in+the+so+dangerous+days%2C+trans.+F.+H.+%28London%3A+Tobie+Smith%2C+1582%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3211f65e7e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3211f65e7e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/10/18/pierre-viret-beware-of-the-temptations-of-satan-and-the-flesh/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>One of Scotland’s noblest distinctions — her well-spent Sabbaths — is now on the eve of being lost. The old landmarks, which have so long guarded the day of rest, as within a sacred enclosure, and which were commonly understood to have been set up by the hand of God himself, are in progress of being taken down and cast aside as useless incumbrances.

Not only has a corrupt practice, in various places, been encroaching on its devout observance, but, what is unspeakably worse, a change of sentiment regarding its nature and obligation is fast loosening its hold of the national conscience, and opening the way for its unscrupulous desecration.

Indeed the Sabbath, properly so-called, that is, a day in every week hallowed and set apart, by the special appointment of God, for bodily and spiritual rest, and allowing no interruption except what may arise from the works, which either cannot or should not be deferred, of necessity and mercy — such a day no longer exists in the opinion of a large and influential portion of the community.

The only thing they acknowledge is what is more fitly called Sunday, a day which requires, and that by common consent, rather than by express precept, the consecration of a few hours to the public worship of God, but leaves men free to spend all its other hours according to their taste or circumstances, either in pleasant recreations, or in pressing business.

If our readers have watched any of the discussions, regarding the Sabbath, which within the last few years have taken place in the town-councils or other public bodies, and observed how often this lighter notion of a Sunday, or a first day of the week, is made to supplant the notion of a proper Sabbath, now reputed old, Jewish, or Puritanical, even by men who have a name in the religious world, they will be satisfied that what we say is not without foundation.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-188d83d849" data-kw="">
<blockquote><p>That principle, whereby they maintain the lawfulness of gathering churches out of Churches, acknowledged by themselves to be true Churches. A most dividing principle, insofar as it gives way for every man to separate from his own, and to join himself with another church supposed purer, with contempt of the former congregation. To gather churches out of Churches, is the way to destroy, but not to heal diseased Churches; It is to destroy many churches for making up of one, as if one going about the cure of a natural body should cut off and take out all the sound members and leave the rotten and diseased members either to cure one another or to perish. A strange and desperate way of cure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Refutation of the Errors Toleration, Erastianism</cite>, … (d. 1667; Edinburgh: 1692), ‘Sermon preached before the synod at Glasgow, 1653’, pp. 246-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>…we must prove ourselves the true Church of God: Thus we do it: We are true Christians, for we were baptized into the name of Christ; we truly profess our continuance in the same faith, into which we were baptized: we join together in the public services of God: we maintain every point of the most ancient Creeds: we overthrow not the foundation by any consequence; Therefore whateuer is wanting to us, whatever is superfluous, in spite of all the gates of Hell, we are the true Church of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Common Apology of the Church of England against the Unjust Challenges of the over-just Sect, commonly called Brownists</cite>, … (London: Macham, 1610), sect. 49, p. 118</span></figcaption>

</figure><figure class="quote" id="q-7f4649e9c9" data-kw="">
<blockquote><p>During his formative years, while studying at Herborn and Heidelberg, Comenius came under the influence of teachers who strengthened his ecumenical predisposition. This is particularly true of the period of study at Heidelberg, where he became acquainted with David Pareus, whose house, ‘Pareanum’, served as the center for those who worked for Protestant union. Two years after his return to his native land, Comenius was ordained priest of the Unity, and became pastor at Fulnek in Moravia. But with the outbreak of the Thirty Years War, Fulnek fell a prey to the fury of the Imperial armies. Comenius was compelled to take refuge on the Bohemian estates of one of the most important members of the Unity, Count Charles of Zerotin… There he wrote his celebrated Labyrinth of the World, a book in which the ecumenical theme found expression in condemnation of the fanaticism and bigotry of the confessional groups…” – Martin Schmidt in A History of the Ecumnical Movement, vol. 1, p. 89 Various – Good Counsels for the Peace of Reformed Churches by some reverend &amp; learned Bishops &amp; other Divines (Oxford: 1641) 150 pp. ToC King James I, To Cardinal Perron Richard Hooker, Answer to Travers Edwin Sandys, View of the State of Religion in the Western World John Davenent, Opinion of Thomas Morton, On the Peace of the Church Joseph Hall Opinion of To John Dury James Ussher Opinion of Sermon before King James Some French Reformed Divines, Opinion of Dury, John A Summary Discourse Concerning the Work of Peace-Ecclesiastical, how it may Concur with the Aim of a Civil Confederation Amongst Protestants (Cambrdige, 1641) 50 pp. A Motion Tending to the Public Good of this Age &amp; of Posterity, or, The Copies of Certain Letters Written by Mr. John Dury to a Worthy Knight at his Earnest Desire, Showing Briefly what a Public Good is &amp; how by the best Means of Reformation in learning &amp; religion it may be Advanced to Some Perfection (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-amos-comenius.html">John Amos Comenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Labyrinth of the World &amp; the Paradise of the Heart</cite>, ed. and tr. Count Lutzow (1623; Dent, 1905) 306 pp., p. 23</span></figcaption>

<blockquote><p>Tota ratio Schismatis, the very essence of a schism consists in the separating from the Church, I say, from the true and orthodoxal Church. It is a renting or dissolving of that unity which ought to be amongst Christians; See Mr. [Stephen] Marshall’s Sermon on Rom. 12:4-5. It was a memorable speech of Calvin, who said he would willingly travel all over the seas and countries in the world to put an end to the differences that were in the Reformed Churches. [John] Cameron well distinguishes of a double schism:

1. Negative, which is a bare secession or subduction, and is unlawful. Non separatio sed causa facit Schismaticum [Not the separation but the cause that makes the schismatic]. Cassander.

2. Positive, when there is a certain consociation, which uses ecclesiastical laws, the Word of God and administration of the sacraments separatim [in a separated way], which he calls setting up an altar against an altar; this is called schism Antonomastic [Greek], and [Greek], says he [in] De Ecclesia. Different forms of Churches and Church-government in one state must needs lay a foundation of strife and division therein. It is no wisdom (says Mr. [John] Dury in a letter [about congregationalists]) in a state, to reject an approved way of government, which all the best reformed Churches have received all this while, and acknowledged to be God’s way, and by experience found to be safe, sound; and instead of it to take up another, which it is not yet known what it is, nor was ever tried but in two or at the most three churches, and that for the space of a few years. The slighter the cause of separation, the greater the fault of schism; when men hold the same Faith and orthodox truths, yet separate for lesser matters. The true saints in the 7 Churches of the Revelation were never bid go out of them though they were very corrupt, as they were out of Babylon, Mr. [Richard] Vines. The first separatist in the Scripture (says one) was Cain, Gen. 4:16. Enforcements to love are clear, 1 Cor. 13:1. That question of Separation in Scripture is dark. See Mr. [George] Gillespie, Miscellaneous Questions, ch. 10 and 15, and Mr. [Thomas] Manton on James 3. 17. Schisma est secessio in religionis negotio vel temeraria vel injusta, Cameron, De Ecclesia. Schism is a causeless separation from external communion with any true Church of Christ: Mr. [John] Ball, Against Separation, ch. 8. Schism is a breach of the unity of the Church. Dr. Field, bk. 3, Of the Church, ch. 5. We do not leave communion of true Churches for corruptions and sins, but only abstain from the practice of evil in our own persons, and witness against it in others, still holding communion with the Churches of Christ.</p></blockquote>

<blockquote><p>Let them [the Protesters] take heed if this be not a main step to Separation (which in words they seem to abhor), when as they protest and profess they will not hear us, so they would cast on us a kind of necessity to hold them as heathens and publicans; But to prevent this they have found a way of their own, and (as if they had not been of us) they are gone out from us, and setting up to do their own business without us, as they seem to intimate in the last page of their printed Paper after the Protestation, contrary to the very fundamentals of the discipline of our Kirk, which is, and has ever been professed to be by presbyteries, synods and national assemblies, duly subordinate one to another, all which their course overturns, while they walk in another way to make the matters of their propositions practicable, as they say.</p></blockquote>

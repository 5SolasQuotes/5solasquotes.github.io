<main class="wrap"><figure class="quote" id="q-d1ef8a740a" data-kw="">
<blockquote><p>When they cry her &quot;Queen of heaven, gate of paradise, their life and their sweetness, treasurer of grace, refuge of sinners, mediatrix of men,&quot; what more do they leave to Christ?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8dbdfedab6" data-kw="Mary Saviour">
<blockquote><p>So also, the Holy Virgin herself recognized the Lord Christ as her Saviour (Luke 1:47). But now whose Saviour the Lord Christ is, He makes whole and redeemed from sins, as God&#x27;s Angel himself testifies (Matthew 1:21).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Short Instruction on the Holy Virgin Mary</cite>, 1673, Q. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/the-mediator.html">The Mediator</a></span><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/immaculate-conception.html">Immaculate conception</a></span></div>
<div class="actions"><button class="copy" data-copy="“So also, the Holy Virgin herself recognized the Lord Christ as her Saviour (Luke 1:47). But now whose Saviour the Lord Christ is, He makes whole and redeemed from sins, as God&#x27;s Angel himself testifies (Matthew 1:21).”

— Johann Heinrich Heidegger, Short Instruction on the Holy Virgin Mary, 1673, Q. 33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+also%2C+the+Holy+Virgin+herself+recognized+the+Lord+Christ+as+her+Saviour+%28Luke+1%3A47%29.+But+now+whose+Saviour+the+Lord+Christ+is%2C+He+makes+whole+and+redeemed+from+sins%2C+as+God%27s+Angel+himself+testifies+%28Matthew+1%3A21%29.%E2%80%9D%0A%0A%E2%80%94+Johann+Heinrich+Heidegger%2C+Short+Instruction+on+the+Holy+Virgin+Mary%2C+1673%2C+Q.+33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8dbdfedab6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8dbdfedab6.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

</figure><figure class="quote" id="q-b48112252c" data-kw="Mary Queen of Heaven Mediator">
<blockquote><p>In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In brief, there is scarcely one title given to Jesus Christ, nor one which prophesies of Him, which they do not attribute to her, calling her Queen of Heaven, Porter of Paradise, their life, their sweetness, treasurer of grace, the refuge and advocate of sinners—thus dishonoring Him and also making the poor people understand that they honor her contrary to the whole Word of God and the writings of the most ancient teachers.”

</figure><figure class="quote" id="q-bded0e8fc8" data-kw="Mary Idolatry">
<blockquote><p>Giving divine honor to the holy Virgin, or worshipping her with adoration, as Protestants say, due to God alone; of ascribing all the titles of Christ unto her, turning Lord in the Psalms in most places into Lady; praying to her, not only to entreat, yea, to command her Son to help and save them, but to save them herself, as she to whom her Son hath committed the administration of mercy, keeping that of justice to himself; with many other the like horrid blasphemies, which he shall hear more of if he desire it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Fiat Lux</cite>, ch. 15 (Blessed Virgin)</span></figcaption>

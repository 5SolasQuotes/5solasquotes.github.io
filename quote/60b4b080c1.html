<main class="wrap"><figure class="quote" id="q-60b4b080c1" data-kw="">
<blockquote><p>If life be brief and fading, we have all the more need to improve it diligently, and to realize its awful bearing on eternity. Knowing that we are every day advancing nearer to the grave, oh! how important to be daily looking beyond it, and turning our time to a spiritual account. Consider, then, for what ends life was given you, how these ends have already been prosecuted, and to what extent they have yet been attained. Without all controversy, the most urgent business of time is to secure the salvation of the soul — to acquire the knowledge and the favour of God — to learn his truth, and to live to his glory. How much, then, of the time past of your lives has been devoted to spiritual exercises, to prayer, to searching the Holy Scriptures, to the study of your own hearts?

Just let the last year of your existence be the subject of review, and say what were your spiritual views and experience at the time it commenced, and what are they now? Surely some change, either to the better or the worse, must have taken place upon your moral condition, for character is no more stationary than time — and in not improving, it must be degenerating. And it becomes you to ascertain whether you have advanced in knowledge and in grace, or whether you have been losing ground, and pursuing a careless and a backsliding path.

Ah, brethren, it is certain that the progress of the year has brought every one of you nearer to death, and judgment, and eternity — and how near none of us can tell. But are you any nearer heaven any better prepared for the solemn meeting with your God? You are more nearly being done with this world and with all its passing interests. But are your hearts more dead to it in proportion, and more decidedly and earnestly set on the things which arc above? Or, just as your interest in time has been diminishing, has your love for the world been increased?

Oh! inquire — search diligently into your own spiritual condition. Much of your time has been necessarily occupied with the business of the world — and too much of it, perhaps, has been wasted in idleness and in unprofitable amusement, if not in sinful pleasure. But what have you been doing for your souls? Is your peace made with God through Jesus Christ? Have you clearly understood, and cordially embraced, the way of salvation revealed? Are you satisfied that you are in a state of grace — that you have been effectually called and regenerated — and that God has given you the earnest of his Spirit in your heart?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bryden.html">Robert Bryden</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fall of the Leaf in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>I could not help observing, one day, how much Mr. N[ewton]. was grieved with the mistake of a minister, who appeared to pay too much attention to politics. “For my part,” said he, “I have no temptation to turn politician, and much less to inflame a party, in these times. When a ship is leaky, and a mutinous spirit divides the company on board, a wise man would say, ‘My good friends, while we are debating the water is gaining on us. We had better leave the debate, and go to the pumps.’ — I endeavour,” continued he, “to turn my people’s eyes from instruments to God. I am continually attempting to shew them, how far they are from knowing either the matter of fact or the matter of right. I inculcate our great privileges in this country, and advise a discontented man to take a lodging for a little while in Russia or Prussia.</p></blockquote>

<blockquote><p>Therefore the anchor of our faith hath two most unchangeable holds, namely the promise of God, and the oath of God: In both which it is impossible that God should lie. For as it is impossible that God should lie when he simply affirmeth: so is it more impossible (if there may be degrees in impossibilities) that God should lie when he sweareth.

And as it is impossible that God should lie or be forsworn: so is it impossible that any man or woman, which taketh hold of God’s promises by faith, should miss the performance of them, whatsoever seemeth to be lets or impediments unto them. For there can be no let or impediment so great, as should be able to compel God to lying or perjury, which be as great impossibilities as can be thought of.

For if the general or universal promises of God should not be granted to any one person that embraceth them by faith, God should be no more true of his word &amp; his oath, which is as impossible as that God should be no more God. For example, seeing God hath said: whosoever calleth upon the name of the Lord, shall be saved, if I poor wretch embracing this promise of God by faith, doo call upon the name of the Lord, whatsoever lets or impediments be in the way, it is impossible but that I shall be saved.

Therefore if all the Angels in heaven should tell me on their own credit, or as it were by God’s commandment, that I should be damned, I must hold them all accursed, rather then to grant that God should be a liar or perjured person. And forasmuch as Christ hath said: whosoever believeth and is baptised shall be saved, if I being baptised into the name of Christ, repose my whole trust &amp; confidence in him: whatsoever can be objected against me, I must of necessity be saved. For neither the justice of the law, nor the guiltiness of my sin, nor the accusation of the Devil, nor witness of mine own conscience, shall be able to condemn me, so long as I depend upon the promise of God. For there is now no condemnation to them that are in Christ Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fulke.html">William Fulke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A comfortable sermon of faith, in temptations and afflictions Preached at S. Botolph’s without Aldersgate in London, the .xv. of February. 1573.</cite>, (London: John Awdeley, 1574), unpaginated.</span></figcaption>

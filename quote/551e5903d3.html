<main class="wrap"><figure class="quote" id="q-551e5903d3" data-kw="">
<blockquote><p>Whoever prays to God to forgive their sins, trusting that they are among those for whom Christ died and that God will hear their prayers because of Christ, undoubtedly obtains forgiveness of sins. Thus, there is no need to assert that the act of saving faith, which is the instrumental cause of our justification, is the confidence in obtained forgiveness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXII. However, in Article 20 of the same Exercise, titled “Is the object of saving faith the forgiveness of sins already obtained or rather the forgiveness to be sought and attained?” he affirms and substantiates with many arguments that the act of saving faith, which is the instrumental cause of justification, is not the confidence in forgiveness or remission of sins obtained, but rather the confidence in forgiveness to be sought. For, among other things, he says:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2a0c39a651" data-kw="">
<blockquote><p>Because we are justified solely because of the righteousness of Christ, our role in justification is not to obey but to have faith in Christ… When we seek to justify ourselves by human effort of any kind, we undermine the sufficiency of Christ’s atoning work. Only justification by faith alone preserves the honor and glory of what Jesus did on the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jay-harvey.html">Jay Harvey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Don’t Call it a Comeback</cite>, p. 100</span></figcaption>

</figure><figure class="quote" id="q-d06f8999c0" data-kw="">
<blockquote><p>For faith, termed special mercy, naturally precedes justification in a repentant sinner, as seen in the tax collector who first pleads for mercy through faith; ‘God, be merciful to me a sinner,’ meaning, he trusts he will receive forgiveness of sins. This faith also accompanies justification; during the act of justification, he trusts that his sins are forgiven. Furthermore, it follows justification; for, justified, he descends to his house with the same confidence that his sins have been forgiven. Hence, he later infers that the special object of justifying faith is the promise of the Gospel about the future, present, and past, to each one, to me, to you, to him, believing in the Son, through faith in His blood, sins will be, are being, and have been forgiven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Justifying Faith’, pt. 1, pp. 141 &amp; 146-56, 162 | LXVII. Similar views are seen in Paraeus. He states:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

%20mercy%2C%20naturally,are%20being%2C%20and%20have%20been%20forgiven&amp;text=For%20faith%2C%20termed%20special%20mercy%2C%20naturally%20precedes%20justification&amp;text=will%20be%2C%20are%20being%2C%20and%20have%20been%20forgiven" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-040b5004ca" data-kw="">
<blockquote><p>As the act of healing through the eyes of the Israelites and the brazen serpent went together; so, in the act of justifying, these two, faith and Christ, have a mutual relation, and must always concur- faith as the action which apprehendeth, Christ as the object which is apprehended; so that neither the passion of Christ saveth without faith, nor doth faith help unless it be in Christ, its object.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Puritan Golden Treasury</cite>, p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/faith-as-instrument.html">Faith as instrument</a></span><span class="t"><a href="../topics/faith/faith-as-instrument.html">Faith as Instrument</a> › <a href="../topics/faith/faith-as-instrument/faith-receives-christ.html">Faith receives Christ</a></span></div>

— Daniel Cawdray, A Puritan Golden Treasury, p. 104">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+the+act+of+healing+through+the+eyes+of+the+Israelites+and+the+brazen+serpent+went+together%3B+so%2C+in+the+act+of+justifying%2C+these+two%2C+faith+and+Christ%2C+have+a+mutual+relation%2C+and+must+always+concur-+faith+as+the+action+which+apprehendeth%2C+Christ+as+the+object+which+is+apprehended%3B+so+that+neither+the+passion+of+Christ+saveth+without+faith%2C+nor+doth+faith+help+unless+it+be+in+Christ%2C+its+object.%E2%80%9D%0A%0A%E2%80%94+Daniel+Cawdray%2C+A+Puritan+Golden+Treasury%2C+p.+104&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F040b5004ca.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/040b5004ca.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-e4fedbc9a0" data-kw="">
<blockquote><p>It will be said by such a believer that my change of view was too rationalistic, too cerebral, too bloodless, too focused on a theoretical knowledge of the God of the philosophers rather than a personal response to the God of Abraham, Isaac, and Jacob. But the dichotomy is a false one, and the implied conception of the relationship between faith and reason not only foolish but heterodox. As to the heterodoxy and foolishness of fideism, and the correct understanding of the relationship of faith and reason, I have addressed that set of issues elsewhere. As to the ‘heart versus head’ stuff, it seems to me to rest on an erroneous bifurcation of human nature. Man is a unity, his rationality and animality, intellect and passions, theoretical and moral lives all ultimately oriented toward the same end… …that does not mean that the will does not have a role to play. But that is true wherever reason leads us to a conclusion we might not like, not merely in matters of religion. And once you have allowed yourself to see the truth that reason leads you to, what reason apprehends is (given the convertibility of the transcendentals) as good and beautiful as it is real. If you find yourself intellectually convinced that there is a divine Uncaused Cause who sustains the world and you in being at every instant, and don’t find this conclusion extremely strange and moving, something that leads you to a kind of reverence, then I dare say you haven’t understood it. Of course, there are those whose heads and hearts are so out of sync that they cannot follow both at the same time. But we shouldn’t mistake this pathology for an insight into human nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), ch. 9, ‘The Road from Atheism’, pp. 213-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

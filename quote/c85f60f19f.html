<main class="wrap"><figure class="quote" id="q-c85f60f19f" data-kw="">
<blockquote><p>And here also we consider things circumstantial, as time, place, etc. And circumstances are either merely physical [which are not regulated], or 2. merely moral [which are regulated], or 3. mixed, partly moral, partly physical [which are partly regulated]… … 3. There be some mixed circumstances [of worship], as these same physical circumstances, clothed with their own seasonable conveniences; so time for worship, and due and convenient time is required, there may be some scandalous and superstitious time for worship… a place is required for private worship, and a fit place, such as is not the market-street for private praying; the inconveniency of the circumstance may vitiate the worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 2 &amp; 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13b90e1f73" data-kw="">
<blockquote><p>III. (2) We must distinguish between simple precepts (i.e., merely moral) belonging to natural right and mixed precepts (moral and ceremonial, partly of natural and partly of positive right; as the fourth commandment concerning the Sabbath, which is moral as to the genus of public worship, but ceremonial as to the circumstance of the defined time; and the fifth, which is moral as to the prescribed duty and the promise of longevity, but ceremonial as to the appended promise of the land of Canaan).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, The Law of God, 2nd Question, The Nature of the Moral Law, section 3, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-9bafd09315" data-kw="">
<blockquote><p>It is said [about the divine right of Church government] that, ‘All this is but a plea for a dominion of an higher nature, even over the consciences of men by censures.’ But why a dominion? Because a power of censures? Surely, if they were not spiritual censures, and such as have influence on the conscience, we should yield a domination were the business. But this power of censuring spiritually is as strong as authoritative in dispensing rebukes, threats, Gospel-charges and commands in the Word preached, as in censures; The power is ministerial only in the Word, not lordly; and why should it be deemed a dominion, and an arbitrary power in the one, and not in the other?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), ‘To the Ingenuous and Equitable Reader’, unnumbered page</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-50faa103fb" data-kw="">
<blockquote><p>18. It was not necessary to the priesthood before Christ that there were an uninterrupted succession of right ordination: For the priests in Christ’s time were such as had no right to it, not of the right line (which had been long before interrupted), they bought the priesthood for money: and as many judge, were annual and two at a time (though not equal). Yet Christ requires submission to them as priests. I am sorry that we must be put to use the same arguments with these [episcopal] men as we have done against the old Separatists so long.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

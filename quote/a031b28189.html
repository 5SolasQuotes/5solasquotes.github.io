<main class="wrap"><figure class="quote" id="q-a031b28189" data-kw="">
<blockquote><p>Thomas Cartwright, the early Presbyterian Puritan, helps us to understand how to apply the judicial laws of the Old Testament today. The moral-judicials (i.e. punishment of idolaters) simply apply today, as they are natural laws that cannot expire and thus bind all men everywhere (cf. Westminster Confession 19:5). The moral-positive judicials do not literally apply: only the general equity of these judicials is still valid, while the positivistic aspect has expired (cf. WCF 19:4). Below, Cartwright explains the Presbyterian position in distinction to the Prelatic antagonism to the Mosaic judicials:

And as for the judicial law, for as much as there are some of them made in regard of the region where they were given, and of the people to whom they were given, the Prince and the Magistrate keeping the substance and equity of them (as it were the marrow) may change the circumstances of them, as the times, and places, and manners of the people shall require. But to say that any magistrate can save the life of blasphemers, contemptuous and stubborn idolaters, murderers, adulterers, incestuous persons, and such like, which God by his judicial law hath commanded to be put to death, I utterly deny, and am ready to prove, if that pertained to this question. And therefore although the judicial laws are permitted to the discretion of the prince and magistrate, yet not so generally as you seem to affirm, and as I have oftentimes said, that not only must it not be done against the word, but according to the word and by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A reply to an answer made of M. Doctor Whitgift, against the admonition to the parliament</cite>, (Hemel Hempstead, 1573), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>27. But ordinances about such circumstances as place, time and the like are rightly said by the best authorities to be partly divine and partly human. They are grounded in part upon the will of God because of their chief and primary purpose, and partly upon man’s prudence, insofar as a special observation agreeable to God’s will is concerned. If no human error is made in this matter, the ordinance is to be held as wholly divine. It is the will of God that the church meet at the most convenient hour of the day, all circumstances considered. If, therefore, no error occurs in estimating the circumstances, the hour assigned for meeting after due consideration must be acknowledged as if appointed by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, tr. John D. Eusden (1623; Baker, 1997), bk. 2, in ch. 14, ‘The Manner of Divine Worship’, section 27, p. 286</span></figcaption>

</figure><figure class="quote" id="q-539a4a77bc" data-kw="">
<blockquote><p>As Baillie explained, there were certain cases of necessity in which a presbytery could deem it expedient to appoint a temporary bishop, either to prevent schism schism and preserve the unity of the national church or to preside over an ecclesiastical assembly as moderator… The type of ‘superintendent’ of which Baillie approved in the ancient church was never granted powers of order or jurisdiction that were not also given to preaching presbyters… Ordination was given by divine right to the presbytery of Ephesus–not just the meeting of presbyters but the ‘office and grade of presbyter’ as described by St Jerome and Calvin–which continued to exist even after the ordination of Timothy as a bishop; a delegation, rather than relegation of powers of jurisdiction. Acts 20:17 and 28 both outlined the divine warrant of temporary, ambulatory pastors who were ‘given the power of determining doctrine and expelling heretics from the church by the Sacred Spirit’. Yet Baillie quickly affirmed that the superiority maintained in these loci were during periods when the church’s polity was in flux.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>3. …But must we separate from all sinners? or from all that sin in their entrance into the ministry? And why not as well from all other sins of equal greatness? Do you warn all others not to hear yourself? Or do you yet take yourself to be no sinner? or no great sinner? What if the presbyterians think the Independents’ way of entrance to be undue? And the Independents think so of the presbyterians? And both of the Anabaptists [baptists]? and the Anabaptists of them both, etc. Must they all therefore warn all men not to hear each other? Mr. [Philip] Nye [an Independent] thought not so, when he wrote for such hearing public ministers. Is it fit for the author [Edward Bagshaw] of two books of calumnies and bold untruths, besides false doctrines and other crimes, to say ‘Their sin is great, etc. and therefore we both forbear ourselves and warn all others not to hear them?’ 4. Most that I speak of did enter into the ministry in the presbyterian or Independent way heretofore, and do but continue on the terms which I dissent from as well as you. How then can you say they unduly enter into the ministry? 5… 4. But suppose that you are the wiser man, and that those that are more ignorant do mistakingly think that canonical obedience and the oath (with that of Supremacy) to be their duty, and no renouncing of their Christian liberty: Is it not false doctrine to conclude that Christ never sent out any that had as great a sin as this? what none? when he sent out Judas himself, who was first a thief and after a traitor? Do you think then that Christ ever sent out liars, railers, furious Church-dividers, false accusers, etc.?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London, 1671), sect. 41, pp. 102-3</span></figcaption>

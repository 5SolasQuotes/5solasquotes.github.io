<main class="wrap"><figure class="quote" id="q-da3e96a980" data-kw="natural Son not adopted">
<blockquote><p>Christ is said to be “the own Son of the Father” not only inasmuch as it is opposed to one of another family … but inasmuch as it is opposed to an adopted and metaphorical son. Thus he may be called the natural son who is such by the privilege of his nature and not by the grace and benefit of adoption only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.29.16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/eternal-sonship.html">Eternal Sonship</a></span><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/aseity-of-the-son.html">Aseity of the Son</a></span></div>

— Francis Turretin, Institutes of Elenctic Theology, 3.29.16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChrist%20is%20said%20to%20be%20%E2%80%9Cthe%20own%20Son%20of%20the%20Father%E2%80%9D%20not%20only%20inasmuch%20as%20it%20is%20opposed%20to%20one%20of%20another%20family%20%E2%80%A6%20but%20inasmuch%20as%20it%20is%20opposed%20to%20an%20adopted%20and%20metaphorical%20son.%20Thus%20he%20may%20be%20called%20the%20natural%20son%20who%20is%20such%20by%20the%20privilege%20of%20his%20nature%20and%20not%20by%20the%20grace%20and%20benefit%20of%20adoption%20only.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.29.16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda3e96a980.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da3e96a980.html">Permalink</a><a class="src" href="https://drive.google.com/file/d/1YcwwT0MNnEuPwYSOy3Gfw-0tA7Jvm9N8/view?usp=drivesdk" rel="noopener" target="_blank">Read it online · Drive (Nick&#x27;s copy)</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8af4e8b359" data-kw="eternal generation sunbeams">
<blockquote><p>The generation of the Son is not by derivation or transfusion, nor by an action that begins or ends, but by an eternal emanation, which has no parallel in nature, where generations occur in time. This generation is somewhat shadowed by the analogy of sunbeams continually flowing from the body of the sun. Just as the sun is not prior to its rays, nor is the begetter prior in time to the begotten, so the eternal Father eternally begets the Son, and no temporal priority is to be imagined here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXI</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/eternal-generation.html">Eternal generation</a></span></div>

</figure><figure class="quote" id="q-3feb3b91bf" data-kw="autotheos aseity Son">
<blockquote><p>Although the Son is from the Father, nevertheless he may be called God-of-himself (autotheos), not with respect to his person, but essence; not relatively as Son (for thus he is from the Father), but absolutely as God inasmuch as he has the divine essence existing from itself and not divided or produced from another essence (but not as having that essence from himself). So the Son is God from himself although not the Son from himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.28.40</span></figcaption>

</figure><figure class="quote" id="q-587efd10ad" data-kw="only begotten own Son">
<blockquote><p>He is not only called “the Son” (ho hyios) by way of eminence (Heb. 1:5) and “thou art the Christ, the Son of the living God” (Mt. 16:16), but also his own Son—“he that spared not his own Son” (Rom. 8:32); who has his own Father (Jn. 5:18); who begot the Son even from his essence—“the only begotten Son.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.29.14</span></figcaption>

</figure><figure class="quote" id="q-eedfe4cad5" data-kw="Son generation">
<blockquote><p>Therefore, Scripture considers three persons in God, who are one God. The Father is indeed the source and principle of divinity, the Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son.</p></blockquote>

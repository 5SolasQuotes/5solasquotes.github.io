<main class="wrap"><figure class="quote" id="q-6b0386e2f3" data-kw="">
<blockquote><p>XXX. We are justified by that righteousness alone by which our Surety was freed from our guilt. But He was fully freed from our guilt by the power of the satisfaction which He rendered on our behalf; therefore, by that same righteousness alone, we too are fully justified. Who would deny that, when the debt owed by us is paid, the handwriting that was against us (Col. 2:14) is erased, and we are no longer liable to our creditor? That by the same righteousness by which we are redeemed from condemnation and the curse of the law (Gal. 3:13), we are also justified? That by the same satisfaction by which divine justice was perfectly satisfied for us, and by which we were so reconciled to God that He adopted us as sons and heirs, God is now completely propitiated toward us? That by the same propitiation by which our sins were fully expiated and cleansed, we now obtain the right of access into the Temple of God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joshua-placeus.html">Joshua Placeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Theses on the Justification of Man before God’</cite>, (1634), p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09cfb60301" data-kw="">
<blockquote><p>[You must distinguish:] 4. Betwixt a twofold righteousness of one and the same Covenant: 1. Of perfect obedience, or performance of the condition. 2. Of suffering, or satisfaction for disobedience or non-performance which makes the Law to have nothing against us, though we disobeyed. See [William] Pemble, Of Justification, p. 2. Our legal righteousness is of this last sort, and not of the first. Both these sorts of righteousness are not possible to be found in any one person, except Christ, who had the former righteousness as his own (incommunicable to us in that form). The second He had for us, as He was by imputation a sinner: And so we have it in, or by Him. Mark this. 5. Betwixt two kinds of righteousness, suitable to the two Covenants [of Works and of Grace] and their conditions: 1. Legal righteousness, which is our conformity, or satisfaction to the Law. 2. And evangelical righteousness, which is our conformity to the new Covenant. Note, that: 1. Every Christian must have both these. 2. That our legal righteousness is only that of satisfaction: but our evangelical is only that of obedience, or performance of the condition. 3. That our legal righteousness is all without us in Christ, the other in ourselves. 6. [Distinguish] Betwixt [1.] evangelical righteousness, improperly so called, viz. because the Gospel does reveal and offer it. This is our legal righteousness of Christ. 2. And evangelical righteousness properly so called viz. because the new Covenant is the rule to which it is conformed. This is our performance of the new Covenant’s conditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655) | Guide to the Reader Baxter here lays out his Neonomianism.</span></figcaption>

</figure><figure class="quote" id="q-a8587284b2" data-kw="">
<blockquote><p>Here he indicates the end for which God, in the flesh of his Son, condemned our sin—namely, that the righteousness (or justification) of the Law might be fulfilled in us; that is, that we might be justified, being endowed with that righteousness which the Law requires of us. For the Law requires of us either perfect obedience or punishment. But we have not rendered perfect obedience; yet we have paid the penalty in Christ, for he paid it on our behalf. Therefore we have satisfied the Law in Christ; and consequently the Law cannot condemn us, but is bound to justify us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Rom. 8:4, “That the righteousness of the law might be fulfilled in us, who walk not after the flesh, but after the Spirit.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-ed27b9bc75" data-kw="">
<blockquote><p>For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae theologicae: liber unus</cite>, (Geneva: Vignon, 1573), Epistle 35, to Olevianus (1560), p. 200 as trans. G.A. van den Brink, The Transfer of Sin… (Brill, 2024), p. 219 cf. Epistle 45, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?”

</figure><figure class="quote" id="q-c60b48b53a" data-kw="">
<blockquote><p>Question: You say then that we be justified before God, that is to say that we be covered and denounced rightuous, because Christ’s obedience is imputed unto us, which consists chiefly of two parts: namely of satisfaction for our sins, and of full performance of all rightuousness of the law. Answer: I say so.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-29b64f8ec5" data-kw="">
<blockquote><p>(2.) [Informatory Vindiction:] ‘We distinguish between a Church in a growing case, coming forward out of darkness, and advancing in reformation, and a Church declining and going back again. In the former many things may be born with, which, in the latter, are noways to be yielded unto, as in the time of the former prelacy many did hear prelatical men,’ etc. In times of defection and division, the Church was declining and going back, and in that case it was needful to be very peremptory in tenaciousness: But now she is growing and coming forward out of darkness, and advancing, though weakly, in reformation; and therefore now, sure it must be born with to hear presbyterian ministers, though formerly guilty of defections, as much as in former times to hear prelatical men. (3.) ‘We diftinguished between a Church and a reformed and settled state, and a Church in a broken and disturbed state.’ In times of defection and division, it was thought the: ‘most lawful expedient and conducive mean for maintaining the attained unto reformation, to abstract and withdraw from such disorders in ministers, which we could not otherwise get rectified.’ But now that is neither the lawful expedient, nor conducible mean to maintain reformation, but rather the way to obstruct it, to withdraw from ministers, whose former disorders we would have rectified in a case where the Church is settled, so far as to have liberty to keep General Assemblies to rectify them, and the government thereof is confirmed with the civil sanction of acts of parliament. … (6.) ‘We distinguished between a faithful and a sinless ministry.’ In times of defection and division, we might, for the want of the former qualification withdraw, that is, when they were not faithful.’ But now when they are more faithful, we cannot withdraw, except we would withdraw from them because they are not sinless, which in no case can be a ground.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion, or a Treatise against Separation from the Revolution Settlement of this National Church, as it was settled anno 1689 and 1690</cite>, … (1706; Edinburgh: Gray, 1747), pp. 34-35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7f7357cd5b" data-kw="">
<blockquote><p>Some of the special advocates of liberty of speech and opinion, are apt, when in the majority, to find out that it is very heinous to express any dissent from the decision of the General Assembly. This is not Protestantism; nor is it Christianity. It is perfectly consistent with all due deference and obedience, for any member of the Church to express without reserve his opinions as to the wisdom or justice of any decision of our ecclesiastical courts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discussions in Church Polity</cite>, … (NY: Scribner’s Sons, 1878), pt. 2, ch. 16, ‘Discipline’, section 3, ‘Appeals &amp; Complaints’, b. ‘Review of a Decision that Appeals cannot lie except in Judicial Cases’, p. 489</span></figcaption>

</figure><figure class="quote" id="q-6681570953" data-kw="">
<blockquote><p>Some more zealous than knowing and considerate did aggravate the acceptance of the indulgence to a great height, and ground of separation, and so wrought their enemies’ work for them better than they could do it for themselves: And so that division proved fatal at Bothwell, where they had a fair game, and opportunity to have defeated all their enemies, and brought prelacy down to the dust. It is observable there was this difference in the two appearances: Pentland had love, harmony and sympathy, wanting nothing but men and arms; Bothwell had both, and wanted harmony, but plagued with division.</p></blockquote>

<blockquote><p>…the Romans were guilty of differences in God’s service and despising and judging each other for them; The Corinthians were carnal in making parties and divisions; they defrauded each other and went to law before heathens. They had fornicators, Judaizing envious slanderers of Paul, heretical deniers of the Resurrection, such as eat in idols’ temples, or of their sacrifices: were drunk at, or before the sacrament. The Galatians are yet sharplier charged: Almost all the seven Churches, Rev. 2 and 3, had Nicolatians, or Jezabel’s doctrine, which God hated: and no Christian is called to separate from the communion of any one of all these; but commanded to amend, and live in unity, without divison.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a6d2904a75" data-kw="">
<blockquote><p>Hairnets made out of gold were sometimes worn by the rich during the first century AD, although as hairstyles grew more complicated, hairnets went out of fashion… In the late Roman period [late-fourth century], the coverings became less net-like and more cloth-like, concealing more of the hair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexandra-t-croom.html">Alexandra T. Croom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Hairstyles &amp; Hats’ &amp; ‘Hairnets &amp; Coverings’ in Roman Clothing &amp; Fashion Pre</cite>, (Stroud: Tempus, 2000), pp. 139-55, p. 151</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Hairnets made out of gold were sometimes worn by the rich during the first century AD, although as hairstyles grew more complicated, hairnets went out of fashion… In the late Roman period [late-fourth century], the coverings became less net-like and more cloth-like, concealing more of the hair.”

— Alexandra T. Croom, ‘Hairstyles &amp; Hats’ &amp; ‘Hairnets &amp; Coverings’ in Roman Clothing &amp; Fashion Pre (Stroud: Tempus, 2000), pp. 139-55, p. 151">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHairnets+made+out+of+gold+were+sometimes+worn+by+the+rich+during+the+first+century+AD%2C+although+as+hairstyles+grew+more+complicated%2C+hairnets+went+out+of+fashion%E2%80%A6+In+the+late+Roman+period+%5Blate-fourth+century%5D%2C+the+coverings+became+less+net-like+and+more+cloth-like%2C+concealing+more+of+the+hair.%E2%80%9D%0A%0A%E2%80%94+Alexandra+T.+Croom%2C+%E2%80%98Hairstyles+%26+Hats%E2%80%99+%26+%E2%80%98Hairnets+%26+Coverings%E2%80%99+in+Roman+Clothing+%26+Fashion+Pre+%28Stroud%3A+Tempus%2C+2000%29%2C+pp.+139-55%2C+p.+151&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa6d2904a75.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a6d2904a75.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/#:~:text=Hairnets%20made%20out%20of%20gold%20were,cloth%2Dlike%2C%20concealing%20more%20of%20the%20hair&amp;text=Hairnets%20made%20out%20of%20gold%20were%20sometimes%20worn&amp;text=and%20more%20cloth%2Dlike%2C%20concealing%20more%20of%20the%20hair" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6af7bb341c" data-kw="">
<blockquote><p>The mind of Paul then, is that it is not necessary, other than by the time, for the hair of women to be covered by a veil while they are praying.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-09f5a9f3d5" data-kw="">
<blockquote><p>There is greater difficulty than Mr. Doctor [Archbishop Whitgift] mentions in the words of St. Paul, where he says a woman praying or prophesying ought to be vailed and have her head covered, in which words it seems that the apostle licenses a woman to prophesy so that she do it with her head covered. But to him that shall diligently consider the place, it shall appear that the women of Corinth did pass the bounds of modesty and of shamefastness two ways, whereof one was that they came into the congregation contrary to the custom of those countries with their heads and faces uncovered: another was that they also took upon them to speak in the congregation, both which faults St. Paul condemned…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift against the Admonition to the Parliament</cite>, (1573), To the next section beginning at the 79 page and holding on until the 82 page, p. 141</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“There is greater difficulty than Mr. Doctor [Archbishop Whitgift] mentions in the words of St. Paul, where he says a woman praying or prophesying ought to be vailed and have her head covered, in which words it seems that the apostle licenses a woman to prophesy so that she do it with her head covered. But to him that shall diligently consider the place, it shall appear that the women of Corinth did pass the bounds of modesty and of shamefastness two ways, whereof one was that they came into the congregation contrary to the custom of those countries with their heads and faces uncovered: another was that they also took upon them to speak in the congregation, both which faults St. Paul condemned…”

— Thomas Cartwright, A Reply to an Answer made of Mr. Doctor Whitgift against the Admonition to the Parliament (1573), To the next section beginning at the 79 page and holding on until the 82 page, p. 141">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+greater+difficulty+than+Mr.+Doctor+%5BArchbishop+Whitgift%5D+mentions+in+the+words+of+St.+Paul%2C+where+he+says+a+woman+praying+or+prophesying+ought+to+be+vailed+and+have+her+head+covered%2C+in+which+words+it+seems+that+the+apostle+licenses+a+woman+to+prophesy+so+that+she+do+it+with+her+head+covered.+But+to+him+that+shall+diligently+consider+the+place%2C+it+shall+appear+that+the+women+of+Corinth+did+pass+the+bounds+of+modesty+and+of+shamefastness+two+ways%2C+whereof+one+was+that+they+came+into+the+congregation+contrary+to+the+custom+of+those+countries+with+their+heads+and+faces+uncovered%3A+another+was+that+they+also+took+upon+them+to+speak+in+the+congregation%2C+both+which+faults+St.+Paul+condemned%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+A+Reply+to+an+Answer+made+of+Mr.+Doctor+Whitgift+against+the+Admonition+to+the+Parliament+%281573%29%2C+To+the+next+section+beginning+at+the+79+page+and+holding+on+until+the+82+page%2C+p.+141&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F09f5a9f3d5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/09f5a9f3d5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=There%20is%20greater%20difficulty%20than%20Mr,both%20which%20faults%20St.%20Paul%20condemned&amp;text=There%20is%20greater%20difficulty%20than%20Mr.%20Doctor%20%5BArchbishop&amp;text=the%20congregation%2C%20both%20which%20faults%20St.%20Paul%20condemned" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8eb6339503" data-kw="">
<blockquote><p>3. Such [persons] as openly proclaim their want [lack] of reverence, by their outward irreverend, unbeseeming gestures, which are stately coming into the assembly of God’s people, even when they are serving of God, with their hats on their heads, sitting at prayer, casting their eyes this way and that way…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned &amp; Very Useful Commentary on the Whole Epistle to the Hebrews</cite>, … (London, 1655), ch. 12, §135, ‘Of serving God reverendly’, p. 388 Gouge (1575–1653) was a Cambridge scholar, lecturer and Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“3. Such [persons] as openly proclaim their want [lack] of reverence, by their outward irreverend, unbeseeming gestures, which are stately coming into the assembly of God’s people, even when they are serving of God, with their hats on their heads, sitting at prayer, casting their eyes this way and that way…”

</figure><figure class="quote" id="q-fcc025fa63" data-kw="">
<blockquote><p>He lets them know that both these kinds of disorders are repugnant to the institution of God and the dictates of reason. But especially the latter of these practices is confuted here by an appeal to nature, which is a comprehensive topic, and you may understand by it the general dictate of natural reason, and the particular law of nature concerning distinction of sexes, as also usage and custom, which is a second nature… In a word, a man must not be like a woman either as to her veil and covering or as to her long and dressed hair, because he is taught otherwise by the law of reason, and by that of the sex, and even by the practice and custom of the soberest part of the world, which are all comprised in the large extent of the word ‘nature’ in this place of the apostle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Four Remarkable Texts of the New Testament which Contain Some Difficulty in Them</cite>, … (Cambridge, 1692), The 2nd Text Inquired into, 1 Cor. 11:14, pp. 135-36</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-f692a9f592" data-kw="">
<blockquote><p>Something Contingent to Necessary Being [see pp. 48-50 of the Summary] 35. Whatever exists from itself (is either ineffectible or independent) is a necessary being. This point follows from the definitions. 36. Whatever exists contingently [see p. 48] not only has in another the reason for its existence, but receives existence from a cause that causes contingently and not necessarily [see pp. 48-49]. 37. Everything caused either immediately or mediately by a free cause is contingent, and conversely every contingent being is caused immediately or mediately by a free cause. 38. Every cause that causes contingently is either itself a free will or depends for its existence or its causing on a free cause. 39. If there is some contingent being, there is some necessary being. If there is something contingent, such a thing is caused (from conclusion 36), and consequently is dependent (from conclusion 38). But a dependent being implies a being from itself (from conclusion 32), and therefore a being from itself necessarily exists (from conclusion 35).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Conclusions respecting Reality’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Something Contingent to Necessary Being [see pp. 48-50 of the Summary] 35. Whatever exists from itself (is either ineffectible or independent) is a necessary being. This point follows from the definitions. 36. Whatever exists contingently [see p. 48] not only has in another the reason for its existence, but receives existence from a cause that causes contingently and not necessarily [see pp. 48-49]. 37. Everything caused either immediately or mediately by a free cause is contingent, and conversely every contingent being is caused immediately or mediately by a free cause. 38. Every cause that causes contingently is either itself a free will or depends for its existence or its causing on a free cause. 39. If there is some contingent being, there is some necessary being. If there is something contingent, such a thing is caused (from conclusion 36), and consequently is dependent (from conclusion 38). But a dependent being implies a being from itself (from conclusion 32), and therefore a being from itself necessarily exists (from conclusion 35).”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ff4234ad2b" data-kw="">
<blockquote><p>The Disposition of Man to Grace l. Since the necessary conditions for salvation are impossible for the reprobates, God does not intend to give them salvation, conditionally if they believe and repent, unless one supposes that there is in God some vain, frustrated, and useless intention and will. 2. A good use of natural light, either subjective or objective, cannot lead man to salvation, nor obtain from God any other degree of light destined to salvation. Rejection of the error of those: 1. Who teach a universal and common call to all men to salvation and to the author of salvation, and that each and every man can believe and be saved if he wants. 2. Who teach that God, by his revealed will, wants the salvation of each and everyone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/genevan.html">Donald Davis Grohman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism</cite>, Donald D. Grohman, The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism: 1635-1685 Th.D. diss, (Knox College in cooperation with Toronto School of Theology. 1971), pp. 231-35 For context see ‘Donald Grohman on Dort and the 1649 Genevan Articles’ at Calvin &amp; Calvinism and Grohman.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

l.%20Since&amp;text=will%2C%20wants%20the%20salvation%20of%20each%20and%20everyone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-687b8e6168" data-kw="">
<blockquote><p>Moreover, what the orthodox fathers and the scholastics who followed their steps handed down very well was commonly known: namely that the natural gifts have been corrupted and the supernatural ones lost. So from this statement we establish that supernatural theology, which by the sin of man had been, as it were, rejected and most undeservedly spurned, retreated from here to the heavens; and natural theology, as all the other things which arise from nature, was corrupted. For how could it have remained uncorrupted in a subject that was corrupted in every part?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on True Theology</cite>, trans. David Noe (1592?; RHB, 2014), ch. 10, ‘Natural Theology’, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-3eaee72fd8" data-kw="">
<blockquote><p>All the Reformed exclude from free choice a natural necessity, by which man is by his own nature determined to the thing he wills, as for example the sun, to shine, but nevertheless they admit the necessity: of dependence upon God, as the first cause; of infallibility, from the eternal decree; of predetermination, from governing providence; of slavery, from sin.</p></blockquote>

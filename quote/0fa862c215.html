<main class="wrap"><figure class="quote" id="q-0fa862c215" data-kw="">
<blockquote><p>As for the Sanquhar declaration [1680], in so far as it denies the king’s authority and declares a war against him, it is a mere madness… it is no Christian duty to debate about these and the like things, and for such causes to raise a schism. Oh how sad is it that so many do place godliness in maintaining the Sanquhar declaration, and in separating from them who in their judgment are not so zealous in these or other circumstances. I admonish them to cease from these and such like courses, if they be lovers of Christ and his cause and love not their own bodily and spiritual ruin. I pray therefore, do not make such feckless things grounds of schism; do not I pray stain piety with such a blot. Why do you sport with God, religion and the church? Leave things of the state to statesmen. Leave off such debates; God’s anger is kindled against Scotland; do not kindle it more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Maurice Grant, Preacher to the Remnant: The Story of James Renwick (Blue Banner Productions, 2009)</cite>, pp. 140-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-4ae8fece6a" data-kw="">
<blockquote><p>And when Robert Hamilton came from abroad [from the Netherlands] among them, they got a brow of brass, calling him [i.e. Alexander Shields, one of the last three Cameronian ministers] a liar, and upbraided him to his face, saying, although he used these arguments [to join the 1690 Church of Scotland] to draw them out of the way of the Lord, yet you dare not publish them. I well remember he said, ‘Dare I not? dare I not? I promise before you all, I both dare and will, and avow it before the world.’ [which he did] But alas they still gave us a deaf ear, and now will not be spoken to nor plead with; however it stands for our mite of testimony… But, if the Lord spare, I resolve to give the world a more surprising account of the rude treatment and unheard-of ingratitude Mr. Shields, [Thomas] Linning [another of the last three Cameronian ministers, which joined the 1690 Church of Scotland], and others received at that time, and since, at their hands… …all know that it was the fewest number of the United Societies, that was led off with Robert Hamilton to the disowning of King William as King of Britain and his Government; the greater part [of the Cameronians] reckoned it their duty to take a legal unite way of witnessing, by humble pleadings, representations, and protestations, pleading for and with their mother to put away her whoredoms.</p></blockquote>

</figure><figure class="quote" id="q-9b8ae6dcb5" data-kw="">
<blockquote><p>There is no patrociny intended, nor can be drawn by the most remote consequence, from what is here pleaded upon the point of separation, unto these dreadfully presaging anti-ministerial principles and practices, that several in this land are sadly precipitating themselves into, which, we hope, will be abundantly clear to the understanding peruser of what I have offered upon that head, and the state of the question, as it is exhibited.</p></blockquote>

</figure><figure class="quote" id="q-3244a3a8cd" data-kw="">
<blockquote><p>as in the case of famous Mr. Alexander Henderson, who, at his first entry to the ministry at Leuchars, was prelatic, and by the bishop of St. Andrews brought in against the parish’s consent, so that, the day of his admission, the Church-doors being shut by the people, they were forced to break in by a window to get him entrance: But a little after, upon the report of a communion where Mr. Bruce was to help, he would needs, from a longing he had for to hear and see such a man, go secretly there, and placed himself in a dark place of the church where he might not be known. When Mr. Bruce was come to the pulpit, he did for a considerable time keep silence, as his manner was; which did some way astonish Mr. Henderson, but much more when he heard the first words wherewith he began, which were these, ‘He that comes not in by the door, but climbs up any other way, the same is a thief and a robber,’ which did, by the Lord’s blessing, at the very present take him by the heart, and had so great an impression on him, that it was the mean of his conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-9e7d466383" data-kw="">
<blockquote><p>Now let every sober conscience consider, whether that day which was first ordained by authority Divine, the apostles would alter by less authority, then authority Divine; especially considering that Christ’s redemption of the World, is the restauration of the World; which is as a new Creation; and as the Lord rested the seventh day from the works of Creation; so the day of Christ’s Resurrection was the day of his rest from the work of redemption, so that still the day of the Lord’s rest is the day of our rest …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Morality of the Fourth Commandment, as still in force to bind Christians</cite>, (London, 1641), p. 41.</span></figcaption>

</figure><figure class="quote" id="q-3fa18d27c5" data-kw="">
<blockquote><p>The first [way] argues that the existence, even for an instant, of composites of act and potency presupposes the simultaneous existence of that which is pure act; the second argues that the existence, even for an instant, of composites of essence and existence presupposes the simultaneous existence of that which is being or existence itself; the third argues that the existence, even for an instant, of composites of form and matter presupposes the simultaneous existence of an absolutely necessary being; the fourth argues that the existence, even for an instant, of things which are many and come in degrees of perfection presupposes the simultaneous existence of something one and absolutely perfect; and the fifth argues that the existence, even for an instant, of finality or directedness toward an end presupposes the simultaneous existence of a supreme ordering intellect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 5, ‘Existential Inertia &amp; the Five Ways’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 87-88</span></figcaption>

>
</figure><figure class="quote" id="q-133a211668" data-kw="">
<blockquote><p>There is another thing that confirms that the fourth commandment will reach God’s resting from the new creation as well as the old, because the Scripture does expressly speak of one as parallel with the other; i.e. Christ resting from the work of redemption is expressly spoken of as being parallel with God’s resting from the work of creation; and that, in Hebrews 4:10, “For he that is entered into his rest, he also hath ceased from his own works, as God did from his.” Now, Christ rested from his works when he rose from the dead on the first day of the week. When he rose from the dead, then he finished his work of redemption; his humiliation was at an end. He rested from his labours and was refreshed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 234.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation.html">Creation</a></span></div>

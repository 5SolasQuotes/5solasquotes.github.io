<main class="wrap"><figure class="quote" id="q-c3a59c9e3c" data-kw="">
<blockquote><p>It was believed [up to the 1560’s and into the 1570’s], that the evangelical Protestant Churches of all lands were recognized as one communion with a pure doctrinal confession. Yet the time was fulfilled; the concord which hitherto had reigned among the professors of the Gospel was drawing to an end. It was modern Lutheranism, which as an offshoot of Flacianism [from Matthias Flacius Illyricus], had crept into the Church; the sworn enemy of Melanchthon and Bucer; this arose with its new ubiquitarian Christology, on the foundation of which a new confession was framed—the Formula of Concord—at Closter-Bergen in May, 1577. Beyond the pale of this confession no communion of evangelical faith was to be acknowledged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformers of England &amp; Germany in the Sixteenth Century: their Intercourse &amp; Correspondence</cite>, (London: Hatchard, 1859) 215 pp. ToC, pp. 85-86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de77c436cd" data-kw="">
<blockquote><p>§6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, (Edinburgh: Anderson, 1697), sect. 10, ‘Of Schism’ Rule was a Scottish, divine-right presbyterian minister., pp. 251-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/lutherans/ubiquity-and-the-lords-supper.html">Lutherans: Ubiquity and the Lord&#x27;s Supper</a></span></div>

</figure><figure class="quote" id="q-55588076c4" data-kw="">
<blockquote><p>§ 9. I now come to consider what apprehensions modern writers have had of schism… I choose one, whom, I think my [episcopal] antagonist will not except against, the learned Bishop of Worcester, in his Irenic. p. 109, the sum of whose discourse is: all are bound to join into some Church society; and being so joined, should continue in that society till his communion with them becomes sin. Now for what makes it sin to continue in Church communion, and consequently warrants separation; he supposes that corruption in the essentials of the constitution of the Church may warrant it…</p></blockquote>

<blockquote><p>The Apostle [Paul] holds forth, that persons may be under the outward administrations of the Covenant, and yet not get the efficacy of it; [Romans 9] v.6. They are not all Israel that are of Israel; the Covenant was made with Abraham and his seed, all that were of him: and yet all were not Israel, that is, partakers of the inward life and efficacy of the Covenant; the Apostle only in these verses endeavours to take off that Objection, that God had broke his Covenant by casting away the Jews, and so distinguisheth of these that were merely of the flesh, who had the outward administration, but not the inward fruit, and these which were elect in the promise, in Isaac shall thy seed be called; the rest he calls the Children of the flesh, the former the Children of promise, v. 8. and so though they were under the outward dispensation of the Covenant, yet God was not mutable, nor his promise, though he rejected them, because of their own degeneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cuthbert-sidenham.html">Cuthbert Sidenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian, Sober &amp; Plain Exercitation on the Two Grand Practical Controversies of These Times; Infant-Baptism and Singing of Psalms</cite>, (London: Robert White, 1654), pp 20-21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>3. In the moral providence of God, is there a place for an ineffective wish? XIII. It is asked, third, whether in the moral providence of God, there is a place for some ineffective wish or desire of God. The Pelagians and Pelagianizers—Socinians, Jesuits, Arminians, and others—because they argue for a self-determined free choice that God cannot determine, and because likewise they argue for a conditioned antecedent will in God, by which God wills if a person wills, and likewise by which he wills that each and every person be saved, if only they will it, say that there is in God a wish properly so-called, by which God desires that this or that duty be done by man, but he desires it in vain. The Reformed acknowledge no sort of wish and desire in God, except that which coincides with his commandment, different from it in this alone, that whereas a commandment urges a duty only by the authority of the lawgiver, a wish urges it by a motive drawn from a certain eminent advantage which is certainly set to fall from that duty upon him who obeys. We examined the reasons on both sides in book 2, chapter 15, §XXXII.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 11, section 13</span></figcaption>

<blockquote><p>David, after having celebrated this benefit of the law – that it offers an abundant reward to those who serve God — immediately changes his discourse, and cries out, Who can understand his errors? by which he pronounces all men liable to eternal death, and thus utterly overthrows all the confidence which men may be disposed to place in the merit of their works. It may be objected, that this commendation, In the keeping of thy commandments there is great reward, is in vain ascribed to the law, seeing it is without effect.

The answer is easy, namely, that as in the covenant of adoption there is included the free pardon of sins, upon which depends the imputation of righteousness, God bestows a recompense upon the works of his people, although, in point of justice, it is not due to them. What God promises in the law to those who perfectly obey it, true believers obtain by his gracious liberality and fatherly goodness, inasmuch as he accepts for perfect righteousness their holy desires and earnest endeavours to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of Psalms</cite>, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: 326.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-b52da0bba0" data-kw="">
<blockquote><p>Wherefore, when the Lord invites the Jewish people to repentance, He gives no injunction concerning another circumcision, though (as we have said) they were circumcised by a wicked and sacrilegious hand, and had long lived in the same impiety. All He urges is conversion of heart. For how much soever the covenant might have been violated by them, the symbol of the covenant always remained, according to the appointment of the Lord, firm and inviolable. Solely, therefore, on the condition of repentance, were they restored to the covenant which God had once made with them in circumcision, though this which they had received at the hand of a covenant-breaking priest, they had themselves as much as in them lay polluted and extinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4; ch. 15, sect. 17, p. 341</span></figcaption>

<blockquote><p>IV. This double covenant is proposed to us in Scripture: of nature and of grace; of works and of faith; legal and evangelical. The foundation of this distinction rests both on the different relation (σχέσει) of God contracting (who can be considered now as Creator and Lord, then as Redeemer and Father) and on the diverse condition of man (who may be viewed either as a perfect or as a fallen creature); also on the diverse mode of obtaining life and happiness (either by proper obedience or by another’s imputed); finally on the diverse duties prescribed to man (to wit, works or faith). For in the former, God as Creator demands perfect obedience from innocent man with the promise of life and eternal happiness; but in the latter, God as Father promises salvation in Christ to the fallen man under the condition of faith. The former rests upon the work of man; the latter upon the grace of God alone. The former upon a just Creator; the latter upon a merciful Redeemer. The former was made with innocent man without a mediator; the latter was made with fallen man by the intervention of a mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.4 (p. 575, modified according to the 1679 edition).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“IV. This double covenant is proposed to us in Scripture: of nature and of grace; of works and of faith; legal and evangelical. The foundation of this distinction rests both on the different relation (σχέσει) of God contracting (who can be considered now as Creator and Lord, then as Redeemer and Father) and on the diverse condition of man (who may be viewed either as a perfect or as a fallen creature); also on the diverse mode of obtaining life and happiness (either by proper obedience or by another’s imputed); finally on the diverse duties prescribed to man (to wit, works or faith). For in the former, God as Creator demands perfect obedience from innocent man with the promise of life and eternal happiness; but in the latter, God as Father promises salvation in Christ to the fallen man under the condition of faith. The former rests upon the work of man; the latter upon the grace of God alone. The former upon a just Creator; the latter upon a merciful Redeemer. The former was made with innocent man without a mediator; the latter was made with fallen man by the intervention of a mediator.”

— Francis Turretin, Institutes of Elenctic Theology, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.4 (p. 575, modified according to the 1679 edition).">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIV.+This+double+covenant+is+proposed+to+us+in+Scripture%3A+of+nature+and+of+grace%3B+of+works+and+of+faith%3B+legal+and+evangelical.+The+foundation+of+this+distinction+rests+both+on+the+different+relation+%28%CF%83%CF%87%E1%BD%B3%CF%83%CE%B5%CE%B9%29+of+God+contracting+%28who+can+be+considered+now+as+Creator+and+Lord%2C+then+as+Redeemer+and+Father%29+and+on+the+diverse+condition+of+man+%28who+may+be+viewed+either+as+a+perfect+or+as+a+fallen+creature%29%3B+also+on+the+diverse+mode+of+obtaining+life+and+happiness+%28either+by+proper+obedience+or+by+another%E2%80%99s+imputed%29%3B+finally+on+the+diverse+duties+prescribed+to+man+%28to+wit%2C+works+or+faith%29.+For+in+the+former%2C+God+as+Creator+demands+perfect+obedience+from+innocent+man+with+the+promise+of+life+and+eternal+happiness%3B+but+in+the+latter%2C+God+as+Father+promises+salvation+in+Christ+to+the+fallen+man+under+the+condition+of+faith.+The+former+rests+upon+the+work+of+man%3B+the+latter+upon+the+grace+of+God+alone.+The+former+upon+a+just+Creator%3B+the+latter+upon+a+merciful+Redeemer.+The+former+was+made+with+innocent+man+without+a+mediator%3B+the+latter+was+made+with+fallen+man+by+the+intervention+of+a+mediator.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+1+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+8.3.4+%28p.+575%2C+modified+according+to+the+1679+edition%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29c6666851.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29c6666851.html">Permalink</a><a class="src" href="https://heidelblog.n

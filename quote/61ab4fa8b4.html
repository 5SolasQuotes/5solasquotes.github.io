<main class="wrap"><figure class="quote" id="q-61ab4fa8b4" data-kw="">
<blockquote><p>I know the most received opinion is that the soul is created by God, and so becomes defiled with sin by the union of it to the body; as when a man falls into the dirt and is soiled and bedaubed, or as water clean in itself receives filth from an unclean vessell into which it is put… For my own part [his traducianism was stated before this passage on the same page] I cannot conceive either how sin should first be in the body before the soul is united to it, or how the soul should receive infection from the body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hieron.html">Samuel Hieron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Penitential Psalm Opened in 30 Several Lectures Thereon</cite>, (Cambrdige: Legge, 1617), on Ps. 51, p. 144 Hieron (1572-1617) was an English puritan within the establishment.</span></figcaption>

</figure><figure class="quote" id="q-773bdeeacd" data-kw="">
<blockquote><p>16. ‘Thine eyes beheld my shapelessness, etc.’ The embryo, when first conceived in the womb, has no form; and David speaks of God’s having known him when he was yet a shapeless mass, τὸ κύημα, as the Greeks term it; for τὸ εμβρυον is the name given to the fetus from the time of conception to birth inclusive. The argument is from the greater to the less. If he was known to God before he had grown to certain definite shape, much less could he now elude his observation… The other is the more natural meaning, that the different parts of the human body are formed in a succession of time; for in the first germ there is no arrangement of parts, or proportion of members, but it is developed, and takes its peculiar form progressively… that though the members were formed in the course of days, or gradually, none of them had existed; no order or distinctness of parts having been there at first, but a formless substance. And thus our admiration is directed to the providence of God in gradually giving shape and beauty to a confused mass.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 139:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>1. There be some preparations which go before faith: Faith is a seed of heaven… so does the Lord set up a new world of faith in a soul void of faith by degrees: There’s a time when there’s neither perfect night, nor perfect day: but the twilight of the morning… There’s a half summer, and a half spring in the close of the spring which God made. The embryo, or birth not yet animated, is neither seed only, nor a man-child only… … 3. Its true, the new creation and life of God is virtually seminaliter [seminally] in these preparations, as the seed is a tree in hope, the blossom an apple, the foundation a palace in its beginning; so half a desire in the non-converted is love sickness for Christ in the seed, legal humiliation is in hope evangelic repentance and mortification: But as the seed and the growing tree differ not gradually only, but in nature and specifically, as a thing without life is not of that same nature and essence with a creature that has a vegetative life and growth, so the preparatory good affections of desire, hunger sorrow, humiliation going before conversion, differ specifically from those renewed affections which follow after…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trial &amp; Triumph of Faith</cite>, … (London, 1652), Sermon 21, ‘Then Jesus Answered &amp; Said unto Her, ‘O Woman, great is thy Faith, etc.”, pp. 312-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

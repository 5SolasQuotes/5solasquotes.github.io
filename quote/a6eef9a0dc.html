<main class="wrap"><figure class="quote" id="q-a6eef9a0dc" data-kw="">
<blockquote><p>In fact let us learn how greatly our nature inclines toward idolatry.… That saying of Horace still stands: once the gods of fools are born of fear. Or rather, as Scripture teaches, once the true knowledge of God has been blotted out by sin, the mind of man becomes a perpetual forge of idols.… Man will be compelled to confess that he is a transient being, and that those whose images he worships were once mortals like himself; yet he transfers divinity to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.11.8–9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/first-commandment.html">First commandment</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-238d431ef1" data-kw="">
<blockquote><p>It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Mortification of Sin in Believers</cite>, on Col. 3:5 (covetousness which is idolatry)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/mortification.html">Mortification</a> › <a href="../topics/sanctification/mortification/mortification-of-sin.html">Mortification of sin</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is known that this duty is frequently enjoined and prescribed unto us: Col. 3:5, “Mortify therefore your members which are upon the earth; fornication, uncleanness, inordinate affection, evil concupiscence, and covetousness, which is idolatry.” … The “members that are upon the earth” are our affections: for in the outward part of the body sin is not seated; in particular, not “covetousness,” which is there enumerated, to be mortified amongst our members that are on the earth. Yea, after grace hath taken possession of the soul, the affections do become the principal seat of the remainders of sin.… Hence the great duty of mortification is chiefly directed to take place upon the affections.”

</figure><figure class="quote" id="q-99dfff926c" data-kw="">
<blockquote><p>Therefore, in forbidding us to have strange gods, he means that we are not to transfer to another what belongs to him. Even though there are innumerable things that we owe to God, yet they may be conveniently grouped in four headings: (1) adoration (to which is added as an appendix, spiritual obedience of the conscience), (2) trust, (3) invocation, (4) thanksgiving.… As the Lord suffers nothing of these to be transferred to another, so he commands that all be rendered wholly to himself.… And it will not be enough to abstain from a strange god.… If we are content, therefore, with one God, let us remember what was said before: that we are to drive away all invented gods and are not to rend asunder the worship that the one God claims for himself. For it is unlawful to take away even a particle from his glory; rather, all things proper to him must remain with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>

</figure><figure class="quote" id="q-9568da3cfe" data-kw="Queen of Heaven Idolatry Paganism">
<blockquote><p>But if &quot;the Queen of the heavens&quot; be adopted, then I am inclined to think that the moon is intended: and we know how much superstition has ever prevailed among most people as to the worship of the moon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on Jeremiah</cite>, Jer. 7:18</span></figcaption>

</figure><figure class="quote" id="q-da795d9398" data-kw="">
<blockquote><p>From all this it appears that the Romanists worship images in the same way that the heathen of old did, and pagans of our own day still do. They &quot;bow down to them and serve them.&quot; They pay them all the external homage which they render to the persons they are intended to represent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, p. 1946</span></figcaption>

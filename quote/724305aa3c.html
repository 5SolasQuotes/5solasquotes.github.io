<blockquote><p>In and by the lawful use of the Lord’s Supper, the sealing of grace will progress to its highest degree and will be certain and infallibly secure. (Matt. 26:26; 1 Cor. 10:16-17; Ps. 93:5).

It is therefore erroneous … that some, because they are so weak in the faith and have so little assurance of their salvation, at times abstain from partaking of the Lord’s Supper. They dare not partake because they lack assurance.

Instead, however, they should partake in order to attain such assurance. The Lord’s Supper is the pledge or wedding ring whereby it pleases Christ to enlarge our hearts in a more powerful and lively manner. If we were always emotionally engaged and always steadfast in our walk, the Lord’s Supper would not be needed. All the more reason for us to partake, for it is here that we most frequently fail. Who would refrain from eating because he is too weak? Precisely, then, one ought to eat in order to become stronger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guiljelmus-saldenus.html">Guiljelmus Saldenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Efficacy of the Lord’s Supper to the Comfort and Sanctification of God’s Children</cite>, (1664), trans. Bartel Elshout in James A. De Jong (ed.), In Remembrance of Him: Profiting from the Lord’s Supper (Grand Rapids MI: Reformation Heritage Books, 2012), pp 55-56.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

<blockquote><p>When I deny that the body of Christ is present locally, substantially, bodily, and carnally, it must not be inferred that we eat Christ’s body falsely, in pretense or imagination. For if they understand by these words the reality of the thing itself, I will not deny that the body of Christ is truly received by us. What we comprehend by faith must not be considered false or feigned, counterfeit or a phantom.</p></blockquote>

</figure><figure class="quote" id="q-aceeeadda8" data-kw="">
<blockquote><p>Now in all these commands, as their subject matter consists of things forbidden in the ten Commandments, as blasphemy, Apostasy, Witchcraft, Profanation of the Sabbath, etc. So that the commands for punishing such (for the substance of them), are moral too of common reason and equity, given to all Nations, and for all ages […]

For the first, let the Reader lay together these particulars I. that tis evident some of these commands, as against offering their children to Molech, as against dealing and contracting with a familiar Spirit deserve punishing among Christians and under the Gospel now, as well as under the Law, and if these, why not the other of Blasphemy, Idolatry, false prophecy, &amp;c? These latter are of moral things as well as the other; the first and these are delivered both by Moses in the same books, time, propounded after the same tenor and way, upon the same grounds and reasons […]

But if it be said those commands against offering their seed to Molech and of witches, are therefore punished by the magistrate, because they offend against lives and estates of mankind, in killing the children, in cattle being killed, and men’s bodies being hurt by witches and wizards, which is not the other of Apostasy, Blasphemy, &amp;c. I reply, tis to be observed that in all those places where the commands are given by God to the Magistrate about these, there’s not one jot or tittle expressed about offending against the second Table in life or goods, but all the reason formally declared, is, because against God immediately, and the commands of the first Table […]

Secondly, these commands to the Magistrate concerning Idolaters, Blasphemers, &amp;c. were not for the punishing of Israelites, the Jewish people only, but of all strangers in their Land, both of Proselytes that dwelt among them, and of others that only travelled through, or were there a while upon trading or such like occasions as these Scriptures show [he cites Lev. 20:2; 24:16] […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The casting down of the last stronghold of Satan: a treatise against toleration and pretended liberty of conscience</cite>, (London, 1647), pp 46-9.</span></figcaption>

</figure><figure class="quote" id="q-3fb15df988" data-kw="">
<blockquote><p>And let it not seem strange to you, we are not so much to deal with a promise here as with the thing promised, nor to feed on a promise as upon Christ himself by faith, to eat his flesh and drink his blood, This is my body, &amp;c. Christ is the meat here for the hand of faith to receive, the mouth of faith to eat, as he faith, My flesh is meat indeed, and my blood is drink indeed. You may make use of the promises here, the Sacrament is the seal to every promise in the covenant.

But the matter of the Sacrament indeed, and that whereon we are chiefly to feed, is Christ himself. Christ as he is laid out unto us in his death and sufferings, whereon feeding, we get spiritual nourishment for grace, and death of sin. The blood of Christ, like the waters appointed for the trial of jealousy, hath a double property, to kill and to make fruitful; to kill our sins, and make our graces grow; to rot our sins, and ripen our grace.

Well then, remember that the great dish thou feedest on at this Feast, be Christ himself. Thou canst not feed upon a promise, until thou first feed upon Christ; he doth not only give us title and interest in them, but appetite to them. If thou feed on him, thy stomach will be quicker to feed on them; nay, if thou feed on him, thou feedest on all the promises, and hast an interest in all the good of them, the sweet of all the promises is tasted in Christ. All the promises are folded up in Christ, and thou canst not feed on him, but thou feedest on all, and hast the blessing of every one in particular. The promises of justification, sanctification, subduing of corruptions, increase of grace, upholding in grace, interest in glory, they are all of them folded up in Christ, he is all.

The promise doth not, but Christ doth justify, Christ doth sanctify; you get nothing from the promise separate from Christ, but all the good of the promise comes in by Christ, and therefore here terminate your faith. And so much for the second, upon what object we must terminate our Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guard of the tree of life, or, A sacramental discourse shewing a Christians privilege in approaching to God in ordinances, duty in his sacramental approaches, danger if he do not sanctify God in them</cite>, (London: A. Kemble, 1644), pp 52-54.</span></figcaption>

on%2C+subduing+of+corruptions%2C+increase+of+grace%2C+upholding+in+grace%2C+interest+in+glory%2C+they+are+all+of+them+folded+up+in+Christ%2C+he+is+all.%0A%0AThe+promise+doth+not%2C+but+Christ+doth+justify%2C+Christ+doth+sanctify%3B+you+get+nothing+from+the+promise+separate+from+Christ%2C+but+all+the+good+of+the+promise+comes+in+by+Christ%2C+and+therefore+here+terminate+your+faith.+And+so+much+for+the+second%2C+upon+what+object+we+must+terminate+our+Faith.%E2%80%9D%0A%0A%E2%80%94+Samuel+Bolton%2C+The+guard+of+the+tree+of+life%2C+or%2C+A+sacramental+discourse+shewing+a+Christians+privilege+in+approaching+to+God+in+ordinances%2C+duty+in+his+sacramental+approaches%2C+danger+if+he+do+not+sanctify+God+in+them%2C+%28London%3A+A.+Kemble%2C+1644%29%2C+pp+52-54.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3fb15df988.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3fb15df988.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/11/17/samuel-bolton-on-feeding-on-christ-in-the-lords-supper/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ee07e90ee8" data-kw="">
<blockquote><p>And let them not here allege, That I am deceived in the opinion that I have of the substance of the Eucharist. For the question is not, whether the Eucharist be bread or not, (this should be disputed apart) but whether he who believes that it is bread in substance, can adore it, without making himself guilty of Sacrilege, and giving a creature that honour which is due to the Creator.

For if one should grant, That he cannot (which we now are coming to demonstrate from the premises very evidently) I have gained the point that I intended to prove: it being clear, that this supposeth We have had reason to separate from Rome, seeing we believe that the Eucharist is bread in substance; it being impossible for us to yield to that worship, which she desires we should give it, unless we give to a creature that, which we are bound to give only to the Creator. Whence all the odious question concerning schism is ended.

For we call that schism, which is a separation made without necessity. So that when my conscience forbids me under pain of God’s wrath, and my own damnation, to obey that which you command me in this particular, ’tis evident, that it is not fancy, pleasure, or faction, but a pure necessity that constraineth me to separate from you. If you cannot tax this my opinion, much less can you condemn my separation.

Accuse me if you please of stupidity, For not being able to conceive, how a body that is in heaven can be at the same time in a thousand places on earth; how all the quantity of a complete man can be brought within one single point; how a thing, that my sense and reason knoweth to be bread, and the H. Scripture calleth oftentimes bread, can not be bread at all for all this; but the very Creator of the world.

Blame as much as you please the dullness of my spirit, that cannot comprehend a whit of these pretended mysteries. But once presuppose my belief to be true, and then you cannot shew me wherein I do amiss in separating from you. At this time ’tis sufficient, that I have shown, that our separation is not contrary to charity, which obligeth no man to embrace that, in favour or love of his neighbour, which he believes disagreeable to God’s will, and pernicious to his own soul.</p></blockquote>

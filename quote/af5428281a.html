<main class="wrap"><figure class="quote" id="q-af5428281a" data-kw="">
<blockquote><p>7. If we may make images and crosses alike in shape, but dislike in use, in God’s worship, we may bring in golden calves to the temples [church buildings], and the image of Dagon, and the Sidonian gods, and altars such as Josiah destroyed, so at their first molding we imprint on them chaste and innocent religious intentions and signification, and make them alike in shape, but dislike in use to heathen worship. But sure the calf of Egypt and the calf that Aaron made, though like in shape, yet were dislike in use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), A Dispute Touching Scandal &amp; Christian Liberty, p.90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>§7. Of Bowing at the Name of Jesus It is rationally supposed that in this act, not the name, but the Person so named is made the object of adoration; the name pronounced is only the occasion of the present adoration of the Person. Nothing in reason or Scripture does evince that it is simply evil to adore Christ by incurvation of the body or other reverent gesture upon occasion of the pronouncing of the name “Jesus.</p></blockquote>

</figure><figure class="quote" id="q-729868d934" data-kw="">
<blockquote><p>And to be precise, [Christ instituted the sacrament] ‘after washing their feet,’ as many [sources] say. For when the meal was begun (John 13:2), He rose from the table (verse 4) and washed the feet of his disciples, as was the customary practice of eastern peoples (Luke 7:44). He did so in order that by this exemplary action He might show them the way to humility and love, and testify his favor towards those who are his–that He is certainly the one who cleanses his people from their uncleanness (John 13:8-10, 14). And He did so in order to teach them by means of a comparison (and not a sacrament) with what frame of mind they ought to approach these sacred things. Even so the western church has, elsewhere and sometimes not without abuse, adopted the practice as a sacrament. … Nor do the following facts have any force of being required or observed: that the supper was given to them… after their feet had been washed… (some [things] of which were observed for some time in the early church).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, ... (1625; Brill), vol. 3, Disputation 45, ‘On the Lord’s Supper’, pp. 183-85 &amp; 187</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>3. Touching the material parts of the sacrament, what elements He appointed: even such as of all other are of most general use among all nations, bread and wine, those which most befit a common salvation, Jude verse 2, and a common Savior, 1 John 2:1. 4. Touching the formal part of it, which consists in his manner of consecration, and the analogy between the outward elements and spiritual and heavenly things signified under them, that it may be known to be a spiritual meat [food], even the Word, the bread of life, and spiritual drink, even the quickening and enlivening Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-gell.html">Robert Gell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gell’s Remains, or, Several Select Scriptures of the New Testament Opened &amp; Explained</cite>, … (London, 1676), Notes &amp; Observations upon 1 Corinthians 11:26, pp. 182-3</span></figcaption>

</figure><figure class="quote" id="q-6649a5160f" data-kw="">
<blockquote><p>…for rulers in making laws, and creating by their sole pleasure goodness-moral, in particular matters without the Word of God, are not God’s servants, nor is human authority as human, the nearest cause of obligation of conscience, instamped in these laws, nor is it the cause at all, and therefore to resist them, is not to resist God. They be God’s instruments and ministers in: 1. Propounding and expounding God’s laws. 2. In executing them and defending them from the violence of men. 3. In making positive and directory civil laws for civil government that are laws improperly so called, which bind the conscience as above is said, insofar as they have dependence upon God’s Law; For James says, ‘There is but one Lawgiver’ [James 4:12]. As for Church-canons, all, except physical circumstances in them, are to be warranted by the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Ch. 2, Question 2, p. 208</span></figcaption>

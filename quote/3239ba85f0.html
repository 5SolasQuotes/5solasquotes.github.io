<main class="wrap"><figure class="quote" id="q-3239ba85f0" data-kw="">
<blockquote><p>Now though the cause of our heaviness be just, yet may not our affections herein be yielded unto with too much indulgence and favour. The grief of compassion whereby we are touched with the feeling of other men’s woes is of all other least dangerous. Yet this is a let unto sundry duties, by this we are to spare sometimes where we ought to strike. The grief which our own sufferings do bring, what temptations have not risen from it?

What great advantage Satan hath taken even by the godly grief of hearty contrition for sins committed against God the near approaching of so many afflicted souls whom the conscience of sin hath brought unto the very brink of extreme despair doth but too abundantly shew. These things wheresoever they fall cannot but trouble and molest the mind. Whether we be therefore moved vainly with that which seemeth hurtful and is not: or have just cause of grief being pressed indeed with those things which are grievous, our Saviour’s lesson is, touching the one, be not troubled, nor over troubled for the other.

For though to have no feeling of that which merely concerneth us were stupidity, nevertheless seeing that as the Author of our Salvation was himself consecrated by affliction, so the way which we are to follow him by, is not shrewed with rushes but set with thorns, be it never so hard to learn, we must learn to suffer with patience even that which seemeth almost impossible to be suffered, that in the hour when God shall call us unto our trial and turn this honey of peace and pleasure wherewith we swell in that gall and bitterness which flesh doth shrink to taste of, nothing may cause us in the troubles of our souls to storm and grudge and repine at God, but every heart be enabled with divinely inspired courage to inculcate unto it self Be not troubled, &amp; in those last and greatest conflicts to remember it that nothing may be so sharp and bitter to be suffered but that still we our selves may give our selves this encouragement, Even learn also patience, o my soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Remedy Against Sorrow and Fear, Delivered in a Funeral Sermon</cite>, (Oxford: Joseph Barnes, 1612), pp 6-7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25c214506e" data-kw="">
<blockquote><p>There is a great difference between inimical segregation, like sedition in a commonwealth; and a going severally upon weighty reasons and without breach of charity. And among other weighty reasons [for this,] this may be one: That all Christians of sound faith and good life, that are dissatisfied about some human injunctions and orders in a Church, may not for lack of tender regard towards them be utterly abandoned and exposed to be led aside into the errors of the wicked, as to heresy, apostasy or a course of irreligion. It is in the power of rulers to grant this indulgence to such dissenters, when it is not in the power of dissenters to change their judgments. And this is not to set up Church against Church, or according to an ancient manner of speaking, altar against altar, but only either occasional and temporary assemblies, or at the most but diverse churches distinguished by their several places of assembling, as one parish-church from another; and by diversity of external order, as the allowed congregations of foreigners in London from the parish churches. The same true religion for the substance thereof, is exercised; and the same holy ends are pursued in the one and the other. And there will be no opposition between them but what an unchristian enmity, proceeding from worldly lusts and interests, will produce. … After such [a] Comprehension [be] setled, the toleration of all tolerable dissenters within such limits as will secure public peace and safety, is more agreeable to the wisdom and clemency of rulers, and the charity of Christians, than the rigorous constraining of the said dissenters to what they cannot bear and the restraining of them from the liberty of serving God according to their consciences.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity</cite>, ... (London: 1683) | A Defense of my Endeavors for the Work of the Ministry, pp. 26-27</span></figcaption>

</figure><figure class="quote" id="q-d73f9ef76a" data-kw="">
<blockquote><p>For the work of peace, at the persuasion of some friends, he took a journey thitherward [to Lutheran Sweden], where he arrived in June, anno 1636… a resolution was taken to permit Master Dury to treat with the divines of that kingdom… to which he might address himself particularly, and lay open his intention… There he had conference both collegially and severally with the professors of divinity, who gave full assent unto his desires, and set down these conditions, upon which they were ready to agree, and join with the reformed side:

1. That a full agreement should be made in all the fundamental articles of Faith.

2. That all errors overthrowing the foundation, or tending to overthrow the same, should be condemned.

3. That in matters ceremonial and of indifferency, there should be a mutual toleration.

4. That betwixt the parties, united sincerity and uprightness should be maintained, lest ancient errors might be upheld under doubtful speeches.

5. That when peace is made, none should be suffered to maintain, excuse or spread any more the errors once condemned.

6. That ambitious and needless disputes and brabblings should be inhibited on all sides.

7. That former reproaches and injuries should be put to oblivion.

8. That the Church government should be settled according to apostolical rules. These demands the rest agreed unto, neither was any thing of moment added thereunto by any.</p></blockquote>

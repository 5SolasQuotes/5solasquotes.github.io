<main class="wrap"><figure class="quote" id="q-ec305559fa" data-kw="">
<blockquote><p>Christ hath travelled the road, he hath shewed us the way both as to doctrine, discipline, worship, and government. Now, when a visible church doth not follow him, but will needs, like Israel, follow other leaders, and walk after the commandments of men, and manage the affairs of Christ’s kingdom, according to the plan of worldly politics, whereby the kingdoms of this world are ruled and governed; in that case she does not follow her King, she practically disowns Jehovah for her Head, and thereupon she is dismantled of the walls of her salvation, her chariots and horsemen are gone, and in that case, the “boar out of the wood doth waste her, and the wild beast of the field devours her.” The church of Christ can never thrive but by treading the footsteps of Christ, the Breaker, that has gone up before us, he having “left an example, that we should follow his steps.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second Sermon on Micah 2:13 in The Works of Ebenezer Erskine</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-28c3555c70" data-kw="">
<blockquote><p>5. Also, there is a difference between the constraining of a circumcised or baptized people to worship God in the purity of ordinances, as they have been engaged thereto, which was Josiah’s practice, and the constraining of a people to engage and be baptized which were not formerly engaged; because, actual members of a Church have not even that liberty as others have to abandon ordinances: and this puts them to no new engagement in religion, but presses them to continue under former engagements and accordingly to perform: Hence we see, that both in the Old and New Testament, Church-members have been put to many things and restrained from many things, which had not been pertinent in the case of others. See, 2 Chron. 15:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, ... (Edinburgh: Higgins, 1659), pt. 3, ch. 4, pp. 253-54</span></figcaption>

</figure><figure class="quote" id="q-1181f8ced7" data-kw="">
<blockquote><p>It is the duly of government to provide for the moral training and culture of the community, especially of the young, by encouraging education, endowing schools and colleges, watching over their interests with parental solicitude, and taking care that the young shall be educated so as to make them good men and useful citizens. To attain this the reading of the scriptures must be made a prominent part of ordinary school education. To refuse the scriptures a place in common schools is directly to encourage and strengthen the growth of infidelity. Education can never be safely separated from Christian principle. For this reason a national provision for religion should embrace a provision for national education. The latter is an important part of the former. There is an inconsistency on the part of some who while they are friendly to a public provision for schools, are opposed to a public provision for the support of religion. The objection made against the latter may with equal propriety be made against the former, unless schools are so conducted as to have no reference to the Christian religion; and then it might be doubted whether they would he ultimately any advantage to a community.

The immediate end of civil government is the good of society; but this is most perfectly attained where the glory of God is kept in view as the ultimate end. The welfare of society can never be secured irrespective of this. The attainment of the ends of civil government require that provision should be made for Christian instruction and education. Immorality and crime will thus be most surely prevented, and to prevent is incomparably better than to punish crime. The prevalence of vice, and the general corruption of society necessarily and universally accompany mental debasement and religious ignorance. If it were the design of a government to encourage vice and ruin the happiness of a community, the object could not be gained more effectually than by discountenancing religious education and the regular ministration of divine truth from sabbath to sabbath. Let the places of Christian worship be shut, and the schools closed where the scriptures are read, and the race of infidels reared in such a state of things, would soon demonstrate the folly and wickedness of the policy pursued. Society would soon become a pandemonium. And as a national policy may tend to lessen the means of Christian instruction and education, the same ruinous effects will in part follow. The French revolution and the horrid scenes of blood which followed it, show that it is unwise and dangerous to separate religious principle from national policy. Such a course is as dangerous to the safety and stability of a government, as it is destructive of national happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), pp 289-90.</span></figcaption>

</figure><figure class="quote" id="q-b30031b09d" data-kw="">
<blockquote><p>Although some of Richard Sibbes’s comments in his book on Josiah’s Reformation lend too much weight to an Erastian position, nevertheless, he accurately distinguishes between the civil magistrate’s lawful authority circa sacra (concerning religious matters) and the church’s authority in sacris (in intrinsically sacred matters):

[A]s a chief right, the ordering of the matters of religion belongs to the care of the prince. But there are two things in religion: first, intrinsecal [sic], within the church, as to preach, administer the sacraments, and ordain ministers. These he ought not to do. But for those things that are without it, these belong to him. If any of those that are placed in church or commonwealth do not their duty, it is fitting for him to correct. He ought to set all a-going without, and to remove abuses, but not to meddle with the things within the church aforesaid, as to execute the same, but to oversee and govern their execution, and those persons whose proper office it is to execute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Josiah’s Reformation. Laid open in four sermons</cite>, (London, 1637) in Works of Richard Sibbes, ed. A. B. Grosart (1862-3; 7 vols, Edinburgh, 1983), vi, 88.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>…look what is the largest extent of the prince’s power and privilege in matters belonging unto God’s worship, which either God’s Word, or the judgment of sound divines does allow to him, none shall be found more willingly obsequious [readily obedient] to his commandments than we.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 12</span></figcaption>

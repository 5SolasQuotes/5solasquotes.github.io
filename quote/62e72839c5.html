<blockquote><p>…I shall desire you to consider the ground why such affirmative precepts, as command duties relating to others, do not bind to always. The duties that they command are principally to this end, that they do good to men for the curing of their evils, for the farthering of virtue in them. Wherefore when prudence shows that such actions will be fruitless in respect of the end, or contrariwise harmful, they are to be forborne.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper. Or a Brief &amp; Scholastical Debate of that Question which has so Wonderfully Perplexed Many, Both Ministers &amp; People: Whether or No the Sacrament of the Lord’s Supper may (according to Presbyterial Principles) be Lawfully Administered [by a Minister] in an un-presbyterated church, that is, a church destitute of ruling elders. Wherein the affirmative is confirmed… (London, 1650) Jeanes was an English presbyterian., p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-644a4b274b" data-kw="">
<blockquote><p>I. When two commandments of the moral law are opposite in respect of use as we can not do them both at the same time: then the lesser commandment gives place to the greater and does not bind for that instant. Example 1. God commands one thing, and the magistrate commands the flat contrary: in this case which of these two commandments must be obeyed, ‘Honor God,’ or, ‘Honor the Magistrate’? The answer is, that the latter must give place to the former, and the former must only be obeyed. Acts 4:19, ‘Whether it be right in the sight of God to obey you rather than God judge ye.’

II. The 4th Commandment prescribes rest on the Sabbath day. Now it [falls?] out that at the same time [that] a whole town set on fire, and the Sixth Commandment requires our help in saving our neighbor’s life and goods. Now of these two commandments, which must be obeyed? For both cannot. The answer is that the Fourth Commandment at this time is to give place, and the Sixth Commandment alone binds the conscience: so as then (if need should require) a man might labor all the day without offence to God. Mt. 9:13, ‘I will have mercy and not sacrifice.’ And the rule must not be omitted that charity towards our neighbor is subordinate to the love of God, and therefore must give place to it. For this cause the commandment concerning charity must give place to the commandment concerning love to God: and when the case so falls out that we must either offend our neighbor or God, we must rather offend our neighbor than God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience</cite>, … (Cambridge, 1596), pp. 14-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

<blockquote><p>There are commandments which may be called the least, and there are others which may be called the greatest, In ordine motum [in the order of the motion], the order shows the weight. The fundamental article of the Covenant is to have God for our God, and to prefer natural worship before instituted: the means stated, before manner and time [of them]; God before man; parents before others.</p></blockquote>

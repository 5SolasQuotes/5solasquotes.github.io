<main class="wrap"><figure class="quote" id="q-fdf2851653" data-kw="">
<blockquote><p>We grant that these prophecies [Isaiah 59:20; Amos 9:11] contain evident arguments for a future restoration of Israel, if you will acknowledge that which is before clearly proved by the testimonies of the Apostles, and by experience, that is, that they are begun already in part: we grant also, that they have such correspondence with these texts of Esaie and Amos and many more to: but we deny 1. your manner of restoration, and we hold that the spiritual restoration is more glorious for the honour of God and weal of Israel. 2. we deny that the Apostle James alledgeth the prophecy of Amos for such a conversion of the Jews: for he speaks expressly of visiting the gentiles, to take out of them a people unto His name Act. 15.14. and of this visiting he expones the words of Amos and the other Prophets: he speaks not only of Amos, but saith generally, and to this agree the words of the Prophets.

3 we deny that the Apostle Paul alledgeth the prophecy of Elaie to that pretended purpose, for he saith not, and then all Israel shall be saved, but, and so all Israel shall be saved: he shows no order or difference in time, but makes a conclusion out of the former words, where he saith, Blindness in part is happened to Israel, until the fullness of the gentiles shall come in: and then he inferreth, And so all Israel shall be saved: and therefore the conclusion must be exponed according to the proceeding words, that is, all Israel are the called of Israel and of the gentiles: there is a distinction twixt Israel, and all Israel; and all Israel is more than Israel, seeing it includes likewise the faithful gentiles: and in this signification the proof following in the cited testimony must necessarily be understood, and not of a calling of the Jews after the full calling of the gentiles: and far less of that calling, which (he saith) shall perhaps be (not in part but) of all the gentiles that shall be left. Yea these conjectures destroy one another: for if the calling of the Jews shall be after the fullness of the calling of the gentiles, then all the gentiles that shat be left cannot be called through the wonderful deliverance of the Jews.

And this last conjecture destroyeth a many tenet of the Millenaries, who say, that the Jews shall rule over all the nations, and hold them in subjection till the end of the 1000 years, and then these profane nations shall rise again in arms against the Jews. Now seeing betwixt these above named prophecies of Jere. 23. and 31, &amp;c. and these two of Esaie and Amos, there is not any material difference, and no other difference them betwixt a brief intimation and a large explication of the same thing: and seeing these prophecies of Esaie and Amos are to be understood of the Christian Church and estate thereof from the beginning till the end, as the Apostles James and Paul expone them, this conclusion follows, These above named prophecies give no ground for the earthly monarchy of the Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-petrie.html">Alexander Petrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Chiliasto-mastix. Or, The prophecies in the Old and New Testament concerning the kingdom of our Savior Jesus Christ. Vindicated from the misinterpretations of the millenaries and specially of Mr. Maton in his book called Israel’s redemption</cite>, (Rotterdam: Isaak UUaesbergen, 1644), pp 24-25.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0685cc3d93" data-kw="">
<blockquote><p>There is an old story about an oracle of the sibyl concerning Athens – that two banes would be its ruin, namely deceit and the stupidity of its leaders. However, if we consider the everyday life of men and the destruction of realms, the sibyl was prophesying not only for Athens but for all cities and empires.

In the past, Germany excelled both in the greatness of minds and in the truth, honesty and faith of its counsels. Nowadays people contend with ruses, righteous intentions are made sport of, and the ancient desire for military glory and courage are extinct. Therefore you can see that there is no help in such public danger, not only in Germany, but also in the rest of Europe.

When I think about this, I am distressed in my mind for the Church and for our studies, both of which are particularly threatened with devastation and ruin by the savagery of the Turks [Islam]. [1] Although dangerous hardship is imminent, as there are many signs not only in the stars, but also in the morals of men, I nevertheless sustain myself by the hope that God will care for the Church, and that the Son of God will defend our assemblies, as Daniel foretold.

Therefore, young men, these our studies are not to be cast away in desperation of rewards or of salvation. On the contrary, they are to be kindled even more enthusiastically, so that they may be preserved even in the midst of enemies, if that is what destiny brings. And because these our assemblies are part of the Church, every time we gather together, every time we think of our studies, let pious prayers be added, and let us pray to God, the Father of our Saviour Jesus Christ, that He may protect the Church and honest studies, and save and guide us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Astronomy and Geography (1536) in Orations on Philosophy and Education</cite></span></figcaption>

<blockquote><p>Question 8, Is it lawful to tolerate the synagogues of the Jews, in which they blaspheme the name of Jesus? Although there is no lack of rescripts of civil and canon law by which synagogues are permitted to the Jews, and it is granted that they should neither be killed, nor violated, nor hindered in their festivals (L. nullus, et L. die, Sabbathi, C. de Judæis, l.6; C. de paganis; see also the sanction of Theodoric, King of the Romans, in Goldast. Regis, apud Goldast., vol. 3 and of Emperor Conrad IV, vol. 2, Constit. Emper.) Yet it cannot be permitted with a safe conscience that they freely blaspheme the Lord Jesus in their synagogues and curse Him, or that they seduce Christians, nor are marriages to be entered into with them unless the hope of conversion to the Christian faith shines forth, nor are negotiations or autonomy to be granted to them on Sundays and other Christian festivals, but rather they are to be treated as exiles and servants and marked with a certain sign of a harmful sect: Ἀναγκἀνῷ [sp.? “Compel”]. Liberty is to be permitted to those passing over to the Christians, and the way opened to them, with laws established for hearing evangelical sermons, and for attending instruction from the writings of the New Testament by those who are exceptionally skilled in the Hebrew language and the original text. Nor do those rescripts abolish such laws, provided that coercion of faith, which is hostile to conscience, is absent, since Lk. 14:23, ἀναγκασοὺς [compel] is prescribed for the ministry, not as civilly coercive, but morally persuasive. Let there be , however, a sincere intention of leading miserable men to the faith of Christ, and let those means by which we might win them over be piously employed, such as friendly admonitions and gentle persuasions (with harshness removed), and above all clear arguments and illustrious proofs from Scripture that conquer the mind: which God blesses, as the examples of many thousands converted to the Christian Faith from the 5th to the 15th century testify. See Jerome of the Holy Faith, Book Against the Jews, and the preface of the same; Beda, qv. 30, on 1 Kings; Council. Toletan. ch. 57 etc. Although indeed by the right of political superiority no one can be forced to the Faith, as Thomas teaches, pt. 2 of 2, q. 10, art. 8, yet that Jews cannot be compelled to hear the faith is Ἀναγκάζον [constraining], because this is purely extrinsic, and a παιδαγωγός [guide]: but that [faith] embraces an intrinsic act tending toward the intellect itself and the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abraham-calov.html">Abraham Calov</a></span><span class="wk"><span class="lbl">Work:</span> <cite>System of Theological Places</cite>, (Wittenberg: Wilkius, 1677), vol. 8, Article 4, On Family Hierarchy, ch. 6, On the Duties of Parents &amp; Children, Masters &amp; Servants tr. AI by The Faith Received Calov (1612-1685) was a professor of theology in Konigsberg and Wittenberg, and a champion of Lutheran orthodoxy in the seventeenth century.</span></figcaption>

<blockquote><p>Second, it is asked whether their rites are as it were idolatry. That it seems so:

1. From the fact that it is said in Gal. 5:1, on the words, “Do not again be entangled with the yoke of bondage,” the Gloss says: “This bondage is not lighter than that of idolatry,” because the servitude of the legal observances is likened to idolatry in burden.

2. And again, it is said on the words in Gal. 4:9: “To whom do you wish to serve again?” the Gloss says: “The observance of the Law.” From this it is had that the servitude of the Law, to which they were then devoted, was a sin nearly equal to the servitude of idols, to which before their conversion they had been given over, and is as it were idolatry. And this is explained there by what follows: “The Law after Christ does not differ greatly from ancient idolatry”; it is manifestly shown that the servitude of the Law is now as it were idolatry. On the contrary. a. The Law prescribed believing in God and rendering to Him alone latria [worship]; but idolatry requires the contrary: for it rendered latria to the idols themselves; therefore the servitude of the Law is in no way equal to idolatry in sin. [Solution]: 1-2. To this it must be said that it is not an equal sin for the Jews themselves to observe the rite of the legal observances and to commit idolatry; but it is said to be a sin for those themselves who have assumed the Christian Faith, nearly equal because in both cases there is apostasy, though not equal. As to burden also it had likeness: for in both cases the burden was greatest, and therefore the sacrifices of the Jews were rejected just as those of the gentiles were. But it is said not to differ from idolatry because in both cases there was unbelief. For the Galatians, when they were gentiles, served the superstition of idolatry; but when they drew back from the catholic Faith, which forbade it, they again fell into the servitude of the legal observances, as it were into unbelief. Furthermore, by reason of the performed act, namely sacrifices, there was agreement with idolatry; also by reason of the propensity to sacrifice and of the superstition itself in sacrifices. Yet for the Jews it is not so great a sin now to adhere to the Law as was the sin of those who adhered to idols.</p></blockquote>

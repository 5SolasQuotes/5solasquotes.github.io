<main class="wrap"><figure class="quote" id="q-b72348cc45" data-kw="">
<blockquote><p>Hence the promises of the Gospel are indefinite, not universal, and in the Lord’s purpose and intention made with the Elect only, not with the Reprobate at all, for when God saith, if Judas, Cain, Pharaoh, believe they shall be saved, the Lords purpose being to deny to them the grace of believing, without which it is unpossible they can believe, the promise in God’s purpose is not made with them: He that so willeth what he promiseth upon a condition, which he that so willeth, only can do and work, and yet will not do or work the condition; he doth indeed not will to the party, what is so promised, if John send Peter to work in his garden upon condition, that if he work, he shall give him a talent a day, and in the mean while John only can give to Peter strength of legs, and arms, and body to work, can determine his consent to the work, and yet refuse to give strength, and to win his consent to the work; Sure he never willed either to give him a talent for his work, nor intended he should work at all.

Hence I argue, it is against the wisdom of God to intend and will that the Reprobate be redeemed, pardoned, saved, upon a condition, which he himself only can work by his grace, and absolutely and irresistibly will not work. Now in Scripture such a thing is argued not to be done, because the Scripture must be fulfilled; and the decree of God and his will fulfilled, as Christ’s bones upon this ground, could not be broken, and such a thing is done that the Scripture, and so the will and decree of God might be fulfilled, so that which is never done, is simply God’s will it shall never be done; that which is done is simply God’s will it must be; I mean either his permissive or approving will; and the will of God revealing, what is the duty of Reprobates though it never be done, argues it was not simply the will of God; hence that voluntas signi, in which God reveals what is our duty, and what we ought to do; not what is his decree, or what he either will, or ought to do, is not God’s will properly, but by a figure only, for commands, and promises, and threatnings revealed, argue not the will and purpose, decree or intention of God, which are properly his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ dying and drawing sinners to himself, or, A survey of our Saviour in his soul-suffering, his loveliness in his death, and the efficacy thereof</cite>, (London: Andrew Crooke, 1647), pp 415-16.</span></figcaption>

<blockquote><p>He was tempted as Man, but He conquered as God; yea, He bids us be of good cheer, for He has overcome the world. He hungered—but He fed thousands; yea, He is the Bread that giveth life, and That is of heaven. He thirsted—but He cried, If any man thirst, let him come unto Me and drink. Yea, He promised that fountains should flow from them that believe. He was wearied, but He is the Rest of them that are weary and heavy laden. He was heavy with sleep, but He walked lightly over the sea. He rebuked the winds, He made Peter light as he began to sink. He pays tribute, but it is out of a fish; yea, He is the King of those who demanded it.

He is called a Samaritan and a demoniac;—but He saves him that came down from Jerusalem and fell among thieves; the demons acknowledge Him, and He drives out demons and sinks in the sea legions of foul spirits, and sees the Prince of the demons falling like lightning. He is stoned, but is not taken. He prays, but He hears prayer. He weeps, but He causes tears to cease. He asks where Lazarus was laid, for He was Man; but He raises Lazarus, for He was God. He is sold, and very cheap, for it is only for thirty pieces of silver; but He redeems the world, and that at a great price, for the Price was His own blood. As a sheep He is led to the slaughter, but He is the Shepherd of Israel, and now of the whole world also. As a Lamb He is silent, yet He is the Word, and is proclaimed by the Voice of one crying in the wilderness.

He is bruised and wounded, but He healeth every disease and every infirmity. He is lifted up and nailed to the Tree, but by the Tree of Life He restoreth us; yea, He saveth even the Robber crucified with Him; yea, He wrapped the visible world in darkness. He is given vinegar to drink mingled with gall. Who? He who turned the water into wine, who is the destroyer of the bitter taste, who is Sweetness and altogether desire.

He lays down His life, but He has power to take it again; and the veil is rent, for the mysterious doors of Heaven are opened; the rocks are cleft, the dead arise. He dies, but He gives life, and by His death destroys death. He is buried, but He rises again; He goes down into Hell, but He brings up the souls; He ascends to Heaven, and shall come again to judge the quick and the dead, and to put to the test such words as yours. If the one give you a starting point for your error, let the others put an end to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Five Theological Orations</cite>, (379), 3.20 in Nicene and Post-Nicene Fathers 2, 7: 308-09.</span></figcaption>

<blockquote><p>It may be observed, in passing, that there is a double sense in which we may speak of Christ’s purchase; First, Strictly and properly, when we regard Him as purchasing men; and secondly, More improperly, when we consider Him as purchasing benefits for men. This last view [the second], as we have hinted, is rather figurative and metaphorical than real and literal; for the idea of his purchasing benefits from the Father for mankind, must ever be understood in consistency with the Father’s sovereignty, and his pre-existing love to the children of men. The Father is not induced or persuaded to bestow benefits on men by a price paid to Him; but being antecedently full of compassion to all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Completeness &amp; Extent of the Atonement</cite>, (1845), pp. 4-6</span></figcaption>

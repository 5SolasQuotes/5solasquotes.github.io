<blockquote><p>There is a great difference between vocation and justification. Vocation precedes, justification follows. Justification praesupponit aliquid [presupposes something], viz. faith and repentance; Effectual Calling ponit haec, non autem praesupponit [posits this, but does not presuppose it]. (Conference between Cameron and Tilen)</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0317e4973b" data-kw="">
<blockquote><p>2nd Problem: Whether faith precedes regeneration, at least repentance? Response: The former is denied; the latter is affirmed concerning faith in the first act, which in the order of nature precedes repentance considered both in the first act and in the second act. But it is denied concerning faith in the second act, at least the complete or formed second act. For such faith is necessarily preceded in the order of nature and of time by certain acts of repentance. This distinction observed will contribute not a little to reconciling the dogmatic and practical theologians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-5103928f02" data-kw="">
<blockquote><p>…and first of repentance the continual and inseparable companion of faith. For albeit it be daily made more perfect after justification, yet because no man is justified without repentance, and the beginning thereof goes before justification, therefore we have purposed in this first place to declare what our belief is concerning the same. I. To Justification, and therefore to the communion with Christ, repentance is necessary. We believe that to the true participation of Christ’s righteousness, and so to the communion with Christ, repentance is very needful: whereby being turned from sin and from the world, by changing our minds and wills, we are turned to God and are joined unto Him, and so obtain forgiveness of our sins in Him and by Him, and be clothed with his righteousness and holiness. For the first thing that John Baptist, yea that Christ Himself preached, was repentance for the remission of sins. (Mk. 1:4, 15) ‘And, except’ (says Christ) ‘ye repent, ye shall all likewise perish.’ (Lk. 13:3, 5) … V. A sum of the doctrine of repentance, everywhere and always necessary to all of years of discretion. …repentance is a changing of the mind and heart, stirred up in us through the Holy Ghost, by the Word both of the Law and the gospel: wherein we grieve from our heart: we detest: we lament: we lothe and bewail: confess before God all our sins, and even the corruption of our nature, as things utterly repugnant (as the law teaches) to the will of God, and to the cleansing whereof, the death of God’s own Son (as the gospel preaches) was needful: and do humbly pray and entreat for pardon and forgiveness of the same: and do earnestly resolve upon amendment of our life, and on a continual study and care of innocency and Christian virtues, and exercise ourselves in the same diligently all the days of our life: to the glory of God and edification of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of the Christian Religion</cite>, … (1586; Cambridge, 1599), ch. 18. ’Of Repentance’, pp. 142-45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-de6de7e4fa" data-kw="">
<blockquote><p>Repent ye, therefore, and be converted, that your sins may be blotted out.” (Acts 2:38; 3:19) Here, however, it is to be observed, that repentance is not made a condition in such a sense as to be a foundation for meriting pardon; nay, it rather indicates the end at which they must aim if they would obtain favor, God having resolved to take pity on men for the express purpose of leading them to repent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 2, bk. 3, ch. 3, sect. 20, pp. 173-74</span></figcaption>

<blockquote><p>These fancied beings (like the Jove of Homer, who is represented as passing an anxious sleepless night in devising plans for honouring Achilles and destroying numbers of the Greeks) will not appear to you, my dear friend, to be possessed of greater knowledge than He who is the God of the universe.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-567618cbef" data-kw="">
<blockquote><p>1. Bowing of the knee, physically or civilly, is indifferent and is not adoration: for we bow to kings, and artificers may bow the knee to drive a nail in a bed, and yet are not adoring; but religious adoration, whether ye will or not, by nature’s impression, is a religious note of religious submission.

2. I consider four acts of the soul that may convey external adoration:

1. One of the mind, a consideration of the excellency of what we adore;

2. A will to submit to this excellency;

3. The judgments diting this to be honest to submit;

4. A purpose or intention habitual or actual of adoring; many of these may be where there is no adoring: and the religious external bowing of the body is essentially adoring, when that bowing is in a state of worship: kneeling before consecrated elements for reverence of either God or the elements, must be adoration, though we should wash it with foul water and say that there is no intention to tender God’s glory to these elements.

3. Let it be considered what is said by the Jesuit Joannes de Lugo, the Pope’s professor at Rome, which I propound with some change:

1. There is a purpose of external adoring, with an inward submission of the heart; whether this be an habitual or actual intention, it is sure it is an adoration when it comes forth in a gesture of adoring.

2. A will to bow the body in scorn and derision, as the soldiers bowed the knee before Jesus; and this being not in a state of worshipping, but in a state and case of disgracing, is not religious bowing or adoration: This is not a natural expression of inward submission, but rather of disgrace.

3. There is a willed or voluntary religious bowing for fear, for gain, or for glory; yet without any internal estimation of the excellency of the thing adored. This Suarez denies to be worshipping, it being only a feigning of worship, not a worshipping.

4. If religious kneeling require that we intend to worship everything before which, as an object, we do religiously kneel, then religious kneeling should not signify internal submission of the heart by nature’s impression or divine institution, but by the voluntary and the free institution of him that kneels: But this latter is absurd, for if kneeling should signify what it does signify by our free and voluntary appointment, then we might:

1. Put upon natural gestures what signification we pleased, and were not to stand to the signification which God and nature have put upon kneeling.

2. So it were in man’s power to impose upon religious kneeling to God civil courtesy, such as a subject expresses to his prince, or a son to his father; and it were free to us to kneel to a stock, and that religiously, and yet put upon kneeling the negative reverence that we give to the Bible; and it were in the three children’s will to kneel to Nebuchadnezzar’s image, and impose this signification on the gesture, that they were kneeling to God only, all which are manifestly false: so Field says kneeling has institution from the instinct of nature.</p></blockquote>

</figure><figure class="quote" id="q-4ddeaf76d2" data-kw="">
<blockquote><p>It is well known, that in the last century Mr. Rouse’s and Mr. Barton’s versions of the Psalms were much in use and highly esteemed and recommended by many; several other versions were also in use; but the New England and the Scotch were sung by many congregations, much recommended, being preferred by them as the closest versions and most agreeable to the original. For it was then the concurrent judgement of the dissenting churches, that nothing ought to be sung in public worship, but those psalms, hymns, and spiritual songs which God has provided his Church with in his inspired Word. But of late years these versions have been much despised by some, and laid aside by many congregations which formerly used them; because of the roughness of the lines… and other versions, or rather paraphrases on the psalms are made use of by them. Many others use hymns of mere human composure as preferable to the inspired ones. But there are yet many serious Christians, and some churches, that adhere to the sentiments of our godly ancestors in preferring Scripture psalms, hymns and songs to any mere human composures, lest they should incur the guilt of bringing strange fire to God’s altar…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-pike.html">Samuel Pike</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Psalms in Metre. Fitted to the Various Tunes in Common Use</cite>, … (London, 1751), ‘The Preface’, p. iii. Pike (1717?–1773) was an Independent minister in London, known for his work on cases of conscience. He argues for inspired Bible-song singing in the Preface.</span></figcaption>

<blockquote><p>Although we disagree with our author on festival days outside of the Christian Sabbath, there is still much in the below extract that is relevant to keeping the Lord’s Day holy:

Whether thou bestowedst those days wholly in Godly &amp; virtuous exercises as well at home as abroad, namely in reading the scriptures, in distributing alms, in visiting and comforting the sick, in training and instructing with Godly doctrine, thy family and folks: and in such the like commendable duties: Or whether rather thou hast abused, mis-spent and prophaned the same, in banqueting, tippling, gaming, filthy talking, dissolute dealing, &amp;c. …

¶ Teachers, and school-masters. Whether, thou have suffered the younger sort to be absent from the Church, or have discouraged, dissuaded or called them away from reading the Scriptures and books of Godliness, specially on the Sabbath days.

Whether on the same days thou have given them leave to use games, plays, and exercises, for the time and quality, either unmeet or undecent.

Whether thou have dissuaded any from the study of divinity, and from the Ecclesiastical ministry, which were meet and fit thereunto, and would have profitably proceeded therein, hadst not thou by counsel drawn them from their good purpose.

¶ Scrivener or Notary. Whether he have indited, drawn, or written, or caused to be indited, drawn, or written any bills, bonds, or other writings whatsoever, on the Sabbath days.

Whether he have made any such, whereby Religion or the dignity of the Church, might any way be impaired and diminished.

¶ Taverner. Whether on the Sabbath days, and especially in the time of divine service, he have suffered any disorder in drinking and tippling within his house: and whether he hath made a common practise or custom at such times and on such days, to sell his wines, &amp;c.

¶ Merchant. Whether on the Sabbath day he hath bartered &amp; bargained, cast up his reckonings, and written his accounts.

Chapman. Whether on such days &amp; times, he hath set open his shop, or set his wares to sale.

Stage-player. Whether by his Interludes &amp; Stage-plays, he have drawn the people away from spiritual exercises, and godly meditations.

¶ Musician &amp; Minstrel. Whether he have been the author and occasioner, of wanton dancing, or other unseemly pastimes.

¶ Crafts-men of any trade whatsoever. Whether they have wrought on the Sabbath and holy days, when no necessity enforced them, but only for lucre sake: or whether they have caused their apprentices and servants the same days to work, without either going to church or giving themselves to godly meditations: as the Taylor or Butcher to sow a garment: the husbandman to hedge, ditch, plow, garden, cleanse his Stable, &amp;c. whereas at these times these things, and so of others might &amp; ought to be forborne.

Whether any person whosoever he be, have enticed and procured others to any vain games, unlawful sports, or other light and lewd exercises, as dice-playing and such like.

House-holder. Whether as specially on the Sabbaths and festival days, so also sometimes on the work days he have propounded or caused to be propounded and taught to his children and family, the chief heads of Christian religion, namely such as be taught and contained in the Catechism.

Finally, whether any person by committing any of these aforesaid faults, have thereby given occasion to others to commit the like: and whether he have been a stumbling block and cause of fall unto others, either in word or deed.

And again: whether in seeing others to do ill, thou have not let them understand thy great mislike thereof. For, thine assenting to others sins, loadeth thee a new with more sins, and maketh thee a partaker thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-hyperius.html">Andreas Hyperius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true trial and examination of a man’s own self wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise breach at baptism, by ordinary transgression apparentl</cite>, trans. Thomas Newton (London: John Windet, 1587), pp 55, 58-62.</span></figcaption>

Whether on the same days thou have given them leave to use games, plays, and exercises, for the time and quality, either unmeet or undecent.

Whether thou have dissuaded any from the study of divinity, and from the Ecclesiastical ministry, which were meet and fit thereunto, and would have profitably proceeded therein, hadst not thou by counsel drawn them from their good purpose.

¶ Scrivener or Notary. Whether he have indited, drawn, or written, or caused to be indited, drawn, or written any bills, bonds, or other writings whatsoever, on the Sabbath days.

Whether he have made any such, whereby Religion or the dignity of the Church, might any way be impaired and diminished.

¶ Taverner. Whether on the Sabbath days, and especially in the time of divine service, he have suffered any disorder in drinking and tippling within his house: and whether he hath made a common practise or custom at such times and on such days, to sell his wines, &amp;c.

¶ Merchant. Whether on the Sabbath day he hath bartered &amp; bargained, cast up his reckonings, and written his accounts.

Chapman. Whether on such days &amp; times, he hath set open his shop, or set his wares to sale.

Stage-player. Whether by his Interludes &amp; Stage-plays, he have drawn the people away from spiritual exercises, and godly meditations.

¶ Musician &amp; Minstrel. Whether he have been the author and occasioner, of wanton dancing, or other unseemly pastimes.

¶ Crafts-men of any trade whatsoever. Whether they have wrought on the Sabbath and holy days, when no necessity enforced them, but only for lucre sake: or whether they have caused their apprentices and servants the same days to work, without either going to church or giving themselves to godly meditations: as the Taylor or Butcher to sow a garment: the husbandman to hedge, ditch, plow, garden, cleanse his Stable, &amp;c. whereas at these times these things, and so of others might &amp; ought to be forborne.

Whether any person whosoever he be, have enticed and procured others to any vain games, unlawful sports, or other light and lewd exercises, as dice-playing and such like.

House-holder. Whether as specially on the Sabbaths and festival days, so also sometimes on the work days he have propounded or caused to be propounded and taught to his children and family, the chief heads of Christian religion, namely such as be taught and contained in the Catechism.

Finally, whether any person by committing any of these aforesaid faults, have thereby given occasion to others to commit the like: and whether he have been a stumbling block and cause of fall unto others, either in word or deed.

And again: whether in seeing others to do ill, thou have not let them understand thy great mislike thereof. For, thine assenting to others sins, loadeth thee a new with more sins, and maketh thee a partaker thereof.”

— Andreas Hyperius, The true trial and examination of a man’s own self wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise breach at baptism, by ordinary transgression apparentl, trans. Thomas Newton (London: John Windet, 1587), pp 55, 58-62.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+we+disagree+with+our+author+on+festival+days+outside+of+the+Christian+Sabbath%2C+there+is+still+much+in+the+below+extract+that+is+relevant+to+keeping+the+Lord%E2%80%99s+Day+holy%3A%0A%0AWhether+thou+bestowedst+those+days+wholly+in+Godly+%26+virtuous+exercises+as+well+at+home+as+abroad%2C+namely+in+reading+the+scriptures%2C+in+distributing+alms%2C+in+visiting+and+comforting+the+sick%2C+in+training+and+instructing+with+Godly+doctrine%2C+thy+family+and+folks%3A+and+in+such+the+like+commendable+duties%3A+Or+whether+rather+thou+hast+abused%2C+mis-spent+and+prophaned+the+same%2C+in+banqueting%2C+tippling%2C+gaming%2C+filthy+talking%2C+dissolute+dealing%2C+%26c.+%E2%80%A6%0A%0A%C2%B6+Teachers%2C+and+school-masters.+Whether%2C+thou+have+suffered+the+younger+sort+to+be+absent+from+the+Church%2C+or+have+discouraged%2C+dissuaded+or+called+them+away+from+reading+the+Scriptures+and+books+of+Godliness%2C+specially+on+the+Sabbath+days.%0A%0AWhether+on+the+same+days+thou+have+given+them+leave+to+use+games%2C+plays%2C+and+exercises%2C+for+the+time+and+quality%2C+either+unmeet+or+undecent.%0A%0AWhether+thou+have+dissuaded+any+from+the+study+of+divinity%2C+and+from+the+Ecclesiastical+ministry%2C+which+were+meet+and+fit+thereunto%2C+and+would+have+profitably+proceeded+therein%2C+hadst+not+thou+by+counsel+drawn+them+from+their+good+purpose.%0A%0A%C2%B6+Scrivener+or+Notary.+Whether+he+have+indited%2C+drawn%2C+or+written%2C+or+caused+to+be+indited%2C+drawn%2C+or+written+any+bills%2C+bonds%2C+or+other+writings+whatsoever%2C+on+the+Sabbath+days.%0A%0AWhether+he+have+made+any+such%2C+whereby+Religion+or+the+dignity+of+the+Church%2C+might+any+way+be+impaired+and+diminished.%0A%0A%C2%B6+Taverner.+Whether+on+the+Sabbath+days%2C+and+especially+in+the+time+of+divine+service%2C+he+have+suffered+any+disorder+in+drinking+and+tippling+within+his+house%3A+and+whether+he+hath+made+a+common+practise+or+custom+at+such+times+and+on+such+days%2C+to+sell+his+wines%2C+%26c.%0A%0A%C2%B6+Merchant.+Whether+on+the+Sabbath+day+he+hath+bartered+%26+bargained%2C+cast+up+his+reckonings%2C+and+written+his+accounts.%0A%0AChapman.+Whether+on+such+days+%26+times%2C+he+hath+set+open+his+shop%2C+or+set+his+wares+to+sale.%0A%0AStage-player.+Whether+by+his+Interludes+%26+Stage-plays%2C+he+have+drawn+the+people+away+from+spiritual+exercises%2C+and+godly+meditations.%0A%0A%C2%B6+Musician+%26+Minstrel.+Whether+he+have+been+the+author+and+occasioner%2C+of+wanton+dancing%2C+or+other+unseemly+pastimes.%0A%0A%C2%B6+Crafts-men+of+any+trade+whatsoever.+Whether+they+have+wrought+on+the+Sabbath+and+holy+days%2C+when+no+necessity+enforced+them%2C+but+only+for+lucre+sake%3A+or+whether+they+have+caused+their+apprentices+and+servants+the+same+days+to+work%2C+without+either+going+to+church+or+giving+themselves+to+godly+meditations%3A+as+the+Taylor+or+Butcher+to+sow+a+garment%3A+the+husbandman+to+hedge%2C+ditch%2C+plow%2C+garden%2C+cleanse+his+Stable%2C+%26c.+whereas+at+these+times+these+things%2C+and+so+of+others+might+%26+ought+to+be+forborne.%0A%0AWhether+any+person+whosoever+he+be%2C+have+enticed+and+procured+others+to+any+vain+games%2C+unlawful+sports%2C+or+other+light+and+lewd+exercises%2C+as+dice-playing+and+such+like.%0A%0AHouse-holder.+Whether+as+specially+on+the+Sabbaths+and+festival+days%2C+so+also+sometimes+on+the+work+days+he+have+propounded+or+caused+to+be+propounded+and+taught+to+his+children+and+family%2C+the+chief+heads+of+Christian+religion%2C+namely+such+as+be+taught+and+contained+in+the+Catechism.%0A%0AFinally%2C+whether+any+person+by+committing+any+of+these+aforesaid+faults%2C+have+thereby+given+occasion+to+others+to+commit+the+like%3A+and+whether+he+have+been+a+stumbling+block+and+cause+of+fall+unto+others%2C+either+in+word+or+deed.%0A%0AAnd+again%3A+whether+in+seeing+others+to+do+ill%2C+thou+have+not+let+them+understand+thy+great+mislike+thereof.+For%2C+thine+assenting+to+others+sins%2C+loadeth+thee+a+new+with+more+sins%2C+and+maketh+thee+a+partaker+thereof.%E2%80%9D%0A%0A%E2%80%94+Andreas+Hyperius%2C+The+true+trial+and+examination+of+a+man%E2%80%99s+own+self+wherein+every+faithful+Christian%2C+by+looking+into+his+conscience%2C+may+most+plainly+behold+his+spiritual+deformity+by+nature%2C+described%2C+his+actual+rebellion+by+disobedience+detected%2C+his+promise+breach+at+baptism%2C+by+ordinary+transgression+apparentl%2C+trans.+Thomas+Newton+%28London%3A+John+Windet%2C+1587%29%2C+pp+55%2C+58-62.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc72e1d9c25.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c72e1d9c25.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/02/20/andreas-hyperius-on-the-sins-of-various-orders-against-the-sabbath-day/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-501c80bd1e" data-kw="">
<blockquote><p>Paybody thinks kneeling in the act of receiving the Communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it, but I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with feare and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>

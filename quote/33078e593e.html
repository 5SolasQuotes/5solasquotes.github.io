<blockquote><p>5th Distinction: The substance and essence of ordination (as we shall after hear) consists in the appointing of such for the holy ministery by persons in office. All the corrupt rites added to this by Papists take not away the essence and nature of ordination… See that variations may be in a sacrament, and yet such as make not the sacrament invalid, in Sotus, Suarez (in 3rd part, disp. 2, sect 5), Vasquez, Joannes de Lugo, Scotus.</p></blockquote>

<blockquote><p>In light of all of these problems with Van Til’s thought, it is clear that when twentieth-century Reformed Christians followed Van Til and adopted his presuppositionalism in place of the traditional apologetics and theology of the sixteenth- and seventeenth-century Reformed scholastic theologians, they let go of an invaluable and precious birthright. What replaced that birthright has been uniquely detrimental to the contemporary Reformed church… If we would take the time to go back and carefully reread the Reformed scholastics, we would discover that it is they, and not Van Til, who provide us with an approach to theology and a foundation for apologetical work that is biblical, clear, precise, and internally self-consistent.</p></blockquote>

</figure><figure class="quote" id="q-79f7667f22" data-kw="">
<blockquote><p>Is there any other way the end or goal might exist already [as it must]? There would seem to be only four possibilities: It might exist in the natural object itself; it might exist in a Platonic “third realm”; it might exist in some human intellect, or in another intellect within the natural world; or it might exist in an intellect outside the natural world altogether. But it obviously doesn’t exist in the natural object itself; if the form of an oak were already in the acorn itself, it would be an oak, and it’s not. It cannot exist in a Platonic “third realm” either, at least not if one endorses (as the Scholastic teleological realist does) the Aristotelian realist critique of Platonic realism about universals. Nor can it exist in some human or other intellect within the natural order, at least not without a vicious regress. Humans obviously are not the ones directing acorns and other natural objects (including human beings themselves) to their natural ends… The only possibility remaining, then, is the last one: Final causation in the natural world is intelligible because there is an intelligence altogether outside the natural order that directs natural objects to their ends. To the “How can something non-existent be a cause?” objection to final causation, then, the Thomist’s reply is to say “It can’t. That’s why the final cause of a natural object must exist already as an idea or form in an intellect existing altogether outside the natural order.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49</cite>, pp. 46-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>If there is Anything, the Uncausable is Susbtance [see pp. 56-68 of the Summary] . 48. If something accidental exists, something substantial exists. Proof: An accident depends essentially on its substrate. This dependence is of the same order as that which is found between formal cause and material cause. For substance is as it were the matter of accidents. Hence for any accident that actually exists there is required the simultaneous existence of another being, namely that in which the accident is. If this other is not something substantial but on the contrary an accident, then some third being is required. But there cannot be a regress to infinity, both because there would be at the same time an infinite number and because dependence in any essential order ends in some independent being in the same order. Hence every effect demands an ultimate being that is not an effect; a thing in matter requires eventually a being not in matter, namely prime matter. Likewise a being in another or to which existing in another belongs, involves a being not in another, or to which existing in itself belongs. If you object that some accident, namely quantity, can exist in itself, that is, supernaturally, the objection is not valid; for even in this case God, as first efficient cause, would be making up for the natural, material, secondary causality of the substance. And so, even on this supposition, at least one substance would exist, namely God himself. 49. If there is anything, substance exists. If there is anything, it is either accident or substance. But if it is accident, substance too exists (from conclusion 48). Therefore in either case, if there is anything, there is substance. 50. Being is divided into substance and accident. The existence of accidents must be proved from experience. And on this point one must note that, on the evidence of experience, many things exist that are not only beings but beings in another, as color, shape etc. It does not matter whether these are formally objective or subjective, for in either case they are real modifications of something. One must say the same about our internal acts, as thoughts, affections, volitions; for we experience these beings as empirical modifications of the ‘ego’. — From the fact of actual accident follows the fact of actual substance (from conclusion 48). Thus both accident and substance exist; therefore being is divided into substance and accident. About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such. 51. If something is altogether independent, it must be substance and not accident. Hence the uncausable, for instance, is substance. This conclusion is sufficiently clear from what was said above in proof of conclusion 48. … Proof of God … 11. God’s knowledge is really the same as the divine essence. Plain both from the physical simplicity of God and from the infinite perfection of the divine essence, which is perfectible neither accidentally nor substantially (conclusion 2). [A difference between the divine essence and its knowledge would be a difference between substance and accident.] … 15… Corollary: On a Personal God We show, against those who conceive God to be an impersonal cosmic force, that God is a rational being and hence personal. For a personal God is here understood as a rational supposit, that is, a singular substance simply complete, in its own right, and endowed with reason. God’s simply complete substantiality and singularity, and being in his own right, follow from our principal argument. In the present chapter God’s rationality is proved. Hence everything requisite for a personal being is verified of God. … 29. Every being is good, or being and good convert. … Further, creatures are also good for other creatures; for example, substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’ (1958), ‘Conclusions respecting Reality’</cite></span></figcaption>

ine essence, which is perfectible neither accidentally nor substantially (conclusion 2). [A difference between the divine essence and its knowledge would be a difference between substance and accident.] … 15… Corollary: On a Personal God We show, against those who conceive God to be an impersonal cosmic force, that God is a rational being and hence personal. For a personal God is here understood as a rational supposit, that is, a singular substance simply complete, in its own right, and endowed with reason. God’s simply complete substantiality and singularity, and being in his own right, follow from our principal argument. In the present chapter God’s rationality is proved. Hence everything requisite for a personal being is verified of God. … 29. Every being is good, or being and good convert. … Further, creatures are also good for other creatures; for example, substance upholds accidents, accidents give further perfection to substance, etc.”

— Allan B. Wolter, ‘Allan Wolter’s Conclusions respecting Reality, Proving God’ (1958), ‘Conclusions respecting Reality’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+there+is+Anything%2C+the+Uncausable+is+Susbtance+%5Bsee+pp.+56-68+of+the+Summary%5D+.+48.+If+something+accidental+exists%2C+something+substantial+exists.+Proof%3A+An+accident+depends+essentially+on+its+substrate.+This+dependence+is+of+the+same+order+as+that+which+is+found+between+formal+cause+and+material+cause.+For+substance+is+as+it+were+the+matter+of+accidents.+Hence+for+any+accident+that+actually+exists+there+is+required+the+simultaneous+existence+of+another+being%2C+namely+that+in+which+the+accident+is.+If+this+other+is+not+something+substantial+but+on+the+contrary+an+accident%2C+then+some+third+being+is+required.+But+there+cannot+be+a+regress+to+infinity%2C+both+because+there+would+be+at+the+same+time+an+infinite+number+and+because+dependence+in+any+essential+order+ends+in+some+independent+being+in+the+same+order.+Hence+every+effect+demands+an+ultimate+being+that+is+not+an+effect%3B+a+thing+in+matter+requires+eventually+a+being+not+in+matter%2C+namely+prime+matter.+Likewise+a+being+in+another+or+to+which+existing+in+another+belongs%2C+involves+a+being+not+in+another%2C+or+to+which+existing+in+itself+belongs.+If+you+object+that+some+accident%2C+namely+quantity%2C+can+exist+in+itself%2C+that+is%2C+supernaturally%2C+the+objection+is+not+valid%3B+for+even+in+this+case+God%2C+as+first+efficient+cause%2C+would+be+making+up+for+the+natural%2C+material%2C+secondary+causality+of+the+substance.+And+so%2C+even+on+this+supposition%2C+at+least+one+substance+would+exist%2C+namely+God+himself.+49.+If+there+is+anything%2C+substance+exists.+If+there+is+anything%2C+it+is+either+accident+or+substance.+But+if+it+is+accident%2C+substance+too+exists+%28from+conclusion+48%29.+Therefore+in+either+case%2C+if+there+is+anything%2C+there+is+substance.+50.+Being+is+divided+into+substance+and+accident.+The+existence+of+accidents+must+be+proved+from+experience.+And+on+this+point+one+must+note+that%2C+on+the+evidence+of+experience%2C+many+things+exist+that+are+not+only+beings+but+beings+in+another%2C+as+color%2C+shape+etc.+It+does+not+matter+whether+these+are+formally+objective+or+subjective%2C+for+in+either+case+they+are+real+modifications+of+something.+One+must+say+the+same+about+our+internal+acts%2C+as+thoughts%2C+affections%2C+volitions%3B+for+we+experience+these+beings+as+empirical+modifications+of+the+%E2%80%98ego%E2%80%99.+%E2%80%94+From+the+fact+of+actual+accident+follows+the+fact+of+actual+substance+%28from+conclusion+48%29.+Thus+both+accident+and+substance+exist%3B+therefore+being+is+divided+into+substance+and+accident.+About+knowledge+of+the+formal+idea+of+accident+one+must+note+that+%E2%80%98in+another%E2%80%99+or+%E2%80%98in-anotherness%E2%80%99+is+correlative%2C+for+it+involves+something+in+which+it+is.+But+to+perceive+some+relation%2C+there+is+need+of+knowledge+of+the+terms+of+the+relation+in+themselves.+Our+first+knowledge+of+reality%2C+therefore%2C+seems+to+be+knowledge+of+things+as+absolute+objects+and+not+in+their+relation+to+other+beings.+But+when+we+say+that+accidents+are+immediately+experienced+as+beings+in+another+the+sense+is%3A+this+knowledge+is+not+by+way+of+reasoning+out+but%2C+from+phenomenological+analysis+of+the+givens+of+experience%2C+we+perceive+through+simple+apprehension+this+relation+of+%E2%80%98in-anotherness%E2%80%99.+Shape%2C+for+instance%2C+is+not+only+perceived+in+itself+and+as+something+absolute+but+also+in+its+relation+to+extension+and+color%2C+namely+as+the+limit+of+a+colored+expanse.+But+in+other+cases+it+seems+we+do+not+immediately+perceive+the+idea+of+%E2%80%98in-anotherness%E2%80%99%2C+but+rather+we+infer+it+by+reasoning+out.+This+happens%2C+for+example%2C+with+quantity.+No+wonder+then+that+some%2C+as+Descartes%2C+identified+extension+with+material+substance+as+such.+51.+If+something+is+altogether+independent%2C+it+must+be+substance+and+not+accident.+Hence+the+uncausable%2C+for+instance%2C+is+substance.+This+conclusion+is+sufficiently+clear+from+what+was+said+above+in+proof+of+conclusion+48.+%E2%80%A6+Proof+of+God+%E2%80%A6+11.+God%E2%80%99s+knowledge+is+really+the+same+as+the+divine+essence.+Plain+both+from+the+physical+simplicity+of+God+and+from+the+infinite+perfection+of+the+divine+essence%2C+which+is+perfectible+neither+accidentally+nor+substantially+%28conclusion+2%29.+%5BA+difference+between+the+divine+essence+and+its+knowledge+would+be+a+difference+between+substance+and+accident.%5D+%E2%80%A6+15%E2%80%A6+Corollary%3A+On+a+Personal+God+We+show%2C+against+those+who+conceive+God+to+be+an+impersonal+cosmic+force%2C+that+God+is+a+rational+being+and+hence+personal.+For+a+personal+God+is+here+understood+as+a+rational+supposit%2C+that+is%2C+a+singular+substance+simply+complete%2C+in+its+own+right%2C+and+endowed+with+reason.+God%E2%80%99s+simply+complete+substantiality+and+singularity%2C+and+being+in+his+own+right%2C+follow+from+our+principal+argument.+In+the+present+chapter+God%E2%80%99s+rationality+is+proved.+Hence+everything+requisite+for+a+personal+being+is+verified+of+God.+%E2%80%A6+29.+Every+being+is+good%2C+or+being+and+good+convert.+%E2%80%A6+Further%2C+creatures+are+also+good+for+other+creatures%3B+for+example%2C+substance+upholds+accidents%2C+accidents+give+further+perfection+to+substance%2C+etc.%E2%80%9D%0A%0A%E2%80%94+Allan+B.+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7565f8e859.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7565f8e859.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=If%20there%20is%20Anything%2C%20the%20Uncausable,give%20further%20perfection%20to%20substance

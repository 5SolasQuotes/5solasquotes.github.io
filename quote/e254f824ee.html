<blockquote><p>3. In the moral providence of God, is there a place for an ineffective wish? XIII. It is asked, third, whether in the moral providence of God, there is a place for some ineffective wish or desire of God. The Pelagians and Pelagianizers—Socinians, Jesuits, Arminians, and others—because they argue for a self-determined free choice that God cannot determine, and because likewise they argue for a conditioned antecedent will in God, by which God wills if a person wills, and likewise by which he wills that each and every person be saved, if only they will it, say that there is in God a wish properly so-called, by which God desires that this or that duty be done by man, but he desires it in vain. The Reformed acknowledge no sort of wish and desire in God, except that which coincides with his commandment, different from it in this alone, that whereas a commandment urges a duty only by the authority of the lawgiver, a wish urges it by a motive drawn from a certain eminent advantage which is certainly set to fall from that duty upon him who obeys. We examined the reasons on both sides in book 2, chapter 15, §XXXII.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (RHB)</cite>, vol. 3, bk. 3, ch. 11, section 13</span></figcaption>

<blockquote><p>The 14th Chapter of Ecclesiastical doctrine is of the Lord’s keys, of which he says to Peter, I will give thee the Keys of the Kingdom of Heaven, and these keys are the peculiar function or Ministry and administration of Christ his power, and his holy Spirit; which power is committed to the Church of Christ, and to the Ministers thereof, unto the end of the world: that they should not only by preaching publish the holy Gospel, although they should do this especially, that is, should shew forth that Word of true comfort, and the joyful message of peace, and new tidings of that favor which God offers, but also that to the believing and unbelieving, they should publicly or privately denounce and make known, to wit, to them His favor, to these his wrath, and that to all in general, or to everyone in particular, that they may wisely receive some into the house of God, to the communion of Saints, and drive some out from thence, and may so through the performance of their Ministry, hold in their hand the Scepter of Christ his Kingdom, and use the same to the government of Christ his Sheep.</p></blockquote>

<blockquote><p>Strictly speaking, therefore, God does not love irrational creatures with the love of friendship; but as it were with the love of desire, in so far as He orders them to rational creatures, and even to Himself. Yet this is not because He stands in need of them; but only on account of His goodness, and of the services they render to us. For we can desire a thing for others as well as for ourselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa | pt. 1 | quest. 20, art. 2, Whether God loves all things? reply to obj. 3</cite></span></figcaption>

<blockquote><p>XXVIII. From these things, however, it is now sufficiently clear that that vindicatory justice is not a free and arbitrary act that depends solely upon the will of God, but an essential property to the exercise of which the will, once sin is posited, is necessarily impelled. And indeed, if it befits the nature of God that He does not suffer him who repents of sin to perish, because He is good and clement, it will no less befit Him that He does not allow sin to go unpunished, because He is just; for as the former arises from a certain natural ῥοπῇ [inclination] and propensity of goodness and mercy toward repentance, so the latter also flows from a certain natural hatred and detestation of sin. Indeed, if we consider the matter accurately, the latter seems to be somewhat more fitting. For when He pardons sin, He does so out of a certain abundance of goodness, but He is bound by no right, by no law, to perform this; therefore, in that, He follows only the lead of his nature, while the creature has no merit. But in administering justice, besides that ῥοπῇ [inclination] of nature by which He inclines toward the hatred of sin, He also has regard for the order of which He is the guardian and avenger, and whose law, once enacted, He can by no means abrogate. Regarding the former, He sees no quality in the subject by which He could be moved to benefit it, or if He sees any, He sees one contrary to his holiness, and of such a kind that He could justly refrain from every benefit; but with respect to the latter, the subject, He sees it clothed in that quality which incites justice to exercise and propels it by a certain inevitable necessity, whence the act of mercy is plainly arbitrary if you abstract it from the decree, because it has no foundation in the subject concerning which it is exercised, whereas the act of justice is necessary, because it depends not only on the will, but on the very nature of God who punishes and the thing to be punished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on the Satisfaction of Christ… (Geneva, 1666), Disputation 1, sect. 28 tr. AI at The Received Faith</cite></span></figcaption>

</figure><figure class="quote" id="q-a2a62bb899" data-kw="">
<blockquote><p>Mastricht offers as a brief definition the statement that the divine will is God’s ‘propensity toward the good,’ (Theoretico-practica theol., II.xvii.4) and the somewhat longer definition that ‘will in God is nothing other than his most wise propensity toward himself as the highest goal and toward creatures as means, for the sake of himself,’ inasmuch as creatures attain the fulfilment of the good not in themselves but in God.’ (Theoretico-practica theol., II.xv.7; cf. Cocceius, Summa theol. III.x.23-24 and Van Asselt, Federal Theology, p. 166.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, p. 445</span></figcaption>

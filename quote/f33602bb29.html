<main class="wrap"><figure class="quote" id="q-f33602bb29" data-kw="">
<blockquote><p>His being is in Himself and He does not derive what He is from anywhere else, but possesses what He is from Himself and in Himself. He is infinite because He Himself is not in anything and all things are within Him; He is always outside of space because He is not restricted; He is always before time because time comes from Him. Stir up your understanding if you believe that anything is the ultimate limit for Him. You will always find Him, because, while you are always seeking after it, there is always some object present after which you can seek. Thus, it is always characteristic of you to seek after His place as it is for Him to be without any limits. Language will weary itself in speaking about Him, but He will not be encompassed. Again, reflect upon the periods of time; you will find that He always is, and, when the numerals in your statement have finally come to an end, the eternal being of God does not come to an end.

Arouse your understanding and seek to comprehend the totality of God in your mind; you hold on to nothing. This totality of God has always something over and above your power of comprehension, but this something over and above always belongs to the totality of God. Therefore, neither this totality, which lacks something over and above, nor this something, that is over and above, includes everything that the totality of God does. What is over and above your power of comprehension is only a part, but everything means the totality of God. But, God is also present everywhere and is present in His entirety wherever He is. Thus, He transcends the realm of understanding, outside of whom nothing exists and of whom eternal being is always characteristic. This is the true nature of the mystery of God; this is the name of the impenetrable nature in the Father.

God is invisible, ineffable, infinite. In speaking of Him, even speech is silent; the mind becomes weary in trying to fathom Him; the understanding is limited in comprehending Him. He possesses, indeed, as we have said, the name of His nature in the Father, but He is only the Father. He does not receive His Fatherhood in a human way from anywhere else. He Himself is unborn, eternal, and always possesses in Himself what He is. He is known to the Son alone, because no one knows the Father except the Son and he to whom the Son wills to reveal it, nor does anyone know the Son except the Father. Between them there is a mutual knowledge and again between them there is perfect cognition. And, because no one knows the Father except the Son, let us keep before our mind the Father together with the Son who reveals Him and who alone is a reliable witness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Trinity</cite>, (c. 356-60), trans. Stephen McKenna, The Fathers of the Church: A New Translation, vol. 25 (Washington D.C.: The Catholic University of America Press, 1954), 2.6, pp 39-41.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7a17240b97" data-kw="">
<blockquote><p>For it is of the nature of the finite that there is absolutely no proportion between it and the infinite, neither is the former able to be equal to the latter. And so, while on the one hand the perfections cognizable in God are infinite in every way, but on the other hand the cognizing ability in every creature is finite; certainly those perfections will leave behind them by the greatest distance whatever cogitations of the creature, neither will they be understood fully and perfectly even by the comprehension of all creatures together. To such an extent God is truly Incomprehensible to every created mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 10, pp 99-100.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-fd58fe35ac" data-kw="">
<blockquote><p>What are you heretics saying? His judgments are inscrutable, his ways are unsearchable, his peace surpasses all understanding, his gift is indescribable, what God has prepared for those who love him has not entered into the heart of man, his greatness has no bound, his understanding is infinite. Are all these incomprehensible while only God himself can be comprehended? What excessive madness would it be to say that?

Stop the heretic; do not let him get away. Tell me. What does Paul say? “Our knowledge is imperfect.” The heretic answers that Paul is not talking about God’s essence but about his governance of the universe. Very good, then. If he is talking about the governance of the universe, our victory is all the more complete. For if his governance of the universe is incomprehensible, then all the more so is God himself beyond our powers of comprehension. …

Did you see how great is the holy dread in heaven and how great the arrogant presumption here below? The angels in heaven give him glory; these heretics on earth carry on meddlesome investigations. In heaven they honour and praise him; on earth we find curious busybodies. In heaven they veil their eyes; on earth the busybodies are obstinate and shamelessly try to hold their eyes fixed on his ineffable glory. Who would not groan, who would not weep for them because of this ultimate madness and folly of theirs?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Incomprehensible Nature of God</cite>, (c. 386-98), trans. Paul W. Harkins, The Fathers of the Church: A New Translation, Volume 72 (Washington D.C.: Catholic University Press, 1982), 1.30-31, 36, pp 64, 66.</span></figcaption>

</figure><figure class="quote" id="q-6a395b140e" data-kw="">
<blockquote><p>Holiness is God conformable to Himself, 1 Sam. 2:2; Hab. 1:13. As created holiness (which some call moral goodness or perfection of manners) is the conformity of the reasonable creature to the rule, so (God being his own rule and the fountain of all created perfection) we may conceive of increated holiness as of God’s conformity unto Himself. God is holy essentially, and so is none but He, 1 Sam. 2. There is none holy as the Lord; the creature is holy only by participation. He is the Author of all created holiness, both of the Moral Law, which is the rule of holiness, and of the infused grace of holiness, whence the reasonable creature is made conformable to that rule, and of all other holiness whatsoever: therefore [He is] justly called, ‘the Holy One of Israel,’ Isa. 41:20.</p></blockquote>

<blockquote><p>2. [Hebrew] ‘Holy’: God’s holiness is the same with his universal justice, or righteousness. And as in other things, so much more in God (by Whom all other things are sanctified or made holy) it imports a separation, as of that which is pure and excellent from that which is either unclean and vile, or at the best common and vulgar. Hence God’s holiness and his glory are near akin; and hallowing God’s name is all one with glorifying it, Eze. 36:20 etc. &amp; 38:23 &amp; 28:22; Lev. 10:3; Isa. 6:3 &amp; Ex. 29:43, “it shall be sanctified by my glory.</p></blockquote>

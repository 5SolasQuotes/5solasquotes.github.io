<main class="wrap"><figure class="quote" id="q-f4ce369237" data-kw="">
<blockquote><p>But when, in this corrupt disordered State of Things, where the Lusts of Men are perpetually embroiling the World with Wars and Fightings, and throwing all into Confusion; when Ambition and Avarice would rob us of our Property, for which we have toiled, and on which we subsist; when they would enslave the free-born Mind, and compel us meanly to cringe to Usurpation and Arbitrary Power; when they would tear from our eager Grasp the most valuable Blessing of Heaven, I mean our RELIGION: when they invade our Country, formerly the Region of Tranquillity, ravage our Frontiers, butcher our Fellow-Subjects, or confine them in a barbarous Captivity in the Dens of Savages; when our earthly All is ready to be seized by rapacious Hands, and even our Eternal All is in Danger by the Loss of our Religion: when this is the Case, what is then the Will of God?

Must Peace then be maintained? maintained with our perfidious and cruel Invaders? maintained at the Expense of Property, Liberty, Life, and every Thing dear and valuable? maintained, when it is in our Power to vindicate our Right, and do ourselves Justice? Is the Work of Peace then our only Business? No; in such a Time even the God of Peace proclaims by his Providence, “To ARMS!” Then the Sword is, as it were, consecrated to God; and the Art of WAR becomes a Part of our Religion. Then happy is he that shall reward our Enemies, as they have served us. Blessed is the brave Soldier: blessed is the Defender of his Country, and the Destroyer of its Enemies. Blessed are they who offer themselves willingly in this Service, and who faithfully discharge it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-davies.html">Samuel Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The curse of cowardice. A sermon preached to the militia of Hanover County, in Virginia, at a general muster, May 8, 1758. With a view to raise a company for Captain Samuel Meredith</cite>, (Boston: Z. Fowle and S. Draper, 1759), pp 3-4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-b17f48408f" data-kw="">
<blockquote><p>For if there were no God, no republic, no society in the world would be safe. Without virtue, without religion, nothing can be safe. If there were no God, there would be neither virtue nor religion. What would the world be but a mere den of robbers in which license would be each one’s law, no such thing as right or wrong, no right of government, no necessity of obedience – the most abandoned, the superior and the most powerful, the master? No check would be placed upon the oppression of rulers and the rebellion of subjects. Each one would follow the bent of his own inclination. Again, if there were no God, no mortals would even for a moment be safe or secure from violence, fraud, perjury, slaughter of blood. Every hour everything would have to be feared. Take away the barriers of divinity and what would become of the confidence and innocence? What licence or violence would not be witnessed? As to human edicts (besides the fact that they cannot change the mind for the better, but on the contrary make it artful and intent upon all the arts of deception), what place would there be for human laws, if (the sense of deity being removed) the conscience would shake off all relations of justice and injustice?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of elenctic theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Philipsburgh, 1992), i, 176.</span></figcaption>

r" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ab5379b85f" data-kw="">
<blockquote><p>Thus far, then, is the liberty given by Christ unto his church preserved entire; and the request seems not immodest that is made for the continuance of it. When men cry to God for the liberty in his worship which was left unto them by Christ and his apostles, he will undoubtedly hear, though their fellow-servants should be deaf to the like requests made unto them; and truly they must have a great confidence in their own wisdom and sufficiency, who will undertake to appoint, and impose on others, the observation of things in the worship of God which neither our Lord Jesus nor his apostles did appoint or impose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 15 (Edinburgh: T&amp;T Clark, n.d.), 17.</span></figcaption>

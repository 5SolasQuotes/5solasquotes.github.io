<main class="wrap"><figure class="quote" id="q-26d8fcf1c6" data-kw="">
<blockquote><p>The Objections against all this that hitherto hath been said, are of no value. God (say some) would have all men saved, 1. Tim. 2. 4. and none to perish, but all to come to Repentance, 2. Pet. 3. 9. And Christ is a Propitiation for the sins of the whole World, 1. John 2. 2. But they understand not that those general speeches are to be restrained to the subject there in hand: for the Apostle sheweth in the first of those places, that howsoever that be true, which else-where he teacheth, that not many noble, not many mighty ones, not many of account are called to the profession of the Gospel: yet there is no estate so high, or great, nor any estate or sort of men at all, but God hath his among them; for whom we are to pray, that in his good time he would vouchsafe to bring them to the knowledge of the Truth.

And so is this particle all in sundry places applied to every sort and kind, and namely, Mat. 4. 23. where our Saviour Christ is said to have healed all diseases, that is, all kind of diseases. That of Peter is plainly meant of the Elect alone. And John sheweth, that our Saviour died, not for the Nation of the Jews, or those that lived in his time only, but for all the Elect of Jews and Gentiles out of every Kindred, Tongue, Nation and People, as it is said, Reuel. 5. 9. and of all ages from the beginning of the World. And so is this place notably expounded, John 11. 51, 52. that Jesus was to dye for that Nation, and not for that Nation only, but that he might gather into one the Children of God dispersed. According whereunto you must take the name of World, John 1. 29. The Lamb of God, that taketh away the sin of the World. And John 4. 42. This is of a truth that Christ the Saviour of the World; and in other such like places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-downame.html">John Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Sacred Divinity Briefly &amp; Methodically Propounded: More Largely &amp; Clearly Handled and Explained</cite>, (London: William Stansby, [1625]), 2.1, pp 304-05.</span></figcaption>

</figure><figure class="quote" id="q-656fe32bd6" data-kw="">
<blockquote><p>Concerning the story and benefit of our Lord’s resurrection… directing our course as it were by the loadstar of scripture we pronounce by virtue and authority thereof that so precious and inestimable a benefit belongs unto all the faithful, and to them alone; and we exclude the wicked and unbelievers, as long as they remain such, from having any interest therein… The answer hereunto is twofold, either of which is true and sound. First, as often as the Gospel extends the fruit of Christ’s merits and benefits unto all, it must be understood (as says Saint Ambrose) of the whole number of the faithful and elect. For this is the usual and common voice found everywhere throughout the whole course of the gospel… Howbeit there is another answer no less true, wherewith we may satisfy the most contentious wranglers; that Christ died for all men absolutely and without exception to wit, if you respect the sufficiency of the merit, and the price which He paid. It is out of all doubt and controversy that the death of the Son of God is of such weight and worth that it may serve to purge and cleanse the sins not of one world only, but thousands of worlds; if at least all men would apprehend by faith this salve of sin. But the question concerns the efficacy and participation itself of the fruits which we mainly deny to be common to the believing, and unbelieving, or to be generally promised or given in the〈…〉; and we hold it no sound doctrine to 〈…〉 in this respect Christ died alike for all ???? and reprobate… For what slander is there, if this be none. When we distinguish the worth of the merue from the efficacy and participating of the benefits, and restrain according to Scripture and the judgement of the soundest Fathers this participation to the whole number of the faithful alone gathered from amongst the Jews and Gentiles; do we then deny that Christ died for all?… They [opponents] run on still, and say He died for all and every of these not only in respect of the sufficiency of his sacrifice and satisfaction, but also in regard of the efficacy of the same. What means this new device I pray? That forsooth Christ by his death and bloodshedding has truly and effectually delivered from death, purged from sin, sanctified, reconciled unto God, and restored unto his grace and favor by his death and bloodshedding all and every single man, yea even those who are not saved, but have been ever since Caine, etc. are at this day, and shall be hereafter damned… they neither perished, nay perish, nor shall perish, for their sins (whereas they are washed away by the blood of Christ Jesus) but for unbelief alone.</p></blockquote>

<blockquote><p>31. But the sense of these places [1 Jn. 2 and 2 Pet. 2] is that Christ gave Himself (which we easily acknowledge) as a sufficient price for the whole world and for the false teachers themselves. Even so, those alone are effectually redeemed who acknowledge this grace; not those who delight themselves in their own captivity, and are rejecters of Christ, such as are the reprobate.

32. We have already warned above about those universal passages that they ought to be, in certain places, restricted to all the elect, whom the Lord has [as his own], not only in Judea but also in all parts of the world, in which sense it may also be said that “the blood of Christ is a propitiation for the whole world”—although this text we freely acknowledge to be about sufficiency. … 37. However, it is incredible shamelessness of those critics which drives them to write that our church doctrine about the death of Christ, and its efficacy being limited to the elect and believers alone, leads people to despair, because one cannot deduce anything certain from mere particular propositions. …

9. We accordingly conclude with the Scriptures that all the elect or believers in Christ are saved by Christ…

10. But as one error begets another, our adversaries claiming that God equally loves all and that Christ died effectually for all, although they nominally admit there to be a certain number of the elect, nevertheless they undermine the whole force of divine election, and instead they move into the military camp of the Pelagians, who make foreseen faith and [foreseen] unbelief the cause of salvation and death, of election and reprobation.</p></blockquote>

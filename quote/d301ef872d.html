<main class="wrap"><figure class="quote" id="q-d301ef872d" data-kw="">
<blockquote><p>if he had not lost the first faith, he would not have lacked all other good things” (Prosper ad excerpt. Genuens.). But this is not now being discussed, that we should inquire in what thing the first parents sinned most. But that you say no one is born proud or gluttonous, surely the seeds of these vices are in us from nature; nor is there any sin to which we are not too much inclined, unless we are prohibited by discipline or grace. But if we are born sinners, with the stain of what sin, in the end, are we infected, if not of pride, and of gluttony, and of infidelity, and finally of all wickedness?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … against the three first books of Thomas Stapleton on the Whole Doctrine of Justification presently controverted (d. 1595; Legat, 1600), bk. 1, ch. 1 trans. AI Latin | The root therefore and fount of all evils was infidelity; as on the contrary, the beginning and mother of all good things is faith. Thus Prosper:, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

y%20of%20all%20wickedness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-69092f7def" data-kw="">
<blockquote><p>Man is a personal body created in God’s image. The Bible makes quite clear that man’s hope is in resurrection of the body, not release from the body (John 2:19-22; Lk. 24:40; Rom. 8:23; 1 Cor; 15:3-4, 44, 48-49; 2 Cor. 5:1-5; Isa. 26:19; 66:22-23; Dan. 12:2). Moreover, it is embodied existence which is the criterion of future judgment (2 Cor. 5:10; Heb. 9:27). We may not know all the answers with respect to the intermediate state…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/greg-bahnsen.html">Greg Bahnsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Mind / Body Problem in Biblical Perspective’</cite>, (Covenant Media Foundation, 1972) 10 pp. | Yet Bahnsen is seriously weak on death and the intermediate state (if his view can even adequately explain these things, which it is not clear it can):</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-1a742dd648" data-kw="">
<blockquote><p>his [Descartes’] warning… that the main questions about God and the soul’s distinction from the body are among those that should be demonstrated by philosophy rather than theology (Descartes, Meditations on First Philosophy in The Philosophical Writings of Descartes, vol. 2, tr. John Cottingham, et al., Cambridge Univ. Press, 1984, p. 3)… In the branch of philosophy called first philosophy or metaphysics, he accomplished little, only explaining and defending two questions about God’s existence and the soul’s distinction from the body. For apart from those questions belonging to pneumatics and natural theology, he was so caught up in explaining them and defending them against objections that he revealed too clearly his weakness in understanding and judging metaphysical formalities and abstractions. I will not even [describe] how he went about proposing such lofty and difficult philosophical ideas in a methodical, precise, clear, and evident way, or how he dealt with similar things and hypotheses taken or assumed without proof, or the non-principles on which he built his own ideas. Finally, there are the contradictions, confusions, and evasions he typically resorted to when attacked by opponents, like a man who has fallen into water grasping at anything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 3</cite>, tr. Michael Lynch (1665)</span></figcaption>

grasping%20at%20anything&amp;text=his%20%5BDescartes%E2%80%99%5D%20warning&amp;text=who%20has%20fallen%20into%20water%20grasping%20at%20anything" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-05927b811b" data-kw="">
<blockquote><p>It is the same with the idea of substance, which is but a determination of the idea of being. Substance is being capable of existing in itself and not in something else. The intellect, which at once perceives being underneath the phenomena (something which is), observes that these phenomena are many and variable, while being, on the contrary, is one and the same, and that it exists in itself, and not as an attribute in another. Being considered as such is called substance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God: his Existence &amp; his Nature</cite>, vol. 1 (B. Herder: 1945), p. 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

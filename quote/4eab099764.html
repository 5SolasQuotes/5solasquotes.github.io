<blockquote><p>2… [Margin note: A prophet is an interpreter of the Word] Also they which expound other men’s prophesies are prophets. For so was Aaron said to be the prophet of Moses unto Pharaoh: and the expounders of the holy scriptures are called prophets. Also it belongs to the office of a prophet to pray unto God: wherefore Paul says that ‘every man praying or prophesying, etc.’ [1 Cor. 11:4] And in Genesis [ch. 20], God answers Abimelech concerning Abraham, when he had taken his wife from him: ‘Give him his wife again, for he is a prophet, and shall pray for thee.’ And Paul in the first epistle to the Corinthians the 14th chapter sets forth more at large the office of a prophet. ‘When ye come together’ (says he) ‘every one hath a psalm, or hath doctrine, or hath revelation, or hath interpretation; let all things be done to edifying. They may also make hymns and thanksgiving, and exhort the people. For Paul says: ‘He that prophesieth, speaketh doctrine, exhortation, and consolation.’ Which faculty pertains to the mind and power of understanding. And a prophet differs from a priest, in that a priest should not only exhort, teach, and comfort; but also minister holy services, which thing a prophet may not do. Besides, the priests were of the tribe of Levi: the prophets were of other tribes. Moreover, the priests might err, &amp; often did err; but the true prophets, in that they were prophets, could not err. Indeed they sometimes added somewhat of their own, but therein they were not prophets… 4. But now that spirit, wherewith they be stirred up, is sometimes good, and sometimes evil. For as God does edify the church by his prophets: so the devil apishly counterfeiting God, subverts it by his prophets… 5. …But a fuller definition [of prophesy] is this: Prophesy is a faculty given unto certain men by the spirit of God, without teaching or learning, whereby they are able certainly to know things heavenly, high, and secret, and to open the same unto others for edifying of the church. Here this word faculty is the general word to prophesy, which may be referred to natural power: not that the same power is natural, but that it may make men apt, as natural power does, whereby they may be assured of their knowledge. 7. But above all things, prophets must beware that they corrupt not, nor that they add not, or diminish any thing. For some, otherwhile having received the illumination of God, do add over and besides of their own. In the Acts (21:4, 10) certain holy men lightened with the spirit of God, said that many grievous afflictions were prepared for Paul at Jerusalem. And this in very deed they spake truly: but they added other things of their own. For they gave counsel unto Paul, that he should not go to Jerusalem; which thing they had not of the holy Ghost. Good prophets ought not so to behave themselves. For if they will mingle their own wisdom with the oracles of God, they may easily both be deceived themselves, and also cause others to be deceived. Besides this, the prophets must take heed, that they suffer not themselves to be corrupted either by money, or favor; as we read that Balaam did. For they which so do (says Jerome) are not prophets, but diviners: As when Logic is corrupt with errors, and fallacies, it is no longer Logic, but Sophistry. For they which may be hired to speak in favor for reward sake, be rather the diviners of idols, than the prophets of God: and if they bear any office in the church, they will soon infect their auditory with errors: and so both shall be cast headlong into the ditch. Further, they must endeavor themselves, by their life and manners, to win credit to the Word of God… 8 But thou wilt say, Seeing there be some good prophets and some bad; by what mark may the one sort be discerned from the other?… There be certain other more sure tokens showed us in the scriptures. God says in Deuteronomy, that these be two sure arguments of a good prophet. The first, if he lead not away the people to idolatry, and strange gods: Secondly, if it certainly come to pass whatsoeuer he foreshows. The one of these, which concerns idolatry, is undoubted and certain; but of the second some doubt may be. For sometimes the foreshowings of the true prophets have not come to pass. Isaiah did prophesy that king Hezekiah should die of that disease whereof he was sick: and Jonah said that within forty days the city of Ninevah should be destroyed, and yet neither of these things came to pass according to the prophesy. Here the answer may be that those sayings were not prophesies, so much as they were threatenings: and that the prophets did foresee those effects according to the causes: and when the causes were changed, it was no absurdity that the effects changed also: and therefore the prophets cannot be reproved as liars. But that place of Deuteronomy is not to be understood of threatenings, but of other prophesies…

9. Whereas Paul says that the spirits of the prophets are subject to the prophets; that he added, lest the prophets should be at any contention among themselves, and should hinder one another; or least that any one should say: He could not wait till another had done. Paule adds another note in the same place: None (says he) can say, the Lord Jesus, but in the spirit of God. And no man speaking in the spirit of God, defies Jesus. These be assured tokens both of a good prophet and of a bad. Nevertheless it is not sufficient to confess the Lord Jesus in words, but it must also be done in true faith. Augustine in his commentaries begun upon the Epistle to the Romans: There be found (says he) which profess God in words, but deny him in their doings. Wherefore whosoever professes the true faith of God, and shows the same in his deeds and manners, must be accounted for a true prophet. Yet we ought not to deny, but that evil men also do sometimes foreshow true things. Such be they which shall say in that latter day: Have not we cast out devils, and wrought many miracles in thy name? And generally we may conclude that whosoever confesses Jesus Christ, of what manners soever he be, so he lead us not away from the faith, the same is to be esteemed for a prophet of God. For God can use the works even of evil ministers, in showing forth his glory, so they keep themselves within the prescript of faith… But if we take prophesying more largely for the exposition of the prophets, and Word of God, it cannot be denied but that that faculty may be attained by exercise and doctrine. And therefore to that purpose we find that schools were appointed, wherein the children of the prophets were instructed…

10. Now let us in a few words declare the effects of prophesy. The first effect is, the edifying of the church. Therefore Solomon says in the 29th of Proverbs: When prophesy ceases,the people be scattered, and with idleness and loitering be quite marred. For prophesy keeps men in their duty: wherefore Paule says, He that prophesieth, speaketh doctrine, exhortation, and comfort; so that if the ordinary ministration at any time (as it happens) be out of course, God raises up prophets extraordinarily to restore things into order. But it may be doubted, whether prophets do surely know those things to be true, which they foretell: yes verily. For otherwise how could Abraham have found in his heart to slay his son, unless he had been assured of the commandment of God. Wherefore in that they be prophets, they be sure of that which they say; I add, ‘in that they be prophets.’ For as being men they may both err and be deceived. In Chronicles, David told Nathan that he would build up a temple unto the Lord. Then Nathan the prophet, as if he allowed the king’s mind, bade him do that which seemed good to his own eyes; but afterward he received from the mouth of God, that the same work pertained to Solomon: therefore Nathan as man erred: but God forthwith called him home.

11. But we see that Abraham and Abimelech [Gen. 20] did then prophesy when God appeared unto them, but not as they thought good themselves. So we may perceive that this power of prophesy, is not to be counted an habit, but a preparation, or as they term it a disposition, being in a kind of quality. And the heauenly light, wherewith a man’s mind is then lightened, is rather as a sudden passion, as that which may easily be removed, than as a passible quality: and is as light in the air, but not like the light of the celestial bodies: not as a paleness coming of the natural temperature of the body; but as that is which rises of a sudden frighting of the mind… But there is not so necessary a bond between prophesy and justifying faith as that every man that has attained to the gift of prophesying, is forthwith become a friend of God and justified. We know that Balaam was a wicked man, and yet nevertheless a prophet. And in Matthew there is mention made of certain wicked persons that in the day of judgment shall object unto the Lord; Have we not prophesied in thy name? Who nevertheless shall hear (Christ say) I know you not [Mt. 7]. But this is no marvel, since the same happens in the office of the apostles and evangelists, and other ministers of the church. Judas was not in God’s favor, and yet nevertheless an apostle, and sent to preach among the rest. And Paul in the epistle to the Philippians, speaks of some that they did not preach Christ with a pure mind; but onely that they might stir up afflictions to him, whereunto the apostle adds that he is glad so Christ be preached, whether it be in truth, or by an occasion. And why? This is no necessary consequent. Among their reasons alleged, this also may be brought for a cause: namely, for that this gift is granted of the Lord, for the furtherance and profit of others: even as are the gifts of healing, of tongues, and of other such graces. And this does nothing derogate from the goodness of God: nay rather it does more plainly show the same unto us, when we understand thereby, that he is so gracious, as he will make even the wicked to serve to a good purpose.

12. Sometime this name of a prophet is used in the holy scriptures for an interpreter, as in the 7th of Exodus, Aaron is appointed to be Moses’s prophet, that is, his interpreter before Pharaoh. And ye shall find that the word prophesying in the first of Samuel, is attributed unto Saul, when he being assailed with the evil spirit of the Lord, spake strange and unusual things (as the Greeks say) by a vehement concitation of the mind. But the children of the prophets were the disciples of great and famous prophets, which sometime with their musical instruments and songs, were so stirred up to sing the praises of God as they spake some things beyond their wonted manner and custom: so that it easily appeared they were set on by the spirit of God… 13… And it should seem that in the stead of them [prophets], there succeed most learned teachers of the holy scriptures, plentifully at this day given us of God. Nevertheless it cannot be proved by the scriptures that such be called prophets, unless they, by the inspiration of God, foreshow some secret mysteries, without the earnest endeavor of man’s eloquence. Except thou wilt wrest the words of Paul in the first to the Corinthians to that purpose: and yet thou canst not prove it necessarily. And although that Christ said that there should be such gifts in his church; yet he did not warrant that they should continue still forever: neither have we any promises that Christ would perpetually adorn his church with such gifts.</p></blockquote>

s+sometimes+good%2C+and+sometimes+evil.+For+as+God+does+edify+the+church+by+his+prophets%3A+so+the+devil+apishly+counterfeiting+God%2C+subverts+it+by+his+prophets%E2%80%A6+5.+%E2%80%A6But+a+fuller+definition+%5Bof+prophesy%5D+is+this%3A+Prophesy+is+a+faculty+given+unto+certain+men+by+the+spirit+of+God%2C+without+teaching+or+learning%2C+whereby+they+are+able+certainly+to+know+things+heavenly%2C+high%2C+and+secret%2C+and+to+open+the+same+unto+others+for+edifying+of+the+church.+Here+this+word+faculty+is+the+general+word+to+prophesy%2C+which+may+be+referred+to+natural+power%3A+not+that+the+same+power+is+natural%2C+but+that+it+may+make+men+apt%2C+as+natural+power+does%2C+whereby+they+may+be+assured+of+their+knowledge.+7.+But+above+all+things%2C+prophets+must+beware+that+they+corrupt+not%2C+nor+that+they+add+not%2C+or+diminish+any+thing.+For+some%2C+otherwhile+having+received+the+illumination+of+God%2C+do+add+over+and+besides+of+their+own.+In+the+Acts+%2821%3A4%2C+10%29+certain+holy+men+lightened+with+the+spirit+of+God%2C+said+that+many+grievous+afflictions+were+prepared+for+Paul+at+Jerusalem.+And+this+in+very+deed+they+spake+truly%3A+but+they+added+other+things+of+their+own.+For+they+gave+counsel+unto+Paul%2C+that+he+should+not+go+to+Jerusalem%3B+which+thing+they+had+not+of+the+holy+Ghost.+Good+prophets+ought+not+so+to+behave+themselves.+For+if+they+will+mingle+their+own+wisdom+with+the+oracles+of+God%2C+they+may+easily+both+be+deceived+themselves%2C+and+also+cause+others+to+be+deceived.+Besides+this%2C+the+prophets+must+take+heed%2C+that+they+suffer+not+themselves+to+be+corrupted+either+by+money%2C+or+favor%3B+as+we+read+that+Balaam+did.+For+they+which+so+do+%28says+Jerome%29+are+not+prophets%2C+but+diviners%3A+As+when+Logic+is+corrupt+with+errors%2C+and+fallacies%2C+it+is+no+longer+Logic%2C+but+Sophistry.+For+they+which+may+be+hired+to+speak+in+favor+for+reward+sake%2C+be+rather+the+diviners+of+idols%2C+than+the+prophets+of+God%3A+and+if+they+bear+any+office+in+the+church%2C+they+will+soon+infect+their+auditory+with+errors%3A+and+so+both+shall+be+cast+headlong+into+the+ditch.+Further%2C+they+must+endeavor+themselves%2C+by+their+life+and+manners%2C+to+win+credit+to+the+Word+of+God%E2%80%A6+8+But+thou+wilt+say%2C+Seeing+there+be+some+good+prophets+and+some+bad%3B+by+what+mark+may+the+one+sort+be+discerned+from+the+other%3F%E2%80%A6+There+be+certain+other+more+sure+tokens+showed+us+in+the+scriptures.+God+says+in+Deuteronomy%2C+that+these+be+two+sure+arguments+of+a+good+prophet.+The+first%2C+if+he+lead+not+away+the+people+to+idolatry%2C+and+strange+gods%3A+Secondly%2C+if+it+certainly+come+to+pass+whatsoeuer+he+foreshows.+The+one+of+these%2C+which+concerns+idolatry%2C+is+undoubted+and+certain%3B+but+of+the+second+some+doubt+may+be.+For+sometimes+the+foreshowings+of+the+true+prophets+have+not+come+to+pass.+Isaiah+did+prophesy+that+king+Hezekiah+should+die+of+that+disease+whereof+he+was+sick%3A+and+Jonah+said+that+within+forty+days+the+city+of+Ninevah+should+be+destroyed%2C+and+yet+neither+of+these+things+came+to+pass+according+to+the+prophesy.+Here+the+answer+may+be+that+those+sayings+were+not+prophesies%2C+so+much+as+they+were+threatenings%3A+and+that+the+prophets+did+foresee+those+effects+according+to+the+causes%3A+and+when+the+causes+were+changed%2C+it+was+no+absurdity+that+the+effects+changed+also%3A+and+therefore+the+prophets+cannot+be+reproved+as+liars.+But+that+place+of+Deuteronomy+is+not+to+be+understood+of+threatenings%2C+but+of+other+prophesies%E2%80%A6+9.+Whereas+Paul+says+that+the+spirits+of+the+prophets+are+subject+to+the+prophets%3B+that+he+added%2C+lest+the+prophets+should+be+at+any+contention+among+themselves%2C+and+should+hinder+one+another%3B+or+least+that+any+one+should+say%3A+He+could+not+wait+till+another+had+done.+Paule+adds+another+note+in+the+same+place%3A+None+%28says+he%29+can+say%2C+the+Lord+Jesus%2C+but+in+the+spirit+of+God.+And+no+man+speaking+in+the+spirit+of+God%2C+defies+Jesus.+These+be+assured+tokens+both+of+a+good+prophet+and+of+a+bad.+Nevertheless+it+is+not+sufficient+to+confess+the+Lord+Jesus+in+words%2C+but+it+must+also+be+done+in+true+faith.+Augustine+in+his+commentaries+begun+upon+the+Epistle+to+the+Romans%3A+There+be+found+%28says+he%29+which+profess+God+in+words%2C+but+deny+him+in+their+doings.+Wherefore+whosoever+professes+the+true+faith+of+God%2C+and+shows+the+same+in+his+deeds+and+manners%2C+must+be+accounted+for+a+true+prophet.+Yet+we+ought+not+to+deny%2C+but+that+evil+men+also+do+sometimes+foreshow+true+things.+Such+be+they+which+shall+say+in+that+latter+day%3A+Have+not+we+cast+out+devils%2C+and+wrought+many+miracles+in+thy+name%3F+And+generally+we+may+conclude+that+whosoever+confesses+Jesus+Christ%2C+of+what+manners+soever+he+be%2C+so+he+lead+us+not+away+from+the+faith%2C+the+same+is+to+be+esteemed+for+a+prophet+of+God.+For+God+can+use+the+works+even+of+evil+ministers%2C+in+showing+forth+his+glory%2C+so+they+keep+themselves+within+the+prescript+of+faith%E2%80%A6+But+if+we+take+prophesying+more+largely+for+the+exposition+of+the+prophets%2C+and+Word+of+God%2C+it+cannot+be+denied+but+that+that+faculty+may+be+attained+by+exercise+and+doctrine.+And+therefore+to+that+purpose+we+find+that+schools+were+appointed%2C+wherein+the+children+of+the+prophets+were+instructed%E2%80%A6+10.+Now+let+us+in+a+few+words+declare+the+effects+of+prophesy.+The+first+effect+is%2C+the+edifying+of+the+church.+Therefore+Solomon+says+in+the+29th+of+Proverbs%3A+When+prophesy+ceases%2Cthe+people+be+scattered%2C+and+with+idleness+and+loitering+be+quite+marred.+For+prophesy+keeps+men+in+their+duty%3A+wherefore+Paule+says%2C+He+that+prophesieth%2C+speaketh+doctrine%2C+exhortation%2C+and+comfort%3B+so+that+if+the+ordinary+ministration+at+any+time+%28as+it+happens%29+be+out+of+course%2C+God+raises+up+prophets+extraordinarily+to+restore+things+into+order.+But+it+may+be+doubted%2C+whether+prophets+do+surely+know+those+things+to+be+true%2C+which+they+foretell%3A+yes+verily.+For+otherwise+how+could+Abraham+have+found+in+his+heart+to+slay+his+son%2C+unless+he+had+been+assured+of+the+commandment+of+God.+Wherefore+in+that+they+be+prophets%2C+they+be+sure+of+that+which+they+say%3B+I+add%2C+%E2%80%98in+that+they+be+prophets.%E2%80%99+For+as+being+men+they+may+both+err+and+be+deceived.+In+Chronicles%2C+David+told+Nathan+that+he+would+build+up+a+temple+unto+the+Lord.+Then+Nathan+the+prophet%2C+as+if+he+allowed+the+king%E2%80%99s+mind%2C+bade+him+do+that+which+seemed+good+to+his+own+eyes%3B+but+afterward+he+received+from+the+mouth+of+God%2C+that+the+same+work+pertained+to+Solomon%3A+therefore+Nathan+as+man+erred%3A+but+God+forthwith+called+him+home.+11.+But+we+see+that+Abraham+and+Abimelech+%5BGen.+20%5D+did+then+prophesy+when+God+appeared+unto+them%2C+but+not+as+they+thought+good+themselves.+So+we+may+perceive+that+this+power+of+prophesy%2C+is+not+to+be+counted+an+habit%2C+but+a+preparation%2C+or+as+they+term+it+a+disposition%2C+being+in+a+kind+of+quality.+And+the+heauenly+light%2C+wherewith+a+man%E2%80%99s+mind+is+then+lightened%2C+is+rather+as+a+sudden+passion%2C+as+that+which+may+easily+be+removed%2C+than+as+a+passible+quality%3A+and+is+as+light+in+the+air%2C+but+not+like+the+light+of+the+celestial+bodies%3A+not+as+a+paleness+coming+of+the+natural+temperature+of+the+body%3B+but+as+that+is+which+rises+of+a+sudden+frighting+of+the+mind%E2%80%A6+But+there+is+not+so+necessary+a+bond+between+prophesy+and+justifying+faith+as+that+every+man+that+has+attained+to+the+gift+of+prophesying%2C+is+forthwith+become+a+friend+of+God+and+justified.+We+know+that+Balaam+was+a+wicked+man%2C+and+yet+nevertheless+a+prophet.+And+in+Matthew+there+is+mention+made+of+certain+wicked+persons+that+in+the+day+of+judgment+shall+object+unto+the+Lord%3B+Have+we+not+prophesied+in+thy+name%3F+Who+nevertheless+shall+hear+%28Christ+say%29+I+know+you+not+%5BMt.+7%5D.+But+this+is+no+marvel%2C+since+the+same+happens+in+the+office+of+the+apostles+and+evangelists%2C+and+other+ministers+of+the+church.+Judas+was+not+in+God%E2%80%99s+favor%2C+and+yet+nevertheless+an+apostle%2C+and+sent+to+preach+among+the+rest.+And+Paul+in+the+epistle+to+the+Philippians%2C+speaks+of+some+that+they+did+not+preach+Christ+with+a+pure+mind%3B+but+onely+that+they+might+stir+up+afflictions+to+him%2C+whereunto+the+apostle+adds+that+he+is+glad+so+Christ+be+preached%2C+whether+it+be+in+truth%2C+or+by+an+occasion.+And+why%3F+This+is+no+necessary+consequent.+Among+their+reasons+alleged%2C+this+also+may+be+brought+for+a+cause%3A+namely%2C+for+that+this+gift+is+granted+of+the+Lord%2C+for+the+furtherance+and+profit+of+others%3A+even+as+are+the+gifts+of+healing%2C+of+tongues%2C+and+of+other+such+graces.+And+this+does+nothing+derogate+from+the+goodness+of+God%3A+nay+rather+it+does+more+plainly+show+the+same+unto+us%2C+when+we+understand+thereby%2C+that+he+is+so+gracious%2C+as+he+will+make+even+the+wicked+to+serve+to+a+good+purpose.+12.+Sometime+this+name+of+a+prophet+is+used+in+the+holy+scriptures+for+an+interpreter%2C+as+in+the+7th+of+Exodus%2C+Aaron+is+appointed+to+be+Moses%E2%80%99s+prophet%2C+that+is%2C+his+interpreter+before+Pharaoh.+And+ye+shall+find+that+the+word+prophesying+in+the+first+of+Samuel%2C+is+attributed+unto+Saul%2C+when+he+being+assailed+with+the+evil+spirit+of+the+Lord%2C+spake+strange+and+unusual+things+%28as+the+Greeks+say%29+by+a+vehement+concitation+of+the+mind.+But+the+children+of+the+prophets+were+the+disciples+of+great+and+famous+prophets%2C+which+sometime+with+their+musical+instruments+and+songs%2C+were+so+stirred+up+to+sing+the+praises+of+God+as+they+spake+some+things+beyond+their+wonted+manner+and+custom%3A+so+that+it+easily+appeared+they+were+set+on+by+the+spirit+of+God%E2%80%A6+13%E2%80%A6+And+it+should+seem+that+in+the+stead+of+them+%5Bprophets%5D%2C+there+succeed+most+learned+teachers+of+the+holy+scriptures%2C+plentifully+at+this+day+given+us+of+God.+Nevertheless+it+cannot+be+proved+by+the+scriptures+that+such+be+called+prophets%2C+unless+they%2C+by+the+inspiration+of+God%2C+foreshow+some+secret+mysteries%2C+without+the+earnest+endeavor+of+man%E2%80%99s+eloquence.+Except+thou+wilt+wrest+the+words+of+Paul+in+the+first+to+the+Corinthians+to+that+purpose%3A+and+yet+thou+canst+not+prove+it+necessarily.+And+although+that+Christ+said+that+there+should+be+such+gifts+in+his+church%3B+yet+he+did+not+warrant+that+they+should+continue+still+forever%3A+neither+have+we+any+promises+that+Christ+would+perpetually+adorn+his+church+with+such+gifts.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Common+Places%2C+sections+2%2C+4-5%2C+7-13+in+ch.+3%2C+%E2%80%9CConcerning+Prophesy%3B+out+of+1+Samuel+19%3A33%E2%80%9D+in+The+Common+Places%E2%80%A6+%28London%2C+1583%29%2C+pt.+1%2C+pp.+17-24%2C+pp.+18-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4eab099764.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4eab099764.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-biblical-prophecy-as-including-expositing-the-scriptures/#:~:text=Margin%20note%3A%20A%20prophet%20is%20an,adorn%20his%20church%20with%20such%20gifts&amp;text=Margin%20note%3A%20A%20prophet%20is%20an%20interpreter%20of&amp;text=would%20perpetually%20adorn%20his%20church%20with%20such%20gifts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>X. …What is essential to the ministry cannot be changed without making another ministry. But the essence remaining untouched, it does not cease to be the same ministry, although a varied and manifold change as to the accidents may have taken place. The essence of the ministry is placed in this–that all saving truth pertaining to the conservation of faith and piety be retained and taught; that the true sacraments instituted by Christ may be administered; and that the people may be held under a legitimate government. The accidents make its state good or bad. The good is when the preaching of the Word is pure and entire without any mixture of error or superstition; when the sacraments are rightly celebrated according to the institution of Christ without addition, or detraction, or alteration; and the Christian people are governed in a holy manner according to the Word of God and not in a tyrannical manner. The bad on the other hand is when the truth preached is mixed with errors and superstitions; the sacraments are in different way altered and corrupted; and the government is either confused or unjust and tyrannical… But still it must not be thought that the ministry ought at once to cease and be extinguished on account of any corruption whatsoever and depraved state; as life is not at once extinguished, but can subsist in the midst of weakness and disease.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“X. …What is essential to the ministry cannot be changed without making another ministry. But the essence remaining untouched, it does not cease to be the same ministry, although a varied and manifold change as to the accidents may have taken place. The essence of the ministry is placed in this–that all saving truth pertaining to the conservation of faith and piety be retained and taught; that the true sacraments instituted by Christ may be administered; and that the people may be held under a legitimate government. The accidents make its state good or bad. The good is when the preaching of the Word is pure and entire without any mixture of error or superstition; when the sacraments are rightly celebrated according to the institution of Christ without addition, or detraction, or alteration; and the Christian people are governed in a holy manner according to the Word of God and not in a tyrannical manner. The bad on the other hand is when the truth preached is mixed with errors and superstitions; the sacraments are in different way altered and corrupted; and the government is either confused or unjust and tyrannical… But still it must not be thought that the ministry ought at once to cease and be extinguished on account of any corruption whatsoever and depraved state; as life is not at once extinguished, but can subsist in the midst of weakness and disease.”

— Francis Turretin, Institutes… (P&amp;R), vol. 3, Question 23, p. 218">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CX.+%E2%80%A6What+is+essential+to+the+ministry+cannot+be+changed+without+making+another+ministry.+But+the+essence+remaining+untouched%2C+it+does+not+cease+to+be+the+same+ministry%2C+although+a+varied+and+manifold+change+as+to+the+accidents+may+have+taken+place.+The+essence+of+the+ministry+is+placed+in+this%E2%80%93that+all+saving+truth+pertaining+to+the+conservation+of+faith+and+piety+be+retained+and+taught%3B+that+the+true+sacraments+instituted+by+Christ+may+be+administered%3B+and+that+the+people+may+be+held+under+a+legitimate+government.+The+accidents+make+its+state+good+or+bad.+The+good+is+when+the+preaching+of+the+Word+is+pure+and+entire+without+any+mixture+of+error+or+superstition%3B+when+the+sacraments+are+rightly+celebrated+according+to+the+institution+of+Christ+without+addition%2C+or+detraction%2C+or+alteration%3B+and+the+Christian+people+are+governed+in+a+holy+manner+according+to+the+Word+of+God+and+not+in+a+tyrannical+manner.+The+bad+on+the+other+hand+is+when+the+truth+preached+is+mixed+with+errors+and+superstitions%3B+the+sacraments+are+in+different+way+altered+and+corrupted%3B+and+the+government+is+either+confused+or+unjust+and+tyrannical%E2%80%A6+But+still+it+must+not+be+thought+that+the+ministry+ought+at+once+to+cease+and+be+extinguished+on+account+of+any+corruption+whatsoever+and+depraved+state%3B+as+life+is+not+at+once+extinguished%2C+but+can+subsist+in+the+midst+of+weakness+and+disease.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes%E2%80%A6+%28P%26R%29%2C+vol.+3%2C+Question+23%2C+p.+218&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F825ea3772a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/825ea3772a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-church-ministry/#:~:text=What%20is%20essential%20to%20the%20ministry,the%20midst%20of%20weakness%20and%20disease&amp;text=What%20is%20essential%20to%20the%20ministry%20cannot%20be&amp;text=subsist%20in%20the%20midst%20of%20weakness%20and%20disease" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bda0dba676" data-kw="">
<blockquote><p>If [as Thomas Hooker says,] ‘the laying on of hands be no specificating act of an office, because it is used in other performances, as in the sending of Paul and Barnabas to preach to the Gentiles, Acts 13,’ then shall water not be essential to baptism, nor drinking to the Lord’s Supper, nor blessing sacramental in that Supper, because in Levitical washings, in the feasts-sacred, in the Passover, in praying for a blessing to the Word preached, all these were used. It’s loose logic, a genere ad speciem [a genus to the species]; the question is not of laying on of hands in general, but of a certain kind and species of laying on of hands by way of prayer and designation. Mr. Rutherford knows there be diverse kinds of laying on of hands. 2. Nor do I say that the rite is essential to ordination, but of the necessity of before.</p></blockquote>

</figure><figure class="quote" id="q-1df370405b" data-kw="">
<blockquote><p>II. Moral actions of God, whose efficiency is metaphorical and are by way of object, by which He objectively moves and intelligibly instructs the elect (namely, adults or those using reason), by setting forth and offering the goods acquired, adjudicated, and assigned by Christ the Redeemer, and thus inviting to the acceptance of them, which happens through the contracting of the covenant. And such a moral action is of one single species, called Calling—calling, I say, to the contracting of the covenant of grace: so that I may distinguish it from the Calling which demands the performance of the law and summons all men to the obedience due to God from the right which He has over rational creatures. Which we also concede is directed to all the reprobate; but we deny that it can properly be called salvific, or a calling to salvation.

III. Real actions operating really or physically (as the more recent speak), and producing a real and inhering change in the subject, are those by which God makes the elect participants of real possession of goods and inhering gifts. And they are: Regeneration; Beatification in the state of grace; Beatification of the soul after this life; Resurrection to glory; Final glorification. Of these, the three latter pertain to the future life; the two former to the present life.</p></blockquote>

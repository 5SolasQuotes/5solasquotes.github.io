<main class="wrap"><figure class="quote" id="q-dbebef37e6" data-kw="">
<blockquote><p>1. The institution of the Sabbath rests upon the physical, moral and religious nature of man, as that nature exists under the conditions of his life in this world.

2. In conformity with this fact, God instituted the Sabbath at the creation of man, setting apart the seventh day for that purpose, and imposed its observance as a universal and perpetual moral obligation upon the race.

3. After the resurrection of Christ, instead of abrogating an old and introducing a new institution, God, through his inspired agents, perpetuated the Sabbath, reimposing it upon Christians with increased obligations, and by changing the day from the seventh to the first day of the week enriched it with new and higher significance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander-hodge.html">Archibald Alexander Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Day Changed and the Sabbath Preserved</cite>, (n.p., 1877), pp 1-2.</span></figcaption>

</figure><figure class="quote" id="q-fd42635e2c" data-kw="">
<blockquote><p>It is certain that in the ancient church and in Solomon’s temple, the use of musical instruments was accepted. Now that Christ has come, and together with the ancient priesthood and sacrifice and the representation appertaining to the Law, the use of instruments in churches has vanished like a shadow. For the various instruments of the musicians symbolize the parts and members of the elect, i.e., that the elect must worship the Lord with heart, soul, word and in every way. Thus David mentions every kind of instrument so that man may glorify God with all his strength, mind and members. He must speak and sing in the assembly with delight from the soul. For Paul would not only disapprove of the use of crude instruments, but does not permit in the church incomprehensible human words and singing that lacks edifying force; indeed he calls them mindless that teach and sing in the assembly like barbarians in unfamiliar languages (1 Cor. 14). The fathers teach the same. There is not so much as a reference to the organ in the New Testament, nor of its introduction into the purer church; but it was only introduced in theatrical masses, as if in obscene sport, by immoral priests to make clowns cut capers. The papal Chronicles attribute its introduction to Pope Vitalian. The resolutions of the councils, together with Jerome, condemn the stentorian noise in churches of persons shouting in theatrical fashion (Amos 5, 6). In the prophets, the Lord prohibits the playing of the harp and organs, and commands that teaching be done with the human voice, not with shadows and tricks. Therefore they do wrong that mumble foolishly before God the canonical hours as if superstitious chattering to themselves something of merit in the process, and who keep an organ in the sacred assembly like papists and others. What my father has not planted will be rooted out (Matt. 15:13). But to say seven times “glory to God” means that we worship God constantly in Spirit and in truth because seven times means many times — without end (Matt 18; Luke 17; Jerome, Augustine, and Hillary on these passages).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hungarian-reformed-churches.html">Hungarian Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hungarian Confessio Catholica</cite>, (1562) in Reformed Confessions of the 16th and 17th Centuries in English Translation, ed. James T. Dennison, Jr., 4 vol. (Grand Rapids: Reformation Heritage Books), 2.565–66.</span></figcaption>

</figure><figure class="quote" id="q-364bdb303f" data-kw="">
<blockquote><p>Dr. [John] Rainolds objected the example of the brazen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways: First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Rainolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>

<blockquote><p>In 1650 many ministers in the episcopal Church of England were presbyterian in outlook and sought for reform unto this end. While some progress had been made following the Westminster Assembly, the work was still very incomplete. Oliver Cromwell, the self appointed ‘Protector’ of England, arose to civil power at this time; he was an Independent as far as Church government. Hence, Independent churches were arising all around, sometimes with presbyterian ministers. The Church of England’s theology was Erastian. It did not have local church membership as we do, nor allowed for ruling elders in the churches, nor for the ecclesiastical ministry to have the right of excommunication from the Lord’s Supper. These conditions made it difficult, if at all possible, for ministers to have adequate oversight of their parish, and to adequately bar (beyond verbal warnings) scandalous, professing Christians from disgracing the Lord’s Supper. In Independent churches without ruling elders, especially in large congregations, the conditions were similar. A minister, under regular order, does not have, nor should have, of himself, the power of jurisdiction to bar persons from the Lord’s Supper. Hence, among conscientious presbyterian ministers in these situations, there was a very real question of whether they should administer the Lord’s Supper at all, especially in light of their obligation to maintain the integrity of the Supper and their attendant responsibility, in some respect, to keep persons from scandalously abusing it. Many ministers had determined in the negative, at least for the time, till further presbyterian reform could be made. Such systematic reform never occured thereafter. Henry Jeanes (1611–1662) was an English presbyterian minister that had administered the Supper, with certain qualifications, in such conditions. A group of presbyterian ministers hence asked him to write out his reasons for this, in the hopes that he might be able to shed more light on the question for them. The article above is Jeanes’s answer. It is excellent. He gives the same answer as Thomas Cartwright, an earlier father of presbyterianism (as seen here). Answering the question stated in the title of the article, of whether the Supper may be administered without ruling elders or a presbyterian church government, is quite simple: At the end of Acts 2, the apostles, who were ministers, administered the Supper to the large and growing Church in Jerusalem from house to house. Commentators, presbyterian included, nearly universally agree that they had no ruling elders, or sessions, or presbyteries. Why an affirmative answer to the question is right, though, is a much trickier thing to explicate. And this is the primary value of the article: It clearly, carefully and in a balanced fashion, according to right, detailed, classic presbyterian principles shows how these things consist with each other in their right relations, this giving us an exponentially greater understanding of the Lord’s things. See especially pp. 30-32 &amp; 34 that the Lord’s Supper is more (1) properly and immediately worship, and (2) life-giving, and is therefore of greater import and necessity than having an eldership and exercising a negative discipline so as to exclude the scandalous beyond the verbal guarding of the Table by the minister. A modern application of the question today is: Whether a minister, persuaded that weekly communion is too frequent for the adequate self-preparation of the people, in how it actually plays out, and for the elders to maintain adequate circumspection of the people’s right partaking of the Supper, and yet this church practice is not going to be reformed anytime soon, whether that minister may yet in good conscience administer the Supper in these conditions for the time? The principles discussed in the article would appear to be for the affirmative.</p></blockquote>

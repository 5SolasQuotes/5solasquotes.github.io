<blockquote><p>Doct. 2. That one day of seven be holily observed, is of moral and perpetual duty; as with us, the Lord’s Day.

Reas. 1. Because this is expressly commanded in this moral law, as spoken immediately by God himself, together with the other commands, and written by his own finger on tables of stone, as they were; which things were only proper to the moral law.

Reas. 2. Because it was thus ordained from the beginning of the Creation.

Reas. 3. Because it is never less necessary, that some seventh day be observed, than it was at the first institution. And that the Lord’s day, or first of the week, or seventh is now by Divine authority appointed to us, that it be holily kept, appeareth:

1. From the ground and reason of the change, because as God from the beginning, appointed the seventh day of the week, or septenary circuit of days for his rest from Creating of things: So Christ appointed the first of the week, or of the seventh days of ordinary recourse, because on that day he rested from his penal and afflictious labours of his humiliation, or emptying himself, whereby he restored and created the world, as it were new again, unto a better condition than it had lost.

2. By the frequent apparitions of Christ in the convention of his Disciples on this day.

3. From the sending and shedding abroad of the Holy-ghost, on this day.

4. By the practise of the Apostles.

5. By Apostolic constitution, 1 Cor 16.

6 From the very title and name of the Lord’s day, that it hath in the New Testament

7. From the rigorous observation of this day in the Primitive Church, by occasion whereof they were accounted worshippers of the sun; because this first day of the week was by Heathens attributed to the Planet of the Sun, as the rest were to the rest of the Planets.

Use Is of Exhortation, that out of conscience towards God, and obedience to this command, we have a care of observing the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism, in LII. Lectures, on chosen texts of Scripture, for each Lord’s-Day of the Year, Learnedly and Perspicuously Illustrated with Doctrines, Reasons and Uses</cite>, (London: Thomas Davies, 1659), Lecture XXXVIII, pp 231-32.</span></figcaption>

<blockquote><p>The internal worship may be considered either as habitual or actual. As habitual, and so we are bound to worship God at all times, the obligation holding both semper et ad semper [always and to all times]. As actual, and so we are bound to worship Him on all occasions the circumstances whereof make it a duty so to do.</p></blockquote>

<blockquote><p>The Mohammedan imposture is, in some respects, the most remarkable of all false religions. The specious simplicity of its essential doctrines, and its perfect freedom from idolatry, distinguish it forever from the gross mythology of classical and oriental paganism. But besides these characteristics, it displays a third, more interesting still. We mean the peculiar relation which it bears to Christianity. Whether it happened from a happy accident or a sagacious policy, we think it clear that Islam owes a vast proportion of its vast success, to the fact that Mohammed built upon another man’s foundation. Assuming the correctness of the common doctrine that the impostor was a brilliant genius, though a worthless libertine, and that his book is the offspring, not of insane stupidity, but of consummate artifice, there certainly is ground for admiration in the apparent union of simplicity and efficacy in the whole design.

The single idea of admitting freely the divine legation of the Hebrew seers, and exhibiting himself as the topstone of the edifice, the Last Great Prophet, and the Paraclete of Christ, has certainly the aspect of a master stroke of policy. Besides conciliating multitudes of Jews and soi-disant Christians, at the very first, this circumstance has aided the imposture not a little ever since. It relieves the Moslem doctors from the dire necessity of waging war against both law and gospel. Whatever can be cited from the Greek and Hebrew Scriptures, without disparaging Mohammed, they admit as readily as any Jew or Christian. Whatever, on the contrary, is hostile to his doctrines or pretensions, or at all at variance with the statements of the Koran, is disposed of, not by an absolute rejection of the Bible, but by a resort to the convenient supposition of corruption in the text. It is not the policy of Islam to array itself against the Jewish and the Christian dispensations, as an original and independent system; but to assume the same position in relation to the Gospel, which the Gospel seems to hold in relation to the Law—or, in other words, to make itself the grand denouement of that grand scheme, of which the Old and New Testaments were only the preparatory stages.

Indeed, if we were fully satisfied that the Rasool Allah [the apostle of God] had any plan at all, we should be disposed to account for it in this way. He was acquainted with three forms of religion, Judaism, Christianity, and Paganism. Disgusted with the latter, he was led, we may suppose, to make some inquiries into the points of difference, between the Jews and Christians. This he could not do, without discovering their singular relation to each other the Christians acknowledging the Scriptures of the Jews, but adding others to them, and regarding Jesus Christ as the Messiah—the Jews on the other hand rejecting the New Testament, and bitterly denying the Messiahship of Christ. This fact might very readily suggest the project of a new dispensation—a third one to the Christian, and a second to the Jew. The impostor would thus be furnished with an argument ad hominem to stop the mouths of both.

To the Jews he could say, Did not Moses tell your fathers that a prophet should rise up in the latter days, greater than all before him? I am he. Do you doubt it? Here is a revelation just received from Gabriel. Do not all your sacred books predict the coming of a great deliverer, a conqueror, a king? I am he. In a few months you shall see me at the head of a thousand tribes going forth to the conquest of the world. If this was the ground really taken at first, how striking must have been the seeming confirmation of these bold pretensions, when Mohammed and his successors had in fact subjected, not Arabia only, but Greece, Persia, Syria, and Egypt.

To the objection of the Christians, that the line of prophets was long since completed, he could answer, Did not Jesus come to abrogate or modify the law, when its provisions were no longer suited to the state of things? Even so come I, to supersede the Gospel—not to discredit, but to render it unnecessary, by a more extensive and authoritative doctrine. So far from being antichrist (as some no doubt objected) I am the very Comforter whom Jesus promised.

That such sophistry might easily have undermined the faith of renegadoes [sic] and half-pagan Christians, is certainly conceivable. Whether this was in fact the course adopted in the infancy of Islam, will admit a doubt. Be that as it may, it is certain, that the impostor considered it expedient to incorporate the leading facts of sacred history into his revelation, so far as they were known to him. That his knowledge of the subject was imperfect, need not excite our wonder. The sources which probably supplied his information, could scarcely be expected to emit a purer stream than that which irrigates the pages of the Perspicuous Book.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-addison-alexander.html">Joseph Addison Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Statements of the Koran in Biblical Repertory and Theological Review</cite></span></figcaption>

+pretensions%2C+when+Mohammed+and+his+successors+had+in+fact+subjected%2C+not+Arabia+only%2C+but+Greece%2C+Persia%2C+Syria%2C+and+Egypt.%0A%0ATo+the+objection+of+the+Christians%2C+that+the+line+of+prophets+was+long+since+completed%2C+he+could+answer%2C+Did+not+Jesus+come+to+abrogate+or+modify+the+law%2C+when+its+provisions+were+no+longer+suited+to+the+state+of+things%3F+Even+so+come+I%2C+to+supersede+the+Gospel%E2%80%94not+to+discredit%2C+but+to+render+it+unnecessary%2C+by+a+more+extensive+and+authoritative+doctrine.+So+far+from+being+antichrist+%28as+some+no+doubt+objected%29+I+am+the+very+Comforter+whom+Jesus+promised.%0A%0AThat+such+sophistry+might+easily+have+undermined+the+faith+of+renegadoes+%5Bsic%5D+and+half-pagan+Christians%2C+is+certainly+conceivable.+Whether+this+was+in+fact+the+course+adopted+in+the+infancy+of+Islam%2C+will+admit+a+doubt.+Be+that+as+it+may%2C+it+is+certain%2C+that+the+impostor+considered+it+expedient+to+incorporate+the+leading+facts+of+sacred+history+into+his+revelation%2C+so+far+as+they+were+known+to+him.+That+his+knowledge+of+the+subject+was+imperfect%2C+need+not+excite+our+wonder.+The+sources+which+probably+supplied+his+information%2C+could+scarcely+be+expected+to+emit+a+purer+stream+than+that+which+irrigates+the+pages+of+the+Perspicuous+Book.%E2%80%9D%0A%0A%E2%80%94+Joseph+Addison+Alexander%2C+Historical+Statements+of+the+Koran+in+Biblical+Repertory+and+Theological+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F99bc451774.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99bc451774.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/11/14/joseph-addison-alexander-on-the-cleverness-of-the-mohammedan-imposture/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-24865c5f13" data-kw="">
<blockquote><p>God gave to his people, the Jews, a civil, as well as a moral law; and he constituted the Sabbath a civil, as well as a religious institution. In one instance, at least, during the sojourn of the children of Israel in the wilderness, the presumptuous violation of the law of the Sabbath was visited by the penalty of death.

The fact that God made it a civil institution, indicates clearly the duty of all civil legislators, unless it can be shown that the reasons why the Jewish nation should have a Sabbath, do not apply to other nations. But as individuals and families have their respective accountability to God, so do nations. And as the civil ruler is “a minister of God,” he must make his legislation conform to God’s legislation. …

Now, God has commanded all men to remember the Sabbath-day to keep it holy; no civil ruler, therefore, has the right to require his subjects to labour on that day, save in case of necessity. And since ”righteousness exalteth a nation,” it is the wisdom of civil rulers to protect the people, in the enjoyment of the divinely-appointed day for the cultivation of virtue. This is eminently true of a free government, since all such governments depend upon the moral forces. The Sabbath, then, originated in the moral necessities of nations, as well as of individuals and families.</p></blockquote>

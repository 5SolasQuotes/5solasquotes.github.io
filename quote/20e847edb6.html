</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a9307165a8" data-kw="">
<blockquote><p>The Scripture is the best interpreter of Scripture, or the Spirit of God therein; nor are the church or its pastors, nor councils and popes, the infallible interpreters thereof; there is a private interpretation of Scripture, which every Christian may make, according to his ability and light; and there is a public one, by the preacher of the word but both are subject to, and to be determined by the Scripture itself, which is the only certain and infallible rule of faith and practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, Book I, ch. 2, p. 51</span></figcaption>

</figure><figure class="quote" id="q-8203363a8d" data-kw="">
<blockquote><p>It is not by Romanists only that it is denied, practically at least, if not theoretically. Nothing is more common among Protestants, especially in our day, than the attempt to coerce the conscience of men by public opinion; to make the opinions of men on questions of morals a rule of duty for the people, and even for the Church. If we would stand fast in the liberty wherewith Christ has made us free, we must adhere to the principle that in matters of religion and morals the Scriptures alone have authority to bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. VI, §4</span></figcaption>

</figure><figure class="quote" id="q-9ae95d3b37" data-kw="Mary Mediator Invocation of saints">
<blockquote><p>However, we cannot in any way acknowledge or accept what our opponents openly say, namely that Mary is to be invoked as a mediator between God and humans, or that she is our patron and advocate. We do not believe that this is either a tradition of Holy Scripture or a command from God. We believe that God, who alone grants all salvation for the present and future, is the one to be invoked alone. We believe that Christ alone [since He alone is true God and true man] is the true mediator between God and humans. We believe that He, who alone can satisfy all humans, is the patron and advocate with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on the Blessed Virgin Mary, the Mother of Our Lord Jesus Christ</cite>, 1558</span></figcaption>

<main class="wrap"><figure class="quote" id="q-85703384d6" data-kw="">
<blockquote><p>Discussions by Robert L. Dabney, D.D., LL.D., Professor of Moral Philosophy in the University of Texas, and for many years Professor of Theology in Union Theological Seminary in Virginia. Edited by C. R. Vaughan, D.D., Pastor of the Presbyterian Church of New Providence, Va. Vol. i: Theological and Evangelical. 8vo, pp. xix, 728. (Richmond, Va.: Presbyterian Committee of Publication, 1890.) Our Southern brethren are well advised to honour their great men by collected editions of their minor works. Dr. Dabney’s occasional writings are, moreover, of permanent value and worthy of the substantial form in which they are now republishing. We call attention to them here only provisionally, and reserve an extended review until the issue is more complete.

A word or two only on the editing. In a sense, this has been complete; especially valuable will be the full Index appended to the volume. In a sense it has been too complete; the laudatory “Biographical Sketch” that is prefixed must be as distasteful to Dr. Dabney himself as it is out of place in a body of collected writings published before the author has completed that valuable work for God and truth which we all hope he will be spared yet many years to continue. In still another sense, it is incomplete. We need to be told where and when each of the papers first saw the light, in order to estimate them aright; and surely some principle of arrangement might have been adopted which would avoid the appearance of confusion which the present order (or disorder) gives. Dr. Dabney’s strong and acute criticisms and arguments will furnish us a text for some later remarks.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reviews of Recent Theological Literature in Presbyterian and Reformed Review</cite></span></figcaption>

<blockquote><p>…as the soul of man is said to be in the head or heart, so conceive of God’s being in Heaven. The soul (we know) animates the whole body of man, and by the presence of it in every member communicates life to the whole: yet by way of preeminency and excellency it is said to be in the head or heart of man, because in these two parts of man, and from thence she exercises her cheifest functions, and derives her cheifest influence.</p></blockquote>

</figure><figure class="quote" id="q-56eedd4017" data-kw="">
<blockquote><p>That is, Natural Theology is not repugnant to Revealed Theology in the Abstract, although Natural Theology is far less complete, and takes a position beneath Revealed Theology. Nevertheless, both are Lights, Natural Theology the lesser, Revealed Theology the greater, which have their origin from the same Father of lights. Neither is natural truth able to be inconsistent with revealed truth, since truth harmonizes with truth, or truth does not contradict truth, as it is in the Axiom; indeed, truth is opposed, not to truth, but to falsehood, although the same truth often becomes known from diverse starting points: thus, that God created the world, is evident by reason and by faith, in Philosophy from the light of nature, in Theology from the light of Scripture.

But Natural Theology nowhere exists in the abstract, as, on the other hand, Revealed Theology, pure and clear of all defects, is able to be read in the Sacred Scriptures. When, therefore, any dispute occurs between them, Natural Theology with all Philosophy ought to yield to Revealed Theology as more certain, seeing that human corruption easily mingles itself with Natural Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 21, p. 164.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56eedd4017.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/05/bernardinus-de-moor-on-the-harmony-between-natural-and-revealed-theology/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

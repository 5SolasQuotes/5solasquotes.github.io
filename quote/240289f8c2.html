<blockquote><p>Lust in the bud; that is, the first risings of lust, even before the consent of the will to them; the first openings of particular lusts, sometimes not regarded nor noticed, and so neither approved nor disapproved; and sometimes checked in their very rising, Rom. 7:15.</p></blockquote>

</figure><figure class="quote" id="q-06607c4dc4" data-kw="Temptation">
<blockquote><p>That which lusts against the spirit, and by lusting tempts, and in tempting entices and draws the heart to sin, is for nature sin itself: but concupiscence in the regenerate lusts against the spirit, Gal. 5. 17. … And therefore it is sin properly: such as the fruit is, such is the tree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic</cite>, Of Original Sin</span></figcaption>

— William Perkins, A Reformed Catholic, Of Original Sin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+which+lusts+against+the+spirit%2C+and+by+lusting+tempts%2C+and+in+tempting+entices+and+draws+the+heart+to+sin%2C+is+for+nature+sin+itself%3A+but+concupiscence+in+the+regenerate+lusts+against+the+spirit%2C+Gal.+5.+17.+%E2%80%A6+And+therefore+it+is+sin+properly%3A+such+as+the+fruit+is%2C+such+is+the+tree.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholic%2C+Of+Original+Sin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F06607c4dc4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/06607c4dc4.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1475-1640_a-reformed-catholike_perkins-w_1597" rel="noopener" target="_blank">Read it online · Internet Archive (1597 ed.)</a></div>
</figure><figure class="quote" id="q-8cc42432c9" data-kw="">
<blockquote><p>Those who maintain that concupiscence is not sin, are wont to found on the passage of James, &quot;Then, when lust has conceived, it bringeth forth sin,&quot; (James 1:15). But this is easily refuted: for unless we understand him as speaking only of wicked works or actual sins, even a wicked inclination will not be accounted sin. But from his calling crimes and wicked deeds the fruits of lust, and also giving them the name of sins, it does not follow that the lust itself is not an evil, and in the sight of God deserving of condemnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-is-truly-sin.html">Concupiscence is truly sin</a></span><span class="t"><a href="../topics/rome/sin-and-free-will.html">Rome: Sin and Free Will</a> › <a href="../topics/rome/sin-and-free-will/concupiscence.html">Concupiscence</a></span></div>

</figure><figure class="quote" id="q-8831222c6d" data-kw="">
<blockquote><p>So far is it from being lawfully inferred from this that lust is not sin that by necessary consequence its sinfulness can thence be elicited. The effect ought to correspond with the cause; nor could lust bring forth actual sin unless it is itself sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.21.9</span></figcaption>

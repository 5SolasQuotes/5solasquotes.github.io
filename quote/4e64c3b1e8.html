<main class="wrap"><figure class="quote" id="q-4e64c3b1e8" data-kw="">
<blockquote><p>The Jesuits, and Popish doctors, as they are of a large conscience in many things: so in the doctrine of scandal, to extol obedience to men so high as we may do things in themselves not necessary, yea [in things] that have no necessity but from the will of commanders; and Formalists in this conspire with them, even though from this do flow the ruin of many souls… the scandal ceases not to flow kindly [in kind] from the pretended obedience to an unlawful command, for the thing commanded, having no necessity but the will of man, is unlawful…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f29f5b7daa" data-kw="">
<blockquote><p>…nor can it be said that church-censures are spiritual punishments and so work on the spirit and have instructing, rebuking and exhorting going before, but the sword is a bodily punishment, and has not instructing going before. For I answer [that] though these two punishments differ, yet they agree that formally both are alike compulsory of the conscience, and neither of them act upon the spirit by teaching and instructing as the Word does, so as excommunication of a heretic should have instructing and convincing going before, so should also the Magistrate presuppose, before he strike with the sword, that the false teacher has been instructed and convinced, and so he does formally punish him with the sword for his pertinacious perverting of souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, p. 48</span></figcaption>

</figure><figure class="quote" id="q-525562fed7" data-kw="">
<blockquote><p>Question 2. Is A Magistrate Held Responsible To Render Account Of All His Laws To His Subjects? And How Far Are They To Presume Such Laws To Be Just? After this foundation has been laid we would also inquire into certain other questions which would appear to be germane to this discourse that the consciences of many may be satisfied. First the question is raised whether the magistrate is held to render account of all his laws to any man soever so as to offer proof that they be fair and in accordance with the precepts of religion. I answer that he is not so held; nay more, that it is fair that all virtuous subjects should regard their lords in the light of virtue and should not presume of suspect anything unjust concerning them; nay, that it is not becoming that men in private station should inquire over curiously even concerning doubtful matters beyond their comprehension or station in life. If, however, the conscience of some be at a loss, they can and are even under an obligation to examine (albeit discreetly and in a peaceful manner) what elements of reason and justice are to be found in the command by which they are bidden or forbidden to do something; for the word of the apostle abides: “whatsoever is not of faith (that is while the conscience is in doubt whether that is being done justly or not) is sin”. But if what is commanded is openly sinful or unjust, then indeed that which has been said above applies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers Over Their Subjects &amp; the Duty Of Subjects Towards Their Rulers</cite>, (1574)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

25562fed7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-the-mere-will-determination-judgment-or-saying-so-of-authorities-is-in-insufficient-ground-of-faith-obedience-that-authorities-are-never-to-act-or-require-something-without-a-naturally-mo/#:~:text=Question%202.%20Is%20A%20Magistrate%20Held,which%20has%20been%20said%20above%20applies&amp;text=Question%202.%20Is%20A%20Magistrate%20Held%20Responsible%20To&amp;text=indeed%20that%20which%20has%20been%20said%20above%20applies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e3b73937d5" data-kw="">
<blockquote><p>There is a twofold judgement which discerns and judges of Faith. The one absolute, whereby the most high God, whose supreme Authority alone, binds us to believe whatsoever He propounds to be believed by us, has in his written Word pronounced, declared and established what He would have us to believe concerning Himself, or his worship. The other [is] limited and subordinate: which is either public or private. That which is public, is either ordinary or extraordinary. The Ministerial or subordinate public judgement, which I call ordinary, is the judgement of every pastor or doctor, who by reason of his public vocation and office, ought by his public ministry to direct and instruct the judgments of other men in matters of Faith. Which judgement of pastors and doctors is limited and restricted to the plain warrants and testimonies of Holy Scripture (Junius, Cont. 1, bk. 3, ch. 4, note 17), they themselves being only the ambassadors of the judge, to preach and publish the sentence which He has established, so that a pastor is not properly judex [a judge] but index [an informer]. The subordinate public judgment, which is extraordinary, is the judgement of a council, assembled for the more public and effectual establishment and declaration of one or more points of faith and heads of Christian doctrine, and that in opposition to all contrary heresy, or error, which is broached and set a foot in the Church. (M. Ant. De Dom. de Rep. Eccl., bk. 7, ch. 3, n. 32) From which council, no Christian man who is learned in the Scriptures may be excluded, but ought to be admitted to utter his judgement in the same. For in the indagation [investigation] or searching out of a matter of faith, they are not the persons of men which give authority to their sayings, but the reasons and documents which every one brings for his judgment. The subordinate judgement, which I call private, is the judgment of discretion (Davenant, Of the Judge of Controversies, ch. 25; Junius, as above), whereby every Christian, for the certain information of his own mind and the satisfaction of his own conscience, may and ought to try and examine, as well the decrees of councils as the doctrines of particular pastors, and insofar to receive and believe the same as he understands them to agree with the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Edinburgh, 1637) | Pt. 3 | ch. 8, Digression 3, ‘Of the Judging of Controversies and Questions of Faith’, pp. 176-7</span></figcaption>

</figure><figure class="quote" id="q-cbecbbb5dc" data-kw="">
<blockquote><p>Fourth, there is yet another concession which it is necessary to make in regard to this matter, and which it is of some importance to note; and it is this, that the mere resistance to authority as authority alone, ought not to be made a ground for Church censure or punishment, when there is no moral or spiritual offence connected with the resistance. Of course resistance to authority, even when that authority is put forth, as it sometimes may and must be, in enforcing a thing indifferent, may yet be associated with moral guilt on the part of those who indulge in it. Such resistance may arise out of feelings of hatred to all restraint, or opposition of a malignant kind to all authority; it may become contumacy, and as such involve moral blame. But until resistance to authority becomes in one way or other morally wrong, when the consent of the members to the act or deed of the rulers is withheld from no cause in itself sinful, such want of consent or concurrence ought to be dealt with on the principle of forbearance in things indifferent, and not be visited with censure or penalty of an ecclesiastical kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church</cite>, vol. 1, Edinburgh, 1868, p. 243</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>
<div class="actions"><button class="copy" data-copy="“Fourth, there is yet another concession which it is necessary to make in regard to this matter, and which it is of some importance to note; and it is this, that the mere resistance to authority as authority alone, ought not to be made a ground for Church censure or punishment, when there is no moral or spiritual offence connected with the resistance. Of course resistance to authority, even when that authority is put forth, as it sometimes may and must be, in enforcing a thing indifferent, may yet be associated with moral guilt on the part of those who indulge in it. Such resistance may arise out of feelings of hatred to all restraint, or opposition of a malignant kind to all authority; it may become contumacy, and as such involve moral blame. But until resistance to authority becomes in one way or other morally wrong, when the consent of the members to the act or deed of the rulers is withheld from no cause in itself sinful, such want of consent or concurrence ought to be dealt with on the principle of forbearance in things indifferent, and not be visited with censure or penalty of an ecclesiastical kind.”

— James Bannerman, The Church of Christ, vol. 1, Edinburgh, 1868, p. 243">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFourth%2C+there+is+yet+another+concession+which+it+is+necessary+to+make+in+regard+to+this+matter%2C+and+which+it+is+of+some+importance+to+note%3B+and+it+is+this%2C+that+the+mere+resistance+to+authority+as+authority+alone%2C+ought+not+to+be+made+a+ground+for+Church+censure+or+punishment%2C+when+there+is+no+moral+or+spiritual+offence+connected+with+the+resistance.+Of+course+resistance+to+authority%2C+even+when+that+authority+is+put+forth%2C+as+it+sometimes+may+and+must+be%2C+in+enforcing+a+thing+indifferent%2C+may+yet+be+associated+with+moral+guilt+on+the+part+of+those+who+indulge+in+it.+Such+resistance+may+arise+out+of+feelings+of+hatred+to+all+restraint%2C+or+opposition+of+a+malignant+kind+to+all+authority%3B+it+may+become+contumacy%2C+and+as+such+involve+moral+blame.+But+until+resistance+to+authority+becomes+in+one+way+or+other+morally+wrong%2C+when+the+consent+of+the+members+to+the+act+or+deed+of+the+rulers+is+withheld+from+no+cause+in+itself+sinful%2C+such+want+of+consent+or+concurrence+ought+to+be+dealt+with+on+the+principle+of+forbearance+in+things+indifferent%2C+and+not+be+visited+with+censure+or+penalty+of+an+ecclesiastical+kind.%E2%80%9D%0A%0A%E2%80%94+James+Bannerman%2C+The+Church+of+Christ%2C+vol.+1%2C+Edinburgh%2C+1868%2C+p.+243&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcbecbbb5dc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cbecbbb5dc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-guilt-innocence-in-breaking-church-ordinances-on-contumacy/#:~:text=Fourth%2C%20there%20is%20yet%20another%20concession,or%20penalty%20of%20an%20ecclesiastical%20kind&amp;text=Fourth%2C%20there%20is%20yet%20another%20concession%20which%20it&amp;text=with%20censure%20or%20penalty%20of%20an%20ecclesiastical%20kind" rel="noopener" target="_b

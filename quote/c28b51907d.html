<main class="wrap"><figure class="quote" id="q-c28b51907d" data-kw="">
<blockquote><p>This Original Sin Consists especially, – In the privation or loss (1) of Man’s Primitive Integrity or Original Righteousness concreated with him Gen. 1. 26, 27. and 3. 6, 7, 8. Eccles. 7. 29.— All have sinned, and come short of the glory of God, Rom. 3. 23. (2) and of that sweet communion, which, in that integrity, he enjoyed with God, Gen. 3. 6, 7, 8, 10. Whereupon man becomes Dead in Sin, Ephes. 2. 1. 5. with Gen. 2. 16, 17. 2. In the Depravation, Pollution and Corruption of his whole nature: His whole Soul and all the faculties thereof; His whole Body and all the Parts thereof, being universally defiled. —to them that are defiled and unbelieving is nothing pure, but even their Mind and Conscience is defiled, Tit. 1. 15. See Gen. 6. 5. Jer. 17. 9. Rom. 3. 10. to 19. 2 Pet. 2. 14.

Hence, From both these ensue two woeful effects. 1. An Indisposition, and utter inability, yea an Opposition and Enmity, unto all Good. Rom. 5. 6. and 7. 18. and 8. 8. Col. 1. 21. Rom. 8. 7. and 5. 10. 2. An Universal pronity, Propensity or Proclivity unto all Evil. Gen. 6. 5. and 8. 21. Rom. 3. 10, 11, 12. 1 Pet. 4. 2, 3, 4. Original Sin, being the Root, Seed and Common Spawn of all Actual Sin in the World Jam. 1. 14, 15. Ephes. 2. 1, 2, 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Tree of Life, or, The Natural Man Directed unto Christ (London, 1673), p. 6.</cite></span></figcaption>

</figure><figure class="quote" id="q-ac69f4c409" data-kw="">
<blockquote><p>David, like every one who seriously grapples with sin, did not stand at the mere outward appearance of sin, but pressed into its secret workshop, to its troubled fountain. Whenever the knowledge of sin extends so far, the prayer for forgiveness and sanctification must necessarily be more comprehensive. … Therefore was David led, from knowledge of one sin, to the knowledge of his whole sinful nature.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-e7fac7e276" data-kw="">
<blockquote><p>Take note, therefore, of a new righteousness and a new definition of righteousness. For one usually says: “Righteousness is the virtue that renders to everyone his due.” Here it is stated that righteousness is faith in Jesus Christ or the virtue by which one believes in Jesus Christ, as in Rom. 10:10: “With the heart man believes unto righteousness”; that is, if anyone wants to be righteous, it is necessary for him to believe in Christ with his heart. And in the third chapter St. Jerome says: “Well put is that true statement of a wise man that the believer does not live as the result of righteousness but is righteous by faith.” A beautiful statement indeed! It follows now that the man who is righteous through faith does not through himself give to anyone what is his; he does this through Another, namely, Jesus Christ, who alone is so righteous as to render to all what should be rendered them. As a matter of fact, they owe everything to Him. But he who believes in Christ and by the spirit of faith has become one with Him not only renders satisfaction now to all but also brings it about that they owe everything to him, since he has all things in common with Christ. His sins are no longer his; they are Christ’s. But in Christ sins are unable to overcome righteousness. In fact, they themselves are overcome. Hence they are destroyed in him. Again, Christ’s righteousness now belongs not only to Christ; it belongs to His Christian. Therefore the Christian cannot owe anything to anyone or be oppressed by his sins, since he is supported by such great righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 27: Lectures on Galatians, 1535, Chapters 5-6; 1519, Chapters 1-6, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 27 (Saint Louis: Concordia Publishing House, 1999), 240–41.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-603c223076" data-kw="">
<blockquote><p>And so, you have in that one verse 18 of chapter 1 these three things: First, man is not justified by works; second, man is condemned by works, which is the reason of the former; third, all the works of all men are wicked and unrighteous, which again is the reason of the nearest former statement. For the sense of that verse is, as if to say, indeed, in regard to justification by works, it is so far absent from the case that man is justified by them, so that on the contrary he is condemned by them, for they are all wicked and unrighteous</p></blockquote>

</figure><figure class="quote" id="q-ebd9cd8cc4" data-kw="">
<blockquote><p>A double accusation may be brought against man before the tribunal of God: that he is a sinner, and so guilty of the breach of the first covenant [of Works]; or that he is no sound believer, having not fulfilled the condition [i.e. faith] of the second [covenant, i.e. of grace]. As to the first accusation, we are justified by faith; as to the second, by works; and so James and Paul are reconciled (Rom. 3:24; Jm. 2:24): “A man is justified by faith without the deeds of the law,” and “a man is justified by works and not by faith only.</p></blockquote>

</figure><figure class="quote" id="q-4530eb6855" data-kw="">
<blockquote><p>In the law-court of God, then, the justification of man as sinner is the judgment of God whereby He pronounces righteous the person who is unholy and of himself a sinner subject to God’s wrath. He does so out of his own mere grace and mercy, for the sake of the perfect obedience and righteousness of Christ that was offered on our behalf and that is received by faith. That is, He pardons the sinner from sin and the curse, and imputes to him the righteousness of his Son and so awards to him life eternal, for the salvation of the believing person and the glory of the merciful and just God. Nearly every part of this definition is included by the apostle in Romans 3:24–26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jacobus-arnoldi-ditsius.html">Jacobus Arnoldi Ditsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(1599–1662) in Synopsis of a Purer Theology: Latin Text and English Translation</cite>, 2.307</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8a2942ec6b" data-kw="">
<blockquote><p>1. Regarding young people who have never been married, none, whether sons or daughters, who have a father still living shall have the power to contract a marriage without the permission of their father unless they have attained the legal age, that is twenty years for a son and eighteen for a daughter. And if after reaching the said age they have asked their fathers or had them asked to marry them and their fathers have not attended to it, in that case it shall be lawful for them to marry without their father’s authority. … 7. Where children marry without their father’s or mother’s permission at the age permitted above and it is established by the court that they have done this lawfully because of the negligence or excessive strictness of their fathers, let the fathers be required to grant them a dowry or provide them such a share or position as [they would have given] if they had consented to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marriage-ordinance-of-geneva.html">John Witte Jr. &amp; Robert McCune Kingdon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sex, Marriage &amp; Family in John Calvin’s Geneva</cite>, vol. 1: Courtship, Engagement, &amp; Marriage, pp. 165 &amp; 172 (Marriage Ordinance of Geneva)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-37f089a21d" data-kw="">
<blockquote><p>Question 19: May one [de]part from a husband or wife that has the leprosy or that has the French pox [syphilis] by their adulterous practices, when the innocent persons life is endangered by it. Answer: If it be an innocent person’s disease, the other must cohabit, and tenderly cherish and comfort the diseased; yea, so as somewhat to hazard their own lives, but not so as apparently to cast them away, upon a danger not like[ly] to be avoided, unless the other’s life, or some greater good be like[ly] to be purchased by it. But if it be the pox of an adulterer, the innocent party is at liberty [to divorce] by the other’s adultery, and the saving of their own lives does add thereto. But without adultery the disease alone will not excuse them from cohabitation, though it may from congress [coming together in sexual union].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 2, ‘Christian Economics’, ch. 9, ‘Cases About Divorce &amp; Separation’, p. 539</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-aa0b348ef9" data-kw="">
<blockquote><p>His comforts to me are not dealt with a niggard’s hand, but I would fain learn not to idolize comfort, sense, joy, and sweet felt-presence: All these are but creatures, and nothing but the kingly robe, the gold-ring and the bracelets of the Bridegroom: The Bridegroom Himself is better then all the ornaments that are about Him.</p></blockquote>

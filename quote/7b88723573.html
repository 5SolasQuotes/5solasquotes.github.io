<main class="wrap"><figure class="quote" id="q-7b88723573" data-kw="">
<blockquote><p>O, would God in heaven, that some time a government might be established that would do away with the public bawdy-houses, as was done among the people of Israel! It is indeed an unchristian sight, that public houses of sin are maintained among Christians, a thing formerly altogether unheard of.

It should be a rule that boys and girls should be married early and such vice be prevented. Such a rule and custom ought to be sought for by both the spiritual and the temporal power. If it was possible among the Jews, why should it not also be possible among Christians? Nay, if it is possible in villages, towns and some cities, as we all see, why should it not be possible everywhere?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Good Works</cite>, (1520), trans. W. A. Lambert in Works of Martin Luther with Introductions and Notes, ed. Henry Eyster Jacobs (2 vols, Philadelphia: A. J. Holman, 1915-16), 1: 267.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-80835e15e7" data-kw="">
<blockquote><p>The reason why St. James would not have the ceremonies buried as soon as they were dead, was because the Jews had been so long confirmed in them, and bare such a love unto them; and he would purchase concord between them and the Gentile converts; though the Gentiles should bear with some inconvenience into the bargain, as not presently using all the liberty which through Christ they had a right unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 15:20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-4ef8944025" data-kw="">
<blockquote><p>But perhaps they will object the apostles determination (Acts 15) concerning the Gentiles newly converted to Christianity, that they should abstain from eating of blood and things strangled, which was a Mosaical rite. To which I answer: First, that the apostles in the same place (v. 10) do show, that that burden of legal ceremonies was removed by the death of Christ and buried in his grave. Secondly, they did this in regard of the Jews which dwelt among those Christians for the time, being for peace’s sake, until the Christian Jews were better confirmed in the faith and knowledge of Christ (v. 21). Thirdly, they did it by the special direction of the Holy Ghost (v. 28), for the reason alleged. So as that example being extraordinary, and for the time of the infancy of the Gospel, it is no rule for us to follow now after so long a shining forth of the Gospel. And I might add this moreover, that the apostles did not this alone, but with the whole congregation, the presbyters, or elders, and brethren being joined with them. Whereas our prelates, though, they confess that a General Council has no immediate institution from Christ to determine controversies; but that it was prudently taken up in the Church from the apostles’ example, Acts 15. Yet for all their prudence in taking up that which belongs not unto them, they shew themselves very unfaithful, while they follow not the example of the apostles in determining alone, and not with the whole congregation; and therefore Christians have the less reason to captivate their faith to prelatical decrees, either in a General Council where the Pope of Rome and of Canterbury are the rulers of the rost, or in a convocation, where the Pope of Canterbury is Prime, Primate, Metropolitan, and All, who without the Holy Ghost (which is never given to any such Antichristian assemblies) whatever they decree in point of faith or otherwise, be it never so erroneous, yet they enjoin obedience thereunto by all men, as our Prelate affirms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord Bishops, None of the Lord’s Bishops. Or A Short Discourse</cite>, (1640), ch. 7. Prynne was a prominent Erastian.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-6b3be082bc" data-kw="">
<blockquote><p>Now it is easy to everyone to know that when marriage is according to nature and God’s designation, when a woman is married to an husband she receives him as a guide, as a protector, a safeguard and defense, a shelter from harms and dangers, a reliever from distresses, a comforter in afflictions, a support in discouragements. God has so designed it, and therefore has made man of a more robust [nature], and strong in body and mind, with more wisdom strength and courage, fit to protect and defend; but he has made woman weaker, more soft and tender, more fearful, and more affectionate, as a fit object of generous protection and defense.

Hence it is, that it is natural in women to look most at valour and fortitude, wisdom, generosity and greatness of soul: these virtues do—or at least ought, according to nature—move most upon the affections of the woman. Hence also it is, that man naturally looks most at a soft and tender disposition of mind, and those virtues and affections which spring from it, such as humility, modesty, purity, chastity. And the affections which he most naturally looks at in her are a sweet and entire confidence and trust, submission and resignation; for when he receives a woman as wife, he receives her as an object of his guardianship and protection, and therefore looks at those qualifications and dispositions which exert themselves in trust and confidence.

Thus it’s against nature for a man to love a woman as wife that is rugged, daring and presumptuous, and trusts to herself, and thinks she is able to protect herself and needs none of her husband’s defense or guidance. And it is impossible a woman should love a man as an husband, except she can confide in him, and sweetly rest in him as a safeguard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jonathan Edwards</cite>, 37. Faith in The “Miscellanies”: (Entry Nos. a-z, aa-zz, 1-500)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-11dae79043" data-kw="">
<blockquote><p>5. Children having their life and first breathings of nature from their parents, must be in a more entire relation from their father than from their prince. Subjects have not their being-natural, but their civil, politic and peaceable well-being from their prince.

6. A father is a father by generation, and giving the being of nature to children, and is a natural head and root, without the free consent and suffrages of his children, and is essentially a father to one child, as Adam was to one Cain; but a prince is a prince by the free suffrages of a community, and cannot be a king to one only, and he is the politic head of a civil corporation.

7. A father, so long as his children lives, can never leave off to be a father, though he were mad and furious — though he be the most wicked man on earth. Qui genuit filium non potest non genuisse filium, what is once past cannot, by any power, be not past; a father is a father forever. But by confession of royalists, as Barclaius, Hugo Grotius, and Arnisaeus, and others, grant, if a king sell his subjects by sea or land to other nations, if he turn a furious Nero, he may be dethroned… Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach that “the father is not obliged to reveal the conspiracy of his son against his prince; nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“5. Children having their life and first breathings of nature from their parents, must be in a more entire relation from their father than from their prince. Subjects have not their being-natural, but their civil, politic and peaceable well-being from their prince.

7. A father, so long as his children lives, can never leave off to be a father, though he were mad and furious — though he be the most wicked man on earth. Qui genuit filium non potest non genuisse filium, what is once past cannot, by any power, be not past; a father is a father forever. But by confession of royalists, as Barclaius, Hugo Grotius, and Arnisaeus, and others, grant, if a king sell his subjects by sea or land to other nations, if he turn a furious Nero, he may be dethroned… Learned politicians, as Bartholomeus Romulus, (Defens. part 1, n. 153, and Joannes de Anania (in c. fin. de his qui fil. occid.) teach that “the father is not obliged to reveal the conspiracy of his son against his prince; nor is he more to accuse his son, than to accuse himself, because the father loves the son better than himself,” (D. Listi quidem. Sect. Fin. quod, met. caus, et D. L. fin. c. de cura furiosi) and certainly a father had rather die in his own person, as choose to die in his son’s, in whom he affects a sort of immortality, in specie, quando non potest in individuo [in kind when not able in the individual]; but a king does not love his subjects with a natural or fatherly love thus; and if the affections differ, the power which seconds the affection, for the conservation either of being, or well-being, must also differ proportionally.”

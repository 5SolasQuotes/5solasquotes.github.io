<main class="wrap"><figure class="quote" id="q-bfbcffb020" data-kw="">
<blockquote><p>We are accustomed to testify without hesitation that this reverence–even if it principally resides in the attitude of the heart of a person who, with a certain righteous dread, regards God as present with Him, a heavenly banquet as present, and the angels as present–nevertheless is also present in the external elements [signis]. I mean things like kneeling during common prayers, an uncovered head, and properly greeting those from whose hand we receive the mysteries–in a word, in our whole deportment and demeanor. And anyone who behaved differently would not leave without a severe rebuke.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper (RHB, 2016)</cite>, p. 113</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e9f016fc63" data-kw="">
<blockquote><p>As for the vails wherewith the apostle would have women covered while as they were praying (that is in their hearts following the public and common prayer) or prophesying (that is singing, 1 Sam. 10:10; 1 Chron. 25:1), they are worthy to be covered with shame as with a garment, who allege this example for sacred significant ceremonies of human institution. This covering was a moral sign for that comely and orderly distinction of men and women, which civil decency required in all their meetings: wherefore that distinction of habits [garments], which they used for decency and comeliness in their common behavior and conversation, the apostle will have them, for the same decency and comeliness, still to retain in their holy assemblies. And further the apostle shows that it is also a natural sign, and that nature itself teaches it: therefore he urges it both by the inferiority or subjection of the woman, verses 3, 8, 9 (for covering was then a sign of subjection), and by the long hair which nature gives to a woman, verse 15, where he would have the artificial covering to be fashioned in imitation of the natural. What need we [argue] any more? Let us see nature’s institution or the apostles’ recommendation for the controverted [English-Popish] ceremonies (as we have seen them for women’s vails) and we yield the argument.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’ | ch. 5, ‘The 5th Argument… taken from the mystical &amp; significant nature of them’</cite>, pp. 90-91</span></figcaption>

</figure><figure class="quote" id="q-3b1b27c588" data-kw="">
<blockquote><p>Hence forth will I now touch certain points what I would have in your common assemblies observed and kept, and what I would were avoided, that in them nothing be done either unorderly, or contentiously, or riotously… One thing more must I tell you, which is yet of no great importance, nor [is] much weighty, but such as may, if the time and place so require, be changed… Lesse hurt were it, if ye in such points agreed, since they be but externe matters, nor make so much to the furtherance of Gospel-like godliness.</p></blockquote>

<blockquote><p>This thesis will examine the literary evidence of the cultural significance of head-coverings, particularly with reference to the Corinthian congregation addressed by Paul in 1 Cor. 11:2-16. There are two main objectives of the thesis: to produce a coherent interpretation of 1 Cor. 11:2-16 and to establish Paul’s view of gender in the text. …The first part investigates the significance of ‘the veil’ for the ancient Greeks and Romans respectively and compares certain aspects of gender in Greco-Roman culture and the letters of Paul… Paul’s view of gender in the text shows a degree of consistency with the culture…</p></blockquote>

</figure><figure class="quote" id="q-98bac284a7" data-kw="">
<blockquote><p>‘with her head uncovered’. It may seem strange from whom the Corinthian women should take up this custom, since the Jewish women were not allowed to go into the streets, or into any open and public place, unveiled (Maimonides, Hilch. Ishot, ch. 24, sect. 12). It was a Jewish law, that they should go out nowhere bare-headed (Babylonian Talmud, Cethubot, fol. 72. 1): yea, it was reckoned scandalous and ignominious to do so. Hence it is said, שגלוי הראש גנאי להם, “that uncovering of the head is a reproach” to the daughters of Israel (Rabbi Solomon Jarchi on Numb. 5:19)… So that there it should seem that these Corinthians followed the examples of the heathens: but then, though it might be the custom of some nations for women to go abroad bare headed; yet at their solemnities, where and when they were admitted, for they were not everywhere and always, they used to attend with their heads veiled and covered (Alex., ab Alex. Genial. Dier., bk. 4, ch. 17)… ‘for that is even all one as if she were shaven’; to be without a veil, or some sort of covering on her head, according to the custom of the country, is the same thing as if her head was shaved;…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Whole Bible, on 1 Cor. 11 | v. 5</cite></span></figcaption>

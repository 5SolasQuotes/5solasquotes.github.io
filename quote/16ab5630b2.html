<blockquote><p>FIRST QUESTION

Whether there is a natural law, and how it differs from the moral law. The former we affirm; the latter we distinguish.

I. As the doctrine concerning the law of God (the discussion of which we now enter upon with the favour of God) properly belongs to the theologian, so it has a multiple use in theology. (1) For the direction of life – as a perfect rule of God’s right over man and of man’s duty towards God. (2) For a knowledge of sin – because as sin is illegally (anomia), from no other source than the law can its truth and heinousness be ascertained (Rom. 3:20). (3) For preparation for grace – that from the declaration of man’s sin and misery, the necessity of saving grace may be unfolded and a desire for it excited in us (in which sense it is called “a schoolmaster unto Christ,” Gal. 3:24). …

IV. Now this law of God is divided in general into natural and positive. As the right of God is twofold (one natural, founded in the perfectly just and holy nature of God; the other positive, depending on the will of God alone in which he also shows his own liberty), so there is a positive law of God built on the free and positive right of God (with respect to which things are then good because God commands them). Hence God was free either not to give such a law or to institute otherwise (such as the law relating to food and the symbolic law given to Adam [Gen. 2:16, 17] and the ceremonial laws of the Old Testament, in which there was no moral goodness or evil per se, but only from the command of God).

There is another (natural) founded on the natural right of God, with regard to which things are not called just because they are commanded, but are commanded because they were just and good antecedent to the command of God (being founded on the very holiness and wisdom of God). And such is its nature that (the creation of man being supposed) it must have been given to him, since it prescribes to him indispensable duties to be performed by all, always and everywhere. …

XXII. If it is asked how this natural law agrees with or differs from the moral law, the answer is easy. It agrees as to substance and with regard to principles, but differs as to accidents and with regard to conclusions. The same duties (both toward God and toward our neighbour) prescribed by the moral law are also contained in the natural law. The difference is with regard to the mode of delivery.

In the moral law, these duties are clearly, distinctly and fully declared; while in the natural law they are obscurely and imperfectly declared both because many intimations have been lost and obliterated by sin and because it has been variously corrupted by the vanity and wickedness of men (Rom. 1:20-22). Not to mention other differences: as that the natural law was engraven upon the hearts of men, the moral law on stony tables; the former pertains to all universally, the latter only to those called by the word, the former contains nothing except morality, the latter has also certain ceremonials mingled with it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.1.1, 4, 22.</span></figcaption>

<blockquote><p>When Paul says, “The law is not of faith,” he sets down the main difference between the law and the gospel. The law promises life to him that performs perfect obedience, and that for his works. The gospel promises life to him that does nothing in the cause of his salvation, but only believes in Christ. And it promises salvation to him that believes, yet not for his faith, or for any works else, but for the merit of Christ. The law then requires doing to salvation; and the gospel, believing, and nothing else.</p></blockquote>

<blockquote><p>First here observe, that the Law of God is made perpetual and unchangeable: If any man ask how this can be, seeing the Apostle saith, The Law is changed?

Answer. The Law is threefold; Ceremonial, Judicial, and Moral, as hath been said: now that place is principally to be understood of the Ceremonial law, which indeed is abrogated, in regard of the observation of it in God’s worship; but in the scope and substance of it, which is Christ crucified, with his benefits, whom it shadowed out, it remaineth still, and is now more plain then ever it was.

As for the Judicial law, though it be abrogated unto us, so far forth as it was peculiar to the Jews; yet, as it agrees with common equity, and serves directly to establish the precepts of the Moral law, it is perpetual. If it be said, that Christ changed the Moral law, in changing the Sabbath day, from the seventh day to the eight: I answer, Christ did so indeed by his Apostles, but that is no change of the substance, but of the ceremony of the Sabbath: for the substance of that law is, the enjoining of a seventh day’s rest unto the Lord. Now though the seventh day from the creation be not kept, yet a seventh day is kept still.

If it be further said, that the Law it self is abrogated; for that every one that breaketh the Law is not accursed, according to the sentence thereof, Deut. 27. 26.

Answer. We must know that the Law is but one part of God’s word, and the Gospel another, revealing another part of Gods will, besides that which the Law made known; for it adds a qualification to the Law, moderating the rigour thereof, after this manner: He is accursed (saith the Law) that faileth in any commandment, except (saith the Gospel) he be reconciled again in Christ, and in him have the pardon of his transgressions. And yet the Moral law remains for ever a rule of obedience to every child of God, though he be not bound to bring the same obedience for his justification before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), pp 74-75.</span></figcaption>

leth+in+any+commandment%2C+except+%28saith+the+Gospel%29+he+be+reconciled+again+in+Christ%2C+and+in+him+have+the+pardon+of+his+transgressions.+And+yet+the+Moral+law+remains+for+ever+a+rule+of+obedience+to+every+child+of+God%2C+though+he+be+not+bound+to+bring+the+same+obedience+for+his+justification+before+God.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+godly+and+learned+exposition+of+Christ%E2%80%99s+Sermon+in+the+Mount%2C+%28Cambridge%3A+University+of+Cambridge%2C+1608%29%2C+pp+74-75.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa7d6993795.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a7d6993795.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/07/william-perkins-on-the-perpetuity-of-the-moral-law-and-the-sabbath/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-aca7e1212a" data-kw="images worship denied">
<blockquote><p>The question is not whether images may be made which ought to be valued by us (whether we regard the artist, material or antiquity, or even on account of the prototype, if he is a man of some reputation, dear to us). Rather the question is: Should any religious worship (whether called adoration or veneration) be paid to images of God and the saints made by the hand of men? Among our opponents, there is no agreement on this point, some roundly showing adoration, others however, to avoid odium, urging only veneration. But this is an empty distinction. Since religious worship is only one and does not admit of various species, it is equally such by whatever name it may be designated.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f71b2c1443" data-kw="">
<blockquote><p>You will reap both pleasure and profit from this Observation; that the true Protestant differs from all sorts of men and Religions, by making the three Persons in Trinity, according to their several properties, the foundation of all truth.

1. He distinguisheth himself from the Atheists, by worshipping the Father as the Fountain of truth.

2. He dissents from Mahumetans, Indians, Infidels, while he sets up Christ in himself, for the only Image of truth.

3. By seeking and embracing the discovery of truth in the Spirit, he differs from all sorts of Christians; especially three.

1. The Papists, a Faction of policy. These persuade us to receive the testimony, not of the Spirit, but of the Church, for a Touchstone of truth: And this Church is the Popes private Consistory, or General Council. Thus the Church’s Authority, not the Demonstration of the Holy Ghost shall be the light of Faith to Truth. Thus not content with an Antichrist, they set up their Consistory, or Council for an Anti-spirit. But we need no visible Judge on earth, to determine upon our consciences; What is Scripture; what is the sense of Scripture. We have an invisible Judge and Witness in our own breasts: He that believeth, hath the testimony in himself, 1 Joh. 5. chap. 10. v. for he hath the Spirit.

2. The Arminians, a Sect of Moralists, who give the over-persuading power of the Spirit, to strength of Rhetoric and Reason, inward or outward.

3. A Party of wit and worth: so far as the wit and worth of man can go; if they would submit the wit and worth of man to the Power and Wisdom of God: The Socinians; the Principles of Reason, are the pillars of Religion, and truth to these men. But Reason is a pillar of a Cloud; the Spirit only is the pillar of Fire, which hath light in it. Reason is that Gladius versatilis, that sword in that hand of the Cherubim, that kept Paradise; a sword that turns every way. It may keep men from the tree of Life, but can never bring them to it. Our faith is not in the wisdom of man, but power of God, 1 Cor. 2. chap. 5. verse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-sterry.html">Peter Sterry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spirit convincing of sin opened in a sermon before the Honorable House of Commons, assembled in Parliament upon the solemn day of their monthly fast, Novemb. 26, 1645</cite>, (London: Henry Overton and Benjamin Allen, 1645), pp 27-29.</span></figcaption>

<blockquote><p>The testimonies of Cyprian, Ambrose, Augustine, are easily answered, in a few words: They speak not of mystical rites, or significant ceremonies, but of some civil external usages gotten into worship; different in diverse places; as Socrates [the early Church, ecclesiastical historian] tells us of many, in his time, as in observation of Easter or Lent: in receiving the Lord’s Supper at evening or morning, standing or sitting, etc. Such an usage in Reformed Churches, is, that somewhere the ministers preach with heads covered, otherwhere, bare-headed, and many the like: In such things, those ancients advise to conform to the usages of the places where they come: but surely, would never have wise people to comply in things inexpediently sinful, in worship, in any place.</p></blockquote>

<blockquote><p>Concl. The former considerations being clear, we hold that such a Church-covenant is a conceit destitute of all authority of God’s Word, Old or New Testament, and therefore to be rejected as a way of men’s devising,

1. Argum. All will-worship laying a band on the Conscience, where God hath laid none, is damnable; but to tie the oath of God to one particular duty rather then another, so as you cannot, without such an oath, enter into such a state, nor have title and right to the seals of grace and God’s Ordinances, is will-worship, and that by virtue of a divine Law, and is a binding of the Conscience where God hath not bound it. …

I prove the assumption; for a Minister to swear the oath of fidelity to his flock, is lawful; but to tie an oath so to his Ministry, as to say the Apostles teach, he cannot be a minister who sweareth not that oath, is to lay a bond on the Conscience, where God hath laid none. That a father swear to perform the duties of a father, a master the duties of a master towards his servant, is lawful; but to lay a bond on him, that he is in Conscience, and before God no father, no master, except he swear to perform those duties, is to lay a bond on the Conscience where God hath laid none.

So to swear subjection to such a Ministry and visible Church, is lawful; but to tie by an Apostolic Law and practice the oath of God so to such duties, as to make this Church-oath the essential form of such membership, so as you cannot enter into Church-state, nor have right to the Seals of the Covenant without such an oath, is to bind where God hath not bound; for there is no Law of God, putting upon any Church-oath such a state, as that it is the essential form of Church-membership, without the which a man is no Church-member, and the Church visible, not swearing this oath is no Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The due right of presbyteries, or, A peaceable plea for the government of the Church of Scotland</cite>, (London: Richard Whittaker and Andrew Crook, 1644), pp 88, 89.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

— Samuel Rutherford, The due right of presbyteries, or, A peaceable plea for the government of the Church of Scotland, (London: Richard Whittaker and Andrew Crook, 1644), pp 88, 89.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConcl.+The+former+considerations+being+clear%2C+we+hold+that+such+a+Church-covenant+is+a+conceit+destitute+of+all+authority+of+God%E2%80%99s+Word%2C+Old+or+New+Testament%2C+and+therefore+to+be+rejected+as+a+way+of+men%E2%80%99s+devising%2C%0A%0A1.+Argum.+All+will-worship+laying+a+band+on+the+Conscience%2C+where+God+hath+laid+none%2C+is+damnable%3B+but+to+tie+the+oath+of+God+to+one+particular+duty+rather+then+another%2C+so+as+you+cannot%2C+without+such+an+oath%2C+enter+into+such+a+state%2C+nor+have+title+and+right+to+the+seals+of+grace+and+God%E2%80%99s+Ordinances%2C+is+will-worship%2C+and+that+by+virtue+of+a+divine+Law%2C+and+is+a+binding+of+the+Conscience+where+God+hath+not+bound+it.+%E2%80%A6%0A%0AI+prove+the+assumption%3B+for+a+Minister+to+swear+the+oath+of+fidelity+to+his+flock%2C+is+lawful%3B+but+to+tie+an+oath+so+to+his+Ministry%2C+as+to+say+the+Apostles+teach%2C+he+cannot+be+a+minister+who+sweareth+not+that+oath%2C+is+to+lay+a+bond+on+the+Conscience%2C+where+God+hath+laid+none.+That+a+father+swear+to+perform+the+duties+of+a+father%2C+a+master+the+duties+of+a+master+towards+his+servant%2C+is+lawful%3B+but+to+lay+a+bond+on+him%2C+that+he+is+in+Conscience%2C+and+before+God+no+father%2C+no+master%2C+except+he+swear+to+perform+those+duties%2C+is+to+lay+a+bond+on+the+Conscience+where+God+hath+laid+none.%0A%0ASo+to+swear+subjection+to+such+a+Ministry+and+visible+Church%2C+is+lawful%3B+but+to+tie+by+an+Apostolic+Law+and+practice+the+oath+of+God+so+to+such+duties%2C+as+to+make+this+Church-oath+the+essential+form+of+such+membership%2C+so+as+you+cannot+enter+into+Church-state%2C+nor+have+right+to+the+Seals+of+the+Covenant+without+such+an+oath%2C+is+to+bind+where+God+hath+not+bound%3B+for+there+is+no+Law+of+God%2C+pu

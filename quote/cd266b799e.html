<main class="wrap"><figure class="quote" id="q-cd266b799e" data-kw="">
<blockquote><p>…there be some things that the Law of Nature commands, as to move, eat, sleep; and here with leave I distinguish factum, ‘the common practice’ of men, from the jus, what men in conscience ‘ought’ to do; As concerning the former, moral and natural men’s practice is all resolved in their own carnal will and lusts; and so they eat, move and sleep because nature and carnal will leads them thereinto, not because God in the Law of nature (which I humbly conceive to be a part of the first elements and principles of the Moral Law, or Decalogue, and so a part of Scripture) does so warrant us to do; and therefore the moving, eating, drinking of natural Moralists, are materially lawful and conform to Scripture, for God by the Law of nature commands both heathen men and pure Moralists within the visible Church [nominal church members], to do natural acts of this kind, because the Lord has revealed that to be his will in the Book of Nature: But these heathen do these acts because they are suitable to their lusts and carnal will, and not because God has commanded them so to do in the Book of Nature; and this is their sin in the manner of doing though materially, et quod substantiam actus [and that according to the substance of the act], the action be good; and the same is the sin of natural men within the visible Church, and a greater sin, for God not only commands them in the Law of Nature, but also in Scripture to do all these natural acts, because God has revealed his will in these natural actions, as they are moral, to natural men within the visible Church, both in the Law of Nature and in the Scripture, and de jure they ought to obey because God so commands in bot; and in regard all within the visible Church are obliged to all natural actions in a spiritual way, though their eating, moving, sleeping be lawful materially, et quod substantiam actus; yet because they do them without any the least habitual reference to God, so commanding in Nature’s Law and Scripture, they are in the manner of doing, sinful;</p></blockquote>

</figure><figure class="quote" id="q-39c2e2c7c7" data-kw="">
<blockquote><p>I. Faith taken theologically in general is the assent which we give to God speaking, when we are certainly persuaded that something is true, moved to that by Divine Authority. And by this faith is distinguished from opinion, which is a timid and uncertain assent. Likewise from knowledge, which is indeed a certain assent; but one which rests on demonstration or some evident argument, not truly on anyone’s testimony. Finally, from human faith, which acquiesces in the authority of men.

II. Therefore not every assent, even applied to those things which are contained in the Word of God, should be considered faith. For if someone certainly and firmly holds some dogma of religion, such as the creation of all things out of nothing: yet not impelled to that by divine revelation, but by some reason which seems necessary to him, to that extent he does not have faith… … XXIX. Certainly those who place faith also in the will are moved to that because they confuse trust with faith, and think trust is the principal act of faith and as it were its form. But in that they are deceived, or do not speak accurately enough. For trust is an effect of faith, not truly an act and form of faith. And if we want to speak properly, trust pertains to hope, not to faith. For it is nothing other than hope strengthened and confirmed. And certainly the apostle manifestly distinguishes trust from faith in Eph. 3:12, “In Christ,” he says, “we have boldness and access with confidence through faith in him.” Where faith is placed as the cause of trust or confidence, since we are said to have trust or confidence through faith: which would be said absurdly if trust and faith were the same thing. For this being posited, the sense of the passage would be, “Through trust we have trust”; which is nugatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683) Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | ‘On Faith’, pp. 125, 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-52fef15a39" data-kw="">
<blockquote><p>Yet is it as clear as the light at noon-day, that whosoever shall deny faith in Christ to be a condition appointed by God to be performed on man’s part for the obtaining of justification, shall have all Jews, pagans and Mahumetans concurring therein with him, as in a point naturally flowing and necessarily following from what they hold.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Anthony Wotton, Mr. Anthony Wotton’s Defence against Mr. George Walker’s Charge... (Cambridge: Daniel, 1641), ‘The Issue’ (1641), pp. 54-55 See also p. 36.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-37f089a21d" data-kw="">
<blockquote><p>Question 19: May one [de]part from a husband or wife that has the leprosy or that has the French pox [syphilis] by their adulterous practices, when the innocent persons life is endangered by it. Answer: If it be an innocent person’s disease, the other must cohabit, and tenderly cherish and comfort the diseased; yea, so as somewhat to hazard their own lives, but not so as apparently to cast them away, upon a danger not like[ly] to be avoided, unless the other’s life, or some greater good be like[ly] to be purchased by it. But if it be the pox of an adulterer, the innocent party is at liberty [to divorce] by the other’s adultery, and the saving of their own lives does add thereto. But without adultery the disease alone will not excuse them from cohabitation, though it may from congress [coming together in sexual union].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 2, ‘Christian Economics’, ch. 9, ‘Cases About Divorce &amp; Separation’, p. 539</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-008959d7e1" data-kw="">
<blockquote><p>So the love-tokens and testimonial rings and bracelets of the Husband, my love to the saints, my keeping of his word, my holy walking in Christ, being the works of his Spirit, which dwelt in Jesus Christ, are actu primo [the first act], in themselves, as infallible signs of the Bridegroom’s love to me; as the Beloved’s word who spake and said, ‘Arise, my love’: And if the spirations and breathings of the Spirit go not along, both the voice and the love-bracelets (for Christ is no more counterfeit in his love-tokens than in his word when He speaks as a Husband) are alike ineffectual to persuade the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (1647), pp. 98-99</span></figcaption>

</figure><figure class="quote" id="q-efdf554992" data-kw="">
<blockquote><p>Mr. Hooker, Mr. Thomas Goodwin, and Mr. Philip Nye [congregationalists] give them [the eldership of a local church] only an authoritative directing power [to ordain new elders], such as parents have in the marriage of their daughter, which is an authority extrinsic, which the magistrate and pastor in their kind have; but the virgin has the only formal and intrinsic power to consent and so to make the marriage, and to dissent so as it shall be no marriage: In which case the Fraternity only, or Male-church formally [according to congregationalists], intrinsically judges, and may judge, though there were no officers, as the maid may marry, though parents and tutors were dead; and the directive authority of the officers may be wanting [lacking], as the directive authority of the magistrate may be wanting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 3, ch. 3, p. 308</span></figcaption>

</figure><figure class="quote" id="q-95af61d5f1" data-kw="">
<blockquote><p>Yet though this capacity should never be actuated, as if persons, both capable, should after marriage live together and it should be known or acknowledged that all their lives they did abstain, yet were the marriage ***, as to the conjugal rights on either part.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/viscount-of-stair-james-dalrymple.html">James Dalrymple</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Title 4, ‘Conjugal Obligations’ in The Institutions of the Law of Scotland Deduced from its Originals</cite>, … (Edinburgh: Anderson, 1681), pp. 28-44 | Dalrymple places the essence of contracting marriage in mutual consent, though with some qualifications, such as retarded or insane persons, etc. may not be able to give sufficient consent to the lifelong institution, and the impotent cannot marry. Yet he says:, p. 32</span></figcaption>

</figure><figure class="quote" id="q-7fe5663de2" data-kw="">
<blockquote><p>I wonder [in response to an opponent] more in what capacity the magistrate can have to do with commanding and governing men, if not as they converse morally with men, and in their families, as fathers and sons, as masters and servants, and as Christians who both in private and public may perform duties to one another, or oppress one another; else the judge could not punish the rebellious son, the wicked servant, or the murdering father and the oppressing master.</p></blockquote>

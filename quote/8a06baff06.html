<blockquote><p>Thirdly, it is cleared in this discourse that those who have gotten to be powers (though by force) yet ought to give justice to those whose government they have undertaken. And again, that the people may lawfully demand it. But is it possible that one or a few persons in supreme power can distribute justice to a whole nation without subordinate agents? So that to say, ‘None may lawfully act under the supreme power in distributing of justice, and government,’ were to say upon the matter that he should give no justice, and that the people should have no justice at all. And then how absurd is it to teach that the people may lawfully seek justice of him which they cannot receive? and that he is bound to give justice, but none are allowed by whom he may give it? Fourthly, this doctrine of not acting is the very doctrine of levelling. For when no man may act to give justice, may not every man take freely from his neighbor what he list, and so level the rich with the poor? unless this make it unlikely, because worse than levelling, that those who have most force will have most; yea some all, and others nothing; and so to avoid acting under a supposed tyrannical government unto justice and order; there shall be tyrants in every place or parish, who shall act to disorder and oppression, and no property, justice, nor government at all left amongst us. And surely I think David out of his love to Israel would not have wished such an estate to Israel under Absalom, had he the whole in possession and himself no force on foot to recover it; nor would he have desired such an unsettlement to procure his settlement. And hence arises that which they call an interpretative consent of the people; because it is understood and supposed that every rational man does consent, that there should be order, property and right given to every member of a commonwealth under a tyrant, rather than all to be under confusion oppression, robberies and murders. Fifthly, how could Ezra and Nehemiah justify their acting under the Persian monarch, who had no right to the crown of Judah either by blood or just conquest (Ezra 7:25)? Yet Ezra was authorized by him to set magistrates, fine and imprison and put to death (Ezra 10:7-8); And he exercises authority, in making the people of Israel to swear and to enter into a covenant, and in sending forth a proclamation to all the children of the captivity, that they should gather themselves together to Jerusalem; And that whosoever would not come within three days, all his substance should be forfeited. Nehemiah also acts as governor, and rebukes the nobles and rulers and sets a great assembly against them because of their usury. He also called the priests and took an oath to perform the promise of leaving that usury (Neh. 5. •. etc.). He acknowledges also that he was governor there about twelve years, and he gave his brother Hanani and Hanaiah ruler of the palace charge over Jerusalem (Neh. 7:2). So he did both act himself and others acted under him. We find also that at that time there were rulers of the people that dwelt at Jerusalem, and Nehemiah contended with the rulers and nobles, made treasurers, commanded the gates to be shut before the Sabbath, threatened to lay hands on the merchants that lay at the gates, smote certain of the Jews and plucked off their hair because having married wives of Ashdod, their children spake half in the language of Ashdod (Neh. 13). Sixthly, let us hear what before these times and before our case was in being hath been taught in point of acting; and upon what grounds it has been approved. An author eminently learned and skillful in the doctrine of lawgiving says thus: ‘No man may punish or condemn another even with a just punishment, except he have public power, which a tyrant cannot give. But in this there must be a consideration or subdistinction. For in rigor this is true as to the tyrant’s part; yet it so happens that the commonwealth because it cannot resist him, does tolerate him, and suffers itself to be governed by him; and does tacitly consent, and will that justice be administered by him, for the reason already touched, because it is a less evil to be governed by him, than altogether to want just coaction and direction; and then it shall not be a sin to obey even in the things aforesaid, because the consent of the commonwealth does supply the defect of the tyrant’s power.’ (Suarez, De Leg., bk. 3, ch. 10) Another thus: ‘That his sentences are valid, is proved. Because his sentences, and just commands although they have not force from a tyrannical power, yet they have it from elsewhere. First, and inchoatively from the law of nature, which such a state of things being supposed, does dictate that obedience must be given for the common good, otherwise all will be full of thefts and robberies. Secondly, and completely from the commonwealth; and that either because while that state endures, it gives authority to him by a tacit consent, while it will’s that he administer justice, and use his usurped office in a due manner, or rather because it does tacitly approve his commands, and acts being agreeable to the laws and common good, and will’s that his just sentences, whereby the suites of the people are decided, and the guilty are punished, shall be valid and bind the subjects; for except they were valid and did bind, no man would obey, but only in show but every man would secretly do the contrary with a great inconvenience to the commonwealth. Now the commonwealth may give this force to the sentences, and acts of a tyrant, because it is superior to all single persons, though it be oppressed with tyranny, and may account the just sentence of a tyrant as its own.’ (Lessius, De Justitia &amp; Jure, bk. 2, ch. 25, Dubitat. 9) Thou wilt ask whether a tyrant do sin the sin of murder, and be bound to restitution, if he put to death guilty persons, or deprive them of their goods according to law? I answer negatively; because the commonwealth does tacitly give him authority hereunto, while it does consent and desire that this should be done by him. Thus is the authority of acting in this case grounded upon a tacit or implied consent, which consent is the very dictate of nature or common reason, because it is better to have some justice than none at all, some coercive power and government than that all be left to disorder, violence and confusion.</p></blockquote>

<blockquote><p>In a disputation by writing, those of the other part [Richard Baxter and others] formed an argument, whose major proposition was to this sense… ‘Whatsoever book [of law] enjoins nothing but what is of itself lawful, and by lawful authority, enjoins nothing that is sinful’. We denied this proposition, and at last gave diverse reasons of our denial; amongst which one was that ‘It may be unlawful by accident, and therefore sinful’… And I must confess I am still guilty of so much weakness as to be confident that ‘Some things, not evil of themselves, may have accidents so evil as may make it a sin to him that shall command them.’ Is this opinion inconsistent with all government? Yea I must confess myself guilty of so much greater weakness as that I thought I should never have found a man on earth that had the ordinary reason of a man, that had made question of it; yea I shall say more than that which has offended, viz, ‘That whensoever the commanding or forbidding of a thing indifferent is like to occasion more hurt than good, and this may be foreseen, the commanding or forbidding it is a sin.’ … I think Paul spake not anything inconsistent with the government of God or man when he bid both the rulers and the people of the Church not to destroy him with their meat for whom Christ died: and when he says, he hath not his power to destruction, but to edification; yea there are evil accidents of a thing, not evil of itself, that are caused by the commander: and it is my opinion that they may prove his command unlawful.</p></blockquote>

— Richard Baxter, As quoted in George Morley, The Bishop of Worcester’s Letter to a Friend for Vindication of Himself from Mr. Baxter’s Calumny (London, 1662) no page numbers.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+a+disputation+by+writing%2C+those+of+the+other+part+%5BRichard+Baxter+and+others%5D+formed+an+argument%2C+whose+major+proposition+was+to+this+sense%E2%80%A6+%E2%80%98Whatsoever+book+%5Bof+law%5D+enjoins+nothing+but+what+is+of+itself+lawful%2C+and+by+lawful+authority%2C+enjoins+nothing+that+is+sinful%E2%80%99.+We+denied+this+proposition%2C+and+at+last+gave+diverse+reasons+of+our+denial%3B+amongst+which+one+was+that+%E2%80%98It+may+be+unlawful+by+accident%2C+and+therefore+sinful%E2%80%99%E2%80%A6+And+I+must+confess+I+am+still+guilty+of+so+much+weakness+as+to+be+confident+that+%E2%80%98Some+things%2C+not+evil+of+themselves%2C+may+have+accidents+so+evil+as+may+make+it+a+sin+to+him+that+shall+command+them.%E2%80%99+Is+this+opinion+inconsistent+with+all+government%3F+Yea+I+must+confess+myself+guilty+of+so+much+greater+weakness+as+that+I+thought+I+should+never+have+found+a+man+on+earth+that+had+the+ordinary+reason+of+a+man%2C+that+had+made+question+of+it%3B+yea+I+shall+say+more+than+that+which+has+offended%2C+viz%2C+%E2%80%98That+whensoever+the+commanding+or+forbidding+of+a+thing+indifferent+is+like+to+occasion+more+hurt+than+good%2C+and+this+may+be+foreseen%2C+the+commanding+or+forbidding+it+is+a+sin.%E2%80%99+%E2%80%A6+I+think+Paul+spake+not+anything+inconsistent+with+the+government+of+God+or+man+when+he+bid+both+the+rulers+and+the+people+of+the+Church+not+to+destroy+him+with+their+meat+for+whom+Christ+died%3A+and+when+he+says%2C+he+hath+not+his+power+to+destruction%2C+but+to+edification%3B+yea+there+are+evil+accidents+of+a+thing%2C+not+evil+of+itself%2C+that+are+caused+by+the+commander%3A+and+it+is+my+opinion+that+they+may+prove+his+command+unlawful.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+As+quoted+in+George+Morley% <blockquote><p>5. That insofar as any of these [Church courts] do actually err and decline from the truth, they do insofar act without power and authority from Jesus Christ: They can do nothing (of themselves, they may do, but not by His commission and warrant) against the truth, but for the truth, 2 Cor. 13:8. The power which He has given them being to edification and not to destruction, 2 Cor. 13:12.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them</cite>, … (Edinburgh, 1658), p. 96</span></figcaption>

</figure><figure class="quote" id="q-509b384deb" data-kw="">
<blockquote><p>Those prisoners being taken at [the Battle of] Bothwell Bridge [1679] were pressed to bind themselves not to take up arms against the king’s person and authority, under the certification of no less punishment than death. … Though they had not been subjects, but only prisoners of war in the victor’s power, to deprive them of life or liberty forever, I suppose they could not have been blamed for the preservation of their life to have given in such a bond; some who were taken prisoners by [Oliver] Cromwell, for their liberty engaged not to carry arms against him; and I do not remember that any censured them for it. What they [the opponents against taking the Scottish Indulgence] say in a parenthesis, that hazard will not make a moral change in actions, is a palpable error: If there were twenty with drawn swords waiting at the church door to kill a minister if he should come to preach, it were rash, furious, self-destroying, self-murdering zeal for a minister to venture to go to preach at that time, in despite of the hazard, so certain, visible and unavoidable, and yet it were his duty at another time to preach where there were no such hazard. For a merchant to cast his wares in the sea in a calm were wicked folly contrary to the 8th Command, a stealing from his family and himself; and yet in a storm, Paul and the passengers and mariners thought it their duty to cast out both goods and tackling of the ship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of a Book bearing the Title of The History of the Indulgence</cite>, (London: Cockerill, 1681), pp. 610-11</span></figcaption>

</figure><figure class="quote" id="q-5f89c9779a" data-kw="">
<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or, A Vindication of our Lawful Submission to the Present Government, or to a Government Supposed Unlawful, but Commanding Lawful Things, Likewise how such an Obedience is Consistent with our Solemn League &amp; Covenant</cite>, … (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse., p. 27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

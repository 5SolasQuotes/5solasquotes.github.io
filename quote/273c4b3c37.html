<main class="wrap"><figure class="quote" id="q-273c4b3c37" data-kw="">
<blockquote><p>A meeting was held at which it was agreed that the ministers who had accepted the Indulgence should be invited to preach alongside their non-complying brethren, while the latter would be given access to their pulpits… Up till now [the latter part of 1677], Welwood had been virtually a lone [public] voice [against the Indulgence], but there were already signs that others were ready to follow in his footsteps. To forestall this, it was agreed that those presenting themselves for license should in future be required to give a promise not to preach on any matters which might create division–by which, of course, the Indulgence was primarily intended. All the non-complying ministers were strictly enjoined to enforce these requirements when licensing young men to preach. These instructions were in force by the beginning of 1678…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), pp. 78-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6fb58ae13f" data-kw="">
<blockquote><p>Beware of separating new lights; to separate from, or gather Churches out of the true reformed or reforming Churches, has not the least warrant from the Word of God: When we see this or that amiss in a Church we are bidden exhort one another, and provoke one another to good, but not to separate, Heb. 10:24-25. Zwingli conferred amicably with the Anabaptists in Zurich as with dissenting brethren; and no course was taken to suppress or restrain them by the secular power, till they grew to gather Churches out of the true reformed Churches: But when it came to that, they could not be suffered or forborne, it was thought necessary to restrain them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-60278f979b" data-kw="">
<blockquote><p>The papers on the other side blame Mr. Hamilton and his party as discouraging the men, and doing nothing but clamouring against those who were sent to the duke, and such as were for an accommodation; they allege, Mr. Hamilton, and these who were warmest, were soonest out of the field… but [the covenanters] were never able to make their horses face the cannon; and, in the wheeling, or taking up their ground, they fell foul upon some of their own men formed near them, and put them in some disorder: and those nearest them, seeing this, took it to be a flight, and the whole army fell into confusion, and fled; and one who was present there writes to me, Mr Hamilton was among the foremost, “leaving the world to debate whether he acted most like a traitor, coward, or fool.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, p. 107</span></figcaption>

</figure><figure class="quote" id="q-e98bd91aa8" data-kw="">
<blockquote><p>But it is proud ignorance and lack of Christian love causing excommunicating, persecuting, Separation or schism in some, and withdrawing censorious Separation in others, who (neither party) understand the truth nor ever loved their neighbors as themselves, nor learned to do as they would be done by.</p></blockquote>

</figure><figure class="quote" id="q-fde2a653f4" data-kw="">
<blockquote><p>When I speak of this divine ordinance of church government, my meaning is not to allow, much less to animate any in the too severe and over-strict exercise of ecclesiastical discipline and censures. It was observed by Jerome (Ad Marcellum), as one of the errors of the Montanists: Illi ad omne pene delictum ecclesiae obserant fores, They shut the church door (that is, they excommunicate and shut out of the church) almost at every offence. I confess the greater part are more apt to fail in the defect than in the excess, and are like to come too short rather than to go too far. Yet a failing there may be, and has been, both ways… My purpose and endeavor shall be… to own the thing, to disown the abuses of the thing, to point out the path of Christ’s ordinance without allowing either rigour against such as ought to be tenderly dealt with, or too much lenity towards such as must be saved with fear, and pulled out of the fire, or at all any aberration to the right or left hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming, ‘To the Reader’</cite>, p. xix</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

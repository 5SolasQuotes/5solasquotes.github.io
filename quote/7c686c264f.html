<main class="wrap"><figure class="quote" id="q-7c686c264f" data-kw="">
<blockquote><p>Justification is one, and immovable: That it is, and in what way XVIII. The justification taught so far is certainly one, and only one, first (1) by reason of the immutable divine decree (Gal. 3:8; Rom. 8:30), so that, just as all things are (Acts 15:18) so also the number of those to be justified, the abstract number as well as the concrete number, is known to him from eternity (2 Tim. 2:19), although from this eternal decree it ought not to be said that he justified actually from eternity (Gal. 3:8). (2) By reason of Christ, on whom, as the common principle and head of those to be justified, God placed each and every sin of each and every elect person, once and for all (2 Cor. 5:19). Finally, (3) also by reason of himself, insofar as after faith, once it is begun, it will continue without any interruption for eternity, nor will the sins of those once truly justified ever be actually revived again, although by succeeding sins they deserve to be revived (Ezek. 18:24). Yet this is so by such a unity that consists in flux, insofar as to individual sins, as soon as they have been perpetrated, after particular faith and repentance, the satisfaction and merits of Christ must be applied individually. And for this reason, as we have already taught, it has its own stages: (a) its beginning, which happens immediately after the first act of faith (John 3:16; 1:12); (b) its continuation, which is accomplished through continued acts of believing and repenting, according to the repetition and renewal of sins (2 Sam. 12:13); (c) its consummation, which will be accomplished before the tribunal as if by the living voice of the Judge (Matt. 25:34). And so also each person once justified can be, from faith and repentance, by virtue of the unmoved promise of God, infallibly certain of his own justification (John 3:16; Acts 10:43), because God cannot lie (Titus 1:2; Heb. 6:17–18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’</cite>, p. 124</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6bec436415" data-kw="">
<blockquote><p>At this point it may be asked whether justification is perfectly completed in this life? Let me say in response to this, first of all, that God’s benefits to us in Christ fall into two categories. One category includes benefits that are not inherent in man, such as his eternal predestination, his justification, and his adoption. The other includes benefits that are inherent in man, such as his effectual calling and his glorification. The benefits included in these two categories have this in common, that none of them—not predestination, not justification, not adoption, not effectual calling, not glorification—will be fully manifested and revealed until Christ’s own manifestation is full and perfect. Indeed, the revelation of these things in man has a beginning in the first manifestation of Christ Himself. Thus the apostle writes in Rom. 3:21, “but now the righteousness of God is revealed, etc.” But the revelation of them in believers is not yet full. Thus 1 Jn. 3:2: “We are already sons of God, but it has not yet appeared what we will be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’ tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.4.2. ‘The Imputation of Righteousness’, pp. 108-9 Rollock (c. 1555-1599) was a Scottish minister.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-8f093ce78a" data-kw="">
<blockquote><p>…this is not to be conceived in the way of some transient actions that pass away and leave not so much as a relative change. No, for when God does justify us at first, we are upon our believing put into a state and a fixed condition of peace with God. Thus the Scripture speaks of it as a state, like that of sanctification and glorification; so that while we are sleeping we are justified, because put into that estate, although we do not then actually believe. The first act therefore of faith receiving Christ, in whom we are justified, is like the putting of one into a state of marriage, or of magistracy: Though the first act pass away, yet the relative change it has made continues always; We are not justified by the habit of faith, but by the act, and yet after the first act we stand justified, though we are not all the day long actually believing. Its true, many learned divines say justification is a continued action, and it may be granted in this sense, that God does daily justify believers, even as He constantly preserves them in their natural being; but it is not true in this sense, as if we were put into a new state of justification every day. This is not only to make a first and a second justification, but a thousand justifications; remission of sins and imputation of Christ’s righteousness are reiterated; but justification besides these does connote a fixed estate of the justified person, which is but once, and the Mediator of the Covenant of grace does so firmly uphold this privilege, that there shall never be any total intercission of it, neither do ever any plenarily apostatize from this wonderful favor, that once received it.</p></blockquote>

<blockquote><p>3. Actually, in himself is man said to be justified, when he has the possession of it: But this actual justification has its degrees of progression. The beginning thereof is laid in our first union and incorporation into Christ: The consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission. Between both these there is a progressive work of justification, by the constant actings of the Spirit applying the blood of Christ, by the hand of faith, to the quiet and comfort of the soul. The first you may term initial justification, the latter perfective, and this between I would call progressive, it is the fruit of the first and the preludial assurance of the latter: This is wrought and sealed in the second sacrament [the Supper], as the former is in the first sacrament [baptism]: and both these branches of sacramental justification are to us the pre-assurance of that complemental and perfective justification; The sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession; even the first of these acts is not transacted without the seed and spirit of faith, much less the successive agitations, and progress of the work. Thus every way faith is considered as equal with, yea as foregoing the work of justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-bedford.html">Thomas Bedford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Examination of the Chief Points of Antinomianism… (London: Field, 1647), ch. 3, ‘A Brief Answer to the Arguments of H. D. by him brought to prove Justification before Faith, i.e. before the act of Believing’, pp. 32-33 Bedford and Ambrose were sharing some notes one way or the other.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“3. Actually, in himself is man said to be justified, when he has the possession of it: But this actual justification has its degrees of progression. The beginning thereof is laid in our first union and incorporation into Christ: The consummation of it is not till the Judge at the latter day has solemnly pronounced the sentence of final absolution, and so set us in full possession of entire remission. Between both these there is a progressive work of justification, by the constant actings of the Spirit applying the blood of Christ, by the hand of faith, to the quiet and comfort of the soul. The first you may term initial justification, the latter perfective, and this between I would call progressive, it is the fruit of the first and the preludial assurance of the latter: This is wrought and sealed in the second sacrament [the Supper], as the former is in the first sacrament [baptism]: and both these branches of sacramental justification are to us the pre-assurance of that complemental and perfective justification; The sentence whereof puts an end to all fears, changing our faith and hope into fruition and full possession; even the first of these acts is not transacted without the seed and spirit of faith, much less the successive agitations, and progress of the work. Thus every way faith is considered as equal with, yea as foregoing the work of justification.”

— Thomas Bedford, An Examination of the Chief Points of Antinomianism… (London: Field, 1647), ch. 3, ‘A Brief Answer to the Arguments of H. D. by him brought to prove Justification before Faith, i.e. before the act of Believing’, pp. 32-33 Bedford and Ambrose were sharing some notes one way or the other.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Actually%2C+in+himself+is+man+said+to+be+justified%2C+when+he+has+the+possession+of+it%3A+But+this+actual+justification+has+its+degrees+of+progression.+The+beginning+thereof+is+laid+in+our+first+union+and+incorporation+into+Christ%3A+The+consummation+of+it+is+not+till+the+Judge+at+the+latter+day+has+solemnly+pronounced+the+sentence+of+final+absolution%2C+and+so+set+us+in+full+possession+of+entire+remission.+Between+both+these+there+is+a+progressive+work+of+justification%2C+by+the+constant+actings+of+the+Spirit+applying+the+blood+of+Christ%2C+by+the+hand+of+faith%2C+to+the+quiet+and+comfort+of+the+soul.+The+first+you+may+term+initial+justification%2C+the+latter+perfective%2C+and+this+between+I+would+call+progressive%2C+it+is+the+fruit+of+the+first+and+the+preludial+assurance+of+the+latter%3A+This+is+wrought+and+sealed+in+the+second+sacrament+%5Bthe+Supper%5D%2C+as+the+former+is+in+the+first+sacrament+%5Bbaptism%5D%3A+and+both+these+branches+of+sacramental+justification+are+to+us+the+pre-assurance+of+that+complemental+and+perfective+justification%3B+The+sentence+whereof+puts+an+end+to+all+fears%2C+changing+our+faith+and+hope+into+fruition+and+full+possession%3B+even+the+first+of+these+acts+is+not+transacted+without+the+seed+and+spirit+of+faith%2C+much+less+the+successive+agitations%2C+and+progress+of+the+work.+Thus+every+way+faith+is+considered+as+equal+with%2C+yea+as+foregoing+the+work+of+justification.%E2%80%9D%0A%0A%E2%80%94+Thomas+Bedford%2C+An+Examination+of+the+Chief+Points+of+Antinomianism%E2%80%A6+%28London%3A+Field%2C+1647%29%2C+ch.+3%2C+%E2%80%98A+Brief+Answer+to+the+Arguments+of+H.+D.+by+him+brought+to+prove+Justification+before+Faith%2C+i.e.+before+the+act+of+Believing%E2%80%99%2C+pp.+32-33+Bedford+and+Ambrose+were+sharing+some+notes+one+way+or+the+other.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb9a80134c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb9a80134c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=3.%20Actually%2C%20in%20himself%20is%20man,as%20foregoing%20the%20work%20of%20justification&amp;text=3.%20Actually%2C%20in%20himself%20is%20man%20said%20to&amp;text=with%2C%20yea%20as%20foregoing%20the%20work%20of%20justification" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>To speak of complete, perfect justification of the law before God, such as that which angels have and men who are saved will have in eternity, is to speak of justification as conformity with God, which is as much to say, with God’s law; for God is thus as He gives Himself to be known in the law. This perfect justification in eternity means God Himself is in the saved [seligen]. As St. Paul says, “God will be all in all” [cf. 1 Cor. 15:28; 12:6; Col. 3:11], that is, God Himself is in the saved, and makes them like Himself, so that they are entirely pure, without sin. As John says, ‘We will be like Him’ [1 Jn. 3:2]. St. Paul speaks about this complete and perfect justification in Gal. 5:5, ‘For through the Spirit, by faith, we wait for the hope of righteousness.’ Although in this mortal life believers have a spark, the gospel nevertheless preaches to us the justification of Christ, of the Mediator between God and us, and says that the Mediator’s entire obedience, from his Incarnation until the Resurrection, is the true justification which is pleasing to God, and is the merit for us. God forgives us our sins, and accepted us, in that He imputes righteousness to us for the sake of the Son, although we are still weak and sinful. We must, however, accept this imputed righteousness with faith.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-882295aa8e" data-kw="">
<blockquote><p>The Dutch superintendens are as like to English bishops as an emperor in the days of Fabius Maximus, when the senate ruled all, to an emperor in the days of Tiberius or Nero, when an absolute prince, I will not say a tyrant, did govern all at his pleasure. The name is one, but the things are essentially different, and so far distant as the East is from the West.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Historical Vindication of the Government of the Church of Scotland… (1646)</cite>, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-94c6016077" data-kw="">
<blockquote><p>In England it [civilly] belongs: 1. to the patron to present; 2. to the bishop to ordain and institute, and therefore to approve and invest; 3. to the people jure divino to be free consenters; 4. and to the magistrate to protect and to judge who shall be protected or tolerated under him. If now these four parties be for four ministers or for three, or two several men, and cannot agree in one, the culpable dissenters will be the causes of the schism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), sect. 6</cite>, p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-45132bf9a3" data-kw="">
<blockquote><p>During the proceedings [of the general assembly of 1638] to ‘abjure and remove’ the bishops, it appears that Baillie’s dissent may have reflected the opinion of a large but silent minority.</p></blockquote>

</figure><figure class="quote" id="q-947e6d6c05" data-kw="">
<blockquote><p>Ordinary Ministers follow the form of the Church that is instituted; they are not Ecumenical, National, Provincial, or Diocesan Bishops, but Elders of one Congregation, who in the same sense are also called Bishops in the Scriptures. 29. Those transcendent members of the Hierarchy were merely human creations, brought into the Church without any Divine precept or example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology</cite>, 1.39.28–29</span></figcaption>

</figure><figure class="quote" id="q-8311056f2a" data-kw="">
<blockquote><p>The subordinate public judgment, which is extraordinary, is the judgement of a council, assembled for the more public and effectual establishment and declaration of one or more points of faith and heads of Christian doctrine, and that in opposition to all contrary heresy, or error, which is broached and set a foot in the Church. (M. Ant. De Dom. de Rep. Eccl., bk. 7, ch. 3, n. 32) From which council, no Christian man who is learned in the Scriptures may be excluded, but ought to be admitted to utter his judgement in the same. For in the indagation [investigation] or searching out of a matter of faith, they are not the persons of men which give authority to their sayings, but the reasons and documents which every one brings for his judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies… (1637), Pt. 3, ch. 8 | Digression 3, ‘Of the Judging of Controversies and Questions of Faith’</cite>, p. 176-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

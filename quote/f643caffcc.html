<main class="wrap"><figure class="quote" id="q-f643caffcc" data-kw="">
<blockquote><p>Q. 113. What are the sins forbidden in the third commandment? A. The sins forbidden in the third commandment are… all sinful cursings, oaths, vows, and lots;[r]… and misapplying of God’s decrees[x] and providences;[y] misinterpreting,[z] misapplying,[a] or any way perverting the word, or any part of it,[b] to profane jests,[c] curious or unprofitable questions, vain janglings, or the maintaining of false doctrines;[d] abusing it, the creatures… … [r] Esth. 3:7. Esth. 9:24. Ps. 22:18. [s] Ps. 24:4. Ezek 17:16,18,19. [t] Mark 6:26. 1 Sam. 25:22,32-34. [v] Rom. 9:14,19,20. [w] Deut. 29:29. [x] Rom. 3:5,7. Rom. 6:1,2. [y] Eccl. 8:11. Eccl. 9:3. Ps. 39. [z] Matt. 5:21-48. [a] Ezek. 13:22. [b] 2 Pet. 3:16. Matt. 22:24-31. [c] Isa. 22:13. Jer. 23:34,36,38. [d] 1 Tim. 1:4,6,7. 1 Tim. 6:4,5,20. 2 Tim. 2:14. Tit. 3:9…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

</figure><figure class="quote" id="q-f92399d50e" data-kw="against mental reservations">
<blockquote><p>Whether it is lawful to use ambiguous equivocations and mental reservations in oaths. We deny against the papists and especially the Jesuits. We do not speak of the rhetorical use of equivocations, nor of the logical use which often obtains in disputations. Rather we speak of the theological and moral use in giving testimony and in oaths, where truth and sincerity are required.</p></blockquote>

</figure><figure class="quote" id="q-c5973040cd" data-kw="">
<blockquote><p>Question: Is it simply unlawful to play for any money at all, the game being lawful? Answer: No; if the play be for a small matter, the loss whereof is no hurt to him that loses it, and if it be applied to a common good, and be bestowed in some honest meeting for the increase of love, then it is lawful: otherwise not.</p></blockquote>

</figure><figure class="quote" id="q-369bf50e10" data-kw="">
<blockquote><p>I beseech you consider, that if when an oath whose institution by God is to be the end of all strife [Heb. 6:16], shall have a natural tendency to the maintaining of strife, division and contention, to be the occasion of wars and commotions in the land of our nativity, to administer matter and occasion of jealousy in our superiors, that while we judge ourselves bound in conscience by an oath that we have taken to endeavour to alter and change the government, whether he will or no, there can be no safety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-lytler.html">Richard Lytler</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Presbyterian, humbly offering to the consideration of all pious and peaceable spirits several arguments for obedience to the Act for Uniformity</cite>, … (London: 1662), ch. 6, p. 47</span></figcaption>

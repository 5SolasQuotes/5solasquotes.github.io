<main class="wrap"><figure class="quote" id="q-ae4be707c2" data-kw="">
<blockquote><p>From the analogy and agreement between both, namely, circumcision and baptism; which the Apostle hints in this 2. of Colos. First the Apostle intimates that as putting off the body of sin (which is a phrase to signify natural death, 2 Cor. 5. and so is here an allusion to signify spiritual death to sin) is the signification of circumcision. Colos. 2.11. So spiritual burying (which argues death) is the signification of baptism.

Secondly, that as neither of these are assured to any but as having Christ sealed to them; so as circumcision sealed an implantation into the death of Christ, that he put off the body naturally in the grave; so the circumcised put off the body of sin spiritually; v. 11. Even so baptism signifies and seals our implantation into the burial of Christ, v. 12. as is more fully expressed, Rom. 6.3, 4, 5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A vindication of baptizing believers infants: In some animadversions upon Mr. Tombes his Exercitations about infant baptism; as also upon his Examen, as touching the antiquities and authors by him alleged or contradicted that concern the same. Humbly submitted to the judgement of all candid Christia</cite>, (London: M. Simmons, 1646), p. 29.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

ion-and-baptism-as-spiritual-signs/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-63893f005f" data-kw="">
<blockquote><p>The argument by which we prove the right of children to baptism is strictly analogous to that by which we prove the perpetual obligation of the Lord’s Day. The Anabaptist is compelled on that subject to adopt the same line of argument that we do on baptism. He goes back to the Old Testament Dispensation to find there the principle of one day’s rest after six days’ work, in the same way as we go back to find the principle of the church membership of infants. He finds that the principle of resting one day out of seven existed long before the law of Moses, though it was incorporated therein; just as we find the principle of infant church membership existing from the days of Abraham, though it was incorporated in the law given at Sinai 430 years after Abraham (Gal. iii. 17).

He finds that the law of the Sabbath was acknowledged by God’s people down till the coming of Christ; and we find that the law of the church membership of infants was acknowledged by them down till the same period. Finding nothing in the New Testament to set aside the principle of one day’s rest after six days’ work, he considers that the law of the Sabbath is still in force; exactly as we, finding nothing in the New Testament to set aside the principle of infant church membership, conclude that that portion of the Divine law is in full force still. He discovers, however, that the New Testament introduces a modification, in consequence of which he considers himself warranted in devoting the first clay of the week instead of the last to purposes of rest and worship: and we discover, too, that the New Testament introduces a modification, in consequence of which we consider ourselves warranted in recognising the church membership of infants by the ordinance of baptism, instead of by the ordinance of circumcision.

He maintains that the change from the seventh to the first day of the week does not interfere with the great unrepealed principle of one day’s rest after six days’ work, and he concludes, therefore, that the law of the Sabbath is a perpetual ordinance: and we maintain that the change of the initiatory rite from circumcision to baptism does not interfere with the great unrepealed principle of infant membership; and we conclude, therefore, that infant membership in the Church of God is a perpetual ordinance.

He insists that if men do not discover sufficient authority in the New Testament for the change of day, this does not free them from the law of the Sabbath, but binds them to keep it on the seventh day instead of the first and we insist that if men do not see sufficient authority in the New Testament for infant baptism, this does not free them from the law of infant church membership, but binds them to acknowledge that membership by circumcising instead of baptizing them. In short, the mode of proof is the same exactly in the one case as it is in the other.

So much is this the case, that that section of Anabaptists known as Plymouth Brethren, with admirable consistency, deny the perpetual obligation of the Sabbath as well as the church membership of infants. The ordinary Anabaptist shrinks from this; he holds by the Sabbath, and rejects infant baptism; and, strange to tell, the very same argument which, on the one subject, he thinks ought to convince everybody, he asserts, on the other subject, should convince nobody. The same proof that, in the one case, pleases him well, on the other does not please him at all. Prejudice, it is to be feared, warps the judgment of these good people even more than they themselves suspect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-witherow.html">Thomas Witherow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scriptural Baptism: Its Mode &amp; Subjects as opposed to the views of the Anabaptists</cite>, (Belfast: C. Aitchson, 1869), pp 50-52.</span></figcaption>

<blockquote><p>What fruit or profit cometh of the baptizing of infants? It serveth for the parents’ comfort, for the sign being committed to the child (as by a printed seal) doth confirm the promise made to the godly parent: that the Lord, will be a God, not to him only, but to his seed also.</p></blockquote>

</figure><figure class="quote" id="q-d42412a951" data-kw="baptism of heretics">
<blockquote><p>What has been said in general of the baptism of heretics ought to be applied in particular to the baptism of the Romanists. Although we think it ought to be retained in those who come from them to us because the essentials of baptism remain with them; still we deny that it can rightly be sought or received from them, as will be proved more fully when we come to that subject. Sixteenth Question Was John’s baptism essentially the same as Christ’s baptism? We affirm against the Romanists I. Although this question appears to be less necessary in our day, when no one is baptized except with that baptism which the apostles administered; yet because it is wont to be fiercely agitated by the Romanists, we must speak briefly concerning it, in order that the truth of the orthodox doctrine concerning baptism may be the better illustrated.</p></blockquote>

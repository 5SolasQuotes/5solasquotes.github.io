<main class="wrap"><figure class="quote" id="q-c2e7272f8a" data-kw="">
<blockquote><p>In midst of pointing to the Erastians that the logic of one of their arguments would require them to believe that the punishments of the judicial law remained valid (a view many Erastians rejected), George Gillespie, in an aside, pointed out that he sympathised with the English divines who held that the penal sanctions remained obligatory:

I know some divines hold that the judicial law of Moses, so far as concerneth the punishments of sins against the moral law, idolatry, blasphemy, Sabbath-breaking, adultery, theft, &amp;c., ought to be a rule to the Christian magistrate; and, for my part, I wish more respect were had to it, and that it were more consulted with. This is by the way.</p></blockquote>

<blockquote><p>Finally, it is to be noted that though in some things we may and do commendably refuse obedience to the laws of those whom God has set over us, yet are we ever obliged (and accordingly intend) still to subject ourselves unto them. For to be subject, does signify (as Zanchius shows [Commentary on Eph. 5, on Subject.]) to be placed under, to be subordinate, and so to give honor and reverence to him who is above, which may well stand without obedience to every one of his laws. Yea and Dr. Field [an Anglican] also tells us, that subjection is generally and absolutely required, where obedience is not.</p></blockquote>

<blockquote><p>closed with the Presbyterian in the beginning of the rebellion, took the [Solemn League &amp;] Covenant [1643], sided with the Independents, became a great creature of the long parliament by whose authority he was made tutor to James, Duke of York [would later be King James II], and an active person against his sovereign [King Charles I]”. Ascham was murdered by royalists in Spain. Wiki: “His first published work was A Discourse… This appeared in 1648, probably in July at the height of the political uncertainty engendered by the second Civil War. The previous month the Army had shown that it wielded both political and military power and Ascham’s Discourse was widely seen as a defense of the Army as the conquering power, and as a plea for “the rank of the people” to adopt a position of political quiescence. Parliament’s ultimate victory and the establishment of the Commonwealth posed a problem for those who felt unable to accept the legality of the new government but were now being required to give it their allegiance, and also for those who regarded their oath of allegiance to King Charles I… as a solemn oath to God that could not be broken. One argument, provided by a group of political theorists variously called the Engagers, or de facto theorists, was to argue that an individual could give their obedience to the de facto government in being simply because it was in power. For many such a theory was deeply shocking since it emphasized power at the expense of authority, and subordinated allegiance to self-interest. The debate was initiated by Francis Rous who published a brief pamphlet in April 1649 [The Lawfulness of Obeying the Present Government] in which he argued that allegiance could be given to the Commonwealth even though it were acknowledged to be an illegal power. It was a radical shift in the basis of the argument that was to be followed through by theorists engaged in the debate on de facto government. In the debate that followed Ascham played a major part in developing a theory of political obligation to the de facto power. In 1649 it is possible that he was author of a short anonymous pamphlet, A Combate between Two Seconds. One for Obeying the Present Government. The Other the second part of a Demurrer undeservedly called Religious, which was published in July. This work firstly took issue with those whose arguments continued to be based on Romans 13:1–2 and in particular addressed the arguments in an anonymous work that may have been published in two parts, but that is extant only in its second part entitled The Second Part of the Religious Demurrer; and secondly bypassed the critical emphasis on Romans 13:1–2 to develop arguments based on the need to protect oneself from chaos, as originally deployed by Ascham in his 1648 Discourse. Having thus entered the pamphlet “war”, Ascham then began to expand his arguments. He was certainly the author of a longer pamphlet, The Bounds and Bonds of Publique Obedience, which appeared in August 1649; and by November he had added nine chapters to his 1648 Discourse, which now appeared under the title Of the Confusions and Revolutions of Government. This work attracted the attention of Robert Sanderson who criticized it in a short and pungent pamphlet [Resolutions of Conscience (by a learned Divine) in answer to a letter sent with Mr. Ascham’s Book, Treating, How farre it may be lawful to submit to an Usurped Power.]. Ascham’s Reply to a paper of Dr. Sanderson’s, containing a censure of Mr. A. A. his book of the Confusions and Revolution of Government, which was published on 9 January 1650, was directed as much as against Edward Gee‘s Exercitation concerning usurped powers as against Sanderson’s work. In these works Ascham’s essential argument was that in a situation in which people had to look after their own safety, they were justified in giving their allegiance to any power that was capable of protecting them, whatever the legality of its title to power. By the autumn of 1649 the debate began to center on the specific question of the Oath of Allegiance and the Engagement to the Commonwealth: Two Acts of Parliament were passed requiring people to take an Oath of Allegiance to the Commonwealth, on 11/12 October 1649, and on 2 January 1650. Conventionally oaths were regarded as “the strictest ties and obligations that a man can be under”. For many the Engagement to the Commonwealth was impossible to take because it overrode their prior obligation to the monarchy (King Charles I and his heirs). The Presbyterian Richard Baxter held that he “could not judge it seemly for him that believed there is a God to play fast and loose with a dreadful oath”. (Reliquiae Baxterianae, London, 1696, p. 54) In contrast, Ascham argued that all oaths involved tacit conditions, of which the ability of the government to protect the people was the main one. A government that could not protect its people lost the right to their allegiance. Ascham’s 1648 Discourse was to be republished, anonymously, following the ousting of King James II [in 1688/9]. Then the question of the legality of the oath of allegiance to King William and Queen Mary [in the Glorious Revolution] had come to the fore. It did not, however, generate any discussion. By then the leading theorist in the field was Thomas Hobbes, whose De Corpore Politico, De Cive (first edition), and Leviathan, had systematized a coherent and secular defense of the contract as between ruler and ruled.</p></blockquote>

+in+April+1649+%5BThe+Lawfulness+of+Obeying+the+Present+Government%5D+in+which+he+argued+that+allegiance+could+be+given+to+the+Commonwealth+even+though+it+were+acknowledged+to+be+an+illegal+power.+It+was+a+radical+shift+in+the+basis+of+the+argument+that+was+to+be+followed+through+by+theorists+engaged+in+the+debate+on+de+facto+government.+In+the+debate+that+followed+Ascham+played+a+major+part+in+developing+a+theory+of+political+obligation+to+the+de+facto+power.+In+1649+it+is+possible+that+he+was+author+of+a+short+anonymous+pamphlet%2C+A+Combate+between+Two+Seconds.+One+for+Obeying+the+Present+Government.+The+Other+the+second+part+of+a+Demurrer+undeservedly+called+Religious%2C+which+was+published+in+July.+This+work+firstly+took+issue+with+those+whose+arguments+continued+to+be+based+on+Romans+13%3A1%E2%80%932+and+in+particular+addressed+the+arguments+in+an+anonymous+work+that+may+have+been+published+in+two+parts%2C+but+that+is+extant+only+in+its+second+part+entitled+The+Second+Part+of+the+Religious+Demurrer%3B+and+secondly+bypassed+the+critical+emphasis+on+Romans+13%3A1%E2%80%932+to+develop+arguments+based+on+the+need+to+protect+oneself+from+chaos%2C+as+originally+deployed+by+Ascham+in+his+1648+Discourse.+Having+thus+entered+the+pamphlet+%E2%80%9Cwar%E2%80%9D%2C+Ascham+then+began+to+expand+his+arguments.+He+was+certainly+the+author+of+a+longer+pamphlet%2C+The+Bounds+and+Bonds+of+Publique+Obedience%2C+which+appeared+in+August+1649%3B+and+by+November+he+had+added+nine+chapters+to+his+1648+Discourse%2C+which+now+appeared+under+the+title+Of+the+Confusions+and+Revolutions+of+Government.+This+work+attracted+the+attention+of+Robert+Sanderson+who+criticized+it+in+a+short+and+pungent+pamphlet+%5BResolutions+of+Conscience+%28by+a+learned+Divine%29+in+answer+to+a+letter+sent+with+Mr.+Ascham%E2%80%99s+Book%2C+Treating%2C+How+farre+it+may+be+lawful+to+submit+to+an+Usurped+Power.%5D.+Ascham%E2%80%99s+Reply+to+a+paper+of+Dr.+Sanderson%E2%80%99s%2C+containing+a+censure+of+Mr.+A.+A.+his+book+of+the+Confusions+and+Revolution+of+Government%2C+which+was+published+on+9+January+1650%2C+was+directed+as+much+as+against+Edward+Gee%E2%80%98s+Exercitation+concerning+usurped+powers+as+against+Sanderson%E2%80%99s+work.+In+these+works+Ascham%E2%80%99s+essential+argument+was+that+in+a+situation+in+which+people+had+to+look+after+their+own+safety%2C+they+were+justified+in+giving+their+allegiance+to+any+power+that+was+capable+of+protecting+them%2C+whatever+the+legality+of+its+title+to+power.+By+the+autumn+of+1649+the+debate+began+to+center+on+the+specific+question+of+the+Oath+of+Allegiance+and+the+Engagement+to+the+Commonwealth%3A+Two+Acts+of+Parliament+were+passed+requiring+people+to+take+an+Oath+of+Allegiance+to+the+Commonwealth%2C+on+11%2F12+October+1649%2C+and+on+2+January+1650.+Conventionally+oaths+were+regarded+as+%E2%80%9Cthe+strictest+ties+and+obligations+that+a+man+can+be+under%E2%80%9D.+For+many+the+Engagement+to+the+Commonwealth+was+impossible+to+take+because+it+overrode+their+prior+obligation+to+the+monarchy+%28King+Charles+I+and+his+heirs%29.+The+Presbyterian+Richard+Baxter+held+that+he+%E2%80%9Ccould+not+judge+it+seemly+for+him+that+believed+there+is+a+God+to+play+fast+and+loose+with+a+dreadful+oath%E2%80%9D.+%28Reliquiae+Baxterianae%2C+London%2C+1696%2C+p.+54%29+In+contrast%2C+Ascham+argued+that+all+oaths+involved+tacit+conditions%2C+of+which+the+ability+of+the+government+to+protect+the+people+was+the+main+one.+A+government+that+could+not+protect+its+people+lost+the+right+to+their+allegiance.+Ascham%E2%80%99s+1648+Discourse+was+to+be+republished%2C+anonymously%2C+following+the+ousting+of+King+James+II+%5Bin+1688%2F9%5D.+Then+the+question+of+the+legality+of+the+oath+of+allegiance+to+King+William+and+Queen+Mary+%5Bin+the+Glorious+Revolution%5D+had+come+to+the+fore.+It+did+not%2C+however%2C+generate+any+discussion.+By+then+the+leading+theorist+in+the+field+was+Thomas+Hobbes%2C+whose+De+Corpore+Politico%2C+De+Cive+%28first+edition%29%2C+and+Leviathan%2C+had+systematized+a+coherent+and+secular+defense+of+the+contract+as+between+ruler+and+ruled.%E2%80%9D%0A%0A%E2%80%94+Anthony+Ascham%2C+A+Discourse%2C+%E2%80%A6+%28London%2C+1648%29+%7C+Ascham+%28c.+1614%E2%80%931650%29+was+a+was+a+reformed%2C+puritan%2C+British+academic%2C+political+theorist%2C+Parliamentarian+and+diplomat.+According+to+Anthony+Wood%2C+Ascham%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1aa6ad08b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1aa6ad08b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=closed%20with%20the%20Presbyterian%20in%20the,contract%20as%20between%20ruler%20and%20ruled&amp;text=closed%20with%20the%20Presbyterian%20in%20the%20beginning%20of&amp;text=of%20the%20contract%20as%20between%20ruler%20and%20ruled" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>9. The prime Positive Law of God is the Judicial Law, which God by the ministry of Moses, prescribed to the people of Israel, wherein the Lord was pleased to be the particular Lawgiver and Judge of that people, whom He had chosen from among all nations for a peculiar people to Himself, and to whose inclinations it is befitted. There are not a few who esteem the Judicial Law obliging unto all nations, mainly, because it does not appear in the Gospel, to be abolished as the Ceremonial Laws are, and because of its excellency beyond the laws of heathens, or other men, who might not only err in expediency, rendering their laws unprofitable, but also might make them unjust and inconsistent with the immutable moral Law of Nature; which reasons do sufficiently infer, that in the constitution of human laws, chief respect ought to be had to the Judicial Laws of God, and they assumed where the inclination of the people and their condition do not render them inconvenient. But that these laws were accommodat[ed] unto the Jews proper temper, is evident in the law concerning the bill of divorcement [Dt. 24:1-4], which bears, to be permitted for the hardness of their hearts; which was natural and peculiar to them, of jealousy and bitterness against their wives, therefore the Lord not only appointed trial, neither natural, necessary, nor accustomed elsewhere, by those tokens of virginity, for evidencing the wife’s unfaithfulness in not giving a polluted woman for a chaste [Dt. 22:14-20], but also the extraordinary and miraculous trial, by the water of jealousy [Num. 5:12-31], and therefore Christ did expressly abrogate that law [Mt. 5:31-32] and show us that Moses did not command to divorce, but for the hardness of their hearts only permitted it, and did command that when the husband would put away his wife, he should give her a bill of divorce, but it does not follow that the Judicial Law is in itself a Law to all nations, or that the Lord purposed it so to her, but on the contrair, it appears that his purpose was only to deliver it, for a peculiar Law to Israel, when He says, ‘What nation is so great that has statutes and judgments so righteous, as is all this Law, which I set before you this day,’ Dt. 4:8. And again ‘He shows his Word unto Jacob, his statutes and judgments to Israel, He has not dealt so with every nation, and as for his Judgments, they have not known them.’ Ps. 147:19 And therefore the same Law was not to Israelites and to strangers, even to proselytes; as appears in the matter of usury and bondage, which were allowed to strangers, but the former simply forbidden, and the latter limited as to Israelites: Neither is there any necessity of an express abolition of this Law in the Gospel, seeing it was not given to all nations; and it does yet bind the Jews so far as it does not build upon the Ceremonial Law: And therefore that part of the Judicial Law, which is founded upon, or conducible to the Moral Law may be well received by other nations, to whose inclination the same expediences will agree as most of the criminal laws are…</p></blockquote>

itted+it%2C+and+did+command+that+when+the+husband+would+put+away+his+wife%2C+he+should+give+her+a+bill+of+divorce%2C+but+it+does+not+follow+that+the+Judicial+Law+is+in+itself+a+Law+to+all+nations%2C+or+that+the+Lord+purposed+it+so+to+her%2C+but+on+the+contrair%2C+it+appears+that+his+purpose+was+only+to+deliver+it%2C+for+a+peculiar+Law+to+Israel%2C+when+He+says%2C+%E2%80%98What+nation+is+so+great+that+has+statutes+and+judgments+so+righteous%2C+as+is+all+this+Law%2C+which+I+set+before+you+this+day%2C%E2%80%99+Dt.+4%3A8.+And+again+%E2%80%98He+shows+his+Word+unto+Jacob%2C+his+statutes+and+judgments+to+Israel%2C+He+has+not+dealt+so+with+every+nation%2C+and+as+for+his+Judgments%2C+they+have+not+known+them.%E2%80%99+Ps.+147%3A19+And+therefore+the+same+Law+was+not+to+Israelites+and+to+strangers%2C+even+to+proselytes%3B+as+appears+in+the+matter+of+usury+and+bondage%2C+which+were+allowed+to+strangers%2C+but+the+former+simply+forbidden%2C+and+the+latter+limited+as+to+Israelites%3A+Neither+is+there+any+necessity+of+an+express+abolition+of+this+Law+in+the+Gospel%2C+seeing+it+was+not+given+to+all+nations%3B+and+it+does+yet+bind+the+Jews+so+far+as+it+does+not+build+upon+the+Ceremonial+Law%3A+And+therefore+that+part+of+the+Judicial+Law%2C+which+is+founded+upon%2C+or+conducible+to+the+Moral+Law+may+be+well+received+by+other+nations%2C+to+whose+inclination+the+same+expediences+will+agree+as+most+of+the+criminal+laws+are%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+James+Dalrymple%2C+The+Institutions+of+the+Law+of+Scotland%2C+vol.+1%2C+p.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16ee5f6fb3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16ee5f6fb3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=9.%20The%20prime%20Positive%20Law%20of,most%20of%20the%20criminal%20laws%20are&amp;text=9.%20The%20prime%20Positive%20Law%20of%20Go

<main class="wrap"><figure class="quote" id="q-6a02a3e32c" data-kw="">
<blockquote><p>And mutual consent, though but manifested by signs is a covenant. As if two dumb or deaf persons should make signs of their mutual consent to marry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Demonology &amp; Theology</cite>, … (London: Roycroft, 1650), ch. 4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a1d99a0d49" data-kw="">
<blockquote><p>…if I drew not up a fair contract of marriage betwixt you and Christ, if I went not with offers betwixt the bridegroom and you, and your conscience did bear you witness, your mouths confessed that there were many fair trysts and meetings drawn on betwixt Christ and you at communion-feasts and other occasions; there were bracelets, jewels, rings, and love-letters sent to you by the Bridegroom, it was told you what a fair dowry you should have and what a house your husband and ye should dwell in, and what was the bridegroom’s excellency, sweetness, might, power. The eternity, and glory of his Kingdom, the exceeding deepness of his love, who sought his black wife through pain, fires, shame, death and the grave; and swimmed the salt sea for her, undergoing the curse of the law, and then was made a curse for you, and you then consented and said, ‘Even so I take Him’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Joshua Redivivus, or Mr. Rutherford’s Letters</cite>, (1664) | To his Parishoners (2), p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-8edd371a20" data-kw="">
<blockquote><p>Lo, before ever there was father or mother or son in the world, God has appointed that the bonds betwixt husband and wife shall be more strait and indissoluble than betwixt the parent and child; and can any man be so unreasonable as to defend it lawful upon some unkind usages or thwartness of disposition, for a parent to abandon and forsake his child; or the son to cast off his parent? Much less therefore may it be thus betwixt an husband and wife: They two are one flesh. Behold here an union of God’s making: A man’s body is not more his own than his wife’s body is his: And will a man be content to part easily with a piece of himself? Or can we think that God will endure an union made by Himself to be slightly dissolved? Or how is this bodily matrimony a lively image of the spiritual marriage betwixt Christ and his Church (who has said, ‘I will betroth thee unto me forever; Yea I will betroth thee unto me in righteousness and in judgment, and in loving kindness, and in mercies,’ Hos. 2:19), if upon small occasions it may be subject to utter dissolution? Yea, what speak I of divinity? Even modest heathens would hiss this Libertinism off the stage…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, (London, 1654), 4th Decade, Case 2, ‘Whether Marriage Lawfully made may Admit of any Cause of Divorce, save only for the Violation of the Marriage Bed, by Fornication or Adultery?’, p. 303, pp. 303-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-0a69afd8a0" data-kw="">
<blockquote><p>The man comes from China acknowledging God in all his ways, as Abraham left his country, Gen. 12; if he be an idolater, they should not lodge him, 2 Jn. 10; he comes not as indifferent to be married to this or this church, or to none at all, as a man sins not if he marry none at all, 1 Cor. 7, but if he be a professor that joins to no church, he lives scandalously; therefore the adequate cause of membership, or to this membership, is not mutual consent, as in marriage…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 3, ch. 1, p. 283</span></figcaption>

</figure><figure class="quote" id="q-ad4c6f2e3d" data-kw="">
<blockquote><p>The godly man will remember that the peace between God and us was made by way of contract, whereby God gives Himself to us in his Son, and we give ourselves to Him. If then any refuse to give himself to God, there is no contract, God will not give Himself to him, and so no peace, for every contract must be mutual. When the one party offers to sign and seal, and the other refuses it, there is no agreement… For, since this covenant is often termed in Scripture a marriage, our soul which is the spouse of Christ must give herself to him as Christ gives Himself to her, else the marriage is void, for it is the mutual consent that makes the marriage.</p></blockquote>

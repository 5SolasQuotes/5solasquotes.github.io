<main class="wrap"><figure class="quote" id="q-35317a98cc" data-kw="">
<blockquote><p>These things, beloved, we write unto you, not merely to admonish you of your duty, but also to remind ourselves. For we are struggling on the same arena, and the same conflict is assigned to both of us. Wherefore let us give up vain and fruitless cares, and approach to the glorious and venerable rule of our holy calling.

Let us attend to what is good, pleasing, and acceptable in the sight of Him who formed us. Let us look steadfastly to the blood of Christ, and see how precious that blood is to God, which, having been shed for our salvation, has set the grace of repentance before the whole world.

Let us turn to every age that has passed, and learn that, from generation to generation, the Lord has granted a place of repentance to all such as would be converted unto Him. Noah preached repentance, and as many as listened to him were saved. Jonah proclaimed destruction to the Ninevites; but they, repenting of their sins, propitiated God by prayer, and obtained salvation, although they were aliens [to the covenant] of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Epistle to the Corinthians</cite>, (90), 7 in Ante-Nicene Fathers, 1: 7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-19f84a4aaa" data-kw="">
<blockquote><p>That repentance and faith are both essential to the attainment of eternal life. Though this has speculatively, it has not practically, been assented to by many professing Christians. Some have attached a high importance to repentance, but have at the same time almost entirely overlooked the necessity of faith. They think that if a man refrain from vicious habits, and be humane, charitable, just, and sober, he has attained the great end of all religion — he is a good man, and therefore must be held to be a good Christian; and they not unfrequently look upon and speak of those who attach a special importance to faith in Christ, as enthusiasts and visionaries, and sometimes go the length of representing them as favouring the doctrine that man may sin that grace may abound.

Others, again, have attached a high importance to faith in Christ; but at the same time have forgotten the equally high importance which belongs to repentance. They think that if a man believe the gospel, and entertain a zealous attachment to a sound creed, he must be a true Christian; and they not unfrequently look on those who insist on the necessity of repentance and good works as persons destitute of evangelical views, ignorant of the truth, attached to legal doctrine, and going about to establish their own righteousness.

Both these classes of persons proceed on erroneous principles — on partial views of the subject. The Holy Scriptures, from which alone we derive our knowledge of it, do not authorize them to give any such preference to the one grace or to the other, and far less to indulge in mutual, uncandid animadversions. A very slight acquaintance with the Scriptures may make any candid man perceive that both are equally essential, though not in the same sense.

A man without repentance, which is the principle or seed of holiness, is dead in trespasses and sins, and therefore incapable of enjoying heaven. And a man without faith, which is the uniting bond with the Saviour, is under condemnation, and has no title to the enjoyment of heaven. A well-informed Christian knows that that is truth. An experienced Christian feels that it is truth. He is not more assured that without holiness no man shall see the Lord, than that to be saved he must believe in the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-aird-thomson.html">William Aird Thomson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Necessity of Testifying Repentance Toward God, and Faith Toward our Lord Jesus Christ, to the Faithful Preaching of the Gospel in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-601138bbb8" data-kw="">
<blockquote><p>Referring to the proposition contained in the so-called “Auchterarder Creed” (condemned by the General Assembly in 1717) that subsequently gave rise to the Marrow controversy in the Church of Scotland, the younger Thomas McCrie made the following remarks:

The Presbytery of Auchterarder had refused Mr William Craig, a preacher, an extract of his licence, because, on being interrogated, he refused to subscribe the following article: — “I believe that it is not sound and orthodox to teach that we must forsake sin in order to our coming to Christ, and instating us in covenant with God.”

The article was no doubt unhappily worded. Every sinner ought surely to be taught to forsake sin, and no sinner can come to Christ but in the way of forsaking it. But the meaning of the good men of Auchterarder Presbytery was very apparent; they meant to guard against that legal strain of preaching which insists on repentance as an indispensable condition to qualify the sinner for coming to Christ. The real truth is beyond all contravention.

Repentance, which is first in the call of the gospel, is last in the obedience of the sinner; and though God begins by inviting ” the wicked to forsake his way, and the unrighteous man his thoughts,” well does he know that not one of them will move a step till the words that follow ring in his ears, and meet the response of faith, “For he will have mercy, and will abundantly pardon.” To lead the sinner directly to the Saviour, to Him who alone can “give repentance and remission of sins,” must be obviously the ultimate aim of the gospel minister, even when he calls upon him to forsake his sins.

In this lay the germ of the whole controversy that followed. We suspect this Mr William Craig must have been a mere tool in the hands of others, and an incipient legalist withal, who would soon grow up into a full-blown Arminian. Be this as it may, the Assembly, on hearing the case, held up their hands in absolute horror, and ” declared their abhorrence of the foresaid proposition as unsound and most detestable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Marrow Controversy: with Notices of the State of Scottish Theology in the beginning of the last century’, British and Foreign Evangelical Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/nature-of-repentance.html">Nature of Repentance</a></span></div>

</figure><figure class="quote" id="q-8c39e5d64b" data-kw="">
<blockquote><p>…the acknowledging of sins does not of itself obtain grace or forgiveness of sins, even as the bare acknowledging of a disease is not the remedy for the same: for even damned men also do acknowledge their sins, and yet are not therefore healed. The acknowledging of sin is a certain preparative unto faith, as the acknowledging of a disease does minister occasion to think upon a remedy. To this at this present we add that not the very fear of God, how sincere soever it be, not the very sorrow conceived for our sins, how great soever it be, nor the very humiliation, how submiss soever it be, do of themselves make us acceptable to God: but rather that they prepare an entrance and make a way for us unto the knowledge of Christ, and so consequently do lead us to Christ Himself being incarnate and crucified for us and our redemption, and lay us upon Christ alone, by Him to be quickened and purely cleansed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, ed. Thomas Harding (1549; Cambridge: Parker Society, 1850), vol. 3, 4th Decade, 2nd Sermon, ‘Of Repentance &amp; the Causes thereof…’, pp. 62-63</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…the acknowledging of sins does not of itself obtain grace or forgiveness of sins, even as the bare acknowledging of a disease is not the remedy for the same: for even damned men also do acknowledge their sins, and yet are not therefore healed. The acknowledging of sin is a certain preparative unto faith, as the acknowledging of a disease does minister occasion to think upon a remedy. To this at this present we add that not the very fear of God, how sincere soever it be, not the very sorrow conceived for our sins, how great soever it be, nor the very humiliation, how submiss soever it be, do of themselves make us acceptable to God: but rather that they prepare an entrance and make a way for us unto the knowledge of Christ, and so consequently do lead us to Christ Himself being incarnate and crucified for us and our redemption, and lay us upon Christ alone, by Him to be quickened and purely cleansed.”

— Heinrich Bullinger, The Decades, ed. Thomas Harding (1549; Cambridge: Parker Society, 1850), vol. 3, 4th Decade, 2nd Sermon, ‘Of Repentance &amp; the Causes thereof…’, pp. 62-63">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+acknowledging+of+sins+does+not+of+itself+obtain+grace+or+forgiveness+of+sins%2C+even+as+the+bare+acknowledging+of+a+disease+is+not+the+remedy+for+the+same%3A+for+even+damned+men+also+do+acknowledge+their+sins%2C+and+yet+are+not+therefore+healed.+The+acknowledging+of+sin+is+a+certain+preparative+unto+faith%2C+as+the+acknowledging+of+a+disease+does+minister+occasion+to+think+upon+a+remedy.+To+this+at+this+present+we+add+that+not+the+very+fear+of+God%2C+how+sincere+soever+it+be%2C+not+the+very+sorrow+conceived+for+our+sins%2C+how+great+soever+it+be%2C+nor+the+very+humiliation%2C+how+submiss+soever+it+be%2C+do+of+themselves+make+us+acceptable+to+God%3A+but+rather+that+they+prepare+an+entrance+and+make+a+way+for+us+unto+the+knowledge+of+Christ%2C+and+so+consequently+do+lead+us+to+Christ+Himself+being+incarnate+and+crucified+for+us+and+our+redemption%2C+and+lay+us+upon+Christ+alone%2C+by+Him+to+be+quickened+and+purely+cleansed.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Decades%2C+ed.+Thomas+Harding+%281549%3B+Cambridge%3A+Parker+Society%2C+1850%29%2C+vol.+3%2C+4th+Decade%2C+2nd+Sermon%2C+%E2%80%98Of+Repentance+%26+the+Causes+thereof%E2%80%A6%E2%80%99%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c39e5d64b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c39e5d64b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-preparation-unto-salvation/#:~:text=the%20acknowledging%20of%20sins%20does%20not,to%20be%20quickened%20and%20purely%20cleansed&amp;text=the%20acknowledging%20of%20sins%20does%20not%20of%20itself&amp;text=by%20Him%20to%20be%20quickened%20and%20purely%20cleansed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-29968d7c8a" data-kw="">
<blockquote><p>The first step to true and sound repentance is to be wounded and disquieted in our hearts for sin, until our souls be pierced, and as it were struck through with the feeling of our corruptions, and of God’s displeasure, due unto us for the same, we have not made any entrance into the ways of godliness, nor laid the very foundation of the works of conversion, therefore the Prophet Joel exhorting the Israelites to repentance, biddeth them, rent their hearts: that is, the first stone that must be laid in this building: their hearts must be crushed and broken, for the wickedness committed against the Majesty of God; till then there is no turning unto him: one may as well bid a prisoner that is in strong hold, and hath bolts and fetters upon his heels, walk abroad and take the fresh air, and not remain any longer in that dark &amp; loathsome dungeon, as bid one that hath not his heart crushed &amp; humbled to turn unto the Lord: alas he is held fast in the chains of Satan, and cannot stir one foot to God-ward; therefore is it noted in those converts, Act. 2. 37. that They were pricked in their hearts] when they began the work of repentance, the rebukes of God had wakened their drowsy consciences, so that they saw their sins and God’s vengeance due unto them, and the words of Peter had gone through their hearts, even as a two edged sword, and then they were fit to bee soundly healed and comforted, when they had been pierced, and thoroughly wounded by the Arrows of God.

1 First, till the heart be broken for sin, there can be no plain confession of sin, and therefore no repentance. Men naturally are like wild Ass-Colts, nothing will work upon them, nor bring them unto any good frame or order; though they hear often of their faults, they will not acknowledge them, but be still unruly and untamed, as Paul was before his conversion; so long as he was heart-whole in his own conceit, though he had heard many excellent Sermons (no doubt,) yet he was like a beast still, never bewailing nor confessing his grievous offences, till the Lord had taken him down, and thoroughly mastered him.

2 Nay further, men are so far from taking pains to come to a true acknowledgement of their iniquities, till such time as there is a breach made into their hearts by godly sorrow, they do not so much as desire to be delivered from them, nor make any reckoning of God’s mercy for the pardoning of them: till such time as they become mourners for sin, they cannot possibly hunger and thirst after righteousness. And indeed what reason is there that they should esteem of that medicine which will cure, when they do not feel themselves to be sick? they think it a matter worth the looking after, to be freed from poverty, from infamy, from the pestilence, &amp;c. but as for the corruptions of their nature, and the sinfulness of their ways, they were never much troubled with them, and therefore they make little account to be delivered from them.</p></blockquote>

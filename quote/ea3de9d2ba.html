<main class="wrap"><figure class="quote" id="q-ea3de9d2ba" data-kw="">
<blockquote><p>As Emmanuel, he honoured the Sabbath, and consecrated it anew. By his glorious resurrection, at the completion of his second creation, in view of which it may be said that the first had no glory, by “reason of the glory that excelleth,” he re-enacted the law of the Sabbath, and fortified it by the most sublime and overpowering sanctions. And thus it became his anew and afresh. “All things were given to him then in heaven and in earth,” and then did he acquire a right and a power to wield all things for his people’s good and his enemies’ destruction, more glorious than he ever had before. And most assuredly, among “the all things in heaven and in earth,” the Sabbath, which, as it were, descends from heaven and alights on earth, so partaking of the character of both, holds a most conspicuous place.

As Son of Man he acquired a lordship over the Sabbath; and while this enhances his people’s safety here and glory hereafter, it awfully provides for the condemnation of his impenitent foes. And how terribly, and we might say, how easily, will he draw from it this most awful consequent. “All authority will be given to him to execute judgment, because he is the Son of Man;” and he will not forget, as an instrument in his judgments, the very Sabbath over which, for this same reason also – namely, that he is the Son of Man – he obtained this mysterious lordship. He will draw it forth from the elements of a forgotten history. The Sabbath, at the command of Christ, and reverencing the lordship which the Son of Man claims over it, will stand forth as accuser of his enemies.

They may plead that “they were very much immersed in this world’s cares and labours; – in the sweat of their brow they had to earn their bread; – time was not found by them to examine and accord to him the claims which, while they were in the flesh, Christ put in for their love and service; – their daily wants engrossed the labour of their hands; – the claims of their children occupied their thoughts; – and the short span of three score years and ten ran on with rapid flight, and there was not time for God to be in all their thoughts.” Ah! But what have they to answer to the silent witness which stands ready to record his testimony against them – the holy Sabbath! The holy Sabbath regularly came to them – the day of rest, expressly made for man, gave him liberty and rest from all his worldly cares. Granted that the world’s bustle and continual din of business, and rapid flight of ever-changing scenes, hurried away men’s thoughts from God – the Sabbath, in its weekly visit, brought with it a peace and a freedom from them all.

The morning of the blessed Sabbath came always to them, with its stillness and its hushed silence, and by that very silence spoke more loudly than words of the God whom, for six busy days at least, they had entirely forgotten. They complained of labour; but the Sabbath proclaimed their freedom from it. They complained of noise and agitation; but the Sabbath brought its quiet and stillness. They complained of the distractions of the world; but the Sabbath protruded on them – forced on their attention the things of God. Ah! what shall the answer be? “Every mouth shall be stopped,” and the holy Sabbath, which was given as a means of their salvation, in very proportion to the glory to which it offered to advance them, will loudly proclaim and irretrievably seal their utter condemnation, and visibly represent Jesus as clear when he judgeth, and justified when he speaketh forth their doom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath made for Man: A Sermon Preached in the Free Church, Panbride, on February 2, 1845. In Accordance with the Recommendation of the General Assembly</cite>, (Dundee: McCosh, 1845), pp 11-12.</span></figcaption>

<blockquote><p>Why the Church is called a temple it is not difficult to perceive. It is so called in allusion to the sacred edifice, which, by Divine command, was erected in Jerusalem. That edifice was dedicated to the service of God, and so are all those who believe in Jesus. They feel that they are not their own, and they are taught to glorify God in their bodies and in their spirits, which are his. In the Jewish temple, the Lord was pleased to reveal his glory; and so he does in the Church, but more spiritually and more fully. He manifests himself to all that love and serve him. While the eyes of other men are darkened by the influence of sin, their eyes are opened to discern the Divine glory in the face of Jesus Christ.

The Jewish temple was regarded as God’s residence, for the visible emblem of his glory dwelt between the cherubims. And is not his life-giving presence with his Church on earth? Has he not promised to be always with his people? In the one temple were observed the rites which he was pleased to institute; in the other, he is worshipped in spirit and truth. The world withholds from him its homage. Every unbeliever does so, whether outwardly connected with the Church or not. Those only who believe with the heart unto righteousness are his true worshippers. It is the Church which they constitute, that offers up to him the sacrifices of righteousness, and the grateful incense of praise and supplication. Most fitly, then, is it styled “the temple of the Lord.”

Now, of this temple Jesus is the builder. Before a structure can be reared, the foundation must be laid; and Christ has laid the foundation of his Church. He virtually laid it in the counsels of eternity, when he undertook to accomplish the work of our redemption; and he actually laid it in the fulness of time, when he obeyed and suffered in our stead. He is himself the rock on which his Church is built; and on what other foundation could the temple of the Lord have stood unshaken and secure? Not on a foundation laid by man; for that, like man himself, would have been unstable as the sand. Not on a foundation laid by angels; for that, being the work of creatures, could have had no virtue in itself to sustain the interests of a ruined world.

None but Immanuel, God in our nature, could sustain this mighty load. What the strength of all creatures could never have achieved, he graciously undertook and accomplished to the full, although the work subjected him to humiliation and to suffering intense beyond conception. He satisfied the claims of eternal justice, and is therefore able to save unto the uttermost. O what cause of joy that the foundation laid in Zion is so firm and sure! No power in the universe can shake it; for it is laid by him who has all power in heaven and on earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-couper.html">David Couper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ, the Builder and Ruler of the Temple in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>The third matter to be noted in this [fourth] commandment is the added incentives. These are three in number.

(1) There is the example of God. God has created man after His image. This holy disposition of soul must also be manifested by man‘s deeds, and when he is thus active, he must be engaged in harmony with both God‘s commandment as well as His example. “Be ye therefore followers of God, as dear children” (Eph 5:1). God, after being engaged in the work of creation for six days, rested upon the seventh day, and by so doing has designated this as an example to be followed. Man must be motivated by this to do likewise.

(2) The second incentive is taken from that which is to our benefit. “Therefore the Lord blessed the sabbath day.” This does not imply that inherent efficacy was bestowed upon this day in order to render it profitable to man. Rather, it is a promise of blessing made to the conscientious observers of that day; that is, the receipt of comfort, joy, and holiness for the soul, and to render the physical labour of the six workdays to be more prosperous and profitable. For everything is dependent upon the blessing of the Lord, and without this all our labour is in vain (Ps 127:1-2).

(3) The third incentive is derived from God’s command and the appropriateness of obedience to it. He hallowed it. The Lord has set this day apart for sacred usage in order that man may solemnly and uniformly glorify and serve Him with a holy rest. No one may therefore make this day a common day by using it as other days and spending it by working. Rather, according to God’s command, we must acknowledge it as having been set apart and spend it in a fashion which is consistent with the purpose for which God has set it apart and designated it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 142-43.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The third matter to be noted in this [fourth] commandment is the added incentives. These are three in number.

(1) There is the example of God. God has created man after His image. This holy disposition of soul must also be manifested by man‘s deeds, and when he is thus active, he must be engaged in harmony with both God‘s commandment as well as His example. “Be ye therefore followers of God, as dear children” (Eph 5:1). God, after being engaged in the work of creation for six days, rested upon the seventh day, and by so doing has designated this as an example to be followed. Man must be motivated by this to do likewise.

(2) The second incentive is taken from that which is to our benefit. “Therefore the Lord blessed the sabbath day.” This does not imply that inherent efficacy was bestowed upon this day in order to render it profitable to man. Rather, it is a promise of blessing made to the conscientious observers of that day; that is, the receipt of comfort, joy, and holiness for the soul, and to render the physical labour of the six workdays to be more prosperous and profitable. For everything is dependent upon the blessing of the Lord, and without this all our labour is in vain (Ps 127:1-2).

(3) The third incentive is derived from God’s command and the appropriateness of obedience to it. He hallowed it. The Lord has set this day apart for sacred usage in order that man may solemnly and uniformly glorify and serve Him with a holy rest. No one may therefore make this day a common day by using it as other days and spending it by working. Rather, according to God’s command, we must acknowledge it as having been set apart and spend it in a fashion which is consistent with the purpose for which God has set it apart and designated it.”

— Wilhelmus à Brakel, The Christian’s Reasonable Service, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 142-43.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+third+matter+to+be+noted+in+this+%5Bfourth%5D+commandment+is+the+added+incentives.+These+are+three+in+number.%0A%0A%281%29+There+is+the+example+of+God.+God+has+created+man+after+His+image.+This+holy+disposition+of+soul+must+also+be+manifested+by+man%E2%80%98s+deeds%2C+and+when+he+is+thus+active%2C+he+must+be+engaged+in+harmony+with+both+God%E2%80%98s+commandment+as+well+as+His+example.+%E2%80%9CBe+ye+therefore+followers+of+God%2C+as+dear+children%E2%80%9D+%28Eph+5%3A1%29.+God%2C+after+being+engaged+in+the+work+of+creation+for+six+days%2C+rested+upon+the+seventh+day%2C+and+by+so+doing+has+designated+this+as+an+example+to+be+followed.+Man+must+be+motivated+by+this+to+do+likewise.%0A%0A%282%29+The+second+incentive+is+taken+from+that+which+is+to+our+benefit.+%E2%80%9CTherefore+the+Lord+blessed+the+sabbath+day.%E2%80%9D+This+does+not+imply+that+inherent+efficacy+was+bestowed+upon+this+day+in+order+to+render+it+profitable+to+man.+Rather%2C+it+is+a+promise+of+blessing+made+to+the+conscientious+observers+of+that+day%3B+that+is%2C+the+receipt+of+comfort%2C+joy%2C+and+holiness+for+the+soul%2C+and+to+render+the+physical+labour+of+the+six+workdays+to+be+more+prosperous+and+profitable.+For+everything+is+dependent+upon+the+blessing+of+the+Lord%2C+and+without+this+all+our+labour+is+in+vain+%28Ps+127%3A1-2%29.%0A%0A%283%29+The+third+incentive+is+derived+from+God%E2%80%99s+command+and+the+appropriateness+of+obedience+to+it.+He+hallowed+it.+The+Lord+has+set+this+day+apart+for+sacred+usage+in+order+that+man+may+solemnly+and+uniformly+glorify+and+serve+Him+with+a+holy+rest.+No+one+may+therefore+make+this+day+a+common+day+by+using+it+as+other+days+and+spending+it+by+working.+Rather%2C+according+to+God%E2%80%99s+command%2C+we+must+acknowledge+it+as+having+been+set+apart+and+spend+it+in+a+fashion+which+is+consistent+with+the+purpose+for+which+God+has+set+it+apart+and+designated+it.%E2%80%9D%0A%0A%E2%80%94+Wilhelmus+%C3%A0+Brakel%2C+The+Christian%E2%80%99s+Reasonable+Service%2C+trans.+Bartel+Elshout%2C+ed.+Joel+R.+Beeke+%281700%3B+Grand+Rapids+MI%3A+Reformation+Heritage+Books%2C+1992%29%2C+3%3A+142-43.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fabb662af25.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/abb662af25.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/05/19/wilhelmus-a-brakel-on-incentives-to-sabbath-observance/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d2065f7484" data-kw="">
<blockquote><p>We must have songs not only honorable but also holy, which are to be like needles to arouse us to pray and praise God, to meditate on his works, in order to love him, fear, honor and glorify him. But what St. Augustine says is true, that no one can sing things worthy of God unless he has received them from Him. For when we have searched here and there, we will not find better songs nor ones more appropriate for this purpose than the Psalms of David, which the Holy Spirit has spoken to him and made. Therefore, when we sing them, we are certain that God has put the words in our mouth as if they themselves sang in us to exalt his glory. Consequently Chrysostom exhorts both men, women and little children to learn to sing them in order that they may be like a meditation to associate them with the company of angels (Chrysostom, In Ps. 41:1,2). Besides, we must remember what St. Paul says, that spiritual songs cannot be better sung than from the heart (Eph. 5:19; Col. 3:16). But the heart requires understanding. And in that (says St. Augustine) lies the difference between the singing of men and that of birds (Aug. Enarr. in Ps. 81, 2.1). For a Linnet, a Nightingale or a Popinjay will sing well, but it will be without understanding. But man’s proper gift is to sing, knowing what he says; after understanding must follow the heart and the affection, something that can only happen when we have the song imprinted on our memory never to cease singing it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Letter to the Reader’ in The Form of Prayers and Songs of the Church</cite>, (1543)</span></figcaption>

<blockquote><p>Q. 138, ‘How may we know the Fundamentals, Essentials, or what parts are necessary to Salvation? And is the Papists way allowable that (some of them) deny that distinction, and make the difference to be only in the degrees of men’s opportunities of knowledge?’ …And whereas they [Papists] would make all the parts of Christian faith and practice equally necessary, where men have a capacity and ability to know, believe and practice them, it is a gross deceit… And thereby they make all sins and errors as equal as all duties and truths (James 3:2; 1 John 1, end). Whereas:

1. There is no man that has not some error and some sin.

2. There is no man that does all that ever he was able to do to understand all the truth.

3. Therefore there is no man whose errors themselves are not (many of them at least) culpable or sinful.

4. And they that distinguish between mortal and venial sins, and yet will not distinguish between mortal and venial errors, are either blind or would keep others blind. As it is not so damning a sin for a man to think a vain thought, or to speak a vain word, as not to love God or holiness (no though he was more able to have forborne that idle word than to have loved God), so it is not so mortal a sin (that is, inconsistent with a justified state) to mistake in a small matter (as who was the Father of Arphaxad, or what year the world was drowned in, etc.) as to blaspheme the Holy Ghost or deny Jesus Christ to be the Savior of the world, or to deny that there is a God or everlasting life, or a difference between good and evil. All sins are not equal in magnitude or danger. Therefore all errors are not equal in magnitude sinfulness or danger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt. 3, Christian Ecclesiastics, p. 895</span></figcaption>

<blockquote><p>41. And indeed, God loves all his creatures, insofar as they are his creatures, but not with the same level of love. For he loves some in Christ, whom he chose in Christ from eternity according to the will of his good pleasure. He does not love the reprobate in the same way, whom nevertheless he does not damn as innocent, but on account of their voluntary wickedness and willful unbelief.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-5363ba0ffb" data-kw="">
<blockquote><p>[1] If you interpret it of his divine love, the difficulty will not be great; for there is a general and common love, and a special love. With the first, God loves all his creatures, especially mankind, and amongst them those that have any strictures of his image in them more than others. But then there is a special love, and so all those are saved whom God thus loves…. Now this will easily solve the matter; there was a general love, or a liking and approbation of those moral virtues and good things which He saw in him [the rich young ruler], but not that special love which brings grace and salvation along with it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 16, p. 457 on Mk. 10:21-23, “Then Jesus beholding him loved him, and said unto him… And he was sad at that saying, and went away grieved.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<blockquote><p>There is but one only living and true God, who is… most loving, gracious, merciful, long suffering, abundant in goodness and truth, forgiving iniquity, transgression and sin, the rewarder of them that diligently seek Him.</p></blockquote>

— William Shedd, Intro | Shedd below is commenting on WCF 2.1:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+but+one+only+living+and+true+God%2C+who+is%E2%80%A6+most+loving%2C+gracious%2C+merciful%2C+long+suffering%2C+abundant+in+goodness+and+truth%2C+forgiving+iniquity%2C+transgression+and+sin%2C+the+rewarder+of+them+that+diligently+seek+Him.%E2%80%9D%0A%0A%E2%80%94+William+Shedd%2C+Intro+%7C+Shedd+below+is+commenting+on+WCF+2.1%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8aa508301b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8aa508301b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/common-grace#:~:text=There%20is%20but%20one%20only%20living,of%20them%20that%20diligently%20seek%20Him&amp;text=There%20is%20but%20one%20only%20living%20and%20true&amp;text=the%20rewarder%20of%20them%20that%20diligently%20seek%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-519ad3ac82" data-kw="">
<blockquote><p>Secondly, It is not denied by the advocates of particular redemption, or of a limited atonement, that mankind in general, even those who ultimately perish, do derive some advantages or benefits from Christ’s death; and no position they hold requires them to deny this. They believe that important benefits have accrued to the whole human race from the death of Christ, and that in these benefits those who are finally impenitent and unbelieving partake… Many blessings flow to mankind at large from the death of Christ, collaterally and incidentally, in consequence of the relation in which men, viewed collectively, stand to each other. All these benefits were of course forseen by God, when He resolved to send His Son into the world; they were contemplated or designed by Him, as what men should receive and enjoy. They are to be regarded and received as bestowed by Him, and as thus unfolding His glory, indicating His character, and actually accomplishing His purposes; and they are to be viewed as coming to men through the channel of Christ’s mediation, of His sufferings and death. [There is a footnote to Witsius, Economy of the Covenants, Book 2, Ch. 9, Section 4] The truth of this position has been considered as affording some warrant for saying, in a vague and indefinite sense, that Christ died for all men; and in this sense, and on this account, some Calvinists have scrupled about meeting the position that Christ died for all men with a direct negative, as if they might thus be understood as denying that there was any sense in which all men derived benefit, and in which God intended that they should derive benefit from Christ’s death… The advocates of universal atonement, then, have no right to charge us with teaching that none derive any benefit from Christ’s death except those who are pardoned and saved; we do not teach this, and we are not bound in consistency to teach it. We teach the opposite of this; and we are not deterred from doing so by the fear lest we should thereby afford to those who are opposed to us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, (1863), vol. 2 | ‘Extent of Atonement &amp; Gospel Offer’, p. 332-334, 343-348</span></figcaption>

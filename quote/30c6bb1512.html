<blockquote><p>Thus, gratia Dei [the grace of God] is that perfection or attribute according to which God, out of a totally gracious and unmerited love, is conceived as willing to communicate himself to his creatures. (Rijssen, Summa Theol., III.xliii) Considered as affective, as ratione actus interni in Deo [a rule of the internal act in God], grace is a propensity of the divine will–while considered as effective it is the gifts of the Spirit graciously given to us by God, either the ordinary gifts of faith, hope, and love or the extraordinary gifts bestowed upon the church for its edification. (Rijssen, Summa theol., III.xliii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, p. 571</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-688db4ad07" data-kw="">
<blockquote><p>Thesis XII: The impulsive efficient [cause], that is, that because of which we have been chosen, is the benevolent disposition of the will of God, or the εὐδοκία, or good pleasure, of the divine will. Explanation: I. It is a question among us, the Lutherans, and the Papists: What moved or impelled God (it is permitted to us to make use of these words, which rather agree with the decrees of men, and are accommodated to our capacity: for properly speaking no impulsive cause of the divine will is granted, as we saw above) to decree to grant eternal life to certain men? We respond: That God was moved by no other thing to determine eternal life for certain ones, than by the benevolent disposition of His will, or His own good pleasure. There are principally two foundations of our opinion: (1.) Because the Scripture names this alone as the cause of election. Ephesians 1:5, He predestinated us, whom He would adopt as Sons through Jesus Christ unto Himself, according to the benevolent disposition of His own will…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), ‘Doctrine of Election’, pt. 1 Wendelin (1584-1652)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-c358548691" data-kw="">
<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-suarez.html">Francis Suarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Thomas, pt. 1, On the Divine Substance &amp; its Attributes, pp. 505-6 tr. AI in All the Works (d. 1617; Paris: Vives, 1855), vol. 1 Latin Suarez was a major Jesuit theologian.</cite></span></figcaption>

</figure><figure class="quote" id="q-a51d71ac82" data-kw="">
<blockquote><p>The second consideration which we would have the Christian to take along with him when he begins to study the mercy and love of God is this: know that it is natural and native for Him to love; justice is his strange act, Isa. 28:21, importing his great unwillingness to be much taken up in the exercise of that attribute of justice. If we would ask the question, What is God? we could have no answer so suitable and pertinent to it as that which He has given Himself, He is merciful and loving. It is his great design, and likewise his desire, to be taken up in his attribute of mercy… And we conceive, that which does eminently declare how much God delights in mercy, and how natural it is for Him to love, is this: that notwithstanding there was a strong and invincible impediment laid in the way of the exercise of the attribute of mercy (which if angels and men had attempted to have loosed, should eternally have crushed and depressed them into the lowest hell), yet love was not hindered in its exercise by this strong impediment. O blessed be that love, for it was strong; and that good will, for it was wonderful: that when there was such an impediment laid in the way, it did put wisdom in exercise to find out the way how it might exercise itself towards man without leaving an imputation on justice! It likewise put omnipotent power to exercise, that it might exercise the decrees of wisdom that were such a holy and divine restraint on the love of God; and before the curse was proclaimed towards man for the breach of his holy law, love did propose the way how that everlasting curse, which man by his own hand had wrapped about his own neck, might be taken away…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-gray.html">Andrew Gray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works… (d. 1656; Aberdeen: King, 1839)</cite>, pp. 455-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-533414df6f" data-kw="">
<blockquote><p>God shows here, by his prophet, that He was constrained by urgent necessity to deal sharply and roughly with the people. Nothing, we know, is more pleasing to God than to treat us kindly; for there is not found a father in the world who cherishes his children as tenderly: but we, being perverse, suffer Him not to follow the inclination of his nature. He is therefore constrained to put on, as it were, a new character, and to chide us severely, according to the way in which He here says, He had treated the Israelites; ‘I have cut them,’ He says, ‘by my prophets, and killed them by the words of my mouth.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hosea</cite>, 6:5</span></figcaption>

<blockquote><p>The late, great and general defection of this Church and kingdom;” and say, “It is also matter of lamentation that uder this great defection there has been too general a fainting, not only amongst professors of the Gospel, but also among ministers, yea, even amongst such who in the main thing did endeavor to maintain their integrity, in not giving seasonable and necessary testimony against the defections and evils of the time, and keeping a due distance from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-f6e533dfc7" data-kw="">
<blockquote><p>I alleging, what was wrong in the administration of our laws, either in church or state, is more through the default of some of the administrators, than either to the laws now in being, or yet to the supreme magistrate: from which I see I cannot state my sufferings upon anything amiss, although they are still grievous; neither can I have peace to refuse obedience to the civil magistrate in all things accoding to the Word of God. This my protesting, and refusing to join with them, enraged them exceedingly against me; and as their scourge of tongues was grievously bent against others, so now was it against myself, in a most grievous, unjust and unreasonable manner, and very hypocritically gave it out far and near… Thus I left that party of the dissenters who now commonly go under the name of Mr. M’Millan’s people; for the Quakers, Gibb’s faction, the Harlaw’s faction, and episcopacy by bishops, I had never any thing to do with them in matters of religion, neither directly nor indirectly; yea, my soul abhors all their evil ways: but I lieved retired by myself; all which time the Lord pitied me, and restored me to some measure of communion with Himself. Praise, praise. Amen…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-nisbet.html">James Nisbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Private Life of the Persecuted: or Memoirs of the First Years of James Nisbet, one of the Scottish Covenanters (Edinburgh: Oliphant, 1827)</cite>, pp. 237-38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

nism/#:~:text=I%20alleging%2C%20what%20was%20wrong%20in,communion%20with%20Himself.%20Praise%2C%20praise.%20Amen&amp;text=I%20alleging%2C%20what%20was%20wrong%20in%20the%20administration&amp;text=measure%20of%20communion%20with%20Himself.%20Praise%2C%20praise.%20Amen" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-94ed4154c0" data-kw="">
<blockquote><p>The pretext of Christian fellowship is abused, to the hatching and propagating of the most absurd opinions, when people turn light and frothy, taking up their time with vain janglings, and diverting from the main scope, to wit, edification: These things are indeed to be shunned; but Christian fellowship is not to be disclaimed, but wisely to be ordered in respect of the persons with whom, and occasions upon which it is used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

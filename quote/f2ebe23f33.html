<main class="wrap"><figure class="quote" id="q-f2ebe23f33" data-kw="">
<blockquote><p>The means whereby men may stir up their dull and heavy hearts, &amp; so prepare themselves to prayer, are three. The first is to read diligently the word of God, concerning those matters about which they are to pray: &amp; what then? This will be a means not only to direct him, but also to quicken the heart more fervently to deliver his prayer.

This is evident by a comparison. The beams of the sun descending, heat not before they come to the earth, or some solid body where they may reflect, and then by that means the earth and air adjoining is made hot: even so the Lord sends down unto us his blessed word, even as beams and the goodly sunshine, and thereby he speaks to our hearts: now when we make our prayers of that which we have read, God’s word is as it were reflected, and our hearts are thereby warmed with the comfortable heat of God’s Holy Spirit, to pour out our prayers to God more fervently.

The second means is to pray to God that he would strengthen us with his Spirit, that we might be able to pray as it is practised, Psal. 143.1. The third means is the consideration of God’s most glorious majesty, wherein he is willing; and secondly his omnipotence, whereby he is able to grant our requests.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Lord’s Prayer: In the way of Catechising, serving for Ignorant People</cite>, in The Work of William Perkins (Cambridge: John Legate, 1600), pp 530-31.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c2a030736" data-kw="">
<blockquote><p>Were there no more in praying but a communion with God, how sweet is it? When Christ prays, the ‘fashion of his countenance is changed,’ Lk. 9:29. There is a heaven in the bosom of prayer, though there were never a granting of the suit; sure there is a sin in making heaven a hire and in making duty a relative thing, a horse for a journey, a ship for a voyage to fetch home gold, where as there is heaven in praising God before the Throne, such as is both work and wages, and so in spiritual duties here.</p></blockquote>

</figure><figure class="quote" id="q-863ed91ebc" data-kw="family">
<blockquote><p>Just as one who truly and deeply loves any father of a family at the same time embraces his whole household with love and good will, so it becomes us in like measure to show to his people, to his family, and lastly, to his inheritance, the same zeal and affection that we have toward this Heavenly Father. For he so honored these as to call them the fullness of his only-begotten Son [Eph. 1:23]. Let the Christian man, then, conform his prayers to this rule in order that they may be in common and embrace all who are his brothers in Christ, not only those whom he at present sees and recognizes as such but all men who dwell on earth. For what God has determined concerning them is beyond our knowing except that it is no less godly than humane to wish and hope the best for them. Yet we ought to be drawn with a special affection to those, above others, of the household of faith, whom the apostle has particularly commended to us in everything [Gal. 6:10].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20</span></figcaption>

</figure><figure class="quote" id="q-c1e376a949" data-kw="">
<blockquote><p>Why then are the prayers of them that love and fear God so little effectual many times? The main cause is the wandering of their thoughts when they are about that holy duty. For it is no wonder that God granteth not what we ask when we think not what we ask. And it were a wonder if that Holiest of Holies, being spoken to without attention, did not resent so great a contempt which we would not use to our inferiors.

Since then the wandering of our thoughts is the cause of that great evil, what is the cause of that wandering? Indeed the prime cause is the incapacity of our low carnal nature to comprehend the infinite God; who being invisible and immaterial doth not help the mind with any image proportionate to the sense and imagination; without which it is very hard for the understanding to fix his thoughts. And that defect in our nature is made worse by this defect in our duty, that we make our addresses to God having not considered before what we are going about, what God is, and what we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-du-moulin.html">Peter Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A week of soliloquies and prayers. With a preparation for the Holy Communion</cite>, (London: H. Moseley, 1657), epistle dedicatory.</span></figcaption>

</figure><figure class="quote" id="q-fa98faef09" data-kw="">
<blockquote><p>Our Saviour Christ before this prayer gives this commandment: After this manner pray ye: whereby he would not bind those whom he teacheth to pray, unto this set number of words as unto a work done: for that were to babble indeed. And the Apostles themselves, as we may read in their acts, and epistles, often prayed in other words after the delivery and receiving of this form of prayer from our Saviour Christ.

And that which is the strongest proof, Mathew and Luke setting down this Lord’s prayer, do not curiously observe the self same words altogether. But our Saviour Christ in a short example would shew unto his disciples the manner howe to pray, according as his custom was to teach a general doctrine by propounding some particular example, where under the special we are to understand the general.

And therefore in this platform of prayer, his purpose is to shew, [I] how few and small a number of words we must use in prayer, contrary to the vain babbling of the Pharisees &amp; of the Heathen. [II] Who is to be called upon, or to whom we must direct our prayer: [III] with what confidence we must pray: [IV] how and for what causes: [V] what things we are to ask: [VI] in what order: [VII] by what mean: [VIII] and for what end.

And thus are all the principal points, which are required in true prayer, contained in this platform. So that it was both truly and finely said of Austin in an Epistle to Proba, we have liberty in praying to use other words so that we say the same things which this prayer containeth: but we have not liberty to say other, divers or contrary things. And this it is which Mathew saith, cap. 6. v. 9. thus, or after this manner pray ye. And that saying of Christ recorded by S. Luke 11. v. 2. when ye pray, say is all one with this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A substantial and Godly exposition of the prayer commonly called the Lord’s Prayer</cite>, (Cambridge: John Legate, 1598), pp 7-9.</span></figcaption>

y+ye.+And+that+saying+of+Christ+recorded+by+S.+Luke+11.+v.+2.+when+ye+pray%2C+say+is+all+one+with+this.%E2%80%9D%0A%0A%E2%80%94+Martin+Chemnitz%2C+A+substantial+and+Godly+exposition+of+the+prayer+commonly+called+the+Lord%E2%80%99s+Prayer%2C+%28Cambridge%3A+John+Legate%2C+1598%29%2C+pp+7-9.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa98faef09.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa98faef09.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/05/06/martin-chemnitz-on-the-lords-prayer-and-brevity/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

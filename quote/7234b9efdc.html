<blockquote><p>This Judicial Law is not accurately distinguished from the Moral Law and Natural Law, in this, that the Moral Law was published by God with his own voice, and twice written in Tables of stone and expressed in the Decalogue, but the Judicial Law without all this solemnity, was afterwards delivered to Moses, and by him to the people. For the Laws of restoring things lent or trusted, of just weights and measures, of paying the labourer his hire, and many such as these, not expressly set down in the Decalogue, are not more Judicial or less Moral, and natural than the Commandment, Thou shalt not steal. […] Those Laws therefore which are usually reckoned among the Judicial, and yet in their nature bear no singular respect to the condition of the Jews more than of any other people. Those are all of the Moral and Natural Law, which are common to all nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the power and cases thereof</cite>, (London, 1643), pp 108-09.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8ac8089445" data-kw="">
<blockquote><p>But I consider that there is a wide difference between the case of a congregation or society in which the right [of ladies to vote for ecclesiastical officers] had been recognized, at least tacitly and by practice, and the case of another congregation or society which had never recognized it, but had uniformly acted on a different principle. In the latter case, I would think it my duty to continue the common practice, not only because it had been the custom, but also because I looked on it as well-founded. And if any individuals should complain that they were denied their rights, I would say to them, ‘You are not denied any rights which were ever recognized in the body of which you are members; and provided you think that the right of election is too much circumscribed by its laws or usages, the least thing that is incumbent on you is, to wait until you can obtain a rectification of the supposed evil in a regular way, and, in the meantime, to show me and those whose province it is to authorize the alteration, that our present practice and mode of management is faulty and unscriptural.’ … It is generally allowed that when he refers to ‘nature itself’, he means to include custom, which is in many cases the best expounder of those principles and feelings which are natural to man, and recognized by those who are unenlightened by divine revelation; and by the manner in which he appeals to it, the apostle teaches us that there is a regard due to such dictates even in what relates to the Church; as we are taught by several places of the New Testament, that, from inadvertence or from other causes, Christians and Christian Churches may fall into opinions and practices, which those who had only nature’s dim lamp to guide them avoided.</p></blockquote>

<blockquote><p>Assertion 4. There may be some cases in which it is expedient to admit an accuser, and not to admit a process without one. As suppose one were under no ill report and yet some gross scandal were imputed to him, which were not of such fame, or had not such presumptions as to give ground for a Church-judicatory immediately to interpose, and the scandal being of such a nature as the trial thereof could neither be omitted, nor closed in private; in that case, suppose one should complain of the Church’s negligence in the same, asserting the evidences to be clear, and offering to make them out; In such a case, I say, the Church can hardly refuse to hear him, lest they be thought partial; nor is there ground, nor is it fit for them immediately to pursue it: Therefore an accuser is expedient, that so, upon the one side, the Church’s impartiality may be vindicated in refusing the complaint of no sober man, nor the uttermost of any trial, that in well grounded reason they may expect; And, on the other side, that the mouths of some needless and too importunate complainers may be stopped, and they themselves found censurable, if either without cause they traduce the Church-officers as negligent and partial, while there is access to make out before them such a truth if it be truth; or if precipitantly and inconsiderately (if not maliciously) they have tabled a scandal against another as a public scandal which they cannot make out, and so have needlessly troubled a Church-judicatory in such a matter and sinfully wronged their neighbor. For, a process in such cases where it cannot be made out, is scandalous: therefore if a person rest not satisfied so as to abstain till he have trial put to the utmost, he is to be dealt with as a scandalous person, lest men take liberty, under the pretext of pursuing offences, to defame others and abuse the ordinance of Christ. And though it be just in such a case, that he be materially dealt with as unjust accusers use to be in civil courts, yet this does not only flow from the consideration of such a persons being a formal accuser, but from the nature of the deed which is scandalous in such a measure, and that publicly, and therefore is to be restrained, whether the person take on him that formal consideration or not, lest yet, upon the matter, he continue publicly and importunately to press the pursuit. And we conceive, the imposing the title of accuser in such a case, or the making of it necessary, that one take on him that formal notion, is rather for conveniency to restrain men’s inordinateness and stop their mouths, and to add weight to the matter of the sentence if they fail, than as being simply necessary for making such a person to be accounted scandalous, if he come short.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland</cite>, … (Edinburgh, 1659), pt. 2, ch. 10, ‘Clearing whether in Church-processes an Accuser be always necessary’, pp. 120-21</span></figcaption>

<blockquote><p>These Judicial Laws were determinations of the Moral Law. A determination is either Iuris Divini [Divine law] or Humani [human]; these determinations in Moses’ Judicial Laws are Divini Juris; therefore they had greater force to bind the Jew, than any municpal law has to bind the subjects now, in respect they were given by God Himself, and these laws of men which draw nearest to them in equity, are most perfect; although particularly they cannot be fitted to every nation, no more than a shoe of one measure can serve for every foot. … Fourthly, the punishments inflicted by human laws are alterable: so were the punishments in Moses’ Judicial Law; therefore the Jews say of them, ascendunt et descendunt [ascending and desceding], which they understand, not of the greatest and highest transgressions, but of the middle sort of transgressions, which praecepta media, their middle precepts did forbid. Example, Ex. 21:29-36, If a man kept a pushing ox, knowing that he were wont [accustomed] to push, if he kill a man, then the Law ordains that the man shall die, or else to redeem himself with a sum of money; here the law ascended or descended: but if a man had willfully killed a man, that was praeceptum grave [a grave precept], the punishment neither ascended nor descended, but he was to die the death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Explication of the Judicial Laws of Moses</cite>, pp. 1-3</span></figcaption>

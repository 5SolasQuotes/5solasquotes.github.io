<main class="wrap"><figure class="quote" id="q-ed2682ea70" data-kw="">
<blockquote><p>There may indeed be a parting between man and wife upon other accounts [than adultery], either wholly or in part: in case one of them will part from the other, which the apostle determines, 1 Cor. 7:11,15, in which case the person departing is only guilty if he or she marry again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11</cite>, ch. 5, vv. 31-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2476d15112" data-kw="">
<blockquote><p>You will learn from our brother, master Butler, by what circumstances I am hindered and with whom I have to contend within these two days on the subject of divorce. In the commentaries¹ which I lately wrote on the decalogue, I allowed both to the man and his wife an equal liberty of divorce on account of adultery, if they are disposed to use that liberty which Christ has permitted in the gospel of his Church, where the marriage contract is dissolved by adultery. ¹ See a Declaration of the ten holy Commandments of Almighty God, in Hooper’s early writings, Parker Society edition. The passage here referred to will be found in pp. 378, 379, where Hooper complains of the uncharitable construction put upon it. My opponents allow the husband to divorce his wife by reason of adultery, and to marry another; but they do not allow the same liberty to the wife. In your next letter, as you love me, either confirm my opinion, or correct my error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Original Letters relative to the English Reformation</cite>, ed. Hastings Robinson for the Parker Society (Cambridge Univ. Press, 1846), vol. 1, Letter 32, Hooper to Bullinger, p. 64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-cd5710405d" data-kw="">
<blockquote><p>4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession [i.e. Lutherans] might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Ch. 22, An Act in favor of the Lutheran Brethren, p. 297</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<main class="wrap"><figure class="quote" id="q-88cb5fca24" data-kw="">
<blockquote><p>Objection 5… But sin unto death is sin against the Holy Spirit, as the Master [Peter Lombard] says…. Reply to Objection 5… so also among sins it is only those sins among mortal sins that are called “sins unto death” that, as far as they themselves go, are unforgivable. Therefore, sin is called “mortal” from the first death, but “unto death” because of the second death.” (Sentences, bk. 2, dist. 43, q. 1, art. 2; the ‘Exposition of the Text’ on this Distinction confirms this) For the Reformed: ‘That the Sin unto Death is the Same as the Sin Against the Holy Spirit’. . Disagreements What it is Thomas: “to sin through malice is to sin against the Holy Ghost.” (Summa, pt. 2 of 2, q. 14, art. 1) Turretin: “We say it is a universal apostasy from true Christianity or of the truth of the Gospel (of which one is convicted in his conscience); a total and persevering denial, hatred and resistance (whether sophistical or tyrannical) proceeding not from a common human weakness, but from special and deliberate wickedness and direct, diabolical hatred of it, joined with a contempt for all the means of salvation and final impenitency.” (1.647) Turretin’s view was the dominant view of the Reformed: ‘Of the Sin Against the Holy Spirit’. . Sin unto Death: Not to be Prayed for Thomas: “‘I do not say that anyone should pray for him.’ [1 Jn. 5:16]… then it must be understood in the sense that not just anyone should pray for such a sinner, since the conversion of these kinds of sinners is, as it were, miraculous. Hence just as not just anyone should pray for miracles to be performed, except great and holy men, neither should just anyone pray for the conversion of these kinds of sinners. Even so, according to the form of the words, it is not forbidden for there to be prayer for such a person.” (Sentences, bk. 2, dist. 43, ‘Exposition of the Text’) WCF 21.4: “Prayer is to be made for things lawful,[n] and for all sorts of men living… but not for… those of whom it may be known that they have sinned the sin unto death.[q] [n] 1 John 5:14 [q] 1 John 5:16</p></blockquote>

<blockquote><p>[see p. 75 of Wolter’s Summary]

68. When being is divided through contradictory attributes opposite to each other with respect to being, one of the dividing attributes belongs to a perfection in being and the other to imperfection. The reason is that one extreme of the disjunction formally involves the negation of the other. But both perfections cannot formally be perfections simply or pure perfections, because, from conclusion 62, pure perfections cannot formally exclude each other. Likewise, both extremes cannot formally be imperfections or mixed perfections, otherwise no being could be infinite (against conclusion 65). But a true disjunctive should include under one or other extreme every actual or potential being. Therefore one extreme is a perfection (a pure perfection) and the other an imperfection (a mixed perfection).

69. From this follows a general law of disjunction, namely that in disjunct properties of being, when the extreme that is less noble is posited of any being, the other more noble extreme can be deduced about some other being (see Scotus, Oxon. 1, d. 39, q. un, n. 13). The reason is that the one extreme involves imperfection and is therefore finite, while the other involves perfection simply, or pure perfection. But from conclusion 65, if something is finite, something else is infinite and has all pure perfections in the highest degree.</p></blockquote>

<blockquote><p>Questions of how the brain can a priori create its own goals and then find the appropriate search images in its memory banks are not well handled. The loss of the Cartesian pilot has left a large gap in the theory, because no one wants a homunculus, but no one has a replacement… Recognition of ‘dissipative structures’… of ‘macroscopic order parameters’… and of ‘positive entropic information flows’ by various authors writing on self-organization in chaotic systems has opened new avenues to pursue the age-old question of how goals and their derivative expectancies arise in brains. Proposed new answers are expressed in terms of “circular causality”… My aim in this essay is to compare the language used in the theory of dynamical systems to describe active perception in experimental animals with the language used by an eminent philosopher [Aquinas] to describe the process in humans.</p></blockquote>

<blockquote><p>…to take a simple bodily action as an example, the intellect and will constitute the formal-cum-final cause of the action, of which the firing of the neurons, flexing of the muscles, and so on are the material-cum-efficient causes. That it is a bodily action is due to its matter and the way the bodily parts interact; that it is a bodily action with a certain specific end in view (rather than an involuntary reflex or an unconscious robotic movement) is due to its form and final cause. There are not (as there are for the Cartesian dualist) two substances with events going on in each that are somehow mysteriously correlated. There is one substance and one set of events having both formal and material, and final- and efficient-causal components.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…to take a simple bodily action as an example, the intellect and will constitute the formal-cum-final cause of the action, of which the firing of the neurons, flexing of the muscles, and so on are the material-cum-efficient causes. That it is a bodily action is due to its matter and the way the bodily parts interact; that it is a bodily action with a certain specific end in view (rather than an involuntary reflex or an unconscious robotic movement) is due to its form and final cause. There are not (as there are for the Cartesian dualist) two substances with events going on in each that are somehow mysteriously correlated. There is one substance and one set of events having both formal and material, and final- and efficient-causal components.”

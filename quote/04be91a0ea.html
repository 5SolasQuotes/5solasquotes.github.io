<main class="wrap"><figure class="quote" id="q-04be91a0ea" data-kw="">
<blockquote><p>The parts of it [worship], that is, each action of each kind, so receiving the Lord’s Supper is a kind of worship, the action of giving, taking, eating, drinking, with the things hereby represented, are parts.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ff5def8b9" data-kw="">
<blockquote><p>When the old prophet did invite the young prophet to eat bread and drink water with him, common civility made a table necessary in this single entertainment (1 Kings 13:20), ‘And it came to pass as they sat at the table…’ If it were a disrespect to invite friends to eat and drink with us, and yet when they come, not to place them at a table (where a table may be had), I know no reason why it ought not also to be conceived a wronging of Christ’s guests when they are not placed at his Table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions... (Edinburgh, 1649), ch. 18, ‘Of the Use of a Table in the Lord’s Supper…’</cite>, p. 224</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-d8fcc4f03a" data-kw="">
<blockquote><p>This book explores the emergence and development of the extra Calvinisticum in the Reformed tradition by tracing its first exposition from Ulrich Zwingli to early Reformed orthodoxy. Rather than being an ancillary issue, the questions surrounding the extra Calvinisticum were a determinative factor in the differentiation of Magisterial Protestantism into rival confessions. …Over time, Reformed theologians, such as Peter Martyr Vermigli and Antione de Chandieu, articulated the extra Calvinisticum with increasing rigor by incorporating conciliar christology, the church fathers, and scholastic methodology to address the polemical needs of engagement with Lutheranism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/k-j-drake.html">K.J. Drake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Etiam extra carnem: The Flesh of the Word: The extra Calvinisticum from Zwingli to Early Orthodoxy Pre (Oxford Univ. Press, 2021)</cite></span></figcaption>

</figure><figure class="quote" id="q-29617bef5e" data-kw="">
<blockquote><p>Sitting we think not so necessary as that there could not be a sacrament without it, but to the due ministration of the sacrament we think a table-gesture necessary. … When as we only ground upon Christ and his apostles sitting, and other rites, the necessity of a table-gesture, not to the essence of a sacrament, but to the due ministration of that action… Sitting we think ought not to be changed, no not into standing, without some weighty consideration of some urgent occasion, because it was the gesture of Christ, his apostles, and the apostolical kirks; it is the ordinary gesture of guests at feasts, and resembles best the familiar access of the soul to the spiritual table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of our Arguments Against Kneeling in the Act of Receiving the Sacramental Elements of Bread &amp; Wine Impugned by Mr. Michelsone (Amsterdam, 1620), ‘Answer to his Ten Arguments for Kneeling’, pp. 72 &amp; 74-75</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“Sitting we think not so necessary as that there could not be a sacrament without it, but to the due ministration of the sacrament we think a table-gesture necessary. … When as we only ground upon Christ and his apostles sitting, and other rites, the necessity of a table-gesture, not to the essence of a sacrament, but to the due ministration of that action… Sitting we think ought not to be changed, no not into standing, without some weighty consideration of some urgent occasion, because it was the gesture of Christ, his apostles, and the apostolical kirks; it is the ordinary gesture of guests at feasts, and resembles best the familiar access of the soul to the spiritual table.”

— David Calderwood, A Defence of our Arguments Against Kneeling in the Act of Receiving the Sacramental Elements of Bread &amp; Wine Impugned by Mr. Michelsone (Amsterdam, 1620), ‘Answer to his Ten Arguments for Kneeling’, pp. 72 &amp; 74-75">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSitting+we+think+not+so+necessary+as+that+there+could+not+be+a+sacrament+without+it%2C+but+to+the+due+ministration+of+the+sacrament+we+think+a+table-gesture+necessary.+%E2%80%A6+When+as+we+only+ground+upon+Christ+and+his+apostles+sitting%2C+and+other+rites%2C+the+necessity+of+a+table-gesture%2C+not+to+the+essence+of+a+sacrament%2C+but+to+the+due+ministration+of+that+action%E2%80%A6+Sitting+we+think+ought+not+to+be+changed%2C+no+not+into+standing%2C+without+some+weighty+consideration+of+some+urgent+occasion%2C+because+it+was+the+gesture+of+Christ%2C+his+apostles%2C+and+the+apostolical+kirks%3B+it+is+the+ordinary+gesture+of+guests+at+feasts%2C+and+resembles+best+the+familiar+access+of+the+soul+to+the+spiritual+table.%E2%80%9D%0A%0A%E2%80%94+David+Calderwood%2C+A+Defence+of+our+Arguments+Against+Kneeling+in+the+Act+of+Receiving+the+Sacramental+Elements+of+Bread+%26+Wine+Impugned+by+Mr.+Michelsone+%28Amsterdam%2C+1620%29%2C+%E2%80%98Answer+to+his+Ten+Arguments+for+Kneeling%E2%80%99%2C+pp.+72+%26+74-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29617bef5e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29617bef5e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/sitting-at-the-table#:~:text=Sitting%20we%20think%20not%20so%20necessary,the%20soul%20to%20the%20spiritual%20table&amp;text=Sitting%20we%20think%20not%20so%20necessary%20as%20that&amp;text=access%20of%20the%20soul%20to%20the%20spiritual%20table" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-24865c5f13" data-kw="">
<blockquote><p>God gave to his people, the Jews, a civil, as well as a moral law; and he constituted the Sabbath a civil, as well as a religious institution. In one instance, at least, during the sojourn of the children of Israel in the wilderness, the presumptuous violation of the law of the Sabbath was visited by the penalty of death.

The fact that God made it a civil institution, indicates clearly the duty of all civil legislators, unless it can be shown that the reasons why the Jewish nation should have a Sabbath, do not apply to other nations. But as individuals and families have their respective accountability to God, so do nations. And as the civil ruler is “a minister of God,” he must make his legislation conform to God’s legislation. …

Now, God has commanded all men to remember the Sabbath-day to keep it holy; no civil ruler, therefore, has the right to require his subjects to labour on that day, save in case of necessity. And since ”righteousness exalteth a nation,” it is the wisdom of civil rulers to protect the people, in the enjoyment of the divinely-appointed day for the cultivation of virtue. This is eminently true of a free government, since all such governments depend upon the moral forces. The Sabbath, then, originated in the moral necessities of nations, as well as of individuals and families.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathan-l-rice.html">Nathan L. Rice</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Origin and History of the Sabbath in The Christian Sabbath: Its History, Authority, Duties, Benefits, and Civil Relations. A Series of Discourses</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>Now the Galatians had been forced by the false apostles to observe these same rites as something necessary for righteousness. This is why he says that they have lost grace and Christian liberty, and have turned back to the slavery of the weak and beggarly elements. They had been persuaded by the false apostles that these laws had to be observed; that when they were observed, they granted righteousness; but that when they were neglected, they brought damnation. But Paul does not permit consciences to be bound by the Mosaic Law in any way, but everywhere he sets them free from the Law. “Now I, Paul,” he says later on, in chapter five (v. 2), “say to you that if you receive circumcision, Christ will be of no advantage to you.” In Col. 2:16 he says: “Let no one pass judgment on you in questions of food and drink or with regard to a festival or a new moon or a Sabbath.” Thus Christ says (Luke 17:20): “The kingdom of God does not come by observance.” Much less should consciences be burdened and ensnared by human traditions.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>3. It is an untrue supposition and but a begging of the question that our presence with anything obtruded unlawfully is a prejudice to that fundamental of the sovereignty of Christ. All men that sin do sin against his soveraignty: And all that obtrude anything unlawfully sin against it by that obtrusion. But if you obtrude a rash and passionate prayer on the people, or an erroneous or disorderly prayer, or an ill-composed hymn or psalm, their presence is no approbation of your error, nor denying of Christ’s sovereignty. Do you, or can you believe and make all your followers believe that the synagogue-worship and the Temple-worship were kept so pure by the priests, Levites and Pharisees in Christ’s days, as that there was nothing of human tradition obtruded? Or nothing but what God commanded? Can you believe this? Or can you believe that Christ was not usually or often present there? See Luke 4:16. At Nazareth where he had been brought up, as his custom was, he went into the synagogue on the Sabbath day—And of Paul its said, Acts 17:2. As his manner was, he went in to them, and three Sabbath dayes reasoned—Or do you believe, that Christ was a sinner? and that He contradicted his own sovereignty? What! and yet be a perfect Saviour? Who is it now that prejudices fundamentals?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London: Simmons, 1671), pp. 116-17</span></figcaption>

<blockquote><p>Do we find it difficult to rise as early on that day as during the week, that with the morning we may commence our duties? Let conscience speak, and we shall wake early. Let our love to God, and his service, only be as strong as our attachment to the things of the world, and no more of the Sabbath will be wasted in slumber, than of Monday morning. Men who labour through the week, contend for this indulgence; that they are wearied and need rest: besides, that the Sabbath is given for rest.

But, no reader of the Bible can say, that it is the rest of indolence and spiritual inactivity. The worship of God does not commonly demand the labours and exercise of the body; the mind only is called into healthful action; and this is also refreshing to the body. In answer to the plea, that being worn down with the cares of the week, and its toils, we may, consistently with duty, lie later on Sabbath morning than any other, it may be asked, Have we a right to expend our strength during the week, so as to unfit us for the duties of the Sabbath when they arrive?

If we found ourselves disinclined early to seek the Lord, last Sabbath, are we not bound to guard against such languor, when this holy day shall again dawn? Is not duty plain, that we ought to relax our labours on Saturday, that we may not lose the most precious hours of the Lord’s day? Were we our own, we might exercise our pleasure. But we are not. Man’s chief end is, to glorify God, and enjoy him, in this world, as well as hereafter.

Suppose you hire a man, to labour for you — you have a right to all his time; but you give him five days in the week for his own employment on condition that he will devote himself wholly to your work on the sixth. Has this man a right, so to arrange his business, and expend his strength, during the five days he labours for himself, that when the sixth day arrives, he cannot rise until late, nor commence his work until the morning be nearly past?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/silas-milton-andrews.html">Silas Milton Andrews</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath at Home</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1840), pp 11-12.</span></figcaption>

<blockquote><p>Q. What is forbidden in this Commandment generally?

A. All will-worship, how great a shew soever it have.

Q. What are the parts of that will-worship?

A. The outward worship of • any besides God. • and of God any otherwise then he commandeth.

Q. What are the particulars forbidden in the outward worship of God?

A. First, we are forbidden to make Images; and secondly, to bow unto them, or worship them.

Q. Why is this part so largely set forth?

A. To meet with the corruption of men, that by nature are exceeding prone to Idolatry.

Q. Are all Images by this Commandment unlawful?

A. No, but such as are made for religious ends and uses: for in civil matters they may have a lawful and commendable use.

Q. What gather you of this?

A. That the Popish doctrine of Images (that they are Lay men’s books), is directly contrary to the word of God; and therefore to be detested of all God’s children.

Q. What Images are most of all condemned?

A. Images of God: for it is a great sin to conceit or imagine in our hearts, that he is like any thing, how excellent soever we do think it; but it is much worse so to set him out to the view of others, considering that the mind can conceive a further beauty, then the hand of the Artificer can express. And therefore the children of Israel did sin grievously, and were worthily condemned, for worshipping God, in the Image of a Calf.

Q. Did not the Israelites worship the Calf as God, as the Papists say?

A. No: but they worshipped God in the Calf: for they said, Let us make a feast tomorrow to the Lord.

Q. Wherein did they sin so grievously?

A. In tying the presence of God to the work of their own hands, and coupling him with their Idols, which he cannot endure: for God saith by his Prophet Hosea, You shall no more call upon me in Baal. So impossible it is truly to serve God by an Idol, as the Papists do.

Q. How appeareth it, that we should make no Image of God?

A. In the 4. of Deuteronomy, the Lord forewarned the Israelites, that because they saw no Image of him when he gave the Law; therefore they should make no likeness of him.

Q. But what moves the Papists to paint God like an old man?

A. The false expounding of a place in Daniel, where he is called the Ancient of days. Whereby is meant his Eternity, how he was before all times: But whatsoever property in God it be, that they set forth by an Image, it is execrable so to do.

Q. What other Inventions of men (besides Images) are here forbidden?

A. All such inventions of men, as are devised for any worship or service of God: likewise all representations of any grace of God, otherwise then God hath appointed, or may be allowed by his word. And herein wee are to observe the Apostles rule and practice, 1. Cor. 11. where he saith, That which I have received of the Lord, I have delivered unto you: for if he might add nothing to God’s Ordinance, much less may we.

Q. What else is here condemned?

A. First, to use any Word publicly in the Church, besides the written word of God, contained in the Canonical Scripture. Secondly, to devise any other ministry, then that which God hath appointed. Thirdly, to go to Witches, to consult with Stargazers, or the like, to whom Moses opposeth a Prophet, as the only lawful Minister of God, &amp; warrantable meanes to know his will by.

Q. What further is forbidden?

A. All the meanes and occasions of Idolatry, and all league and amity with Idolators; therefore no professor of the true worship of God should marry an Idolater, or an apparent profane and irreligious person.

Q. What other things are here forbidden?

A. All such Ecclesiastical ceremonies, and rites of Religion, as are repugnant to God’s word, or not warrantable by the general grounds thereof.

Q. What is to be observed of that it is said, Thou shalt not bow down to them, nor worship them?

A. Hereby is noted a further degree of Idolatry, which here also is forbidden; as when men shall shrine, clothe, and cover Images with precious things; kneel and creep unto them, light candles before them, &amp; such like; or when men shall not only use, but commend and extol, and by authority urge the inventions of men: wherein the gross Idolatry of Popery is condemned, which though it be taken away from amongst us, yet the corruption cleaveth still to the hearts of many; as may be seen in them, that make courtesy to the chancel where the high altar stood, and who give the right hand unto standing crosses, Crucifixes, &amp;c.

Q. What kind of Images are here forbidden, to be worshipped?

A. All kinds, whether such as are made with man’s hands, of which Esay [Isaiah] speaketh, saying, One piece of wood is cast into the fire, and another of the same tree is made an Idol: or such as in themselves are the good creatures of God; as those which Hoseah speaks of, saying, They worship their gold and silver. Yea, of whatsoever things it may be said, that they have eyes &amp; see not, mouths and speak not, ears and hear not, noses and smell not, feet and go not; unto them is this worship forbidden to be performed. Although therefore the Papists worship not Jupiter, Mars, and such like Heathen Idols, but the holy Saints (as they say) in, and by their Images; yet by that, which hath been said, it appears, that even that worship of theirs, is impious and abominable Idolatry.

Q. What further is forbidden here, under the worship of Images?

A. To use any thing that God hath commanded for his worship, otherwise then he himself hath appointed; for the brazen Serpent abused, was worthily broken in pieces; and the Israelites for carting the Ark, were worthily punished.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-85f68b35e8" data-kw="">
<blockquote><p>Nothing can be plainer than that the Scriptures do teach that Christ is truly God, that He is truly man, and that He is one person. They assert of Him whatever may be said of God, and everything that can be said of a sinless man. They enter into no explanations. They assume it as a certain fact that Christ is God and man in one person, just as they assume that a man is a soul and body in one person.</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, vol. 2, pt. 3, ch. 3, “Person of Christ”</figcaption>
<div class="meta"><span class="t"><a href="../topics/the-person-of-christ/union-of-the-two-natures.html">Union of the Two Natures</a> › <a href="../topics/the-person-of-christ/union-of-the-two-natures/one-person-two-natures.html">One person, two natures</a></span><span class="t"><a href="../topics/the-person-of-christ/deity-of-christ.html">Deity of Christ</a> › <a href="../topics/the-person-of-christ/deity-of-christ/proofs-of-his-divinity.html">Proofs of his divinity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-750d639e01" data-kw="">
<blockquote><p>You will remember the multitude He has redeemed; not me alone, nor you alone, but “a multitude that no man can number,” which shall as far exceed the stars of heaven for number, as they exceed all mortal reckoning. Christ hath bought for Himself, some out of every kingdom, and nation, and tongue, under heaven; He hath redeemed from among men some of every rank, from the highest to the lowest; some of every colour—black and white; some of every standing in society, the best and the worst. For some of all sorts hath Jesus Christ given Himself a ransom that they might be redeemed unto Himself.</p></blockquote>
<figcaption>— <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a>, <cite>“Justification by Grace”</cite>, sermon on Rom. 3:24</figcaption>

</figure><figure class="quote" id="q-98ebf40a4f" data-kw="">
<blockquote><p>In reference to grateful love, nothing so much tends to fill the heart with this emotion as the believing realization of Christ’s redemption work—nothing so melts the heart; and no purer love to God can be imbibed. … There is no motive to a holy life so powerful and efficacious as that which is drawn from the propitiatory work of Christ, who, after meeting the demands of the law and bearing its curse, makes that same law a rule to direct our steps; and Christians learn to take it from the Mediator’s hand.</p></blockquote>
<figcaption>— <a href="../authors/george-smeaton.html">George Smeaton</a>, <cite>The Doctrine of the Atonement as Taught by Christ Himself</cite>, ch. 8, sec. 52</figcaption>

</figure><figure class="quote" id="q-3691a951d9" data-kw="">
<blockquote><p>They usurp the divinity and office of Christ. The effect is the same as if they said, &quot;I am Christ; I am a Savior. I save myself and others.&quot; This is the impression the monks give out. The Pope is the Antichrist, because he is against Christ, because he takes liberties with the things of God, because he lords it over the temple of God.</p></blockquote>
<figcaption>— <a href="../authors/martin-luther.html">Martin Luther</a>, <cite>Commentary on Galatians</cite>, p. 94</figcaption>

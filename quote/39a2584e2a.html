<blockquote><p>4. [God justifies] By way of Execution, when the sentence is executed. This is in part done here, as God takes off the penalties and fruits of sin, either in the way of his internal or external government, and gives us many blessings, as the pledge of his love, and above all, the gift of the Holy Spirit, whereby He sanctifies us more thoroughly, and works in us that which is pleasing in his sight: This He gives as the God of peace, as reconciled to us in Christ, Heb. 13:20-21: ‘Now the God of peace that brought again from the dead our Lord Jesus, that great shepherd of the sheep, through the blood of the everlasting Covenant, make you perfect in every good work, to do his will, working in you that which is pleasing in his sight, through Jesus Christ.’ 1 Thess. 5:23: ‘And the very God of peace sanctify you wholly: and I pray God your whole spirit, and soul, and body, be preserved blameless unto the coming of our Lord Jesus Christ;’ Faithful is he that calls you, who will do it: but more fully at the Last Day, when we enter into everlasting glory; and the wicked are turned into Hell with the Devil and his angels, Mt. 25:46, ‘And these shall go into everlasting punishment; but the righteous into life eternal’: then is the full and final execution, a perfect freedom from all misery, and a possession of all happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (London: Astwood, 1684), Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 334</span></figcaption>

584e2a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=4.%20%5BGod%20justifies%5D%20By%20way%20of,and%20a%20possession%20of%20all%20happiness&amp;text=4.%20%5BGod%20justifies%5D%20By%20way%20of%20Execution%2C%20when&amp;text=all%20misery%2C%20and%20a%20possession%20of%20all%20happiness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-574bb6ee1e" data-kw="">
<blockquote><p>A disposition to good works is necessary to justification, being the qualification of an active and lively faith… Sincere, uniform and constant [obedience], though imperfect in measure and degree, and this is so necessary that without it there is no salvation to be expected. The Covenant of Grace calls for perfection, accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection was rigidly exacted, no flesh could be saved: if not at all commanded, imperfection should not be sin, nor perfection to be labored after. The faith that is lively to embrace mercy is ever conjoined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, does ever attend that faith whereby we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life, than it does virtually or actually lead us forward in the way to Heaven. For: ‘If we say we have fellowship with God and walk in darkness, we lie and do not the truth: But if we walk in the light, as He is in the light, we have fellowship one with another,’ 1 Jn. 1:6-7. This walking in the light as He is in the light is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins, or actual approbation with God. The truth of which doctrine St. John likewise ratifies in terms equivalent, in the words presently following: ‘and the blood of Christ cleanseth us’ (walking in the light as God is in the light) ‘from all sin.’ [v. 7]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, pp. 20-21</span></figcaption>

</figure><figure class="quote" id="q-172d017354" data-kw="">
<blockquote><p>8. Likewise, every Christian should learn that this grace and this regeneration have not been given to us so that we might remain idle in that stage of our renewal which we at first obtained, but so that we may grow in everything into him who is the head. Therefore, the people must be taught to devote effort to this growth which indeed happens through good works, both internal and external, which are commanded and commended by God. To these works God has, in many passages from the Gospels, clearly and manifestly promised on account of Christ a reward – good things in this life, as much for the body as for the soul (as much as seems right to divine providence) and after this life in heaven. Therefore, although the inheritance of eternal life is due to the regenerate on account of the promise, as soon as they are reborn in Christ, nevertheless God also renders a reward to good works, not according to the substance of the works, nor because they come from us, but to the extent that they are performed in faith and proceed from the Holy Spirit, who dwells in us, free choice concurring as a partial agent.</p></blockquote>

</figure><figure class="quote" id="q-53c3a82b63" data-kw="">
<blockquote><p>Whether the infusion of grace is required for justification? It is distinguished. Whether some movement of free choice and faith is required? It is affirmed with a distinction. … Whether the infusion of grace is by order of nature first amongst those things which are required for justification? It is distinguished. … Whether inhering righteousness is the cause of justification? It is denied. … Whether the righteousness of the justified is inhering or imputed? The latter is affirmed contra the Papists. … Whether we deny all inherent righteousness? It is denied. … Whether sanctification or regeneration precedes justification, or the contrary? It is distinguished.</p></blockquote>

<blockquote><p>The word saint in general signifies a person separated, or one set apart from others; Holiness is our separation from the world unto God: holy persons are separated persons; that’s their state.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, … (London: 1650), sermon on Job 15:15, pp. 61-62</span></figcaption>

<main class="wrap"><figure class="quote" id="q-034cea6e81" data-kw="">
<blockquote><p>…as Papists say, their unwritten traditions are agreeable to the Word, and though beside Scripture, yet not against it: and [are] the very will of God no less than the written Word; and let Formalists assure us that their positive additaments of surplice and cross are the same which God commands in the Scriptures by the prophets and apostles, and though beside, yet not contrary to the Word: But I pray you what better is the distinction of beside the Word, not contrary to the Word of God, out of the mouth of Papists, to maintain unwritten traditions, which to them is the express Word of God, than out of the mouth of Formalists, for their unwritten positives, which are worse than Popish traditions in that they are not the express Word of God, by their own grant?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646)</cite>, p. 40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-98e33e6fa9" data-kw="">
<blockquote><p>For what is idolatry if it is not to worship the gifts instead of the giver? Here the sin is twofold. The honour robbed from God is transferred to the creature, and God, moreover, is dishonoured by the pollution and profanation of his own goodness, while his holy sacrament is converted into an execrable idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.17.36</span></figcaption>

</figure><figure class="quote" id="q-9fcc17b889" data-kw="">
<blockquote><p>But as far as the law itself is concerned, ‘You will not make for yourself a graven image, nor any likeness of anything under heaven above, etc.’ the Lord forbids two things: the one, that they be made; the other, that they be worshipped. Nevertheless this was not imposed on concsciences except by reason of divine worship, namely lest they be made with this goal in mind, and lest those things that have been fashioned be adored.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586 (Concordia Publishing House, 2017), ch. 4</cite>, p. 486</span></figcaption>

</figure><figure class="quote" id="q-482ef3c483" data-kw="">
<blockquote><p>It’s further also to be observed in the general, that God has always had apparitions suitable to the matter in hand. Thus He appeared in a burning bush to Moses, like an armed man to Joshua; and with all signs of majesty, and a great God, being to deliver laws to the people that they might see how potent He was to be avenged for every breach.</p></blockquote>

</figure><figure class="quote" id="q-0181e0f60e" data-kw="invocation of saints refuted memory not worship">
<blockquote><p>Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny. At the outset, we oppose the calumnies of the papists who slander us as despisers and enemies of the saints because we repudiate the worship of them (as if disgrace were thrown upon the saints when what belongs to God and Christ alone is not attributed to them). Now although their memory is very sacred to us, still we think that care should be diligently taken that they be not worshipped to the injury of God.</p></blockquote>

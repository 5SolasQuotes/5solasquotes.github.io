<main class="wrap"><figure class="quote" id="q-0376ed0af8" data-kw="">
<blockquote><p>For this reason I subscribe to the common saying that God is the object of faith, yet it requires qualification. For Christ is not without reason called “the image of the invisible God.” This title warns us that, unless God confronts us in Christ, we cannot come to know that we are saved. Among the Jews the scribes obscured with false glosses what the prophets had taught concerning the Redeemer. Yet in spite of this, Christ took to be commonly known, as if received by general agreement, that there is no other remedy for a hopeless condition, no other way of freeing the church, than the appearance of the Mediator. Indeed, Paul’s teaching was not commonly known — as it ought to have been — that “Christ is the end of the law” Yet this is true and certain, as is perfectly clear from the Law itself and the Prophets. I am not yet discussing faith because there will be a more suitable place for it elsewhere. Only let the readers agree on this point: let the first step toward godliness be to recognize that God is our Father to watch over us, govern and nourish us, until he gather us unto the eternal inheritance of his Kingdom. Hence, what we have recently said becomes clear, that apart from Christ the saving knowledge of God does not stand. From the beginning of the world he had consequently been set before all the elect that they should look unto him and put their trust in him. In this sense Irenaeus writes that the Father, himself infinite, becomes finite in the Son, for he has accommodated himself to our little measure lest our minds be overwhelmed by the immensity of his glory. Fanatics, not reflecting upon this, twist a useful statement into an impious fantasy, as if there were in Christ only a portion of divinity, outflowing from the whole perfection of God. Actually, it means nothing else than that God is comprehended in Christ alone. John’s saying has always been true: “He that does not have the Son does not have the Father.” For even if many men once boasted that they worshiped the Supreme Majesty, the Maker of heaven and earth, yet because they had no Mediator it was not possible for them truly to taste God’s mercy, and thus be persuaded that he was their Father. Accordingly, because they did not hold Christ as their Head, they possessed only a fleeting knowledge of God. From this it also came about that they at last lapsed into crass and foul superstitions and betrayed their own ignorance. So today the [Muslim] Turks, although they proclaim at the top of their lungs that the Creator of heaven and earth is God, still, while repudiating Christ, substitute an idol in place of the true God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.6.4 (Battles edition).</span></figcaption>

<blockquote><p>Edward Bagshaw, p. 12: ‘2. Being present where those things are used in the worship of God, which God has not commanded, this would involve us in the guilt and contagion of them…’ Richard Baxter: Here are two more false doctrines intimated:

1. That to use things in the worship of God which He has not commanded (without exception) is a sin.

2. That being present where they are used involves us in the guilt. Where note:

1. That it is not part of the worship [formally], but things used in the worship that he speaks of.

2. That I proved the contrary to both these at large… and [Bagshaw] gives not a syllable of answer to my twenty instances and many undeniable reasons to the contrary… Sermon notes, meters, tunes, printed Bibles (as printed) and divided into chapters and verses, the words of a sermon or prayer, the particular method, cups, tables, etc. are used in the worship of God without any particular command or any command for this rather than that in cases of indifferency: and yet all these are not therefore unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), sect. 44, pp. 113-14</span></figcaption>

</figure><figure class="quote" id="q-72e8445630" data-kw="keep faith lawful oaths">
<blockquote><p>First, to keep faith is an act of truth, justice and fidelity. He that keeps faith does what he says, the characteristic of truth. He does what he has promised and to which he is bound, the characteristic of fidelity. He restores to another what is his due according to the promise, the characteristic of justice. Second, it is lawful to swear faith to infidels, therefore also to keep faith with them as appears from the examples of Abraham making a covenant with Abimelech (Gen. 21:23, 24), of Isaac (Gen. 26:26), of Jacob (Gen. 31:53), of the spies with Rahab (Jos. 6:22), of the Israelites with the Gibeonites (Jos. 9:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.11.9–10</span></figcaption>

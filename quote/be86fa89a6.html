<main class="wrap"><figure class="quote" id="q-be86fa89a6" data-kw="">
<blockquote><p>And first, learn, concerning prayer: All prayer for things heavenly and spiritual concerning the life to come (I speak not of the worldly things, but things heavenly and spiritual) should arise on some certainty and assurance of the heart, that God will grant to us the things we ask.

Therefore James in his Epistle last chap. 15. verse. he calls prayer, the prayer of faith, that is, that rises of faith and assurance in the heart, that God will grant us the thing we ask. John in his first Epistle, last chap. 14. verse, he joins these two together, confidence or assurance, and prayer, and he says. This is that confidence we have in the Lord, that, if We aske any thing according to his will, he will hear us:

There is confidence in prayer, that, when we pray, we should have that assurance that God will give us these things we seek, not according to our will, but according to his own will. It is his will that we should have these heavenly things, through the blood of Christ. And therefore our prayer for them should rise on confidence, that God will grant them for Christ’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), p. 335.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-df9f78d294" data-kw="">
<blockquote><p>We are to think the same thing concerning prayer, as concerning the labour and endeavour of good works: For we do rightly and piously ask of God those things which are determined by his certain purpose: For God who hath determined to do good to us, will give that good to our prayers, and not to slothfulness and security, Jehoshaphat did not in vain pray before the fight, 2 Chro. 20 although he was not ignorant that God had already decreed what should be the event of the battle.

The Apostles knew well enough that their sins were forgiven them by God, and yet they did daily pray Forgive us our trespasses. Christ did not doubt of his resurrection, and of the obtaining of glory after the combat, and yet he did pray by night, and went aside into the country to pray.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 20.33, p. 168.</span></figcaption>

</figure><figure class="quote" id="q-443a86e113" data-kw="six petitions">
<blockquote><p>The reason why I do not agree with those who distinguish seven headings is that by inserting the adversative &quot;but&quot; the Evangelist seems to have meant to join those two members together. It is as if he had said: &quot;Do not allow us to be oppressed by temptation but rather bring help for our weakness, and deliver us from falling.&quot; Ancient writers of the church also agree with us, so that what has been added in seventh place in Matthew exegetically ought to be referred to the sixth petition. But even though the whole prayer is such that throughout it God&#x27;s glory is to be given chief place, still the first three petitions have been particularly assigned to God&#x27;s glory, and this alone we ought to look to in them, without consideration of what is called our own advantage. The three others are concerned with the care of ourselves, and are especially assigned to those things which we should ask for our own benefit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20</span></figcaption>

</figure><figure class="quote" id="q-b2e91bf75f" data-kw="">
<blockquote><p>The Covenanters in the United States realised that chattel slavery was a sin that would provoke the wrath of God. Hence, they made it a cause for fasting that such evil existed in their nation:

That abominable species of murder, even enslaving thousands of fellow creatures for life and their posterity without end, and degrading them below the brutes, is now reduced to a regular system, and seems, by a long prescription to a brave remedy. There is, for the present, power on the side of the oppressors, but no power on the side of the oppressed.

What humane man but will mingle his tears with those of his fellow mortals, when he sees them shut out from every source of rational happiness, far banished from their native homes, torn from their dear relations, and wallowing in the most abominable uncleanness, while every means of ameliorating their condition is artfully kept from their view by their insolent and murderous masters. Oh! America, what hast thou to account for, but to God and man, on the head of slavery alone? Alas! when shall God arise for the cries of the oppressed?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-mckinney.html">James McKinney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Act of the Reformed Presbytery in North America for a Day of Public Fasting, with the Causes thereof (5 Aug. 1795) in Reformed Presbyterian and Covenanter</cite></span></figcaption>

</figure><figure class="quote" id="q-1e7e9d5d74" data-kw="">
<blockquote><p>Wherefore, our Heavenly Master also says: “Watch and pray, that ye enter not into temptation.” Let every man, therefore, when fighting against his own concupiscence, pray that he enter not into temptation; that is, that he be not drawn aside and enticed by it. But he does not enter into temptation if he conquers his evil concupiscence by good will. And yet the determination of the human will is insufficient, unless the Lord grant it victory in answer to prayer that it enter not into temptation. What, indeed, affords clearer evidence of the grace of God than the acceptance of prayer in any petition?

If our Saviour had only said, “Watch that ye enter not into temptation,” He would appear to have done nothing further than admonish man’s will; but since He added the words, “and pray,” He showed that God helps us not to enter into temptation. It is to the free will of man that the words are addressed: “My son, remove not thyself from the chastening of the Lord.” And the Lord said: “I have prayed for thee, Peter, that thy faith fail not.” So that a man is assisted by grace, in order that his will may not be uselessly commanded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Grace and Free Will</cite>, (c. 427), 9 in Nicene and Post-Nicene Fathers 1, 5: 447.</span></figcaption>

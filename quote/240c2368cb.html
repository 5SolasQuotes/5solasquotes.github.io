<main class="wrap"><figure class="quote" id="q-240c2368cb" data-kw="">
<blockquote><p>…we will summarize the argument: Premise 1: … The purposes of marriage are threefold (WCF 24.2): 1) The mutual help of husband and wife (Gen. 2:18); 2) The increase of mankind/procreation (Gen. 1:28), and of the Church with an holy seed (Mal. 2:15); 3) Preventing of uncleanness (1 Cor. 7:2 &amp; 9). Premise 2: Any act against any of the purposes of marriage is necessarily sinful. Conclusion: Contraception acts against purpose 2 and is therefore sinful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-barth.html">Paul Barth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Contraception,’ pt. 1</cite>, (Abortifacients, Health Risks, Societal Factors), 2 (Dominion, Purposes of Marriage), 3 (Barrenness, Elderly, Natural Family Planning), 4 (Onanism) (2015) at Purely Presbyerian | To only respond to a few things due to the importance of the issue, in twelve points, Barth states in pt. 4:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“…we will summarize the argument: Premise 1: … The purposes of marriage are threefold (WCF 24.2): 1) The mutual help of husband and wife (Gen. 2:18); 2) The increase of mankind/procreation (Gen. 1:28), and of the Church with an holy seed (Mal. 2:15); 3) Preventing of uncleanness (1 Cor. 7:2 &amp; 9). Premise 2: Any act against any of the purposes of marriage is necessarily sinful. Conclusion: Contraception acts against purpose 2 and is therefore sinful.”

— Paul Barth, ‘Contraception,’ pt. 1 (Abortifacients, Health Risks, Societal Factors), 2 (Dominion, Purposes of Marriage), 3 (Barrenness, Elderly, Natural Family Planning), 4 (Onanism) (2015) at Purely Presbyerian | To only respond to a few things due to the importance of the issue, in twelve points, Barth states in pt. 4:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6we+will+summarize+the+argument%3A+Premise+1%3A+%E2%80%A6+The+purposes+of+marriage+are+threefold+%28WCF+24.2%29%3A+1%29+The+mutual+help+of+husband+and+wife+%28Gen.+2%3A18%29%3B+2%29+The+increase+of+mankind%2Fprocreation+%28Gen.+1%3A28%29%2C+and+of+the+Church+with+an+holy+seed+%28Mal.+2%3A15%29%3B+3%29+Preventing+of+uncleanness+%281+Cor.+7%3A2+%26+9%29.+Premise+2%3A+Any+act+against+any+of+the+purposes+of+marriage+is+necessarily+sinful.+Conclusion%3A+Contraception+acts+against+purpose+2+and+is+therefore+sinful.%E2%80%9D%0A%0A%E2%80%94+Paul+Barth%2C+%E2%80%98Contraception%2C%E2%80%99+pt.+1+%28Abortifacients%2C+Health+Risks%2C+Societal+Factors%29%2C+2+%28Dominion%2C+Purposes+of+Marriage%29%2C+3+%28Barrenness%2C+Elderly%2C+Natural+Family+Planning%29%2C+4+%28Onanism%29+%282015%29+at+Purely+Presbyerian+%7C+To+only+respond+to+a+few+things+due+to+the+importance+of+the+issue%2C+in+twelve+points%2C+Barth+states+in+pt.+4%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F240c2368cb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/240c2368cb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-birth-control/#:~:text=we%20will%20summarize%20the%20argument%3A%20Premise,purpose%202%20and%20is%20therefore%20sinful&amp;text=we%20will%20summarize%20the%20argument%3A%20Premise%201&amp;text=acts%20against%20purpose%202%20and%20is%20therefore%20sinful" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a4e31ab855" data-kw="">
<blockquote><p>III. …the formation of the body, which was completed at once, and not over a period of time, like the bodies of other men; and in the breathing in of a rational soul. Whereas in ordinary generation the time required for formation of the body is forty days, the body of Christ was absolutely completed in a moment. Otherwise Christ would have been conceived not a man but as an embryo.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, (1625), ch. 16, ‘The Person of Christ the God-Man’, section 2, propositions in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“III. …the formation of the body, which was completed at once, and not over a period of time, like the bodies of other men; and in the breathing in of a rational soul. Whereas in ordinary generation the time required for formation of the body is forty days, the body of Christ was absolutely completed in a moment. Otherwise Christ would have been conceived not a man but as an embryo.”

— Johannes Wolleb, Compendium of Christian Theology (1625), ch. 16, ‘The Person of Christ the God-Man’, section 2, propositions in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), pp. 89-90">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+%E2%80%A6the+formation+of+the+body%2C+which+was+completed+at+once%2C+and+not+over+a+period+of+time%2C+like+the+bodies+of+other+men%3B+and+in+the+breathing+in+of+a+rational+soul.+Whereas+in+ordinary+generation+the+time+required+for+formation+of+the+body+is+forty+days%2C+the+body+of+Christ+was+absolutely+completed+in+a+moment.+Otherwise+Christ+would+have+been+conceived+not+a+man+but+as+an+embryo.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wolleb%2C+Compendium+of+Christian+Theology+%281625%29%2C+ch.+16%2C+%E2%80%98The+Person+of+Christ+the+God-Man%E2%80%99%2C+section+2%2C+propositions+in+ed.+John+Beardslee%2C+Reformed+Dogmatics%3A+J.+Wollebius%2C+G.+Voetius+%26+F.+Turretin+%28Oxford+Univ.+Press%2C+1965%29%2C+pp.+89-90&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4e31ab855.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a4e31ab855.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=the%20formation%20of%20the%20body%2C%20which,a%20man%20but%20as%20an%20embryo&amp;text=the%20formation%20of%20the%20body%2C%20which%20was%20completed&amp;text=conceived%20not%20a%20man%20but%20as%20an%20embryo" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7b3ddb0eda" data-kw="">
<blockquote><p>We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Untying of Grave Questions</cite>, (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, ‘Whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…”

— Pierre Du Moulin, An Untying of Grave Questions (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, ‘Whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ trans. AI Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe%2C+therefore%2C+maintain+that+the+rational+soul+is+infused+by+God+into+the+embryo%2C+not+indeed+%CE%B8%CF%8D%CF%81%CE%B1%CE%B8%CE%B5%CE%BD+%E1%BC%90%CF%80%CE%B5%CE%B9%CF%83%CE%B9%CE%AD%CE%BD%CE%B1%CE%B9+%28entering+from+without%29%2C+as+Aristotle+wishes+in+book+2+of+On+the+Generation+of+Animals%2C+chapter+3%2C+but+is+formed+by+God+in+the+fetus+itself+and+the+rudiment+of+the+human+body.+Scripture+teaches+this.+For+in+Isa.+57%3A16+God+speaks+thus%3A+%E2%80%9CThe+spirit+from+my+face+shall+clothe+man%2C+and+I+make+the+souls.%E2%80%9D+And+in+Zech.+12%3A1%3A+%E2%80%9CThus+says+the+Lord%2C+who+stretches+out+the+heavens%2C+and+lays+the+foundation+of+the+earth%2C+and+forms+the+spirit+within+him.%E2%80%9D%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+An+Untying+of+Grave+Questions+%28Leiden%3A+Elzevirana%2C+1632%29%2C+Treatise+5%2C+on+Original+Sin%2C+ch.+1%2C+%E2%80%98Whether+there+is+original+sin%2C+in+whom+it+exists%2C+and+whether+it+is+removed+by+Baptism.+Only+Christ+is+excepted+from+this+stain.+Not+even+the+Virgin+Mary+was+immune+from+it%E2%80%99+trans.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7b3ddb0eda.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7b3ddb0eda.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=We%2C%20therefore%2C%20maintain%20that%20the%20rational,and%20forms%20the%20spirit%20within%20him&amp;text=We%2C%20therefore%2C%20maintain%20that%20the%20rational%20soul%20is&amp;text=the%20earth%2C%20and%20forms%20the%20spirit%20within%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-823f7d21fd" data-kw="">

0our%20Savior,the%20work%20of%20the%20Holy%20Spirit&amp;text=the%20body%20of%20Christ%20our%20Savior%20did%20not&amp;text=power%20and%20the%20work%20of%20the%20Holy%20Spirit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f96e682650" data-kw="">
<blockquote><p>Difficult are the questions, at what time the fetus is animated, and what is the proximate and internal principle of the formation of the fetus, which have their use in the explication of certain passages of scripture, for example Eccl. 11, Ps. 139, and in the disputations on the person of Christ, and in certain cases about abortion and homicide pertaining to the sixth commandment of the Decalogue. Thomas Feyens inquired into the animation of the fetus in a special treatise, where you will find the varying opinions and authors indicated. He himself, however, diverges from the common and received opinion of the physicians (whom hitherto the fathers, scholastics, and our philosophers and theologians have followed). They also treat of this matter: Sennert and his antagonist Gallego de la Serna, and Freitag. But on this question see below appendix 1 thesis 4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | ‘On Creation’, pt. 10, after 9th problem, p. 307</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

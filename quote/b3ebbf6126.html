<blockquote><p>If we pass to the New Testament, we shall there also find this Argument used. From the Fabrick of the World St. Paul proves to the Men of Lystra, that there is a God, a Living God, in Contra distinction to the Gentile Gods, or Idols rather. From the making of Heaven and Earth, the Sea and all things that are therein, he argues the Existence of an All-sufficient and Self-subsistent Being, Acts 14.15.

And again, Rom. 1.20. The invisible things of God from (i. e. ever since) the Creation of the World are clearly seen, being understood by the things that are made, even his eternal Power and Godhead, even those Invisible things are clearly manifested by those Visible Works that he hath wrought. Or perhaps the meaning … may be from the Consideration of the Creation, from this alone the invisible things of the Deity, viz. his Power, Wisdom and Bounty are seen and proved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A demonstration of the existence and providence of God, from the contemplation of the visible structure of the greater and the lesser world in two parts, the first shewing the excellent contrivance of the heavens, earth, sea, &amp;c., the second the wonderful formation of the body of man</cite>, (London: Jonathan Robinson and John Wyat, 1696), 1.12, pp 252-53.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f63c5d071" data-kw="">
<blockquote><p>So the apostle in these two verses is shewing what that knowledge of God was which the Heathens had, and how they came by it. God’s eternal power and Godhead, which are in themselves invisible, was a thing the knowledge whereof was attainable by the light of nature. They had common principles of knowledge given them of God, whereby, looking upon the works of creation, they might safely and solidly gather, what a God he was and what was his due; so that they were rendered inexcusable in abusing this light; and their mouths were stopped, so that they had nothing to say for themselves, why they lived in ungodliness and unrighteousness. …

However the Lord Jehovah be it himself unsearchable, yet hath he left at much light in folks, that were they desirous, by the very principles of natural knowledge, they might see as much of God as might convince them that he only is to be worshipped, loved, and feared for it pleased the Lord that as much as might be sufficient for this end, should remain attainable by sand-blind nature; that is it that might be known.</p></blockquote>

<blockquote><p>[Chapter 3] CANON IV.

‘Tis true that since the Fall there remain in Man some Relics of Natural Light, by means whereof he yet retaineth some Knowledge of God, and of Natural things, he can discern between what is honest and dishonest, and expresseth some kind of Care and Study for Virtue, and Exterior Discipline. But he is so far from being able by this Light of Nature to attain the saving Knowledge of God, and to return unto him, that he doth not so much as make a right use of it in Natural and Civil things, but rather doth in divers ways soil and pollute it, and holds it under Hatches through Unrighteousness, by doing whereof he is left inexcusable before God.

CANON V.

And as it is with the light of Nature, even just so it is with the Decalogue which God particularly gave unto the Jews; for it doth indeed discover the heinousness of Sin, and doth more and more convince the Conscience of it, but not propounding any Remedy, nor imparting any Strength or Power whereby to get rid of this Misery, and being weak as to the Flesh, it leaves the Transgressor under the Curse, so that he cannot possibly obtain any saving Grace.

CANON VI.

This gift then which neither the Light of Nature, nor the Law of God can give, is wrought effectually by the virtue of the Holy Ghost, through the preaching of the Word, or Ministry of Reconciliation, to wit, the Gospel concerning the Messias, by whom it hath been, and still is the good pleasure of God to save all Believers both under the Old and New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-quick.html">John Quick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Galliâ Reformatâ: or, the Acts, Decisions, Decrees and Canons of the seven last National Councils of The Reformed Churches in France: a work never before Extant in any language. Collected and Composed Out of the original manuscript acts of those councils. VOL. II.</cite>, (2 vols, London: Thomas Parkhurst, 1692), 2: 138-39.</span></figcaption>

</figure><figure class="quote" id="q-f1d8e2c61a" data-kw="">
<blockquote><p>[1.] A twofold revelation of God is given to wayfarers [persons in this life], one in the sphere of nature, another in the sphere of grace.

2. Revelation in the sphere of nature is either Objective in the works of creation, or Subjective in the consciences of men.

3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led.

4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving.

5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel and doctrine concerning Christ the Savior and faith in Him, who, without knowledge of Him who alone is the way, can come to life?

6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>

<blockquote><p>Third, someone may ask whether natural theology is sufficient for salvation. There are those on one side who do not think it is useful at all. Thus Socinius, together with his followers, denies natural theology, and the Anabaptists are in basic agreement with him through their hatred of philosophy.

There are those on the other side who make so much of natural theology that it is seen as sufficient for salvation. In this group are the pagans, and formerly the Pelagians, since they taught that the patriarchs were saved by natural law alone, and Campanella, as well as the Libertines, who openly profess it.

The Reformed certainly acknowledge that natural theology is useful for refuting atheists, for demonstrating a deity, for some kind of worship (Rom. 1:19-20), and for rendering the pagans, including the philosophers, without excuse (Rom. 1:21-24, 32; Acts 17:24ff.; 1 Cor 11:13-14), but they consider it in no way sufficient for salvation. …

Nevertheless, the same Reformed do not deny that natural theology as it existed in the state of man as originally instituted, or in the state of integrity, was sufficient for the attainment of eternal life by the covenant of nature, because at that time human nature was still whole, owing to the wisdom of original righteousness. Nor also do they deny that while sin was absent, a mediator who is revealed by theology was not necessary.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-1e28b7eb9b" data-kw="">
<blockquote><p>But since inquiry is often instituted among theologians concerning the use of human reason and philosophy in the matter of religion: and since also mutual criminations arise hence between us and the papists, whilst we charge upon them the crime of corrupt theology, because, in the article of justification, free-will, and many other things, they follow Aristotle, rather than Paul; they, on the other hand, saying; that we, in the question of the presence of the body of Christ in the Lord’s supper, cleave to philosophical principles, and reject the manifest word of God; …</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b68acb891" data-kw="">
<blockquote><p>Christianity is so perfectly agreeable to the nobler powers of the human soul, that it has with much propriety been called the religion of philosophers. Philosophy is an excellent auxiliary to this divine institution, which draws from it the finest illustrations. Considered merely in this light, it merits from the friends of our religion, particular attention. But, separate philosophy from the Christian system, and, as the sources to mankind of knowledge, of virtue and happiness, they will, not even for a moment, admit of a comparison. In these respects, the latter is infinitely more perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Revealed Religion</cite>, trans. William Crawford (1737; Belfast: James Magee, 1778), § 1, p. 6n.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-fcc47d6eeb" data-kw="">
<blockquote><p>Objection #3: “Beware lest any man spoil you through philosophy and vain deceit; lest any man should beguile you with enticing words” (Colossians 2:8, 4). To engage in deductive reasoning is the practice of philosophy; we must refrain from making deductions which generate conclusions without substance.

Answer: The apostle warned against the abuse, not the lawful use of all things. Philosophy is the art of reasoning. It is innate in man to acquire knowledge about a certain issue by virtue of the process of reasoning, an ability which he utilizes in all his mental and verbal activities. The ability to reason improves by way of exercise.

The desire to acquire wisdom by way of reasoning is denominated as philosophy, which in itself should not be labelled as vain deceit. Paul does not label philosophy as vain deceit but indicates that deceptive individuals by the use of reason can formulate that which has a semblance of being reasonable, which, however, very easily could beguile, deceive, and mislead the simple.

One should be on guard for such people and their activity, and listen to Scripture rather than reason. All this, however, has nothing in common with the proper use of reason in attempting to understand Scripture — to use it as a means to extract what is concealed in every text, which is but drawing conclusions on the basis of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 48.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-4b54816448" data-kw="">
<blockquote><p>…those who founded sects committed to erroneous doctrines proceeded in a way that is opposite to this, The point is clear in the case of Muhammad. He seduced the people by promises of carnal pleasure to which the concupiscence of the flesh goads us. His teaching also contained precepts that were in conformity with his promises, and he gave free rein to carnal pleasure. In all this, as is not unexpected, he was obeyed by carnal men. As for proofs of the truth of his doctrine, he brought forward only such as could be grasped by the natural ability of anyone with a very modest wisdom. Indeed, the truths that he taught he mingled with many fables and with doctrines of the greatest falsity. He did not bring forth any signs produced in a supernatural way, which alone fittingly gives witness to divine inspiration; for a visible action that can be only divine reveals an invisibly inspired teacher of truth. On the contrary, Muhammad said that he was sent in the power of his arms—which are signs not lacking even to robbers and tyrants. What is more, no wise men, men trained in things divine and human, believed in him from the beginning, Those who believed in him were brutal men and desert wanderers, utterly ignorant of all divine teaching, through whose numbers Muhammad forced others to become his followers by the violence of his arms. Nor do divine pronouncements on the part of preceding prophets offer him any witness. On the contrary, he perverts almost all the testimonies of the Old and New Testaments by making them into fabrications of his own, as can be seen by anyone who examines his law. It was, therefore, a shrewd decision on his part to forbid his followers to read the Old and New Testaments, lest these books convict him of falsity. It is thus clear that those who place any faith in his words believe foolishly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, I:6</span></figcaption>

<blockquote><p>1. Homeostasis: living things regulate themselves internally and thereby preserve themselves.

3. Adaptation: the organism changes its internal condition so as to maintain itself in its environment.</p></blockquote>

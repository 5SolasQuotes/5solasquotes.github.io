<main class="wrap"><figure class="quote" id="q-fa13cdd0e9" data-kw="">
<blockquote><p>If believers then suffer themselves, surrounded as they are, by the clear light of the blessed gospel, to retain ignorance, or to cherish mistakes, respecting the covenant of Jehovah’s peace, and the infinite fulness and freeness of his grace treasured up – in Christ, the glorious Trustee of that covenant; they do thereby undervalue the only doctrine, on which all true comfort depends, and so, provoke their heavenly Father, to suspend the consolations of his holy covenant, from their souls.

The gospel is an exhibition of God’s covenant of grace, to lost sinners of mankind; and therefore it is “good tidings of great joy to all people.” To be willingly ignorant, then, of that gracious contract, is the same as to be willingly ignorant of the glorious gospel; and to retain mistaken notions of the former, is the same as to err concerning the latter.

When true Christians satisfy themselves with superficial and indistinct views of the covenant of grace, or with knowing little more, than the first principles of the doctrine of that august contract; they so far despise the doctrine of redeeming grace, the joyful tidings of a free salvation, and so lose the joy of that salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh: J. Ogle, 1814), pp 77-78.</span></figcaption>

<blockquote><p>Q. 32 Why is this covenant also called a testament?

A. First, because the term testament began to be used in the church instead of the term covenant.

Second, because just as a testament is not valid without the death of the testator, so also this covenant could not be valid without the death of Christ.

Q. 33 What is the difference between the Old and the New Testament?

A. It is the same testament or covenant of God with all the elect from the first promise given in Paradise, concerning the seed of the woman who would crush the head of the serpent, to the end of the world.

But they are called Old and New Testaments because some of the circumstances and signs of the covenant were changed.

First, in the Old they believed in the Christ who was still to come; in the New we believe in the Christ who has been revealed.

Second, the Old contained the promise of the preservation of the nation of Israel until the time of Christ; in the New we have only the general promise of the preservation of the church under various governments.

Third, the Old had levitical ceremonies, for which, having been abolished in the New, Christ instituted baptism and the Lord’s supper.

Fourth, the Old was more obscure; the New is clearer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Large Catechism</cite>, (1561), trans. Fred H. Klooster and John Medendrop; http://links.christreformed.org/doctrinevision/ursinus_project.pdf.</span></figcaption>

<blockquote><p>And as the enjoyment of God, and so everlasting happiness, was promised in the Old, as well as in the New Testament, so was it promised then too, as well as now, only in Jesus Christ; there being no other Mediator to reconcile God to us, and us to God, because none but he ever was or ever will be both God and man. And whosoever is God only and not man, or man only and not God, can never mediate betwixt God and man. For he that is God only cannot suffer for man; and he that is man only cannot make satisfaction to God: and therefore to make a person capable of suffering for man, and able to satisfy God, and so to mediate betwixt God and man, by suffering for the sins of the one, and satisfying the justice of the other; it is necessary that himself participate of both natures, which being joined together in one Person might so be reconciled to one another.

Now seeing there never was nor ever will be any such person in the world besides Christ, and seeing Christ was exactly such a person, perfect God and perfect man, it necessarily follows, that it was he, and he alone, that could be the Mediator betwixt God and man in the Old as well as in the New Testament: and so that whatsoever promises or overtures were made to the old Fathers were made only in him, without whom they could have enjoyed no mercy, nor have partaked any happiness, either in this world or that which is to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 226-27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-62ffb91a19" data-kw="">
<blockquote><p>The divine affections or virtues are not distinct dispositions or habits that stand as attributes or functions of will, as they do in human beings, but instead are divine perfections that have some analogy to the dispositions or habits of the human will: ‘for though, properly speaking, there are [no affections] in God, he being a most pure and simple act, free from all commotion and perturbation; yet there being some things said and done by him, which are similar to affections in intelligent beings, [sic] they [that] are ascribed to him; as love, pity, hatred, anger etc., from which must be removed everything that is carnal, sensual, or has any degree of imperfection in it.’ (Gill, Complete Body of Divinity, I, p. 112; cf. Synopsis purioris theologiae, VI.xxxix; Turretin, Inst. theol. elencticae, III.xix.1.) Several writers, most notably Venema, treat these affections not only in relation to the divine will, but also as the affective manifestations of the goodness and holiness of God… The basis for this understanding is the assumption that affections are not essential attributes or original properties but, rather, are ad extra manifestations in which God is known through his effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, pp. 557-58</span></figcaption>

<blockquote><p>As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Heads 3–4, Art. 8</span></figcaption>

<main class="wrap"><figure class="quote" id="q-fbeca688eb" data-kw="">
<blockquote><p>My being present and hearing of a Conformist [minister is] no approbation of the evil of his conformity, and so no occasional or transient relation is raised thereby. Approbation is an act of the mind or heart; It is not showed to him or others by me until it be expressed outwardly by my words or gestures, which I have not in this case any occasion to do, his evil being done elsewhere and formerly, and not in our presence that now hear him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Case of Great &amp; Present Use: Whether we may Lawfully Hear the now Conforming Ministers who are Re-ordained &amp; have Renounced the</cite>, [Solemn League &amp;] Covenant &amp; Some of them [are] Supposed to be Scandalous in their Lives, Considered &amp; Affirmatively Resolved (1672; 1677), Consideration 3, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“My being present and hearing of a Conformist [minister is] no approbation of the evil of his conformity, and so no occasional or transient relation is raised thereby. Approbation is an act of the mind or heart; It is not showed to him or others by me until it be expressed outwardly by my words or gestures, which I have not in this case any occasion to do, his evil being done elsewhere and formerly, and not in our presence that now hear him.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9187585789" data-kw="">
<blockquote><p>Things less than fully good, or impure, not inherently wrong, may in some circumstances, especially according to the degree of necessity, be personally, materially done, even in worship, public worship and Church government (though they occasion passive scandal in some), for the good in the things themselves and for attaining higher and weightier goods (in proportion to that degree), while seeking to avoid the greater hurt and scandal, without approving the impurities or what may be deficient in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, 2. “Principled Partial Conformity in Worship” in “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 21-93, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Things less than fully good, or impure, not inherently wrong, may in some circumstances, especially according to the degree of necessity, be personally, materially done, even in worship, public worship and Church government (though they occasion passive scandal in some), for the good in the things themselves and for attaining higher and weightier goods (in proportion to that degree), while seeking to avoid the greater hurt and scandal, without approving the impurities or what may be deficient in them.”

— Travis Fentiman, 2. “Principled Partial Conformity in Worship” in “Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 21-93, p. 48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThings+less+than+fully+good%2C+or+impure%2C+not+inherently+wrong%2C+may+in+some+circumstances%2C+especially+according+to+the+degree+of+necessity%2C+be+personally%2C+materially+done%2C+even+in+worship%2C+public+worship+and+Church+government+%28though+they+occasion+passive+scandal+in+some%29%2C+for+the+good+in+the+things+themselves+and+for+attaining+higher+and+weightier+goods+%28in+proportion+to+that+degree%29%2C+while+seeking+to+avoid+the+greater+hurt+and+scandal%2C+without+approving+the+impurities+or+what+may+be+deficient+in+them.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+2.+%E2%80%9CPrincipled+Partial+Conformity+in+Worship%E2%80%9D+in+%E2%80%9CEditor%E2%80%99s+Extended+Introduction%E2%80%9D+in+English+Puritans%2C+A+Refutation+of+the+Errors+of+Separatists+%281604%3B+RBO%2C+2025%29%2C+pp.+21-93%2C+p.+48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9187585789.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9187585789.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Things%20less%20than%20fully%20good%2C%20or,what%20may%20be%20deficient%20in%20them&amp;text=Things%20less%20than%20fully%20good%2C%20or%20impure%2C%20not&amp;text=impurities%20or%20what%20may%20be%20deficient%20in%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7c8418870d" data-kw="">
<blockquote><p>I own… the worship there performed… as in the preaching of the Word, and prayer before and after sermon, to be in the main sound and good for the substance or matter thereof… Though I judge their form of worship to be in many respects less perfect than is to be desired; yet I have found my heart spiritually affected and raised towards God therein… the lawfulness of partaking in that worship, it being sound for the substance in the main, and the mode thereof being laudable in diverse forms and orders, and passable in the most, though in some offensive, inconvenient, or less perfect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformist’s Plea for Lay-Communion with the Church of England, together with a Modest Defense of Ministerial Nonconformity</cite>, ... (London: 1683), The Nonconformists Plea for Lay-Communion with the Church of England, pp. 5-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“I own… the worship there performed… as in the preaching of the Word, and prayer before and after sermon, to be in the main sound and good for the substance or matter thereof… Though I judge their form of worship to be in many respects less perfect than is to be desired; yet I have found my heart spiritually affected and raised towards God therein… the lawfulness of partaking in that worship, it being sound for the substance in the main, and the mode thereof being laudable in diverse forms and orders, and passable in the most, though in some offensive, inconvenient, or less perfect.”

</figure><figure class="quote" id="q-2b43c99223" data-kw="">
<blockquote><p>Again, he [an episcopalian] argues we cannot be said to be members of a particular Church, or to hold communion with it, if we do not join in their worship, as it is established among them. This is easily answered by a plain distinction: unless we join in their established worship, as to the greatest and chief acts of it, conceditur [it is conceded]: as to all the parts of it, even to the least, negatur [I deny]. I may join with a Church in the Word and sacraments; and yet if they have a holy day or two beside the Sabbath, may forbear; yea I may, without this be a member of that Church (if they will suffer me), which all the Reformed Churches do, except the Episcopal Church of England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10 Rule was a Scottish, divine-right presbyterian., p. 257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-cb2ee6f0c0" data-kw="">
<blockquote><p>Q. 2. How doth it appear that there is a God? A. The very light of nature in man, and the works of God, declare plainly that there is a God;[c] but his word and Spirit only do sufficiently and effectually reveal Him unto men for their salvation.[d] [c] Rom. 1:19,20. Ps. 19:1-3. Acts 17:28. [d] 1 Cor. 2:9. 2 Tim. 3:15-17. Isa. 59:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Larger Catechism</cite></span></figcaption>

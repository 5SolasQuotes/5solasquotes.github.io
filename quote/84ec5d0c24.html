<main class="wrap"><figure class="quote" id="q-84ec5d0c24" data-kw="">
<blockquote><p>This whole place is very obscure: but the obscurity is produced by our ignorance of the facts referred to and by their cessation, being such as then used to occur but now no longer take place. And why do they not happen now? Why look now, the cause too of the obscurity has produced us again another question: namely, why did they then happen, and now do so no more? …Well, what did happen then? Whoever was baptized he straightway spake with tongues and not with tongues only, but many also prophesied, and some also performed many other wonderful works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 407) | On 1st Corinthians, Homily 29, on 12:1-2 in NPNF1, 12:168</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f9f5bf5fb" data-kw="">
<blockquote><p>Moreover, God permits: (1) sometimes in express terms (Col. 2:16, 20–21; Gen. 2:16–17; Lev. 11:2–4), when he removes these or those things from among things prohibited; (2) sometimes only by nowhere prohibiting (cf. Rom. 14:14; Acts 10:15); (3) sometimes also in terms of commanding (Deut. 23:20; Gen. 1:28), just as in the same terms of commanding he sometimes expressly prohibits (Num. 22:20; John 13:27).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 3, ch. 11, section 4, pp. 356-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-d7ac51cc7d" data-kw="">
<blockquote><p>…the ordinary power of working them is ceased: for it was only given to the apostles in the primitive Church, as a means to confirm the doctrine of the Gospel to unbelievers, that never heard of Christ before. So Paul says, ‘Strange tongues’ (that is, the gift of speaking strange languages, without ordinary teaching) ‘are for a sign, not to them that believe, but to them that believe not,’ 1 Cor. 14:22. And for the same end were all extraordinary gifts then given. Howbeit the Papists stand stiffly in defending the continuance of these gifts.</p></blockquote>

<blockquote><p>and upon what Scripture can we pitch for such extraordinary prophets, if not upon those Scriptures…?</p></blockquote>

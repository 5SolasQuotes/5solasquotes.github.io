<main class="wrap"><figure class="quote" id="q-4f8dce999b" data-kw="">
<blockquote><p>As to the second part of my reflections, wherein I doubt concerning the earth’s moving about its axis, it may be I differ from you [John Woodward, a professor of physics, to whom the work is dedicated], and from the generality of Virtuosos [New Philosophers] at this day. But truly I am not so much a [Brahe] Tychonian as to forswear the Copernican Hypothesis: But the truth of the matter is this, when I was treating of the most substantial points of divinity, that is, when I was asserting and vindicating the being and providence of God, I was unwilling to found these or anything belonging to them upon an infirm and unstable basis, upon a dubious and disputable doctrine, and which had not long prevailed in the learned world. Such I take the opinion of the circumgyration of the earth to be: and therefore till I could be absolutely satisfied about the reality of it, I thought it was safest to aquiesce at present in the other doctrine, and the rather because it is suitable to the mundane system which Moses presents us with, whose literal sense of the account of it is not to be slighted by Christian philosophers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brief Remarks upon Mr. [William] Whiston’s New Theory of the Earth &amp; upon an other Gentleman’s Objections Against Some Passages in a Discourse of the Existence &amp; Providence of God, Relating to the Copernican Hypothesis (London, 1697)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

rmalink</a><a class="src" href="https://reformedbooksonline.com/on-geocentricism-heliocentrism/#:~:text=As%20to%20the%20second%20part%20of,to%20be%20slighted%20by%20Christian%20philosophers&amp;text=As%20to%20the%20second%20part%20of%20my%20reflections&amp;text=is%20not%20to%20be%20slighted%20by%20Christian%20philosophers" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c83237651" data-kw="">
<blockquote><p>I answer that the emanation of created things from God is like the procession of artifacts from an artisan. Hence just as artificial forms in matter flow forth from the art of an artisan, so also all natural forms and powers flow from the ideas existing in the divine mind. But because, as Dionysius says, ‘things that are caused preexist in their causes abundantly,’ forms received in matter are not equal to the uncreated power or art from which they proceed. Hence from his art, an artisan still has the power to do something in some other way to what he has made, to which thing the power of his art has not been bound. Similarly, it is within God’s power to add, change, or remove something from created things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences, bk. 2, distinction 18, Creation of Woman, quest. 1, art. 2, I answer that</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>Finally we turn to the perspicuity of nature which corresponds to the perspicuity of Scripture. We have stressed the fact that God’s revelation in nature was from the outset of history meant to be taken conjointly with God’s supernatural communication. This might seem to indicate that natural revelation is not inherently perspicuous. Then too it has been pointed out that back of both kinds of revelation is the incomprehensible God. And this fact again might, on first glance, seem to militate strongly against the claim that nature clearly reveals God. Yet these very facts themselves are the best guarantee of the genuine perspicuity of natural revelation. The perspicuity of God’s revelation in nature depends for its very meaning upon the fact that it is an aspect of the total and totally voluntary revelation of a God who is self-contained. God’s incomprehensibility to man is due to the fact that he is exhaustively comprehensible to himself. God is light and in him is no darkness at all. As such he cannot deny himself. This God naturally has an all-comprehensive plan for the created universe. He has planned all the relationships between all the aspects of created being. He has planned the end from the beginning. All created reality therefore actually displays this plan. It is, in consequence, inherently rational. It is quite true, of course, that created man is unable to penetrate to the very bottom of this inherently clear revelation. But this does not mean that on this account the revelation of God is not clear, even for him. Created man may see clearly what is revealed clearly even if he cannot see exhaustively. Man does not need to know exhaustively in order to know truly and certainly. When on the created level of existence man thinks God’s thoughts after him, that is, when man thinks in self-conscious submission to the voluntary revelation of the self-sufficient God, he has therewith the only possible ground of certainty for his knowledge. When man thinks thus he thinks as a covenant creature would wish to think. That is to say, man normally thinks in analogical fashion. He realizes that God’s thoughts are self-contained. He knows that his own interpretation of nature must therefore be a re-interpretation of what is already fully interpreted by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-van-til.html">Cornelius Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Apologetics</cite>, 2nd ed, (Phillipsburg, NJ: The Presbyterian and Reformed Publishing Company, 2003), ch. 2, sect;5.</span></figcaption>

<blockquote><p>The rise and development of Socinianism in the seventeenth century cannot entirely account for the variant trinitarianisms of the age, including the English debates of the 1640s and 1650s, the variant language and historical perspectives of the Cambridge Platonists, and the doctrinal alternative proposed by Milton. In addition to the spread of a rational and biblicistic Socinian critique of traditional dogmatic language, the antitrinitarianism of the era was also fueled by developments in philosophy that challenged either the Christianized versions of Aristotelianism that had been the norm in theological usage or the older Aristotelian models themselves. The new philosophies of the seventeenth century tended to detach themselves from traditional conceptions of essence, substance, and individuality and, in so doing, critiques not only the older philosophy but also the theology that had grown attached to it and had reached, during the course of centuries, a linguistic concordat with traditional philosophical vocabulary. Notable here is the alteration in meaning of such terms as “substance” and “essence” that can be traced among the various philosophical schools of the seventeenth century. In 1611, Randle Cotgrave defined the French substance as “substance, matter, stuffe,” substanciel as “substantiall, stuffie,” and essence as “an essence or being, the nature or subsistence of things”—perhaps reflecting a movement away from the older dual philosophical usage of “essence” to mean both the individuality and the quiddity, or whatness, of a thing, toward understanding the term in a more material and exclusively individual sense, perhaps more as haeccitas [this-ness] than as quidditas [what-ness]. His definition of substance, moreover, carries only the connotation of primary substance, the actual stuff or material identity of a thing, and not the connotation of secondary substance, the species or genus of a thing. Of course, when one looks to the technical manuals, there is little difference on the point between Thomas Wilson’s Rule of Reason (1551/52) and Thomas Spencer’s Art of Logick (1628): both offer the identification of “first” or primary substance as the individual thing and “second” or secondary substance as the kind of thing, namely, the species or genus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, , ed. (Baker Academic, 2003), vol. 4, pp. 99–100</span></figcaption>

<blockquote><p>We should, in our own churches, keep to apostolic precedent, and follow the rule of Christ in all things. No venerable name is sufficient authority for going aside from Holy Scripture. &quot;To the law and to the testimony;&quot; if a doctrine or a ceremony is not there, it is nowhere for you and for me. Our sole authority is the Word of the Lord.</p></blockquote>

</figure><figure class="quote" id="q-a7d656db67" data-kw="Augustine Authority of the church">
<blockquote><p>Augustine, therefore, does not here say that the faith of the godly is founded on the authority of the Church; nor does he mean that the certainty of the gospel depends upon it; … the obvious inference from them is, that this holy man had no intention to suspend our faith in Scripture on the nod or decision of the Church, but only to intimate (what we too admit to be true) that those who are not yet enlightened by the Spirit of God, become teachable by reverence for the Church, and thus submit to learn the faith of Christ from the gospel. In this way, though the authority of the Church leads us on, and prepares us to believe in the gospel, it is plain that Augustine would have the certainty of the godly to rest on a very different foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.7.3</span></figcaption>

</figure><figure class="quote" id="q-c00aba9715" data-kw="">
<blockquote><p>Both Roman Catholicism and liberal modernism, though fiercely opposed to each other through much of their history, draw from the same poisoned well: the exaltation of man over the Word of God. One exalts church leaders, especially the pope, as its divinely reliable guide. The other exalts human reasoning and/or feelings as the supreme judge of religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-r-beeke-paul-m-smalley.html">Joel R. Beeke &amp; Paul M. Smalley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Systematic Theology</cite>, vol. 1, ch. 15</span></figcaption>

<main class="wrap"><figure class="quote" id="q-06dba7071a" data-kw="">
<blockquote><p>5. Remember, that you have all but one end and one aim, that is, you are all of you elected and called to this assembly for the glory of your God, the honor of your king, the welfare of his people, the peace and purity of the Church, the punishing of offenders, the reforming of abuses and the taking away of all polluted and pernicious doctrines and practices from amongst us. And then the remembrance hereof will be a means to make you one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-ward.html">Richard Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principal Duty of Parliament-Men, or, A Short &amp; Compendious Treatise Concerning the Unity &amp; Unanimity which Should be in the Members of that Honourable Assembly</cite>, (London, 1641), p. 46. Ward, a civil officer, was speaking to the English parliament.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d8618aa4d" data-kw="">
<blockquote><p>19. Also we judge it our duty to preach those plain and necessary things which the salvation of men does most depend on, and the people generally have most need to hear; that is, the opening to them their Baptismal Covenant, and the Articles of the [Apostles’] Creed, the Lord’s Prayer, the Decalogue and the Gospel-precepts; or more briefly the doctrine of faith in Christ, and repentance towards God, and of the love of God and man; to live soberly, righteously, and godly in this world, as looking and hoping for a better, Tit. 2:12. And not to fill the people’s heads with needless controversies, or vain jangling, or contending about words which edify not, but subvert the hearers; much less to perplex them with talking of the unrevealed counsels of God; nor yet to corrupt their minds by talking against our superiors, or against dissenters behind their backs, or by aggravating the faults of other men’s manner of worshipping God, or breeding in them distaste of the public worship; or talking against bishops, or ceremonies, or liturgy; nor by representing any sort of Christians who differ from us in points not fundamental, as odious to the hearers; whether Lutherans, Calvinists, Arminians, Episcopal, Presbyterian, Independent, yea or Anabaptists; no, nor to injure the Papists themselves, by making our differences seem greater than indeed they are. Our office is to preach up love, and not to preach it down and mortify it, which all those do, whatever they pretend, that attempt to represent their brethren as odious, and to hide or deny, or extenuate that in them which is good and amiable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Nonconformists’ Ministry, containing: I. the Reasons of their Preaching, II. an Answer to the accusations urged as reasons for the silencing of about 2000</cite>, … (1668-1669; 1675; London: 1681), pp. 18-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-6a2af103e9" data-kw="">
<blockquote><p>Calvin never for a moment ceased to view the Church in its totality and, as Karl Holl has noted, his ecumenicity took root in the Churches organized under his influence, resulting in a strong feeling of unity and an active intercourse between them. In conflicts within Calvinism, national difference has never played a part. In this ecumenical consciousness he sought, in fact, a ‘syncretism’ (a word employed in his Catechism) among Protestants. Calvin never drew the bounds of communion in terms of assent to one confession of faith… He sought to lay the foundation of a Europe-wide communion, with a doctrinal basis clearly but not narrowly defined. He hoped to obtain this by mutual deliberation and conciliar action. Had his aims been achieved, Protestantism would have taken the outlines of a Church ecumenical and conciliar, autonomous vis-a-vis the State though protected by it. The design of Calvin has the grandeur of a world-embracing Christian order… The three Protestantisms [Reformed, Zwinglian and Luthern] had become two [as the Zwinglian and Reformed merged], and Calvin never lost hope that the two would become one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Calvin | John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967), p. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Calvin never for a moment ceased to view the Church in its totality and, as Karl Holl has noted, his ecumenicity took root in the Churches organized under his influence, resulting in a strong feeling of unity and an active intercourse between them. In conflicts within Calvinism, national difference has never played a part. In this ecumenical consciousness he sought, in fact, a ‘syncretism’ (a word employed in his Catechism) among Protestants. Calvin never drew the bounds of communion in terms of assent to one confession of faith… He sought to lay the foundation of a Europe-wide communion, with a doctrinal basis clearly but not narrowly defined. He hoped to obtain this by mutual deliberation and conciliar action. Had his aims been achieved, Protestantism would have taken the outlines of a Church ecumenical and conciliar, autonomous vis-a-vis the State though protected by it. The design of Calvin has the grandeur of a world-embracing Christian order… The three Protestantisms [Reformed, Zwinglian and Luthern] had become two [as the Zwinglian and Reformed merged], and Calvin never lost hope that the two would become one.”

— John Calvin, On Calvin | John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967), p. 52">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCalvin+never+for+a+moment+ceased+to+view+the+Church+in+its+totality+and%2C+as+Karl+Holl+has+noted%2C+his+ecumenicity+took+root+in+the+Churches+organized+under+his+influence%2C+resulting+in+a+strong+feeling+of+unity+and+an+active+intercourse+between+them.+In+conflicts+within+Calvinism%2C+national+difference+has+never+played+a+part.+In+this+ecumenical+consciousness+he+sought%2C+in+fact%2C+a+%E2%80%98syncretism%E2%80%99+%28a+word+employed+in+his+Catechism%29+among+Protestants.+Calvin+never+drew+the+bounds+of+communion+in+terms+of+assent+to+one+confession+of+faith%E2%80%A6+He+sought+to+lay+the+foundation+of+a+Europe-wide+communion%2C+with+a+doctrinal+basis+clearly+but+not+narrowly+defined.+He+hoped+to+obtain+this+by+mutual+deliberation+and+conciliar+action.+Had+his+aims+been+achieved%2C+Protestantism+would+have+taken+the+outlines+of+a+Church+ecumenical+and+conciliar%2C+autonomous+vis-a-vis+the+State+though+protected+by+it.+The+design+of+Calvin+has+the+grandeur+of+a+world-embracing+Christian+order%E2%80%A6+The+three+Protestantisms+%5BReformed%2C+Zwinglian+and+Luthern%5D+had+become+two+%5Bas+the+Zwinglian+and+Reformed+merged%5D%2C+and+Calvin+never+lost+hope+that+the+two+would+become+one.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+On+Calvin+%7C+John+T.+McNeill%2C+ch.+1.+%E2%80%9CThe+Ecumenical+Idea+%26+Efforts+to+Realize+it%2C+1517-1618%E2%80%9D+in+eds.+Ruth+Rouse+%26+Stephen+C.+Neill%2C+A+History+of+the+Ecumenical+Movement%3A+1517-1948+%28Philadelphia%2C+1967%29%2C+p.+52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a2af103e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a2af103e9.html">Permalink</a><a class="sr

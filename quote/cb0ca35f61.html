<main class="wrap"><figure class="quote" id="q-cb0ca35f61" data-kw="">
<blockquote><p>When [Amyraldianism] urges that the Bible teaches that both by divine decree and in history Christ’s death, represented by it as unrestricted regarding its referents, was intended to save all men without exception (the doctrine of universal atonement), Amyraldianism must necessarily join forces with Arminian universalism which… shares this aspect of its vision and turn away altogether from a real substitutionary atonement…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-reymond.html">Robert L. Reymond</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A New Systematic Theology of the Christian Faith (Nashville, TN: Thomas Nelson, 1998), p. 478; The italics are Reymond’s.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-90d8795383" data-kw="">
<blockquote><p>John Cameron [the teacher of Amyraut] set the tendency in motion which in different lands has tried to mediate between the consistent scheme of the Reformed Faith and the Arminianism which was set aside by the findings of the Synod of Dordt… The issues of his mongrel compromising teaching were far reaching. The church of his adoption felt the effects of his teaching to such an extent as that the Theology of the later Huguenots was to a large extent revolutionised. Their influence in turn told on Richard Baxter and on all the varieties of teaching that can be traced back to his type of doctrine. It affected the thinking of New England; and as a return tide on its way back over the Atlantic it determined the teaching of the English Edwardians, both Independent and Baptist. The force of the current that was thus changing the older Calvinism beat at last on the Reformed teaching of Scotland in circles other than those of the Neonomians. It found more channels than one in which to flow. New England Revivalism did its share of the work; and the influence of modern Calvinism in English Nonconformity also contributed its quota. Along with the disintegrating work of the New Light movement, which was of home [i.e., Scottish] growth and which spoke of an uneasy spirit of dissatisfaction with long accepted truth and of a restlessness that was in quest of something new, the various streams of influence that derived remotely from Cameron are responsible for the collapse of the Confessional orthodoxy which had for ages found a home in his native country.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-macleod.html">John Macleod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scottish Theology</cite>, pp. 61-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-86e1b9f0ad" data-kw="">
<blockquote><p>…the equation of application with efficacy was not so much the problem as the identification of sufficiency with impetration or accomplishment. That Christ’s death was sufficient for all did not imply that it had actually and intentionally accomplished salvation for all. In none of these theologies, Du Moulin notes, does this universal, general redemption involve the bestowing of faith on any individual—and yet there is no salvation apart from faith.[137] This general decree, which does not involve the gift of faith, also can be framed, Du Moulin indicates, quite absurdly, to mean that Christ has died for the reprobate according to divine “intention” but not according to “outcome [evenement].”[138] In a line of argument that cuts against Davenant’s version of hypothetical universalism as well as Amyraut’s, Du Moulin concludes that it is also quite unconvincing to argue that God might have a truly universal “intention” to save all human beings but also not will to save all: if God wills to save only some, it must clearly be the divine intention only to save some.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-a-muller.html">Richard A. Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin and the Reformed Tradition: On the Work of Christ and the Order of Salvation</cite></span></figcaption>

</figure><figure class="quote" id="q-9268f81703" data-kw="">
<blockquote><p>In fact it seems much more accurate to say that Amyraut was the real Reformed “scholastic,” and “Reformed Thomas Aquinas,” the balancer, the synthesizer, the creator of new categories, and structures. And Reformed orthodoxy, with its insistence on limited redemption, was actually a primitive throwback to the rigorous and markedly non-rationalistic particularism of Augustine and Gottschalk. Under whatever label, John Calvin, as a limited redemptionist, belongs historically with Augustine, Gottschalk, Bucer, Beza and Reformed orthodoxy–not with Amyraut.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-rainbow.html">Jonathan Rainbow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Will of God and the Cross (Allison Park, PA: Pickwick Publications, 1990)</cite>, p. 62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-9e67fe5e0e" data-kw="">
<blockquote><p>Now when God says expressly (as if He would make it impossible for any mortal to misconceive Him) that Christ is the Savior, the propitiation, the taster of death, not only for all men, but for every man, not only for the world, but for the whole world, and to prove He speaks of an intention to save them all without exception (if by the wickedness of their wills they do not frustrate his intention, as the greater part of men do, by not accepting his offer and not performing the conditions on which his offer is made), He professes He is not willing that any should perish, but [on the contrary] that all should come to repentance, 2 Pet. 3:9.</p></blockquote>

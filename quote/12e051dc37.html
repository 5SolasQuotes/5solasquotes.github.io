<main class="wrap"><figure class="quote" id="q-12e051dc37" data-kw="">
<blockquote><p>Let us now come to the use which may be made of the crucifying of Christ. First of all here we learn with bitterness to bewail our sins: for Christ was thus cruelly nailed on the cross, and there suffered the whole wrath of God, not for any offence that ever he committed, but being our pledge and surety unto God, he suffered all for us: and therefore just cause have we to mourn for our offences, which brought our Saviour Christ to this low estate. If a man should be so far in debt that he could not be freed, unless the surety should be cast into prison for his sake; nay, which is more, be cruelly put to death for his debt, it would make him at his wit’s end; and his very heart to bleed.

And so is the case with us by reason of our sins; we are Gods debtors, yea bankrupts before him, yet have we gotten a good surety, even the son of God himself, who to recover us to our former liberty was crucified for the discharge of our debt. And therefore good cause have we to bewail our estate every day, as by the prophet it is said, They shall look on him whom they have pierced, they shall lament for him as one mourneth for his own son: they shall be sorry for him as one is sorry for his first born.

Look as the blood followed the nails that were stricken through the blessed hands and feet of Christ, so should the meditation of the cross and passion of our Redeemer be as it were nails and spears to pierce us, that our hearts might bleed for our sins: and we are not to think more hardly of the Jews for crucifying him then of our selves, because even by our sins we also crucified him. These are the very nails which pierce his hands and feet, and these are the spears which pierce through his side. For the loss of a little worldly pelfe [pleasure?], oh how are we grieved! but seeing our transgressions are the weapons whereby the son of God was crucified, let vs (I say it again and again) learn to be grieved for them above all things, and with bleeding and melting hearts bow and buckle under them, as under the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 333.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dd4f37eeec" data-kw="">
<blockquote><p>We are further here also to observe in this our Melchisedeck, that as he had no Mother, in regard of one of his natures, so he was to have no Father in regard of the other; but must be born of a pure and immaculate Virgin, without the help of any man. And this also was most requisite, as for other respects, so for the exemption of the assumed nature from the imputation and pollution of Adam’s sin. For sin having by that one man entered into the world; every Father becometh an Adam unto his child, and conveyeth the corruption of his Nature unto all those whom he doth beget.

Therefore our Saviour assuming the substance of our Nature, but not by the ordinary way of natural generation, is thereby freed from all the touch and taint of the corruption of our flesh; which by that means only is propagated from the first man unto his posterity. Whereupon, he being made of man, but not by man, and so becoming the immediate fruit of the womb and not of the Loins; must of necessity be acknowledged to be that HOLY THING, which so was born of so blessed a Mother, who although she were but the passive and material principle of which that precious flesh was made, and the holy Ghost the agent and efficient; yet cannot the man Christ Jesus thereby be made the Son of his own Spirit. Because Fathers do beget their children out of their own substance: the holy Ghost did not so, but framed the flesh of him, from whom himself proceeded, out of the creature of them both, the hand-maid of the Lord; whom from thence all generations shall call blessed.

That blessed womb of hers was the bride-chamber, wherein the Holy Ghost did knit that indissoluble knot betwixt our human nature and his Deity: the Son of God assuming into the unity of his Person that which before he was not; and yet without change (for so must God still be) remaining that which he was. Whereby it came to pass, that this holy thing which was borne of her was indeed and in truth to be called the SON of GOD.

Which wonderful connexion of two so infinitely differing natures in the unity of one person, how it was there effected; is an inquisition fitter for an Angelical intelligence, than for our shallow capacity to look after. To which purpose also we may observe, that in the fabric of the Ark of the Covenant, the posture of the faces of the Cherubim’s toward the Mercy-seat (the type of our Saviour) was such, as would point unto us, that these are the things which the Angels desire to stoop and look into.

And therefore let that satisfaction, which the Angell gave unto the Mother Virgin (whom it did more specially concern to move the question, How may this be?) content us, The power of the highest shall over-shadow thee. For as the former part of that speech may inform us, that with God nothing is impossible: so the latter may put us in mind, that the same God having over-shadowed this mystery with his own veil, we should not presume with the men of Bethshemesh to look into this Ark of his; least for our curiosity we be smitten, as they were.

Only this we may safely say, and must firmly hold: that as the distinction of the Persons in the holy Trinity hindreth not the Unity of the Nature of the God-head, although every person entirely holdeth his own incommunicable property; so neither doth the distinction of the two Natures in our Mediator any way cross the unity of his Person, although each nature remaineth entire in it self, and retaineth the properties agreeing thereunto, without any conversion, composition, commixtion or confusion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immanuel, or, The Mystery of the Incarnation of the Son of God Unfolded</cite>, (Oxford: Leonard Lichfield, 1643), pp 11-15.</span></figcaption>

<blockquote><p>But what of Schleiermacher, that man of colossal intellect, equally distinguished as a metaphysician and a critic? Well, that great man was the subject of a life-struggle between admiration, almost idolatrous, of the purely human excellence of Jesus of Nazareth on the one hand, and, on the other, an unconquerable inability to receive the simple testimony of the records from which alone it is derived. He had a faith which he could never shake off in the historic reality and transcendent perfection of the Man Christ Jesus. That faith, I believe, was the happy fruit of indelible impressions received by him, and deep emotions stirred within him, in his student days, at a Moravian establishment, whither his clerical father had sent the youth, seeing in him buddings of rare promise, as an asylum from the growing scepticism of Germany in his day.

In that establishment the worship of Christ as the proper embodiment of the whole Godhead, which characterises that remarkable sect, resounded daily, almost for hours, in the music and the prayers, in every varied form; and though he winced at it intellectually, the effect upon him was to plant, deep in his great soul, an image of that Object of worship which he was never able quite to disown. But a certain sceptical tendency, which was natural to him, rose against the Biblical view of Christ, and, to some extent, even of God himself. Working on metaphysical problems, with a Platonic cast of mind, he was smitten with admiration of the Pantheistic conception of the universe developed by Spinoza; and though his soul was incapable of resting in the cold dialectics of pure Spinozism, it imparted a certain tainted element to his Theism, not undiscernible by the intelligent reader of his Glaubenslehre.

But Schleiermacher was no less distinguished for critical penetration than for metaphysical acumen; and when he applied this critical faculty to the documents of our faith, its effect was all the more baneful than in the direction of metaphysics, that it told upon a class many times more numerous, and was capable of influencing society far more extensively than the students of metaphysics. Going outside the Gospel History, and sitting upon it, he brought to bear upon it what the Germans call the kritiches Gefühl, or the principles of that higher criticism which owes more to Schleiermacher than to any other single critic.

In doing this, he first dissolved the whole history into a heap of traditional fragments, then, comparing the different accounts of the same events in the evangelical narratives, he found them to a large extent conflicting; and, finally, out of the whole materials before him, he extracted, in the exercise of his critical instinct, what he deemed the true historical Jesus, the noblest and most beautiful representative of a Godlike and God-filled Humanity. But Humanity only could Schleiermacher see in Christ—a fontal Humanity, indeed, that of a Second Adam, but still pure Humanity, beauteous, even perfect, but nothing more.

Spending his great critical strength in anatomising the several narratives, making chemical compounds of their detached sections, the result was that, in respect of substance and phraseology, that glorious Personality which stands out so brightly to the view of others was obscured to him. Burrowing among his critical materials, the great Object of whom they treat presented itself to him in broken lights, and aspects in a great measure distorted. No better illustration of this will be found than in his view of the Miraculous Conception. This he could not take in. He regarded our Lord as having come into the world like all other descendants of the first pair: that was the result of his criticism, if not of a foregone conclusion. But unable to see how so spotless a life could spring from a birth tainted with the hereditary stain, he held that by some mysterious operation upon the parents this offspring of theirs was preserved from the hereditary taint.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-brown.html">David Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Miraculous Conception of our Lord Jesus Christ: its Truth and Place in New Testament Christianity in British and Foreign Evangelical Review</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“But what of Schleiermacher, that man of colossal intellect, equally distinguished as a metaphysician and a critic? Well, that great man was the subject of a life-struggle between admiration, almost idolatrous, of the purely human excellence of Jesus of Nazareth on the one hand, and, on the other, an unconquerable inability to receive the simple testimony of the records from which alone it is derived. He had a faith which he could never shake off in the historic reality and transcendent perfection of the Man Christ Jesus. That faith, I believe, was the happy fruit of indelible impressions received by him, and deep emotions stirred within him, in his student days, at a Moravian establishment, whither his clerical father had sent the youth, seeing in him buddings of rare promise, as an asylum from the growing scepticism of Germany in his day.

In that establishment the worship of Christ as the proper embodiment of the whole Godhead, which characterises that remarkable sect, resounded daily, almost for hours, in the music and the prayers, in every varied form; and though he winced at it intellectually, the effect upon him was to plant, deep in his great soul, an image of that Object of worship which he was never able quite to disown. But a certain sceptical tendency, which was natural to him, rose against the Biblical view of Christ, and, to some extent, even of God himself. Working on metaphysical problems, with a Platonic cast of mind, he was smitten with admiration of the Pantheistic conception of the universe developed by Spinoza; and though his soul was incapable of resting in the cold dialectics of pure Spinozism, it imparted a certain tainted element to his Theism, not undiscernible by the intelligent reader of his Glaubenslehre.

But Schleiermacher was no less distinguished for critical penetration than for metaphysical acumen; and when he applied this critical faculty to the documents of our faith, its effect was all the more baneful than in the direction of metaphysics, that it told upon a class many times more numerous, and was capable of influencing society far more extensively than the students of metaphysics. Going outside the Gospel History, and sitting upon it, he brought to bear upon it what the Germans call the kritiches Gefühl, or the principles of that higher criticism which owes more to Schleiermacher than to any other single critic.

In doing this, he first dissolved the whole history into a heap of traditional fragments, then, comparing the different accounts of the same events in the evangelical narratives, he found them to a large extent conflicting; and, finally, out of the whole materials before him, he extracted, in the exercise of his critical instinct, what he deemed the true historical Jesus, the noblest and most beautiful representative of a Godlike and God-filled Humanity. But Humanity only could Schleiermacher see in Christ—a fontal Humanity, indeed, that of a Second Adam, but still pure Humanity, beauteous, even perfect, but nothing more.

Spending his great critical strength in anatomising the several narratives, making chemical compounds of their detached sections, the result was that, in respect of substance and phraseology, that glorious Personality which stands out so brightly to the view of others was obscured to him. Burrowing among his critical materials, the great Object of whom they treat presented itself to him in broken lights, and aspects in a great measure distorted. No better illustration of this will be found than in his view of the Miraculous Conception. This he could not take in. He regarded our Lord as having come into the world like all other descendants of the first pair: that was the result of his criticism, if not of a foregone conclusion. But unable to see how so spotless a life could spring from a birth tainted with the hereditary stain, he held that by some mysterious operation upon the parents this offspring of theirs was preserved from the hereditary taint.”

<blockquote><p>The two records of it are held to be inconsistent with and exclusive of each other.

Schleiermacher holds that each of them is credible in some particulars, while in others each of them contains matter which cannot be received as fact. In point of style, Matthew’s narrative is the most naked prose; Luke’s is for the most part poetry, with prosaic bits, which are probably from a different: hand. Luke finds both parents resident at Nazareth, their presence at Bethlehem being but accidental: Matthew knows nothing of a family residence at Nazareth; with him their proper place of residence is Bethlehem, where they would have settled as a matter of course on their return with the Child from Egypt, but for a divine warning not to do so, but to go to Galilee, and dwell at Nazareth. Leaving his readers to choose between these contradictions, for himself he is disposed to think there is a basis of truth in Matthew’s unadorned prose; whereas Luke’s story is such a mixture of prose and poetry—of probable fact and too probable fable—that we cannot accept it.

Strauss, and after him Keim, hold that since Luke places the angelic visit to Mary before the Conception, while in Matthew the same angel appears, not to Mary, but to Joseph, and not before, but after, the Conception, therefore the two accounts are irreconcilable. Never, I venture to say, was more frivolous objection to the consistency of any Biblical narrative advanced. Yet Meyer, I regret to say, endorses it. In Germany such things may be accounted formidable objections, but in this country I do not believe there is one critic, of any name for impartiality and grasp, who sees, or even imagines, any discrepancy between the two records. Who that is not seeking some pretext for getting rid of the stupendous fact would find any inconsistency between a divine announcement to the Virgin Mary, to prepare her for what had never occurred in the history of human births before, and a subsequent visit to Joseph, to set his troubled mind at rest as to the condition of his betrothed, and assure him that there was no bar to the honourable connection to which he was looking forward?

Before passing from this objection, let us notice in a word or two the poetry which Schleiermacher finds in Luke’s narrative. With what different eyes do some read those words of the evangelist where doubtless the poetry is supposed to lie!— “The Holy Ghost shall come upon thee, and the power of the most High shall overshadow thee.” For myself, I have always been at a loss to say whether the sublimity of them or their exquisite delicacy is the more to be wondered at. Calvin, I observe, was struck with the same features of them; and I cannot conceive how any reader, whose taste in the phraseology of sacred things has been cast in a Biblical mold, can fail to participate in this feeling. With Schleiermacher it is all poetry; but I am persuaded that the tastes and instincts of every healthy critic, as well as private Christian, in this country, will leave the poetical view of this narrative to those who can bring themselves to surrender the fact which it expresses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-brown.html">David Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Miraculous Conception of our Lord Jesus Christ: its Truth and Place in New Testament Christianity in British and Foreign Evangelical Review</cite></span></figcaption>

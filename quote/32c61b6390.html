<main class="wrap"><figure class="quote" id="q-32c61b6390" data-kw="">
<blockquote><p>only we may observe, that though there may such a thing be allowed to the Will, in actu primo [its first act], which the Schools call Simultas potentiae [simultaneous potentialities], by virtue where of the Will, according to its own nature, is capable of acting or not acting, or acting either thus or contrarily; and is capable of acting thus now, and is afterwards capable of revoking that act: nay indeed, this is the root of the liberty of the Will. Nevertheless, in actu secundo [the following act], or which the Schools call Potentia Simultatis [a potency for simultaneous alternatives], which is in the Wills applying itself to its act, it does not then act Indifferently, but upon choice, by which it is determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Reply to Mr. George Kieth, as quoted in Muller, Divine Will</cite>, p. 290. Willard was a New England puritan and here follows the paradigm laid out in Turretin, that an initial free deliberation and power of the soul to alternatives ought to be distinguished from when the soul chooses its choice and no longer remains indifferent towards it, but determines it and follows through upon it.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

al-necessity/#:~:text=only%20we%20may%20observe%2C%20that%20though,choice%2C%20by%20which%20it%20is%20determined&amp;text=only%20we%20may%20observe%2C%20that%20though%20there%20may&amp;text=but%20upon%20choice%2C%20by%20which%20it%20is%20determined" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-773f6e2763" data-kw="">
<blockquote><p>God is said to have ceased from creating new creatures on the seventh day in that nothing has later been made that did not previously precede in some likeness in genus or species, or at least in seedlike principle or even as in obediential potency. Therefore I say that the world’s future renewal did pre-exist in the works of the six days in a kind of remote likeness, namely, in the glory or grace of the angels. It also preceded in obediential potency, which was then implanted in creation for the reception of such a renewal by God as agent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 48, quest. 2, The Renewal of the World, art. 1, Whether there is going to be a renewal of the world, Reply to obj. 3, bk. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-ddacbd6460" data-kw="">
<blockquote><p>Free will, in the sense of those [errorists] who maintain it, is [said to be] a power in the will to incline either way, when that which is supernatural and saving is offered as its object; a power and freedom in the will to choose or refuse, to yield or resist, to embrace or reject, as it list. So that this with them is twofold: … 2. To choose, or embrace. The will, they [errorists] say, can incline to that which is spiritually and supernaturally good. They speak not of a capacity, which is not denied, but of an active power. A natural man, by the power of his will, as he can reject Christ, so he can embrace Him; as he can resist converting grace, so he can yield to it as he will; the will can incline itself to this as well as to the other. This is a true representation of their opinion in the other branch of it. Against which we say…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Man’s Insufficiency to do Anything of Himself’, on John 15:5, in The Works of David Clarkson</cite>, vol. 2, p. 128-29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-69a6893b9f" data-kw="">
<blockquote><p>XXIII. The mode by which God acts in efficacious vocation having now been explained, it remains for us to see how man conducts himself toward it. Here, there can be a twofold notion of man, as he is considered either in the first act of conversion or in the second act. Considered in the former, he behaves purely passively toward the efficacy of his vocation, contributing nothing as such, only receiving what is impressed upon him from elsewhere. XXIV. In the second act, however, there is some operation of man, and here he also performs his parts, so that he himself acts, believes, and wills rightly; yet in such a way that he perfects all these things in the virtue of the Holy Spirit as the principal mover. He indeed moves himself, but as one who has been moved, and thus he receives all good inclinations from Him, by which he is active (Phil. 2:12-13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-a6012a06a9" data-kw="">
<blockquote><p>From what has been said it is now easy to gather that liberty does survive in our choice, even after sin, a liberty that is essential to man’s nature, one by which all the worst men, whatever they do, do it freely; yet not such a liberty as is independent from the first cause, nor which is fitted with strength for spiritual good, to accomplish it spiritually, and in this respect it is rather called enslaved than free.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3 | section 11, p. 527, bk. 4, ch. 4, ‘The Penalty &amp; State of Sin’</span></figcaption>

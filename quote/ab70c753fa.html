<main class="wrap"><figure class="quote" id="q-ab70c753fa" data-kw="">
<blockquote><p>To whatever business anyone is devoted, it may be expected that his perfection in it shall be answerable to the time he has had to learn and perfect himself. Christians should not always remain babes, but should grow in Christian knowledge; and leaving the food of babes, which is milk, should learn to digest strong meat.

Doctrine. Every Christian should make a business of endeavouring to grow in knowledge in divinity.

This is indeed esteemed the business of divines and ministers: it is commonly thought to be their work, by the study of the Scriptures, and other instructive books, to gain knowledge; and most seem to think that it may be left to them, as what belongeth not to others. But if the Apostle had entertained this notion, he would never have blamed the Christian Hebrews for not having acquired knowledge enough to be teachers: or if he had thought that this concerned Christians in general only as a thing by the bye, and that their time should not in a considerable measure be taken up with this business, he never would have so much blamed them, that their proficiency in knowledge had not been answerable to the time which they had had to learn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Importance and Advantage of a Thorough Knowledge of Divine Truth</cite>, in Harry S. Stout (ed.) Sermons and Discourses, 1739-1742: The Works of Jonathan Edwards Volume 22 (New Haven: Yale University Press, 2003), p. 85.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36242d952b" data-kw="">
<blockquote><p>Union may also be consistent with many particular failings and defects in the exercise of government; and possibly the sparing of so corrupt officers and members, yea, the censuring of some unjustly, or the admission of some that are unfit for the ministry, and such like. These indeed are faults, but they are not such as make a Church to be no Church. And though these have sometimes been pretended to be the causes of schisms and divisions in the Church in practice, yet were they never defended to be just grounds of schisms and divisions, but were ever condemned by all councils and fathers, and cannot be in reason sustained. Sure there were such corrupt acts of all kinds among the Jews’ Church officers: Yet is it clear that Nicodemus and Joseph of Arimathea did continue to govern jointly notwithstanding thereof, who yet cannot be counted accessory to any of their deeds, because (which is a third reason) men in such cases have access, even when they are present, to discountenance such corrupt acts by not consenting thereto, and testifying against the same; yea, they may by so doing stand in the way of many wicked acts, which by dividing they cannot do, which is sufficient for their exoneration both before God and men: As we may see in the instances of Joseph and Nicodemus mentioned, who continued united in the government, kept the meetings even when sentences pass against those who will acknowledge Christ, and orders for persecuting Him and them. And yet they are declared free, because they dissented from, and testified against the same: Yea, their freedom and exoneration, by virtue of their dissent, being present, is more solemnly recorded to their honor in the Gospel, than if they had divided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>6. Whatever sad differences be oft amongst these [Christians], which both their darkness of mind and contrariety of natural dispositions may influence, yet does not still that blessed unity of the Spirit stand fixed and sure, by which the whole race of the saints are united in a new and spiritual nature in these sweet and sensible communications of the Spirit, and do all meet in one blessed center, yea so near an intercourse of souls and sympathy does result thence (however the sad prevalence of corruption may for some time darken the same) as no union and concord like this is in all the societies of the earth, and may be such a witness to the truth of Christianity, as to silence even the greatest atheist.</p></blockquote>

<blockquote><p>Conclusion 1. The appearing-holiness of those who hold an opinion is not enough to demonstrate it a truth. A man may be in a dangerous (I had like to have said, damning) error, and yet to the view of men appearingly-holy. Many men have put on a form of godliness, and shew of holiness, till they have gotten strength and power enough to back them in their opinions, and then they have discovered the venom of their spirits, and let loose their spirits to those corrupt ways which their erroneous understandings did lead them to.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, ... (1646), p. 164</span></figcaption>

<main class="wrap"><figure class="quote" id="q-61419e104d" data-kw="">
<blockquote><p>[T]hat we might, at this spiritual altar, see Christ (as it were) crucified before our eyes, cling unto his cross, and grasp it in our arms, suck in his blood, and with it salvation; put in our hands, with Thomas, not out of diffidence, but out of faith, into his side, and fasten our tongues in his sacred wounds; that being all over died with his blood, we may use boldness, and approach to the throne of grace, lifting up unto Heaven, in faith and confidence of acceptance, those eyes and hands which have seen and handled him, opening wide that mouth which hath received him, and crying aloud with that tongue which, having tasted the bread of life, hath from thence both strength and arguments for prayer to move God for mercy.

This then is a singular benefit of this Sacrament, the often repetition and celebration whereof, is (as it were) the renewing, or rather the confirming with more and more seals our patent of life; that by so many things, in the smallest whereof it is impossible for God to lie, we might have strong consolation, who have our refuge to lay hold on him, who in these holy mysteries is set before us: for the Sacrament is not only a sign to represent, but a seal to exhibit that which it represents.

In the sign we see, in the seal we receive, him; in the sign we have the image, in the seal the benefit, of Christ’s body: for the nature of a sign is to discover and represent that which in itself is obscure or absent, as words are called signs and symbols of our invisible thoughts: but the property of a seal is to ratify and to establish that which might otherwise be ineffectual: for which cause, some have called the Sacrament by the name of ‘a ring,’ which men use in sealing those writings, unto which they annex their trust and credit. And as the Sacrament is a sign and seal from God to us, representing and exhibiting his benefits, so should it be a sign and seal from us to God; a sign to separate us from sinners, a seal to oblige us to all performances of faith and thankfulness on our part required.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 83-84.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-00576a4c2f" data-kw="">
<blockquote><p>Lord, thou knows I am weak in grace, thou seest my faith is feeble, my love cold, my desires faint, my obedience small; but thou hast all fulness of grace; thou art the Fountain, and this Fountain is opened here; thou art the Treasury, and this Treasury is here unlocked.

Those graces I have, though weak, thou begatst them, and wilt not thou now nourish them? From thee I had the being of grace, and from thee I must have the nourishing. Thou hast set up this Ordinance as a means to convey grace, and thou hast promised to remember them that are in thy way, therefore help,—&amp;c.

Besides, may faith say, Lord, thou hast been pleased to implant me into Christ, and shall I die for want of nourishment? thou hast made me a member of Christ, and shall I decay and wither for want of influence? Oh! never let it be said, that a branch in Christ shall wither and decay for want of nourishment, when there is so much in the root; let it never be said, that a member of Christ should wither and die for want of influence and life, seeing there is so much in the Head.

Thou camest, that I might have life; yea, &amp; have it in abundance; why Lord, my graces are weak, here are dying affections, dying dispositions, dying graces, Oh! come down before I die, strengthen the things that are ready to die in me. Thou hast raised me from the death of sin, let me not again drop into the same grave; thou hast wrought graces in me, let them not decay for want of life, when such abundance in thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guard of the tree of life, or, A sacramental discourse shewing a Christians privilege in approaching to God in ordinances, duty in his sacramental approaches, danger if he do not sanctify God in them</cite>, (London: A. Kemble, 1644), pp 66-68.</span></figcaption>

</figure><figure class="quote" id="q-515d958d78" data-kw="">
<blockquote><p>In this sacrament there are two things, a visible sign, and an invisible grace: there is a visible sacramental sign of bread and wine; and there is the thing and matter signified, namely the body and blood of Christ: there is an earthly matter, and an heavenly matter.

The outward sacramental sign is common to all; as well the bad, as the good. Judas received the Lord’s bread; but not that bread, which is the Lord to the faithful receiver. The spiritual part, that which feedeth the soul only the faithful do receive.

For he cannot be partaker of the body of Christ, which is no member of Christ’s body. This food offered us at the Lord’s table is to feed our souls withal; it is meat for the mind, and not for the belly. Our souls being spiritual can neither receive, nor digest that which is corporal, they feed only upon spiritual food. It is the spiritual eating that giveth life. The flesh saith Christ, doeth nothing profit. We must lift up our selves from these external and earthly signs, and like Eagles fly up and sore aloft; there to feed on Christ, which sitteth on the right hand of his father, whom the heavens shall keep until the latter day.

From thence and from no other Altar shall he come, in his natural body to judge both quick and dead. His natural body is local, for else it were not a natural body; his body is there, therefore not here: for a natural body doth not occupy sundry places at once. Here we have a sacrament, a sign, a memorial, a commemoration, a representation, a figure effectual of the body and blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the most reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), p. 75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

<blockquote><p>That their conformity with the Brownists [separatists] may be full, the New-English [New England congregationalists] do count sitting at a table, not only to be necessary, but to be a part of our imitation of Christ, and a rite significant of diverse heavenly privileges and comforts; but as the Brownists at Amsterdam this day have no table at all, as they send the elements from the pulpit (the place where the minister preaches and celebrates the sacrament) by the hand of the deacon to all the congregation, where in their meeting-house they sit up and down in their several places: So the Independents at London do vehemently contend for the needlessness of any to come to the Table, whatever be the practice of all the rest of the Reformed Churches: But they will have the holy seals carried from the place where the minister preaches to the people in their pews, or wherever else they have their ordinary places for hearing of the Word; although most easily in their small congregations without any disturbance all might be brought to the Table.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ac29eba9a3" data-kw="">
<blockquote><p>The folly and falsehood of baptismal regeneration have been already pointed out in the former lecture. All the arguments there aimed against the opus operatum apply here. The error most probably grew as superstition increased in the primitive Church, out of the unguarded use of the sacramental language by the early fathers, whose doctrine on this point was sounder. We know that baptism, in supposed imitation of Titus 3:5, was currently called regeneration as early as Justin Martyr and Irenaeus. It is easy to see how, as men’s ideas of sacred subjects became more gross, this figurative use of the word introduced the real error.</p></blockquote>
<figcaption>— <a href="../authors/r-l-dabney.html">R. L. Dabney</a>, <cite>Systematic Theology</cite>, Meaning of Baptism</figcaption>
<div class="meta"><a class="tag" href="../topics/baptism/efficacy.html">Baptism: Efficacy</a><a class="tag" href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a><a class="tag" href="../topics/the-sacraments-in-general/efficacy.html">The Sacraments in General: Efficacy</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-485a9633bd" data-kw="">
<blockquote><p>Do the sacraments of the New Testament work grace so physically that they effect and contain it ex opere operato, whether faith and devotion are present or not? Or are they rather efficacious signs and seals of grace? The former we deny; the latter we affirm against the Romanists.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, Topic 19, Q. 8, §§ 1–6</figcaption>

</figure><figure class="quote" id="q-b4c1b9cb59" data-kw="">
<blockquote><p>If the sacraments are said to remit sins, to save and to regenerate (Acts 2:38; 22:16; Eph. 5:26; Tit. 3:5; 1 Pet. 3:21), they do not do this by a proper, immediate and internal force (as is evident from 1 Pet. 3:21). Rather they do it sacramentally and improperly because they are efficacious signs by which those benefits are signified and sealed and in their legitimate use conferred.… When remission of sins is ascribed to baptism (Acts 22:16), it is not ascribed to it except under the relation of a sign and seal and not under the relation of a true, proper and immediate physical cause… In fine, although that remission is ascribed to baptism, it does not belong to it by reason of the external action properly, but by reason of the internal grace and receiving faith, without which all the external ablution is in vain.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, Topic 19</figcaption>

</figure><figure class="quote" id="q-9cbaa3a91f" data-kw="">
<blockquote><p>In this matter of baptism — if I may be pardoned for saying it — I can only conclude that all the doctors have been in error from the time of the apostles. . . . All the doctors have ascribed to the water a power which it does not have and the holy apostles did not teach.</p></blockquote>
<figcaption>— <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a>, <cite>Of Baptism</cite></figcaption>

</figure><figure class="quote" id="q-b945658aed" data-kw="">
<blockquote><p>The first, the most obvious, and the most decisive argument against this doctrine is, that, so far as any work or act of the sinner is concerned, the Bible everywhere teaches that the only indispensable condition of salvation is faith in Jesus Christ.… Whosoever believes on the Son hath everlasting life. This stands firm. It matters not to what Church he may belong; it matters not whether he be Jew or Gentile, bond or free, learned or unlearned, good or bad, baptized or unbaptized, whosoever believes shall be saved.… Neither does the Bible anywhere teach that Christian baptism effects either pardon or regeneration in those still out of Christ.</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, vol. 3, “Direct Arguments against the Doctrine of Baptismal Regeneration”</figcaption>

<main class="wrap"><figure class="quote" id="q-8ff5227a6a" data-kw="">
<blockquote><p>For the whole Christ is adored, but not the whole of Christ. Abstract and concrete terms should not be confused, and a distinction between the natures and properties, against a Eutychian confusion of the natures and properties, ought to be maintained. We read that Cyril did this carefully, who left us his writing on John, book 2, cp. 92, as follows: The humanity [of Christ], says Cyril, considered simply in itself and not in the relation counts itself among those who worship, and Christ also worships, as man, after He became man. But He is always worshipped with the Father and the Spirit since He is true God according to his nature. And again, Should we worship Immanuel as a man (in Himself, namely, considered absolutely in the union)? No. This in fact would be nonsense, both a deception and also a mistake. In doing so we would in fact differ in no way from those who worship the creature alongside the maker and author.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard 1586</cite>, ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017), p. 414</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a1fd841cf" data-kw="">
<blockquote><p>None of us teaches that the man Christ should not be worshiped, but we deny only that the humanity should be worshiped. For the man is one thing and the humanity is another. The man Christ is to be worship[ped] since he is God. But the humanity, that is, the flesh of Christ, is not God. Therefore it is not also an object of worship, even though it has been personally united to the Word [logos]. We worship the whole Christ, but not the Whole of Christ, that is, the humamty with the Deity. We will explain this with an analogy. I worship a king or prince clothed in purple, crowned, holding a scepter in his right hand. In that worship I do not pay heed to the crown which he wears on his head or to the purple with which he is dressed or to the scepter which he holds in his hand. Nevertheless I do not separate the crown, the purple or the scepter from the king. So also in the religious adoration of Christ, we direct our invocation to the Son of God, that is, to his divinity, as to the sole, proper object of religious adoration, and not to his humanity. Nevertheless we do not separate the humanity from the deity of the Son of God. For we distinguish the natures and their properties; we do not separate them.</p></blockquote>

<blockquote><p>V. Our sponsor (as stated) is Christ Jesus, the only-begotten Son of God and himself God blessed forever, according to both natures. The principle which [acts] is indeed his person; the principle by which [he acts] is his nature, both human and divine. Hence there was entirely a communion in the work, but a distinction of power and mode in the operating natures. The passion formally belonged to the human nature; its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. by AI by Onku (Utrecht, 1650) Latin</span></figcaption>

<blockquote><p>4. The communion of effects XIII. The communio ἀποτελεσμάτων, communion of effects (1 Tim. 2:5), which is nothing other than a concurrence of both natures for the mediatorial operations, such that those works proceed from the person of the God-man through the distinct efficacy of both natures; in which these four things must be noted: (1) the producing cause, the person of the God-man, the ἐνεργῶν, the one working; (2) the two principia ἐνεργητικά, operative principles, of the producing cause, which are the two natures in the Mediator; (3) the double efficacy, according to the number of the two principles, or the double ἐνέργεια, operation, that of the divine nature and that of the human nature; (4) finally, the one work, the ἐνεργούμενον, the thing worked, or the ἀποτέλεσμα θεανδρικόν, divine-human effect, which the one Mediator produces according to his two natures through an efficacy peculiar to each. Thus for example, the one Mediator, the λυτρώτης, Redeemer, with both natures concurring as principia λυτρωτικά, redemptive principles, through a double efficacy or λύτρωσις, work of redemption, the human nature by conferring the death, and the divine nature the value of the death, procured one λύτρον or λύτρωμα, redemption.</p></blockquote>

<blockquote><p>Neither can the names of Jesus and Christ prove that what is said there [in Prov. 8:15-16, 22-30] must needs be meant of Him as Mediator. Mark how well-grounded Mr. Hussey’s arguments are. Jesus sat at meat in Simon the Pharisee’s house, Luke 7:37; Jesus wept for Lazarus, because He loved him, John 11:35-36. Must we needs therefore say that, as Mediator, He sat at meat in the Pharisee’s house, and, as Mediator, He wept for Lazarus? Christ is the Son of David, Matt. 22:42. Must we therefore say that, as Mediator, He is the Son of David? Christ is “God over all, blessed forever,” Rom. 9:5. Must we therefore say that this is meant of Christ only as Mediator? What is more ordinary than to use the names of Jesus and Christ when the thing which is said is meant in reference to one of the natures?</p></blockquote>

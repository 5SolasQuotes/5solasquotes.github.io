<main class="wrap"><figure class="quote" id="q-68154e201b" data-kw="">
<blockquote><p>We would beware of forming Ideas, representations, or shapes of that One God and Three Persons in the heart, or in the head: these cannot but be derogatory to Him, being a likeness to Him of our own up-setting in our hearts: and cannot but diminish that Authority, which the true God should have in our hearts. We would remember therefore that He is purely Spiritual, whom no eye hath seen, nor can see: and therefore all such imaginations, are to be abandoned and abhorred. …

We would beware of dividing the Object of Worship, or separating the Three blessed Persons in our worshipping of them, even in our imagination; as if when One is named, we were not praying unto, and worshipping both the other; and as if the Son were an other God than the Father or Spirit, &amp;c. But still this would be remembered, that what ever Person be named, He is God, and that same One God with the other Two: and therefore the Object of Worship, is ever the same One God, Father, Son, and Spirit, that are but One God.

We Worship the Father, the Son, and the Spirit; but we do not Worship the Father, or the Son, or the Spirit, as if He who is not named, were less worshipped than He who is named: and seeing the Son and holy Ghost, are the same God with the Father (the former ground being laid) it’s all one thing what ever Person be named, though in Scripture sometimes respect is had to their order of subsisting and operating; and so the Father is only named sometimes to be the ground upon, and by which, we have access to God; and so, the Son, only is named.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the book of the Revelation. Wherein the text is explained, the series of the several prophecies contained in that book, deduced according to their order and dependence on each other; the periods and succession of times, at, or about which, these prophecies, that are already fulfill</cite>, (Edinburgh: Christopher Higgins, 1658), p. 9.</span></figcaption>

<blockquote><p>6. We believe that lawful rulers have power to forbid such ministers to preach in this or that place, or anywhere in their dominions, whose preaching is such as tends to do more harm than good.

7. Had we any reasonable conviction that our ministry is unnecessary, we would obey our rulers, though they silenced us causlessly, and would seek some other place or way of serving God.

8. In those times, places, and circumstances which persuade us that more hurt than good will come by it if we preach, we will then and there forbear it, though it be not as an act of formal obedience, nor a desertion of our office, or of the exercise of it at other times.

9. We judge it our duty to further the good success of the conformable ministers to the utmost of our power.

10. And we take schism to be a great sin, and that which we are bound to do the best we can not only to avoid ourselves, but to cure or hinder in others.</p></blockquote>

<blockquote><p>26. In most countries of England, many hundred persons to one must have Church communion in the parish churches, or have none at all: And to renounce all Church worship and communion rather than join in the parish churches and with the liturgy, and to persuade all to do so, is almost to draw the land to live like atheists and is so pernicious to souls that no good Christian should favour it. And it is a gross breach of the [Solemn League and] Covenant [1643] which renounces profaneness, schism and all that is contrary to godliness.

27. So much are Papists angry at Protestant ministers that keep them [non-conformists] out of the parish churches, [Papists] reviling them [such Protestant ministers] as trimmers, [Papists] supposing that conventicles [worship assemblies of non-conformists] can do them less harm, that all that love the Protestant religion should do their best to encourage† all such orthodox men and to strengthen the Protestant interest in the parish churches, and not join against them with the Papists (however it be with other intents and minds).</p></blockquote>

<blockquote><p>As in Judaism, the Sabbath was a monumental pillar bearing the record of Israel’s redemption from Egypt, so Christianity engraves upon it the sinner’s redemption from hell, through a Saviour’s resurrection. By a change only in what was positive, and not moral, in the command, its transfer from the seventh to the first day of the week proclaims “this same Jesus hath God raised up, whereof I am witness.” But the Sabbath which commemorates the consummating act, is equally the memorial of that entire redeeming work undertaken by Christ upon the earth.

Thus in the religion of grace, as in the religion of nature, the Sabbath lifts itself like some proud obelisk, all covered with inscriptions of man’s duties to his God, and of God’s rich grace to man. So complete is the identity between the Sabbath and the gospel it attests, as to have extorted the confession, that till the former was destroyed, it was hopeless to overturn the latter; and infidel France was instigated to rob it of its sacred associations, by the substitution of a tenth day of rest and pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-morgan-palmer.html">Benjamin Morgan Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pastoral Letter on the Observance of the Sabbath, to the Churches and Church members within the Synod of South Carolina in Minutes of the Synod of South Carolina, at their Sessions, in Winnsborough, Fairfield District, S.C., Nov. 1851</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“As in Judaism, the Sabbath was a monumental pillar bearing the record of Israel’s redemption from Egypt, so Christianity engraves upon it the sinner’s redemption from hell, through a Saviour’s resurrection. By a change only in what was positive, and not moral, in the command, its transfer from the seventh to the first day of the week proclaims “this same Jesus hath God raised up, whereof I am witness.” But the Sabbath which commemorates the consummating act, is equally the memorial of that entire redeeming work undertaken by Christ upon the earth.

Thus in the religion of grace, as in the religion of nature, the Sabbath lifts itself like some proud obelisk, all covered with inscriptions of man’s duties to his God, and of God’s rich grace to man. So complete is the identity between the Sabbath and the gospel it attests, as to have extorted the confession, that till the former was destroyed, it was hopeless to overturn the latter; and infidel France was instigated to rob it of its sacred associations, by the substitution of a tenth day of rest and pleasure.”

— Benjamin Morgan Palmer, Pastoral Letter on the Observance of the Sabbath, to the Churches and Church members within the Synod of South Carolina in Minutes of the Synod of South Carolina, at their Sessions, in Winnsborough, Fairfield District, S.C., Nov. 1851">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+in+Judaism%2C+the+Sabbath+was+a+monumental+pillar+bearing+the+record+of+Israel%E2%80%99s+redemption+from+Egypt%2C+so+Christianity+engraves+upon+it+the+sinner%E2%80%99s+redemption+from+hell%2C+through+a+Saviour%E2%80%99s+resurrection.+By+a+change+only+in+what+was+positive%2C+and+not+moral%2C+in+the+command%2C+its+transfer+from+the+seventh+to+the+first+day+of+the+week+proclaims+%E2%80%9Cthis+same+Jesus+hath+God+raised+up%2C+whereof+I+am+witness.%E2%80%9D+But+the+Sabbath+which+commemorates+the+consummating+act%2C+is+equally+the+memorial+of+that+entire+redeeming+work+undertaken+by+Christ+upon+the+earth.%0A%0AThus+in+the+religion+of+grace%2C+as+in+the+religion+of+nature%2C+the+Sabbath+lifts+itself+like+some+proud+obelisk%2C+all+covered+with+inscriptions+of+man%E2%80%99s+duties+to+his+God%2C+and+of+God%E2%80%99s+rich+grace+to+man.+So+complete+is+the+identity+between+the+Sabbath+and+the+gospel+it+attests%2C+as+to+have+extorted+the+confession%2C+that+till+the+former+was+destroyed%2C+it+was+hopeless+to+overturn+the+latter%3B+and+infidel+France+was+instigated+to+rob+it+of+its+sacred+associations%2C+by+the+substitution+of+a+tenth+day+of+rest+and+pleasure.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Morgan+Palmer%2C+Pastoral+Letter+on+the+Observance+of+the+Sabbath%2C+to+the+Churches+and+Church+members+within+the+Synod+of+South+Carolina+in+Minutes+of+the+Synod+of+South+Carolina%2C+at+their+Sessions%2C+in+Winnsborough%2C+Fairfield+District%2C+S.C.%2C+Nov.+1851&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F02157fa0df.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/02157fa0df.html">Permalink</a><a cl

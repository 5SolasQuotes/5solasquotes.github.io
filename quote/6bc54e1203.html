<main class="wrap"><figure class="quote" id="q-6bc54e1203" data-kw="">
<blockquote><p>IV. Nor ought it to be objected that Christ puts instruction before baptism and so speaks of adults, who can be instructed, and not of infants (“teach [μαθητεύσατε],” he says). Although Christ placed teaching before baptism, this must be referred to the baptism of adults, of which first and especially he was speaking in reference to the state of the primeval church to be constituted of adults. Therefore, here we must distinguish between the church to be constituted and constituted. In the former, adults were to be taught before they were baptized; but in the constituted, infants were to be baptized before they were taught. The predicates are such as they are permitted to be by their subjects; infants are not capable of instruction, therefore it does not pertain to them. In the meantime, the command of Christ is to be understood analogically of infants from the nature of the covenant and the perpetual use of the church from Abraham (Gen. 17:19*). The verb μαθητευειν (used by Christ) properly is not so much to teach by preaching as “to make disciples.” This is done also by the administration of baptism, which is a sacrament of initiation and the first entrance into the church and family of Christ. Thus μαθητας ποιειν (Jn. 4:1) is not simply to teach, but to make disciples and to receive into a profession of discipline; as among the Jews disciples were often made, not who were already taught, but that they might be taught. Hence the heathen to Hillelm (?Hillel): “Make me a proselyte that you may teach me.” That this is to be so understood is proved by the verb διδασκειν (which is added), which would seem to be tautological unless to μαθητευειν is referred to something else than simple instruction and doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.4 (p. 415). [modified]</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c0ff4ccae" data-kw="">
<blockquote><p>The subject of baptism is the faithful people of God, without any distinction of nation, sex, or age. Indeed, infants of the covenanted must be baptized as equally as the infants of the covenanted were once circumcised because the promise made to Abraham and His seed, Christ having been revealed, was not diminished but enlarged through the mouth of Peter: “The promise is yours and your children’s” (Acts 2:39). In this argument St. Peter commanded each one (ἕκαστον) to be baptized (Acts 2:38). Indeed, the Israelites, who once were “near,” and the faithful from the Gentiles, who once were “far off” (Acts 2:39), are held with no distinction under the New Testament (Gal. 3:28). For the children of the faithful Gentile, notwithstanding infidelity of the other parent, are “holy” (1 Cor. 7:14). Therefore, since baptism as equally as circumcision seals that covenant for those who believe, into which their children have been received as holy, in the same right baptism is administered to these as circumcision once was to those. For Christ commanded “to make disciples and to baptize the nations,” with no distinction of age (Matt. 28:19). Therefore, those who are born in the lap of the church are fit at the age of infant to begin the institution and must be baptized as equally as their parents. Therefore, the apostles baptized whole “households” (1 Cor. 1:16). (XXII–XXVI).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Christian Theology</cite>, 24.9, trans. Casey Carmichael, Classic Reformed Theology (Reformation Heritage Books, 2019), 179.</span></figcaption>

</figure><figure class="quote" id="q-b0378d1e32" data-kw="">
<blockquote><p>For in respect of the observance of the eighth day in the Jewish circumcision of the flesh, a sacrament was given beforehand in shadow and in usage; but when Christ came, it was fulfilled in truth. For because the eighth day, that is, the first day after the Sabbath, was to be that on which the Lord should rise again, and should quicken us, and give us circumcision of the spirit, the eighth day, that is, the first day after the Sabbath, and the Lord’s day, went before in the figure; which figure ceased when by and by the truth came, and spiritual circumcision was given to us.</p></blockquote>

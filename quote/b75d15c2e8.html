<main class="wrap"><figure class="quote" id="q-b75d15c2e8" data-kw="">
<blockquote><p>This [the promise of the covenant] however by no means implies that all the children of pious parents should be regarded as ordained to salvation by the divine appointment. For it is manifest, both from the indubitable records of the sacred volume and the examples there placed beyond controversy, and from the experience of everyday life, that not infrequently the offspring of the best of men grow up with the worst dispositions, wickedly bent upon their own destruction. Still God has given that pledge to pious parents that they may regard their little ones as the children of God by gracious adoption, until, when further advanced, they betray themselves by indications to the contrary, and that they may feel not less secure regarding their children dying in infancy than did Abraham and Isaac of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), pp 127-28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-585568724b" data-kw="">
<blockquote><p>I have treated on these two subjects, because I know they are the tempting errours of these Times, and have the fairest glosses set on them, and have too much influence to disturb the Peace and Order of Churches:

The first [anti-paedobaptism] especially, which eats out men’s affections, and creeps at the heart like a gangrene insensibly; an opinion which hath been always ominous, and of a wonderful strange influence, accompanied with the most dangerous retinue of errors, since the first Embryo of it was brought forth; whether by a judgement of God, or from its natural and secret connexion with other principles of darkness, I will not determine; only God hath shewed some black characters on it in every Nation where it hath prevailed; though we cannot but say, many Saints are innocently under the power of it.

For the second [error, uninspired hymns], I hope when men’s hearts come in Tune, their voices will likewise: The former denies more Fundamental Principles, as the Covenant in its extent, and subjects; the freeness of Grace; the riches of its workings in the New Testament; and contracts the Gospel; leaving more Grace visible in the Legal and Old Testament dispensation, then in the New.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cuthbert-sidenham.html">Cuthbert Sidenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian, Sober &amp; Plain Exercitation on the Two Grand Practical Controversies of these Times; Infant-Baptism and Singing of Psalms</cite>, (London: Robert White, 1654), epistle dedicatory.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

724b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/03/cuthbert-sidenham-anti-paedobaptism-as-a-worse-error-than-uninspired-hymns/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…in favor of the baptism of infant servants, from the cessation of the Jewish Church to the times of Augustine, we can only say that Augustine speaks of it as a custom in existence; that it resulted, in his day, from the conviction that baptism came in place of circumcision, a conviction which we can trace up through the earliest fathers… …we commend the resolutions of the Synod of South Carolina… ‘1. Resolved, That it is the duty of believing masters to train up their servants, as well as their children, in the nurture and admonition of the Lord.

2. Resolved, That the principles of the Abrahamic covenant, as to the cirucmcision of servants, is till in force in reference to the infant offspring of those who stand to us in this relation; and that as baptism succeeds to circumcision, it is the duty of masters to dedicate such servants to God in the ordinance of baptism, and to do all in their power to train them up in a knowledge of the truth and in the way of salvation through Christ.

3. Resolved, That though there are great and manifest dificulties in carrying out the principles of these resolutions, these difficulties have chiefly resulted from the long continued neglect of believing masters and of the church, and that these difficulties must be gradually overcome by continued and persevering efforts.&#x27;</p></blockquote>

23c4e91a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=in%20favor%20of%20the%20baptism%20of,overcome%20by%20continued%20and%20persevering%20efforts&amp;text=in%20favor%20of%20the%20baptism%20of%20infant%20servants&amp;text=be%20gradually%20overcome%20by%20continued%20and%20persevering%20efforts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2977c12ab8" data-kw="">
<blockquote><p>Now that infants may and ought to be baptized, is proved from Matt, xxviii. 17, where Christ commands all to be baptized, and therefore infants; nor does it matter, that in this passage instruction is made to precede baptism, for instruction applies only to adults, who were the persons our Lord had in view, since the first churches were to be composed of adults. The parents were, therefore, first to be taught, but when they had been baptized, their children were to be baptized also.

Besides, the covenant of God, and the seals thereof, belong to infants, (Gen. xvii, 7,) and “the promise” is made unto them. (Acts ii. 39.) To infants also belong remission of sins, and regeneration; in short, “the kingdom of heaven;” therefore the signs of these blessings may be bestowed upon them. Moreover, the necessity of baptism is the same as that of circumcision, for the former succeeded into the place of the latter, and both are sacraments of initiation; now the Jews were in the habit of baptizing proselytes together with their children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 11.4, p. 487.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-a75061fc73" data-kw="">
<blockquote><p>But that which maketh men most afraid for their Anabaptism, is their open deserting all the Reformed Churches, and the Brownists themselves, in three grounds.

First, they deny the federal holiness of Christian children; against this Tho[mas]. Goodwin did preach, and deny openly that common distinction of Protestants of real and federal holiness, – requiring in every Infant to be baptized a real and inherent sanctity. If this ground be maintained, I see not how Anabaptism, or else Arminianism, will be avoided; for if this real holiness above federal, be the great ground of Baptism, and this cannot be asserted in the judgement of verity of any Infant; for whatever we say of the judgement of charity, yet in the judgement of truth, and with the certainty of faith wherewith we must assent to every Scripture, who can say that any particular Infant is holy, and so that any Infant should be baptized? or if we can say in the judgement of truth, that every baptized Infant is really sanctified, as it seems Mr Robinson hath taught Mr Goodwin, if Mr Rathband understand right the 309 p. of Rob. justification, the Arminians have won the field; for no man doubts but many baptized Infants, even in their way, do fall away totally and finally from whatsoever holiness can be supposed to be in them. If these inextricable difficulties did move Mr Goodwin to stop the Press that it went not on with his Sermons against the Anabaptists, himself doth know.

Secondly, they esteem not baptized Infants to be members of their Church before they have entered into their Covenant; till then they hold them from the Lord’s Table and all the acts of Discipline, as people without the Church and not members of it: If it be so, their Baptism was of so small use that well they might have wanted it to the time of their admission to be members.

Thirdly, they account Anabaptism a very tolerable error; so far as ever we heard to this day, they did never so much as rebuke any of their members for it, much contrary to the practice of the Brownists, and of their Brethren in New England, who ever have removed the Anabaptists from their Churches, as Sectaries of a special evil note. We have long observed the great affection of Independents here towards them who professed opposition to Paedo-Baptism, but did never expect to have heard them declare any thing towards the Arminian errors of the Anabaptists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (London, 1645), pp 119-20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

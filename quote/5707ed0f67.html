<main class="wrap"><figure class="quote" id="q-5707ed0f67" data-kw="">
<blockquote><p>I answer, there is, in an extraordinary necessity, where there are no presbyters at all, as little necessity of ordination if there be presbyters in other congregations to ordain. And since you never read that any in the apostolic Church ordained pastors, but pastors only; why, but we may have recourse to a presbytery of other congregations for ordination, as well as for baptizing [in such circumstances, contra congregationalists];</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5bfa5838d8" data-kw="">
<blockquote><p>Briefly (in deed) and in very few words is it said by the Apostle, Let a man examine himself: but in that brevity, and in those few words, he effectually comprehendeth the whole office and duty of every such an one, as doth earnestly desire to be reconciled, and to be at one with God; yea, therein he summarily setteth down, and compendiously prescribeth all and whatsoever is needful or expedient, for each true Christian to do &amp; perform.

For, to examine a man’s own self, is nothing else, than for him thoroughly to try, narrowly to search, and diligently to prove, who and what manner of person he is; &amp; in what case he inwardly feeleth his own conscience. To the same effect, purpose and meaning doth the Apostle in an other place say, Let every man prove his own works: And again, Prove your selves whether ye be in the faith: examine your selves.

He therefore is to be understood, rightly, duly, and truly to examine himself, which diligently and carefully searcheth out, trieth, groapeth, &amp; inwardly rippeth up every corner of his conscience, and so narrowly fifteth both his works, actions and faith, that he leaveth nothing in his whole man, either outwardly or inwardly, whereof he maketh not a true and perfect presentment unto his Conscience, and (as it were) strictly enditeth and judicially arraigneth at the Bar, as before a most severe Judge.

And look how necessary it is for every one that hath sinned, (and by sinning disfranchised and banished himself from the kingdom of heaven) to bend his whole care and study, how to come into favour again with God, king of the same heavenly kingdom: so necessary is it, that before he go about the same, he diligently try and examine himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-hyperius.html">Andreas Hyperius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true trial and examination of a man’s own self wherein every faithful Christian, by looking into his conscience, may most plainly behold his spiritual deformity by nature, described, his actual rebellion by disobedience detected, his promise breach at baptism, by ordinary transgression apparentl</cite>, trans. Thomas Newton (London: John Windet, 1587), pp 1-3.</span></figcaption>

</figure><figure class="quote" id="q-293726fbc1" data-kw="">
<blockquote><p>The Church did formerly of late confer with Christ, and refused to open to Him when He was knocking and showering down influences of grace [in the Song of Solomon]; now she is glad to confer:

1. With the smiting watchmen [Church officers], where she found little of Christ.

2. Next with private Christians in assemblies. This is a mean of the Lords showering down of influences in the public and domestic, or less public meetings of his saints; for ordinances of all sorts that are appointed of Christ, they drop down savory and seasonable dews. The Lord writes in his book the savory conferences of such as fear the Lord’s name, Mal. 3:16; and three things follow:

1. The Lord owns such as are his.

2. His forbearance though there be faults in their service.

3. His making known to his the difference betwixt such as serve God, and such as serve Him not: and Zech. 8, the inhabitants of one city encourage the inhabitants of another; and the fruits of it is:

1. Praying.

2. Owning the saints. And they take hold of the skirt of a Jew; and both say Christians meeting for prayer and conference want not God, who rains down impressions of grace upon them as his people, especially when they warm one another; as many coals in one heap make a great fire. Nor is the acting of the Spirit tied only to the public ministry; the saints take to their houses clusters of wine-grapes, which they feed upon at home. Let the saints meet, and by conference and prayer draw down new influences of the Spirit, Jude 20; Isa. 2:1-3; Jer. 50:4-5; Col. 3:16; Heb. 3:13 &amp; 10:24; 1 Thess. 5:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, Influences of the Life of Grace (1659), ch. 11, pp. 307-8</span></figcaption>

<blockquote><p>It is necessary that theological topics be blended in our discourses on the gospel with the rules of practical godliness; that the doctrines should lead to the precepts, and that precepts should always flow from the doctrines, that the former may enlighten, and that the latter may stir up, and so quicken the heart, or to speak more correctly, these two must be so commingled as every where to pervade our preaching.

As the precious stones in the breastplate of the great high priest were distinct and separate, and so arranged that the one could easily be distinguished from the other, but nevertheless, as they all at once, threw out one common light, in which their individual lustre and brilliancy were confounded, so in the sermons of the ministers of Jesus Christ, the subjects which are introduced, however different, and however arranged in the order which distinguishes them, ought to constitute one blaze of light in which the truth of the doctrines is so completely mixed with the holiness of the virtues, that they may come into view at the same time, and that there may be found at one point the shining of the Urim and Thummim, (i.e.,) the splendour of instruction with the soundness of good regulations.

As the lightning and the thunder accompany each other in such a way that you cannot tell which goes first, the eye supposing the lightning, and reason, on the contrary, (in the opinion of many) the thunder, so ought it to be with the doctrines and the precepts in sermons, — they should be so arranged that one hardly knows to which of the two to give his attention, that when you notice them, almost at the same time, and in the same instant, if possible, the eye may be struck with the lightning of the one, and the ear with the noise and thunder of the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-bosc.html">Pierre Du Bosc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protestantism. Being a Series of Discourses on a Portion of the Epistle to the Ephesians</cite>, trans. J. B. Law (1699; London: A. Hall, Virtue, &amp; Co., 1853), pp 275-77.</span></figcaption>

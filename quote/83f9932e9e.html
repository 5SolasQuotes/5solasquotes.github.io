<blockquote><p>Piety made David, Solomon, Jehoshaphat, Hezechias, Josias, Zerubbabel, Constantine, Theodosius, Edward the VI., Queen Elizabeth, Prince Henry, and other religious princes, to be so honoured, that their names, since their deaths, smell in the church of God like a precious ointment, and their remembrances are sweet as honey in all mouths, and as music at a banquet of wine; whereas the lives of others, who have been godless and irreligious princes, do rot and stink in the memory of God’s people—and what honour is it for great men to have great titles on earth, when God counts their names unworthy to be written in his book of life in heaven?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), xxxiv.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7359ad460f" data-kw="">
<blockquote><p>Since Thou hast commanded us to pray for kings and princes, and for all who are placed in authority, we pray, among others, for those governments whose theological professors are present in this solemn ecclesiastical assembly, as well as for those who are yet expected; and for his royal majesty of Great Britain, James I, who is a courageous and conscientious protector of the true faith. We pray for his son-in-law, the illustrious Prince Elector of the Roman Empire and Palatinate on the Rhine, and for the Chief Magistrate of the Empire. We pray for the illustrious Duke and Elector of Brandenburg, for the illustrious Count of Hesse, for the United Cantons in Switzerland, for the high-borne counts of Nassau and Wetteravia, and for the honourable and worthy Council, the Republics of Geneva, Bremen, and Emden.

Especially we pray for those whom Thou hast placed over us in the Reformed Netherlands: for the exalted lords the States General, and for their exalted deputies to this Synod; for the illustrious and warlike hero, the Prince of Orange, and for the entire house of Nassau; for the noble-minded lords states of Holland and West Friesland; for the most wise noble-minded lords, the Presidents and Counselors of both of the Courts of Justice; and for the respectable Council of this city, the Lord Sheriff, Mayor, Aldermen, and the eight judges.

Grant that each and every one of them might serve Thee with reverence and rejoice with trembling. Confirm their scepter and secure their throne in ever-increasing measure, that they might remain faithful, nurturing fathers of Thy church in these regions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/balthasar-lydius.html">Balthasar Lydius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayer of Balthasar Lydius’, trans. Douglas J. Kuiper and H. David Schuringa Protestant Reformed Theological Journal</cite></span></figcaption>

<blockquote><p>50. Unto the external things of the Church belongs not only the correction of heretics and other troublers of the Church, but also that civil order and way of convocating and calling together synods, which is proper to the Magistrate; for the Magistrate ought by his authority and power both to establish the rights and liberties of synods assembling together at times appointed by the known and received law, and to indict and gather together synods occasionally as often as the necessity of the Church shall require the same; Not that all or any power to consult or determine of ecclesiastic or spiritual matters does flow or spring from the Magistrate as Head of the Church under Christ; but because in those things pertaining to the outward man, the Church needs the Magistrate’s aid and support.

51. So that the Magistrate calls together synods [as teaches WCF 31.2], not as touching those things which are proper to [ecclesiastical] synods; but in respect of the things which are common to synods with other meetings and civil public assemblies, that is, not as they are assemblies in the name of Christ, to treat of matters spiritual, but as they are public assemblies within his territories; for to the end that public conventions may be kept in any territory, the licence of the lord of that place ought to be desired. In synods therefore a respect of order, as well civil as ecclesiastical is to be had; And because of this civil order, outward defense, better accommodation, together with safe access and recess, the consent and commandment of him who is appointed to take care of, and defend human order, does intervene. … He [the magistrate] takes care also for maintaining the ministers and schools, and supplies the temporal necessities of God’s servants, by his command assembles synods, when there is need of them; and summons, calls out, and draws to trial the unwilling, which without the Magistrates strength and authority cannot be done, as has been already said; he makes synods also safe and secure, and in a civil way presides or moderates in them (if it so seem good to him), either by himself or by a substitute commissioner. In all which the power of the magistrate though occupied about spiritual things, is not for all that spiritual but civil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 111 Propositions… (1647), #50-51, 65</span></figcaption>

<blockquote><p>XII. Tenth, we must always distinguish between the state of the church constituted and the state of the church to be constituted; the tranquil and well-ordered state and the same perturbed and corrupted. Many things are lawful in a disturbed condition of the state which would not be lawful in a peaceful and well-composed condition, where all things are rightly ordered and done according to the laws. For then necessity (which knows no law) does many lawful things which (if the necessity was removed) would have to be blamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. Dennison, Jr. (P&amp;R), vol. 3, 18th Topic, Question 23, p. 219</span></figcaption>

<blockquote><p>2. The next thing in God is love, and that arises from goodness. The goodness that is in God inclines Him to love, and to be the most profuse lover. You read in 1 John 4:7-8, ‘God is love.’ The question is whether this speech does not import that He is love in Himself, as well as that He shows love. There are these reasons why it imports what He is in Himself, when He says, ‘God is love.’ Says He, verse 7, ‘Every one that loves is born of God, and knows God,’ that is the affirmative; and verse 8, ‘He that loves not knows not God, for God is love’; that is, he knows not God in what is most proper to Him, as to what does most abound in Him, for God is love. We ordinarily say of a man that is of such a disposition, I know him, he is so and so; so the believer knows God to be love… He speaks it of his love, which none sees but as manifest by effects; but God is love essentially. Says Aquinas, Whoever has a will, has a proneness to love. Says Musculus, As every one is in goodness, so in love. If God then has a will inclined to anything, it is to love; He has hatred in Him to sin, He has the opposite: He has a love also to something, only it is guided by his will towards creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1</cite>, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>2. God’s common providence towards mankind teaches us that God is inclined to mercy and is willing to be reconciled, that he is not implacable… By these things, it plainly appears that God hasn’t utterly forsaken the world of mankind as to any favor or merciful regards. This was the witness which God gave all mankind, and even the heathen, that had direct revelation of his disposition to a reconciliation. Acts 14:16–17, ‘Who in times past suffered all nations to walk in their own ways. Nevertheless He left not Himself without witness, in that He did good, and gave us rain from heaven, and fruitful seasons, filling our hearts with food and gladness.&#x27;</p></blockquote>

<blockquote><p>Even so God both endures “with much longsuffering” the sins of the reprobate and, at the same time, is patient with the elect prior to their conversion, willing their repentance rather than their immediate destruction because of sin.534 It is, thus, “the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but he doth warn them beforehand, lightly correct and seek to turn them unto him.”535 The divine compassion, similarly, is the disposition of God to deliver creatures from their misery. It is manifest when “the object of the divine goodness of love [is] involved in misery, such as man who is a sinner and subject to death.”536 534. Brakel, Redelijke Godsdienst, I.iii.36.

535. Leigh, Treatise, II.xiii (p. 100).

536. Venema, Inst. theol., VIII (p. 185).</p></blockquote>

<blockquote><p>yes: Baxter holds that Christ died for all men; but I cannot say that I am quite at one with what some of our friends have written on the subject of the atonement. I do not, for example, entirely agree with what Mr. Haldane says on that subject. I think that the word world, as applied in Scripture to the sacrifice of Christ, has been unnecessarily restricted; the common way of explaining it is that it simply includes Gentiles as well as Jews. [John 3:16] I do not like that explanation, and I think that there is one text that puts that interpretation entirely aside. The text to which I allude is, that “God commandeth all men, everywhere to repent. [Acts 17:30]”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/memoirs-of-dr-chalmers.html">William Hanna</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Dr. Chalmers</cite>, vol. 4, ‘His Last Sabbath’</span></figcaption>

<blockquote><p>There is nothing accidental in the worship of God. Every thing that belongs to it, is part of it. Some things are of more weight, use and importance than others (Mt. 23:27), but all things duly belonging to it, are parts of it, or of its subsistence; outward circumstances are natural and occasional, no accidental parts of worship.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-529047fc76" data-kw="">
<blockquote><p>For the Church does bind and loose in the external court, either by a commission from Him who as head of the Church, and who as King gave to her the keys of the Kingdom, or by a general arbitrary power given to the magistrate and Church, to do in these things as they please, so they do nothing contrary to the Word, though not according to the Word, as they are to do in doctrinals; If the former be said, then must the external government be upon the shoulder of Christ as King, which is that which we teach: If the latter be said, then might the magistrate &amp; Church appoint such an ordinance as excommunication, and so they may by their arbitrary power make a Gospel promise of ratifying an ordinance in heaven and of pardoning sins in heaven; for he that can make the ordinance can make also the Gospel-promise, and he that can by an arbitrary power make one promise or part of the Gospel, may make all. And if either magistrate or Church can appoint such an ordinance as has a promise of binding and loosing made good in heaven, they may also take away such ordinances and Gospel-promises; for it is the same power to make and add, to unmake and destroy ordinances. Hence also I argue for the immutability of a Scriptural Platform, that the Church cannot alter at her will… I infer that the whole Platform of Law and Gospel is of divine institution, and the particulars of obedience and faith are not arbitrary to the Church; just so in discipline, I say the like, there is no more reason for one part written by God than for another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Introduction, Section 2, pp. 15-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-364bdb303f" data-kw="">
<blockquote><p>Dr. [John] Rainolds objected the example of the brazen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways: First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Rainolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. William Barlow, The Sum &amp; Substance of the Conference which it pleased his excellent Majesty to have with the Lords, Bishops &amp; other of his Clergy… at Hampton Court, January 14, 1603 (London: Windet, 1604), 2nd Day, pp. 67-74</span></figcaption>

<blockquote><p>It is wont to be excepted against this that Christian Liberty stands not in the freedom of outward actions, but only in the freedom of conscience. As long therefore as there is no doctrinal necessity put upon the conscience to limit the lawfulness of the use of outward things, Christian Liberty is preserved, though the use and practise of outward things be limitted. Whereto I answer 1. that the apostle in this case leaves the people of God at liberty, not only in point of conscience for lawfulness to marry [1 Cor. 7], but even in outward actions and practise, ‘Let him do’ (says he) ‘what he will; he sins not, let him be married,’ verses 30 &amp; 38, as who should say, the conscience being free from sin in it, I will put no tie on the outward practice to restrain it. 2. That true Christian Liberty consists principally in the free, actual use of things lawful and indifferent in themselves, and the prohibition of their free, actual use to Christians is expressly censured as anti-evangelical, a badge of false apostles, of apostates from the faith, hypocrites, men of seared consciences, anti-Christian usurpers, 1 Tim. 4:1,3-4: ‘Now the Spirit speaks expresly that in the later times some shall depart from the faith, giving heed to seducing spirits and doctrines of devils, speaking lies in hypocrisy, having their consciences seared with a hot Iron, forbidding to marry, and commanding to abstain from meats which God has created to be received with thanksgiving: for every creature of God is good, and nothing to be refused if it be received with thanksgiving; For it is sanctified by the Word of God and prayer.’ Col. 2:20-21: ‘Wherefore if ye be dead with Christ from the rudiments of the world; why as though living in this world are ye subject to ordinances?’ (or canons) ‘touch not, taste not, handle not’ (no not God’s ordinances, sacraments, creatures but in such vestiments, gestures, postures) ‘which all are to perish with the using; which things have indeed a show of wisdom in will-worship and punishing of the body.’ 1 Cor. 4:5-6: ‘Have we not power to eat and to drink? Have we not power to lead about a sister, wife, as well as other apostles, and as the brethren of the Lord and Cephas?’ compared with verses 19 to 24. Rom. 14:2-3: ‘For one believeth that he may eat all things another who is weak eateth herbs; Let not him that eateth despise him that eateth not; and let not him which eateth not, judge him that eateth; For God hath received him. Who art thou that judgest another man’s servant? To his own master he standeth and falleth. But why dost thou judge thy brother’ (or refrain him in the use of things indifferent) ‘or why dost thou set at nought thy brother? We shall all stand before the judgement seat of Christ? etc. Let us not therefore iudge one another any more, but judge this rather that no man put a stumbling block or an occasion to fall in his brother’s way, etc.’ to wit, by any restraints, canons, inhibitions, censures, in or concerning things or ceremonies that are but indifferent, and not absolutely necessary by God’s prescription, or the nature of the things themselves. Therefore to prohibit any ministers of the gospel who are able and faithfull to preach the Word, or to excommunicate or cast them, or any other consciencious Christians out of the Church, or debar them from the sacrament, because they cannot wear a surplice, kneel at the Lord’s Table or Supper, or conform to every punctilio in the Liturgy or Canons, and to deny them their Christian Liberty in the free use or forbearing of ceremonies which are only decent and indifferent, indirectly repugnant to Christian Liberty, the Gospel of Christ, and to Acts 4:18-20; ch. 5:27-29, 41-42; 1 Thess. 2:14-16; 3 John 9-10; Rev. 13:16-17; 1 Cor. 7:8-9, 25-28, 35-40; Gal. 5:13-14.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is wont to be excepted against this that Christian Liberty stands not in the freedom of outward actions, but only in the freedom of conscience. As long therefore as there is no doctrinal necessity put upon the conscience to limit the lawfulness of the use of outward things, Christian Liberty is preserved, though the use and practise of outward things be limitted. Whereto I answer 1. that the apostle in this case leaves the people of God at liberty, not only in point of conscience for lawfulness to marry [1 Cor. 7], but even in outward actions and practise, ‘Let him do’ (says he) ‘what he will; he sins not, let him be married,’ verses 30 &amp; 38, as who should say, the conscience being free from sin in it, I will put no tie on the outward practice to restrain it. 2. That true Christian Liberty consists principally in the free, actual use of things lawful and indifferent in themselves, and the prohibition of their free, actual use to Christians is expressly censured as anti-evangelical, a badge of false apostles, of apostates from the faith, hypocrites, men of seared consciences, anti-Christian usurpers, 1 Tim. 4:1,3-4: ‘Now the Spirit speaks expresly that in the later times some shall depart from the faith, giving heed to seducing spirits and doctrines of devils, speaking lies in hypocrisy, having their consciences seared with a hot Iron, forbidding to marry, and commanding to abstain from meats which God has created to be received with thanksgiving: for every creature of God is good, and nothing to be refused if it be received with thanksgiving; For it is sanctified by the Word of God and prayer.’ Col. 2:20-21: ‘Wherefore if ye be dead with Christ from the rudiments of the world; why as though living in this world are ye subject to ordinances?’ (or canons) ‘touch not, taste not, handle not’ (no not God’s ordinances, sacraments, creatures but in such vestiments, gestures, postures) ‘which all are to perish with the using; which things have indeed a show of wisdom in will-worship and punishing of the body.’ 1 Cor. 4:5-6: ‘Have we not power to eat and to drink? Have we not power to lead about a sister, wife, as well as other apostles, and as the brethren of the Lord and Cephas?’ compared with verses 19 to 24. Rom. 14:2-3: ‘For one believeth that he may eat all things another who is weak eateth herbs; Let not him that eateth despise him that eateth not; and let not him which eateth not, judge him that eateth; For God hath received him. Who art thou that judgest another man’s servant? To his own master he standeth and falleth. But why dost thou judge thy brother’ (or refrain him in the use of things indifferent) ‘or why dost thou set at nought thy brother? We shall all stand before the judgement seat of Christ? etc. Let us not therefore iudge one another any more, but judge this rather that no man put a stumbling block or an occasion to fall in his brother’s way, etc.’ to wit, by any restraints, canons, inhibitions, censures, in or concerning things or ceremonies that are but indifferent, and not absolutely necessary by God’s prescription, or the nature of the things themselves. Therefore to prohibit any ministers of the gospel who are able and faithfull to preach the Word, or to excommunicate or cast them, or any other consciencious Christians out of the Church, or debar them from the sacrament, because they cannot wear a surplice, kneel at the Lord’s Table or Supper, or conform to every punctilio in the Liturgy or Canons, and to deny them their Christian Liberty in the free use or forbearing of ceremonies which are only decent and indifferent, indirectly repugnant to Christian Liberty, the Gospel of Christ, and to Acts 4:18-20; ch. 5:27-29, 41-42; 1 Thess. 2:14-16; 3 John 9-10; Rev. 13:16-17; 1 Cor. 7:8-9, 25-28, 35-40; Gal. 5:13-14.”

— William Prynne, A Brief, Pithy Discourse upon 1 Corinthians 14:40… (London, 1661), pp. 8-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+wont+to+be+excepted+against+this+that+Christian+Liberty+stands+not+in+the+freedom+of+outward+actions%2C+but+only+in+the+freedom+of+conscience.+As+long+therefore+as+there+is+no+doctrinal+necessity+put+upon+the+conscience+to+limit+the+lawfulness+of+the+use+of+outward+things%2C+Christian+Liberty+is+preserved%2C+though+the+use+and+practise+of+outward+things+be+limitted.+Whereto+I+answer+1.+that+the+apostle+in+this+case+leaves+the+people+of+God+at+liberty%2C+not+only+in+point+of+conscience+for+lawfulness+to+marry+%5B1+Cor.+7%5D%2C+but+even+in+outward+actions+and+practise%2C+%E2%80%98Let+him+do%E2%80%99+%28says+he%29+%E2%80%98what+he+will%3B+he+sins+not%2C+let+him+be+married%2C%E2%80%99+verses+30+%26+38%2C+as+who+should+say%2C+the+conscience+being+free+from+sin+in+it%2C+I+will+put+no+tie+on+the+outward+practice+to+restrain+it.+2.+That+true+Christian+Liberty+consists+principally+in+the+free%2C+actual+use+of+things+lawful+and+indifferent+in+themselves%2C+and+the+prohibition+of+their+free%2C+actual+use+to+Christians+is+expressly+censured+as+anti-evangelical%2C+a+badge+of+false+apostles%2C+of+apostates+from+the+faith%2C+hypocrites%2C+men+of+seared+consciences%2C+anti-Christian+usurpers%2C+1+Tim.+4%3A1%2C3-4%3A+%E2%80%98Now+the+Spirit+speaks+expresly+that+in+the+later+times+some+shall+depart+from+the+faith%2C+giving+heed+to+seducing+spirits+and+doctrines+of+devils%2C+speaking+lies+in+hypocrisy%2C+having+their+consciences+seared+with+a+hot+Iron%2C+forbidding+to+marry%2C+and+commanding+to+abstain+from+meats+which+God+has+created+to+be+received+with+thanksgiving%3A+for+every+creature+of+God+is+good%2C+and+nothing+to+be+refused+if+it+be+received+with+thanksgiving%3B+For+it+is+sanctified+by+the+Word+of+God+and+prayer.%E2%80%99+Col.+2%3A20-21%3A+%E2%80%98Wherefore+if+ye+be+dead+with+Christ+from+the+rudiments+of+the+world%3B+why+as+though+living+in+this+world+are+ye+subject+to+ordinances%3F%E2%80%99+%28or+canons%29+%E2%80%98touch+not%2C+taste+not%2C+handle+not%E2%80%99+%28no+not+God%E2%80%99s+ordinances%2C+sacraments%2C+creatures+but+in+such+vestiments%2C+gestures%2C+postures%29+%E2%80%98which+all+are+to+perish+with+the+using%3B+which+things+have+indeed+a+show+of+wisdom+in+will-worship+and+punishing+of+the+body.%E2%80%99+1+Cor.+4%3A5-6%3A+%E2%80%98Have+we+not+power+to+eat+and+to+drink%3F+Have+we+not+power+to+lead+about+a+sister%2C+wife%2C+as+well+as+other+apostles%2C+and+as+the+brethren+of+the+Lord+and+Cephas%3F%E2%80%99+compared+with+verses+19+to+24.+Rom.+14%3A2-3%3A+%E2%80%98For+one+believeth+that+he+may+eat+all+things+another+who+is+weak+eateth+herbs%3B+Let+not+him+that+eateth+despise+him+that+eateth+not%3B+and+let+not+him+which+eateth+not%2C+judge+him+that+eateth%3B+For+God+hath+received+him.+Who+art+thou+that+judgest+another+man%E2%80%99s+servant%3F+To+his+own+master+he+standeth+and+falleth.+But+why+dost+thou+judge+thy+brother%E2%80%99+%28or+refrain+him+in+the+use+of+things+indifferent%29+%E2%80%98or+why+dost+thou+set+at+nought+thy+brother%3F+We+shall+all+stand+before+the+judgement+seat+of+Christ%3F+etc.+Let+us+not+therefore+iudge+one+another+any+more%2C+but+judge+this+rather+that+no+man+put+a+stumbling+block+or+an+occasion+to+fall+in+his+brother%E2%80%99s+way%2C+etc.%E2%80%99+to+wit%2C+by+any+restraints%2C+canons%2C+inhibitions%2C+censures%2C+in+or+concerning+things+or+ceremonies+that+are+but+indifferent%2C+and+not+absolutely+necessary+by+God%E2%80%99s+prescription%2C+or+the+nature+of+the+things+themselves.+Therefore+to+prohibit+any+ministers+of+the+gospel+who+are+able+and+faithfull+to+preach+the+Word%2C+or+to+excommunicate+or+cast+them%2C+or+any+other+consciencious+Christians+out+of+the+Church%2C+or+debar+them+from+the+sacrament%2C+because+they+cannot+wear+a+surplice%2C+kneel+at+the+Lord%E2%80%99s+Table+or+Supper%2C+or+conform+to+every+punctilio+in+the+Liturgy+or+Canons%2C+and+to+deny+them+their+Christian+Liberty+in+the+free+use+or+forbearing+of+ceremonies+which+are+only+decent+and+indifferent%2C+indirectly+repugnant+to+Christian+Liberty%2C+the+Gospel+of+Christ%2C+and+to+Acts+4%3A18-20%3B+ch.+5%3A27-29%2C+41-42%3B+1+Thess.+2%3A14-16%3B+3+John+9-10%3B+Rev.+13%3A16-17%3B+1+Cor.+7%3A8-9%2C+25-28%2C+35-40%3B+Gal.+5%3A13-14.%E2%80%9D%0A%0A%E2%80%94+William+Prynne%2C+A+Brief%2C+Pithy+Discourse+upon+1+Corinthians+14%3A40%E2%80%A6+%28London%2C+1661%29%2C+pp.+8-9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F29427d960a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/29427d960a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-things-indifferent-adiaphora/#:~:text=It%20is%20wont%20to%20be%20excepted,Cor.%207%3A8%2D9%2C%2025%2D28%2C%2035%2D40%3B%20Gal.%205%3A13%2D14&amp;text=It%20is%20wont%20to%20be%20excepted%20against%20this&amp;text=13%3A16%2D17%3B%201%20Cor.%207%3A8%2D9%2C%2025%2D28%2C%2035%2D40%3B%20Gal.%205%3A13%2D14" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…in case a society of Christians should want [lack] the fruits of the vine of all sorts, I cannot think but it might be supplied by some composure as like unto it as could be made: and if any church labored under that invincible necessity, were it not safer for them to [yet] interpret that as a call and warrant to communicate [in the Supper], though wanting [lacking] the fruit of the wine, than to construct it [as] an authorizing them in a perpetual neglect of that sacrament?</p></blockquote>

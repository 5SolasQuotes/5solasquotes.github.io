<blockquote><p>JER. chap. 31. vers. 31. 32. 33. 34. 31 Behold, the days come, saith the Lord, that I will make a new covenant with the house of Israel, and with the house of Judah. 32. Not according to the covenant that I made with their fathers, in the day that I took them by the hand, to bring them out of the land of Egypt, which my covenant they brake, although I was an husband unto them saith the Lord. 33. But this shall be the covenant, that I will make with the house of Israel; After those days, saith the Lord, I will put my Law in their inward parts, and write it in their hearts, and will be their God, and they shall be my people. 34. And they shall teach no more every man his neighbour, and every man his brother, saying, Know the Lord: for they shall all know me, from the least of them, unto the greatest of them, saith the Lord, for I will forgive their iniquity, and I will remember their sin no more.

Q. Thus much of the Covenant of Works, called the Law: the Covenant of Grace followeth: What doth this Scripture call it?

A. A new Covenant.

Q. Why is it called a new Covenant?

A. Because it succeedeth the former Covenant, and was made upon the breach thereof.

Q. Doth then the making of this Covenant disable the former?

A. Yea: for the latter Covenant had not been made, if the former had not been broken, &amp; so become insufficient. And therefore they are convinced of impiety by the very making of this covenant, who seek Justification by the old Covenant.

Q. What is this new Covenant?

A. A free contract or Covenant between God, and a sinner, concerning the pardon of sin, and life everlasting, through faith in Christ Jesus.

Q. When did this Covenant begin?

A. Immediately after the Fall. Gen. 3. 15.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 167-68.</span></figcaption>

<blockquote><p>The grounds and sources of holy consolation, are especially the following: God in Christ, with all his glorious perfections, as a God of love, grace, and mercy, and as the God and portion of the saints; Christ, in his glorious Person, righteousness, fullness, offices, and relations, or Christ living in them, and living for them; the Holy Spirit, as inhabiting, quickening, sanctifying, and sealing them, and as the earnest of their eternal inheritance; the covenant of grace, as well ordered in all things and sure, according to which, Jehovah, Father, Son, and. Holy Ghost, is their God, and they are his people, his peculiar people; the infinite atonement, the continual intercession, the supreme dominion, the inviolable faithfulness, and the gracious presence, of the Lord Jesus, who is given for a covenant of the people; and the ordinances, doctrines, promises, and offers, of his gospel, with the peremptory commandment, given to sinners in common, to believe on him: these are the leading, and the immediate grounds, upon which, the saints do by faith, build their comfort; and they are, at the same time, the sources, from which, by the exercise of faith, they derive their consolation.

Besides these, their faith and sense of the pardon of their sins, of the acceptance of their persons as righteous, of their adoption, of their sanctification, and of the witnessing of the blessed Spirit, are matter of consolation to them; and so is the lively exercise of all the graces of the Holy Spirit, especially of faith, hope, and love. The comfort of justification, because it is founded upon a righteousness which is perfect, and always the same, is more stable and permanent, than that of sanctification. The great things, which believers have in possession, and the greater, which they have in hope, are the sustenance of their consolation.

The suitableness of those inestimable blessings to their hearts, together with their sense of personal interest in them, affords them unspeakable joy. As to their experiences and evidences of grace, these are, strictly speaking, not grounds, upon which they build their comfort; but they are proofs, of their saving interest in those grounds of consolation, above mentioned, as well as, encouragements to build their comfort upon them; and so, they are matter of consolation to their souls. The most comfortable of the saints; are they who, trusting at all times in the second Adam. as given for a covenant to them, can think of all dispensations, of all conditions, and of all duties, with comfort. They who have the love of Christ displayed in the covenant of grace, most constantly in their view, and most frequently warm on their heart; are of all believers, the most free from perplexing doubts and fears.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh, 1814), pp 19-20.</span></figcaption>

<blockquote><p>§5. The covenant of God with man is different than those made by men among themselves. For men make covenants for mutual benefits; however, God makes covenant for His people. Indeed, the covenant of God is nothing other than the divine declaration of the way of receiving the love of God as well as the union and communion of becoming a partaker in Him. If man makes use of this way he is in the friendship of God, or, the Creator is his own, God is his own in a personal way (Gen. 17:7), and he is one spirit with God (1 Cor. 6:17), who is one with him (John 17:21); his is . . . (the intimate fellowship of God; Ps. 25:14, compared with Job 29:4, John 14:23.) The one who is outside of the covenant is. . . (without God, Eph. 2:12). This declaration, taken from Hebrews 8:6, can rightly be called…(divine legislation sanctioned in the promises), and when it is attached to the application of the Testament or the plan of the future inheritance, (we discuss this application below in §179 and §184). . . (the legislation of the Testament) or. . . (the Testament according to the force of the Covenant and Law) is described.</p></blockquote>

<blockquote><p>yes: Baxter holds that Christ died for all men; but I cannot say that I am quite at one with what some of our friends have written on the subject of the atonement. I do not, for example, entirely agree with what Mr. Haldane says on that subject [who held to a universal atonement]. I think that the word ‘world’, as applied in Scripture to the sacrifice of Christ, has been unnecessarily restricted; the common way of explaining it is that it simply includes Gentiles as well as Jews. [John 3:16] I do not like that explanation, and I think that there is one text that puts that interpretation entirely aside. The text to which I allude is, that “God commandeth all men, everywhere to repent. [Acts 17:30]”</p></blockquote>

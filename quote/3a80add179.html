<main class="wrap"><figure class="quote" id="q-3a80add179" data-kw="">
<blockquote><p>We acknowledge the scriptures of God contained in the Old and New Testament to contain the whole doctrine of faith and good manners, our Covenant rejects all traditions contrary, without and beside the word of God, and so it rejects all religious observances, all human ceremonies, all religious symbolical signs, all new means of worshipping God, all images, positive rites which have any influence in God’s worship as will-worship, and impious additions to God’s word, Jer. 7:7; 2 Sam. 7:7; Deut. 12:32; Deut. 4:2; Lev. 10:2; Heb. 1:13; Heb. 7:14; 1 Chron. 15:13; 1 Kings 12:32; Matt 15:14; Rev. 22:18, whereas they lack warrant from God’s word. All actions of divine worship, all religious means of worship, all actions of moral conversation must be warranted by, according as it is written…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), Ch. 20, Article 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<main class="wrap"><figure class="quote" id="q-7e9ce0bb64" data-kw="">
<blockquote><p>The language of synchronic contingency [something can be contingent in different ways at the same time, and that alternatives can be contingent possibilities at the same time]… What makes the language interesting is its application to the particular case of the concurrent willing of two rational beings [God and a human person] involved in the actualization of one effect–a case in which both of the beings could will otherwise, but given that both wills taken together are the necessary and sufficient conditions for the actualization of the effect, both must be understood as freely concurrring to a single effect. That is interesting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Will &amp; Human Choice: Freedom, Contingency &amp; Necessity in Early Modern Reformed Thought Excerpt</cite>, pp. 314-315</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-47cd471641" data-kw="">
<blockquote><p>Suppose an apparently strong and healthy man should apply to you for relief, and, when asked why he did not labor for his subsistence, should reply, Because I can find no one to employ me. If you wished to know whether this or indolence were the true reason, you would offer him employment; and if he then refused to labor, you would feel satisfied that he was slothful and undeserving of your charity. So, when God puts into the hands of sinners a price to get wisdom, and they do not improve it, it becomes evident that they do not wish, that they are not willing, to become religious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-payson.html">Edward Payson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Select Thoughts’, in The Complete Works of Edward Payson, vol. 1, p. 488 | The Sinner’s Unwillingness to go to Christ</cite></span></figcaption>

</figure><figure class="quote" id="q-24bfbca880" data-kw="">
<blockquote><p>God has implanted two accounts [rationes] in the first matter, namely, causal or obediential principles whereby all things are naturally apt to obey God, such that whatever might please him would come to be from them. He has also implanted seedlike principles—that is, active principles whereby natural effects are brought about; and he is sometimes said to act contrary to these in the miracles that he performs. But properly speaking, even then he does not act contrary to them, but alongside them, or above them. He acts above them when he brings about an effect to which nature can in no way reach, like the form of glory for the glorified bodies. He acts alongside them when he produces without the service of natural causes an effect that nature can bring about, like when in John 2 he converts water into wine. But he does not act contrary to them, since he does not make it that an active natural cause, while remaining the same in species, has a different essential effect, such as that a fire, while remaining a fire, might cool something, just as it cannot simultaneously be the same thing and different. But he can indeed destroy one nature and make another, remove one form from matter and induce another; for in this way fire acts contrary to the nature of air when it corrupts it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences | bk. 1, dist. 42, Power of God, quest. 2, art. 2, ‘Whether God can do things that by nature are impossible’, reply to obj. 4</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

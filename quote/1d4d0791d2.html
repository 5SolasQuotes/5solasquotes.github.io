<main class="wrap"><figure class="quote" id="q-1d4d0791d2" data-kw="">
<blockquote><p>3… But more especially the Holy Ghost is compared to a wind in respect of its irresistable workings; as nothing can resist the wind, it goes and blows which way soever it will; so nothing can resist the Spirit of God, wheresoever it has a purpose to work efficaciously; I will not say, but the heart of a man may resist and reject the work of the Spirit in some measure, and in some degrees; Stephen told the Jews, they had always resisted the Holy Ghost (Act. 7:51); and the apostle tells of strong holds, and of every high thing that exalts itself against God (2 Cor. 10:5); so there is a natural contrariety, a constant enmity and active resisting of God’s Spirit by our spirits; we must therefore distinguish between a prevalent and a gradual resisting; the Spirit in conversion so works that He takes away the prevalent, but not the gradual resisting; A man before he be converted is froward, and full of cavils and prejudices; he is unwilling to be saved; he cannot abide the truth; he does what he can to stifle all good motions: yet if he belong to the election of grace, God will at last over-master his heart and make him of unwilling, willing; He will omnipotently bow and change the will and work on his soul by his mighty power efficaciously, insuperably and irresistably.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Looking unto Jesus: a View of the Everlasting Gospel</cite>, … (d. 1664; London: Chiswel, 1680), bk. 8, Ascension, ch. 1, sect. 9, ‘Manner how the Holy Ghost was sent’, p. 488</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-feec0879c4" data-kw="">
<blockquote><p>If the things themselves are promised in the covenant, then all those with whom this covenant is made must be really and effectually made partakers of them. But this is not so; they are not all actually sanctified, pardoned, and saved, which are the things here promised.&#x27; Ans. The making of this covenant may be considered two ways: 1. As unto the preparation and proposition of its terms and conditions. 2. As unto the internal stipulation between God and the souls of men. In this sense alone God is properly said to make this covenant with any. The preparation and proposition of laws are not the making of the covenant. And therefore all with whom this covenant is made are effectually sanctified, justified, and saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 179</span></figcaption>

<blockquote><p>LVIII. 3. The will of God is also distinguished into that by which He wills to do or to prevent something, and which is called “the will of his good pleasure,” or rather “of his pleasure” (Ps. 115:3), and into that by which He wills something to be done, or to be omitted, by creatures endued with understanding, and which is called “the will [signi] which is signified.” The latter is revealed; the former is partly revealed, and partly hidden. (Mk. 3:35; 1 Thess. 4:3; Dt. 29:29; 1 Cor. 2:11-12) The former is efficacious, for it uses power, either [tanta] so much as cannot be resisted, or [tali] such a kind as He certainly knows nothing will withstand: (Ps. 33:9; Rom. 9::19) The latter is called “inefficacious,” and resistance is frequently made to it; yet so that, when the creature [excedit ordinem] transgresses the order of this revealed Will, the creature by it may be reduced to order, and that the Will of God may be done [de] on those by whom his Will has not been performed. (2 Sam. 17:14; Isa. 5:4-5; Mt. 21:39-41; Acts 5:4; 1 Cor. 7:28) To this twofold Will is opposed the remission of the Will, which is called “Permission,” and which is also two-fold. The one, which permits something to the power of a rational creature, by not circumscribing its act with a law; and this is opposed to “the revealed Will.” The other is that by which God permits something [potentiae] to the capability and will of the creature, by not interposing an efficacious hindrance; and this is opposed to “the Will of God’s pleasure” that is efficacious. (Acts 14:16; Ps. 81:13)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-arminius.html">James Arminius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of James Arminius</cite>, tr. James Nichols (Auburn: Derby, Miller, Orton, 1853), vol. 1, Public Disputations, Disputation 4, ‘On the Nature of God’, pp. 453-54 Arminius was a theological professor at Leiden. He tended not to go into controversial things in his Public Disputations.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

<blockquote><p>Hence alone it is that the promises of grace under the old testament are given unto the church under these names, because they were types of them who should really and effectually be made partakers of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 143</span></figcaption>

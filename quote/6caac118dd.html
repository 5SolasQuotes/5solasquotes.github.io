<main class="wrap"><figure class="quote" id="q-6caac118dd" data-kw="">
<blockquote><p>O Jehovah, who shall dwell in thy tabernacle? As nothing is more common in the world than falsely to assume the name of God, or to pretend to be his people, and as a great part of men allow themselves to do this without any apprehension of the danger it involves, David, without stopping to speak to men, addresses himself to God, which he considers the better course; and he intimates, that if men assume the title of the people of God, without being so in deed and in truth, they gain nothing by their self-delusion, for God continues always like himself, and as he is faithful himself, so will he have us to keep faith with him in return. No doubt, he adopted Abraham freely, but, at the same time, he stipulated with him that he should live a holy and an upright life, and this is the general rule of the covenant which God has, from the beginning, made with his Church.

The sum is, that hypocrites, who occupy a place in the temple of God, in vain pretend to be his people, for he acknowledges none as such but those who follow after justice and uprightness during the whole course of their life. David saw the temple crowded with a great multitude of men who all made a profession of the same religion, and presented themselves before God as to the outward ceremony; and, therefore, assuming the person of one wondering at the spectacle, he directs his discourse to God, who, in such a confusion and medley of characters, could easily distinguish his own people from strangers.

There is a threefold use of this doctrine. In the first place, If we really wish to be reckoned among the number of the children of God, the Holy Ghost teaches us, that we must show ourselves to be such by a holy and an upright life; for it is not enough to serve God by outward ceremonies, unless we also live uprightly, and without doing wrong to our neighbours.

In the second place, As we too often see the Church of God defaced by much impurity, to prevent us from stumbling at what appears so offensive, a distinction is made between those who are permanent citizens of the Church, and strangers who are mingled among them only for a time. This is undoubtedly a warning highly necessary, in order that when the temple of God happens to be tainted by many impurities, we may not contract such disgust and chagrin as will make us withdraw from it.

By impurities I understand the vices of a corrupt and polluted life. Provided religion continue pure as to doctrine and worship, we must not be so much stumbled at the faults and sins which men commit, as on that account to rend the unity of the Church. Yet the experience of all ages teaches us how dangerous a temptation it is when we behold the Church of God, which ought to be free from all polluting stains, and to shine in uncorrupted purity, cherishing in her bosom many ungodly hypocrites, or wicked persons.

From this the Catharists, Novatians, and Donatists, took occasion in former times to separate themselves from the fellowship of the godly. The Anabaptists, at the present day, renew the same schisms, because it does not seem to them that a church in which vices are tolerated can be a true church. But Christ, in Matthew 25:32, justly claims it as his own peculiar office to separate the sheep from the goats; and thereby admonishes us, that we must bear with the evils which it is not in our power to correct, until all things become ripe, and the proper season of purging the Church arrive. At the same time, the faithful are here enjoined, each in his own sphere, to use their endeavours that the Church of God may be purified from the corruptions which still exist within her.

And this is the third use which we should make of this doctrine. God’s sacred barn-floor will not be perfectly cleansed before the last day, when Christ at his coming will cast out the chaff; but he has already begun to do this by the doctrine of his gospel, which on this account he terms a fan. We must, therefore, by no means be indifferent about this matter; on the contrary, we ought rather to exert ourselves in good earnest, that all who profess themselves Christians may lead a holy and an unspotted life.

But above all, what God here declares with respect to all the unrighteous should be deeply imprinted on our memory; namely, that he prohibits them from coming to his sanctuary, and condemns their impious presumption, in irreverently thrusting themselves into the society of the godly. David makes mention of the tabernacle, because the temple was not yet built. The meaning of his discourse, to express it in a few words, is this, that those only have access to God who are his genuine servants, and who live a holy life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of Psalms</cite>, (1557), trans. James Anderson in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 4b: 203-05.</span></figcaption>

<blockquote><p>Sundry of the better sort among us are prone to think that testimonies are of no value without that they be carried to great heights. Hence I pointed them to a notable instance we have have upon record concerning Joseph of Arimathea, to whom the Spirit of God has given a great character, Lk. 23:50-51. He was a good man and just, he consented not to the horrid deed of the murderers of our Lord. Some of note in our day would have said, That was not enough, he ought to have made a more resolute appearance; but we read not that the Lord said so. In several cases the current may be so very strong, that there’s access for no more than through grace to guard against the being carried down with it; ‘Thou shalt not follow a multitude to do evil,” Ex. 23:2.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Sundry of the better sort among us are prone to think that testimonies are of no value without that they be carried to great heights. Hence I pointed them to a notable instance we have have upon record concerning Joseph of Arimathea, to whom the Spirit of God has given a great character, Lk. 23:50-51. He was a good man and just, he consented not to the horrid deed of the murderers of our Lord. Some of note in our day would have said, That was not enough, he ought to have made a more resolute appearance; but we read not that the Lord said so. In several cases the current may be so very strong, that there’s access for no more than through grace to guard against the being carried down with it; ‘Thou shalt not follow a multitude to do evil,” Ex. 23:2.”

<blockquote><p>That “the Revolution Settlement,” by which the liberties of the Church were secured, under the reign of William and Mary, was in all respects satisfactory, has never been maintained by this Church. On the contrary, various circumstances may be pointed out as hindering the Church from realizing fully the attainments that had been reached during the Second Reformation. Not only were the three kingdoms of England, Scotland, and Ireland, unprepared for prosecuting the work of “reformation and uniformity in religion” to which they had pledged themselves; but even in Scotland itself the reluctant concessions of statesmen were limited to what a people, worn out by long and heavy tribulation, were barely willing to accept as a relief; – and did not thoroughly undo the mischief of an age of misrule.

Thus, for instance, in the civil sanction then given to Presbytery, the Parliament of 1690, overlooking altogether the higher attainments of the Second Reformation, went back at once to the Act 1592, and based its legislation upon that Act alone, as being the original charter of the Presbyterian Establishment. Accordingly, it left unrepealed the infamous “Act Rescissory” of King Charles, by which all that the Church had done, and all that the State had done for her, in the interval between 1638 and the Restoration, had been stigmatized as treasonable and rebellious. Thus the Revolution Settlement failed in adequately acknowledging the Lord’s work done formerly in the land.

And it was, besides, in several matters of practical legislation, very generally considered by our fathers at the time to be defective and unsatisfactory. Some, and these not the least worthy, even went so far as to refuse all submission to it. But for the most part, our fathers, smarting from the fresh wounds of anti-Christian oppression, weary of strife, and anxious for rest and peace, either thankfully accepted, or at least acquiesced in it; in the hope of being able practically to effect under it the great ends which the Church had all along, in all her former contendings, regarded as indispensable.

For it would be in a high degree ungrateful to overlook the signal and seasonable benefits which the Revolution Settlement really did confer upon the Church, as well as upon the nation. Not only did it put an end to the cruel persecution by which the best blood of Scotland had been shed in the field, on the hill-side, and on the scaffold; not only did it reinstate in their several parishes the pastors who had been unrighteously cast out in the reign of the second Charles, and set up again the platform of the Presbyterian government; but by reviving and re-enacting the Statute of 1592, – the original charter and foundation of Presbytery, it recognised as an inalienable part of the constitution of this country the establishment of the Presbyterian Church.

It secured also effectually, as was then universally believed, the exclusive spiritual jurisdiction of the Church, and her independence in spiritual matters of all civil control. And by the arrangements which it sanctioned for the filling up of vacant charges, it abolished those rights of patronage which had been reserved in 1592, [Act 7th June 1690] and made provision for enforcing the fundamental principle of this Church, that “no pastor shall be intruded into a congregation contrary to the will of the people.” On all these grounds the Church was well entitled to rejoice in the deliverance wrought out for her in 1688 and 1690; to thank God for it, and take courage; and to cherish the warm and sanguine expectation of reaping now the fruit of her struggles and her trials, in a career of undisturbed, united and successful exertion, for the glory of her great Head, the good of the land, and the saving of many souls.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a931e0e622" data-kw="">
<blockquote><p>Controversy 3 – Would Jesus Christ have been made man and come into the world if men had not sinned? We deny against the Socinians and Scholastics. Arguments: 1. He was only promised after the fall (Gen. 3:15), and He could not have been born of a virgin except in virtue of the promise. 2. Those who are well have no need of a physician (Mt. 9:13). He only came to save sinners (2 Tim. 1:15). 3. He has been sent on the basis of the love of God toward fallen man (Jn. 3:16), which could not exist in that case. [That is, He would not have had compassion on fallen man, if man had not fallen. This compassion and love for fallen man is given as the reason for the Father sending the Son.] 4. It would not have been necessary for God to be man; therefore, He would have come in vain. 5. Nor would humanity have had any obligation (obligatio) to Him as incarnate. Objections: 1. Christ is the firstborn of all creatures (Col. 1:15). Reply. ‘Firstborn’ means generated from eternity before all creatures. 2. In all things, He is preeminent (primus) (v. 19). Reply. In dignity and position. 3. All things have been created in Him (meaning “on account of Him”). Reply. All things have been created on account of Him as God not as man. 4. Then we have not been made on account of Christ, but He was made on account of us. Reply. Yes, as man. Objection. Then we should be given thanks since it is on account of us. Reply. That’s ridiculous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’</cite>, pp. 112-3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-85f68b35e8" data-kw="">
<blockquote><p>Nothing can be plainer than that the Scriptures do teach that Christ is truly God, that He is truly man, and that He is one person. They assert of Him whatever may be said of God, and everything that can be said of a sinless man. They enter into no explanations. They assume it as a certain fact that Christ is God and man in one person, just as they assume that a man is a soul and body in one person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 2, pt. 3, ch. 3, “Person of Christ”</span></figcaption>

<blockquote><p>46. The assumption of the human nature in the divine hypostasis did not cause any change in the divine nature, but only in the human nature. For all change is either generation or corruption or augmentation or diminution or alteration or local motion. Nothing of this kind, however, takes place in the divine nature. 47. The union of both natures of Christ is incomprehensible to us. The reason is that it is a union of the finite with the infinite. Even if the union between Christ and the Church is incomprehensible to us, all the more this mystery.</p></blockquote>

</figure><figure class="quote" id="q-d8bf480114" data-kw="">
<blockquote><p>It traces the central contours of the Christological debates, from the discussion between Luther and Zwingli in the 1520s to the Colloquy of Montbeliard in 1586… Cross shows that Luther’s Christology is thoroughly Medieval, and that innovations usually associated with Luther-in particular, that Christ’s human nature comes to share in divine attributes-should be ascribed instead to his younger contemporary Johannes Brenz. The discussion is highly sensitive to the differences between the various Luther groups-followers of Brenz, and the different factions aligned in varying ways with Melanchthon-and to the differences between all of these and the Reformed theologians. By locating the Christological discussions in their immediate Medieval background, Cross also provides a comprehensive account of the continuities and discontinuities between the two eras. In these ways, it is shown that the standard interpretations of the Reformation debates on the matter are almost wholly mistaken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communicatio Idiomatum: Reformation Christological Debates in Changing Paradigms in Historical &amp; Systematic Theology</cite></span></figcaption>

lank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2838d2990a" data-kw="two wills dyothelite">
<blockquote><p>The reasons are: (1) the opposition of the two natures in Christ is frequent in Scripture (Rom. 1:3; 1 Pet. 3:18; Heb. 9:14; Jn. 1:14; Phil. 2:6, 7, 11); (2) two wills are ascribed to him (“not my will, but thine, be done,” Lk. 22:42). Nor does it follow that there are two willing because the will belongs to the nature, while willing belongs to the person; nor is it evident that the will follows personally forthwith because in God there are three persons, but only one will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.7.14</span></figcaption>

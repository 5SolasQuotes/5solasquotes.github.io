<blockquote><p>These prophets [in 1 Cor. 14] were prophets by office, and so beside that they were gifted, they were sent with official authority to preach:

1. They are such as Paul speaks of, 1 Cor. 12:28, ‘God hath set some in the Church, first apostles, secondarily prophets,’ therefore, they were officers set in the body, as apostles were at that time, Eph. 4:11.

2. They are called prophets, 1 Cor. 14:29, 32. But in all the Old or New Testament, prophets signify over these that are in office, as the places in the margin clear, and a place cannot be brought where the word prophet signifies a man who publicly preaches, and yet is no prophet by office, but possibly a fashioner, a ploughman, a shoemaker.

3. The formal effects of public edifying, comforting, convincing, converting souls are ascribed to these prophets, vv. 1, 3-5, 12, 24-25, 31, which are ascribed to preaching pastors, Rom 10:14-15; 1 Cor. 14:1-3.

4. In this chapter, and in ch. 13, Paul does set down canons anent the right use of the offices that he spake of, 1 Cor. 12:28-29.

5. Paul must think them prophets by office, while as he compares himself who was an apostle and prophet with these prophets, v. 37, ‘If any man think himself to be a prophet, or spiritual, let him acknowledge that the things that I write to you are the commandments of the Lord.’ Also these prophets were extraordinary and temporary, as were the gifts of tongues and miracles; and therefore none out of office now are to prophesy publicly. Mr. Robinson says, they cannot be extraordinary, because extraordinary prophets are infallible, and cannot err, else the Scriptures should have been written by prophets who could err; but these prophets, 1 Cor. 14, could err and were not infallible because their doctrine was to be judged, v. 29. Answer: This is a silly reason, Pareus, Bulling, Calvin, Beza say all spirits are to be tried by the Word, and all prophets, even Samuel and Nathan may err, and look beside the book, and may speak of their own spirit. How then were the penmen of Scripture infallible, says Robinson? I answer, there are none simply infallible but God; every man is a liar: The penmen of the Scripture were infallible, because when they were actually inspired by the Holy-Ghost, they could not err: and the spirits of all prophets are to be tried by the Word, even of Paul preaching at Berea: But it follows not that Paul then could err. To this they answer that false prophets, as Balaam, could not err when they were actually inspired, no more than canonic writers. Answer: In the case of infallibility all are alike, none are infallible by any infused habit of a prophetical spirit; but false prophets were inspired with an habitual spirit of lying, which spirit is not in canonic writers. Robinson and others of his side think them not extraordinarily inspired:

1. Because these prophets might have been interrupted and put to silence, that another to whom choicer things were revealed, might prophesy, v. 3.

2. Because Paul exhorts to pray for the gift of interpretation, and to covet (say others) to prophesy. Now we cannot seek in faith from God an extraordinary and miraculous gift.

3. Others add, this prophesying was subject to the free-will of the prophets, for they might prophesy, or keep silence, as they pleased; but the acts of extraordinary prophesying are not subjected to the free-will of the prophets; therefore this was but ordinary prophesying, to the which all gifted professors even out of office are obliged for the edifying of the Church of Christ to the world’s end. Answer: All these three come to one, to wit, acts of extraordinary prophesying are under the determination of free-will. A little of this. 1st Conclusion: Pareus observes well that there be two kinds of prophets.

1. Some who foretold things to come, of these the text in hand speaks not.

2. Some extraordinarily inspired with an extraordinary grace of interpreting Scripture: The former were prophets in the Old Testament, the latter especially prophets of the New Testament; knowledge of both were given without study or pains. So there was a prophetical spirit in Paul, Gal. 1:12, ‘I received it not of man, neither was I taught it, but by the revelation of Jesus Christ.’ 2nd Conclusion: The act of foretelling things to come, especially things merely contingent, which are determined only in the free decree of God, is not so under our free-will, as the acts of preaching and interpreting Scripture out of a prophetical infused habit: For prophesying things to come seemed to have come on the prophets of old, as a fire-flash appears to a man’s eye in the dark air, he cannot choose but see it, Eze. 2:14, ‘So the spirit lifted me up, and took me away, and I went in bitterness, in the heat of my spirit, but the hand of the Lord was strong upon me,’ Jer. 20:9, ‘And I said, I will not make mention of him, nor speak any more in his name, but his word was in my heart, as a burning fire shut up in my bones, and I was weary with forbearing, and I could not stay,’ 2 Kings 3:15, ‘The hand of the Lord came upon Elisha, and he prophesied.’ See Jerome, Oecumenius, Gregory and Thomas. The prophetical spirit in the New Testament seems to be more swayed with free-will, and moral threatnings, 1 Cor. 9:16, ‘Woe unto me if I preach not the Gospel; yet the habit from whence he preached was a prophetical principle, Gal. 1:12; 1 Cor. 14:32. 3rd Conclusion: Hence prophesying is not a habit and it is a habit. It is not a habit:

1. Because no prophet can simply prophecy when he will, except the man Christ, especially of things to come by contingent causes (the presence of which things (says Suarez) is only connatural to God, and to no moral man) coming on men by a transient irradiation, while as the candle of God’s prophetical light glances upon the fancy, and from thence to the mind, that the man may see and read the species and images, and when this light shines not Nathan and Samuel read beside the Bible and are widely out. Prophecy also is a habit for: 1. something remains in Isaiah and Jeremiah while they sleep and prophesy not, from whence they are named prophets and really are prophets; for when God has once revealed himself to one as to his own prophet, even from by-past revelation:

1. There remains a disposition to prophecy, 1 Sam. 3:20, All Israel knew, even from Dan to Beersheba, that Samuel was established to be a prophet of the Lord.

2. Because there remains a prophetical light, whereby the man gave assent to the last prophetical revelation, and so the species and prophetical images must remain in the fantasy, and with these a prophetical memory of by past predictions, and so some experimental certainty, that what he foretells shall come to pass: See Thomas and Cajetan. …

4. Conclusion: Hence Separatists may see that extraordinary acts of prophecy may well be subjected to the determination of the Church, and yet be extraordinary inspirations, and that diverse ways:

1. Because they were prophets of the New Testament, and so grace being more abundant now nor under the Old Testament, it can bow and facilitate free-will to acts of prophesying, and Paul from more grace labored more abundantly than they all.

2. Prophesying at that time in Corinth might well be obtained by prayer upon the extraordinary impulsion of the spirit, as Daniel obtained by prayer the interpretation of a dream; neither can it be proved from 1 Cor. 14 that Paul wills them all without exception to covet to speak with tongues and to prophesy, but only these that were extraordinarily moved to pray, except these [words] (v. 31, ‘ye may all prophecy’) be contrary to these words (1 Cor. 12:29, ‘are all prophets?’) which we cannot say.

3. Because it was of old in the power of prophets to use some means to dispose themselves to prophecy, for when the passion of anger overclouded the fancy and the species therein, then Elisha calls for a minstrel to play, and dispose the mind better, as Cajetan says: Howbeit for all that the text says the hand of the Lord only actuated these species and caused him to prophesy.</p></blockquote>

hets+who+could+err%3B+but+these+prophets%2C+1+Cor.+14%2C+could+err+and+were+not+infallible+because+their+doctrine+was+to+be+judged%2C+v.+29.+Answer%3A+This+is+a+silly+reason%2C+Pareus%2C+Bulling%2C+Calvin%2C+Beza+say+all+spirits+are+to+be+tried+by+the+Word%2C+and+all+prophets%2C+even+Samuel+and+Nathan+may+err%2C+and+look+beside+the+book%2C+and+may+speak+of+their+own+spirit.+How+then+were+the+penmen+of+Scripture+infallible%2C+says+Robinson%3F+I+answer%2C+there+are+none+simply+infallible+but+God%3B+every+man+is+a+liar%3A+The+penmen+of+the+Scripture+were+infallible%2C+because+when+they+were+actually+inspired+by+the+Holy-Ghost%2C+they+could+not+err%3A+and+the+spirits+of+all+prophets+are+to+be+tried+by+the+Word%2C+even+of+Paul+preaching+at+Berea%3A+But+it+follows+not+that+Paul+then+could+err.+To+this+they+answer+that+false+prophets%2C+as+Balaam%2C+could+not+err+when+they+were+actually+inspired%2C+no+more+than+canonic+writers.+Answer%3A+In+the+case+of+infallibility+all+are+alike%2C+none+are+infallible+by+any+infused+habit+of+a+prophetical+spirit%3B+but+false+prophets+were+inspired+with+an+habitual+spirit+of+lying%2C+which+spirit+is+not+in+canonic+writers.+Robinson+and+others+of+his+side+think+them+not+extraordinarily+inspired%3A+1.+Because+these+prophets+might+have+been+interrupted+and+put+to+silence%2C+that+another+to+whom+choicer+things+were+revealed%2C+might+prophesy%2C+v.+3.+2.+Because+Paul+exhorts+to+pray+for+the+gift+of+interpretation%2C+and+to+covet+%28say+others%29+to+prophesy.+Now+we+cannot+seek+in+faith+from+God+an+extraordinary+and+miraculous+gift.+3.+Others+add%2C+this+prophesying+was+subject+to+the+free-will+of+the+prophets%2C+for+they+might+prophesy%2C+or+keep+silence%2C+as+they+pleased%3B+but+the+acts+of+extraordinary+prophesying+are+not+subjected+to+the+free-will+of+the+prophets%3B+therefore+this+was+but+ordinary+prophesying%2C+to+the+which+all+gifted+professors+even+out+of+office+are+obliged+for+the+edifying+of+the+Church+of+Christ+to+the+world%E2%80%99s+end.+Answer%3A+All+these+three+come+to+one%2C+to+wit%2C+acts+of+extraordinary+prophesying+are+under+the+determination+of+free-will.+A+little+of+this.+1st+Conclusion%3A+Pareus+observes+well+that+there+be+two+kinds+of+prophets.+1.+Some+who+foretold+things+to+come%2C+of+these+the+text+in+hand+speaks+not.+2.+Some+extraordinarily+inspired+with+an+extraordinary+grace+of+interpreting+Scripture%3A+The+former+were+prophets+in+the+Old+Testament%2C+the+latter+especially+prophets+of+the+New+Testament%3B+knowledge+of+both+were+given+without+study+or+pains.+So+there+was+a+prophetical+spirit+in+Paul%2C+Gal.+1%3A12%2C+%E2%80%98I+received+it+not+of+man%2C+neither+was+I+taught+it%2C+but+by+the+revelation+of+Jesus+Christ.%E2%80%99+2nd+Conclusion%3A+The+act+of+foretelling+things+to+come%2C+especially+things+merely+contingent%2C+which+are+determined+only+in+the+free+decree+of+God%2C+is+not+so+under+our+free-will%2C+as+the+acts+of+preaching+and+interpreting+Scripture+out+of+a+prophetical+infused+habit%3A+For+prophesying+things+to+come+seemed+to+have+come+on+the+prophets+of+old%2C+as+a+fire-flash+appears+to+a+man%E2%80%99s+eye+in+the+dark+air%2C+he+cannot+choose+but+see+it%2C+Eze.+2%3A14%2C+%E2%80%98So+the+spirit+lifted+me+up%2C+and+took+me+away%2C+and+I+went+in+bitterness%2C+in+the+heat+of+my+spirit%2C+but+the+hand+of+the+Lord+was+strong+upon+me%2C%E2%80%99+Jer.+20%3A9%2C+%E2%80%98And+I+said%2C+I+will+not+make+mention+of+him%2C+nor+speak+any+more+in+his+name%2C+but+his+word+was+in+my+heart%2C+as+a+burning+fire+shut+up+in+my+bones%2C+and+I+was+weary+with+forbearing%2C+and+I+could+not+stay%2C%E2%80%99+2+Kings+3%3A15%2C+%E2%80%98The+hand+of+the+Lord+came+upon+Elisha%2C+and+he+prophesied.%E2%80%99+See+Jerome%2C+Oecumenius%2C+Gregory+and+Thomas.+The+prophetical+spirit+in+the+New+Testament+seems+to+be+more+swayed+with+free-will%2C+and+moral+threatnings%2C+1+Cor.+9%3A16%2C+%E2%80%98Woe+unto+me+if+I+preach+not+the+Gospel%3B+yet+the+habit+from+whence+he+preached+was+a+prophetical+principle%2C+Gal.+1%3A12%3B+1+Cor.+14%3A32.+3rd+Conclusion%3A+Hence+prophesying+is+not+a+habit+and+it+is+a+habit.+It+is+not+a+habit%3A+1.+Because+no+prophet+can+simply+prophecy+when+he+will%2C+except+the+man+Christ%2C+especially+of+things+to+come+by+contingent+causes+%28the+presence+of+which+things+%28says+Suarez%29+is+only+connatural+to+God%2C+and+to+no+moral+man%29+coming+on+men+by+a+transient+irradiation%2C+while+as+the+candle+of+God%E2%80%99s+prophetical+light+glances+upon+the+fancy%2C+and+from+thence+to+the+mind%2C+that+the+man+may+see+and+read+the+species+and+images%2C+and+when+this+light+shines+not+Nathan+and+Samuel+read+beside+the+Bible+and+are+widely+out.+Prophecy+also+is+a+habit+for%3A+1.+something+remains+in+Isaiah+and+Jeremiah+while+they+sleep+and+prophesy+not%2C+from+whence+they+are+named+prophets+and+really+are+prophets%3B+for+when+God+has+once+revealed+himself+to+one+as+to+his+own+prophet%2C+even+from+by-past+revelation%3A+1.+There+remains+a+disposition+to+prophecy%2C+1+Sam.+3%3A20%2C+All+Israel+knew%2C+even+from+Dan+to+Beersheba%2C+that+Samuel+was+established+to+be+a+prophet+of+the+Lord.+2.+Because+there+remains+a+prophetical+light%2C+whereby+the+man+gave+assent+to+the+last+prophetical+revelation%2C+and+so+the+species+and+prophetical+images+must+remain+in+the+fantasy%2C+and+with+these+a+prophetical+memory+of+by+past+predictions%2C+and+so+some+experimental+certainty%2C+that+what+he+foretells+shall+come+to+pass%3A+See+Thomas+and+Cajetan.+%E2%80%A6+4.+Conclusion%3A+Hence+Separatists+may+see+that+extraordinary+acts+of+prophecy+may+well+be+subjected+to+the+determination+of+the+Church%2C+and+yet+be+extraordinary+inspirations%2C+and+that+diverse+ways%3A+1.+Because+they+were+prophets+of+the+New+Testament%2C+and+so+grace+being+more+abundant+now+nor+under+the+Old+Testament%2C+it+can+bow+and+facilitate+free-will+to+acts+of+prophesying%2C+and+Paul+from+more+grace+labored+more+abundantly+than+they+all.+2.+Prophesying+at+that+time+in+Corinth+might+well+be+obtained+by+prayer+upon+the+extraordinary+impulsion+of+the+spirit%2C+as+Daniel+obtained+by+prayer+the+interpretation+of+a+dream%3B+neither+can+it+be+proved+from+1+Cor.+14+that+Paul+wills+them+all+without+exception+to+covet+to+speak+with+tongues+and+to+prophesy%2C+but+only+these+that+were+extraordinarily+moved+to+pray%2C+except+these+%5Bwords%5D+%28v.+31%2C+%E2%80%98ye+may+all+prophecy%E2%80%99%29+be+contrary+to+these+words+%281+Cor.+12%3A29%2C+%E2%80%98are+all+prophets%3F%E2%80%99%29+which+we+cannot+say.+3.+Because+it+was+of+old+in+the+power+of+prophets+to+use+some+means+to+dispose+themselves+to+prophecy%2C+for+when+the+passion+of+anger+overclouded+the+fancy+and+the+species+therein%2C+then+Elisha+calls+for+a+minstrel+to+play%2C+and+dispose+the+mind+better%2C+as+Cajetan+says%3A+Howbeit+for+all+that+the+text+says+the+hand+of+the+Lord+only+actuated+these+species+and+caused+him+to+prophesy.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Other+citations+%28work+not+named%29%2C+pp.+249-57+in+ch.+16+of+A+Peaceable+%26+Temperate+Plea%E2%80%A6+%28London%2C+1642%29%2C+pp.+249-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff557d905bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f557d905bd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-biblical-prophecy-as-including-expositing-the-scriptures/#:~:text=These%20prophets%20%5Bin%201%20Cor.%2014,species%20and%20caused%20him%20to%20prophesy&amp;text=These%20prophets%20%5Bin%201%20Cor.%2014%5D%20were%20prophets&amp;text=actuated%20these%20species%20and%20caused%20him%20to%20prophesy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-eb03f0b236" data-kw="">
<blockquote><p>First, he that is not at all able to do the essential works of the ministry, that is, to teach the people the Christian faith and a holy life, and to pray and praise God with them, and administer the sacraments, and in some measure oversee the manners of the flock, is no minister, nor to be owned: For he wants [lacks] the essential qualifications: As an illiterate man can be no schoolmaster, nor he a physician, a pilot, an architect, who is utterly ignorant of their work. Secondly, he that preaches heresy, that is, denies any essential point of Christianity or godliness, after the first and second admonition is to be avoided. Thirdly, he that in his application endeavors to disgrace a godly life and to dissuade the people from it on false pretenses and encourages them to a life of wickedness, is a traitor to Christ and not to be owned in the ministry. In a word, any one whose ministry is such as tends to destruction more than to edification and to do more harm than good. But then remember that it is not partiality and passion that must here be judge: nor is everyone an opposer of godliness who opposes the errors of a party or the faults or follies of godly men. Fourthly, that pastor or church who will not let you have communion with them unless you will say or subscribe some falsehood or commit any sin of willful choice, does drive you from their communion by their unlawful terms; and it is not you that are the Separatists, but they.</p></blockquote>

6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/pastors#:~:text=First%2C%20he%20that%20is%20not%20at,that%20are%20the%20Separatists%2C%20but%20they&amp;text=First%2C%20he%20that%20is%20not%20at%20all%20able&amp;text=not%20you%20that%20are%20the%20Separatists%2C%20but%20they" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Mr. Hooker [wrote]: ”An eminently gifted man in an island, where no pastors are, is no less (says Mr. Rutherford) tied in conscience in the extraordinary employment of his calling than if he were formally ordained and chosen their pastor. In some extraordinary cases a gift and Christian love ties even as much to onerousness [difficulty] in using means to save as the office itself.’ See what I add in that place,’ (Mr. Hooker says) ‘then this gifted man in an island, in using his general calling as a Christian, destroys his particular [calling] as a merchant, and turn[s] minister. 2. This is to confound the general and particular calling.’ [Rutherford’s] Answer: Not at all, for in this case, the extraordinary necessity of gaining souls, when other pastors cannot be had, and ordination and election by that means are invincibly wanting hic &amp; nunc [hear and now], turns his Christian calling in place and room of the particular calling of a pastor; and so Mr. Rutherford said well, that in some extraordinary case like this, ‘The naked relation of jurisdiction adds nothing to [the] care and onerousness in point of labor by preaching the Gospel.&#x27;</p></blockquote>

<blockquote><p>Johann Heinrich Heidegger (1633-1698) was one of the great Swiss theologians of the seventeenth century. He served as Professor of Theology at Zurich from 1667 to 1698. Heidegger is remembered for his leading role in the drafting of the Formula Consensus Helveticus, a document, although moderate in tone, intended to unite the Swiss churches against the innovative theology of Saumur. His Corpus Theologiae Christianae is a massive and learned presentation of orthodox Reformed dogmatics.</p></blockquote>

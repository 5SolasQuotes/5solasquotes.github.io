<main class="wrap"><figure class="quote" id="q-29968d7c8a" data-kw="">
<blockquote><p>The first step to true and sound repentance is to be wounded and disquieted in our hearts for sin, until our souls be pierced, and as it were struck through with the feeling of our corruptions, and of God’s displeasure, due unto us for the same, we have not made any entrance into the ways of godliness, nor laid the very foundation of the works of conversion, therefore the Prophet Joel exhorting the Israelites to repentance, biddeth them, rent their hearts: that is, the first stone that must be laid in this building: their hearts must be crushed and broken, for the wickedness committed against the Majesty of God; till then there is no turning unto him: one may as well bid a prisoner that is in strong hold, and hath bolts and fetters upon his heels, walk abroad and take the fresh air, and not remain any longer in that dark &amp; loathsome dungeon, as bid one that hath not his heart crushed &amp; humbled to turn unto the Lord: alas he is held fast in the chains of Satan, and cannot stir one foot to God-ward; therefore is it noted in those converts, Act. 2. 37. that They were pricked in their hearts] when they began the work of repentance, the rebukes of God had wakened their drowsy consciences, so that they saw their sins and God’s vengeance due unto them, and the words of Peter had gone through their hearts, even as a two edged sword, and then they were fit to bee soundly healed and comforted, when they had been pierced, and thoroughly wounded by the Arrows of God.

1 First, till the heart be broken for sin, there can be no plain confession of sin, and therefore no repentance. Men naturally are like wild Ass-Colts, nothing will work upon them, nor bring them unto any good frame or order; though they hear often of their faults, they will not acknowledge them, but be still unruly and untamed, as Paul was before his conversion; so long as he was heart-whole in his own conceit, though he had heard many excellent Sermons (no doubt,) yet he was like a beast still, never bewailing nor confessing his grievous offences, till the Lord had taken him down, and thoroughly mastered him.

2 Nay further, men are so far from taking pains to come to a true acknowledgement of their iniquities, till such time as there is a breach made into their hearts by godly sorrow, they do not so much as desire to be delivered from them, nor make any reckoning of God’s mercy for the pardoning of them: till such time as they become mourners for sin, they cannot possibly hunger and thirst after righteousness. And indeed what reason is there that they should esteem of that medicine which will cure, when they do not feel themselves to be sick? they think it a matter worth the looking after, to be freed from poverty, from infamy, from the pestilence, &amp;c. but as for the corruptions of their nature, and the sinfulness of their ways, they were never much troubled with them, and therefore they make little account to be delivered from them.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d79115b944" data-kw="">
<blockquote><p>Even though we have taught in part how faith possesses Christ, and how through it we enjoy his benefits, this would still remain obscure if we did not add an explanation of the effects we feel. With good reason, the sum of the gospel is held to consist in repentance and forgiveness of sins [Luke 24:47; Acts 5:31]. Any discussion of faith, therefore, that omitted these two topics would be barren and mutilated and well-nigh useless. Now, both repentance and forgiveness of sins—that is, newness of life and free reconciliation—are conferred on us by Christ, and both are attained by us through faith. As a consequence, reason and the order of teaching demand that I begin to discuss both at this point. However, our immediate transition will be from faith to repentance. For when this topic is rightly understood it will better appear how man is justified by faith alone, and simple pardon; nevertheless actual holiness of life, so to speak, is not separated from free imputation of righteousness. Now it ought to be a fact beyond controversy that repentance not only constantly follows faith, but is also born of faith. For since pardon and forgiveness are offered through the preaching of the gospel in order that the sinner, freed from the tyranny of Satan, the yoke of sin, and the miserable bondage of vices, may cross over into the Kingdom of God, surely no one can embrace the grace of the gospel without betaking himself from the errors of his past life into the right way, and applying his whole effort to the practice of repentance. There are some, however, who suppose that repentance precedes faith, rather than flows from it, or is produced by it as fruit from a tree. Such persons have never known the power of repentance, and are moved to feel this way by an unduly slight argument.</p></blockquote>

<blockquote><p>Q. 87. What is repentance unto life? A. Repentance unto life is a saving grace,[g] whereby a sinner, out of a true sense of his sin,[h] and apprehension of the mercy of God in Christ,[i] doth, with grief and hatred of his sin, turn from it unto God,[k] with full purpose of, and endeavour after, new obedience.[l] [g] Acts 11:18. [h] Acts 2:37,38. [i] Joel 2:12. Jer. 3:22. [k] Jer. 31:18,19. Ezek. 36:31. [l] 2 Cor. 7:11. Isa. 1:16,17.</p></blockquote>

<blockquote><p>But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), pp. 16-17</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.”

— Archibald A. Alexander, Thoughts on Religious Experience, (Philadelphia: Presbyterian Board of Publication, 1841), pp. 16-17">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+persons+to+whom+we+refer+seem+to+think+that+nothing+is+done+towards+the+salvation+of+men%2C+but+at+the+moment+of+their+conversion%2C+and+that+every+good+effect+must+be+at+once+manifest.+Perhaps+some+one+may+infer+that+we+believe+in+a+gradual+regeneration%2C+and+that+special+grace+differs+from+common%2C+only+in+degree%3B+but+such+an+inference+would+be+utterly+false%2C+for+there+can+be+no+medium+between+life+and+death%3B+but+we+do+profess+to+believe+and+maintain%2C+that+there+is+a+gradual+preparation%2C+by+common+grace%2C+for+regeneration%2C+which+may+be+going+on+from+childhood+to+mature+age%3B+and+we+believe+that%2C+as+no+mortal+can+tell+the+precise+moment%2C+when+the+soul+is+vivified%2C+and+as+the+principle+of+spiritual+life+in+its+commencement+is+often+very+feeble%2C+so+it+is+an+undoubted+truth%2C+that+the+developement+of+the+new+life+in+the+soul+may+be%2C+and+often+is%2C+very+slow%3B+and+not+unfrequently+that+which+is+called+conversion+is+nothing+else+but+a+more+sensible+and+vigorous+exercise+of+a+principle+which+has+long+existed.+Just+as+the+seed+under+ground+may+have+life%2C+and+may+be+struggling+to+come+forth+to+open+day%3B+but+it+may+meet+with+various+obstructions+and+unfavourable+circumstances+which+retard+its+growth.+At+length%2C+however%2C+it+makes+its+way+through+the+earth%2C+and+expands+its+leaves+to+the+light+and+the+air%2C+and+begins+to+drink+in+from+every+source+that+nutriment+which+it+needs.+No+one+supposes%2C+however%2C+that+the+moment+of+its+appearing+above+ground+is+the+commencement+of+its+life%3B+but+this+mistake+is+often+made+in+the+analogous+case+of+the+regeneration+of+the+soul.+The+first+clear+and+lively+exercise+of+faith+and+repentance+is+made+the+date+of+the+origin+of+spiritual+life%2C+whereas+it+existed+in+a+feeble+state%2C+and+put+forth+obscure+acts+long+before.%E2%80%9D%0A%0A%E2%80%94+Archibald+A.+Alexander%2C+Thoughts+on+Religious+Experience%2C+%28Philadelphia%3A+Presbyterian+Board+of+Publication%2C+1841%29%2C+pp.+16-17&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F220fd0f8ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/220fd0f8ce.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/regeneration#:~:text=But%20the%20persons%20to%20whom%20we,put%20forth%20obscure%20acts%20long%20before&amp;text=But%20the%20persons%20to%20whom%20we%20refer%20seem&amp;text=state%2C%20and%20put%20forth%20obscure%20acts%20long%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As to the term ‘regenerated’ or ‘born again’, I do not call one who is enlightened or breathed upon by any motion of the Holy Spirit, regenerated… I call him unregenerate who has not yet attained to this spiritual quickening, however he may have been affected by some preceding operations of the Holy Spirit. … We concede, then, to the Papists, that before the infusion of regenerating grace, many actions which lead the way to faith and contrition, are both required from men, and by them both can, and are wont [accustomed] to be done, through the sole assistance of awakening grace. Of this kind, are not only joining the Church and hearing the Word, but of thinking of God and divine things, considering their peculiar sins, being alarmed by the sense of them, desiring deliverance from this fear, and many other such like things, which are prerequisite to acts truly spiritual and saving. But we affirm, moreover, that the mind and disposition of the unregenerate is engaged in a natural way only with the aforesaid things; that the will is not elevated to produce an act truly spiritual, until regenerating or quickening efficacy shall have been added, besides, to the awakening and evidencing grace. (See Suarez, Opuscula, De Auxil.Div. Grat., bk. 3, chs. 1-2) Moreover, we grant that this regenerating grace is not infused into men remaining inactive and idling looking for some vague fervors or other; but to minds aroused, and brought under and disposed, in some measure, by the aforesaid actions, through the Word and Spirit of God; nevertheless, we deny that the free-will of an unregenerate man is assisted by these auxiliaries, in such was so to dispose itself that God should be bound to infuse quickening grace into any one from merit of congruity. Lastly, we confess that in the Church of God, where men are excited constantly by the Word and Spirit, this regenerating grace, which alone renders them capable of repenting and believing savingly, is denied to no adult of whom it cannot be truly said, that he willingly resists the Holy Spirit in those actions before-mentioned, and also perversely repulses the quickening operation of the same. (See Spalato, bk. 7, p. 239, &amp; Suarez, Opuscula, p. 222) Yet we deny that any mortal man can be found, who, in repelling the preparatory actions of the Spirit, does not incur, abundantly, this demerit; and, inasmuch as some, repelling God by this intervening, common demerit, are repelled of God and left to themselves; others, notwithstanding equal or greater demerit, are often, and more powerfully assailed by grace, and are at length quickened by the omnipotent operation of the Spirit. The mystery is to be referred to the gracious will of God, pitying or not pitying, and [is] not to be rashly enquired into by any human curiosity.</p></blockquote>

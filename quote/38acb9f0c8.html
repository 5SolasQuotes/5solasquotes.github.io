<main class="wrap"><figure class="quote" id="q-38acb9f0c8" data-kw="">
<blockquote><p>In general, that God is perfect and perfectly blessed, I suppose will not be denied; it cannot be but by denying that he is God. He that is not perfect in himself and perfectly blessed is not God. To that which is perfect in any kind nothing is wanting in that kind. To that which is absolutely perfect nothing is wanting at all. He who is blessed is perfectly satisfied and filled, and hath no farther desire for supply. He who is blessed in himself is all-sufficient for himself. If God want or desire any thing for himself, he is neither perfect nor blessed. To ascribe, then, affections to God properly (such as before mentioned), is to deprive him of his perfection and blessedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 109.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>
<div class="actions"><button class="copy" data-copy="“In general, that God is perfect and perfectly blessed, I suppose will not be denied; it cannot be but by denying that he is God. He that is not perfect in himself and perfectly blessed is not God. To that which is perfect in any kind nothing is wanting in that kind. To that which is absolutely perfect nothing is wanting at all. He who is blessed is perfectly satisfied and filled, and hath no farther desire for supply. He who is blessed in himself is all-sufficient for himself. If God want or desire any thing for himself, he is neither perfect nor blessed. To ascribe, then, affections to God properly (such as before mentioned), is to deprive him of his perfection and blessedness.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c54d9e9900" data-kw="">
<blockquote><p>As the Divine will cannot but be perfect, so it cannot be wanting to render the highest love to itself, to its goodness, to the Divine nature, which is due to Him. Indeed, the acts of those, ad extra are not necessary, but upon a condition. To love righteousness without Himself, or to detect sin, or inflict punishment for the committing of it, could not have been, had there been no righteous creature for Him to love, no sinning creature for Him to loathe and to exercise his justice upon as the object of punishment. Some attributes require a condition to make the acts of them necessary, as it is at God’s liberty whether He will create a rational creature or no… It is at his liberty whether He will permit a creature to sin; but if He sees good to suffer it, it is impossible but that He should detest that creature that goes cross to his righteous nature. His holiness is not solely an act of his will, for then he might be unholy as well as holy…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses upon the Existence &amp; Attributes of God 2 vols</cite>, vol. 2 (Robert Carter, 1853), Discourse 11, ‘On the Holiness of God’, pp. 115-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/affections-and-passions-in-god.html">Affections and Passions in God</a></span></div>

<blockquote><p>Hence although love considered affectively and on the part of the internal act is equal in God (because it does not admit of increase and diminution), yet regarded effectively (or on the part of the good which He wills to anyone) it is unequal because some effects of love are greater than others.</p></blockquote>

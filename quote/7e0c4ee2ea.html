<main class="wrap"><figure class="quote" id="q-7e0c4ee2ea" data-kw="">
<blockquote><p>And here I will make a suit to your Highnesses to restore unto the church that discipline of Christ. In excommunicating such as be notable offenders, nor never devise any other way. For no man is able to devise a better way then God hath done, which is excommunication to put them from the congregation till they be confounded. Therefore restore Christ’s discipline for excommunication.

And that shall be a mean both to pacify God’s wrath and indignation against us, and also that less abomination shall be used, then in times paste hath been, and is at this day. I speak this of a conscience, and I mean and moue it of a good will to your grace and your realm. Bring into the church of England open discipline of excommunication that open sinners may be stricken with.

Sometime leaven is taken for corrupt doctrine, and so it is here taken in this place when he sayeth: Be ware of the leaven of the Pharisees. For Christ intended to make his disciples teachers of all the world: and therefore to beware of corrupt doctrine. And that that he said to them he sayeth also to us. Receive no corrupt doctrine, no mingle mangle: yet there be leaveners yet still and mingle manglers, that have soured Christ’s doctrine, with the leaven of the Pharisees. Yea and where there is any peace of leaven, they will maintain that one piece, more then all the doctrine of Christ, and about that purpose they occupy and bestow all their wits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-latimer.html">Hugh Latimer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most faithful sermon preached before the King’s most excellent Majesty, and his most honourable Council, in his court at Westminster</cite>, (London: John Day, 1550), unpaginated.</span></figcaption>

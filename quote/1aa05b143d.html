<blockquote><p>20. In what sense is grace irresistible? It must be remembered that the true Christian is the subject at the same time of those moral and mediate influences of grace upon the will, common to him and to the unconverted, and also of those special influences of grace within the will, which are certainly efficacious. The first class of influences Christians may, and constantly do resist, through the law of sin remaining in their members. The second class of influences are certainly efficacious, but are neither resistible nor irresistible, because they act from within and carry the will spontaneously with them. It is to be lamented that the term irresistible grace has ever been used, since it suggests the idea of a mechanical and coercive influence upon an unwilling subject, while, in truth, it is the transcendent act of the infinite Creator, making the creature spontaneously willing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology new ed. enlarged (London: Nelson, 1879), ch. 28, ‘The Application of Redemption…’</cite>, pp. 451-52</span></figcaption>

<blockquote><p>Calvinists, indeed, do not admit that it is an accurate mode of stating the question, to put it in this form,—whether or not the grace or gracious operation of the Spirit be irresistible? for they do not dispute that, in some sense, men do resist the Spirit; and they admit that resistance to the Spirit may be predicated both of the elect and of the non-elect,—the non-elect having operations of the Spirit put forth upon them which they resist or throw off, and never yield to,—and the elect having generally resisted the operations of the Spirit for a time before they yielded to them. Accordingly, although the only thing in the Arminian declaration, as given in to the Synod of Dort [1618-9], which was regarded as containing a positive error in doctrine, was the assertion that, as to the mode of the Spirit’s operation in conversion, it was not irresistible, there is not, in the canons of the synod, any formal deliverance, in terminis [in such terms], upon this precise point, though all that the Arminians meant to assert, by denying the irresistibility of grace, is clearly and fully condemned. This statement likewise holds true, in all its parts, of our own [Westminster] Confession of Faith. It does not contain, in terminis [in such terms], an assertion of the irresistibility, or a denial of the resistibility, of the grace of God in conversion; but it contains a clear and full assertion of the whole truth which Arminians have generally intended to deny by asserting the resistibility of grace, and which Calvinists have intended to assert, when—accommodating themselves to the Arminian phraseology, but not admitting its accuracy—they have maintained that grace in conversion is irresistible. They [Calvinists] object to the word irresistible, as applied to their doctrine, because of its ambiguity,—because, in one sense, they hold grace in conversion to be resistible, and in another, not. It may be said to be resistible, and to be actually resisted, inasmuch as motions or operations of the Spirit upon men’s minds—which, in their general nature and bearing, may be said to tend towards the production of conversion—are resisted, or not yielded to, by the non-elect, and for a time even by the elect; while it may be said to be irresistible,—or, as Calvinists usually prefer calling it, insuperable, or infrustratable, or certainly efficacious,—inasmuch as, according to their doctrine, whenever the gracious divine power that is sufficient to produce conversion, and necessary to effect it, is put forth, it certainly overcomes all the resistance that men are able to make, and infallibly produces the result.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology, vol. 2 (1862; Banner of Truth, 1994), ch. 25, ‘The Arminian Controversy’, Section 6, ‘Efficacious &amp; Irresistible Grace’</cite>, pp. 408-9</span></figcaption>

get="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>They do not receive this grace as they ought to do. They let it into the ear, giving it the hearing, but not into the heart, embracing of it. They shut the door of their souls against it. Now upon this condition it is that Christ promises to communicate Himself and his grace to those to whom He comes, viz. if they shall open the door to Him, ‘Behold, I stand at the door and knock, if any man hear my voice and open the door, I will come in, and sup with him, and he with Me.’ (Rev. 3.20). It is not the bare hearing of the voice of Christ speaking in his word, but the opening of the door, the letting of Him into the soul, receiving and entertaining Him by faith and love that will bring men to have communion with Him to be made partakers of his grace and Spirit. Now this many will not do; they shut the door of their souls against Jesus Christ, not letting in the motions of his Spirit into their hearts, but opposing, resisting it. This is that which Stephen charges upon the Jews, Acts 7:51, ‘Ye stiff-necked and uncircumcised in heart, and ears, ye do always resist the holy Ghost; as your fathers did so do you.’ And so is it with many, they hear the Word, but they do not let in the monitions of it, nor the motions of the Spirit into their hearts. Question: Why, but is not the grace of God irresistible? A. This is made a matter of controversy, eagerly debated betwixt Arminians and Orthodox divines; I shall not now wade into it. In a word take this resolution: The Spirit of grace in itself is irresistible (I mean so irresistible, as that though it may be opposed, yet it cannot be conquered) but it does not always work in an irresistable way and manner. In itself (I say) it is irresistible, so as if it will put forth its strength, it is able to make way for the motions of it; able to open the door of the soul, though never so closed shut against it, so as not only to illuminate the mind, but also to change the will; not by forcing and constraining it (which being contrary to the nature of the will, is inconsistent with it; should the will be forced, it should cease to be a will, the property whereof is to act freely), but by sweetly inclining it, of unwilling, making it willing to comply and yield to such terms as are tendered to it; by which means the grace of God becomes effectual in it. But this I shall not enlarge upon, resting contented with this, that the grace of God is sufficient for all that shall receive it: sufficient for their conversion.</p></blockquote>

rk+in+an+irresistable+way+and+manner.+In+itself+%28I+say%29+it+is+irresistible%2C+so+as+if+it+will+put+forth+its+strength%2C+it+is+able+to+make+way+for+the+motions+of+it%3B+able+to+open+the+door+of+the+soul%2C+though+never+so+closed+shut+against+it%2C+so+as+not+only+to+illuminate+the+mind%2C+but+also+to+change+the+will%3B+not+by+forcing+and+constraining+it+%28which+being+contrary+to+the+nature+of+the+will%2C+is+inconsistent+with+it%3B+should+the+will+be+forced%2C+it+should+cease+to+be+a+will%2C+the+property+whereof+is+to+act+freely%29%2C+but+by+sweetly+inclining+it%2C+of+unwilling%2C+making+it+willing+to+comply+and+yield+to+such+terms+as+are+tendered+to+it%3B+by+which+means+the+grace+of+God+becomes+effectual+in+it.+But+this+I+shall+not+enlarge+upon%2C+resting+contented+with+this%2C+that+the+grace+of+God+is+sufficient+for+all+that+shall+receive+it%3A+sufficient+for+their+conversion.%E2%80%9D%0A%0A%E2%80%94+John+Brinsley%2C+Aqua+c%C5%93lestis%2C+or+a+Sovereign+Cordial+extracted+from+the+Sufficiency+of+Divine+Grace+%26+Strength+made+Perfect+in+Weakness%E2%80%A6+%28London%3A+Sawbridge%2C+1663%29%2C+pp.+54-56&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F576d817df9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/576d817df9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-common-operations-of-the-spirit/on-the-compatibility-of-irresistible-and-resistible-grace/#:~:text=They%20do%20not%20receive%20this%20grace,receive%20it%3A%20sufficient%20for%20their%20conversion&amp;text=They%20do%20not%20receive%20this%20grace%20as%20they&amp;text=that%20shall%20receive%20it%3A%20sufficient%20for%20their%20conversion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. They resisted the Holy Ghost striving with them by their own consciences, and would not comply with the convictions and dictates of them. God’s Spirit strove with them as with the old world, but in vain; they resisted Him, took part with their corruptions against their convictions, and rebelled against the light. There is that in our sinful hearts that always resists the Holy Ghost, a flesh that lusts against the Spirit, and wars against his motions; but in the hearts of God’s elect, when the fullness of time comes, this resistance is overcome and overpowered, and after a struggle the throne of Christ is set up in the soul, and every thought that had exalted itself against it is brought into captivity to it, 2 Co. 10:4, 2 Co. 10:5. That grace therefore which effects this change might more fitly be called victorious grace than irresistible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts, on 7:51, “…ye do always resist the Holy Ghost…”</cite></span></figcaption>

</figure><figure class="quote" id="q-3e8bc84111" data-kw="">
<blockquote><p>The Calvinist, on the contrary [to Arminianism], holds that the unregenerate man never ceases to resist and never yields to God of his own motion, but only as he is acted upon by the Holy Spirit and is thereby ‘persuaded and enabled’ to cease resisting and to yield obedience. Ceasing to resist God, he [the Calvinist] contends, is holy action, and so is yielding or submitting to God. To refer this kind of action to the sinful and unregenerate will as its author [as the Arminian does], the Calvinist asserts [this] is contrary to the Scripture declaration, that ‘the carnal mind is enmity against God, and is not subject to the law of God, neither indeed can be,’ Rom. 8:7. A will at enmity with God never of itself ceases resisting Him, and never of itself yields to Him. It must be changed from enmity into love by ‘the washing of regeneration and renewing of the Holy Ghost’ in order to sweet and gentle submission. The sinner, as such, cannot, therefore, assist and co-operate with the Holy Spirit in this work of originating faith and repentance, but the whole of it must be done by that Almighty Agent who can turn the human heart as the rivers of water. Christ, through the Spirit, is the sole ‘author of faith’ (Heb. 12:2). When the Holy Spirit puts forth a higher degree of his energy than He exerts in his ordinary operation, He overcomes and stops the sinner’s resistance instead of the sinner’s overcoming and stopping it of himself, and [the Holy Spirit] inclines the sinner to yield to the Divine monitions [admonitions] and impulse instead of the sinner’s yielding of his own accord [as the Arminian says]. If the sinner’s resistance is ‘overcome’, it is overcome by God’s action [according to the Calvinist]; but if it ‘ceases’, it ceases by the sinner’s action [by his own power, according to the Arminian]. To say that common grace [in the sincere strivings of the Spirit] would [hypothetically] succeed [in salvation] if it were not resisted by man, is not the same as saying that common grace would succeed if it were yielded to by man[‘s independent power, as in Arminianism]. [Hypothetical] Non-resistance is different from ceasing resistance [of the Arminian]. In the former [hypothetical] instance there is no opposition by the man [and thus the common, gracious striving of the Spirit in the gospel call would result in saving grace]; in the latter there is opposition, which is put a stop to by the man[‘s independent power, on the Arminian view]. … According to the monergistic [God alone working] or Calvinistic view of grace, on the contrary [to Arminianism], no man receives a grace that is ‘sufficient for generating faith’ who does not receive such a measure of Divine influence as overcomes his hostile will; so that he does not stop his own resistance but it stopped by the mercy and power of God; so that his faith and repentance are not the result in part of his own efficiency, but solely of the Holy Spirit’s irresistible and sovereign energy in regeneration. In a word, the dependence upon Divine grace in the Calvinistic system [in being saved] is total; in the Arminian is partial. In the former, common grace cannot be made saving grace by the sinner’s co-action; in the latter it can be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed (NY: 1893)</cite>, ch. 9, pp. 100-103</span></figcaption>

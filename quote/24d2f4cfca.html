<main class="wrap"><figure class="quote" id="q-24d2f4cfca" data-kw="">
<blockquote><p>Magistrates are likewise bound to suppress all idolatry and false worship within the limits of their jurisdiction. Idolatry being a superstitious worship given to an improper object, is expressly forbidden in the law of God. “Thou shalt have no other gods before me.” “Thou shalt not make unto thee any graven image, or any likeness of any thing that is in heaven above, or that is in the earth beneath, or that is in the water under the earth: Thou shalt not bow down thyself to them, nor serve them.” (Exod. xx. 3, 4, 5.)

In conformity with the spirit of these prohibitions, a witch, of old, was not to be suffered to live; because, pretending to supernatural power, she attempted to withdraw men’s dependence from God, the Creator and Possessor of heaven and earth, who worketh all things according to the counsel of his own will.

As the sin of idolatry is hurtful to the souls of men, it must also be ruinous to the kingdoms and states. If Christians be solemnly warned to “flee from idolatry,” (1 Cor. x. 14,) it must then be the duty of the civil magistrate to remove the temptation, as did reforming kings in the ancient dispensation. “And he (Hezekiah) did that which was right in the sight of the Lord, according to all that David his father did. He removed the high places, and brake the images, and cut down the groves, and brake in pieces the brazen serpent that Moses had made; for unto these days, the children of Israel did burn incense to it; and he called it Nehustan,” (a piece of brass, so named by was of derision.) (2 Kings xviii. 4.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/the-belfast-covenanter.html">The Belfast Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Dissertation on Romans xiii. 1-6. ( Continued from page</cite></span></figcaption>

<blockquote><p>Sept, 17, 1585 Lyttis of the deacons [servants] elected. Henry Nesbet and William Nesbet, bailies, Nicoll Uddert, Dean of Guild, James Ros, Thesaurer [Treasurer], William Littill, Androw Sclater, George Smyth, Tailor [Jailor?], of the Council, and Jhonn Stevinsoun, deykin [deacon/servant?] of the weavers, remembering that since the beginning of this present pestilence they have remained within this burgh constantly, sustained the burdening of the offices laid upon them unto this hour, with the loss and death for the most part of diverse of their children, servants, and family, and not without the extreme danger of their own lives, most eminently known unto all men, the rest of their brethren of the council and deykins [deacons/servants], which were no less astricted, oblist [obliged], and sworn to assist and take care of this commonwealth, having deserted their places and forsaken their offices, contrary to their oaths and allegiance made and given, and yet continuing has not repaired to this burgh at this most necessary time, approached and appointed to convene and surrogate others in their room, whereby the whole estate of this burgh is appearing to fall in confusion; Therefore…</p></blockquote>

<blockquote><p>But then it was said—You are a church established by law. If you wish to be free in your procedure from the control of the civil power, separate yourselves from the State. So long as you receive the emoluments of the State, you must obey its Courts. Nay, it was answered. Never, at least, did we so understand the terms of our connection with the State to be. The Church’s labours and work in return for the State’s livings—such we ever understood the terms of the connection to be—not the Church’s liberties, and subjection to her only King, the price of the State’s livings!

Surely, it was argued, these cannot be the terms on which the Scottish Church, after the long struggles and sufferings of her sons for the freedom and independence of her spiritual government, was at length established by law. The Westminster Confession of Faith is the law of Scotland, as well as of her Church, with those words in it—“The Lord Jesus, as King and Head of his Church, hath therein appointed a government in the hands of Church officers, distinct from the civil magistrate.</p></blockquote>

</figure><figure class="quote" id="q-89f7088cea" data-kw="">
<blockquote><p>Next to fidelity towards God, study to adorn your cause with loyalty to your king, in the Lord, Rom. 13:1, 5; Prov. 24:21; 1 Pet. 2:13. ‘Give unto God the things which are God’s, and unto Ceasar the things which are Cesar’s,” that hereby ye may stop the mouths of them that falsely speak evil of the presbyterian interest and party as inimical to king’s crowns, 1 Pet. 2:15. Did he not in the Usurper’s [Cromwell’s] time find you the most faithful party to him of any? And albeit ye be but ill requat, yet discourage not to follow your duty for the Lord’s sake. We are apt to believe, if any other party in the nation had been so crushed and harassed by his power as ye, none would have born it better. Let him still find that no discouragement will fret or tempt you from your duty and that for conscience-sake, without by-ends; yea, bear due allegiance to him so far as may stand with your allegiance to the King of kings and Lord of lords. And who knows what a conviction this may produce in end? 1 Sam. 24:17-18, testifying to him and all men your cause is of God, which leads you to be so conscientious toward man; and that you are the only fast and faithful friends to authority, who will cleave to it in a stormy day out of the fear of God when all its self-seeking friends will desert it when their interest parts with it; and that it is not humor, but conscience which keeps you off from complying with his will in the matters of your God wherein ye differ from him.</p></blockquote>

<blockquote><p>Having set the understanding of the main Text [Romans 13] right, I come now to those examples that are alleged to prove, That it is lawful to resist in some cases.

1. The example of the peoples resisting Saul’s illegal and tyrannical attempt to have put Jonathan to death without cause.

If this were lawful in them in a particular man’s case (against whom also there was some seeming cause) How much more to resist one that is bent to subvert Religion, Laws and Liberties, and so to take away the life of many at his own pleasure.

To this is answered, not, that it was unlawful in the people to make this resistance (which yet if he deny not, he plainly yields his cause in his first Proposition, and Rom. 13.2. forbids not all Resistance) but only that the people drew not into Arms themselves, but being there at Saul’s command did by a loving violence and importunity hinder the execution of a particular and passionate unlawful command.

To this I reply.

1. If it were lawful now; what hinders but they might have come together to prevent such a mischief as Jonathan’s unjust Death? Sure Saul called them not together to resist himself in any thing. Neither did his calling them together to fight against the Philistines authorize them to fight against him, if it were not lawful of it self.

Our King called the Parliament together, yet he allows not them to resist upon that pretence, though they are undeniably, not the great Council only, but the great Court of Judicature in the Kingdom.

This peace then of his Answer is nothing but words and pretence.

2. As for his loving violence and importunity wherewith he would blanch their Resistance.

Grant they shewed a love to Saul, because Jonathan was Saul’s son. But had Saul counted him his Enemy, (as he did David afterward) It would have sounded harsh violence, and outrageous enough, and it was plainly a great deal beyond a loving violence. For Saul swore his death, and they swore his life, that not a hair of him should, &amp;c.

This was Resistance then with an Oath, as it were, to make Saul forsworn.

After this Example then our people may swear an Association, that not one of the Parliament shall be put to death (unless proved guilty according to Law) notwithstanding any Proclamation of them to be Traitors, or condemning them to death illegally.

3. And thirdly, as it cannot be thought, but if Saul had further attempted by himself, or any of his followers to assault Jonathan, the people would have actively resisted him and them even with arms in Jonathan’s defence.

The second Example is David’s resisting of Saul, sc. by gathering a band of 600. men, and offering to have kept Keilah against Saul, but that God told him the Kilties would have betrayed him.

That he sinned not in it appears.

1. By his own pleading his innocence even to God in his Prayers and Psalms, as far as concerned the business between him and Saul.

2. Himself after this pleads it to Saul, 1 Sam. 24 &amp; 26. and calls God to witness that he had not transgressed at all against him.

3. God himself discharged David from all notorious sin, excepting the matter of Uriah, 1 Kin. 1.5.

Now had not his Resistance been lawful, it had been most notorious Rebellion and Treason.

4. Fourthly, even our Doctor condemns it not, and therefore, all resistance is not unlawful, much less damnable, as he often thunders.

But this Example sticks with him, and therefore he makes a four-fold answer.

1. David’s guard that he had about him was only to secure his person against the cut-throats of Saul, if sent to take away his life.

Reply. But this could not have been done without killing divers of them, if they had assaulted him, which had then been no murder, but a just defence and execution of Justice. So far himself grants lawful.

2. But he says it was a mere defence without any violence offered to Saul. Therefore he still gave place as Saul pursued, and did no act of hostility to him, or any of his Army, when they were in his power, 1 Sam. 26.

Reply. He was not strong enough to encounter Saul in the field, who had divers thousands (3000 mentioned 1 Sam. 13.) against his 600. Wisdom bids him fly as long as he could, rather then fight.

2. Conscience forbids him to kill Saul: so I grant it doth any Subject, though having the King at any such advantage. But that he hurt none of his followers, 1 Sam. 26. was again an act of wisdom, and we need not go to conscience for a reason of it. He had only one man with him, Abishai, and had he offered to kill any of the Army, how soon might this in all likelihood have wakened the rest, and so he had endangered his own life to little purpose. For he could not in probability have killed many, and what had that done to his cause and defence afterward.

Yet also, I hold not that in cold blood, one or many that are upon the defensive, may lawfully kill sleeping enemies, or such waking farther then appears, at least in some sort necessary, or much advantageous to the defence, and prejudicial to the opposites. But if killing, as many as David could have killed that night, himself and Abishai would have given hopes of ending Saul’s pursuit of him, and have made peace; I doubt not, but he would and might have done it, as well as keep Keilah against him.</p></blockquote>

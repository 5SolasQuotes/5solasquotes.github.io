<blockquote><p>XII. As an instrument, He uses his word (Rom. 10:16), and that of both the Law and the Gospel, in different ways: by the former, indeed, preparing the way for the efficacy of vocation (Gal. 3:24), and by the latter, perfecting the same in the called (Rom. 1:16).

XIII. This is also sometimes extraordinary, and God acts beyond the accustomed manner, so that what He is accustomed to effect together with the Word, He produces without its help or assistance, administering the matter by the revelation and efficacy of his Spirit alone (Acts 9:3-6).</p></blockquote>

</figure><figure class="quote" id="q-7bb5dc3c23" data-kw="">
<blockquote><p>Ordination appears to have been performed by apostles, by evangelists, and by a presbytery, Acts 6:6, and 14:23; Tit. 1:5; 1 Tim. 5:22, and 4:14: but never by private Christians. Could these [private Christians] ordain their pastors or other ecclesiastic officers, to what purpose did Paul leave Titus at Crete to ordain elders in every city? Or why did he write never a word about ordination to the people, in any of his epistles, but to their rulers?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters on the Constitution, Government &amp; Discipline of the Christian Church</cite>, (d. 1787), pp. 73-74</span></figcaption>

</figure><figure class="quote" id="q-a860c4a2df" data-kw="">
<blockquote><p>We are all naturally inclined to lean upon man whom we can see, rather than upon God whom we cannot see. We naturally love to lean upon the ministers of the visible Church, rather than upon the Lord Jesus Christ, the great Shepherd and High Priest, who is invisible. We need to be continually warned and set on our guard. I see this tendency to lean on man everywhere. I know no branch of the Protestant Church of Christ which does not require to be cautioned upon the point…. We all naturally love to have a pope of our own. We are far too ready to think, that because some great minister or some learned man says a thing, or because our own minister, whom we love, says a thing—that it must be right, without examining whether it is in Scripture or not. Most men dislike the trouble of thinking for themselves. They like following a leader. They are like sheep, when one goes over the hill all the rest follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Warning to the Churches, ‘The Fallibility of Ministers’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

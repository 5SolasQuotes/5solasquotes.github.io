<blockquote><p>Question: Why is the Magistracy called an ‘ordinance of man’ [1 Pet. 2] v. 13, seeing all powers are ordained of God, and every power is the ordinance of God, Rom. 13:1-2? Answer: The superiority of power, or government itself, is simply and absolutely commanded by God, and in that respect [it] is called the ordinance of God; but this or that special manner of power or government is not determined by God, but by men; and is therefore [it is] called an ordinance of man, which as touching the nature of it, may also be called an ordinance of God: And this is the difference betwixt an ecclesiastical and a civil office: An ecclesiastical office is not legitimate if it be not directly determined by God Himself, and consequently cannot be changed by men: but this or that civil office may be made and changed by men. And the reason of the difference is this, because God and Christ alone has dominion and power in spiritual matters; but in civil matters men are also [g]ods, though not absolute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, … (London, 1641), p. 58</span></figcaption>

<blockquote><p>…the Magistrate indeed forbids speaking of blasphemy and teaching of lies in the name of the Lord, but he forbids not teaching of lies, or abstinence from blaspheming, in a spiritual, but in a carnal, co-active, by force of the sword and external way, because he cannot punish the spiritual and internal ways and manner of external obedience, and therefore he cannot under pain of bodily censure command and forbid these ways of obedience; so the Magistrate forbids murder, but God, not the Magistrate, forbids murder, or commands abstinence from killing, out of mercy and love to our neighbor; for the Magistrate cannot punish heart-hatred of our neighbor, or rash anger, but insofar as it comes out to his senses, in striking, maiming, or opprobrious speeches; and these he can forbid and censure and punish. So we say [that] the Magistrate is but a piece, or a bit of an ordinance (though both lawful and necessary, Rom. 13, for our good [v. 4]) to reform the outside and to work outward reformation; and when he commands the outward man and says, ‘Swear not, blaspheme not, speak not lies in the name of the Lord, kill not, steal not under the pain of feeling the stroke of the sword’: he commands not sinning. For though he forbid only external abstinence from sins that troubles the outward man, without any spiritual and internal right way of abstaining, he commands not sin and hypocrisy, per se, and kindly [in its kind], and properly.

1. Because the Magistrate, as the Magistrate, should and ought, as the Minister of God, give commandments to the outward man under pain of corporal punishment, not to the soul or to the inward man.

2. Because that external obedience, not to kill, not to steal, not to speak lies, is good, lawful external obedience, to man, and profitable in the State for the end that God has appointed it, which is the peaceable conversing one with another; that same abstinence from killing in an unrenewed man, who abstains not from killing for fear of God and love to his brethren, is a sinful abstinence and carnal repentance, by accident, and in relation to the Law of God; but the Magistrate neither commands abstinence from killing from an inward spiritual principle, nor forbids he the contrary: he commands not abstinence from false doctrine out of the love that the messenger owes to him who purchased the flock with his blood, nor forbids he such abstinence, but only he commands abstinence from speaking lies to the people of God.

3. If we distinguish obedience, there is first a necessary and good and lawful obedience. 2. There is an obedience complete and entire, and full, and sincere. Outward obedience, which the Magistrate commands, is good and lawful and [is] necessary obedience, and is, in the kind of external and necessary obedience (I mean) necessary for its end, [namely] the safety of the society, not hypocritical, unlawful or sinful. In this notion only it is commanded by the Magistrate, and the omission of it [is] unlawful and punishable by the sword of the deputy and Minister of God. But if we speak of an obedience complete, full and sincere, which is required from the whole man in order to the Law of God, then the outward obedience that the Magistrate demands is not complete, entire, nor sincere, but in relation to the Law of God, which requires entire obedience from the whole man, soul and body, it is not full, not entire, not sincere obedience, but an outside of obedience; but in this sense the Magistrate does not demand obedience to the Law of God, for he has to do with the outward man only and as a Magistrate has nothing to do with the soul and conscience: so then, though the Magistrate command to preach sound doctrine, forbid to preach lies in the name of the Lord, yet he commands not hypocrisy and sin; for this argument may as well prove [that] the Magistrate should neither forbid nor punish murder, nor command abstinence from murder to an unrenewed man, for an unrenewed man cannot but abstain from murder in a sinful way, and his abstinence from murder, in order to the spiritual Law of God, is no better ‘than the oblation of swine’s blood, and the cutting off of a dog’s head to God,’ Isa. 66. 1:2, as is all external obedience of either Tables of the Law, First or Second, without faith and spiritual, inward, moral principles and heart-obedience; and Mr. Williams cannot answer this argument but by the principles of Anabaptists, Familists and Enthusiasts, who say [that] all outward ordinances, ministry, preaching, sacraments, yea preachers and magistrates who command outward obedience to God are unlawful now under the New Testament.</p></blockquote>

nline · Reformed Books Online</a></div>

<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>

<blockquote><p>Now there was brought forth in Scotland, anno 1610, a certain amphibian brood, sprung out of the stem of Neronian tyranny and in manners like to his nearest kinsman, the Spanish Inquisition. It is armed with a transcendent power and called by the dreadful name of the High Commission. Among other things, it arrogates to itself the power of deposing ministers. But how unjustly, thus it appears:

1. If those commissioners have any power at all to depose ministers, they have it from the king whose commissioners they are. But from him they have it not. Therefore they have none at all. The proposition is most certain: For they sit not in that commission to judge in their own name, nor by their own authority quum nihil exerceat delegatus nomine proprio, as Panormitan says (apud Forb. Iren, bk. 2, ch. 11, p. 177), but by virtue only of the commission and delegation which they have of the king. Yea, bishops themselves exerce not any jurisdiction in the High Commission as bishops, but only as the king’s commissioners, as Dr. Downame aknowledges (Defens., bk. 1, p. 8). The assumption is grounded upon this reason: The king has not power to depose ministers. Therefore he cannot give this power to others. For Nemo potest plus juris transferre in alium quam sibi competere dignoscatur (Boniface, 8, De Regul. Juris Reg., 79). The king may sometimes inflict such a civil punishment upon ministers, whereupon secondarily and accidentally will follow their falling away from their ecclesiastical office and function, (in which sense it is said that Solomon deposed Abiathar, as we heard before), but to depose them directly and formally (which the High Commission usurps to do), he has no power, and that because this deposition is an act of ecclesiastical jurisdiction: Whereas the power of Ecclesiastical jurisdiction does no more agree to the king than the power of ecclesiastical order: his power is civil and temporal, not spiritual and ecclesiastical. Dr. Field also confesses that none may judicially degrade or put anyone lawfully admitted from his degree and order but the spiritual guides of the Church alone (Of the Church, bk. 5, ch. 53, p. 682).

2. The deposing of ministers pertains to classical presbyteries, or (if the matter be doubtful and difficille) to synods, as has been showed. And who then can give the High Commission such authority as to take this power from them, and to assume it unto itself. These Commissioners profess that they have authority to discharge other ecclesiastical judicatories within the kingdom from meddling with the judging of anything which they shall think impertinent for them, and which they shall think good to judge and decide by themselves in their commission. Which, if it be so, then (when it pleases them) they may make other ecclesiastical judicatories to be altogether useless and of no effect in the Church.

3. In this commission, ecclesiastical and temporal men are joined together, and both armed with the same power. Therefore it is not right nor regular, nor in any wise allowable. For even as when a minister has offended in a civil matter, his fault is to be judged by civil judges according to the civil laws, and by no other: so when he offends in an ecclesiastical matter, his fault is to be judged only by ecclesiastical persons according to ecclesiastical laws: and in such a case Justinian forbids civil men to be joined with ecclesiastical men in judgment (Novell., 83, ch. 1). They are ecclesiastical things or causes which are handled and examined by the High Commission in the process of deposing ministers: and a shame it is to ecclesiastical men if they can, without the help and joining of temporal men, judge and decide things of this quality.

4. As in the matters to be judged, so in the censures and punishments to be inflicted; ecclesiastical and civil men have in this Commission alike power and authority: for ecclesiastical men therein have power of fining, confining, warding, etc. common to them with the temporal men: and again, the temporal men have power of excommunication, suspension, deprivation, etc. common to them with the ecclesiastical men. For they all sit there as the king’s commissioners, and so nomine [by name] they exerce this jurisdiction: which Commission being alike discharged by them all, it is manifest that both temporal men take hold of the keys and ecclesiastical men take hold of the civil sword. And this monstruous confusion and mixture gives sufficient demonstration that such a form of judgement is not from the God of order.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-873a5e2eaa" data-kw="">
<blockquote><p>Seventhly, Beware of separating new lights. To separate from, or gather new churches out of the true reformed or reforming churches, has not the least warrant from the Word of God. When we see this or that amiss in a church, we are bidden to exhort one another, and provoke one another to good, but not to separate, Heb. 10:24-25. Zwinglius conferred amicably with the Anabaptists in Zurich, as with dissenting brethren, and no course was taken to suppress or restrain them by the secular power, till they grew to gather churches out of the true reformed churches; but when it came to that, they could not be suffered or forborne, it was thought necessary to retrain them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions n.d</cite>, ch. 10, ‘Of New Lights’, Seventhly</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

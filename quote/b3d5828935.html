<blockquote><p>2. Nor does the deity of Christ stand in the way, which, since it itself demands satisfaction, does not seem able to receive it from itself, for justice is toward another (Socinus part 3, ch. 5). For I deny that a real diversity must always intervene between the one who makes satisfaction and the one to whom it is made (which is sufficiently refuted from civil affairs: the treasurer general, when his stipend is owed to him, is the same one who ought to pay and to whom it ought to be paid). A moral and virtual distinction suffices here, that is, a diversity of status and mode of subsistence. And thus in Christ, the formal principle of Christ’s actions as Mediator is different from the formal principle as God, whence Christ considered κατ᾽ οἰκονομίαν [according to the economy] made satisfaction to the second person of the divinity considered οὐσιωδῶς [essentially].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. by AI by Onku (Utrecht, 1650) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

0%5Bessentially" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bab3a2fca6" data-kw="">
<blockquote><p>XXIX. Therefore the end of satisfaction, to whom, or the object, is solely the elect and true believers of both the Old and New Testament. For although it could extend itself to all men with respect to the greatness, dignity, and sufficiency of the price considered in itself, nevertheless it was particularly expended for those whom the Father elected and gave to the Son, and who by God’s gift would believe in God and His Son. Whence Scripture repeatedly says that He gave Himself for His own, and for us, for the sheep, and for the Church. Mt. 20:7, 28 and 26 [i.e. Mt. 26:28]; 1 Jn. 3:16; Acts 20:28, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On the Satisfaction of Jesus Christ’ in Synopsis of Pure Theology</cite>, (1625), trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-c6bf230a07" data-kw="">
<blockquote><p>VII. When the Scripture then says that Christ died for all, that He gave Himself a ransom for all, that He died for all, that He is a propitiation for the sins of the whole world: this is necessarily understood, either of the greatness of the price, or of the sufficiency of his merit for all men, or of the effectual redemption of all Jews and Gentiles that embrace by faith the benefits of his death: For in these, says Ambrose, a certain kind of universality is conceived [see footnote]. And this is no more repugnant [as the adversaries claim it is] to the doctrine of the Gospel than if some [adversaries] should say that Christ by his death did indifferently redeem and reconcile to God faithful Christians, and faithless Turks, heathens, Epicures, hypocrites, etc. although they receive not the merit of Christ by faith: which [latter] opinion [of the adversaries] is both impious, and repugnant to God’s Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Article 2, ‘Of Christ’s Death &amp; Merit’ in Aphorisms of the Orthodox Doctrine of the Reformed Churches in Zachary Ursinus, The Sum of Christian Religion… (London: Young, 1645), pp. 694-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>How could he die, if he were not a reputed sinner? Had he not first had a relation to our sin, he could not in justice have undergone our punishment. He must in the order of justice be supposed a sinner really, or by imputation; really he was not, by imputation then he was.</p></blockquote>

<blockquote><p>As early as 1595 Piscator, the longtime professor of theology at Herborn whose commentaries on Scripture were generally admired by the Reformed, argued that Christ in no way died for the reprobate. In England, the controversial Peter Baro picked up on this teaching and publicly rejected it in his sermon on the Lambeth Articles in January 1596. Baro had good reason to be alarmed for, in 1594, a Church of England minister named William Burton similarly denied that the death of Christ was sufficient for the nonelect.</p></blockquote>

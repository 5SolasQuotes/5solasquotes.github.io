<main class="wrap"><figure class="quote" id="q-bd16fb82c0" data-kw="">
<blockquote><p>We act against God, when we act against his Covenant; a Covenant is a serious thing. Suppose the matter of it Civil, (though ours is more) the making of it is Divine. We read of a Covenant made with an Heathen King, which being broken, saith God, shall he prosper, shall he escape that doth such things? what, when lo he had given his hand, ver. 18. He shall not escape; let us look upon our solemn League and Covenant, I tremble when I read it; we covenanted not only against Prelacy, but Popery; not only Hierarchy, but Heresy; not only Sin, but Schism; and have we not gone against the letter of it? how is the Covenant slighted, as an Almanack out of date?

Those that did once lift up their hand to it, do now lift up their heal against it. Indeed at first the Covenant was looked upon as sacred; the drunkard would be sober that day, the unclean person chaste; but within a while it is laid aside; we begin to play fast and loose with God, and for a trifle will venture the curse of the Covenant; But they like men have transgressed the Covenant, or as in Hebrew, They like Adam, how is that? for a poor apple; so for a trifle, a Penny in the shop, or the bushel, men will set their Covenant and their conscience to sale. God sees this, and hear what he saith, I will bring a sword, which shall avenge the quarrel of my Covenant: Covenant violation is an high affronting sin, and an affront will make God draw his sword; to set our hand and seal to the Covenant, and then to tear off the Seal, if the Covenant will not hold us, God hath Chains that will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of publick humiliation</cite>, (London: Ralph Smith, 1654), pp 25-27.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5d5807e085" data-kw="">
<blockquote><p>The persons for whose use, this treatise is more immediately intended, are they, who have by the Holy Spirit been convinced of the guilt, malignity, and demerit, of the sin which dwelleth in them, as well as of the iniquities that are committed by them; who have also been convinced of the utter insufficiency of their own righteousness, for their justification in the sight of God, and who have been enabled to embrace Jesus Christ, as their righteousness and strength. All of this description are earnestly desirous of advancing in holiness but many of them, seem to be far from being duly sensible of the high importance of spiritual consolation, to the love and practice of holiness.

They are soon apprehensive of danger, if they feel iniquities prevailing against them; but they yield, without alarm, to that dejection of spirit, which is often occasioned, either by inward conflicts or outward trials; not considering, that disquietude of soul paves the way for despondency, and despondency for utter despair: all which are, in a high-degree, injurious to the spiritual welfare of the soul. Trouble of mind, especially when it proceeds the length of despondency, strengthens the unbelief and enmity of the heart against God; and so disqualifies the Christian for performing acceptably, the duties incumbent upon him.

Although God doth not suffer any of his children, ever to fall into the horrible gulf of absolute despair, yet some of them have brought themselves to the very brink of it; so as greatly to dishonour their holy profession, to injure their own souls, and to hurt the souls of many around them, who are always too ready to impute their dejection of spirit, to the holy religion which they profess. Thus, they often discourage the hearts of some, who are seeking Jesus; and strengthen the prejudices of others, who are enemies to him.

The sovereign antidote to that sinful and grievous distemper of mind, is the spiritual and holy consolation, which is offered and promised in the gospel. Much of the sacred volume was written for this end, that the saints might be comforted, and that they, “through patience and comfort of the Scriptures, might have hope.” God, in the exceeding riches of his grace, has given in his word, and confirmed by his oath, many great and precious promises; in. order that all “who have fled for refuge, to lay hold upon the hope set before them,” might not only have consolation, but strong consolation. He hath spoken in his holiness, on purpose that they might rejoice; that they might be so “filled with all joy and peace in believing,” as to serve him with gladness; and thereby, to recommend faith and holiness to all around them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Spiritual Comfort</cite>, (2nd edn, Edinburgh, 1814), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>This is what they are doing here: for they do not mention what seemed good, that is, the restoration of the blind man’s sight, but stress what they can against Christ, that is, his breaking of the Sabbath. Thus some of the Pharisees said, that is, those who were malicious and corrupt, this man is not from God, who does not keep the Sabbath. But Christ did keep the Sabbath, for when the Lord forbade work on the Sabbath he had in mind servile work, which is a sin: whoever commits sin is the slave of sin (John 8:34). Therefore, he who performs works of sin on the Sabbath, breaks the Sabbath. So Christ, who was without sin, rather than they, kept the Sabbath.</p></blockquote>

<blockquote><p>We do not say (for our parts) that all praying upon a book or instituted forms is but cold prayer, because God may pardon the ignorance of his people and accept the sincerity of their hearts, help them with some spiritual affections, even in such prayers…</p></blockquote>

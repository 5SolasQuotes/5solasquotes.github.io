<main class="wrap"><figure class="quote" id="q-617cfcd054" data-kw="">
<blockquote><p>But though He wills all creatures as means and for his own sake, He wills some more than others to the degree they are more direct and suitable means for his glorification. God is a Father to all his creatures, but He is that especially to his children. His affection for everything He created is not as deep as his affection for his church, and that in turn is not as great as his love for Christ, the Son of his good pleasure. We speak of a general, a special, and a very special providence; in the same way we make as many distinctions in the will of God (as it relates to his creatures) as there are creatures. For the free will of God is as richly variegated as that whole world is. Hence, it must not be conceived as an indifferent power, a blind force, but as a rich and powerful divine energy, the wellspring of the abundant life that creation spreads out before our eyes. In that world, however, there is one thing that creates a special difficulty for the doctrine of the will of God, and that is the fact of evil, both evil as guilt and evil as punishment, in an ethical as well as a physical sense. Though evil is ever so much under God’s control, it cannot in the same sense and in the same way be the object of his will as the good. Hence, with a view to these two very different, in fact diametrically opposed, objects we must again make a distinction in that will of God, as Scripture itself shows. There is a big difference between the will of God that prescribes what we must do (Matt. 7:21; 12:50; John 4:34; 7:17; Rom. 12:2), and the will of God that tells us what He does and will do (Ps. 115:3; Dan. 4:17, 25,32,35; Rom. 9:18-19; Eph. 1:5,9,11; Rev. 4:11). The petition that God’s will may be done (Matt. 6:10) is very different in tenor from the childlike and resigned prayer: “Your will be done” (Matt. 26:42; Acts 21:14). Over and over in history we see the will of God assert itself in two ways. God commands Abraham to sacrifice his son, yet he does not let it happen (Gen. 22). He wants Pharaoh to let his people Israel go, yet hardens his heart so that he does not do it (Exod. 4:21). He has the prophet tell Hezekiah that he will die; still He adds fifteen years to his life (Isa. 38:1,5). He prohibits us from condemning the innocent, yet Jesus is delivered up according to the definite plan and foreknowledge of God (Acts 2:23; 3:18; 4:28). God does not will sin; He is far from iniquity. He forbids it and punishes it severely, yet it exists and is subject to his rule (Ex. 4:21; Josh. 11:20; 1 Sam. 2:25; 2 Sam. 16:10; Acts 2:23; 4:28; Rom. 1:24,26; 2 Thess. 2:11; etc.). He wills the salvation of all (Eze. 18:23,32; 33:11; 1 Tim. 2:4; 2 Pet. 3:9), yet has mercy on whom He wills and hardens whom He wills (Rom. 9:18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, (Backer Academic, 2004), 2:241</span></figcaption>

<blockquote><p>X. We may sometimes interchange the eudokian [good-purpose of decree] for the euarestia [good-pleasure or complacency of the revealed will], when it is spoken of those things with which God is pleased because there is in them some quality or condition which agrees with the nature of God and therefore conciliates his favor…

XI. Eurestia contradistinguished from eudokian in this connection means nothing else than the mere complacency by which God approves anything as just and holy and delights in it (and besides wills to prescribe it to the creature as his most just duty). Hence it does not properly include any decree or volition in God, but implies only the agreement of the thing with the nature of God (according to which He cannot but love what is agreeable to his holiness)… … XX. The will of sign which is set forth as extrinsic ought to correspond with some internal will in God that it may not be false and deceptive; but that internal will is not the decree concerning the gift of salvation to this or that one, but the decree concerning the command of faith and promise of salvation if the man does believe (which is founded both upon the connection established by God between faith and salvation and the internal disposition of God by which, as He loves Himself, He cannot but love his image wherever He sees it shining and is so much pleased with the faith and repentance of the creature as to grant it salvation).</p></blockquote>

<blockquote><p>The will of God is God by one simple act, absolutely willing the being of whatsoever He pleases. That distinction of the absolute and conditional will, as also that of the antecedent and consequent will of God, are both unsound. God wills it to be a truth that whosoever believes shall be saved: He likewise wills it to be the duty of Judas to believe: Hence follows (in case) a will of approbation concerning things in their own nature possible, which yet never shall be: as namely, the acceptation of the obedience of the reprobates; but it does not follow that God has conditionally willed the acceptation of the obedience of the reprobates. God decrees the coexistence of two extremes conditionally cohering, as the faith and salvation of Judas, the sight of such miracles and repentance in the Tyrians: the being of which extremes themselves He has not decreed. Though the things willed be conditioned, yet the volition or willing of God concerning those things is absolute. The authors and approvers of the second distinction, understand by the antecedent will of God (John Damascene, Of the Orthodox Faith, bk. 2, ch. 29), his will concerning the creature looking at it as in itself, without any consideration of after-circumstances: so they say God wills all men, even the reprobate to be saved: this they call his first will, and it is, say they, uncertain. By the consequent will of God, they understand his will concerning the creature looked at, not only as in itself, but together with after-adjuncts and circumstances, as sin, etc. This they call his second will, and it is, say they, certain. As a judge looking upon such a person as in himself, accounts it best that he should live; but looking upon him in second respects, as a murderer, etc. he accounts it best that he should die. The vanity of both these distinctions appears in that they are repugnant to the simplicity, perfection and independence of the first cause. The will of God in the decree, and the revealing of part thereof in the command, do not infer diverse wills in God: The command shows what is the duty of man; the decree contains God’s purpose concerning our doing or not doing our duty. To will such a thing ought to be and not to will that it shall be, yea to will the not being thereof, are not opposite. But both may and do proceed from the same will.</p></blockquote>

<blockquote><p>§6. Let no one doubt that the will of God tends toward Himself: 1. Because God, in the genus of being and of goods, is the best and greatest, who adequately and intimately knows Himself as such: which knowledge with consciousness evidently presents to Him as thinking a thing exceedingly pleasing, in which He takes delight and rests—since, seeing that He absolutely possesses every reality, He sees that nothing is lacking to Him which He could desire, and thus He loves Himself, and is conscious to Himself of an acquiescence which expresses the very formal ratio of His blessedness.</p></blockquote>

</figure><figure class="quote" id="q-3f0a411569" data-kw="">
<blockquote><p>In vain [it is] to participate of those mysteries of our salvation, the body and blood of our Lord, till first by self-examination we have cast out the venom of our sinful doings by repentance and steadfast purposes of amendment. In a word, it is our sins unrepented that make void and ineffectual all the blessed means of grace and of the Spirit; by those it is we quench the Spirit, we grieve the Spirit, we resist the Spirit, we provoke the Spirit (1 Thess. 5:19; Eph. 4:30), and poison the blessed nature of life; so that all the conveyances of the Spirit are barren and unfruitful whilst they reflect upon hardened and impenitent hearts.</p></blockquote>

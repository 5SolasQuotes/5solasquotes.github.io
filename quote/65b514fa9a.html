<main class="wrap"><figure class="quote" id="q-65b514fa9a" data-kw="">
<blockquote><p>Obs. I. Believers under the new testament have lost nothing, no privilege that was enjoyed by them under the old. Many things they have gained, and those of unspeakable excellency, but they have lost nothing at all. Whatever they had of privilege in any ordinance, that is continued; and whatever was of burden or bondage, that is taken away. All that they had of old was on this account, that they were the people of God. To them as such did all their advantages and privileges belong. But they were yet so the people of God as to be kept like servants, under the severe discipline of the law, Gal. 4:1. Into this great fountain-privilege believers under the gospel are now succeeded. And what was of servitude in reference unto the law is removed and taken away; but whatever was of advantage is continued unto them, as the people of God. This, I suppose, is unquestionable, that God making them to be “his people who were not a people,” would not cut them short of any privilege which belonged before to his people as such, Rom. 9:25, 26. Besides, the state of the gospel is an estate of more grace and favour from God than that under the law, John 1:17. The whole gospel is an ampliation of divine spiritual grace and favour to God’s people. So is it a better estate than that which went before, accompanied with “better promises,” more liberty, grace, and privileges, than it. Nothing, then, of this nature can be lost therein or thereby to believers, but all privileges at any time granted unto the people of God are made over to them that under the gospel are so. Let men but give one instance to this purpose, and not beg the matter in question, and it shall suffice. Moreover, God hath so ordered all things in the dispensation of his grace and institution of his worship, that Jesus Christ should have the pre-eminence in all. All things are gathered up unto a head in him. And is it possible that any man should be a loser by the coming of Christ, or by his own coming unto Christ? It is against the whole gospel once to imagine it in the least instance. Let it now be inquired whether it were not a great privilege of the people of God of old, that their infant seed were taken into covenant with them, and were made partakers of the initial seal thereof? Doubtless it was the greatest they enjoyed, next to the grace they received for the saving of their own souls. That it was so granted them, so esteemed by them, may be easily proved. And without this, whatever they were, they were not a people. Believers under the gospel are, as we have spoken, the people of God; and that with all sorts of advantages annexed unto that condition, above what were enjoyed by them who of old were so. How is it, then, that this people of God, made so by Jesus Christ in the gospel, should have their charter, upon its renewal, razed with a deprivation of one of their choicest rights and privileges? Assuredly it is not so. And therefore if believers are now, as the apostle says they are, “the people of God,” their children have a right to the initial seal of the covenant. Again,—</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews in the Works of John Owen</cite>, (Edinburgh: Johnstone and Hunter), 21. 328–29.</span></figcaption>

<blockquote><p>for the obligation of all oaths is only observable while the matter thereof is in being: and this rule is undeniable, sublata juramenti materia tollitur obligatio [the matter of the oath being taken away, the obligation is removed]. I conceive therefore, that although when time was, I was bound to monarchical government, both to the substance and to the settled form and circumstances thereof, as they stood in law, yet that now I am no more bound thereunto, because ipso facto these ties are unloosed not by the absolution of any earthly power to pronounce the tie void (which nevertheless has also been done by the supreme power of the nation when they declared the government to be altered), but by the decree of heaven, which has providentially and ipso facto loosened the ties by removing the late king and his heirs from the legal capacity wherein they stood towards me formerly, that is, before this parliament made it treason to make any more addresses to him, and before he was sentenced for treason himself. Now that God has a right by the changes of government to absolve you from your sacred ties I suppose you will not deny, and that He has changed this government is undeniable; for without Him it could not have been done, and He claims to Himself the sole power of changing governments, Dan. 4:17. And that the commonwealth has also a power according to emergencies to dispose of the government within itself for its own safety, I think will not by you be denied; and if by the changes which it has power to make within itself, as emergencies require, the matter of your oath be taken away, it is clear that thereby the obligation is extinct. Above all this, I shall offer unto your consideration something concerning the original of your sacred tie; for the oath which you took to maintain certain forms and circumstances of government (which in their own nature are alterable) was lawful to be taken by you, either because the supreme authority that then was required it of you, and you saw no just cause to refuse that which they required, or because only you of your own accord did choose to take such an oath: I suppose you will not say the last… it will follow then that the tie to those things was sacred; that is, it was lawful for you to be bound by an oath to them only, because the supreme authority which was over you, and had power to establish those forms and circumstances of government, did require such an obligation from you, to engage you to be faithful thereunto, and if this is the only lawful original of such a sacred tie; Then I say, that the dissolution of that tie, may arise from the same power which did establish it: he that has power to oblige me to a form of his creating has also power to absolve me from that obligation. In old times and now also in some places, the soldiers were wont to be obliged by oath to serve their commanders faithfully, till they should be dismissed: the Romans called this sacramentum militare: Now he that might lawfully give them this oath, might also absolve them from it; and so it is in all obligations unto things which in their own nature are not morally good, but good only ex instituto legitimo [out of the legitimate institution]: the power which gives them a being, may take it from them; If therefore the supreme power which now is over you has absolved you from those ties, your voluntary continuance under them cannot make them any longer sacred, no more than your voluntary taking an oath at first to them, without the conduct of the authority which was over you, could have made your obligation lawful. I conceive then, that in things merely civil and human (that is of a changeable nature, as being subject to civil and human ordinances) your oath cannot put a stronger tie upon you towards them than their nature will bear; that is, you cannot be unalterably bound unto them, for if they cease to be, you cannot stand obliged towards them; now that they do cease to be is clear, and that they may cease to be by the power which is over you, and by the acts of divine providence absolving subjects from such oaths.</p></blockquote>

<blockquote><p>9. Though we must not by profession, word or subscription own the sin of any Church, we must [in some circumstances] join in their communion in the worship of God, with those whose worship is mixed with sin in matter and manner, so it be not sin that is by its evil predominant against the good of the duty, to make the work rejected of God (like poison in our food, which makes the hurt greater than the good), because else we must neither worship God ourselves [because of our own impurities], nor join with any in the world: all the works of sinful men being mixed with sin. To deny this, is virtually to separate from all the Christian world.</p></blockquote>

</figure><figure class="quote" id="q-3f89644db8" data-kw="">
<blockquote><p>It is partly true, that ‘the men’ were peculiar in their dress, but it is not at all true, that they adopted any kind of badge, or that they wore a uniform that distinguished them as a class. In the circle in which they moved, there were attempts made, by the careless and worldly, to follow, at a distance, the mutations of fashion in their attire. The men would not, and, merely, on that account, their dress was peculiar. It was often the case, that they wore long hair, partly, because a regard to appearances did not remind them of cutting it, and, partly, that they might discountenance the attempts at clipping and combing ‘after the fashion,’ by which many around them evidenced their conformity to the world. It is true, also, that they often appeared with a handkerchief on their heads, but so did many besides them, who met to worship under a scorching sun, and regarded it as unbecoming to have a hat or a bonnet on their heads. If their dress seemed peculiar, it was only because it was old-fashioned, even in the highlands. Its singularity was not owing to any affectation, or to an undue regard to what was external and trivial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-kennedy.html">John Kennedy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Days of the Fathers in Ross-Shire 4th</cite>, ed. (Toronto: James Campbell &amp; Son, 1867), pp. 87-88</span></figcaption>

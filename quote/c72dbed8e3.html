<main class="wrap"><figure class="quote" id="q-c72dbed8e3" data-kw="">
<blockquote><p>The learned [John] Selden [an Erastian] in his discourse of the Civil Right of Tithes, has endeavoured to prove this [that tithes are not by any Divine Law due to the ministers of the Gospel]. There has been a war in the Romish Church about this question, between the canonists and the scholastics; the former hotly maintaining that tithes are due to the Church jure divino [by divine right]; the latter, that they are due only by ecclesiastical constitution: so says [Robert] Bellarmine, and other of their learned men. Yet some of their theologues, agree with the canonists: So does Baronius (Annals, tome 1, anno. 57, s. 74)… Among Protestant writers, prelates, and prelatical men plead hard for the divine right of tithes as the ministers’ due. Bishop [Lancelot] Andrews and Bishop [George] Carleton have said as much for it as any that I have seen. But most of our reformed divines maintain the negative. So Peter Martyr (Common Places, pt. 4, ch. 13), Zanchy (Of Redemption, book 1, ch. 16), Daneus (Ethic., book 2, ch. 10 [also in 4th Precept, p. 810]), Rivet (in Genesis, exercitation 80), Voetius (Eccle. 1, book 4, p. 824): And to this we adhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/increase-mather.html">Increase Mather</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse Concerning the Maintenance due to those that Preach the Gospel</cite>, (1706) Mather was a New England, congregationalist puritan minister., pp. 48-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-1e721d28af" data-kw="">
<blockquote><p>XX. The absolution committed to the ministers of the gospel is not judicial, such as belongs to a judge or lord; but ministerial, such as is partly by the preaching of the gospel (which consists in remission of this kind) or by his heralding or ministry of it, and in the exercise of ecclesiastical discipline, as it is subordinated to that preaching of the gospel (which is none other than that declaration by which he who was before leprous is declared clean); or such as belongs to a herald, who officially announces the favor of the magistrate to anyone. Nor does the power of the keys involve anything else because they are not the principal keys of the Lord (which are ascribed to Christ alone, Rev. 1:18; 3:7), but ministerial, such as belong to stewards and doorkeepers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 19th Topic, Q. 31, ‘The Five False Sacraments of the Romanists, p. 554</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-1e1e0634df" data-kw="">
<blockquote><p>Secondly, the farther that the members or Churches, either congregational, presbyterial, or national, are removed in local distance one from another, the less is the visible and external communion of rebuking, comforting, and admonishing one another; yet the power and obligation of these duties are not removed. So though the national Churches be locally distant one from another, yet their power of exercising duties… is not from thence concluded to be null. Yea, national duties upon occasion are still obligatory, and communion of men of sundry nations is clear to me, Isa. 2:3, ‘many nations shall flow unto the mountain of the Lord’s House,’ Zech. 8:23, ‘Ten men shall take hold out of all languages of the nations, they even shall take hold of the skirt of him that is a Jew, saying, we will go with you, for we have heard that God is with you.’ …the places [of Scripture] do well prove the power-lawful of performing duties, whereas the exercise of them in one place is not hic &amp; nunc, in ordinary providence, possible. And so this consequence must be weak: the whole catholic visible Churches in their principal guides cannot ordinarily and constantly meet, hic &amp; nunc, for the exercise of their power; Therefore they have no such power. For if the power be exercised in parts, which, through occurrences of providence and the corruption of men’s nature, cannot be exercised in whole at once, yet it’s not hence evinced [proven] to be a power not given of Christ for edification;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 300-301</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

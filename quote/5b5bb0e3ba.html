<main class="wrap"><figure class="quote" id="q-5b5bb0e3ba" data-kw="Upon this rock">
<blockquote><p>Peter had confessed in his own name, and that of his brethren, that Christ was the Son of God (Mt. 16:16). On this rock Christ builds his Church, because it is the only foundation; as Paul says, &quot;Other foundation than this can no man lay&quot; (1 Cor. 3:11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-669e01d933" data-kw="">
<blockquote><p>Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Pope Leo X</cite>, p. 2</span></figcaption>

</figure><figure class="quote" id="q-dc182cff5f" data-kw="Keys Peter">
<blockquote><p>Secondly, That authority of the keys was not committed to Peter alone, but to the rest of the apostles also. For in this place he did not give the keys, but only promised that he would give them: but afterwards, when he actually gives them (Matthew 28:18, 19; John 20:21, 22, 23), he addresses all the apostles equally. Therefore, if the pope have the authority of interpreting the scriptures, because the keys were given to Peter, then also other bishops and ministers, who were successors of the rest of the apostles, received the same authority, because the keys were given to the rest of the apostles as well as to Peter. Thirdly, Augustine says in his 124th Tractate upon John, as in many other places, that “Peter signified the universal church,” when the keys were given to him: therefore this power of the keys was given not to the pope alone, but to the whole church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-cd1dc35099" data-kw="Equality of apostles">
<blockquote><p>If Peter was constituted an ecumenical pontiff, he was greater and superior to the others. But we read of no such superiority having been bestowed upon Peter above the others by Christ or usurped by Peter himself or acknowledged by the apostles. Christ sends them equally: “As the Father sent me, so send I you” (Jn. 20:21). He equally breathes his Spirit into them (v. 22) and gives them the power to remit and to retain sins: “Whose soever sins ye remit, they are remitted unto them; and whose soever sins ye retain, they are retained” (v. 23). He equally gives to all the command to preach and to baptize: “Go ye therefore, and teach all nations” (Mt. 28:19). Hence, he promises them an equality of thrones: “In the regeneration” (i.e., in the renovation of the church caused by the gospel) “ye shall sit upon twelve thrones, judging the twelve tribes of Israel” (Mt. 19:28).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.17.5</span></figcaption>

</figure><figure class="quote" id="q-dd5daca24a" data-kw="">
<blockquote><p>Shall we recognise the Apostolic See where we see nothing but horrible apostasy? Shall he be the vicar of Christ who, by his furious efforts in persecuting the Gospel, plainly declares himself to be Antichrist? Shall he be the successor of Peter who goes about with fire and sword demolishing everything that Peter built? Shall he be the Head of the Church who, after dissevering the Church from Christ, her only true Head, tears and lacerates her members? Rome, indeed, was once the mother of all the churches, but since she began to be the seat of Antichrist she ceased to be what she was.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.24</span></figcaption>

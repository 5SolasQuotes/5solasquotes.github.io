<main class="wrap"><figure class="quote" id="q-869d3af065" data-kw="">
<blockquote><p>Now, what need is there to go through all of Latomus, point by point, since what has been said thoroughly refutes his entire position and confirms mine? I have sufficiently shown that his whole work consists of begging the question, for he does not want to understand my use of “sin” except in his own sense. With deliberate villainy, he distorts both my statements and those of all the fathers, making out that what they say simply of sin is said against sin under grace, or applying what is said of the sin of the whole to, as I might say, the sin of the part. He does this because he, together with his sophists, has never recognized what grace and sin, law and gospel, Christ and man are. He who wishes to discuss sin and grace, law and gospel, Christ and man, in a Christian way, necessarily discourses for the most part on nothing else than God and man in Christ….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 32: Career of the Reformer II, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 32 (Philadelphia: Fortress Press, 1999), 257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-29bc292ded" data-kw="">
<blockquote><p>Canon XXIV: But this later Covenant of Grace according to the diversity of times has also different dispensations. For when the Apostle speaks of the dispensation of the fullness of times, that is, the administration of the last time (Eph 1:10), he very clearly indicates that there had been another dispensation and administration until the times which the Father appointed. Yet in the dispensation of the Covenant of Grace the elect have not been saved in any other way than by the Angel of his presence (Isa 63:9), the Lamb slain from the foundation of the world (Rev 13:8), Christ Jesus, through the knowledge of that just Servant and faith in him and in the Father and his Spirit. For Christ is the same yesterday, today, and forever (Heb 13:8). And by His grace we believe that we are saved in the same manner as the Fathers also were saved, and in both Testaments these statutes remain unchanged: “Blessed are all they that put their trust in Him,” (the Son) (Ps 2:12); “He that believes in Him is not condemned, but he that does not believe is condemned already” (John 3:18). “You believe in God,” even the Father, “believe also in me” (John 14:1). But if, moreover, the holy Fathers believed in Christ as their God, it follows that they also believed in the Holy Spirit, without whom no one can call Jesus Lord. Truly there are so many clearer exhibitions of this faith of the Fathers and of the necessity of such faith in either Covenant, that they can not escape any one unless one wills it. But though this saving knowledge of Christ and the Holy Trinity was necessarily derived, according to the dispensation of that time, both from thc promise and from shadows and figures and mysteries, with greater difficulty than in the NT. Yet it was a true knowledge, and, in proportion to the measure of divine Revelation, it was sufficient to procure salvation and peace of conscience for the elect, by the help of God’s grace. Canon XXV: We disapprove therefore of the doctrine of those who fabricate for us three Covenants, the Natural, the Legal, and the Gospel, different in their entire nature and essence, and in explaining these and assigning their differences, so intricately entangle themselves that they greatly obscure and even impair the nucleus of solid truth and piety. Nor do they hesitate at all, with regard to the necessity, under the OT dispensation, of knowledge of Christ and faith in him and his satisfaction and in the whole sacred Trinity, to speculate much too loosely and dangerously.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-marshall.html">Stephen Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Formula Consensus Helvetica</cite>, [The Swiss Form of Consensus] 1675 | trans. Martin I. Klauber, Trinity Journal 11 (1990): pp. 103-23 See Wikipedia for background.</span></figcaption>

</figure><figure class="quote" id="q-db33a0351c" data-kw="">
<blockquote><p>The Sinai covenant-administration was no bargain for sinners, and I pity the poor Israelites who suffered under its administration, just as I understand perfectly well why seventy-three (nearly half) of their psalms were laments. I would have resisted this covenant also, had I been there, because such a legal covenant, whose conditions require strict obedience (and threaten severe curse-sanctions), is bound to fail if one of the parties to it is a sinful people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/t-david-gordon.html">T. David Gordon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law is Not of Faith</cite>, (2009), p. 251</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/ceremonial-law.html">Ceremonial Law</a></span></div>

</figure><figure class="quote" id="q-07640ab15d" data-kw="">
<blockquote><p>Many a one thinks that he has God and everything in abundance when he has money and possessions; he trusts in them and boasts of them with such firmness and assurance as to care for no one. Lo, such a man also has a god, Mammon by name, i.e., money and possessions, on which he sets all his heart, and which is also the most common idol on earth.… So, too, whoever trusts and boasts that he possesses great skill, prudence, power, favor, friendship, and honor has also a god, but not this true and only God.… Therefore I repeat that the chief explanation of this point is that to have a god is to have something in which the heart entirely trusts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Large Catechism</cite>, First Commandment (Mammon and creature-trust)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-6a3cb9e0fc" data-kw="">
<blockquote><p>Paul and James do not contradict one another; Paul shows what is that which justifies, and James shows what kind of faith justifies, viz. a lively effectual faith. James shows that faith justifies quae viva [in the manner of it living], Paul shows that it does not justify qua viva [as it is living], which is a great difference though the Remonstrants [Arminians] scoff at such a nicety: who would give a lemmon-paring for the difference?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity... (London, 1654), bk. 7, ch. 10, ‘Whether Faith Alone does Justify?’</cite>, p. 529</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b7a08b602c" data-kw="">
<blockquote><p>18. That imputation of the righteousness of Christ is neither fictitious, nor ideal, nor absurd; nor does it overthrow the δικαιοκρισία [dikaiokrisia, righteous judgment] of God, nor does it clash with human reason or practice. Nay, it is established by the Pontificals themselves through the trafficking of papal indulgences and the market of satisfactions and pardons, where the λογισμός [logismos, reckoning/imputation] and communication of another’s righteousness — albeit fictitious — is manifestly taught. It is no wonder, however, that the imputation of the righteousness of Christ is denied and opposed in this matter by those who neither know nor feel the union of ourselves with Christ and the power and efficacy thereof, and who prefer the means of salvation to be profitable to themselves [as independent workers] rather than gratuitous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Disputation on the Justification of Man before God’ in Disputationum Theologicarum Miscellaneorum Pars Prima (Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

on%20of%20the%20righteousness%20of%20Christ&amp;text=to%20themselves%20%5Bas%20independent%20workers%5D%20rather%20than%20gratuitous" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3bba617e92" data-kw="">
<blockquote><p>It is said, Christ is our righteousness, because He satisfied the Father for us, and that satisfaction, when He justifies us, is given and communicated to us in such a way that it can be said to be our satisfaction and righteousness. For even if we are truly and rightly called and are righteous by inherent righteousness, yet we do not satisfy God for our sins and eternal punishment by it. But that inherent righteousness comes with the remission of sin and eternal punishment, the effect of Christ’s satisfaction, which is conferred and applied to us in justification. And in this way it would not be absurd if someone said that the merits of Christ are imputed to us, when they are given and applied to us, as if we ourselves satisfied God; provided that it is not denied that there is in us also an inherent righteousness, which is true and absolute righteousness, which is not liable to punishment but to glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Imputed Righteousness’, pp. 259-61 Latin | XXXIV. To this are added what the same book adds in chapter 10, Response to the first argument:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-1b49b0f61f" data-kw="">
<blockquote><p>Mr. Anthony Wotton, a man, by Mr. Walker’s own confession, of special note for his piety, life and learning, while he lived, which both the University of Cambridge and the City of London are able also to give ample testimony unto;” – Mr. Anthony Wotton’s Defence, Preface, p. 3 Wiki: “In 1611 George Walker (1581?-1651) accused him of Socinianism; this led to a ‘conference’ of learned divines, which ended in Wotton’s vindication. The controversy went on till 1615, and in 1641, long after Wotton’s death, Walker repeated his accusations. This provoked Mr. Anthony Wotton’s Defence (Cambridge, 1641, published under the name of Thomas Gataker, who, however, only wrote the postscript, the Defence being by Wotton’s son, Samuel… Walker replied in A True Relation of the Chief Passages between Mr. Anthony Wotton and Mr. George Walker in … 1611, and in the Years next following … till 1615 (London, 1642, 4to).</p></blockquote>

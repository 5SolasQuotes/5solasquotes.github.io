<main class="wrap"><figure class="quote" id="q-b13340ca0f" data-kw="">
<blockquote><p>From this it follows that the children of believers are baptized not in order that they who were previously strangers to the church may then for the first time become children of God, but rather that, because by the blessing of the promise they already belonged to the body of Christ, they are received into the church with this solemn sign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, Book 4, ch. 13, section 22, trans. Battles, see also Beveridge.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6d8c4fe66f" data-kw="">
<blockquote><p>The religious observance of this institution was required under a very severe penalty, Gen. 17:14. The contempt of circumcision was a contempt of the covenant; if the parents did not circumcise their children, it was at their peril, as in the case of Moses, Ex. 4:24–25. With respect to those that were not circumcised in their infancy, if, when they grew up, they did not themselves come under this ordinance, God would surely reckon with them. If they cut not off the flesh of their foreskin, God would cut them off from their people. It is a dangerous thing to make light of divine institutions, and to live in the neglect of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 17, verse 14</span></figcaption>

<blockquote><p>Controversy 3 – Can the sacraments, especially baptism, be administered by anyone, including women? We deny against the Papists, Socinians, Arminians, and Anabaptists. Arguments:

1. Christ gave the power of administering the sacraments only to the apostles and ministers of the Church (Mt. 28:19).

2. And these alone are stewards and dispensers of the mysteries of God (1 Cor. 4:1).

3. The administration of the sacraments is joined with the preaching of the Word; thus, whoever cannot do one, cannot do the other 4. Calling is required (Jn. 1:33, 1 Cor. 1:17). 5. It is forbidden for women to speak in the Church or to do any ecclesiastical duty (1 Cor. 14:34-35). Objections 1. Zippora circumcised her son (Ex. 4:25). Reply: Their relation to circumcision is one thing and their relation to baptism another, and the fact that it was done by a woman is not approved.

2. Philip the deacon baptized (Acts 8:38). Reply: First, he was a deacon. Later, he was an evangelist (Acts 21:8).

3. So did Ananias (Acts 9:18). Reply: He had a special command (v. 10), nor is there proof that he was not a minister.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 17, ‘The Sacraments’, pp. 224-5 in Wesley White, A Translation with Introduction to A Summary of Elenctic Theology by Leonard Rijssen a Masters thesis (GPTS, 2009)</span></figcaption>

</figure><figure class="quote" id="q-63ac008ebd" data-kw="">
<blockquote><p>…from whence it will appear that a believing master may present his servant and children to baptism, though it does not follow that a believing master may or will present those of his servants or children that are adult or of years without their consent, yet he may by his authority require them to it as an external duty; he cannot compel them to any duty, or restrain them from any vice without their consent, yet he may correct them, and incline their will to any outward duty by his authority, and having wrought upon them to consent and submit, the commissioner may baptize them that come so presented: the master of a family is a king, a prophet, and a priest, if by any of these offices he can prevail with his houshold, he may bring them to the performance of their duties… …though it be the master or husband’s duty to move his family, yet he cannot always prevail; and special direction concerning the wife is given to suffer her in regard of the bond of matrimony and that under some limited and restrained terms in hope of her conversion [1 Cor. 7]; yet nothing is said concerning servants but that he may either force them or be rid of them if they continue infidels in that sense, that is refuse to list themselves among disciples; the public worship of some God being the bond of all human society, Ps. 101:6, ‘He that walketh in a perfect way, he shall serve me:’ he that keeps any servant that will not be baptized, is not a good Christian; it is true, all men of discretion ought to consent to every duty…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-hussey.html">William Hussey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Mr. Tombes</cite>, [a Baptist], his Sceptical Examination of Infants’-Baptism… (London, 1646), pp. 44-45 Page 43 starts the context. Hussey was the Erastian minister who debated Gillespie on the Mediatorial Kingdom of Christ. Not every particular in the larger context is endorsed.</span></figcaption>

<blockquote><p>Question: Did Zipporah do well in this act of circumcising her son? Answer:

1. This act is unparalleld in all sacred history, therefore hereupon dubious.

2. Though the law before this time doth not declare to us the administratour strictly, yet this worke was first committed to Abraham, and afterwards in the setlement of the Church to Ministers fit for the doing of it; and this sheweth what was right to be done in former times.

3. It was doubtles her husbands duty, and for her to do it in his presence could not belong to her but upon necessity, he being at that time by the opposition of Gods hand disinabled.

4. Doubtles here was infirmity in all, which though God pardoned, yet he did not allow.

5. This was a singular extraordinary act, therefore not to be drawn into imitation by any against Gods law of administration of baptism under the Gospel, as the Papists do. Learn hence: … D.

2. It is the wife’s duty and praise to save the husband from perishing under God’s hand. D.

3. Sacrament-administration may reconcile, where the neglect has provoked God. D.

4. God has born with weak and unfit hands in such administrations, but not to approve them. … D. 9. Forms of words are useful in the Sacraments, such as are sutable to their nature, but not arbitrary.</p></blockquote>

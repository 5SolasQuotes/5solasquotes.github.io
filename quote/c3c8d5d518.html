<main class="wrap"><figure class="quote" id="q-c3c8d5d518" data-kw="">
<blockquote><p>Out of your vigilant care for the common good you have found out a way amidst your many distractions to convene an Assembly of grave and learned Divines, with whom you might advise concerning the settling of Doctrine, Worship, and Church Government.

You saw cause which might move you so to do in respect; first, of those licentious spirits, who took occasion, as to vent their own fancies, so to attempt any thing in matter of Doctrine and Worship; secondly, in that for want of an established Church-government, we were and still are in danger to fall from a Tyranny to an Anarchy; thirdly, In that evil minded men, seeing no effectual meanes provided to suppress such variety of Sects as did start up, were ready to censure you, as the fautors [sic] of such opinions. What you have done, hath been done with much prudence in that you have given way for the admittance of Divines of different Judgements to be chosen, to whom a liberty is not denied to plead every one for his own party:

And not only so, but you have further embodied divers of your worthy Ones of both Houses, as Members of our Assembly: by which privilege, we have many and singular advantages. When this Assembly, for the greater part, was by your summons gathered together, you were pleased, out of a due consideration of the weighty affaires to be transacted, to appoint a solemn Fast to be kept (chiefly) by the Members of the Assembly: And when you had so done, your pleasure was to lay your command upon my self, though the unworthiest of many, to be employed in the service of that day. Surely, it was not but that you had your choice of many other most able and worthy Divines, only it was your pleasure, that days and multitudes of years should speak.

The Grace I chose as most meet to treat of, was that of Zeal, as conversant about God’s House; first, for that it doth directly oppose Lukewarmness, the most dangerous and yet the Epidemical disease of our time; secondly, for that no one grace doth more promote the work of Reformation, (as will appear in the subsequent discourse;) thirdly, for that among all other ornaments, there is none that doth more beautify a Reformer in the eyes of God and man. There are many creatures, said the wise man, that are comely in there going; but none so comely as a Zealous Reformer. Accordingly then (you Parliamentary Worthies) go on and prosper, cease not to carry on your Work, which is God’s work, with Zeal and Courage. It is Perseverance alone that will both crown you, and perfect your endeavours.

What encouragement have you had, in that the Lord, amidst your greatest dangers, hath been mightily seen in the protection of your persons! No weapons of war that have been formed against you, have prospered; the tongues of men that have risen up in judgement against you, hath he condemned. Hath not the same God assisted you to do many glorious works, whereby his name hath been honoured, his people unspeakably benefitted? How hath the Lord kept you together until this day! notwithstanding the endeavours of all the Devils in hell, and wicked men on earth, to scatter you, to divide you! What a foundation hath the Lord laid of your continuance together till your work be done!

Surely, it is for that he hath yet some great things for you to do. If you (which God forbid) shall faint, and out of by respects withdraw your selves from the service, be sure God without you will accomplish his work, but tremble to think what will become of you and yours. How would it be a thing much to be bewailed that you (Noble and brave spirited Patriots; who have hitherto borne the heat of the day, the brunt of the business, so far denied your selves, as to run the hazard of all that you are, have, or might expect) should now by failing in your last act, loose your crown, forfeit your reward from God and man!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-bowles.html">Oliver Bowles</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Zeal for God’s house quickened: or, A sermon preached before the assembly of Lords, Commons, and Divines, at their solemn fast July 7. 1643. In the Abbey Church at Westminster. Expressing the eminency of zeal requisite in church reformers</cite>, (London: Samuel Gellibrand, 1643), epistle dedicatory.</span></figcaption>

<blockquote><p>The Church of Scotland was founded on the principle, that not only is the Bible the only rule of faith, but the only statute-book by which the Lord Jesus would have His Church on earth governed. It assumed that Christ Himself has given certain office-bearers for the administration of His Church, and that He has given to these office-bearers their Directory, their only book of Canons in the written Word.

And it farther assumed, that in the administration of the Church, civil rulers and secular magistrates ought not to interfere with the servants of Christ, but should leave it to them to rule Christ’s house — His Church on earth, according to Christ’s own laws. And it still farther assumed that in the event of the Church entering into any connexion with the State — accepting an endowment for instance — the Church was not at liberty to surrender any spiritual privilege as the price of protection, or pecuniary support. This was the theory. And at the Revolution, this theory became the statute-law of Scotland; and at the Union, it was stipulated that this should abide the statute-law of Scotland for ever.</p></blockquote>

<blockquote><p>I’M first a Christian, next a Catholic, then a Calvinist, fourth a Paedobaptist, and fifth a Presbyterian. I cannot reverse this order. [Some one suggested that these were like circles within each other, the first the widest and the best.] I like better to think of them as towers rising one above the other, though narrowing as they rise. The first is the broadest, and is the foundation laid by Christ; but we are to build on that foundation, and, as we ascend, our outlook widens.</p></blockquote>

<blockquote><p>The Symbolum Quicunque [Athanasian Creed] is a remarkably clear and precise summary of the doctrinal decisions of the first four œcumenical Councils (from A.D. 325 to A.D. 451), and the Augustinian speculations on the Trinity and the Incarnation. Its brief sentences are artistically arranged and rhythmically expressed. It is a musical creed or dogmatic psalm…The first part (ver. 3–28) sets forth the orthodox doctrine of the Holy Trinity, not in the less definite Athanasian or Nicæno-Constantinopolitan, but in its strictest Augustinian form, to the exclusion of every kind of subordination of essence…The second part (ver. 29–44) contains a succinct statement of the orthodox doctrine concerning the person of Christ, as settled by the general Councils of Ephesus 431 and Chalcedon 451, and in this respect it is a valuable supplement to the Apostles’ and Nicene Creeds. It asserts that Christ had a rational soul (νοῦς, πνεῦμα), in opposition to the Apollinarian heresy, which limited the extent of his humanity to a mere body with an animal soul inhabited by the divine Logos. It also teaches the proper relation between the divine and human nature of Christ, and excludes the Nestorian and Eutychian or Monophysite heresies, in essential agreement with the Chalcedonian Symbol.</p></blockquote>

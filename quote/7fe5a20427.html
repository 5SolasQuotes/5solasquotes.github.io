<main class="wrap"><figure class="quote" id="q-7fe5a20427" data-kw="Church can err">
<blockquote><p>The purest churches under heaven are subject to mixture and error; and some have so degenerated as to become no churches of Christ, but synagogues of Satan; nevertheless Christ always has had, and ever shall have a kingdom in this world, to the end thereof, of such as believe in him, and make profession of his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 26.3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7a26c5231" data-kw="church can err">
<blockquote><p>Is the church infallible or can it err about faith? The former we deny; the latter we affirm against the Romanists. The question concerning the infallibility of the church is the most agitated of all which lie between us and Romanists about the church and of so great importance that the papacy seems to rest upon it as its principal fulcrum. For no other reason do they fight so sharply for the infallibility of the church than that they may attach this privilege to their own, which they hold to be the only true church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/against-rome.html">Against Rome</a></span><span class="t"><a href="../topics/the-church/infallibility-of-the-church.html">Infallibility of the Church</a> › <a href="../topics/the-church/infallibility-of-the-church/the-church-can-err.html">The church can err</a></span></div>

</figure><figure class="quote" id="q-25d85261d2" data-kw="Infallible rule">
<blockquote><p>Although infallibility is not given by God to the church, it cannot on this account be said that God was wanting in things necessary to her, because it is not necessary to have a supreme and infallible tribunal among men upon whose decrees and responses our faith should be suspended, since it is sufficient for her to have an infallible rule of faith and practice in the Scriptures, which as long as she observes, she will not wander from the right track.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.11.32</span></figcaption>

</figure><figure class="quote" id="q-8fd989b3de" data-kw="">
<blockquote><p>By contrast, the Reformation asserted that a church, however venerable, can still err. … Even the most simple believer can and may if necessary, Bible in hand, stand up to an entire church, as Luther did to Rome. Only thus the freedom of the Christian, and simultaneously the sovereignty of God, is maintained. There is no higher appeal from Scripture. It is the supreme court of appeal. No power or pronouncement stands above it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 1: Prolegomena, ch. 14</span></figcaption>

</figure><figure class="quote" id="q-60822eb805" data-kw="Councils">
<blockquote><p>Wherefore, though our opponents should name councils of thousands of bishops it will little avail them; nor will they induce us to believe that they are, as they maintain, guided by the Holy Spirit, until they make it credible that they assemble in the name of Christ: since it is as possible for wicked and dishonest to conspire against Christ, as for good and honest bishops to meet together in his name.</p></blockquote>

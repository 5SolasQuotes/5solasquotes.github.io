<main class="wrap"><figure class="quote" id="q-360defc9b6" data-kw="">
<blockquote><p>Then he assumes that that Man who came down from above is without a mind, but that the Godhead of the Only-begotten fulfils the function of mind, and is the third part of this human composite, inasmuch as soul and body are in it on its human side, but not mind, the place of which is taken by God the Word.

This is not yet the most serious part of it; that which is most terrible of all is that he declares that the Only-begotten God, the Judge of all, the Prince of Life, the Destroyer of Death, is mortal, and underwent the Passion in His proper Godhead; and that in the three days’ death of His body, His Godhead also was put to death with His body, and thus was raised again from the dead by the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-of-nazianzus.html">Gregory of Nazianzus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Letters of Saint Gregory Nazianzen (Epistle 202) in Nicene and Post-Nicene Fathers 2, 7: 438.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-580b7e668e" data-kw="">
<blockquote><p>So we should regard the members of the church as God’s children as long as they do not forsake the church or give public evidence of their hypocrisy, which shows that they are reprobate. Furthermore, God expects that all to whom he desires to be a Father shall regard the church as their mother. May we, therefore, never doubt that we who have received the church as our mother, in whom we are born again and nourished, may also call God our Father. And may we, when simply remaining in the family of our mother, never doubt that we are heirs of the heavenly Father. …

The title “mother” that is given to the church teaches us that there is no entrance into eternal life other than to be conceived in this mother’s womb. She gives us birth, nourishes us at her breasts, and protects and preserves us by her guidance and control until at last we lay aside this mortal body and become like the angels of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-taffin.html">Jean Taffin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marks of God’s Children</cite>, trans. Peter Y. De Jong, ed. James A. De Jong (1588; Grand Rapids MI: Reformation Heritage Books, 2003), pp 37-38, 134.</span></figcaption>

</figure><figure class="quote" id="q-599f28c8c6" data-kw="">
<blockquote><p>Usurpation is an intrusion into the seat of authority, a presuming to possess and manage the place and power thereof without a lawful calling, right, or title thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers</cite>, An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC, p. 1</span></figcaption>

</figure><figure class="quote" id="q-c0a787b362" data-kw="">
<blockquote><p>If it be further demanded, whether in case that death follows, it be to be understood of any child, how little time soever the mother has gone with it? I answer with Simlerus that we must distinguish between a child formed and unformed, if the child were an embryo, not yet perfected, although it perished, the party, by whose stroke, was not to be put to death, but for such only as was come to perfection, so likewise Augustine and Jerome in Decretis, Causa 32, Question 2, Ch. Mosis, and the words of the text, ‘life for life’, seem to make for it, that a man’s life must not be paid but for one living and perfected, and the Septuagint make this plain by rendering, ‘not death’, [Hebrew], ‘not formed’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, … (London, 1653), Exodus, ch. 21, p. 558</span></figcaption>

</figure><figure class="quote" id="q-773bdeeacd" data-kw="">
<blockquote><p>16. ‘Thine eyes beheld my shapelessness, etc.’ The embryo, when first conceived in the womb, has no form; and David speaks of God’s having known him when he was yet a shapeless mass, τὸ κύημα, as the Greeks term it; for τὸ εμβρυον is the name given to the fetus from the time of conception to birth inclusive. The argument is from the greater to the less. If he was known to God before he had grown to certain definite shape, much less could he now elude his observation… The other is the more natural meaning, that the different parts of the human body are formed in a succession of time; for in the first germ there is no arrangement of parts, or proportion of members, but it is developed, and takes its peculiar form progressively… that though the members were formed in the course of days, or gradually, none of them had existed; no order or distinctness of parts having been there at first, but a formless substance. And thus our admiration is directed to the providence of God in gradually giving shape and beauty to a confused mass.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 139:16</span></figcaption>

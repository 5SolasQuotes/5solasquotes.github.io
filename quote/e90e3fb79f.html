<blockquote><p>God causes to be proclaimed to us that there is nothing the corrupt intellect of man—an intellect fully darkened by sin and increasingly blinded by Satan—more readily does than carelessly and erroneously trust in the mere external proclamation of the gospel. Such a man considers it to be sufficient unto salvation that he has intellectually comprehended the gospel, and therefore, he has truly believed and will certainly procure eternal salvation and deliverance through Christ and by God’s grace.

This is the lamentable and wretched faith of almost all our Reformed lip confessors, who stake their immortal souls on such a faith and thus enter into eternity with a mere intellectual and superficial affirmation that Christ is their saviour and that they will certainly be delivered and saved by Him. Sadly, the majority of them will not discover their grievous error and dreadful self-deceit until, being actually in hell, they then find it to be eternally impossible for them to retrace their steps and to restore what is amiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 90.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ad15fa0e7" data-kw="">
<blockquote><p>Heaven is that place alone where is to [be] obtained our highest end, and highest good. God hath made us for himself: “of God, and through God, and to God are all things” (Romans 11:36). Therefore then do we attain to our highest end, when we are brought to God. But that is by being brought to heaven, for that is God’s throne; that is the place of his special presence, and of his glorious residence. There is but a very imperfect union with God to be had in this world: a very imperfect knowledge of God in the midst of abundance of darkness, a very imperfect conformity to God, mingled with abundance of enmity and estrangement. Here we can serve and glorify God but in an exceeding imperfect manner, our service being mingled with much sin and dishonouring to God.

But when we get to heaven, if ever that be, there we shall be brought to a perfect union with God. There we shall have the clear views of God’s glory: we shall see face to face, and know as we are known [1 Corinthians 13:12]. There we shall be fully conformed to God, without any remains of sin: “we shall be like him; for we shall see him as he is” [1 John 3:2]. There we shall serve God perfectly. We shall glorify him in an exalted manner, and to the utmost of the powers and capacity of our nature. Then we shall perfectly give up ourselves to God; then will our hearts be wholly a pure and holy offering to God, offered all in the flame of divine love.

In heaven alone is attainment of our highest good. God is the highest good of the reasonable creature. The enjoyment of him is our proper happiness, and is the only happiness with which our souls can be satisfied. To go to heaven, fully to enjoy God, is infinitely better than the most pleasant accommodations here: better than fathers and mothers, husbands, wives, or children, or the company of any or all earthly friends. These are but shadows; but God is the substance. These are but scattered beams; but God is the sun. These are but streams; but God is the fountain. These are but drops; but God is the ocean.

Therefore, it becomes us to spend this life only as a journey towards heaven, as it becomes us to make the seeking of our highest end, and proper good, the whole work of our lives; and we should subordinate all the other concerns of life to it. Why should we labour for anything else, or set our hearts on anything else, but that which is our proper end, and true happiness?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Christian’s Life a Journey Towards Heaven</cite>, (1734) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 437-38.</span></figcaption>

</figure><figure class="quote" id="q-3e5e06c825" data-kw="">
<blockquote><p>Men may deny that there is a God, or that they have souls, or that there is a world external to themselves. The zeal and persistency with which they endeavour to prove that there is no hell is no argument against the reality of it; rather the contrary. …

There are many methods of assault upon the doctrine. One is to admit that the Bible teaches it clearly, and then to make this fact a proof against the Bible’s inspiration and authority, the doctrine itself being too absurd and monstrous to be believed. Another is to admit the inspiration and authority of the Bible, and upon this ground to argue that it cannot teach the doctrine, and that the places which seem to teach it must receive some other interpretation.

These two methods are the same in principle. In both the reason of man is made the judge as to what a revelation from God ought to contain. A third method, near akin to the last, if it can be called a method, feeling rather than logic being judge, is simply to take one’s stand on the goodness of God, and say it cannot be. …

A very striking confirmation of this is seen in the effect of the pagan and papal doctrine of purgatory. Purgatory, according to the Roman doctors, is not a place of discipline, but of true and proper punishment, to all intents and purposes a temporary hell. Yet how many thousands and millions prefer the prospect of it to the pains and self-denials of a life of repentance and holiness here!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Probation after Death (1889) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state.html">Judgment and the Final State</a></span></div>

</figure><figure class="quote" id="q-16aaad586b" data-kw="">
<blockquote><p>In fact we assert from Scripture that the pious who have died under either of both testaments are not enjoying some heavenly joy apart from the presence of God, as some of the great men used to think [such as Justin Martyr, Dialogue with Trypho 5 and Irenaeus, Against Heresies 2.34.1 &amp; 5.31.2], but that they are fully enjoying true and unbroken blessedness in God’s very presence. Even so we do not deny that some degree of happiness is kept aside for them until the last day, when [their souls] will be joined to their bodies. This is demonstrated by very many places of Scripture, for also David locates the place of their true blessedness as the presence of God (Psalm 26:23 and [Ps.] 84). And Paul desires ‘to depart and to be with Christ’ (Philippians 1:23); and 2 Corinthians 5:8: ‘And so we choose rather to depart from the body and go to dwell with the Lord.’ The apostle testifies that Christ is with the Father, and on the Father’s throne (Revelation 3:21; John 17:5; Hebrews 9:24). Therefore also throughout Revelation the deceased saints are placed together with the angels before the throne of God and the Lamb, so that they sing constant praises and give thanks to Him, as can be seen in Revelation 4:8, 5:8, and 7:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, … (Brill, 2020), vol. 2, Disputation 40, ‘On the Church’, sections 17-18, pp. 565-7</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In fact we assert from Scripture that the pious who have died under either of both testaments are not enjoying some heavenly joy apart from the presence of God, as some of the great men used to think [such as Justin Martyr, Dialogue with Trypho 5 and Irenaeus, Against Heresies 2.34.1 &amp; 5.31.2], but that they are fully enjoying true and unbroken blessedness in God’s very presence. Even so we do not deny that some degree of happiness is kept aside for them until the last day, when [their souls] will be joined to their bodies. This is demonstrated by very many places of Scripture, for also David locates the place of their true blessedness as the presence of God (Psalm 26:23 and [Ps.] 84). And Paul desires ‘to depart and to be with Christ’ (Philippians 1:23); and 2 Corinthians 5:8: ‘And so we choose rather to depart from the body and go to dwell with the Lord.’ The apostle testifies that Christ is with the Father, and on the Father’s throne (Revelation 3:21; John 17:5; Hebrews 9:24). Therefore also throughout Revelation the deceased saints are placed together with the angels before the throne of God and the Lamb, so that they sing constant praises and give thanks to Him, as can be seen in Revelation 4:8, 5:8, and 7:9.”

oksonline.com/on-the-beatific-vision/#:~:text=In%20fact%20we%20assert%20from%20Scripture,in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9&amp;text=In%20fact%20we%20assert%20from%20Scripture%20that%20the&amp;text=be%20seen%20in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The believers have not a full discharge till then: we are in this life continually subject to new sins, and so to new guilt, whereby arise new fears, so that the soul has not a full rest from all till that final absolution be pronounced at the Day of Judgment… the Scripture do also call the Day of Judgment a time when sins shall be blotted out, because then is the public absolution of the godly, and according to philosophy, motions receive their names from the term to which they tend… Thirdly, howsoever an absolution shall be completed at the Day of Judgment, yet our justification shall not abide in such a way, as it is in this life. Now our justification is by pardon of sin, and a righteousness without us imputed to us, which is instrumentally applied by faith, but this way shall then cease; for having perfect righteousness inherent in ourselves, we shall need no covering… This seems to be undoubted, that the way of justification by faith in Christ, arises because of our imperfection and sinfulness remaining in us, and therefore is justificatio viae, not patriae, a justification of us in our way, not when we come to our home. Fourthly, although pardon of sin be completed at that great day, yet this is not to be understood, as if God’s pardon of any sin were imperfect, and something of sin did still remain to be done away… But because we commit new sins daily, and so need pardon daily, Therefore it is that we are not completely pardoned till then. As also because the perfect pardon we have here, shall then solemnly and publicly be declared to all the world. … Secondly, pardon of sin will at that day be perfected. Because all the effects of pardon will then be accomplished, and not so much as any scars remain, the wound will be so fully healed… Thirdly, then and not till then may we say remission of sins will be completed, because then shall no more iteration of pardon be.</p></blockquote>

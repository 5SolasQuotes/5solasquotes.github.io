<main class="wrap"><figure class="quote" id="q-8d08e1330a" data-kw="Holiness|Author of sin">
<blockquote><p>Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.</p></blockquote>
<figcaption>— <a href="../authors/stephen-charnock.html">Stephen Charnock</a>, <cite>The Existence and Attributes of God</cite>, Discourse on the Holiness of God</figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span><span class="t"><a href="../topics/attributes-of-god/holiness-and-justice.html">Holiness and Justice</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-not-the-author-of-sin.html">God not the author of sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7826d6ff7b" data-kw="Author of sin|Temptation">
<blockquote><p>For understanding this point, how the providence of God reacheth to and is concerned in sinful actions, we are to consider, that God neither puts evil into the hearts of men, nor stirs them up to it: for, says the apostle, Jam. 1:13. &#x27;God cannot be tempted with evil; neither tempteth he any man.&#x27; And therefore he is not the author of sin.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</figcaption>
<div class="meta"><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-does-not-put-evil-into-mens-hearts.html">God does not put evil into men&#x27;s hearts</a></span><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span></div>

</figure><figure class="quote" id="q-7be12b839e" data-kw="Author of sin|Justice">
<blockquote><p>But we teach that the action of God and of men sinning is the same, according to material being, but not according to moral being. … But truly the action of God and of men is not the same according to moral being; because God acts justly from all four causes, while he punishes the Church through sinning instruments; but the action of the instruments is morally unjust and vicious. … But we teach that God is not the cause of the malice, although he is the cause of the act.</p></blockquote>
<figcaption>— <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a>, <cite>Examination of Arminianism</cite>, ch. 2, title 5 (On the Will of God)</figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a> › <a href="../topics/providence/concurrence/concurrence-and-sin.html">Concurrence and sin</a></span><span class="t"><a href="../topics/the-decrees-of-god/decree-and-sin.html">Decree and Sin</a> › <a href="../topics/the-decrees-of-god/decree-and-sin/god-not-the-author-of-sin.html">God not the author of sin</a></span></div>

</figure><figure class="quote" id="q-aee029b880" data-kw="Author of sin|Free Will">
<blockquote><p>He who uses as an instrument a man freely failing, to effect what is good, is not the author of the failure. … The wicked, while they sin, are not properly instruments of God moved, that is to say, without an internal principle of motion, but metaphorically, moved in such a way that they freely move themselves.</p></blockquote>
<figcaption>— <a href="../authors/william-ames.html">William Ames</a>, <cite>Bellarmine Disarmed</cite>, on the Cause of Sin, ch. 2</figcaption>

</figure><figure class="quote" id="q-7c4873cbdb" data-kw="Satan|Justice">
<blockquote><p>We thus see that there is no inconsistency in attributing the same act to God, to Satan, and to man, while, from the difference in the end and mode of action, the spotless righteousness of God shines forth at the same time that the iniquity of Satan and of man is manifested in all its deformity.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.4.2</figcaption>

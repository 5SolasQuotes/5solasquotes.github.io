<blockquote><p>III. However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run and which God had prescribed to him as a trial of his faith). Hence it is evident that the question is not whether Adam had the privilege of immortality in his upright state (which we have proved before against Socinus). The question is not whether the promise was given to him of happiness and life perpetually to endure, if he had persisted integrity (which the learned men, with whom we here dispute, do not deny). Rather the question is whether that happiness and life were to be passed in heaven or only upon the earth and in paradise. The latter, they affirm; we the former. IV. The reasons are: (1) The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance. The former is evident from “who doeth these things, shall live by them” (Lev. 18:5); “if thou wilt enter into life” (namely, the heavenly) “keep the commandments” (Mt. 19:16, 17); and “the commandment was ordained to life” (Rom. 7:10) assuredly, not earthly, but heavenly. Since however, after the fall, the law can justify no one, this promise must necessarily have had place in upright Adam.</p></blockquote>

<blockquote><p>Therefore the Papists err grievously when they confuse works taken generally with merits, and as soon as they hear of a pious work being commanded, immediately understand merit and a work spoken of in a legal sense. Likewise, when they hear that a reward is promised, they again understand it juridically and legally, as in some contract of hiring and payment; whereas reward is commonly called whatever we obtain after preceding labor and difficulties, whose fear might have deterred us from a good purpose, and which are compensated by the sweetness of the good that follows. Such are not only: (1) the rendering of a good to which a preceding work corresponds in equal worth (that is, merit of condignity)… … (3) Likewise, the execution of a promise made under a condition—not only of gratefully accepting and not despising the gift (for no donation is so free and pure as not to include this condition), but also of a certain work, besides acceptance and gratitude, required in addition—which therefore is in some sense meritorious, although there is perhaps no equality or commutation between the work and the promised reward; as if a father promises a jewel to his son who takes bitter medicine, or a prince promises a prize to a subject engaged in an exercise or contest beneficial to him. In this case, the donation is not purely free, since the thing does not begin to be owed as soon as the promise is accepted, but only when the condition is fulfilled; nor is it properly merit of condignity, since the worker benefits himself rather than giving something to another for which he ought to receive an equal price. Hence again it effects nothing properly by its own virtue or dignity, but only from the liberality, magnificence, and mercy of the giver, or of one interceding with him. Yet it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children of God, to whom God has promised rewards, is admitted by the Apology of the Augsburg Confession [written by Philip Melanchthon] in response to the argument—although others, on account of the ambiguity and great abuse of the term “merit,” not without reason reject it altogether. [4] Another [kind of merit] is what they call merit of congruity [or proportion], which either seems not to signify merit at all, or involves a contradiction, etc.</p></blockquote>

</figure><figure class="quote" id="q-d616c94f53" data-kw="">
<blockquote><p>Heaven is not heaven without Christ. It is better to be in any place with Christ than to be in heaven itself without him. Paul loved to see Christ, to embrace him, and enjoy him that had done so much and suffered so much for his soul. To be with Christ is to be at the springhead of all happiness. Every creature thinks itself best in its own element, that is the place it thrives in, and enjoys its happiness in; now Christ is the element of a Christian. Again, it is far better, because to be with Christ is to have the marriage consummated. Is not marriage better than the contract? Is not home better than absence? To be with Christ is to be at home. Is not triumph better than to be in conflict? But to be with Christ is to triumph over all enemies, to be out of Satan’s reach. Is not perfection better than imperfection? Here all is but imperfect, in heaven there is perfection. Here the grace in a man is with combat of flesh and spirit, but in heaven there is pure peace, pure joy, pure grace. Grace indeed is glory here, but it is glory with conflict. Is it not much far better to die, that we may be with Christ, than to live a conflicting life here? Death is but a grim sergeant that lets us into a glorious palace, that takes off our rags, that we may be clothed with better robes, that ends all our misery, and is the beginning of all our happiness. Why should we be afraid of death? It is but a departure to a better condition. It is but as Jordan to the children of Israel, by which they passed to Canaan. Of itself it is an enemy indeed, but now it is harmless, nay, now it has become a friend. It is one part of the church’s journey. It ends all our misery and sin; and it is the suburbs of heaven. It is a shame for Christians to be afraid of that which Paul makes the object of his desire (Phil. 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David B. MacKinnon</cite>, ed., Refreshment for the Soul: A Year of Daily Readings From ‘The Heavenly Doctor’ Richard Sibbes (The Banner of Truth, 2022), 30.</span></figcaption>

— Richard Sibbes, David B. MacKinnon, ed., Refreshment for the Soul: A Year of Daily Readings From ‘The Heavenly Doctor’ Richard Sibbes (The Banner of Truth, 2022), 30.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHeaven+is+not+heaven+without+Christ.+It+is+better+to+be+in+any+place+with+Christ+than+to+be+in+heaven+itself+without+him.+Paul+loved+to+see+Christ%2C+to+embrace+him%2C+and+enjoy+him+that+had+done+so+much+and+suffered+so+much+for+his+soul.+To+be+with+Christ+is+to+be+at+the+springhead+of+all+happiness.+Every+creature+thinks+itself+best+in+its+own+element%2C+that+is+the+place+it+thrives+in%2C+and+enjoys+its+happiness+in%3B+now+Christ+is+the+element+of+a+Christian.+Again%2C+it+is+far+better%2C+because+to+be+with+Christ+is+to+have+the+marriage+consummated.+Is+not+marriage+better+than+the+contract%3F+Is+not+home+better+than+absence%3F+To+be+with+Christ+is+to+be+at+home.+Is+not+triumph+better+than+to+be+in+conflict%3F+But+to+be+with+Christ+is+to+triumph+over+all+enemies%2C+to+be+out+of+Satan%E2%80%99s+reach.+Is+not+perfection+better+than+imperfection%3F+Here+all+is+but+imperfect%2C+in+heaven+there+is+perfection.+Here+the+grace+in+a+man+is+with+combat+of+flesh+and+spirit%2C+but+in+heaven+there+is+pure+peace%2C+pure+joy%2C+pure+grace.+Grace+indeed+is+glory+here%2C+but+it+is+glory+with+conflict.+Is+it+not+much+far+better+to+die%2C+that+we+may+be+with+Christ%2C+than+to+live+a+conflicting+life+here%3F+Death+is+but+a+grim+sergeant+that+lets+us+into+a+glorious+palace%2C+that+takes+off+our+rags%2C+that+we+may+be+clothed+with+better+robes%2C+that+ends+all+our+misery%2C+and+is+the+beginning+of+all+our+happiness.+Why+should+we+be+afraid+of+death%3F+It+is+but+a+departure+to+a+better+condition.+It+is+but+as+Jordan+to+the+children+of+Israel%2C+by+which+they+passed+to+Canaan.+Of+itself+it+is+an+enemy+indeed%2C+but+now+it+is+harmless%2C+nay%2C+now+it+has+become+a+friend.+It+is+one+part+of+the+church%E2%80%99s+journey.+It+ends+all+our+misery+and+si <blockquote><p>The Reformed acknowledge that Christ truly died, and therefore the natural union of the body and soul was taken away for those three days, and hence he was also certainly a dead man, but yet he was also a man in the true and proper sense, because otherwise: [Mastricht gives eight Scriptural and theological reasons]… If they should allege to the contrary that with the union of the essential parts of the body and soul taken away, a man in the true and proper sense would not survive, then I would grant that, with all union of those parts taken away, a man in the true and proper sense would not survive, but since, in agreement with all Christians, in the incarnation a twofold union was procured by the Holy Spirit—one natural, through which he was a living man, and the other personal, through which the same person was not only God but also man—when the former ceases, nevertheless the latter remains. So then, because the essential parts of man in death were not deprived of all union (as ordinarily occurs in the dead, who for this reason are also not men, except equivocally), but only the union that makes a living man, we conclude that he nevertheless throughout the three days of his death and burial remained a man in the true and proper sense.</p></blockquote>

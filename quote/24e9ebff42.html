<main class="wrap"><figure class="quote" id="q-24e9ebff42" data-kw="">
<blockquote><p>1. That intrinsic or passive justification is viewed in a twofold manner: either as without sense, or as with sense. In the latter manner it is viewed in adults already actually and in the second act converted. In the former manner, both in regenerate infants departing in the state of grace and in adults constituted in the first moment of conversion—where, with the habit of faith impressed, immediately a relative change of state and with it passive or intrinsic justification must be thought to be present: Not otherwise than dominion over creatures was present to the image of God in the first moment of creation, or rather flowed from it by natural resultance or necessary connection, and followed upon it. Or as a firstborn son of a king has and receives in his person such and such a principality, although in the first moment of birth he does not sense this nor actually rejoice in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, p. 447 ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>If we get justification wrong, we get the gospel wrong. Thankfully, we have a rich and faithful heritage of believers who have courageously upheld Scripture&#x27;s teaching on justification by faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nate-pickowicz.html">Nate Pickowicz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted on X by @Tabletalk</cite>, Oct 27, 2021</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/article-of-a-standing-or-falling-church.html">The Article of a Standing or Falling Church</a> › <a href="../topics/justification/article-of-a-standing-or-falling-church/justification-and-the-gospel-itself.html">Justification and the gospel itself</a></span><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“If we get justification wrong, we get the gospel wrong. Thankfully, we have a rich and faithful heritage of believers who have courageously upheld Scripture&#x27;s teaching on justification by faith alone.”

— Nate Pickowicz, Quoted on X by @Tabletalk, Oct 27, 2021">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+we+get+justification+wrong%2C+we+get+the+gospel+wrong.+Thankfully%2C+we+have+a+rich+and+faithful+heritage+of+believers+who+have+courageously+upheld+Scripture%27s+teaching+on+justification+by+faith+alone.%E2%80%9D%0A%0A%E2%80%94+Nate+Pickowicz%2C+Quoted+on+X+by+%40Tabletalk%2C+Oct+27%2C+2021&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F80e387daa6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/80e387daa6.html">Permalink</a><a class="src" href="https://x.com/Tabletalk/status/1453340719167455237" rel="noopener" target="_blank">Read it online · X</a></div>
</figure><figure class="quote" id="q-54f697d22b" data-kw="">
<blockquote><p>(1.) What we mean by a condition in the gospel-covenant. By a condition of the covenant, we do not mean in the strictest rigid sense of the word, such a restipulation to God from man of perfect obedience in his own person, at all times, so as the least failure therein forfeits all the mercies of the covenant; that is rather the condition of Adam’s covenant of works, than of the evangelical covenant: nor do we assert any meritorious condition, that in the nature of an impulsive cause shall bring man into the covenant and its privileges, or continue him in when brought in. This we renounce as well as you: but our question is about such a condition as is neither in the nature of an act perfect in every degree, nor meritorious in the least of the benefit conferred, nor yet done in our own strength. But plainly and briefly, our question is, Whether there be not something as an act required of us in point of duty, to a blessing consequent by virtue of a promise? Such a thing, whatever it be, hath the nature of a condition, inasmuch as it is antecedent to the benefit of the promise; and the mercy or benefit granted, is suspended until it be performed. The question is not, whether there be any intrinsical worth or value in the thing so required, to oblige the disposer to make or perform the grant or promise, but merely that it be antecedent to the enjoyment of the benefit; and that the disposer of the benefit do suspend the benefit until it be performed? Thus an act or duty of ours, which has nothing at all of merit in it, or answerable value to the benefit it relates to, may be in a proper sense a condition of the said benefit. ‘For what is a condition in the true notion of it, but (1) the suspension of a grant until something future be done?’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“John Flavel’s</cite>, (1630–1691) Reply to Baptist Hyper-Calvinism from Vindiciæ Legis et Fœderis and the Issue of Conditions” from Vindiciæ Legis et Fœderis: Or, A Reply to Mr. Philip Cary’s Solemn Call (1690) in The Whole Works of the Rev. Mr. John Flavel, 6 vols. (London: Baynes &amp; Son, 1820), vol. 6, pp. 348–56 at Theological Meditations</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

ich+has+nothing+at+all+of+merit+in+it%2C+or+answerable+value+to+the+benefit+it+relates+to%2C+may+be+in+a+proper+sense+a+condition+of+the+said+benefit.+%E2%80%98For+what+is+a+condition+in+the+true+notion+of+it%2C+but+%281%29+the+suspension+of+a+grant+until+something+future+be+done%3F%E2%80%99%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+%E2%80%9CJohn+Flavel%E2%80%99s+%281630%E2%80%931691%29+Reply+to+Baptist+Hyper-Calvinism+from+Vindici%C3%A6+Legis+et+F%C5%93deris+and+the+Issue+of+Conditions%E2%80%9D+from+Vindici%C3%A6+Legis+et+F%C5%93deris%3A+Or%2C+A+Reply+to+Mr.+Philip+Cary%E2%80%99s+Solemn+Call+%281690%29+in+The+Whole+Works+of+the+Rev.+Mr.+John+Flavel%2C+6+vols.+%28London%3A+Baynes+%26+Son%2C+1820%29%2C+vol.+6%2C+pp.+348%E2%80%9356+at+Theological+Meditations&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F54f697d22b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/54f697d22b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=1.%29%20What%20we%20mean%20by%20a,grant%20until%20something%20future%20be%20done&amp;text=1.%29%20What%20we%20mean%20by%20a%20condition%20in&amp;text=of%20a%20grant%20until%20something%20future%20be%20done" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e120f7bfe8" data-kw="">
<blockquote><p>Adoption, that also is a privilege we receive in this life; yea a learned man ([William] Forbes in his book where he handles the order of God’s graces [Modest Considerations...]) makes adoption (as I take it) to be the first, and to go before justification; yet the apostle, Rom. 8:23, calls the Last Day, the day of adoption. Hence 1 Jn. 3:2, the apostle, though he says, ‘We are now the sons of God,’ yet he says ‘it does not appear what we shall be,’ because the glory God at the Last Day will put upon us is so far transcendent and superlative to what now we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, (London: Miller, 1651), Lecture 29, on Acts 3:19, p. 256</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>The conception embodied in the terms, ‘belief’, ‘faith’, is not that of an arbitrary act of the subject, it is that of a mental state or act which is determined by sufficient reasons.</p></blockquote>

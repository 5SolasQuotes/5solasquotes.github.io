</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4b80df7169" data-kw="">
<blockquote><p>But still I ask, are we absolutely and always bound to obey magistrates? Nay, but only when they command such things as are according to the rules of the Word, so that either they must be obeyed, or the Law of Charity shall be broken: in this case, and no other, we are bidden obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, ... (Edinburgh, 1637) | 3rd Part, pp. 134-138, 142 &amp; 155-57 of ch. 8, ‘That the Lawfulness of the Ceremonies cannot be Warranted by any Ordinance of the Civil Magistrate…’ This is the best., p. 157</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-5564f73674" data-kw="">
<blockquote><p>Moreover, grace perfects nature and does not annul it (ibid., I, qu. 1, art. 8, ad 2). Grace presupposes nature (ibid., qu. 2, art. 2, ad 1) and perfects nature according to the proper mode of that nature (ibid., qu. 62, art. 5, a). Just as grace presupposes nature and perfects it, divine law presupposes and perfects natural law (ibid., I-II, qu. 90, art. 2, ad 1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/germain-grisez.html">Germain Grisez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Dualism &amp; the New Morality’</cite>, (1977)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-faa69f19c5" data-kw="">
<blockquote><p>That whatsoever Law of GOD, or command of His, we find recorded in the Lawbook, in either of the volumes of God’s statute, the N. T. or the Old, remains obligatory to us, unless we can prove it to be expired, or repealed. So it is with the statute-law of this nation [England], or of any nation; What I can prove to be once enacted, I may urge as still in force, unless any one can answer me with a just proof that it is now out of date, or repealed by a latter Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glass of God’s Providence</cite>, (1644) p. 52 In the context of a rule in Scripture for Church Government.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-70b13233de" data-kw="">
<blockquote><p>Hence it [polygamy] might be lawful in the court of earth (so as to obtain immunity from civil and ecclesiastical punishments among men), but not in the court of heaven before God. … XXIX. As to divorce, God neither simply commanded nor permitted it, but only wished to restrain by fixed laws the facility of divorces which prevailed among the Jews against the natural law of marriage, so as to regulate the mode of an unlawful thing, not however to make it lawful. Hence Christ says that God ‘permitted’ or ‘tolerated’ it ‘because of the hardness of heart of the Jews’ (Mt. 19:8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, section 26 &amp; 29, pp. 15-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

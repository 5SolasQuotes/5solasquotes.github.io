<blockquote><p>5. They differ [objecto] in the object. The chief object concerned in the first covenant was all mankind, (though it referred to Adam more immediately,) the first man being the root, spring, and representative head of all mankind. Adam was the first person with whom this covenant was made, yet it was not only personal, but comprehensive, and extended to all man’s posterity, therefore when he violated that covenant, it was imputed to us, his fault was our guilt; “for in Adam all sinned,” see Rom. v. 12, 16. But this second covenant is personal, it is contracted with individual souls; it is true, the general grant is to all, the proclamation is universal, whosoever will, it is offered promiscuously but the saving benefits of this covenant reach no further with respect to persons at age, than those that by faith apply them, by particularly laying hold of this blessed covenant; it is only the seed, believers, heirs of the promise, children of the covenant, that are sharers in it, Gal. iii. 22.

6. The first covenant, and this new gospel covenant differ [materia] in the matter, or good things promised, in the former God promised life only, “Do this and live”; he did not promise continuance of life absolutely, but upon condition of man’s obedience, nor yet his restitution in case he fell, for fall once, and fall finally, there is no recovery by virtue of that old covenant. But now by this gospel covenant, God promiseth many rich blessings which in this our fallen state are needful for us, as pardon of sin, reconciliation, adoption, sanctification, means of grace, daily supports, perseverance, a crown of glory ; God gives grace and glory by virtue of it, and what tends to both, and that immutably without failure or defectibility; see Jer. xxxi. 34—36. xxxiii. 20, 21. Isa. liv. 9, 10.

7. They differ [conditionibus] in the conditions of both; indeed some say obedience is the condition on man’s part under both covenants, but surely not the same obedience, the former required personal, perfect, absolute, and perpetual obedience to the commands, both moral and positive, without any deviation to the right-hand, or to the left, if he failed in the least punctilio, he was under the curse, Gal. iii. 10; and this obedience must be performed by strength of grace received in his first creation; since man was able to perform it, this condition was highly reasonable. But in the gospel covenant the great condition is faith; a free acceptance of the offered grace, an unfeigned faith, which is not an antecedent condition to the making of the covenant, but subsequent, or intermediate for man’s laying hold, and receiving the benefits thereof; yea, God promiseth and worketh what he requires; all faith, repentance, and new obedience, are the gifts of free grace; grace doth all, Rom. iv. 16</p></blockquote>

<blockquote><p>This paper is an attempt to argue that Calvin’s theology and the developed Covenant Theology of the Westminster Confession of Faith are in essential doctrinal agreement in respect of one doctrine or cluster of doctrines, that are concerned with the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-helm.html">Paul Helm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Calvin &amp; the Covenant</cite>, 2, pp. 65-71</span></figcaption>

<blockquote><p>X. What is said of “the sepulcher” and “death” (Gen. 37:35; 42:38)—that Jacob was about to go down with sadness (lsh’vl) (“into the grave”) is falsely drawn to limbo. Sh’vl or hadēs is the grave into which men descend after death.

XI. “The pit wherein is no water,” from which the ancients were to be sent forth by the blood of the covenant (Zech. 9:11), ought not to be drawn to limbo since this may be said partly literally concerning deliverance from the Babylonian captivity and the miseries accompanying it (from which the Jews were not yet entirely freed); partly mystically, concerning the spiritual captivity under sin from which Christ frees us by the efficacy of his blood, by which the covenant of grace is ratified (as it was the foundation of all deliverances even temporal).

XII. It was not the real Samuel who was seen by the woman (1 S. 28:12), but only his apparition (spectrum) (to wit, a demon personating the prophet), who came out of the earth to terrify Saul, as Satan himself often transfigures himself into an angel of light. For no right or dominion belongs to demons over the souls of the pious whom God has received into the eternal tabernacle that they may rest from their labors (otherwise their condition after death would be worse than in life, in which, armed with faith, they are safe from all the assaults of Satan). Besides, if it was Samuel himself, he would not have suffered Saul to worship him; nor could it be said that God had not answered Saul consulting him—neither by priests nor by prophets, because he had answered then by the prophets. Nor is there anything important as to the mistake in the name of Samuel given to that apparition; it could be so called on account of similitude, as images are usually called by the names of the things themselves of which they are images (as Augustine fully proves ad Simplicianum). Nor is there any importance in this that it predicted future things because this could be done by divine revelation for the punishment of men (as the same Augustine and after him Lyranus observe; cf. De diversis questionibus ad Simplicianum [PL 40:101–48]).

XIII. It is said that no one ascended into heaven before the Son of man descended from heaven (Jn. 3:13), not as to local ascension to the beatific vision because Enoch and Elijah had already been translated even bodily, but as to a mystical ascension (i.e., a knowledge of heavenly things to be made manifest to men). As “to ascend into heaven” (Rom. 10:6) is to know divine mysteries (cf. Prov. 30:4). In this sense, it is said that no one has ever seen God, but the Son, who is in the bosom of the Father, he has revealed him to us (Jn. 1:18); and “neither knoweth any man the Father, save the Son, and he to whomsoever the Son will reveal him” (Mt. 11:27).

XIV. “The way into the holiest of all” is said not to have been manifested before the ascension of Christ (Heb. 9:8); not that it was entirely concealed, but (1) that it was not so clearly made known. Therefore the fathers went into heaven through Christ (in whom they believed) because he is the way of entrance into heaven, but who was not yet clearly known because he had not yet come. (2) Again, it was not known to any of the Gentiles, as in the New Testament. (3) It was not as yet manifested by the actual ransom (lytrō) of Christ (which had not yet been paid), but only as to efficacy of merit. (4) Time is not compared with time here, but rather the Mosaic sacrifices with the sacrifice of Christ, to intimate that they could not open heaven to us, which was granted to the blood of Christ alone. (5) If Christ is said to have been the first who entered into heaven, this is to be understood not as to time, but as to causality because the entrance of Christ was the true cause of the fathers’ no less than of our entrance into heaven.

XV. The “prison” (phylakē) mentioned in 1 Pet. 3:19 (“by which [Spirit] also Christ went and preached unto the spirits in prison” [tois en phylakē]) cannot mean the limbo of the fathers. He speaks of those which “sometime were disobedient” (apeithēsasi pote), while Christ by his prophetic Spirit through Noah preached repentance to them. Rather it denotes the infernal prison (as in Rev. 20:7) in which (in the time of Peter) they were held shut up on account of their resistance to the preaching of Christ by Noah (to wit, to those who are in prison now [tois en phylakē ousi], not who were formerly there). XVI. Although it can be said that the ancients received some increase of knowledge and consolation after the exhibition of Christ in the flesh and his ascension unto heaven (as is said of the angels, Eph. 3:10), it does not follow that they had been altogether excluded from heaven and from beholding the face of God; but only that their beatitude was not yet fully consummated. To this some refer the words of the apostle: “God having provided some better things for us, that they without us should not be made perfect” (Heb. 11:40). And to this Calvin seems to have had respect by the mirror or act of watching in which he says the fathers were said from a desire of Christ not to exclude them from the fruition of beatitude and the vision of God, but to mark the desire and earnest expectation (apokaradokian) of the advent of Christ, to which also the angels are said to have looked (1 Pet. 1:12) (Epistle of Paul … to the Hebrews and the First and Second Epistles of St. Peter [trans. W. B. Johnston, 1963], p. 293 on 1 Pet. 3:19). XVII. The promise sometimes denotes the first advent of Christ in the flesh promised in the Old Testament; sometimes the second in glory promised in the New. The ancients died without “receiving the promise” (Heb. 11:39)—namely, concerning the former advent of Christ, which was reserved for us without them. But believers still wait for the promise (epangelian)—namely, to be brought in the latter advent of the Lord (Heb. 10:36, 37)—which they also themselves are about to receive; but not without us for what we now expect will be common to us with them. Thus God has set before us “something better” (kreitton ti) with regard to the former advent, in which we alone rejoice.</p></blockquote>

— Francis Turretin, Institutes of Elenctic Theology, 12.4.10–17, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 260–61.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CX.+What+is+said+of+%E2%80%9Cthe+sepulcher%E2%80%9D+and+%E2%80%9Cdeath%E2%80%9D+%28Gen.+37%3A35%3B+42%3A38%29%E2%80%94that+Jacob+was+about+to+go+down+with+sadness+%28lsh%E2%80%99vl%29+%28%E2%80%9Cinto+the+grave%E2%80%9D%29+is+falsely+drawn+to+limbo.+Sh%E2%80%99vl+or+had%C4%93s+is+the+grave+into+which+men+descend+after+death.+XI.+%E2%80%9CThe+pit+wherein+is+no+water%2C%E2%80%9D+from+which+the+ancients+were+to+be+sent+forth+by+the+blood+of+the+covenant+%28Zech.+9%3A11%29%2C+ought+not+to+be+drawn+to+limbo+since+this+may+be+said+partly+literally+concerning+deliverance+from+the+Babylonian+captivity+and+the+miseries+accompanying+it+%28from+which+the+Jews+were+not+yet+entirely+freed%29%3B+partly+mystically%2C+concerning+the+spiritual+captivity+under+sin+from+which+Christ+frees+us+by+the+efficacy+of+his+blood%2C+by+which+the+covenant+of+grace+is+ratified+%28as+it+was+the+foundation+of+all+deliverances+even+temporal%29.+XII.+It+was+not+the+real+Samuel+who+was+seen+by+the+woman+%281+S.+28%3A12%29%2C+but+only+his+apparition+%28spectrum%29+%28to+wit%2C+a+demon+personating+the+prophet%29%2C+who+came+out+of+the+earth+to+terrify+Saul%2C+as+Satan+himself+often+transfigures+himself+into+an+angel+of+light.+For+no+right+or+dominion+belongs+to+demons+over+the+souls+of+the+pious+whom+God+has+received+into+the+eternal+tabernacle+that+they+may+rest+from+their+labors+%28otherwise+their+condition+after+death+would+be+worse+than+in+life%2C+in+which%2C+armed+with+faith%2C+they+are+safe+from+all+the+assaults+of+Satan%29.+Besides%2C+if+it+was+Samuel+himself%2C+he+would+not+have+suffered+Saul+to+worship+him%3B+nor+could+it+be+said+that+God+had+not+answered+Saul+consulting+him%E2%80%94neither+by+priests+nor+by+prophets%2C+because+he+had+answered+then+by+the+prophets.+Nor+is+there+anything+important+as+to+the+mistake+in+the+name+of+Samuel+given+to+that+apparition%3B+it+could+be+so+called+on+account+of+similitude%2C+as+images+are+usually+called+by+the+names+of+the+things+themselves+of+which+they+are+images+%28as+Augustine+fully+proves+ad+Simplicianum%29.+Nor+is+there+any+importance+in+this+that+it+predicted+future+things+because+this+could+be+done+by+divine+revelation+for+the+punishment+of+men+%28as+the+same+Augustine+and+after+him+Lyranus+observe%3B+cf.+De+diversis+questionibus+ad+Simplicianum+%5BPL+40%3A101%E2%80%9348%5D%29.+XIII.+It+is+said+that+no+one+ascended+into+heaven+before+the+Son+of+man+descended+from+heaven+%28Jn.+3%3A13%29%2C+not+as+to+local+ascension+to+the+beatific+vision+because+Enoch+and+Elijah+had+already+been+translated+even+bodily%2C+but+as+to+a+mystical+ascension+%28i.e.%2C+a+knowledge+of+heavenly+things+to+be+made+manifest+to+men%29.+As+%E2%80%9Cto+ascend+into+heaven%E2%80%9D+%28Rom.+10%3A6%29+is+to+know+divine+mysteries+%28cf.+Prov.+30%3A4%29.+In+this+sense%2C+it+is+said+that+no+one+has+ever+seen+God%2C+but+the+Son%2C+who+is+in+the+bosom+of+the+Father%2C+he+has+revealed+him+to+us+%28Jn.+1%3A18%29%3B+and+%E2%80%9Cneither+knoweth+any+man+the+Father%2C+save+the+Son%2C+and+he+to+whomsoever+the+Son+will+reveal+him%E2%80%9D+%28Mt.+11%3A27%29.+XIV.+%E2%80%9CThe+way+into+the+holiest+of+all%E2%80%9D+is+said+not+to+have+been+manifested+before+the+ascension+of+Christ+%28Heb.+9%3A8%29%3B+not+that+it+was+entirely+concealed%2C+but+%281%29+that+it+was+not+so+clearly+made+known.+Therefore+the+fathers+went+into+heaven+through+Christ+%28in+whom+they+believed%29+because+he+is+the+way+of+entrance+into+heaven%2C+but+who+was+not+yet+clearly+known+because+he+had+not+yet+come.+%282%29+Again%2C+it+was+not+known+to+any+of+the+Gentiles%2C+as+in+the+New+Testament.+%283%29+It+was+not+as+yet+manifested+by+the+actual+ransom+%28lytr%C5%8D%29+of+Christ+%28which+had+not+yet+been+paid%29%2C+but+only+as+to+efficacy+of+merit.+%284%29+Time+is+not+compared+with+time+here%2C+but+rather+the+Mosaic+sacrifices+with+the+sacrifice+of+Christ%2C+to+intimate+that+they+could+not+open+heaven+to+us%2C+which+was+granted+to+the+blood+of+Christ+alone.+%285%29+If+Christ+is+said+to+have+been+the+first+who+entered+into+heaven%2C+this+is+to+be+understood+not+as+to+time%2C+but+as+to+causality+because+the+entrance+of+Christ+was+the+true+cause+of+the+fathers%E2%80%99+no+less+than+of+our+entrance+into+heaven.+XV.+The+%E2%80%9Cprison%E2%80%9D+%28phylak%C4%93%29+mentioned+in+1+Pet.+3%3A19+%28%E2%80%9Cby+which+%5BSpirit%5D+also+Christ+went+and+preached+unto+the+spirits+in+prison%E2%80%9D+%5Btois+en+phylak%C4%93%5D%29+cannot+mean+the+limbo+of+the+fathers.+He+speaks+of+those+which+%E2%80%9Csometime+were+disobedient%E2%80%9D+%28apeith%C4%93sasi+pote%29%2C+while+Christ+by+his+prophetic+Spirit+through+Noah+preached+repentance+to+them.+Rather+it+denotes+the+infernal+prison+%28as+in+Rev.+20%3A7%29+in+which+%28in+the+time+of+Peter%29+they+were+held+shut+up+on+account+of+their+resistance+to+the+preaching+of+Christ+by+Noah+%28to+wit%2C+to+those+who+are+in+prison+now+%5Btois+en+phylak%C4%93+ousi%5D%2C+not+who+were+formerly+there%29.+XVI.+Although+it+can+be+said+that+the+ancients+received+some+increase+of+knowledge+and+consolation+after+the+exhibition+of+Christ+in+the+flesh+and+his+ascension+unto+heaven+%28as+is+said+of+the+angels%2C+Eph.+3%3A10%29%2C+it+does+not+follow+that+they+had+been+altogether+excluded+from+heaven+and+from+beholding+the+face+of+God%3B+but+only+that+their+beatitude+was+not+yet+fully+consummated.+To+this+some+refer+the+words+of+the+apostle%3A+%E2%80%9CGod+having+provided+some+better+things+for+us%2C+that+they+without+us+should+not+be+made+perfect%E2%80%9D+%28Heb.+11%3A40%29.+And+to+this+Calvin+seems+to+have+had+respect+by+the+mirror+or+act+of+watching+in+which+he+says+the+fathers+were+said+from+a+desire+of+Christ+not+to+exclude+them+from+the+fruition+of+beatitude+and+the+vision+of+God%2C+but+to+mark+the+desire+and+earnest+expectation+%28apokaradokian%29+of+the+advent+of+Christ%2C+to+which+also+the+angels+are+said+to+have+looked+%281+Pet.+1%3A12%29+%28Epistle+of+Paul+%E2%80%A6+to+the+Hebrews+and+the+First+and+Second+Epistles+of+St.+Peter+%5Btrans.+W.+B.+Johnston%2C+1963%5D%2C+p.+293+on+1+Pet.+3%3A19%29.+XVII.+The+promise+sometimes+denotes+the+first+advent+of+Christ+in+the+flesh+promised+in+the+Old+Testament%3B+sometimes+the+second+in+glory+promised+in+the+New.+The+ancients+died+without+%E2%80%9Creceiving+the+promise%E2%80%9D+%28Heb.+11%3A39%29%E2%80%94namely%2C+concerning+the+former+advent+of+Christ%2C+which+was+reserved+for+us+without+them.+But+believers+still+wait+for+the+promise+%28epangelian%29%E2%80%94namely%2C+to+be+brought+in+the+latter+advent+of+the+Lord+%28Heb.+10%3A36%2C+37%29%E2%80%94which+they+also+themselves+are+about+to+receive%3B+but+not+without+us+for+what+we+now+expect+will+be+common+to+us+with+them.+Thus+God+has+set+before+us+%E2%80%9Csomething+better%E2%80%9D+%28kreitton+ti%29+with+regard+to+the+former+advent%2C+in+which+we+alone+rejoice.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+12.4.10%E2%80%9317%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+2+%28Phillipsburg%2C+NJ%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+260%E2%80%9361.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe47c611190.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e47c611190.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/06/turretin-contra-the-limbus-patrum-4/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The second thing that I marked was this, the wonderful inclination that the Lord has to mercy, how well He answers to his names and styles, while He is called a God of compassion, a God of exceeding and infinite mercy.</p></blockquote>

</figure><figure class="quote" id="q-4ddb9747d0" data-kw="covenant of grace">
<blockquote><p>Reply; How often have we shewed that this Text proves not that any Children, quatenus as such, should be baptized, nor, as such, that they are in the Covenant of Grace, or have the Promise made to them; the Promise runs to the Jews and to their Offspring, and not to them only, but to Gentiles also, who were said to be afar off: But pray observe, &#x27;tis to no more of the Jews and their Children or Offspring, and such who were afar off, than the Lord shall call or make Disciples by the Word and effectual Operations of the Holy Spirit. My Sons and Daughters are as much my Children when they are twenty or thirty Years old, as well as when Babes. Dr. Hammond also grants, Children in this Text doth not refer to Insants as such, but to the Posterity of the Jews, p. 490. Sect. 81. If ye be Christ&#x27;s, then you are Abraham&#x27;s Seed, and Heirs according to the Promise.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6e73f5cce9" data-kw="">
<blockquote><p>Qu. 10. Can that man that hath one spark of grace believe that he hath no sin? Can he have so little knowledge of himself? And consequently of the need he hath of the Physician? Dare you say to Christ, we will not be beholden to thee for thy blood to wash us any more, or to thy Intercession to part on us any more? Do you not believe that In many things we offend all, Jam. 3. 2. If we say that we have no sin we deceive our selves, and the truth is not in us? If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness: If we say that we have not sinned, we make hem a liar, and his Word is not in us, 1 Joh. 1. 8, 9. 10.

Are not all Christ’s Disciples taught daily to pray [Forgive us our trespasses.] For my part, I am one that is sick and have need of the Physician, and dare not tell God that I will ask him pardon for no more sins, nor be beholden to him for any more. But O what a power hath the deceiver with these wretches, that in the midst of their horrid railing, slandering, and other wickedness, will stand to it that they have no sin; Just like the Swearer that will swear he never swore an Oath; Or the Drunkard that will swear he was never drunk, when he lieth drunk in the Channel. Solomon saith, There is not a just man upon earth that doth good and sinneth not, Eccles. 7. 20. and these Quakers that Pharisaically and Papistically justify themselves do give him the Lie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers catechism, or, The Quakers questioned, their questions answered, and both published for the sake of those of them that have not yet sinned unto death and of those ungrounded novices that are most in danger of their seduction</cite>, (London: Thomas Underhill and Francis Tyton, 1655), pp 29-30.</span></figcaption>

</figure><figure class="quote" id="q-734562b80d" data-kw="">
<blockquote><p>O take a look of Him in his perfection. He is without measure and limits – without beginning and ending. He is one and the same in his nature, in his counsels, and in his love. He perfectly knoweth Himself, and all things that are possible. He can do all things that do not imply a contradiction, and argue imperfection.

He is good and doeth good; He is righteous in Himself, and equal in all his ways of dealing with his creatures. He is true without and dissimulation; He is holy, and delighteth in his own holiness, and in every resemblance of it, in his angels and in his saints.

O! who can think of Him and who can speak of Him aright? He is infinite in all his attributes; and every perfection hath a perfect meeting in Him. Albeit some of his attributes are in some degree communicable to his creatures, yet they are in Him in an altogether incommunicable manner and measure. There is nothing in God but what is God; for this is his name – “I am that I am.”

Again I say, Who can think of Him, and who can speak of Him aright? Who can comprehend Him, or compass Him about? Who by understanding can search out God? Humble and believing ignorance is better than curious and prying knowledge: for all that we can know of Him, is to know that we cannot know him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Honourable Societies of Strangers at Lewarden, in Friesland, 18 February 1686 in Thomas Houston (ed.), Spiritual Support and Consolation in Difficult Times: The Letters of the Rev. James Renwick (1865) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D. (4 vols, Edinburgh</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-7fa56a2dab" data-kw="">
<blockquote><p>Whether God is in every way perfect? It is affirmed. Whether God is universally perfect, as having the perfection of all things in Himself? It is affirmed with a distinction. Whether creatures are able to be similar to God? It is affirmed with a distinction. Whether perfection may be a natural property of God? It is affirmed. Whether because God makes all according to Himself, He is imperfect in Himself? It is denied. Whether because He uses the works of men and from them requires honor, He is imperfect in Himself? It is denied. Whether the created perfections are in God? It is denied with a distinction. [contrast this with Becanus above]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(4) ‘Perfection’ in I. ‘Of God’ in Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 1, tract 2, 4. Attributes of God in Specific, 1st Kind Abbr.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

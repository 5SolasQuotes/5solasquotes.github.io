<blockquote><p>93. Next it may be granted that the matter may be put under a further examination, yet upon condition, that when it is come to the revision of the former sentence, regard may be had of the weaker which are found willing to be taught, though they doubt; but that unto the wicked and contentious tempters, which do mainly strive to oppress our liberty which we have in Christ, and to bring us into bondage, we do not for a moment give place by subjecting ourselves; for what else seek they or wait for, than that under the pretense of a revising and of new debate, they cast in lets and impediments ever and anone, and that by cunning lyings in wait they may betray the liberty of the Church, and in process of time may by open violence more forceably break in upon it, or at least constrain the ministers of the Church to weave Penelope’s web, which they can never bring to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 111 Propositions</span></figcaption>

</figure><figure class="quote" id="q-59e476181b" data-kw="">
<blockquote><p>…there is yet another concession which it is necessary to make in regard to this matter, and which it is of some importance to note; and it is this, that the mere resistance to authority as authority alone, ought not to be made a ground for Church censure or punishment, when there is no moral or spiritual offence connected with the resistance. Of course resistance to authority, even when that authority is put forth, as it sometimes may and must be, in enforcing a thing indifferent, may yet be associated with moral guilt on the part of those who indulge in it. Such resistance may arise out of feelings of hatred to all restraint, or opposition of a malignant kind to all authority; it may become contumacy, and as such involve moral blame. But until resistance to authority becomes in one way or other morally wrong, when the consent of the members to the act or deed of the rulers is withheld from no cause in itself sinful, such want of consent or concurrence ought to be dealt with on the principle of forbearance in things indifferent, and not be visited with censure or penalty of an ecclesiastical kind.</p></blockquote>

et="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ef8518f3d8" data-kw="">
<blockquote><p>The question therefore amongst divines is, Whether Christ in this text has given authority to his ministers actually to discharge men of the guilt of their sins; or only to declare unto them, that if their repentance and faith be true, their sins are really forgiven them? The former is by many contended for; but it does not seem reasonable…</p></blockquote>

</figure><figure class="quote" id="q-445466e81c" data-kw="">
<blockquote><p>2. As concerning actions of Church-policy that cannot be warranted by the light of nature, and yet have intrinsical conveniency and aptitude to edify and decently to accommodate the worship of God. I conceive these may be done, but not because the Church so commands, as if their commandment were the formal reason of our obedience, but because partly the light of the Law of reason, partly scripture does warrant them… … Question. But does not the Church determine things that of themselves are indifferent, as whether [the] sermon should begin at nine of clock or ten in the morning; and after the Church has past a determination for the diet of ten a clock, the indifferency of either nine or ten is removed and the practice, without any warrant of Scripture, [is] restricted to one, for order and peace sake; and why may not the like be done in positives of Church-government? Answer. The truth is [that] the Church by her will puts no determination on the time, but only ministerially declares that which God’s providence accommodating itself to the season, climate, the conveniency of the congregation as they lie in distance from the place of meeting, has determined already…</p></blockquote>

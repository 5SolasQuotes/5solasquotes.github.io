<main class="wrap"><figure class="quote" id="q-673436de2b" data-kw="">
<blockquote><p>It has pleased the Lord also, to bring you a degree further, that both the honourable Houses of Parliament, and many others, whose hearts the Lord has touched, have entered into a SOLEMN LEAGUE AND COVENANT, for performing such duties, as are judged necessary at this time, for the honour of God, and for the deliverance and preservation of the church and kingdom, which no doubt will prove a precious and powerful means of good, if the name of the most High God, be not by it taken in vain. But take heed, that it be not forgotten by them that have taken it, before it be taken by others. And therefore two things would be looked into. (1.) That although it should never be taken by others, yet it obliges such as have entered in covenant, and although the whole nation be bound to the same duties which you are bound unto, you have entered into a new obligation, which, if you shall forget or violate, will certainly be laid to your charge. Jeremiah reproves Israel not for the transgression of the Law, which yet commanded the same duties, but for violation of the covenant (Jer. 34). (2) That others be instructed and moved to enter into the same covenant. For if they who have entered in covenant shall not consider that it is a perpetual covenant never to be forgotten, or (which God forbid) shall forget, their supervenient obligation, and others shall refuse to enter in covenant, it will not only make a division in the church and kingdom, but shall be a ready way to bring on a greater wrath, than yet has been seen or felt, upon one sort for their perfidy, and upon the other for their neglect or obstinacy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached to the Honourable House of Commons at their late Solemn Fast, Wednesday, December 27, 1643 in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish Commissioners to the Westminster Assembly of divines 1643-1645</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-24eb039105" data-kw="">
<blockquote><p>10. And men are much furthered in the way of separation by forgetting what good even hypocrites themselves may receive by their station in the visible Church: And that it is not for nothing that the Great Master of the Church has so ordered the terms of admission (upon mere profession of consent to the baptismal Covenant) and of exclusion (upon proved impenitency in gross sin after sufficient admonition and patience) as that multitudes of bad men ever have been and will be in the visible Church: Though the regular station that such persons should choose, till they come up to sincere consent, is the place of catechumens, if they were not baptized in infancy, and the place of penitents if they were, yet supposing that they intrude further by a false profession, yet God has provided great advantages in Church communion for their good and secured the innocent from imputation of sin by reason of their presence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), ‘To those Readers…’, p. 6</span></figcaption>

</figure><figure class="quote" id="q-b7f4593e65" data-kw="">
<blockquote><p>James Nisbet agonized over this difficult choice… should he join the clearly imperfect Church of Scotland? Based on the following account form his memoir, it is likely that he parted from the Society shortly after the Revolution Settlement because of the dangerous errors and behaviors of its members: ‘Their criticizing upon and censuring of all others who are not exactly of their judgment in every punctilio, grievously aggravating their faults and often fixing some where there is none; yea, seldom sparing one another even where they are one in judgment, [they made] the terms of their communion straighter than what God allows in his Word. They will allow no masters of families to be of their communion who pay any taxes to the present government, making no difference betwixt this legal and the former illegal and tyrannical government. They will allow no children or servants to be in their communion who obey their parents and masters in doing any service to those in public trust in the government. They will allow none to hear any of the present ministry, even though transiently, to be in their communion. They spend the most part of their precious time in arguing and praying against the sins and defections of the public, neglecting to watch the heart; and here, to my shame, I was greatly guilty of this, among others. We spent much of our precious time in framing arguments to debate with others, greatly neglecting to be distinctly acquainted with the principles of the Christian religion and to be savingly acquainted with the inward and serious part of real godliness. They would publish a declaration disowning the authority of the great King William [of the Glorious Revolution, 1689 ff.] and against the validity of the present church communion. When I earnestly besought, with much entreaty, that every article of that declaration might be reasoned, they would not allow it… Thus my protesting, and refusing to join with them, enraged them exceedingly against me. As their scourge of tongues was grievously bent against others, so now was it against myself in a most grievous, unjust, and unreasonable manner… Thus, I left that party of the dissenters who now commonly go under the name of Mr. McMillan’s people…’ (Nisbet, Private Life, pp. 235-238)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage</cite>, (2000) Moore is very sympathetic with the Cameronians., p. 159</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

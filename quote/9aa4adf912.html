<blockquote><p>Another reason is taken according to another way of distinguishing: because some are signs of the absolute divine will, others of the conditional. I say, therefore, that because one cannot act against the absolute will, one cannot act against the signs of the absolute will, such as are fulfillment and permission. But because one can act against the antecedent or conditional will, because man can turn away from the order to which he was created by his institution: hence it is that one can act against the will of the sign which signifies that, namely against prohibition, precept, and counsel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences (d. 1274), bk. 1 | dist. 47 | quest. 2, ‘Whether anyone can act against the will of the sign’</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f54f4838e3" data-kw="">
<blockquote><p>In Romans 2:4, it [longsuffering] is associated with the goodness and forbearance of God, and subsumed under his goodness, as that which is despised by the impenitent who treasures up for himself wrath in the day of wrath, who does not know that the goodness of God “leadeth him to repentance” (eis metanoian se agei). The choice of the verb agein is to be noted. Since the impenitent are in view, it cannot refer to efficacious grace. Nevertheless, it is a strong verb as its use in Romans 8:14 shows: “As many as are led by the Spirit of God, these are the sons of God” (cf. Gal. 5:18). It must be understood as a constraining influence flowing from the goodness of God which is calculated to bring men to repentance. The construction in Romans 2:4 is remarkably similar to that in II Peter 3:9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth (1948) General Assembly of the Orthodox Presbyterian Church’, On 2 Pet.</cite>, 3:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-456787a1bb" data-kw="">
<blockquote><p>102. The distinction of God’s antecedent and consequent will, used by Damascene, is by many applied to this controversy, but by none that I have read sufficiently explained, which is the cause that so many good men reject it, because they misunderstand it. It’s truly said that by his antecedent will, God would have all men to believe, repent and be saved, but by his consequent will He will have all condemned whom He does condemn. But then it must be understood that this distinction is not applied to the will of God as He is merely an Absolute Proprietary or Benefactor, but as He is the King or Rector of the world; and so his legislation is his antecedent will, and his judgment is his consequent will. And no man of religion can deny either that God’s Law is the signification of his will, or his will signified, or that his judgment and execution is his will declared; or that God’s Law of Grace does conditionally give pardon and salvation to all antecedently to man’s performance or rejection of the condition, or that God condemns infidels consequently to their infidelity. The Law antecedently to man’s part acted says, ‘He that believes shall be saved;’ and the sentence consequently to his fact says, ‘Judas, an unbeliever or impenitent, shall perish.’ And thus the distinction has no doubt or difficulty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology... (London: White, 1675) | pt. 2, sect. 7, ‘The Antecedent &amp; Consequent Will of God, etc.’</cite>, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-0c2f5df2d3" data-kw="">
<blockquote><p>If we compare this text [Matt 23:37, Christ lamenting over Jerusalem] with Isa. 6:10 they seem to be contrary. For here Christ says, ‘I would have gathered you’: there He says, ‘Harden them that they be not gathered and converted.’ God therefore seems to will and not to will one and the same thing. Answer: There is but one will in God: yet does it not equally will all things, but in diverse respects it does will and nil the same thing. He wills the conversion of Jerusalem, in that He approves it as a good thing in itself: in that He commands it, and exhorts men to it: in that He gives them all outward means of their conversion. He wills it not, in that He did not decree effectually to work their conversion. For God does approve, and He may require many things, which nevertheless for just causes known to Himself, He will not do. The confirmation of the angels that fell, God approved as a thing good in itself, yet did not He will to confirm them. A judge in compassion approves and will[s] the life of a malefactor: and yet withal he wills the execution of justice in his death. Even so God sometimes wills that in his signifying will, which He wills not in the will of his good pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601)</cite>, p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>1st Use. This shows the reason why the preaching of the Word and all the dispensations of grace are so ineffectual and do so little good upon the hearts of most men: why there are so few converted and brought home to God: the heart is hard, hard by nature, hardened more by custom in sinning… 2nd Use. The ministers of God should from hence learn to use all their might and skill in dispensing the Word of God’s grace to the sons of men.</p></blockquote>

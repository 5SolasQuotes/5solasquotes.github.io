<main class="wrap"><figure class="quote" id="q-0403c77b4e" data-kw="">
<blockquote><p>Because it is a day of blessings. -When God instituted the Sabbath in paradise, it is said, “God blessed the Sabbath day and sanctified it” (Gen. ii. 3). He not only set it apart as a sacred day, but made it a day of blessing. Again, when the Lord Jesus rose from the dead on the first day of the week before dawn, He revealed Himself the same day to two disciples going to Emmaus, and made their hearts burn within them (Luke xxiv. 13). The same evening He came and stood in the midst of the disciples, and said, “Peace be unto you;” and He breathed on them and said, “receive ye the Holy Ghost” (John xx. 19). Again, after eight days, – that is, the next Lord’s day, – Jesus came and stood in the midst, and revealed Himself with unspeakable grace to unbelieving Thomas (John xx. 26).

It was on the Lord’s day also that the Holy Spirit was poured out at Pentecost (Acts ii. 1; compare Lev. xxiii. 15, 16). That beginning of all spiritual blessings, that first revival of the Christian Church, was on the Lord’s day. It was on the same day that the beloved John, an exile on the sea-girt isle of Patmos, far away from the assembly of the saints, was filled with the Holy Spirit, and received his heavenly revelation.

So that in all ages, front the beginning of the world, and in every place where there is a believer, the Sabbath has been a day of double blessing. It is so still, and will be, though all God’s enemies should gnash their teeth at it. True, God is a God of free grace, and confines His working to no time or place; but it is equally true, and all the scoffs of the infidel cannot alter it, that it pleases Him to bless His word most on the Lord’s day. All God’s faithful ministers in every land can bear witness that sinners are converted most frequently on the Lord’s day – that Jesus comes in and shows Himself through the lattice of ordinances oftenest on His own day. Saints, like John, are filled with the Spirit on the Lord’s day, and enjoy their calmest, deepest views into the eternal world.

Unhappy men, who are striving to rob our beloved Scotland of this day of double blessing, “ye know not what you do.” You would wrest from our dear countrymen the day when God opens the windows of heaven and pours down a blessing. You want to make the heavens over Scotland like brass, and the hearts of our people like iron. Is it the sound of the golden bells of our ever-living High Priest on the mountains of our land, and the breathing of His Holy Spirit over so many of our parishes, that has roused up your satanic exertions to drown the sweet sound of mercy by the deafening roar of railway carriages?

Is it the returning vigour of the revived and chastened Church of Scotland that has opened the torrents of blasphemy which you pour forth against the Lord of the Sabbath? Have your own withered souls no need of a drop from heaven? May it not be the case that some of you are blaspheming the very day on which your own soul might have been saved? Is it not possible that some of you may remember, with tears of anguish in hell, the exertions which you are now making, against light and against warning, to bring down a withering blight on your own souls and on the religion of Scotland?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-murray-m-cheyne.html">Robert Murray M’Cheyne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>I Love the Lord’s Day</cite>, (1841) in Andrew A. Bonar (ed.), Memoir and Remains of Robert Murray McCheyne, Minister of St. Peter’s Free Church, Dundee (Edinburgh: Oliphant Anderson &amp; Ferrier, 1892), pp 597-98.</span></figcaption>

<blockquote><p>…that such godly men as have been desirous of reformation, and most zealous against human inventions in the worship of God, they always intended such human inventions in the worship of God as had no warrant but the wit and will of man, not such as had warrant either from consequence of Scripture, or light of nature, or civil custom. For a woman to cover her head in time of public prayer, or prophesying, and for a man to uncover his head, the apostle warrants both from the light of nature and the custom of the churches, 1 Cor. 11:4 to 16. The kiss of love in holy assemblies was warranted, not by divine institution (for then it were a sin in us to neglect it now), but by occasion of civil custom in those nations; where, it being usual in their civil assemblies to greet one another with a kiss of love, the apostles do not disallow the use of it in holy assemblies, but only require the sincerity and holiness of the love expressed in such kisses, 1 Cor. 16:20; 1 Thess. 5:26; 1 Pet. 5:14. These apostles did not believe in this point, as you do, that God never betrusted corrupt nature, to frame anything in God’s worship to his praise.</p></blockquote>

<blockquote><p>Relationships and behaviors are manipulated by very powerful unspoken rules. These rules are seldom, if ever, said out loud. In fact, when spoken out loud many of them sound ridiculous. No one says out loud, ‘What people think about us is more important than what is really happening.’ Yet the unspoken rules communicate these and other shaming messages. The ‘can’t-talk’ rule keeps people quiet by labeling them as the problem if they notice and confront a problem. Because people feel they cannot talk about an unspoken rule, they learn to talk in ‘code’ to convey what they mean. Coding is an example of verbal manipulation… Messages are sent through a verbal code that others are supposed to decode… ‘Don’t you think it would be better this way?’ means, ‘I want you to do it this way.’ People also code non-verbally with body language–by giving dirty looks, becoming loud or quiet, or leaving the room in a sullen or disconnected attitude. Triangling is another way to act manipulative in relationships. This simply means to send a message to someone through another person instead of delivering it directly. The effects [are]: Great ‘radar’–the ability to pick up tensions in situations and relationships; ability to decode the crooked messages of others; saying things in code instead of saying them straight; talking about people instead of to them; message-carrying for people; expecting others to know your code; difficulty trusting people; reading other meanings into what people say.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/unwritten-rules.html">David Johnson &amp; Jeff VanVonderen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Subtle Power of Spiritual Abuse</cite>, pp. 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>In Origen’s homily on Numbers 28-29, he expressed his view of how Christians were to observe the Sabbath:

Now the second feast, after the feast of the perpetual sacrifice, is recorded to be the sacrifice of the sabbath, and it is necessary that every saint and just person celebrate the feast of the Sabbath as well Well, what is the feast of the Sabbath, if not that feast of which the apostle says: “So a sabbath,” that is, the observance of the sabbath, “will be left for the people of God” [Hebrews 4:9] Therefore, leaving behind the Judaic observances of the sabbath, let us see what sort of observation of the sabbath there ought to be for the Christian. On the day of the sabbath, no worldly activity is supposed to be carried out. Thus if you cease doing secular works and carry out nothing worldly, but make room for spiritual works, if you come together at church, give ear to the divine readings and discussions, think about heavenly things, show concern for the future hope, keep the coming judgment before your eyes, do not look to present and visible things, but to the invisible and future things, this is how the Christian observes the sabbath.

But even the Jews should have observed these things. After all, even among them, if there was a craftsman, a builder or any other such worker, he takes it easy on the sabbath day. But the reader of the divine law, on the other hand, and the teacher, does not leave off from his work, and yet they are not defiling the sabbath; for this is what the Lord says to them: “Or have you not read that the priests in the temple violate the sabbath and are without an offense?” [Mark 12:5] Therefore, the one who has ceased from the works of the world and makes room for spiritual actions is the one who carries out the sacrifice of the sabbath and celebrates the feast day of the sabbaths.

He “carries no burdens on the road”; [Nehemiah 13:19] for every sin is a burden, as the prophet says: “They have weighed down on me like a heavy burden.” [Psalm 38:4] He “kindles no fire,” [Exodus 35:3] namely, that fire of which it is said: “Go in the light of your fire and in the flame which you have kindled.” [Isaiah 50:11] On the sabbath each one stays in his own place and does not go forth from it. Well, what is the “place” of the spiritual soul? Its place is justice, truth, wisdom, sanctification, and everything that Christ is; this is the “place” of the soul. It is not proper for the soul to go forth from this place, so that it may keep the true sabbaths and accomplish the feast day with the sacrifices of the Sabbath, as the Lord also said: “He who stays in me, I too [will stay] in him.” [John 15:5]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/origen-of-alexandria.html">Origen of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on Numbers</cite>, trans. Thomas P. Scheck, ed. Christopher A. Hall, Ancient Christian Texts (Downers Grove IL: IVP Academic, 2009), 23.4.1-2, pp 142-43.</span></figcaption>

</figure><figure class="quote" id="q-d96ffe0e6a" data-kw="">
<blockquote><p>Much less can he [a magistrate] on pretence of parish-order tie me to an ignorant, drunken, malignant, or an inexperienced sapless [religious] teacher, that is to my soul as a silly emperic [a medical practitioner who relies solely on observation and experiment] to my health. Scripture and the world’s experience tell how much God morally gives his light and grace according to the aptitude of means: Habitus infusi se habent ad modum acquisitorum [infused habits hold themselves unto the way of those things having been acquired], is common in the schools. Twenty sinners are usually sooner brought to repentance under skilful, fit teachers than under one unskilful or ungodly man. And no man has power from God to damn my soul or forbid me the needful means of my salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Answer to Dr. Edward Stillingfleet’s Charge of Separation</cite>, … (London: 1680), ‘A Reply to Dr. Stillingfleet’s Letter’, p. 16</span></figcaption>

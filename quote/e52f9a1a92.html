<main class="wrap"><figure class="quote" id="q-e52f9a1a92" data-kw="">
<blockquote><p>Rule II. That justification stands in two things: First in the remission of sins by the merit of Christ’s death: Secondly in the imputation of Christ’s righteousness; which is another action of God whereby He accounts and esteems that righteousness which is in Christ, as the righteousness of that sinner which believes in Him. By Christ’s righteousness we are to understand two things: First his sufferings, specially in his death and passion; Secondly his obedience in fulfilling the Law: both which go together: for Christ in suffering obeyed, and obeying suffered. And the very shedding of his blood to which our salvation is ascribed, must not only be considered as it is passive, that is a suffering, but also as it is active, that is, an obedience, in which He showed his exceeding love both to his Father and us, and thus fulfilled the law for us. This point, if some had well thought on, they would not have placed all justification in remission of sins as they do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... ([Cambridge] 1598), ch. 4, ‘The Justification of a Sinner’, p. 925</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-a0cb24bd13" data-kw="">
<blockquote><p>And the man, out of Christ and under the Law, is still compelled in both active and passive obedience… And for the believer in Christ, the rigor of the Law is abated, not that the Law, as the Law, requires less of him than absolutely perfect obedience, but because in what he comes short in performing of new obedience, from a new principle, to wit, a Gospel-spirit in him, he is pardoned in Christ, and the rest is accepted for Christ’s sake, as if it were obedience. Now in this new obedience, the Spirit so oils the wheels of free-will as obedience, in its kind, is as free, connatural, delightful, being sweetened with the love of God, as if there were not an awing Law, but a sweetly alluring and heart-drawing free love, so that the believer obeys…</p></blockquote>

</figure><figure class="quote" id="q-86ce0050dd" data-kw="">
<blockquote><p>Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).</p></blockquote>

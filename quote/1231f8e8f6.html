<main class="wrap"><figure class="quote" id="q-1231f8e8f6" data-kw="">
<blockquote><p>Certainly, then, its [baptism’s] advantage is not small. And first, as respects pious parents, to whom it cannot but be most agreeable that their dear children enjoying the blessing of newness of life and consecrated by the washing of the mysterious font, should be established in God and his Christ, and that as persons united to the fellowship of the church they should be solemnly admitted to the participation of all saving benefits and publicly sealed as belonging to God in Christ.

Thus, through the manifestation of the great mercy of God, they will be furnished in the first place with the amplest ground for exalting his glory, and led to take no mean delight in piety, while at the same time they will be powerfully excited to return the affection of a pious parent, whom they find making his children, for their own sake, the objects of so much solicitude.

And certainly were there no other advantage arising from infant baptism, all prudent persons will acknowledge this to be exceedingly important: that it imposes upon parents the most sacred obligations to take heed that their children, whom they have so deliberately devoted to God, shall by instruction, correction, and example be carefully educated in the mysteries of the Christian religion and in true holiness of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant</cite>, (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 170.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

ml&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1231f8e8f6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/04/18/herman-witsius-on-baptism-and-the-duty-to-raise-children-for-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>After this Examination of the Convert, this following Prayer was made.

O Eternal God, how wonderful art thou in thy works! Thou hast been found by those who have not sought thee; Thy grace hath prevented their thoughts. It is neither from him that willeth, nor from him that runneth, but from thy mercy alone that Salvation doth proceed. It is neither from the West, nor from the East, but from thy wonderful dispensation; when it pleaseth thee, thou stretchest forth thy arm from the height of Heavens to the bottom of the Abyss, to pluck out those who were already on the brink of Hell; O God who hast commanded that light should shine in the midst of darkness, enlighten the flames of thy truth amongst those who do lie in the valley of the shade of Death, that the most barbarous people may see the ways &amp; traces of thy Christ; that the pavilions of Ismael, and of Midian may be shaken, that the sheep which are not yet in thy fold may henceforth be brought into it.

Behold here a Soul which prostrates it self at thy feet to be washed in the blood of thy holy Son Jesus, in the blood of that sprinkling which speaketh for Sinners; be pleased to pardon this poor Sinner that is here present; pardon the faults committed by him in the time of his ignorance; cause thou the Scales to fast from his eyes. Create in him a new heart, that being a new Creature he may walk in righteousness and holiness. Cause thou that the Baptism which according to thy ordinance we do confer upon him be effectual to his salvation, that it may redound to the glory of thy great name, to the joy of thy Angels, and to the comfort of those who love thy Anointed who is blessed for evermore.

Immediately after this Prayer, the Convert being on his knees was baptized, presented by Monsieur Armand of Caumont Marquis of Montpouillan, and the Lady Adrian de Mayern who were his Godfather and Godmother, from whom he received the name of Armand Adrian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The joyful convert: represented in a short but elegant sermon preached at the baptizing of a Turk, who renouncing the law of Mahomet, and having given abundant satisfaction for the reasons and soundness of his conversion, was baptized in the French Church May 2. 1658. the Marquis of Montpouillian, a</cite>, (London: I. Leach, 1658), pp 22-24.</span></figcaption>

</figure><figure class="quote" id="q-57b8921a84" data-kw="">
<blockquote><p>Observation 3. It was the way of God from the beginning to take children of covenanters into the same covenant with their parents. So He dealt with this people in the establishment of the first covenant, and He has made no alteration herein in the establishment of the second.</p></blockquote>

</figure><figure class="quote" id="q-4183cc29c4" data-kw="">
<blockquote><p>Lastly we say again, that the reason why Christ gave his Disciples no express or peculiar command concerning baptizing infants, but included them in the general, was because the Apostles were so well acquainted with children’s reception into the Church-privileges, and sealing into the same, that they could not reasonably make any question of baptizing infants, having a general command to baptize all Nations, infants being under the Law circumcised; and knowing moreover that the grace of God was not more strict or restrained in the new Testament then in the old; but contrarywise, more diffused or large; and therefore a greater and more difficult question might have been concerning the baptism of women, there being neither analogy from circumcision, nor particular precept to induce them to baptize them; but that they knew that the general precept was authority sufficient, without specifying particulars in terminis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anabaptism Routed: Or, A Survey of the Controverted Points</cite>, (London: Thomas Johnson, 1655), p. 72.</span></figcaption>

<blockquote><p>This title by conquest, through the people’s after consent, may be turned into a just title, as in the case of the Jews in Caesar’s time, for which cause our Savior commanded to obey Caesar, and to pay tribute unto him… 2. Though the consent be some way over-awed [by intimidation], yet is it a sort of contract and covenant of loyal subjection made to the conqueror, and therefore sufficient to make the title just; otherwise, if the people never give their consent, the conqueror, domineering over them by violence, has no just title to the crown.</p></blockquote>

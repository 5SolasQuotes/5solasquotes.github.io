<main class="wrap"><figure class="quote" id="q-a56a3eb37c" data-kw="">
<blockquote><p>In point of purity. Other creatures admit of some defiling mixtures, the sun doth not. It looks upon filth, but contracts none. Christ is a lamb without blemish, and without spot. Such as cast aspersions upon him in the days of his flesh, calling him glutton, winebibber, and friend of Publicans and sinners, did but act the mad man’s part, throwing dirt at the Sun, which none could possibly fasten upon.

He came indeed into a sinful world, but as a Physician among his sick patients, to cure them without taking the sickness of them, being antidoted by his Divinity against all infection. He hath an hand even in sinful acts; as they are acts (for in him we move) but not in the sinfulness of them: shines into the noisome dunghills of our hearts with beams of grace, yet continues most pure. He was borne of a sinner, lived and conversed with sinners, dyed with and for sinners, yea as a sinner, yet had not in himself the least sin of his own to answer for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-arrowsmith.html">John Arrowsmith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A great wonder in heaven, or, A lively picture of the militant church drawn by a divine pencil: Revel. 12, 1, 2: discoursed on in a sermon preached before the honourable House of Commons, at Margaret’s, Westminster, on the last monthly fast-day, January 27, 1646/7</cite>, (London: Samuel Man, 1647), p. 10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e89d99559d" data-kw="">
<blockquote><p>The determining influence of the federal theology is also obvious upon the doctrine of Vocation. The elect seed of Christ who were represented by him in the impetration of redemption must in time be called into spiritual and living union with him as their head, or his obedience unto death would prove an utter failure. But they are in themselves spiritually dead, in consequence of the breach of the covenant of works by their first representative. The vocation must, therefore, of necessity, be accomplished by almighty and creative power. Such power is efficacious and irresistible.

Nothing, before it is created, can resist the power which calls it into existence. The dead cannot resist the power that raises them. This power which calls the elect from spiritual death into vital union with their federal head is Grace. The doctrine of efficacious, irresistible grace is thus briefly but conclusively established by the requirements of the federal system.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Federal Theology: Its Import and its Regulative Influence in Memorial Volume of the Semi-Centennial of the Theological Seminary at Columbia, South Carolina</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling.html">Effectual Calling</a></span></div>

</figure><figure class="quote" id="q-feec0879c4" data-kw="">
<blockquote><p>If the things themselves are promised in the covenant, then all those with whom this covenant is made must be really and effectually made partakers of them. But this is not so; they are not all actually sanctified, pardoned, and saved, which are the things here promised.&#x27; Ans. The making of this covenant may be considered two ways:

1. As unto the preparation and proposition of its terms and conditions.

2. As unto the internal stipulation between God and the souls of men. In this sense alone God is properly said to make this covenant with any. The preparation and proposition of laws are not the making of the covenant. And therefore all with whom this covenant is made are effectually sanctified, justified, and saved.</p></blockquote>

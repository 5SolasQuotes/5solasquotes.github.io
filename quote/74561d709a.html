<main class="wrap"><figure class="quote" id="q-74561d709a" data-kw="">
<blockquote><p>Thus he will have images adored with the same worship that is given to God: But I answer: 1. if he shall kiss that creature and direct religious bowing toward it, and through that external religious act, convey his worship to God, and give no other external adoration and sign of heart submission to God, then that which is tied and alligated of purpose to that fair creature, as Papists and Jews did of old, who kissed the calves and fell down before the images (as Isa. 44:17, which yet were but memorials of Jehovah teaching them of Iehovah, Isa. 40:18; 46:6-7; Hab. 2:18-19), such a one should also worship that fair creature.</p></blockquote>

<blockquote><p>Fourthly a confusion of gestures lawful, and unlawful is brought into the Lord’s table, some sitting like guests at a feast, as Christ, and his apostles sat, others like supplicants kneeling, and adoring upon their knees. This confusion is not like that variety of gesture in time of prayer, when some sit, some stand, some kneel. For all the three gestures are there indifferent. But not so here; this confusion of gestures at the Lord’s table now is permitted only for a snare to bring thy feet within the grin. For when all are brought in, then will the formalists cry out, ‘Confusion of gestures is intolerable, uniformity and conformity is necessary,’ as Doctor Sparke does in his persuasion to uniformity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute upon Communicating at our Confused Communions (Amsterdam, 1624), ch. 5, ‘Of Kneeling in the Act of Receiving the Sacramental Elements’</cite>, pp. 70-71</span></figcaption>

</figure><figure class="quote" id="q-cf76906b88" data-kw="">
<blockquote><p>But the more private the duties of worship are, the greater latitude is indulged in the external part, or signs of reverence and honor. For though these outward expressions, compositions, or gestures of the body, be the genuine effects of that inward reverence of the mind, and so due to the divine Majesty, yet it is with special reference unto men, that others may see how God is and ought to be feared of his saints. So that such things which are necessary in public worship, are not alway so necessary in private or secret; and that which a person finds to be most advantageous to the right performance of his worship in secret, may not be so expedient in public, because there is not the like reason in both.</p></blockquote>

</figure><figure class="quote" id="q-567618cbef" data-kw="">
<blockquote><p>1. Bowing of the knee, physically or civilly, is indifferent and is not adoration: for we bow to kings, and artificers may bow the knee to drive a nail in a bed, and yet are not adoring; but religious adoration, whether ye will or not, by nature’s impression, is a religious note of religious submission. 2. I consider four acts of the soul that may convey external adoration: 1. One of the mind, a consideration of the excellency of what we adore; 2. A will to submit to this excellency; 3. The judgments diting this to be honest to submit; 4. A purpose or intention habitual or actual of adoring; many of these may be where there is no adoring: and the religious external bowing of the body is essentially adoring, when that bowing is in a state of worship: kneeling before consecrated elements for reverence of either God or the elements, must be adoration, though we should wash it with foul water and say that there is no intention to tender God’s glory to these elements. 3. Let it be considered what is said by the Jesuit Joannes de Lugo, the Pope’s professor at Rome, which I propound with some change: 1. There is a purpose of external adoring, with an inward submission of the heart; whether this be an habitual or actual intention, it is sure it is an adoration when it comes forth in a gesture of adoring. 2. A will to bow the body in scorn and derision, as the soldiers bowed the knee before Jesus; and this being not in a state of worshipping, but in a state and case of disgracing, is not religious bowing or adoration: This is not a natural expression of inward submission, but rather of disgrace. 3. There is a willed or voluntary religious bowing for fear, for gain, or for glory; yet without any internal estimation of the excellency of the thing adored. This Suarez denies to be worshipping, it being only a feigning of worship, not a worshipping. 4. If religious kneeling require that we intend to worship everything before which, as an object, we do religiously kneel, then religious kneeling should not signify internal submission of the heart by nature’s impression or divine institution, but by the voluntary and the free institution of him that kneels: But this latter is absurd, for if kneeling should signify what it does signify by our free and voluntary appointment, then we might: 1. Put upon natural gestures what signification we pleased, and were not to stand to the signification which God and nature have put upon kneeling. 2. So it were in man’s power to impose upon religious kneeling to God civil courtesy, such as a subject expresses to his prince, or a son to his father; and it were free to us to kneel to a stock, and that religiously, and yet put upon kneeling the negative reverence that we give to the Bible; and it were in the three children’s will to kneel to Nebuchadnezzar’s image, and impose this signification on the gesture, that they were kneeling to God only, all which are manifestly false: so Field says kneeling has institution from the instinct of nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford-s-considerations.html">Rutherford’s Considerations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646), ch. 1, question 5, section 1</cite>, pp. 145-47</span></figcaption>

line · Reformed Books Online</a></div>

<blockquote><p>And as for his [Jesus’] gesture in teaching, that He sat down, it was their custom in these times, and a testimony of the respect that is due to them that carry the mind of God; and we find Christ sometime[s] preach[ing] sitting, Lk. 4:20-21, sometime standing, Jn. 7:37, and at this time his weariness with night watching might call for it. Nor is it much to be stood upon which of these gestures men use in preaching, but preachers ought in these things [to] accommodate themselves to seek the benefit of hearers and that they be heard and seen by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, According to John (London, 1657) | on John</cite>, 8:1-2</span></figcaption>

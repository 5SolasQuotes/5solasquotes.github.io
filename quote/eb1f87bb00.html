<main class="wrap"><figure class="quote" id="q-eb1f87bb00" data-kw="">
<blockquote><p>XI. The mode is twofold, according to a twofold respect; for it can be considered either with regard to the instruments which God uses for efficacious vocation, or with regard to the power and acting efficacy of the instruments. XII. As an instrument, He uses his word (Rom. 10:16), and that of both the Law and the Gospel, in different ways: by the former, indeed, preparing the way for the efficacy of vocation (Gal. 3:24), and by the latter, perfecting the same in the called (Rom. 1:16). XIII. This is also sometimes extraordinary, and God acts beyond the accustomed manner, so that what He is accustomed to effect together with the word, He produces without its help or assistance, administering the matter by the revelation and efficacy of his Spirit alone (Acts 9:3-6). XIV. The efficacy of this instrument, and its entire power in producing the effect, depends on the Holy Spirit and his interior operation in the soul (Acts 16:14). It gives to this vocation its formal character, by which it is distinguished from that general call which is common even to the reprobate, so much so that if the Spirit of God did nothing more here than there, it would not be efficacious, but would be vain for salvation (2 Pet. 1:3). XV. Just as, on the contrary, if He should operate here as He is accustomed to do in the conversion of the elect (for even in the reprobate He is often efficacious in some manner and degree) (Mt. 13:20), the effect would necessarily exist, and the man would necessarily be brought to obedience and to a new life in Christ (John 6:44-45).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), pp. 3-4</span></figcaption>

</figure><figure class="quote" id="q-9ff29c0ec7" data-kw="">
<blockquote><p>How this Worship is Correspondent to the Nature of God. The Lord does show it in the fourth of John, verses 23 and 24, saying, the true worshippers, shall worship God in spirit and truth, that is in the Spirit of sanctification dwelling in the mind, helping our infirmities with sighs and groans, which cannot be expressed; and in the truth of his Word dwelling in us in all wisdom and spiritual understanding, such as these the Father requires should worship Him, because God is a Spirit, and they that worship Him, must worship Him in spirit and truth, and not in the ignorance of the mind, nor in the invention and will-worship of man; For this cause the Psalmist says in the 51:6, ‘Thou O Lord lovest truth in the inward affections’; and in the 50th Psalm he says, ‘Offer to God the sacrifice of praise, and pay the vows of the Most High, and call upon God; for the Lord loves truth in the inward parts.’ This is the pure and simple worship of God, without the glory and beauty of outward ceremonies, agreeing with the simple pure essence and nature of God Himself. Consider well Paul’s caveat in the Col. 2:8,18,20-23, warning all men to beware of human wisdom, and deceitful inventions and traditions, according to the rudiments of the world, and not after Christ; the outward show of holiness which puffs up men’s hearts with self-conceit, being burdened with traditions, which having a glorious show of holiness, of wisdom and voluntary religion, wherein men are out of measure superstitious in zeal, not sparing their bodily labor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fenwick.html">William Fenwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exact Enquiry After Ancient Truths, both in Scripture &amp; Fathers, Touching the Subsistence of the Church of God</cite>, … (London, 1643), pp. 2-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-80aa743a1a" data-kw="">
<blockquote><p>…in the use of all indifferencies, in our meals, in our feastings, and merry meetings, in our journeys, in our ordinary talk, and discourse, in our walks, in the actions of our ordinary vocations: Indeed the rule of God’s Word does not at all either command, or forbid the matter of such actions: but the manner of performing them comes under the rule: They are all to be done to the glory of God, in the name of Christ: every good creature is to be sanctified by the Word, and prayer: That command which God gave Abraham (to walk before Him [Gen. 17:1]) is not to be straitened unto the ordinances of God, but to be extended unto all deliberate acts of a man’s life and conversation, Gen. 17:1. Zechariah (in his prophecy of the general call or conversion of Jews, and gentiles) gives this for one character of such, as shall be converted, that they shall have a sacred and sanctified use of things common and indifferent: ‘In that day shall there be upon the bells of their horses, holiness unto the Lord, yea, every pot in Jerusalem and Judah shall be holiness unto the Lord of Hosts,’ Zech. 14:20-21. Not only acts of immediate worship, but all rationall actions, whatsoever, should be offered up as spiritual sacrifices acceptable unto God by Jesus Christ, 1 Pet. 2:5. The apostle exhorts the Romans to salute one another with a holy kiss, Rom. 16:16, this kiss was no religious rite in God’s worship, but a ceremony of civility; and therefore in itself a thing indifferent: And yet the apostle requires holiness for the qualification of it: All our civil actions ought to be such, as becomes saints; that is, so far forth holy for manner, that they be free from sin, and unto the glory of God: Indeed this is a strictness impossible unto lapsed man: But though we cannot exactly and perfectly observe it, yet we may sincerely and cordially endeavor it:</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…in the use of all indifferencies, in our meals, in our feastings, and merry meetings, in our journeys, in our ordinary talk, and discourse, in our walks, in the actions of our ordinary vocations: Indeed the rule of God’s Word does not at all either command, or forbid the matter of such actions: but the manner of performing them comes under the rule: They are all to be done to the glory of God, in the name of Christ: every good creature is to be sanctified by the Word, and prayer: That command which God gave Abraham (to walk before Him [Gen. 17:1]) is not to be straitened unto the ordinances of God, but to be extended unto all deliberate acts of a man’s life and conversation, Gen. 17:1. Zechariah (in his prophecy of the general call or conversion of Jews, and gentiles) gives this for one character of such, as shall be converted, that they shall have a sacred and sanctified use of things common and indifferent: ‘In that day shall there be upon the bells of their horses, holiness unto the Lord, yea, every pot in Jerusalem and Judah shall be holiness unto the Lord of Hosts,’ Zech. 14:20-21. Not only acts of immediate worship, but all rationall actions, whatsoever, should be offered up as spiritual sacrifices acceptable unto God by Jesus Christ, 1 Pet. 2:5. The apostle exhorts the Romans to salute one another with a holy kiss, Rom. 16:16, this kiss was no religious rite in God’s worship, but a ceremony of civility; and therefore in itself a thing indifferent: And yet the apostle requires holiness for the qualification of it: All our civil actions ought to be such, as becomes saints; that is, so far forth holy for manner, that they be free from sin, and unto the glory of God: Indeed this is a strictness impossible unto lapsed man: But though we cannot exactly and perfectly observe it, yet we may sincerely and cordially endeavor it:”

— Henry Jeanes, A Treatise concerning the Indifferency of Human Actions in A Second Part of The Mixture of Scholastical Divinity with Practical in Several Tractates (1660), pp. 58-59">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6in+the+use+of+all+indifferencies%2C+in+our+meals%2C+in+our+feastings%2C+and+merry+meetings%2C+in+our+journeys%2C+in+our+ordinary+talk%2C+and+discourse%2C+in+our+walks%2C+in+the+actions+of+our+ordinary+vocations%3A+Indeed+the+rule+of+God%E2%80%99s+Word+does+not+at+all+either+command%2C+or+forbid+the+matter+of+such+actions%3A+but+the+manner+of+performing+them+comes+under+the+rule%3A+They+are+all+to+be+done+to+the+glory+of+God%2C+in+the+name+of+Christ%3A+every+good+creature+is+to+be+sanctified+by+the+Word%2C+and+prayer%3A+That+command+which+God+gave+Abraham+%28to+walk+before+Him+%5BGen.+17%3A1%5D%29+is+not+to+be+straitened+unto+the+ordinances+of+God%2C+but+to+be+extended+unto+all+deliberate+acts+of+a+man%E2%80%99s+life+and+conversation%2C+Gen.+17%3A1.+Zechariah+%28in+his+prophecy+of+the+general+call+or+conversion+of+Jews%2C+and+gentiles%29+gives+this+for+one+character+of+such%2C+as+shall+be+converted%2C+that+they+shall+have+a+sacred+and+sanctified+use+of+things+common+and+indifferent%3A+%E2%80%98In+that+day+shall+there+be+upon+the+bells+of+their+horses%2C+holiness+unto+the+Lord%2C+yea%2C+every+pot+in+Jerusalem+and+Judah+shall+be+holiness+unto+the+Lord+of+Hosts%2C%E2%80%99+Zech.+14%3A20-21.+Not+only+acts+of+immediate+worship%2C+but+all+rationall+actions%2C+whatsoever%2C+should+be+offered+up+as+spiritual+sacrifices+acceptable+unto+God+by+Jesus+Christ%2C+1+Pet.+2%3A5.+The+apostle+exhorts+the+Romans+to+salute+one+another+with+a+holy+kiss%2C+Rom.+16%3A16%2C+this+kiss+was+no+religious+rite+in+God%E2%80%99s+worship%2C+but+a+ceremony+of+civility%3B+and+therefore+in+itself+a+thing+indifferent%3A+And+yet+the+apostle+requires+holiness+for+the+qualification+of+it%3A+All+our+civil+actions+ought+to+be+such%2C+as+becomes+saints%3B+that+is%2C+so+far+forth+holy+for+manner%2C+that+they+be+free+from+sin%2C+and+unto+the+glory+of+God%3A+Indeed+this+is+a+strictness+impossible+unto+lapsed+man%3A+But+though+we+cannot+exactly+and+perfectly+observe+it%2C+yet+we+may+sincerely+and+cordially+endeavor+it%3A%E2%80%9D%0A%0A%E2%80%94+Henry+Jeanes%2C+A+Treatise+concerning+the+Indifferency+of+Human+Actions+in+A+Second+Part+of+The+Mixture+of+Scholastical+Divinity+with+Practical+in+Several+Tractates+%281660%29%2C+pp.+58-59&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F80aa743a1a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/80aa743a1a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=in%20the%20use%20of%20all%20indifferencies,may%20sincerely%20and%20cordially%20endeavor%20it&amp;text=in%20the%20use%20of%20all%20indifferencies%2C%20in%20our&amp;text=yet%20we%20may%20sincerely%20and%20cordially%20endeavor%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

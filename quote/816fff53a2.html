<main class="wrap"><figure class="quote" id="q-816fff53a2" data-kw="">
<blockquote><p>There may be a treaty about marriage, a proposal of terms, a wooing a long time, but ’tis a mutual consenting and engaging each to other that makes the marriage union; So it is in our union with Christ, there may be frequent offers, an earnest wooing, but it is consenting that makes the match between us and Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/owen-stockton.html">Owen Stockton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Best Interest, or a Treatise of a Saving Interest in Christ (London: Parkhurst, 1682), ch. 3 Stockton (1630–1680) was an English puritan.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4738b8d808" data-kw="">
<blockquote><p>For as children ought to have the consent of their careful parents, and not to dare to bestow themselves without their advice, which practice we see in the very gentiles, as appeareth in Euripides, where Hermione answereth Orestes, desiring of her a promise of marriage (Eurip., in Andromacha): ‘Sponsaliorum meorum pater meus curam habebit, non est meum statuere hoc;’ That is: ‘It lyeth not in my hand at all myself for to contract: Unto my father’s care and power, I must refer that act:&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Fourth Book of Moses, Called Numbers (London, 1618)</cite>, p. 1,257</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-fecf99c6a7" data-kw="">
<blockquote><p>The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr. [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615)</cite>, pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-515bc6a4a5" data-kw="">
<blockquote><p>We see this in marriage, published in the face of the Church, solemnized by consent of parties and parents, ratified by the action of the minister, and celebrated in the presence of many friends; the knot cannot be untied, no not by agreement of the parents, of the parties, of the minister, of the friends, and of the whole congregation, because marriage is not of the nature of a civil contract, but God is a party and hath a special hand in it, and whom God hath joined together let no man put asunder, or separate again without his consent. (Mt. 19:6)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersol.html">William Attersol</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Numbers, ch. 30</cite>, pp. 704-5</span></figcaption>

</figure><figure class="quote" id="q-08bf918eb7" data-kw="">
<blockquote><p>…for here [at the Jerusalem Council] that not only the doctrinal power was to be used, but beside that: 1. the schism was to be removed, and the authority of the synod to be used against the willfulness and obstinacy of those obtruders of circumcision, in rebuking them as perverters of souls. 2. For the scandal which might have been taken if the Gentiles should have eaten blood and things strangled, and meats offered to idols, and therefore the apostles and elders behoved, as a convened synod to forbid a grievous scandal and a spiritual homicide against the Law of nature, to wit, that the gentiles for fear of scandalizing weak. believers amongst the Jews, should abstain from the practice of some things at this time merely indifferent in their nature, though not indifferent in their use, such as were to eat things offered to idols, things strangled and blood:</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6fb58ae13f" data-kw="">
<blockquote><p>Beware of separating new lights; to separate from, or gather Churches out of the true reformed or reforming Churches, has not the least warrant from the Word of God: When we see this or that amiss in a Church we are bidden exhort one another, and provoke one another to good, but not to separate, Heb. 10:24-25. Zwingli conferred amicably with the Anabaptists in Zurich as with dissenting brethren; and no course was taken to suppress or restrain them by the secular power, till they grew to gather Churches out of the true reformed Churches: But when it came to that, they could not be suffered or forborne, it was thought necessary to restrain them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d6edf4bb27" data-kw="">
<blockquote><p>For some say they [presbyterians] are not to do so [practice occasional communion] because we are bound always to do that in the worship of God which is best, and there cannot be two bests. Therefore since they judge their own way to be best, they ought always to go in it and never to join with any others, neither with the Church by law established [in England], or any others. This is somewhat plausible, seems a strong argument to some, but is far from it. For persons and churches that are better than others are to own others, if built on the true foundation, and [are] to impose no intolerable things for true, though [on] distempered churches, and to strive to hold an outward communion with them, the stronger and better with the weaker, and (much more) the weaker [ought to hold outward communion] with the better and stronger. Therefore the presbyterians think themselves bound to join sometimes with the conformists, though they judge their own way better than theirs; and that in doing so sometimes, they do that which is best.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-tallents.html">Francis Tallents</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short History of Schism: for the Promoting of Christian Moderation &amp; the Communion of Saints</cite>, (London: Parkhurst, 1705) 128 pp. ToC, p. 110</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-5aea7a6f3c" data-kw="">
<blockquote><p>That no minister shall, upon any occasion, testify from the pulpit against any act of Assembly, be it never so sinful; or against any of the proceedings of the judicatories, be they never so unwarrantable.” (See 1st Testimony, p. 82) For there was far more ground to make their inference from the act of Assembly 1638, than from the act of Assembly 1733; and so all our worthy ancestors from that day, and the Brethren themselves, according to their argument, have been living in a Church in which there was a very sinful term of communion required of them; and yet they never complained of it, nor have they given the least testimony against it. But further, the above Act 1733, relating to these Brethren, being materially rescinded, as was shown above, this objection, even as to them, falls to the ground. But then, as to the second alleged sinful term of communion, viz. “That no minister, or member of this Church shall protest against acts, sentences or decisions of the supreme judicatory, etc.</p></blockquote>

<blockquote><p>We are no Brownists, to think a church can be perfect in this life and must be deserted for faults, but it is sin to be coagents with the errors of a church. Howbeit we lie in one bed with our mother kirk and touch her whole skin, yet it is a sinful society to lay our skin to her boils and scabs.</p></blockquote>

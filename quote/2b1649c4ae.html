<main class="wrap"><figure class="quote" id="q-2b1649c4ae" data-kw="">
<blockquote><p>30. It is said by some very learned and reverend men, that God freely made the world, though He necessarily made it good; He freely made positive laws, though He necessarily made them wisely and just; He freely annexes threatenings to his laws, though necessarily they are just threatenings; He freely sentences or judges, though He necessarily judge justly; He freely executes his sentence by punishing, though He necessarily punish justly. And the reasons given, are: 1. Because God executes his sentence as Dominus [Lord]. 2. Because his threatenings bind Him not to punish, but man to suffer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/various.html">Various</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter, The Unreasonableness of Infidelity (London: R.W., 1655), An Advertisement Explicatory</cite>, p. xvi</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/holiness-and-justice.html">Holiness and Justice</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-28a89c8f51" data-kw="">
<blockquote><p>13. Again (2) The Scripture every where points out the end of Christ’s coming and dying to have been to procure and obtain some good to man; it were endless to cite the Scriptures speaking this out plainly: But if it had been only to have procured a possibility, then the proper and immediate end of his dying had been only to have procured something to God, viz. a power to Him, that He might, without hurt to his justice, prescribe a possible way of salvation. Now, not to discuss that question agitated among orthodox divines, viz. whether it was impossible for God to have pardoned the sins of man without a satisfaction made by his Son, or not; meaning antecedently to a decree, determining this way of manifestation of the justice of God; only I must say that as yet I can see nothing from Scripture determining the egresses of the relative justice of God to be more essential to God, and less subject to the free determinations of his good will and pleasure, than are the egresses of his mercy; nor do I see any necessity for asserting this against the Socinians, seing our ground, walking upon a decree, is proof against all their assaults; far less see I any necessity of founding our whole debate with the Socinians upon that ground; yea I cannot but judge it the result of great imprudence so to do, seeing the Socinians may reply that the sole ground of that opposition to them is not only questioned, but plainly denied by such as we account orthodox and learned; and may hence gather that we have no other solid ground whereupon to debate with them but such as the learned of our own side overthrow. The depth’s of God’s Counsel are beyond our fathoming and it is hard for us to say hithertil the omnipotent can come, but not one ince further. I dare not be wise above what is writen and I would gladly see one passage of Scripture declaring this to have been in itself utterly impossible and inconsistent with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quakerism: the Pathway to Paganism, or a View of the Quakers’ Religion, being an Examination of the Theses &amp; Apology of Robert Barclay, one of their Number... (Edinburgh: Cairns, 1678), ch. 8, ‘Of Universal Redemption’, p. 163 Brown was a disciple of Rutherford.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/holiness-and-justice.html">Holiness and Justice</a></span></div>

</figure><figure class="quote" id="q-8d08e1330a" data-kw="Holiness Author of sin">
<blockquote><p>Though the natural virtue of doing a sinful action be from God, and supported by him, yet this doth not blemish the holiness of God. While God concurs with them in the act, he instills no evil into men. … The physical goodness of the action depends on God, the moral evil on the creature.</p></blockquote>

</figure><figure class="quote" id="q-d5bb7e8c5d" data-kw="">
<blockquote><p>In the past, God had left sins unpunished. He could conceivably be accused of overlooking sin since He had not required punishment for it. Now, however, He has put forth Jesus. This proves that God is just (His wrath required the sacrifice) and that He is the justifier of those who have faith in Jesus (His love provided the sacrifice for them).</p></blockquote>

</figure><figure class="quote" id="q-676e9f803f" data-kw="wrath justice">
<blockquote><p>Since the office of judge and ruler belongs naturally to God, the rectifying right concerning punishment which depends upon it must be essential; and so also avenging justice founded on that. “The wrath of God is revealed from heaven against all ungodliness and unrighteousness of men … who know the judgment of God, that they which commit such things are worthy of death” (Rom. 1:18, 32).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5cf0052172" data-kw="">
<blockquote><p>If sin is taken for an action conflicting with the law, original sin is the first disobedience of Adam, committed by Adam himself, not as he was a singular person, but as he bore the person of the whole human race. But if sin is taken for that which remains in a man after the action, and whence the same man is named not sinning but a sinner, original sin is the lack of original justice, together with a habitual aversion and deordination of the will, which can also be called a stain rendering the will hateful to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Original Sin in Works of Samuel Ward: Theological Determinations, a Treatise on Justification, Lectures on Original Sin</cite>, ed. Seth Ward (d. 1643; London: Gallibrand, 1658), pp. 392-656 trans. AI Latin | Thus, therefore, if it is asked of us what original sin properly is, we respond with Bellarmine:, ch. 13, pp. 537-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><figure class="quote" id="q-a4595f704a" data-kw="Original Sin Author of sin">
<blockquote><p>Although souls are created by God destitute of original righteousness, God cannot on that account be considered the author of sin. It is one thing to infuse impurity; another not to give the purity of which man has rendered himself unworthy in Adam.</p></blockquote>

</figure><figure class="quote" id="q-efc3c1fb98" data-kw="">
<blockquote><p>For you [a Romanist] say that that privation which Adam contracted by sinning, we, by being born, although it is a sin, is yet not our sin nor proper to us, unless because what Adam did when he sinned, we also did, the apostle saying, “In him all have sinned.” [Rom. 5:12] And this also I acknowledge. For his will was ours; and therefore his transgression is ours, because he is not considered as one man, but as the root of the human race, in whom we were all included by virtue [in potency or in power], as Augustine says, “we were all that one man” (De pecc. merit. &amp; remiss., bk. 1, ch. 10). But now original sin does not consist only in the deformity which the fault of Adam brought forth, but it also comprehends the act of that sin itself, if we did the same as Adam did, if we truly sinned with Adam, and what he willed, we willed. Original sin will therefore not be so involuntary as you think, so that it is therefore the least of all sins because it has the least of that which is voluntary. For if Adam’s will was ours, as much as Adam willed, so much are we also to be thought to have willed. But Adam sinned knowingly and willingly; we therefore in him, and by that his will, both have sinned and willed to sin. But unless you admit imputation here (a word from which you abhor and carefully guard yourself), you will fall into the greatest absurdity, and you will fight with yourself, you who a little before said that the sin which entered into the world, and by which we are all made sinners, is not the actual sin of Adam, but a certain iniquity contracted from it and transmitted into us. Now you attribute to us the same will of sinning which was in Adam; otherwise, you affirm, this privation left in nature by sin could not make us sinners. Therefore, we are not only bound by a habitual iniquity, but we have sinned with an actual will in Adam; and this will is primarily to be considered in original sin, without which we could neither be nor be held as sinners. What you [Bellarmine] interpose concerning a pact or precept pertains nothing to the matter; for whether Adam received this justice on this law and condition, that he should either preserve or lose it for himself and his own, or whether no such convention intervened between God and Adam, since he was the parent and origin of the nature and of the human race, it was necessary that in him we either stand or fall. Although, that God threatened him with death if he should move his hand to the forbidden tree, from this it sufficiently appears that he had been forewarned of the danger into which he would cast himself headlong if he should sin, of which nothing was to be feared if he should remain in his duty. And hither is wont to be brought what we read in the prophet: “But they like Adam have transgressed the covenant” (Hos. 6:7). Nor is it to be thought that Adam was ignorant either of the reward, if he should not sin, or of the punishment, if he should dare to sin. Unless this had been foretold to him, he would have had some excuse, although not a sufficient one; now, having been taught before of the event, since he did not have faith nor take care for himself, he is to be thought to have deservedly fallen into this calamity. Although, however, there had been no word on this matter, yet what unhappiness he willingly brings upon himself, God has justly inflicted upon all his posterity. But in what way? Because His will is the norm of right and of justice. You will never otherwise understand it to have been just that we are all born miserable on account of the temerity, or infidelity, or ambition, or whatever fault of the first man. For that you say his will was ours, and we willed in him, I confess to be true, but the reason for this truth is none other than the will of the creator. For what cause will you bring [on your view] why all children do not in the same way atone for the faults of their parents? You will say that Adam is to be considered as the seed and principle of nature, and his sin was the sin of nature itself; the sins of others are personal; therefore his is transfused with nature, not those of others. I hear, and I do not object. But why Adam by sinning destroyed not only his person but nature, when other men harm their own persons but do not make nature worse, assign a cause, if you can, other than the most just will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … (d. 1595; Legat, 1600), bk. 1, ch. 7, pp. 25-26 trans. AI Latin</span></figcaption>

<blockquote><p>That man was the first Adam, who was as a certain common mass or lump, wherein was contained all mankind: which lump being corrupted, we cannot be brought forth into this world, but with corruption and uncleanness. And although Eve transgressed before the man, yet the beginning of sinning is ascribed unto Adam: for that succession is attributed unto men, and not unto women… But this is now the scope of the apostle, to teach out of what thing as from the ground and beginning sin was by propagation traduced into mankind. … For in every sin are two things to be considered. The action or wicked affection, which is as it were the matter: and the offense or obligation to punishment, which they call reatus, that is, guiltiness. And original sin herein differs from those sins which they call actuall, for that in them [actual sins] the matter abides not still. For so soon as a man has either committed adultery, or spoken blasphemy, those actions straightway as soon as the thing is done cease to be, neither are any more extant. Only there remains the offence against God and guiltiness. Wherefore seeing by faith and repentance the obligation unto punishement, or offence against God is remitted, we will easily grant that the whole sin is abolished. But in original sin the consideration is far otherwise: for the matter thereof passes not away. For every one of us has experience in himself, that corruption of nature remains in us: seing that yet also we continually fall into sins, and are both in body and mind untoward to things pertaining to God: which sin yet unto the faithful are not imputed. For the guiltiness and offense against God is in baptism through faith in Christ forgiven, although the matter of sin do still remain. Which matter, although in holy men it be broken and weakened, yet we shall not be perfectly rid thereof, till we be dead. And forasmuch as men-regenerate beget children, not by that they are regenerate, but by nature and the flesh, thereof it comes that the children also of the believers are born obnoxious unto original sin. For into them is poured the same vitiate and corrupt nature that is in the parents: when as yet on the other side, forgivenees or imputation, which are apprehended by faith, cannot be poured into them. For the better explication hereof, Augustine brings two similitudes: One is of grains of corn: which although they are sown into the ground being purged of their leaves, stalks, chaff and ears, yet they spring up again with all these things: which hereof comes to pass, for that that cleansing comes not to those grains by nature, but by the art and industry of men. And forasmuch as the corn springs not of these principles of art and industry, but of nature, it must needs be that when they are sprung up, they follow the order not of human industry but of their own nature. The second similitude is of a man, y• is circumcised: who notwithstanding begets a son with his foreskin. And this hereof comes, for that circumcision was not in the father by nature, but by a certain force added from without. And seing that children are not procreated by that outward force, but by an inward strength of nature, it is of necessity that when they are begotten they follow the order of nature. And therfore we bring forth no other children, but such as we are ourselues. Wherefore seeing we have in us the contagiousness of original sin, they undoubtedly also cannot be without it. But we cannot communicate unto our children the remission and forgiveness of that sin. For, that is to be hoped for at God’s hands only. … Now seeing I have declared what the apostle means by sin, and by which one man, it entered into the world, there remains to consider by what means it was spread abroad. This is a matter obscure and very hard, and therefore I do not think to stand long about it. But forasmuch as the word of God most plainly teaches that such a sin there is, and that it descends into our posterity, although we understand not the manner and way, how it is poured into them, yet we ought to give place unto the truth and not to be too much careful or to trouble ourselues more than needs touching the way and manner, which is hard to be known, and may with out danger be unknown. Howbeit I think it not amiss to declare those ways and means which I have observed amongst the ecclestical writers: whose opinions touching this matter are four in number. The first is of those which thought that we receive of our parents the souls together with the bodies, that even as God by human seed creates the body, so also of the same creates He the soul… Whose arguments… I judge indeed probable: but yet not of necessity… [The second view is not labeled and might be another form of traducianism.] The third way is that God therfore creates the soul with such a sin or defect, for that it shall be the soul of a man now damned, and set under the curse. Such a soul say they, God creates as is required to such a man… this fond device is of every man rejected: lest we should seem to make God absolutely the author of sins. The fourth maner is by the consents of many men received, and seems very likely to be true: namely, that the soul is not created with some [sin], but straightway draws unto it sin so soon as ever it is adjoined unto the body derived from Adam… … ‘For that all men have sinned.’ This might have seemed very sharp and hard, that for the sin only of the first man all men should die. But Paul shows that this is justly done, because all men have sinned. About this particle ᾧ [which is neuter or masculine] which properly signifies in quo, that is, ‘in which,’ and is englished, ‘For that,’ is no small controversy how it ought to be taken. Some will haue it to be referred unto ‘sin’ [previously in Rom. 5:12, namely Adam’s first actual sin, which interpretation lends itself to an immediate imputation]. But the Greek word ἁμαρτία [sin] which went before it, seems to be against that. For it is [in] the feminine gender. Howbeit, it may be that Paul had a respect unto the other word παράπτωμα [offense, in v. 15 ff.], which is [in] the neuter gender, which word he afterward oftentimes uses, although it be counted a fault in speach to refer the relative to things coming after… …[Vermigli discusses the translation “in whom”.] But touching this matter, I will not much contend. For I think that ᾧ is a particle-causal, so that the sense is, Therefore has death gone over all men, because all men have sinned. For Chrisostom says: That when Adam fell, all other men also, which did not eat of the fruit were touched. And he thinks that Paul, as a wise physician, having the disease set before him, abides not in those things which be circumstances about it, or do follow it, but comes to the principal ground and first cause thereof. Therefore do all men die, because all men have sinned. Neither ought we to think that here is meant that all men do sin by some certain action: for that can have no place in children. But it is all one as if he had said, Now they are bondslaves unto sin, and are counted guilty thereof… By those things also which are written unto the Hebrews may be declared, how we have sinned in the fall of Adam. For there we read that Levi paid tenths in the loins of Abraham. After the selfsame manner also may here be understood that we were polluted in the loins and in the mass of Adam… …These things… in very deed… wholly confirm our sentence: wherein we say that Paul in this place takes sin most amply, so that it comprehends both the root, and all the fruits thereof. But I marvel how these men [who advocate for orginal sin being propagated from children’s imitation of their parents] go about to pluck away original vice from the nature of sin. For sin according to the common definition, they say, is whatsoever is spoken, done or thought against the Law of God, and this can have no place in children. But they consider not that in this definition is not all sin uniuersally contained. And therefore we before signified that sin is otherwise to be defined: so that that is said to be sin which any manner of way is against the Law and will of God… But to this we answered before: that the guiltyness indeed is forgiven unto the believers, howbeit the corrupt substance remains: which, if Christ were not a helper unto us, should of his own nature condemn us. For seeing it turns us away from the rule of the Law of God, it ought to be taken to be in very deed sin… ‘Where no law is, sin is not imputed.’ …This imputation or reputation is to be referred unto men, which were so miserable and blind that of themselves they could not so much as know sins, so far were they of that they could beware of sins, so utterly obscure was at that time the light of nature: but God imputed those sins unto them, and that not unworthily: for that blindness happened through their own default. And that God imputed those sins unto them, He Himself many ways declared. For He both by the flood destroyed the whole world, and complained unto Noah that all flesh had corrupted their way, and that the heart of man was prone unto sin even from his childhood. He reproved Cain of murder: and took vengeance upon the Sodomites… ‘That death reigned’ …And he therefore added that ‘death reigned from Adam even to Moses,’ to declare that there was sin in the world. For death and sin follow one the other inseperably: and sin and death infer and bring in one the other. Hereby are confuted those which contend that infants are without sin: and say that for that cause they die, for that by reason of the sin of Adam they are under the condition of mortality, being otherwise themselves innocent and clean from sin.</p></blockquote>

faith+in+Christ+forgiven%2C+although+the+matter+of+sin+do+still+remain.+Which+matter%2C+although+in+holy+men+it+be+broken+and+weakened%2C+yet+we+shall+not+be+perfectly+rid+thereof%2C+till+we+be+dead.+And+forasmuch+as+men-regenerate+beget+children%2C+not+by+that+they+are+regenerate%2C+but+by+nature+and+the+flesh%2C+thereof+it+comes+that+the+children+also+of+the+believers+are+born+obnoxious+unto+original+sin.+For+into+them+is+poured+the+same+vitiate+and+corrupt+nature+that+is+in+the+parents%3A+when+as+yet+on+the+other+side%2C+forgivenees+or+imputation%2C+which+are+apprehended+by+faith%2C+cannot+be+poured+into+them.+For+the+better+explication+hereof%2C+Augustine+brings+two+similitudes%3A+One+is+of+grains+of+corn%3A+which+although+they+are+sown+into+the+ground+being+purged+of+their+leaves%2C+stalks%2C+chaff+and+ears%2C+yet+they+spring+up+again+with+all+these+things%3A+which+hereof+comes+to+pass%2C+for+that+that+cleansing+comes+not+to+those+grains+by+nature%2C+but+by+the+art+and+industry+of+men.+And+forasmuch+as+the+corn+springs+not+of+these+principles+of+art+and+industry%2C+but+of+nature%2C+it+must+needs+be+that+when+they+are+sprung+up%2C+they+follow+the+order+not+of+human+industry+but+of+their+own+nature.+The+second+similitude+is+of+a+man%2C+y%E2%80%A2+is+circumcised%3A+who+notwithstanding+begets+a+son+with+his+foreskin.+And+this+hereof+comes%2C+for+that+circumcision+was+not+in+the+father+by+nature%2C+but+by+a+certain+force+added+from+without.+And+seing+that+children+are+not+procreated+by+that+outward+force%2C+but+by+an+inward+strength+of+nature%2C+it+is+of+necessity+that+when+they+are+begotten+they+follow+the+order+of+nature.+And+therfore+we+bring+forth+no+other+children%2C+but+such+as+we+are+ourselues.+Wherefore+seeing+we+have+in+us+the+contagiousness+of+original+sin%2C+they+undoubtedly+also+cannot+be+without+it.+But+we+cannot+communicate+unto+our+children+the+remission+and+forgiveness+of+that+sin.+For%2C+that+is+to+be+hoped+for+at+God%E2%80%99s+hands+only.+%E2%80%A6+Now+seeing+I+have+declared+what+the+apostle+means+by+sin%2C+and+by+which+one+man%2C+it+entered+into+the+world%2C+there+remains+to+consider+by+what+means+it+was+spread+abroad.+This+is+a+matter+obscure+and+very+hard%2C+and+therefore+I+do+not+think+to+stand+long+about+it.+But+forasmuch+as+the+word+of+God+most+plainly+teaches+that+such+a+sin+there+is%2C+and+that+it+descends+into+our+posterity%2C+although+we+understand+not+the+manner+and+way%2C+how+it+is+poured+into+them%2C+yet+we+ought+to+give+place+unto+the+truth+and+not+to+be+too+much+careful+or+to+trouble+ourselues+more+than+needs+touching+the+way+and+manner%2C+which+is+hard+to+be+known%2C+and+may+with+out+danger+be+unknown.+Howbeit+I+think+it+not+amiss+to+declare+those+ways+and+means+which+I+have+observed+amongst+the+ecclestical+writers%3A+whose+opinions+touching+this+matter+are+four+in+number.+The+first+is+of+those+which+thought+that+we+receive+of+our+parents+the+souls+together+with+the+bodies%2C+that+even+as+God+by+human+seed+creates+the+body%2C+so+also+of+the+same+creates+He+the+soul%E2%80%A6+Whose+arguments%E2%80%A6+I+judge+indeed+probable%3A+but+yet+not+of+necessity%E2%80%A6+%5BThe+second+view+is+not+labeled+and+might+be+another+form+of+traducianism.%5D+The+third+way+is+that+God+therfore+creates+the+soul+with+such+a+sin+or+defect%2C+for+that+it+shall+be+the+soul+of+a+man+now+damned%2C+and+set+under+the+curse.+Such+a+soul+say+they%2C+God+creates+as+is+required+to+such+a+man%E2%80%A6+this+fond+device+is+of+every+man+rejected%3A+lest+we+should+seem+to+make+God+absolutely+the+author+of+sins.+The+fourth+maner+is+by+the+consents+of+many+men+received%2C+and+seems+very+likely+to+be+true%3A+namely%2C+that+the+soul+is+not+created+with+some+%5Bsin%5D%2C+but+straightway+draws+unto+it+sin+so+soon+as+ever+it+is+adjoined+unto+the+body+derived+from+Adam%E2%80%A6+%E2%80%A6+%E2%80%98For+that+all+men+have+sinned.%E2%80%99+This+might+have+seemed+very+sharp+and+hard%2C+that+for+the+sin+only+of+the+first+man+all+men+should+die.+But+Paul+shows+that+this+is+justly+done%2C+because+all+men+have+sinned.+About+this+particle+%E1%BE%A7+%5Bwhich+is+neuter+or+masculine%5D+which+properly+signifies+in+quo%2C+that+is%2C+%E2%80%98in+which%2C%E2%80%99+and+is+englished%2C+%E2%80%98For+that%2C%E2%80%99+is+no+small+controversy+how+it+ought+to+be+taken.+Some+will+haue+it+to+be+referred+unto+%E2%80%98sin%E2%80%99+%5Bpreviously+in+Rom.+5%3A12%2C+namely+Adam%E2%80%99s+first+actual+sin%2C+which+interpretation+lends+itself+to+an+immediate+imputation%5D.+But+the+Greek+word+%E1%BC%81%CE%BC%CE%B1%CF%81%CF%84%CE%AF%CE%B1+%5Bsin%5D+which+went+before+it%2C+seems+to+be+against+that.+For+it+is+%5Bin%5D+the+feminine+gender.+Howbeit%2C+it+may+be+that+Paul+had+a+respect+unto+the+other+word+%CF%80%CE%B1%CF%81%CE%AC%CF%80%CF%84%CF%89%CE%BC%CE%B1+%5Boffense%2C+in+v.+15+ff.%5D%2C+which+is+%5Bin%5D+the+neuter+gender%2C+which+word+he+afterward+oftentimes+uses%2C+although+it+be+counted+a+fault+in+speach+to+refer+the+relative+to+things+coming+after%E2%80%A6+%E2%80%A6%5BVermigli+discusses+the+translation+%E2%80%9Cin+whom%E2%80%9D.%5D+But+touching+this+matter%2C+I+will+not+much+contend.+For+I+think+that+%E1%BE%A7+is+a+particle-causal%2C+so+that+the+sense+is%2C+Therefore+has+death+gone+over+all+men%2C+because+all+men+have+sinned.+For+Chrisostom+says%3A+That+when+Adam+fell%2C+all+other+men+also%2C+which+did+not+eat+of+the+fruit+were+touched.+And+he+thinks+that+Paul%2C+as+a+wise+physician%2C+having+the+disease+set+before+him%2C+abides+not+in+those+things+which+be+circumstances+about+it%2C+or+do+follow+it%2C+but+comes+to+the+principal+ground+and+first+cause+thereof.+Therefore+do+all+men+die%2C+because+all+men+have+sinned.+Neither+ought+we+to+think+that+here+is+meant+that+all+men+do+sin+by+some+certain+action%3A+for+that+can+have+no+place+in+children.+But+it+is+all+one+as+if+he+had+said%2C+Now+they+are+bondslaves+unto+sin%2C+and+are+counted+guilty+thereof%E2%80%A6+By+those+things+also+which+are+written+unto+the+Hebrews+may+be+declared%2C+how+we+have+sinned+in+the+fall+of+Adam.+For+there+we+read+that+Levi+paid+tenths+in+the+loins+of+Abraham.+After+the+selfsame+manner+also+may+here+be+understood+that+we+were+polluted+in+the+loins+and+in+the+mass+of+Adam%E2%80%A6+%E2%80%A6These+things%E2%80%A6+in+very+deed%E2%80%A6+wholly+confirm+our+sentence%3A+wherein+we+say+that+Paul+in+this+place+takes+sin+most+amply%2C+so+that+it+comprehends+both+the+root%2C+and+all+the+fruits+thereof.+But+I+marvel+how+these+men+%5Bwho+advocate+for+orginal+sin+being+propagated+from+children%E2%80%99s+imitation+of+their+parents%5D+go+about+to+pluck+away+original+vice+from+the+nature+of+sin.+For+sin+according+to+the+common+definition%2C+they+say%2C+is+whatsoever+is+spoken%2C+done+or+thought+against+the+Law+of+God%2C+and+this+can+have+no+place+in+children.+But+they+consider+not+that+in+this+definition+is+not+all+sin+uniuersally+contained.+And+therefore+we+before+signified+that+sin+is+otherwise+to+be+defined%3A+so+that+that+is+said+to+be+sin+which+any+manner+of+way+is+against+the+Law+and+will+of+God%E2%80%A6+But+to+this+we+answered+before%3A+that+the+guiltyness+indeed+is+forgiven+unto+the+believers%2C+howbeit+the+corrupt+substance+remains%3A+which%2C+if+Christ+were+not+a+helper+unto+us%2C+should+of+his+own+nature+condemn+us.+For+seeing+it+turns+us+away+from+the+rule+of+the+Law+of+God%2C+it+ought+to+be+taken+to+be+in+very+deed+sin%E2%80%A6+%E2%80%98Where+no+law+is%2C+sin+is+not+imputed.%E2%80%99+%E2%80%A6This+imputation+or+reputation+is+to+be+referred+unto+men%2C+which+were+so+miserable+and+blind+that+of+themselves+they+could+not+so+much+as+know+sins%2C+so+far+were+they+of+that+they+could+beware+of+sins%2C+so+utterly+obscure+was+at+that+time+the+light+of+nature%3A+but+God+imputed+those+sins+unto+them%2C+and+that+not+unworthily%3A+for+that+blindness+happened+through+their+own+default.+And+that+God+imputed+those+sins+unto+them%2C+He+Himself+many+ways+declared.+For+He+both+by+the+flood+destroyed+the+whole+world%2C+and+complained+unto+Noah+that+all+flesh+had+corrupted+their+way%2C+and+that+the+heart+of+man+was+prone+unto+sin+even+from+his+childhood.+He+reproved+Cain+of+murder%3A+and+took+vengeance+upon+the+Sodomites%E2%80%A6+%E2%80%98That+death+reigned%E2%80%99+%E2%80%A6And+he+therefore+added+that+%E2%80%98death+reigned+from+Adam+even+to+Moses%2C%E2%80%99+to+declare+that+there+was+sin+in+the+world.+For+death+and+sin+follow+one+the+other+inseperably%3A+and+sin+and+death+infer+and+bring+in+one+the+other.+Hereby+are+confuted+those+which+contend+that+infants+are+without+sin%3A+and+say+that+for+that+cause+they+die%2C+for+that+by+reason+of+the+sin+of+Adam+they+are+under+the+condition+of+mortality%2C+being+otherwise+themselves+innocent+and+clean+from+sin.%E2%80%9D%0A%0A%E2%80%94+Peter+Martyr+Vermigli%2C+Most+Learned+%26+Fruitful+Commentaries+of+Dr.+Peter+Martyr+Vermilius...+%28d.+1562%3B+London%3A+1568%29%2C+Commentary+on+Romans%2C+ch.+5+%7C+On+Rom.+5%3A12%2C+pp.+110-14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F158d671e11.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/158d671e11.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-mediate-imputation-of-adams-original-sin/#:~:text=That%20man%20was%20the%20first%20Adam,themselves%20innocent%20and%20clean%20from%20sin&amp;text=That%20man%20was%20the%20first%20Adam%2C%20who%20was&amp;text=being%20otherwise%20themselves%20innocent%20and%20clean%20from%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

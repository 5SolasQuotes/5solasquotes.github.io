<blockquote><p>We may learn that our religion is an experimental religion; it is a discovery of a saving remedy to perishing sinners, a remedy that is all power, and works many effects that may be, nay, that must be felt. Well then, if ye have no experience of the power of the death of Christ to those ends mentioned, ye are no Christians. Notions of truth make no man such, it is experience of the power of God, and sight, conviction of the wisdom of God herein, that does. The kingdom of God is not in work, but in power. …

Is Christ the power of God to salvation? O labour for experimental acquaintance with this power; power may be felt, let it be seen by your life that Christ is power, and that you have an interest in it; seek an experience of it this night for quickening grace, love, faith, repentance, and killing sin, and this will prepare you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communion Sermons (1770) in Faith and Justification</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2763b92bb8" data-kw="">
<blockquote><p>That direction, in this kind, which with me is instar omnium, is for a diligent endeavour to have the power of the truths professed and contended for abiding upon our hearts, that we may not contend for notions, but what we have a practical acquaintance with in our own souls. When the heart is cast indeed into the mould of the doctrine that the mind embraceth; when the evidence and necessity of the truth abides in us; when not the sense of the words only is in our heads, but the sense of the things abides in our hearts; when we have communion with God in the doctrine we contend for, — then shall we be garrisoned, by the grace of God, against all the assaults of men.

And without this all our contending is, as to ourselves, of no value. What am I the better if I can dispute that Christ is God, but have no sense or sweetness in my heart from hence that he is a God in covenant with my soul? What will it avail me to evince, by testimonies and arguments, that he hath made satisfaction for sin, if, through my unbelief, the wrath of God abideth on me, and I have no experience of my own being made the righteousness of God in him, — if I find not, in my standing before God, the excellency of having my sins imputed to him and his righteousness imputed to me?

Will it be any advantage to me, in the issue, to profess and dispute that God works the conversion of a sinner by the irresistible grace of his Spirit, if I was never acquainted experimentally with the deadness and utter impotency to good, that opposition to the law of God, which is in my own soul by nature, with the efficacy of the exceeding greatness of the power of God in quickening, enlightening, and bringing forth the fruits of obedience in me? It is the power of truth in the heart alone that will make us cleave unto it indeed in an hour of temptation.

Let us, then, not think that we are any thing the better for our conviction of the truths of the great doctrines of the gospel, for which we contend with those men, unless we find the power of the truths abiding in our own hearts, and have a continual experience of their necessity and excellency in our standing before God and our communion with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 52.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/spiritual-duties.html">Spiritual Duties</a></span></div>

</figure><figure class="quote" id="q-f1d8bc290b" data-kw="">
<blockquote><p>Therefore, although the Romanists in their hypothesis [about Transubstantiation] do not intend to worship the bread, but Christ (whom they believe to be there in place of the bread), they are not on that account the less to be considered as really adoring the bread. This false hypothesis and erroneous intention arises from an induced and voluntary ignorance, which so far from being worthy of excuse only increases the guilt. It is not occupied with a thing not revealed and which they are not bound to know, but about a thing which it is their duty to know and which is with sufficient clearness revealed to us in the word. Thus it can readily be perceived unless we are readily blind. Nor can the crime be lessened from its seeming to be only a theoretical error of the intellect. A theoretical error necessarily draws after it a practical sin; otherwise every idolatry (even the most gross) would deserve an excuse because it arises always from a theoretical error of the intellect. For no one would worship an idol, who did not believe it to be God, unless he imagined him to be present.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 19th Topic, Q. 30, ‘The Adoration of the Eucharist’, section 21, p. 547</span></figcaption>

</figure><figure class="quote" id="q-293726fbc1" data-kw="">
<blockquote><p>The Church did formerly of late confer with Christ, and refused to open to Him when He was knocking and showering down influences of grace [in the Song of Solomon]; now she is glad to confer:

1. With the smiting watchmen [Church officers], where she found little of Christ.

2. Next with private Christians in assemblies. This is a mean of the Lords showering down of influences in the public and domestic, or less public meetings of his saints; for ordinances of all sorts that are appointed of Christ, they drop down savory and seasonable dews. The Lord writes in his book the savory conferences of such as fear the Lord’s name, Mal. 3:16; and three things follow:

1. The Lord owns such as are his.

2. His forbearance though there be faults in their service.

3. His making known to his the difference betwixt such as serve God, and such as serve Him not: and Zech. 8, the inhabitants of one city encourage the inhabitants of another; and the fruits of it is:

1. Praying.

2. Owning the saints. And they take hold of the skirt of a Jew; and both say Christians meeting for prayer and conference want not God, who rains down impressions of grace upon them as his people, especially when they warm one another; as many coals in one heap make a great fire. Nor is the acting of the Spirit tied only to the public ministry; the saints take to their houses clusters of wine-grapes, which they feed upon at home. Let the saints meet, and by conference and prayer draw down new influences of the Spirit, Jude 20; Isa. 2:1-3; Jer. 50:4-5; Col. 3:16; Heb. 3:13 &amp; 10:24; 1 Thess. 5:14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, Influences of the Life of Grace (1659), ch. 11, pp. 307-8</span></figcaption>

<blockquote><p>The principal design of preaching the Gospel is, that men may be reconciled to God, and this is accomplished by the unconditional pardon of sins; as Paul also informs us, when he calls the Gospel, on this account, the ministry of reconciliation, (2 Cor. 5:18.) Many other things, undoubtedly, are contained in the Gospel, but the principal object which God intends to accomplish by it is, to receive men into favour by not imputing their sins. If, therefore, we wish to show that we are faithful ministers of the Gospel, we must give our most earnest attention to this subject; for the chief point of difference between the Gospel and heathen philosophy lies in this, that the Gospel makes the salvation of men to consist in the forgiveness of sins through free grace. This is the source of the other blessings which God bestows, such as, that God enlightens and regenerates us by his Spirit, that he forms us anew to his image, that he arms us with unshaken firmness against the world and Satan. Thus the whole doctrine of godliness, and the spiritual building of the Church, rests on this foundation, that God, having acquitted us from all sins, adopts us to be his children by free grace.</p></blockquote>

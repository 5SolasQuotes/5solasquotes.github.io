<main class="wrap"><figure class="quote" id="q-e200b6f225" data-kw="">
<blockquote><p>In this behalf no law can be prescribed, neither can we judge one of another, but every man should be a sufficient witness to himself, because in himself he feels the infirmities and pricks of the flesh. And albeit there appear never so many stops and lets in marriage, yet this must all understand to whom God has not given the gift of chastity (and so by that means not able to withstand the pricks of the flesh), that this commandment is by the Lord laid upon their shoulders as a burden to bear, which if it be not performed (seeing that God has appointed this as a remedy against sin), they commit grievous iniquity, and by that their dealing heap unto themselves wrath against the day of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/eusebius-pagit.html">Eusebius Pagit</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon, 9th June, 1572</cite></span></figcaption>

<blockquote><p>Man cannot be the infallible interpreter of the Scriptures and judge of controversies because he is liable to error. Our faith cannot be placed in him, but upon God alone from whom depends the sense and meaning of the Scriptures and who is the best interpreter of his own words. … If the rulers of the church are influenced by the Holy Spirit, they do not cease to be men and therefore fallible.</p></blockquote>

</figure><figure class="quote" id="q-beae44752c" data-kw="">
<blockquote><p>A List of the Seven Periods of the Roman Church: I. The history of the Roman Church, in more pure doctrine and government, even from the beginning of that Church to the time of Constantine the Great, or until about the year 314. II. The history of the same in relatively retaining more pure doctrine, as far as principal matters, yet in government, aspiring for domination, from Constantine the Great, or the year 314, up to [Flavius?] Phocas and Boniface III, or 607. III. The history of the same in attaining, more or less, despotism in spiritual matters, Phocas permitting, and relatively degenerating in doctrine and rites, from Boniface III up to Gregory VII, or 1073. IV. The history of the same striving for despotism even in temporal things, and turning worse with time in doctrine and rites, from Gregory VII, or around 1073 up to Boniface VIII, or 1294. V. The history of the same attaining to a greater degree of despotism in temporal things, even unto an Imperial-Papacy, and the same shamefully driving harder an overthrow of all pure doctrine, from Boniface VIII, or 1294, to Leo X, or 1517. VI. The history of the same through the Reformation, or the separation of the faithful, suffering a most heavy injury in their despotism in spiritual and temporal things, from Leo X, or 1517, up to the end of the Council of Trent, or 1563. VII. The history of the same being hardened in error through the decrees of a false faith and Tridentine anathemas, while continually fighting the true Church of Christ through deceit and force, from the end of the Council of Trent, or 1563, up to our time [late-1600’s].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joahnn-h-heidegger.html">Joahnn H. Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Papacy… (Amsterdam, 1698), Preface trans. Paul Barth &amp; Travis Fentiman</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

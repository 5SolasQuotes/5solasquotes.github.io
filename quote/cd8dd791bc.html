<main class="wrap"><figure class="quote" id="q-cd8dd791bc" data-kw="">
<blockquote><p>II. God alone is lord of the conscience,[k] and hath left it free from the doctrines and commandments of men which are in any thing contrary to his word, or beside it, in matters of faith or worship.[l] So that to believe such doctrines, or to obey such commandments out of conscience, is to betray true liberty of conscience:[m] and the requiring of an implicit faith, and an absolute and blind obedience, is to destroy liberty of conscience, and reason also.[n] [k] Jam. 4:12. Rom. 14:4. [l] Acts 4:19. Acts 5:29. 1 Cor. 7:23. Matt. 23:8-10. 2 Cor. 1:24. Matt. 15:9. [m] Col. 2:20,22,23. Gal. 1:10. Gal. 2:4,5. Gal. 5:1. [n] Rom. 10:17. Rom. 14:23. Isa. 8:20. Acts 17:11. John 4:22. Hos. 5:11. Rev. 13:12,16,17. Jer. 8:9. … IV. And because the powers which God hath ordained, and the liberty which Christ hath purchased, are not intended by God to destroy, but mutually to uphold and preserve one another;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, ch. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-868dd66a25" data-kw="">
<blockquote><p>…He reigns by divine authority, because his reason for assuming the office of Mediator was, that descending from the bosom and incomprehensible glory of the Father, He might draw near to us. Wherefore there is the greater reason that we all should with one consent prepare to obey, and with the greatest alacrity yield implicit obedience to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes</cite>, bk. 2, ch. 15, section 5</span></figcaption>

</figure><figure class="quote" id="q-bcebeace50" data-kw="">
<blockquote><p>…turbulent spirits do not love to examine things by rule, to call things to account, but follow their own fiery humor and set upon their own will with violence: but godliness takes off men from this ruggedness and turbulency of spirit and makes them gentle and peaceable: let them be never so active, never so forward, never so zealous in any thing, yet if you will call them to examine things by rule, they will meekly and patiently hear you; yea, a child shall lead them, Isa. 11:6. And yet further; turbulent they are not, for none [are] more obedient to authority than they; none see that majesty of God in authority as they do; none obey authority out of conscience so as they do. If the will of men in authority, rather than authority, shall require anything that the authority of Heaven forbids, that they do not; because they cannot obey, for conscience sake: And so sacred do they account authority, that they would have no obedience performed to it, but obedience for conscience sake. Blind obedience the Church of God has long ago exploded as too servile for Christian spirits: this were more servile than selling men’s bodies in the market for slaves, which Christianity abhors. It were too uncharitable a conceit of Christian magistrates, to think that they should require of, or expect from any other obedience than in, and for the Lord; and in this obedience, those who are godly, are so forward…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Excellency of a Gracious Spirit… (1639)</cite>, p. 138-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

edbooksonline.com/on-implicit-faith-obedience/#:~:text=%E2%80%A6turbulent%20spirits%20do%20not%20love%20to,who%20are%20godly%2C%20are%20so%20forward%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f82372b9b7" data-kw="">
<blockquote><p>5. Still, however, we see not how necessary that obedience is, unless we at the same time consider how prone our carnal nature is to shake off the yoke of God whenever it has been treated with some degree of gentleness and indulgence. It just happens to it, as with refractory horses, which, if kept idle for a few days at hack and manger, become ungovernable and no longer recognize the rider, whose command before they implicitly obeyed. And we invariably become what God complains of in the people of Israel — waxing gross and fat, we kick against Him who reared and nursed us (Deut. xxxii. 15). The kindness of God should allure us to ponder and love his goodness…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes</cite>, bk. 3, ch. 8, section 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><figure class="quote" id="q-38002ef9b4" data-kw="">
<blockquote><p>2. Papists will have the magistrates so to defend the faith, as they have not power to judge [by way of jurisdiction in spiritual things], not [even] as Christians with the judgement of discretion, what is right or wrong, but they must, as blind servants, execute what Prelates decree, yea and see (non propriis (says Henry Blyssemius) sed alienis Episcoporum ac praelatorum suorum oculis videre) ‘not with their own eyes, but with the eyes of their Prelates,’ yea and the magistrate should not read the Scripture (say Papists and Nicanor’s brethren, the Jesuits), [which is] expressly contrary to God’s Word, Dt. 17:17, ‘He shall read in the book of the Law all the days of his life,’ Josh. 1:8, but only believe as the Church believes, and this is blind obedience that they require of princes; this faith or obedience we think abominable in all men, as [also] in princes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbtyeries... (1644), pt. 2, Appendix, Objection: ‘David also prepared materials for the Temple…’</cite>, p. 449</span></figcaption>

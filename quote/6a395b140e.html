<main class="wrap"><figure class="quote" id="q-6a395b140e" data-kw="">
<blockquote><p>Holiness is God conformable to Himself, 1 Sam. 2:2; Hab. 1:13. As created holiness (which some call moral goodness or perfection of manners) is the conformity of the reasonable creature to the rule, so (God being his own rule and the fountain of all created perfection) we may conceive of increated holiness as of God’s conformity unto Himself. God is holy essentially, and so is none but He, 1 Sam. 2. There is none holy as the Lord; the creature is holy only by participation. He is the Author of all created holiness, both of the Moral Law, which is the rule of holiness, and of the infused grace of holiness, whence the reasonable creature is made conformable to that rule, and of all other holiness whatsoever: therefore [He is] justly called, ‘the Holy One of Israel,’ Isa. 41:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

<blockquote><p>This volume was inspired by Etienne Gilson’s query, made in the early 1950s, as to why medieval authors spoke of God’s being as infinite, a statement found neither in Judaeo-Christian scriptures nor in Greek philosophy… It concludes that infinity is predicated of God not only extrinsically, but also intrinsically: His very being is infinite – a predication resting on an Aristotelian theory of act/potency or on a Platonic version of participation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leo-sweeney.html">Leo Sweeney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Infinity in Greek &amp; Medieval Thought Ref</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-5c958fc60f" data-kw="">
<blockquote><p>Perfection is God all-sufficient and all-excellent: not having need of anything, giving sufficience unto, and having in Him the perfection of all things, Gen. 17:1-2; Ex. 6:3. This attribute renders God as that infinite sea of all happiness. Perfection is increated glory: that is, all the attributes in one word; as happiness is the sum of man’s good, so glory is the sum of all God’s attributes. The perfection of God is essential, independent, unlimited, without increase or decrease: As the power of subordinate causes is contained in the first cause virtually: and as the authority of under-officers is in the prince after a more excellent manner, so the virtue of all second causes is contained in the first cause eminently. The word eminently taken in its strict and proper sense seems to intend the effect to be in the cause, not only in a more excellent manner than in itself, but also in a super-created manner. Things are in God agreeable to the nature of God: in themselves according to their proper natures. … The essential perfection of God is increated glory, eternal, always the same, from which nothing can be taken, to which nothing can be added. The acknowledgement of the manifested perfections of God, is glorification: viz. The act of the creature done in time, admitting more or less according as God is known or acknowledged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, pp. 19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/existence-and-knowledge-of-god/essence-and-attributes-in-general.html">Essence and Attributes in General</a></span></div>

</figure><figure class="quote" id="q-4240a8fc24" data-kw="">
<blockquote><p>Briefly, the concept of double justice posits a higher hidden justice in God which transcends the Law and could condemn even the angels. This idea appears in Calvin’s works before the sermons on Job but always grows out of his fascination with Job 4:18, namely that even the angels are not clean in God’s sight… which proved that creaturely justice cannot satisfy the justice of God… But when he tried to develop double justice as a hermeneutical key to the book of Job as a whole, the text led him in a direction he did not want to go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/susan-schreiner.html">Susan Schreiner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Exegesis &amp; Double Justice in Calvin’s Sermons on Job’ in Church History, 58, no. 3 (Sep., 1989), pp. 322-38</cite>, p. 322</span></figcaption>

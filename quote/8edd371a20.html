<main class="wrap"><figure class="quote" id="q-8edd371a20" data-kw="">
<blockquote><p>Lo, before ever there was father or mother or son in the world, God has appointed that the bonds betwixt husband and wife shall be more strait and indissoluble than betwixt the parent and child; and can any man be so unreasonable as to defend it lawful upon some unkind usages or thwartness of disposition, for a parent to abandon and forsake his child; or the son to cast off his parent? Much less therefore may it be thus betwixt an husband and wife: They two are one flesh. Behold here an union of God’s making: A man’s body is not more his own than his wife’s body is his: And will a man be content to part easily with a piece of himself? Or can we think that God will endure an union made by Himself to be slightly dissolved? Or how is this bodily matrimony a lively image of the spiritual marriage betwixt Christ and his Church (who has said, ‘I will betroth thee unto me forever; Yea I will betroth thee unto me in righteousness and in judgment, and in loving kindness, and in mercies,’ Hos. 2:19), if upon small occasions it may be subject to utter dissolution? Yea, what speak I of divinity? Even modest heathens would hiss this Libertinism off the stage…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men</cite>, (London, 1654), 4th Decade, Case 2, ‘Whether Marriage Lawfully made may Admit of any Cause of Divorce, save only for the Violation of the Marriage Bed, by Fornication or Adultery?’, p. 303, pp. 303-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7d77a0489" data-kw="">
<blockquote><p>That power is given by the Presbyteries’ act of ordination, by order of nature, before the people’s formal act of election: As the husband who in a lapidaries shop chooses a gold ring for his wife, and puts it on her finger, presupposes it was a gold ring before his choosing thereof, neither does his choosing thereof make it a gold ring, but only makes it his wife’s gold ring by application to her: Just so, peoples election appropriates such a man who is already a pastor to such a charge, but does not make the pastor a pastor, but chooses him only to be their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 17, p. 267</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-537c63a515" data-kw="">
<blockquote><p>The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-bunny.html">Francis Bunny</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth &amp; Falsehood</cite>, … (London: Sims, 1595), ch. 19, ‘Of Matrimony, that it is not a Sacrament &amp; that it is Lawful for all’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>2. They [the Jerusalem Church] were under a tie by due proportion, not to keep the Law of Moses and not to be circumcised by any necessity of a Divine Law, but only by permission to use these ceremonies for fear of scandal.

4. Not to reject the gentiles whom the Lord had called to his heavenly kingdom as well as the Jews.</p></blockquote>

<blockquote><p>Second, with respect to the particular commandments of the law, saying: and the commandment of the law is holy in regard to the ceremonial precepts by which men are directed in the worship of God: be holy because I am holy (Lev 20:7) and just, in regard to the judicial precepts by which man is ordered to his neighbour in the proper way: the ordinances of the Lord are true and just altogether (Ps 19:9); and good, in regard to the moral precepts: the law of your mouth is better to me than thousands of gold and silver pieces (Ps 119:72). Yet, because all the commandments ordain us to God, he called the whole law holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Romanos lectura</cite>, (c. 1259-65), C. 7, L. 2, 551.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-6e89666afa" data-kw="">
<blockquote><p>To God indeed the grand object of knowledge, the great source of obligation, the bestower of all happiness, the author of every good and perfect gift, your attention already has been or should have been directed in the study of his works, and especially in the study of man, the noblest of his works. God’s works should be all studied with a reference to him who created and sustains them.

The things that are made should be ever contemplated as having been made and regulated for the purpose of making known the invisible things of God, even his eternal power and Godhead; and moral philosophy, when taught as it should be, unfolds all that can be known of God, and of man’s relation to him, from the light of nature and the works of creation and providence, and especially from man’s mental constitution, in order to settle aright the nature, ground, and requirements of duty, in so far as these can be known and ascertained without an immediate and supernatural revelation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, ed. Thomas Smith (New York: Robert Carter and Brothers, 1878), Lecture I, pp 5-6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-3f47cc2a9a" data-kw="">
<blockquote><p>There were others who, although they believed that the Word was not changed into flesh but assumed it, nevertheless said that he assumed flesh without a soul; for if he had assumed flesh with a soul, the Evangelist would have said, the Word was made flesh with a soul. This was the error of Arius, who said that there was no soul in Christ, but that the Word of God was there in place of a soul.

The falsity of this opinion is obvious, both because it is in conflict with Sacred Scripture, which often mentions the soul of Christ, as: my soul is sad, even to the point of death (Matt 26:38), and because certain affections of the soul are observed in Christ which can not possibly exist in the Word of God or in flesh alone: he began to be sorrowful and troubled (Matt 26:37). Also, God cannot be the form of a body. Nor can an angel be united to a body as its form, since an angel, according to its very nature, is separated from body, whereas a soul is united to a body as its form. Consequently, the Word of God cannot be the form of a body.

Furthermore, it is plain that flesh does not acquire the specific nature of flesh except through its soul. This is shown by the fact that when the soul has withdrawn from the body of a man or a cow, the flesh of the man or the cow is called flesh only in an equivocal sense. So if the Word did not assume flesh with a soul, it is obvious that he did not assume flesh. But the Word was made flesh; therefore, he assumed flesh with a soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Evangelium S. Ioannis Lectura</cite>, (1270-72), C.1.L7.n167, 167.2-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

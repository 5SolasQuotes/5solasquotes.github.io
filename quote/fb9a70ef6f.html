<main class="wrap"><figure class="quote" id="q-fb9a70ef6f" data-kw="">
<blockquote><p>IV. The church consisteth only of the elect already incorporate into Christ.

Now that these many, of whom the church consisteth, are none but elect already ingrafted into Christ and indued with Christ’s holiness, the same scriptures do plentifully teach both in other places and chiefly to the Ephesians, where the Apostle, speaking of the church and the members thereof, saith we are all chosen in Christ and have redemption in him and are sealed with that Holy Spirit of promise.

That Christ is given to be the head of the church and the church is his body. It is therefore such a body, whereof all the members are joined by the same Spirit both to the head Christ and among themselves, and are quickened or have life from the head, and are indued with his holiness. So that this whole body is truly holy and called the holy church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), XXIII.IV, 1: 381.</span></figcaption>

<blockquote><p>How long Lord shall the wickedness and fury of Idolatry, of superstitions, and of the ignorance of the scriptures range abroad on the earth? How long Lord shall thy holy Gospel be trodden under foot? We in deed have sinned, we have been rebellious against thee, and have not harkened unto thy words, for which cause we are justly, and for our evil desert, thus daily put to confusion and shame. But thou O Lord our God are most just in all thy works. But on the other side Lord, for as much as it belongeth to thy clemency and constancy, to have mercy, to spare, and most faithfully to keep thy covenants and promises, how long Lord? how long wilt thou be angry unto the end? Remember not our iniquities of old.

Wherefore we beseech thee, that for as much as in these last times, thou hast by pouring abroad thy plenteous light, (and that being most mighty,) vouchsafed to make manifest unto men which lay in darkness, yea more then palpable darkness, the secrets of thy truth: thou wouldest once at the length turn away thy wrath and fury from our ingrate minds, and from the most grievous sins, whereby we have laid forth thy most holy name, and the pure doctrine which we profess, to evil speakings and to blasphemies. And deliver thy congregation from the contumelies and oppressions of the wicked, which doubtless light not only upon us, but also upon the majesty of thy name.

Although thou of thine own nature be … untouchable, and not able to be hurt. Illuminate O most loving Christ, thy face upon the Church redeemed with thy blood, which is now in a manner utterly left desolate. Thy name only, and not any other man’s name, we call upon, not undoubtedly trusting to any our own righteousness, but to thy goodness only and mercy, that thou wouldest either appoint an end or measure of those evils, and lenify the vexation wherewith we together with our brethren are afflicted, or that thou wouldest at the least vouchsafe to give unto the hearts of thine, such faith and constancy, that they fall not away from the profession of true piety, yea rather that they may so nobly and valiantly behave themselves, that by their exile, imprisonment, poverty, ignominy, sword, fire, and how cruel so ever kind of death it be, the lively knowledge of thy gospel may more and more shine forth, and be made more manifest to the whole world.</p></blockquote>

<blockquote><p>John Baptist and the apostles, Acts 8; Jn. 3, after a confession never asked for their conversion, but baptized, for straightway without delay, even in the night (for so the Word notes, Mt. 21:19; Luke 4:39 &amp; 5:25 &amp; 8:44) the jailor and his house, Acts 16, Cornelius and his house, Acts 10, the eunuch, the multitude of John Baptist’s hearers were baptized members of the universal Church, 1 Cor. 12:12-13, where there was no particular congregation to receive and admit them as members, as Mr. Richard Baxter solidly observes. Nor is it worthy the refuting that the apostles, by an extraordinary power, might baptize them, though to no certain church, but pastors now have not that power: for the apostles baptizing and preaching, and administering the other seal differ not. The apostles preached and baptized in all places as ordinary officers by the same command, Mt. 28:19, by which we teach and baptize in species and nature, from the ordinary pastoral acts of an ordinary minister; they speak with tongues, [and] work miracles as apostles, but they preach and baptize hic &amp; nunc as ordinary officers.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“John Baptist and the apostles, Acts 8; Jn. 3, after a confession never asked for their conversion, but baptized, for straightway without delay, even in the night (for so the Word notes, Mt. 21:19; Luke 4:39 &amp; 5:25 &amp; 8:44) the jailor and his house, Acts 16, Cornelius and his house, Acts 10, the eunuch, the multitude of John Baptist’s hearers were baptized members of the universal Church, 1 Cor. 12:12-13, where there was no particular congregation to receive and admit them as members, as Mr. Richard Baxter solidly observes. Nor is it worthy the refuting that the apostles, by an extraordinary power, might baptize them, though to no certain church, but pastors now have not that power: for the apostles baptizing and preaching, and administering the other seal differ not. The apostles preached and baptized in all places as ordinary officers by the same command, Mt. 28:19, by which we teach and baptize in species and nature, from the ordinary pastoral acts of an ordinary minister; they speak with tongues, [and] work miracles as apostles, but they preach and baptize hic &amp; nunc as ordinary officers.”

— Samuel Rutherford, A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker, … (London, 1658) | bk. 3, ch. 2, ‘Of the First Subject of the Power of the Keys’, p. 293">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CJohn+Baptist+and+the+apostles%2C+Acts+8%3B+Jn.+3%2C+after+a+confession+never+asked+for+their+conversion%2C+but+baptized%2C+for+straightway+without+delay%2C+even+in+the+night+%28for+so+the+Word+notes%2C+Mt.+21%3A19%3B+Luke+4%3A39+%26+5%3A25+%26+8%3A44%29+the+jailor+and+his+house%2C+Acts+16%2C+Cornelius+and+his+house%2C+Acts+10%2C+the+eunuch%2C+the+multitude+of+John+Baptist%E2%80%99s+hearers+were+baptized+members+of+the+universal+Church%2C+1+Cor.+12%3A12-13%2C+where+there+was+no+particular+congregation+to+receive+and+admit+them+as+members%2C+as+Mr.+Richard+Baxter+solidly+observes.+Nor+is+it+worthy+the+refuting+that+the+apostles%2C+by+an+extraordinary+power%2C+might+baptize+them%2C+though+to+no+certain+church%2C+but+pastors+now+have+not+that+power%3A+for+the+apostles+baptizing+and+preaching%2C+and+administering+the+other+seal+differ+not.+The+apostles+preached+and+baptized+in+all+places+as+ordinary+officers+by+the+same+command%2C+Mt.+28%3A19%2C+by+which+we+teach+and+baptize+in+species+and+nature%2C+from+the+ordinary+pastoral+acts+of+an+ordinary+minister%3B+they+speak+with+tongues%2C+%5Band%5D+work+miracles+as+apostles%2C+but+they+preach+and+baptize+hic+%26+nunc+as+ordinary+officers.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Survey+of+that+Sum+of+Church-Discipline+Penned+by+Mr.+Thomas+Hooker%2C+%E2%80%A6+%28London%2C+1658%29+%7C+bk.+3%2C+ch.+2%2C+%E2%80%98Of+the+First+Subject+of+the+Power+of+the+Keys%E2%80%99%2C+p.+293&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F75a06d547d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/75a06d547d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-

<main class="wrap"><figure class="quote" id="q-00ec4eb6e3" data-kw="">
<blockquote><p>But as the said Jews, I say, did then refuse such waters, so the said people refusing both the said pure and simple worship of God and true Church discipline, and preferring to it that vain, frothy, pompous, human will-worship, or liturgy of Rome, somewhat refined I confess, but yet the very same in substance, therefore did the Lord bring upon them that proud prelatical, hierarchical Church government, by the means of it, the which has at length broken into England, especially, and has so overflowed and passed through it, that it is come, not only to the neck, but even to the very top of the cheeks and ears of some of the best servants of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-de-la-march.html">John De La March</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complaint of the False Prophets Mariners upon the Drying up of their Hierarchical Euphrates</cite>, … (London, 1641), pp. 36-37</span></figcaption>

</figure><figure class="quote" id="q-12bc9a21f6" data-kw="">
<blockquote><p>For theology is the doctrine of salvation: and our salvation and blessedness consists in these two parts: (1) That we rightly know God. (2) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these two parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his theology into these parts, Acts 24:14-16, ‘I believe all things which are written, and have hope in God: and I do exercise myself to have a conscience void of offence.’ Whence the same Paul reprehends the Gentiles, because ‘they glorified not God, neither were they thankful,’ Romans 1:21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), ‘The Distribution of Theology’</span></figcaption>

</figure><figure class="quote" id="q-beaf4df64b" data-kw="">
<blockquote><p>A purity spiral is a theory which argues for the existence of a form of groupthink in which it becomes more beneficial to hold certain views than to not hold them, and more extreme views are rewarded while expressing doubt, nuance, or moderation is punished (a process sometimes called “moral outbidding”). It is argued that this feedback loop leads to members competing to demonstrate the zealotry or purity of their views. A purity spiral is argued to occur when a community’s primary focus becomes implementing a single value that has no upper limit, and where that value does not have an agreed interpretation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wikipedia.html">Wikipedia</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Purity Spiral” 12-2025</cite></span></figcaption>

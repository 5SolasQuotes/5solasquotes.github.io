<main class="wrap"><figure class="quote" id="q-2f6b3b2c22" data-kw="">
<blockquote><p>But to answer more briefly, we shall find Instances in the New Testament that make Separation unlawful, as well as in the Old, which Instances shall make up our Third Argument.

Arg, III. Our Third Argument. In the Church of Corinth there was a Profane Multitude, 1 Cor, 3, 4. We find there were Schismaticks in it. Chap, v. v, 1. We find Incests were Tolerated, Chap. 6 v, 1. We find there were men of Contentious Spirits, going to Law before Infidels. Yea in that Chapter, We find there were some pleading the Lawfulness of Fornication; And Chap, 11. We find there were Drunkards among them; And such Drunkenness as was most abominable; For some came Drunk to the Lords Table, v, 21. And Chap, 15. We find there were some infected with a dangerous Heresy The denying of the Resurrection.

And so a number of very offensive things were among them, But after all, the Apostle. Tho he reproves them very sharply yet he no where says, Ye that are Godly stay away from joining in Worship, because of such men’s joining; But on the contrary he approves their coming together to go about the Ordinances, Only reproving the wrong way they came in. So Chap, 11. v, 18. First of all when ye come together in the Church I hear there be divisions among you. And v, 20. When you come together therefore unto one place, &amp;c. He doth not reprove their coming together, but supposes it as a thing Lawful, only he reproves them for their Divisions.

So in the Church of Galatia, There was much corruption among them, they were Bewitched with Heretical Doctrine O Foolish Galatians who hath Bewitched you, &amp;c. Cap, 3. v, 1, They had begun in the Spirit but were like to end in the Flesh, v, 3. In the Church of Ephesus were many who had fallen away from their first Love, Revel, 2, 1.

The Church of Sardis, Revel: 3, 1. Did Tolerate profane persons such as defiled their Garments; And yet we never read the Spirit of God commanding to Separate from worship because of them: Indeed he reproves them sharply for their Corruption; For their falling away from their first love, For Their Tolerating Prophane wicked men; But he says not All ye that are Godly turn your backs upon that Church; Make up a new Church of your Own; But directly approves their joining together in what was right. So it is clear that Separation from the Ordinances is no more to be Tolerated under the New Testament than it was under the Old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief refutation of the errors toleration, Erastianism, Independency and separation delivered in some sermons from I Joh. 4. I, preached in the year 1652: to which are added four sermons preached on several occasions</cite>, (Edinburgh: George Mosman, 1692), pp 223-24.</span></figcaption>

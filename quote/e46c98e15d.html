<main class="wrap"><figure class="quote" id="q-e46c98e15d" data-kw="">
<blockquote><p>Can there be any more willing to help us than Christ? whose whole head was sick, and whose heart was heavy for our sakes? yea, in whose body, from the sole of the foot to the crown of the head, was nothing but wounds and swellings, and sores? but alas this was nothing to that He suffered for our sakes. He was compassed about with fears and horrors, till his sweat was drops of blood, and his bones bruised in the flesh: he was whipped, and scourged, and chastised with sorrows, till He cried out in the bitterness of his soul: ‘O Lord, if it be possible let this cup pass from Me.’ The heavy hand of God was so grievous upon Him, that it bruised his very bones and rent his reigns asunder: he could find no health in his flesh, but was wounded, yea, wounded to the death, even the most bitter death upon the cross. His tender fingers were nailed to the cross, his face was wrinkled with weeping and wailing, his sides embrued and gored with his own blood. spurting and gushing fresh from his ribs, the shadow of death was upon his eyes. O what grief could be like to this, or what condemnation could be so heavy, since there was no wickedness in his hands? since He was the brightness of his father’s glory, and the son of righteousness that shined in the world: as to see his days at an end, to see such throbing, sighs, and careful thoughts (without cause of his) so deeply engraven in the tables of his breast. But was this all? No my brethren, since his excellency was such above all creatures, that the world was not worthy to give Him breath, it was a greater grief unto Him, to see Himself made a worm and not a man, a shame of men, and contempt of the people; to see his life shut up in shame and reproaches, how could it but shake his bones out of joint, and make his heart melt in midst of his bowels: who was ever so full of woe? and whoever been brought so low into the dust of death? upon whom did the malice of Satan ever get so great a conquest? This though it were exceeding, yet it was not all, no, it was but a taste of grief in comparison of the rest: behold therefore (if your watery eyes will suffer ye to behold) the depth of all miseries yet behind: the sin that he hated he must take upon his own body, and bear the wrath of his Father poured out against it. This is the fullness of all pains that compassed Him round about, which no tongue is able to utter, nor heart conceive: the anger of the father burneth in Him, even to the bottom of hell, and deep sink of confusion: it wrapped Him in the chains of eternal death: it crucified Him, and threw Him down into the bottomless pit of calamity, and made his soul by weeping and wailing to melt into these bitter tears trickling from his eyes: “O God my God, why hast Thou forsaken Me?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sinful Man’s Search’ (London, 1592) on Job</cite>, 8:5-7</span></figcaption>

<blockquote><p>…but some greater kingly power is due to the king in the case of the Churches aberring, than in the case of the Churches’ right administration; and as our divines do justly give to the prince an extraordinary kingly power in the case of universal apostasy of the Church, as Jehoshaphat, Hezekiah, Josiah, and other worthy reformers in the Church of the Jews did warrantably use their kingly power, when the Church-men were corrupted and negligent in their duty; so in a particular case of a particular error of the synod, the king as king, may use his kingly power in this fact, that is, secundum quid extraordinarie [according to that which is extraordinary], for the king is obliged as king to add his accumulative power of a civil sanction to all just and necessary Church constitutions, and if the canon or Church constitution be wicked and popish, he is obliged to deny his civil sanction, and not that only (for he that is not with Christ is against Him), but he is to employ his kingly power against such canons, and so is to deliver the Church of God in that, and in denying his accumulative power to unjust canons, he adds his kingly power accumulative to the true Church, in saving them from these unjust canons.</p></blockquote>

</figure><figure class="quote" id="q-cf1be67157" data-kw="">
<blockquote><p>And to Honoratus he [Augustine] says that in a great persecution, all ministers ought not to fly away, nor yet all abandon themselves unto peril, but those must be retained which shall be sufficient for the present use and the rest to be sent away, that they may be reserved till a better season. But here what maner of choosing shall be had? Those must be retained (says he) whom we shall think to be the more profitable and better for the people which remain. But if all shall be alike, and all shall say that they would tary and die, then says he the matter must be committed unto lots.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places… (London: Rowe, 1583), pt. 1, ch. 8, ‘Of Lots, whereby God’s Counsel was Asked…’</cite>, pp. 60</span></figcaption>

</figure><figure class="quote" id="q-562f8bcf56" data-kw="">
<blockquote><p>It [the plague] appears to have been brought into Leith by a passenger from England, on 14th October, 1574, and several persons died of it there, before its existence was generally known; it entered Edinburgh on the 24th of the same month [A History of Epidemics in Britain, by Charles Creighton, M.D., I., p. 366], and five days later, viz., on 29th October, the town council of Glasgow prohibited all persons from Leith, Kirkcaldy, Dysart, Burntisland, and other places in which its existence was suspected, from coming to the city; inhabitants of Glasgow were also prohibited from going to these places. In Edinburgh the only place suspected is stated to have been Bell’s Wynd, and inhabitants of Glasgow were prohibited from going to that city without a testimonial, or from returning without a certificate from the magistrates that they had not associated with suspected persons there. Residenters in the town were prohibited from receiving strangers in their houses, except such as were licensed by the magistrates or their officers; and even residenters in houses outside of the ports were subjected to a similar restriction. Travellers from places unsuspected were also required, before being received within the city, to produce a testimonial from the magistrates of the burgh or the minister of the parish beyond a burgh. [Council Records, I., pp. 27–8] Two days later the privy council issued an order from Dalkeith to check the spreading of the plague landwards “through the departure of sick folk and foul persons;” it prohibited concealment of the existence of the malady, and commanded infected persons “to cloise thame selffis in.” [Privy Council Register, II., p. 415]</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It [the plague] appears to have been brought into Leith by a passenger from England, on 14th October, 1574, and several persons died of it there, before its existence was generally known; it entered Edinburgh on the 24th of the same month [A History of Epidemics in Britain, by Charles Creighton, M.D., I., p. 366], and five days later, viz., on 29th October, the town council of Glasgow prohibited all persons from Leith, Kirkcaldy, Dysart, Burntisland, and other places in which its existence was suspected, from coming to the city; inhabitants of Glasgow were also prohibited from going to these places. In Edinburgh the only place suspected is stated to have been Bell’s Wynd, and inhabitants of Glasgow were prohibited from going to that city without a testimonial, or from returning without a certificate from the magistrates that they had not associated with suspected persons there. Residenters in the town were prohibited from receiving strangers in their houses, except such as were licensed by the magistrates or their officers; and even residenters in houses outside of the ports were subjected to a similar restriction. Travellers from places unsuspected were also required, before being received within the city, to produce a testimonial from the magistrates of the burgh or the minister of the parish beyond a burgh. [Council Records, I., pp. 27–8] Two days later the privy council issued an order from Dalkeith to check the spreading of the plague landwards “through the departure of sick folk and foul persons;” it prohibited concealment of the existence of the malady, and commanded infected persons “to cloise thame selffis in.” [Privy Council Register, II., p. 415]”

— Civil Examples, Scotland 1574 | Footnote 33 in ‘Historical preface: 1600-3’, in Charters and Documents Relating To the City of Glasgow 1175-1649 Part 1, ed. J D Marwick (Glasgow, 1897), pp. clxxxiv-cciv. British History Online">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+%5Bthe+plague%5D+appears+to+have+been+brought+into+Leith+by+a+passenger+from+England%2C+on+14th+October%2C+1574%2C+and+several+persons+died+of+it+there%2C+before+its+existence+was+generally+known%3B+it+entered+Edinburgh+on+the+24th+of+the+same+month+%5BA+History+of+Epidemics+in+Britain%2C+by+Charles+Creighton%2C+M.D.%2C+I.%2C+p.+366%5D%2C+and+five+days+later%2C+viz.%2C+on+29th+October%2C+the+town+council+of+Glasgow+prohibited+all+persons+from+Leith%2C+Kirkcaldy%2C+Dysart%2C+Burntisland%2C+and+other+places+in+which+its+existence+was+suspected%2C+from+coming+to+the+city%3B+inhabitants+of+Glasgow+were+also+prohibited+from+going+to+these+places.+In+Edinburgh+the+only+place+suspected+is+stated+to+have+been+Bell%E2%80%99s+Wynd%2C+and+inhabitants+of+Glasgow+were+prohibited+from+going+to+that+city+without+a+testimonial%2C+or+from+returning+without+a+certificate+from+the+magistrates+that+they+had+not+associated+with+suspected+persons+there.+Residenters+in+the+town+were+prohibited+from+receiving+strangers+in+their+houses%2C+except+such+as+were+licensed+by+the+magistrates+or+their+officers%3B+and+even+residenters+in+houses+outside+of+the+ports+were+subjected+to+a+similar+restriction.+Travellers+from+places+unsuspected+were+also+required%2C+before+being+received+within+the+city%2C+to+produce+a+testimonial+from+the+magistrates+of+the+burgh+or+the+minister+of+the+parish+beyond+a+burgh.+%5BCouncil+Records%2C+I.%2C+pp.+27%E2%80%938%5D+Two+days+later+the+privy+council+issued+an+order+from+Dalkeith+to+check+the+spreading+of+the+plague+landwards+%E2%80%9Cthrough+the+departure+of+sick+folk+and+foul+persons%3B%E2%80%9D+it+prohibited+concealment+of+the+existence+of+the+malady%2C+and+commanded+infected+persons+%E2%80%9Cto+cloise+thame+selffis+in.%E2%80%9D+%5BPrivy+Council+Register%2C+II.%2C+p.+415%5D%E2%80%9D%0A%0A%E2%80%94+Civil+Examples%2C+Scotland+1574+%7C+Footnote+33+in+%E2%80%98Historical+preface%3A+1600-3%E2%80%99%2C+in+Charters+and+Documents+Relating+To+the+City+of+Glasgow+1175-1649+Part+1%2C+ed.+J+D+Marwick+%28Glasgow%2C+1897%29%2C+pp.+clxxxiv-cciv.+British+History+Online&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F562f8bcf56.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/562f8bcf56.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-civil-magistrates-just-authority-for-quarantining-and-restraining-the-congregating-of-citizens-even-the-church-with-sufficient-natural-warrant/#:~:text=It%20%5Bthe%20plague%5D%20appears%20to%20have,Privy%20Council%20Register%2C%20II.%2C%20p.%20415&amp;text=It%20%5Bthe%20plague%5D%20appears%20to%20have%20been%20brought&amp;text=selffis%20in.%E2%80%9D%20%5BPrivy%20Council%20Register%2C%20II.%2C%20p.%20415" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And here comes in the way that general bond wherewith man is especially bound unto man, and that without taking away of humanity itself, cannot be broken; There is also another bond binding every citizen unto his country and city. But both these bonds I affirm to be natural and universal, that everyone must have regard of his estate, and calling; for some serve in public offices, either civil, or the ministry; the rest are private persons… …yet, lest in this case [of flight], any man by flattering of himself, might sin against his neighbour [in neglecting his duty towards him], it is the duty of a Christian magistrate to provide that those things which either breed or nourish the plague, so far as they may, be taken away, and that regard may be had of those that be visited with this sickness, that all be not driven to be careful for all. … But if in such calamities the magistrate do not in time provide, as much as may be, both by such lawful means as are not repugnant unto Christian charity, that the infection may be prevented, and also that the sick of the plague want [lack] nothing…</p></blockquote>

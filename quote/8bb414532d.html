<blockquote><p>7. What is the Scriptural doctrine concerning the millennium?

1st. The Scriptures, both of the Old and New Testament, clearly reveal that the gospel is to exercise an influence over all branches of the human family, immeasurably more extensive and more thoroughly transforming than any it has ever realized in time past. This end is to be gradually attained through the spiritual presence of Christ in the ordinary dispensation of Providence, and ministrations of his church. — Matt. xiii. 31, 32; xxviii. 19, 20; Ps. ii. 7, 8; xxii. 27, 29; Ixxii. 8-11; Is. ii. 2, 3; xi. 6-9; Ix. 12; Ixvi. 23; Dan. ii. 35, 44; Zech. ix. 10; xiv. 9; Rev. xi. 15.

2d. The period of this general prevalency of the gospel will continue a thousand years, and is hence designated the millennium. — Rev. xx. 2-7.

3d. The Jews are to be converted to Christianity either at the commencement or during the continuance of this period. Zech. xii. 10; xiii. 1; Rom. xi. 26-29; 2 Cor. iii. 15, 16.

4th. At the end of these thousand years, and before the coming of Christ, there will be a comparatively short season of apostasy and violent conflict between the kingdoms of light and darkness. — Luke xvii. 26-30; 2 Pet. iii. 3, 4; Rev. xx. 7-9.

5th. Christ’s advent, the general resurrection and judgment, will be simultaneous, and immediately succeeded by the burning of the old, and the revelation of the new earth and heavens. “Confession of Faith,” Chaps, xxxii. and xxxiii.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (2nd edn, New York: Robert Carter and Brothers, 1879), pp 568-69.</span></figcaption>

</figure><figure class="quote" id="q-babe6f6031" data-kw="">
<blockquote><p>Concerning the mode of creation, insofar as it indeed pertains to the efficient, it must be held that God did not always create—otherwise the creature would be coeternal with the creator. But He began to create at the beginning of time, as Moses speaks, Gen. 1:1, “In the beginning”; from which beginning John speaks, Jn. 1:1, from which beginning creation is called the beginning of Jehovah’s way, Prov. 8:22. And when He began, He did not pass from idleness to work, from potency to act. But the creature, which was in potency, and that only negative, was brought into act and existed in act. …

I. That the creation of individual things was made in an instant, as they say, or moment of time, in respect to God the creator, because in creating He employed the omnipotent Word. … The subject creation concerned were creatures, to be produced by the power of God. The subject, however, in which, there was initially none, because, no creature existing, there existed also no place. Afterward, however, with the creature place began: common indeed to all creatures, the world; proper, however, to certain ones: heaven, water, earth, Gen. 1:1, 14, 20, 24. …

II. Finitude is in place and time. In place, because all creatures, inasmuch as they are finite in essence, occupy some space, whether corporeal or spiritual, according to the condition of their nature, Gen. 1 throughout. In time, because they both began in time, Gen. 1:1, and as long as they exist, they are subject to it.</p></blockquote>

<blockquote><p>25. Axioms concerning the perfection of God:

I. God is in Himself absolutely and in every way perfect from eternity to eternity, devoid of all defect or progress. Rom. 11:35, ‘Who has first given to Him, and it shall be recompensed to them?’

      26. II. God can lack no perfection, neither privatively nor negatively: that is, No privation of perfection, no negation can fall upon God.

      27. III. All perfections belong to God according to one and simple form, which is His essence.

      28. IV. God is the cause of all perfections in other things, Rom. 11:36, ‘For from Him, and through Him, and to Him are all things.’

      29. V. All perfections, which are found in things created by God, were first in God most perfect and in the most perfect manner. Indeed, God, as the first cause, contains all possible perfection in Himself. All perfections are simply simple in God, because in their formal concept they have no imperfection, but pure perfection, nor do they involve any contradiction among themselves. God, by reason of His perfection, eminently contains the perfections of creatures. Eminently: to contain the perfection of something is to have such a perfection of a higher order, which by its power contains whatever is in the lower perfection: whence, because He also contains eminently, He can bring it about. For all effects are in efficient causes by power, so that such causes are said to be like their effects; and conversely, effects are such as their causes.</p></blockquote>

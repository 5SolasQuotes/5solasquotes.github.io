<blockquote><p>The Gospel is the joyful news, or Doctrine of the Son of God, being sent into this World, that he might assume our nature, and might undergo the curse of the Law for us, that by his perfect obedience to the same, he might obtain eternal life to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Abridgment of Christian Divinity</cite>, trans. Alexander Ross (3rd edn, London: Joseph Nevill, 1660), p. 108.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<blockquote><p>The Cardinal is continually urging this proposition, that there is no salvation out of the Church; And that he has not God for his Father that has not the Church for his mother. It imports then to know in what sense, and how far that proposition is true. I say then, that if by the word ‘Church’, you understand the Church or Assembly of the elect, or predestinated unto salvation, it is clear and questionless that out of the Church so understood there is no salvation: For whosoever is none of the elect, is of necessity a reprobate. If by the ‘Church’, you understand some particular Church, as the Greek, the Roman, the English, it is certain that out of such a Church a man may be saved. For example, if the Roman Church were as pure in the faith as it is corrupt, yet a faithful man could be saved in any other particular Church of the like purity. But if by the ‘Church’, one understands the whole body of those that profess themselves to be Christians, or the whole body of the orthodox Churches united in communion; it is certain that out of the communion of the Church taken in that sense a man may be saved. For if one were unjustly excommunicated from that Church, and should die during that excommunication, he should not be therefore excluded from salvation. For God is not subject to men’s vices, nor obliged to comply with the unjust passions of pastors handling the keys unrighteously, or abusing them ignorantly. Such a man having the Church for his step-mother, shall nevertheless have God for his Father. It may also happen that a pagan or a Jew being prisoner, or living in a country where there is no Christians, will come by reading, or conference, or inspiration from God, to acknowledge the truth of Christian religion, and make a resolution to profess it at the next opportunity, and as soon as he shall have his freedom: if death prevent such a man before he can openly join with the communion of the Church, I make no doubt but that he may be saved, believing in Jesus Christ, though he never did aggregate himself to the communion of the Church. For our Savior’s words can never be false, ‘Whosoever believeth in Jesus Christ, hath eternal life,’ Jn. 6. The thief crucified with Jesus, and converted when he was near death, was a pagan before, or of no religion; we cannot tell that ever he was a member of the visible Church, yet he was saved. In this sense then that proposition may be true, That out of the visible Church there is no salvation. Who so by profaneness or error in the foundation of the faith does separate himself from the communion of the universal visible Church, and renounces the communion of the faithful, to live according to his fancy, and to be no more a member of the Church, that man cannot be saved. Of such men the apostle Jude speaks, verses 18-19, where he calls those mockers and sensual men that separate themselves; And the apostle to the Hebrews, ch. 10, v. 25, forbids us to forsake the assembling of ourselves together. In this sense Cyprian in his book of the Unity of the Church, says, ‘He hath not God for his Father, that has not the Church for his Mother.’ For he speaks of schismatics, who out of pride despise the communion of the orthodox Church, and are authors of disension and division in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, … (London: White, 1662), ch. 7, How this Proposition must be understood: That out of the Church there is no Salvation, p. 13</span></figcaption>

<blockquote><p>As another, though a merely supplementary argument, it may be stated, that, just as all the texts of scripture which bear upon the spiritual independence of the Church have a direct application to this subject also, so all the texts that have been cited in support of Non-intrusion may be adduced with equal propriety as irreconcilable with Patronage, even in its most restricted form. Had it been intended in the Church that such a high and responsible power as is implied in the nomination of a minister should be lodged in a peculiar class of the members of the Church, we should certainly have expected to find some directions specially addressed to them, to guide them in the exercise of it. And the fact that we find no such directions, affords at least a presumption that it was not designed they should possess the power. The presumption becomes stronger, and amounts almost to certainty, when we actually find in the Bible such directions addressed, not indeed to a select few, but to the whole body of the disciples.

There is a strong implied argument against any system of nomination, and much more against Patronage, contained in the exhortation, “Beloved, believe not every spirit, but try the spirits whether they be of God;” or in the following, “Beware of false prophets.” The mere fact, indeed, that every exhortation on such a subject is addressed to the whole body of believers, implies that they were all to be possessed of equal privileges, in the matter of a Minister’s settlement. They are spoken to as occupying the same ground, as having the same standing in the Church, and possessing an equal voice in the trial of the spirits. They are enjoined to the discharge of a solemn duty, in a matter in which all have an equal interest; and it is manifestly anti scriptural that an equality, either of right or of obligation, should be created, where it was plainly intended none such should exist.

Besides, from the connexion in which the above passages stand, and the declared purpose for which such injunctions were given to the disciples, it is sufficiently clear that the ordinance of Christ for keeping false prophets out of the Church, is by giving the trial of them to the body of disciples, on whom this duty and responsibility is laid. It is common enough to hear a great deal said about the unfitness of the Christian people, on the one hand, to choose their own ministers, and on the other, about the obvious advantage likely to result from the nomination being lodged in the hands of those who are of superior rank and learning, and the remedy which the Church courts have in their own hands against any possible evil, by a more rigid examination and trial.

Now, without attempting to deny that a godly and intelligent Patron, and a faithful Presbytery, may do much to keep out of the Church wolves in sheep’s clothing, it would be well at the same time to remember, that the great check suggested by Him who is the fountain of all wisdom, is the trial by the disciples. Where this is restrained from its full and free exercise, or altogether prevented, the barrier which Christ has thrown around his flock is impaired or destroyed, and we cannot expect that they shall be kept safe in any other way. By devices of mere human wisdom the Church was never yet defended or prospered, and the only security we have, is to follow implicitly the counsels of the Great Shepherd. He has given it in charge to His people to try the spirits, to guard against false prophets, and it becomes us to beware how, in the smallest degree, we interfere with the divine arrangement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 34.</span></figcaption>

</figure><figure class="quote" id="q-955ba2332e" data-kw="marks word sacraments duty join true church">
<blockquote><p>Is the truth of doctrine which is held in any assembly, or its conformity with the word of God by the pure preaching and profession of the word, and the lawful administration and use of the sacraments, a mark of the true visible church? We affirm against the Romanists. After having treated of the nature, properties and adjuncts of the church, the order demands that we discuss its marks. This question pertains to its external state and is of the highest importance in religion. For since salvation cannot be obtained except in communion with the true church and many glory in this sacred name who are destitute of its truth, it is of great value to know its true marks that we may be able to distinguish the true fold of Christ from the dens of thieves and dens of robbers.</p></blockquote>

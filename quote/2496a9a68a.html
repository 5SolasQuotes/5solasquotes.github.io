<blockquote><p>3. That there is a difference betwixt the essentials and circumstantials of presbyterial government; the one being such as are of divine or scriptural institution, and in themselves unalterable; the other being such as are of positive human institution, which are to be regulated by that great end of edification, and therefore may be altered accordingly as they do or do not contribute for that end. It is observable that the resolution Brethren in this and sundry other of their papers do in many of these challenges which they bring against the protesting Brethren (as proceeding in their planting of churches and ordaining and admitting of [ministers?], and propounding of overtures for purging and planting the Church in such a disorderly way as is destructive to the being of the government, we say, they do confound these things, and oftentimes take circumstantials for essentials: As for instance, that a minister shall be ordained by a plurality of presbyters, we hold with them to [???] of scriptural divine institution, but that he be ordained by such a number, officiating in such bounds, the Scripture has not determined; And therefore, if the major part of a presbytery conspire for keeping out a godly man from the ministry that is lawfully called by the congregation and rightly qualified, because he is not of their judgment in declining courses, it’s no breach upon the being and essentials of the government that he receive his ordination and admission to the ministry from a neighboring presbytery, especially when this conspiracy is generally throughout the country, and no remedy thereof can be had by a superior judicatory: So in the case of the overture in hand, though because of the present condition of synods, and for edification, there be a little alteration of some things from the common way of order, yet does it not involve anything destructive to the being of the government. No persons are desired to be upon these visitations but ministers and elders duly qualified, and members of the respective synods; No power is desired to be given but that which is properly ecclesiastical; Nor is it desired to be derived from any fountain, but from the synod itself; Nor to proceed by any rule but by the Word of God and the acts of uncontroverted [former] General Assemblies [which allowed and executed such]; Nor are they to exercise it independantly, but with subordination unto, and being accomptable to the synod from whence they do receive it… Is it tyrannically to impose, to desire the synod for the better and more unanimous carrying-on the Work of God, to ratify the nomination of some of the choicest of their own members, made by no forinsic persons, or party, or power, but by the intrinsic members of the synod itself, and that in such a distracted condition of the Church, and that they are not comptable [accountable], is alleged gratis [freely without warrant]. The Article, as propounded to our Brethren, does expressly provide that these committees shall in their proceedings be comptable to the synods, nor does that clause of the synods not reversing anything done by these [smaller] committees, without the previous advice and consent of the [larger] general committee of delegates, import anything to the contrary, but that the synod may take an accompt of the proceedings of their own committee, and admonish and rebuke them; yea, and take away their commission and power, in the case of mal-administration, and give it to others of their number, nominated as aforesaid: And for a jurisdiction by this means set up above themselves, we can see no such thing in the Overture, but only a power of advice upon the part of these delegates (which yet the synod are not simply tied by the Overture to follow, as in the case of their advising the synod to reverse the deeds of these Committees) and a brotherly condescension in the synods in the present condition of the Church, not to reverse things done by these committees without the advice and consent of these delegates. Neither will our Brethren’s negative voice prove it; because as these delegates have not a negative voice in all cases, as we have already showed, to wit, in the case of ratifying of the proceedings of these committees, the synod being free, notwithstanding anything in the Overture to ratify, albeit the delegates should not consent, but advise otherwise; So it is a new device to say, that a negative voice infers a superior jurisdiction and power; for, at most it makes but a co-ordinate power: And that there is any absurdity in this, that a committee of delegates, nominated by the common consent of all the synods, should, in this condition of the Church, have such a power (if yet it be a power of jurisdiction) we do not see. 4. This Overture was not propounded as a perpetual standing way, always to be followed and kept up in the Church, as our Brethren are pleased to insinuate, much less was it propounded hereby to lay a way for perpetuating of differences and contentions (a prejudice also they are pleased to load it with) but, as it expressly bears, to continue only till the present differences be healed, or, till the Lord in providence minister some better way for settling peace amongst us. Will the resolution Brethren in this present sickly declining and distracted condition of the Church, allow of no remedy for purging thereof and composing differences, that is in any circumstance out of the common road of the ordinary procedures of presbyteries and synods? We know that they will tell us that the Church is sound and healthy, and sufficiently able by presbyteries and synods to purge herself. But why then (we pray our Brethren to tell us) did the General Assembly, before these differences did arise, unanimously, judge that presbyteries and synods were not sufficiently able to do it, and did, upon conviction hereof, appoint extraordinary commissions and visitations for doing of it? … …but, that by some mean or another that is not sinfull, the House of God might be purged;… Whence it appears, that nothing will please, unless the protesting Brethren condescend, as asses, to bow down under the burden by an absolute submission to presbyteries and synods, as now constituted (that is upon the matter to the Brethren for the public Resolutions, the protesting Brethren being, by their own verdict, a few number in comparison of the body of the ministry of this Church) in their present and future actings, how negligent or corrupt soever, which themselves make evident in the next thing whereupon they impeach them, as projecters against, and subverters of the government of the Church, to wit, their refusing to engage themselves to an absolute submission to the sentences of the Church judicatories.</p></blockquote>

<blockquote><p>III. (2) We must distinguish between simple precepts (i.e., merely moral) belonging to natural right and mixed precepts (moral and ceremonial, partly of natural and partly of positive right; as the fourth commandment concerning the Sabbath, which is moral as to the genus of public worship, but ceremonial as to the circumstance of the defined time; and the fifth, which is moral as to the prescribed duty and the promise of longevity, but ceremonial as to the appended promise of the land of Canaan).</p></blockquote>

</figure><figure class="quote" id="q-bc20dc03fa" data-kw="">
<blockquote><p>If bishops would ordain presbyters by limiting words, restraining them from any essential or integral part of the office or power as instituted by Christ, and yet profess that they ordain them to the office which Christ has instituted, it is no schism for those presbyters afterward to claim (and execute in season) all the power which by Christ’s institution belongs to their office, though against the bishops’ wills: Because the bishops are not the authors or donors of the office power, but only the ministerial deliverers and investers; and therefore it is Christ and not they that must describe it.</p></blockquote>

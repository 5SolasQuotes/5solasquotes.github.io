<main class="wrap"><figure class="quote" id="q-64838143be" data-kw="">
<blockquote><p>The idea of emitting this “memorial” originated in the writer’s proposal to visit the United States of America. As the Synod of the Reformed Presbyterian body in that country had adopted measures for the public renewal of the British Covenants, – adapting them to the circumstances of those who acknowledge their moral obligation and adhere to their grand principles, in a different land, – he was desirous of contributing whatever was in his power to further so important a movement.

By relating what the Church’s exalted Head had done, in leading his servants in one country to pledge themselves anew to his service by sacred vows, and to lift up a standard for despised truths, and by exhibiting the salutary effects flowing from federal dedication, it was hoped that others might by excited and encouraged to “yield themselves to the Lord,” and might be directed in the performance of an all-important duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Memorial of Covenanting</cite>, (1857) in Works: Doctrinal and Practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 3: 257.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-be69b5645a" data-kw="">
<blockquote><p>Well spake Tertullian of this matter, Idolatry is the principal crime of Mankind, and the highest guilt of any age. God therefore so severely commanding, that we should fly from Idols and all Idolatry, though shadowed over with what fair pretences soever, that is to be counted morally impossible which cannot be done without some stain of Idolatry, &amp; grievous offending of God’s Majesty.

See here the grand and horrible hindrance, whereby the Reformed Churches are compelled, not without great grief, and horror of mind to remain out of the Communion of the Romish Church. For they so dote on their Idols, and enforce them on others to be adored, that none can come, at least abide in Communion with them, except with the same deed he will become a most manifest Idolater.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exhortation to brotherly communion betwixt the Protestant churches</cite>, (London: Richard Badger, 1641), p. 10.</span></figcaption>

<blockquote><p>There was also a paper, entitled An information against Mr Renwick’s party, given in to ministers… the papers had been left by Alexander Gordon… There was nothing on the face of the ‘information’ paper to suggest that it had not been compiled by the Carrick men themselves, but the style and substance of it pointed directly to Robert Langlands… The Societies, it charged… had imposed restrictions on ministers and cast off the whole suffering ministry… they had made ‘canons’ laying down the qualifications of those fitted to be members of their meetings, forbidding association with those they regarded as unfaithful, even to the extent of servants joining in family worship with their masters, or children with their parents;¹ and, not least, they had ‘cast off most part of the societies in the shires of Ayr and Galloway, chiefly upon these two heads, that they would not disown and condemn the [civil] declaration published by Argyle, and because they were clear to call and hear faithful suffering ministers’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preacher to the Remnant: The Story of James Renwick</cite>, (Blue Banner Productions, 2009), p. 137</span></figcaption>

 rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-0964889a91" data-kw="">
<blockquote><p>In the preface to a printed version of James Begg’s speech before the General Assembly of the Free Church of Scotland in 1868 on the subject of Irish disestablishment, he attributed Ulster’s prosperity partly to its Protestantism and warned of the evils of the British government disowning Protestantism in Ireland:

The vast importance of the subject to which it relates can scarcely be over-estimated, and although a singular amount of delusion is abroad in regard to it, it is hoped that wiser counsels may yet prevail. That any one who, having read history, has travelled over Ireland, and had an opportunity of comparing that fertile but unhappy country with other lands, can have any serious doubt as to the leading cause of its social degradation, seems incredible. Other causes, no doubt, there are, but let any one compare Belfast with Galway, Protestant Ulster with the Popish south and west of Ireland, and it seems impossible to deny that the same cause which has degraded Mexico and Spain, Austria and Italy, has visibly stamped its impress on Ireland. …

That the question of Ireland involves peculiar difficulties, especially when considered cursorily, and from a Scotch point of view, without regard to the broad issues raised, may be readily admitted. But these difficulties are not new; and what is now proposed is that the Government should, instead of reforming, not only disendow but disestablish or disown Protestantism in Ireland; in other words, virtually hand over that unhappy country to the management of the Romish priests. How such a man as Dr [Thomas] Chalmers would have acted in present circumstances cannot be doubtful; and a mere change of position cannot affect unalterable principles, founded on the Word of God.

At the present moment parties are manifestly acting in concert whose objects are totally different, and never, perhaps, was the political craft of Rome more conspicuous than in getting so many opposite classes to do her work, and that too upon pretence of seeking to destroy her influence.

The questions now raised, however, should be considered apart from individuals or parties, and we commend the following facts and considerations to the Christian people of Britain, who must think and act for themselves. They have now, to an extent greater than has probably existed since the Reformation, the power of influencing the proceedings of statesmen and of parliaments.

No such crisis as the present has occurred since the Revolution; no more important parliament than that about to assemble has been convened in modern times. And we trust the result will prove that the Protestant spirit of the country is still unbroken, and that whilst fully prepared for every measure of true reform, the Parliament of Britain will resist revolution, and maintain to the uttermost that truth and righteousness by which alone a nation can be exalted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Proposed Disestablishment of Protestantism in Ireland. In its bearing upon the Religion and Liberties of the Empire</cite>, (Edinburgh: James Nichol, 1868), pp 3, 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

d+a+mere+change+of+position+cannot+affect+unalterable+principles%2C+founded+on+the+Word+of+God.%0A%0AAt+the+present+moment+parties+are+manifestly+acting+in+concert+whose+objects+are+totally+different%2C+and+never%2C+perhaps%2C+was+the+political+craft+of+Rome+more+conspicuous+than+in+getting+so+many+opposite+classes+to+do+her+work%2C+and+that+too+upon+pretence+of+seeking+to+destroy+her+influence.%0A%0AThe+questions+now+raised%2C+however%2C+should+be+considered+apart+from+individuals+or+parties%2C+and+we+commend+the+following+facts+and+considerations+to+the+Christian+people+of+Britain%2C+who+must+think+and+act+for+themselves.+They+have+now%2C+to+an+extent+greater+than+has+probably+existed+since+the+Reformation%2C+the+power+of+influencing+the+proceedings+of+statesmen+and+of+parliaments.%0A%0ANo+such+crisis+as+the+present+has+occurred+since+the+Revolution%3B+no+more+important+parliament+than+that+about+to+assemble+has+been+convened+in+modern+times.+And+we+trust+the+result+will+prove+that+the+Protestant+spirit+of+the+country+is+still+unbroken%2C+and+that+whilst+fully+prepared+for+every+measure+of+true+reform%2C+the+Parliament+of+Britain+will+resist+revolution%2C+and+maintain+to+the+uttermost+that+truth+and+righteousness+by+which+alone+a+nation+can+be+exalted.%E2%80%9D%0A%0A%E2%80%94+James+A.+Begg%2C+The+Proposed+Disestablishment+of+Protestantism+in+Ireland.+In+its+bearing+upon+the+Religion+and+Liberties+of+the+Empire%2C+%28Edinburgh%3A+James+Nichol%2C+1868%29%2C+pp+3%2C+4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0964889a91.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0964889a91.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/10/01/james-begg-on-ulsters-protestantism-and-the-evil-of-irish-disestablishment/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-49107bfd5f" data-kw="">
<blockquote><p>Is it not fit that bounds for order and division should be set?… And is it not done in most places as well as you can desire? And where it is not… get them amended as soon as you can. In the mean time, affect not confusion: turn not all order upside down: God is not the God of confusion, but of order, which He would have established in all the Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’, p. 35</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>
<div class="actions"><button class="copy" data-copy="“Is it not fit that bounds for order and division should be set?… And is it not done in most places as well as you can desire? And where it is not… get them amended as soon as you can. In the mean time, affect not confusion: turn not all order upside down: God is not the God of confusion, but of order, which He would have established in all the Churches.”

<blockquote><p>…in such cases, where two parts of a Church are divided, having independent authorities as to one another, and there being contrary determinations in the same question, it seems convenient and necessary for peace, that either both should waive their decisions, or that both should permit the decisions of each other to stand and be in force, to such only as should acquiesce therein, and willingly acknowledge the same.</p></blockquote>

</figure><figure class="quote" id="q-13b90e1f73" data-kw="">
<blockquote><p>III. (2) We must distinguish between simple precepts (i.e., merely moral) belonging to natural right and mixed precepts (moral and ceremonial, partly of natural and partly of positive right; as the fourth commandment concerning the Sabbath, which is moral as to the genus of public worship, but ceremonial as to the circumstance of the defined time; and the fifth, which is moral as to the prescribed duty and the promise of longevity, but ceremonial as to the appended promise of the land of Canaan).</p></blockquote>

</figure><figure class="quote" id="q-9bafd09315" data-kw="">
<blockquote><p>It is said [about the divine right of Church government] that, ‘All this is but a plea for a dominion of an higher nature, even over the consciences of men by censures.’ But why a dominion? Because a power of censures? Surely, if they were not spiritual censures, and such as have influence on the conscience, we should yield a domination were the business. But this power of censuring spiritually is as strong as authoritative in dispensing rebukes, threats, Gospel-charges and commands in the Word preached, as in censures; The power is ministerial only in the Word, not lordly; and why should it be deemed a dominion, and an arbitrary power in the one, and not in the other?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), ‘To the Ingenuous and Equitable Reader’, unnumbered page</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<main class="wrap"><figure class="quote" id="q-b6b99b1f29" data-kw="">
<blockquote><p>How this [my teaching] differs from the Papists’ doctrine, I do not need to tell any scholar who has read their writings: 1. They take justifying for sanctifying, yet I do not. 2. They quite overthrow and deny the most real difference between the old covenant [of works] and the new [of grace] and make them, in a manner, all one. But I build this exposition and doctrine chiefly upon the clear differencing and opening of the covenants. 3. When they say that we are justified by works of the gospel, they mean only that we are sanctified by works that follow faith and are bestowed by grace, they meriting our inherent justice at God’s hands. In a word, there is scarce any one doctrine wherein even their most learned schoolmen are more sottishly ignorant than this of justification, so that when you have read them with profit and delight on some other subjects, then they come to this, you would pity them and admire their ignorance. 4. They take our works to be part of our legal righteousness, I take them not to be the smallest portion of it, but only a part of our evangelical righteousness, or of the condition upon which Christ’s righteousness shall be ours. But what difference is there between it and the Socinian doctrine of justification? In some men’s mouths, Socinianism is just a word of reproach, or a stone to throw at the head of any man that does not say the same thing they do. Mr. Wotton is a Socinian, and Mr. Bradshaw, and Mr. Gataker, and Mr. Goodwin, and why not Piscator, Paraeus, etc. if some zealous divines know what Socinianism is? But I had rather study what Scripture-truth is than what Socinianism is. I do not think that Faustus was so infaustus as to hold nothing true. That which he held according to Scripture is not Socinianism. For my part, I have read little of their writings, but that little gave me enough and made me cast them away with abhorrence. In a word, the Socinians acknowledge not that Christ had satisfied the law for us and consequently is none of our legal righteousness, but only has set us a copy to write after, and has become our pattern, and that we are justified by following him as a Captain and Guide to heaven. And so all of our proper righteousness is in this obedience. Most accursed doctrine! So far am I from this that I say, the righteousness which we must plead against the law’s accusations is not one grain of it in our faith or works, but all out of us in Christ’s satisfaction. Only our faith, repentance, and sincere obedience are the conditions upon which we must partake of the former. And yet such conditions as Christ works in us freely by his Spirit.</p></blockquote>

<blockquote><p>The distortion of double predestination looks like this: There is a symmetry that exists between election and reprobation. God works in the same way and same manner with respect to the elect and to the reprobate. That is to say, from all eternity God decreed some to election and by divine initiative works faith in their hearts and brings them actively to salvation. By the same token, from all eternity God decrees some to sin and damnation (destinare ad peccatum) and actively intervenes to work sin in their lives, bringing them to damnation by divine initiative. In the case of the elect, regeneration is the monergistic work of God. In the case of the reprobate, sin and degeneration are the monergistic work of God. Stated another way, we can establish a parallelism of foreordination and predestination by means of a positive symmetry. We can call this a positive-positive view of predestination. This is, God positively and actively intervenes in the lives of the elect to bring them to salvation. In the same way God positively and actively intervenes in the life of the reprobate to bring him to sin. This distortion of positive-positive predestination clearly makes God the author of sin who punishes a person for doing what God monergistically and irresistibly coerces man to do. Such a view is indeed a monstrous assault on the integrity of God. This is not the Reformed view of predestination, but a gross and inexcusable caricature of the doctrine. Such a view may be identified with what is often loosely described as hyper-Calvinism and involves a radical form of supralapsarianism. Such a view of predestination has been virtually universally and monolithically rejected by Reformed thinkers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-c-sproul.html">R. C. Sproul</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Chosen But Free, Chapter on Double Predestination</cite></span></figcaption>

</figure><figure class="quote" id="q-23748f47af" data-kw="">
<blockquote><p>In 1534 Philip Melancthon, perhaps in conjunction with lectures on Colossians delivered around the same time, produced a third edition of the Scholia. In it for the first time, he increased the number of functions, or uses, of the law from two to three… …It involved the persistent emphasis on the necessity of good works… …The notion that the law has uses or functions is a peculiarly Protestant concept with origins deep within Martin Luther’s theology. Gerhard Ebeling has demonstrated how the distinction between law and gospel and Luther’s insistence that God works on human beings through the Word resulted in Luther developing a twofold use of the Law… …Definitions of two uses of the law first appeared in an exposition of the epistle lesson for New Year’s Day; this sermon was published in 1522 as part of Luther’s Weihnachtspostil and seen through the presses by Melancthon. … Luther never saw a need to increase the uses of the law above two and thus create a separate use for believers… For Luther, the human being encountered the law in the two realms of human existence: coram Deo [before the presence of God] and coram hominibus [before the presence of men]. Thus, there was never any need for more than two uses of the law. In his theology the law never had an independent existence that demanded definition, but it was always a part of the human encounter with God. The 1527 and 1528 Scholia were the first publications in which Melancthon explicitly defined two functions of the law… …in 1534 Melancthon altered this section [of his Scholia on Col. 2:17] to read: “…God gave the law for these three reasons: to coerce the flesh and to terrify or humble. The third reason pertains to the righteous, that they may practice obedience.”… …The conscience, made good by God’s gracious declaration, must by necessity use the law to please God. No wonder Melancthon’s theology now needed a third use of the law! … For what reasons did this shift occur in Melancthon’s theology? As Rolf Schafer and others have pointed out, Melancthon’s focus on the law and its third use actually had its roots in his earliest published theology… But the very fact that Melancthon somehow felt constrained to change these earlier comments to reflect even more clearly his developing position suggests that something must have happened in the meantime. A crucial factor is the memory of Melancthon’s encounter with John Agricola. There is little doubt that Agricola’s denigration of the Decalogue–itself a reaction to Melancthon’s theology–caused Melancthon to strengthen his defense of the role of the law in the Christian’s life… … There was no question, too, that some of the changes in the Scholia–one thinks particularly of the third use of the law–were refined by Melancthon in his second edition of the Loci [Common Places] and in turn employed by a young French exile, John Calvin, in the first edition of his Institutes of the Christian Religion [1536].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/timothy-wengert.html">Timothy Wengert</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Law &amp; Gospel: Philip Melanchthon’s Debate with John Agricola of Eisleben Over Poenitentia [Repentance] (1997), Ch. 6, ‘Justifying Good Work: The Origins of the Concept of the Third Use of the Law (1534)’, pp. 177, 185, 191-3, 195-6, 200, 206</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“In 1534 Philip Melancthon, perhaps in conjunction with lectures on Colossians delivered around the same time, produced a third edition of the Scholia. In it for the first time, he increased the number of functions, or uses, of the law from two to three… …It involved the persistent emphasis on the necessity of good works… …The notion that the law has uses or functions is a peculiarly Protestant concept with origins deep within Martin Luther’s theology. Gerhard Ebeling has demonstrated how the distinction between law and gospel and Luther’s insistence that God works on human beings through the Word resulted in Luther developing a twofold use of the Law… …Definitions of two uses of the law first appeared in an exposition of the epistle lesson for New Year’s Day; this sermon was published in 1522 as part of Luther’s Weihnachtspostil and seen through the presses by Melancthon. … Luther never saw a need to increase the uses of the law above two and thus create a separate use for believers… For Luther, the human being encountered the law in the two realms of human existence: coram Deo [before the presence of God] and coram hominibus [before the presence of men]. Thus, there was never any need for more than two uses of the law. In his theology the law never had an independent existence that demanded definition, but it was always a part of the human encounter with God. The 1527 and 1528 Scholia were the first publications in which Melancthon explicitly defined two functions of the law… …in 1534 Melancthon altered this section [of his Scholia on Col. 2:17] to read: “…God gave the law for these three reasons: to coerce the flesh and to terrify or humble. The third reason pertains to the righteous, that they may practice obedience.”… …The conscience, made good by God’s gracious declaration, must by necessity use the law to please God. No wonder Melancthon’s theology now needed a third use of the law! … For what reasons did this shift occur in Melancthon’s theology? As Rolf Schafer and others have pointed out, Melancthon’s focus on the law and its third use actually had its roots in his earliest published theology… But the very fact that Melancthon somehow felt constrained to change these earlier comments to reflect even more clearly his developing position suggests that something must have happened in the meantime. A crucial factor is the memory of Melancthon’s encounter with John Agricola. There is little doubt that Agricola’s denigration of the Decalogue–itself a reaction to Melancthon’s theology–caused Melancthon to strengthen his defense of the role of the law in the Christian’s life… … There was no question, too, that some of the changes in the Scholia–one thinks particularly of the third use of the law–were refined by Melancthon in his second edition of the Loci [Common Places] and in turn employed by a young French exile, John Calvin, in the first edition of his Institutes of the Christian Religion [1536].”

— Timothy Wengert, Law &amp; Gospel: Philip Melanchthon’s Debate with John Agricola of Eisleben Over Poenitentia [Repentance] (1997), Ch. 6, ‘Justifying Good Work: The Origins of the Concept of the Third Use of the Law (1534)’, pp. 177, 185, 191-3, 195-6, 200, 206">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+1534+Philip+Melancthon%2C+perhaps+in+conjunction+with+lectures+on+Colossians+delivered+around+the+same+time%2C+produced+a+third+edition+of+the+Scholia.+In+it+for+the+first+time%2C+he+increased+the+number+of+functions%2C+or+uses%2C+of+the+law+from+two+to+three%E2%80%A6+%E2%80%A6It+involved+the+persistent+emphasis+on+the+necessity+of+good+works%E2%80%A6+%E2%80%A6The+notion+that+the+law+has+uses+or+functions+is+a+peculiarly+Protestant+concept+with+origins+deep+within+Martin+Luther%E2%80%99s+theology.+Gerhard+Ebeling+has+demonstrated+how+the+distinction+between+law+and+gospel+and+Luther%E2%80%99s+insistence+that+God+works+on+human+beings+through+the+Word+resulted+in+Luther+developing+a+twofold+use+of+the+Law%E2%80%A6+%E2%80%A6Definitions+of+two+uses+of+the+law+first+appeared+in+an+exposition+of+the+epistle+lesson+for+New+Year%E2%80%99s+Day%3B+this+sermon+was+published+in+1522+as+part+of+Luther%E2%80%99s+Weihnachtspostil+and+seen+through+the+presses+by+Melancthon.+%E2%80%A6+Luther+never+saw+a+need+to+increase+the+uses+of+the+law+above+two+and+thus+create+a+separate+use+for+believers%E2%80%A6+For+Luther%2C+the+human+being+encountered+the+law+in+the+two+realms+of+human+existence%3A+coram+Deo+%5Bbefore+the+presence+of+God%5D+and+coram+hominibus+%5Bbefore+the+presence+of+men%5D.+Thus%2C+there+was+never+any+need+for+more+than+two+uses+of+the+law.+In+his+theology+the+law+never+had+an+independent+existence+that+demanded+definition%2C+but+it+was+always+a+part+of+the+human+encounter+with+God.+The+1527+and+1528+Scholia+were+the+first+publications+in+which+Melancthon+explicitly+defined+two+functions+of+the+law%E2%80%A6+%E2%80%A6in+1534+Melancthon+altered+this+section+%5Bof+his+Scholia+on+Col.+2%3A17%5D+to+read%3A+%E2%80%9C%E2%80%A6God+gave+the+law+for+these+three+reasons%3A+to+coerce+the+flesh+and+to+terrify+or+humble.+The+third+reason+pertains+to+the+righteous%2C+that+they+may+practice+obedience.%E2%80%9D%E2%80%A6+%E2%80%A6The+conscience%2C+made+good+by+God%E2%80%99s+gracious+declaration%2C+must+by+necessity+use+the+law+to+please+God.+No+wonder+Melancthon%E2%80%99s+theology+now+needed+a+third+use+of+the+law%21+%E2%80%A6+For+what+reasons+did+this+shift+occur+in+Melancthon%E2%80%99s+theology%3F+As+Rolf+Schafer+and+others+have+pointed+out%2C+Melancthon%E2%80%99s+focus+on+the+law+and+its+third+use+actually+had+its+roots+in+his+earliest+published+theology%E2%80%A6+But+the+very+fact+that+Melancthon+somehow+felt+constrained+to+change+these+earlier+comments+to+reflect+even+more+clearly+his+developing+position+suggests+that+something+must+have+happened+in+the+meantime.+A+crucial+factor+is+the+memory+of+Melancthon%E2%80%99s+encounter+with+John+Agricola.+There+is+little+doubt+that+Agricola%E2%80%99s+denigration+of+the+Decalogue%E2%80%93itself+a+reaction+to+Melancthon%E2%80%99s+theology%E2%80%93caused+Melancthon+to+strengthen+his+defense+of+the+role+of+the+law+in+the+Christian%E2%80%99s+life%E2%80%A6+%E2%80%A6+There+was+no+question%2C+too%2C+that+some+of+the+changes+in+the+Scholia%E2%80%93one+thinks+particularly+of+the+third+use+of+the+law%E2%80%93were+refined+by+Melancthon+in+his+second+edition+of+the+Loci+%5BCommon+Places%5D+and+in+turn+employed+by+a+young+French+exile%2C+John+Calvin%2C+in+the+first+edition+of+his+Institutes+of+the+Christian+Religion+%5B1536%5D.%E2%80%9D%0A%0A%E2%80%94+Timothy+Wengert%2C+Law+%26+Gospel%3A+Philip+Melanchthon%E2%80%99s+Debate+with+John+Agricola+of+Eisleben+Over+Poenitentia+%5BRepentance%5D+%281997%29%2C+Ch.+6%2C+%E2%80%98Justifying+Good+Work%3A+The+Origins+of+the+Concept+of+the+Third+Use+of+the+Law+%281534%29%E2%80%99%2C+pp.+177%2C+185%2C+191-3%2C+195-6%2C+200%2C+206&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F23748f47af.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/23748f47af.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/antinomianism/#:~:text=In%201534%20Philip%20Melancthon%2C%20perhaps%20in,Institutes%20of%20the%20Christian%20Religion%20%5B1536&amp;text=In%201534%20Philip%20Melancthon%2C%20perhaps%20in%20conjunction%20with&amp;text=of%20his%20Institutes%20of%20the%20Christian%20Religion%20%5B1536" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>It is most surprising to me that anyone can claim that I reject the law or the Ten Commandments, since there is available, in more than one edition, my exposition of the Ten Commandments, which furthermore are daily preached and practiced in our churches. (I am not even mentioning the Confession and the Apology and our other books). Furthermore, the commandments are sung in two versions, as well as painted, printed, carved, and recited by the children morning, noon, and night. I know of no manner in which we do not use them, unless it be that we unfortunately do not practice and paint them with our deeds and our life as we should. I myself, as old and as learned as I am, recite the commandments daily word for word like a child. So if anyone perchance gained some other impression from my writings and yet saw and perceived that I stressed the catechism so greatly, he might in all fairness have addressed me and said, “Dear Dr. Luther, how is it that you emphasize the Ten Commandments so much, though your teaching is that they are to be discarded?” That is what they should have done, and not worked secretly behind my back and waited for my death, after which they could make of me what they would. Ah well, let them be forgiven who cease doing this.</p></blockquote>

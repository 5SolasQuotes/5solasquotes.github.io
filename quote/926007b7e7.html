<main class="wrap"><figure class="quote" id="q-926007b7e7" data-kw="">
<blockquote><p>…there is another judgment [besides that proper to individual believing Christians] that is ministerial, official and authoritative… that what the shepherd teaches others God revealed to him first, and is put forth in a ministerial and official judging either in synods, or in public pastoral sermons and authoritative, but ministerial publishing the will and mind of Christ. Mal. 2:7, ‘They shall seek the Law from his mouth.’ Heb. 13:7,17. That way the people depends upon the ministerial judgment of synods and pastors… For pastors and synods teach fundamentals of faith ministerially to the people, and by hearing of them is faith begotten in the hearers… For this judgment authoritative as it is in the head of the Church (Christ) as in the fountain and only Law-giver, so it is ministerially only and by way of office in the elders, as the will and mind of the king is in the inferior judge, the ambassador or herald, not in the people; and the people are obliged ‘to obey those that are over them in the Lord, who watch for their souls, as those who must give an account’… and of this it is said, ‘he that heareth you’ (ministers of the Gospel, not the people) ‘heareth Me, he that dispiseth you dispiseth Me.’ And this is more than a privilege of order and honor, which one Christian has above another in regard of eminence of graces, gifts, and of wisdom, experience, and age: it is a privilege of office to speak in the name of the Lord, and yet it is inferior to a privilege of the law, because the Lord only imposes laws upon the conscience: for it is a middle judgment less than legislative, supreme and absolute over the conscience; this is in none save only in the King and head of the Church, and is royal and princely; Yet is it more (I say not more excellent, it not being saving of itself as in believers) than a privilege of mere honor and order, for though it lay no more bands on the conscience to obtain faith, because it is holden forth by men, it having no influence on the conscience because of men, whose word is not the formal object of faith, yet has it an official authority from pastors (which is not merely titulary) so as they may ministerially and officially command obedience to their judgment as far as it agrees with the mind of Christ, no farther: and when it is disobeyed may inflict censures, which private Christians cannot do, and puts these who disobey under another guiltiness than if private Christians did speak the same word, to wit not only in a case of disobedience to the Second Commandment, but in a state of disobedience to the Fifth Commandment formally, as not honoring father and mother; whereas to disobey that same word by way of counsel in the mouth of a brother, though it be the breach of the Fifth Commandment also [if the brother be superior in age, gifts, etc.], yet not in such a manner as when we refuse to hear the messenger of the Lord of Hosts; and his judgment as a messenger of God is public and binds as public to [the] highest obedience to the Fifth Commandment; but as it is a judgment of faith common to the doctor with other Christians, it binds as the mind of God holding faith in the Second Commandment what we are to believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience… (1649), ch. 2</cite>, pp. 26-7</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7196856abe" data-kw="">
<blockquote><p>All the officers of the New Testament both ordinary and extraordinary are designed and distinguished by their names, or compellations, as apostles, evangelists, presbyters, deacons. The extraordinary and superior have upon good reason the names of the ordinary and inferior common unto them, as the apostles are called ‘elders’ (1 Pet. 5:1). But this is not reciprocal, for the ordinary and inferior are never called by the names of the extraordinary and superior: the deacon is not called an ‘elder,’ nor the pastor by the name of the ‘apostle’ or ‘evangelist’. It is true that Barnabas is called an ‘apostle’ (Acts 14:4, 14) because he was an apostle [messenger] of Christ as Paul was. Titus and others and Epaphroditus are only called ‘apostles’ or messengers of the Church (2 Cor. 8:23; Phil. 2:25). Whence it must follow that the office of a bishop is not an office superior to the office of a pastor, since the name ‘bishop’ is common to the pastor; and that the office of a bishop and the office of a pastor are not different, but one and the same office, since the names are altogether common in all the places of the New Testament (Acts 20:28; Phil 1:1; 1 Tim. 3:2; 1 Pet. 5:1), and the Syriac Interpreter has translated the one by the other (Tit. 1:7). What reason can there be, while the officers are distinguished by their names and the names of ‘bishop’ and ‘pastor’ are common, but that the office of the bishop and elder is one and the same office; the one name signifying, sapientiae maturitatem [a maturity of wisdom], and the other Industriam curae Pastoralis [the industry of the pastoral oversight], says Beda.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness and danger of Limited Prelacy, or Perpetual Presidency in the Church, Briefly Discovered (1641)</cite>, pp. 3-4</span></figcaption>

</figure><figure class="quote" id="q-aca6ea0189" data-kw="">
<blockquote><p>Yea in favor of lay-elders he [Hugo Grotius] asserts (having argued them not to be of divine institution, yet): 1. That they may be lawfully instituted by sovereigns, or by the Church on their permission. 2. That it may be proved by Scripture that this institution is not displeasing to God. 3. That there are examples in pious antiquity, either of this same way, or one very near it. 4. That it is no contemptible benefit that by these elders may be received. But these [are] to exercise their office with several cautions: 1. Not claiming institution by divine precept. 2. Not usurping any of the power of the keys, nor of excommunication, further than excommunication belongs to the people (executively). 3. That the men be not unmeet. 4. Exercising no external jurisdiction but by public law. 5. Standing as mutable. Thus far Grotius.</p></blockquote>

<blockquote><p>Question 6: Beza gives the keys to both pastors and elders. Cartwright denies the keys to any except only to pastors. But Daniel Nilius, the keys (says he) were given to Peter, ratione officii, by his office, and not to the apostles only, but also to all who were to be sent to preach and govern. Answer: The keys by the preaching of the gospel, potestas concionalis clavium [the preaching power of the keys], were given to Peter as representing all pastors and doctors, tanquam subiecto adaequato [as an adequate subject]: The keys by way of disciplinary binding and loosing were given to Peter, tanquam, subiecto virtuali [as a virtual subject], representing not only pastors, but also doctors and ruling elders, who were to be called and sent of God. Question 7. How can any voice in matters of religion, but only pastors, for ruling elders are not pastors. So [Richard] Field [an Anglican]. Answer: It is Jesuit-like to reason thus with Bellarmine, who says it is a pastoral act to define in councils; and therefore none should teach in council (says Panormitan in the Council of Basil) but prelates who are the pillars and keys of Heaven. So said Eccius. But the Council of Basil thought not so, nor the Greek Church, for whom Nilus speaks, alleging others whom it concerns should voice also. 2. Matters of discipline concern all, Ergo [therefore], elders representing the people should voice. 3. Suppose that the suffrage and voice of a pastor, and of an elder be voices different only in diverse relations to diverse officers, to wit, the pastor and the elder; yet in the matter of bearing weight in the conscience from force of truth, and not from the authority of men, they are equal; and therefore ruling elders having knowledge and light, and withal authority of office may well have voices: But it follows not hence that these who have knowledge are formal canon-makers, because the decrees and constitutions of synods lay two obligations upon the people: One for the matter, and so in respect that in the moral part thereof they must be agreeable to the Word, they bind the consciences to an obedience of conscience. 2. They impose an ecclesiastical tie from the authority of the council and canon-makers, and so they require subjection or obedience of reverence for the authority-official that is in the canon-makers: The second command lays on the first bond or tie, and the first command lays on the other bond and tie.</p></blockquote>

</figure><figure class="quote" id="q-acd0b817f0" data-kw="">
<blockquote><p>Nor are women, sons, servants, debarred from voicing in election because it is a Church-power, for it is no power of jurisdiction. For: 1. Their tacit [understood or implied without being stated] voices and consents are not excluded, because they must try the spirits, and not upon trust and fide implicita [implicit faith] believe every teacher more than men, or believe as the Church believes, more than their husbands, nor must they take doctrines as truth upon their husband’s word; nor are women so excluded from speaking in the Church as [that] they may upon no occasion: confess their faith, 2. profess vocally repentance, 3. depose as witnesses, [or] 4. accuse the guilty before the binding Church. 4. Nor may a [civil] corporation cast out a major [an official] by an authoritative power such as binding and loosing is, Mt. 18 [that is, the power by which they do it is not of the same kind as ecclesiastical power]. 5. We seek a warrant why the votes of women in choosing their pastors must more be included in the votes of the male than their being essential parts of the redeemed Church is included in the males, or their confessing publicly that Jesus is the Christ, as many women martyrs and sons and servants have gloriously done; and yet their confession of Christ to the death must be personal, and not included in the confession of husband or parents, as Mt. 10:32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker… (London, 1658)</cite>, p. 257</span></figcaption>

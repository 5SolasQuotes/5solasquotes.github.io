<main class="wrap"><figure class="quote" id="q-0045f10a1c" data-kw="">
<blockquote><p>We do upon very good reason judge the Church of England in the midst of her Ceremonies, to have been a true Church, &amp; the ministry thereof, notwithstanding the many blemishes &amp; corruptions cleaving unto it, to have been a true ministry, and shall never deny unto them that praise, whether in debating controversies with Papists, or in practical Divinity for private Christians, which they do most justly deserve.

Upon the other part, we are neither so ignorant nor so arrogant, as to ascribe to the Church of Scotland such absolute purity and perfection, as hath not need or cannot admit of further Reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation of Church-Government in Scotland, Cleared from some mistakes and prejudices, by the Commissioners of the General Assembly of the Church of Scotland, now at London</cite>, (London: Robert Bostock, 1644), pp 14-15.</span></figcaption>

<blockquote><p>Sin is a sweet morsal that makes God’s elect sick souls ere they get it vomited up; it leaves a sting behind it, which some one time or other will create them no little pain. Elihu shows us both the case and cure, Job 33. Behold the case one may be in whom God has thoughts of love to: He darts convictions into his conscience, and makes them stick so fast, that he cannot rid himself of them, v. 16; his very body sickens, v.

19. He is chastened also with pain upon his bed, and the multitude of his bones with strong pain: He loses his stomach, v.

20. His life abhors bread, and his soul dainty meat. His body pines away, so that there is nothing on him but skin and bone; He is looking every moment when devils, those destroyers, Heb. 9:11, those murderers or manslayers, Jn. 8:44, will comeand carry away his soul to Hell. O dreadful case! yet there is hope. Now, see how the sick man is cured: The phsician’s art cannot prevail here; ‘Tis soul-trouble that has brought the body into this disorder.</p></blockquote>

<blockquote><p>News of the ordination of Cameron [by Robert M’Ward and John Brown of Wamphray in the Netherlands in late-July or early-August 1679] and [Thomas] Hog was swiftly carried back to Scotland, where it caused a predictable outburst of indignation amon the older nonconforming ministers. John Carstairs, one of the most senior among them, wrote bitterly to M’Ward on 20 August: ‘I somewhat wonder you have there ordained those two young men–not so very acceptable, to say no more, to the Church of Scotland. I fear it offends many; nor do I see, especially at this time, how it can be so well justified. Do you think that there is no ministerial church amongst the nonconforming ministers in Scotland to ordain whom they think fit to be ordained? And is it suitable to that Christian correspondence and deference that the churches of Christ ought to have with and to one another that a few ministers of the church in Holland should ordain ministers for the Church of Scotland without their desire, consent , allowance or knowledge?’ Carstairs’ view was certainly typical of many of the older and more influential of the ministers, and his letter clearly reflected their resentment at what they saw as a usurpation of their ministerial functions by M’Ward and Brown. It also gave an indication of the sort of reception Cameron could expect on his return to Scotland [in late-1679]. A further hint of the welcome that awaited him was given in a letter from John Dickson to M’Ward on 16 July: ‘As for Mr Cameron, the prejudice against him is screwed up so high that no vindication will allay the feverish spirits of some persons who are maddened against him.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron</cite>, (Durham: Evangelical Press, 1997), p. 163</span></figcaption>

</figure><figure class="quote" id="q-dbd8bb0cb4" data-kw="">
<blockquote><p>Social covenanting has been one distinguished means of maintaining the Divine cause in the world. The national profession of Israel was ratified by the national oath at Horeb. This covenant was renewed forty years after on the plains of Moab; and the notable seasons of revival in the days of Joshua, Asa, Nehemiah, and others, were accompanied by national vows to the Most High.

The Jewish Scriptures abound with notices of these covenants; every prophet cries out against the land because of the breach of them; and the inference naturally suggested by this to every man, whose understanding is not snared by the entanglements of party opinion, would be that these things are written in Scripture, and diffused throughout the world, to teach the nations to avouch the Lord to be their God.

Such was the inference drawn by the most famous among the reformed churches. Never – not even in the days of Asa, when all Judah rejoiced because of the oath – not even then was covenanting more eminently countenanced by the Divine blessing than it has been among the churches of the Reformation. So early as 1530, when the Reformation was only in its infancy, while it was yet struggling for existence with numerous, powerful, and embittered foes; the German reformers entered into a league to support and defend one another in adhering to and maintaining their religion and liberties. Similar covenants were entered into by other Protestant states, and under God were the means of consolidating the triumphs which Protestantism had attained.

In no land has covenanting been more frequently engaged in, or more signally countenanced, than in Scotland. Hence the name bestowed upon that church from an early period — THE COVENANTED CHURCH OF SCOTLAND. Before the period of her establishment by the state, the Church of Scotland was a covenanting church, and she continued to be a covenanting church from the Reformation till the Revolution.

It was by covenanting that our fathers were cemented into godly union, and inspired by that victorious energy which rendered them triumphant in their struggles against Popery, Prelacy, and Erastianism. When these enemies of civil and religious liberty came in like a flood, the standard raised against them by the Spirit of the Lord was the banner of the covenant. Under this standard the armies of the Lamb in Scotland went down into the battle, and performed those deeds which shall be had in everlasting remembrance. To expunge the covenants from the history of the Church of Scotland would be, not only to rob it of certain facts, but to deprive it of its vital spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Covenant the best Defence of Christ’s crown; or our National Covenants Scriptural, Catholic, and of Permanent Obligation</cite>, (Edinburgh: W. P. Kennedy, 1844), pp 1-2.</span></figcaption>

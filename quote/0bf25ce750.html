<main class="wrap"><figure class="quote" id="q-0bf25ce750" data-kw="">
<blockquote><p>The [Westminster] confession… acknowledges that issues of worship and church government must be inferred in a general way from Scripture in concert with “the light of nature and Christian precedence.” [WCF 1.6] The doctrine of Scripture is thus safeguarded from a wooden rationalism, and, in the life of the church, the realm of adiaphora is carefully marked out and preserved from a rigoristic biblicism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, , ed. (Baker Academic, 2003), vol. 1; p. 89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-91f1d74d37" data-kw="">
<blockquote><p>For when some have taken up a private interpretation of any place of Scripture, if, before they have thoroughly imbibed and vented it, they do not submit their conception, although they seem to be greatly satisfied in it and full of it, unto the authority of the Scripture in the declaration of its own mind in other places, there is but small hope of their recovery. And this is that pride which is the source and original of heresy, -- namely, when men will prefer their seemingly wise and rational conceptions of the sense of particular places before the analogy of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Causes, Ways, and Means of Understanding the Mind of God</cite>, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-d4bd5dd7bb" data-kw="">
<blockquote><p>The Bereans are praised for not rashly and hastily receiving whatever Paul taught them, but diligently examining his doctrine by scripture. Whence we draw two inferences: First, that all doctrine is to be judged by the scriptures. For, if the Bereans compared the preaching of an apostle with the rule of scripture, shall we embrace without any examination whatever the pope may please to maintain?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Controversy 1, Q. 5, ch. 8 (p. 457)</span></figcaption>

</figure><figure class="quote" id="q-07abf794c2" data-kw="">
<blockquote><p>Do the papists make a reasonable demand, when they would have us submit ourselves to his judgment, and depend upon his interpretation, whom we accuse as a false interpreter of scripture, yea, whom we affirm to be the very antichrist himself?</p></blockquote>

</figure><figure class="quote" id="q-8292d341b5" data-kw="">
<blockquote><p>I do not doubt that the most ancient fathers, to whom the coming night was the end of one day and the beginning of another, followed this mode of reckoning. Although Moses did not intend here to prescribe a rule which it would be criminal to violate; yet (as we have now said) he accommodated his discourse to the received custom. Wherefore, as the Jews foolishly condemn all the reckonings of other people, as if God had sanctioned this alone; so again are they equally foolish who contend that this modest reckoning, which Moses approves, is preposterous. The first day: Here the error of those is manifestly refuted, who maintain that the world was made in a moment. For it is too violent a cavil to contend that Moses distributes the work which God perfected at once into six days, for the mere purpose of conveying instruction. Let us rather conclude that God himself took the space of six days, for the purpose of accommodating his works to the capacity of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1:5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

<blockquote><p>The king of Babylon sinfully exacted from king Zedekiah of Israel an oath to serve him. Zedekiah broke this oath and would not serve him in that broken and declining Church-state. God condemned Zedekiah for it, seeing as he should have kept the sinfully exacted service (Eze. 17:11–19).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3e1492dd2c" data-kw="">
<blockquote><p>By these steps we are come at last ad sacras columnas, to those sacred pillars on which the holy [Solemn League and] Covenant [1643] hangs almost in every church, as a sanctum aeternitati, a law sacred to eternity. The hands which hung it there have not (they say) power to take it down again. Who therefore may undertake to tell these persons that they actually are or else may be freed from it, seeing they find themselves obliged if they can, to tie all the world with them in the same sort of knot? Here is certainly a zeal worthy to be • ixt on that, which should oblige always; and the world must confess that there has been no public oath taken by any person anywhere who have been more scrupulously attent not to double with their God in relation to his part in contract. But yet let not these consciences be scandalized if I say it was compiled by none but mortal men, taken only by such, and as a promissory oath cannot possibly be free from those exceptions and accidents wherewith time changes the constitution of all those things, which it does not absolutely destroy, wherefore upon a sober review of all I doubt not, but as many oaths and leagues are transient, so to show that this according to its nature, and as it is originally a league or covenant, that is, as it is a formal compact, relating to the public and united corporation of several nations and magistracies (by which each people were united together, and without which neither people were respectively to act anything separately within and against themselves): I say I doubt not but to show that such a covenant, upon what has intervened is expired to us the people of England, and that without any default of ours; and though our Magistrate would give it a new life and obligation; yet to many principal things it can oblige no longer; and for the next we are to consider that though something of our first end in reformation stream through the Covenant; yet its spring-head rises higher than it; which end we are in all forms to pursue still, and are now left tied to so much of the Covenant only as we were obliged to for all our days withal our mights and souls, before we took it at all. Lastly, if it were granted, that the Covenant is not expired, yet I shall here show, that our submission to this present government is no way inconsistent with it. In which few words, though I have stated the main of its difficulties, yet ere I apply myself to answer objections, I shall briefly premise what I have observed others have omitted, it being hard to find how we may be untied from a thing till we have found how the knot at first was made. Whatsoever we can say, affirm or deny, is either assertory or promissory. The first relates to the time past or present (is if I affirm Titius to be, or have been at Rome) and therefore upon the very saying or swearing, the whole truth and obligation is fulfilled, and passed with the time which accompanied it. The other relates to the time present, as it is then sincerely said or sworn; and to the future for the sincere fulfilling them, which yet is dubious, conditional and not in our powers, as when Titius promises Sempronius when his ship returns. For this reason some say all promissory oaths are absolutely unlawful, because oaths must be true and certain; but all future effects of things are uncertain. I answer: That for so much as concerns the form of my oath here, it is true and certain, that my mind and words went truly together in the act of swearing and that I will make my deed and words go truly together, when the supposed condition betwixt us (and which, as we mutually consent to, is in neither of our powers at present) shall absolutely come to pass. This was the case of Abram’s servant when he swore to take a wife for Isaac; a future (in several circumstances) very uncertain, both in respect of what might happen to the servant, to Isaac and to the virgin; we know what happened to Job’s children and family through the accident of war and the malice of the Devil, and how Joseph was shuffled away by his own friends and kindred. It is not enough to say, such supposed tacit conditions cannot be in oaths, for: First, if such conditions be in promises, and that I may lawfully make a promise to another, then I may lawfully swear a promissory oath to him which we see cannot be separated from such conditions as are not, cannot and need not be expressed betwixt us at the beginning. For (to take away the supposition of fraud betwixt us) we both agree in this that we cannot foresee with what circumstances our futures may be perplexed. Therefore it is sufficient that we swore things not necessary, but possible; such as might happen or not happen, because depending on things which depend not totally on us, nor on our will, but rather mixedly on the wills of others, and on that which to us is change or fortune, for which reason he is not forsworn who effects not always what he by oath promises, no more than he sins who always effects not his simple promise. Secondly, this tacit condition in a promissory oath and in things naturally and morally possible, is proved by the very nature and definition of the oath. For it is only an attestation and imprecation of God in such manner, that if the promiser fail, he would have him to whom he promised, understand that he puts himself under God’s severe wrath. From hence it is to be noted that the bare promise obliged as strictly before he swore as after he swore; and of the reason is: Because he was obliged by nothing but by that which was in pact. The investing it with an oath, or with God’s punishment, relates only to the penalty: so that a promissory oath signifies no more than such a penalty upon such a promise: But a penalty (as we know) in law and equity relates only to that which is unlawful, such as is the violation of a pact. The addition of never so many penalties, to a thing in itself unlawful, can never fasten any obligation on me to do it; Nor can several penalties to an obligation in itself lawful, add anything to the first jus or right of it, but only to my future fear, lest I do injustice. The capital question therefore in these cases will be: What the nature of the things are to which we obliged ourselves at first? For according as they stand or fall, our relations or obligations, to them stand or fall whither we will or no. Thirdly, we find such tacit conditions concealed and supposed in the oaths of Solomon to Bathsheba, of David concerning Nabal’s house, of God concerning the destruction of Ninevah and of Abram’s servant concerning Isaac’s wife, etc. By a reflection on all this, viz. that seeing there may be a promise, and consequently a promissory oath, and that the nature and obligation of a promise and of such an oath is one and the same, we have gained a great point: that the Covenant (which is a promissory oath) is not in its own nature of an eternal obligation, but is involved in tacit conditions and accidents of the world, which may justly incumber us from effecting it, or from being further obliged to it, as well as other promises may, which yet are made bona fide [by good faith] at the beginning. The difficulty only is to see, whether de facto that has intervened which has now taken away the formal and original obligation, which we of the people had to it at first, by authority of our magistrate, and so taken away, as we may be secure and out of fear of the penalty, which we then submitted to in it. I shall not here make use of what others have laboriously argued, that the matter of the Covenant is such as we cannot be obliged to, but let it be as good or as bad as men please to suppose; I say in the first place, that all the good or bad, was formed into a political oath, authorized upon two kingdoms, by the sanction of two public magistracies, who as collaterals obliged themselves to cooperate faithfully together and obliged those of their distinct nations to cooperate respectively and subordinately with them for attaining a former end in such a way of reformation as is therein expressed; but by such means, as they in their public and respective capacities, not we in our particulars should judge most consonant to equity and true to religion. For which reason we happily are pointed at there, only in our private places and callings. Here therefore there is a relation of several things concurrent, viz. of two magistracies united as a means for the easier reaching the end of those respective reformations which they were obliged to make before they entered in league, and of two people, who by the union of their respective magistracies, pass (for so much as is therein expressed) into an union one with another, and are to have their private capacities and endeavors managed by them, and never against them by any virtue of this league. Besides it is a considerable circumstance in the magistrates managing the whole, that states or civil constitutions by reason of the diseases of ambition and avarice, are naturally as much subject to future changes, as any other things are; and without the supposition of tacit conditions, we may as little swear to preserve the State of a public body, as we may swear to preserve the State of our own particular bodies, or as a parent may to preserve his child, which when it shall be taken away by diseases, or by justice, he may be sorry for the loss, but may not justly complain of it. And indeed so it is come to pass without any default in us of the English people, or of our public magistrate (under whom we were to act in these private places and callings) that neither of us can be said to have laid the Covenant aside, although we could not keep it from expiring, because the failing was in that which was never supposed to be in our powers, viz. in many conditional things which came cross and in the breach of fidelity in another collateral and concurring power. If you please to object here as an aggravation and an incitement for us of the Covenanted people to rise kill and slay, that the Covenant is buried not as a thing really expired and dead, but that the people out of interest must be told so, only because the former magistracy is really laid aside and changed [by Cromwell’s regime], which if people should thoroughly consider, would quickly make them find matter enough in the Covenant to take arms. I shall not in the way of answer to this repeat anything concerning the cause, the means and the concurrences to this our present change; every covenanter both of England and Scotland, knowing well that there was no change of government here till the Covenant was nationally broke (and so many here were ensnared, both Royalists and Parliamentarians) by the Scots, who thought to have used it for a change of government, and as a stratagem to give law in another judicatory: Neither shall I argue in this place, how compatible any change may be with a covenant so conditional, in which kings as parties are totally excluded from judging either for themselves or for others, which point shall be further argued at last; But I shall content myself to take what is here granted in the objection, viz. that the government is really changed [by Cromwell’s regime]; The consequence then to us of the people will be, that seeing by the fourth article of the [Solemn League and ] Covenant [1643], we may not without apparent breach of it act the sense of the Covenant, but as we receive it from our respective and supreme judicatory of England only, and that the said government which it relates to, is confessed to be gone, have you not then clearly confessed that the obligation to act anything publicly by Covenant is likewise gone? according to an old axiom, Sublato relato tollitur correlatum [By the relative being removed, the correlative is taken away]. If this present government which we are changed to, and which now protects us, should think fit by the way of Covenant to give a new life to that remaining part of it which may be observed, yet you [who deny that Cromwell’s regime is legitimate] will not allow any obedience to them, though in things never so lawful; Neither will that fourth article allow me to obey any foreigner, nor those without whose consent the Covenant was made, and consequently without whom it is to be interpreted, as the late proceedings of the Scots at the Hague plainly show: So that after all this, if I in my private capacity be as you say still indispensibly obliged by it, to begin or assist to public troubles [rather than to submit to Cromwell’s government], do you not fall into a worse absurdity and maintain an oath against the Fifth Commandment, or against all magistracy, which is an impossibility? Nothing ever cautioned in terms more expressly for our duty of making discoveries, of bringing to condign punishment, of our supreme respective judicatories and the like than the Covenant did, which are things relating to none but our supreme magistracy, unless you please plainly to assert another absurdity, that every single man who has taken it, is thereby absolved from his magistrate, and is made one himself to judge of the other, and thereby authorized not by way of toleration to profess but to establish what religion he would, to punish at his own tribunal whom he would, and to reform the state as he would. For he to whom you will allow a capacity of making war, has also a capacity of making peace, and laws for the security of his peace. Thus we see how the government is changed, and the formal obligation of the Covenant at an end; But what if I should grant you by the way of supposition, that in case both the Covenant and the former Government were standing together in as full force as you desire, and as it was when the Scots first delivered the king up to the parliament of England? I would then know of you whether if our Parliament had then for reasons best known to themselves (and of which we can never judge competently) declared us of the people, free from any further obligation of the Covenant, might we justly have thought our solemn league at an end, and that we ought to act nothing publicly any longer by it? If you will say we should have been still obliged to act upon it, then I ask you again under whom? For I have proved it must be always under a magistrate, and you have all along proved that it must only be under our lawful magistrate, how lawful soever the thing be in itself which is commanded, you would not allow the king to be the person to be obeyed, whom you thought fit to keep in an imprisonment. The Parliament (according to our supposition) would not be any longer obliged to it, or be obeyed in it, and the Scots acknowledge themselves in the fourth article to be the supreme judicatory only of Scotland, and I cannot act publicly by a private capacity or magistracy. Therefore in such a case, the Covenant how good soever, had not obliged any longer, nor is it in itself eternal. You will not deny perhaps but one man may free another from an oath when it is for the worldly profit of him who pleases to release it, as every man may throw away anything of his own right; but you will not allow it in sacred things where God is a party. I answer: [Firstly,] That though no parent can dispense his wife or child from the fear of God and the duties they owe to him, yet he allowed him to break the child’s vow for giving him a sacrifice, and both to be guiltless [Num. 30]; and then why may not we be now absolved, if our public parent judges it not fit that we should be any longer tied formally to a conditional oath; though it have relation to some sacred things? You will say no, because the parent did not as a party solemnly concur to the child’s vow, and having never consented he might the better dissent; but our public parent did concur at a party to our oath. The Parliament and people took the Covenant jointly together, and it is said that if the father hear the vows and contradicts them not in the same day, then he confirms them and cannot break them without iniquity. To this I reply: First, that, v.16, it is said the child is free after the dissent of the parent, and that the parent is charged with whatsoever was amiss in him, which is excuse enough for us of the people. Secondly, the difference is great in a main point of the parallel; because after the concurrence of the father to the child’s vow for sacrificing something to God, that might be completed in the temple without his further helping it on; but we cannot do anything in our case without the cooperation of our public parent all along, neither can he do anything without the concurrences of many other possible, but uncertain conditions, and if he in effect find those conditions have come contrary to his public endeavors, what may we do? Will it be enough for us to rest in having attempted the utmost of our private endeavors with him? or will you authorize every man upon private judgment or interpretation to begin a war in his own sense. A league or pact authorized betwixt private neighbors over a whole nation or over part of it, is not as a league betwixt prince and prince: because these have conditions expressed how and when to begin war upon one another in case their leagues be broken. But there is no such thing expressed in terminis [in the terms] in that Covenant which we have made one with another, and which we made subordinately to our magistrate: so that if we or the magistrate fail, we are equally left to God’s justice solely and to the forfeiture of our own penalties due to him, and everyone is to answer for his own deficiency in his own station: And being left to ourselves again, we are left to act only so much of our oath or of the ancient end of it, as we were bound to before we swore: which is a great deal; because we were bound by precept before we were by promise all the days of our lives to do our utmost for the glory of God, and the good of our neighbor. Secondly, princes or states who by the supremacy of their powers are able to make laws for their separated kingdoms; when they unite their supreme powers, they are able to make a common law for all their kingdoms together, which is called a league or compact; But a law when it comes to be broken (which is a public thing, and therefore of every man’s interest) may be vindicated publicly by war, and by those who have a posse regni [capacity to rule]. But I cannot say the same may be done for the Covenant, for quo jure [by which law] can it be done? The Scots, indeed, by one way of arguing make it greater than a law, and by another [way] make it less; which is when they one while affirm it unalterable and unreformable as a divine text, and another while confess it was not made by the joint concurrence of all those who with them are essential to the making [of] a public law. I conceive we may safely say it is of a constitution inferior to that of a law, and therefore its obligation is less, though its penalty be greater to the failers in it. It was made use of only as a convenient instrument or means for the better attaining [of] some laws as its end. A law it was not because it was not made by all the then legislative powers of the kingdom. For the king’s concurrence in England, if not in Scotland, was then held requisite for passing a law and he ever dissented from this Covenant. Half the inferior sort of the people have not any interest in it, nor have taken it: And not having any obligation to it, how I pray you can they justly be drawn into the penalty due to it? as they must all be, if a war (which is effectually a penal thing) be begun though by a part of the nation; for the nature of war is such that it puts a whole Kingdom into imminent danger of desolation, though but begun in a part and by a party of it. Thus far I have endeavored to show the true fast and loose of all promissory oaths, and how their obligations cease according to the nature of the things which they are affixed to. The author of the Grand Case of Conscience, p. 1, objects that if inconvenience may break a promise or disengage an oath, then many may be cheated, and David was much mistaken, Ps. 15:4, ‘Who saith he shall dwell in God’s Tabernacle, who sweareth to his own hindrance and changeth not.’ I answer: David speaks here of an oath violated by a change only in the promiser, who by his oath has passed a right to another: and therefore can no longer dispose of it again; the party to whom he swore may dispose of it as he pleases and may dispense him of it; because no man has a right to make another man keep his own longer than he please himself. It is a duty to pay a debt, but not to receive it. Finally, this is nothing to those cases where the change is not in us, but in other persons and in things which relate principally and conjointly to the fulfilling of the oath or promise. For if I promise Titius a sword at such a time, and he then chance to be mad [insane] (an accident not expressed betwixt us at first); am I bound to put it into his hands in this change because I was the first promiser? Whereas it is said, that the obligation of some things end because they can be no longer kept, as that of the king’s person, etc. He answers, p. 11, that if men shall by violence put an end to the thing, that thereby the obligation may end too, that is a breach of Covenant. A woman promises to be faithful to her husband so long as he lives; but if she, to marry another, kills him, she breaks her promise. I grant it easily that they who use violence to break lawful contracts, sin grievously; which is a thing now confessed in every Church of Scotland; but what is that to those who use no violence to break them at all, nor can help it when it is done although many be undone by it? One thing I most earnestly desire to learn in this question propounded (I guess) concerning the king’s death [in 1649]; which was a consequence of the others’ breach and tamperings. If by the Covenant we were indispensably obliged to preserve his person, how came it to pass that we were obliged by the same Covenant to wage war against him? I have heard of a distinction betwixt his power and his person, but never of any betwixt his person and himself. So that if the Covenant could have dispensed any soldier of England or Scotland to kill his person by an accident of war (as his life was oft in danger before he came to the scaffold) his death had been violent, and the obligation to preserve him had ended, and yet according to this argument the Covenant had not been broken. Why then should these men think the world so dull as not to understand plainly enough that the Covenant provided for his death more ways than one? True it is, that the Covenant held out a faint and a conditional preservation of him, and after all no man can sincerely stretch it further: From whence if we will let him judge this one controversy, he has left it recorded to posterity, in his supposed book, ch. 9, ‘In vain is my person excepted by a parenthesis of words, when so many hands are armed against me with swords.’ Moreover in his chapter of the Covenant, he feared it provided for him in a logic too loose and circumstantial. From all which what did he conclude, but that he would not allow of a Covenant-argument for his life? I know the answer here is obvious, that bullets were not shot directly against him (as few are against any in a town or in a battle) and that if he would have withdrawn his person, he should have been out of danger; but then I pray you what advantage had he in this by Covenant, more than any common soldier of either side? who when they retire, are equally out of danger; Nay he had less advantage, for by preserving him, they meant keeping him after he was rescued from others, and by keeping him they meant not him primarily, but something else, to which all consideration of him was to give way. As for others which were to be brought to punishment, they had some of them leave to go beyond the seas, others to enjoy liberties at home; and of all the excepted persons, there was never any of them who was here deprived of life, but as our troubles and wars increased, their number (which was strange) lessened even to six or seven at last, and most of those out of the kingdom. I know they have distinctions wherefore so much might be remitted to those and not to the king, although he had on his behalf the word ‘preservation’ in the Covenant, but these distinctions are but their strong justifications for that which is the bottom of this argument, if all Covenanters durst speak plainly alike.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“By these steps we are come at last ad sacras columnas, to those sacred pillars on which the holy [Solemn League and] Covenant [1643] hangs almost in every church, as a sanctum aeternitati, a law sacred to eternity. The hands which hung it there have not (they say) power to take it down again. Who therefore may undertake to tell these persons that they actually are or else may be freed from it, seeing they find themselves obliged if they can, to tie all the world with them in the same sort of knot? Here is certainly a zeal worthy to be • ixt on that, which should oblige always; and the world must confess that there has been no public oath taken by any person anywhere who have been more scrupulously attent not to double with their God in relation to his part in contract. But yet let not these consciences be scandalized if I say it was compiled by none but mortal men, taken only by such, and as a promissory oath cannot possibly be free from those exceptions and accidents wherewith time changes the constitution of all those things, which it does not absolutely destroy, wherefore upon a sober review of all I doubt not, but as many oaths and leagues are transient, so to show that this according to its nature, and as it is originally a league or covenant, that is, as it is a formal compact, relating to the public and united corporation of several nations and magistracies (by which each people were united together, and without which neither people were respectively to act anything separately within and against themselves): I say I doubt not but to show that such a covenant, upon what has intervened is expired to us the people of England, and that without any default of ours; and though our Magistrate would give it a new life and obligation; yet to many principal things it can oblige no longer; and for the next we are to consider that though something of our first end in reformation stream through the Covenant; yet its spring-head rises higher than it; which end we are in all forms to pursue still, and are now left tied to so much of the Covenant only as we were obliged to for all our days withal our mights and souls, before we took it at all. Lastly, if it were granted, that the Covenant is not expired, yet I shall here show, that our submission to this present government is no way inconsistent with it. In which few words, though I have stated the main of its difficulties, yet ere I apply myself to answer objections, I shall briefly premise what I have observed others have omitted, it being hard to find how we may be untied from a thing till we have found how the knot at first was made. Whatsoever we can say, affirm or deny, is either assertory or promissory. The first relates to the time past or present (is if I affirm Titius to be, or have been at Rome) and therefore upon the very saying or swearing, the whole truth and obligation is fulfilled, and passed with the time which accompanied it. The other relates to the time present, as it is then sincerely said or sworn; and to the future for the sincere fulfilling them, which yet is dubious, conditional and not in our powers, as when Titius promises Sempronius when his ship returns. For this reason some say all promissory oaths are absolutely unlawful, because oaths must be true and certain; but all future effects of things are uncertain. I answer: That for so much as concerns the form of my oath here, it is true and certain, that my mind and words went truly together in the act of swearing and that I will make my deed and words go truly together, when the supposed condition betwixt us (and which, as we mutually consent to, is in neither of our powers at present) shall absolutely come to pass. This was the case of Abram’s servant when he swore to take a wife for Isaac; a future (in several circumstances) very uncertain, both in respect of what might happen to the servant, to Isaac and to the virgin; we know what happened to Job’s children and family through the accident of war and the malice of the Devil, and how Joseph was shuffled away by his own friends and kindred. It is not enough to say, such supposed tacit conditions cannot be in oaths, for: First, if such conditions be in promises, and that I may lawfully make a promise to another, then I may lawfully swear a promissory oath to him which we see cannot be separated from such conditions as are not, cannot and need not be expressed betwixt us at the beginning. For (to take away the supposition of fraud betwixt us) we both agree in this that we cannot foresee with what circumstances our futures may be perplexed. Therefore it is sufficient that we swore things not necessary, but possible; such as might happen or not happen, because depending on things which depend not totally on us, nor on our will, but rather mixedly on the wills of others, and on that which to us is change or fortune, for which reason he is not forsworn who effects not always what he by oath promises, no more than he sins who always effects not his simple promise. Secondly, this tacit condition in a promissory oath and in things naturally and morally possible, is proved by the very nature and definition of the oath. For it is only an attestation and imprecation of God in such manner, that if the promiser fail, he would have him to whom he promised, understand that he puts himself under God’s severe wrath. From hence it is to be noted that the bare promise obliged as strictly before he swore as after he swore; and of the reason is: Because he was obliged by nothing but by that which was in pact. The investing it with an oath, or with God’s punishment, relates only to the penalty: so that a promissory oath signifies no more than such a penalty upon such a promise: But a penalty (as we know) in law and equity relates only to that which is unlawful, such as is the violation of a pact. The addition of never so many penalties, to a thing in itself unlawful, can never fasten any obligation on me to do it; Nor can several penalties to an obligation in itself lawful, add anything to the first jus or right of it, but only to my future fear, lest I do injustice. The capital question therefore in these cases will be: What the nature of the things are to which we obliged ourselves at first? For according as they stand or fall, our relations or obligations, to them stand or fall whither we will or no. Thirdly, we find such tacit conditions concealed and supposed in the oaths of Solomon to Bathsheba, of David concerning Nabal’s house, of God concerning the destruction of Ninevah and of Abram’s servant concerning Isaac’s wife, etc. By a reflection on all this, viz. that seeing there may be a promise, and consequently a promissory oath, and that the nature and obligation of a promise and of such an oath is one and the same, we have gained a great point: that the Covenant (which is a promissory oath) is not in its own nature of an eternal obligation, but is involved in tacit conditions and accidents of the world, which may justly incumber us from effecting it, or from being further obliged to it, as well as other promises may, which yet are made bona fide [by good faith] at the beginning. The difficulty only is to see, whether de facto that has intervened which has now taken away the formal and original obligation, which we of the people had to it at first, by authority of our magistrate, and so taken away, as we may be secure and out of fear of the penalty, which we then submitted to in it. I shall not here make use of what others have laboriously argued, that the matter of the Covenant is such as we cannot be obliged to, but let it be as good or as bad as men please to suppose; I say in the first place, that all the good or bad, was formed into a political oath, authorized upon two kingdoms, by the sanction of two public magistracies, who as collaterals obliged themselves to cooperate faithfully together and obliged those of their distinct nations to cooperate respectively and subordinately with them for attaining a former end in such a way of reformation as is therein expressed; but by such means, as they in their public and respective capacities, not we in our particulars should judge most consonant to equity and true to religion. For which reason we happily are pointed at there, only in our private places and callings. Here therefore there is a relation of several things concurrent, viz. of two magistracies united as a means for the easier reaching the end of those respective reformations which they were obliged to make before they entered in league, and of two people, who by the union of their respective magistracies, pass (for so much as is therein expressed) into an union one with another, and are to have their private capacities and endeavors managed by them, and never against them by any virtue of this league. Besides it is a considerable circumstance in the magistrates managing the whole, that states or civil constitutions by reason of the diseases of ambition and avarice, are naturally as much subject to future changes, as any other things are; and without the supposition of tacit conditions, we may as little swear to preserve the State of a public body, as we may swear to preserve the State of our own particular bodies, or as a parent may to preserve his child, which when it shall be taken away by diseases, or by justice, he may be sorry for the loss, but may not justly complain of it. And indeed so it is come to pass without any default in us of the English people, or of our public magistrate (under whom we were to act in these private places and callings) that neither of us can be said to have laid the Covenant aside, although we could not keep it from expiring, because the failing was in that which was never supposed to be in our powers, viz. in many conditional things which came cross and in the breach of fidelity in another collateral and concurring power. If you please to object here as an aggravation and an incitement for us of the Covenanted people to rise kill and slay, that the Covenant is buried not as a thing really expired and dead, but that the people out of interest must be told so, only because the former magistracy is really laid aside and changed [by Cromwell’s regime], which if people should thoroughly consider, would quickly make them find matter enough in the Covenant to take arms. I shall not in the way of answer to this repeat anything concerning the cause, the means and the concurrences to this our present change; every covenanter both of England and Scotland, knowing well that there was no change of government here till the Covenant was nationally broke (and so many here were ensnared, both Royalists and Parliamentarians) by the Scots, who thought to have used it for a change of government, and as a stratagem to give law in another judicatory: Neither shall I argue in this place, how compatible any change may be with a covenant so conditional, in which kings as parties are totally excluded from judging either for themselves or for others, which point shall be further argued at last; But I shall content myself to take what is here granted in the objection, viz. that the government is really changed [by Cromwell’s regime]; The consequence then to us of the people will be, that seeing by the fourth article of the [Solemn League and ] Covenant [1643], we may not without apparent breach of it act the sense of the Covenant, but as we receive it from our respective and supreme judicatory of England only, and that the said government which it relates to, is confessed to be gone, have you not then clearly confessed that the obligation to act anything publicly by Covenant is likewise gone? according to an old axiom, Sublato relato tollitur correlatum [By the relative being removed, the correlative is taken away]. If this present government which we are changed to, and which now protects us, should think fit by the way of Covenant to give a new life to that remaining part of it which may be observed, yet you [who deny that Cromwell’s regime is legitimate] will not allow any obedience to them, though in things never so lawful; Neither will that fourth article allow me to obey any foreigner, nor those without whose consent the Covenant was made, and consequently without whom it is to be interpreted, as the late proceedings of the Scots at the Hague plainly show: So that after all this, if I in my private capacity be as you say still indispensibly obliged by it, to begin or assist to public troubles [rather than to submit to Cromwell’s government], do you not fall into a worse absurdity and maintain an oath against the Fifth Commandment, or against all magistracy, which is an impossibility? Nothing ever cautioned in terms more expressly for our duty of making discoveries, of bringing to condign punishment, of our supreme respective judicatories and the like than the Covenant did, which are things relating to none but our supreme magistracy, unless you please plainly to assert another absurdity, that every single man who has taken it, is thereby absolved from his magistrate, and is made one himself to judge of the other, and thereby authorized not by way of toleration to profess but to establish what religion he would, to punish at his own tribunal whom he would, and to reform the state as he would. For he to whom you will allow a capacity of making war, has also a capacity of making peace, and laws for the security of his peace. Thus we see how the government is changed, and the formal obligation of the Covenant at an end; But what if I should grant you by the way of supposition, that in case both the Covenant and the former Government were standing together in as full force as you desire, and as it was when the Scots first delivered the king up to the parliament of England? I would then know of you whether if our Parliament had then for reasons best known to themselves (and of which we can never judge competently) declared us of the people, free from any further obligation of the Covenant, might we justly have thought our solemn league at an end, and that we ought to act nothing publicly any longer by it? If you will say we should have been still obliged to act upon it, then I ask you again under whom? For I have proved it must be always under a magistrate, and you have all along proved that it must only be under our lawful magistrate, how lawful soever the thing be in itself which is commanded, you would not allow the king to be the person to be obeyed, whom you thought fit to keep in an imprisonment. The Parliament (according to our supposition) would not be any longer obliged to it, or be obeyed in it, and the Scots acknowledge themselves in the fourth article to be the supreme judicatory only of Scotland, and I cannot act publicly by a private capacity or magistracy. Therefore in such a case, the Covenant how good soever, had not obliged any longer, nor is it in itself eternal. You will not deny perhaps but one man may free another from an oath when it is for the worldly profit of him who pleases to release it, as every man may throw away anything of his own right; but you will not allow it in sacred things where God is a party. I answer: [Firstly,] That though no parent can dispense his wife or child from the fear of God and the duties they owe to him, yet he allowed him to break the child’s vow for giving him a sacrifice, and both to be guiltless [Num. 30]; and then why may not we be now absolved, if our public parent judges it not fit that we should be any longer tied formally to a conditional oath; though it have relation to some sacred things? You will say no, because the parent did not as a party solemnly concur to the child’s vow, and having never consented he might the better dissent; but our public parent did concur at a party to our oath. The Parliament and people took the Covenant jointly together, and it is said that if the father hear the vows and contradicts them not in the same day, then he confirms them and cannot break them without iniquity. To this I reply: First, that, v.16, it is said the child is free after the dissent of the parent, and that the parent is charged with whatsoever was amiss in him, which is excuse enough for us of the people. Secondly, the difference is great in a main point of the parallel; because after the concurrence of the father to the child’s vow for sacrificing something to God, that might be completed in the temple without his further helping it on; but we cannot do anything in our case without the cooperation of our public parent all along, neither can he do anything without the concurrences of many other possible, but uncertain conditions, and if he in effect find those conditions have come contrary to his public endeavors, what may we do? Will it be enough for us to rest in having attempted the utmost of our private endeavors with him? or will you authorize every man upon private judgment or interpretation to begin a war in his own sense. A league or pact authorized betwixt private neighbors over a whole nation or over part of it, is not as a league betwixt prince and prince: because these have conditions expressed how and when to begin war upon one another in case their leagues be broken. But there is no such thing expressed in terminis [in the terms] in that Covenant which we have made one with another, and which we made subordinately to our magistrate: so that if we or the magistrate fail, we are equally left to God’s justice solely and to the forfeiture of our own penalties due to him, and everyone is to answer for his own deficiency in his own station: And being left to ourselves again, we are left to act only so much of our oath or of the ancient end of it, as we were bound to before we swore: which is a great deal; because we were bound by precept before we were by promise all the days of our lives to do our utmost for the glory of God, and the good of our neighbor. Secondly, princes or states who by the supremacy of their powers are able to make laws for their separated kingdoms; when they unite their supreme powers, they are able to make a common law for all their kingdoms together, which is called a league or compact; But a law when it comes to be broken (which is a public thing, and therefore of every man’s interest) may be vindicated publicly by war, and by those who have a posse regni [capacity to rule]. But I cannot say the same may be done for the Covenant, for quo jure [by which law] can it be done? The Scots, indeed, by one way of arguing make it greater than a law, and by another [way] make it less; which is when they one while affirm it unalterable and unreformable as a divine text, and another while confess it was not made by the joint concurrence of all those who with them are essential to the making [of] a public law. I conceive we may safely say it is of a constitution inferior to that of a law, and therefore its obligation is less, though its penalty be greater to the failers in it. It was made use of only as a convenient instrument or means for the better attaining [of] some laws as its end. A law it was not because it was not made by all the then legislative powers of the kingdom. For the king’s concurrence in England, if not in Scotland, was then held requisite for passing a law and he ever dissented from this Covenant. Half the inferior sort of the people have not any interest in it, nor have taken it: And not having any obligation to it, how I pray you can they justly be drawn into the penalty due to it? as they must all be, if a war (which is effectually a penal thing) be begun though by a part of the nation; for the nature of war is such that it puts a whole Kingdom into imminent danger of desolation, though but begun in a part and by a party of it. Thus far I have endeavored to show the true fast and loose of all promissory oaths, and how their obligations cease according to the nature of the things which they are affixed to. The author of the Grand Case of Conscience, p. 1, objects that if inconvenience may break a promise or disengage an oath, then many may be cheated, and David was much mistaken, Ps. 15:4, ‘Who saith he shall dwell in God’s Tabernacle, who sweareth to his own hindrance and changeth not.’ I answer: David speaks here of an oath violated by a change only in the promiser, who by his oath has passed a right to another: and therefore can no longer dispose of it again; the party to whom he swore may dispose of it as he pleases and may dispense him of it; because no man has a right to make another man keep his own longer than he please himself. It is a duty to pay a debt, but not to receive it. Finally, this is nothing to those cases where the change is not in us, but in other persons and in things which relate principally and conjointly to the fulfilling of the oath or promise. For if I promise Titius a sword at such a time, and he then chance to be mad [insane] (an accident not expressed betwixt us at first); am I bound to put it into his hands in this change because I was the first promiser? Whereas it is said, that the obligation of some things end because they can be no longer kept, as that of the king’s person, etc. He answers, p. 11, that if men shall by violence put an end to the thing, that thereby the obligation may end too, that is a breach of Covenant. A woman promises to be faithful to her husband so long as he lives; but if she, to marry another, kills him, she breaks her promise. I grant it easily that they who use violence to break lawful contracts, sin grievously; which is a thing now confessed in every Church of Scotland; but what is that to those who use no violence to break them at all, nor can help it when it is done although many be undone by it? One thing I most earnestly desire to learn in this question propounded (I guess) concerning the king’s death [in 1649]; which was a consequence of the others’ breach and tamperings. If by the Covenant we were indispensably obliged to preserve his person, how came it to pass that we were obliged by the same Covenant to wage war against him? I have heard of a distinction betwixt his power and his person, but never of any betwixt his person and himself. So that if the Covenant could have dispensed any soldier of England or Scotland to kill his person by an accident of war (as his life was oft in danger before he came to the scaffold) his death had been violent, and the obligation to preserve him had ended, and yet according to this argument the Covenant had not been broken. Why then should these men think the world so dull as not to understand plainly enough that the Covenant provided for his death more ways than one? True it is, that the Covenant held out a faint and a conditional preservation of him, and after all no man can sincerely stretch it further: From whence if we will let him judge this one controversy, he has left it recorded to posterity, in his supposed book, ch. 9, ‘In vain is my person excepted by a parenthesis of words, when so many hands are armed against me with swords.’ Moreover in his chapter of the Covenant, he feared it provided for him in a logic too loose and circumstantial. From all which what did he conclude, but that he would not allow of a Covenant-argument for his life? I know the answer here is obvious, that bullets were not shot directly against him (as few are against any in a town or in a battle) and that if he would have withdrawn his person, he should have been out of danger; but then I pray you what advantage had he in this by Covenant, more than any common soldier of either side? who when they retire, are equally out of danger; Nay he had less advantage, for by preserving him, they meant keeping him after he was rescued from others, and by keeping him they meant not him primarily, but something else, to which all consideration of him was to give way. As for others which were to be brought to punishment, they had some of them leave to go beyond the seas, others to enjoy liberties at home; and of all the excepted persons, there was never any of them who was here deprived of life, but as our troubles and wars increased, their number (which was strange) lessened even to six or seven at last, and most of those out of the kingdom. I know they have distinctions wherefore so much might be remitted to those and not to the king, although he had on his behalf the word ‘preservation’ in the Covenant, but these distinctions are but their strong justifications for that which is the bottom of this argument, if all Covenanters durst speak plainly alike.”

— Anthony Ascham, The Bounds &amp; Bonds of Public Obedience, or, A Vindication of our Lawful Submission to the Present Government, or to a Government Supposed Unlawful, but Commanding Lawful Things, Likewise how such an Obedience is Consistent with our Solemn League &amp; Covenant… (London, 1649), pt. 2, pp. 38-50 Despite EEBO-TCP attributing this to Rouse, it was most likely that of Ascham.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy+these+steps+we+are+come+at+last+ad+sacras+columnas%2C+to+those+sacred+pillars+on+which+the+holy+%5BSolemn+League+and%5D+Covenant+%5B1643%5D+hangs+almost+in+every+church%2C+as+a+sanctum+aeternitati%2C+a+law+sacred+to+eternity.+The+hands+which+hung+it+there+have+not+%28they+say%29+power+to+take+it+down+again.+Who+therefore+may+undertake+to+tell+these+persons+that+they+actually+are+or+else+may+be+freed+from+it%2C+seeing+they+find+themselves+obliged+if+they+can%2C+to+tie+all+the+world+with+them+in+the+same+sort+of+knot%3F+Here+is+certainly+a+zeal+worthy+to+be+%E2%80%A2+ixt+on+that%2C+which+should+oblige+always%3B+and+the+world+must+confess+that+there+has+been+no+public+oath+taken+by+any+person+anywhere+who+have+been+more+scrupulously+attent+not+to+double+with+their+God+in+relation+to+his+part+in+contract.+But+yet+let+not+these+consciences+be+scandalized+if+I+say+it+was+compiled+by+none+but+mortal+men%2C+taken+only+by+such%2C+and+as+a+promissory+oath+cannot+possibly+be+free+from+those+exceptions+and+accidents+wherewith+time+changes+the+constitution+of+all+those+things%2C+which+it+does+not+absolutely+destroy%2C+wherefore+upon+a+sober+review+of+all+I+doubt+not%2C+but+as+many+oaths+and+leagues+are+transient%2C+so+to+show+that+this+according+to+its+nature%2C+and+as+it+is+originally+a+league+or+covenant%2C+that+is%2C+as+it+is+a+formal+compact%2C+relating+to+the+public+and+united+corporation+of+several+nations+and+magistracies+%28by+which+each+people+were+united+together%2C+and+without+which+neither+people+were+respectively+to+act+anything+separately+within+and+against+themselves%29%3A+I+say+I+doubt+not+but+to+show+that+such+a+covenant%2C+upon+what+has+intervened+is+expired+to+us+the+people+of+England%2C+and+that+without+any+default+of+ours%3B+and+though+our+Magistrate+would+give+it+a+new+life+and+obligation%3B+yet+to+many+principal+things+it+can+oblige+no+longer%3B+and+for+the+next+we+are+to+consider+that+though+something+of+our+first+end+in+reformation+stream+through+the+Covenant%3B+yet+its+spring-head+rises+higher+than+it%3B+which+end+we+are+in+all+forms+to+pursue+still%2C+and+are+now+left+tied+to+so+much+of+the+Covenant+only+as+we+were+obliged+to+for+all+our+days+withal+our+mights+and+souls%2C+before+we+took+it+at+all.+Lastly%2C+if+it+were+granted%2C+that+the+Covenant+is+not+expired%2C+yet+I+shall+here+show%2C+that+our+submission+to+this+present+government+is+no+way+inconsistent+with+it.+In+which+few+words%2C+though+I+have+stated+the+main+of+its+difficulties%2C+yet+ere+I+apply+myself+to+answer+objections%2C+I+shall+briefly+premise+what+I+have+observed+others+have+omitted%2C+it+being+hard+to+find+how+we+may+be+untied+from+a+thing+till+we+have+found+how+the+knot+at+first+was+made.+Whatsoever+we+can+say%2C+affirm+or+deny%2C+is+either+assertory+or+promissory.+The+first+relates+to+the+time+past+or+present+%28is+if+I+affirm+Titius+to+be%2C+or+have+been+at+Rome%29+and+therefore+upon+the+very+saying+or+swearing%2C+the+whole+truth+and+obligation+is+fulfilled%2C+and+passed+with+the+time+which+accompanied+it.+The+other+relates+to+the+time+present%2C+as+it+is+then+sincerely+said+or+sworn%3B+and+to+the+future+for+the+sincere+fulfilling+them%2C+which+yet+is+dubious%2C+conditional+and+not+in+our+powers%2C+as+when+Titius+promises+Sempronius+when+his+ship+returns.+For+this+reason+some+say+all+promissory+oaths+are+absolutely+unlawful%2C+because+oaths+must+be+true+and+certain%3B+but+all+future+effects+of+things+are+uncertain.+I+answer%3A+That+for+so+much+as+concerns+the+form+of+my+oath+here%2C+it+is+true+and+certain%2C+that+my+mind+and+words+went+truly+together+in+the+act+of+swearing+and+that+I+will+make+my+deed+and+words+go+truly+together%2C+when+the+supposed+condition+betwixt+us+%28and+which%2C+as+we+mutually+consent+to%2C+is+in+neither+of+our+powers+at+present%29+shall+absolutely+come+to+pass.+This+was+the+case+of+Abram%E2%80%99s+servant+when+he+swore+to+take+a+wife+for+Isaac%3B+a+future+%28in+several+circumstances%29+very+uncertain%2C+both+in+respect+of+what+might+happen+to+the+servant%2C+to+Isaac+and+to+the+virgin%3B+we+know+what+happened+to+Job%E2%80%99s+children+and+family+through+the+accident+of+war+and+the+malice+of+the+Devil%2C+and+how+Joseph+was+shuffled+away+by+his+own+friends+and+kindred.+It+is+not+enough+to+say%2C+such+supposed+tacit+conditions+cannot+be+in+oaths%2C+for%3A+First%2C+if+such+conditions+be+in+promises%2C+and+that+I+may+lawfully+make+a+promise+to+another%2C+then+I+may+lawfully+swear+a+promissory+oath+to+him+which+we+see+cannot+be+separated+from+such+conditions+as+are+not%2C+cannot+and+need+not+be+expressed+betwixt+us+at+the+beginning.+For+%28to+take+away+the+supposition+of+fraud+betwixt+us%29+we+both+agree+in+this+that+we+cannot+foresee+with+what+circumstances+our+futures+may+be+perplexed.+Therefore+it+is+sufficient+that+we+swore+things+not+necessary%2C+but+possible%3B+such+as+might+happen+or+not+happen%2C+because+depending+on+things+which+depend+not+totally+on+us%2C+nor+on+our+will%2C+but+rather+mixedly+on+the+wills+of+others%2C+and+on+that+which+to+us+is+change+or+fortune%2C+for+which+reason+he+is+not+forsworn+who+effects+not+always+what+he+by+oath+promises%2C+no+more+than+he+sins+who+always+effects+not+his+simple+promise.+Secondly%2C+this+tacit+condition+in+a+promissory+oath+and+in+things+naturally+and+morally+possible%2C+is+proved+by+the+very+nature+and+definition+of+the+oath.+For+it+is+only+an+attestation+and+imprecation+of+God+in+such+manner%2C+that+if+the+promiser+fail%2C+he+would+have+him+to+whom+he+promised%2C+understand+that+he+puts+himself+under+God%E2%80%99s+severe+wrath.+From+hence+it+is+to+be+noted+that+the+bare+promise+obliged+as+strictly+before+he+swore+as+after+he+swore%3B+and+of+the+reason+is%3A+Because+he+was+obliged+by+nothing+but+by+that+which+was+in+pact.+The+investing+it+with+an+oath%2C+or+with+God%E2%80%99s+punishment%2C+relates+only+to+the+penalty%3A+so+that+a+promissory+oath+signifies+no+more+than+such+a+penalty+upon+such+a+promise%3A+But+a+penalty+%28as+we+know%29+in+law+and+equity+relates+only+to+that+which+is+unlawful%2C+such+as+is+the+violation+of+a+pact.+The+addition+of+never+so+many+penalties%2C+to+a+thing+in+itself+unlawful%2C+can+never+fasten+any+obligation+on+me+to+do+it%3B+Nor+can+several+penalties+to+an+obligation+in+itself+lawful%2C+add+anything+to+the+first+jus+or+right+of+it%2C+but+only+to+my+future+fear%2C+lest+I+do+injustice.+The+capital+question+therefore+in+these+cases+will+be%3A+What+the+nature+of+the+things+are+to+which+we+obliged+ourselves+at+first%3F+For+according+as+they+stand+or+fall%2C+our+relations+or+obligations%2C+to+them+stand+or+fall+whither+we+will+or+no.+Thirdly%2C+we+find+such+tacit+conditions+concealed+and+supposed+in+the+oaths+of+Solomon+to+Bathsheba%2C+of+David+concerning+Nabal%E2%80%99s+house%2C+of+God+concerning+the+destruction+of+Ninevah+and+of+Abram%E2%80%99s+servant+concerning+Isaac%E2%80%99s+wife%2C+etc.+By+a+reflection+on+all+this%2C+viz.+that+seeing+there+may+be+a+promise%2C+and+consequently+a+promissory+oath%2C+and+that+the+nature+and+obligation+of+a+promise+and+of+such+an+oath+is+one+and+the+same%2C+we+have+gained+a+great+point%3A+that+the+Covenant+%28which+is+a+promissory+oath%29+is+not+in+its+own+nature+of+an+eternal+obligation%2C+but+is+involved+in+tacit+conditions+and+accidents+of+the+world%2C+which+may+justly+incumber+us+from+effecting+it%2C+or+from+being+further+obliged+to+it%2C+as+well+as+other+promises+may%2C+which+yet+are+made+bona+fide+%5Bby+good+faith%5D+at+the+beginning.+The+difficulty+only+is+to+see%2C+whether+de+facto+that+has+intervened+which+has+now+taken+away+the+formal+and+original+obligation%2C+which+we+of+the+people+had+to+it+at+first%2C+by+authority+of+our+magistrate%2C+and+so+taken+away%2C+as+we+may+be+secure+and+out+of+fear+of+the+penalty%2C+which+we+then+submitted+to+in+it.+I+shall+not+here+make+use+of+what+others+have+laboriously+argued%2C+that+the+matter+of+the+Covenant+is+such+as+we+cannot+be+obliged+to%2C+but+let+it+be+as+good+or+as+bad+as+men+please+to+suppose%3B+I+say+in+the+first+place%2C+that+all+the+good+or+bad%2C+was+formed+into+a+political+oath%2C+authorized+upon+two+kingdoms%2C+by+the+sanction+of+two+public+magistracies%2C+who+as+collaterals+obliged+themselves+to+cooperate+faithfully+together+and+obliged+those+of+their+distinct+nations+to+cooperate+respectively+and+subordinately+with+them+for+attaining+a+former+end+in+such+a+way+of+reformation+as+is+therein+expressed%3B+but+by+such+means%2C+as+they+in+their+public+and+respective+capacities%2C+not+we+in+our+particulars+should+judge+most+consonant+to+equity+and+true+to+religion.+For+which+reason+we+happily+are+pointed+at+there%2C+only+in+our+private+places+and+callings.+Here+therefore+there+is+a+relation+of+several+things+concurrent%2C+viz.+of+two+magistracies+united+as+a+means+for+the+easier+reaching+the+end+of+those+respective+reformations+which+they+were+obliged+to+make+before+they+entered+in+league%2C+and+of+two+people%2C+who+by+the+union+of+their+respective+magistracies%2C+pass+%28for+so+much+as+is+therein+expressed%29+into+an+union+one+with+another%2C+and+are+to+have+their+private+capacities+and+endeavors+managed+by+them%2C+and+never+against+them+by+any+virtue+of+this+league.+Besides+it+is+a+considerable+circumstance+in+the+magistrates+managing+the+whole%2C+that+states+or+civil+constitutions+by+reason+of+the+diseases+of+ambition+and+avarice%2C+are+naturally+as+much+subject+to+future+changes%2C+as+any+other+things+are%3B+and+without+the+supposition+of+tacit+conditions%2C+we+may+as+little+swear+to+preserve+the+State+of+a+public+body%2C+as+we+may+swear+to+preserve+the+State+of+our+own+particular+bodies%2C+or+as+a+parent+may+to+preserve+his+child%2C+which+when+it+shall+be+taken+away+by+diseases%2C+or+by+justice%2C+he+may+be+sorry+for+the+loss%2C+but+may+not+justly+complain+of+it.+And+indeed+so+it+is+come+to+pass+without+any+default+in+us+of+the+English+people%2C+or+of+our+public+magistrate+%28under+whom+we+were+to+act+in+these+private+places+and+callings%29+that+neither+of+us+can+be+said+to+have+laid+the+Covenant+aside%2C+although+we+could+not+keep+it+from+expiring%2C+because+the+failing+was+in+that+which+was+never+supposed+to+be+in+our+powers%2C+viz.+in+many+conditional+things+which+came+cross+and+in+the+breach+of+fidelity+in+another+collateral+and+concurring+power.+If+you+please+to+object+here+as+an+aggravation+and+an+incitement+for+us+of+the+Covenanted+people+to+rise+kill+and+slay%2C+that+the+Covenant+is+buried+not+as+a+thing+really+expired+and+dead%2C+but+that+the+people+out+of+interest+must+be+told+so%2C+only+because+the+former+magistracy+is+really+laid+aside+and+changed+%5Bby+Cromwell%E2%80%99s+regime%5D%2C+which+if+people+should+thoroughly+consider%2C+would+quickly+make+them+find+matter+enough+in+the+Covenant+to+take+arms.+I+shall+not+in+the+way+of+answer+to+this+repeat+anything+concerning+the+cause%2C+the+means+and+the+concurrences+to+this+our+present+change%3B+every+covenanter+both+of+England+and+Scotland%2C+knowing+well+that+there+was+no+change+of+government+here+till+the+Covenant+was+nationally+broke+%28and+so+many+here+were+ensnared%2C+both+Royalists+and+Parliamentarians%29+by+the+Scots%2C+who+thought+to+have+used+it+for+a+change+of+government%2C+and+as+a+stratagem+to+give+law+in+another+judicatory%3A+Neither+shall+I+argue+in+this+place%2C+how+compatible+any+change+may+be+with+a+covenant+so+conditional%2C+in+which+kings+as+parties+are+totally+excluded+from+judging+either+for+themselves+or+for+others%2C+which+point+shall+be+further+argued+at+last%3B+But+I+shall+content+myself+to+take+what+is+here+granted+in+the+objection%2C+viz.+that+the+government+is+really+changed+%5Bby+Cromwell%E2%80%99s+regime%5D%3B+The+consequence+then+to+us+of+the+people+will+be%2C+that+seeing+by+the+fourth+article+of+the+%5BSolemn+League+and+%5D+Covenant+%5B1643%5D%2C+we+may+not+without+apparent+breach+of+it+act+the+sense+of+the+Covenant%2C+but+as+we+receive+it+from+our+respective+and+supreme+judicatory+of+England+only%2C+and+that+the+said+government+which+it+relates+to%2C+is+confessed+to+be+gone%2C+have+you+not+then+clearly+confessed+that+the+obligation+to+act+anything+publicly+by+Covenant+is+likewise+gone%3F+according+to+an+old+axiom%2C+Sublato+relato+tollitur+correlatum+%5BBy+the+relative+being+removed%2C+the+correlative+is+taken+away%5D.+If+this+present+government+which+we+are+changed+to%2C+and+which+now+protects+us%2C+should+think+fit+by+the+way+of+Covenant+to+give+a+new+life+to+that+remaining+part+of+it+which+may+be+observed%2C+yet+you+%5Bwho+deny+that+Cromwell%E2%80%99s+regime+is+legitimate%5D+will+not+allow+any+obedience+to+them%2C+though+in+things+never+so+lawful%3B+Neither+will+that+fourth+article+allow+me+to+obey+any+foreigner%2C+nor+those+without+whose+consent+the+Covenant+was+made%2C+and+consequently+without+whom+it+is+to+be+interpreted%2C+as+the+late+proceedings+of+the+Scots+at+the+Hague+plainly+show%3A+So+that+after+all+this%2C+if+I+in+my+private+capacity+be+as+you+say+still+indispensibly+obliged+by+it%2C+to+begin+or+assist+to+public+troubles+%5Brather+than+to+submit+to+Cromwell%E2%80%99s+government%5D%2C+do+you+not+fall+into+a+worse+absurdity+and+maintain+an+oath+against+the+Fifth+Commandment%2C+or+against+all+magistracy%2C+which+is+an+impossibility%3F+Nothing+ever+cautioned+in+terms+more+expressly+for+our+duty+of+making+discoveries%2C+of+bringing+to+condign+punishment%2C+of+our+supreme+respective+judicatories+and+the+like+than+the+Covenant+did%2C+which+are+things+relating+to+none+but+our+supreme+magistracy%2C+unless+you+please+plainly+to+assert+another+absurdity%2C+that+every+single+man+who+has+taken+it%2C+is+thereby+absolved+from+his+magistrate%2C+and+is+made+one+himself+to+judge+of+the+other%2C+and+thereby+authorized+not+by+way+of+toleration+to+profess+but+to+establish+what+religion+he+would%2C+to+punish+at+his+own+tribunal+whom+he+would%2C+and+to+reform+the+state+as+he+would.+For+he+to+whom+you+will+allow+a+capacity+of+making+war%2C+has+also+a+capacity+of+making+peace%2C+and+laws+for+the+security+of+his+peace.+Thus+we+see+how+the+government+is+changed%2C+and+the+formal+obligation+of+the+Covenant+at+an+end%3B+But+what+if+I+should+grant+you+by+the+way+of+supposition%2C+that+in+case+both+the+Covenant+and+the+former+Government+were+standing+together+in+as+full+force+as+you+desire%2C+and+as+it+was+when+the+Scots+first+delivered+the+king+up+to+the+parliament+of+England%3F+I+would+then+know+of+you+whether+if+our+Parliament+had+then+for+reasons+best+known+to+themselves+%28and+of+which+we+can+never+judge+competently%29+declared+us+of+the+people%2C+free+from+any+further+obligation+of+the+Covenant%2C+might+we+justly+have+thought+our+solemn+league+at+an+end%2C+and+that+we+ought+to+act+nothing+publicly+any+longer+by+it%3F+If+you+will+say+we+should+have+been+still+obliged+to+act+upon+it%2C+then+I+ask+you+again+under+whom%3F+For+I+have+proved+it+must+be+always+under+a+magistrate%2C+and+you+have+all+along+proved+that+it+must+only+be+under+our+lawful+magistrate%2C+how+lawful+soever+the+thing+be+in+itself+which+is+commanded%2C+you+would+not+allow+the+king+to+be+the+person+to+be+obeyed%2C+whom+you+thought+fit+to+keep+in+an+imprisonment.+The+Parliament+%28according+to+our+supposition%29+would+not+be+any+longer+obliged+to+it%2C+or+be+obeyed+in+it%2C+and+the+Scots+acknowledge+themselves+in+the+fourth+article+to+be+the+supreme+judicatory+only+of+Scotland%2C+and+I+cannot+act+publicly+by+a+private+capacity+or+magistracy.+Therefore+in+such+a+case%2C+the+Covenant+how+good+soever%2C+had+not+obliged+any+longer%2C+nor+is+it+in+itself+eternal.+You+will+not+deny+perhaps+but+one+man+may+free+another+from+an+oath+when+it+is+for+the+worldly+profit+of+him+who+pleases+to+release+it%2C+as+every+man+may+throw+away+anything+of+his+own+right%3B+but+you+will+not+allow+it+in+sacred+things+where+God+is+a+party.+I+answer%3A+%5BFirstly%2C%5D+That+though+no+parent+can+dispense+his+wife+or+child+from+the+fear+of+God+and+the+duties+they+owe+to+him%2C+yet+he+allowed+him+to+break+the+child%E2%80%99s+vow+for+giving+him+a+sacrifice%2C+and+both+to+be+guiltless+%5BNum.+30%5D%3B+and+then+why+may+not+we+be+now+absolved%2C+if+our+public+parent+judges+it+not+fit+that+we+should+be+any+longer+tied+formally+to+a+conditional+oath%3B+though+it+have+relation+to+some+sacred+things%3F+You+will+say+no%2C+because+the+parent+did+not+as+a+party+solemnly+concur+to+the+child%E2%80%99s+vow%2C+and+having+never+consented+he+might+the+better+dissent%3B+but+our+public+parent+did+concur+at+a+party+to+our+oath.+The+Parliament+and+people+took+the+Covenant+jointly+together%2C+and+it+is+said+that+if+the+father+hear+the+vows+and+contradicts+them+not+in+the+same+day%2C+then+he+confirms+them+and+cannot+break+them+without+iniquity.+To+this+I+reply%3A+First%2C+that%2C+v.16%2C+it+is+said+the+child+is+free+after+the+dissent+of+the+parent%2C+and+that+the+parent+is+charged+with+whatsoever+was+amiss+in+him%2C+which+is+excuse+enough+for+us+of+the+people.+Secondly%2C+the+difference+is+great+in+a+main+point+of+the+parallel%3B+because+after+the+concurrence+of+the+father+to+the+child%E2%80%99s+vow+for+sacrificing+something+to+God%2C+that+might+be+completed+in+the+temple+without+his+further+helping+it+on%3B+but+we+cannot+do+anything+in+our+case+without+the+cooperation+of+our+public+parent+all+along%2C+neither+can+he+do+anything+without+the+concurrences+of+many+other+possible%2C+but+uncertain+conditions%2C+and+if+he+in+effect+find+those+conditions+have+come+contrary+to+his+public+endeavors%2C+what+may+we+do%3F+Will+it+be+enough+for+us+to+rest+in+having+attempted+the+utmost+of+our+private+endeavors+with+him%3F+or+will+you+authorize+every+man+upon+private+judgment+or+interpretation+to+begin+a+war+in+his+own+sense.+A+league+or+pact+authorized+betwixt+private+neighbors+over+a+whole+nation+or+over+part+of+it%2C+is+not+as+a+league+betwixt+prince+and+prince%3A+because+these+have+conditions+expressed+how+and+when+to+begin+war+upon+one+another+in+case+their+leagues+be+broken.+But+there+is+no+such+thing+expressed+in+terminis+%5Bin+the+terms%5D+in+that+Covenant+which+we+have+made+one+with+another%2C+and+which+we+made+subordinately+to+our+magistrate%3A+so+that+if+we+or+the+magistrate+fail%2C+we+are+equally+left+to+God%E2%80%99s+justice+solely+and+to+the+forfeiture+of+our+own+penalties+due+to+him%2C+and+everyone+is+to+answer+for+his+own+deficiency+in+his+own+station%3A+And+being+left+to+ourselves+again%2C+we+are+left+to+act+only+so+much+of+our+oath+or+of+the+ancient+end+of+it%2C+as+we+were+bound+to+before+we+swore%3A+which+is+a+great+deal%3B+because+we+were+bound+by+precept+before+we+were+by+promise+all+the+days+of+our+lives+to+do+our+utmost+for+the+glory+of+God%2C+and+the+good+of+our+neighbor.+Secondly%2C+princes+or+states+who+by+the+supremacy+of+their+powers+are+able+to+make+laws+for+their+separated+kingdoms%3B+when+they+unite+their+supreme+powers%2C+they+are+able+to+make+a+common+law+for+all+their+kingdoms+together%2C+which+is+called+a+league+or+compact%3B+But+a+law+when+it+comes+to+be+broken+%28which+is+a+public+thing%2C+and+therefore+of+every+man%E2%80%99s+interest%29+may+be+vindicated+publicly+by+war%2C+and+by+those+who+have+a+posse+regni+%5Bcapacity+to+rule%5D.+But+I+cannot+say+the+same+may+be+done+for+the+Covenant%2C+for+quo+jure+%5Bby+which+law%5D+can+it+be+done%3F+The+Scots%2C+indeed%2C+by+one+way+of+arguing+make+it+greater+than+a+law%2C+and+by+another+%5Bway%5D+make+it+less%3B+which+is+when+they+one+while+affirm+it+unalterable+and+unreformable+as+a+divine+text%2C+and+another+while+confess+it+was+not+made+by+the+joint+concurrence+of+all+those+who+with+them+are+essential+to+the+making+%5Bof%5D+a+public+law.+I+conceive+we+may+safely+say+it+is+of+a+constitution+inferior+to+that+of+a+law%2C+and+therefore+its+obligation+is+less%2C+though+its+penalty+be+greater+to+the+failers+in+it.+It+was+made+use+of+only+as+a+convenient+instrument+or+means+for+the+better+attaining+%5Bof%5D+some+laws+as+its+end.+A+law+it+was+not+because+it+was+not+made+by+all+the+then+legislative+powers+of+the+kingdom.+For+the+king%E2%80%99s+concurrence+in+England%2C+if+not+in+Scotland%2C+was+then+held+requisite+for+passing+a+law+and+he+ever+dissented+from+this+Covenant.+Half+the+inferior+sort+of+the+people+have+not+any+interest+in+it%2C+nor+have+taken+it%3A+And+not+having+any+obligation+to+it%2C+how+I+pray+you+can+they+justly+be+drawn+into+the+penalty+due+to+it%3F+as+they+must+all+be%2C+if+a+war+%28which+is+effectually+a+penal+thing%29+be+begun+though+by+a+part+of+the+nation%3B+for+the+nature+of+war+is+such+that+it+puts+a+whole+Kingdom+into+imminent+danger+of+desolation%2C+though+but+begun+in+a+part+and+by+a+party+of+it.+Thus+far+I+have+endeavored+to+show+the+true+fast+and+loose+of+all+promissory+oaths%2C+and+how+their+obligations+cease+according+to+the+nature+of+the+things+which+they+are+affixed+to.+The+author+of+the+Grand+Case+of+Conscience%2C+p.+1%2C+objects+that+if+inconvenience+may+break+a+promise+or+disengage+an+oath%2C+then+many+may+be+cheated%2C+and+David+was+much+mistaken%2C+Ps.+15%3A4%2C+%E2%80%98Who+saith+he+shall+dwell+in+God%E2%80%99s+Tabernacle%2C+who+sweareth+to+his+own+hindrance+and+changeth+not.%E2%80%99+I+answer%3A+David+speaks+here+of+an+oath+violated+by+a+change+only+in+the+promiser%2C+who+by+his+oath+has+passed+a+right+to+another%3A+and+therefore+can+no+longer+dispose+of+it+again%3B+the+party+to+whom+he+swore+may+dispose+of+it+as+he+pleases+and+may+dispense+him+of+it%3B+because+no+man+has+a+right+to+make+another+man+keep+his+own+longer+than+he+please+himself.+It+is+a+duty+to+pay+a+debt%2C+but+not+to+receive+it.+Finally%2C+this+is+nothing+to+those+cases+where+the+change+is+not+in+us%2C+but+in+other+persons+and+in+things+which+relate+principally+and+conjointly+to+the+fulfilling+of+the+oath+or+promise.+For+if+I+promise+Titius+a+sword+at+such+a+time%2C+and+he+then+chance+to+be+mad+%5Binsane%5D+%28an+accident+not+expressed+betwixt+us+at+first%29%3B+am+I+bound+to+put+it+into+his+hands+in+this+change+because+I+was+the+first+promiser%3F+Whereas+it+is+said%2C+that+the+obligation+of+some+things+end+because+they+can+be+no+longer+kept%2C+as+that+of+the+king%E2%80%99s+person%2C+etc.+He+answers%2C+p.+11%2C+that+if+men+shall+by+violence+put+an+end+to+the+thing%2C+that+thereby+the+obligation+may+end+too%2C+that+is+a+breach+of+Covenant.+A+woman+promises+to+be+faithful+to+her+husband+so+long+as+he+lives%3B+but+if+she%2C+to+marry+another%2C+kills+him%2C+she+breaks+her+promise.+I+grant+it+easily+that+they+who+use+violence+to+break+lawful+contracts%2C+sin+grievously%3B+which+is+a+thing+now+confessed+in+every+Church+of+Scotland%3B+but+what+is+that+to+those+who+use+no+violence+to+break+them+at+all%2C+nor+can+help+it+when+it+is+done+although+many+be+undone+by+it%3F+One+thing+I+most+earnestly+desire+to+learn+in+this+question+propounded+%28I+guess%29+concerning+the+king%E2%80%99s+death+%5Bin+1649%5D%3B+which+was+a+consequence+of+the+others%E2%80%99+breach+and+tamperings.+If+by+the+Covenant+we+were+indispensably+obliged+to+preserve+his+person%2C+how+came+it+to+pass+that+we+were+obliged+by+the+same+Covenant+to+wage+war+against+him%3F+I+have+heard+of+a+distinction+betwixt+his+power+and+his+person%2C+but+never+of+any+betwixt+his+person+and+himself.+So+that+if+the+Covenant+could+have+dispensed+any+soldier+of+England+or+Scotland+to+kill+his+person+by+an+accident+of+war+%28as+his+life+was+oft+in+danger+before+he+came+to+the+scaffold%29+his+death+had+been+violent%2C+and+the+obligation+to+preserve+him+had+ended%2C+and+yet+according+to+this+argument+the+Covenant+had+not+been+broken.+Why+then+should+these+men+think+the+world+so+dull+as+not+to+understand+plainly+enough+that+the+Covenant+provided+for+his+death+more+ways+than+one%3F+True+it+is%2C+that+the+Covenant+held+out+a+faint+and+a+conditional+preservation+of+him%2C+and+after+all+no+man+can+sincerely+stretch+it+further%3A+From+whence+if+we+will+let+him+judge+this+one+controversy%2C+he+has+left+it+recorded+to+posterity%2C+in+his+supposed+book%2C+ch.+9%2C+%E2%80%98In+vain+is+my+person+excepted+by+a+parenthesis+of+words%2C+when+so+many+hands+are+armed+against+me+with+swords.%E2%80%99+Moreover+in+his+chapter+of+the+Covenant%2C+he+feared+it+provided+for+him+in+a+logic+too+loose+and+circumstantial.+From+all+which+what+did+he+conclude%2C+but+that+he+would+not+allow+of+a+Covenant-argument+for+his+life%3F+I+know+the+answer+here+is+obvious%2C+that+bullets+were+not+shot+directly+against+him+%28as+few+are+against+any+in+a+town+or+in+a+battle%29+and+that+if+he+would+have+withdrawn+his+person%2C+he+should+have+been+out+of+danger%3B+but+then+I+pray+you+what+advantage+had+he+in+this+by+Covenant%2C+more+than+any+common+soldier+of+either+side%3F+who+when+they+retire%2C+are+equally+out+of+danger%3B+Nay+he+had+less+advantage%2C+for+by+preserving+him%2C+they+meant+keeping+him+after+he+was+rescued+from+others%2C+and+by+keeping+him+they+meant+not+him+primarily%2C+but+something+else%2C+to+which+all+consideration+of+him+was+to+give+way.+As+for+others+which+were+to+be+brought+to+punishment%2C+they+had+some+of+them+leave+to+go+beyond+the+seas%2C+others+to+enjoy+liberties+at+home%3B+and+of+all+the+excepted+persons%2C+there+was+never+any+of+them+who+was+here+deprived+of+life%2C+but+as+our+troubles+and+wars+increased%2C+their+number+%28which+was+strange%29+lessened+even+to+six+or+seven+at+last%2C+and+most+of+those+out+of+the+kingdom.+I+know+they+have+distinctions+wherefore+so+much+might+be+remitted+to+those+and+not+to+the+king%2C+although+he+had+on+his+behalf+the+word+%E2%80%98preservation%E2%80%99+in+the+Covenant%2C+but+these+distinctions+are+but+their+strong+justifications+for+that+which+is+the+bottom+of+this+argument%2C+if+all+Covenanters+durst+speak+plainly+alike.%E2%80%9D%0A%0A%E2%80%94+Anthony+Ascham%2C+The+Bounds+%26+Bonds+of+Public+Obedience%2C+or%2C+A+Vindication+of+our+Lawful+Submission+to+the+Present+Government%2C+or+to+a+Government+Supposed+Unlawful%2C+but+Commanding+Lawful+Things%2C+Likewise+how+such+an+Obedience+is+Consistent+with+our+Solemn+League+%26+Covenant%E2%80%A6+%28London%2C+1649%29%2C+pt.+2%2C+pp.+38-50+Despite+EEBO-TCP+attributing+this+to+Rouse%2C+it+was+most+likely+that+of+Ascham.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e1492dd2c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e1492dd2c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-oaths-vows/#:~:text=By%20these%20steps%20we%20are%20come,all%20Covenanters%20durst%20speak%20plainly%20alike&amp;text=By%20these%20steps%20we%20are%20come%20at%20last&amp;text=argument%2C%20if%20all%20Covenanters%20durst%20speak%20plainly%20alike" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

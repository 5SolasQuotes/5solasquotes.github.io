<main class="wrap"><figure class="quote" id="q-db859f2fc9" data-kw="">
<blockquote><p>Finally, the utility of the Sabbath is apparent in its moral efficacy in preserving the worship of the true God, and sustaining a sense of accountability. You may walk over the length and breadth of any land, where the Sabbath and all its precious and reforming influences have never been known, and your eye will meet no pure worshipper of the living Jehovah; and you may plant your foot on the portal of no temple dedicated to the service of the Eternal and Holy One. But instead, you will everywhere find the deluded multitude bowing their knees to the workmanship of their own hands, having changed the glory of the incorruptible God, into an image made like unto corruptible man, and to birds, and four-footed beasts, and creeping things. And if you follow them to their fanes, you witness, most probably, the defiling worship of a prostitute goddess.

Or you may go to those who have lived under the light of Gospel truth, but have no regard for the Sabbath of God, and their conceptions of the Deity are such, (if they are not actual Atheists,) as leave them entirely irresponsible for their conduct, and sweep away from their minds all sense of accountability to God. Look at infidel France, when she Strikes out of her statute-book the weekly Sabbath and substitutes the Decade. She has the countenance and the mien of a maniac, and seems rushing to her own ruin, and looking fury in the face of her best friends. She cries night and day up and down the streets, “There is no God,” and pays her formal devotions to the substituted goddess of Reason.

She lights up a fire and burns the Bible, or for the amusement of the people and the gratification of her maniacal and fiendish spirit, ties it to the tail of an ass, and parades it through the market-places. She drives her horses and cattle into the house of God, swears there is no immortality, and that death is an eternal sleep; wishes she might imbrue her hands in the blood of the Redeemer, talks with Satanic malevolence of the delight it would have given her to drive the nails, and thrust the spear, and builds her thousand altars to be stained with the blood of millions of human victims. And when she has accomplished her purpose, and stripped herself of her glory, she goes out naked, to die unblest and unlamented, without a mourner to follow her to the tomb.

And let those who would abolish the Sabbath, or lessen its sanctity in the eyes of men, go and sit upon her grave, and ponder well the course she took, and the end to which it conducted her. Let them go and call up her spirit from the shades of the sepulchre, and inquire of it whether the observance of the Sabbath is not the safeguard of liberty and religion; and whether its neglect is not paving the way for the introduction of infidelity and scepticism, and the loss of individual and national accountability, and with tears of blood she will answer in the affirmative, and solemnly warn you not to tread in her steps.

And let it not be thought that the Bible is sufficient in itself, without the Sabbath, to prevent these consequences, and diffuse a wholesome moral principle. It is not. Without the energies of this holy rest, it could make little impression on the stony heart of man. And therefore God appoints the Sabbath and the ministry of reconciliation in union with it, that he may summon up the attention of men to its important and essential lessons. No; without the sanctity of this precious day, the Bible and all other moral influences would fade away, and die from off the earth. They would be but a “broken reed at best” before the mighty strength of unrestrained corruption. Law and gospel would both be forgotten, and the moral government of Jehovah be trodden under foot.

And in confirmation of this assertion, you may look to cities and towns in your own land, where the Sabbath is little regarded, and you see God dishonoured, his name wantonly profaned, and all his laws set at nought. And just in proportion as this day is desecrated, will the knowledge and worship of the true God fail from the mind, the moral sense of the nation be impaired, its power decay, its foundations be destroyed, and its pillars fall. And then It will stand forth a monument of the wisdom of God, and the folly of man; and it will hold up to the light, the too much forgotten farewell sentiment of the Father of this country [George Washington], that “national morality cannot prevail in exclusion of religious principle.” And we may add, that religious principle will not pervade a community, in exclusion of the Sabbath, which is the only sufficiently general, impressive, and popular medium of inculcating it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-holmes-agnew.html">John Holmes Agnew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Manual on the Christian Sabbath</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1852), pp 129-32.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-777bd5c2e9" data-kw="">
<blockquote><p>He [God] so sanctified this Sabbath worship that he ordered those who had violated it to be cut off from the people and stoned (Ex. 31:14-15; and 35:2). And this deservedly, for we live by faith in God (cf. Hab. 2:4). But this matter has need of much serious restoration because Satan and our flesh never cease to weaken it. Since now our God in his singular charity toward us sanctified only one of seven days for the grounding of our faith and hence of our eternal life, and blessed that day that religious services held on it might effectively work toward our salvation, whoever would not be eager to sanctify that day to glorify his Lord God and the attainment of his own salvation (especially since God has conceded six days for our business and labors in order to sustain our present life for his glory) would surely show himself as a lost despiser of so admirable a blessing of God on us and entirely unworthy of living among the people of God.</p></blockquote>

<blockquote><p>Objection [of opponents]: In matters plainly determined by Scripture, rulers are to follow the Word of God; but in matters circumstantial or indifferent, where Scripture says neither for the one side, nor for the other, what rulers think good, is to be followed, there being no evil nor impiety in that which they command. Answer 1: This is to make rulers in matters of salvation liable to the Scriptures of God; but in matters which men call indifferent to make them Popes, and to hang our consciences upon their sleeve, which is most absurd:

1. Because Paul in matters most indifferent, of days and meats, would not have the Romans to hang upon his judgment, but will rule both their practice and his own by the Law of nature: ‘Murder not,’ ‘Scandalize not.’

2. What rulers think good is not a rule for constitutions and for people’s obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command; for it were strange if in matters that they call of salvation, not thoughts, but the Word of God should rule and square canon-makers, but in matters indifferent, their thoughts should be a law.

3. Scripture and the Law of nature, and right reason, which is a deduction from Scripture, is able sufficiently in all canons and constitutions to regulate both rulers and people, and to determine what is conventent in circumstances; and the Lord here is an infallible Judge, speaking in his Word, as He is in all matters, which they call fundamental; yea, the Scripture shall be imperfect in the duties of the Second Table, if it do not determine what is active scandal, or soul murder, as it does determine what is idolatry, what is lawful worship.</p></blockquote>

<blockquote><p>There is so great a difference of men and cases that it’s gross sottishness to think that their duties and sins are the same in mutable circumstances: It’s a sin to preach or pray when we should be quenching a fire, saving men’s lives. Christians, as well as Pharisees, are yet to learn what that means, “I will have mercy and not sacrifice, and therefore accuse the guiltless.” [Mt. 12:7] Some men have no possibility of any other church-worship but in the parish-churches. Some have no other possibility but what is worse. Some may have abler teachers, but at the cost of imprisonment and ruin. It is not lawful to lie in prison merely for refusing to hear a weak nonconformist when you might hear an abler: and so it is in the case of conformists, else all were bound to a few men. Some have liberty to hear fitter men, or at the least, more agreeable to them, without greater hurt than good (as the Dutch and French here have). Some are commanded by husbands, parents and masters to one church, and some to another. Some have more able and godly ministers in the parish-churches, and some have such as I would never own or encourage in the ministry by seeming to own them. Some can remove their dwelling and some cannot. Some had liberty the last year that cannot have it this year without more hurt than their benefit will compensate. In these cases where God has not at all tied us to a [Service-]book, or no book, to this church or to that, he that can truly tell which way he shall do and get most good or hurt, may by that better know his duty than by these arguments or men’s censures.</p></blockquote>

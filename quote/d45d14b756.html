<main class="wrap"><figure class="quote" id="q-d45d14b756" data-kw="">
<blockquote><p>In setting forth this [Shorter] Catechism or Christian doctrine in such a simple, concise and easy form, I have been compelled and driven by the wretched and lamentable state of affairs… the common people knowing nothing at all of Christian doctrine… and though all are called Christians and partake of the holy sacrament, they know neither the Lord’s Prayer, nor the [Apostles’] Creed, nor the Ten Commandments, but live like the poor cattle and senseless swine…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Short Catechism, Preface in ed. B.J. Kidd, Documents Illustrative of the Continental Reformation (Clarendon Press, 1911)</cite>, pp. 96-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“In setting forth this [Shorter] Catechism or Christian doctrine in such a simple, concise and easy form, I have been compelled and driven by the wretched and lamentable state of affairs… the common people knowing nothing at all of Christian doctrine… and though all are called Christians and partake of the holy sacrament, they know neither the Lord’s Prayer, nor the [Apostles’] Creed, nor the Ten Commandments, but live like the poor cattle and senseless swine…”

— Martin Luther, Luther’s Short Catechism, Preface in ed. B.J. Kidd, Documents Illustrative of the Continental Reformation (Clarendon Press, 1911), pp. 96-97">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+setting+forth+this+%5BShorter%5D+Catechism+or+Christian+doctrine+in+such+a+simple%2C+concise+and+easy+form%2C+I+have+been+compelled+and+driven+by+the+wretched+and+lamentable+state+of+affairs%E2%80%A6+the+common+people+knowing+nothing+at+all+of+Christian+doctrine%E2%80%A6+and+though+all+are+called+Christians+and+partake+of+the+holy+sacrament%2C+they+know+neither+the+Lord%E2%80%99s+Prayer%2C+nor+the+%5BApostles%E2%80%99%5D+Creed%2C+nor+the+Ten+Commandments%2C+but+live+like+the+poor+cattle+and+senseless+swine%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Short+Catechism%2C+Preface+in+ed.+B.J.+Kidd%2C+Documents+Illustrative+of+the+Continental+Reformation+%28Clarendon+Press%2C+1911%29%2C+pp.+96-97&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd45d14b756.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d45d14b756.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=In%20setting%20forth%20this%20%5BShorter%5D%20Catechism,the%20poor%20cattle%20and%20senseless%20swine%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-361fd2e5e9" data-kw="">
<blockquote><p>Fourthly, howsoever many have years of discretion, and the common use of natural gifts of understanding: yet if they neither have the knowledge of God, nor the knowledge of themselves, nor the knowledge of the doctrine of the sacraments, and other fundamental points of religion, they are not to be admitted [to the Supper,] but refused.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-attersoll.html">William Attersoll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The New Covenant, or a Treatise of the Sacraments… (London: Jaggard, 1614), bk. 3, ch. 15</cite>, pp. 514-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-34b6a0b1ee" data-kw="">
<blockquote><p>The Classis Buren form [1610] reads: ‘I the undersigned call on God as witness that I, having been called to serve as a minister in Classis Buren at ___ , and having been asked by the Classis, according to the prescribed order, what my opinion was of the Netherlands [Belgic] Confession, the [Heidelberg] Catechism, and the new fanaticism of Jacobus Arminius, have confessed and hereby do confess, not only by mouth but with my whole heart, without any duplicity or dishonesty, that what is taught in the Netherlands Confession and the Catechism is completely and sincerely scriptural (schriftmatich), and that I have never, nor shall I ever, be devoted to the novelties of Jacobus Arminius and his followers, but have cleaved to and shall cleave to the aforesaid Confession and Catechism, as the unanimous confession of the churches, to which I duly submit myself, as I also to this end in my examination and complete acceptance of the aforesaid Catechism and Confession, according to the order of Classis, by hand and mouth promise to sign, so help me God Almighty.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands.html">Netherlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Donald Sinnema, “The Origin of the Form of Subscription in the Dutch Reformed Tradition” in Calvin Theological Journal (July 2007)</cite>, p. 268, fn. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Classis Buren form [1610] reads: ‘I the undersigned call on God as witness that I, having been called to serve as a minister in Classis Buren at ___ , and having been asked by the Classis, according to the prescribed order, what my opinion was of the Netherlands [Belgic] Confession, the [Heidelberg] Catechism, and the new fanaticism of Jacobus Arminius, have confessed and hereby do confess, not only by mouth but with my whole heart, without any duplicity or dishonesty, that what is taught in the Netherlands Confession and the Catechism is completely and sincerely scriptural (schriftmatich), and that I have never, nor shall I ever, be devoted to the novelties of Jacobus Arminius and his followers, but have cleaved to and shall cleave to the aforesaid Confession and Catechism, as the unanimous confession of the churches, to which I duly submit myself, as I also to this end in my examination and complete acceptance of the aforesaid Catechism and Confession, according to the order of Classis, by hand and mouth promise to sign, so help me God Almighty.&#x27;”

oopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4447edc361" data-kw="">
<blockquote><p>The point of all this is to suggest that the [American] revisions [to the Westminster standards] were strategic, driven by necessity, not the result of some massive doctrinal shift. Indeed, the textual change itself suggests no such massive shift, only moderation according to the circumstances.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“The point of all this is to suggest that the [American] revisions [to the Westminster standards] were strategic, driven by necessity, not the result of some massive doctrinal shift. Indeed, the textual change itself suggests no such massive shift, only moderation according to the circumstances.”

</figure><figure class="quote" id="q-2d24026d79" data-kw="">
<blockquote><p>For matter of imposing-upon, I am not guitly. In the [Westminster] Assembly, I gave my vote with others; that the Confession of Faith, put out by authority, should not be required to be subscribed to, we having been burnt in the hand in that kind before: but so as not to be publicly preached or written against; which indeed is contrary to that ‘liberty of prophesying’ which some so call for…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-tuckney.html">Anthony Tuckney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>in Moral &amp; Religious Aphorisms collected from the Manuscript Papers of the Reverend &amp; Learned Doctor Whichcote... ed. Samuel Salter (London: Payne, 1753), 3rd Letter, pp. 76-77 Tuckney (d. 1670) was a Westminster divine. For context to this quote, see Leith</cite>, p. 104.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“For matter of imposing-upon, I am not guitly. In the [Westminster] Assembly, I gave my vote with others; that the Confession of Faith, put out by authority, should not be required to be subscribed to, we having been burnt in the hand in that kind before: but so as not to be publicly preached or written against; which indeed is contrary to that ‘liberty of prophesying’ which some so call for…”

— Anthony Tuckney, in Moral &amp; Religious Aphorisms collected from the Manuscript Papers of the Reverend &amp; Learned Doctor Whichcote... ed. Samuel Salter (London: Payne, 1753), 3rd Letter, pp. 76-77 Tuckney (d. 1670) was a Westminster divine. For context to this quote, see Leith, p. 104.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+matter+of+imposing-upon%2C+I+am+not+guitly.+In+the+%5BWestminster%5D+Assembly%2C+I+gave+my+vote+with+others%3B+that+the+Confession+of+Faith%2C+put+out+by+authority%2C+should+not+be+required+to+be+subscribed+to%2C+we+having+been+burnt+in+the+hand+in+that+kind+before%3A+but+so+as+not+to+be+publicly+preached+or+written+against%3B+which+indeed+is+contrary+to+that+%E2%80%98liberty+of+prophesying%E2%80%99+which+some+so+call+for%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Anthony+Tuckney%2C+in+Moral+%26+Religious+Aphorisms+collected+from+the+Manuscript+Papers+of+the+Reverend+%26+Learned+Doctor+Whichcote...+ed.+Samuel+Salter+%28London%3A+Payne%2C+1753%29%2C+3rd+Letter%2C+pp.+76-77+Tuckney+%28d.+1670%29+was+a+Westminster+divine.+For+context+to+this+quote%2C+see+Leith%2C+p.+104.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2d24026d79.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2d24026d79.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=For%20matter%20of%20imposing%2Dupon%2C%20I%20am,prophesying%E2%80%99%20which%20some%20so%20call%20for%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

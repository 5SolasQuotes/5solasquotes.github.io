<blockquote><p>Change, as we saw in chapter 1, is the actualization of potential. We have also seen that God is pure actuality, devoid of potentiality. Now, if He has no potential that needs to be, or indeed could be, actualized, then He cannot change. He is therefore immutable or changeless. To be sure, it might seem that He changes insofar as He creates the world. For doesn’t this involve a transition from God’s not creating it to his creating it? But as I have just argued, God’s being Creator of the world is a Cambridge property rather than a real property, and his becoming the world’s Creator is thus a mere Cambridge change. Just as, in our example, Socrates’ becoming shorter than Plato [when Plato grew taller] involved a real change only in Plato and not in Socrates, so too does God’s becoming Creator of the world involve a real change only in the world’s status, not in God. To say that God is immutable is to say that there is no real change in Him, though there may of course be Cambridge changes. … It might be objected that in creating the world, God acts, and that acting always involves a change in the one acting and not merely in the thing He acts upon… However, while it is true that the things of our experience happen to undergo changes themselves in the course of acting upon other things, it simply does not follow that absolutely anything that acts must necessarily undergo change itself as it does so. To draw such an inference would be to commit what is called a fallacy of accident. Such a fallacy would be committed, for example, if one were to conclude from the premise that every college professor who has ever lived has been under nine feet tall to the conclusion that any possible college professor must be under nine feet tall… As Brian Davies points out in responding to this sort of objection, what is essential to acting is the bringing about of an effect in another thing, rather than undergoing change oneself as one does so. For example, what is essential to teaching is that one causes someone else to learn, and not that one does so by lecturing, specifically, or by writing books, or what have you. Similarly, what is essential to creating is simply that God causes the world to exist. There is nothing in this that requires that it be done by virtue of the Creator’s undergoing change Himself.</p></blockquote>

<blockquote><p>the Chaldeans are daily refuted. How many things I remember being said by the Chaldeans to Pompey, how many to Crassus, how many to Caesar himself; that none of them would die except in old age, except at home, except with clarity, so that it seems very strange to me that anyone still exists who believes those whose predictions he sees refuted daily by fact and events”; yet all of these were taken away by a violent death, which is confirmed by the examples of Julian the Apostate, Ludovico Sforza, Prince of Milan, Edward VI, King of England, the son of Cardanus, and others, to whom things far different from what had been predicted happened. Hence 10 emperors, princes, and lawgivers have forbidden this art of divining from the stars, and wise men and the fathers have disapproved of it. Maecenas, in Dio, bk. 52, Oration to Augustus, said that “diviners should not be tolerated in a republic.” Augustus expelled the astrologers from the city, Tiberius and Claudius from Italy; Vitellius also severely judged that they should be deprived of the world and of life. See Code, bk. 9, Tit. 18; bk. 2, 5, 7, and Tacitus, bk. 2, Annals, ch. 32, in whose judgment, “mathematicians are a race of men untrustworthy to the powerful, deceitful to the hopeful: which in our state will always be both forbidden and retained.” Cf. Valerius Maximus, bk. 1, ch. 3; Curtius, bk. 4, ch. 10; bk. 7, ch. 7. If an event has corresponded to some predictions, this should be attributed either to the shrewdness of the diviners, who had knowledge of the morals, counsels, and studies of those consulting them; or to the credulity of those consulting, who have turned fortuitous chances into the fulfillment of the thing predicted; or to the work of the devil, from whose suggestion or inspiration such prophets can draw many things; or to the just judgment of God, who chastises the vain minds of men with those mockeries, and permits the superstition of men to feel the scourge of Satan.</p></blockquo <blockquote><p>It is an untruth which [the Romanist] Raphael de la Torres, with other schoolmen say (tome •, in 22, question 81, article 4, the only disputation), that with the same religion by which we honor holy men, we honour God, upon this reason, because holiness in them is a participation of the divine nature; therefore God must be the intrinsical end and formal reason for which we honor the saints. For holiness in saints is a participation of the divine nature, but it is a temporary and a created participation; it is not the same very holiness that is in God, but [rather is] the created effect thereof: and so the love I bear to any creature, because there is somewhat of God in every creature, and the love to our neighbor, commanded in the Second Table of the Law, should be the love of God commanded in the First Table of the Law. 2. When I bow to the gray-haired and to the king; I then do an act of obedience to the Fifth Commandment: No man can say that when I bow to the king or to a holy man that I am then bowing to the God of heaven and worshipping God: No acts terminated upon saints, living or dead, are acts of worshipping God; yea, reverencing of the ordinances of God, as the delighting in, or trembling at the Word, are not properly acts of adoring God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It is an untruth which [the Romanist] Raphael de la Torres, with other schoolmen say (tome •, in 22, question 81, article 4, the only disputation), that with the same religion by which we honor holy men, we honour God, upon this reason, because holiness in them is a participation of the divine nature; therefore God must be the intrinsical end and formal reason for which we honor the saints. For holiness in saints is a participation of the divine nature, but it is a temporary and a created participation; it is not the same very holiness that is in God, but [rather is] the created effect thereof: and so the love I bear to any creature, because there is somewhat of God in every creature, and the love to our neighbor, commanded in the Second Table of the Law, should be the love of God commanded in the First Table of the Law. 2. When I bow to the gray-haired and to the king; I then do an act of obedience to the Fifth Commandment: No man can say that when I bow to the king or to a holy man that I am then bowing to the God of heaven and worshipping God: No acts terminated upon saints, living or dead, are acts of worshipping God; yea, reverencing of the ordinances of God, as the delighting in, or trembling at the Word, are not properly acts of adoring God.”

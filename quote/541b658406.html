<main class="wrap"><figure class="quote" id="q-541b658406" data-kw="">
<blockquote><p>Paul includes all laws and related statements without distinction, though the papalists argue that the text is referring only to the ceremonial laws of Moses. This just shows how stupid they are. Paul here says that none of the law justifies us in any way, and he clearly contrasts the justification of the sinner by faith in Christ with the law. Paul was certainly well-educated enough to have been able to distinguish one kind of law from another had he wished to do so. The following rule is to be observed. When the text makes no distinction, a distinction must not be forced on it. Furthermore, Paul soon goes on to add that he had died through the law, and this must be understood to refer to the moral law.

In this verse the words “faith of Jesus Christ” do not mean the faith that he himself had but the faith that we have in him. Paul means that faith by which we recognize Christ as our redeemer and savior. Faith therefore is the tool by which we come to a knowledge of Christ and his blessings. It assures us that we have freely received the forgiveness of sins and eternal life on account of Christ. Faith does not mean just believing that Christ is the truth, but it also involves applying Christ and the promise of grace to ourselves, so that we may know that God is reconciled to us according to the promises of his grace and that we have eternal life because of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-wigand.html">Johann Wigand</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolam Sancti Pauli ad Gatatas Annotations</cite>, (Wittenberg: Johann Craton, 1580). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 73.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d2ab67faba" data-kw="">
<blockquote><p>Preaching at the opening of Fisherwich Presbyterian meeting-house, Belfast in 1827, Thomas Chalmers explained the connection between justification and sanctification. A contemporary report of the sermon gives us the following account of Dr Chalmers’s sermon:

He then came to the practical application of his subject, – that holiness of life, according to the Christian dispensation, was indispensable to eternal happiness. […] Sanctification is a renewal of the inward man, arising from the operation of the Holy Spirit producing a conviction of past error, and a determination for future amendment of life – for, said he, (with a warmth of manner which we have seldom witnessed,) though we are justified by faith alone, we are not justified by that faith which is alone. […] “THERE IS A WORLD OF THEOLOGY IN THAT SENTENCE – ‘We are justified by faith alone, but not by that faith which is alone.&#x27;” After a moment’s pause, he described the heaven of the Christian, as a heaven of uprightness – a heaven in which the state of a man’s soul, in a moral sense, arising from sanctification by faith, would be more conducive to celestial enjoyment that the place itself – an enjoyment arising from the pure worship of God, and the pleasure of holding converse with the saints, sanctified by faith in Christ. As well, he exclaimed, in a strain of intense eloquence, to which we feel inadequate to do justice, – as well might you offer a heaven of beauty to a blind man, or a heaven of melody to a deaf man, or a heaven of philosophy to a man void of understanding, as a heaven of holiness to a man unsanctified by faith. The place of that heaven is in the heart of man, regenerated by the conviction of the necessity of a virtuous course in this life, to the enjoyment of felicity in that to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Guardian and Constitutional Advocate</cite>, 28 Sep. 1827</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-97278baa58" data-kw="">
<blockquote><p>When God reveals some new truth to man, some truth of mighty import, and bearing immediately upon the eternal interests of the soul; or when (as oftener happens) some truth as old almost as the beginnings of Revelation, but which has long been obscured by the mass of human traditions which have gathered over it, is revived, and assumes its proper place, an amazing effect is produced. The history of the great doctrine of “Justification by Faith” affords a remarkable illustration of this.

That doctrine is so clearly revealed, and occupies so conspicuous a place throughout the sacred writings, that it is a matter of astonishment that any one who reads them should miss it. Yet, for long and weary ages, it was in a manner lost to man. God, indeed, always, even in the times of darkest superstition, had a band of witnesses upon earth. For centuries they were so few and so despised, that they might well be called “hidden ones” Without exaggeration it may be said, that to Christendom – that great truth was lost.

The discovery and revival of it at the Reformation, was life from the dead. A new impulse – the freshness and glory of a new and spiritual existence – was throughout Europe communicated to the human mind. The earth is not more invigorated, when the breezes and showers of spring, with the potent alchemy of the sun now gaining the ascendant, dispel the fogs, and relax the frozen grip of winter, causing the vegetation to teem up, and mantle bill and valley, than were the minds of men by that blessed change, for which we are too stinted in our gratitude to the Most High. To this so celestial doctrine, and those others which go hand in hand with it in fair procession, we owe all those privileges which we so justly esteem, and by which the ages since the Reformation are distinguished from those that went before, by all that is Christian in sentiment pure in principle, and charitable in action.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-clarkston-fairbairn.html">John Clarkston Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Baptist in Christian Miscellany</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-06d913088c" data-kw="">
<blockquote><p>The law [as a covenant of works] regards us as creatures originally formed with sufficient ability to yield perfect obedience to it; and accordingly, it requires us to retain and exert that ability in performing perfectly all the duties that we owe to God, ourselves, and our neighbors. Whereas the gospel considers us as sinners, condemned to death in all its extent and totally destitute of strength to perform the smallest degree even of sincere obedience; and it declares to us what God, as a God of infinite grace and mercy, has done and what He offers and promises still to be and do for us (Isa. 42:6–7; Matt. 18:11; Rom. 5:6–10). It declares that in the Lord Jesus believing sinners have righteousness and strength and that in Him they are justified and have life eternal. Accordingly, the doctrines, offers, and promises of it continue to be dispensed to them as long as sin remains in them, but no longer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 132.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e120c966b7" data-kw="">
<blockquote><p>The Justice of Superiors is, whereby they endeavour that every inferior have his due.

This is performed by the Magistrate, in keeping both Tables of the Law; and in promoting and defending the true Religion, as we shewed in the former Book, in the doctrine of the true Church: they practice the same justice, in making laws, punishing offenders, rewarding the keepers of it, and in defending their Subjects against unjust force.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), p. 386.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-faa507451d" data-kw="">
<blockquote><p>As they have done and suffered much for vindicating and maintaining the liberty of their Religion, that what belongeth unto God may be rendered unto God; So do they desire, that according to the rule of righteousness, each man have his own, and above all men, That the things which are Caesar’s be rendered unto him, and to give him that which is God’s were a wronging both of God and Caesar. They have ever been willing to taxes and to pay subsidies above that which they were able. They join with the inward reverence of their hearts, external honour and obedience in all things lawful.

They pour forth their prayers to God in private and public, for all blessings spiritual and temporal upon his Royal Person and Government, and upon his Progeny; and for the same blessings upon the Queen’s Majesty, especially that God by his Spirit would give unto her the knowledge and love of the truth. They long for her conversion as an happiness to herself, and a means of great happiness to the King, to their Children, and to all their Subjects.

And, that the Lord may answer their prayers, they think it incumbent to the Church of England, nor can any bond whatsoever oblige them to the contrary, to use the best and most powerful means, and would most willingly in all humility, love and respect, join their endeavours for that blessed end. And as they thus present their best desires and prayers, so are they ready to sacrifice their lives to God for his Majesty’s good, and in their hearts are grieved that their loyalty, which they account their no small glory, should have been called in question.

Neither is this all. But moreover they do acknowledge that his Majesty, as supreme Magistrate, hath not only charge over the Common-wealth, but doth watch and hath inspection over the Church and Church matters, but in a civil way. Vos Episcopi in Ecclesia (saith Constantine) Ego extra Ecclesiam Episcopus à Deo constitutus sum. And therefore that he is, by his high calling and place, Custos utrius{que} tabulae, to command the precepts of the first table as well as of the second table to be obeyed: That he is Vindex Religionis by his sword, as the Spirit of God in Scripture is Iudex, and the Church is Index: That he hath power to turn the constitutions of the Church into Laws, and to confirm them by the civil sanction in Parliament: That he may constrain all his subjects to do duty in matters of religion, and may punish the transgressors: That when debates arise about Religion, he hath power to call the Assemblies of the Church, to be present and civilly preside in them, and to examine their constitutions, that he may discern of them both as a Christian caring for his own soul, and as supreme Magistrate watching over his people: and that he may do all things which can prove him to be a kind and careful nursing Father.

They account all that is vomited out to the contrary, [as, that they liked Anarchy better then Monarchy, and that they would turn a Kingdom into a democracy,] to be but the fictions and calumnies of the malicious enemies of God and his truth; not unlike the lies which were devised against the Christians of old: their consciences, their words, writings, and actions, even then when the world did put the worst constructions upon them, were witnesses of the integrity of their hearts.

They do still hold that there can be no antipathy betwixt one ordinance of God and another. By him Princes do reign, and he hath also appointed the Officers and Government of his own house. They do desire nothing more then that the Son of God may reign, and that with and under the Son of God, the King may command, and they, as good subjects to Christ and the King, may obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The government and order of the Church of Scotland</cite>, (Edinburgh, 1641), pp 65-68.</span></figcaption>

</figure><figure class="quote" id="q-0dfde41248" data-kw="">
<blockquote><p>The moral law (to begin first with it) is contained under two heads, one of which simply commands us to worship God with pure faith and piety; the other, to embrace men with sincere affection. Accordingly, it is the true and eternal rule of righteousness, prescribed for men of all nations and times, who wish to conform their lives to God’s will. For it is his eternal and unchangeable will that he himself indeed be worshiped by us all, and that we love one another. The ceremonial law was the tutelage of the Jews, with which it seemed good to the Lord to train this people, as it were, in their childhood, until the fullness of time should come [Gal. 4:3–4; cf. ch. 3:23–24], in order that he might fully manifest his wisdom to the nations, and show the truth of those things which then were foreshadowed in figures. The judicial law, given to them for civil government, imparted certain formulas of equity and justice, by which they might live together blamelessly and peaceably. Those ceremonial practices indeed properly belonged to the doctrine of piety, inasmuch as they kept the church of the Jews in service and reverence to God, and yet could be distinguished from piety itself. In like manner, the form of their judicial laws, although it had no other intent than how best to preserve that very love which is enjoined by God’s eternal law, had something distinct from that precept of love. Therefore, as ceremonial laws could be abrogated while piety remained safe and unharmed, so too, when these judicial laws were taken away, the perpetual duties and precepts of love could still remain. But if this is true, surely every nation is left free to make such laws as it foresees to be profitable for itself. Yet these must be in conformity to that perpetual rule of love, so that they indeed vary in form but have the same purpose. For I do not think that those barbarous and savage laws such as gave honor to thieves, permitted promiscuous intercourse, and others both more filthy and more absurd, are to be regarded as laws. For they are abhorrent not only to all justice, but also to all humanity and gentleness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Ford Lewis Battles, The Library of Christian Classics (Louisville, KY: Westminster John Knox Press, 2011), 4.20.15.</span></figcaption>

<blockquote><p>Anyone who has spent any real time among those influenced by the Religious Right in America will know that they hate the thought of anything being “socialised”. Our Reformed forebears, however, did not share this antagonism. They realised that society, not just the individual, was held accountable by God for observing the moral law. That is why the Reformers “socialised” care for the afflicted and education, because the law of God commands the nations to promote these things. (No, this is not “communism”. The Reformers did not advocate wealth equalisation or even the inherent virtue of public ownership of the means of production, but they did recognise that citizens were to contribute to the common good. Consequently, the Reformed position is rightly described as Social Theocratic, and not communist in any real sense of the word.) Since the law applies to society, they entered into social covenants to observe the commandments of the Lord. Notwithstanding the emphasis of modern theonomists on returning to the Old Testament law, not many of them have advocated social covenanting – even though social covenanting has not been abrogated in the New Testament. This is another sorry example of them preferring Mises to Moses. By way of contrast, Samuel Simms demonstrates that social covenanting remains obligatory upon modern societies:

176. What are some of the approved examples of Covenanting in the Old Testament times, to which you refer?

The Old Testament abounds with such examples. The children of Israel, in their national and ecclesiastical capacity, entered into a public, social Covenant at Mount Sinai, after their deliverance from Egypt. (See Exod. xix., xx., xxi, xxii., xxiii., xxiv.) That there was a national Covenant entered into by the Israelites at Sinai few will deny. “The words which the Lord commanded” were “laid before” the people, and “all the people answered together, and said, All that the Lord hath spoken we will do” (chap. xix. 7, 8); and the transaction is spoken of as a “Covenant,” chap. xxiv. 7, 8) […]

180. What is the nature of the argument for Covenant drawn from the New Testament?

It is threefold. First, the New Testament does not abrogate the ordinance; secondly, there are in the New Testament certain general principles which afford a strong presumptive proof in support of the doctrine; and, thirdly, the New Testament contains passages directly bearing on the subject.</p></blockquote>

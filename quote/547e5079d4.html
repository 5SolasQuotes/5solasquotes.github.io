<main class="wrap"><figure class="quote" id="q-547e5079d4" data-kw="">
<blockquote><p>The shadow or image of this glory of Christ is drawn in the Gospel, and therein we behold it as the likeness of a man represented unto us in a glass; and although it be obscure and imperfect in comparison of his own real, substantial glory, which is the object of vision in heaven, yet is it the only image and representation of himself which he hath left, and given unto us in this world. That woful, cursed invention of framing images of him out of stocks and stones, however adorned, or representations of him by the art of painting, are so far from presenting unto the minds of men any thing of his real glory, that nothing can be more effectual to divert their thoughts and apprehensions from it. But by this figurative expression of seeing in a glass, the apostle declares the comparative imperfection of our present view of the glory of Christ.

But the allusion may be taken from an optic glass or tube also, whereby the sight of the eye is helped in beholding things at a great distance. By the aid of such glasses, men will discover stars or heavenly lights, which, by reason of their distance from us, the eye of itself is no way able to discern. And those which we do see are more fully represented, though remote enough from being so perfectly. Such a glass is the Gospel, without which we can make no discovery of Christ at all; but in the use of it we are far enough from beholding him in the just dimensions of his glory. …

Should the Lord Jesus appear now to any of us in his majesty and glory, it would not be unto our edification nor consolation. For we are not meet nor able, by the power of any light or grace that we have received, or can receive, to bear the immediate appearance and representation of them. His beloved apostle John had leaned on his bosom probably many a time in his life, in the intimate familiarities of love; but when he afterward appeared unto him in his glory, “he fell at his feet as dead,” Rev. i. 1 7. And when he appeared unto Paul, all the account he could give thereof was, “that he saw a light from heaven, above the brightness of the sun;” whereon he, and all that were with him, “fell to the ground,” Acts xxvi. 13, 14.

And this was one reason why, in the days of his ministry here on earth, his glory was veiled with the infirmities of the flesh, and all sorts of sufferings, as we have before related. The church in this life is no way meet, by the grace which it can be made partaker of, to converse with him in the immediate manifestations of his glory.

And therefore those who dream of his personal reign on the earth before the day of judgment, unless they suppose that all the saints shall be perfectly glorified also (which is only to bring down heaven to the earth for a while, to no purpose), provide not at all for the edification or consolation of the church. For no present grace, advanced unto the highest degree whereof in this world it is capable, can make us meet for an immediate converse with Christ in his unveiled glory.

How much more abominable is the folly of men, who would represent the Lord Christ in his present glory by pictures and images of him! When they have done their utmost with their burnished glass and gildings, an eye of flesh can not only behold it, but, if it be guided by reason, see it contemptible and foolish. But the true glory of Christ, neither inward nor outward sight can bear the rays of it in this life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations and Discourses on the Glory of Christ, in his Person, Office, and Grace: with the Differences between Faith and Sight; Applied unto the use of them that Believe</cite>, (1684) in William H. Goold (ed.), The Works of John Owen, D.D. (24 vols, Edinburgh: T. &amp; T. Clark, 1850-53), 1: 376, 380.</span></figcaption>

<blockquote><p>All confidence reposed in creatures … is evidently opposed to a correct knowledge of God, since he who places his trust in creatures makes for himself many gods. Hence God expressly condemns in his word all those who repose their confidence either in men, or in power and riches, or in any created object. Avarice, or covetousness, is included in this vice, and condemned.… Idolatry … There are two forms or species of idolatry. One is, when another beside the true God is professedly worshiped, or, when that is worshiped for God which is no God.… The other form of idolatry is when we do not professedly worship another God, but err in the kind of worship we render unto him.… Those who worship God otherwise than he will be worshipped, imagine another God, one differently affected from what the true God is; and in this way they do not worship God, but a figment of their own brain.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, on the First Commandment (creature-trust and forms of idolatry)</span></figcaption>

<blockquote><p>Whereunto it was replied that then Cassander’s images (not for adoration, but for information and incitement) are not Popish, which the Rejoinder does not only grant, but also proves it, by the consent of Calvin himself (Institutes, book 1, ch. 11, sect. 12), where he says, that historical images, or pictures, may have some use, in teaching, and putting, in remembrance. Now for this, let it be considered that Calvin in that section speaks only of ordinary pictures for teaching and putting in remembrance of that which they represent of themselves, without any ecclesiastical institution, as certain words written do signify a certain meaning without any special institution. Such (it may be) would be the picture of Ananias in a white surplice, signifying with other pictures agreeable to the story, that Paul esteemed and called him a whited wall (Acts 23:3). But in the very next section, which is the thirteenth, Calvin, disputing against setting up of any images in churches, does sufficiently declare that he allowed of no ceremonial religious use of images, such as is of our cross and surplice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 283-84 (1633)</span></figcaption>

<blockquote><p>They [the Gnostics] possess paintings—some, moreover, have images made of gold, silver and other materials—and say that such things are portraits in relief of Jesus, and made by Pontius Pilate! That is, the reliefs are portraits of the actual Jesus during his sojourn among men! (10) They possess images like these in secret, and of certain philosophers besides–Pythagoras, Plato, Aristotle, and the rest—and also place other reliefs of Jesus with these philosophers. And having erected them, they worship them and celebrate heathen mysteries. For once they have set these images up, they then follow the customs of heathen–yet what are customs of the heathen but sacrifices and the rest? (11) they say that salvation is of the soul only, and not of bodies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/epiphanius-of-salamis.html">Epiphanius of Salamis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Panarion of Epiphanius of Salamis</cite>, 2 vols. Nag Hammadi Studies vols 35–36. trans. Frank Williams (Leiden: E. J. Brill, 1987), 27, 6, 9–10 (1.105).</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d355956d00" data-kw="">
<blockquote><p>Many prophets of Neo-Confederate mythology argue that attacks on the non-recognition of slave-marriages and legal proscriptions on slave-literacy in the Old South are actually slanderous, and that the antebellum South was the epitome of a Christian commonwealth. The interesting thing is that the Revd James Henley Thornwell, one of the leading proslavery apologists among the Old School Presbyterians,[1] recognised that unbiblical practices concerning slave-marriage and anti-scriptural legislation concerning slave-literacy actually existed in his home state (South Carolina). Although we differ with Thornwell in seeing such things as incidental evils, as the whole system of American slavery was based on iniquitous man-stealing, we do nonetheless applaud his honesty on these matters:

Our Synod has just closed its sessions. A large committee was appointed, of which I am chairman, to draw up a paper, to be presented to the next Synod, on the subject of slavery, defining the true position of our Church, and suggesting means for rectifying some of the abuses and evils incidental to the institution. We shall probably recommend a petition to the Legislature, praying that a law may be enacted, to protect the family relations of the slave; and that the disgraceful statute, which prohibits them from learning to read, may be repealed. I shall take great pains in the preparation of the document, and would be glad to receive any suggestions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-h-thornwell.html">J. H. Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to B. M. Palmer, 20 Oct. 1847 in B. M. Palmer, The life and letters of James Henley Thornwell, D.D., LL.D., ex-president of the South Carolina College, late professor of theology in the theological seminary at Columbia, South Carolina (Richmond, 1875), p. 301.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5f44cb6f49" data-kw="">
<blockquote><p>The woman being created was brought to man and given unto him by God, and he took her, with her consent, as flesh of his flesh, and bone of his bone; and they twain became one flesh. And God commanded this order to be observed unto the end of the world. This was the first institution of this sacred society: So that the first and principal efficient of marriage, was God instituting it; the subordinate, is the mutual consent of the parties. For marriage is a contract, or covenant: This is the general nature of it; and as the matter is one man, and one woman, free from all former obligation that may hinder it, so the form, and chief essence is in the special nature of the contract, whereby they mutually bind themselves one unto another so as to become one flesh for term of life of both the parties. The end is propagation mutual help and comfort, and upon the Fall, per accidens, the avoiding of fornication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-lawson.html">George Lawson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theo-Politica, or, A Body of Divinity Containing the Rules of the Special Government of God</cite>, ... (London: Streater, 1659), ch. 8, 7th Commandment, p. 205</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

t online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-800670808e" data-kw="">
<blockquote><p>On the whole, I think that the calamities of the married state are generally to be imputed to the persons themselves in the following proportion: Three-fourths to the man for want [lack] of care and judgment in the choice, and one-fourth to the woman on the same score. Suppose a man had bought a farm, and after a year or two would, in conversation with his neighbor, make heavy complaints how much he had been disappointed. I imagine his friend might say to him: ‘Did you not see this land before you bought it?’ ‘Oh yes, I saw it often.’ ‘Do you not understand soils?’ ‘I think I do tolerably.’ ‘Did you not examine it with care?’ ‘Not so much as I should have done; standing at a certain place it looked admirably well; the fences too were new, and looked exceedingly neat; the house had been just painted a stone color with paneling; the windows were large and elegant; but I neglected entirely to examine the sufficiency of the materials or the disposition of the apartments. There were in the month of April two beautiful springs, but since I have lived here they had been dry every year before the middle of June.’ ‘Did you not inquire of those who had lived on the place of the permanency of the springs?’ ‘No, indeed, I omitted it.’ ‘Had you the full measure you were promised?’ ‘Yes, every acre.’ ‘Was the right complete and valid?’ ‘Yes, yes, perfectly good; no man in America can take it from me.’ ‘Were you obliged to take it up in part of a bad debt?’ ‘No, nothing like it. I took such a fancy for it all at once that I pestered the man from week to week to let me have it.’ ‘Why really then,’ says his friend, ‘I think you had better keep your complaints to yourself. Cursing and fretfulness will never turn stones into earth or sand into loam [good soil]; but I can assure you that frugality, industry and good culture will make a bad farm very tolerable, and an indifferent one truly good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of the Rev. John Witherspoon</cite>, vol. 7 ed. H. Rondel Rumburg (1801; Harrisonburg, VA: Sprinkle Publications, 2006), ‘Letters on Marriage’, Letter 3, pp. 202-3 Different edition, pp. 244-45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-7b88723573" data-kw="">
<blockquote><p>O, would God in heaven, that some time a government might be established that would do away with the public bawdy-houses, as was done among the people of Israel! It is indeed an unchristian sight, that public houses of sin are maintained among Christians, a thing formerly altogether unheard of.

It should be a rule that boys and girls should be married early and such vice be prevented. Such a rule and custom ought to be sought for by both the spiritual and the temporal power. If it was possible among the Jews, why should it not also be possible among Christians? Nay, if it is possible in villages, towns and some cities, as we all see, why should it not be possible everywhere?</p></blockquote>

</figure><figure class="quote" id="q-c7d77a0489" data-kw="">
<blockquote><p>That power is given by the Presbyteries’ act of ordination, by order of nature, before the people’s formal act of election: As the husband who in a lapidaries shop chooses a gold ring for his wife, and puts it on her finger, presupposes it was a gold ring before his choosing thereof, neither does his choosing thereof make it a gold ring, but only makes it his wife’s gold ring by application to her: Just so, peoples election appropriates such a man who is already a pastor to such a charge, but does not make the pastor a pastor, but chooses him only to be their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 17, p. 267</span></figcaption>

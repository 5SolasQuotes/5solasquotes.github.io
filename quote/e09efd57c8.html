<main class="wrap"><figure class="quote" id="q-e09efd57c8" data-kw="">
<blockquote><p>In this treatise Hemmingsen [a Lutheran] argues that all particular rules of ethical conduct can be derived from immutable axioms or first principles. Though moral philosophy works according to its own rules, Hemmingsen shows that its conclusions, far from being at odds with the divine revelation of the moral law, are identical with the ethical commandments of Scripture. Thus Hemmingsen includes a section on the Decalogue, along with a lengthy account of the traditional cardinal virtues, supported by a myriad of quotations from classical Greek and Roman sources. This important treatise looks both backward to classical and medieval philosophy and forward to developments in the seventeenth century and beyond.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niels-hemmingsen.html">Niels Hemmingsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Law of Nature: A Demonstrative Method ed. &amp; trans. Hutchinson</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-72c5a026dc" data-kw="">
<blockquote><p>Did the Lord by Moses give to the Jews as a body politic sundry judicial laws which expired with their state? Yes. Do they oblige any other now, further than the general equity thereof may require? No (Ex. 21; 22:1-29; Gen. 49:10; 1 Cor. 9:8-10; 1 Pet. 2:13-14; Mt. 5:17,38-39). Well then, do not some err, though otherwise orthodox, who maintain that the whole judicial law of the Jews is yet alive and binding all of us who are Christian gentiles? Yes. By what reasons are they confuted? 1. Because the judicial law was delivered by Moses to the Israelites to be observed, as to a body politic (Ex. 21). 2. Because this law, in many things which are of particular right, was accommodated to the commonwealth of the Jews, and not to other nations also (Ex. 22:3; 21:2; Lev. 25:2-3; Dt. 24:1-3; 25:5-7). 3. Because, in other things which are not of particular right, it is neither from the law of nature obliging by reason; neither is it pressed upon believers under the gospel to be observed. 4. Because believers are appointed under the gospel to obey the civil law and commands of those under whose government they live, providing they be just, and that for conscience’ sake (Rom. 13:1; 1 Pet. 2:13-14; Titus 3:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error, ch. 19, question 4 (the first commentary defending the Westminster Confession)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

/the-civil-law/#:~:text=Did%20the%20Lord%20by%20Moses%20give,13%3A1%3B%201%20Pet.%202%3A13%2D14%3B%20Titus%203%3A1&amp;text=Did%20the%20Lord%20by%20Moses%20give%20to%20the&amp;text=sake%20%28Rom.%2013%3A1%3B%201%20Pet.%202%3A13%2D14%3B%20Titus%203%3A1" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-3767a9a094" data-kw="">
<blockquote><p>…there were no oblations [in the OT, such as free-will offerings] left wholly to the pleasure of men, for though the particulars were not, nor could not be determined by a distinct rule in general, yet they were determined by the circumstances, as our divines are wont to answer the Papists about their vows, counsels, superarrogations: ‘Not by a general law, but by concurrence of circumstances.’ So Dt. 16:10, Moses shows that the freest offerings were to be according as God had blessed them, from whence it follows it had been sin for any Israelite whom God had plentifully blessed to offer a pair of pigeons instead of a bullock, or two, upon his own mere pleasure:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship (Amsterdam: Thorp, 1633), Manuduction, ch. 12, section 2</cite>, pp. 152-53</span></figcaption>

</figure><figure class="quote" id="q-21077c0d55" data-kw="">
<blockquote><p>Some judicial precepts are Juris communis, of common equity, such as are agreeable to the instinct and law of nature, common to all men; and these for substance bind all persons, both Jews and Gentiles; as being Moral, and so agreeing with the Moral Law. These judicial precepts which were Juris particularis, of particular equity, such as pertained especially to the Jews’ commonwealth, and were fitted for them and their time, are now abolished, e.g., that a man should marry with none but his own stock; that the brother should raise up seed to his brother, and that a thief should restore fourfold, this was peculiar to the Jewish commonwealth and not to ours…. So then those judicial and civil precepts which are agreeable to the Moral Law, and do confirm and uphold it, they bind for ever. For example, ’tis a judicial Law that adulterers and adulteresses should die the death; now this being agreeable to common equity, and to the Law of Nature, as appears (Gen. 38:24) where Judah (before this judicial Law was publish by Moses) appoints Tamar his daughter-in-Law to be burnt for this sin, and Nebuchadnezzar burnt Ahab and Zedekiah for it (Jer. 29:21-23), so this judicial Law of putting witches to death by the magistrate, is agreeable to common equity, it helps to preserve all the Moral precepts which are broken by the idolatry, murder, and malice, of witches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4 (1658)</cite>, pp. 227-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

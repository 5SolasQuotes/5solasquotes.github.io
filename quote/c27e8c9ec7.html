<blockquote><p>Randall in his epistle before the treatise called, The Bright Star: ‘I have therefore observed the ever to be bewailed non-proficiency of many ingenious spirits, who through the policy of others, and the too too much modesty and temerity of themselves, have precluded the way of progress to the top and pitch of rest and perfection against themselves, as being altogether unattainable, and have shortned the cut with a Non datur ultra [more is not given], and are become such who are ever learning and never come to the knowledge of the truth.’ But for the measure, sure it is not as Antinomians and Familists dream, complete and full in this life: 1. Because according to the manner and measure of the manifestation of Christ and knowledge, so is love and the perfection of believers. This is a truth in itself undeniable and granted by the author of the Bright Star, ch. 5, p. 52. For Christ’s excellency and drawing beauty in love goes in to the soul by the port and eye of knowledge. But 1 Cor. 13:9, ‘We know in part and we prophesy in part.’ 2. Paul disclaimes perfection as being but in the way and journeying toward it, Phil. 3:12, ‘Not as though I had already attained, either were already perfect: but I follow after, if that I may apprehend that for which also I am apprehended of Jesus Christ.’ Now this perfection which Paul professes he wants [lacks], is opposed vv. 13-14, to his pressing toward the garland, for the price of the high calling of God in Jesus Christ, Heb. 11:40. 3. Perfection, such as we expect in heaven, is in no capacity to receive any farther addition, or accession of grace or glory; nor is there a growing in grace and in the knowledge of our Lord and Saviour Jesus Christ, enjoined us there, as is expressly here in the way to our country, 2 Pet. 3:14, and to run our race to the end, Heb. 12:1, and be carried on to perfection, Heb. 6:1. It’s true, our good works are washed in the fountain opened for David’s house, in which our persons are washed; but that washing removes the sinful guilt, and Law-obligation from them, but not the inherent blot and sinful imperfection of our works, to make them perfect; for then might we be justified by our good works, if Christ’s blood make them to leave off to be sins; but that blood hinders them to be imputed to us only, but removes not their sinfull imperfections, as Antinomians say, that so they may make us perfect in this life: nor does that blood (as Papists say) add a meriting dignity and virtue to them, by which we are justified by works made white and meritorious in Christ’s blood and merits. God has so portraicted and chalked the way to heaven that all the most supernatural acts, even those that have immediate bordering with the vision of glory, should need a pass of pardoning grace; and to believe that Christ’s grace shall work in us acts void of sin, is not faith. Therefore we are to believe the pardon of such ere they have being, and not sanctifying grace to eschew them. It seems to me unbelieving murmuring to be cast down at these sins in such a way as to imagine we can eschew them, or that grace sanctifying is wanting to us in these; for grace is not due to sinless acts. Nor does the growing in grace which lies on us, by an obligation of a command, stop the way to the journeying toward perfection and heaven, nor shorten the cut to heaven, because heaven is not attainable in this life; but by the contrary, if perfection were attainable in this life, the man that attains it might sit down, rest there, and go not one step farther; for except he should go beyond the crown, and to the other side of heaven, and over-journey Christ at the right hand of God, whither should he go? And those that are ever learning and never come to the knowledge of the truth, are, 2 Tim. 3:5, lovers of pleasures more than lovers of God; such as we are to turn away from; as have a form of godliness, and have denied the power thereof; and are led away with diverse lusts; and are never entered into one only degree or step of the way of the saving knowledge of the truth, of which Paul speaks, and not the truly regenerate, who believe, with Paul and the Scriptures, that our greatest perfection is to sweat and contend for the highest pitch of perfection, even that which is beyond time. 4. Those that are perfected, as we hope we shall be in heaven, feed not with the Beloved among the lillies till the day break and the shadows fly away; but the perfectest, the Spouse of Christ, so feeds on Church-ordinances, Cant. 2:17. The perfect ones have the fullest pitch of the noon-day sun of glory; it shall never be afternoon nor the evening or twilight sky with them; nor shall any night-shadow nor cloud go over their sun. 5. In the Kingdom of perfect, on there shall be no indwelling of a body of sin, no sin, no uncleanness of heart, no turning of the love and liking of the soul off God; but the perfectest in this life sin and carry an indwelling body of sin with them; Prov. 20:9; Eccl. 7:20; Job says, ch. 14.4, The perfectest that beget children are unclean. Rom. 7:17-23; 1 Jn. 1:8-10; 1 Jn. 2:1. All that have need of a High Priest at the right hand of God to intercede for them, have sin, and insofar are imperfect, as all the saints are, Heb. 7:25 &amp; 4:15 &amp; 1:17-18 &amp; 8:1-2, • &amp; 9:23-26. And 1 Cor. 13:8, ‘Love never faileth:’ 〈…〉 abundantly, and is filled to satisfaction, that t•e 〈◊〉 I can contain no more of God; and is transformed in 〈…〉 of transcendent light, and highest love, as it were l•st in the deep fountain of universal and immensurable love and light; and the creature’s soul and love lives and breathes, rests in the bosom, in the heart, in the bowels of him who is an infinite mass of love; is wrapped in the sugared floods, in the honey-brooks and over-flowing waves and rivers of pure and unmixed joy, sleeps and solaces itself in the innocent embracings of the glory that shines, rays, and darts, world without end, out of Christ, exalted far above all heavens, all principalities, and powers, the souls there are sweetened, more than sweetened, over-solaced with the noonday-light of the Bridegroom’s glory, having in it the sweetest perfections of the morning-sun; they flee with doves’ wings of beauty after the Lamb, they never want the actual breathings of the Spirit of glory, they can never have enough of the chaste fruition of the glorious Prince Immanuel and they never want his inmost presence to the full; they suck the honey, the floods of milk of eternal consolations, and •ll all empty desires; and as if the soul were without bottom, afresh they suck again in acts for eternity continued; there be no such thing here in this life. Yet has Christ crucified in his bosom, the promise and full purchase of this life on the cross, and holds it out to sinners to draw them. 5 [sic]. We have not yet attained to the resurrection of our bodies, but cary about such clods of death as the wormes must sweetly feed on, and have a seed, and subject of distempers in our clay-tabernacles; all which we are uncapable of in the state of perfection, when the body shall be more naturally clothed with immortality, then the greenest and most delicious rose or flower which we could suppose were growing fresh, greene, and beautiful forever in such a happy soil as the fields that lie on the banks and within the drawings of sap from the river of life. 6. We are not masters of the invasion, at least of temptations of devils, of men, here. 7. Perfection makes the general assembly of all the sons of Sion, the heavenly family is never convened, but in place, country, condition separated, some born, some not born, some w•king, some sleeping in the dust, some in their country, some in the way to their country. 8. There is no Temple, no ordinances in our country of perfecttion, Rev.•1.2; 1 Cor. 13:8. 9. Th••e •s •o Ang•l▪ life here without marriage, eating, drinking, begeting of children, Lk. 22:29-30; Mk. 12:25. Clay cannot live, 〈◊〉 earthly, up above the clouds, and visible heavens, till this corruptible shall put on incorruption, 1 Cor. 15.</p></blockquote>

+Christ%2C+enjoined+us+there%2C+as+is+expressly+here+in+the+way+to+our+country%2C+2+Pet.+3%3A14%2C+and+to+run+our+race+to+the+end%2C+Heb.+12%3A1%2C+and+be+carried+on+to+perfection%2C+Heb.+6%3A1.+It%E2%80%99s+true%2C+our+good+works+are+washed+in+the+fountain+opened+for+David%E2%80%99s+house%2C+in+which+our+persons+are+washed%3B+but+that+washing+removes+the+sinful+guilt%2C+and+Law-obligation+from+them%2C+but+not+the+inherent+blot+and+sinful+imperfection+of+our+works%2C+to+make+them+perfect%3B+for+then+might+we+be+justified+by+our+good+works%2C+if+Christ%E2%80%99s+blood+make+them+to+leave+off+to+be+sins%3B+but+that+blood+hinders+them+to+be+imputed+to+us+only%2C+but+removes+not+their+sinfull+imperfections%2C+as+Antinomians+say%2C+that+so+they+may+make+us+perfect+in+this+life%3A+nor+does+that+blood+%28as+Papists+say%29+add+a+meriting+dignity+and+virtue+to+them%2C+by+which+we+are+justified+by+works+made+white+and+meritorious+in+Christ%E2%80%99s+blood+and+merits.+God+has+so+portraicted+and+chalked+the+way+to+heaven+that+all+the+most+supernatural+acts%2C+even+those+that+have+immediate+bordering+with+the+vision+of+glory%2C+should+need+a+pass+of+pardoning+grace%3B+and+to+believe+that+Christ%E2%80%99s+grace+shall+work+in+us+acts+void+of+sin%2C+is+not+faith.+Therefore+we+are+to+believe+the+pardon+of+such+ere+they+have+being%2C+and+not+sanctifying+grace+to+eschew+them.+It+seems+to+me+unbelieving+murmuring+to+be+cast+down+at+these+sins+in+such+a+way+as+to+imagine+we+can+eschew+them%2C+or+that+grace+sanctifying+is+wanting+to+us+in+these%3B+for+grace+is+not+due+to+sinless+acts.+Nor+does+the+growing+in+grace+which+lies+on+us%2C+by+an+obligation+of+a+command%2C+stop+the+way+to+the+journeying+toward+perfection+and+heaven%2C+nor+shorten+the+cut+to+heaven%2C+because+heaven+is+not+attainable+in+this+life%3B+but+by+the+contrary%2C+if+perfection+were+attainable+in+this+life%2C+the+man+that+attains+it+might+sit+down%2C+rest+there%2C+and+go+not+one+step+farther%3B+for+except+he+should+go+beyond+the+crown%2C+and+to+the+other+side+of+heaven%2C+and+over-journey+Christ+at+the+right+hand+of+God%2C+whither+should+he+go%3F+And+those+that+are+ever+learning+and+never+come+to+the+knowledge+of+the+truth%2C+are%2C+2+Tim.+3%3A5%2C+lovers+of+pleasures+more+than+lovers+of+God%3B+such+as+we+are+to+turn+away+from%3B+as+have+a+form+of+godliness%2C+and+have+denied+the+power+thereof%3B+and+are+led+away+with+diverse+lusts%3B+and+are+never+entered+into+one+only+degree+or+step+of+the+way+of+the+saving+knowledge+of+the+truth%2C+of+which+Paul+speaks%2C+and+not+the+truly+regenerate%2C+who+believe%2C+with+Paul+and+the+Scriptures%2C+that+our+greatest+perfection+is+to+sweat+and+contend+for+the+highest+pitch+of+perfection%2C+even+that+which+is+beyond+time.+4.+Those+that+are+perfected%2C+as+we+hope+we+shall+be+in+heaven%2C+feed+not+with+the+Beloved+among+the+lillies+till+the+day+break+and+the+shadows+fly+away%3B+but+the+perfectest%2C+the+Spouse+of+Christ%2C+so+feeds+on+Church-ordinances%2C+Cant.+2%3A17.+The+perfect+ones+have+the+fullest+pitch+of+the+noon-day+sun+of+glory%3B+it+shall+never+be+afternoon+nor+the+evening+or+twilight+sky+with+them%3B+nor+shall+any+night-shadow+nor+cloud+go+over+their+sun.+5.+In+the+Kingdom+of+perfect%2C+on+there+shall+be+no+indwelling+of+a+body+of+sin%2C+no+sin%2C+no+uncleanness+of+heart%2C+no+turning+of+the+love+and+liking+of+the+soul+off+God%3B+but+the+perfectest+in+this+life+sin+and+carry+an+indwelling+body+of+sin+with+them%3B+Prov.+20%3A9%3B+Eccl.+7%3A20%3B+Job+says%2C+ch.+14.4%2C+The+perfectest+that+beget+children+are+unclean.+Rom.+7%3A17-23%3B+1+Jn.+1%3A8-10%3B+1+Jn.+2%3A1.+All+that+have+need+of+a+High+Priest+at+the+right+hand+of+God+to+intercede+for+them%2C+have+sin%2C+and+insofar+are+imperfect%2C+as+all+the+saints+are%2C+Heb.+7%3A25+%26+4%3A15+%26+1%3A17-18+%26+8%3A1-2%2C+%E2%80%A2+%26+9%3A23-26.+And+1+Cor.+13%3A8%2C+%E2%80%98Love+never+faileth%3A%E2%80%99+%E3%80%88%E2%80%A6%E3%80%89+abundantly%2C+and+is+filled+to+satisfaction%2C+that+t%E2%80%A2e+%E3%80%88%E2%97%8A%E3%80%89+I+can+contain+no+more+of+God%3B+and+is+transformed+in+%E3%80%88%E2%80%A6%E3%80%89+of+transcendent+light%2C+and+highest+love%2C+as+it+were+l%E2%80%A2st+in+the+deep+fountain+of+universal+and+immensurable+love+and+light%3B+and+the+creature%E2%80%99s+soul+and+love+lives+and+breathes%2C+rests+in+the+bosom%2C+in+the+heart%2C+in+the+bowels+of+him+who+is+an+infinite+mass+of+love%3B+is+wrapped+in+the+sugared+floods%2C+in+the+honey-brooks+and+over-flowing+waves+and+rivers+of+pure+and+unmixed+joy%2C+sleeps+and+solaces+itself+in+the+innocent+embracings+of+the+glory+that+shines%2C+rays%2C+and+darts%2C+world+without+end%2C+out+of+Christ%2C+exalted+far+above+all+heavens%2C+all+principalities%2C+and+powers%2C+the+souls+there+are+sweetened%2C+more+than+sweetened%2C+over-solaced+with+the+noonday-light+of+the+Bridegroom%E2%80%99s+glory%2C+having+in+it+the+sweetest+perfections+of+the+morning-sun%3B+they+flee+with+doves%E2%80%99+wings+of+beauty+after+the+Lamb%2C+they+never+want+the+actual+breathings+of+the+Spirit+of+glory%2C+they+can+never+have+enough+of+the+chaste+fruition+of+the+glorious+Prince+Immanuel+and+they+never+want+his+inmost+presence+to+the+full%3B+they+suck+the+honey%2C+the+floods+of+milk+of+eternal+consolations%2C+and+%E2%80%A2ll+all+empty+desires%3B+and+as+if+the+soul+were+without+bottom%2C+afresh+they+suck+again+in+acts+for+eternity+continued%3B+there+be+no+such+thing+here+in+this+life.+Yet+has+Christ+crucified+in+his+bosom%2C+the+promise+and+full+purchase+of+this+life+on+the+cross%2C+and+holds+it+out+to+sinners+to+draw+them.+5+%5Bsic%5D.+We+have+not+yet+attained+to+the+resurrection+of+our+bodies%2C+but+cary+about+such+clods+of+death+as+the+wormes+must+sweetly+feed+on%2C+and+have+a+seed%2C+and+subject+of+distempers+in+our+clay-tabernacles%3B+all+which+we+are+uncapable+of+in+the+state+of+perfection%2C+when+the+body+shall+be+more+naturally+clothed+with+immortality%2C+then+the+greenest+and+most+delicious+rose+or+flower+which+we+could+suppose+were+growing+fresh%2C+greene%2C+and+beautiful+forever+in+such+a+happy+soil+as+the+fields+that+lie+on+the+banks+and+within+the+drawings+of+sap+from+the+river+of+life.+6.+We+are+not+masters+of+the+invasion%2C+at+least+of+temptations+of+devils%2C+of+men%2C+here.+7.+Perfection+makes+the+general+assembly+of+all+the+sons+of+Sion%2C+the+heavenly+family+is+never+convened%2C+but+in+place%2C+country%2C+condition+separated%2C+some+born%2C+some+not+born%2C+some+w%E2%80%A2king%2C+some+sleeping+in+the+dust%2C+some+in+their+country%2C+some+in+the+way+to+their+country.+8.+There+is+no+Temple%2C+no+ordinances+in+our+country+of+perfecttion%2C+Rev.%E2%80%A21.2%3B+1+Cor.+13%3A8.+9.+Th%E2%80%A2%E2%80%A2e+%E2%80%A2s+%E2%80%A2o+Ang%E2%80%A2l%E2%96%AA+life+here+without+marriage%2C+eating%2C+drinking%2C+begeting+of+children%2C+Lk.+22%3A29-30%3B+Mk.+12%3A25.+Clay+cannot+live%2C+%E3%80%88%E2%97%8A%E3%80%89+earthly%2C+up+above+the+clouds%2C+and+visible+heavens%2C+till+this+corruptible+shall+put+on+incorruption%2C+1+Cor.+15.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29%2C+pp.+342-45&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc27e8c9ec7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c27e8c9ec7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-perfectionism/#:~:text=Randall%20in%20his%20epistle%20before%20the,put%20on%20incorruption%2C%201%20Cor.%2015." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. The word ‘sanctification‘ also signifies the same thing for the main as conversion does, only with these small differences following: 1. The word is more comprehensive, for it signifies our whole state of dedication or devotedness to God, which comprehends in it these four things: 1. The change of a man’s qualities, whereby he is made fit for the service of God; having his heart bent towards Him, and set upon Him. 2. The actual dedication or devoting of a man’s self to God by faith and a holy covenant, especially in baptism, by solemn vow or engagement. 3. The relation of a person so dedicated or devoted to God; as he is one set apart to Him for holy uses; and it is from this relation especially that the word ‘sanctification’ is used. 4. The holiness of life that follows hereupon; in the actual living to God, to whom we are devoted. Sanctification comprehends all this, and so comprehends in it vocation and somewhat more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion… (London: R.W., 1657), ch. 1, sect. 3</cite>, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

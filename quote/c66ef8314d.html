<main class="wrap"><figure class="quote" id="q-c66ef8314d" data-kw="">
<blockquote><p>As another, though a merely supplementary argument, it may be stated, that, just as all the texts of scripture which bear upon the spiritual independence of the Church have a direct application to this subject also, so all the texts that have been cited in support of Non-intrusion may be adduced with equal propriety as irreconcilable with Patronage, even in its most restricted form. Had it been intended in the Church that such a high and responsible power as is implied in the nomination of a minister should be lodged in a peculiar class of the members of the Church, we should certainly have expected to find some directions specially addressed to them, to guide them in the exercise of it. And the fact that we find no such directions, affords at least a presumption that it was not designed they should possess the power. The presumption becomes stronger, and amounts almost to certainty, when we actually find in the Bible such directions addressed, not indeed to a select few, but to the whole body of the disciples.

There is a strong implied argument against any system of nomination, and much more against Patronage, contained in the exhortation, “Beloved, believe not every spirit, but try the spirits whether they be of God;” or in the following, “Beware of false prophets.” The mere fact, indeed, that every exhortation on such a subject is addressed to the whole body of believers, implies that they were all to be possessed of equal privileges, in the matter of a Minister’s settlement. They are spoken to as occupying the same ground, as having the same standing in the Church, and possessing an equal voice in the trial of the spirits. They are enjoined to the discharge of a solemn duty, in a matter in which all have an equal interest; and it is manifestly anti scriptural that an equality, either of right or of obligation, should be created, where it was plainly intended none such should exist.

Besides, from the connexion in which the above passages stand, and the declared purpose for which such injunctions were given to the disciples, it is sufficiently clear that the ordinance of Christ for keeping false prophets out of the Church, is by giving the trial of them to the body of disciples, on whom this duty and responsibility is laid. It is common enough to hear a great deal said about the unfitness of the Christian people, on the one hand, to choose their own ministers, and on the other, about the obvious advantage likely to result from the nomination being lodged in the hands of those who are of superior rank and learning, and the remedy which the Church courts have in their own hands against any possible evil, by a more rigid examination and trial.

Now, without attempting to deny that a godly and intelligent Patron, and a faithful Presbytery, may do much to keep out of the Church wolves in sheep’s clothing, it would be well at the same time to remember, that the great check suggested by Him who is the fountain of all wisdom, is the trial by the disciples. Where this is restrained from its full and free exercise, or altogether prevented, the barrier which Christ has thrown around his flock is impaired or destroyed, and we cannot expect that they shall be kept safe in any other way. By devices of mere human wisdom the Church was never yet defended or prospered, and the only security we have, is to follow implicitly the counsels of the Great Shepherd. He has given it in charge to His people to try the spirits, to guard against false prophets, and it becomes us to beware how, in the smallest degree, we interfere with the divine arrangement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 34.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e1e86377b7" data-kw="">
<blockquote><p>2. [John] Robinson [a Separatist] says, ‘fundamental truths are holden and professed by as vile heretics as ever were since Christ’s days; a company of excommunicates may hold, teach and defend fundamental truths, yet are they not a true Church of God?’ [Rutherford’s] Answer. Papists hold fundamentals, and so do Jews hold all the Old Testament, and Papists hold both New and Old, but we know they so hold fundamentals that by their doctrine they overturn them; and though there be fundamentals taught in the Popish Church which may save if they were believed, yet they are not a true and ministerial Church simply, because, though they teach that there is one God, they teach also there is a thousand Gods whom they adore, and though they teach [that] there is one Mediator, yet do they substitute infinite Mediators with and besides Christ, so that the truth is, not a formal, ministerial and visible active external calling is in the Church of Rome, as it is a visible Church, in the which we can safely remain, though fundamentals be safe in Rome, and the books of the Old and New Testament be there, yet are they not there ministerially as in a mother whose breasts we can suck; for fundamental points falsely exponed, cease to be fundamental points; yea as they be ministerially in Rome, they be destructive of the foundation, though there be some ministerial acts valid in that Church, for the which the Church of Rome is called a true Church, [in Greek], in some respect, according to something essential to the true Church, yet never sine adjecto [without the adjunct], as if it were a true Church where we can worship God. Fundamentals are safe in Rome materially in themselves, so as some may be saved who believe these fundamentals; but fundamentals are not safe in Rome, Ecclesiastice, Ministeraliter, Pastoraliter [ecclesiastically, ministerially, pastorally], in a Church way, so as by believing these from their chairs so exponed, they can be saved who do believe them.</p></blockquote>

<blockquote><p>Look even to the Synod of Ulster. While that church was unfaithful to her Lord, and had allowed her standards to fall into disuse; error, it is admitted, crept into and devastated her borders. But fearless men arose within her to “contend for the faith,” and uplift again her ancient testimony, and now, having shaken off the incubus that prostrated her energies, she is walking forth over the land with brightening vision and buoyant tread, having favour with her Lord, and going forth to his help against the embattled hosts of the mighty.

Her past redemption from error she achieved, her present steadfastness in the truth she maintains, and all without the aid of a liturgy. How? By the blessing of God on the means she used, not the “conservative resource” of preaching merely, but the resumption of her ancient formularies, and the exercise of a discipline which the Presbyterianism of her government enabled her to wield.</p></blockquote>

<blockquote><p>Q. Let us proceed, what is meant by the communion of saints? A. The holy fellowship of the faithful. Q. What does this word ‘Communion’ signify? A. A knitting together in one. … Q. Do the godly love one another whom they have never seen? A. Yea, and therefore it is put within the compass of things which are to be believed.</p></blockquote>

</figure><figure class="quote" id="q-9a44bb35d9" data-kw="">
<blockquote><p>Of those who desire truly Christian government only a small band are “political dissenters.” Admit that they are the far-seeing, the logical, the consistent, and the courageous national reformers; give them the credit of occupying “the post of honour in the forefront of the hottest battle.” … ; admit that they hold a place in the National Reform movement similar to that of the Garrisonians in the Anti-Slavery movement. … It by no means follows that political dissent is the only way, or even the principal way, to promote the cause of National Reform. It by no means follows that this cause is to be carried by the conversion of any considerable number of “the members of other churches to political dissent.” It by no means follows that political dissent should be insisted upon as essential to the National Reform movement.

In the January R. P. and C. [Reformed Presbyterian and Covenanter] it is clearly intimated that the National Reform movement, with its organ, the Christian Statesman, should be placed on the ground of political dissent. Reference is made to the Garrisonian movement as showing how potent, if not omnipotent, was political dissent in the antislavery conflict. Let it not be forgotten that the Garrisonians never made political dissent their main theme, never made political dissent a test for anti-slavery workers, never aimed to convert any considerable number of the anti-slavery people to their views. What would have been the result had they won over a majority of the anti-slavery people, is a question which only the lineal descendants of the schoolmen would care to ask.

What would be the result should we adopt the suggestion made in the November number of Our Banner, i.e. Should we send out a corps of true (?) National Reformers “to win over the members of other churches to political dissent,” is a question which must take its place beside the unanswerable question. What shall we do with all the larks we shall catch when the skies fall? Is it not notorious that the ablest and most faithful and zealous of our ministers, even those who insist that political dissent should be kept in the front of all national reform work, instead of winning over the members of other churches, have barely been able to keep their own people true to their ideas of political dissent?

No; the Garrisonians and the Covenanters, in their opposition to slavery, never dreamed of success by means of the conversion of the anti-slavery hosts to their views; and their success came without any such conversion. What they steadily aimed to do was to win over a majority of the people to a position of determined opposition to slavery. Nor is this whole work to be ascribed to them alone. They were the forerunners of “the great uprising for liberty and justice.” God employed them to do a noble work, for which let them be rewarded with immortal honour; but let us not forget that scores, hundreds, millions of others were employed to do a work none the less necessary to be done. A grand debate, which lasted for 30 years. debate in the Congress of the United States with a continent for an audience, resulted in the overthrow of slavery, first from its dominant place in the government by the election of Abraham Lincoln, and then from the whole land by battle.

To give the whole credit of the success of the anti-slavery movement to the little band of political dissenters, taking no note of all that was done by such men as Seward, Sumner, Chase, Stanton, Lincoln, yes, such men as Grant, Sherman and John Brown, and millions of those who for a lifetime wrought, prayed, voted and fought against slavery, without ever once dreaming of political dissent, is about as fair a representation of the beginning, progress and consummation of the anti-slavery movement as to represent that we owe the splendour and glory of the brightest summer day to the light of the morning star.

Of the hosts that, in debate and in tattle carried the anti-slavery cause to success, only a very small band were political dissenters. To put it mildly, is there not every reason to believe that the advocates and champions of the National Reform movement will need the aid of others than political dissenters? In fact, notice that those who make the most of political dissent do themselves, always in the end, admit that the amendment must be carried by those who are not political dissenters; and some of them maintain that it must be carried by them alone, since political dissenters could not even vote for the complete amendment, were it proposed, because, according to them, this would be inconsistent with “political dissent.</p></blockquote>

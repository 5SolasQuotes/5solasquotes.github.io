<main class="wrap"><figure class="quote" id="q-7b2bea5a5e" data-kw="">
<blockquote><p>II. Answerable to a servant’s obeisance must be his whole behavior before his master, seasoned and ordered with such modesty and humility, as may manifest an honorable respect to his master: as … 2. By uncovering their heads in their master’s presence: this in our days, and in the parts of the world where we dwell, is in the male kind a sign and token of subjection.</p></blockquote>

</figure><figure class="quote" id="q-3dcf8eb3d7" data-kw="">
<blockquote><p>We may… try to conceive the landscape, and the parish features generally, as the new incumbent [John Macmillan of Balmaghie] saw them in 1701… The dress of the people was on a par with their homes and fare. A Galloway man wore constantly, even in church, his broad blue bonnet, made in Kilmarnock… Young girls at home wore no head-covering, but snooded their locks with a piece of string or ribbon. At fair or church, they wore white linen mutches [linen caps], slightly plaited above the brow. The farmers’ wives covered their heads with coarse white linen toys [linen or wool headdresses that hang down over the shoulders] when they went a-visiting.¹ ¹ For all the above, I have drawn on Nicholson’s History, II. 332-339.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-m-reid.html">Henry M. Reid</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Cameronian Apostle: being Some Account of John Macmillan of Balmaghie</cite>, (London: Gardner, 1896), pp. 50, 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-ebe7e3e6b2" data-kw="">
<blockquote><p>…then he falls to the preaching, which some hear with their heads covered, some otherwise (in that you may do as your health requires)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cowper.html">William Cowper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Seven Days Conference between a Catholic Christian &amp; a Catholic Roman</cite>, … (London, 1613), the 7th Day, p. 219 Cowper was a Scottish bishop; men being uncovered during the preaching likely reflects the episcopalian practice, imitating Anglicanism, of persons normally having their hats off the whole time they are in the church building, out of a superstitious reverence (unless they keep them on for warmth).</span></figcaption>

<main class="wrap"><figure class="quote" id="q-e5b5857ab7" data-kw="">
<blockquote><p>. . . how Christ was a curse, or accursed, who is the fountain of blessedness? Answer. He is not so by nature. For He is the natural Son of God. Not by His own fault, for He is the unspotted lamb of God. But by voluntary dispensation, and therefore Paul says, “He was made a curse.” And He was made a curse, first, because He was set apart in the eternal counsel of the Father, Son, and Holy Ghost to be our redeemer and consequently to be a curse. In this regard, the Father is said to have “sealed” Him (John 6:27), and He is said again to be “preordained before all worlds” (1 Peter 1:20) and given “according to the counsel and foreknowledge of God” (Acts 2:23). Secondly, He was made a curse in that He was in time consecrated to be our mediator and so a curse. And this consecration was first in His baptism, in which He put upon Him our guilt, as we put off the same in ours; and, secondly, on the cross and passion, in which He took unto Him the punishment of our sin. And thus was He made a curse. It may be objected that He is the Son of God, and therefore no curse. Answer. Christ must be considered as the Son of God, and again as our pledge and surety (Heb. 7:22). In the first respect He was not accursed, but in the second.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 180.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a89df48283" data-kw="">
<blockquote><p>Reply to Objection 4: Although the drop of blood that bled in the circumcision would be sufficient for every satisfaction, considering the condition of the divine person, nevertheless it would not be sufficient relative to the kind of penalty. For the human race was obligated to death, for which it was necessary that a death be paid. … Reply to Objection 6: The other penalties that Christ endured, although they were sufficient to make satisfaction on behalf of human nature, considering the condition of the one suffering, nonetheless this is not the case when considering the kind of penalty. For all other penalties were not contained in those penalties, as they were in the suffering of death.</p></blockquote>

<blockquote><p>Whether Christ actually expiated and satisfied for our sins? It is affirmed contra the Socinians. Whether such an expiation was necessary? It is affirmed contra the Socinians. Whether it was a full and total expiation? It is affirmed. Whether it is able to be said Christ according to each nature was a sacrifice and victim? It is denied. Whether his oblation of Himself was properly a victim? It is affirmed. Whether therefore passions ought not to be referred to the sacrifice and victim? It is affirmed. Whether the whole passive obedience of Christ is able to be called a victim and sacrifice? It is denied with a distinction. Whether that dignity, by which the death of Christ redounds dignity and efficacy, so it is a ransom (lutron), is able to be called part of the victim? It is distinguished. Whether the divine nature was the altar, or indeed the sign of the cross was? The former is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syllabus of Theological Problems</cite>, (Utrecht, 1643), pt. 1, section 2 Abbr. | tract 2 | Of the First Part, or of the Act: The Sacrifice of the Priestly Office, even the Full Satisfaction &amp; Expiation</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-c9dddd0cc7" data-kw="merit obedience under law life the">

<main class="wrap"><figure class="quote" id="q-ef43ff0e01" data-kw="">
<blockquote><p>The promise of the gospel is that whosoever believes in Christ crucified shall not perish, but have eternal life. This promise, together with the command to repent and believe, ought to be declared and published to all nations, and to all persons promiscuously and without distinction, to whom God out of His good pleasure sends the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 2, Art. 5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ce0cb580a" data-kw="new cov">
<blockquote><p>The new covenant is also taken in a twofold manner either broadly, inasmuch as it stands for the covenant of grace in general made with sinners, which existed under the Old Testament as well before Christ appeared as under the New after he had been manifested; or strictly, for the covenant of grace promulgated after the manifestation of Christ in the flesh, which should continue to the end of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.8.5</span></figcaption>

</figure><figure class="quote" id="q-93fca1848a" data-kw="parties">
<blockquote><p>There is not the same signification attached to God’s covenant in the Scriptures. It denotes properly a pact and agreement entered into between God and man, consisting partly in a stipulation of duty (or of the thing to be done) and partly in the promise of a reward (which is the meaning in Gen. 17:2 where God is said to wish to make a covenant with Abraham). At one time it is taken improperly for a simple promise (as the promise not to destroy the world again by a flood is called a covenant, Gen. 9:9). At another time, it is taken metonymically for the symbols and sacraments of a covenant: as circumcision is called a covenant (Gen. 17); the eucharistic “cup” is said to be “the new testament in the blood of Christ” (Lk. 22:20), i.e., a sign and seal of it; then for “the tables of the covenant” laid up in the ark (1 K. 8:21); again for the “covenanted people,” as the people of God are called “the holy covenant” (Dan. 11:28, 30); and for the Messiah, the foundation of that covenant, in whom it is made with us (“I will give thee for a covenant of the people,” Is. 49:8). But we, dismissing the improper significations, attend here to the proper signification, when we dispute concerning the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.1.8</span></figcaption>

</figure><figure class="quote" id="q-6a77a27b91" data-kw="conditions">
<blockquote><p>Third, if the covenant be viewed in relation to the first sanction in Christ, it has no previous condition, but rests upon the grace of God and the merit of Christ alone. But if it is considered in relation to its acceptance and application to the believer, it has faith as a condition (uniting man to Christ and so bringing him into the fellowship of the covenant). If, however, in relation to its consummation with faith (obedience and the desire of holiness), it has the relation of condition and means because without them no one shall see God. Source of explanation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.3</span></figcaption>

</figure><figure class="quote" id="q-3fdffb58ff" data-kw="seals">
<blockquote><p>The particularity of the covenant of grace appears from various considerations. (1) From its destination because there was no universal purpose and will in God to pity the whole human race, but a particular will to select and appoint unto salvation a certain number from the common corrupt mass (as has been proved in full, Volume I, Topic IV, Question 17). Therefore, as no such covenant was decided upon in the counsel of God, so neither was it made in time. 2. From its procurement.</p></blockquote>

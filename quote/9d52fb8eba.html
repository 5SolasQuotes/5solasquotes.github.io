<main class="wrap"><figure class="quote" id="q-9d52fb8eba" data-kw="">
<blockquote><p>Calvin: In the English Liturgy as you [the English exiles at Frankford] do describe unto me, I spy out many tolerabiles ineptias, ‘tolerable unfit things:’ By which two words I express thus much, that there was not that purity which were to be wished, which errors could not immediately the first day be corrected (Cum nulla subesset manifesta impietas ferenda ad tempus fuisse). Seeing there was therein contained no manifest impiety, these things should have been born withal for a time; Epistle 200, fol. 336.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623), ‘Reformed Practices’</cite>, p. 188</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc76ba989f" data-kw="">
<blockquote><p>Zanchi: In things indifferent something is to be yielded to the weaker, and that for a time; namely, until they be taught the truth. For if after that the truth is sufficiently and clearly laide abroad unto them so as being convicted they have nothing more what they may object and yet will notwithstanding stick in doubt; sure their infirmity is not to be nourished by their dissembling with them or winking at them. For this is rather strong obstinacy then weakness; Of Redemption, ch. 17, fol. 493. Beza in a case of [the threat of] deprivation [of one’s office as minister] advises to conform; yet before they conform he thus counsels them: That both the pastor and the flock sin not against their conscience (presupposing the purity of doctrine to be left entire:) We persuade the pastors that after they have freed their conscience, both before the King’s Majesty and the bishops, by a modest (as it becomes Christians to be free from all tumult and sedition) and yet weighty protestation (according as the greatness of the case requires:) they then do openly press unto their flocks those things which do tend to take away the offence arising from conformity, and do withal discreetly and peaceably give diligent endeavor for the amendment of these abuses, as the Lord shall offer occasion (and so to conform); Epistle 12, fol. 99.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’</cite>, p. 196</span></figcaption>

mp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc76ba989f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Zanchi%3A%20In%20things%20indifferent%20something%20is,to%20conform%29%3B%20Epistle%2012%2C%20fol.%2099&amp;text=Zanchi%3A%20In%20things%20indifferent%20something%20is%20to%20be&amp;text=and%20so%20to%20conform%29%3B%20Epistle%2012%2C%20fol.%2099" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-13395f7f0e" data-kw="">
<blockquote><p>Because, where the doctrine itself is sound and pure, and the ceremonies used to a civil honesty and decency, the inconveniences are rather to be passed by in silence than that by occasion of them men should proceed to contentions and more grievous tumults; Calvin, Epistle 303, fol. 497. Because, albeit these things be not to be approved, yet, sometimes these indifferent things, howsoever offensive and burdensome, are to be born withal, so far forth (quoad aliter non liceat) as conveniently we cannot do otherwise, lest if men contend about them more bitterly then they ought, it be both an hindrance to the progress of the Gospel, and the things which in their own nature are indifferent, be taught by our vehement contention to be plainly wicked; which two points do bring with them most grievous inconveniences; P. Martyr to [John] Hooper, Common Places, folio 1086 [p. 117]. And therefore these things which the pastors cannot change, they should rather bear withal, than by forsaking the Church for that cause they should give occasion for far greater and more dangerous mischiefs unto Satan, who seeks nothing else; Beza, Epistle 12, fol. 99. … Because we must give place unto the sway of the times wherein we live, so far forth as may stand with keeping faith and a good conscience, Acts 28:11; 19:10, 26; 15:28-29; Master [William] Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 482-83. Because if we cannot do the good that most we desire, in such exquisite manner as we would, we must content ourselves with the mean, and in things which are good and to be done, it is the safest course to satisfy ourselves in doing the less, lest in venturing to do the more, which cannot be, we grow to the extremity, and so fail or offend in our action, Eccl. 7:16; read the proofs: Perkins, Cases of Conscience, bk. 3, ch. 2, fol. 483-86.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623) | ‘Reformed Practices’</cite>, pp. 163-65</span></figcaption>

</figure><figure class="quote" id="q-7d23be7872" data-kw="">
<blockquote><p>We have no new calves, new altars, new feasts, but profess, and really do hazard life and estate to put away the Prelate’s calves, images, tree-worship, altar-worship, saints, feast-days, idolatry, masses; and nothing is said here but Jesuits, and Canaanites, and Baalites, might say (though falsely) against the reformation of Josiah. Truth and purity of worship this year is new in relation to idolatry last year, but it is simpliciter older.</p></blockquote>

</figure><figure class="quote" id="q-1aa6a1c835" data-kw="">
<blockquote><p>6. Above all, see that you be followers of peace and unity, both in the Church and among your selves. Remember what I taught you on Heb. 12:14, he that is not a son of peace is not a son of God. All other sins destroy the Church consequentially, but division and separation demolish it directly. Building the Church is but an orderly joining of the materials; and what then is disjoining, but pulling down? Many doctrinal differences must be tolerated in a Church: And why? but for unity and peace? Therefore disunion and separation is utterly intolerable. Believe not those to be the Church’s friends that would cure and reform her by cutting her throat. Those that say, ‘No truth must be concealed for peace,’ have usually as little of the one as the other. Study Gal. 2:2; Rom. 14:1, etc. Acts 21:24, 26; 1 Tim 1:4 and 6:4; Tit. 3:8-9. I hope sad experience speaks this lesson to your very hearts, if I should say nothing. Do not your hearts bleed to look upon the state of England? and to think how few towns or cities there be (where is any forwardness in religion) that are not cut into shreds and crumbled as to dust by separations and divisions? To think what a wound we have hereby given to the very Christian name? How we have hardened the ignorant? Confirmed the Papists? And are ourselves become the scorn of our enemies and the grief of our friends? And how many of our dearest, best esteemed friends are fain to notorious pride or impiety? yea, some to be worse then open infidels? These are pillars of salt; see that you remember them. You are yet eminent for your unity, steadfastness, and godliness; hold fast that you have, that no man take your crown from you… If there be erroneous practices in the Church, keep yourselves innocent with moderation and peace: Do your best to reform them and rather remove your dwellings if you cannot live innocently, than rend the Church. It must be no small error that must force a separation… You know I never conformed to the use of mystical, symbolical rites myself (but only to the determination of circumstantials necessary in genere) and yet I ever loved a godly, peaceable Conformist better than a turbulent, non-conformist. I yet differ from many in several doctrines of greater moment than baptism… and yet if I should zealously press my judgment on others, and seek to make a party for it, and disturb the peace of the Church, and separate from my brethren, I should fear lest I should prove a firebrand in Hell for being a firebrand in the Church. And for all the interest I have in your judgments and affections, I here charge you that if God should give me up to any factious Church-rending course (against which I daily pray) that you forsake me and follow me not a step.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>
<div class="actions"><button class="copy" data-copy="“6. Above all, see that you be followers of peace and unity, both in the Church and among your selves. Remember what I taught you on Heb. 12:14, he that is not a son of peace is not a son of God. All other sins destroy the Church consequentially, but division and separation demolish it directly. Building the Church is but an orderly joining of the materials; and what then is disjoining, but pulling down? Many doctrinal differences must be tolerated in a Church: And why? but for unity and peace? Therefore disunion and separation is utterly intolerable. Believe not those to be the Church’s friends that would cure and reform her by cutting her throat. Those that say, ‘No truth must be concealed for peace,’ have usually as little of the one as the other. Study Gal. 2:2; Rom. 14:1, etc. Acts 21:24, 26; 1 Tim 1:4 and 6:4; Tit. 3:8-9. I hope sad experience speaks this lesson to your very hearts, if I should say nothing. Do not your hearts bleed to look upon the state of England? and to think how few towns or cities there be (where is any forwardness in religion) that are not cut into shreds and crumbled as to dust by separations and divisions? To think what a wound we have hereby given to the very Christian name? How we have hardened the ignorant? Confirmed the Papists? And are ourselves become the scorn of our enemies and the grief of our friends? And how many of our dearest, best esteemed friends are fain to notorious pride or impiety? yea, some to be worse then open infidels? These are pillars of salt; see that you remember them. You are yet eminent for your unity, steadfastness, and godliness; hold fast that you have, that no man take your crown from you… If there be erroneous practices in the Church, keep yourselves innocent with moderation and peace: Do your best to reform them and rather remove your dwellings if you cannot live innocently, than rend the Church. It must be no small error that must force a separation… You know I never conformed to the use of mystical, symbolical rites myself (but only to the determination of circumstantials necessary in genere) and yet I ever loved a godly, peaceable Conformist better than a turbulent, non-conformist. I yet differ from many in several doctrines of greater moment than baptism… and yet if I should zealously press my judgment on others, and seek to make a party for it, and disturb the peace of the Church, and separate from my brethren, I should fear lest I should prove a firebrand in Hell for being a firebrand in the Church. And for all the interest I have in your judgments and affections, I here charge you that if God should give me up to any factious Church-rending course (against which I daily pray) that you forsake me and follow me not a step.”

— Richard Baxter, The Saints’ Everlasting Rest (London: White, 1650), ‘To my dearly beloved friends’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+Above+all%2C+see+that+you+be+followers+of+peace+and+unity%2C+both+in+the+Church+and+among+your+selves.+Remember+what+I+taught+you+on+Heb.+12%3A14%2C+he+that+is+not+a+son+of+peace+is+not+a+son+of+God.+All+other+sins+destroy+the+Church+consequentially%2C+but+division+and+separation+demolish+it+directly.+Building+the+Church+is+but+an+orderly+joining+of+the+materials%3B+and+what+then+is+disjoining%2C+but+pulling+down%3F+Many+doctrinal+differences+must+be+tolerated+in+a+Church%3A+And+why%3F+but+for+unity+and+peace%3F+Therefore+disunion+and+separation+is+utterly+intolerable.+Believe+not+those+to+be+the+Church%E2%80%99s+friends+that+would+cure+and+reform+her+by+cutting+her+throat.+Those+that+say%2C+%E2%80%98No+truth+must+be+concealed+for+peace%2C%E2%80%99+have+usually+as+little+of+the+one+as+the+other.+Study+Gal.+2%3A2%3B+Rom.+14%3A1%2C+etc.+Acts+21%3A24%2C+26%3B+1+Tim+1%3A4+and+6%3A4%3B+Tit.+3%3A8-9.+I+hope+sad+experience+speaks+this+lesson+to+your+very+hearts%2C+if+I+should+say+nothing.+Do+not+your+hearts+bleed+to+look+upon+the+state+of+England%3F+and+to+think+how+few+towns+or+cities+there+be+%28where+is+any+forwardness+in+religion%29+that+are+not+cut+into+shreds+and+crumbled+as+to+dust+by+separations+and+divisions%3F+To+think+what+a+wound+we+have+hereby+given+to+the+very+Christian+name%3F+How+we+have+hardened+the+ignorant%3F+Confirmed+the+Papists%3F+And+are+ourselves+become+the+scorn+of+our+enemies+and+the+grief+of+our+friends%3F+And+how+many+of+our+dearest%2C+best+esteemed+friends+are+fain+to+notorious+pride+or+impiety%3F+yea%2C+some+to+be+worse+then+open+infidels%3F+These+are+pillars+of+salt%3B+see+that+you+remember+them.+You+are+yet+eminent+for+your+unity%2C+steadfastness%2C+and+godliness%3B+hold+fast+that+you+have%2C+that+no+man+take+your+crown+from+you%E2%80%A6+If+there+be+erroneous+practices+in+the+Church%2C+keep+yourselves+innocent+with+moderation+and+peace%3A+Do+your+best+to+reform+them+and+rather+remove+your+dwellings+if+you+cannot+live+innocently%2C+than+rend+the+Church.+It+must+be+no+small+error+that+must+force+a+separation%E2%80%A6+You+know+I+never+conformed+to+the+use+of+mystical%2C+symbolical+rites+myself+%28but+only+to+the+determination+of+circumstantials+necessary+in+genere%29+and+yet+I+ever+loved+a+godly%2C+peaceable+Conformist+better+than+a+turbulent%2C+non-conformist.+I+yet+differ+from+many+in+several+doctrines+of+greater+moment+than+baptism%E2%80%A6+and+yet+if+I+should+zealously+press+my+judgment+on+others%2C+and+seek+to+make+a+party+for+it%2C+and+disturb+the+peace+of+the+Church%2C+and+separate+from+my+brethren%2C+I+should+fear+lest+I+should+prove+a+firebrand+in+Hell+for+being+a+firebrand+in+the+Church.+And+for+all+the+interest+I+have+in+your+judgments+and+affections%2C+I+here+charge+you+that+if+God+should+give+me+up+to+any+factious+Church-rending+course+%28against+which+I+daily+pray%29+that+you+forsake+me+and+follow+me+not+a+step.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Saints%E2%80%99+Everlasting+Rest+%28London%3A+White%2C+1650%29%2C+%E2%80%98To+my+dearly+beloved+friends%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1aa6a1c835.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1aa6a1c835.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-reformation/#:~:text=6.%20Above%20all%2C%20see%20that%20you,and%20follow%20me%20not%20a%20step&amp;text=6.%20Above%20all%2C%20see%20that%20you%20be%20followers&amp;text=forsake%20me%20and%20follow%20me%20not%20a%20step" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-f87d7ae16e" data-kw="Permission|Author of sin" data-pol="">
<blockquote><p>As to the pravity or sin that is in actions, as God decreed the futurition of sin, or permitted it to take place, and did not hinder it; so all the sin or vitiosity that is in actions proceeds entirely from the creature, and the evil lusts and passions that are in his heart. Thus a man&#x27;s taking up a stone, and throwing it, is a natural action, which the providence of God enables him to perform; but his throwing it at another man with an intention to kill him, is permitted by God, otherwise it could not take place.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4af681b72" data-kw="Author of sin" data-pol="">
<blockquote><p>The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.</p></blockquote>
<figcaption>— <a href="../authors/john-gill.html">John Gill</a>, <cite>A Body of Doctrinal Divinity</cite>, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../topics/decrees-and-providence/providence.html">Providence &amp; Government</a><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a></div>

</figure><figure class="quote" id="q-dbd64be838" data-kw="Permission|Author of sin|Free Will" data-pol="">
<blockquote><p>In evil actions, however, he so concurs as neither to effect, assist, nor approve of them, but to permit and efficaciously direct; not by infusing wickedness, but by so determining rational creatures physically to the substance of the act in the genus of being, that they (when left to themselves failing from the law) move and determine themselves to bad actions in the genus of morals, performing them freely and voluntarily (hekousiōs). Hence the guilt rests upon them alone.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.6.8</figcaption>
<div class="meta"><a class="tag" href="../topics/decrees-and-providence/concurrence.html">Concurrence</a><a class="tag" href="../topics/decrees-and-providence/permission-and-hardening.html">Permission &amp; Hardening</a><a class="tag" href="../topics/decrees-and-providence/god-and-evil.html">God &amp; Evil</a><a class="tag" href="../topics/fall-and-sin/total-depravity.html">Total Depravity</a><a class="tag" href="../topics/fall-and-sin/bondage-of-the-will.html">Bondage of the Will</a><a class="tag" href="../topics/decrees-and-providence/free-will.html">Free Will &amp; Contingency</a></div>

</figure><figure class="quote" id="q-7df9615162" data-kw="Permission|Author of sin" data-pol="">
<blockquote><p>For two things are to be considered in evil actions: the action itself, and the ἀνομία [anomia, lawlessness] of the action. The action itself, as a natural motion, takes place by the efficacious working of God; but the anomia or wickedness takes place by the active permission of God. … for as in a horse the cause of the motion is one thing and the cause of the limping another, so it is one thing to be the cause of the action and another to be the cause of the wickedness cleaving to it.</p></blockquote>
<figcaption>— <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a>, <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</figcaption>

</figure><figure class="quote" id="q-aee029b880" data-kw="Author of sin|Free Will" data-pol="">
<blockquote><p>He who uses as an instrument a man freely failing, to effect what is good, is not the author of the failure. … The wicked, while they sin, are not properly instruments of God moved, that is to say, without an internal principle of motion, but metaphorically, moved in such a way that they freely move themselves.</p></blockquote>
<figcaption>— <a href="../authors/william-ames.html">William Ames</a>, <cite>Bellarmine Disarmed</cite>, on the Cause of Sin, ch. 2</figcaption>

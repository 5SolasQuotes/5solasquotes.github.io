<blockquote><p>Quest. But why was Christ thus forsaken of his Father? Ans.

1. To satisfy God for our forsaking of him. Christ’s forsaking was satisfactory for all our forsakings of God. Beloved, we all forsook God in Adam, and indeed what do we else in every sin we commit, but forsake the Lord, and turn to the creature? what are all our sins of pleasure, profit, ambition, and the like, but a leaving of the fountain of living waters, to fetch contentment from ‘broken cisterns,’ Jer. ii. 13.

2. But Christ was chiefly forsaken, that he might bring us home again to God, that there might be no more a separation betwixt his blessed Majesty and us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Sufferings for Man’s Sin</cite>, (1634) in The Complete Works of Richard Sibbes, ed. Alexander B. Grosart, Nichol’s Series of Standard Divines. Puritan Period (7 vols, Edinburgh: James Nichol, 1862-64), 1: 357.</span></figcaption>

<blockquote><p>We have seen heretofore, that Eliu intending to rebuke Job, protested that he himself was a mortal man as Job was, to the end he should not complain that he was handled with too high a power. And so he showed that God’s will was to win him by reason and gentleness, according also as he deals towards us. For he bears with us, making his word to be preached to us by men like ourselves, so as we may come the more familiarly to hear things that he tells us, and the doctrine is chewed and put into our mouths. We see then that God pities us, when he appoints men to be the ministers of his word, and to teach us in his name and authority. For he knows our ability, and that as much as we are feeble, we should out of hand be swallowed up by his majesty, and overwhelmed with his glory. And that is the cause why he stoops down to our lowness, instructing us by the means of men.</p></blockquote>

</figure><figure class="quote" id="q-5792d1c4bb" data-kw="">
<blockquote><p>Having cleared the Question, we come to Our Arguments for the Truth; viz. That the presence of wicked men does not defile the Worship of those that are Godly: And that the Godly should not keep back from lawful Commanded Duties, because wicked men have their hands at them.

Arg I. Our First, Argument is taken from the Church of the Jews in Christ’s time; Any who know the History of the Gospel, know that it was a very corrupt Church, in Christ time, in Doctrine and manners; Their Preachers the Scribes and Pharisees were debauched Persons; They perverted the Law, the blind led the blind: And when the Preachers were such, ye may judge what the People were; And yet we find that Christ and his Apostles did join with them in the lawful Worship, For First, Christ himself came yearly up to the Feast at Jerusalem.

Secondly, He is so far from commanding his Apostles, and those who believed in him, to keep back from the Ordinary Worship, because of wicked men among them, That upon the contrary he forbids them to stumble at any thing of that kind; And commands them to come to the lawful Worship: as Matth: 23. 1. 2. Then spake Jesus to the multitude, and to his disciples, Saying, The scribes &amp;c. Which is as if he had said do not keep back from the lawful Worship, because they are but Godless men that go about it; What they Preach according to the word, do that, and for Their wicked life follow them not in it.

Arg: II. Our Second Argument is taken from the Church in the Old Testament: We find, for the most part, many Corrupters and Graceless men that were Members of that Church; Both of the Preachers, and People; And yet we never find that the Godly did loathe the Lawful Worship or keep back from it because of that: Yea we find, The Lord commands them to join in the lawful Worship; And when they would Separate, He reproves them for it. We shall make this appear from Three or Four Times of the Church of the Old Testament.

The First is, Moses’ Time; There was a great mixture of profane men in the Church at that Time; As ye will find Deut: 32. (only remember this all along that the Point we are speaking to, is not to plead for keeping profane men in the Church; We shew those should be removed; But the Question is, when they are keeped in, what the Godly should do in that Case; If they should turn back and leave that Church) I say we find, Deut: 32. the Church at that time, for the most part, was not very sound, They corrupted themselves, Their spots were not the spots of Children; yet we never read that Moses and the Godly did withdraw from the Commanded Worship, because such were at it; yea, on the contrary, we find them joining with them, Deut: 29. Moses enters into a Covenant with them, Preaches to them, Prays for them: Yea Deut: 18. 6. 7. 8. The Lord commands the People to come up to the Public Worship, in the place where he should choose to place his name, and go about the lawful Commanded Duties: Though (doubtless) there would be many wicked men among them.

The Second Time of the Church in the Old Testament, which we take to prove the Point is, in Joshua’s time; there were then great mixtures of wicked men among them; As appears from Joshua 24. 14. 23. He bids them put away the Strange Gods, So there were numbers of them corrupt in the way of Worship, and yet we find in the same Chapter v, 23. That Joshua convenes them altogether to a Solemn piece of Worship, and enters into a Covenant with God, and Preaches to them on that Subject: Now surely Joshua would not have done this, if so be the presence of wicked men did defile the Worship to the Godly: And if it had been a sin in the Godly to stay with the wicked when about Worship.

The Third Time is in Elijah’s time, 1 Kings 18. We find at that time there were some Godly, Seven Thousand that had not bowed their Knee to Baal; We find also an Atheistical Multitude in verse 29. The Body of the People Halting betwixt God and Baal; They would neither say that God was their God, nor that Baal was their God; and yet Elijah called All together to a solemn Worship, a solemn Sacrifice; That is gone about verse 36. And there was Preaching and Praying to that purpose. Now surely, If so be the presence of that Godless Multitude, which Elijah could not get reformed in a hast, had profaned the Worship to the seven thousand Godly, Elijah would never have been accessory to that sin:

A Fourth Time is from Solomon’s time to Hezekiah‘s: There was great Corruption tolerated in the Church then; As Worshipping God in the High-places, as is clear through the whole Tract of the History of that time; And there was much Prophanity of Life in that time; which also appears from the frequent Sermons of the Prophets to that purpose; And yet we never read that the Prophets did separate from the lawful Worship, because of that mixture in the Church: Yea on the contrary we read they did join with them in every Lawful Duty, 2 Chron. 15. Asa gathers all together, and enters into a Covenant with them: Isaias, Jeremiah, and the rest Preaches to them, Prays with them. Now if the presence of Wicked Men had polluted the Service to them, then Isaias his Preaching and Praying, and joining with the People in Worship should have been defiled to Him.

A Fifth Instance is taken from 1 Samuel 2. 16. Eli‘s Sons the Priests were Prophane men: whereupon the Godly began to abhor the Worship; And so it is said in verse 17. Wherefore the sin of the young Men was very great before the Lord, for Men abhorred the Offering of the Lord. And to speak the Truth, It was little wonder they did so: For in verse 22. We find the Priests were so Godless that they did lie with Women that Assembled at the doors of the Tabernacle of the Congregation: Little wonder then that the Godly did loath and withdraw: But does the Lord approve of Their withdrawing, notwithstanding of that reason?

No, We see in verse 24. Where Eli the Prophet speaks to his Sons, says he, Nay my Sons: For it is no good report that I hear; ye make the Lord’s People to transgress: Their abhorring the offering of the Lord because of wicked men that had their hands at it, is called (a transgressing) ye make the Lord’s people to transgress. From all which it is clear. That the presence of wicked men doth not defile the Worship to the Godly, providing they come honestly themselves: And that therefore the wicked’s presence should not keep them away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief refutation of the errors toleration, Erastianism, Independency and separation delivered in some sermons from I Joh. 4. I, preached in the year 1652: to which are added four sermons preached on several occasions</cite>, (Edinburgh: George Mosman, 1692), pp 218-22.</span></figcaption>

The Third Time is in Elijah’s time, 1 Kings 18. We find at that time there were some Godly, Seven Thousand that had not bowed their Knee to Baal; We find also an Atheistical Multitude in verse 29. The Body of the People Halting betwixt God and Baal; They would neither say that God was their God, nor that Baal was their God; and yet Elijah called All together to a solemn Worship, a solemn Sacrifice; That is gone about verse 36. And there was Preaching and Praying to that purpose. Now surely, If so be the presence of that Godless Multitude, which Elijah could not get reformed in a hast, had profaned the Worship to the seven thousand Godly, Elijah would never have been accessory to that sin:

A Fourth Time is from Solomon’s time to Hezekiah‘s: There was great Corruption tolerated in the Church then; As Worshipping God in the High-places, as is clear through the whole Tract of the History of that time; And there was much Prophanity of Life in that time; which also appears from the frequent Sermons of the Prophets to that purpose; And yet we never read that the Prophets did separate from the lawful Worship, because of that mixture in the Church: Yea on the contrary we read they did join with them in every Lawful Duty, 2 Chron. 15. Asa gathers all together, and enters into a Covenant with them: Isaias, Jeremiah, and the rest Preaches to them, Prays with them. Now if the presence of Wicked Men had polluted the Service to them, then Isaias his Preaching and Praying, and joining with the People in Worship should have been defiled to Him.

A Fifth Instance is taken from 1 Samuel 2. 16. Eli‘s Sons the Priests were Prophane men: whereupon the Godly began to abhor the Worship; And so it is said in verse 17. Wherefore the sin of the young Men was very great before the Lord, for Men abhorred the Offering of the Lord. And to speak the Truth, It was little wonder they did so: For in verse 22. We find the Priests were so Godless that they did lie with Women that Assembled at the doors of the Tabernacle of the Congregation: Little wonder then that the Godly did loath and withdraw: But does the Lord approve of Their withdrawing, notwithstanding of that reason?

No, We see in verse 24. Where Eli the Prophet speaks to his Sons, says he, Nay my Sons: For it is no good report that I hear; ye make the Lord’s People to transgress: Their abhorring the offering of the Lord because of wicked men that had their hands at it, is called (a transgressing) ye make the Lord’s people to transgress. From all which it is clear. That the presence of wicked men doth not defile the Worship to the Godly, providing they come honestly themselves: And that therefore the wicked’s presence should not keep them away.”

— James Fergusson, A brief refutation of the errors toleration, Erastianism, Independency and separation delivered in some sermons from I Joh. 4. I, preached in the year 1652: to which are added four sermons preached on several occasions, (Edinburgh: George Mosman, 1692), pp 218-22.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHaving+cleared+the+Question%2C+we+come+to+Our+Arguments+for+the+Truth%3B+viz.+That+the+presence+of+wicked+men+does+not+defile+the+Worship+of+those+that+are+Godly%3A+And+that+the+Godly+should+not+keep+back+from+lawful+Commanded+Duties%2C+because+wicked+men+have+their+hands+at+them.%0A%0AArg+I.+Our+First%2C+Argument+is+taken+from+the+Church+of+the+Jews+in+Christ%E2%80%99s+time%3B+Any+who+know+the+History+of+the+Gospel%2C+know+that+it+was+a+very+corrupt+Church%2C+in+Christ+time%2C+in+Doctrine+and+manners%3B+Their+Preachers+the+Scribes+and+Pharisees+were+debauched+Persons%3B+They+perverted+the+Law%2C+the+blind+led+the+blind%3A+And+when+the+Preachers+were+such%2C+ye+may+judge+what+the+People+were%3B+And+yet+we+find+that+Christ+and+his+Apostles+did+join+with+them+in+the+lawful+Worship%2C+For+First%2C+Christ+himself+came+yearly+up+to+the+Feast+at+Jerusalem.%0A%0ASecondly%2C+He+is+so+far+from+commanding+his+Apostles%2C+and+those+who+believed+in+him%2C+to+keep+back+from+the+Ordinary+Worship%2C+because+of+wicked+men+among+them%2C+That+upon+the+contrary+he+forbids+them+to+stumble+at+any+thing+of+that+kind%3B+And+commands+them+to+come+to+the+lawful+Worship%3A+as+Matth%3A+23.+1.+2.+Then+spake+Jesus+to+the+multitude%2C+and+to+his+disciples%2C+Saying%2C+The+scribes+%26c.+Which+is+as+if+he+had+said+do+not+keep+back+from+the+lawful+Worship%2C+because+they+are+but+Godless+men+that+go+about+it%3B+What+they+Preach+according+to+the+word%2C+do+that%2C+and+for+Their+wicked+life+follow+them+not+in+it.%0A%0AArg%3A+II.+Our+Second+Argument+is+taken+from+the+Church+in+the+Old+Testament%3A+We+find%2C+for+the+most+part%2C+many+Corrupters+and+Graceless+men+that+were+Members+of+that+Church%3B+Both+of+the+Preachers%2C+and+People%3B+And+yet+we+never+find+that+the+Godly+did+loathe+the+Lawful+Worship+or+keep+back+from+it+because+of+that%3A+Yea+we+find%2C+The+Lord+commands+them+to+join+in+the+lawful+Worship%3B+And+when+they+would+Separate%2C+He+reproves+them+for+it.+We+shall+make+this+appear+from+Three+or+Four+Times+of+the+Church+of+the+Old+Testament.%0A%0AThe+First+is%2C+Moses%E2%80%99+Time%3B+There+was+a+great+mixture+of+profane+men+in+the+Church+at+that+Time%3B+As+ye+will+find+Deut%3A+32.+%28only+remember+this+all+along+that+the+Point+we+are+speaking+to%2C+is+not+to+plead+for+keeping+profane+men+in+the+Church%3B+We+shew+those+should+be+removed%3B+But+the+Question+is%2C+when+they+are+keeped+in%2C+what+the+Godly+should+do+in+that+Case%3B+If+they+should+turn+back+and+leave+that+Church%29+I+say+we+find%2C+Deut%3A+32.+the+Church+at+that+time%2C+for+the+most+part%2C+was+not+very+sound%2C+They+corrupted+themselves%2C+Their+spots+were+not+the+spots+of+Children%3B+yet+we+never+read+that+Moses+and+the+Godly+did+withdraw+from+the+Commanded+Worship%2C+because+such+were+at+it%3B+yea%2C+on+the+contrary%2C+we+find+them+joining+with+them%2C+Deut%3A+29.+Moses+enters+into+a+Covenant+with+them%2C+Preaches+to+them%2C+Prays+for+them%3A+Yea+Deut%3A+18.+6.+7.+8.+The+Lord+commands+the+People+to+come+up+to+the+Public+Worship%2C+in+the+place+where+he+should+choose+to+place+his+name%2C+and+go+about+the+lawful+Commanded+Duties%3A+Though+%28doubtless%29+there+would+be+many+wicked+men+among+them.%0A%0AThe+Second+Time+of+the+Church+in+the+Old+Testament%2C+which+we+take+to+prove+the+Point+is%2C+in+Joshua%E2%80%99s+time%3B+there+were+then+great+mixtures+of+wicked+men+among+them%3B+As+appears+from+Joshua+24.+14.+23.+He+bids+them+put+away+the+Strange+Gods%2C+So+there+were+numbers+of+them+corrupt+in+the+way+of+Worship%2C+and+yet+we+find+in+the+same+Chapter+v%2C+23.+That+Joshua+convenes+them+altogether+to+a+Solemn+piece+of+Worship%2C+and+enters+into+a+Covenant+with+God%2C+and+Preaches+to+them+on+that+Subject%3A+Now+surely+Joshua+would+not+have+done+this%2C+if+so+be+the+presence+of+wicked+men+did+defile+the+Worship+to+the+Godly%3A+And+if+it+had+been+a+sin+in+the+Godly+to+stay+with+the+wicked+when+about+Worship.%0A%0AThe+Third+Time+is+in+Elijah%E2%80%99s+time%2C+1+Kings+18.+We+find+at+that+time+there+were+some+Godly%2C+Seven+Thousand+that+had+not+bowed+their+Knee+to+Baal%3B+We+find+also+an+Atheistical+Multitude+in+verse+29.+The+Body+of+the+People+Halting+betwixt+God+and+Baal%3B+They+would+neither+say+that+God+was+their+God%2C+nor+that+Baal+was+their+God%3B+and+yet+Elijah+called+All+together+to+a+solemn+Worship%2C+a+solemn+Sacrifice%3B+That+is+gone+about+verse+36.+And+there+was+Preaching+and+Praying+to+that+purpose.+Now+surely%2C+If+so+be+the+presence+of+that+Godless+Multitude%2C+which+Elijah+could+not+get+reformed+in+a+hast%2C+had+profaned+the+Worship+to+the+seven+thousand+Godly%2C+Elijah+would+never+have+been+accessory+to+that+sin%3A%0A%0AA+Fourth+Time+is+from+Solomon%E2%80%99s+time+to+Hezekiah%E2%80%98s%3A+There+was+great+Corruption+tolerated+in+the+Church+then%3B+As+Worshipping+God+in+the+High-places%2C+as+is+clear+through+the+whole+Tract+of+the+History+of+that+time%3B+And+there+was+much+Prophanity+of+Life+in+that+time%3B+which+also+appears+from+the+frequent+Sermons+of+the+Prophets+to+that+purpose%3B+And+yet+we+never+read+that+the+Prophets+did+separate+from+the+lawful+Worship%2C+because+of+that+mixture+in+the+Church%3A+Yea+on+the+contrary+we+read+they+did+join+with+them+in+every+Lawful+Duty%2C+2+Chron.+15.+Asa+gathers+all+together%2C+and+enters+into+a+Covenant+with+them%3A+Isaias%2C+Jeremiah%2C+and+the+rest+Preaches+to+them%2C+Prays+with+them.+Now+if+the+presence+of+Wicked+Men+had+polluted+the+Service+to+them%2C+then+Isaias+his+Preaching+and+Praying%2C+and+joining+with+the+People+in+Worship+should+have+been+defiled+to+Him.%0A%0AA+Fifth+Instance+is+taken+from+1+Samuel+2.+16.+Eli%E2%80%98s+Sons+the+Priests+were+Prophane+men%3A+whereupon+the+Godly+began+to+abhor+the+Worship%3B+And+so+it+is+said+in+verse+17.+Wherefore+the+sin+of+the+young+Men+was+very+great+before+the+Lord%2C+for+Men+abhorred+the+Offering+of+the+Lord.+And+to+speak+the+Truth%2C+It+was+little+wonder+they+did+so%3A+For+in+verse+22.+We+find+the+Priests+were+so+Godless+that+they+did+lie+with+Women+that+Assembled+at+the+doors+of+the+Tabernacle+of+the+Congregation%3A+Little+wonder+then+that+the+Godly+did+loath+and+withdraw%3A+But+does+the+Lord+approve+of+Their+withdrawing%2C+notwithstanding+of+that+reason%3F%0A%0ANo%2C+We+see+in+verse+24.+Where+Eli+the+Prophet+speaks+to+his+Sons%2C+says+he%2C+Nay+my+Sons%3A+For+it+is+no+good+report+that+I+hear%3B+ye+make+the+Lord%E2%80%99s+People+to+transgress%3A+Their+abhorring+the+offering+of+the+Lord+because+of+wicked+men+that+had+their+hands+at+it%2C+is+called+%28a+transgressing%29+ye+make+the+Lord%E2%80%99s+people+to+transgress.+From+all+which+it+is+clear.+That+the+presence+of+wicked+men+doth+not+defile+the+Worship+to+the+Godly%2C+providing+they+come+honestly+themselves%3A+And+that+therefore+the+wicked%E2%80%99s+presence+should+not+keep+them+away.%E2%80%9D%0A%0A%E2%80%94+James+Fergusson%2C+A+brief+refutation+of+the+errors+toleration%2C+Erastianism%2C+Independency+and+separation+delivered+in+some+sermons+from+I+Joh.+4.+I%2C+preached+in+the+year+1652%3A+to+which+are+added+four+sermons+preached+on+several+occasions%2C+%28Edinburgh%3A+George+Mosman%2C+1692%29%2C+pp+218-22.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5792d1c4bb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5792d1c4bb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/13/james-fergusson-on-the-example-of-christ-and-the-old-testament-saints-against-separatism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

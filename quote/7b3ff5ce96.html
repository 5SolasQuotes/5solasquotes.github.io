<main class="wrap"><figure class="quote" id="q-7b3ff5ce96" data-kw="">
<blockquote><p>… I hope the Reader will … in a particular manner be led and excited to consider and improve his Sabbaths as a Sign and Memorial of the Covenant of Grace, and the blessed Seasons and Means of Sanctification.— So our Fathers, like wise and good Men, began with God in the planting of these Churches: They covenanted with God to be his People and to keep his Sabbaths, and they found Him to be the Lord their Sanctifier. The reverend Observation of the Lord’s-day was their distinguishing honour and glory, and the fruits of holiness to the praise and glory of God abounded among them.—

As the World grows upon us in its numbers and trade, we are growing out of this our primitive purity and beauty; but it is visible that the decay of Sanctity bears proportion to our declension in Sabbath Sanctification. We had need therefore to remember how we have received and heard, and hold fast and repent; let no man take our Crown. I know no one Rule more compendious, comprehensive and effectual for the revival and perpetuity of Religion among us than this, that we keep the LORD’s Sabbaths, as a Sign between Him and us thro’ out our Generations, that HE is the Lord that doth sanctify us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-colman.html">Benjamin Colman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine and law of the Holy Sabbath: in the order wherein it lies through the Scriptures of the Old and New Testament. In two sermons, preached at the lecture in Boston, October 15. and December 10. 1724</cite>, (Boston: Thomas Hancock, 1725), ii-iii.</span></figcaption>

</figure><figure class="quote" id="q-02157fa0df" data-kw="">
<blockquote><p>As in Judaism, the Sabbath was a monumental pillar bearing the record of Israel’s redemption from Egypt, so Christianity engraves upon it the sinner’s redemption from hell, through a Saviour’s resurrection. By a change only in what was positive, and not moral, in the command, its transfer from the seventh to the first day of the week proclaims “this same Jesus hath God raised up, whereof I am witness.” But the Sabbath which commemorates the consummating act, is equally the memorial of that entire redeeming work undertaken by Christ upon the earth.

Thus in the religion of grace, as in the religion of nature, the Sabbath lifts itself like some proud obelisk, all covered with inscriptions of man’s duties to his God, and of God’s rich grace to man. So complete is the identity between the Sabbath and the gospel it attests, as to have extorted the confession, that till the former was destroyed, it was hopeless to overturn the latter; and infidel France was instigated to rob it of its sacred associations, by the substitution of a tenth day of rest and pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-morgan-palmer.html">Benjamin Morgan Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pastoral Letter on the Observance of the Sabbath, to the Churches and Church members within the Synod of South Carolina in Minutes of the Synod of South Carolina, at their Sessions, in Winnsborough, Fairfield District, S.C., Nov. 1851</cite></span></figcaption>

</figure><figure class="quote" id="q-a8850aa228" data-kw="">
<blockquote><p>XXV. But are not “psalms, hymns, and spiritual songs,” mentioned in the New Testament, to be sung?

Yes. We are commanded to sing them. Eph. 5:19. Col. 3:16.

XXVI. Were they not something different from the Book of Psalms?

No. For the Colossians and Ephesians had already the Septuagint. “Moses was read in their synagogues every Sabbath day,” their first Christian assemblies Acts 13:15, and converts were Jews Acts 18:19; 19:1,19. Col. 2:14, and therefore, when they were thus directed, they would easily understand, that the psalmois, humnois and odais pneumatikais were obviously the Mitzmorim Shirim, and Tehillim previously given in the Book of Psalms, by the inspiration of God. Besides, in the Septuagint Psa. 72:20, and by Josephus Antiq. B. VII. chap. 12, the Tephiloth, or prayers of David, are called hymns.

XXVII. Do not these various terms indicate different kinds of hymns, from those found in the Book of Psalms, and authorize the composition of religious poetry as the matter of praise?

No. No more than the terms law, commandment, and statutes, in the 119th Psalm, denote any thing different from the word of God, and authorize, as the revealed will of Heaven, the writings of Josephus, the Koran, or the Book of Mormon.

XXVIII. When commanded to “let the word of Christ dwell in” them “richly,” if his “word” could not be found in the “hymns and spiritual songs” contained in the Book of Psalms, could the Colossians and Ephesians remain upon the earth, until modern hymnologists could supply its supposed defects?

No. Nor yet compose, without divine inspiration, hymns for themselves, of which God would assuredly accept, as the matter of his praise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-blaikie.html">Alexander Blaikie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism of Praise</cite>, (1849; Boston: S. K. Whipple and Co, 1854), pp 12-13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

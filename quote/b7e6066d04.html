<blockquote><p>The Scriptures, with equal explicitness, forbid travel upon the Sabbath-day. “Thy stranger that is within thy gates” is put down by name in the fourth commandment, and is as much required to keep the Sabbath holy as any other person. So in Ex. 23: 12, “the stranger” is required to “rest,” and the reason is given, that he “may be refreshed.”

Many and ingenious, but wicked are the pleas urged by men for disregarding the fourth commandment when on a journey; but they are “refuges of lies,” which will be swept away the moment man appears in the presence of God.

This is a great sin in our nation. Its influence is vastly mischievous. The traveller is seen by many, and sins openly. He requires the services of those who conduct the public conveyances; or, if travelling privately, he at least demands the services of keepers of public or private houses. The whole moral law, including the fourth commandment, was given from Sinai to a whole nation on a journey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law of the Sabbath Still Binding, and What it Forbids in Tracts of American Tract Society. General Series</cite>, vol. VI, no. 187 (New York, n.d.), p. 18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-242a19be2d" data-kw="">
<blockquote><p>Vers. 10. We have an Altar, whereof they have no right to eat, which serve the Tabernacle.

Reas. 6. They that serve the Jewish Tabernacle after Christ’s coming, or they that pertinaciously cleave to Levitical Ceremonies, cannot be partakers of Christ, which is the thing signified to us by the Altar, and Sacrifices, and other Levitical shadows, and is the true body of them all: Therefore the Doctrine of Faith is to be preserved from the leaven of the Jewish Doctors, who thought that the observation of these Ceremonies was to be joined with the Gospel.

To which purpose the same Apostle saith, Gal. 5.2. If you be circumcised, Christ shall profit you nothing, The reason whereof is this, The observers of Legal Ceremonies, or they that receive shadows now abolished, do in the prescribed distinction of meats, observation of Altars, Feasts, Jubilees, Holy water, Priests garments, and the like Ceremonies, really shew forth that the Sun of Righteousness is not yet risen, that Christ is nor yet come, that the Ceremonial Pedagogy is not yet abolished; but that still the time of shadows and signs, which were instituted only to prefigure Christ, until the time of Reformation.

Vers. 11. For the bodies of these beasts, whose blood is brought into the Sanctuary by the High Priest for sin, are burnt without the Camp.

12. Wherefore Jesus also that he might sanctify the people with his own blood, suffered without the gate.

He proves that they are to be excluded from Christ, who seek righteousness, or part of righteousness, in the shadows or works of the Law; because God hath prefigured this in the type of the Expiatory Sacrifice; from Levit. 23.27. The blood of the Expiatory Sacrifice was brought by the High-Priest into the Sanctuary, but the flesh was wholly burnt with fire, neither did any thing thereof come to the Priests, as was given to them from the other Sacrifices. The Apostle affirms that this signified, that none of those who adhere to the Covenant of Works, could eat Christ, but were to be excluded from communion with them, as many as do not firmly adhere to Christ, but seek even the least part of righteousness in the Levitical shadows, or works.

Without the Camp] God signified by this; First, That Christ was to suffer without the gates of Jerusalem, and that is plainly come to pass; for Christ was crucified without the gate. Secondly, That true expiation was to be sought in the blood of the Messias, that suffered without Jerusalem, (or the place consecrated for the Levitical worship) And the Apostle also doth teach, that Christ himself intended this, (having by his providence so disposed of every thing, that he should suffer without the City) viz. that Christ going without the gates to offer up himself, would by that very thing signify, that there was no virtue of Justification or Sanctification to bee sought in any legal Rites, but only in his own blood, all those legal Rites being excluded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 212-13.</span></figcaption>

<blockquote><p>Consecrating of churches is taken two ways:

1. For a mere dedication or civil destination of any thing to its end and use: As when a house is builded, a garment is first put on, when we refresh ourselves with a draught of water, we may pray for a blessing on these [Lk. 9:16], and on all the creatures for our use [1 Tim. 4:4-5]; and the very habitual intention of the builder of an house to dwell in is a civil dedication of it to that use for which it is ordained. Prayer added to it for a blessing of it in the use makes not a consecrated thing; for then my clothes every day put on, my sleep, my daily walking in and out, my physic, my meals, my horse, my ship I sail in, should all be holy, consecrated and religious things, which I were to reverence as religious things; for all these may be blessed in their use. [2.] But here is that [which] we condemn in religious dedication of churches:

1. That the end being sacred, to wit, the habitual worshipping of God in that place.

2. The praying for the church or house of worship, to say nothing of the vain ceremonies used in the dedication of churches: These two are applied to make the church holy and to denominate it the house of God, and capable of religious veneration and salutation [it was the custom of Anglicans to bow to or salute even the architecture or furniture of the church’s building]. Then: [1.] Certainly all the synagogues of Judea should be religiously holy, as was the Temple.

2. And prayers should be more acceptable to God in the synagogue for the house’s sake [as was an Anglican custom for their church buildings], than prayers in any other place.

3. God shall bind Himself by promise to hear prayers in the synagogue, or made with the face toward the synagogue, as He did toward the Temple: we were [then] obliged in the New Testament to pray with our faces toward the churches or meeting places in the New Testament, and we should have one famous and celebrious Church for all Jews and gentiles more holy than all the little holy temples now consecrated as holy places, and where shall this be? And what typical signification shall it have? It must signify Christ to come, or already come; both are unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), pp. 90-91</span></figcaption>

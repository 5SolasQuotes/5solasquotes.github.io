<main class="wrap"><figure class="quote" id="q-5e4d18bd9b" data-kw="">
<blockquote><p>The altars which the patriarchs erected, in the places of their sojourning, were not only expressions of their gratitude, and a means of personal dedication;—they were intended, besides, to engage the household in the work of religion, and to interest them in the promised blessing. The family was called to take part in building them; and the significant names by which they were designated, implied the extension of the benefits connected with them to posterity.

On a memorable occasion, Jacob accosted his household, and said, “Put away the strange gods that are among you and be clean, and change your garments. And let us arise and go up to Bethel, and I will make there an altar unto God, who answered me in the day of my distress, and was with me in the way which I went.” At another time, the same patriarch erected an altar, and called it “El-elohe-Israel”—the Lord—the mighty God of Israel.

These actions, as far as their moral principle is concerned, still invite the imitation of Christian parents. It is not enough to dedicate their children to God in secret, or when they are in unconscious infancy. They must lead them to the altar, renew the solemn act in their presence, and teach them to regard it as their highest interest and honour, to yield themselves to the Lord. It is not sufficient to pray for children—we must pray with them, and show them prayer as an evident means of enjoying all covenant blessings, and as our highest and most valued privilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Commendation of Abraham, or, Parental Duties; and the Blessing Resulting from their Faithful Performance</cite>, (Edinburgh: William Whyte &amp; Co., 1844), pp 53-55.</span></figcaption>

</figure><figure class="quote" id="q-683473dd22" data-kw="">
<blockquote><p>Beloved! the salvation of souls is that which should be first and most in a minister’s eye, and that which should always lie closest and warmest upon a minister’s heart. O sirs! our dear Lord Jesus was infinitely tender of the souls of men.

He left his Father’s bosom for souls he trode the wine-press of his Father’s wrath for souls; he prayed for souls; he paid for souls; he sweated for souls; he bled out his heart’s blood for souls; and he made himself an offering for souls: and oh, what an encouragement should this be to all his faithful messengers to woo for souls, to mourn for souls, to pray for souls, to study for souls, and in preaching to spend and to be spent for the salvation of souls! Ah, friends, there is no work nor wisdom on earth to that of winning souls, Prov, xi. 30, and ‘he that winneth souls is wise.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Crown and Glory of Christianity; or Holiness, the only way to Happiness. Discovered in LVIII Sermons from Heb. 12. 14</cite>, (1662) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 4: 35.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-00cc118a3f" data-kw="">
<blockquote><p>The puritans rested the case against distinctive vestments on the following grounds. First and foremost, the insistence upon a particular vesture was an infringement of Christian liberty; the church which had been freed by Christ form the bondage of the law was now attempting to infringe the crown rights of Christ the Redeemer by introducing new sartorial [relating to dress] burdens on the conscience.¹ This was especially foolish when the Anglicans themselves admitted that such matters were adiaphora, or in the real of indifferent things. ¹ Cf. A Parte of a Register, p. 41: “if it be abolished and Christ be come in stead, then a great injury is done to Christ for many causes. The one is, that those ceremonies which Christ by his passion did abolish, should in contempt of Him and his passion be taken again.</p></blockquote>

</figure><figure class="quote" id="q-da9337af2a" data-kw="">
<blockquote><p>We believe that the ceremonies and figures of the law ceased at the coming of Christ, and that all the shadows are accomplished are accomplished; so that the use of them must be abolished among Christians: yet the truth and substance of them remain with us in Jesus Christ, in whom they have their completion. In the mean time we still use the testimonies taken out of the law and the prophets, to confirm us in the doctrine of the gospel, and to regulate our life in all honesty to the glory of God, according to his will.</p></blockquote>

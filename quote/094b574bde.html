<main class="wrap"><figure class="quote" id="q-094b574bde" data-kw="">
<blockquote><p>…the Fifth Way, at least as developed by later Thomists, does indeed plausibly get us to a divine intelligence. By contrast, Paley’s argument is often acknowledged to get us at best to a designer who is extremely powerful and and intelligent, but who for all we know may yet be finite and, thus non-divine. But it is not just that Paley’ s designer may be something other than God as Aquinas understands Him. There is reason to think that Paley’s designer could not be God as Aquinas understands Him. For Aquinas, when we predicate attributes of God, we necessarily do so analogously rather than univocally. But Paley is evidently predicating attributes to his designer and to us in a univocal way, which (for the Thomist at least) entails a radically deficient conception of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015) | 7. Between Aristotle &amp; William Paley: Aquinas’s Fifth Way 147, p. 83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d456c6d02f" data-kw="">
<blockquote><p>Michael Sudduth examines three prominent objections to natural theology that have emerged in the Reformed streams of the Protestant theological tradition: objections from the immediacy of our knowledge of God, the noetic effects of sin, and the logic of theistic arguments. Distinguishing between the project of natural theology and particular models of natural theology, Sudduth argues that none of the main Reformed objections is successful as an objection to the project of natural theology itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-sudduth.html">Michael Sudduth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Objection to Natural Theology Pre</cite></span></figcaption>

</figure><figure class="quote" id="q-5ce1756f65" data-kw="">
<blockquote><p>Warfield, following the Scottish Reformation, made the case that all humans can use reason to know God. This isn’t a statement about the noetic effects of the fall but a statement about reason. Reason makes God known. Reason is that by which we understand anything at all. It is not simply a first principle because we use reason even to form first principles. Reason is transcendental, meaning it cannot be questioned because it makes questioning possible. We use reason to form beliefs about nature, and we use reason to form beliefs about scripture. Humans are fallen having a darkened mind meaning they have rejected reason and for that they are without excuse. Reason and argument are still there to reveal their condition in unbelief and its consequences. Warfield is speaking of reason as the laws of thought (right reason), Kuyper of man’s reasoning process. Warfield’s definition is more basic. It is the failure to correctly define reason that allowed the challenges of Hume and Kant to the knowledge of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/owen-anderson.html">Owen Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Natural Theology &amp; the Clarity of General Revelation’</cite>, (2022)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-5c737ab3c4" data-kw="">
<blockquote><p>I here consider Francis Turretin’s approach to Natural Theology through an analysis of his response to Five important questions. First of all, what, according to Turretin, Natural Theology is and isn’t (as well as the contents of Natural Theology). Secondly, whether humans (fallen or regenerated) are able to engage in Natural Theology, and how. Thirdly, the relationship between Natural theology and the articles of faith. Fourthly, the uses and limitations of natural theology. Fifthly, the effect of Natural Theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-joseph-white.html">Thomas Joseph White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wisdom in the Face of Modernity: A Study in Thomistic Natural Theology</cite>, (Ave Maria, FL: Sapienta Press, 2009) 340 pp. ToC | ‘Francis Turretin and Natural Theology’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

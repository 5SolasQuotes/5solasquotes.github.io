<blockquote><p>The papists insist upon an implicit faith in the teaching of an infallible church, and deny to men the right of private judgment. Their implicit faith means a faith exercised without evidence or reason, that is to say, an unreasonable faith. The right of private judgment is the right of an individual personal investigation of evidence, the only process by which it is possible to reach a rational conclusion.

So, also, with the revelations of Oxford, and the teachings of Dr. Pusey and the new maniacs generally. They hold that the doctrines of religion are too sacred to be reasoned about until they have been received by faith; that we are to “maintain before we have proved”; that “we must believe in order to judge”; that “this seeming paradox is the secret of happiness.” (Tracts for the Times, No. 85, No. 63, pp. 39, 83; see Edinburgh Review, April, 1843.)

It is not strange that Rome and Oxford should proclaim this open war upon reason, for reason is at open war with them. Holding and teaching doctrines which no man can ever receive until he is prepared to trample upon every source and principle of evidence, until he is actually involved in the curse of idiocy or madness, it is natural for them to slander the image of the Father of lights in the intellectual constitution of man.

The dogmas of transubstantiation and the apostolical succession, when they stand before the bar of reason, or even that humble form of it called common sense, may well tremble in prospect of the verdict, which will be sure to pronounce them guilty of the most stupendous absurdity and consign them to the contempt and infamy they deserve.

The defenders of these dogmas stand really upon the platform of [David] Hume, and are in conspiracy with him to drive all thinking men into the fathomless abyss of universal skepticism. Upon their principles, sense, consciousness, the fundamental laws of human belief, all the witnesses which God has given us of the system to which we belong contradict one another; a vigorous cross-examination has never failed to reveal their want of veracity, and, therefore, their testimony cannot be relied on, and, therefore (for to this tremendous conclusion we come at last), the author of our constitution has so framed it that it must deceive us</p></blockquote>

<blockquote><p>Yea, but to believe the English scriptures, or the Bible translated into English to be the word of God; This is no foundation of Christian Religion.

This is but an old piece of Popery in an Independent dress. The Papists to discredit our Translations, and to keep the people from Reading the Scriptures, and so to keep up the Church’s Authority, are wont to Cavil and say, the English scriptures are no foundation of Christian Religion.

Thus that Jesuit, with whom Doctor White has to do, lays this for his first conclusion (namely) that the scripture alone, especially as translated into the English Tongue, cannot be the rule of Faith: He gives two Reasons for his Assertion. The first is, because these Translations are not infallible, as the Rule of Faith must be; for neither were the Scripture immediately written by the Holy Ghost in our language neither were the Translators assisted by the Spirit infallible, as appears by the often change, and correcting of the Translations, which shews, that some of them were defective. — How can an unlearned man be sure, that this Translation, which now I have, or you have, does not err, unless you admit the Authority of the Church, to assure us, that such and such a Translation doth not err?

For answer hereunto, I lay down these two Conclusions: First, that Divine Truth in English, is as truly the Word of God, as the same Scriptures delivered in the Original, Hebrew or Greek; yet with this difference, that the same is perfectly, immediately, and most absolutely in the Original Hebrew and Greek, in other Translations, as the vessels wherein it is presented to us, and as far forth as they do agree with the Originals: And every Translation agreeing with the Original in the matter, is the same Canonical Scripture that Hebrew or Greek is, even as it is the same Water, which is in the Fountain, and in the Stream; we say this is the Water of such or such a Well, or Spring, because it came from thence; so it is in this business, when the Apostles spake the wonderful works of God in the languages of all Nations (that were at Jerusalem) wherein they were born; the Doctrine was the same to all, of the same Truth and Divine Authority in the several Languages:

And this Doctrine is the Rule we seek for, and the foundation upon which our Religion is grounded, and it is all one thing, whether it be brought to my understanding in Welch, or English, or Greek, or Latin: All Language, or Writing, is but the Vessel, the Symbol, or Declaration of the Rule, not the Rule it self: It is a certain form or means by which the divine Truth cometh unto us, as things are contained in their words, and because the Doctrine and matter of the Texts not made known unto me but by words, and a language which I understand; therefore I say, the Scripture in English is the rule and ground of my Faith; whereupon I relying, have not a human, but a divine Authority for my Faith. Even as an unbeliever coming to our Sermons, is convinced of all, and judged of all, and he will acknowledge the Divine Truth of God, although by a humane voice in preaching, it be conveyed unto him, so we enjoy the infallible Doctrine of the Scripture, though by a man’s Translation it be manifested unto me.

My second conclusion is this; That to believe this to be so (that is) to believe the scripture in English to be the word of God, is a necessary means for grounding of Faith and Religion in the hearts of English people.

The reason is, because the rule of faith must be first both certain, and secondly known. For if it be not certain, it is no rule at all, and if it be not known, it is no rule to us. Wherefore God hath taught us by corporal letters, which we see and read, what he would have us believe concerning him; But to him that heareth not, or that believeth not, Truth and Error, light and darkness is all one. Observe the Apostles reasoning, How shall they call on him, in whom they have not believed? (believing you see is the foundation of that part of Christian Religion, (namely) holy invocation) and how shall they believe in him, of whom they have not heard? if they do not understand the mind of God by hearing, and hearing it as from God, as the word of God and not of Man, it is no more than if they heard a piece of Virgil, or Caesar’s Commentaries; for how can we preach to the convincing of consciences, and settling of their souls in the way of Religion, except they be persuaded, that he that preacheth, speaketh from God?

Lastly, what comfort can there be in that Religion, which we are not persuaded is of God? no Religion is able to bring us unto God, but that which came from God, if I doubt of that, I have no Religion at all.

But how can we believe the Scriptures translated into English, to be of God, seeing Translations are not so infallible, as the rule of faith must be, in many places they do not agree with the Originals?

Let the English Translation of the Bible stand for true, until the Jesuit or the Sectary be able to prove the contrary.

O, but I cannot believe them to be true, because the Translators were not assisted immediately by the holy Ghost.

Such extraordinary assistance is needful to one, that shall indite any part of Scripture, but not to a Translator, for a man by his skill in both Languages, by the ordinary helps of prayer and industry is able to open in the English tongue, what was before locked up in the Original Hebrew, or Greek. As a Spanish or Danish Ambassador, delivers his Message, and receives his answer by an Interpreter. — The interpreter needs not any inspiration, but by his skill in both languages, and his fidelity, he delivers the true mind of one Nation to another: So it is in this case, the Translator is God’s interpreter to a strange people.

Oh! But by the often change and variable Translations, it seems that some have erred.

Ans. … Our English Speech doth vary and change: Books of Law and History, written in Old English three hundred years ago, are hardly understood now, and therefore there will need a new translation of them, yet without any alteration in the matter: so in respect of words, and manner of speech, a Translation may be defective, when as it is not erroneous for the sense.

… We do not say this or that Translation is the Rule and Judge, but the Divine Truth translated; the knowledge whereof is brought to us in the Translation, as the Vessel, wherein the Rule is presented to us, as is abovesaid.</p></blockquote>

My second conclusion is this; That to believe this to be so (that is) to believe the scripture in English to be the word of God, is a necessary means for grounding of Faith and Religion in the hearts of English people.

The reason is, because the rule of faith must be first both certain, and secondly known. For if it be not certain, it is no rule at all, and if it be not known, it is no rule to us. Wherefore God hath taught us by corporal letters, which we see and read, what he would have us believe concerning him; But to him that heareth not, or that believeth not, Truth and Error, light and darkness is all one. Observe the Apostles reasoning, How shall they call on him, in whom they have not believed? (believing you see is the foundation of that part of Christian Religion, (namely) holy invocation) and how shall they believe in him, of whom they have not heard? if they do not understand the mind of God by hearing, and hearing it as from God, as the word of God and not of Man, it is no more than if they heard a piece of Virgil, or Caesar’s Commentaries; for how can we preach to the convincing of consciences, and settling of their souls in the way of Religion, except they be persuaded, that he that preacheth, speaketh from God?

Lastly, what comfort can there be in that Religion, which we are not persuaded is of God? no Religion is able to bring us unto God, but that which came from God, if I doubt of that, I have no Religion at all.

But how can we believe the Scriptures translated into English, to be of God, seeing Translations are not so infallible, as the rule of faith must be, in many places they do not agree with the Originals?

Let the English Translation of the Bible stand for true, until the Jesuit or the Sectary be able to prove the contrary.

O, but I cannot believe them to be true, because the Translators were not assisted immediately by the holy Ghost.

Such extraordinary assistance is needful to one, that shall indite any part of Scripture, but not to a Translator, for a man by his skill in both Languages, by the ordinary helps of prayer and industry is able to open in the English tongue, what was before locked up in the Original Hebrew, or Greek. As a Spanish or Danish Ambassador, delivers his Message, and receives his answer by an Interpreter. — The interpreter needs not any inspiration, but by his skill in both languages, and his fidelity, he delivers the true mind of one Nation to another: So it is in this case, the Translator is God’s interpreter to a strange people.

Oh! But by the often change and variable Translations, it seems that some have erred.

Ans. … Our English Speech doth vary and change: Books of Law and History, written in Old English three hundred years ago, are hardly understood now, and therefore there will need a new translation of them, yet without any alteration in the matter: so in respect of words, and manner of speech, a Translation may be defective, when as it is not erroneous for the sense.

… We do not say this or that Translation is the Rule and Judge, but the Divine Truth translated; the knowledge whereof is brought to us in the Translation, as the Vessel, wherein the Rule is presented to us, as is abovesaid.”

— William Lyford, The plain man’s senses exercised to discern both good and evil, or, A discovery of the errors, heresies, and blasphemies of these times and the toleration of them, as they are collected and testified against by the ministers of London, in their testimony to the truth of Jesus Christ, (London: Richard Royston, 1655), pp 48-51.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYea%2C+but+to+believe+the+English+scriptures%2C+or+the+Bible+translated+into+English+to+be+the+word+of+God%3B+This+is+no+foundation+of+Christian+Religion.%0A%0AThis+is+but+an+old+piece+of+Popery+in+an+Independent+dress.+The+Papists+to+discredit+our+Translations%2C+and+to+keep+the+people+from+Reading+the+Scriptures%2C+and+so+to+keep+up+the+Church%E2%80%99s+Authority%2C+are+wont+to+Cavil+and+say%2C+the+English+scriptures+are+no+foundation+of+Christian+Religion.%0A%0AThus+that+Jesuit%2C+with+whom+Doctor+White+has+to+do%2C+lays+this+for+his+first+conclusion+%28namely%29+that+the+scripture+alone%2C+especially+as+translated+into+the+English+Tongue%2C+cannot+be+the+rule+of+Faith%3A+He+gives+two+Reasons+for+his+Assertion.+The+first+is%2C+because+these+Translations+are+not+infallible%2C+as+the+Rule+of+Faith+must+be%3B+for+neither+were+the+Scripture+immediately+written+by+the+Holy+Ghost+in+our+language+neither+were+the+Translators+assisted+by+the+Spirit+infallible%2C+as+appears+by+the+often+change%2C+and+correcting+of+the+Translations%2C+which+shews%2C+that+some+of+them+were+defective.+%E2%80%94+How+can+an+unlearned+man+be+sure%2C+that+this+Translation%2C+which+now+I+have%2C+or+you+have%2C+does+not+err%2C+unless+you+admit+the+Authority+of+the+Church%2C+to+assure+us%2C+that+such+and+such+a+Translation+doth+not+err%3F%0A%0AFor+answer+hereunto%2C+I+lay+down+these+two+Conclusions%3A+First%2C+that+Divine+Truth+in+English%2C+is+as+truly+the+Word+of+God%2C+as+the+same+Scriptures+delivered+in+the+Original%2C+Hebrew+or+Greek%3B+yet+with+this+difference%2C+that+the+same+is+perfectly%2C+immediately%2C+and+most+absolutely+in+the+Original+Hebrew+and+Greek%2C+in+other+Translations%2C+as+the+vessels+wherein+it+is+presented+to+us%2C+and+as+far+forth+as+they+do+agree+with+the+Originals%3A+And+every+Translation+agreeing+with+the+Original+in+the+matter%2C+is+the+same+Canonical+Scripture+that+Hebrew+or+Greek+is%2C+even+as+it+is+the+same+Water%2C+which+is+in+the+Fountain%2C+and+in+the+Stream%3B+we+say+this+is+the+Water+of+such+or+such+a+Well%2C+or+Spring%2C+because+it+came+from+thence%3B+so+it+is+in+this+business%2C+when+the+Apostles+spake+the+wonderful+works+of+God+in+the+languages+of+all+Nations+%28that+were+at+Jerusalem%29+wherein+they+were+born%3B+the+Doctrine+was+the+same+to+all%2C+of+the+same+Truth+and+Divine+Authority+in+the+several+Languages%3A%0A%0AAnd+this+Doctrine+is+the+Rule+we+seek+for%2C+and+the+foundation+upon+which+our+Religion+is+grounded%2C+and+it+is+all+one+thing%2C+whether+it+be+brought+to+my+understanding+in+Welch%2C+or+English%2C+or+Greek%2C+or+Latin%3A+All+Language%2C+or+Writing%2C+is+but+the+Vessel%2C+the+Symbol%2C+or+Declaration+of+the+Rule%2C+not+the+Rule+it+self%3A+It+is+a+certain+form+or+means+by+which+the+divine+Truth+cometh+unto+us%2C+as+things+are+contained+in+their+words%2C+and+because+the+Doctrine+and+matter+of+the+Texts+not+made+known+unto+me+but+by+words%2C+and+a+language+which+I+understand%3B+therefore+I+say%2C+the+Scripture+in+English+is+the+rule+and+ground+of+my+Faith%3B+whereupon+I+relying%2C+have+not+a+human%2C+but+a+divine+Authority+for+my+Faith.+Even+as+an+unbeliever+coming+to+our+Sermons%2C+is+convinced+of+all%2C+and+judged+of+all%2C+and+he+will+acknowledge+the+Divine+Truth+of+God%2C+although+by+a+humane+voice+in+preaching%2C+it+be+conveyed+unto+him%2C+so+we+enjoy+the+infallible+Doctrine+of+the+Scripture%2C+though+by+a+man%E2%80%99s+Translation+it+be+manifested+unto+me.%0A%0AMy+second+conclusion+is+this%3B+That+to+believe+this+to+be+so+%28that+is%29+to+believe+the+scripture+in+English+to+be+the+word+of+God%2C+is+a+necessary+means+for+grounding+of+Faith+and+Religion+in+the+hearts+of+English+people.%0A%0AThe+reason+is%2C+because+the+rule+of+faith+must+be+first+both+certain%2C+and+secondly+known.+For+if+it+be+not+certain%2C+it+is+no+rule+at+all%2C+and+if+it+be+not+known%2C+it+is+no+rule+to+us.+Wherefore+God+hath+taught+us+by+corporal+letters%2C+which+we+see+and+read%2C+what+he+would+have+us+believe+concerning+him%3B+But+to+him+that+heareth+not%2C+or+that+believeth+not%2C+Truth+and+Error%2C+light+and+darkness+is+all+one.+Observe+the+Apostles+reasoning%2C+How+shall+they+call+on+him%2C+in+whom+they+have+not+believed%3F+%28believing+you+see+is+the+foundation+of+that+part+of+Christian+Religion%2C+%28namely%29+holy+invocation%29+and+how+shall+they+believe+in+him%2C+of+whom+they+have+not+heard%3F+if+they+do+not+understand+the+mind+of+God+by+hearing%2C+and+hearing+it+as+from+God%2C+as+the+word+of+God+and+not+of+Man%2C+it+is+no+more+than+if+they+heard+a+piece+of+Virgil%2C+or+Caesar%E2%80%99s+Commentaries%3B+for+how+can+we+preach+to+the+convincing+of+consciences%2C+and+settling+of+their+souls+in+the+way+of+Religion%2C+except+they+be+persuaded%2C+that+he+that+preacheth%2C+speaketh+from+God%3F%0A%0ALastly%2C+what+comfort+can+there+be+in+that+Religion%2C+which+we+are+not+persuaded+is+of+God%3F+no+Religion+is+able+to+bring+us+unto+God%2C+but+that+which+came+from+God%2C+if+I+doubt+of+that%2C+I+have+no+Religion+at+all.%0A%0ABut+how+can+we+believe+the+Scriptures+translated+into+English%2C+to+be+of+God%2C+seeing+Translations+are+not+so+infallible%2C+as+the+rule+of+faith+must+be%2C+in+many+places+they+do+not+agree+with+the+Originals%3F%0A%0ALet+the+English+Translation+of+the+Bible+stand+for+true%2C+until+the+Jesuit+or+the+Sectary+be+able+to+prove+the+contrary.%0A%0AO%2C+but+I+cannot+believe+them+to+be+true%2C+because+the+Translators+were+not+assisted+immediately+by+the+holy+Ghost.%0A%0ASuch+extraordinary+assistance+is+needful+to+one%2C+that+shall+indite+any+part+of+Scripture%2C+but+not+to+a+Translator%2C+for+a+man+by+his+skill+in+both+Languages%2C+by+the+ordinary+helps+of+prayer+and+industry+is+able+to+open+in+the+English+tongue%2C+what+was+before+locked+up+in+the+Original+Hebrew%2C+or+Greek.+As+a+Spanish+or+Danish+Ambassador%2C+delivers+his+Message%2C+and+receives+his+answer+by+an+Interpreter.+%E2%80%94+The+interpreter+needs+not+any+inspiration%2C+but+by+his+skill+in+both+languages%2C+and+his+fidelity%2C+he+delivers+the+true+mind+of+one+Nation+to+another%3A+So+it+is+in+this+case%2C+the+Translator+is+God%E2%80%99s+interpreter+to+a+strange+people.%0A%0AOh%21+But+by+the+often+change+and+variable+Translations%2C+it+seems+that+some+have+erred.%0A%0AAns.+%E2%80%A6+Our+English+Speech+doth+vary+and+change%3A+Books+of+Law+and+History%2C+written+in+Old+English+three+hundred+years+ago%2C+are+hardly+understood+now%2C+and+therefore+there+will+need+a+new+translation+of+them%2C+yet+without+any+alteration+in+the+matter%3A+so+in+respect+of+words%2C+and+manner+of+speech%2C+a+Translation+may+be+defective%2C+when+as+it+is+not+erroneous+for+the+sense.%0A%0A%E2%80%A6+We+do+not+say+this+or+that+Translation+is+the+Rule+and+Judge%2C+but+the+Divine+Truth+translated%3B+the+knowledge+whereof+is+brought+to+us+in+the+Translation%2C+as+the+Vessel%2C+wherein+the+Rule+is+presented+to+us%2C+as+is+abovesaid.%E2%80%9D%0A%0A%E2%80%94+William+Lyford%2C+The+plain+man%E2%80%99s+senses+exercised+to+discern+both+good+and+evil%2C+or%2C+A+discovery+of+the+errors%2C+heresies%2C+and+blasphemies+of+these+times+and+the+toleration+of+them%2C+as+they+are+collected+and+testified+against+by+the+ministers+of+London%2C+in+their+testimony+to+the+truth+of+Jesus+Christ%2C+%28London%3A+Richard+Royston%2C+1655%29%2C+pp+48-51.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3bbd702989.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3bbd702989.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/02/20/william-lyfo

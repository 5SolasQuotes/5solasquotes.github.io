<main class="wrap"><figure class="quote" id="q-1c14729568" data-kw="">
<blockquote><p>…the kindred which we have at this day is spiritual… Nowadays the whole earth is the dwelling place of the children of God: and although they be dispersed throughout the whole world, yet are they knit in one body by agreeing in one consent of faith to call upon God: and although they do it in diverse tongues, yet it skills not seeing that one self-same Spirit governs them, and that they have all one hope of the everlasting salvation which is promised unto them. Those are the things wherein they are all knit and conjoined together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, … upon… Deuteronomy... (London: Middleton, 1583), 143rd Sermon, pp. 882-83</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8d63176d2" data-kw="">
<blockquote><p>First, the communion of the Church does not consist in a local union, neither the separation, in removing of places: For there are a great many without, if we look to the place, who yet are within according to charity, and many again in place, that yet if we consider faith, are without: but the true Christian communion consists in the union of faith, and in the union of charity, which St. Augustine calls the nearness, or rather the neighborhood and dwelling together (as I may say) of hearts and agreement in doctrine: and the true separation, in the diversity or contrarieties of the self-same things. Now concerning the union of faith, it consists in that heavenly doctrine, which is comprehended unto us in the old and new Testament, tending only to this point, to make us feel our sin, and to show us a remedy therefore, in one only Jesus Christ crucified… We are therefore united in the Faith, with the patriarchs, prophets, apostles, martyrs, ancient doctors, and generally with the whole Church that was before the Law, under the Law, and under grace, yea and under the tyranny of Antichrist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 10, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>

on-of-the-saints/#:~:text=First%2C%20the%20communion%20of%20the%20Church,and%20under%20the%20tyranny%20of%20Antichrist&amp;text=First%2C%20the%20communion%20of%20the%20Church%20does%20not&amp;text=grace%2C%20yea%20and%20under%20the%20tyranny%20of%20Antichrist" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5a64543543" data-kw="">
<blockquote><p>One further element in the doctrine presents itself in the declaration that this communion is to be extended, so far as God gives opportunity, unto ‘all those who in every place call upon the name of the Lord Jesus.’… Whatever may or may not be realized as yet in fact, it still is true in principle that this communion of saints, contemplated as a gracious sentiment, knows no boundaries of creed or polity or worship — knows no geographic or other outward limitations. This is obvious from the nature of the sentiment, and from its source and ground, as seen in the underlying union of every genuine saint with Christ Himself. Having fellowship with Him, deriving their common life from him, engaged alike in his one great vineyard, all saints of necessity have fellowship one with another — a fellowship as wide as the earth and enduring as time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-morris.html">Edward Morris</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology of the Westminster Symbols: A Commentary, Historical, Doctrinal, Practical on the Confession of Faith &amp; Catechisms</cite>, … (1900), Lecture 12, The Church of God, 4. ‘Communion of Saints: its Extent &amp; Nature’, pp. 619-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/communion-of-saints.html">Communion of Saints</a></span></div>
<div class="actions"><button class="copy" data-copy="“One further element in the doctrine presents itself in the declaration that this communion is to be extended, so far as God gives opportunity, unto ‘all those who in every place call upon the name of the Lord Jesus.’… Whatever may or may not be realized as yet in fact, it still is true in principle that this communion of saints, contemplated as a gracious sentiment, knows no boundaries of creed or polity or worship — knows no geographic or other outward limitations. This is obvious from the nature of the sentiment, and from its source and ground, as seen in the underlying union of every genuine saint with Christ Himself. Having fellowship with Him, deriving their common life from him, engaged alike in his one great vineyard, all saints of necessity have fellowship one with another — a fellowship as wide as the earth and enduring as time.”

— Edward Morris, Theology of the Westminster Symbols: A Commentary, Historical, Doctrinal, Practical on the Confession of Faith &amp; Catechisms… (1900), Lecture 12, The Church of God, 4. ‘Communion of Saints: its Extent &amp; Nature’, pp. 619-20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COne+further+element+in+the+doctrine+presents+itself+in+the+declaration+that+this+communion+is+to+be+extended%2C+so+far+as+God+gives+opportunity%2C+unto+%E2%80%98all+those+who+in+every+place+call+upon+the+name+of+the+Lord+Jesus.%E2%80%99%E2%80%A6+Whatever+may+or+may+not+be+realized+as+yet+in+fact%2C+it+still+is+true+in+principle+that+this+communion+of+saints%2C+contemplated+as+a+gracious+sentiment%2C+knows+no+boundaries+of+creed+or+polity+or+worship+%E2%80%94+knows+no+geographic+or+other+outward+limitations.+This+is+obvious+from+the+nature+of+the+sentiment%2C+and+from+its+source+and+ground%2C+as+seen+in+the+underlying+union+of+every+genuine+saint+with+Christ+Himself.+Having+fellowship+with+Him%2C+deriving+their+common+life+from+him%2C+engaged+alike+in+his+one+great+vineyard%2C+all+saints+of+necessity+have+fellowship+one+with+another+%E2%80%94+a+fellowship+as+wide+as+the+earth+and+enduring+as+time.%E2%80%9D%0A%0A%E2%80%94+Edward+Morris%2C+Theology+of+the+Westminster+Symbols%3A+A+Commentary%2C+Historical%2C+Doctrinal%2C+Practical+on+the+Confession+of+Faith+%26+Catechisms%E2%80%A6+%281900%29%2C+Lecture+12%2C+The+Church+of+God%2C+4.+%E2%80%98Communion+of+Saints%3A+its+Extent+%26+Nature%E2%80%99%2C+pp.+619-20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5a64543543.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5a64543543.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-communion-of-the-saints/#:~:text=One%20further%20element%20in%20the%20doctrine,the%20earth%20and%20enduring%20as%20time&amp;text=One%20further%20element%20in%20the%20doctrine%20presents%20itself&amp;text=wide%20as%20the%20earth%20and%20enduring%20as%20time" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f07d136d95" data-kw="">
<blockquote><p>…when the Creed speaks of the ‘Catholic church,’ meaning true saints, that serve God in truth, it speaks not ‘multitude,’ though it mean ‘universal’. But it speaks, that such are scattered up and down the world; here some in one nation, there some in another; here one in one city, there another in another. II. Therefore, ‘communion of saints’ cannot mean personal or local union, or communion: saints in one place, or in one lump, together: not a college of all saints in one place, but a communion betwixt them, as scattered here and there, all the world over. As there is a communion betwixt two friends, one in Turkey, another in England; one in New England, another in Old [England]… How would you understand that, Mt. 24:31, ‘And he shall send his angels with a great sound of a trumpet, and they shall gather together his elect from the four winds, from one end of heaven to the other.’ By the ‘angels,’ he means his messengers the ministers; by the ‘sound of a trumpet,’ he means the gospel; by the whole he means, that, after the destruction of Jerusalem, of which the speech is in the verses before,–God, by the preaching of the Gospel, would fetch in his elect among all nations, or call home the gentiles. But how gather them together? What, into any one place, or country, or city? No, but into such a communion, as we are speaking of, in the several nations or countries, where they lived: one saint in Judea, another in Assyria, another in Greece: all staying in the place where they receive the gospel, and yet all gathered together into one communion.</p></blockquote>

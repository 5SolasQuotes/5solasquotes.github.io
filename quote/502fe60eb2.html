<main class="wrap"><figure class="quote" id="q-502fe60eb2" data-kw="">
<blockquote><p>Now although the human nature may rightly be said to be substantial with the Logos (enypostatos Logo) (because it was assumed into the unity of the person and is sustained by it, yet less accurately is it said to subsist with the subsistence of the Logos (Logou) because then the human nature would be a divine person.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2 | Question 6, section 5, p. 311</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

<blockquote><p>Objection 2: Further, hypostasis is nothing more than a ‘particular substance,’ as Boethius says (De Duab. Nat.). But it is plain that in Christ there is another particular substance beyond the hypostasis of the Word, viz. the body and the soul and the resultant of these. Therefore there is another hypostasis in Him besides the hypostasis of the Word. … Reply to Objection 2: Hypostasis signifies a particular substance, not in every way, but as it is in its complement. Yet as it is in union with something more complete, it is not said to be a hypostasis, as a hand or a foot [is, as joined to a person’s body]. So likewise the human nature in Christ, although it is a particular substance, nevertheless cannot be called a hypostasis or suppositum, seeing that it is in union with a completed thing, viz. the whole Christ, as He is God and man. But the complete being with which it concurs is said to be a hypostasis or suppositum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3</cite>, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 3, ‘Whether the union of the Word Incarnate took place in the suppositum or hypostasis?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

p;text=is%20said%20to%20be%20a%20hypostasis%20or%20suppositum" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-41015c7b52" data-kw="">
<blockquote><p>It is diverse and another thing, not to have beginning, and to subsist by a beginning: to die, and not to be able to suffer: yet, as they are both proper unto Christ, so are they both common, not unto him, but in Him. For if we say, common unto Him: we must needs be urged and driven, to give and show some other, with whom the same should be common unto Him: which necessity of instance, cannot but incline to the impious opinion of Nestorius. We therefore better and more catholically say, it is common in Him and not to Him: and so we say better, it is proper to Him, and not in Him. Therefore it is proper to Him to die, by the nature of his flesh, which is mortal: and it is proper to Him, not to die, by the nature of the Word, which cannot die.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (Cambridge, 1599) | ‘An Appendix to the Eleventh chapter, ‘Of Christ the Redeemer, or of the Person of Christ”, p. 354</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-1fcffc4847" data-kw="">

</figure><figure class="quote" id="q-10f0cad08d" data-kw="">
<blockquote><p>The fifth and last, is of the branch and tree into which it is engraffed; as suppose a vine-branch and an olive-tree: now as this olive-tree is but one, but has two different natures in it, and so it beareth two kinds of fruit: and yet between the tree and the branch there is a composition, not hujus ex his, but hujus ad hoc (i.e.) not of a third thing out of the two things united, but of one of the two things united or adjoyned to the other: Even so Christ is one, but He has two different natures, and in them He performs the different actions pertaining to either of them: and yet between the different natures (the divine and human nature) there is a composition, not hujus ex his but hujus ad hoc, not of a third nature arising out of these, but of the humane nature added or united to the divine, in unity of the same person: so that now we may say, as this vine is an olive-tree, and this olive-tree is a vine: or as this vine bears olives, and this olive-tree bears grapes, so the Son of man is the Son of God, and the Son of God is the Son of Man: or this Son of Man laid the foundation of the earth, and this Son of God was born of Mary, and crucified by the Jews. This similitude (I take it) is the aptest and fullest of all the other, though in some things also it does fail; for the branch has first a separate subsistence in itself, and losing it after, then it is drawn into the unity of the subsistence of that tree into which it is implanted; but it is otherwise with the human nature of Christ; it never had any subsistence of its own, until it was united to the person or subsistence of the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Looking unto Jesus: a View of the Everlasting Gospel</cite>, ... (London, 1680), bk. 4, ch. 1, section 5, p. 129</span></figcaption>

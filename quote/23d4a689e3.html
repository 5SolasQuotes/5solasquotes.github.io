<main class="wrap"><figure class="quote" id="q-23d4a689e3" data-kw="">
<blockquote><p>I grant and confess, that faith is God’s gift in the heart of man, which God alone doth search and know. But men are judged by their words and deeds. Admit, therefore, that the erroneous opinion of the mind may not be punished; yet notwithstanding, wicked and infective profession and doctrine must in no wise be suffered. Verily, no man doth in this world punish profane and wicked thoughts of the mind: but if those thoughts break forth into blasphemous words, then are those blaspheming tongues to be punished of good princes.

And yet by this I say not, that godliness lieth in the magistrate to give and bestow. Justice is the very gift of God, which none but God doth give to men: but who is so foolish as to gather thereupon, that unjust men, robbers, murderers, and witches are not to be punished, because the magistrate by punishment cannot bestow righteousness upon unrighteous people?

We must therefore make a difference betwixt faith, as it is the gift of God in the heart of man, and as it is the outward profession uttered and declared before the face of men. For while false faith doth lurk and lie hid within the heart, and infecteth none but the unbeliever, so long the unbelieving infidel cannot be punished: but if this false and forged faith, that so lay hid, do once break forth to blaspheme, to the open tearing of God and the infecting of his neighbours, then must that blasphemer be by and by plucked under, and kept from creeping to further annoyance. Not to suppress such a fellow as this, is to put a sword in a madman’s hand to kill unwise and weakly men.

Faith is the gift of God; but, where he bestoweth faith, he useth means to give it by: those means he will not have us to neglect. An householder knoweth that faith is the gift of God; and yet notwithstanding, he instructeth his children in the word of truth, he chargeth them to go to church, to pray for faith, and to learn it at the preacher’s mouth. A good father would think much, yea, he would not think well of it, if his son should say: Father, I pray you, teach me not, send me not so much to church, and beat me not if I be not there; for faith is the gift of God, which whipping cannot bring me to. Then what man can quietly abide to hear that faith is the gift of God, and that therefore no man ought for faith, that is, for the corruption of faith and open blasphemy, to suffer any punishment?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids MI: Reformation Heritage Books, 2004), 1: 363-64.</span></figcaption>

<blockquote><p>Although women are ashamed to acknowledge this, Scriptures and experience teach us that there is only one in several thousands to whom God gives the gift to live chastely in a state of virginity. A woman does not have complete mastery over herself. God so created her body that she should be with a man and bear and raise children. The words of Gen., ch. i, clearly state this, and the members of her body sufficiently show that God himself formed her for this purpose.

Just as eating, drinking, waking, and sleeping are appointed by God to be natural, so God also wills that it be natural for a man and a woman to live together in matrimony. This is enough, therefore, and no woman need be ashamed of that for which God has created and fashioned her, and if she feels that she does not possess that high and rare gift, she may leave the convent and do that for which she is adapted by nature.</p></blockquote>

</figure><figure class="quote" id="q-e1d97dcd68" data-kw="">
<blockquote><p>There is therefore need that both our hands should be employed in doing good. Now the two hands of a Christian Kingdom are the Magistracy and Ministry thereof. The business of Reformation calls for both. As we commonly use our hands for the washing and cleansing of each other. So if the Minister be extravagant, the Magistrate may correct him; then the right hand washeth the left: If the Magistrate do amiss, the Minister may admonish him, then the left hand clenseth the right.

But he that makes use of one hand to cut off the other with, destroys his body: such would our condition be, if either Ministers should suffer the Magistracy to be cried down; or Magistrates permit the Ministry to be debased. Scripture and experience bid us hope, that Amalek shall then be foiled, and Israel prevail, when faith in Christ, and zeal for truth shall support both these hands, as Aaron and Hur did those of Moses upon the mount.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-arrowsmith.html">John Arrowsmith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A great wonder in heaven, or, A lively picture of the militant church drawn by a divine pencil: Revel. 12, 1, 2: discoursed on in a sermon preached before the honourable House of Commons, at Margaret’s, Westminster, on the last monthly fast-day, January 27, 1646/7</cite>, (London: Samuel Man, 1647), p. 43.</span></figcaption>

<blockquote><p>5. If there be nothing taken from the parents of which the soul is formed, then it is not traduced by natural generation: but there is nothing taken from the parents by which the soul is formed; for [otherwise] then in all abortions and miscarrying conceptions the seed of the soul would perish, and by consequence the soul itself would be corruptible, as having its original from corruptible seed. These and diverse other the like arguments are used to confirm the doctrine touching the creation of the reasonabl soul.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3f8c2f0925" data-kw="">
<blockquote><p>…ye [Separatists] are full Donatists [Eary Church heretics]… you do agree with them in the sum and substance of all the fowlest things…: …

16. That ye deny baptism to the children of open sinners which yet remain in the Church…

17. That ye make the stableness of God’s Covenant towards his Church to depend upon the works of men…

18. That ye hold circumcision among the Ten Tribes, or in Judah in time of idolatry, was no true seal of the Covenant, and yet ye say that concerning the outward cutting it was true circumcision: the like ye say of baptism administered in Popery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gifford.html">George Gifford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Reply unto the Last Printed Books of Henry Barrow &amp; John Greenwood, the Chief Ringleaders of our Donatists in England</cite>, … (London, 1591), p. 97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andre-rivet.html">André Rivet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Article 21, ed. Augusti, p. 99 &amp; ed. Niemeyer, pp. 112, 120, as quoted in Krauth, p. 29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-ab2d9d02b6" data-kw="">
<blockquote><p>…use the best skill you have to instruct your children and servants, yet this is no reason to withdraw them from public instructions: nor can any man, who understands his religion, think he discharges his duty to God and the Church, merely by his private instruction of his family, when he neglects, or refuses to bring them to public instructions. 3. For he must consider, that his children and servants, who are baptized, are members of the Christian Church, and therefore ought to be subject to the instructions and discipline of it, as far as their age and capacity will permit. They do not only belong to his private care, but to the public care of the Church, who is to provide for the instruction of her children; and to deny the Church liberty to instruct her children, or not to interpose their own authority to make them submit to it, is to withdraw their children from the communion of the Church, after a solemn dedication of them to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-sherlock.html">William Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Discourse of Religious Assemblies</cite>, … (London, 1681), pt. 2, ch. 5, pp. 303-4 Sherlock was an Anglican.</span></figcaption>

</figure><figure class="quote" id="q-c42abdb17f" data-kw="">
<blockquote><p>‘It comes sometime to pass’ (says St. Augustine) ‘that the children of bond-slaves are brought to baptism by their Lord; sometime the parents being dead, the friends alive undertake that office, sometime stangers or virgins consecrated unto God, which neither have, nor can have children of their own, take up infants in the open streets, and so offer them unto baptism, whom the cruelty of unnatural parents casts out, and leaves to the adventure of uncertain pity.’ As therefore he which did the part of a neighbor, was a neighbor to that wounded man whom the parable of the Gospel describes, so they are fathers, although strangers, that bring infants to him which makes them the sons of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Mr. Richard Hooker</cite>, (that learned and judicious divine), in Eight Books of Ecclesiastical Polity… (London, 1666), bk.5, section 64, p. 244 Hooker (1554–1600) was a prominent Anglican apologist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-9e6ca3df15" data-kw="">
<blockquote><p>From all this it follows clearly, that the children of Christian parents are Church-members; and, being Church-members, they have a right to Baptism, which is appointed by Christ to be the standing ordinance for solemn admission into the visible Church. So that, when they are in our Catechism said to be made members of Christ in their Baptism, the meaning only is, that now they are owned and publicly acknowledged to be such, by their solemn admission into the society of Christians. They are Christians nati; born Christians, by the covenant; Christianity is their birthright, and their native privilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Infants are members of the Church of Christ</cite>, pp. 303-304 in The Doctrine of the Two Sacraments in Works, vol. 2 ed. Quick (Philadelphia, 1874)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

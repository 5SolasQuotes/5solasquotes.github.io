<main class="wrap"><figure class="quote" id="q-ac9da9c161" data-kw="">
<blockquote><p>We all, in the virtue of that covenant made by God unto the faithful, and to their seed in the first instant of our being, do belong unto Christ that bought us; after, in the laver of regeneration, the sacrament of baptism, we are farther admitted and united to him.

Our right unto Christ before was general, from the benefit of the common covenant; but, in this sacrament of baptism, my right is made personal; and I now lay claim unto Christ, not only in the right of his common promise, but by the efficacy of this particular washing, which sealeth and ratifieth the covenant unto me.

Thus is our first union unto Christ wrought by the grace of the covenant effectively, – and by the grace of baptism (where it may be had) instrumentally; the one giving unto Christ, the other obsignating and exhibiting, that right, by a farther admission of us into his body.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 75-76.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-335407d66a" data-kw="">
<blockquote><p>You therefore are changed from that sect by which you are separated, although the sacraments which you have are holy, since they are the same in all. That is why we wish you to be won away from your false position, so that your cut-off branches may be again rooted. The sacraments, which you have not changed, are approved by us as you have them; so, when we wish to correct your aberration, we must guard against doing a sacrilegious wrong to those mysteries of Christ which have not been vitiated by your vice. For, Saul did not vitiate the anointing which he had received, when King David, the devout servant of God, did such honour to it.

We do not rebaptize you when we wish to restore you to the root, because we approve the form of the lopped-off branch, if it is not changed, which, however, even when intact, is anything but fruitful without a root. It is one question about the persecutions which you say you suffered even under our mildness and tolerance, when your adherents individually committed such gravely unlawful acts, but baptism is another question, since we do not look to see where it is, but where it is validly. Wherever it is, it is itself, but the one who receives it is not himself wherever he is.

Therefore, in schism, we detest the individual wickedness of men, but we honour the baptism of Christ everywhere; so, for example, if deserters from an army carry off with them the standards of their commander, if the standards have remained safe they are recovered whether the deserters have been condemned to punishment or won back by clemency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 87 to Emeritus, c. 405 in Letters: Volume II</cite></span></figcaption>

</figure><figure class="quote" id="q-8569f39913" data-kw="">
<blockquote><p>2.1 As far as concerns the case of infants, you expressed your view that they ought not to be baptised within the second or third day of their birth; rather, the ancient law on circumcision ought to be respected and you therefore concluded that the newly-born should not be baptised and sanctified before the eighth day. Our Council adopted an entirely different conclusion. No one agreed with your opinion on the matter; instead, without exception we all formed the judgment that it is not right to deny the mercy and grace of God to any man that is born. 2.2 But seeing that the Lord says in His own Gospel: The Son of man has come not to destroy the souls of men but to save them, we must do everything we possibly can to prevent the destruction of any soul. We need to ask, what can be lacking to one who has been already formed by the hands of God in his mother’s womb? To our way of thinking, indeed, and to our eyes infants after their birth appear to grow and increase as the earthly days go by; but as far as God their Maker is concerned, whatever has been made by Him is perfect and complete thanks to His handiwork and almighty power. 6.1 And so, dearest brother, our verdict at the Council was this: we ought not to be the cause for debarring anyone from access to baptism and the grace of God, for He is merciful, kind, and loving towards all men. 6.2 And whilst this is a rule which ought to be observed and maintained concerning the whole of mankind, it is our view that it should be observed most particularly in the very case of newborn infants; they have all the more claim upon our assistance and God’s mercy for the reason that, right from the very first moment they are born, in their crying and wailing they are doing nothing else but imploring for our help</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cyprian-of-carthage.html">Cyprian of Carthage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Letters of St. Cyprian of Carthage, Letters 55–66</cite>, ed. Johannes Quasten, Walter J. Burghardt, and Thomas Comerford Lawler, trans. G. W. Clarke, vol. III, Ancient Christian Writers (New York; Mahwah, NJ: Newman Press, 1986), 110, 112.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-9372f182a4" data-kw="">
<blockquote><p>By what reasons are they [Anabaptists] confuted? (1) Because, to covenanted ones (of which number the infants of believers are no less than their parents; Acts 2:38-39; Acts 3:25; Rom. 11:16; Gen. 17:7,22) that seal of the covenant, of which they are capable, is not to be denied; Gen. 17:7,10-11. … (8) Because, the Apostle says that the infants but of one believing parent are holy, 1 Cor. 7:14, that is, are comprehended in the outward Covenant of God, and have access to the signs, and seals of God’s grace as well as they are that are born of both believing parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error</cite>, (Edinburgh, 1684), ch. 28, ‘Of Baptism’, Question 3, pp. 179-180</span></figcaption>

<blockquote><p>They went down into the water. Here we see the rite used among the men of old time in baptism; for they put all the body into the water. Now the use is this, that the minister doth only sprinkle the body or the head. But we ought not to stand so much about such a small difference of a ceremony, that we should therefore divide the Church, or trouble the same with brawls. We ought rather to fight even an hundred times to death for the ceremony itself of baptism, inasmuch as it was delivered us by Christ that we should suffer the same to be taken from us.

But forasmuch as we have as well a testimony of our washing, as of newness of life, in the figure of water; forasmuch as Christ representeth unto us his blood in the water as in a glass, that we may get our cleanness thence; forasmuch as he teacheth that we are fashioned again by his Spirit, that being dead to sin, we may live to righteousness; it is certain that we want nothing which maketh to the substance of baptism.

Wherefore the Church did grant liberty to herself, since the beginning, to change the rites somewhat, excepting this substance. For some dipped them thrice, some but once. Wherefore there is no case why we should be so straitlaced in matters which are of no such weight; so that external pomp do no whit pollute the simple institution of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Acts of the Apostles</cite>, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 364-65.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“They went down into the water. Here we see the rite used among the men of old time in baptism; for they put all the body into the water. Now the use is this, that the minister doth only sprinkle the body or the head. But we ought not to stand so much about such a small difference of a ceremony, that we should therefore divide the Church, or trouble the same with brawls. We ought rather to fight even an hundred times to death for the ceremony itself of baptism, inasmuch as it was delivered us by Christ that we should suffer the same to be taken from us.

But forasmuch as we have as well a testimony of our washing, as of newness of life, in the figure of water; forasmuch as Christ representeth unto us his blood in the water as in a glass, that we may get our cleanness thence; forasmuch as he teacheth that we are fashioned again by his Spirit, that being dead to sin, we may live to righteousness; it is certain that we want nothing which maketh to the substance of baptism.

Wherefore the Church did grant liberty to herself, since the beginning, to change the rites somewhat, excepting this substance. For some dipped them thrice, some but once. Wherefore there is no case why we should be so straitlaced in matters which are of no such weight; so that external pomp do no whit pollute the simple institution of Christ.”

— John Calvin, Commentary on the Acts of the Apostles, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 18a: 364-65.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+went+down+into+the+water.+Here+we+see+the+rite+used+among+the+men+of+old+time+in+baptism%3B+for+they+put+all+the+body+into+the+water.+Now+the+use+is+this%2C+that+the+minister+doth+only+sprinkle+the+body+or+the+head.+But+we+ought+not+to+stand+so+much+about+such+a+small+difference+of+a+ceremony%2C+that+we+should+therefore+divide+the+Church%2C+or+trouble+the+same+with+brawls.+We+ought+rather+to+fight+even+an+hundred+times+to+death+for+the+ceremony+itself+of+baptism%2C+inasmuch+as+it+was+delivered+us+by+Christ+that+we+should+suffer+the+same+to+be+taken+from+us.%0A%0ABut+forasmuch+as+we+have+as+well+a+testimony+of+our+washing%2C+as+of+newness+of+life%2C+in+the+figure+of+water%3B+forasmuch+as+Christ+representeth+unto+us+his+blood+in+the+water+as+in+a+glass%2C+that+we+may+get+our+cleanness+thence%3B+forasmuch+as+he+teacheth+that+we+are+fashioned+again+by+his+Spirit%2C+that+being+dead+to+sin%2C+we+may+live+to+righteousness%3B+it+is+certain+that+we+want+nothing+which+maketh+to+the+substance+of+baptism.%0A%0AWherefore+the+Church+did+grant+liberty+to+herself%2C+since+the+beginning%2C+to+change+the+rites+somewhat%2C+excepting+this+substance.+For+some+dipped+them+thrice%2C+some+but+once.+Wherefore+there+is+no+case+why+we+should+be+so+straitlaced+in+matters+which+are+of+no+such+weight%3B+so+that+external+pomp+do+no+whit+pollute+the+simple+institution+of+Christ.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Acts+of+the+Apostles%2C+ed.+Henry+Beveridge%2C+trans.+Christopher+Fetherstone+%281560%3B+London%2C+1585%29+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%3A+Baker%2C+1993%29%2C+18a%3A+364-65.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc0133e5e55.html&amp;via=5So

</figure><figure class="quote" id="q-9977fa1737" data-kw="">
<blockquote><p>They [the three friends of Daniel] expressly refuse knee-bowing [to the idol], and the reason is, because if ye bow your knee religiously to a stock, it is not in your power or free choice to stay the flux and motion of religious honor off, or from, the stock; but because religious bowing does not convey honor to the thing before which ye bow by your free will, but by God and nature’s institution, even as weeping naturally expresses sorrow, laughing, gladnesse, so does religious bowing signify religious honoring, without any act of the free choice of the worshipped intervening. It is impossible to adore God in and through an image, and give no religious reverence to the image at all; as it is impossible to hear the Word and tremble at it, and yet none of that religious trembling be bounded and terminated upon the Word, as it is impossible to kneel to the king’s ambassador conveying all and whole that civil honor to the king, but some honor must redound to the ambassador; a father cannot love the doctor for his son’s cause, but some love he must confer really upon the doctor, if not absolute, yet relative, for his son’s cause. Jacob could not kiss Joseph his son’s coat, and yet refer that whole expressed affection to Joseph and nothing at all to the coat, for then should there be no reason why he should kiss the coat rather than the skin of the beast supposed to be the devourer of his son; If therefore the communicant should kiss the sacramental bread as he bows religiously before it, as the object of his sacramental worship, which he receives, I hope it would be thought very like the kissing of the calves of Samaria, and a religious expression of love to the bread; and by the same case, religious bowing to God, by the intervening of bread, a representative object, must be an expression of religious honoring of bread, but no religious honoring by religious bowing can be expressed, but [it is] adoration of bread…</p></blockquote>

</figure><figure class="quote" id="q-f0574d4095" data-kw="">
<blockquote><p>…2 Chron. 29 [vv. 29-30], out of which no more can be drawn but that the people worshipped while the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 72</span></figcaption>

<blockquote><p>…we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship as are common and inseparable concomitants of both civil, natural and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof, such as I take to be the seven individuall proprieties of every man: forma, figura, locus, tempus, strips, patria, nomen. Under form and figure, the first two, I comprehend such a proportion of body, a man of a high stature or low, a man beautiful or not beautiful, to which I crave leave to reduce all external forms of habits, as clothes, the head covered or not covered, the situation of the body, as as they are in themselves, mere physical acts, kneeling, sitting, standing, the eyes cast down to the earth or lifted up, the hands lifted up, or not lifted up, the knocking on the breast, or not knocking, motions of the soul, that are natural… 1. All these are common concomitants of civil, natural and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep, or civil, to declaim an oration before the people, or religious, to preach or pray, must be done by some persons, John or Thomas, men of some family, in some time, in some place, for they are not actions eternal, and so must be done in time and place, so the agents must have some habit [garment], some gesture in the doing of all these actions, and they are unseparable adjuncts of all these actions because neither actions natural, civil, nor religious can be performed but by some persons in some habit and gesture, in some time, in some place: and lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common and inseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse, because Thomas prays in gown or cloak, in this place, rather than that place… the praying is neither the more or the less acceptable to God because of these common and unseparable adjuncts. … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say ‘in all morals’ because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not appoint such things, but supposes them]: The Scripture says not that the Worship of God must have a time, a place, when, and where it’s to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be, because nature teaches that without time, place, person, habit, gesture, it’s impossible that these or any human actions can be; and therefore Prelatical Formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Introduction, pp. 2-5</span></figcaption>

d inseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse, because Thomas prays in gown or cloak, in this place, rather than that place… the praying is neither the more or the less acceptable to God because of these common and unseparable adjuncts. … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say ‘in all morals’ because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not appoint such things, but supposes them]: The Scripture says not that the Worship of God must have a time, a place, when, and where it’s to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be, because nature teaches that without time, place, person, habit, gesture, it’s impossible that these or any human actions can be; and therefore Prelatical Formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all…”

— Samuel Rutherford, The Divine Right of Church Government… (1646), Introduction, pp. 2-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6we+consider+things+circumstantial%2C+as+time%2C+place%2C+etc.+And+circumstances+are+either+merely+physical%2C+or+2.+merely+moral%2C+or+3.+mixed%2C+partly+moral%2C+partly+physical.+Circumstances+merely+physical+are+such+adjuncts+of+divine+worship+as+are+common+and+inseparable+concomitants+of+both+civil%2C+natural+and+religious+or+sacred+actions+performed+by+men%2C+and+as+they+are+such%2C+contribute+no+moral+goodness+or+badness+to+the+action+or+agent+in+the+performance+thereof%2C+such+as+I+take+to+be+the+seven+individuall+proprieties+of+every+man%3A+forma%2C+figura%2C+locus%2C+tempus%2C+strips%2C+patria%2C+nomen.+Under+form+and+figure%2C+the+first+two%2C+I+comprehend+such+a+proportion+of+body%2C+a+man+of+a+high+stature+or+low%2C+a+man+beautiful+or+not+beautiful%2C+to+which+I+crave+leave+to+reduce+all+external+forms+of+habits%2C+as+clothes%2C+the+head+covered+or+not+covered%2C+the+situation+of+the+body%2C+as+as+they+are+in+themselves%2C+mere+physical+acts%2C+kneeling%2C+sitting%2C+standing%2C+the+eyes+cast+down+to+the+earth+or+lifted+up%2C+the+hands+lifted+up%2C+or+not+lifted+up%2C+the+knocking+on+the+breast%2C+or+not+knocking%2C+motions+of+the+soul%2C+that+are+natural%E2%80%A6+1.+All+these+are+common+concomitants+of+civil%2C+natural+and+religious+actions%2C+for+all+actions+performed+by+man+of+what+kind+soever%2C+as+natural%2C+to+eat%2C+sleep%2C+or+civil%2C+to+declaim+an+oration+before+the+people%2C+or+religious%2C+to+preach+or+pray%2C+must+be+done+by+some+persons%2C+John+or+Thomas%2C+men+of+some+family%2C+in+some+time%2C+in+some+place%2C+for+they+are+not+actions+eternal%2C+and+so+must+be+done+in+time+and+place%2C+so+the+agents+must+have+some+habit+%5Bgarment%5D%2C+some+gesture+in+the+doing+of+all+these+actions%2C+and+they+are+unseparable+adjuncts+of+all+these+actions+because+neither+actions+natural%2C+civil%2C+nor+religious+can+be+performed+but+by+some+persons+in+some+habit+and+gesture%2C+in+some+time%2C+in+some+place%3A+and+lastly%2C+they+are+mere+circumstantials%2C+and+contribute+no+moral+goodness+or+badness+to+the+actions%2C+as+they+are+but+common+and+inseparable+circumstances%3B+for+because+he+preaches+in+time%2C+or+in+place+simply%2C+the+preaching+is+neither+morally+good%2C+nor+ill%2C+better+or+worse%2C+because+Thomas+prays+in+gown+or+cloak%2C+in+this+place%2C+rather+than+that+place%E2%80%A6+the+praying+is+neither+the+more+or+the+less+acceptable+to+God+because+of+these+common+and+unseparable+adjuncts.+%E2%80%A6+I+did+say+that+Christ+Jesus+has+set+down+in+the+Word+a+perfect+platform+of+Church-government+in+all+morals%3B+I+say+%E2%80%98in+all+morals%E2%80%99+because+the+Word+does+not+teach+us+anything+of+circumstances%2C+physical+as+physical.+Scriptura+talia+non+ponit%2C+sed+supponit+%5BScripture+does+not+appoint+such+things%2C+but+supposes+them%5D%3A+The+Scripture+says+not+that+the+Worship+of+God+must+have+a+time%2C+a+place%2C+when%2C+and+where+it%E2%80%99s+to+be+performed%2C+a+person%2C+who+is+to+perform+it%2C+a+habit%2C+or+garments+on+the+person+that+worships%3B+the+Scripture+teaches+none+of+these%2C+but+supposes+that+they+are+and+must+be%2C+because+nature+teaches+that+without+time%2C+place%2C+person%2C+habit%2C+gesture%2C+it%E2%80%99s+impossible+that+these+or+any+human+actions+can+be%3B+and+therefore+Prelatical+Formalists+do+without+all+sense+or+reason+require+that+we+should+prove+by+Scripture%2C+the+lawfulness+of+time%2C+place%2C+person%2C+habit%2C+gesture+in+God%E2%80%99s+worship%3B+for+these+are+presupposed+in+all+actions%2C+natural%2C+civil%2C+religious%2C+private%2C+public%2C+lawful%2C+unlawful%2C+in+acts+of+arts%2C+sciences%2C+of+moral+conversing+and+all%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+Introduction%2C+pp.+2-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%

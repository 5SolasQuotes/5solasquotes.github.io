<blockquote><p>2. There can come no good work from man… unless then a man be regenerate and born anew, which is by faith in Christ, he can do no acceptable work. Both these are evident out of Scripture… 2. and that by faith we are regenerate and made the sons of God, Jn. 1:12, ‘As many as receiued Him, to them He gave power to be the sons of God, even to them that believe in his name.&#x27;</p></blockquote>

<blockquote><p>XVI. That this may be more in the open, the phrases and modes of speaking which Scripture uses in expressing the conversion of man are to be noted, as that God circumcises our heart (Dt. 30:6), that He takes away the stony heart and provides a fleshy one (Eze. 36:26), that we are drawn by the Father (Jn. 6:44), that those who believe, believe according to the efficacy of the power of his might (Eph. 1:18-19), and similar phrases which occur throughout. XVII. The efficacy of the Spirit which is signified here is such that where it is, there also a new creature exists. For the circumcision of the heart, the bending of the mind to faith, and the change of the heart constitute a new creature. Since this, therefore, is from the Holy Spirit, the new man also exists in act. XVIII. But not in potentiality only, so that conversion is then left to the liberty of his will; for God brings man not only to the power of believing, but to the very act of believing or converting (Jn. 6:44; Phil. 1:29; Acts 13:48). XIX. For either God does not give the act of believing itself, but only aids and the power of faith to be elicited by free will; or if He does give it, where is the place for deliberation, whether one wishes to believe or to be converted? For one who is already believing, there will certainly be none at all. XX. Indeed, the very corruption of man requires this. For Scripture names him dead. If he is dead, either he will not be resurrected to life at all, or if he is resurrected, it is necessary that this be done with that efficacy of which we have already spoken, so that the effect follows without doubt. The consequence follows, for since this resurrection indicates an infusion of life from God (Eph. 2:5) and an immortal seed implanted in man (1 Pet. 1:23), with this life infused, will not the man live? Or will the choice of living be left to liberty? But if life is not infused into him, he remains dead, and thus there will be no conversion of him. XXI. Nor indeed should anyone say here that God gives a kind of half-life, leaving the rest to be perfected by man. The phrases cited above do not permit this, for they indicate not some partial action, but a full and complete one. The condition of a man spiritually dead also opposes this fiction, for if only a particle of supernatural life is communicated to him, he must add the rest from his own resources. That will never be added by him who does not have it, and thus the conversion will be stuck. But if the better portion is conferred by God, the new creature already exists, if only from this, that the greater power overcomes the lesser in acting. XXII. This very thing is proven further. The hindrances which impede man’s conversion are the darkness of the mind (Eph. 4:18), the projection of the will toward evil (Gen. 8:21), and the disorder of the affections (Rom. 7:20). When these have been in large part restored in conversion by God, and good qualities have been substituted in place of these impediments, it is necessary that the faculties of the soul begin to operate differently, nor is it left free whether they wish to be converted or otherwise, being already converted in act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), pp. 4-5</span></figcaption>

<blockquote><p>§IV. It [sanctification] is distinguished from regeneration. For regeneration, strictly taken, signifies the beginning of the spiritual life; but sanctification, the progress and continuation of the spiritual life, made through the habits of the spiritual virtues, by which the faithful are gradually led to perfection, although many take regeneration in a broader sense as a synonym for sanctification.</p></blockquote>

</figure><figure class="quote" id="q-c899acc5da" data-kw="">
<blockquote><p>We must carefully distinguish between a twofold union and communion we have with Christ:

1. By the Spirit on his part: for Christ as by his death, he is the meritorious cause of life and grace unto the elect, so by his Spirit He is the only efficient of life and grace in the regenerate. To whom, whilst they are yet dead in sin and destitute of all grace, so as they neither do nor possibly can believe, Christ sends his Spirit which breathes life into them, changes and purifies their nature by working all holy and rectified abilities in every part. Now this first work of the Spirit, creating of grace in the soul, does most apparantly precede not only the act of believing, but the habit also: for the habit itself is infused by this work. And therefore it is also manifest that before all faith we have and must have some participation with Christ, even to this end that we may have faith. But this union with Him is wrought merely by the Holy Spirit, which is that band whereby Christ knits Himself to us, communicating all gracious and quickening virtue from Himself to us, and thereby making us living members of his body.

2. By our faith on our parts: when being quickened by infused grace we actually apply ourselves to embrace the promise and to rely upon Christ only. And here we knit ourselves to Christ, resting upon Him alone for all comfort. By which uniting of ourselves to Christ we receive a greater increase and larger measure of grace from Him. In the first union we were insensible of it, and grace is given to us non petentibus, that asked not after it: in this second union we are most sensible of its comfort and benefit; and here an augmentation of grace is bestowed on us petentes, earnestly suing for it, and by faith expecting the receiving of it. Wherefore I conclude, all grace and virtue whatsoever in us is given us from the fulness of Christ, the fountain of all supernatural life; but yet all is not wrought by Christ embraced by our faith, but by Christ conveying his grace unto us by his Spirit. This first quickens us: we then with Lazarus after life put into us, can awake, stand up, come forth, and by faith look on Him that raised us, fall down, worship and believe in Him as our Lord and God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-pemble.html">William Pemble</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ gratiæ. = A Plea for Grace, More especially the Grace of Faith</cite>, … (London: 1627), pp. 15-16</span></figcaption>

1. By the Spirit on his part: for Christ as by his death, he is the meritorious cause of life and grace unto the elect, so by his Spirit He is the only efficient of life and grace in the regenerate. To whom, whilst they are yet dead in sin and destitute of all grace, so as they neither do nor possibly can believe, Christ sends his Spirit which breathes life into them, changes and purifies their nature by working all holy and rectified abilities in every part. Now this first work of the Spirit, creating of grace in the soul, does most apparantly precede not only the act of believing, but the habit also: for the habit itself is infused by this work. And therefore it is also manifest that before all faith we have and must have some participation with Christ, even to this end that we may have faith. But this union with Him is wrought merely by the Holy Spirit, which is that band whereby Christ knits Himself to us, communicating all gracious and quickening virtue from Himself to us, and thereby making us living members of his body.

2. By our faith on our parts: when being quickened by infused grace we actually apply ourselves to embrace the promise and to rely upon Christ only. And here we knit ourselves to Christ, resting upon Him alone for all comfort. By which uniting of ourselves to Christ we receive a greater increase and larger measure of grace from Him. In the first union we were insensible of it, and grace is given to us non petentibus, that asked not after it: in this second union we are most sensible of its comfort and benefit; and here an augmentation of grace is bestowed on us petentes, earnestly suing for it, and by faith expecting the receiving of it. Wherefore I conclude, all grace and virtue whatsoever in us is given us from the fulness of Christ, the fountain of all supernatural life; but yet all is not wrought by Christ embraced by our faith, but by Christ conveying his grace unto us by his Spirit. This first quickens us: we then with Lazarus after life put into us, can awake, stand up, come forth, and by faith look on Him that raised us, fall down, worship and believe in Him as our Lord and God.”

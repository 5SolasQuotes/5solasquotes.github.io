<main class="wrap"><figure class="quote" id="q-e4359b67ee" data-kw="">
<blockquote><p>That does not mean that God sought His own profit for the creation like the artists do in the majority of their works. Rather, He possesses within Himself for all eternity all treasures and could acquire nothing within this universe or the works of creation that could somehow contribute to His contentment. …

For God knew from all eternity the virtues which are already in Him before He gave any proof of those in the production of things. And if He takes contentment in the recognition of His admirable properties – in reality, as love is always accompanied by kindness and by pleasure, His virtues cannot be such that He does not love them completely nor consequently without unspeakable contentment – He could not love Himself more after the creation of the world than before, since neither are His virtues augmented nor His recognition of them … God is without question a supremely perfect essence and beyond the comprehension of our understanding …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Treatise Concerning Predestination and its Dependent Principles</cite>, trans. Matthew Harding, ed. A. C. Clifford (1634; Norwich: Charenton Reformed Publishing, 2017), p. 65.</span></figcaption>

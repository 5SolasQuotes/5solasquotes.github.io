<main class="wrap"><figure class="quote" id="q-62a62c4e23" data-kw="">
<blockquote><p>The laity, who merely upon this account entertain uncharitable thoughts of their ministers and, as a consequence of this unallowable way of thinking, refuse to concur with their lawful pastors in the participation of all the ordinances of Christ, are highly culpable, being disturbers of the Church’s peace and violaters of her unity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-94ed4154c0" data-kw="">
<blockquote><p>The pretext of Christian fellowship is abused, to the hatching and propagating of the most absurd opinions, when people turn light and frothy, taking up their time with vain janglings, and diverting from the main scope, to wit, edification: These things are indeed to be shunned; but Christian fellowship is not to be disclaimed, but wisely to be ordered in respect of the persons with whom, and occasions upon which it is used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-208206c415" data-kw="">
<blockquote><p>News of the ordination of Cameron [by Robert M’Ward and John Brown of Wamphray in the Netherlands in late-July or early-August 1679] and [Thomas] Hog was swiftly carried back to Scotland, where it caused a predictable outburst of indignation amon the older nonconforming ministers. John Carstairs, one of the most senior among them, wrote bitterly to M’Ward on 20 August: ‘I somewhat wonder you have there ordained those two young men–not so very acceptable, to say no more, to the Church of Scotland. I fear it offends many; nor do I see, especially at this time, how it can be so well justified. Do you think that there is no ministerial church amongst the nonconforming ministers in Scotland to ordain whom they think fit to be ordained? And is it suitable to that Christian correspondence and deference that the churches of Christ ought to have with and to one another that a few ministers of the church in Holland should ordain ministers for the Church of Scotland without their desire, consent , allowance or knowledge?’ Carstairs’ view was certainly typical of many of the older and more influential of the ministers, and his letter clearly reflected their resentment at what they saw as a usurpation of their ministerial functions by M’Ward and Brown. It also gave an indication of the sort of reception Cameron could expect on his return to Scotland [in late-1679]. A further hint of the welcome that awaited him was given in a letter from John Dickson to M’Ward on 16 July: ‘As for Mr Cameron, the prejudice against him is screwed up so high that no vindication will allay the feverish spirits of some persons who are maddened against him.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lion of the Covenant: the Story of Richard Cameron (Durham: Evangelical Press, 1997)</cite>, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>It was better for Novatianto suffer anything than that the Church of Christ should be rent asunder;” asserting, “It is no less glorious to suffer martyrdom to keep division out of the Church, yea, and probably more glorious, than to die a martyr for not sacrificing to idols; for in the first, martyrdom is suffered for one soul, but in the other, for the universal Church.</p></blockquote>

</figure><figure class="quote" id="q-7c69e010b9" data-kw="">
<blockquote><p>If it be asked then, With what kind of defects or discontents may a union be made up? or, what rules may be walked by therein? For answer, we offer these considerations or rules: 1. Whatever doesn’t warrant an initial separation doesn’t warrant a continued separation… 2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation… 3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty… 4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice… 5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful… 6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal… (Edinburgh, 1659) | pt. 4, ch. 7, ‘General Grounds leading to Unity’</cite>, pp. 320-24</span></figcaption>

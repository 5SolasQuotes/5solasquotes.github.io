<main class="wrap"><figure class="quote" id="q-57639e2c3f" data-kw="">
<blockquote><p>VII… a divine and infallible certainty which exists or can ordinarily exist in every believer… from the grace of the Spirit by the energy (energeian) of faith, which, resting upon the external promises of the Word and the internal testimony of the Holy Spirit, exerts itself in all more or less, but as much as suffices for true consolation. (2) The question is not whether that certainty can be in the believer without the use of means (i.e., the desire for holiness and the exercise of repentance and the actual purpose of living piously… Fir we hold that these are not to be wrested apart from each other and that persuasion cannot proceed into act without the desire of holiness. For He gave his promises to those walking in that way alone, and there are the indubitable effects and signs (gnorismata) of true faith and justification. VIII… For since it does not exist in us… without the use of means, it is certain that when these means are not used or when the contrary are used, the act itself cannot be put forth… But this does not prevent the foundation from always being in the believer and the principle from which (if he rightly considers his own state and the divine promise) he can deduce this actual full confidence (plerophorian).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, ed. James Dennison, Jr. (Presbyterian &amp; Reformed, 1994), vol. 2, 15th Topic, question 17, ‘Whether the believer can and ought to be certain of his faith and justification by a divine and not merely conjectural certainty. We affirm…’ | sections 7-8</cite>, pp. 618-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

</figure><figure class="quote" id="q-bc95880ead" data-kw="">
<blockquote><p>XXXVI. As the certainty of perseverance is the consolation of the laboring, not the mother of security… since it can be granted only to those walking in the path of holiness… This is properly the fruit of the soul confirmed in the Lord and of the exercised senses. Therefore those who are not as yet confirmed must press forward by degrees and perceptibly in the ways of the Lord… XXXVII… Such is the holy security of the pious, which not only does not exclude watchfulness and the desire for piety, but necessarily supposes them as the certain means of their own preservation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, ed. James Dennison, Jr. (Presbyterian &amp; Reformed, 1994), vol. 2, 15th Topic, question 17, ‘Whether the believer can and ought to be certain of his faith and justification by a divine and not merely conjectural certainty. We affirm…’ | sections 36-37</cite>, pp. 630-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

<main class="wrap"><figure class="quote" id="q-27468f2c41" data-kw="">
<blockquote><p>But let us weigh the force of this argument; This is after the commandments and doctrines of men: therefore, it is not one of the things necessary to salvation, or to the worship of God, or for the acquiring of righteousness and holiness; for the following reasons:

1. Because God retains to himself alone this honour of appointing what he will have directly and immediately to pertain to Religion and his worship. Ye shall not do every man whatsoever is right in his own eyes: but what thing soever shall be commanded yon of the Lord, observe to do it; thou shalt not add thereto, nor diminish from it; Deut. xii. 8, 32. Hence that remark of Christ, Matth. xv. 9, In vain ye worship me, teaching the doctrines and commandments of men.

2. Because if these commandments of men pertained to the worship of God as parts of it, it would follow that the worship of God might be abrogated by human authority: for all these decrees may be either taken away or changed by the authority of those by whom they were ordained from the beginning: but that men have this power over the worship of God is most absurd.

3. Because if it be conceded that the observance of human decrees is a necessary part of worship or holiness in itself; it would thence follow, that God may be worshipped in ways not only different, but plainly contrary to one another, according to the will of men. For these human commandments are not only different, but sometimes opposed to each other. … From these things it is clearly evident, that the commands and traditions of men are not to be obtruded upon the Church under the notion of worship and righteousness, because they are the commandments of men and not of God.

Hence we derive the following Instructions :

1. That alone immediately and properly concerns Religion and the worship of God, which hath the testimony of the Divine will. It so behoves us to worship God in the way in which he himself has prescribed that he is to be worshipped, Augustine, lib. 1. De consensu Evang. cap. 18.

2. They who would have religion, righteousness, and holiness to consist in observing their commands and traditions, arrogate that to themselves, and their inventions, which is peculiar to God and the Divine commands. Men as men, speaking concerning God, are not worthy of credit; Clemens Alexandrinus, Strom. 6.

3. Since salvation and righteousness is not placed in the commands of men, they grievously err who so multiply these burdens of human traditions as thereby to hinder Christians in the exercises of true righteousness and godliness: For, it commonly happens, that when a thing is paid where it is not due, it is neglected where it is due, Tertull. De pœnit. This Christ himself complained of, that the people of God were drawn away from the observance of the Divine commands, whilst they were entirely employed upon the traditions of the Pharisees, Matth. xv. 6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 527-29.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3966fd98bd" data-kw="">
<blockquote><p>Nature and Revelation are both volumes from the hand of the same intelligent Author, both imparting — the one in a form more limited and obscure, the other in a manner definite and ample — much relating to His character and perfections. … Between these two great volumes, containing, as they do, the entire sum of God’s revelation to man, there can be neither contrariety nor contradiction.

A complete understanding is only necessary to a complete harmony; and while it is impious for the mere physicist to attempt to array the facts of science against revelation, it is weak for the Theologian to array his exegesis against well established scientific truths, or tremble for the ark of God before mere theories which stand like an inverted pyramid upon a very limited induction of facts, or, as is frequently the case, upon mere hypothesis; or wage war against any branch of science merely because illegitimate inferences may have been drawn from its facts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-r-w-sloane.html">J. R. W. Sloane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Word: A Discourse, Delivered at the Opening of the Reformed Presbyterian Synod, in Allegheny, Pa., on Tuesday Evening, May 24, 1859</cite>, (New York: Thomas Holman, 1859), pp 9, 10-11.</span></figcaption>

<blockquote><p>But who can endure the day of His coming? And who can stand when He appears? For He is like a refiner’s fire and like launderers’ soap. (Malachi 3:2)

Preaching on the above text before the House of Lords, George Gillespie instructed his hearers that references to the coming of Christ do not always refer to the incarnation or to the Lord’s visible return. Instead, when the Bible refers to the coming of Christ, it is often talking about the advance of his kingdom prior to his second coming:

We look for a more glorious coming of Jesus Christ before the end; for the Redeemer shall come to Zion (Isa. 59:20), and shall turn away ungodliness from Jacob (Rom. 11:26) and he shall destroy Antichrist with the brightness of his coming (2 Thess. 2:8); in which place the apostle has respect to Isaiah 11:4, where it is said of Christ, the rod of Jesse, with the breath of his lips shall he slay the wicked. There, withal, you have the church’s tranquillity, the filling of the earth with the knowledge of the Lord, and the restoring of the dispersed Jews …</p></blockquote>

<blockquote><p>XVI. That God is to be worshipped according to His own will, and that only in and through Jesus Christ.</p></blockquote>

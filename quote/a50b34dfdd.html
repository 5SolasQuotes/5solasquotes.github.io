</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a541fa9b54" data-kw="">
<blockquote><p>It is true that people, through corruption of nature, are averse to submit to governors ‘for conscience sake, as unto the Lord,’ because the natural man, remaining in the state of nature, can do nothing that is truly good, but it is false that men have no active moral power to submit to superiors, but only a passive capacity to be governed. He [John Maxwell] quite contradicts himself; for he said before (ch. 4, p. 49) that there is an ‘innate fear and reverence in the hearts of all men naturally, even in heathens, toward their sovereign;’ yea, as we have a natural moral active power to love our parents and superiors (though it be not evangelically, or legally in God’s court, good) and so to obey their commandments, only we are averse to penal laws of superiors. But this proves no way that we have only by nature a passive capacity to government; for heathens have, by instinct of nature, both made laws morally good, submitted to them, and set kings and judges over them, which clearly proves that men have an active power of government by nature. Yea, what difference makes the Prelate betwixt men and beasts? for beasts have a capacity to be governed, even lions and tigers; but here is the matter, if men have any natural power of government, the Popish Prelate would have it, with his brethren the Jesuits and Arminians, to be not natural, but done by the help of universal grace; for so do they confound nature and grace. But it is certain our power to submit to rulers and kings, as to rectors, and guides, and fathers, is natural;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-fe31d700a8" data-kw="">
<blockquote><p>First therefore they say, If so be we are not able to do any thing towards our salvation, this is to turn men into stocks and stones, or beasts, and so [there is] no difference between them and us. But we say, Although those similitudes the Scripture holds forth do prove our inability for that which is good, yet they must not be made alike in all things. It’s true, to convert men, is to make children unto Abraham out of stones; yet we must not think that is therefore an universal likeness between men and stones: For first, consider this vast dissimilitude; In stones and beasts there is no passive capacity of grace, but in man there is. We say, there is a power for grace in a man’s nature; and the Papists say, there is a power: only they say it’s an active power, though remote; we say, only a passive. There is a power to be converted to God, which is not in stones or beasts: they say, there is a power to convert or turn to God; here is a great difference. Besides, we may consider these degrees in the creatures:

1. There is an inclination to such an act, as in the fire to burn.

2. A spontaneous inclination to some acts accompanied with sense, and sensible apprehensions, as in beasts.

3. A willing inclination accompanied with reason or judgment, and this is in man: Now, because man is thus affected, therefore God in converting, though He does it by a potent work, yet by arguments, which we never use to horses, or brute beasts: and although man has lost that rectitude in his will and mind, yet he has not lost the faculties themselves; therefore though he be theologically dead, yet he is ethically alive, being to be wrought upon by arguments. Hence is that saying, ‘To will is of nature, to will well of grace; to will ill of corrupt nature.’ Hence we may grant those objections, that if a man had not this free-will (if you do not extend it to good things) there could be no conversion or obedience; for grace does not destroy, but perfect nature.</p></blockquote>

<blockquote><p>§XXXIV. Scotus and the Scotists, after Hales, Bonaventure, and Richard, also rightly state that the will, with respect to its acts, is more excellent than the intellect, for:

1. The Intellect is a merely natural and necessary faculty, which only represents and shows to the will things to be done and chosen, but does not command them; whereas the will determines the intellect to speculate on this or that, and often commands it to consider this and not that, and to judge in this way and not another. But it is more noble to command than to do or execute what is commanded.

2. Liberty, which is the highest perfection of an intellectual nature, inheres in the will, at whose nod the other faculties act or cease; from this, then, shines the nobility of the will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Schwartz, 1712), p. 17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

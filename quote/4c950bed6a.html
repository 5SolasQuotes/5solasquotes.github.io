<main class="wrap"><figure class="quote" id="q-4c950bed6a" data-kw="">
<blockquote><p>We can distinguish between adequate and inadequate distinction. The first is if the things said to be distinct are as it were equal or equivalent, as is the case with all the distinctions above adduced. A distinction is inadequate if the distinct things are not equal, so that one includes the other but not conversely. Such inadequate distinctions flourish, for example, between the whole and its part, or between a subject and its mode, for a mode includes the subject it modifies and the whole includes its parts. These sort of inadequate distinctions, as is plain, can be real (for example between the human body and an arm), or formal (for example between soul and intellect, between animality and sense feeling, between formality and its mode, as between divine wisdom and the same thing’s infinity), or logical (for instance between the rays of the sun and their power of heating). Also here can be added real negative distinctions, which flourish not between thing and thing but between a thing and a negation of it (for example between man and blindness).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’</cite>, p. 32</span></figcaption>

</figure><figure class="quote" id="q-5f865897be" data-kw="">
<blockquote><p>I have often wished that one of the veteran theologians would have developed a form of logic like the one I have outlined here, though I have only sketched rather than fully worked it out. Even though Andreas Hyperius published Theological Topics in the previous century, he did not use the method that scholars desire. A theological logic should be crafted such that it first demonstrates a method of argumentation in general and then provides rules for forming judgments in individual common places of theological debate. Here, I have broken the first ice. Kindly judge, reader, what I have accomplished, and make this handbook richer through your own efforts.</p></blockquote>

</figure><figure class="quote" id="q-23cb3ef646" data-kw="">
<blockquote><p>A guiding presupposition [of Matthew Barrett’s The Reformation as Renewal] is that the intellectual life of the second half of the thirteenth century was ‘characterized by a Thomistic atmosphere’ and that the later medieval theologians progressively fell away from the classical positions affirmed by Aquinas. Indeed, according to Barrett it was this degeneration away from Thomism in the later middle ages that was a significant catalyst for the Reformation. As soon as this presupposition is outlined, however, it is possible to see that Barrett’s account has, at the very best, an outdated view of later medieval thought. This kind of ‘decline’ narrative has not been maintained by experts in the thought of the period for many years, despite its persistence among historians whose direct acquaintance with scholastic texts ends with the death of Aquinas. The reason is that, outside the Dominican order (and, for that matter, inside it too at least until the middle of the fifteenth century), there never was a ‘Thomistic atmosphere.’ Why it was ever believed that there was one is not clear to me. But it is true to say that we do not pervasively find the kind of narrative Barrett reproduces until after Leo XIII’s Aeterni patris of 1879, and it is hard to avoid the conclusion that this encyclical itself had something to do with bringing about the anachronistic centering of Aquinas in our medieval intellectual history. This was no doubt an unintended consequence of Leo’s action, since it is clear enough that Leo’s motivation had to do with an appraisal of Aquinas’s intellectual weight, not of his influence on later medieval theology and philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Accidental Reformation?’ in Hanover Review, 3.1 (2024)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

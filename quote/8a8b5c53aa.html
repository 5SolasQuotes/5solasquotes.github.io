<main class="wrap"><figure class="quote" id="q-8a8b5c53aa" data-kw="">
<blockquote><p>Christ was given to us by God’s generosity, to be grasped and possessed by us in faith. By partaking of him, we principally receive a double grace: namely, that being reconciled to God through Christ’s blamelessness, we may have in heaven instead of a Judge a gracious Father; and secondly, that sanctified by Christ’s spirit we may cultivate blamelessness and purity of life. Of renewal,1 indeed, the second of these gifts, I have said what seemed sufficient. The theme of justification was therefore more lightly touched upon because it was more to the point to understand first how little devoid of good works is the faith, through which alone we obtain free righteousness by the mercy of God; and what is the nature of the good works of the saints, with which part of this question is concerned. Therefore we must now discuss these matters thoroughly. And we must so discuss them as to bear in mind that this is the main axis (praecipuum…cardinem) on which religion turns,2 so that we devote the greater attention and care to it. For unless you first of all grasp what your relationship to God is, and the nature of his judgment concerning you, you have neither a foundation on which to establish your salvation nor one on which to build piety toward God. But the need to know this will better appear from the knowledge itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion, 3.11.1 (Battles Edition)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3024f40bc6" data-kw="">
<blockquote><p>From this, also, we infer, that we cannot be justified freely through faith alone without at the same time living holily. For these fruits of grace are connected together, as it were, by an indissoluble tie, so that he who attempts to sever them does in a manner tear Christ in pieces. Let therefore the man who seeks to be justified through Christ, by God&#x27;s unmerited goodness, consider that this cannot be attained without his taking him at the same time for sanctification, or, in other words, being renewed to innocence and purity of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Epistles to the Corinthians</cite>, 1 Corinthians 1:30</span></figcaption>

</figure><figure class="quote" id="q-9a507d44d8" data-kw="">
<blockquote><p>If Christ made satisfaction for our sins by the obedience with which He fulfilled the law, so that that [obedience] is imputed to us by God as though we ourselves had fulfilled [the law], then it follows therefrom that we are set free from obedience of the law, because—according to this hypothesis—Christ has fulfilled it for us or in our stead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae ecclesiasticae, Epistle 68, p. 124b as trans. G.A. van den Brink, The Transfer of Sin: The Debate on Imputation in the English Antinomian Controversy (1690–1700)… (Brill, 2024)</cite>, p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-8d2d2850a6" data-kw="">
<blockquote><p>Neither does faith justify as the beginning of justification only: first, because there are no degrees of justification before God; for in the first act it is perfect: and to that act continued throughout this life, faith, as I showed before out of diverse of the Fathers, suffices. I say, suffices to justification: and therefore is not the beginning only, but also the continuance and consummation thereof: for as in the first act it justifies, so also in the continuance of justification: for by it we stand, and by it we live, and so long as we have faith, it is imputed unto us for righteousness even from faith to faith, as it was to Abraham, after he had long continued in the faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification (London: 1633)</cite>, ch. 10, ‘Bellarmine’s Arguments…’, p. 391</span></figcaption>

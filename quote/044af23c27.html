<main class="wrap"><figure class="quote" id="q-044af23c27" data-kw="">
<blockquote><p>First, the vow must be possible of fulfilment and within our power to perform. For who will vow an impossible thing? Or who will demand it? All vows are therefore described in the Scriptures in terms that are within our power, such as to give God cattle, sheep, houses, land, and so on. Now, chastity is not in our power, as little as are God’s other wonders and graces. But we are all made for marriage, as our bodies show and as the Scriptures state in Gen., ch. 2: “It is not good that man should be alone; I will make him a help meet for him.”

Whoever, therefore, considers himself a man and believes himself to be included in this general term should hear what God, his Creator, here says and decrees for him: he does not wish man to be alone but desires that he should multiply, and so he makes him a helpmeet to be with him and help him so that he may not be alone. This is the Word of God, through whose power procreative seed is planted in man’s body and a natural, ardent desire for woman is kindled and kept alive. This cannot be restrained either by vows or by laws. For it is God’s law and doing. Let him who will be alone abandon the name of man and prove or make himself an angel or spirit, for God does not grant or allow such a condition to a man.

Accordingly we do well when we sing of holy virgins in such a way as to indicate that they lived lives that were angelic rather than human and that they were enabled to live in the flesh and yet without the flesh by a special grace of God. Our bodies are in great part the flesh of women, for by them we were conceived, developed, borne, suckled, and nourished, and so it is quite impossible to keep entirely apart from them. This is in accord with the Word of God. He has caused it to be so and wishes it so. Even the impotent, as we know, are full of natural desire. Indeed, the more impotent they are, the more they desire to be with women, which is altogether natural, for we always desire most what we can least have.

Therefore, whoever will live alone undertakes an impossible task and takes it upon himself to run counter to God’s Word and the nature that God has given and preserves in him. The outcome is in keeping with the attempt; such persons revel in whoredom and all sorts of uncleanness of the flesh until they are drowned in their own vices and driven to despair. For this reason such a vow against God’s Word and against nature, being impossible, is null and void. And God also condemns it just as if somebody should vow to be God’s mother or to make a heaven.</p></blockquote>

<blockquote><p>Fifth, the various absurdities by which the opposite opinion is pressed [the opinion that there is no such thing as natural law]. For if nothing is just by nature, but that only which can be made to minister to human advantage, it follows that men are born for themselves and not for the glory of God or for the good of society (of which there is by nature in them an earnest desire), which the wiser heathen themselves acknowledge could not be said.

(2) All things would be equally lawful: to hate God as well as to love him; to kill parents as well as to honour them; and each one’s own will would be to him for a reason and a law, so that he might do whatever he pleased (whether this does not pave the way to atheism, anyone can readily understand).

(3) This moral right and government of God being taken away, all the foundations of right will be removed; all the laws of men which could have flowed from no other source, and thus all government, honesty and order in human society will perish and the world be turned into mere confusion and villainy.</p></blockquote>

<blockquote><p>One of the best known and most esteemed of John Owen’s works. It is unnecessary to say that he is the prince of divines. to master his works is to be a profound theologian. Owen is said to be prolix, but it would be truer to say that he is condensed. His style is heavy because he gives notes of what he might have said, and passes on without fully developing the great thoughts of his capacious mind. He requires hard study, and none of us ought to grudge it.” – Spurgeon Allen, James – Serious Advice to delivered ones from sickness or any other dangers threatening death, how they ought to carry it that their mercies may be continued, and other misery prevented, or, The healed ones prophulacticon, or healthful diet, delivered in several sermons on John 5:14 (Boston, 1679) Allen (1632-1710) appears to have been a faithful, New England minister. Here are about 15 or so other works of his. Sibbes, Richard – ‘A Rescue from Death, with a Return of Praise’ Works, 6.133-57 on Ps. 107:17 ff. Mather, Cotton – ‘Mens Sana in Corpore Sano. A Discourse upon Recovery from Sickness. Directing how Natural Health, may be Improved into Spiritual: especially by them that have Lately Recovered it’ (Boston, 1698) . 1700’s Wadsworth, Benjamin – ‘Christian Advice to the Sick and Well. In Answer to these Questions:

I. What should Christians do, when under bodily sickness?

II. How should Christians in health, improve the sickness of others; and how should they carry it towards the sick?

III. How should Christians behave themselves, when recovered from sickness? And, None but the Righteous Saved: a Sermon on 1 Cor. 6:9’ Ref (Boston, 1714) Newton, John – Letter 36, ‘To a Gay [Merry] Friend, on his Recovery from Illness’ Works (London, 1808), vol. 1 (of 6), pp. 353-7 . . On Visiting the Sick, especially Church Officers Articles 1500’s Calvin, John – ‘Visitation of the Sick’ in Calvin’s Tracts: containing Treatises on the Sacraments… vol. 2, trans. Beveridge (Edinburgh, 1849), pp. 127-8 . 1600’s Westminster Assembly pp. 84-95 of Journal of the Proceedings of the Assembly of Divines… in The Whole Works of the Rev. John Lightfoot, vol. 13 This is on whether it is a function of the pastoral office to visit the sick. Taylor, Jeremy – ch. 5, ‘Of Visitation of the Sick’ in The Rules &amp; Exercises of Holy Dying: together with prayers &amp; acts of virtue to be used by sick and dying persons, or by others standing in their attendance; to which are added rules for the visitation of the sick &amp; offices proper for that ministry new ed. (Oxford: 1857), pp. 73-229 Taylor (1613-1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He is sometimes known as the “Shakespeare of Divines” for his poetic style of expression, and he is frequently cited as one of the greatest prose writers in the English language. Swinnock, George – ‘A Good Wish about the Visitation of the Sick’ in Works, 3:24-37 (d. 1673) This is a prayer that we, pastors specifically, may be more dutiful in visiting the sick, etc. Poole, Matthew – ‘How Ministers or Christian Friends may and ought to apply themselves to Sick Persons, for their Good, and the Discharge of their Own Conscience’ in Puritan Sermons, vol. 1 on Job 23:23-24 Stearne, John – The Curate’s Manual, with Reference to the Sick &amp; Dying, from the Latin of John Stearne, Vicar of Trim in the 17th Century, with Additions, Original &amp; Selected by the Rev. Kirby Trimmer… (1697; London, 1840) ToC Stearne (1660-1745) was an Anglican bishop. His original work was Tractatus de Visitatione Infirmorum (Dublin, 1697; London, 1700, several editions). . 1800’s Ely, Ezra Stiles – Visits of Mercy, being the Journal of the Stated Preacher to the Hospital and Alms House in the City of New York, 1811, vols. 1, 2 (New York, 1813) Ely (1786-1861) was an American presbyterian minister during the Second Great Awakening. Wells, John D. – The Pastor in the Sick-Room, Three Lectures delivered at Princeton Theological Seminary, March, 1892 (Philadelphia: Pres. Board of Publication, 1893) 130 pp. Wells (1815-1903) was a graduate of Old Princeton in 1844 and learned “at the feet of Dr. Archibald Alexander, Dr. Samuel Miller, Dr. Charles Hodge and Dr. Joseph Addison Alexander, all of blessed memory.</p></blockquote>

<blockquote><p>Let us now see what theory of political society is deduced by [Thomas] Hobbes from his metaphysics, in his treatises of the Citizen, and “Leviathan.” We must remember that, according to him, there is no supreme uniform standard of moral obligation, and no conscience in man. The only motive of rational conduct is self- interest. Hence, Hobbes naturally infers that the original conception of right which the human being has, is of a natural right to appropriate whatever he sees will contribute to his pleasure, and to avoid whatever produces pain. By the same reason one man feels this right, every other feels the same. The natural state, then, is one in which each man tends to claim all things, and to resist the similar claims of all others.

But by the same natural right, each man is also resisted. Hence, the state of nature is “a war of all against all.” But self-interest cannot become enlightened by experience, without perceiving that this war of all against all tends, on the whole, to the reduction of natural enjoyments to a minimum, and to the universal destruction of persons. Hence, the first acquired desire of nature is for repose from this endless strife of warring wills. How shall that repose be sought? Obviously, only in some force strong enough to suppress the strife; for there is no moral principle in man which can become a regulative standard. The competing wills of individuals being all naturally equal, and all properly exorbitant, there is no reasonable umpire between them but the strong hand. Might makes right.

He who is able to overpower the assailant of his natural good, in the competition, if he chooses not to destroy him, has thereby a perfect property in the spared enemy. Slavery and violent conquest are legitimate; and in this way was actually originated the controlling force which calmed the universal warfare into political society. When a conqueror had compelled a sufficient number of subjugated persons to work and fight for him, to show himself practically superior to all others, he was recognized as the suitable ruler, by all the others whose self-interest taught them to desire repose. Hence in order to secure the peaceable enjoyment of some natural good, they submitted their claims to the remainder to the powerful man, and became willingly a part of his subjugated train.

The essence of political power, then, is force; and in order to gain the end of government, repose, it must be an irresistible force. Government, then, should be absolutely despotic. And it is much more consistent that it should be an absolute monarchy in the hands of one man. The ruler is absolute proprietor of the persons and property of all the citizens; he is wholly irresponsible to them, as to all earthly authority. For, in passing from the state of nature into the political state, each person surrendered his individual independence absolutely to the Ruler, and a surrender of this kind is final and beyond recall.

For, by this act, right of resistance is for the people annihilated; and they have reduced themselves, as holders of such a franchise, to non-existence. The entrance of the integer into political society is, as to his separate rights, final suicide. The Ruler is master, and the citizens are property: property has no appeal against its own proprietor. Any right of conscience against the Ruler’s fiat is, of course, out of the question: for Hobbes does not believe in any conscience that can have rights.</p></blockquote>

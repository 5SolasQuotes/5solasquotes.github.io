<blockquote><p>If, therefore, magistrates command that which is prejudicial to the general welfare of the society, or dishonourable to God, the Supreme Governor of it, they ought to be disobeyed. And, if they be habitually cruel and tyrannical, they ought to be resisted and deposed, if circumstances permit.

1. When the great body of the subjects are much alienated in affection, a revolution may be accomplished without much hazard or hurt.

2. By resisting tyrannical princes in proper circumstances, nations have often preserved their lives as well as their liberties from impending ruin.

3. Such resistance, prudently managed, is an effectual warning to other magistrates to beware of abusing and opposing their subjects.

4. In mixed forms of government, the propriety of resistance is most clear as well as most easy: as when a parliament resists a king, or a king resists a parliament, in defence of the common liberties of the nation. – Nevertheless, as princes are exposed to many and uncommon difficulties, and are apt to be imposed on by their confidents:- and as their real designs are not easily penetrated, and often not to be pried into by their subjects; – and as resistance ordinarily occasions much bloodshed and misery, – subjects ought to put the best construction upon the conduct of their governors that it can justly admit, – and never proceed to violent measures but where it is absolutely necessary, and where there is an hopeful prospect of success.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Compendious View of Natural and Revealed Religion</cite>, (1782; Fearn: Christian Focus, 2002), pp 23-24.</span></figcaption>

<blockquote><p>Precious in the sight of the Lord is the death of his saints;” and he will make inquisition for the blood of his saints that has been shed like water in our streets. Sirs, much of this blood was shed in the times of persecuting tyranny, particularly in this city [Edinburgh]. That blood, I say, hath not been purged; yea, the guilt of it calls for wrath upon us their sinful posterity.

There was no due inquiry after it, when the Lord turned back our captivity after the Revolution; yea, instead of that, men who had dipt their hands in the blood of his saints were put into places and posts both civil and military; yea, I will add, that they were admitted to sit as constituent members in the supreme judicatories of this church.

We have reason to believe, that he will inquire after that blood; for he “visits the iniquity of the fathers upon the children, to the third and fourth generation.” It is crying yet from under the altar against many families in Scotland; and I fear it has a loud cry against this city, where it was shed in great abundance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Tabernacle of David Ruined by Man, and reared up by the Mighty God. Being Three Discourses. The First and Second Preached at Edinburgh, November 1735; and the Third at Kinross, February 17th 1736, at the opening of the Presbytery of the Associate Ministers there in The Whole Works of Ebenezer Er</cite></span></figcaption>

<blockquote><p>...it is a dreadful sin to depart from the church for the purpose of establishing one which is better, for the church is one, being the body of Christ. To separate ourselves from the church is to separate from the people of Christ and thus from His body, thereby withdrawing from the confession of Christ and departing from the fellowship of the saints. If we indeed deem the church to be what she really is, we shall then cause schism in the body of Christ, grieve the godly, offend others, give cause for the blaspheming of God‟s Name, and cause the common church member to err. By maintaining that the church is no church, we thereby deny the church of Christ, and therefore are also guilty of the sins just mentioned. We thereby displease God, who will not leave this unavenged, regardless of how much we please and flatter ourselves. Such activity the apostle opposes when he refers to such individuals as being carnal in 1 Cor 3:1, 3. He warns against this when he writes, “Now I beseech you, brethren, by the name of our Lord Jesus Christ, that ye all speak the same thing, and that there be no divisions among you” (1 Cor 1:10); “I hear that there be divisions among you” (1 Cor 11:18).</p></blockquote>

<blockquote><p>Do you, or can you believe and make all your followers believe that the synagogue-worship and the Temple-worship were kept so pure by the priests, Levites and pharisees in Christ’s days as that there was nothing of human tradition obtruded? Or nothing but what God commanded? Can you believe this? Or can you believe that Christ was not usually or often present there? See Luke 4:16, ‘At Nazareth where he had been brought up, as his custom was, He went into the synagogue on the Sabbath day’—And of Paul its said, Acts 17:2, ‘As his manner was, he went in to them, and three Sabbath days reasoned’—Or do you believe that Christ was a sinner? and that he contradicted his own sovereignty? What! and yet be a perfect Saviour?</p></blockquote>

<blockquote><p>The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.”

— Richard Vines, Other citations (work not named), On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Church+may+be+corrupted+many+ways%2C+in+doctrine%2C+ordinances%2C+worship%2C+etc.+And+there+are+degrees+of+this+corruption%3B+the+doctrine+in+some+remote+points%2C+the+worship+in+some+rituals+of+man%E2%80%99s+invention+or+custom.+How+many+Churches+do+we+find+thus+corrupted%2C+and+yet+no+separation+of+Christ+from+the+Jewish+Church%2C+nor+any+commandment+to+the+godly+of+Corinth%2C+etc.+to+separate.+I+must+in+such+a+case+avoid+the+corruption%2C+hold+the+communion%E2%80%94But+if+corruptions+invade+the+fundamentals%2C+the+foundation+of+doctrine+is+destroyed%2C+the+worship+is+become+idolatrous%3B+and+what+is+above+all%2C+if+the+Church+impose+such+laws+of+her+communion+as+there+is+a+necessity+of+doing+or+approving+things+unlawful%2C+in+that+case%2C+%E2%80%98Come+out+of+Babylon.%E2%80%99+The+Churches+of+Protestants+so+separated+from+Rome.%E2%80%9D%0A%0A%E2%80%94+Richard+Vines%2C+Other+citations+%28work+not+named%29%2C+On+the+Sacrament%2C+p.+239+as+quoted+in+A+Collection+of+Cases+%26+other+Discourses+lately+written+to+recover+Dissenters+to+the+communion+of+the+Church+of+England+by+some+Divines+of+the+City+of+London+%28London%2C+1685%29%2C+vol.+1%2C+%E2%80%98The+Non-Conformists+Plea+for+Lay-Communion+with+the+Church+of+England%E2%80%99%2C+p.+21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F06015b364f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/06015b364f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=The%20Church%20may%20be%20corrupted

<main class="wrap"><figure class="quote" id="q-275c3252d1" data-kw="">
<blockquote><p>It is necessary to consider the nature of afflictions, because God wants that we should feel his chastisements, and that we should taste all the bitterness without letting anything escape. Those who only seek to divert pain and stifle it by means of other things, or those who take the part of toning down bad things and of explaining them away as if they were nothing find only false consolations. True wisdom doesn’t deceive anyone. Rather it opens our eyes to make us recognize affliction to the highest degree and to its full extent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-claude.html">Jean Claude</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon on Ecclesiastes 7:14: Delivered during a Fast Day at The Hague, the Netherlands, on November 21, 1681 , trans. Charles K. Telfer in Mid-American Journal of Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

<blockquote><p>I believe that God never expects us to feel no suffering or pain when it pleases Him to visit us with affliction. There are great mistakes upon this point. Submission to God’s will is perfectly compatible with intense and keen suffering under the chastisements of that will. Troubles in fact not felt, are no troubles at all. To feel trouble deeply, and yet submit to it patiently is that which is required of a Christian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop J. C. Ryle’s Autobiography: The Early Years</cite>, ed. Andrew Atherstone (Edinburgh: Banner of Truth, 2017), pp 94-95.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-b219a92395" data-kw="">
<blockquote><p>Jesus willingly suffered to save us from eternal suffering. He warns us, however, that as long as we are in this fallen world we will undergo temporal suffering, especially at the hands of the wicked. Self-denial and a willingness to suffer is, therefore, key to following Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/conrad-mbewe.html">Conrad Mbewe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post on X</cite>, (@ConradMbewe), Oct 23, 2020</span></figcaption>

</figure><figure class="quote" id="q-0c1da8e67e" data-kw="">
<blockquote><p>That the afflictions that do befall the saints are such as proceed from God’s dearest love. ‘As many as I love, I rebuke and chasten,’ Rev. iii. 19. Saints, saith God, think not that I hate you, because I thus chide you. He that escapes reprehension may suspect his adoption. God had one Son without corruption, but no son without correction. A gracious soul may look through the darkest cloud, and see a God smiling on him. We must look through the anger of his correction to the sweetness of his countenance; and as by the rainbow we see the beautiful image of the sun’s light in the midst of a dark and waterish cloud.

When Munster lay sick, and his friends asked him how he did and how he felt himself, he pointed to his sores and ulcers, whereof he was full, and said, ‘These are God’s gems and jewels, wherewith he decketh his best friends, and to me they are more precious than all the gold and silver in the world.’ A soul at first conversion is but cast; but God by afflictions doth square and fit, and fashion it for that glory above, which doth speak them out to flow from precious love; therefore the afflictions that do attend the people of God should be no bar to holiness, nor no motive to draw the soul to ways of wickedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Precious Remedies Against Satan’s Devices</cite>, (1676) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 1: 52.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

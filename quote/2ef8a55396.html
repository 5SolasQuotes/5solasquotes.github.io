<main class="wrap"><figure class="quote" id="q-2ef8a55396" data-kw="">
<blockquote><p>Your [John Owen’s] wrong exposition of all the texts of Scripture here cited by you is more than one mistake. Dt. 4:2 and 12:32; Prov. 30:6, forbid adding to God’s worship, which is broken by all that either say that that is in God’s Word which is not there (as you here do), or that devise any worship-ordinances coordinate, or of the same sort, with his own, as if they were imperfect. But there is not a word forbidding subordinate, secondary acts of worship, such as kneeling, putting off the hat, using written notes in preaching or forms of singing, praying, catechizing, laying the hand on the Book, or putting it under the thigh, or lifting it up in swearing, the formal words of vows, oaths, covenants, confessions, professions and many such.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-7f2262c600" data-kw="">
<blockquote><p>Q. What is the worship of God? A. That reverent respect and love wherewith we are to embrace his maiesty with our whole man. 1 Sam. 12:24; Mt. 22:37-38. The Schoolmen define it to be an immediate act of the will upon God: but this is the whole rule of divinity, which is nothing else but the ordering of the will so as it may please God. Now the act of the will is either to believe or obey, and obedience is either immediate, as piety, or mediate as charity. Hence the love of my neighbor is not an immediate act upon God, and in this sense worship is well distinguished from charity: as having no nearer object than God.</p></blockquote>

</figure><figure class="quote" id="q-3c364f2acd" data-kw="">
<blockquote><p>For principally and properly God is worshipped in our spirit: Jn. 4:24, ‘The true worshippers shall worship the Father in spirit.’ Rom. 1:9, ‘Whom I serve in my spirit.’ 1 Pet. 3:15, ‘Sanctify God in your hearts.’ By the ‘spirit’ I understand the thought of the mind, the consience and the affections of the heart. For in these is the first and principal seat of divine and spiritual worship. As for the body, it is but a secondary instrument of the service of God… the true religion of the New Testament has but few prescribed ceremonies and for the most part is divine and spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 700</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-fe5f29ba12" data-kw="">
<blockquote><p>We complain that the whole doctrine of godliness is adulterated by impious dogmas; that the whole worship of God is vitiated by foul and disgraceful superstitions; that the pure institution of the sacraments has been supplanted by horrible sacrilege; that their use has been converted into a profane trafficking; that poor souls, which ought to have been ruled by the doctrine of Christ, are oppressed by cruel bondage; that nothing is seen in the Christian Church that is not deformed and debased; that the grace of Christ not only lies half-buried, but is partly torn to pieces, partly altogether extinguished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, p. 20</span></figcaption>

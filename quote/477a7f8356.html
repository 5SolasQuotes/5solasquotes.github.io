<blockquote><p>1st, It is more difficult to get the impression of the odiousness of corrupt doctrine on the heart, than of gross outward practices. 2rdly, Pursuing of persons that are erroneous has often little fruit with it as to the persons themselves, there being but few that are recovered out of that snare of the Devil, and to whom God gives repentance, who once deliberately oppose themselves to the truth. This makes that even sometimes good men, out of fear of the inconveniences that may follow, and the difficulties that accompany such a work, may be too prone to oversee and forbear them, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5105eb4e3e" data-kw="">
<blockquote><p>The Brownists did not difler from the Church of England in any articles of faith, but were very rigid and narrow in points of discipline. They denied the Church of England to be a true Church and her ministers to be rightly ordained. They maintained the discipline of the Church of England to be Popish and antichristian, and all her ordinances and sacraments invalid. Hence they forbade their people to join with them in prayer, in hearing, or in any part of public worship; nay, they not only renounced communion with the Church of England, but with all other reformed Churches, except such as should be of their own model. They apprehended, according to Scripture, that every church ought to be confined within the limits of a single congregation and that the government should be democratical. When a church was to be gathered, such as desired to be members made a confession of their faith in the presence of each other, and signed a covenant, obliging themselves to walk together in the order of the gospel, according to certain rules and agreements therein contained. The whole power of admitting and excluding members, with the deciding of all controversies, was in the brotherhood. Their church-officers, for preaching the Word and taking care of the poor, were chosen from among themselves, and separated to their several offices by fasting and prayer and imposition of the hands of some of the brethren. They did not allow the priesthood to be a distinct order, or to give a man an indelible character; but as the vote of the brotherhood made him an officer and gave him authority to preach and administer the sacraments among them, so the same power could discharge him from his office and reduce him to the state of a private member. When the number of communicants was larger than could meet in one place, the church divided and chose new officers from among themselves as before, living together as sister-churches and giving each other the right hand of fellowship, or the privilege of communion with either. One church might not exercise jurisdiction or authority over another, but each might give the other counsel, advice, or admonition if they walked disorderly or abandoned the capital truths of religion; and if the offending church did not receive the admonition, the others were to withdraw and publicly disown them as a church of Christ. The powers of their church-officers were confined within the narrow limits of their own society; the pastor of one church might not administer the sacrament of baptism or the Lord’s supper to any but those of his own communion and their immediate children. They declared against all prescribed forms of prayer. Any lay-brother had the liberty of prophesying or giving a word of exhortation in their church assemblies; and it was usual after sermon for some of the members to ask questions and confer with each other upon the doctrines that had been delivered; but as for church-censures, they were for an entire separation of the ecclesiastical and civil sword. In short, every church, or society of Christians meeting in one place, was, according to the Brownists, a body corporate, having full power within itself to admit and exclude members, to choose and ordain officers; and, when the good of the society required it, to depose them, without being accountable to classes, convocations, synods, councils or any jurisdiction whatsoever. Some of their reasons for withdrawing from the Church are not easily answered: they alleged that the laws of the realm and the queen’s injunctions had made several unwarrantable additions to the institutions of Christ. That there were several gross errors in the Church-service. That these additions and errors were imposed and made necessary to communion. That if persecution for conscience’ sake was the mark of a false church, they could not believe the Church of England to be a true one. They apprehended farther that the constitution of the hierarchy was too bad to be mended; that the very pillars of it were rotten and that the structure must be begun anew. Since therefore all Christians are obliged to preserve the ordinances of Christ pure and undefiled, they resolved to lay a new foundation and keep as near as they could to the primitive pattern, though it were with the hazard of all that was dear to them in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/about-separatists.html">About Separatists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Tenets of the English Brownists</cite>, Daniel Neal, The History of the Puritans… (London, 1822), vol. 1, ch. 6, From Parker to Grindal, pp. 303-5</span></figcaption>

<blockquote><p>(2.) [Informatory Vindiction:] ‘We distinguish between a Church in a growing case, coming forward out of darkness, and advancing in reformation, and a Church declining and going back again. In the former many things may be born with, which, in the latter, are noways to be yielded unto, as in the time of the former prelacy many did hear prelatical men,’ etc. In times of defection and division, the Church was declining and going back, and in that case it was needful to be very peremptory in tenaciousness: But now she is growing and coming forward out of darkness, and advancing, though weakly, in reformation; and therefore now, sure it must be born with to hear presbyterian ministers, though formerly guilty of defections, as much as in former times to hear prelatical men. (3.) ‘We diftinguished between a Church and a reformed and settled state, and a Church in a broken and disturbed state.’ In times of defection and division, it was thought the: ‘most lawful expedient and conducive mean for maintaining the attained unto reformation, to abstract and withdraw from such disorders in ministers, which we could not otherwise get rectified.’ But now that is neither the lawful expedient, nor conducible mean to maintain reformation, but rather the way to obstruct it, to withdraw from ministers, whose former disorders we would have rectified in a case where the Church is settled, so far as to have liberty to keep General Assemblies to rectify them, and the government thereof is confirmed with the civil sanction of acts of parliament. … (6.) ‘We distinguished between a faithful and a sinless ministry.’ In times of defection and division, we might, for the want of the former qualification withdraw, that is, when they were not faithful.’ But now when they are more faithful, we cannot withdraw, except we would withdraw from them because they are not sinless, which in no case can be a ground.</p></blockquote>

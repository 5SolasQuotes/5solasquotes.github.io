<blockquote><p>Previously, we have published extracts from the contributions of Edmund Calamy and Samuel Rutherford to the Westminster Assembly’s debate on hypothetical universalism. On this occasion, we publish the contribution of the Scots Commissioner, George Gillespie with some of the replies of Edmund Calamy and Lazarus Seaman, and with the brief contributions of Edward Reynolds and John Lightfoot:

Debate about the redemption of the elect only by Christ. …

Mr. Gillespie—Nothing to the thing itself; but for the state of the question, let more be looked upon than that expressed in the proposition, because there is a concatenation of the death of Christ with the decrees; therefore we must see what they hold concerning that which in order goes before and what in order follows after. … [John] Camero[n] saith for all upon condition of believing, but [Moïse] Amyrauld he hath drawn it further. . . . Whether he hold an absolute reprobation of all that shall not be saved. . . . A parte post what follows upon that conditional redemption.

Mr. Calamy—In the point of election, I am for special election; and for reprobation, I am for massa corrupta. . . . Those to whom He … by virtue of Christ’s death, there is ea administrate of grace to the reprobate, that they do wilfully damn themselves. I neither hold sufficient grace nor special grace. …

Mr. Reynolds—The Synod [of Dort] intended no more than to declare the sufficiency of the death of Christ; it is pretium in se, of sufficient value to all,—nay, ten thousand worlds. There are two Adams,—one a fountain of misery, and the other of mercy. … To be salvable is a benefit, and therefore belongs only to them that have interest in Christ.

Mr. Seaman—All in the first Adam were made liable to damnation, so all liable to salvation in the second Adam.

This proposition to be debated: ‘That Christ did intend to redeem the elect only.’ …

Mr. Gillespie—In answer to the two arguments [of Edmund Calamy from John 3:16 and Mark 16],—one from the iii. Joh[n] 16. A. I. The brother takes for granted that by the world is meant the whole world. It is a point much controverted. Our divines do deny that the word world must in some places be taken in another sense. . . . For that of the philanthropy it makes much against it. … I cannot understand how there can be such a universal love of God to mankind as is maintained. Those that will say it must needs deny the absolute reprobation; then alone to those whom God hath absolutely reprobated both from salvation and the means of salvation.

. . . For the next argument from xvi. Mark. . . . He conceives the ground of this universal offer is the institution of Christ in dying. . . . For that of the truth . . . There is a truth in it: the connection of those two extremes must ever hold true faith and salvation. But what is that to a reprobate? He[re] is the mistak[e]. The voluntas decreti and mandati are not distinguished. … A man is bound to believe that he ought to believe, and that by faith he shall be saved. It is his duty. The command doth not hold out God’s intentions; otherwise God’s command to Abraham concerning sacrificing of his son . . . Said I cannot say so to a devil. . . . True; but reason is, that it is the revealed will of God that devils are absolutely excluded, but not so any man known to me.

Mr. Calamy—The difference is not in the offer, but in the application. . . . That voluntas decreti comes only in the application. . . . For the word world … I grant it signifies continued, the elect sometimes, but sometimes it signifies the whole world, and so it must do here. . . . For this love he saith he under . . . There is a double love: general and special. A general love to the reprobate, and the fruit of this, a general offer, and general grace, and general reformation.

Mr. Gillespie—It is acknowledged the word world may suffer another sense—the elect, but said it must be a larger thing than believers. … A. This is still taken for granted, which is to be proved, for I say it is very good sense. God so loved the elect, that whosoever believes in Him . . . The reconciling of a general love with absolute reprobation is not answered. . . . The general offers of the gospel are not grounded upon the secret decree.

Mr. Lightfoot—I understand the word world in a middle sense. It is only in opposition to the nation of the Jews. … For the universal offer God intends as the salvation of the elect, so the inexcusableness of the wicked.</p></blockquote>

<blockquote><p>Now when God says expressly (as if He would make it impossible for any mortal to misconceive Him) that Christ is the Savior, the propitiation, the taster of death, not only for all men, but for every man, not only for the world, but for the whole world, and to prove He speaks of an intention to save them all without exception (if by the wickedness of their wills they do not frustrate his intention, as the greater part of men do, by not accepting his offer and not performing the conditions on which his offer is made), He professes He is not willing that any should perish, but [on the contrary] that all should come to repentance, 2 Pet. 3:9.</p></blockquote>

<blockquote><p>We are often demanded whether every one that hears the Gospel be not bound to believe that Christ died for him? Now I say this phrase ‘Christ died for me’ includes many things, as the benefits which arise unto me by the death of Christ may be conceived to be many. But let these benefits be distinguished and we shall readily answer to the question made, and that perhaps differently, as namely, affirmatively to some, negatively to others; as thus: Do you speak of Christ’s dying for me, that is, for the pardon of my sins and for the salvation of my soul: I answer affirmatively and say I am bound to believe that Christ died for the procuring of these benefits unto me in such manner as God has ordained, to wit, not absolutely but conditionally, to wit, in case I do believe and repent. For God has not otherwise ordained that I should reap the benefit of pardon and salvation by virtue of Christ’s death and passion unless I believe in Him and repent. But if question be made whether I am bound to believe that Christ died for me to procure faith and repentance unto me: I do not say that I am bound, or that every one who hears the Gospel is bound to believe this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath</cite>, ... (Oxford: L.L., 1653), pt. 1, Intro, p. 5</span></figcaption>

<div class="actions"><button class="copy" data-copy="“We are often demanded whether every one that hears the Gospel be not bound to believe that Christ died for him? Now I say this phrase ‘Christ died for me’ includes many things, as the benefits which arise unto me by the death of Christ may be conceived to be many. But let these benefits be distinguished and we shall readily answer to the question made, and that perhaps differently, as namely, affirmatively to some, negatively to others; as thus: Do you speak of Christ’s dying for me, that is, for the pardon of my sins and for the salvation of my soul: I answer affirmatively and say I am bound to believe that Christ died for the procuring of these benefits unto me in such manner as God has ordained, to wit, not absolutely but conditionally, to wit, in case I do believe and repent. For God has not otherwise ordained that I should reap the benefit of pardon and salvation by virtue of Christ’s death and passion unless I believe in Him and repent. But if question be made whether I am bound to believe that Christ died for me to procure faith and repentance unto me: I do not say that I am bound, or that every one who hears the Gospel is bound to believe this.”

— William Twisse, The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, ... (Oxford: L.L., 1653), pt. 1, Intro, p. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+are+often+demanded+whether+every+one+that+hears+the+Gospel+be+not+bound+to+believe+that+Christ+died+for+him%3F+Now+I+say+this+phrase+%E2%80%98Christ+died+for+me%E2%80%99+includes+many+things%2C+as+the+benefits+which+arise+unto+me+by+the+death+of+Christ+may+be+conceived+to+be+many.+But+let+these+benefits+be+distinguished+and+we+shall+readily+answer+to+the+question+made%2C+and+that+perhaps+differently%2C+as+namely%2C+affirmatively+to+some%2C+negatively+to+others%3B+as+thus%3A+Do+you+speak+of+Christ%E2%80%99s+dying+for+me%2C+that+is%2C+for+the+pardon+of+my+sins+and+for+the+salvation+of+my+soul%3A+I+answer+affirmatively+and+say+I+am+bound+to+believe+that+Christ+died+for+the+procuring+of+these+benefits+unto+me+in+such+manner+as+God+has+ordained%2C+to+wit%2C+not+absolutely+but+conditionally%2C+to+wit%2C+in+case+I+do+believe+and+repent.+For+God+has+not+otherwise+ordained+that+I+should+reap+the+benefit+of+pardon+and+salvation+by+virtue+of+Christ%E2%80%99s+death+and+passion+unless+I+believe+in+Him+and+repent.+But+if+question+be+made+whether+I+am+bound+to+believe+that+Christ+died+for+me+to+procure+faith+and+repentance+unto+me%3A+I+do+not+say+that+I+am+bound%2C+or+that+every+one+who+hears+the+Gospel+is+bound+to+believe+this.%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Riches+of+God%E2%80%99s+Love+unto+the+Vessels+of+Mercy%2C+consistent+with+his+absolute+Hatred+or+Reprobation+of+the+Vessels+of+Wrath%2C+...+%28Oxford%3A+L.L.%2C+1653%29%2C+pt.+1%2C+Intro%2C+p.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76cf032e15.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/76cf032e15.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypo

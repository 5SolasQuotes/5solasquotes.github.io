<main class="wrap"><figure class="quote" id="q-e6e2269197" data-kw="">
<blockquote><p>Given that the law is the purveyor of death, when it reveals sin and the wrath of God against sin, it is not a message of grace or mercy but of the horrible wrath of God against sin, as the words of the law echo: “Cursed is the one who has not kept it all.” The law promises grace, peace and happiness only to those who keep it all perfectly.

The preaching of the gospel sounds another note entirely: “Come to me all you who labour and are heavy laden, and I will give you rest.” Therefore the word of grace is the exact opposite of the law and all its works and merits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/georg-major.html">Georg Major</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentarius in Divi Pauli Epistolam ad Ephesios</cite>, (Wittenberg, 1552). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4722776abd" data-kw="">
<blockquote><p>This law, as unto the substance of it, was the only law of creation, the rule of the first covenant of works; for it contained the sum and substance of that obedience which is due unto God from all rational creatures made in his image, and nothing else. It was the whole of what God designed in our creation unto his own glory and our everlasting blessedness. What was in the tables of stone was nothing but a transcript of what was written in the heart of man originally; and which is returned thither again by the grace of the new covenant, Jer. xxxi. 33; 2 Cor. iii. 3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. W. H. Goold (1680; 7 vols, Edinburgh: Johnston and Hunter, 1854), 6: 215.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-33ea9cbf74" data-kw="">
<blockquote><p>Hence, also, we see the error of those who, in comparing the Law with the Gospel, represent it merely as a comparison between the merit of works, and the gratuitous imputation of righteousness. This is indeed a contrast not at all to be rejected. For Paul often means by the term “law” the rule of righteous living by which God requires of us what is his own, giving us no hope of life unless we completely obey him, and adding on the other hand a curse if we deviate even in the slightest degree. This Paul does when he contends that we pleasing to God through grace and accounted righteous through his pardon, because nowhere is found that observance of the law for which the reward has been promised. Paul therefore justly makes contraries of the righteousness of the law and that of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.9.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-c604a8f512" data-kw="">
<blockquote><p>I am Jehovah.” This name expresses, fundamentally, self-existence, and therefore conveys the idea that he to whom it belongs is the author of all finite being. The people to whom the law is given are hereby reminded that they are the creatures of God, living, moving, having their being in him, and that this absolute physical dependence involves an absolute moral dependence also.

This name serves to show that this law was not given to the Hebrews, as Hebrews, but as men, and, consequently, that it belongs not to those elements of the Mosaic institute which are provisional and temporary, but to those which are permanent and eternal. The sum of this law is love; and love to God is absolutely essential to the perfection and happiness of men. The law has been dispensed under many different forms, but in its essence it is as immutable as the nature of God and the relation of creature to creator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moral Law in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><figure class="quote" id="q-2e65c72609" data-kw="">
<blockquote><p>We may observe this Rule, That the Affirmative Commands include in them the Prohibition of the contrary Sin; and the Negative Commands include the Injunction of the contrary Duty: for it is necessary that the contrary to what is forbidden, must be commanded; and again, the contrary to what is commanded, must be forbidden: As for instance, God in the third Commandment, forbids the taking of his Name in vain, therefore by consequence the hallowing and sanctifying his Name is therein commanded. The Fourth requires the sanctifying of the Sabbath-day; therefore it surely followeth, that the Prophanation of its is thereby forbidden. The Fifth commands us to Honor our Parents; therefore it forbids us to be Disobedient or Injurious to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), p. 25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

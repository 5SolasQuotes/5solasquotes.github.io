</figure><figure class="quote" id="q-cdaa6f68f9" data-kw="">
<blockquote><p>Calvin says, ‘The thing before judged was cleared to the people.’ Peter Martyr, [David] Pareus and others say well, ‘Excommunication would not be done nisi plebe consentiente,’ without the consent of the people, which includes women and servants over whose consciences, faith and practice rulers are not to domineer more than over the consciences of men. Cyprian by the plebs and universa fraternitas, the people and fraternity, understands the whole redeemed flock, men and women.</p></blockquote>

</figure><figure class="quote" id="q-968fa83779" data-kw="">
<blockquote><p>The power of order alone shall make the difference betwixt the pastor and the ruling elder; for by the power of order, the pastor does preach the Word, minister the sacraments, pray in public, bless the congregation, celebrate marriage, which the ruling elder cannot.</p></blockquote>

</figure><figure class="quote" id="q-10d875f233" data-kw="">
<blockquote><p>If Paul is not referring to the wives of elders and deacons, and is not referring to women deacons in the same office as men deacons, then… The most logical and natural alternative would be to regard ‘women’ as referring to the servant-widow class that assists the deacons by ministering to the needs of women. [Hendricksen:] ‘… he regards these women as the deacons’ assistants in helping the poor and needy, etc. These are women who render auxiliary service, performing ministries for which women are better adapted…’… The interpretation of 1 Timothy 3:11 as referring to ‘women’ who assist the deacons who belong to the order of widows described in 1 Timothy 5:9ff. is also exegetically superior to the ‘women in the same office’ view when the broader contextual matters are considered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-schwertley.html">Brian Schwertley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>II. ‘The Biblical Evidence’, pp. 57-62 in A Historical &amp; Biblical Examination of Women Deacons</cite>, pp. 60-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

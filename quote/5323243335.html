<main class="wrap"><figure class="quote" id="q-5323243335" data-kw="">
<blockquote><p>…given the teaching of Scripture, no other answer is possible. For over and over it presents the state of humiliation as the way and the means by which alone Christ can attain his exaltation (Isa. 53:10-12; Mt. 23:12; Lk. 24:26; Jn. 10:17; 17:4-5; Phil. 2:9; Heb. 2:10; 12:2)… Especially the Letter to the Hebrews repeatedly puts a heavy accent on this meritorious connection between Christ’s humiliation and exaltation (1:3; 2:9-10; 5:7-10; 10:12; 12:2)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, (Baker, 2006), 3:432-436, p. 434</span></figcaption>

</figure><figure class="quote" id="q-76f840e0cf" data-kw="">
<blockquote><p>We cannot by our best works merit pardon of sin or eternal life at the hand of God, by reason of the great disproportion that is between them and the glory to come, and the infinite distance that is between us and God, whom by them we can neither profit nor satisfy for the debt of our former sins; but when we have done all we can, we have done but our duty, and are unprofitable servants (Rom. 3:20; Eph. 2:8–9; Rom. 4:6).</p></blockquote>

</figure><figure class="quote" id="q-289bf00ef4" data-kw="">
<blockquote><p>By his good works the just man may merit for himself many graces and favours, not, however, by right and justice (de condigno), but only congruously (de congruo). Most theologians incline to the opinion that the grace of final perseverance is among the objects of congruous merit, which grace, as has been shown above, is not and cannot be merited condignly.</p></blockquote>

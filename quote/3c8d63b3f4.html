</figure><figure class="quote" id="q-89a86161ba" data-kw="">
<blockquote><p>Although there is much evidence for the practice of female veiling in the Classical world it has for the most part been ignored. Evidence for the veiling of Roman women is found in many sources. Ancient lexicographers list many names for veils that these women wore. Each of these veils was particular to the context in which they were worn and by whom they were worn. The plenitude of veiling terminology as well as the specialized nature of these veils alerts the reader to the importance that the Romans attributed to the veil, suggesting that it formed an important part of their culture and this is described in visual and literary terms by ancient artists and writers. … The practice of veiling is therefore viewed by the Romans in a positive light, and its disruption is understood by them as a cause for concern. This concern was especially apparent during the late republic. The dissolution of the traditional forms of government was in some ways problematized in terms of gender, with women’s abandonment of their traditional roles and their incursion into the public sphere being of specific importance. In order to remedy this, attempts were made by the new regime of Augustus to promote a return to what were seen to be traditional gender relations. This programme of moral reform made use of both formal, legalistic decree (the Julian marriage laws) and more propagandistic constructions (the public works of art). In this process traditional symbols assumed a high degree of salience. Because of its power to signify the beneficial and appropriate status of the female body, one of the most important of these symbols was the veil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lydia-lenore-veronica-matthews.html">Lydia Lenore Veronica Matthews</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conspicuous Concealment: an Investigation into the Veiling of Roman Women, with Special Reference to the Time of Augustus MA thesis (University of KwaZulu-Natal, 2007) 225 pp. Pictures are on</cite>, pp. 149-204</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>Those who speak out more plainly than bishop [David] Lindsay [d. 1641], do here object to us that reverence is due to the sacrament, and that we ourselves do reverence it when we sit uncovered at the receiving of it. But Didoclavius [the Scottish presbyterian, David Calderwood] does well distinguish betwixt veneration and adoration (Altare Damascenum, 1623, p. 809), because in civility we use to be uncovered, even to inferiors and equals for the regard which we bear to them, yet do we not worship them, as we worship the king on our knees. As, then, in civility there is a respect and reverence different from adoration, so it is in religion also. Yea [Cardinal Robert] Bellarmine himself distinguishes the reverence which is due to holy things from adoration. Paybody and Dr. Burgess [Formalists] will by no means admit this distinction betwixt veneration and adoration. But since neither of them has alleged any reason against it, I hope they will be weighed down by the authority of the [Romanist] Archbishop of Spalato [d. 1624], and the [Scottish] bishop of Edinburgh [David Lindsay], both of which agree to this distinction. So, then, we give no adoration at all to the sacrament, because neither by any outward nor inward action do we perform any worship for the honor of the same. Burgess himself has noted to us that the first Nicene Council exhorts that men should not be humiliter intenti [basely stretched out] to the things before them. We neither submit our minds nor humble our bodies to the sacrament, yet do we render to it veneration, for as much as we esteem highly of it as a most holy thing, and meddle reverently with it, without all contempt or unworthy usage. Res profecto inanimatae [Surely inanimate things], says the Archbishop of Spalato, sint sacrae quantum placet, alium honorem a nobis non merentur, nisi in sensu negativo [may be sacred so far as it may be fitting, not being deserving of another honor from us except in a negative sense], as that they be not contemned, nor unworthily handled. If it be said that we ought not to contemn the Word, yet has it not that respect given to it which the sacrament has, at which we are uncovered, so that this veneration given to the sacrament must be somewhat more than non prophanatio [a non-profanation]; I answer: as honor in the positive sense, so also in the negative, has various degrees: and according to the more or less immediate manifestation of divine ordinances to us, so ought the degrees of our veneration to be intended or remitted; which is not so to be understood as if one part of God’s sacred worship were to be less contemned then another (for none of God’s most holy ordinances may be in any sort contemned), but that for the greater regard of those things which are more immediately divine, we are not in the usage of them to take to ourselves so much scope and liberty as otherwise we may lawfully allow to ourselves in meddling with such things as are not merely, but mixedly divine, and which are not from God so immediately as the other, but more by the intervention of means. And thus a higher degree of veneration is due to the sacrament than to the Word preached, not by taking ought from the Word, but by adding more respect to the sacrament than the Word has. The reason hereof is given to be this, because when we come to the sacrament, nihil hic humanum, sed Divina omnia [nothing of this is of man, but is all divine], for Christ’s own Words are, or at least should be, spoken to us when we receive the sacrament, and the elements also are by Christ’s own institution holy symbols of his blessed body and blood. Whereas the Word preached to us is but mixedly and mediately divine, and because of this intervention of the ministry of men, and mixture of their conceptions with the holy Scriptures of God, we are bidden try the spirits [1 Jn. 4:1] and are required after the example of the Bereans to search the Scriptures daily whether these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached. But others (I hear) object that if a man should uncover his head at the sight of a graven image, we would account this to be an adoring of the image; and why then shall not we call our uncovering at the sacrament adoration also? Answer: Though veneration and adoration be distinguished in holy things, to show that adoration given to them is idolatry, but veneration given to them is not idolatry, yet in profane things, such as images are, veneration given to them is idolatry as well as adoration: and we are idolaters for doing so much as to respect and reverence them, as things sacred or holy. For as I touched [upon] before, and as Zanchi evidences by sundry instances (bk. 1, de Viti. ext. cult. oppos., cols. 504-5), idolatry is committed when more estimation is had of anything, more dignity and excellency placed in it, and more regard had to it, than God allows, or than can stand with God’s revealed will. For a thing thus regarded, though it be not exalted, ut Deus simpliciter [as God simply], yet it is set up, tanquam Deus ex parte [like as unto God in some degree].</p></blockquote>

her these things which we hear preached be so or not. Now we are not in like sort to try the elements and the words of the institution, whether they be of God or not, because this is sure to all who know out of Scripture the first principles of the oracles of God. The consideration hereof warns us that the sacrament given according to Christ’s institution is more merely and immediately divine than is the Word preached. But others (I hear) object that if a man should uncover his head at the sight of a graven image, we would account this to be an adoring of the image; and why then shall not we call our uncovering at the sacrament adoration also? Answer: Though veneration and adoration be distinguished in holy things, to show that adoration given to them is idolatry, but veneration given to them is not idolatry, yet in profane things, such as images are, veneration given to them is idolatry as well as adoration: and we are idolaters for doing so much as to respect and reverence them, as things sacred or holy. For as I touched [upon] before, and as Zanchi evidences by sundry instances (bk. 1, de Viti. ext. cult. oppos., cols. 504-5), idolatry is committed when more estimation is had of anything, more dignity and excellency placed in it, and more regard had to it, than God allows, or than can stand with God’s revealed will. For a thing thus regarded, though it be not exalted, ut Deus simpliciter [as God simply], yet it is set up, tanquam Deus ex parte [like as unto God in some degree].”

nder+to+it+veneration%2C+for+as+much+as+we+esteem+highly+of+it+as+a+most+holy+thing%2C+and+meddle+reverently+with+it%2C+without+all+contempt+or+unworthy+usage.+Res+profecto+inanimatae+%5BSurely+inanimate+things%5D%2C+says+the+Archbishop+of+Spalato%2C+sint+sacrae+quantum+placet%2C+alium+honorem+a+nobis+non+merentur%2C+nisi+in+sensu+negativo+%5Bmay+be+sacred+so+far+as+it+may+be+fitting%2C+not+being+deserving+of+another+honor+from+us+except+in+a+negative+sense%5D%2C+as+that+they+be+not+contemned%2C+nor+unworthily+handled.+If+it+be+said+that+we+ought+not+to+contemn+the+Word%2C+yet+has+it+not+that+respect+given+to+it+which+the+sacrament+has%2C+at+which+we+are+uncovered%2C+so+that+this+veneration+given+to+the+sacrament+must+be+somewhat+more+than+non+prophanatio+%5Ba+non-profanation%5D%3B+I+answer%3A+as+honor+in+the+positive+sense%2C+so+also+in+the+negative%2C+has+various+degrees%3A+and+according+to+the+more+or+less+immediate+manifestation+of+divine+ordinances+to+us%2C+so+ought+the+degrees+of+our+veneration+to+be+intended+or+remitted%3B+which+is+not+so+to+be+understood+as+if+one+part+of+God%E2%80%99s+sacred+worship+were+to+be+less+contemned+then+another+%28for+none+of+God%E2%80%99s+most+holy+ordinances+may+be+in+any+sort+contemned%29%2C+but+that+for+the+greater+regard+of+those+things+which+are+more+immediately+divine%2C+we+are+not+in+the+usage+of+them+to+take+to+ourselves+so+much+scope+and+liberty+as+otherwise+we+may+lawfully+allow+to+ourselves+in+meddling+with+such+things+as+are+not+merely%2C+but+mixedly+divine%2C+and+which+are+not+from+God+so+immediately+as+the+other%2C+but+more+by+the+intervention+of+means.+And+thus+a+higher+degree+of+veneration+is+due+to+the+sacrament+than+to+the+Word+preached%2C+not+by+taking+ought+from+the+Word%2C+but+by+adding+more+respect+to+the+sacrament+than+the+Word+has.+The+reason+hereof+is+given+to+be+this%2C+because+when+we+come+to+the+sacrament%2C+nihil+hic+humanum%2C+sed+Divina+omnia+%5Bnothing+of+this+is+of+man%2C+but+is+all+divine%5D%2C+for+Christ%E2%80%99s+own+Words+are%2C+or+at+least+should+be%2C+spoken+to+us+when+we+receive+the+sacrament%2C+and+the+elements+also+are+by+Christ%E2%80%99s+own+institution+holy+symbols+of+his+blessed+body+and+blood.+Whereas+the+Word+preached+to+us+is+but+mixedly+and+mediately+divine%2C+and+because+of+this+intervention+of+the+ministry+of+men%2C+and+mixture+of+their+conceptions+with+the+holy+Scriptures+of+God%2C+we+are+bidden+try+the+spirits+%5B1+Jn.+4%3A1%5D+and+are+required+after+the+example+of+the+Bereans+to+search+the+Scriptures+daily+whether+these+things+which+we+hear+preached+be+so+or+not.+Now+we+are+not+in+like+sort+to+try+the+elements+and+the+words+of+the+institution%2C+whether+they+be+of+God+or+not%2C+because+this+is+sure+to+all+who+know+out+of+Scripture+the+first+principles+of+the+oracles+of+God.+The+consideration+hereof+warns+us+that+the+sacrament+given+according+to+Christ%E2%80%99s+institution+is+more+merely+and+immediately+divine+than+is+the+Word+preached.+But+others+%28I+hear%29+object+that+if+a+man+should+uncover+his+head+at+the+sight+of+a+graven+image%2C+we+would+account+this+to+be+an+adoring+of+the+image%3B+and+why+then+shall+not+we+call+our+uncovering+at+the+sacrament+adoration+also%3F+Answer%3A+Though+veneration+and+adoration+be+distinguished+in+holy+things%2C+to+show+that+adoration+given+to+them+is+idolatry%2C+but+veneration+given+to+them+is+not+idolatry%2C+yet+in+profane+things%2C+such+as+images+are%2C+veneration+given+to+them+is+idolatry+as+well+as+adoration%3A+and+we+are+idolaters+for+doing+so+much+as+to+respect+and+reverence+them%2C+as+things+sacred+or+holy.+For+as+I+touched+%5Bupon%5D+before%2C+and+as+Zanchi+evidences+by+sundry+instances+%28bk.+1%2C+de+Viti.+ext.+cult.+oppos.%2C+cols.+504-5%29%2C+idolatry+is+committed+when+more+estimation+is+had+of+anything%2C+more+dignity+and+excellency+placed+in+it%2C+and+more+regard+had+to+it%2C+than+God+allows%2C+or+than+can+stand+with+God%E2%80%99s+revealed+will.+For+a+thing+thus+regarded%2C+though+it+be+not+exalted%2C+ut+Deus+simpliciter+%5Bas+God+simply%5D%2C+yet+it+is+set+up%2C+tanquam+Deus+ex+parte+%5Blike+as+unto+God+in+some+degree%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29+%7C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99+%7C+ch.+4%2C+%E2%80%98That+the+ceremonies+are+idols+among+Formalists+themselves%3B+and+that+kneeling+in+the+Lord%E2%80%99s+Supper+before+the+Bread+%26+Wine+in+the+act+of+receiving+them+is+formally+idolatry%E2%80%99%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa377dddf14.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a377dddf14.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=Those%20who%20speak%20out%20more%20plainly,as%20unto%20God%20in%20some%20degree&amp;text=Those%20who%20speak%20out%20more%20plainly%20than%20bishop&amp;text=parte%20%5Blike%20as%20unto%20God%20in%20some%20degree" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I rather think, with the learned Cappellus, that this apostolical prescript or canon of good order was founded upon some civil custom then obtaining among the Corinthians and elsewhere; from whence he concludes that according to the difference of several countries, such an habit and deportment is to be used in divine service which is commonly used to express reverence and decency in conversation. … (He, that will see the different customs of nations in this matter, both in and out of sacred uses, may consult Grotius and Cappellus at large on the place.)</p></blockquote>

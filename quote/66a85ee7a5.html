<blockquote><p>[2 Corinthians 1] Vers. 24. Not for that we have dominion over your Faith, but are helpers of your joy: for by Faith ye stand.

Hence arises another Objection: Therefore thou makest thy self Lord of our Faith, as if thou couldest punish when thou wouldst. He answers by denying any Mastery, affirming the power of his Ministry, and that to be employed to the benefit of the Church, that timely Censures, according to the Will of Christ, being used, those that repented might at length rejoice: He gives an account why he denied any dominion over their Faith, because Faith is the bond of conjunction with Christ, by which Faith we stand fast in the Grace of God, in right and title unto Christ, in the possession of things present, and in hopes of future good things: Therefore Faith admits no Lord, besides God; it admits of men only as Ministers, and helpers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 73.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>19. 4. Although the day be wholly to be dedicated to the ends of a sacred rest before insisted on, yet, 1. Duties in their performance drawn out to such a length as to beget wearisomeness and satiety, tend not to edification, nor do any way promote the sanctification of the name of God in the worship itself. Regard, therefore, in all such performances is to be had:

1. Unto the weakness of the natural constitution of some, the infirmities and indispositions of others, who are not able to abide in the outward part of duties, as others can. And there is no wise shepherd but will rather suffer the stronger sheep of his flock to lose somewhat of what they might reach to in his guidance of them, than to compel the weaker to keep pace with them to their hurt, and it may be their ruin. Better a great number should complain of the shortness of some duties, who have strength and desires for a longer continuance in them, than that a few who are sincere should be really discouraged by being overburdened, and have the service thereby made useless unto them. I always loved in sacred duties that observation of Seneca concerning the orations of Cassius Severus, when they heard him, ‘Timebamus ne desineret,’ ‘We were afraid that he would end.’

2. To the spiritual edge of the affections of men, which ought to be whetted, and not through tediousness in duties abated and taken off.</p></blockquote>

<blockquote><p>It has often been said that the Puritans and Covenanters were strict Sabbatarians, while the continental Reformers took a more relaxed attitude to the Lord’s Day, even allowing people to indulge in recreation. Henry Bullinger, however, challenges this assumption:

They transgress this commandment, that cease not from evil works, but abuse the sabbath’s rest to the provoking of fleshly pleasures. For they keep the Sabbath to God, but work to the devil, in dicing, in drinking, in dancing, and feeding their humours with the vanities of this world, whereby we are not drawn from the company of the holy congregation, but do also defile our bodies, which we ought rather to sanctify and keep holy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 262.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>§16. Rule 5. If I vow that I will do some duty better, I am not thereby disobliged from doing it at all when I am disabled from doing it better. Suppose a magistrate seeing much amiss in Church and commonwealth, does vow a reformation and vow against the abuses which he finds; If now the people’s obstinacy and rebellion disable him to perform that vow, it does not follow that he must lay down his scepter and cease to govern them at all because he cannot do it as he ought, if he were free. So if the pastors of any Church do vow the reformation of Church abuses, in their places, if they be hindered by their rulers, or by the people, it does not follow that they must lay down their callings and not worship God publicly at all because they cannot do it as they would and ought if they were free, as long as they may worship him without committing any sin. God’s first obligation on me is to worship Him, and the second for the manner, to do it as near his order as I can: Now if I cannot avoid the imperfections of worship, though I vowed it, I must not therefore avoid the worship itself (as long as corruptions destroy not the very nature of it and I am put myself upon no actual sin). For I was bound to worship God before my vows, and in order of nature before my obligation de modo: And my vow was made with an implied condition, that the thing were possible and lawful: And when that ceases to be possible or lawful which I vowed, I must nevertheless do that which still remains possible and lawful. To give over God’s solemn worship with the Church is no reformation. To prefer no worship before imperfect worship is a greater deformation and corruption than to prefer imperfect worship before that which is more perfect. And to prefer a worship imperfect in the manner, before no church worship at all, is a greater reformation than to prefer a more perfect manner of worship before a more imperfect and defective. To worship God decently and in order, supposes that He must be worshipped: And he that does not worship at all, does not worship Him decently. If a physician vow that he will administer a certain effectual antidote to all his patients that have the plague, and that he will not administer a certain less effectual preparation, which some apothecaries through covetousness or carelessness had brought into common use, to the injury of the sick: His vow is to be interpreted with these exceptions, ‘I will do it if I can, without dishonesty or a greater mischief: I will not administer the sophisticated antidote when I can have better: I vow this for my patients benefit and not for their destruction.’ Therefore if the sophisticated antidote is much better than none, and may save men’s lives, and the patients grow wilful and will take no other, or authority forbid the use of any other, the physicion is neither bound to forsake his calling rather than use it, nor to neglect the life of his patients: (If their lives indeed lie upon his care and they may not be in some good hopes without him, and the good of many require him not to neglect a few): But he must do what he can when he cannot do what he would, and only show that he consents not to the sophistication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: White, 1673), pt. 3, ch. 5, title 2, pp. 703-4</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§16. Rule 5. If I vow that I will do some duty better, I am not thereby disobliged from doing it at all when I am disabled from doing it better. Suppose a magistrate seeing much amiss in Church and commonwealth, does vow a reformation and vow against the abuses which he finds; If now the people’s obstinacy and rebellion disable him to perform that vow, it does not follow that he must lay down his scepter and cease to govern them at all because he cannot do it as he ought, if he were free. So if the pastors of any Church do vow the reformation of Church abuses, in their places, if they be hindered by their rulers, or by the people, it does not follow that they must lay down their callings and not worship God publicly at all because they cannot do it as they would and ought if they were free, as long as they may worship him without committing any sin. God’s first obligation on me is to worship Him, and the second for the manner, to do it as near his order as I can: Now if I cannot avoid the imperfections of worship, though I vowed it, I must not therefore avoid the worship itself (as long as corruptions destroy not the very nature of it and I am put myself upon no actual sin). For I was bound to worship God before my vows, and in order of nature before my obligation de modo: And my vow was made with an implied condition, that the thing were possible and lawful: And when that ceases to be possible or lawful which I vowed, I must nevertheless do that which still remains possible and lawful. To give over God’s solemn worship with the Church is no reformation. To prefer no worship before imperfect worship is a greater deformation and corruption than to prefer imperfect worship before that which is more perfect. And to prefer a worship imperfect in the manner, before no church worship at all, is a greater reformation than to prefer a more perfect manner of worship before a more imperfect and defective. To worship God decently and in order, supposes that He must be worshipped: And he that does not worship at all, does not worship Him decently. If a physician vow that he will administer a certain effectual antidote to all his patients that have the plague, and that he will not administer a certain less effectual preparation, which some apothecaries through covetousness or carelessness had brought into common use, to the injury of the sick: His vow is to be interpreted with these exceptions, ‘I will do it if I can, without dishonesty or a greater mischief: I will not administer the sophisticated antidote when I can have better: I vow this for my patients benefit and not for their destruction.’ Therefore if the sophisticated antidote is much better than none, and may save men’s lives, and the patients grow wilful and will take no other, or authority forbid the use of any other, the physicion is neither bound to forsake his calling rather than use it, nor to neglect the life of his patients: (If their lives indeed lie upon his care and they may not be in some good hopes without him, and the good of many require him not to neglect a few): But he must do what he can when he cannot do what he would, and only show that he consents not to the sophistication.”

— Richard Baxter, A Christian Directory, or a Sum of Practical Theology, ... (London: White, 1673), pt. 3, ch. 5, title 2, pp. 703-4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A716.+Rule+5.+If+I+vow+that+I+will+do+some+duty+better%2C+I+am+not+thereby+disobliged+from+doing+it+at+all+when+I+am+disabled+from+doing+it+better.+Suppose+a+magistrate+seeing+much+amiss+in+Church+and+commonwealth%2C+does+vow+a+reformation+and+vow+against+the+abuses+which+he+finds%3B+If+now+the+people%E2%80%99s+obstinacy+and+rebellion+disable+him+to+perform+that+vow%2C+it+does+not+follow+that+he+must+lay+down+his+scepter+and+cease+to+govern+them+at+all+because+he+cannot+do+it+as+he+ought%2C+if+he+were+free.+So+if+the+pastors+of+any+Church+do+vow+the+reformation+of+Church+abuses%2C+in+their+places%2C+if+they+be+hindered+by+their+rulers%2C+or+by+the+people%2C+it+does+not+follow+that+they+must+lay+down+their+callings+and+not+worship+God+publicly+at+all+because+they+cannot+do+it+as+they+would+and+ought+if+they+were+free%2C+as+long+as+they+may+worship+him+without+committing+any+sin.+God%E2%80%99s+first+obligation+on+me+is+to+worship+Him%2C+and+the+second+for+the+manner%2C+to+do+it+as+near+his+order+as+I+can%3A+Now+if+I+cannot+avoid+the+imperfections+of+worship%2C+though+I+vowed+it%2C+I+must+not+therefore+avoid+the+worship+itself+%28as+long+as+corruptions+destroy+not+the+very+nature+of+it+and+I+am+put+myself+upon+no+actual+sin%29.+For+I+was+bound+to+worship+God+before+my+vows%2C+and+in+order+of+nature+before+my+obligation+de+modo%3A+And+my+vow+was+made+with+an+implied+condition%2C+that+the+thing+were+possible+and+lawful%3A+And+when+that+ceases+to+be+possible+or+lawful+which+I+vowed%2C+I+must+nevertheless+do+that+which+still+remains+possible+and+lawful.+To+give+over+God%E2%80%99s+solemn+worship+with+the+Church+is+no+reformation.+To+prefer+no+worship+before+imperfect+worship+is+a+greater+deformation+and+corruption+than+to+prefer+imperfect+worship+before+that+which+is+more+perfect.+And+to+prefer+a+worship+imperfect+in+the+manner%2C+before+no+church+worship+at+all%2C+is+a+greater+reformation+than+to+prefer+a+more+perfect+manner+of+worship+before+a+more+imperfect+and+defective.+To+worship+God+decently+and+in+order%2C+supposes+that+He+must+be+worshipped%3A+And+he+that+does+not+worship+at+all%2C+does+not+worship+Him+decently.+If+a+physician+vow+that+he+will+administer+a+certain+effectual+antidote+to+all+his+patients+that+have+the+plague%2C+and+that+he+will+not+administer+a+certain+less+effectual+preparation%2C+which+some+apothecaries+through+covetousness+or+carelessness+had+brought+into+common+use%2C+to+the+injury+of+the+sick%3A+His+vow+is+to+be+interpreted+with+these+exceptions%2C+%E2%80%98I+will+do+it+if+I+can%2C+without+dishonesty+or+a+greater+mischief%3A+I+will+not+administer+the+sophisticated+antidote+when+I+can+have+better%3A+I+vow+this+for+my+patients+benefit+and+not+for+their+destruction.%E2%80%99+Therefore+if+the+sophisticated+antidote+is+much+better+than+none%2C+and+may+save+men%E2%80%99s+lives%2C+and+the+patients+grow+wilful+and+will+take+no+other%2C+or+authority+forbid+the+use+of+any+other%2C+the+physicion+is+neither+bound+to+forsake+his+calling+rather+than+use+it%2C+nor+to+neglect+the+life+of+his+patients%3A+%28If+their+lives+indeed+lie+upon+his+care+and+they+may+not+be+in+some+good+hopes+without+him%2C+and+the+good+of+many+require+him+not+to+neglect+a+few%29%3A+But+he+must+do+what+he+can+when+he+cannot+do+what+he+would%2C+and+only+show+that+he+consents+not+to+the+sophistication.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%2C+or+a+Sum+of+Practical+Theology%2C+...+%28London%3A+White%2C+1673%29%2C+pt.+3%2C+ch.+5%2C+title+2%2C+pp.+703-4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F01a37ede3e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/01a37ede3e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=16.%20Rule%205.%20If%20I%20vow,he%20consents%20not%20to%20the%20sophistication&amp;text=16.%20Rule%205.%20If%20I%20vow%20that%20I&amp;text=show%20that%20he%20consents%20not%20to%20the%20sophistication" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

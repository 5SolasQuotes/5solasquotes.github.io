<main class="wrap"><figure class="quote" id="q-9a918b2c43" data-kw="">
<blockquote><p>Aquinas affirms that the celebration of the Eucharist is called the immolation of Christ for two reasons: because it is, ‘a kind of representative image of the passion of Christ,’ and because the, ‘effects of the passion of Christ’ are received in it. This no one on our side contradicts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Adversus axioma catholicum in Nicholas Thompson, Eucharistic Sacrifice Pre</cite>, (Brill, 2005), p. 185</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“Aquinas affirms that the celebration of the Eucharist is called the immolation of Christ for two reasons: because it is, ‘a kind of representative image of the passion of Christ,’ and because the, ‘effects of the passion of Christ’ are received in it. This no one on our side contradicts.”

— Martin Bucer, Adversus axioma catholicum in Nicholas Thompson, Eucharistic Sacrifice Pre (Brill, 2005), p. 185">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAquinas+affirms+that+the+celebration+of+the+Eucharist+is+called+the+immolation+of+Christ+for+two+reasons%3A+because+it+is%2C+%E2%80%98a+kind+of+representative+image+of+the+passion+of+Christ%2C%E2%80%99+and+because+the%2C+%E2%80%98effects+of+the+passion+of+Christ%E2%80%99+are+received+in+it.+This+no+one+on+our+side+contradicts.%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+Adversus+axioma+catholicum+in+Nicholas+Thompson%2C+Eucharistic+Sacrifice+Pre+%28Brill%2C+2005%29%2C+p.+185&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9a918b2c43.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9a918b2c43.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-lords-supper#:~:text=Aquinas%20affirms%20that%20the%20celebration%20of,no%20one%20on%20our%20side%20contradicts&amp;text=Aquinas%20affirms%20that%20the%20celebration%20of%20the%20Eucharist&amp;text=it.%20This%20no%20one%20on%20our%20side%20contradicts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7e015e2e86" data-kw="">
<blockquote><p>As for the rest of the testimonies Dr. Burgess produces out of the Fathers for kneeling, I need not insist upon them for either they speak of the inward adoration of the heart, which we ought to direct unto Christ when we receive the Sacrament (and this none of us denies), or else they speak of adoring the sacrament: where by the word ‘adoration’ we may not understand any divine worship, inward or outward, but a reverence of another nature, called veneration. That this (which we deny not neither) and no more is meant by the Fathers when they speak of the adoration of the sacrament, Antonius de Dominis shows more copiously (Rep. Eccl., bk. 5, ch. 6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), 3rd Part, ‘Against the Lawfulness of the Ceremonies’, ch. 4, ‘That the Ceremonies are Idols among Formalists themselves; &amp; that kneeling in the Lord’s Supper before the Bread &amp; Wine in the act of receiving them is formally Idolatry’, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>
<div class="actions"><button class="copy" data-copy="“As for the rest of the testimonies Dr. Burgess produces out of the Fathers for kneeling, I need not insist upon them for either they speak of the inward adoration of the heart, which we ought to direct unto Christ when we receive the Sacrament (and this none of us denies), or else they speak of adoring the sacrament: where by the word ‘adoration’ we may not understand any divine worship, inward or outward, but a reverence of another nature, called veneration. That this (which we deny not neither) and no more is meant by the Fathers when they speak of the adoration of the sacrament, Antonius de Dominis shows more copiously (Rep. Eccl., bk. 5, ch. 6).”

ed Books Online</a></div>
</figure><figure class="quote" id="q-8bc547c3df" data-kw="">
<blockquote><p>The Church-Government of which I here speak [and argue for], is a Church-government in its morals: To exclude those things that are merely physical and human in this government, as a pulpit of this or that matter, stone or timber, or of this timber, or of any other kind; a communion-table of this, or that form; a cup of wood, or of metal, as silver, tin, etc…. but what sort of river the water of baptism be, is merely physical, not moral.</p></blockquote>

</figure><figure class="quote" id="q-ffa696fb07" data-kw="">
<blockquote><p>Mr. Sprint [an opponent] himself lays down one ground which proves the refusing of inconvenient ceremonies to be a greater duty than the preaching of the Word: for he holds that the substantials of the Second Table do overrule the ceremonials of the First Table, according to that which God says, ‘I will have mercy and not sacrifice,’ (Mt. 12:7). And elsewhere he teaches that to tend a sick person ready to die is a greater duty than the hearing of the Word. Now to practice inconvenient and scandalous ceremonies is to commit soul-murder, and so to break one of the most substantial duties of the Second Table. Therefore, according to Mr. Sprint’s own ground, the refusing of inconvenient and scandalous ceremonies is a greater duty than the preaching of the Word, which is but a ceremonial of the First Table, and if the neglect of tending a sick person’s body be a greater sin than to omit the hearing of many sermons, much more to murder the souls of men by practicing inconvenient and scandalous ceremonies, is a greater sin than to omit the preaching of many sermons, which is all the omission (if there be any) of those who suffer deprivation for refuising to conform unto inconvenient ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 1, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

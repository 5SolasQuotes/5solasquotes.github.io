<blockquote><p>Dost thou love God so much, and hate sin with such a perfect hatred, that thou darest not think of going to hell for ten thousand worlds, if it were no more but for fear of blaspheming the holy name of God, under the terrors of these tormenting pains, where these damned creatures “are scalded with fire, and their worm dieth not.” They have no other thing to do, neither are they capable of doing any other thing in hell but sinning against God perpetually, though they have no pleasure in it, but on the contrary tormenting pains, under the wrath of God; and this makes them continually blaspheme His holy name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bruce.html">Michael Bruce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon I in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>

<blockquote><p>[We reject the errors of those] Who teach: That Christ by His satisfaction merited neither salvation itself for any one, nor faith, whereby this satisfaction of Christ unto salvation is effectually appropriated; but that He merited for the Father only the authority or the perfect will to deal again with man, and to prescribe new conditions as He might desire, obedience to which, however, depended on the free will of man, so that it therefore might have come to pass that either none or all should fulfill these conditions. For these adjudge too contemptuously the death of Christ, in no way acknowledge that most important fruit or benefit thereby gained, and bring again out of hell the Pelagian error. Paragraph 4 [We reject the errors of those] Who teach: That the new covenant of grace, which God the Father, through the mediation of the death of Christ, made with man, does not herein consist that we by faith, in as much as it accepts the merits of Christ, are justified before God and saved, but in the fact that God, having revoked the demand of perfect obedience of faith, regards faith itself and the obedience of faith, although imperfect, as the perfect obedience of the law, and does esteem it worthy of the reward of eternal life through grace. For these contradict the Scriptures, “being justified freely by His grace through the redemption that is in Christ Jesus, whom God set forth as a propitiation by His blood, through faith” (Rom 3:24-25). And these proclaim, as did the wicked Socinius, a new and strange justification of man before God, against the consensus of the whole church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons</cite>, 2nd Head of Doctrine, Rejection of Errors, 9 May, 1619.</span></figcaption>

<blockquote><p>Against claims that John Calvin repudiated the beatific vision and teleological virtue ethics, this article demonstrates the importance of the visio Dei by examining sections of Calvin’s exegesis and several important sermons. To explicate how such a teleology impacts the Christian’s relation to ‘lower goods’, it then explores Augustine’s theology of created being. Together these conversations contribute to an explanation of Calvin’s view of Christian moral life now through growth in virtue and in relation to the hope of seeing or contemplating God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alden-c-mccray.html">Alden C. McCray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Defending ‘Avertive’ Religion</cite>, vol. 82, no. 1 (April 2023), pp. 25-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>

<blockquote><p>Does it belong to the perfection of the soul that we comprehend God’s essence? Response: certainly this does not appear to be the case, and the reason is that what is incomprehensible cannot be comprehended. But, they say, even if what is infinite cannot be comprehended distinctly, nevertheless, it can be comprehended confusedly, and they called this ‘comprehension.’ Thus, that famous phrase: ‘All God is known, but not totally.’ [totum sed non totaliter; this phrase summarizes Thomas, Summa, pt. 1, q. 12, art. 7, replies to objections 2-3] And they bring up the example of an eye, which contemplates the whole man; namely, confusedly, but not totally. Response: There is no comparison between things which come within reach of eyesight and the divine nature… the divine nature is most simple; certainly the soul cannot confusedly comprehend those things which are most simple, let alone the senses, unless it comprehends them in another way than by essence; that is, by laying hold of their very essence. And thus, if God is known by us by essence, it is necessary for him to be known by us distinctly; and if he is known by us distinctly, he is indeed comprehended, which those who state that God will be seen by essence in the life to come do not wish to concede. the axiom common in the schools, “All that is received is received according to the manner of the recipient.” Now, if God’s essence will be seen, it will be seen in a finite way, for the recipient is finite: and thus, the infinite will be seen by essence in a finite way, which implies a contradiction. For finite knowledge is an image of a thing in the mind, and thus, if knowledge is finite, but the thing comprehended is infinite, on the other hand, it follows that the thing is known and not known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Johannes Hoornbeek, ch. 13, §§19-20 of Institutes of Theology, tr. Charles Johnson</span></figcaption>

<blockquote><p>The passing of sentence will take place after the trial of the cause; first, the sentence of acquittal, then that of condemnation; the Judge will begin with the former, to show that he is more willing to pardon than to punish; and to the greater joy of the faithful, and to the greater sorrow of the wicked. It might appear strange to some, that Christ, in describing the kind of judgment which he will exercise at the last day, does not mention any works, except works of mercy towards himself, whereas neither the performance of them can be ascribed to, nor the neglect of them be charged upon, vast numbers of persons who have never heard of Christ; but it has been justly observed, that these are only brought forward by Christ by way of specimen or example, as some good works out of many. There is a question also raised, as to whether the sins of the righteous, as well as of the wicked, will be brought forth to view? We do not think they will; first, because, if they were, it would turn to the confusion of the righteous, who are surely not then to be confounded: again, because the free mercy of Christ will not remember the offences of believers; nor is it likely, that Christ will reproach his own members with their iniquities.</p></blockquote>

— Benedict Pictet, Christian Theology, trans. Frederick Reyroux (Philadelphia: Presbyterian Board of Publication, n.d.), 358.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+passing+of+sentence+will+take+place+after+the+trial+of+the+cause%3B+first%2C+the+sentence+of+acquittal%2C+then+that+of+condemnation%3B+the+Judge+will+begin+with+the+former%2C+to+show+that+he+is+more+willing+to+pardon+than+to+punish%3B+and+to+the+greater+joy+of+the+faithful%2C+and+to+the+greater+sorrow+of+the+wicked.+It+might+appear+strange+to+some%2C+that+Christ%2C+in+describing+the+kind+of+judgment+which+he+will+exercise+at+the+last+day%2C+does+not+mention+any+works%2C+except+works+of+mercy+towards+himself%2C+whereas+neither+the+performance+of+them+can+be+ascribed+to%2C+nor+the+neglect+of+them+be+charged+upon%2C+vast+numbers+of+persons+who+have+never+heard+of+Christ%3B+but+it+has+been+justly+observed%2C+that+these+are+only+brought+forward+by+Christ+by+way+of+specimen+or+example%2C+as+some+good+works+out+of+many.+There+is+a+question+also+raised%2C+as+to+whether+the+sins+of+the+righteous%2C+as+well+as+of+the+wicked%2C+will+be+brought+forth+to+view%3F+We+do+not+think+they+will%3B+first%2C+because%2C+if+they+were%2C+it+would+turn+to+the+confusion+of+the+righteous%2C+who+are+surely+not+then+to+be+confounded%3A+again%2C+because+the+free+mercy+of+Christ+will+not+remember+the+offences+of+believers%3B+nor+is+it+likely%2C+that+Christ+will+reproach+his+own+members+with+their+iniquities.%E2%80%9D%0A%0A%E2%80%94+Benedict+Pictet%2C+Christian+Theology%2C+trans.+Frederick+Reyroux+%28Philadelphia%3A+Presbyterian+Board+of+Publication%2C+n.d.%29%2C+358.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F640502790b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/640502790b.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/10/pictet-on-the-state-of-believers-in-the-judgment/" rel="noopener" target="_blank">Read

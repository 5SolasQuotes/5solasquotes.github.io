<main class="wrap"><figure class="quote" id="q-9f20c02967" data-kw="">
<blockquote><p>When baptism is styled ‘the laver of regeneration,’ the meaning is that to believers is given a testimony of their being regenerated since they are in Christ and are children and heirs of God. Also, when one is said to have his sins washed away by receiving baptism, the meaning is that he receives a testimony that his sins are washed away; and thus that by receiving the seal, he lays aside the consciousness of guilt and publicly professes to give thanks that his sins are forgiven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Explicatio catecheseos Heidelbergensis</cite>, Q. 71. Quoted in Herman Witsius, On the Efficacy and Utility of Baptism in the Case of Elect Infants whose Parents are under the Covenant (1693), trans. William Marshall, ed. J. Mark Beach in Mid-American Journal of Theology, 17 (2006), p. 160.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“When baptism is styled ‘the laver of regeneration,’ the meaning is that to believers is given a testimony of their being regenerated since they are in Christ and are children and heirs of God. Also, when one is said to have his sins washed away by receiving baptism, the meaning is that he receives a testimony that his sins are washed away; and thus that by receiving the seal, he lays aside the consciousness of guilt and publicly professes to give thanks that his sins are forgiven.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f7256acec7" data-kw="">
<blockquote><p>Fourthly, (saith Mr. T[ombes].) Circumcision did sign Canaan; Baptism eternal life. This we have answered to afore, That Circumcision did sign Canaan as it was a type of heaven, Heb. 4. As baptism and the holy Supper under material elements signify and give us things spiritual and eternal. All this while I cannot see such a material difference between Circumcision and Baptism in the least to deface the analogy and semblance between the administration of the one and the other, to believers and their Infants, or to interrupt that consequence from the one to the other. What ever may be urged against the incapacity of children to be Baptized, may as well be argued against Circumcision.

By this that hath been answered candid men may see what reason Mr. T. hath to deny major, or consequence, or minor. If this argument be not restrainedly understood an egg is laid, out of which manifest Judaism may be hatched.

No fear, if we argue as the Apostle argues; who Colossians 2, 11. 12. (as we have cleared we hope) puts Baptism in the room of Circumcision. If we do not put those things in the place one of another, which God puts in (though but by practice and example) without looking for a new institution or command, there being a difference only of circumstances, I am bold to say, an egg is laid out of which may be hatched Antisabbatarianism a nulling of the Lords day, (as is frequent upon this very consequence, among the Anabaptists) and Exemption of women from the holy Supper with many the like inconveniencies, which we stay not now to name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nathanael-holmes.html">Nathanael Holmes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A vindication of baptizing believers infants: In some animadversions upon Mr. Tombes his Exercitations about infant baptism; as also upon his Examen, as touching the antiquities and authors by him alleged or contradicted that concern the same. Humbly submitted to the judgement of all candid Christia</cite>, (London: M. Simmons, 1646), pp 33-34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-c42abdb17f" data-kw="">
<blockquote><p>‘It comes sometime to pass’ (says St. Augustine) ‘that the children of bond-slaves are brought to baptism by their Lord; sometime the parents being dead, the friends alive undertake that office, sometime stangers or virgins consecrated unto God, which neither have, nor can have children of their own, take up infants in the open streets, and so offer them unto baptism, whom the cruelty of unnatural parents casts out, and leaves to the adventure of uncertain pity.’ As therefore he which did the part of a neighbor, was a neighbor to that wounded man whom the parable of the Gospel describes, so they are fathers, although strangers, that bring infants to him which makes them the sons of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Mr. Richard Hooker</cite>, (that learned and judicious divine), in Eight Books of Ecclesiastical Polity… (London, 1666), bk.5, section 64, p. 244 Hooker (1554–1600) was a prominent Anglican apologist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-f2510086ed" data-kw="">
<blockquote><p>The connection between this mention of the promise and the command to repent and be baptized in the preceding verses: “For the promise,” etc. Baptism is here treated as having the same relation to the promise as circumcision hitherto had; and this implies that no fundamental or organic change was about to take place in the church as it was passing from its Jewish to its Christian form, much less that the old church had ceased to exist and a new one was about to begin.

The apostle proceeds on the supposition that the Abrahamic covenant continues in full force, that as it had not been repealed or superseded by the Sinaitic covenant, so it was not repealed or superseded by the Christian dispensation. He takes the same fact for granted in his discourse in the next chapter (verses 22-26), and Paul argues the same point in Gal. iii. and Rom. xi.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Briefs and Sermons on the Acts of the Apostles</cite>, (1875) in Miscellanies of Rev. Thomas E. Peck, D.D., LL.D., Professor of Theology in the Union Theological Seminary in Virginia, ed. T. C. Johnson (3 vols, Richmond VA: The Presbyterian Committee of Publication, 1895-97), 3: 220-21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

The apostle proceeds on the supposition that the Abrahamic covenant continues in full force, that as it had not been repealed or superseded by the Sinaitic covenant, so it was not repealed or superseded by the Christian dispensation. He takes the same fact for granted in his discourse in the next chapter (verses 22-26), and Paul argues the same point in Gal. iii. and Rom. xi.”

enanter</a></div>
</figure><figure class="quote" id="q-8f3efdb373" data-kw="">
<blockquote><p>Baptism is the sacrament of new birth, wherein wherein our adoption by Christ is sealed unto us and we are made the sons of God, as many as believer both sacramentally and spiritually, the unbelievers only sacramentally. Wherefore this is not to be understood as though whosoever is baptized shall therefore be sure to have eternal life.</p></blockquote>

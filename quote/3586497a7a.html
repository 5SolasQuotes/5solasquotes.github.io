<main class="wrap"><figure class="quote" id="q-3586497a7a" data-kw="">
<blockquote><p>…there is a twofold necessity; one absolute, the other conditional. Absolute, that is, when one thing is so necessarily required to another, as that it cannot be without it. Secondly, there is a necessity that is not absolute, but conditional; that is, when one thing is so necessary to another as that it cannot well be without it: of this latter sort, the necessity of this government in the Church of God is: for the Church may be without it in some kind of being, but it cannot have her well-being except this concur.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London, 1631), Lecture 14 Randall (1570–1622) was an English puritan who held that the particular form of Church government is not by divine-right., p. 235</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee6182c452" data-kw="">
<blockquote><p>22. There is no Church on earth so sound and orthodox as to want [lack] no integral part of Christian religion. Proved: There is no man on earth, much less any multitude, so sound as to want no integral part: But all Churches consist only of men; And therefore if all the men be so far defective, all the Churches are so. … All things in Scripture proposed to our faith, hope and practice, are the integrals of our religion: But no Christian understands all these proposals or words of Scripture: Therefore no Christian explicitly believes them all, or practices all. To hold the contrary, is to hold that some Church is perfect in understanding, faith, hope and practice, without ignorance, errour or sin: that is, not to know what a man or a Christian on earth is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), ch. 4, p. 25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-93305f02b0" data-kw="">
<blockquote><p>By the root he [Paul] understands not their nearest parents, who perhaps were wicked; but those first fathers of the Jewish people, Abraham, Isaac, and Jacob, to whom was made and confirmed the promise and covenant, that God would be their God, and the God of their whole seed, by a perpetual covenant. Therefore all their posterity, who had not altogether apostatized to the gods of the Gentiles, were, I say they all were, in the covenant, and they were judged holy by reason of covenant holiness, foederis sanctitate sancti judicabantur.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 227, as quoted by Thomas Boston, Miscellaneous Questions, Question 6, in Works, vol. 6, p.145. The larger context is about New Testament Baptism. | Rom. 11:16 “If the root be holy, so are the branches.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

</figure><figure class="quote" id="q-8aa7884766" data-kw="">
<blockquote><p>There is a twofold ministerial power: 1. Potestas ordinis, which consists merely in preaching the Word and administring the sacraments. 2. Jurisdictionis, whereby they govern in the Church, by binding the impenitent and losing the penitent.¹ ¹ …’Discipline’ is used sometimes largely, so as it extends to all rule and order, appointed or left for the right managing of the things of God, or strictly for the censures of the Church. So there may be a true Church without discipline. The Helvetians and those of Switzerland have no suspension [from the Table or Church] at all, but what offences other Churches suspend for the civil magistrate punishes other way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, ... (London: A.M., 1654), bk. 6, ch. 3, ‘Of Ecclesiastical Jurisdiction &amp; Government’</span></figcaption>

</figure><figure class="quote" id="q-28970dc514" data-kw="">
<blockquote><p>Together with these external means, serving for drawing on the covenant and going on in it [being in it], the common operations of God do concur; common to all the called, both elect and reprobate, and gifts common to both, are bestowed, such as illumination, moral persuasion, historical, dogmatic and temporary faith, moral change of affections, and some sort of external amendment of their outward conversation, saving grace being the special gift of God to His own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/therapeutica-sacra.html">Therapeutica Sacra</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Book 1, Chapter 6</span></figcaption>

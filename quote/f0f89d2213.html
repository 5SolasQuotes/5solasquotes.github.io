<blockquote><p>At that time [in Scotland before the 2nd reformation of 1638] ministers wore black gowns, cassock [a ministerial robe], etc, at all services and at the General Assembly, and continued to do so until 1638, when for the first time many appeared in Glasgow in ordinary clothes and armed.</p></blockquote>

<blockquote><p>Thirdly, all pride and vanity of garments are to be shunned and all those ornaments which do rather beseem the profane theaters of the gentiles than the sacred temples of Christians and which rather tend to delight the flesh than to edify the spirit: but all things must be done in the churches with most high reverence and modesty, as in the very sight of God and his angels. And albeit concerning the fashion of garments which ministers ought publicly to wear, either in their ministery or out of it, we do not think it a matter to be so stood upon that for it the peace of the church ought to be troubled; yet where they come nearest to the simplicity of the apostles, there we judge the church rather to be approved.</p></blockquote>

</figure><figure class="quote" id="q-ea6928ec62" data-kw="">
<blockquote><p>…whereas your surplice is arbitrarily institute[d], and imposed to signify innocency, without either real foundation or sufficient warrant, wherein, whether you do more usurp against God’s prerogative to appoint sacred and mysterious signs, and that simplicity, in which he has set forth his Gospel, or be more grossly mistaken in the event and fruit of your application, is a great question? I grant that necessity or decency have introduced many things circumstantial that are rational, and consequently upon some real antecedent ground expressive of their use and end: as grave apparel in pastors, a becoming covering of pulpits, tables in sacred use, regulation of time, postures, gestures and the like, without which worship cannot be performed; But to ascribe a liberty to the Church of appointing ceremonies, having for reason of their signification, the will of the instituter, and their use only in the representation, is so manifest an impingement upon Divine authority and the sacraments thereby ordained, and has already produced such a mass of superstitious superfluity in the Romish-Church, that I much admire to find a serious person pleading for such fopperies…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist… (1671), 3rd Dialogue</cite>, pp. 111-12</span></figcaption>

<blockquote><p>The dress of the Ministers in the English Church at Geneva [under John Knox] is a matter which is perplexing, for there is no evidence available indicating precisely what was the custom. … [John] Paullain [1517–1565, an English reformer], in his ‘Ad lectorem candidum’ (Lit. sac., P, Q) [‘To the Bright Reader’, in Liturgia Sacra, seu Ritus Ministerii in Ecclesia Peregrinorum… 1551/4], on the other hand, states quite definitely that vestments are not worn in his congregation. He urges that the New Testament does not prescribe a Minister’s apparel, and that a shepherd is not known to his sheep by his garb but by his call to them, and he thinks it sufficient that a Minister should be dressed modestly and soberly, with an absence of all pomp and arrogance. Further, he regards vestments as an incitement to superstition because of the Roman custom of blessing the garments. Thus he thought that in this as in other matters the Reformed Church should be content with the utmost simplicity. In England the Puritan party objected strenuously to all vestments. As early as 1562 request was made to Convocation ‘that the use of copes and surplices… be taken away; so that all ministers in their ministry use a grave, comely, and side-garment, as commonly they do in preaching’ and ‘that the ministers of the word and sacraments be not compelled to wear such gowns and caps, as the enemies of Christ’s gospel have chosen to be the special array of their priesthood’ ([John] Strype, Annals, Oxford ed., 1824, vol. i., pt. ii. 501). And in the same period we find the bishops enforcing the cassock and gown and forbidding the Puritan custom of preaching in what Bishop Duppa called ‘a riding or ambulatory Cloake’ (Rit. Com. Rep. ii. 577). The objections in these passages are against all gowns… Certainly [Myles] Coverdale [1488–1569] objected to all gowns, as we see by his letter to Farel in 1556: ‘Our affairs are not altered for the better, but alas! are sadly deteriorated. For it is now settled and determines… that out of doors must be worn the square cap, bands, a long gown and tippet; while the white surplice and cope are to be retained in divine service’ (Parker Soc. Zurich Letters, p. 121, Let. 50). … This brief review of the early evidence in Strasburg, Frankfort [Germany], Geneva, England and Scotland, shows that there appears to have been no practice that was agreed upon by all who followed the Calvinistic Reformation, and as regards the English Church of Geneva no accurate conjecture can be made. It is probable that the Ministers there adopted Calvin’s practice and wore the black gown, with cassock, bands, and scarf; but there can be no certainty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-maxwell.html">William Maxwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix G, ‘The Dress of the Ministers’ in John Knox’s Genevan Service Book, 1556; The Liturgical Portions of the Genevan Service Book Used by John Knox While a Minister of the English Congregation of Marian Exiles at Geneva, 1556-1559 (Edinburgh: Oliver &amp; Boyd, 1931)</cite>, pp. 210-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

van-gowns/#:~:text=The%20dress%20of%20the%20Ministers%20in,but%20there%20can%20be%20no%20certainty&amp;text=The%20dress%20of%20the%20Ministers%20in%20the%20English&amp;text=and%20scarf%3B%20but%20there%20can%20be%20no%20certainty" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>In Scotland it appears to have been the regular custom for ministers to wear a gown when conducting divine service. The cassock also was in frequent use, but this is not surprising since it was not a liturgical vestment, but the usual out-of-doors dress of the ministry. In England, however, the Puritans appear to have discarded the cassock, whilst there is little evidence to show that the early Puritans wore gowns.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/horton-davies.html">Horton Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 46-48 in Ch. 4 of The Worship of the English Puritans (Soli Deo Gloria, 1997)</cite>, p. 47</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In Scotland it appears to have been the regular custom for ministers to wear a gown when conducting divine service. The cassock also was in frequent use, but this is not surprising since it was not a liturgical vestment, but the usual out-of-doors dress of the ministry. In England, however, the Puritans appear to have discarded the cassock, whilst there is little evidence to show that the early Puritans wore gowns.”

<main class="wrap"><figure class="quote" id="q-c078067ffc" data-kw="">
<blockquote><p>…that which is called sentential justification, at the day of Judgment. For of what nature soever it be, the person concerning whom that sentence is pronounced, was: (1) actually and completely justified before God in this world; (2) made partaker of all the benefits of that justification, even unto a blessed resurrection in glory (‘it is raised in glory;’ 1 Cor. 15); (3) The souls of the most will long before have enjoyed a blessed rest with God, absolutely discharged and acquitted from all their labors, and all their sins; There remains nothing but an actual admission of the whole person into eternal glory. Wherefore this judgment can be no more but declaratory unto the glory of God, and the everlasting refreshment of them that have believed… … 1. It is no where said that we shall be judged at the last day, ex operibus [‘out of works’]; but, only that God will render unto men secundum opera [‘according to works’]. 2. …the Judgment at the last day is said to be according unto works, without any mention of faith. …

5. In our justification in this life by faith, Christ is considered as our propitiation and advocate… But at the last day, and in the last Judgment he is considered only as the Judge.

6. The end of God in our justification is the glory of his grace, Eph. 1:6. But the end of God in the last Judgment is the glory of his remunerative righteousness, 2 Tim. 4:8.

7. The representation that is made of the final Judgment, Mt. 7 and ch. 25, is only of the visible Church. And therein the plea of faith as to the profession of it is common unto all, and is equally made by all. Upon that plea of faith it is put unto the trial whether it were sincere, true faith or no, or only that which was dead and barren. And this trial is made solely by the fruits and effects of it; and otherwise in the public declaration of things unto all, it cannot be made.</p></blockquote>

<blockquote><p>[3] But if we take justification in a judiciary sense, as it is used in courts of justice and judgment, for proving, declaring, and pronouncing men righteous: then not only faith and actual believing, but also repentance, amendment of life, and all holy Christian duties, and good works of piety, mercy, and charity must necessarily go before as evidences, testimonies, and proofs by which men must be justified, that is, judged, declared, and pronounced righteous. First, in the court of their own conscience, so often as sin and Satan stand up against them to accuse them. Secondly, in the common judgment of men. Thirdly, in the general judgment at the last day. … Of the third [justification, “in a judiciary sense”] Saint James speaks, where he says that Abraham was justified by works, Jm. 2:21; and Job 13:18, where he says, “Behold now I have ordered my cause, I know that I shall be justified”; and this St. Paul calls ‘justification of life’, Rom. 5:18, because it is an adjudging of men to eternal life, according to the evidence of their works, as our Savior shows, Mt. 24:35.</p></blockquote>

</figure><figure class="quote" id="q-949034b80c" data-kw="">
<blockquote><p>And does by the Spirit of adoption assure us more and more of the pardon of our sins: but more solemnly at the Last Day, when the Judge does, sitting upon the throne, pronounce and declare us righteous before all the world, and as those who are accepted unto life, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord.’ Then the sentence is solemnly pronounced by the Judge sitting on the throne; and we are justified before God, men and angels. There are two parts of judgment, to condemn, and to absolve or justify: Mt. 12:36-37: ‘But I say unto you that for every idle word that a man shall speak, he shall give account thereof at the Day of Judgment; for by thy words thou shalt be justified, and by thy words thou shalt be condemned;’ then every man’s doom [verdict] shall be pronounced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton</cite>, … (London: Astwood, 1684) | Sermons on Rom. 8, Sermon 43, on Rom. 8:33, p. 334</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/the-last-judgment.html">The Last Judgment</a></span></div>
<div class="actions"><button class="copy" data-copy="“And does by the Spirit of adoption assure us more and more of the pardon of our sins: but more solemnly at the Last Day, when the Judge does, sitting upon the throne, pronounce and declare us righteous before all the world, and as those who are accepted unto life, Acts 3:19, ‘That your sins may be blotted out, when the times of refreshing shall come from the presence of the Lord.’ Then the sentence is solemnly pronounced by the Judge sitting on the throne; and we are justified before God, men and angels. There are two parts of judgment, to condemn, and to absolve or justify: Mt. 12:36-37: ‘But I say unto you that for every idle word that a man shall speak, he shall give account thereof at the Day of Judgment; for by thy words thou shalt be justified, and by thy words thou shalt be condemned;’ then every man’s doom [verdict] shall be pronounced.”

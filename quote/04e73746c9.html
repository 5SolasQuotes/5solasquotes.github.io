<main class="wrap"><figure class="quote" id="q-04e73746c9" data-kw="">
<blockquote><p>There is such a fulness in the satisfaction of Christ, as is sufficient for the salvation of the whole world, were the whole world to believe in Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-w-pink.html">A.W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of the Gospel of John (Zondervan, 1962), 2.219-22 This is early Pink, at his worst. HT: David Ponter | “Christ died for sinners. But everything turns on the significance of the preposition. What is meant by “Christ died for sinners”? To answer that Christ died in order to make it possible for God to righteously receive sinners who come to Him through Christ, is only saying what many a Socinian has affirmed. The testing of a man’s orthodoxy on this vital truth of the atonement requires something far more definite than this. The saving efficacy of the atonement lies in the vicarious nature of Christ’s death, in his representing certain persons, in his bearing their sins, in his being made a curse for them, in his purchasing them, spirit and soul and body. It will not do to evade this by saying</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-799cf93f69" data-kw="">
<blockquote><p>If He had made intercession and sacrifice for reprobates too, then clearly, their sins having been paid for by the sacrifice of the Son of God, the justice of God would not allow Him to require a debt already paid by the Son, nor would the justice of God be able to punish them with eternal death for their sins inasmuch as satisfaction has been made by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Substantia Foederis Gratuiti inter Deum et Electos (Geneva, 1585), pp. 67-72 as translated in G. Michael Thomas, The Extent of the Atonement… (Paternoster/Wipf &amp; Stock, 1997)</cite>, p. 114</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“If He had made intercession and sacrifice for reprobates too, then clearly, their sins having been paid for by the sacrifice of the Son of God, the justice of God would not allow Him to require a debt already paid by the Son, nor would the justice of God be able to punish them with eternal death for their sins inasmuch as satisfaction has been made by Him.”

— Caspar Olevianus, De Substantia Foederis Gratuiti inter Deum et Electos (Geneva, 1585), pp. 67-72 as translated in G. Michael Thomas, The Extent of the Atonement… (Paternoster/Wipf &amp; Stock, 1997), p. 114">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+He+had+made+intercession+and+sacrifice+for+reprobates+too%2C+then+clearly%2C+their+sins+having+been+paid+for+by+the+sacrifice+of+the+Son+of+God%2C+the+justice+of+God+would+not+allow+Him+to+require+a+debt+already+paid+by+the+Son%2C+nor+would+the+justice+of+God+be+able+to+punish+them+with+eternal+death+for+their+sins+inasmuch+as+satisfaction+has+been+made+by+Him.%E2%80%9D%0A%0A%E2%80%94+Caspar+Olevianus%2C+De+Substantia+Foederis+Gratuiti+inter+Deum+et+Electos+%28Geneva%2C+1585%29%2C+pp.+67-72+as+translated+in+G.+Michael+Thomas%2C+The+Extent+of+the+Atonement%E2%80%A6+%28Paternoster%2FWipf+%26+Stock%2C+1997%29%2C+p.+114&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F799cf93f69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/799cf93f69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=If%20He%20had%20made%20intercession%20and,satisfaction%20has%20been%20made%20by%20Him." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-da5636a070" data-kw="">
<blockquote><p>That Christ Jesus by His death did bring forth salvation and reconciliation only for the elect (John 15:13; Rom. 8:32–34; 5:11; 3:25), which were those which God the Father gave Him (Job 17:2; 6; 37); and that the gospel which is to be preached to all men as the ground of faith, is, that Jesus is the Christ, the Son of the ever-blessed God (Matt. 16:16; Luke 2:26; John 6:9; 7:3; 20:31; 1 John 5:11), filled with the perfection of all heavenly and spiritual excellencies, and that salvation is only and alone to be had through believing in His name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First London Baptist Confession</cite>, 1644, Art. 21</span></figcaption>

</figure><figure class="quote" id="q-42f7ff9a1c" data-kw="">
<blockquote><p>Position 1. As there is no merit, good deserving, work or hire in the miserable sinner dying in his blood, dead in sins, out of his wit and disobedient, deceived and serving diverse lusts, Eze. 16:4-8; Eph. 2:1-4; Tit. 3:3-4, so there is as much love, man-kindness and free grace in heaven in the breast of Christ as would save all in hell, or out of hell. I speak this in regard, not of the Lord’s intention, as if He did bear all and every one of mankind a good will, purposing to save them. But because their lies and flows such a sea and ocean of infinite love about the heart and in the bowels of Jesus Christ as would over-save and out-love infinite worlds of sinners (so all could come and draw and drink, and suck the breasts of overflowings of Christ’s free grace) in regard of the intrinsical weight and magnitude of this love, that if you appoint banks to channel or marches to bound this free love, God should not be God, nor the Redeemer the Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, p. 233</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Position 1. As there is no merit, good deserving, work or hire in the miserable sinner dying in his blood, dead in sins, out of his wit and disobedient, deceived and serving diverse lusts, Eze. 16:4-8; Eph. 2:1-4; Tit. 3:3-4, so there is as much love, man-kindness and free grace in heaven in the breast of Christ as would save all in hell, or out of hell. I speak this in regard, not of the Lord’s intention, as if He did bear all and every one of mankind a good will, purposing to save them. But because their lies and flows such a sea and ocean of infinite love about the heart and in the bowels of Jesus Christ as would over-save and out-love infinite worlds of sinners (so all could come and draw and drink, and suck the breasts of overflowings of Christ’s free grace) in regard of the intrinsical weight and magnitude of this love, that if you appoint banks to channel or marches to bound this free love, God should not be God, nor the Redeemer the Redeemer.”

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself (London: 1647), p. 233">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPosition+1.+As+there+is+no+merit%2C+good+deserving%2C+work+or+hire+in+the+miserable+sinner+dying+in+his+blood%2C+dead+in+sins%2C+out+of+his+wit+and+disobedient%2C+deceived+and+serving+diverse+lusts%2C+Eze.+16%3A4-8%3B+Eph.+2%3A1-4%3B+Tit.+3%3A3-4%2C+so+there+is+as+much+love%2C+man-kindness+and+free+grace+in+heaven+in+the+breast+of+Christ+as+would+save+all+in+hell%2C+or+out+of+hell.+I+speak+this+in+regard%2C+not+of+the+Lord%E2%80%99s+intention%2C+as+if+He+did+bear+all+and+every+one+of+mankind+a+good+will%2C+purposing+to+save+them.+But+because+their+lies+and+flows+such+a+sea+and+ocean+of+infinite+love+about+the+heart+and+in+the+bowels+of+Jesus+Christ+as+would+over-save+and+out-love+infinite+worlds+of+sinners+%28so+all+could+come+and+draw+and+drink%2C+and+suck+the+breasts+of+overflowings+of+Christ%E2%80%99s+free+grace%29+in+regard+of+the+intrinsical+weight+and+magnitude+of+this+love%2C+that+if+you+appoint+banks+to+channel+or+marches+to+bound+this+free+love%2C+God+should+not+be+God%2C+nor+the+Redeemer+the+Redeemer.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself+%28London%3A+1647%29%2C+p.+233&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F42f7ff9a1c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/42f7ff9a1c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sufficiency-of-the-atonement/#:~:text=Position%201.%20As%20there%20is%20no,God%2C%20nor%20the%20Redeemer%20the%20Redeemer." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-96b8ef64dd" data-kw="">
<blockquote><p>Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense: 1. Because Christ assumed the nature which is common; it is not conceded that it was common to all, but it was the nature of Abraham, the father of the believing (Heb. 2:16). Hence, the devils are not at all made salvable by Christ, of course, as the angelic nature has not itself been united to his person. 2. Because Christ has expiated the common sin of Adam on the tree of the cross, though it is not conceded that it was as common, but as it was in the elect and the believing. 3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Reprobate are made Reconcilable by the Death of Christ?’ [Distinguish] in Rutherford’s Examination of Arminianism: The Tables of Contents with Excerpts from Every Chapter, trans. T. Fentiman &amp; C. Johnson (RBO, 2019)</cite>, pp. 90-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

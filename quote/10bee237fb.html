<main class="wrap"><figure class="quote" id="q-10bee237fb" data-kw="">
<blockquote><p>And if we look into the book of Psalms, we shall find not only a great many which do generally concern the estate of the whole Church, and therefore are most fit to be sung in the common assemblies… … And if the private singing of psalms were not so necessary a duty of Christians as it is, to what end serves that earnest exhortation of the apostle to the Colossians? Let the word of Christ dwell in you plenteously in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs, singing with grace in your hearts to the Lord (Col. 3:16). Where he teaches the whole Church how they should behave themselves in their private meetings… they should sing spiritual songs, whereof there are so many kinds, as appears by the diverse words he uses in this place, as when he says, psalms, hymns, and spiritual songs. Whereunto agrees that which he writes unto the Ephesians: Be not drunken with wine… speaking unto yourselves in psalms, and hymns, and spiritual songs… (Eph. 5:18-20)… they on the contrary should in the midst of these things (being guided by God’s Spirit) burst forth into the praises of God through Jesus Christ; and testify their holy mirth, not of the flesh, but of the Spirit, by singing Psalms; whereof there are so many sundry kinds, that for every time we shall be fitted with some one or other [psalm, hymn, or spiritual song.] Let us not therefore deny so manifest a truth, but acknowledge as the Word teaches us, that the Lord requires of us in our private meetings upon the Lord’s Day, and when we are alone by ourselves, to sing psalms, as well as in the church. And though I do not bind men unto this–for be it far from me that I should lay any heavier burden upon any, than the Word of God itself binds–bind them I say unto this, that in all their mirth they should sing psalms, as might seem the places alleged do import… For as that is… a blessed heaviness that makes us seek unto the Lord; so that is a godly mirth that ends with singing of psalms, and a heavenly joy, that at leastwise makes us more fit to serve God. . pp. 406-7 What Makes it Comely …So though to sing be never so comely in its own nature, yet it become not us, except we be prepared for it, and do sing David’s psalms [not so much with David’s harp,] as with David’s spirit. Therefore the apostle, writing to the Ephesians, wills them in singing to make melody in their hearts to the Lord (Eph. 5:19), and not to sing with the tongue only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of the Sabbath (1595/1606; Naphtali &amp; RHB, 2015) Emphasis in the original. See also pp. 402-3. | Book 2, ch. 11, ‘Private Worship: Singing of Psalms’</cite>, pp. 396-8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fd15ac487b" data-kw="">
<blockquote><p>…the venerable councils of the fathers [referring to Laodicea (365) and Braga (563) above] decree that vulgar psalms should not at all be sung in the Church and that ‘nothing put together in poetic fashion’ should be employed in the divine praises. … …so that to avoid growths and errors of that kind they [‘God-fearing ones‘] cling more vigorously and more carefully to divine authority and statutes of the church. This very wholesome care for the faith and method of observance, namely, that in God’s temple and before the divine altar only the melody of divine eloquence be rehearsed, is most strongly commended to us also by the authority and examples of the Old Testament, as in the book of Chronicles where one reads that blessed David, king and prophet of God, first established in tabernacle or temple the choirs of Levites praising the Lord, and delivered to them by divine providence inspired utterances, psalms, hymns, and canticles; his own as well as those of others who prophesied along with him, and decreed that they should be sung both morning and evening amid the divine burnt offerings and sacrifices. It is fitting that this custom, handed down from the holy prophets, preserved most carefully by the fathers who came afterward, even to the time of the New Testament, when it was necessary for that temple to be destroyed, it is fitting that this custom be continued with devout reverence. It is therefore especially needful that we truly desire to celebrate the divine praises without even the least offense and hesitation. Let us apply ourselves wholly to divine words in which there is no error, no ambiguity.. … There is therefore no doubt that each instructed believer will freely assent to such holy authority and such evident truth. But if any contentious and stubborn person attempts to disagree, and should wish to drink from a muddy stream rather than from the purest spring, he should take care that he not become ill with that most ruinous debility which a certain one of the ancient fathers wisely and briefly warned should be avoided, observing that when truth has been despised the one who imagines he is complying with custom is either envious and spiteful toward the brethren to whom truth is revealed or ungrateful toward God by whose inspiration His church is set in order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/agobard-of-lyons.html">Agobard of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Divine Psalmody c. 836 10 paragraphs</cite></span></figcaption>

</figure><figure class="quote" id="q-c555918365" data-kw="">
<blockquote><p>The apostle names three sorts of them [i.e. ‘divine canticles’], psalms, hymns, or praises, and odes, or songs… You have various examples of them all in the book of Psalms… It is with these sacred lyres, of which the word of Christ affords us both the matter and the form, that the apostle would have us solace ourselves. St. James gives us orders for it: ‘Is any among you merry? let him sings psalms,’ James 5:13. The apostle calls all these sonnets spiritual, both on account of their author, who is the Holy Spirit, and also of their matter, which concerns only divine and heavenly things, the glory of God, and our salvation…</p></blockquote>

<blockquote><p>We all reject their error who make every circumstance of religion unlawful which has not a particular command in Scripture; as if reason might not regulate such by the general command; As if reason might not without express particular precept choose a text, method, words and notes for remembrance in preaching, or might not translate the Scriptures or turn the Psalms into meter and put tunes on each, and many such things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tunes-are-circumstantial.html">Tunes Are Circumstantial</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Manton, Bates, Case, Baxter, Fairclough, et al. | The Judgment of Non-Conformists of the Interest of Reason in Matters of Religion in which it is Proved against Make-Baits that both Conformists &amp; Non-Conformists, &amp; All Parties of true Protestants are herein really agreed, though unskilful speakers differ in words (London: 1676), p. 17 This was signed by 15 non-conformist English puritans.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“We all reject their error who make every circumstance of religion unlawful which has not a particular command in Scripture; as if reason might not regulate such by the general command; As if reason might not without express particular precept choose a text, method, words and notes for remembrance in preaching, or might not translate the Scriptures or turn the Psalms into meter and put tunes on each, and many such things.”

— Tunes Are Circumstantial, Manton, Bates, Case, Baxter, Fairclough, et al. | The Judgment of Non-Conformists of the Interest of Reason in Matters of Religion in which it is Proved against Make-Baits that both Conformists &amp; Non-Conformists, &amp; All Parties of true Protestants are herein really agreed, though unskilful speakers differ in words (London: 1676), p. 17 This was signed by 15 non-conformist English puritans.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+all+reject+their+error+who+make+every+circumstance+of+religion+unlawful+which+has+not+a+particular+command+in+Scripture%3B+as+if+reason+might+not+regulate+such+by+the+general+command%3B+As+if+reason+might+not+without+express+particular+precept+choose+a+text%2C+method%2C+words+and+notes+for+remembrance+in+preaching%2C+or+might+not+translate+the+Scriptures+or+turn+the+Psalms+into+meter+and+put+tunes+on+each%2C+and+many+such+things.%E2%80%9D%0A%0A%E2%80%94+Tunes+Are+Circumstantial%2C+Manton%2C+Bates%2C+Case%2C+Baxter%2C+Fairclough%2C+et+al.+%7C+The+Judgment+of+Non-Conformists+of+the+Interest+of+Reason+in+Matters+of+Religion+in+which+it+is+Proved+against+Make-Baits+that+both+Conformists+%26+Non-Conformists%2C+%26+All+Parties+of+true+Protestants+are+herein+really+agreed%2C+though+unskilful+speakers+differ+in+words+%28London%3A+1676%29%2C+p.+17+This+was+signed+by+15+non-conformist+English+puritans.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5655da30e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5655da30e3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/singing-of-praise#:~:text=We%20all%20reject%20their%20error%20who,on%20each%2C%20and%20many%20such%20things." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a357c874ee" data-kw="">
<blockquote><p>Col. 3:16, ‘Let the word of Christ dwell in you richly in all wisdom, teaching and admonishing one another in Psalms, hymns, and spiritual songs, singing with grace in your hearts to the Lord,’ etc. He did not here mean (in this place) any new Psalms or hymns, for he bade them admonish each other in those Psalms and hymns; therefore those Psalms and hymns were then Canonical: although I could wish that upon some occasion (were it not for startling the weak in knowledge) that some preacher that were a solid man, would frame a Psalm for that special occasion (for he that can make a prayer according to the Word, is able also to make a Psalm) but this I think would be inconvenient; but this is fit to be done, viz. the preacher himself should fit a Psalm out of the Book of Psalms for the several occasions, and suitable to his sermon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-palmer.html">George Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sectaries Unmasked and Confuted, by the treating upon diverse points of doctrine in debate betwixt the Presbyterialists and Sectarists, Anabaptists, Independents, and Papists (London, 1647), p. 45. Palmer was an English presbyterian. The concession that Palmer makes below actually shows that such a practice as composing a hymn upon a special occasion was not in fact being done.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-906be42022" data-kw="">
<blockquote><p>In order of final causality God wills, first the soul, secondly the body for the sake of the soul. But in the order of material causality He wills first the body, as being the material cause to be perfected by the soul, and the soul is created only when the embryo is sufficiently disposed to receive the soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (St. Louis: Herder, 1950) Garrigou-Lagrange was a Romanist, Neo-Thomist theologian., ch. 32, Introduction, p. 206</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“In order of final causality God wills, first the soul, secondly the body for the sake of the soul. But in the order of material causality He wills first the body, as being the material cause to be perfected by the soul, and the soul is created only when the embryo is sufficiently disposed to receive the soul.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-371541bb79" data-kw="">
<blockquote><p>God’s curse to the woman was in part, ‘I will greatly multiply your sorrow and your conception’ (Gen. 3:16). Just as every other aspect of creation entered into a curse, so too did conception. To ignore the impact of the fall upon procreation is to miss critical changes that have come about that can make conception a sorrow rather than a blessing (things like cancer, high blood pressure, being worn out from running after five children under the age of six, changes to the function of lactation, etc.)… Physiology shows that perfect bodies were designed by God to suppress ovulation as long as there was breastfeeding (up to three years). The Fall has impacted many bodies to override this normal God-given function.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-b1f5f5dfda" data-kw="">

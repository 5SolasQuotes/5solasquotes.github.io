<main class="wrap"><figure class="quote" id="q-8eb6d5d218" data-kw="">
<blockquote><p>Of this article nothing can be yielded or surrendered [nor can anything be granted or permitted contrary to the same], even though heaven and earth, and whatever will not abide, should sink to ruin. … And upon this article all things depend which we teach and practice in opposition to the Pope, the devil, and the [whole] world. Therefore, we must be sure concerning this doctrine, and not doubt; for otherwise all is lost, and the Pope and devil and all things gain the victory and suit over us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Smalcald Articles</cite>, Triglot translation, Part II, Art. I, 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/article-of-a-standing-or-falling-church.html">The Article of a Standing or Falling Church</a> › <a href="../topics/justification/article-of-a-standing-or-falling-church/the-chief-article-of-the-faith.html">The chief article of the faith</a></span><span class="t"><a href="../topics/justification/meritorious-cause.html">Meritorious Cause</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a></span></div>

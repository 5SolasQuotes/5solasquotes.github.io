<blockquote><p>[4.] Calvin treating of Church-power, says well, ‘Non est igitur ecclesiae potestas in•…inita, sed subjecta verbo Domini, &amp; in eo quasi inclusa.’ (Institutes, bk. 4, ch. 8, sect. 4) That all Church-judicatories, whether congregational-elderships, or presbyteries or synods, whether provincial or national, or ecumenic, being constituted of men that are weak, frail and ignorant in part, are in their determinations fallible and subject to error, Isa. 40:6-8; Rom. 3:4; 1 Cor. 13:9,12.

5. That insofar as any of these do actually err and decline from the truth, they do insofar act without power and authority from Jesus Christ: They can do nothing (of themselves, they may do, but not by His commission and warrant) against the truth, but for the truth, 2 Cor. 13:8. The power which He has given them being to edification, and not to destruction, 2 Cor. 13:12.

6. Sad experience, almost in every generation, does teach us that Church-guides and Church-judicatories do oftentimes decline from the straight-ways of the Lord, and decree unrighteous decrees, and write grievous things which they have prescribed, Isa. 9:15-16; Jer. 8:8-9; Mal. 2:8-9; Jer. 2:8. And that whilst they are boasting of the authority given to them of God, and of their skill in the Law, and professing to walk according thereto, they are perverting the precious truths of God, and persecuting these who cleave thereunto, Jer. 18:18; Isa. 66:5; Jn. 7:48-49.

7. That the same Lord, who has commanded us not to despise prophesying, 1 Thess. 5:19, has also commanded us to prove all things, and to hold fast that which is good, ver. 20. And no[t] to believe every spirit, but to try the spirits, whether they be of God, because many false prophets are gone forth into the world, 1 Jn. 4:1. And that whatsoever is not of faith is sin, Rom. 14:15. And that we ought not to be the servants of men, 1 Cor. 7:23. That is to do things (especially in the matters of God) for which we have no other warrant, but the mere pleasure and will of men, which the apostle Peter calls living to the lusts of men, and not to the will of God, 1 Pet. 4:2. And that it is therefore both the duty and privilege of every Church-member, and of every inferior Church-judicatory, to examine by the judgement of discretion every thing which the Church-authority joins, whether it be agreeable or repugnant to the rules of the Word; and if after a diligent and impartial search, it be found repugnant, they are not to bring their consciences in bondage thereto; neither is the allowing and exercising of the judgement of discretion by inferiors, the setting them as judges over their superiors, or making them transgress the line, or limits of that due subordination and submission appointed unto them of God. Protestant divines in their writings, de judice controverstarum [on the judge of controversies] have fully answered this, and showed us that it does not make a private man or an inferior, judge of the sentences and decrees of his superiors, but only of his own actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie</cite>, … (Edinburgh, 1658), pp. 96-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

— James Guthrie, Protesters no Subverters, and presbyterie no papacie; or, A vindication of the protesting brethren, and of the government of the kirk of Scotland from the aspersions unjustly cast upon them, … (Edinburgh, 1658), pp. 96-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B4.%5D+Calvin+treating+of+Church-power%2C+says+well%2C+%E2%80%98Non+est+igitur+ecclesiae+potestas+in%E2%80%A2%E2%80%A6inita%2C+sed+subjecta+verbo+Domini%2C+%26+in+eo+quasi+inclusa.%E2%80%99+%28Institutes%2C+bk.+4%2C+ch.+8%2C+sect.+4%29+That+all+Church-judicatories%2C+whether+congregational-elderships%2C+or+presbyteries+or+synods%2C+whether+provincial+or+national%2C+or+ecumenic%2C+being+constituted+of+men+that+are+weak%2C+frail+and+ignorant+in+part%2C+are+in+their+determinations+fallible+and+subject+to+error%2C+Isa.+40%3A6-8%3B+Rom.+3%3A4%3B+1+Cor.+13%3A9%2C12.+5.+That+insofar+as+any+of+these+do+actually+err+and+decline+from+the+truth%2C+they+do+insofar+act+without+power+and+authority+from+Jesus+Christ%3A+They+can+do+nothing+%28of+themselves%2C+they+may+do%2C+but+not+by+His+commission+and+warrant%29+against+the+truth%2C+but+for+the+truth%2C+2+Cor.+13%3A8.+The+power+which+He+has+given+them+being+to+edification%2C+and+not+to+destruction%2C+2+Cor.+13%3A12.+6.+Sad+experience%2C+almost+in+every+generation%2C+does+teach+us+that+Church-guides+and+Church-judicatories+do+oftentimes+decline+from+the+straight-ways+of+the+Lord%2C+and+decree+unrighteous+decrees%2C+and+write+grievous+things+which+they+have+prescribed%2C+Isa.+9%3A15-16%3B+Jer.+8%3A8-9%3B+Mal.+2%3A8-9%3B+Jer.+2%3A8.+And+that+whilst+they+are+boasting+of+the+authority+given+to+them+of+God%2C+and+of+their+skill+in+the+Law%2C+and+professing+to+walk+according+thereto%2C+they+are+perverting+the+precious+truths+of+God%2C+and+persecuting+these+who+cleave+thereunto%2C+Jer.+18%3A18%3B+Isa.+66%3A5%3B+Jn.+7%3A48-49.+7.+That+the+same+Lord%2C+who+has+commanded+us+not+to+despise+prophesying%2C+1+Thess.+5%3A19%2C+has+als </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-84e5bda01e" data-kw="">
<blockquote><p>This is brought forth in that text of the apostle, 2 Thess. 2:13, ‘because, when ye received the word of God which ye heard of us, ye received it not as the word of men, but as it is in truth, the word of God, which effectually worketh also in you that believe.’ [Power of rule and discipline is] to ministers [antecessoribus, those who come before] because in the name and power of Christ they manifest themselves amidst consciences, and they are ministers to consciences of laws broad and fixed, and of laws of faith and obedience, by which laws they are taken hold of; and they [the ministers] are σύνεργοι [‘laborers together’] and συνεργοῦντες [‘workers together’] of God (1 Cor. 3:9 &amp; 2 Cor. 6:1) in laws written on the heart, and on the mind (Heb. 10:16)… Therefore, they bear, impose and manifest divine laws to consciences, inasmuch as God, through ministers, may bear, impose and manifest them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676), Vol. 4, pt. 3, bk. 4, Tract 1, ‘Of Ecclesiastical Power’, 7. Of the Legislative Power of the Churches, 5th Question, Response 2, p. 796</span></figcaption>

<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the [prelate] Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches and Gregory de Valentia, as I show[ed] before… …when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo [therefore], it [the Church’s judgment] cannot remove my doubting and beget faith…

7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>

<blockquote><p>But as we have seen in what respect the laws of the Church do not bind, let us now see how they may be said to bind. That which binds is not the authority of the Church, nor any force which the Church can give to her laws. It must be then somewhat else which makes them able to bind, when they bind at all, and that is, ratio legis, ‘the reason of the law,’ without which the law itself cannot bind, and which has the chiefest and most principal power of binding. An ecclesiastical law says Junius (Animad. in Bellarmine, Controversy 3, bk. 4, ch. 16, note 87): ‘[Greek] sive depositio, non vere lex est, sed [Greek] aut canon, ac proinde dirigit quidem ut canon agentem voluntarie: non autem necessitate cogit, ut lex, etiam involuntarium quod si forte ante accedit coactio, ea non est de natura Canonis sed aliunde pervenit.’ An ecclesiastical canon says Tilen, ducit volentem, non trahit nolentem: quod si accedat coactio, ea Ecclesiastici Canonis natura est prorsus aliena. Calvin’s judgment is that an ecclesistical canon binds when manifestam utilitatem prae se fert [it bears a manifest utility before it], and when either [Greek] or charitatis ratio [the law of charity] does require that we impose a necessity on our liberty. It binds not then by its own authority in his mind. And what says the Canon Law itself? Sed sciendum est quod Ecclesiasticae prohibitiones proprias habent causas, quibus cessantibus, cessant &amp; ipsae. Hence Junius says that the law binds not per se [of itself], but only propter ordinem, charitatem, &amp; cautionem scandali [for the order, charity and caution of scandal]. Hence Ames: ‘quamvis ad justas leges humanas, justo modo observandas, obligentur homines in conscientiis suis a Deo; ipsae tamen leges humanae, qua sunt leges hominum, non obligant conscientiam.’ Hence Alsted: Lawes made by men of things indifferent, whether they be civil or ecclesiastical, do bind the conscience insofar as they agree with God’s Word, serve for the public good, maintain order, and finally, take not away liberty of conscience. Hence the Professors of Leiden say that laws bind not primo &amp; per se, sed secundario &amp; per accidens [firstly and of themselves, but secondarily and by accident], that is quatenus in illis lex aliqua Dei violatur [insofar as in them the law of God is anyway violated]. Hence I may compare the constitutions of the Church with responsa juris consultorum [responses of the lawyers of the law] among the Romans, which obliged no man, nisi ex aequo &amp; bono [except out of equity and good] says Danaeus. Hence it may be said that the lawes of the Church do only bind scandali &amp; contemptus ratione [by the reason of scandal and contempt], as Hospinian, and in case libertas fiat cum scandalo [liberty may be turned into scandal], as Paraeus: for it were scandal, not to give obedience to the laws of the Church when they prescribe things necessary or expedient for the eschewing of scandal, and it were contempt to refuse obedience to them when we are not certainly perswaded of the unlawfulness or inexpediency of the things prescribed. … We deny not then that the Churches’ canons about rites which serve for public order and edification do bind: We say only that it is not the authority of the Church framing the canon that binds, but the matter of the canon chiefly, warranted by God’s Word. Scimus enim quaecunque ad decorum &amp; ordinem pertinent, non habenda esse pro humanis placitis, quia divinitus approbantur (Calvin, Resp. ad Libel. de Pii Viri Officio, p. 413). Therefore we think concerning such canons that ‘they are necessary to be observed so far forth only as the keeping of them maintains decent order and prevents open offence.’ (Theodore Beza, Confession, ch. 5, Article 18; Perkins, ubi supra. &amp; Meisner, Philos. sobr., part 3, section 2, question 12)</p></blockquote>

<blockquote><p>The Jesuits, and Popish doctors, as they are of a large conscience in many things: so in the doctrine of scandal, to extol obedience to men so high as we may do things in themselves not necessary, yea [in things] that have no necessity but from the will of commanders; and Formalists in this conspire with them, even though from this do flow the ruin of many souls… the scandal ceases not to flow kindly [in kind] from the pretended obedience to an unlawful command, for the thing commanded, having no necessity but the will of man, is unlawful…</p></blockquote>

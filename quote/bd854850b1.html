<main class="wrap"><figure class="quote" id="q-bd854850b1" data-kw="">
<blockquote><p>Upon the stage of this world, mercy acts in part and shows itself in more objects, and in more instances, than the judgment of God does; that must have its course and triumph in the next world; here all sinners share, more or less, in the mercy of God. “The Lord is good to all” (Ps. 145:9) “He makes his rain to fall, and his sun to shine upon the just and the unjust.” (Matt 5:45).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-mead.html">Matthew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted by David Silversides, The Free Offer of the Gospel</cite>, p. 106, The Sermons of Matthew Mead (d. 1699; Soli Deo Gloria, 1991), p. 338 ff.</span></figcaption>

<blockquote><p>After these common mercies, I say, whereof the reprobate are often partakers, he opens the treasure of his rich mercies, which are kept in Christ Jesus for his Elect. Such as willingly delight not in blindness may clearly see that the Holy Ghost makes a plain difference betwixt the graces and mercies which are common to all, and that sovereign mercy which is immutably reserved to the chosen children.</p></blockquote>

<blockquote><p>That former grace may be called the grace of our vocation; this grace is common to all that are called, elect and reprobate. But the latter grace in our effectual calling may be called the grace of faith, appertaining only to the elect; for it is given only to those that are predestinated to life everlasting to believe.</p></blockquote>

</figure><figure class="quote" id="q-d6669adc36" data-kw="">
<blockquote><p>Jonah… cried, and said, ‘Yet forty days and Nineveh shall be overthrown.’ So the people of Nineveh believed God, and proclaimed a fast, and put on sackcloth, from the greatest of them even to the least of them… the king of Nineveh… caused it to be proclaimed and published through Nineveh… saying, ‘…let man and beast be covered with sackcloth, and cry mightily unto God: yea, let them turn every one from his evil way, and from the violence that is in their hands. Who can tell if God will turn and repent, and turn away from his fierce anger, that we perish not?’ And God saw their works, that they turned from their evil way; and God repented of the evil that He had said that He would do unto them; and He did it not.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f396ba73aa" data-kw="">
<blockquote><p>Worship is the right, fitting, and delightful response of moral beings–angelic and human–to God the Creator, Redeemer, and Consummator, for who He is as one eternal God in three Persons–Father, Son, and Holy Spirit–and for what He has done in creation and redemption, and for what He will do in the coming consummation, to whom be all praise and glory, now and forever, world without end. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-gibson.html">Jonathan Gibson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Worship on Earth as it is in Heaven” in eds. Jonathan Gibson &amp; Mark Earngey, Reformation Worship</cite>, (Greensboro, NC: New Growth Press, 2018), p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>While He may be found. So Ps. 32:6, in a time of acceptance, Isa. 49:8, while He offers Himself unto you in the means of grace, in the ministry of his Word, Ps. 27:8 and 95:7,8; 2 Cor. 5:20 and 6:1,2; Heb. 3:7, before the term of time respited [postponed for relief] for repentance, be expired, Gen. 6:3; Ex. 9:18; Jonah 3:4; Luke 19:42,44; Rev. 2:21; before the decree go forth, Zeph. 2:1-3, and God grow weary of repenting, Jer. 15:6, having born so long that He can no longer forbear, Jer. 44:22, and He take a solemn oath, Ps. 95:11, that He will not be spoken with He will not be found of you Isa. 1:15; Jer. 7:16; Prov. 1:24-28; Hos. 5:6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-annotations.html">English Annotations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 3rd ed. (1658), Thomas Gataker, on Isa. 55:6 – “Seek ye the Lord while he may be found, call ye upon Him while He is near:”</span></figcaption>

</figure><figure class="quote" id="q-d2d1d6ebfb" data-kw="">
<blockquote><p>Upon the first day of the week, everyone lays by in store, as God prospers him, giving it into a broad [collection plate] at the church door, for the relief of the poor, as 1 Cor. 16:2. It is provided that ministers have competent stipends, as 1 Cor. 9:13, and that hospitals be upholden, Matt 25:35,36; Eccl. 11:1,2, and that the fabric [buildings and external furniture] of the Church be upholden by the [civil] patron and free-holders [civil town citizens],¹ as Mal. 1:10; Hag. 1:4; Hag. 2:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, 1642, London | Ch. 20, Whether or not the government of the Church of Scotland can be proved by God’s Word to be lawful? | 11th Article, Elders and Deacons</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-beaf4df64b" data-kw="">
<blockquote><p>A purity spiral is a theory which argues for the existence of a form of groupthink in which it becomes more beneficial to hold certain views than to not hold them, and more extreme views are rewarded while expressing doubt, nuance, or moderation is punished (a process sometimes called “moral outbidding”). It is argued that this feedback loop leads to members competing to demonstrate the zealotry or purity of their views. A purity spiral is argued to occur when a community’s primary focus becomes implementing a single value that has no upper limit, and where that value does not have an agreed interpretation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wikipedia.html">Wikipedia</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Purity Spiral” 12-2025</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

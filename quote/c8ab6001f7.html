<blockquote><p>…every true Church is God’s Sion: every Church that holds the foundation is true, according to that golden rule, Eph. 2:21. Every building that is coupled together in this cornerstone grows unto an holy temple in the Lord: No adversary, either man or Devil can confound us, either in our evidences, or their own challenges: we may be faulty, but we are true…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Common Apology of the Church of England against the Unjust Challenges of the over-just Sect, commonly called Brownists</cite>, … (London: Macham, 1610), sect. 46, p. 111</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>And concerning the bounds and limits of this forbearance, all will undeniably acknowledge that it ought not to be extended indifferently unto all persons, opinions and practises, but that these four propositions are agreeable to the truth of Christianity: … Secondly, that it is not the mind of Christ that any of his servants should profess themselves willing or obliged to bear with any person which does endeavour, and with any doctrine or practice which does tend to overthrow the faith in his name, which is delivered to the saints (Jude 3), or to destroy the life and power of godliness either in the private or publick profession of religion (Tit. 1:10-11; 2 Tim. 3:5-8; Gal. 5:7-13), or to dissolve the bonds of holy communion amongst Christian brethren (Phil. 3:2; Jud. 19; Rom. 16:17-18), or to abolish the orderly relations and obligations natural and moral, without which human societies cannot stand (1 Tim. 5:8; Mt. 15:4-6; 1 Tim. 4:3), or to put down the authority which God has set up in and over human societies for the administration of justice therein (2 Pet. 2:10; Rom. 13:1-8). … Fourthly, that in matters of greater weight, which are not merely circumstantial, but are conceived to be determined by the Word, yet so, as that it is differently understood: in this case the mind of Christ is that the rules of Christian charity and mutual edification, be inviolably observed with all long suffering and forbearance. And this course ought to be continued so long, either as there is hope to gain the advantage of loving conferences, whereby differences may be reconciled, and mistakes and scandals prevented and taken out of the way; or so long as there is cause to think that God may reveal his profitable truths to such as err not wilfully, but through weakeness of judgment and harmlessly, Phil. 3:15-16 and 2 Tim. 2:22-26.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Moderator: Endeavoring a Full Composure &amp; Quiet Settlement of those many Differences both in Doctrine &amp; Discipline, which have so long disturbed the peace and welfare of this commonwealth</cite>, … (London: Bellamy, 1652), ch. 8, pp. 57-58 Caryl was a congregationalist.</span></figcaption>

<blockquote><p>1. There is a separation Negative, or a non-union, and a separation Positive. Though a Church of schismatics retaining the sound faith, yet separating from [the] other [Church]…

2. If the whole and most part of the Church turn idolatrous, and worship idols (which is essential idolatry) we are to separate from that Church: the Levites and the two tribes did well, as Mr. [John] Ball says, to make a separation from Jeroboam’s calves; and the godly laudably, 2 Kn. 16:11, did not separate from the Israel and Church of God, because the Altar of Damascus was set up and because of the high places. Things dedicated unto idols, as Lutheran images, may be called, and are called, 1 Cor. 10:34, idolatry, yet are they idolatry by participation, and so the cup of devils, 1 Cor. 10. Paul does not command separation from the Church of Corinth and the Table of the Lord there. 3rd Consideration. There is a separation from the Church in the most part, or from the Church in the least and best part. In Achab’s time Israel, and the Church thereof, for the most part, worshipped Baal; Elijah, Micaiah, Obadiah, and other godly separated from the Church of Israel in the most part: Jeremiah wished to have a cottage in the wilderness (no doubt a godly wish) that he might separate from the Church all then for the most part corrupted, yet remained they a part of the visible Church and a part in the visible Church, and therefore did he not separate from the Church according to the least and best part thereof; [Note that the difference above is over fundamental issues, not every degree of purity in fundamentally sound churches.] The godly in England who refused the Popish ceremonies and Antichristian bishops did well not to separate from the visible Church in England, and yet they separated from the mainest and worst part, which cannot be denied to be a ministerial Church. 4th Consideration. If a Church be incorrigible in a wicked conversation, and yet retain the true faith of Christ, it is presumed God has there some to be saved, and that where Christs ordinances be, there also where Christ’s ordinances be, there also Christ’s Church-presence is; And therefore I doubt much if the Church should be separated from, for the case is not here as with one simple person, for it is clear, all are not involved in that incorrigible obstinacy, and that is yet a true visible communion, in which we are to remain, for there is some union with the head Christ, where the faith is kept sound, and that visibly; though a private brother remaining sound in the faith, yet being scandalous and obstinately flagitious be to be cast off, as an heathen, yet are we not to deal so with an orthodox Church, where most part are scandalous. … 6. We may well hold that Ambrose says well (Commentary on Luke, bk. 6, ch. 1), that a Church wanting the foundation of the apostles is to be forsaken. … 8. There may be causes of non-union with a Church, which are not sufficient causes of separation: Paul would not separate from the Church of the Jews, though they rejected Christ, till they openly blasphemed, Acts 13:44-46; 18:16. And when they opposed themselves and blasphemed, Paul shook his raiment and said unto them, ‘Your blood be upon your own heads, I am clean, from henceforth I will go to the gentiles.’ There is a lawful separation, and yet before the Jews came to this, there was no just cause why any should have joined to the Church of the Jews, who denied the Messiah, and persecuted his servants, Acts 4-5, seeing there was a cleaner Church, to which converts might join themselves, Acts 2:40-42.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (London: Griffin, 1644), pt. 2, ch. 4, sect. 5, Question 3, In what cases it is lawful to separate from a Church?, pp. 253-55</span></figcaption>

2. If the whole and most part of the Church turn idolatrous, and worship idols (which is essential idolatry) we are to separate from that Church: the Levites and the two tribes did well, as Mr. [John] Ball says, to make a separation from Jeroboam’s calves; and the godly laudably, 2 Kn. 16:11, did not separate from the Israel and Church of God, because the Altar of Damascus was set up and because of the high places. Things dedicated unto idols, as Lutheran images, may be called, and are called, 1 Cor. 10:34, idolatry, yet are they idolatry by participation, and so the cup of devils, 1 Cor. 10. Paul does not command separation from the Church of Corinth and the Table of the Lord there. 3rd Consideration. There is a separation from the Church in the most part, or from the Church in the least and best part. In Achab’s time Israel, and the Church thereof, for the most part, worshipped Baal; Elijah, Micaiah, Obadiah, and other godly separated from the Church of Israel in the most part: Jeremiah wished to have a cottage in the wilderness (no doubt a godly wish) that he might separate from the Church all then for the most part corrupted, yet remained they a part of the visible Church and a part in the visible Church, and therefore did he not separate from the Church according to the least and best part thereof; [Note that the difference above is over fundamental issues, not every degree of purity in fundamentally sound churches.] The godly in England who refused the Popish ceremonies and Antichristian bishops did well not to separate from the visible Church in England, and yet they separated from the mainest and worst part, which cannot be denied to be a ministerial Church. 4th Consideration. If a Church be incorrigible in a wicked conversation, and yet retain the true faith of Christ, it is presumed God has there some to be saved, and that where Christs ordinances be, there also where Christ’s ordinances be, there also Christ’s Church-presence is; And therefore I doubt much if the Church should be separated from, for the case is not here as with one simple person, for it is clear, all are not involved in that incorrigible obstinacy, and that is yet a true visible communion, in which we are to remain, for there is some union with the head Christ, where the faith is kept sound, and that visibly; though a private brother remaining sound in the faith, yet being scandalous and obstinately flagitious be to be cast off, as an heathen, yet are we not to deal so with an orthodox Church, where most part are scandalous. … 6. We may well hold that Ambrose says well (Commentary on Luke, bk. 6, ch. 1), that a Church wanting the foundation of the apostles is to be forsaken. … 8. There may be causes of non-union with a Church, which are not sufficient causes of separation: Paul would not separate from the Church of the Jews, though they rejected Christ, till they openly blasphemed, Acts 13:44-46; 18:16. And when they opposed themselves and blasphemed, Paul shook his raiment and said unto them, ‘Your blood be upon your own heads, I am clean, from henceforth I will go to the gentiles.’ There is a lawful separation, and yet before the Jews came to this, there was no just cause why any should have joined to the Church of the Jews, who denied the Messiah, and persecuted his servants, Acts 4-5, seeing there was a cleaner Church, to which converts might join themselves, Acts 2:40-42.”

— Samuel Rutherford, The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’, (London: Griffin, 1644), pt. 2, ch. 4, sect. 5, Question 3, In what cases it is lawful to separate from a Church?, pp. 253-55">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+There+is+a+separation+Negative%2C+or+a+non-union%2C+and+a+separation+Positive.+Though+a+Church+of+schismatics+retaining+the+sound+faith%2C+yet+separating+from+%5Bthe%5D+other+%5BChurch%5D%E2%80%A6+2.+If+the+whole+and+most+part+of+the+Church+turn+idolatrous%2C+and+worship+idols+%28which+is+essential+idolatry%29+we+are+to+separate+from+that+Church%3A+the+Levites+and+the+two+tribes+did+well%2C+as+Mr.+%5BJohn%5D+Ball+says%2C+to+make+a+separation+from+Jeroboam%E2%80%99s+calves%3B+and+the+godly+laudably%2C+2+Kn.+16%3A11%2C+did+not+separate+from+the+Israel+and+Church+of+God%2C+because+the+Altar+of+Damascus+was+set+up+and+because+of+the+high+places.+Things+dedicated+unto+idols%2C+as+Lutheran+images%2C+may+be+called%2C+and+are+called%2C+1+Cor.+10%3A34%2C+idolatry%2C+yet+are+they+idolatry+by+participation%2C+and+so+the+cup+of+devils%2C+1+Cor.+10.+Paul+does+not+command+separation+from+the+Church+of+Corinth+and+the+Table+of+the+Lord+there.+3rd+Consideration.+There+is+a+separation+from+the+Church+in+the+most+part%2C+or+from+the+Church+in+the+least+and+best+part.+In+Achab%E2%80%99s+time+Israel%2C+and+the+Church+thereof%2C+for+the+most+part%2C+worshipped+Baal%3B+Elijah%2C+Micaiah%2C+Obadiah%2C+and+other+godly+separated+from+the+Church+of+Israel+in+the+most+part%3A+Jeremiah+wished+to+have+a+cottage+in+the+wilderness+%28no+doubt+a+godly+wish%29+that+he+might+separate+from+the+Church+all+then+for+the+most+part+corrupted%2C+yet+remained+they+a+part+of+the+visible+Church+and+a+part+in+the+visible+Church%2C+and+therefore+did+he+not+separate+from+the+Church+according+to+the+least+and+best+part+thereof%3B+%5BNote+that+the+difference+above+is+over+fundamental+issues%2C+not+every+degree+of+purity+in+fundamentally+sound+churches.%5D+The+godly+in+England+who+refused+the+Popish+ceremonies+and+Antichristian+bishops+did+well+not+to+separate+from+the+visible+Church+in+England%2C+and+yet+they+separated+from+the+mainest+and+worst+part%2C+which+cannot+be+denied+to+be+a+ministerial+Church.+4th+Consideration.+If+a+Church+be+incorrigible+in+a+wicked+conversation%2C+and+yet+retain+the+true+faith+of+Christ%2C+it+is+presumed+God+has+there+some+to+be+saved%2C+and+that+where+Christs+ordinances+be%2C+there+also+where+Christ%E2%80%99s+ordinances+be%2C+there+also+Christ%E2%80%99s+Church-presence+is%3B+And+therefore+I+doubt+much+if+the+Church+should+be+separated+from%2C+for+the+case+is+not+here+as+with+one+simple+person%2C+for+it+is+clear%2C+all+are+not+involved+in+that+incorrigible+obstinacy%2C+and+that+is+yet+a+true+visible+communion%2C+in+which+we+are+to+remain%2C+for+there+is+some+union+with+the+head+Christ%2C+where+the+faith+is+kept+sound%2C+and+that+visibly%3B+though+a+private+brother+remaining+sound+in+the+faith%2C+yet+being+scandalous+and+obstinately+flagitious+be+to+be+cast+off%2C+as+an+heathen%2C+yet+are+we+not+to+deal+so+with+an+orthodox+Church%2C+where+most+part+are+scandalous.+%E2%80%A6+6.+We+may+well+hold+that+Ambrose+says+well+%28Commentary+on+Luke%2C+bk.+6%2C+ch.+1%29%2C+that+a+Church+wanting+the+foundation+of+the+apostles+is+to+be+forsaken.+%E2%80%A6+8.+There+may+be+causes+of+non-union+with+a+Church%2C+which+are+not+sufficient+causes+of+separation%3A+Paul+would+not+separate+from+the+Church+of+the+Jews%2C+though+they+rejected+Christ%2C+till+they+openly+blasphemed%2C+Acts+13%3A44-46%3B+18%3A16.+And+when+they+opposed+themselves+and+blasphemed%2C+Paul+shook+his+raiment+and+said+unto+them%2C+%E2%80%98Your+blood+be+upon+your+own+heads%2C+I+am+clean%2C+from+henceforth+I+will+go+to+the+gentiles.%E2%80%99+There+is+a+lawful+separation%2C+and+yet+before+the+Jews+came+to+this%2C+there+was+no+just+cause+why+any+should+have+joined+to+the+Church+of+the+Jews%2C+who+denied+the+Messiah%2C+and+persecuted+his+servants%2C+Acts+4-5%2C+seeing+there+was+a+cleaner+Church%2C+to+which+converts+might+join+themselves%2C+Acts+2%3A40-42.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%2C+%E2%80%98Acts+15%2C+A+Pattern+of+a+Juridicial+Synod%E2%80%99%2C+%28London%3A+Griffin%2C+1644%29%2C+pt.+2%2C+ch.+4%2C+sect.+5%2C+Question+3%2C+In+what+cases+it+is+lawful+to+separate+from+a+Church%3F%2C+pp.+253-55&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fddd1e27fbd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ddd1e27fbd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=1.%20There%20is%20a%20separation%20Negative,converts%20might%20join%20themselves%2C%20Acts%202%3A40%2D42&amp;text=1.%20There%20is%20a%20separation%20Negative%2C%20or%20a&amp;text=to%20which%20converts%20might%20join%20themselves%2C%20Acts%202%3A40%2D42" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

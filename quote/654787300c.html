<main class="wrap"><figure class="quote" id="q-654787300c" data-kw="">
<blockquote><p>Now, when the true God is known, and the certain and sure rule of worshipping him is understood, there is nothing more equal than that which God commandeth in his law, to wit, that those who bear rule with power (having abolished contrary superstitions) defend the pure worship of the true God. But seeing that the Romans did observe their rites only through pride and stubbornness, and seeing they had no certainty where there was no truth, they thought that this was the best way they could take if they should grant liberty to those who dwelt in the provinces to live as they listed. But nothing is more absurd than to leave the worship of God to men’s choice</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, trans. Henry Beveridge (repr. Bellingham, WA: Logos Bible Software, 2010), 2.192.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-698e135415" data-kw="Lord&#x27;s day resurrection">
<blockquote><p>The Lord’s day (kyriakē hēmera) in Christian usage is applied to the first day of the week, appointed for the public worship of God in memory of Christ’s resurrection. Now it is so called not so much with regard to the efficient (as if it was formally instituted by Christ himself, as the Lord’s Prayer and the Lord’s Supper are designated by the apostle, 1 Cor. 10:21). As will be seen afterwards, no argument can be given for such institution. With regard to the end, it was instituted in memory of the resurrection of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.14.1</span></figcaption>

<blockquote><p>I see some religious, and well affected women carried away with Erroneous opinions concerning this point; whose tender consciences have been abused by the mis-interpretations of some ignorants to be drawn to hold that this covering must be absolute; and total, and perpetual, so as if any hair at all be seen, it is a violation of this charge and their duty; to which purpose they urge that verse 15 as a full commentary upon this text, that the hair was given the woman for a covering; and upon this ground they are apt to censure them who take liberty to expose any of their hair, though never so moderately to others view… That I may therefore lay some grounds of this my just determination, know first that in the use of garments and these outward appendances of the body there is much latitude and variety according to the several guises of nations, and degrees of persons: there are countries the extremity of whose cold climate is such that it is no boot to bid both sexes be covered, yea muffled up, for their own safety; there are others so scorching that will hardly admit of any covering either for head or body; there are some whose hair is so large, that is able to hide them, there are others whose curled heads are alike short in both sexes, and give no advantage to the covering of either: he that made these differences of climates and people has not thought fit to confine them to one universal rule, only contenting himself with a general prescription of decency which in all countries must be regulated according to the custom or convenience of the place. For certainly these sacred ceremonies must follow the rule of the civil, for that which is held a token of subjection to our princes and other superiors, in all countries is so used in the service of the King above all gods: the Turks and all Mahumetans therefore not uncovering their heads to their Bashaes, or their Grand Lord; keep their heads covered in their devotions: and only by bowing or prostration testify their humble subjection to God. The French Divines preach with their hats on, ours uncovered; both pretend good reason; and custom for these contrary fashions; neither are either of them to be censured as faulty, and exorbitant: and with us we hold the head uncovered if the hat be off, though the cap be on: others make no difference if there be ought at all on the head.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall</cite>, … (London, 1660), The Women’s Vail, or a Discourse concerning the Necessity or Expedience of the Close-Covering of the Heads of Women… Occasioned by an offence unjustly taken at a Modest Dress, pp. 241-42</span></figcaption>

</figure><figure class="quote" id="q-6f6a68c3d1" data-kw="">
<blockquote><p>Before the coming of his well-beloved Son in the flesh, severely He punished all such as durst enterprise to alter or change his ceremonies and statutes, as in Saul, Uzziah, Nadab, Abihu, is to be read. And will He now, after that He has opened his counsel to the world by his only Son, whom He commands to be heard, and after that by his Holy Spirit, speaking by his apostles, He has established the religion in which He will his true worshippers abide to the end, will He now I say admitt men’s inventions in the matter of religion, etc.? For this sentence he prouounces: Not that which seems good in thy eyes, shalt thou do to the Lord thy God, but that which the Lord thy God commanded thee, that do thou: Add nothing unto it, diminish nothing from it. Which sealing up his New Testament He repeats in these words: ‘That which ye have, hold till I come,’ etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“A Letter to the Queen Dowager, Regent of Scotland</cite>, 1556” in The Works of John Knox, ed. David Laing (Edinburgh: James Thing, 1845), pp. 69-84. Also quoted in George Gillespie, English-Popish Ceremonies (1637), bk. 3, ch. 7, section 11, pp. 118-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-0ce027ab35" data-kw="">
<blockquote><p>There is a twofold intention in worship, one formal and properlly religious, and is expounded moral, ex natura rei [out of the nature of the thing], to be religious, it being such an intention, as can have no other state in worship, but a religious state… an intrinsical intention, ex natura et conditione operis [out of the nature and condition of the work], to worship… But there is another intention not religious: if a child read a chapter of the Bible, that he may learn to read and spell, that is an action of art, not of worship; because the object of the child’s reading is not Scripture as Scripture, but only the printed characters as they are, Signa rerum ut rerum, non ut rerum sacrarum, ‘signs of things, not of holy things’, and here the object not being religious, the intrinsical operation cannot raise up any religious intention of the child… the latter intention of the worker, is so far extraneous to worship, as whether it be, or be not, the nature of worship is not impaired nor violated. Hence, adoration is worship, but every worship is not adoration… all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly, either of God, or of these means; it is lawful to tremble at the Word, and for Josiah to weep before the Book of the Law read, and for the martyrs to kiss the stake as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646) | Introduction, pp. 88-89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>
<div class="actions"><button class="copy" data-copy="“There is a twofold intention in worship, one formal and properlly religious, and is expounded moral, ex natura rei [out of the nature of the thing], to be religious, it being such an intention, as can have no other state in worship, but a religious state… an intrinsical intention, ex natura et conditione operis [out of the nature and condition of the work], to worship… But there is another intention not religious: if a child read a chapter of the Bible, that he may learn to read and spell, that is an action of art, not of worship; because the object of the child’s reading is not Scripture as Scripture, but only the printed characters as they are, Signa rerum ut rerum, non ut rerum sacrarum, ‘signs of things, not of holy things’, and here the object not being religious, the intrinsical operation cannot raise up any religious intention of the child… the latter intention of the worker, is so far extraneous to worship, as whether it be, or be not, the nature of worship is not impaired nor violated. Hence, adoration is worship, but every worship is not adoration… all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly, either of God, or of these means; it is lawful to tremble at the Word, and for Josiah to weep before the Book of the Law read, and for the martyrs to kiss the stake as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God:”

— Samuel Rutherford, The Divine Right of Church Government (London, 1646) | Introduction, pp. 88-89">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+a+twofold+intention+in+worship%2C+one+formal+and+properlly+religious%2C+and+is+expounded+moral%2C+ex+natura+rei+%5Bout+of+the+nature+of+the+thing%5D%2C+to+be+religious%2C+it+being+such+an+intention%2C+as+can+have+no+other+state+in+worship%2C+but+a+religious+state%E2%80%A6+an+intrinsical+intention%2C+ex+natura+et+conditione+operis+%5Bout+of+the+nature+and+condition+of+the+work%5D%2C+to+worship%E2%80%A6+But+there+is+another+intention+not+religious%3A+if+a+child+read+a+chapter+of+the+Bible%2C+that+he+may+learn+to+read+and+spell%2C+that+is+an+action+of+art%2C+not+of+worship%3B+because+the+object+of+the+child%E2%80%99s+reading+is+not+Scripture+as+Scripture%2C+but+only+the+printed+characters+as+they+are%2C+Signa+rerum+ut+rerum%2C+non+ut+rerum+sacrarum%2C+%E2%80%98signs+of+things%2C+not+of+holy+things%E2%80%99%2C+and+here+the+object+not+being+religious%2C+the+intrinsical+operation+cannot+raise+up+any+religious+intention+of+the+child%E2%80%A6+the+latter+intention+of+the+worker%2C+is+so+far+extraneous+to+worship%2C+as+whether+it+be%2C+or+be+not%2C+the+nature+of+worship+is+not+impaired+nor+violated.+Hence%2C+adoration+is+worship%2C+but+every+worship+is+not+adoration%E2%80%A6+all+bodily+worship+or+expression+of+our+affection+to+the+means+of+graces+%28though+these+means+be+but+creatures%29+is+not+adoration+properly%2C+either+of+God%2C+or+of+these+means%3B+it+is+lawful+to+tremble+at+the+Word%2C+and+for+Josiah+to+weep+before+the+Book+of+the+Law+read%2C+and+for+the+martyrs+to+kiss+the+stake+as+the+instrument+by+which+they+glorified+God+in+dying+for+the+truth%3B+all+these+being+objectam+quo%2C+and+%E2%80%98means+by+the+which%E2%80%99+they+conveyed+their+worship+to+the+true+God%2C+and+natural+and+lawful+expressions+of+their+affection+to+God%3A%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government+%28London%2C+1646%29+%7C+Introduction%2C+pp.+88-89&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0ce027ab35.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0ce027ab35.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-veneration-as-distinguished-from-the-worship-of-adoration/#:~:text=There%20is%20a%20twofold%20intention%20in,expressions%20of%20their%20affection%20to%20God&amp;text=There%20is%20a%20twofold%20intention%20in%20worship%2C%20one&amp;text=and%20lawful%20expressions%20of%20their%20affection%20to%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-8c2bdfc123" data-kw="">
<blockquote><p>I. God made a double covenant with man, the one of works and the other of grace; the former before, the latter after the fall. II. The covenant of works was confirmed by a double sacrament, to wit, the Tree of Life, and the tree of the knowledge of good and evil both being planted in the midst of paradise. III. They had a double use. 1. That man’s obedience might be tried, by using of the one, and abstaining from the other. 2. That the Tree of Life might ratify eternal happiness to those that should obey, but the Tree of Knowledge should signify to the disobedient, the loss of the greatest happiness and the possession of the greatest mercy. IV. Therefore the Tree of Life was so called, not from any innate faculty it had to give life, but from a sacramental signification. V. Likewise the Tree of Knowledge of good and evil, had this denomination from signifying the chief good and evil and from the event. VI. The happiness of man being yet in his integrity, consisted chiefly in the image of God. …XIV. Man even in respect of his body was immortal, but not simply, as though his body being composed of the elements could not be resolved into its principles, but by Divine Covenant; not as thought it could not die, but because it had a possibility not to die….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b2afeedd80" data-kw="">
<blockquote><p>The law, then, as a covenant of works, does, in the most authoritative manner, demand from every descendant of Adam who is under it perfect holiness of nature, perfect righteousness of life, and complete satisfaction for sin. And none of the race of fallen Adam can ever enter heaven unless he either answers these three demands perfectly in his own person or accepts by faith the consummate righteousness of the second Adam, who “is the end of the law for righteousness to every one that believeth” (Rom. 10:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-07fc90e93b" data-kw="">
<blockquote><p>God’s covenant is a bargain which God hath made with men, in which God promises to men some good, and requires of them again, that they perform those things which he commands. And that covenant is either eternal or temporal. The eternal covenant is a covenant in which God promises men eternal life. And that is twofold: the covenant of works or the covenant of grace. The covenant of works, is a bargain of God made with men concerning eternal life, to which is both a condition of perfect obedience adjoined, to be performed by man, and also a threatening of eternal death if he shall not perform perfect obedience. Gen. 2. 17. The repetition of the covenant of works is made by God, Exod. 19. 5. Deut. 5. 2. 1. King. 8. 21. Heb. 8. 9. and that chiefly for four causes. That God by all means might stir up men to perform obedience. That every mouth might be stopped, and all the world might be made subject to the condemnation of God for not performing perfect obedience. Rom. 3. 19. That he might manifest mans sin, and naughtiness. Rom. 3. 19. 20. and 7. 7. 8. 9. 10. 11. That he might thrust us forward to seek to be restored in the covenant of grace. Gal. 3. 22. and 5. 23.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, trans. E. W. (London, 1595), 87–88. [Spelling modernized]</span></figcaption>

</figure><figure class="quote" id="q-0cdc556709" data-kw="">
<blockquote><p>As therefore I have showed in what sense the covenant of grace is called “the new covenant,” in this distinction and opposition, so I shall propose sundry things which relate unto the nature of the first covenant, which manifest it to have been a distinct covenant, and not a mere administration of the covenant of grace: — 1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 92</span></figcaption>

</figure><figure class="quote" id="q-41092742c7" data-kw="">
<blockquote><p>Therefore the nature of the human race, generated from the flesh of the one transgressor, if it is self-sufficient for fulfilling the law and for perfecting righteousness, ought to be sure of its reward, that is, of everlasting life, even if in any nation or at any former time faith in the blood of Christ was unknown to it. For God is not so unjust as to defraud righteous persons of the reward of righteousness… Man’s nature, indeed, was created at first faultless and without any sin; but that nature of man in which every one is born from Adam, now wants the Physician, because it is not sound. … This grace, however, of Christ, without which neither infants nor adults can be saved, is not rendered for any merits, but is given gratis, on account of which it is also called grace. ‘Being justified,’ says the apostle, ‘freely through His blood.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Nature and Grace, Against Pelagius</cite>, (415), 2, 3, 4 in NPNF1, 5: 122.</span></figcaption>

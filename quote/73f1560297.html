<blockquote><p>We are so constituted that whenever any event occurs we are necessarily led to ask a reason for it, or to believe that it was due to some cause. This fact in our mental constitution is the basis of the two methods of reasoning which are commonly known as the cosmological and the teleological arguments.

(a.) The cosmological argument. Every change is due to some cause. Let us see where this statement will lead us. We exist. We owe our existence to our parents. Our parents owe theirs to their parents, and so on. Unless we adopt Darwinism, we must conclude that the human race is eternal, or that the chain of which parent and child are the links terminates in our first parents. But we cannot believe that the human race is eternal, for this would be like supposing that one link of a chain is supported by the one above it, and that by the one above it, and so back to infinity. By a necessity of thought we must think of a first link which is fixed and which supports all the rest. So the chain of causes must bring us to the first man, the father of the human race, and he must be self-existent, or he must seek for a cause of his existence. How did he come into being?

Take other species of animal life. There is no evidence that any species has developed by gradual transition out of a lower species; so that, tracing the individuals of any species backward, we come, as in the case of man, to the first individuals of the species. And the question occurs again, What is the cause of their existence?

We are of necessity led to believe in the existence of a necessary self-existing First Cause; and unless we adopt the theory of evolution, we soon come to a point where it becomes necessary to look for that cause outside of matter. But were the hypothesis of evolution accepted, it would relieve us of no difficulty; for grant that the effects or changes in the material world can be traced back in a chain of finite causations till we come to an original ether, this ether is in motion or else it is at rest.

If it is in motion, the motion Is a change which demands a cause; and as an infinite series of finite causes is inconceivable, we must believe that matter is the originator of motion or is self-moved. But this is inconceivable. Plato argued, and we see no reason to doubt the correctness of his reasoning, that, since it is impossible for the mind to conceive of matter originating motion, there must be a mind as the first cause of motion.</p></blockquote>

<blockquote><p>Vers. 7. But we speak the wisdom of God in a mystery, even the hidden wisdom which God ordained, before the world, unto our glory.

The other part of the Comparison; The Wisdom of the Gospel, is the wisdom of the Living and Eternal God, because it was wisely contrived of God, and because in it the wonderful Wisdom of God is revealed, touching the Salvation and Redemption of men.

In a mystery] Comparison 4. Human Philosophy is common and obvious to every one that is indued with the gifts of Nature; but the Wisdom of the Gospel is a Mystery, or hidden wisdom, because it is not understood by natural reason, as Human Philosophy, but by Supernatural Revelation.

Before the world] Comparison 5. In the antiquity of it, the Wisdom of the Gospel is not of yesterday, but ordained of God before the world: But Human Philosophy is an invention lately found out, and not yet perfected or finished.

Glory] Comparison 6. The Wisdom of the Gospel appertains to Glory and Salvation, especially of us who live under grace: But Human Wisdom, compared with this, appertains not to salvation, but vain speculation.

Vers. 8. Which none of the Princes of this world knew: for had they known it, they would not have crucified the Lord of Glory.

Comparison 7. Human Wisdom may consist with the not knowing of Christ, but Divine Wisdom cannot. This comparison is confirmed by experience, because the chief heads of the Jews, and the Rulers of the Gentiles, (who in respect to their wisdom, seemed to get a name in the world) understood nothing of the Wisdom of the Gospel, which he proves by this instance, because had they known any thing of the Gospel, they had either out of reverence to the Divine Power, or out of fear been wary of Crucifying the Lord of Glory so ignominiously.

Vers. 9. But as it is written, Eye hath not seen, nor ear heard, neither hath entered into the heart of man, the things which God hath prepared for them that love him.

Comparison 8. By which he confirms and illustrates the fourth and sixth comparison: The object of Human Wisdom, is apprehended by the external senses, and the understanding, or the natural light of reason; but the object of that Wisdom which is unfolded in the Gospel, containing those things which Christ hath procured for us, (to be enjoyed in this present, and in the world to come) cannot be apprehended, either by the outward senses, or the understanding, founded in sensible things, or by the discourse of reason, without revelation, because the knowledge of it, (as Isaiah speaks, Chap. 64.4.) cannot come into the heart of man naturally. From all the parts of this comparison arises

Argum. 6. The Wisdom of the Gospel, which the plain way of preaching it, best opens, far excels all human wisdom, which only the wisdom of words (used for preaching) opens, and that with obscuring the wisdom of the Gospel: Therefore the preaching of the Gospel in simplicity, is for the best. The sum of all is, plainness of speech shews to the hearers the depth of the wisdom of God; but wisdome of words, shews how learned the Preacher is in human wisdome.</p></blockquote>

<blockquote><p>In chapter 1 we introduced the principle of proportionate causality (PPC), which states that whatever is in an effect must be in its cause, insofar as a cause cannot give what it does not first have. Let’s now examine this principle more carefully. Recall first that, stated more precisely, PPC holds that whatever is in an effect must be in its total cause in some way or other, whether formally, virtually, or eminently… PPC follows straightforwardly from the principle of causality (PC) and the principle of sufficient reason (PSR), both of which have been defended at length in earlier chapters. If there were some aspect of an effect that didn’t come from its total cause, then that would involve a potentiality that was actualized without anything doing the actualizing, which would violate PC. It would be an aspect of the effect that lacked any explanation, which would violate PSR.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius, 2017) | ch. 6, The Nature of God and of His Relationship to the World, p. 170</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In chapter 1 we introduced the principle of proportionate causality (PPC), which states that whatever is in an effect must be in its cause, insofar as a cause cannot give what it does not first have. Let’s now examine this principle more carefully. Recall first that, stated more precisely, PPC holds that whatever is in an effect must be in its total cause in some way or other, whether formally, virtually, or eminently… PPC follows straightforwardly from the principle of causality (PC) and the principle of sufficient reason (PSR), both of which have been defended at length in earlier chapters. If there were some aspect of an effect that didn’t come from its total cause, then that would involve a potentiality that was actualized without anything doing the actualizing, which would violate PC. It would be an aspect of the effect that lacked any explanation, which would violate PSR.”

— Edward Feser, Five Proofs of the Existence of God, (Ignatius, 2017) | ch. 6, The Nature of God and of His Relationship to the World, p. 170">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+chapter+1+we+introduced+the+principle+of+proportionate+causality+%28PPC%29%2C+which+states+that+whatever+is+in+an+effect+must+be+in+its+cause%2C+insofar+as+a+cause+cannot+give+what+it+does+not+first+have.+Let%E2%80%99s+now+examine+this+principle+more+carefully.+Recall+first+that%2C+stated+more+precisely%2C+PPC+holds+that+whatever+is+in+an+effect+must+be+in+its+total+cause+in+some+way+or+other%2C+whether+formally%2C+virtually%2C+or+eminently%E2%80%A6+PPC+follows+straightforwardly+from+the+principle+of+causality+%28PC%29+and+the+principle+of+sufficient+reason+%28PSR%29%2C+both+of+which+have+been+defended+at+length+in+earlier+chapters.+If+there+were+some+aspect+of+an+effect+that+didn%E2%80%99t+come+from+its+total+cause%2C+then+that+would+involve+a+potentiality+that+was+actualized+without+anything+doing+the+actualizing%2C+which+would+violate+PC.+It+would+be+an+aspect+of+the+effect+that+lacked+any+explanation%2C+which+would+violate+PSR.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Five+Proofs+of+the+Existence+of+God%2C+%28Ignatius%2C+2017%29+%7C+ch.+6%2C+The+Nature+of+God+and+of+His+Relationship+to+the+World%2C+p.+170&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fed958aa302.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ed958aa302.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-particular-metaphysical-issues/#:~:text=In%20chapter%201%20we%20introduced%20the,any%20explanation%2C%20which%20would%20violate%20PSR&amp;text=In%20chapter%201%20we%20introduced%20the%20principle%20of&amp;text=that%20lacked%20any%20explanation%2C%20which%20would%20violate%20PSR" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-51661f2fec" data-kw="">
<blockquote><p>What did John Calvin (1509– 64) know of Thomas Aquinas’s (d. 1274) theology? Did he actually read the Angelic Doctor’s work, or is his knowledge of Aquinas a mediated knowledge? And in the end did he understand what he encountered?… The older scholarship was generally optimistic about Calvin’s firsthand familiarity with Aquinas’s work… I argue that when citing Thomas, Calvin was not engaging Aquinas through a firsthand reading of his work. Rather, he received a mediated knowledge of Thomas from secondary sources. Even more, the evidence suggests that the secondary lens arises from the nominalist school of thought and refracts Thomas’s position in a direction more according to this school, in which human merit plays a stronger role in explaining the doctrine of predestination than Thomas himself believes. In the end, I conclude that Aquinas is of little to no importance to Calvin, with Calvin having very little firsthand knowledge of the Angelic Doctor’s thought.</p></blockquote>

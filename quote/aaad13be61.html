<main class="wrap"><figure class="quote" id="q-aaad13be61" data-kw="">
<blockquote><p>If the soul of the blessed Virgin had never been stained with the contagion of original sin, this would derogate from the dignity of Christ, according to which He is the universal Savior of all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Sin &amp; its Distinctions’ (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, pp. 11-13 Latin | Likewise, to the 2nd:</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-475301f5c2" data-kw="">
<blockquote><p>If the question brought before the Vatican Council had been of a purely spiritual nature, had the bishops been only required to affirm such a doctrine as the Assumption of the Virgin Mary—that is to say, to assert a historical fact without a particle of evidence—I do not think many would have rebelled. It was because the doctrine of the Pope&#x27;s personal Infallibility had bearings on the practical business of this world; because its assertion was supposed to be intended for the preservation or recovery of the Pope&#x27;s temporal sovereignty; because the claim would enable him to interfere with more effect on questions of toleration, civil liberty, marriage, and education, that so much difficulty was made about conceding it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture VI</span></figcaption>

</figure><figure class="quote" id="q-53e918709b" data-kw="">
<blockquote><p>The Virgin Mary… completely sanctified by the grace and blood of her only Son and abundantly endowed by the gift of the Holy Spirit and preferred to all… now lives happily with Christ in heaven and is called and remains ever-Virgin and Mother of God.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-cd6919bbc4" data-kw="">
<blockquote><p>We also acknowledge it most fitting that she remained in perpetual virginity, untouched by man, not only before giving birth, but also after giving birth, until the end of her life; and that this was disposed by the special providence of God, that she should indeed be given in true marriage to a man, but one who, endowed by God with the gift of continence, after he understood, by the warning of an angel, that she had conceived the Holy One of God from the Holy Spirit, as he was pious and just, never attempted anything against that vessel of the Holy Spirit.</p></blockquote>

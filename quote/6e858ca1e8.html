<blockquote><p>V. Our sponsor (as stated) is Christ Jesus, the only-begotten Son of God and himself God blessed forever, according to both natures. The principle which [acts] is indeed his person; the principle by which [he acts] is his nature, both human and divine. Hence there was entirely a communion in the work, but a distinction of power and mode in the operating natures. The passion formally belonged to the human nature; its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. by AI by Onku (Utrecht, 1650) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-mediator-prophet-and-king/kingly-office.html">Kingly Office</a></span></div>

<blockquote><p>Meanwhile, we believe and confess the force of this union of the natures in the person of Christ to be so great: that first, whatsoever Christ is or does, according to the divine nature, that same, whole Christ, the Son of man, may be said to be, or to do: and again, whatsoever Christ does or suffers according to his human nature, that same, whole Christ the Son of God, God Himself, is said in the holy Scriptures, to be, to do, and to suffer. As that: God (that is Christ, man and God) redeemed the Church with his blood: Acts 20:28, whenas the force of the redemption pertained to the Godhead, the shedding of his blood only to the manhood. Yet both these actions are joined in one, and each of them may be spoken alike of whole Christ: although they were and are distinct, because the natures, although distinct yet are coupled together in Christ’s one Person. Yea Christ the Mediator, according to his humanity never did or does anything, wherein his divinity did not or does not work together: and He never performed anything according to his divinity, whereunto his humanity was not assisting or consenting: that the Fathers very fitly called all the works of Christ the Mediator [theandric?], that is performed both by God and man.</p></blockquote>

</figure><figure class="quote" id="q-424a2efbc7" data-kw="">
<blockquote><p>He which is true God, the same is also true man, and in this unity there is no untruth, whereas there meet together the baseness of manhood and the excellency of the Godhead. For as God is not changed by the partaking, so man (that is man’s nature in Christ) is not consumed by the dignity, for each form works with communion of the other, their own property: namely the Word works that which is proper to the Word, and the flesh performs that which is proper to the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (1599) | But we believe and confess that these two natures, are truly and inseparably joined and united into one person of Christ: that yet we doubt not, but each of them remains whole and perfect, and the one truly distinct from the other, yea and that they do hold the essential properties and operations of each of them distinct: without all manner of confusion: so that as the divine nature holding the properties remains uncreated, infinite, immeasurable, simply omnipotent and simply wise: even so the human nature holding her’s remains created, comprehensible, and determined with certain limits: And as the divine nature has will and power, whereby Christ wills and works, as God, such things as are of God: so has the human nature will and power, whereby Christ as man, wills and works those things which are of man: so far forth as Christ in that He is God, He wills not nor works by human will or power: so neither as He is man, wills He or works He by divine will or power: as it has been learnedly determined by the fathers both against Eutyches and against Macarius. We therefore did always like well of that saying of Leo I [c. 400-461], Epistle 10 [28], ch. 4, writing unto Flavianus about the same thing, where he says:, ch. 11, ‘Of Christ the Redeemer’; pp. 61-2</span></figcaption>

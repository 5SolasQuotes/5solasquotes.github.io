<main class="wrap"><figure class="quote" id="q-42b0ccb0ee" data-kw="">
<blockquote><p>Johann Heinrich Heidegger (1633-1698) was one of the great Swiss theologians of the seventeenth century. He served as Professor of Theology at Zurich from 1667 to 1698. Heidegger is remembered for his leading role in the drafting of the Formula Consensus Helveticus, a document, although moderate in tone, intended to unite the Swiss churches against the innovative theology of Saumur. His Corpus Theologiae Christianae is a massive and learned presentation of orthodox Reformed dogmatics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Office of Doctor</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-a305adef80" data-kw="">
<blockquote><p>For God sends not private men, or Christian unofficed scholars (or if he do, their extraordinary sending makes them public pastors and prophets, not the people), but he sent Philip an evangelist, and after Peter and John to Samaria, Acts 8, Paul to Macedonia, Acts 16, and his own ministers, Titus 1:5; 1 Tim. 4:14 &amp; 5:22, Paul and Barnabas, men in office, some more than zealous Christians and scholars to the Gentiles, Acts 13, Jonah to Nineveh, Ananias to baptize Paul, Jonah 3; Acts 9.</p></blockquote>

</figure><figure class="quote" id="q-825ea3772a" data-kw="">
<blockquote><p>X. …What is essential to the ministry cannot be changed without making another ministry. But the essence remaining untouched, it does not cease to be the same ministry, although a varied and manifold change as to the accidents may have taken place. The essence of the ministry is placed in this–that all saving truth pertaining to the conservation of faith and piety be retained and taught; that the true sacraments instituted by Christ may be administered; and that the people may be held under a legitimate government. The accidents make its state good or bad. The good is when the preaching of the Word is pure and entire without any mixture of error or superstition; when the sacraments are rightly celebrated according to the institution of Christ without addition, or detraction, or alteration; and the Christian people are governed in a holy manner according to the Word of God and not in a tyrannical manner. The bad on the other hand is when the truth preached is mixed with errors and superstitions; the sacraments are in different way altered and corrupted; and the government is either confused or unjust and tyrannical… But still it must not be thought that the ministry ought at once to cease and be extinguished on account of any corruption whatsoever and depraved state; as life is not at once extinguished, but can subsist in the midst of weakness and disease.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, … (P&amp;R), vol. 3, Question 23, p. 218</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>3. Christ gives gifts to men now in the due use of means and not by miracle: Therefore He gives them in great diversity and by hard study and long time, Heb. 5:12, “For the time they ought to have been teachers,” etc. Therefore a novice must not be a bishop, but an elder [older person], whence the office had its name.</p></blockquote>

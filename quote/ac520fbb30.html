<blockquote><p>Some Citizens at Church prepar’d to pray; But (as they had been excommunicate) The good Church-wardens [lay grounds-keepers, regulated by Church and State] thrust them out the gate. Another country virtue I’ll repeat, The people’s charity was grown so great That whatsoever Londoner did die, In Church or Church-yard should not buried lie. Thus were they scorn’d, despised, banished, Excluded from the Church, alive, and dead, Alive, their bodies could no harbor have, And dead, not be allow’d a Christian grave: Thus was the Country’s kindness cold, and small, No house, no Church, no Christian burial. Oh Thou that on the winged winds dost sit And seest our misery, remedy it, Although we have deserv’d thy vengeance hot, Yet in thy jury (Lord) consume us not. But in thy mercies sheath thy slaying sword, Deliver us, according to thy word, Shut up thy quiver, stay thy angry rod That all the world may know Thou art our God, Oh open wide the gate of thy compassion Assure our souls that thou art our salvation. Then all our thoughts and words, and works, we’ll frame To magnify thy great and glorious Name, The ways of God, are intricate, no doubt Unsearchable, and pass man’s finding out, He at his pleasure worketh wond’rous things And in his hand doth hold the hearts of kings, And for the love, which to our king he bears, By sickness He our sinful Country clears, That he may be a Patron, and a guide Unto a people purg’d and purified.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-taylor.html">John Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Fearful Summer, or London’s Calamity, the Country’s Courtesy, and Both their Misery’</cite>, (Oxford, 1625) in All the Works of John Taylor, the Water-Poet Being Sixty and Three in number. Collected into one volume… (London, 1630), pp. 61-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><figure class="quote" id="q-7b42ef7128" data-kw="">
<blockquote><p>For they [the Independents] hold that although a congregation increase so much as that they cannot, or be so persecuted that they may not, meet safely in one place for the Word and sacraments, and supposing the Church of Jerusalem before the dispersion, Acts 8:1, to have been so numerous and to have accressed to so many thousands as could not receive the sacrament of the Lord’s Supper, nor ordinarily assemble into one place for the worship of God (that they received the Lord’s Supper in several companies and several houses is ordinarily collected from Acts 2:46, and breaking bread from house to house, which the Syriac expounds expressely of the Eucharist), Yet all this (say they) breaks not the Church, but they are still one particular church. Now if several companies of the same church assembled and receaving the Lord’s Supper in several places be not a breaking or dividing of the congregation, nor a deviation from the example of Christ, much less can they with any reason, charge our communicating by several companies at successive tables, in the same meeting place or assembly to be a breaking of the congregation or a deviation from Christ’s example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, pp. 221-22 of ch. 18, ‘Of the Use of a Table in the Lord’s Supper. And of the Communicants their Coming to &amp; Receiving at the Table’ in A Treatise of Miscellany Questions… (1649)</span></figcaption>

<blockquote><p>May 21, 1585 Wilsoun, Russell, Walker, put to Assize. Finds expedient that Thomas Wilsoun, traveler, presently infected with the pest[ilence] and in point of death, and also Margaret Russell and Jonet Walker, her daughter, be incontinent [not containing themselves] put to the knowledge of an assize [judgment] for having of the pest and known the same concealing thereof and repairing amongst our Sovereign Lord’s lieges [lands] openly, to the infection of some and hazard of many, and being found culpable in any point of the premises, to be immediately execut[ed] to the death at the Stray Mercat. … May 28, 1585 Masters of the College. The bailies and a part of the council being convened, and understanding be master Robert Rollock and master Duncane Nairne, masters of the College, that the whole students, through the fire and brute of the pestilence, has left the schools and thereby they have nothing to do, desiring therefore licence of the town to depart and use their friends for a season, offering to return to their cuir [chair?] and service whensoever the town shall think expedient, upon advertisement to be made in their names be master Alexander Guthre, their clerk. Which desire the said bailies and council thought reasonable, and therefore willingly granted and consented thereto.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c4d6862443" data-kw="">
<blockquote><p>Now, if these authorities, strengthened by those of the most rigid divines and moralists among the first reformers, such as Wyckliff, Luther, Melancthon, Erasmus, and a long train of divines, civilians and canonists, down to [Hugo] Grotius himself; I say, if these authorities will justify the setting aside that of Justinian and the Popish decretals, in favor of Valentinian and Theodosius, supported by almost all the primitive Fathers, the modern [Anglican] practice of refusing a divorce in cases of adultery must be allowed to be a barbarous and oppressive instance of the remains of priestcraft and popery…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-kenrick.html">William Kenrick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Observations, Civil &amp; Canonical, on the Marriage Contract, as Entered into Conformably to the Rites &amp; Ceremonies of the Church of England</cite>, (London, 1775), pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46f0d722fe" data-kw="">
<blockquote><p>Doubtless then, we may in a generality safely conclude that it is altogether unlawful for a child to sleight his parents consent in the choice of his marriage; There may be some particular cases incident wherein perhaps this may without sin or blame be forborn; as when: The child either by general permission, or former elocation shall be out of the parents’ disposing, or where the parent is defective in his intellectuals, or where the child lives in remotis, out of the compass of intelligence; or where the parent being averse from the true religion denies his consent to match with any but those of his own strain; or shall upon other by-occasions willfully stand upon so unreasonable terms that neither friends nor authority can overrule him; But where these or the like preponderating exceptions do not intervene, the child cannot without sin balk the parents’ consent to his choice in marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times</cite>, 4th Decade, Case 1, ‘Whether the Marriage of a Son or Daughter without or against the Parents’ Consent may be Accounted Lawful?’ in Cases of Conscience Practically Resolved Containing a Decision of the Principal Cases of Conscience of Daily Concernment &amp; Continual Use Amongst Men: Very Necessary for their Information &amp; Direction in These Evil Times (London, 1654), pp. 293-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“Doubtless then, we may in a generality safely conclude that it is altogether unlawful for a child to sleight his parents consent in the choice of his marriage; There may be some particular cases incident wherein perhaps this may without sin or blame be forborn; as when: The child either by general permission, or former elocation shall be out of the parents’ disposing, or where the parent is defective in his intellectuals, or where the child lives in remotis, out of the compass of intelligence; or where the parent being averse from the true religion denies his consent to match with any but those of his own strain; or shall upon other by-occasions willfully stand upon so unreasonable terms that neither friends nor authority can overrule him; But where these or the like preponderating exceptions do not intervene, the child cannot without sin balk the parents’ consent to his choice in marriage.”

>Share on X</a><a class="perma" href="../quote/46f0d722fe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/family/quotes-on-the-authority-of-fathers-in-giving-away-their-daughters-in-marriage/#:~:text=Doubtless%20then%2C%20we%20may%20in%20a,consent%20to%20his%20choice%20in%20marriage&amp;text=Doubtless%20then%2C%20we%20may%20in%20a%20generality%20safely&amp;text=the%20parents%E2%80%99%20consent%20to%20his%20choice%20in%20marriage" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-80835e15e7" data-kw="">
<blockquote><p>The reason why St. James would not have the ceremonies buried as soon as they were dead, was because the Jews had been so long confirmed in them, and bare such a love unto them; and he would purchase concord between them and the Gentile converts; though the Gentiles should bear with some inconvenience into the bargain, as not presently using all the liberty which through Christ they had a right unto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, 15:20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“The reason why St. James would not have the ceremonies buried as soon as they were dead, was because the Jews had been so long confirmed in them, and bare such a love unto them; and he would purchase concord between them and the Gentile converts; though the Gentiles should bear with some inconvenience into the bargain, as not presently using all the liberty which through Christ they had a right unto.”

— Matthew Poole, Commentary on Acts, 15:20-21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+reason+why+St.+James+would+not+have+the+ceremonies+buried+as+soon+as+they+were+dead%2C+was+because+the+Jews+had+been+so+long+confirmed+in+them%2C+and+bare+such+a+love+unto+them%3B+and+he+would+purchase+concord+between+them+and+the+Gentile+converts%3B+though+the+Gentiles+should+bear+with+some+inconvenience+into+the+bargain%2C+as+not+presently+using+all+the+liberty+which+through+Christ+they+had+a+right+unto.%E2%80%9D%0A%0A%E2%80%94+Matthew+Poole%2C+Commentary+on+Acts%2C+15%3A20-21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F80835e15e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/80835e15e7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-eating-and-drinking-blood/#:~:text=The%20reason%20why%20St.%20James%20would,Christ%20they%20had%20a%20right%20unto&amp;text=The%20reason%20why%20St.%20James%20would%20not%20have&amp;text=which%20through%20Christ%20they%20had%20a%20right%20unto" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-83e40f8274" data-kw="">
<blockquote><p>…who denies that the magistrate may command the husband and wife to do a duty to each other, the father not to provoke the son, the son not to disobey the father… the master and servant, the captaine and soldier to do a duty each, one to another? And there is a proper right and liberty, and power [in these relations] immediately given by God, without the king or magistrate’s interposing of their authority: to all these, the king’s authority makes not the man a father, nor the son subject to the father, nor the servant to the master, nor the soldier to the commander. God immediately made those powers, and God in the Law of Nature has given a power to the father over the son without the magistrate; yea, though there had never been a magistrate in the world… …now it no more follows that all fathers are equal to the magistrate, all masters, all captains to the king… for fathers, masters, captains, husbands have immediately from God in the Law of Nature a supreme, a high and independent authority… without any intervention of the will or authority of king or any earthly magistrate, and without any subordination as they are such to the prince. … 3. If the magistrate should usurp over husbands, and masters and fathers, their jus maritale, herile, paterum [right of marriage, being an heir, or a father], and spoil them of husband-power, and masterly and fatherly power, as our adversaries counsel the magistrate to take the spiritual right and power of the keys of the Kingdome of God from the Church and pastors, the former should complain, as do the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (London, 1646), ch. 25, pp. 568-69</span></figcaption>

</figure><figure class="quote" id="q-2949f0dfa9" data-kw="">
<blockquote><p>Secondly, the mate [spouse] must be fit… diverse men have many virtues, and yet do not fit to some women: and therefore we see many times, even the godly couples to jar when they are married, because there is some unfitness between them which makes odds. What is odds but the contrary to even?… From hence came the first use of the ring in weddings, to represent this evenness: for if it be straighter than the finger it will pinch, and if it be wider than the finger it will fall off; but if it be fit, it neither pinches nor slips: So they which are like strive not…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preparative to Marriage</cite>, (1591), pp. 30-31</span></figcaption>

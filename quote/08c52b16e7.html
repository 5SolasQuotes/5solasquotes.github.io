<main class="wrap"><figure class="quote" id="q-08c52b16e7" data-kw="">
<blockquote><p>Vers. 5. For unto which of the Angels said he at any time, Thou art my Son, this day have I begotten thee: And again, I will be to him a Father, and he shall be to me a Son? This last Argument the Apostle confirms with eight Reasons, whereof the seven first are taken out of so many places of Scripture.

Reas. 1. From Psal. 2.7. Concerning Christ, saith God the Father, Thou art my Son, this day have I begotten thee. From which place the Deity of Christ is proved, that he after another and higher manner is a Son, than any of the Angels: A Son, to wit, by eternal Generation, which is confirmed out of Act. 3.33. and Rom. 1.4. where this place is applied to the manifestation of the Deity of Christ, which he had from Eternity, before he was manifested in his Resurrection from the dead: For had not Christ been in himself a Son, he could not be declared a Son to the world: And although in Scripture, some things are said to be done when they are manifested:

And so, This day have I begotten thee, will be, This day have I declared thee to the world to be my only begotten Son: Yet [This day] ought not to signify only the time of Christ’s declaration, as a Son, but also his eternal and immutable Generation: For Eternity is very well expressed by This day, whereby the present day is signified, because Eternity is as one day, and always wholly present, wherein there is nothing successive, or one after another, as in our time, but one constant permanency. And here also he uses a word of the Pretertense, that although thou hearest of him as present, yet thou mayest understand his Generation perfectly past, or eternal, as the shining of the Sun is perfect, and yet it continually beams forth from the Sun: Therefore Christ is so much the more excellent above Angels, by how much a Son is more excellent than a Messenger.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 186.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ffeea9e3e5" data-kw="undivided external works">
<blockquote><p>Although the external works are undivided and equally common to the single persons (both on the part of the principle and on the part of the accomplishment), yet they are distinguished by order and by terms. For the order of operating follows the order of subsisting. As therefore the Father is from himself, so he works from himself; as the Son is from the Father, so he works from the Father; as the Holy Spirit is from both, so he works from both.</p></blockquote>

<blockquote><p>Which action of God [i.e. Creation], since it is voluntary, Rev. 4:11, is not proper to one person, but common to three, Gen. 1:26; Ps. 33:6; and therefore is attributed to the Father, Acts 4:24, to the Son, Jn. 1:3 &amp; 10, Col. 1:16; Heb. 1:2 &amp; 10, and to the Holy Spirit, Job 26:13; Ps. 95:5 with Heb. 3:7 &amp; 9, yet with a preserved order of acting: but more frequently to the Father, by a certain excellence; not indeed of nature or action, but of personal order: because the Father is the first person in order, from whom the other two have the origin of their person from eternity; and therefore creation, and similar divine actions, are usually referred to the Father as to the first person.</p></blockquote>

</figure><figure class="quote" id="q-ce1d6874c7" data-kw="">
<blockquote><p>We readily allow that there are mysteries in scripture which surpass our comprehension, and which we shall not perfectly understand even in heaven. At the same time, we maintain, that we have as much of these mysteries taught us, as is useful and necessary to be known. For instance, we do not comprehend the mysteries of the Incarnation and the Trinity — that is, how it can be, that there are three persons in one essence, and how God assumed human nature: but though the manner is unknown, the thing itself is plainly taught; which is all that is necessary to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 1.10, p. 49.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

</figure><figure class="quote" id="q-8a2877e5ef" data-kw="">
<blockquote><p>It is a pious saying that the Father is not limited by times: for the true meaning of the name of Father which He bore before time began surpasses comprehension. Although religion teaches us to ascribe to Him this name of Father through which comes the impassible origin of the Son, yet He is not bound in time, for the eternal and infinite God cannot be understood as having become a Father in time, and according to the teaching of the Gospel the Only-begotten God the Word is recognized even in the beginning rather to be with God than to be born. …

The essential likeness conformed to the Father’s essence in kind is also taught to be identical in time: lest He who is the image of God, who is the Word, who is God with God in the beginning, who is like the Father, by the insertion of times between Himself and the Father should not have in Himself in perfection that which is both image, and Word, and God. For if He be proclaimed to be younger in time, He has lost the truth of the image and likeness: for that is no longer likeness which is found to be dissimilar in time. For that very fact that God is Father prevents there being any time in which He was not Father: consequently there can be no time in the Son’s existence in which He was not Son. Wherefore we must neither call the Father older than the Son nor the Son younger than the Father: for the true meaning of neither name can exist without the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 24-25 in Nicene and Post-Nicene Fathers 2, 9: 10-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

<main class="wrap"><figure class="quote" id="q-27b38c5889" data-kw="">
<blockquote><p>And here also [regarding worship] we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship as are common and unseparable concomitants of both civil, natural, and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof, such as I take to be the seven individual proprieties of every man: forma, figura, locus, tempus, strips[?], patria, nomen. Under form and figure: The first two, I comprehend, such a proportion of body, a man of a high stature, or low; a man beautiful, or not beautiful, to which I crave leave to reduce all external forms of habits [garments], as clothes, the head covered, or not covered, the situation of the body, as they are in themselves, mere physical acts; kneeling, sitting, standing; the eyes cast down to the earth, or lifted up; the hands lifted up, or not lifted up, the knocking on the breast, or not knocking, motions of the soul, that are natural, time, place, family, country, name, as such a person… 1. All these are common concomitants of civil, natural, and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep, or civil, to declaim an oration before the people; or religious, to preach or pray, must be done by some persons, John or Thomas, men of some family, in some time, in some place, for they are not actions eternal, and so must be done in time and place, so the agents must have some habit, some gesture in the doing of all these actions, and they are unseparable adjuncts of all these actions, because neither actions natural, civil, nor religious, can be performed, but by some persons, in some habit and gesture, in some time, in some place: And lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common and unseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse, because Thomas prays in gown or cloak in this place, rather than that place (so it be not, locus ut sic, of intention, such a religious place, before the image of Christ, or the Father, or the Virgin Mary) the praying is neither the more, or the less acceptable to God because of these common and unseparable adjuncts… …to my knowledge all these that are mere physical circumstances, are particularly enumerated, such as are: 1. time: 2. place, 3. person, or agent: 4. name. 5. family: 6. condition, as country, family, house: 7. habits or garments: 8. gestures, as sitting, standing, lifting of the eyes or hands, knocking on the breast, kneeling, and there is no blind in this enumeration, for there be no other particulars that can be enumerated [that do not fall into one of these categories]…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction | section 1, pp. 2-3</span></figcaption>

<blockquote><p>As penitent sinners of various kinds were ordered to sit in the church ”bare-heidit all the tyme of the sermons,’¹ it would appear that the members of the congregation kept their hats on during that time. This is also implied by Knox’s statement that the Earl of Huntly pulled down his bonnet over his eyes when the preacher denounced certain vices.² In 1637, George Gillespie says: ‘A man coming into one of our churches in time of public worship, if he see the hearers covered, he knows, by this customable sign, that sermon is begun.”‘³ Thomas Kirk, an Englishman, who visited Dundee in 1677, says: “We heard a sermon at the greatest church; they first sing a psalm, and then the minister begins his prayer, and as soon as he has taken his text they all put on their hats.’† By the beginning of the eighteenth century many Scottish Presbyterians uncovered their heads during sermon.° The custom survived in the Scottish Church at Rotterdam until at least the last quarter of the nineteenth century. At one time the ministers of Scotland may have kept their hats on while preaching, as French and Dutch Protestant preachers did.ª ¹ Booke of the Universall Kirk, 2:692. ² Laing’s Knox, 2:362. ³ Dispute Against the English-Popish Ceremonies, 1637, part 3, p. 86. † Kirk and Thoresby’s Tours in Scotland, p. 19. — In England, during part of the seventeenth century, it was customary for the people to sit in church with their hats on, and to take them off when they sang the Psalms (Brand’s Popular Antiquities, Bohn’s ed., 2:323). Some lifted them at the name of Jesus [according to the Anglican custom] (Marsden’s Early Puritans, 1853, p. 347). ° An Examination of Three Prelatical Pamphlets, 1703, p. 18. ª “He [i.e. Alix] was bold and brisk in the pulpit, and when he read his text, he cocked his hatt; but Claud, when he put on his hat, slipped it on, and drew down the sides of it” (Wodrow’s Analecta, 2:273). ‘The ministers’ of the Church of Holland ‘are covered in the time of sermon’ (Lieut. -Col. Erskine to Wodrow in 1728, Edinburgh Christian Instructor, xxvii, 265). This custom was approved by at least one eminent English [Independent] Puritan. “Mr. [Philip] Nye told us his private judgement, that in preaching he thinks the minister should be covered, and the people discovered; but in the sacrament, the minister should be discovered, as a servant, and the guests all covered.” (Laing’s Baillie’s Letters, 2:149).</p></blockquote>

stom%5D+%28Marsden%E2%80%99s+Early+Puritans%2C+1853%2C+p.+347%29.+%C2%B0+An+Examination+of+Three+Prelatical+Pamphlets%2C+1703%2C+p.+18.+%C2%AA+%E2%80%9CHe+%5Bi.e.+Alix%5D+was+bold+and+brisk+in+the+pulpit%2C+and+when+he+read+his+text%2C+he+cocked+his+hatt%3B+but+Claud%2C+when+he+put+on+his+hat%2C+slipped+it+on%2C+and+drew+down+the+sides+of+it%E2%80%9D+%28Wodrow%E2%80%99s+Analecta%2C+2%3A273%29.+%E2%80%98The+ministers%E2%80%99+of+the+Church+of+Holland+%E2%80%98are+covered+in+the+time+of+sermon%E2%80%99+%28Lieut.+-Col.+Erskine+to+Wodrow+in+1728%2C+Edinburgh+Christian+Instructor%2C+xxvii%2C+265%29.+This+custom+was+approved+by+at+least+one+eminent+English+%5BIndependent%5D+Puritan.+%E2%80%9CMr.+%5BPhilip%5D+Nye+told+us+his+private+judgement%2C+that+in+preaching+he+thinks+the+minister+should+be+covered%2C+and+the+people+discovered%3B+but+in+the+sacrament%2C+the+minister+should+be+discovered%2C+as+a+servant%2C+and+the+guests+all+covered.%E2%80%9D+%28Laing%E2%80%99s+Baillie%E2%80%99s+Letters%2C+2%3A149%29.%E2%80%9D%0A%0A%E2%80%94+David+Hay+Fleming%2C+The+Reformation+in+Scotland%E2%80%A6+%28London%3A+Hodder+%26+Stoughton%2C+1910%29%2C+pp.+301-2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F10e4283e38.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/10e4283e38.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-post-reformation-scottish-church-on-head-coverings-in-public-worship/#:~:text=As%20penitent%20sinners%20of%20various%20kinds,all%20covered.%E2%80%9D%20%28Laing%E2%80%99s%20Baillie%E2%80%99s%20Letters%2C%202%3A149&amp;text=As%20penitent%20sinners%20of%20various%20kinds%20were%20ordered&amp;text=the%20guests%20all%20covered.%E2%80%9D%20%28Laing%E2%80%99s%20Baillie%E2%80%99s%20Letters%2C%202%3A149" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…(as that sex is prone to follow the fashion) and accordingly cast off their veils, and discovered their faces immodestly in the congregation, and thereby (as the apostle speaks) dishonored their heads; that is, were unseemly accoutred, and dressed on their head: which he proves by three Arguments; partly from nature, which having given women their hair for a covering, taught them to be covered, as a sign of subjection; the manner of this covering being to be measured by the custom of the nation: Lastly, by an argument à pari, from men, for whom even themselves being judges, it would be an uncomely thing to wear a vail, that is, a woman’s habit; so by the like reason, was it as uncomely for a woman to be without a vail, that is, in the guise and dress of a man. And howsoever the devils of the gentiles, sometimes took pleasure in uncomeliness, and absurd garbs and gestures; yet the God whom they worshipped with his holy angels, who were present at their devotions, loved a comely accommodation, agreeable to nature and custom, in such as worshipped him. For this cause therefore (says he) ought a woman to have a covering on her head, because of the angels. Lastly, he concludes it, from the example and custom both of the Jewish and Christian Churches, neither of which had any such use, for their women to be unveiled in their sacred assemblies: If any man (says he) be contentious, (that is, will not be satisfied with these reasons) let him know, that we, (that is, we of the circumcision) have no such custom, nor the Church of God. For so, with St. Ambrose, Anselm, and some of the ancients, I take the meaning of the apostle to be in those words.</p></blockquote>

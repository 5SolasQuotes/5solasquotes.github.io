<main class="wrap"><figure class="quote" id="q-9a0844b443" data-kw="">
<blockquote><p>In administering discipline. Overseers have the task of seeing that Christian discipline is correctly exercised. You see, in Scripture, true believers are called not only sons and daughters of God but also children — even little children (1 John 2:1). We know that in a well-ordered household in which God’s ordinances are followed, not only are children admonished but a rod is also prepared for those who fail to heed the warnings (Prov. 2:15; 13:24). God has ordered his house in the same way (1 Tim. 3:15) and regulates matters in such a way that in addition to his Word of admonition, there is also the rod of his discipline (1 Cor. 4:21).

Discipline must be applied with discrimination and care, according to the nature of the offense and the persistence of sinning, if we wish to maintain good order in God’s house and advance godliness among believers. Moses says of the law he was given that the word was not a vain thing for the people (Deut. 32:47). Likewise, we also say that the rod of discipline was not a vain thing. Our wise and good God and Savior has not instituted discipline for us for any reason other than that it is highly necessary for the welfare of his Christian flock, even under the gospel.</p></blockquote>

<blockquote><p>Our divines from Scripture make three degrees of excommunication:

1. A debarring from the Lord’s Supper, Mt. 5:24, but it is not indeed a delivering to Satan or excommunication: this is called the lesser excommunication.

2. A delivering to Satan, the greater excommunication, 1 Cor. 5:3-4, of this we speak here especially.

3. Maranatha in the Syriac, is an utter cursing till Christ’s Second Coming.</p></blockquote>

</figure><figure class="quote" id="q-ba378cd46f" data-kw="">
<blockquote><p>4. Concerning the tenth Proposition (which will be most questioned), I desire it may be observed:

1. That we meddle not with the term ‘excommunication.’

2. And therefore they that say we meddle with the thing, must define excommunication, and show that the work that we here agree on does reach that definition.

3. Which if they do, then they will make excommunication to be no more than this application of Christ’s doctrine to a particular person and case, which every minister of the Gospel may perform: For we mention in our Agreement no more.

4. I am sure that delivering up to Satan, and the great anathematizing excommunication is commonly taken to go much further and contain more than we here conclude on.

5. Yet observe that we here suppose the fact and faultiness proved beyond doubt: and when we speak of ministers applicatory requiring the avoidance of such persons, if any think we wrongfully authorize him to do this without the presbytery, congregation, or bishop; remember that we speak not here of examining witnesses, much less giving them their oaths, or the like preparation for discovery of the guilt. How far people or any others may have a hand in this we do not determine.

6. Nor do we determine whether it must needs be more ministers than one that must agree in this before the public application: yet afterward we have limited ourselves in this for unity, peace and avoiding of rash applications.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653) | An Explication of Some Passages in the Propositions, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><figure class="quote" id="q-1d5833088b" data-kw="">
<blockquote><p>Let us take notice, then, that in excommunicating this limitation be observed — that this part of discipline be exercised by the common counsel of the elders, and with the consent of the people, and that this is a remedy in opposition to tyranny. For nothing is more at variance with the discipline of Christ than tyranny, for which you open a wide door, if you give one man the entire power.</p></blockquote>

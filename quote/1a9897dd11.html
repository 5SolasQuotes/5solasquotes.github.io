<main class="wrap"><figure class="quote" id="q-1a9897dd11" data-kw="">
<blockquote><p>As we said above, so now we repeat, that the divine generation must not be compared to the nature of men, nor the Son considered to be part of God, nor the generation to imply any passion whatever; God is not as man; for men beget passibly, having a transitive nature, which waits for periods by reason of its weakness. But with God this cannot be; for He is not composed of parts, but being impassible and simple, He is impassibly and indivisibly Father of the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Four Discourses against the Arians,” in St. Athanasius</cite>, ed. Philip Schaff and Henry Wace, trans. John Henry Newman and Archibald T. Robertson, vol. 4, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Christian Literat</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

<blockquote><p>We say that the Godhead is absolutely of itself. And hence also we hold that the Son, regarded as God, and without reference to person, is also of himself; though we also say that, regarded as Son, he is of the Father. Thus his essence is without beginning, while his person has its beginning in God.</p></blockquote>

<blockquote><p>XIX. The glory of his Person may be considered, partly in reference to the divine nature; partly, to the human. The former is nothing else than a most illustrious assertion, vindication, and display of the Divine majesty of Christ, reflected from the glory of the human nature. During his abode on the earth, the Son of God had so concealed his glory under the vail of his humbled flesh, that only a few faint rays, despised by the generality of spectators, appeared. But now, in his glorified humanity, he shines forth like the sun, having, by his bright and exalted lustre, dispelled the clouds of his obscure and debased condition; and declares, in a striking and glorious manner, that the Son of man is the Son of God, and truly God. This was the matter of his request in the following solemn prayer: “And now, O Father, glorify thou me with thine own self, with the glory which I had with thee, before the world was.” That is, “Gloriously declare that I am thine eternal and only-begotten Son:”—which the Father has done chiefly by setting him at his right hand, as the place of the highest dignity and glory.</p></blockquote>

<blockquote><p>CANON 4. If anyone maintains that God awaits our will to be cleansed from sin, but does not confess that even our will to be cleansed comes to us through the infusion and working of the Holy Spirit, he resists the Holy Spirit himself who says through Solomon, “The will is prepared by the Lord” (Prov. 8:35, LXX), and the salutary word of the Apostle, “For God is at work in you, both to will and to work for his good pleasure” (Phil. 2:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/second-council-of-orange.html">Second Council of Orange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canons And Decrees Of The Second Council Of Orange</cite>, (AD 529)</span></figcaption>

— Second Council of Orange, Canons And Decrees Of The Second Council Of Orange, (AD 529)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCANON+4.+If+anyone+maintains+that+God+awaits+our+will+to+be+cleansed+from+sin%2C+but+does+not+confess+that+even+our+will+to+be+cleansed+comes+to+us+through+the+infusion+and+working+of+the+Holy+Spirit%2C+he+resists+the+Holy+Spirit+himself+who+says+through+Solomon%2C+%E2%80%9CThe+will+is+prepared+by+the+Lord%E2%80%9D+%28Prov.+8%3A35%2C+LXX%29%2C+and+the+salutary+word+of+the+Apostle%2C+%E2%80%9CFor+God+is+at+work+in+you%2C+both+to+will+and+to+work+for+his+good+pleasure%E2%80%9D+%28Phil.+2%3A13%29.%E2%80%9D%0A%0A%E2%80%94+Second+Council+of+Orange%2C+Canons+And+Decrees+Of+The+Second+Council+Of+Orange%2C+%28AD+529%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F795d750eda.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/795d750eda.html">Permalink</a><a class="src" href="https://heidelblog.net/2022/09/second-council-of-orange-on-the-work-of-the-holy-spirit/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-cb6cb6008b" data-kw="">
<blockquote><p>[226] The special qualification of the second person in the Trinity is filiation. In Scripture he bears several names that denote his relation to the Father, such as word, wisdom, logos, son, the firstborn, only-begotten and only son, the image of God, image (εἱκων), substance (ὑποστασις), stamp (χαρακτηρ) [cf. Heb. 1:3]. The doctrine of “eternal generation” (αἰωνος γεννησις), so called for the first time by Origen, was based on these names and a few texts cited above. In using these terms we are of course speaking in a human and hence an imperfect language, a fact that makes us cautious. Yet we have the right to speak this language. For just as the Bible speaks analogically of God’s ear, eye, and mouth, so human generation is an analogy and image of the divine deed by which the Father gives the Son “to have life in himself.” But when we resort to this imagery, we must be careful to remove all associations with imperfection and sensuality from it. The generation of a human being is imperfect and flawed. A husband needs a wife to bring forth a son. No man can ever fully impart his image, his whole nature, to a child or even to many children. A man becomes a father only in the course of time and then stops being a father, and a child soon becomes wholly independent from and self-reliant vis-à-vis his or her father. But it is not so with God. Generation occurs also in the divine being. God’s fecundity is a beautiful theme, one that frequently recurs in the church fathers. God is no abstract, fixed, monadic, solitary substance, but a plenitude of life. It is his nature (οὐσια) to be generative (γεννητικη) and fruitful (καρπογονος). It is capable of expansion, unfolding, and communication. Those who deny this fecund productivity fail to take seriously the fact that God is an infinite fullness of blessed life. All such people have left is an abstract deistic concept of God, or to compensate for this sterility, in pantheistic fashion they include the life of the world in the divine being. Apart from the Trinity even the act of creation becomes inconceivable. For if God cannot communicate himself, he is a darkened light, a dry spring, unable to exert himself outward to communicate himself to creatures. Still, that generation is to be conceived in divine terms. In the first place, it is spiritual The Arians, in opposing the idea of divine generation, objected that all generation necessarily brings along with it separation (τομη) and division (διαιρεσις), passion (παθος) and emanation (ἀπορροια). And that would be correct if it were physical, sensual, and creaturely. But it is spiritual, divine, and therefore simple, without division (ἀρρευστως) or separation (ἀδιαιρετως). It occurs without flux and division. While giving rise to distinction and distribution in the divine being, it does not create divergence and division. Athanasius writes: “Inasmuch as God is simple, the Father of the Son is indivisible and without passion, for although in the case of humans we speak of outflow and inflow, we cannot predicate these things of anything that is incorporeal.”120 The most striking analogy of divine generation is thought and speech, and Scripture itself suggests this when it calls the Son “Logos” [Speech, Word, Reason]. Just as the human mind objectivizes itself in speech, so God expresses his entire being in the Logos [Christ]. But here, too, we must note the difference. Humans need many words to express their ideas. These words are sounds and therefore material, sense-related. They have no existence by themselves. But when God speaks, he totally expresses himself in the one person of the Logos, whom he also “granted to have life in himself” (John 5:26 NIV). In the second place, therefore, divine generation implies that the Father begets the Son out of the being of the Father, “God of God, Light of Light, very God of very God; begotten, not made, being of one substance with the Father,” as the Nicene symbol has it. The Arians, by contrast, contended that the Son had been brought forth by the will of the Father out of nothing. This, however, is not generation but creation, as John of Damascus points out. Creation is “the bringing into being, from the outside and not from the substance of the Creator, of something created and made entirely dissimilar [in substance],” while “begetting” means “producing of the substance of the begetter an offspring similar in substance to the begetter.” The Son is not a creature but he is “God over all, forever praised!” (Rom. 9:5 NIV). Accordingly, he was not brought forth by the will of the Father out of nothing and in time. Rather, he is generated out of the being of the Father in eternity. Hence, instead of viewing “generation” as an actual work, a performance (ἐνεργεια), of the Father, we should ascribe to the Father “a generative nature” (φυσις γεννητικη). This is not to say, of course, that the generation is an unconscious and unwilled emanation, occurring apart from the will and power of the Father. It is not an act of an antecedent decreeing will, like creation, but one that is so divinely natural to the Father that his concomitant will takes perfect delight in it. It is a manifestation of what is truly expressive of his nature and essence, and therefore also of his knowledge, will, and power, in fact of all his virtues. In the third place, therefore, the church confesses its belief in the eternal character of this generation. The Arians said that there was a time when the Son did not exist (ἠν ποτε ὁτε οὐκ ἠν). They appealed especially to the words “he brought me forth,” or “created me” in Proverbs 8:22, and pointed out the antinomy between the terms “eternal” (αἰωνος) and “begetting” (γεννησις). But if the “Father” and the “Son” bear their names in a metaphysical sense, as Scripture incontrovertibly teaches, it follows that the generation in question has to be eternal as well. For if the Son is not eternal, then of course God is not the eternal Father either. In that case he was God before he was Father, and only later—in time—became Father. Hence, rejection of the eternal generation of the Son involves not only a failure to do justice to the deity of the Son, but also to that of the Father. It makes him changeable, robs him of his divine nature, deprives him of the eternity of his fatherhood, and leaves unexplained how God can truly and properly be called “Father” in time if the basis for calling him “Father” is not eternally present in his nature. We must, accordingly, conceive that generation as being eternal in the true sense of the word. It is not something that was completed and finished at some point in eternity, but an eternal unchanging act of God, at once always complete and eternally ongoing. Just as it is natural for the sun to shine and for a spring to pour out water, so it is natural for the Father to generate the Son. The Father is not and never was ungenerative; he begets everlastingly. “The Father did not by a single act beget the Son and then release him from his ‘genesis,’ but generates him perpetually.” For God to beget is to speak, and his speaking is eternal. God’s offspring is eternal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, transl. John Bolt, and John Vriend (Grand Rapids, MI: Baker Academic, 2004), 2.308–310.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“[226] The special qualification of the second person in the Trinity is filiation. In Scripture he bears several names that denote his relation to the Father, such as word, wisdom, logos, son, the firstborn, only-begotten and only son, the image of God, image (εἱκων), substance (ὑποστασις), stamp (χαρακτηρ) [cf. Heb. 1:3]. The doctrine of “eternal generation” (αἰωνος γεννησις), so called for the first time by Origen, was based on these names and a few texts cited above. In using these terms we are of course speaking in a human and hence an imperfect language, a fact that makes us cautious. Yet we have the right to speak this language. For just as the Bible speaks analogically of God’s ear, eye, and mouth, so human generation is an analogy and image of the divine deed by which the Father gives the Son “to have life in himself.” But when we resort to this imagery, we must be careful to remove all associations with imperfection and sensuality from it. The generation of a human being is imperfect and flawed. A husband needs a wife to bring forth a son. No man can ever fully impart his image, his whole nature, to a child or even to many children. A man becomes a father only in the course of time and then stops being a father, and a child soon becomes wholly independent from and self-reliant vis-à-vis his or her father. But it is not so with God. Generation occurs also in the divine being. God’s fecundity is a beautiful theme, one that frequently recurs in the church fathers. God is no abstract, fixed, monadic, solitary substance, but a plenitude of life. It is his nature (οὐσια) to be generative (γεννητικη) and fruitful (καρπογονος). It is capable of expansion, unfolding, and communication. Those who deny this fecund productivity fail to take seriously the fact that God is an infinite fullness of blessed life. All such people have left is an abstract deistic concept of God, or to compensate for this sterility, in panth as the Nicene symbol has it. The Arians, by contrast, contended that the Son had been brought forth by the will of the Father out of nothing. This, however, is not generation but creation, as John of Damascus points out. Creation is “the bringing into being, from the outside and not from the substance of the Creator, of something created and made entirely dissimilar [in substance],” while “begetting” means “producing of the substance of the begetter an offspring similar in substance to the begetter.” The Son is not a creature but he is “God over all, forever praised!” (Rom. 9:5 NIV). Accordingly, he was not brought forth by the will of the Father out of nothing and in time. Rather, he is generated out of the being of the Father in eternity. Hence, instead of viewing “generation” as an actual work, a performance (ἐνεργεια), of the Father, we should ascribe to the Father “a generative nature” (φυσις γεννητικη). This is not to say, of course, that the generation is an unconscious and unwilled emanation, occurring apart from the will and power of the Father. It is not an act of an antecedent decreeing will, like creation, but one that is so divinely natural to the Father that his concomitant will takes perfect delight in it. It is a manifestation of what is truly expressive of his nature and essence, and therefore also of his knowledge, will, and power, in fact of all his virtues. In the third place, therefore, the church confesses its belief in the eternal character of this generation. The Arians said that there was a time when the Son did not exist (ἠν ποτε ὁτε οὐκ ἠν). They appealed especially to the words “he brought me forth,” or “created me” in Proverbs 8:22, and pointed out the antinomy between the terms “eternal” (αἰωνος) and “begetting” (γεννησις). But if the “Father” and the “Son” bear their names in a metaphysical sense, as Scripture incontrovertibly teaches, it follows that the generation in question has to be eternal as well. For if the Son is not eternal, then of course God is not the eternal Father either. In that case he was God before he was Father, and only later—in time—became Father. Hence, rejection of the eternal generation of the Son involves not only a failure to do justice to the deity of the Son, but also to that of the Father. It makes him changeable, robs him of his divine nature, deprives him of the eternity of his fatherhood, and leaves unexplained how God can truly and properly be called “Father” in time if the basis for calling him “Father” is not eternally present in his nature. We must, accordingly, conceive that generation as being eternal in the true sense of the word. It is not something that was completed and finished at some point in eternity, but an eternal unchanging act of God, at once always complete and eternally ongoing. Just as it is natural for the sun to shine and for a spring to pour out water, so it is natural for the Father to generate the Son. The Father is not and never was ungenerative; he begets everlastingly. “The Father did not by a single act beget the Son and then release him from his ‘genesis,’ but generates him perpetually.” For God to beget is to speak, and his speaking is eternal. God’s offspring is eternal.”

— Herman Bavinck, Reformed Dogmatics: God and Creation, transl. John Bolt, and John Vriend (Grand Rapids, MI: Baker Academic, 2004), 2.308–310.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B226%5D+The+special+qualification+of+the+second+person+in+the+Trinity+is+filiation.+In+Scripture+he+bears+several+names+that+denote+his+relation+to+the+Father%2C+such+as+word%2C+wisdom%2C+logos%2C+son%2C+the+firstborn%2C+only-begotten+and+only+son%2C+the+image+of+God%2C+image+%28%CE%B5%E1%BC%B1%CE%BA%CF%89%CE%BD%29%2C+substance+%28%E1%BD%91%CF%80%CE%BF%CF%83%CF%84%CE%B1%CF%83%CE%B9%CF%82%29%2C+stamp+%28%CF%87%CE%B1%CF%81%CE%B1%CE%BA%CF%84%CE%B7%CF%81%29+%5Bcf.+Heb.+1%3A3%5D.+The+doctrine+of+%E2%80%9Ceternal+generation%E2%80%9D+%28%CE%B1%E1%BC%B0%CF%89%CE%BD%CE%BF%CF%82+%CE%B3%CE%B5%CE%BD%CE%BD%CE%B7%CF%83%CE%B9%CF%82%29%2C+so+called+for+the+first+time+by+Origen%2C+was+based+on+these+names+and+a+few+texts+cited+above.+In+using+these+terms+we+are+of+course+speaking+in+a+human+and+hence+an+imperfect+language%2C+a+fact+that+makes+us+cautious.+Yet+we+have+the+right+to+speak+this+language.+For+just+as+the+Bible+speaks+analogically+of+God%E2%80%99s+ear%2C+eye%2C+and+mouth%2C+so+human+generation+is+an+analogy+and+image+of+the+divine+deed+by+which+the+Father+gives+the+Son+%E2%80%9Cto+have+life+in+himself.%E2%80%9D+But+when+we+resort+to+this+imagery%2C+we+must+be+careful+to+remove+all+associations+with+imperfection+and+sensuality+from+it.+The+generation+of+a+human+being+is+imperfect+and+flawed.+A+husband+needs+a+wife+to+bring+forth+a+son.+No+man+can+ever+fully+impart+his+image%2C+his+whole+nature%2C+to+a+child+or+even+to+many+children.+A+man+becomes+a+father+only+in+the+course+of+time+and+then+stops+being+a+father%2C+and+a+child+soon+becomes+wholly+independent+from+and+self-reliant+vis-%C3%A0-vis+his+or+her+father.+But+it+is+not+so+with+God.+Generation+occurs+also+in+the+divine+being.+God%E2%80%99s+fecundity+is+a+beautiful+theme%2C+one+that+frequently+recurs+in+the+church+fathers.+God+is+no+abstract%2C+fixed%2C+monadic%2C+solitary+substance%2C+but+a+plenitude+of+life.+It+is+his+nature+%28%CE%BF%E1%BD%90%CF%83%CE%B9%CE%B1%29+to+be+generative+%28%CE%B3%CE%B5%CE%BD%CE%BD%CE%B7%CF%84%CE%B9%CE%BA%CE%B7%29+and+fruitful+%28%CE%BA%CE%B1%CF%81%CF%80%CE%BF%CE%B3%CE%BF%CE%BD%CE%BF%CF%82%29.+It+is+capable+of+expansion%2C+unfolding%2C+and+communication.+Those+who+deny+this+fecund+productivity+fail+to+take+seriously+the+fact+that+God+is+an+infinite+fullness+of+blessed+life.+All+such+people+have+left+is+an+abstract+deistic+concept+of+God%2C+or+to+compensate+for+this+sterility%2C+in+pantheistic+fashion+they+include+the+life+of+the+world+in+the+divine+being.+Apart+from+the+Trinity+even+the+act+of+creation+becomes+inconceivable.+For+if+God+cannot+communicate+himself%2C+he+is+a+darkened+light%2C+a+dry+spring%2C+unable+to+exert+himself+outward+to+communicate+himself+to+creatures.+Still%2C+that+generation+is+to+be+conceived+in+divine+terms.+In+the+first+place%2C+it+is+spiritual+The+Arians%2C+in+opposing+the+idea+of+divine+generation%2C+objected+that+all+generation+necessarily+brings+along+with+it+separation+%28%CF%84%CE%BF%CE%BC%CE%B7%29+and+division+%28%CE%B4%CE%B9%CE%B1%CE%B9%CF%81%CE%B5%CF%83%CE%B9%CF%82%29%2C+passion+%28%CF%80%CE%B1%CE%B8%CE%BF%CF%82%29+and+emanation+%28%E1%BC%80%CF%80%CE%BF%CF%81%CF%81%CE%BF%CE%B9%CE%B1%29.+And+that+would+be+correct+if+it+were+physical%2C+sensual%2C+and+creaturely.+But+it+is+spiritual%2C+divine%2C+and+therefore+simple%2C+without+division+%28%E1%BC%80%CF%81%CF%81%CE%B5%CF%85%CF%83%CF%84%CF%89%CF%82%29+or+separation+%28%E1%BC%80%CE%B4%CE%B9%CE%B1%CE%B9%CF%81%CE%B5%CF%84%CF%89%CF%82%29.+It+occurs+without+flux+and+division.+While+giving+rise+to+distinction+and+distribution+in+the+divine+being%2C+it+does+not+create+divergence+and+division.+Athanasius+writes%3A+%E2%80%9CInasmuch+as+God+is+simple%2C+the+Father+of+the+Son+is+indivisible+and+without+passion%2C+for+although+in+the+case+of+humans+we+speak+of+outflow+and+inflow%2C+we+cannot+predicate+these+things+of+anything+that+is+incorporeal.%E2%80%9D120+The+most+striking+analogy+of+divine+generation+is+thought+and+speech%2C+and+Scripture+itself+suggests+this+when+it+calls+the+Son+%E2%80%9CLogos%E2%80%9D+%5BSpeech%2C+Word%2C+Reason%5D.+Just+as+the+human+mind+objectivizes+itself+in+speech%2C+so+God+expresses+his+entire+being+in+the+Logos+%5BChrist%5D.+But+here%2C+too%2C+we+must+note+the+difference.+Humans+need+many+words+to+express+their+ideas.+These+words+are+sounds+and+therefore+material%2C+sense-related.+They+have+no+existence+by+themselves.+But+when+God+speaks%2C+he+totally+expresses+himself+in+the+one+person+of+the+Logos%2C+whom+he+also+%E2%80%9Cgranted+to+have+life+in+himself%E2%80%9D+%28John+5%3A26+NIV%29.+In+the+second+place%2C+therefore%2C+divine+generation+implies+that+the+Father+begets+the+Son+out+of+the+being+of+the+Father%2C+%E2%80%9CGod+of+God%2C+Light+of+Light%2C+very+God+of+very+God%3B+begotten%2C+not+made%2C+being+of+one+substance+with+the+Father%2C%E2%80%9D+as+the+Nicene+symbol+has+it.+The+Arians%2C+by+contrast%2C+contended+that+the+Son+had+been+brought+forth+by+the+will+of+the+Father+out+of+nothing.+This%2C+however%2C+is+not+generation+but+creation%2C+as+John+of+Damascus+points+out.+Creation+is+%E2%80%9Cthe+bringing+into+being%2C+from+the+outside+and+not+from+the+substance+of+the+Creator%2C+of+something+created+and+made+entirely+dissimilar+%5Bin+substance%5D%2C%E2%80%9D+while+%E2%80%9Cbegetting%E2%80%9D+means+%E2%80%9Cproducing+of+the+substance+of+the+begetter+an+offspring+similar+in+substance+to+the+begetter.%E2%80%9D+The+Son+is+not+a+creature+but+he+is+%E2%80%9CGod+over+all%2C+forever+praised%21%E2%80%9D+%28Rom.+9%3A5+NIV%29.+Accordingly%2C+he+was+not+brought+forth+by+the+will+of+the+Father+out+of+nothing+and+in+time.+Rather%2C+he+is+generated+out+of+the+being+of+the+Father+in+eternity.+Hence%2C+instead+of+viewing+%E2%80%9Cgeneration%E2%80%9D+as+an+actual+work%2C+a+performance+%28%E1%BC%90%CE%BD%CE%B5%CF%81%CE%B3%CE%B5%CE%B9%CE%B1%29%2C+of+the+Father%2C+we+should+ascribe+to+the+Father+%E2%80%9Ca+generative+nature%E2%80%9D+%28%CF%86%CF%85%CF%83%CE%B9%CF%82+%CE%B3%CE%B5%CE%BD%CE%BD%CE%B7%CF%84%CE%B9%CE%BA%CE%B7%29.+This+is+not+to+say%2C+of+course%2C+that+the+generation+is+an+unconscious+and+unwilled+emanation%2C+occurring+apart+from+the+will+and+power+of+the+Father.+It+is+not+an+act+of+an+antecedent+decreeing+will%2C+like+creation%2C+but+one+that+is+so+divinely+natural+to+the+Father+that+his+concomitant+will+takes+perfect+delight+in+it.+It+is+a+manifestation+of+what+is+truly+expressive+of+his+nature+and+essence%2C+and+therefore+also+of+his+knowledge%2C+will%2C+and+power%2C+in+fact+of+all+his+virtues.+In+the+third+place%2C+therefore%2C+the+church+confesses+its+belief+in+the+eternal+character+of+this+generation.+The+Arians+said+that+there+was+a+time+when+the+Son+did+not+exist+%28%E1%BC%A0%CE%BD+%CF%80%CE%BF%CF%84%CE%B5+%E1%BD%81%CF%84%CE%B5+%CE%BF%E1%BD%90%CE%BA+%E1%BC%A0%CE%BD%29.+They+appealed+especially+to+the+words+%E2%80%9Che+brought+me+forth%2C%E2%80%9D+or+%E2%80%9Ccreated+me%E2%80%9D+in+Proverbs+8%3A22%2C+and+pointed+out+the+antinomy+between+the+terms+%E2%80%9Ceternal%E2%80%9D+%28%CE%B1%E1%BC%B0%CF%89%CE%BD%CE%BF%CF%82%29+and+%E2%80%9Cbegetting%E2%80%9D+%28%CE%B3%CE%B5%CE%BD%CE%BD%CE%B7%CF%83%CE%B9%CF%82%29.+But+if+the+%E2%80%9CFather%E2%80%9D+and+the+%E2%80%9CSon%E2%80%9D+bear+their+names+in+a+metaphysical+sense%2C+as+Scripture+incontrovertibly+teaches%2C+it+follows+that+the+generation+in+question+has+to+be+eternal+as+well.+For+if+the+Son+is+not+eternal%2C+then+of+course+God+is+not+the+eternal+Father+either.+In+that+case+he+was+God+before+he+was+Father%2C+and+only+later%E2%80%94in+time%E2%80%94became+Father.+Hence%2C+rejection+of+the+eternal+generation+of+the+Son+involves+not+only+a+failure+to+do+justice+to+the+deity+of+the+Son%2C+but+also+to+that+of+the+Father.+It+makes+him+changeable%2C+robs+him+of+his+divine+nature%2C+deprives+him+of+the+eternity+of+his+fatherhood%2C+and+leaves+unexplained+how+God+can+truly+and+properly+be+called+%E2%80%9CFather%E2%80%9D+in+time+if+the+basis+for+calling+him+%E2%80%9CFather%E2%80%9D+is+not+eternally+present+in+his+nature.+We+must%2C+accordingly%2C+conceive+that+generation+as+being+eternal+in+the+true+sense+of+the+word.+It+is+not+something+that+was+completed+and+finished+at+some+point+in+eternity%2C+but+an+eternal+unchanging+act+of+God%2C+at+once+always+complete+and+eternally+ongoing.+Just+as+it+is+natural+for+the+sun+to+shine+and+for+a+spring+to+pour+out+water%2C+so+it+is+natural+for+the+Father+to+generate+the+Son.+The+Father+is+not+and+never+was+ungenerative%3B+he+begets+everlastingly.+%E2%80%9CThe+Father+did+not+by+a+single+act+beget+the+Son+and+then+release+him+from+his+%E2%80%98genesis%2C%E2%80%99+but+generates+him+perpetually.%E2%80%9D+For+God+to+beget+is+to+speak%2C+and+his+speaking+is+eternal.+God%E2%80%99s+offspring+is+eternal.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Reformed+Dogmatics%3A+God+and+Creation%2C+transl.+John+Bolt%2C+and+John+Vriend+%28Grand+Rapids%2C+MI%3A+Baker+Academic%2C+2004%29%2C+2.308%E2%80%93310.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb6cb6008b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb6cb6008b.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/08/bavinck-on-eternal-generation/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

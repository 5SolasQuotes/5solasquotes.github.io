</figure><figure class="quote" id="q-a9effb734b" data-kw="">
<blockquote><p>Assent to a historic Creed or Group of Articles, under whatever formula, involves a reference, not merely to what is fondly termed the ‘plain meaning’ of its sentences, but also to its historical meaning, purpose, background, and spirit. It is not more antiquated, unjust, and disastrous to accept the Bible in the letter of its language wihtout subordinating the Old Testament to the New and both to the Spirit of Christ, and without regard to historical and linguistic and textual research and its invaluable interpretative aids, than it is to prescribe or accept a subordinate and vastly inferior document without some knowledge of the spiritual and scholarly attitude of its formulators, and of the limited purpose and information behind their work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-curtis.html">William Curtis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 25, ‘Subscription &amp; its Ethics: The Ideal Creed’ in A History of Creeds &amp; Confessions of Faith in Christendom &amp; Beyond… (Edinburgh: T&amp;T Clark, 1911), pp. 447-66</cite>, p. 455</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“Assent to a historic Creed or Group of Articles, under whatever formula, involves a reference, not merely to what is fondly termed the ‘plain meaning’ of its sentences, but also to its historical meaning, purpose, background, and spirit. It is not more antiquated, unjust, and disastrous to accept the Bible in the letter of its language wihtout subordinating the Old Testament to the New and both to the Spirit of Christ, and without regard to historical and linguistic and textual research and its invaluable interpretative aids, than it is to prescribe or accept a subordinate and vastly inferior document without some knowledge of the spiritual and scholarly attitude of its formulators, and of the limited purpose and information behind their work.”

— William Curtis, ch. 25, ‘Subscription &amp; its Ethics: The Ideal Creed’ in A History of Creeds &amp; Confessions of Faith in Christendom &amp; Beyond… (Edinburgh: T&amp;T Clark, 1911), pp. 447-66, p. 455">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAssent+to+a+historic+Creed+or+Group+of+Articles%2C+under+whatever+formula%2C+involves+a+reference%2C+not+merely+to+what+is+fondly+termed+the+%E2%80%98plain+meaning%E2%80%99+of+its+sentences%2C+but+also+to+its+historical+meaning%2C+purpose%2C+background%2C+and+spirit.+It+is+not+more+antiquated%2C+unjust%2C+and+disastrous+to+accept+the+Bible+in+the+letter+of+its+language+wihtout+subordinating+the+Old+Testament+to+the+New+and+both+to+the+Spirit+of+Christ%2C+and+without+regard+to+historical+and+linguistic+and+textual+research+and+its+invaluable+interpretative+aids%2C+than+it+is+to+prescribe+or+accept+a+subordinate+and+vastly+inferior+document+without+some+knowledge+of+the+spiritual+and+scholarly+attitude+of+its+formulators%2C+and+of+the+limited+purpose+and+information+behind+their+work.%E2%80%9D%0A%0A%E2%80%94+William+Curtis%2C+ch.+25%2C+%E2%80%98Subscription+%26+its+Ethics%3A+The+Ideal+Creed%E2%80%99+in+A+History+of+Creeds+%26+Confessions+of+Faith+in+Christendom+%26+Beyond%E2%80%A6+%28Edinburgh%3A+T%26T+Clark%2C+1911%29%2C+pp.+447-66%2C+p.+455&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa9effb734b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a9effb734b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=Assent%20to%20a%20historic%20Creed%20or,purpose%20and%20information%20behind%20their%20work." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d090d11438" data-kw="">
<blockquote><p>§31. p. 356, etc. Rule 23. [The opponent said:] ‘Subscription to Articles and forms of Confession in any particular Church is wholly of political consideration.’ Subscription ought to be so intended that he who has subscribed may not perceive himself taken in a snare: but yet he that subscribes must do it to those purposes and in that sense and signification of things which the supreme power intends in commanding it; that is, at least that he that subscribes do actually approve the Articles overwritten: that he does at that time believe them to be such as it’s said they are; i.e. true, if they only say they are true; useful, if they pretend to usefulness; necessary, if it be affirmed that they are necessary. For if the subscriber believes not this, he by hypocrisy serves [only] the ends of public peace and his own preferment. When Articles are established without necessity [i.e. the establishment of non-necessary articles], subscription must be required without tyranny and imperiousness. That is, it must be left to the liberty of the subject to profess or not profess that doctrine. To bring evil on men that do not believe the Article and dare not profess to believe what they do not, is injustice and oppression; it is a law of iniquity, and therefore it is not obligatory to conscience, and no human authority is sufficient for the sanction and imposition. Question: Can it be lawful for any man to subscribe what he does not believe to be true, giving his hand to public peace and keeping his conscience for God? Answer: No, if subscription signify approbation; for in that case it is hypocrisy, etc. But if subscription were no more than the office of a clerk of the signet or council, who in form of law is to sign all the acts of the council, it were different. For it is not as an account of his own opinion, but as a formality of the court: all the world looks on it as none of his personal act. But in subscription to Articles of Confession every ecclesiastic that subscribes does it for himself, lubens et ex animo subscripsi [‘I have subscribed willingly and from the heart’], is our form in the Church of England. If the intention of our superior be to require our assent, he that subscribes does profess his assent; and whatever he thinks himself, it is the intention of the imposer that qualifies the subscription. No particular Church ought with rigor to require subscriptions to Articles not evidently true and necessary to be professed: because in the division of hearts that is in the world, it is certain that some good men may dissent, and then either they shall be afflicted or tempted to hypocrisy: of either of which if ecclesiastic laws be guilty, they are not for edification: they are neither just, nor pious, and therefore oblige not. §32. pp. 358-59, ‘At least let the Articles be made with as great latitude of sense as they can and so that subscriptions be made to the form of words; let the subscribers understand them in what sense they please which the truth of God will suffer and the words can be capable of.’ This is the last remedy; but it is the worst: It has in it something of craft, but very little of ingenuity; and if it can serve the ends of peace or of external charity, or of fantastic concord [a concord of the fantasy], yet it cannot serve the ends of truth and holiness, and Christian simplicity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Non-Conformists’ Plea for Peace, pt. 2</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

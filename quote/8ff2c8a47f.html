<main class="wrap"><figure class="quote" id="q-8ff2c8a47f" data-kw="">
<blockquote><p>This skilful manurer of the vineyard must first rid the ground, purge the Church. The barnfloor must be cleansed, before the harvest be brought in. Jeremie commandeth the thorns first to be rooted out, and then the seed to be cast into the ground. Moses gave charge to cast out all leaven, before the people might celebrate the passover. Joshua willed the Canaanites to be expelled, ere he would establish his common wealth of Israel. Jacob would not sacrifice unto God, till he had purged his house of Idols. The like might be shewed in David, Ezechias, Nehemias, Mattathias.

But one example may serve for all, being of our Saviour, who is above all, and Lord of all. Christ at his first entry into the temple, purged it by casting out buyers and sellers. Our gracious Governor [Queen Elizabeth I] following Christ’s example hath laboured most earnestly first to cleanse this ground and to purge this church of England, hath caused the stones to be picked out; brambles and briars to be pulled up; all rubbish, and whatsoever was hurtful to be removed; the den of thieves to be dispersed, buyers and sellers of popish trash, Monks, Fryers, Mass mongers with like miscreants to bee hurled and whipped out; the stumbling stones of superstition, the baggage of man’s traditions, with all monuments of Idolatry, vanity, and popery to be cast out of the house of God and vineyard of the Lord: So that the field of God is cleared, the vineyard cleansed, the church purged, ready for the seed to be sown, and the vine to be planted. And all this without resistance or tumult. It was the work of God, it is marvellous to as many as duly consider it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the Most Reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), p. 48.</span></figcaption>

<blockquote><p>…those who are not contented with His voice, but seek His visible form, substitute imaginations and phantoms in His place. But here arises a difficult question, for God made Himself known to the patriarchs in other ways besides by His voice alone; thus Abraham, Isaac and Jacob knew Him not only by hearing, but by sight. Moses himself saw Him in the midst of the burning bush; and He also manifested Himself to the prophets under visible figures…. And yet God was not forgetful of Himself when He thus presented Himself to the sight of His servants. Wherefore, this argument does not appear to be valid and good, that it is sinful to represent God in a visible image, because His voice was once heard without His being seen [Dt. 4:15-16]; when, on the other side, it is easy to object that visible forms have often been exhibited, wherein He testified His presence. The solution is twofold: first, that, although God may have invested Himself in certain forms for the purpose of manifesting Himself, this must be accounted as a peculiar circumstance, and not be taken as a general rule;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy</cite>, 4 | verse 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>And forasmuch also as they have been so wonderfully abused within this Realm, to the high contumely and dishonour of God, and have been great cause of blindness, and of much contention among the king’s majesty’s loving subjects, and were like so to be still if they should remain, and chiefly seeing God’s word speaketh so much against them.

You may hereby right well consider, what great causes and grounds the king’s majesty had, to take them away within his Realm, following herein the example of the godly king Ezechias, who brake down the brazen serpent, when he saw it worshipped and was therefore greatly praised of God, not withstanding at the first, the same was made and set up by God’s commandment, and was not only a remembrance of God’s benefits, before received, but also a figure of Christ to come. And not only Ezechias, but also Manasses, and Josaphat and Josias the best kings that were of the Jews, did pull down images in the time of their Reign.

Consider than how Godly an act is this to take away so many images, not made by God’s commandments, whereunto contrary to God’s commandments and his honour were so many Idolatries committed. For unto Christ Prince’s office, and cure appertaineth the defence of God’s true word &amp; Christ[ian] religion, &amp; to take away all those things, which hinder or let true godliness and religion, or make trouble &amp; contention, within their realms.

So good children you have heard the true meaning of these words. Thou shalt make to thee no graven image, thou shalt not bow down &amp; worship the same, the which I pray you grave deeply in your memories, that when you be demanded, what is meant by the words heretofore rehearsed, you may answer. This commandment forbiddeth us all kind of idolatry as well bodily as ghostly, &amp; inhibiteth us to give the honour which is due unto God to any creature or image of creature, but to worship God alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechismus, that is to say, a short instruction into Christian religion for the singular commodity and profit of children and young people</cite>, (n.p., 1548), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-d25546976b" data-kw="">
<blockquote><p>The things that are said of the burning bush, do wonderfully agree with the Old-Testament representations of the Messiah. It was not a high tree, but a bush; as the Messiah is called the low tree; Eze. 17:24, and elsewhere, the twig and the tender plant. This bush was a root out of dry ground; for it was a bush that grew in mount Horeb, which was so called for the remarkable dryness of the place. The word signifies ‘dryness;’ there was no spring about the mountain, till Moses there fetched water out of the dry rock. It was in a thirsty wilderness, where was wont to be no rain… That bush was the growth of the earth, as the human nature of Christ in the Old Testament is represented to be. Yet it had the divine nature of Christ in it; for this angel of the Lord that is said to appear in the bush, has been proved to be the same with the Messiah from the Old Testament, in my discourse on the prophecies of the Messiah. This angel is said to ‘dwell’ in this bush, Dt. 33:16, the more to represent the divine nature of the Messiah dwelling in the human nature. This bush burnt with fire, agreeably to what the prophecies speak of the sufferings of Christ; great calamity and affliction in the Old Testament are often called fire. This was especially a resemblance of the wrath of God, that is often called fire in the Old Testament, and which the prophecies represent the Messiah as enduring… The bush was preserved from being consumed, though it burnt with fire, agreeably to the prophecies of the preservation and upholding of the Messiah, God’s not suffering his Holy One to see corruption, etc. The bush emerged alive and frech out of the fire, agreeably to the prophecies of the Messiah’s resurrection from the dead, and deliverance from all his sufferings. The angel that dwelt out of that bush, who was the Messiah, comes out of the fire, and appears in the bush, and delivered alive from the flames, to work redemption for his people. See Ex. 3:8. So the prophecies represent the Messiah rising from the dead, and exalted out of his state of humiliation, to work salvation for his people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works</cite>, … ed. Edward Hickman (London: Ball, 1840) | Types of the Messiah, p. 653, vol. 2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The things that are said of the burning bush, do wonderfully agree with the Old-Testament representations of the Messiah. It was not a high tree, but a bush; as the Messiah is called the low tree; Eze. 17:24, and elsewhere, the twig and the tender plant. This bush was a root out of dry ground; for it was a bush that grew in mount Horeb, which was so called for the remarkable dryness of the place. The word signifies ‘dryness;’ there was no spring about the mountain, till Moses there fetched water out of the dry rock. It was in a thirsty wilderness, where was wont to be no rain… That bush was the growth of the earth, as the human nature of Christ in the Old Testament is represented to be. Yet it had the divine nature of Christ in it; for this angel of the Lord that is said to appear in the bush, has been proved to be the same with the Messiah from the Old Testament, in my discourse on the prophecies of the Messiah. This angel is said to ‘dwell’ in this bush, Dt. 33:16, the more to represent the divine nature of the Messiah dwelling in the human nature. This bush burnt with fire, agreeably to what the prophecies speak of the sufferings of Christ; great calamity and affliction in the Old Testament are often called fire. This was especially a resemblance of the wrath of God, that is often called fire in the Old Testament, and which the prophecies represent the Messiah as enduring… The bush was preserved from being consumed, though it burnt with fire, agreeably to the prophecies of the preservation and upholding of the Messiah, God’s not suffering his Holy One to see corruption, etc. The bush emerged alive and frech out of the fire, agreeably to the prophecies of the Messiah’s resurrection from the dead, and deliverance from all his sufferings. The angel that dwelt out of that bush, who was the Messiah, comes out of the fire, and appears in the bush, and delivered alive from the flames, to work redemption for his people. See Ex. 3:8. So the prophecies represent the Messiah rising from the dead, and exalted out of his state of humiliation, to work salvation for his people.”

— Jonathan Edwards, The Works, … ed. Edward Hickman (London: Ball, 1840) | Types of the Messiah, p. 653, vol. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+things+that+are+said+of+the+burning+bush%2C+do+wonderfully+agree+with+the+Old-Testament+representations+of+the+Messiah.+It+was+not+a+high+tree%2C+but+a+bush%3B+as+the+Messiah+is+called+the+low+tree%3B+Eze.+17%3A24%2C+and+elsewhere%2C+the+twig+and+the+tender+plant.+This+bush+was+a+root+out+of+dry+ground%3B+for+it+was+a+bush+that+grew+in+mount+Horeb%2C+which+was+so+called+for+the+remarkable+dryness+of+the+place.+The+word+signifies+%E2%80%98dryness%3B%E2%80%99+there+was+no+spring+about+the+mountain%2C+till+Moses+there+fetched+water+out+of+the+dry+rock.+It+was+in+a+thirsty+wilderness%2C+where+was+wont+to+be+no+rain%E2%80%A6+That+bush+was+the+growth+of+the+earth%2C+as+the+human+nature+of+Christ+in+the+Old+Testament+is+represented+to+be.+Yet+it+had+the+divine+nature+of+Christ+in+it%3B+for+this+angel+of+the+Lord+that+is+said+to+appear+in+the+bush%2C+has+been+proved+to+be+the+same+with+the+Messiah+from+the+Old+Testament%2C+in+my+discourse+on+the+prophecies+of+the+Messiah.+This+angel+is+said+to+%E2%80%98dwell%E2%80%99+in+this+bush%2C+Dt.+33%3A16%2C+the+more+to+represent+the+divine+nature+of+the+Messiah+dwelling+in+the+human+nature.+This+bush+burnt+with+fire%2C+agreeably+to+what+the+prophecies+speak+of+the+sufferings+of+Christ%3B+great+calamity+and+affliction+in+the+Old+Testament+are+often+called+fire.+This+was+especially+a+resemblance+of+the+wrath+of+God%2C+that+is+often+called+fire+in+the+Old+Testament%2C+and+which+the+prophecies+represent+the+Messiah+as+enduring%E2%80%A6+The+bush+was+preserved+from+being+consumed%2C+though+it+burnt+with+fire%2C+agreeably+to+the+prophecies+of+the+preservation+and+upholding+of+the+Messiah%2C+God%E2%80%99s+not+suffering+his+Holy+One+to+see+corruption%2C+etc.+The+bush+emerged+alive+and+frech+out+of+the+fire%2C+agreeably+to+the+prophecies+of+the+Messiah%E2%80%99s+resurrection+from+the+dead%2C+and+deliverance+from+all+his+sufferings.+The+angel+that+dwelt+out+of+that+bush%2C+who+was+the+Messiah%2C+comes+out+of+the+fire%2C+and+appears+in+the+bush%2C+and+delivered+alive+from+the+flames%2C+to+work+redemption+for+his+people.+See+Ex.+3%3A8.+So+the+prophecies+represent+the+Messiah+rising+from+the+dead%2C+and+exalted+out+of+his+state+of+humiliation%2C+to+work+salvation+for+his+people.%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+The+Works%2C+%E2%80%A6+ed.+Edward+Hickman+%28London%3A+Ball%2C+1840%29+%7C+Types+of+the+Messiah%2C+p.+653%2C+vol.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd25546976b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d25546976b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=The%20things%20that%20are%20said%20of,to%20work%20salvation%20for%20his%20people&amp;text=The%20things%20that%20are%20said%20of%20the%20burning&amp;text=of%20humiliation%2C%20to%20work%20salvation%20for%20his%20people" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

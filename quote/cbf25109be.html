<blockquote><p>Origen’s Restorationism grew naturally out of his view of human liberty. He held that the liberty of indifference and the power of contrary choice, instead of simple self-determination, are the substance of freedom. These belong inalienably and forever to the nature of the finite will. They cannot be destroyed, even by apostasy and sin.

Consequently, there is forever a possibility of a self-conversion of the will in either direction. Free will may fall into sin at any time; and free will may turn to God at any time. This led to Origen’s theory of an endless alternation of falls and recoveries, of hells and heavens; so that practically he taught nothing but a hell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Endless Punishment</cite>, (New York: Charles Scribner’s Sons, 1886), p. 3.</span></figcaption>

<blockquote><p>3. I easily acknowledge that grace gives such a power as is commonly called Moral, distinct from the natural faculties, as our corrupt estate contains an opposite impotency. But this is but an applying of the terms [‘can’] and [‘cannot’] [‘power’] and [‘impotency’] to dispositions and undisposedness, to habits and their privations.

4. A new heart and spirit, I easily confess necessary. But those words do commonly signify in Scripture, only new inclinations, dispositions, qualifications. It is a new heart, though only the old faculties and substance. I hope you will not follow Illyricus.¹ ¹ [Matthias Illyricus (1520–1575), a Lutheran reformer. Wiki says, “Affirming the natural inability of man, he adopted a position on sin as not being an accident of human nature, but involved in its substance, since The Fall of Man.”]

5. Where you say that [without faith a man can no more receive Christ, nor do ought towards it, than a dead man can walk or speak.], I Reply 1. That proves not faith to be equivalent to a potentia vel facultas [power or capacity], any otherwise than that it is of as absolute necessity, but not that it is of the same nature. If you show an illiterate man a Greek or Hebrew book, he can no more read in it then a dead man, that is, both are truly in sensu composito [in a combined sense] impossible: But yet it is but a habit that is wanting to one, and a power or faculty natural, to the other. And so it may truly be said that a sinner cannot do well that has accustomed to do evil, no more than a leopard can change his spots, or a blackmoore [a black person] his skin. Yet if you mean that such are equally distant from actual change as a dead man, it is but a dead comparison. A dead man wants both natural faculties, and an inclination or moral power. An unbeliever wants but one.</p></blockquote>

</figure><figure class="quote" id="q-0c3dbb6d36" data-kw="">
<blockquote><p>It is asked, sixth, whether original sin consists only in the privation of original righteousness… The papists certainly acknowledge an original righteousness, but one which was not natural to man, but a supernatural gift, like a certain golden bridle, conferred upon natural man to restrain the conflict between the flesh and the spirit. So that they may obtain that the things natural to man, among which is free choice, have remained unwounded by the fall of our first parents, and likewise so that they may hold to this conflict between the flesh and the spirit, or the concupiscence of the flesh against the spirit, and thus that, such conflict notwithstanding, in this life man can be morally perfect, they state that original sin does not consist in anything but the privation of original righteousness, through which the spirit, in the conflict with the flesh, devoid of the assistance of original righteousness, contracted a languor through which it cannot as promptly and successfully repress the attacks of the flesh. The opinion of the Reformed with their reasons. The Reformed on the contrary, because they believe that original righteousness was natural, that is, owed to a morally intact nature, state that not only was original righteousness taken away on account of the fall, but by the same stroke the entire nature of man was so morally corrupted as regards the intellect, the will, the affections, that by nature he is blind in respect to all spiritual truth, likewise incompetent for any spiritual good, and prone to all evil in respect to his will.</p></blockquote>

<blockquote><p>(2) Necessity is distinguished into antecedent and consequent. The former is what arises from a necessary antecedent cause: with which posited, the effect is necessarily posited. The latter is what arises, not from the antecedent cause, but from the very positing of the effect, even if it be of a contingent and free cause. The former necessity removes contingency and liberty: the latter [necessity] leaves it intact. For, those things that happen freely and contingently, by that very fact that they are, are not able not to be: because of the evident contradiction that would otherwise be implied.</p></blockquote>

<blockquote><p>Edward Bagshaw, p. 18: ‘His own free-will has not the least power to receive the things of God.’ Richard Baxter:

1. What not sanctified free-will?

2. What! not a receiving obediential power? A receiving power is a passive power (as it is strictly taken). Has a free-agent less power to receive grace than a marble to receive the engraving of the workman? Does no man ever receive grace? Or do they receive what they cannot receive? Has a man no more receptive power than a block or stone? I know it’s said ‘The natural man receiveth not, etc.’, that is, understands not, believes not, and loves not in sensu composito [in a combined sense]: But its never said that, ‘Our free-will has not the least power to receive.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, … (London: Simmons, 1671), section 56, pp. 139-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“Edward Bagshaw, p. 18: ‘His own free-will has not the least power to receive the things of God.’ Richard Baxter:

1. What not sanctified free-will?

2. What! not a receiving obediential power? A receiving power is a passive power (as it is strictly taken). Has a free-agent less power to receive grace than a marble to receive the engraving of the workman? Does no man ever receive grace? Or do they receive what they cannot receive? Has a man no more receptive power than a block or stone? I know it’s said ‘The natural man receiveth not, etc.’, that is, understands not, believes not, and loves not in sensu composito [in a combined sense]: But its never said that, ‘Our free-will has not the least power to receive.&#x27;”

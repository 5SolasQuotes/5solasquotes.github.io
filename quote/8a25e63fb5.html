<main class="wrap"><figure class="quote" id="q-8a25e63fb5" data-kw="">
<blockquote><p>For when Moses had spoken every precept to all the people according to the law, he took the blood of calves and of goats… and sprinkled both the book, and all the people, saying, ‘This is the blood of the testament which God hath enjoined unto you.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hebrews</cite>, 9:19-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/efficacy.html">Baptism: Efficacy</a></span></div>
<div class="actions"><button class="copy" data-copy="“For when Moses had spoken every precept to all the people according to the law, he took the blood of calves and of goats… and sprinkled both the book, and all the people, saying, ‘This is the blood of the testament which God hath enjoined unto you.&#x27;”

— However, (1) If the pronoun in Heb. 10:29 is speaking of Christ, it would be the only verse in the Bible which speaks of the Messiah being ‘sanctified by the blood of the Covenant’. Whereas, it was well-known and very understand that the Old Testament visible-saints were sanctified by the blood of the Covenant in entering into God’s Covenant in Ex. 24:8. The writer to the Hebrews directly refers to this foundational event in Heb. 9:19-20:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+when+Moses+had+spoken+every+precept+to+all+the+people+according+to+the+law%2C+he+took+the+blood+of+calves+and+of+goats%E2%80%A6+and+sprinkled+both+the+book%2C+and+all+the+people%2C+saying%2C+%E2%80%98This+is+the+blood+of+the+testament+which+God+hath+enjoined+unto+you.%27%E2%80%9D%0A%0A%E2%80%94+However%2C+%281%29+If+the+pronoun+in+Heb.+10%3A29+is+speaking+of+Christ%2C+it+would+be+the+only+verse+in+the+Bible+which+speaks+of+the+Messiah+being+%E2%80%98sanctified+by+the+blood+of+the+Covenant%E2%80%99.+Whereas%2C+it+was+well-known+and+very+understand+that+the+Old+Testament+visible-saints+were+sanctified+by+the+blood+of+the+Covenant+in+entering+into+God%E2%80%99s+Covenant+in+Ex.+24%3A8.+The+writer+to+the+Hebrews+directly+refers+to+this+foundational+event+in+Heb.+9%3A19-20%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a25e63fb5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a25e63fb5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/presumptive-regeneration/#:~:text=For%20when%20Moses%20had%20spoken%20every,which%20God%20hath%20enjoined%20unto%20you&amp;text=For%20when%20Moses%20had%20spoken%20every%20precept%20to&amp;text=the%20testament%20which%20God%20hath%20enjoined%20unto%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ff93b48a27" data-kw="">
<blockquote><p>Hence Romanists and Ritualists have inferred that the sign is inseparable from the grace signified, and that these spiritual effects are due to the outward ordinance. Hence the doctrine of baptismal regeneration. But it must be observed that the Scriptures do not assert these spiritual attributes of water baptism in itself considered, but of water baptism as the sign or emblem of baptism by the holy Ghost. These spiritual attributes belong only to baptism by the Spirit, and they accompany the sign only when the sign is accompanied by that which it signifies. It does not follow, however, that the sign is inseparable from the grace. The grace is sovereign; and experience teaches us that it is often absent from the sign, and that the sign is least frequently honoured by the presence of the grace when it is itself most implicitly relied upon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, chs. 27–28 (on baptismal regeneration)</span></figcaption>

</figure><figure class="quote" id="q-ecdfc48c21" data-kw="">
<blockquote><p>We do not hesitate to pronounce the doctrine of “baptismal regeneration” to be the paramount lie of Satan; the most subtle and fatal weapon which this arch foe of our race ever forged for the destruction of men’s souls in eternal perdition! Do not build your hope of glory upon your baptism. You are lost to all eternity if you do. You must be born again if ever you enter the kingdom of heaven. If you plunge into eternity clutching the airy fiction, the fatal notion, that you passed from spiritual death into spiritual life in your baptism; that in baptism you were regenerated, adopted, justified, made holy and saved; you have staked your eternal happiness upon the most fatal lie! In many instances, the unhappy victim of this delusion passes away, undeceived until the deception is too late to rectify!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/octavius-winslow.html">Octavius Winslow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>From Grace to Glory</cite></span></figcaption>

</figure><figure class="quote" id="q-8f3efdb373" data-kw="">
<blockquote><p>Baptism is the sacrament of new birth, wherein wherein our adoption by Christ is sealed unto us and we are made the sons of God, as many as believer both sacramentally and spiritually, the unbelievers only sacramentally. Wherefore this is not to be understood as though whosoever is baptized shall therefore be sure to have eternal life.</p></blockquote>

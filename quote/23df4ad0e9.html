<blockquote><p>This is the utmost curse of God; because, if men have no political government, they will hardly differ at all from beasts. Indeed, their condition will be far worse, for beasts can dispense with a governor, because they do not make war against their own kind; but nothing can be more cruel than man, if he be not held by some restraint, for every one be driven by the furious eagerness of his own passions to every kind of vicious indulgence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Third</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), viii, 55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee1a3d3007" data-kw="">
<blockquote><p>A second rule is, that as the matter in which we are zealous, must be good in it self, so it must be known unto us to be of that quality. True zeal must begin where the word begins, and end where it ends: for otherwise it cannot be of faith, which is ever grounded on the word; and whatsoever is not of faith is sin. We must not therefore content our selves with an honest meaning, and hope that we have a good zeal towards God, when we have no warrant for our hope: but must so acquaint our selves with the Scriptures of God, that our zeal may be according to knowledge.

Which rule discovereth the corruptness of their zeal, whether close hypocrites, or weak Christians, who are led on merely by the examples of good men, whom they affect, much to like of, and earnestly to stand for such things, as they perceive them in their practise to observe, and to make conscience of: and if there be but a word spoken against any of the things that they have taken a liking of, they are marvellously stirred with indignation thereat, and grow passionate and vehement against the parties, though they have never so good a meaning in that which they speak:

Yet let them be urged to prove out of the word the necessity of those duties which they so earnestly press, they can say little or nothing to the purpose for them; and so grow many times either to dislike and forsake all if they be hypocrites, or at least to be discouraged, and to be at a stand, if they be weaklings in Christ Jesus. And whence proceed these inconveniences but from this, that they are zealous for things that in themselves, and unto others are good and holy, but not thoroughly discerned of them to be of that nature: the consideration whereof, should make us to sit sure in matters of godliness, not building upon the example of good men, but upon the truth of the good word of God, and then our foundation shall never fail us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-cleaver.html">Robert Cleaver</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Tract Concerning Zeal, wherein the properties of true Zeal are described, and the contrary discovered</cite>, in John Dod, Four godly and fruitful sermons two preached at Drayton in Oxford-shire, at a fast, enjoined by authority, by occasion of the pestilence then dangerously dispersed. Likewise two other sermons on the twelfth Psalm. Whereunto is annexed a brief tract of zeal (London: William Welbie, 1611), pp 86-87.</span></figcaption>

</figure><figure class="quote" id="q-ce6a9f313d" data-kw="">
<blockquote><p>Thou sayest that amongst us there is respect of persons, that we prefer the wealthy; which, if they be liberal, although they be drowned in many vices, yet we use to heal up their sores, &amp;c.

I am assured that thy own conscience doth convict thee of a malicious lie, in thus writing; for thou canst not be ignorant what the city of Geneva hath of late years sustained for rooting our pestilent persons, who laboured to destroy the Lord’s vineyard planted in the same. And what was the cause that so they conjured against the liberty of Christ’s Evangel? The hatred, wilt thou and they say, which they did bear against strangers? I answer, But no mo[re] strangers were then in Geneva than were before, when the chief captains of that faction were most earnest professors of the Evangel, (in mouth I mean.) And in very deed, if they would have laboured to have expelled the strangers they had been enemies to their own commodity; for by the multitude of strangers their commonwealth doth flourish: and none did receive such benefits of strangers, as those that required Christ’s doctrine to be overthrown. …

The preachers called for reformation of manners. They boldly and sharply rebuked even those that were in highest authority. One of the chiefest of the band was excommunicated, and so did remain mo[re] years than one. The Consistory called for justice to be executed, and for the penalties to be appointed, for the inobedient and open contemners. But nothing could prevail; the multitude of the wicked was so great, that in votes and voices they did prevail. And so was great, that in votes and voices they did prevail.

And so was the iniquity of the wicked maintained for a long season. Which being considered, the godly as well that are native born, as also the strangers, consulted upon the next and surest remedy, and after that not only the most part of strangers were determined to depart, but that also faithful servant of Christ Jesus had in public sermon commended his flock, with the weeping eyes of many, to the protection and providence of God, and had publicly pronounced, that he would be no Minister in that church were vice could not be punished according to God’s word, where the wicked should triumph and make laws at their pleasure.

After this consultation, it was concluded that a reasonable number of strangers, whose fidelity and honest conversation had long been tried and well known, should be made burgesses, and free to have voice in Counsel, and in making civil statutes. Which being understand, the wicked began more manifestly to utter themselves: they opposed themselves to the magistrates, they plainly denied that any strangers should be free, they appealed to the greater Counsel; which being gathered, did justify the decree of the Sindiques (so the chief magistrates called.) Shortly after did the whole venom burst out: for after feasting and banqueting of all sorts of villains, was the conspiracy concluded and put in execution.

For with one consent they invade upon the night one of the chief magistrates: they cried victory and triumph, but God suddenly repressed that fury, so assisting, without the arm of man, his servant and lieutenant for that time appointed in that City, that first he recovered the ensign of his just and lawful office again; and thereafter so put to flight that rebellious and great multitude, that some being apprehended and committed to prison, the rest were disposed by the only power of God. For that is a thing most evident and plain, that the number of the one did in twenty degrees surmount the other.

This do I write, to let the simple reader understand, although thou be blinded, what was the original of the trouble which Geneva did after suffer. What did the strangers, I pray thee, gain by their liberty? As touching the world, I say nothing, for no kind of commodity they lacked before which after they did obtain, only this excepted, that in counsel they should have voices and place to speak: which thing also did only offend those oppressors of justice and maintainers of iniquity; for thereby did they perceive, that their enterprises should be broken, and that statutes should be made to reform their insolencie. To proceed, just being executed without respect of person upon those that were apprehended, the rest who did escape, to great number, were pronounced rebels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to a Great Number of Blasphemous Cavilations written by an Anabaptist, and adversary to God’s Eternal Predestination (1560) in The Works of John Knox, ed. David Laing (6 vols, Edinburgh, 1856), v, 212-14 (emphasis added).</cite></span></figcaption>

ng+most+evident+and+plain%2C+that+the+number+of+the+one+did+in+twenty+degrees+surmount+the+other.%0A%0AThis+do+I+write%2C+to+let+the+simple+reader+understand%2C+although+thou+be+blinded%2C+what+was+the+original+of+the+trouble+which+Geneva+did+after+suffer.+What+did+the+strangers%2C+I+pray+thee%2C+gain+by+their+liberty%3F+As+touching+the+world%2C+I+say+nothing%2C+for+no+kind+of+commodity+they+lacked+before+which+after+they+did+obtain%2C+only+this+excepted%2C+that+in+counsel+they+should+have+voices+and+place+to+speak%3A+which+thing+also+did+only+offend+those+oppressors+of+justice+and+maintainers+of+iniquity%3B+for+thereby+did+they+perceive%2C+that+their+enterprises+should+be+broken%2C+and+that+statutes+should+be+made+to+reform+their+insolencie.+To+proceed%2C+just+being+executed+without+respect+of+person+upon+those+that+were+apprehended%2C+the+rest+who+did+escape%2C+to+great+number%2C+were+pronounced+rebels.%E2%80%9D%0A%0A%E2%80%94+John+Knox%2C+Letter+to+a+Great+Number+of+Blasphemous+Cavilations+written+by+an+Anabaptist%2C+and+adversary+to+God%E2%80%99s+Eternal+Predestination+%281560%29+in+The+Works+of+John+Knox%2C+ed.+David+Laing+%286+vols%2C+Edinburgh%2C+1856%29%2C+v%2C+212-14+%28emphasis+added%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce6a9f313d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce6a9f313d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/01/09/john-knox-on-geneva-and-strangers/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-aa8e5e103a" data-kw="">
<blockquote><p>None will pretend to deny that there is not great risk to the riders in the steeple-chase, from the nature of the ground, and for impediments in the course. And surely he who perils the life of a human being, without any adequate cause, should not be held guiltless.

The fact is, that the death of riders in steeple-chases is a matter of frequent occurrence. In October last, a man was killed at once in a race of this kind in the south of Ireland, and he left behind him a wife and family to bewail his untimely end. If the annals of racing are carefully inspected, it will be found that throughout these three kingdoms, at an average, several deaths – sometimes as many as six or eight – take place every year from this cruel punishment.

Surely the public authorities should interfere to prevent this prodigal waste of human life. If the same number of murders were annually committed by persons associated for this purpose, it would excite a thrill of horror throughout the whole community, and the most stringent measures would be demanded to put an end to such crimes. The only difference here is that the direct object of the steeple-chase is not the taking away of human life; but as it manifestly puts it in jeopardy, and as when followed it will inevitably cause the death of numbers, it is to be justly held chargeable with murder, and should therefore be put down, as opposed to the law of God, and an offence of the highest kind against society.

Where riders are not killed in the steeple-chase, numbers of them, by falls and sometimes by blows from the horses thrown, are often injured and greatly disabled. Were not horse-racing a fashionable amusement, countenanced and supported by those who, from their station, too often regard themselves, or are regarded as not amenable to the laws of morality, we are persuaded that the barbarous practice of the steeple-chase would not be tolerated in civilized society. Let the one be discontinued, and the other will disappear, only to be hereafter mentioned as a relic of savage life, or as the sport of madmen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Races: The Evils Connected with Horse-Racing and the Steeple-Chase and their Demoralizing Effects</cite>, (1853) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 4: 394.</span></figcaption>

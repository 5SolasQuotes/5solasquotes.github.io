<blockquote><p>II. The one of these wills is called the antecedent will, the other is called the consequent, not because that will goes before this, for in this sense, this distinction may be admitted, because there is a certain order among the purposes of God: Thus his will of creating man was in order before his will of feeding or clothing him. But with [John] Damascene and [James] Arminius…</p></blockquote>

<blockquote><p>11. We must as is said before distinguish between Christ (and the Father in Him) as Rector per Leges [Legislator through laws] or Legislator, and as Dominus Absolutus [Absolute Lord]. And so we must distinguish between those benefits which Christ as Rector gives by his laws and those which as mere Benefactor and Absolute Proprietary He gives, though not contrary to his laws or Covenant, yet over and above what by Covenant or Law He gives. Also we must distinguish between the event and nature of things as such, and the right to and dueness of things as such. And consequently we must most carefully distinguish between God’s will de rerum eventu [concerning the event of things] and his will de debito [concerning debt], as such. The clear distinguishing of these two is a singular key to the opening of the sense of Scripture, and in particular of this controversy. For indeed, it is to distinguish between our physics and our ethics. God’s will about natural beings as such stands at the top of physics as the first cause. God’s will de debito, as such, stands at the top of our ethics as the first cause. And you may easily conceive how the confounding of our physics and ethics must needs blind us and lose us in our divinity, as it would do in philosophy. I join all these distinctions together, for in some they all come to one or are of necessary consideration jointly that any one of them may be understood. Our divines, usually with the Schoolmen, distinguish between voluntatem signi and beneplaciti [will of sign and of good-pleasure]. But in the ordinary school-sense, that is not the same distinction with that which I here intend. Dr. [William] Twisse oft uses the distinction between voluntatem propositi et praecepti [will of putting forth and of precept], and means in effect the same that I do: But he oft speaks of it as being but metonymically God’s will and not properly. By which I must conclude that he meant quoad eventum [as to the event], and not quoad debitum [as to debt]; for God properly wills that this shall be man’s due or duty. I shall therefore a little further explain this distinction and then show you the soundness of it, and then the exceeding usefulness and necessity of it, both in this and many other controversies:

1. For the title I choose rather to denominate it from the object than the act, because the diversity is in the object, but none in the species of the act naturally considered: Debitum and natural being are two distinct things; but ‘to will’ one and ‘to will’ the other is all one as to the nature of willing. God does as properly will duty as He wills natural beings. Yet if I must denominate it from the acts, I would distinguish between God’s Directive Will and his Legislative. For to call it voluntas praecepti is too narrow a term, for the precept is but one part of God’s Law and determines only of one sort of right, that is, of the dueness of obediential actions or forbearance of forbidden actions. But there is also a debitum praemii et beneficii–pure vel absolute–dati, et debitum poenae [debt of reward and benefit, whether purely or absolutely given, and a debt of punishment], which the rest of the Law, Testament or Covenant of God determines of, which must all be here included as well as the former. In sum, the Law determines:

1. What shall be due from us; 2. and what shall be due to us, and on what terms. I call it therefore, The will of God de eventu, et de debito [of event, and of debt], as such. I say ‘as such,’ for else they are coincident: For God’s will de rerum natura, vel existentia determines de debito quatenus evenit esse debitum [determines the nature or existence of things, and debt so far as debt comes about], but not qua debitum [as debt]. And his will de debito determines of the dueness of some events, not as eventual [as to the event], but as due. Or to avoid all ambiguity: call it God’s will de ente mere naturali [concerning merely natural being] and his will de debito morali [concerning moral debt], or Legislative or Governing.

2. And for the nature of the distinction, understand further that there are two acts which I call God’s will de debito: The first is that immanent act of his will by which He strictly and properly wills what shall be due. This also is twofold:

1. Productive, or instituting dueness; 2. and approbative, or taking complacency in duty. The former of these I principally intend, but exclude not the latter. God does eternally will every due, but it is not therefore eternally or from eternity due. For He wills from eternity (to speak vulgarly) only that this shall be due at such a time and by such a means. I say by such means: For though God’s will produce all dueness, yet only by means does He produce it. That means is the revelation of his will.

2. This revelation of God’s will de debito we call his Law. This therefore is the second thing which I call God’s will de debito, or his Legislative will, that is, the Law as it is signum voluntatis divinae [a sign of the divine will], that is, formally as a law. This I call God’s will de debito, only metonymically, as it is the sign of his will before expressed. If the proper will of God were separated from this, it would then be no producer of dueness or right at all, for it would be no law, no signum; it would lose its nature as abrogated laws do. Also observe that you must here carefully distinguish between God’s act in making a law and the moral act of that law, or of his will by that law when it is made. I call not legislation itself, ‘God’s will de debito‘ or ‘his legislative will’. His ordaining the sign itself, or making the law which is his instrument, is an act of his will de rerum eventu vel naturae [concerning the event of things, or of their nature]. For it only makes that instrument or sign by which right [of debt] shall be after[wards] produced, but [it] does not directly thereby produce that right. But it is the signification and moral act of that law, which flows from its nature, which does produce right, and which we here intend. The scribe that writes a statute, and the sovereign himself, in composing the matter, order and terms, does but make that signum or instrument which, being made, does therefore institute right, because it signifies the sovereign’s will to institute it. So much for the explication of my meaning in this distinction. 2. Next I shall say somewhat to prove the soundness of it, which is therefore necessary because some ignorant persons laugh at it, as if we feigned two wills in God, and one of them contrary to the other. Otherwise, to men of understanding, it is not very needful; and therefore I shall say but this briefly: It is not two wills in God as two distinct essences or faculties that I assert, but only two distinct acts: Distinct, I say, in regard of their distinct products or effects, and so to man’s apprehension, though in God we say there is no diversity or distinction. Yet as we cannot handsomely conceive of his will to save Peter, and his will to damn Judas, as one act, having such different effects: so it is here. Who knows not that naturality and morality, physics and ethics, event and right are different things, and consequently we may and must distinguish of God’s willing them accordingly. When a man says, ‘You shall do this,’ preceptively, he does only say, ‘It shall be your duty to do it,’ but says not that eventually you shall do it. Nor are his words false if you never do it. He that says prophetically or by prognostication, ‘you shall do this,’ means that it shall so come to pass; and if it do not, his words are false; but he does not say, ‘It is or shall be your duty.’

12. Accordingly we must distinguish between the antecedent and consequent acts and will of Christ as Ruler of mankind. For the understanding of which and avoiding mistakes, observe:

1. That we speak not now of eternal decrees, but of the will of Christ in this relation as He is the Ruler of the world and Church, and as He is the conveyer of his mercies according to and by his Covenant, and as He judges the world according thereunto.

2. That by his antecedent will and acts, we mean only that which in his government is antecedent to man’s obedience or disobedience, which is principally legislation and making his new Covenant, and also the giving of preachers and other acts, which are the first part of his administration. And by his consequent acts and will, we mean only that second part of government which finds man obedient or disobedient, and is commonly called judgment and execution. And when we say that by his antecedent acts and will Christ gives pardon, justification and right to glory equally to all, we mean that as Legislator and Promiser He has antecedently made an universal act of oblivion, or deed of gift, conditionally pardoning, etc. all, and no farther than conditionally pardoning any. And when we say that He consequently justifies and saves none but true Christians, and in that sense died for no other according to his consequent will, we mean that as Judge of mankind, He will give justification and salvation to believers and to no others; nor [did He] ever intended to do otherwise. (Let the reader know that the foresaid scheme of the effects of Christ’s death is more accurately, and yet more briefly, done in my Methodus Theologiae: and therefore let him that dislikes the number or order of distributions pass it by: But I have not time to reform it here.</p></blockquote>

ncident%3A+For+God%E2%80%99s+will+de+rerum+natura%2C+vel+existentia+determines+de+debito+quatenus+evenit+esse+debitum+%5Bdetermines+the+nature+or+existence+of+things%2C+and+debt+so+far+as+debt+comes+about%5D%2C+but+not+qua+debitum+%5Bas+debt%5D.+And+his+will+de+debito+determines+of+the+dueness+of+some+events%2C+not+as+eventual+%5Bas+to+the+event%5D%2C+but+as+due.+Or+to+avoid+all+ambiguity%3A+call+it+God%E2%80%99s+will+de+ente+mere+naturali+%5Bconcerning+merely+natural+being%5D+and+his+will+de+debito+morali+%5Bconcerning+moral+debt%5D%2C+or+Legislative+or+Governing.+2.+And+for+the+nature+of+the+distinction%2C+understand+further+that+there+are+two+acts+which+I+call+God%E2%80%99s+will+de+debito%3A+The+first+is+that+immanent+act+of+his+will+by+which+He+strictly+and+properly+wills+what+shall+be+due.+This+also+is+twofold%3A+1.+Productive%2C+or+instituting+dueness%3B+2.+and+approbative%2C+or+taking+complacency+in+duty.+The+former+of+these+I+principally+intend%2C+but+exclude+not+the+latter.+God+does+eternally+will+every+due%2C+but+it+is+not+therefore+eternally+or+from+eternity+due.+For+He+wills+from+eternity+%28to+speak+vulgarly%29+only+that+this+shall+be+due+at+such+a+time+and+by+such+a+means.+I+say+by+such+means%3A+For+though+God%E2%80%99s+will+produce+all+dueness%2C+yet+only+by+means+does+He+produce+it.+That+means+is+the+revelation+of+his+will.+2.+This+revelation+of+God%E2%80%99s+will+de+debito+we+call+his+Law.+This+therefore+is+the+second+thing+which+I+call+God%E2%80%99s+will+de+debito%2C+or+his+Legislative+will%2C+that+is%2C+the+Law+as+it+is+signum+voluntatis+divinae+%5Ba+sign+of+the+divine+will%5D%2C+that+is%2C+formally+as+a+law.+This+I+call+God%E2%80%99s+will+de+debito%2C+only+metonymically%2C+as+it+is+the+sign+of+his+will+before+expressed.+If+the+proper+will+of+God+were+separated+from+this%2C+it+would+then+be+no+producer+of+dueness+or+right+at+all%2C+for+it+would+be+no+law%2C+no+signum%3B+it+would+lose+its+nature+as+abrogated+laws+do.+Also+observe+that+you+must+here+carefully+distinguish+between+God%E2%80%99s+act+in+making+a+law+and+the+moral+act+of+that+law%2C+or+of+his+will+by+that+law+when+it+is+made.+I+call+not+legislation+itself%2C+%E2%80%98God%E2%80%99s+will+de+debito%E2%80%98+or+%E2%80%98his+legislative+will%E2%80%99.+His+ordaining+the+sign+itself%2C+or+making+the+law+which+is+his+instrument%2C+is+an+act+of+his+will+de+rerum+eventu+vel+naturae+%5Bconcerning+the+event+of+things%2C+or+of+their+nature%5D.+For+it+only+makes+that+instrument+or+sign+by+which+right+%5Bof+debt%5D+shall+be+after%5Bwards%5D+produced%2C+but+%5Bit%5D+does+not+directly+thereby+produce+that+right.+But+it+is+the+signification+and+moral+act+of+that+law%2C+which+flows+from+its+nature%2C+which+does+produce+right%2C+and+which+we+here+intend.+The+scribe+that+writes+a+statute%2C+and+the+sovereign+himself%2C+in+composing+the+matter%2C+order+and+terms%2C+does+but+make+that+signum+or+instrument+which%2C+being+made%2C+does+therefore+institute+right%2C+because+it+signifies+the+sovereign%E2%80%99s+will+to+institute+it.+So+much+for+the+explication+of+my+meaning+in+this+distinction.+2.+Next+I+shall+say+somewhat+to+prove+the+soundness+of+it%2C+which+is+therefore+necessary+because+some+ignorant+persons+laugh+at+it%2C+as+if+we+feigned+two+wills+in+God%2C+and+one+of+them+contrary+to+the+other.+Otherwise%2C+to+men+of+understanding%2C+it+is+not+very+needful%3B+and+therefore+I+shall+say+but+this+briefly%3A+It+is+not+two+wills+in+God+as+two+distinct+essences+or+faculties+that+I+assert%2C+but+only+two+distinct+acts%3A+Distinct%2C+I+say%2C+in+regard+of+their+distinct+products+or+effects%2C+and+so+to+man%E2%80%99s+apprehension%2C+though+in+God+we+say+there+is+no+diversity+or+distinction.+Yet+as+we+cannot+handsomely+conceive+of+his+will+to+save+Peter%2C+and+his+will+to+damn+Judas%2C+as+one+act%2C+having+such+different+effects%3A+so+it+is+here.+Who+knows+not+that+naturality+and+morality%2C+physics+and+ethics%2C+event+and+right+are+different+things%2C+and+consequently+we+may+and+must+distinguish+of+God%E2%80%99s+willing+them+accordingly.+When+a+man+says%2C+%E2%80%98You+shall+do+this%2C%E2%80%99+preceptively%2C+he+does+only+say%2C+%E2%80%98It+shall+be+your+duty+to+do+it%2C%E2%80%99+but+says+not+that+eventually+you+shall+do+it.+Nor+are+his+words+false+if+you+never+do+it.+He+that+says+prophetically+or+by+prognostication%2C+%E2%80%98you+shall+do+this%2C%E2%80%99+means+that+it+shall+so+come+to+pass%3B+and+if+it+do+not%2C+his+words+are+false%3B+but+he+does+not+say%2C+%E2%80%98It+is+or+shall+be+your+duty.%E2%80%99+12.+Accordingly+we+must+distinguish+between+the+antecedent+and+consequent+acts+and+will+of+Christ+as+Ruler+of+mankind.+For+the+understanding+of+which+and+avoiding+mistakes%2C+observe%3A+1.+That+we+speak+not+now+of+eternal+decrees%2C+but+of+the+will+of+Christ+in+this+relation+as+He+is+the+Ruler+of+the+world+and+Church%2C+and+as+He+is+the+conveyer+of+his+mercies+according+to+and+by+his+Covenant%2C+and+as+He+judges+the+world+according+thereunto.+2.+That+by+his+antecedent+will+and+acts%2C+we+mean+only+that+which+in+his+government+is+antecedent+to+man%E2%80%99s+obedience+or+disobedience%2C+which+is+principally+legislation+and+making+his+new+Covenant%2C+and+also+the+giving+of+preachers+and+other+acts%2C+which+are+the+first+part+of+his+administration.+And+by+his+consequent+acts+and+will%2C+we+mean+only+that+second+part+of+government+which+finds+man+obedient+or+disobedient%2C+and+is+commonly+called+judgment+and+execution.+And+when+we+say+that+by+his+antecedent+acts+and+will+Christ+gives+pardon%2C+justification+and+right+to+glory+equally+to+all%2C+we+mean+that+as+Legislator+and+Promiser+He+has+antecedently+made+an+universal+act+of+oblivion%2C+or+deed+of+gift%2C+conditionally+pardoning%2C+etc.+all%2C+and+no+farther+than+conditionally+pardoning+any.+And+when+we+say+that+He+consequently+justifies+and+saves+none+but+true+Christians%2C+and+in+that+sense+died+for+no+other+according+to+his+consequent+will%2C+we+mean+that+as+Judge+of+mankind%2C+He+will+give+justification+and+salvation+to+believers+and+to+no+others%3B+nor+%5Bdid+He%5D+ever+intended+to+do+otherwise.+%28Let+the+reader+know+that+the+foresaid+scheme+of+the+effects+of+Christ%E2%80%99s+death+is+more+accurately%2C+and+yet+more+briefly%2C+done+in+my+Methodus+Theologiae%3A+and+therefore+let+him+that+dislikes+the+number+or+order+of+distributions+pass+it+by%3A+But+I+have+not+time+to+reform+it+here.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Universal+Redemption+of+Mankind+by+the+Lord+Jesus+Christ+Stated+%26+Cleared%2C+%E2%80%A6+%28London%3A+Salusbury%2C+1694%29%2C+ch.+2%2C+pp.+27-33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3379d5e856.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3379d5e856.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/quotes-on-the-distinction-between-gods-revealed-will-and-his-will-of-decree/#:~:text=11.%20We%20must%20as%20is%20said,not%20time%20to%20reform%20it%20here&amp;text=11.%20We%20must%20as%20is%20said%20before%20distinguish&amp;text=I%20have%20not%20time%20to%20reform%20it%20here" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§.10. Otherwise the will of God is distinguished into the will of sign [voluntas signi] and the will of good pleasure [voluntas beneplaciti]. The latter is, and is conceived as, the very complacency of God decreeing concerning the futurition of things, and approving Himself and whatever is in some manner similar to Himself. The former, which is called of sign, is indicated through some sign, and is made manifest among men: of which the will of precept is also a part. For those signs are referred to the number of five, and were formerly comprehended in this verse: He foretells, forbids, permits, commands, fulfils [Prædicit, prohibet, permittit, præcipit, implet]. §.11. Here it is inquired whether the will of precept and the will of decree do not very often conflict with one another: because what He wills by the will of precept, we often see not to come to pass, and thus it is evident from the event that God in His decree willed it not to be done. But we easily reconcile these by observing that the will of the mandate says nothing other than that God wills the obligation of the rational creature: but the will of decree, that He wills to permit a particular man not to answer to his obligation; or sometimes, if the mandate be positive, that He wills the obligation to endure for a time, until He Himself dissolves it. §.12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>

ge+no+will+of+decree+which+is+not+efficacious%2C+absolute%2C+and+antecedent%2C+as+in+the+chapter+on+the+decree+of+God+we+shall+see+that+no+other+is+to+be+admitted.%E2%80%9D%0A%0A%E2%80%94+Salomon+Van+Til%2C+Compendium+of+Both+Theologies%2C+even+Natural+%26+Revealed%E2%80%A6+%281703%3B+1719%29%2C+1.+Nature+of+God%2C+subsection+4%2C+%E2%80%98On+the+Will+of+God%E2%80%99+tr.+AI+by+Roman+Prestarri+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb0fff760f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b0fff760f8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/quotes-on-the-distinction-between-gods-revealed-will-and-his-will-of-decree/#:~:text=10.%20Otherwise%20the%20will%20of%20God,no%20other%20is%20to%20be%20admitted&amp;text=10.%20Otherwise%20the%20will%20of%20God%20is%20distinguished&amp;text=see%20that%20no%20other%20is%20to%20be%20admitted" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Thus then the morality of our actions must not be measured by any decree concerning the futurition of events, but by some other rule, in which must concur God’s will and appointment, setting bounds unto us and designing our duty, and discovering what is well-pleasing and acceptable to God, honest and laudable in itself, and profitable and comfortable to us in the issue; and thus we have the Word of God for our direction and have his laws and testimonies to be our rule: Dt. 29:29; Isa. 8:20; Dt. 30:10-12; Dt. 5:29; Ps. 147:19; Rom, 12:2; 1 Thess. 4:2; 1 Pet. 4:2, etc. and we may take notice of these three things as necessarily requisite and concurring in that which is a warrant unto and rule of our actions and petitions:

1. The good-pleasure and decree of God, not concerning what shall come to pass, but concerning the quality and moral goodness of human actions, and which does limit and set bounds to reasonable creatures and prescribes unto them their duty; and this is the fountain and first spring (yea and by many judicious and sober divines is judged to be the supreme adequate and first rule) of moral rectitude. Hence we may conceive that God’s laws in Scripture are called ‘decrees,’ ‘statutes’ and ‘ordinances’.

2. From this decree and appointment, does (to our apprehension) flow divine approbation, complacency and delight in what is thus appointed to be our work and duty: hence that appointment is called the good, acceptable and perfect will of God, Rom. 12:2, and our actions when conform[ed] to that rule, are said to be well-pleasing in his sight, Heb. 13:2; yea the Lord does not only declare his love of his complacency, and delight in these when they are performed, but also He is said to will and desire (though not according to the Jesuitical and Arminian gloss)¹ those works while He is speaking to the rebellious and disobedient who have slighted his laws and casten all his statutes behind their backs: Eze. 18:23, 32; 33:11; Hos. 6:6; 1 Sam. 15:22; Isa. 61:8; Mt. 9:13; 2 Pet. 3:9, etc. ¹ Arminians, Socinians and Jesuits from thence would collect a frustratable and inefficacious will and desire in God, but this phrase does only import God’s serious approbation of the works of righteousness and detestation of the contrary.

3. There must be an intimation and promulgation of this decree and appointment, and a declaration of those things that would be well pleasing, and acceptable to God.</p></blockquote>

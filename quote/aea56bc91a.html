<blockquote><p>Fourthly, they [Justification and Sanctification] are both equally imputed unto us through the righteousness of Christ. Therefore says St. Paul to the Corinthians, ‘To them that are sanctified in Christ Jesus,’ (1 Cor. 1:2) and to the Hebrews, it is said we are ‘sanctified by the blood of the Covenant.’ (Heb. 10:29) So that no less are we sanctified than justified by Christ’s death and merits, and the imputation of them. But on the other side, they are distinct in some formalities, such as these may be, for first, the immediate cause of our sanctification is in holy Scripture imputed to the operation and influence of the Holy Spirit, as our Justification is more properly attributed to Christ the mediator between God and man: As appears from St. Paul’s words to the Thessalonians, ‘But we are bound to give thanks always for you brethren beloved of the Lord, because God has from the beginning chosen you to salvation, through sanctification of the Spirit, and belief of the truth.’ (2 Thess. 2:13) And St. Peter, ‘Elect according to the foreknowledge of God the Father and Sanctification of the Spirit unto obedience.’ (1 Pet. 1:2)… For not only is a sinner by the Spirit of regeneration and sanctification purged from the old leaven of sin and malice, but he becomes a new lump, and unleavened (1 Cor. 5:7); and whereas he has ‘yielded his members as instruments of unrighteousness unto sin, he does yield himself unto God,’ (Rom. 6:13) as those that are alive from the dead. And old things are done away in him, and all things become new.’ (2 Cor. 5:17) And ‘whosoever is (thus) born of God; does not commit sin, for his seed remains in him, and he cannot sin because he is born of God.’ (1 Jn. 3:9)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 17</cite>, pp. 62-63</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4da6d65e4" data-kw="">
<blockquote><p>Assurance makes most for your comfort—but holiness makes most for God&#x27;s honor. Man&#x27;s holiness is now his greatest happiness, and in heaven man&#x27;s greatest happiness will be his perfect holiness. Assurance is the daughter of holiness; and he who shall more highly prize, and more earnestly press after the enjoyment of the daughter than the mother, it is not a wonder if God shuts the door upon him, and crosses him in the thing he most desires. The surest and the shortest way to assurance is to wrestle and contend with God for holiness. When the stream and cream of a man&#x27;s spirit runs after holiness, it will not be long night with that man; the Sun of righteousness will shine forth upon that man, and turn his winter into summer, and crown him with the diadem of assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 104</span></figcaption>

<blockquote><p>Q. 2. On the Way that we Know God Positively we can say, following the lead of Scotus (Oxon. 1 d. 3 part one q.1) that our knowledge of God is: 1) Positive and not merely negative, because a purely negative knowledge is no knowledge. 2) Quidditative or essential and not merely knowledge of his existence or attributes, for in understanding existence or property we must pre-understand some quasi-subject in which we understand that quasi-property to be present in; therefore we do not merely understand whether God is but to some extent and imperfectly what God is. 3) Not merely in a concept analogous to the concept of a creature which, concept is altogether other than the one said of a creature, but in some concept univocal to God and creatures. This is plain directly from experience and indirectly follows once innatism, illuminationism, and ontologism have been rejected (see below). 4) Proper, but through concepts composed of common concepts. We can attain to many concepts proper to God that do not belong to creatures, for example, supreme being, infinite good, pure act, supreme legislator, etc. But concepts of this sort are not proper notions from proper notions but from transcendental notions, as first, supreme, being, good, which are predicated in common of God and creatures. 5) Notions abstracted from creatures, for as Scotus says, “All metaphysical investigation of God proceeds as follows: a) by considering the formal idea of something, and b) by taking away from that formal idea the imperfection that it has in creatures, and c) by keeping that formal idea and attributing to it altogether supreme perfection, and by thus attributing it to God” (Oxon. ibid.). Note the triple way, namely of affirmation, of negation, and of eminence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958) Wolter was a Scotus scholar and writes from that perspective.</cite>, p. 87</span></figcaption>

<blockquote><p>Q. 26. Does sanctification occur in the conscious level of the life of believers or below that level in depth? It occurs below the level of conscious life and works out of the regnerate root of the soul on its dispositions and inclincations to sanctify them. Q. 27. Is sanctification a mediate or immediate work? As it takes place below the consciousness, it is primarily an immediate work. That, however, does not take away form the fact that in its manifestation it is tied by God to the use of certain means.</p></blockquote>

<blockquote><p>4. The word ‘sanctification‘ also signifies the same thing for the main as conversion does, only with these small differences following: 1. The word is more comprehensive, for it signifies our whole state of dedication or devotedness to God, which comprehends in it these four things: 1. The change of a man’s qualities, whereby he is made fit for the service of God; having his heart bent towards Him, and set upon Him. 2. The actual dedication or devoting of a man’s self to God by faith and a holy covenant, especially in baptism, by solemn vow or engagement. 3. The relation of a person so dedicated or devoted to God; as he is one set apart to Him for holy uses; and it is from this relation especially that the word ‘sanctification’ is used. 4. The holiness of life that follows hereupon; in the actual living to God, to whom we are devoted. Sanctification comprehends all this, and so comprehends in it vocation and somewhat more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion… (London: R.W., 1657), ch. 1, sect. 3</cite>, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>
<div class="actions"><button class="copy" data-copy="“4. The word ‘sanctification‘ also signifies the same thing for the main as conversion does, only with these small differences following: 1. The word is more comprehensive, for it signifies our whole state of dedication or devotedness to God, which comprehends in it these four things: 1. The change of a man’s qualities, whereby he is made fit for the service of God; having his heart bent towards Him, and set upon Him. 2. The actual dedication or devoting of a man’s self to God by faith and a holy covenant, especially in baptism, by solemn vow or engagement. 3. The relation of a person so dedicated or devoted to God; as he is one set apart to Him for holy uses; and it is from this relation especially that the word ‘sanctification’ is used. 4. The holiness of life that follows hereupon; in the actual living to God, to whom we are devoted. Sanctification comprehends all this, and so comprehends in it vocation and somewhat more.”

— Richard Baxter, A Treatise of Conversion… (London: R.W., 1657), ch. 1, sect. 3, p. 9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+The+word+%E2%80%98sanctification%E2%80%98+also+signifies+the+same+thing+for+the+main+as+conversion+does%2C+only+with+these+small+differences+following%3A+1.+The+word+is+more+comprehensive%2C+for+it+signifies+our+whole+state+of+dedication+or+devotedness+to+God%2C+which+comprehends+in+it+these+four+things%3A+1.+The+change+of+a+man%E2%80%99s+qualities%2C+whereby+he+is+made+fit+for+the+service+of+God%3B+having+his+heart+bent+towards+Him%2C+and+set+upon+Him.+2.+The+actual+dedication+or+devoting+of+a+man%E2%80%99s+self+to+God+by+faith+and+a+holy+covenant%2C+especially+in+baptism%2C+by+solemn+vow+or+engagement.+3.+The+relation+of+a+person+so+dedicated+or+devoted+to+God%3B+as+he+is+one+set+apart+to+Him+for+holy+uses%3B+and+it+is+from+this+relation+especially+that+the+word+%E2%80%98sanctification%E2%80%99+is+used.+4.+The+holiness+of+life+that+follows+hereupon%3B+in+the+actual+living+to+God%2C+to+whom+we+are+devoted.+Sanctification+comprehends+all+this%2C+and+so+comprehends+in+it+vocation+and+somewhat+more.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Treatise+of+Conversion%E2%80%A6+%28London%3A+R.W.%2C+1657%29%2C+ch.+1%2C+sect.+3%2C+p.+9&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9ffc6d69ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9ffc6d69ce.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/sanctification#:~:text=4.%20The%20word%20%E2%80%98sanctification%E2%80%98%20also%20signifies,in%20it%20vocation%20and%20somewhat%20more&amp;text=4.%20The%20word%20%E2%80%98sanctification%E2%80%98%20also%20signifies%20the%20same&amp;text=so%20comprehends%20in%20it%20vocation%20and%20somewhat%20more" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

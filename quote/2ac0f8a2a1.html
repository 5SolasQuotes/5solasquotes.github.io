</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7794a32bba" data-kw="two vs seven">
<blockquote><p>However, this topic contains many heads. First, we will dispute in general concerning the sacraments; second, in particular of baptism and the holy Supper, which are the two sacraments of the New Testament instituted by Christ; third, of the five false and spurious ones added by Romanists. But we must first say something about the word and the definition of a sacrament. Use of the word “sacrament.”.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.1.2</span></figcaption>

</figure><figure class="quote" id="q-42a6eff317" data-kw="">
<blockquote><p>The gesture of imposition of hands other reformed Kirks, and ours also, have omitted [in praying for youth being admitted to the Table]: because it was a rite indifferent: for it was but an indicant sign of the person admitted: and because it has been, and is still abused to make up a bastard sacrament, the sacrament of confirmation, which we have condemned, not only in the [Scottish] Confession of Faith, but also in the [2nd] Confession of Helvetia approved in the general assembly [of the Church of Scotland] holden at Edinburgh, anno 1566.</p></blockquote>

</figure><figure class="quote" id="q-976347990e" data-kw="">
<blockquote><p>And as touching this blessing of children and imposition of hands upon them, it is peculiar unto our Savior Christ: used neither by his disciples, nor his apostles, either before or after his ascension. Whereunto makes that the children being brought, that He should pray over them, He did not pray for them, but blessed them, that is to say commended them to be blessed, thereby to shew his divine power. These being also yet infants, and in their swaddling clothes, as by the Word which the Evangelist uses, and as by our Savior Christs taking them into his arms, does appear; being also in all likelihood unbaptized. Last of all, their confirmation is a notable derogation unto the holy sacrament of baptism, not alone in that it presumes the sealing of that which was sealed sufficiently by it: but also in that both by asseveration of words; and by specialty of the minister that gives it, it is even preferred unto it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Mt. 19, section 9, quoted in George Gillespie, English-Popish Ceremonies (1637), pt. 3, ch. 6, p. 95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-sacraments-in-general/number-of-the-sacraments.html">Number of the Sacraments</a></span></div>

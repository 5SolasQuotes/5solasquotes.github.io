<blockquote><p>5. It is now supposed, and shall (if it please God) hereafter be demonstrated, that human souls are not traducted, nor causally brought out of the flesh: yet are they occasionally (that I may touch at the manner), God having resolved and decreed, after generation and fit organization of the embryo, to create and infuse a reasonable soul: which soul, because it is united to a mass corrupted, in such a manner as a spiritless mass may be corrupted, or rather to a mass inclining or inducing to corruption, in the very unition it contracts original sin. Hugo Eterianus [d. 1182] thus descants on this point: ‘When the soul languishes, it is neither cast down by the will, nor by necessity, but only by fellowship, if the soul were corrupted by the will, it should not be counted original sin, but actual: if it should fall by necessity, that vice were no further to be imputed.’ Concerning the latter part, I answer, if in his necessity he imply coaction, he says true: otherwise, by this concurrence of our condescending will in Adam, or by our own implicit will, we may draw on us a necessity of after-sinning, which most justly may be imputed to us, and we may tie ourselves with our own bonds. To the former part this may give satisfaction, that against the will of the soul, the soul itself cannot be corrupted: for then the will should be forced, and so [be] no will at all, but [a] noluntas, and not voluntas. ‘It is not necessary,’ says Bellarmine, ‘that our soul must needs come from Adam, because we draw sin from him: if but one part come from him it is enough.’ For a father does not per se produce original sin in the child, but per accidens; namely, as by the act of generation it comes to pass, that his son is a member of mankind, which was overtaken in Adam’s corruption, and that the propension unto evil of the earthly part traducted, meeting with a soul not much resisting, causes this original sin to result thencefrom, and death by this original sin. So that no sooner is the soul united to its body, and the matter glued to the form, but the infant deserves to be, and is the child of death, by reason of the primigeneal corruption. If you inquire after what manner the body works the soul unto this evil, we may truly say, ‘The body works not upon the soul by a natural and immediate action.’ You heard what Hugo Eterianus said, ‘It is stricken or cast down only by fellowship.’ He enlarges himself in the same chapter, thus: ‘Imperfection, languishing, and corruption abide in the flesh before the soul’s conjunction; from which disease the soul is infected: as if a vessel be tainted with an ill odour, it infects therewith whatsoever liquor it receives.’ Gerson thus, ‘The soul by the conjunction with the body contracts that infection; as when one falls into the mire, he is besmeared and stained.’ Felisius thus: ‘A clean apple put in an unclean hand is soiled. Good wine poured into a fustie vessel contracts a strange taste, and loses its own natural: so the soul loses its naturall vigor, when it is united in the flesh.’ Another thus, ‘Anima cum labente simul labitur, et frustra nititur dum innititur.’ To the same effect another says thus: ‘As the purest rain-water falling on dust, is turned with the dust into a lump of mire: so at the coadunation of the soul unto the earthly part, both spirit and flesh are plunged in the durt of corruption.’ Augustine, against Julian the Pelagian, prefers the very heathen before Julian; for he held that ‘nothing was conveyed unto us from Adam;’ and they held, ‘That we were born to be punished for old crimes committed in a former life.’ ‘And,’ says Augustine, ‘it is true which Aristotle relates, that we are punished like to those who fell among the Hetrurian robbers, whose living bodies being coupled face to face with dead men’s carcasses, were so killed.’ Of the Hetrurian tyrant Mezentius, Virgil, Aeneid, 8, records the like: Mortua corporibus jungebat corpora vivis, Componens manibúsque manus at que oribus ora, (Tormenti genus) et sanie tabóque fluentes, Complexu in misero, longâ sic morte necabat. But I return from this digression. The heathen say (as St. Augustine relates) that ‘our souls united to our bodies are like the living coupled with the dead.’ ‘They saw somewhat,’ says he, and commends their wisdom in discerning the miseries of mankind to be for somewhat before committed, and in acknowledging the power and justice of God; though without divine revelation they could not know that it was Adam’s offence which brought such a wrack both on our souls and on our bodies. What has been hitherto related seems too much to incline to the natural, physical, immediate working of the soul upon the body. Others are as faulty, who say, ‘The soul receives no annoyance from the body, but by way of impedition [being impeded] only, where the spiritual faculties are hindered and the music spilt, by reason of the untuneableness of the organs. But they will not seem to hear that ‘a spiritual substance can receive infection from a nature corporeal.’ Both opinions may rest contented in the middesse or mean, that as the body cannot go beyond the sphere of its activity, and work properly and physically upon the soul: so by the interposition, as it were, of a middle nature, the body not only hinders the faculties of the soul from working, but sometimes works upon the soul. Thus the natural, vital and animal spirits do bind and unite the soul to the body, that neither part can part from other, though it would. Thus bodily objects work on the mind, but it is by the mediation of the outward and inward senses. Shall corporeal, outward, and remote objects, by degrees, draw the soul into sin, even in our perfect age, when our natural reason is most vigorous; and may not the corrupted seed, having as great a propension to evil as Naphtha to take fire, at the conjunction, infect the soul with a participation of uncleanness, though the operation be not physical, or immediate? By Adam’s soul sinning was Adam’s flesh infected; may not our soul be infected as well by our flesh? A spiritual substance can produce a bodily effect. Boëtius says excellently: ‘Forms material came from forms immaterial: Our will was moved by our intellect, our appetite by our will, and a bodily change conformable to our appetite.’ And may not a bodily species work by the same degrees, backward, on the soul itself? The reason is alike in the contrariety. Does the corporeal fire of Hell torment and affect the incorporeal spirits of evil angels, and shall it of wicked men (as most certainly it does and must; which shall be proved, God willing, otherwhere) and may not the matter make some impression on the form, the body upon the soul, when there is such a sympathy in nature betwixt them? If the soul do no way suffer from the body, how does it follow the temperature of the body? How does madness, foolishness, anger and love, with other affections, work upon the mind? Yea, how comes it to pass that not only strength and nimbleness of body, but even goodness of wit is propagated (if nature be strong) and children resemble their fathers both in manners and understanding? The flesh itself without the soul, if it be beaten, hurt, or cut, is no way sensible. Reunite the separated soul to the wronged body, the soul feeleth, and is much affected: nor is the grief in the incision only, but in the soul. Yea, in apoplexies and deep sleeps, cast upon men by stupefactive ingredients and compounded by art, while the soul is in the body, wounds have been given unto the earthy part, and it never felt them: when those fits are vanished, the soul feels the pain of the discontinuity and division of the flesh as well as the body. Doctor [John] Rainolds thus, ‘God by nature has ordered that the soul naturally united to the body should suffer with the body and be grieved, the body being afflicted, and rejoice, it being refreshed, and be sorrowfull, the body being killed; so that some way it suffers by reason of the body.’ Permit me but the use of his modification some way and I dare say the body draws the soul its way, some way to sin. Aquinas on Rom. 5, lect. 3: ‘It should not seem that sin, which is an accident of the soul, can be produced by the original of the flesh: It is answered (says he) with reason. Though the soul be not in the seed, yet there is in the seed a virtue disposing the body to receive the soul, which soul being poured or infused into the body, is after a sort conformable to the body, because every thing received is in the receiver according to the capacity of the receiver.’ To him let me add: if a new created soul should be put into a body not descending from Adam, it should not have original sin; but meeting with a body disposed to corruption, after its kind it yields and contracts original sin.

6. Yea, but the act of Adam’s sin passed quickly away, and the guiltines was forgiven [for him]; how could it infect us? I answer, ‘The person did first infect the nature, afterwards the nature did infect the person.’… And the manner how the soul is made sinful is described at large before, to wit, that by the union it is infected, and so soon as it is infused, it tastes of corruption… so does a just man beget an unjust, Christianus non Christianum, ‘A Christian an unchristian’; the circumcised Hebrews beget children uncircumcised: for the generation is natural and not spiritual… just Lot who begat wicked daughters, or David who had Absalom, or Abraham, who had Ismael, or Isaac who had Esau; or Noah, who had Ham… For man begets man like to himself, as he is species hominis [the species of a man], not as he is individuum [an individual]: and accidents belonging to the individual person of the Father pass not over to the child, but those things that pertain to the specifical nature. Therefore what belongs to man, as he is individuum, he does not propagate.</p></blockquote>

t+into+a+lump+of+mire%3A+so+at+the+coadunation+of+the+soul+unto+the+earthly+part%2C+both+spirit+and+flesh+are+plunged+in+the+durt+of+corruption.%E2%80%99+Augustine%2C+against+Julian+the+Pelagian%2C+prefers+the+very+heathen+before+Julian%3B+for+he+held+that+%E2%80%98nothing+was+conveyed+unto+us+from+Adam%3B%E2%80%99+and+they+held%2C+%E2%80%98That+we+were+born+to+be+punished+for+old+crimes+committed+in+a+former+life.%E2%80%99+%E2%80%98And%2C%E2%80%99+says+Augustine%2C+%E2%80%98it+is+true+which+Aristotle+relates%2C+that+we+are+punished+like+to+those+who+fell+among+the+Hetrurian+robbers%2C+whose+living+bodies+being+coupled+face+to+face+with+dead+men%E2%80%99s+carcasses%2C+were+so+killed.%E2%80%99+Of+the+Hetrurian+tyrant+Mezentius%2C+Virgil%2C+Aeneid%2C+8%2C+records+the+like%3A+Mortua+corporibus+jungebat+corpora+vivis%2C+Componens+manib%C3%BAsque+manus+at+que+oribus+ora%2C+%28Tormenti+genus%29+et+sanie+tab%C3%B3que+fluentes%2C+Complexu+in+misero%2C+long%C3%A2+sic+morte+necabat.+But+I+return+from+this+digression.+The+heathen+say+%28as+St.+Augustine+relates%29+that+%E2%80%98our+souls+united+to+our+bodies+are+like+the+living+coupled+with+the+dead.%E2%80%99+%E2%80%98They+saw+somewhat%2C%E2%80%99+says+he%2C+and+commends+their+wisdom+in+discerning+the+miseries+of+mankind+to+be+for+somewhat+before+committed%2C+and+in+acknowledging+the+power+and+justice+of+God%3B+though+without+divine+revelation+they+could+not+know+that+it+was+Adam%E2%80%99s+offence+which+brought+such+a+wrack+both+on+our+souls+and+on+our+bodies.+What+has+been+hitherto+related+seems+too+much+to+incline+to+the+natural%2C+physical%2C+immediate+working+of+the+soul+upon+the+body.+Others+are+as+faulty%2C+who+say%2C+%E2%80%98The+soul+receives+no+annoyance+from+the+body%2C+but+by+way+of+impedition+%5Bbeing+impeded%5D+only%2C+where+the+spiritual+faculties+are+hindered+and+the+music+spilt%2C+by+reason+of+the+untuneableness+of+the+organs.+But+they+will+not+seem+to+hear+that+%E2%80%98a+spiritual+substance+can+receive+infection+from+a+nature+corporeal.%E2%80%99+Both+opinions+may+rest+contented+in+the+middesse+or+mean%2C+that+as+the+body+cannot+go+beyond+the+sphere+of+its+activity%2C+and+work+properly+and+physically+upon+the+soul%3A+so+by+the+interposition%2C+as+it+were%2C+of+a+middle+nature%2C+the+body+not+only+hinders+the+faculties+of+the+soul+from+working%2C+but+sometimes+works+upon+the+soul.+Thus+the+natural%2C+vital+and+animal+spirits+do+bind+and+unite+the+soul+to+the+body%2C+that+neither+part+can+part+from+other%2C+though+it+would.+Thus+bodily+objects+work+on+the+mind%2C+but+it+is+by+the+mediation+of+the+outward+and+inward+senses.+Shall+corporeal%2C+outward%2C+and+remote+objects%2C+by+degrees%2C+draw+the+soul+into+sin%2C+even+in+our+perfect+age%2C+when+our+natural+reason+is+most+vigorous%3B+and+may+not+the+corrupted+seed%2C+having+as+great+a+propension+to+evil+as+Naphtha+to+take+fire%2C+at+the+conjunction%2C+infect+the+soul+with+a+participation+of+uncleanness%2C+though+the+operation+be+not+physical%2C+or+immediate%3F+By+Adam%E2%80%99s+soul+sinning+was+Adam%E2%80%99s+flesh+infected%3B+may+not+our+soul+be+infected+as+well+by+our+flesh%3F+A+spiritual+substance+can+produce+a+bodily+effect.+Bo%C3%ABtius+says+excellently%3A+%E2%80%98Forms+material+came+from+forms+immaterial%3A+Our+will+was+moved+by+our+intellect%2C+our+appetite+by+our+will%2C+and+a+bodily+change+conformable+to+our+appetite.%E2%80%99+And+may+not+a+bodily+species+work+by+the+same+degrees%2C+backward%2C+on+the+soul+itself%3F+The+reason+is+alike+in+the+contrariety.+Does+the+corporeal+fire+of+Hell+torment+and+affect+the+incorporeal+spirits+of+evil+angels%2C+and+shall+it+of+wicked+men+%28as+most+certainly+it+does+and+must%3B+which+shall+be+proved%2C+God+willing%2C+otherwhere%29+and+may+not+the+matter+make+some+impression+on+the+form%2C+the+body+upon+the+soul%2C+when+there+is+such+a+sympathy+in+nature+betwixt+them%3F+If+the+soul+do+no+way+suffer+from+the+body%2C+how+does+it+follow+the+temperature+of+the+body%3F+How+does+madness%2C+foolishness%2C+anger+and+love%2C+with+other+affections%2C+work+upon+the+mind%3F+Yea%2C+how+comes+it+to+pass+that+not+only+strength+and+nimbleness+of+body%2C+but+even+goodness+of+wit+is+propagated+%28if+nature+be+strong%29+and+children+resemble+their+fathers+both+in+manners+and+understanding%3F+The+flesh+itself+without+the+soul%2C+if+it+be+beaten%2C+hurt%2C+or+cut%2C+is+no+way+sensible.+Reunite+the+separated+soul+to+the+wronged+body%2C+the+soul+feeleth%2C+and+is+much+affected%3A+nor+is+the+grief+in+the+incision+only%2C+but+in+the+soul.+Yea%2C+in+apoplexies+and+deep+sleeps%2C+cast+upon+men+by+stupefactive+ingredients+and+compounded+by+art%2C+while+the+soul+is+in+the+body%2C+wounds+have+been+given+unto+the+earthy+part%2C+and+it+never+felt+them%3A+when+those+fits+are+vanished%2C+the+soul+feels+the+pain+of+the+discontinuity+and+division+of+the+flesh+as+well+as+the+body.+Doctor+%5BJohn%5D+Rainolds+thus%2C+%E2%80%98God+by+nature+has+ordered+that+the+soul+naturally+united+to+the+body+should+suffer+with+the+body+and+be+grieved%2C+the+body+being+afflicted%2C+and+rejoice%2C+it+being+refreshed%2C+and+be+sorrowfull%2C+the+body+being+killed%3B+so+that+some+way+it+suffers+by+reason+of+the+body.%E2%80%99+Permit+me+but+the+use+of+his+modification+some+way+and+I+dare+say+the+body+draws+the+soul+its+way%2C+some+way+to+sin.+Aquinas+on+Rom.+5%2C+lect.+3%3A+%E2%80%98It+should+not+seem+that+sin%2C+which+is+an+accident+of+the+soul%2C+can+be+produced+by+the+original+of+the+flesh%3A+It+is+answered+%28says+he%29+with+reason.+Though+the+soul+be+not+in+the+seed%2C+yet+there+is+in+the+seed+a+virtue+disposing+the+body+to+receive+the+soul%2C+which+soul+being+poured+or+infused+into+the+body%2C+is+after+a+sort+conformable+to+the+body%2C+because+every+thing+received+is+in+the+receiver+according+to+the+capacity+of+the+receiver.%E2%80%99+To+him+let+me+add%3A+if+a+new+created+soul+should+be+put+into+a+body+not+descending+from+Adam%2C+it+should+not+have+original+sin%3B+but+meeting+with+a+body+disposed+to+corruption%2C+after+its+kind+it+yields+and+contracts+original+sin.+6.+Yea%2C+but+the+act+of+Adam%E2%80%99s+sin+passed+quickly+away%2C+and+the+guiltines+was+forgiven+%5Bfor+him%5D%3B+how+could+it+infect+us%3F+I+answer%2C+%E2%80%98The+person+did+first+infect+the+nature%2C+afterwards+the+nature+did+infect+the+person.%E2%80%99%E2%80%A6+And+the+manner+how+the+soul+is+made+sinful+is+described+at+large+before%2C+to+wit%2C+that+by+the+union+it+is+infected%2C+and+so+soon+as+it+is+infused%2C+it+tastes+of+corruption%E2%80%A6+so+does+a+just+man+beget+an+unjust%2C+Christianus+non+Christianum%2C+%E2%80%98A+Christian+an+unchristian%E2%80%99%3B+the+circumcised+Hebrews+beget+children+uncircumcised%3A+for+the+generation+is+natural+and+not+spiritual%E2%80%A6+just+Lot+who+begat+wicked+daughters%2C+or+David+who+had+Absalom%2C+or+Abraham%2C+who+had+Ismael%2C+or+Isaac+who+had+Esau%3B+or+Noah%2C+who+had+Ham%E2%80%A6+For+man+begets+man+like+to+himself%2C+as+he+is+species+hominis+%5Bthe+species+of+a+man%5D%2C+not+as+he+is+individuum+%5Ban+individual%5D%3A+and+accidents+belonging+to+the+individual+person+of+the+Father+pass+not+over+to+the+child%2C+but+those+things+that+pertain+to+the+specifical+nature.+Therefore+what+belongs+to+man%2C+as+he+is+individuum%2C+he+does+not+propagate.%E2%80%9D%0A%0A%E2%80%94+Edward+Kellet%2C+Miscellanies+of+Divinity%2C+divided+into+Three+Books%2C+wherein+is+Explained+at+Large+the+Estate+of+the+Soul+in+her+Origination%2C+Separation%2C+Particular+Judgement%2C+%E2%80%A6+%28Cambridge%2C+1635%29%2C+bk.+1%2C+ch.+6+Kellet+%281583-1641%29+was+a+doctor+of+divinity+and+a+calvinistic%2C+Anglican%2C+canon+in+the+cathedral+church+at+Exeter.+%7C+section+5%2C+pp.+103-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76363c3521.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/76363c3521.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=5.%20It%20is%20now%20supposed%2C%20and,is%20individuum%2C%20he%20does%20not%20propagate&amp;text=5.%20It%20is%20now%20supposed%2C%20and%20shall%20%28if&amp;text=as%20he%20is%20individuum%2C%20he%20does%20not%20propagate" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>16. ‘Thine eyes beheld my shapelessness, etc.’ The embryo, when first conceived in the womb, has no form; and David speaks of God’s having known him when he was yet a shapeless mass, τὸ κύημα, as the Greeks term it; for τὸ εμβρυον is the name given to the fetus from the time of conception to birth inclusive. The argument is from the greater to the less. If he was known to God before he had grown to certain definite shape, much less could he now elude his observation… The other is the more natural meaning, that the different parts of the human body are formed in a succession of time; for in the first germ there is no arrangement of parts, or proportion of members, but it is developed, and takes its peculiar form progressively… that though the members were formed in the course of days, or gradually, none of them had existed; no order or distinctness of parts having been there at first, but a formless substance. And thus our admiration is directed to the providence of God in gradually giving shape and beauty to a confused mass.</p></blockquote>

<blockquote><p>VI. Problem: Whether there are more than one soul in each man, or whether the vegetative, sensitive and rational in one man are three souls really distinct? I deny. Gennadius, in his book, On Ecclesiastical Dogmas, ch. 15, imputes as a heresy to James and other disputers that they posited two souls in man, one animal by which the body is animated and is mixed with the blood, and the other spiritual which provides reason – with which opinion those agree who posited two, and indeed opposite souls, namely the sensitive and the rational, of which the former is mortal, the latter immortal, in Clement, bk. 2 of the Stromata and Theodoret bk. 5, On the Cure of Greek affections; and Ockham on the fourth book of The Sentences, distinction 7, Francis de Meyronnes on the second book distinction 17, Pico della Mirandola on the eversion of the singular certitude book 33. There were some (among whom Didymus, bk. 3 on the Holy Spirit) who from 1 Thess. 5:23 wrongly understood constituted three essential parts in man – body, soul, spirit – in Gennadius chapter 20, Jerome to Hedybia question 12 epistle 150, the author of the work on Spirit and Soul chapter 49. But in response to the objected passage, among the orthodox some understand by “spirit” the grace of the Holy Spirit (Gennadius and Jerome); others the soul itself, which for its diverse functions and respects is called soul, insofar as it animates the body for living or vivifying, and spirit, either because it breathes in the body and makes it vital and spiritual, or because its substance is spiritual (the author of the work on Spirit and Soul, Gennadius cited above, Jerome, bk. 4 on Mt. ch. 27, Tertullian on the Soul ch. 6, Gregory the Great, bk. 11 of the Moralia, ch. 3, Isidore, bk. 11 of the Origins, ch. 1). We with the more recent interpreters expound “spirit” as the rational part of the soul, and “soul” as the remaining part which we have in common with the brutes. Thus they generally distinguish Mt. 22:37. The Manicheans imagined two souls, one a particle of the divine breath and free from all fault, the other vicious produced by the evil principle, in Augustine book 6 against Faustus chapter 8 and book 10 on the Literal Interpretation of Genesis chapter 13. Plato in the Timaeus, compared with book 9 of the Republic, as Aristotle also reports in book 1 of On the Soul the last chapter, posited three souls. This opinion of his, condemned by the common school, was revived in the previous century by the celebrated philosopher Zabarella in his treatise on the Faculties of the Soul (with Averroes preceding him), whom one or another then followed, among them William Ursinus, who contends that this is the opinion of Aristotle, Disputations part 2 disputation 2. Although we with Hervaeus, treatise on the unity of forms VII. Problem: Whether therefore it is to be said that the embryo is successively informed by three souls, so that when the sensitive arrives, the vegetative is abolished, and when the rational arrives, the sensitive is abolished? [as was the typical Medieval view] I answer: Indeed the scholastics commonly say this with Thomas, first part, question 118, article 2, and Summa contra Gentiles, bk. 2, ch. 89, and Scaliger, Exercises 297, section 1 and exercise 290, section 2, the Coimbrans cited above, and all the other Pontifical philosophers and theologians. To me, however, this opinion has never been pleasing. Now looking around to see if others also judge with me, I find Goclenius in his Exercises on Scaliger, question 5, p. 55 doubting it, but Zanchi, in the chapter cited, openly rejecting it. See their reasons there. To me it has always seemed absurd: 1) To imagine a triple generation and introduction of form, and therefore to constitute a triple species of living nature in act (for the soul is the act of an organic body), so that the pregnant female conceives and carries first not a man, but a plant, and then a brute; 2) Then an abortion which occurs after the animation of the fetus would not always be a man, but sometimes only a plant or brute; 3) Then it could not be judged whether an aborted fetus was to be baptized and honored with (as they say) ecclesiastical burial, because although it lived and moved itself for some moment, there is still no certainty whether the rational soul had been introduced and the sensitive abolished. The Pontificals especially should have thought about this case, who so precisely and anxiously inquire about the necessity of baptism and ecclesiastical burial. These things I thus commented in the year 1638 in the first edition of this disputation for the determination of the present and immediately preceding problem. Afterwards it happened that some obsolete concepts about the mind or spirit, distinct from the human soul and body, and about the human animal, were rehashed by some more recent authors – which if they are defended with their own thorns and hypotheses to the end, seem to render theology inconvenient and difficult for us somewhere, especially in the refutations of the Socinians and others, ancient and modern. I, given the occasion here, gave in advance to Christian philosophers and theologians to consider in the year 1641, in the corollaries to the disputation on the Jubilee, what inconveniences seemed to me to be able to follow from that new philosopheme about man as a being per accidens.</p></blockquote>

<blockquote><p>Paracelsus [d. 1541] teaches that men can be produced by the chemical art in his [Opus] Paramirum [A Work Beyond-Wonder, 1531], where he makes three parts of man: elemental, celestial and divine. He denies that the first two come into heaven. There he writes thus: ‘It was doubted by the philosophers whether it could happen that a man be born outside the womb of a woman; to which I respond that it is not repugnant to chemical art and nature, but is very easy. For sperm enclosed in a cucurbit [a flask] or sealed in the womb [venter equinus] of a [living] horse, by the highest putrefaction putrefies for fifty days, until it moves, which is easy to discern. After that time, it will appear somehow similar to a fetus, yet without a body, transparent. If you then daily prudently nourish or feed this with human blood, and keep and cherish it in the equal heat of the horse’s belly, after nine months it will appear adorned with all members like an infant born from a woman, yet smaller in quantity. This thing we call a homunculus, which must afterwards be educated with careful solicitude and diligence like a true boy or infant, until it grows up.’ He adds there that those who are thus born understand all arcana and hidden things which it is otherwise impossible for men to know, because they have acquired life, body, flesh and bones by art; therefore the arts and sciences are innate to them, nor do they need to learn from elsewhere.</p></blockquote>

<blockquote><p>Verse 16. ‘Thine eyes did see my substance yet being unperfect,’ etc.] That is, so soon as ever I was conceived, whilst I was yet an imperfect embryo: and in thy book all my members were written, which in continuance were fashioned, when as yet there was none of them; that is, all those members of my body, which in continuance of time grew to have their perfect shape, were as clearly seen by thee, even when as yet there was none of them that had their shape and proportion, as those things are seen by men…</p></blockquote>

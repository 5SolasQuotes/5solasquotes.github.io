<main class="wrap"><figure class="quote" id="q-5f6e6b5aed" data-kw="">
<blockquote><p>The law of the Sabbath, in fact, is also a positive commandment, having its ground in the will of God as supreme Lord. That a certain portion of time should be set apart for the worship of God and the religious instruction of men is a plain dictate of reason. That a certain portion of time should be set apart for rest from labour is by experience found to be, on physiological and moral grounds, highly desirable. That some monument of the creation of the world and of the resurrection of Christ, and that some permanent and frequently-recurring type of the rest of heaven, should be instituted, is eminently desirable for man, considered as a religious being.

But that all these ends should be combined and secured by one institution, and that precisely one whole day in seven should be allotted to that purpose, and that this one day in seven should be at one time the seventh and afterward the first day of the week, is evidently a matter of positive enactment, and binds us as long as the indications of the divine will in the matter remain unchanged.

The time of observance was changed from the seventh to the first day of the week in the age of the apostles, and consequently with their sanction; and that day, as “the Lord’s day” (Rev. i. 10), has ever since been observed in the stead of the ancient Sabbath, in all portions and ages of the Christian Church. We accept this change as it comes to us, and believe it to be according to the will of God — (1.) Because of its apostolic origin; (2.) Because of the transcendent importance of the resurrection of Christ, which is thus associated with the creation of the world by God, as the foundation of the Christian religion; and (3.) Because of the universal consent of Christians of all generations and denominations, and the approbation of the Holy Ghost that dwelleth in them that is implied thereby.

As to the observance of the Christian Sabbath, the obvious general rule is, that it is to be observed, (1.) Not in the spirit of the law, which Christ condemns (Matt. xii. 1; Luke xiii. 15), but in the holy and free spirit of the gospel, (2.) In accordance with the ends for which it is instituted, and which have been above enumerated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander-hodge.html">Archibald Alexander Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, ed. William H. Goold (British edn, London: T. Nelson and Sons, 1870), pp 282-83.</span></figcaption>

<blockquote><p>…while admitting the metrical translations of other portions of the Bible are not to be compared with mere human hymns, the fact of God’s having gathered the Psalms, Songs, and Hymns of various inspired writers into one Book of Psalms, seems conclusively to show that that book alone was meant to serve as our manual of praise… There must be some reason why the Prayer or Psalm of Moses in the 90th Psalm found a place in that Book, though his Song in the 15th chapter of Exodus did not; why David’s Psalm of thanksgiving, when the ark was brought to Zion (1 Chron. 16:8-36), is reproduced in the 105th, 96th, and 106th Psalms; why the 14th and 53rd PSalms are almost exactly the same; and why the 108th Psalm is embodied in the 57th and 60th. The reason given above seems most satisfactory.</p></blockquote>

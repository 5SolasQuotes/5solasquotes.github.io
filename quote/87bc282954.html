<main class="wrap"><figure class="quote" id="q-87bc282954" data-kw="">
<blockquote><p>But if to believe that Christ died for oneself is the same thing as to believe that the death of Christ is sufficient of itself to expiate one’s sins, we do not deny that reprobates are also bound to believe this: which is perfectly true, whether they believe it, or not. For, the value of Christ’s death is such, that it is of itself sufficient for the altogether complete expiation of the sins of all men, even if they should be ten thousand times more: even if God did not determine it for the expiation of the sins of all. So indeed in this controversy it is customary among many to make a distinction, that they say, that Christ died sufficiently for all, even reprobates; but efficiently only for the elect: which words, suitably explained, and applied to amplify the value of the merit of Christ, we readily admit: even if we have not made use of this distinction from the beginning: because the impropriety in the words appears to be overly harsh. For to [have] died for someone, if we speak properly, is to die for the favor of someone, or in the place of someone, so that he might be delivered from death: and if a voluntary death is met for another, it presupposes the greatest possible love, as Christ testifies, Jn. 15:13. Now, if you should add, ‘sufficiently only, not efficiently’, this not very suitable sense will emerge: Christ, impelled by the greatest possible charity, died in the place of reprobates, so that they might be delivered from death, sufficiently indeed, but not efficiently, that is, they are never actually delivered. Those that say, that Christ dies also for reprobates, not indeed so that they might actually be delivered, but so that they might be able to be delivered, tacitly suppose (or they really do not say anything relevant), that it is in the power and ability of reprobates to apprehend Christ’s offered merit by faith: since without faith they are not even able to be delivered. Likewise (which I wish properly to be observed), that God decreed from eternity to save all men and each through Christ, under this condition, that they believe upon Christ, the Redeemer of all men and each. Which no Orthodox theologian would admit, as Pelagian or Semi-pelagian dogma. I leave unmentioned, that God foreknew from eternity, that a great many were not going to believe, and that He decreed that He was not going to give faith to them, which is not able to be had, except with Him freely giving. Why then would He have decree salvation, and have determined means of salvation, that is, the death of His Son, under a condition, which He foreknew that He was not going to fulfill, and the ability of the fulfilling of which He denied in His eternal decree. Not even man plans so imprudently. But let us dismiss these things. Nevertheless, we think that it is more rightly and plainly said, that the death of Christ is sufficient in itself for the expiation of all the sins of men, than, Christ died sufficiently for all, even reprobates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-friedrich-wendelin.html">Marcus Friedrich Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), Species of the Office of Christ, pt. 3 Wendelin admits that Christ died for the world to make a sufficient atonement for all, yet Christ dying for someone properly means to deliver them; hence he does not like the language of Christ dying for all sufficiently. He then argues against hypothetical universalism.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2c726bebc9" data-kw="">
<blockquote><p>“There are others, who, rejecting that first absolute decree, and rightly so, make the conditional decree so common to all men that they assert that the counsel of God the Father in delivering the Son to death and of the Son in undergoing the same, and their intention and scope, was to acquire, impetrate and merit for all and every sinful man by that most precious death and passion, that, if they repent, when they are capable of doctrine and believe in Christ, they might be able to be reconciled with God and receive the remission of sins. They deny, however, that actual reconciliation with God or the remission of sins or eternal life was actually acquired or impetrated for those who remain in impenitence. 11. Since these deny that Christ died equally for the impious and the pious, and affirm that only the pious may glory in the satisfaction of Christ, because the principal fruit and efficacy of the satisfaction comes to them, they agree in sense with all other Orthodox on that point, even if they differ in their mode of speaking; especially since they acknowledge a certain special decree, according to which He died specially for the elect alone, by which they are brought not only to the common, but also to the singular benefits, namely the grace of regeneration and of efficacious calling, of justification and of glorification; and to the merit of Christ’s death they assign the true and efficacious communion, bestowal and application of saving grace, and the donation of faith itself, by which the application is made.</p></blockquote>

</figure><figure class="quote" id="q-e1cdea8129" data-kw="">
<blockquote><p>Also, it should be pointed out again that the doctrinal difference between the Saumur theologians and Turretin do not involve any of the fundamental tenets of the Reformed faith. Turretin himself mentions this fact in a letter to Jean Claude which we shall consider later in this thesis. As we have seen various times in this chapter, Turretin refers to the Salmurians as fellow Reformed pastors and theologians, and the Salmurians certainly view themselves as being within the Reformed tradition. In fact, Amyraut goes to great lengths in attempting to prove that the orthodox Reformed theologians are in agreement with him. Thus, even though this controversy was a serious and lengthy one, nevertheless it was entirely an internal dispute within the Reformed churches concerning non-fundamental matters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/donald-davis-grohman.html">Donald Davis Grohman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism: 1635-1685 Th.D. diss</cite>, (Knox College in cooperation with Toronto School of Theology, 1971), p. 120</span></figcaption>

</figure><figure class="quote" id="q-ad2f535dcd" data-kw="">
<blockquote><p>Now for the clearing of the truth of this, when we say Christ died for us, the meaning is that Christ died for our benefit. Now these benefits which Christ procured unto us by his death, it may be they are of different conditions, whereof some are ordained to be conferred only conditionally, and some absolutely. And therefore it is fit we should consider them apart. As for example it is without question (I suppose) that Christ died to procure pardon of sin and salvation of soul, but how absolutely, whether men believe or no? Nothing less, but only conditionally, to wit, that for Christ’s sake their sins shall be pardoned and their souls saved, provided they do believe in Him. Now I willingly confess that Christ died for all in respect of procuring these benefits, to wit conditionally, upon the condition of their faith, in such sort that if all and every one should believe in Christ, all and every one should obtain the pardon of their sins and salvation of their souls for Christ’s sake. And I presume that no Arminian on the other side will affirm that Christ in such sort died for all and every one that all and every one should have their sins pardoned and their souls saved for Christ’s sake, whether they believe or no. What cause then is there of any difference between us on this point, thus explicated. Yet hereby it is manifest that the benefit of remission of sins and salvation of souls for Christ’s sake, shall in the end redound to none but such as believe, as this Author seems to acknowledge. But come we to faith itself and regeneration, are these benefits redounding unto us by the merits of Christ, yea or no?</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now for the clearing of the truth of this, when we say Christ died for us, the meaning is that Christ died for our benefit. Now these benefits which Christ procured unto us by his death, it may be they are of different conditions, whereof some are ordained to be conferred only conditionally, and some absolutely. And therefore it is fit we should consider them apart. As for example it is without question (I suppose) that Christ died to procure pardon of sin and salvation of soul, but how absolutely, whether men believe or no? Nothing less, but only conditionally, to wit, that for Christ’s sake their sins shall be pardoned and their souls saved, provided they do believe in Him. Now I willingly confess that Christ died for all in respect of procuring these benefits, to wit conditionally, upon the condition of their faith, in such sort that if all and every one should believe in Christ, all and every one should obtain the pardon of their sins and salvation of their souls for Christ’s sake. And I presume that no Arminian on the other side will affirm that Christ in such sort died for all and every one that all and every one should have their sins pardoned and their souls saved for Christ’s sake, whether they believe or no. What cause then is there of any difference between us on this point, thus explicated. Yet hereby it is manifest that the benefit of remission of sins and salvation of souls for Christ’s sake, shall in the end redound to none but such as believe, as this Author seems to acknowledge. But come we to faith itself and regeneration, are these benefits redounding unto us by the merits of Christ, yea or no?”

— William Twisse, The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice… (Amsterdam, 1631), 3rd Part | 1st Section, pp. 143-44">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+for+the+clearing+of+the+truth+of+this%2C+when+we+say+Christ+died+for+us%2C+the+meaning+is+that+Christ+died+for+our+benefit.+Now+these+benefits+which+Christ+procured+unto+us+by+his+death%2C+it+may+be+they+are+of+different+conditions%2C+whereof+some+are+ordained+to+be+conferred+only+conditionally%2C+and+some+absolutely.+And+therefore+it+is+fit+we+should+consider+them+apart.+As+for+example+it+is+without+question+%28I+suppose%29+that+Christ+died+to+procure+pardon+of+sin+and+salvation+of+soul%2C+but+how+absolutely%2C+whether+men+believe+or+no%3F+Nothing+less%2C+but+only+conditionally%2C+to+wit%2C+that+for+Christ%E2%80%99s+sake+their+sins+shall+be+pardoned+and+their+souls+saved%2C+provided+they+do+believe+in+Him.+Now+I+willingly+confess+that+Christ+died+for+all+in+respect+of+procuring+these+benefits%2C+to+wit+conditionally%2C+upon+the+condition+of+their+faith%2C+in+such+sort+that+if+all+and+every+one+should+believe+in+Christ%2C+all+and+every+one+should+obtain+the+pardon+of+their+sins+and+salvation+of+their+souls+for+Christ%E2%80%99s+sake.+And+I+presume+that+no+Arminian+on+the+other+side+will+affirm+that+Christ+in+such+sort+died+for+all+and+every+one+that+all+and+every+one+should+have+their+sins+pardoned+and+their+souls+saved+for+Christ%E2%80%99s+sake%2C+whether+they+believe+or+no.+What+cause+then+is+there+of+any+difference+between+us+on+this+point%2C+thus+explicated.+Yet+hereby+it+is+manifest+that+the+benefit+of+remission+of+sins+and+salvation+of+souls+for+Christ%E2%80%99s+sake%2C+shall+in+the+end+redound+to+none+but+such+as+believe%2C+as+this+Author+seems+to+acknowledge.+But+come+we+to+faith+itself+and+regeneration%2C+are+these+benefits+redounding+unto+us+by+the+merits+of+Christ%2C+yea+or+no%3F%E2%80%9D%0A%0A%E2%80%94+William+Twisse%2C+The+Doctrine+of+the+Synod+of+Dort+%26+Arles+Reduced+to+the+Practice%E2%80%A6+%28Amsterdam%2C+1631%29%2C+3rd+Part+%7C+1st+Section%2C+pp.+143-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fad2f535dcd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ad2f535dcd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=Now%20for%20the%20clearing%20of%20the,merits%20of%20Christ%2C%20yea%20or%20no&amp;text=Now%20for%20the%20clearing%20of%20the%20truth%20of&amp;text=by%20the%20merits%20of%20Christ%2C%20yea%20or%20no" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

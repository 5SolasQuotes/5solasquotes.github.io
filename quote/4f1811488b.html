<blockquote><p>Therefore if those exercises were so ordered that there were no probability of hurt to ensue, as if the races be very short and upon safe ground, if the combatant with the bull have a safe retreat, if cocks spur with huffles and fencers play with foils (that commonly do no harm) these and such-like spectacles may be well allowed for honest recreation.</p></blockquote>

<blockquote><p>5. A peaceable spirit must have a high esteem of peace, and be zealous for it, and industrious to obtain it. Only against ungodliness and unpeaceableness must he be unpeaceable. Many have a good wish and a good word for peace, as hypocrites have for godliness, but this will not serve the turn. He that is not for us is against us, and he that gathers not with us, and he that gathers not with us, scatters abroad. The wicked and unpeaceable are zealous and industrious against peace; and those that are for peace are cold and indifferent for the greater part; and the zealous and industrious are so few that their voices cannot be heard in the contentious crowd. The unpeaceable are commonly the loudest and are actuated by a fervent zeal, which nature agrees with and Satan cherishes and excites: such will even as the Quakers, go up and down from one assembly to another, and in the market-places and other places of concourse, revile and rail, and reproach the ministry, and speak as earnestly as if they were the agents of Christ. And others are busy in secret, that will not incur the disgrace of such visible impiety. And when the enemies of unity and peace are many, and hot and loud, and the friends of unity and peace are either few or cold and dull and silent, what’s like to be the issue, but even the mischiefs which we feel? Forsooth, some dare not be fervent for peace, lest they be censured for their fervor to be unpeaceable: These show how much they love the praise of men and stick yet in the power of self. There’s need of zeal for peace, as well as for other parts of holiness. All the resistance that the enemies of Hell and earth can make, will be made against it: And will it be carried on against all by sleepy wishes and sitting still? I am sure this agrees not with the precepts of the Spirit. ‘Follow peace with all men,’ Heb. 12:14. If it be possible, as much as in you lies, live peaceably with all men, Rom. 12:18. It’s a sorry surgeon, or physician that will think it enough to wish well to their patient: the House of God will be neither built, nor repaired without zeal and industry and patience in the work. If men’s hearts were set upon the Church’s peace, and they did but feel the disjoiting of her members, the breaking of her bones, and the smart of her wounds, as sensibly as they feel the like in their own bodies; and if ministers and other Christians were as sensible of the evil of divisions as they are of drunkenness, and whoredom, and such other sins, and if we were all awakened to quench the flames of the Church, as earnestly as we would do the fire in our houses, and would preach for peace and pray for peace, and plead and labor and suffer for peace, then some good might be done on it, against the rage and multitude of dividers. … 8. Another hindrance of unity and peace is a carnal zeal in matters of religion, which is frequently mistaken for the true zeal of the saints. When men are confident that their opinions are the truth, and overvalue them as to the necessity (because they are their own, though they observe not the reason), they presently think they must be hot against all the gainsayers of their opinions; and herein they place the most, or at least too much, of their religion. There’s not one of many that has this zeal but thinks it is of God and is part of their holiness, when as it is often from the Devil and the flesh, even when the doctrine is true which they contend for. You may know it from true zeal by these following marks:

1. It is more for controversies and speculations than for practical holiness.

2. It is selfish and kindled by an overvaluing their own conceits or ways.

3. It is private and would promote a lower truth to the loss of a greater, or a doubtful point, to the loss of undoubted truth; or a single truth, to the loss or hindrance of the body of common truth; and it is hotter for a party than for the catholic Church, and will promote the interest of an opinion or purity to the wrong of the common interest of the Church.

4. It is blind and carries men to sinful means, as resisting authority, order or ordinances, or the like.

5. It is unmerciful and unpeaceable, and little sensible of the case of others or smart of the divided Church. Many are calling for fire from Heaven for the cause of Christ, that little know what spirit they are of, Lk. 9:55. O how true is this of many that think they excel in knowledge or zeal and are but defending the truth against erroneous adversaries. But ‘who is the wise man and endued with knowledge among you? let him show out of a good conversation, his works with meekness of wisdom: But if you have bitter envying and strife in your hearts, glory not, and lie not against the truth: This wisdom descends not from above, but is earthly, sensual, devilish: For where envying and strife is, there is confusion, and every evil work: But the wisdom that is from above, is first pure, then peaceable, gentle, and easy to be entreated, full of mercy and good fruits, without partiality, without hypocrisy; And the fruit of righteousness is sown in peace of them that make peace.’ Jam. 3:13 to the end. But of this I have formerly spoken at large in many sermons on these words of James. Dividing zeal is a grievous distracter of the Church’s peace.</p></blockquote>

22.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f64231e22.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-zeal/#:~:text=5.%20A%20peaceable%20spirit%20must%20have,grievous%20distracter%20of%20the%20Church%E2%80%99s%20peace&amp;text=5.%20A%20peaceable%20spirit%20must%20have%20a%20high&amp;text=is%20a%20grievous%20distracter%20of%20the%20Church%E2%80%99s%20peace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>One finds Calvin (for instance) declaiming, in his lectures, that they [French kings] are “gross and stupid.” They “think they are exempt from the law.” They are self-indulgent, “inhuman tyrants,” and “madmen.” They “despise everything divine” and wish to be worshipped in God’s place. They “rage against the church.” “We know that wherever there is cunning in the world, it reigns especially in the palaces of princes.”… Thus, the depiction of obsequious deference and obedience on the part of Geneva towards France was, in reality, a façade.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 97</span></figcaption>

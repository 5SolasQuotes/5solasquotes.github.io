<main class="wrap"><figure class="quote" id="q-670925aa26" data-kw="Old Testament Trinity degrees">
<blockquote><p>Although the mystery of the Trinity was more obscure under the Old than under the New Testament, it does not follow that it was then altogether unknown. For otherwise, they could neither have known the true God nor have been able to believe in the Messiah. Therefore we must distinguish knowledge from its degrees. The same knowledge was given as to substance, but it varied in degree.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.24.11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-trinity-in-scripture.html">The Trinity in Scripture</a> › <a href="../topics/the-trinity/the-trinity-in-scripture/old-testament-evidence.html">Old Testament evidence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5edfc0ba95" data-kw="Old Testament Trinity">
<blockquote><p>From the arguments adduced by us before to prove the necessity of this doctrine as a fundamental article, it might be satisfactorily inferred that it was revealed and known under the Old Testament (since fundamentals are the same among all believers). … It therefore becomes necessary to establish against both the truth of this mystery not only from the New, but also from the Old Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.26.1</span></figcaption>

</figure><figure class="quote" id="q-cd4ab28589" data-kw="against Sabellius">
<blockquote><p>The passages that the Apostle to the Hebrews applies to Christ are not obscure praises of the supreme God: &quot;You, Lord, laid the foundation of the earth in the beginning, and the heavens are the work of your hands.&quot; Also, &quot;Let all God&#x27;s angels worship him.&quot; John begins his Gospel with a splendid proclamation of Christ&#x27;s divinity: &quot;In the beginning was the Word, and the Word was with God, and the Word was God.&quot; This phrase, &quot;the Word was God, and was with God,&quot; clearly argues both the divinity of Christ and the distinction of persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XV</span></figcaption>

</figure><figure class="quote" id="q-403ca18eee" data-kw="1 John 5:7 Trinity">
<blockquote><p>Although the word “Trinity” (proper to this mystery) follows. Although not existing in Scripture in the abstract, it is nevertheless found in the concrete (1 Jn. 5:7), so that there was no necessity for the papists to derive it from tradition to betray the cause of faith to heretics, since Bellarmine himself confessed that the Trinity can evidently be deduced from Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.23.9</span></figcaption>

</figure><figure class="quote" id="q-950d6750e8" data-kw="one God plurality persons">
<blockquote><p>And because we have no difference with our adversaries distinctly about this matter, I shall only name some few of them. … And although there be no more absolute and sacred truth than this, that God is one, yet it may be evinced that it is nowhere mentioned in the Scripture, but that, either in the words themselves or the context of the place, a plurality of persons in that one sense is intimated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Declaration and Vindication of the Doctrine of the Trinity</cite>, I</span></figcaption>

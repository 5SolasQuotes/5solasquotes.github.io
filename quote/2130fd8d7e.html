<blockquote><p>1. The text [1 Cor. 11:16] gives him [Anglican bishop Andrewes] no ground for this doctrine… that the custom of the Church should be enough to us in matters of ceremony… for the custom of the Church there spoken of is not concerning a point of circumstance, but concerning a very substantial and necessary point, namely, not to be contentious: neither does the apostle urge those orders of the men’s praying uncovered and the women’s praying veiled from this ground, because so was the Church’s custom (as the bishop would have it), but only he is warning the Corinthians not to be contentious about those matters, because the churches have no such custom as to be contentious. So is the place expounded by Chrysostom, Ambrose, Calvin, Martyr, Bullinger, Marlorat, Beza, Fulke, Cartwright, Pareus… And for this exposition it makes that the apostle in the preceding part of the chapter has given sufficient reasons for that order of covering or veiling the women: wherefore if any would contend about the matter, he tells them they must contend with themselves, for they (nor the churches of God) would not contend with them: they had no such custom. … 2. The custom of the Church is not enough to pitch on, and it is found oftentimes expedient to change a custom of the Church. Basil the Great does flatly refuse to admit the authority of custom: Consuetudo sine veritate [Custom without truth], says Cyprian, vetustas erroris est [is an old thing erring]. Frustra enim qui ratione vincuntur, says Augustine, consuetudinem nobis objiciunt, quasi consuetudo major sit veritate, etc. Nullus pudor est ad meliora transire, says Ambrose to the Emperour Valentinian: Quaelibet consuetudo [Any custom], says Gratian, veritati est postponenda [ought to be put after the truth]. And again: Corrigendum est quod illicite admittitur, aut a praedecessoribus admissum invenitur. A politic writer admonishes, retinere antiqua [retain that which is ancient], only with this caution: Si proba [if it is proved]. Calvin (speaking against human ceremonies) says: Si objiciatur, etc. ‘If’, says he, ‘antiquity be objected (albeit they who are too much addicted to custom and to received fashions, do boldly use this buckler to defend all their corruptions), the refutation is easy: For the ancients also themselves with heavy complaints have abundantly testified that they did not approve of anything which was devised by the will of men.’ In the end of the epistle he alleges this testimony of Cyprian: ‘If Christ alone be to be heard, then we ought not to give heed what any man before us has thought fit to be done, but what Christ (who is before all) has done, for we must not follow the custom of man, but the truth of God.’ What can be more plain than that antiquity cannot be a confirmation to error, nor custom a prejudice to truth?… 3. …If then it be enough to pitch upon custom, why ought not those customs to have been commended and continued? But if they were commendably changed, then ought we not to follow blindly the bare custom of the Church, but examine the equity of the same, and demand grounds of reason for it. St. Paul (says Dr. Fulke) does give reasons for that order of covering women’s heads: By whose example the preachers are likewise to endeavor to satisfy by reason both men and women, that humbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only. 4. Whereas the custom of some churches is alleged for the ceremonies, we have objected the custom of other churches against them: Neither shall ever our opposites prove them to be the customs of the Church universal. … 6. If it were so that we ought to pitch upon the Churches custom, yet (that I may speak with Mr. [Richard] Hooker) the law of common indulgence permits us to think of our own customs as half a thought better than the customs of others. But why was there such a change made in the discipline, policy and orders of the Church of Scotland, which were agreeable to the Word of God, confirmed and ratified by general assemblies and parliaments, used and enjoyed with so great peace and purity? Our custom should have holden the ceremonies out of Scotland, hold them in elsewhere as it may.</p></blockquote>

<blockquote><p>Although there is much evidence for the practice of female veiling in the Classical world it has for the most part been ignored. Evidence for the veiling of Roman women is found in many sources. Ancient lexicographers list many names for veils that these women wore. Each of these veils was particular to the context in which they were worn and by whom they were worn. The plenitude of veiling terminology as well as the specialized nature of these veils alerts the reader to the importance that the Romans attributed to the veil, suggesting that it formed an important part of their culture and this is described in visual and literary terms by ancient artists and writers. … The practice of veiling is therefore viewed by the Romans in a positive light, and its disruption is understood by them as a cause for concern. This concern was especially apparent during the late republic. The dissolution of the traditional forms of government was in some ways problematized in terms of gender, with women’s abandonment of their traditional roles and their incursion into the public sphere being of specific importance. In order to remedy this, attempts were made by the new regime of Augustus to promote a return to what were seen to be traditional gender relations. This programme of moral reform made use of both formal, legalistic decree (the Julian marriage laws) and more propagandistic constructions (the public works of art). In this process traditional symbols assumed a high degree of salience. Because of its power to signify the beneficial and appropriate status of the female body, one of the most important of these symbols was the veil.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Although there is much evidence for the practice of female veiling in the Classical world it has for the most part been ignored. Evidence for the veiling of Roman women is found in many sources. Ancient lexicographers list many names for veils that these women wore. Each of these veils was particular to the context in which they were worn and by whom they were worn. The plenitude of veiling terminology as well as the specialized nature of these veils alerts the reader to the importance that the Romans attributed to the veil, suggesting that it formed an important part of their culture and this is described in visual and literary terms by ancient artists and writers. … The practice of veiling is therefore viewed by the Romans in a positive light, and its disruption is understood by them as a cause for concern. This concern was especially apparent during the late republic. The dissolution of the traditional forms of government was in some ways problematized in terms of gender, with women’s abandonment of their traditional roles and their incursion into the public sphere being of specific importance. In order to remedy this, attempts were made by the new regime of Augustus to promote a return to what were seen to be traditional gender relations. This programme of moral reform made use of both formal, legalistic decree (the Julian marriage laws) and more propagandistic constructions (the public works of art). In this process traditional symbols assumed a high degree of salience. Because of its power to signify the beneficial and appropriate status of the female body, one of the most important of these symbols was the veil.”

— Lydia Lenore Veronica Matthews, Conspicuous Concealment: an Investigation into the Veiling of Roman Women, with Special Reference to the Time of Augustus MA thesis (University of KwaZulu-Natal, 2007) 225 pp. Pictures are on, pp. 149-204">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+there+is+much+evidence+for+the+practice+of+female+veiling+in+the+Classical+world+it+has+for+the+most+part+been+ignored.+Evidence+for+the+veiling+of+Roman+women+is+found+in+many+sources.+Ancient+lexicographers+list+many+names+for+veils+that+these+women+wore.+Each+of+these+veils+was+particular+to+the+context+in+which+they+were+worn+and+by+whom+they+were+worn.+The+plenitude+of+veiling+terminology+as+well+as+the+specialized+nature+of+these+veils+alerts+the+reader+to+the+importance+that+the+Romans+attributed+to+the+veil%2C+suggesting+that+it+formed+an+important+part+of+their+culture+and+this+is+described+in+visual+and+literary+terms+by+ancient+artists+and+writers.+%E2%80%A6+The+practice+of+veiling+is+therefore+viewed+by+the+Romans+in+a+positive+light%2C+and+its+disruption+is+understood+by+them+as+a+cause+for+concern.+This+concern+was+especially+apparent+during+the+late+republic.+The+dissolution+of+the+traditional+forms+of+government+was+in+some+ways+problematized+in+terms+of+gender%2C+with+women%E2%80%99s+abandonment+of+their+traditional+roles+and+their+incursion+into+the+public+sphere+being+of+specific+importance.+In+order+to+remedy+this%2C+attempts+were+made+by+the+new+regime+of+Augustus+to+promote+a+return+to+what+were+seen+to+be+traditional+gender+relations.+This+programme+of+moral+reform+made+use+of+both+formal%2C+legalistic+decree+%28the+Julian+marriage+laws%29+and+more+propagandistic+constructions+%28the+public+works+of+art%29.+In+this+process+traditional+symbols+assumed+a+high+degree+of+salience.+Because+of+its+power+to+signify+the+beneficial+and+appropriate+status+of+the+female+body%2C+one+of+the+most+important+of+these+symbols+was+the+veil.%E

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7826d6ff7b" data-kw="Author of sin Temptation">
<blockquote><p>For understanding this point, how the providence of God reacheth to and is concerned in sinful actions, we are to consider, that God neither puts evil into the hearts of men, nor stirs them up to it: for, says the apostle, Jam. 1:13. &#x27;God cannot be tempted with evil; neither tempteth he any man.&#x27; And therefore he is not the author of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on providence</span></figcaption>

</figure><figure class="quote" id="q-8cf68e1dd6" data-kw="">
<blockquote><p>….we have seen that anything that exists or could exist other than God would have potentials that need actualization, parts that need to be combined, and an essence distinct from its existence, and would therefore be contingent. We have also seen that such things can exist, even for an instant, only insofar as they are caused by that which is purely actual, absolutely simple, subsistent existence itself, and absolutely necessary; and we have seen that there cannot in principle be more than one such cause. It follows that anything that exists or could exist other than God depends at every instant on God for its existence. Recall also the principle agere sequitur esse [action follows existence], according to which a thing’s attributes and activities cannot go beyond its nature. When we combine this principle with the thesis that the sheer existence of anything at any moment depends on God’s causing it to exist, we get the result that the operation or activity of anything at any moment also depends on God. For if a thing could not even exist for an instant apart from God, how could it act at any instant apart from God? If the thing has no independent capacity for existence, where could an independent capacity for action possibly come from? Existing, after all, is more fundamental than acting, since it is presupposed by acting. So, if a thing’s essence gives it no capacity even to exist apart from God, it cannot intelligibly give it power to act apart from God. So, everything that exists or could exist other than God depends at every instant not only for its existence, but also for its capacity to do anything, on God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (Ignatius Press, 2017), ‘The Divine Attributes’, ‘Omnipotence’</span></figcaption>

</figure><figure class="quote" id="q-94813ced0a" data-kw="">
<blockquote><p>It would be to be wished that this contestation had not gone out of the schools of the Roman Communion, where it [the teaching of divine premotion] took birth. But by a misfortune that one could not deplore enough, it has passed even into ours, although with some difference. In effect in the Roman Church there is no one who has not taken sides on this, while in ours few writers have paid attention to this dispute, of which the matter is in effect quite metaphysical. When one reads the works of most of our theologians one has much difficulty perceiving that they have even heard speaking of it. The others [of the Reformed], to whom this contestation has not been unknown, have divided themselves on this. Most have declared themselves for premotion. This is what have done among the supralapsarians Piscator, Maccovius, Voet, Twisse, Rutherford and others, and among the infralapsarians Rivet, Maresius, Turrettin, etc. Several have said things quite opposed to this sentiment, like Junius, Pareus, the theologians of England deputies to the Synod of Dort, H. Alting, P. Ferri, M. Amyraut, M. Morus, etc. Some have explained themselves more clearly, and have positively rejected this dogma, like four of our philosophers, Gockenius, Rutgersius, Jacchæus and Burgersdijk. Some even have refuted it amply and solidly, like Robert Baron, Strangius, Baxter, Heidegger and M. Holsius. That alone makes it clear that it is more or less the same with the Roman Church as with ours, at least in this regard, that in one and in the other premotion has adversaries and partisans, from which one can conclude what is the injustice of the reproaches that the missionaries make to us on this in such an insulting manner. For finally if it is wrong for us to suffer the Predeterminants in our communion, by what right do the Pope and his councils suffer them in theirs?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean La Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>La Placette vs. Naude on Premotion, Concurrence &amp; Decrees</cite>, trans. from French by AI (Amsterdam: 1707 ff.), pp. 265-66 La Placette (1639-1718) was a French reformed minister who was against divine premotion.</span></figcaption>

</figure><figure class="quote" id="q-f124048d8b" data-kw="">
<blockquote><p>…the opposing position of the Thomists about the physically predetermining quality, as they call it… I agree with them in the matter and differ only in the mode; and because a quality of this kind understood in that way is not found in Saint Thomas; and because through the artifice of adversaries it was introduced into the Thomist school — with them caring less about it because they thought it made no difference to be determined in this or that mode, and afterward quarreling about the act of it, as Zumel admits, in whose writings I found it written; and because, the error being now recognized, that quality is commonly rejected and another kind of determination is received. Concerning which we perhaps agree with them… First I observe that this prior impressed physical quality is altogether rejected by Scotus, as we will show below… That predetermining quality physically is altogether required [according to Thomists] in the free cause in first act for operating, and without it the will cannot be determined to second act; and given it, the will consequently acts and operates with certainty and determination — for it is given for that purpose, so that it may operate. But from this it follows that those in whom it is not impressed cannot operate;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the opposing position of the Thomists about the physically predetermining quality, as they call it… I agree with them in the matter and differ only in the mode; and because a quality of this kind understood in that way is not found in Saint Thomas; and because through the artifice of adversaries it was introduced into the Thomist school — with them caring less about it because they thought it made no difference to be determined in this or that mode, and afterward quarreling about the act of it, as Zumel admits, in whose writings I found it written; and because, the error being now recognized, that quality is commonly rejected and another kind of determination is received. Concerning which we perhaps agree with them… First I observe that this prior impressed physical quality is altogether rejected by Scotus, as we will show below… That predetermining quality physically is altogether required [according to Thomists] in the free cause in first act for operating, and without it the will cannot be determined to second act; and given it, the will consequently acts and operates with certainty and determination — for it is given for that purpose, so that it may operate. But from this it follows that those in whom it is not impressed cannot operate;”

— Francisco Macedo, Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Contra Physical Predetermination, p. 386">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+opposing+position+of+the+Thomists+about+the+physically+predetermining+quality%2C+as+they+call+it%E2%80%A6+I+agree+with+them+in+the+matter+and+differ+only+in+the+mode%3B+and+because+a+quality+of+this+kind+understood+in+that+way+is+not+found+in+Saint+Thomas%3B+and+because+through+the+artifice+of+adversaries+it+was+introduced+into+the+Thomist+school+%E2%80%94+with+them+caring+less+about+it+because+they+thought+it+made+no+difference+to+be+determined+in+this+or+that+mode%2C+and+afterward+quarreling+about+the+act+of+it%2C+as+Zumel+admits%2C+in+whose+writings+I+found+it+written%3B+and+because%2C+the+error+being+now+recognized%2C+that+quality+is+commonly+rejected+and+another+kind+of+determination+is+received.+Concerning+which+we+perhaps+agree+with+them%E2%80%A6+First+I+observe+that+this+prior+impressed+physical+quality+is+altogether+rejected+by+Scotus%2C+as+we+will+show+below%E2%80%A6+That+predetermining+quality+physically+is+altogether+required+%5Baccording+to+Thomists%5D+in+the+free+cause+in+first+act+for+operating%2C+and+without+it+the+will+cannot+be+determined+to+second+act%3B+and+given+it%2C+the+will+consequently+acts+and+operates+with+certainty+and+determination+%E2%80%94+for+it+is+given+for+that+purpose%2C+so+that+it+may+operate.+But+from+this+it+follows+that+those+in+whom+it+is+not+impressed+cannot+operate%3B%E2%80%9D%0A%0A%E2%80%94+Francisco+Macedo%2C+Collations+of+the+Teachings+of+St.+Thomas+%26+Scotus%2C+with+the+Differences+between+the+Two%3A+with+the+Texts+of+Both+Faithfully+Presented%2C+and+the+Sentences+Subtly+Ex

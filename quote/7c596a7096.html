<blockquote><p>The two Demurrers…: ‘Except[ion] against this our present obedience, because the present power is yet new: neither is there a total cessation of all hopes of recovery.’ Philosophers hold that the definition of a man belongs to an infant as well as to one of many years, because after the organization of the parts, he is informed with the same principle of life and reason as a grown man is; and having the same form, is the same thing. Even so the present power has possessed all the parts of this kingdom, gives them life in the administration of public justice and protection, which are the soul of a State, and the power which preceded this, what did it infuse more vital than this? And now that that is taken away, if this other did not presently enter into its place, the commonwealth were dead and each man were left in his naturals to subsist of himself and to cast how he could in such a state of war, defend himself from all the rest of the world, every man in this State having an equal right to everything.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or a Vindication of our Lawful Submission to the Present Government… (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse.</cite>, p. 27</span></figcaption>

</figure><figure class="quote" id="q-c467d0fb58" data-kw="">
<blockquote><p>It is the duty of people to pray for magistrates, to pay them tribute and other dues, and to be subject to their authority for conscience sake: infidelity, or difference in religion, doth not make void the magistrate’s just and legal authority?</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-51c3b75087" data-kw="">
<blockquote><p>§25… We must distinguish: 1. between a lawful impose or contracter, and a violent usurper or robber that injuriously compels us to swear. 2. Between the obvious usual sense of the words and an unusual forced sense. 3. Between a sincere, involuntary misunderstanding the imposer, and a voluntary fraudulent reservation or private sense. 4. Between one that I owe something to antecedently, and one that I owe nothing to but by the mere self-obligation of my vow. 5. Between an imposer that is himself the culpable cause of my misunderstanding him, and one that is not the cause, but my own weakness or negligence is the cause. 6. Between a case where both senses may be kept, and a case where they cannot, being inconsistent. … Proposition 6. If the imposer be a robber or usurper, or one that I owe nothing to in justice, but what I oblige myself to by my oath, I am not then bound at all to keep my oath in his sense, if my own sense was according to the common use of the words. Proposition 7. Though I may not lie to a robber or tyrant that unjustly imposes promises or oaths upon me, yet if he put an oath or promise on me which is good and lawful in the proper usual sense of the words, though bad in his sense (which is contrary to the plain words), whether I may take this to save my liberty or life, I leave to the consideration of the judicious: that which may be said against it is, that oaths must not be used indirectly and dissemblingly. That which may be said for it is: 1. That I have no obligation to fit my words to his personal private sense. 2. That I deceive him not, but only permit him to deceive himself, as long as it is he and not I that misuses the words. 3. That I am to have chief respect to the public sense: and it is not his sense, but mine that is the public sense. 4. That the saving of a man’s life or liberty is cause enough for the taking [of] a lawful oath. [Baxter elsewhere says this: “Lawyer: But as you have said that those great men, [Hugo] Grotius and Bishop Jeremy Taylor were for profitable lying, so you know that worthy Latitudinarian doctor who was wont to say that if false knaves would turn him out of his ministry and living by ensnaring impositions, he would take the words in the best sense he could subdue them to, whatever the authors meant; and it was as lawful for him to defend himself against knaves with his tongue, as with his hands and sword. … §32. Rule 18. Though an oath imposed by an usurper or by violence is not to be taken in formal obedience, nor at all, unless the greatness of the benefit require it, yet being taken it is nevertheless obligatory (supposing nothing else do make it void). Man is a free agent and cannot be forced though he may be frightened: If he swear to a thief for the saving of his life, he voluntarily does choose the inconveniences of the oath as a means to save his life. Therefore being a voluntary act it is obligatory. Else there should be no obligation on us to suffer for Christ, but anything might be sworn or done to escape suffering: See of this Dr. Sanderson largely, Lectures 4, sect. 14-16. The imposition and the oath are different things. In the imposition, a thief or tyrant is the party commanding, and I am the party commanded: And his having no authority to command me, does nullify only his command and makes me not obliged to obey him, nor to take it in any obedience to him: But yet if I do take it without any authority obliging me (as private oaths are taken), it is still an oath or vow, in which the parties are God and man: Man vowing and making himself a debtor to God: And God has authority to require me to keep my vows, when men have no authority to require me to make them. All men confess that private Vows bind: And the nullity of the imposer’s authority makes them but private vows. This case is easy and commonly agreed on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory... (London, 1673), pt. 3, ch. 5 | title 2</cite>, p. 705</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

ve said that those great men, [Hugo] Grotius and Bishop Jeremy Taylor were for profitable lying, so you know that worthy Latitudinarian doctor who was wont to say that if false knaves would turn him out of his ministry and living by ensnaring impositions, he would take the words in the best sense he could subdue them to, whatever the authors meant; and it was as lawful for him to defend himself against knaves with his tongue, as with his hands and sword. … §32. Rule 18. Though an oath imposed by an usurper or by violence is not to be taken in formal obedience, nor at all, unless the greatness of the benefit require it, yet being taken it is nevertheless obligatory (supposing nothing else do make it void). Man is a free agent and cannot be forced though he may be frightened: If he swear to a thief for the saving of his life, he voluntarily does choose the inconveniences of the oath as a means to save his life. Therefore being a voluntary act it is obligatory. Else there should be no obligation on us to suffer for Christ, but anything might be sworn or done to escape suffering: See of this Dr. Sanderson largely, Lectures 4, sect. 14-16. The imposition and the oath are different things. In the imposition, a thief or tyrant is the party commanding, and I am the party commanded: And his having no authority to command me, does nullify only his command and makes me not obliged to obey him, nor to take it in any obedience to him: But yet if I do take it without any authority obliging me (as private oaths are taken), it is still an oath or vow, in which the parties are God and man: Man vowing and making himself a debtor to God: And God has authority to require me to keep my vows, when men have no authority to require me to make them. All men confess that private Vows bind: And the nullity of the imposer’s authority makes them but private vows. This case is easy and commonly agreed on.”

2C+but+mine+that+is+the+public+sense.+4.+That+the+saving+of+a+man%E2%80%99s+life+or+liberty+is+cause+enough+for+the+taking+%5Bof%5D+a+lawful+oath.+%5BBaxter+elsewhere+says+this%3A+%E2%80%9CLawyer%3A+But+as+you+have+said+that+those+great+men%2C+%5BHugo%5D+Grotius+and+Bishop+Jeremy+Taylor+were+for+profitable+lying%2C+so+you+know+that+worthy+Latitudinarian+doctor+who+was+wont+to+say+that+if+false+knaves+would+turn+him+out+of+his+ministry+and+living+by+ensnaring+impositions%2C+he+would+take+the+words+in+the+best+sense+he+could+subdue+them+to%2C+whatever+the+authors+meant%3B+and+it+was+as+lawful+for+him+to+defend+himself+against+knaves+with+his+tongue%2C+as+with+his+hands+and+sword.+%E2%80%A6+%C2%A732.+Rule+18.+Though+an+oath+imposed+by+an+usurper+or+by+violence+is+not+to+be+taken+in+formal+obedience%2C+nor+at+all%2C+unless+the+greatness+of+the+benefit+require+it%2C+yet+being+taken+it+is+nevertheless+obligatory+%28supposing+nothing+else+do+make+it+void%29.+Man+is+a+free+agent+and+cannot+be+forced+though+he+may+be+frightened%3A+If+he+swear+to+a+thief+for+the+saving+of+his+life%2C+he+voluntarily+does+choose+the+inconveniences+of+the+oath+as+a+means+to+save+his+life.+Therefore+being+a+voluntary+act+it+is+obligatory.+Else+there+should+be+no+obligation+on+us+to+suffer+for+Christ%2C+but+anything+might+be+sworn+or+done+to+escape+suffering%3A+See+of+this+Dr.+Sanderson+largely%2C+Lectures+4%2C+sect.+14-16.+The+imposition+and+the+oath+are+different+things.+In+the+imposition%2C+a+thief+or+tyrant+is+the+party+commanding%2C+and+I+am+the+party+commanded%3A+And+his+having+no+authority+to+command+me%2C+does+nullify+only+his+command+and+makes+me+not+obliged+to+obey+him%2C+nor+to+take+it+in+any+obedience+to+him%3A+But+yet+if+I+do+take+it+without+any+authority+obliging+me+%28as+private+oaths+are+taken%29%2C+it+is+still+an+oath+or+vow%2C+in+which+the+parties+are+God+and+man%3A+Man+vowing+and+making+himself+a+debtor+to+God%3A+And+God+has+authority+to+require+me+to+keep+my+vows%2C+when+men+have+no+authority+to+require+me+to+make+them.+All+men+confess+that+private+Vows+bind%3A+And+the+nullity+of+the+imposer%E2%80%99s+authority+makes+them+but+private+vows.+This+case+is+easy+and+commonly+agreed+on.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory...+%28London%2C+1673%29%2C+pt.+3%2C+ch.+5+%7C+title+2%2C+p.+705&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F51c3b75087.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/51c3b75087.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=%C2%A725%E2%80%A6%20We%20must%20distinguish%3A,is%20easy%20and%20commonly%20agreed%20on." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

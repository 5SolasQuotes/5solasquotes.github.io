<main class="wrap"><figure class="quote" id="q-b912b00662" data-kw="">
<blockquote><p>The account of Adam’s fall can be understood in its full compass only if in it the whole human race fell, which can no otherwise be conceived than on the supposition of the propagation of sin by generation. That Adam’s fall is the fall of the human family, is implied, in the punishment, which affects not the individual, but the entire race.

Everything which stands immediately connected with the account of the fall, the narrative of Cain’s fratricide, etc., is inexplicable, if we limit the fall merely to the individual Adam, and there is a breaking down of the bridge formed, in the generation between him and. his posterity, to which express allusion is made in Gen. v. 3, “And Adam begot like him and after his image,” (in every respect, and hence also in reference to sin, which had now become a property of his nature.) The whole subsequent relation is designed to shew, how fruitfully the principle of sin, implanted in nature through Adam, developed itself. According to Gen. viii. 21, the thoughts and imaginations of the human heart are only evil from his youth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/e-w-hengstenberg.html">E. W. Hengstenberg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Psalms</cite>, trans. Patrick Fairbairn and John Thomson (3 vols, Edinburgh: T. &amp; T. Clark, 1846), 2: 187.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin.html">Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8cc42432c9" data-kw="">
<blockquote><p>Those who maintain that concupiscence is not sin, are wont to found on the passage of James, &quot;Then, when lust has conceived, it bringeth forth sin,&quot; (James 1:15). But this is easily refuted: for unless we understand him as speaking only of wicked works or actual sins, even a wicked inclination will not be accounted sin. But from his calling crimes and wicked deeds the fruits of lust, and also giving them the name of sins, it does not follow that the lust itself is not an evil, and in the sight of God deserving of condemnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.3.13</span></figcaption>

</figure><figure class="quote" id="q-19d2d6d534" data-kw="">
<blockquote><p>What kind of Mortification is most requisite, so as in more measure to free the heart from doubtings? In a word, this; be sure the mortifying be

1. Radical: lay the axe to the root: As all Graces thrive most when their springs are quickened, so all sins decay most when their roots are mortified. Corrupt acts will fall quickly, if a corrupt heart were more sanctified. The strength of sin is inward, there are the strong holds which need most to be cast down: By all means set up a crucifying Christ in thy bosom.

2. Impartial. It is true, one sin may trouble more then another, but it will be thy wisdom to trouble all sin: Sins are chained together as well as Graces; and one sin serves to help another, and the neglected sin may perhaps suddenly wound thee, and make thee to stagger. The whole body of sin in every member of it, must be the object of thy mortifying work: This will testify the truth of Grace received, and the sincerity of thy conscience, and consequently will remove many bottoms of fears and doubtings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doubting Believer</cite>, (London: Thomas Nicols, 1641), pp 118-19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin.html">Sin</a></span></div>

</figure><figure class="quote" id="q-17d1cee9cf" data-kw="actual">
<blockquote><p>Second, involuntary may be taken in two ways: either positively or negatively. The former is the same as unwilling which is such by a positive nolition. In this sense, we grant that no sin can be involuntary. The latter is what is done (the act of will ceasing) when the will ought to have acted (which is said to be such by a negative nolition). In this sense, every sin is not necessarily voluntary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.2</span></figcaption>

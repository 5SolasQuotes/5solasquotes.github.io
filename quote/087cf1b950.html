<main class="wrap"><figure class="quote" id="q-087cf1b950" data-kw="">
<blockquote><p>Words signify by general custom, and have the same sense out of the worship of God as in it; and therefore the arguing from their lawfulness as signs of worship unto the lawfulness of instituted signs seems liable to exception. Nevertheless it may be said that instituted signs soon become customary and as well understood as words… With acknowledgment of my own weakness, I express my apprehensions of this matter. God has allowed words for signs expressive of divine worship, but I find not that He has allowed words only and forbidden gestures and actions for such an end. The dumb [who can’t speak] must express their internal worship by gestures and actions or they cannot externally worship God at all. If signs of devotion that are of customary signification be lawful, I see not why such as are of instituted signification should be unlawful, and especially when they become as customary, as those that have been without institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of the Reverend &amp; Learned Mr. John Corbet</cite>, Of Divine Worship, in Three Parts in The Remains of the Reverend &amp; Learned Mr. John Corbet… (London: Parkhurst, 1684), pt. 3, section 6</span></figcaption>

blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8e8486529" data-kw="">
<blockquote><p>The Dr. holds him upon kneeling in receiving the sacramental elements, and denies that it is scandalous or any way inductive to spiritual ruin. But (if he will) he may consider that the ruder sort who can not distinguish betwixt worshipping the bread and worshipping before the bread, nor discern how to make Christ the passive object of that worship and the bread the active, and how to worship Christ in the bread, and make the worship relative from the bread to Christ; are by his example induced to bread-worship, when they perceive bowing down before the consecrated bread in the very same form and fashion wherein Papists are seen to worship it, but can not conceive the nice distinctions which he and his companions use to purge their kneeling in that act from idolatry. As for others who have more knowledge, they are also induced to ruin, being animated by his example to do that which their consciences do condemn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 2, ch. 9; p. 44</span></figcaption>

</figure><figure class="quote" id="q-55863c74d4" data-kw="">
<blockquote><p>Answer 1. The customs of several countries putting several significations on gestures, much varies the case. 2. We must not lightly differ from the customs of the churches where we live in such a thing. … 5. And because there is so great a difference between the auditors in most assemblies, some being weak and not able to stand long, etc. therefore it is utterly unmeet to be too rigorous in urging a uniformity of gesture, or for any to be too censorious of other men for a gesture.</p></blockquote>

</figure><figure class="quote" id="q-3640441801" data-kw="">
<blockquote><p>11. …for they [Quakers] will salute no man, nor uncover their head, not only to their equals, but neither will they do it unto their superiors, nor give the least sign of respect, of honour, or of reverence in their gesture and carriage unto any whatsoever. And he [Robert Barclay] says he cannot see what we can say in defence of our practice. But we have shown above what is our ground: and we have seen the same practised by other worthy persons mentioned in Scripture… As concerning, says he, the fashions and customs of the nations, it is an evil argument for the practice of Christians, who should follow a better rule. Answer: And so we do follow a better rule; and yet we may follow the Law of nations, which is mostly gathered from the practice of nations, in things not contrary to the Law of God; for even the Law of nations, in such things, is a part of the Law of God, being but some particular applications or explications of the Law of Nature: And though no particular gesture, as a sign of respect and reverence, due to our equals or superiours, be universally received by all nations, yet the Law of Nations and their practice may teach us that by some one outward gesture or other we ought to witness our respect and declare that reverence that we owe to others: Christianity is no enemy to humanity and civility, whatever our morose and unmannerly Quakers dream.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quakerism: the Pathway to Paganism, or a View of the Quakers’ Religion, being an Examination of the Theses &amp; Apology of Robert Barclay, one of their Number</cite>, ... (Edinburgh, 1678), ch. 31, ‘Of Civil Honor’, pp. 540-41</span></figcaption>

</figure><figure class="quote" id="q-6250c7f226" data-kw="">
<blockquote><p>The reason of this assertion [by opponents] is given to be this, that a bodily gesture being necessary, God not determining man upon any one, leaves him at plain liberty. Answer: Whether we be left at plain liberty in all things which being in the general necessary, and are not particularly determined in God’s Word; it shall be treated of elsewhere in this Dispute. In the meantime, whatsoever liberty God leaves man in bodily gestures, he leaves him no liberty of an unlawful and idolatrous gesture, such as kneeling in the instant of receiving a sacrament, when not only we have the outward sign purposely before us, and our minds and senses fastened upon it, for discerning the signification thereof and the analogy betwixt it and the thing signified, but also look upon it as an image of Christ or as a vicarious sign standing there in Christ’s stead. The indifferency of such a gesture in such a mediate worship should have been proved before such a rule (as this here given us for a reason) had been applied to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 72-73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

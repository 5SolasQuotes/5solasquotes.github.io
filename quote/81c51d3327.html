<main class="wrap"><figure class="quote" id="q-81c51d3327" data-kw="">
<blockquote><p>Question 2: Why must we continue thus long knocking? Why may we not give over if the gate be not speedily opened unto us? First, because the Lord stands long knocking at the door of our hearts before He can get entrance, and calls long before we will hear Him; And therefore there is great reason that we should continue long calling and crying unto Him and knocking at the door of mercy. Read Cant. 5:2 etc. and Apoc. 3:20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-ward.html">Richard Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Questions, Dogmatical Observations &amp; Evangelical Essays, upon the Gospel of Jesus Christ, according to St. Matthew</cite>, ... (London: Cole, 1640), on Mt. 7-8 Ward (c.1601-1684) was a covenanting, London minister on the side of Parliament. | on 7:7-8, p. 401</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b6c88927fa" data-kw="">
<blockquote><p>Let us care for nothing but to get Christ, and let Christ be the end of our faith and works, and then let Christ alone for bringing us to life, heaven, and happiness. Let us by faith make way for Christ to come into our hearts to be our Prophet, Priest, King, and Shepherd, that we may receive Him offering Himself, and then He will make way for us to God, heaven and eternal happiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/job-throckmorton.html">Job Throckmorton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Faith, pp. 63-64 as given in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 396 Throckmorton (1545-1601) was an English puritan.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-18fe4aaffb" data-kw="">
<blockquote><p>…do it obedientially, hearken to the commands, that thy peace may be as a river flowing in the joys of faith: If thus thou wilt hear and open to Christ, who stands and knocks at the door of thy heart, He will come in to thee, and sup with thee, and thou with Him, Rev. 3:20. He will come in to thee in intimate communion, and sup with thee in the acceptance of thy graces, and thou shalt sup with him at a banquet of love: Thou mayst experimentally say that the Gospel is come to thee in power and in the Holy Ghost, and in much assurance, as the apostle speaks, 1 Thess. 1:5. In power in, the first work of conversion; in the Holy Ghost, in the gracious indwelling of it after faith; and in much assurance, in the sealings of truth and love upon the heart.</p></blockquote>

<blockquote><p>3. This external and internal calling may be ineffectual or effectual. [1.] The ineffectual call consists in the bare tender and offer of grace, but it is not entertained. God may knock at the door of the heart that does not open to Him; knock by the word, knock by the motions of the Spirit and checks of conscience; so ‘many are called, but few are chosen,’ Matt 22:14. There is not the fruit of election, nor are these the called according to purpose. [2.] The effectual call is when God changes the heart, and brings it home to Himself by Jesus Christ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 12, Sermons Upon Romans 8, Sermon 8, p. 288</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-3a4fd6c2c2" data-kw="">
<blockquote><p>…but as for that which no hypocrite or unsound professor can attain to, a broken, hungry, self-deined heart, that Christ and his grace might enter and dwell there, oh, how harsh is it?… what shall they look for that despise the grace of the Gospel, and that offer which God has honored by so many miracles, and such abundance of sermons, and the powerful ministry of so many preachers? Beware of refusing such salvation, as being a more spiritual wickedness than any moral offense. Thirdly, its reproof to all cavillers that descant upon this free, plain and simple-hearted offer of God. Being urged to receive it, they answer so they would if they knew themselves elected. But (say they) we are afraid God means it us not. If we be chosen, we are sure to be called to believe it: if not, none of their preachers can give it us. It must be God (say they) and not man that must work our hearts and draw us. But, oh vain jangler, tell me, has not God revealed his will in his offer? Dost thou know his secrets? Is not his offer ingenuous? Say not in thine heart, ‘Who shall go up to Heaven or descend, etc? Lo, the Word is in thy mouth, it is neare thee.’ (Dt. 29:19) If Jeremiah in the dungeon had told Ebedmelech [Jer. 38] he knew not whether he meant to help him out or no, and so have refused to come out, had he not justly been left there still? So, when the Lord lets down the ladder of his offer, into thy dungeon, casts thee his cords and rags to put under thy armholes, that He may draw thee out, dost thou cavil and say, ‘Lord, I know not whether thou meanst me well or no; perhaps Thou wilt pull me out a little way, and then let me fall back again; perhaps I am not elected!’ Is not this a woeful dishonor to the simplicity of the offer? Was he ever tied at all to offer it? and dost thou distrust his ingenuous meaning in it? Thy blood be upon thy own head, in that thou choosest rather to smite the Lord to thy own destruction than to set thy foot in his ladder and put on his cords, that thou mightst come out! The way for thee is first to step upward that thou mayst come to the top than to leap to the top at first, to break thy neck backward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Catechism</cite>, ... (London: Norton, 1632), pt. 2, 4th Article, pp. 182-83</span></figcaption>

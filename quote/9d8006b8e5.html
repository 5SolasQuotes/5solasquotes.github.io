<main class="wrap"><figure class="quote" id="q-9d8006b8e5" data-kw="">
<blockquote><p>True Religion is, whereby God is worshipped by Rites and Ceremonies prescribed by himself; and his Name truly sanctified both through the whole course of our life, and chiefly at the times by himself appointed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The abridgment of Christian divinity</cite>, trans. Alexander Ross (3rd edn, London, 1660), pp 329-30.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05f545afa1" data-kw="">
<blockquote><p>Previous to the time of Constantine, we find no trace of an image of Christ, properly speaking, except among the Gnostic Carpocratians, and in the case of the heathen emperor Alexander Severus, who adorned his domestic chapel, as a sort of syncretistic Pantheon, with representatives of all religions. The above-mentioned idea of the uncomely personal appearance of Jesus, the entire silence of the Gospels about it, and the Old Testament prohibition of images, restrained the church from making either pictures or statues of Christ, until in the Nicene age a great change took place, though not without energetic and long-continued opposition. Eusebius gives us, from his own observation, the oldest report of a statue of Christ, which was said to have been erected by the woman with the issue of blood, together with her own statue, in memory of her cure, before her dwelling at Cæsarea Philippi (Paneas). But the same historian, in a letter to the empress Constantia (the sister of Constantine and widow of Licinius), strongly protested against images of Christ, who had laid aside his earthly servant form, and whose heavenly glory transcends the conception and artistic skill of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-schaff.html">Philip Schaff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of the Christian Church</cite>, (Charles Scribner’s Sons, 1910), 2.280–81.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-40215b5bd6" data-kw="">
<blockquote><p>And as for his [Jesus’] gesture in teaching, that He sat down, it was their custom in these times, and a testimony of the respect that is due to them that carry the mind of God; and we find Christ sometime[s] preach[ing] sitting, Lk. 4:20-21, sometime standing, Jn. 7:37, and at this time his weariness with night watching might call for it. Nor is it much to be stood upon which of these gestures men use in preaching, but preachers ought in these things [to] accommodate themselves to seek the benefit of hearers and that they be heard and seen by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, according to John</cite>, (London, 1657) | on John, 8:1-2</span></figcaption>

</figure><figure class="quote" id="q-21922151db" data-kw="">
<blockquote><p>Place is a circumstance. But place makes a moral action to be in a certain species of evil; for theft of a thing from a holy place is a sacrilege. Therefore a circumstance makes a moral action to be specifically good or bad. … And in this way, whenever a circumstance has a special relation to reason, either for or against, it must needs specify the moral action whether good or bad. … It is not every circumstance that places the moral action in the species of good or evil, since not every circumstance implies accord or disaccord with reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 10. ‘Whether a circumstance may place a moral action in the species of good or evil?’ [Yes]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“Place is a circumstance. But place makes a moral action to be in a certain species of evil; for theft of a thing from a holy place is a sacrilege. Therefore a circumstance makes a moral action to be specifically good or bad. … And in this way, whenever a circumstance has a special relation to reason, either for or against, it must needs specify the moral action whether good or bad. … It is not every circumstance that places the moral action in the species of good or evil, since not every circumstance implies accord or disaccord with reason.”

</figure><figure class="quote" id="q-6ed8f21cd7" data-kw="">
<blockquote><p>Come to churches and say, ‘You have these defects among you, and these things to be reformed;’ but if you will come and say, ‘Your churches and your ministers are Antichristian and come from Babylon,’ there is nothing [that] provokes more…. …and I have learned this principle, which I hope I shall never lay down till I am swallowed up of immortality; and that is that which I said before: To acknowledge every good thing, and hold communion with it, in men, in churches, or whatsoever else. I learn this from Paul; I learn this from Jesus Christ Himself: He fills all in all; He is in the hearts of his people, and fills them in his ordinances to this day; and where Jesus Christ fills, why should we deny an acknowledgment and a right hand of fellowship and communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 12 vols. (d. 1680; Edinburgh: Nichol, 1861), vol. 1, Exposition of Eph. 1 (1681), sermon 36, on 1:22-23, pp. 558-59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

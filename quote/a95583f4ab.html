<main class="wrap"><figure class="quote" id="q-a95583f4ab" data-kw="">
<blockquote><p>A very little reflection may suffice to convince us of the advantages accruing to revelation from being cast in such a form — though at present we can do little more than glance at them. First of all, it humanises (if we may so speak) the communications of God to men — does to some extent for the revelations generally of His mind and will what was specially and pre-eminently done by the Incarnation. The divine word spoken from the invisible heights, from the secret place of Godhead, and the same word uttered from the midst of earthly transactions, linked to the susceptibilities and experience of human bosoms — though they might perfectly coincide in substance — yet in form how necessarily different! and in the one how much more than in the other fitted to touch the sympathies of men, and sound the depths of their hearts!

It is at bottom, a recognising and acting on the great truth, that man was made in the image of God, and that only by laying hold of what remains of this image, and sanctifying it for higher uses, can the Spirit of God effectually disclose divine things, and win for them a place in the soul; the rays of the eternal sun must reach it, not by direct effulgence, but “through the luminous atmosphere of created minds.” Then, think how well this plan accords with, and secures that fullness and variety which is necessary to Scripture as the book, which from its very design, was to provide the seed-corn of spiritual thought and instruction for all times — a book for the sanctification of humanity, and the developing in the soul of a higher life than that of nature.

An end like this could never have been served by some general announcements from Heaven, or even by the most orderly systematic exhibition of divine truth — though written as with a sunbeam from the Upper Sanctuary. No; there was needed just what we find in Scripture — from its partaking so largely of the historical element — a rich and various treasury of knowledge, ample materials for meditation and inquiry, resembling more the freedom and fullness of nature, than the formality and precision of art.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Historical Character of Revelation, Particular in Method and Form, but Universal in Design and Application in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea0bc6aae3" data-kw="">
<blockquote><p>To acknowledge and confess, that, as we are convinced of our guilt, so, out of a deep sense thereof, we judge ourselves unworthy of the smallest benefits, most worthy of God’s fiercest wrath, and of all the curses of the law, and heaviest judgments inflicted upon the most rebellious sinners… Notwithstanding all which, to draw near to the throne of grace, encouraging ourselves with hope of a gracious answer of our prayers, in the riches and all-sufficiency of that only one oblation, the satisfaction and intercession of the Lord Jesus Christ… and humbly and earnestly to supplicate for mercy… And, with confidence of his mercy to his whole church, and the acceptance of our persons, through the merits and mediation of our High Priest, the Lord Jesus, to profess that it is the desire of our souls to have fellowship with God in the reverend and conscionable use of his holy ordinances; and, to that purpose, to pray earnestly for his grace and effectual assistance to the sanctification of his holy sabbath, the Lord’s day, in all the duties thereof, publick and private, both to ourselves, and to all other congregations of his people, according to the riches and excellency of the gospel, this day celebrated and enjoyed… And because we have been unprofitable hearers in times past, and now cannot of ourselves receive, as we should, the deep things of God, the mysteries of Jesus Christ, which require a spiritual discerning; to pray, that the Lord, who teacheth to profit, would graciously please to pour out the Spirit of grace, together with the outward means thereof, causing us to attain such a measure of the excellency of the knowledge of Christ Jesus our Lord, and, in him, of the things which belong to our peace…</p></blockquote>

</figure><figure class="quote" id="q-6250c7f226" data-kw="">
<blockquote><p>The reason of this assertion [by opponents] is given to be this, that a bodily gesture being necessary, God not determining man upon any one, leaves him at plain liberty. Answer: Whether we be left at plain liberty in all things which being in the general necessary, and are not particularly determined in God’s Word; it shall be treated of elsewhere in this Dispute. In the meantime, whatsoever liberty God leaves man in bodily gestures, he leaves him no liberty of an unlawful and idolatrous gesture, such as kneeling in the instant of receiving a sacrament, when not only we have the outward sign purposely before us, and our minds and senses fastened upon it, for discerning the signification thereof and the analogy betwixt it and the thing signified, but also look upon it as an image of Christ or as a vicarious sign standing there in Christ’s stead. The indifferency of such a gesture in such a mediate worship should have been proved before such a rule (as this here given us for a reason) had been applied to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 72-73</span></figcaption>

</figure><figure class="quote" id="q-00ebb07e1e" data-kw="">
<blockquote><p>How happy will that state be, when neither divine nor human learning shall be confined and imprisoned within only two or three nations of Europe, but shall be diffused all over the world, and this lower world shall be all over covered with light, the various parts of it mutually enlightening each other; when the most barbarous nations shall become as bright and polite as England; when ignorant heathen lands shall be stocked with most profound divines and most learned philosophers; when we shall from time to time have the most excellent books and wonderful performances brought from one end of the earth and another to surprise us—sometimes new and wondrous discoveries from Terra Australis Incognita, admirable books of devotion, the most divine and angelic strains from among the Hottentots, and the press shall groan in wild Tartary—when we shall have the great advantage of the sentiments of men of the most distant nations, different circumstances, customs and tempers; [when] learning shall not be restrained [by] the particular humour of a nation or their singular way of treating of things; when the distant extremes of the world shall shake hands together and all nations shall be acquainted and they shall all join the forces of their minds in exploring the glories of the Creator, their hearts in loving and adoring him, their hands in serving him, and their voices in making the world to ring with his praise.

What infinite advantages will they have for discovering the truth of every kind, to what they have now! There will continually be something new and surprising discovered in one part of the world and another [because of] the vast number of explorers, their different circumstances, their different paths to come at the truth. How many instructive and enlightening remains of antiquity will be discovered, here and there now buried amongst ignorant nations!</p></blockquote>

— Jonathan Edwards, Jonathan Edwards, 26. Millennium in The “Miscellanies”: (Entry Nos. a-z, aa-zz, 1-500)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHow+happy+will+that+state+be%2C+when+neither+divine+nor+human+learning+shall+be+confined+and+imprisoned+within+only+two+or+three+nations+of+Europe%2C+but+shall+be+diffused+all+over+the+world%2C+and+this+lower+world+shall+be+all+over+covered+with+light%2C+the+various+parts+of+it+mutually+enlightening+each+other%3B+when+the+most+barbarous+nations+shall+become+as+bright+and+polite+as+England%3B+when+ignorant+heathen+lands+shall+be+stocked+with+most+profound+divines+and+most+learned+philosophers%3B+when+we+shall+from+time+to+time+have+the+most+excellent+books+and+wonderful+performances+brought+from+one+end+of+the+earth+and+another+to+surprise+us%E2%80%94sometimes+new+and+wondrous+discoveries+from+Terra+Australis+Incognita%2C+admirable+books+of+devotion%2C+the+most+divine+and+angelic+strains+from+among+the+Hottentots%2C+and+the+press+shall+groan+in+wild+Tartary%E2%80%94when+we+shall+have+the+great+advantage+of+the+sentiments+of+men+of+the+most+distant+nations%2C+different+circumstances%2C+customs+and+tempers%3B+%5Bwhen%5D+learning+shall+not+be+restrained+%5Bby%5D+the+particular+humour+of+a+nation+or+their+singular+way+of+treating+of+things%3B+when+the+distant+extremes+of+the+world+shall+shake+hands+together+and+all+nations+shall+be+acquainted+and+they+shall+all+join+the+forces+of+their+minds+in+exploring+the+glories+of+the+Creator%2C+their+hearts+in+loving+and+adoring+him%2C+their+hands+in+serving+him%2C+and+their+voices+in+making+the+world+to+ring+with+his+praise.%0A%0AWhat+infinite+advantages+will+they+have+for+discovering+the+truth+of+every+kind%2C+to+what+they+have+now%21+There+will+continually+be+something+new+and+surprising+discovered+in+one+part+of+the+world+and+another+%5Bbecause+of%5D+the+vast+number+of+explorers%2C+their+different+circumstances%2C+their+different+paths+to+come+at+ <blockquote><p>[Natural worship] is to know God, to acknowledge Him to be God, and glorify Him as God. Now man, as a dependent creature, stands in need of help in this concern; much more fallen man, who has no natural light left in him, to direct him how to worship God acceptably. And therefore God has pleased to show him a way, wherein he may do it; and to this way belong all the institutions appointed to man since the fall.</p></blockquote>

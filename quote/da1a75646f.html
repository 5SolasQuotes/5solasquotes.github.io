<blockquote><p>denied that the blood of Christ was a sufficient price and ransom for all and every one, not because it was not sufficient, but because it was not a ransom.</p></blockquote>

</figure><figure class="quote" id="q-6a933ee5c6" data-kw="">
<blockquote><p>1. That Jesus Christ did effectually die for all the elect, and every one of them, whether Jews or Gentiles; and all the benefits of his death do reach unto every one of them, when they come to believe on Him.

2. That there was such a sufficiency of price and redemption by Christ, that if any sinner whatsoever comes by faith unto Christ, he shall receive all the benefits and fruits of redemption by the death of Christ.

3. That the death of Christ was never actually effectual for the redemption, reconciliation, expiation and salvation of all the sons of Adam and for every particular sinner in the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, sect. 8, Whether Jesus Christ as Mediator died for all and every man? in The Bowels of Tender Mercy Sealed in the Everlasting Covenant, ... (d. 1658; London: Motershed, 1661), pt. 1, ch. 7, The Covenant of Grace considered in Relation to Christ the Mediator, pp. 280-312 | Sedgwick was a Westminster divine. He lays out four positions on the topic (pp. 280-81), lists five ways in which Christ may be said to die for all (pp. 281-82) and then gives upfront his three conclusions:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

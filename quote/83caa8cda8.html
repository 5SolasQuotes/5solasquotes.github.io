<main class="wrap"><figure class="quote" id="q-83caa8cda8" data-kw="">
<blockquote><p>He is a holy God, and can love nothing that is altogether unlike Himself. There must always be some similitude and conformity of nature to ground kindness and friendship upon, and to maintain it. … What gross self-flattery is it, to think that God’s loving kindness can be towards you, while you are in love with sin, which he so perfectly hates!

How can the profane swearer, or voluptuous person, or the oppressor and covetous, or the close hypocrite, (worse than any of them,) rest upon the loving kindness of the Lord in the day of troubles? No, surely. But the tenor of His wrath shall be added to all their other calamities; and they shall find it heavier than all the rest. God will not pour this precious oil of gladness, this persuasion of His love, into filthy vessels.

Labour, then, you who as yet never tasted of this love, to know what it means. Forsake and hate that which hitherto has made you strangers to it; for if you obtain this, it shall comfort you when those things cannot, but would rather prove your greatest torment. And you who have received any testimonies of it, entertain it carefully, for it is your best comfort both in your best days and in your worst days too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons</cite>, in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 100.</span></figcaption>

</figure><figure class="quote" id="q-54b84f2d43" data-kw="">
<blockquote><p>It would spirit our faith, when we shall see his blood confirming an everlasting covenant, wherein God promises to be gracious. All the promises centred in the cross, received their life from his death, and are from thence reflected on us. Where can faith find a vigour but in the royalties of mercy, displayed in the satisfaction of justice? Where can it find a life, but in the views of its proper object?

When we behold a Christ crucified, how can we distrust God, that hath in that, as a plain tablet, writ this language, that he will spare nothing for us, since he hath not spared the best he had. What greater assurance can he give? Where is there anything in heaven or earth that can be a greater pledge of his affection?</p></blockquote>

</figure><figure class="quote" id="q-6ec4f2af8a" data-kw="">
<blockquote><p>True believers may have the assurance of their salvation divers ways shaken, diminished, and intermitted; as, by negligence in preserving of it, by falling into some special sin which woundeth the conscience and grieveth the Spirit; by some sudden or vehement temptation, by God’s withdrawing the light of his countenance, and suffering even such as fear him to walk in darkness and to have no light: yet are they never utterly destitute of that seed of God, and life of faith, that love of Christ and the brethren, that sincerity of heart, and conscience of duty, out of which, by the operation of the Spirit, this assurance may, in due time, be revived; and by the which, in the meantime, they are supported from utter despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.4</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d9c2f60bea" data-kw="">
<blockquote><p>A threefold act of faith is to be considered and distinguished in justification: One is dispositional, by which I believe that Christ by His merit is the forgiveness of sins, according to the teaching of the Gospel, and thus my sins will also be forgiven me if I repent and truly rest in Christ’s merit. And when this act of faith is accompanied by our misery recognized from God’s law, and that hunger and thirst for righteousness, about which Matthew 5:6 speaks, the accused is thus put in a state, as the Pragmatists say, to receive and hear his absolving sentence. Therefore, as faith regarding this act precedes actual forgiveness of sins in the forum of heaven and conscience, so it is also required in the Word to obtain it. The second is formally justifying, by which, when the justifying and absolving sentence is pronounced and made known to me by the spirit of adoption, I believe in the present for me, sorrowing over sin and henceforth promising serious amendment, that God through Christ has forgiven all my sins, both those I have committed so far and those into which I may fall due to weakness in the future; and that God will never impute them to me for condemnation but, attributed with my Saviour’s righteousness, will regard me as innocent and certainly grant eternal life. And this act is simultaneous with the actual justification and forgiveness of sins. The third is consolatory, by which in the past I believe all my sins have already been forgiven me, and I am no longer under any condemnation, as Paul says in Rom. 8:1, and I trust that the absolution previously made known to me will be extended and applied by God’s mercy to daily sins of intrusion, for which I also daily seek forgiveness in that sense in the Lord’s Prayer. And this act of faith follows justification and forgiveness of sins. Hence it is clear in what sense and to what extent faith is a condition sought for it; for in the first sense, faith relates to justification antecedently, in the second simultaneously, in the third consequentially.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07466e7fed" data-kw="">
<blockquote><p>Faith in Christ crucified is not commanded in the Law. For the apostle in Rom. 4:4–5 and 10:5–6, 11 sets faith in opposition to the Law; and in Gal. 3:12 he says that ‘The Law is not of faith,’ because the Law promises life to those who do the things contained in it. Therefore, faith is not comprehended under the Law. Nor indeed can there be any commerce between the Law and Christ as Mediator: “You are severed from Christ, you who are justified by the Law; you have fallen from grace” (Gal. 5:4). Faith in Christ crucified is a certain kind of righteousness: for it is obedience, and as it were a conformity to the command of God, as in 1 Jn. 3:23, “This is his commandment, that we should believe on the name of his Son,” and Jn. 3:36, “He who believes in the Son has eternal life; but he who does not obey the Son shall not see life, but the wrath of God abides on him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-wotton.html">Anthony Wotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Reconciliation of a Sinner… in which the Doctrine of the Anglican Church on the Justification of the Ungodly is explicated and defended (Basil, 1624), bk. 1, ch. 6</cite>, p. 138</span></figcaption>

" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As for regeneration or conversion in the second moment, it can be analogically conceived thus: I. The one generating is the Holy Spirit through second grace as through a plastic power. II. The matter of generation and seed is the new creature implanted in the first moment of regeneration, from which those acts are elicited. III. The form is the second act of faith, which as it were actuates and πληροῖ [plēroi, fills/fulfills] that seed of regeneration. IV. Preparatory dispositions are certain acts of repentance preceding faith. V. Mixture is the actual union of faith with the promises of the Gospel, Heb. 4:2. VI. Animation of the fetus, or introduction of the form, is when by actual faith Christ is applied for justification. VII. The first thing emanating from the form now introduced, or the elicited act, is the reflexive act of faith. VIII. To which follows the impetrated act: namely, the ἐνέργεια [energeia, energy/activity] of charity. IX. The process and succession of acts which dispose to the production of the first actual faith nearly holds itself as that of the human fetus, which, although the rational soul infused is specific, by which the vegetative and sensitive are contained (in the same way as the binary is in the ternary and the triangle in the quadrangle), yet man first lives the life of a plant, then of an animal, then of a man. So faith, although it is the first act of the new creature, indeed as it were the radical principle of the whole new creature, yet its second act, at least the complete and formed or sensible one, is exercised nearly among the last.</p></blockquote>

</figure><figure class="quote" id="q-2f9aeee0f2" data-kw="">
<blockquote><p>A.H. Strong uses the analogy of the coupling. The coupling joins a train of cars to a locomotive. The coupling has no power in itself. It cannot move a single car an inch. All the power is in the locomotive. But the coupling is the link by which the power of the locomotive is transmitted to the cars. Faith has no power in itself; it is not a ground of salvation; it is not a good work. It is merely that by which all the goodness and grace and glory of Christ comes to the sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

<blockquote><p>10. Protestants, however, almost universally teach that we are justified by faith alone, and that not after the manner of a disposition (as the Romanists say) but after the manner of an instrument; that is, that justification is received, or as they themselves say, apprehended by no other thing than faith.</p></blockquote>

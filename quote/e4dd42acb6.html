<main class="wrap"><figure class="quote" id="q-e4dd42acb6" data-kw="">
<blockquote><p>Therefore, when the instructor speaks here of man’s only comfort, it is abundantly clear that he has in mind only true believers, who, by the grace of the Holy Spirit, have received true self-knowledge as to the depth of their inability and misery. Such have become deeply troubled and sorrowful about this, and no longer are able to be at peace with themselves.

Instead, being truly lost, wretched, and poor in spirit, they have looked outside of themselves and taken refuge only to the free grace of God in Christ Jesus for their comfort and deliverance. So the instructor has in mind true believers who truly know themselves to be poor and wretched, and it is concerning them that he inquires into what their comfort consists in regard to such misery.

The instructor proceeds to describe this comfort in greater detail and formulates it as the only comfort in life and death. The essential characteristic of man’s true comfort consists in the fact that it is singular in nature. It is unique; that is, there is but one object in which this true comfort can be sought and found: the all-sufficient God and His blessed communion. This is the only and highest good, and apart from this good there is none other in which a wretched sinner could find this true and essential comfort for his poor soul. The soul has miseries, needs, and desires that are infinite in dimension, and everything apart from God is finite and deficient.

Nothing but God alone can provide the soul with true and essential satisfaction, comfort, and encouragement. There is but one comfort for a poor and believing sinner. Only one Object can yield true and essential comfort. All comfort that is sought for and found outside of this Object is extremely harmful and vain. With Asaph, the soul of a believing sinner must here say to her God, “Whom have I in heaven but thee? and there is none upon earth that I desire beside thee” (Ps. 73:25).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodorus-vandergroe.html">Theodorus VanderGroe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Only Comfort in Life and Death: An Exposition of the Heidelberg Catechism</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1838-44; 2 vols, Grand Rapids MI: Reformation Heritage Books, 2016), 1: 5.</span></figcaption>

</figure><figure class="quote" id="q-46d54d6e63" data-kw="">
<blockquote><p>Doctrine 3. ‘Counsel of his will’. That is which his will propounded to it, [it] did freely accept. Observe hence that what God wills once, that He effectually works, see Ps. 115, ‘Our God is in heaven and does whatsoever He wills: Who has refused his will?’ so Isa. 46:10. We see in beasts that they have an appetite to that [which] they move after; in men that which they will, that they put out their power to effect; so it is in God: if He will anything, He does work it effectually. That is a frivolous distinction of an effectual and an ineffectual will in God, which stands neither with truth of Scripture, as in this place, nor with the blessedness of God, nor with the nature of things: all that showed Him, which his will accepts, He does effectually work it. [It is] Against [the] blessedness of God: for might God will a thing and not have it, He were not fully blessed, when to have every good will is more blessed than to want [lack] it. Against [the] nature of things, for everything which will and ability works, if God almighty have will to anything, the thing must needs follow. Where there is full power to work anything, applied to the working of it, the thing wrought must needs follow. Here some distinguish and say that in things which God will do, his power does work them effectually, but the things which God would have on condition from us, those his power does not work: an old Pelagian conceit. Would not God have us walk in his commandments, and has He not said that He will put his Spirit in us and make us walk in them? St. Augustine learned that God did promise to work mightily those things He requires from us. If to have the conditional will be more happy than to want it, then God who has power to work the condition in us will not want it: Not to say that this conditional will is absurdly imagined in God: He must will the having a thing on condition which He will not work, and then it is impossible, unless the creature can do something good which He will not do in him; or on condition which He will work, and then He works all He wills; or on such a condition which He sees the creature cannot perform, nor Himself will not make Him perform; and this were idle and frivolous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the First Chapter of the Epistle of Saint Paul, written to the Ephesians</cite>, … some Principal Controversies about Predestination are handled, and diverse arguments of Arminius are examined (London, 1618), on Eph. 1:11, pp. 254-55 Note Baynes’s context against Arminius.</span></figcaption>

l+put+his+Spirit+in+us+and+make+us+walk+in+them%3F+St.+Augustine+learned+that+God+did+promise+to+work+mightily+those+things+He+requires+from+us.+If+to+have+the+conditional+will+be+more+happy+than+to+want+it%2C+then+God+who+has+power+to+work+the+condition+in+us+will+not+want+it%3A+Not+to+say+that+this+conditional+will+is+absurdly+imagined+in+God%3A+He+must+will+the+having+a+thing+on+condition+which+He+will+not+work%2C+and+then+it+is+impossible%2C+unless+the+creature+can+do+something+good+which+He+will+not+do+in+him%3B+or+on+condition+which+He+will+work%2C+and+then+He+works+all+He+wills%3B+or+on+such+a+condition+which+He+sees+the+creature+cannot+perform%2C+nor+Himself+will+not+make+Him+perform%3B+and+this+were+idle+and+frivolous.%E2%80%9D%0A%0A%E2%80%94+Paul+Baynes%2C+A+Commentary+upon+the+First+Chapter+of+the+Epistle+of+Saint+Paul%2C+written+to+the+Ephesians%2C+%E2%80%A6+some+Principal+Controversies+about+Predestination+are+handled%2C+and+diverse+arguments+of+Arminius+are+examined+%28London%2C+1618%29%2C+on+Eph.+1%3A11%2C+pp.+254-55+Note+Baynes%E2%80%99s+context+against+Arminius.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F46d54d6e63.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/46d54d6e63.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ineffectual-willings-of-god/#:~:text=Doctrine%203.%20%E2%80%98Counsel%20of%20his%20will,and%20this%20were%20idle%20and%20frivolous&amp;text=Doctrine%203.%20%E2%80%98Counsel%20of%20his%20will%E2%80%99.%20That%20is&amp;text=Him%20perform%3B%20and%20this%20were%20idle%20and%20frivolous" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

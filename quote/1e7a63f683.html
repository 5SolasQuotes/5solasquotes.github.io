<main class="wrap"><figure class="quote" id="q-1e7a63f683" data-kw="">
<blockquote><p>Seeing that by one man, sin entered into the world, and death by sin, and all men, without exception, are born guilty of the curse; it is certain, that no man can be freed from the curse, but by the mere grace and favour of God: This grace he hath revealed to us in Christ, without whom there is no salvation:

For he put on our nature, that by this means of his coming between, and as it were by this knot, man might be joined with God; and he suffered death that he might satisfy for our sins, and so reconciliation being made, we might be restored to the title and degree of the sons of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 12.1, p. 70.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

For he put on our nature, that by this means of his coming between, and as it were by this knot, man might be joined with God; and he suffered death that he might satisfy for our sins, and so reconciliation being made, we might be restored to the title and degree of the sons of God.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f819638ef1" data-kw="">
<blockquote><p>I. God as the supreme Lord has true right over the actions of all men, both internal and external, that they may serve his glory and obedience be rendered to him in all things (Luke 17:10), which obedience moreover he as ruler has commanded and sanctioned under the gravest threats (Gen 2:17, Deut 27:26). When man violates this right and denies this obedience to God, he commits two things: 1) he does not acknowledge the lordship of his master over himself, 2) he despises him, even by disdaining his laws before his sight, who pays heed to all the ways of men. Hence this wickedness is so great that none greater can be given; by it man turns away from the infinite good, and consequently merits for himself the privation of the highest good; whence he has been handed over by his Lord, whose obedience he refused, into servitude to the Devil and his servants, that he may be tormented by them in [God’s] name and experience the gravity of the lordship he despised (Jude 5-6). … III. Hence if any are vindicated from this servitude (as it is certain that all the elect have been and will be vindicated), it is necessary that this acknowledgment, that is, the restitution of honor, be exhibited to the supreme Lord and Ruler injured and offended by our disobedience, and that his laws and exactions be satisfied…. … VI. But Christ, offering himself to God (our Lord whose captives we were, by Thesis 1) as a sacrifice and victim (of the same character as the Old Testament victims) as a fragrant aroma (Eph 5:2, Heb 8:3, 9:14; cf. Gen 8:21, Lev 1), separated us from servitude to the Devil, etc. Therefore [he redeemed us]. Socinus (Praelections, ch. 9) and Volkelius (ibid.) declaim here in a rather diluted rhetorical way, hence the price had to be paid to the Devil – as if the λύτρον [ransom] were owed to the punishment or its executioner, and not to the one in whose name it is commanded and inflicted! When someone is freed from the gallows by the intervention of a payment, is it brought to the gallows or the executioner? or rather to the one who holds the right of majesty? We see here that it is not impossible to demonstrate to whom this price was paid, as Volkelius thinks (lib. 3, cap. 18). For the passages alleged teach that Christ offered himself to God as a victim for us. Christ, therefore, is such a redeemer who freed us by the intervention of a price (Acts 20:28, 1 Pet 1:18-19), which price indeed agrees in the formality of price with what is used in exchanges, like gold, silver, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, tr. Onku with AI (Utrecht, 1650) Latin</span></figcaption>

</figure><figure class="quote" id="q-8cbc7c1674" data-kw="">
<blockquote><p>We now come to the closing scene of our redemption. For the lively assurance of our reconciliation with God arises from Christ having come from hell as the conqueror of death, in order to show that he had the power of a new life at his disposal. Justly, therefore, does Paul say that there will be no gospel, and that the hope of salvation will be vain and fruitless, unless we believe that Christ is risen from the dead, (1 Cor. 15:14.) For then did Christ obtain righteousness for us, and open up our entrance into heaven; and, in short, then was our adoption ratified, when Christ, by rising from the dead, exerted the power of his Spirit, and proved himself to be the Son of God. Now, though he manifested his resurrection in a different manner from what the sense of our flesh would have desired, still the method of which he approved ought to be regarded by us also as the best. He went out of the grave without a witness, that the emptiness of the place might be the earliest indication; next, he chose to have it announced to the women by the angels that he was alive; and shortly afterwards he appeared to the women, and, finally, to the apostles, and on various occasions. Thus he gradually brought his followers, according to their capacity, to a larger measure of knowledge. He began with the women, and not only presented himself to be seen by them, but even gave them a commission to announce the gospel to the apostles, so as to become their instructors. This was intended, first, to chastise the indifference of the apostles, who were like persons half-dead with fear, while the women ran with alacrity to the sepulchre, and likewise obtained no ordinary reward. For though their design to anoint Christ, as if he were still dead, was not free from blame, still he forgave their weakness, and bestowed on them distinguished honour, by taking away from men the apostolic office, and committing it to them for a short time. In this manner also he exhibited an instance of what Paul tells us, that he chooses those things which are foolish and weak in the world to abase the loftiness of the flesh. And never shall we be duly prepared to learn this article of our faith in any other manner than by laying aside all pride, and submitting to receive the testimony of the women. Not that our faith ought to be confined within such narrow limits, but because the Lord, in order to make trial of our faith, determines that we shall become fools, before he admits us to a more ample knowledge of his mysteries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, trans., William Pringle, 3.338–39.</span></figcaption>

</figure><figure class="quote" id="q-d22831f21d" data-kw="resurrection victory">
<blockquote><p>The miracles which followed the resurrection of Christ prove that he lives and reigns gloriously in heaven (to say nothing now of the justice of God, the glory of Christ and our salvation, which necessarily demanded it, according to the prophecies uttered concerning it). Did he rise again by his own or by another’s power? The orthodox ascribe the cause of the resurrection to Christ himself no less than to the Father.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The miracles which followed the resurrection of Christ prove that he lives and reigns gloriously in heaven (to say nothing now of the justice of God, the glory of Christ and our salvation, which necessarily demanded it, according to the prophecies uttered concerning it). Did he rise again by his own or by another’s power? The orthodox ascribe the cause of the resurrection to Christ himself no less than to the Father.”

</figure><figure class="quote" id="q-86ce0050dd" data-kw="">
<blockquote><p>Christ, by his obedience and death, did fully discharge the debt of all those who are justified; and did, by the sacrifice of himself in the blood of his cross, undergoing in their stead the penalty due to them, make a proper, real, and full satisfaction to God’s justice in their behalf; yet, in as much as he was given by the Father for them, and his obedience and satisfaction accepted in their stead, and both freely, not for anything in them, their justification is only of free grace, that both the exact justice and rich grace of God might be glorified in the justification of sinners (Heb. 10:14; 1 Pet. 1:18–19; Isa. 53:5–6; Rom. 8:32; 2 Cor. 5:21; Rom. 3:26; Eph. 1:6–7; 2:7).</p></blockquote>

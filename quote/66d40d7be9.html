<main class="wrap"><figure class="quote" id="q-66d40d7be9" data-kw="">
<blockquote><p>The Council of Trent having stamped the Vulgate as ‘authentic,’ ordered that a correct edition of this authorized Vulgate should be published. But little was done in fulfilment of this decree for nearly forty years, when the task was undertaken by Pope Sixtus V., a Pontiff who seems really to have believed in his own infallibility. He employed a Board of learned men to act as revisers, but in complete subordination to himself. In his preface he claims the superiority to them which he exercised, as resulting from the singular privilege which he enjoyed as successor to Peter, the Prince of the Apostles, for whom Christ prayed that his faith should not fail, and who was charged to confirm the other Apostles in the faith. … But a glance at the volume was sufficient to convince any moderately learned man of the folly, not to say impiety, of such boastful presumption. Many passages were found covered with slips of paper on which new corrections had been printed; others were scratched out and merely corrected with a pen; and different copies were corrected in different ways. A closer examination showed those competent to judge that the edition had graver faults than could be accounted for by printers’ carelessness. Sixtus had changed the readings of those whom he had employed to report upon the text with the most arbitrary and unskilful hand; and it was scarcely an exaggeration to say with Bellarmine that his precipitate self-reliance had brought the Church into the most serious peril.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture XIV</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8c754bfe5" data-kw="">
<blockquote><p>We receive and embrace all the canonical Scriptures, both of the Old and New Testament, giving thanks to our God, who hath raised up unto us that light which we might ever have before our eyes, lest either by the subtlety of man, or by the snares of the devil, we should be carried away to errors and lies. Also that these be the heavenly voices, whereby God hath opened unto us His will: and that only in them man&#x27;s heart can have settled rest; that in them be abundantly and fully comprehended all things, whatsoever be needful for our salvation, as Origen, Augustine, Chrysostom, and Cyrillus have taught: that they be the very might and strength of God to attain to salvation: that they be the foundations of the Prophets and Apostles, whereupon is built the Church of God: that they be the very sure and infallible rule, whereby may be tried, whether the Church do stagger, or err, and whereunto all ecclesiastical doctrine ought to be called to account: and that against these Scriptures neither law, nor ordinance, nor any custom ought to be heard: no, though Paul his own self, or an angel from heaven, should come and teach the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

</figure><figure class="quote" id="q-d6a29f4971" data-kw="">
<blockquote><p>This whole matter depends on sure, firm, and harmonious testimonies of the first and ancient church, and where these are lacking, the later church, as it cannot make genuine books out of spurious ones, so also it cannot make certain writings out of doubtful ones without clear and firm proofs.</p></blockquote>

</figure><figure class="quote" id="q-51d6b04ae1" data-kw="">
<blockquote><p>The fact is, that the doctrine of Development has to encounter a great historical difficulty, which it can only remove by an enormous assumption. The doctrine is, that Christ&#x27;s original revelation contained seeds and germs of truths destined, under the Divine guidance, to expand to a certain definite form. If this be true, that expansion would take place wherever these germs were planted. It does not depend on where a tree is planted, whether it springs up a cedar or a bramble-bush, or whether it brings forth figs or grapes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture II</span></figcaption>

</figure><figure class="quote" id="q-3f153cbdb3" data-kw="">
<blockquote><p>Sola Scriptura (&quot;by Scripture alone&quot;). The Holy Scriptures are our supreme and only rule of faith and life; they, not human tradition and reasoning, determine our faith and command our obedience. … Our minds are servants to receive the Word, not to judge it.</p></blockquote>

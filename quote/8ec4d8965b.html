<blockquote><p>Since both heretics and schismatics are harmful to the welfare of the church, many of the earlier Reformed divines believed that both should be restrained by the civil ruler if he was to fulfil his role as a nursing father to the church. The Westminster divine, Daniel Featley, explains the rationale behind such thinking:

[T]here will be use of an arming sword, not of War, but of Justice, to cut off Superstition and Idolatry on the one side, and Profaneness and Sacrilege on the other: Heretics with one edge, and Schismatics with the other. For as in the beginning of the Reformation, so now in the endeavoured perfection thereof, the moral enemy of our immortal souls sets on work all sorts of Heretics and Schismatics to hinder, disturb, and (if it were possible) destroy this excellent work. The Heretics he employeth to pervert the Catholic doctrine, the Schismatics to subvert the Apostolic discipline of the Church: the Heretics endeavour to shake the foundations, the Schismatics to make breaches in the walls: the Heretics to rot the main timber, the Schismatics to pull in sunder the rafters of this sacred structure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The dippers dipt. Or, the Anabaptists duck’d and plung’d over head and ears, at a disputation in Southwark</cite>, (5th edn, London, 1647), i-ii.</span></figcaption>

<blockquote><p>7. The Fugitive Slave Law. — The following preamble and resolutions were adopted:

Whereas, It is our duty as witnesses for Christ to bear testimony against the evils that prevail — and

Whereas, We should “Open our mouth for the dumb in the cause of all such as are appointed to destruction” — and to “Open our mouth, judge righteously, and plead the cause of the poor and needy, to remember those that are in bonds as bound with them.” Therefore—

1. Resolved, That we regard slavery with abhorrence, as a most heinous sin and an unmitigated political and social evil. We are convinced that depriving men of their right to themselves — the power of abrogating the marriage relation — of separating parents and their youthful offspring — and possessing an absolute power over the bodies and souls of men, can never exist without heinous criminality, and no conceivable circumstances can excuse any in the practice of this God defying sin. — Hence we regard immediate emancipation upon the soil as the only mode of bringing slavery to a peaceful end and of complying with the requisitions of God’s law.

2. Resolved, That the fugitive slave law is utterly repugnant lo every principle of justice and in direct opposition to God’s express law.—Its accordance in its main elements with the Constitution of the United States renders it the more worthy of our detestation, and more clearly shows that its passage and enforcement will bring desolating judgments upon our land. Those officers who are commissioned to carry out its provisions are not employed in promoting the legitimate ends of civil government, the glory of God nor the good of men, but are acting in disobedience to God, and are entitled to no respect or obedience, but ought to be resisted by all means that accord with the law of God.

3. Resolved, That to inculcate obedience or conscientious submission to this law or respect for the officers of law in enforcing it, encourages men in their callous heartlessness respecting fugitives from bondage — countenances oppression — brings disgrace upon the church and gospel of Christ, and leads men to disregard the plainest provisions of God’s law, which commands all to “relieve the oppressed,” and forbids to bewray him that wandereth; and we warn all under our charge to beware of complying with the provisions of this law, or of giving assistance to those who would return to cruel bondage those who have escaped from their oppressors.

4. Resolved, That every minister who would not be false to his vows, false to the poor and needy, and false to the claims of the King of nations, should, especially in these times of opposition to the rights of God and of man, be careful to pray in public for the enslaved, preach against slavery, and warn against the sins of exercising the elective franchise and holding office under a slaveholding constitution and Government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Nov. 1851, pp 118-19</span></figcaption>

</figure><figure class="quote" id="q-2ae067612c" data-kw="">
<blockquote><p>And now that so much as I have said is required, active Obedience to legal, civil Authority to all Magistrates in their legal commands in civil matters; or at least passive yielding to the penalty of the Laws, in case of not obeying actively; and neither further then to legal commands of legal Authority, appears by the Apostle’s reason in this 1. verse. For there is no power but of God; which he redoubles in a second phrase, The powers that be are ordained of God, or under God … Every soul must be under their order … because they all are ordered by God under him, his deputies and vicegerents in their order and degree, higher and highest.

This is true of all powers, and therefore to all must subjection be performed. And to none hath God ordered or ordained any Authority but legal. Which as none will deny (no not the Doctor himself) of other Governors besides the supreme: So can none with reason affirm, that any hath more authority then the Laws, whether special or general, written or unwritten, have allotted them. Which Laws God ratifies (being not against his) and so the Authority according to them.

And this our Doctor also confesses (in sense) in more places then one of his Book, for active Obedience, that no more is due, but according to the Laws of God, and the established laws of the Land. Only he argues for passive obedience beyond this, every where. 1. Because he argues against resistance even of Tyranny. But in a word to refute this from the Apostle’s reason in the first verse.

If I be bound to be subject to tyranny, (or to suffer violence of a tyrant) by virtue of the commandment here. Then tyranny is the Ordinance of God, or Magistrates have power ordained of God to use tyrannous violence (for thus the Apostle argues for subjection from God’s ordaining the power) But this is false. Ergo, so is that, that I should be bound to suffer tyrannous violence. …

But I say again, that by all the foregoing context, and the reason from God’s Ordinance in the second verse: The prohibition of blaming of resistance, goes no further, then, of legal commands of legal authority. The Doctor will not (doth not) say that the most peremptory, or obstinate refusing to obey actively tyrannous and illegal commands is resistance. By what authority then of the Text or context will he stretch the prohibition to refusing to suffer tyrannous violence?

Or how does any resist unlawfully (though by Arms) when unlawful violence is offered him? which God no where gave authority to use to him, nor ever commanded him to yield unto? In a word, till God’s Ordinance can be proved allowing tyranny (which can never be) or undeniably ordaining a man to suffer it, which is no where in his word (I mean the extremity of tyranny depriving of life, or so) though often it is so in his providence, when he affords no means of resistance: This Text of the Apostle will no way condemn the resisting by Arms tyrannous and illegal outrageous violences. Besides all that, the context following refuses this sense of the Doctor, as I have already shewed. …

Then besides all that hath been said on the Text and context, I only add this: That then every meanest Officer (if wicked) may ruin the whole neighbourhood, because he may not be resisted by Arms, who yet will bring Arms to act his villanies. And so the blessed Ordinance of God in Magistracy shall turn to the greatest curse to Mankind (the best and most conscientious of them) that can be imagined, in regard of outward sufferings, and general confusion.

It remains therefore that as the Apostle in the following verses, banishes tyranny out of the context, describing every where a righteous Magistrate, and not a tyrant: So tyranny is to be banished out of the interpretation of this Text, which allows him that is a tyrant, no security, that he shall be endured, and not resisted even with Arms. Though it doth (and that most justly and necessarily) secure a just ruling Prince or Magistrate from all resistance, even when he punishes most severely according to Law and justice, upon the heaviest guilt of being found resisters against God (that resist such a rule) and the heaviest penalty of damnation.</p></blockquote>

— Herbert Palmer, Scripture and reason pleaded for defensive arms: or The whole controversy about subjects taking up arms Wherein besides other pamphlets, an answer is punctually directed to Dr. Ferne’s book, entitled, Resolving of conscience, &amp;c. The scriptures alleged are fully satisfied. The rational discourses ar, (London: John White, 1643), pp 4, 5, 6.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+now+that+so+much+as+I+have+said+is+required%2C+active+Obedience+to+legal%2C+civil+Authority+to+all+Magistrates+in+their+legal+commands+in+civil+matters%3B+or+at+least+passive+yielding+to+the+penalty+of+the+Laws%2C+in+case+of+not+obeying+actively%3B+and+neither+further+then+to+legal+commands+of+legal+Authority%2C+appears+by+the+Apostle%E2%80%99s+reason+in+this+1.+verse.+For+there+is+no+power+but+of+God%3B+which+he+redoubles+in+a+second+phrase%2C+The+powers+that+be+are+ordained+of+God%2C+or+under+God+%E2%80%A6+Every+soul+must+be+under+their+order+%E2%80%A6+because+they+all+are+ordered+by+God+under+him%2C+his+deputies+and+vicegerents+in+their+order+and+degree%2C+higher+and+highest.%0A%0AThis+is+true+of+all+powers%2C+and+therefore+to+all+must+subjection+be+performed.+And+to+none+hath+God+ordered+or+ordained+any+Authority+but+legal.+Which+as+none+will+deny+%28no+not+the+Doctor+himself%29+of+other+Governors+besides+the+supreme%3A+So+can+none+with+reason+affirm%2C+that+any+hath+more+authority+then+the+Laws%2C+whether+special+or+general%2C+written+or+unwritten%2C+have+allotted+them.+Which+Laws+God+ratifies+%28being+not+against+his%29+and+so+the+Authority+according+to+them.%0A%0AAnd+this+our+Doctor+also+confesses+%28in+sense%29+in+more+places+then+one+of+his+Book%2C+for+active+Obedience%2C+that+no+more+is+due%2C+but+according+to+the+Laws+of+God%2C+and+the+established+laws+of+the+Land.+Only+he+argues+for+passive+obedience+beyond+this%2C+every+where.+1.+Because+he+argues+against+resistance+even+of+Tyranny.+But+in+a+word+to+refute+this+from+the+Apostle%E2%80%99s+reason+in+the+first+verse.%0A%0AIf+I+be+bound+to+be+subject+to+tyranny%2C+%28or+to+suffer+violence+of+a+tyrant%29+by+virtue+of+the+commandment+here.+Then+tyranny+is+the+Ordinance+of+God%2C+or+Magistrates+have+power+ordained+of+God+to+use+tyrannous+violence+%28for+thus+the+Apostle+argues+for+subjection+from+God%E2%80%99s+ordaining+the+power%29+But+this+is+false.+Ergo%2C+so+is+that%2C+that+I+should+be+bound+to+suffer+tyrannous+violence.+%E2%80%A6%0A%0ABut+I+say+again%2C+that+by+all+the+foregoing+context%2C+and+the+reason+from+God%E2%80%99s+Ordinance+in+the+second+verse%3A+The+prohibition+of+blaming+of+resistance%2C+goes+no+further%2C+then%2C+of+legal+commands+of+legal+authority.+The+Doctor+will+not+%28doth+not%29+say+that+the+most+peremptory%2C+or+obstinate+refusing+to+obey+actively+tyrannous+and+illegal+commands+is+resistance.+By+what+authority+then+of+the+Text+or+context+will+he+stretch+the+prohibition+to+refusing+to+suffer+tyrannous+violence%3F%0A%0AOr+how+does+any+resist+unlawfully+%28though+by+Arms%29+when+unlawful+violence+is+offered+him%3F+which+God+no+where+gave+authority+to+use+to+him%2C+nor+ever+commanded+him+to+yield+unto%3F+In+a+word%2C+till+God%E2%80%99s+Ordinance+can+be+proved+allowing+tyranny+%28which+can+never+be%29+or+undeniably+ordaining+a+man+to+suffer+it%2C+which+is+no+where+in+his+word+%28I+mean+the+extremity+of+tyranny+depriving+of+life%2C+or+so%29+though+often+it+is+so+in+his+providence%2C+when+he+affords+no+means+of+resistance%3A+This+Text+of+the+Apostle+will+no+way+condemn+the+resisting+by+Arms+tyrannous+and+illegal+outrageous+violences.+Besides+all+that%2C+the+context+following+refuses+this+sense+of+the+Doctor%2C+as+I+have+already+shewed.+%E2%80%A6%0A%0AThen+besides+all+that+hath+been+said+on+the+Text+and+context%2C+I+only+add+this%3A+That+then+every+meanest+Officer+%28if+wicked%29+may+ruin+the+whole+neighbourhood%2C+because+he+may+not+be+resisted+by+Arms%2C+who+yet+will+bring+Arms+to+act+his+villanies.+And+so+the+blesse

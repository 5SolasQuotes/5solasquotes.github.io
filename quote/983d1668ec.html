<main class="wrap"><figure class="quote" id="q-983d1668ec" data-kw="">
<blockquote><p>Lastly, Turn from your evil ways to God, and the Rules of his Word. This I might apply to sundry particulars; but at present I shall speak only to one Abuse of this season of the Year, which is called CHRISTMAS: which is to be witnessed against …

If upon a Religious Account; None can sanctify Time to make a day holy to the Lord, but the sanctifying Spirit, in and by some Word of God in Scripture. The Feasts of Purim were Civil Festivals, called Good days of feasting, and sending gifts one to another, not Holy times, separated from common uses to holy.

Now we nowhere find warrant in Scripture for setting apart the day of Christ’s Nativity from common use, to religious holy use: Indeed the day of his Resurrection, the first day of the week, that is by Christ sanctified to be the Christians Christian Sabbath: for that was the beginning of Christ’s Exaltation, but the day of his Birth, was the beginning of his Humiliation and Abasement; so that there is not a parity of reason between them.</p></blockquote>

</figure><figure class="quote" id="q-8d6d420903" data-kw="">
<blockquote><p>In worship, their paintings, crossings, crucifixes, bowings, cringings, altars, tapers, wafers, organs, anthems, litany, rails, images, copes, vestments,—what were they but Roman varnish, an Italian dress for our devotion, to draw on conformity with that enemy of the Lord Jesus? In doctrine, the divinity of Episcopacy, auricular confession, free-will, predestination on faith, yea, works foreseen, “limbus patrum,” justification by works, falling from grace, authority of a church, which none knew what it was, canonical obedience, holiness of churches, and the like innumerable,—what were they but helps to Sancta Clara, to make all our articles of religion speak good Roman Catholic? How did their old father of Rome refresh his spirit, to see such chariots as those provided to bring England again unto him! This closing with Popery was the sting in the errors of those days, which cause pining, if not death, in the episcopal pot.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon I</cite>, (Carlisle: The Banner of Truth Trust, repr. 2009), 8:28.</span></figcaption>

</figure><figure class="quote" id="q-1cac9130be" data-kw="">
<blockquote><p>Now it appears, that it was the will of our Lord and Saviour Christ, that we should, since his resurrection, keep for our Sabbath that first day of the week; forasmuch as he arose on that day, John xx. 1-19, and appeared divers times on this our Lord’s day to his disciples before his ascension; and did on this day, being the day of Pentecost, Acts ii. 1-4, fill his disciples with the gifts of the Holy Ghost, they being assembled together; all which gives a pre-eminence to this day, and a probability to the point.</p></blockquote>

</figure><figure class="quote" id="q-d8dcde1da6" data-kw="">
<blockquote><p>When I consider the original institution of the Sabbath, of which we have so explicit an account at the close of the Mosaic narrative of the creation; when I find the observance of this day enjoined in one of the precepts of the moral law; when I find, throughout the Psalms and the Prophets, this solemn injunction implicitly repeated; when I hear our blessed Lord expressly speaking of the existence of this day after the abolition of the Jewish economy; when I hear the apostle John, long after our Lord’s resurrection and ascension into heaven, speaking with peculiar emphasis, of a particular day as the Lord’s Day; when I find the apostles by their example setting apart one day in seven for religious purposes; when I can trace the existence and observance of Sabbatical Institutions from the creation down to the present hour; and when to these considerations, I add the natural fitness and propriety of such a day, and consider how indispensable it is to the existence of religion among men: I am compelled to believe that the Sabbath is of Divine origin and perpetual obligation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gardiner-spring.html">Gardiner Spring</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath a Blessing to Mankind</cite>, in Tracts of the American Tract Society. General Series. Volume 1 (n.d.), no. 37, p. 1.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

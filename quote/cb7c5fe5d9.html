<main class="wrap"><figure class="quote" id="q-cb7c5fe5d9" data-kw="">
<blockquote><p>VII. Christ will be the judge in that very visible nature in which he was condemned for us. For although judiciary Power is common to the whole Trinity, still it will be specially exercised by the incarnate son. Judgment is said to have been given him by the father… as being the king of his church, the avenger of his elect, the most strict punisher of the wicked and rebellious, the Lord of all. The former belong to grace, the latter to power and both pertain the office of Mediator. This he will do especially both for the greater consolation of the pious (who will look upon him as their defender and Advocate instead of their judge) and for the greater terror and confusion of the wicked, while they will see him reigning gloriously whom they barbarously and cruelly persecuted. …XVII. Further, if it is asked here whether the sins of the pious equally as well as of the wicked will be revealed, we answer that the negative seems more probable to us. (1) On account of the judge, who, since he has been most fully satisfied for us and now intercedes for us in heaven, will then become as their Redeemer and Savior, not to reproach them for their sins, but to fulfill his promises in them and to manifest the wonders of his grace. (2) The process of the judgment is such that mention may indeed be made of good works, but not of their evil works…. The pious will not hear the publication of their sins, but the reward of their love and beneficence. (3) The gratuitous mercy of God does not wish our sins to be remembered anymore, but casts them behind its back. Now what God has once wished to be covered in this life, he will not reveal in the other. (4) If their sins were to be made known, it would lead to the disgrace and confusion of the pious from which they are to be free. For Christ will return for this and–that he may be glorious in his saints and be admired in believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George Musgrave Giger, 3 vol. (Phillipsburg: P&amp;R Publishing, 1992–97), 3.599, 602 (20th topic, Q. 6).</span></figcaption>

</figure><figure class="quote" id="q-84a6e98317" data-kw="">
<blockquote><p>Such works (that obtain a reward) are not only those of condign merit, but also: (1) the execution of a donation or almsgiving that is entirely gratuitous, which a poor man, humbly and faithfully waiting for it, does not render void by contempt or ingratitude; (2) the execution of a promise which is made not only under the condition of accepting and not despising the gift (a condition which no donation is so free as not to include), but also of a certain work besides—on which account it is in some sense meritorious, even though there may perhaps be no equality or commutation between this work and the promised reward; as, for example, if a father promises a jewel to his son who takes bitter medicine. Yet this is not a purely gratuitous donation, since the thing does not begin to be owed as soon as the promise is accepted, but when the condition has been fulfilled; nor is it properly merit of condignity, since the one acting benefits himself rather than gives something to another for which he ought to receive an equal price. But it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children to whom God has promised rewards, we admit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-crocius.html">Ludovicus Crocius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma</cite>, bk. 4, ch. 18, pp. 1130-31, as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 369-70, trans. ChatGPT-5 Crocius (1586 – 1653 or 1655) was a German reformed minister, a delegate at the Synod of Dort and a professor of theology and philosophy in Bremen.</span></figcaption>

<blockquote><p>1. There are continual operations of God in Christ in the souls of them that are glorified, and communications from Him unto them. For all creatures must eternally live, even in heaven, in dependence on Him who is the eternal fountain of being, life, goodness, and blessedness unto all. As we cannot subsist one moment in our beings, lives, souls, bodies, the inward or outward man, without the continual actings of divine power in us, and towards us; so in the glorified state our all shall depend eternally on divine power and goodness, communicating themselves unto us, for all the ends of our blessed subsistence in heaven. 2. What is the way and manner of these communications, we cannot comprehend. We cannot, indeed, fully understand the nature and way of his spiritual communications unto us in this life. We know these things by their signs, their outward means, and principally by the effects they produce in the real change of our natures; but in themselves we see but little of them. “The wind bloweth where it listeth, and we hear the sound thereof, but we know not whence it cometh, and whither it goeth; so is every one that is bom of the Spirit,” John 3:8. All God’s real operations in heaven and earth are incomprehensible, as being acts of infinite power; and we cannot search them out unto perfection. 3. All communications from the Divine Being and infinite fulness in heaven unto glorified saints, are in and through Christ Jesus, who shall forever be the medium of communication between God and the church, even in glory. All things being gathered into one head in him, even things in heaven, and things in earth— that head being in immediate dependence on God—this order shall never be dissolved, Eph. 1:10-11; 1 Cor. 3:[22-]23. And on these communications from God through Christ depends entirely our continuance in a state of blessedness and glory. We shall no more be self-subsistent in glory than we are in nature or grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations &amp; Discourses on the Glory of Christ</cite>, ch. 14, ‘Other Differences…’ in Works, vol. 1, pp. 413-4</span></figcaption>

<main class="wrap"><figure class="quote" id="q-cfc49c921c" data-kw="">
<blockquote><p>True it is, that if man had persisted in the state of his created integrity, he might, after an improper manner, be said to have merited the glory which he was after to enjoy, inasmuch as he was to obtain it in the virtue of those legal operations, unto which he was, by the abilities of his own nature, without the special influence of a supernatural infused grace, fitted and disposed; though even this was not from the dignity and value of our work, but from the indulgence of Almighty God, who would set no higher price on that glory, which he proposed unto man for the object of his desires, and reward of his works.

For if we go exactly unto the first rule of justice unqualified with clemency and bounty, it could not possibly be, that God should be bound to requite our labours with eternal bliss; there being so vast a disproportion between the fruition of God, an infinite good, and any the most excellent, yet still limited operation of the creature. For as water in its own nature riseth no farther than the spring whence it first issueth; so the endeavours of nature could never have raised man, without a mixture of God’s mercy, unto a higher degree of happiness, than should have been proportionable to the quality of his work.

But now having in Adam utterly disabled ourselves to pay that small price, at which God was pleased to rate our glory; all those who are restored thereunto again, must acknowledge both it, and Christ the purchaser of it, as a free gift of Almighty God, by them so far undeserved, as he was, before the promise, unknown and unexpected. …

Even Adam in innocency could not be without an assent and firm belief, that the faithful God would perform the promise of life, made and annexed unto the covenant of works. But this faith could not be the merit of life, but the fruit and effect of merit, or rather obedience anteceding; for his performance of the law (in the right whereof he had interest unto glory) preceding, there should immediately from thence have issued, by faith, a prepossession (as it were) and pre-apprehension of that glory, which, by virtue of that legal obedience, he should have had interest unto.</p></blockquote>

<blockquote><p>[T]he Promise made unto Adam, and all Mankind in him, The Man that doth those things shall live, which by the Rule of Contraries implies the threatening and the Curse against all Transgressors. If she shall live who fulfils the Law, then by the contrary proportion he shall die who transgresseth it.

And this threatening we find expressly annexed to one particular Command of the Covenant of Works, Gen. 2. 17. In the day thou eatest thereof, that is, of the Tree of the Knowledge of Good and Evil, thou shalt surely die. And to the general Tenor of the whole, Gal. 3. 10. Cursed is every one who continueth not in all things which are written in the Book of the Law to do them.</p></blockquote>

<blockquote><p>In the case of men and angels, God has been pleased to promise this transcendent benefit upon certain conditions; which conditional promise is called a covenant. There can be no doubt that this amazing gift of God’s personal love and life-giving society had been offered to angels, and at the beginning was offered to the first human pair, upon conditions. Some object that the conditional promise made to Adam in the garden is not explicitly called a covenant, and that it does not possess all the essential elements of a covenant, since it was a constitution sovereignly ordained by the Creator without consulting the will of the creature.

It is a sufficient answer to these objections, – (1) That although Adam’s will was not consulted, yet his will was unquestionably cordially consenting to this divine constitution and all the terms thereof, and hence the transaction did embrace all the elements of a covenant. (2) That instances of analogous transactions between God and men are expressly styled covenants in the Bible. If God’s transactions with Noah (Gen. 9:11,12) and with Abraham (Gen. 17:1-21) were covenants, then was his transaction with Adam in the garden a covenant.

The analysis of a covenant always gives the following elements: (a) Its parties. (b) Its promise. (c) Its conditions. (d) Its penalty. As to its parties, our Standards teach –

In the first covenant that concerned mankind God dealt with Adam as the representative of all his descendants. The parties, therefore, are God and Adam, the latter representing the human race. That Adam did so act as the representative of his descendants, in such a sense that they were equally interested with himself in all the merit or the demerit, the reward or the penalty, attaching to his action during the period of probation, has already been proved to be the doctrine both of our Standards and of Scripture. (Ch. 6., ss. 3, 4.) As to the further nature of this covenant, our Standards teach – The promise of it was life, the condition of it perfect obedience, and the penalty of it death. (L. Cat., q. 20; S. Cat., q. 12.)

This covenant is variously styled, from one or other of these several elements. Thus, it is called the “covenant of works,” because perfect obedience was its condition, and to distinguish it from the covenant of grace, which rests our salvation on a different basis altogether. It is also called the “covenant of life,” because life was promised on condition of the obedience. It is also called a “legal covenant,” because it demanded the literal fulfilment of the claims of the moral law as the condition of God’s favour. This covenant was also in its essence a covenant of grace, in that it graciously promised life in the society of God as the freely-granted reward of an obedience already unconditionally due. Nevertheless it was a covenant of works and of law with respect to its demands and conditions.

(1) That the promise of the covenant was life is proved – (a) From the nature of the penalty, which is recorded in terms. If disobedience was linked to death, obedience must have been linked to life. (b) It is taught expressly in many passages of Scripture. Paul says, Rom. 10:5, “Moses describes the righteousness which is of the law, That the man which does those things shall live by them.” (Matt. 19:16,17; Gal. 3:12; Lev. 18:5; Neh. 9:29.)

That the life promised was not mere continuance of existence is plain – (a) From the fact that the death threatened was not the mere extinction of existence. Adam experienced that death the very day he ate the forbidden fruit. The death threatened was exclusion from the communion of God. The life promised, therefore, must consist in the divine fellowship and the excellence and happiness thence resulting. (b) From the fact that mere existence was not in jeopardy. It is the character, not the fact, of continued existence which God suspended upon obedience. (c) Because the terms “life” and “death” are used in the Scriptures constantly to define two opposite spiritual conditions, which depend upon the relation of the soul to God. (John 5:24; 6:4; Rom. 6:23; 11:15; Eph. 2:1-3; 5:14; Rev. 3:1.)

(2) That the condition of the covenant was perfect obedience is plain from the fact – (a) That the divine law can demand no less. It is of the essence of all that is right that it is obligatory. James says, that “whosoever shall keep the whole law, and yet offend in one point, he is guilty of all.” James 2:10; Gal. 3:10; Deut. 27:26. (b) That the command not to eat of the fruit of the tree of the knowledge of good and evil, relating to a thing indifferent in itself, was plainly designed to be a naked test of obedience, absolute and without limit.

(3) That the penalty of this covenant was death is distinctly stated: “In the day thou eatest thereof, dying thou shalt die.” Gen. 3:17. This denoted a most lamentable state of existence, physical and moral, and not the cessation of existence or the dissolution of the union between soul and body, because-(a) It took effect in our first parents hundreds of years before the dissolution of that union. (b) Because the Scriptures constantly describe the moral and spiritual condition into which their descendants are born, and from which they are delivered by Christ, as a state of death. (Rev. 3:1; Eph. 2:1-5; 5:14; John 5:24.) This death is a condition of increasing sin and misery, resulting from excision from the only source of life. It involves the entire person, soul and body, and continues as long as the cause continues.</p></blockquote>

equally+interested+with+himself+in+all+the+merit+or+the+demerit%2C+the+reward+or+the+penalty%2C+attaching+to+his+action+during+the+period+of+probation%2C+has+already+been+proved+to+be+the+doctrine+both+of+our+Standards+and+of+Scripture.+%28Ch.+6.%2C+ss.+3%2C+4.%29+As+to+the+further+nature+of+this+covenant%2C+our+Standards+teach+%E2%80%93+The+promise+of+it+was+life%2C+the+condition+of+it+perfect+obedience%2C+and+the+penalty+of+it+death.+%28L.+Cat.%2C+q.+20%3B+S.+Cat.%2C+q.+12.%29%0A%0AThis+covenant+is+variously+styled%2C+from+one+or+other+of+these+several+elements.+Thus%2C+it+is+called+the+%E2%80%9Ccovenant+of+works%2C%E2%80%9D+because+perfect+obedience+was+its+condition%2C+and+to+distinguish+it+from+the+covenant+of+grace%2C+which+rests+our+salvation+on+a+different+basis+altogether.+It+is+also+called+the+%E2%80%9Ccovenant+of+life%2C%E2%80%9D+because+life+was+promised+on+condition+of+the+obedience.+It+is+also+called+a+%E2%80%9Clegal+covenant%2C%E2%80%9D+because+it+demanded+the+literal+fulfilment+of+the+claims+of+the+moral+law+as+the+condition+of+God%E2%80%99s+favour.+This+covenant+was+also+in+its+essence+a+covenant+of+grace%2C+in+that+it+graciously+promised+life+in+the+society+of+God+as+the+freely-granted+reward+of+an+obedience+already+unconditionally+due.+Nevertheless+it+was+a+covenant+of+works+and+of+law+with+respect+to+its+demands+and+conditions.%0A%0A%281%29+That+the+promise+of+the+covenant+was+life+is+proved+%E2%80%93+%28a%29+From+the+nature+of+the+penalty%2C+which+is+recorded+in+terms.+If+disobedience+was+linked+to+death%2C+obedience+must+have+been+linked+to+life.+%28b%29+It+is+taught+expressly+in+many+passages+of+Scripture.+Paul+says%2C+Rom.+10%3A5%2C+%E2%80%9CMoses+describes+the+righteousness+which+is+of+the+law%2C+That+the+man+which+does+those+things+shall+live+by+them.%E2%80%9D+%28Matt.+19%3A16%2C17%3B+Gal.+3%3A12%3B+Lev.+18%3A5%3B+Neh.+9%3A29.%29%0A%0AThat+the+life+promised+was+not+mere+continuance+of+existence+is+plain+%E2%80%93+%28a%29+From+the+fact+that+the+death+threatened+was+not+the+mere+extinction+of+existence.+Adam+experienced+that+death+the+very+day+he+ate+the+forbidden+fruit.+The+death+threatened+was+exclusion+from+the+communion+of+God.+The+life+promised%2C+therefore%2C+must+consist+in+the+divine+fellowship+and+the+excellence+and+happiness+thence+resulting.+%28b%29+From+the+fact+that+mere+existence+was+not+in+jeopardy.+It+is+the+character%2C+not+the+fact%2C+of+continued+existence+which+God+suspended+upon+obedience.+%28c%29+Because+the+terms+%E2%80%9Clife%E2%80%9D+and+%E2%80%9Cdeath%E2%80%9D+are+used+in+the+Scriptures+constantly+to+define+two+opposite+spiritual+conditions%2C+which+depend+upon+the+relation+of+the+soul+to+God.+%28John+5%3A24%3B+6%3A4%3B+Rom.+6%3A23%3B+11%3A15%3B+Eph.+2%3A1-3%3B+5%3A14%3B+Rev.+3%3A1.%29%0A%0A%282%29+That+the+condition+of+the+covenant+was+perfect+obedience+is+plain+from+the+fact+%E2%80%93+%28a%29+That+the+divine+law+can+demand+no+less.+It+is+of+the+essence+of+all+that+is+right+that+it+is+obligatory.+James+says%2C+that+%E2%80%9Cwhosoever+shall+keep+the+whole+law%2C+and+yet+offend+in+one+point%2C+he+is+guilty+of+all.%E2%80%9D+James+2%3A10%3B+Gal.+3%3A10%3B+Deut.+27%3A26.+%28b%29+That+the+command+not+to+eat+of+the+fruit+of+the+tree+of+the+knowledge+of+good+and+evil%2C+relating+to+a+thing+indifferent+in+itself%2C+was+plainly+designed+to+be+a+naked+test+of+obedience%2C+absolute+and+without+limit.%0A%0A%283%29+That+the+penalty+of+this+covenant+was+death+is+distinctly+stated%3A+%E2%80%9CIn+the+day+thou+eatest+thereof%2C+dying+thou+shalt+die.%E2%80%9D+Gen.+3%3A17.+This+denoted+a+most+lamentable+state+of+existence%2C+physical+and+moral%2C+and+not+the+cessation+of+existence+or+the+dissolution+of+the+union+between+soul+and+body%2C+because-%28a%29+It+took+effect+in+our+first+parents+hundreds+of+years+before+the+dissolution+of+that+union.+%28b%29+Because+the+Scriptures+constantly+describe+the+moral+and+spiritual+condition+into+which+their+descendants+are+born%2C+and+from+which+they+are+delivered+by+Christ%2C+as+a+state+of+death.+%28Rev.+3%3A1%3B+Eph.+2%3A1-5%3B+5%3A14%3B+John+5%3A24.%29+This+death+is+a+condition+of+increasing+sin+and+misery%2C+resulting+from+excision+from+the+only+source+of+life.+It+involves+the+entire+person%2C+soul+and+body%2C+and+continues+as+long+as+the+cause+continues.%E2%80%9D%0A%0A%E2%80%94+Archibald+Alexander+Hodge%2C+A+Commentary+on+the+Confession+of+Faith%2C+ed.+William+H.+Goold+%28British+edn%2C+London%3A+T.+Nelson+and+Sons%2C+1870%29%2C+pp+121-24.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc9c57b7ed7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c9c57b7ed7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/08/13/a-a-hodge-on-the-westminster-doctrine-of-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Quest. Now, whence comes this rootedness and firm stability of God’s children? Ans. Especially from this, that they are now in the covenant of grace, rooted in Christ, who is God-man, in whom they are firmly rooted. In Adam we had a root of our own, but now our root is in Christ. All grace is first poured into Christ’s blessed nature, John 1:16, and then at a second hand, ‘out of his fulness we all receive grace for grace.’ Being rooted in Christ we become firm, for there is in him an everlasting marriage and union. ‘The root beareth us, we bear not the root,’ Rom. 11:18. Christ beareth us, we bear not him. So now, in the covenant of grace, all the firmness is out of us. Even as salvation itself was wrought out of us by a mediator, so it is kept by a mediator out of us. All goodness, grace, and favour of God to us is not in us, but in Christ; but it is so out of us, as Christ and we are one. But now we only speak of the cause of our firmness and stability, that because we are in the state of grace we have an everlasting firmness, as we are in Christ Jesus, God now making a second covenant, he will not have it disannulled as the first was, for his second works are better than his first. His first covenant was, ‘Do this and live,’ Lev. 18:5; but his second is, ‘Believe this and live,’ Rom. 10:9. So as howsoever our state in grace be but little, yet it is of a blessed, growing, spreading, firm nature, so sure as what is begun in grace will end in glory. Where God gives the first fruits he will give tenths, yea, the full harvest and all, because by the covenant of grace we are one with Christ, who is an everlasting head that never dies. Subservient to this now we have promised in the covenant of grace that we shall never depart from him, and that he will never depart from us to do us good. He puts an awe-band into our hearts, that we shall never depart from him. But this point being often touched, leaving it, we will come to answer some objections.</p></blockquote>

<blockquote><p>The covenant of works is that in which God promiseth everlasting life unto a man that in all respects performeth perfect obedience to the law of works, adding thereunto threatenings of eternal death, if he shall not perform perfect obedience thereto. God made this covenant in the beginning with the first man Adam, whilst he was in the first estate of integrity: the same covenant God did repeat and make again by Moses with the people of Israel.</p></blockquote>

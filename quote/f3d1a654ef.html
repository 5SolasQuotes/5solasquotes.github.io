<main class="wrap"><figure class="quote" id="q-f3d1a654ef" data-kw="">
<blockquote><p>4…. but the conscience is more dull in apprehending that spiritual vengeance follows such spiritual sins as unbelief, because until there be some supernatural revelation, we are dead to the Gospel truths, and Gospel sins, but when a common grace heightens the soul to a supernatural assent, that Christ is a Teacher sent of God (Jn. 7:28; Jn. 3:2), the conviction is more strong: But because it is more supernatural, and in stead of kindly affection of love which it wants [lacks], it is mixed with hatred and anger and so degenerates into fiery indignation against the Holy Ghost, as Jn. 15:24 compared with Mt.12:15; 26:31 clears.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened 1655</cite>, p. 70</span></figcaption>

</figure><figure class="quote" id="q-76f5cff49e" data-kw="">
<blockquote><p>…our Lord also taught the universality of the love of God in the numerical sense of appropriating it to every individual man… …in the second place, that the work of redemption itself bears in our Lord’s representation a broad cosmical character… Especially the doctrine of the kingdom in its eschatological aspect clearly reveals that the divine love sets for its goal not the saving of isolated individuals out of the world, but the salvation of the world as an organic whole… There is, however, still a third sense, in which Jesus leads us to ascribe universality to the divine love. This is done not so much in explicit form as by the implications of His attitude toward sinful men in general.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 13-14 of “The Scriptural Doctrine of the Love of God” in The Presbyterian &amp; Reformed Review, no. 13 (1902)</cite></span></figcaption>

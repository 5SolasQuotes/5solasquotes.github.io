<main class="wrap"><figure class="quote" id="q-1de89f7c5a" data-kw="">
<blockquote><p>The trifling objection of the abuse of this psalm [psalm 121], by the woman’s usual coming in a vail is easily answered, by affirming that the Church, as she does not forbid, so neither does she command any such habit, but leaves it as an indifferent thing; and if the woman, who has an arbitrary power in this concernment, think fit to come forth vailed, that is, better armed against the cold, her act cannot constitute a ceremony of the Church, and so the Church not chargeable with the abuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hamon-l-estrange.html">Hamon L’Estrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Alliance of Divine Offices, exhibiting all the Liturgies of the Church of England since the Reformation as also the late Scotch Service-Book [1637], with all their Respective Variations: and upon them all Annotations, Vindicating the Book of Common-Prayer from the Main Objections of its Adversaries… (London, 1659), Annotations upon ch. 11</cite>, p. 317</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The trifling objection of the abuse of this psalm [psalm 121], by the woman’s usual coming in a vail is easily answered, by affirming that the Church, as she does not forbid, so neither does she command any such habit, but leaves it as an indifferent thing; and if the woman, who has an arbitrary power in this concernment, think fit to come forth vailed, that is, better armed against the cold, her act cannot constitute a ceremony of the Church, and so the Church not chargeable with the abuse.”

</figure><figure class="quote" id="q-87f72e989e" data-kw="">
<blockquote><p>This thesis argues that in 1 Corinthians 11:2-16 Paul asserts most centrally that women should wear head coverings while praying and prophesying in the Corinthian Christian assembly. I examine the honor and shame value system of the Greco-Roman world, both generally and in specific reference to head adornment, since head coverings and hairstyles were connected to honor and status. Then I look at Paul’s treatment of honor and shame throughout 1 Corinthians, which denounces the worldly value system of status seeking in favor of the value system of the cross. Paul’s stance leads him to subject cultural norms to gospel values…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/april-m-hoelke.html">April M. Hoelke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposed Heads &amp; Exposed Motives: Coverings as a Means to Unity at Corinth MA thesis (Gardner-Webb Univ., 2014) 125 pp.</cite></span></figcaption>

</figure><figure class="quote" id="q-95f09a7369" data-kw="">
<blockquote><p>Yielding by concession, not by confession, that all the [English-Popish] ceremonies about which there is controversy now among us were of old used by the Fathers [of the early Church], yet that which these Formalists say, is (as Parker shows, Of the Cross, ch. 2, section 10) even as if a servant should be covered before his master, not as covering is a late sign of preeminence, but as it was of old a sign of subjection, or as if one should preach that the prelates are tyranni [tyrants] to their brethren, fures [thieves] to the Church, sophistae [sophists] to the truth, and excuse himself thus, ‘I use these words as of old [when] they signified, a ruler, a servant, a student of wisdom.’ All men know that words and actions must be interpreted, used and received according to their modern use, and not as they have been of old.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’</cite>, ch. 3, pp. 46-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-eb066755ce" data-kw="">
<blockquote><p>Their women used both to pray and prophesy unveiled, and with their head bare, (for even women also used to prophesy) but the men went so far to wear long hair, as having spent their time in philosophy and covered their heads when praying and prophesying, each[?] of which was a Grecian custom.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4ece83658b" data-kw="">
<blockquote><p>3. That place must needs be holy where the Lord dwells as a Master in his house, teaching, ordering and supplying all necessaries. Where Christ, the holy Son of God, walks in the midst of the seven golden candlesticks, being conversant among the flocks of shepherds… Surely, this is Bethel, the house of God, and the gate of Heaven. This teaches us not to despise our [Anglican] assemblies, nor to think our churches unholy for some corruptions. Look upon Jerusalem, Mt. 23:37; you shall see the eleven tribes were apostates, there were in it dumb dogs, Isa. 56:10, there were scribes and Pharisees, hypocrites. At this time the doctrine of the Law was corrupted by the false glosses of the Pharisees, and the Temple was almost a den of thieves, full of buyers and sellers. Yet for all this, the evangelist calls it ‘the holy city,’ even when it had more corruptions in it than the Church of England has at this day. Why?:

1. Because there the service of the true God was set up in the Temple, the Word preached, sacrifices offered, and the meetings of the Church of God.

2. Because as yet they had not received a bill of divorce. Have we not the Word truly preached, and the sacraments for substance truly administered? And for discipline, I will say, I wish we had the execution of so much as the Church allows. Or, when did the Lord give us a bill of divorce? Or, what Church has convinced us that we cannot be acknowledged for a true Church? If they say, they of the Separation have, I answer:

1. They have labored to discover some errors, but none fundamental in us, nor without as many in themselves.

2. We… must not think it strange if some unstable persons forsake our communion, since in the golden and flourishing age of the apostles there were some such, Heb. 10:25.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Combat &amp; Conquest</cite>, ... (Cambridge: Legge, 1618), verses 5-6, pp. 165-66</span></figcaption>

<blockquote><p>§5. But we find the ancient Fathers with a holy zeal, charging such as apostates from the Church and breakers of her peace, who held opinions contrary to the essential and fundamental, or any of the great articles of the Christian Faith, so that they placed the unity of the catholic Church in a harmonious consent to these great truths. Irenaeus ([Against Heresies] bk. 1, ch. 3, p. 53, edition Cologne, 1625), having given a short account of the chief articles of the true religion, has these words: hanc igitur praedicationem, et hanc ••dem adepta Ecclesia, quamvis dispersa in universo mundo, diligenter conservat, a• si in una eademque domo habitaret, ac similiter iis fidem habet, ac si unam animam unumque et idem cor haberet; atque un• consensu hoc praedicat, docet ac tradit, ac si uno ore praedita esset. Quamvis enim dissimilia sunt in mundo genera linguarum, una tamen et eadem est vis traditionis; nec quae constitutae sunt in Germania Ecclesiae aliter credunt; nec quae in Hispania, neque in Galliis; neque in Oriente, neque in Aegypto, neque in Lybia, aut in medio Orbis terrarum fundatae sunt, sed quemadmodum Sol Creatura Dei unus et idem est in universo Mundo; ita &amp; praedicatio veritatis ubiquae lucet, &amp; illuminat eos qui ad notionem veritatis venire volunt. Eusebius (Ecclesiastical History, bk. 4, ch. 27) cites Irenaeus condemning Tatianus, the author of the sect of the Encratitae, and saying of him, [Greek], he reckoned his opinions a falling from the Church, or a breaking her unity. The same Historian, bk. 4, ch. 24, gives account of Egesippus narrating, how long the Church remained a virgin, teaching and believing nothing but the Law and the prophets, and what the Lord Himself taught, and he mentions particularly the Churches of Corinth, Rome and Jerusalem; and then shows how heresies arose, whose authors he calls false Christs, false prophets and false apostles, and of them he says, [Greek],they divided the unity of the Church by their corrupt doctrines against God, and against his Christ. Several other citations might be brought to this purpose, but these may be sufficient. I do not question but that there might be other things which might be called schism, even with respect to the universal Church, as if any should bring in idolatrous, or superstitious worship, contrary to the rules of the Gospel, or should violate any of the necessary and laudable canons of General Councils, and should set up societies in opposition, not only to one or few, but to all the societies of Christians, or all the soundest of them… §6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, (Edinburgh: Anderson, 1697), sect. 10, ‘Of Schism’ Rule was a Scottish, divine-right presbyterian minister., pp. 250-52</span></figcaption>

ded the unity of the Church by their corrupt doctrines against God, and against his Christ. Several other citations might be brought to this purpose, but these may be sufficient. I do not question but that there might be other things which might be called schism, even with respect to the universal Church, as if any should bring in idolatrous, or superstitious worship, contrary to the rules of the Gospel, or should violate any of the necessary and laudable canons of General Councils, and should set up societies in opposition, not only to one or few, but to all the societies of Christians, or all the soundest of them… §6. There is another sort of unity much regarded among the ancients, which though the breach of it had as bad influence on all, or most Churches, and so on the catholic Church: yet it properly respected neighbor Churches, either which were united by the bond of one government, a provincial, or lesser synod, being made up of them: or only living in the vicinity of one another, or having frequent occasion of correspondence; they who were not under any uniting bonds, but these commune to all the parts of the catholic Church, yet had an unity of kind correspondence, mutual assistance, as occasion offered, acquainting one another with their affairs so far as it was of any advantage: admitting the members of other Churches to communion with them on occasion, refusing communion with such members of other Churches as were by them excommunicated: and this unity was then broken when these acts of friendship were shunned or refused, especially when they who were cast out by one were received to another: or when occasional communion was either shuned by them who so joined in another Church or denied to such sojourners if they desired it: or when one Church showed rage, fury and bitterness against another because of what they differed about.”

— Gilbert Rule, The Good Old Way Defended (Edinburgh: Anderson, 1697), sect. 10, ‘Of Schism’ Rule was a Scottish, divine-right presbyterian minister., pp. 250-52">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A75.+But+we+find+the+ancient+Fathers+with+a+holy+zeal%2C+charging+such+as+apostates+from+the+Church+and+breakers+of+her+peace%2C+who+held+opinions+contrary+to+the+essential+and+fundamental%2C+or+any+of+the+great+articles+of+the+Christian+Faith%2C+so+that+they+placed+the+unity+of+the+catholic+Church+in+a+harmonious+consent+to+these+great+truths.+Irenaeus+%28%5BAgainst+Heresies%5D+bk.+1%2C+ch.+3%2C+p.+53%2C+edition+Cologne%2C+1625%29%2C+having+given+a+short+account+of+the+chief+articles+of+the+true+religion%2C+has+these+words%3A+hanc+igitur+praedicationem%2C+et+hanc+%E2%80%A2%E2%80%A2dem+adepta+Ecclesia%2C+quamvis+dispersa+in+universo+mundo%2C+diligenter+conservat%2C+a%E2%80%A2+si+in+una+eademque+domo+habitaret%2C+ac+similiter+iis+fidem+habet%2C+ac+si+unam+animam+unumque+et+idem+cor+haberet%3B+atque+un%E2%80%A2+consensu+hoc+praedicat%2C+docet+ac+tradit%2C+ac+si+uno+ore+praedita+esset.+Quamvis+enim+dissimilia+sunt+in+mundo+genera+linguarum%2C+una+tamen+et+eadem+est+vis+traditionis%3B+nec+quae+constitutae+sunt+in+Germania+Ecclesiae+aliter+credunt%3B+nec+quae+in+Hispania%2C+neque+in+Galliis%3B+neque+in+Oriente%2C+neque+in+Aegypto%2C+neque+in+Lybia%2C+aut+in+medio+Orbis+terrarum+fundatae+sunt%2C+sed+quemadmodum+Sol+Creatura+Dei+unus+et+idem+est+in+universo+Mundo%3B+ita+%26+praedicatio+veritatis+ubiquae+lucet%2C+%26+illuminat+eos+qui+ad+notionem+veritatis+venire+volunt.+Eusebius+%28Ecclesiastical+History%2C+bk.+4%2C+ch.+27%29+cites+Irenaeus+condemning+Tatianus%2C+the+author+of+the+sect+of+the+Encratitae%2C+and+saying+of+him%2C+%5BGreek%5D%2C+he+reckoned+his+opinions+a+falling+from+the+Church%2C+or+a+breaking+her+unity.+The+same+Historian%2C+bk.+4%2C+ch.+24%2C+gives+account+of+Egesippus+narrating%2C+how+long+the+Church+remained+a+virgin%2C+teaching+and+believing+nothing+but+the+Law+and+the+prophets%2C+and+what+the+Lord+Himself+taught%2C+and+he+mentions+particularly+the+Churches+of+Corinth%2C+Rome+and+Jerusalem%3B+and+then+shows+how+heresies+arose%2C+whose+authors+he+calls+false+Christs%2C+false+prophets+and+false+apostles%2C+and+of+them+he+says%2C+%5BGreek%5D%2Cthey+divided+the+unity+of+the+Church+by+their+corrupt+doctrines+against+God%2C+and+against+his+Christ.+Several+other+citations+might+be+brought+to+this+purpose%2C+but+these+may+be+sufficient.+I+do+not+question+but+that+there+might+be+other+things+which+might+be+called+schism%2C+even+with+respect+to+the+universal+Church%2C+as+if+any+should+bring+in+idolatrous%2C+or+superstitious+worship%2C+contrary+to+the+rules+of+the+Gospel%2C+or+should+violate+any+of+the+necessary+and+laudable+canons+of+General+Councils%2C+and+should+set+up+societies+in+opposition%2C+not+only+to+one+or+few%2C+but+to+all+the+societies+of+Christians%2C+or+all+the+soundest+of+them%E2%80%A6+%C2%A76.+There+is+another+sort+of+unity+much+regarded+among+the+ancients%2C+which+though+the+breach+of+it+had+as+bad+influence+on+all%2C+or+most+Churches%2C+and+so+on+the+catholic+Church%3A+yet+it+properly+respected+neighbor+Churches%2C+either+which+were+united+by+the+bond+of+one+government%2C+a+provincial%2C+or+lesser+synod%2C+being+made+up+of+them%3A+or+only+living+in+the+vicinity+of+one+another%2C+or+having+frequent+occasion+of+correspondence%3B+they+who+were+not+under+any+uniting+bonds%2C+but+these+commune+to+all+the+parts+of+the+catholic+Church%2C+yet+had+an+unity+of+kind+correspondence%2C+mutual+assistance%2C+as+occasion+offered%2C+acquainting+one+another+with+their+affairs+so+far+as+it+was+of+any+advantage%3A+admitting+the+members+of+other+Churches+to+communion+with+them+on+occasion%2C+refusing+communion+with+such+members+of+other+Churches+as+were+by+them+excommunicated%3A+and+this+unity+was+then+broken+when+these+acts+of+friendship+were+shunned+or+refused%2C+especially+when+they+who+were+cast+out+by+one+were+received+to+another%3A+or+when+occasional+communion+was+either+shuned+by+them+who+so+joined+in+another+Church+or+denied+to+such+sojourners+if+they+desired+it%3A+or+when+one+Church+showed+rage%2C+fury+and+bitterness+against+another+because+of+what+they+differed+about.%E2%80%9D%0A%0A%E2%80%94+Gilbert+Rule%2C+The+Good+Old+Way+Defended+%28Edinburgh%3A+Anderson%2C+1697%29%2C+sect.+10%2C+%E2%80%98Of+Schism%E2%80%99+Rule+was+a+Scottish%2C+divine-right+presbyterian+minister.%2C+pp.+250-52&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffb1b6b0eac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fb1b6b0eac.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=5.%20But%20we%20find%20the%20ancient,because%20of%20what%20they%20differed%20about&amp;text=5.%20But%20we%20find%20the%20ancient%20Fathers%20with&amp;text=against%20another%20because%20of%20what%20they%20differed%20about" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>However, most others describe the visible Church as the assembly of those who profess the true and salutary doctrine of Christ and legitimately use the sacraments instituted by Him, and also observe the lawful order of discipline. Some others more briefly say it is the assembly of those who profess the true religion, along with their children. Thus, the Anglican Confession, Chapter 25, Article 30. Therefore, they do not want any heretical churches to constitute part of the visible Church, but exclude from it those who are properly called heretics; nor do they place outside it all who err in matters of faith and sin in the administration of the sacraments and the exercise of discipline; but only those who deny and subvert the fundamental teachings concerning faith, discipline, and the sacraments. Therefore, among the many particular churches that are contained within the communion of the true Church, they note various degrees of purity and perfection; nor do they immediately deny a church to be a true Church of Christ if it is not in all respects pure in doctrine or in the rest of worship, rites, and the sanctity of discipline, and if it has some errors in saving faith, some abuses in the use of sacraments, some superstitions in divine worship, and some allowance of scandals in the sanctity of discipline, provided that in the meantime it retains the fundamental and saving doctrine and practice of faith and worship. These are the words of the confession or declaration of the Polish Churches, publicly read at the Thorunien assembly in 1645, and printed and published the following year. And this is the common opinion of our theologians, as can be seen in John Calvin, Institutes, Book 4, Chapter 1, Section 12 and following, and in the illustrious Mestrezat in his French treatise on the Church, Book 2, Chapter 4.</p></blockquote>

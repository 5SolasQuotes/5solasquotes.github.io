<blockquote><p>‘nature’ here some understand the law of nature, according to which it would have an intrinsic evil in it, which it is plain it has not; for then neither must the Nazarites have used it (as they did), neither would it be lawful for the sake of men’s health or life. Others understand by nature the law of nations; but neither is this true, for in many nations men wear hair at the utmost length. Others understand common sense, or the light and judgment of that natural reason which since the fall is left in man; but this must be the same in all men, and we know that all men do not judge this shameful. Others therefore by nature here understand a common custom, which (as they say) makes as it were a second nature; so the term is taken, Rom. 11:24; but it cannot so signify here; for there neither is, nor ever was, such a universal custom in any place, that none in it wore long hair. Others by nature here understand natural inclination; but neither can this be the sense, for there is in some men, as well as in women, a natural propension and inclination to wear their hair at excessive lengths. Others here by nature understand the difference of the sex, as they take this word to be used, Rom. 1:26; the distinction of the sexes teaches us this: and this seems to be the most probable sense of this text. The apostle arguing, that as the male and female sex are artificially distinguished by garments, and it was the will of God they should be so, so they should also be distinguished by the wearing of their hair; and it was no less shame for a man to wear his hair like a woman, than to wear garments like a woman.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on 1 Cor. 11 | v. 14</cite></span></figcaption>

<blockquote><p>(4) …1 Tim. 2:9. And therefore the leaving the breasts naked, in whole or in part, is a transgression of this rule; they uncover their nakedness which they should vail and hide, especially in God’s presence: as the apostle says, 1 Cor. 11:10, ‘The woman ought to have power on her head, because of the angels.’ In the assembly there you meet with angels and devils; angels to observe your garb and carriage, and devils to tempt you; therefore be covered because of the angels. Yet usually women come hither with a shameless impudence into the presence of God, men and angels. This is a practice that neither suits with modesty nor conveniency; nothing can be alleged for it but reasons of pride and wantonness; it feeds your own pride and provokes lust in others. You would think they were wicked women that should offer others poison to drink; they do that which is worse, lay a snare for the soul, uncover that which should be covered; lest you provoke others of your rank to imitate your vanity, if they should not by the fear of God be guarded from unclean thoughts and filthy desires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fourth Volume containing One Hundred &amp; Fifty Sermons on Several Texts of Scripture in Two Parts: part the First Containing LXXIV Sermons... (London, 1693), Several Sermons upon Titus 2:11-14, Sermon 8, 3rd Branch, Sobriety in Apparel</cite>, p. 78</span></figcaption>

<blockquote><p>1. The text [1 Cor. 11:16] gives him [Anglican bishop Andrewes] no ground for this doctrine… that the custom of the Church should be enough to us in matters of ceremony… for the custom of the Church there spoken of is not concerning a point of circumstance, but concerning a very substantial and necessary point, namely, not to be contentious: neither does the apostle urge those orders of the men’s praying uncovered and the women’s praying veiled from this ground, because so was the Church’s custom (as the bishop would have it), but only he is warning the Corinthians not to be contentious about those matters, because the churches have no such custom as to be contentious. So is the place expounded by Chrysostom, Ambrose, Calvin, Martyr, Bullinger, Marlorat, Beza, Fulke, Cartwright, Pareus… And for this exposition it makes that the apostle in the preceding part of the chapter has given sufficient reasons for that order of covering or veiling the women: wherefore if any would contend about the matter, he tells them they must contend with themselves, for they (nor the churches of God) would not contend with them: they had no such custom. … 2. The custom of the Church is not enough to pitch on, and it is found oftentimes expedient to change a custom of the Church. Basil the Great does flatly refuse to admit the authority of custom: Consuetudo sine veritate [Custom without truth], says Cyprian, vetustas erroris est [is an old thing erring]. Frustra enim qui ratione vincuntur, says Augustine, consuetudinem nobis objiciunt, quasi consuetudo major sit veritate, etc. Nullus pudor est ad meliora transire, says Ambrose to the Emperour Valentinian: Quaelibet consuetudo [Any custom], says Gratian, veritati est postponenda [ought to be put after the truth]. And again: Corrigendum est quod illicite admittitur, aut a praedecessoribus admissum invenitur. A politic writer admonishes, retinere antiqua [retain that which is ancient], only with this caution: Si proba [if it is proved]. Calvin (speaking against human ceremonies) says: Si objiciatur, etc. ‘If’, says he, ‘antiquity be objected (albeit they who are too much addicted to custom and to received fashions, do boldly use this buckler to defend all their corruptions), the refutation is easy: For the ancients also themselves with heavy complaints have abundantly testified that they did not approve of anything which was devised by the will of men.’ In the end of the epistle he alleges this testimony of Cyprian: ‘If Christ alone be to be heard, then we ought not to give heed what any man before us has thought fit to be done, but what Christ (who is before all) has done, for we must not follow the custom of man, but the truth of God.’ What can be more plain than that antiquity cannot be a confirmation to error, nor custom a prejudice to truth?… 3. …If then it be enough to pitch upon custom, why ought not those customs to have been commended and continued? But if they were commendably changed, then ought we not to follow blindly the bare custom of the Church, but examine the equity of the same, and demand grounds of reason for it. St. Paul (says Dr. Fulke) does give reasons for that order of covering women’s heads: By whose example the preachers are likewise to endeavor to satisfy by reason both men and women, that humbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only. 4. Whereas the custom of some churches is alleged for the ceremonies, we have objected the custom of other churches against them: Neither shall ever our opposites prove them to be the customs of the Church universal. … 6. If it were so that we ought to pitch upon the Churches custom, yet (that I may speak with Mr. [Richard] Hooker) the law of common indulgence permits us to think of our own customs as half a thought better than the customs of others. But why was there such a change made in the discipline, policy and orders of the Church of Scotland, which were agreeable to the Word of God, confirmed and ratified by general assemblies and parliaments, used and enjoyed with so great peace and purity? Our custom should have holden the ceremonies out of Scotland, hold them in elsewhere as it may.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | 3rd Part, ‘Against the Lawfulness of the Ceremonies’</cite>, ch. 6, pp. 104-6</span></figcaption>

ian%3A+Quaelibet+consuetudo+%5BAny+custom%5D%2C+says+Gratian%2C+veritati+est+postponenda+%5Bought+to+be+put+after+the+truth%5D.+And+again%3A+Corrigendum+est+quod+illicite+admittitur%2C+aut+a+praedecessoribus+admissum+invenitur.+A+politic+writer+admonishes%2C+retinere+antiqua+%5Bretain+that+which+is+ancient%5D%2C+only+with+this+caution%3A+Si+proba+%5Bif+it+is+proved%5D.+Calvin+%28speaking+against+human+ceremonies%29+says%3A+Si+objiciatur%2C+etc.+%E2%80%98If%E2%80%99%2C+says+he%2C+%E2%80%98antiquity+be+objected+%28albeit+they+who+are+too+much+addicted+to+custom+and+to+received+fashions%2C+do+boldly+use+this+buckler+to+defend+all+their+corruptions%29%2C+the+refutation+is+easy%3A+For+the+ancients+also+themselves+with+heavy+complaints+have+abundantly+testified+that+they+did+not+approve+of+anything+which+was+devised+by+the+will+of+men.%E2%80%99+In+the+end+of+the+epistle+he+alleges+this+testimony+of+Cyprian%3A+%E2%80%98If+Christ+alone+be+to+be+heard%2C+then+we+ought+not+to+give+heed+what+any+man+before+us+has+thought+fit+to+be+done%2C+but+what+Christ+%28who+is+before+all%29+has+done%2C+for+we+must+not+follow+the+custom+of+man%2C+but+the+truth+of+God.%E2%80%99+What+can+be+more+plain+than+that+antiquity+cannot+be+a+confirmation+to+error%2C+nor+custom+a+prejudice+to+truth%3F%E2%80%A6+3.+%E2%80%A6If+then+it+be+enough+to+pitch+upon+custom%2C+why+ought+not+those+customs+to+have+been+commended+and+continued%3F+But+if+they+were+commendably+changed%2C+then+ought+we+not+to+follow+blindly+the+bare+custom+of+the+Church%2C+but+examine+the+equity+of+the+same%2C+and+demand+grounds+of+reason+for+it.+St.+Paul+%28says+Dr.+Fulke%29+does+give+reasons+for+that+order+of+covering+women%E2%80%99s+heads%3A+By+whose+example+the+preachers+are+likewise+to+endeavor+to+satisfy+by+reason+both+men+and+women%2C+that+humbly+desire+their+resolution+for+quiet+of+their+conscience%2C+and+not+to+beat+them+down+with+the+club+of+custom+only.+4.+Whereas+the+custom+of+some+churches+is+alleged+for+the+ceremonies%2C+we+have+objected+the+custom+of+other+churches+against+them%3A+Neither+shall+ever+our+opposites+prove+them+to+be+the+customs+of+the+Church+universal.+%E2%80%A6+6.+If+it+were+so+that+we+ought+to+pitch+upon+the+Churches+custom%2C+yet+%28that+I+may+speak+with+Mr.+%5BRichard%5D+Hooker%29+the+law+of+common+indulgence+permits+us+to+think+of+our+own+customs+as+half+a+thought+better+than+the+customs+of+others.+But+why+was+there+such+a+change+made+in+the+discipline%2C+policy+and+orders+of+the+Church+of+Scotland%2C+which+were+agreeable+to+the+Word+of+God%2C+confirmed+and+ratified+by+general+assemblies+and+parliaments%2C+used+and+enjoyed+with+so+great+peace+and+purity%3F+Our+custom+should+have+holden+the+ceremonies+out+of+Scotland%2C+hold+them+in+elsewhere+as+it+may.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29+%7C+3rd+Part%2C+%E2%80%98Against+the+Lawfulness+of+the+Ceremonies%E2%80%99%2C+ch.+6%2C+pp.+104-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf173113bb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af173113bb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/head-coverings-in-public-worship/gillespie-rutherford-on-headcoverings-in-public-worship/#:~:text=1.%20The%20text%20%5B1%20Cor.%2011%3A16,them%20in%20elsewhere%20as%20it%20may&amp;text=1.%20The%20text%20%5B1%20Cor.%2011%3A16%5D%20gives%20him&amp;text=Scotland%2C%20hold%20them%20in%20elsewhere%20as%20it%20may" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a52386c558" data-kw="">
<blockquote><p>It appears that this was a politic law serving only for the circumstances of the time that Paul lived in, by this reason, because in these our day, for a man to speak bare-headed in an assembly, is a sign of subjection.</p></blockquote>

</figure><figure class="quote" id="q-5cded7c21e" data-kw="">
<blockquote><p>Ver. 2. And keep the ordinances ] Gr. the traditions or doctrines by word of mouth. These are, 1. Dogmatic, concerning faith and practice, 2 Thess. 2:15 ; 2 Thess. 2:1-17 . Ritual; and these again are, 1. Perpetual, as that of the manner of administering the two sacraments. 2. Temporary, as that of abstaining from certain meats, Acts 15:28-29 . And those other pertaining to the observing of external order and decency in Church assemblies. And of these the apostle here speaketh. (Sclater) … Ver. 4. Dishonoureth his head] As they accounted it then and there. In other places it is otherwise. The French preach covered. The Turks neither kneel nor uncover the head at public prayer, as holding those postures unmanly. Several countries have their several customs. Basiliades, duke of Muscovy, showed himself a tyrant in nailing an ambassador’s hat to his head, for not uncovering it before him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians, ch. 11</cite></span></figcaption>

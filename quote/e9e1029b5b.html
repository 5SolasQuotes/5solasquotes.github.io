<blockquote><p>All that the Father gives me will come to me, and whoever comes to me I will never cast out.” (John 6:37)

The English language fails to give the full sense of the Greek in this sentence. The literal meaning of the Greek is, not “all persons whom the Father giveth shall come,” but “everything, – the whole thing.” It is not a masculine plural, but a neuter singular. The idea is either “that the whole mystical body, the company of my believing people, shall come to Me,” or else “every single part or jot or member of my mystical body shall come to Me, and not one be found missing at last.”

We learn from these words the great and deep truth of God’s election and appointment to eternal life of a people out of this world. The Father from all eternity has given to the Son a people to be His own peculiar people. The saints are given to Christ by the Father as a flock, which Christ undertakes to save completely, and to present complete at the last day. (See John xvii. 2, 6, 9, 11, 12: and xviii. 9.) However wicked men may abuse this doctrine, it is full of comfort to a humble believer. He did not begin the work of His salvation. He was given to Christ by the Father, by an everlasting covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels: John, Volume One</cite>, (1869; Edinburgh: Banner of Truth, 1987), p. 376.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6ff7788dc1" data-kw="">
<blockquote><p>And then further, Let the consideration of this be of comfort to thee (when thou hast committed sin against God, if thou be’st such a one as hath been spoken of) in remembering the Covenant that God hath made with thee, and bless God for the Covenant that he hath made with thee in Christ, and the difference that God hath made between thee and others in this thing; magnify his free grace in the Covenant of grace, for from thence is it that thy spot shall not be a deadly spot; and God will not deal with thee as with the wicked: certainly this is not from the nature of thy sin, for that may be as heinous as the sins of the other, but that that makes the difference is the free-grace of God in Christ.

O blessed be God for the Covenant of grace that hath made the difference. I remember I have read of Luther, he indeed saith when he was a Monk, though he were Conscientious then, yet then whensoever he committed any sin against God, his Conscience did so fly in his face, that he thought he was rejected utterly of God, till God made him know that Covenant of his grace in Christ; and then he thought he heard such a voice speaking to him, Oh Martin, do not despair, for thou shalt, as long as thou livest here in the flesh, sin against God; only do thou lustily oppose thy sin, and resist thy sin, and then know, that thou art not under the Law, but under grace: It is from hence that there is this difference, therefore bless God that ever he reveal’d this Covenant of grace to thy soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The difference between the spots of the godly and of the wicked preached by Mr. Jeremiah Burroughs at Cripple Gate</cite>, (London, 1668), pp 107-08.</span></figcaption>

<blockquote><p>Q. But why do you call it [Christ’s satisfaction] our legal righteousness? A. Because thereby the Law of God owns itself fully paid, and acquiesces 〈◊〉 it, as in full reparations, and amends made unto it for the injury and dishonour received by the sin of man. Q. And may we plead this against 〈◊〉 the challenges and accusations of the law. A. Yes. (Rom. 8:33-34) Q. And is this our legal righteousness required in the first Covenant, that of Works, which is thus imputed upon our account, wholly without us, in our Redeemer? A. Yes. Q. But is our evangelical righteousness required in the second Covenant without us, as our legal righteousness required in the Old is? A. No, for though Christ performed the conditions of the Law, and satisfied for our non-performance, yet it is ourselves that must perform the conditions of the Gospel. It is not Christ but we that must repent and believe. (Acts 20:21) Q. But there are some that tell us that Christ has also performed for us the conditions of the Gospel; that He has believed perfectly, and repented perfectly, and that all is ours: what ought we to think of this opinion? A. If we judge of it in its clear consequence, it is both absurd and blasphemous; as if Christ had a Saviour to believe in for pardon and life, or sin to repent of, and sorrow for, and mortify. Q. How is this opinion absurd? A. As it supposes a perfect Savior to stand in need of a Savior. (Heb. 7:26-27) Q. How is it blasphemous? A. As it makes Christ the Son of God a sinner, who is God and man. (Jn. 9:24-25; Phil. 2:6-7) Q. How does the Gospel justify? A. As it is the Law of Faith that publishes and declares to us upon what terms we shall be justified. (Rom. 3:27) Q. And is the Gospel our great charter, and God’s warrant under his broad seal, that he that believes shall not be condemned? A. Yes. (Jn. 3:18) Q. How does faith justify? A. By virtue of the Law promulgated and published as it is our evangelical righteousness, or our keeping the Gospel-Law, which suspends justification upon believing. Q. Does faith pretend to no merit or virtue of its own? A. No, but professedly avows its dependance upon the merit of Christ’s satisfaction, and lays hold on it as our legal righteousness. Q. Nor can it show any other title to be itself our evangelical righteousness, but only God’s sanction [Law, or Decree establishing it] who chose this act of believing to the honour of being the justifying act, because it so highly honours Christ? A. No. Q. May this be illustrated to us by some apt resemblance? A. Yes, the act of believing is as the silver; but God’s authority in the Gospel-sanction is the king’s coin, or image stamped upon it, which gives it all its value as to justification. Q. Without this stamp, could it never have been current? A. No. Q. And if God had set this stamp on any other grace, as love: would that then have been current, and have justified us as faith does now? A. Yes. Q. How does God justify? A. God justifies in a proper sense two ways: First, as a Legislator. Secondly, as a Judge. Q. How does God justify as a Legislator? A. He justifies as a Legislator, enacting by his sovereign authority that sweet and gracious Law of the New Covenant, by virtue of whose tenor every sinner that believes is justified from the guilt of sin, from which he could not be justified by the Law of Moses, Acts 13:39. Q. How does God justify as a Judge? A. 2. As a Judge, He may in three respects…</p></blockquote>

</figure><figure class="quote" id="q-34abd8f321" data-kw="">
<blockquote><p>1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest [seria] approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of Him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition [affectus] in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.</p></blockquote>

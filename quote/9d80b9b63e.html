<main class="wrap"><figure class="quote" id="q-9d80b9b63e" data-kw="">
<blockquote><p>1. It is of absolute necessity that every man consent before another man can do the work of a pastor for his soul: And God in nature and Scripture has ordained that he who must be saved or damned according to the minister’s success, should be the chooser or refuser of that which so unspeakably concerns him and not have his salvation more in another’s power than his own, if he be at age and in his wits. 2. And yet this may be run into extremes; and these are not easily avoided: 1. Infants (that is, all short of an understanding, choosing age) and idiots and madmen, are half-brutes in act, and to be governed accordingly by force, so far as they are incapable of reason. But these are not capable of the Church-communion of the adult. Yea, not only children, but all [civil] subjects who are not communicants, may be forced to hear and learn [Christianity] as catechumens, as is said: And they must not pretend a power to choose their teachers, to excuse them from all learning: But if they say that they can learn better of another than the parish-minister; if they are able, they may remove to another parish: If not, they must give proof that they live as learners under some teacher who is capable to instruct them, approved or tolerated by authority, where rulers own the Truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Defended against both Extremes, and Unnecessary Division Confuted in Five Parts... (1684), Unnecessary Separating Disowned</cite>, pp. 4-5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5839766dcc" data-kw="">
<blockquote><p>I know that many heap up arguments and bring us long rolls of authorities for episcopacy. And I know that Gersom, Bucer, Beza, [Calderwood’s] Altare Damascenum, Parker, Baynes, Salmasius, Blondel, Prynne (in his Catalogue of Writers against Bishops, and in his History of Bishops, pt. 2, ch. 3 and Unbishopping of Timothy and Titus), Dr. Reynolds and others do give us as long a train of arguments and authorities on the other side… but, methinks all those men that have without prejudice read the authors that I have mentioned (especially Bucer, Parker, and Blondel, and Salmasius), yea, though they have read all that ever was writ on the other side, should be so apprehensive of a difficulty in the business as to be moderate and modest in the censure of their brethren, and not to degrade or excommunicate all that differ from them. … And to have cited Calvin, Beza, Chamier, Pareus, Musculus or any of those multitudes of foreign divines that are known to be against them would have been labor in vain; and so it would have been to have cited Reynolds, Whitaker, Dr. Humphrey and such like at home, who are some known to be against them, and some no fast friends to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-73ce228bfb" data-kw="">
<blockquote><p>It is one of the greatest objections against the suppressing… of… errors and schisms, ‘O,’ say they, ‘this is a persecuting of those that are godly; this is a wound to piety, and the power of godliness.’ I do not deny but there may be, and is, true piety in many who are somewhat infected with the leaven of false doctrine, and live in some erroneous opinion… Those that are truly godly may in diverse things differ in opinion. Every error is not inconsistent with holiness, yet every error doth pro tanto [by so much], and proportionably retard, hinder, and prejudge holiness; and although the devil sow his tares among Christ’s wheat (I mean in the same persons as well as in the same church), yet who will say that a field of wheat is nothing the worse for the tares?… And this I hold as a good rule in practical divinity… so error of judgment, if continued in, doth not only hinder growing, but makes a dangerous decreasing and falling short in true piety… It is to be observed that sometimes the Scripture speaks of an error of the judgment concerning the faith as a fountain and cause of ungodliness, profaneness… 2 Tim. 2:16-19; Gal. 5:4; 2 Jn. 9; as contrariwise, there is a light and knowledge which preserves from sin and ungodliness, and leads the soul in ways of holiness and obedience, Ps. 9:10; 119:33-34; Jn. 17:17. If the knowledge of God, of his Christ, and of his Word, and will, and name and statutes, preserve us from sin, and lead us in the ways of obedience, then, by the rule of contraries, error of judgment in these things will ensnare us in sin and wickedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise of Miscellany Questions, ch. 12, ‘Whether a Sound Heart and an Unsound Head can Consist Together? and Vice Versa; or, Whether Truth and Holiness be not Insepararable Companions?’ in Works, vol. 2</cite></span></figcaption>

</figure><figure class="quote" id="q-b0fa663103" data-kw="">
<blockquote><p>All the power to be owned in bishops, is derived to them from the King; and, in those things wherein the King has power in church matters, in those things we may obey the bishops, as his delegates and substitutes… the law calls the King patron-general of England. His appointing me to preach [in the second indulgence], supposes I must have hearers, and those, of necessity, out of some parish or other. What we do is to serve the present necessity, and not of choice.</p></blockquote>

<blockquote><p>The third consideration is that there is some footsteps of this identity of bishop and presbyter in the most corrupt writtings of the most impure schoolmen: which may appear in these three: 1. In that, generally, episcopacy is holden to be no distinct order from presbytery; and that presbytery, or priesthood (as they speak) is the highest order in all their hierarchy. And this is current as the doctrine of Lombardus the Master of Sentences, Hugo, Aquinas, Thomas Waldensis, and generally of all the Thomists at least. And though they seem to make bishops to be of a more eminent degree, yet by Estius and some others alleged by him, this is not thought sufficient to distinguish one office from another.</p></blockquote>

<blockquote><p>[W]hen we hear of the promises of God made unto us in Christ, we must not content ourselves with a bare knowledge of them, but labour to believe them, and apply them to ourselves, to our souls and consciences; and so by faith make them our own. As it is said of Abraham, and in him of all the faithful, “The blessing of Abraham came on the Gentiles, through Jesus Christ, that we might receive the promise of the Spirit through faith” (Gal. 3:14).

Further observe, the Holy Ghost sets down that particular promise which God made to Abraham in his son Isaac, to whom it was said that in Isaac should his seed be called (Gen. 21:12, Rom. 9:7). In which places it is said, that in Isaac should his seed be called. The meaning whereof is plain and thus much in effect: Ishmael shall not be thy son and heir, but Isaac is the child which shall be your heir – he it is in whom I will accomplish the promises of life and salvation made to you.

From the words thus explained, first, we must observe Paul’s collection gathered from God’s dealing with those two persons (Rom. 9:7) – namely, that God before all worlds hath chosen some men to salvation in His eternal counsel, to manifest the glory of His grace and has refused and rejected others, leaving them unto themselves, to shew forth His justice upon them.

This doctrine is gathered out of this place, after this manner. Such as is God’s practice and dealing toward men in time. Such was His eternal counsel and decree (for as God before all time determined to deal with men, so in time He dealeth with them). Now God’s practice and dealing with Isaac and Ishmael is this: Ishmael is vouchsafed to be made partaker of temporal blessings; but yet he is cut off from the spiritual covenant of grace. And Isaac is the man that must receive the covenant, and by virtue thereof be made partaker of life everlasting. And so accordingly it is with others. God has decreed to choose some men to salvation, and these are admitted into the covenant. Others He has decreed to reject, and they are cut off from the covenant and from life everlasting.

These two persons, Isaac and Ishmael, are types of these two sorts of people whom God doth elect and reject. Isaac represents those that are chosen to salvation, who become the true members of God’s church; and Ishmael is a type of those who are rejected. Now in regard of this different dealing of God with mankind, choosing some and refusing others, we must all put in practice Saint Peter’s lesson with fear and trembling being very careful, and “giving all diligence to make our election sure” (2 Peter 1:10), for all be not elected to salvation, but some are rejected. All be not Isaacs, but some are Ishmaelites. If all were elected and chosen to salvation, then no man need to care for it; but seeing some are rejected, and never vouchsafed to come within the covenant indeed, therefore it standeth us greatly in hand to take the good counsel of the apostle and to give all diligence to make our election sure.

Secondly, whereas it is said, “Not in Ishmael, but in Isaac shall thy seed be called,” we may we may note the state of God’s church in this world in regard of the different sorts of men that live therein. For Abraham’s family was God’s church in those days, and therein were both Isaac and Ishmael – though both his children, yet far differing in estate before God. Ishmael indeed was born in the church, and there brought up, taught and circumcised; but yet he was without the Covenant in God’s sight.

Now Isaac was not only born and brought up in the church, and circumcised, but also received into the covenant, and herein differed far from Ishmael; for he is the son of Abraham in whom God will continue the covenant of grace unto life everlasting, to his posterity. And so it is with God’s church at this day. In it there be two sorts of men; one, which are baptised and brought up in the church, hear the Word and receive the sacraments, but yet are not saved because they have not the promise of the covenant effectually rooted in their hearts. The other sort are they which, being baptised in the church, hear the Word effectually and receive the Lord’s Supper worthily to their salvation, because God does establish His covenant in their hearts.

This difference is plain in Scripture, in the parables of the dragnet (Matthew 13), of the sower, and of the tares, as also by Christ’s behaviour at the last judgment (25:32), severing the sheep from the goats, both which live together in the church. And by Saint Paul, who speaking of those which are born and brought up in the church, saith that some are children of the flesh, and some children of the promise (Rom. 9:8).

This being so, that every one which lives in the church is not of the church – that is, is not a true member of the church and a true child of Abraham; it must make us all careful to use all holy means whereby we may be fully assured that the covenant of grace belongs unto us. For it is not enough for us to dwell in the church, to hear the Word, and to receive the sacraments (for so did Ishmael, and yet never was saved), unless therewithal we have the covenant of grace belonging to us, and the assurance thereof sealed in our consciences by God’s Holy Spirit.

Again, consider who spake these words: But in Isaac shall thy seed be called. We shall find (Gen. 21:12) that it was God Himself. “Let it not,” says God unto Abraham, “be grievous in thy sight for the child, and for the bondwoman; in all that Sarah shall say unto thee, hear her voice” – which was to “cast out the bondwoman and her son Ishmael. For (saith God) in Isaac shall thy seed be called.”

Here observe a notable practice of Abraham, as a good direction how we ought to judge of all those that live in the church, submitting themselves outwardly to the ministry and regimen thereof. Abraham here hath two sons, Isaac and Ishmael; he circumciseth them both, and instructs them both (for he “taught all his household” to know God, and to fear and obey Him [18:19]), he judgeth them both to be in one state in regards of God’s Covenant; though they were not; but that difference is made by God.

Abraham does not on his own head, and by his own will, put Ishmael out of the church, which was his family. But God bids him put him out, and then he put him out, and not before till such time he kept him in, and held him to be within the covenant, as well as Isaac was. Even so must we deal towards those that live in the church; secret judgment must be left to God; and, till God manifest the contrary, in the judgment of charity, we must hold them all elect.

This is the practice of Saint Paul in all his epistles. Writing to Corinth, he calls them “all sanctified” (1 Cor. 1:2); and to the Galatians (1:2), he calls them “all elect” – speaking so in the judgment of charity, although he knew that among them there were many profane and wicked men, and though he reprove many great errors and heinous sins amongst them.</p></blockquote>

ereof+sealed+in+our+consciences+by+God%E2%80%99s+Holy+Spirit.%0A%0AAgain%2C+consider+who+spake+these+words%3A+But+in+Isaac+shall+thy+seed+be+called.+We+shall+find+%28Gen.+21%3A12%29+that+it+was+God+Himself.+%E2%80%9CLet+it+not%2C%E2%80%9D+says+God+unto+Abraham%2C+%E2%80%9Cbe+grievous+in+thy+sight+for+the+child%2C+and+for+the+bondwoman%3B+in+all+that+Sarah+shall+say+unto+thee%2C+hear+her+voice%E2%80%9D+%E2%80%93+which+was+to+%E2%80%9Ccast+out+the+bondwoman+and+her+son+Ishmael.+For+%28saith+God%29+in+Isaac+shall+thy+seed+be+called.%E2%80%9D%0A%0AHere+observe+a+notable+practice+of+Abraham%2C+as+a+good+direction+how+we+ought+to+judge+of+all+those+that+live+in+the+church%2C+submitting+themselves+outwardly+to+the+ministry+and+regimen+thereof.+Abraham+here+hath+two+sons%2C+Isaac+and+Ishmael%3B+he+circumciseth+them+both%2C+and+instructs+them+both+%28for+he+%E2%80%9Ctaught+all+his+household%E2%80%9D+to+know+God%2C+and+to+fear+and+obey+Him+%5B18%3A19%5D%29%2C+he+judgeth+them+both+to+be+in+one+state+in+regards+of+God%E2%80%99s+Covenant%3B+though+they+were+not%3B+but+that+difference+is+made+by+God.%0A%0AAbraham+does+not+on+his+own+head%2C+and+by+his+own+will%2C+put+Ishmael+out+of+the+church%2C+which+was+his+family.+But+God+bids+him+put+him+out%2C+and+then+he+put+him+out%2C+and+not+before+till+such+time+he+kept+him+in%2C+and+held+him+to+be+within+the+covenant%2C+as+well+as+Isaac+was.+Even+so+must+we+deal+towards+those+that+live+in+the+church%3B+secret+judgment+must+be+left+to+God%3B+and%2C+till+God+manifest+the+contrary%2C+in+the+judgment+of+charity%2C+we+must+hold+them+all+elect.%0A%0AThis+is+the+practice+of+Saint+Paul+in+all+his+epistles.+Writing+to+Corinth%2C+he+calls+them+%E2%80%9Call+sanctified%E2%80%9D+%281+Cor.+1%3A2%29%3B+and+to+the+Galatians+%281%3A2%29%2C+he+calls+them+%E2%80%9Call+elect%E2%80%9D+%E2%80%93+speaking+so+in+the+judgment+of+charity%2C+although+he+knew+that+among+them+there+were+many+profane+and+wicked+men%2C+and+though+he+reprove+many+great+errors+and+heinous+sins+amongst+them.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Cloud+of+Faithful+Witnesses%2C+Leading+to+the+Heavenly+Canaan%3A+Or%2C+A+Commentary+upon+the+11th+Chapter+to+the+Hebrews%2C+%281609%29+in+The+Works+of+William+Perkins%3A+Volume+3%2C+eds+Randall+J.+Pederson+and+Ryan+M.+Hurd+%28Grand+Rapids%3A+Reformation+Heritage+Books%2C+2017%29%2C+pp+235-37.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F73eb21e456.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/73eb21e456.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/25/william-perkins-on-the-covenant-election-and-the-visible-church/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Thesis 3. Many, being scrupulous, have erred with the term “predestination,” arguing it denotes election alone and is spoken just about good things—this despite the fact the Holy Spirit used the same term in speaking about evil things (Acts 4:23). This is because predestination of a thing is the determination of it to its end. But these people deny this is the sort of end that is the destruction of the reprobate (seeing that such is an evil thing) and further that the term “predestination” is applied wrongly to them. Answer. Though we concede it is indeed an evil thing with respect to those reprobate, still, with respect to God reprobating, which is their final destruction or end, he without doubt intends the declaration of his righteousness and power (Prov. 16:4; Rom. 9:17, 21–22). …

Thesis 8. The means tending to this end are effectual calling, justification, and sanctification, and the opposite for the reprobate: the privation of effectual grace, continuation in the state of condemnation, and just blinding and hardening, all which presuppose the Fall and condition of sin. We will deal with all this further in what follows.

Thesis 9. So, our adversaries charge us falsely that we establish predestination absolute in every way, because we say it is only absolute with respect to the impelling cause existing in man, or a cause differing from God’s good pleasure. This is because, if it were some impulsive cause that moved God toward this or that thing about to be done, thus God would be the cause who depends with respect to that cause by which he is moved. This is absurd. Furthermore, predestination is not absolutized from the end and means (as is clear in the preceding thoughts), because God, absolutely wise, wills nothing without an end. So he decreed to render sinners saved, so that he might manifest his grace in them with respect to his mercy, but to condemn the reprobate, so that he might manifest his glory in them under the concept of his justice. Nothing is without means. Thus, he decreed to save the faithful, but through and on account of Christ; and he decreed to condemn the reprobate, but on account of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Theological Disputation De Divina Hominum Praedestinatione</cite>, (1643), with Johannes Maccovius Presiding and Johannes Fridericus Herbst Responding’, trans. R. M. Hurd in Mid-America Journal of Theology, no. 30 (2019), pp 89, 90.</span></figcaption>

<blockquote><p>The Lutherans distinguish between a proper and an improper, or catachrestic, use of the term election: they state that if election is taken catachrestically for the beneficent will and general love of God toward all, or for the negation of the reprobating decree, or for the decree of God to create all in Adam for eternal life and to renew all in Christ to eternal life, or for the offering, common to all, of the means of salvation, then, they say, We easily concede that election can be spoken of as universal, but in its meaning that is proper and conformed to the Scriptures, we deny (they say) that election is universal.

Then they also say that the counsel of God concerning the salvation of men can be regarded as in either his antecedent will or his consequent will; in the prior respect the counsel is universal; however, in the latter respect it is particular, on account of the foreseen final unbelief of certain persons. So then they construct a universal predestination upon this threefold fulcrum: (1) a universal will in God to save all, (2) a universal redemption through Christ, and (3) a universal calling; yet not all are saved through this universal predestination, because they do not will to believe. See Johann Gerhard, Loci Theologici (tome 2, ch. 10, concerning election and reprobation) and [Matthias] Hafenreffer, Loci Communes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology. Volume 3: The Works of God and the Fall of Man</cite>, trans. Todd M. Rester, eds Joel R. Beeke and Michael T. Spangler (1682; Grand Rapids MI: Reformation Heritage Books, 2021), Book 3.3.16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election.html">Election</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Lutherans distinguish between a proper and an improper, or catachrestic, use of the term election: they state that if election is taken catachrestically for the beneficent will and general love of God toward all, or for the negation of the reprobating decree, or for the decree of God to create all in Adam for eternal life and to renew all in Christ to eternal life, or for the offering, common to all, of the means of salvation, then, they say, We easily concede that election can be spoken of as universal, but in its meaning that is proper and conformed to the Scriptures, we deny (they say) that election is universal.

Then they also say that the counsel of God concerning the salvation of men can be regarded as in either his antecedent will or his consequent will; in the prior respect the counsel is universal; however, in the latter respect it is particular, on account of the foreseen final unbelief of certain persons. So then they construct a universal predestination upon this threefold fulcrum: (1) a universal will in God to save all, (2) a universal redemption through Christ, and (3) a universal calling; yet not all are saved through this universal predestination, because they do not will to believe. See Johann Gerhard, Loci Theologici (tome 2, ch. 10, concerning election and reprobation) and [Matthias] Hafenreffer, Loci Communes.”

— Petrus van Mastricht, Theoretical-Practical Theology. Volume 3: The Works of God and the Fall of Man, trans. Todd M. Rester, eds Joel R. Beeke and Michael T. Spangler (1682; Grand Rapids MI: Reformation Heritage Books, 2021), Book 3.3.16.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Lutherans+distinguish+between+a+proper+and+an+improper%2C+or+catachrestic%2C+use+of+the+term+election%3A+they+state+that+if+election+is+taken+catachrestically+for+the+beneficent+will+and+general+love+of+God+toward+all%2C+or+for+the+negation+of+the+reprobating+decree%2C+or+for+the+decree+of+God+to+create+all+in+Adam+for+eternal+life+and+to+renew+all+in+Christ+to+eternal+life%2C+or+for+the+offering%2C+common+to+all%2C+of+the+means+of+salvation%2C+then%2C+they+say%2C+We+easily+concede+that+election+can+be+spoken+of+as+universal%2C+but+in+its+meaning+that+is+proper+and+conformed+to+the+Scriptures%2C+we+deny+%28they+say%29+that+election+is+universal.%0A%0AThen+they+also+say+that+the+counsel+of+God+concerning+the+salvation+of+men+can+be+regarded+as+in+either+his+antecedent+will+or+his+consequent+will%3B+in+the+prior+respect+the+counsel+is+universal%3B+however%2C+in+the+latter+respect+it+is+particular%2C+on+account+of+the+foreseen+final+unbelief+of+certain+persons.+So+then+they+construct+a+universal+predestination+upon+this+threefold+fulcrum%3A+%281%29+a+universal+will+in+God+to+save+all%2C+%282%29+a+universal+redemption+through+Christ%2C+and+%283%29+a+universal+calling%3B+yet+not+all+are+saved+through+this+universal+predestination%2C+because+they+do+not+will+to+believe.+See+Johann+Gerhard%2C+Loci+Theologici+%28tome+2%2C+ch.+10%2C+concerning+election+and+reprobation%29+and+%5BMatthias%5D+Hafenreffer%2C+Loci+Communes.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical-Practical+Theology.+Volume+3%3A+The+Works+of+God+and+the+Fall+of+Man%2C+trans.+Todd+M.+Rester%2C+eds+Joel+R.+Beeke+and+Michael+T.+Spangler+%281682%3B+Grand+Rapids+MI%3A+Reformation+Her

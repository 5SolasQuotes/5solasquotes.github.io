</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17e49246e4" data-kw="">
<blockquote><p>Objection 1 [of Saltmarsh, an Antinomian]: ‘Christ is not ours by any act of our own, but by an infinite act of God’s imputing his righteousness. Therefore, Christ is not ours by faith.’ [Rutherford’s] Answer: Christ is not ours, by any act of our own, as by a ransom, a meritorious and principal cause. [This is] True, therefore [Saltmarsh concludes], [Christ is] not [ours] by faith, as a condition knowing, apprehending, feeling, applying, receiving, [and] opening the everlasting doors, that the King of glory may enter in. It’s false [that is, Saltmarsh’s inference]. So bread is ours only by an omnipotent act of Him that causes the earth to bring forth, as by the first principal and effectual cause: Therefore [Saltmarsh would conclude], bread is not our’s in a civil way, by plowing, sowing, earing, and in a spiritual way, by laying hold by faith on the Covenant, in which the world, the things of this life, are made ours (1 Cor. 3:21); this is a lax and vain consequence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Survey of Spiritual Antichrist, Pt. 2</cite>, ch. 61, ‘How Faith Justifies…’, p. 108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-4dff76414d" data-kw="">
<blockquote><p>A threefold being is usually distinguished: of essence, of existence, and of subsistence… Therefore, concerning this being of existence, the present question is whether in Christ there is one existence of the divine nature and another of the human nature, or rather there is only a single being of existence, namely the uncreated existence of the Word itself, by which the assumed humanity is also said to exist… In this controversy there are two opposed opinions. The first is common in the school of Thomists, denying that in the humanity of Christ there is any created existence, and affirming that by union it was assumed not only to the subsistence of the Word but also to existence… And so the Thomists commonly teach in the cited place: Cajetan, Capreolus, Ferrara, Medina, Cabrera, Alvarez, and other notable followers of the same school. The opposed opinion is common outside the school of St. Thomas, affirming that the assumed humanity has its own created existence by which it exists. For although it was assumed to the subsistence of the Word, nevertheless [it was] not [assumed] to [his] existence. So Scotus holds (Ordinatio 3, d. 6, q. 1), St. Bonaventure (Sent. 3, d. 5, a. 3, q. 3), and the Scotists commonly follow, and all the more recent [theologians], some of whom strive to benignly interpret St. Thomas and draw him into this opinion as well.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bartolomeo-mastrius.html">Bartolomeo Mastrius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, bk. 3, Of the Incarnation of the Lord (d. 1673), Disputation 1 tr. by AI by OmegaPoint99 | quest. 6, ‘Whether the human nature in Christ has its own existence, or rather exists by the existence of the Word’ 140 | art. 1, Resolution of the question 141 art. 2, The foundations of the opposing opinion are overthrown 152-58, pp. 140-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

<main class="wrap"><figure class="quote" id="q-7dfe8ecde9" data-kw="">
<blockquote><p>We remember, several years ago, when the question of slavery was keenly agitated, that it was a favourite argument of the upholders of that nefarious traffic, that the slaves in many of the plantations were more comfortably provided for than our operatives at home; that they were very kindly used by their masters, and had, personally, no desire to be liberated. In urging this argument, they altogether forgot or overlooked that the main question was, not whether the slaves were ill-treated, but whether it was right in man to hold property in his fellow-men. So it is in the consideration of the question of Patronage.

We are apt some times to forget that the main question is, not the abuse of power on the part of the patron, in presenting to the Church unworthy and graceless ministers, but the propriety of his possessing such a power at all. It is true that had patrons always exercised their power judiciously, and for the ends for which it is alleged to have been entrusted to them, it might have been very difficult to awaken a general and deep-felt interest in the mere abstract question. The mass of mankind are more easily and universally moved by a felt grievance and the prospect of redress, than by the simple exhibition of truth; and had all our patrons been men of the character described in the above quotation, it might not have been very easy to induce the people to make a united and determined stand against Patronage.

We might have expected, and, no doubt, would have obtained, better results under such a restricted system of Patronage, just as the slaves of a benevolent proprietor would experience the fruits of his kindness and care. But except in this single thing, that we might expect a Christian patron to make conscience of the exercise of his power, does it differ in any respect from the system under which the Church now groans? The thing objected against, is not so much the way in which Patronage has been exercised, as the nature of the power which is implied in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-wilson.html">William Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Scriptural Argument Against Patronage</cite>, (Edinburgh: John Johnstone, 1842), p. 24.</span></figcaption>

</figure><figure class="quote" id="q-b03d8f1c66" data-kw="">
<blockquote><p>The demand was of the same man, who formerly did lawfully preach in a public assembly, if he should [now] obtain a license from the Lord bishop of the diocesse, without any unlawful condition for to continue in that his course [of public preaching], whether that leave or licence given does pollute the actions, seeing a man may ask leave of the great Turk to preach the gospel within his dominions? His [John Robinson’s] answer is that the very obtaining and receiving of such a license is unlawful, because it is a real acknowledgement that such a bishop has a lawful power to grant it. Which [in my judgment] is neither so nor so, for:

1. The asking and receiving of leave or license (which are both one) does not always imply an acknowledgement of his lawful authority from whom it is sought. If any man of violence shall usurp a power to himself, of permitting or hindering the lawful and good offices that pertain unto honest men, so that without his licence a man could not buy or sell, or teach any science or trade of life; if an honest man whom these duties concern, should in that case take a licence from that usurper (though he were no better then a strong theif) no reasonable man will say that in so doing he did acknowledge such usurped power lawful. The rulers of Jewish synagoges had no lawful power over the apostles of Christ in any part of their ministery, neither would Paul ever acknowledge so much: yet he and Barnabas accepted of such license or leave from them sometime as they did usually grant unto those that acknowledged themselves lawfully subject to their authority. See an example, Acts 13:15. Mr. Robinson himself has granted in the first demand that a man may preach by leave in a parochial assembly: which leave must be given by the parochial minister and church-wardens, whose authority he holds one with the bishops. If therefore leave or license (whether in word or writing, that is all one) may be lawfully taken from them, without acknowledging any authority lawful which is unlawful, why not from the bishop?

2. There is some authority in the bishops derived from the king which may be acknowledged lawful. Such is this of giving license, liberty and civil authority for men to do good. The civil magistrate may do it himself, or appoint others to do it, 2 Chron. 17:7. The abuse of this authority does not make it unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-3eb9fdb2ac" data-kw="">
<blockquote><p>Whether by ‘the sinful evil of those corruptions, in the public worship and government of this Church,’ you [Independent divines at Westminster] understand… the Book of Common Prayer, the entrance into our ministry by ordination of bishops and living under the episcopal government?… Now if you mean… [this], that which usually was called, Old conformity, in opposition to the New [under Archbishop Laud]: So I deny that all do now generally acknowledge and decry that as sinfully evil; which appears thus: Because that remonstrance presented to the House of Commons in the beginning of the Parliament, subscribed by many hundred godly ministers, conformists, and non-conformists for reformation in worship, doctrine, government and discipline: The government, worship and ceremonies were impleaded, in respect of many inconveniences and evil consequents; but petitioning against them as sinfully evil and absolutely unlawful was declined: And there are many parliament men and ministers who have a great zeal to the present reformation in casting out the hierarchy and ceremonies, who are not yet convinced that all their former practice in the way of old conformity was sinful: But as those times were, do judge they did lawfully continue their standing in their places and in this Church: much less are they satisfied that either Episcopal government, or the Liturgy were sufficient grounds of forsaking our public assemblies and erecting new. Amongst a cloud of learned and godly men, take the testimony of Gerson Bucerus in his learned answer to Doctor Downame (Dissert. de Guber. Eccl., p. 620), who for the point of Episcopacy allows not of schism in the Church, but vindicates himself and others who keep within the bounds of his opinion from being guilty in that kind. Which answer… is not here given by me in the least to plead for the hierarchy, ceremonies or present Liturgy (for I heartily desire their removal), but only to show the Apologists’ mistake in asserting that all do now so generally acknowledge and decry them as sinfully evil… We [be] as much abhorring bowing to altars, publishing the Declaration for Sports, etc. as you: and witnessing more frequently against them in our ministry than some of you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times</cite>, (London: G.M., 1644), pp. 15-16</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Whether by ‘the sinful evil of those corruptions, in the public worship and government of this Church,’ you [Independent divines at Westminster] understand… the Book of Common Prayer, the entrance into our ministry by ordination of bishops and living under the episcopal government?… Now if you mean… [this], that which usually was called, Old conformity, in opposition to the New [under Archbishop Laud]: So I deny that all do now generally acknowledge and decry that as sinfully evil; which appears thus: Because that remonstrance presented to the House of Commons in the beginning of the Parliament, subscribed by many hundred godly ministers, conformists, and non-conformists for reformation in worship, doctrine, government and discipline: The government, worship and ceremonies were impleaded, in respect of many inconveniences and evil consequents; but petitioning against them as sinfully evil and absolutely unlawful was declined: And there are many parliament men and ministers who have a great zeal to the present reformation in casting out the hierarchy and ceremonies, who are not yet convinced that all their former practice in the way of old conformity was sinful: But as those times were, do judge they did lawfully continue their standing in their places and in this Church: much less are they satisfied that either Episcopal government, or the Liturgy were sufficient grounds of forsaking our public assemblies and erecting new. Amongst a cloud of learned and godly men, take the testimony of Gerson Bucerus in his learned answer to Doctor Downame (Dissert. de Guber. Eccl., p. 620), who for the point of Episcopacy allows not of schism in the Church, but vindicates himself and others who keep within the bounds of his opinion from being guilty in that kind. Which answer… is not here given by me in the least to plead for the hierarchy, ceremonies or present Liturgy (for I heartily desire their removal), but only to show the Apologists’ mistake in asserting that all do now so generally acknowledge and decry them as sinfully evil… We [be] as much abhorring bowing to altars, publishing the Declaration for Sports, etc. as you: and witnessing more frequently against them in our ministry than some of you.”

— Thomas Edwards, Antapologia, or, A Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge, members of the Assembly of Divines wherein is Handled Many of the Controversies of These Times, (London: G.M., 1644), pp. 15-16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhether+by+%E2%80%98the+sinful+evil+of+those+corruptions%2C+in+the+public+worship+and+government+of+this+Church%2C%E2%80%99+you+%5BIndependent+divines+at+Westminster%5D+understand%E2%80%A6+the+Book+of+Common+Prayer%2C+the+entrance+into+our+ministry+by+ordination+of+bishops+and+living+under+the+episcopal+government%3F%E2%80%A6+Now+if+you+mean%E2%80%A6+%5Bthis%5D%2C+that+which+usually+was+called%2C+Old+conformity%2C+in+opposition+to+the+New+%5Bunder+Archbishop+Laud%5D%3A+So+I+deny+that+all+do+now+generally+acknowledge+and+decry+that+as+sinfully+evil%3B+which+appears+thus%3A+Because+that+remonstrance+presented+to+the+House+of+Commons+in+the+beginning+of+the+Parliament%2C+subscribed+by+many+hundred+godly+ministers%2C+conformists%2C+and+non-conformists+for+reformation+in+worship%2C+doctrine%2C+government+and+discipline%3A+The+government%2C+worship+and+ceremonies+were+impleaded%2C+in+respect+of+many+inconveniences+and+evil+consequents%3B+but+petitioning+against+them+as+sinfully+evil+and+absolutely+unlawful+was+declined%3A+And+there+are+many+parliament+men+and+ministers+who+have+a+great+zeal+to+the+present+reformation+in+casting+out+the+hierarchy+and+ceremonies%2C+who+are+not+yet+convinced+that+all+their+former+practice+in+the+way+of+old+conformity+was+sinful%3A+But+as+those+times+were%2C+do+judge+they+did+lawfully+continue+their+standing+in+their+places+and+in+this+Church%3A+much+less+are+they+satisfied+that+either+Episcopal+government%2C+or+the+Liturgy+were+sufficient+grounds+of+forsaking+our+public+assemblies+and+erecting+new.+Amongst+a+cloud+of+learned+and+godly+men%2C+take+the+testimony+of+Gerson+Bucerus+in+his+learned+answer+to+Doctor+Downame+%28Dissert.+de+Guber.+Eccl.%2C+p.+620%29%2C+who+for+the+point+of+Episcopacy+allows+not+of+schism+in+the+Church%2C+but+vindicates+himself+and+others+who+keep+within+the+bounds+of+his+opinion+from+being+guilty+in+that+kind.+Which+answer%E2%80%A6+is+not+here+given+by+me+in+the+least+to+plead+for+the+hierarchy%2C+ceremonies+or+present+Liturgy+%28for+I+heartily+desire+their+removal%29%2C+but+only+to+show+the+Apologists%E2%80%99+mistake+in+asserting+that+all+do+now+so+generally+acknowledge+and+decry+them+as+sinfully+evil%E2%80%A6+We+%5Bbe%5D+as+much+abhorring+bowing+to+altars%2C+publishing+the+Declaration+for+Sports%2C+etc.+as+you%3A+and+witnessing+more+frequently+against+them+in+our+ministry+than+some+of+you.%E2%80%9D%0A%0A%E2%80%94+Thomas+Edwards%2C+Antapologia%2C+or%2C+A+Full+Answer+to+the+Apologetical+Narration+of+Mr.+Goodwin%2C+Mr.+Nye%2C+Mr.+Sympson%2C+Mr.+Burroughs%2C+Mr.+Bridge%2C+members+of+the+Assembly+of+Divines+wherein+is+Handled+Many+of+the+Controversies+of+These+Times%2C+%28London%3A+G.M.%2C+1644%29%2C+pp.+15-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3eb9fdb2ac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3eb9fdb2ac.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=Whether%20by%20%E2%80%98the%20sinful%20evil%20of,our%20ministry%20than%20some%20of%20you&amp;text=Whether%20by%20%E2%80%98the%20sinful%20evil%20of%20those%20corruptions&amp;text=them%20in%20our%20ministry%20than%20some%20of%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…for the key of knowledge and the power of pastoral preaching is given, uni subjective, non unitati nisi objective, ‘to one man as to the subject,’ and to the Church, for her salvation and good, as for the end and object; and the pastor being once ordained a pastor, may use these keys, quoad specificationem, independently, for he may preach mercy and wrath, not waiting the Church’s suffrages. Et potestas clavium quoad jurisdictionem data est ecclesiae et subjective et objective, et data est non uni, sed unitati: ‘but the power of the keys,’ in censures, for binding and loosing ‘is given to no one mortal man, but to the Church, both as to the subject, and the object.’ I mean the ministerial Church; and not one man pastor, Pope, or prelate may use the keys; the Church has them and can only validly use them.</p></blockquote>

<blockquote><p>From both the faculty of perceiving and of desiring arises then free choice, which is nothing other than the faculty of acting from counsel or rational complacency. It can admit a certain natural indifference, in the divided sense (as they say), but it by no means consists in indifference.</p></blockquote>

<blockquote><p>5. In what sense is this inability absolute, and in what sense natural, and in what sense moral? … 4th. It is not natural in another sense, because it does not result in the least from any constitutional deficiency in human nature as it now exists as to its rational and moral faculties of soul. 5th. This inability is purely moral, because while every responsible man possess all moral as well as intellectual faculties requisite for right action, the moral state of his faculties is such that right action is impossible. Its essence is in the inability of the soul to know, love, or choose spiritual good, and its ground exists in that moral corruption of soul whereby it is blind, insensible, and totally averse to all that is spiritually good.</p></blockquote>

<blockquote><p>XXIII. The mode by which God acts in efficacious vocation having now been explained, it remains for us to see how man conducts himself toward it. Here, there can be a twofold notion of man, as he is considered either in the first act of conversion or in the second act. Considered in the former, he behaves purely passively toward the efficacy of his vocation, contributing nothing as such, only receiving what is impressed upon him from elsewhere. XXIV. In the second act, however, there is some operation of man, and here he also performs his parts, so that he himself acts, believes, and wills rightly; yet in such a way that he perfects all these things in the virtue of the Holy Spirit as the principal mover. He indeed moves himself, but as one who has been moved, and thus he receives all good inclinations from Him, by which he is active (Phil. 2:12-13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), p. 5</span></figcaption>

</figure><figure class="quote" id="q-8809663922" data-kw="">
<blockquote><p>§IX. As for what regards the definition of free will; the scholastics, at least the later ones, both the Thomists and the Scotists; also the Greeks, Lutherans, and Remonstrants, and not a few of the Reformed, define free will as the power or faculty by which, with all things requisite for acting being posited, the will can act or not act, this or that, and act otherwise. Some of the Reformed, however, define free will by rational preference, by which man does what he pleases, with a preceding judgment of reason. [e.g. Turretin] But many other of the Reformed—Francis Junius, Gerhard Johann Voss, Davenant, Johann and Louis Crocius, Louis le Blanc, William Ames, Robert Baron, Johann Strangius, Richard Baxter, D. Elias Grebenitz, D. Phil. Buchius, Dn. D. Samuel Strimesius, Pierre Jurieu—out of love for truth, antiquity and ecclesiastical peace, have preferred to retain that old and accustomed definition of free will; because it, in itself, and viewed without the abuse of the Pelagians and Semi-Pelagians, contains nothing evil or inconvenient. Following their moderation, we (with the principle always being saved, from whence free will receives or has its powers, and the mode of operation of divine grace) define free will thus: Free will is the active faculty of the will, by which the will, with all things requisite for acting being posited, can act or not act, this or that, and act otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfuz.html">Barthold Holtzfuz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on the Free Will of Man’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707) 25 pp. Latin, p. 7</span></figcaption>

</figure><figure class="quote" id="q-55623a345b" data-kw="">
<blockquote><p>For because He executes some things by general and common operation in Nature, other things by particular and proper action in the Church, hence works are accustomed to be distinguished into those of Nature and of Grace. They are not, however, called ‘works of nature’ as if God works them by nature, seeing that outside Himself He acts not by necessity of nature but by the liberty of His will, Ps. 115:3; Eph. 1:11. Now the works of Nature are the works of Creation, Conservation, and Governance. For these proceed from God’s common action, Gen. 1 throughout; Mt. 5:45; Acts 17:24ff., are occupied in common nature, and constitute the common principles of natural things. Which is the cause why in order of explication they are premised to the works of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg</cite>, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

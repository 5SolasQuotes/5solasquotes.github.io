<blockquote><p>Remedy (2). Seriously to consider, That the giving way to a less sin makes way for the committing of a greater. He that, to avoid a greater sin, will yield to a lesser, ten thousand to one but God in justice will leave that soul to fall into a greater. If we commit one sin to avoid another, it is just we should avoid neither, we having not law nor power in our own hands to keep off sin as we please; and we, by yielding to the lesser, do tempt the tempter to tempt us to the greater. Sin is of an encroaching nature; it creeps on the soul by degrees, step by step, till it hath the soul to the very height of sin.

David gives way to his wandering eye, and this led him to those foul sins that caused God to break his bones, and to turn his day into night, and to leave his soul in great darkness. Jacob and Peter, and other saints, have found this true by woful experience, that the yielding to a lesser sin hath been the ushering in of a greater. The little thief will open the door, and make way for the greater, and the little wedge knocked in will make way for the greater. Satan will first draw thee to sit with the drunkard, and then to sip with the drunkard, and then at last to be drunk with the drunkard. He will first draw thee to be unclean in thy thoughts, and then to be unclean in thy looks, and then to be unclean in thy words, and at last to be unclean in thy practices.

He will first draw thee to look upon the golden wedge, and then to like the golden wedge, and then to handle the golden wedge, and then at last by wicked ways to gain the golden wedge, though thou runnest the hazard of losing God and thy soul for ever; as you may see in Gehazi, Achan, and Judas, and many in these our days. Sin is never at a stand: Ps. i. 1, first ungodly, then sinners, then scorners. Here they go on from sin to sin, till they come to the top of sin, viz. to sit in the seat of scorners, or as it is in the Septuagint … to affect the honour of the chair of pestilence.

Austin [Augustine of Hippo], writing upon John, tells a story of a certain man, that was of an opinion that the devil did make the fly, and not God. Saith one to him, If the devil made flies, then the devil made worms, and God did not make them, for they are living creatures as well as flies. True, said he, the devil did make worms. But, said the other, if the devil did make worms, then he made birds, beasts, and man. He granted all. Thus, saith Austin, by denying God in the fly, became to deny God in man, and to deny the whole creation.

By all this we see, that the yielding to lesser sins, draws the soul to the committing of greater. Ah! how many in these days have fallen, first to have low thoughts of Scripture and ordinances, and then to slight Scripture and ordinances, and then to make a nose of wax of Scripture and ordinances, and then to cast off Scripture and ordinances, and then at last to advance and lift up themselves, and their Christ-dishonouring and soul-damning opinions, above Scripture and ordinances. Sin gains upon man’s soul by insensible degrees: Eccles. x. 13, ‘The beginning of the words of his mouth is foolishness, and the end of his talking is mischievous madness.’

Corruption in the heart, when it breaks forth, is like a breach in the sea, which begins in a narrow passage, till it eat through, and cast down all before it. The debates of the soul are quick, and soon ended, and that may be done in a moment that may undo a man for ever. When a man hath begun to sin, he knows not where, or when, or how he shall make a stop of sin. Usually the soul goes on from evil to evil, from folly to folly, till it be ripe for eternal misery. Men usually grow from being naught to be very naught, and from very naught to be stark naught, and then God sets them at nought for ever.</p></blockquote>

<blockquote><p>Question 1. Whether in a good or evil act there be necessarily required an inclination of the will? 1st Answer. First, the will is the principle and the first cause of all human operation in regard of the exercise of the act. For we therefore do this or that rather than another thing, because we will; As God Himself is said to do all things of his own Will, Eph. 1:11. So also does man who is made after the Image of God. The first cause therefore of the goodness or sinfulness of any act of man, is in the will.

2. Secondly, liberty also of election is formally in the will: that therefore anyone does yield obedience to God, or refuses to do so, proceeds from the will.

3. Lastly, our obedience stands in our conformity to the Will of God, and the disobedience, in our unconformity thereunto. Now our conformity with the Will of God is first and principally in our will, Apoc. 2:6.</p></blockquote>

<blockquote><p>OUR Lord and King JESUS CHRIST, when he was now about to go unto his Father, and desirous to leave unto those whom he loved, some excellent benefit, (a benefit then which the earth cannot yield a greater,) he left them Peace: Peace at his death as a Legacy, he bequeathed them: My Peace (saith he) I leave unto you, my Peace I give unto you; for neither could men wish from heaven a greater blessing, neither could the Angels declare unto men from heaven a more welcome message, then Glory in heaven, and Peace in earth.

This Bond, by which heaven unto earth, and earth unto heaven reciprocally is united, hath so straitly bound the heart of the King’s Majesty of great Britain [James I], that according to the exceeding care which he hath evermore had of the safe-guard and defence of true Religion, of settling Peace and Concord amongst Christian Princes throughout the world; but especially, Most Illustrious, Noble, and Magnificent Lords, of procuring the good and tranquillity of this your State, to which he acknowledges his Kingdom to be linked by the Tie of an ancienter and straiter League: He hath sent us hither with this especial charge, that as much as in us lies, we procure your prosperity, and your Churches Peace.

Certainly, an exceeding desire of Peace &amp; the public good, possest his Princely heart, when he commended unto your Lordships the care of Religion.

This his Majesty’s provident care can never be unwelcome, if it may please your Lordships, according to your Wisdom and Piety, to recount the benefit of the reformed Religion, and the blessings of God’s favour, which like showers from heaven, have watered your Provinces far &amp; near. I suppose, it cannot be unknown unto your Lordships, what &amp; how much you owe to true Religion.

Religion it was, which from blood and tempest reduced your State to these flourishing days of quietness and Sun-shine. Religion it was, which first begat, then enlarged, and finally established your prosperity. Let your Lordships now consider with your selves, what you will repay unto Christ for all these blessings. Of your Lordships, Christ, who is King of Kings, and Lord of Lords, requires this, that for and above all his other benefits, you preserve the Peace which he bequeathed you.</p></blockquote>

— George Carleton, An oration made at the Hauge, before the Prince of Orange and the assembly of the high and mighty lords, the States General of the United Provinces: by the reverend father in God, the Lord Bishop of Llandaff, one of the commissioners sent by the King’s most excellent Majesty to the Synod of Dort, (London: Ralph Rounthwait, 1619), pp 1-3.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COUR+Lord+and+King+JESUS+CHRIST%2C+when+he+was+now+about+to+go+unto+his+Father%2C+and+desirous+to+leave+unto+those+whom+he+loved%2C+some+excellent+benefit%2C+%28a+benefit+then+which+the+earth+cannot+yield+a+greater%2C%29+he+left+them+Peace%3A+Peace+at+his+death+as+a+Legacy%2C+he+bequeathed+them%3A+My+Peace+%28saith+he%29+I+leave+unto+you%2C+my+Peace+I+give+unto+you%3B+for+neither+could+men+wish+from+heaven+a+greater+blessing%2C+neither+could+the+Angels+declare+unto+men+from+heaven+a+more+welcome+message%2C+then+Glory+in+heaven%2C+and+Peace+in+earth.%0A%0AThis+Bond%2C+by+which+heaven+unto+earth%2C+and+earth+unto+heaven+reciprocally+is+united%2C+hath+so+straitly+bound+the+heart+of+the+King%E2%80%99s+Majesty+of+great+Britain+%5BJames+I%5D%2C+that+according+to+the+exceeding+care+which+he+hath+evermore+had+of+the+safe-guard+and+defence+of+true+Religion%2C+of+settling+Peace+and+Concord+amongst+Christian+Princes+throughout+the+world%3B+but+especially%2C+Most+Illustrious%2C+Noble%2C+and+Magnificent+Lords%2C+of+procuring+the+good+and+tranquillity+of+this+your+State%2C+to+which+he+acknowledges+his+Kingdom+to+be+linked+by+the+Tie+of+an+ancienter+and+straiter+League%3A+He+hath+sent+us+hither+with+this+especial+charge%2C+that+as+much+as+in+us+lies%2C+we+procure+your+prosperity%2C+and+your+Churches+Peace.%0A%0ACertainly%2C+an+exceeding+desire+of+Peace+%26+the+public+good%2C+possest+his+Princely+heart%2C+when+he+commended+unto+your+Lordships+the+care+of+Religion.%0A%0AThis+his+Majesty%E2%80%99s+provident+care+can+never+be+unwelcome%2C+if+it+may+please+your+Lordships%2C+according+to+your+Wisdom+and+Piety%2C+to+recount+the+benefit+of+the+reformed+Religion%2C+and+the+blessings+of+God%E2%80%99s+favour%2C+which+like+showers+from+heaven%2C+have+watered+your+Provinces+far+%26+near.+I+suppose%2C+it+cannot+be+unknown+unto+your+Lordships%2C+what+%26+how+much+you+owe+to+true+Religion.%0A%0AReligion+it+was%2C+which+from+blood+and+tempest+reduced+your+State+to+these+flourishing+days+of+quietness+and+Sun-shine.+Religion+it+was%2C+which+first+begat%2C+then+enlarged%2C+and+finally+established+your+prosperity.+Let+your+Lordships+now+consider+with+your+selves%2C+what+you+will+repay+unto+Christ+for+all+these+blessings.+Of+your+Lordships%2C+Christ%2C+who+is+King+of+Kings%2C+and+Lord+of+Lords%2C+requires+this%2C+that+for+and+above+all+his+other+benefits%2C+you+preserve+the+Peace+which+he+bequeathed+you.%E2%80%9D%0A%0A%E2%80%94+George+Carleton%2C+An+oration+made+at+the+Hauge%2C+before+the+Prince+of+Orange+and+the+assembly+of+the+high+and+mighty+lords%2C+the+States+General+of+the+United+Provinces%3A+by+the+reverend+father+in+God%2C+the+Lord+Bishop+of+Llandaff%2C+one+of+the+commissioners+sent+by+the+King%E2%80%99s+most+excellent+Majesty+to+the+Synod+of+Dort%2C+%28London%3A+Ralph+Rounthwait%2C+1619%29%2C+pp+1-3.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8ab1d59268.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8ab1d59268.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/13/george-carleton-on-the-need-for-the-states-general-of-the-united-provinces-to-care-for-true-religion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

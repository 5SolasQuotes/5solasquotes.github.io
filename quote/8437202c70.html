<blockquote><p>V. Christ used bread because with the divine blessing it is of all the elements the most efficacious for nourishing and strengthening the body; the most common, the most familiar and to be found everywhere, easily prepared and the most pleasant. However, the bread he used was unleavened; not from the necessity of the thing, but from an accidental circumstance of time, on account of the feast of the Passover, in which it was lawful neither to use nor to have any other (Ex. 12:19). Otherwise it was always fermented in Judea (whenever the Supper was celebrated outside of that time, Acts 2:42) as well as among the Gentiles (who used common and not unleavened bread). Hence it was called simply the “breaking of bread” (Acts 20:7; 1 Cor. 10:16; 11:26, 27). So that here so fierce a dispute on this subject falsely sprang up between the Greeks and Latins; the Greeks pressing the necessity of leavened, the latter of unleavened bread. The former were called “fermentarians” and the latter “azymites.” The thing is in itself indifferent (as many of the Romanists acknowledge); on account of which the peace of the church ought not to be disturbed, but it should be left to their freedom (as it is evident that both the ancient and also the modern uses vary). We do not deny that the use of fermented bread seems to us the more suitable, both because it is more in accordance with the design of Christ (which was to use common and ordinary bread, which is everywhere to be found); and because it is more appropriate to sustain the sacramental analogy (which consists in signifying our communion with Christ by the similitude of bodily nourishment); and because the necessity of unleavened bread belongs to the Jewish ceremonies (which are abrogated and cannot be retained without a certain affectation [kakozēlia] of Judaism); and because in the whole ancient church no traces appear of the common use of unleavened bread in the Eucharist before the ninth or tenth century. Yea, it is evident that the Eucharistic symbols were formerly taken from the offerings of bread and wine made by believers, which were undoubtedly of ordinary and fermented bread (as the Jesuit James Sirmondus, “Disquisitio de Azymo,” Opera Varia [1696], 4:513–30, candidly acknowledges and solidly confirms by many arguments). The example of Christ neither can nor ought to be made an objection here, because as we have said there was a peculiar reason which impelled him to the use of unleavened bread (which no longer exists). Therefore, his example binds us as to the essence of the thing itself, that we should do whatever he did (take, bless, and break the bread and other acts of this kind mentioned by the sacred writers); but not forthwith as to the particular circumstances, which do not belong to the thing. Suarez remarks: “An act of Christ alone is not sufficient to form a command; for although he consecrated in white wine, or at night, for example, he did not on that account command us so to consecrate” (3. Thom. de Sacra). Nor if unleavened cakes have a mystical signification, are they immediately of divine institution, since it is evident that the cause of the institution was the memory of the hasty departure from Egypt.</p></blockquote>

<blockquote><p>This communion and fellowship of man with God, was first founded on a covenant of works made with Adam in paradise. If he did obey, and did not eat of the forbidden fruit, he should have life both for himself and his posterity; the which covenant, because God would not have forgotten, he afterward renewed in the delivery of the ten commandments, requiring from man obedience to them in his own person, exactly, at all times, perpetually: promising life on the obedience, and threatening death and cursing if he continued not in everything the law required to do. But this fellowship being placed in man’s own freedom, and having so weak a foundation, he lost both himself and it, so that now by the first covenant of works, Adam and all his posterity are under a curse; for we cannot fulfill the law that requires personal obedience, perfect obedience, and exact obedience. He that ‘continues not in all is cursed,’ Gal. 3:10. The law then finds us dead and kills us. It finds us dead before, and not only leaves us dead still, but makes us more dead.</p></blockquote>

<blockquote><p>The Lord’s Supper is the other Sacrament of the New Testament; in which Christians that are of age, receive spiritually Christ’s body and blood sealed to them in the reception of Bread and Wine according to Christ’s institution. The Rules …

III. The outward matter thereof, or Signs, are Bread and Wine.

IV. The Supper is lame, without both Signs; and to rob the people of the Cup, is Sacrilege.

V. The inward matter is Christ, with all his satisfaction and merit.

VI. As it is Jewish superstition, to use unleavened Bread; so the Popish Penny-Wafers are superstitious relics.</p></blockquote>

<blockquote><p>23. In the words just recited, observe these four assertions of Cyril of Alexandria:

1. The flesh of Christ in the participants of the Eucharist is life-giving. (For those who approach unworthily do not partake of the flesh of Christ.)

2. This occurs not by the virtue of the flesh, as it is flesh, but by the virtue of the Deity with which this flesh is united in hypostasis. And the preservation of us and the wondrous effects related to the flesh are to be attributed to the glory of the Deity.

3. For the accomplishment of these things, the bodily presence of the flesh is neither required nor desired.

4. Christ, by the power of His Deity, accomplishes these things, being present with us through His ineffable Deity even though He has departed from us in the flesh.

24. Indeed, the power of Deity accomplishes that we can hold onto Him even when absent, by imitating faith in heaven. We partake of Him when absent by believing, as Augustine teaches. And even when absent in the flesh, He spiritually nourishes us with that same flesh, and His flesh becomes for us life-giving bread, as Cyril teaches here. For this spiritual nourishment is the operation of Deity and is not the least part of that preservation and those miraculous works, which Cyril says should be attributed not to the bodily presence of the flesh but to the glory of the Deity. Therefore, elsewhere, Cyril says the same: just as (he says) the root sends its quality to the branches, so the only-begotten Son of God, by giving the Spirit, bestows the affinity of the Father and His own nature (so to speak) on the saints connected to Him by faith and sanctity, nourishing them with piety and all kinds of virtue. He calls the Father the Farmer so that this might not seem to be the work of the Son alone, but rather a marvelous work of the entire Trinity. Therefore, He nourishes us with piety and faith through the Son in the Spirit, and the Farmer does the work, looking after and nurturing, and reducing everything to virtue, also through the Son in the Spirit. In my judgment, we understand this more correctly. Nor is this from the Father, nor that from the Son, nor both separated from the Spirit. For all things are from the Father through the Son in the Spirit. Neither will the Father be separated from cultivating us, nor will the Son be estranged from His care. Therefore, Christ holds the place of the vine, and we, hanging from it, draw the power and grace of the Spirit for our nourishment and spiritual fruit. This is what Cyril says in book 10 of the Gospel of John, chapter 13. Namely, as the Lord speaks in John, chapter 6, ‘It is the Spirit that gives life; the flesh is of no avail.’ The flesh of Christ is not life-giving from itself but by the power of the Deity dwelling corporeally within it. It is substantially life, and from itself, it gives life. He gave to the body in which He dwells the power of giving life, not by the confusion of the two natures in Christ or the operation of natural properties but by the hypostatic union of natures. So that the flesh of the Word becomes life-giving, for it is the flesh of God; and being spiritually united to this flesh, we are connected to God, and thus, being already connected to Him, we are infallibly given life: as Cyril teaches in book 4 of his Commentary on the Gospel of John, chapter 14, and the following chapters until the end of chapter 25, and in book 1, chapter 21. And the operation of Deity is so powerful that it unites us to His flesh by its consenting will, nourishes us, and allows us to draw from His fullness. Therefore, for the salutary eating of the flesh of Christ, the bodily presence of the flesh is not required with the one partaking, as we explained a little earlier from the same Cyril.

25. However, ignorantly or dishonestly, Bellarmine (in Book 2, On the Eucharist, chapter 25) abuses certain words of Cyril, attributing to them a meaning entirely alien to Cyril’s own mind, as if they favored transubstantiation and the bodily eating of the flesh of Christ. He first cites certain words from a letter of Cyril to Nestorius, intending to convey that Cyril meant nothing other than that the flesh of Christ, of which we are participants in the mysteries, is not common flesh, the mere flesh of a man or a sanctified man (as Nestorius deliriously claimed), but the proper flesh of the Word Himself. Read that letter of Cyril that contains twelve anathemas, and you will find nothing else there, not even in those very words that Bellarmine excerpts. Having discussed this at length, he promises us clearer passages from Cyril and adduces some from Cyril’s books on the Gospel of John, from which he draws three arguments.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“23. In the words just recited, observe these four assertions of Cyril of Alexandria:

1. The flesh of Christ in the participants of the Eucharist is life-giving. (For those who approach unworthily do not partake of the flesh of Christ.)

2. This occurs not by the virtue of the flesh, as it is flesh, but by the virtue of the Deity with which this flesh is united in hypostasis. And the preservation of us and the wondrous effects related to the flesh are to be attributed to the glory of the Deity.

3. For the accomplishment of these things, the bodily presence of the flesh is neither required nor desired.

4. Christ, by the power of His Deity, accomplishes these things, being present with us through His ineffable Deity even though He has departed from us in the flesh.

24. Indeed, the power of Deity accomplishes that we can hold onto Him even when absent, by imitating faith in heaven. We partake of Him when absent by believing, as Augustine teaches. And even when absent in the flesh, He spiritually nourishes us with that same flesh, and His flesh becomes for us life-giving bread, as Cyril teaches here. For this spiritual nourishment is the operation of Deity and is not the least part of that preservation and those miraculous works, which Cyril says should be attributed not to the bodily presence of the flesh but to the glory of the Deity. Therefore, elsewhere, Cyril says the same: just as (he says) the root sends its quality to the branches, so the only-begotten Son of God, by giving the Spirit, bestows the affinity of the Father and His own nature (so to speak) on the saints connected to Him by faith and sanctity, nourishing them with piety and all kinds of virtue. He calls the Father the Farmer so that this might not seem to be the work of the Son alone, but rather a marvelous work of the entire Trinity. Therefore, He nourishes us with piety and faith through the Son in the Spirit, and the Farmer does the work, looking after and nurturing, and reducing everything to virtue, also through the Son in the Spirit. In my judgment, we understand this more correctly. Nor is this from the Father, nor that from the Son, nor both separated from the Spirit. For all things are from the Father through the Son in the Spirit. Neither will the Father be separated from cultivating us, nor will the Son be estranged from His care. Therefore, Christ holds the place of the vine, and we, hanging from it, draw the power and grace of the Spirit for our nourishment and spiritual fruit. This is what Cyril says in book 10 of the Gospel of John, chapter 13. Namely, as the Lord speaks in John, chapter 6, ‘It is the Spirit that gives life; the flesh is of no avail.’ The flesh of Christ is not life-giving from itself but by the power of the Deity dwelling corporeally within it. It is substantially life, and from itself, it gives life. He gave to the body in which He dwells the power of giving life, not by the confusion of the two natures in Christ or the operation of natural properties but by the hypostatic union of natures. So that the flesh of the Word becomes life-giving, for it is the flesh of God; and being spiritually united to this flesh, we are connected to God, and thus, being already connected to Him, we are infallibly given life: as Cyril teaches in book 4 of his Commentary on the Gospel of John, chapter 14, and the following chapters until the end of chapter 25, and in book 1, chapter 21. And the operation of Deity is so powerful that it unites us to His flesh by its consenting will, nourishes us, and allows us to draw from His fullness. Therefore, for the salutary eating of the flesh of Christ, the bodily presence of the flesh is not required with the one partaking, as we explained a little earlier from the same Cyril.

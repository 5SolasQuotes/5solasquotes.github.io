<main class="wrap"><figure class="quote" id="q-487c250015" data-kw="Arius homoousios Nicene">
<blockquote><p>Arius confessed that Christ was God, and the Son of God; because the passages of Scripture to this effect were too clear to be resisted, and then, as if he had done well, pretended to concur with others. But, meanwhile, he ceased not to give out that Christ was created, and had a beginning like other creatures. To drag this man of wiles out of his lurking-places, the ancient Church took a further step, and declared that Christ is the eternal Son of the Father, and consubstantial with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-trinity-in-controversy.html">The Trinity in Controversy</a> › <a href="../topics/the-trinity/the-trinity-in-controversy/arianism.html">Arianism</a></span><span class="t"><a href="../topics/the-trinity/the-son.html">The Son</a> › <a href="../topics/the-trinity/the-son/deity-of-the-son.html">Deity of the Son</a></span></div>

</figure><figure class="quote" id="q-6fcdad7bf1" data-kw="against Arian">

</figure><figure class="quote" id="q-380ce2a14a" data-kw="homoousios Nicea Arian">
<blockquote><p>At length the orthodox, to cut off every way of escape for him, declared in the Council of Nicea that the Son was homoousion (i.e., of the same nature and essence with the Father). … Athanasius detected the subterfuge and taught that there was not a similar, but the same essence in the Father and Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.23.10</span></figcaption>

</figure><figure class="quote" id="q-c30b609950" data-kw="Sabellius modalism">
<blockquote><p>Next Sabellius arose, who counted the names of Father, Son, and Holy Spirit, as almost nonentities; maintaining that they were not used to mark out some distinction, but that they were different attributes of God, like many others of a similar kind. When the matter was debated, he acknowledged his belief that the Father was God, the Son God, the Spirit God; but then he had the evasion ready, that he had said nothing more than if he had called God powerful, and just, and wise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.4</span></figcaption>

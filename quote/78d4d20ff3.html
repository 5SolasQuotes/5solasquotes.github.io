<main class="wrap"><figure class="quote" id="q-78d4d20ff3" data-kw="">
<blockquote><p>203. He therefore that is so far disposed to any good act, and whose indisposition, or disposition to the contrary, is but such, as that in his present state, without any more help than he has, he can move his own will to the said act, and the difficulty is not so great but that such power sometime does overcome it, is said to have a moral power. But he that wants [lacks] not natural force or power, but only a right disposition of his will, and so far wants it, as that none in his case do ever change their own acts to good, without more help and power than he has, is said to be morally unable or impotent: and not only to want the habit. 204… Unbelievers want not that natural power or faculty, which can believe and repent if duly suscitated and disposed: But through an ill disposition and contrary course of action, and want of due excitation, that power will not act, without God’s special grace. Which ‘will not’ signifies: 1. the undisposedness, 2. the non-agency. And in strictest speech, the former is best expressed by, ‘The will is undisposed and averse to believe, etc.’ and the latter by ‘The will does not consent.’ But the first may be expressed by, ‘It cannot’ because it will not come to pass, though it is no such ‘cannot’ as is distinct from ‘will not,’ but the very same. And as ‘power’ is distinct fom ‘will’ and a man is said to be able to do that which ‘he can do if he will,’ so no doubt but he that will believe and repent, can do it, so far as he is willing. And this is it that [which] Augustine so much pleads for, when he would have us distinguish ‘cannot’ and ‘will not,’ and when he says that Posse credere est omnium; Credere autem fidelium. [To be able to believe is common to all; but actually to believe is the mark of the faithful.] … 213. A man may be able mediately to do that which he is not able immediately to do: I mean he that can write with a pen, or move things with an engine, and so act but as a partial, though principal cause, may not be able to write without a pen, nor to do the same alone as a total cause. 214. And a man may have power to do that mediately and hypothetically hereafter, which he cannot do immediately, that is, at the present time. He can learn to write, and after can write, who cannot write till he hath learned. Thus infants have a remote power of speaking, and infidels of believing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>sect. 10, ‘Of Natural &amp; Moral Power as Foreseen’ in Catholic Theology</cite>, (London: White, 1675), pp. 36-39</span></figcaption>

<blockquote><p>Be it so that God rewards the right use of natural things with an increase of natural goods, but not with the collation of supernatural ones. For this would be “to cross over into another kind” (metabainein eis to allo genos). For it is as if someone said that God promised good health to one who makes good use of honors. It is certain that the natural does not have an order of causality to the supernatural, because they are distant by a whole kind; nor can the seed of nature ever rise into the fruit of grace.</p></blockquote>

<blockquote><p>3. I easily acknowledge that grace gives such a power as is commonly called Moral, distinct from the natural faculties, as our corrupt estate contains an opposite impotency. But this is but an applying of the terms [‘can’] and [‘cannot’] [‘power’] and [‘impotency’] to dispositions and undisposedness, to habits and their privations. 4. A new heart and spirit, I easily confess necessary. But those words do commonly signify in Scripture, only new inclinations, dispositions, qualifications. It is a new heart, though only the old faculties and substance. I hope you will not follow Illyricus.¹ ¹ [Matthias Illyricus (1520–1575), a Lutheran reformer. Wiki says, “Affirming the natural inability of man, he adopted a position on sin as not being an accident of human nature, but involved in its substance, since The Fall of Man.”] 5. Where you say that [without faith a man can no more receive Christ, nor do ought towards it, than a dead man can walk or speak.], I Reply 1. That proves not faith to be equivalent to a potentia vel facultas [power or capacity], any otherwise than that it is of as absolute necessity, but not that it is of the same nature. If you show an illiterate man a Greek or Hebrew book, he can no more read in it then a dead man, that is, both are truly in sensu composito [in a combined sense] impossible: But yet it is but a habit that is wanting to one, and a power or faculty natural, to the other. And so it may truly be said that a sinner cannot do well that has accustomed to do evil, no more than a leopard can change his spots, or a blackmoore [a black person] his skin. Yet if you mean that such are equally distant from actual change as a dead man, it is but a dead comparison. A dead man wants both natural faculties, and an inclination or moral power. An unbeliever wants but one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reduction of a Digressor</cite>, (1654), p. 131</span></figcaption>

<blockquote><p>Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4c0cb98b84" data-kw="">
<blockquote><p>This disputation on merits will be fourfold. First we must treat whether there are any true merits of the just. Secondly, what merit is, or what is required to constitute true merit. Thirdly, of what kind these merits are, that is, whether they are ex condigno or only ex congruo. Fourthly, for what they are merits, or what it is that properly falls under merit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, bk. 5, preface (translated from the Latin)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-73bdee7a45" data-kw="">
<blockquote><p>Merit and reward refer to the same, for a reward means something given anyone in return for work or toil, as a price for it. … Now it is clear that between God and man there is the greatest inequality: for they are infinitely apart, and all man&#x27;s good is from God. Hence there can be no justice of absolute equality between man and God, but only of a certain proportion, inasmuch as both operate after their own manner. Now the manner and measure of human virtue is in man from God. Hence man&#x27;s merit with God only exists on the presupposition of the Divine ordination, so that man obtains from God, as a reward of his operation, what God gave him the power of operation for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, I-II, q. 114, a. 1</span></figcaption>

</figure><figure class="quote" id="q-c3573a6dea" data-kw="">
<blockquote><p>There is no definite doctrinal decision in this matter. The concept meritum de congruo is not without ambiguity, inasmuch as the claim arising from it can be greater or less, hence the opinions of theologians are divided. a) Meritum de congruo and the sinner. A person in mortal sin can merit de congruo, by his free co-operation with actual grace, further actual graces in preparation for justification, and finally the grace of justification itself. (Sent. probabilis.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 4, pt. 1, sec. 2, §25, 2</span></figcaption>

</figure><figure class="quote" id="q-1be46483e7" data-kw="">
<blockquote><p>From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

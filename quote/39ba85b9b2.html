<blockquote><p>…the children… provided always, that first they have the form of knowledge of Christian religion: to wit, the knowledge of God’s law and commandments; the use and office of the same; the chief articles of our belief; the right form to pray unto God, the number, use, and effect of the sacraments; the true knowledge of Christ Jesus, of his office and natures, and such other [points] as without the knowledge whereof, neither deserves [any] man to be named Christian, neither ought any to be admitted to the participation of the Lord’s Table. And therefore, these principles ought and must be learned in the youth.</p></blockquote>

<blockquote><p>24. Thus the Lord, when he chose Abraham for himself, did not commence with circumcision, in the meanwhile concealing what He meant by that sign, but first announced that He intended to make a covenant with him, and, after his faith in the promise [Gen. 15], made him partaker of the sacrament [Gen. 17]. Why does the sacrament come after faith in Abraham, and precede all intelligence in his son Isaac? It is right that he who, in adult age, is admitted to the fellowship of a covenant by one from whom he had hitherto been alienated, should previously learn its conditions; but it is not so with the infant born to him. He, according to the terms of the promise, is included in the promise by hereditary right from his mother’s womb. Or, to state the matter more briefly and more clearly: If the children of believers, without the help of understanding, are partakers of the covenant, there is no reason why they should be denied the sign, because they are unable to swear to its stipulations. This undoubtedly is the reason why the Lord sometimes declares that the children born to the Israelites are begotten and born to him, (Eze. 16:20; 23:37). For He undoubtedly gives the place of sons to the children of those to whose seed He has promised that He will be a Father. But the child descended from unbelieving parents is deemed an alien to the covenant until he is united to God by faith. Hence, it is not strange that the sign is withheld when the thing signified would be vain and flillacious. In that view, Paul says that the Gentiles, so long as they were plunged in idolatry, were strangers to the covenant, (Eph. 2:11). The whole matter may, if I mistake not, be thus briefly and clearly expounded: Those who, in adult age, embrace the faith of Christ, having hitherto been aliens from the covenant, are not to receive the sign of baptism without previous faith and repentance. These alone can give them access to the fellow- ship of the covenant, whereas children, deriving their origin from Christians, as they are immediately on their birth received by God as heirs of the covenant, are also to be admitted to baptism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, Book 4, ch. 16, section 24, trans. Beveridge</span></figcaption>

</figure><figure class="quote" id="q-4ddb9747d0" data-kw="covenant of grace">
<blockquote><p>Reply; How often have we shewed that this Text proves not that any Children, quatenus as such, should be baptized, nor, as such, that they are in the Covenant of Grace, or have the Promise made to them; the Promise runs to the Jews and to their Offspring, and not to them only, but to Gentiles also, who were said to be afar off: But pray observe, &#x27;tis to no more of the Jews and their Children or Offspring, and such who were afar off, than the Lord shall call or make Disciples by the Word and effectual Operations of the Holy Spirit. My Sons and Daughters are as much my Children when they are twenty or thirty Years old, as well as when Babes. Dr. Hammond also grants, Children in this Text doth not refer to Insants as such, but to the Posterity of the Jews, p. 490. Sect. 81. If ye be Christ&#x27;s, then you are Abraham&#x27;s Seed, and Heirs according to the Promise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pedo-Baptism Disproved</cite></span></figcaption>

</figure><figure class="quote" id="q-6d8c4fe66f" data-kw="">
<blockquote><p>The religious observance of this institution was required under a very severe penalty, Gen. 17:14. The contempt of circumcision was a contempt of the covenant; if the parents did not circumcise their children, it was at their peril, as in the case of Moses, Ex. 4:24–25. With respect to those that were not circumcised in their infancy, if, when they grew up, they did not themselves come under this ordinance, God would surely reckon with them. If they cut not off the flesh of their foreskin, God would cut them off from their people. It is a dangerous thing to make light of divine institutions, and to live in the neglect of them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 17, verse 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>2. There is no such moral necessity of the sacraments as there is of the ministry of the Word, and consequently of some use of the keys where a scandalous person may infect the Lord’s flock. For where vision ceases the people perish, but it is never said, where baptism ceases the people perish; and therefore uncalled ministers in case of necessity, without ordination or calling from a presbytery, may preach and take on them the holy ministry and exercise power of jurisdiction, because the necessity of the souls of a congregation in a remote island requires so, but I hope no necessity in any [of] the most extraordinary case requires that a midwife may baptize, or that a private man remaining a private man may celebrate the Lord’s Supper to the Church without any calling from the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, pp. 454-455</span></figcaption>

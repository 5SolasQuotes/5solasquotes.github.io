<main class="wrap"><figure class="quote" id="q-66cd10c262" data-kw="">
<blockquote><p>Then there may and ought to be uniting [in church union] when the evils that follow division or schism, are greater and more hurtful to the Church, than the evils that may be supposed to follow on union. I speak not of ills of sin (for the least of these are never to be chosen), but of evils and inconveniences that may indeed be hurtful to the Church in themselves, and sinful in respect of some persons, yet are not so to all: Now, in such evils the lesser is to be chosen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Concerning Scandal</cite>, pp. 321–22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6a2af103e9" data-kw="">
<blockquote><p>Calvin never for a moment ceased to view the Church in its totality and, as Karl Holl has noted, his ecumenicity took root in the Churches organized under his influence, resulting in a strong feeling of unity and an active intercourse between them. In conflicts within Calvinism, national difference has never played a part. In this ecumenical consciousness he sought, in fact, a ‘syncretism’ (a word employed in his Catechism) among Protestants. Calvin never drew the bounds of communion in terms of assent to one confession of faith… He sought to lay the foundation of a Europe-wide communion, with a doctrinal basis clearly but not narrowly defined. He hoped to obtain this by mutual deliberation and conciliar action. Had his aims been achieved, Protestantism would have taken the outlines of a Church ecumenical and conciliar, autonomous vis-a-vis the State though protected by it. The design of Calvin has the grandeur of a world-embracing Christian order… The three Protestantisms [Reformed, Zwinglian and Luthern] had become two [as the Zwinglian and Reformed merged], and Calvin never lost hope that the two would become one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Calvin | John T. McNeill, ch. 1. “The Ecumenical Idea &amp; Efforts to Realize it, 1517-1618” in eds. Ruth Rouse &amp; Stephen C. Neill, A History of the Ecumenical Movement: 1517-1948 (Philadelphia, 1967), p. 52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>§7. Differing opinions or practices about things indifferent, no nor about the mere integrals of religion [those things which complete religion and make it whole], which are not essentials, do not make men of different religions or Churches (universally considered). (Rom. 14 &amp; 15; Gal. 2:13-15; Phil. 3:16-17) §8. Nothing will warrant us to separate from a church as no church, but the want [lack] of something essential to a church. §9. The essential or constitutive parts of the Church-catholic (or universal) are Christ the Head and all Christians as the members. (Eph. 1:22 &amp; 4:15; Col. 1:18 &amp; 2:19; 1 Cor. 12:27; Eph. 4:12 &amp; 5:23; Mt. 28:19; 1 Cor. 5) … §13. He that does not nullify or unchurch a church, may lawfully remove from one church to another, and make choice of the best and purest, or that which is most suited to his own edification, if he be a free-man. §14. But in case of such choice or personal removal, the interest of the whole Church, or of religion in common, must be first taken into consideration by him that would rightly judge of the lawfulness of the fact. (Rom. 9:3; 1 Cor. 12:25-26) §15. If a Church which in all other respects is purest and best, will impose any sin upon all that will have local communion with it, though we must not separate from that Church as no Church, yet must we not commit that sin, but patiently suffer them to exclude us from their communion. (Rom. 3:8) §16. True heresy (that is, an error contradictory to an essential article of the Christian Faith) if it be seriously and really held, so that the contrary truth is not held seriously and really, does nullify the Christianity of him that holds it, and the Church-state of that congregation which so professes it. But so does not that fundamental error which is held but in words through ignorance, thinking it may consist with the contrary truth, while that truth is not denied, but held majore fide [with greater faith]; so that we have reason to believe that if they did discern the contradiction, they would rather forsake the error than the truth. (Tit. 3:10; 2 Jn. 10; Heb. 5:11-12; 1 Cor. 15:1-2, etc. Lk. 18:34; Jn. 12:16; Gal. 5:2 &amp; 1:7-9 &amp; 3:1-2; In isto factiosissimo soeculo, vix quisquam eximie doctus haereseos suspicione carebat. [In that most partisan age, scarcely anyone who was exceptionally learned was free from suspicion of heresy.] Erasmus in The Life of Jerome. Et profecto ita est, ut id habendum sit antiquissimum et Deo proximum, quod sit optimum. [And indeed it is so: that which is best must be regarded as both the most ancient and the closest to God.] Cicero, Of Laws, bk. 2, p. 244)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reasons of the Christian Religion</cite>, ... (London: White, 1667), pt. 2, ch. 13, pp. 465-66</span></figcaption>

</figure><figure class="quote" id="q-38b08187c6" data-kw="">
<blockquote><p>However, most others describe the visible Church as the assembly of those who profess the true and salutary doctrine of Christ and legitimately use the sacraments instituted by Him, and also observe the lawful order of discipline. Some others more briefly say it is the assembly of those who profess the true religion, along with their children. Thus, the Anglican Confession, Chapter 25, Article 30. Therefore, they do not want any heretical churches to constitute part of the visible Church, but exclude from it those who are properly called heretics; nor do they place outside it all who err in matters of faith and sin in the administration of the sacraments and the exercise of discipline; but only those who deny and subvert the fundamental teachings concerning faith, discipline, and the sacraments. Therefore, among the many particular churches that are contained within the communion of the true Church, they note various degrees of purity and perfection; nor do they immediately deny a church to be a true Church of Christ if it is not in all respects pure in doctrine or in the rest of worship, rites, and the sanctity of discipline, and if it has some errors in saving faith, some abuses in the use of sacraments, some superstitions in divine worship, and some allowance of scandals in the sanctity of discipline, provided that in the meantime it retains the fundamental and saving doctrine and practice of faith and worship. These are the words of the confession or declaration of the Polish Churches, publicly read at the Thorunien assembly in 1645, and printed and published the following year. And this is the common opinion of our theologians, as can be seen in John Calvin, Institutes, Book 4, Chapter 1, Section 12 and following, and in the illustrious Mestrezat in his French treatise on the Church, Book 2, Chapter 4.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“However, most others describe the visible Church as the assembly of those who profess the true and salutary doctrine of Christ and legitimately use the sacraments instituted by Him, and also observe the lawful order of discipline. Some others more briefly say it is the assembly of those who profess the true religion, along with their children. Thus, the Anglican Confession, Chapter 25, Article 30. Therefore, they do not want any heretical churches to constitute part of the visible Church, but exclude from it those who are properly called heretics; nor do they place outside it all who err in matters of faith and sin in the administration of the sacraments and the exercise of discipline; but only those who deny and subvert the fundamental teachings concerning faith, discipline, and the sacraments. Therefore, among the many particular churches that are contained within the communion of the true Church, they note various degrees of purity and perfection; nor do they immediately deny a church to be a true Church of Christ if it is not in all respects pure in doctrine or in the rest of worship, rites, and the sanctity of discipline, and if it has some errors in saving faith, some abuses in the use of sacraments, some superstitions in divine worship, and some allowance of scandals in the sanctity of discipline, provided that in the meantime it retains the fundamental and saving doctrine and practice of faith and worship. These are the words of the confession or declaration of the Polish Churches, publicly read at the Thorunien assembly in 1645, and printed and published the following year. And this is the common opinion of our theologians, as can be seen in John Calvin, Institutes, Book 4, Chapter 1, Section 12 and following, and in the illustrious Mestrezat in his French treatise on the Church, Book 2, Chapter 4.”

— Louis Le Blanc, Elucidation of the Status of Controversies about the Church Militant, bk. 5, ch. 1, ‘On the Nature and Definition of the Church’ in Theological Theses Published at Various Times in the Academy of Sedan, 3rd ed., tr. by AI by Colloquia Scholastica (1675; London, 1683), p. 1052">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHowever%2C+most+others+describe+the+visible+Church+as+the+assembly+of+those+who+profess+the+true+and+salutary+doctrine+of+Christ+and+legitimately+use+the+sacraments+instituted+by+Him%2C+and+also+observe+the+lawful+order+of+discipline.+Some+others+more+briefly+say+it+is+the+assembly+of+those+who+profess+the+true+religion%2C+along+with+their+children.+Thus%2C+the+Anglican+Confession%2C+Chapter+25%2C+Article+30.+Therefore%2C+they+do+not+want+any+heretical+churches+to+constitute+part+of+the+visible+Church%2C+but+exclude+from+it+those+who+are+properly+called+heretics%3B+nor+do+they+place+outside+it+all+who+err+in+matters+of+faith+and+sin+in+the+administration+of+the+sacraments+and+the+exercise+of+discipline%3B+but+only+those+who+deny+and+subvert+the+fundamental+teachings+concerning+faith%2C+discipline%2C+and+the+sacraments.+Therefore%2C+among+the+many+particular+churches+that+are+contained+within+the+communion+of+the+true+Church%2C+they+note+various+degrees+of+purity+and+perfection%3B+nor+do+they+immediately+deny+a+church+to+be+a+true+Church+of+Christ+if+it+is+not+in+all+respects+pure+in+doctrine+or+in+the+rest+of+worship%2C+rites%2C+and+the+sanctity+of+discipline%2C+and+if+it+has+some+errors+in+saving+faith%2C+some+abuses+in+the+use+of+sacraments%2C+some+superstitions+in+divine+worship%2C+and+some+allowance+of+scandals+in+the+sanctity+of+discipline%2C+provided+that+in+the+meantime+it+retains+the+fundamental+and+saving+doctrine+and+practice+of+faith+and+worship.+These+are+the+words+of+the+confession+or+declaration+of+the+Polish+Churches%2C+publicly+read+at+the+Thorunien+assembly+in+1645%2C+and+printed+and+ <blockquote><p>We say, furthermore, that these Reformed Churches do not dissent in the fundamentals of faith. For although they may dissent in some chapters of Doctrine, we nevertheless deny any dissension in the fundamentals of faith… We are not saying here that they do not dissent in rites and ceremonies, for not every such dissension, either by its own nature severs, or ought to sever, the union of the Reformed Churches, especially since none of the Reformed Churches retains rites that are repugnant to the Gospel or introduced with an opinion of worship… Augustine, in Epistle 86, wrote no less skillfully than holily: “Let the garment of the Church be so varied by different observances that it is not torn apart by adverse contentions.”… Furthermore, it should also be added that we do not say that the Reformed Churches do not likewise dissent in the external mode of administering ecclesiastical polity or discipline… Nevertheless, we also contend that, this discrepancy being admitted, there is still no dissension in the fundamentals of faith. Indeed, such diversity in external polity can and ought to be tolerated without injury to or rupture of fraternal unity, especially since all the reformed Churches retain those things which are absolutely necessary, namely, the pure preaching of the Word of God, the due administration of the Sacraments, the ordination of pastors by public authority, and finally, the censure of morals. It is not on account of a difference in external form in these matters, where there is consensus in the fundamentals of faith, that the Reformed Churches should fight among themselves and reject all external ecclesiastical union. … The Foundation of Faith denotes… The primary object of faith, which is Christ the Savior… An epitome of this doctrine of the prophets and apostles [Eph. 2:20], containing in itself the sum of the Law and the Gospel, can be and is accustomed to be most conveniently reduced to four heads. So Augustine in the Enchiridion.

1. The Apostles’ Creed.

2. The Decalogue.

3. The Lord’s Prayer.

4. The doctrine of the sacraments. … But neither do we say they dissent in the very many secondary and tertiary articles, which since they are sufficiently proposed to, revealed to, and understood by all the Reformed Churches, are asserted with unanimous consent by them against the old heresies of the Marcionites, Manichaeans, Arians, Eunomians, Nestorians, Eutychians, and Monothelites, and against the new heresies of the Romanists. In a very few secondary articles not sufficiently proposed to all, or certainly not well enough weighed by them, and in some tertiary ones whose clear deduction from the primary is still hidden from some Churches, let there be dissent… Yet that does not impede the harmony of faith (ὁμονοίαν πίστεως) nor does it, or should it, break the ecclesiastical unity of the said Churches.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9fc4b13214" data-kw="">
<blockquote><p>WHAT FAITH IS.

FAITH is a sure persuasion and an undoubted belief of the heart in the merciful promises of God, made to all faithful penitent sinners in Christ’s blood, and freely performed of God the Father for Christ’s sake.

WHAT BENEFITS WE RECEIVE OF GOD THROUGH FAITH.

By faith we, which afore by nature were the children of wrath, are made the sons and children of God. …

By faith we, which afore were sinners, are justified and counted righteous in the sight of God for Christ’s sake. …

By faith Christ’s fulfilling of the law is counted our fulfilling. …

By faith our works are allowed before God for Christ’s sake. …

By faith everlasting life is given unto us for Christ’s sake. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-becon.html">Thomas Becon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to be Known of the Faithful Newly set Forth to the Great Profit of all the Readers (1569) in The Catechism of Thomas Becon … with other pieces written by him in the Reign of King Edward the Sixth, ed. John Ayre (Cambridge: The Parker Society, 1844), pp 482-83.</cite></span></figcaption>

<blockquote><p>Which [Scriptural phrases] all signify one thing: that is, his suffering in the flesh. For nowhere in the Scriptures of God is our righteousness particularly attributed to any other action of Christ. Neither can it be collected to consist in any other action, except out of the general word of ‘obedience’. Neither is there any necessity (if the matter be well weighed) to add anything to the sufferings of Christ in the matter of our righteousness. Yea moreover, it would appear by diverse grounds of the truth of God that nothing can or may be added thereunto in the matter of our righteousness.</p></blockquote>

</figure><figure class="quote" id="q-a0cb24bd13" data-kw="">
<blockquote><p>And the man, out of Christ and under the Law, is still compelled in both active and passive obedience… And for the believer in Christ, the rigor of the Law is abated, not that the Law, as the Law, requires less of him than absolutely perfect obedience, but because in what he comes short in performing of new obedience, from a new principle, to wit, a Gospel-spirit in him, he is pardoned in Christ, and the rest is accepted for Christ’s sake, as if it were obedience. Now in this new obedience, the Spirit so oils the wheels of free-will as obedience, in its kind, is as free, connatural, delightful, being sweetened with the love of God, as if there were not an awing Law, but a sweetly alluring and heart-drawing free love, so that the believer obeys…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London: J.D., 1648), pt. 1, ch. 35, p. 317-18</span></figcaption>

</figure><figure class="quote" id="q-08f2c04b0b" data-kw="">
<blockquote><p>But I fear the sense of this [said by antinomians], that ‘Christ repents for us, and obeys for us, He being the end of the Law to overy one that believes,’ be far otherwise, to wit, that Christ’s obedience of the Law, He being the end of the Law, as also his passive obedience is ours. If this be the intended sense, then: [1.] All our sanctification is nothing but the sanctification and holy active obedience of Christ. I yield this to be a broad, a fair and easy way to heaven. Christ does all for us [according to antinomians:], Christ weeped for my sins, and that is all the repentance required in me, if I believe that Christ was mortified and dead to the world for me, that is my mortification; and if I believe that the change of the whole man was truly in Christ, this is my true holiness: then my walking in holiness cannot be rewarded with life eternal, nor have any influence as a way or means leading to the kingdom.

2. Christ’s active obedience imputed to the sinner can be no evidence of justification, because it is in Christ, not in me; any evidence or mark of justification must be inherent in the believer, not in Christ.

3. And one and the same thing cannot be a mark and a sign of itself. Now the active obedience of Christ imputed to the sinner is holden [by antinomians] to be a part of justification [and therefore it cannot be a sign of justification].</p></blockquote>

</figure><figure class="quote" id="q-839cab1031" data-kw="">
<blockquote><p>779. Now besides this justification of the sinner which has its place in the first conversion of the sinner to God and which is renewed so long as he repents (for the faithful life is the continual exercise of faith), he is also given a justification of the just which is by works, which James discusses.

780. By this we understand the declaration of God with respect to the accusation of Satan, since in the regenerated sinner are true, colored, and indubitable signs and proofs of true faith which are pleasing to Him, and which are required among the heirs of the goods of grace.

781. This second justification is necessarily connected with the first (it is necessary to distinguish this from the variation of the Papists) so that it cannot be separated from it for any reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/campegius-vitringa.html">Campegius Vitringa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fundamentals of Sacred Theology Pre</cite>, (d. 1722; RHB, 2024), ch. 21, ‘Justification…’, p. 186 Note Vitringa does not clearly join these two justifications as one, and it is said by the editor in a footnote that he later dropped the language of a “second” justification.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>The Westminster divine, Daniel Featley, quoted the below letter of King James I to the French Reformed Synod of Privas in 1612, urging them to drop the controversy between Pierre Du Moulin and Daniel Tilenus (who later sided with the Arminians) concerning the imputation of Christ’s active obedience. While we believe that experience has proven James wrong on this subject, we publish this translation of his letter for reasons of historical interest:

The advice of the most Gracious Prince, James, King of great Britain, for the quieting and composing the ensuing Controversy.

God made man upright, saith Solomon, but he found out many inventions: the truth whereof hence appears, that there daily grow such infinite controversies which seem to tend to no other end, then to disturb the peace of the Church. Among which this late question sprung up within these forty years, which the Church of God knew not of for 1460 years and sustained thereby no detriment, but now hath been eagerly argued between two most learned men, may be ranked; whether the passive obedience of Christ, whereby he laid down his life for his sheep by the special command of his Father, be only imputed to us for righteousness, or together with the passive the active also whereby he rendered himself obedient to the law.

This question, and those that necessarily arise from it, (a glimpse whereof we may see in the propositions of Molinaeus [Pierre Du Moulin], and the oppositions of [Daniel] Tilenus) we have no mind either in general to discuss, or in particular to scale. But out of those things which we have read ourselves, or heard from others in our presence, we will give such advice as we think will not mis-beseem the Defender of the faith.

And that is this: to wit, that this question be altogether buried with those that depend upon it, and be left in the grave with the napkin and the linen cloths wherein the body of Christ was wrapt, especially by them who profess themselves to be risen with Christ: that, all impediments being removed, we may all grow unto a perfect man in Christ Jesus: lest peradventure by too much wrangling we seem to cut in two the living child, which the tender-hearted mother would not endure; or divide the seamless coat of Christ, which the cruel soldier would not suffer.

This is the substance of what we shall advise: the reason whereof is, because it is a question altogether new, and not necessary, unheard of in former ages, not determined in any Council, not handled by the fathers not disputed in the schools. Away with it therefore. Moreover, if both parties now contesting would either stand to the judgements of most learned Divines alleged by both sides, or would test satisfied in the determinations of the churches urged by both, there needed no other Arbitrator; seeing they themselves, as appears by their writings, agree of their own accord, and have already brought it to an happy issue.

Therefore we exhort and friendly advise you that you suffer not these controversies to spread any further: above all, that you keep from the press, and add not fuel to this fire by polemical tractates.

Lastly, that there be faithful silence on both sides: seeing they tend not to edification, nor serve to any other purpose then to distract men’s minds otherwise consenting in all chief points of faith. To whom, if ever, especially in these days perfect concord is most necessary. Let them therefore remember that they ought rather to strive to preserve charity then to gain victory according to that of the Apostle; endeavouring to keep the unity of the spirit in the bond of peace; and not to prefer their private glory before the public good of the Church.</p></blockquote>

<blockquote><p>2. In accepting us as righteous in Christ, who died for our sins to reconcile us unto God; and therefore sometimes he is said to be made righteousness to us, 1 Cor. 1:30, and we are said to be made the righteousness of God in Him, 2 Cor. 5:21, that is, we have the effect of his sufferings, as if we had suffered in person; for they were undergone in our stead and for our sakes, and the fruit of it given to us by God Himself.</p></blockquote>

<blockquote><p>15. Did Christ redeem us only by his passive righteousness? The difference of opinions XXXVII. Fifteenth, it is asked whether Christ redeemed us only by his passive righteousness, or in addition also his active righteousness. Johannes Piscator, otherwise an outstanding theologian, together with several others, because they thought that the necessity of passive righteousness and death would be abolished if it were stated that in our place he most exactly kept the divine law, because one who kept the law exactly could not be punished with death, chose the prior. Protestants commonly prefer the latter, and certainly correctly, but not all in one way. Some divide the passive and active righteousness of Christ in such a way that only by his passive righteousness did he satisfy in our place for the law that was not observed, and by it delivered us only from the guilt of punishment, and likewise, only by his active righteousness did he keep the law perfectly in our place, and by keeping it, acquire for us the right of eternal life. Others, with that more subtle division laid aside, prefer to state that Christ devoted both these kinds of righteousness to us, to the end that he might satisfy for the divine law that was not observed by us, and by satisfying, also merit for us the right of life, in such a way that by this satisfaction he at the same time delivered us from every evil and gained the right of every good. The difficulties raised by Piscator are removed We have adduced the reasons for this view in §XX: with them presupposed, it is not so difficult to respond to the difficulties raised by Piscator. For if (1) it should be alleged that the law demands nothing but one or the other, either obedience or punishment, we will respond that the law, first from man in his integrity, demands only obedience under threat of punishment, but from the sinner, it demands punishment for past sin and obedience in the future, because punishment cannot deliver from the obedience owed to God. Wherefore the Redeemer had to supply both. If (2) it should be alleged that the necessity and use of the death and passive righteousness are removed when he has most fully kept the law on our behalf, we will respond that it is by no means removed, because both kinds of righteousness were necessary for him to satisfy for the injury we inflicted upon the divine majesty and his law, and in satisfying, to merit for us the right of eternal life. If (3) it should be alleged that Scripture refers the consummation of our salvation to his one and only sacrifice accomplished on the cross, we will respond that by that sacrifice is understood by synecdoche his entire satisfaction, the outstanding part of which his death on the cross supplied, just as by the same synecdoche, the blood of Christ designates the same satisfacation (1 John 1:7; Acts 20:28). If one should proceed (4) to allege that obedience was necessary for his own self as a man, and thus could not be expended for us, we will respond that (a) the obedience, insofar as it resulted from the God-man, was not necessary for him, because the law obligates not the God-man to obedience, but a mere man; (b) that obedience of the God-man is of infinite value, whereby it was able to suffice both for himself and for us, because an obedience greater than infinite could not be demanded or supplied for him, or at the same time for us.</p></blockquote>

ill+respond+that+the+law%2C+first+from+man+in+his+integrity%2C+demands+only+obedience+under+threat+of+punishment%2C+but+from+the+sinner%2C+it+demands+punishment+for+past+sin+and+obedience+in+the+future%2C+because+punishment+cannot+deliver+from+the+obedience+owed+to+God.+Wherefore+the+Redeemer+had+to+supply+both.+If+%282%29+it+should+be+alleged+that+the+necessity+and+use+of+the+death+and+passive+righteousness+are+removed+when+he+has+most+fully+kept+the+law+on+our+behalf%2C+we+will+respond+that+it+is+by+no+means+removed%2C+because+both+kinds+of+righteousness+were+necessary+for+him+to+satisfy+for+the+injury+we+inflicted+upon+the+divine+majesty+and+his+law%2C+and+in+satisfying%2C+to+merit+for+us+the+right+of+eternal+life.+If+%283%29+it+should+be+alleged+that+Scripture+refers+the+consummation+of+our+salvation+to+his+one+and+only+sacrifice+accomplished+on+the+cross%2C+we+will+respond+that+by+that+sacrifice+is+understood+by+synecdoche+his+entire+satisfaction%2C+the+outstanding+part+of+which+his+death+on+the+cross+supplied%2C+just+as+by+the+same+synecdoche%2C+the+blood+of+Christ+designates+the+same+satisfacation+%281+John+1%3A7%3B+Acts+20%3A28%29.+If+one+should+proceed+%284%29+to+allege+that+obedience+was+necessary+for+his+own+self+as+a+man%2C+and+thus+could+not+be+expended+for+us%2C+we+will+respond+that+%28a%29+the+obedience%2C+insofar+as+it+resulted+from+the+God-man%2C+was+not+necessary+for+him%2C+because+the+law+obligates+not+the+God-man+to+obedience%2C+but+a+mere+man%3B+%28b%29+that+obedience+of+the+God-man+is+of+infinite+value%2C+whereby+it+was+able+to+suffice+both+for+himself+and+for+us%2C+because+an+obedience+greater+than+infinite+could+not+be+demanded+or+supplied+for+him%2C+or+at+the+same+time+for+us.%E2%80%9D%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology%2C+%28RHB%29%2C+vol.+4%2C+bk.+5%2C+ch.+18%2C+The+Mediator%E2%80%99s+Redemption+Itself&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6427389ef6.html&amp;via=5Solas" target="_blank" r <blockquote><p>Whether it is rightly said by Johannes Piscator on Rom. 8:4 [“That the righteousness of the law might be fulfilled in us, who walk not after the flesh, but after the Spirit.”]: ‘Here he indicates the end for which God, in the flesh of his Son, condemned our sin—namely, that the righteousness (or justification) of the Law might be fulfilled in us; that is, that we might be justified, being endowed with that righteousness which the Law requires of us. For the Law requires of us either perfect obedience or punishment. But we have not rendered perfect obedience; yet we have paid the penalty in Christ, for he paid it on our behalf. Therefore we have satisfied the Law in Christ; and consequently the Law cannot condemn us, but is bound to justify us.’ We deny it.</p></blockquote>

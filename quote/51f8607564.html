<main class="wrap"><figure class="quote" id="q-51f8607564" data-kw="">
<blockquote><p>But the true use of the Law is this, that I know that by the Law I am being brought to an acknowledgement of sin and am being humbled, so that I may come to Christ and be justified by faith. But faith is neither a Law nor a work; it is a sure confidence that takes hold of Christ, who “is the end of the Law” (Rom. 10:4). How? Not by abrogating the old Law and passing a new one or by being a judge who needs to be appeased by works, as the papists taught. But He “is the end of the Law, that everyone who has faith may be justified”; that is, everyone who believes in Christ is righteous, and the Law cannot accuse him. This is the true power and the true use of the Law. Therefore the Law is good, holy, useful, and necessary, so long as one uses it in a legitimate way. Its civic use is good and necessary, but its theological use is the most important and the highest. But the Law is abused, first, by hypocrites who attribute to it the power to justify, and, secondly, by men of despair who do not know that the Law is a custodian until Christ comes, that is, that the Law humbles us, not to harm us but to save us. For God wounds in order to heal; He kills in order to make alive. Emphasis added.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 348.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8063f6df32" data-kw="">
<blockquote><p>Ignorance of the difference between the law and the gospel promotes also, in a great degree, the strength and influence of a self-righteous temper. When a man is driven to acts of obedience by the dread of God’s wrath revealed in the law and not drawn to them by the belief of His love revealed in the gospel; when he fears God because of His power and justice and not because of His goodness; when he regards God more as an avenging judge than as a compassionate friend and father; and when he contemplates God rather as terrible in majesty than as infinite in grace and mercy, he shows that he is under the dominion, or at least under the prevalence, of a legal spirit. If he builds his faith of the pardon of sin, of the favor of God, and of eternal life on any graces that he supposes are implanted in him or on any duties that are performed by him, he is evidently under the power of a self-righteous temper. He shows that he is under the influence of this hateful temper by grounding his hope and his comfort on conditions performed by himself and not on the gracious and absolute promises of the gospel. In a word, when his hope of divine mercy is raised by the liveliness of his frame in duties and not by discoveries of the freeness and riches of redeeming grace offered to him in the gospel; or when he expects eternal life not as the gift of God through Jesus Christ but as a recompense from God for his own obedience and suffering, he plainly shows that he is under the power of a legal spirit. Now, if he is ignorant of the leading distinctions between the law and the gospel, this ignorance will strengthen his legal propensity and confirm him in his resolution to seek justification partly, if not wholly, by the works of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel (Grand Rapids: Reformation Heritage Books), 129–30.</cite></span></figcaption>

</figure><figure class="quote" id="q-b5c7e4cb15" data-kw="">
<blockquote><p>God therefore commands a strong and ardent affection, an affection not to be impeded by any portion, however minute, of concupiscence. He requires a mind so admirably arranged as not to be prompted in the slightest degree contrary to the law of love.</p></blockquote>

</figure><figure class="quote" id="q-294cf7d1da" data-kw="">
<blockquote><p>Don’t make the mistake of thinking that Christians are people who never sin or feel sinful. Rather, because of their faith in Christ, God simply doesn’t attribute their sin to them. This teaching is comforting to those who have terrified consciences. For good reason, we often try to impress on people that sins are forgiven and that righteousness is attributed to believers for the sake of Christ. Similarly, Christians should not have anything to do with the law or with sin. To the extent we are Christians, we stand above the law and sin. Christ is the Lord of the law. He is present and locked in our hearts, just as a precious stone is firmly mounted in a ring. When the law accuses us and sin terrifies us, all we need to do is look to Christ. When we have taken hold of him in faith, we have the victor over the law, sin, death, and the devil with us. Because Christ rules over all of these, we won’t be harmed. That’s why a Christian, correctly defined, is free from all laws and subject to no one, either inwardly or outwardly. But notice that I said, “to the extent we are Christians,” not just to the extent we are human and have consciences. We are free to the extent we have consciences that are transformed and made rich through faith. This faith is a great and immeasurable treasure—as Paul says, an “indescribable gift” (2 Corinthians 9:15), a gift that cannot be raised high enough or praised enough. It makes us children and heirs of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone. Zondervan. Kindle Edition. 201.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

s="src" href="https://heidelblog.net/2023/10/what-luther-actually-said-about-the-moral-law/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-ca815d96e5" data-kw="uses absolute relative rule">
<blockquote><p>A twofold use of the law may be laid down—absolute and relative. The former regards the law in itself; the latter regards the law in relation to the various states of man. The absolute (which obtains in every state of man) is that it may be a unique, full and certain rule of things to be done and avoided by each of us as well towards God as his neighbor. Thus there is no work truly and properly good and acceptable to God which does not agree with the law and is not prescribed by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.22.2</span></figcaption>

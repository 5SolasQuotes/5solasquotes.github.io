<main class="wrap"><figure class="quote" id="q-d136827407" data-kw="">
<blockquote><p>First of all, we have to realize that the ministry of the Word is something full of hard work and trouble. Just as a mother carries a fetus in her womb with great effort, losing her appetite for food and appealing to others for help, and just as she gives birth in great pain and then feeds and educates her child with enormous effort, so the trials laid on the backs of ministers of the Word are infinite, and those who risk their reputations in order to win others for Christ have to suffer great trouble (as we are taught by the example of Elijah).

The innate depravity of our mind and nature does not accept that we are children of God. The world is against them, because it does not let people escape from its clutches. What grieves ministers the most is that those for whose salvation they sacrifice everything are often not only ungrateful to them for their efforts but even hostile to them. But just as a mother’s love conquers everything and turns sorrow and trouble into joy, sustaining her through the birth process and the education of her children, so ministers should burn with unquenched love for Christ and the church, so that however hard the going may be, nothing will overpower the joy and delight that they get from fulfilling their ministry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 154.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

<main class="wrap"><figure class="quote" id="q-d4fd12c455" data-kw="">
<blockquote><p>In the first place, greater and greater license is allowed by the Protestant Church to the infraction of the Sabbath law. Her members are, on God’s day. indulged in the visitation of their places of business, riding out for pleasure, boating excursions, promenades in parks, travelling on railways, going for their mail, reading secular newspapers, social visiting, engaging in business pursuits in connection with railroads, telegraph lines, express companies, and post offices,—on the plea of making a livelihood, notwithstanding the words of a crucified Saviour: “Every one that hath forsaken houses, or brethren, or sisters, or father, or mother, or wife, or children, or lands for My name’s sake, shall receive an hundredfold, and shall inherit everlasting life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Signs of the Times – In the Church in George A. Blackburn (ed.), Sermons by Rev. John L. Girardeau, D.D., LL.D., Late Professor in the Theological Seminary, Columbia, S.C.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b43667675b" data-kw="">
<blockquote><p>5. It is observed, that David’s psalms were sung formerly with musical instruments, as the harp, timbrel, and cymbal, and organs; and why not with these now? If these are to be disused, why not singing itself? I answer, these are not essential to singing, and so may be laid aside, and that continue; it was usual to burn incense at the time of prayer, typical of Christ’s mediation, and of the acceptance of prayer through it; that is now disused; but prayer being a moral duty, still remains: the above instruments were used only when the church was in its infant-state, and what is showy, gaudy, and pompous, are pleasing to children; and as an ancient writer observes, “these were fit for babes, but in the churches (under the gospel-dispensation, which is more manly) the use of these, fit for babes, is taken away, and bare or plain singing is left.” As for organs… were first introduced by a pope of Rome, Vitalianus, and that in the seventh century, and not before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Doctrinal &amp; Practical Divinity</cite>, vol. 3, ‘Of Singing Psalms As A Part of Public Worship’ (London, 1796), p. 384</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

that%20in%20the%20seventh%20century%2C%20and%20not%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-391159f3df" data-kw="">
<blockquote><p>Mr. Chafer is in the unfortunate and, one would think, very uncomfortable, condition of having two inconsistent systems of religion struggling together in his mind. He was bred an Evangelical, and, as a minister of the Presbyterian Church, South, stands committed to Evangelicism of the purest water. But he has been long associated in his work with a coterie of “Evangelists” and “Bible Teachers,” among whom there flourishes that curious religious system (at once curiously pretentious and curiously shallow) which the Higher Life leaders of the middle of the last century brought into vogue; and he has not been immune to its infection. These two religious systems are quite incompatible. The one is the product of the Protestant Reformation and knows no determining power in the religious life but the grace of God; the other comes straight from the laboratory of John Wesley, and in all its forms—modifications and mitigations alike—remains incurably Arminian, subjecting all gracious workings of God to human determining. The two can unite as little as fire and water.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Review” of He That Is Spiritual</cite>, Princeton Theological Review XVII, no. 1-4 (1919).</span></figcaption>

</figure><figure class="quote" id="q-810a0efac6" data-kw="">
<blockquote><p>As you allow me to speak freely, I solemnly assure you I have been most scrupulously adverse from strife and contention. I have taught nothing which did not naturally arise from the passage on which I was lecturing; yea, when occasions of speaking on the habits [vestments] have come in my way, I have ever avoided them. But I do not deny that I have said our ministry [in the Church in England] has deviated from that of the primitive and apostolic church, to the purity of which I wished ours to be conformed: but this I said in so candid and modest a way, that none but ignorant or malicious persons could find fault. Yet I hear that I am accused to your excellency.</p></blockquote>

</figure><figure class="quote" id="q-83733c712e" data-kw="">
<blockquote><p>Augustine reminds us that divine omnipotence does not mean that God can do what is contradictory or at odds with his perfection:

He cannot will and not will at the same time. For justice cannot wish to do what is unjust; wisdom cannot wish what is foolish; truth cannot wish what is false. Whence we are reminded that the omnipotent God cannot do not only what the Apostle states: ‘He cannot disown himself,’ but many other things as well. Behold, I say this and I do not dare to say it in accordance with His truth, because I do not dare to deny that the omnipotent God cannot die, cannot be changed, cannot be deceived, cannot become wretched, cannot be overcome. Far be it that the Omnipotent One should be able to do these things and other things of this sort. And for that very reason not only does truth show that He is omnipotent because he cannot do these things, but truth also concludes that he who can do such things is not omnipotent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on the Liturgical Seasons</cite>, trans. Mary Sarah Muldowney in The Fathers of the Church, 38: 134 (Sermon 214).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

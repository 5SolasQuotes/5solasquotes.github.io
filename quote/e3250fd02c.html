<main class="wrap"><figure class="quote" id="q-e3250fd02c" data-kw="">
<blockquote><p>To say that God is absolutely simple, since He is the pure act of existing, is not to have a concept of such an act, but to deny Him, as we have seen, any composition whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/etienne-gilson.html">Etienne Gilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Philosophy of St. Thomas Aquinas</cite>, (Notre Dame, IN: University of Notre Dame Press, 1994), p. 97. Gilson is a Romanist.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-711b1f206b" data-kw="">
<blockquote><p>Simplicity is God, one mere and perfect act without all composition. God calls his name, ‘I am,’ Ex. 3:14, that is, mere essence, wherein is nothing past, nor to come. Because spirits are immixed in respect of bodies, to show that He is not compounded, He says He is a Spirit, Jn. 4:24. When we say that God is a mere and perfect act, the meaning is that God is a cause without any cause, a being that is not from any being; not compounded of an act, by which He is, and possibility, by which He might not have been or may not be: of whom it never could, nor can be said that anything was to be in Him, which was not; or cannot be, that is. That God is a pure and simple act without all composition is evident, because of his perfection; all composition supposes imperfection, because He is the first Being. Were there any composition in God, it would follow there were first and second in God: Something in God that were not first, or that there were more first Beings. Because God is a Being of absolute necessity (Deus est ens necesse esse [God is necessary being]. Smising, Of the One God, tract 2, disp. 2, n. 49): Composition implies either that there must be more beings of absolute necessity, or that there is something in God that may not be. Composition supposes succession, i.e. something past or to come in God; contrary to his name, ‘I am’. Nay it supposes that not-being is not repugnant to the nature of God: Where there is composition, there may be dissolution; dissolution is the way to not-being. It much helps us in the contemplation of the simplicity of God to look upon it as opposed to composition, all the ways whereof the learned have referred to these seven heads. Composition is either of 1. Parts, which are bounded by quantity; as a body having one part upon another.

2. Matter and form; as a man of body and soul: these two compositions are only found in corporeal things.

3. General and special nature: as every species, whose common nature is to be found in some other thing, where the special nature is not; as a living creature and a man. 4.A subject and an accident; as every created substance: There are no accidents in God: He is wise, holy, just, essentially: there is not a substance and a quality in Him. When God is said only to have immortality, 1 Tim. 6:16, it is to be understood by way of eminency; He so has it as none has besides Him: He has it originally, not derivatively and by participation.

5. An act and a possibility-objective that is to be, if the thing looked at as yet is not in being; or [a possibility-]passive that is not to be (though that not-being never shall be), if the thing be looked at as in actual being: this composition holds concerning angels.

6. A person and nature; as Christ, compounded of the divine Person and human nature; which yet is not properly composition of parts, but of number.

7. Being and individuation; that is, that by which we have such a particular being, as humanity and Peter. Objection: Where there is a plurality, there is not simplicity: But in the divine nature there is a plurality: therefore. Answer: The objection holds where there is a plurality of essences, beings or things, but not where there is only a plurality of subsistences. In the divine nature, though there be a Trinity, therefore a plurality of subsistences or Persons, yet there is but one essence: In the Trinity there is distinction, but not composition. Objection 2. The attribute of simplicity concludes that all the attributes are God Himself, and consequently that there is no inequality amongst them: yet we read that his tender mercies are over all his works; so, as it may seem, mercy exceeds the other attributes. Answer: The meaning is that his mercy is over, that is, upon all his works, not that God’s mercy exceeds all his other attributes, as if one attribute were greater than another: for all the attributes of God are equal, not one higher or greater than another, because they are all God Himself. From the simplicity of God it follows:

1. That whatsoever is in God, is God.

2. Whatsoever God wills He willed from eternity and always wills.

3. Whatsoever God wills, He wills simply, absolutely and independently.

4. God is justice, wisdom, love, etc. essentially: although He be said to have them eminently, yet He has them not derivatively.</p></blockquote>

<blockquote><p>The essence of God absolutely considered is that one pure and mere act, by which God is God. Because through weakness of our understanding we cannot apprehend it in any measure by one act, it has pleased God to give unto Himself many names and attributes, by the help of which we may the better conceive thereof.</p></blockquote>

</figure><figure class="quote" id="q-95fb5874b7" data-kw="">
<blockquote><p>The more principal Relative Attributes are in number seven:

1. Creation.

2. Providence.

3. Lordship.

4. Benignity.

5. Mercy.

6. Redemption.

7. Justice. To which, or some of which, the rest of like nature may conveniently be referred. Though the terms Creator, Governor, Redeemer and Lord do more clearly hold forth the relation between God and the creature, yet (after others) the fore-named terms are here made use of: both as sufficiently containing the relation and better conducing to teach the doctrine intended. A new Relative Attribute or praedication does not always presuppose a change in that thing unto which that new relation is given, though it always presupposes a change in that whereunto such relation does really belong: for example sake: Peter may sit at the right hand of John without any change in Peter, the change being only in John who places himself at Peter’s left hand. The princes are said to stand on the right hand of the wall, Neh. 12:31, without any change in the wall; the change was only in them so placing themselves. So God who was not a Creator from eternity, is a Creator in time: yet this new appellation puts no change in God, but only in the creature. The Second Person who was not incarnate from eternity, becomes incarnate in the fulness of time, yet without any change: the change was, and is only in the human nature assumed, not in the divine nature assuming. In these Relative Attributes (the Creator being above the order of the creature), the extremes not being alike, the relation is not alike. The relation on Gods part is only a relation of reason: that is, such a respect of the Creator to the creature, as is without any change in Him: but on the creature’s part, it is a real relation: that is, such a relation as infers a change in it. Relative Attributes add a new predication or title to, but cause no real mutation or change in God: as concerning the creature, they both add a new predication to it and cause a real mutation in it. In all Relative Attributes there are considerable (but especially in Creation, Providence and Redemption) an eternal immanent act, whereby God wills such a thing to be; and a transient temporal act, whereby He works the thing according to his will.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The more principal Relative Attributes are in number seven:

1. Creation.

2. Providence.

3. Lordship.

4. Benignity.

5. Mercy.

6. Redemption.

7. Justice. To which, or some of which, the rest of like nature may conveniently be referred. Though the terms Creator, Governor, Redeemer and Lord do more clearly hold forth the relation between God and the creature, yet (after others) the fore-named terms are here made use of: both as sufficiently containing the relation and better conducing to teach the doctrine intended. A new Relative Attribute or praedication does not always presuppose a change in that thing unto which that new relation is given, though it always presupposes a change in that whereunto such relation does really belong: for example sake: Peter may sit at the right hand of John without any change in Peter, the change being only in John who places himself at Peter’s left hand. The princes are said to stand on the right hand of the wall, Neh. 12:31, without any change in the wall; the change was only in them so placing themselves. So God who was not a Creator from eternity, is a Creator in time: yet this new appellation puts no change in God, but only in the creature. The Second Person who was not incarnate from eternity, becomes incarnate in the fulness of time, yet without any change: the change was, and is only in the human nature assumed, not in the divine nature assuming. In these Relative Attributes (the Creator being above the order of the creature), the extremes not being alike, the relation is not alike. The relation on Gods part is only a relation of reason: that is, such a respect of the Creator to the creature, as is without any change in Him: but on the creature’s part, it is a real relation: that is, such a relation as infers a change in it. Relative Attributes add a new predication or title to, but cause no real mutation or change in God: as concerning the creature, they both add a new predication to it and cause a real mutation in it. In all Relative Attributes there are considerable (but especially in Creation, Providence and Redemption) an eternal immanent act, whereby God wills such a thing to be; and a transient temporal act, whereby He works the thing according to his will.”

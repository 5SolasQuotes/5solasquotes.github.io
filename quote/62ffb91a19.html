<main class="wrap"><figure class="quote" id="q-62ffb91a19" data-kw="">
<blockquote><p>The divine affections or virtues are not distinct dispositions or habits that stand as attributes or functions of will, as they do in human beings, but instead are divine perfections that have some analogy to the dispositions or habits of the human will: ‘for though, properly speaking, there are [no affections] in God, he being a most pure and simple act, free from all commotion and perturbation; yet there being some things said and done by him, which are similar to affections in intelligent beings, [sic] they [that] are ascribed to him; as love, pity, hatred, anger etc., from which must be removed everything that is carnal, sensual, or has any degree of imperfection in it.’ (Gill, Complete Body of Divinity, I, p. 112; cf. Synopsis purioris theologiae, VI.xxxix; Turretin, Inst. theol. elencticae, III.xix.1.) Several writers, most notably Venema, treat these affections not only in relation to the divine will, but also as the affective manifestations of the goodness and holiness of God… The basis for this understanding is the assumption that affections are not essential attributes or original properties but, rather, are ad extra manifestations in which God is known through his effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, pp. 557-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

s." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14e906f598" data-kw="">
<blockquote><p>There is also a certain logic of interrelation of attributes in the orthodox presentation of the voluntary love of God for the world–God’s propensity to love the finite order rests on the grounding of the finite order in the goodness of God: ‘From the goodness springs the love of God, by which God is inclined towards the creature, and delights to do it good, and as it were, to unite himself with it.’ (Pictet, Theol. chr., II.vii.4; cf. Mastricht, Theoretico-practica theol., II.xvii.8; Synopsis purioris theologiae, VI.xl.) The love of God, therefore, belongs to the category of affection, arising inwardly and extending outward, and is not to be understood as a passion, arising because of some outward good that it apprehends and desires. (Beza et al. Propositions and Principles, IX.viii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, p. 566</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-d5e3d138cd" data-kw="">
<blockquote><p>Their heavenly adoption ought to excite them to the exercise of beneficence, that they may imitate their Father’s disposition, “who makes his sun to rise on the evil and on the good,” (Mt. 5:45) There is nothing in which men resemble God more truly than in doing good to others.</p></blockquote>

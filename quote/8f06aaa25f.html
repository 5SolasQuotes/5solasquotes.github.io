<main class="wrap"><figure class="quote" id="q-8f06aaa25f" data-kw="">
<blockquote><p>Thesis XVII. ὁμούσια (homousia) or ὁμοούσια (homoousia)… And so this term was adopted for divine phenomena in order to refute the Arians, who claimed that the Son was from the Father—not begotten from the Father’s substance but made ex nihilo. Consequently, they claim, the Son is God by participating in his power, not by nature. Therefore, against such men it was decided that the Son is ὁμούσιον (homousion) or ὁμοούσιον (homoousion) with the Father. They did not, however, intend by this term merely that the essence of the Father and of the Son is similar, as is the case in natural phenomena (this is how two essences numerically would be taken, and thus there would be numerically two gods, which is anathema). Instead, they wished to describe two realities: first, that the Son is not different from the Father in essence, not because he was made ex nihilo, but as he was begotten from the Father himself, and so from eternity. This distinction they marked by another term, coeternal. Second, that he is from the Father insofar as he is the Son, such that he is one with the Father insofar as he is God. That is to say, that the Son’s essence is not somehow a derivative essence which took its origin from another principal. The heretics called this notion ex traduce, and today some men advance this idea under the term essentiation. But we assert that the actual, complete essence—by which the Father is God—is the Son by begetting, as the essence has been shared with him by the Father. As a result, Father and Son—insofar as they subsist in one and the same essence, or are of one and the same essence numerically, with respect to essence—are the one and same God, although, nevertheless the Father is not the Son. … Thesis XX. The ancients used these formulas [such as homoousios and homousios] not to convey the notion of a plurality of essences but to show that there was identity of essence in the relations of the persons, against those who said that Christ was made ex nihilo and in fact made in time. For statements of the Arians like the following lead to that understanding: “there was a time when he was not” and, “he was created from things that were not.” In other words, that he was established from things that did not exist. Therefore the Fathers added to the Creed the phrase “true God from true God” to show that God from whom God exists, i.e., the Father, and God who is from God, i.e., the Son, are by reason of essence one God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Beza on the Trinity</cite>, 21 Theses’ from Tractationes Theologicae Bezae, Volumen I (Geneva: Jean Crespin, 1570), p. 651 trans. David Noe</span></figcaption>

it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f7b0b8747b" data-kw="">
<blockquote><p>There are, indeed, very many other things that are taught and disputed about this doctrine of the Trinity, as: the manner of the eternal generation of the Son, of the essence of the Father, of the rocession of the Holy Ghost, and the difference of it from the generation of the Son, of the mutual in-being of the persons, by reason of their unity in the same substance or essence, the nature of their personal subsistence, with respect unto the properties whereby they are mutually distinguished; all which are true and defensible against all the sophisms of the adversaries of this truth. Yet, because the distinct apprehension of them, and their accurate expression, is not necessary unto faith, as it is our guide and principle in and unto religious worship and obedience, they need not here be insisted on. Nor are those brief explications themselves before mentioned so proposed as to be placed immediately in the same rank or order with the original revelations before insisted on, but only are pressed as proper expressions of what is revealed, to increase our light and farther our edification. And although they cannot rationally be opposed or denied, nor ever were by any, but such as deny and oppose the things themselves as revealed, yet they that do so deny or oppose them, are to be required positively, in the first place, to deny or disapprove the oneness of the Deity, or to prove that the Father, or Son, or Holy Ghost, in particular, are not God, before they be allowed to speak one word against the manner of the explication of the truth concerning them. For either they grant the revelation declared and contended for, or they do not. If they do, let that concession be first laid down, namely that the Father, Son, and Spirit, are one God; and then let it be debated, whether they are one in substance and three in persons, or how else the matter is to be stated. If they deny it, it is a plain madness to dispute of the manner of anything, and the way of expressing it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Trinity Explained &amp; Vindicated</cite>, pp. 407-8 in Works ed. William H. Goold (NY: Robert Carter, 1851), vol. 2</span></figcaption>

</figure><figure class="quote" id="q-78b58b0641" data-kw="person hypostasis">
<blockquote><p>Hence it is evident what must be understood by the word “person.” That which among the Greeks is called “hypostasis” is with the Latins called persona.… properly and strictly, it denotes an intellectual suppositum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.23.7</span></figcaption>

— Francis Turretin, Institutes of Elenctic Theology, 3.23.7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHence%20it%20is%20evident%20what%20must%20be%20understood%20by%20the%20word%20%E2%80%9Cperson.%E2%80%9D%20That%20which%20among%20the%20Greeks%20is%20called%20%E2%80%9Chypostasis%E2%80%9D%20is%20with%20the%20Latins%20called%20persona.%E2%80%A6%20properly%20and%20strictly%2C%20it%20denotes%20an%20intellectual%20suppositum.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.23.7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F78b58b0641.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/78b58b0641.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-32dae4c0c5" data-kw="">
<blockquote><p>The words Father, Son, and Holy Spirit, certainly indicate a real distinction, not allowing us to suppose that they are merely epithets by which God is variously designated from his works. Still they indicate distinction only, not division. The passages we have already quoted show that the Son has a distinct subsistence from the Father, because the Word could not have been with God unless he were distinct from the Father; nor but for this could he have had his glory with the Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a> › <a href="../topics/the-trinity/the-persons/distinct-persons.html">Distinct persons</a></span></div>

</figure><figure class="quote" id="q-698d53b4a3" data-kw="">
<blockquote><p>The Reformed orthodox did not only deal with the internal distinguishing marks of the Trinitarian persons, but also with their outward marks, the ‘oecumenical offices of the three persons,’ as Mastricht labeled them (Mastricht 1699, 238-40; Neele 2009, 245-78). These outward marks concern works that are appropriated to specific persons, like creation preeminently to the Father, redemption to the incarnate Son, and sanctification to the Holy Spirit (Te Velde et al. 2014, 192-93). This was not meant to deny that ultimately all Trinitarian persons participate in these works, in accordance with the rule that the externally directed works of the Trinity are undivided (opera trinitatis ad extra indivisa sunt) (Mastricht 1699, 239). To be sure, this rule applies to immanent acts that are directed ad extra, like the divine decrees or decisions, just as to the external divine works ad extra, like creation and providence.</p></blockquote>

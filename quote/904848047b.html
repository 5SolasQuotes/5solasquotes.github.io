<blockquote><p>Henry Wace (1836-1924) made the following observations on the prominence that the Reformers, particularly those who wrote the Augsburg Confession in 1530, gave to the doctrine of original sin (we would not commit ourselves to every expression that he uses):

But what is the reason why this doctrine assumes such prominence? It is because the whole movement started out of a deeper apprehension of the corruption and evil of human nature than had, perhaps, prevailed in the Church since the time of St Augustine. The main tendency of Middle Age theology was Pelagian.

Bradwardine, the Doctor Profundus, for a brief time Archbishop of Canterbury in 1349, declared that the whole world of his day had gone after Pelagius; and at the time of the Reformation, though orthodoxy might be saved by subtle distinctions, the practical effect of the prevalent teaching was to throw men upon their own efforts upon their own obedience, at all events, to the rules of religion and of the Church for their salvation, and for their attainment of perfection. The mere fact, the unquestionable fact, that forgiveness could, under express Papal authority, be bought for a price, is sufficient to prove that there was, at all events, prevalent a grave obscuration of the deadly nature of sin and of human evil.

The Reformers, however, did not approach this subject as a technical theological doctrine. They came to it as to a matter of deep personal experience. They felt in themselves, and they awakened in others, an intense feeling that man was very far gone – quam longissimi – from original righteousness, from the nature and the perfection for which he was intended, and consequently that he must needs abandon all idea of hope or help from his own powers.

For this purpose, it will be observed, they bring into special prominence man’s failure to live in the due love and fear of God. They say that men are born “with sin, that is, without fear of God, without trust towards God, and with concupiscence – cum peccato, hoc est sine metu Dei, sine fiducia erga Deum et cum concupiscentia” The lust of concupiscence is not the starting-point of the evil, but its consequence. In proportion as men do not live in the love and fear of God, the passions of their lower nature are inevitably let loose, and fall into disorder.

The characteristic teaching of the later schoolmen on this point was that the fall did but remove an addition which had been made by God to the natural endowments of man. But the Reformers regarded the fall as having removed the main spring, deprived human nature of its sun and centre, and thus involved it in utter ruin and confusion. For the mere functions of civil life, it retains to a great extent the power of free-will and self-government; though even in this sphere it can only be kept in tolerable order by the stern administration of law, and its evil impulses are perpetually at work. [1] But for the higher purposes of the soul, for its ideal life, a fall from God was a fall from everything.

When they looked into their own hearts, or when they looked around them, and saw the widespread absence of the habit of living in God, with God, and for God, it appeared to them like a permanent solar eclipse in the spiritual world, and they could not use language strong enough to express their sense of the fearful disaster which it involved.</p></blockquote>

<blockquote><p>5. Was original righteousness natural to man? The opinion of the papists XLIV. It is asked, fifth, whether original righteousness was natural to man. The Pelagianizing papists—so that they may obtain: (1) that concupiscence, whose second acts only does original righteousness control, and whose first act it does not take away, is not itself sin, and accordingly, if it does not stand in the way, man can be perfect here and now; (2) that man was created in purely natural things, that is, by nature, neither just nor unjust; (3) that the natural things of man survived whole after the fall—admit indeed an original righteousness, but one that is supernatural to man, added to nature, so that it may check the natural discord of the flesh and spirit. Meanwhile, they do not deny that it arose with man, and that it would have helped him even in natural things. And the opinion of the Reformed with their reasons The Reformed, although they do not acknowledge that original righteousness (as Flacius [a radical Lutheran] desired) is the very nature of man, yet do acknowledge that it is natural to man, insofar as it was owed to his integral nature in such a way that it could not be morally whole without it. For if (1) it were supernatural, then its opposite, that is, carnal concupiscence or the discord of flesh and spirit, would be natural to man, and thus good and from God, which is contrary to the Scriptures (Rom. 7:7–8; 1 John 2:16). (2) Thus the rebellion of the flesh against the spirit would be natural to man, without any previous demerit, by the condition of nature that was conferred by God, and accordingly, God would be the author of sin. Then (3) blessedness was the natural end of man, and accordingly, so also was righteousness and holiness, without which he could not have achieved blessedness (Rev. 21:27; 1 Cor. 15:50). Objections The arguments of the papists for the most part coincide with the Socinian arguments against original righteousness. For they allege: (1) that there is a natural contrariety of flesh and spirit, of body and soul, and thus original righteousness was not natural. I respond, We previously denied against the Socinians that this obtained in the state of integrity, where a most perfect harmony thrived until the point of sin. (2) That the gifts conferred upon the first man are called honor and glory (Ps. 8:5), which without a doubt are extrinsic and accessory to man, not natural. I respond: (a) The psalmist calls “honor and glory” not only original righteousness, but also the rule of man over the earthly creatures. Then also (b) in a sound sense, original righteousness is honor and glory (Rom. 3:23), insofar as it is the foundation of all honor and glory, and in that sense it was not something extrinsic to man, but something especially intrinsic. Bellarmine has certain other arguments (vol. 4, bk. 1), but they are of no significance; if anyone desires to know more, he may consult his antagonists: Ames, Pareus, and others.85 85. Bellarmine, De controversiis Christianae Fidei in Opera Omnia (Paris: L. Vivès, 1870–91), 5:169–213; William Ames, Bellarminus Enervatus, 4 vols. (Amsterdam: Joannes Janssonius, 1628–29), 4: 5–12; e.g. David Pareus, Quaestiones controversae theologicae…adversus Bellarminum (Schönfeld, 1612); idem, Rob. Bellarmini de justificatione impii libri explicati et castigati studio Davidis Parei (Heidelberg: Jonah Rosa, 1615).</p></blockquote>

<blockquote><p>Let us mark what kind of Being the Redeemer of mankind must needs be, in order to provide eternal redemption for sinners. If no one less than the Eternal God, the Creator and Preserver of all things, could take away the sin of the world, sin must be a far more abominable thing in the sight of God than most men suppose. The right measure of sin’s sinfulness is the dignity of Him who came into the world to save sinners. If Christ is so great, then sin must indeed be sinful!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels: John, Volume One</cite>, (1869; Edinburgh: Banner of Truth, 1987), p. 4.</span></figcaption>

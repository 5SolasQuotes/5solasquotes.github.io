<main class="wrap"><figure class="quote" id="q-948097ede3" data-kw="">
<blockquote><p>Be most assured, that there hath been somewhat or other from all eternity, or that looking backward, somewhat of real being must be confessed eternal. Let such, as have not been used to think of any thing more than what they could see with their eyes; and to whom reasoning only seems difficult, because they have not tried what they can do in it; but use their thoughts a little, and by moving them a few easy steps, they will soon find themselves as sure of this, as that they see or hear, or understand, or are any thing.

For being sure that something now is (that you see, for instance, or are something.) You must then acknowledge that certainly either something always was, and hath ever been, or been from all eternity; or else you must say, that sometime nothing was; or that all being once was not. And so, since you find that something now is, that there was a time when any thing of being did begin to be, that is, that till that time there was nothing; But now at that time somewhat first began to be. For what can be plainer than that, if all being sometime was not, and now some being is, every thing of being had a beginning? And thence it would follow that some being, that is, the first that ever began to be, did of it self start up out of nothing, or made it self to be, when before, nothing was.

But now do you not plainly see that it is altogether impossible any thing should do so; that is, when it was as yet nothing, and when nothing at all as yet was, that it should make it self, or come into being of it self? For sure, making it self is doing something. But can that which is nothing do any thing? unto all doing there must be some doer. Wherefore a thing must be before it can do any thing; and therefore it would follow that it was before it was; or was and was not, was some thing and nothing at the same time. Yea, and it was divers from it self. For a cause must be a distinct thing from that which is caused by it. Wherefore it is most apparent that some being hath ever been, or did never begin to be. Whence further,

… It is also evident, that some being was uncaused, or was ever of it self, without any cause. For what never was from another had never any cause, since nothing could be its own cause. And somewhat, as appears from what hath been said, never was from another. Or it may be plainly argued thus; That either some being was uncaused, or all being was caused. But if all being were caused, then some one at least was the cause of it self: which hath been already shown impossible. Therefore the expression commonly used concerning the first Being that it was of it self, is only to be taken negatively, that is, that it was not of another, not positively, as if it did sometime make it self. Or, what there is positive, signified by that form of speech, is only to be taken thus, that it was a being of that nature, as that it was impossible it should ever not have been. Not that it did ever of it self step out of not being into Being: …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The living temple, or, A designed improvement of that notion that a good man is the temple of God</cite>, (London: John Starkey, 1675), pp 30-32.</span></figcaption>

<blockquote><p>Thus did our Lord Jesus honour and hallow the first day of the week by giving the Sanctifier and the Comforter thereon. So did he shed Him forth in his miraculous Gifts and in his saving Graces, abundantly on that day. He poured out the Blessing from on high, and blessed the Day, to be an holy Sabbath unto Himself; and unto us, the day for our “seeking and receiving spiritual blessings. Such Actions (says One) do as fully declare and express the mind and will of Heaven as any words could do — Especially if we find (as we do) in the sacred Writings, that the Apostles and primitive Christians did thenceforth observe the first day of the week for their religious Assemblies, and for the Administration of the special Ordinances of Christ thereon.

And this we do expressly read, that they did come together on the first day of the week to break bread, and that Paul preached to them. Act. 20.7. They were wont to come together to hear and to receive the Sacrament of the Lord’s Supper, on that day. It is spoken of as their usual practice, and they were “under the infallible Direction of the Holy Ghost in Actions of this nature and importance. So that their Example and practice herein must amount to a Law and Institution to the Christian Church; interpreting to us the mind and giving us the will of Christ in this matter. And to borrow the words of a late Writer,

As Moses was faithful in settling the matters of the Jewish worship and of the Tabernacle, being authorised by God and guided by him in the doing it; so the Apostles were to settle the Orders of the Gospel Church, and were faithful to Him who appointed them — Moreover you know, how that the Apostle Paul directed the Church of Corinth, and the Churches of Galatia, to have their Collections for the Saints on the first day of the week; So (says he) I have given order, and so do ye: Upon the first day of the week let every one lay by him in store, as God has prospered him. 1 Cor. 16.1, 2. — Some have observed, and the remark is of great weight,

That the first day of the week is the only day spoken of thro’ the New Testament, as a day religiously observed; but that this day is several times over so spoken of. A day sacred in the Apostles’ times for Holy fellowship and communion, for breaking of bread and for prayers, and for works of piety and charity; for the public testimony of their faith in Christ and love to all his Saints.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus did our Lord Jesus honour and hallow the first day of the week by giving the Sanctifier and the Comforter thereon. So did he shed Him forth in his miraculous Gifts and in his saving Graces, abundantly on that day. He poured out the Blessing from on high, and blessed the Day, to be an holy Sabbath unto Himself; and unto us, the day for our “seeking and receiving spiritual blessings. Such Actions (says One) do as fully declare and express the mind and will of Heaven as any words could do — Especially if we find (as we do) in the sacred Writings, that the Apostles and primitive Christians did thenceforth observe the first day of the week for their religious Assemblies, and for the Administration of the special Ordinances of Christ thereon.

And this we do expressly read, that they did come together on the first day of the week to break bread, and that Paul preached to them. Act. 20.7. They were wont to come together to hear and to receive the Sacrament of the Lord’s Supper, on that day. It is spoken of as their usual practice, and they were “under the infallible Direction of the Holy Ghost in Actions of this nature and importance. So that their Example and practice herein must amount to a Law and Institution to the Christian Church; interpreting to us the mind and giving us the will of Christ in this matter. And to borrow the words of a late Writer,

As Moses was faithful in settling the matters of the Jewish worship and of the Tabernacle, being authorised by God and guided by him in the doing it; so the Apostles were to settle the Orders of the Gospel Church, and were faithful to Him who appointed them — Moreover you know, how that the Apostle Paul directed the Church of Corinth, and the Churches of Galatia, to have their Collections for the Saints on the first day of the week; So (says he) I have given order, and so do ye: Upon the first day of the week let every one lay by him in store, as God has prospered him. 1 Cor. 16.1, 2. — Some have observed, and the remark is of great weight,

That the first day of the week is the only day spoken of thro’ the New Testament, as a day religiously observed; but that this day is several times over so spoken of. A day sacred in the Apostles’ times for Holy fellowship and communion, for breaking of bread and for prayers, and for works of piety and charity; for the public testimony of their faith in Christ and love to all his Saints.”

— Benjamin Colman, The doctrine and law of the Holy Sabbath: in the order wherein it lies through the Scriptures of the Old and New Testament. In two sermons, preached at the lecture in Boston, October 15. and December 10. 1724, (Boston: Thomas Hancock, 1725), pp 27-30.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+did+our+Lord+Jesus+honour+and+hallow+the+first+day+of+the+week+by+giving+the+Sanctifier+and+the+Comforter+thereon.+So+did+he+shed+Him+forth+in+his+miraculous+Gifts+and+in+his+saving+Graces%2C+abundantly+on+that+day.+He+poured+out+the+Blessing+from+on+high%2C+and+blessed+the+Day%2C+to+be+an+holy+Sabbath+unto+Himself%3B+and+unto+us%2C+the+day+for+our+%E2%80%9Cseeking+and+receiving+spiritual+blessings.+Such+Actions+%28says+One%29+do+as+fully+declare+and+express+the+mind+and+will+of+Heaven+as+any+words+could+do+%E2%80%94+Especially+if+we+find+%28as+we+do%29+in+the+sacred+Writings%2C+that+the+Apostles+and+primitive+Christians+did+thenceforth+observe+the+first+day+of+the+week+for+their+religious+Assemblies%2C+and+for+the+Administration+of+the+special+Ordinances+of+Christ+thereon.%0A%0AAnd+this+we+do+expressly+read%2C+that+they+did+come+together+on+the+first+day+of+the+week+to+break+bread%2C+and+that+Paul+preached+to+them.+Act.+20.7.+They+were+wont+to+come+together+to+hear+and+to+receive+the+Sacrament+of+the+Lord%E2%80%99s+Supper%2C+on+that+day.+It+is+spoken+of+as+their+usual+practice%2C+and+they+were+%E2%80%9Cunder+the+infallible+Direction+of+the+Holy+Ghost+in+Actions+of+this+nature+and+importance.+So+that+their+Example+and+practice+herein+must+amount+to+a+Law+and+Institution+to+the+Christian+Church%3B+interpreting+to+us+the+mind+and+giving+us+the+will+of+Christ+in+this+matter.+And+to+borrow+the+words+of+a+late+Writer%2C%0A%0AAs+Moses+was+faithful+in+settling+the+matters+of+the+Jewish+worship+and+of+the+Tabernacle%2C+being+authorised+by+God+and+guided+by+him+in+the+doing+it%3B+so+the+Apostles+were+to+settle+the+Orders+of+the+Gospel+Church%2C+and+were+faithful+to+Him+who+appointed+them+%E2%80%94+Moreover+you+know%2C+how+that+the+Apostle+Paul+directed+the+Church+of+Corinth%2C+and+the+Churches+of+Galatia%2C+to+have+their+Collections+for+the+Saints+on+the+first+day+of+the+week%3B+So+%28says+he%29+I+have+given+order%2C+and+so+do+ye%3A+Upon+the+first+day+of+the+week+let+every+one+lay+by+him+in+store%2C+as+God+has+prospered+him.+1+Cor.+16.1%2C+2.+%E2%80%94+Some+have+observed%2C+and+the+remark+is+of+great+weight%2C%0A%0AThat+the+first+day+of+the+week+is+the+only+day+spoken+of+thro%E2%80%99+the+New+Testament%2C+as+a+day+religiously+observed%3B+but+that+this+day+is+several+times+over+so+spoken+of.+A+day+sacred+in+the+Apostles%E2%80%99+times+for+Holy+fellowship+and+communion%2C+for+breaking+of+bread+and+for+prayers%2C+and+for+works+of+piety+and+charity%3B+for+the+public+testimony+of+their+faith+in+Christ+and+love+to+all+his+Saints.%E2%80%9D%0A%0A%E2%80%94+Benjamin+Colman%2C+The+doctrine+and+law+of+the+Holy+Sabbath%3A+in+the+order+wherein+it+lies+through+the+Scriptures+of+the+Old+and+New+Testament.+In+two+sermons%2C+preached+at+the+lecture+in+Boston%2C+October+15.+and+December+10.+1724%2C+%28Boston%3A+Thomas+Hancock%2C+1725%29%2C+pp+27-30.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3e744eec32.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3e744eec32.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2024/05/26/benjamin-colman-on-the-apostolic-observance-of-the-first-day-of-the-week/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

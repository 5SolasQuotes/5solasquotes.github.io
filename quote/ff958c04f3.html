<main class="wrap"><figure class="quote" id="q-ff958c04f3" data-kw="">
<blockquote><p>It is asked: Does fortune reign, according to the Arminians? They deny it; we prove that fortune dominates in everything, according to them. … 5. Because Prov. 16:33: “The lot is cast into the lap, but its every decision is from Jehovah.” But that is false, for the decision of the lot, and its determination, so that it be white rather than black, is either from the hand apprehending the lot, or from the lots themselves, or from God, or from fortune. Not from the hand, because the bare contact is of itself blind, nor is it directed by any light or instinct, so that it apprehends this lot rather than that one. Not from the lots themselves, because the whole question is about the lots; for they are of themselves determinable and indifferent. Nor is the decision from God, because the adversaries deny that God determines second contingent causes; and they teach that He concurs with them by a universal concourse indifferent and determinable, from which neither is the apprehension of the white lot, rather than the black. Therefore, it is from fortune alone, or from mere and absolute contingency, by which contingent causes, loosed from all predetermining action of God, and notwithstanding all action of God, can act or not act; and this certainly is a cause superior to God, which is not ruled by God, and is blind fortune itself. Because if it is fortune, it is not providence; and if it is providence, it is not fortune.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism tr. by AI by Onku (1639-1642; 1668) | ch. 2, On God, Title 5, Will of God, on Lk. 21:18, “But not a hair of your head will perish.”</cite>, pp. 140-41</span></figcaption>

</figure><figure class="quote" id="q-fa89377c4b" data-kw="">
<blockquote><p>It is asked, do the Remonstrants rightly ascribe to us that God forsakes us before we forsake Him? I respond: Calumniously. For if the discussion is about desertion by way of merit, we forsake God first: 1. Because the merit of sin precedes punishment. 2. Because God, punishing antecedent sins by subsequent ones, punishes by forsaking sinners. But if the discussion is about desertion purely negative and not culpable, by which God denies predetermining grace, which he owes to no one; then God forsakes us before we forsake Him: 1. Because God withdrew from Adam predetermining grace (or as Calvin calls it in his Response to the Calumnies of a Certain Worthless Fellow, p. 1016, ‘fortitude and constancy’), which, if given, he would have stood. 2. Because grace would not be grace, if it depended on the nod of free will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism tr. by AI by Onku (1639-1642; 1668)</cite>, ch. 13, on Rom. 7:17, p. 380</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-77eaa862ef" data-kw="">
<blockquote><p>[Scotus:] ‘That the effect is not right is caused now not because of the prior cause, which on its own part would cause rightly if the second cause were to cause; but because of the defect of the secondary cause, which in its power has the option of co-causing with the first cause or not cocausing. And if it does not co-cause with the first cause as it is bound to, there is no rectitude in the common effect of both.&#x27;</p></blockquote>

<blockquote><p>…there is a great temptation arising upon the consideration of our own indignity. For when our sins come to our remembrance, they drive us from the presence of God and make us that we dare not pray. Now the remedy is this. We must come clothed with Christ into the presence of God. We may not come in our names, but we must come in His name and present the merit of Christ unto the Father, even as if we were one and the same person with Him. Thus shall we be accepted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 236.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ed3a9d77a" data-kw="">
<blockquote><p>As for the Love-feasts used in the primitive Church:

1. They had no religious state in divine worship, but were used only as moral signs of mutual charity. The Rhemists [Romanists] will have them called Coenas dominicas. But what-says Cartwright against them? ‘We grant that there were such feasts used in times past, but they were called by the name of [Greek] or Love-feasts, not by the name of the Lord’s Supper: neither could one without sacrilege give so holy a name to a common feast, which never had ground out of the Word, and which after for just cause was thrust out by the Word of God.’

2. If it be thought, that they were used as sacred signs of Christian charity, because they were eaten in the Church. I answer, the eating of them in the Church is forbidden by the apostle. ‘What?’ says he, ‘have ye not houses to eat and to drink in?’ or despise ye the Church of God? Aperte vetat, says [David] Pareus: commessationes in Ecclesia, quocunque fueo pingantur. Vocabant [Greek] charitates: sed nihil minus erant. Erant schismatum fomenta. Singulae enim sectae suas instituebant. And a little after: Aliquae Ecclesiae obtemperasse videntur. Nam Iustini temporibus Romana Ecclesia [Greek] non habuit. (Commentary in that place)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Beginning in the second half of the sixth century, a slow but steady diffusion of icons of saints, of Christ, and of the Virgin is evident in the Empire… These icons do not, however, indicate the prevalence of a form of icon worship during this period, for most of them were, in fact, ‘simple commemorative and ex voto images,’ with the exception of some that were considered relics and therefore endowed with miraculous or intercessory powers. The origin of the cult of icons apparently dates to a later time, probably toward the end of the seventh century.</p></blockquote>

</figure><figure class="quote" id="q-ea6137d763" data-kw="">
<blockquote><p>We think to deny the lawfulness of public fasting on the Lord’s day, as if the Christian Sabbath were a day only of spiritual feasting and rejoicing, because that day Christ ended the work of redemption and second creation, is a wronging of the Christian Sabbath, which is ordained for the whole public worship of God, joying, sorrowing for sin, learning God’s will in all and every point, as the Jewish Sabbath was not ordained only for meditation on the work of creation, but for worships of all kinds: The worship of this day, Acts 20:7, is as large as preaching, and being in the Spirit, on the Lord’s day, and seeing the visions of God, Rev. 1:10-12, and the whole ordinary public worship. It is then too narrow to restrict all our Sabbath-worship to one single act of festival rejoicing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, ch. 20, Article 7</span></figcaption>

</figure><figure class="quote" id="q-eaf1d5cb57" data-kw="">
<blockquote><p>They offered fire that God had not commanded. Hence I say that all things in Gods worship must have a warrant out of God’s Word, must be commanded. It’s not enough that it is not forbidden: I beseech you observe it: it is not enough that a thing is not forbidden, and what hurt is there in it? But it must be commanded: I confess in matters that are civil and natural, there this may be enough; If it be but according to the rules of prudence, and not forbidden in the Word; we may make use of this in civil and natural things. But now when we come to matters of religion, and the worship of God, we must either have a command, or some what out of God’s Word by some consequence drawn from some command wherein God manifests his will; either a direct command, or by comparing one thing with another, or drawing consequences plainly from the words. We must have a warrant of the worship of God… It’s true, there are some things in the worship of God that are natural and civil helps, and there we need not have any command: As for instance; when we come to worship God, the congregation meets, they must have a convenient place to keep the air and weather from them: now this is but a natural help, and so far as I use the place of worship as a natural help I need have no command. But if I will put any thing in a place beyond what it has in its own nature, there I must look for a command. For if I account one place more holy than another; or to think that God should accept of worship in one place rather than in another: This is to raise it above what it is in its own nature. So that when any creature is raised in a religious way, above what it has in it by nature; if I have not Scripture to warrant me I am therein superstitious. It’s a very useful rule for to help you: If any creature that you make any use of in a way of religion beyond what it has in its own nature, if you have not some warrant from the Word of God (whatsoever specious show there may be in it) it is superstition. As now for the place, there was a place that was holy, but then it had an institution from God. And so for garments, to use those that are decent, the light of reason is enough: but if I will put any thing upon them beyond what there is in them in their own nature, as heretofore in a surplice, what, had that any more decency in its own nature, but only man’s institution? Now when man shall put a religious respect upon a thing, by virtue of his own institution when he has not a warrant from God; here’s superstition! … Now God has written the law of natural worship in our hearts, as that we should love God, fear God, trust in God, and pray to God; this God has written in our hearts: But there are other things in the worship of God that are not written in our hearts, that only depend upon the Will of God revealed in his Word, which were no duties except they were revealed in his Word. And these are of such a nature as we can see no reason for, but only this, because God will have them. As now, there are many kinds of ceremonies to manifest honor to princes that there is no reason for them at all, but merely because it is a civil institution so appointed: So God would have some ways for the honoring of Him, that the creature should not see into the reason of them, but merely the Will of God to have them so:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, … (London, 1653), Sermon 1, pp. 9-11</span></figcaption>

<div class="actions"><button class="copy" data-copy="“They offered fire that God had not commanded. Hence I say that all things in Gods worship must have a warrant out of God’s Word, must be commanded. It’s not enough that it is not forbidden: I beseech you observe it: it is not enough that a thing is not forbidden, and what hurt is there in it? But it must be commanded: I confess in matters that are civil and natural, there this may be enough; If it be but according to the rules of prudence, and not forbidden in the Word; we may make use of this in civil and natural things. But now when we come to matters of religion, and the worship of God, we must either have a command, or some what out of God’s Word by some consequence drawn from some command wherein God manifests his will; either a direct command, or by comparing one thing with another, or drawing consequences plainly from the words. We must have a warrant of the worship of God… It’s true, there are some things in the worship of God that are natural and civil helps, and there we need not have any command: As for instance; when we come to worship God, the congregation meets, they must have a convenient place to keep the air and weather from them: now this is but a natural help, and so far as I use the place of worship as a natural help I need have no command. But if I will put any thing in a place beyond what it has in its own nature, there I must look for a command. For if I account one place more holy than another; or to think that God should accept of worship in one place rather than in another: This is to raise it above what it is in its own nature. So that when any creature is raised in a religious way, above what it has in it by nature; if I have not Scripture to warrant me I am therein superstitious. It’s a very useful rule for to help you: If any creature that you make any use of in a way of religion beyond what it has in its own nature, if you have not some warrant from the Word of God (whatsoever specious show there may be in it) it is superstition. As now for the place, there was a place that was holy, but then it had an institution from God. And so for garments, to use those that are decent, the light of reason is enough: but if I will put any thing upon them beyond what there is in them in their own nature, as heretofore in a surplice, what, had that any more decency in its own nature, but only man’s institution? Now when man shall put a religious respect upon a thing, by virtue of his own institution when he has not a warrant from God; here’s superstition! … Now God has written the law of natural worship in our hearts, as that we should love God, fear God, trust in God, and pray to God; this God has written in our hearts: But there are other things in the worship of God that are not written in our hearts, that only depend upon the Will of God revealed in his Word, which were no duties except they were revealed in his Word. And these are of such a nature as we can see no reason for, but only this, because God will have them. As now, there are many kinds of ceremonies to manifest honor to princes that there is no reason for them at all, but merely because it is a civil institution so appointed: So God would have some ways for the honoring of Him, that the creature should not see into the reason of them, but merely the Will of God to have them so:”

— Jeremiah Burroughs, Gospel Worship… (London, 1653), Sermon 1, pp. 9-11">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+offered+fire+that+God+had+not+commanded.+Hence+I+say+that+all+things+in+Gods+worship+must+have+a+warrant+out+of+God%E2%80%99s+Word%2C+must+be+commanded.+It%E2%80%99s+not+enough+that+it+is+not+forbidden%3A+I+beseech+you+observe+it%3A+it+is+not+enough+that+a+thing+is+not+forbidden%2C+and+what+hurt+is+there+in+it%3F+But+it+must+be+commanded%3A+I+confess+in+matters+that+are+civil+and+natural%2C+there+this+may+be+enough%3B+If+it+be+but+according+to+the+rules+of+prudence%2C+and+not+forbidden+in+the+Word%3B+we+may+make+use+of+this+in+civil+and+natural+things.+But+now+when+we+come+to+matters+of+religion%2C+and+the+worship+of+God%2C+we+must+either+have+a+command%2C+or+some+what+out+of+God%E2%80%99s+Word+by+some+consequence+drawn+from+some+command+wherein+God+manifests+his+will%3B+either+a+direct+command%2C+or+by+comparing+one+thing+with+another%2C+or+drawing+consequences+plainly+from+the+words.+We+must+have+a+warrant+of+the+worship+of+God%E2%80%A6+It%E2%80%99s+true%2C+there+are+some+things+in+the+worship+of+God+that+are+natural+and+civil+helps%2C+and+there+we+need+not+have+any+command%3A+As+for+instance%3B+when+we+come+to+worship+God%2C+the+congregation+meets%2C+they+must+have+a+convenient+place+to+keep+the+air+and+weather+from+them%3A+now+this+is+but+a+natural+help%2C+and+so+far+as+I+use+the+place+of+worship+as+a+natural+help+I+need+have+no+command.+But+if+I+will+put+any+thing+in+a+place+beyond+what+it+has+in+its+own+nature%2C+there+I+must+look+for+a+command.+For+if+I+account+one+place+more+holy+than+another%3B+or+to+think+that+God+should+accept+of+worship+in+one+place+rather+than+in+another%3A+This+is+to+raise+it+above+what+it+is+in+its+own+nature.+So+that+when+any+creature+is+raised+in+a+religious+way%2C+above+what+it+has+in+it+by+nature%3B+if+I+have+not+Scripture+to+warrant+me+I+am+therein+superstitious.+It%E2%80%99s+a+very+useful+rule+for+to+help+you%3A+If+any+creature+that+you+make+any+use+of+in+a+way+of+religion+beyond+what+it+has+in+its+own+nature%2C+if+you+have+not+some+warrant+from+the+Word+of+God+%28whatsoever+specious+show+there+may+be+in+it%29+it+is+superstition.+As+now+for+the+place%2C+there+was+a+place+that+was+holy%2C+but+then+it+had+an+institution+from+God.+And+so+for+garments%2C+to+use+those+that+are+decent%2C+the+light+of+reason+is+enough%3A+but+if+I+will+put+any+thing+upon+them+beyond+what+there+is+in+them+in+their+own+nature%2C+as+heretofore+in+a+surplice%2C+what%2C+had+that+any+more+decency+in+its+own+nature%2C+but+only+man%E2%80%99s+institution%3F+Now+when+man+shall+put+a+religious+respect+upon+a+thing%2C+by+virtue+of+his+own+institution+when+he+has+not+a+warrant+from+God%3B+here%E2%80%99s+superstition%21+%E2%80%A6+Now+God+has+written+the+law+of+natural+worship+in+our+hearts%2C+as+that+we+should+love+God%2C+fear+God%2C+trust+in+God%2C+and+pray+to+God%3B+this+God+has+written+in+our+hearts%3A+But+there+are+other+things+in+the+worship+of+God+that+are+not+written+in+our+hearts%2C+that+only+depend+upon+the+Will+of+God+revealed+in+his+Word%2C+which+were+no+duties+except+they+were+revealed+in+his+Word.+And+these+are+of+such+a+nature+as+we+can+see+no+reason+for%2C+but+only+this%2C+because+God+will+have+them.+As+now%2C+there+are+many+kinds+of+ceremonies+to+manifest+honor+to+princes+that+there+is+no+reason+for+them+at+all%2C+but+merely+because+it+is+a+civil+institution+so+appointed%3A+So+God+would+have+some+ways+for+the+honoring+of+Him%2C+that+the+creature+should+not+see+into+the+reason+of+them%2C+but+merely+the+Will+of+God+to+have+them+so%3A%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel+Worship%E2%80%A6+%28London%2C+1653%29%2C+Sermon+1%2C+pp.+9-11&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feaf1d5cb57.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eaf1d5cb57.html">Permalink</a><a class="src" href="http

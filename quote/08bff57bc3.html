<main class="wrap"><figure class="quote" id="q-08bff57bc3" data-kw="">
<blockquote><p>…they [the apostolic Church] practiced all the ordinances directed, though they had no written directory¹ in a formal contexture or frame: for prayers, preaching, praising, sacraments and censures never Church wanted [lacked] in some one order or other, though we cannot say that the apostolic Church had this same very order and form: But a liturgy which is a commanded, imposed, stinted form, in such words and no other, is another thing than a directory, as an unlawful thing is different from a lawful: [¹ While Rutherford is speaking of directories in general, yet this section may have some reference to Westminster’s Directory for the Public Worship of God, as the Church of Scotland had adopted it in 1645, a year before this book of Rutherford’s was published.] 2. There be some things positive-human, as the ordering of some parts, or worship, or prayer, the form of words or phrases, and some things of the circumstantials of the sacrament, as what cups, wood or metal, in these the directory lays a tie upon no man, nor can the Church in this make a directory to be a Church-compulsory to strain men: And this way the directory is not ordered and commanded in the frame and contexture, as was the [Anglican] Service-Book; and the pastor or people in these are not properly moral agents, nor do we press that Scripture should regulate men in these.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Intro | Section 5, pp. 80-1</span></figcaption>

formedbooksonline.com/on-the-order-of-worship-liturgies/#:~:text=they%20%5Bthe%20apostolic%20Church%5D%20practiced%20all,Scripture%20should%20regulate%20men%20in%20these&amp;text=they%20%5Bthe%20apostolic%20Church%5D%20practiced%20all%20the%20ordinances&amp;text=press%20that%20Scripture%20should%20regulate%20men%20in%20these" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c67a959d7" data-kw="">
<blockquote><p>Another fault is that all the people are appointed in diverse places to say after the minister, whereby not only the time is unprofitably wasted and a confused voice of the people, one speaking after another, caused but an opinion bred in their heads that those only be their prayers which they say and pronounce with their own mouths, which causes them to give the less heed to the rest of the prayers which they rehearse not after the minister, which, notwithstanding are as well their prayers as those which they pronounce after the minister otherwise than the order which is left unto the church of God does bear. For God has ordained the minister to this end, that, as in public meetings he only is the mouth of the Lord from Him to the people, even so he ought to be the only mouth of the people from them unto the Lord, and that all the people should attend to that which is said by the minister, and in the end both declare their consent to that which is said, and their hope that it should so be and come to pass which is prayed, by the word “Amen;” as St. Paul declares in the epistle to the Corinthians [1 Cor. 14:6], and Justin Martyr shows to have been the custom of the churches in his time. Although these blots in the Common Prayer be such as may easily enough appear unto any which is not wedded to a prejudicate opinion and that there is no great difficulty in this matter, yet I know that this treatise of prayer will be subject to many reprehensions and that there will not be wanting some probable colors also whereby these things may be defended if men will set themselves to strive and to contend: yet (for the desire that I have that these things should be amended and for the instruction of the simpler which are studious of the truth) I have been bold to utter that which I think, not doubting also but that the light of the truth shall be able to scatter all those mists of reasons which shall go about to darken the clearness thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift Against the</cite>, ([Hempstead] 1573), ‘To the next section contained in the 77th, 78th and a piece of the 79th page’, pp. 138-39</span></figcaption>

<blockquote><p>Men can place no religion in circumstances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p. 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Men can place no religion in circumstances.”

— Samuel Rutherford, The Divine Right of Church Government… (1646), p. 22">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMen+can+place+no+religion+in+circumstances.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+p.+22&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdf32d0e2f8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/df32d0e2f8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-holding-public-worship-church-courts-by-distance-though-technology-on-using-satellite-campuses-under-necessity-for-edification/#:~:text=Men%20can%20place%20no%20religion%20in%20circumstances" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6aa3248cec" data-kw="">
<blockquote><p>1. A stinted liturgy is in it self lawful.

2. A stinted liturgy in some parts of public holy service is ordinarily necessary.

3. In the parts where it is not of necessity, it may not only be submitted to, but desired when the peace of the Church requires it.

4. There is so great difference between ministers and people, and times, that it may be convenient and eligible to some, at some times, and unfit and not eligible to others, and at other times.

5. The ministers and Churches that earnestly desire it, should not by the magistrate be generally or absolutely forbidden the use of a convenient prescribed liturgy.

6. To prescribe a frame of stinted service, or prayer, etc. and lay a necessity, or the peace of the Church upon it, and to punish, silence, suspend, excommunicate, or reproach the able, peaceable, godly ministers, or people that (justly or unjustly) scruple the using of it, is so great a sin that no conscionable ministers should attempt it or desire it, nor any godly magistrate suffer it.

7. The safest way of composing such a public form is to take it all, for matter and words, out of the Holy Scriptures.

8. Yet is not this of such necessity, but that we may join in it, or use it, if the form of words be not from Scripture.

9. The matter of a common liturgy, in which we expect any general concord, should not be any unnecessary things, much less things doubtfull, or forbidden.

10. Forms of public prayer should not be constantly used by ministers that are able to pray without them: and none else should be admitted ordinarily to the ministry, but such as are able competently to pray without such forms; unless in great necessities of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, Question 4, ‘Whether a stinted Liturgy, or form of worship, be a desirable means for the peace of these churches?’ in Five Disputations of Church-Government &amp; Worship (London, 1659) Note this was published the year before Charles II returned, as persons were contemplating seeking to unify the nation in a form of church government and worship. | Baxter seeks to prove in his treatment ten propositions:</span></figcaption>

</figure><figure class="quote" id="q-3fe43b0229" data-kw="">
<blockquote><p>11. We thought it meet to subjoin the full proof of every word [of our agreed upon articles] from the Scripture, that it might be past controversy with all believers. Concerning the texts cited, I must desire you to observe that every text does not express the very words that we have put down, but all express the sense and sum of the words; so that I think scarce two syllables can be found that are not expressly in the words of Scripture, which contain any matter that is liable to controversy. If you find ten texts cited for one thing, if the words be not in nine of them, it is sufficient if they be in the tenth; and therefore I must intreat you, if you doubt, to peruse them all. And let not the number offend you: If you need them not, they are no trouble to you: Few of them, I think, or none, are impertinent: A consent of many texts may convince more than one single text: at least it will be useful to have so many texts at hand for the convincing any others of any article of the Faith, though you doubt not yourselves. Only the particular application of some parts of the last branch, viz. ‘our consent that such a man shall be our pastor,’ and that ‘we will be members of this or that particular church:’ cannot be proved in terms from Scripture, but by consequence: For who can expect that Scripture should name the persons of our pastors or the places of our habitation?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-363ccf782c" data-kw="">
<blockquote><p>Therefore, when we say that the proper power of outward baptism resides in being a seal, we mean two things: firstly, that it makes more certain the promised grace that the principal cause has conferred or is to confer, and secondly that it strengthens and increases that grace. But since that promise is not absolute but linked to the condition of faith and repentance, it follows that the grace is sealed only to those who believe and repent, and consequently do not use the signs in a unworthy manner, as the apostle says in 1 Corinthians 11:29. In this regard we grant that this sacrament–just like the other ones–is also exhibitive of the thing that is promised, because in the lawful and worthy use of this sacrament these things that are promised are through the Holy Spirit not merely offered to believers but they are in fact exhibited to and conferred upon them. For God is truthful in sealing his promises, and our sacraments are not supplements of a letter that kills, but of the life-giving Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, sections 31-32, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

t="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9e6ca3df15" data-kw="">
<blockquote><p>From all this it follows clearly, that the children of Christian parents are Church-members; and, being Church-members, they have a right to Baptism, which is appointed by Christ to be the standing ordinance for solemn admission into the visible Church. So that, when they are in our Catechism said to be made members of Christ in their Baptism, the meaning only is, that now they are owned and publicly acknowledged to be such, by their solemn admission into the society of Christians. They are Christians nati; born Christians, by the covenant; Christianity is their birthright, and their native privilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Infants are members of the Church of Christ; and, therefore, to be baptized.’</cite>, pp. 303-304 in The Doctrine of the Two Sacraments in Works, vol. 2 ed. Quick (Philadelphia, 1874)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-c7a8c38437" data-kw="">
<blockquote><p>Of all these great difficulties I have said what I know in my Appendix to Infant Baptism to Mr. Bedford and Dr. Ward, and of Bishop Davenant’s judgement. And I confess that my judgment agrees more in this with Davenant’s than any others, saving that he does not so much appropriate the benefits of baptism to the children of sincere believers as I do. And though by a Letter in pleading Davenant’s cause, I was the occasion of good Mr. [Thomas] Gataker’s printing of his answer to him, yet I am still most inclined to his judgement; Not that all the baptized, but that all the baptized seed of true Christians are pardoned, justified, adopted, and have a title to the Spirit and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism? And whether all the children of true Christians have inward sanctifying grace? Or whether they can be said to be justified, and to be in a state of salvation, that are not inherently sanctified? And whether any fall from this infant state of salvation?’ in A Christian Directory... (London: 1673), pp. 817-21, pp. 817-18</span></figcaption>

<blockquote><p>The most probable explanation [of 1 Cor. 15:29] is, that the apostle here refers to the Levitical rule of Numbers 19:14-19. Were there no resurrection, a corpse would be like any other clod; and there would be no reason for treating it as a symbol of moral defilement, or for bestowing on it so religiously the rites of sepulture.</p></blockquote>

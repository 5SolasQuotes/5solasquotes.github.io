<main class="wrap"><figure class="quote" id="q-c1eda5fcb5" data-kw="">
<blockquote><p>Love means protecting the defenseless. God teaches that life is his gift. He commands us to preserve not only our own lives but also the lives of others, and he has appointed government authorities in part for this purpose by means of just defense (e.g., Prov. 24:11). As I pointed out in my article, military forces established by God’s appointed authorities are legitimate. Nowhere in Scripture does God command soldiers who are Christians to give up being soldiers. Yet, the issue you raise seems to be related more to the question of Christians serving in the military, since Christians are called to love their enemies. First, as I pointed out in the article, nowhere in Scripture does God command soldiers who are Christians to give up being soldiers—in fact, on a few occasions our Lord commends them. If serving in the military is antithetical to being a Christian, surely Christ Jesus would not have commended them. But how can the two be reconciled? How can loving one’s enemies be reconciled with being a soldier with the mission to kill an enemy? It is loving to protect and defend the defenseless, and it is also loving to protect a wicked person from killing others. As far as the command to love one’s enemies, it would be unloving to show favor toward an evil enemy against the defenseless by failing to protect those who do not have the means to protect themselves. Love also means coming to the aid of others. In other words, under the rule to love one’s enemies, would it be loving to permit an enemy to murder a defenseless person? It would not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“How Do Christians In the Military Love Their Enemies and Do Good To Them?” Beautiful Christian Life</cite>, (May 18, 2021)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-bunny.html">Francis Bunny</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth &amp; Falsehood: Or a Comparison between the Truth now taught in England &amp; the Doctrine of the Romish Church</cite>, … (London: Sims, 1595), ch. 19, ‘Of Matrimony, that it is not a Sacrament &amp; that it is Lawful for all’</span></figcaption>

</figure><figure class="quote" id="q-8ca0d5ad12" data-kw="">
<blockquote><p>For lest we of the people should bogle at coming on the stage to act our late tragedy over again, he [the opponent] would impose it on our beliefs that we are still in the middle act of it and that we ought to finish it. It is high time for him to consider whether if we run along with him in this we should not shut up compassion from our brethren and shut out a great part of our gratitude towards God; although I confess some scars and haltings may remain yet, after the war itself is ended. Methinks he should find everything both in Nature and Christianity more favourable for our present peace than for our third war, especially seeing all our former wars have ended very contrary to the expectation of those who were hottest to begin them. But I consider that passion is the last hold out of which we are beaten, of which the fuller men are, the less do they (through a great judgement on their spirits) perceive into what deformities they do transport them, it being the nature of all intoxications that their defects are better perceived by any than by those who are oppressed by them.</p></blockquote>

<blockquote><p>If a people, trusting in the goodness of their prince, enslave themselves to him, and he shall after[ward] turn [a] tyrant, a rash and temerarious surrender obliges not, Et ignorantia facit factum quasi involuntarium. Ignorance makes the fact some way involuntary; for if the people had believed that a meek king would have turned a roaring lion, they should not have resigned their liberty into his hand; and, therefore, the surrender was tacitly conditional to the king as meek, or whom they believed to be meek, and not to a tyrannous lord; and, therefore, when the contract is made for the utility of the one party, the law says, their place is for after wits, that men may change their mind and resume their liberty, though, if they had given away their liberty for money, they cannot recall it; and if violence made the surrender of liberty, here is slavery; and slaves taken in war, so soon as they can escape and return to their own, they are free. (D. Sect. item, ea justit. de rerum divin. I. nihil. F. de rapt. I. 3). So the learned Ferdin. Vasquez (illust. bk. 2, ch. 82, n. 15) says, “The bird that was taken, and has escaped, is free.” Nature in a forced people, so soon as they can escape from a violent conqueror, makes them a free people; and si solo tempore (says Ferd. Vasquez, bk. 2, ch. 82, n. 6) justificatur subjectio, solo tempore facilius justificabitur liberatio.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), question 16, pp. 66-67</span></figcaption>

<div class="actions"><button class="copy" data-copy="“If a people, trusting in the goodness of their prince, enslave themselves to him, and he shall after[ward] turn [a] tyrant, a rash and temerarious surrender obliges not, Et ignorantia facit factum quasi involuntarium. Ignorance makes the fact some way involuntary; for if the people had believed that a meek king would have turned a roaring lion, they should not have resigned their liberty into his hand; and, therefore, the surrender was tacitly conditional to the king as meek, or whom they believed to be meek, and not to a tyrannous lord; and, therefore, when the contract is made for the utility of the one party, the law says, their place is for after wits, that men may change their mind and resume their liberty, though, if they had given away their liberty for money, they cannot recall it; and if violence made the surrender of liberty, here is slavery; and slaves taken in war, so soon as they can escape and return to their own, they are free. (D. Sect. item, ea justit. de rerum divin. I. nihil. F. de rapt. I. 3). So the learned Ferdin. Vasquez (illust. bk. 2, ch. 82, n. 15) says, “The bird that was taken, and has escaped, is free.” Nature in a forced people, so soon as they can escape from a violent conqueror, makes them a free people; and si solo tempore (says Ferd. Vasquez, bk. 2, ch. 82, n. 6) justificatur subjectio, solo tempore facilius justificabitur liberatio.”

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), question 16, pp. 66-67">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+a+people%2C+trusting+in+the+goodness+of+their+prince%2C+enslave+themselves+to+him%2C+and+he+shall+after%5Bward%5D+turn+%5Ba%5D+tyrant%2C+a+rash+and+temerarious+surrender+obliges+not%2C+Et+ignorantia+facit+factum+quasi+involuntarium.+Ignorance+makes+the+fact+some+way+involuntary%3B+for+if+the+people+had+believed+that+a+meek+king+would+have+turned+a+roaring+lion%2C+they+should+not+have+resigned+their+liberty+into+his+hand%3B+and%2C+therefore%2C+the+surrender+was+tacitly+conditional+to+the+king+as+meek%2C+or+whom+they+believed+to+be+meek%2C+and+not+to+a+tyrannous+lord%3B+and%2C+therefore%2C+when+the+contract+is+made+for+the+utility+of+the+one+party%2C+the+law+says%2C+their+place+is+for+after+wits%2C+that+men+may+change+their+mind+and+resume+their+liberty%2C+though%2C+if+they+had+given+away+their+liberty+for+money%2C+they+cannot+recall+it%3B+and+if+violence+made+the+surrender+of+liberty%2C+here+is+slavery%3B+and+slaves+taken+in+war%2C+so+soon+as+they+can+escape+and+return+to+their+own%2C+they+are+free.+%28D.+Sect.+item%2C+ea+justit.+de+rerum+divin.+I.+nihil.+F.+de+rapt.+I.+3%29.+So+the+learned+Ferdin.+Vasquez+%28illust.+bk.+2%2C+ch.+82%2C+n.+15%29+says%2C+%E2%80%9CThe+bird+that+was+taken%2C+and+has+escaped%2C+is+free.%E2%80%9D+Nature+in+a+forced+people%2C+so+soon+as+they+can+escape+from+a+violent+conqueror%2C+makes+them+a+free+people%3B+and+si+solo+tempore+%28says+Ferd.+Vasquez%2C+bk.+2%2C+ch.+82%2C+n.+6%29+justificatur+subjectio%2C+solo+tempore+facilius+justificabitur+liberatio.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+question+16%2C+pp.+66-67&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc5c9d752b4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c5c9d752b4.html">Permalink</a><a class="src"

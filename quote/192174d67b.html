<blockquote><p>[W]e take princes and magistrates into the name and title [of fathers]: for the senators and princes are in the holy scriptures called the fathers and pastors of the people. Xenophan was persuaded that a good prince did differ nothing from a good father.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59f824cb51" data-kw="">
<blockquote><p>The immediate reason for the rewriting of the earlier manuscript [of Lex Rex by S. Rutherford] was the publication, in January 1644, of a royalist treatise, Sacro-Sancta Regum Majestas… Its author was John Maxwell, the deposed ‘Canterburian’ Bishop of Ross and one of the major architects of the notorious Scottish Prayer Book. Rutherford found this treatise by an old enemy deeply provocative, and over the winter, spring and summer of 1644, he spent much of his free-time away from the Westminster Assembly writing a detailed refutation… Maxwell had written his book because he felt that it was appropriate for a divine to put the case for absolutism, since it had already been convincingly argued by eminent lawyers like Bodin and Barclay, and since it was so strongly supported by Scripture and Christian tradition. Rutherford clearly could not let this go unchallenged. The natural-law contractualism of the Scottish-parliamentarian alliance needed to be defended by a theologian.” – Coffey, Politics, Religion, pp. 148-49 Reformed Christian Politics: “In the seventeenth century, divine-right absolutists like Roger Mainwaring and John Maxwell were Arminian in their theology. Though this seems counterintuitive, Arminian doctrine is consistent with divine-right political theory, as it allows them to affirm God’s active role in establishing kings without violating human free will. Kingship, for them, comes not by determined providence according to divine concurrence, but rather in a special, divine act that has occurred above and apart from human action. God’s choice to make a man king could not be actualized via, or in, man’s choosing, for that would violate free will (that is, it would require Calvinist views of divine sovereignty). Nor could they say that God makes a man king subsequent to man’s choosing, for that would deny God’s active role in the choosing. Instead, God chooses one man to be king, and that man is, thereby, king, and God requires the people to obey him as such. God is active, and the people are passive. Indeed, Rutherford, in Lex, Rex, blamed John Maxwell’s divine absolutism on his Arminianism. In Reformed political doctrine, on the contrary, both God and man are active in the making of one man as king, and even in determining the political form of the commonwealth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-maxwell.html">John Maxwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacro-Sancta Regum Majestas</cite>, (1644; London: Dring, 1680) 304 pp. ToC, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-f2098bc2eb" data-kw="">
<blockquote><p>Vers. 10. But chiefly them that walk after the flesh in the lust of uncleanness, and despise government, presumptuous are they, self-willed, they are not afraid to speak evil of dignities:

The sixth Note of Heretics is a luxurious and libidinous life, from which he gathers that the foresaid examples of God’s justice, justly threaten to them eternal destruction, chiefly, because they follow the flesh, or corrupt nature as their Captain, and proceed on in impurity, passing the course of their life in filthy [lusts], indulging the pleasures of the flesh.

Government] Note 7. Is the contempt of government, or lawful authority, which they would have taken out of the world, that there might be none to punish their vices. He describes and amplifies this vice with six Reasons.

Despise] Reas. 1. That it is not the naked disobedience of unlawful commands of a mistaking governor, but contempt of the Magistrate doing his duty, contempt of the very power and ordinance of God.

Presumptuous] Reas. 2. That it is presumptuousness joined with contempt.

And self] Reas. 3. That it is boldness in contempt joined with complacency in that sin.

To speak ill] Reas. 4. That it is boldness in contempt breaking forth into cursing, reproaches, evil speakings, which they cast upon Magistracy.

Vers. 11. Whereas Angels which are greater in power and might, bring not railing accusation against them before the Lord.

Reas. 5. That seeing they are vile fellows, they dare speak evil of Magistrates, which Angels that are more excellent than Magistrates, dare not speak ill of them: For although Angels are sometimes used to punish Princes, yet they always endeavour to maintain the estimation of Principalities, Magistrates, and Powers, against whom some Heretics proceed.

Vers. 12. But these, as natural brute beasts, made to be taken and destroyed, speak evil of the things that they understand not, and shall utterly perish in their own corruption,

Reas. 6. That heretics are like to brute beasts in this; For as beasts, 1. Are irrational: 2. They are driven by force, and not by counsel: 3. They being taken perish: So those Heretics who cannot bear Magistracy amongst men, or in the Church, but speak evil of this Ordinance. 1. Being void of judgement, they are ignorant of God’s Ordinance. 2. They are carried by a wicked inclination to blaspheme or to disgrace that which they do not understand. 3. As brute beasts they bring destruction to themselves, and perish by their own corruptness.

Vers. 13. And shall receive the reward of unrighteousness, as they that count it pleasure to riot in the day time: Spots they are and blemishes, sporting themselves with their own deceivings, while they feast with you:

14. Having eyes full of Adultery, and that cannot cease from sin, beguiling unstable souls, an heart they have exercised with covetous practices: cursed children:

He repeats the commination of their deserved condemnation, and adds the Eighth Note in three demonstrations of their impudence. The first is in open luxury, because in the day time, neither fearing the light of the Gospel, nor the Sun, they discover their minds to be given to luxury, delighting themselves in banquettings. The second demonstration of their impudence, in open incontinency, which they will not in the least endeavour to hide, but betray in their eyes, the adulteries of their heart, and will shew forth their impudence in their lust, and so they will not only pollute themselves, but will also deceive and ensnare their unstable souls destitute of solid and saving Faith. The third impudence consists in covetousness, the arts and methods whereof they will so meditate, and have their hearts so exercised with a vicious habit: Briefly comprehending these vices he calls those wicked men accursed.

Vers. 15. Which have forsaken the right way, and are gone astray, following the way of Balaam the Son of Bosor, who loved the wages of unrighteousness,

16. But was rebuked for his iniquity: the dumb Ass speaking with man’s voice, forbad the madness of the Prophet.

He compares the impudent covetousness of these men, to the covetousness of Balaam, whose History he briefly repeats out of Num. 22. who for the desire of reward, erred from the way, which he professed to follow, and at length gave himself to open impiety: wherein he became so stupid, that he was deservedly reprehended and chastised by his Asse; which likewise false Teachers, teaching false things, for filthy lucre sake, deserve.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 301-02.</span></figcaption>

<blockquote><p>But as for us, we have been taught that to expose newly-born children is the part of wicked men; and this we have been taught lest we should do any one an injury, and lest we should sin against God, first, because we see that almost all so exposed (not only the girls, but also the males) are brought up to prostitution. … And there are some who prostitute even their own children and wives, and some are openly mutilated for the purpose of sodomy; and they refer these mysteries to the mother of the gods, and along with each of those whom you esteem gods there is painted a serpent, a great symbol and mystery.</p></blockquote>

<blockquote><p>XXVI. …Yet the case may be, and often has been (and whither or no it be ours now [referring to Scotland in 1681], is not mine to determine) that a people may and ought to submit themselves to the government even of such a magistrate who either has injuriously usurped that office, or has so maleversed in the exercise thereof (by violating the main and most of the conditions upon which he was admitted to it) that his government is degenerat[ed] into a manifest tyranny and irreligion, and so has (de jure) fore-faulted his right to rule as a magistrate: I say the case of a people may be so circumstantiate [bound by circumstances], that they ought to subject themselves even to such a tyrant till the Lord clearly point forth to them a way, either from his written Word, or some extraordinary impulse and influence upon their spirits, or from indubitable grounds and persuasives of sound moral principles, or such like, whereby they may emerge from under that yoke. Hereby I do not yield, nor assert, that it is lawful to give obedience to any unlawful commands, or that it is no ways lawful for a people to shake off the yoke of an unlawful and tyrannical government: but only that there may be some cases wherein it is lawful for a people to yield subjection to a lawless tyrant, and wherein it may be unlawful for them to perpetrate or attempt their own liberation by external force (which abstractly from those circumstances might be both lawful, laudable and a necessary duty), viz. when the thing attempted is either altogether impracticable, the means or manner of effectuating it dubious or unwarrantable, the timing of it inexpedient and unseasonable, or the necessary concomitants or consequents of the cure more hurtful or dangerous than the disease; or the like: Neither do I affirm that under a tyrannical government it is always or absolutely lawful for the people to give passive obedience (if such a form of phrase may be admitted which many explode as inaccurate and incongruous) but only that there is a time which may be called the proper season of suffering, that is, when suffering (in opposition to acting or resisting) is a necessary and indispensable duty. XXVII. As a man’s subjecting himself to a private robber assaulting and prevailing against him, is no solid proof of his approving or acknowledging the injury and violence committed by the robber; so in many cases a people or person’s yielding subjection (viz. in matters civil and external, for I always exeem [exempt] conscience and religion from subjection to any creature whatsoever) to a tyrant, i.e. a public robber, does not argue their acknowledging or approving his tyranny and oppression. XXVIII. As it is one thing to be subject to the magistrate for conscience sake [Rom. 13:5] and a far other to subject our conscience to the magistrate, that is, to be subject for his pleasure sake: So although we may lawfully submit our bodies and estates to the civil magistrate, and in many cases also to a tyrant; yet in no case can it be lawful for us to subject our conscience or religion to any magistrate or mortal, God Himself being the immediate and sole Sovereign Lord of both.</p></blockquote>

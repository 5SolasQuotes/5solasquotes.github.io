<main class="wrap"><figure class="quote" id="q-de39bc3821" data-kw="">
<blockquote><p>We are therefore said to be justified freely, because that none of those things which precede justification-whether faith or works-merit the grace itself of justification. For, if it be a grace, it is not now by works, otherwise, as the same Apostle says, grace is no more grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/council-of-trent.html">Council of Trent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decree on Justification</cite>, sess. 6, ch. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d2a7d4c853" data-kw="">
<blockquote><p>For, whereas Jesus Christ Himself continually infuses his virtue into the said justified,-as the head into the members, and the vine into the branches,-and this virtue always precedes and accompanies and follows their good works, which without it could not in any wise be pleasing and meritorious before God,-we must believe that nothing further is wanting to the justified, to prevent their being accounted to have, by those very works which have been done in God, fully satisfied the divine law according to the state of this life, and to have truly merited eternal life, to be obtained also in its (due) time, if so be, however, that they depart in grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/council-of-trent.html">Council of Trent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Decree on Justification</cite>, sess. 6, ch. 16</span></figcaption>

</figure><figure class="quote" id="q-a168547595" data-kw="">
<blockquote><p>By merit is understood a work completed for the benefit of another on whom it establishes a claim for reward, or the claim for rewards founded on the work. According as the reward is due in justice or merely out of graciousness, the merit is a meritum de condigno or a meritum de congruo.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 3, pt. 2, §11, 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“By merit is understood a work completed for the benefit of another on whom it establishes a claim for reward, or the claim for rewards founded on the work. According as the reward is due in justice or merely out of graciousness, the merit is a meritum de condigno or a meritum de congruo.”

— Ludwig Ott, Fundamentals of Catholic Dogma, bk. 3, pt. 2, §11, 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy%20merit%20is%20understood%20a%20work%20completed%20for%20the%20benefit%20of%20another%20on%20whom%20it%20establishes%20a%20claim%20for%20reward%2C%20or%20the%20claim%20for%20rewards%20founded%20on%20the%20work.%20According%20as%20the%20reward%20is%20due%20in%20justice%20or%20merely%20out%20of%20graciousness%2C%20the%20merit%20is%20a%20meritum%20de%20condigno%20or%20a%20meritum%20de%20congruo.%E2%80%9D%0A%0A%E2%80%94%20Ludwig%20Ott%2C%20Fundamentals%20of%20Catholic%20Dogma%2C%20bk.%203%2C%20pt.%202%2C%20%C2%A711%2C%201&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa168547595.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a168547595.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-0fde6beadf" data-kw="">
<blockquote><p>Concerning restoration after a fall, and perseverance to the end, the opinion of theologians is agreed that these do not fall under merit de condigno. … This argument does indeed prove that restoration cannot be a reward to be rendered out of justice. For he who has lost all his merits, how can he demand a reward out of justice? But it does not prove that it is not fitting that God, of his clemency, should look upon the preceding good works, and in view of them have mercy on him who has fallen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.22 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-d975b1fe9f" data-kw="">
<blockquote><p>Absolutely, man cannot exact anything from God, since all things are his; yet, given his will and pact, by which he wills not to require our works of us gratis but to render a reward according to the proportion of the works, we can truly exact the reward from him: just as a slave cannot absolutely ask any reward of his master, since all that the slave acquires he acquires for his master; yet if it please the master to give him his works as his own, and to promise a reward for them as though they were not owed to him, he will by right ask a reward for his works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

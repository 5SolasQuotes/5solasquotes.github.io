<blockquote><p>In a series of articles on religious establishments published in the Covenanter periodical, which was edited at the time by Thomas Houston of Knockbracken, we find this brief statement as to why it is the state’s duty to submit to Christ and obey his word:

To a sincere believer in the Bible, there can be no question that the Lord Jesus Christ, in his Mediatorial character, has been exalted by the Father to the sovereignty of all worlds, and that the princes and potentates of the earth, being placed in subjection under him, are bound to yield to him an unreserved obedience. Messiah is the rightful Governor among the nations – King of kings and Lord of lords – the Prince of the kings of the earth. If this simple statement is admitted, and we see not how it can be refused, it must irresistibly follow, that the nations, as such, are bound to submit to Christ the Lord, and their rulers are indispensably required to frame their legislation on the basis of his Word, and regulate their lives according to its infallible directions. Especially are a people professedly Christian solemnly required to act from a far higher principle than a mere worldly expediency, and to set the Saviour’s glory before them in all their public deeds – in choosing their rulers, in devising or executing laws, and in regulating the measure of subjection. Should they overlook these fundamental maxims, and act in opposition to them, they will inevitably incur the Divine displeasure, and must bear the fearful consequences of rebellion against the Lord’s Anointed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Nov. 1831, p. 388</span></figcaption>

<blockquote><p>It is a remarkable coincidence that the very defect under which natural religion specially labours is just that which it was professedly the leading object of the Christian revelation to supply. If natural religion, whatever measure of light it may be fitted to cast upon the character and moral government of God and a future state, plainly teaches men that they are sinners, or transgressors of God’s laws, but does not plainly teach that God will forgive sin, or distinctly point out in what way, or upon what terms, forgiveness is to be secured; then men who have only the light of nature to guide them, even though they are making the best use of it, and indeed we might say just because they are making the best and fullest use of it, must be in a state of fearful anxiety and alarm as to the way and manner in which the sins they have committed are to tell upon their ultimate destiny.

Now, in this state the Christian revelation presents itself to their notice, and challenges their investigation. And in doing so it holds out, as one of its leading recommendations, that it professes to give a full solution of these important and perplexing questions which natural religion could not solve. It confirms indeed all the fears and apprehensions of nature as to the intrinsic difficulties connected with the subject of the pardon of sin, and the insufficiency of repentance; but, at the same time, it fully reveals the mercy of God, assures us of his readiness to pardon, and of his desire to save men, and unfolds to us a great scheme through which God has provided for securing this object, in full consistency with all the attributes of his nature and all the principles of his moral government, and gives us full and explicit instructions as to what we must do in order that we may escape the wrath and curse of God due to us for our sins, and attain to the enjoyment of his favour and eternal happiness.

Christianity has been sometimes called by infidels a mere republication of the law of nature, and some of those who have assumed the designation of rational divines have been able to see little more in it than this, and have been willing to rest its claims upon the additional clearness and certainty which it gives to the doctrines of natural religion. But this is a very inadequate view of Christianity, even when viewed simply as a revelation.

It is very manifest, even upon the face of it, that its leading peculiarity is, that it unfolds a remedial scheme, that it is adapted and addressed to man as a sinner—to man viewed not merely as a creature of God’s hand, and a subject of his government, but as a transgressor of his law; and that its most peculiar and transcendent value lies in its making known to us from God himself, and upon his own authority, his merciful and gracious purposes in regard to sinful men; the nature and character of the provision he has made for pardoning them, and the way and manner in which men individually are to obtain forgiveness.

Every man who had made a right and full use of the light of nature, so as to be alive to its defects, and desirous of further information on these momentous questions on which it leaves men so much in the dark, would regard this feature, which stands out so legibly stamped upon the Christian revelation, as affording, if not a positive presumption of its truth, at least a loud call to inquire seriously into its origin, evidences, and authority, and would be determined by it to prosecute the inquiry with all earnestness and impartiality, until firmly and distinctly persuaded either that Christianity is, as it professes to be, a revelation from God to men on matters essentially involving their destiny and happiness, or else a cunningly devised fable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture IX, pp 120-21.</span></figcaption>

<blockquote><p>15. Though the people have not miniterial or governing power [in church government], yet they are to have a judgment of discretion, and thereby to try and discern, whether they that do cast out, or absolve by ministerial authoritative declaration, do proceed according to God’s Word or not, and are not to obey any sentence or injunction that is contrary to that Word; yet must they not on that pretence disobey or refuse to execute such injunctions and censures without manifesting their proofs of its error.</p></blockquote>

<blockquote><p>Even now, at this very moment, we are not selves having and using bodies. We are bodies—we are rational, sentient, organic bodies. Modern thought has rejected this truth. But the fact remains that the human person is a certain, special kind of body… Human biological processes are not possessions and instruments of the person; they are parts of the life of the person… The human soul, which is the person’s intellectual principle, is united to the body as form. As form of the body, the soul is not merely a moving principle of the body. Nor is the soul an agent of which the body is instrument. Rather, the soul is an intrinsic principle of the human person. The soul makes the person be the body he or she is. Nor is there any other form which makes the body be body than the soul by which the person has the capacities of intellect and free choice. Each person has his or her own soul; substantial unity excludes many individuals having the same soul. Since the soul and the body are not distinct entities, no link is needed to unite soul and body. The human soul, as formal part of the body, makes the entire human body be a person; the entire soul is present in every part of the body. All of these points are explained by St. Thomas in a compact, synthetic treatise (S. t., I, qu. 78)… Classical modern philosophy substitued a radical dualism for the substantial unity of man. In Descartes, man is a thinking subject—cogito ergo sum—and the body is consigned to the objective world. In Hume, man is a momentarily unified consciousness—personal identity is continuity by memory over time—and the body is merely one set for phenomena among others… If the person really is not his body, then the destruction of the life of the body is not directly and in itself an attack on a value intrinsic to the human person… If the person really is not his or her own body, then the use of the sexual organs in a manner which does not respect their proper biological teleology is not directly and in itself the perversion of a good of the human person… A manufactured individual will be a person; he or she will deserve our respect as one sharing in personal dignity… But such an individual also will be a product. The producer is on a different level, inescapably superior, from the level of the product. The producer always can say to his product: “I produced you, I can destroy you; I am lord of your life, I am lord of your death”. If human beings are to share in the same personal dignity, they must be begotten, not made. Only in being begotten does an offspring share the same nature and the same personal dignity as his or her parents.</p></blockquote>

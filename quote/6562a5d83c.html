<main class="wrap"><figure class="quote" id="q-6562a5d83c" data-kw="">
<blockquote><p>Here it must be premised that God, thus punishing, must be regarded as acting the part of a supreme Rector and Governor, not as a subordinate Judge constituted under law… God could rightfully covenant with the whole human race in the person of the first-formed man (the protaplast), so that by reason and virtue of that natural conjunction which existed between Adam and his posterity, God could give a precept to Adam, obliging him, not as an individual of human nature, but as the stock and origin of the whole nature; and therefore all posterity in his person; on this condition, that if he kept the precept, his posterity would be born in that original justice in which he himself was first created. But if he transgressed, all who would thereafter be born from him would be contaminated by sin, and indeed, by his sinning, the whole human race would be considered to sin. Now this divine ordinance concerning:

1. The obligation of the human race in the person of Adam;

2. The imputation of his transgression to his posterity;

3. The propagation of his corruption to the same posterity;

4. The punishment of posterity for Adam’s sin, has its principal foundation in the Dominion of God, but it has a congruence of equity in that natural conjunction which exists between Adam and his posterity. Whence God, punishing the connected person, that is, the posterity of Adam sinning in the person of Adam, could most excellently do this by his own right. Hence it is that the apostle, speaking of the first man, Rom. 5:12, says, “in whom all have sinned,” from which place it is rightly inferred that we are all not only born sinners, but have at some time sinned. And the same apostle teaches this in Rom. 3, when he says, “All have sinned, and come short of the glory of God.” But since it is certain that none of us sinned by our own will before we were born, as the apostle himself says in Rom. 9, where it is said of Jacob and Esau that they had not yet done anything good or evil when it was said to their mother, “the elder shall serve the younger,” it follows that we sinned by another’s will; that is, Adam’s, which will, however, unless it had been in some way the will of the whole nature, and therefore also ours, we would in no way be said to have truly sinned. We sinned, therefore, in the first man, when he sinned; and that transgression of his was also our transgression. Adam alone committed that sin with an actual will; but to us it is communicated through generation in the way that what is past can be communicated, namely by imputation; for it is imputed to all who are born of Adam, because we all, existing in the loins of Adam, in him and through him sinned, when he himself sinned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘God, in punishing a person connected to the one who sinned, exercises his own right’ in Theological Determinations in Works of Samuel Ward</cite>, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 59-65, pp. 59-61</span></figcaption>

</figure><figure class="quote" id="q-ab3fa7fc2b" data-kw="">

</figure><figure class="quote" id="q-19ea18ba90" data-kw="Original Sin The Fall Depravity">
<blockquote><p>We believe that through the disobedience of Adam original sin is extended to all mankind; which is a corruption of the whole nature and a hereditary disease, … and which produces in man all sorts of sin, being in him as a root thereof, and, therefore, is so vile and abominable in the sight of God that it is sufficient to condemn all mankind. … Not that they should rest securely in sin, but that a sense of this corruption should make believers often to sigh, desiring to be delivered from this body of death.</p></blockquote>

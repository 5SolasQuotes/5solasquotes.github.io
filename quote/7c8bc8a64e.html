<main class="wrap"><figure class="quote" id="q-7c8bc8a64e" data-kw="">
<blockquote><p>The first [evidence of scripture’s divinity listed in the Westminster Confession] is, “the heavenliness of the matter.” The matter of the Scriptures, or the various subjects there treated of, have all a reference, more or less direct, to things celestial and divine. They are connected throughout with God, the unseen world, and the eternal destinies of man. No merely human or temporal object seems to be aimed at or attended to.

Everything is connected, more or less directly and palpably, with Him whose throne is in the heavens; with the celestial origin and dignity of his intelligent creatures; with their relations to heaven; and with the end and the means of restoring to heaven those who had forfeited their birthright. Everything connected with this world is represented in the aspect in which it is seen from heaven, and in the light of a higher world. There is nothing that is of the earth earthy.

All breathes of heaven, and tends to lead the thoughts and desires to things unseen and eternal. The guilt and depravity of men are indeed set forth in glowing colours, and exhibited in fearful specimens of what man is and has done. But it is held forth as rebellion against the God of heaven. It is represented in the light in which it usually appears, not so much to men themselves as to the purer inhabitants of a higher and a holier region; and it is unfolded for the purpose of shewing men what they have lost, and what difficulties stand in the way of their restoration to heaven and happiness, and in order to lead them to turn their thoughts to that state where there is no more sin and no more sorrow.

The Bible indeed shews that God has been pleased to make revelations of his will, conveying regulations about temporal and earthly things, especially in connection with that remarkable people whom he selected to put his name in them. And many of these regulations, though in some respects intended to serve temporary purposes, and not now fitted to effect all the same ends as they once did for a season, are recorded in the same Scriptures, and form a part of the word of God.

But even these things were all written for our instruction, on whom the ends of the world have come; they were all fitted and intended to have some reference to the heavenly as well as the earthly Canaan; and they are still found, under the guidance of God’s Spirit, to minister instruction that is profitable for guiding and directing men in their journey to the Jerusalem that is above. Such books, containing such matter, and so free from everything that indicates an earthly origin, must have come from God</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture XXII, pp 283-84.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3ba685ad66" data-kw="">
<blockquote><p>The fourth commandment corresponds to the transition from heaven to earth. That is, it enjoins sabbath observance as first of all a responsibility to God, and in this sense involves heavenly responsibility. But it also involves responsibilities downward to other human beings, sons, daughters, servants, aliens and even animals (Exodus 20:10). Because it involves observance of a periodic seven-day pattern, and because the pattern of day and night is controlled by the heavenly bodies (Genesis 1:14), it also reminds us of Israel’s relation to the visible heavens as the good creation of God. Thus it corresponds in some ways to the Holy Place, where the seven lamps correspond to the light of seven days of the week. It forms a transition between the invisible heavens of the Most Holy Place and the earthly space of the tabernacle courtyard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/vern-s-poythress.html">Vern S. Poythress</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shadow of Christ in the Law of Moses</cite>, (Phillipsburg NJ: P&amp;R, 1991), p. 91.</span></figcaption>

</figure><figure class="quote" id="q-16aaad586b" data-kw="">
<blockquote><p>In fact we assert from Scripture that the pious who have died under either of both testaments are not enjoying some heavenly joy apart from the presence of God, as some of the great men used to think [such as Justin Martyr, Dialogue with Trypho 5 and Irenaeus, Against Heresies 2.34.1 &amp; 5.31.2], but that they are fully enjoying true and unbroken blessedness in God’s very presence. Even so we do not deny that some degree of happiness is kept aside for them until the last day, when [their souls] will be joined to their bodies. This is demonstrated by very many places of Scripture, for also David locates the place of their true blessedness as the presence of God (Psalm 26:23 and [Ps.] 84). And Paul desires ‘to depart and to be with Christ’ (Philippians 1:23); and 2 Corinthians 5:8: ‘And so we choose rather to depart from the body and go to dwell with the Lord.’ The apostle testifies that Christ is with the Father, and on the Father’s throne (Revelation 3:21; John 17:5; Hebrews 9:24). Therefore also throughout Revelation the deceased saints are placed together with the angels before the throne of God and the Lamb, so that they sing constant praises and give thanks to Him, as can be seen in Revelation 4:8, 5:8, and 7:9.</p></blockquote>

oksonline.com/on-the-beatific-vision/#:~:text=In%20fact%20we%20assert%20from%20Scripture,in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9&amp;text=In%20fact%20we%20assert%20from%20Scripture%20that%20the&amp;text=be%20seen%20in%20Revelation%204%3A8%2C%205%3A8%2C%20and%207%3A9" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fc149ce3ee" data-kw="">
<blockquote><p>And although there be many curious persons which think those times to be most happy, in the which God by so many ways spake unto the fathers, and doe affirm that they would more willingly believe the word of God, if so be it would please him to talk with them after that fashion. Notwithstanding, if we well consider of the matter, now that Christ is come, and hath published his Gospel throughout the whole world, we must needs confess, that the times are much more happy, than they were in times past. For God hath spoken with us, not by Angel, not by dreams, or visions, but by his own son our Lord, and Saviour Jesus Christ, who by his divine majesty excelleth all Angels. Whereupon in the Epistle to the Hebrews it is written. In these last days God hath spoken unto us by his son, whom he hath appointed heir of all things.

And Christ himself saith: Blessed are the eyes which see those things that ye see. And straight after he addeth saying: many have desired to see those things that ye see, and have not seen them. And the Apostle Paul saith: Now salvation is nearer unto us than it was then. For seeing that the son of God is commended unto us by the voice of God from heaven, saying: This is my beloved son, hear him. He is most happy which so heareth him by his Gospel, that by faith he comprehendeth the same, &amp; obeyeth his calling. For whosoever he be that believeth not this son of God, he will not believe, though all the Angels in heaven, all the Patriarchs, all the Prophets and fathers stood before him to testify of the word of God. Wherefore, let us not neglect the felicity and happiness of our time, but let us attend and give ear to the voice of the son of God, whereby we may obtain everlasting salvation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And although there be many curious persons which think those times to be most happy, in the which God by so many ways spake unto the fathers, and doe affirm that they would more willingly believe the word of God, if so be it would please him to talk with them after that fashion. Notwithstanding, if we well consider of the matter, now that Christ is come, and hath published his Gospel throughout the whole world, we must needs confess, that the times are much more happy, than they were in times past. For God hath spoken with us, not by Angel, not by dreams, or visions, but by his own son our Lord, and Saviour Jesus Christ, who by his divine majesty excelleth all Angels. Whereupon in the Epistle to the Hebrews it is written. In these last days God hath spoken unto us by his son, whom he hath appointed heir of all things.

And Christ himself saith: Blessed are the eyes which see those things that ye see. And straight after he addeth saying: many have desired to see those things that ye see, and have not seen them. And the Apostle Paul saith: Now salvation is nearer unto us than it was then. For seeing that the son of God is commended unto us by the voice of God from heaven, saying: This is my beloved son, hear him. He is most happy which so heareth him by his Gospel, that by faith he comprehendeth the same, &amp; obeyeth his calling. For whosoever he be that believeth not this son of God, he will not believe, though all the Angels in heaven, all the Patriarchs, all the Prophets and fathers stood before him to testify of the word of God. Wherefore, let us not neglect the felicity and happiness of our time, but let us attend and give ear to the voice of the son of God, whereby we may obtain everlasting salvation.”

— Johannes Brenz, News from Ninive to England, brought by the prophet Jonas: which news in plainly published in the godly and learned exposition of Master John Brentius, trans. Thomas Tymme (London: Henry Denham, 1570), pp 2-3.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+although+there+be+many+curious+persons+which+think+those+times+to+be+most+happy%2C+in+the+which+God+by+so+many+ways+spake+unto+the+fathers%2C+and+doe+affirm+that+they+would+more+willingly+believe+the+word+of+God%2C+if+so+be+it+would+please+him+to+talk+with+them+after+that+fashion.+Notwithstanding%2C+if+we+well+consider+of+the+matter%2C+now+that+Christ+is+come%2C+and+hath+published+his+Gospel+throughout+the+whole+world%2C+we+must+needs+confess%2C+that+the+times+are+much+more+happy%2C+than+they+were+in+times+past.+For+God+hath+spoken+with+us%2C+not+by+Angel%2C+not+by+dreams%2C+or+visions%2C+but+by+his+own+son+our+Lord%2C+and+Saviour+Jesus+Christ%2C+who+by+his+divine+majesty+excelleth+all+Angels.+Whereupon+in+the+Epistle+to+the+Hebrews+it+is+written.+In+these+last+days+God+hath+spoken+unto+us+by+his+son%2C+whom+he+hath+appointed+heir+of+all+things.%0A%0AAnd+Christ+himself+saith%3A+Blessed+are+the+eyes+which+see+those+things+that+ye+see.+And+straight+after+he+addeth+saying%3A+many+have+desired+to+see+those+things+that+ye+see%2C+and+have+not+seen+them.+And+the+Apostle+Paul+saith%3A+Now+salvation+is+nearer+unto+us+than+it+was+then.+For+seeing+that+the+son+of+God+is+commended+unto+us+by+the+voice+of+God+from+heaven%2C+saying%3A+This+is+my+beloved+son%2C+hear+him.+He+is+most+happy+which+so+heareth+him+by+his+Gospel%2C+that+by+faith+he+comprehendeth+the+same%2C+%26+obeyeth+his+calling.+For+whosoever+he+be+that+believeth+not+this+son+of+God%2C+he+will+not+believe%2C+though+all+the+Angels+in+heaven%2C+all+the+Patriarchs%2C+all+the+Prophets+and+fathers+stood+before+him+to+testify+of+the+word+of+God.+Wherefore%2C+let+us+not+neglect+the+felicity+and+happiness+of+our+time%2C+bu

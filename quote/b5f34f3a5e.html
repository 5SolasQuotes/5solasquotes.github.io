<main class="wrap"><figure class="quote" id="q-b5f34f3a5e" data-kw="">
<blockquote><p>§124. XII. Man, therefore, by the very fact that he was made according to God’s image, has been constituted as in a covenant with God. I call this covenant or pact a firm agreement in mutual obligation because God bound Adam by oath unto loving and seeking him as his God, that is being examined also in an ardent attachment to God together with obedience throughout the examination period, performed to God’s eternal glory in him who will be revealed in beatific life. And in turn he offered to Adam the assurance of what must be expected for standing in uprightness and rectitude, and for observing the law of examination, and from him, as his God, for striving after that revelation of God’s glory in himself, and the blessing in the multiplication of his posterity with God’s image. This is already clearly evident from what has been said.

§125. XIII. In this pact, heavenly life is considered as the reward that must be reckoned according to what is owed. This is usually called merit. But what the nature of this merit would be must be considered. It is not condign. Man is able to pay nothing to God, God accepts nothing from his hands, it is not profitable or beautiful according to man’s work. Man owes everything to God. See Luke 17:10. It, therefore, remains that merit is by the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentarius in Pentateuchum, Josuam, et Librum Judicum</cite>, (Amsterdam, 1669), p. 38. Quoted in Harrison Perkins, ‘Meritum ex Pacto in the Reformed Tradition: Covenantal Merit in Theological Polemics’, Mid-American Journal of Theology, 31 (2020), p. 71.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-aee4e03d50" data-kw="">
<blockquote><p>Vers. 19. Now we know that what things soever the Law saith, it saith to them that are under the Law; that every mouth may be stopped, and all the world may become guilty before God.

He prevents an Objection, lest any man should elude the force of the testimonies before recited, as if they belonged but to some few, and those certain impious men, who lived in the times of David or Isaias. Here he shews that the common disposition of mankind is taxed, which live under the Law, or the Covenant of Works, and not under grace; and hereupon these fore-cited sentences of the Law, are directed against all men, under the state of corrupt nature, chiefly the Jews; whereupon a threefold conclusion is inferred. First, from hence every mouth is stopped, lest any man should glory in himself, or excuse himself in the judgement of God. Another conclusion, Hence the whole world is made liable to condemnation, and obnoxious to punishment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

nd-fallen-man-under-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-000286e6e8" data-kw="">
<blockquote><p>Thus Christ assented, and from everlasting struck hands with God, to put upon him man’s person, and to take upon him his name, and to enter in his stead in obeying his Father, and to do all for man that he should require, and to yield in man’s flesh the price of the satisfaction of the just judgment of God, and, in the same flesh, to suffer the punishment that man had deserved; and this he undertook under the penalty that lay upon man to have undergone. And thus was justice satisfied, and mercy by the Lord Jesus Christ; and so God took Christ’s single bond; whence Christ is not only called the “surety of the covenant for us,” Heb. vii. 22, but the covenant itself, Isa. xlix. 8. And God laid all upon him, that he might be sure of satisfaction; protesting that he would not deal with us, nor so much as expect any payment from us; such was his grace.

And thus did our Lord Jesus Christ enter into the same covenant of works that Adam did to deliver believers from it: he was contented to be under all that commanding, revenging authority, which that covenant had over them, to free them from the penalty of it; and in that respect, Adam is said to be a type of Christ, as you have it, Rom. v, 14, “Who was the type of him that was to come.” To which purpose, the titles which the apostle gives these two, Christ and Adam, are exceeding observable: he calls Adam the “first man,” and Christ our Lord the “second man,” 1 Cor. xv. 47: speaking of them as if there never had been any more men in the world besides these two; thereby making them the head and root of all mankind, they having, as it were, the rest of the sons of men included in them.

The first man is called the “earthy man;” the second man, Christ, is called the ” Lord from heaven,” 1 Cor. xv. 47. The earthy man had all the sons of men born into the world included in him, and is so called, in conformity unto them, the “first man;” the second man, Christ, is called the “Lord from heaven,” who had all the elect included in him, who are said to be the “first-born,” and to have their “names written in heaven,” Heb. xii. 23, and therefore are oppositely called “heavenly men:” so that these two, in God’s account, stood for all the rest. And thus you see, that the Lord, willing to show mercy to the fallen creature, and withal to maintain the authority of his law, took such a course as might best manifest his clemency and severity. Christ entered into covenant, and became surety for man, and so became liable to man’s engagements: for he that answers as a surety must pay the same sum of money that the debtor oweth.

And thus have I endeavoured to show you, how we are to conceive of God’s eternal purpose in sending of Jesus Christ to help and deliver fallen mankind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Modern Divinity</cite>, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 184-86.</span></figcaption>

— Edward Fisher, The Marrow of Modern Divinity, (1646) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), vii, 184-86.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+Christ+assented%2C+and+from+everlasting+struck+hands+with+God%2C+to+put+upon+him+man%E2%80%99s+person%2C+and+to+take+upon+him+his+name%2C+and+to+enter+in+his+stead+in+obeying+his+Father%2C+and+to+do+all+for+man+that+he+should+require%2C+and+to+yield+in+man%E2%80%99s+flesh+the+price+of+the+satisfaction+of+the+just+judgment+of+God%2C+and%2C+in+the+same+flesh%2C+to+suffer+the+punishment+that+man+had+deserved%3B+and+this+he+undertook+under+the+penalty+that+lay+upon+man+to+have+undergone.+And+thus+was+justice+satisfied%2C+and+mercy+by+the+Lord+Jesus+Christ%3B+and+so+God+took+Christ%E2%80%99s+single+bond%3B+whence+Christ+is+not+only+called+the+%E2%80%9Csurety+of+the+covenant+for+us%2C%E2%80%9D+Heb.+vii.+22%2C+but+the+covenant+itself%2C+Isa.+xlix.+8.+And+God+laid+all+upon+him%2C+that+he+might+be+sure+of+satisfaction%3B+protesting+that+he+would+not+deal+with+us%2C+nor+so+much+as+expect+any+payment+from+us%3B+such+was+his+grace.%0A%0AAnd+thus+did+our+Lord+Jesus+Christ+enter+into+the+same+covenant+of+works+that+Adam+did+to+deliver+believers+from+it%3A+he+was+contented+to+be+under+all+that+commanding%2C+revenging+authority%2C+which+that+covenant+had+over+them%2C+to+free+them+from+the+penalty+of+it%3B+and+in+that+respect%2C+Adam+is+said+to+be+a+type+of+Christ%2C+as+you+have+it%2C+Rom.+v%2C+14%2C+%E2%80%9CWho+was+the+type+of+him+that+was+to+come.%E2%80%9D+To+which+purpose%2C+the+titles+which+the+apostle+gives+these+two%2C+Christ+and+Adam%2C+are+exceeding+observable%3A+he+calls+Adam+the+%E2%80%9Cfirst+man%2C%E2%80%9D+and+Christ+our+Lord+the+%E2%80%9Csecond+man%2C%E2%80%9D+1+Cor.+xv.+47%3A+speaking+of+them+as+if+there+never+had+been+any+more+men+in+the+world+besides+these+two%3B+thereby+making+them+the+head+and+root+of+all+mankind%2C+they+having%2C+as+it+were%2C+the+rest+of+the+sons+of+men+included+in+them.%0A%0AThe+first+man+is+called+the+%E2%80%9Cearthy+man%3B%E2%80%9D+the+second+man%2C+Christ%2C+is+called+the+%E2%80%9D+Lord+from+heaven%2C%E2%80%9D+1+Cor.+xv.+47.+The+earthy+man+had+all+the+sons+of+men+born+into+the+world+included+in+him%2C+and+is+so+called%2C+in+conformity+unto+them%2C+the+%E2%80%9Cfirst+man%3B%E2%80%9D+the+second+man%2C+Christ%2C+is+called+the+%E2%80%9CLord+from+heaven%2C%E2%80%9D+who+had+all+the+elect+included+in+him%2C+who+are+said+to+be+the+%E2%80%9Cfirst-born%2C%E2%80%9D+and+to+have+their+%E2%80%9Cnames+written+in+heaven%2C%E2%80%9D+Heb.+xii.+23%2C+and+therefore+are+oppositely+called+%E2%80%9Cheavenly+men%3A%E2%80%9D+so+that+these+two%2C+in+God%E2%80%99s+account%2C+stood+for+all+the+rest.+And+thus+you+see%2C+that+the+Lord%2C+willing+to+show+mercy+to+the+fallen+creature%2C+and+withal+to+maintain+the+authority+of+his+law%2C+took+such+a+course+as+might+best+manifest+his+clemency+and+severity.+Christ+entered+into+covenant%2C+and+became+surety+for+man%2C+and+so+became+liable+to+man%E2%80%99s+engagements%3A+for+he+that+answers+as+a+surety+must+pay+the+same+sum+of+money+that+the+debtor+oweth.%0A%0AAnd+thus+have+I+endeavoured+to+show+you%2C+how+we+are+to+conceive+of+God%E2%80%99s+eternal+purpose+in+sending+of+Jesus+Christ+to+help+and+deliver+fallen+mankind.%E2%80%9D%0A%0A%E2%80%94+Edward+Fisher%2C+The+Marrow+of+Modern+Divinity%2C+%281646%29+in+The+Works+of+Thomas+Boston%2C+ed.+Samuel+McMillan+%2812+vols%2C+London%2C+1853%29%2C+vii%2C+184-86.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F000286e6e8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/000286e6e8.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/26/edward-fisher-on-christ-fulfilling-the-covenant-of-works/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>2nd Problem: Whether faith precedes regeneration, at least repentance? Response: The former is denied; the latter is affirmed concerning faith in the first act, which in the order of nature precedes repentance considered both in the first act and in the second act. But it is denied concerning faith in the second act, at least the complete or formed second act. For such faith is necessarily preceded in the order of nature and of time by certain acts of repentance. This distinction observed will contribute not a little to reconciling the dogmatic and practical theologians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 29, ‘On Regeneration’, pt. 1 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 432-65 Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ddc97a5df0" data-kw="">
<blockquote><p>Concerning penitence, which embraces in itself the fear of God, and almost all other acts, there occur (as we have shown before) very many passages in Scripture, in which it is set forth as a necessary means through which to obtain pardon of sins, or (what in fact is the same thing) as a condition under which God (ultimately of his own gratuitous promise) forgives sin. Who will deny that these in some sense have the nature of a cause, except he who is more pleased with the pugnacity of disputing, and the desire of cavilling, than with the love of the truth? How often is forgiveness of sins described in Scripture as the effect or fruit of penitence? (Isa. 1:16-19; 56:4-12; Jer. 18:7-8; Joel 2:12-14; Jonah 3:10, etc.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 1, ch. 3</cite>, p. 39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-9aa4368dc7" data-kw="">
<blockquote><p>And therefore, lastly, in answer to diverse places of the ancients which are produced to confirm the modern sense of justification by faith alone, I answer in a word: That it is true, their words seem to attest so much, but their meaning was plainly no more than this: That faith many times does justify without works, that is, any outward manifestation of their faith, by such fruits: but never without inward acts of repentance and charity distinct from this special faith: nor without such a devotion to good works, which wants nothing but opportunity to exert them; which is by an extraordinary clemency and grace of God, accepted for the thing itself. This appears by the example by them given, to manifest their meaning, of the thief on the cross; who was so justified and saved by faith alone, without good works answerable thereunto, because his sudden faith was prevented by sudden death. Nevertheless, that his faith was so much alone as to exclude repentance, and such graces as were compatible to one in his condition, from a proportionable concurrence to that effect, is nowhere said, nor intended by any of the fathers whose judgment is of account in the Church of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-scrivener.html">Matthew Scrivener</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Course of Divinity... (London: Roycroft, 1674), pt. 1, bk. 1, ch. 20</cite>, p. 76</span></figcaption>

0answer%20to%20diverse%20places&amp;text=is%20of%20account%20in%20the%20Church%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-628708886b" data-kw="">
<blockquote><p>Metanoia-inchoate is anterior to faith, completed posterior. Thus metanoia considered according to the act of contrition is anterior to faith, according to the act of conversion, posterior. And so in a diverse respect metanoia is and is not anterior to faith, without contradiction.</p></blockquote>

</figure><figure class="quote" id="q-377645d263" data-kw="">
<blockquote><p>XXX. Indeed, when we say that faith alone justifies, we do not even mean by that merely the act of believing taken precisely, as it is opposed to acts of love and hope, and is distinguished from repentance, or penitence, as being the condition demanded by the new covenant, or Gospel, for us to obtain the remission of our sins and to be absolved from them because of Christ. For just as the hope of pardon and the love of God, as well as sorrow for sin and the purpose of leading a new life, and, in a word, all the acts necessary for true and sincere conversion, are also required, so they are necessary and altogether prerequisite so that anyone may be received into favor by God and may be regarded by Him as justified. Indeed, that living and operative faith which we affirm justifies alone includes and involves all these acts. XXXI. And just as Scripture frequently asserts that we obtain the remission of sins through faith, so, no less frequently and expressly, does it teach that repentance and the entire conversion of the sinner to God are conditions without which the remission of sins cannot be obtained from God, and which, no less than faith, are required beforehand for it, although it neither effects nor merits it. To this belongs Solomon’s saying, already cited before, “He who hides his sins will not prosper, but he who confesses and forsakes them will obtain mercy.” And what Christ says in Luke, “Unless you repent, you will all likewise perish.” Hence it is that Peter thus exhorts the Jews, “Repent and be baptized every one of you in the name of Jesus Christ for the remission of your sins,” Acts 2:38. And, “Repent, therefore, and turn again, that your sins may be blotted out,” Acts 3:19. … LII. From what has now been explained, it is clear that the doctors of both the Roman and Reformed Schools recognize by common consent: … 2. That only living faith justifies, while dead faith contributes nothing to justice and salvation. 3. That not only the act of believing taken precisely but many other acts also, which concur to true repentance and serious conversion to God, are conditions required by God for one to obtain from Him the remission of sins and the infusion of new and habitual justice. 4. That the remission of sins and the renewal of the inner man are purely gratuitous gifts of God, which are not due out of justice to faith or any works, however much performed by the grace of God. 5. That it is fitting and suitable to divine goodness and wisdom to remit sins and grant the grace of the Holy Spirit to a sinner who sincerely repents and flees to God’s mercy by faith, but not to the unbelieving and impenitent. 6. That the new justice which the Holy Spirit creates in the faithful consists not only of the habit of faith but also of other Christian virtues.</p></blockquote>

 salvation. 3. That not only the act of believing taken precisely but many other acts also, which concur to true repentance and serious conversion to God, are conditions required by God for one to obtain from Him the remission of sins and the infusion of new and habitual justice. 4. That the remission of sins and the renewal of the inner man are purely gratuitous gifts of God, which are not due out of justice to faith or any works, however much performed by the grace of God. 5. That it is fitting and suitable to divine goodness and wisdom to remit sins and grant the grace of the Holy Spirit to a sinner who sincerely repents and flees to God’s mercy by faith, but not to the unbelieving and impenitent. 6. That the new justice which the Holy Spirit creates in the faithful consists not only of the habit of faith but also of other Christian virtues.”

on+of+your+sins%2C%E2%80%9D+Acts+2%3A38.+And%2C+%E2%80%9CRepent%2C+therefore%2C+and+turn+again%2C+that+your+sins+may+be+blotted+out%2C%E2%80%9D+Acts+3%3A19.+%E2%80%A6+LII.+From+what+has+now+been+explained%2C+it+is+clear+that+the+doctors+of+both+the+Roman+and+Reformed+Schools+recognize+by+common+consent%3A+%E2%80%A6+2.+That+only+living+faith+justifies%2C+while+dead+faith+contributes+nothing+to+justice+and+salvation.+3.+That+not+only+the+act+of+believing+taken+precisely+but+many+other+acts+also%2C+which+concur+to+true+repentance+and+serious+conversion+to+God%2C+are+conditions+required+by+God+for+one+to+obtain+from+Him+the+remission+of+sins+and+the+infusion+of+new+and+habitual+justice.+4.+That+the+remission+of+sins+and+the+renewal+of+the+inner+man+are+purely+gratuitous+gifts+of+God%2C+which+are+not+due+out+of+justice+to+faith+or+any+works%2C+however+much+performed+by+the+grace+of+God.+5.+That+it+is+fitting+and+suitable+to+divine+goodness+and+wisdom+to+remit+sins+and+grant+the+grace+of+the+Holy+Spirit+to+a+sinner+who+sincerely+repents+and+flees+to+God%E2%80%99s+mercy+by+faith%2C+but+not+to+the+unbelieving+and+impenitent.+6.+That+the+new+justice+which+the+Holy+Spirit+creates+in+the+faithful+consists+not+only+of+the+habit+of+faith+but+also+of+other+Christian+virtues.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+1+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+on+How+Faith+Justifies%2C+pp.+228-29%2C+234+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F377645d263.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/377645d263.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-a-certain-inherent-holiness-or-graces-repentance-is-requisite-by-way-of-order-accompaniment-to-faith-in-christ-justification/#:~:text=XXX.%20Indeed%2C%20when%20we%20say%20that,but%20also%20of%20other%20Christ

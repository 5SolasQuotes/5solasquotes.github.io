<main class="wrap"><figure class="quote" id="q-3064123999" data-kw="">
<blockquote><p>Wherefore, whosoever in the preaching of the Gospel, are charged and commanded to repent, to believe in Christ, or turn unto God, they are commanded also to use all these external means [“hear a Sermon preached, to read the Scripture, to be informed by Catechizing, and conference of Religion…”] whereby they may be informed of the duty required, and of the means leading thereunto; in the exercise of which external means, they may meet with sundry common operations and effects of God’s Spirit, before they be regenerate or converted, whereof the use may be sound not only in, but also after, conversion; And if any man shall refuse, slight or neglect to follow these preparatory exercises, which may prepare him for conversion, he is inexcusable before God and man, and guilty of rejecting of the offer of reconciliation, yea guilty of resisting of the Holy Ghost, of which sin and guiltiness the holy martyr Stephen charges the misbelieving Jews, 8. As for the regenerate man, he it is who in the acknowledgement of his sinfulness and deserved misery, and of his utter inability to help himself, does cast away all confidence in his own parts, and possible righteousness of his own works, and flees to Christ offered in the Gospel…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Therapeutica Sacra</cite>, Book 1, Chapter 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span><span class="t"><a href="../topics/effectual-calling/efficacious-grace.html">Efficacious Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-845fb27e86" data-kw="">
<blockquote><p>Use 4. If Christ be so rich, Oh! then, open to Christ when He knocks. Christ knocks by his word, and He knocks by his rod; He knocks by his Spirit, and He knocks by his messengers, and He knocks by conscience. Oh, open to Him! for He is very rich. Though you shut the door against a poor man, yet you will open it to one that is rich; and why not then to Christ, who would fain have entrance? Rev. 3:20, ‘Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to Him, and will sup with Him, and He with me.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unsearchable Riches of Christ</cite>, vol. 3, p. 194</span></figcaption>

</figure><figure class="quote" id="q-aef1bfff79" data-kw="">
<blockquote><p>Jehoahaz the son of Jehu began to reign over Israel in Samaria, and reigned seventeen years. And he did that which was evil in the sight of the Lord, and followed the sins of Jeroboam the son of Nebat, which made Israel to sin; he departed not therefrom… He delivered them into the hand of Hazael king of Syria, and into the hand of Benhadad the son of Hazael, all their days. And Jehoahaz besought the Lord, and the Lord hearkened unto him: for He saw the oppression of Israel, because the king of Syria oppressed them. And the Lord gave Israel a saviour, so that they went out from under the hand of the Syrians:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>2 Kings, 13:1-5</cite></span></figcaption>

</figure><figure class="quote" id="q-8619ed2862" data-kw="">
<blockquote><p>The Word must be preached to all without exception; the Gospel must be offered to converted and unconverted. Some object to this as if it would make the offer of grace too general. But the Lord Jesus has commanded it. ‘Many are called, but few are chosen.’ (Matt. 22:14; 20:16) ‘Go ye therefore, and teach all nations, baptizing them in the Name of the Father, and of the Son, and of the Holy Ghost.’ (Matt. 28:19) ‘Go ye into all the world, and preach the Gospel to every creature.’ (Mark 16:15) … Indeed, God not only calls to all who hear His Word, but He also communicates various gifts to them. Speaking of persons who do not come to conversion, the apostle says that they were once enlightened, have tasted of the heavenly gift, and were made partakers of the Holy Ghost, and have tasted the good word of God, and the powers of the world to come. (Heb. 6:4,5) God sometimes grants to reprobates special gifts, also relating to His Word, giving a certain pleasure in it, which nevertheless does not lead to salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/g-h-kersten.html">G.H. Kersten</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, vol. 2, p. 369</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-8d29dc8c6d" data-kw="">
<blockquote><p>The words ‘in love’ [in Eph. 1:4] allow of two senses: either of our kindness and love towards our neighbor through which imitating God Himself as best we can through his Spirit dwelling within us, we eagerly do good to all men; or of the love of us in an objective sense, the love wherewith God has loved us–so that we have a further mention of the cause of our election, which is solely the boundless love of God with which he embraces us in his Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places of Martin Bucer</cite>, trans. &amp; ed. D.F. Wright (England: Sutton Courtenay Press, 1972), Election, pp. 109-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

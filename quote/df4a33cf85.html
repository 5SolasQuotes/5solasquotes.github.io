<main class="wrap"><figure class="quote" id="q-df4a33cf85" data-kw="">
<blockquote><p>CHRIST IS TRUE MAN, HAVING REAL FLESH. We also believe and teach that the eternal Son of the eternal God was made the Son of man, from the seed of Abraham and David, not from the coitus [union] of a man, as the Ebionites [a sect from the Early Church] said, but was most chastely conceived by the Holy Spirit and born of the ever virgin Mary, as the evangelical history carefully explains to us (Matt., ch. 1). And Paul says: “he took not on him the nature of angels, but of the seed of Abraham.” Also the apostle John says that whoever does not believe that Jesus Christ has come in the flesh, is not of God. Therefore, the flesh of Christ was neither imaginary nor brought from heaven, as Valentinus and Marcion wrongly imagined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/affirmation-of.html">Affirmation of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The 2nd Helvetic Confession</cite>, (1562-66) &amp; the Church of Scotland (1566) | Ch. 11, ‘Of Jesus Christ, True God and Man, the Only Savior of the World’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33fb3b11d1" data-kw="">
<blockquote><p>We make our prayers in that tongue which all our people, as meet is, may understand, to the end they may (as Paul counselleth us) take common commodity by common prayer, even as all the holy fathers and Catholic bishops, both in the Old and New Testament, did used to pray themselves, and taught the people to pray too, lest, as Augustine saith, &quot;like parrots and ousels we should seem to speak that we understand not.&quot; Neither have we any other mediator and intercessor, by whom we may have access to God the Father, than Jesus Christ, in whose only Name all things are obtained at His Father&#x27;s hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology of the Church of England</cite>, Part 2</span></figcaption>

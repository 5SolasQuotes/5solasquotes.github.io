<main class="wrap"><figure class="quote" id="q-67eabd7baa" data-kw="">
<blockquote><p>In the next place, let me charge you to hold fast the old doctrine of the Church of England about the sanctity and right observance of the Sabbath Day. I name this point because our old English Sunday appears to me to be in great danger. We live in perilous times. Partly from the spread of infidelity, that old enemy of the Lord’s Day; partly from the morbid love of liberty, and letting every one do as he likes; partly from the exaggerated love of pleasure which marks this age; partly from the facilities afforded by railways for Sabbath travelling, of which our fathers knew nothing, and got on well enough without them; partly from one cause and partly from another, the devil is just now getting more help in his campaign against the Lord’s Day than he has done since the Reformation.

You may see what I mean in the persistent attempts frequently made to throw open places of amusement, aquariums, libraries, theatres, museums, picture galleries, and the like, under the plausible pretence of ‘affording recreation to the working-classes’! All such attempts, I maintain, ought to be firmly and vigilantly resisted. They are the first steps towards a Continental Sunday, and a general flood of Sabbath desecration, Sunday shop-opening, and Sunday delivery of letters in London. I would not have you give way to such attempts. ‘No surrender!’ should be our cry. Let us fight to the last plank for the old English Sunday. Give up the outworks, and the citadel will soon fall.

That laymen of high position and education, noblemen, philosophers, and scientific lecturers, should assist the attempt to break down the standard of Sunday observance, is matter for deep regret. I can only suppose that they do it in ignorance. If they would only study hearts and consciences and death-bed feelings half as much as they study political economy, or stones and plants and beasts and geology and astronomy and light and chemistry and the secrets of earth and air and sea, I believe they would not act as they do. I pity and pray for them. ‘They know not what they do.’

But how any clergyman holding office in the Church of England, and reading the Fourth Commandment every Sunday to his congregation, can lend his aid to movements which must infallibly prevent the Sabbath being kept holy, if they succeed, is one of those mysteries of the nineteenth century which pass my understanding. I am amazed, pained, troubled, grieved, and astonished. The good that the best clergyman does at his very best in a fallen world is small. But he that expects to do good by introducing a Continental Sunday into his parish, exhibits, in my judgment, however excellent his intentions, great ignorance of human nature. He is cutting off his right hand, and destroying his own usefulness.

Whatever may be the bad habits of the working-classes in large parishes, they will never be cured by organizing modes of breaking the Fourth Commandment. We should call that statesman a poor lawgiver who sanctioned petty larceny in order to prevent burglary; and I call that clergyman an unwise man, who, in order to stop drunkenness and its concomitants, is prepared to throw overboard the Sabbath Day. Surely to sacrifice one commandment in order to prevent the breach of another, is neither Christianity nor common-sense. It is, in my opinion, ‘doing evil that good may come.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hold Fast. The Fourth Triennial Charge to the Diocese of Liverpool, November 4, 1890 in Charges and Addresses</cite></span></figcaption>

<blockquote><p>Though we must prefer better before worse, that worse may be best to us at that time and place when we cannot have better without more hurt than benefit to the public or ourselves. Among many ministers, weak and strong, all cannot hear the best, nor must renounce the weaker. To live under the countenance of government under an honest minister of mean parts in peace and concord, though he use the liturgy, is more to the common advantage of religion and to the profit of most particular souls than to hear an abler man with the distraction of disturbers and to be fined and lie in prison on no better a cause.</p></blockquote>

<blockquote><p>Those days which are consecrated to Christ in the Church, if they are received only for reason of a remembrance of the saving graces of Christ to us, and are retained, in order to make us more certain concerning these matters and actions, and if they are observed without any superstition of the day, in the way that they were celebrated when they were first instituted, not by the Papists, but by the Church), then, let them be retained for the honor of Christ, for as long as it seems good to the pious Church, because they are matters straightaway indifferent, and means. Although, I think and judge that even these days among us (who cannot now doubt concerning the trustworthiness of the Evangelical history; nor do we, by the grace of God, walk amongst the heathens), these days, I say, are to be abolished. For, every day, by the preaching of the gospel, Christ is born, circumcised, dies, and resurrects for us, Heb. 13:8.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Those days which are consecrated to Christ in the Church, if they are received only for reason of a remembrance of the saving graces of Christ to us, and are retained, in order to make us more certain concerning these matters and actions, and if they are observed without any superstition of the day, in the way that they were celebrated when they were first instituted, not by the Papists, but by the Church), then, let them be retained for the honor of Christ, for as long as it seems good to the pious Church, because they are matters straightaway indifferent, and means. Although, I think and judge that even these days among us (who cannot now doubt concerning the trustworthiness of the Evangelical history; nor do we, by the grace of God, walk amongst the heathens), these days, I say, are to be abolished. For, every day, by the preaching of the gospel, Christ is born, circumcised, dies, and resurrects for us, Heb. 13:8.”

— Lambert Daneau, Ad tomum I. et II. controversiarum Roberti Bellarmini responsio, (Joannes le Preux, 1598), pp. 1519–20. The latin was cited by George Gillespie, A Dispute Against the English Popish Ceremonies (Naphtali Press, 2013), p. 50 and Balduin, de Cas. Consc., lib. 2, cap. 12, cas. 1. Trans. Charles Johnson">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+days+which+are+consecrated+to+Christ+in+the+Church%2C+if+they+are+received+only+for+reason+of+a+remembrance+of+the+saving+graces+of+Christ+to+us%2C+and+are+retained%2C+in+order+to+make+us+more+certain+concerning+these+matters+and+actions%2C+and+if+they+are+observed+without+any+superstition+of+the+day%2C+in+the+way+that+they+were+celebrated+when+they+were+first+instituted%2C+not+by+the+Papists%2C+but+by+the+Church%29%2C+then%2C+let+them+be+retained+for+the+honor+of+Christ%2C+for+as+long+as+it+seems+good+to+the+pious+Church%2C+because+they+are+matters+straightaway+indifferent%2C+and+means.+Although%2C+I+think+and+judge+that+even+these+days+among+us+%28who+cannot+now+doubt+concerning+the+trustworthiness+of+the+Evangelical+history%3B+nor+do+we%2C+by+the+grace+of+God%2C+walk+amongst+the+heathens%29%2C+these+days%2C+I+say%2C+are+to+be+abolished.+For%2C+every+day%2C+by+the+preaching+of+the+gospel%2C+Christ+is+born%2C+circumcised%2C+dies%2C+and+resurrects+for+us%2C+Heb.+13%3A8.%E2%80%9D%0A%0A%E2%80%94+Lambert+Daneau%2C+Ad+tomum+I.+et+II.+controversiarum+Roberti+Bellarmini+responsio%2C+%28Joannes+le+Preux%2C+1598%29%2C+pp.+1519%E2%80%9320.+The+latin+was+cited+by+George+Gillespie%2C+A+Dispute+Against+the+English+Popish+Ceremonies+%28Naphtali+Press%2C+2013%29%2C+p.+50+and+Balduin%2C+de+Cas.+Consc.%2C+lib.+2%2C+cap.+12%2C+cas.+1.+Trans.+Charles+Johnson&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe8fa779d47.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e8fa779d47.html">Permalink</a><a class="src" href="https://reformedbooks

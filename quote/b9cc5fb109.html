<main class="wrap"><figure class="quote" id="q-b9cc5fb109" data-kw="">
<blockquote><p>If the Lord is faithful in all that He says, and if all His commandments are faithful, it is a manifest falling from faith and a crime of pride either to reject something of what is written or to add something from the unwritten, since Christ said: My sheep hear My voice; they will not follow a stranger but will flee, because they do not know his voice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/basil-of-caesarea.html">Basil of Caesarea</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Confession of Faith</cite>, as quoted by Martin Chemnitz, Examination of the Council of Trent, Part 1</span></figcaption>

<blockquote><p>For it is to be held undoubtingly, as we shall hereafter prove most largely, that the revealed and written word of God is the sole rule of faith, which is a thing prior to the faith of the church. … If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question III, ch. 10</span></figcaption>

</figure><figure class="quote" id="q-8317e796d9" data-kw="">
<blockquote><p>Protestants have always been accustomed to meet these views, whether put forth by Roman Catholics or Anglo-Catholics, by establishing the sufficiency and perfection of the sacred Scriptures as the only rule of faith, and by proving that we have not in point of fact, any certain means of knowing accurately what was declared and prescribed by the apostles, except from the writings of the New Testament.</p></blockquote>

<blockquote><p>For even those things which God decided to come to pass contingently as the actions of man, must necessarily by the virtue of God’s decision come to pass, in such a manner as joined with a possibility of not coming to pass, otherwise it were impossible they should come to pass contingently.</p></blockquote>

<blockquote><p>And the change which is absolutely necessary, is a change which God alone can effect. It is by his drawing men that they are induced to come to Christ. By the “drawing” of the Father we are to understand, as is evident form the following verse, the influence of the Holy Spirit, and the cogency of divine truth, understood and believed. It is by being made to hear and learn of the Father, that men are drawn to Christ. It is because men do not understand and believe the truth, that they cannot come to the Savior, and depraved men never will understand and believe that truth, till the Spirit so fix their minds on its meaning and evidence, that they cannot help understanding and believing it, and when men understand and believe the truth, coming to the Savior follows as a matter of course—they can no longer help coming to Him; and when any man, whomsoever he be, Jew or Gentile, however guilty and depraved, drawn by the Father, by his word and Spirit, comes to the Son, our Savior declares that the final salvation of that person is secure. He is one of those who are given to him of the Father, and he shall not be lost, nothing of him shall be lost. He shall be ‘raised up at the last day.’ It is plain from this passage [John 6:44], that the inability of coming to Christ, under which men labor, is not physical, but moral. It does not originate at all in a want [lack] of those intellectual and active faculties which are necessary to come to Christ, but entirely in an indisposition arising out of willful ignorance, and the love of sin, and of the world. It is like the inability of Joseph’s brethren to speak peaceably to him [Gen. 37:4]. If men cannot come to Christ, it is just because they will not come to Him. They who under the gospel dispensation ‘are untaught of God,’ are so, because they refuse to learn of Him. The appropriate means of removing this kind of inability, is the statement of the truth and its evidence. This is all men can do. Divine influence is necessary, absolutely necessary, to fix the mind on the truth and its evidence, so as to produce faith, and the native consequences of that faith; and that influence never was, never will be, refused to him who honestly desires it. What would men have more? Would they have men left to themselves? Then all must perish. Would they have God to compel men to salvation? This would be to do violence to man’s nature, God’s work! Would they have men saved as they are—in sin? This were to require an impossibility, and to do violence at once to the constitution of man, and the nature of God, to disgrace the Divine character, and overturn the Divine throne. The sum of the whole matter is, no man perishes under the gospel dispensation, but in consequence of his own willful obstinacy: no man is saved, but in consequence of a divine influence originating in free sovereign mercy. Man is his own destroyer, God is man’s only Savior. If we perish, our damnation is entirely of ourselves. If we are saved, our salvation is entirely of God.</p></blockquote>

<blockquote><p>2. Consider upon what terms you may have this God for your God… You give more for your bread, your clothes, your house, for the needful comforts that are for the support of your frail body, than you need give for the great, glorious, incomprehensible, incomparable God. You pay money for them, but you may have Him without money and without price. One would think that the equity of the condition should both amaze you and allure you. Consider, I say, God does not require of you things impossible to you; He does not say, If you will remove mountains, dry up oceans, stop the course of nature, create worlds, I will then be yours, as great as I am; He does not say, If you will satisfy my justice, answer the demands of my law, merit my love and favor, then I will be your God. No; He Himself has done all this for you by the death of his Son; all He desires is, that you would accept Him in his Son for your God. Nay, He does not require of you anything that is barbarous or cruel, as the heathen deities did, by the devil, of their worshippers. He does not say, If you will lance and mangle your bodies, as Baal’s priests did; if you will go barefoot in sackcloth long and tedious pilgrimages, as the papists do; if you will offer your children in the fire, and give the fruit of your bodies for the sins of your souls, as some did, then I will be your God. Again, He does not require of you things that are chargeable, to offer the best and chief of your flock daily in the sacrifice to Him; nor, as He once did of the young man, to sell all that you have, and give it to the poor; nor, as idolators, to lay down such a part of your estate for your portion; but He only requires that you would take the Lord for your God; and will you not do it? Can you deny Him and your poor soul so reasonable, so equitable a request? As the servant said to Nama, ‘If the prophet had commanded you some great thing, would not you have done it? how much more then when He only says, Wash, and be clean?’ So say I to you; if God had commanded the greatest things imaginable, would you not to your power have done them, that you might enjoy the blessed God for your eternal portion? how much more then when He only says, ‘Thou shalt have no other God before me’? O reader, do but observe that first command, which contains the sum both of your duty and felicity, and you are made, you are a blessed man for ever. Take the true God in Jesus Christ for your God, prize Him as your God, love Him as your God, honor Him as your God, and obey Him as your God, and He will be your God forever. Do but as much for the true God as the covetous man does for his wealth, which is his god, as the intemperate man for his belly, which is his god; they give their highest esteem, their choicest affections, and their greatest service to that which they take for their god. And surely the true God is more worthy hereof, and will requite you best for them.</p></blockquote>

lank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…the will, for Aquinas, just is the inclination of a rational substance toward what the intellect judges to be good… for Aquinas the will inclines of necessity toward what the intellect judges to be good, and in particular at what we judge will bring happiness. That does not entail that we cannot will what we judge to be in some way bad. Aquinas’s view is rather that whenever we will some end, it is because of some good we judge it to have, even if the intellect acknowledges it to be bad in other respects. At the moment of choice, it is the good that the intellect sees in it that it focuses on, and the will opts for it under that aspect. Though I follow here the common practice of speaking about what the intellect sees, what the will opts for, and so on, it is important to emphasize that strictly sepaking, it is the person or rational substance who does these things. The intellect and will are powers or capacities of this substance rather than substances in their own right. When it is said that the intellect knows something, this is to be understood as a shorthand way of saying that the person knows it, by virtue of his intellect. Similarly, when it is said that the will chooses some end, this is a shorthand way of saying that the person chooses it, by virtue of his will. Now many ends are pursued for the sake of further ends. You labor in order to earn an income… But Aquinas holds that there must be one ultimate end toward which all our actions are directed… he hold that that end is happiness. Moreover, he argues that what alone can bring happiness is to know and love God. That is not to deny that people disagree about what will bring happiness, and that many seek it in something other than God. The point is that whatever ultimate end they seek, they seek it as that which they suppose will bring happiness. And, Aquinas holds, what alone can really bring it is in fact God, even if some do not see that.</p></blockquote>

<blockquote><p>3. I easily acknowledge that grace gives such a power as is commonly called Moral, distinct from the natural faculties, as our corrupt estate contains an opposite impotency. But this is but an applying of the terms [‘can’] and [‘cannot’] [‘power’] and [‘impotency’] to dispositions and undisposedness, to habits and their privations. 4. A new heart and spirit, I easily confess necessary. But those words do commonly signify in Scripture, only new inclinations, dispositions, qualifications. It is a new heart, though only the old faculties and substance. I hope you will not follow Illyricus.¹ ¹ [Matthias Illyricus (1520–1575), a Lutheran reformer. Wiki says, “Affirming the natural inability of man, he adopted a position on sin as not being an accident of human nature, but involved in its substance, since The Fall of Man.”] 5. Where you say that [without faith a man can no more receive Christ, nor do ought towards it, than a dead man can walk or speak.], I Reply 1. That proves not faith to be equivalent to a potentia vel facultas [power or capacity], any otherwise than that it is of as absolute necessity, but not that it is of the same nature. If you show an illiterate man a Greek or Hebrew book, he can no more read in it then a dead man, that is, both are truly in sensu composito [in a combined sense] impossible: But yet it is but a habit that is wanting to one, and a power or faculty natural, to the other. And so it may truly be said that a sinner cannot do well that has accustomed to do evil, no more than a leopard can change his spots, or a blackmoore [a black person] his skin. Yet if you mean that such are equally distant from actual change as a dead man, it is but a dead comparison. A dead man wants both natural faculties, and an inclination or moral power. An unbeliever wants but one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reduction of a Digressor (1654)</cite>, p. 131</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f4237cccc" data-kw="">
<blockquote><p>I know that even by some of the Fathers these two places, to wit, Eph. 4:11-12 and 1 Tim. 3:2 with 8, are adduced for the same end [for bishops]: because, in the first place, the apostle reckons out both extraordinary and ordinary preaching-officers, without making any mention of bishops: which could not be, if they were not the same with pastors that are named, as Ambrose on the place asserts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation</cite>, (Edinburgh, 1658), pp. 223-33, p. 224</span></figcaption>

</figure><figure class="quote" id="q-9bafd09315" data-kw="">
<blockquote><p>It is said [about the divine right of Church government] that, ‘All this is but a plea for a dominion of an higher nature, even over the consciences of men by censures.’ But why a dominion? Because a power of censures? Surely, if they were not spiritual censures, and such as have influence on the conscience, we should yield a domination were the business. But this power of censuring spiritually is as strong as authoritative in dispensing rebukes, threats, Gospel-charges and commands in the Word preached, as in censures; The power is ministerial only in the Word, not lordly; and why should it be deemed a dominion, and an arbitrary power in the one, and not in the other?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), ‘To the Ingenuous and Equitable Reader’, unnumbered page</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-0287d0d964" data-kw="">
<blockquote><p>8. The non-necessaries, or such things as need not be in the worship of God, which do bring scandal, must 1. be such as are neither necessary in specie, nor in individuo, in kind, or in specie or nature, or in their individuals and particulars, as the whole category of men’s devices, as: 1. Unwritten traditions—not necessary, not written. 2. Human mystical, symbolical signs and ceremonies—not necessary, not written. 3. Human holy days, crossing, kneeling to elements, altars, crossing, surplice, rochets, etc.—not necessary, not written. 4. This and this human holy day, this crossing—not necessary, not written.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), A Dispute Touching Scandal &amp; Christian Liberty, p. 87</span></figcaption>

</figure><figure class="quote" id="q-d0d239f23f" data-kw="">
<blockquote><p>A man may be in some sort called by another to exercise some power which is not his that so called him. As when a physician is called by the civil magistrate or by a bishop to exercise such art as he has, among the people that are ruled by him. For no man I think will say that such a physician in giving of a potion does exercise a kingly or an episcopal power. So likewise is the case of a schoolmaster set in place by a bishops license and authority: in teaching of grammar, he does not exercise the power of a bishop.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), p. 14</span></figcaption>

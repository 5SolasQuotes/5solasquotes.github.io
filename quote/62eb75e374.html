<blockquote><p>REMARKABLE LETTER ON PROFESSOR SMITH’S CASE

Dr Hugh Martin has sent the Montrose Standard a copy of a letter which has addressed to Dr Kennedy, of Dingwall, on “The disgraceful bunglement of what is called the Smith case.” Dr Martin says:— “Nothing could be more ridiculous than the attempt get up a cry about tyranny, oppression, and all that sort of thing; and Smith’s own scream at the bar for Robert Rainy is the most puerile and laughable thing he has done, if it wasn’t in jest and jeering.”

Prof. Robertson Smith the Doctor will not judge as guilty of worse than thoughtlessness, and as “an old friend of his own — of his father and mother, ay, and of his grandmother,” apostrophises him thus: — “Oh, laddie! it were better for you that a millstone were hanged about your neck, and that you were drowned in the depth of the sea, than that you should offend one of Christ’s little ones. There is a terrible tide of passion on just now; and, simply because am his personal friend, I have had odium to bear for his sake. As if, forsooth, I weren’t classicus classicorum, one the most orthodox of the orthodox, and subjected every now and than to odium on that account, too! I again say that have not studied the critical questions at issue, and may very probably never study them now. But anybody thinks that that disqualifies from seeing that Dr Wilson’s movement has been not only right but inevitable, I can only say they must be very ‘thick the head.’”

As to “his friend Professor Thomas Lindsay,” it essential that such letters as his “should utterly and instantly surcease; for that sort of thing cannot possibly be tolerated; no, net for hour.” He next falls foul of “James Candlish, setting up his chafts;” but his hottest denunciations are reserved for Professor Rainy. “Many think it foul scorn to see him sent to the Assembly oftener than in his turn and other brethren deprived of their rights, to honour him. Let the Aberdeen members call meetings and make a roar about that. . . I have rebuked whole committee ere now, when conscience required it; and hardly to be expected that I should tremble before his high mightiness, Dr Rainy. My impression is that Dr Robert Rainy, as a leader, has had his day.”

He next attacks the “disgusting and wicked book” of “Scotch Sermons,” the errors of which, “necessary onto damnation,” he longs for opportunity of bringing home to the Scottish community. “With what gush of thankfulness would I, who have had to pass so many silent Sabbath, receive at God’s hand— though it were only for few scores of times— the blessing again of thorough, jolly, good preach on some of my favourite rich old Gospel texts.”

He wishes also that he were able to join Dr [John] Kennedy “in a raid through the Highlands; and then to pull you south with me into the Lowlands, and spend six mouths among our people with this one object in view alone. Well do I know the magnificent welcome and the floods of love that we should meet with, as well as the black-burning shame we should speedily bring across the faces of those who may wanting a change from the Gospel.</p></blockquote>

ugh-martin-and-the-william-robertson-smith-case/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-93bcfc0f7e" data-kw="">
<blockquote><p>And so judgement-like is [men’s] withdrawing [from God], and smells so of vengeance, that God plagues withdrawing with withdrawing: Hos. 5:4, ‘They will not frame their doings to turn unto their God.’ And what is the issue of that? ‘They shall go with their flocks and herds to seek the Lord, but they shall not find Him; for He hath withdrawn Himself from them.’ Prov. 1:24, ‘I called, and ye refused;’ Verse 26, then this must follow, verse 28 (as also Jn. 8:21, the like is) ‘they shall call upon Me, but I will not answer.’ Use 6. It’s a terrible plague of God, which we would eschew as hell, to wit, provoking of God by such sins as may procure that God should in his judgement mar the lock of the heart, the will, that the door should neither shut nor open; and cast poison into the soul, so as angels and men, heaven and earth cannot help or cure it: Christ is good at opening hearts, and drawing sinners; and He is as good at judicial closing of hearts: If He but put his finger in the eye, and snap in pieces the optic nerves, all the world cannot restore sight, or open the heart. He that is nearest to be drawn to Christ, and yet never drawn, is deepest in hell: An evangelic-fire of God’s fury is worse than a Sinai-fire, though it burn up to mid-heaven:

1. Sinning against the light of nature and the known will of God, as idolatry and the principles of your own religion, true and known to be so, brings delivering up to judicial blindness, Rom. 1:21.

2. If ye put your finger in nature’s eye, and blow out that candle, God will give you up to vile affections, Rom. 1:24 and a reprobate mind, vv. 26-28. Some blow out the candle of nature, and God blows out the sun of the Gospel, that it is to them like sack-cloth of hair, and a moon like blood.

3. Resisting of the call of God, brings on the plague of hardness of heart; Pro. 1:24-27; Acts 28:23-27; Jn. 8:21.</p></blockquote>

<blockquote><p>With respect to the particular laws by which the Jews were governed, the common sentiment of sound divines, and the best writers on the laws of nations, is, that although the judicial law is not binding as such upon Christian nations, so that they should be bound to regulate all their laws according unto it, yet it demands distinguished attention, and is to be regarded, as a pattern, in those laws which proceeded upon moral grounds. In it there was nothing inconsistent with the principles of equity and religion. God give unto Israel ‘right judgments and true laws, good statutes and commandments.’ All just laws among men are deductions from the moral law, applied to human affairs. But in the judicial law, the conclusions were deduced and applied, not by the fallible and corrupt reason of man (as in ordinary laws) but by unerring wisdom. These respected either the first or second table of the moral law, duties which immediately related to God or man. It is a radical mistake, on this subject, to suppose that the peculiarity of the judicial law did lie solely and properly in its reference to matters of religion, or the first table. It is to be observed also in those laws which related to things civil, or the duties of the second table. There is no more propriety in representing all the judicial laws respecting the first table as peculiar, than there is in representing all those which related to the second table as peculiar. Peculiarities there were in both; but after allowances are made for these, there remain moral grounds for both; and whatever proceeded upon moral grounds in the judicial law, whether it respected things immediately connected with religion, or with justice and civil order, is exemplary, and must be obligatory.</p></blockquote>

<blockquote><p>Ecclesiastical judgment is spiritual, in distinction from that which is civil or secular. The government of the church and the government of the state, with the judgment which is competent to those who respectively administer them, differ widely from one another.

They differ in their origin. Both indeed are derived from God, who is the original fountain of all authority and justice. But civil government is from God as Creator; ecclesiastical government from Christ as Mediator. The former holds of him as King of nations, the latter as King of saints. The law of nature, written on the hearts of all men, is sufficient to direct in all that is essential to the former; the latter is founded on the law supernaturally revealed in the scriptures. Civil magistrates and judges are “the ministers of God;” ecclesiastical rulers are “the ministers of Christ,” and pronounce judgment in his name, or by his authority. “Jesus said, All power is given unto me in heaven and in earth.”

They differ in their objects. Civil judgment is pronounced on things that pertain to this life and the external man—his property, his life, his liberty, or his good name; ecclesiastical judgment, on things that pertain to the welfare of the soul and to the life to come. If the former has to do with religious matters, it is either upon the ground that religion in general is conducive to the welfare of secular society, or because particular religious acts interfere with civil rights; if the latter have to do with civil matters, it is only in so far as they relate to the conscience. If at any time the same actions, materially considered, fall under the cognizance of both jurisdictions, as in the case of theft or murder, the formal light in which they are judged by each is different; the secular judicatory proceeds against them as crimes, which injure civil society; the ecclesiastical as scandals, which mar the purity of the church.

They differ in their ends. The end of secular judgment, in subordination to the glory of God, is the external peace and temporal prosperity of men, or, as the apostle expresses it, “that we may live quiet and peaceable lives in all godliness and honesty.” The end of ecclesiastical judgment, in subordination to the glory of God by Christ, is the promoting of the spiritual and eternal interests of man, or, in the words of the same apostle, “that the spirit may be saved in the day of the Lord Jesus.”

They differ, so far as their subjects are concerned, in their extent. Civil judgment extends to all who belong to the commonwealth; spiritual judgment is confined to those who have been embodied into a church state.

They differ in their sanctions, and in the means which they employ to accomplish their ends. Civil authority is supported by the power of the sword, ecclesiastical authority by the power of the word, or, as it is sometimes designed, of “the keys.” By the former, judgment is executed on the delinquent, according to the nature of his crime, to imprisonment, banishment, confiscation of goods, or death; by the latter, judgment is executed on the offender to admonition, rebuke, suspension from sealing ordinances, or excommunication.

In fine, even when the same offences fall under the cognizance of both judicatures, the issue may be different. The ecclesiastical judges may pronounce the highest spiritual sentence against one whom the secular authorities, in the exercise of prudent policy, may spare; and the latter may inflict capital punishment on an individual whom the former may receive and absolve at the last hour, as in the case of a penitent murderer or traitor.

From these premises it follows, that, as there is an exercise of judgment in the church essentially distinct from that which is civil and criminal in the state; so, on the one hand, the two jurisdictions, so far from being inconsistent with one another, are fitted for being mutually helpful in the advancement of objects common to both; and, on the other hand, the ecclesiastical judicature, not being derived from the secular, is not subordinate to it, and is equally competent and necessary under Christian and Heathen rulers.

Even during the Jewish dispensation, under which civil and religious matters were more intimately conjoined than under the Christian, the two jurisdictions were kept distinct. A line of demarcation between the office of the civil judge, and that of the priest, was laid down in the Mosaic code; and in the arrangements “for the judgment of the Lord, and for controversies,” made in the days of the reforming Jehoshaphat, we find Amariah the high priest appointed as president “in all matters of the Lord,” and Zebadiah, the ruler of the house of Judah, “for all the king’s matters.</p></blockquote>

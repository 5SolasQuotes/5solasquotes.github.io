<main class="wrap"><figure class="quote" id="q-aacb89e623" data-kw="">
<blockquote><p>In both epistles commandment is given that only monogamists should be chosen for the clerical office whether as bishops or as presbyters. Indeed with the ancients these names were synonymous, one alluding to the office, the other to the age of the clergy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 69 (to Oceanus)</cite>, §3</span></figcaption>

</figure><figure class="quote" id="q-95255754b2" data-kw="">
<blockquote><p>When subsequently one presbyter was chosen to preside over the rest, this was done to remedy schism and to prevent each individual from rending the church of Christ by drawing it to himself. For even at Alexandria from the time of Mark the Evangelist until the episcopates of Heraclas and Dionysius the presbyters always named as bishop one of their own number chosen by themselves and set in a more exalted position, just as an army elects a general, or as deacons appoint one of themselves whom they know to be diligent and call him archdeacon. For what function, excepting ordination, belongs to a bishop that does not also belong to a presbyter?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 146 (to Evangelus)</cite>, §1</span></figcaption>

</figure><figure class="quote" id="q-7ecc71505d" data-kw="">
<blockquote><p>Discoursing of Bishops, and having described their character, and the qualities which they ought to possess, and having passed over the order of Presbyters, he proceeds to that of Deacons. The reason of this omission was, that between Presbyters and Bishops there was no great difference. Both had undertaken the office of Teachers and Presidents in the Church, and what he has said concerning Bishops is applicable to Presbyters. For they are only superior in having the power of ordination, and seem to have no other advantage over Presbyters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Homilies on First Timothy</cite>, hom. 11 (on 1 Tim. 3:8)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/elders.html">Elders</a></span></div>

— John Chrysostom, Homilies on First Timothy, hom. 11 (on 1 Tim. 3:8)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDiscoursing%20of%20Bishops%2C%20and%20having%20described%20their%20character%2C%20and%20the%20qualities%20which%20they%20ought%20to%20possess%2C%20and%20having%20passed%20over%20the%20order%20of%20Presbyters%2C%20he%20proceeds%20to%20that%20of%20Deacons.%20The%20reason%20of%20this%20omission%20was%2C%20that%20between%20Presbyters%20and%20Bishops%20there%20was%20no%20great%20difference.%20Both%20had%20undertaken%20the%20office%20of%20Teachers%20and%20Presidents%20in%20the%20Church%2C%20and%20what%20he%20has%20said%20concerning%20Bishops%20is%20applicable%20to%20Presbyters.%20For%20they%20are%20only%20superior%20in%20having%20the%20power%20of%20ordination%2C%20and%20seem%20to%20have%20no%20other%20advantage%20over%20Presbyters.%E2%80%9D%0A%0A%E2%80%94%20John%20Chrysostom%2C%20Homilies%20on%20First%20Timothy%2C%20hom.%2011%20%28on%201%20Tim.%203%3A8%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ecc71505d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7ecc71505d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/schaff/npnf113" rel="noopener" target="_blank">Read it online · CCEL, NPNF1 13</a></div>

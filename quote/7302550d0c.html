<main class="wrap"><figure class="quote" id="q-7302550d0c" data-kw="">
<blockquote><p>Ye,” says Christ, “who are evil, know how to do good to your children” (Mt. 7:11); what then are we to expect from the very fountain of goodness? As, then, parents are not willingly angry with their children, nor handle them roughly, there is no doubt but that God never punishes men except when He is constrained. There is, as I have said, an impropriety in the expression, but it is enough to know, that God derives no pleasure from the miseries of men, as profane men say, who utter such blasphemies as these, that we are like balls with which God plays, and that we are exposed to many evils, because God wishes to have as it were, a pleasant and delectable spectacle in looking on the innumerable afflictions, and at length on the death of men. That such thoughts, then, might not tempt us to unbelief, the prophet here puts a check on us, and declares that God does not afflict from his heart, that is, willingly, as though He delighted in the evils of men, as a judge, who, when he ascends his throne and condemns the guilty to death, does not do this from his heart, because he wishes all to be innocent, and thus to have a reason for acquitting them; but yet he willingly condemns the guilty, because this is his duty. So also God, when He adopts severity towards men, He indeed does so willingly, because He is the judge of the world; but He does not do so from the heart, because He wishes all to be innocent—for far away from Him is all fierceness and cruelty; and as He regards men with paternal love, so also He would have them to be saved, were they not as it were by force to drive Him to rigor. And this feeling he also expresses in Isaiah, “Ah! I will take consolation from mine adversaries.” (Isa. 1:24) He calls them adversaries who so often provoked Him by their obstinacy; yet He was led unwillingly to punish their sins, and hence He employed a particle expressive of grief, and exclaimed ‘Ah!’ as a father who wishes his son to be innocent, and yet is compelled to be severe with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Lamentations</cite>, 3 | verse 33, “For he doth not afflict willingly nor grieve the children of men.”</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-45d5f9a9b5" data-kw="">
<blockquote><p>First, What is this love of God in Christ? Here I take it actively for the love wherewith He loves us. Love may be considered: First, as an attribute or a perfection in God; so it is said, 1 John 4:8, ‘God is love.’ Which notes his readiness, self-propension or inclination to do good. Secondly, as it relates and passes out to the creature; so there is a common love and a special love. His common love is set forth: Ps. 145:9, ‘The Lord is good to all, and his tender mercies are over all his works.’…</p></blockquote>

</figure><figure class="quote" id="q-1cf9912c79" data-kw="">
<blockquote><p>…these considerations must be premised:

1. That mercy is otherwise in God than in man: in man indeed it is a grief or compassion conceived upon another’s misery: but in God it is only a propension and readiness of the divine will to help those which are in misery.

2. Mercy in God either signifies the inclination, power, faculty and property to show mercy, and this is natural in God: or the act and exercising of that property toward the creature, and this is so natural in God as yet it is directed by his will.

3. A thing is said to be natural two ways: Either that which only proceeds from the instinct of nature, as the fire naturally burns: or that whereunto nature inclines, yet not without direction of the will, as thus a man is said to speak, to understand naturally: So God is both ways naturally merciful, in Himself the first way; toward his creatures the second. Now to the arguments we answer:

1. The apostle [in Rom. 9:18] speaks not of the natural property, but of the act of mercy, which is directed by the will of God.

2. All the natural properties which are in God He always uses not, nor towards all: as his justice, power, longanimity, mercy: they are always in God, but He exercises them as it pleases Him.

3. Justice and mercy are not contrary, but cruelty is opposed to mercy: neither is there any contrariety in God, but in the effects in diverse subjects: as the Sun with the same heat mollifies the wax and hardens the clay.

4. Neither are these properties unequal in God, but the effects and acts only are unequal, as it pleases God to dispose in his freewill.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla, that is, a Six-fold Commentary upon the Most Divine Epistle of the Holy Apostle, St. Paul to the Romans</cite>, … Romans... (Lege, 1611) | on ch. 9, Places of Controversy, Controversy 12, Whether mercy be a natural property in God, or an effect only of his will, against Socinus?</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>2. [About the word “righteousness“:] It cannot be denied but that in many places its used for that propensity in God whereby from his hatred to sin He punishes wicked men; and thus it must be here [in Ps. 11:7], as the context evidences. Thus it is evidently used 2 Chron. 12:6; Rom. 2:5. Therefore in the next place, righteousness attributed to God signifies in the general that rectitude and purity in God’s nature, whereby He is free from all sin and hates all iniquity. And then more particularly that attribute in God whereby He does punish ungodly men:</p></blockquote>

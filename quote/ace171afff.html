<main class="wrap"><figure class="quote" id="q-ace171afff" data-kw="">
<blockquote><p>Accordingly, as the same writer elsewhere teaches, no man will embrace the gifts of Christ till he has forgotten his own merits. He sometimes gives the reason: because, what is called merit is naught else but the free gift of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, on canon 32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-552f034c8c" data-kw="">
<blockquote><p>The term &quot;merit&quot; refers in general to the recompense owed by a community or a society for the action of one of its members, experienced either as beneficial or harmful, deserving reward or punishment. Merit is relative to the virtue of justice, in conformity with the principle of equality which governs it. … With regard to God, there is no strict right to any merit on the part of man. Between God and us there is an immeasurable inequality, for we have received everything from him, our Creator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §§2006–2007</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“The term &quot;merit&quot; refers in general to the recompense owed by a community or a society for the action of one of its members, experienced either as beneficial or harmful, deserving reward or punishment. Merit is relative to the virtue of justice, in conformity with the principle of equality which governs it. … With regard to God, there is no strict right to any merit on the part of man. Between God and us there is an immeasurable inequality, for we have received everything from him, our Creator.”

</figure><figure class="quote" id="q-8c73e599e1" data-kw="">
<blockquote><p>With respect to merit, we must remove the difficulty by which many are perplexed; for Scripture so frequently promises a reward to our works, that they think it allows them some merit. The reply is easy. A reward is promised, not as a debt, but from the mere good pleasure of God. It is a great mistake to suppose that there is a mutual relation between Reward and Merit; for it is by his own undeserved favor, and not by the value of our works, that God is induced to reward them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 17:7-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>

— John Calvin, Commentary on a Harmony of the Evangelists, Luke 17:7-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWith%20respect%20to%20merit%2C%20we%20must%20remove%20the%20difficulty%20by%20which%20many%20are%20perplexed%3B%20for%20Scripture%20so%20frequently%20promises%20a%20reward%20to%20our%20works%2C%20that%20they%20think%20it%20allows%20them%20some%20merit.%20The%20reply%20is%20easy.%20A%20reward%20is%20promised%2C%20not%20as%20a%20debt%2C%20but%20from%20the%20mere%20good%20pleasure%20of%20God.%20It%20is%20a%20great%20mistake%20to%20suppose%20that%20there%20is%20a%20mutual%20relation%20between%20Reward%20and%20Merit%3B%20for%20it%20is%20by%20his%20own%20undeserved%20favor%2C%20and%20not%20by%20the%20value%20of%20our%20works%2C%20that%20God%20is%20induced%20to%20reward%20them.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentary%20on%20a%20Harmony%20of%20the%20Evangelists%2C%20Luke%2017%3A7-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c73e599e1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c73e599e1.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom32" rel="noopener" target="_blank">Read it online · CCEL, vol. 2</a></div>
</figure><figure class="quote" id="q-db4fc88540" data-kw="">
<blockquote><p>Nor may it be gathered from this that this is merit de condigno; for even though it is from God, yet it is not from God dwelling within through justifying grace, but from God stirring up and helping from without … and moreover it is from God beginning and initiating, not yet completing and perfecting. Hence it is a merit begun and imperfect; and it has some dignity and proportion to its end, but not so great as merit de condigno requires. Finally, there is lacking, as we said, a pact properly so called, without which there can be no merit out of justice, or de condigno.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, bk. 1, ch. 21 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-e8064395f9" data-kw="">
<blockquote><p>We must therefore hold these two principles, first, that believers are called to the possession of the kingdom of heaven, so far as relates to good works, not because they deserved them through the righteousness of works, or because their own minds prompted them to obtain that righteousness, but because God justifies those whom he previously elected, (Romans 8:30.) Secondly, although by the guidance of the Spirit they aim at the practice of righteousness, yet as they never fulfill the law of God, no reward is due to them, but the term reward is applied to that which is bestowed by grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 25:35</span></figcaption>

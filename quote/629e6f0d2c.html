<main class="wrap"><figure class="quote" id="q-629e6f0d2c" data-kw="">
<blockquote><p>2. They [indifferent things] are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands… so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion, yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil.

3. Of the same account is that εὐσχημονία, or decency of religious actions, required by God before Himself… of which the apostle discourses: ‘Every man praying with his head uncovered, dishonoureth his head’ [1 Cor. 11:4]… such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beverley.html">Thomas Beverley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Protestant Truth &amp; Peace in Four Treatises</cite>, (London, 1683), ‘The Woe of Scandal’, pp. 39-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9adb5fcbc0" data-kw="">
<blockquote><p>What politic laws are to be allowed? Those which are agreeable to the law of nature (whereof the Decalogue is an abridgment) and composed for the safety of the people: or those which do not swerve from the eternal rule of the honoring of God and loving our neighbor, and are made by a lawful magistrate. Those that are made after any other manner, they are no better then tyrannical bonds, Isa. 10:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Theology</cite>, p. 892</span></figcaption>

</figure><figure class="quote" id="q-85399d2dc3" data-kw="">
<blockquote><p>22. They that think that conforming ministers are guilty of great sin must consider what diversity of education, company and interest may do, even on men of conscience, and that we have all our sins. And it’s sinful uncharitableness to think and speak worse of them than they deserve and to talk against all for the faults of some. …

24. The religion that keeps possession of the parish churches¹ will be the national religion: Mourn therefore before God that ever any men professing godliness should either labor to get all sound Protestants to desert the parish churches or that any such have been against the restoring of nonconformists by that called a ‘comprehension’, which was but the withdrawing of such impositions as these very men thought sinful, and all this, lest it should diminish the number and strength of the private churches. By this we see what we are doing against ourselves, if God save us not. ¹ [The Anglican parish churches tended to have a simpler and more plain and Scriptural worship than the cathedral churches of the cities, which had many more human and showy additions. Many of the older non-conformist ministers that separated from the cathedral worship yet would not separate in principle from the parish churches. Baxter was of this mind.]

25. They that say conformists convert no souls take on them to know that of thousands which they know not: and forget that before 1640 there were few but conformists to convert them in the land, and that all the Westminster Assembly, save eight, were such.† And that the parliament kept near 7,000 in the ministry that all conformed on Aug. 24, 1662.²</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, … (London: Parkhurst, 1684) | section 2, pp. 12-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-cd923cf40e" data-kw="">
<blockquote><p>But they that have taken it [the Oath of Supremacy], or conceive they may take it, if imposed, do it, as being satisfied in their consciences by the foregoing arguments, or such like, that they do but what they may do lawfully without offence, and hope that it will fall out as it did in the business of the Altar of Ed, Josh. 22, that a right intelligence of their fact will prevent any breach between them and others, and unite them more closely.</p></blockquote>

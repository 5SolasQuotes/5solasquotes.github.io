<main class="wrap"><figure class="quote" id="q-10e7eb0cf1" data-kw="">
<blockquote><p>It is uncharitable, and against the Word, to teach that when a church is dissolved, by no sin and scandal-visible, but by persecution or pestilence, that the dissolved members, though both real and visible converts, have no right to the ordinances: for if the formal cause, to wit, their confederacy into one visible body, as Mr. [Thomas] Hooker [a congregationalist] says, be removed, their visible and external right is removed. The like is to be said of visible professors, and of members of another congregation, and known godly sojourners [travelers]; these Mr. Hooker [by implication] excommunicates for no scandal, visible and invisible: for impossible it is that they can meet together in one place with their own church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 1 | ch. 19, ‘Mr. [Thomas] Hooker [a congregationalist], his formal cause of a Church visible, or Church confederating, is considered’, pp. 96-104, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

 target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6dc426196a" data-kw="">
<blockquote><p>Be not easily tempted to cast at your ministers of whose heart-honesty you have had sufficient demonstration. If once Satan get you to begin a little to spurn at them, he will not cease tempting and providence may justly let snares be rained on you, occasions of stumbling be afforded you, till ye turn quite off and become wild. Notorious it is that people’s idolizing, inamoredness with some, and rooted prejudice at others upon partialities and by-respects are both a cause, foment and consequent of woeful divisions, 1 Cor. 1:11-12 and 3:3-4. O esteem your pastors highly in love for their work’s sake and let not every petty difference cast you and them out: Keep not distance with them, but go and lovingly confer with them anent what ye and they differ in: And if ye get not satisfaction, recommend the matter to God, but let love and peace stand entire notwithstanding. What is Satan’s great engine, and consequently his design for marring your good of ministers; but by stating prejudices in your minds at them? Shut your ears and hearts then to all charms that would suggest ill thoughts of your honest ministers. Receive not lightly ill reports of them, spread perhaps industriously to make them odious (Jer. 20:10) to alienate you from them, as Gal. 4:15-16. Be not then too credulous, try e’re ye trust, and admit no bad impressions of them before ye have found that truly they deserve [them].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London: Cockerill, 1681), p. 173</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-585edc577b" data-kw="">
<blockquote><p>As for schismatics who only for schism are out of the Church, and do hold no erroneous point of doctrine, and are not yet convinced [convicted by a church court], they are yet members of the visible Church, as Morton says from Gerson (Morton, Apologia de no•is R•cl., ch. 2, •at. 1, p. 7), as also Glorianus (lib. de schismat., p. 181); but he who is casten out as a schismatic, is in the same case with an excommunicate[d] person.</p></blockquote>

</figure><figure class="quote" id="q-1a37cb9941" data-kw="">
<blockquote><p>In conclusion, the five membership vows used by the PCA were added to the Directory for Worship of the Book of Church Order by the PCUS in response to the growth of parachurch-interdenominational ministries in the late nineteenth and early twentieth centuries. This has been shown in particular with the addition of vow four that requires a member to support the church. The case was not developed in this brief article, but it is believed that the four vows adopted in 1894 were intended to distinguish church membership in the PCUS as a shepherded, historic, confessional, and evangelistic church from the parachurch, revivalism, and interdenominational churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barry-waugh.html">Barry Waugh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘History of Membership Vows, Presbyterian Church in America’</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-63b475e0a1" data-kw="">
<blockquote><p>Is Christ so precious and excellent a person, so desirable and lovely to thy soul, that thou dost not see His match in heaven or in earth? Is He the fairest among the children of men, the chiefest among ten thousand, and as the apple-tree amongst the trees of the wood, the rose of Sharon, and the lily of the valleys?

And art thou afraid that thy heart runs all upon other objects, and so undervalues Him in idealizing thyself in thy strength, health, beauty, birth, fortune, wisdom, privileges, enjoyments, gifts, graces, profession, religion, duties, and performances? I say, Art thou afraid of undervaluing Christ by overvaluing any of these things – giving them the room in thy soul that He should have; being guilty of idolatry against the Lord?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-bruce.html">Michael Bruce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon I in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-956d6b5e84" data-kw="">
<blockquote><p>First, there is no greater freedom under heaven. It is as great as the suffering and most powerful resurrection of Christ, by which we have been called into freedom. It is the greatest freedom in heaven and earth because the sacrifice of the Son surpasses heaven and earth and remains valid in eternity, so that the devil cannot attack us any more. Similarly, the slavery of a Christian is greater than any other slavery, except that it is a slavery not to the bad but to the good and is motivated by a free conscience. After all, who was a greater slave than Christ, who became the servant of his enemies and even washed the feet of Judas? Thus a Christian must do good even to his enemies and opponents, as Christ said: “You too must wash one another’s feet.”

If Christ suffered the vilest things for you and took your shame on himself, for he took your sins and crimes on him as if he were the one who had committed them and he suffered the pains of eternal damnation for you. As it is said, “He tasted death for us all,” and now Christ has placed our brothers and neighbours in his place, so I ask you, what is so awful about serving Christ and your brothers, at his command? Philippians 2 exhorts us to serve our neighbours by following the example of Christ. In fact, we are not just slaves; we are the garbage and filth of the world, just as Christ was rejected for our sake and considered to be the filth of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolam Divi Pauli Apostoli ad Galatas Notae ex Concionibus Gasparis Oleviani Excerptae, et a Theodoro Beza Editae</cite>, (Geneva: Eustache Vignon, 1578). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 187.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><figure class="quote" id="q-64561d9c48" data-kw="">
<blockquote><p>First, if God and Joshua say that Achans offending in these things are troublers of the Common-wealth, how strongly is our great master Aristotle and his Scholars confuted that defend that wicked men may be good Commonwealth’s men, an Achan be a Joshua, a troubler, a saviour of it.

I confess if by good, they understand good accidentally, such good as God, and the State in which they live, may make good use of, I deny it not in that sense, so may God and his people make good use of Plague, Famine, or the Sword, yet are they not formally good, but destructive to the Common-wealth; even so all offenders in the accursed thing are formally as great evils to the Church and Common-wealth where they live, as these evils are, for they cause God to send these and many more, and also turn away his favour from it.

Could Achan have spoken as well as Turtullus; had he known the Law as well as Moses; had he kept as great a House in his Country, and spent as much provision, as Solomon did in Jerusalem, yet had not the Wedge of Gold in his tent, and the Babylonish Garment on his back, been greater evils to the State, then the other good things could have recompensed? so though a man be a deep Scholar, an eloquent speaker, skilful in the Laws of his Country, a bountiful House-keeper, yet himself an Achan, a Blasphemer, an enemy to the power of Religion, a friend or a better to wickedness or have the accursed Wedge of Gold, by oppression, simony, extortion, or bribery in his Tent, he is no good Commonwealth’s man, but an Achan, and a troubler of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-fairclough.html">Samuel Fairclough</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The troublers troubled, or, Achan condemned and executed. A sermon preached before sundry of the honourable House of Commons at Westminster, April 4, 1641</cite>, (London: Henry Overton, 1641), pp 8-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-88c0594d19" data-kw="">
<blockquote><p>Whatever influence this false theory [Erastianism] may have exerted in various Protestant nations of Europe, it receives no authority, it finds no support in the word of God. It is of the earth, earthy! The doctrine taught in Scripture on this subject is, that the church and the state are distinct societies.

The O. T. church had by divine appointment a government, officers and discipline of its own, distinct from the civil state. In the New Testament all this is anew recommitted to the church. See Rom. 12:8; 1 Cor. 12:28. For the exercise of civil rule, see Rom. 13:1, 2.

Church and state, each within its own sphere of action, is independent. The church had nothing to do with the exercise of civil authority – this belongs to the state; and the state has no right to assume authority over the church. Rightly understood, and honestly carried out in practice, there can be no collision between the powers; they are altogether different in character, and occupy distinct spheres of action. “My kingdom is not of this world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>National support of religion – the relation of the church to the state in Reformed Presbyterian and Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

The O. T. church had by divine appointment a government, officers and discipline of its own, distinct from the civil state. In the New Testament all this is anew recommitted to the church. See Rom. 12:8; 1 Cor. 12:28. For the exercise of civil rule, see Rom. 13:1, 2.

Church and state, each within its own sphere of action, is independent. The church had nothing to do with the exercise of civil authority – this belongs to the state; and the state has no right to assume authority over the church. Rightly understood, and honestly carried out in practice, there can be no collision between the powers; they are altogether different in character, and occupy distinct spheres of action. “My kingdom is not of this world.”

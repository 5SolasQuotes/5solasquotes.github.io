<main class="wrap"><figure class="quote" id="q-1451161955" data-kw="">
<blockquote><p>Whether this world be finite.

S. BUT is this world finite, as some do dispute?

M. It is not only one, but it is also finite, and hath bounds.

S. How prove you that?

M. Because that is finite, whose extreme parts may plainly and perfectly bee shewed, but the Scripture hath appointed heaven and earth to be the extreme parts and ends of this world, whereof Heaven is the farthest, and the earth the nearest, as it appeareth in the 20 chap. of Exo. &amp; 11. verse: and Genesis the 2. chapter and 2. verse, and also in other places. Wherefore, truly it cannot be doubted, but that it is finite.

Moreover, what difference should there be noted to be between the Creator and the Creature, if, as he is infinite, and without measure, the creature also should be infinite, diffuse, and without measure. Finally, there should be two infinites appointed, which by no means can be indeed, or be defended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lambert-daneau.html">Lambert Daneau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wonderful workmanship of the world wherein is contained an excellent discourse of Christian natural philosophy, concerning the form, knowledge, and use of all things created: specially gathered out of the fountains of holy Scripture</cite>, trans. Thomas Twyne (London: Andrew Maunsell, 1578), pp 27-28.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f8dce999b" data-kw="">
<blockquote><p>As to the second part of my reflections, wherein I doubt concerning the earth’s moving about its axis, it may be I differ from you [John Woodward, a professor of physics, to whom the work is dedicated], and from the generality of Virtuosos [New Philosophers] at this day. But truly I am not so much a [Brahe] Tychonian as to forswear the Copernican Hypothesis: But the truth of the matter is this, when I was treating of the most substantial points of divinity, that is, when I was asserting and vindicating the being and providence of God, I was unwilling to found these or anything belonging to them upon an infirm and unstable basis, upon a dubious and disputable doctrine, and which had not long prevailed in the learned world. Such I take the opinion of the circumgyration of the earth to be: and therefore till I could be absolutely satisfied about the reality of it, I thought it was safest to aquiesce at present in the other doctrine, and the rather because it is suitable to the mundane system which Moses presents us with, whose literal sense of the account of it is not to be slighted by Christian philosophers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brief Remarks upon Mr</cite>, [William] Whiston’s New Theory of the Earth &amp; upon an other Gentleman’s Objections Against Some Passages in a Discourse of the Existence &amp; Providence of God, Relating to the Copernican Hypothesis (London, 1697)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-e06284c3e4" data-kw="">
<blockquote><p>They are not, however, called ‘works of nature’ as if God works them by nature, seeing that outside Himself He acts not by necessity of nature but by the liberty of His will, Ps. 115:3; Eph. 1:11. … The moving cause of God unto creating was not any necessity or indigence, for He is in need of nothing, Acts 17:25, but His most free will, Ps. 115:3, by which He willed to communicate and manifest Himself to creatures, Gen. 1:27, 31, and thereby to be glorified by them, Ps. 8:1; 19:1.</p></blockquote>

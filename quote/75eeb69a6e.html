<main class="wrap"><figure class="quote" id="q-75eeb69a6e" data-kw="">
<blockquote><p>In things, therefore, of this kind, ignorance of their miserable condition by nature, both as to sin and wrath, justly claims the first place; for although, as was by instances before manifested, the evidence of truth and power of traditions amongst them have prevailed with some to avow the notion of the sin of Adam, and the corruption of our nature thereby, yet indeed there is not any of them that have a true sense and conviction of their natural condition, and the misery that doth attend it. The Messiah, as we have proved at large, was first promised to relieve mankind from that state whereinto they were cast by the apostasy of Adam, the common root and parent of them all. Such as are men’s apprehensions of that condition, such also will be their thoughts concerning the Messiah who was promised to be a deliverer from it.

They who know themselves cast out of the favour of God thereby, made obnoxious unto his eternal displeasure, and disenabled to do any thing that shall please him, as being cast into a state of universal enmity against him, must needs look on the Messiah promised, in the grace, goodness, and wisdom of God, for a Savior and Deliverer, to be one that must, by suitable ways and means, free them from sin and wrath, procure for them the favor of God, enable them to serve him again unto acceptation, and so bring them at length unto their chief end, — the everlasting enjoyment of him.

As these things answer one another, and are on both sides fully revealed in the Scripture, so the church of old, who had a due apprehension of their own condition, looked for such a Messiah as God had promised. Ignorance, therefore, of this condition is no small cause of the present Judaical misbelief. Whatever may be the estate of other men, about which they do not much trouble themselves, for their part they are children of Abraham, exempted from the common condition of mankind by the privilege of their nativity; or, at least, they are relieved by their circumcision, by the pain whereof they make sufficient satisfaction for any ill they bring with them into this world!

That they are “dead in trespasses and sins,” standing in need to be “born again;” that they are “by nature children of wrath,” obnoxious unto the curse of God; that the sin of our first parents is imputed unto them, or if it be, that it was of any such demerit as Christians teach, — they believe not. Upon the matter, they know no misery but what consists in poverty, captivity, and want of rule and dominion.

And what should a spiritual Redeemer do unto these men? What beauty or comeliness can he have in him, for which, of them, he should be desired? What reason can they see why they should understand the promises concerning him in such a way and sense as that they should not be concerned in them? And this blindness had in a great measure possessed their minds at the first promulgation of the gospel. See John viii. 33, 34, John ix. 40, 41. And therefore our apostle, in his Epistle unto the Romans, wherein he deals both with Jews and Gentiles, before he declares the propitiation that was made, with the justification that was to be obtained by the blood of Christ, convinced them all of their miserable, lost condition on the account of sin, original and actual, chap. 1-3.

Until, therefore, this pride, self-fullness, and ignorance of themselves, be taken from them and rooted out of their hearts, all promises of a spiritual Redeemer must needs be unsavoury unto them. They stand in no need of him, and why should they desire him? An earthly king that would give them liberty, wealth, ease, and dominion, they would gladly embrace, and have long in vain looked for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations on the Epistle to the Hebrews</cite>, (1668), Ex. 11, § 22 in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. W. H. Goold (7 vols, Edinburgh: Johnston and Hunter, 1854), 1: 251-53.</span></figcaption>

</figure><figure class="quote" id="q-7db9fe6fcc" data-kw="">
<blockquote><p>Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections [properties] of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness.</p></blockquote>

<blockquote><p>Bellarmine says that this inordinate concupiscence is not properly sin. What then? Shall we say it is improperly called sin, even though in the very principles of nature it chains and restrains man like a ferocious beast? Is this credible? Let Bellarmine believe such absurdities—we do not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Determinations</cite>, Q. 16</span></figcaption>

<blockquote><p>No sooner was it known that the [Scottish, civil] convention of estates [at Dundee] was to meet in March, 1689 [during the Glorious Revolution], than the Covenanters of the west resolved on repairing in a body to Edinburgh, to aid in protecting the meeting from the apprehended attack of the Jacobites [those for the previous king, James II]. Their assistance was far from being unnecessary… The sudden rising of Dundee having led to measures for the defence of the country, those of the Covenanters known by the name of Cameronians, chiefly in the neighbourhood of Douglas, raised a regiment of eight hundred men, without beat of drum or expense of levy, under the command of the Earl of Angus… Such was the origin of the Cameronian regiment… Discussions ensued, of a kind similar to those which had divided the counsels of the Covenanters at Bothwell. It was keenly debated among them whether it was not a “sinful association” to enlist under the same banner with other regiments, composed of those who had been malignants and abettors of tyranny, or who had not cleared themselves from the scandal of unlawful engagements. Owing to their pertinacity in these unreasonable scruples [longtime covenanter] Colonel Cleland, on whom the command of the regiment was devolved, very nearly lost temper, and he refused to accede to their demands, as subversive of all military discipline. But the matter was finally compromised by their agreeing on a brief general declaration, drawn up by Sir Patrick Hume of Polwart, and explained by Mr. Alexander Shields… It was to the effect that they “appeared in his majesty’s service in defence of the nation, recovery and preservation of the Protestant religion, and, in particular, the work of reformation in Scotland, in opposition to Popery, Prelacy, and arbitrary power, in all its branches and steps, until the government of church and state be brought back to their lustre and integrity, established in the best and purest times.</p></blockquo <figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-jr.html">Thomas M’Crie Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Story of the Scottish Church: from the Reformation to the Disruption</cite>, (London: Blackie &amp; Son, 1875), pp. 398-99</span></figcaption>

<blockquote><p>…union has the advantage over division, because:

1. It is a commanded mean tending to edification, which division is not.

2. Division has no less nor fewer inconveniencies following it, nor [is] less destructive to the Church than union in the case supposed; yea, schism is one of the greatest hurts that can come to an orthodox Church, it being next to heresy in doctrine; and therefore no particular evil can be laid in the balance with it.

3. The ills of division are most inevitable, for the ills that follow union, through God’s blessing, may be prevented; it is not impossible, but in the way of division it is, because itself is out of God’s way.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b54bc7e852" data-kw="">
<blockquote><p>For as it is in nature: first we are babes, &amp; then as we increase in years, so we grow in strength: so it is in the life of a Christian; first ordinarily he hath a weak faith, and after grows from grace to grace, till he come to stronger faith: and at the last he be able to say, he is fully assured in his heart and conscience of the pardon of his sins &amp; of reconciliation to God in Christ. And this assurance ariseth from many experiences and other blessings, which being deeply and duly considered bring a man to be fully persuaded, that God is his God, and God the father, his father, and Jesus Christ his redeemer, and the Holy Ghost his sanctifier.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), p. 195.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c73d67f29" data-kw="">
<blockquote><p>This assurance, however, is not produced by any peculiar revelation contrary to or independent of the Word of God, but springs from faith in God’s promises, which He has most abundantly revealed in His Word for our comfort; from the testimony of the Holy Spirit, witnessing with our spirit that we are children and heirs of God (Rom. 8:16); and lastly, from a serious and holy desire to preserve a good conscience and to perform good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 5, Art. 10</span></figcaption>

</figure><figure class="quote" id="q-b8ba812231" data-kw="">
<blockquote><p>Assurance is a jewel of that worth, a pearl of that price, that he who will have it must work, and sweat, and weep, and wait to obtain it. He must not only use diligence—but he must use all diligence; not only dig—but he must dig deep, before he can come to this golden mine. Assurance is that &quot;white stone,&quot; that &quot;new name,&quot; that hidden manna, which none can obtain but such as labor for it as for life. Assurance is such precious gold, that a man must win it before he can wear it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven on Earth: A Treatise on Christian Assurance</cite>, p. 34</span></figcaption>

</figure><figure class="quote" id="q-fb95a44548" data-kw="">
<blockquote><p>Although temporary believers and other unregenerate men, may vainly deceive themselves with false hopes and carnal presumptions of being in the favor of God and in a state of salvation, which hope of theirs shall perish; yet such as truly believe in the Lord Jesus, and love him in sincerity, endeavouring to walk in all good conscience before him, may in this life be certainly assured that they are in the state of grace, and may rejoice in the hope of the glory of God, which hope shall never make them ashamed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 18.1</span></figcaption>

</figure><figure class="quote" id="q-8e85739b7f" data-kw="">
<blockquote><p>A man may be really justified before God, and yet not have the evidence or assurance of it in his own mind; wherefore that evidence or assurance is not of the nature or essence of that faith whereby we are justified, nor does necessarily accompany our justification. But this manifestation of a man’s own justification unto himself, although it depend on many especial causes, which are not necessary unto his justification absolutely before God, is not a second justification when it is attained; but only the application of the former unto his conscience by the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

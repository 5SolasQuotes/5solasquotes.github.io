<main class="wrap"><figure class="quote" id="q-e054536f86" data-kw="">
<blockquote><p>But many testimonies of Scripture (you will say) teach that even the reprobate have known the truth. Leaving aside the Scriptures of the Old Testament: to Romans the apostle concerning the reprobates says that they hold the truth of God in unrighteousness. And to the Hebrews [6:4-6] he says that some have fallen away from the truth. And he says they taste the word of God and the powers of the world to come: but after the knowledge of the truth they willfully sin. And this is sin against the Holy Spirit: namely the opposition to the truth known, made from the heart. There are twofold cognitions of the truth (as was shown at the outset): one indeed is given and conferred by the gift of the Spirit; but yet inefficacious. For it is only on the surface of the intellect, and the ray has no root in the heart; and therefore it cannot be durable. For it is like seed which is born among rocky chinks and has no root; therefore when the sun arises it withers. Such cognition is common also to the reprobate. … Another is efficacious by the Holy Spirit, the Spirit, I say, of regeneration. For this penetrates into the heart, receives it, reforms and refashions it: there it puts down deep roots, and thrusts itself forth outward in its fruits by charity… Wherefore the Thesis remains firm: only the elect can come to the true knowledge of the truth, and at last the thing itself attains them. Thus it happens that this cognition of the truth is purely the work of the Holy Spirit, efficaciously calling and teaching. What things are demanded of us that we may come to a true and efficacious cognition of the truth? Thesis: That we be led to the cognition of the truth, besides a certain general hearing of the Word of God, we must pray that God may grant us his Spirit: who, when He excites in us the desire to seek that truth, then leads us to seek, to find, and to retain it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Nature of God... (Heidelberg: Wiener Neustadt, 1577), bk. 3 tr. AI by The Faith Received | ch. 3, quest. 3, ‘Whether in the knowledge of truth (which indeed is revealed in the sacred scriptures) our salvation is placed or not placed?’</span></figcaption>

</figure><figure class="quote" id="q-0db55133c7" data-kw="">
<blockquote><p>The will of God is God by one simple act, absolutely willing the being of whatsoever He pleases. That distinction of the absolute and conditional will, as also that of the antecedent and consequent will of God, are both unsound. God wills it to be a truth that whosoever believes shall be saved: He likewise wills it to be the duty of Judas to believe: Hence follows (in case) a will of approbation concerning things in their own nature possible, which yet never shall be: as namely, the acceptation of the obedience of the reprobates; but it does not follow that God has conditionally willed the acceptation of the obedience of the reprobates. God decrees the coexistence of two extremes conditionally cohering, as the faith and salvation of Judas, the sight of such miracles and repentance in the Tyrians: the being of which extremes themselves He has not decreed. Though the things willed be conditioned, yet the volition or willing of God concerning those things is absolute. The authors and approvers of the second distinction, understand by the antecedent will of God (John Damascene, Of the Orthodox Faith, bk. 2, ch. 29), his will concerning the creature looking at it as in itself, without any consideration of after-circumstances: so they say God wills all men, even the reprobate to be saved: this they call his first will, and it is, say they, uncertain. By the consequent will of God, they understand his will concerning the creature looked at, not only as in itself, but together with after-adjuncts and circumstances, as sin, etc. This they call his second will, and it is, say they, certain. As a judge looking upon such a person as in himself, accounts it best that he should live; but looking upon him in second respects, as a murderer, etc. he accounts it best that he should die. The vanity of both these distinctions appears in that they are repugnant to the simplicity, perfection and independence of the first cause. The will of God in the decree, and the revealing of part thereof in the command, do not infer diverse wills in God: The command shows what is the duty of man; the decree contains God’s purpose concerning our doing or not doing our duty. To will such a thing ought to be and not to will that it shall be, yea to will the not being thereof, are not opposite. But both may and do proceed from the same will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, pp. 17-18</span></figcaption>

</figure><figure class="quote" id="q-7a619cf40c" data-kw="">
<blockquote><p>The third question. Whether the will of God be simply one, or divers; and if divers, which they be. … Secondly it is diverse in respect of diverse sorts of manners by which he seems to will those things which he will. For he wills good after one sort even for himself, evil after another, and for another respect then for itself, to wit, for the good may come of it: that is called his good will; for this his permissive will, or voluntary permission. Again he wills some things simply, as to create the world, save the elect, send his Son, &amp;c., others he wills conditionally, as if all men will be saved they must keep the commandments; or believe in Christ: and so some do interpret that place, “God would have all men to be saved.” His absolute will, say some, is ever done, his conditional will is not, but when the condition is performed: and therefore both these wills have divers names amongst divines. The first is called voluntas beneplaciti, the will of his good pleasure, because it simply so pleases God that this or that shall be done, which is properly his will: the other is called voluntas signi, the will of sign: because that precepts and promises with condition observing them, are signs that God will do so, though always and in all things he simply will not that which he commands, or promises: as we may see both in Abraham and Pharaoh. He commanded Abraham to kill his son, and it was a sign he would have had him done so, because he commanded: yet God would not that he should do it, for he forbad him, and he did it not: and this was the will of his good pleasure. He commanded Pharaoh to let Israel go: but he would not have him do so, for he hardened his heart lest he should let them depart: yet his commandment was a sign of his will, but such as one as Ludovieus Vives says, is improperly called his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Live Everlasting: or the True Knowledge of One Iehova, Three Elohim and Jesus Immanuel: Collected Out of the Best Modern Divines, and compiled into one volume by Robert Hill</cite>, ([Cambridge:] Legat, 1601), pp. 250-53 This work is largely a translation and abridgement of Zanchi’s De natura Dei.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The third question. Whether the will of God be simply one, or divers; and if divers, which they be. … Secondly it is diverse in respect of diverse sorts of manners by which he seems to will those things which he will. For he wills good after one sort even for himself, evil after another, and for another respect then for itself, to wit, for the good may come of it: that is called his good will; for this his permissive will, or voluntary permission. Again he wills some things simply, as to create the world, save the elect, send his Son, &amp;c., others he wills conditionally, as if all men will be saved they must keep the commandments; or believe in Christ: and so some do interpret that place, “God would have all men to be saved.” His absolute will, say some, is ever done, his conditional will is not, but when the condition is performed: and therefore both these wills have divers names amongst divines. The first is called voluntas beneplaciti, the will of his good pleasure, because it simply so pleases God that this or that shall be done, which is properly his will: the other is called voluntas signi, the will of sign: because that precepts and promises with condition observing them, are signs that God will do so, though always and in all things he simply will not that which he commands, or promises: as we may see both in Abraham and Pharaoh. He commanded Abraham to kill his son, and it was a sign he would have had him done so, because he commanded: yet God would not that he should do it, for he forbad him, and he did it not: and this was the will of his good pleasure. He commanded Pharaoh to let Israel go: but he would not have him do so, for he hardened his heart lest he should let them depart: yet his commandment was a sign of his will, but such as one as Ludovieus Vives says, is improperly called his will.”

— Jerome Zanchi, Live Everlasting: or the True Knowledge of One Iehova, Three Elohim and Jesus Immanuel: Collected Out of the Best Modern Divines, and compiled into one volume by Robert Hill ([Cambridge:] Legat, 1601), pp. 250-53 This work is largely a translation and abridgement of Zanchi’s De natura Dei.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+third+question.+Whether+the+will+of+God+be+simply+one%2C+or+divers%3B+and+if+divers%2C+which+they+be.+%E2%80%A6+Secondly+it+is+diverse+in+respect+of+diverse+sorts+of+manners+by+which+he+seems+to+will+those+things+which+he+will.+For+he+wills+good+after+one+sort+even+for+himself%2C+evil+after+another%2C+and+for+another+respect+then+for+itself%2C+to+wit%2C+for+the+good+may+come+of+it%3A+that+is+called+his+good+will%3B+for+this+his+permissive+will%2C+or+voluntary+permission.+Again+he+wills+some+things+simply%2C+as+to+create+the+world%2C+save+the+elect%2C+send+his+Son%2C+%26c.%2C+others+he+wills+conditionally%2C+as+if+all+men+will+be+saved+they+must+keep+the+commandments%3B+or+believe+in+Christ%3A+and+so+some+do+interpret+that+place%2C+%E2%80%9CGod+would+have+all+men+to+be+saved.%E2%80%9D+His+absolute+will%2C+say+some%2C+is+ever+done%2C+his+conditional+will+is+not%2C+but+when+the+condition+is+performed%3A+and+therefore+both+these+wills+have+divers+names+amongst+divines.+The+first+is+called+voluntas+beneplaciti%2C+the+will+of+his+good+pleasure%2C+because+it+simply+so+pleases+God+that+this+or+that+shall+be+done%2C+which+is+properly+his+will%3A+the+other+is+called+voluntas+signi%2C+the+will+of+sign%3A+because+that+precepts+and+promises+with+condition+observing+them%2C+are+signs+that+God+will+do+so%2C+though+always+and+in+all+things+he+simply+will+not+that+which+he+commands%2C+or+promises%3A+as+we+may+see+both+in+Abraham+and+Pharaoh.+He+commanded+Abraham+to+kill+his+son%2C+and+it+was+a+sign+he+would+have+had+him+done+so%2C+because+he+commanded%3A+yet+God+would+not+that+he+should+do+it%2C+for+he+forbad+him%2C+and+he+did+it+not%3A+and+this+was+the+will+of+his+good+pleasure.+He+commanded+Pharaoh+to+let+Israel+go%3A+but+he+would+not+have+him+do+so%2C+for+he+hardened+his+heart+lest+he+should+let+them+depart%3A+yet+his+commandment+was+a+sign+of+his+will%2C+but+such+as+one+as+Ludovieus+Vives+says%2C+is+improperly+called+his+will.%E2%80%9D%0A%0A%E2%80%94+Jerome+Zanchi%2C+Live+Everlasting%3A+or+the+True+Knowledge+of+One+Iehova%2C+Three+Elohim+and+Jesus+Immanuel%3A+Collected+Out+of+the+Best+Modern+Divines%2C+and+compiled+into+one+volume+by+Robert+Hill+%28%5BCambridge%3A%5D+Legat%2C+1601%29%2C+pp.+250-53+This+work+is+largely+a+translation+and+abridgement+of+Zanchi%E2%80%99s+De+natura+Dei.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7a619cf40c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7a619cf40c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-signified-will-or-will-of-sign/#:~:text=The%20third%20question.%20Whether%20the%20will,says%2C%20is%20improperly%20called%20his%20will&amp;text=The%20third%20question.%20Whether%20the%20will%20of%20God&amp;text=Ludovieus%20Vives%20says%2C%20is%20improperly%20called%20his%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As in the previous controversies, the rectitude of the distinction depends upon its definition: ‘it is possible to allow a voluntas conditionata [conditional will]’ in God ‘but not in an a priori and antecedent sense, as if dependent on a condition, rather in an a posteriori and consequent sense, given that some condition in the creature intervenes between the will and its execution’; and then ‘only to the extent that the condition does not belong to the internal divine act (a parte actus interni) or volition (volitionis), but to the external object (a parte obiecti externi) or thing willed (rei volitae).’ In this sense, the distinction can legitimately be applied to the promises associated with God’s covenants… the covenants of law and gospel, where God’s promises are extended conditionally to sinners… In other words, the conditional will remains an immutable will, willed eternally by God, but it is understood as being directed toward a contingent or conditional event: the condition, strictly understood, obtains, not in the divine will, but in the temporal event.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd</cite>, 5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65, p. 464</span></figcaption>

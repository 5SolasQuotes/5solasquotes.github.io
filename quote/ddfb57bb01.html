</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ef4dac9cd" data-kw="">
<blockquote><p>To the arguments: To 2. To that which is objected [against election being eternally in God], that the will and love of God is without discretion, it must be said that there is an antecedent will and a consequent will: the antecedent, by which He wills as much as is in Him, and the consequent, by which He wills with the foreknowledge of our salvation; and the first is indeed of all, but the second is not. According to this mode, love is twofold: one, which regards the antecedent will, and with this He loves all; and there is another, which regards the consequent, and with this He loves all those to be saved, and this is election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 40, art. 3, On Divine Election, quest. 1, ‘Whether election is in God from eternity, or in time.’</span></figcaption>

</figure><figure class="quote" id="q-cebb4ffe52" data-kw="">
<blockquote><p>4. The Fathers erred not so much as many suppose in their ascribing [salvific effects] to baptism. For:

1. Sometime by baptism they mean not only the external ordinance, but the whole work therein to be done; viz. the accepting Christ solemnly in Covenant, and giving up ourselves as a sanctified people to Him, renouncing the flesh, the world and the Devil, and so becoming fully Christians. This is baptism with them, and not the outward sign alone. And what says Peter less, when he says, ‘Baptism saves us,’ and thus expounds himself when he has done? And what say the Fathers more?

2. When they speak of these effects of baptism, they suppose a due recipient or subject, that is, a true believer, or the seed of such: and therefore they oft speak of the inefficacy of the outward baptism to hypocrites.

3. When they speak of the outward ordinance only, the collation which they ascribe to it and all the great effects, are to be understood but by way of obsignation and solemnization, and not solely excluding the internal faith and the Covenant: as actual solemnized marriage gives a woman right to her husband and all that he has, when yet she had a right by secret covenant and contract before. Now common reason and the nature of the thing and many of the contexts showing that the Fathers and Councils must be thus expounded according to these rules, I would fain know how they deserve that heavy accusation that we commonly lay upon them for their judgement in this, or what ground the Papists have to plead them generally for their efficacy ex opere operato [from the work working]? And yet I will not excuse each particular person of them thus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Disputations of Right to Sacraments</cite>, ... (London: Simmons, 1658), 2nd Disputation, pp. 200-201</span></figcaption>

</figure><figure class="quote" id="q-6f567a20fa" data-kw="Sovereignty">
<blockquote><p>Here, speculative theologian, the discussion is not about the will of good pleasure, of which it is written, &#x27;Whatsoever the Lord pleased, that did he in heaven and in earth,&#x27; and that &#x27;no one can resist his will.&#x27; That is plain, because we see that not all men come to the knowledge of the truth. Rather, the discussion is about the will of sign, by which God sets before all men the precepts of salvation and the doctrine of the Gospel. It is charged against those who refuse to come to the knowledge of the truth and refuse to be saved, of which it is written, &#x27;How often would I have gathered thy children, and ye would not.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-de-vio-cajetan.html">Thomas de Vio Cajetan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, In omnes D. Pauli et aliorum Apostolorum Epistolas Commentarii, on 1 Tim. 2:4 (Opera omnia, vol. 5, p. 295, col. 1)</span></figcaption>

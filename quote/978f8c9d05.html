<main class="wrap"><figure class="quote" id="q-978f8c9d05" data-kw="" data-pol="">
<blockquote><p>We are knit to him both by consanguinity and by affinity. The nearest affinity is marriage, and the nearest consanguinity is sister. So that there are all bonds to knit us to Christ. Whatsoever is strong in any bond, he knits us to him by it. Is there any love in an husband, a brother, a mother, a friend, in an head to the members? in anything in the world? Is there any love scattered in any relation, gather it all into one, and all that love, and a thousand times more than that, is in Christ in a more eminent manner.</p></blockquote>
<figcaption>— <a href="../authors/richard-sibbes.html">Richard Sibbes</a>, <cite>Union with Christ (Bowels Opened)</cite>, Sermon VI (Song 5:2, “My sister”)</figcaption>
<div class="meta"><a class="tag" href="../topics/salvation/union-with-christ.html">Union with Christ</a><a class="tag" href="../topics/person-of-christ/love-of-christ.html">Love of Christ</a></div>

<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Communion with God</cite>, Part 2, ch. 3, “He Gives Himself to Us”</figcaption>

</figure><figure class="quote" id="q-33e3a0f80d" data-kw="Communion" data-pol="">

<figcaption>— <a href="../authors/richard-sibbes.html">Richard Sibbes</a>, <cite>Union with Christ (Bowels Opened)</cite>, Sermon V (Song 5:2)</figcaption>

</figure><figure class="quote" id="q-7eebdca10b" data-kw="Perseverance" data-pol="">
<blockquote><p>It is an INDISSOLUBLE union. Once in Christ, ever in him. Having taken up his habitation in the heart, he never leaves. None can untie this happy knot.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (5)</figcaption>

</figure><figure class="quote" id="q-a469aee8d1" data-kw="Faith" data-pol="">
<blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</figcaption>

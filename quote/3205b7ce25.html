<main class="wrap"><figure class="quote" id="q-3205b7ce25" data-kw="">
<blockquote><p>II. God himself speaketh in the writings of the prophets and apostles.

But we know that God (though he hath not meanly or obscurely manifested the knowledge of himself and his everlasting power and deity to all men in the world, by such works as are done by him, so that as many as have not glorified him as God are made inexcusable), yet in a more peculiar sort, he hath revealed himself and his will to his church very plainly and perspicuously, namely by prophets and apostles inspired by his grace, and by their writings; and therefore these writings of the prophets and apostles to be the very true word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), I.II, 1: 113-15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-538d6877f3" data-kw="">
<blockquote><p>WHAT ought you to believe concerning the Scriptures, the fountain of all Divine knowledge.

A. That the whole Scriptures were given by the inspiration of God, and so are the very word of God.

Proofs.

2 Tim. 3. 16. All Scripture is given by inspiration of God, &amp;c.

2 Pet. 1. 21. For the Prophecy came not in old time, by the will of man, but holy Men of God, spake as they were moved by the holy Ghost.

Q. What else?

A. That they are perfect every way sufficient of themselves, to direct us in all things needful to holiness or salvation.

Proofs.

Psal. 19. 7. The Law of the Lord is perfect, &amp;c.

2 Tim. 3. 16. 17. And is profitable for doctrine, for reproof, &amp;c. That the man of God may be perfect, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The principal grounds of Christian religion. Briefly and plainly propounded by way of question and answer for the instructing of the younger sort</cite>, (London: Ralph Rounthwaite, 1625), pp 1-2.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

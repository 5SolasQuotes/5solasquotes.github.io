<blockquote><p>…but to know all the ways of God since the beginning of the world, must be a glorious sight. It is not yet six thousand years since God did any thing out of Himself, and what is six thousand years to eternity?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moses his Choice with his Eye Fixed upon Heaven</cite>, … (d. 1646; London, 1650), ch. 46, pp. 540-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-643453b65e" data-kw="">
<blockquote><p>All creatures and created beings compared with God, the first being of Himself subsisting, and the infinite God may be denied, to be beings comparatively: And so our created self is nothing, to wit, nothing in dignity, or excellency beside God, or nothing in the kind of a being that essentially is of itself: as God is in genere entis per essentiam, yet man is a being in the kind of being by participation, in genere entis per participationem; man comared with God, is a poor, worthless, sorry, little-nothing, a weeping, melting, evanishing cipher… So the Scripture says, ‘Man at his best state is altogether vanity.’ Ps. 39:5, ‘Behold, thou hast made my days as a handbreadth, and mine age is nothing before thee: verily every man at his best state is altogether vanity.’ Isa. 40:17, ‘All nations before Him are nothing, and less than nothing, and vanity.’ Yet a heathen may say and think and demonstrate by reason that self and man, and all the world are less in incomparison of the infinite God than nothing to all things, a drop of water to the sea, the shadow to the body, a peny-torch to the light of ten thousand millions of suns in one;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647), pt. 2, p. 359</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-b3534ad0fd" data-kw="">
<blockquote><p>Creation is the action of God, whereby out of nothing He brought forth nature itself and all things in nature, both substances and accidents, in and with the substances, and finished them in the space of six days, both to his own glory and the salvation of the elect… Or thus, creation is a transient or external action of God, whereby in the beginning He made the world by a mere command out of his own free will in six days’ space to the glory of his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: 1654), bk. 3, ch. 2, p. 225</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-c9b63a1088" data-kw="">
<blockquote><p>…Though the general time which they fulfil may be known, or is known and set down by writers, yet the precise particular time, the day of the month, or hour of the day, or (which is the thing inquired) when their months come out and are fulfilled, that’s a secret. Though it be commonly known that a woman goes nine months with child… I may say in this case, as our Lord Jesus Christ said about the end of the world, ‘Of that day and hour knows no man,’ we may know the general time, we may know it will not be long before the world shall end. The time which the world shall go with its great birth is commonly said to be six thousand years; but the day and hour of its travel, and of the consummation of all things according to the decree of God, no man, no nor angel, knows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, (London, 1666), on ch. 39, vv. 1-4, p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

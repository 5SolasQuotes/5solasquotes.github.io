<main class="wrap"><figure class="quote" id="q-9d8bce4778" data-kw="">
<blockquote><p>The exaltation of the assumed nature to the highest and unspeakable dignity, is that honour, which the person of the son of God hath communicated to the nature assumed, so that he hath exalted it above all Angels &amp; men, whom he surpasseth, and excelleth by most far and unspeakable degrees. Heb. 14. Mat. 28.18. John. 17.2. Phil. 2.9. Ephes. 1.20.22.

That exaltation consisteth chiefly in these three points.

1. In the personal union with the word: because the human nature is assumed into the unity of the person of Gods son: so that it is the proper flesh of the eternal son of God, Heb. 2.16.

2. In the gifts, because it hath the fullness of all the gifts of the holy spirit, which can be in a creature, that is to say, it hath not only some gifts, as the rest of the Saints, who have them according to measure: but all gifts, not only in number, but even in the most excellent degree. John. 3.34. Those gifts given to the humanity of Christ, are created qualities: because his humanity is created. That truly is adorned with most excellent, and incomprehensible gifts, but such as do not overthrow and destroy the same.

3. In the fellowship of the office, both of the mediator between God and the believers, and also of the head of the Church, and of the Judge of the whole world. Mat. 28.18. Phil. 2.9. Ephesians. 1.20.22, Psal. 110.1.1. Timot. 2.5. 1. John. 2.12. Heb. 7.25.26.27. and 8.1. and 9.24.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The substance of Christian religion soundly set forth in two books, by definitions and partitions, framed according to the rules of a natural method, by Amandus Polanus professor of divinity. The first book concerneth faith. The second concerneth good works. The principal points whereof are containe</cite>, trans. Elijahu Wilcocks (London: John Oxenbridge, 1595), pp 66-67.</span></figcaption>

<blockquote><p>That I am not my own, but belong—body and soul, in life and in death—to my faithful Savior, Jesus Christ. He has fully paid for all my sins with his precious blood, and has set me free from the tyranny of the devil. He also watches over me in such a way that not a hair can fall from my head without the will of my Father in heaven; in fact, all things must work together for my salvation. Because I belong to him, Christ, by his Holy Spirit, assures me of eternal life and makes me wholeheartedly willing and ready from now on to live for him.</p></blockquote>

<blockquote><p>Objection 2: Further, hypostasis is nothing more than a ‘particular substance,’ as Boethius says (De Duab. Nat.). But it is plain that in Christ there is another particular substance beyond the hypostasis of the Word, viz. the body and the soul and the resultant of these. Therefore there is another hypostasis in Him besides the hypostasis of the Word. … Reply to Objection 2: Hypostasis signifies a particular substance, not in every way, but as it is in its complement. Yet as it is in union with something more complete, it is not said to be a hypostasis, as a hand or a foot [is, as joined to a person’s body]. So likewise the human nature in Christ, although it is a particular substance, nevertheless cannot be called a hypostasis or suppositum, seeing that it is in union with a completed thing, viz. the whole Christ, as He is God and man. But the complete being with which it concurs is said to be a hypostasis or suppositum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3</cite>, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 3, ‘Whether the union of the Word Incarnate took place in the suppositum or hypostasis?’</span></figcaption>

<blockquote><p>Durand [d. 1296] distinguisheth of a twofold composition: Hujus ex his [of this out of that], &amp; hujus ad hoc [of this to that] (bk. 3, Distinction 7, question 3 [this distinction is from Aristotle]). … ‘There is’ (says he) ‘a second kind of composition, and that is hujus ad hoc, and it is not so properly a composition of a third thing out of the things united, as an adjoining of one of the things united unto the other. And thus the person of the Word after the incarnation may be said to be compounded. For hereby, the human nature is added unto the person of the Word and unto the divine nature in the unity of the same person.’ But now, he also subdivides this composition, which he terms hujus ad hoc. ‘For it is either by inherence of one thing in another, and such is the composition of an accident with its subject: or else by way of a supposital dependance of one thing upon, and relation unto another: so that the one should substantially inexist in the other, and the other should terminate the respect and dependance of the former, which inexists, and after this latter manner the person of the Word is after the incarnation compounded. Because, whereas before, it subsisted only in the divine nature, after the incarnation, it by it’s subsistence terminated the dependance of the human nature.’ Thus he. … A second objection is taken from the completeness of the Word. That which comes unto a thing already complete and perfect, comes thereunto only accidentally, and makes therewith only an aggregation, and not a substantial union. But now the person of the Word, from all eternity, was most perfect, and complete. And therefore the adding or coming of the manhood unto it, is not substantial, but accidental. For answer: The major is true only, when one thing is so added, and comes unto another, as that it pertains not to the same subsistence. And thus a man’s garment is added unto him, and therefore united with him only accidentally; so that homo vestitus is ens unum tantum per accidens. But now the manhood is so added, and comes unto the Word, that it is drawn, or assumed into a communion of subsistence with the word, and it’s divine nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Mixture of Scholastical Divinity</cite>, … (Oxford, 1656), ‘There dwelleth in Christ all fullness’, pp. 146 &amp; 149-50 Jeanes was an English presbyterian.</span></figcaption>

ost+perfect%2C+and+complete.+And+therefore+the+adding+or+coming+of+the+manhood+unto+it%2C+is+not+substantial%2C+but+accidental.+For+answer%3A+The+major+is+true+only%2C+when+one+thing+is+so+added%2C+and+comes+unto+another%2C+as+that+it+pertains+not+to+the+same+subsistence.+And+thus+a+man%E2%80%99s+garment+is+added+unto+him%2C+and+therefore+united+with+him+only+accidentally%3B+so+that+homo+vestitus+is+ens+unum+tantum+per+accidens.+But+now+the+manhood+is+so+added%2C+and+comes+unto+the+Word%2C+that+it+is+drawn%2C+or+assumed+into+a+communion+of+subsistence+with+the+word%2C+and+it%E2%80%99s+divine+nature.%E2%80%9D%0A%0A%E2%80%94+Henry+Jeanes%2C+A+Mixture+of+Scholastical+Divinity%2C+%E2%80%A6+%28Oxford%2C+1656%29%2C+%E2%80%98There+dwelleth+in+Christ+all+fullness%E2%80%99%2C+pp.+146+%26+149-50+Jeanes+was+an+English+presbyterian.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd4c4f08593.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d4c4f08593.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-grace-of-union-the-logos-assuming-flesh/#:~:text=Durand%20%5Bd.%201296%5D%20distinguisheth%20of%20a,the%20word%2C%20and%20it%E2%80%99s%20divine%20nature&amp;text=Durand%20%5Bd.%201296%5D%20distinguisheth%20of%20a%20twofold%20composition&amp;text=subsistence%20with%20the%20word%2C%20and%20it%E2%80%99s%20divine%20nature" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Believers are not one with Christ by transfusion of the properties and qualities of the Godhead or manhood unto us. It may be said, how then are they one with Him? I answer, by one and the same Spirit dwelling in Christ and in all the members of Christ. “He that cleaveth to the Lord, is one Spirit” (1 Cor. 6:17). Paul says in this sense that Christ makes the two distinct nations of Jews and Gentiles “one new man” (Eph. 2:15). St. John says, that Christ “dwells in us and we in him by the Spirit’ (1 John 3:24). … all the saints in heaven and all believers upon earth, having one and the same Spirit of Christ dwelling in them, are all one in Christ.</p></blockquote>

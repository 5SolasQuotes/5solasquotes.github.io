<main class="wrap"><figure class="quote" id="q-4ddeaf76d2" data-kw="">
<blockquote><p>It is well known, that in the last century Mr. Rouse’s and Mr. Barton’s versions of the Psalms were much in use and highly esteemed and recommended by many; several other versions were also in use; but the New England and the Scotch were sung by many congregations, much recommended, being preferred by them as the closest versions and most agreeable to the original. For it was then the concurrent judgement of the dissenting churches, that nothing ought to be sung in public worship, but those psalms, hymns, and spiritual songs which God has provided his Church with in his inspired Word. But of late years these versions have been much despised by some, and laid aside by many congregations which formerly used them; because of the roughness of the lines… and other versions, or rather paraphrases on the psalms are made use of by them. Many others use hymns of mere human composure as preferable to the inspired ones. But there are yet many serious Christians, and some churches, that adhere to the sentiments of our godly ancestors in preferring Scripture psalms, hymns and songs to any mere human composures, lest they should incur the guilt of bringing strange fire to God’s altar…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-pike.html">Samuel Pike</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Psalms in Metre. Fitted to the Various Tunes in Common Use</cite>, … (London, 1751), ‘The Preface’, p. iii. Pike (1717?–1773) was an Independent minister in London, known for his work on cases of conscience. He argues for inspired Bible-song singing in the Preface.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-db4853e622" data-kw="">
<blockquote><p>There be three kinds of songs mentioned in this book:

1. Mizmor, in Greek psalmos, a psalm:

2. Tehillah, in Greek humnos, a hymn or praise: and 3. Shir, in Greek ode, a song or lay. All these three the apostle mentions together, where he wills us to speak to ourselves with ‘psalms, and hymns, and spiritual songs,’ Eph. 5:19.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-ainsworth.html">Henry Ainsworth</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Psalms</cite>, (Amsterdam, 1612)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-a9beea392e" data-kw="">
<blockquote><p>When a sanctified man reads David’s psalms, or Paul’s epistles, how is he surprised with wonder to find the very workings of his own heart so exactly deciphered and fully expressed there! O, saith he, this is my very case, these holy men speak what my heart hath felt.</p></blockquote>

</figure><figure class="quote" id="q-db563e53ef" data-kw="">
<blockquote><p>In 1643, White was chosen to serve among the Westminster Assembly of Divines. When the Assembly swore to uphold the Solemn League and Covenant on September 25, 1643, John Lightfoot recorded in his Journal that “Mr. White prayed near upon an hour.” White attended faithfully and contributed diligently to the work of the Assembly, and was in fact married to the sister of Cornelius Burgess, his co-assessor at the Assembly. While the Assembly was engaged in a battle over whose metrical Psalter would be chosen to serve as the instrument of uniformity and “get the civil sanction,” the leading candidates being Francis Rous and William Barton. White, who had prepared his own version of the metrical Psalms, preferred not to publish it while the debate was going on, in the interests of harmony. It was published posthumously with the permission of his son under the title David’s Psalms in Metre, agreeable to the Hebrew. To be sung in usual Tunes To the benefit of the Churches of Christ (1655) and shows his poetic skills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David’s Psalms in meter. Agreeable to the Hebrew</cite>, 1655 | Background to White’s psalter by Andrew Myers:</span></figcaption>

<div class="actions"><button class="copy" data-copy="“In 1643, White was chosen to serve among the Westminster Assembly of Divines. When the Assembly swore to uphold the Solemn League and Covenant on September 25, 1643, John Lightfoot recorded in his Journal that “Mr. White prayed near upon an hour.” White attended faithfully and contributed diligently to the work of the Assembly, and was in fact married to the sister of Cornelius Burgess, his co-assessor at the Assembly. While the Assembly was engaged in a battle over whose metrical Psalter would be chosen to serve as the instrument of uniformity and “get the civil sanction,” the leading candidates being Francis Rous and William Barton. White, who had prepared his own version of the metrical Psalms, preferred not to publish it while the debate was going on, in the interests of harmony. It was published posthumously with the permission of his son under the title David’s Psalms in Metre, agreeable to the Hebrew. To be sung in usual Tunes To the benefit of the Churches of Christ (1655) and shows his poetic skills.”

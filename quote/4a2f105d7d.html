<main class="wrap"><figure class="quote" id="q-4a2f105d7d" data-kw="">
<blockquote><p>Moreover, as we may not use any indifferent thing at our own pleasure; so neither may the Church at her will and pleasure command the use of it: but as our practice, so the Church’s injunction must be determined and squared according to the former [three] rules [of using indifferent things (1) to the glory of God, (2)according to the law of charity and (3) purity of conscience]. And if any man think, that in the use of things indifferent he may be led and ruled by the Church’s determination without examining any further, let him understand that the Church’s determination is but a subordinate rule, or a rule ruled by higher rules. … He [Dr. Forbes] has been speaking of the rules which God’s Word gives us concerning the use of things indifferent, and all of them he comprehends under this rule, that we should hear the Church and obey them who are set over us, as if God’s rules were subordinate to men’s rules and not theirs to his. We say not that every man may use things indifferent suo arbitratu [according to his judgment]: but we say withal that neither may the Church command the use of things indifferent, suo arbitratu. Both, she in commanding and we in obeying, must be guided by the rules of Scripture. They who are set over us in the Church have no power given them of Christ which is not for edifying, Eph. 4:12. The council of the apostles and elders at Jerusalem (which is a lively pattern of a lawful synod to the world’s end) professed they would lay no other burden upon the disciples except such things as the law of charity made necessary for shunning of scandal: and so that which they decreed had force and strength to bind, a Charitate propter Scandalum [from charity due to scandal], says Sanctius. But suo arbitratu [by their (mere) judgment] they enjoined nothing. It appears by this place (says [Thomas] Cartwright) that there may be no abridgment of liberty simply decreed, but in regard of circumstance, according to the rule of edification. And if the Church’s decrees and canons be not according to the rules of the Word, yet forasmuch as everyone of us shall give account of himself and his own deed, we must look that whatsoever the Church decree, yet our practice in the use or omission of a thing indifferent, be according to the foresaid rules. We may not for the commandment of men transgress the rule of piety by doing anything which is not for God’s glory and ordered according to his will; neither ought any of us to obey men, except for the Lord’s sake and as the servants of Christ, doing the will of God; which teaches us the manner how we ought to obey men, namely, propter Christum et sicut Christus praecipit [for Christ, as Christ commands]. For if we should know no more but the will of man for that which we do, then we should be the servants of men, not the servants of Christ. Neither yet may we for any human ordinance break the rule of charity: but whatsoever either would weaken or not edify our brother, be it never so lawful, never so profitable to ourselves, never so powerfully by earthly authority enjoined, Christians, who are not born unto themselves, but unto Christ, unto his Church and unto the fellow members, must not dare to meddle with it. Nor lastly may we obey men so as to break the Law of Purity, and perform any action with a doubtful conscience, that is, whereof either the Word has not, or we out of it have no warrant: in which case tender consciences must be tendered, rather than be racked by authority: for be the things in themselves never so lawful, etc., they are utterly unlawful to me without such information. Whereas therefore some say that in the use of matters indifferent, the laws of those who are set over us ought to rule us; we still answer that our practice may not be ruled by any law of man except it be according to the rules of the Word; whereof one is this: Tantum oportere esse obedientiae studium in Christianis, ut nihil agant, quod non existiment vel potius certi sint placere Deo (Calvin on Rom. 14:5).</p></blockquote>

<blockquote><p>Arguments of Peter Martyr disputing with Mr. Chadsey upon the first question: The analogy and resemblance between the sacrament and the thing signified must ever be kept in all sacraments. In the sacrament of the Lord’s body, this analogy or resemblance cannot be kept, if bread be transubstantiated: Ergo [therefore], the substance of bread must needs remain in the sacrament of the Lord’s body. The major [premise] of this argument is certain by St. Austen [Augustine] (Book on Catechizing in the Rudiments; Epistle to Dardan), where he says: Sacraments must needs bear a similitude of those things whereof they are sacraments, or else they can be no sacraments.</p></blockquote>

<blockquote><p>For the Church does bind and loose in the external court, either by a commission from Him who as head of the Church, and who as King gave to her the keys of the Kingdom, or by a general arbitrary power given to the magistrate and Church, to do in these things as they please, so they do nothing contrary to the Word, though not according to the Word, as they are to do in doctrinals; If the former be said, then must the external government be upon the shoulder of Christ as King, which is that which we teach: If the latter be said, then might the magistrate &amp; Church appoint such an ordinance as excommunication, and so they may by their arbitrary power make a Gospel promise of ratifying an ordinance in heaven and of pardoning sins in heaven; for he that can make the ordinance can make also the Gospel-promise, and he that can by an arbitrary power make one promise or part of the Gospel, may make all. And if either magistrate or Church can appoint such an ordinance as has a promise of binding and loosing made good in heaven, they may also take away such ordinances and Gospel-promises; for it is the same power to make and add, to unmake and destroy ordinances. Hence also I argue for the immutability of a Scriptural Platform, that the Church cannot alter at her will… I infer that the whole Platform of Law and Gospel is of divine institution, and the particulars of obedience and faith are not arbitrary to the Church; just so in discipline, I say the like, there is no more reason for one part written by God than for another.</p></blockquote>

</figure><figure class="quote" id="q-cd99a1c389" data-kw="">
<blockquote><p>…you [Gilbert Burnet] boldly attempt to make even the very sacraments arbitrary by asking why we use not washing of feet, since there is no sacrament set down more punctually in Scripture? And when your non-conformist [in your book] retorts that you are under the same obligation (which retortion may be pertinently made to most of your objections), you tell him that you have a clear answer, that in these externals God intended no perpetual obligation, and therefore in them you follow the practice of the catholic Church… As for this your lax acceptation of a professed indifferency in externals, what part of the Christian religion or worship may it not corrupt or subvert? And seing it does tolerate and allow the not practising of the washing of feet to you, as well founded In Scripture as either of the sacraments, would it not in a just parity of reason dispense with and forego these also? This is indeed doctrine so damnable, that I hope it shall never need an antidote; and therefore I return to examine your third or eight sacrament (I know not which, for all are but external) of washing of feet. And you say that it has in Scripture of element, water, the action, washing the feet, the institution, ‘as I have done so do ye’ and ‘ye ought to wash one another’s feet’, and the spiritual use of it, humility: Whence you conclude: ‘Why do ye not therefore use this rite?’ To which last point, it is, that waving any further discourse about the nature and requisites of a sacrament, whereof, notwithstanding your parrallel description of this washing, yet I perceive you are loathe to apply the name, I shall direct my answere, viz.: That this washing is not to be used, because though our Lord did practice this lowly act of condescendence as eminently expressive of that humility whereunto He would have his disciples instructed, yet neither is it in itself of the nature of a sacramental sign, whereof all the significancie is from the institution, and virtue in the exhibition of the thing signified, which you cunningly omit to mention; Nor does Christ perform it by way of institution, for repetition, but by way of example, for imitation, as is manifest from the text, John 13:4, etc. where we find that our Lord does first wash his disciples’ feet before He told them what He was a doing; and then having done the act, not simply significant by his appointment, but of itself as the effect expressing the greatest humility as its cause, He teaches them not a […]o […]emne reiteration, but the use in these words, ‘If I your Lord and Master have washed your feet, ye also ought to wash on another’s feet’: ‘If I have been among you as He that serves, so ought ye to serve one another, for I have given you an example that ye should do as I have done to you.’ I have not showed you humility in a figure to be repeated for your remembrance, but by a solid practice taught you the like performance: so that to turn this pattern unto a rite is in effect as far from our Lord’s purpose as the instruction of plain examples is preferable to that of mystic representations: Which exposition is so true and sound, that as this fancy of yours was never owned by the Church of Christ, so, it is most certain, that where it has been followed (I mean by the Pope) and this action has been used as a rite, it has only been made a color to the most prodigious and superlative pride that ever the sun beheld: and thus I hope all men may see that the not using of this washing, never again used for anything we read, by way of sacrament or ceremony, either by our Lord or his apostles and Churches, is neither a deformity in us from the Scripture, nor an argument for your irreligious laxness in things you call externals.</p></blockquote>

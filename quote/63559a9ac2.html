<main class="wrap"><figure class="quote" id="q-63559a9ac2" data-kw="Scripture interprets Scripture">
<blockquote><p>Whatever, then, the papists talk so vauntingly of fathers and of councils, yet it is to their ecclesiastical prince, that is to the pope, that all controversies are finally referred, and with that prince and supreme interpreter rests the whole meaning of scripture and the right of adjudicating upon it. But we do not acknowledge that prince, whom Christ never constituted; and we say that the scripture itself publicly set forth and propounded is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/rome/the-papacy.html">Rome: The Papacy</a> › <a href="../topics/rome/the-papacy/papal-supremacy.html">Papal supremacy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-56a4cd9a83" data-kw="">
<blockquote><p>Biblicism is one thing &amp; sola Scriptura is another. Biblicism is rationalist &amp; irrationalist but sola Scriptura is not. If you&#x27;re not reading the Scriptures with the church and in the communion of the saints you&#x27;re not following Sola scriptura and the confessional Protestants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-scott-clark.html">R. Scott Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post on X (@Heidelblog01)</cite>, Oct 27, 2023</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“Biblicism is one thing &amp; sola Scriptura is another. Biblicism is rationalist &amp; irrationalist but sola Scriptura is not. If you&#x27;re not reading the Scriptures with the church and in the communion of the saints you&#x27;re not following Sola scriptura and the confessional Protestants.”

— R. Scott Clark, Post on X (@Heidelblog01), Oct 27, 2023">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBiblicism+is+one+thing+%26+sola+Scriptura+is+another.+Biblicism+is+rationalist+%26+irrationalist+but+sola+Scriptura+is+not.+If+you%27re+not+reading+the+Scriptures+with+the+church+and+in+the+communion+of+the+saints+you%27re+not+following+Sola+scriptura+and+the+confessional+Protestants.%E2%80%9D%0A%0A%E2%80%94+R.+Scott+Clark%2C+Post+on+X+%28%40Heidelblog01%29%2C+Oct+27%2C+2023&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F56a4cd9a83.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/56a4cd9a83.html">Permalink</a><a class="src" href="https://x.com/Heidelblog01/status/1718039987390648590" rel="noopener" target="_blank">Read it online · X</a></div>
</figure><figure class="quote" id="q-a7d656db67" data-kw="Augustine Authority of the church">
<blockquote><p>Augustine, therefore, does not here say that the faith of the godly is founded on the authority of the Church; nor does he mean that the certainty of the gospel depends upon it; … the obvious inference from them is, that this holy man had no intention to suspend our faith in Scripture on the nod or decision of the Church, but only to intimate (what we too admit to be true) that those who are not yet enlightened by the Spirit of God, become teachable by reverence for the Church, and thus submit to learn the faith of Christ from the gospel. In this way, though the authority of the Church leads us on, and prepares us to believe in the gospel, it is plain that Augustine would have the certainty of the godly to rest on a very different foundation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.7.3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-churchs-authority-over-scripture.html">The church&#x27;s authority over Scripture</a></span><span class="t"><a href="../topics/the-church/churchs-authority-and-power.html">Church&#x27;s Authority and Power</a> › <a href="../topics/the-church/churchs-authority-and-power/the-churchs-authority-over-scripture.html">The church&#x27;s authority over Scripture</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>

</figure><figure class="quote" id="q-82d33e112a" data-kw="Pope as interpreter">
<blockquote><p>Besides, the cardinals attend the pope only in the way of ornament and pomp, and have no place in the settling of any definition. Yea, although all the cardinals were to say nay, yet the pope can define what he will. Therefore, although the Jesuit puts a council of pastors along with the pope, yet in reality this authority of interpretation is lodged with the pope alone; because, however much the rest oppose, yet his opinion shall always stand and prevail.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 3</span></figcaption>

</figure><figure class="quote" id="q-a2863a5000" data-kw="Judge of controversies">
<blockquote><p>It is not necessary that there should be in the church any external infallible judge by whom controversies of faith may be solved. It suffices for believers, for the tranquility and rest of their consciences, that there is an interior or divine definitive judgment (namely, of Christ and the Holy Spirit speaking in the Scriptures). An external human judgment, infallible and definitive in the church, is neither necessary nor possible. Controversies do not belong to external order but to the mental judgment for which a judge is necessary to enlighten the mind and sanctify the will (which an external and human judge cannot do because he has no power over the conscience).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.23</span></figcaption>

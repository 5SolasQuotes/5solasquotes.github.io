<main class="wrap"><figure class="quote" id="q-76b5726ef8" data-kw="">
<blockquote><p>His worship must be spiritual, in Heb. 9. 1. Then verily the first Covenant had also Ordinances of Divine Service, and a worldly Sanctuary. Mark, in the time of the Law it was but a worldly Sanctuary in comparison of what is now in the times of the Gospel; those ways of worship though they were once appointed by God, Christ the King of His Church in the new Testament would not have His homage tendered up by these ways of worship, they were too worldly for Him[.]

[T]hen surely to have the inventions of men in the worship of Christ, in the new Testament especially, it is too worldly for Christ: No it must be Divine and Spiritual, he that worships, must worship in spirit and in truth: all that worship and homage we tender up to Jesus Christ, we must look to have it spiritual and not worldly; and so the Ordinances, though they have something external, as the Sacraments, yet if we stick to the outward part, we do not worship Christ as our King in a right way; but we must be spiritual in all, look upon the spiritual part in all Ordinances, or else (I say) we do not tender up that homage to Christ that is due to Him, as the King of His Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), pp 142-43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-5916053771" data-kw="">
<blockquote><p>If it be here replied that the actions which make up mediate worship, must be actions of the Second Table, not of the First… I answer: It is the verdict of the Word and the common consent of all divines that all the actions and duties which concern our brother as the next object and end, and so determine upon him are required, and regulated by the Second Table: since therefore these things of comliness and order are of this nature, by the Rejoinder’s grant, I do not see how it can be avoided with any colour of reason but they must be commanded in the Second Table, and so come under the definition of mediate worship…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), Manuduction, ch. 12, ‘Concerning Worship’, p. 137</span></figcaption>

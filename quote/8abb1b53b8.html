<main class="wrap"><figure class="quote" id="q-8abb1b53b8" data-kw="">
<blockquote><p>We had said, following the apostle and all Scripture, that there is a twofold righteousness of the saints by which they are just before God and men. One is Christ’s, perfect, on which all their hope of God’s grace and salvation and eternal life entirely rests. The other is begun in them by the Spirit of Christ, in which they ought not to trust, because it is always imperfect while they live here and cannot be approved by God except out of his liberal and infinite mercy and the merit of Christ. By this righteousness no one is justified before God with the justification of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-de-dieu.html">Ludovicus de Dieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions on Romans</cite>, … to which is added, a Gleaning on the rest of the same Apostle’s, as well as the Catholic Epistles (Leiden: Elzeviers, 1646) de Dieu (1590-1642) was a Dutch reformed minister and a leading orientalist. | on Rom. 8:4, pp. 67-73 | He adds on, p. 308:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd461b1d8a" data-kw="">
<blockquote><p>You may remember that I said (a word perhaps that some think much of) that the question betwixt us and Rome is not whether we be justified by faith or no? But whether we be justified at all; I will make it good. There are two graces, righteousness imputed, which implies forgiveness of sins; and righteousness inherent, which is that grace of sanctification begun. They utterly deny that there is any righteousness but righteousness inherent. They say forgiveness of sins is nothing but sanctification. A new doctrine never heard of in the Church of God, till these last days, till the spawn of the Jesuits devised it. Forgiveness of sin is this, that God will never charge me with it again. They say that forgiveness of sin is an abolishing of sin in the subject, where is true remission; as much as to say, There is no justification distinct from sanctification: whereas the apostle distinguishes them, when as he says, ‘The Son of God is made unto us wisdom, righteousness, sanctification and redemption’: ‘He is made unto us’ (of God). By the way let me expound it unto you. Christ has three offices; A Prophetical, Regal and Sacerdotical office… The work of Christ’s priestly office is to be a propitiation for our sins; sanctification proceeds from the scepter of his kingdom: The one is without me, the other within me. The one receives degrees, the other not. As a man that is holy may be more holy; but imputed righteousness does not more forgive one man than another. Imputation is without augmentation or diminution. Those things which have diverse contraries, cannot be one and the same thing. Justification and sanctification have diverse contraries. The contrary to justification is condemnation; but the contrary to sanctification is wickedness, and false-dealing, etc. Aristotle distinguishes homonymous words and bids you consider their contraries; thus you see the difference between these two.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen Sermons preached in Oxford</cite>, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 16th Sermon, on Rom. 5:1, pp. 421-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-d7137fdf92" data-kw="">
<blockquote><p>I hold firmly that the justification of a believer is a finished, perfect, and complete work; and that the weakest saint, though he may not know and feel it, is as completely justified as the strongest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holiness</cite>, p. 166</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-as-a-one-time-act.html">Justification as a one-time act</a></span><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a> › <a href="../topics/justification/twofold-justification/increase-of-justification-by-works.html">Increase of justification by works</a></span></div>

— J. C. Ryle, Holiness, p. 166">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+hold+firmly+that+the+justification+of+a+believer+is+a+finished%2C+perfect%2C+and+complete+work%3B+and+that+the+weakest+saint%2C+though+he+may+not+know+and+feel+it%2C+is+as+completely+justified+as+the+strongest.%E2%80%9D%0A%0A%E2%80%94+J.+C.+Ryle%2C+Holiness%2C+p.+166&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd7137fdf92.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d7137fdf92.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-82485833f0" data-kw="">
<blockquote><p>We do not deny (as the Papists falsely slander us) all inherent righteousness, 2 Cor. 5:17, nor all justification before God by inherent righteousness, 1 Kn. 8:32 [“Then hear thou in heaven, and do, and judge thy servants, condemning the wicked, to bring his way upon his head; and justifying the righteous, to give him according to his righteousness.”]. But this we teach, that this inherent righteousness is not that righteousness whereby any poor sinner in this life can be justified before God’s Tribunal, for which he is pronounced to be innocent, absolved from death and condemnation, and adjudged unto eternal life. … Whether inherent justice be actual or habitual? Bishop Davenant, ch. 3, Of Habitual Righteousness, says a certain habitual or inherent justice is infused into all that are justified, Jn. 1:13; 2 Cor. 5:17; Gal. 6:15; 1 Cor. 6:11, 19; 2 Pet. 1:4. All those that are justified do supernatural works; Therefore, it is certain that they are endued with supernatural grace and holiness. We are said to be righteous, from this inherent justice we are said to be just, and that by God Himself, Gen. 6:9; Heb. 11:4; Lk. 1:61 &amp; 2:25; 1 Pet. 4:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6, Of Justification, pp. 517-18 Leigh, though he says what he says below, nor Davenant, who is referenced, evidences a twofold justification as such.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<main class="wrap"><figure class="quote" id="q-dd95c87f66" data-kw="">
<blockquote><p>When he brings in the first-begotten into the world, which was at the time of the incarnation, he says, ‘Let all the angels of God worship Him,’ Heb. 1:6. And upon his resurrection from the dead, ‘God has given Him a name which is above every name; that at the name of Jesus every knee should bow,’ that is, in a way of religious adoration, Phil. 2:9-10; and though Christ, as man, is not the object of such adoration, yet what He has done in the human nature, is a motive and argument why blessing and honor should be given to his Person, having both natures united in Him; ‘Worthy is the Lamb that was slain, to receive power, etc.’ Rev. 5:12-13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Doctrinal &amp; Practical Divinity (Baptist Standard Bearer)</cite>, p. 387</span></figcaption>

<blockquote><p>3. Yet we must not imagine any such active power in God, which is a diverse thing from his essence. 4. For God in his own most simple essence is such, whatsoever He be: just, good, or almighty. 5. And although there be indeed but one only power in God: yet for the diverse respects wherein He is considered, it may be said (not impiously) to be manifold. 6. For it is one respect when it is considered as God works always in Himself in understanding, willing, loving: and another respect when we behold it as God has wrought outwardly or without himself in creating the world: and as He evermore works in governing the same: and as He could work innumerable things, if He would. 7. Therefore as the actions of God are not unfittly distinguished into abiding actions and passing: so the power of God may not unjustly be called twofold, one, wherein He ever from all eternity did work and does work in himself: the other, wherein He did not only make, rules, and works all things in time without Himself: but also can bring to pass infinite things, which He never will do. 8. Whereupon it is also that the same is usually divided into actual power, which works whatsoever He will: and into absolute power, whereby he can also do infinite things which He will not: because otherwise He could not be said to be simply omnipotent.</p></blockquote>

<blockquote><p>§XVIII. A completed work (apotelesma) is one work proceeding from both natures. In this completed work (apotelesma) the divine has a divine energy and the human nature a human energy, such as justification and glorification. §XIX. An energy is a power and operation of a particular nature. The divine energy in its mode is divine; the human nature only has human energy. Thus, the actions are two, but the work is one. “By the spirit He offered Himself” (Heb. 9:14). §XX. Each nature exerts these powers in the office of Christ the Mediator. But the Mediator is: 1. Unique (1 Tim. 2:5), 2. Perfect (Heb. 7:25), 3. And acting as surety and making payment (spondens et solvens) (Mt. 26:28) 4. For all believers of the Old and New Testament and all their sins (Rom. 3:25) 5. According to both natures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), ch. 11, ‘Christ’</cite>, p. 123</span></figcaption>

<blockquote><p>Q. 41.9. How often were the commandments written on tables of stone? A. The first being broken by Moses, on occasion of the idolatry of Israel, Exod 32:19, the Lord condescended to write on two other tables, the very same words that were on the former, Exod 34:1. Q. 41.10. Was there any difference between the first two tables and the second? A. The first two, which were entirely the work of God, (the polishing as well as the engraving,) were broken beneath the mount, Exod 32:16,19; but the second, which were hewed by Moses, the typical mediator, were put into the ark, Deut 10:3,5. Q. 41.11. What spiritual mystery was represented by this? A. That though the covenant of works, made with the first Adam, was broken and violated by him, yet it was fulfilled in every respect by Christ the true Mediator, who “restored that which he took not away,” Ps 69:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism</cite></span></figcaption>

</figure><figure class="quote" id="q-8ff5227a6a" data-kw="">
<blockquote><p>For the whole Christ is adored, but not the whole of Christ. Abstract and concrete terms should not be confused, and a distinction between the natures and properties, against a Eutychian confusion of the natures and properties, ought to be maintained. We read that Cyril did this carefully, who left us his writing on John, book 2, cp. 92, as follows: The humanity [of Christ], says Cyril, considered simply in itself and not in the relation counts itself among those who worship, and Christ also worships, as man, after He became man. But He is always worshipped with the Father and the Spirit since He is true God according to his nature. And again, Should we worship Immanuel as a man (in Himself, namely, considered absolutely in the union)? No. This in fact would be nonsense, both a deception and also a mistake. In doing so we would in fact differ in no way from those who worship the creature alongside the maker and author.</p></blockquote>

— Theodore Beza, Jakob Andreae &amp; Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard 1586 ed. Jeffrey Mallinson tr. Clinton J. Armstrong (Concordia Publishing House, 2017), p. 414">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+the+whole+Christ+is+adored%2C+but+not+the+whole+of+Christ.+Abstract+and+concrete+terms+should+not+be+confused%2C+and+a+distinction+between+the+natures+and+properties%2C+against+a+Eutychian+confusion+of+the+natures+and+properties%2C+ought+to+be+maintained.+We+read+that+Cyril+did+this+carefully%2C+who+left+us+his+writing+on+John%2C+book+2%2C+cp.+92%2C+as+follows%3A+The+humanity+%5Bof+Christ%5D%2C+says+Cyril%2C+considered+simply+in+itself+and+not+in+the+relation+counts+itself+among+those+who+worship%2C+and+Christ+also+worships%2C+as+man%2C+after+He+became+man.+But+He+is+always+worshipped+with+the+Father+and+the+Spirit+since+He+is+true+God+according+to+his+nature.+And+again%2C+Should+we+worship+Immanuel+as+a+man+%28in+Himself%2C+namely%2C+considered+absolutely+in+the+union%29%3F+No.+This+in+fact+would+be+nonsense%2C+both+a+deception+and+also+a+mistake.+In+doing+so+we+would+in+fact+differ+in+no+way+from+those+who+worship+the+creature+alongside+the+maker+and+author.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Jakob+Andreae+%26+Theodore+Beza%2C+Lutheranism+vs.+Calvinism%3A+the+Classic+Debate+at+the+Colloquy+of+Montbeliard+1586+ed.+Jeffrey+Mallinson+tr.+Clinton+J.+Armstrong+%28Concordia+Publishing+House%2C+2017%29%2C+p.+414&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8ff5227a6a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8ff5227a6a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-grounds-of-christ-the-mediator-receiving-divine-worship/#:~:text=For%20the%20whole%20Christ%20is%20adored,creature%20alongside%20the%20maker%20and%20author&amp;text=For%20the%20whole%20Christ%20is%20adored%2C%20

<blockquote><p>Again, as sanctification is imperfect, so faith has its degrees by which it increases and grows, both as to knowledge and as to trust. In this sense, we do not deny that faith can be called in a certain sense implicit, both in children and the uninstructed (who have only an obscure knowledge) and in the more advanced (in whom the light is always mixed with darkness, who often can reach only the fact [to hoti], but do not rise to the why [to dioti]). Thus the faith of the Old Testament fathers could be called obscure and implicit with respect to ours on account of the obscurity of the revelation. But the question is whether faith in its conception included knowledge; if not a full, still a true and certain knowledge in its own order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1994) | 15th Topic, 9th Question, ‘Is faith assent without knowledge and can it be defined better by ignorance than by knowledge? We deny against the Romanists.’ in vol. 2, pp. 564-68, p. 565</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-427ad26475" data-kw="">
<blockquote><p>Controversy I: Is there implicit faith? Orthodox Position: Implicit faith, that is, intricate and not explicit, exists in two ways:

1. Regarding knowledge, when the things necessary for salvation are not sufficiently understood distinctly, as seen in the disciples of Christ, who imagined a worldly kingdom. Similarly, today, in many of the elect, there is a multitude of ignorance forgiven because they know the foundation of salvation.

2. Regarding the apprehension of Christ and His benefits, when at the time of first conversion and temptation, faith wavers (Isaiah 42:3; Matthew 5:6). Here, the desire to believe is accompanied by infinite sighs, which God approves (Romans 8:26). Position of Bellarmine: Implicit faith is that in which one agrees with the Church and professes to believe what the Church and its pastors believe. The Church is the pillar of truth, and the pastors who agree with the Roman Pope cannot err. Censure: Knowledge is of the essence of faith (Isaiah 53:11; John 17:3). Furthermore, the Church is called the pillar of truth not by inspiring authority but by the ministry of preserving and witnessing. Finally, there is a fallacy of begging the question involved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><figure class="quote" id="q-4bc6601082" data-kw="">
<blockquote><p>But magistrates as magistrates hold forth in their law-abstinence from those same sins of adultery, incest, murder… 2. Not under the pain of eternal wrath and condemnation, before the Judge of [the] quick and [the] dead: Magistrates as magistrates have neither calling, office, place nor power to threaten or inflict eternal punishment; if magistrates do persuade the equity of abstinence from adultery, incest, murder in their statutes or acts of parliament from the Word of God, from the sixth and seventh command[ments] of the Decalogue, from the Judgment and eternal punishment that follows these sins, they so persuade not as magistrates [from their office per se], but as divines and as godly and Christian men; Yet my sense is not that the magistrate can lawfully command obedience in matters of religion not understood or known by the subjects: that were to exact blind obedience; but my meaning is that the magistrate as the magistrate holds not forth his commandments to teach and inform the conscience, as pastors do, but he presupposes that his mandates are known to be agreeable to the Word of God, and proposes them to the subjects to be obeyed.</p></blockquote>

<blockquote><p>2. Papists will have the magistrates so to defend the faith, as they have not power to judge [by way of jurisdiction in spiritual things], not [even] as Christians with the judgement of discretion, what is right or wrong, but they must, as blind servants, execute what Prelates decree, yea and see (non propriis (says Henry Blyssemius) sed alienis Episcoporum ac praelatorum suorum oculis videre) ‘not with their own eyes, but with the eyes of their Prelates,’ yea and the magistrate should not read the Scripture (say Papists and Nicanor’s brethren, the Jesuits), [which is] expressly contrary to God’s Word, Dt. 17:17, ‘He shall read in the book of the Law all the days of his life,’ Josh. 1:8, but only believe as the Church believes, and this is blind obedience that they require of princes; this faith or obedience we think abominable in all men, as [also] in princes.</p></blockquote>

<blockquote><p>II. God alone is lord of the conscience,[k] and hath left it free from the doctrines and commandments of men which are in any thing contrary to his word, or beside it, in matters of faith or worship.[l] So that to believe such doctrines, or to obey such commandments out of conscience, is to betray true liberty of conscience:[m] and the requiring of an implicit faith, and an absolute and blind obedience, is to destroy liberty of conscience, and reason also.[n] [k] Jam. 4:12. Rom. 14:4. [l] Acts 4:19. Acts 5:29. 1 Cor. 7:23. Matt. 23:8-10. 2 Cor. 1:24. Matt. 15:9. [m] Col. 2:20,22,23. Gal. 1:10. Gal. 2:4,5. Gal. 5:1. [n] Rom. 10:17. Rom. 14:23. Isa. 8:20. Acts 17:11. John 4:22. Hos. 5:11. Rev. 13:12,16,17. Jer. 8:9. … IV. And because the powers which God hath ordained, and the liberty which Christ hath purchased, are not intended by God to destroy, but mutually to uphold and preserve one another;</p></blockquote>

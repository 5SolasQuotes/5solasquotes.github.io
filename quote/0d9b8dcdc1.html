<main class="wrap"><figure class="quote" id="q-0d9b8dcdc1" data-kw="">
<blockquote><p>I cannot, saith the Christian, discourse with that fluency, nor pray with that elegancy as others.

Answ. 1. Grace is beyond gifts; Thou comparest thy grace with another’s gifts, there is a vast difference; Grace without gifts is infinitely better then gifts without grace; in Religion, the vitals are better then the intellectuals: Gifts are a more extrinsically and common work of the Spirit, which is incident to reprobates; grace is a more distinguishing work, and is a jewel hung only upon the Elect. Hast thou and seed of God, the holy anointing? be content.

I. Thou sayest, thou canst not discourse with that fluency as others.

Answ. Experiments in Religion are beyond notions, and impressions beyond expressions. Judas no doubt could make a learned discourse of Christ; but welfare the woman in the Gospel, that felt virtue coming out of him. A sanctified heart is better then a silver tongue. There is as much difference between gifts and grace, as between a Tulip painted on the wall, and one growing in the Garden.

II. Thou sayest, thou canst not pray with that elegancy as others.

Answ. Prayer is a matter more of the heart then the head. In prayer it is not so much fluency prevails, as fervency; nor is God so much taken with the elegancy of speech, as the efficacy of the Spirit. Humility is better then volubility; here the mourner is the orator, sighs and groans are the best Rhetorique.

2. Be not discontented; For God doth usually proportion a man’s parts to the place where he calls him: Some are set in an higher sphere and function, their place requires more parts and abilities; but the most inferior member is useful in its place, and shall have a power delegated for the discharge of its peculiar office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Autarkeia, or, The art of divine contentment</cite>, (2nd edn, London: Ralph Smith, 1654), pp 108-10.</span></figcaption>

<blockquote><p>I have also no difficulty in conceding to you, that there is nothing more perilous to our salvation than a preposterous and perverse worship of God. The primary rudiments, by which we are wont to train to piety those whom we wish to gain as disciples to Christ, are these; viz., not to frame any new worship of God for themselves at random, and after their own pleasure, but to know that the only legitimate worship is that which he himself approved from the beginning. For we maintain, what the sacred oracle declared, that obedience is more excellent than any sacrifice (1 Sam. xv. 22.) In short, we train them, by every means, to be contented with the one rule of worship which they have received from his mouth, and bid adieu to all fictitious worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Cardinal Sadolet’s Letter (1539) in Tracts and Letters relating to the Reformation, trans and ed. Henry Beveridge, (7 vols, Edinburgh: Calvin Translation Society, 1844), 1: 34.</cite></span></figcaption>

</figure><figure class="quote" id="q-3232404889" data-kw="">
<blockquote><p>God, indeed, from time to time showed the presence of his divine majesty by definite signs, so that he might be said to be looked upon face to face. But all the signs that he ever gave forth aptly conformed to his plan of teaching and at the same time clearly told men of his incomprehensible essence. For clouds and smoke and flame [Deuteronomy 4:11], although they were symbols of heavenly glory, restrained the minds of all, like a bridle placed on them, from attempting to penetrate too deeply. Therefore Moses, to whom, nevertheless, God revealed himself more intimately than to the others [Exodus 33:11], did not succeed by prayers in beholding that face; but he received the answer that man is not able to bear such great brightness [Exodus 33:20]. The Holy Spirit appeared under the likeness of a dove [Matthew 3:16]. Since, however, he vanished at once, who does not see that by one moment’s symbol the faithful were admonished to believe the Spirit to be invisible in order that, content with his power and grace, they might seek no outward representation for themselves? For the fact that God from time to time appeared in the form of a man was the prelude to his future revelation in Christ. Therefore the Jews were absolutely forbidden so to abuse this pretext as to set up for themselves a symbol of deity in human form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559; Battles edition), 1.11.3.</span></figcaption>

get="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-3b7a0b98ee" data-kw="">
<blockquote><p>We say that it is a superstition to esteem one day more holy than another, or to think that to abstain from labour is something which, in itself, pleases God (Rom 14:5, 6; Col 2:16, 17). But, following what the Lord has commanded, we sanctify one of the seven days (Gen 2:3). We devote it entirely to ecclesiastical assemblies to hear the Word of God; yet, as we have said, there is with us no Judaistic ceremony or stupid superstition. That is why we have not chosen the Jewish Sabbath, Saturday, but Sunday, following the custom of the early Church (1 Cor 16:2; Acts 20:7; Rev 1:10). As for other festival days, we have removed them as much as possible from us, especially those which have been introduced through manifest idolatry. We have done this so as to correct the innumerable abuses which flowed from such, and to relive the poverty of many. Nevertheless, because there are certain festivals devoted, since ancient times, to the celebration of the mysteries of concerning our redemption, we use Christian liberty, and submit all to to edification, according to the different circumstances of places, times and persons.</p></blockquote>

<blockquote><p>In regard to the false worship of the Jews (Jer. xix. 5), God says, “which I commanded not nor spake it, neither came it into my mind.” We have many other passages in Scripture to sanction and enforce the great principle, not only that we must not violate the direct commands of God in our service, but must not presume to offer Him unauthorised worship, and which He “hath not required at our hand.”

The reasons are clear. He is too exalted and majestic for sinful mortals to take such matters into their own hand, and to serve Him with their own inventions. If He has revealed Himself at all to ignorant and guilty men, surely it is reasonable to think He would reveal how He should be approached and served. If He has done so, and provided all the means, it is the height of presumption in human beings either to add to or take from what He has appointed.

“What things soever I command you, observe to do it: thou shalt not add thereto nor diminish therefrom” (Deut. xii. 32). Our Lord Himself hands down this great principle and command in His commission to His apostles, and through them to the church to the end of the world. Matt, xxviii. 18, 20, “And Jesus came and taught them, saying. All power is given unto me in heaven and in earth. Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost; teaching them to observe all things whatsoever I HAVE COMMANDED YOU: and, lo, I am with you alway, even unto the end of the world. Amen.” His voice as the great Lawgiver and Head of His church, from the beginning to the end, is one and the same. He does not say, You are not to teach what I have forbidden, but you are to teach to observe and do what I have commanded, and neither “add thereto, nor diminish therefrom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-gibson.html">James Gibson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books</cite>, (London: James Nisbet and Son, 1869), pp 15-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“In regard to the false worship of the Jews (Jer. xix. 5), God says, “which I commanded not nor spake it, neither came it into my mind.” We have many other passages in Scripture to sanction and enforce the great principle, not only that we must not violate the direct commands of God in our service, but must not presume to offer Him unauthorised worship, and which He “hath not required at our hand.”

The reasons are clear. He is too exalted and majestic for sinful mortals to take such matters into their own hand, and to serve Him with their own inventions. If He has revealed Himself at all to ignorant and guilty men, surely it is reasonable to think He would reveal how He should be approached and served. If He has done so, and provided all the means, it is the height of presumption in human beings either to add to or take from what He has appointed.

“What things soever I command you, observe to do it: thou shalt not add thereto nor diminish therefrom” (Deut. xii. 32). Our Lord Himself hands down this great principle and command in His commission to His apostles, and through them to the church to the end of the world. Matt, xxviii. 18, 20, “And Jesus came and taught them, saying. All power is given unto me in heaven and in earth. Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost; teaching them to observe all things whatsoever I HAVE COMMANDED YOU: and, lo, I am with you alway, even unto the end of the world. Amen.” His voice as the great Lawgiver and Head of His church, from the beginning to the end, is one and the same. He does not say, You are not to teach what I have forbidden, but you are to teach to observe and do what I have commanded, and neither “add thereto, nor diminish therefrom.”

— James Gibson, The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books, (London: James Nisbet and Son, 1869), pp 15-16.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+regard+to+the+false+worship+of+the+Jews+%28Jer.+xix.+5%29%2C+God+says%2C+%E2%80%9Cwhich+I+commanded+not+nor+spake+it%2C+neither+came+it+into+my+mind.%E2%80%9D+We+have+many+other+passages+in+Scripture+to+sanction+and+enforce+the+great+principle%2C+not+only+that+we+must+not+violate+the+direct+commands+of+God+in+our+service%2C+but+must+not+presume+to+offer+Him+unauthorised+worship%2C+and+which+He+%E2%80%9Chath+not+required+at+our+hand.%E2%80%9D%0A%0AThe+reasons+are+clear.+He+is+too+exalted+and+majestic+for+sinful+mortals+to+take+such+matters+into+their+own+hand%2C+and+to+serve+Him+with+their+own+inventions.+If+He+has+revealed+Himself+at+all+to+ignorant+and+guilty+men%2C+surely+it+is+reasonable+to+think+He+would+reveal+how+He+should+be+approached+and+served.+If+He+has+done+so%2C+and+provided+all+the+means%2C+it+is+the+height+of+presumption+in+human+beings+either+to+add+to+or+take+from+what+He+has+appointed.%0A%0A%E2%80%9CWhat+things+soever+I+command+you%2C+observe+to+do+it%3A+thou+shalt+not+add+thereto+nor+diminish+therefrom%E2%80%9D+%28Deut.+xii.+32%29.+Our+Lord+Himself+hands+down+this+great+principle+and+command+in+His+commission+to+His+apostles%2C+and+through+them+to+the+church+to+the+end+of+the+world.+Matt%2C+xxviii.+18%2C+20%2C+%E2%80%9CAnd+Jesus+came+and+taught+them%2C+saying.+All+power+is+given+unto+me+in+heaven+and+in+earth.+Go+ye+therefore%2C+and+teach+all+nations%2C+baptizing+them+in+the+name+of+the+Father%2C+and+of+the+Son%2C+and+of+the+Holy+Ghost%3B+teaching+them+to+observe+all+things+whatsoever+I+HAVE+COMMANDED+YOU%3A+and%2C+lo%2C+I+am+with+you+alway%2C+even+unto+the+end+of+the+world.+Amen.%E2%80%9D+His+voice+as+the+great+Lawgiver+and+Head+of+His+church%2C+from+the+beginning+to+the+end%2C+is+one+and+the+same.+He+does+not+say%2C+You+are+not+to+

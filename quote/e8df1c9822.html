</figure><figure class="quote" id="q-8cb7567c9a" data-kw="">
<blockquote><p>Thus their divisions increased, and the necessary work which might and should have been gone into, was by their debates first delayed and then entirely marred. And enemies had it to observe and remark that ministers preached and prayed against one another. And Mr. Cargil, they say, publicly protested that they behoved to part one from another because a good many of them would not go into a day of humiliation. When this project failed, I am told, Mr. Hamilton [a lay-leader in the covenanting army] took upon him to send orders to Mr. Welsh, Mr. Hume, Mr. Rae, and others of the more moderate party, to preach against the indulgence, otherwise he and a good many of the officers would not hear them. It is said, Mr. Rae sent a very home and close answer to him, and desired the messenger to tell Mr. Hamilton and the rest, that he had been wrestling against Erastianism in the magistrate for many years; and he would never truckle to the worst kind of Erastianism in the common people [led by Hamilton, with such orders]; that he would receive no instructions from him nor any of them as to the subject and matter of his sermons; and wished he might mind what belonged to him, and not go beyond his sphere and station.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, pp. 90-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

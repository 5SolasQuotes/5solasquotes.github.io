<main class="wrap"><figure class="quote" id="q-2306260cc1" data-kw="">
<blockquote><p>What effects God designs to produce in the world by the instrumentality of the Gospel. … The first and most obvious effect is to cleanse the sanctuary. The sanctuary of God has been polluted, by rites and ceremonies, the invention of ignorant and designing men. The tendency of these rites has been to make men superstitious, formal, and addicted to will-worship—to furnish a resting place of lies for the consciences of men, and keep them from Christ.

This vast fabric of folly shall be demolished to the ground by the weapons of the gospel, and the judgments of God. There has been introduced into the church, not only human rites and ceremonies, but alse the doctrines and commandments of men; many of which are dangerous to immortal souls, and which have rent and divided the body of Christ. These doctrines and commandments of men will give place to the pure law and gospel of the God of the universe. In a word, all rites and ceremonies, doctrines and commandments of men, with all errors of discipline and practice, will be purged away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-l-anderson.html">Isaac L. Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Millennium. A sermon, delivered at the organization of the Blount County Bible Society, November 21, 1827 in The Calvinistic Magazine</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5256c81934" data-kw="">
<blockquote><p>Hooper declined a nomination to this bishopric [the See of Gloucester, which was against civil law without a significant and just reason], specifying as a reason his inability to wear the vestments required by the existing Ordinal [a book of church order]. The Privy Council were at first prepared to waive his scruples, but the bishops (notable [Thomas] Cranmer and Nicholas Ridley). conscious that a question of principle and policy was involved in Hooper’s nonconformity, declined to proceed with his consecration. In the deadlock which ensued Hooper wrote a defence of his position, which is printed here from an incomplete manuscript (the only copy known to have survived) to which Ridley replied in a letter to the Privy Council (cf. Writings of [John] Bradford, Letters, Treatises, Parker Society pp. 373-395). … Hooper’s resistance to the official policy on this matter resulted in the extraordinary situation of his being committed to the Fleet prison, from which he was only released when he wrote a letter of submission to Cranmer on February 15, 1551. the letter (printed in G.C. Gorham’s Reformation Gleanings [pp. 233-5], 1857) shows that Hooper did not recant his principles… but that the strength of the opposition from other Protestants led him to doubt the wisdom of continuing his particular stand against vestments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hooper.html">John Hooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Regulative Principle &amp; Things Indifferent’</cite>, (1550) in ed. Iain Murray, The Reformation of the Church: a Collection of Reformed &amp; Puritan Documents on Church Issues</span></figcaption>

c81934.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5256c81934.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-black-genevan-gowns/#:~:text=Hooper%20declined%20a%20nomination%20to%20this,continuing%20his%20particular%20stand%20against%20vestments&amp;text=Hooper%20declined%20a%20nomination%20to%20this%20bishopric%20%5Bthe&amp;text=wisdom%20of%20continuing%20his%20particular%20stand%20against%20vestments" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-12d3158c04" data-kw="">
<blockquote><p>Gilbert McMaster was an American Covenanter who originally hailed from Saintfield, County Down in what is now Northern Ireland. In 1818 he wrote a number of letters in defence of psalmody. In one of these letters, he pointed out that the excitements of so-called revivals were no excuse for the use of uninspired hymns:

It is most notorious, that those excitements called revivals of religion, which make the greatest noise, are effected where the most pernicious errors are habitually taught. That these, and modern hymns, have a great share in the production of those noisy but short-lived agitations, need not be doubted. Israel’s worship of the golden calf was marked by a greater excitement than the usual and approved worship of Jehovah.

A visit to those favoured districts of revival, a few months after a magazine description, or ecclesiastical report has been given of the multitudes converted, would cast a shade of doubt, generally, on those fine narratives. And the man who considers that the embracing of truth, turning to God through a crucified and exalted Saviour, and living a life of practical godliness, are the best proofs of real conversion, wishes, sincerely, that the things were published as they really are, and that our country furnished one journal, which would venture to tell all the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-mcmaster.html">Gilbert McMaster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Book of Psalms, in Five Letters; Addressed to the Friends of Union in the C</cite>, hurch of God (1818; 4th edn, Philadelphia: Daniels &amp; Smith, 1852), p. 190.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

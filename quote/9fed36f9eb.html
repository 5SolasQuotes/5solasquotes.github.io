<main class="wrap"><figure class="quote" id="q-9fed36f9eb" data-kw="">
<blockquote><p>St. Paul never called Philosophical truths vain, for so he should condemn divinity, to which Philosophy is subservient: besides, truth cannot be repugnant to truth; and Philosophy is one of God’s special gifts, by which even the Gentiles were brought to the knowledge of God, and made inexcusable; there are vain opinions among some professors of Philosophy, as there are among some Divines: must therefore Philosophy or Divinity be condemned as vain: he that speaks against Philosophy doeth both bewray his ignorance and malice; in disparaging men for making use of those arms which God hath given us to fight withal against the enemies of truth; and to destroy the field of good corn, because the envious man hath sown some tears among them. To speak against Philosophy, is to speak against the light of reason, which God hath kindled in our minds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-ross.html">Alexander Ross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Leviathan drawn out with a hook, or, Animadversions upon Mr. Hobbs his Leviathan. Together with some observations upon Sir Walter Raleigh’s History of the World</cite>, (London: Richard Royston, 1653), p. 85.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a5a5dc267" data-kw="">
<blockquote><p>The supporters of this Seminary are thorough and sound Presbyterians. No uncertain note is given from the pulpits of the alumni of this institution. The directors believe that the students graduated from this Seminary will be, theologically, largely what you make them. Therefore, we believe your teaching must be dogmatic. Your philosophy and your metaphysics will be great contributions to the power of your teaching. But, after all, our theology is not based on secular philosophy or modern psychology but on the Word of God, as contained in the Holy Scriptures, — described in our Confession as the only infallible rule of faith and practice.

Therefore, we expect the students to be taught with a fire of conviction, which cannot help leaving its impression upon them, so that your teaching will not seem to be the abstract discussion of a man who has only half thought his subject through: “Ever learning, but never coming to a knowledge of the truth”. But rather that kind of teaching which presents the result of the teacher’s own labours as he builds his system of theology on the eternal truth of God, revealed by him in our infallible Scriptures.

Such a teacher translates his theological science for his students — not alone correlating great theological principles or distinguishing the Biblical and professional teaching from erroneous views; but while it will be teaching of the highest scholarship, it will gain power — constructive power — by reason of the teacher’s own experience in the application of these great truths to his own soul. This, I believe, is what makes great theological teachers. It was this that made more than one of your distinguished predecessors what they were, and it is this that produces in our ministry men who are not dabblers in theology, but constructive defenders of our Presbyterian doctrinal heritage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maitland-alexander.html">Maitland Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charge to Dr. Snowden in Bulletin of the Western Theological Seminary</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-32e424346d" data-kw="">
<blockquote><p>7. …Indeed the soul (as is aforesaid) is wholly hypostasis to the head, giving life to it and sustaining it: but where? not in every part of the body, but only in that where the head itself is: and out of the head [the soul] is also wholly hypostasis to the feet, sustaining them too: not where the head is, but where the feet themselves are. Is then the union which the soul has with the head dissolved because out of the head it is wholly also in the feet? 8. Finally, that all things which have been spoken of this personal union [of Christ in two natures], may more plainly be declared, I add these also: The soul is hypostasis to the eyes: to what eyes? such as they are: namely instruments used for sight, not for hearing: on the other side, to the ears, for hearing, not for seeing. So the Word was hypostasis to the human nature, not to destroy death, which was a property of the Word: but to suffer death, which was a property of the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>H. Zanchius his Confession of Christian Religion</cite>, … (d. 1590; Cambridge, 1599), ‘Observations of the same Zanchius upon his Own Confession’, pp. 289-90 The context in point 7 is Zanchi arguing the validity of the extra Calvinisticum, that they person, or hypostasis of the Son exists outside of the human flesh according to his divinity. In point 8 it is the denial of the real communication of properties, via the Person, of the natures (contra the Lutherans).</span></figcaption>

<blockquote><p>§1. We have laid out the concept of the natural knowledge of God based on the mainstream orthodox view. What is left is to demonstrate the wider agreement on this by quoting different authors… These authors do not just generally affirm this natural knowledge of God, but also distinctly break it down into parts or species which they explain: the innate or implanted or subjective type; and the acquired or added or objective or discursive or demonstrative type, derived a posteriori from observing effects.</p></blockquote>

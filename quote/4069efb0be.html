<main class="wrap"><figure class="quote" id="q-4069efb0be" data-kw="">
<blockquote><p>I might trace a little the time of faith’s first infusion and first operation in the heart, which is undoubtedly at the new birth, when ever it is. But how to prescribe, and when precisely to determine that, in the soul of a believer is more difficult than to state the quickening or animation of an embryo in the womb of her that is with child, or for any naturallist so set the moment of the first separation of night from day at the initiating crepusculum or ascent of the first atom of the morning rays of the sun’s body, or the primogenial fermentation of the vegetative soul in the seed-corn in the earth… It’s much more difficult to set down the first punctual workings of the Spirit in our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-lee.html">Samuel Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Joy of Faith, or, a Treatise Opening the True Nature of Faith</cite>, … (Boston, 1687), pt. 2, ch. 1, section 6, p. 93 Lee, M. A. (d. 1691) was “sometime Fellow of Wadham, Colledge, Oxford”.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b1f5f5dfda" data-kw="">
<blockquote><p>Indeed, there are almost as many Scriptures that speak of the curse of many children (Gen. 3:16; Eccl. 6:3; Is. 49:19-21; Deut. 28:18-19; Ezek. 5:7-8 [KJV]; Jer. 15:9; Job 27:13-15; Luke 23:29) as there are that speak of the blessings of having many children (Gen. 17:2,20; 22:17; 26:24; 28:3; 35:11; 48:4; Ex. 32:13; Deut. 7:14; Ps. 17:14; 113:9; 127:1-5; 128:1-6; Prov. 17:6; 1 Tim. 5:14). The fall has brought about circumstances that certainly lead to great difficulties – so great that the Scripture no longer speaks of those many children as always being a blessing.</p></blockquote>

</figure><figure class="quote" id="q-dbf669f70d" data-kw="">
<blockquote><p>In Voetius’s view it is valid to say that some unborn foetuses have ‘a human life’ and others have not. He refers to Exodus 21:22-23 as a passage suggesting that not all abortions of foetuses are the same. He shows a certain flexibility as to the estimated time when a foetus is animated [ensouled], but maintains that the soul can only ‘be brought into an organized body’… Zechariah 12:1, a text that speaks of ‘…the Lord, which… formeth the spirit of man within him’ (AV)… Voetius obviously thought that initially there is no soul for an embryo that has yet to be formed. He cites various opinions on the time when an embryo is animated… Voet thinks it is prudent not to move beyond the latter estimate [of the 30th to 40th day], and leaves further debate to physicians. The former estimate seems to have been motivated by references to both Aristotle and the Bible (Lev. 12[:2-6]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Orthodoxy &amp; Philosophy</cite>, pp. 239-42, 247-48 &amp; 257 of ch. 4, ‘The Human Being: His Soul &amp; Body…’ in Reformed Orthodoxy &amp; Philosophy, 1625-1750: Gisbertus Voetius, Petrus van Mastricht, &amp; Anthonius Driessen (Brill, 2006), pp. 239-41</span></figcaption>

<blockquote><p>…we cannot give an account of the whole process of generation, which consists of conception, formation or the delineation of the several parts, and animation by infusing the soul; but this we know, that it far surpasses all finite power. And without doubt Monsieur Descartes, who was so thinking a philosopher, would never have ascribed this great work to mere mechanism, but that he was unawares betrayed into it by his solving of other things by mechanic principles: So that it would be expected that he should make an uniform piece of philosophy. And thence he was, as it were, forced to go through with his work that he had begun, and to maintain that all is done mechanically, even in the production of man.</p></blockquote>

<blockquote><p>5. It is now supposed, and shall (if it please God) hereafter be demonstrated, that human souls are not traducted, nor causally brought out of the flesh: yet are they occasionally (that I may touch at the manner), God having resolved and decreed, after generation and fit organization of the embryo, to create and infuse a reasonable soul: which soul, because it is united to a mass corrupted, in such a manner as a spiritless mass may be corrupted, or rather to a mass inclining or inducing to corruption, in the very unition it contracts original sin. Hugo Eterianus [d. 1182] thus descants on this point: ‘When the soul languishes, it is neither cast down by the will, nor by necessity, but only by fellowship, if the soul were corrupted by the will, it should not be counted original sin, but actual: if it should fall by necessity, that vice were no further to be imputed.’ Concerning the latter part, I answer, if in his necessity he imply coaction, he says true: otherwise, by this concurrence of our condescending will in Adam, or by our own implicit will, we may draw on us a necessity of after-sinning, which most justly may be imputed to us, and we may tie ourselves with our own bonds. To the former part this may give satisfaction, that against the will of the soul, the soul itself cannot be corrupted: for then the will should be forced, and so [be] no will at all, but [a] noluntas, and not voluntas. ‘It is not necessary,’ says Bellarmine, ‘that our soul must needs come from Adam, because we draw sin from him: if but one part come from him it is enough.’ For a father does not per se produce original sin in the child, but per accidens; namely, as by the act of generation it comes to pass, that his son is a member of mankind, which was overtaken in Adam’s corruption, and that the propension unto evil of the earthly part traducted, meeting with a soul not much resisting, causes this original sin to result thencefrom, and death by this original sin. So that no sooner is the soul united to its body, and the matter glued to the form, but the infant deserves to be, and is the child of death, by reason of the primigeneal corruption. If you inquire after what manner the body works the soul unto this evil, we may truly say, ‘The body works not upon the soul by a natural and immediate action.’ You heard what Hugo Eterianus said, ‘It is stricken or cast down only by fellowship.’ He enlarges himself in the same chapter, thus: ‘Imperfection, languishing, and corruption abide in the flesh before the soul’s conjunction; from which disease the soul is infected: as if a vessel be tainted with an ill odour, it infects therewith whatsoever liquor it receives.’ Gerson thus, ‘The soul by the conjunction with the body contracts that infection; as when one falls into the mire, he is besmeared and stained.’ Felisius thus: ‘A clean apple put in an unclean hand is soiled. Good wine poured into a fustie vessel contracts a strange taste, and loses its own natural: so the soul loses its naturall vigor, when it is united in the flesh.’ Another thus, ‘Anima cum labente simul labitur, et frustra nititur dum innititur.’ To the same effect another says thus: ‘As the purest rain-water falling on dust, is turned with the dust into a lump of mire: so at the coadunation of the soul unto the earthly part, both spirit and flesh are plunged in the durt of corruption.’ Augustine, against Julian the Pelagian, prefers the very heathen before Julian; for he held that ‘nothing was conveyed unto us from Adam;’ and they held, ‘That we were born to be punished for old crimes committed in a former life.’ ‘And,’ says Augustine, ‘it is true which Aristotle relates, that we are punished like to those who fell among the Hetrurian robbers, whose living bodies being coupled face to face with dead men’s carcasses, were so killed.’ Of the Hetrurian tyrant Mezentius, Virgil, Aeneid, 8, records the like: Mortua corporibus jungebat corpora vivis, Componens manibúsque manus at que oribus ora, (Tormenti genus) et sanie tabóque fluentes, Complexu in misero, longâ sic morte necabat. But I return from this digression. The heathen say (as St. Augustine relates) that ‘our souls united to our bodies are like the living coupled with the dead.’ ‘They saw somewhat,’ says he, and commends their wisdom in discerning the miseries of mankind to be for somewhat before committed, and in acknowledging the power and justice of God; though without divine revelation they could not know that it was Adam’s offence which brought such a wrack both on our souls and on our bodies. What has been hitherto related seems too much to incline to the natural, physical, immediate working of the soul upon the body. Others are as faulty, who say, ‘The soul receives no annoyance from the body, but by way of impedition [being impeded] only, where the spiritual faculties are hindered and the music spilt, by reason of the untuneableness of the organs. But they will not seem to hear that ‘a spiritual substance can receive infection from a nature corporeal.’ Both opinions may rest contented in the middesse or mean, that as the body cannot go beyond the sphere of its activity, and work properly and physically upon the soul: so by the interposition, as it were, of a middle nature, the body not only hinders the faculties of the soul from working, but sometimes works upon the soul. Thus the natural, vital and animal spirits do bind and unite the soul to the body, that neither part can part from other, though it would. Thus bodily objects work on the mind, but it is by the mediation of the outward and inward senses. Shall corporeal, outward, and remote objects, by degrees, draw the soul into sin, even in our perfect age, when our natural reason is most vigorous; and may not the corrupted seed, having as great a propension to evil as Naphtha to take fire, at the conjunction, infect the soul with a participation of uncleanness, though the operation be not physical, or immediate? By Adam’s soul sinning was Adam’s flesh infected; may not our soul be infected as well by our flesh? A spiritual substance can produce a bodily effect. Boëtius says excellently: ‘Forms material came from forms immaterial: Our will was moved by our intellect, our appetite by our will, and a bodily change conformable to our appetite.’ And may not a bodily species work by the same degrees, backward, on the soul itself? The reason is alike in the contrariety. Does the corporeal fire of Hell torment and affect the incorporeal spirits of evil angels, and shall it of wicked men (as most certainly it does and must; which shall be proved, God willing, otherwhere) and may not the matter make some impression on the form, the body upon the soul, when there is such a sympathy in nature betwixt them? If the soul do no way suffer from the body, how does it follow the temperature of the body? How does madness, foolishness, anger and love, with other affections, work upon the mind? Yea, how comes it to pass that not only strength and nimbleness of body, but even goodness of wit is propagated (if nature be strong) and children resemble their fathers both in manners and understanding? The flesh itself without the soul, if it be beaten, hurt, or cut, is no way sensible. Reunite the separated soul to the wronged body, the soul feeleth, and is much affected: nor is the grief in the incision only, but in the soul. Yea, in apoplexies and deep sleeps, cast upon men by stupefactive ingredients and compounded by art, while the soul is in the body, wounds have been given unto the earthy part, and it never felt them: when those fits are vanished, the soul feels the pain of the discontinuity and division of the flesh as well as the body. Doctor [John] Rainolds thus, ‘God by nature has ordered that the soul naturally united to the body should suffer with the body and be grieved, the body being afflicted, and rejoice, it being refreshed, and be sorrowfull, the body being killed; so that some way it suffers by reason of the body.’ Permit me but the use of his modification some way and I dare say the body draws the soul its way, some way to sin. Aquinas on Rom. 5, lect. 3: ‘It should not seem that sin, which is an accident of the soul, can be produced by the original of the flesh: It is answered (says he) with reason. Though the soul be not in the seed, yet there is in the seed a virtue disposing the body to receive the soul, which soul being poured or infused into the body, is after a sort conformable to the body, because every thing received is in the receiver according to the capacity of the receiver.’ To him let me add: if a new created soul should be put into a body not descending from Adam, it should not have original sin; but meeting with a body disposed to corruption, after its kind it yields and contracts original sin. 6. Yea, but the act of Adam’s sin passed quickly away, and the guiltines was forgiven [for him]; how could it infect us? I answer, ‘The person did first infect the nature, afterwards the nature did infect the person.’… And the manner how the soul is made sinful is described at large before, to wit, that by the union it is infected, and so soon as it is infused, it tastes of corruption… so does a just man beget an unjust, Christianus non Christianum, ‘A Christian an unchristian’; the circumcised Hebrews beget children uncircumcised: for the generation is natural and not spiritual… just Lot who begat wicked daughters, or David who had Absalom, or Abraham, who had Ismael, or Isaac who had Esau; or Noah, who had Ham… For man begets man like to himself, as he is species hominis [the species of a man], not as he is individuum [an individual]: and accidents belonging to the individual person of the Father pass not over to the child, but those things that pertain to the specifical nature. Therefore what belongs to man, as he is individuum, he does not propagate.</p></blockquote>

ine%2C+%E2%80%98that+our+soul+must+needs+come+from+Adam%2C+because+we+draw+sin+from+him%3A+if+but+one+part+come+from+him+it+is+enough.%E2%80%99+For+a+father+does+not+per+se+produce+original+sin+in+the+child%2C+but+per+accidens%3B+namely%2C+as+by+the+act+of+generation+it+comes+to+pass%2C+that+his+son+is+a+member+of+mankind%2C+which+was+overtaken+in+Adam%E2%80%99s+corruption%2C+and+that+the+propension+unto+evil+of+the+earthly+part+traducted%2C+meeting+with+a+soul+not+much+resisting%2C+causes+this+original+sin+to+result+thencefrom%2C+and+death+by+this+original+sin.+So+that+no+sooner+is+the+soul+united+to+its+body%2C+and+the+matter+glued+to+the+form%2C+but+the+infant+deserves+to+be%2C+and+is+the+child+of+death%2C+by+reason+of+the+primigeneal+corruption.+If+you+inquire+after+what+manner+the+body+works+the+soul+unto+this+evil%2C+we+may+truly+say%2C+%E2%80%98The+body+works+not+upon+the+soul+by+a+natural+and+immediate+action.%E2%80%99+You+heard+what+Hugo+Eterianus+said%2C+%E2%80%98It+is+stricken+or+cast+down+only+by+fellowship.%E2%80%99+He+enlarges+himself+in+the+same+chapter%2C+thus%3A+%E2%80%98Imperfection%2C+languishing%2C+and+corruption+abide+in+the+flesh+before+the+soul%E2%80%99s+conjunction%3B+from+which+disease+the+soul+is+infected%3A+as+if+a+vessel+be+tainted+with+an+ill+odour%2C+it+infects+therewith+whatsoever+liquor+it+receives.%E2%80%99+Gerson+thus%2C+%E2%80%98The+soul+by+the+conjunction+with+the+body+contracts+that+infection%3B+as+when+one+falls+into+the+mire%2C+he+is+besmeared+and+stained.%E2%80%99+Felisius+thus%3A+%E2%80%98A+clean+apple+put+in+an+unclean+hand+is+soiled.+Good+wine+poured+into+a+fustie+vessel+contracts+a+strange+taste%2C+and+loses+its+own+natural%3A+so+the+soul+loses+its+naturall+vigor%2C+when+it+is+united+in+the+flesh.%E2%80%99+Another+thus%2C+%E2%80%98Anima+cum+labente+simul+labitur%2C+et+frustra+nititur+dum+innititur.%E2%80%99+To+the+same+effect+another+says+thus%3A+%E2%80%98As+the+purest+rain-water+falling+on+dust%2C+is+turned+with+the+dust+ n+from+a+nature+corporeal.%E2%80%99+Both+opinions+may+rest+contented+in+the+middesse+or+mean%2C+that+as+the+body+cannot+go+beyond+the+sphere+of+its+activity%2C+and+work+properly+and+physically+upon+the+soul%3A+so+by+the+interposition%2C+as+it+were%2C+of+a+middle+nature%2C+the+body+not+only+hinders+the+faculties+of+the+soul+from+working%2C+but+sometimes+works+upon+the+soul.+Thus+the+natural%2C+vital+and+animal+spirits+do+bind+and+unite+the+soul+to+the+body%2C+that+neither+part+can+part+from+other%2C+though+it+would.+Thus+bodily+objects+work+on+the+mind%2C+but+it+is+by+the+mediation+of+the+outward+and+inward+senses.+Shall+corporeal%2C+outward%2C+and+remote+objects%2C+by+degrees%2C+draw+the+soul+into+sin%2C+even+in+our+perfect+age%2C+when+our+natural+reason+is+most+vigorous%3B+and+may+not+the+corrupted+seed%2C+having+as+great+a+propension+to+evil+as+Naphtha+to+take+fire%2C+at+the+conjunction%2C+infect+the+soul+with+a+participation+of+uncleanness%2C+though+the+operation+be+not+physical%2C+or+immediate%3F+By+Adam%E2%80%99s+soul+sinning+was+Adam%E2%80%99s+flesh+infected%3B+may+not+our+soul+be+infected+as+well+by+our+flesh%3F+A+spiritual+substance+can+produce+a+bodily+effect.+Bo%C3%ABtius+says+excellently%3A+%E2%80%98Forms+material+came+from+forms+immaterial%3A+Our+will+was+moved+by+our+intellect%2C+our+appetite+by+our+will%2C+and+a+bodily+change+conformable+to+our+appetite.%E2%80%99+And+may+not+a+bodily+species+work+by+the+same+degrees%2C+backward%2C+on+the+soul+itself%3F+The+reason+is+alike+in+the+contrariety.+Does+the+corporeal+fire+of+Hell+torment+and+affect+the+incorporeal+spirits+of+evil+angels%2C+and+shall+it+of+wicked+men+%28as+most+certainly+it+does+and+must%3B+which+shall+be+proved%2C+God+willing%2C+otherwhere%29+and+may+not+the+matter+make+some+impression+on+the+form%2C+the+body+upon+the+soul%2C+when+there+is+such+a+sympathy+in+nature+betwixt+them%3F+If+the+soul+do+no+way+suffer+from+the+body%2C+how+does+it+follow+the+temperature+of+the+body%3F+How+does+madness%2C+foolishness%2C+anger+and+love%2C+with+other+affections%2C+work+upon+the+mind%3F+Yea%2C+how+comes+it+to+pass+that+not+only+strength+and+nimbleness+of+body%2C+but+even+goodness+of+wit+is+propagated+%28if+nature+be+strong%29+and+children+resemble+their+fathers+both+in+manners+and+understanding%3F+The+flesh+itself+without+the+soul%2C+if+it+be+beaten%2C+hurt%2C+or+cut%2C+is+no+way+sensible.+Reunite+the+separated+soul+to+the+wronged+body%2C+the+soul+feeleth%2C+and+is+much+affected%3A+nor+is+the+grief+in+the+incision+only%2C+but+in+the+soul.+Yea%2C+in+apoplexies+and+deep+sleeps%2C+cast+upon+men+by+stupefactive+ingredients+and+compounded+by+art%2C+while+the+soul+is+in+the+body%2C+wounds+have+been+given+unto+the+earthy+part%2C+and+it+never+felt+them%3A+when+those+fits+are+vanished%2C+the+soul+feels+the+pain+of+the+discontinuity+and+division+of+the+flesh+as+well+as+the+body.+Doctor+%5BJohn%5D+Rainolds+thus%2C+%E2%80%98God+by+nature+has+ordered+that+the+soul+naturally+united+to+the+body+should+suffer+with+the+body+and+be+grieved%2C+the+body+being+afflicted%2C+and+rejoice%2C+it+being+refreshed%2C+and+be+sorrowfull%2C+the+body+being+killed%3B+so+that+some+way+it+suffers+by+reason+of+the+body.%E2%80%99+Permit+me+but+the+use+of+his+modification+some+way+and+I+dare+say+the+body+draws+the+soul+its+way%2C+some+way+to+sin.+Aquinas+on+Rom.+5%2C+lect.+3%3A+%E2%80%98It+should+not+seem+that+sin%2C+which+is+an+accident+of+the+soul%2C+can+be+produced+by+the+original+of+the+flesh%3A+It+is+answered+%28says+he%29+with+reason.+Though+the+soul+be+not+in+the+seed%2C+yet+there+is+in+the+seed+a+virtue+disposing+the+body+to+receive+the+soul%2C+which+soul+being+poured+or+infused+into+the+body%2C+is+after+a+sort+conformable+to+the+body%2C+because+every+thing+received+is+in+the+receiver+according+to+the+capacity+of+the+receiver.%E2%80%99+To+him+let+me+add%3A+if+a+new+created+soul+should+be+put+into+a+body+not+descending+from+Adam%2C+it+should+not+have+original+sin%3B+but+meeting+with+a+body+disposed+to+corruption%2C+after+its+kind+it+yields+and+contracts+original+sin.+6.+Yea%2C+but+the+act+of+Adam%E2%80%99s+sin+passed+quickly+away%2C+and+the+guiltines+was+forgiven+%5Bfor+him%5D%3B+how+could+it+infect+us%3F+I+answer%2C+%E2%80%98The+person+did+first+infect+the+nature%2C+afterwards+the+nature+did+infect+the+person.%E2%80%99%E2%80%A6+And+the+manner+how+the+soul+is+made+sinful+is+described+at+large+before%2C+to+wit%2C+that+by+the+union+it+is+infected%2C+and+so+soon+as+it+is+infused%2C+it+tastes+of+corruption%E2%80%A6+so+does+a+just+man+beget+an+unjust%2C+Christianus+non+Christianum%2C+%E2%80%98A+Christian+an+unchristian%E2%80%99%3B+the+circumcised+Hebrews+beget+children+uncircumcised%3A+for+the+generation+is+natural+and+not+spiritual%E2%80%A6+just+Lot+who+begat+wicked+daughters%2C+or+David+who+had+Absalom%2C+or+Abraham%2C+who+had+Ismael%2C+or+Isaac+who+had+Esau%3B+or+Noah%2C+who+had+Ham%E2%80%A6+For+man+begets+man+like+to+himself%2C+as+he+is+species+hominis+%5Bthe+species+of+a+man%5D%2C+not+as+he+is+individuum+%5Ban+individual%5D%3A+and+accidents+belonging+to+the+individual+person+of+the+Father+pass+not+over+to+the+child%2C+but+those+things+that+pertain+to+the+specifical+nature.+Therefore+what+belongs+to+man%2C+as+he+is+individuum%2C+he+does+not+propagate.%E2%80%9D%0A%0A%E2%80%94+Edward+Kellet%2C+Miscellanies+of+Divinity%2C+divided+into+Three+Books%2C+wherein+is+Explained+at+Large+the+Estate+of+the+Soul+in+her+Origination%2C+Separation%2C+Particular+Judgement%E2%80%A6+%28Cambridge%2C+1635%29%2C+bk.+1%2C+ch.+6+Kellet+%281583-1641%29+was+a+doctor+of+divinity+and+a+calvinistic%2C+Anglican%2C+canon+in+the+cathedral+church+at+Exeter.+%7C+section+5%2C+pp.+103-6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F76363c3521.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/76363c3521.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=5.%20It%

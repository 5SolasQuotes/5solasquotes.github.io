<main class="wrap"><figure class="quote" id="q-3addea374e" data-kw="">
<blockquote><p>…and consider the reason of such rules and commandments, which carries in it the light and the life of the commandments. For where that reason holds not, there are we free from the commandment; but where the reason is in force, there are we no less bound to the substance and effect of such particular commandment than they were. So if there could be like reason as caused that commandment to the disciples, we were in such case to keep it, and where the same offence is justly to be feared in eating of meats forbidden, as was then and may be in many like cases now and to the end, there that order of the apostles binds. As for the last place out of the 1 Cor. 11, if he look better upon it, he shall find that the apostle grounds that order there prescribed upon so general and necessary reasons of the ordinance of God, the glory of our Savior Christ, the regard of angels, and the voice of nature, and the custom of all the Churches, as he has taken his level far amiss to leave it at liberty, whether a man keep it or no: provided that he understand the apostle’s meaning aright: which is that men and women, especially being present in the public assemblies of the church, should carry the mark of their creation, agreeable to the sex whereof they were: the woman wearing upon her head a vail or kerchief, or such other attire (according to the lawful custom of their country and place of abode) as declares her sex and subjection to man by such coverture of her head. And the man, by not wearing any such attire upon his head as is proper to womankind, but by want of any such upon his head, show the glory of Christ, and the honor that in the order of creation is bestowed upon men. Therefore notwithstanding his caution or anything here alleged to the contrary, it remains firm and stable that the constant and perpetual examples of the Churches, the orders, rules, and commandments of our Savior Christ and of his apostles, both for the points of doctrine to be believed, and also for such as are to be obeyed and practiced in the public government of the Church, and in the private life of everyone, do bind the conscience of all the people of God to keep and to obey them: yea the most particular rules, the like case and reason being in us that was in them to whom they were given.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-travers.html">Walter Travers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Defence of the Ecclesiastical Discipline ordained of God to be used</cite>, … (1588), pp. 123-4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67d3f536c8" data-kw="">
<blockquote><p>Some of the interpreters refer these words [1 Cor. 11:16] to the question in hand, and think that the apostle is here opposing the custom of the Churches to these that contended for men covering their heads in public meetings: but the better sort take this to be spoken against the study of contention, and think the apostle his meaning here is only to show that it is not his fashion, nor the fashion of the Churches of God, to be contentious for matters of such indifferency as those were of.</p></blockquote>

</figure><figure class="quote" id="q-f6ee7b820c" data-kw="">
<blockquote><p>Am I suggesting that women return to wearing coverings or veils? No. We must distinguish between the fundamental principle that underlies a text and the application of that principle in a specific culture… Now, in the first century, failure to wear a covering sent a signal to the congregation that a woman was rejecting the authority of male leadership. Paul was concerned about head coverings only because of the message they sent to people in that culture… Lack of head coverings sends no message at all in our culture. Nevertheless, that does not mean that this text does not apply to our culture. The principle still stands that women should pray and prophesies will be one indication of whether she is humble and submissive. The principle enunciated here should be applied in a variety of ways given the diversity of the human situation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-r-schreiner.html">Thomas R. Schreiner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Head Coverings, Prophecies &amp; the Trinity</cite>, 1 Corinthians 11:2-16’ in eds. Piper &amp; Grudem, Recovering Biblical Manhood &amp; Womanhood: a Response to Evangelical Feminism (Crossway, 1991), pp. 124-39, p. 138</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

%20human%20situation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-08672052eb" data-kw="">
<blockquote><p>Hence, adoration is worship, but every worship is not adoration. Uncovering the head seems to be little older than Paul’s epistles to the Corinthians. The learned [Claudius] Salmasius [d. 1653, a French reformed classical scholar], thinks it but a national sign of honor, no ways universally received: But certainly it is not adoration: Though therefore we [men] receive the Supper of the Lord uncovered, no man can conclude from thence adoration of the elements, as we do from kneeling [before the Supper] conclude the same, as we shall [conclude] here for all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly either of God, or of these means: It is lawful to tremble at the Word, and for Josiah to weep before the book of the Law read, and for the martyrs to kiss the stake, as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646), pp. 89-90</span></figcaption>

" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Plato (5th-4th cent. B.C.), describing the parts of the human body, wrote of ‘the head which is the most divine part and which reigns (δεσποτέω) over all the parts within us’ (Timaeus 44.D). Plutarch (A.D. 46-120), one of the most prominent Greek authors from the New Testament period (and one who reflected secular thinking independent of Jewish or Christian influence), explained why the words soul (ψυχη) and head (κεφαλή) can be used to speak of the whole person: ‘We affectionately call a person ‘soul’ or ‘head’ from his ruling parts…’ (Table-Talk 692.D.11). Philo (Jewish philosopher, c. 30 B.C.—c. A.D. 45), representing one aspect of first century Judaism, had a similar understanding: ‘As the head in the living body is the ruling place… so Ptolemy became head among kings’ (Life of Moses 2.30). ‘The mind is the head and ruler… of the sense-perception in us’ (Life of Moses 2.82); ‘’Head’ we interpret allegorically to be the ruling… mind of the soul’ (On Dreams 2.207).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-grudem.html">Wayne Grudem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does Kefale</cite>, (‘Head’) Mean ‘Source’ Or ‘Authority Over’ in Greek Literature?: a Survey of 2,336 Examples’ Trinity Journal, no. 6.1 (Spring 1985), pp. 38-59, p. 42</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Plato (5th-4th cent. B.C.), describing the parts of the human body, wrote of ‘the head which is the most divine part and which reigns (δεσποτέω) over all the parts within us’ (Timaeus 44.D). Plutarch (A.D. 46-120), one of the most prominent Greek authors from the New Testament period (and one who reflected secular thinking independent of Jewish or Christian influence), explained why the words soul (ψυχη) and head (κεφαλή) can be used to speak of the whole person: ‘We affectionately call a person ‘soul’ or ‘head’ from his ruling parts…’ (Table-Talk 692.D.11). Philo (Jewish philosopher, c. 30 B.C.—c. A.D. 45), representing one aspect of first century Judaism, had a similar understanding: ‘As the head in the living body is the ruling place… so Ptolemy became head among kings’ (Life of Moses 2.30). ‘The mind is the head and ruler… of the sense-perception in us’ (Life of Moses 2.82); ‘’Head’ we interpret allegorically to be the ruling… mind of the soul’ (On Dreams 2.207).”

— Wayne Grudem, ‘Does Kefale (‘Head’) Mean ‘Source’ Or ‘Authority Over’ in Greek Literature?: a Survey of 2,336 Examples’ Trinity Journal, no. 6.1 (Spring 1985), pp. 38-59, p. 42">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CPlato+%285th-4th+cent.+B.C.%29%2C+describing+the+parts+of+the+human+body%2C+wrote+of+%E2%80%98the+head+which+is+the+most+divine+part+and+which+reigns+%28%CE%B4%CE%B5%CF%83%CF%80%CE%BF%CF%84%CE%AD%CF%89%29+over+all+the+parts+within+us%E2%80%99+%28Timaeus+44.D%29.+Plutarch+%28A.D.+46-120%29%2C+one+of+the+most+prominent+Greek+authors+from+the+New+Testament+period+%28and+one+who+reflected+secular+thinking+independent+of+Jewish+or+Christian+influence%29%2C+explained+why+the+words+soul+%28%CF%88%CF%85%CF%87%CE%B7%29+and+head+%28%CE%BA%CE%B5%CF%86%CE%B1%CE%BB%CE%AE%29+can+be+used+to+speak+of+the+whole+person%3A+%E2%80%98We+affectionately+call+a+person+%E2%80%98soul%E2%80%99+or+%E2%80%98head%E2%80%99+from+his+ruling+parts%E2%80%A6%E2%80%99+%28Table-Talk+692.D.11%29.+Philo+%28Jewish+philosopher%2C+c.+30+B.C.%E2%80%94c.+A.D.+45%29%2C+representing+one+aspect+of+first+century+Judaism%2C+had+a+similar+understanding%3A+%E2%80%98As+the+head+in+the+living+body+is+the+ruling+place%E2%80%A6+so+Ptolemy+became+head+among+kings%E2%80%99+%28Life+of+Moses+2.30%29.+%E2%80%98The+mind+is+the+head+and+ruler%E2%80%A6+of+the+sense-perception+in+us%E2%80%99+%28Life+of+Moses+2.82%29%3B+%E2%80%98%E2%80%99Head%E2%80%99+we+interpret+allegorically+to+be+the+ruling%E2%80%A6+mind+of+the+soul%E2%80%99+%28On+Dreams+2.207%29.%E2%80%9D%0A%0A%E2%80%94+Wayne+Grudem%2C+%E2%80%98Does+Kefale+%28%E2%80%98Head%E2%80%99%29+Mean+%E2%80%98Source%E2%80%99+Or+%E2%80%98Authority+Over%E2%80%99+in+Greek+Literature%3F%3A+a+Survey+of+2%2C336+Examples%E2%80%99+Trinity+Journal%2C+no.+6.1+%28Spring+1985%29%2C+pp.+38-59%2C+p.+42&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fee80ccc32f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma"

<main class="wrap"><figure class="quote" id="q-b0bb8e9b19" data-kw="">
<blockquote><p>Paul subordinates himself, all preachers, all the angels of heaven, everybody to the Sacred Scriptures. We are not the masters, judges, or arbiters, but witnesses, disciples, and confessors of the Scriptures, whether we be pope, Luther, Augustine, Paul, or an angel from heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, on Gal. 1:9, p. 24</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-623aa7b562" data-kw="">
<blockquote><p>The Scripture never mentions such an infallible judge on earth. Neither Pope, nor councils, possess the properties requisite to constitute a supreme judge in controversies of religion; for they are fallible, and have often eyed, and contradicted one another. Although the Church or her ministers are the official guardians of the Scriptures, … yet their authority is only ministerial, and their interpretations and decisions are binding on the conscience only in so far as they accord with the mind of the Spirit in the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed Faith: An Exposition of the Westminster Confession of Faith</cite>, on ch. 1, §§ 9–10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/rome/the-rule-of-faith.html">Rome: The Rule of Faith</a> › <a href="../topics/rome/the-rule-of-faith/scripture-vs-tradition.html">Scripture vs tradition</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Scripture never mentions such an infallible judge on earth. Neither Pope, nor councils, possess the properties requisite to constitute a supreme judge in controversies of religion; for they are fallible, and have often eyed, and contradicted one another. Although the Church or her ministers are the official guardians of the Scriptures, … yet their authority is only ministerial, and their interpretations and decisions are binding on the conscience only in so far as they accord with the mind of the Spirit in the Scriptures.”

</figure><figure class="quote" id="q-942957c3d0" data-kw="">
<blockquote><p>Accordingly we see that the Councils to which this specious coloring is given, are no other than six or seven spurious Councils held after the light of sound doctrine was extinguished, and discipline had decayed, and when the merest dolts were present — Councils which exhibit no appearance of ancient dignity, but smack of the Gothic tyranny of the Roman See.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, On the Decree concerning Residences</span></figcaption>

<blockquote><p>Regretfully, the Original Seceders did not unite with the Reformed Presbyterians in order to strengthen the covenanting cause against the forces of latitudinarian evangelicalism, liturgical antinomianism, and Romanism. Nevertheless, Thomas Hobart’s comments concerning the need for such unity, made at the Original Secession’s renewal of the covenants in 1873, are still relevant today:

And now that latitudinarian indifference on the one hand, and Popery on the other, are so rapidly increasing, and making such determined efforts to gain the ascendancy in our land, we trust we have this day but the beginning of the drawing together of the covenanting forces, – that the Reformed Presbyterians, who have so long and so nobly testified for the same truths, shall soon become one with us in maintaining a testimony for our glorious second reformation principles, and that as united we shall be the means, in the Spirit’s hand, of beginning to roll back the tide of error, will-worship, and ungodliness that threatens to overwhelm our land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hobart.html">Thomas Hobart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>National covenanting a national privilege: a sermon, preached in the Rev. J. Chancellor’s church, Belfast</cite>, (Perth, 1874), pp 19-20.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0964889a91" data-kw="">
<blockquote><p>In the preface to a printed version of James Begg’s speech before the General Assembly of the Free Church of Scotland in 1868 on the subject of Irish disestablishment, he attributed Ulster’s prosperity partly to its Protestantism and warned of the evils of the British government disowning Protestantism in Ireland:

The vast importance of the subject to which it relates can scarcely be over-estimated, and although a singular amount of delusion is abroad in regard to it, it is hoped that wiser counsels may yet prevail. That any one who, having read history, has travelled over Ireland, and had an opportunity of comparing that fertile but unhappy country with other lands, can have any serious doubt as to the leading cause of its social degradation, seems incredible. Other causes, no doubt, there are, but let any one compare Belfast with Galway, Protestant Ulster with the Popish south and west of Ireland, and it seems impossible to deny that the same cause which has degraded Mexico and Spain, Austria and Italy, has visibly stamped its impress on Ireland. …

That the question of Ireland involves peculiar difficulties, especially when considered cursorily, and from a Scotch point of view, without regard to the broad issues raised, may be readily admitted. But these difficulties are not new; and what is now proposed is that the Government should, instead of reforming, not only disendow but disestablish or disown Protestantism in Ireland; in other words, virtually hand over that unhappy country to the management of the Romish priests. How such a man as Dr [Thomas] Chalmers would have acted in present circumstances cannot be doubtful; and a mere change of position cannot affect unalterable principles, founded on the Word of God.

At the present moment parties are manifestly acting in concert whose objects are totally different, and never, perhaps, was the political craft of Rome more conspicuous than in getting so many opposite classes to do her work, and that too upon pretence of seeking to destroy her influence.

The questions now raised, however, should be considered apart from individuals or parties, and we commend the following facts and considerations to the Christian people of Britain, who must think and act for themselves. They have now, to an extent greater than has probably existed since the Reformation, the power of influencing the proceedings of statesmen and of parliaments.

No such crisis as the present has occurred since the Revolution; no more important parliament than that about to assemble has been convened in modern times. And we trust the result will prove that the Protestant spirit of the country is still unbroken, and that whilst fully prepared for every measure of true reform, the Parliament of Britain will resist revolution, and maintain to the uttermost that truth and righteousness by which alone a nation can be exalted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Proposed Disestablishment of Protestantism in Ireland. In its bearing upon the Religion and Liberties of the Empire</cite>, (Edinburgh: James Nichol, 1868), pp 3, 4.</span></figcaption>

</figure><figure class="quote" id="q-1ad55b48c8" data-kw="">
<blockquote><p>Though there be many things in a Church to brangle and lessen the comfort of our communion with it, and the ministry thereof, yet we may keep fellowship with a true Church, though in many things faulty and corrupt, as all Churches are in some measure in this militant state. As the Church of Corinth had many corruptions in her practice, yet no separation is enjoined from it: And the Lord did not require separation from the Churches of Pergamos and Thyatira, though they had many corruptions and deficiencies in discipline, in a toleration of heretics; and would lay no other burden upon them, but to hold fast what they had, as Mr. Durham shows on the Revelation, ch. 2, lect. 6, as also ch. 13, lect. 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>Being deeply impressed with the sense of the dismal effects and fatal consequences of division and alienation of mind and affection among the Lord’s servants, and of the indispensable necessity of mutual harmony in the Lord among the ambassadors of the Gospel of peace; and being much weighted with the present situation this Church is now in on many accounts, it was no small satisfaction to us to understand that our worthy and dear Brethren, whom we judge in charity have acted according to their light and conscience in taking the said oath, do evidence such brotherly regard to us, and such tenderness to the peace and welfare of this Church, in expressing their readiness to contribute their best endeavors for removing all differences among such as fear the Lord in this Church, in addressing the government for our relief, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

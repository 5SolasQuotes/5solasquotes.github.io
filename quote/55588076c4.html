<blockquote><p>§ 9. I now come to consider what apprehensions modern writers have had of schism… I choose one, whom, I think my [episcopal] antagonist will not except against, the learned Bishop of Worcester, in his Irenic. p. 109, the sum of whose discourse is: all are bound to join into some Church society; and being so joined, should continue in that society till his communion with them becomes sin. Now for what makes it sin to continue in Church communion, and consequently warrants separation; he supposes that corruption in the essentials of the constitution of the Church may warrant it…</p></blockquote>

<blockquote><p>8. It would be good that, as a pledge of concord, after this conference, the Holy Supper should be celebrated, in which the pastors of England, France, etc., should communicate together; and that the action should be preceded by a fast—not only of the deputies, but also of the Church in which the assembly shall be convened—in order to implore the assistance of God upon so great and so important a design. …

16. As for the sacrament and the participation of the body of Jesus Christ, I judge that one may agree upon these points [with the Lutherans]:

1. That the signs or symbols are not bare signs and simple figures destitute of reality.

2. That in the Holy Supper we truly partake of the body of Jesus Christ.

3. That the bread is not transubstantiated, and does not cease to be bread after consecration.

4. Whence it follows that the sacrament ought not to be adored, and that we must lift up our hearts on high.

5. And as for the manner of partaking of the body of Jesus Christ in the Supper, we must not inquire into it scrupulously; only hold, with the apostle, saint Paul (Eph. 3), that Christ dwells in our hearts by faith [v. 17]; whence it follows that He does not dwell in those who have no faith. And if anyone remains firm in his own opinion, yet let him bear with his brethren and not condemn them violently; only, in that wherein we are agreed, let us walk together with one accord. [Phil. 3:15-16]

17. For there are two kinds of errors: some which consist only in belief, others which, besides belief, add some outward action. Of the first kind are the errors concerning the nature of Jesus Christ, concerning Predestination and concerning Free Will. Of the second are: Communion under one kind, adoration of the Host, and prayer in a tongue not understood by him that prays. The errors of this latter kind, although very often less grave than the former, yet divide minds far more sharply, and often cause schism. For if I communicate in the sacrament with one who errs concerning predestination or the nature of Jesus Christ, or who believes that the body of the Lord is everywhere—though the error be great—nevertheless it does not disturb him who communicates with him. But if I should come to communicate with one who adores the bread, or pretends to sacrifice Jesus Christ, such an action would scandalize me and drive me away for fear of participating in idolatry or in a false sacrifice. Now we have this advantage: that with the Lutheran Churches all our differences are of the first kind; and that, as to the external matters which they practice in the Church, we have no disagreement which is not easy to compose. …

19. I would wish that in this second assembly the same order be observed as in the first, and the same respect toward his Majesty of England; and that it begin with a fast and end with the celebration of the Holy Supper, in which the Lutheran pastors and ours should communicate together.

20. To proceed to execution [of the Church union proposed], that the peoples and Churches may conform themselves to what shall have been agreed upon, it is altogether necessary that the princes promise to employ their authority to the end that these names of Lutherans, Calvinists and Sacramentarians [the Reformed] be abolished, and that our Churches be called Reformed Christian Churches; that, under heavy penalties, it be forbidden to use invective preaching against brethren, or to write any books one against another; and that the catalogue of the Frankfurt [Germany] fair be no longer burdened with injurious titles, as has been customary. That the German princes, on certain agreed days, should send of their ministers to the chief churches of neighboring [Reformed] princes [in Germany], and receive theirs in turn, and communicate together in the Holy Supper on a solemn day.</p></blockquote>

<blockquote><p>3. We do not in the least doubt to affirm that some of these are empty quibbles, and that in most of them the disagreement arises, not from a real dissent of the Churches themselves, but partly from the preposterous zeal of certain ministers indulging too much in their own affections and genius, partly from not observing the pattern (ὑποτυπώσιν) of sound words, partly from not correctly understanding the mutual opinions of the dissenting parties, partly from a different mode of explaining, when there is consent in the thing explained. So that it is probable, if the matters themselves are more diligently weighed by pious, learned, candid, and moderate men of both parties, either in a synod or otherwise in friendly conference, a not insignificant, nay, a very great hope (with divine favor) may rightly be conceived, that these controversies will be settled, and a perfect concord in matters of faith may be entered into.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. We do not in the least doubt to affirm that some of these are empty quibbles, and that in most of them the disagreement arises, not from a real dissent of the Churches themselves, but partly from the preposterous zeal of certain ministers indulging too much in their own affections and genius, partly from not observing the pattern (ὑποτυπώσιν) of sound words, partly from not correctly understanding the mutual opinions of the dissenting parties, partly from a different mode of explaining, when there is consent in the thing explained. So that it is probable, if the matters themselves are more diligently weighed by pious, learned, candid, and moderate men of both parties, either in a synod or otherwise in friendly conference, a not insignificant, nay, a very great hope (with divine favor) may rightly be conceived, that these controversies will be settled, and a perfect concord in matters of faith may be entered into.”

— Samuel Ward, pp. 149-53 in Theological Determinations, ‘The Reformed Churches do not Dissent in the Fundamentals of the Faith’ in Works of Samuel Ward… ed. Seth Ward (d. 1643; Gallibrand, 1658), p. 150">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+We+do+not+in+the+least+doubt+to+affirm+that+some+of+these+are+empty+quibbles%2C+and+that+in+most+of+them+the+disagreement+arises%2C+not+from+a+real+dissent+of+the+Churches+themselves%2C+but+partly+from+the+preposterous+zeal+of+certain+ministers+indulging+too+much+in+their+own+affections+and+genius%2C+partly+from+not+observing+the+pattern+%28%E1%BD%91%CF%80%CE%BF%CF%84%CF%85%CF%80%CF%8E%CF%83%CE%B9%CE%BD%29+of+sound+words%2C+partly+from+not+correctly+understanding+the+mutual+opinions+of+the+dissenting+parties%2C+partly+from+a+different+mode+of+explaining%2C+when+there+is+consent+in+the+thing+explained.+So+that+it+is+probable%2C+if+the+matters+themselves+are+more+diligently+weighed+by+pious%2C+learned%2C+candid%2C+and+moderate+men+of+both+parties%2C+either+in+a+synod+or+otherwise+in+friendly+conference%2C+a+not+insignificant%2C+nay%2C+a+very+great+hope+%28with+divine+favor%29+may+rightly+be+conceived%2C+that+these+controversies+will+be+settled%2C+and+a+perfect+concord+in+matters+of+faith+may+be+entered+into.%E2%80%9D%0A%0A%E2%80%94+Samuel+Ward%2C+pp.+149-53+in+Theological+Determinations%2C+%E2%80%98The+Reformed+Churches+do+not+Dissent+in+the+Fundamentals+of+the+Faith%E2%80%99+in+Works+of+Samuel+Ward%E2%80%A6+ed.+Seth+Ward+%28d.+1643%3B+Gallibrand%2C+1658%29%2C+p.+150&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fecd50798a7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ecd50798a7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-lutheranism/#:~:text=3.%20We%20do%20not%20in%20the,of%20faith%20may%20be%20entered%20into&amp;text=3.%20We%20do%20not%20in%20the%20least%20doubt&amp;text=in%20matters%20of%20faith% <blockquote><p>XIII. What chiefly prevents the Reformed from uniting with the Roman Church, while they are ready to reconcile with those who follow the Augsburg Confession, is that in the public and external worship of those singularly devoted to the Augsburg Confession, there is nothing that could gravely scandalize the Reformed and prevent them from attending in good conscience. Conversely, there is nothing in the Reformed worship that could reasonably offend the conscience of other Protestants or be a stumbling block to them. In neither case is anything publicly adored that is not believed and professed by both to be God. But the public and external worship of the Roman Church primarily consists of practices that the Reformed cannot, in good conscience, either perform or approve.</p></blockquote>

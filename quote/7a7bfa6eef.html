<main class="wrap"><figure class="quote" id="q-7a7bfa6eef" data-kw="">
<blockquote><p>In reality there are two, and only two, foundations of law; and they are both of them conditions without which nothing can give it any force; I mean equity and utility. With respect to the former, it grows out of the great rule of equality, which is grounded upon our common nature, and which Philo, with propriety and beauty, calls the mother of justice. All human laws are, properly speaking, only declaratory; they may alter the mode and application, but have no power over the substance of original justice. The other foundation of law, which is utility, connected in the same manner with, and derived directly from, our rational nature; for any other utility may be the utility of a robber, but cannot be that of a citizen; the interest of the domestic enemy, and not that of a member of the commonwealth. This present equality can never be the foundation of statues which create an artificial difference between men, as the laws before us [under consideration in his time] do, in order to induce a consequential inequality in the distribution of justice. Law is a mode of human action respecting society, and must be governed by the same rules of equity which govern every private action; and so Tully [Cicero?] considers it in his Offices as the only utility [being a utility to all commonly] agreeable to that [common] nature…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-burke.html">Edmund Burke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works &amp; Correspondence of the Right Honourable Edmund Burke. A New Edition, in 8 Volumes, vol. 6 (d. 1797; London, 1852), p. 17. See also the larger context from pp. 14-18, which includes helpful Latin quotes from Suarez. Burke is opposing certain laws contrary to Romanists in Ireland.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20d2ebcab3" data-kw="">
<blockquote><p>For 1. The very ground and reason wherefore we ought to obey the magistrate, is, for that he is the minister of God, or a deputy set in God’s stead to us. Now, he is the minister of God only for our good, Rom. 13:4. Neither were he God’s minister, but his owne master, if he should rule at his pleasure and command things which serve not for the good of the subjects. Since therefore the commandments of princes bind only so far as they are the ministers of God for our good: and God’s ministers they are not, in commanding such things as are either in their nature unlawful, or in their use inconvenient: it follows that such commandments of theirs cannot bind. (Pareus, on Rom. 13:4)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies... (Edinburgh, 1637) | 3rd Part, pp. 134-138, 142 &amp; 155-57 of ch. 8, ‘That the Lawfulness of the Ceremonies cannot be Warranted by any Ordinance of the Civil Magistrate…’ This is the best.</cite>, p. 134</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-876a5332a9" data-kw="">

</figure><figure class="quote" id="q-057c8549ea" data-kw="">
<blockquote><p>Besides the moral law, God gave to Israel ceremonial and judicial laws; the two latter are of limited and temporary use; the former is of universal and perpetual obilgation. … 2. The judicial law respected the Jews in their political capacity, or as a nation, and consisted of those institutions which God prescribed to them for their civil government. This law, as far as the Jewish polity was peculiar, has also been entirely abolished; but as far as it contains any statute founded in the law of nature common to all nations, it is still obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Confession of Faith, 19.4</cite></span></figcaption>

</figure><figure class="quote" id="q-4ef9d041db" data-kw="">
<blockquote><p>The human law is that which humans, proceeding by reason, produce from the preceding laws, accommodated first to common just, honest, useful, and necessary conclusions, then to particular determinations for the condition of persons for whose good it is produced, the things or matters concerning which it is produced, and for the circumstances which occur to them. … We call determinations that part of human law that circumscribes any of those natural conclusions with specific (as we call it) boundaries, not by the authority of nature, but rather by the judgment of the wisest persons, by the common law of nature specifically accommodated to the mode of individual things. .. The objects of just proportion exist in three kinds… for the sake of producing specific determinations. For either they are [1] primary objects whose good is seen by natural, divine, and human law; or [2] they are secondary objects that are ordered to the former ones as to their own end; or, [3] finally, they are accidents, by which the previous two objects are commonly clothed in a certain way and change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 4, ‘Of the Part in Human Laws which is Mutable, and the Causes of the Mutability’ in The Mosaic Polity (1st ed. 1592; 1602; CLP Academic, 2015)</cite>, pp. 54 &amp; 56-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<main class="wrap"><figure class="quote" id="q-b21e1532e1" data-kw="eternity no succession">
<blockquote><p>The infinity of God in reference to duration is called eternity to which these three things are ascribed: (1) that it is without beginning; (2) without end; (3) without succession. We maintain that God is free from every difference of time, and no less from succession than from beginning and end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.10.1</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Knowledge of God</span></figcaption>

</figure><figure class="quote" id="q-06ebabd394" data-kw="simplicity no composition">

</figure><figure class="quote" id="q-a87c150997" data-kw="power ability">
<blockquote><p>The power of God is that ability and strength whereby he can bring to pass whatsoever he please, whatsoever his infinite wisdom can direct, and whatsoever the infinite purity of his will can resolve. Power, in the primary notion of it, doth not signify an act, but an ability to bring a thing into act. As God had an ability to create before he did create, he had power before he acted that power without.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f1ffe7d20c" data-kw="">
<blockquote><p>Whereof to make some good use to our selves, we may note and mark first, the truth of God’s promise made to Abraham in the 15. of Gen. when he bad him look up to the stars of heaven, and number them, if he could, assuring him then, that even so would he make his posterity and offspring a mighty people, and a great kindred, which we all see here was fulfilled. So assuredly true are all other of Gods promises, and therefore think of what you will, your faith and comfort shall not fail you. That sweet promise, that, at what time soever a sinner repenteth truly of his sins, God in mercy will forgive him, it shall never fail. He may as soon cease to be God, as cease to be true in any thing which he hath spoken.

And for this particular he hath not only spoken it, but sworn it, that, as he liveth he will not the death of any true penitent and sorrowful sinner. We may not therefore do him wrong, and doubt of it. It is no pride to take fast hold of this word, but it is duty due from us to confess his truth, and to be thankful. An other promise he hath made to us, that, if we seek the kingdom and the righteousness thereof, these worldly wants of ours shall ever be supplied, as shall be fit and good for us. This also will he as assuredly keep, as he is God, to the great quietness of our hearts, if we will believe him.

In a word, that promise of all promises, that, if we believe in his Son, we shall never perish, but have eternal life, he will perform. So, both for this life, and that to come, we have his word: and, no more than he failed Abraham in multiplying his seed, will he fail us in any promise. Only his time we must tarry, and hasty minds learn humble patience. He knoweth when is best both for him, and us. Tarry he may, but come he will. Never untruth passed from him, never any that believed in him was disappointed of his hope.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable notes upon the books of Exodus and Leviticus, as before upon Genesis Gathered and laid down still in this plain manner, for the good of them that cannot use better helps, and yet are careful to read the Scriptures, and very desirous to find the comfort in them. … With a table of the prin</cite>, (London: Thomas Chard, 1604), pp 3-4.</span></figcaption>

<blockquote><p>Whence it follows, that the merit of works ceases when righteousness is sought by faith; for it is necessary that this righteousness should be freely given by God, and offered in his word, in order that any one may possess it by faith. To render this more intelligible, when Moses says that faith was imputed to Abram for righteousness, he does not mean that faith was that first cause of righteousness which is called the efficient, but only the formal cause; as if he had said, that Abram was therefore justified, because, relying on the paternal loving-kindness of God, he trusted to His mere goodness, and not to himself, nor to his own merits. For it is especially to be observed, that faith borrows a righteousness elsewhere, of which we, in ourselves, are destitute; otherwise it would be in vain for Paul to set faith in opposition to works, when speaking of the mode of obtaining righteousness. Besides, the mutual relation between the free promise and faith, leaves no doubt upon the subject.</p></blockquote>

<blockquote><p>What are the different opinions as to the relation between faith and love? 1st. The Romanists, in order to maintain their doctrine that faith alone is not saving, distinguish between a formed, or perfect, and an unformed faith. They acknowledge that faith is distinct from love, but maintain that love is essential to render faith meritorious and effectual as the instrument of our salvation. 2d. Some have regarded love as the root out of which faith springs. 3d. The true view is that love is the immediate and necessary effect of faith. Faith includes the spiritual apprehension of the beauty and excellence of the truth, and an act of the will embracing it and relying upon it. Yet these graces can not be analytically separated, since they mutually involve one another. There can be no love without faith, nor any faith without love. Faith apprehends the loveliness of the object, the heart spontaneously loves it. Thus “faith works by love,” since these affections are the source of those motives that control the will. The Romish doctrine is inconsistent with the essential principles of the gospel. Faith is not a work, nor can it have, when formed or unformed, any merit, it is essentially a self-emptying act, which saves by laying hold of the merits of Christ. It leads to works, and proves itself by its fruits, but in its relation to justification it is in its very nature a strong protest against the merits of all human works, Gal. 3:10, 11; Eph. 2:8, 9. The Protestant doctrine that love is the fruit of faith is established by what the Scriptures declare concerning faith, that it “sanctifies,” “works by love,” “overcomes the world,” Gal. 5:6; Acts 26:18; 1 John 5:4. This is accomplished thus—by faith we are united to Christ, Eph. 3:17, and so become partakers of his Spirit, 1 John 3:24, one of the fruits of the Spirit is love, Gal. 5:22, and love is the principle of all obedience, Rom. 13:10.</p></blockquote>

<blockquote><p>Now before I close, let me commend to your notice and practice three or four things.

1. In reading this and such Gospel-Mysteries, you must believe above your Reason natural; so you give God the more honour, Rom. 4.19, 20. The Object of Abraham’s Faith, which was accounted to him for Righteousness, Gen. 15.6. &amp; 18.12. was of that nature, as whereat Sarah laughed; who therein was an Image of Natural Reason.

2. In your Reading and Reasoning of this and such points of eternal moment, ever think that part the safest, which doth least humour man’s pride, and most exalt the Glory of God; since the scope of the Gospel is to shut out boasting, and bring in self-denial, which none can deny.

3. In all your thought-debates about this Subject, seriously bethink your selves what is like to be your opinion of it when you come to die; [Cardinal] Bellarm[ine]. as you heard, professed new Divinity in it before his death.

4. If you have the opportunity to Converse with wounded spirits, and troubled Consciences, with whom it is or hath been as a Specimen of the day of Judgment; they will tell you whether any Righteousness but Jesus Christ made of God unto them Righteousness, could serve their turn in the presence of God, or satisfy their Conscience with a holding peace.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now before I close, let me commend to your notice and practice three or four things.

1. In reading this and such Gospel-Mysteries, you must believe above your Reason natural; so you give God the more honour, Rom. 4.19, 20. The Object of Abraham’s Faith, which was accounted to him for Righteousness, Gen. 15.6. &amp; 18.12. was of that nature, as whereat Sarah laughed; who therein was an Image of Natural Reason.

2. In your Reading and Reasoning of this and such points of eternal moment, ever think that part the safest, which doth least humour man’s pride, and most exalt the Glory of God; since the scope of the Gospel is to shut out boasting, and bring in self-denial, which none can deny.

3. In all your thought-debates about this Subject, seriously bethink your selves what is like to be your opinion of it when you come to die; [Cardinal] Bellarm[ine]. as you heard, professed new Divinity in it before his death.

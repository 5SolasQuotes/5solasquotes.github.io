<blockquote><p>Phinehas and the ambassadors speak as if they had been delivered by the children of Reuben, Gad, and Manasseh, because there was no longer any ground to fear the divine vengeance, when all suspicion of criminality had been removed… …the two tribes and the half tribe carefully exert themselves to perform their duty by giving a name to the altar, which, by explaining its proper use, might draw off the people from all superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Joshua</cite>, 22 | v. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-548c34f841" data-kw="">
<blockquote><p>Gregory says in a homily (vi in Evang.): ‘An idle word is one that lacks either the usefulness of rectitude or the motive of just necessity or pious utility.’ But an idle word is an evil, because ‘men… shall render an account of it in the day of judgment’ (Mt. 12:36): while if it does not lack the motive of just necessity or pious utility, it is good. Therefore every word is either good or bad. For the same reason every other action is either good or bad. Therefore no individual action is indifferent. …It sometimes happens that an action is indifferent in its species, but considered in the individual it is good or evil. And the reason of this is because a moral action… derives its goodness not only from its object, whence it takes its species; but also from the circumstances, which are its accidents, as it were; just as something belongs to a man by reason of his individual accidents, which does not belong to him by reason of his species. And every individual action must needs have some circumstance that makes it good or bad, at least in respect of the intention of the end. For since it belongs to the reason to direct; if an action that proceeds from deliberate reason be not directed to the due end, it is, by that fact alone, repugnant to reason, and has the character of evil. But if it be directed to a due end, it is in accord with reason; wherefore it has the character of good. Now it must needs be either directed or not directed to a due end. Consequently every human action that proceeds from deliberate reason, if it be considered in the individual, must be good or bad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 9. ‘Whether an individual action can be indifferent?’ [No]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>Question: Why did Christ take bread rather than any other element? Answer: …

2. Christ took bread because of the analogy; Bread did nearly resemble Him, John 6:48, ‘I am that bread of life.’ There is a threefold resemblance:

1. Bread is useful. Other comforts are more for delight than use. Music delights the ear, color, the eye, but bread is the staff of life. So is Christ useful. There is no subsisting without Him, John 6:57, ‘He that eateth Me, even he shall live by Me.’

2. Bread is satisfying. If a man be hungry, bring him flowers or pictures, they do not satisfy, but bread does satiate. So Jesus Christ the bread of the soul, satisfies; He satisfies the eye with beauty, the heart with sweetness, the conscience with peace.

3. Bread is strengthening, Ps. 104:15, ‘Bread which strengthens man’s heart.’ So Christ, the bread of the soul, transmits strength. He strengthens us against temptations, He gives strength for doing and suffering work. He is like the cake the angel brought to the prophet, 1 Kings 19:8, ‘He arose and did eat, and went in the strength of that meat forty days, and forty nights, unto Horeb the Mount of God.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Holy Eucharist</cite>, ... (London, 1668), ‘The Mystery of the Lord’s Supper’, pp. 7-9</span></figcaption>

<blockquote><p>The very many questions that the [Medieval] Scholastics usually raise on this point are foolish ones: whether it is permitted to use for baptism anything other than every-day water, or whether it is permitted to use lye [a liquor made from ashes of wood], urine, boiled or distilled water, or also wine, vinegar, or even sand or mud. For as they rashly identify many materials on the assumption that baptism is absolutely necessary, so we read that Christ and the apostles consecrated and used for this sacrament nothing other than every-day water, and therefore, and therefore since these materials lack any commandment or promise, they cannot be used in faith. Accordingly we see that also John preached in Aenon because there was much water there (John 3:23), and that Philip did not baptize the already believing Ethiopian until they came to a place where there was water (Acts 8:36). And since there is obviously nothing more common than water (so that it has even become a proverb), instances of that sort can arise very rarely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 2, Disputation 44, ‘On the Sacrament of Baptism’, section 17, p. 145</span></figcaption>

<blockquote><p>Section 7. Third part of liberty, viz., the free rise of things indifferent. The knowledge of this part necessary to remove despair and superstition. Superstition described… The third part of this liberty is that we are not bound before God to any observance of external things which are in themselves indifferent, (“adiafora”) but that we are now at full liberty either to use or omit them. The knowledge of this liberty is very necessary to us; where it is wanting our consciences will have no rest, there will be no end of superstition. In the present day many think us absurd in raising a question as to the free eating of flesh, the free use of dress and holidays, and similar frivolous trifles, as they think them; but they are of more importance than is commonly supposed. For when once the conscience is entangled in the net, it enters a long and inextricable labyrinth, from which it is afterwards most difficult to escape. When a man begins to doubt whether it is lawful for him to use linen for sheets, shirts, napkins, and handkerchiefs, he will not long be secure as to hemp, and will at last have doubts as to tow; for he will revolve in his mind whether he cannot sup without napkins, or dispense with handkerchiefs. Should he deem a daintier food unlawful, he will afterwards feel uneasy for using loafbread and common eatables, because he will think that his body might possibly be supported on a still meaner food. If he hesitates as to a more genial wine, he will scarcely drink the worst with a good conscience; at last he will not dare to touch water if more than usually sweet and pure. In fine, he will come to this, that he will deem it criminal to trample on a straw lying in his way. For it is no trivial dispute that is here commenced, the point in debate being, whether the use of this thing or that is in accordance with the divine will, which ought to take precedence of all our acts and counsels. Here some must by despair be hurried into an abyss, while others, despising God and casting off his fear, will not be able to make a way for themselves without ruin. When men are involved in such doubts whatever be the direction in which they turn, every thing they see must offend their conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.10.7</span></figcaption>

— John Calvin, Institutes of the Christian Religion 4.10.7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSection+7.+Third+part+of+liberty%2C+viz.%2C+the+free+rise+of+things+indifferent.+The+knowledge+of+this+part+necessary+to+remove+despair+and+superstition.+Superstition+described%E2%80%A6+The+third+part+of+this+liberty+is+that+we+are+not+bound+before+God+to+any+observance+of+external+things+which+are+in+themselves+indifferent%2C+%28%E2%80%9Cadiafora%E2%80%9D%29+but+that+we+are+now+at+full+liberty+either+to+use+or+omit+them.+The+knowledge+of+this+liberty+is+very+necessary+to+us%3B+where+it+is+wanting+our+consciences+will+have+no+rest%2C+there+will+be+no+end+of+superstition.+In+the+present+day+many+think+us+absurd+in+raising+a+question+as+to+the+free+eating+of+flesh%2C+the+free+use+of+dress+and+holidays%2C+and+similar+frivolous+trifles%2C+as+they+think+them%3B+but+they+are+of+more+importance+than+is+commonly+supposed.+For+when+once+the+conscience+is+entangled+in+the+net%2C+it+enters+a+long+and+inextricable+labyrinth%2C+from+which+it+is+afterwards+most+difficult+to+escape.+When+a+man+begins+to+doubt+whether+it+is+lawful+for+him+to+use+linen+for+sheets%2C+shirts%2C+napkins%2C+and+handkerchiefs%2C+he+will+not+long+be+secure+as+to+hemp%2C+and+will+at+last+have+doubts+as+to+tow%3B+for+he+will+revolve+in+his+mind+whether+he+cannot+sup+without+napkins%2C+or+dispense+with+handkerchiefs.+Should+he+deem+a+daintier+food+unlawful%2C+he+will+afterwards+feel+uneasy+for+using+loafbread+and+common+eatables%2C+because+he+will+think+that+his+body+might+possibly+be+supported+on+a+still+meaner+food.+If+he+hesitates+as+to+a+more+genial+wine%2C+he+will+scarcely+drink+the+worst+with+a+good+conscience%3B+at+last+he+will+not+dare+to+touch+water+if+more+than+usually+sweet+and+pure.+In+fine%2C+he+will+come+to+this%2C+that+he+will+deem+it+criminal+to+trample+on+a+straw+lying+in+his+way.+For+it+is+no+trivial+dispute+that+is+here+commenced%2C+the+point+in+debate+bei

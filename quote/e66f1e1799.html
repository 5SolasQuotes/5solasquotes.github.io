<blockquote><p>9. Whence all things which happen in time are said to have been in God from eternity, not by their real essence nor by formal substance, but by knowledge and decree: not by formal being, but by virtual being.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-465ac9ef5f" data-kw="">
<blockquote><p>’The sun and the moon stood still in their habitation’ – they stood still in their several spheres wherein they move, for these be their habitations, and note that they both stood still, sun and moon. For the moon borrowing all her light of the sun, had she kept her course while the sun had stool still the length of a day, there had been great irregularity of motion in these celestial bodies, from the constant order set them by their Maker in their creation. Observe also, he does not say the earth stood still, but the sun: it had been, as some said, the earth and moon stood still as the sun and moon, and our understanding would have soon apprehended, if that new astronomy had been then revealed, which some of our empericks, and journeymen in that excellent science of astronomy have late revived in their almanacs, telling the world that they have long been in a wrong belief, that the sun moves and the earth is fixed, for they believe that the sun is fixed, and the earth is moved. And to evade the clear evidence of the text, which tells it for a wonder that the sun stood still, they say, this is spoken to our capacity, because to our sight it so seems, that the sun moves and the earth is fixed, but indeed it is otherwise. Our capacity I think has much wrong done in this, for if the Word of God had told us that God had created the sun to stand still, and the earth to move, it is more likely that we should have taken his word for it, and have believed it as it is, as well as we now believe it, as it appears. We are neither incapable nor incredulous, but that many against the letter of Scripture have written, and made more believe, that the sun stands still from the creation. The common defence of this opinion grounded on God’s application of himself, to human capacity, does make figures in a story where is no need, and makes David a man of small judgement in the knowledge of the sun, who says, that God ‘hath set a tabernacle for the sun in the heavens’ (called here) a habitation, ‘which is a bridegroom coming out of his chamber, and rejoiceth, as a strong man, to run his race.’ His going forth is from the end of the Heaven, and his circuit unto the ends of it. Does not this prophet speak of the glory of God, declared in the motion, not the station of the sun? or in the glory of God showed in our opinion of the sun’s motion, not in the truth thereof. Greater secrets then this are revealed in holy Scripture, which are against the vouchie of the outward sense, or the rational discourse of man, and no doubt, but if the sun had stood still, and the earth that we live upon had moved, when this miracle was by the spirit of truth recorded, it had been so set down to us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-marbury.html">Edward Marbury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary or Exposition upon the Prophecy of Habbakuk</cite>, ... (London, 1650), on Hab. 3:11, pp. 127-128</span></figcaption>

</figure><figure class="quote" id="q-69e2f1a75b" data-kw="">
<blockquote><p>3rd Problem. Whether God is universally perfect, as it were having in Himself the perfection of all things? Answer: Affirmed—provided you distinguish the “having,” or the “containing,” into the virtual or eminent and the formal. For certain perfections are in God formally, as life, goodness, intellect, will, etc. But certain others only virtually or causally, as in a producing and conserving cause, but not formally—as, e.g., sensitive life, corporeal perfections, and all the other specific perfections of the stars, elements, minerals, plants, animals, etc. According to this distinction, the Enthusiastic frenzies are to be refuted; and rightly are to be explained the texts which say that all things are, or subsist, in God. By this same distinction is determined another Problem, which occurs a little later in my syllabus: Whether created perfections can be in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, ‘Problems on God, pt. 2’ tr. AI by Roman Prestarri Latin, vol. 5 (1669)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>As God did not make the whole fabric of the world at once, though it was not impossible to Him, being a God Almighty, but in the space of six days: So does God deal with his children, in creating in them a clean heart; first he suffers their hearts to be as a rude and massy lump, full of darkness, and then God sends his Holy Spirit into their hearts, and it does illuminate them; and drive away those black clouds of darkness and ignorance… 4… As the sun does now move with much celerity, so fast, that it does in the space of a day, run over many millions of miles.</p></blockquote>

<blockquote><p>It must first be reiterated that with extraordinary few exceptions no educated person in the history of Western Civilization from the third century B.C. onward believed that the earth was flat. A round earth appears at least as early as the sixth century BC with Pythagoras, who was followed by Aristotle, Euclid, and Aristarchus, among others in observing that the earth was a sphere. Although there were a few dissenters–Leukippos and Demokritos for example–by the time of Eratosthenes (3 c. BC), followed by Crates(2 c. BC), Strabo (3 c. BC), and Ptolemy (first c. AD), the sphericity of the earth was accepted by all educated Greeks and Romans. Nor did this situation change with the advent of Christianity. A fewóat least two and at most five–early Christian fathers denied the spherically of earth by mistakenly taking passages such as Ps. 104:2-3 as geographical rather than metaphorical statements. On the other side tens of thousands of Christian theologians, poets, artists, and scientists took the spherical view throughout the early, medieval, and modern church… No one before the 1830s believed that medieval people thought that the earth was flat… But now, why did the false accounts of Letronne and Irving become melded and then, as early as the 1860s, begin to be served up in schools and in schoolbooks as the solemn truth? The answer is that the falsehood about the spherical earth became a colorful and unforgettable part of a larger falsehood: the falsehood of the eternal war between science (good) and religion (bad) throughout Western history… The reason for promoting both the specific lie about the sphericity of the earth and the general lie that religion and science are in natural and eternal conflict in Western society, is to defend Darwinism. The answer is really only slightly more complicated than that bald statement. The flat-earth lie was ammunition against the creationists. The argument was simple and powerful, if not elegant: “Look how stupid these Christians are. They are always getting in the way of science and progress.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It must first be reiterated that with extraordinary few exceptions no educated person in the history of Western Civilization from the third century B.C. onward believed that the earth was flat. A round earth appears at least as early as the sixth century BC with Pythagoras, who was followed by Aristotle, Euclid, and Aristarchus, among others in observing that the earth was a sphere. Although there were a few dissenters–Leukippos and Demokritos for example–by the time of Eratosthenes (3 c. BC), followed by Crates(2 c. BC), Strabo (3 c. BC), and Ptolemy (first c. AD), the sphericity of the earth was accepted by all educated Greeks and Romans. Nor did this situation change with the advent of Christianity. A fewóat least two and at most five–early Christian fathers denied the spherically of earth by mistakenly taking passages such as Ps. 104:2-3 as geographical rather than metaphorical statements. On the other side tens of thousands of Christian theologians, poets, artists, and scientists took the spherical view throughout the early, medieval, and modern church… No one before the 1830s believed that medieval people thought that the earth was flat… But now, why did the false accounts of Letronne and Irving become melded and then, as early as the 1860s, begin to be served up in schools and in schoolbooks as the solemn truth? The answer is that the falsehood about the spherical earth became a colorful and unforgettable part of a larger falsehood: the falsehood of the eternal war between science (good) and religion (bad) throughout Western history… The reason for promoting both the specific lie about the sphericity of the earth and the general lie that religion and science are in natural and eternal conflict in Western society, is to defend Darwinism. The answer is really only slightly more complicated than that bald statement. The flat-earth lie was ammunition against the creationists. The argument was simple and powerful, if not elegant: “Look how stupid these Christians are. They are always getting in the way of science and progress.”

— J.B. Russell, ‘The Myth of the Flat Earth’ (1997) at The American Scientific Affiliation">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+must+first+be+reiterated+that+with+extraordinary+few+exceptions+no+educated+person+in+the+history+of+Western+Civilization+from+the+third+century+B.C.+onward+believed+that+the+earth+was+flat.+A+round+earth+appears+at+least+as+early+as+the+sixth+century+BC+with+Pythagoras%2C+who+was+followed+by+Aristotle%2C+Euclid%2C+and+Aristarchus%2C+among+others+in+observing+that+the+earth+was+a+sphere.+Although+there+were+a+few+dissenters%E2%80%93Leukippos+and+Demokritos+for+example%E2%80%93by+the+time+of+Eratosthenes+%283+c.+BC%29%2C+followed+by+Crates%282+c.+BC%29%2C+Strabo+%283+c.+BC%29%2C+and+Ptolemy+%28first+c.+AD%29%2C+the+sphericity+of+the+earth+was+accepted+by+all+educated+Greeks+and+Romans.+Nor+did+this+situation+change+with+the+advent+of+Christianity.+A+few%C3%B3at+least+two+and+at+most+five%E2%80%93early+Christian+fathers+denied+the+spherically+of+earth+by+mistakenly+taking+passages+such+as+Ps.+104%3A2-3+as+geographical+rather+than+metaphorical+statements.+On+the+other+side+tens+of+thousands+of+Christian+theologians%2C+poets%2C+artists%2C+and+scientists+took+the+spherical+view+throughout+the+early%2C+medieval%2C+and+modern+church%E2%80%A6+No+one+before+the+1830s+believed+that+medieval+people+thought+that+the+earth+was+flat%E2%80%A6+But+now%2C+why+did+the+false+accounts+of+Letronne+and+Irving+become+melded+and+then%2C+as+early+as+the+1860s%2C+begin+to+be+served+up+in+schools+and+in+schoolbooks+as+the+solemn+truth%3F+The+answer+is+that+the+falsehood+about+the+spherical+earth+became+a+colorful+and+unforgettable+part+of+a+larger+falsehood%3A+the+falsehood+of+the+eternal+war+between+science+%28good%29+and+religion+%28bad%29+throughout+Western+history%E2%80%A6+The+reason+for+promoting+both+the+specific+lie+about+the+sphericity+of+the+earth+and+the+general+lie+that+religion+and+science+are+in+natural+and+eternal+conflict+in+Western+society%2C+is+to+defend+Darwinism.+The+answer+is+really+only+slightly+more+complicated+than+that+bald+statement.+The+flat-earth+lie+was+ammunition+against+the+creationists.+The+argument+was+simple+and+powerful%2C+if+not+elegant%3A+%E2%80%9CLook+how+stupid+these+Christians+are.+They+are+always+getting+in+the+way+of+science+and+progress.%E2%80%9D%0A%0A%E2%80%94+J.B.+Russell%2C+%E2%80%98The+Myth+of+the+Flat+Earth%E2%80%99+%281997%29+at+The+American+Scientific+Affiliation&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf633d9870.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bf633d9870.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/contra-a-flat-earth/#:~:text=It%20must%20first%20be%20reiterated%20that,the%20way%20of%20science%20and%20progress&amp;text=It%20must%20first%20be%20reiterated%20that%20with%20extraordinary&amp;text=getting%20in%20the%20way%20of%20science%20and%20progress" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

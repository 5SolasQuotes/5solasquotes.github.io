<blockquote><p>the most comprehensive justification of resistance (which summed up two years of resistance theorizing).” – John Sanderson Goodwin, John – Right &amp; Might Well Met, 1649, this is a selection from the work, being 21 paragraphs. This treatise vindicates the British Parliament and its army against charges of rebellion in its resistance to King Charles I. Milton, John – The Tenure of Kings &amp; Magistrates: proving that it is lawful, and hath been held so through the ages, for any, who have the Power, to call to account a Tyrant, or wicked King, and after due conviction, to depose, and put him to death; if the ordinary MAGISTRATE have neglected, or deny’d to do it. And that they, who of late so much blame Deposing, are the Men that did it themselves (1650) For an introduction and background info, see here. Cotton, John – On Limitation of Government, 1655, beginning on p. 173, 3 pp. from Edmund Morgan’s Puritan Political Ideas: 1558-1794 Anon. – The Mystery of Magistracy Unveiled, or God’s Ordinance of Magistracy Asserted, Cleared and Vindicated from Heathenish Dominion, Tyrannous &amp; Anti-Christian Usurpation, Despisers of Dignities &amp; Contemners of Authorities (London, 1663) ch. 12, ‘Of the Judgment &amp; Curse Attending No Rule, or an Evil Ruler’ ch. 13, ‘Of the People’s Duty Under Wicked Rulers, Both Towards God &amp; Them’ This section contains numerous historic, reformed quotes on Rom. 13 and resistance to tyranny. Baxter, Richard The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued (1683; London: Parkhurst, 1689) ch. 39, ‘Of Subscribing and swearing against the position as traiterous, of taking arms by the King’s authority against those that are commissioned by him in pursuance of such commission’, pp. 134-45 Consenting to the proposition in the chapter’s title was required for being a minister in the post-1662 Anglican Church. Baxter argues against it. ch. 54, ‘Of swearing an abhorrence of taking arms against any commissionated by the king’, pp. 198-99 Shields, Alexander – A Hind Let Loose (1687) 878 pp. See particularly Part III, Head II, “Concerning Owning a Tyrant’s Authority” and Head V, “Defensive Arms Vindicated.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fe2728c0b7" data-kw="">
<blockquote><p>After the Restoration of the English monarchy in the person of Charles II in 1660, the new king and his first Parliament declared the anniversary of the beheading of his father Charles I (January 30, 1649) a religious holiday with a special commemoration in the Book of Common Prayer, naming the late monarch a saint and martyr. This holiday was not generally celebrated in Massachusetts until the emergence of several Anglican churches there in the early eighteenth century. In 1750, Jonathan Mayhew, the twenty-nine-year old pastor of the West (Congregational) Church in Boston, took occasion to dispute the first Charles’ credentials to saintship, martyrdom, and even his kingship as well. Mayhew’s Discourse is an extremely interesting bridge between the radical Puritan past and the American Revolutionary future. His sermon contains the language, rhetoric, symbolism, typology, and religious and philosophical arguments that would be used extensively in the agitation for American independence twenty-five years later. Mayhew (1720-1766) would subsequently take a leading role in the resistance to the Stamp Act of 1765, and his sermons and writings had an enormous impact on the evolution of New England Puritanism into American republican ideology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-mayhew.html">Jonathan Mayhew</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse Concerning Unlimited Submission &amp; Non-Resistance to the Higher Powers: With some Reflections on the Resistance made to King Charles I</cite>, (1750) 55 pp. Mayhew was liberal both in his religion and politics. This famous sermon was credited by John Adams with being greatly influential in leading to the commencement of the War of American Independence. | The University of Nebraska abstract:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>And hereupon the question is wont to be demanded: Whether an evil, that is, a tyrannical magistrate be of God or no? To this I answer, that God is the author of good and not of evil. For God by nature is good, and all his purposes are good, being directed to the health and preservation, not to the destruction, of us men. Therefore the good and healthful ordaining of the magistrate, without all doubt, is of God Himself, who is the author of all goodness. But here it is requisite, that we make a difference between the office which is the good ordinance of God, and the evil person that does not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that comes of other causes, and the fault thereof is in the men and persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupts the ways of God, and by his own fault and naughtiness transgresses God’s ordinance, so far, that he does worthily deserve the name of devilish power, and not divine authority;-(we have an example hereof in the magistrate of Jerusalem: for although he were able to refer the beginning of his power by degrees unto Moses, and so unto God Himself who did ordain it; yet, for because he takes the Savior in the garden and binds Him, to his servants it is said, ‘Ye are come out as it were to a thief with swords and staves; when I was daily with you in the temple, ye stretched not forth your hands against me; but this is even your hour, and the power of darkness.’ Lo, here he calls the ordinary magistrate the power of the devil, when he abuses his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office. Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil…</p></blockquote>

<blockquote><p>Thirdly, it is cleared in this discourse that those who have gotten to be powers (though by force) yet ought to give justice to those whose government they have undertaken. And again, that the people may lawfully demand it. But is it possible that one or a few persons in supreme power can distribute justice to a whole nation without subordinate agents? So that to say, ‘None may lawfully act under the supreme power in distributing of justice, and government,’ were to say upon the matter that he should give no justice, and that the people should have no justice at all. And then how absurd is it to teach that the people may lawfully seek justice of him which they cannot receive? and that he is bound to give justice, but none are allowed by whom he may give it? Fourthly, this doctrine of not acting is the very doctrine of levelling. For when no man may act to give justice, may not every man take freely from his neighbor what he list, and so level the rich with the poor? unless this make it unlikely, because worse than levelling, that those who have most force will have most; yea some all, and others nothing; and so to avoid acting under a supposed tyrannical government unto justice and order; there shall be tyrants in every place or parish, who shall act to disorder and oppression, and no property, justice, nor government at all left amongst us. And surely I think David out of his love to Israel would not have wished such an estate to Israel under Absalom, had he the whole in possession and himself no force on foot to recover it; nor would he have desired such an unsettlement to procure his settlement. And hence arises that which they call an interpretative consent of the people; because it is understood and supposed that every rational man does consent, that there should be order, property and right given to every member of a commonwealth under a tyrant, rather than all to be under confusion oppression, robberies and murders. Fifthly, how could Ezra and Nehemiah justify their acting under the Persian monarch, who had no right to the crown of Judah either by blood or just conquest (Ezra 7:25)? Yet Ezra was authorized by him to set magistrates, fine and imprison and put to death (Ezra 10:7-8); And he exercises authority, in making the people of Israel to swear and to enter into a covenant, and in sending forth a proclamation to all the children of the captivity, that they should gather themselves together to Jerusalem; And that whosoever would not come within three days, all his substance should be forfeited. Nehemiah also acts as governor, and rebukes the nobles and rulers and sets a great assembly against them because of their usury. He also called the priests and took an oath to perform the promise of leaving that usury (Neh. 5. •. etc.). He acknowledges also that he was governor there about twelve years, and he gave his brother Hanani and Hanaiah ruler of the palace charge over Jerusalem (Neh. 7:2). So he did both act himself and others acted under him. We find also that at that time there were rulers of the people that dwelt at Jerusalem, and Nehemiah contended with the rulers and nobles, made treasurers, commanded the gates to be shut before the Sabbath, threatened to lay hands on the merchants that lay at the gates, smote certain of the Jews and plucked off their hair because having married wives of Ashdod, their children spake half in the language of Ashdod (Neh. 13). Sixthly, let us hear what before these times and before our case was in being hath been taught in point of acting; and upon what grounds it has been approved. An author eminently learned and skillful in the doctrine of lawgiving says thus: ‘No man may punish or condemn another even with a just punishment, except he have public power, which a tyrant cannot give. But in this there must be a consideration or subdistinction. For in rigor this is true as to the tyrant’s part; yet it so happens that the commonwealth because it cannot resist him, does tolerate him, and suffers itself to be governed by him; and does tacitly consent, and will that justice be administered by him, for the reason already touched, because it is a less evil to be governed by him, than altogether to want just coaction and direction; and then it shall not be a sin to obey even in the things aforesaid, because the consent of the commonwealth does supply the defect of the tyrant’s power.’ (Suarez, De Leg., bk. 3, ch. 10) Another thus: ‘That his sentences are valid, is proved. Because his sentences, and just commands although they have not force from a tyrannical power, yet they have it from elsewhere. First, and inchoatively from the law of nature, which such a state of things being supposed, does dictate that obedience must be given for the common good, otherwise all will be full of thefts and robberies. Secondly, and completely from the commonwealth; and that either because while that state endures, it gives authority to him by a tacit consent, while it will’s that he administer justice, and use his usurped office in a due manner, or rather because it does tacitly approve his commands, and acts being agreeable to the laws and common good, and will’s that his just sentences, whereby the suites of the people are decided, and the guilty are punished, shall be valid and bind the subjects; for except they were valid and did bind, no man would obey, but only in show but every man would secretly do the contrary with a great inconvenience to the commonwealth. Now the commonwealth may give this force to the sentences, and acts of a tyrant, because it is superior to all single persons, though it be oppressed with tyranny, and may account the just sentence of a tyrant as its own.’ (Lessius, De Justitia &amp; Jure, bk. 2, ch. 25, Dubitat. 9) Thou wilt ask whether a tyrant do sin the sin of murder, and be bound to restitution, if he put to death guilty persons, or deprive them of their goods according to law? I answer negatively; because the commonwealth does tacitly give him authority hereunto, while it does consent and desire that this should be done by him. Thus is the authority of acting in this case grounded upon a tacit or implied consent, which consent is the very dictate of nature or common reason, because it is better to have some justice than none at all, some coercive power and government than that all be left to disorder, violence and confusion.</p></blockquote>

<blockquote><p>Mr. Ashcam… lays down four cases wherein he says subjects are freed from their sworn allegiance. His three first (viz: 1. If a prince abandon. 2. If he alienate. 3. If Nero-like through mad fury or folly, he seek in an hostile way the destruction of his whole kingdom) will I presume be taken not to concern our case in hand; the fourth possibly may be judged applicable to it… Fourthly, (says he) if the prince have part of the supreme right, and the people the other part, then notwithstanding an oath of allegiance to him, he may be opposed if he invade the other part of supreme right… And in the next section he says of all those four cases, and therefore of this, that they show how we are absolved in our own consciences from all oath and contract when one party forfeits his conditions first. The defensive opposing of a prince, invading his compeers’ part by the party invaded where the supreme right is so shared (supposing the oath of allegiance to be cautioned according to that sharing), I shall not dispute…</p></blockquote>

— Edward Gee, An Exercitation concerning Usurped Powers… (London, 1650), ch. 4, pp. 47-48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CMr.+Ashcam%E2%80%A6+lays+down+four+cases+wherein+he+says+subjects+are+freed+from+their+sworn+allegiance.+His+three+first+%28viz%3A+1.+If+a+prince+abandon.+2.+If+he+alienate.+3.+If+Nero-like+through+mad+fury+or+folly%2C+he+seek+in+an+hostile+way+the+destruction+of+his+whole+kingdom%29+will+I+presume+be+taken+not+to+concern+our+case+in+hand%3B+the+fourth+possibly+may+be+judged+applicable+to+it%E2%80%A6+Fourthly%2C+%28says+he%29+if+the+prince+have+part+of+the+supreme+right%2C+and+the+people+the+other+part%2C+then+notwithstanding+an+oath+of+allegiance+to+him%2C+he+may+be+opposed+if+he+invade+the+other+part+of+supreme+right%E2%80%A6+And+in+the+next+section+he+says+of+all+those+four+cases%2C+and+therefore+of+this%2C+that+they+show+how+we+are+absolved+in+our+own+consciences+from+all+oath+and+contract+when+one+party+forfeits+his+conditions+first.+The+defensive+opposing+of+a+prince%2C+invading+his+compeers%E2%80%99+part+by+the+party+invaded+where+the+supreme+right+is+so+shared+%28supposing+the+oath+of+allegiance+to+be+cautioned+according+to+that+sharing%29%2C+I+shall+not+dispute%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Edward+Gee%2C+An+Exercitation+concerning+Usurped+Powers%E2%80%A6+%28London%2C+1650%29%2C+ch.+4%2C+pp.+47-48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe77df7bdf0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e77df7bdf0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=lays%20down%20four%20cases%20wherein%20he,that%20sharing%29%2C%20I%20shall%20not%20dispute&amp;text=lays%20down%20four%20cases%20wherein%20he%20says%20subjects&amp;text=according%20to%20that%20sharing%29%2C%20I%20shall%20not%20dispute" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

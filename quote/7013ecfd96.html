<main class="wrap"><figure class="quote" id="q-7013ecfd96" data-kw="">
<blockquote><p>We believe therefore, the duty of a godly magistrate is… Sixthly, to carry a special care to the goods of the church, that they may be bestowed on the right, that is on the true godly, uses; and that all necessary things be supplied to the Church and to the ministers thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/giralamo-zanchi.html">Giralamo Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Body of Christian Religion (d. 1590; London, 1659) | ch. 26, ‘Of a Magistrate’, doctrine 6, ‘The Explication of this Opinion in Particulars’</cite>, pp. 367-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-034818ef77" data-kw="">
<blockquote><p>Certainly in Christ’s time both liturgies by forms and also prayers by habit were used [Lk. 18:11-13]. And yet Christ never interposed in the controversy, so as to condemn the one or the other. He condemns the Pharisees for making long prayers to cover their devouring widows’ houses, and for their praying to be seen of men: But whether their prayers were a liturgy and set form, or whether they were extemporary, He takes no notice, as telling us that He condemned neither! (And it’s likely the Pharisees’ long liturgy was in many things worse than ours, though the psalms were a great part of it: and yet Christ and his apostles oft joined with them, and never condemned them). Nay as far as I can find, the Pharisees and other Jews were not in this so blind and quarrelsome as we; nor never made a controversy of it, nor ever presumed to condemn either liturgies or prayers by habit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1 | Direction 32</cite>, p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-c8c613f9fd" data-kw="">
<blockquote><p>Mr. [Thomas] Hooker [a congregationalist]: ‘It is not warrantable that one not in office (says Mr. Rutherford), but a private Christian, should pray, exhort, preside in the framing of a Church and in ordaining of pastors. [Rutherford’s] Answer: The practice of the Church of Scotland will say to this, we allow not public prophesying of unofficed men.’ (Margin Note: Some chief and ordinary church-prophesying and church-praying is given to the unofficed church, as to the only kindly subject by Mr. Hooker: Mr. H., Survey, part 1, ch. 8, p. 52.) [Rutherford’s] Answer: 1. Here is ordinary prophesying, such as that of the apostle Peter at the calling of Matthias (Acts 1[:15-22]) and public Church-prophesying and praying, such as is by the prophets or presbytery of the Church of Antioch, Acts 13[:3]. when Paul and Barnabas were called to be apostles to the gentiles…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rutherford.html">Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Survey of the Survey of that Sum of Church Discipline</cite>, p. 171</span></figcaption>

</figure><figure class="quote" id="q-3bd4952534" data-kw="">
<blockquote><p>But how can we imagine that many thousands [of Jerusalem Christians] could in one meeting communicate at one Table in the Lord’s Supper, and that ordinarily? 1. What voice could reach to so many thousands, as they did grow unto?… 3. Can we believe that seeing congregational meetings of fewer, and that in private houses, was less obnoxious to the indignation of authority, than meeting in the Temple, as is most evident, Acts 4:1-2; and seeing [that] the apostles had liberty to meet, Acts 5:26, [can we believe] that they would draw the first mold of the Christian visible-Church after the pattern of a convention [i.e. all gathering unto one place] most unfit, yea impossible for attaining the intended end, to wit, edification, especially not being compelled thereunto by an extrinsical necessity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 1</cite>, p. 428</span></figcaption>

<blockquote><p>7. Again, it is a strong argument in favour of infant baptism, that we find the principle of family baptism again and again adopted in the apostolic age.

We are told, by men learned in Jewish antiquities, that, under the Old Testament economy, it was customary, when proselytes to Judaism were gained from the surrounding nations, that all the children of a family were invariably admitted to membership in the church with their parents; and on the faith of their parents; that all the males, children and adults, were circumcised, and the whole family, male and female, baptized, and incorporated with the community of God’s covenanted people.

Accordingly, when we examine the New Testament history, we find that under the ministry of the apostles, who were all native Jews, and had, of course, been long accustomed to this practice, the same principle of receiving and baptizing families on the faith of the parents, was most evidently adopted and acted upon in a very striking manner. When “the heart of Lydia was opened, so that she attended to the things which were spoken by Paul,” we are told that “she was baptized and her household” (Acts 16:14-15). When the jailor at Philippi believed, he was baptized, “he and all his, straightway” (Acts 16:33). Thus also we read of “the household of Stephanas” being baptized (1 Cor. 1:16).

Now, though we are not certain that there were young children in any of these families, it is highly probable there were. At any rate, the great principle of family baptism of receiving all the younger members of households on the faith of their domestic head, seems to be plainly and decisively established. This furnishes ground on which the advocate of infant baptism may stand with unwavering confidence.

And here let me ask, was it ever known that a case of family baptism occurred under the direction of a Baptist minister? Was it ever known to be recorded, or to have happened, that when, under the influence of Baptist ministrations, the parents of large families were hopefully converted, they were baptized, they and all theirs straightway? There is no risk in asserting that such a case was never heard of. And why? Evidently, because our Baptist brethren do not act in this matter upon the principles laid down in the New Testament, and which regulated the primitive Christians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Infant Baptism Scriptural and Reasonable: And Baptism by Sprinkling or Affusion the Most Suitable and Edifying Mode: In Four Discourses</cite>, (Philadelphia: Joseph Whetman, 1835), pp 23-25.</span></figcaption>

<blockquote><p>8th Distinction… yet will it not follow that these few fundamentals [such as in the Apostles’ Creed] received by all Christians, Papists, Lutherans, Arians, Verstians, Sabellians, Macedonians, Nestorians, Eutychanes, Socinians, Anabaptists, Treithitae, Antitrinitarii (for all these be Christians and validly baptized) do essentially constitute a true Church, and a true Religion. Because all Christians agree that the Old and New Testament is the truth and Word of God, and the whole faith of Christian Religion is to be found in the Old Testament, acknowledged both by Jews and Christians; for that is not the Word of God indeed in the Old Testament which the Jews say is the Word of God in the Old Testament. Yea the Old and New Testament, and these few uncontroverted points received universally by all Christians, are not God’s Word as all these Christians expone them, but [rather are] the dreams and fancies of the Jews saying that the Old Testament teaches that Christ the Messiah is not yet come in the flesh, the Treithitae [Tritheists] say there be three Gods, yet are the Treithitae Christians in the sense of Doctor [Christopher] Potter [a Laudian Anglican]: So that one principal as that, There is one God, and Christ is God and man, and God is only to be adored, not one of these are uncontraverted, in [the] respect [that] every society of sectaries have contrary expositions upon these common fundamentals, and so [they have] contrary religions. Who doubts but all Christians will subscribe and swear with us Protestants the Apostolic Creed, but will it follow that all Christians are of one true Religion, and do believe the same fundamentals? [2.] Now these fundamentals are the object of faith according as they signify things. To us and to the Treithitae this first article, ‘I believe in God’, as I conceive, does not signify one and the same thing; now join this, ‘I believe in God’ with holy obedience, as we expone it, and as the Treithitae expone it: it could never be a step to everlasting salvation; for it should have this meaning: ‘I believe there is one only true God, and that there be also three Gods,’ and what kind of obedience joined with a faith made up of contradictions can be available to salvation? 3. One general catechism and confession of faith made up of the commonly received and agreed upon fundamentals would not make us nearer peace, though all Christians should swear and subscribe this common Christian catechism, no more than if they should swear and subscribe the Old and New Testament, as all Christians will do, and this day do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2, pp. 228-9</span></figcaption>

<blockquote><p>…for no doubt God in his decree and secret intention may intend, by the ministry of his servants, the true and real conversion of many hypocrites, such as are no less unconverted, then [Simon] Magus and Demas; for He hath mercy, on whom He will, Rom. 9:17, but according to this way, ‘these who are converts in the judgment of charity’ (he [Hooker] should say only converts in that judgment) are not according to God’s revealed intention and approving will or command taken in by pastors, that they may be really converted: for God giveth, in no sort, this command to pastors in his revealed intention. [Hooker:] ‘See that ye admit no fools to wisdom’s table or within wisdom’s house, but such only as you believe in charity are real converts, and both called and chosen,’ contrary to Prov. 9:1-4; Mt. 22:8-9,14. Therefore [it would follow on Hooker’s terms], by my revealed intention and command you are not to intend their conversion, but to presuppose that they were already converted: otherwise, if the Lord by his revealed intention and command will have such hypocrites who are but nominal saints, brought in that they may be truly converted, there must follow two contradictory intentions revealed in God: for the Lord’s command to pastors is [would be] ‘I command you to preach to these who are converts in the judgment of charity, that upon my intention, they may be truly converted’; and also: ‘I command you, my pastors, preach to no Church members, that upon my intention, they may be converted, because you are not to preach to any as pastors, but to such as ye know are already converted, according to my revealed intention and will.’ M. Hooker seeing this addeth: ‘But if M. Rutherford mean that the Church doeth of purpose receive them into the Church to be converted, then it is cross to his own tenet, and a person may be received to the seals of the covenant, who doeth not notify that he hath faith, nay the Church may receive them to the seals, whom she knoweth hath no right to the seals, for she knoweth they are not invisible members, which in Mr. Rutherford’s judgment only giveth them right.’ [Rutherford’s] Answer: It is not cross to my tenet, that a person, such as Demas and Magus may be received to the seals, and yet they doe not notify [that] they have saving faith and internal conversion, for my tenet is that the Church can only judge of visible walking and profession in point of admission or not admission to seals, and in that point the Church hath nothing to do to judge whether they have faith-saving or not; none can partake savingly of the seals for their own personal salvation and without sin, but these only who have saving faith, but the Church may admit without sin multitudes, who eat and drink their own damnation, 1 Cor. 11:26-27, and yet pass no sentence of signs notifying faith or no faith, internal conversion or no internal conversion upon them.</p></blockquote>

</figure><figure class="quote" id="q-2d30300f87" data-kw="">
<blockquote><p>24. Thus the Lord, when he chose Abraham for himself, did not commence with circumcision, in the meanwhile concealing what he meant by that sign, but first announced that He intended to make a covenant with him, and, after his faith in the promise, made him partaker of the sacrament. Why does the sacrament come after faith in Abraham, and precede all intelligence in his son Isaac? It is right that he who, in adult age, is admitted to the fellowship of a covenant by one from whom he had hitherto been alienated, should previously learn its conditions; but it is not so with the infant born to him. He, according to the terms of the promise, is included in the promise by hereditary right from his mother’s womb. Or, to state the matter more briefly and more clearly. If the children of believers, without the help of understanding, are partakers of the covenant, there is no reason why they should be denied the sign, because they are unable to swear to its stipulations. This undoubtedly is the reason why the Lord sometimes declares that the children born to the Israelites are begotten and born to Him (Eze. 16:20; 23:37) For He undoubtedly gives the place of sons to the children of those to whose seed He has promised that He will be a Father. But the child descended from unbelieving parents is deemed an alien to the covenant until he is united to God by faith. Hence, it is not strange that the sign is withheld when the thing signified would be vain and fallacious. In that view, Paul says that the gentiles, so long as they were plunged in idolatry, were strangers to the covenant (Eph. 2:11). The whole matter may, if I mistake not, be thus briefly and clearly expounded: Those who, in adult age, embrace the faith of Christ, having hitherto been aliens from the covenant, are not to receive the sign of baptism without previous faith and repentance. These alone can give them access to the fellowship of the covenant, whereas children, deriving their origin from Christians, as they are immediately on their birth received by God as heirs of the covenant, are also to be admitted to baptism. To this we must refer the narrative of the evangelist, that those who were baptized by John confessed their sins (Mt. 3:6). This example, we hold, ought to be observed in the present day. Were a Turk to offer himself for baptism, we would not at once perform the rite without receiving a confession which was satisfactory to the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 3, bk. 4, ch. 16, pp. 373-74</span></figcaption>

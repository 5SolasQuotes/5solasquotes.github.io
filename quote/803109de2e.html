<blockquote><p>1. Whereas in the first general Proposition we profess ‘not to addict ourselves to parties, but to practice unanimously those known truths that the sober and godly of each party are agreed in,’ we mean only those parties who acknowledge a discipline, and are so ‘sober’ as to disclaim those principles which are utterly inconsistent with the healing of our breaches and the peace and union of the Churches. Particularly we mean the presbyterians, Independants and episcopal who are moderate and judicious. We mean not any Seekers that disclaim [Church] discipline; nor Papists; nor Popish episcopal divines, who will have all the world come to the Romish polity or else they must have no peace. But it is only the Protestant episcopal divines whose principles I take to be consistent with our Propositions: And if there be any other party so sober as to depart no further from the ways of peace, it is such that we mean. But if it had been our intent to have laid by all that any party will controvert, we should have agreed on nothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘An Explication of some Passages in the foregoing Propositions’, pp. 2-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18d4d3a7ca" data-kw="">
<blockquote><p>Both of you, take heed ye bring not your differences any more unto public, nor otherwise put them among the people: Keep them amongst yourselves, where they may abide with less hurt, Rom. 14:1 &amp; 22. Considering the mischiefs of evulgating them, it will evidently appear happy to bury them in silence or oblivion. If ye interest and engage the people therein, then are ye gone; and beside other inconvenients thereof, ye shall not get leave to unite again without their consent, which may be hard to gain. How long shall any affect popularity, and thereby subject their ministerial authority to the humors of men and women for drawing them to their side to strengthen their party? by which means people are taught to domineer over ministers and may fore-run you, and cast at yourselves next when ye begin to sit up and not go along with all their notions and inclinations. Ye may perhaps find no small difficulty to regulate and bridle their humors, being once aloft, Fortur equis auriga, non audit currus habenas. Moreover, what do ye by filling people’s heads with such entangling controversies but divert their minds and take them off the main thing? and turn religion into factions and debates? and wear them out of heart-tenderness, real exercise of conscience and the serious study of universal holiness? If any make it their work to kindle in religious hearers a factious, opinionative zeal, you may thereby trouble their heads, not better their hearts and may sooner make them firebrands to burn down the peace, purity and order of the Church than living polished stones for the New Jerusalem. Yea, likely you may unhinge them so as to tempt them to cast at all ministers, at all religion, and turn either atheists or Seekers and sectarians, as woeful experience has many times proved, even in our own days; so small a friend to the promoting of piety, is division. Avoid then carefully to discover your intestine jars and animosities before the people in public or private. Bear not your nakedness to their eyes. Teach them not to meddle with things above their sphere and beyond their line (Ps. 131:1-2) and turn them not aside unto vain janglings, Tit. 3:9; 2 Tim. 2:17-18; 1 Tim. 1:6-7; 4:7; 6:4-5. Make it rather your work to edify them in the substantials of religion and vitals of piety, such as faith and repentance, humility, sobriety, mortification, self-denial, love and new obedience, etc. How much better were it to fire their hearts with the love of God and man than to heat their heads with puzzling debates, which do but perplex, not edify, and are far out of the way of their salvation or duty, and does not at all concern their practice. What profit reap they by being inveighed into such quicksands? We have seen many unfleeced of their wool, yea torn in their flesh, by being involved in such thorns, but never any advantaged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London, 1681), pp. 152-54</span></figcaption>

el="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-17d93318c3" data-kw="">
<blockquote><p>But tell me now your opinion of another matter, and that is concerning liberty of conscience, and toleration of heretics and sectaries, for which there are so many books written of late… This question about the toleration of those whose way is different from the common rule which shall be established, must be both stated and resolved, cum grano salis [with a grain of salt]. We must remember to distinguish persons from corporations or Churches, and both these from errors. Again, to distinguish persons, whether godly and gracious, or loose and libertine, whether moderate and peaceable, or factious and turbulent; whether such as have deserved well of the public, or such as have done either no service or a disservice. To distinguish corporation, whether the question be of such only as have a present existence, or of all who shall join to such a way afterward. To distinguish errors, whether practical or doctrinal only, whether fundamental, or circa-fundamental, or neither of the two. To distinguish toleration, whether absolute, or hypothetical and conditional, whether anywhere, or in some few certain places only, whether indefinite and general, or limited and bounded, and if bounded, how far and how much: Whether such toleration as may stand with the Solemn League and Covenant, or such as is inconsistent therewith; whether such as is profitable for the public peace, or such as is apparently destructive thereto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Late Dialogue Betwixt a Civilian &amp; a Divine Concerning the Present Condition of the Church of England</cite>, … (London, 1644), pp. 30-31</span></figcaption>

<blockquote><p>…the business about Easter and ceremonies… ordinarily such debates pretend some lawfulness or unlawfulness in the thing contended for and are to be counted amongst the jangling debates that the men of God are to eschew… 1. That, as there is a necessity of suffering some difference in doctrine, so is there also a necessity to bear with some differences in circumstances in the external manner of worship, etc. and men would not soon offend at every difference, nor be displeased if it proceed not from affectation of singularity, unfaithfulness or some other corrupt rise. And we will find great condescendency in the greatest men both of old and late in things that are not sinful in themselves for keeping of union in the Church: and thus far the apostles’ practice of becoming all things to all will warrant. Zanchius in an epistle to this purpose gives both many examples of and reasons for this. 2… the condemning of the way and manner used by others as having some great absurdity in it, and the pressing of their way, even in circumstances, upon others; These and such things are to be eschewed: and so indeed there is no way to peace in these things but to forbear; for it is more easy to forbear some new thing than to make others alter what is old, except there be some reason in the matter to move to this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh: Higgins, 1659) | pt. 4, ch. 13, pp. 368–69</span></figcaption>

<blockquote><p>The author [Baxter] thought it not unfit here to annex the description of that order and discipline which is exercised by him, with his assistant fellow-pastors, in the parish-church of Kidderminster, in Association with many pastors of those parts who have agreed to exercise so much of the ministerial office as by the consent of the episcopal, presbyterian and congregational [parties] belongs to them. Which, being published:

1. May prevent men’s injurious misreports of our associations and discipline, which they may be drawn to by fallacious fame.

2. And may be an example for those churches that by the magistrates are left at liberty to worship God in that communion and order which they judge most agreeable to the Word of God and the universal consent and practice of the primitive Church. .

I. We are willing to teach all in our parish, the doctrine of life, that are willing to learn: and desire them all to hear the Word publicly preached and to come to us to be catechized or instructed.

II. We own all those as visible Christians and members of the universal Church that make a credible profession of Christianity and destroy it not by heresy or ungodly lives.

III. So many of these as also consent to hold communion with this church as members of it, submitting to the ministers and discipline of Christ, we shall esteem our flock and special charge, and faithfully perform the duties of our office for their good, as we are able.

IV. We desire that all the youth of the parish will learn the principles of the Christian religion: and as soon as they understand it, and are heartily resolved to give up themselves to God in Christ through the Spirit, and to lead a holy life, that they will come and acquaint us with their faith and resolution; and before the Church will make a solemn profession thereof, and give up themselves to God in the personal owning their baptismal Covenant; either reciting the foregoing creed or Profession, or, if they are unfit for public speaking, by consenting when we propound it to them, or by any other fit expressions. That so we may publicly pray for their confirmation; and if they consent also to hold communion with this church, we may know them as our charge and register their names.

V. Those parishioners that desire us to baptize their children, or to be themselves admitted to the Lord’s Supper, and are not members of this church (because they will not), we desire to come to us, some days before that so we may be satisfied of their faith and life: And if they seem true Christians, and either bring a certificate that they are members of any other church, with (which we are to hold Communion, or show that it is not from ungodliness that they refuse to live under order and discipline, we shall baptize their children, and occasionally admit them to our communion. But if they are scandalous, we shall require them first to profess their serious repentance: And if they return to scandal, we shall after stay till we see their reformation (or of one of the parents in case of baptism).

VI. If any member of this Church do differ from us about the gesture in the Lord’s Supper (or any such circumstance) we desire them first to come to us and hear our reasons: and if we cannot satisfy them, we will not hinder them from receiving it in any decent gesture they desire.

VII. All members of the church must ordinarily hold communion with it in the Lord’s Supper and all ordinances: and if a brother grossly offend, they must orderly and prudently admonish him; and if he hear them not, tell the church [Mt. 18].

VIII. Once a month we have a meeting of the magistrates, ministers, deacons and above twenty persons chosen annually by the church, as their trustees or deputies: Here the offenders must be accused, and heard, and dealt with before the case be opened in the church. And any that are justly offended with any member, may have church-justice: the magistrates’ presence being only ad melius esse [to the better well-being] and the chosen trustees or deputies being no ecclesiastical officers, nor pretending to divine institution as such: but only the fittest of the people chosen to do those things which belong to the people (who cannot all so frequently meet) and having no authoritative ruling votes.

IX. Those that repent not upon public admonition must be cast out of our communion and avoided as heathens: But those that are penitent, must be absolved, and lovingly received.

X. If any of our people be offended at anything in our doctrine or life, we desire them before they vent their offense behind our backs, to come and lovingly tell it us, and hear us speak. And if we do not satisfy them, we desire them to open the matter before the ministers of this Association, who are here assembled every month. And we shall before them be responsible for our doctrine, our administrations and our lives. (As we are also willing to be to the magistrate, who only has the power of the sword, even over the pastors of the church, and whom in all things lawful we must obey, and not resist.)</p></blockquote>

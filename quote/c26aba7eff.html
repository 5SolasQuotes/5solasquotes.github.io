</figure><figure class="quote" id="q-e3840a983d" data-kw="">
<blockquote><p>I. God has planted two principles in the mind of man: the avoidance of evil and the desire of good; the irascible (to thymikon) and concupiscible appetite (to epithymetikon). Viewed in the genus of being and physically, these are neither good nor bad, but mean and indifferent, drawing all their moral goodness and evil from the quality of the objects about which they are exercised.</p></blockquote>

<blockquote><p>We therefore come to show the properties of this righteousness and holiness that was thus fixed in Adam’s heart: 1. It’s called original, to difference it from actual holiness; as we call it ‘original sin’, to distinguish it from actual: and therefore the learned call it original, partly in regard of itself, because it was the first righteousness; partly because of Adam, who had it as soon as he was created. As the schools say of original sin, Quam primum originatur homo, originatur itidem peccatum; so we may of Adam in his righteousness, In ortu virtus, as the father said, In ortu vitium est: and partly in regard of his posterity, for it should have been propagated to them. 2. Another property of this righteousness is that it is universal, comprehending the rectitude of all the parts and faculties of the soul: so that Adam was, for his soul, as Absalom is said to be comely for his body, from the head to the foot no blemish at all: so that this was not a perfection in one part only, but all over; as our corruption makes us, as he said of the martyr wounded in many places, totum vulnus. 3. It was harmonious: there was not only rectitude in every part, but a sweet correspondency one with the other; there was no rebellion or fight between the inferiour appetite and the understanding. Therefore some learned men say, This righteousness is not to be conceived as an aggregation of several habits, but as an inward rectitude of all faculties: Even as the exact temperament of the body is not from any superadded habit, but from the natural constitution of the parts. 4. This righteousness and holiness, it was a perfection due to Adam, supposing the end to which God made him. If God required obedience of Adam to keep the law, and happinesse thereupon, it was due not by way of merit, but condecency to God’s goodness, to furnish him with abilities to perform it; as the soul of Adam was a due to him, supposing the end for which God made him. Indeed, now it’s of grace to us, and in a far different consideration made ours, because we lost it. Lastly, this was to be a propagated righteousness; for, as it is to be proved hereafter, God did all this in a way of covenant with Adam, as a public person: And howsoever every thing that Adam did personally was not made ours, (we did not eat in his eating, nor drink in his drinking, we did not dress the garden in his dressing of it) yet that which he did federally, as one in convenant with God, that is made ours; so his sin and misery is made ours, then his righteousness and happiness: As it is now, By one man sin entred into the world, and death by sin; so then it would have been by one man righteousness, and life by righteousness. Questions to be made: 1. Whether this righteousness was natural to Adam, or no? Howsoever some have thought this a mere contention of words, and therefore if they were well explained, there would be no great difference; yet the Papists make this a foundation for other great errors: for, grant this righteousness to be supernatural to Adam, as it is to us, then: 1. It will follow that all the motions rising in the appetite against reason, are from the constitution of our nature; and so no more sin than hunger and thirst is. 2. That freewill is still in us, and that we have lost nothing but that which is merely superadded to us. Or they compare this righteousness Adam had, sometimes to an antidote, which preserves against the deadly effect of poison: sometimes to a bridle, that rules the horse; so that they suppose man’s nature would of itself rebel, but only this was given to Adam to check it: sometimes to Sampson’s hair, whereby he had supernatural strength, but when that was cut off, he had only natural: So that by this doctrine, man, now fallen, should be weaker than he was, but not corrupted. Therefore we must necessarily conclude that this righteousness was natural to him; not indeed flowing from the principles of nature, for so it was of God, but it was a perfection suitable or connatural to him; it was not above him, as it is now in us. As a blind man that was made to see, though the manner was supernatural, yet to see was a natural perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants… (London: Young, 1647), Lecture 12</cite>, pp. 119-20</span></figcaption>

</figure><figure class="quote" id="q-a789796766" data-kw="">
<blockquote><p>The image of God which we have spoken about neither completely perished through sin, nor completely survived from sin. Therefore it remains in some measure (Gen. 9:6; James 3:9; 1 Cor. 11:7, where without doubt the topic is not the past state, but the current one). It remains, I say, to the extent that it consists: (1) in the very nature of man, of the body and soul. (2) In the natural faculties of the soul, in the intellect and will. (3) In certain gifts of the intellect and will, insofar as among the worst is still seen some use of reason, and also some propensity to good, even moral good (Rom. 1:19; 2:15; 1 Cor. 5:1). Furthermore, (4) in at least some remnants of original dominion (Gen. 7:2). God willed all these bits of his own image to survive in us from the fall, first so that they may be witnesses of his own most undeserved goodness toward us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Pracgtical Theology (RHB), Bk. 3, ch. 9, section 39</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“The image of God which we have spoken about neither completely perished through sin, nor completely survived from sin. Therefore it remains in some measure (Gen. 9:6; James 3:9; 1 Cor. 11:7, where without doubt the topic is not the past state, but the current one). It remains, I say, to the extent that it consists: (1) in the very nature of man, of the body and soul. (2) In the natural faculties of the soul, in the intellect and will. (3) In certain gifts of the intellect and will, insofar as among the worst is still seen some use of reason, and also some propensity to good, even moral good (Rom. 1:19; 2:15; 1 Cor. 5:1). Furthermore, (4) in at least some remnants of original dominion (Gen. 7:2). God willed all these bits of his own image to survive in us from the fall, first so that they may be witnesses of his own most undeserved goodness toward us…”

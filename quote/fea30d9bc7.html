<main class="wrap"><figure class="quote" id="q-fea30d9bc7" data-kw="">
<blockquote><p>And by this posture [lifting up his eyes] did [Christ] testify the heavenly and depending frame of his spirit. 4. Albeit the Lord know the most secret desires of the heart, and do respect and hear the very thoughts of his people, yet it is their duty, as they have opportunity, to make use of their tongue in prayer, that so they may do Him homage with the whole man, may, by that means (among others) excite their own affections in prayer and may edify others in their place and station, for some (at least) of these causes it is that Christ in prayer spake in the audience of his disciples, ‘He lift up his eyes, and said,’ and by his practice and example would teach us our duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, according to John</cite>, (London, 1657) | on Jn., 17:1</span></figcaption>

</figure><figure class="quote" id="q-9cfa4ce655" data-kw="">
<blockquote><p>…one of our doctors objects that we lift up our eyes and our hands to heaven and worship God, yet do not worship the heaven: that a man going to bed prays before his bed: that David offered the sacrifices of thanksgiving in the presence of all the people, Ps. 116, that Paul having taken bread gave thanks before all them who were in the ship, Acts 27:35, that the Israelites worshipped before Moses and Aaron, Ex. 4:31. Hereupon another doctor harping on the same string tells us that when we kneel in the act of receiving the sacrament, we kneel no more to bread than to the pulpit when we join our prayers with the ministers. Oh, unworthy instances and reproachful to doctors! All these things were and are accidentally present to the worshippers and not purposely before them, not respected as having a religious state in the worship. What? do we worship before the bread in the sacrament even as before a pulpit, a bed, etc? Nay, graduate men should understand better what they speak of.</p></blockquote>

</figure><figure class="quote" id="q-c7550de74c" data-kw="">
<blockquote><p>For the more clear opening of the ensuing treatise it is necessary to speak somewhat of worship and adoration, and especially of these: 1. honor. 2. praise. 3. glory, 4. reverence. 5. veneration. 6. devotion. 7. religion. 8. service. 9. worship. 10. love. 11. obedience. 12. adoration. 1. Honor, is a testification of the excellency of any, Aristotle, Ethics, bk. 8, ch. 8; Aquinas, Honos est signum quoddam excellentiae. ‘Honour is a sign or expression of excellency in any,’ it does not import any superiority in the party whom we honor, as adoration does. [2.] Praise is a special honoring of any, consisting in words. [3.] Glory is formally the effect of honor, though it be taken, pro claritate, ‘for the celebrity’ or renownedness of any; yet glory seems to be founded upon celebrity, as its foundation. [4.] Reverence is a sort of veneration of a person for excellency connotating a sort of fear. [5.] Veneration is a sort of fear, and reverencing of a person: I see not well any difference between reverence and veneration, except that veneration seems to be some more, and comes nearer to adoration. [6.] Devotion is the promptitude, cheerfulness, or spiritual propension of the will to serve God; [7.] Religion is formally in this, when a man subjects himself to God, as to his supreme Lord, and thence arises to give him honor, as his God and absolute Lord. The two integral parts of religion are the subjection of the reasonable creature to God. 2. An exhibition of honour… [8.] Service is from the bond of subjection, to reverence God as an inferior or servant does his Lord and Master: A servant does properly do the will of his master for the gain or profit that redounds to his master… [9.] For worship formally is to give reverence to God for his excellency; in one and the same act we may both worship God and serve Him. Only service does include the obligation of a servant to a lord. As concerning [10.] love, faith and hope, they are internal worship, not properly adoration: Love as love does rather import an equality with the thing loved, and a desire of an union, rather than a submission. It is true, there is a perfection in that which we love, but not essentially to perfect the lover… Faith and hope may suppose a resting on a helper as a helper, and so are internal worship; if they be adoration formally may be a question… [11.] Obedience is founded, not formally upon God’s excellency, properly so called, but upon his jurisdiction and authority to command. [12.] Adoration is the subjection or prostration of soul or body to God in the due recognition and acknowledgement of his absolute supremacy. There is no need, that Vasquez [a Romanist] should deny that there is any internal adoration, for that adoration is only an external and bodily worship of God, can hardly be defended… as external adoration is an act by which we offer our bodies to God and subject the utter man to him, in sign of service and reverence to so supreme a Lord, so there is a heart-prostration and inward bowing of the soul answerable thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction, Section 6, ‘What Honor, Praise, Glory, Reverence, Veneration, Devotion, Service, Worship, etc. are’, p. 83</span></figcaption>

+servant+does+properly+do+the+will+of+his+master+for+the+gain+or+profit+that+redounds+to+his+master%E2%80%A6+%5B9.%5D+For+worship+formally+is+to+give+reverence+to+God+for+his+excellency%3B+in+one+and+the+same+act+we+may+both+worship+God+and+serve+Him.+Only+service+does+include+the+obligation+of+a+servant+to+a+lord.+As+concerning+%5B10.%5D+love%2C+faith+and+hope%2C+they+are+internal+worship%2C+not+properly+adoration%3A+Love+as+love+does+rather+import+an+equality+with+the+thing+loved%2C+and+a+desire+of+an+union%2C+rather+than+a+submission.+It+is+true%2C+there+is+a+perfection+in+that+which+we+love%2C+but+not+essentially+to+perfect+the+lover%E2%80%A6+Faith+and+hope+may+suppose+a+resting+on+a+helper+as+a+helper%2C+and+so+are+internal+worship%3B+if+they+be+adoration+formally+may+be+a+question%E2%80%A6+%5B11.%5D+Obedience+is+founded%2C+not+formally+upon+God%E2%80%99s+excellency%2C+properly+so+called%2C+but+upon+his+jurisdiction+and+authority+to+command.+%5B12.%5D+Adoration+is+the+subjection+or+prostration+of+soul+or+body+to+God+in+the+due+recognition+and+acknowledgement+of+his+absolute+supremacy.+There+is+no+need%2C+that+Vasquez+%5Ba+Romanist%5D+should+deny+that+there+is+any+internal+adoration%2C+for+that+adoration+is+only+an+external+and+bodily+worship+of+God%2C+can+hardly+be+defended%E2%80%A6+as+external+adoration+is+an+act+by+which+we+offer+our+bodies+to+God+and+subject+the+utter+man+to+him%2C+in+sign+of+service+and+reverence+to+so+supreme+a+Lord%2C+so+there+is+a+heart-prostration+and+inward+bowing+of+the+soul+answerable+thereunto.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government...+%281646%29+%7C+Introduction%2C+Section+6%2C+%E2%80%98What+Honor%2C+Praise%2C+Glory%2C+Reverence%2C+Veneration%2C+Devotion%2C+Service%2C+Worship%2C+etc.+are%E2%80%99%2C+p.+83&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc7550de74c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c7550de74c.html">Perma

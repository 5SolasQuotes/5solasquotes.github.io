<main class="wrap"><figure class="quote" id="q-cb853e1cab" data-kw="">
<blockquote><p>It would go better with all the commonwealths and princes on earth, if they well considered that the absolute propriety and sovereignty of God-redeemer is the basis of all lawful societies and governments; and that no man hath any absolute propriety, but only the use of the talents that God doth intrust him with: that the sovereignty of the creature is but analogical, secundum quid; improper and subordinate to God, the proper Sovereign: that it belongs to him to appoint his inferior officers: that there is no power but from God, and that he giveth none against himself: that a theocracy is the government that must be desired and submitted to, whether the subordinate part be monarchical, aristocratical, or democratical; and the rejecting of this was the Israelites’ sin in choosing them a king: that it is still possible and necessary to live under this theocracy, though the administration be not by such extraordinary means as among the Israelites: that all human laws are but by-laws, subordinate to God’s.

How far his laws must take place in all governments: how far those laws of men are ipso facto null, that are unquestionably destructive of the laws of God: how far they that are not their own, may give authority to others: and what aspect these principles have upon liberty in that latitude as it is taken by some; and upon the authority of the multitude, especially in church government. Should I stand on these and other the like consequents, which these fundamentals in hand might lead us to discuss, I should prevent that more seasonable application which I intend, and perhaps be thought, in some of them, to meddle beyond my bounds.

I will only say, that God is the first and the last in our ethics and politics, as well as in our physics; that as there is no creature which he made not, so it is no good right of property or government which he some way gives not; that all commonwealths not built on this foundation, are as castles in the air, or as children’s tottering structures, which in the very framing are prepared for their ruin, and strictly are no commonwealths at all; and those governors that rule not more for God, than for themselves, shall be dealt with as traitors to the universal Sovereign. Thus far, at least, must our politics be divine, unless we will be mere confederate rebels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>True Christianity; or, Christ’s Absolute Dominion, and Man’s Necessary Self-Resignation and Subjection. In Two Assize Sermons, Preached before the Honourable Judge of Assize, at Worcester, August 2, 1654</cite>, in The Practical Works of Richard Baxter (4 vols, London: George Virtue, 1838), 3: 787.</span></figcaption>

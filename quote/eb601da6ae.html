<main class="wrap"><figure class="quote" id="q-eb601da6ae" data-kw="Sola fide Faith alone">
<blockquote><p>The reader now perceives with what fairness the Sophists of the present day cavil at our doctrine, when we say that a man is justified by faith alone (Rom. 4:2). They dare not deny that he is justified by faith, seeing Scripture so often declares it; but as the word alone is nowhere expressly used they will not tolerate its being added. … Does he not plainly enough attribute everything to faith alone when he disconnects it with works?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.19</span></figcaption>

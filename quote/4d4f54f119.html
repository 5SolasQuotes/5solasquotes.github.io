<main class="wrap"><figure class="quote" id="q-4d4f54f119" data-kw="">
<blockquote><p>In opposition to these [anti-Sabbatarian] views, we maintain that the Lord’s day was instituted under the divine guidance of him whose name it bears.

The first verse that seems logically to require notice is the well-known one in Heb. iv. [9], “There remaineth therefore a rest (σαββατισμoς, i.e. Sabbath keeping) for the people of God.” The reference appears to be to heaven. If, as has been proved, there was a Sabbath-keeping for those who lived under the patriarchal period of the church’s history, if there was one under the Jewish dispensation, and if there is one for the redeemed above, would it not appear like a want of symmetry in the divine plan if under the Christian dispensation there was no Sabbath?

The analogy of the prior periods, and of that which is yet to come, is so strongly in favour of a Christian Sabbath, that we should have suspected its existence, even had there been no positive evidence of its institution; and much less will suffice than would have been required had the analogy fallen in the opposite direction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-hunter.html">Robert Hunter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Literature of the Sabbath Question in British and Foreign Evangelical Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b96dfa318" data-kw="">
<blockquote><p>Objection: 1. But Christ says, “Swear not at all;” and James says, “Nor by any other oath…”. Therefore Christians are not allowed to swear [oaths] under any form. Answer: There is here a fallacy of composition; for when Christ says, swear not at all, we are not to refer this language to the oath itself, but to the various forms of rash [oath] swearing which the Pharisees imagined lawful. It is, therefore, as if he would say, “Swear not falsely or rashly at all, whether it be in a direct or indirect way.” So when the Apostle James says, “Nor by any other oath,” we must understand him also as referring to such oaths as are rash and false, of which kind he furnishes some specimens, and forbids all of a similar character. If this be not the proper interpretation of these passages, Christ himself has violated his own precept which he here lays down, saying, “Let your communication be yes, yes or no, no;” for he frequently in his discourses used this most emphatic form of expression, “Truly, truly I say to you.” And James would in this case condemn Paul, who called God for a record upon his soul. And the Holy Spirit would contradict himself by condemning all oaths by James, and commending them by another Apostle as a remedy useful and necessary to the preservation of society, for the purpose of putting an end to strife and controversies, from which human life, in this state of frailty and imperfection, cannot be free. Objection 2: But such oaths as were permitted, together with the examples which are found in the Scriptures, have respect to public oaths—such as were exacted or given in the name of the public and for the public good. Therefore at least private oaths, or such as pass between private individuals, are entirely prohibited. Answer. 1: We deny the antecedent; because there is not only no such restriction as that which is here maintained, specified in the instances recorded in the Scriptures, where the saints make oath to God, but it is impossible to interpret them in this way, as a careful examination of the passages themselves will prove. 2: There are many oaths recorded in the Scriptures, the private character of which cannot be doubted, such as that of Jacob and Laban, that of Boaz, Abdiah, Abigail, and David. (Gen. 31:53. Ruth 3:13. etc.) 3. The same thing may be proven from the design of the oath, which is a confirmation of fidelity and truth among men, and the putting an end to strife. These things now have respect to Christians also as private individuals; and hence the oath itself by which we establish truth and fidelity, likewise has respect to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Orthodox Doctrine of the Explication of the Catechism, on Q. 7</cite></span></figcaption>

</figure><figure class="quote" id="q-4df4feb072" data-kw="">
<blockquote><p>Lastly, Sanctification of the Sabbath, by the whole family, in all or most of the duties aforesaid, publicly and privately, is the care of the chief householder; as in the fourth Commandment: Remember thou keep holy the Sabbath day: Thou Master, and thy son and daughter, manservant and maidservant. What need so particular enumeration, if there were not a great weight in the performance thereof?

But where shall we find the family that doth all this? when the Householders themselves neglect or profane it by their own example; and employ their children and servants in businesses, to keep them from the public Congregation, or leave them to come or go at their own pleasure; or to spend the day in Idleness or Sports &amp; pastimes, that day; How can these men say truly, I and my house, we will serve the Lord? I shall only say more truly, what once was falsely applied to our Saviour; This man is not of God, because he keepeth not the Sabbath day: because he takes no care, that his family with him, do keep the Sabbath day. And thus much of the third Use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Family reformation promoted. In a sermon on Joshua, chap. 24. ver. 15.</cite>, (London: John Wright, 1656), pp 40-41.</span></figcaption>

<blockquote><p>The duties required in the first commandment are, the knowing and acknowledging of God to be the only true God, and our God;[o] and to worship and glorify him accordingly,[p] by thinking,[q] meditating,[r] remembering,[s] highly esteeming,[t] honouring,[v] adoring,[w] choosing,[x] loving,[y] desiring,[z] fearing of him;[a] believing him;[b] trusting,[c] hoping,[d] delighting,[e] rejoicing in him;[f] being zealous for him;[g] calling upon him, giving all praise and thanks,[h] and yielding all obedience and submission to him with the whole man;[i] being careful in all things to please him,[k] and sorrowful when in any thing he is offended;[l] and walking humbly with him.[m] [o] 1 Chron. 28:9. Deut. 26:17. Isa. 43:10. Jer. 14:22. [p] Ps. 95:6,7. Matt. 4:10. Ps. 29:2. [q] Mal. 3:16. [r] Ps. 63:6. [s] Eccl. 12:1. [t] Ps. 71:19. [v] Mal. 1:6. [w] Isa. 45:23. [x] Josh. 24:15,22. [y] Deut. 6:5. [z] Ps. 73:25. [a] Isa. 8:13. [b] Exod. 14:31. [c] Isa. 26:4. [d] Ps. 130:7. [e] Ps. 37:4. [f] Ps. 32:11. [g] Rom. 12:11 compared with Num. 25:11. [h] Phil. 4:6. [i] Jer. 7:23. James 4:7. [k] 1 John 3:22. [l] Jer. 31:18. Ps. 119:136. [m] Micah 6:8.</p></blockquote>

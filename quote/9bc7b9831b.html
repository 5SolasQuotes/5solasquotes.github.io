<main class="wrap"><figure class="quote" id="q-9bc7b9831b" data-kw="">
<blockquote><p>Should there be a gathering destitute of bread and wine, as perchance among the Indians, who for bread use the baked marrow of a certain tree, or a fixed root, or rice, or such other things, the gathering may–if, I say, there is no bread of corn–safely use what it is accustomed to use in place of bread. It is not so much the outward form and kind of corn that ought to be regarded, as the nourishment and what chiefly nourishes. The same must be said if wine is lacking. Something else might be applied, in place of wine, as scarcely any nation is discoverable, which has not some beverage which it uses to restore the spirits in place of wine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-braun.html">Johannes Braun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Doctrine of the Covenants, or a System of Didactic &amp; Elenchtic Theology</cite>, (Amsterdam, 1688), p. 593 as trans. in Heinrich Heppe, Reformed Dogmatics ed. Ernst Bizer tr. G.T. Thomson (Wipf &amp; Stock, 2007), p. 631</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ee65977391" data-kw="">
<blockquote><p>To the proposition, ‘What things are done for the glory of God,’ to wit, of themselves; that is, such things as are commanded by God to this special end and purpose, that by those works we might declare our obedience towards Him: they are the worship of God. And not such [things] as serve for the glory of God accidentally, that is, such as do sometimes serve for the performance of those things which are commanded by God for accidental causes and circumstances, which if they concur not, yet God may be honored as well by such as omit them as by those that perform them, so they be omitted or performed of faith, which causes the person to be reconciled unto God and makes the doing or omission of all indifferent actions to agree and stand with the Will of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gabriel-powel.html">Gabriel Powel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God</cite>, De adiaphoris, Theological &amp; Scholastical Positions concerning the Nature &amp; Use of Things Indifferent. Where also is Methodically &amp; Briefely Handled, of Civil &amp; Ecclesiastical Magistrates, of Human Laws, of Christian Liberty, of Scandal &amp; of the Worship of God (London, 1607), ch. 11, ‘A Solution of the Objections opposed by the Refractary Ministers’, pp. 74-75 Powel (baptised 1576–1611) was a Welsh Anglican minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“To the proposition, ‘What things are done for the glory of God,’ to wit, of themselves; that is, such things as are commanded by God to this special end and purpose, that by those works we might declare our obedience towards Him: they are the worship of God. And not such [things] as serve for the glory of God accidentally, that is, such as do sometimes serve for the performance of those things which are commanded by God for accidental causes and circumstances, which if they concur not, yet God may be honored as well by such as omit them as by those that perform them, so they be omitted or performed of faith, which causes the person to be reconciled unto God and makes the doing or omission of all indifferent actions to agree and stand with the Will of God.”

><a class="perma" href="../quote/ee65977391.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-circumstances/#:~:text=To%20the%20proposition%2C%20%E2%80%98What%20things%20are,stand%20with%20the%20Will%20of%20God&amp;text=To%20the%20proposition%2C%20%E2%80%98What%20things%20are%20done%20for&amp;text=agree%20and%20stand%20with%20the%20Will%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e6788e1cfe" data-kw="">
<blockquote><p>Circumstances are either such as follow actions as actions, or such as are arbitrarily superadded and adjoined by command unto actions, which do not of their own accord, nor naturally nor necessarily attend them. Now religious actions in the worship of God are actions still. Their religious relation does not destroy their natural being. Those circumstances then which do attend such actions as actions, not determined by divine institution may be ordered, disposed of, and regulated by the prudence of men. For instance, prayer is a part of God’s worship. Public prayer is so, as appointed by Him. This as it is an action to be performed by man cannot be done without the assignment of time, and place, and sundry other things, if order and conveniency be attended. These are circumstances that attend all actions of that nature to be performed by a community, whether they relate to the worship of God or no. These men may according as they see good regulate and change as there is occasion: I mean they may do so who are acknowledged to have power in such things. As the action cannot be without them, so their regulation is arbitrary if they come not under some divine disposition and order, as that of time in general does. There are also some things which some men call circumstances also, that no way belong of themselves to the actions whereof they are said to be the circumstances, nor do attend them, but are imposed on them, or annexed unto them, by the arbitrary authority of those who take upon them to give order and rules in such cases. Such is to pray before an image, or towards the East, or to use this or that form of prayer in such Gospel administrations and no other. These are not circumstances attending the nature of the thing itself, but are arbitrarily superadded to the things that they are appointed to accompany.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, (London, 1662), ch. 7, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

— Samuel Rutherford, A Free Disputation Against Pretended Liberty of Conscience… (1649), ch. 2, p. 32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+learned+and+renowned+%5Breformed%5D+professors+of+Leiden+answer+%5Bthat%5D+the+end+of+synods+is+not+by+any+means%2C+good+or+bad%2C+to+remove+controversies%2C+but+to+bury+them+by+the+power+of+the+Word.+2.+Only+external+peace+separated+from+truth+should+not+be+intended+%5Bby+synods+regarding+controversies%5D%2C+but+%5Bexternal+peace+should+be%5D+conjoined+with+truth+and+peace+of+conscience.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Free+Disputation+Against+Pretended+Liberty+of+Conscience%E2%80%A6+%281649%29%2C+ch.+2%2C+p.+32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2ab4c32b49.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2ab4c32b49.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-peace-purity-of-the-church/#:~:text=The%20learned%20and%20renowned%20%5Breformed%5D%20professors,with%20truth%20and%20peace%20of%20conscience." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-05e31d0092" data-kw="">
<blockquote><p>FIrst, though men be known to err in judgment in things not fundamental nor destructive, yet if after such knowledge of them, they would keep their judgments to themselves, so as not to hurt others or disturb the peace, most men of moderate spirits, if not all, hold that such men are not to be punished either by Church or State.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened… (London: Robert Davvlman, 1653)</cite>, ch. 9; p. 54</span></figcaption>

— Jeremiah Burroughs, Irenicum, to the Lovers of Truth and Peace. Heart-Divisions Opened… (London: Robert Davvlman, 1653), ch. 9; p. 54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFIrst%2C+though+men+be+known+to+err+in+judgment+in+things+not+fundamental+nor+destructive%2C+yet+if+after+such+knowledge+of+them%2C+they+would+keep+their+judgments+to+themselves%2C+so+as+not+to+hurt+others+or+disturb+the+peace%2C+most+men+of+moderate+spirits%2C+if+not+all%2C+hold+that+such+men+are+not+to+be+punished+either+by+Church+or+State.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Irenicum%2C+to+the+Lovers+of+Truth+and+Peace.+Heart-Divisions+Opened%E2%80%A6+%28London%3A+Robert+Davvlman%2C+1653%29%2C+ch.+9%3B+p.+54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F05e31d0092.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/05e31d0092.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=FIrst%2C%20though%20men%20be%20known%20to,punished%20either%20by%20Church%20or%20State." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-fdc8c12921" data-kw="">
<blockquote><p>The Gospel proclaimed by Jesus Christ and his apostles, presented in its simplicity and without so many additional things, provides sufficient knowledge to convert a man to God and thereby to place him within His Church. It was this simplicity of doctrine, received with an honest heart, that incorporated in a single day into the Church those three thousand souls of whom we spoke above, as is reported in Acts, ch. 2. Now, they would have needed—not one day, but several months, indeed several years—to know all the controversies that both pagans and Jews raised against the Christians, and to have the solution to all the arguments and all the objections made on the points concerning the incarnation of Jesus Christ, his divinity, and that of the Holy Spirit, the expiation of sins, and the satisfaction of the justice of God by His blood, the resurrection of the dead, and the immortality of the soul, which were contested by the Sadducees and others. The eunuch of the Queen of Ethiopia could not (according to the cardinal’s reckoning) have entered the Church and received baptism through knowledge of the Faith in the space of a few hours, upon the preaching of St. Philip, as he did. For it is said that Philip, having found the eunuch reading a passage from Isaiah, announced to him, beginning from that text. Now to announce Jesus is to announce Christian doctrine. And how many years, on this reckoning, would have been required for catechumens to be introduced into the Church, since they could not enter the Church except through knowledge of the doctrine? Thus the matter here concerns a knowledge sufficient for salvation, which consists in a measure of light of which the simple and the lowly are capable in a short time. The matter here is not to form a doctor of theology, but a Christian; not to ascend a chair of the schools and of controversies, but to learn the Law of God, which gives wisdom to the simple; and not so much to dispute against all errors, as to learn to combat one’s vices through the knowledge of the death and resurrection of Jesus Christ, according to the declaration of the apostle, who proposed to himself nothing else (1 Cor. 2). Therefore this measure of knowledge was restricted by the Church of the first centuries to the understanding of the Apostles’ Creed, which the Church required for receiving someone into the Church and for administering baptism. And although this measure of knowledge is perhaps not sufficient to convince others, it is sufficient to sanctify the one in whom it is found and to edify him in Jesus Christ. Moreover (just as what is straight makes known of itself what is crooked), the simplicity of the doctrine of the Gospel contained in this Creed suffices to cause one to reject everything that is not conformable to it, and consequently to avoid errors, insofar as is necessary for salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-mestrezat-latin.html">Jean Mestrezat Latin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tract on the Church (1649), bk. 1, ch. 1</cite></span></figcaption>

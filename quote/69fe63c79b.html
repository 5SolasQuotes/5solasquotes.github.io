<main class="wrap"><figure class="quote" id="q-69fe63c79b" data-kw="">
<blockquote><p>3. Labour or pains for the enjoyment of the benefit and advantage of the solemn assemblies of the church, and in them of the appointed worship of God, is so far from entrenching on the rest of this day that it belongs unto its due observance. A mere bodily rest is no part of religious worship in itself; nor does it belong unto the sanctification of this day any farther than as it is a means for the due performance of the other duties belonging to it. We have no bounds under the gospel for a Sabbath-day’s journey, provided it be for Sabbath ends. In brief, all pains or labour that our station and condition in this world, that our troubles which may befall us, or any thing else, make necessary, as that without which we cannot enjoy the solemn ends and uses of this holy day of rest, are no way inconsistent with the due observance of it. It may be the lot of one man to take so much pains and to travel so far for, and in the due celebration of the Lord’s day, as if another should do the like without his occasions and circumstances, it would be a profanation of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, (d. 1683), vol. 1 (of 4), p. 749</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8b1d1819a1" data-kw="">
<blockquote><p>…in the Ten Commandments, in which one of seven is a Sabbath to the Lord, it will be found that many positives Moral are in the Covenant of Works… But man being considered as endued with the Image of God, so the Holy God made with him a Covenant of life, with Commandments, though positive and moral, yet not deduced from the Law of Nature, in the strictest sense, as to observe such a Sabbath, the seventh from the Creation…</p></blockquote>

</figure><figure class="quote" id="q-9a2de9f5f9" data-kw="">
<blockquote><p>The word ‘recreation’ is equivocal. Indeed there is a recreation which is mercy, (viz.) the necessary refreshment of the body, as eating, drinking, resting itself, especially to those who have wearied themselves with labor; yea, to some sickly bodies, some ordinary, moderate and inoffensive recreations may be allowed, as a learned man observes. But there is a recreation which we call sports and pastimes, when there is no necessity; and to allow this is no work of mercy; and if it be a mercy to the body, it is severity to the soul…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wells.html">John Wells</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Sabbatarian</cite>, … (London, 1668) Wells was an English puritan. | ch. 4, ‘That Needless Recreations are Unlawful on the Sabbath’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-db1e438acd" data-kw="">
<blockquote><p>9. The strong, violent and firm persuasions of conscience in single persons, or in some communities of men, is not a sufficient indication of a moral law. The weak brother of whom St. Paul speaks durst not eat flesh, but thought it an impiety next to unpardonable, but he was abused: and there are at this day some persons, some thousands of persons against whose conscience it is to dress meat upon the Lord’s Day, or to use an innocent permitted recreation: Now when such an opinion makes a sect, and this sect gets firm confidents and zealous defenders, in a little time it will dwell upon the conscience as if it were a native there, whereas it is but a pitiful inmate and ought to be turned out of doors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremy-taylor.html">Jeremy Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ductor dubitantium</cite>, … (London, 1660), vol. 1, Of the Rule of Conscience, ch. 2, Rule 6, ‘Every thing in the Decalogue is not obligatory to Christians, is not a portion of the Moral or Natural law’ Taylor (1613–1667) was a cleric in the Church of England who achieved fame as an author during the Protectorate of Oliver Cromwell. He was Arminian in outlook., pp. 370-71</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

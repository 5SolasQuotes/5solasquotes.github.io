<blockquote><p>IV. The essential proprieties in God do not in very deed differ from the essence.

For we acknowledge that in God for his singleness the essential proprieties do not in deed differ from the essence and therefore they without this cannot be communicated to any creature, and therefore no creature can be or can be said to be (for example sake) omnipotent simply, just, wise or such like. Even as our Lord Jesus speaking of one propriety, teacheth of them all saying: ‘None is good (simply) but God’.

V. That nothing is or can be made simply such as God is, unless the same might simply be God.

Wherefore, they which will affirm that any created substance ever could or can be made partaker of those divine proprieties whereby it should be such as God is, as simply omnipotent and such like, they must needs then confess that the same is or that it can be ὁμοούσιον, of the same substance with God, forasmuch as neither the Son himself is simply omnipotent, but as he is ὁμοούσιον, consubstantial with the Father, nor yet the Holy Spirit.

VI. A confirmation of the former opinion.

Whereupon we also understand, how it is that sith the Son is no less omnipotent then the Father and so likewise the Holy Ghost, yet we do not say that they are three almighties, but we confess with Athanasius and the whole church, that they are one only almighty, because indeed of them all there is but one and the self same substance. Therefore seeing no creature hath one and the self same essence with God, but a far other and diverse, and if the same by communication of the divine omnipotency could also be made omnipotent, then it must follow that there might be more almighties then one, which we believe can not without blasphemy be affirmed.

VII. Errors.

Wherefore we condemn and detest all heresies, which have risen against this first article of our faith or have sprong from hell and been condemned by the holie fathers in their lawful councils, as those of Cerinthus, Ebion, Valentinus, Marcion, Manichaeus, Arius, Eunomius, Sabellius, Praxea, Fotinus and such like as Servetus and Tritheitae, also the blasphemies of Jews and Turks [Muslims].

And lastly all heresies which have been invented by the devil, either against the unity of the divine essence or against the true Trinity of persons. Yea, and those therefore which deny either the Son to be true and everlasting God or the Holie ghost to be so, or which do confound these persons and say they bee one and the self same existence, which for divers respects is called by diverse names of Father, Son, and Holy Ghost.

We also condemn all those errors which do separate the essential proprieties of God from the divine essence, which it seemeth unto us that these men very unadvisedly do, which teach that those essential proprieties in very deed may be communicated or rather are already communicated to creatures without communication of the essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), II.IV-VII, 1: 131-37.</span></figcaption>

<blockquote><p>How many ways is the name of God taken in the Scriptures?

Two ways: properly for the substance, essence, and nature: and improperly. Now it is taken properly, or for the essence, when it is taken without the distinction of any one of the persons, as Joh. 4.24. God is a spirit, where God is taken for the whole essence of the Deity, as is also the name Jehovah.

Or else, personally, when there is joined unto the name of God the name of the person: as God the Father, God the Son, God the holy Ghost. Or when the Father is opposed to the Son, who is very God, and the second Person in the Trinity, as Rom. 7.25. I thank God by Jesus Christ. So Rom. 8.3 the Father is called God, the word Father being used personally, because the Person sending is opposed to the Person sent.

Improperly, when it is attributed to Angels or men: and truly, either in regard of their office, or else in respect of the revealing of the will of God, and of their reverence: falsely, either by error; or else by usurpation and custom, as 1. Cor. 8.5. or else by worshipping them. 2. Cor. 4.4. Phil. 3.19.</p></blockquote>

<blockquote><p>Who then, who can declare the Father by number, so as to discover the powers of His Word? For like as He is the Father’s Word and Wisdom, so too condescending to created things, He becomes, to impart the knowledge and apprehension of Him that begot Him, His very Brightness and very Life, and the Door, and the Shepherd, and the Way, and King and Governor, and Saviour over all, and Light, and Giver of Life, and Providence over all. Having then such a Son begotten of Himself, good, and Creator, the Father did not hide Him out of the sight of His creatures, but even day by day reveals Him to all by means of the organisation and life of all things, which is His work.

But in and through Him He reveals Himself also, as the Saviour says: “I in the Father and the Father in Me:” so that it follows that the Word is in Him that begat Him, and that He that is begotten lives eternally with the Father. But this being so, and nothing being outside Him, but both heaven and earth and all that in them is being dependent on Him, yet men in their folly have set aside the knowledge and service of Him, and honoured things that are not instead of things that are: and instead of the real and true God deified things that were not, “serving the creature rather than the Creator,” thus involving themselves in foolishness and impiety.

For it is just as if one were to admire the works more than the workman, and being awestruck at the public works in the city, were to make light of their builder, or as if one were to praise a musical instrument but to despise the man who made and tuned it. Foolish and sadly disabled in eyesight! For how else had they known the building, or ship, or lyre, had not the ship-builder made it, the architect built it, or the musician fashioned it?

As then he that reasons in such a way is mad, and beyond all madness, even so affected in mind, I think, are those who do not recognise God or worship His Word, our Lord Jesus Christ the Saviour of all, through Whom the Father orders, and holds together all things, and exercises providence over the Universe; having faith and piety towards Whom, my Christ-loving friend, be of good cheer and of good hope, because immortality and the kingdom of heaven is the fruit of faith and devotion towards Him, if only the soul be adorned according to His laws. For just as for them who walk after His example, the prize is life everlasting, so for those who walk the opposite way, and not that of virtue, there is great shame, and peril without pardon in the day of judgment, because although they knew the way of truth their acts were contrary to their knowledge.</p></blockquote>

As then he that reasons in such a way is mad, and beyond all madness, even so affected in mind, I think, are those who do not recognise God or worship His Word, our Lord Jesus Christ the Saviour of all, through Whom the Father orders, and holds together all things, and exercises providence over the Universe; having faith and piety towards Whom, my Christ-loving friend, be of good cheer and of good hope, because immortality and the kingdom of heaven is the fruit of faith and devotion towards Him, if only the soul be adorned according to His laws. For just as for them who walk after His example, the prize is life everlasting, so for those who walk the opposite way, and not that of virtue, there is great shame, and peril without pardon in the day of judgment, because although they knew the way of truth their acts were contrary to their knowledge.”

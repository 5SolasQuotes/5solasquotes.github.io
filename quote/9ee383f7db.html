<main class="wrap"><figure class="quote" id="q-9ee383f7db" data-kw="">
<blockquote><p>Let there be no strife between us and you, for we be brethren: and is not the Canaanite and the Perizzite yet in the land? O let it not be told in Gath, nor published in the streets of Ashkelon! Let it not be said that there can be no unity in the Church… It shall be no grief of heart to you afterward, that you have pleased others as well as yourselves, and have stretched your principles for an accommodation in Church government, as well as in worship, and that for the Church’s peace and edification; and that the ears of our common enemies may tingle (Act. 9:31) when it shall be said, ‘The Churches of Christ… have rest, and are edified, and walking in the fear of the Lord, and in the joy of the Holy Ghost are multiplied.’ Alas, how shall our divisions and contentions hinder the preaching and learning of Christ, and the edifying one another in love! Is Christ divided? says the apostle. There is but one Christ, yea the Head and the Body makes one Christ, so that you cannot divide the Body without dividing Christ. Is there so much as a seam in all Christ’s garment? Is it not woven throughout from the top to the bottom? Will you have one half of Israel to follow Tibni, and another half to follow Omri? O brethren, we shall be one in heaven, let us pack up differences in this place of our pilgrimage the best way we can. Nay, we will not despair of unity in this world. Has not God promised to give us ‘one heart and one way’? (Jer. 32:39; Eze. 11:19) And that Ephraim shall not envy Judah, and Judah shall not vex Ephraim, but they shall flee upon the shoulders of the Philistines toward the East, they shall spoil them of the East together? Isa. 11:13,14 Has not the Mediator (whom the Father hears always) prayed that all his may be one? (John 17:21) Brethren, it is not impossible, pray for it, endeavor it, press hard toward the mark of accommodation. How much better is it that you be one with the other Reformed Churches, though somewhat straitened and bound up, than to be divided though at full liberty and elbow-room?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty, Appendix</cite></span></figcaption>

</figure><figure class="quote" id="q-15e78e36c0" data-kw="">
<blockquote><p>Conclusion 2. That a real and approved holiness is a sure-note that the error which they hold is not a damning, destroying error. I say, though the holiness of those men that maintain an opinion, be not a sure note that the opinion they maintain is a truth, yet it is a certain evidence that it is not an undoing and destructive error. Christ says that the elect shall not be deceived, Mt. 24:24, that is, though they may be carried aside with some sinful, yet they shall not be drawn away with undoing errors. And we have all the harmony of Scripture for that: He tells us that they who do his will, shall know his doctrine, that we shall all be taught of God, that we shall hear his voice, and shall not follow the voice of strangers, and that we have received an anointing of the holy One, whereby we know all things. All which places are to be understood of necessary truths, not accessory; of truths that are essential and fundamental, not circumstantial: and it proves fully to us that God will never give up his holy ones to undoing errors. That’s the second answer; that holiness is a sure note, that the opinions which they hold (though an error) yet it is not a damning and destroying error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error... (1646)</cite>, p. 166</span></figcaption>

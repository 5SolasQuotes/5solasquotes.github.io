<blockquote><p>11. God has made more promises, donations and covenants than one or two, which must not be confounded:

1. His Law and Covenant made to and with man in innocency is one.

2. And his Law and Covenant made to and with Christ, as Mediator, is another.

3. And his absolute promise of a Saviour to the world, with the conditional promise or Law of Grace conjunct, was the first edition of another. And the Gospel, as after the incarnation promulgated, was a more perfect edition of it (to pass by Abraham’s Covenant of Peculiarity, and the Mosaical Law, as such).

12. Though Christ be promised in one of these, and be God’s antecedent gift, He may nevertheless be the Author of another, (and so far the foundation), as well as the meritorious cause.

13. That may be of free grace which is merited by Christ; yea, and that which is annexed to the evangelical worthiness of a believer.

14. That may be a condition required of us, to be done by the help of grace, which yet is the effect of that grace, and given us by God.

15. It is a true Covenant between God the Father, Son, and Holy Ghost, and man, which is solemnly entered into in baptism: And this is a Covenant of Grace, even that proceeds purely from grace; and of grace, as given by God, and by us accepted. He that will confound these various covenants, promises, and laws, on pretense of their unity (though there is doubtless a wonderful unity of all the parts both of God’s moral (signal) means, and his physical works), shall confound much of theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675), ‘An Appendix to this Premonition,’ n.p.</span></figcaption>

<blockquote><p>Assertion 3. There be two things in the Law:

1. The authority and power to command, direct, and regulate the creature to an end, in acts of righteousness and holiness.

2. A secondary authority, to punish eternally the breakers of the Law and to reward those that obey. These are two different things: suppose Adam had never sinned: the Law had been the Law; and suppose Adam had never obeyed: the Law also should have been the Law; and in the former case there should have been no punishment, in the latter no reward. … Crisp and his followers are far wide, for Christ died freely out of extreme love and yet He died out of a command laid on Him, to lay down his life for his sheep though no penal power was above Christ’s head to punish Him if He should not die, Jn. 10:18. Nor was there need of any power to force Him subpena [under penalty], or to awe Him if He should not obey; so do angels, with wings of most exact willingness, obey God, yet are they under the authority of a Law and command, but yet under no compelling punishment, Ps. 103:20-21; 104:4.</p></blockquote>

<blockquote><p>The quality of the sponsor implies this. As he is God, infinite and most perfect, his sponsion ought to be most perfect and to involve whatever perfection can be conceived to be contained in an expromissor for the liberation of debtors. In addition, since he is such a sponsor as was neither invented nor given by men, but by God himself (yea, who from eternity offered himself to the Father and substituted himself in the place of sinners without their consciousness and desire; who was alone about to give payment according to the immutable decree of God, whose certainty was confirmed by various promises and sealed by many types), he could not have accomplished this unless even then he had fulfilled the functions of an expromissor and not only those of a fidejussor. Hence such was the efficacy and effect of that sponsion that in virtue of it the fathers were wholly freed from all punishments so that the payment could no longer be demanded of them. The learned men with whom we argue have not been able to deny this.</p></blockquote>

<blockquote><p>Q. And what does God promise to bring the elect into in the Covenant of Grace? A. Into an estate of salvation. … Q. How does God promise to do all this? A. By a Redeemer, Isa. 53:10, ‘When Thou shalt make his soul an offering for sin, He shall see his seed, He shall prolong his days, and the pleasure of the Lord shall prosper in his hand,’ v. 11, ‘He shall see of the travail of his soul, and shall be satisfied, etc.’ And this by some learned divines is called the Covenant of Redemption. Q. What do they mean by it? A. That federal transaction that was betwixt God the Father and the Son from everlasting, about the redemption of lost and fallen men. Q. Is not this the same with the Covenant of Grace? A. This covenant is a covenant of grace, but ’tis not strictly that Covenant of Grace, which the Scripture holds out in opposition to the Covenant of works; but rather the means to it, or foundation of it. Q. Wherein do these two covenants differ? A. In the confederates, for in the Covenant of Redemption, the confederates are God and Christ, but in the Covenant of Grace, the confederates are God and believers.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Q. And what does God promise to bring the elect into in the Covenant of Grace? A. Into an estate of salvation. … Q. How does God promise to do all this? A. By a Redeemer, Isa. 53:10, ‘When Thou shalt make his soul an offering for sin, He shall see his seed, He shall prolong his days, and the pleasure of the Lord shall prosper in his hand,’ v. 11, ‘He shall see of the travail of his soul, and shall be satisfied, etc.’ And this by some learned divines is called the Covenant of Redemption. Q. What do they mean by it? A. That federal transaction that was betwixt God the Father and the Son from everlasting, about the redemption of lost and fallen men. Q. Is not this the same with the Covenant of Grace? A. This covenant is a covenant of grace, but ’tis not strictly that Covenant of Grace, which the Scripture holds out in opposition to the Covenant of works; but rather the means to it, or foundation of it. Q. Wherein do these two covenants differ? A. In the confederates, for in the Covenant of Redemption, the confederates are God and Christ, but in the Covenant of Grace, the confederates are God and believers.”

<blockquote><p>Likewise the repeated and continued Remitting or Repriving of Criminals, and that after they are justly and legally condemned. Also the Repealing the penal Statutes against Witches, contrary to the express Letter of the Law of God, Exod. xxii. 18. Deut. xviii. 10, 11. All which, and many more, we might mention, are fallen upon these poor Lands for Breach of Covenant and Revolt from GOD.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c6f6b764a9" data-kw="">
<blockquote><p>As touching matrimonial benediction… through divine institution, it has a necessary use, as we have said. And though the Dr. to make it appear that a pastor’s performing of the same is a thing indifferent, alleges that in Scripture there is nothing commanded thereanent. Yet plain it is from Scripture itself that matrimonial benediction ought to be given by a pastor, for God has commanded his ministers to bless his people (Num. 6), which by just analogy belongs to the ministers of the Gospel; neither is there any ground for making herein a difference betwixt them and the ministers of the Law, but we must conceive the commandment to t•…e both alike to the blessing of God’s people. Unto which ministerial duty of blessing, because no such limits can be set as may exclude matrimonial blessing, therefore they are bound to the performance of it also. And if further we consider that the duty of blessing was performed by the minister of the Lord, even before the law of Moses (Heb. 6:7), we are yet more confirmed to think that the blessing of the people was not commanded in the Law as a thing peculiar and proper to the Levitical priesthood, but as a moral and perpetual duty, belonging to the Lord’s ministers forever. Wherefore, notwithstanding of any abuse of matrimonial benediction among Papists, yet forasmuch as it has a necessary use in the Church and may not (as the controverted ceremonies may) be well spared…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 2, pp. 24-5</span></figcaption>

</figure><figure class="quote" id="q-23e0b21102" data-kw="">
<blockquote><p>It is a very wretched condition which the Prophet describes, that a free people should be oppressed by such cruel tyranny as to have all their property valued, and an inventory taken of their houses, possessions, families, and servants.

How grievous this slavery is, many persons formerly unaccustomed to it actually know by experience in our times, when their property is valued to the very last farthing, and a valuation is made not only of their undoubted incomes but also of their expected gains, and not only their money and possessions, but even their names are placed on record, while new methods of taxation are contrived, not only on food but on the smallest articles, so that tyrants seize on a large portion of those things which are indispensably necessary to the wretched populace; and yet those calamities do not restrain men from insolence, licentiousness, and rebellion.

What then will happen when they shall be free and at full liberty? Will they not, forgetful of all their distresses, and unmindful of God’s kindness, abandon themselves more freely than before to every kind of indulgence and licentiousness? It is not without good reason, therefore, that the Prophet places before the eyes of the people that wretched condition, that they may not, when delivered from it, giveway to their unlawful passions, but may acknowledge their deliverer and may love him with all their heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Third</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), viii, 34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>I conclude with one word: Although the Church may enjoin it on its children, not to maintain free intercourse with any private person who has been cast out of the Church, yet it cannot command subjects to revolt from their Sovereigns when excommunicated; because they are bound to continue rendering the obedience due to them by law natural, civil and divine.</p></blockquote>

med Books Online</a></div>
</figure><figure class="quote" id="q-23d4a689e3" data-kw="">
<blockquote><p>I grant and confess, that faith is God’s gift in the heart of man, which God alone doth search and know. But men are judged by their words and deeds. Admit, therefore, that the erroneous opinion of the mind may not be punished; yet notwithstanding, wicked and infective profession and doctrine must in no wise be suffered. Verily, no man doth in this world punish profane and wicked thoughts of the mind: but if those thoughts break forth into blasphemous words, then are those blaspheming tongues to be punished of good princes.

And yet by this I say not, that godliness lieth in the magistrate to give and bestow. Justice is the very gift of God, which none but God doth give to men: but who is so foolish as to gather thereupon, that unjust men, robbers, murderers, and witches are not to be punished, because the magistrate by punishment cannot bestow righteousness upon unrighteous people?

We must therefore make a difference betwixt faith, as it is the gift of God in the heart of man, and as it is the outward profession uttered and declared before the face of men. For while false faith doth lurk and lie hid within the heart, and infecteth none but the unbeliever, so long the unbelieving infidel cannot be punished: but if this false and forged faith, that so lay hid, do once break forth to blaspheme, to the open tearing of God and the infecting of his neighbours, then must that blasphemer be by and by plucked under, and kept from creeping to further annoyance. Not to suppress such a fellow as this, is to put a sword in a madman’s hand to kill unwise and weakly men.

Faith is the gift of God; but, where he bestoweth faith, he useth means to give it by: those means he will not have us to neglect. An householder knoweth that faith is the gift of God; and yet notwithstanding, he instructeth his children in the word of truth, he chargeth them to go to church, to pray for faith, and to learn it at the preacher’s mouth. A good father would think much, yea, he would not think well of it, if his son should say: Father, I pray you, teach me not, send me not so much to church, and beat me not if I be not there; for faith is the gift of God, which whipping cannot bring me to. Then what man can quietly abide to hear that faith is the gift of God, and that therefore no man ought for faith, that is, for the corruption of faith and open blasphemy, to suffer any punishment?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids MI: Reformation Heritage Books, 2004), 1: 363-64.</span></figcaption>

Faith is the gift of God; but, where he bestoweth faith, he useth means to give it by: those means he will not have us to neglect. An householder knoweth that faith is the gift of God; and yet notwithstanding, he instructeth his children in the word of truth, he chargeth them to go to church, to pray for faith, and to learn it at the preacher’s mouth. A good father would think much, yea, he would not think well of it, if his son should say: Father, I pray you, teach me not, send me not so much to church, and beat me not if I be not there; for faith is the gift of God, which whipping cannot bring me to. Then what man can quietly abide to hear that faith is the gift of God, and that therefore no man ought for faith, that is, for the corruption of faith and open blasphemy, to suffer any punishment?”

— Heinrich Bullinger, Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids MI: Reformation Heritage Books, 2004), 1: 363-64.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+grant+and+confess%2C+that+faith+is+God%E2%80%99s+gift+in+the+heart+of+man%2C+which+God+alone+doth+search+and+know.+But+men+are+judged+by+their+words+and+deeds.+Admit%2C+therefore%2C+that+the+erroneous+opinion+of+the+mind+may+not+be+punished%3B+yet+notwithstanding%2C+wicked+and+infective+profession+and+doctrine+must+in+no+wise+be+suffered.+Verily%2C+no+man+doth+in+this+world+punish+profane+and+wicked+thoughts+of+the+mind%3A+but+if+those+thoughts+break+forth+into+blasphemous+words%2C+then+are+those+blaspheming+tongues+to+be+punished+of+good+princes.%0A%0AAnd+yet+by+this+I+say+not%2C+that+godliness+lieth+in+the+magistrate+to+give+and+bestow.+Justice+is+the+very+gift+of+God%2C+which+none+but+God+doth+give+to+men%3A+but+who+is+so+foolish+as+to+gather+thereupon%2C+that+unjust+men%2C+robbers%2C+murderers%2C+and+witches+are+not+to+be+punished%2C+because+the+magistrate+by+punishment+cannot+bestow+righteousness+upon+unrighteous+people%3F%0A%0AWe+must+therefore+make+a+difference+betwixt+faith%2C+as+it+is+the+gift+of+God+in+the+heart+of+man%2C+and+as+it+is+the+outward+profession+uttered+and+declared+before+the+face+of+men.+For+while+false+faith+doth+lurk+and+lie+hid+within+the+heart%2C+and+infecteth+none+but+the+unbeliever%2C+so+long+the+unbelieving+infidel+cannot+be+punished%3A+but+if+this+false+and+forged+faith%2C+that+so+lay+hid%2C+do+once+break+forth+to+blaspheme%2C+to+the+open+tearing+of+God+and+the+infecting+of+his+neighbours%2C+then+must+that+blasphemer+be+by+and+by+plucked+under%2C+and+kept+from+creeping+to+further+annoyance.+Not+to+suppress+such+a+fellow+as+this%2C+is+to+put+a+sword+in+a+madman%E2%80%99s+hand+to+kill+unwise+and+weakly+m

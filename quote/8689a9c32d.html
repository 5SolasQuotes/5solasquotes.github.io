<blockquote><p>Matthew Poole did not live to finish his commentary on the English Bible. His continuator on 1 Corinthians was John Collinges. (See the Wikipedia entry on Poole for more on the continuators; we do not recommend Wikipedia as such, but this article is a good one.) When commenting on 1 Corinthians 11:2-16, Collinges addressed the subject of head-coverings for both men and women:

Having his head covered; i.e. with a hat or cap, or such covering of the head as is in use in the country wherein he liveth. It is not to be understood of the natural covering of the head, which is our hair; nor yet of any other covering which is necessary for the preservation of life and health; but such a covering as he might spare, and is ornamental to him according to the fashion of the country.

Dishonoureth his head; either dishonoureth Christ who is his Head, and whom he ought to represent, and doth as it were make the church the head to Christ, which is subject to him, while by covering his head he declares a subjection in his ministration. Or he dishonoureth his own head, (so many interpret it), to wit, he betrayeth his superiority, lesseneth himself as to that power and dignity which God hath clothed him with, by using a posture which is a token of inferiority and subjection.

Interpreters rightly agree, that this and the following verses are to be interpreted from the customs of countries; and all that can be concluded from this verse is, that it is the duty of men employed in Divine ministrations, to look to behave themselves as those who are to represent the Lord Jesus Christ, behaving themselves with a just authority and gravity that becometh his ambassadors, which decent gravity is to be judged from the common opinion and account of the country wherein they live. So as all which this text requires of Christian ministers, is authority and gravity, and what are external ludications of it.

Our learned Dr. [John] Lightfoot observeth, that the Jewish priests were wont in the worship of God to veil their heads; so that Christian ministers praying or prophesying with their heads covered, Judaized, which he judgeth the reason of the apostle’s assertion. The heathens also, both Romans and Grecians, were wont to minister in their sacred things with their heads covered. Some think this was the reason why the Christians used the contrary gesture; but the apostle’s arguing from the man’s headship, seemeth to import that the reason of this assertion of the apostle was, because in Corinth the uncovered head was a sign of authority. At this day the Mahometans (or Turks) speak to their superiors covered, and so are covered also in their religious performances.

The custom with us in these western parts is quite otherwise; the uncovering of the head is a sign or token of subjection: hence ministers pray and preach with their heads uncovered, to denote their subjection to God and Christ: but yet this custom is not uniform, for in France the Reformed ministers preach with their heads covered; as they pray uncovered, to express their reverence and subjection to God, so they preach covered, as representing Christ, the great Teacher, from whom they derive, and whom they represent. Nothing in this is a further rule to Christians, than that it is the duty of ministers, in praying and preaching, to use postures and habits that are not naturally, nor according to the custom of the place where they live, uncomely and irreverent, and so looked upon.

It is only the general observation of decency (which cannot by any be created, but ariseth either from nature, or custom, and prescription) which this text of the apostle maketh to be the duty of all Christians; though as to the Corinthians, he particularly required the man’s ministering in sacred things with his head uncovered, either to avoid the habit or posture used by Jews and pagans; or for the showing of his dignity and superiority over the woman, (whom we shall by and by find commanded to pray or prophesy covered), or that he represented Christ who was the Head of the church. The uncovering of the head being with them as much a sign of subjection, as it is with us of superiority and pre-eminence. …

With her head uncovered: the uncovered head here (as before) must signify not covered with some artificial covering, such as our quoifs, hats, hoods, or veils, &amp;c., or with her own hair, not hanging loose, but artificially used so as to be a covering. Dishonoureth her head; dishonoureth either her husband, who is her political or economical head, for by that habit she behaveth herself as if she were not one in subjection, and seemeth to usurp an undue authority over the man; or her natural head, it being in those places accounted an immodest thing for a woman to appear in public uncovered. It is observed of Rebekah, when she met Isaac, Gen. xxiv. 65: She took a veil, and covered herself. For that is even all one as if she were shaven; for, saith the apostle, yourselves would judge it an uncomely thing for a woman to be shaven; now to pray or to prophesy with the head uncovered, is all one.

This last clause will incline us to think, that by the uncovered head in this verse, is not only to be understood uncovered with some other covering besides her hair, but with her hair dishevelled, hanging loose at its length, for else it is not all one to have the head uncovered with a hat, or hood, or quoif, and to be shaven; for the apostle afterward saith, 1 Cor. xi. 15, her hair is given to her for a covering or a veil: so that possibly that which the apostle here reflecteth upon, is women’s coming into the public assemblies with their hair hanging loosely down, and not decently wound up so as to make a covering for the head; which, we are told, was the practice of those beastly she-priests of Bacchus, who, like frantic persons, performed those pretendedly religious rites with their hair so hanging loose, and were called manades, because they behaved themselves more like mad persons than such as were in the actual use of their reason: something like which, it is most probable, some women in the Christian church at Corinth affected, against which the apostle here argueth. …

For if the woman be not covered, let her also be shorn: nature itself teacheth, that it is a shameful sight to see a woman revealing the mind and will of God, by an extraordinary pretended revelation, in so indecent a manner, as with her hair all hanging down; let her hair be either shaven off, or at least cut after the manner of men’s hair, if she will neither tie it up artificially, so as to make it a covering for her head, nor put on a veil to cover her: for though a woman prophesying from an extraordinary impulse, be not under the common law of women not speaking in the public assembly, but keeping silence; yet she is under the law of nature to do no such grave and solemn actions in such a rude manner, that from the light of nature, or the common account of all that live in that place, she should be judged to be irreverent and brutish in her religious action.

From this text a question hath been started: Whether Christian women may lawfully go without any other covering upon their heads than their hair? I must confess, I see not how such a question can have any bottom in this text, where the apostle is not speaking of women’s ordinary habiting themselves, but only when they prayed and prophesied, and (if I mistake not) when they ministered in prayer and prophecy (as was said before). We now have no such prophetesses; so as I think that question about the lawfulness of women’s going without any other covering upon their heads than their hair, must be determined from other texts, not this, and is best determined from circumstances; for God having given to the woman her hair for a covering and an ornament, I cannot see how it should be simply unlawful; accidentally it may, from the circumstances of pride in her heart that so dresseth herself, or lust and wantonness in others’ hearts; or other circumstances of ill designs and intentions in the woman so dressing herself.

But if it be a shame for a woman to be shorn or shaven, let her be covered; if nature teacheth us that it is a shame for a woman to be shorn or shaven, it also teacheth us that it is a shame for her to be uncovered, either with her hair, or some artificial covering; which latter seemeth rather to be meant in this place, because divines think, that the face is that part of the head which the apostle here intendeth should be covered in their religious actions, which is not covered with the hair, but with a veil, &amp;c. …

If any man seem to be contentious; if any man hath a mind to quarrel out of a love to show his wit in discoursing what may be said on the other side, or out of a desire to hold up a party, and contradict us. We have no such custom, of women’s praying or prophesying with their heads uncovered, or men’s praying or prophesying with their heads covered; or we have no such custom of contending for these little frivolous things; neither any of the churches of God; and good Christians, in their practices, ought, in things of this nature, to have an eye and regard to the custom of their own church, and also of other Christian churches.</p></blockquote>

veil%3A+so+that+possibly+that+which+the+apostle+here+reflecteth+upon%2C+is+women%E2%80%99s+coming+into+the+public+assemblies+with+their+hair+hanging+loosely+down%2C+and+not+decently+wound+up+so+as+to+make+a+covering+for+the+head%3B+which%2C+we+are+told%2C+was+the+practice+of+those+beastly+she-priests+of+Bacchus%2C+who%2C+like+frantic+persons%2C+performed+those+pretendedly+religious+rites+with+their+hair+so+hanging+loose%2C+and+were+called+manades%2C+because+they+behaved+themselves+more+like+mad+persons+than+such+as+were+in+the+actual+use+of+their+reason%3A+something+like+which%2C+it+is+most+probable%2C+some+women+in+the+Christian+church+at+Corinth+affected%2C+against+which+the+apostle+here+argueth.+%E2%80%A6%0A%0AFor+if+the+woman+be+not+covered%2C+let+her+also+be+shorn%3A+nature+itself+teacheth%2C+that+it+is+a+shameful+sight+to+see+a+woman+revealing+the+mind+and+will+of+God%2C+by+an+extraordinary+pretended+revelation%2C+in+so+indecent+a+manner%2C+as+with+her+hair+all+hanging+down%3B+let+her+hair+be+either+shaven+off%2C+or+at+least+cut+after+the+manner+of+men%E2%80%99s+hair%2C+if+she+will+neither+tie+it+up+artificially%2C+so+as+to+make+it+a+covering+for+her+head%2C+nor+put+on+a+veil+to+cover+her%3A+for+though+a+woman+prophesying+from+an+extraordinary+impulse%2C+be+not+under+the+common+law+of+women+not+speaking+in+the+public+assembly%2C+but+keeping+silence%3B+yet+she+is+under+the+law+of+nature+to+do+no+such+grave+and+solemn+actions+in+such+a+rude+manner%2C+that+from+the+light+of+nature%2C+or+the+common+account+of+all+that+live+in+that+place%2C+she+should+be+judged+to+be+irreverent+and+brutish+in+her+religious+action.%0A%0AFrom+this+text+a+question+hath+been+started%3A+Whether+Christian+women+may+lawfully+go+without+any+other+covering+upon+their+heads+than+their+hair%3F+I+must+confess%2C+I+see+not+how+such+a+question+can+have+any+bottom+in+this+text%2C+where+the+apostle+is+not+speaking+of+women%E2%80%99s+ordinary+habiting+themselves%2C+but+only+when+they+prayed+and+prophesied%2C+and+%28if+I+mistake+not%29+when+they+ministered+in+prayer+and+prophecy+%28as+was+said+before%29.+We+now+have+no+such+prophetesses%3B+so+as+I+think+that+question+about+the+lawfulness+of+women%E2%80%99s+going+without+any+other+covering+upon+their+heads+than+their+hair%2C+must+be+determined+from+other+texts%2C+not+this%2C+and+is+best+determined+from+circumstances%3B+for+God+having+given+to+the+woman+her+hair+for+a+covering+and+an+ornament%2C+I+cannot+see+how+it+should+be+simply+unlawful%3B+accidentally+it+may%2C+from+the+circumstances+of+pride+in+her+heart+that+so+dresseth+herself%2C+or+lust+and+wantonness+in+others%E2%80%99+hearts%3B+or+other+circumstances+of+ill+designs+and+intentions+in+the+woman+so+dressing+herself.%0A%0ABut+if+it+be+a+shame+for+a+woman+to+be+shorn+or+shaven%2C+let+her+be+covered%3B+if+nature+teacheth+us+that+it+is+a+shame+for+a+woman+to+be+shorn+or+shaven%2C+it+also+teacheth+us+that+it+is+a+shame+for+her+to+be+uncovered%2C+either+with+her+hair%2C+or+some+artificial+covering%3B+which+latter+seemeth+rather+to+be+meant+in+this+place%2C+because+divines+think%2C+that+the+face+is+that+part+of+the+head+which+the+apostle+here+intendeth+should+be+covered+in+their+religious+actions%2C+which+is+not+covered+with+the+hair%2C+but+with+a+veil%2C+%26c.+%E2%80%A6%0A%0AIf+any+man+seem+to+be+contentious%3B+if+any+man+hath+a+mind+to+quarrel+out+of+a+love+to+show+his+wit+in+discoursing+what+may+be+said+on+the+other+side%2C+or+out+of+a+desire+to+hold+up+a+party%2C+and+contradict+us.+We+have+no+such+custom%2C+of+women%E2%80%99s+praying+or+prophesying+with+their+heads+uncovered%2C+or+men%E2%80%99s+praying+or+prophesying+with+their+heads+covered%3B+or+we+have+no+such+custom+of+contending+for+these+little+frivolous+things%3B+neither+any+of+the+churches+of+God%3B+and+good+Christians%2C+in+their+practices%2C+ought%2C+in+things+of+this+nature%2C+to+have+an+eye+and+regard+to+the+custom+of+their+own+church%2C+and+also+of+other+Christian+churches.%E2%80%9D%0A%0A%E2%80%94+Matthew+Poole%2C+A+Commentary+on+the+Holy+Bible%2C+%281685%3B+London%3A+Banner+of+Truth%2C+1963%29%2C+3%3A+577-79.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8689a9c32d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8689a9c32d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/01/14/john-collinges-on-head-coverings/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>34. In all Reformed Churches men use[d] to enter into the places of public worship with their hats off [is the claim, in accordance with the Anglican practice that the puritans rejected]. In France the women that are persons of quality unmask themselves. And the devoutest sort both of men and women use[d] to kneel, and make a short prayer for God’s blessing on the service they come to perform, before they sit down; Yet the [Westminster] Directory (though it pretends conformity with them) prohibits these very things, which are likewise used upon the same occasions.

35. In some places all the people stand bare as long as they are in the Church, as in Hungary and Transylvania, where the Prince himself uses to be uncovered. In others they stand bare only during the service, as at Geneva, where they are covered only at sermon. In Poland and Lithuania they sing, and both read and hear the Scripture standing, and they beat their breast at the end of their prayers. Everywhere they use to kneel at prayer [especially in the 1500’s]; and if all do not kneel when they may conveniently, it is scandalous. It was ordered by the last National Assembly of the Reformed Churches of France held at Loudun, that all should be bare-headed whilst the office of baptism is read. Which was not so much a new constitution as the renewing of an old one as may be seen in their Discipline, which will have those censured that shall not uncover themselves when sacraments are celebrated. And although there is too much irreverence in the said Churches both at the administration of sacraments and at all other holy duties performed in the congregation, it is well known that it is against the mind of the ministers, who very often use to reprehend the people for this abuse, and exhort them to behave themselves more reverently in the house of God. By which we may guess what judgement they would make of those of the presbyterian congregations, who never kneel [they rather generally stood at prayer in the 1600’s], and never uncover their heads, or only a little the top or one side of them at prayer… And because this outward reverence is so slighted and almost laughed at by some, though great pretenders to reformation, I think it not amiss to transcribe here at length the very words of the Discipline established in the French Reformed Churches, by which may be seen how much they value it (ch. 10, article 1): ‘That irreverence shall be mended which is seen in many when they are present at Common Prayer in the Church, or at their private prayer in the family, not to uncover their head and not to bend their knees; a thing which is contrary to piety, gives suspicion of pride, and may offend the godly. Wherefore the ministers shall be warned, as likewise the elders and heads of families, to watch carefully, that during the said prayers every one, without exception or acception of persons, do by these outward signs stifie the humility of their hearts, and of that inward homage which they yield unto God.’

36. In the Churches of Lithuania and Polonia, where they have their hats on at sermon, they always put them off at the name of Jesus; and the women, if they be sitting, bow down their head; if they they stand, they make a curtsy. The Reformed Church of Bremen [Germany] do the like. And the same reverence was used at the naming of that holy name by a great many, though not by all, nor always, before the wars in the Palatinate [Germany], and no doubt but they do so still.</p></blockquote>

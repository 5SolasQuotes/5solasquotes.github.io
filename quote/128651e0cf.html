<main class="wrap"><figure class="quote" id="q-128651e0cf" data-kw="">
<blockquote><p>For St. Paul’s baptizing in the house of the jailor had been more fit for him [John Whitgift], for unto his place it may be easily answered that Cornelius, having so great a family, as it is like he had, and besides that diverse soldiors underneath him, and further his friends and his acquaintance which he had called, had a competent number, and as many as would make a congregation, and as could commodiously be preached unto in one place. But the answer to both these examples, and other such like, as that St. Paul baptized in the house of Ananias [Acts 9] is easy. For there being persecutions at that time, so that it was not safe, neither for the minister nor for the people, to be seen, it was meet that they should do it in houses, which otherwise they would have done in open places: and then those houses which receive the congregation are not, as I have showed, for the time to be counted private houses: and further in places where the gospel has not been received, nor no church gathered, but one only household embracing the Gospel, I say in such a case, and especially in the time of persecution, where should the ministers preach, or minister the sacraments more conveniently than in that house where those professors of the gospel be? Now to draw this into our churches, which may safely come into open places, and where the church and congregation stands of diverse households, is a token of greate want of judgment, in shuffling those things together which, for the great diversity of their natures, will not be mingled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Defense of the Answer to the Admonition Against the Reply of T.C., by John Whitgift</cite>, … (London, 1574), p. 513</span></figcaption>

</figure><figure class="quote" id="q-56e591a277" data-kw="">
<blockquote><p>A second general attribution of the Lord’s Supper, from whence it is endeavored [by opponents] to conclude to the sinfulness of giving it, in any case, unto such as are known by the minister to be unworthy receivers [though they have not been convicted by the Session of elders], is, its being a seal of the Covenant of Grace, the righteousnesse of faith. For hence think some, it follows that administration of the Lord’s Supper unto known scandalous and wicked persons, is a practical and visible lie, a confirmation of an untruth, because it seals the Covenant and promises to those who have visibly no share in them. For answer: The Lord’s Supper may be said to be a seal of the Covenant, or promise of grace, either absolutely, or conditionally. The truth of the Covenant and promises in themselves, our obligation to gratitude and obedience, are sealed absolutely by the Lord’s Supper; but interest in the Covenant and promises of grace, the Lord’s Supper seals unto those that partake thereof, but conditionally, so they believe: Unto wicked men the promises are as propounded, so sealed but conditionally. Sacramenta (says [William] Ames) non sunt testimonia completa et absoluta nisi credentibus. They are (says Rutherford) seals unto the wicked, not in actu secundo [by the following act of exercised power], but only in actu primo [in their first act of being, apart from that being exercised]. See Mr. [Stephen] Marshall in his Defence of Infant Baptism Against Tombs, [1646,] pp. 117-8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want of Church-Government</cite>, … (London, 1650), p. 60 Jeanes was an English presbyterian.</span></figcaption>

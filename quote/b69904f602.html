<main class="wrap"><figure class="quote" id="q-b69904f602" data-kw="">
<blockquote><p>When Moses beheld the bush burning with fire, and yet no whit consumed, he wondered at the sight, and said, ‘I will now turn aside and see this great sight, why the bush is not burnt.’ But when God thereupon called unto him out of the midst of the bush, and said, ‘Draw not night hither,’ and told him who He was; Moses trembled, hid his face, and durst not behold God. Yet although being thus warned, we dare not draw so nigh; what doth hinder but we may stand aloof off, and wonder at this great sight? ‘Our God is a consuming fire;’ (Heb. 12:29) says the apostle: and a question we find propounded in the prophet, ‘Who among us shall dwell with the devouring fire? Who among us shall dwell with the everlasting burnings?’… With what astonishment then may we behold our dust and ashes assumed into the undivided unity of God’s own person; and admitted dwell here, as an inmate under the same roof? And yet in the midst of those everlasting burning, the bush to remain unconsumed, and to continue fresh, and green for evermore. Yea, how should not we with Abraham rejoice to see this day, wherein not only our nature in the person of our Lord Jesus is found to dwell for ever in those everlasting burnings; but, in and by Him, our own persons also are brought so night thereunto, that God does set his sanctuary among us, and dwell with us; and (which is much more) makes us ourselves to be the house and habitation, wherein He is pleased to dwell by his Spirit…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystery of the Incarnation in The Whole Works… (1631), vol. 4</cite>, pp. 585-86</span></figcaption>

02.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b69904f602.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/images-of-the-burning-bush-are-unlawful/#:~:text=When%20Moses%20beheld%20the%20bush%20burning,pleased%20to%20dwell%20by%20his%20Spirit&amp;text=When%20Moses%20beheld%20the%20bush%20burning%20with%20fire&amp;text=He%20is%20pleased%20to%20dwell%20by%20his%20Spirit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b07f9bac9e" data-kw="">
<blockquote><p>We have also the holy scriptures which declare unto us the wonderful works of God, by which things we may be lead to the knowledge of God without painted or carved images. Now peradventure some will say that Christ has a body, and likewise have saints, and therefore of them we may have images although of God there can be made no image. And further they wil say that the cause why images were forbid was peril of idolatry, and worshipping of them. So that where there is no such peril, we may have images. Yet as I will not utterly deny but they may be had, so I think it more convenient for Christ’s religion that they should be taken out of Christian men’s churches than that they should be placed in the temple [church building] of God. And of this my opinion I will show you certain good grounds, to the intent that whan you be demanded why we English men have no images in our churches, you may be able to make thereunto a reasonable answer, and that also in time to come you may declare to your children what abuses have crept into the church by the occasion of images…</p></blockquote>

</figure><figure class="quote" id="q-9757f66d0a" data-kw="">
<blockquote><p>Here I shall only give you this caution, Take heed of taking your notions of God from sense, or merely from reason: 1. Not from sense: Spiritual beings fall under no cognisance of the external senses. None ever saw God’s shape; none ever saw his similitude; and here let me caution you, against any pictures of God, or any Person in the Godhead. We are ready in our minds to form ideas in our minds of any beings according to the representations which pictures and images make of them. It is impossible but all pictures, images or external representations of the Divine Being must be teachers of lies. It is impossible that a limner [painter] should draw the true representation of a man whom he never saw. How is it possible he should draw any representation of an invisible God, a Being which he neither ever saw nor can see? The fairest pretence is for the picture of our Saviour, who assumed our nature and was a man in all things. But all those pictures must be teachers of lies too: For Christ was God-Man, and the representation of a man is no representation of the Person of the Mediator. Does any say that upon the same argument there should be no pictures drawn, for a picture does but represent our fleshly part, the soul cannot be expressed. I answer there yet are these differences: 1. The picture of our friend is the representation of a being that we know is or was informed with a reasonable soul, so as the other essential part of the man is on course understood; but it is not so as to Christ. Though the picture of an human shape has this advantage, that we may understand under it a reasonable soul, of which every man is possessed, yet we cannot under any such shape understand the Divine Nature personally united to the human nature. 2. Again even the picture of a man, if it has no similitude of the man, is but a teacher of a lie and does but help our thoughts with false notions and conceptions. And what limner ever saw the Lord in his human shape, to draw a representation of Him? What need any pictures of Christ when every man we see is as true a representation of Him as any limner can make who never saw Him in the flesh, nor a true copy to draw Him by. I am apt to believe that this was one reason of God’s so severe prohibition of images and the likeness of anything to represent God, because He knew that those things would be of this pernicious use, to give us false notions and ideas of God: for you shall observe when you have seen the pretended picture or resemblance of a man, you will fancy him according to that representation, whether the picture be anything like the person for whom it is made, yea or no. 3. To which I might add that admitting a picture of a man or a friend be not like the person and give our fancies a false notion of him, yet in this there is no sin, no defilement, no guilt upon the soul by it; but to conceive amiss of God is a thing quite of another nature and of further danger to the soul. This has made me sometimes wonder that Luther, though he abhorred images, and showed as great a detestation of them as any other, as they are used in Popery, as they are means or objects of adoration; yet allowed the use and standing of them in Churches. Certainly it is a thing of very dangerous consequence, whether in Churches or our own private houses; for we shall find a great proneness in us to form out notions of God according to such representations; and if those representations be lies and false, such will our notions be: and if this be not a fair way to fill the soul with atheistical and blasphemous thoughts concerning God and Christ, I do not know what is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Defensative Armour against Four of Satan’s most fiery Darts, viz. Temptations to atheistical and blasphemous impressions and thoughts, self-murder, despair and presumption… (London: Alsop, 1680), Blasphemous Thoughts, ch. 5</cite>, pp. 41-44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

the Lord in his human shape, to draw a representation of Him? What need any pictures of Christ when every man we see is as true a representation of Him as any limner can make who never saw Him in the flesh, nor a true copy to draw Him by. I am apt to believe that this was one reason of God’s so severe prohibition of images and the likeness of anything to represent God, because He knew that those things would be of this pernicious use, to give us false notions and ideas of God: for you shall observe when you have seen the pretended picture or resemblance of a man, you will fancy him according to that representation, whether the picture be anything like the person for whom it is made, yea or no. 3. To which I might add that admitting a picture of a man or a friend be not like the person and give our fancies a false notion of him, yet in this there is no sin, no defilement, no guilt upon the soul by it; but to conceive amiss of God is a thing quite of another nature and of further danger to the soul. This has made me sometimes wonder that Luther, though he abhorred images, and showed as great a detestation of them as any other, as they are used in Popery, as they are means or objects of adoration; yet allowed the use and standing of them in Churches. Certainly it is a thing of very dangerous consequence, whether in Churches or our own private houses; for we shall find a great proneness in us to form out notions of God according to such representations; and if those representations be lies and false, such will our notions be: and if this be not a fair way to fill the soul with atheistical and blasphemous thoughts concerning God and Christ, I do not know what is.”

— John Collinges, Defensative Armour against Four of Satan’s most fiery Darts, viz. Temptations to atheistical and blasphemous impressions and thoughts, self-murder, despair and presumption… (London: Alsop, 1680), Blasphemous Thoughts, ch. 5, pp. 41-44">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+I+shall+only+give+you+this+caution%2C+Take+heed+of+taking+your+notions+of+God+from+sense%2C+or+merely+from+reason%3A+1.+Not+from+sense%3A+Spiritual+beings+fall+under+no+cognisance+of+the+external+senses.+None+ever+saw+God%E2%80%99s+shape%3B+none+ever+saw+his+similitude%3B+and+here+let+me+caution+you%2C+against+any+pictures+of+God%2C+or+any+Person+in+the+Godhead.+We+are+ready+in+our+minds+to+form+ideas+in+our+minds+of+any+beings+according+to+the+representations+which+pictures+and+images+make+of+them.+It+is+impossible+but+all+pictures%2C+images+or+external+representations+of+the+Divine+Being+must+be+teachers+of+lies.+It+is+impossible+that+a+limner+%5Bpainter%5D+should+draw+the+true+representation+of+a+man+whom+he+never+saw.+How+is+it+possible+he+should+draw+any+representation+of+an+invisible+God%2C+a+Being+which+he+neither+ever+saw+nor+can+see%3F+The+fairest+pretence+is+for+the+picture+of+our+Saviour%2C+who+assumed+our+nature+and+was+a+man+in+all+things.+But+all+those+pictures+must+be+teachers+of+lies+too%3A+For+Christ+was+God-Man%2C+and+the+representation+of+a+man+is+no+representation+of+the+Person+of+the+Mediator.+Does+any+say+that+upon+the+same+argument+there+should+be+no+pictures+drawn%2C+for+a+picture+does+but+represent+our+fleshly+part%2C+the+soul+cannot+be+expressed.+I+answer+there+yet+are+these+differences%3A+1.+The+picture+of+our+friend+is+the+representation+of+a+being+that+we+know+is+or+was+informed+with+a+reasonable+soul%2C+so+as+the+other+essential+part+of+the+man+is+on+course+understood%3B+but+it+is+not+so+as+to+Christ.+Though+the+picture+of+an+human+shape+has+this+advantage%2C+that+we+may+understand+under+it+a+reasonable+soul%2C+of+which+every+man+is+possessed%2C+yet+we+cannot+under+any+such+shape+understand+the+Divine+Nature+personally+united+to+the+human+nature.+2.+Again+even+the+picture+of+a+man%2C+if+it+has+no+similitude+of+the+man%2C+is+but+a+teacher+of+a+lie+and+does+but+help+our+thoughts+with+false+notions+and+conceptions.+And+what+limner+ever+saw+the+Lord+in+his+human+shape%2C+to+draw+a+representation+of+Him%3F+What+need+any+pictures+of+Christ+when+every+man+we+see+is+as+true+a+representation+of+Him+as+any+limner+can+make+who+never+saw+Him+in+the+flesh%2C+nor+a+true+copy+to+draw+Him+by.+I+am+apt+to+believe+that+this+was+one+reason+of+God%E2%80%99s+so+severe+prohibition+of+images+and+the+likeness+of+anything+to+represent+God%2C+because+He+knew+that+those+things+would+be+of+this+pernicious+use%2C+to+give+us+false+notions+and+ideas+of+God%3A+for+you+shall+observe+when+you+have+seen+the+pretended+picture+or+resemblance+of+a+man%2C+you+will+fancy+him+according+to+that+representation%2C+whether+the+picture+be+anything+like+the+person+for+whom+it+is+made%2C+yea+or+no.+3.+To+which+I+might+add+that+admitting+a+picture+of+a+man+or+a+friend+be+not+like+the+person+and+give+our+fancies+a+false+notion+of+him%2C+yet+in+this+there+is+no+sin%2C+no+defilement%2C+no+guilt+upon+the+soul+by+it%3B+but+to+conceive+amiss+of+God+is+a+thing+quite+of+another+nature+and+of+further+danger+to+the+soul.+This+has+made+me+sometimes+wonder+that+Luther%2C+though+he+abhorred+images%2C+and+showed+as+great+a+detestation+of+them+as+any+other%2C+as+they+are+used+in+Popery%2C+as+they+are+means+or+objects+of+adoration%3B+yet+allowed+the+use+and+standing+of+them+in+Churches.+Certainly+it+is+a+thing+of+very+dangerous+consequence%2C+whether+in+Churches+or+our+own+private+houses%3B+for+we+shall+find+a+great+proneness+in+us+to+form+out+notions+of+God+according+to+such+representations%3B+and+if+those+representations+be+lies+and+false%2C+such+will+our+notions+be%3A+and+if+this+be+not+a+fair+way+to+fill+the+soul+with+atheistical+and+blasphemous+thoughts+concerning+God+and+Christ%2C+I+do+not+know+what+is.%E2%80%9D%0A%0A%E2%80%94+John+Collinges%2C+Defensative+Armour+against+Four+of+Satan%E2%80%99s+most+fiery+Darts%2C+viz.+Temptations+to+atheistical+and+blasphemous+impressions+and+thoughts%2C+self-murder%2C+despair+and+presumption%E2%80%A6+%28London%3A+Alsop%2C+1680%29%2C+Blasphemous+Thoughts%2C+ch.+5%2C+pp.+41-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9757f66d0a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9757f66d0a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/images-of-christ/#:~:text=Here%20I%20shall%20only%20give%20you,I%20do%20not%20know%20what%20is&amp;text=Here%20I%20shall%20only%20give%20you%20this%20caution&amp;text=and%20Christ%2C%20I%20do%20not%20know%20what%20is" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

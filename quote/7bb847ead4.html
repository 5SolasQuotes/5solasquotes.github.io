<main class="wrap"><figure class="quote" id="q-7bb847ead4" data-kw="">
<blockquote><p>Christ is, after all, the only food for our souls. He is the substance and essence held forth in the Lord’s Supper. Not simply Christ in himself, however, but specifically as the one crucified for us and handed over unto death. In the words of institution—given for you, shed for you—lies the paramount and virtually entire power of the sacrament. If the body and blood had not been sacrificed once for our redemption and salvation, the distribution of the same would not impart any advantage to us.

We eat Christ, properly and redemptively, only when we eat him crucified and when we grasp the effectual working of his death with a lively awareness. Christ would not have been the bread of life for us if he had not been born for us and died for us; and he would not now be the bread of life if the effectual working and fruit of his birth, death, and resurrection were not eternal and immortal. Indeed, precisely for that reason he surrendered his body for us unto death, so that it would become for us bread for nourishing our spiritual life. The essence or substance of the Lord’s Supper, therefore, is Christ with his death and resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin s Doctrine of the Lord’s Supper’, trans. Nelson D. Kloosterman in Mid-American Journal of Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c40c632b2a" data-kw="">
<blockquote><p>The third innovation is that the word of promise, ‘This is my body,’ ‘This cup is the new testament, etc.’ is not uttered demonstratively when the elements are delivered to every communicant. It is not enough that the words of the institution were rehearsed before by way of history narratively, or materially. This sacrament is an imitation of Christ, not a recital of his words and actions; it is to do as He did, and not to report what He did, says Pierre du Moulin.</p></blockquote>

</figure><figure class="quote" id="q-d8fcc4f03a" data-kw="">
<blockquote><p>This book explores the emergence and development of the extra Calvinisticum in the Reformed tradition by tracing its first exposition from Ulrich Zwingli to early Reformed orthodoxy. Rather than being an ancillary issue, the questions surrounding the extra Calvinisticum were a determinative factor in the differentiation of Magisterial Protestantism into rival confessions. …Over time, Reformed theologians, such as Peter Martyr Vermigli and Antione de Chandieu, articulated the extra Calvinisticum with increasing rigor by incorporating conciliar christology, the church fathers, and scholastic methodology to address the polemical needs of engagement with Lutheranism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/k-j-drake.html">K.J. Drake</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Etiam extra carnem</cite>, (Oxford Univ. Press, 2021)</span></figcaption>

<blockquote><p>For unto those men who incessantly reproach the Christian faith, impiously saying that the human race did not suffer such grievous calamities before the Christian doctrine was promulgated throughout the world, it is easy to find a reply…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0aa27d7a28" data-kw="">
<blockquote><p>3… these forms of sound words are useful, and in some cases are necessary, and so have been used as declarations, not only of what we ourselves believe, but also, of what we judge that all should believe (unless we could think that others might rightly believe that as true, which we in our conscience judge to be false, a goodly piece of our ingenuous, loving-hearted Arminians’ charity) and also desire and require, that all should profess, or at least not openly contradict, with whom we join in nearest Church communion: So it was with the apostles in their canons, Acts 15. And so it is with particular Churches in their articles and confessions to this day; and so may it be always; Ringantur licet et rumpantur Socino-Remonstrantes [Let the Socinians and Remonstrants rage and burst, if they please]. Notwithstanding all the rage and invectives of Socinians, Arminians, Libertines and other sectaries, who will rather disturb, yea and ruin both Churches and States, and snap asunder the sacred bond of peace, than be thus hampered. 4. They [creeds and synopses of theology] are therefore in the 4th place Communionis Tessarae et Judices, not only badges of our Christian Church communion, but also great helps and furtherers of it, whereby uncomfortable divisions may be prevented, and the peace of the Church the better preserved, whilst we all profess the same truth and speak the same thing, being perfectly joined together in the same mind, and the same judgment, 1 Cor. 1:10. The Remonstrants indeed tell us that there are Non pauci pii, et probi, many honest godly men (they mean their own sweet selves and their dear party, for who [are] so honest and godly as they?) who dislike such forms and confessions…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-tuckney.html">Anthony Tuckney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Form of Sound Words’ a sermon on 2 Tim. 1:13 in A Good Day well improved, or Five Sermons upon Acts 9:31</cite>, … to which is annexed a sermon on 2 Tim. 1:13… (London: 1656), pp. 252-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-5048cbc324" data-kw="">
<blockquote><p>…they were chosen to be faithful witnesses to the world of the doings, sufferings and doctrine of Christ: the Holy Ghost was sent to teach them in all truth. Here we may rest upon a sure foundation, against the which the gates of hell cannot prevail… To this antiquity of apostolic doctrine, let us firmly adhere. This is the clearest mirror whereinto the precepts of wholesome doctrine are contained. … those bishops and doctors following, who keep inviolably that form of wholesome doctrine which they received from the apostles, these, I say, alanerly are to be counted true successors of the apostles.</p></blockquote>

</figure><figure class="quote" id="q-4f2f1b7f0b" data-kw="">
<blockquote><p>245. Therefore, the confessions of particular Churches and the decrees and canons of particular synods, and the catecheses of particular Churches and the liturgies or ecclesiastical agendas and similar formulas, their doctrines or declarations are not the immutable and universal norm of faith and truth, according to which it ought to be judged or pronounced what is to be believed and conceded, what is to be repudiated and condemned, what is true or false, orthodox or heretical. For it is not always necessary that what agrees with the confession of some particular Church, synodical decrees, catechesis, liturgy or ecclesiastical agenda, formula of doctrine or some other declaration, is true; nor is it always false what disagrees with it. Therefore, it should not be demanded that all Churches subscribe to the declaration and formula of one particular Church: but indeed those formulas do not even bind one Church or any private person to approve them and to contain themselves within them, except with this condition, insofar as they agree with divine Scripture and universal Symbols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Christian Theology</cite>, tr. ChatGPT-4, with Latin (Hanau, 1609-1610) at Monergism, bk. 1, Theology &amp; Scripture, p. 1,889</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

confessions%20of%20particular%20Churches%20and&amp;text=they%20agree%20with%20divine%20Scripture%20and%20universal%20Symbols" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-20c40102e8" data-kw="Creeds and confessions">
<blockquote><p>To this power belongs the making of public creeds and confessions, which are usually and by synods and presbyteries to preserve the unity and agreement of faith and reject errors. They do not have the same authority as the Scriptures, since they must be compared with and corrected by them. Yet they have even their own memorable weight and ought to be valued very highly by the pious. Both because they contain the sum and foundation of the Christian doctrine and are like barriers against the errors and corruptions which can injure religion. And because they are the bonds of ecclesiastical communion and formulas of consent which testify of the unity of faith and the agreement of churches with each other and are distinguished from unbelievers, as soldiers by marks or watchwords from their enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.30.5</span></figcaption>

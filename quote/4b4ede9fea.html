<blockquote><p>Being though divine, yet possessed of a real and true humanity, it is easy for men, by consulting their familiar experience, to perceive clear the connection betwixt this cause and this consequence in his gracious soul. He is the grand exemplification — the noblest practical exhibition of that standing maxim, that by being ourselves intimate with grief, we learn to succour the wretched; as, if he had never tasted pain, we could hardly have been prevented from a plying to him more than to any other, the reverse of that maxim which is of equal authority, — that those can never enter fully it our sorrow, who have felt nothing like it themselves.

This reference of the inspired writer to a well-known law of our nature gives additional clearness and force to that delightful truth which is I sides so plainly expressed in the former clause of the text, viz: to the compassion of Christ for our afflictions is not the result of merely rational conjecture or estimate of their severity, founded observation of their natural symptoms or effects, as one who has never known ill health may Judge of the violence of another man’s fever:– but that it proceeds from that quick, tender, penetrating thorough sense of our trials, which perfect manhood could not to acquire, by experiencing personally, as tests of his own obedience, the keenness of bodily pain, and the anguish of a wounded spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-maclagan.html">James Maclagan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sympathy of Christ in Reformed Presbyterian</cite></span></figcaption>

<blockquote><p>Their [Israel’s] Political Constitution was Monarchical, Aristocratical, and Democratical: and therefore most prudently and perfectly composed. 1. Monarchical, In that God would still have it Governed by One, as Supreme; viz. First by Moses, then by Joshua, then by Judges, then by Kings, then by Princes and Governors after the Captivity: The raising up and erecting of which Supreme Rulers, God reserved still to himself as Supreme over all.

2. Aristocratical. In that seventy chief, wise, understanding, and known men among their tribes were as Princes set over them as assistants to the Supreme Governor, Moses, &amp;c. 3. Democratical, In that these chief Heads were chosen by the people themselves out of every Tribe. This was the form of their Polity; the best form, and most excellently composed, for preventing of Anarchy, Popular Confusions and Divisions, Arbitrariness, and Tyranny.</p></blockquote>

</figure><figure class="quote" id="q-16dc4bd6a2" data-kw="">
<blockquote><p>But among other things which were prudently and happily done by you, the convocation of the Synod of Dort hath obtained the chief place. Then which Synod for many ages past there hath been none more famous, more holy, nor more profitable to the Church.

Whereunto that ye might call most choice men from divers parts, ye spared neither cost, nor labour; wherein all things were done so orderly and gravely, that it hath drawn the people into admiration, and hath stayed those that were staggering, and hath so troubled headstrong and obstinate persons only with the sight thereof, that they which before did seem to be desirous of the conflict, and greedily to call for the encounter, have by contrary practices, (whether fear stroke them, or their conscience affrighted them) begun to shun the hearing of the cause, to hate the light, and to work delays.

To so excellent a thing, both other Princes did exhort you, and especially the most renowned Prince JAMES, King of great Britain, who hath always been most earnest and forward to drive away the errors of all innovators; who as he is rightly styled the Defender of the Faith, so he hath his eyes vigilant on all sides, carefully watching lest Christian faith should any where receive any damage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), xiv-xv.</span></figcaption>

athanael+Newbery%2C+1635%29%2C+xiv-xv.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16dc4bd6a2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16dc4bd6a2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/12/13/pierre-du-moulin-on-the-synod-of-dort-and-james-i/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-1cf524a599" data-kw="">
<blockquote><p>There are his rights of conscience, and more especially the right of judging for himself what is his duty and what his sin in reference to God, and of determining for himself what he shall believe as God’s truth, and what reject as man’s doctrine and commandment. There are the rights of his soul, and more especially the right to that salvation which his soul requires, and which is freely given him of God.

These are rights intimately spiritual nature, which are dearer and better to him than property or life; and these rights the Church of Rome, in the exercise of its ecclesiastical power, has rudely trampled on, or violently taken away. And the history of that Church tells on its every page, and in characters never to be effaced, that the spiritual power committed to it “for edification” has been turned “ to the destruction” of the body of Christ.

First, Popery has turned the power of the Church to the purposes of destruction, by violently taking away or rudely disregarding the rights of man, viewed as a rational and intellectual being. The right of every man to think and to judge for himself, and on his own responsibility, as a rational creature, Popery has taken away from its victims; and above all, the right to know God directly and immediately, by what God has made known of Himself, the Church of Rome has denied, and by its ecclesiastical power interdicted to its slaves.

Itself blind, and the leader of the blind, who have trusted it, the Church of Rome has “taken away the key of knowledge,” lest men should exercise their right to know God, and see for themselves His revealed will. It has sealed up the Bible as a perilous book, and forbidden men to receive it, except through the interpretation and teaching of the Church; thus standing between men and the knowledge of God in the way that God has given that knowledge in His own word.

It is the first right of every human being, as a rational and intellectual creature, to understand God; because this was the very end for which he was made, and for which he lives. It was the distinctive purpose of his creation; and it is not only to degrade him from his place in creation, but to destroy his very character as a rational creature, to take from him by violence and wrong the right he has to know God in the way in which God has made Himself to be known. A power so employed as to rob man by force or fraud of this right, and to substitute the teaching of a fellow-creature for the Word of God addressed to his understanding, is a power exercised not for edification, but destruction.</p></blockquote>

— James Bannerman, The Church of Christ: A Treatise on the Nature, Powers, Ordinances, Discipline, and Government of the Christian Church, ed. D. Douglas Bannerman (2 vols, Edinburgh: T &amp; T Clark, 1868), 1: 258-59.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+are+his+rights+of+conscience%2C+and+more+especially+the+right+of+judging+for+himself+what+is+his+duty+and+what+his+sin+in+reference+to+God%2C+and+of+determining+for+himself+what+he+shall+believe+as+God%E2%80%99s+truth%2C+and+what+reject+as+man%E2%80%99s+doctrine+and+commandment.+There+are+the+rights+of+his+soul%2C+and+more+especially+the+right+to+that+salvation+which+his+soul+requires%2C+and+which+is+freely+given+him+of+God.%0A%0AThese+are+rights+intimately+spiritual+nature%2C+which+are+dearer+and+better+to+him+than+property+or+life%3B+and+these+rights+the+Church+of+Rome%2C+in+the+exercise+of+its+ecclesiastical+power%2C+has+rudely+trampled+on%2C+or+violently+taken+away.+And+the+history+of+that+Church+tells+on+its+every+page%2C+and+in+characters+never+to+be+effaced%2C+that+the+spiritual+power+committed+to+it+%E2%80%9Cfor+edification%E2%80%9D+has+been+turned+%E2%80%9C+to+the+destruction%E2%80%9D+of+the+body+of+Christ.%0A%0AFirst%2C+Popery+has+turned+the+power+of+the+Church+to+the+purposes+of+destruction%2C+by+violently+taking+away+or+rudely+disregarding+the+rights+of+man%2C+viewed+as+a+rational+and+intellectual+being.+The+right+of+every+man+to+think+and+to+judge+for+himself%2C+and+on+his+own+responsibility%2C+as+a+rational+creature%2C+Popery+has+taken+away+from+its+victims%3B+and+above+all%2C+the+right+to+know+God+directly+and+immediately%2C+by+what+God+has+made+known+of+Himself%2C+the+Church+of+Rome+has+denied%2C+and+by+its+ecclesiastical+power+interdicted+to+its+slaves.%0A%0AItself+blind%2C+and+the+leader+of+the+blind%2C+who+have+trusted+it%2C+the+Church+of+Rome+has+%E2%80%9Ctaken+away+the+key+of+knowledge%2C%E2%80%9D+lest+men+should+exercise+their+right+to+know+God%2C+and+see+for+themselves+His+revealed+will.+It+has+sealed+up+the+Bible+as+a+perilous+book%2C+and+forbidden+men+to+receive+it%2C+except+through+the+interpretation+and+teaching+of+the+Church%3B+thus+standing+between+men+and+the+knowledge+of+God+in+the+way+that+God+has+given+that+knowledge+in+His+own+word.%0A%0AIt+is+the+first+right+of+every+human+being%2C+as+a+rational+and+intellectual+creature%2C+to+understand+God%3B+because+this+was+the+very+end+for+which+he+was+made%2C+and+for+which+he+lives.+It+was+the+distinctive+purpose+of+his+creation%3B+and+it+is+not+only+to+degrade+him+from+his+place+in+creation%2C+but+to+destroy+his+very+character+as+a+rational+creature%2C+to+take+from+him+by+violence+and+wrong+the+right+he+has+to+know+God+in+the+way+in+which+God+has+made+Himself+to+be+known.+A+power+so+employed+as+to+rob+man+by+force+or+fraud+of+this+right%2C+and+to+substitute+the+teaching+of+a+fellow-creature+for+the+Word+of+God+addressed+to+his+understanding%2C+is+a+power+exercised+not+for+edification%2C+but+destruction.%E2%80%9D%0A%0A%E2%80%94+James+Bannerman%2C+The+Church+of+Christ%3A+A+Treatise+on+the+Nature%2C+Powers%2C+Ordinances%2C+Discipline%2C+and+Government+of+the+Christian+Church%2C+ed.+D.+Douglas+Bannerman+%282+vols%2C+Edinburgh%3A+T+%26+T+Clark%2C+1868%29%2C+1%3A+258-59.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1cf524a599.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1cf524a599.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/01/26/james-bannerman-on-popery-and-the-rights-of-man/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

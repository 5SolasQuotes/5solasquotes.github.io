<blockquote><p>§ 9. I now come to consider what apprehensions modern writers have had of schism… I choose one, whom, I think my [episcopal] antagonist will not except against, the learned Bishop of Worcester, in his Irenic. p. 109, the sum of whose discourse is: all are bound to join into some Church society; and being so joined, should continue in that society till his communion with them becomes sin. Now for what makes it sin to continue in Church communion, and consequently warrants separation; he supposes that corruption in the essentials of the constitution of the Church may warrant it…</p></blockquote>

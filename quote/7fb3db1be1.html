<blockquote><p>‘the first day’ …This first day consisting of twenty four hours had (as some think) for the first half of it the precedent [preceeding] darkness, and for the other the light newly created: the night they take to be meant by evening, a part of it, and the day by the morning which is part of it also: and according to this the Sabbath (being as large a day as any of the rest, and so containing twenty four hours) is measured from even to even, Lev. 23:32; the Romans and other Western nations reckon the twenty four hours from mid-night to mid-night; the Egyptians contrariwise from mid-day to mid-day. Yet it may be with good probability thought that at the first (according to the Chaldean account, which is quite contrary to that of the Jews’ forecited, measuring the day from sunrising to sunrising) the day natural began with the light: for even is the declining light of the foregoing day; and the morning may as well be called the end of the night past, as the beginning of the day following: and so diverse of the learned by the evening understand the day, as the end thereof; and by morning the night, at which time it is at an end: for denominations are many times taken from the end, because thereby the thing is made complete: so the whole week is called by the name Sabbath, Lev. 23:15 &amp; Mt. 18:12, because with it the week is wholly made up and fully finished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ley.html">John Ley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the books of the Old &amp; New Testament (London: Legatt, 1645), On Genesis | on Gen.</cite>, 1:5</span></figcaption>

ote/01e6c1732d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=%E2%80%98the%20first%20day%E2%80%99%20%E2%80%A6This%20first%20day,wholly%20made%20up%20and%20fully%20finished." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Secondly, that which is the only foundation of a scruple in this case, is a principle most unreasonable in itself, that we are to embrace nothing for truth, though divinely revealed, but what our reason is able to comprehend, as to the nature of the thing, and the manner of its existence; on which account the doctrine of the Trinity, Incarnation, Satisfaction, and consequently the whole mystery of the Gospel of Christ must be rejected as incredible, and that on this bare pretense, because although many expressions in Scripture seem to import all these things, yet we are bound to interpret them to another sense, because this is incongruous to our reason. But although Christianity be a religion which comes in the highest way of credibility to the minds of men, although we are not bound to believe anything but what we have sufficient reason to make it appear that it is revealed by God, yet that anything should be questioned whether it be of divine revelation, merely because our reason is to seek, as to the full and adaequate conception of it, is a most absurd and unreasonable pretence: And the assertors of it must run themselves on these unavoidable absurdities: First, of believing nothing either in nature or religion to be true, but what they can give a full and satisfactory account of, as to every mode and circumstance of it. Therefore let such persons first try themselves in all the appearances of nature: And then we may suppose they will not believe that the sun shines, till they have by demonstrative arguments proved the undoubted truth of the Ptolomaic or Copernican hypothesis, that they will never give credit to the flux and reflux of the Sea, till they clearly resolve the doubts which attend the several opinions of it. That there is no such thing as matter in the world, till they can satisfactorily tell us how the parts of it are united; nor that there are any material beings, till they have resolved all the perplexing difficulties about the several affections of them; and that themselves have not so much as a rational soul, till they are bound to satisfy us of the manner of the union of the soul and body together. And if they can expedite all these, and many more difficulties about the most obvious things…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Origines Sacræ, or, A Rational Account of the Grounds of Christian Faith... (London, 1662), bk. 2, ch. 8</cite>, pp. 233-34</span></figcaption>

</figure><figure class="quote" id="q-babe6f6031" data-kw="">
<blockquote><p>Concerning the mode of creation, insofar as it indeed pertains to the efficient, it must be held that God did not always create—otherwise the creature would be coeternal with the creator. But He began to create at the beginning of time, as Moses speaks, Gen. 1:1, “In the beginning”; from which beginning John speaks, Jn. 1:1, from which beginning creation is called the beginning of Jehovah’s way, Prov. 8:22. And when He began, He did not pass from idleness to work, from potency to act. But the creature, which was in potency, and that only negative, was brought into act and existed in act. … I. That the creation of individual things was made in an instant, as they say, or moment of time, in respect to God the creator, because in creating He employed the omnipotent Word. … The subject creation concerned were creatures, to be produced by the power of God. The subject, however, in which, there was initially none, because, no creature existing, there existed also no place. Afterward, however, with the creature place began: common indeed to all creatures, the world; proper, however, to certain ones: heaven, water, earth, Gen. 1:1, 14, 20, 24. … II. Finitude is in place and time. In place, because all creatures, inasmuch as they are finite in essence, occupy some space, whether corporeal or spiritual, according to the condition of their nature, Gen. 1 throughout. In time, because they both began in time, Gen. 1:1, and as long as they exist, they are subject to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alting.html">Johann H. Alting</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scriptural Theology of Heidelberg, vol. 1 (d. 1644; Amsterdam: Jansson, 1646), Locus 5, ‘On Creation’, trans. AI at Confessionally Reformed Theology</cite></span></figcaption>

<blockquote><p>The end of creation is double: supreme and subaltern. The supreme is the glory of God the creator, Prov. 16:4; Ps. 8:1; 19:1; 145:10; Rom. 11:36. The subaltern is the communication and manifestation of the same. For in the works of creation God both communicated his goodness, because He made all things very good, Gen. 1:31…</p></blockquote>

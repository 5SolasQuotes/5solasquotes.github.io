<main class="wrap"><figure class="quote" id="q-b0607bde05" data-kw="">
<blockquote><p>‘God’ the Father ‘so loved,’ had such a peculiar, transcendent love, being an unchangeable purpose and act of his will concerning their salvation, towards ‘the world,’ miserable, sinful, lost men of all sorts, not only Jews but Gentiles also, which he peculiarly loved, ‘that,’ intending their salvation, as in the last words, for the praise of his glorious grace, ‘he gave,’ he prepared a way to prevent their everlasting destruction, by appointing and sending ‘his only-begotten Son’ to be an all-sufficient Saviour to all that look up unto him, ‘that whosoever believeth in him,’ all believers whatsoever, and only they, ‘should not perish, but have everlasting life,’ and so effectually be brought to the obtaining of those glorious things through him which the Lord in his free love had designed for them.”

In which enlargement of the words, for the setting forth of what we conceive to be the mind of the Holy Ghost in them, these things are to be observed:—

First, What we understand by the “love” of God, even that act of his will which was the cause of sending his Son Jesus Christ, being the most eminent act of love and favour to the creature; for love is velle alicui bonum, “to will good to any.” And never did God will greater good to the creature than in appointing his Son for their redemption. Notwithstanding, I would have it observed that I do not make the purpose of sending or giving Christ to be absolutely subordinate to God’s love to his elect, as though that were the end of the other absolutely, but rather that they are both co-ordinate to the same supreme end, or the manifestation of God’s glory by the way of mercy tempered with justice; but in respect of our apprehension, that is the relation wherein they stand one to another. Now, this love we say to be that, greater than which there is none.

Secondly, By the “world,” we understand the elect of God only, though not considered in this place as such, but under such a notion as, being true of them, serves for the farther exaltation of God’s love towards them, which is the end here designed; and this is, as they are poor, miserable, lost creatures in the world, of the world, scattered abroad in all places of the world, not tied to Jews or Greeks, but dispersed in any nation, kindred, and language under heaven.

Thirdly, Ἵνα πᾶς ὁ πιστεύων, is to us, “that every believer,” and is declarative of the intention of God in sending or giving his Son, containing no distribution of the world beloved, but a direction to the persons whose good was intended, that love being an unchangeable intention of the chiefest good.

Fourthly, “Should not perish, but have life everlasting,” contains an expression of the particular aim and intention of God in this business; which is, the certain salvation of believers by Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Salus Electorum, Sanguis Jesu: or, The Death of Death in the Death of Christ</cite>, (1647), Book 4.2 in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1967), 10: 320-21.</span></figcaption>

<blockquote><p>Most broadly understood it [a condition] includes anything that is required in any way for the covenant of grace, whether: (1) antecedently, and as it were in a preparatory fashion, in which sense the hearing of the promulgated covenant, a general assent given to the divine Word, a conviction of the necessity of the covenant of grace, an effectual call to faith (prior to faith, if not in time, at least in nature), an acknowledgement and sense of one’s misery, a godly desperation about oneself and all things outside the Mediator, and so forth, can be called a condition. Or, (2) concomitantly, in which manner self-denial (Lk. 9:23; Phil. 3:4–12), the exercise of repentance (Mk. 1:15; Acts 2:38–39), and so forth, can be taken as a condition. Or, (3) consequently, as covenantal duties, in which sense evangelical obedience (cf. Gen. 12:1–3; 15:18; 17:1–2; 9:1–15) and renewal of repentance (Dt. 30:1–9 with 29:24 to the end) can be admitted as a condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 4, pt. 1, bk. 5, ch. 1, ‘The Covenant of Grace’, sect. XXII, ‘What the condition of the covenant of grace is’, p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/conditions-of-the-covenant.html">Conditions of the Covenant</a></span></div>

<blockquote><p>It is very plain that any plan designed to secure the salvation of an elect portion of a race propagated by generation and living in association, as is the case with mankind, cannot secure its end without greatly affecting, for better or for worse, the character and destiny of all the rest of the race not elected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Grace (outline)</cite>, C. COMMON GRACE AND THE ATONING WORK OF CHRIST, And it is but natural that this should be so. If Christ was to save an elect race, gradually called out of the world of humanity in the course of centuries, it became necessary for God to exercise forbearance, to check the course of evil, to promote the development of the natural powers of man, to keep alive within the hearts of men a desire for civil righteousness, for external morality and good order in society, and to shower untold blessings upon mankind in general. Dr. [Charles] Hodge expresses it thus:</span></figcaption>

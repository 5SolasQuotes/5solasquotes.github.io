<main class="wrap"><figure class="quote" id="q-316d33ca96" data-kw="">
<blockquote><p>Observation 5. Christ the Bridegroom and His Father are very willing to have the match made up and the marriage completed… therefore they expostulate when this marriage is refused, “O Jerusalem, Jerusalem, how often would I have gathered you, but you would not!” (Mt. 23:37). “O Jerusalem, Jerusalem, if thou, even thou, hadst known in this thy day the things that belong to thy peace!” (Lk. 19:42). All these sad complaints, that Israel would not hearken to his voice, and his people would have none of Him (Ps. 81:11), that He came to His own, and His own received Him not (Jn. 1:11), and that they will not come to Him that they might have life (Jn. 5:40), make out His willingness abundantly and undeniably.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unsearchable Riches of Christ</cite>, (1764; Soli Deo Gloria, 2002), sermon 3, ‘Gospel Presentations are the Strongest Invitations’, p. 55 on Mt. 22:4, ‘All things are ready; come to the marriage.’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-d03f9558bd" data-kw="">
<blockquote><p>I answer that, It is necessary to assign an appetitive power to the soul. To make this evident, we must observe that some inclination follows every form: for example, fire, by its form, is inclined to rise, and to generate its like. Now, the form is found to have a more perfect existence in those things which participate knowledge than in those which lack knowledge. For in those which lack knowledge, the form is found to determine each thing only to its own being—that is, to its nature. Therefore this natural form is followed by a natural inclination, which is called the natural appetite. But in those things which have knowledge, each one is determined to its own natural being by its natural form, in such a manner that it is nevertheless receptive of the species of other things: for example, sense receives the species of all things sensible, and the intellect, of all things intelligible, so that the soul of man is, in a way, all things by sense and intellect: and thereby, those things that have knowledge, in a way, approach to a likeness to God, in Whom all things pre-exist, as Dionysius says (Div. Nom. v). Therefore, as forms exist in those things that have knowledge in a higher manner and above the manner of natural forms; so must there be in them an inclination surpassing the natural inclination, which is called the natural appetite. And this superior inclination belongs to the appetitive power of the soul, through which the animal is able to desire what it apprehends, and not only that to which it is inclined by its natural form. And so it is necessary to assign an appetitive power to the soul. … Reply Obj. 2: What is apprehended and what is desired are the same in reality, but differ in aspect [ratione]: for a thing is apprehended as something sensible or intelligible, whereas it is desired as suitable or good. Now, it is diversity of aspect in the objects, and not material diversity, which demands a diversity of powers. Reply Obj. 3: Each power of the soul is a form or nature, and has a natural inclination to something. Wherefore each power desires by the natural appetite that object which is suitable to itself. Above which natural appetite is the animal appetite, which follows the apprehension, and by which something is desired not as suitable to this or that power, such as sight for seeing, or sound for hearing; but simply as suitable to the animal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 80, Appetitive Powers in General, art. 1, Whether the appetite is a special power of the soul?</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<main class="wrap"><figure class="quote" id="q-b37d09fdd4" data-kw="">
<blockquote><p>From this interpretation of Andrada I now finally understand what the Tridentine decree is after when it declares that justification consists of two parts, remission of sins and renewal, because they nevertheless say not long afterward that the sole formal cause of justification is the renewal, or love.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41a65a8c0f" data-kw="">
<blockquote><p>For they again affirm that we are truly righteous, and not merely counted so. I, on the contrary, while I admit that we are never received into the favor of God without being at the same time regenerated to holiness of life, contend that it is false to say that any part of righteousness (justification) consists in quality, or in the habit which resides in us, and that we are righteous (justified) only by gratuitous acceptance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the formal cause)</span></figcaption>

</figure><figure class="quote" id="q-835360d60a" data-kw="">
<blockquote><p>We attribute justification to neither faith otherwise than as an instrument, nor to good works otherwise than as witnesses of true faith. Instead, we attribute the righteousness of Christ alone as the material cause, and imputation as the formal cause.</p></blockquote>

</figure><figure class="quote" id="q-4383460b36" data-kw="">

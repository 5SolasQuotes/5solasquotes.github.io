<main class="wrap"><figure class="quote" id="q-a0c02fe67f" data-kw="Communion|Faith|Submission" data-pol="">
<blockquote><p>On the part of the saints, it is their free, willing consent to receive, embrace, and submit to the Lord Jesus, as their husband, Lord, and Saviour—to abide with him, subject their souls to him, and to be ruled by him for ever.</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Communion with God</cite>, Part 2, ch. 3, “We Freely Embrace Him”</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a469aee8d1" data-kw="Faith" data-pol="">
<blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</figcaption>

</figure><figure class="quote" id="q-6c7372b0c9" data-kw="Perseverance|Comfort" data-pol="">
<blockquote><p>Christ your Head is risen, therefore you cannot be lost: nay, he is not only risen from the dead himself, but is also &quot;become the first-fruits of them that slept,&quot; 1 Cor. 15: 20. Believers are his members, his fulness, he cannot therefore be complete without you: a part of Christ cannot perish in the grave, much less burn in hell. Remember, when you feel the natural union dissolving, that this mystical union can never be dissolved: the pangs of death cannot break this tye.</p></blockquote>
<figcaption>— <a href="../authors/john-flavel.html">John Flavel</a>, <cite>The Method of Grace</cite>, Sermon 2 (John 17:23), Inference 7</figcaption>

</figure><figure class="quote" id="q-fd92ded097" data-kw="Assurance|Election|Holy Spirit" data-pol="">
<blockquote><p>When the Holy Ghost sealeth a man up, the thing he makes known, the thing he sealeth to him is this, that he is in Christ, that he hath been elected in Christ by God the Father from everlasting, that he is one in Christ; he was one with him from everlasting, he was one with him when he hung upon the cross, he is one with him now in heaven.</p></blockquote>
<figcaption>— <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a>, <cite>An Exposition of the First Chapter of Ephesians (Works, vol. 1)</cite>, Sermon XVI (Eph. 1:13)</figcaption>

</figure><figure class="quote" id="q-13755d1246" data-kw="Comfort|Justice|Assurance" data-pol="">
<blockquote><p>Let us oft think of this nearness between Christ and us, if we have once given our names to him, and not be discouraged for any sin or unworthiness in us. Who sues a wife for debt, when she is married? Uxori lis non intenditur. Therefore answer all accusations thus:—&#x27;Go to Christ.&#x27; If you have anything to say to me, go to my husband. God is just, but he will not have his justice twice satisfied, seeing whatsoever is due thereunto is satisfied by Christ our husband. What a comfort is this to a distressed conscience! If sin cannot dismay us, which is the ill of ills and cause of all evil, what other ill can dismay us?</p></blockquote>
<figcaption>— <a href="../authors/richard-sibbes.html">Richard Sibbes</a>, <cite>Union with Christ (Bowels Opened)</cite>, Sermon II (Song 5:1)</figcaption>

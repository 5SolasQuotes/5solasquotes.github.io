<blockquote><p>5. Now, if we choose to investigate whether it is right to administer baptism to infants, shall we not say that a man is talking nonsense or indeed raving who would halt with the mere element of water and outward observance, but cannot bear to turn his mind to the spiritual mystery? If any account of this is made, it will be evident that baptism is properly administered to infants as something owed to them. For in early times the Lord did not deign to have them circumcised without making them participants in all those things which were then signified by circumcision [cf. Gen. 17:12]. Otherwise, he would have mocked his people with mere trickery if he had nursed them on meaningless symbols, which is a dreadful thing even to hear of. For he expressly declares that the circumcision of a tiny infant will be in lieu of a seal to certify the promise of the covenant. But if the covenant still remains firm and steadfast, it applies no less today to the children of Christians than under the Old Testament it pertained to the infants of the Jews. Yet if they are participants in the thing signified, why shall they be debarred from the sign? If they grasp the truth, why shall they be driven away from the figure? Notwithstanding, the outward sign so cleaves to the word in the sacrament that it cannot be separated from it; yet if the sign is considered separately from the word, which, I ask you, shall we esteem more? Obviously, since we see that the sign serves the word, we shall say that it is under the word, and shall relegate it to a lower place. Therefore, since the word “baptism” is applied to infants, why shall the sign, which is an appendix of the word, be denied to them? This one reason, if no others were at hand, would be quite enough to refute all those who would speak in opposition. The objection that there was a stated day for circumcision is sheer evasion. We admit that we are not now bound to certain days like the Jews; but since the Lord, without fixing the day, yet declares that he is pleased to receive infants into his covenant with a solemn rite, what more do we require? 6. Yet Scripture opens to us a still surer knowledge of the truth. Indeed, it is most evident that the covenant which the Lord once made with Abraham [cf. Gen. 17:14] is no less in force today for Christians than it was of old for the Jewish people, and that this word relates no less to Christians than it then related to the Jews. Unless perhaps we think that Christ by his coming lessened or curtailed the grace of the Father—but this is nothing but execrable blasphemy! Accordingly, the children of the Jews also, because they had been made heirs of his covenant and distinguished from the children of the impious, were called a holy seed [Ezra 9:2; Isa. 6:13]. For this same reason, the children of Christians are considered holy; and even though born with only one believing parent, by the apostle’s testimony they differ from the unclean seed of idolators [1 Cor. 7:14]. Now seeing that the Lord, immediately after making the covenant with Abraham, commanded it to be sealed infants by an outward sacrament [Gen. 17:12], what excuse will Christians give for not testifying and sealing it in their children today? And let no one object against me that the Lord did not command that his covenant be confirmed by any other symbol than circumcision, which has long since been abolished. There is a ready answer that for the time of the Old Testament he instituted circumcision to confirm his covenant, but that after circumcision was abolished, the same reason for confirming his covenant (which we have in common with the Jews) still holds good. Consequently, we must always diligently consider what is common to both, and what they have apart from us. The covenant is common, and the reason for confirming it is common. Only the manner of confirmation is different—what was circumcision for them was replaced for us by baptism. Otherwise, if the testimony by which the Jews were assured of the salvation of their posterity is taken away from us, Christ’s coming would have the effect of making God’s grace more obscure and less attested for us than it had previously been for the Jews. Now, this cannot be said without grievously slandering Christ, through whom the Father’s infinite goodness was more clearly and liberally poured out upon the earth and declared to men than ever before. And if so, we must admit that at least it should not be concealed with more malign intent, nor revealed with weaker testimony than under the dim shadows of the law.</p></blockquote>

<blockquote><p>5. That we must not dote upon sensible consolation. The merciful nature of God should be a support to us though we see nothing of the effects of it in the course of his dealings with us; and we should believe his love when we do not actually feel it. Job 10:13, ‘And these things hast Thou hid in thine heart; I know that this is with Thee.’ He speaks of his favorable inclination to show pity to his creatures. We are not able always to reconcile his present dispensations with his gracious nature, nor our former experience of his goodnessת yet faith must not quit its holdfast but we must see what is hid in God’s heart and comfort ourselves with concealed favor and mercy, when we cannot comfort ourselves with felt favor and mercy. Though mercies be not visible and obvious to sense, yet the disposition and inclination is ever in God unchangeable and sure. A withdrawn God is a merciful God still.</p></blockquote>

</figure><figure class="quote" id="q-f9ab762637" data-kw="">
<blockquote><p>6. For the ground and warrant of Christ’s willingness to save and draw sinners, do but consider: 1. The words of the text, ‘I will draw all men to Me;’ it is as if He would say, ‘I will baulk no nation, nor any man upon a national respect;’ the first covenant to the Jews suffered a mighty exception: What is God, the God of the Jews only? Have all the nations of the earth done with their part of heaven and salvation, but only the narrow trinket and bit of the earth in poor little Judea? This made the Gospel despised and liable to sad and heavy calumnies. Christ must have narrow bowels, and must be ebb, short, and thin in free grace if the matter be so. Nay but, Christ has mercy for all men: ‘I will draw all men,’ that is, multitudes of Jews and gentiles: for that Christ draws all and every one without exception, and that by his death, is against Scripture and experience; but He has an ‘all’ that he draws: Tit. 2:11, ‘The grace of God has appeared to all men [Greek]; what grace? the teaching grace of God that teaches us to wait for the blessed hope and the appearance of the glory and of our Savior Jesus Christ: sure, this must bee the preached Gospel; now the Gospel by Scripture experience, [and by] consent of Arminians, never appeared, in the least sound, to all and every son of Adam; then Christ must have another ‘all,’ a fair and numerous multitude whom He saves and draws, and this says He, had a good will to save all, and that his elect ones believe… 2. Christ is willing to take away all heart-exceptions of unbelief from men, as… Eze. 33, The people slandered the Lord, He delighted so to have the people pine away in their iniquities, that He would punish them for no fault, but the children’s teeth should be set on edge for the sins of the father and the grapes that they eat not themselves. The Lord answers that calumny, Eze. 18, ‘And here, as I live, I delight not so (so as you slanderously, and blasphemously say) in the death of a sinner, by my life, I desire you may repent and live, nor have I pleasure to punish innocent men, for no sin at all.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: J.D., 1647), pt. 3, pp. 445-47</span></figcaption>

<blockquote><p>7. By forgetting that God will have all men’s own wills, by choosing or refusing, to have more hand in their welfare or misery than other men’s: And if they mischoose, the sin will be their own.</p></blockquote>

<blockquote><p>…we most heartily wish any disease of this Church to be timeously prevented and cured. But withal we wish this to be done without a rupture, and such a dangerous division… which in itself is a sore disease, and from which in holy Scripture we are often and very earnestly dehorted. Dionysius [†264], Bishop of Alexandria, in his epistle to Novatus, recorded by Eusebius, Histories, bk. 6, ch. 45, worthily says: ‘You ought rather to have suffered anything whatsoever for avoiding of cutting asunder the Kirk of God: and martyrdom for keeping the Kirk from schism is no less glorious than which is suffered for not committing idolatry. And in my opinion also it is greater: for in suffering martyrdom for not committing idolatry, a man suffers for one, even for his own soul; but here a man suffers martyrdom for the whole Kirk.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aberdeen-doctors.html">Aberdeen Doctors</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Duplies of the Ministers &amp; Professors of Aberdeen to Second Answers of some Reverend Brethren, concerning the Late [National] Covenant (Aberdeen: Raban, 1638), “First Duply”</cite>, p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

 Online</a></div>
</figure><figure class="quote" id="q-cd99261633" data-kw="">
<blockquote><p>To put forward a more refined and true principle in alternative to [George] Gillespie’s: Things less than fully good, or impure, not inherently wrong, may in some circumstances, especially according to the degree of necessity, be personally, materially done, even in worship, public worship and Church government (though they occasion passive scandal in some), for the good in the things themselves and for attaining higher and weightier goods (in proportion to that degree), while seeking to avoid the greater hurt and scandal, without approving the impurities or what may be deficient in them. [John] Sprint essentially affirmed this principle, while Gillespie essentially denied it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<blockquote><p>3rd Caution. One and the same commandment in some things binds the conscience more straitly, and in doing some other things less: Gal. 6:10, ‘Do good to all men, but specially them that be of the household of faith.’ Hence it arises that though all sins be mortal and deserve eternal death, yet all are not equal, but some more grievous than others.</p></blockquote>

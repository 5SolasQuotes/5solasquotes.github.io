<main class="wrap"><figure class="quote" id="q-4f42522e02" data-kw="">
<blockquote><p>Now the book of life in this place must not be so strictly taken as if it included those only that were elect of God to eternal life, but must be understood of that book wherein are recorded the rules and bounds of visible church-communion; and so all those that, through the gifts and operations of special or common grace, do fall within the compass of those rules and bounds. Thus it was in the type at the return out of captivity, none were to be admitted entrance into the church but those that could show their privileges by genealogy and the records of the church; and to others it was said that they had neither portion, nor lot, nor memorial, in Jerusalem (Ezr. 2:62,63; Neh. 7:64,65; 2:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol., 3:449</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5785375741" data-kw="">
<blockquote><p>The origin of the doctrine of common grace was occasioned by the fact that there is in the world, alongside of the course of the Christian life with all its blessings, a natural course of life, which is not redemptive and yet exhibits many traces of the true, the good, and the beautiful. The question arose, How can we explain the comparatively orderly life in the world, seeing that the whole world lies under the curse of sin? How is it that the earth yields precious fruit in rich abundance and does not simply bring forth thorns and thistles? How we can we account for it that sinful man still retains some knowledge of God, of natural things, and of the difference between good and evil, and shows some regard for virtue and for good outward behavior? What explanation can be given for the special gifts and talents that with which the natural man is endowed, and of the development of science and art by those who are entirely devoid of the new life that is in Christ Jesus? How can we explain the religious aspirations of men everywhere, even of those who did not come in touch with the Christian religion? How can the unregenerate still speak truth, do good to others, and lead outwardly virtuous lives?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Eerdmans, 1968), pp. 432-46</span></figcaption>

od%20to%20others%2C%20and%20lead%20outwardly%20virtuous%20lives" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-21fd72064c" data-kw="">
<blockquote><p>Surely such a Testimony or voice in the soul [as claimed by Gillespie’s opponent], as the soul sits down satisfied with before ever any work of sanctification can possibly give any evidence, is not an evidence according to the word, but contrary to the word, and therefore not the revealing evidence of the spirit of God, so that in this I must needs dissent from him, for he casts the soul upon a most dangerous precipice, neither is the danger helped, but rather increased by that posterior evidence, or after comfort of sanctification, which he speaks of, for the soul being before set down satisfied with the Testimony of the spirit of the Lord, and Faith receiving that Testimony (so he supposes) it cannot now examine whether its sanctification be sound or not sound, whether its graces be common or special, seeming or real:…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ch. 21</span></figcaption>

</figure><figure class="quote" id="q-2815a9cbdd" data-kw="">
<blockquote><p>Had not Christ interposed to satisfy the justice of God, man upon his sin had been actually bound over to punishment, as well as the fallen angels were upon theirs, and been fettered in chains as strong as those spirits feel. The reason why man was not hurled into the same deplorable condition upon his sin, as they were, is Christ’s promise of taking our nature, and not theirs. Had God designed Christ’s taking their nature, the same patience had been exercised towards them, and the same offers would have been made to them, as are made to us. In regard of the fruits of his patience, Christ is said to buy the wickedest apostates from him: 2 Peter 2:1, ‘Denying the Lord that bought them;’ such were bought by Him as ‘bring upon themselves just destruction, and whose damnation slumbers not,’ ver. 3; He purchased the continuance of their lives, and the stay of their execution, that offers of grace might be made to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“On God’s Patience” in The Existence &amp; Attributes of God</cite>, (1682; Grand Rapids: Baker, 1996), 2:482</span></figcaption>

</figure><figure class="quote" id="q-8a0b6b92ac" data-kw="">
<blockquote><p>That former grace may be called the grace of our vocation; this grace is common to all that are called, elect and reprobate. But the latter grace in our effectual calling may be called the grace of faith, appertaining only to the elect; for it is given only to those that are predestinated to life everlasting to believe.</p></blockquote>

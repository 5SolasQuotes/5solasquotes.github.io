<blockquote><p>Baillie’s Letters made clear his aversion to the re-established episcopate [of 1661]: he condemned the restored bishop both in admonitory correspondence to nobles and directly to the new Glaswegian metropolitan, Andrew Fairfoul. Whilst Baillie did not quietly acquiesce to the restoration church settlement, his decision to accept the office of principal of Glasgow University suggests that he had decided to privilege public order over the pursuit of presbyterian reforms at all costs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-campbell.html">Alexander Campbell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Episcopacy in the Mind of Robert Baillie</cite>, 1637-1662’ The Scottish Historical Review, vol. 93, no. 236, pt. 1 (April 2014), pp. 29-55, p. 47</span></figcaption>

<blockquote><p>…therefore all the former circumstances, as they are clothed with either moral conveniency and expediency, or with some religious positive goodness, must be warranted by the Word of God, or the rules of sinless and spiritual prudence, which cannot deviate from the Word of God… And as touching things of prudence, they are things properly mixed, as at what hour sermon shall begin in such a church, at eight, or nine, or ten of the clock; how the worship shall be ordered, whether you should begin the worship with a word of prayer, or a word of praising, or a word of exhorting to stir up for the duty of the day, is a matter of prudence; and because God has not laid the band of a precept on us, to begin with either of the three; therefore it would seem, that though the things themselves be moral, and must be warranted by a Word of God; yet the order is not moral, but prudential, and so cannot fall under a command of the Church; For to me it is hard that men and the Church should lay on a tie or bond of a precept where God has laid on no such bond; The Church, in these mixed things, where the morality is not clear, at farthest can but go on to directive advices, as Paul does, 1 Cor. 7:6,12, not to [the] imposing of laws, nor to injunctions or commandments under the pain of Church-censures; for Christ must bind and ratify in Heaven all Church-censures on earth, and so the Church cannot command nor censure but as Christ Himself would command or censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), p. 6</span></figcaption>

</figure><figure class="quote" id="q-27fdd8bb2e" data-kw="">
<blockquote><p>Those who hold Church government to be of divine right may feel uneasy in calling it positive. Rutherford, who wrote The Book on the subject, The Divine Right of Church Government (1646), did not. One reason why Church government is positive is because it is a special arrangement that does not simply inhere in or derive from nature; rather, it has been appointed in special revelation by the will of Christ about redemption. It is also political, in the sense of binding men in society. Church government could be otherwise (if Christ had so appointed); however the specific form of it, namely classical presbyterianism, is the particular form that Christ has chosen and instituted as the Mediatorial King of the Church, his Kingdom. The form of the government binds not from the nature of it (though it is in accord with the light of nature), but from Christ’s authority alone. Church government was different in the Old Testament, and had changed, developed and progressed numerous times therein. To say that New Testament Church government is positive does not mean that there is not any continuity between it and the Church government of the Old Testament; there is. But there is also not a direct one-to-one correlation between the two either, which some persons find perplexing. On the one hand, as these positive laws of Church government are binding as they are positive (just as the Mosaic ceremonial laws were binding to the Old Testament Church as they were positive), so under the normal circumstances of the Church in the course of history, every last spiritually prescribed detail (however minute) of Biblical, classical presbyterianism is binding by the authority and honor of Christ, the Church’s Lord. However, on the other hand, it is also because the laws of Church government are positive, and as moral obligations (in necessity) override positive ones, that alterations in the regular government of the Church, grounded in natural principles, may, and should, legitimately occur in extraordinary and necessary circumstances (as the Bible and historic presbyterianism teach). Because human, Church government is positive, according to the needs and circumstances of the Church in this age, it will greatly change and fall away with the renovation of all things in the Age to Come, when no teachers will be needed, as we will be beholding God face to face, immediately (Jer. 31:33-34; 1 Cor. 15:28).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Introduction’ to On Positive Laws &amp; Ordinances, &amp; the Law of Nations</cite></span></figcaption>

<blockquote><p>The Church of Rome did not meet in one place for celebrating the worship of God, there were more holy assemblies there in diverse places; there was a Church in the house of Aquila and Priscilla, Rom. 16:5. Paul when he was at Rome had holy Church assemblies in his own house, Acts 28:23, 30, 31, which yet was not that whole (collectively taken) and famous Church of the believing Romans, whose faith was famous through the whole world, Rom. 1:8. Other examples we meet with in the Scripture of Churches duly constituted according to God’s appointment, which met not in one place for exercising the worship of God, but did in diverse places under a common presbytery of diverse pastors perform holy duties. Hence also in our Belgic Churches in some greater towns, though there be more believers than can celebrate the holy worship of God and exercise other ordinances of Christ together in one place; yet they are not divided into several Churches, but do together make one visible Church, under the common presbytery and government of diverse pastors.</p></blockquote>

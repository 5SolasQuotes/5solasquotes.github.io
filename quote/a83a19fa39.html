<blockquote><p>1. By abstaining from oaths of allegiance. An oath of allegiance is a direct recognition of the constitution sworn to, and involves the swearer in the guilt of its immorality—the guilt of swearing to maintain an immorality! Nor is the sin lessened by any consideration arising from the fact that the constitution may contain provisions for its own future amendment. Because when the oath of allegiance is taken, it is to the constitution as it is, and not to what it may be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Distinctive principles of the Reformed Presbyterian Church</cite>, (Albany, 1841), p. 321.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>But, although these things were in principle present in Mary’s heart, she did not at that moment perceive the pledge of hope contained in them. Her grief was too profound to leave room for introspection. It even hid from her vision the objective evidence of the resurrection that lay around her. Worse than this, she turned what was intended to help her into an additional reason for unbelief. But who of us shall blame her? Have not we ourselves under as favorable circumstances made the mistake of nourishing our unbelief on what was meant to be food for our faith? Do we not all remember occasions when we stood outside the grave of our hopes weeping, and did not perceive the hand stretched out to prepare us by the very thing we interpreted as sorrow for a higher joy? From Mary’s experience let us learn to do better. What the Lord expects from us at such seasons is not to abandon ourselves to unreasoning sorrow, but trustingly to look sorrow in the face, to scan its features, to search for the help and hope, which, as surely as God is our Father, must be there. In such trials there can be no comfort for us so long as we stand outside weeping. If only we will take the courage to fix our gaze deliberately upon the stern countenance of grief, and enter unafraid into the darkest recesses of our trouble, we shall find the terror gone, because the Lord has been there before us, and, coming out again, has left the place transfigured, making out of it by the grace of his resurrection a house of life, the very gate of heaven. This was just what happened to Mary. Not forever could she stand weeping, forgetful of what went on around her. “As she wept she looked into the tomb, and she beholdeth two angels in white sitting one at the head and one at the feet, where the body of Jesus had lain.” It was a step in the right direction that she roused herself from her inaction. Still, what strikes us as most characteristic in this statement is its implying that even the vision of angels did not sufficiently impress her to raise the question, to what the appearance of these celestial messengers might be due. Probably this was the first time she had come in direct contact with the supernatural in that particular form. The place was doubtless charged with the atmosphere of mystery and wonder angels bring with themselves when entering into our world of sense. And yet no tremor seems to have run through her, no feeling of awe to have made her draw back. A greater blindness to fact is here than that which made her miss the sign of the empty grave. What more convincing evidence of the truth of the resurrection could have been offered than the presence of these two angels, silently, reverently, majestically sitting where the body of Jesus had lain? Placed like the Cherubim on the mercy-seat, they covered between themselves the spot where the Lord had reposed, and flooded it with celestial glory. It needed no voice of theirs to proclaim that here death had been swallowed up in victory. Ever since the angels descended into this tomb the symbolism of burial has been radically changed. From this moment onward every last resting-place where the bodies of believers are laid is a furrow in that great harvest field of Christ whence heaven draws upward into light each seed sunk into it, whence Christ himself was raised, the first fruits of them that sleep. Let us not overlook, however, that Mary’s disregard of the angels revealed in a most striking form something good also, to-wit: her intense preoccupation with the one thought of finding the Lord. For Him she had been looking into the tomb. He not being there, it was empty to her view, though filled with angelic glory. She would have turned aside without speaking, had not the angels of their own accord spoken to her: “Woman, why weepest thou?” These words were meant as an expression of sympathy quite natural in beings wont to rejoice over repenting sinners. But in this question there is at the same time a note of wonder at the fact that she should be weeping at all. To the mind of the angels the resurrection was so real, so self-evident, that they could scarcely understand how to her it could be otherwise. They felt, as it were, the discord between the songs of joy with which their own world was jubilant, and this sound of weeping coming out of a world of darkness and despair. “Woman, why weepest thou?” Tears would be called for indeed, hadst thou found Him in the tomb, but not at a time like this, when heaven and earth unite in announcing: He is risen in glory, the King of life! Mary’s answer to the angels shows that neither their sympathy nor their wonder had succeeded in piercing her sorrow. “She saith unto them, Because they have taken away my Lord, and I know not where they have laid Him.” These are almost the identical words in which she had informed Peter and John of her discovery of the empty tomb. Still a slight change appears. To the Apostles she had said “the Lord” and “we know not.” To the angels it is: “my Lord” and “I know not.” In this is revealed once more her intense sense of proprietorship in Jesus. In that sense the angels could not have appropriated Him for themselves. They might hail Him as their matchless King, but to Mary He was even more than this, her Lord, her Savior, the One who had sought and saved and owned her in her sins.</p></blockquote>

<blockquote><p>XII. But as it is possible, nay, frequently happens, that, in some countries, neither bread nor wine are used, as in America and other parts of the world, where instead of bread they have a food prepared of pulse, or herbs, or of the fruits or even the bark of trees; and instead of wine their drink is made of honey or sugar, or other aromatics, or even the juice of the coco tree: It is justly queried, whether in those countries, they are wholly to abstain from the Lord’s supper, or whether, instead of bread and wine, it may be lawful to use that food in the supper which answers the purposes of bread and wine, and is adapted for strengthening the body and cheering the heart. Indeed, we think that no rash innovations should be made in the use of the sacraments: but then necessity has no law. And it seems very hard, should anyone take upon him to order that the natives and the foreigners in those spacious countries of the world should be deprived of the Lord’s supper, and their Christianity maimed without the sacramental food. Especially as the principal thing in the analogy is retained when that food and drink is made use of, by which the body may be properly nourished and the heart made glad.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XII. But as it is possible, nay, frequently happens, that, in some countries, neither bread nor wine are used, as in America and other parts of the world, where instead of bread they have a food prepared of pulse, or herbs, or of the fruits or even the bark of trees; and instead of wine their drink is made of honey or sugar, or other aromatics, or even the juice of the coco tree: It is justly queried, whether in those countries, they are wholly to abstain from the Lord’s supper, or whether, instead of bread and wine, it may be lawful to use that food in the supper which answers the purposes of bread and wine, and is adapted for strengthening the body and cheering the heart. Indeed, we think that no rash innovations should be made in the use of the sacraments: but then necessity has no law. And it seems very hard, should anyone take upon him to order that the natives and the foreigners in those spacious countries of the world should be deprived of the Lord’s supper, and their Christianity maimed without the sacramental food. Especially as the principal thing in the analogy is retained when that food and drink is made use of, by which the body may be properly nourished and the heart made glad.”

— Herman Witsius, Other citations (work not named), section 12 of ch. 17, ‘Of the Lord’s Supper’ in bk. 4 of The Economy of the Covenants Between God &amp; Man… (NY: George Forman, 1798), vol. 3, p. 425">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXII.+But+as+it+is+possible%2C+nay%2C+frequently+happens%2C+that%2C+in+some+countries%2C+neither+bread+nor+wine+are+used%2C+as+in+America+and+other+parts+of+the+world%2C+where+instead+of+bread+they+have+a+food+prepared+of+pulse%2C+or+herbs%2C+or+of+the+fruits+or+even+the+bark+of+trees%3B+and+instead+of+wine+their+drink+is+made+of+honey+or+sugar%2C+or+other+aromatics%2C+or+even+the+juice+of+the+coco+tree%3A+It+is+justly+queried%2C+whether+in+those+countries%2C+they+are+wholly+to+abstain+from+the+Lord%E2%80%99s+supper%2C+or+whether%2C+instead+of+bread+and+wine%2C+it+may+be+lawful+to+use+that+food+in+the+supper+which+answers+the+purposes+of+bread+and+wine%2C+and+is+adapted+for+strengthening+the+body+and+cheering+the+heart.+Indeed%2C+we+think+that+no+rash+innovations+should+be+made+in+the+use+of+the+sacraments%3A+but+then+necessity+has+no+law.+And+it+seems+very+hard%2C+should+anyone+take+upon+him+to+order+that+the+natives+and+the+foreigners+in+those+spacious+countries+of+the+world+should+be+deprived+of+the+Lord%E2%80%99s+supper%2C+and+their+Christianity+maimed+without+the+sacramental+food.+Especially+as+the+principal+thing+in+the+analogy+is+retained+when+that+food+and+drink+is+made+use+of%2C+by+which+the+body+may+be+properly+nourished+and+the+heart+made+glad.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+Other+citations+%28work+not+named%29%2C+section+12+of+ch.+17%2C+%E2%80%98Of+the+Lord%E2%80%99s+Supper%E2%80%99+in+bk.+4+of+The+Economy+of+the+Covenants+Between+God+%26+Man%E2%80%A6+%28NY%3A+George+Forman%2C+1798%29%2C+vol.+3%2C+p.+425&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffb9b120c8b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fb9b120c8b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-sacraments-in-extra-ordinary-circumstances/#:~:text=XII.%20But%20as%20it%20is%20possible,nourished%20and%20the%20heart%20made%20glad&amp;text=XII.%20But%20as%20it%20is%20possible%2C%20nay%2C%20frequently&amp;text=be%20properly%20nourished%20and%20the%20heart%20made%20glad" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Second you may say that I translated the New Testament conscientiously and to the best of my ability. I have compelled no one to read it, but have left that open, doing the work only as a service to those who could not do it better. No one is forbidden to do a better piece of work. If anyone does not want to read it, he can let it alone. I neither ask anybody to read it nor praise anyone who does so. It is my Testament and my translation, and it shall continue to be mine. If I have made some mistakes in it—though I am not conscious of any and would certainly be most unwilling to give a single letter a wrong translation intentionally—I will not allow the papists [to act] as judges. For their ears are still too long, and their hee-haws too weak, for them to criticize my translating. I know very well—and they know it even less than the miller’s beast—how much skill, energy, sense, and brains are required in a good translator. For they have never tried it. …But to return to the matter in hand! If your papist wants to make so much fuss about the word sola (alone) tell him this, “Dr. Martin Luther will have it so, and says that a papist and an ass are the same thing.” Sic volo, sic jubeo; sit pro ratione voluntas [I will it. I command it. My will is sufficient reason]. We are not going to be the pupils and disciples of the papists, but their masters and judges. For once, we too are going to be proud and brag with these blockheads; and as St. Paul boasts over against his mad raving saints [II Cor. 11:21ff.], so I shall boast over against these asses of mine. Are they doctors? So am I. Are they learned? So am I. Are they preachers? So am I. Are they theologians? So am I. Are they debaters? So am I. Are they philosophers? So am I. Are they dialecticians? So am I. Are they lecturers? So am I. Do they write books? So do I. I will go further with my boasting. I can expound psalms and prophets; they cannot. I can translate; they cannot. I can read the Holy Scriptures; they cannot. I can pray; they cannot. And, to come down to their level, I can use their own dialectics and philosophy better than all of them put together; and besides I know for sure that none of them understands their Aristotle.23 If there is a single one among them all who correctly understands one proemium [preface] or chapter in Aristotle, I’ll eat my hat. I am not saying too much, for I have been trained and practiced from my youth up in all their science and am well aware how deep and broad it is. They are very well aware, too, that I can do everything they can. Yet these incurable fellows treat me as though I were a stranger to their field, who had just arrived this morning for the first time and had never before either seen or heard what they teach and know. So brilliantly do they parade about with their science, teaching me what I outgrew25 twenty years ago, that to all their blatting and shouting I have to sing, with the harlot, “I have known for seven years that horseshoe-nails are iron.” Let this be the answer to your first question. And please give these asses no other and no further answer to their useless braying about the word sola than simply this, “Luther will have it so, and says that he is a doctor above all the doctors of the whole papacy.” It shall stay at that! Henceforth I shall simply hold them in contempt, and have them held in contempt, so long as they are the kind of people—I should say, asses—that they are. There are shameless nincompoops among them who have never learned their own art of sophistry—like Dr. Schmidt and Doctor Snotty-Nose, and their likes—and who set themselves against me in this matter, which transcends not only sophistry, but (as St. Paul says [I Cor. 1:19–25]), all the world’s wisdom and understanding as well. Truly an ass need not sing much; he is already well known anyway by his ears.</p></blockquote>

<blockquote><p>49 Q. What reasons may be given of the Lord’s days beginning in the morning?

A. Other days then begin.

That they do so with us, is evident by the account of our hours. For midnight ended, we begin with one a clock: then the first hour of the day beginneth. And it appears to be so among the Jews: for when Aaron proclaimed (Exod. 32. 5, 6.) To morrow shall be a feast to the Lord, They rose up early on the morrow. I deny not but that sundry of the Jewish feasts began in the evening: as the Passover (Exod. 12.6.) But it cannot be proved that their weekly Sabbaths so began. There were special reasons for the beginning of those feasts in the evening, which did then begin. As for the supposed beginnings of the first days gathered out of this phrase, (the evening and the morning were the first day) they cannot be necessarily concluded to be at evening. For the evening and the morning there importeth the moment of the evening and morning parting one from another, and the return to the same period: which moment is rather at the beginning of the morning then of evening. The evening useth to be referred to the end of the day, and the morning to the beginning, as Exod. 29. 38, 39. I. Sam. 17. 16. and 30.12. Joh. 20.19.</p></blockquote>

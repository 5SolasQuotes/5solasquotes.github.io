<blockquote><p>Obj. 1. The saints, on account of their virtues, are to be honored with the worship either of adoration (λατρεια) or of veneration (δουλεια). But it is not in the former sense that they are to be worshipped; because this form of worship is due to God alone, inasmuch as it attributes to him universal power, providence and dominion, which can be ascribed to God alone. Therefore veneration is due to the saints, or such worship as that which we ascribe to them for their holiness. Ans. We deny the consequence; because the major proposition is incomplete; for besides the worship of adoration and veneration, which is the distinction here made, there is another kind of veneration, such as is proper to the saints, which is the acknowledgment and celebration of the faith, holiness and gifts for which they were distinguished, obedience to the doctrine which they taught, and an imitation of their lives and piety, concerning which Augustin says: p 543 “They are to be honored by imitation, but not by adoration.” This veneration is due to the saints, and we have no desire to take it from them, whether living or dead; but, on the other hand, willingly attribute it to them according to the command of the Apostle: “Remember them which have the rule over you, who have spoken unto you the word of God; whose faith follow, considering the end of their conversation.” (Heb. 13:7.) Wo also deny the minor proposition; because the distinction which they make between the worship of adoration and veneration is of no force, inasmuch as these are not different forms of worship, but one and the same; neither do they belong to the saints, or to any creature, but to God alone, because he knows and hears in all places and at all times the thoughts, the groans and desires of those who call upon him, and relieves their necessities. No one but God can hear those who call upon him. Therefore this honor must be ascribed to him alone, because he hears them that pray. This honor belongs also to Christ, because it is on account of his merits and intercession that God grants unto us the forgiveness of sins, eternal life and all other good things. Hence this honor cannot be transferred to the saints without manifest sacrilege and idolatry, whether it be under the name of adoration, or veneration, or whatever name it may be. This distinction, too, which they make, is of no account, since the words are used indifferently in the original to signify the same thing, both in the Scriptures and in profane writers. Concerning God it is said (Matt. 4:10), “Thou shalt worship the Lord thy God, and him only shalt thou serve.” Here the Greek word λατζευσεις is used. And in Matt. 6:25, it is said, “He cannot serve God and Mammon;” in which place the word δουλευειν is used. Which word is also used in the following places, where it is said, “Ye turned to God from idols, to serve the living and true God.” “They that are such serve not our Lord Jesus Christ.” (1 Thes. 1:9. Rom. 16:18.) Paul also every where calls himself the servant of God (δουθ ον θεου). In the Greek text, “servile or slavish work is every where termed λατζευτον. Suidas writes that λατζευειν means the same thing as to serve for wages. Valla shows that this same word signifies to serve man as well as to serve God, adducing a passage from Xenophon, where a man says that he is ready to risk his life, sooner than his wife should be made to serve. And the wife, on the other hand, says that she would rather lose her life, than that her husband should serve, where the word δουθ υη on is used. Hence these words upon which the Papists base the above distinction do not differ, but express one and the same thing.</p></blockquote>

<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them? Now, by the same reasons are our holy-days to be condemned as taking away Christian liberty; and so that which the apostle says, does militate as well against them as against any other holy-days: for whereas it might be thought that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places except our opposites will say that they esteem their festival days holier than other days, and that they observe the Jewish festivities, neither of which they do aknowledge; and if they did, yet they must consider that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks. … The apostle comports with the observation of days in the weak Jews, who understood not the fullness of the Christian liberty, especially, since those days having had the honor to be once appointed by God Himself, were to be honorably buried: but the same apostle reproves the Galatians who had attained to this liberty, and had once left off the observation of days. … Now for confutation of this forged exposition of those places of the apostle… The [Romanist] Rhemists affirm that the apostle condemns only Jewish days [in Col. 2 &amp; Gal. 4], but not Christian days, and that we do falsely interpret his words against their holy-days. [Thomas] Cartwright answers them that if Paul condemned the observing of feasts which God Himself instituted, then much more does He condemn the observation of feasts of man’s devising… for he [Paul] condemnes that observation of days which had crept into the Church of Galatia, which was not Jewish nor typical, seeing the Galatians, believing that Christ was already come, could not keep them as figures of his coming, as the Jews did, but rather as memorials that He was already come, says Cartwright.</p></blockquote>

+is%2C+that+the+apostle+will+not+bear+with+the+observation+days+in+Christian+Churches%2C+who+have+known+God+as+he+speaks.+%E2%80%A6+The+apostle+comports+with+the+observation+of+days+in+the+weak+Jews%2C+who+understood+not+the+fullness+of+the+Christian+liberty%2C+especially%2C+since+those+days+having+had+the+honor+to+be+once+appointed+by+God+Himself%2C+were+to+be+honorably+buried%3A+but+the+same+apostle+reproves+the+Galatians+who+had+attained+to+this+liberty%2C+and+had+once+left+off+the+observation+of+days.+%E2%80%A6+Now+for+confutation+of+this+forged+exposition+of+those+places+of+the+apostle%E2%80%A6+The+%5BRomanist%5D+Rhemists+affirm+that+the+apostle+condemns+only+Jewish+days+%5Bin+Col.+2+%26+Gal.+4%5D%2C+but+not+Christian+days%2C+and+that+we+do+falsely+interpret+his+words+against+their+holy-days.+%5BThomas%5D+Cartwright+answers+them+that+if+Paul+condemned+the+observing+of+feasts+which+God+Himself+instituted%2C+then+much+more+does+He+condemn+the+observation+of+feasts+of+man%E2%80%99s+devising%E2%80%A6+for+he+%5BPaul%5D+condemnes+that+observation+of+days+which+had+crept+into+the+Church+of+Galatia%2C+which+was+not+Jewish+nor+typical%2C+seeing+the+Galatians%2C+believing+that+Christ+was+already+come%2C+could+not+keep+them+as+figures+of+his+coming%2C+as+the+Jews+did%2C+but+rather+as+memorials+that+He+was+already+come%2C+says+Cartwright.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+1%2C+ch.+8%2C+%E2%80%98That+Festival+Days+take+away+our+Christian+Liberty%2C+proved+out+of+the+Gospel%E2%80%99%2C+pp.+25-26&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdaea4ecbc0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/daea4ecbc0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christian-living/religious-holidays/#:~:text=Col.%202%5D%20verse.%2017%2C%20What%20should,He%20was%20already%20come%2C%20says%20Cartwright&amp;text=Col.%202%5D%20verse.%2017%2C%20What%20should%20we%20do&amp;text=memorials%20that%20He%20was%20already%20come%2C%20says%20Cartwright" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b3b10d3a32" data-kw="">
<blockquote><p>…the most part of men have some form in worshipping God and please themselves in it so well that they think God well-pleased with it; but few there are who know indeed what it is to worship Him in a manner acceptable to his majesty: Now you know it is all one not to worship Him at all, as not to worship Him in that way He likes to be worshipped: Therefore the most part of men are but self-worshippers, because they please none but themselves in it, it is not the worship his soul has chosen, but their own invention, for you must take this as an undeniable ground, that God must be worshipped according to his own will and pleasure, and not according to your humor, or invention; therefore his soul abhors will-worship, devised by men out of ignorant zeal, or superstition, though there might seem much devotion in it, and much affection to God, as in the Israelites sacrificing their children, what more seeming self-denial? And yet what more real self-idolatry; God owns not such a service, for it is not service and obedience to his will and pleasure, but to men’s own will and humor: therefore a man must not look for a reward but from Himself. Now it is not only will-worship when the matter and substance of the worship is not commanded of God, but also when a commanded worship is not discharged in the appointed manner: Therefore, O how few true worshippers will the Father find? True worship must have truth for the substance and spirit for the manner of it: else it is not such a worship as the Father seeks and will be pleased with; divine worship must have truth in it, that is plain, but what was that truth, it must be conformed to the rule and pattern of worship, which is God’s will and pleasure revealed in the word of truth, true worship is the very practice of the word of truth, it caries the image and superscription and command upon it, which is a necessary ingredient in it, and constituent of it. Therefore if thy service have the image of thy own will stamped on it, it is not divine worship, but will-worship. Thus all human ceremonies and ordinances enjoined for service of God, carry the inscription not of God, but of man who is the author and original of them, and so are but adulterated and false coin, that will not pass current with God…</p></blockquote>

</figure><figure class="quote" id="q-6410d65b06" data-kw="">
<blockquote><p>Certainly, the professors of it are not well purged from this latter idolatry: for, even among Protestants themselves, we shall find very many that are in this sense idolaters. For, [1] Whosoever chiefly and supremely loves any creature, is an idolater; because our chiefest love is due only unto God. Hence the covetous person is expressly called an idolater; and covetousness, idolatry: Col. 3:5. Mortify your earthly members; … uncleanness … evil concupiscence, and covetousness, which is idolatry. And the sensual epicure is likewise an idolater: Phil. 3:19 his belly, saith the Apostle, is his God. The proud person is an idolater: for he loves himself supremely; sets up himself for his own idol; and falls prostrate before that image, which he hath pourtrayed of his own perfections, in his own fancy and imagination. And, generally, all such, who love and admire anything above God, or esteem anything so, are idolaters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, on the First Commandment (heart / creature idolatry)</span></figcaption>

<blockquote><p>[The Objection of Quakers:] But our Psalms are not the same in meter, nor the same tunes which the Jews had. [Answer:] That seeing the singing of Psalms is a duty commanded, and amongst others, those of David, and has hid from us the Hebrew tunes, wherewith the Psalms of David were wont to be sung, it must needs follow that the Lord has left it to the liberty of the Church to sing them in such plain, grave tunes as may fit the solemnity of God’s worship, and that because that tunes are but circumstantial and not the substance; and the Church now in the days of the Gospel is not in her minority or young age, but in her man-age, or full grown age, as the apostle speaketh (Gal. 4:1-6), and therefore fitter to appoint circumstantial things in God’s worship than the Jews, being in their non-age.</p></blockquote>

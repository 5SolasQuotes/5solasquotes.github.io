<main class="wrap"><figure class="quote" id="q-8358fa4afc" data-kw="">
<blockquote><p>For the church to be able to proclaim this Gospel in all its richness and freedom, it was necessary for the church to distantiate herself from Judaism. A Gospel so rich created a people of God that could no longer be contained within the boundaries of one nation and country.

In the death of Christ all that which is typical and prophetic, priest and sacrifice, law and shadow, even Israel herself finds its fulfilment. The cross of Christ reconciles all things — God and humanity, heaven and earth, Jew and Gentile, Barbarian and Scythian, man and woman, slave and free.

On Pentecost, the New Testament church is born as an independent community, independent of temple and altar, priest and sacrifice, independent even of the visible appearance and physical presence of Jesus himself in whom the disciples had hitherto found their unity. From this point on they would no longer know him according to the flesh. His departure was their gain. Leaving them in body, he in truth came nearer to them in his divinity, majesty, grace, and Spirit. Through his Spirit he makes his dwelling among them and never leaves them. No matter how small and insignificant it thus appeared, this church was truly catholic, heir of the future, proclaimer of a joy destined for all creatures.

However, the catholicity of the early church was soon severely tested. Jesus had restricted his own preaching and, during his sojourn on earth, that of his disciples, to the lost sheep of Israel. The first congregations in Judea, Galilee, and Samaria were Jewish. Soon the apostle Paul, already on his first missionary journey, established Christian churches of Gentile believers. This development brought about a collision with the Jewish exclusivism that was still very much present in the church and from which the apostle Peter had been set free by a special revelation. When the judaizing tendency became popular, a conflict was inevitable and the young Christian church faced its first dangerous crisis.

Paul recognized the absolute seriousness of this struggle. It was a struggle about the catholicity of the church, about freedom in Christ, about the universal significance of the Cross, about the richness of God’s grace, about justification by faith alone apart from the works of the law. Was there to be a schism at the beginning, was the exclusivism of the false brothers to triumph over Pauline catholicity? It was precisely in this catholicity that Paul, in his letters, gloried as the mystery of God — “the Gentiles are heirs together with Israel, members together of one body, and sharers together in the promise in Christ Jesus” (Eph. 3:6). We know that thanks to the unanimous decision of the apostles the unity and catholicity of the Church was saved at the Council of Jerusalem.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholicity of Christianity and the Church (1888), trans. John Bolt in Calvin Theological Journal</cite></span></figcaption>

<blockquote><p>And upon these [previously listed] terms I (and I believe everybody else) will willingly consent to their readmission [under a limited-political toleration]. If any desire further satisfaction in this particular, either from civilians, schoolmen, casuists, canonists, historians, or other divines, he may consult these or such like:

I. Justinian Cod. de Judaeis &amp; Caelicolis, bk. 1, title 12 and the gloss there.

II. Codex Theodosianus de Judaeis, Caelicolis &amp; Samaritanis, bk. 16, title 8, p. 515. III. Jacobi Sirmondi, Appendix Cod. Theodosiani, leg. 6. p. 14 &amp; leg. 4, p. 11. IV. Marquardus de Susanis Tractatu de Judaeis, &amp; aliis Infidelibus inter tractatus Illustrium, tome 14, p. 28. See Bernardum, Hieronimum, Alexandrum Iltum, aliosque Auctores ab eo ibidem citatos. V. Mathaeus Wesenbecius in Comentario in Codicem Justinianeum de Judeis, title 9, p. 14. VI. Decretum Gregorii extra de Judaeis, &amp; Saracenis, bk. 6, title 6.

VII. Clementinar. bk. 5, title 2, de Judaeis.

VIII. Corvini Jus Canonicum, tit. de Judaeis, p. 295. IX. Frederick Balduin, Cases of Conscience, bk. 2, ch. 6, case 5, p. 188. X. Capitulare Caroli Magni, bk. 6, ch. 120 &amp; 308. XI. Henry Alting, Problematum Theolog. pt. 2, problem 21, p. 340. XII. Petrus Crespetius in summa Eccles. Disciplinae Verbo Judaeus, p. 520 etc. fuse.

XIII. Philip Melanchthon, Epistles, bk. 1, epistle 68, p. 75 in edit. Corn. Bee.

XIV. Martin Becanus, in compendio manualis, bk. 5, ch. 17, p. 509. XV. Decretum Concilii Viennensis contra Judaeos apud Hen. Canisium Lect. Antiquarum, tome 1, p. 621 &amp; apud Binium, tome 3, parte altera, p. 1,493. XVI. Filiucius, Cases of Conscience, tract 22, ch. 5, p. 40, col. 2, de Judaismo. XVII. Johannes de Lugo, Of the Power of Divine Faith, disp. 22, sect. 4 and authors cited there. XVIII. Bodinus, Of the Republic, bk. 3-4. XIX. Statutum de Judaismo apud D. Edvardum Cooke, Institit. pt. 2, p. 506 &amp; Commentarium ejus in dictum Statutum. XX. Aquinas, [Summa] pt. 2 of 2, quest. 10-11 where various things on the Jews occur. XXI. Erasmus Brockmannus, Systemate Theologiae, universae, art. 41, ch. 2, quest. 9, tome 2, p. 5,043. XXII. Basilica Lenuclavii, bk. 1, title 1, ch. 9, de Judaeis, p. 2. XXIII. Jerome of the Holy Faith, Book contra the Jews. XXIV. Petrus Galatinus, de Arcanis Catholicae veritatis. XXV. Gilbertus Genebrardus, in Symbolae fidei Judeorum è R. Mos. Aegyptio, etc. XXVI. Vide etiam (si placet) Scriptores (innumeros pene) quos exhibet Georgius Draudius in Bibliothea Classica inter Libros Theologicos, pp. 349-50, etc. Alii alios de facili addant.</p></blockquote>

<blockquote><p>But this is most certain, that there are yet better things to come then have been since the first calling of the Gentiles. Among other better things to come, the recalling of the Jews is most clearly and plentifully fore told by the Prophets. Many apply sundry prophecies that tend that way, to the delivery of the Jews from the Babylonish Captivity; and others, to the spiritual Israel, consisting of Gentiles.

But assuredly such prophecies as fore-tell the re-uniting of Judah and Ephraim together, have especial reference to the fore-said recalling of the Jews: as that Parable, whereof this our Prophet maketh mention, about joining two sticks, on the one whereof was written, For Judah, and for the children of Israel his companions: and on the other, For Joseph the stick of Ephraim, and for all the house of Israel his companions. That Parable the Prophet thus applieth, I will make them one Nation, and one King shall be King to them all, &amp;c.

But if any shall question this and other prophecies of the ancient Prophets. The Apostle Paul hath so expressly fore-told a recalling of the Jews, and thereupon, a bringing in a fullness of the Gentiles, as no question can be made thereof: and he doth after such a manner express these, as apparently declareth a future glory of the Christian Church. Some particular expressions of his in the 11. to the Romans, are these.

1.Vers. 11. Having propounded this Question concerning the Jews, Have they stumbled, that they should fall? (namely, totally and finally, never to be raised again.) He gives this answer, God forbid. Whereby he implieth, that assuredly they shall be raised again, that is, they shall be made a visible Church of Christ, and submit themselves to his ordinances.

2. Vers. 12. This supposition, If the fall of them be riches of the world, and the diminishing of them the riches of the Gentiles: how much more their fullness? By their fullness, he meaneth their bringing them in to the Church of Christ, consisting of Gentiles, and thereby making that Church full, when both Gentiles and Jews shall be joined together.

3. Vers. 15. This Question (What shall the receiving of them be but life from the dead?) doth take it for grant, that they shall be received, and taken into the Church of Christ; and that this restoration of theirs will be as a new glorious resurrection.

4. Vers. 23. It is said, They also shall be graffed in; namely, into the body of the Christian Church; and a proof thereof is taken from God’s omnipotency, For God is able to graff them in again.

5. Vers. 24. This emphatical Interrogation, How much more shall these, which be the natural branches, he graffed into their own Olive-tree? doth put it out of all question, that the Jews shall again be brought to be of the true Church, which is the Olive-tree here intended.

6. Vers. 25. This restrictive particle, In part (blindness in part is happened unto Israel) doth import, that they shall not be finally blinded, but that at length they shall come to have their eyes so opened, as they shall know and believe in Jesus Christ. This is further manifested by expressing the period of this limitation, thus, Until the fullness of the Gentiles be come in.

7. Verse 26. This general phrase; All Israel shall be saved, sheweth, that there is a time to come, when not only two or three, or a few Jews here and there thorowout the Christian Church (as have been in all ages thereof) but the whole Nation shall be called.

8. Vers. 31. This phrase, Through your mercy they also may obtain mercy; sheweth, that God purposely suffered them sometime to abide in unbelief, that when they should be brought to believe, this grace and honour might appear to arise from God’s mere mercy and free grace. The words following in the next verse doe shew as much: They are these, For God hath concluded them all in unbelief, that he might have mercy upon all.

But assuredly such prophecies as fore-tell the re-uniting of Judah and Ephraim together, have especial reference to the fore-said recalling of the Jews: as that Parable, whereof this our Prophet maketh mention, about joining two sticks, on the one whereof was written, For Judah, and for the children of Israel his companions: and on the other, For Joseph the stick of Ephraim, and for all the house of Israel his companions. That Parable the Prophet thus applieth, I will make them one Nation, and one King shall be King to them all, &amp;c.

But if any shall question this and other prophecies of the ancient Prophets. The Apostle Paul hath so expressly fore-told a recalling of the Jews, and thereupon, a bringing in a fullness of the Gentiles, as no question can be made thereof: and he doth after such a manner express these, as apparently declareth a future glory of the Christian Church. Some particular expressions of his in the 11. to the Romans, are these.

1.Vers. 11. Having propounded this Question concerning the Jews, Have they stumbled, that they should fall? (namely, totally and finally, never to be raised again.) He gives this answer, God forbid. Whereby he implieth, that assuredly they shall be raised again, that is, they shall be made a visible Church of Christ, and submit themselves to his ordinances.

2. Vers. 12. This supposition, If the fall of them be riches of the world, and the diminishing of them the riches of the Gentiles: how much more their fullness? By their fullness, he meaneth their bringing them in to the Church of Christ, consisting of Gentiles, and thereby making that Church full, when both Gentiles and Jews shall be joined together.

3. Vers. 15. This Question (What shall the receiving of them be but life from the dead?) doth take it for grant, that they shall be received, and taken into the Church of Christ; and that this restoration of theirs will be as a new glorious resurrection.

4. Vers. 23. It is said, They also shall be graffed in; namely, into the body of the Christian Church; and a proof thereof is taken from God’s omnipotency, For God is able to graff them in again.

<blockquote><p>Secondly it is asked whether Jews or pagans can be over Christians or not. And it seems that yes:

1. From the fact that the apostle says, 1 Tim. 6:1: Let all who are under the yoke of slavery deem their masters worthy of all honor. Gloss: ‘Under the yoke of infidels.’ Therefore the apostle does not deny that infidels were able to be over the faithful.

2. Likewise, Extra, Of Many: Because to be cultivated. Therefore Jews can be over Christians. They have clung more longly to their lands, as owing to a contract of the place, let them remain for the cultivation of fields, rendering the customary payments to the aforesaid Christian men.

3. Likewise, they are able to receive a price for Christian slaves that have been purchased; which would not be the case unless they were able in some way to be over them, as is found in dist. 54, Fraternitatem.

4. It also seems so from what Gelasius says, XVII, question 4, where it is said that diligently. From this it seems that your care should faithfully examine the truth of affairs, so that neither religion may seem violated, nor a slave lying by this objection, strive to decline the rights of the rightful master, whom it is not certain to be a Christian, from the dominion of his master is not to be exempted. But the contrary seems true: a. From what is said in the Decretals, Multorum, where it is said: To no Jew. And it says that it is lawful to retain a Christian slave in his dominion, but, if any are found among them, let their freedom be preserved for them. Gregory: Whatever Christian slaves a Jew is found to have purchased, bring them without ambiguity to freedom according to the precepts of the laws, lest, God forbid, the Christian religion, made subject to the Jews, be polluted. b. Likewise, in dist. 54: No public offices are to be imposed on Jews by which they may be granted the punishment of inflicting upon Christians; let Christians have Jews as masters. But this was done so that to the Jews c. Likewise, it is found in the Decretals, On the Jews, where it is prohibited, To these things for all Christians. And this same thing is found there, when they expose themselves for some wage to the service of the Jews, as is continually said: Jews or Saracens, etc. But what reason is there that, on account of the Christian faith, the right over a slave should be taken away from him, since servitude was introduced by divine law and approved also by canon law? But the Christian religion does no wrong to anyone. [Solution]: To this it must be said that a Christian is not permitted to serve a Jew, on account of avoiding damage to the Christian religion, as is found in the Decretals, On the Jews, To these things for all, where it is said: The customs of the Jews and ours in no way agree. For this same reason also, if some, because of continual conversation and assiduous familiarity, are easily able to incline the minds of the simple to their superstition and faithlessness, and they themselves should be their slaves, let them be freed from their service, sometimes at a price being given, sometimes at no price being given. For a slave of a Jew is either homeborn or purchased. If homeborn, if he is or wishes to become a Christian, he is immediately snatched away into freedom, with no price given, as is found in the Code, On bishops, and dist. 54, Fraternitatem. But if he is purchased, either he was a Christian when he was bought or a pagan. If a Christian, he becomes free, with no price given; as is found in dist. 54, Mancipia, trade in Christians is forbidden to Jews, both by the law of the land and by the law of the forum. But if he was a pagan, either he was bought for the sake of service or for the sake of commerce. If for the sake of service, and he wishes to become a Christian, he becomes free without price, dist. 54, Fraternitatem. But in the second case, if within three months afterward he has not put him up for sale if he wishes to become a Christian, he is freed without price, because it is presumed that he bought him in order to serve. But if he has put him up for sale within that term and he wishes to become a Christian then or afterward, provided that the fault did not rest with the master so that he did not sell him, he is freed, the price of twelve solidi being returned by some Christian, dist. 54, Frater, and nitatem. Decretals, In the present council: If, however, a Jew shall circumcise one wishing to become a Christian, or shall imprint the mark of another sect, he is freed without price for the injury of his own body, dist. 54, Nulla, where it is said that if certain Christians have been defiled by them in Jewish rite or even circumcised, without the price being returned let them return to freedom and the Christian religion, but human law inflicts a heavier punishment. But what has been said about the slaves of the Jews can be said about the slaves of the Saracens: for the same suspicion and the same danger can exist in both. [To the objections]:

1. To the objection, however, on the contrary it must be said that that of the apostle is understood for the state of the primitive Church and so that unbelieving masters might be enticed to the conversion of faith through the services of faithful slaves. Hence the Gloss says: Rather, unbelieving masters are converted through the services of faithful slaves. But there is added there in the text: Lest the name of the Lord and doctrine be blasphemed. The Gloss: ‘As though of one invading what is another’s.’ According to that reasoning, it will seem to someone, and Christian doctrine will seem as if unjust, that it is also now so to be done. But to this it must be answered that another reason restores the pact. For now they ought not to serve, lest the name of the Lord be blasphemed; for thus Jews and pagans are inclined to this, that they may draw the faithful into faithlessness or apostasy. On account of which cohabitation with Jews and pagans, unless for the sake of preaching, is forbidden, lest the name of the Lord be blasphemed. Nor ought Christian doctrine on this account to seem unjust, since the caution of faith must be preferred to all.

2. To the second, however, it must be said that, although Christians may cultivate the landed estates of Jews, they ought not nevertheless to serve Jews in their house, lest bad familiarity be contracted. And from this they are not said rightly to be over them as over slaves, because they cannot transfer them to another place or to another service, as is said in the Decretals, On the Jews. And this was done in favor of Christians, not of Jews, that they may cultivate the landed estates or lands bought from Jews, because they had formerly lived in those lands.

3. To the third, however, it must be said that, although they may receive the price of servitude, nevertheless not for Christians already existing, but for pagans who wish to become Christians. For by the law of the land Christian slaves are freed from the service of Jews, lest there be danger to the Christian faith. In favor also of the Christian faith, to certain men wishing to receive Christianity freedom is granted.

4. But that which is said in XVII, question 4, does not expressly give to understand that he was a Christian, but that he said that he had been a Christian from infancy, and that the mark of circumcision had been impressed on him by the aforesaid lord, he would be freed. But if he was not a Christian, he is not to be freed from servitude by the fact that he has fled to the church, unless he wishes to become a Christian, and this canon seems to say this. Hence it is not introduced for the dominion of Jews, but for the dominion of Christians: for some wished to defraud their master of his own right, fleeing to the enclosures of the Church.

5. To the last it must be said that the catholic Church intends to do injury to no one, but has ordered this so that no injury be done to God; but injury would be done to God if faith in something were endangered on account of the observance of temporal justice.</p></blockquote>

4. But that which is said in XVII, question 4, does not expressly give to understand that he was a Christian, but that he said that he had been a Christian from infancy, and that the mark of circumcision had been impressed on him by the aforesaid lord, he would be freed. But if he was not a Christian, he is not to be freed from servitude by the fact that he has fled to the church, unless he wishes to become a Christian, and this canon seems to say this. Hence it is not introduced for the dominion of Jews, but for the dominion of Christians: for some wished to defraud their master of his own right, fleeing to the enclosures of the Church.

5. To the last it must be said that the catholic Church intends to do injury to no one, but has ordered this so that no injury be done to God; but injury would be done to God if faith in something were endangered on account of the observance of temporal justice.”

— Alexander of Hales, Sum of Universal Theology, (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 2 | ch. 2, ‘Whether Jews or Pagans can Preside over Christians?’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecondly+it+is+asked+whether+Jews+or+pagans+can+be+over+Christians+or+not.+And+it+seems+that+yes%3A+1.+From+the+fact+that+the+apostle+says%2C+1+Tim.+6%3A1%3A+Let+all+who+are+under+the+yoke+of+slavery+deem+their+masters+worthy+of+all+honor.+Gloss%3A+%E2%80%98Under+the+yoke+of+infidels.%E2%80%99+Therefore+the+apostle+does+not+deny+that+infidels+were+able+to+be+over+the+faithful.+2.+Likewise%2C+Extra%2C+Of+Many%3A+Because+to+be+cultivated.+Therefore+Jews+can+be+over+Christians.+They+have+clung+more+longly+to+their+lands%2C+as+owing+to+a+contract+of+the+place%2C+let+them+remain+for+the+cultivation+of+fields%2C+rendering+the+customary+payments+to+the+aforesaid+Christian+men.+3.+Likewise%2C+they+are+able+to+receive+a+price+for+Christian+slaves+that+have+been+purchased%3B+which+would+not+be+the+case+unless+they+were+able+in+some+way+to+be+over+them%2C+as+is+found+in+dist.+54%2C+Fraternitatem.+4.+It+also+seems+so+from+what+Gelasius+says%2C+XVII%2C+question+4%2C+where+it+is+said+that+diligently.+From+this+it+seems+that+your+care+should+faithfully+examine+the+truth+of+affairs%2C+so+that+neither+religion+may+seem+violated%2C+nor+a+slave+lying+by+this+objection%2C+strive+to+decline+the+rights+of+the+rightful+master%2C+whom+it+is+not+certain+to+be+a+Christian%2C+from+the+dominion+of+his+master+is+not+to+be+exempted.+But+the+contrary+seems+true%3A+a.+From+what+is+said+in+the+Decretals%2C+Multorum%2C+where+it+is+said%3A+To+no+Jew.+And+it+says+that+it+is+lawful+to+retain+a+Christian+slave+in+his+dominion%2C+but%2C+if+any+are+found+among+them%2C+let+their+freedom+be+preserved+for+them.+Gregory%3A+Whatever+Christian+slaves+a+Jew+is+found+to+have+purchased%2C+bring+them+without+ambiguity+to+freedom+according+to+the+precepts+of+the+laws%2C+lest%2C+God+forbid%2C+the+Christian+religion%2C+made+subject+to+the+Jews%2C+be+polluted.+b.+Likewise%2C+in+dist.+54%3A+No+public+offices+are+to+be+imposed+on+Jews+by+which+they+may+be+granted+the+punishment+of+inflicting+upon+Christians%3B+let+Christians+have+Jews+as+masters.+But+this+was+done+so+that+to+the+Jews+c.+Likewise%2C+it+is+found+in+the+Decretals%2C+On+the+Jews%2C+where+it+is+prohibited%2C+To+these+things+for+all+Christians.+And+this+same+thing+is+found+there%2C+when+they+expose+themselves+for+some+wage+to+the+service+of+the+Jews%2C+as+is+continually+said%3A+Jews+or+Saracens%2C+etc.+But+what+reason+is+there+that%2C+on+account+of+the+Christian+faith%2C+the+right+over+a+slave+should+be+taken+away+from+him%2C+since+servitude+was+introduced+by+divine+law+and+approved+also+by+canon+law%3F+But+the+Christian+religion+does+no+wrong+to+anyone.+%5BSolution%5D%3A+To+this+it+must+be+said+that+a+Christian+is+not+permitted+to+serve+a+Jew%2C+on+account+of+avoiding+damage+to+the+Christian+religion%2C+as+is+found+in+the+Decretals%2C+On+the+Jews%2C+To+these+things+for+all%2C+where+it+is+said%3A+The+customs+of+the+Jews+and+ours+in+no+way+agree.+For+this+same+reason+also%2C+if+some%2C+because+of+continual+conversation+and+assiduous+familiarity%2C+are+easily+able+to+incline+the+minds+of+the+simple+to+their+superstition+and+faithlessness%2C+and+they+themselves+should+be+their+slaves%2C+let+them+be+freed+from+their+service%2C+sometimes+at+a+price+being+given%2C+sometimes+at+no+price+being+given.+For+a+slave+of+a+Jew+is+either+homeborn+or+purchased.+If+homeborn%2C+if+he+is+or+wishes+to+become+a+Christian%2C+he+is+immediately+snatched+away+into+freedom%2C+with+no+price+given%2C+as+is+found+in+the+Code%2C+On+bishops%2C+and+dist.+54%2C+Fraternitatem.+But+if+he+is+purchased%2C+either+he+was+a+Christian+when+he+was+bought+or+a+pagan.+If+a+Christian%2C+he+becomes+free%2C+with+no+price+given%3B+as+is+found+in+dist.+54%2C+Mancipia%2C+trade+in+Christians+is+forbidden+to+Jews%2C+both+by+the+law+of+the+land+and+by+the+law+of+the+forum.+But+if+he+was+a+pagan%2C+either+he+was+bought+for+the+sake+of+service+or+for+the+sake+of+commerce.+If+for+the+sake+of+service%2C+and+he+wishes+to+become+a+Christian%2C+he+becomes+free+without+price%2C+dist.+54%2C+Fraternitatem.+But+in+the+second+case%2C+if+within+three+months+afterward+he+has+not+put+him+up+for+sale+if+he+wishes+to+become+a+Christian%2C+he+is+freed+without+price%2C+because+it+is+presumed+that+he+bought+him+in+order+to+serve.+But+if+he+has+put+him+up+for+sale+within+that+term+and+he+wishes+to+become+a+Christian+then+or+afterward%2C+provided+that+the+fault+did+not+rest+with+the+master+so+that+he+did+not+sell+him%2C+he+is+freed%2C+the+price+of+twelve+solidi+being+returned+by+some+Christian%2C+dist.+54%2C+Frater%2C+and+nitatem.+Decretals%2C+In+the+present+council%3A+If%2C+however%2C+a+Jew+shall+circumcise+one+wishing+to+become+a+Christian%2C+or+shall+imprint+the+mark+of+another+sect%2C+he+is+freed+without+price+for+the+injury+of+his+own+body%2C+dist.+54%2C+Nulla%2C+where+it+is+said+that+if+certain+Christians+have+been+defiled+by+them+in+Jewish+rite+or+even+circumcised%2C+without+the+price+being+returned+let+them+return+to+freedom+and+the+Christian+religion%2C+but+human+law+inflicts+a+heavier+punishment.+But+what+has+been+said+about+the+slaves+of+the+Jews+can+be+said+about+the+slaves+of+the+Saracens%3A+for+the+same+suspicion+and+the+same+danger+can+exist+in+both.+%5BTo+the+objections%5D%3A+1.+To+the+objection%2C+however%2C+on+the+contrary+it+must+be+said+that+that+of+the+apostle+is+understood+for+the+state+of+the+primitive+Church+and+so+that+unbelieving+masters+might+be+enticed+to+the+conversion+of+faith+through+the+services+of+faithful+slaves.+Hence+the+Gloss+says%3A+Rather%2C+unbelieving+masters+are+converted+through+the+services+of+faithful+slaves.+But+there+is+added+there+in+the+text%3A+Lest+the+name+of+the+Lord+and+doctrine+be+blasphemed.+The+Gloss%3A+%E2%80%98As+though+of+one+invading+what+is+another%E2%80%99s.%E2%80%99+According+to+that+reasoning%2C+it+will+seem+to+someone%2C+and+Christian+doctrine+will+seem+as+if+unjust%2C+that+it+is+also+now+so+to+be+done.+But+to+this+it+must+be+answered+that+another+reason+restores+the+pact.+For+now+they+ought+not+to+serve%2C+lest+the+name+of+the+Lord+be+blasphemed%3B+for+thus+Jews+and+pagans+are+inclined+to+this%2C+that+they+may+draw+the+faithful+into+faithlessness+or+apostasy.+On+account+of+which+cohabitation+with+Jews+and+pagans%2C+unless+for+the+sake+of+preaching%2C+is+forbidden%2C+lest+the+name+of+the+Lord+be+blasphemed.+Nor+ought+Christian+doctrine+on+this+account+to+seem+unjust%2C+since+the+caution+of+faith+must+be+preferred+to+all.+2.+To+the+second%2C+however%2C+it+must+be+said+that%2C+although+Christians+may+cultivate+the+landed+estates+of+Jews%2C+they+ought+not+nevertheless+to+serve+Jews+in+their+house%2C+lest+bad+familiarity+be+contracted.+And+from+this+they+are+not+said+rightly+to+be+over+them+as+over+slaves%2C+because+they+cannot+transfer+them+to+another+place+or+to+another+service%2C+as+is+said+in+the+Decretals%2C+On+the+Jews.+And+this+was+done+in+favor+of+Christians%2C+not+of+Jews%2C+that+they+may+cultivate+the+landed+estates+or+lands+bought+from+Jews%2C+because+they+had+formerly+lived+in+those+lands.+3.+To+the+third%2C+however%2C+it+must+be+said+that%2C+although+they+may+receive+the+price+of+servitude%2C+nevertheless+not+for+Christians+already+existing%2C+but+for+pagans+who+wish+to+become+Christians.+For+by+the+law+of+the+land+Christian+slaves+are+freed+from+the+service+of+Jews%2C+lest+there+be+danger+to+the+Christian+faith.+In+favor+also+of+the+Christian+faith%2C+to+certain+men+wishing+to+receive+Christianity+freedom+is+granted.+4.+But+that+which+is+said+in+XVII%2C+question+4%2C+does+not+expressly+give+to+understand+that+he+was+a+Christian%2C+but+that+he+said+that+he+had+been+a+Christian+from+infancy%2C+and+that+the+mark+of+circumcision+had+been+impressed+on+him+by+the+aforesaid+lord%2C+he+would+be+freed.+But+if+he+was+not+a+Christian%2C+he+is+not+to+be+freed+from+servitude+by+the+fact+that+he+has+fled+to+the+church%2C+unless+he+wishes+to+become+a+Christian%2C+and+this+canon+seems+to+say+this.+Hence+it+is+not+introduced+for+the+dominion+of+Jews%2C+but+for+the+dominion+of+Christians%3A+for+some+wished+to+defraud+their+master+of+his+own+right%2C+fleeing+to+the+enclosures+of+the+Church.+5.+To+the+last+it+must+be+said+that+the+catholic+Church+intends+to+do+injury+to+no+one%2C+but+has+ordered+this+so+that+no+injury+be+done+to+God%3B+but+injury+would+be+done+to+God+if+faith+in+something+were+endangered+on+account+of+the+observance+of+temporal+justice.%E2%80%9D%0A%0A%E2%80%94+Alexander+of+Hales%2C+Sum+of+Universal+Theology%2C+%28Paris%2C+1230-1245%29%2C+pt.+2+of+2%2C+inq.+3%2C+tract+8%2C+sect.+1%2C+quest.+1%2C+title+2+%7C+member+2+%7C+ch.+2%2C+%E2%80%98Whether+Jews+or+Pagans+can+Preside+over+Christians%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd0aac9ca2b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d0aac9ca2b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Secondly%20it%20is%20asked%20whether%20Jews,of%20the%20observance%20of%20temporal%20justice&amp;text=Secondly%20it%20is%20asked%20whether%20Jews%20or%20pagans&amp;text=on%20account%20of%20the%20observance%20of%20temporal%20justice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>This opinion is the way to Arminian liberty of conscience, that men in a Christian commonwealth may be of any religion, and the magistrate is to behold men as an indifferent spectator, not caring what religion they be of, whether they be Papists, Jews, Pagans, Anabaptists, Socinians, Macedonians, etc. which should infer that the magistrate were no nurse-father of the true Church, nor yet a preserver of religion, if men might be of any religion…</p></blockquote>

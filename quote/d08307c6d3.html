<main class="wrap"><figure class="quote" id="q-d08307c6d3" data-kw="">
<blockquote><p>…that which Dr. Jackson answers the Papists about this fashion (Origin of Unbelief, sect. 4, ch. 35): ‘We use the book only as a complement of the civil act, whereby we give satisfaction unto men, or as a visible resemblancer, partly to bystanders or spectators, whose eyes by this means may become as true witnesses as their ears that such protestations have been made, partly unto him that makes them, who will be more wary and circumspect what he avouches and protests, when he perceives his speeches must be sealed with such remarkeable circumstances as they cannot be often recalled to his own and other’s memory. To the same end men of honourable place and calling use to lay their hands upon their hearts when they take a solemn oath.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), ch. 3 | section 31, ‘Concerning Swearing upon a Book’, pp. 357-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-02ff74f216" data-kw="">
<blockquote><p>…the bishop’s own words. For he says that we kneel before the elements [of the Supper], ‘having them in our sight, or object to our senses, as ordinary signs, means, and memorials, to stir us up, to worship, etc.’ Now if we have them in our sight and before our senses for this purpose, that they may be means, signs, and memorials to stir us up to worship, then (sure) their being really before our senses is not accidental to us when we kneel. Since Dr. Burgess has been so dull and sottish as to write that ‘the signs are but accidentally before the communicants when they receive,’ he is to be ignominiously exsibilat; for making the sacred sacramental signs to be no otherwise present than the walls of the Church, the nails and timber of the material table whereupon the elements are set, or anything else accidentally before the communicants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 3, ch. 4, p. 58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-e13bf9dfd3" data-kw="">
<blockquote><p>Now, besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship [WCF 1.6]; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections; the rending of the garments signified the rending of the heart by sorrow; standing with a religious suspect [respect] to that which is before us signifies veneration or reverence, sitting at table signifies familiarity and fellowship. For ‘which of you’, says our Master, ‘having a servant ploughing, or feeding cattle, will say unto him by and by, when he is come from the field, Go and sit down to meat?’ (Lk. 17:7) All these signs have their significations from nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, p. 85</span></figcaption>

</figure><figure class="quote" id="q-a9be409335" data-kw="">
<blockquote><p>Wherefore they are called upon to declare their joy and gladness by ‘clapping their hands’; which is a gesture expressive of exultation and joy; see Psalm 98:8, Nahum 3:19. It was used at the unction and coronation of a king, 2 Kings 11:12; and so very proper to be used on occasion of the Messiah being made or declared Lord and Christ, as he was at his ascension, Acts 2:36.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 47, verse 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>
<div class="actions"><button class="copy" data-copy="“Wherefore they are called upon to declare their joy and gladness by ‘clapping their hands’; which is a gesture expressive of exultation and joy; see Psalm 98:8, Nahum 3:19. It was used at the unction and coronation of a king, 2 Kings 11:12; and so very proper to be used on occasion of the Messiah being made or declared Lord and Christ, as he was at his ascension, Acts 2:36.”

</figure><figure class="quote" id="q-9cfa4ce655" data-kw="">
<blockquote><p>…one of our doctors objects that we lift up our eyes and our hands to heaven and worship God, yet do not worship the heaven: that a man going to bed prays before his bed: that David offered the sacrifices of thanksgiving in the presence of all the people, Ps. 116, that Paul having taken bread gave thanks before all them who were in the ship, Acts 27:35, that the Israelites worshipped before Moses and Aaron, Ex. 4:31. Hereupon another doctor harping on the same string tells us that when we kneel in the act of receiving the sacrament, we kneel no more to bread than to the pulpit when we join our prayers with the ministers. Oh, unworthy instances and reproachful to doctors! All these things were and are accidentally present to the worshippers and not purposely before them, not respected as having a religious state in the worship. What? do we worship before the bread in the sacrament even as before a pulpit, a bed, etc? Nay, graduate men should understand better what they speak of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 3, ch. 4, p. 73</span></figcaption>

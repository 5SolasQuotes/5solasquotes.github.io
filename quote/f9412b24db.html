<main class="wrap"><figure class="quote" id="q-f9412b24db" data-kw="Original Sin|The Fall|Author of sin" data-pol="">
<blockquote><p>We say, then, that man is corrupted by a natural viciousness, but not by one which proceeded from nature. In saying that it proceeded not from nature, we mean that it was rather an adventitious event which befell man, than a substantial property assigned to him from the beginning.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Institutes of the Christian Religion</cite>, 2.1.11</figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac2cd3cfb9" data-kw="Original Sin|Author of sin|Holiness|Justice" data-pol="">
<blockquote><p>However, this is certain, that God doth not infuse it. Souls receive neither purity nor impurity from him, but only their naked essence, and the natural powers and properties flowing therefrom. He doth not infuse any impurity into men; for he cannot be the author of sin, who is the revenger of it. … As a pure and holy God, he cannot infuse any impurity into the souls of men; and as a just and righteous God, he may and doth withhold from, or create them void and destitute of, that holiness and righteousness which was once their happiness and glory.</p></blockquote>
<figcaption>— <a href="../authors/thomas-boston.html">Thomas Boston</a>, <cite>An Illustration of the Doctrines of the Christian Religion</cite>, on original sin</figcaption>

</figure><figure class="quote" id="q-7c2b4a999d" data-kw="Original Sin|Depravity|Author of sin" data-pol="">
<blockquote><p>In order to account for a sinful corruption of nature, yea, a total native depravity of the heart of man, there is not the least need of supposing any evil quality, infused, implanted, or wrought into the nature of man, by any positive cause, or influence whatsoever, either from God, or the creature; or of supposing, that man is conceived and born with a fountain of evil in his heart, such as is any thing properly positive.</p></blockquote>
<figcaption>— <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a>, <cite>The Great Christian Doctrine of Original Sin Defended</cite>, pt. 4, ch. 2</figcaption>

</figure><figure class="quote" id="q-3630fcaed0" data-kw="Original Sin|Author of sin|Justice" data-pol="">
<blockquote><p>But He is not the author of the evil dispositions with which that nature is infected at birth. The doctrine of original sin attributes no efficiency to God in the production of evil. It simply supposes that He judicially abandons our apostate race, and withholds from the descendants of Adam the manifestations of his favour and love, which are the life of the soul.</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Systematic Theology</cite>, Vol. 2 (on original sin)</figcaption>

</figure><figure class="quote" id="q-a4595f704a" data-kw="Original Sin|Author of sin" data-pol="">
<blockquote><p>Now although souls are created by God destitute of original righteousness, God cannot on that account be considered the author of sin. It is one thing to infuse impurity; another not to give the purity of which man has rendered himself unworthy in Adam.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 9.12.10</figcaption>

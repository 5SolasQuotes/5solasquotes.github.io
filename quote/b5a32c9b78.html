<main class="wrap"><figure class="quote" id="q-b5a32c9b78" data-kw="">
<blockquote><p>But can the creature ever forget that it holds existence—at least happy existence—on the tenure of rendering to the great Creator the glory for ever due to perfections so infinite, works so marvellous, and benefits so varied and immense? Towards such a Being is not worship a most reasonable service—a natural and necessary recognition of creature dependence—an authentic and significant expression of creature gratitude and admiration, of creature reverence and love? and to banish from the earth what constitutes man’s chief duty, and so illustrates the Creator’s glory, were a disparagement indeed to the majesty of God, and a degradation to ourselves; for the very act of worshipping, exceedingly exalts our nature, in bringing us nigh to God, the source and centre of all blessedness, and thereby raising in us sentiments perfective of our natures, and assimilating the adoring soul to the object it regards with supreme complacency and sacred awe.

Nor can we think a supreme regard to the worship of God unfriendly to the constitution and continuance of the soundest social state; for if there be in futurity, as some anticipate, a social optimism, religion, we presume, will be its most pregnant element; and we are moreover convinced, that nothing will remedy the growing distempers of man’s social state, but the bringing back a godless world (which in its wisdom knows not God, and in its folly denies him) to a devout recognition of Him whose will is destiny, and his favour better than life.

Indeed, so much stress do we lay on the proper worship of God, that we conceive all other functions of sanctuary service, derive their highest interest and importance from the tendency they have to train up souls for acceptable worship; for what nobler end can we propose to ourselves in preaching the Word with intense desires for men’s conversion, than thereby to bring them to the knowledge of God, that they may eternally worship and adore him? Could we enquire of angels what they thought of worship, would they not assign to it the sublimest place among creature obligations?

Doubtless the beatitude of heaven greatly consists in adoring celebrations; nor is there on earth anything that so elevates and ennobles the human soul as the holy and heart-expanding aspirations of true devotion. If worship, then, hold so divine a place among creature duties—if it be, as it is, a final cause of creature existence for the glory of God—we repeat, that to establish purity of worship on earth was an undertaking worthy of the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-sieveright.html">James Sieveright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Freedom of Gospel Worship from Local Circumstances and National Peculiarities Asserted in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf76906b88" data-kw="">
<blockquote><p>But the more private the duties of worship are, the greater latitude is indulged in the external part, or signs of reverence and honor. For though these outward expressions, compositions, or gestures of the body, be the genuine effects of that inward reverence of the mind, and so due to the divine Majesty, yet it is with special reference unto men, that others may see how God is and ought to be feared of his saints. So that such things which are necessary in public worship, are not alway so necessary in private or secret; and that which a person finds to be most advantageous to the right performance of his worship in secret, may not be so expedient in public, because there is not the like reason in both.</p></blockquote>

<blockquote><p>One of the sections of the Directory is given to the Singing of Psalms, and declares it “the duty of Christians to praise God publickly by singing of psalms together in the congregation, and also privately in the family”. This rubric manifestly implied the provision of a Psalm Book, and it was made part of the function of the Assembly in preparing a basis for uniformity of worship in the churches of the three kingdoms, to supply them with a common Psalm Book. The way was prepared for this by the submitment to the Assembly by the House of Commons on Nov. 20, 1643, of the query whether “it may not be useful and profitable to the Church that the Psalms set forth by Mr. Rouse be permitted to be publicly sung”.

The result of the Assembly’s examination of Mr. Rouse’s version (first printed in 1643) was to recommend it, after it had been subjected to a thorough revision at its own hands, to Parliament as a suitable Psalm-Book for the Church (autumn of 1645). The Commons accordingly ordered the book printed in this revised form (it appeared in 1646, i. e., Feb. 1647), and (April 15, 1646) issued an order establishing it as the sole Psalm Book to be used in the Churches of England and Wales, though the House of Lords never concurred in this order.

The Scotch Assembly subjected the book to a still furthermore searching revision, and by an act passed in 1649 (ratified by the Estates of Parliament in 1650) approved it in this new form for use in the Scottish Churches. It is in this Scottish revision alone (printed in 1650) in which they can only by courtesy continue to bear the name of Francis Rouse as their author, that these Psalms have passed into wide use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Assembly and its Work in Princeton Theological Review</cite></span></figcaption>

<blockquote><p>The third matter to be noted in this [fourth] commandment is the added incentives. These are three in number.

(1) There is the example of God. God has created man after His image. This holy disposition of soul must also be manifested by man‘s deeds, and when he is thus active, he must be engaged in harmony with both God‘s commandment as well as His example. “Be ye therefore followers of God, as dear children” (Eph 5:1). God, after being engaged in the work of creation for six days, rested upon the seventh day, and by so doing has designated this as an example to be followed. Man must be motivated by this to do likewise.

(2) The second incentive is taken from that which is to our benefit. “Therefore the Lord blessed the sabbath day.” This does not imply that inherent efficacy was bestowed upon this day in order to render it profitable to man. Rather, it is a promise of blessing made to the conscientious observers of that day; that is, the receipt of comfort, joy, and holiness for the soul, and to render the physical labour of the six workdays to be more prosperous and profitable. For everything is dependent upon the blessing of the Lord, and without this all our labour is in vain (Ps 127:1-2).

(3) The third incentive is derived from God’s command and the appropriateness of obedience to it. He hallowed it. The Lord has set this day apart for sacred usage in order that man may solemnly and uniformly glorify and serve Him with a holy rest. No one may therefore make this day a common day by using it as other days and spending it by working. Rather, according to God’s command, we must acknowledge it as having been set apart and spend it in a fashion which is consistent with the purpose for which God has set it apart and designated it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 142-43.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The third matter to be noted in this [fourth] commandment is the added incentives. These are three in number.

(1) There is the example of God. God has created man after His image. This holy disposition of soul must also be manifested by man‘s deeds, and when he is thus active, he must be engaged in harmony with both God‘s commandment as well as His example. “Be ye therefore followers of God, as dear children” (Eph 5:1). God, after being engaged in the work of creation for six days, rested upon the seventh day, and by so doing has designated this as an example to be followed. Man must be motivated by this to do likewise.

(2) The second incentive is taken from that which is to our benefit. “Therefore the Lord blessed the sabbath day.” This does not imply that inherent efficacy was bestowed upon this day in order to render it profitable to man. Rather, it is a promise of blessing made to the conscientious observers of that day; that is, the receipt of comfort, joy, and holiness for the soul, and to render the physical labour of the six workdays to be more prosperous and profitable. For everything is dependent upon the blessing of the Lord, and without this all our labour is in vain (Ps 127:1-2).

(3) The third incentive is derived from God’s command and the appropriateness of obedience to it. He hallowed it. The Lord has set this day apart for sacred usage in order that man may solemnly and uniformly glorify and serve Him with a holy rest. No one may therefore make this day a common day by using it as other days and spending it by working. Rather, according to God’s command, we must acknowledge it as having been set apart and spend it in a fashion which is consistent with the purpose for which God has set it apart and designated it.”

— Wilhelmus à Brakel, The Christian’s Reasonable Service, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 3: 142-43.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+third+matter+to+be+noted+in+this+%5Bfourth%5D+commandment+is+the+added+incentives.+These+are+three+in+number.%0A%0A%281%29+There+is+the+example+of+God.+God+has+created+man+after+His+image.+This+holy+disposition+of+soul+must+also+be+manifested+by+man%E2%80%98s+deeds%2C+and+when+he+is+thus+active%2C+he+must+be+engaged+in+harmony+with+both+God%E2%80%98s+commandment+as+well+as+His+example.+%E2%80%9CBe+ye+therefore+followers+of+God%2C+as+dear+children%E2%80%9D+%28Eph+5%3A1%29.+God%2C+after+being+engaged+in+the+work+of+creation+for+six+days%2C+rested+upon+the+seventh+day%2C+and+by+so+doing+has+designated+this+as+an+example+to+be+followed.+Man+must+be+motivated+by+this+to+do+likewise.%0A%0A%282%29+The+second+incentive+is+taken+from+that+which+is+to+our+benefit.+%E2%80%9CTherefore+the+Lord+blessed+the+sabbath+day.%E2%80%9D+This+does+not+imply+that+inherent+efficacy+was+bestowed+upon+this+day+in+order+to+render+it+profitable+to+man.+Rather%2C+it+is+a+promise+of+blessing+made+to+the+conscientious+observers+of+that+day%3B+that+is%2C+the+receipt+of+comfort%2C+joy%2C+and+holiness+for+the+soul%2C+and+to+render+the+physical+labour+of+the+six+workdays+to+be+more+prosperous+and+profitable.+For+everything+is+dependent+upon+the+blessing+of+the+Lord%2C+and+without+this+all+our+labour+is+in+vain+%28Ps+127%3A1-2%29.%0A%0A%283%29+The+third+incentive+is+derived+from+God%E2%80%99s+command+and+the+appropriateness+of+obedience+to+it.+He+hallowed+it.+The+Lord+has+set+this+day+apart+for+sacred+usage+in+order+that+man+may+solemnly+and+uniformly+glorify+and+serve+Him+with+a+holy+rest.+No+one+may+therefore+make+this+day+a+common+day+by+using+it+as+other+days+and+spending+it+by+working.+Rather%2C+according+to+God%E2%80%99s+command%2C+we+must+acknowledge

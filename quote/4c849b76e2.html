<main class="wrap"><figure class="quote" id="q-4c849b76e2" data-kw="">
<blockquote><p>For these things [Mk. 16:17-20] are not absolutely and without exception, but in some respect the tokens of faith belonging to that primitive Church until the gospel were made more manifest. For miracles were as trumpets and open criers whereby the gospel was commended. For even as the law of Moses procured to itself credit, through the manifold miracles showed upon mount Sinai and in the wilderness, which afterward ceased when they were come to the land of promise: so in like manner miracles are now also taken away, seeing the gospel is spread throughout the world. And therefore the promise which Christ would have to be written in the gospel of Mark belonged not to all times; whereof it is not our part either to complain or find any fault, because that we hear that the Holy Ghost distributes to everyone as He will, who nevertheless, for great considerations Him moving, does not impart to all men gifts and graces alike. For if they should happen to all alike, they would soon grow out of estimation, whereas God has determined to make store of them. Moreover, He would that charity should grow and increase, which is then exercised when one man does help another, which thing would not have taken place if all men had been endued with like gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether it be lawful for the godly to desire miracles, and why there be none in this our age’ in ch. 9. ‘Of Miracles, &amp; the Definition &amp; Difference of Them’ in The Common Places… (London: Henrie Denham et al., 1583), pt. 1, pp. 69-72</cite>, pp. 71-72</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b319948f7" data-kw="">
<blockquote><p>But that gift of healing, like the rest of the miracles, which the Lord willed to be brought forth for a time, has vanished away in order to make the new preaching of the gospel marvelous forever. Therefore, even if we grant to the full that anointing was a sacrament of those powers which were then administered by the hands of the apostles, it now has nothing to do with us, to whom the administering of such powers has not been committed. … Therefore, they make themselves ridiculous when they boast that they are endowed with the gift of healing. The Lord is indeed present with his people in every age; and He heals their weaknesses as often as necessary, no less than of old; still He does not put forth these manifest powers, nor dispense miracles through the apostles’ hands. For that was a temporary gift, and also quickly perished partly on account of men’s ungratefulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin: Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles in The Library of Christian Classics, vol. 21 (Philadelphia: Westminster Press, 1960), vol. 2, bk. 4</cite>, ch. 19, sections 18-19, p. 1467</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-d2c06fc13a" data-kw="">
<blockquote><p>The extraordinary gifts of the Spirit, such as the gift of tongues, of miracles, of prophecy, etc., are called extraordinary, because cause they are such as are not given in the ordinary course of God’s providence. They are not bestowed in the way of God’s ordinary providential dealing with his children, but only on extraordinary occasions, as they were bestowed on the prophets and apostles to enable them to reveal the mind and will of God before the canon of Scripture was complete, and so on the primitive Church, in order to the founding and establishing of it in the world. But since the canon of the Scripture has been completed, and the Christian Church fully founded and established, these extraordinary gifts have ceased.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Love More Excellent than the Extraordinary Gifts of the Spirit’ on 1 Cor.</cite>, 13:1-2</span></figcaption>

</figure><figure class="quote" id="q-20c8220a8a" data-kw="">
<blockquote><p>There is no more ground for such a ministration in this life [of the Spirit without Church ordinances] than there is for no death, no crying, no sorrow, no pain in this life, Rev. 21:4, no sun, nor moon, v. 23, no unclean thing, no sin, v. 27 and no more warrant for delivering up the Kingdom, in this life, 1 Cor. 15, than for the Resurrection of the Dead, 23:37, and the blowing of the Last Trumpet, [v.] 52, and the swallowing up of death in victory, 55-57, as if all these should come to pass in this life agreeable to this, says H. Nicholas, Evangel. ch. 35. sec. 9. In which Resurrection of the Dead, God shows unto us that the time is now fulfilled, that his dead, or the dead which are fallen asleep in the Lord, rise up in this day of his judgement and appear unto us in godly glory, which shall also henceforth live in us everlastingly with Christ, and reign upon the earth, wherein the Scripture comes to be fulfilled in this present day. And Saltmarsh wills these that are as spiritual as himself and his Familists, to believe this and receive it, that is, except, we make shipwreck of faith and say the Resurrection is past in this life, as did Hymeneus and Philetus, we are all legal, literal men and void of the Spirit. 2. Saltmarsh is unwilling to contradict the truth of God, 1 Cor. 15:24, too openly, to wit, that in the end the Kingdom shall be delivered up: Now whether this be meant of Christ’s reigning no more in his Church in this life by ordidinances, or as Chrysostom does expound the place, it be the rendering up to the Father his conquished and purchased people, as it is most agreeable to Eph. 5:27, I dispute not now, but Saltmarsh says faintly, This is not only done on the whole body of Christ at the last, but also here. He dares not say this rendering up is not only at the Last Day, but also in this life; yet the apostle is clear, he thought of no rendering up of the Kingdome in this life, as Saltmarsh by this new spirit supposes, for the text is clear, v. 22-23, every man shall rise again from the dead, Christ first and then his members [Greek], ‘Then is the end when He shall deliver up the Kingdom to the Father.’ Then: [1.] there is no rendering up till the dead in Christ be raised, vv. 23-24, but the dead in Christ in their bodies (of which undoubtedly the apostle speaks, 1 Cor. 15:1-4, etc. do not rise in this life. 2. This rendering up is not till the end, then shall the end be. 3. It is when all rule and authority shall be put down, v. 27; this is not in this life. 4. It is when the last enemy shall be subdued, v. 26. 5. When God shall be all in all, v. 28. These are not in this life, therefore Saltmarsh dreams.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist... (London, 1648) | pt. 1 | ch. 34, ‘A taste of the wild allegoric interpretations of Scripture that are in this piece of Saltmarsh, which he fathers upon the pure immediate actings of the Spirit beyond Law and Gospel’</cite>, pp. 287-88</span></figcaption>

rendering+up+to+the+Father+his+conquished+and+purchased+people%2C+as+it+is+most+agreeable+to+Eph.+5%3A27%2C+I+dispute+not+now%2C+but+Saltmarsh+says+faintly%2C+This+is+not+only+done+on+the+whole+body+of+Christ+at+the+last%2C+but+also+here.+He+dares+not+say+this+rendering+up+is+not+only+at+the+Last+Day%2C+but+also+in+this+life%3B+yet+the+apostle+is+clear%2C+he+thought+of+no+rendering+up+of+the+Kingdome+in+this+life%2C+as+Saltmarsh+by+this+new+spirit+supposes%2C+for+the+text+is+clear%2C+v.+22-23%2C+every+man+shall+rise+again+from+the+dead%2C+Christ+first+and+then+his+members+%5BGreek%5D%2C+%E2%80%98Then+is+the+end+when+He+shall+deliver+up+the+Kingdom+to+the+Father.%E2%80%99+Then%3A+%5B1.%5D+there+is+no+rendering+up+till+the+dead+in+Christ+be+raised%2C+vv.+23-24%2C+but+the+dead+in+Christ+in+their+bodies+%28of+which+undoubtedly+the+apostle+speaks%2C+1+Cor.+15%3A1-4%2C+etc.+do+not+rise+in+this+life.+2.+This+rendering+up+is+not+till+the+end%2C+then+shall+the+end+be.+3.+It+is+when+all+rule+and+authority+shall+be+put+down%2C+v.+27%3B+this+is+not+in+this+life.+4.+It+is+when+the+last+enemy+shall+be+subdued%2C+v.+26.+5.+When+God+shall+be+all+in+all%2C+v.+28.+These+are+not+in+this+life%2C+therefore+Saltmarsh+dreams.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Spiritual+Antichrist...+%28London%2C+1648%29+%7C+pt.+1+%7C+ch.+34%2C+%E2%80%98A+taste+of+the+wild+allegoric+interpretations+of+Scripture+that+are+in+this+piece+of+Saltmarsh%2C+which+he+fathers+upon+the+pure+immediate+actings+of+the+Spirit+beyond+Law+and+Gospel%E2%80%99%2C+pp.+287-88&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F20c8220a8a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/20c8220a8a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hyper-preterism/#:~:text=There%20is%20no%20more%20ground%20for,in%20this%20life%2C%20therefore%20Saltmarsh%20dreams&amp;text=There%20is%20no%20more%20ground%20for%20such%20a&amp;text <blockquote><p>7. Yet we say, that as God by gifts may furnish some in a more than ordinary way; so may He, and uses He to thrust them out in a mixed way to the exercise of these for the edification of His Church, and make the seal of his call extraordinarily ratify his sending of them, that is, as He may furnish men partly by means, and especially by his blessing extraordinarily accompanying them, so may He send them out partly in a mediate way by men’s opening of the door, partly by his more than ordinary thrusting of them out, making up so what was defective in the mediate call by some extraordinary concurrences of impulse and gifts within, of circumstances of providence without, and of efficacy upon, and acception of it amongst others, whereby it cometh to be ratified. This the Lord fulfilled at the entry of the Reformation, raising up men comparatively extraordinarily furnished and commissionated for his work, yet still ministers of the same Gospel, and walking according to the common rule with others in their ministerial charge. This is not ordinarily to be imitated, but where the like cases, call, and circumstances concur…</p></blockquote>

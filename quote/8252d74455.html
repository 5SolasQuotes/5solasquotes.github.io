<blockquote><p>2. It [the form of sound words] is our godly forefathers bequest which they have conveyed to us their posterity; should not our care be alike to transmit it to ours? Ps. 78:3-4. 3. The martyrs have sealed it with their blood, which we shall prove guilty of through our unfaithfulness, as they are accounted to tread underfoot the Son of God, and to account his blood an unholy thing who desert his truth, and despited the spirit of his grace, Heb. 10:29. 4. It will be the best part of our children’s inheritance: as the Law was Jacob’s, Dt. 33:4. Look to it therefore, that at our last reckoning our forefathers be not ashamed of us, and our posterity at the Resurrection do no not rise up, and, I say not, call us blessed, as Prov. 31:28, but curse us for betraying God’s truth, and our trust, and their and our own souls altogether. 5. And remember from this word [Greek] hold fast, that it is not the catching at what we have not, but only the holding fast what through God’s mercy we yet have; and therefore as Christ says to the Church of Philadelphia, ‘Hold fast what thou hast, let no man take away thy crown.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-tuckney.html">Anthony Tuckney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Form of Sound Words’ a sermon on 2 Tim. 1:13 in A Good Day well improved, or Five Sermons upon Acts 9:31… to which is annexed a sermon on 2 Tim. 1:13... (London: 1656)</cite>, pp. 244-319</span></figcaption>

ormedbooksonline.com/on-catechizing/#:~:text=2.%20It%20%5Bthe%20form%20of%20sound,no%20man%20take%20away%20thy%20crown&amp;text=2.%20It%20%5Bthe%20form%20of%20sound%20words%5D%20is&amp;text=hast%2C%20let%20no%20man%20take%20away%20thy%20crown" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6b187594f" data-kw="">
<blockquote><p>…the purpose of Christ while he said to the Pharisees, ‘The Law and the prophets were until John: from that time the Kingdom of God is preached.’ [Lk. 16:16] He had in the parable of the unjust steward, and in the application of the same, spoken somewhat contemptibly of riches: Which when the Pharisees heard, they derided him, and that for this pretended reason (as is evident from the answer which is returned unto them) because the Law promises the world’s goods, as rewards and blessings to the people of God, that by the temporal things, which are set forth for types and shadows of eternal things, they might be instructed, helped and lead as it were by the hand, to the contemplation, desire and expectation of those heavenly and eternal things, which are not seen. Now, Christ did not only rip up the hypocrisy of their hearts, verse 15, but also gave a formal answer to their pretended reason, by showing them how the Law is by Him perfected, verse 16, yet not destroyed, Verse 17. Then, will we observe how He teaches that the Law and the prophets are perfected, and so our point shall be plain. The Law and the prophets were until John. i.e. they did typify and prophesy concerning the things of the Kingdom of God until John, for before that time the faithful only saw those things afar off, and by types, shadows and figures, and the rudiments of the world were taught to know them; But from that time the Kingdom of God is preached. i.e. the people of God are no longer to be instructed concerning the things of the Kingdom of God by outward signs or visible shadows and figure, but only by the plain Word of the Gospel, for now the Kingdome of God [Greek], is not typified as before, but plainly preached, as a thing exhibited to us and present with us. Thus we see, that to us in the days of the Gospel the Word only is appointed to teach the things belonging to the Kingdom of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 5</cite>, pp. 83-84</span></figcaption>

<blockquote><p>The presbyterians deny not but private men may preach in some cases. None that fear God do desire any to bury their talent, nor would hinder men from doing the work of God. But they would have bona bene [good things done well], God’s work done in God’s order. On these conditions we [congregationalists of Baxter’s stripe] allow private men to preach. 1. If they do it but ex charitate [out of charity], and pretend not to the ministerial office. 2. And if they do it occasionally, and not as men separated to that work as their calling (for then they become ministers indeed while they disclaim it in name). 3. If they do it not needlessly, to a proud ostentation of their parts, but only when abler men, or ministers, are not to be had or else [are] on some urgent weighty cause. 4. If they make not themselves the judges of their own fitness, but expect the approbation of the judicious, faithful, concordant ministers that know them. 5. If they undertake no more than they can perform, and suppose not themselves fitter than they are, and so run not beyond their knowledge, nor dishonor not the work of God. 6. If they thrust not themselves into any church to preach without a call, nor ordinarily without the pastor’s consent. 7. If they do it not unseasonably when by offending they are likely to do more hurt than good. 8. If in the manner, season and continuance they submit to the guidance of the pastors of the Church (if it be more than ordinary teaching, and not such as every able master of a family may there do). With these cautions we grant that private men may preach; many episcopal divines grant it: and the presbyterians ordinarily permit it in their expectants that are trained up for the ministry… And, says Dr. Fulke, Demetrius himself does seem to allow that when no bishop was present, a layman might preach: Eusebius, Ecclesiastical History, bk. 6, ch. 19 [sect. 15-18]. But that every proud unworthy man and every seducing heretick should preach, yea and thrust himself into other men’s charges, or that any should preach besides the forementioned rules, this we deny, and take it for a dangerous usurpation. But are we not agreed [with the presbyterians] in this? Hear and judge: Mr. [John] Cotton so downright denies ordinary private men to prophesy, interpreting 1 Cor. 14:31 of extraordinarily gifted prophets (of which see his Keys, pp. 20-21) that Mr. [Thomas] Goodwin and Mr. [Philip] Nye thought meet to signify some dissent, ‘Preface’, p. 6. And yet they grant, that this must be performed by private men: 1. Only occasionally, not in an ordinary course. 2. By men of such abilities as are fit for office. 3. And not assuming this of themselves, but judged such by those that have the power, and so allowed and designed to it. And, 4. So as their doctrine be subjected (for the judging of it) in an especial manner to the teaching elders of that church. And I think that this is enough to signify that here we shall have no cause of a breach with them [presbyterians]. Mr. [John] Norton speaks to the same purpose, pp. 123-25, and joins with Mr. Cotton in denying prophesy to private men and expounding 1 Cor. 14 of extraordinarily gifted prophets only: In this therefore doctrinally we agree [with the presbyterians].</p></blockquote>

rant+that+private+men+may+preach%3B+many+episcopal+divines+grant+it%3A+and+the+presbyterians+ordinarily+permit+it+in+their+expectants+that+are+trained+up+for+the+ministry%E2%80%A6+And%2C+says+Dr.+Fulke%2C+Demetrius+himself+does+seem+to+allow+that+when+no+bishop+was+present%2C+a+layman+might+preach%3A+Eusebius%2C+Ecclesiastical+History%2C+bk.+6%2C+ch.+19+%5Bsect.+15-18%5D.+But+that+every+proud+unworthy+man+and+every+seducing+heretick+should+preach%2C+yea+and+thrust+himself+into+other+men%E2%80%99s+charges%2C+or+that+any+should+preach+besides+the+forementioned+rules%2C+this+we+deny%2C+and+take+it+for+a+dangerous+usurpation.+But+are+we+not+agreed+%5Bwith+the+presbyterians%5D+in+this%3F+Hear+and+judge%3A+Mr.+%5BJohn%5D+Cotton+so+downright+denies+ordinary+private+men+to+prophesy%2C+interpreting+1+Cor.+14%3A31+of+extraordinarily+gifted+prophets+%28of+which+see+his+Keys%2C+pp.+20-21%29+that+Mr.+%5BThomas%5D+Goodwin+and+Mr.+%5BPhilip%5D+Nye+thought+meet+to+signify+some+dissent%2C+%E2%80%98Preface%E2%80%99%2C+p.+6.+And+yet+they+grant%2C+that+this+must+be+performed+by+private+men%3A+1.+Only+occasionally%2C+not+in+an+ordinary+course.+2.+By+men+of+such+abilities+as+are+fit+for+office.+3.+And+not+assuming+this+of+themselves%2C+but+judged+such+by+those+that+have+the+power%2C+and+so+allowed+and+designed+to+it.+And%2C+4.+So+as+their+doctrine+be+subjected+%28for+the+judging+of+it%29+in+an+especial+manner+to+the+teaching+elders+of+that+church.+And+I+think+that+this+is+enough+to+signify+that+here+we+shall+have+no+cause+of+a+breach+with+them+%5Bpresbyterians%5D.+Mr.+%5BJohn%5D+Norton+speaks+to+the+same+purpose%2C+pp.+123-25%2C+and+joins+with+Mr.+Cotton+in+denying+prophesy+to+private+men+and+expounding+1+Cor.+14+of+extraordinarily+gifted+prophets+only%3A+In+this+therefore+doctrinally+we+agree+%5Bwith+the+presbyterians%5D.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Church+Concord%2C+containing%3A+I.+A+Dissuasive+from+Unnecessary+Division+%26+Separation%2C+%26+the+Real+Concord+of+the+Moderate+Independents+with+the+Presbyterians%2C+instanced+in+Ten+seeming+Differences%E2%80%A6+%281655+%2F+1667%3B+London%3A+1691%29%2C+ch.+10%2C+difference+8%2C+pp.+38-39&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6bb519db25.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6bb519db25.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/preaching#:~:text=The%20presbyterians%20deny%20not%20but%20private,doctrinally%20we%20agree%20%5Bwith%20the%20presbyterians&amp;text=The%20presbyterians%20deny%20not%20but%20private%20men%20may&amp;text=this%20therefore%20doctrinally%20we%20agree%20%5Bwith%20the%20presbyterians" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

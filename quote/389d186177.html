<main class="wrap"><figure class="quote" id="q-389d186177" data-kw="">
<blockquote><p>Although Christ fulfilled the law for us as to obedience, it cannot be inferred that we are no longer bound to render obedience to God. It certainly follows that we are not bound to obey for the same end and from the same cause (to wit, that we may live by it, from our federal subjection). But this does not hinder our being bound by a natural obligation to yield the same obedience to God, not that we may live but because we live; not that we may acquire a right to life, but that we may enter upon the possession of the acquired right. Just as (though Christ died for us) we do not cease to be still liable to death—not for a punishment, but for salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (P&amp;R Publishing, 1992–97), 14.13.27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25ccb04829" data-kw="">
<blockquote><p>In November 2023, Defendant Santa Ana City Council adopted a resolution denying the application of Plaintiff Anchor Stone Christian Church for permission to use its property, located at 2398 Daimler Street, Santa Ana, California (the “Property”), for religious assembly. Following the denial of its application, Anchor Stone commenced this action against Defendants City of Santa Ana and its City Council (jointly, the “City”). Presently before the Court is Anchor Stone’s motion for a preliminary injunction. In support of its Motion, Anchor Stone argues that (1) the City’s zoning rules violate the Equal Terms Provision of the Religious Land Use and Institutionalized Persons Act (“RLUIPA”), 42 U.S.C. §§ 2000cc et seq.; (2) the City’s denial of Anchor Stone’s conditional use permit application violated the Substantial Burden Provision of RLUIPA; and (3) the City’s denial of Anchor Stone’s conditional use permit application violated the Free Exercise Clause of the First Amendment. After reviewing the papers filed in support and in opposition,2 and after carefully considering the argument of counsel at the hearing on the Motion, the Court concludes that Anchor Stone has established that it is likely to succeed on the merits of its claims and that it has satisfied the other requirements for preliminary injunctive relief. Accordingly, Anchor Stone’s instant Motion is GRANTED. The City is preliminarily ENJOINED and RESTRAINED from preventing Anchor Stone from holding services on the Property and from preventing Anchor Stone from undertaking its planned renovations of the Property.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anchor-stone-christian-church-v-city-of-santa-ana-and-santa-ana-city-council.html">Anchor Stone Christian Church v City of Santa Ana and Santa Ana City Council</a></span><span class="wk"><span class="lbl">Work:</span> <cite>April 7</cite>, 2025</span></figcaption>

</figure><figure class="quote" id="q-31cea46497" data-kw="">
<blockquote><p>The universal moral law either impressed by God upon the mind of all people or immediately discerned by the reason in its encounter with the order of nature. The natural law was therefore available even to those pagans who did not have the advantage of the Sinaitic revelation and the lex Mosaica [Law of Moses], with the result that they were left without excuse in their sins, convicted by conscientia [conscience]. The scholastics argue the identity of the lex naturalis [Natural Law] with the lex Mosaica or lex moralis [Moral Law] quod substantiam, according to substance, and distinguish them quod formam, according to form. The lex naturalis is inward, written on the heart and therefore obscure, whereas the lex Mosaica is revealed externally and written on tablets and thus of greater clarity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Greek and Latin Theological Terms 1st</cite>, ed. (Baker, 1985), pp. 174-5</span></figcaption>

<blockquote><p>1. Regarding young people who have never been married, none, whether sons or daughters, who have a father still living shall have the power to contract a marriage without the permission of their father unless they have attained the legal age, that is twenty years for a son and eighteen for a daughter. And if after reaching the said age they have asked their fathers or had them asked to marry them and their fathers have not attended to it, in that case it shall be lawful for them to marry without their father’s authority. … 7. Where children marry without their father’s or mother’s permission at the age permitted above and it is established by the court that they have done this lawfully because of the negligence or excessive strictness of their fathers, let the fathers be required to grant them a dowry or provide them such a share or position as [they would have given] if they had consented to it.</p></blockquote>

en%5D%20if%20they%20had%20consented%20to%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d118d349d4" data-kw="">
<blockquote><p>Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>
<div class="actions"><button class="copy" data-copy="“Thus human laws cannot bind the conscience: It is God only, 1 John 3:21, who, as He is greater than the conscience, so has power to bind or loose it: Isa. 31:22. It is He that is the only Lawgiver to the conscience: Jam. 4:12. Princes and Churches may make laws for the outward man, but they can no more bind the heart than they can make it; … The laws of men therefore do not, ought not, cannot bind your conscience, as of themselves; but, if they be just, they bind you in conscience to obedience: … As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden; In the former of these we must yield our careful obedience out of respect even to the duty itself; in the latter, out of respect to the will of the lawgiver; yet so, as that if our own important occasions shall enforce us to transgress a penal law, without any affront of authority or scandal to others, our submission to the penalty frees us from a sinful disobedience.”

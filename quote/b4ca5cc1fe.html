<main class="wrap"><figure class="quote" id="q-b4ca5cc1fe" data-kw="">
<blockquote><p>A twofold trial can be entered into by God with man: either by the law (inasmuch as he is viewed as guilty of violating the law by sin and thus comes under the accusation and condemnation of the law); or by the gospel (inasmuch as he is accused by Satan of having violated the gospel covenant and so is supposed to be an unbeliever and impenitent or a hypocrite, who has not testified by works the faith he has professed with his mouth). Now to this twofold trial a twofold justification ought to answer; not in the Romish sense, but in a very different sense. The first is that by which man is absolved from the guilt of sin on account of the righteousness of Christ imputed to us and apprehended by faith; the other is that by which he is freed from the charge of unbelief and hypocrisy and declared to be a true believer and child of God; one who has fulfilled the gospel covenant (if not perfectly as to degree, still sincerely as to parts) and answered to the divine call by the exercise of faith and piety. The first is justification properly so called; the other is only a declaration of it. That is justification of cause a priori; this is justification of sign or of effect a posteriori, declaratively. In that, faith alone can have a place because it alone apprehends the righteousness of Christ, by whose merit we are freed from the condemnation of the law; in this, works also are required as the effects and signs of faith, by which its truth and sincerity are declared against the accusation of unbelief and hypocrisy. For as faith justifies a person, so works justify faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, 3 vol. (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 2.676.</span></figcaption>

<blockquote><p>God demanded this perfect obedience from a man that was perfect in every way, and equal to the stipulated duty, for indeed: (1) through the image of God conferred upon Him, and in that image, original righteousness, He was blessed with spiritual wisdom… (2) He was to that point without any vice or sin (as much original as actual), through which alone his whole posterity was incapable of rendering to God his due (Rom. 8:3). Thus: (3) intrinsically, he was equipped with a perfect principle of obeying, namely, original righteousness; extrinsically, there was before him a perfect norm of obeying, nor did anything hinder that obedience.</p></blockquote>

</figure><figure class="quote" id="q-bb0fcd2aac" data-kw="">
<blockquote><p>6th Objection: The Messiah brings everlasting justice and righteousness. Imputed righteousness is not eternal. Therefore we are not thereby justified. Answer: It is said that Christ’s righteousness shall be an everlasting righteousness; but after a diverse manner. For in the life to come we shall be just after another manner than in this life. For although we shall then be just by the same righteousness, even by the righteousness of Christ imputed unto us: yet with this shall also the legal justice and righteousness be continued, so that then also by the legal righteousness we shall be perfectly just, because now only we are, as concerning that, but in part and beginning just. Each justice, both the justice of the Law, and the justice of the Gospel, is eternal, by continuation: And the justice and righteousness of the Gospel, that is, the justice of Christ imputed unto us, is eternal by continuation of the imputation: The justice of the Law is eternal by continuation of good works, even as it is continued by good works, first, and beginning in this life, until at length after this life it be perfected, and become perfect, and so continue to all eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’, p. 687</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-e54e001d1d" data-kw="">
<blockquote><p>The Popish Prelate [John Maxwell] (ch. 7, p. 87) objects against us… 2. The maxim of the law is, Surrogatus gaudet privilegus ejus cui surrogatur, et qui succedit in locum, succedit in jus. The person surrogated has all the privileges that he has in whose place he succeeds; he who succeeds to the place succeeds to the rights; the adopted son, or the bastard who is legitimated and comes in the place of the lawful born son, comes also in the privileges of the lawful born son. … Answer: 1. He that is surrogated in the place of another, due to him by a positive law of man, he has law to all the privileges that he has in whose place he is surrrogated, that is true. He who comes in the place of a mayor of a city, of a captain in an army, of a pilot in a ship, or of a pope, has all the privileges and rights that his predecessors had by law. Jus succedit juri, persona jure predita personce jure preditce. So the law, so far as my reading can reach, who profess myself a divine; but that he who succeeds to the place of a father by nature, should enjoy all the natural rights and privileges of the person to whom he succeeds, I believe the law never dreamed it; for then the adopted son, coming in place of the natural son, has right to the natural affection of the father. If any should adopt Maxwell the prelate, should he love him as the pursuivant of Crail (Maxwell’s father) loved him, I conceive not. Has the adopted son his life, his being, the figure bodily, the manners of the son in whose place he is adopted; or doth he naturally resemble the father as the natural son does? The Prelate did not read this law in any approved jurist… A natural son is not made a son by the consent of parents, but he is a son by generation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), pp. 63-64</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Popish Prelate [John Maxwell] (ch. 7, p. 87) objects against us… 2. The maxim of the law is, Surrogatus gaudet privilegus ejus cui surrogatur, et qui succedit in locum, succedit in jus. The person surrogated has all the privileges that he has in whose place he succeeds; he who succeeds to the place succeeds to the rights; the adopted son, or the bastard who is legitimated and comes in the place of the lawful born son, comes also in the privileges of the lawful born son. … Answer: 1. He that is surrogated in the place of another, due to him by a positive law of man, he has law to all the privileges that he has in whose place he is surrrogated, that is true. He who comes in the place of a mayor of a city, of a captain in an army, of a pilot in a ship, or of a pope, has all the privileges and rights that his predecessors had by law. Jus succedit juri, persona jure predita personce jure preditce. So the law, so far as my reading can reach, who profess myself a divine; but that he who succeeds to the place of a father by nature, should enjoy all the natural rights and privileges of the person to whom he succeeds, I believe the law never dreamed it; for then the adopted son, coming in place of the natural son, has right to the natural affection of the father. If any should adopt Maxwell the prelate, should he love him as the pursuivant of Crail (Maxwell’s father) loved him, I conceive not. Has the adopted son his life, his being, the figure bodily, the manners of the son in whose place he is adopted; or doth he naturally resemble the father as the natural son does? The Prelate did not read this law in any approved jurist… A natural son is not made a son by the consent of parents, but he is a son by generation…”

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), pp. 63-64">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Popish+Prelate+%5BJohn+Maxwell%5D+%28ch.+7%2C+p.+87%29+objects+against+us%E2%80%A6+2.+The+maxim+of+the+law+is%2C+Surrogatus+gaudet+privilegus+ejus+cui+surrogatur%2C+et+qui+succedit+in+locum%2C+succedit+in+jus.+The+person+surrogated+has+all+the+privileges+that+he+has+in+whose+place+he+succeeds%3B+he+who+succeeds+to+the+place+succeeds+to+the+rights%3B+the+adopted+son%2C+or+the+bastard+who+is+legitimated+and+comes+in+the+place+of+the+lawful+born+son%2C+comes+also+in+the+privileges+of+the+lawful+born+son.+%E2%80%A6+Answer%3A+1.+He+that+is+surrogated+in+the+place+of+another%2C+due+to+him+by+a+positive+law+of+man%2C+he+has+law+to+all+the+privileges+that+he+has+in+whose+place+he+is+surrrogated%2C+that+is+true.+He+who+comes+in+the+place+of+a+mayor+of+a+city%2C+of+a+captain+in+an+army%2C+of+a+pilot+in+a+ship%2C+or+of+a+pope%2C+has+all+the+privileges+and+rights+that+his+predecessors+had+by+law.+Jus+succedit+juri%2C+persona+jure+predita+personce+jure+preditce.+So+the+law%2C+so+far+as+my+reading+can+reach%2C+who+profess+myself+a+divine%3B+but+that+he+who+succeeds+to+the+place+of+a+father+by+nature%2C+should+enjoy+all+the+natural+rights+and+privileges+of+the+person+to+whom+he+succeeds%2C+I+believe+the+law+never+dreamed+it%3B+for+then+the+adopted+son%2C+coming+in+place+of+the+natural+son%2C+has+right+to+the+natural+affection+of+the+father.+If+any+should+adopt+Maxwell+the+prelate%2C+should+he+love+him+as+the+pursuivant+of+Crail+%28Maxwell%E2%80%99s+father%29+loved+him%2C+I+conceive+not.+Has+the+adopted+son+his+life%2C+his+being%2C+the+figure+bodily%2C+the+manners+of+the+son+in+whose+place+he+is+adopted%3B+or+doth+he+naturally+resemble+the+father+as+the+natural+son+does%3F+The+Prelate+did+not+read+this+law+in+any+approved+jurist%E2%80%A6+A+natural+son+is+not+made+a+son+by+the+consent+of+parents%2C+but+he+is+a+son+by+generation%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex...+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+pp.+63-64&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe54e001d1d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e54e001d1d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/adoption#:~:text=The%20Popish%20Prelate%20%5BJohn%20Maxwell%5D%20%28ch,he%20is%20a%20son%20by%20generation&amp;text=The%20Popish%20Prelate%20%5BJohn%20Maxwell%5D%20%28ch.%207%2C%20p&amp;text=parents%2C%20but%20he%20is%20a%20son%20by%20generation" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

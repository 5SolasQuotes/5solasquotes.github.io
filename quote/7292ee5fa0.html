<main class="wrap"><figure class="quote" id="q-7292ee5fa0" data-kw="">
<blockquote><p>Again, some school-divines following Damascene make and ascribe to God an applied or depending [consequent] will, on this manner: God for his part [antecedently] would have all men without exception to be saved: why then are they not saved? They themselves will not. And because they will not, God therefore [consequently] chooses some and refuses others. But according to the former doctrine, I take this kind of applied will to be an invention of man’s brain. For the contrary is the truth, namely that man’s will wholly depends on the will of God. That vessels be some of honor, some of dishonor, it is not in the power of the clay, but in the will of the potter. The first cause orders the second, and not the second the first. To make God’s will depend on man’s will, is to put God out of his throne of majesty, and to set the creature in his room. Others set forth the depending will of God on this manner: God (say they) decrees nothing in particular of things that are casual and contingent, but He foresees within Himself what the will of the creature will do or not do, when things are thus or thus ordered: and upon this foresight He consequently determines what shall be done. (Bellarmine, bk. 4, ch. 15, Of Grace &amp; Free Will; Richard Tapper) But this opinion, as it gives unto God a common or general providence, so it takes away the certain determination of God touching all particular events. And it is absurd to think that God should foresee the future acts of man’s freewill, when as yet He has determined nothing: for things that shall be, are therefore to come to pass, because God by decree has determined their being. And therefore the foreknowledge of things that shall be follows the decree of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601)</cite>, pp. 146-48</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3299ae28fa" data-kw="">
<blockquote><p>Question: But how could he [Paul] wish this [to be accursed from Christ for his brethren’s sake, in Rom. 9:3], seeing it imports a diminution of the love of God… Answer: If ye will consider this petition by itself, it was neither sin nor dimunition of this love: but if ye will consider the consequents of this wish, if indeed he had been excluded from the Kingdome of heaven, then it had been a sin for him to have wished it. One may wish a thing simply without sin, yet to wish it vestitum omnibus circumstantiis [clothed with all circumstances] it may be sin. Example: a woman has her husband to be executed for some capital offence, the woman wished her husband to live, as her husband and a father to her children to provide for them; but if she should desire her husband to live as an enemy to the commonwealth contrary to the law, then her wish were a sinful wish: So for Paul to wish this to testify his earnest love to the Church, it was no sin; but if he had wished it vestitum ominibus circumstantiis, with a diminution of the love of God and want of eternal happiness, then his wish had been sin. Again we wish a thing antecedente voluntate vel consequente voluntate, ‘with an antecedent or consequent will.’ Example: a judge by his antecedent will wishes that all the subjects may live; but by his consequent will, he wishes the malefactor to die. So Paul wished this by his antecedent will, but not considering it with all the consequents that might follow upon it. Fourthly, Paul wished not this absolutely, but in comparison: as the natural mother who pleaded before Solomon chose rather that the child should be given to her who was not the mother of it than that the child should be cut in two, 1 Kn. 3:26. If ye consider Paul’s wish here, it was only in comparison; rather than they should die, he wishes this to himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Moral Law, or Ten Commandments... (London: Cotes, 1632), bk. 1, Commandment 1, Exercitation 7</cite>, pp. 50-51</span></figcaption>

</figure><figure class="quote" id="q-a8df8cd63a" data-kw="">
<blockquote><p>In light of such problems, Leigh, Maccovius, and Twisse (very much following the tradition) indicate that the voluntas propositi or beneplaciti [proposed will or of good pleasure, i.e. the will of decree] alone is properly called the will of God, ‘which none can resist, Rom. 9:19,’ whereas the voluntas signi or commandment is only ‘improperly’ called God’s will… Baxter does agree with Twisse, however, that the commandments or signs of God are only improperly designated as the divine will.</p></blockquote>

<blockquote><p>4. The prosperity of sinners usually renders the means of grace ineffectual, that should reclaim and reform them, and consequently their destruction is remediless. The means of grace are internal or external: Internal, the motions of the Holy Spirit and the convictions and excitations of conscience: External, the ministry of the Word and the counsels of faithful friends; all which are usually made frustrated and inefficacious by the vices and lusts of the prosperous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bates.html">William Bates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Danger of Prosperity Discovered in Several Sermons upon Prov. 1:27 (London: Aylmer, 1685)</cite>, p. 57</span></figcaption>

</figure><figure class="quote" id="q-456787a1bb" data-kw="">
<blockquote><p>102. The distinction of God’s antecedent and consequent will, used by Damascene, is by many applied to this controversy, but by none that I have read sufficiently explained, which is the cause that so many good men reject it, because they misunderstand it. It’s truly said that by his antecedent will, God would have all men to believe, repent and be saved, but by his consequent will He will have all condemned whom He does condemn. But then it must be understood that this distinction is not applied to the will of God as He is merely an Absolute Proprietary or Benefactor, but as He is the King or Rector of the world; and so his legislation is his antecedent will, and his judgment is his consequent will. And no man of religion can deny either that God’s Law is the signification of his will, or his will signified, or that his judgment and execution is his will declared; or that God’s Law of Grace does conditionally give pardon and salvation to all antecedently to man’s performance or rejection of the condition, or that God condemns infidels consequently to their infidelity. The Law antecedently to man’s part acted says, ‘He that believes shall be saved;’ and the sentence consequently to his fact says, ‘Judas, an unbeliever or impenitent, shall perish.’ And thus the distinction has no doubt or difficulty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Catholic Theology... (London: White, 1675) | pt. 2, sect. 7, ‘The Antecedent &amp; Consequent Will of God, etc.’</cite>, p. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“102. The distinction of God’s antecedent and consequent will, used by Damascene, is by many applied to this controversy, but by none that I have read sufficiently explained, which is the cause that so many good men reject it, because they misunderstand it. It’s truly said that by his antecedent will, God would have all men to believe, repent and be saved, but by his consequent will He will have all condemned whom He does condemn. But then it must be understood that this distinction is not applied to the will of God as He is merely an Absolute Proprietary or Benefactor, but as He is the King or Rector of the world; and so his legislation is his antecedent will, and his judgment is his consequent will. And no man of religion can deny either that God’s Law is the signification of his will, or his will signified, or that his judgment and execution is his will declared; or that God’s Law of Grace does conditionally give pardon and salvation to all antecedently to man’s performance or rejection of the condition, or that God condemns infidels consequently to their infidelity. The Law antecedently to man’s part acted says, ‘He that believes shall be saved;’ and the sentence consequently to his fact says, ‘Judas, an unbeliever or impenitent, shall perish.’ And thus the distinction has no doubt or difficulty.”

— Richard Baxter, Richard Baxter’s Catholic Theology... (London: White, 1675) | pt. 2, sect. 7, ‘The Antecedent &amp; Consequent Will of God, etc.’, p. 54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C102.+The+distinction+of+God%E2%80%99s+antecedent+and+consequent+will%2C+used+by+Damascene%2C+is+by+many+applied+to+this+controversy%2C+but+by+none+that+I+have+read+sufficiently+explained%2C+which+is+the+cause+that+so+many+good+men+reject+it%2C+because+they+misunderstand+it.+It%E2%80%99s+truly+said+that+by+his+antecedent+will%2C+God+would+have+all+men+to+believe%2C+repent+and+be+saved%2C+but+by+his+consequent+will+He+will+have+all+condemned+whom+He+does+condemn.+But+then+it+must+be+understood+that+this+distinction+is+not+applied+to+the+will+of+God+as+He+is+merely+an+Absolute+Proprietary+or+Benefactor%2C+but+as+He+is+the+King+or+Rector+of+the+world%3B+and+so+his+legislation+is+his+antecedent+will%2C+and+his+judgment+is+his+consequent+will.+And+no+man+of+religion+can+deny+either+that+God%E2%80%99s+Law+is+the+signification+of+his+will%2C+or+his+will+signified%2C+or+that+his+judgment+and+execution+is+his+will+declared%3B+or+that+God%E2%80%99s+Law+of+Grace+does+conditionally+give+pardon+and+salvation+to+all+antecedently+to+man%E2%80%99s+performance+or+rejection+of+the+condition%2C+or+that+God+condemns+infidels+consequently+to+their+infidelity.+The+Law+antecedently+to+man%E2%80%99s+part+acted+says%2C+%E2%80%98He+that+believes+shall+be+saved%3B%E2%80%99+and+the+sentence+consequently+to+his+fact+says%2C+%E2%80%98Judas%2C+an+unbeliever+or+impenitent%2C+shall+perish.%E2%80%99+And+thus+the+distinction+has+no+doubt+or+difficulty.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Catholic+Theology...+%28London%3A+White%2C+1675%29+%7C+pt.+2%2C+sect.+7%2C+%E2%80%98The+Antecedent+%26+Consequent+Will+of+God%2C+etc.%E2%80%99%2C+p.+54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F456787a1bb.html&amp;via=5Solas" target="_blank" rel="

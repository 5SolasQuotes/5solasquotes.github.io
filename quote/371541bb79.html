<main class="wrap"><figure class="quote" id="q-371541bb79" data-kw="">
<blockquote><p>God’s curse to the woman was in part, ‘I will greatly multiply your sorrow and your conception’ (Gen. 3:16). Just as every other aspect of creation entered into a curse, so too did conception. To ignore the impact of the fall upon procreation is to miss critical changes that have come about that can make conception a sorrow rather than a blessing (things like cancer, high blood pressure, being worn out from running after five children under the age of six, changes to the function of lactation, etc.)… Physiology shows that perfect bodies were designed by God to suppress ovulation as long as there was breastfeeding (up to three years). The Fall has impacted many bodies to override this normal God-given function.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>It hence also follows that the conception of Christ in the womb, being the effect of a creating act, was not accomplished successively and in process of time, but was perfected in an instant; for although the creating acts of infinite power, where the works effected have distinct parts, may have a process or duration of time allotted unto them, as the world was created in six days, yet every part of it that was the object of an especial creating act was instantaneously produced. So was the forming of the body of Christ, with the infusion of a rational soul to quicken it, though it increased afterwards in the womb unto the birth. And as it is probable that this conception was immediate upon the angelical salutation, so it was necessary that nothing of the human nature of Christ should exist of itself antecedently unto its union with the Son of God: for in the very instant of its formation, and therein, was the “Word made flesh,” John 1:14; and the Son of God was “made of a woman,” Gal. 4:4; so that the whole essence of his nature was created in the same instant. Thus far the Scriptures go before, and herein it is necessary to assert the forming of the body and soul of Christ by the Holy Spirit. The curious inquiries of some of the schoolmen and others are to be left unto themselves, or rather, to be condemned in them; for what was farther in this miraculous operation of the Holy Ghost, it seems purposely to be hid from us in that expression, [Greek] ‘The power of the Most High shall overshadow thee.’ Under the secret, glorious covert hereof we may learn to adore that holy work here, which we hope to rejoice in and bless God for unto eternity. And I suppose, also, that there is in the word an allusion unto the expression of the original acting of the Holy Spirit towards the newly-produced mass of the old creation, whereof we spake before. Then it is said of Him that he was [Hebrew], as it were ‘hovering’ and ‘moving’ over it for the formation and production of all things living; for both the words include in them an allusion unto a covering like that of a fowl over its eggs, communicating, by its cognate warmth and heat, a principle of life unto their seminal virtue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 2 in Works (Philadelphia: Protestant Episcopal Book Soceity, 1862), vol. 3, pp. 165-66</span></figcaption>

</figure><figure class="quote" id="q-f96e682650" data-kw="">
<blockquote><p>Difficult are the questions, at what time the fetus is animated, and what is the proximate and internal principle of the formation of the fetus, which have their use in the explication of certain passages of scripture, for example Eccl. 11, Ps. 139, and in the disputations on the person of Christ, and in certain cases about abortion and homicide pertaining to the sixth commandment of the Decalogue. Thomas Feyens inquired into the animation of the fetus in a special treatise, where you will find the varying opinions and authors indicated. He himself, however, diverges from the common and received opinion of the physicians (whom hitherto the fathers, scholastics, and our philosophers and theologians have followed). They also treat of this matter: Sennert and his antagonist Gallego de la Serna, and Freitag. But on this question see below appendix 1 thesis 4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | ‘On Creation’, pt. 10, after 9th problem, p. 307</span></figcaption>

e</a></div>
</figure><figure class="quote" id="q-6cb2b4fae1" data-kw="">
<blockquote><p>A leading theory is that the increased risk for depression stems from an altered stress response among birth control pill users. Studies indicate that women on the pill have a blunted cortisol response: In acute stress tasks, they have a slow rise and a gradual fall of cortisol rather than the classic spike that signifies a healthy stress response. Despite the cortisol differences, these women report feeling at least as much stress as non–pill takers… women on the pill also tend to show differences in their inflammatory stress response, which occurs just before the cortisol spike.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zara-abrams.html">Zara Abrams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How birth control pills affect the brain: Research on cognition, stress responses, and health impacts helps women make informed reproductive health decisions’ in Monitor on Psychology</cite>, vol. 56, no. 3 (Apr/May 2025), p. 50 ff.</span></figcaption>

<blockquote><p>Finney provides scholarly documentation and references to ancient sources that make it difficult to discredit the thesis that some Roman men did, in fact, have the serious obligation of appearing before a deity with their heads covered… He takes exception to the works of Jerome Murphy-O’Connor, Richard Hays, and Gordon Fee, who all argued that the text is discussing long hair, not veiling.” – Massey (2018) Abstract: “A significant yet missing dimension of scholarly engagement with 1 Cor. 11:2-16 is the consideration of honour-shame and its critical importance in ancient cultures. As this section of Paul’s letter abounds in honour-shame terminology, analysis of the text within such a framework will allow a profitable exploration of the reasons why the Corinthians are changing their attire (for purposes of this paper, their headcoverings), in a way that appears to be contrary to what may be considered the Pauline norm. The argument offered here is that notions of honour come to the fore and higher-status male Corinthians are employing modes of head attire to maintain distinctions of status. At the same time, Paul insists upon female head-coverings to safeguard the honour of the community within a context of the potential presence of non-believers in a communal service of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mark-finney.html">Mark Finney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Honour, Head-Coverings &amp; Headship: 1 Corinthians</cite>, 11.2-16 in Its Social Context’ JSNT 33 (2010), pp. 31-58</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa459e7ca9" data-kw="">
<blockquote><p>But their [the Independents’] main difference from all the Reformed, and greatest consonancy with the Brownists [separatist Independents], is in this, that as they teach all outward signs of worship in the time of the celebration to be idolatry [such as the societal customs the Scots practiced], and hereupon declare the necessity of all men who will follow the example of the first communicants, to keep on their hats all the time of this holy action; so likewise the Independents begin to teach their disciples; For however at Amsterdam this day the named doctrine be not fully practiced, the men there covering their heads in the time of the celebration, but every one uncovering, during the time of their own personal participation of the elements, yet we are now taught at London that covering is most requisite at the time of participation. That this act is a rite significant to the communicants of their table-honor and fellowship with Christ, also that the minister in all his celebration must be uncovered, and that in sign of his service to the communicants as the Lord’s much honored children, [who are] sitting covered when they eat of their Father’s meat.† † I have heard some of their chief men discourse publicly enough to this purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time, wherein the Tenets of the Principal Sects, Especially of the Independents, are Drawn Together in One Map</cite>, (London, 1645) | ch. 6, ‘An Enumeration of the Common Tenets of the Independents’, pp. 122 &amp; 149</span></figcaption>

</figure><figure class="quote" id="q-89a86161ba" data-kw="">
<blockquote><p>Although there is much evidence for the practice of female veiling in the Classical world it has for the most part been ignored. Evidence for the veiling of Roman women is found in many sources. Ancient lexicographers list many names for veils that these women wore. Each of these veils was particular to the context in which they were worn and by whom they were worn. The plenitude of veiling terminology as well as the specialized nature of these veils alerts the reader to the importance that the Romans attributed to the veil, suggesting that it formed an important part of their culture and this is described in visual and literary terms by ancient artists and writers. … The practice of veiling is therefore viewed by the Romans in a positive light, and its disruption is understood by them as a cause for concern. This concern was especially apparent during the late republic. The dissolution of the traditional forms of government was in some ways problematized in terms of gender, with women’s abandonment of their traditional roles and their incursion into the public sphere being of specific importance. In order to remedy this, attempts were made by the new regime of Augustus to promote a return to what were seen to be traditional gender relations. This programme of moral reform made use of both formal, legalistic decree (the Julian marriage laws) and more propagandistic constructions (the public works of art). In this process traditional symbols assumed a high degree of salience. Because of its power to signify the beneficial and appropriate status of the female body, one of the most important of these symbols was the veil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lydia-lenore-veronica-matthews.html">Lydia Lenore Veronica Matthews</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conspicuous Concealment: an Investigation into the Veiling of Roman Women, with Special Reference to the Time of Augustus MA thesis</cite>, (University of KwaZulu-Natal, 2007) 225 pp. Pictures are on, pp. 149-204</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-2f1d9a78bd" data-kw="">
<blockquote><p>The theologian Tertullian (c.160-c.230 CE) was a prominent voice in early western Christianity, writing extensively about women… The thesis contextualizes Tertullian’s beliefs and offers specific examples of both incidences where elements of his thought may be traced, directly and indirectly, to contemporary non-Christian ideas, and places where that thought is in dialogue with or explicitly rejecting those ideas. The research here suggests that Tertullian was both influenced by Roman, non-Christian intellectual culture and explicitly rejected aspects thereof.</p></blockquote>

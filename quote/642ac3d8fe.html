<main class="wrap"><figure class="quote" id="q-642ac3d8fe" data-kw="">
<blockquote><p>4. The Church is not made ministerial by us, without the body exclusively wholly (for Christ’s government is voluntary), nor ought any new thing to be concluded in our assemblies while the people hear of it: for if the Romans used rogare et suadere legem [to ask and persuade the law], and obtain the consent of the people thereunto, far more are they not to be acknowledged as Church-laws that are to be obtruded upon the godly against their will and knowledge; and much more if they be against the Word of God, and former godly acts with consent agreed unto by the Church; that is, whether the people consent or not, but yet without the body, whether they exercise acts of jurisdiction or not, for no act of jurisdiction is due to them; and to exclude the consent of women, no less interessed [interested] in practice of conscience than men, is to be Lord’s of their faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 258</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-02839b324d" data-kw="">
<blockquote><p>It is to be carefully observed, that Paul, though an apostle, does not himself, as an individual, excommunicate according to his own pleasure [in 1 Cor. 5], but consults with the Church, that the matter may be transacted by common authority. He, it is true, takes the lead, and shows the way, but, in taking others as his associates, he intimates with sufficient plainness, that this authority does not belong to any one individual. As, however, a multitude never accomplishes anything with moderation or seriousness, if not governed by counsel, there was appointed in the ancient Church a presbytery, that is, an assembly of elders, who, by the consent of all, had the power of first judging in the case. From them the matter was brought before the people, but it was as a thing already judged of. Whatever the matter may be, it is quite contrary to the appointment of Christ and his apostles — to the order of the Church, and even to equity itself, that this right should be put into the hands of any one man, of excommunicating at his pleasure any that he may choose. Let us take notice, then, that in excommunicating this limitation be observed — that this part of discipline be exercised by the common counsel of the elders, and with the consent of the people, and that this is a remedy in opposition to tyranny. For nothing is more at variance with the discipline of Christ than tyranny, for which you open a wide door, if you give one man the entire power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 5, v. 4</span></figcaption>

ers#:~:text=It%20is%20to%20be%20carefully%20observed,give%20one%20man%20the%20entire%20power&amp;text=It%20is%20to%20be%20carefully%20observed%2C%20that%20Paul&amp;text=if%20you%20give%20one%20man%20the%20entire%20power" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-74c3c909a4" data-kw="">
<blockquote><p>Our divines, Bucer, Calvin, Bucanus, Tilenus, Beza, Virttut [Viret?], give consenting, and in some cases correcting, not judicial, power sure, but which is great enough, a negative consent for eschewing of a schism. And the professors of Leiden, Ursinus, Pareus, Junius, give the people a vote, a consent in excommunication, and this cannot exclude women who are offended when the whole Church is offended. The times of Ambrose did witness more pride in the clergy, who began to do all without the people. Chemnitz, Daneus, the Confession of Bohemia, of Helvetia, the Synod of Middleburgh, the Synod of Tylleburgh in Nassovia, anno 1582, teach that the whole Church with consent of all did excommunicate, but the judging authority is in the eldership.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 277</span></figcaption>

</figure><figure class="quote" id="q-e56a7aed84" data-kw="">
<blockquote><p>Bavinck… says, the church ‘cannot do without women in this work.’ This includes things like Sunday school, care for the poor and the sick, care for the elderly, the support of pregnant women, and more. He doesn’t think these activities need to be directly under the oversight of the church as an institution, but the church does have the calling to promote this kind of work where women use their gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wes-bredenhof.html">Wes Bredenhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Herman Bavinck on Women in the Church’</cite>, (2021)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-aca6ea0189" data-kw="">
<blockquote><p>Yea in favor of lay-elders he [Hugo Grotius] asserts (having argued them not to be of divine institution, yet): 1. That they may be lawfully instituted by sovereigns, or by the Church on their permission. 2. That it may be proved by Scripture that this institution is not displeasing to God. 3. That there are examples in pious antiquity, either of this same way, or one very near it. 4. That it is no contemptible benefit that by these elders may be received. But these [are] to exercise their office with several cautions: 1. Not claiming institution by divine precept. 2. Not usurping any of the power of the keys, nor of excommunication, further than excommunication belongs to the people (executively). 3. That the men be not unmeet. 4. Exercising no external jurisdiction but by public law. 5. Standing as mutable. Thus far Grotius.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | ‘Objections Answered’</span></figcaption>

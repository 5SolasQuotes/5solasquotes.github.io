<main class="wrap"><figure class="quote" id="q-58c1fdd9d1" data-kw="">
<blockquote><p>Whether Christ is one or two? The prior is affirmed. … Whether Christ is able to be called a composite? It is denied. Whether a whole? It is distinguished. … Whether there are two beings [esse] in Christ, or a twofold existence and individualness? It is affirmed with a distinction. Whether a twofold life? It is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subtitle II, ‘Of the Consequences &amp; Effects of the Union’, ‘Of Christ the Theanthropos’ in Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’ in A Syllabus of Theological Problems… (Utrecht, 1643) n.p.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-37629f4e18" data-kw="">
<blockquote><p>Objection 2: Further, hypostasis is nothing more than a ‘particular substance,’ as Boethius says (De Duab. Nat.). But it is plain that in Christ there is another particular substance beyond the hypostasis of the Word, viz. the body and the soul and the resultant of these. Therefore there is another hypostasis in Him besides the hypostasis of the Word. … Reply to Objection 2: Hypostasis signifies a particular substance, not in every way, but as it is in its complement. Yet as it is in union with something more complete, it is not said to be a hypostasis, as a hand or a foot [is, as joined to a person’s body]. So likewise the human nature in Christ, although it is a particular substance, nevertheless cannot be called a hypostasis or suppositum, seeing that it is in union with a completed thing, viz. the whole Christ, as He is God and man. But the complete being with which it concurs is said to be a hypostasis or suppositum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 3, ‘Whether the union of the Word Incarnate took place in the suppositum or hypostasis?’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

p;text=is%20said%20to%20be%20a%20hypostasis%20or%20suppositum" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§VII. This [hypostatic] union is not a conjunction of parts, like soul and body, but an assumption of the human nature into unity with the person without change, confusion, division, or separation.</p></blockquote>

</figure><figure class="quote" id="q-8ffaeccd41" data-kw="">
<blockquote><p>1st. The highest and closest union is between those things that are actuated by one spirit dwelling and moving in them… 2dly. Things at the greatest distance, and between which there is no physical continuity, may be acted by the same spirit, providing he be immense and infinite… 3dly. ‘Tis Christ as mediator that believers are united to… 4. The Holy Ghost did in a singular manner operate upon and reside in the human nature of Christ… 5thly. The Holy Ghost is the immediate renewer and sanctifier of the elect… 6thly. ‘Tis from, by, and through Jesus Christ as mediator that the Spirit, whether it be with respect to his Immediate seisure of us and dwelling in us, or with reference to any of his saving operations, is given to and bestowed upon us… 7ly. Through the communication of the Spirit from Christ to us, and immediately upon his taking the possession of us, the nature of Christ, the seed of God, and a vital living principle comes to be formed in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-ferguson.html">Robert Ferguson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 3, ‘Of the Union of Believers with Christ’ Outline in The Interest of Reason in Religion… &amp; the Nature of the Union Betwixt Christ &amp; Believers; (with Reflections on Several Late Writings, especially Mr. Sherlock’s Discourse…)… (London, 1675), pp. 421-665</cite>, pp. 656-661:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

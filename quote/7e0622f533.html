<main class="wrap"><figure class="quote" id="q-7e0622f533" data-kw="">
<blockquote><p>And in token of this subjection the apostle tells us, 1 Cor. 11:10, that the woman was to have power over her head, because of the angels. Which place, especially the latter clause of it, is diversly interpreted. But I think all agree in this, That this power which they were to have on their heads was a veil or covering, which at other times, but most especially in the congregation, women ought to wear on their heads; and which in the primitive times covered not only their heads, but all their face, as a guard to their modesty, and a screen to keep off loose and wanton eyes. And this veil is called power, to signify that they were under the power and authority of their husbands. But the men were uncovered in their assemblies, as the apostle tells us, verse 4, to signify that they had nothing over them, but were superior to all visible creatures, and subject only unto God. This power, or veil, women were to wear because of the angels… But either by angels are meant the ministers of the Church, before whom they are to show modesty and bashfulness; or else perhaps the celestial angels, who are always present and attending in the assemblies and congregations of the faithful; and therefore women should not do anything unbecoming and unseemly before them: Or lastly, because the angels themselves do reverence Christ, who is their head, and in token of their subjection unto him, are said to veil and cover their faces: And therefore women also in token of their subjection to their husbands, who are their heads, as Christ is of the Church, should likewise cover their heads and faces with a veil. So we find Gen. 24:65. that when Rebekah saw Isaac coming towards her, she took a veil and covered herself, as a sign of her subjection to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments with other Sermons</cite>, … (London, 1691) | 5th Commandment, pp. 285-6</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6721ab3bf3" data-kw="">
<blockquote><p>…and undeniably the Jewish days, the High Priest’s garment and many things of that kind, were divine or religious performances, things or adjuncts of divine worship, but so as they are not merely adjuncts of worship, but also worship; for the High Priest’s ephod was not only a civil ornament, nor was it a mere physical or natural means to fence off the injuries of sun and heaven, we do not think that the Lord in all or any place of the Old or New Testament sets down any laws concerning garments simply, as they do fence off cold or heat (that belongs to art), only he speaks of garments as contrary to gravity, as signs of vanity and lightness, Isa. 3:16, etc. Zeph. 1:8; 1 Pet. 3:3-4. And of garments as religious observances, of which sort was the attire and garments of the priests and High-Priests in their service, in which consideration the religious times, holy places, and mosaical garments were divine worship, by which God was immediatly honored, but not adjuncts only, or actions; but religious things or performances.</p></blockquote>

<blockquote><p>1. …The apostle tells us there must be nudatio capitis, our heads must be uncovered. The wearing of a cap, pileo donari, among the Romans, was peculiar to free men only, and an hieroglyphic of honor, for once if a man cepisset pileum, he was free, and when he laid aside his cap, he was said deponere magnificentiam, to lay aside his honor and privilege whereby he was distinguished from a servant. So then, as servants are to be uncovered in their master’s service, so are we to be in God’s: and therefore Saint Paul (in the place before cited) tells us that it is a shame for a man to have his head covered at that time. … But in this point corruption is crept into our Church. Instead of humbling ourselves by prostration and kneeling, we are pleased to sit at our ease, and that in a proud manner: instead of the depositio magnificentiae, et nudatio capitis, kneeling and uncovering our heads, we sit, and with our heads covered too; this is not to enquire, at least not to imitate, the days of old… This sedentary prayer and proud fashion of covering the head cannot be warranted by any text in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments</cite>, … (d. 1626; London, 1650), 2nd Commandment, ch. 7, pp. 215, 217</span></figcaption>

s-in-the-post-reformation-era/#:~:text=The%20apostle%20tells%20us%20there%20must,warranted%20by%20any%20text%20in%20Scripture&amp;text=The%20apostle%20tells%20us%20there%20must%20be%20nudatio&amp;text=cannot%20be%20warranted%20by%20any%20text%20in%20Scripture" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The theologian Tertullian (c.160-c.230 CE) was a prominent voice in early western Christianity, writing extensively about women… The thesis contextualizes Tertullian’s beliefs and offers specific examples of both incidences where elements of his thought may be traced, directly and indirectly, to contemporary non-Christian ideas, and places where that thought is in dialogue with or explicitly rejecting those ideas. The research here suggests that Tertullian was both influenced by Roman, non-Christian intellectual culture and explicitly rejected aspects thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/mary-fellman.html">Mary Fellman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Social Context Of Tertullian’s ‘On The Veiling Of Virgins” MA thesis</cite>, (Cornell Univ., 2009) 55, pp. no pictures</span></figcaption>

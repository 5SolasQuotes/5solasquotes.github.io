<main class="wrap"><figure class="quote" id="q-b8026e58bd" data-kw="">
<blockquote><p>The sum of my doctrine which I bring them [Scriptures] to confirm, I contract into these heads.

1. That faith justifies not as an instrumental efficient cause, but as conditio applicans et disponens, the applying and disposing condition: its applicatory nature being the aptitude to the office, and its being the condition of the promise being the formal or nearest reason of its interest.

2. That repentance is conditio disponens, a dispositive condition of our first justification.

3. That Covenant-keeping by sincere love, thankfulness and obedience to God▪ Redeemer is a condition of the continuing, or not-losing our state of justification.

4. That the renewal of our faith and repentance, upon our lapses into discerned wounding sins, is a condition of the particular pardon of those sins, and our discharge or justification from the guilt of them.

5. That all the foresaid conditions, faith, repentance, love, thankfulness, sincere obedience, together with final perseverance, do make up the condition of our final absolution in judgment, and our eternal glorification.

6. That in the Day of Judgement, seeing we must be Judged by the Gospel or New Covenant, and it will be no small part of the work of the day to enquire whether we have performed the conditions of that Covenant which gives us Christ, and life and pardon, or not; we must therefore against the accusation of non-performance (real or supposed) be justified by our own performance as our particular righteousness: and this is the judging or jusiifying us according to our works, which Scripture mentions. And upon this will our universal and final justification depend, as upon its condition. And therefore whoever will be justified at that day, must have a Justitia prolegalis or a righteousness of remission of sin through the blood of Christ, to plead against the Law, and also a personal evangelical righteousness, consisting in a performance of the conditions of the Gospel or new Covenant, which is the condition of our interest in the first; or else he cannot be justified (yet is this latter but subordinate to the former, as to that sentential absolution).

7. Seeing this twofold righteousness is necessary to our justification in judgment, therefore it must needs follow that it is necessary to the making us righteous, or our constitutive justification in this life (in the order before laid down): For the Law is the rule of judgment; and God judges men to be as they are; and therefore He makes them righteous, both by remission of all sin and by giving them to perform the conditions of the New Covenant, before He judge them so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 56-57</span></figcaption>

<blockquote><p>Hence in the first justification of believing sinners, all future sins are remitted as unto any actual obligation unto the curse of the Law, unless they should fall into such sins as should ipso facto, forfeit their justified estate, and transfer them from the Covenant of Grace, into the Covenant of Works, which we believe that God in his Faithfulness will preserve them from. And although sin cannot be actually pardoned before it be actually committed, yet may the obligation unto the curse of the Law be virtually taken away from such sins in justified persons as are consistent with a justified estate, or the terms of the Covenant of Grace, antecedently unto their actual commission. God at once in this sense forgives all their iniquities, and heals all their diseases, redeems their life from destruction, and crowns them with loving kindness and mercies, Ps. 103:2-3. Future sins are not so pardoned as that when they are committed they should be no sins, which cannot be, unless the commanding power of the Law be abrogated. But their respect unto the curse of the Law, or their power to oblige the justified person thereunto is taken away. Still there abides the true nature of sin in every inconformity unto, or transgression of the Law in justified persons, which stands in need of daily actual pardon. For there is no man that lives and sins not, and if we say that we have no sin, we do but deceive our selves. None are more sensible of the guilt of sin, none are more troubled for it, none are more earnest in supplications for the pardon of it, than justified persons. For this is the effect of the sacrifice of Christ applied unto the souls of believers, as the apostle declares, Heb. 10:1-4, 10, 14, that it does take away conscience condemning the sinner for sin with respect unto the curse of the Law; but it does not take away conscience condemning sin in the sinner, which on all considerations of God and themselves, of the Law and the gospel, requires repentance on the part of the sinner, and actual pardon on the part of God. … …Now the first act of God in the imputation of righteousness cannot be repeated. And the actual pardon of sin after justification is an effect and consequent of that imputation of righteousness. If any man sin, there is a propitiation… Wherefore unto this actual pardon there is nothing required but the application of that righteousness which is the cause of it, and this is done by faith only. … What it is that, when a justified person is guilty of sin (as guilty he is more or less every day) and his conscience is pressed with a sense thereof, as that only thing which can endanger or intercept his justified estate, his favor with God, and title unto glory, he betakes himself unto, or ought so to do, for the continuance of his state, and pardon of his sins, what he pleads unto that purpose, and what is available thereunto…. And is it not of faith alone, which is that grace whereby they apply themselves unto the mercy or grace of God through the mediation of Christ? It is true that faith herein, works and acts itself in and by godly sorrow, repentance, humiliation, self-judging, and abhorrency, fervency in prayer and supplications with an humble waiting for an answer of peace from God, with engagements unto renewed obedience. But it is faith alone that makes applications unto grace in the blood of Christ for the continuation of our justified estate… The Scripture expressly does declare this to be the only way of the continuation of our justification, 1 Jn. 2:1-2, ‘These things write I unto you that you sin not. And if any man sin we have an advocate with the Father, Jesus Christ the Righteous; and he is the propitiation for our sins.’ It is required of those that are justified that they sin not; it is their duty not to sin; but yet it is not so required of them as that if in anything they fail of their duty they should immediately lose the privilege of their justification. Wherefore on a supposition of sin, if any man sin, (as there is no man that lives and sins not) what way is prescribed for such persons to take, what are they to apply themselves unto, that their sin may be pardoned, and their acceptance with God continued; that is, for the continuation of their justification? The course in this case directed unto by the apostle is none other but the application of our souls by faith unto the Lord Christ, as our advocate with the Father, on the account of the propitiation that He has made for our sins. Under the consideration of this double act of his sacerdotal office, his oblation and intercession, He is the object of our faith in our absolute justification, and so He is as unto the continuation of it. So our whole progress in our justified estate in all the degrees of it is ascribed unto faith alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), ch. 5, pp. 202-3</span></figcaption>

sus+Christ+the+Righteous%3B+and+he+is+the+propitiation+for+our+sins.%E2%80%99+It+is+required+of+those+that+are+justified+that+they+sin+not%3B+it+is+their+duty+not+to+sin%3B+but+yet+it+is+not+so+required+of+them+as+that+if+in+anything+they+fail+of+their+duty+they+should+immediately+lose+the+privilege+of+their+justification.+Wherefore+on+a+supposition+of+sin%2C+if+any+man+sin%2C+%28as+there+is+no+man+that+lives+and+sins+not%29+what+way+is+prescribed+for+such+persons+to+take%2C+what+are+they+to+apply+themselves+unto%2C+that+their+sin+may+be+pardoned%2C+and+their+acceptance+with+God+continued%3B+that+is%2C+for+the+continuation+of+their+justification%3F+The+course+in+this+case+directed+unto+by+the+apostle+is+none+other+but+the+application+of+our+souls+by+faith+unto+the+Lord+Christ%2C+as+our+advocate+with+the+Father%2C+on+the+account+of+the+propitiation+that+He+has+made+for+our+sins.+Under+the+consideration+of+this+double+act+of+his+sacerdotal+office%2C+his+oblation+and+intercession%2C+He+is+the+object+of+our+faith+in+our+absolute+justification%2C+and+so+He+is+as+unto+the+continuation+of+it.+So+our+whole+progress+in+our+justified+estate+in+all+the+degrees+of+it+is+ascribed+unto+faith+alone.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+The+Doctrine+of+Justification+by+Faith%E2%80%A6+%28London%3A+Boulter%2C+1677%29%2C+ch.+5%2C+pp.+202-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F36bbe3490e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/36bbe3490e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=Hence%20in%20the%20first%20justification%20of,it%20is%20ascribed%20unto%20faith%20alone&amp;text=Hence%20in%20the%20first%20justification%20of%20believing%20sinners&amp;text=degrees%20of%20it%20is%20ascribed%20unto%20faith%20alone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>26. Therefore, every true Christian who has actually returned into the grace of God, being now constituted in a state of grace, has a twofold righteousness—not acquired by his own free will or the powers of nature, but given to him by God through Christ—and both are necessary for his salvation: one imputed, the other inherent. The imputed is that which Christ has performed for him, to satisfy for all sins committed by him throughout his whole life; the inherent is that by which, through divine grace in Christ, he begins inwardly more and more to cease from sins to be committed hereafter, and strives most diligently to observe the divine law exactly. For by that imputed righteousness of Christ he is not freed from the keeping of the law, but rather bound to it more closely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on the Doctrine of Justification, in which a plain way is built up to the concord of them which vary on this thing</cite>, (d. 1618; Leiden, 1684), trans. ChatGPT-5, ch. 24, ‘Of the Effects of Justification’; sect. 26, pp. 114-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

opener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>So that it is evident that to be justified has a threefold signification. For first it imports as much as to be absolved from sin, that is, to be freed from the woeful consequents of that disfavor and dislike, that unrighteousness and sin subjects us unto. Secondly, to be accepted and respected so as righteous men are wont to be: And thirdly to be framed to the love and desire of doing righteously.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-75edd178d9" data-kw="">
<blockquote><p>So much the more detestable is the invention of the Sophists, who have had the effrontery to forge a kind of merit, which professes to be founded on a just claim. The word merit, taken by itself, was sufficiently profane and inconsistent with the standard of piety; but to intoxicate men with diabolical pride, as if they could merit any thing by a just claim, is far worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 17:7-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b8e4f9d6ce" data-kw="">
<blockquote><p>What have these most pestilential Sophists left to Christ on which to exert his virtue? They say that he merited for us the first grace, that is, the occasion of meriting, and that it is our part not to let slip the occasion thus offered. O the daring effrontery of impiety! Who would have thought that men professing the name of Christ would thus strip him of his power, and all but trample him under foot?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span></div>
<div class="actions"><button class="copy" data-copy="“What have these most pestilential Sophists left to Christ on which to exert his virtue? They say that he merited for us the first grace, that is, the occasion of meriting, and that it is our part not to let slip the occasion thus offered. O the daring effrontery of impiety! Who would have thought that men professing the name of Christ would thus strip him of his power, and all but trample him under foot?”

— John Calvin, Institutes of the Christian Religion, 3.15.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat%20have%20these%20most%20pestilential%20Sophists%20left%20to%20Christ%20on%20which%20to%20exert%20his%20virtue%3F%20They%20say%20that%20he%20merited%20for%20us%20the%20first%20grace%2C%20that%20is%2C%20the%20occasion%20of%20meriting%2C%20and%20that%20it%20is%20our%20part%20not%20to%20let%20slip%20the%20occasion%20thus%20offered.%20O%20the%20daring%20effrontery%20of%20impiety%21%20Who%20would%20have%20thought%20that%20men%20professing%20the%20name%20of%20Christ%20would%20thus%20strip%20him%20of%20his%20power%2C%20and%20all%20but%20trample%20him%20under%20foot%3F%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.15.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb8e4f9d6ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b8e4f9d6ce.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-c0f1742eae" data-kw="">
<blockquote><p>Though, in the Law, God formerly promised to the Jews the hire of works, (Leviticus 18:5,) yet we know that this was without effect, because no man ever obtained salvation by his merits. … For strictly speaking, he owes no man any thing, and from us, who are devoted to his service, he demands, as a matter of right, all the duties which are incumbent on us. But as he freely offers to us a reward, he is said to hire the labors which, on other grounds, were due to him. This is also the reason why he gives the name of a hire to the crown which he bestows freely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Matthew 20:1-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/reward-of-grace-against-rome.html">Reward of grace (against Rome)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>
<div class="actions"><button class="copy" data-copy="“Though, in the Law, God formerly promised to the Jews the hire of works, (Leviticus 18:5,) yet we know that this was without effect, because no man ever obtained salvation by his merits. … For strictly speaking, he owes no man any thing, and from us, who are devoted to his service, he demands, as a matter of right, all the duties which are incumbent on us. But as he freely offers to us a reward, he is said to hire the labors which, on other grounds, were due to him. This is also the reason why he gives the name of a hire to the crown which he bestows freely.”

— John Calvin, Commentary on a Harmony of the Evangelists, Matthew 20:1-16">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThough%2C%20in%20the%20Law%2C%20God%20formerly%20promised%20to%20the%20Jews%20the%20hire%20of%20works%2C%20%28Leviticus%2018%3A5%2C%29%20yet%20we%20know%20that%20this%20was%20without%20effect%2C%20because%20no%20man%20ever%20obtained%20salvation%20by%20his%20merits.%20%E2%80%A6%20For%20strictly%20speaking%2C%20he%20owes%20no%20man%20any%20thing%2C%20and%20from%20us%2C%20who%20are%20devoted%20to%20his%20service%2C%20he%20demands%2C%20as%20a%20matter%20of%20right%2C%20all%20the%20duties%20which%20are%20incumbent%20on%20us.%20But%20as%20he%20freely%20offers%20to%20us%20a%20reward%2C%20he%20is%20said%20to%20hire%20the%20labors%20which%2C%20on%20other%20grounds%2C%20were%20due%20to%20him.%20This%20is%20also%20the%20reason%20why%20he%20gives%20the%20name%20of%20a%20hire%20to%20the%20crown%20which%20he%20bestows%20freely.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentary%20on%20a%20Harmony%20of%20the%20Evangelists%2C%20Matthew%2020%3A1-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc0f1742eae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c0f1742eae.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom32" rel="noopener" target="_blank">Read it online · CCEL, vol. 2</a></div>
</figure><figure class="quote" id="q-2e33359a3e" data-kw="">
<blockquote><p>That God visits the good works of the godly with reward, and to former adds new and ampler grace, we deny not. But whosoever asserts that works have the effect of increasing justification, understands neither what is the meaning of justification nor its cause. That we are regarded as righteous when we are accepted by God, has already been proved. From this acceptance, too, works derive whatever grace they had.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, on canon 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span></div>
<div class="actions"><button class="copy" data-copy="“That God visits the good works of the godly with reward, and to former adds new and ampler grace, we deny not. But whosoever asserts that works have the effect of increasing justification, understands neither what is the meaning of justification nor its cause. That we are regarded as righteous when we are accepted by God, has already been proved. From this acceptance, too, works derive whatever grace they had.”

— John Calvin, Acts of the Council of Trent with the Antidote, Session 6, on canon 24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat%20God%20visits%20the%20good%20works%20of%20the%20godly%20with%20reward%2C%20and%20to%20former%20adds%20new%20and%20ampler%20grace%2C%20we%20deny%20not.%20But%20whosoever%20asserts%20that%20works%20have%20the%20effect%20of%20increasing%20justification%2C%20understands%20neither%20what%20is%20the%20meaning%20of%20justification%20nor%20its%20cause.%20That%20we%20are%20regarded%20as%20righteous%20when%20we%20are%20accepted%20by%20God%2C%20has%20already%20been%20proved.%20From%20this%20acceptance%2C%20too%2C%20works%20derive%20whatever%20grace%20they%20had.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Acts%20of%20the%20Council%20of%20Trent%20with%20the%20Antidote%2C%20Session%206%2C%20on%20canon%2024&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2e33359a3e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2e33359a3e.html">Permalink</a><a class="src" href="https://www.uecf.net/books/acts-trent-4/chapter19.html" rel="noopener" target="_blank">Read it online · UECF (Calvin&#x27;s Tracts)</a></div>
</figure><figure class="quote" id="q-6aef140aee" data-kw="">
<blockquote><p>It may however be hence inferred with certainty, that our salvation is altogether through the grace and mere beneficence of God. He might indeed have used other words -- that the wages of righteousness is eternal life; and then the two clauses would correspond: but he knew that it is through God&#x27;s gift we obtain it, and not through our own merits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistle to the Romans</cite>, Romans 6:23</span></figcaption>

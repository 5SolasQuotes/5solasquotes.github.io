<blockquote><p>48 Q. Since, then, you say that the additional name “Christ” or “Anointed” implies that He came with the command of the Father to establish a royal priesthood, explain first what the kingdom of Christ is. A. A kingdom is a kind of rule over a people in which one person serves as the head and is exceptionally gifted with wisdom, counsel, and strength, so that his subjects benefit from his wisdom and other gifts and live happily and peacefully under such a head. This helps us to understand what the Kingdom of Christ is: it is a kind of rule over the people of God in which there is one head, namely, Christ the Lord, who is gifted far beyond all angels and people with wisdom, counsel, might, and all other gifts. This head, Christ, rules His subjects even in this life in such a way that He produces eternal salvation in the hearts of all the elect through the preaching of His holy gospel and the power of His Spirit. He does this by incorporating them into Himself by faith and the testimony of holy baptism, by graciously not imputing their sins to them, by daily purifying them from sin, by living in them and ruling their hearts with His Holy Spirit, and by using as means to that end the preaching of the holy gospel, the administration of the holy sacraments, and Christian discipline. This is in order that in this life they might live happily in the Lord, have peace with God, and at last in eternity live and reign with their King. This is the Kingdom of Christ that begins in this life and will increase in the heart of every believer (John 15; Matt. 25; Mark 1).</p></blockquote>

<blockquote><p>7th Question: Is it necessary in essence for the Church, or at least as a requirement, that all its members be closely united in terms of locality? Response: Conclusion: It is very convenient, so this should generally be observed, that members are constituted from a common locality, such as from a neighborhood or city. Because such is suggested by the practice of the Apostolic Church. For we do not read that the inhabitants of Cenchreae were included in the Church of the Corinthians, or vice versa. Because if they can observe one another more easily, they can stimulate love and good works, Hebrews 10, and give and receive examples. Because in this way they can best encourage, comfort, and build each other up, 1 Thess. 5:11,14, and indeed as mentioned in Heb. 3:13. Conclusion: Therefore, it should not be proven that without a just necessity, citizens, for example, of our city should be enrolled in the Church of a neighboring city or village, and vice versa. Because this inconvenience exists and affects many looking towards ecclesiastical communion; for the enjoyment of which God primarily instituted gatherings and ecclesiastical societies: See the statements of the preceding problem. Because it breeds confusion, contentions, and divisions among members and churches; it removes harmony and weakens the vigor of ecclesiastical discipline. Hence, ancient canons have prohibited transitions and appeals to other churches for both private believers and clergy. See the Canons of the African Church, especially Canons 23, 28, 54, 105, 125, and notably the Canons and Acts of the Council of Carthage in the year 419, where a synodical letter to Boniface, Bishop of the Roman Church, shows that one should not be summoned from Africa across the sea to the See of Rome. The constitutions, decrees, and practices of the Belgian Churches absolutely prohibit any transfer from one church to another, whether of the same language or a different one, without good permission and dismissal, or written testimony from the church of which one is a member. This especially applies to those transient members around whom the office of correction or even censorship is exercised. Because it smacks of schismatic and factious behavior or carnal curiosity, i.e., factionalism, pride, and disdain; similarly as in the Church of Corinth, 1 Cor. 1:12 &amp; 3:3. Conclusion: If in any case, due to urgent reasons, it is granted to someone or some people to be enrolled in a church outside their place of residence, or to remain in the same church after moving to a nearby city or village, this must be done with the advice and consent of both churches. Conclusion: Another reason is far different when churches are not of the same confession or at least differ to the extent that the advantages of local presence and cohabitation are postponed for the tranquility of conscience and safer and much greater edification. This must be dealt with elsewhere in detail, and we may touch on it below. Conclusion: Where faithful cannot enjoy the benefits of close cohabitation, they should not be circumscribed by the boundaries of that church and excluded from it, just as those who live outside the parish, city, or village should not be forced to join it any more than those who live there. Because the circumstance of location and civil cohabitation is external and accidental to the church; therefore, it is not of its nature or essence. Because it is not a necessary requirement. Ecclesiastical communion acts can be carried out among those members, although not as promptly, abundantly, easily, and excellently. For more and less do not alter the species. Because the status of a clandestine and troubled church often requires such a thing due to persecutions, heresies, schisms, and similar disturbances. Because the defects of other faithful, churches, and ministers in many places leave nothing else for the faithful but to resort to this last refuge, especially since they cannot use the first ship.</p></blockquote>

<blockquote><p>18. Thus under the old testament, when God would take the posterity of Abraham into a new, peculiar church-state, he did it by a solemn covenant. Herein, as he prescribed all the duties of his worship to them, and made them many blessed promises of his presence, with powers and privileges innumerable, so the people solemnly covenanted and engaged with him that they would do and observe all that he had commanded them; whereby they coalesced into that church-state which abode unto the time of reformation. This covenant is at large declared, Exod. 24: for the covenant which God made there with the people, and they with him, was not the covenant of grace under a legal dispensation, for that was established unto the seed of Abraham four hundred years before, in the promise with the seal of circumcision; nor was it the covenant of works under a gospel dispensation, for God never renewed that covenant under any consideration whatever; but it was a peculiar covenant which God then made with them, and had not made with their fathers, Deut. 5:2, 3, whereby they were raised and erected into a church-state, wherein they were intrusted with all the privileges and enjoined all the duties which God had annexed thereunto. This covenant was the sole formal cause of their church-state, which they are charged so often to have broken, and which they so often solemnly renewed unto God.

19. This was that covenant which was to be abolished, whereon the church-state that was built thereon was utterly taken away; for hereon the Hebrews ceased to be the peculiar church of God, because the covenant whereby they were made so was abolished and taken away, as the apostle disputes at large, Heb. 7–9. The covenant of grace in the promise will still continue unto the true seed of Abraham, Acts 2:38, 39; but the church-covenant was utterly taken away.

20. Upon the removal, therefore, of this covenant, and the church-state founded thereon, all duties of worship and church-privileges were also taken away (the things substituted in their room being totally of another kind). But the covenant of grace, as made with Abraham, being continued and transferred unto the gospel worshippers, the sign or token of it given unto him is changed, and another substituted in the room thereof. But whereas the privileges of this church-covenant were in themselves carnal only, and no way spiritual but as they were typical, and the duties prescribed in it were burdensome, yea, a yoke intolerable, the apostle declares in the same place that the new church-state, whereinto we are called by the gospel, hath no duties belonging unto it but such as are spiritual and easy, but withal hath such holy and eminent privileges as the church could no way enjoy by virtue of the first church-covenant, nor could believers be made partakers of them before that covenant was abolished</p></blockquote>

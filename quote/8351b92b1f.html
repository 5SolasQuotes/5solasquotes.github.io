<blockquote><p>Or else the infants of the faithful, and those which are begotten of baptized parents (but not of infidels, which are not in the Church, and not the children of the baptized) because their seed is contained in the covenant, but not these other. Acts 2:39, “To you is the promise made, and to your children.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-e9bbff3ec9" data-kw="">
<blockquote><p>If they are truly slaves, as slaves formerly were, I would not deny it; for we read that it was commanded to Abraham that he should circumcise all his servants. But such as we have as servants today—since for the most part they are truly free—I do not think they should be treated in that way. Nor indeed those who by right of war become subjects to princes; for this kind of subject nevertheless remains free. Therefore, with respect to those born of unbelieving parents yet free, if the parents consent, I think a distinction should be made. For they consent either after they themselves have become believers, and then there is no difficulty, etc.; or they persist in unbelief, and then I do not think they are to be baptized, etc.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-chamier.html">Daniel Chamier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Panstratiae Catholicae, or a Body of the Controversies of Religion Against the Papists</cite>, vol. 4, bk. 5, ch. 11, section 2, as quoted in Latin by Giles Firmin, A Sober Reply to the Sober Answer of Reverend Mr. Cawdrey… (London, 1653), p. 42, trans. by ChatGPT4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>
<div class="actions"><button class="copy" data-copy="“If they are truly slaves, as slaves formerly were, I would not deny it; for we read that it was commanded to Abraham that he should circumcise all his servants. But such as we have as servants today—since for the most part they are truly free—I do not think they should be treated in that way. Nor indeed those who by right of war become subjects to princes; for this kind of subject nevertheless remains free. Therefore, with respect to those born of unbelieving parents yet free, if the parents consent, I think a distinction should be made. For they consent either after they themselves have become believers, and then there is no difficulty, etc.; or they persist in unbelief, and then I do not think they are to be baptized, etc.’”

</figure><figure class="quote" id="q-cf024ff49e" data-kw="">
<blockquote><p>By Baptism… we are received solemnly into the visible Church; and Baptism is a seal of our entry into Christ’s visible Body, as swearing to the colors enters a soldier a member to the army; and, we teach not that Baptism constitutes the Church-visible simply, as the Church: its a seal of a visible profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, Book 1, ch. 21, ‘Whether Baptism gives formality, or makes a Member of a visible Church?’ in A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker (1658), pp. 115-122 | Hooker, a congregationalist, had misunderstood Rutherford, thinking that Rutherford had said that baptism was the formal principle that made someone a member of the visible Church. However, what Rutherford actually said, and what he defends here, distinguishing, is only that:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<main class="wrap"><figure class="quote" id="q-71d05ad125" data-kw="">
<blockquote><p>After establishing that the civil ruler was the keeper and avenger of both tables of the law by promoting its external observance and punishing breaches of it in accordance with the word of God, the American Reformed Presbyterian, David Scott, argued that this principle requires the public funding of a people’s religious instruction:

This being admitted, it is obviously the duty of a nation to do all that may promote not only the good of the community, but also the glory of God. It would be strange indeed, if an ordinance instituted by God for the good of society should, as some suppose, be administered without any regard to the honour of its author. The final cause of all human action, as designed by God, is his own glory. “God, the supreme Ruler and King of all the world, hath ordained civil magistrates to be under him, over the people, for his own glory, and for the public good.” This judgment of the Westminster Divines is confirmed by the broad principle laid down in Scripture, “Whatsoever ye do, do all to the glory of God.”

This consideration alone furnishes a strong argument for the maintenance of religious ordinances at the public expense; in no other way can a government promote the great ends for which it is appointed, than by furnishing the means of religious instruction for the people. To reject this obligation is infidel in principle, derogatory to God, and injurious to the best interests of the community.

Religious instruction, including as well the great principles of morality as the doctrines of salvation, directly produces obedience, and respect to righteous human laws, represses vice and elevates the morality of a people, in a way, and degree of success, unattainable by penal laws, however carefully and rigidly enforced. The inculcation of Sabbath observance, for example, does more for advancing the higher and nobler interests of society, than all the prisons and penitentiaries and police of the country; the latter merely restrains and punishes crime, the former prevents it, because it makes men better.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-scott.html">David Scott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Support of Religion in Reformed Presbyterian and Covenanter</cite></span></figcaption>

<blockquote><p>So that before this text [Mal. 1:14, “cursed be the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing:”] can be opposed to what has been said, it must be proved:

1. That the things in question are corruptions, as much prohibited as the blind and lame under the Law.

2. That they are such as a person does choose, and it is in his power to help, and offers it when he has a male in his flock.

3. That such a corruption as affects not the substance of worship, does yet alter the nature of it, and makes the whole to be a corrupt thing and abominable to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">London Ministers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Cases &amp; other Discourses lately written to recover Dissenters</cite>, (London, 1685), vol. 1, John Williams, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’ Williams (d. 1709) was an Anglican bishop., p. 38</span></figcaption>

<blockquote><p>This chapter shall, therefore, be concluded by a few directions for the observance of the Lord’s day.

1. Let the whole day be consecrated to the service of God, especially in acts of worship, public and private. This weekly recess from worldly cares and avocations, affords a precious opportunity for the study of God’s word, and for the examination of our own hearts. Rise early, and let your first thoughts and aspirations be directed to heaven. Meditate much and profoundly on divine things, and endeavour to acquire a degree of spirituality on this day which will abide with you through the whole week.

2. Consider the Lord’s day an honour and delight. Let your heart be elevated in holy joy, and your lips be employed in the high praises of God. This day more resembles heaven, than any other portion of our time; and we should endeavour to imitate the worship of heaven, according to that petition of the Lord’s prayer—”Thy will be done on earth as it is in heaven.” Never permit the idea to enter your mind, that the sabbath is a burden. It is a sad case, when professing Christians are weary of this sacred rest, and say, like some of old, “When will the sabbath be gone, that we may sell corn, and set forth wheat?” As you improve this day, so probably will you be prospered all the week.

3. Avoid undue rigour, and Pharisaic scrupulosity, for nothing renders the Lord’s day more odious. Still keep in view the great end of its institution; and remember that the sabbath was instituted for the benefit of man, and not to be a galling yoke. The cessation from worldly business and labour is not for its own sake, as if there was any thing morally good in inaction, but we are called off from secular pursuits on this day, that we may have a portion of our time to devote uninterruptedly to the worship of God.

Let every thing then be so arranged in your household, beforehand, that there may be no interruption to religious duties, and to attendance on the means of grace. There was undoubtedly a rigour in the law of the sabbath, as given to the Jews, which did not exist before; and which does not apply to Christians. They were forbidden to kindle a fire, or to go out of their place on the sabbath; and for gathering a few sticks, a presumptuous transgresssor was stoned to death. These regulations are not now in force.

As divine knowledge is the richest acquisition within our reach, and as this knowledge is to be found in the word of God, let us value this day, as affording all persons an opportunity of hearing and reading the word. And as the fourth commandment requires the heads of families to cause the sabbath to be observed by all under their control, or within their gates, it is very important that domestic and culinary arrangements should be so ordered, that servants and domestics should not be deprived of the opportunity of attending on the word and worship of God which this day affords, by being employed in preparing superfluous feasts, as is often the case.

The sabbath is more valuable to the poor and unlearned than to others, because it is almost the only leisure which they have, and because means of public instruction are on that, day afforded them by the preaching of the gospel. If we possess any measure of the true spirit of devotion, this sacred day will be most welcome to our hearts; and we will rejoice when they say, “Let us go unto the house of the Lord.” To such a soul, the opportunity of enjoying spiritual communion with God will be valued above all price, and be esteemed as the richest privilege which creatures can enjoy upon earth.

4. Whilst you conscientiously follow your own sense of duty in the observance of the rest of the sabbath, be not ready to censure all who may differ from you in regard to minute particulars, which are not prescribed or commanded in the word of God. The Jews accused our Lord as a sabbath-breaker, on many occasions, and would have put him to death for a supposed violation of this law, had he not escaped out of their hands. Beware of indulging yourself in any practice which may have the effect of leading others to disregard the rest and sanctity of the sabbath. Let not your liberty in regard to what you think may be done, be a stumbling-block to cause weaker brethren to offend, or unnecessarily to give them pain, or to lead them to entertain an unfavourable opinion of your piety.

5. As, undoubtedly, the celebration of public worship and gaining divine instruction from the divine oracles, is the main object of the institution of the Christian sabbath, let all be careful to attend on the services of the sanctuary on this day. And let the heart be prepared by previous prayer and meditation for a participation in public worship, and while in the more immediate presence of the Divine Majesty, let all the people fear before him, and with reverence adore and praise his holy name.

Let all vanity, and curious gazing, and slothfulness, be banished from the house of God. Let every heart be lifted up on entering the sanctuary, and let the thoughts be carefully restrained from wandering on foolish or worldly objects, and resolutely recalled when they have begun to go astray. Let brotherly love be cherished, when joining with others in the worship of God. The hearts of all the church should be united in worship, as the heart of one man. Thus, will the worship of the sanctuary below, be a preparation for the purer, sublimer worship in the temple above.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Compend of Bible Truth</cite>, (Philadelphia: Presbyterian Board of Publication, 1846), pp 191-94.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

— Archibald Alexander, A Brief Compend of Bible Truth, (Philadelphia: Presbyterian Board of Publication, 1846), pp 191-94.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+chapter+shall%2C+therefore%2C+be+concluded+by+a+few+directions+for+the+observance+of+the+Lord%E2%80%99s+day.%0A%0A1.+Let+the+whole+day+be+consecrated+to+the+service+of+God%2C+especially+in+acts+of+worship%2C+public+and+private.+This+weekly+recess+from+worldly+cares+and+avocations%2C+affords+a+precious+opportunity+for+the+study+of+God%E2%80%99s+word%2C+and+for+the+examination+of+our+own+hearts.+Rise+early%2C+and+let+your+first+thoughts+and+aspirations+be+directed+to+heaven.+Meditate+much+and+profoundly+on+divine+things%2C+and+endeavour+to+acquire+a+degree+of+spirituality+on+this+day+which+will+abide+with+you+through+the+whole+week.%0A%0A2.+Consider+the+Lord%E2%80%99s+day+an+honour+and+delight.+Let+your+heart+be+elevated+in+holy+joy%2C+and+your+lips+be+employed+in+the+high+praises+of+God.+This+day+more+resembles+heaven%2C+than+any+other+portion+of+our+time%3B+and+we+should+endeavour+to+imitate+the+worship+of+heaven%2C+according+to+that+petition+of+the+Lord%E2%80%99s+prayer%E2%80%94%E2%80%9DThy+will+be+done+on+earth+as+it+is+in+heaven.%E2%80%9D+Never+permit+the+idea+to+enter+your+mind%2C+that+the+sabbath+is+a+burden.+It+is+a+sad+case%2C+when+professing+Christians+are+weary+of+this+sacred+rest%2C+and+say%2C+like+some+of+old%2C+%E2%80%9CWhen+will+the+sabbath+be+gone%2C+that+we+may+sell+corn%2C+and+set+forth+wheat%3F%E2%80%9D+As+you+improve+this+day%2C+so+probably+will+you+be+prospered+all+the+week.%0A%0A3.+Avoid+undue+rigour%2C+and+Pharisaic+scrupulosity%2C+for+nothing+renders+the+Lord%E2%80%99s+day+more+odious.+Still+keep+in+view+the+great+end+of+its+institution%3B+and+remember+that+the+sabbath+was+instituted+for+the+benefit+of+man%2C+and+not+to+be+a+galling+yoke.+The+cessation+from+worldly+business+and+labour+is+not+for+its+own+sake%2C+as+if+there+was+any+thing+morally+good+in+inaction%2C+but+we+are+called+off+from+secular+pursuits+on+this+day%2C+that+we+may+have+a+portion+of+our+time+to+devote+uninterruptedly+to+the+worship+of+God.%0A%0ALet+every+thing+then+be+so+arranged+in+your+household%2C+beforehand%2C+that+there+may+be+no+interruption+to+religious+duties%2C+and+to+attendance+on+the+means+of+grace.+There+was+undoubtedly+a+rigour+in+the+law+of+the+sabbath%2C+as+given+to+the+Jews%2C+which+did+not+exist+before%3B+and+which+does+not+apply+to+Christians.+They+were+forbidden+to+kindle+a+fire%2C+or+to+go+out+of+their+place+on+the+sabbath%3B+and+for+gathering+a+few+sticks%2C+a+presumptuous+transgresssor+was+stoned+to+death.+These+regulations+are+not+now+in+force.%0A%0AAs+divine+knowledge+is+the+richest+acquisition+within+our+reach%2C+and+as+this+knowledge+is+to+be+found+in+the+word+of+God%2C+let+us+value+this+day%2C+as+affording+all+persons+an+opportunity+of+hearing+and+reading+the+word.+And+as+the+fourth+commandment+requires+the+heads+of+families+to+cause+the+sabbath+to+be+observed+by+all+under+their+control%2C+or+within+their+gates%2C+it+is+very+important+that+domestic+and+culinary+arrangements+should+be+so+ordered%2C+that+servants+and+domestics+should+not+be+deprived+of+the+opportunity+of+attending+on+the+word+and+worship+of+God+which+this+day+affords%2C+by+being+employed+in+preparing+superfluous+feasts%2C+as+is+often+the+case.%0A%0AThe+sabbath+is+more+valuable+to+the+poor+and+unlearned+than+to+others%2C+because+it+is+almost+the+only+leisure+which+they+have%2C+and+because+means+of+public+instruction+are+on+that%2C+day+afforded+them+by+the+preaching+of+the+gospel.+If+we+possess+any+measure+of+the+true+spirit+of+devotion%2C+this+sacred+day+will+be+most+welcome+to+our+hearts%3B+and+we+will+rejoice+when+they+say%2C+%E2%80%9CLet+us+go+unto+the+house+of+the+Lord.%E2%80%9D+To+such+a+soul%2C+the+opportunity+of+enjoying+spiritual+communion+with+God+will+be+valued+above+all+price%2C+and+be+esteemed+as+the+richest+privilege+which+creatures+can+enjoy+upon+earth.%0A%0A4.+Whilst+you+conscientiously+follow+your+own+sense+of+duty+in+the+observance+of+the+rest+of+the+sabbath%2C+be+not+ready+to+censure+all+who+may+differ+from+you+in+regard+to+minute+particulars%2C+which+are+not+prescribed+or+commanded+in+the+word+of+God.+The+Jews+accused+our+Lord+as+a+sabbath-breaker%2C+on+many+occasions%2C+and+would+have+put+him+to+death+for+a+supposed+violation+of+this+law%2C+had+he+not+escaped+out+of+their+hands.+Beware+of+indulging+yourself+in+any+practice+which+may+have+the+effect+of+leading+others+to+disregard+the+rest+and+sanctity+of+the+sabbath.+Let+not+your+liberty+in+regard+to+what+you+think+may+be+done%2C+be+a+stumbling-block+to+cause+weaker+brethren+to+offend%2C+or+unnecessarily+to+give+them+pain%2C+or+to+lead+them+to+entertain+an+unfavourable+opinion+of+your+piety.%0A%0A5.+As%2C+undoubtedly%2C+the+celebration+of+public+worship+and+gaining+divine+instruction+from+the+divine+oracles%2C+is+the+main+object+of+the+institution+of+the+Christian+sabbath%2C+let+all+be+careful+to+attend+on+the+services+of+the+sanctuary+on+this+day.+And+let+the+heart+be+prepared+by+previous+prayer+and+meditation+for+a+participation+in+public+worship%2C+and+while+in+the+more+immediate+presence+of+the+Divine+Majesty%2C+let+all+the+people+fear+before+him%2C+and+with+reverence+adore+and+praise+his+holy+name.%0A%0ALet+all+vanity%2C+and+curious+gazing%2C+and+slothfulness%2C+be+banished+from+the+house+of+God.+Let+every+heart+be+lifted+up+on+entering+the+sanctuary%2C+and+let+the+thoughts+be+carefully+restrained+from+wandering+on+foolish+or+worldly+objects%2C+and+resolutely+recalled+when+they+have+begun+to+go+astray.+Let+brotherly+love+be+cherished%2C+when+joining+with+others+in+the+worship+of+God.+The+hearts+of+all+the+church+should+be+united+in+worship%2C+as+the+heart+of+one+man.+Thus%2C+will+the+worship+of+the+sanctuary+below%2C+be+a+preparation+for+the+purer%2C+sublimer+worship+in+the+temple+above.%E2%80%9D%0A%0A%E2%80%94+Archibald+Alexander%2C+A+Brief+Compend+of+Bible+Truth%2C+%28Philadelphia%3A+Presbyterian+Board+of+Publication%2C+1846%29%2C+pp+191-94.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa68845bea6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a68845bea6.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/10/10/archibald-alexander-on-directions-for-observing-the-lords-day/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>This was it, which is here said to be according to the law: and that the judicial, ceremonial and moral law:

1. By the judicial law the Levites had not their portion in Canaan for their inheritance, as other tribes had: therefore in lieu thereof, by the said law they had the tenth of the rest of the people.

2. The holy services which they performed to the Lord for the people were ceremonial. Therefore the recompence given was by a like law.

3. The general equity that they who communicate unto us spiritual matters should partake of our temporals, and that they who are set apart wholly to attend God’s service should live upon that service, is moral.</p></blockquote>

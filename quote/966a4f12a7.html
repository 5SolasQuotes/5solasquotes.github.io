<main class="wrap"><figure class="quote" id="q-966a4f12a7" data-kw="">
<blockquote><p>We have been taught too long, that we are saved by faith, without the works of the law; which doctrine, though it be most true, and most soundly proved, and flatly concluded, Rom. iii. 28; yet being understood amiss, as Paul’s writings sometimes are, 2 Peter iii. 16, it hath been the decay of all good deeds, and brought in epicurism and all ungodliness. It is true indeed that ‘eternal life is the gift of God through Jesus Christ,’ Rom. vi. 23; but yet this gift is bestowed only upon those ‘for whom it is prepared,’ Mat. xx. 23, which have exercised themselves in the works of mercy, Mat. xxv. 35.

In respect of God, our election standeth certain from all eternity; for ‘it hath this seal, the Lord knoweth them that are his,’ 2 Tim. ii. 1 9, and ‘I know whom I have chosen,’ John xiii. 18. But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter i. 10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.

If God have predestinate any to eternal life, he hath also predestinated them to the means whereby they must attain eternal life, that is, ‘faith and a good conscience,’ 1 Tim. iii. 9. Therefore it is certain, that whosoever is to be saved, shall at one time or other, before they depart out of this life, be called truly to believe, and shall endeavour by all means, as Paul did, ‘to keep a good conscience both toward God and toward men,’ Acts xxiv. 16. For that which is spoken of Christ in special, Ps. xlv. 7, ‘Thou hast loved righteousness, and hated iniquity,’ must be verified, and in some measure accomplished in all the members of Christ; they must love righteousness, and hate iniquity. And this is the difference that the apostle putteth between the children of God and the children of the devil; that the children of God both love and do righteousness, and the children of the devil love sin, and do it, 1 John iii. 7, 8.

Let no man, therefore, think that he is predestinate to salvation, unless he find and feel in himself the effects and fruits of predestination. For ‘those whom God hath predestinate, them also in his good time he calleth,’ Rom. viii. 30; ‘not to uncleanness, but unto holiness,’ 1 Thes. iv. 7; ‘and whom he calleth, them also he justifieth,’ and endueth with the grace of sanctification, Rom. vi. 2, &amp;c.; ‘and whom he justifieth, them also he glorifieth.’

If any be engrafted into Christ by a lively faith, he cannot but bring forth the fruit of good life, John xv. 2, 5; and whosoever doth not bring forth such fruit, it is certain that he is not yet engrafted into Jesus Christ. Let us not therefore, I say, flatter nor deceive ourselves, as though we had true faith, when we have not the true fruits of faith; for as the sun cannot be without light, nor the fire without heat, no more can a saving faith be without good -works, which are the fruits and effects thereof.

The penitent thief had but a short time of repentance, yet in that short time he wanted not good works to declare his faith, Luke xxiii. 40-42; for no sooner was it given him to believe in Christ, but that presently he maketh answer on the behalf of Christ, and cleareth him of all amiss; he rebuketh his fellow for his incredulity; he confesseth the greatness of their sin, and their just punishment for the same; he acknowledgeth Christ to be the Lord, and calleth upon him.</p></blockquote>

<blockquote><p>III. However, the received opinion among the orthodox is that the promise given to Adam was not only of a happy life to be continued in paradise, but of a heavenly and eternal life (to which he was to be carried after the course of perfect obedience and perseverance had been run and which God had prescribed to him as a trial of his faith). Hence it is evident that the question is not whether Adam had the privilege of immortality in his upright state (which we have proved before against Socinus). The question is not whether the promise was given to him of happiness and life perpetually to endure, if he had persisted integrity (which the learned men, with whom we here dispute, do not deny). Rather the question is whether that happiness and life were to be passed in heaven or only upon the earth and in paradise. The latter, they affirm; we the former.

IV. The reasons are: (1) The law of works had the promise of heavenly and eternal life; therefore also the law prescribed to Adam. In each instance, it is the same law as to substance. The former is evident from “who doeth these things, shall live by them” (Lev. 18:5); “if thou wilt enter into life” (namely, the heavenly) “keep the commandments” (Mt. 19:16, 17); and “the commandment was ordained to life” (Rom. 7:10) assuredly, not earthly, but heavenly. Since however, after the fall, the law can justify no one, this promise must necessarily have had place in upright Adam.</p></blockquote>

<blockquote><p>Now in all dwelling in Christ there is a continual acting of life by believing, joying, resting in God. As Phillip says, Jn. 14:8, ‘Lord, show us the Father and it sufficeth us.’ Here life seeks a soul-satisfying union with life, for life is only a satisfactory object to life. Living things seek no dead things as such to be their happiness if reason do rightly act them, and God as revealed in Jesus Christ is that in which the saints find a soul-sufficiency for themselves; and the act of seeing God in Christ, whether in this life or in the life to come, is an act of life, for the soul lives in the ocean, sea, and bosom of a fair eternal truth. But does it act there? yea, it does, and the Scripture expresses its acting by seeing God, drinking the fountain of life. Then the soul, thus in Christ, drinks in love and milks, and sucks in the soul-rejoicing irradiations of Christ, and Christ letting out the breathings of the sweetness of his excellency on the face of the soul draws and sucks in reciprocally acts of admiration and wondering, Cant. 2:8, ‘The voice of my beloved, behold he cometh leaping upon the mountaines, and skipping on the hills;’ ‘behold’ is a word of wonder, 1 Jn. 3:1, ‘Behold what manner of love the Father hath bestowed on us.’ Not love only, but the manner and the kind of the Father’s love in Christ, is a world’s wonder, and 2 Thess. 1:10, Christ when he comes shall be wondered in them that believe. 2. Then again when we see and enjoy the drawing loveliness of Christ, He as the fountain and well of life pours in, in our intellectuall love and in the glancings and rays of our understanding, acts of divine light, lumps of fresh love from the spring of heaven’s love, and the soul opens its mouth wide and takes in the streams of Christ’s nectar, honey and milk, his consolations and love-breathings; and in his light we seeing light, and in his love, feeling love, He makes out light and love (as it were) coeternal with borrowed eternity; and we go along with the out-shinings of Christ’s bright countenance, to shine in borrowed light, to flame in borrowed coals of love; and as Christ is said to feed his flock among the lilies, the garden of Christ, his Church being the common pasture for the lambs of the flock; so He feeds the souls of the saints that enjoy Him, with the marrow, fatness and dainties of his light and love that shine in his face, even as the oil feeds the lamp; but with this difference, Christ’s dainties are not lessened because we feed upon them, as the oil is consumed with burning.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Now in all dwelling in Christ there is a continual acting of life by believing, joying, resting in God. As Phillip says, Jn. 14:8, ‘Lord, show us the Father and it sufficeth us.’ Here life seeks a soul-satisfying union with life, for life is only a satisfactory object to life. Living things seek no dead things as such to be their happiness if reason do rightly act them, and God as revealed in Jesus Christ is that in which the saints find a soul-sufficiency for themselves; and the act of seeing God in Christ, whether in this life or in the life to come, is an act of life, for the soul lives in the ocean, sea, and bosom of a fair eternal truth. But does it act there? yea, it does, and the Scripture expresses its acting by seeing God, drinking the fountain of life. Then the soul, thus in Christ, drinks in love and milks, and sucks in the soul-rejoicing irradiations of Christ, and Christ letting out the breathings of the sweetness of his excellency on the face of the soul draws and sucks in reciprocally acts of admiration and wondering, Cant. 2:8, ‘The voice of my beloved, behold he cometh leaping upon the mountaines, and skipping on the hills;’ ‘behold’ is a word of wonder, 1 Jn. 3:1, ‘Behold what manner of love the Father hath bestowed on us.’ Not love only, but the manner and the kind of the Father’s love in Christ, is a world’s wonder, and 2 Thess. 1:10, Christ when he comes shall be wondered in them that believe. 2. Then again when we see and enjoy the drawing loveliness of Christ, He as the fountain and well of life pours in, in our intellectuall love and in the glancings and rays of our understanding, acts of divine light, lumps of fresh love from the spring of heaven’s love, and the soul opens its mouth wide and takes in the streams of Christ’s nectar, honey and milk, his consolations and love-breathings; and in his light we seeing light, and in his love, feeling love, He makes out light and love (as it were) coeternal with borrowed eternity; and we go along with the out-shinings of Christ’s bright countenance, to shine in borrowed light, to flame in borrowed coals of love; and as Christ is said to feed his flock among the lilies, the garden of Christ, his Church being the common pasture for the lambs of the flock; so He feeds the souls of the saints that enjoy Him, with the marrow, fatness and dainties of his light and love that shine in his face, even as the oil feeds the lamp; but with this difference, Christ’s dainties are not lessened because we feed upon them, as the oil is consumed with burning.”

— Samuel Rutherford, Christ Dying &amp; Drawing Sinners to Himself, (London: 1647), pp. 360-61">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+in+all+dwelling+in+Christ+there+is+a+continual+acting+of+life+by+believing%2C+joying%2C+resting+in+God.+As+Phillip+says%2C+Jn.+14%3A8%2C+%E2%80%98Lord%2C+show+us+the+Father+and+it+sufficeth+us.%E2%80%99+Here+life+seeks+a+soul-satisfying+union+with+life%2C+for+life+is+only+a+satisfactory+object+to+life.+Living+things+seek+no+dead+things+as+such+to+be+their+happiness+if+reason+do+rightly+act+them%2C+and+God+as+revealed+in+Jesus+Christ+is+that+in+which+the+saints+find+a+soul-sufficiency+for+themselves%3B+and+the+act+of+seeing+God+in+Christ%2C+whether+in+this+life+or+in+the+life+to+come%2C+is+an+act+of+life%2C+for+the+soul+lives+in+the+ocean%2C+sea%2C+and+bosom+of+a+fair+eternal+truth.+But+does+it+act+there%3F+yea%2C+it+does%2C+and+the+Scripture+expresses+its+acting+by+seeing+God%2C+drinking+the+fountain+of+life.+Then+the+soul%2C+thus+in+Christ%2C+drinks+in+love+and+milks%2C+and+sucks+in+the+soul-rejoicing+irradiations+of+Christ%2C+and+Christ+letting+out+the+breathings+of+the+sweetness+of+his+excellency+on+the+face+of+the+soul+draws+and+sucks+in+reciprocally+acts+of+admiration+and+wondering%2C+Cant.+2%3A8%2C+%E2%80%98The+voice+of+my+beloved%2C+behold+he+cometh+leaping+upon+the+mountaines%2C+and+skipping+on+the+hills%3B%E2%80%99+%E2%80%98behold%E2%80%99+is+a+word+of+wonder%2C+1+Jn.+3%3A1%2C+%E2%80%98Behold+what+manner+of+love+the+Father+hath+bestowed+on+us.%E2%80%99+Not+love+only%2C+but+the+manner+and+the+kind+of+the+Father%E2%80%99s+love+in+Christ%2C+is+a+world%E2%80%99s+wonder%2C+and+2+Thess.+1%3A10%2C+Christ+when+he+comes+shall+be+wondered+in+them+that+believe.+2.+Then+again+when+we+see+and+enjoy+the+drawing+loveliness+of+Christ%2C+He+as+the+fountain+and+well+of+life+pours+in%2C+in+our+intellectuall+love+and+in+the+glancings+and+rays+of+our+understanding%2C+acts+of+divine+light%2C+lumps+of+fresh+love+from+the+spring+of+heaven%E2%80%99s+love%2C+and+the+soul+opens+its+mouth+wide+and+takes+in+the+streams+of+Christ%E2%80%99s+nectar%2C+honey+and+milk%2C+his+consolations+and+love-breathings%3B+and+in+his+light+we+seeing+light%2C+and+in+his+love%2C+feeling+love%2C+He+makes+out+light+and+love+%28as+it+were%29+coeternal+with+borrowed+eternity%3B+and+we+go+along+with+the+out-shinings+of+Christ%E2%80%99s+bright+countenance%2C+to+shine+in+borrowed+light%2C+to+flame+in+borrowed+coals+of+love%3B+and+as+Christ+is+said+to+feed+his+flock+among+the+lilies%2C+the+garden+of+Christ%2C+his+Church+being+the+common+pasture+for+the+lambs+of+the+flock%3B+so+He+feeds+the+souls+of+the+saints+that+enjoy+Him%2C+with+the+marrow%2C+fatness+and+dainties+of+his+light+and+love+that+shine+in+his+face%2C+even+as+the+oil+feeds+the+lamp%3B+but+with+this+difference%2C+Christ%E2%80%99s+dainties+are+not+lessened+because+we+feed+upon+them%2C+as+the+oil+is+consumed+with+burning.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+%28London%3A+1647%29%2C+pp.+360-61&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5dd7c3879c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5dd7c3879c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-beatific-vision/#:~:text=Now%20in%20all%20dwelling%20in%20Christ,the%20oil%20is%20consumed%20with%20burning&amp;text=Now%20in%20all%20dwelling%20in%20Christ%20there%20is&amp;text=them%2C%20as%20the%20oil%20is%20consumed%20with%20burning" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>There is a Community of Glory betwixt Christ and Us: The Heaven that the Mediator Christ Enjoys, is our Heaven; Our Heaven is to the Man Christ in a Conquest: Heaven was bought with Blood to Him and Us, and to make you Rejoice: None of GOD‘s Children gets a Heaven properly of their own; Why? We got a share and part of Christ‘s Inheritance, He is the Principal Heir, Romans 8.

We are the Conjunct-heirs: Sweet is that Word which He speaks to his Children, Luke 22. 29. And I appoint unto You a Kingdom, as My Father hath appointed unto Me, that ye may Eat and Drink at My Table in My Kingdom, Sitting on Thrones, Judging the Twelve Tribes of Israel. The Meaning is, My Father hath made a Disposition to Me of the Kingdom of GOD, it is Mine and My Dear Children. I will think Heaven uncouth if ye be not with Me. Here I make a Disposition and Resignation of that Kingdom to you; Ye shall Sit at my Table in My Kingdom: Up your Heart, howbeit ye be not Lords in Earth, ye shall be Lords in Heaven; I and Ye shall part Kingdoms and Thrones together.

Secondly, Rejoice in this ye that are in Christ and see your Condition, ye and Christ are Halfers together of Heaven and Glory, O if GOD‘s Children be in a Sweet Case as long as Christ is in Heaven and keeps the Inheritance, as long shall we keep our Right; And who can cause him Flit? The Devil hath made these Enemies of the Grace of GOD to Misken all our communion with Christ, they have put Christ and the Elect together, as a Man in an Inns for a Night, and to go away to Morrow; They have yoked Christ and us together, as if He were one and we another; as if He were His own, and We were our own; as if Christ had no Law and Right to Us, and We had no Law and Right to Christ, but met at a Venture, and sundered at a Venture; as if We had one heaven, and He had another; As if he had his Portion by himself alone, and that he keeps for ever; and that We had our Share be our alone too, to Sell when We pleased.

Sells if we Dispone Heaven, We Dispone not Christ‘s Heaven. In the Fighting he fights all the Battles his alone, We but look on: But when it comes to the Dividing of the Spoil, We get a Rich Share of the Spoil, Yet he gave the Whole Sum for the Inheritance, and We Nothing; yet we are set at his Elbow in a Throne with him, Now seeing our Right is also Good, slip not from them: Do not as some Unworthy Heir, who having a Good Right slips from it for a feckless composition after Drink, quits all, howbeit he should Beg: Indeed the Wicked does this.

The Devil drinks them Blankfull, and fills them with Worldly Pleasures, and gars them Subscribe a Resignation, and gives them an unworthy composition, some present Pleasure. Compone not with the Devil to go to the Law with him, let Christ be your Advocate, Subscribe not a Submission with the Devil, come never in Trysting Terms with him hold you aback from the World, and the Lusts of it, it is the Devil’s Arles that he gives to Silly Drunken Heirs, when they cry Hills and Mountains fall on us: They would fain give back the Arles and Rew, but it is out of time.</p></blockquote>

<blockquote><p>Nothing but the Divine Essence can make us happy in the life to come… Not a perfect enjoying of Christ the Mediator, because He as Mediator, has his happiness in another, Ps. 16, end, it is spoken of Christ. The highest object of faith must be to the soul the highest ground of joy; the essence of God is the ultimate object of faith, 1 Pet. 1:21.</p></blockquote>

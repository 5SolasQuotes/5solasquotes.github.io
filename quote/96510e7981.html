</figure><figure class="quote" id="q-a299d3c350" data-kw="">
<blockquote><p>Conclusion 1: This civil coercive power is not only unnecessary, but unlawful to be exercised in the planting of the Church, and bringing men to the faith of Christ. Churches are not to be planted by weapons, but by doctrines (Lactantius, Institutes, bk. 5, ch. 20); not by the power of the sword, but by the efficacy of the Word; not by carnal weapons, but by spiritual means. The commission that Christ gave his apostles for the spreading and planting of the Gospel was only this, ‘Go and teach all nations, baptizing them in the name of the Father, and of the Son and of the Holy Ghost,’ Mt. 28:19-20, the like, in Mk. 16:15. And Christ tells us his kingdom is not of this world, for then his servants would fight for him, Jn. 18:36, but that was not the way to plant or advance his kingdom. Christ has no need of such carnal weapons for the planting of his Church, or the settling Him in his kingdom: the apostles had a warfare to fight, but the weapons of their warfare were not carnal, but spiritual, and yet strong to pull down the strongest holds of sin and Satan, and to bring every thought in obedience to Christ, 2 Cor. 10:3-4. They had a sword to wield, but that sword was no other but the Word of God, the sword of the Spirit, Eph. 6:17; Rev. 19:15. Here were armies to subdue even nations to Christ, but these were armies of teachers, not of soldiers, as the Psalmist alludes, Ps. 68:11. External force is not the way of Christ for the spreading his Gospel, and planting of his kingdom: It is true here, Religio suaderi potest, cogi non potest, ‘Men may be persuaded into a religion, but they can never be compelled.’ All externall acts of power are not able to beget internal acts of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, (London: Miller, 1646), p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-c9eb1665f4" data-kw="">
<blockquote><p>This opinion is the way to Arminian liberty of conscience, that men in a Christian commonwealth may be of any religion, and the magistrate is to behold men as an indifferent spectator, not caring what religion they be of, whether they be Papists, Jews, Pagans, Anabaptists, Socinians, Macedonians, etc. which should infer that the magistrate were no nurse-father of the true Church, nor yet a preserver of religion, if men might be of any religion…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2 | Appendix, p. 355</span></figcaption>

</figure><figure class="quote" id="q-0879226770" data-kw="">
<blockquote><p>The controversy which has been moved concerning the civil magistrate’s vice-gerentship, and the holding of his office of, and under, and for Jesus Christ, as He is Mediator, has a necessary coherence with, and dependence upon, another controversy concerning a twofold kingdom of Jesus Christ… It is a distinction which Mr. Hussey [an Erastian] cannot endure, and no marvel, for it overturns the foundation of his opinion. He looks upon it as an absurd assertion, p. 25, ‘Shall He have one kingdom as Mediator, and another as God?’ He quarrels all that I have said of the twofold kingdom of Christ, and will not admit that Christ, as Mediator, is King of the church only, p. 25-27, 35-37. … He holds that Christ, as Mediator, has placed the Christian magistrate under Him, and as his vice-gerent, and has given him commission to govern the church, which, if he or any man can prove from the word of God, it will go far in the decision of the Erastian controversy… Mr. [Thomas] Coleman [c.1597-1646] in his Re-Examination, p. 19, was fearful to set his foot upon so slippery ground. He was loath to adventure upon this assertion, that magistracy is derived from Christ, as Mediator, by a commission of deputation and vice-gerentship… Wherefore he made a retreat and held him at this: ‘That magistracy is given to Christ to be serviceable in his kingdom.’ But out steps Mr. Hussey and boldly avers a great deal more. I much mistake if he shall not be made either to make a retreat, as Mr. Coleman did, or to do worse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod</cite></span></figcaption>

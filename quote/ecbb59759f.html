<main class="wrap"><figure class="quote" id="q-ecbb59759f" data-kw="">
<blockquote><p>…in making orders and ceremonies of the Church it is not lawful to do what men list, but they are bound to follow the general rules of the Scripture that are given to be the square whereby those should be squared out. Which rules I will here set down as those which I would have as well all orders and ceremonies of the church framed by as by the which I wil be content that all those orders and ceremonies which are now in question whether they be good and convenient or no should be tried and examined by. And they are those rules which Paul gave in such cases as are not particularly mentioned of in scripture. The first, that they offend not any, especially the Church of God. (1 Cor. 10:32) The second is (that which you cite also out of Paul) that all be done in order and comliness. (1 Cor. 14:40) The third, that all be done to edifying. (1 Cor. 14:26) The last, that they be done to the glory of God. Rom. 6:7)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reply to an Answer made of Mr. Doctor Whitgift against the Admonition to the Parliament</cite>, (1573), Answer to, pp. 20-22, p. 27</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ed3a9d77a" data-kw="">
<blockquote><p>As for the Love-feasts used in the primitive Church: 1. They had no religious state in divine worship, but were used only as moral signs of mutual charity. The Rhemists [Romanists] will have them called Coenas dominicas. But what-says Cartwright against them? ‘We grant that there were such feasts used in times past, but they were called by the name of [Greek] or Love-feasts, not by the name of the Lord’s Supper: neither could one without sacrilege give so holy a name to a common feast, which never had ground out of the Word, and which after for just cause was thrust out by the Word of God.’ 2. If it be thought, that they were used as sacred signs of Christian charity, because they were eaten in the Church. I answer, the eating of them in the Church is forbidden by the apostle. ‘What?’ says he, ‘have ye not houses to eat and to drink in?’ or despise ye the Church of God? Aperte vetat, says [David] Pareus: commessationes in Ecclesia, quocunque fueo pingantur. Vocabant [Greek] charitates: sed nihil minus erant. Erant schismatum fomenta. Singulae enim sectae suas instituebant. And a little after: Aliquae Ecclesiae obtemperasse videntur. Nam Iustini temporibus Romana Ecclesia [Greek] non habuit. (Commentary in that place)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>§7. Of Bowing at the Name of Jesus It is rationally supposed that in this act, not the name, but the Person so named is made the object of adoration; the name pronounced is only the occasion of the present adoration of the Person. Nothing in reason or Scripture does evince that it is simply evil to adore Christ by incurvation of the body or other reverent gesture upon occasion of the pronouncing of the name “Jesus.</p></blockquote>

</figure><figure class="quote" id="q-88821cf794" data-kw="">
<blockquote><p>Conclusion 3. We hold that the Church of God has power to prescribe ordinances rules, or traditions, touching time and place of God’s worship, and touching order and comeliness to be used in the same: and in this regard, Paul, 1 Cor. 11:2, commends the Church of Corinth for keeping his traditions, and Acts 15, the Council at Jerusalem decreed that the Churches of the Gentiles should abstain from blood and from things strangled. This decree is termed a tradition, and it was in force among them so long as the offence of the Jews remained. And this kind of traditions, whether made by general councils or particular synods, we have care to maintain and observe; these caveats being remembered: First, that they prescribe nothing childish or absurd to be done: Secondly, that they be not imposed as any parts of God’s worship: Thirdly, that they be severed from superstition or opinion of merit: Lastly, that the Church of God be not burdened with the multitude of them.</p></blockquote>

the,burdened%20with%20the%20multitude%20of%20them&amp;text=Conclusion%203.%20We%20hold%20that%20the%20Church%20of&amp;text=be%20not%20burdened%20with%20the%20multitude%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. It is not absolutely unlawful to personate another man, nor does the Second Commandment forbid such living Images in this extent. I pass by the instance of the woman of Tekoah, 2 Sam. 14, because the bare history proves not the lawfulness. But Paul’s speaking as of himself and Apollos the things which concerned others, was approvable: And as Christ frequently taught by parables, so his parables were a description of good and evil, by the way of feigned history, as if such and such things had been done by such persons as never were. And this fiction is no falsehood; For the hearer knows that it is not meant as an historical narrative, but a parable; And it is but an image in words, or a painted doctrine. And if a person and action may be feigned by words, I know not where it is forbidden to feign them by personal representation. Therefore to personate another is not simply a sin. 2. To personate good men in good actions is not simply unlawful: because: 1. It is not unlawful as it is personating, as is showed: 2. Nor as lying: Because it is not an asserting, but a representing; nor so taken. 3. To personate a bad man in a bad action, is more dubious; but seems not to be in all cases unlawful. To pass by David’s feigning himself mad (as of uncertain quality) it is common with preachers to speak oft the words of wicked men, as in their names or persons, to disgrace them: And Prov. 5:11-12, etc. comes near it. And whether Job be a history, or a dialogue personating such speakers, is doubted by the most learned expositors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London: White, 1673), pt. 3, ‘Christian Ecclesiastics’, Question 114, ‘Whether Stage-Plays where the Virtuous &amp; Vicious are Personated, be Lawful?’ [Yes], p. 877</span></figcaption>

<div class="actions"><button class="copy" data-copy="“1. It is not absolutely unlawful to personate another man, nor does the Second Commandment forbid such living Images in this extent. I pass by the instance of the woman of Tekoah, 2 Sam. 14, because the bare history proves not the lawfulness. But Paul’s speaking as of himself and Apollos the things which concerned others, was approvable: And as Christ frequently taught by parables, so his parables were a description of good and evil, by the way of feigned history, as if such and such things had been done by such persons as never were. And this fiction is no falsehood; For the hearer knows that it is not meant as an historical narrative, but a parable; And it is but an image in words, or a painted doctrine. And if a person and action may be feigned by words, I know not where it is forbidden to feign them by personal representation. Therefore to personate another is not simply a sin. 2. To personate good men in good actions is not simply unlawful: because: 1. It is not unlawful as it is personating, as is showed: 2. Nor as lying: Because it is not an asserting, but a representing; nor so taken. 3. To personate a bad man in a bad action, is more dubious; but seems not to be in all cases unlawful. To pass by David’s feigning himself mad (as of uncertain quality) it is common with preachers to speak oft the words of wicked men, as in their names or persons, to disgrace them: And Prov. 5:11-12, etc. comes near it. And whether Job be a history, or a dialogue personating such speakers, is doubted by the most learned expositors.”

— Richard Baxter, A Christian Directory… (London: White, 1673), pt. 3, ‘Christian Ecclesiastics’, Question 114, ‘Whether Stage-Plays where the Virtuous &amp; Vicious are Personated, be Lawful?’ [Yes], p. 877">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+It+is+not+absolutely+unlawful+to+personate+another+man%2C+nor+does+the+Second+Commandment+forbid+such+living+Images+in+this+extent.+I+pass+by+the+instance+of+the+woman+of+Tekoah%2C+2+Sam.+14%2C+because+the+bare+history+proves+not+the+lawfulness.+But+Paul%E2%80%99s+speaking+as+of+himself+and+Apollos+the+things+which+concerned+others%2C+was+approvable%3A+And+as+Christ+frequently+taught+by+parables%2C+so+his+parables+were+a+description+of+good+and+evil%2C+by+the+way+of+feigned+history%2C+as+if+such+and+such+things+had+been+done+by+such+persons+as+never+were.+And+this+fiction+is+no+falsehood%3B+For+the+hearer+knows+that+it+is+not+meant+as+an+historical+narrative%2C+but+a+parable%3B+And+it+is+but+an+image+in+words%2C+or+a+painted+doctrine.+And+if+a+person+and+action+may+be+feigned+by+words%2C+I+know+not+where+it+is+forbidden+to+feign+them+by+personal+representation.+Therefore+to+personate+another+is+not+simply+a+sin.+2.+To+personate+good+men+in+good+actions+is+not+simply+unlawful%3A+because%3A+1.+It+is+not+unlawful+as+it+is+personating%2C+as+is+showed%3A+2.+Nor+as+lying%3A+Because+it+is+not+an+asserting%2C+but+a+representing%3B+nor+so+taken.+3.+To+personate+a+bad+man+in+a+bad+action%2C+is+more+dubious%3B+but+seems+not+to+be+in+all+cases+unlawful.+To+pass+by+David%E2%80%99s+feigning+himself+mad+%28as+of+uncertain+quality%29+it+is+common+with+preachers+to+speak+oft+the+words+of+wicked+men%2C+as+in+their+names+or+persons%2C+to+disgrace+them%3A+And+Prov.+5%3A11-12%2C+etc.+comes+near+it.+And+whether+Job+be+a+history%2C+or+a+dialogue+personating+such+speakers%2C+is+doubted+by+the+most+learned+expositors.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+A+Christian+Directory%E2%80%A6+%28London%3A+White%2C+1673%29%2C+pt.+3%2C+%E2%80%98Christian+Ecclesiastics%E2%80%99%2C+Question+114%2C+%E2%80%98Whether+Stage-Plays+where+the+Virtuous+%26+Vicious+are+Personated%2C+be+Lawful%3F%E2%80%99+%5BYes%5D%2C+p.+877&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5f508fedcc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5f508fedcc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-theater-stage-plays-movies-acting-etc/#:~:text=1.%20It%20is%20not%20absolutely%20unlawful,doubted%20by%20the%20most%20learned%20expositors&amp;text=1.%20It%20is%20not%20absolutely%20unlawful%20to%20personate&amp;text=speakers%2C%20is%20doubted%20by%20the%20most%20learned%20expositors" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

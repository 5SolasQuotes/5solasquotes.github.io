<main class="wrap"><figure class="quote" id="q-5481a13ede" data-kw="fifth commandment parents">
<blockquote><p>Among others in relation to the fifth precept, this question concerning the honoring of parents is agitated between us and the papists. In many ways, the latter weaken this precept, maintaining that children, against the consent of their parents, may not only contract marriage, but even adopt a monastic life. May children withdraw themselves from the power of their parents and marry without their consent? We deny against the papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.15.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/second-table-commandments-5-10.html">Second Table (Commandments 5-10)</a> › <a href="../topics/the-law-of-god/second-table-commandments-5-10/honor-of-parents-and-authorities.html">Honor of parents and authorities</a></span><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a> › <a href="../topics/worship/oaths-and-vows/monastic-vows.html">Monastic vows</a></span></div>

</figure><figure class="quote" id="q-eb60913018" data-kw="Contentment">
<blockquote><p>Q. 86. What is forbidden in the tenth commandment? A. The tenth commandment forbids all discontentment with our own estate (1 Kings 21:4; Est. 5:13; 1 Cor. 10:10), envying or grieving at the good of our neighbor (Gal. 5:26; James 3:14, 16), and all inordinate motions and affections to anything that is his (Rom. 7:7–8; 13:9; Deut. 5:21).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-keach.html">Benjamin Keach</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Baptist Catechism</cite>, Q. 86</span></figcaption>

</figure><figure class="quote" id="q-773bd4c750" data-kw="sixth commandment homicide">
<blockquote><p>Because various cases can occur in which homicide can either be lawful or unlawful and to be condemned, hence arises the question—What is prohibited in the sixth precept, “Thou shalt not kill,” and what is not? First negatively, judicial homicide is not prohibited. Are the rights of war and punishment contained under this commandment? Are suicide and duelling prohibited? The former we deny; the latter we affirm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.16.1–2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-a1b86c2501" data-kw="">
<blockquote><p>Since, therefore, it is clear from what has been said that our will is effectively moved and determined by God as the first cause, the first mover, and therefore is preceded and predetermined by Him, it remains to be explained how this effective motion and determination, or rather divine pre-motion and predetermination, is consistent with the freedom of our will. For it does not seem that what is effectively moved and determined in one direction by a prior cause can be free to do otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 339-42 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan. | XXII. And these points are consistent with what is read in Estius in the above-cited passage, where he expounds the same doctrine and brings many confirmations to it. He concludes thus and objects to the freedom of human will:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74e6c84dda" data-kw="">
<blockquote><p>Because God works in them both to will and to do, according to his good pleasure, Phil. 2:12,13, not only by some moral persuasion, as those Pelagianizing here attribute an equal operation in man to the Devil with God; but also by the real and hyper-physical power of his Spirit, and the concourse of grace determining; indeed also predetermining, and thus also leading the gifts granted to us into act. But will not the eternal and such great grace, condescension, love, and mercy of God towards us miserable sinners excite us in turn to love, revere, worship and observe him, in whose communion all our happiness consists?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthias-nethenus.html">Matthias Nethenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface in Samuel Rutherford, Examination of Arminianism tr. by AI by Onku (1639-1642; 1668), p. 33</span></figcaption>

</figure><figure class="quote" id="q-7df9615162" data-kw="Permission Author of sin">
<blockquote><p>For two things are to be considered in evil actions: the action itself, and the ἀνομία [anomia, lawlessness] of the action. The action itself, as a natural motion, takes place by the efficacious working of God; but the anomia or wickedness takes place by the active permission of God. … for as in a horse the cause of the motion is one thing and the cause of the limping another, so it is one thing to be the cause of the action and another to be the cause of the wickedness cleaving to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</span></figcaption>

</figure><figure class="quote" id="q-42ea69f38c" data-kw="">
<blockquote><p>From that position it follows that the human will can do more than the divine, and can draw and temper it according to its own nod and pleasure. This is clear because whatever it wills, God fulfills: if it wills, the concurrence is present; if it does not will, it is absent. And God waits to see what it wills and does not act before its nod, nor operates contrary to its will… It elicits the act when it pleases and determines the divine concurrence according to its own judgment. Therefore the will does what the human will wills, not what the divine will wills. From which it follows that the will is mistress of the divine concurrences, which are ready — as those authors say — indifferently for the pleasure of the will… What is this but to drive God around in circles, as it were, and lead him about? Yet this is in no way permitted to God with respect to the creature, through which God is not allowed to act freely and to operate according to his own judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters</cite>, … vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Contra Molinists, p. 378</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

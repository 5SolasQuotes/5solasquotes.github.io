<blockquote><p>I answer that the emanation of created things from God is like the procession of artifacts from an artisan. Hence just as artificial forms in matter flow forth from the art of an artisan, so also all natural forms and powers flow from the ideas existing in the divine mind. But because, as Dionysius says, ‘things that are caused preexist in their causes abundantly,’ forms received in matter are not equal to the uncreated power or art from which they proceed. Hence from his art, an artisan still has the power to do something in some other way to what he has made, to which thing the power of his art has not been bound. Similarly, it is within God’s power to add, change, or remove something from created things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, bk. 2, distinction 18, Creation of Woman, quest. 1, art. 2, I answer that</span></figcaption>

<blockquote><p>Seventhly, some may ask in what space did God make the world? I answer: God could have made the world and all things in it in one moment: but He began and finished the whole work in six distinct days. [This phrase is likely opposed to those in the early and Medieval Church who taught that the six days were but one day repeated six times.] In the first day He made the matter of all things and the light… and in the end of the sixth day He made man. Thus in six distinct spaces of time, the Lord did make all things: and that especially for three causes: I. To teach men that they ought to have a distinct and serious consideration of every creature: for if God had made the world in a moment, some might have said, this work is so mystical that no man can speak of it. But for the preventing of this cavil, it was his pleasure to make the world and all things therein in six days: and the seventh day He commanded it to be sanctified by men, that they might distinctly and seriously meditate upon every work of the creation. II. God made the world and every thing therein in six distinct days, to teach us what wonderful power and liberty He had over all his creatures: for He made the light when there was neither sun nor moon, nor stars: to show that in giving light to the world, He is not bound to the sun, to any creature or to any means: for the light was made the first day: but the sun, the moon and the stars were not created before the fourth day. Again, trees and plants were created the third day: but yet the sun, moon and the stars, and rain which nourish and make herbs, trees and plants to grow were not created till after the third day: which shows plainly that God can make trees, plants and herbs to grow without the means of rain, and without the virtue and operation of the sun, the moon and the stars. III. He made the world in six distinct days and framed all things in this order to teach us his wonderful providence of his creatures: for before man was created He provided for him a dwelling place and all things necessary for his perpetual preservation and perfect happiness and felicity. So also He created beasts and cattle: but not before He had made herbs, plants and grass, and all means whereby they are preserved. And if God had this care over man when as yet He was not: much more will God have care over him now when he is, and has a being in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (London, 1595), pp. 62-63</span></figcaption>

</figure><figure class="quote" id="q-c0b3c83338" data-kw="">
<blockquote><p>8. The object of God’s will to create man was nothing, in the sense that we now take an object in, that is, for the materia circa quam [matter around which]. But if you will call the intended effect the object, then the object of God’s will here (and in the rest) is the thing willed. But if you will needs presume to seek one higher in the mind of God (man knows by reception and so has ideas, but God can be no recipient), you must say that it was man as conceived fit to be, as well as possible. For we can think no otherwise of the divine conceptions and volitions but as we are led by the analogy of human acts. And so we must say that: 1. God’s power makes it possible for all things to be. 2. Next God knows them possible. 3. He knows what is convenient or fit to be made to his unsearchable ends. 4. He wills that they shall be, and man among the rest, and so on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 13</span></figcaption>

<blockquote><p>These people believe that the Bible clearly states that the Earth does not move, and hence the only acceptable Biblical cosmology is a geocentric one… We examine these arguments, and find them poorly founded. The Scriptural passages quoted do not address cosmology. Some geocentrists draw distinctions that do not exist in the original autographs or even in translations. In short, the Bible is neither geocentric nor heliocentric… Many evolutionists claim that disbelief in evolution is like disbelief that the Earth goes round the Sun. The obvious flaw is that the latter is repeatable and observable while the former is not…. …Aardsma’s ICR Impact article, where he points out something well known to high-school physics students, but apparently not to bibliosceptics—that it’s valid to describe motion from any reference frame, although an inertial one usually makes the mathematics simpler. But there are many times when the Earth is a convenient reference frame; i.e. at some point we all use the geocentric model in one sense. For instance, a planetarium is a geocentric model. Calculation of rising, transiting, and setting of various celestial objects is calculated geocentrically. There are numerous other examples. Since modern astronomers often use an Earth-centred reference frame, it’s unfair and anti-scientific to criticise the Bible for doing the same. But this is hardly the issue, and the use of the geocentric model under these circumstances hardly makes one a geocentrist. I’m using the term to describe those who claim that the Earth is the only valid reference frame and oppose the use of any other reference frame. Perhaps the best-known geocentrist in the world today [2001] is Gerardus Bouw, who has been a professor at Baldwin-Wallace College in Berea, Ohio… To distinguish modern geocentrism from ancient geocentrism, Bouw has coined the term ‘geocentricity’ for the former. Bouw has a Ph.D. in astronomy from Case Western Reserve University… Given Bouw’s stature as the chief champion of geocentricity, we will use his book by the same name as the primary source on the topic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/danny-r-faulkner.html">Danny R. Faulkner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geocentrism &amp; Creation’ Technical Journal</cite>, (now Journal of Creation) 15, no. 2 (August 2001): 110–121.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>4. Newness of being is essential to it [created being], or of its notion… 5. As also assiduous dependence on the First Being and containment or inexistence in it. But its being in God is threefold: eminent, ideal, intelligible. In that way it is in his power as in an efficient cause, conserving and governing: in that [ideal way] in the idea as in an exemplary cause: in this [intelligible way] in knowledge as in the knower, the most beautiful Himself bearing the beautiful world in mind, etc., Boethius sings. And divinely the apostle, Acts 17: ‘In Him we live, and move, and are:’ and, τοῦ γὰρ καὶ γένος ἐσμέν, as the apostle [cites] there from Aratus. [This is] Against Durandus and those of whom Augustine makes mention, bk. 5, On the Literal Meaning of Genesis, who denied concourse.</p></blockquote>

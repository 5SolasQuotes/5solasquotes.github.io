<blockquote><p>…though the Magistrate take care that physicians, painters, shoe-makers, professors in academies and universities do their duty in their calling, and punish them if they therein do amiss, yet he limits not the painter to draw this way, not this way; nor has he a negative voice [veto power] in acts of art [such as these trades]…</p></blockquote>

<blockquote><p>A Christian man is the most free lord of all, and subject to none; a Christian man is the most dutiful servant of all, and subject to everyone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Freedom of a Christian</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a> › <a href="../topics/the-christian-life/christian-liberty-and-conscience/liberty-of-conscience.html">Liberty of conscience</a></span><span class="t"><a href="../topics/good-works/nature-of-good-works.html">Nature of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“A Christian man is the most free lord of all, and subject to none; a Christian man is the most dutiful servant of all, and subject to everyone.”

— Martin Luther, The Freedom of a Christian">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+Christian+man+is+the+most+free+lord+of+all%2C+and+subject+to+none%3B+a+Christian+man+is+the+most+dutiful+servant+of+all%2C+and+subject+to+everyone.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+The+Freedom+of+a+Christian&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f190eff4a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4f190eff4a.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-eaa8ad3c22" data-kw="">
<blockquote><p>It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 39, ‘Know which are the great duties of a Christian life, and wherein the nature of true Religion does consist; and then pretend not any lesser duty against those greater, though the least when it is indeed a duty, is not to be denied or neglected’, p. 211</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is one of the most important things in the world for the resolving of a thousand cases of conscience and the directing of a Christian life to know which duties are the greater and which are the lesser, and so which is to be preferred in competition; For that which is a duty at another time is a sin when it is done instead of a greater! as Christ has resolved in the case of the Sabbath. If good must be loved as good, then the greatest good must be most loved and sought. Sacrifice instead of mercy is a sin: Our gift must be left at the altar while we go to be reconciled to our brother. Mt. 5. Never hearken to those men who would set up their controverted duties or any positives and lesser things against the duties of nature itself or the great substantial parts of godliness.”

e%20of%20the%20most%20important%20things&amp;text=itself%20or%20the%20great%20substantial%20parts%20of%20godliness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6013b2a7fb" data-kw="">
<blockquote><p>Unless I am refuted and convicted by testimonies of the Scriptures or by clear arguments (since I believe neither the Pope nor the Councils alone; it being evident that they have often erred and contradicted themselves), I am conquered by the Holy Scriptures quoted by me, and my conscience is bound in the word of God: I can not and will not recant any thing, since it is unsafe and dangerous to do any thing against the conscience. … Here I stand. [I can not do otherwise.] God help me! Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Answer before the Diet of Worms</cite>, 18 April 1521</span></figcaption>

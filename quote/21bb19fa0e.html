</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7251b10f7e" data-kw="">
<blockquote><p>By justifying faith we understand, not only the common belief of the articles of the Christian religion, and a persuasion of the truth of God’s Word in general, but also a particular application of the gracious promises of the gospel to the comfort of our own souls, whereby we lay hold on Christ with all His benefits, having an earnest trust and confidence in God, that He will be merciful unto us for His only Son’s sake. So that a true believer may be certain, by the assurance of faith, of the forgiveness of his sins, and of his everlasting salvation by Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-ireland.html">Church of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Irish Articles</cite>, 1615, Art. 37</span></figcaption>

</figure><figure class="quote" id="q-a155569413" data-kw="">
<blockquote><p>When we are sure that we are forgiven, then we abhor iniquity; and I suppose that when faith grows into full assurance, so that we are certain beyond a doubt that the blood of Jesus has washed us whiter than snow, it is then that repentance reaches to its greatest height. Repentance grows as faith grows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, pp. 70–71</span></figcaption>

</figure><figure class="quote" id="q-5ceb932df3" data-kw="">
<blockquote><p>They were all eminently humble and lowly-minded men, if ever any were; and yet they all speak of their own state with an assured hope. Surely this should teach us that deep humility and strong assurance are perfectly compatible, and that there is not any necessary connection between spiritual confidence and pride.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Holiness</cite>, ch. “Assurance”, p. 167</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a> › <a href="../topics/assurance-peace-and-joy/assurance-of-salvation/assurance-of-grace-and-salvation.html">Assurance of grace and salvation</a></span></div>
<div class="actions"><button class="copy" data-copy="“They were all eminently humble and lowly-minded men, if ever any were; and yet they all speak of their own state with an assured hope. Surely this should teach us that deep humility and strong assurance are perfectly compatible, and that there is not any necessary connection between spiritual confidence and pride.”

— J. C. Ryle, Holiness, ch. “Assurance”, p. 167">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThey+were+all+eminently+humble+and+lowly-minded+men%2C+if+ever+any+were%3B+and+yet+they+all+speak+of+their+own+state+with+an+assured+hope.+Surely+this+should+teach+us+that+deep+humility+and+strong+assurance+are+perfectly+compatible%2C+and+that+there+is+not+any+necessary+connection+between+spiritual+confidence+and+pride.%E2%80%9D%0A%0A%E2%80%94+J.+C.+Ryle%2C+Holiness%2C+ch.+%E2%80%9CAssurance%E2%80%9D%2C+p.+167&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5ceb932df3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5ceb932df3.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-05ca7b0d67" data-kw="">
<blockquote><p>Therefore, we always hold fast this foundation, ascribing all the glory to God, humbling ourselves before Him, and acknowledging ourselves to be such as we really are, without presuming to trust in any thing in ourselves, or in any merit of ours, relying and resting upon the obedience of Christ crucified alone, which becomes ours when we believe in Him. This is sufficient to cover all our iniquities, and to give us confidence in approaching to God; freeing the conscience of fear, terror, and dread, without following the example of our first father, Adam, who, trembling, attempted to cover himself with fig leaves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 23</span></figcaption>

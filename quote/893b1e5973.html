<blockquote><p>The chief function of Christ’s obedience to the moral law is, to earn a title for the believer to the rewards of heaven. This part of Christ’s agency is necessary; because, merely to atone for past transgression would not be a complete salvation. It would, indeed, save man from hell, but it would not introduce him to heaven. He would be delivered from the law’s punishment, but would not be entitled to the law’s reward. “The man which doeth the things of the law shall live by them,” Rom. 10:5. Mere innocence is not entitled to a reward. Obedience is requisite in order to this. Adam was not meritorious until the had obeyed the commandment, “Do this.” Before he could “enter into life,” he must “keep the commandment,” like every subject of the divine government and candidate for heavenly reward. The Mediator, therefore, must not only suffer for man, but must obey for him, if he would do for man everything that the law requires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (Edinburgh: T &amp; T Clark, 1889), 2: 432.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1bd9f7ab35" data-kw="">
<blockquote><p>And first, as to His work of active obedience. In being made “under the law” He had become bound as the covenant head and representative of His chosen people, to fulfil all righteousness. The law under which He had thus placed himself, was obviously that very law which God gave to Israel in the wilderness.

He could not redeem Israel from the law to which they were subject, by taking upon himself the obligations of some other or different law. They, beyond all question, were under the law engraven on the tables of stone; and only by taking up the same position could He meet the necessities of their case.

Equally obvious and certain it is, that if the law as given to Israel was a merely Jewish law — if it was a law the obligation of which rested on that people alone, and which was to be done away so soon as their peculiar economy came to an end — then, and in that case, the obedience which Christ rendered to that law, could be of no avail to justify any but the Jews. On the footing of such a view of the law, Christ could not be, as He actually is, “the end of the law for righteousness to every one that believeth,” (Rom. x. 4); but only to every Jew that believeth.

It is true, indeed, that the righteousness which Christ wrought out, went unspeakably beyond the righteousness of the Scribes and Pharisees. It was the law as interpreted by the Sermon on the Mount, whose righteousness He fulfilled — a righteousness which looked not to actions merely, but to the motives in which they originated, and to the spirit in which they were performed — a righteousness which looked to the very thoughts and intents of the heart. But by the commentary upon the law which the Sermon on the Mount presents, there is not so much as one jot or tittle added to the law, as given to Israel at Sinai.

That commentary showed the law to be “exceeding broad;” but the Psalmist, long before, had pronounced it to be so; and all that broadness was embraced in the Ten Commandments. That commentary showed the law to be “spiritual,” as Paul subsequently testified that it is; but all that spirituality was inherent in it from the first. There may be a show and semblance of putting honour upon Christ, in disparaging the Decalogue — the law as embodied in the Ten Commandments, — and in speaking of the law as abrogated, or at the very least absorbed by the Gospel.

But so to disparage the Decalogue, is simply to disparage the work of Christ. It was the righteousness of that very Decalogue which He fulfilled. It was that very Decalogue, the sum and essence of all whose commandments, the Lord was setting forth, when He said by Moses to His people of old—”Hear, O Israel; the Lord our God is one Lord: and thou shalt love the Lord thy God with all thine heart, and with all thy soul, and with all thy might,” (Deut. vi., 4, 5).

And was it not of His own perfect obedience to that very command Christ was speaking, when He said to His disciples, beside the well in Samaria — “My meat is to do the will of Him that sent Me, and to finish His work,” (John iv. 24). Christ had no other gods before that one only living and true God. He worshipped that God in spirit and in truth. He hallowed that God’s name. He remembered the Sabbath-day to keep it holy — He honoured His parents according to the flesh. He loved His neighbour as himself — for he went about doing good — and in all the relations of life, He was holy, harmless, undefiled, and separate from sinners.

What David said typically, Christ could say in the strictness and fulness of literal truth, “I delight to do Thy will, O my God: yea, Thy law is within my heart,” (Psa. xl., 8). It is impossible, in a word, to point to so much as one solitary act or utterance of that holy and spotless life which He led on earth, from the cradle to the cross, that is not included in the righteousness of the law as given to Israel on the two tables of stone. It was that law that was in His heart; and it was that law, the holiness, justice, and goodness of which was exemplified in His life. In Him “there was no sin,” because in Him there was no transgression of that law’s commands. And it is in virtue of His perfect obedience to that law in our stead that this is the name by which He is called — “the Lord our Righteousness.</p></blockquote>

<blockquote><p>It is a question, the threatening standing, Gen. 2:17, how the active righteousness of Christ can be a cause meriting to us life and satisfying the Law when there is no [legal] suffering [by the saint] for the breach of the Law, which expressly required death in the sinner: Not to say that it seems too near to make Christ’s dying needless if his active holiness do the business; Nay we cannot so teach.</p></blockquote>

<blockquote><p>This excellency of the subject notwithstanding ought not to dull the edge of our most diligent search into it, but sharpen it rather, to endeavour so to define justification, that we may justify our definition. Which we cannot do, without distinguishing of a three-fold righteousness: first, a perfect righteousness, but not inherent; of which, 2 Cor. 5.21. secondly, inherent, but not perfect; of which, Luke 1.75. and Apoc. 22.11. thirdly, perfect and inherent, of which, Heb. 12.23. The first, is the righteousness by which we are justified; the second, by which we are sanctified; and the third, by which we are glorified.

The first consisteth as well of Christ’s active as his passive obedience, and in the imputation thereof by faith consisteth the essence of our justification, which may be thus defined: an act of God, whereby he acquitteth every penitent and believing sinner, by not imputing to him his sins, and imputing to him the perfect satisfaction and righteousness of Christ.

Every part of this definition may be proved by clear testimonies of Scripture; and besides, it hath that … certain mark or touch-stone of a true definition, that it meeteth with all doubts, and confronteth all errors broached against the nature of justification: first, the error of the Libertines, by that clause, every penitent: secondly, of the Antinomians, in the clause, not imputing their sin: thirdly, the Socinians, in the clause, perfect satisfaction: and lastly, the Arminians and Papists, in the last clause, imputing Christ’s righteousness, no habit or act of ours, no, not the act of faith.</p></blockquote>

<blockquote><p>The Westminster divine, Daniel Featley, quoted the below letter of King James I to the French Reformed Synod of Privas in 1612, urging them to drop the controversy between Pierre Du Moulin and Daniel Tilenus (who later sided with the Arminians) concerning the imputation of Christ’s active obedience. While we believe that experience has proven James wrong on this subject, we publish this translation of his letter for reasons of historical interest:

The advice of the most Gracious Prince, James, King of great Britain, for the quieting and composing the ensuing Controversy.

God made man upright, saith Solomon, but he found out many inventions: the truth whereof hence appears, that there daily grow such infinite controversies which seem to tend to no other end, then to disturb the peace of the Church. Among which this late question sprung up within these forty years, which the Church of God knew not of for 1460 years and sustained thereby no detriment, but now hath been eagerly argued between two most learned men, may be ranked; whether the passive obedience of Christ, whereby he laid down his life for his sheep by the special command of his Father, be only imputed to us for righteousness, or together with the passive the active also whereby he rendered himself obedient to the law.

This question, and those that necessarily arise from it, (a glimpse whereof we may see in the propositions of Molinaeus [Pierre Du Moulin], and the oppositions of [Daniel] Tilenus) we have no mind either in general to discuss, or in particular to scale. But out of those things which we have read ourselves, or heard from others in our presence, we will give such advice as we think will not mis-beseem the Defender of the faith.

And that is this: to wit, that this question be altogether buried with those that depend upon it, and be left in the grave with the napkin and the linen cloths wherein the body of Christ was wrapt, especially by them who profess themselves to be risen with Christ: that, all impediments being removed, we may all grow unto a perfect man in Christ Jesus: lest peradventure by too much wrangling we seem to cut in two the living child, which the tender-hearted mother would not endure; or divide the seamless coat of Christ, which the cruel soldier would not suffer.

This is the substance of what we shall advise: the reason whereof is, because it is a question altogether new, and not necessary, unheard of in former ages, not determined in any Council, not handled by the fathers not disputed in the schools. Away with it therefore. Moreover, if both parties now contesting would either stand to the judgements of most learned Divines alleged by both sides, or would test satisfied in the determinations of the churches urged by both, there needed no other Arbitrator; seeing they themselves, as appears by their writings, agree of their own accord, and have already brought it to an happy issue.

Therefore we exhort and friendly advise you that you suffer not these controversies to spread any further: above all, that you keep from the press, and add not fuel to this fire by polemical tractates.

Lastly, that there be faithful silence on both sides: seeing they tend not to edification, nor serve to any other purpose then to distract men’s minds otherwise consenting in all chief points of faith. To whom, if ever, especially in these days perfect concord is most necessary. Let them therefore remember that they ought rather to strive to preserve charity then to gain victory according to that of the Apostle; endeavouring to keep the unity of the spirit in the bond of peace; and not to prefer their private glory before the public good of the Church.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a27f86e030" data-kw="">
<blockquote><p>We have seen heretofore, that Eliu intending to rebuke Job, protested that he himself was a mortal man as Job was, to the end he should not complain that he was handled with too high a power. And so he showed that God’s will was to win him by reason and gentleness, according also as he deals towards us. For he bears with us, making his word to be preached to us by men like ourselves, so as we may come the more familiarly to hear things that he tells us, and the doctrine is chewed and put into our mouths. We see then that God pities us, when he appoints men to be the ministers of his word, and to teach us in his name and authority. For he knows our ability, and that as much as we are feeble, we should out of hand be swallowed up by his majesty, and overwhelmed with his glory. And that is the cause why he stoops down to our lowness, instructing us by the means of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Job</cite>, trans. Arthur Golding (London, 1574), The 147th Sermon in Job, the 1st upon chapter 38. Spelling and vocabulary lightly modernized.</span></figcaption>

</figure><figure class="quote" id="q-b7b3b35434" data-kw="">
<blockquote><p>By ‘works’ here [Rev. 20:12-13] are we judged and justified, and not by faith only, as also James 2:24 testifies, meaning hereby that of lively faith and of the good works that follow thereupon man is justified, and not of that dead faith that is by itself alone, without any good works: otherwise were the words of Paul (Rom. 3:28) express contrary to this text, and to James; for, says Paul, ‘We are justified by faith, without the works of the Law,’ that is to say, not without good works whatsoever, but meaning that we are justified by lively faith with such small good works as our weak nature will suffer that faith to produce, although it be without the precise works that the Law requires: and for confirmation of this interpretation, and union of these texts, ye shall find both James and Paul agree in diverse places, that faith without works is a dead faith, and serves nothing to justification. And again, they agree both that all works (how good soever they seem) that proceed not from faith, are evil. And so it is all one to say with Saint Paul, We are justified by fruitful faith, or faith that produces good works, although not the works that the Law requires, or to say with James, and here with Saint John, we are justified by faithful works, seeing a working faith and faithful works are inseparable, and none can have the one without the other. So for conclusion, these works, by the which here we are judged, are to be esteemed good or evil, not in themselves, or insofar as they satisfy the Law (for so were all works evil and imperfect), but insofar forth as they have or want faith adjoined with them, they are accounted good or evil only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-napier.html">John Napier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Plain Discovery of the Whole Revelation of St. John</cite>, … (Edinburgh: Waldegrave, 1593), ch. 20, pp. 242-43 Napier (1550-1617) was a Scottish mathematician (who discovered logariths), physicist and astronomer in the reformed tradition.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

perfect%29%2C+but+insofar+forth+as+they+have+or+want+faith+adjoined+with+them%2C+they+are+accounted+good+or+evil+only.%E2%80%9D%0A%0A%E2%80%94+John+Napier%2C+A+Plain+Discovery+of+the+Whole+Revelation+of+St.+John%E2%80%A6+%28Edinburgh%3A+Waldegrave%2C+1593%29%2C+ch.+20%2C+pp.+242-43+Napier+%281550-1617%29+was+a+Scottish+mathematician+%28who+discovered+logariths%29%2C+physicist+and+astronomer+in+the+reformed+tradition.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb7b3b35434.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b7b3b35434.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=By%20%E2%80%98works%E2%80%99%20here%20%5BRev.%2020%3A12%2D13%5D%20are,are%20accounted%20good%20or%20evil%20only&amp;text=By%20%E2%80%98works%E2%80%99%20here%20%5BRev.%2020%3A12%2D13%5D%20are%20we%20judged&amp;text=them%2C%20they%20are%20accounted%20good%20or%20evil%20only" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-744915c510" data-kw="">
<blockquote><p>But now comes a greater question: If by justification our sins be forgiven us, what sins are forgiven I pray? sins past, or sins to come? We are taught that in the instant of justification all our sins past and to come are remitted; which is in my mind an unsound doctrine: for if we look narrowly into it, we shall find that in propriety of speech, remission of sins has relation to that which is past; it’s said therefore, Rom. 3:25: ‘Whom God hath set forth to be a propitiation through faith in his blood, to declare his righteousness for the remission of sins that are past through the forbearance of God.’ And remission of sins has relation to those that are past, as appears by inevitable reason; for what is remission of sins, but sin covered? Now can a thing be covered before it be? ‘Blot out mine iniquities,’ etc. says David; can a thing be blotted out before it’s written? This is the thing [that] makes the Pope so ridiculous, that he will forgive sins for the time before they are committed; but what, do we get nothing for the time to come? Yes, yes, when the sin is past, by faith we have a new access unto God; and having risen by repentance, we get a new act, not of universal justification, but of a particular justification, from this and that particular sin. But if there be forgiveness of sins past already, and I know that I am justified, and my sins remitted: may I now pray for forgiveness of sins past? The Papists say it is active infidelity, and as absurd as to pray to God to create the world anew, or incarnate his Son again. But there is no conversion where there is no praying; and there is need of praying for the remission of sins past, and against sin for the time to come, as I shall show next time; as also consider whether there be any interruption of the act of justification by falling into great sins. There’s no man has a mind more against quirks and quillets than I; yet for the opening of these things, and staying and settling the mind, and clearing the understanding, give me leave the next time to clear these things unto you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen Sermons preached in Oxford</cite>, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 15th Sermon, on Rom. 5:1, pp. 402-3</span></figcaption>

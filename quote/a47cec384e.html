<main class="wrap"><figure class="quote" id="q-a47cec384e" data-kw="">
<blockquote><p>He grants Translations are of good use, but not in the worship of God: and if of good use elsewhere, why not there? Saint Paul exhorts the Colossians, That the Word of God might dwell in them richly, in all wisdom. They being Grecians, I take it for granted, that the most of them were not skilled in the Hebrew, the New Testament being not written, not any of it, till after Pentecost, not all of it until John a matter of sixty years after Christ’s death. This to the Colossians could not be meant of the New Testament, but of the Old.

So again, the Thessalonians, being Grecians, did not understand the Hebrew, yet they were commanded to prove all things: By what? why by the Scriptures, and this was the Old Testament which, they understanding not (the Hebrew) then it cannot but be meant of the translation.

This Conclusion I think is clear, sith the Churches of the Gentiles were commanded to read Moses and the Prophets, and read them they could not but in a translation; therefore translations are commanded by God, as an Ordinance and constitution of Heaven itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-capel.html">Richard Capel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Capel’s remains being an useful appendix to his excellent Treatise of tentations, concerning the translations of the Holy Scriptures: left written with his own hand. By that incomparably learned and judicious divine, Mr. Richard Capel, sometimes fellow of Magdalen-College in Oxford; with a preface p</cite>, (London: John Bartlet, 1658), pp 48-50.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1724005e8a" data-kw="">
<blockquote><p>The devil is a bewitcher who deceives and ensnares the minds of people by his spells and delusions, which seem to shine with what is right and good, so that they will accept false doctrine in the place of sound teaching, false worship instead of true worship, wrong interpretations of words instead of true ones, false ways of justification for true ones. False teachers are also bewitchers who under the guidance of Satan and the pretext and appearance of true godliness deceive and ensnare the minds of people in the same way. False doctrine is bewitching doctrine, which appears in the guise of the truth, and so on.

Faced with these bewitching and subtle deceptions stirred up by the tricks of the devil, we need the greatest Christian wisdom, because otherwise it is very easy to be misled by them. Just look at the papacy, which has arisen by means of such bewitching and subtle deceptions and has now spread all over the place. Moreover, since the devil and false teachers operate by means of enchantments and delusions under the guise and appearance of true godliness, nothing could be easier than to be led astray by them. Heretics always use the Bible and Scripture to deceive people by distorting the true meaning, understanding and judgment of spiritual things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus-sarcerius.html">Erasmus Sarcerius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes</cite>, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 86.</span></figcaption>

</figure><figure class="quote" id="q-ffdc594ac6" data-kw="">
<blockquote><p>It has sometimes been said that George Gillespie taught a regulative principle of civil government. This notion seems to be based on a confusion with regard to his views on civil punishment and his theology of the state more generally. The Libertarian Theologians/American Theonomists have tended to divorce the former from the latter; as a result of this methodological error, they think they can cite Gillespie as one of their own. This conclusion appears to be misguided, as a fuller reading of Gillespie’s writings indicates that he held the standard Reformed position that the civil magistrate is to uphold both tables of law (positively and negatively), but is not bound by a “regulative principle” in the same way that the church is.

There is no question that in Wholesome Severity, Gillespie was adamant that capital punishment was tightly regulated by scripture. If God commands the magistrate to slay murderers, he cannot substitute the divinely-appointed penalty for a £5 fine under the pretext that he is still upholding the sixth commandment. However, it is a mistake to assume that just because Gillespie thought capital punishment was strictly regulated by scripture that he thus reasoned that all aspects of civil government were likewise so strictly regulated. In Aaron’s Rod Blossoming, for example, Gillespie explicitly denies any notion of a regulative principle of civil government by contrasting presbyterial and magisterial power:

The presbyterial government hath no such liberty nor arbitrariness, as civil or military government hath, there being in all civil or temporal affairs a great deal of latitude left to those who manage the same, so that they command nor act against the word of God. But presbyterial government is tied up to the rules of Scripture, in all such particulars as are properly spiritual and proper to the church, though, in other particulars, occasional circumstances of times, places, accommodations, and the like, the same light of nature and reason guideth both church and state; yet in things properly spiritual and ecclesiastical, there is not near so much latitude left to the presbytery, as there is in civil affairs to the magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s rod blossoming; or, the divine ordinance of church government vindicated</cite>, (1646; Edinburgh, 1844), p. 84.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

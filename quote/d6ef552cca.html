<main class="wrap"><figure class="quote" id="q-d6ef552cca" data-kw="">
<blockquote><p>Whether may that baptism be allowed which is administered by heretics or Papists? If it be meant of such heretics as deny the principles of heavenly doctrine and utterly corrupt the essential form of baptism (as the Arians, Samosatians, Manichaeans and Macedonians) which are not sincere in the doctrine of the Trinity, baptizing so in the name of the Father, of the Son and of the Holy Ghost, that they deny nevertheless that the Son and Holy Ghost are coeternal, coessential and of equal honor with the Father, or that the Son of God did truly assume the human nature; then such baptism is not to be ratified, but to be accursed. For the essential form being once taken away, the matter itself is also taken away. And therefore it is to be thought that such are not so much to be rebaptized, but as that indeed they should rather be first consecrated with true baptism, who being converted to the knowledge of the truth, desire to be engrafted into the orthodox Church. And this agrees with the decree of the Nicene Council. But we must judge otherwise of the baptism of some other heretics: as the Novatians and Donatists, who delivered the true doctrine of the Trinity, or of Papists (who are out of the way of truth in some part of doctrine, and who possess the place of pastors and use the public ministery, either by common error, by long sufferance or by force, though they be not to be accounted as truly called). Wherein, although there be many things needless and superstitious, yet still Christ is retained and held, at least in title, to be the matter itself, the chief head and essential form of the institution, and the native meaning (without idolatry) of the words of baptism, “I baptize thee in the name of the Father, and of the Son and of the Holy Ghost,” is retained. Moreover it pleased God in mercy to conserve a remnant of his Church in the midst of Popery itself, even as the Israelites continued the use of circumcision though they embraced a false and impious service of God; and the vows are made in the name of Christ and not of Antichrist, or of any idol. Therefore that baptism is not void, but of value and force: for it is the ministry of those person, but of the Church as yet covered or hidden in Popery. They, I grant, did sprinkle the head or body, but Christ baptized inwardly. And therefore such baptism [is] neither to be annihilated, neither does it require Anabaptistical rebaptizing. But, forasmuch as they teach wickedly in other matters, they give just cause why the faithful should necessarily depart from them, as it is written, 1 John 5:21, “Flee idols.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucan.html">William Bucan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion</cite>, pp. 704-6, 714, 738-39</span></figcaption>

<blockquote><p>IV. From this concord sought and sometimes achieved by the Reformed with the Churches of the Augsburg Confession, Roman Catholic scholars infer and believe that the Reformed can and should also unite with the Roman Church and not reject its communion. As if, in their view, there were no reason to secede from the Roman Church more than from the Churches of the Augsburg Confession, with which they also have significant controversies. Therefore, it will be useful to explain the reason for this distinction and to show why Protestants, despite the controversies between them, can and should seek unity among themselves, while such a union with the Roman Church is neither lawful nor possible.</p></blockquote>

<blockquote><p>4. [John] Robinson [a Separatist] and our [Independent] Brethren acknowledge that the Church of Rome hath true baptism, for ‘they retain the essential causes of baptism, even as the vessels of the Lord’s house profaned in Babylon may be carried back to the Temple, but if these vessels were broken and mingled with brass and iron, and cast in another mold, they could not obtain their former place in the Temple. Baptism is a vessel profaned in Babel, but not broken; but the ministry and priesthood of Rome is like the new melted and mingled vessel, and essentially degenerated from the office of pastorship.’ But I answer, [1.] if baptism be valid in Rome so are the ministers baptizers, for if the ministers and priests be essentially no ministers, the baptism administrated by the Romish priests is no ministry, and [that would be] all one as [if it were] administrated by midwives and private persons, who therefore cannot administrate the sacraments validly in the essential causes, because they are essentially no ministers. If therefore Robinson will have the Romish priesthood essentially no ministry, by that same reason he must say, baptism administrated by Romish priests is no baptism, the contrary whereof he confesses: otherwise he must say baptism administrated, a non habente potestatem [by one not having the power], even by women and private men, is valid, and cannot be but esteemed lawful in the substance of the act. 2. These have a ministry essentially entire who have power under Christ to preach the Gospel and administrate the sacraments, Mt. 28:19. The Romish priests have this, and are called to this by the Church. … I answer, [1.] England may well separate from Rome everting the fundamental parts of faith, and not separate from Rome’s baptism, or ministry, in so far, as they be essentially the ordinances of Christ… 2. A ministry true in the essence may make a Church true, insofar; but because of many other substantial corruptions in Rome, it is a Church which we ought to forsake.</p></blockquote>

</figure><figure class="quote" id="q-3548a0cd40" data-kw="">
<blockquote><p>Concerning the substance of Christian religion we confess that it is also amongst them [Romanists], but not pure, nor separated not only from chaff and straw, that is, from tolerable abuses, but neither from the venom and poison of false doctrine… It is true that the Church of Rome teaches that there is one God, Father, Son, and Holy Ghost, that for the redemption of mankind, the Son has taken to Himself the nature of man, and in it has expiated our sins by his death, that He was buried, raised from the dead, taken up into heaven, sitting at the right hand of God Almighty: That the Holy Ghost sanctifies us, that there is a Church, a communion of saints, a remission of sins, a resurrection of the flesh, and a life everlasting, that by faith we must rely upon the mercy of God, that by hope we must expect the accomplishment of his promises, by charity love Him. This is indeed the substance of Christian religion which continues so far as the doctrine and outward profession of it [is] in the Church of Rome, in this respect we have not forsaken her, but these considerations make us leave her the title of a Church, to which so far we will always be joined. But what is it that has not been added to corrupt this truth? what strange doctrines have been invented to obscure it? What heresies? what idolatry? what gross sacrilege vent they under the protection of this truth which they profess. These are the causes of our separation from them, if amongst them we could haue enioyed the substance of true religion, without defiling us with their superstition, we had tarried with them still. … …so before the Lord had sounded us a loud summons with his trumpet, ‘Come out of Babylon my people,’ He sustained and supported his people in the midst of Babylon; it was not at that time a sin, but a captivity to abide in it. But for any to abide, or linger in it after the publishing of this summons, it is a sure testimony, that they live not in it unwillingly, but with delight, and that, at least outwardly, they partake of her sins, and so may justly partake of her plagues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Examination of those Plausible Appearances which seem most to commend the Romish Church, and to Prejudice the Reformed… (Oxford, 1626), ch. 37, ‘In what sense we yield that the Church of Rome has the substance of true religion, and how she ceases not for all that to be a false Chuch’</cite>, pp. 147-50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“Concerning the substance of Christian religion we confess that it is also amongst them [Romanists], but not pure, nor separated not only from chaff and straw, that is, from tolerable abuses, but neither from the venom and poison of false doctrine… It is true that the Church of Rome teaches that there is one God, Father, Son, and Holy Ghost, that for the redemption of mankind, the Son has taken to Himself the nature of man, and in it has expiated our sins by his death, that He was buried, raised from the dead, taken up into heaven, sitting at the right hand of God Almighty: That the Holy Ghost sanctifies us, that there is a Church, a communion of saints, a remission of sins, a resurrection of the flesh, and a life everlasting, that by faith we must rely upon the mercy of God, that by hope we must expect the accomplishment of his promises, by charity love Him. This is indeed the substance of Christian religion which continues so far as the doctrine and outward profession of it [is] in the Church of Rome, in this respect we have not forsaken her, but these considerations make us leave her the title of a Church, to which so far we will always be joined. But what is it that has not been added to corrupt this truth? what strange doctrines have been invented to obscure it? What heresies? what idolatry? what gross sacrilege vent they under the protection of this truth which they profess. These are the causes of our separation from them, if amongst them we could haue enioyed the substance of true religion, without defiling us with their superstition, we had tarried with them still. … …so before the Lord had sounded us a loud summons with his trumpet, ‘Come out of Babylon my people,’ He sustained and supported his people in the midst of Babylon; it was not at that time a sin, but a captivity to abide in it. But for any to abide, or linger in it after the publishing of this summons, it is a sure testimony, that they live not in it unwillingly, but with delight, and that, at least outwardly, they partake of her sins, and so may justly partake of her plagues.”

— John Cameron, An Examination of those Plausible Appearances which seem most to commend the Romish Church, and to Prejudice the Reformed… (Oxford, 1626), ch. 37, ‘In what sense we yield that the Church of Rome has the substance of true religion, and how she ceases not for all that to be a false Chuch’, pp. 147-50">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CConcerning+the+substance+of+Christian+religion+we+confess+that+it+is+also+amongst+them+%5BRomanists%5D%2C+but+not+pure%2C+nor+separated+not+only+from+chaff+and+straw%2C+that+is%2C+from+tolerable+abuses%2C+but+neither+from+the+venom+and+poison+of+false+doctrine%E2%80%A6+It+is+true+that+the+Church+of+Rome+teaches+that+there+is+one+God%2C+Father%2C+Son%2C+and+Holy+Ghost%2C+that+for+the+redemption+of+mankind%2C+the+Son+has+taken+to+Himself+the+nature+of+man%2C+and+in+it+has+expiated+our+sins+by+his+death%2C+that+He+was+buried%2C+raised+from+the+dead%2C+taken+up+into+heaven%2C+sitting+at+the+right+hand+of+God+Almighty%3A+That+the+Holy+Ghost+sanctifies+us%2C+that+there+is+a+Church%2C+a+communion+of+saints%2C+a+remission+of+sins%2C+a+resurrection+of+the+flesh%2C+and+a+life+everlasting%2C+that+by+faith+we+must+rely+upon+the+mercy+of+God%2C+that+by+hope+we+must+expect+the+accomplishment+of+his+promises%2C+by+charity+love+Him.+This+is+indeed+the+substance+of+Christian+religion+which+continues+so+far+as+the+doctrine+and+outward+profession+of+it+%5Bis%5D+in+the+Church+of+Rome%2C+in+this+respect+we+have+not+forsaken+her%2C+but+these+considerations+make+us+leave+her+the+title+of+a+Church%2C+to+which+so+far+we+will+always+be+joined.+But+what+is+it+that+has+not+been+added+to+corrupt+this+truth%3F+what+strange+doctrines+have+been+invented+to+obscure+it%3F+What+heresies%3F+what+idolatry%3F+what+gross+sacrilege+vent+they+under+the+protection+of+this+truth+which+they+profess.+These+are+the+causes+of+our+separation+from+them%2C+if+amongst+them+we+could+haue+enioyed+the+substance+of+true+religion%2C+without+defiling+us+with+their+superstition%2C+we+had+tarried+with+them+still.+%E2%80%A6+%E2%80%A6so+before+the+Lord+had+sounded+us+a+loud+summons+with+his+trumpet%2C+%E2%80%98Come+out+of+Babylon+my+people%2C%E2%80%99+He+sustained+and+supported+his+people+in+the+midst+of+Babylon%3B+it+was+not+at+that+time+a+sin%2C+but+a+captivity+to+abide+in+it.+But+for+any+to+abide%2C+or+linger+in+it+after+the+publishing+of+this+summons%2C+it+is+a+sure+testimony%2C+that+they+live+not+in+it+unwillingly%2C+but+with+delight%2C+and+that%2C+at+least+outwardly%2C+they+partake+of+her+sins%2C+and+so+may+justly+partake+of+her+plagues.%E2%80%9D%0A%0A%E2%80%94+John+Cameron%2C+An+Examination+of+those+Plausible+Appearances+which+seem+most+to+commend+the+Romish+Church%2C+and+to+Prejudice+the+Reformed%E2%80%A6+%28Oxford%2C+1626%29%2C+ch.+37%2C+%E2%80%98In+what+sense+we+yield+that+the+Church+of+Rome+has+the+substance+of+true+religion%2C+and+how+she+ceases+not+for+all+that+to+be+a+false+Chuch%E2%80%99%2C+pp.+147-50&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3548a0cd40.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3548a0cd40.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/is-roman-catholic-baptism-valid/#:~:text=Concerning%20the%20substance%20of%20Christian%20religion,may%20justly%20partake%20of%20her%20plagues." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[Francis] Junius [the elder]… in his book Of the Church… his words are (pp. 60-61): ‘Ecclesia multis seculis fuit, cum Papatus non esset; accessit ei Papatus contingenter, et sic ab ea separabilis, ut hoc etiam tempore Ecclesiae sint ubi Papatus non est, et sine Papatu deinceps futurae sint. Papatus igitur non est Ecclesia, sed in Ecclesia est adnatum malum, pestis, hydrops, gangraena in corpore, vitae atque saluti ejus insidians, ideoque succum vitalem salutaremque Ecclesiae depascens quam infestissime.’ ‘The Church of God was many ages when there was no Papacy at all; as at this day also there are Churches where there is no Papacy: and will be hereafter without the Papacy. The Papacy therefore is not the Church, but a disease or botch grown to or in the Church, a plague, a dropsy, a gangrene in the body, endangering the health, feeding upon and infesting the healthful moisture and vital blood of the Church.’ And within a few lines after in the same page follow the words… ‘The Papal Church’ (says Franciscus Junius, neither Papist, nor Arminian) ‘qua id habet in se quod ad Ecclesiae definitionem pertinet, est Ecclesia.’ ‘As it has that in it which belongs to the definition of a Church, is a Church.’… ‘Quod vero habet in se adnatum malum, quod Papalitatem dicimus, eo respectu Ecclesia non est, sed vitiata atque corrupta Ecclesia et ad interitum tendens;’ ‘But the Church of Rome as it has a disease or evil grown to it, which we call the Papacy, in that respect it is not the Church, but a vitiate and corrupt Church, and tending to ruin.’ The meaning of the whole sentence of Junius is clear enough for us… to wit, that the Church of Rome, so far as it is Protestant, and holds some fundamental truths agreeable to the Scriptures, is a Church: but as it is Popish and adds many errors to those truths, consequently subverting those very truths it holds, it is no Church. Which I thus prove: No Spouse or true Church of Christ is in part or in whole that Antichrist, or Whore of Babylon: The present church of Rome, as it is taken for the Papacy or Popish state thereof, is in part… or in whole (as many pillars of our Church have taught) that Antichrist, or Whore of Babylon; Therefore the present Church of Rome, as it is taken for the Papacy or Popish state thereof, is no Spouse nor true Church of Christ.</p></blockquote>

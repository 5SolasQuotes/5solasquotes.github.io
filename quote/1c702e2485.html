<main class="wrap"><figure class="quote" id="q-1c702e2485" data-kw="">
<blockquote><p>At the time of the union between the Synod of Ulster and the Seceders in 1840, several Secession ministers remained outside owing to some scruples about what was taking place. One of their scruples was the fact that the new Presbyterian Church in Ireland did not require its members to adhere to the Westminster Confession, only its officers. In response, the General Assembly passed the following resolutions:

The Committee appointed at last Assembly, to confer with certain dissentient brethren, reported, – That certain brethren who have hitherto abstained from entering into the United Church, have signified their willingness to become members, on the Assembly now affirming resolutions, which the Committee have unanimously agreed to recommend for their adoption.

The following resolutions being read and considered, were unanimously adopted:-

I. That a profession of belief, conformable to the Westminster Confession of Faith, be required from intrants to communion, and from parents at the baptism of their children.

II. That the erroneous and immoral be debarred from sealing ordinances.

III. That communicants be admitted to the Lord’s Table by tokens, distributed only by the ministers and elders conjointly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/general-assembly-of-the-presbyterian-church-in-ireland.html">General Assembly of the Presbyterian Church in Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Minutes of the General Assembly of the Presbyterian Church in Ireland. Belfast, July, 1841 (Belfast, 1841), i, p. 53.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>These peculiar and distinctive principles of modern Independents or Congregationalists were not explicitly professed, and, of course, were neither formally defended nor assailed in the early church. As a subject of controversial discussion, they are wholly of modern origin. They seem to have been first publicly and distinctly broached, as exhibiting the scriptural views of the constitution and government of the church, by J.B. Morellius or Morely, who was connected with the Reformed Church of France, and whose work on the subject, entitled, ‘Traicte de la Discipline et Police Chretienne,’ was published at Lyons in 1561, and was soon thereafter condemned by the National Synod at Orleans in 1562, and again at Nismes in 1572. They were embraced also by [Peter] Ramus, the celebrated philosopher, who was killed in the massacre of St. Bartholomew; but they made no permanent impression upon the French Protestants. It was not till about twenty or thirty years later, near the end of the sixteenth century, that these views were brought out and practically acted upon in this country, by some persons… who were known for a time under the name of Brownists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, 2.548</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

<blockquote><p>3. …But must we separate from all sinners? or from all that sin in their entrance into the ministry? And why not as well from all other sins of equal greatness? Do you warn all others not to hear yourself? Or do you yet take yourself to be no sinner? or no great sinner? What if the presbyterians think the Independents’ way of entrance to be undue? And the Independents think so of the presbyterians? And both of the Anabaptists [baptists]? and the Anabaptists of them both, etc. Must they all therefore warn all men not to hear each other? Mr. [Philip] Nye [an Independent] thought not so, when he wrote for such hearing public ministers. Is it fit for the author [Edward Bagshaw] of two books of calumnies and bold untruths, besides false doctrines and other crimes, to say ‘Their sin is great, etc. and therefore we both forbear ourselves and warn all others not to hear them?’ 4. Most that I speak of did enter into the ministry in the presbyterian or Independent way heretofore, and do but continue on the terms which I dissent from as well as you. How then can you say they unduly enter into the ministry? 5… 4. But suppose that you are the wiser man, and that those that are more ignorant do mistakingly think that canonical obedience and the oath (with that of Supremacy) to be their duty, and no renouncing of their Christian liberty: Is it not false doctrine to conclude that Christ never sent out any that had as great a sin as this? what none? when he sent out Judas himself, who was first a thief and after a traitor? Do you think then that Christ ever sent out liars, railers, furious Church-dividers, false accusers, etc.?</p></blockquote>

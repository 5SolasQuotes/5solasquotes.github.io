<main class="wrap"><figure class="quote" id="q-9c2b54c1ae" data-kw="">
<blockquote><p>Were all the promises of the covenant, made to Christ; and are they all “in him, yea, and Amen?” Then it follows, that they, in and with him, are freely offered to sinners of mankind in common, who hear the gospel. Reader, Christ and all the precious promises in him, are by Jehovah graciously offered, and in the offer, are directed to thee for thy acceptance. The authentic offer, brings them all within thy reach, and affords thee a Divine, an authoritative warrant, to come as a sinner, and to accept him, and them in him.

Come then, come as thou art; come without delay; come without looking into thy heart, or to thy life, for any good thing to recommend thee; and, upon the warrant of the free, full, and particular offer, so embrace the promises in Christ, as cordially to trust in him, for the performance of them to thy soul. Come, not on the ground of any good disposition wrought in thee, or of any good work done by thee, for these afford thee no right, but, come as a sinner, upon the warrant of the unlimited grant and call of the gospel, and trust in the Lord Jesus, for all the grace of the promise.

After thou hast begun, continue to trust in him. The believer’s turning away his eye from Christ and the covenant, is the cause, why he begins to sink under his pressures. His departing from Christ his living Redeemer, by “an evil heart of unbelief,” issues for ordinary, in his being torn asunder with a thousand anxieties. O beware of disbelieving the promise, of distrusting the grace, of a promising God; lest he measure to thee according to thy opinion of him. Since the spotless righteousness of Jesus Christ, is likewise offered to thee, and since the offer affords thee, an immediate warrant to receive it; O rely on it, for a right to the blessings promised.

Trust with assured confidence, that the promises will he fulfilled to thee, on the ground of that righteousness only, which is thine in offer; and not, on the ground of any works, which thou thyself hast done. Rely not even on thy acts of faith, for a title to the grace of the promise, but wholly on the righteousness, “revealed from faith to faith so shalt thou be an heir of promise, and shalt Christ “reign in life” eternal, “by one, Jesus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 277-78.</span></figcaption>

<blockquote><p>I answer that, There is will in God, as there is intellect: since will follows upon intellect. For as natural things have actual existence by their form, so the intellect is actually intelligent by its intelligible form. Now everything has this aptitude towards its natural form, that when it has it not, it tends towards it; and when it has it, it is at rest therein. It is the same with every natural perfection, which is a natural good. This aptitude to good in things without knowledge is called natural appetite. Whence also intellectual natures have a like aptitude as apprehended through its intelligible form; so as to rest therein when possessed, and when not possessed to seek to possess it, both of which pertain to the will. Hence in every intellectual being there is will, just as in every sensible being there is animal appetite. And so there must be will in God, since there is intellect in Him. And as His intellect is His own existence, so is His will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, pt. 1 | quest. 19 | art. 1, Whether there is will in God</span></figcaption>

<blockquote><p>Goodness according to some admits of a threefold consideration: Of nature, which is called perfection. Of manners, called holiness. Of beneficence, id est [that is], a disposition to do good to others; this is properly called benignity: ‘Thou art good and doest good,’ Ps. 119:68. Goodness is either essential or by participation. God is essentially good: He is good of Himself; He is goodness itself: the creature is good by participation, i.e. by a goodness received of God. …the peculiar affection in parents towards their children renders them propense to do them good: and the soul full of matter (like wine which has no vent) propends to pour out itself; so is the Lord affected to do good according as He has willed concerning the creature. … God, who is the increated good, communicates Himself without division, effusion, or multiplication of Himself: all that He communicates, notwithstanding, He remains infinite and the same. God were God blessed forever though He had never willed of his goodness unto any, but if He were not a God of benignity, He were not our God.</p></blockquote>

<blockquote><p>The goodness of God, on the contrary, is the loveliness, benign character, sweetness, friendliness, kindness, and generosity of God. Goodness is the very essence of God’s being, even if there were no creature to whom this could be manifested. “The good LORD pardon every one” (2 Chr.30:18); “Good and upright is the LORD: therefore will He teach sinners in the way” (Psa. 25:B); “There is none good but one, that is, God” (Mat. 19:17). From this goodness issues forth lovingkindness and an inclination to bless His creatures. This is to the astonishment of all who take note of this, which explains why David exclaims twenty-six times in Ps. 136, “For His Mercy endureth for ever.” In the following texts we read likewise. “Also unto Thee, O Lord, belongeth mercy” (Psa. 62:12); “All the paths of the LORD are mercy” (Psa. 25:10). From goodness and benevolence issues forth the doing of that which is good. “Thou art good, and doest good” (Psa. 119:68); “Rejoice the soul of Thy servant: and attend unto the voice of my supplications. For Thou Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon Thee” (Psa. 86:4, 6, 5). This goodness is of a general nature in reference to all God’s creatures, since they are His creatures. “The LORD is good to all: and His tender mercies are over all is works” (Psa. 145:9); “The earth is full of the goodness of the LORD” (Psa. 33:5); “For He maketh His sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” (Mat. 5:45). The goodness which is of a special or particular nature as it relates to God’s children is thus expressed: ‘Truly God is good to Israel, even to such as arc of a clean heart” (Psa. 73:1); “The LORD is good unto them that wait for Him, to the soul that seeketh Him” (Lam. 3:25). This goodness of God is the reason why a believer, even after many backslidings, is motivated by renewal to return unto the Lord. “The children of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17). In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).</p></blockquote>

ildren of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17). In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).”

— Wilhelmus à Brakel, The Christian’s Reasonable Service, trans. Bartel Elshout (Soli Deo Gloria, 1992), 1:122-23">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+goodness+of+God%2C+on+the+contrary%2C+is+the+loveliness%2C+benign+character%2C+sweetness%2C+friendliness%2C+kindness%2C+and+generosity+of+God.+Goodness+is+the+very+essence+of+God%E2%80%99s+being%2C+even+if+there+were+no+creature+to+whom+this+could+be+manifested.+%E2%80%9CThe+good+LORD+pardon+every+one%E2%80%9D+%282+Chr.30%3A18%29%3B+%E2%80%9CGood+and+upright+is+the+LORD%3A+therefore+will+He+teach+sinners+in+the+way%E2%80%9D+%28Psa.+25%3AB%29%3B+%E2%80%9CThere+is+none+good+but+one%2C+that+is%2C+God%E2%80%9D+%28Mat.+19%3A17%29.+From+this+goodness+issues+forth+lovingkindness+and+an+inclination+to+bless+His+creatures.+This+is+to+the+astonishment+of+all+who+take+note+of+this%2C+which+explains+why+David+exclaims+twenty-six+times+in+Ps.+136%2C+%E2%80%9CFor+His+Mercy+endureth+for+ever.%E2%80%9D+In+the+following+texts+we+read+likewise.+%E2%80%9CAlso+unto+Thee%2C+O+Lord%2C+belongeth+mercy%E2%80%9D+%28Psa.+62%3A12%29%3B+%E2%80%9CAll+the+paths+of+the+LORD+are+mercy%E2%80%9D+%28Psa.+25%3A10%29.+From+goodness+and+benevolence+issues+forth+the+doing+of+that+which+is+good.+%E2%80%9CThou+art+good%2C+and+doest+good%E2%80%9D+%28Psa.+119%3A68%29%3B+%E2%80%9CRejoice+the+soul+of+Thy+servant%3A+and+attend+unto+the+voice+of+my+supplications.+For+Thou+Lord%2C+art+good%2C+and+ready+to+forgive%3B+and+plenteous+in+mercy+unto+all+them+that+call+upon+Thee%E2%80%9D+%28Psa.+86%3A4%2C+6%2C+5%29.+This+goodness+is+of+a+general+nature+in+reference+to+all+God%E2%80%99s+creatures%2C+since+they+are+His+creatures.+%E2%80%9CThe+LORD+is+good+to+all%3A+and+His+tender+mercies+are+over+all+is+works%E2%80%9D+%28Psa.+145%3A9%29%3B+%E2%80%9CThe+earth+is+full+of+the+goodness+of+the+LORD%E2%80%9D+%28Psa.+33%3A5%29%3B+%E2%80%9CFor+He+maketh+His+sun+to+rise+on+the+evil+and+on+the+good%2C+and+sendeth+rain+on+the+just+and+on+the+unjust%E2%80%9D+%28Mat.+5%3A45%29.+The+goodness+which+is+of+a+special+or+particular+nature+as+it+relates+to+God%E2%80%99s+children+is+thus+expressed%3A+%E2%80%98Truly+God+is+good+to+Israel%2C+even+to+such+as+arc+of+a+clean+heart%E2%80%9D+%28Psa.+73%3A1%29%3B+%E2%80%9CThe+LORD+is+good+unto+them+that+wait+for+Him%2C+to+the+soul+that+seeketh+Him%E2%80%9D+%28Lam.+3%3A25%29.+This+goodness+of+God+is+the+reason+why+a+believer%2C+even+after+many+backslidings%2C+is+motivated+by+renewal+to+return+unto+the+Lord.+%E2%80%9CThe+children+of+Israel+shall+return%E2%80%A6+and+shall+fear+the+LORD+and+His+goodness%E2%80%9D+%28Hosea+3%3A5%29%3B+%E2%80%9CBut+I+have+trusted+in+Thy+mercy%E2%80%9D+%28Psa.+13%3A5%29.+This+is+why+they+call+the+Lord+%E2%80%9Cthe+God+of+my+mercy%E2%80%9D+%28Psa.+59%3A10%2C+17%29.+In+this+goodness+they+rejoice+and+this+goodness+they+magnify.+%E2%80%9CI+will+sing+of+the+mercies+of+the+LORD+for+ever%E2%80%9D+%28Psa.+89%3A1%29%3B+%E2%80%9CPraise+ye+the+LORD.+O+give+thanks+unto+the+LORD%3B+for+He+is+good%3A+for+His+mercy+endureth+for+ever%E2%80%9D+%28Psa.+106%3A1%29.%E2%80%9D%0A%0A%E2%80%94+Wilhelmus+%C3%A0+Brakel%2C+The+Christian%E2%80%99s+Reasonable+Service%2C+trans.+Bartel+Elshout+%28Soli+Deo+Gloria%2C+1992%29%2C+1%3A122-23&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca36a5eaa5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ca36a5eaa5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=The%20goodness%20of%20God%2C%20on%20the,mercy%20endureth%20for%20ever%E2%80%9D%20%28Psa.%20106%3A1&amp;text=The%20goodness%20of%20God%2C%20on%20the%20contrary%2C%20is&amp;text=for%20His%20mercy%20endureth%20for%20ever%E2%80%9D%20%28Psa.%20106%3A1" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

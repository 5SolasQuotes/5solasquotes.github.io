<main class="wrap"><figure class="quote" id="q-2e694221ee" data-kw="">
<blockquote><p>4. He [Parker] makes a distinction betwixt the case of appellation and the case de nulla administratione mala praesumpta. Though the particular eldership has proceeded aright, though it consist of able and sufficient men, and though it be in re propria [in a proper thing], yet if one think himself wronged, and so appeal, then is it made obnoxious to a higher consistory, for says Parker, as the Council of Sardis ordains, audience must not be denied to him who entreats for it. So says Zepperus, speaking of the same purpose: ‘cuivis integrum quoque sit ad superiores gradus provocare, si in inferioris gradus sententia aut decreto aliquid desideret.’ (de Pol. Eccl., bk. 3, ch. 2)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, (Edinburgh, 1641), pp. 125-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

ral knowledge of man, God, and the universe is necessary for biblical interpretation, and is a key element in a well-rounded solution to the protestant problem.</p></blockquote>

<blockquote><p>That whatsoever Law of GOD, or command of His, we find recorded in the Lawbook, in either of the volumes of God’s statute, the N. T. or the Old, remains obligatory to us, unless we can prove it to be expired, or repealed. So it is with the statute-law of this nation [England], or of any nation; What I can prove to be once enacted, I may urge as still in force, unless any one can answer me with a just proof that it is now out of date, or repealed by a latter Law.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cd99044f54" data-kw="">
<blockquote><p>…we think that some things are tolerated which should not at all be endured. We are not spending so much time on those linen vestments that we would want the progress of God’s Word to be disturbed because of them–even just a little. Yet we judge that they have acted correctly and wisely who have thrown out of their churches that whole form of dress, which is more suited to actors than to ministers of the Word, as well as other remnants of paganism. For surely they can do a great deal of harm, as experience itself has taught; and they cannot help at all. But we certainly do not count the restoring of what has been thrown out among things that are indifferent [adiaphora].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper</cite>, (1559; RHB, 2016), pp. 143-44</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b75d1598ae" data-kw="">
<blockquote><p>To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship.</p></blockquote>

</figure><figure class="quote" id="q-5aa04506f5" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), pp. 11-13</span></figcaption>

<blockquote><p>The dress of the Ministers in the English Church at Geneva [under John Knox] is a matter which is perplexing, for there is no evidence available indicating precisely what was the custom. … [John] Paullain [1517–1565, an English reformer], in his ‘Ad lectorem candidum’ (Lit. sac., P, Q) [‘To the Bright Reader’, in Liturgia Sacra, seu Ritus Ministerii in Ecclesia Peregrinorum… 1551/4], on the other hand, states quite definitely that vestments are not worn in his congregation. He urges that the New Testament does not prescribe a Minister’s apparel, and that a shepherd is not known to his sheep by his garb but by his call to them, and he thinks it sufficient that a Minister should be dressed modestly and soberly, with an absence of all pomp and arrogance. Further, he regards vestments as an incitement to superstition because of the Roman custom of blessing the garments. Thus he thought that in this as in other matters the Reformed Church should be content with the utmost simplicity. In England the Puritan party objected strenuously to all vestments. As early as 1562 request was made to Convocation ‘that the use of copes and surplices… be taken away; so that all ministers in their ministry use a grave, comely, and side-garment, as commonly they do in preaching’ and ‘that the ministers of the word and sacraments be not compelled to wear such gowns and caps, as the enemies of Christ’s gospel have chosen to be the special array of their priesthood’ ([John] Strype, Annals, Oxford ed., 1824, vol. i., pt. ii. 501). And in the same period we find the bishops enforcing the cassock and gown and forbidding the Puritan custom of preaching in what Bishop Duppa called ‘a riding or ambulatory Cloake’ (Rit. Com. Rep. ii. 577). The objections in these passages are against all gowns… Certainly [Myles] Coverdale [1488–1569] objected to all gowns, as we see by his letter to Farel in 1556: ‘Our affairs are not altered for the better, but alas! are sadly deteriorated. For it is now settled and determines… that out of doors must be worn the square cap, bands, a long gown and tippet; while the white surplice and cope are to be retained in divine service’ (Parker Soc. Zurich Letters, p. 121, Let. 50). … This brief review of the early evidence in Strasburg, Frankfort [Germany], Geneva, England and Scotland, shows that there appears to have been no practice that was agreed upon by all who followed the Calvinistic Reformation, and as regards the English Church of Geneva no accurate conjecture can be made. It is probable that the Ministers there adopted Calvin’s practice and wore the black gown, with cassock, bands, and scarf; but there can be no certainty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-maxwell.html">William Maxwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix G, ‘The Dress of the Ministers’ in John Knox’s Genevan Service Book</cite>, 1556; The Liturgical Portions of the Genevan Service Book Used by John Knox While a Minister of the English Congregation of Marian Exiles at Geneva, 1556-1559 (Edinburgh: Oliver &amp; Boyd, 1931), pp. 210-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

— William Maxwell, Appendix G, ‘The Dress of the Ministers’ in John Knox’s Genevan Service Book, 1556; The Liturgical Portions of the Genevan Service Book Used by John Knox While a Minister of the English Congregation of Marian Exiles at Geneva, 1556-1559 (Edinburgh: Oliver &amp; Boyd, 1931), pp. 210-13">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+dress+of+the+Ministers+in+the+English+Church+at+Geneva+%5Bunder+John+Knox%5D+is+a+matter+which+is+perplexing%2C+for+there+is+no+evidence+available+indicating+precisely+what+was+the+custom.+%E2%80%A6+%5BJohn%5D+Paullain+%5B1517%E2%80%931565%2C+an+English+reformer%5D%2C+in+his+%E2%80%98Ad+lectorem+candidum%E2%80%99+%28Lit.+sac.%2C+P%2C+Q%29+%5B%E2%80%98To+the+Bright+Reader%E2%80%99%2C+in+Liturgia+Sacra%2C+seu+Ritus+Ministerii+in+Ecclesia+Peregrinorum%E2%80%A6+1551%2F4%5D%2C+on+the+other+hand%2C+states+quite+definitely+that+vestments+are+not+worn+in+his+congregation.+He+urges+that+the+New+Testament+does+not+prescribe+a+Minister%E2%80%99s+apparel%2C+and+that+a+shepherd+is+not+known+to+his+sheep+by+his+garb+but+by+his+call+to+them%2C+and+he+thinks+it+sufficient+that+a+Minister+should+be+dressed+modestly+and+soberly%2C+with+an+absence+of+all+pomp+and+arrogance.+Further%2C+he+regards+vestments+as+an+incitement+to+superstition+because+of+the+Roman+custom+of+blessing+the+garments.+Thus+he+thought+that+in+this+as+in+other+matters+the+Reformed+Church+should+be+content+with+the+utmost+simplicity.+In+England+the+Puritan+party+objected+strenuously+to+all+vestments.+As+early+as+1562+request+was+made+to+Convocation+%E2%80%98that+the+use+of+copes+and+surplices%E2%80%A6+be+taken+away%3B+so+that+all+ministers+in+their+ministry+use+a+grave%2C+comely%2C+and+side-garment%2C+as+commonly+they+do+in+preaching%E2%80%99+and+%E2%80%98that+the+ministers+of+the+word+and+sacraments+be+not+compelled+to+wear+such+gowns+and+caps%2C+as+the+enemies+of+Christ%E2%80%99s+gospel+have+chosen+to+be+the+special+array+of+their+priesthood%E2%80%99+%28%5BJohn%5D+Strype%2C+Annals%2C+Oxford+ed.%2C+1824%2C+vol.+i.%2C+pt.+ii.+501%29.+And+in+the+same+period+we+find+the+bishops+enforcing+the+cassock+and+gown+and+forbidding+the+Puritan+custom+of+preaching+in+what+Bishop+Duppa+called+%E2%80%98a+riding+or+ambulatory+Cloake%E2%80%99+%28Rit.+Com.+Rep.+ii.+577%29.+The+objections+in+these+passages+are+against+all+gowns%E2%80%A6+Certainly+%5BMyles%5D+Coverdale+%5B1488%E2%80%931569%5D+objected+to+all+gowns%2C+as+we+see+by+his+letter+to+Farel+in+1556%3A+%E2%80%98Our+affairs+are+not+altered+for+the+better%2C+but+alas%21+are+sadly+deteriorated.+For+it+is+now+settled+and+determines%E2%80%A6+that+out+of+doors+must+be+worn+the+square+cap%2C+bands%2C+a+long+gown+and+tippet%3B+while+the+white+surplice+and+cope+are+to+be+retained+in+divine+service%E2%80%99+%28Parker+Soc.+Zurich+Letters%2C+p.+121%2C+Let.+50%29.+%E2%80%A6+This+brief+review+of+the+early+evidence+in+Strasburg%2C+Frankfort+%5BGermany%5D%2C+Geneva%2C+England+and+Scotland%2C+shows+that+there+appears+to+have+been+no+practice+that+was+agreed+upon+by+all+who+followed+the+Calvinistic+Reformation%2C+and+as+regards+the+English+Church+of+Geneva+no+accurate+conjecture+can+be+made.+It+is+probable+that+the+Ministers+there+adopted+Calvin%E2%80%99s+practice+and+wore+the+black+gown%2C+with+cassock%2C+bands%2C+and+scarf%3B+but+there+can+be+no+certainty.%E2%80%9D%0A%0A%E2%80%94+William+Maxwell%2C+Appendix+G%2C+%E2%80%98The+Dress+of+the+Ministers%E2%80%99+in+John+Knox%E2%80%99s+Genevan+Service+Book%2C+1556%3B+The+Liturgical+Portions+of+the+Genevan+Service+Book+Used+by+John+Knox+While+a+Minister+of+the+English+Congregation+of+Marian+Exiles+at+Geneva%2C+1556-1559+%28Edinburgh%3A+Oliver+%26+Boyd%2C+1931%29%2C+pp.+210-13&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fda8631a246.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/da8631a246.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-black-genevan-gowns/#:~:text=The%20dress%20of%20the%20Ministers%20in,but%20there%20can%20be%20no%20certainty&amp;text=The%20dress%20of%20the%20Ministers%20in%20the%20English&amp;text=and%20scarf%3B%20but%20there%20can%20be%20no%20certainty" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d2cc4b9b6c" data-kw="">
<blockquote><p>Thirdly, all pride and vanity of garments are to be shunned and all those ornaments which do rather beseem the profane theaters of the gentiles than the sacred temples of Christians and which rather tend to delight the flesh than to edify the spirit: but all things must be done in the churches with most high reverence and modesty, as in the very sight of God and his angels. And albeit concerning the fashion of garments which ministers ought publicly to wear, either in their ministery or out of it, we do not think it a matter to be so stood upon that for it the peace of the church ought to be troubled; yet where they come nearest to the simplicity of the apostles, there we judge the church rather to be approved.</p></blockquote>

<blockquote><p>§IV. It [sanctification] is distinguished from regeneration. For regeneration, strictly taken, signifies the beginning of the spiritual life; but sanctification, the progress and continuation of the spiritual life, made through the habits of the spiritual virtues, by which the faithful are gradually led to perfection, although many take regeneration in a broader sense as a synonym for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI (Frankfurt: Zeitler, 1709), p. 2 Holtzfus (1659-1717) was a German, reformed professor of philosophy and theology at Frankfurt.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9dbf374903" data-kw="">
<blockquote><p>‘Born again’. Being turned unto God by true faith and repentance: A metaphorical term. We are born again four ways: 1. Sacramentally, by Baptism. 2. Spiritually, by the Word. 3. Corporally, in the Resurrection. 4. Eternally, in our Glorification. Question: But why is our repentance likened to a new birth? Answer: [1] To distinguish true repentance, from that which is false and fained: for it imports five differences. … 2. That in true repentance there is a total change in the whole nature of man: He has grace in every part; a new mind and a new heart, a new memory, and a new conscience, a new language, and a new carriage both to God and man: for birth is the producing of all essential parts of man. 3. That in true repentance there is the pain of contrition, a broken spirit, the throws and pains of travail, there is true godly sorrow and grief in the birth of grace. 4. That there is in true repentance a daily hunger and thirst after the sincere milk of the Word, 1 Pet. 2:2. 5. That in the things of God’s Kingdom there is new life, and sense, and feeling, and motion. Secondly, to show the privilege of the penitent: for it signifies he gets more by his new birth than any child in nature can do by pleading his birthright: For if in repentance we be born unto God, then it shows: 1. That we have received power to be the sons of God, Jn. 1:2. 2. That with our adoption we enjoy the privileges of sons. 1. The favor of God, as a father. 2. The care of God to maintain us, Mt. 6:33. 3. The pardon of God in saving us from condemnation, Rom. 8:1. 4. The portion of God, even the inheritance which God gives as a Father, which is spoken of Rom. 8:17; Gal. 4:7. The use should be twofold: 1. That wee try ourselves carefully in the businesse of our repentance by the former signes:* 1.2 and secondly, that we comfort ourselves in the privileges of our new birth, rejoicing in our portion, and the favor of our heavenly Father. And thus of the reason of the phrase. Concerning the new birth, here we have occasion to consider of two things: 1. That it is needful often to be remembered of the doctrine of regeneration: the apostle having spoken of it before, falls upon it here again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (London: Flesher, 1637), on 1 Peter 1:23, pp. 184-85</span></figcaption>

<blockquote><p>That other [term] of ‘regeneration’, I take to be all one with spiritual life, taken in the largest sense; which life, according to the Scriptures, I distinguish into initial and actual. For as in the natural, sometimes the soul, which is usually called ‘the form by which’, and sometimes the esse, the ‘being’ itself of such or such a creature animated by his soul, is put for life, as that learned [Jerome] Zanchi well observes (Of the Nature of God, bk. 2, ch. 5, question 1): so is it in the spiritual life whereof we are now to treat. And upon this foundation it is that we rightly build our present distinction, which has clear footing also in the sacred volumes of eternal truth. 1. Initial (which we may also term seminal or potential life), I call that which consists in participation of the Spirit of Christ, as the form of this spiritual life: the Spirit being the first principle of regeneration, by whom the first seed and foundation thereof is laid in a Christian. And this is life as it were in the root, like unto the first principles of reason laid up in the rational soul, before it has actually enabled the body to move and act rationally. And of this, says acute [Francis] Junius (Of Paedobaptism, thesis 7), our Savior spake in Jn. 3; more clearly to our purpose is that of the apostle, Rom. 8:10, “The Spirit is life, because of righteousness,” where the Spirit, which is the cause of life, is put for life itself: and by ‘the Spirit’ is meant not the reasonable soul, but the Holy Ghost; if Calvin (and before him Chrysostom and Ambrose, and after him Peter Martyr) hit right in the exposition of it,¹ whereof for my part (after serious pensitation of all that any have said to carry it to another sense) I make no question. ¹ Galatians, in location: Vocabulo spiritus ne animam nostram intelligas, sed regenerationis spiritum quem vitam appellat Paulus. [By the term ‘spirit’, understand not our soul, but the Spirit of regeneration, which Paul calls life.] 2. Actual, I call that which consists properly in the very spiritual being itself actually produced in a Christian, by the Spirit bringing him forth a new man in Christ, in the ordinary course of regeneration of such as live to years, whereby he is enabled actually to believe, repent, etc. Rom. 6:11, “Likewise ye, reckon yourselves to be dead indeed unto sin: but alive unto God through Jesus Christ our Lord.” So Gal. 2:20 and elsewhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cornelius-burges.html">Cornelius Burges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Baptismal Regeneration of Elect Infants Professed by the Church of England</cite>, ... (Oxford: Curteyn, 1629), ch. 2, pp. 14-16</span></figcaption>

<blockquote><p>But the persons to whom we refer seem to think that nothing is done towards the salvation of men, but at the moment of their conversion, and that every good effect must be at once manifest. Perhaps some one may infer that we believe in a gradual regeneration, and that special grace differs from common, only in degree; but such an inference would be utterly false, for there can be no medium between life and death; but we do profess to believe and maintain, that there is a gradual preparation, by common grace, for regeneration, which may be going on from childhood to mature age; and we believe that, as no mortal can tell the precise moment, when the soul is vivified, and as the principle of spiritual life in its commencement is often very feeble, so it is an undoubted truth, that the developement of the new life in the soul may be, and often is, very slow; and not unfrequently that which is called conversion is nothing else but a more sensible and vigorous exercise of a principle which has long existed. Just as the seed under ground may have life, and may be struggling to come forth to open day; but it may meet with various obstructions and unfavourable circumstances which retard its growth. At length, however, it makes its way through the earth, and expands its leaves to the light and the air, and begins to drink in from every source that nutriment which it needs. No one supposes, however, that the moment of its appearing above ground is the commencement of its life; but this mistake is often made in the analogous case of the regeneration of the soul. The first clear and lively exercise of faith and repentance is made the date of the origin of spiritual life, whereas it existed in a feeble state, and put forth obscure acts long before.</p></blockquote>

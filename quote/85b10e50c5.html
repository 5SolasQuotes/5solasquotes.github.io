<main class="wrap"><figure class="quote" id="q-85b10e50c5" data-kw="">
<blockquote><p>A soule acquainted with the Gospell, knowes that there is no Property of Christ rendred more glorious therein, than that of his patience; That he should beare with so many unkindnesses, so many causelesse breaches, so many neglects of his love, so many affronts done to his Grace, so many violations of ingagements, as he doth; it manifests his Gospell to be not only the word of his Grace, but also of his patience. He suffers also from them, in all the reproaches, they bring upon his name and wayes: and he suffers in them; for in all their Afflictions, he is afflicted.</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Of Temptation</cite>, Oxford, 1658, ch. 8, p. 145</figcaption>
<div class="meta"><a class="tag" href="../topics/the-mediator-prophet-and-king/the-mediator.html">The Mediator</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-215040d6fd" data-kw="Author of sin Justice Satan The Fall">
<blockquote><p>And just as he that wishes to punish someone by fumigating with a foul smell, sulfur and dung, does not put a foul smell into the sulfur and dung (it already is there), so God, when He punishes sins through the devil and the vessels of wrath with sins, does not put any sin into them, but it is there naturally since the fall in the devil and in men (Eph. 4; Rom. 1).</p></blockquote>
<figcaption>— <a href="../authors/synod-of-debrecen.html">Synod of Debrecen</a>, <cite>Documents of the Synod of Debrecen</cite>, 1567</figcaption>

</figure><figure class="quote" id="q-c93c333fae" data-kw="Hardening Satan Justice">
<blockquote><p>God is said to blind and to harden men not only negatively (by not enlightening and softening) and privatively (by withdrawing his grace whatever it may have been after men have abused it) and permissively (by not hindering), but also positively. Not by bringing in blindness or hardness (which is natural to man), but both objectively by presenting external objects to them which although ordained to another direction by their own nature, yet he knows will be drawn in a different way by their vice; and judicially by smiting them internally with blindness (the light which they abused being taken away or extinguished); and by loosening the reins to their lusts and delivering them up and enslaving them to Satan.</p></blockquote>
<figcaption>— <a href="../authors/francis-turretin.html">Francis Turretin</a>, <cite>Institutes of Elenctic Theology</cite>, 6.7.28</figcaption>

</figure><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</figcaption>

</figure><figure class="quote" id="q-90b2694bf6" data-kw="Sovereignty Satan">
<blockquote><p>The Lord God omnipotent reigneth. His government is exercised over inanimate matter, over the brute beasts, over the children of men, over angels good and evil, and over Satan himself. No revolving world, no shining of star, no storm, no creature moves, no actions of men, no errands of angels, no deeds of Devil—nothing in all the vast universe can come to pass otherwise than God has eternally purposed. Here is a foundation of faith. Here is a resting place for the intellect. Here is an anchor for the soul, both sure and steadfast. It is not blind fate, unbridled evil, man or Devil, but the Lord Almighty who is ruling the world, ruling it according to His own good pleasure and for His own eternal glory.</p></blockquote>
<figcaption>— <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a>, <cite>The Sovereignty of God</cite>, ch. 3, “Sovereignty of God in Administration”</figcaption>

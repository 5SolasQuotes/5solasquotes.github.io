<main class="wrap"><figure class="quote" id="q-0e3dd0c9fc" data-kw="">
<blockquote><p>Mr. Faldo at Barnet was fain many years to preach to a people that excluded singing psalms. He did what they would bear when he could not do what he would. He complied not by approbation with exclusion, for he spake against it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (RBO, 2024), p. 67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17d7cab950" data-kw="">
<blockquote><p>Our English [partially conforming] authors below will make the case for, under necessity, material cooperation with bishops, taking the oath of canonical obedience and yielding to civil patrons in the presentation of ministers to congregations (or patronage). Note that conferring with a bishop and getting the consent and recognition of a civil officer to one’s ministry¹ are not inherently sinful actions. To give further perspective to this, and what is to come, it will be proven in the next section that Church government (albeit of divine law) is not moral law, but is secondary. ¹ Note that having the recognition and approval of the civil government, though it ought to be secondary and consequential rather than primary and immediate, is involved in the Biblical doctrine of circa sacra and of itself is a good thing. On the proper order see Fentiman, Circa Sacra, pp. 49–51. [The book written by Scottish indulged ministers, associated with John] Bairdie poses the question: “Whether it be altogether heterogeneous and incompetent, as well as it may be inconvenient, for the ruler to make civil laws and constitutions about the circumstances, order, and exercise of matters of religion, without the previous cognizance and pre-determination of the Church thereupon, and that even in the most broken and ruined state of the Church when there is no governing-Church existent that can be owned.” Balm from Gilead, pp. 76–77. The answer, at least in the abstract, must be that such an exercise of civil power, however inconvenient and defective in some cases, is not always incompetent and invalid in itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 106</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our English [partially conforming] authors below will make the case for, under necessity, material cooperation with bishops, taking the oath of canonical obedience and yielding to civil patrons in the presentation of ministers to congregations (or patronage). Note that conferring with a bishop and getting the consent and recognition of a civil officer to one’s ministry¹ are not inherently sinful actions. To give further perspective to this, and what is to come, it will be proven in the next section that Church government (albeit of divine law) is not moral law, but is secondary. ¹ Note that having the recognition and approval of the civil government, though it ought to be secondary and consequential rather than primary and immediate, is involved in the Biblical doctrine of circa sacra and of itself is a good thing. On the proper order see Fentiman, Circa Sacra, pp. 49–51. [The book written by Scottish indulged ministers, associated with John] Bairdie poses the question: “Whether it be altogether heterogeneous and incompetent, as well as it may be inconvenient, for the ruler to make civil laws and constitutions about the circumstances, order, and exercise of matters of religion, without the previous cognizance and pre-determination of the Church thereupon, and that even in the most broken and ruined state of the Church when there is no governing-Church existent that can be owned.” Balm from Gilead, pp. 76–77. The answer, at least in the abstract, must be that such an exercise of civil power, however inconvenient and defective in some cases, is not always incompetent and invalid in itself.”

— Travis Fentiman, “Editor’s Extended Introduction”, “Imposed Erastianism &amp; Episcopacy” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), p. 106">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+English+%5Bpartially+conforming%5D+authors+below+will+make+the+case+for%2C+under+necessity%2C+material+cooperation+with+bishops%2C+taking+the+oath+of+canonical+obedience+and+yielding+to+civil+patrons+in+the+presentation+of+ministers+to+congregations+%28or+patronage%29.+Note+that+conferring+with+a+bishop+and+getting+the+consent+and+recognition+of+a+civil+officer+to+one%E2%80%99s+ministry%C2%B9+are+not+inherently+sinful+actions.+To+give+further+perspective+to+this%2C+and+what+is+to+come%2C+it+will+be+proven+in+the+next+section+that+Church+government+%28albeit+of+divine+law%29+is+not+moral+law%2C+but+is+secondary.+%C2%B9+Note+that+having+the+recognition+and+approval+of+the+civil+government%2C+though+it+ought+to+be+secondary+and+consequential+rather+than+primary+and+immediate%2C+is+involved+in+the+Biblical+doctrine+of+circa+sacra+and+of+itself+is+a+good+thing.+On+the+proper+order+see+Fentiman%2C+Circa+Sacra%2C+pp.+49%E2%80%9351.+%5BThe+book+written+by+Scottish+indulged+ministers%2C+associated+with+John%5D+Bairdie+poses+the+question%3A+%E2%80%9CWhether+it+be+altogether+heterogeneous+and+incompetent%2C+as+well+as+it+may+be+inconvenient%2C+for+the+ruler+to+make+civil+laws+and+constitutions+about+the+circumstances%2C+order%2C+and+exercise+of+matters+of+religion%2C+without+the+previous+cognizance+and+pre-determination+of+the+Church+thereupon%2C+and+that+even+in+the+most+broken+and+ruined+state+of+the+Church+when+there+is+no+governing-Church+existent+that+can+be+owned.%E2%80%9D+Balm+from+Gilead%2C+pp.+76%E2%80%9377.+The+answer%2C+at+least+in+the+abstract%2C+must+be+that+such+an+exercise+of+civil+power%2C+however+inconvenient+and+defective+in+some+cases%2C+is+not+always+incompetent+and+invalid+in+itself.%E2%80%9D%0A%0A% </figure><figure class="quote" id="q-1b04833bae" data-kw="">
<blockquote><p>…the instrumental cause of the administration of the Lord’s Supper, viz. the ministers of the Gospel, and the power which they have as ministers to administer the Lord’s Supper. It is called by divines potestas ordinis [the power of order] or potestas muneris specialis [the power of a special office]: and by the London divines in their Divine-Right of Church-Government, is defined to be a Church-power more special and particular to the office of some Church-governors only, as the power of preaching the Gospel, and which they as ministers may execute virtute officii [by virtue of the office]: and it is distinguished from the power of jurisdiction which is more general and common to the office of all Church-governors, as the power of censures, wherein ruling-elders may act with ministers… …That which belongs to ministers as ministers, belongs to all ministers, and always, in all states and conditions of the Church, as well in an un-presbyterated as a presbyterated Church. For a quatenus ad de omni valet argumentum: and the universality required in a proposition, that is, de omni, is universalitas posterioristica, as well as prioristica; temporis, as well as subjecti; Indeed this universality of time, this always is not to be understood, as in natural attributions, for that which is absolutely such in a mathematical latitude, but is to be taken (as usually it is) when it is applied to matters moral, for frequency or usualness… For first every power is for its act, and therefore power in a minister of administring the Lord’s Supper is not to lie idle and unactive; but to be exercised and actuated as often as there is a fit occasion and opportunity; unless there be some such impediment, as I spake of but now, etc. ‘[Greek] Hoc est frustra, quod sua natura in alterius gratiam est comparatum, quando non perficit id, cujus gratia est, &amp; natura comparatum est.’ (Aristotle, bk. 2, Physics, text 62. ‘Now if that may be said in vain which does not reach that end unto which it was appointed, much more may that be said so which is never used or applied for the compassing of that end.’ Secondly, The edification of the Church of Christ is, as the London divines say well, that eminent scope and end why Christ gave Church Government, and all other ordinances of the New Testament to the Church, 2 Cor. 10:8; 2 Cor. 13:10. The power then both of Order and Jurisdiction are both to be employed to the edification of the Church. The power of jurisdiction the minister cannot exercise singly by himself, without other Church officers. The power of order he may: For he alone is the seat and receptacle thereof. …Now a minister ought to exercise and employ for the edification of the Church all the power and authority that he may lawfully exercise. For, not to employ it, were with the slothful servant in the parable to hide his talent in the earth.</p></blockquote>

<blockquote><p>A bishop ordained of God, or set up by the law of God, does declare nothing else but their calling, which by an other more special name, are called pastors, whom (says Luke [in Acts 20]) the holy Ghost has appointed bishops to feed the Church of God. And either of these names of pastor or of bishop is proper to them in the New Testament, whereby the apostle does distinguish them from apostles, prophets, and evangelists, which were callings to endure for a time, Eph. 4:11, and from deacons, 1 Tim. 3 and Phil. 1:1, for otherwise they are everywhere called elders… But they are called bishops in regard of the sheep committed unto them, as though a man should call them watchmen of [or?] overseers. These now were one alone, as where any church had but one pastor, or more if the church had more than one. And the meeting of them together jointly with their elders, whom Paul calls ‘governors’ [1 Cor. 12], of the other common name called, was the eldership. Their duty was to attend on the word and prayer, both publicly and privately, and in common to governe the Church, as appears by many places of Scripture. … Of the Bishop that is of Man The bishop that is of man, that is to say, brought into the Church by the alone wisdom of man, besides the express Word of God, is a certain power given to one certain pastor above his other fellows, yet limited with certain orders or rules provided against tyranny. They which did bear this office of bishop, are called bishops in regard of their fellow elders and the whole clergy, as watchmen set over the clergy. That this calling was not brought in by the Word, it is manifest by that, that there is not to be found in the New Testament so much as one syllable, whereby there may be the least surmise of any such thing. For although we doubt not, but all things ought to be done orderly in the Lord’s house, and therefore that some one should be president in every assembly… … The Answer to the First Question Where as Satan’s bishop has been the overthrow of the Church and all Christian kingdoms, whose head is the Roman Antichrist, it is to be looked unto of all hands, especially of all godly princes, that they at once abolish it, if they mind the reformation of the Church and their own safety. As for the bishop ordained by man and brought into the Church by little and little, whereby Satan made him a way for greater things, it had been tolerable… experience of so many ages does teach us too well, that unless this root also be plucked up, it will come to pass that the same fruit will sprout and bud forth again. Finally, seeing the Lord has so often decided this controversy of superiority among his own disciples, that He shut it clean out, seeing the rule both for doctrine and good order of the Church is to be sought for out of the very writings of the apostles: and it is manifested, the churches then prospered, when all this authority of one man over the rest, yet was not, but as that grew up, so all things fell to decay. Finally, seeing where the remnants of this government by a few are not clean taken away, the work of the Lord, is openly hindered: Our judgement is that after the chasing away of this device of man, the churches shall be well provided for, if they may be repaired according to the writings of the apostles.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“A bishop ordained of God, or set up by the law of God, does declare nothing else but their calling, which by an other more special name, are called pastors, whom (says Luke [in Acts 20]) the holy Ghost has appointed bishops to feed the Church of God. And either of these names of pastor or of bishop is proper to them in the New Testament, whereby the apostle does distinguish them from apostles, prophets, and evangelists, which were callings to endure for a time, Eph. 4:11, and from deacons, 1 Tim. 3 and Phil. 1:1, for otherwise they are everywhere called elders… But they are called bishops in regard of the sheep committed unto them, as though a man should call them watchmen of [or?] overseers. These now were one alone, as where any church had but one pastor, or more if the church had more than one. And the meeting of them together jointly with their elders, whom Paul calls ‘governors’ [1 Cor. 12], of the other common name called, was the eldership. Their duty was to attend on the word and prayer, both publicly and privately, and in common to governe the Church, as appears by many places of Scripture. … Of the Bishop that is of Man The bishop that is of man, that is to say, brought into the Church by the alone wisdom of man, besides the express Word of God, is a certain power given to one certain pastor above his other fellows, yet limited with certain orders or rules provided against tyranny. They which did bear this office of bishop, are called bishops in regard of their fellow elders and the whole clergy, as watchmen set over the clergy. That this calling was not brought in by the Word, it is manifest by that, that there is not to be found in the New Testament so much as one syllable, whereby there may be the least surmise of any such thing. For although we doubt not, but all things ought to be done orderly in the Lord’s house, and therefore that some one should be president in every assembly… … The Answer to the First Question Where as Satan’s bishop has been the overthrow of the Church and all Christian kingdoms, whose head is the Roman Antichrist, it is to be looked unto of all hands, especially of all godly princes, that they at once abolish it, if they mind the reformation of the Church and their own safety. As for the bishop ordained by man and brought into the Church by little and little, whereby Satan made him a way for greater things, it had been tolerable… experience of so many ages does teach us too well, that unless this root also be plucked up, it will come to pass that the same fruit will sprout and bud forth again. Finally, seeing the Lord has so often decided this controversy of superiority among his own disciples, that He shut it clean out, seeing the rule both for doctrine and good order of the Church is to be sought for out of the very writings of the apostles: and it is manifested, the churches then prospered, when all this authority of one man over the rest, yet was not, but as that grew up, so all things fell to decay. Finally, seeing where the remnants of this government by a few are not clean taken away, the work of the Lord, is openly hindered: Our judgement is that after the chasing away of this device of man, the churches shall be well provided for, if they may be repaired according to the writings of the apostles.”

— Theodore Beza, The Judgment of a Most Reverend &amp; Learned Man from Beyond the Seas Concerning a Threefold Order of Bishops [of God, of Man, of the Devil], with a Declaration of Certain Other Weighty Points Concerning the Discipline &amp; Government of the Church ([London, 1585]) 43, pp. ToC">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CA+bishop+ordained+of+God%2C+or+set+up+by+the+law+of+God%2C+does+declare+nothing+else+but+their+calling%2C+which+by+an+other+more+special+name%2C+are+called+pastors%2C+whom+%28says+Luke+%5Bin+Acts+20%5D%29+the+holy+Ghost+has+appointed+bishops+to+feed+the+Church+of+God.+And+either+of+these+names+of+pastor+or+of+bishop+is+proper+to+them+in+the+New+Testament%2C+whereby+the+apostle+does+distinguish+them+from+apostles%2C+prophets%2C+and+evangelists%2C+which+were+callings+to+endure+for+a+time%2C+Eph.+4%3A11%2C+and+from+deacons%2C+1+Tim.+3+and+Phil.+1%3A1%2C+for+otherwise+they+are+everywhere+called+elders%E2%80%A6+But+they+are+called+bishops+in+regard+of+the+sheep+committed+unto+them%2C+as+though+a+man+should+call+them+watchmen+of+%5Bor%3F%5D+overseers.+These+now+were+one+alone%2C+as+where+any+church+had+but+one+pastor%2C+or+more+if+the+church+had+more+than+one.+And+the+meeting+of+them+together+jointly+with+their+elders%2C+whom+Paul+calls+%E2%80%98governors%E2%80%99+%5B1+Cor.+12%5D%2C+of+the+other+common+name+called%2C+was+the+eldership.+Their+duty+was+to+attend+on+the+word+and+prayer%2C+both+publicly+and+privately%2C+and+in+common+to+governe+the+Church%2C+as+appears+by+many+places+of+Scripture.+%E2%80%A6+Of+the+Bishop+that+is+of+Man+The+bishop+that+is+of+man%2C+that+is+to+say%2C+brought+into+the+Church+by+the+alone+wisdom+of+man%2C+besides+the+express+Word+of+God%2C+is+a+certain+power+given+to+one+certain+pastor+above+his+other+fellows%2C+yet+limited+with+certain+orders+or+rules+provided+against+tyranny.+They+which+did+bear+this+office+of+bishop%2C+are+called+bishops+in+regard+of+their+fellow+elders+and+the+whole+clergy%2C+as+watchmen+set+over+the+clergy.+That+this+calling+was+not+brought+in+by+the+Word%2C+it+is+manifest+by+that%2C+that+there+is+not+to+be+found+in+the+New+Testament+so+much+as+one+syllable%2C+whereby+there+may+be+the+least+surmise+of+any+such+thing.+For+although+we+doubt+not%2C+but+all+things+ought+to+be+done+orderly+in+the+Lord%E2%80%99s+house%2C+and+therefore+that+some+one+should+be+president+in+every+assembly%E2%80%A6+%E2%80%A6+The+Answer+to+the+First+Question+Where+as+Satan%E2%80%99s+bishop+has+been+the+overthrow+of+the+Church+and+all+Christian+kingdoms%2C+whose+head+is+the+Roman+Antichrist%2C+it+is+to+be+looked+unto+of+all+hands%2C+especially+of+all+godly+princes%2C+that+they+at+once+abolish+it%2C+if+they+mind+the+reformation+of+the+Church+and+their+own+safety.+As+for+the+bishop+ordained+by+man+and+brought+into+the+Church+by+little+and+little%2C+whereby+Satan+made+him+a+way+for+greater+things%2C+it+had+been+tolerable%E2%80%A6+experience+of+so+many+ages+does+teach+us+too+well%2C+that+unless+this+root+also+be+plucked+up%2C+it+will+come+to+pass+that+the+same+fruit+will+sprout+and+bud+forth+again.+Finally%2C+seeing+the+Lord+has+so+often+decided+this+controversy+of+superiority+among+his+own+disciples%2C+that+He+shut+it+clean+out%2C+seeing+the+rule+both+for+doctrine+and+good+order+of+the+Church+is+to+be+sought+for+out+of+the+very+writings+of+the+apostles%3A+and+it+is+manifested%2C+the+churches+then+prospered%2C+when+all+this+authority+of+one+man+over+the+rest%2C+yet+was+not%2C+but+as+that+grew+up%2C+so+all+things+fell+to+decay.+Finally%2C+seeing+where+the+remnants+of+this+government+by+a+few+are+not+clean+taken+away%2C+the+work+of+the+Lord%2C+is+openly+hindered%3A+Our+judgement+is+that+after+the+chasing+away+of+this+device+of+man%2C+the+churches+shall+be+well+provided+for%2C+if+they+may+be+repaired+according+to+the+writings+of+the+apostles.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Judgment+of+a+Most+Reverend+%26+Learned+Man+from+Beyond+the+Seas+Concerning+a+Threefold+Order+of+Bishops+%5Bof+God%2C+of+Man%2C+of+the+Devil%5D%2C+with+a+Declaration+of+Certain+Other+Weighty+Points+Concerning+the+Discipline+%26+Government+of+the+Church+%28%5BLondon%2C+1585%5D%29+43%2C+pp.+ToC&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F323e74c17f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/323e74c17f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=A%20bishop%20ordained%20of%20God%2C%20or,to%20the%20writings%20of%20the%20apostles&amp;text=A%20bishop%20ordained%20of%20God%2C%20or%20set%20up&amp;text=repaired%20according%20to%20the%20writings%20of%20the%20apostles" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[It is superstition] that all the pastors of the protestant Churches abroad, who had only the election of the people and the ordination of parochial pastors, and not of diocesan bishops, are no true ministers of Christ, but laymen. That therefore those Churches are no true Churches (in a political sense and as organized). That therefore their baptism is unlawful and a nullity, and all those nations are no baptized Christians (though the Papists who hold the validity of laymen’s baptizing do here censure [these protestant episcopal men] more easily). That it is not lawful to communicate in such Churches and receive the sacrament of the Lords supper from such ministers. That those countries which are baptized by such should be rebaptized. That those ministers who are ordained by such should be re-ordained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 58, p. 292</span></figcaption>

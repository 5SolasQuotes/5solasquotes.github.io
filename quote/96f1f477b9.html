<blockquote><p>38. One act of faith is direct toward its object, another reflexive toward itself. Also the first act of faith is to believe, the second to work through charity and by means of it.

39. This latter act is the instrument of our sanctification, which is mortification of the old man according to all parts and faculties that are in us, and vivification of the new according to the same. But that is not perfect in the way, but such it will be in the goal, nor is it given here consqummated, but only begun.

40. Sanctification is succeeded by glorification…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9306965dc9" data-kw="">
<blockquote><p>We do not say that the confidence by which we are justified is the forgiveness of sins already perceived, nor that the object of this confidence is the forgiveness of sins previously perceived; but that confidence by which we each believe our sins are forgiven in the present, not properly in the past or future, although both pertain to justifying faith, but not to the high, so to speak, formal aspect of justifying. When, therefore, the Gospel word offers mercy and forgiveness of sins through Christ to every believer, faith does not only believe in general that this is true, that sins will indeed be forgiven to all who truly believe in Christ, but also the believer confidently persuades himself that this promise applies to him, and by that act of confidence, he is then forgiven his sin, and it becomes his happiness mentioned by the apostle in Rom. 4:7. Just as by extending a hand and accepting a gift, the beneficiary who has approached becomes a participant. Thus, in a faithful person, there are simultaneously forgiveness of sins and confidence about that forgiveness; and by the faith through which that mercy and special grace were received, it is afterward retained, and what was believed about the future is embraced in the present, and what about the past remains certain afterward. But one who believes he will be justified if he believes in Jesus Christ is not yet justified in the past unless he believes in the present that righteousness is given to him, which he receives by the same act. What is later believed about the past does not justify him but presupposes him as justified. All these acts are of the same justifying faith, the first indeed predisposes to justification, the second properly justifies, the third pacifies the conscience.</p></blockquote>

<blockquote><p>The reception of that gift is faith: faith means not doing something but receiving something; it means not the earning of a reward but the acceptance of a gift. A man can never be said to obtain a thing for himself if he obtains it by faith; indeed to say that he obtains it by faith is only another way of saying that he does not obtain it for himself but permits another to obtain it for him.</p></blockquote>

</figure><figure class="quote" id="q-42cdfa28cc" data-kw="">
<blockquote><p>And what greater discovery of good will could there be? 3. In the free offers that he makes of it to men. He has not only made way for it, by the obedience of his Son, who paid the price for our redemption, but published it in the Gospel, and tendered it to all that come within the sound of that proclamation: And there are two things that set forth his readiness to apply this forgiveness to sinners.

1. That He makes offer of, and invites sinners to accept it. He has ordered that man be told that He has forgiveness, and that they be bidden to come for it. He does not wait till miserable sinners cry to Him for it; which yet would be a rich favor, if so they might find it at his hands, but because they sought it not, nor ever would have done so, He sends them an embassy about it, Isa. 65:1-2; 2 Cor. 5:20. And would He do so, did He not delight in pardoning?

2. That He offers it freely. And if He did not do so, the sinner must forever go without it, for he had nothing to purchase it with. The gospel invitations come as freely as can be supposed, Isa. 55:1; Rev. 22:17. If it be here objected, You teach that there are gospel conditions on which it is only to be had; how then can it be said to be free? It may readily be replied: There are no other conditions required in the Gospel but what among men are required in order to receiving and being invested with the freest gift that can be: there is nothing but acceptance of this gift and acknowledgment of the kindness of the bestower; faith is the hand that receives it, whereas unbelief puts it away; and is it not meet that he who would have the benefit of a gift, do accept of it? or does such acceptance derogate from the grace of the Giver? and what is our obedience, but our thankfulness to God for so unspeakable a gift? and shall any say the gift was not free, because I was thankful for it? the sinner was worthy of death and deserved no pardon, and yet he may have it for receiving, and is not God willing?</p></blockquote>

1. That He makes offer of, and invites sinners to accept it. He has ordered that man be told that He has forgiveness, and that they be bidden to come for it. He does not wait till miserable sinners cry to Him for it; which yet would be a rich favor, if so they might find it at his hands, but because they sought it not, nor ever would have done so, He sends them an embassy about it, Isa. 65:1-2; 2 Cor. 5:20. And would He do so, did He not delight in pardoning?

2. That He offers it freely. And if He did not do so, the sinner must forever go without it, for he had nothing to purchase it with. The gospel invitations come as freely as can be supposed, Isa. 55:1; Rev. 22:17. If it be here objected, You teach that there are gospel conditions on which it is only to be had; how then can it be said to be free? It may readily be replied: There are no other conditions required in the Gospel but what among men are required in order to receiving and being invested with the freest gift that can be: there is nothing but acceptance of this gift and acknowledgment of the kindness of the bestower; faith is the hand that receives it, whereas unbelief puts it away; and is it not meet that he who would have the benefit of a gift, do accept of it? or does such acceptance derogate from the grace of the Giver? and what is our obedience, but our thankfulness to God for so unspeakable a gift? and shall any say the gift was not free, because I was thankful for it? the sinner was worthy of death and deserved no pardon, and yet he may have it for receiving, and is not God willing?”

— Samuel Willard, The Truly Blessed Man, (Boston: Green &amp; Allen, 1700), pp. 254–57">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+what+greater+discovery+of+good+will+could+there+be%3F+3.+In+the+free+offers+that+he+makes+of+it+to+men.+He+has+not+only+made+way+for+it%2C+by+the+obedience+of+his+Son%2C+who+paid+the+price+for+our+redemption%2C+but+published+it+in+the+Gospel%2C+and+tendered+it+to+all+that+come+within+the+sound+of+that+proclamation%3A+And+there+are+two+things+that+set+forth+his+readiness+to+apply+this+forgiveness+to+sinners.+1.+That+He+makes+offer+of%2C+and+invites+sinners+to+accept+it.+He+has+ordered+that+man+be+told+that+He+has+forgiveness%2C+and+that+they+be+bidden+to+come+for+it.+He+does+not+wait+till+miserable+sinners+cry+to+Him+for+it%3B+which+yet+would+be+a+rich+favor%2C+if+so+they+might+find+it+at+his+hands%2C+but+because+they+sought+it+not%2C+nor+ever+would+have+done+so%2C+He+sends+them+an+embassy+about+it%2C+Isa.+65%3A1-2%3B+2+Cor.+5%3A20.+And+would+He+do+so%2C+did+He+not+delight+in+pardoning%3F+2.+That+He+offers+it+freely.+And+if+He+did+not+do+so%2C+the+sinner+must+forever+go+without+it%2C+for+he+had+nothing+to+purchase+it+with.+The+gospel+invitations+come+as+freely+as+can+be+supposed%2C+Isa.+55%3A1%3B+Rev.+22%3A17.+If+it+be+here+objected%2C+You+teach+that+there+are+gospel+conditions+on+which+it+is+only+to+be+had%3B+how+then+can+it+be+said+to+be+free%3F+It+may+readily+be+replied%3A+There+are+no+other+conditions+required+in+the+Gospel+but+what+among+men+are+required+in+order+to+receiving+and+being+invested+with+the+freest+gift+that+can+be%3A+there+is+nothing+but+acceptance+of+this+gift+and+acknowledgment+of+the+kindness+of+the+bestower%3B+faith+is+the+hand+that+receives+it%2C+whereas+unbelief+puts+it+away%3B+and+is+it+not+meet+that+he+who+would+have+the+benefit+of+a+gift%2C+do+accept+of+it%3F+or+does+such+acceptance+derogate+from+the+grace+of+the+Giver%3F+and+what+is+our+obedience%2C+but+our+thankfulness+to+G

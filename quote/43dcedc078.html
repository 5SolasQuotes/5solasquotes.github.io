<main class="wrap"><figure class="quote" id="q-43dcedc078" data-kw="">
<blockquote><p>I, A.B. do seriously and solemnly protest, in the presence of Almighty God, that in this Assembly, whereof I am a member, I will not maintain any thing in matters of doctrine, but what I think in my conscience to be truth; or in point of discipline, but what I shall conceive to conduce most to the glory of God, and the good and peace of his church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-lightfoot.html">John Lightfoot</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Journal of the Proceedings of the Assembly of Divines, from July 1, 1643, to December 31, 1644</cite>, ed. John Rogers Pitman (London: J. F. Dove, 1824), 8 July 1643, p. 4.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“I, A.B. do seriously and solemnly protest, in the presence of Almighty God, that in this Assembly, whereof I am a member, I will not maintain any thing in matters of doctrine, but what I think in my conscience to be truth; or in point of discipline, but what I shall conceive to conduce most to the glory of God, and the good and peace of his church.”

— John Lightfoot, The Journal of the Proceedings of the Assembly of Divines, from July 1, 1643, to December 31, 1644, ed. John Rogers Pitman (London: J. F. Dove, 1824), 8 July 1643, p. 4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI%2C+A.B.+do+seriously+and+solemnly+protest%2C+in+the+presence+of+Almighty+God%2C+that+in+this+Assembly%2C+whereof+I+am+a+member%2C+I+will+not+maintain+any+thing+in+matters+of+doctrine%2C+but+what+I+think+in+my+conscience+to+be+truth%3B+or+in+point+of+discipline%2C+but+what+I+shall+conceive+to+conduce+most+to+the+glory+of+God%2C+and+the+good+and+peace+of+his+church.%E2%80%9D%0A%0A%E2%80%94+John+Lightfoot%2C+The+Journal+of+the+Proceedings+of+the+Assembly+of+Divines%2C+from+July+1%2C+1643%2C+to+December+31%2C+1644%2C+ed.+John+Rogers+Pitman+%28London%3A+J.+F.+Dove%2C+1824%29%2C+8+July+1643%2C+p.+4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F43dcedc078.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/43dcedc078.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/10/12/john-lightfoot-on-the-vow-taken-by-the-westminster-divines/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-07abc4c7e3" data-kw="">
<blockquote><p>XXII. …it [the Apostles’ Creed] cannot be an exact mark of fundamental articles because it treats only of theoretical articles relating to faith, not of practical articles relating to worship… …that the Symbol [Creed] is not to be considered only with regard to the words, but as to the sense (because, as Hilary says, ‘The Scriptures do not consist in the reading but in the understanding,’ Ad Constantium Augustum, II,9 [PL 10.570]; and ‘fundamentals are not found in the words but in the sense,’ as Jerome says). Therefore although heretics may say that they receive the Symbol, yet they do not because they reject its true and genuine sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, question 14, ‘Are some theological topics fundamental, others not; and how can they be mutually distinguished?’ in Institutes of Elenctic Theology, tr. George M. Giger, ed. James Dennison Jr. (1679–1685; P&amp;R, 1992), vol. 1, 1st Topic, pp. 48-55, p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“XXII. …it [the Apostles’ Creed] cannot be an exact mark of fundamental articles because it treats only of theoretical articles relating to faith, not of practical articles relating to worship… …that the Symbol [Creed] is not to be considered only with regard to the words, but as to the sense (because, as Hilary says, ‘The Scriptures do not consist in the reading but in the understanding,’ Ad Constantium Augustum, II,9 [PL 10.570]; and ‘fundamentals are not found in the words but in the sense,’ as Jerome says). Therefore although heretics may say that they receive the Symbol, yet they do not because they reject its true and genuine sense.”

</figure><figure class="quote" id="q-77b22516c1" data-kw="">
<blockquote><p>[About the Church of England:] She is the very eye of all the Churches, the peculiar of Christ, the refuge of the afflicted, the arsenal of the weak, the storehouse of the poor, the standard of better hope… [Diodati laments that] in the civil wars this illustrious fold of Christ should be torn in pieces, not by wild beasts indeed; and plundered, though not by robbers; but by the sheep themselves enraged against one another: A thing without example, and never heard of before in the Reformed Churches. We are all struck with horror when we hear of the battles that are fought by the people against their king; by brethren against brethren; by children against their parents; and by the flock of Christ against one another, and against the shepherds themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-diodati.html">John Diodati</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Westminster Assembly</cite>, Letter 12, p. 14, as quoted in Robert Burscough, A Vindication of a Discourse of Schism… (Exeter: Farley, 1701), Preface, p. vi</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-heresy.html">Schism and Heresy</a></span></div>

</figure><figure class="quote" id="q-8d7c08bb76" data-kw="">
<blockquote><p>The Christian who withdraws entirely from the society of his fellow-men, and walks the earth with a face as melancholy as if he was always attending a funeral, does injury to the cause of the Gospel. A cheerful, kindly spirit is a great recommendation to a believer.

It is a positive misfortune to Christianity when a Christian cannot smile. A merry heart, and readiness to take part in all innocent mirth, are gifts of inestimable value. They go far to soften prejudices, to take up stumbling-blocks out of the way, and to make way for Christ and the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels: John, Volume One</cite>, (1869; Edinburgh: Banner of Truth, 1987), p. 91.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-d37baf5e4f" data-kw="">
<blockquote><p>At length the revolution of 1688 (in which, however, the fastidious nature of his principles would not sanction his concurrence) allowed him to return from exile. His attainder was reversed, and, on his brother’s death, he succeeded to the honours of the family; but from religious scruples as to acknowledging the prince of Orange, he never applied for the succession to his brother’s estates. In 1692 he was imprisoned for 8 months on account of being the suspected author of the ‘Sanquhar Declaration, 10th Aug. 1692,’ and was at length liberated in May 1693, and allowed to spend the remainder of his days in undisturbed tranquillity. Sir Robert died unmarried on the 20th Oct. 1701, at Borrowstonness, where he had resided for some period before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-2d07133095" data-kw="">
<blockquote><p>We learn from our Master that the scandal of one is to be cared for (Mt. 18:6)…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f643623cd" data-kw="">
<blockquote><p>Not just Paul, but the apostles and elders at the synod in Jerusalem, bindingly (Acts 15:28; 16:4) laid some of these beggarly, burdensome ceremonies on the whole regional Church (Acts 15:23, 41; 16:4), as “it seemed good to the Holy Ghost” (Acts 15:28), yet not for the formal reason of service to that law of bondage. Rather, the circumstances made it necessary (Acts 15:28), to prevent the greater scandal of erring (Jewish) unbelievers and weak Christians (who expected the observance of such carnal and false, material ordinances), and for the spread of the Gospel amongst them. In the case of Paul, he had his reasons for keeping the ceremonies in each instance, though they are not always told to us or onlookers. But each time his necessity (Acts 16:1–5; 18:21) was less than ministerial deprivation. Sometimes it was simply to prevent unnecessary conflict.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-40b59be1bf" data-kw="">
<blockquote><p>A third limitation: the forementioned rule has not place, when by the forbearance of our indifferencies, at which some wicked men are scandalized, there is incurred as great, if not a greater scandal, then that by their use: as when they are hereby confirmed, and hardened in their error, and sin; and others are hereby drawn into the like: prudenter advertendum est (says Bernard) scandalum scandalo non emendari, qualis emendatio 〈◊〉, si ut aliis scandalum tollas, alios scandalizas.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Part of The Mixture of Scholastical Divinity</cite>, (Oxford, 1660), on 1 Tim. 5:22, “Abstain from all, etc.”, p. 102</span></figcaption>

</figure><figure class="quote" id="q-f5f7f2e614" data-kw="">
<blockquote><p>4. But if we were malicious in offending at the ceremonies as things unlawful, and in urging of non-conformity as necessary, should they [the prelates] therefore contemn our being scandalized? Those that would have Titus circumcised, were they not malicious? [Gal. 2:3-5] Did they not urge circumcision as necessary? Held they it not unlawful, not to circumcise Titus? Yet did the apostle abstain, because they were to be scandalized, that is, made worse and more wicked calumniators by the circumcising of Titus, as I have showed (above, ch. 8, section 6); So that albeit we are not to care for the displeasing of men that malitiously and contumaciously urge (as necessary) abstaining from that which is lawful to be done, yet must we care for scandalizing them and making them worse: rather ere that be, we ought to abstain from the use of our liberty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 9, p. 45</span></figcaption>

</figure><figure class="quote" id="q-bd1ff0c759" data-kw="">
<blockquote><p>Some infirmities discover more good than some seeming beautiful actions. Excess of passion in opposing evil, though not to be justified, yet shows a better spirit than a calm temper when there is just cause of being moved. It is better that the water should run somewhat muddily than not run at all. Job had more grace in his ill temper than his friends in their seemingly wise demeanour. Actions soiled with some weaknesses are more accetped than self-righteous performances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bruised Reed &amp; Smoking Flax</cite>, … (1620; Philadelphia; Presbyterian Board of Publication, n.d.), ch. 11, p. 76</span></figcaption>

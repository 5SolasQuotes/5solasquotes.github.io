<main class="wrap"><figure class="quote" id="q-639f557fb5" data-kw="">
<blockquote><p>V. The faculties of the soul are really [realiter] distinct from the soul itself, as qualities or a peculiar accident [proprium accidens] differ from the subject. The reason is to be found in the result; when faculties of the soul are injured its essence remains.

VI. The faculties of the soul are either purely organic, as are the vegetative and sensitive faculties, or they are so partially and temporarily, as are intelligence and will. The former do not operate after the death of the body; the latter both can operate without the help of the body, and continue to operate after the body has been destroyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, bk. 1, ch. 5, ‘Creation’ (1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), p. 58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5854e4d29d" data-kw="">
<blockquote><p>Autopistia offers a historical survey and a theological evaluation of the self-convincing character of Scripture in Reformed theology. Calvin adopted the term autopistos from ancient Greek philosophy and used it to express that faith does not rest on the human authority of the church but on Scripture as the living voice of God. After discussing the meaning of the term in Reformed Orthodoxy and analyzing the theological position of Benjamin B. Warfield and Herman Bavinck on this issue… Van den Belt draws his theological conclusions in this study, advocating a revitalization of the autopistia of Scripture…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hendrik-van-den-belt.html">Hendrik van den Belt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Autopistia: the Self-Convincing Authority of Scripture in Reformed Theology PhD diss</cite>, (Leiden Univ., 2006) 345, pp. ToC</span></figcaption>

</figure><figure class="quote" id="q-d662f50fd5" data-kw="">
<blockquote><p>VI. Many abuses can also be reckoned up: … (3) When philosophy assumes to itself the office of a master, in articles of faith, not content with that of a servant (as was done by the [Medieval, Romanist] Scholastics who places Aristotle upon the throne; and by the Socinians who would not admit the doctrines of the Trinity, of the incarnation, etc. because they did not seem to be in accordance with the principles of philosophy). (4) When more new distinctions and phrases than necessary are introduced from philosophy into theology under which (oftentimes) new and dangerous errors lie concealed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1, 1st Topic, Q. 13, ‘Is there any use of Philosophy in Theology? We Affirm’, section 6, pp. 45-56</span></figcaption>

</figure><figure class="quote" id="q-9462578d12" data-kw="">
<blockquote><p>If Paul in preaching had either substituted human wisdom for the doctrine of the cross, or had so presented that doctrine as to turn it into a philosophy, his preaching would have been powerless. It would lose its divine element and become nothing more than human wisdom. Whatever obscures the cross deprives the gospel of its power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Epistle to the Corinthians</cite>, on 1:17</span></figcaption>

</figure><figure class="quote" id="q-eee29e7453" data-kw="">
<blockquote><p>I say that although things other than God are in fact contingent in respect of actual being, they are not so in respect of potential being. So things that are contingent with respect to actual existence are necessary with respect to possible existence, as that although it is contingent that man exists yet that his existence is possible is necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Intro, p. 9 | This very evident proposition, although it is in itself a necessary one (as will be shown later), is yet a proposition that for us is purely contingent. Hence, in order to preserve the condition of Aristotelian science that the principles be necessary, we can infer something necessary from the contingent proposition ‘something is’, namely the proposition that ‘the existence of something is possible’ or that ‘there is no repugnance between something and existence’. For as Scotus well observes (Lectura 1)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>Be wise then, dear child of God, and look upon your present affliction as a chastening. “What son is he whom the father chastens not?” “As many as I love, I rebuke and chasten.” There is not a more profitable instrument in all God’s house than the rod. No honey was sweeter than that which dropped from the end of Jonathan’s rod, but that is nothing compared to the sweetness of the consolation which comes through Jehovah’s rod.

Our brightest joys are the birth of our bitterest griefs. When the woman has her travail pangs, joy comes to the house because a child is born—and sorrow is to us also, full often, the moment of the birth of our graces. A chastened spirit is a gracious spirit—and how shall we obtain it unless we are chastened? Like our Lord Jesus, we learn obedience by the things which we suffer. God had one Son without sin, but He never had a son without sorrow—and He never will while the world stands. Let us, therefore, bless God for all His dealings and in a filial spirit confess, “You, Lord, have chastened me.</p></blockquote>

<blockquote><p>That is, the General Assembly decided that appeals cannot lie except in judicial cases. It is really a matter of importance. It would be a hard case if a party, suffering under a grievous wrong, should be turned away from the bar of our highest judicatory, merely on the ground that he had mistaken the nature of his remedy… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and com- plaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus putting minorities completely under the feet of majorities, not allowing them even the right of recording their dissent with the reasons for it… …There is a good deal of confusion and error often occasioned by the mere designation of our ecclesiastical bodies as courts or judicatories. They are so called Avhen not sitting in judicial capacity… Our courts are bodies sui generis [of their kind]; they include within themselves legislative, executive and judicial powers. Yet this division is in a great measure arbitrary. These several powers are but different modes of exercising the general governing authority in the Church; and it is often very difficult to say whether a particular act should be placed under the one or the other of these heads… An appeal supposes an aggrieved party, but he may appeal from any kind of decision which directly affects himself. A complaint supposes some kind of impropriety in the act complained of, but it may be entered against any kind of act alleged to be improper. So that any kind of decision may be regularly brought up in each of the several ways specified above. That this is the true meaning of this article, might be inferred with certainty from the fact that it has always been so understood and acted upon; and that it is almost a literal transcript of the Scottish rule on the same subject, which has always been interpreted and applied in the same way… In the first place, these technical terms are to be understood, not according to their use in civil courts, but according to our own ecclesiastical usage. Our bodies are called courts; their decisions are called judgments; the matters brought before them are called cases. Are we to infer from this, as has been done by the New School lawyers and brethren, that they have nothing but judicial powers… In the second place, our rules were drawn up with special reference to that class of cases which is of most frequent occurrence, and hence the language employed is adapted to such cases… In the third place it is a fallacy running through this argument that there can be no judicial investigation of anything but a judicial act… There is, therefore, no foundation in our constitution for this new doctrine. Every letter of the rules may be, and has been fully complied with in a multitude of cases, where the decision appealed from was merely an executive act… We shall proceed to show that this new doctrine, especially if applied to complaints as well as appeals (and we have seen that the two cannot in this matter be consistently separated), is subversive of the fundamental principles of Presbyterianism, and inconsistent with the uniform practice of the Church… This doctrine is at variance also with the undeviating practice of our own and all other Presbyterian Churches. This of itself is a fatal objection to any new doctrine. The fact that we have been going on in accordance with the usage of all other Presbyterian bodies, for a hundred and twenty years, interpreting and administering our constitution in a certain way, is answer enough… The words of our book have the sense which they were intended to bear; and they were intended to bear the sense in which its authors and administrators have ever understood and applied them… That the practice of our Church has been uniform on this subject, is admitted… There is not then, upon our Minutes, a single case of an appeal or complaint, which was rejected on the ground that it did not refer to a judicial sentence. We have been going on for a hundred and twenty years entertaining such appeals without any one dreaming of their being irregular… If after all this a new and opposite doctrine is to be introduced, there never can be any stability or security with regard to any principle of Presbyterian Church government… Nothing short of a plain and intelligible denial of the right to complain of oppressive and unconstitutional acts; or to appeal from unrighteous decisions, though they may not be judicial, will induce Presbyterians to forego a privilege which they have enjoyed from the very foundation of their Church… If it is to be applied to appeals, we see not how any one can fail to apply it to complaints and references, and if so applied, all must acknowledge that our system of government would be completely overturned. The right of appeal is already restricted within very harrow limits. It is not the privilege of any member of the court. It belongs exclusively to an aggrieved party; to those whose character or interests are immediately concerned in the decision. And to all such it is a right guaranteed by the constitution and by the undeviating practice of the Church.</p></blockquote>

een+uniform+on+this+subject%2C+is+admitted%E2%80%A6+There+is+not+then%2C+upon+our+Minutes%2C+a+single+case+of+an+appeal+or+complaint%2C+which+was+rejected+on+the+ground+that+it+did+not+refer+to+a+judicial+sentence.+We+have+been+going+on+for+a+hundred+and+twenty+years+entertaining+such+appeals+without+any+one+dreaming+of+their+being+irregular%E2%80%A6+If+after+all+this+a+new+and+opposite+doctrine+is+to+be+introduced%2C+there+never+can+be+any+stability+or+security+with+regard+to+any+principle+of+Presbyterian+Church+government%E2%80%A6+Nothing+short+of+a+plain+and+intelligible+denial+of+the+right+to+complain+of+oppressive+and+unconstitutional+acts%3B+or+to+appeal+from+unrighteous+decisions%2C+though+they+may+not+be+judicial%2C+will+induce+Presbyterians+to+forego+a+privilege+which+they+have+enjoyed+from+the+very+foundation+of+their+Church%E2%80%A6+If+it+is+to+be+applied+to+appeals%2C+we+see+not+how+any+one+can+fail+to+apply+it+to+complaints+and+references%2C+and+if+so+applied%2C+all+must+acknowledge+that+our+system+of+government+would+be+completely+overturned.+The+right+of+appeal+is+already+restricted+within+very+harrow+limits.+It+is+not+the+privilege+of+any+member+of+the+court.+It+belongs+exclusively+to+an+aggrieved+party%3B+to+those+whose+character+or+interests+are+immediately+concerned+in+the+decision.+And+to+all+such+it+is+a+right+guaranteed+by+the+constitution+and+by+the+undeviating+practice+of+the+Church.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Discussions+in+Church+Polity%2C+%E2%80%A6+%28NY%3A+Scribner%E2%80%99s+Sons%2C+1878%29%2C+pt.+2%2C+ch.+16%2C+%E2%80%98Discipline%E2%80%99%2C+section+3%2C+%E2%80%98Appeals+%26+Complaints%E2%80%99+%7C+a.+%E2%80%98Appeals+in+Cases+Not+Judicial%E2%80%99+470&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F104eb0485a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/104eb0485a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=That%20is%2C%20the%20General%20Assembly%20decided,the%20undeviating%20practice%20of%20the%20Church&amp;text=That%20is%2C%20the%20General%20Assembly%20decided%20that%20appeals&amp;text=and%20by%20the%20undeviating%20practice%20of%20the%20Church" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>This critical edition is the first ever publication of Hale’s Of the Law of Nature, which previously existed only in manuscript form. After discussing and defining law in general, Hale examines the natural law in particular, its discovery and divine origin, and how it relates to both biblical and human laws. Hale’s treatise, which was likely written as part of his personal meditations and was circulated among English lawyers after his death, reveals not only the close relationship between law and theology in his thought, but also the importance of natural law to early modern legal thought.</p></blockquote>

<blockquote><p>2. What they affirm, that brothels are to be tolerated lest married women should be violated, is contrary to the Divine command, Deut. xxiii. 17, There shall be no whore of the daughters of Israel, &amp;c. It is contrary to Apostolic doctrine; which would have matrimony, not fornication, to be the remedy for lust. It is contrary to the received opinion of Theologians, who deny that a compensation of sins is to be admitted: Harlots, therefore, are not to be prostituted lest married women should be violated. Lastly, it is contrary to the duty of the Christian magistrate; who is bound, as much as in him lies, to take care that all may live piously, soberly, and righteously: Rom. xiii. He ought not, therefore, to suffer those who openly profess whoredom.

3. With respect to the remark of Augustine, Take away harlots from human society and you will disturb all things by lust; we answer, it is not of much weight: because he wrote those books De ordine, when he was a young man, and not then baptized, as is evident from the first of his Retractations. We also oppose to it the more serious of the Fathers. Lactantius, Instit. lib. 6, cap. 23, says, The devil set up brothels, and published the shame of unhappy women. Clemens, Paedag. 3. cap. 3, Brothels are trophies of public intemperance. Tertullian, de cultu faeminar. calls harlots the most unhappy victims of public lusts. But now how disgraceful to the Christian magistrate, if he defend the inventions of the devil, if he suffer that victims be publicly immolated to lust, if, in short, he do not demolish the trophies of intemperance. Besides, I say, that however diligently the magistrate may endeavour to repress fornication, yet he can never wholly remove from human society harlots or fornicators, no more than he can remove thieves or murderers. Therefore the Papists may dismiss this fear.

Lastly we must also add; that this remedy (the toleration of brothels) is worse than even the disease which is dreaded. For although adultery be in itself worse than fornication; yet it is worse for a whole city to be continually polluted by brothels, than if it should sometimes happen that certain wedded women be violated. But even this is by no means to be conceded; that the honour and chastity of married women can be better preserved by the permission of fornication than by the severe punishment of it. For by impunity, and the continued habit of sinning we become more daring; and if we have served an apprenticeship to lust among harlots, becoming anon veterans, we the more confidently assault wedded females.

This point acquires support from the fact, that we scarcely ever have either read or heard of married women having been defiled by any other than by those who were before accustomed to practices with harlots: so admirably does the toleration of brothels conduce to the protection of the chastity of married women! — And these remarks may suffice against those who either deny that fornication is to be accounted a sin, or say that it is to be tolerated for the sake of avoiding adultery. We have dwelt the longer in opposing fornication, because it has obtained its patrons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1832), 2: 45-46.</span></figcaption>

+to+repress+fornication%2C+yet+he+can+never+wholly+remove+from+human+society+harlots+or+fornicators%2C+no+more+than+he+can+remove+thieves+or+murderers.+Therefore+the+Papists+may+dismiss+this+fear.%0A%0ALastly+we+must+also+add%3B+that+this+remedy+%28the+toleration+of+brothels%29+is+worse+than+even+the+disease+which+is+dreaded.+For+although+adultery+be+in+itself+worse+than+fornication%3B+yet+it+is+worse+for+a+whole+city+to+be+continually+polluted+by+brothels%2C+than+if+it+should+sometimes+happen+that+certain+wedded+women+be+violated.+But+even+this+is+by+no+means+to+be+conceded%3B+that+the+honour+and+chastity+of+married+women+can+be+better+preserved+by+the+permission+of+fornication+than+by+the+severe+punishment+of+it.+For+by+impunity%2C+and+the+continued+habit+of+sinning+we+become+more+daring%3B+and+if+we+have+served+an+apprenticeship+to+lust+among+harlots%2C+becoming+anon+veterans%2C+we+the+more+confidently+assault+wedded+females.%0A%0AThis+point+acquires+support+from+the+fact%2C+that+we+scarcely+ever+have+either+read+or+heard+of+married+women+having+been+defiled+by+any+other+than+by+those+who+were+before+accustomed+to+practices+with+harlots%3A+so+admirably+does+the+toleration+of+brothels+conduce+to+the+protection+of+the+chastity+of+married+women%21+%E2%80%94+And+these+remarks+may+suffice+against+those+who+either+deny+that+fornication+is+to+be+accounted+a+sin%2C+or+say+that+it+is+to+be+tolerated+for+the+sake+of+avoiding+adultery.+We+have+dwelt+the+longer+in+opposing+fornication%2C+because+it+has+obtained+its+patrons.%E2%80%9D%0A%0A%E2%80%94+John+Davenant%2C+An+Exposition+of+the+Epistle+of+St.+Paul+to+the+Colossians%2C+trans.+Josiah+Allport+%281627%3B+2+vols%2C+London%3A+Hamilton%2C+Adams%2C+and+Co.%2C+1832%29%2C+2%3A+45-46.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0cfa6f347b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0cfa6f347b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpr

<main class="wrap"><figure class="quote" id="q-14bfeb384f" data-kw="">
<blockquote><p>God gave to man the charge of this image, as the most excellent deposit of heaven, and, if kept pure and inviolate, the earnest of a greater good; for that end he endued him with sufficient powers from his very formation, so as to stand in need of no other habitual grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank, 2 vols. (Edinburgh: Thomas Turnbull, 1803), 1.2.13.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

— Herman Witsius, The Economy of the Covenants between God and Man, Comprehending a Complete Body of Divinity, trans. William Crookshank, 2 vols. (Edinburgh: Thomas Turnbull, 1803), 1.2.13. (HT: Harrison Perkins)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod+gave+to+man+the+charge+of+this+image%2C+as+the+most+excellent+deposit+of+heaven%2C+and%2C+if+kept+pure+and+inviolate%2C+the+earnest+of+a+greater+good%3B+for+that+end+he+endued+him+with+sufficient+powers+from+his+very+formation%2C+so+as+to+stand+in+need+of+no+other+habitual+grace.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+and+Man%2C+Comprehending+a+Complete+Body+of+Divinity%2C+trans.+William+Crookshank%2C+2+vols.+%28Edinburgh%3A+Thomas+Turnbull%2C+1803%29%2C+1.2.13.+%28HT%3A+Harrison+Perkins%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14bfeb384f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/14bfeb384f.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/03/herman-witsius-against-the-donum-superadditum/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>2nd Point. …whereby we have good light for the expounding of a place in Paul, 1 Cor. 11:10, saying, that the woman ought to have power over her head, that is, be covered, because of the angels. Whereby ‘angels’ may well be understood the preachers and ministers of the Gospel. And the reason of that precept may be this: Among the Corinthians the covering of the head was not as it is with us, a token of preeminence and superiority, but a sign of subjection. And therefore the apostle would have the women of Corinth, when they came into the congregation, to have their heads covered, according to the custom of their country in other assemblies, to signify their submission and reverence unto the ministry of the Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition or Commentary upon the Three First Chapters of the Revelation</cite>, … (d. 1602; London, 1606), ch. 1, pp. 69-70</span></figcaption>

<blockquote><p>If it be said that the best man who lives ties not himself to these rules, in the use of every indifferent thing, but oftimes uses or omits a thing of that nature at his own pleasure. I answer: In many things we offend all. And who can understand his errors? But in the mean time, the rules of the Word limit us so strictly that we may never use a thing in its own nature indifferent at our arbitrament and pleasure, and that the use of it is never lawful to us except it be done piously for God’s glory, profitably for man’s edification and purely with full assurance that that which we do is approved of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, ... ([Leiden] 1637), | pt. 4, ‘Against the Indifferency of the Ceremonies’ | ch. 3, ‘Whether There be Anything Indifferent In Actu Exercito [In the Exercised Act]?’ No., p. 16</span></figcaption>

</figure><figure class="quote" id="q-c3a3be2842" data-kw="">
<blockquote><p>Undoubtedly, in my opinion, no man endued with sound judgment will deny that lights, crosses and trifles of that sort flowed from superstition. Whence I hold, that those who retain them, while they possess liberty of choice, draw too eagerly from dregs. Nor do I see what purpose can be answered by burdening the Church with frivolous and useless (not to call them by their proper name, noxious) ceremonies, where we enjoy the liberty of establishing a pure and simple order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 12, ‘Calvin to Dr. Richard Cox &amp; his Associates at Frankfort’ in Gorham, Gleanings of a Few Scattered Ears</cite>, pp. 346-47 June 12, 1555</span></figcaption>

</figure><figure class="quote" id="q-75f12122c0" data-kw="">
<blockquote><p>…I will set down a catalogue of inventions of men used for religious ends and uses without any commandment of God, and that both before the Law and under the Law, and under the Gospel. First, before the Law we read of these things: The laying of the hand under the thigh in swearing, Gen. 24, etc. [Gen. 24:26, “And the man bowed down his head, and worshipped the Lord.”] Jacob’s pillar erected, as a religious monument, Gen. 28:18. Secondly, under the Law we read of these instances: [Josh. 7:6, “And Joshua rent his clothes, and fell to the earth upon his face before the ark of the Lord until the eventide, he and the elders of Israel, and put dust upon their heads.”] The altar of the two tribes and a half, Josh. 22:10 &amp; 27:30. [Josh. 24:25-27, “So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem. And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that was by the sanctuary of the Lord. And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the Lord which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God.] [1 Sam. 7:5-6, “Samuel said, Gather all Israel to Mizpeh, and I will pray for you unto the Lord. And they gathered together to Mizpeh, and drew water, and poured it out before the Lord, and fasted on that day, and said there, ‘We have sinned against the Lord.&#x27;”] David’s dancing and playing on all sorts of instruments and songs before the ark, 1 Chron. 13:8 and 15:16 and 2 Sam. 6:14. David’s wearing of a linen ephod, the garment of the Levites, 1 Chron. 15:27. David’s appointing of the offices of the Levites and his bringing in of the new order of singing men into the Temple, 1 Chron. 24 &amp; 25. The use of sackcloth and ashes in fasting. Solomon built another altar besides the altar of the Lord, 2 Chron. 7:7. Hezekiah kept the Passeover at a time not appointed by the Law, and the people kept it seven days longer, 2 Chron. 30:2-3, 23. About the celebration of the Passover, it is manifest that the godly Jews brought in of their own heads: 1. The gesture of sitting, which Christ Himself also used. 2. The solemn use of the cup, of which mention is made also that Christ used it, Lk. 22:17. The Rechabites abstinence not only from wine (according to the Law of the Nazarites), but from husbandry and houses, Jer. 35. The Jews had everywhere synagogues, which were not commanded by the Law, Lk. 7:5. [Jer. 34:18-19, “And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts thereof, The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;”] Mordecai appointed the feasts of Pur, or ‘lots’. Judas Maccabeus appointed the feast of Tabernacles, which our Saviour graced with his presence [Jn. 7:2]. Thirdly, under the Gospel: Our Savior Christ approved the gesture of sitting and the cup at the Passover, the Jewish synagogues, and the feast of Tabernacles. The apostle Paul used the Jewish ceremonies when they were no more the ordinances of God, as circumcision, shaving the head, purifying, vowing, contributing, yea sacrificing, Acts 21. Abstaining from meat sacrificed to idols. The observation of the Jewish Sabbath. The women’s coverings, 1 Cor. 11. The love-feasts. The holy kiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter</cite>, ... (London, 1623), on 1 Pet. 2:13, pp. 588-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“…I will set down a catalogue of inventions of men used for religious ends and uses without any commandment of God, and that both before the Law and under the Law, and under the Gospel. First, before the Law we read of these things: The laying of the hand under the thigh in swearing, Gen. 24, etc. [Gen. 24:26, “And the man bowed down his head, and worshipped the Lord.”] Jacob’s pillar erected, as a religious monument, Gen. 28:18. Secondly, under the Law we read of these instances: [Josh. 7:6, “And Joshua rent his clothes, and fell to the earth upon his face before the ark of the Lord until the eventide, he and the elders of Israel, and put dust upon their heads.”] The altar of the two tribes and a half, Josh. 22:10 &amp; 27:30. [Josh. 24:25-27, “So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem. And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that was by the sanctuary of the Lord. And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the Lord which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God.] [1 Sam. 7:5-6, “Samuel said, Gather all Israel to Mizpeh, and I will pray for you unto the Lord. And they gathered together to Mizpeh, and drew water, and poured it out before the Lord, and fasted on that day, and said there, ‘We have sinned against the Lord.&#x27;”] David’s dancing and playing on all sorts of instruments and songs before the ark, 1 Chron. 13:8 and 15:16 and 2 Sam. 6:14. David’s wearing of a linen ephod, the garment of the Levites, 1 Chron. 15:27. David’s appointing of the offices of the Levites and his bringing in of the new order of singing men into the Temple, 1 Chron. 24 &amp; 25. The use of sackcloth and ashes in fasting. Solomon built another altar besides the altar of the Lord, 2

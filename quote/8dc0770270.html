<main class="wrap"><figure class="quote" id="q-8dc0770270" data-kw="">
<blockquote><p>If the original law required perfect obedience, could it be abrogated, or even relaxed, otherwise than by God’s authority? If it was not abrogated, but republished, at Sinai, was it relaxed by Christ, when He repeated it, saying, ‘Thou shalt love the Lord thy God with all thine heart, and thou shalt love thy neighbour as thyself,—for on these two commandments hang all the law and the prophets,’ or when He expounded its spiritual meaning in His sermon on the mount? Did He come to abrogate, or relax, that eternal rule of righteousness, of which He said,—‘I am not come to destroy the law and the prophets, but to fulfil,’—‘Heaven and earth shall pass away, but one jot or one tittle shall in no wise pass from the law till all be fulfilled?’ Or did His Apostles exceed their commission when they said, ‘Do we then make void the law through faith? God forbid! yea, we establish the law?’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification: An Outline of Its History in the Church and of Its Exposition from Scripture</cite>, (Edinburgh: T&amp;T Clark, 1867), 286.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2e2cadc264" data-kw="">

</figure><figure class="quote" id="q-33512f2508" data-kw="">
<blockquote><p>What call you the Judicial Law? That wherein God appointed a form of politic and civil government of the commonwealth of the Jews, which therefore is ceased with the dissolution of that State, for which it was ordained; saving only in the common equity. Is this law utterly revoked and abolished by Christ? No; for He came not to overturn any good government of the commonwealth, much less that which was appointed by God Himself. May not Christian Magistrates then swerve any thing from those laws of government, which were set down by Moses? In some circumstances they may, but in the general equity and substance they may not. What Judicial laws are immutably to be observed now of Christian Magistrates? Those which have reasons annexed unto thēm and specially those wherein God has appointed death for the punishment of heinous offenses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: Or, the Sum and Substance of Christian Religion, Eighth Edition</cite>, … (London, 1645), p. 204</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<main class="wrap"><figure class="quote" id="q-517e935f34" data-kw="">
<blockquote><p>10. Therefore our bare presence is no signification that we approve all that is done in that assembly. The very nature of Christian communion is a profession of the contrary: we being bound by God to communicate in good and not to own the evil. And if men command us to own all that they there do, their command cannot bind us against God’s, nor make our presence a profession that we obey them against God: it being God that is the Master of us and our work, and Christianity itself being a profession that we obey God before man. Else man by commanding us to own some ill word or circumstance might drive us from all Christian communion. If men should command us in our private meetings to do it for an ill end or an ill principle (as in obedience to usurpers [such as Oliver Cromwell in the 1650’s]) we must not therefore forbear all private meetings, nor will our bare meeting signify our obedience to such commands. If the pastor of a single church (or many associated) tell the people, ‘Your meeting must be to own e.g. Anabaptistry, Antinomianism, Presbytery, Erastianism, Separation, etc.’ this binds them not either to own it or to withdraw without some greater reason. He is no master of their faith.

11. Nor will the bare knowing beforehand that the pastor will say or do somewhat unlawful[ly] make our presence guilty of approving it. We know beforehand that we and all men are sinners, and shall sin in what we do: And we may suppose men will speak as they think: And as we know not but any man may speak amiss till we hear what he says, so when we know that the pastors have tolerable errors, and will vent them, it will not make us guilty of their sin, nor bind us to depart: We meet to own Christianity and not all that the man will say or do (known or unknown). I know before that I shall have many faults in my own prayer (disorder, dullness, etc.) which I do not own, though herein I am guilty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Bare Presence does not Imply Complete Approval</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a1e1b611b" data-kw="">
<blockquote><p>I would add a similitude [It was actually a real and common scenario in that era]: Supposing that we had just possession of the public church-places and tithes, and they are taken from us, and we can blame them that did it and say over and over, ‘We had possession;’ and therefore it is unlawful to meet in worse rooms, for God must have the best: will this hold when you cannot keep possession? Will you rather worship nowhere? This is no better than if you would tell all men they should die rather than eat brown bread, if force take all other [food] from them, because it is unjustly done and they had possession of better. Good friends, keep your possession for me, but I own not the famishing of all that are dispossessed. If you do, I do not.</p></blockquote>

</figure><figure class="quote" id="q-951a1cfe7c" data-kw="">
<blockquote><p>Me thinks it is somewhat a strange kind of reasoning, because the rod of discipline is wanting [lacking], the children should be denied bread; yea, but you will say, dogs will eat the children’s bread: Why, will you therefore starve the children because dogs without your default may snatch the children’s portion? Shall the children be debarred (as I may say) their daily bread, because it will become accidentally poison unto dogs?… As it is better for God’s sheep to feed upon pasture where some weeds grow rather than starve for want [lack] of food: So it is better for God’s shepherds to suffer some weeds to grow in the sheeps’ pastures if they cannot prevent it, than to starve their flocks; yea, and as it is better for the sheep to feed among goats rather than starve, so it is better the shepherds should suffer the goats to feed upon the sheeps’ pasture though it should poison them, than for the sheep to be kept from it;</p></blockquote>

<blockquote><p>He contains the holiness of all creatures put together and infinitely more. As all the wisdom, excellency and power of the creatures, if compared with the wisdom, excellency and power of God, is but folly, vileness and weakness; so the highest created purity, if set in parallel with God, is but impurity and uncleaness. Rev. 15:4, ‘Thou only art Holy:’ ‘Tis like the light of a glow-worm to that of the Sun; ‘The heavens are not pure in his sight, and his angels He charged with folly,’ Job 4:18; 15:15. Though God has crowned the angels with an unspotted sanctity and placed them in a habitation of glory, yet as illustrious as they are, they have an unworthiness in their own nature to appear before the throne of so holy a God; Their holiness grows dim and pale in his presence. ‘Tis but a weak shadow of that divine purity, whose light is so glorious that it makes them cover their faces out of weakness to behold it, and cover their feet out of shame in themselves [Isa. 6]. They are not ‘pure in his sight’ because though they love God (which is a principle of holiness) as much as they can, yet not so much as He deserves: They love Him with the intensest degree, according to their power, but not with the intensest degree, according to his own amiableness: For they cannot infinitely love God, unless they were as infinite as God, and had an understanding of his perfections equal with Himself, and as immense as his own knowledge. God having an infinite knowledge of Himself, can only have an infinite love to Himself, and consequently an infinite holiness without any defect; because He loves Himself according to the vastness of his own amiableness, which no finite being can. Therefore, though the angels be exempt from corruption and soil, they cannot enter into comparison with the purity of God, without acknowledgment of a dimness in themselves. Besides, ‘He charges them with folly,’ and ‘puts no trust in them,’ because they have the power of sinning, though not the act of sinning: They have a possible folly in their own nature to be charged with. Holiness is a quality separable from them, but it is inseparable from God. Had they not at first a mutability in their nature, none of them could have sinned, there had been no devils; but because some of them sinned, the rest might have sinned: And though the standing angels shall never be changed, yet they are still changeable in their own nature, and their standing is due to grace, not to nature; and though they shall be forever preserved, yet they are not, nor ever can be immutable by nature, for then they should stand upon the same bottom with God Himself; but they are supported by grace against that changeableness of nature which is essential to a creature: The Creator ‘only hath immortality,’ that is, immutability (1 Tim. 3:16).</p></blockquote>

ave the power of sinning, though not the act of sinning: They have a possible folly in their own nature to be charged with. Holiness is a quality separable from them, but it is inseparable from God. Had they not at first a mutability in their nature, none of them could have sinned, there had been no devils; but because some of them sinned, the rest might have sinned: And though the standing angels shall never be changed, yet they are still changeable in their own nature, and their standing is due to grace, not to nature; and though they shall be forever preserved, yet they are not, nor ever can be immutable by nature, for then they should stand upon the same bottom with God Himself; but they are supported by grace against that changeableness of nature which is essential to a creature: The Creator ‘only hath immortality,’ that is, immutability (1 Tim. 3:16).”

iableness%2C+which+no+finite+being+can.+Therefore%2C+though+the+angels+be+exempt+from+corruption+and+soil%2C+they+cannot+enter+into+comparison+with+the+purity+of+God%2C+without+acknowledgment+of+a+dimness+in+themselves.+Besides%2C+%E2%80%98He+charges+them+with+folly%2C%E2%80%99+and+%E2%80%98puts+no+trust+in+them%2C%E2%80%99+because+they+have+the+power+of+sinning%2C+though+not+the+act+of+sinning%3A+They+have+a+possible+folly+in+their+own+nature+to+be+charged+with.+Holiness+is+a+quality+separable+from+them%2C+but+it+is+inseparable+from+God.+Had+they+not+at+first+a+mutability+in+their+nature%2C+none+of+them+could+have+sinned%2C+there+had+been+no+devils%3B+but+because+some+of+them+sinned%2C+the+rest+might+have+sinned%3A+And+though+the+standing+angels+shall+never+be+changed%2C+yet+they+are+still+changeable+in+their+own+nature%2C+and+their+standing+is+due+to+grace%2C+not+to+nature%3B+and+though+they+shall+be+forever+preserved%2C+yet+they+are+not%2C+nor+ever+can+be+immutable+by+nature%2C+for+then+they+should+stand+upon+the+same+bottom+with+God+Himself%3B+but+they+are+supported+by+grace+against+that+changeableness+of+nature+which+is+essential+to+a+creature%3A+The+Creator+%E2%80%98only+hath+immortality%2C%E2%80%99+that+is%2C+immutability+%281+Tim.+3%3A16%29.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+Several+Discourses+upon+the+Existence+%26+Attributes+of+God+%28London%2C+1682%29%2C+%E2%80%98On+the+Holiness+of+God%E2%80%99%2C+p.+500&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d66026f83.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d66026f83.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=He%20contains%20the%20holiness%20of%20all,that%20is%2C%20immutability%20%281%20Tim.%203%3A16&amp;text=He%20contains%20the%20holiness%20of%20all%20creatures%20put&amp;text=hath%20immortality%2C%E2%80%99%20that%20is%2C%20immutability%20%281%20Tim.%203%3A16" rel="noopener" <blockquote><p>My partaking in any divine worship which is holy and good for the matter, and allowable or passable for the mode in the main, does not involve me in the blame of some sinful defects therein, to which I consent not, and which I cannot redress.

2. I do not acquiesce in this form of worship only, nor do I by my example induce others so to do, seeing in other congregations I both dispense and attend upon the Word and prayer in another form, and judge it necessary for me so to do.

3. It is to me indubitable that this form is so far profitable and edifying, as that merely for the defects found therein, there is no cause of renouncing it or the communion of the Churches for its sake, especially while other prayer and the preaching of the Word is not there by excluded. … I would give no occasion to any of disowning or reproaching a form of divine worship which is sound in the substance thereof, and accepted of God from the sincere, though it be less perfect in diverse material points and less convenient for the mode.</p></blockquote>

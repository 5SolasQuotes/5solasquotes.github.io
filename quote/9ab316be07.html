<main class="wrap"><figure class="quote" id="q-9ab316be07" data-kw="">
<blockquote><p>1. Where persons are esteemed members of churches by external causes without their own consent, or by parochial cohabitation, they may remove from one church unto another by the removal of their habitation according unto their own discretion. For such cohabitation being the only formal cause of any relation to such a church in particular, upon the ceasing of that cause, the relation ceases of its own accord.

2. Where persons are members of churches by mutual confederation, or express personal consent, causeless departure from them is an evil liable unto many aggravations.

3. But whereas the principal end of all particular churches is edification, there may be many just and sufficient reasons why a person may remove himself from the constant communion of one church unto that of another. And of these reasons he himself is judge on whom it is incumbent to take care of his own edification above all other things. Nor ought the church to deny unto any such persons their liberty desired, peaceably and according unto order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, … (London, 1689), ch. 10, pp. 225-26 Owen was a congregationalist puritan.</span></figcaption>

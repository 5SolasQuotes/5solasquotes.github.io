<blockquote><p>Whatever sparks of goodness any creature has are the free effusions of God’s bounty, the offspring of his own inclination to do well, the simple favor of the donor; not purchased, not merited by the creature. God is as unconstrained in his liberty in all his communications as infinite in his goodness, the fountain of them.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5dc100afcf" data-kw="">
<blockquote><p>The words of the apostle, ‘God will have all men to be saved, etc.’ [1 Tim. 2:4] can be understood in three ways: Third, according to [John] Damascene (Of the Orthodox Faith, 2.29), they are understood of the antecedent will of God; not of the consequent will. This distinction must not be taken as applying to the divine will itself, in which there is nothing antecedent nor consequent, but to the things willed. To understand this we must consider that everything, in so far as it is good, is willed by God. A thing taken in its primary sense, and absolutely considered, may be good or evil, and yet when some additional circumstances are taken into account, by a consequent consideration may be changed into the contrary. Thus that a man should live is good; and that a man should be killed is evil, absolutely considered. But if in a particular case we add that a man is a murderer or dangerous to society, to kill him is a good; that he live is an evil. Hence it may be said of a just judge, that antecedently he wills all men to live; but consequently wills the murderer to be hanged. In the same way God antecedently wills all men to be saved, but consequently wills some to be damned, as His justice exacts. Nor do we will simply, what we will antecedently, but rather we will it in a qualified manner; for the will is directed to things as they are in themselves, and in themselves they exist under particular qualifications. Hence we will a thing simply inasmuch as we will it when all particular circumstances are considered; and this is what is meant by willing consequently. Thus it may be said that a just judge wills simply the hanging of a murderer, but in a qualified manner he would will him to live, to wit, inasmuch as he is a man. Such a qualified will may be called a willingness rather than an absolute will. Thus it is clear that whatever God simply wills takes place; although what He wills antecedently may not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, quest. 19</cite>, article 6, Whether the will of God is always fulfilled?, reply to objection 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-1fa2e2b5f2" data-kw="">
<blockquote><p>‘The Lord is well pleased.’… This passage is interpreted in various ways. Some render it, “The Lord has so willed it;” others, “He is merciful;” but, for my own part, I have translated it, “The Lord is willing,” that is, disposed and inclined to deliver his people, and that for the purpose of magnifying his Law and extolling his righteousness. Thus God assigns the reason why He is ready to aid those who are unworthy, that He wishes to spread his glory in their salvation, that in this manner his righteousness may be illustriously displayed, and that his Law may prevail and flourish. As to the heavy calamities that have come on the Jews, the reason is, that of their own accord they have resolved to be blind, and to bring afflictions on themselves, instead of obeying God; for otherwise the Lord would have wished to enrich and exalt them…. Others render it, “For his righteous one,” and refer it to Christ; but they mistake the meaning of the word צדקו, (tzidko) and unquestionably He speaks of righteousness, and means that the Lord would willingly have displayed the magnificence of his promises: and would have given proofs of his righteousness in preserving his people, if they had not shown themselves to be ungrateful and unworthy. Some think that the Lord here offers an excuse for Himself, because, when the people whom He had adopted were exposed to so many evils, it appeared as if his truth were shaken, and that the prophet intended to meet this calumny, for they were seized and became a prey, not because the Lord delights in their miseries, but because He prefers his righteousness to everything else. For my own part, I explain it simply to mean, “The Lord, for the sake of doing honor to his Law, was inclined to do good to his people, in order that his glory and righteousness might shine forth in it; but his people showed themselves to be unworthy of so great a favor; and, therefore, by their own obduracy they made their wounds incurable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 42, verse 21, “The Lord is well pleased for his righteousness’ sake; he will magnify the law, and make it honourable.”</span></figcaption>

</figure><figure class="quote" id="q-359936c78b" data-kw="">
<blockquote><p>Moreover, [Iain] Murray thinks God’s universal love necessarily entails that God desires the highest good (i.e. the eternal salvation) of all men in the revealed will… this also answers the Gillite [from John Gill] position that God loves all merely in a temporal sense, but doesn’t desire their highest good, or in the sense of their eternal salvation.</p></blockquote>

<blockquote><p>The promise of the gospel is that whosoever believes in Christ crucified shall not perish, but have eternal life. This promise, together with the command to repent and believe, ought to be declared and published to all nations, and to all persons promiscuously and without distinction, to whom God out of His good pleasure sends the gospel.</p></blockquote>

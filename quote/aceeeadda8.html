<main class="wrap"><figure class="quote" id="q-aceeeadda8" data-kw="">
<blockquote><p>Now in all these commands, as their subject matter consists of things forbidden in the ten Commandments, as blasphemy, Apostasy, Witchcraft, Profanation of the Sabbath, etc. So that the commands for punishing such (for the substance of them), are moral too of common reason and equity, given to all Nations, and for all ages […]

For the first, let the Reader lay together these particulars I. that tis evident some of these commands, as against offering their children to Molech, as against dealing and contracting with a familiar Spirit deserve punishing among Christians and under the Gospel now, as well as under the Law, and if these, why not the other of Blasphemy, Idolatry, false prophecy, &amp;c? These latter are of moral things as well as the other; the first and these are delivered both by Moses in the same books, time, propounded after the same tenor and way, upon the same grounds and reasons […]

But if it be said those commands against offering their seed to Molech and of witches, are therefore punished by the magistrate, because they offend against lives and estates of mankind, in killing the children, in cattle being killed, and men’s bodies being hurt by witches and wizards, which is not the other of Apostasy, Blasphemy, &amp;c. I reply, tis to be observed that in all those places where the commands are given by God to the Magistrate about these, there’s not one jot or tittle expressed about offending against the second Table in life or goods, but all the reason formally declared, is, because against God immediately, and the commands of the first Table […]

Secondly, these commands to the Magistrate concerning Idolaters, Blasphemers, &amp;c. were not for the punishing of Israelites, the Jewish people only, but of all strangers in their Land, both of Proselytes that dwelt among them, and of others that only travelled through, or were there a while upon trading or such like occasions as these Scriptures show [he cites Lev. 20:2; 24:16] […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The casting down of the last stronghold of Satan: a treatise against toleration and pretended liberty of conscience</cite>, (London, 1647), pp 46-9.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>

</figure><figure class="quote" id="q-35fe3c05b1" data-kw="">

</figure><figure class="quote" id="q-60a3d18681" data-kw="">
<blockquote><p>Those things, and Persons which Heathen Kings, Magistrates, Nations and Idolaters themselves, by the very light of nature, thought fit to punish with corporal and capital punishments; all Christian Kings, Magistrates, Nations, ought much more to censure in this kind.

But Heathen Kings, Magistrates, Nations, and Idolaters themselves, by the very light of nature, have thought fit to punish with corporal and capital punishments, such as adored not those Idol-gods which they worshipped and reputed for the true; and such as they deemed Idolaters, Apostates, Heretics, Schismatics, Blasphemers, and open Rebels against God.

Therefore Christian Kings, Magistrates, Nations under the Gospel, ought much more to do it.

The Major is evident by its own light, and ratified by ROM. 2. 14, 15. The Minor I shall make good by Scripture testimonies. I shall begin with King Artaxerxes his Commission to Ezra, c: 7. 15; 26. And thou Ezra after the wisdom of thy God, that is in thine hand, set Magistrates and Judges which may judge all the people which are beyond the river; all such as know the Law of thy God: And whosoever WILL NOT DO THE LAW OF THY GOD, and the law of the King, let judgement be executed speedily upon him, WHETHER IT BE TO DEATH, OR TO BANISHMENT, OR TO CONFISCATION OF GOODS, OR TO IMPRISONMENT.

Shall a mere Heathen King be so zealous as to enjoin the Judges and Magistrates under him, to inflict these corporal and capital censures upon such as will not do the Law of God; in which number all Idolaters, Apostates, Heretics, Blasphemers, &amp;c. are included; and shall not Christian Princes, Magistrates, Judges much more exceed him in their zeal and justice against such transgressors of Gods Law?

But that Decree of Nebuchadnezzar against blasphemers of God, is more emphatical, and pathetical: DAN. 3. 28, 29. Then Nebuchadnezzar spake and said, blessed be the Lord God of Shadrach, Mesach, and Abednego, who hath sent his Angel and delivered his servants that trusted in him &amp;c. Therefore I make a Decree, that every people, nation, and language WHICH SPEAK ANY ERROR (or any thing amiss) AGAINST THE GOD of Shadrach, Meshach, and Abednego, SHALL BE CUT IN PIECES, and THEIR HOUSES SHALL BE MADE A DUNGHILL, because there is no God that can deliver after this sort.

If this Pagan King out of his transcendent zeal, upon the sight but of one miracle, was stirred up without any debates or delay, to make such a severe decree as this, against all those of every people, nation, and language that did speak any Error or Blasphemy against the true God, whom these three worthies then, and we now worship: shall not this decree of his rise up in Judgement against all those Christian Princes, Parliaments, Magistrates, Judges under the Gospel, who profess themselves the worshippers, servants, children of this true God; and yet shall refuse, or neglect to make such strict and severe Decrees against such Heretics and Blasphemers, who maliciously belch out most execrable blasphemies, and Errors against God himself, and openly maintain them in discourse and writing?

[B]ut especially against those who pretend and stile themselves the ONLY SAINTS and SERVANTS OF GOD (how truly let this one act alone declare) who professedly plead, preach, and write against the Corporal and Capital Punishment of such damnable Heretics, Blasphemers, and the enacting of any severe Laws against them by the Parliament and civil Magistrates, when as this Pagan King by his Decree commanded such, to be instantly cut in pieces and their houses to be made a dunghill, without any pity or pardon? Were Pagan Nebuchadnezzar now alive amongst us, he would new heat his Fiery Furnace to warm the kay-cold frozen zeal of such heatless New-Lights, and zeal-less Saints as these; or shame them into an emulation of his zeal against such Heretics and Blasphemers. …

For as the very light of Nature instructs all Nations that there is a God, and instigates them to elect and adore some Deity or other as their God and Saviour:

So it farther instructs them, that that Deity they adore, and that Religion they embrace is no ways to be openly blasphemed, reviled, oppugned, contemned, under pain of the most severe capital punishments, because such offences against the supremest Majesty of God transcend any Treason against an earthly Sovereign: whence most Laws and Nations have made them capital, and by the light of Nature in all ages punished such whom they esteemed Atheists, Heretics, Blasphemers of their gods, or oppugners of their established Religion, with no less then capital Punishments and the severest Censures, as is evident by these Scripture instances, and sundry other. …

Whence I conclude, that what Pagan Kings, Magistrates, Nations have usually punished with corporal, or capital punishments, and restrained by Civil Laws in all ages out of the light of Nature; that Christian Kings, Magistrates, and Nations under the Gospel may lawfully punish in like sort, even by the principles of Nature too, had they no other Divine Law to warrant them, as they have: ‘Tis true, most of these erred in the object, in deeming that Heresy, Schism, Blasphemy, Error, which was not; not in the punishment, had the object been such as they really deemed it, and such as we here dispute of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The sword of Christian magistracy supported, or, A vindication of the Christian magistrate’s authority under the Gospel, to punish idolatry, apostacy, heresy, blasphemy, and obstinate schism, with corporal, and in some cases with capital punishments</cite>, (London: John Bellamy, 1653), pp 14-15, 18, 19.</span></figcaption>

Whence I conclude, that what Pagan Kings, Magistrates, Nations have usually punished with corporal, or capital punishments, and restrained by Civil Laws in all ages out of the light of Nature; that Christian Kings, Magistrates, and Nations under the Gospel may lawfully punish in like sort, even by the principles of Nature too, had they no other Divine Law to warrant them, as they have: ‘Tis true, most of these erred in the object, in deeming that Heresy, Schism, Blasphemy, Error, which was not; not in the punishment, had the object been such as they really deemed it, and such as we here dispute of.”

— William Prynne, The sword of Christian magistracy supported, or, A vindication of the Christian magistrate’s authority under the Gospel, to punish idolatry, apostacy, heresy, blasphemy, and obstinate schism, with corporal, and in some cases with capital punishments, (London: John Bellamy, 1653), pp 14-15, 18, 19.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+things%2C+and+Persons+which+Heathen+Kings%2C+Magistrates%2C+Nations+and+Idolaters+themselves%2C+by+the+very+light+of+nature%2C+thought+fit+to+punish+with+corporal+and+capital+punishments%3B+all+Christian+Kings%2C+Magistrates%2C+Nations%2C+ought+much+more+to+censure+in+this+kind.%0A%0ABut+Heathen+Kings%2C+Magistrates%2C+Nations%2C+and+Idolaters+themselves%2C+by+the+very+light+of+nature%2C+have+thought+fit+to+punish+with+corporal+and+capital+punishments%2C+such+as+adored+not+those+Idol-gods+which+they+worshipped+and+reputed+for+the+true%3B+and+such+as+they+deemed+Idolaters%2C+Apostates%2C+Heretics%2C+Schismatics%2C+Blasphemers%2C+and+open+Rebels+against+God.%0A%0ATherefore+Christian+Kings%2C+Magistrates%2C+Nations+under+the+Gospel%2C+ought+much+more+to+do+it.%0A%0AThe+Major+is+evident+by+its+own+light%2C+and+ratified+by+ROM.+2.+14%2C+15.+The+Minor+I+shall+make+good+by+Scripture+testimonies.+I+shall+begin+with+King+Artaxerxes+his+Commission+to+Ezra%2C+c%3A+7.+15%3B+26.+And+thou+Ezra+after+the+wisdom+of+thy+God%2C+that+is+in+thine+hand%2C+set+Magistrates+and+Judges+which+may+judge+all+the+people+which+are+beyond+the+river%3B+all+such+as+know+the+Law+of+thy+God%3A+And+whosoever+WILL+NOT+DO+THE+LAW+OF+THY+GOD%2C+and+the+law+of+the+King%2C+let+judgement+be+executed+speedily+upon+him%2C+WHETHER+IT+BE+TO+DEATH%2C+OR+TO+BANISHMENT%2C+OR+TO+CONFISCATION+OF+GOODS%2C+OR+TO+IMPRISONMENT.%0A%0AShall+a+mere+Heathen+King+be+so+zealous+as+to+enjoin+the+Judges+and+Magistrates+under+him%2C+to+inflict+these+corporal+and+capital+censures+upon+such+as+will+not+do+the+Law+of+God%3B+in+which+number+all+Idolaters%2C+Apostates%2C+Heretics%2C+Blasphemers%2C+%26c.+are+included%3B+and+shall+not+Christian+Princes%2C+Magistrates%2C+Judges+much+more+exceed+him+in+their+zeal+and+justice+against+such+transgressors+of+Gods+Law%3F%0A%0ABut+that+Decree+of+Nebuchadnezzar+against+blasphemers+of+God%2C+is+more+emphatical%2C+and+pathetical%3A+DAN.+3.+28%2C+29.+Then+Nebuchadnezzar+spake+and+said%2C+blessed+be+the+Lord+God+of+Shadrach%2C+Mesach%2C+and+Abednego%2C+who+hath+sent+his+Angel+and+delivered+his+servants+that+trusted+in+him+%26c.+Therefore+I+make+a+Decree%2C+that+every+people%2C+nation%2C+and+language+WHICH+SPEAK+ANY+ERROR+%28or+any+thing+amiss%29+AGAINST+THE+GOD+of+Shadrach%2C+Meshach%2C+and+Abednego%2C+SHALL+BE+CUT+IN+PIECES%2C+and+THEIR+HOUSES+SHALL+BE+MADE+A+DUNGHILL%2C+because+there+is+no+God+that+can+deliver+after+this+sort.%0A%0AIf+this+Pagan+King+out+of+his+transcendent+zeal%2C+upon+the+sight+but+of+one+miracle%2C+was+stirred+up+without+any+debates+or+delay%2C+to+make+such+a+severe+decree+as+this%2C+against+all+those+of+every+people%2C+nation%2C+and+language+that+did+speak+any+Error+or+Blasphemy+against+the+true+God%2C+whom+these+three+worthies+then%2C+and+we+now+worship%3A+shall+not+this+decree+of+his+rise+up+in+Judgement+against+all+those+Christian+Princes%2C+Parliaments%2C+Magistrates%2C+Judges+under+the+Gospel%2C+who+profess+themselves+the+worshippers%2C+servants%2C+children+of+this+true+God%3B+and+yet+shall+refuse%2C+or+neglect+to+make+such+strict+and+severe+Decrees+against+such+Heretics+and+Blasphemers%2C+who+maliciously+belch+out+most+execrable+blasphemies%2C+and+Errors+against+God+himself%2C+and+openly+maintain+them+in+discourse+and+writing%3F%0A%0A%5BB%5Dut+especially+against+those+who+pretend+and+stile+themselves+the+ONLY+SAINTS+and+SERVANTS+OF+GOD+%28how+truly+let+this+one+act+alone+declare%29+who+professedly+plead%2C+preach%2C+and+write+against+the+Corporal+and+Capital+Punishment+of+such+damnable+Heretics%2C+Blasphemers%2C+and+the+enacting+of+any+severe+Laws+against+them+by+the+Parliament+and+civil+Magistrates%2C+when+as+this+Pagan+King+by+his+Decree+commanded+such%2C+to+be+instantly+cut+in+pieces+and+their+houses+to+be+made+a+dunghill%2C+without+any+pity+or+pardon%3F+Were+Pagan+Nebuchadnezzar+now+alive+amongst+us%2C+he+would+new+heat+his+Fiery+Furnace+to+warm+the+kay-cold+frozen+zeal+of+such+heatless+New-Lights%2C+and+zeal-less+Saints+as+these%3B+or+shame+them+into+an+emulation+of+his+zeal+against+such+Heretics+and+Blasphemers.+%E2%80%A6%0A%0AFor+as+the+very+light+of+Nature+instructs+all+Nations+that+there+is+a+God%2C+and+instigates+them+to+elect+and+adore+some+Deity+or+other+as+their+God+and+Saviour%3A%0A%0ASo+it+farther+instructs+them%2C+that+that+Deity+they+adore%2C+and+that+Religion+they+embrace+is+no+ways+to+be+openly+blasphemed%2C+reviled%2C+oppugned%2C+contemned%2C+under+pain+of+the+most+severe+capital+punishments%2C+because+such+offences+against+the+supremest+Majesty+of+God+transcend+any+Treason+against+an+earthly+Sovereign%3A+whence+most+Laws+and+Nations+have+made+them+capital%2C+and+by+the+light+of+Nature+in+all+ages+punished+such+whom+they+esteemed+Atheists%2C+Heretics%2C+Blasphemers+of+their+gods%2C+or+oppugners+of+their+established+Religion%2C+with+no+less+then+capital+Punishments+and+the+severest+Censures%2C+as+is+evident+by+these+Scripture+instances%2C+and+sundry+other.+%E2%80%A6%0A%0AWhence+I+conclude%2C+that+what+Pagan+Kings%2C+Magistrates%2C+Nations+have+usually+punished+with+corporal%2C+or+capital+punishments%2C+and+restrained+by+Civil+Laws+in+all+ages+out+of+the+light+of+Nature%3B+that+Christian+Kings%2C+Magistrates%2C+and+Nations+under+the+Gospel+may+lawfully+punish+in+like+sort%2C+even+by+the+principles+of+Nature+too%2C+had+they+no+other+Divine+Law+to+warrant+them%2C+as+they+have%3A+%E2%80%98Tis+true%2C+most+of+these+erred+in+the+object%2C+in+deeming+that+Heresy%2C+Schism%2C+Blasphemy%2C+Error%2C+which+was+not%3B+not+in+the+punishment%2C+had+the+object+been+such+as+they+really+deemed+it%2C+and+such+as+we+here+dispute+of.%E2%80%9D%0A%0A%E2%80%94+William+Prynne%2C+The+sword+of+Christian+magistracy+supported%2C+or%2C+A+vindication+of+the+Christian+magistrate%E2%80%99s+authority+under+the+Gospel%2C+to+punish+idolatry%2C+apostacy%2C+heresy%2C+blasphemy%2C+and+obstinate+schism%2C+with+corporal%2C+and+in+some+cases+with+capital+punishments%2C+%28London%3A+John+Bellamy%2C+1653%29%2C+pp+14-15%2C+18%2C+19.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F60a3d18681.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/60a3d18681.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/02/william-prynne-on-the-light-of-nature-and-civil-penalties-against-first-table-violations/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>As for the rest of the testimonies Dr. Burgess produces out of the Fathers for kneeling, I need not insist upon them for either they speak of the inward adoration of the heart, which we ought to direct unto Christ when we receive the Sacrament (and this none of us denies), or else they speak of adoring the sacrament: where by the word ‘adoration’ we may not understand any divine worship, inward or outward, but a reverence of another nature, called veneration. That this (which we deny not neither) and no more is meant by the Fathers when they speak of the adoration of the sacrament, Antonius de Dominis shows more copiously (Rep. Eccl., bk. 5, ch. 6).</p></blockquote>

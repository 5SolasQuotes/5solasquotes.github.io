<main class="wrap"><figure class="quote" id="q-a4810c40f0" data-kw="">
<blockquote><p>Were, then, the whole world unanimous, and were the minds of all men united together, still what would proceed from them, would be private or their own; for the word is here set in opposition to divine revelation; so that the faithful, inwardly illuminated by the Holy Spirit, acknowledge nothing but what God says in his word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 2 Peter 1:20</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8eab3242bd" data-kw="">
<blockquote><p>Therefore, let this remain as a most sure maxim, that no doctrine is worthy to be believed but that which we find to be grounded in the Scriptures. The Pope will have all that received without any more ado, whatsoever he doth blunder out at his pleasure; but shall he be preferred before Paul, concerning whose preaching it was lawful for the disciples to make inquisition?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Acts</cite>, Acts 17:11</span></figcaption>

</figure><figure class="quote" id="q-c75d8d272c" data-kw="">
<blockquote><p>Therefore he declares that the most precise norm, canon, or rule of faith is not the Scripture but the judgment of the church. … In his Hierarchiae ecclesiasticae assertio (Bk. 1, ch. 2), Pighius says that the apostles wrote some things not in order that these writings should rule over our faith and religion but rather that they should be subject to them. … the Holy Scripture is the most certain rule of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 1, Concerning Sacred Scripture</span></figcaption>

</figure><figure class="quote" id="q-694d9cd5ae" data-kw="">
<blockquote><p>Further, he took upon him power, rule, and authority over the Christian church, and over the Holy Scriptures, the Word of God; … They who, against God&#x27;s Word, boast of the church&#x27;s authority, are mere idiots. The pope attributes more power to the church, which is begotten and born, than to the Word, which has begotten, conceived, and borne the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Table Talk</cite>, Of the Pope, CCCCLIII, p. 269</span></figcaption>

</figure><figure class="quote" id="q-12c2017005" data-kw="">
<blockquote><p>The fact that all the true people of God in every age and in every part of the Church, in the exercise of their private judgment, in accordance with the simple rules above stated, agree as to the meaning of Scripture in all things necessary either in faith or practice, is a decisive proof of the perspicuity of the Bible, and of the safety of allowing the people the enjoyment of the divine right of private judgment.</p></blockquote>

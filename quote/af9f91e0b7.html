<main class="wrap"><figure class="quote" id="q-af9f91e0b7" data-kw="">
<blockquote><p>The primary elements of a good character are good principles. Not that good principles necessarily imply a good character; for experience proves that passion often neutralizes their influence; but a truly good character does necessarily involve good principles. Let a system of false opinions in respect to religion once gain possession of any mind, and what can you expect but that from this bitter fountain will issue streams of corruption and death?

Hence it is that those evil men who corrupt and destroy the young, are exceedingly apt to assail, first, their religious principles; not doubting, if they can gain a victory here, that they shall be able, without difficulty, to storm the citadel of the heart. To this end, they often make the great truths of religion the subject of conversation; assailing them with sophistry on the one hand, and ridicule on the other. They thrust into their hands books and newspapers, to occupy their leisure, which are artfully designed to unhinge their moral and religious principles.

And not unfrequently this malignant agency is exerted in a covert manner; and the youth is brought in contact with these vehicles of death, and has actually begun to extract the poison, before he is aware of it In short, every means of corrupting the principles of the young which the ingenuity of man can devise has been and still is employed; and that too by persons of every rank, from the highest to the lowest in the community.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-sprague.html">William Sprague</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Young People (3rd edn, New York: D. Appleton &amp; Co., 1835), pp 61-62.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life.html">The Christian Life</a></span></div>

1e0b7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/15/william-buell-sprague-on-the-importance-of-good-principles-to-good-character/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fd4f2691ea" data-kw="">
<blockquote><p>For the preaching of error is like the selling of poisoned pestied [sic] bread, that slays the eater of it, and infects with the breath every man that comes near hand; and albeit the Lord hath brought in wholesome food in his house, and lies held his table long covered, yet the malice of Satan, and the business of the Pope to recover his kingdom, and the dalliance of worldly men, lies set instruments on foot to trouble our Church again; and God, in his deep wisdom and justice, has suffered, the matter to go that far on, that we might see what a fearful sin it was to put the keys of the house of God in wrong hands, and what evil freicks [sic], errors in discipline would bring forth, and also that he might punish the unsanctified and proud wits of men that would take upon them to govern his Kirk, as also he would have these ministers in this land corrected for their negligence who are like the rest of the country, who thinks of arms whilst they are in peace. So have we done. In time of peace we were all secure, and dreamed not of straits, and studied for no more but to get any sermon in the week; yet blessed be our God, who has also many painful and faithful servants as will be sufficient to clear his truth of his Kirk against all that will say the contrary.</p></blockquote>

fd4f2691ea.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/10/08/david-dickson-on-the-danger-of-poisonous-error/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8baea0ae14" data-kw="">
<blockquote><p>Another means to be used diligently for the promoting the life of faith, is, examination of our state and ways, according to the word of God; whether we be, at present, in a state of sin and wrath, or of grace and salvation; that, if we be in a state of sin we may know our sickness, and come to the great physician, while it is called to-day; and, if we be in a state of grace, we may know that we are of the truth, and assure our hearts before God, with the greater confidence, by the testimony of a good concience, 1 John 3:19, 21: that so our hearts may be more strongly comforted by faith, and established in every good work; and that, if our ways be evil, we may turn from them to the Lord our God, through Christ; “without whom none cometh to the Father,” Lam. 3:40; John 14:6. But your great care, in this work of self-examination, must be, to perform it in such a manner, that it may not hinder and destroy the life of faith, as it doth in many, instead of promoting it. Therefore, beware, lest you trust upon your self-examination rather than upon Christ; as some do, that think they have made their peace with God, merely because they have examined themselves upon their sick-bed, or before receiving the Lord’s supper, though they have found themselves stark naught, and do not depend on Christ, to make them better, but on their own deceitful purposes and resolutions. Think not that you must begin this work with doubting, whether God will extend mercy to you, and save you; and that you must leave this a question wholly under debate, until you have found out how to resolve it by self-examination. This is a common and very pernicious error in the very foundation of this work, which is hereby laid in the great sin of unbelief; which, as soon as it prevaileth, doth, by its great influence, dash and obscure all inward gracious qualifications, of peace, hope, joy, love to God and his people, before they be at all tried, whether they can give any good evidence of their salvation. And it makes people willing to think their own qualifications better than they are, lest they should fall into an utter despair of their salvation; and thus it wholly marreth the good work of self-examination, and maketh it destructive to, our souls; for “to them that are defiled and unbelieving, there is nothing pure,” Titus 1:15. You should rather begin the work with much assurance of faith, that though you may at present find your heart never so wicked and reprobate, (as many of God’s choicest servants have found) yet the door of mercy is open for you, and that God will certainly save you forever, if you put your trust in his grace through Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/walter-marshall.html">Walter Marshall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Gospel Mystery of Sanctification</cite>, (1692), Direction XIII.</span></figcaption>

</figure><figure class="quote" id="q-d6ff824e4b" data-kw="">
<blockquote><p>For as it is not enough for those who are chosen to say in excuse for themselves, “I did not summon myself to this office, nor could I avoid what I did not see beforehand;” so neither will it be a sufficient plea for those who ordain them to say that they did not know him who was ordained. The charge against them becomes greater on account of their ignorance of him whom they brought forward, and what seems to excuse them only serves to accuse them the more.

For how absurd a thing, is it not? that they who want to buy a slave, show him to the physician, and require sureties for the sale, and information about him from their neighbours, and after all this do not yet venture on his purchase without asking for some time for a trial of him; while they who are going to admit any one to so great an office as this, give their testimonial and their sanction loosely and carelessly, without further investigation, just because some one wishes it, or to court the favour, or to avoid the displeasure of some one else.

Who shall then successfully intercede for us in that day, when they who ought to defend us stand themselves in need of defenders? He who is going to ordain, therefore, ought to make diligent inquiry, and much more he who is to be ordained. For though they who ordain him share his punishment, for any sins which he may commit in his office, yet so far from escaping vengeance he will even pay a greater penalty than they — save only if they who chose him acted from some worldly motive contrary to what seemed justifiable to themselves.

For if they should be detected so doing, and knowing a man to be unworthy have brought him forward on some pretext or other, the amount of their punishment shall be equivalent to his, nay perhaps the punishment shall be even greater for them who appointed the unfit man. For he who gives authority to any one who is minded to destroy the Church, would be certainly to blame for the outrages which that person commits.

But if he is guilty of no such thing, and says that he has been misled by the opinions of others, even then he shall not altogether remain unpunished, but his punishment shall be a little lighter than his who has been ordained. What then? It is possible that they who elect may come to the election deceived by a false report. But he who is elected could not say, “I am ignorant of myself,” as others were of him.

As one who will receive therefore a sorer punishment than they who put him forward, so should he make his scrutiny of himself more careful than that which they make of him; and if they in ignorance drag him on, he ought to come forward and instruct them carefully about any matters whereby he may stop their being misled; and so having shown himself unworthy of trial may escape the burden of so high an office.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-chrysostom.html">John Chrysostom</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Priesthood</cite>, (c. 381-85), 4.2 in Nicene and Post Nicene Fathers 1, 9: 63.</span></figcaption>

For if they should be detected so doing, and knowing a man to be unworthy have brought him forward on some pretext or other, the amount of their punishment shall be equivalent to his, nay perhaps the punishment shall be even greater for them who appointed the unfit man. For he who gives authority to any one who is minded to destroy the Church, would be certainly to blame for the outrages which that person commits.

But if he is guilty of no such thing, and says that he has been misled by the opinions of others, even then he shall not altogether remain unpunished, but his punishment shall be a little lighter than his who has been ordained. What then? It is possible that they who elect may come to the election deceived by a false report. But he who is elected could not say, “I am ignorant of myself,” as others were of him.

As one who will receive therefore a sorer punishment than they who put him forward, so should he make his scrutiny of himself more careful than that which they make of him; and if they in ignorance drag him on, he ought to come forward and instruct them carefully about any matters whereby he may stop their being misled; and so having shown himself unworthy of trial may escape the burden of so high an office.”

<blockquote><p>I have seen hot love, soon cold; and love that has continued to act, yet act towards the end, as the man that by running, and has run himself off his legs, pants, and can hardly run any longer: but I never saw love like the love of Christ, who as a giant, and bridegroom coming out of his chamber, and as a strong man, rejoiceth to run his race (Psa 19:5). Loving higher and higher, stronger and stronger, I mean as to the lettings out of love, for he reserveth the best wine even till the last (John 2:10).</p></blockquote>

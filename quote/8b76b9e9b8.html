<main class="wrap"><figure class="quote" id="q-8b76b9e9b8" data-kw="">
<blockquote><p>With us [the Church of Scotland,] the king or his commissioner is present [in our General Assemblies], as in the national assembly of the Jews was King David (1 Chron. 13:1,2), Asa (2 Chron. 15:9), Hezekiah (2 Chron. 29:4, Josiah, 2 Chron. 34:29). For the king bears the sword and is there as a politic president and nursing father (Isa. 49:23; Rom. 13:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland... (1642), ch. 20, 12th Article</cite>, p. 322</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b4d25d63d" data-kw="">
<blockquote><p>XV. (8) Next is the calumny [of Papists against the Reformed] concerning independency, in the church as well as in the state, which causes us to recognize no authority in the church and to be hostile to superior powers. But nothing could be said more unjustly and be more foreign to our religion… We leave independency to those who withdraw themselves from the jurisdiction of the magistrate [such as Romanists] and think they are raised so far above kings that their crowns depend upon them, which they can confer or take away at pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, 3.145</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/plague-quarantine-and-public-health.html">Plague, Quarantine and Public Health</a></span></div>

<blockquote><p>4. There are places of persecution where no liberty is granted for public assemblies: and places of peace, where Churches have much rest, and great liberty. In places of persecution bounden duties must rather be performed in private, than omitted. For matter of circumstance must give place to matters of substance: matters of conveniency to matters of necessity. Wherefore to leave extraordinary persons to their extraordinary warrant…</p></blockquote>

</figure><figure class="quote" id="q-36c2bc95f2" data-kw="">
<blockquote><p>If in the Old Testament God himself ordered lepers to be banished from the community and compelled to live outside the city to prevent contamination [Leviticus 13–14], we must do the same with this dangerous pestilence so that anyone who becomes infected will stay away from other persons, or allow himself to be taken away and given speedy help with medicine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Whether One May Flee From a Deadly Plague”</cite>, pp. 6-7</span></figcaption>

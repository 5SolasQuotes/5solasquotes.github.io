<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: and his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more. Christ was not strict enough for the Pharisees, in keeping the Sabbath, nor in his company, nor in his diet. Satan has always two ways to destroy both truth and duty: The first is by direct opposing it; But when that will not do, the next is by overdoing and pretending to defend it. If he cannot destroy zeal, by scorning it and quenching it; he will try to do it by overheating and distempering it.</p></blockquote>

</figure><figure class="quote" id="q-d312505452" data-kw="">
<blockquote><p>A clear indicator of shunning is that the evidence of the ‘sins’ of the shunned person will be thin. Instead, insinuations will be made about a person’s character and rarely will there be something concrete. If there is, it won’t rise to the level of a chargeable offense, although the leadership may greatly exaggerate it. The ‘sin’ actually consists of disagreement with the leadership… Shunning at its root is a ‘good riddance.’ It is to discard someone. The coldness of it will be evident over time with repetition of occurrences. Rather than the love which ‘always hopes,’ there is a sentiment more like, ‘you have to be willing to pull the trigger.’… …with shunning, often there will be no church discipline involved; a process demanding the rigor of due process, true shepherding, time, and layers of accountability due to the gravity of what is at stake… the leadership simply communicates to the church in various ways that certain people are to be totally avoided because they pose a ‘danger’ to the church. People disappear with little discussion or invitation for questions, except for insinuation about them… First, those who are perceived as a ‘threat’ to power and control of the spiritually abusive leadership are marked… It may take place in the context of a controversy where leadership is domineering and anyone who questions is therefore marked… Second, the abusive leadership moves to push out the perceived threat… It can be as simple as a cold shoulder: the person receives nonverbal cues that they are not wanted by the leadership. Exclusion may be accomplished by veiled references with criticisms from the pulpit where the victim and others know who is being described… Pastoral knowledge of their lives or weaknesses may be marshaled against them abusively… Victims may find themselves berated, facing tremendous anger and rage designed to cow them into submission… the collective power of a body of complicit leaders may convince them that the problem is indeed themselves. This may be the worst scenario, as the victim finds himself under the terror of condemnation, believing that the anger he is receiving is the anger of God… The psychological toll is terrible. But this tactic is effective: such persons are neutralized as a ‘threat’… Third, in order to minimize any potential damage to the leadership’s reputation and maintain control, individuals must be discredited. Here is where the real work must be done upon a congregation to get them on board. Those who have been marked and excluded continue to pose a threat because they may speak with persons in the congregation. The more godly and mature the excluded person is, the more intently the leadership will have to work to discredit them. This results in demonization. The words of the Pharisees whose control was challenged by the formerly blind man are pertinent: “You were born in utter sin, and would you teach us?” And they cast him out (John 9:34)… Full Shunning… It takes place incrementally, with exhortations of ‘protecting the flock from dangerous people,’… ‘exerting tough love toward unrepentant people,’ and ‘not allowing Satan a foothold’ at the forefront. These are convincing themes for biblical Christians who trust their leaders. Although there may be no formal discipline, the character of the person is so slandered that others conclude they have reason to withdraw from them, and even a moral obligation… The pulpit, private conversations, committee meetings, and public prayers become useful for insinuations… …the pattern will easily be replicated and expanded. The leader therefore begins with strong pressure on the other leaders to do this. Other involved members will pick up on the practice as it is now reinforced from multiple people. Once the principles are inculcated with a core, it will spread. It becomes a powerful tool for control as well as instilling fear of disagreeing and being among ‘those compromised people’ whose eternal destiny is called into question. When it is leaders who step out of line and are excluded, they will quickly be erased… Long standing close relationships are ruptured… The closer the remaining individuals are to the core leadership, the more severe the pressure will be. Victims multiply. In biblically orthodox contexts, often at the root of abusive leadership and shunning is the sort of self-idolatry commonly described as narcissism. This takes the shape again and again of a charismatic figure, compelling in his leadership, capable in his use of scripture, remarkably gifted in different ways, yet underneath gripped by sins of great spiritual pride and need for control. He labors to hide these from all people and especially from himself with ministerial activity and forms of piety. He views himself as fundamentally different and above others and unable to begin to consider the possibility of something being so wrong within. This leaves him with great insecurity and unable to receive criticism or be questioned in his judgment. He excels in gathering others around him by flattery to serve as supporters, training and convincing them of his ways, but will swiftly crush them if he detects disloyalty… If you have concerns that such tendencies may be present in your church, read further resources on the topic and seek objective counsel and prayer from other Christians outside of your church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-light.html">Steven Light</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Unmasking Abusive Spiritual Leadership Part I: Shunning’</cite>, (2023) 23 paragraphs at Aquila Report</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/spiritual-abuse-and-cults.html">Spiritual Abuse and Cults</a></span></div>

se eternal destiny is called into question. When it is leaders who step out of line and are excluded, they will quickly be erased… Long standing close relationships are ruptured… The closer the remaining individuals are to the core leadership, the more severe the pressure will be. Victims multiply. In biblically orthodox contexts, often at the root of abusive leadership and shunning is the sort of self-idolatry commonly described as narcissism. This takes the shape again and again of a charismatic figure, compelling in his leadership, capable in his use of scripture, remarkably gifted in different ways, yet underneath gripped by sins of great spiritual pride and need for control. He labors to hide these from all people and especially from himself with ministerial activity and forms of piety. He views himself as fundamentally different and above others and unable to begin to consider the possibility of something being so wrong within. This leaves him with great insecurity and unable to receive criticism or be questioned in his judgment. He excels in gathering others around him by flattery to serve as supporters, training and convincing them of his ways, but will swiftly crush them if he detects disloyalty… If you have concerns that such tendencies may be present in your church, read further resources on the topic and seek objective counsel and prayer from other Christians outside of your church.”

iled+references+with+criticisms+from+the+pulpit+where+the+victim+and+others+know+who+is+being+described%E2%80%A6+Pastoral+knowledge+of+their+lives+or+weaknesses+may+be+marshaled+against+them+abusively%E2%80%A6+Victims+may+find+themselves+berated%2C+facing+tremendous+anger+and+rage+designed+to+cow+them+into+submission%E2%80%A6+the+collective+power+of+a+body+of+complicit+leaders+may+convince+them+that+the+problem+is+indeed+themselves.+This+may+be+the+worst+scenario%2C+as+the+victim+finds+himself+under+the+terror+of+condemnation%2C+believing+that+the+anger+he+is+receiving+is+the+anger+of+God%E2%80%A6+The+psychological+toll+is+terrible.+But+this+tactic+is+effective%3A+such+persons+are+neutralized+as+a+%E2%80%98threat%E2%80%99%E2%80%A6+Third%2C+in+order+to+minimize+any+potential+damage+to+the+leadership%E2%80%99s+reputation+and+maintain+control%2C+individuals+must+be+discredited.+Here+is+where+the+real+work+must+be+done+upon+a+congregation+to+get+them+on+board.+Those+who+have+been+marked+and+excluded+continue+to+pose+a+threat+because+they+may+speak+with+persons+in+the+congregation.+The+more+godly+and+mature+the+excluded+person+is%2C+the+more+intently+the+leadership+will+have+to+work+to+discredit+them.+This+results+in+demonization.+The+words+of+the+Pharisees+whose+control+was+challenged+by+the+formerly+blind+man+are+pertinent%3A+%E2%80%9CYou+were+born+in+utter+sin%2C+and+would+you+teach+us%3F%E2%80%9D+And+they+cast+him+out+%28John+9%3A34%29%E2%80%A6+Full+Shunning%E2%80%A6+It+takes+place+incrementally%2C+with+exhortations+of+%E2%80%98protecting+the+flock+from+dangerous+people%2C%E2%80%99%E2%80%A6+%E2%80%98exerting+tough+love+toward+unrepentant+people%2C%E2%80%99+and+%E2%80%98not+allowing+Satan+a+foothold%E2%80%99+at+the+forefront.+These+are+convincing+themes+for+biblical+Christians+who+trust+their+leaders.+Although+there+may+be+no+formal+discipline%2C+the+character+of+the+person+is+so+slandered+that+others+conclude+they+have+reason+to+withdraw+from+them%2C+and+even+a+moral+obligation%E2%80%A6+The+pulpit%2C+private+conversations%2C+committee+meetings%2C+and+public+prayers+become+useful+for+insinuations%E2%80%A6+%E2%80%A6the+pattern+will+easily+be+replicated+and+expanded.+The+leader+therefore+begins+with+strong+pressure+on+the+other+leaders+to+do+this.+Other+involved+members+will+pick+up+on+the+practice+as+it+is+now+reinforced+from+multiple+people.+Once+the+principles+are+inculcated+with+a+core%2C+it+will+spread.+It+becomes+a+powerful+tool+for+control+as+well+as+instilling+fear+of+disagreeing+and+being+among+%E2%80%98those+compromised+people%E2%80%99+whose+eternal+destiny+is+called+into+question.+When+it+is+leaders+who+step+out+of+line+and+are+excluded%2C+they+will+quickly+be+erased%E2%80%A6+Long+standing+close+relationships+are+ruptured%E2%80%A6+The+closer+the+remaining+individuals+are+to+the+core+leadership%2C+the+more+severe+the+pressure+will+be.+Victims+multiply.+In+biblically+orthodox+contexts%2C+often+at+the+root+of+abusive+leadership+and+shunning+is+the+sort+of+self-idolatry+commonly+described+as+narcissism.+This+takes+the+shape+again+and+again+of+a+charismatic+figure%2C+compelling+in+his+leadership%2C+capable+in+his+use+of+scripture%2C+remarkably+gifted+in+different+ways%2C+yet+underneath+gripped+by+sins+of+great+spiritual+pride+and+need+for+control.+He+labors+to+hide+these+from+all+people+and+especially+from+himself+with+ministerial+activity+and+forms+of+piety.+He+views+himself+as+fundamentally+different+and+above+others+and+unable+to+begin+to+consider+the+possibility+of+something+being+so+wrong+within.+This+leaves+him+with+great+insecurity+and+unable+to+receive+criticism+or+be+questioned+in+his+judgment.+He+excels+in+gathering+others+around+him+by+flattery+to+serve+as+supporters%2C+training+and+convincing+them+of+his+ways%2C+but+will+swiftly+crush+them+if+he+detects+disloyalty%E2%80%A6+If+you+have+concerns+that+such+tendencies+may+be+present+in+your+church%2C+read+further+resources+on+the+topic+and+seek+objective+counsel+and+

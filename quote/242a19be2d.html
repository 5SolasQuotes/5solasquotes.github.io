<blockquote><p>Vers. 10. We have an Altar, whereof they have no right to eat, which serve the Tabernacle.

Reas. 6. They that serve the Jewish Tabernacle after Christ’s coming, or they that pertinaciously cleave to Levitical Ceremonies, cannot be partakers of Christ, which is the thing signified to us by the Altar, and Sacrifices, and other Levitical shadows, and is the true body of them all: Therefore the Doctrine of Faith is to be preserved from the leaven of the Jewish Doctors, who thought that the observation of these Ceremonies was to be joined with the Gospel.

To which purpose the same Apostle saith, Gal. 5.2. If you be circumcised, Christ shall profit you nothing, The reason whereof is this, The observers of Legal Ceremonies, or they that receive shadows now abolished, do in the prescribed distinction of meats, observation of Altars, Feasts, Jubilees, Holy water, Priests garments, and the like Ceremonies, really shew forth that the Sun of Righteousness is not yet risen, that Christ is nor yet come, that the Ceremonial Pedagogy is not yet abolished; but that still the time of shadows and signs, which were instituted only to prefigure Christ, until the time of Reformation.

Vers. 11. For the bodies of these beasts, whose blood is brought into the Sanctuary by the High Priest for sin, are burnt without the Camp.

12. Wherefore Jesus also that he might sanctify the people with his own blood, suffered without the gate.

He proves that they are to be excluded from Christ, who seek righteousness, or part of righteousness, in the shadows or works of the Law; because God hath prefigured this in the type of the Expiatory Sacrifice; from Levit. 23.27. The blood of the Expiatory Sacrifice was brought by the High-Priest into the Sanctuary, but the flesh was wholly burnt with fire, neither did any thing thereof come to the Priests, as was given to them from the other Sacrifices. The Apostle affirms that this signified, that none of those who adhere to the Covenant of Works, could eat Christ, but were to be excluded from communion with them, as many as do not firmly adhere to Christ, but seek even the least part of righteousness in the Levitical shadows, or works.

Without the Camp] God signified by this; First, That Christ was to suffer without the gates of Jerusalem, and that is plainly come to pass; for Christ was crucified without the gate. Secondly, That true expiation was to be sought in the blood of the Messias, that suffered without Jerusalem, (or the place consecrated for the Levitical worship) And the Apostle also doth teach, that Christ himself intended this, (having by his providence so disposed of every thing, that he should suffer without the City) viz. that Christ going without the gates to offer up himself, would by that very thing signify, that there was no virtue of Justification or Sanctification to bee sought in any legal Rites, but only in his own blood, all those legal Rites being excluded.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 212-13.</span></figcaption>

<blockquote><p>13. The points upon which the Lutheran Churches disagree with us are of two kinds. There are some upon which it is easier to reach agreement: such are the ceremonies of the Lutheran Churches, which may be excused and tolerated, because they concern decorum rather than necessity. Of the same sort also are certain opinions respecting the point of Predestination, upon which, I judge, one might easily draw up an article of the common confession that all would approve without difficulty, provided that curiosity be avoided—which, I believe, has already been done by the Confession of Augsburg [1530], which speaks of it soberly and expressly declines that question. There is also some difference concerning the necessity of baptism, which may rightly and reasonably be affirmed to be necessary to salvation — that is to say, that it is necessary for each person not to despise it — without pressing the question of necessity any further.</p></blockquote>

<blockquote><p>What say you of that part, [Quest.] which is Typical and Ceremonial?

Though they cease and be abolished as to our practice, [Answ.] yet they are perpetual, and still a part of holy scripture, as for our teaching and learning, The Types and figures of the Law are a kind of Prophesies, for they do in certain Actions set forth Christ to come, and the benefits by him; as the Prophets did by their words and writings, they still teach and instruct, and we may fetch Arguments of faith and duty from them, as Paul doth in the Epistle to the Hebrews, and other places (as for example) if the Question be between us and the Socinians, whether Christ by dying did make Atonement for sin. We say, yea, and the Law and the daily Burnt offerings and sin offerings doe teach the same: if ye ask of the manner how? Answer, it is by sprinkling the sinner, (that is) by applying it to our own souls.

If the question be about Ministers and their maintenance, in the New Testament the Apostle proves it to be the peoples duty from the Law. 1 Cor. 9.7. Who goes a warfare at his own Charge? That’s Paul’s Argument; Ministers must be paid as well as soldiers, and he fortifies his reason by Testimony of old Testament ver. 8. Say I these things as a man? Or saith not the Law the same? For it is written in the Law of Moses, Thou shalt not muzzle the mouth of the Ox, that treadeth out the Corn; The same proof he uses upon another occasion. 1 Tim. 5.17.18.

But Paul’s proof is faulty, because it is a Ceremonial proof, [Obj.] and so denies Christ to be come in the flesh.

God intended in that Law, to teach us something, [Answ.] that is moral, (namely) that God doth take care for Ministers, and for his Labourers in his word, more than for Oxen; and if that Law be written for our sakes; then why may not other things written in the Ceremonial Law, teach a moral duty, as well as that? The Ceremonial law, as it doth set forth Christ, so also the duty of Christians in their holy administrations: Thus the Purging out of Leaven, did teach the putting away of filthy affections from our holy services, and polluted people from the society of the Church, 1 Cor. 5.7.13. So the sprinkling of the unclean, doth teach, that when we present any service to the Lord, we must renew our repentance, and not come with defiled hearts or hands, 1 Tim. 2.8. By the consecrating of the first fruits we are taught, that we ought to be consecrated as holy unto the Lord, as a kind of first fruits of his creatures, Jam. 1.18. Rev. 14.4.

We are not subject to those Ordinances to do them, we offer not the sacrifices, because Christ is come; yet look what they signify, they teach, and they serve for our learning, as is said.

But there is Heb. 7.18. [Obj.] A disannulling of the Commandment for the weakness and unprofitableness of it.

The meaning is this, [Answ. 1] that the blood of those sacrifices did not take away sin by any power or virtue, that was in them; they of themselves are weak and beggarly, if any body should rest in them, as the Carnal Jews did; and therefore, he says, those Ordinances were to cease, and give place, when the true Sacrifice, Jesus Christ was offered; which alone did and could take away sin; The law made nothing perfect, but in their relative use and end, they did lead unto Christ, that better hope, who made all perfect; For his blood served for the redemption of sins and transgressions, which were committed under the first Testament. So that the way of Salvation taught then in Types, and now without them; the substance of the Covenant is one and the same, only that former manner of Administering waxeth old, and is put into a new way, which is significantly expressed, Heb. 7.12.

There is … not an abolishing of the substance of the Covenant, but a Transposition of it into another way; As a Tenant, that holds by Copy, if he obtain to hold in Fee, the latter grant doth indeed actually null the former Tenure, yet not the former Benefit, his Tenure is mended, being changed into Fee simple: So the coming of the New Testament doth better our Tenure, but alters not the Promises, Commands, Counsels in the Old. For as the substance of the Priesthood was not to end, as having no more a being on the Earth, but only translated upon other persons. I will take of the Gentiles for Priests and Levites: So the matter of the Covenant was not destroyed, and taken quite away, but only changed into another Form, other Sacraments, and yet the same; other for the Sign, the same for Substance, the same spiritual meat and drink, the same Rock, Jesus Christ.

I answer, [Answ. 2] That when the Apostle there speaks of disannulling the Old Testament, he doth not mean the Books of the Old Testament, but that old manner of publishing, administering, and applying the Covenant.

The Books of the Old Testament had Christ for their principal scope and subject. Moses wrote of me, if ye believe Moses, you would believe me, if ye believe not Moses, ye cannot soundly believe the Apostles: Thus they reasoned and persuaded the things concerning Jesus out of the Law, and Prophets. Wherefore we conclude, that the Scriptures of the Old Testament, are to be retained still in force, as the good Word of God written for our learning, and a Word that still speaks unto us as unto Children, in Doctrines, in Exhortations, in Consolations.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“What say you of that part, [Quest.] which is Typical and Ceremonial?

Though they cease and be abolished as to our practice, [Answ.] yet they are perpetual, and still a part of holy scripture, as for our teaching and learning, The Types and figures of the Law are a kind of Prophesies, for they do in certain Actions set forth Christ to come, and the benefits by him; as the Prophets did by their words and writings, they still teach and instruct, and we may fetch Arguments of faith and duty from them, as Paul doth in the Epistle to the Hebrews, and other places (as for example) if the Question be between us and the Socinians, whether Christ by dying did make Atonement for sin. We say, yea, and the Law and the daily Burnt offerings and sin offerings doe teach the same: if ye ask of the manner how? Answer, it is by sprinkling the sinner, (that is) by applying it to our own souls.

If the question be about Ministers and their maintenance, in the New Testament the Apostle proves it to be the peoples duty from the Law. 1 Cor. 9.7. Who goes a warfare at his own Charge? That’s Paul’s Argument; Ministers must be paid as well as soldiers, and he fortifies his reason by Testimony of old Testament ver. 8. Say I these things as a man? Or saith not the Law the same? For it is written in the Law of Moses, Thou shalt not muzzle the mouth of the Ox, that treadeth out the Corn; The same proof he uses upon another occasion. 1 Tim. 5.17.18.

But Paul’s proof is faulty, because it is a Ceremonial proof, [Obj.] and so denies Christ to be come in the flesh.

God intended in that Law, to teach us something, [Answ.] that is moral, (namely) that God doth take care for Ministers, and for his Labourers in his word, more than for Oxen; and if that Law be written for our sakes; then why may not other things written in the Ceremonial Law, teach a moral duty, as well as that? The Ceremonial law, as it doth set forth Christ, so also the duty of Christians in their holy administrations: Thus the Purging out of Leaven, did teach the putting away of filthy affections from our holy services, and polluted people from the society of the Church, 1 Cor. 5.7.13. So the sprinkling of the unclean, doth teach, that when we present any service to the Lord, we must renew our repentance, and not come with defiled hearts or hands, 1 Tim. 2.8. By the consecrating of the first fruits we are taught, that we ought to be consecrated as holy unto the Lord, as a kind of first fruits of his creatures, Jam. 1.18. Rev. 14.4.

We are not subject to those Ordinances to do them, we offer not the sacrifices, because Christ is come; yet look what they signify, they teach, and they serve for our learning, as is said.

But there is Heb. 7.18. [Obj.] A disannulling of the Commandment for the weakness and unprofitableness of it.

The meaning is this, [Answ. 1] that the blood of those sacrifices did not take away sin by any power or virtue, that was in them; they of themselves are weak and beggarly, if any body should rest in them, as the Carnal Jews did; and therefore, he says, those Ordinances were to cease, and give place, when the true Sacrifice, Jesus Christ was offered; which alone did and could take away sin; The law made nothing perfect, but in their relative use and end, they did lead unto Christ, that better hope, who made all perfect; For his blood served for the redemption of sins and transgressions, which were committed under the first Testament. So that the way of Salvation taught then in Types, and now without them; the substance of the Covenant is one and the same, only that former manner of Administering waxeth old, and is put into a new way, which is significantly expressed, Heb. 7.12.

There is … not an abolishing of the substance of the Covenant, but a Transposition of it into another way; As a Tenant, that holds by Copy, if he obtain to hold in Fee, the latter grant doth indeed actually null the former Tenure, yet not the former Benefit, his Tenure is mended, being changed into Fee simple: So the coming of the New Testament doth better our Tenure, but alters not the Promises, Commands, Counsels in the Old. For as the substance of the Priesthood was not to end, as having no more a being on the Earth, but only translated upon other persons. I will take of the Gentiles for Priests and Levites: So the matter of the Covenant was not destroyed, and taken quite away, but only changed into another Form, other Sacraments, and yet the same; other for the Sign, the same for Substance, the same spiritual meat and drink, the same Rock, Jesus Christ.

I answer, [Answ. 2] That when the Apostle there speaks of disannulling the Old Testament, he doth not mean the Books of the Old Testament, but that old manner of publishing, administering, and applying the Covenant.

The Books of the Old Testament had Christ for their principal scope and subject. Moses wrote of me, if ye believe Moses, you would believe me, if ye believe not Moses, ye cannot soundly believe the Apostles: Thus they reasoned and persuaded the things concerning Jesus out of the Law, and Prophets. Wherefore we conclude, that the Scriptures of the Old Testament, are to be retained still in force, as the good Word of God written for our learning, and a Word that still speaks unto us as unto Children, in Doctrines, in Exhortations, in Consolations.”

— William Lyford, The plain man’s senses exercised to discern both good and evil, or, A discovery of the errors, heresies, and blasphemies of these times and the toleration of them, as they are collected and testified against by the ministers of London, in their testimony to the truth of Jesus Christ, (London: Richard Royston, 1655), pp 43-45.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+say+you+of+that+part%2C+%5BQuest.%5D+which+is+Typical+and+Ceremonial%3F%0A%0AThough+they+cease+and+be+abolished+as+to+our+practice%2C+%5BAnsw.%5D+yet+they+are+perpetual%2C+and+still+a+part+of+holy+scripture%2C+as+for+our+teaching+and+learning%2C+The+Types+and+figures+of+the+Law+are+a+kind+of+Prophesies%2C+for+they+do+in+certain+Actions+set+forth+Christ+to+come%2C+and+the+benefits+by+him%3B+as+the+Prophets+did+by+their+words+and+writings%2C+they+still+teach+and+instruct%2C+and+we+may+fetch+Arguments+of+faith+and+duty+from+them%2C+as+Paul+doth+in+the+Epistle+to+the+Hebrews%2C+and+other+places+%28as+for+example%29+if+the+Question+be+between+us+and+the+Socinians%2C+whether+Christ+by+dying+did+make+Atonement+for+sin.+We+say%2C+yea%2C+and+the+Law+and+the+daily+Burnt+offerings+and+sin+offerings+doe+teach+the+same%3A+if+ye+ask+of+the+manner+how%3F+Answer%2C+it+is+by+sprinkling+the+sinner%2C+%28that+is%29+by+applying+it+to+our+own+souls.%0A%0AIf+the+question+be+about+Ministers+and+their+maintenance%2C+in+the+New+Testament+the+Apostle+proves+it+to+be+the+peoples+duty+from+the+Law.+1+Cor.+9.7.+Who+goes+a+warfare+at+his+own+Charge%3F+That%E2%80%99s+Paul%E2%80%99s+Argument%3B+Ministers+must+be+paid+as+well+as+soldiers%2C+and+he+fortifies+his+reason+by+Testimony+of+old+Testament+ver.+8.+Say+I+these+things+as+a+man%3F+Or+saith+not+the+Law+the+same%3F+For+it+is+written+in+the+Law+of+Moses%2C+Thou+shalt+not+muzzle+the+mouth+of+the+Ox%2C+that+treadeth+out+the+Corn%3B+The+same+proof+he+uses+upon+another+occasion.+1+Tim.+5.17.18.%0A%0ABut+Paul%E2%80%99s+proof+is+faulty%2C+because+it+is+a+Ceremonial+proof%2C+%5BObj.%5D+and+so+denies+Christ+to+be+come+in+the+flesh.%0A%0AGod+intended+in+that+Law%2C+to+teach+us+something%2C+%5BAnsw.%5D+that+is+moral%2C+%28namely%29+that+God+doth+take+care+for+Ministers%2C+and+for+his+Labourers+in+his+word%2C+more+than+for+Oxen%3B+and+if+that+Law+be+written+for+our+sakes%3B+then+why+may+not+other+things+written+in+the+Ceremonial+Law%2C+teach+a+moral+duty%2C+as+well+as+that%3F+The+Ceremonial+law%2C+as+it+doth+set+forth+Christ%2C+so+also+the+duty+of+Christians+in+their+holy+administrations%3A+Thus+the+Purging+out+of+Leaven%2C+did+teach+the+putting+away+of+filthy+affections+from+our+holy+services%2C+and+polluted+people+from+the+society+of+the+Church%2C+1+Cor.+5.7.13.+So+the+sprinkling+of+the+unclean%2C+doth+teach%2C+that+when+we+present+any+service+to+the+Lord%2C+we+must+renew+our+repentance%2C+and+not+come+with+defiled+hearts+or+hands%2C+1+Tim.+2.8.+By+the+consecrating+of+the+first+fruits+we+are+taught%2C+that+we+ought+to+be+consecrated+as+holy+unto+the+Lord%2C+as+a+kind+of+first+fruits+of+his+creatures%2C+Jam.+1.18.+Rev.+14.4.%0A%0AWe+are+not+subject+to+those+Ordinances+to+do+them%2C+we+offer+not+the+sacrifices%2C+because+Christ+is+come%3B+yet+look+what+they+signify%2C+they+teach%2C+and+they+serve+for+our+learning%2C+as+is+said.%0A%0ABut+there+is+Heb.+7.18.+%5BObj.%5D+A+disannulling+of+the+Commandment+for+the+weakness+and+unprofitableness+of+it.%0A%0AThe+meaning+is+this%2C+%5BAnsw.+1%5D+that+the+blood+of+those+sacrifices+did+not+take+away+sin+by+any+power+or+virtue%2C+that+was+in+them%3B+they+of+themselves+are+weak+and+beggarly%2C+if+any+body+should+rest+in+them%2C+as+the+Carnal+Jews+did%3B+and+therefore%2C+he+says%2C+those+Ordinances+were+to+cease%2C+and+give+place%2C+when+the+true+Sacrifice%2C+Jesus+Christ+was+offered%3B+which+alone+did+and+could+take+away+sin%3B+The+law+made+nothing+perfect%2C+but+in+their+relative+use+and+end%2C+they+did+lead+unto+Christ%2C+that+better+hope%2C+who+made+all+perfect%3B+For+his+blood+served+for+the+redemption+of+sins+and+transgressions%2C+which+were+committed+under+the+first+Testament.+So+that+the+way+of+Salvation+taught+then+in+Types%2C+and+now+without+them%3B+the+substance+of+the+Covenant+is+one+and+the+same%2C+only+that+former+manner+of+Administering+waxeth+old%2C+and+is+put+into+a+new+way%2C+which+is+significantly+expressed%2C+Heb.+7.12.%0A%0AThere+is+%E2%80%A6+not+an+abolishing+of+the+substance+of+the+Covenant%2C+but+a+Transposition+of+it+into+another+way%3B+As+a+Tenant%2C+that+holds+by+Copy%2C+if+he+obtain+to+hold+in+Fee%2C+the+latter+grant+doth+indeed+actually+null+the+former+Tenure%2C+yet+not+the+former+Benefit%2C+his+Tenure+is+mended%2C+being+changed+into+Fee+simple%3A+So+the+coming+of+the+New+Testament+doth+better+our+Tenure%2C+but+alters+not+the+Promises%2C+Commands%2C+Counsels+in+the+Old.+For+as+the+substance+of+the+Priesthood+was+not+to+end%2C+as+having+no+more+a+being+on+the+Earth%2C+but+only+translated+upon+other+persons.+I+will+take+of+the+Gentiles+for+Priests+and+Levites%3A+So+the+matter+of+the+Covenant+was+not+destroyed%2C+and+taken+quite+away%2C+but+only+changed+into+another+Form%2C+other+Sacraments%2C+and+yet+the+same%3B+other+for+the+Sign%2C+the+same+for+Substance%2C+the+same+spiritual+meat+and+drink%2C+the+same+Rock%2C+Jesus+Christ.%0A%0AI+answer%2C+%5BAnsw.+2%5D+That+when+the+Apostle+there+speaks+of+disannulling+the+Old+Testament%2C+he+doth+not+mean+the+Books+of+the+Old+Testament%2C+but+that+old+manner+of+publishing%2C+administering%2C+and+applying+the+Covenant.%0A%0AThe+Books+of+the+Old+Testament+had+Christ+for+their+principal+scope+and+subject.+Moses+wrote+of+me%2C+if+ye+believe+Moses%2C+you+would+believe+me%2C+if+ye+believe+not+Moses%2C+ye+cannot+soundly+believe+the+Apostles%3A+Thus+they+reasoned+and+persuaded+the+things+concerning+Jesus+out+of+the+Law%2C+and+Prophets.+Wherefore+we+conclude%2C+that+the+Scriptures+of+the+Old+Testament%2C+are+to+be+retained+still+in+force%2C+as+the+good+Word+of+God+written+for+our+learning%2C+and+a+Word+that+still+speaks+unto+us+as+unto+Children%2C+in+Doctrines%2C+in+Exhortations%2C+in+Consolations.%E2%80%9D%0A%0A%E2%80%94+William+Lyford%2C+The+plain+man%E2%80%99s+senses+exercised+to+discern+both+good+and+evil%2C+or%2C+A+discovery+of+the+errors%2C+heresies%2C+and+blasphemies+of+these+times+and+the+toleration+of+them%2C+as+they+are+collected+and+testified+against+by+the+ministers+of+London%2C+in+their+testimony+to+the+truth+of+Jesus+Christ%2C+%28London%3A+Richard+Royston%2C+1655%29%2C+pp+43-45.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe41bff2444.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e41bff2444.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/23/william-lyford-on-the-ceremonial-laws-setting-forth-moral-principles/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…We ought not to worship God with any other external worship than what Himself has commanded and appointed us in his holy Word. The Scripture has set us our bounds for worship, to which we must not add, and from which we ought not to diminish; for whosoever does either the one or the other, must needs accuse the Rule either of defect in things necessary, or of superfluity in things unnecessary: which is an high affront to the wisdom of God, who as He is the object, so He is the Prescriber of all that worship which He will accept and reward. I well know that this rule has given (I cannot say cause, but) occasion to many hot disputes about ecclesiastical rites and constitutions; some condemning whatsoever is prescribed or used in the service of God, besides things expressly commanded in Scripture, for encroachments upon the authority of God, and additions unto his worship, which He requires to be performed according to the pattern in the mount, and the model He has delineated for it: Others again maintaining the privilege and authority of the Church in ordaining some things for the more decent and reverend performing of the service of God, which are not particularly required in the holy Scriptures. I shall not plunge myself into this angry and quarrelsome controversy: only give me leave to say and sadly to lament that the seamless coat of Christ is rent in pieces among them, whilst some think it more decent to sew on loops and fringes to it, and others will have none. And truly I think our differences are of no greater importance in themselves, though too woeful in their consequents, than this amounts unto. I shall clearly express my sense of this matter in a few words, without any reflection or bitterness, and so leave it to the judgment of every ordinary discretion. Things which belong to the worship of God, may be considered either as parts of that worship, or only as circumstances and modifications of it: First therefore, whatsoever is imposed on us as a substantial part of the worship of God, if it be not expresly required of us in the holy Scriptures, is to be not only refused, but abominated. For this is a plain addition to what God has commanded, and by it we lay an imputation upon Him as though He wanted [lacked] wisdom to ordain what is necessary for his own service. Then and then only is any constitution of man imposed for a part of divine worship when obedience unto it is urged upon us, not only from the authority enjoining it, but also from the necessity of the thing considered simply and nakedly in its own nature… Other things are necessary for our observance only because they are commanded by their authority, to whom we owe consciencious obedience in things lawful and indifferent. But we utterly deny that the imposition of any such things makes them any parts of worship, of which they are only circumstances, or that these observances are necessary to us or acceptable to God antecedently to the command of authority, or that the worship of God were imperfect, defective, unacceptable and invalid to the ends for which it is appointed were not these observances commanded and performed: If indeed we thought otherwise, the bitterest of all their invectives, and the loudest of all their exclamations in calling our worship “superstition,” “will-worship” and “idolatry” would not show so much passion as a just and rational zeal. But God forever forbid that any such ordinances of man should be introduced into our Church. We all join in this vote and do utterly renounce any such authority, and deny any such practice. We usurp not upon the consciences of any, nor endeavour to persuade them that that is in it self necessary which is not so by God’s commands or the Law of Nature, or that that is unlawful which is not condemned by either. We endeavor to keep ourselves and you as much from a positive, as a negative superstition: we endeavour to put due bounds between things simply necessary, either by the command of God or their own natural reason and goodness, and such as are in themselves indifferent. We say that nothing is a part of worship but what belongs to the former, but some things that belong to the latter may be used in worship as fit and decent circumstances: And when such things are imposed, they become necessary; not indeed in themselves (for no human authority can alter the nature of things), but to our practice, and our consciences are obliged to them: But how? not indeed simply and absolutely, so that it shall never be lawful to omit them, but only in two cases: in case of scandal and contempt. We ought not to omit them if we judge any offence will be taken by others at our neglect: we ought not to omit them at any time out of a contempt and disrespect towards them. And thus you see we put a vast difference between that which is a part of worship and that which is but a circumstance of worship: If any thing be commanded us by men, as a part of worship, which is not commanded us by God, we ought not to submit unto it. But: Secondly, if any thing be imposed on us not as a part of worship, but as a circumstance and modification of worship, we may and we ought to submit unto it: First, if the things so imposed be in themselves lawful and honest, which they are, if not condemned by the Scripture. Secondly, if they tend to order and decency in the Church. Of which certainly they are as fit to be judges who have authority both in Church and State, as every private and perhaps less-knowing Christian. Thirdly, if they are imposed by the command of a lawful power, to whom we ought to submit in all things that are lawful. Fourthly, if they are such as neither for their levity nor number eat out or distract the seriousness and devotion of our spiritual worship: Which I think cannot justly be imputed to the observances of our Church, being very few for number and very grave and modest for use. If such things as these be imposed upon us, the worship of God is not thereby either changed or adulterated, neither is there any addition made unto it, but the substance of that worship is still in conformity to God’s laws when yet the outward and indifferent manner of it is in conformity to man’s. Certainly it is no addition to baptism to give a name to the baptized, though we find no express command for it. And I much wonder among our carping brethren some or other had not scrupled this as well as another observance. It is no addition to the ordinances of Jesus Christ to appoint at what hour they shall be celebrated or in what garment, or in what decent posture, for all these things are extrinsical to the worship of God and fall under the cognizance and direction of our superiors. Certainly did we but rightly weigh what is required as a part of worship and what only as a circumstance of worship, a great deal of heat and contention, and uncharitable prejudice would be removed and prevented. It is true our Savior, Mt. 15:9, condemns the scribes and Pharisees, that taught for doctrines the commandments of men: that is, they taught those things which were but the traditions and ordinances of their elders to be in themselves absolutely necessary to the serving and worshipping of God. But certainly this reproof falls not upon these, who though they do enjoin what they judge fit for order, yet do not teach them for doctrines, and are so far from thinking their commandments an essential part of worship that they would abhor and anathematize all those that do so. Necessary they are to be submitted unto and practiced because enjoined by that authority to which God has committed the care of the First Table, as well as the Second, but [they are] not necessary in themselves as any part of the worship and service of God, without which, although they were not imposed by men, it would be unacceptable to Him: And whosoever thinks so, let him be accursed. And now that I have delivered my judgment without bitterness, give me leave to make some few lamentations in the grief and bitterness of my soul: Is it not to be bitterly lamented that in a Reformed and Orthodox Church there should be such schisms, rents and divisions, altar against altar, pulpit against pulpit, and one congregation against another? And what is all this contention and separation for? Oh, they will tell you it is for the purity of religion, for the true and sincere worship of God, that they may serve Him purely without human additions or inventions. Thus goes the cry; and a company of poor, ignorant, well-meaning souls, because it is very demurely and gravely spoken, take it up and join with it, never examining the grounds and bottom of it; but conclude that these must needs be in the right who complain of corruptions and pretend to a happy and glorious reformation. Alas, my brethren, was there ever any schism in the world that did not plead the same? Did not others upon the same pretences separate from their communion upon which they now separate from ours? And may not the same argument serve to crumble them into infinite fractions and subdivisions? till at last we come to have almost as many Churches as men, and scarce a man constant and coherent to himself. But what is it in our worship which they dislike? The substantials of it are all the same with their own: We utterly disavow that we make that any part of worship which the Scripture has not: and I think that man very much forsaken of reason and common understanding who shall endeavour to persuade us that we intend worship when we ourselves most earnestly and seriously profess the contrary. Is it then that we differ about mere accidents and circumstances? I confess we do: but assert withal that these things are not a just cause of separation from us. If we look back upon the primitive times, we shall find that almost every Church had its different rites and observances; and yet under that diversity maintained unity and communion: Yea, and at this day, the reformed Churches observe different customs one from another and yet they inviolably hold communion together and we with them. The Gallican, Belgic, Helvetian and German Churches reject us not, nor we them, although we differ in rites and discipline, and those things which are left to the prudence of every Church to constitute as they shall judge most necessary for order and edification. Now certainly if these different rites and observances be no ground for one national Church to separate from the communion of another, they can be no ground for private persons to separate from the communion of that Church to which they belonged. Nay, although they might with reason dislike many usages either as frivilous or incongruous, yet it becomes the temper and modesty of a pious Christian, in things merely circumstantial, to submit his practice to the judgment of that authority under which he lives and not to separate from the communion of the Church, to forsake its assemblies, to disown its administrations, only because he thinks some things might be more conveniently ordered according to the model of his own or other men’s apprehensions: Which in the folly and sad consequences of it, would be to act like him who took up a beetle [mallet], and struck with all his force to kill a fly that he saw on his friend’s forehead. What else were this but to rend the body of Christ by an angry contending about the fashion of its garments, and to tear away its limbs by a violent striving to strip off those clothes which they think indecent? For my part I freely profess that were my lot cast among any of the Reformed Churches beyond the seas, I would presently join in their communion and not at all scruple to conform myself to their received customs, although perhaps in my own private persuasion I may judge some of them to be less serious and less reverent than those of the Church of England, which are now so passionately decried and condemned. I have ever venerated that oracular advice of St. Ambrose to St. Augustine: ‘If thou wilt neither give offence, nor take offence, conform thyself to all the lawful customs of the Churches where thou comest.’ (Augustine to Januarius, epistle 118) But I will not farther enlarge on this choloric and touchy controversy; only I pray that our wanton dissensions about these less important matters may not provoke God to deprive us of the substance and essentials of our religion and reduce us to such a condition wherein we should be heartily glad could we enjoy the liberty of the Gospel and the ordinances of our Lord Jesus Christ under any of those forms of administration which are now so furiously debated amongst us. It were just with God to extinguish the light of his Gospel when we use it not to work by, but all our study and strife is how to snuff it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…We ought not to worship God with any other external worship than what Himself has commanded and appointed us in his holy Word. The Scripture has set us our bounds for worship, to which we must not add, and from which we ought not to diminish; for whosoever does either the one or the other, must needs accuse the Rule either of defect in things necessary, or of superfluity in things unnecessary: which is an high affront to the wisdom of God, who as He is the object, so He is the Prescriber of all that worship which He will accept and reward. I well know that this rule has given (I cannot say cause, but) occasion to many hot disputes about ecclesiastical rites and constitutions; some condemning whatsoever is prescribed or used in the service of God, besides things expressly commanded in Scripture, for encroachments upon the authority of God, and additions unto his worship, which He requires to be performed according to the pattern in the mount, and the model He has delineated for it: Others again maintaining the privilege and authority of the Church in ordaining some things for the more decent and reverend performing of the service of God, which are not particularly required in the holy Scriptures. I shall not plunge myself into this angry and quarrelsome controversy: only give me leave to say and sadly to lament that the seamless coat of Christ is rent in pieces among them, whilst some think it more decent to sew on loops and fringes to it, and others will have none. And truly I think our differences are of no greater importance in themselves, though too woeful in their consequents, than this amounts unto. I shall clearly express my sense of this matter in a few words, without any reflection or bitterness, and so leave it to the judgment of every ordinary discretion. Things which belong to the worship of God, may be considered either as parts of that worship, or only as circumstances and modifications of it: First therefore, whatsoever is imposed on us as a substantial part of the worship of God, if it be not expresly required of us in the holy Scriptures, is to be not only refused, but abominated. For this is a plain addition to what God has commanded, and by it we lay an imputation upon Him as though He wanted [lacked] wisdom to ordain what is necessary for his own service. Then and then only is any constitution of man imposed for a part of divine worship when obedience unto it is urged upon us, not only from the authority enjoining it, but also from the necessity of the thing considered simply and nakedly in its own nature… Other things are necessary for our observance only because they are commanded by their authority, to whom we owe consciencious obedience in things lawful and indifferent. But we utterly deny that the imposition of any such things makes them any parts of worship, of which they are only circumstances, or that these observances are necessary to us or acceptable to God antecedently to the command of authority, or that the worship of God were imperfect, defective, unacceptable and invalid to the ends for which it is appointed were not these observances commanded and performed: If indeed we thought otherwise, the bitterest of all their invectives, and the loudest of all their exclamations in calling our worship “superstition,” “will-worship” and “idolatry” would not show so much passion as a just and rational zeal. But God forever forbid that any such ordinances of man should be introduced into our Church. We all join in this vote and do utterly renounce any such authority, and deny any such practice. We usurp not upon the consciences of any, nor endeavour to persuade them that that is in it self necessary which is not so by God’s commands or the Law of Nature, or that that is unlawful which is not condemned by either. We endeavor to keep ourselves and you as much from a positive, as a negative superstition: we endeavour to put due bounds between things simply necessary, either by the command of God or their own natural reason and goodness, and such as are in themselves indifferent. We say that nothing is a part of worship but what belongs to the former, but some things that belong to the latter may be used in worship as fit and decent circumstances: And when such things are imposed, they become necessary; not indeed in themselves (for no human authority can alter the nature of things), but to our practice, and our consciences are obliged to them: But how? not indeed simply and absolutely, so that it shall never be lawful to omit them, but only in two cases: in case of scandal and contempt. We ought not to omit them if we judge any offence will be taken by others at our neglect: we ought not to omit them at any time out of a contempt and disrespect towards them. And thus you see we put a vast difference between that which is a part of worship and that which is but a circumstance of worship: If any thing be commanded us by men, as a part of worship, which is not commanded us by God, we ought not to submit unto it. But: Secondly, if any thing be imposed on us not as a part of worship, but as a circumstance and modification of worship, we may and we ought to submit unto it: First, if the things so imposed be in themselves lawful and honest, which they are, if not condemned by the Scripture. Secondly, if they tend to order and decency in the Church. Of which certainly they are as fit to be judges who have authority both in Church and State, as every private and perhaps less-knowing Christian. Thirdly, if they are imposed by the command of a lawful power, to whom we ought to submit in all things that are lawful. Fourthly, if they are such as neither for their levity nor number eat out or distract the seriousness and devotion of our spiritual worship: Which I think cannot justly be imputed to the observances of our Church, being very few for number and very grave and modest for use. If such things as these be imposed upon us, the worship of God is not thereby either changed or adulterated, neither is there any addition made unto it, but the substance of that worship is still in conformity to God’s laws when yet the outward and indifferent manner of it is in conformity to man’s. Certainly it is no addition to baptism to give a name to the baptized, though we find no express command for it. And I much wonder among our carping brethren some or other had not scrupled this as well as another observance. It is no addition to the ordinances of Jesus Christ to appoint at what hour they shall be celebrated or in what garment, or in what decent posture, for all these things are extrinsical to the worship of God and fall under the cognizance and direction of our superiors. Certainly did we but rightly weigh what is required as a part of worship and what only as a circumstance of worship, a great deal of heat and contention, and uncharitable prejudice would be removed and prevented. It is true our Savior, Mt. 15:9, condemns the scribes and Pharisees, that taught for doctrines the commandments of men: that is, they taught those things which were but the traditions and ordinances of their elders to be in themselves absolutely necessary to the serving and worshipping of God. But certainly this reproof falls not upon these, who though they do enjoin what they judge fit for order, yet do not teach them for doctrines, and are so far from thinking their commandments an essential part of worship that they would abhor and anathematize all those that do so. Necessary they are to be submitted unto and practiced because enjoined by that authority to which God has committed the care of the First Table, as well as the Second, but [they are] not necessary in themselves as any part of the worship and service of God, without which, although they were not imposed by men, it would be unacceptable to Him: And whosoever thinks so, let him be accursed. And now that I have delivered my judgment without bitterness, give me leave to make some few lamentations in the grief and bitterness of my soul: Is it not to be bitterly lamented that in a Reformed and Orthodox Church there should be such schisms, rents and divisions, altar against altar, pulpit against pulpit, and one congregation against another? And what is all this contention and separation for? Oh, they will tell you it is for the purity of religion, for the true and sincere worship of God, that they may serve Him purely without human additions or inventions. Thus goes the cry; and a company of poor, ignorant, well-meaning souls, because it is very demurely and gravely spoken, take it up and join with it, never examining the grounds and bottom of it; but conclude that these must needs be in the right who complain of corruptions and pretend to a happy and glorious reformation. Alas, my brethren, was there ever any schism in the world that did not plead the same? Did not others upon the same pretences separate from their communion upon which they now separate from ours? And may not the same argument serve to crumble them into infinite fractions and subdivisions? till at last we come to have almost as many Churches as men, and scarce a man constant and coherent to himself. But what is it in our worship which they dislike? The substantials of it are all the same with their own: We utterly disavow that we make that any part of worship which the Scripture has not: and I think that man very much forsaken of reason and common understanding who shall endeavour to persuade us that we intend worship when we ourselves most earnestly and seriously profess the contrary. Is it then that we differ about mere accidents and circumstances? I confess we do: but assert withal that these things are not a just cause of separation from us. If we look back upon the primitive times, we shall find that almost every Church had its different rites and observances; and yet under that diversity maintained unity and communion: Yea, and at this day, the reformed Churches observe different customs one from another and yet they inviolably hold communion together and we with them. The Gallican, Belgic, Helvetian and German Churches reject us not, nor we them, although we differ in rites and discipline, and those things which are left to the prudence of every Church to constitute as they shall judge most necessary for order and edification. Now certainly if these different rites and observances be no ground for one national Church to separate from the communion of another, they can be no ground for private persons to separate from the communion of that Church to which they belonged. Nay, although they might with reason dislike many usages either as frivilous or incongruous, yet it becomes the temper and modesty of a pious Christian, in things merely circumstantial, to submit his practice to the judgment of that authority under which he lives and not to separate from the communion of the Church, to forsake its assemblies, to disown its administrations, only because he thinks some things might be more conveniently ordered according to the model of his own or other men’s apprehensions: Which in the folly and sad consequences of it, would be to act like him who took up a beetle [mallet], and struck with all his force to kill a fly that he saw on his friend’s forehead. What else were this but to rend the body of Christ by an angry contending about the fashion of its garments, and to tear away its limbs by a violent striving to strip off those clothes which they think indecent? For my part I freely profess that were my lot cast among any of the Reformed Churches beyond the seas, I would presently join in their communion and not at all scruple to conform myself to their received customs, although perhaps in my own private persuasion I may judge some of them to be less serious and less reverent than those of the Church of England, which are now so passionately decried and condemned. I have ever venerated that oracular advice of St. Ambrose to St. Augustine: ‘If thou wilt neither give offence, nor take offence, conform thyself to all the lawful customs of the Churches where thou comest.’ (Augustine to Januarius, epistle 118) But I will not farther enlarge on this choloric and touchy controversy; only I pray that our wanton dissensions about these less important matters may not provoke God to deprive us of the substance and essentials of our religion and reduce us to such a condition wherein we should be heartily glad could we enjoy the liberty of the Gospel and the ordinances of our Lord Jesus Christ under any of those forms of administration which are now so furiously debated amongst us. It were just with God to extinguish the light of his Gospel when we use it not to work by, but all our study and strife is how to snuff it.”

— Ezekiel Hopkins, An Exposition on the Ten Commandments with other Sermons, … (London: Ranew, 1691), Second Commandment, pp. 126-34">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6We+ought+not+to+worship+God+with+any+other+external+worship+than+what+Himself+has+commanded+and+appointed+us+in+his+holy+Word.+The+Scripture+has+set+us+our+bounds+for+worship%2C+to+which+we+must+not+add%2C+and+from+which+we+ought+not+to+diminish%3B+for+whosoever+does+either+the+one+or+the+other%2C+must+needs+accuse+the+Rule+either+of+defect+in+things+necessary%2C+or+of+superfluity+in+things+unnecessary%3A+which+is+an+high+affront+to+the+wisdom+of+God%2C+who+as+He+is+the+object%2C+so+He+is+the+Prescriber+of+all+that+worship+which+He+will+accept+and+reward.+I+well+know+that+this+rule+has+given+%28I+cannot+say+cause%2C+but%29+occasion+to+many+hot+disputes+about+ecclesiastical+rites+and+constitutions%3B+some+condemning+whatsoever+is+prescribed+or+used+in+the+service+of+God%2C+besides+things+expressly+commanded+in+Scripture%2C+for+encroachments+upon+the+authority+of+God%2C+and+additions+unto+his+worship%2C+which+He+requires+to+be+performed+according+to+the+pattern+in+the+mount%2C+and+the+model+He+has+delineated+for+it%3A+Others+again+maintaining+the+privilege+and+authority+of+the+Church+in+ordaining+some+things+for+the+more+decent+and+reverend+performing+of+the+service+of+God%2C+which+are+not+particularly+required+in+the+holy+Scriptures.+I+shall+not+plunge+myself+into+this+angry+and+quarrelsome+controversy%3A+only+give+me+leave+to+say+and+sadly+to+lament+that+the+seamless+coat+of+Christ+is+rent+in+pieces+among+them%2C+whilst+some+think+it+more+decent+to+sew+on+loops+and+fringes+to+it%2C+and+others+will+have+none.+And+truly+I+think+our+differences+are+of+no+greater+importance+in+themselves%2C+though+too+woeful+in+their+consequents%2C+than+this+amounts+unto.+I+shall+clearly+express+my+sense+of+this+matter+in+a+few+words%2C+without+any+reflection+or+bitterness%2C+and+so+leave+it+to+the+judgment+of+every+ordinary+discretion.+Things+which+belong+to+the+worship+of+God%2C+may+be+considered+either+as+parts+of+that+worship%2C+or+only+as+circumstances+and+modifications+of+it%3A+First+therefore%2C+whatsoever+is+imposed+on+us+as+a+substantial+part+of+the+worship+of+God%2C+if+it+be+not+expresly+required+of+us+in+the+holy+Scriptures%2C+is+to+be+not+only+refused%2C+but+abominated.+For+this+is+a+plain+addition+to+what+God+has+commanded%2C+and+by+it+we+lay+an+imputation+upon+Him+as+though+He+wanted+%5Blacked%5D+wisdom+to+ordain+what+is+necessary+for+his+own+service.+Then+and+then+only+is+any+constitution+of+man+imposed+for+a+part+of+divine+worship+when+obedience+unto+it+is+urged+upon+us%2C+not+only+from+the+authority+enjoining+it%2C+but+also+from+the+necessity+of+the+thing+considered+simply+and+nakedly+in+its+own+nature%E2%80%A6+Other+things+are+necessary+for+our+observance+only+because+they+are+commanded+by+their+authority%2C+to+whom+we+owe+consciencious+obedience+in+things+lawful+and+indifferent.+But+we+utterly+deny+that+the+imposition+of+any+such+things+makes+them+any+parts+of+worship%2C+of+which+they+are+only+circumstances%2C+or+that+these+observances+are+necessary+to+us+or+acceptable+to+God+antecedently+to+the+command+of+authority%2C+or+that+the+worship+of+God+were+imperfect%2C+defective%2C+unacceptable+and+invalid+to+the+ends+for+which+it+is+appointed+were+not+these+observances+commanded+and+performed%3A+If+indeed+we+thought+otherwise%2C+the+bitterest+of+all+their+invectives%2C+and+the+loudest+of+all+their+exclamations+in+calling+our+worship+%E2%80%9Csuperstition%2C%E2%80%9D+%E2%80%9Cwill-worship%E2%80%9D+and+%E2%80%9Cidolatry%E2%80%9D+would+not+show+so+much+passion+as+a+just+and+rational+zeal.+But+God+forever+forbid+that+any+such+ordinances+of+man+should+be+introduced+into+our+Church.+We+all+join+in+this+vote+and+do+utterly+renounce+any+such+authority%2C+and+deny+any+such+practice.+We+usurp+not+upon+the+consciences+of+any%2C+nor+endeavour+to+persuade+them+that+that+is+in+it+self+necessary+which+is+not+so+by+God%E2%80%99s+commands+or+the+Law+of+Nature%2C+or+that+that+is+unlawful+which+is+not+condemned+by+either.+We+endeavor+to+keep+ourselves+and+you+as+much+from+a+positive%2C+as+a+negative+superstition%3A+we+endeavour+to+put+due+bounds+between+things+simply+necessary%2C+either+by+the+command+of+God+or+their+own+natural+reason+and+goodness%2C+and+such+as+are+in+themselves+indifferent.+We+say+that+nothing+is+a+part+of+worship+but+what+belongs+to+the+former%2C+but+some+things+that+belong+to+the+latter+may+be+used+in+worship+as+fit+and+decent+circumstances%3A+And+when+such+things+are+imposed%2C+they+become+necessary%3B+not+indeed+in+themselves+%28for+no+human+authority+can+alter+the+nature+of+things%29%2C+but+to+our+practice%2C+and+our+consciences+are+obliged+to+them%3A+But+how%3F+not+indeed+simply+and+absolutely%2C+so+that+it+shall+never+be+lawful+to+omit+them%2C+but+only+in+two+cases%3A+in+case+of+scandal+and+contempt.+We+ought+not+to+omit+them+if+we+judge+any+offence+will+be+taken+by+others+at+our+neglect%3A+we+ought+not+to+omit+them+at+any+time+out+of+a+contempt+and+disrespect+towards+them.+And+thus+you+see+we+put+a+vast+difference+between+that+which+is+a+part+of+worship+and+that+which+is+but+a+circumstance+of+worship%3A+If+any+thing+be+commanded+us+by+men%2C+as+a+part+of+worship%2C+which+is+not+commanded+us+by+God%2C+we+ought+not+to+submit+unto+it.+But%3A+Secondly%2C+if+any+thing+be+imposed+on+us+not+as+a+part+of+worship%2C+but+as+a+circumstance+and+modification+of+worship%2C+we+may+and+we+ought+to+submit+unto+it%3A+First%2C+if+the+things+so+imposed+be+in+themselves+lawful+and+honest%2C+which+they+are%2C+if+not+condemned+by+the+Scripture.+Secondly%2C+if+they+tend+to+order+and+decency+in+the+Church.+Of+which+certainly+they+are+as+fit+to+be+judges+who+have+authority+both+in+Church+and+State%2C+as+every+private+and+perhaps+less-knowing+Christian.+Thirdly%2C+if+they+are+imposed+by+the+command+of+a+lawful+power%2C+to+whom+we+ought+to+submit+in+all+things+that+are+lawful.+Fourthly%2C+if+they+are+such+as+neither+for+their+levity+nor+number+eat+out+or+distract+the+seriousness+and+devotion+of+our+spiritual+worship%3A+Which+I+think+cannot+justly+be+imputed+to+the+observances+of+our+Church%2C+being+very+few+for+number+and+very+grave+and+modest+for+use.+If+such+things+as+these+be+imposed+upon+us%2C+the+worship+of+God+is+not+thereby+either+changed+or+adulterated%2C+neither+is+there+any+addition+made+unto+it%2C+but+the+substance+of+that+worship+is+still+in+conformity+to+God%E2%80%99s+laws+when+yet+the+outward+and+indifferent+manner+of+it+is+in+conformity+to+man%E2%80%99s.+Certainly+it+is+no+addition+to+baptism+to+give+a+name+to+the+baptized%2C+though+we+find+no+express+command+for+it.+And+I+much+wonder+among+our+carping+brethren+some+or+other+had+not+scrupled+this+as+well+as+another+observance.+It+is+no+addition+to+the+ordinances+of+Jesus+Christ+to+appoint+at+what+hour+they+shall+be+celebrated+or+in+what+garment%2C+or+in+what+decent+posture%2C+for+all+these+things+are+extrinsical+to+the+worship+of+God+and+fall+under+the+cognizance+and+direction+of+our+superiors.+Certainly+did+we+but+rightly+weigh+what+is+required+as+a+part+of+worship+and+what+only+as+a+circumstance+of+worship%2C+a+great+deal+of+heat+and+contention%2C+and+uncharitable+prejudice+would+be+removed+and+prevented.+It+is+true+our+Savior%2C+Mt.+15%3A9%2C+condemns+the+scribes+and+Pharisees%2C+that+taught+for+doctrines+the+commandments+of+men%3A+that+is%2C+they+taught+those+things+which+were+but+the+traditions+and+ordinances+of+their+elders+to+be+in+themselves+absolutely+necessary+to+the+serving+and+worshipping+of+God.+But+certainly+this+reproof+falls+not+upon+these%2C+who+though+they+do+enjoin+what+they+judge+fit+for+order%2C+yet+do+not+teach+them+for+doctrines%2C+and+are+so+far+from+thinking+their+commandments+an+essential+part+of+worship+that+they+would+abhor+and+anathematize+all+those+that+do+so.+Necessary+they+are+to+be+submitted+unto+and+practiced+because+enjoined+by+that+authority+to+which+God+has+committed+the+care+of+the+First+Table%2C+as+well+as+the+Second%2C+but+%5Bthey+are%5D+not+necessary+in+themselves+as+any+part+of+the+worship+and+service+of+God%2C+without+which%2C+although+they+were+not+imposed+by+men%2C+it+would+be+unacceptable+to+Him%3A+And+whosoever+thinks+so%2C+let+him+be+accursed.+And+now+that+I+have+delivered+my+judgment+without+bitterness%2C+give+me+leave+to+make+some+few+lamentations+in+the+grief+and+bitterness+of+my+soul%3A+Is+it+not+to+be+bitterly+lamented+that+in+a+Reformed+and+Orthodox+Church+there+should+be+such+schisms%2C+rents+and+divisions%2C+altar+against+altar%2C+pulpit+against+pulpit%2C+and+one+congregation+against+another%3F+And+what+is+all+this+contention+and+separation+for%3F+Oh%2C+they+will+tell+you+it+is+for+the+purity+of+religion%2C+for+the+true+and+sincere+worship+of+God%2C+that+they+may+serve+Him+purely+without+human+additions+or+inventions.+Thus+goes+the+cry%3B+and+a+company+of+poor%2C+ignorant%2C+well-meaning+souls%2C+because+it+is+very+demurely+and+gravely+spoken%2C+take+it+up+and+join+with+it%2C+never+examining+the+grounds+and+bottom+of+it%3B+but+conclude+that+these+must+needs+be+in+the+right+who+complain+of+corruptions+and+pretend+to+a+happy+and+glorious+reformation.+Alas%2C+my+brethren%2C+was+there+ever+any+schism+in+the+world+that+did+not+plead+the+same%3F+Did+not+others+upon+the+same+pretences+separate+from+their+communion+upon+which+they+now+separate+from+ours%3F+And+may+not+the+same+argument+serve+to+crumble+them+into+infinite+fractions+and+subdivisions%3F+till+at+last+we+come+to+have+almost+as+many+Churches+as+men%2C+and+scarce+a+man+constant+and+coherent+to+himself.+But+what+is+it+in+our+worship+which+they+dislike%3F+The+substantials+of+it+are+all+the+same+with+their+own%3A+We+utterly+disavow+that+we+make+that+any+part+of+worship+which+the+Scripture+has+not%3A+and+I+think+that+man+very+much+forsaken+of+reason+and+common+understanding+who+shall+endeavour+to+persuade+us+that+we+intend+worship+when+we+ourselves+most+earnestly+and+seriously+profess+the+contrary.+Is+it+then+that+we+differ+about+mere+accidents+and+circumstances%3F+I+confess+we+do%3A+but+assert+withal+that+these+things+are+not+a+just+cause+of+separation+from+us.+If+we+look+back+upon+the+primitive+times%2C+we+shall+find+that+almost+every+Church+had+its+different+rites+and+observances%3B+and+yet+under+that+diversity+maintained+unity+and+communion%3A+Yea%2C+and+at+this+day%2C+the+reformed+Churches+observe+different+customs+one+from+another+and+yet+they+inviolably+hold+communion+together+and+we+with+them.+The+Gallican%2C+Belgic%2C+Helvetian+and+German+Churches+reject+us+not%2C+nor+we+them%2C+although+we+differ+in+rites+and+discipline%2C+and+those+things+which+are+left+to+the+prudence+of+every+Church+to+constitute+as+they+shall+judge+most+necessary+for+order+and+edification.+Now+certainly+if+these+different+rites+and+observances+be+no+ground+for+one+national+Church+to+separate+from+the+communion+of+another%2C+they+can+be+no+ground+for+private+persons+to+separate+from+the+communion+of+that+Church+to+which+they+belonged.+Nay%2C+although+they+might+with+reason+dislike+many+usages+either+as+frivilous+or+incongruous%2C+yet+it+becomes+the+temper+and+modesty+of+a+pious+Christian%2C+in+things+merely+circumstantial%2C+to+submit+his+practice+to+the+judgment+of+that+authority+under+which+he+lives+and+not+to+separate+from+the+communion+of+the+Church%2C+to+forsake+its+assemblies%2C+to+disown+its+administrations%2C+only+because+he+thinks+some+things+might+be+more+conveniently+ordered+according+to+the+model+of+his+own+or+other+men%E2%80%99s+apprehensions%3A+Which+in+the+folly+and+sad+consequences+of+it%2C+would+be+to+act+like+him+who+took+up+a+beetle+%5Bmallet%5D%2C+and+struck+with+all+his+force+to+kill+a+fly+that+he+saw+on+his+friend%E2%80%99s+forehead.+What+else+were+this+but+to+rend+the+body+of+Christ+by+an+angry+contending+about+the+fashion+of+its+garments%2C+and+to+tear+away+its+limbs+by+a+violent+striving+to+strip+off+those+clothes+which+they+think+indecent%3F+For+my+part+I+freely+profess+that+were+my+lot+cast+among+any+of+the+Reformed+Churches+beyond+the+seas%2C+I+would+presently+join+in+their+communion+and+not+at+all+scruple+to+conform+myself+to+their+received+customs%2C+although+perhaps+in+my+own+private+persuasion+I+may+judge+some+of+them+to+be+less+serious+and+less+reverent+than+those+of+the+Church+of+England%2C+which+are+now+so+passionately+decried+and+condemned.+I+have+ever+venerated+that+oracular+advice+of+St.+Ambrose+to+St.+Augustine%3A+%E2%80%98If+thou+wilt+neither+give+offence%2C+nor+take+offence%2C+conform+thyself+to+all+the+lawful+customs+of+the+Churches+where+thou+comest.%E2%80%99+%28Augustine+to+Januarius%2C+epistle+118%29+But+I+will+not+farther+enlarge+on+this+choloric+and+touchy+controversy%3B+only+I+pray+that+our+wanton+dissensions+about+these+less+important+matters+may+not+provoke+God+to+deprive+us+of+the+substance+and+essentials+of+our+religion+and+reduce+us+to+such+a+condition+wherein+we+should+be+heartily+glad+could+we+enjoy+the+liberty+of+the+Gospel+and+the+ordinances+of+our+Lord+Jesus+Christ+under+any+of+those+forms+of+administration+which+are+now+so+furiously+debated+amongst+us.+It+were+just+with+God+to+extinguish+the+light+of+his+Gospel+when+we+use+it+not+to+work+by%2C+but+all+our+study+and+strife+is+how+to+snuff+it.%E2%80%9D%0A%0A%E2%80%94+Ezekiel+Hopkins%2C+An+Exposition+on+the+Ten+Commandments+with+other+Sermons%2C+%E2%80%A6+%28London%3A+Ranew%2C+1691%29%2C+Second+Commandment%2C+pp.+126-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd00680e9d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d00680e9d7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=We%20ought%20not%20to%20worship%20God,strife%20is%20how%20to%20snuff%20it&amp;text=We%20ought%20not%20to%20worship%20God%20with%20any&amp;text=study%20and%20strife%20is%20how%20to%20snuff%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

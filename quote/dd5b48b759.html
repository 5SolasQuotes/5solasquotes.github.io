<blockquote><p>[S]ystematic theology has important purposes to secure, not only in testing and guarding purity of doctrine in a church, but in combining the scattered truths of God’s Word, so that we may clearly apprehend them: in exhibiting the unity of the faith; and in facing the misapprehensions, mistakes, and errors which may arise. In particular, great good may be effected by a full display, and a reflective contemplation of the divine character; and in order to this, there must be some order, plan, and division, and the more logical these are the better for every purpose, speculative or practical.

Care must be taken always, in drawing such a portraiture, to shew that the attributes are not distinct parts of the divine essence, but simply different aspects of the one God, viewed separately because of the infirmity of our minds, and the narrowness of our vision, which prevent us from taking in the whole object at once, and constrain us to survey it part after part. As it is not the abstract quality, but the concrete being that calls forth feeling and affection, we must ever contemplate his perfections, as combined in the unity of his living person. It is to be said, in behalf of Charnock, that he never leaves the impression that the attributes are separate existences; they are simply different manifestations presented to us, and views taken by us of the one God, who is at once Great and Good, Holy and Gracious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-mccosh.html">James McCosh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction to, The Complete Works of Stephen Charnock, B.D.</cite></span></figcaption>

<blockquote><p>To God indeed the grand object of knowledge, the great source of obligation, the bestower of all happiness, the author of every good and perfect gift, your attention already has been or should have been directed in the study of his works, and especially in the study of man, the noblest of his works. God’s works should be all studied with a reference to him who created and sustains them.

The things that are made should be ever contemplated as having been made and regulated for the purpose of making known the invisible things of God, even his eternal power and Godhead; and moral philosophy, when taught as it should be, unfolds all that can be known of God, and of man’s relation to him, from the light of nature and the works of creation and providence, and especially from man’s mental constitution, in order to settle aright the nature, ground, and requirements of duty, in so far as these can be known and ascertained without an immediate and supernatural revelation.</p></blockquote>

</figure><figure class="quote" id="q-dc3d5105c3" data-kw="">
<blockquote><p>Part of Heider’s project is to argue that Suárez was in fact a moderate realist, despite widespread characterizations of him, both by his immediate successors and by recent scholars, as essentially a nominalist. Such characterizations gain strength from Suárez’s own statement that he perhaps differed from the nominalists only modo loquendi (97). Heider, however, argues that it makes more sense to regard Suárez as a moderate realist, of broadly the same stripe as Poinsot, Mastri, and Belluto. It is not always entirely clear, though, wherein Heider disagrees with other commentators. Do they offer substantively different interpretations of Suárez, or are they using different taxonomies, with more or less strict usages of the term “nominalist?” In particular, it is worth noting that, if the crude, but widely used, division between realism and nominalism is employed, moderate realism is a species of nominalism, rather than the realism its name suggests. The great strength of this book is Heider’s masterful, detailed examination of three representative accounts from sixteenth- and seventeenth-century Scholasticism. Suárez offers an original blend of Thomist, Scotist, and nominalist elements; Poinsot’s account is more purely ad mentem Thomi, while Mastri and Belluto take an approach ad mentem Scoti. Of course, there were other streams of thought in the period, but Heider reasonably takes these to be the most important ones… Heider rightly presents Suárez as the first Scholastic of a venerable early modern tradition, rather than as the last schoolman. The present volume decisively dismantles the latter characterization.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-heider.html">Daniel Heider</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universals in Second Scholasticism</cite>, (1548–1617), João Poinsot O.P. (1589–1644) and Bartolomeo Mastri da Meldola O.F.M. Conv. (1602–1673)/Bonaventura Belluto O.F.M. Conv. (1600–1676) (Amsterdam: John Benjamins Publishing Company, 2014) 344 pp. | See this review by Sydney Penner. Penner:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-b741f69f04" data-kw="">
<blockquote><p>But here peradventure some man may demand of me, whether this my commendation doth extend it self to the Schoolmen, and chiefly unto those which have taken their original from the Master of sentences [Peter Lombard], and whether their writings doo appertain to that good and true part of Logic, which resolveth doubtful arguments? Truly, as I am not willing at this time to set down my absolute opinion (touching so many men) herein: for, for my own part let each one of them have his due reverence for his travail and labour, so am I not afeard to speak both boldly &amp; freely my mind, what I think, always (not withstanding) keeping my self within my compass:

John Duns Scotus (commonly called the subtill Doctor) saith that the Divines have in some places mixed Philosophy with Divinity, &amp; that with great profit: I truly confess that they have mingled it with divinity, yea I add they have therewith confused Divinity, but if he think it was done with any fruit, I beseech master Doctor pardon me if I cannot herein agree with him: for sithen the Schoolmen have not followed that good part of disputing, which giveth true resolutions to arguments (as we shall hereafter declare) but have as it were dallied &amp; sported themselves in probabilities, &amp; being for the most part vain &amp; frivolous arguments, me thinks they have not brought into the Church of God the true use, but rather the abuse of Philosophy: and truly, I say it seemeth to me, that into the midst of the Church, the Schoolmen have brought sophistication and shameless falsehood, decked and adorned with the colour &amp; name of Philosophy, as of an honest matron, to the great detriment &amp; hurt of the Church.

But you will say, they have not gotten this sharp knowledge of disputing without great labour and pains: I grant it to be so: for oftentimes when I see these school men labouring, sweating, and as it were out of breath in these their, subtill disputations, they make me to remember the Trojans, which with great labour and care brought into their City, the counterfeit Grecian Horse, whereby ensued the ruin of the whole Kingdom of Troy. So these schoolmen with great industry and labour, have brought into the church false Philosophie: that there hence, as from the Trojan horse might spring infinite errors: by which, while these who should have ben the watchmen over the Church, were even over whelmed in school ignorance, those errors have crept in, corrupted and wasted the Church of God (so as I may use the saying of Esaias) Except the Lord had left us a small remnant, we had had no church at all.

A proof hereof is the Church of Rome, so depraved and corrupted, that while we seek the Church in the Church, we are constrained, not without great sorrow and tears, only to behold the ashes of the true Church. But because I may not seem here more willing to lament, then to dispute: mark what I say, to wit, that the schoolmen and questionnaire Doctors, have neither followed the true manner of divine disputations, neither lawful use of Logic: &amp; that this may the more evidently appear, out of divers &amp; sundry their errors, I will gather certain, by the which we may plainly see, that they have erred not a little in their disputations, from the true manner of divine Disputing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antoine-de-chandieu.html">Antoine de Chandieu</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise touching the Word of God written, against the traditions of men handled both school like, and divine like, where also is set down a true method to dispute divinely and school like</cite>, trans. John Coxe (London: John Harrison, 1583), pp 8-11.</span></figcaption>

— Antoine de Chandieu, A treatise touching the Word of God written, against the traditions of men handled both school like, and divine like, where also is set down a true method to dispute divinely and school like, trans. John Coxe (London: John Harrison, 1583), pp 8-11.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+here+peradventure+some+man+may+demand+of+me%2C+whether+this+my+commendation+doth+extend+it+self+to+the+Schoolmen%2C+and+chiefly+unto+those+which+have+taken+their+original+from+the+Master+of+sentences+%5BPeter+Lombard%5D%2C+and+whether+their+writings+doo+appertain+to+that+good+and+true+part+of+Logic%2C+which+resolveth+doubtful+arguments%3F+Truly%2C+as+I+am+not+willing+at+this+time+to+set+down+my+absolute+opinion+%28touching+so+many+men%29+herein%3A+for%2C+for+my+own+part+let+each+one+of+them+have+his+due+reverence+for+his+travail+and+labour%2C+so+am+I+not+afeard+to+speak+both+boldly+%26+freely+my+mind%2C+what+I+think%2C+always+%28not+withstanding%29+keeping+my+self+within+my+compass%3A%0A%0AJohn+Duns+Scotus+%28commonly+called+the+subtill+Doctor%29+saith+that+the+Divines+have+in+some+places+mixed+Philosophy+with+Divinity%2C+%26+that+with+great+profit%3A+I+truly+confess+that+they+have+mingled+it+with+divinity%2C+yea+I+add+they+have+therewith+confused+Divinity%2C+but+if+he+think+it+was+done+with+any+fruit%2C+I+beseech+master+Doctor+pardon+me+if+I+cannot+herein+agree+with+him%3A+for+sithen+the+Schoolmen+have+not+followed+that+good+part+of+disputing%2C+which+giveth+true+resolutions+to+arguments+%28as+we+shall+hereafter+declare%29+but+have+as+it+were+dallied+%26+sported+themselves+in+probabilities%2C+%26+being+for+the+most+part+vain+%26+frivolous+arguments%2C+me+thinks+they+have+not+brought+into+the+Church+of+God+the+true+use%2C+but+rather+the+abuse+of+Philosophy%3A+and+truly%2C+I+say+it+seemeth+to+me%2C+that+into+the+midst+of+the+Church%2C+the+Schoolmen+have+brought+sophistication+and+shameless+falsehood%2C+decked+and+adorned+with+the+colour+%26+name+of+Philosophy%2C+as+of+an+honest+matron%2C+to+the+great+detriment+%26+hurt+of+the+Church.%0A%0ABut+you+will+say%2C+they+have+not+gotten+this+sharp+knowledge+of+disputing+without+great+labour+and+pains%3A+I+grant+it+to+be+so%3A+for+oftentimes+when+I+see+these+school+men+labouring%2C+sweating%2C+and+as+it+were+out+of+breath+in+these+their%2C+subtill+disputations%2C+they+make+me+to+remember+the+Trojans%2C+which+with+great+labour+and+care+brought+into+their+City%2C+the+counterfeit+Grecian+Horse%2C+whereby+ensued+the+ruin+of+the+whole+Kingdom+of+Troy.+So+these+schoolmen+with+great+industry+and+labour%2C+have+brought+into+the+church+false+Philosophie%3A+that+there+hence%2C+as+from+the+Trojan+horse+might+spring+infinite+errors%3A+by+which%2C+while+these+who+should+have+ben+the+watchmen+over+the+Church%2C+were+even+over+whelmed+in+school+ignorance%2C+those+errors+have+crept+in%2C+corrupted+and+wasted+the+Church+of+God+%28so+as+I+may+use+the+saying+of+Esaias%29+Except+the+Lord+had+left+us+a+small+remnant%2C+we+had+had+no+church+at+all.%0A%0AA+proof+hereof+is+the+Church+of+Rome%2C+so+depraved+and+corrupted%2C+that+while+we+seek+the+Church+in+the+Church%2C+we+are+constrained%2C+not+without+great+sorrow+and+tears%2C+only+to+behold+the+ashes+of+the+true+Church.+But+because+I+may+not+seem+here+more+willing+to+lament%2C+then+to+dispute%3A+mark+what+I+say%2C+to+wit%2C+that+the+schoolmen+and+questionnaire+Doctors%2C+have+neither+followed+the+true+manner+of+divine+disputations%2C+neither+lawful+use+of+Logic%3A+%26+that+this+may+the+more+evidently+appear%2C+out+of+divers+%26+sundry+their+errors%2C+I+will+gather+certain%2C+by+the+which+we+may+plainly+see%2C+that+they+have+erred+not+a+little+in+their+disputations%2C+from+the+true+manner+of+divine+Disputing.%E2%80%9D%0A%0A%E2%80%94+Antoine+de+Chandieu%2C+A+treatise+touching+the+Word+of+God+written%2C+against+the+traditions+of+men+handled+both+school+like%2C+and+divine+like%2C+where+also+is+set+down+a+true+method+to+dispute+divinely+and+school+like%2C+trans.+John+Coxe+%28London%3A+John+Harrison%2C+1583%29%2C+pp+8-11.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb741f69f04.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b741f69f04.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/17/antoine-de-la-roche-chandieu-on-the-schoolmen-and-philosophy/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

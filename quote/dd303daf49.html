<main class="wrap"><figure class="quote" id="q-dd303daf49" data-kw="">
<blockquote><p>Therefore when I see that a man is sufficiently contrite, oppressed by the Law, terrified by sin, and thirsting for comfort, then it is time for me to take the Law and active righteousness from his sight and to set forth before him, through the Gospel, the passive righteousness which excludes Moses and the Law and shows the promise of Christ, who came for the afflicted and for sinners. Here a man is raised up again and gains hope. Nor is he any longer under the Law; he is under grace, as the apostle says (Rom. 6:14): “You are not under law but under grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann (Concordia Publishing House, 1999), 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>if heretics wanted only the merits of Christ to be imputed to us, because they are given to us, and we can offer them to God the Father for our sins, since Christ undertakes the burden of satisfying for us, and not reconciling us to God the Father, their opinion would be correct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Imputed Righteousness’, pp. 259-61 Latin | XXXIII. Indeed, not even our way of speaking is dared to be simply condemned by the Roman School of Theology, for they concede that it can be said in a sound sense that the righteousness of Christ is imputed to us and becomes ours. Indeed, that sound sense according to which they interpret that expression is the very one that we intend. This is clearly evident from Bellarmine, bk. 2, On Justification, ch. 7, §4: “Fourth, it is refuted. For,” he says</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

<blockquote><p>But if we attend to the four kinds of causes which philosophers bring under our view in regard to effects, we shall find that not one of them is applicable to works as a cause of salvation. The efficient cause of our eternal salvation the Scripture uniformly proclaims to be the mercy and free love of the heavenly Father towards us; the material cause to be Christ, with the obedience by which he purchased righteousness for us; and what can the formal or instrumental cause be but faith?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.14.17</span></figcaption>

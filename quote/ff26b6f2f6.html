<main class="wrap"><figure class="quote" id="q-ff26b6f2f6" data-kw="">
<blockquote><p>One of the sections of the Directory is given to the Singing of Psalms, and declares it “the duty of Christians to praise God publickly by singing of psalms together in the congregation, and also privately in the family”. This rubric manifestly implied the provision of a Psalm Book, and it was made part of the function of the Assembly in preparing a basis for uniformity of worship in the churches of the three kingdoms, to supply them with a common Psalm Book. The way was prepared for this by the submitment to the Assembly by the House of Commons on Nov. 20, 1643, of the query whether “it may not be useful and profitable to the Church that the Psalms set forth by Mr. Rouse be permitted to be publicly sung”.

The result of the Assembly’s examination of Mr. Rouse’s version (first printed in 1643) was to recommend it, after it had been subjected to a thorough revision at its own hands, to Parliament as a suitable Psalm-Book for the Church (autumn of 1645). The Commons accordingly ordered the book printed in this revised form (it appeared in 1646, i. e., Feb. 1647), and (April 15, 1646) issued an order establishing it as the sole Psalm Book to be used in the Churches of England and Wales, though the House of Lords never concurred in this order.

The Scotch Assembly subjected the book to a still furthermore searching revision, and by an act passed in 1649 (ratified by the Estates of Parliament in 1650) approved it in this new form for use in the Scottish Churches. It is in this Scottish revision alone (printed in 1650) in which they can only by courtesy continue to bear the name of Francis Rouse as their author, that these Psalms have passed into wide use.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Assembly and its Work in Princeton Theological Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa241f15f9" data-kw="">
<blockquote><p>Dr. [James H.] Snowden belongs to a denomination which has a Hymnal. At the back of this Hymnal there is a “Psalter.” This Psalter contains sixty selections, averaging twenty to thirty verses each. All are taken from the Old Testament Psalms; and they are intended for use in the public worship of Almighty God. We imagine that they are used regularly by most of the congregations of the Presbyterian Church to which Dr. Snowden belongs.

Yet according to Dr. Snowden the Psalms passed centuries ago “into the museum of fossilized religion and extinct theology.” A more grievous misrepresentation, it would be hard to find. “If a son shall ask bread of any of you that is a father, will he give him a stone?” Either the ministers of the Presbyterian Church in the U.S.A. are calling upon their congregations once or twice every Sunday to resurrect some of the “fossils” of an all but forgotten past, to feed on “stones,” or else Dr. Snowden has traduced and defamed some of the most precious possessions of the Christian believer of today.

The Old Testament Psalms are pre-eminently the book of devotion of the Christian Church. They are not “fossils”; they are not “dead and turned to stone.” They are full of living truth because they are the words of the living God. They have brought blessing and comfort and life to countless generations of believers. They were the solace of the persecuted saints on the desolate moors of Scotland and in the mountain fastnesses of the Waldenses. Martyrs went to the stake with psalms on their lips. They have been read and chanted and sung in every part of the Christian Church; and will continue to be so used while time shall last. “Fossils”! Every Christian who is loyal to God’s word will emphatically repudiate such an outrageous metaphor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oswald-thompson-allis.html">Oswald Thompson Allis</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Was Jesus a Modernist? in Princeton Theological Review</cite></span></figcaption>

<blockquote><p>Of the 150 Psalms in the Psalter, some six are commonly classified as “imprecatory” Psalms—the 55th, 59th, 69th, 79th, 109th and 137th. Many other Psalms contain “imprecatory” elements, namely, divinely inspired prayers for the destruction of certain wicked men, enemies of God. The Psalter is constantly being reproached because of the “imprecatory” Psalms. It is said that these Psalms breathe a savage spirit, that they are alien to the “spirit of Jesus,” that they are not suited to Christian devotion, and so forth.

These objections spring partly from a misunderstanding of the Psalms themselves. The objectors often regard them as mere human compositions. They see in them simply David’s private wrath against his personal enemies. But such is not the character of these Psalms. They are divinely inspired and they are directed against implacable enemies of God and of God’s kingdom. They are so cited in the New Testament (Psalm 69:25 and 109:8 quoted in Acts 1:20).

Nor are the “imprecatory” Psalms really contrary to the “spirit of Jesus” or the “spirit” of the New Testament. All that is found in them can be matched by statements of the New Testament, and none is more terrible than the words of Jesus Christ against those permanently identified with Satan’s kingdom. The objections also arise partly from a false idealism in religion, which regards Christianity as merely a matter of ideals. Christianity is not merely a matter of ideals; it is not even merely salvation; Christianity is divine redemption from an objective realm of evil—from the land of Egypt, from the house of bondage, from Satan’s kingdom.

Christianity involves divine judgment on sin and sinners as truly as it involves divine redemption for God’s people. The false notion that God is nothing but love is responsible for much of the opposition to these Psalms. The present writer recalls hearing a young woman, a member of a Psalm-singing church, say of Psalm 137: “I just HATE that Psalm!”

The most charitable explanation of this attitude toward a part of God’s holy Word is that this young woman really understood neither Psalm 137, nor the real character of Biblical religion as divine redemption from an objective realm of evil. She had no doubt been fed on a false religious idealism which thought of God as nothing but love, and left His justice entirely out of the picture.

Such is a very one-sided view of God. “Behold the goodness and severity of God” (Romans 11:22)—not only the goodness of God, but also the severity of God. The Psalms give the whole picture, not just one side. They portray not only God’s love and salvation, but His justice and retribution meted out to wicked men. Christ’s kingdom is not advanced without Satan’s kingdom being destroyed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ashamed of the Tents of Shem? in Blue Banner Faith and Life</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“Of the 150 Psalms in the Psalter, some six are commonly classified as “imprecatory” Psalms—the 55th, 59th, 69th, 79th, 109th and 137th. Many other Psalms contain “imprecatory” elements, namely, divinely inspired prayers for the destruction of certain wicked men, enemies of God. The Psalter is constantly being reproached because of the “imprecatory” Psalms. It is said that these Psalms breathe a savage spirit, that they are alien to the “spirit of Jesus,” that they are not suited to Christian devotion, and so forth.

These objections spring partly from a misunderstanding of the Psalms themselves. The objectors often regard them as mere human compositions. They see in them simply David’s private wrath against his personal enemies. But such is not the character of these Psalms. They are divinely inspired and they are directed against implacable enemies of God and of God’s kingdom. They are so cited in the New Testament (Psalm 69:25 and 109:8 quoted in Acts 1:20).

Nor are the “imprecatory” Psalms really contrary to the “spirit of Jesus” or the “spirit” of the New Testament. All that is found in them can be matched by statements of the New Testament, and none is more terrible than the words of Jesus Christ against those permanently identified with Satan’s kingdom. The objections also arise partly from a false idealism in religion, which regards Christianity as merely a matter of ideals. Christianity is not merely a matter of ideals; it is not even merely salvation; Christianity is divine redemption from an objective realm of evil—from the land of Egypt, from the house of bondage, from Satan’s kingdom.

Christianity involves divine judgment on sin and sinners as truly as it involves divine redemption for God’s people. The false notion that God is nothing but love is responsible for much of the opposition to these Psalms. The present writer recalls hearing a young woman, a member of a Psalm-singing church, say of Psalm 137: “I just HATE that Psalm!”

The most charitable explanation of this attitude toward a part of God’s holy Word is that this young woman really understood neither Psalm 137, nor the real character of Biblical religion as divine redemption from an objective realm of evil. She had no doubt been fed on a false religious idealism which thought of God as nothing but love, and left His justice entirely out of the picture.

Such is a very one-sided view of God. “Behold the goodness and severity of God” (Romans 11:22)—not only the goodness of God, but also the severity of God. The Psalms give the whole picture, not just one side. They portray not only God’s love and salvation, but His justice and retribution meted out to wicked men. Christ’s kingdom is not advanced without Satan’s kingdom being destroyed.”

— Johannes G. Vos, Ashamed of the Tents of Shem? in Blue Banner Faith and Life">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COf+the+150+Psalms+in+the+Psalter%2C+some+six+are+commonly+classified+as+%E2%80%9Cimprecatory%E2%80%9D+Psalms%E2%80%94the+55th%2C+59th%2C+69th%2C+79th%2C+109th+and+137th.+Many+other+Psalms+contain+%E2%80%9Cimprecatory%E2%80%9D+elements%2C+namely%2C+divinely+inspired+prayers+for+the+destruction+of+certain+wicked+men%2C+enemies+of+God.+The+Psalter+is+constantly+being+reproached+because+of+the+%E2%80%9Cimprecatory%E2%80%9D+Psalms.+It+is+said+that+these+Psalms+breathe+a+savage+spirit%2C+that+they+are+alien+to+the+%E2%80%9Cspirit+of+Jesus%2C%E2%80%9D+that+they+are+not+suited+to+Christian+devotion%2C+and+so+forth.%0A%0AThese+objections+spring+partly+from+a+misunderstanding+of+the+Psalms+themselves.+The+objectors+often+regard+them+as+mere+human+compositions.+They+see+in+them+simply+David%E2%80%99s+private+wrath+against+his+personal+enemies.+But+such+is+not+the+character+of+these+Psalms.+They+are+divinely+inspired+and+they+are+directed+against+implacable+enemies+of+God+and+of+God%E2%80%99s+kingdom.+They+are+so+cited+in+the+New+Testament+%28Psalm+69%3A25+and+109%3A8+quoted+in+Acts+1%3A20%29.%0A%0ANor+are+the+%E2%80%9Cimprecatory%E2%80%9D+Psalms+really+contrary+to+the+%E2%80%9Cspirit+of+Jesus%E2%80%9D+or+the+%E2%80%9Cspirit%E2%80%9D+of+the+New+Testament.+All+that+is+found+in+them+can+be+matched+by+statements+of+the+New+Testament%2C+and+none+is+more+terrible+than+the+words+of+Jesus+Christ+against+those+permanently+identified+with+Satan%E2%80%99s+kingdom.+The+objections+also+arise+partly+from+a+false+idealism+in+religion%2C+which+regards+Christianity+as+merely+a+matter+of+ideals.+Christianity+is+not+merely+a+matter+of+ideals%3B+it+is+not+even+merely+salvation%3B+Christianity+is+divine+redemption+from+an+objective+realm+of+evil%E2%80%94from+the+land+of+Egypt%2C+from+the+house+of+bondage%2C+from+Satan%E2%80%99s+kingdom.%0A%0AChristianity+involves+divine+judgment+on+sin+and+sinners+as+truly+as+it+involves+divine+redemption+for+God%E2%80%99s+people.+The+false+notion+that+God+is+nothing+but+love+is+responsible+for+much+of+the+opposition+to+these+Psalms.+The+present+writer+recalls+hearing+a+young+woman%2C+a+member+of+a+Psalm-singing+church%2C+say+of+Psalm+137%3A+%E2%80%9CI+just+HATE+that+Psalm%21%E2%80%9D%0A%0AThe+most+charitable+explanation+of+this+attitude+toward+a+part+of+God%E2%80%99s+holy+Word+is+that+this+young+woman+really+understood+neither+Psalm+137%2C+nor+the+real+character+of+Biblical+religion+as+divine+redemption+from+an+objective+realm+of+evil.+She+had+no+doubt+been+fed+on+a+false+religious+idealism+which+thought+of+God+as+nothing+but+love%2C+and+left+His+justice+entirely+out+of+the+picture.%0A%0ASuch+is+a+very+one-sided+view+of+God.+%E2%80%9CBehold+the+goodness+and+severity+of+God%E2%80%9D+%28Romans+11%3A22%29%E2%80%94not+only+the+goodness+of+God%2C+but+also+the+severity+of+God.+The+Psalms+give+the+whole+picture%2C+not+just+one+side.+They+portray+not+only+God%E2%80%99s+love+and+salvation%2C+but+His+justice+and+retribution+meted+out+to+wicked+men.+Christ%E2%80%99s+kingdom+is+not+advanced+without+Satan%E2%80%99s+kingdom+being+destroyed.%E2%80%9D%0A%0A%E2%80%94+Johannes+G.+Vos%2C+Ashamed+of+the+Tents+of+Shem%3F+in+Blue+Banner+Faith+and+Life&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F232c705faa.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/232c705faa.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/07/02/j-g-vos-in-defence-of-the-imprecatory-psalms/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-ed806dae49" data-kw="">
<blockquote><p>Q. 220 But how can you apply the promised grace to yourself through faith when you have been stained in so many ways by so many sins?

A. First, because God has thus revealed his mercy, that he desires to forgive all the sins of the believer, no matter how many and how great. Second, because the merit of Christ is infinitely greater than all sins, not only mine but also those of all people. Third, because God commands me to believe in Christ, no matter how much I have sinned. And, at the same time, he affirms that not to believe is a greater sin than any other that could be committed by anyone. Therefore, just because I have offended my God with so many and such great sins, I ought not to add this, by far the greatest of all sins, so that I ungratefully trample on God’s mercy and the blood of his Son which was shed for me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Large Catechism</cite>, (1561), trans. Fred H. Klooster and John Medendrop; http://links.christreformed.org/doctrinevision/ursinus_project.pdf.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-7fa7c9a504" data-kw="">
<blockquote><p>Q163 But if the wages of eternal life is not owed from the worthiness of the works themselves, still it is at least due from the covenant.

A163 What covenant do you mean?

Q164 The covenant of the law: Do this, and you will live, and if you want to enter life, keep the commandments.

A164 This covenant is understood in terms of the threatening which is set against the promise. Moreover, it holds, by the testimony of the apostle himself, he who does not remain in all things which are written in the book of the law, so that he keeps them, is cursed. Now the law requires perfect love. But no one besides Christ alone fully keeps the law. Therefore, life is owed to Christ alone by the covenant; moreover, to us, to whom He is given by mere grace, life is given from the same by mere grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Book of Christian Questions and Responses. In which the Principal Headings of the Christian Religion are briefly set forth</cite>, trans. Kirk M. Summers, ed. Dikran Y. Hadidian (1570; Eugene OR: Pickwick Publications, 1986), p. 64.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9def32908a" data-kw="">
<blockquote><p>Should we go to speak now of the love of Christ, on the one side, it is an ocean,—we cannot fathom it. The best act of our souls towards Christ’s love is admiration, astonishing admiration, till the heart is quite overwhelmed with it,—till our thoughts and understandings are, as it were, lost; the soul is taken out of itself, and laid in the dust as nothing, to be swallowed up in a holy contemplation of the unspeakable, inconceivable love of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon VI: The Excellency of Christ (1674) in William H. Goold (ed.), The Works of John Owen</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d7002a005e" data-kw="">
<blockquote><p>[W]e find the … the third [temptation of Christ], to the horridest apostasy from God, even to worshipping of the devil, and that baited with an offer of the world; first to commit idolatry to it, and then next, to himself for it. He is clearly beat off in all; it could not be otherwise. But truly this may seem strange, that Satan durst suggest such horrid, foul notions, to so holy, so singularly holy a man, for that at least he knew him to be, and had strong suspicions that he was more than a man, even the Son of God.

And this I think the sovereign satisfaction of a soul, in the matter of blasphemous injections, which many, even holy persons, are troubled with: much is said to it by many; but surely there is nothing like the view of this instance. That he uses thee so, what wonder? He had the hardiness even to use thy Lord so, who was so high above all stain of sin, as in all things, so in these.

True, indeed, we cannot well avoid all soil, but some guilt sticks to us; as from the throwing of a dirty ball against the wall, though it is presently beat back, yet it leaves a spot behind; our nature being so easily receptive of sinful defilement. But he was altogether undefilable in all assaults; yet this is our grand comfort, that he was tempted, and even that with such vile things. So then, if finding any such thing, cry to him for help, as one who can feel it, and entreat him to see how grating these thoughts are to thee, and to pity thee, and repel Satan; and he will do it, and will account those not thy sin at all, but his; and, if anything stick, will wash it off with his own blood.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on the First Nine Chapters of St. Matthew’s Gospel</cite>, in The Whole Works of the Most Reverend Father in God, Robert Leighton, D.D., Archbishop of Glasgow (2 vols, London: James Duncan, 1828), 2: 20-21.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-20727f9d68" data-kw="">
<blockquote><p>For although, as I said, I little approve it, yet I see that sometimes in these indifferent matters some things, although they be grievous and burdensome, are to be born so long as it is not permitted by law to deviate from them; lest, if we contend for them more bitterly than we ought, this may be a hindrance to the advancement of the Gospel, and those things which are in their nature indifferent may, by our vehement contention, be represented as ungodly. Now these things, unless I am deceived, bring with them two most heavy inconveniences. For, if we should first suffer the Gospel both to be spread abroad and to take deep root, men would perhaps be better and more easily persuaded to remove these outward appurtenances. While any one is sick, and is by little and little amending, he takes it very ill that certain slight and trifling things, as well in food as in drink, should be removed from him. But the same person, having recovered his health, rejects those things of his own accord as disagreeable and of little use. If England were first well and diligently instructed and confirmed in the most necessary heads of religion, she would not, in my opinion, at length take it in ill part that these things, however superfluous, should be removed. But at this time, since a change is being introduced in necessary points of religion, and that with so great difficulty, if we should also speak of those things as ungodly which are indifferent, the minds of almost all men would be so turned away from us, that they would no longer show themselves to be attentive and patient hearers of sound doctrine and necessary sermons… Do not however gather from hence that I think a minister of the Gospel should never strive to assert the truth of the Scriptures and of doctrines. This I do not affirm: [those] who daily come forward, both in public and private disputations, in the most weighty controversies for religion. But this I say, that these things which are of less moment ought not to be a hindrance through our contention… Further, if we proceed to oppose these indifferent things as destructive and ungodly, we condemn very many Churches that are not alien from the Gospel, and we too bitterly reprove innumerable Churches which are of old distinguished as most worthy of praise. I do not forget that the authority of Churches, whether present or past, ought not to be of such force, that by them the truth of God’s Word should be overborne: for that ought to remain unshaken and unmoved… But I contend that on account of things indifferent, this ought by no means to come to pass that churches should be condemned, or that we should speak unfavourably of them…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gorham, Gleanings of a few scattered ears during the period of the Reformation in England</cite>, (London, 1857), Letter 53, ‘Martyr to Bishop [John] Hooper’, Nov. 4, 1550, pp. 189-90, 92, 94-96</span></figcaption>

<blockquote><p>This thesis is an examination of the eucharistic doctrine of ten Scottish theological writers in the tradition of Scottish Episcopacy… The argument of this thesis is that all of the writers, rejecting the Tridentine, Lutheran, Bezan-Calvinist, and Zwinglian definitions of the Eucharist, maintained a material sacrifice in the Eucharist, which is an offering to God the Father of bread and wine as the propitiatory memorial of Christ’s death on the Cross, commanded by Christ Himself at the Last Supper. The sacrifice is propitiatory because it is the means of representing the one sacrifice of Christ on the cross to God the Father, thereby pleading the benefits of the cross for the communicants. The bread and wine do not change substance, but become effectively the body and blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wallace-d-kornahrens.html">Wallace D. Kornahrens</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eucharistic Doctrine in Scottish Episcopacy</cite>, 1620-1875 Download (2008) PhD thesis 300 pp. | Abstract:</span></figcaption>

<div class="actions"><button class="copy" data-copy="“This thesis is an examination of the eucharistic doctrine of ten Scottish theological writers in the tradition of Scottish Episcopacy… The argument of this thesis is that all of the writers, rejecting the Tridentine, Lutheran, Bezan-Calvinist, and Zwinglian definitions of the Eucharist, maintained a material sacrifice in the Eucharist, which is an offering to God the Father of bread and wine as the propitiatory memorial of Christ’s death on the Cross, commanded by Christ Himself at the Last Supper. The sacrifice is propitiatory because it is the means of representing the one sacrifice of Christ on the cross to God the Father, thereby pleading the benefits of the cross for the communicants. The bread and wine do not change substance, but become effectively the body and blood of Christ.”

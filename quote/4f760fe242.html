<blockquote><p>It was a saying of Martin Luther, Se propter unum Judaeum crucifixum omnibus favere Judaeis [Due to one crucified Jew, there is favor to all the Jews]. And if we love them and desire their conversion and salvation (as in Christian charity certainly we ought), then the way to effect that will not be to banish them and prohibit their habitation amongst us, so compelling them to live amongst Turks, Pagans or Papists; The images and idolatry of which last has undeniably been the greatest scandal, and Remora, which has long hindered them from being Christians. Whereas (if they be permitted to live amongst us) that stumbling-block will be taken away.

2. For the conditions of their admission, for the restrictions and limitations to be put upon them, a great deal of caution and Christian prudence is to be used, lest while we pretend their good we do mischief to ourselves. For as to deny them all liberty and commerce with us, may be an act of unchristian and indeed inhumane cruelty; So to give them too much is an act of imprudence and folly. And indeed we find some sober men (not without good reason) complain of the too much liberty they have in some Christian commonwealths. In short, what qualifications and limitations are to be put upon them, I shall not take upon me to determine, but leave that to the piety and prudence of the State. Yet (with submission) I conceive such limitations as these will be convenient, if not necessary; the rather because I find in our histories, in the imperial and canon laws, and in the old capitulars and canons of councils that such restrictions have been anciently laid upon them, as:

1. No toleration ever was, or de jure can be given them to profess or practice anything against the Law of Nature.

2. No toleration should be given them to speak anything blasphemously or impiously against Jesus Christ and the gospel: For though we may tolerate them in the profession of a bad, yet not in that blasphemy of a good, religion.

3. They never were nor should be permitted to circumcise children of Christians, or seduce any Christians to their religion: Let them profess, but not propagate their religion.

4. They were not permitted to carry any office or dignity in the Christian commonweal, though it seems that sometimes even that was permitted them.

5. They were not permitted in any suit or difference between a Jew and a Christian to draw the Christian or his Cause before a Jewish magistrate: For ’tis a ruled case in the Imperial Law, Judaeus Actor vel reus, Forum sequitur Christianum.

6. They were never permitted to make marriages with Christians, and the Glossator gives the reason of it in Law, Quia matrimonium debet esse communicatio divini &amp; humani juris. Whereas a Jew and Christian, being of different religions, cannot communicare in sacis. And this is consonant to the Law of the Gospel, which forbids us to be unequally yoked. Upon which grounds, I believe all marriages with Papists to be unlawful, that is, Fieri non debuit, ’tis unlawful to make such matches, though that factum valet, when such a match is made, the contract is valid.

7. Their frequent divorcing their wives was tolerated. For though Moses seem to suffer it, yet the emperors by express edict forbid it.

8. By the Imperial Laws polygamy and plurality of wives was not tolerated in them.

9. If any of the Jews turn Christian (by civil law) in case the Jews endeavored to reduce him, and maliciously injured him, they were to be burned for it.

10. They might repair their old synagogues, but were not tolerated (by the Roman Laws) to build new.

11. They were not tolerated to have any Christian servants, nurses, or midwives. Can. Praesenti. 1. Extra de Judaeis. Ex concilio malis conenti.

12. By the Canon Law they might not come abroad on Good Friday.

13. They were not permitted to wear Garments exactly of the Christian fashion, but were to have distinct habits [garments], that all might know them to be Jews.

14. They might not be physicians or give physick to any Christian.

15. They were not permitted to be of the Roman militia (though they were permitted to be advocates) by the rescript of Honorius and Arcadius to Romulianus P. P.

16. The Jews, being the greatest usurers in the world, and believing they may justly take the highest use they can get (even Usurae centessimae, if they could have it) of us gentiles, it is all the reason in the world they should be limited in this particular and not permitted to take more of us than the law permits us to take one of another.

17. They should be enjoined to admit of friendly collations and disputations sometimes about gospel truths, and not obstinately to reject all means of conversion and conviction, and satisfaction of those seeming reasons which keep them off from embracing the truth: For there will be little hopes (or possibility) of their conversion, if they be permitted obstinately to refuse all means of doing it. But enough (if not too much) of this, I shall only add one old law concerning the Jews made before the Conquest (above 600 years ago) and confirmed by the conquerors amongst other the good laws of Edward the Confessor, and so continued law (for ought I know) in all the kings’ reigns till the banishment of the Jews, which was anno 18 Edwardi 1. The Law is this: Sciendum quoque quod omnes Judaei, ubicunque in Regno sunt, sub tutela et defensione Regis ligea debent esse; nec quilibet eorum alicui Diviti se potest subdere, sine Regis licentia. Judaei enim, et omnia sua Regis sunt, Quod si quisquis detinuerit eos, vel Pecuniam eorum, perquirat Rex si vult, tanquam suum proprium. [It should also be known that all Jews, wherever they are in the kingdom, ought to be under the protection and defense of the king’s liege authority; nor may any one of them submit himself to any rich man without the king’s permission. For the Jews, and everything belonging to them, are the king’s. And if anyone detains them, or their money, the king may recover it if he wishes, as his own property.] I wish the chief magistrate could admit them on these terms, for so they, and all theirs (omnia sua) should be suum proprium, which possibly might supply him with money and so save taxes. And upon these terms I (and I believe everybody else) will willingly consent to their readmission.</p></blockquote>

<blockquote><p>Second, it is asked whether their rites are as it were idolatry. That it seems so:

1. From the fact that it is said in Gal. 5:1, on the words, “Do not again be entangled with the yoke of bondage,” the Gloss says: “This bondage is not lighter than that of idolatry,” because the servitude of the legal observances is likened to idolatry in burden.

2. And again, it is said on the words in Gal. 4:9: “To whom do you wish to serve again?” the Gloss says: “The observance of the Law.” From this it is had that the servitude of the Law, to which they were then devoted, was a sin nearly equal to the servitude of idols, to which before their conversion they had been given over, and is as it were idolatry. And this is explained there by what follows: “The Law after Christ does not differ greatly from ancient idolatry”; it is manifestly shown that the servitude of the Law is now as it were idolatry. On the contrary. a. The Law prescribed believing in God and rendering to Him alone latria [worship]; but idolatry requires the contrary: for it rendered latria to the idols themselves; therefore the servitude of the Law is in no way equal to idolatry in sin. [Solution]: 1-2. To this it must be said that it is not an equal sin for the Jews themselves to observe the rite of the legal observances and to commit idolatry; but it is said to be a sin for those themselves who have assumed the Christian Faith, nearly equal because in both cases there is apostasy, though not equal. As to burden also it had likeness: for in both cases the burden was greatest, and therefore the sacrifices of the Jews were rejected just as those of the gentiles were. But it is said not to differ from idolatry because in both cases there was unbelief. For the Galatians, when they were gentiles, served the superstition of idolatry; but when they drew back from the catholic Faith, which forbade it, they again fell into the servitude of the legal observances, as it were into unbelief. Furthermore, by reason of the performed act, namely sacrifices, there was agreement with idolatry; also by reason of the propensity to sacrifice and of the superstition itself in sacrifices. Yet for the Jews it is not so great a sin now to adhere to the Law as was the sin of those who adhered to idols.</p></blockquote>

2. And again, it is said on the words in Gal. 4:9: “To whom do you wish to serve again?” the Gloss says: “The observance of the Law.” From this it is had that the servitude of the Law, to which they were then devoted, was a sin nearly equal to the servitude of idols, to which before their conversion they had been given over, and is as it were idolatry. And this is explained there by what follows: “The Law after Christ does not differ greatly from ancient idolatry”; it is manifestly shown that the servitude of the Law is now as it were idolatry. On the contrary. a. The Law prescribed believing in God and rendering to Him alone latria [worship]; but idolatry requires the contrary: for it rendered latria to the idols themselves; therefore the servitude of the Law is in no way equal to idolatry in sin. [Solution]: 1-2. To this it must be said that it is not an equal sin for the Jews themselves to observe the rite of the legal observances and to commit idolatry; but it is said to be a sin for those themselves who have assumed the Christian Faith, nearly equal because in both cases there is apostasy, though not equal. As to burden also it had likeness: for in both cases the burden was greatest, and therefore the sacrifices of the Jews were rejected just as those of the gentiles were. But it is said not to differ from idolatry because in both cases there was unbelief. For the Galatians, when they were gentiles, served the superstition of idolatry; but when they drew back from the catholic Faith, which forbade it, they again fell into the servitude of the legal observances, as it were into unbelief. Furthermore, by reason of the performed act, namely sacrifices, there was agreement with idolatry; also by reason of the propensity to sacrifice and of the superstition itself in sacrifices. Yet for the Jews it is not so great a sin now to adhere to the Law as was the sin of those who adhered to idols.”

— Alexander of Hales, Sum of Universal Theology, (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 1 | ch. 2, ‘Whether the Rite of the Jews is as it were Idolatry’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecond%2C+it+is+asked+whether+their+rites+are+as+it+were+idolatry.+That+it+seems+so%3A+1.+From+the+fact+that+it+is+said+in+Gal.+5%3A1%2C+on+the+words%2C+%E2%80%9CDo+not+again+be+entangled+with+the+yoke+of+bondage%2C%E2%80%9D+the+Gloss+says%3A+%E2%80%9CThis+bondage+is+not+lighter+than+that+of+idolatry%2C%E2%80%9D+because+the+servitude+of+the+legal+observances+is+likened+to+idolatry+in+burden.+2.+And+again%2C+it+is+said+on+the+words+in+Gal.+4%3A9%3A+%E2%80%9CTo+whom+do+you+wish+to+serve+again%3F%E2%80%9D+the+Gloss+says%3A+%E2%80%9CThe+observance+of+the+Law.%E2%80%9D+From+this+it+is+had+that+the+servitude+of+the+Law%2C+to+which+they+were+then+devoted%2C+was+a+sin+nearly+equal+to+the+servitude+of+idols%2C+to+which+before+their+conversion+they+had+been+given+over%2C+and+is+as+it+were+idolatry.+And+this+is+explained+there+by+what+follows%3A+%E2%80%9CThe+Law+after+Christ+does+not+differ+greatly+from+ancient+idolatry%E2%80%9D%3B+it+is+manifestly+shown+that+the+servitude+of+the+Law+is+now+as+it+were+idolatry.+On+the+contrary.+a.+The+Law+prescribed+believing+in+God+and+rendering+to+Him+alone+latria+%5Bworship%5D%3B+but+idolatry+requires+the+contrary%3A+for+it+rendered+latria+to+the+idols+themselves%3B+therefore+the+servitude+of+the+Law+is+in+no+way+equal+to+idolatry+in+sin.+%5BSolution%5D%3A+1-2.+To+this+it+must+be+said+that+it+is+not+an+equal+sin+for+the+Jews+themselves+to+observe+the+rite+of+the+legal+observances+and+to+commit+idolatry%3B+but+it+is+said+to+be+a+sin+for+those+themselves+who+have+assumed+the+Christian+Faith%2C+nearly+equal+because+in+both+cases+there+is+apostasy%2C+though+not+equal.+As+to+burden+also+it+had+likeness%3A+for+in+both+cases+the+burden+was+greatest%2C+and+therefore+the+sacrifices+of+the+Jews+were+rejected+just+as+those+of+the+gentiles+were.+But+it+is+said+not+to+differ+from+idolatry+because+in+both+cases+there+was+unbelief.+For+the+Galatians%2C+when+they+were+gentiles%2C+served+the+superstition+of+idolatry%3B+but+when+they+drew+back+from+the+catholic+Faith%2C+which+forbade+it%2C+they+again+fell+into+the+servitude+of+the+legal+observances%2C+as+it+were+into+unbelief.+Furthermore%2C+by+reason+of+the+performed+act%2C+namely+sacrifices%2C+there+was+agreement+with+idolatry%3B+also+by+reason+of+the+propensity+to+sacrifice+and+of+the+superstition+itself+in+sacrifices.+Yet+for+the+Jews+it+is+not+so+great+a+sin+now+to+adhere+to+the+Law+as+was+the+sin+of+those+who+adhered+to+idols.%E2%80%9D%0A%0A%E2%80%94+Alexander+of+Hales%2C+Sum+of+Universal+Theology%2C+%28Paris%2C+1230-1245%29%2C+pt.+2+of+2%2C+inq.+3%2C+tract+8%2C+sect.+1%2C+quest.+1%2C+title+2+%7C+member+1+%7C+ch.+2%2C+%E2%80%98Whether+the+Rite+of+the+Jews+is+as+it+were+Idolatry%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2781d2a578.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2781d2a578.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=Second%2C%20it%20is%20asked%20whether%20their,of%20those%20who%20adhered%20to%20idols&amp;text=Second%2C%20it%20is%20asked%20whether%20their%20rites%20are&amp;text=the%20sin%20of%20those%20who%20adhered%20to%20idols" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>

<div class="actions"><button class="copy" data-copy="“§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. That is to say, those guilty of Judaism alone [should not be harassed or oppressed]. But those guilty of other crimes should be punished equally with others. Nevertheless, they should not be treated more harshly for that reason, because they are Jews. We do not wish innocent people to be constrained merely because they are Jews or Saracens. Among the ancient Sicilian laws, Emperor Frederick established this in Constitutions of Sicily, bk. 1, title 17 &amp; 26: ‘We cannot allow Jews and Saracens, whom the diversity of the Christian sect makes hostile, and who are deprived of every other assistance, to be defrauded of the power of our protection.’ Christian converts from Judaism have noted that this perverse practice of treating Jews more harshly is a great hindrance to the conversion of more people. For it is entirely foreign to the nature of faith to employ violence in order to produce belief. Petrus Alphonsus the Spaniard, in The Dialogue of Moses &amp; Peter: ‘To imprison and kill, until someone either believes or pays a tax, is not among the works of God; nor did any of the prophets command anyone to be compelled to believe.’ Likewise, Stephanus Isaacus (to whom, together with his father Johannes Isaacus, Cardinal and Papal Legate Franciscus de Mendoza had granted authority to investigate all the Jews throughout the three ecclesiastical electorates, and to rage against them with fire and sword) rightly said that this counsel was unjust and most wicked, and that more is accomplished through moderation and kindness than through cruelty or savagery, in his German Apology, p. 42. The same was noted by [Johannes] Pfefferkorn [d. 1523] and others. Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].”

— Johannes Hoornbeeck, T’shuvah Yehudah, or For the Convincing &amp; Converting of the Jews (Leiden, 1655), pp. 24-25 tr. AI Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%C2%A717.+Now+to+the+Political+Means.+I.+Nothing+is+accomplished%2C+indeed%2C+things+are+done+badly%2C+by+persecuting%2C+harassing+or+oppressing+the+Jews%2C+driving+them+away%2C+or+killing+them.+That+is+to+say%2C+those+guilty+of+Judaism+alone+%5Bshould+not+be+harassed+or+oppressed%5D.+But+those+guilty+of+other+crimes+should+be+punished+equally+with+others.+Nevertheless%2C+they+should+not+be+treated+more+harshly+for+that+reason%2C+because+they+are+Jews.+We+do+not+wish+innocent+people+to+be+constrained+merely+because+they+are+Jews+or+Saracens.+Among+the+ancient+Sicilian+laws%2C+Emperor+Frederick+established+this+in+Constitutions+of+Sicily%2C+bk.+1%2C+title+17+%26+26%3A+%E2%80%98We+cannot+allow+Jews+and+Saracens%2C+whom+the+diversity+of+the+Christian+sect+makes+hostile%2C+and+who+are+deprived+of+every+other+assistance%2C+to+be+defrauded+of+the+power+of+our+protection.%E2%80%99+Christian+converts+from+Judaism+have+noted+that+this+perverse+practice+of+treating+Jews+more+harshly+is+a+great+hindrance+to+the+conversion+of+more+people.+For+it+is+entirely+foreign+to+the+nature+of+faith+to+employ+violence+in+order+to+produce+belief.+Petrus+Alphonsus+the+Spaniard%2C+in+The+Dialogue+of+Moses+%26+Peter%3A+%E2%80%98To+imprison+and+kill%2C+until+someone+either+believes+or+pays+a+tax%2C+is+not+among+the+works+of+God%3B+nor+did+any+of+the+prophets+command+anyone+to+be+compelled+to+believe.%E2%80%99+Likewise%2C+Stephanus+Isaacus+%28to+whom%2C+together+with+his+father+Johannes+Isaacus%2C+Cardinal+and+Papal+Legate+Franciscus+de+Mendoza+had+granted+authority+to+investigate+all+the+Jews+throughout+the+three+ecclesiastical+electorates%2C+and+to+rage+against+them+with+fire+and+sword%29+rightly+said+that+this+counsel+was+unjust+and+most+wicked%2C+and+that+more+is+accomplished+through+moderation+and+kindness+than+through+cruelty+or+savagery%2C+in+his+German+Apology%2C+p.+42.+The+same+was+noted+by+%5BJohannes%5D+Pfefferkorn+%5Bd.+1523%5D+and+others.+Therefore%2C+the+better+and+more+common+opinion%2C+both+among+theologians+and+among+jurists%2C+is+that+the+Jews+should+be+tolerated%E2%80%94not+indeed+enticed%2C+but%2C+where+they+are+found%2C+not+treated+more+harshly.+Thus%3A+%E2%80%A2+Baldus%2C+vol.+1%2C+Consil%2C+315-16+%E2%80%A2+Rolandus+a+Valle%2C+vol.+3%2C+Consil%2C+25+%E2%80%A2+Alexander+of+Hales%2C+Summa%2C+pt.+2%2C+Questions+179-80+%E2%80%A2+Vincent+of+Beauvais%2C+Spec.+Doctr.%2C+bk.+10%2C+ch.+38%2C+etc.+%E2%80%A2+Johannes+Gerhard%2C+Common+Places%2C+On+the+Magistrate%2C+p.+631+%E2%80%A2+Hottinger%2C+Thesaurus+Philologicus%2C+bk.+1%2C+ch.+1%2C+section+2%2C+question+1+And+the+one+who+treated+this+matter+learnedly+and+extensively+in+a+separate+book%2C+Georgius+Theodorus%2C+Counselor+of+Hesse%2C+De+jure+et+statu+Iud%C3%A6orum+in+Republica+Christianorum+%5BOn+the+Law+and+Status+of+the+Jews+in+the+Republics+of+Christians%5D.%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+T%E2%80%99shuvah+Yehudah%2C+or+For+the+Convincing+%26+Converting+of+the+Jews+%28Leiden%2C+1655%29%2C+pp.+24-25+tr.+AI+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F160288216c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/160288216c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=17.%20Now%20to%20the%20Political%20Means,Jews%20in%20the%20Republics%20of%20Christians&amp;text=17.%20Now%20to%20the%20Political%20Means.%20I.%20Nothing&amp;text=of%20the%20Jews%20in%20the%20Republics%20of%20Christians" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

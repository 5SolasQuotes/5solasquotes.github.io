<blockquote><p>The French national synods of Gap (1603) and La Rochelle (1607) were prime examples of this. Philippe du Plessis-Mornay (1549-1623), the advisor to Henry of Navarre, used fundamental articles in his Traite de I’Eglise (1578) as a basis for suggesting an accord with the Church of England. James I responded to the French Reformed initiative by sending a letter to the Synod of Toniens (1614) expressing his own desire for union. The Synod went on to adopt a series of procedures designed to set up an international synod which would formulate procedures for establishing a common Reformed-Anglican-Lutheran statement of faith based on the fundamental articles… Mornay also used fundamental articles in his description of the true church. Philippe du Plessis-Mornay, Traite de l’Eglise, 2d ed. (La Rochelle, 1599), pp. 75-77; 172-75.” – Martin Klauber, “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 338 fn. 16 Beza, Theodore – Traicté des vrayes essencielles et visibles marques de la vraye Eglise catholique (1592) 108 pp. Martin Klauber: “Beza placed his discussion of fundamental articles within the framework of his treatise on the true marks of the Church. In his Traicte des vrayes essencielles et visibles marques de la vraye Eglise Catholique (1592), Beza defined the fundamental articles as being summarized in the Ten Commandments, the Apostles Creed, and the Lord’s Prayer. He argued further that such fundamental articles such as the Trinity and the two natures of Christ are essential marks of the true Church.” “Drive toward Protestant Union,” Church History, 61.3 (1992), p. 336, fn. 7 Junius, Francis – Le paisible chrestien ou de la paix de l’Eglise catholique… sur les Pseaumes 122 et 133 (Leiden: 1593) 392 pp. no ToC . 1600’s Jurieu, Pierre The Authentic System of the Church &amp; a True Analysis of the Faith… (Dort, 1686) ToC Jurieu (1637-1713) was a French reformed minister and prolific author. Wikipedia: “The most famous of the controversies on this subject was that between [the Romanist, Jacques-Bénigne] Bossuet [1627-1704] and the Calvinist Jurieu. Jurieu’s book… ‘Le Vray Systeme’ was an attempt to demonstrate the right of the French Protestants to rank as members of the Church Universal… According to him all sects without exception are members of Body of Christ. For this nothing is necessary but “to belong to a general confederation, to confess Jesus Christ as Son of God, as Saviour of the world, and as Messias; and to receive the Old and New Testaments as the rule and Law of Christians”, (Système, p. 53). Yet among the various portions of the Church we must, he tells us, distinguish four classes: 1. Sects that have retained all the truths taught in the Scriptures; 2. Sects that, while retaining the more important truths, have mingled with them superstitions and errors; 3. Sects that have retained the fundamental truths, but have added doctrines incompatible with them; 4. Sects that have set the fundamental verities aside altogether. This last class are dead members of the mystical body (ibid., p. 52). Those who have retained the fundamental articles of the faith are, one and all, living parts of the Church. When he comes to define precisely which doctrines are, and which are not, fundamental, Jurieu bids us fall back on the rule of Vincent of Lérins [d. c. 445]: Quod semper, quod ubique, quod ab omnibus [that which is always, everywhere and from all]. Wherever all bodies of Christians still exist and possess some importance in the world, and agree in accepting a dogma, we have, in that agreement, a criterion that may be considered infallible. Among truths so guaranteed are the doctrine of the Trinity, the Divinity of Jesus Christ, the Redemption, the satisfaction, original sin, creation, grace, the immortality of the soul, the eternity of punishment (ibid, 236-237). This work was followed, in 1688, by another entitled “Traité de l’unité de l’Eglise et des articles fondamentaux”, written in reply to Nicole’s criticisms. In the same year appeared Bossuet’s “Histoire des Variations des Eglises protestantes”… In regard to the relation of the fundamental doctrines to salvation, Jurieu is in agreement with the English divines already quoted. “By fundamental points”, he says, “we understand certain general principles of the Christian religion, a distinct faith and belief in which are necessary to salvation” (Traité, p. 495).</p></blockquote>

<blockquote><p>During his formative years, while studying at Herborn and Heidelberg, Comenius came under the influence of teachers who strengthened his ecumenical predisposition. This is particularly true of the period of study at Heidelberg, where he became acquainted with David Pareus, whose house, ‘Pareanum’, served as the center for those who worked for Protestant union. Two years after his return to his native land, Comenius was ordained priest of the Unity, and became pastor at Fulnek in Moravia. But with the outbreak of the Thirty Years War, Fulnek fell a prey to the fury of the Imperial armies. Comenius was compelled to take refuge on the Bohemian estates of one of the most important members of the Unity, Count Charles of Zerotin… There he wrote his celebrated Labyrinth of the World, a book in which the ecumenical theme found expression in condemnation of the fanaticism and bigotry of the confessional groups…” – Martin Schmidt in A History of the Ecumnical Movement, vol. 1, p. 89 Various – Good Counsels for the Peace of Reformed Churches by some reverend &amp; learned Bishops &amp; other Divines (Oxford: 1641) 150 pp. ToC King James I, To Cardinal Perron Richard Hooker, Answer to Travers Edwin Sandys, View of the State of Religion in the Western World John Davenent, Opinion of Thomas Morton, On the Peace of the Church Joseph Hall Opinion of To John Dury James Ussher Opinion of Sermon before King James Some French Reformed Divines, Opinion of Dury, John A Summary Discourse Concerning the Work of Peace-Ecclesiastical, how it may Concur with the Aim of a Civil Confederation Amongst Protestants (Cambrdige, 1641) 50 pp. A Motion Tending to the Public Good of this Age &amp; of Posterity, or, The Copies of Certain Letters Written by Mr. John Dury to a Worthy Knight at his Earnest Desire, Showing Briefly what a Public Good is &amp; how by the best Means of Reformation in learning &amp; religion it may be Advanced to Some Perfection (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>

ssure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.”

<blockquote><p>But there is one thing which is even worse than controversy, and that is false doctrine tolerated, allowed, and permitted without protest or molestation. It was controversy that won the battle of Protestant Reformation. If the views that some men hold were correct, it is plain we never ought to have had any Reformation at all! For the sake of peace we ought to have gone on worshiping the Virgin and bowing down to images and relics to this very day! Away with such trifling!</p></blockquote>

<blockquote><p>2. It is not a bare union of men that makes a Church a true Church, but that union must have truth for its foundation; else you know thieves and robbers and highway-men and pirates, and buccaneers, because they agree among themselves, might lay claim to this title, and the most perverse heretics, because they agree in certain points, might say they are the true Church… … And indeed, that which justifies the Protestant Churches’ separation from her [Rome], or breaking peace and communion with her is: 1. Because she would impose that upon the consciences of men which Christ and his apostles never imposed. 2. Because she has turned the spiritual worship of the Gospel into carnal and mechanical devotion and introduced innumerable superstitions… … 5. Because rejecting the supreme authority of the Scriptures, which are the sole rule of Faith, she has made her pretended head, and such councils as he shall call or approve of, the sole dictators and expositors of the doctrine of Christ, requiring blind obedience to their decisions… The divisions among Protestant Churches are to be deplored so much the more because the points they differ in are inconsiderable and might easily be composed if men had but peaceable tempers and were resolved to lay aside interest and carnal respects, and punctilios of honor and credit, etc. for they all agree in fundamentals, all are satisfied that the Church of Rome has notoriously deviated from the simplicity of the Gospel; and the matters in difference, are things in which salvation is not concerned. And upon that account their labours deserve great commendations, who heretofore and very lately have endeavored to reconcile the Protestant Churches into a perfect union: A blessed work. Blessed are the peacemakers, that endeavor to make peace among the jarring members of Christ’s Body; and though they may fail of success, yet they shall not lose their reward. In the meanwhile those who widen or heighten these differences, and incite the respective parties to hatred, and wrath, and animosities one against another, to be sure are no children of the God of peace, and had need at least before they die make public satisfaction for the dreadful effects their heats and passions do produce. But as this peace among Protestant Churches is very much to be wished and prayed for…</p></blockquote>

<blockquote><p>2. I do not speak against men’s seeking a reconciliation with Rome on just and honest terms. I think it one of the happiest works in the world, could it be accomplished: And I think the French are the only people to be first dealt with to that end. And I long to see providence so turn things about as that there might be a council first of these two nations for the attempting of such a work. And I am past doubt that it would be the happiest way to pull down Antichrist (if the Pope be he) that has been yet of late undertaken. But if ever such a thing be accomplished, it must be by uniting in one creed, as containing all things sufficient to salvation, which must be wholly taken out of Scripture and not such as the Trent Confession is: Upon which agreement they may openly acknowledge each other for brethren and true Churches, without compelling each other to uniformity in the lesser matters, but bearing with each others’ differences. I wish England such rulers as will faithfully prosecute such a pacific enterprise, without sinful compliance and betraying of the truth. Though I confess when I consider their principles and practices, I am afraid bishop Hall is in the right, that There’s no peace with Rome. Yet no fears must hinder men from any just and necessary enterprise.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. I do not speak against men’s seeking a reconciliation with Rome on just and honest terms. I think it one of the happiest works in the world, could it be accomplished: And I think the French are the only people to be first dealt with to that end. And I long to see providence so turn things about as that there might be a council first of these two nations for the attempting of such a work. And I am past doubt that it would be the happiest way to pull down Antichrist (if the Pope be he) that has been yet of late undertaken. But if ever such a thing be accomplished, it must be by uniting in one creed, as containing all things sufficient to salvation, which must be wholly taken out of Scripture and not such as the Trent Confession is: Upon which agreement they may openly acknowledge each other for brethren and true Churches, without compelling each other to uniformity in the lesser matters, but bearing with each others’ differences. I wish England such rulers as will faithfully prosecute such a pacific enterprise, without sinful compliance and betraying of the truth. Though I confess when I consider their principles and practices, I am afraid bishop Hall is in the right, that There’s no peace with Rome. Yet no fears must hinder men from any just and necessary enterprise.”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) | ‘Objections Answered’, pp. 94-95">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+I+do+not+speak+against+men%E2%80%99s+seeking+a+reconciliation+with+Rome+on+just+and+honest+terms.+I+think+it+one+of+the+happiest+works+in+the+world%2C+could+it+be+accomplished%3A+And+I+think+the+French+are+the+only+people+to+be+first+dealt+with+to+that+end.+And+I+long+to+see+providence+so+turn+things+about+as+that+there+might+be+a+council+first+of+these+two+nations+for+the+attempting+of+such+a+work.+And+I+am+past+doubt+that+it+would+be+the+happiest+way+to+pull+down+Antichrist+%28if+the+Pope+be+he%29+that+has+been+yet+of+late+undertaken.+But+if+ever+such+a+thing+be+accomplished%2C+it+must+be+by+uniting+in+one+creed%2C+as+containing+all+things+sufficient+to+salvation%2C+which+must+be+wholly+taken+out+of+Scripture+and+not+such+as+the+Trent+Confession+is%3A+Upon+which+agreement+they+may+openly+acknowledge+each+other+for+brethren+and+true+Churches%2C+without+compelling+each+other+to+uniformity+in+the+lesser+matters%2C+but+bearing+with+each+others%E2%80%99+differences.+I+wish+England+such+rulers+as+will+faithfully+prosecute+such+a+pacific+enterprise%2C+without+sinful+compliance+and+betraying+of+the+truth.+Though+I+confess+when+I+consider+their+principles+and+practices%2C+I+am+afraid+bishop+Hall+is+in+the+right%2C+that+There%E2%80%99s+no+peace+with+Rome.+Yet+no+fears+must+hinder+men+from+any+just+and+necessary+enterprise.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29+%7C+%E2%80%98Objections+Answered%E2%80%99%2C+pp.+94-95&amp;url=htt

<main class="wrap"><figure class="quote" id="q-b7f4593e65" data-kw="">
<blockquote><p>James Nisbet agonized over this difficult choice… should he join the clearly imperfect Church of Scotland? Based on the following account form his memoir, it is likely that he parted from the Society shortly after the Revolution Settlement because of the dangerous errors and behaviors of its members: ‘Their criticizing upon and censuring of all others who are not exactly of their judgment in every punctilio, grievously aggravating their faults and often fixing some where there is none; yea, seldom sparing one another even where they are one in judgment, [they made] the terms of their communion straighter than what God allows in his Word. They will allow no masters of families to be of their communion who pay any taxes to the present government, making no difference betwixt this legal and the former illegal and tyrannical government. They will allow no children or servants to be in their communion who obey their parents and masters in doing any service to those in public trust in the government. They will allow none to hear any of the present ministry, even though transiently, to be in their communion. They spend the most part of their precious time in arguing and praying against the sins and defections of the public, neglecting to watch the heart; and here, to my shame, I was greatly guilty of this, among others. We spent much of our precious time in framing arguments to debate with others, greatly neglecting to be distinctly acquainted with the principles of the Christian religion and to be savingly acquainted with the inward and serious part of real godliness. They would publish a declaration disowning the authority of the great King William [of the Glorious Revolution, 1689 ff.] and against the validity of the present church communion. When I earnestly besought, with much entreaty, that every article of that declaration might be reasoned, they would not allow it… Thus my protesting, and refusing to join with them, enraged them exceedingly against me. As their scourge of tongues was grievously bent against others, so now was it against myself in a most grievous, unjust, and unreasonable manner… Thus, I left that party of the dissenters who now commonly go under the name of Mr. McMillan’s people…’ (Nisbet, Private Life, pp. 235-238)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage (2000) Moore is very sympathetic with the Cameronians.</cite>, p. 159</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

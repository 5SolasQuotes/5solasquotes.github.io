<blockquote><p>5. The change, of course, has no degrees and is completed at one moment and in only one act. Yet, in manifestation, consciousness and effects, it has many degrees; therein lie justification and adoption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, (Baker, 1997), ch. 27, ‘Justification’, p. 161</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f093ce78a" data-kw="">
<blockquote><p>…this is not to be conceived in the way of some transient actions that pass away and leave not so much as a relative change. No, for when God does justify us at first, we are upon our believing put into a state and a fixed condition of peace with God. Thus the Scripture speaks of it as a state, like that of sanctification and glorification; so that while we are sleeping we are justified, because put into that estate, although we do not then actually believe. The first act therefore of faith receiving Christ, in whom we are justified, is like the putting of one into a state of marriage, or of magistracy: Though the first act pass away, yet the relative change it has made continues always; We are not justified by the habit of faith, but by the act, and yet after the first act we stand justified, though we are not all the day long actually believing. Its true, many learned divines say justification is a continued action, and it may be granted in this sense, that God does daily justify believers, even as He constantly preserves them in their natural being; but it is not true in this sense, as if we were put into a new state of justification every day. This is not only to make a first and a second justification, but a thousand justifications; remission of sins and imputation of Christ’s righteousness are reiterated; but justification besides these does connote a fixed estate of the justified person, which is but once, and the Mediator of the Covenant of grace does so firmly uphold this privilege, that there shall never be any total intercission of it, neither do ever any plenarily apostatize from this wonderful favor, that once received it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London: Underhill, 1654), pt. 2, | sermon 13, n.p.</span></figcaption>

<blockquote><p>XXII… (7) Protestants in common, in agreement with Augustine, think that good works do not precede the one to be justified, but follow the one who is justified, yet with the differences of stages observed, such that for the first constitution of justification, besides faith, not even the presence of good works is necessary, just as for the first constitution of fleshly marriage nothing is required but a consent of the spouses, because God justifies the ungodly (Rom. 4:5); then for its continuation their coexistence is required, just as for the continuation of marriage a coexistence of marriage duties is required, because faith working through love is required (Gal. 5:6); and finally for the consummation (insofar as the possession of eternal life is pronounced), the preexistence of good works is also required for the possession of eternal life (Mt. 25:35).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 128</span></figcaption>

</figure><figure class="quote" id="q-faea7a1ed4" data-kw="">
<blockquote><p>Seeing we have affirmed that we attain a twofold righteousness by faith: [1] a righteousness inherent in us, as charity and that grace whereby we are made partakers of the divine nature, and [2] the justice of Christ given and imputed unto us, as being grafted into Christ and having put on Christ: it remains that we enquire upon which of these we must stay and rely, and by which we must think ourselves justified before God, that is, to be accepted as holy and just, having that justice which it beseems the sons of God to have. I truly think, that a man very piously and Christianly may say that we ought to stay, to stay I say, as upon a firm and stable thing, able undoubtedly to sustain us, upon the justice of Christ given and imputed to us, and not upon the holiness and grace that is inherent in us. For this our righteousness is but imperfect, and such as cannot defend us, seeing in many things we offend all, etc. But the justice of Christ which is given unto us, is true and perfect justice, which altogether pleases the eyes of God, and in which there is nothing that offends God. Upon this therefore as most certain and stable, we must stay ourselves, and believe that we are justified by it, as the cause of our acceptation with God: this is that precious treasure of Christians which whosoever finds, sells all that he has to buy it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gasparo-contarini.html">Gasparo Contarini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as given in Richard Field, Of the Church</cite>, (Oxford, 1628), bk. 3, appendix, pp. 292-93</span></figcaption>

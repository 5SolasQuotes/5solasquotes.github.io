<blockquote><p>And as touching things of prudence, they are things properly mixed [partly moral and partly positive], as at what hour sermon shall begin in such a church, at eight, or nine or ten of the clock; how the worship shall be ordered, whether you should begin the worship with a word of prayer, or a word of praising, or a word of exhorting to stir up for the duty of the day, is a matter of prudence; and because God has not laid the band of a precept on us, to begin with either of the three; therefore it would seem, that though the things themselves be moral, and must be warranted by a Word of God; yet the order is not moral, but prudential, and so cannot fall under a command of the Church; for to me it is hard that men and the Church should lay on a tie or bond of a precept where God has laid on no such bond; The Church, in these mixed things, where the morality is not clear, at farthest can but go on to directive advices, as Paul does, 1 Cor. 7:6,12. Not to imposing of laws, nor to injunctions or commandments under the pain of Church-censures; for Christ must bind and ratify in Heaven all Church-censures on earth, and so the Church cannot command nor censure but as Christ Himself would command or censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Intro, p. 6</span></figcaption>

<blockquote><p>But we have yet more to do, for the consequence of our argument is also denied both by the prelatical faction and by others [congregationalists] (whom we are more sorry to contradict) holding that reasons fetched from the Jewish Church do better fat the prelates than the consistorians; howsoever now to fetch the form of government for the Church from the Church of the Jews, were, say they, to revive the Old Testament. To me it seems strange that both the one side and the other do when they please reason from the forms of the Jewish Church and yet they will not permit us to reason in like manner. The former go about to prove the prelacy by the high priesthood and the lawful use of organs in the Church from the like in the temple of Solomon. The latter do argue that a congregation has right not only to elect ministers, but to ordain them and lay hands on them because the people of Israel laid hands on the Levites. That the maintenance of the ministers of the Gospel ought to be voluntary, because under the Law God would not have the priests and Levites to have any part or inheritance in the land of Canaan, but to be sustained by the offerings and altars of the Lord. That the power of excommunication is in the body of the Church, because the Lord laid upon all Israel the duty of removing the unclean and of putting away leaven out of their houses at the feast of Passover. Is it right dealing now to forbid us to reason from the form of the Jews? I will not use any further expostulation, but let the reader judge. The truth is this, even as that which is in a child, as he is a child, agrees not to a man, yet that which is in a child, as he is animal rationale, agrees also to a man: so what we find in the Jewish Church, as it was Jewish or in infancy and under the pedagogy of the Law, agrees not indeed to the Christian Church. But whatsoever the Jewish Church had as it was a political Church, or ecclesiastical republic (of which sort of things, the diversity and subordination of ecclesiastical courts was one) does belong by the same reason to the Christian Church. I say further, though the commonwealth and civil policy of the Jews be not in all points a pattern to our civil policy, yet I am sure it is no error to imitate the civil policy of the Jews in such things as they had, not for any special reason proper to them, but are common to all well constituted commonwealths, and so we may argue from their commonwealth that it is a good policy to have diverse civil courts and the higher to receive appellations from the inferior, as it was among them. Shall we not by the very like reason fetch from their ecclesiastical republic, diversity of spiritual courts, and the supreme to receive appellations from the inferior, because so was the constitution of the Jewish Church and that under the common respect and account of a political Church, and not for any special reason which does not concern us.</p></blockquote>

<blockquote><p>The third consideration is that there is some footsteps of this identity of bishop and presbyter in the most corrupt writtings of the most impure schoolmen: which may appear in these three: 1. In that, generally, episcopacy is holden to be no distinct order from presbytery; and that presbytery, or priesthood (as they speak) is the highest order in all their hierarchy. And this is current as the doctrine of Lombardus the Master of Sentences, Hugo, Aquinas, Thomas Waldensis, and generally of all the Thomists at least. And though they seem to make bishops to be of a more eminent degree, yet by Estius and some others alleged by him, this is not thought sufficient to distinguish one office from another.</p></blockquote>

<blockquote><p>XX. Although the authority of these constitutions is great in the church, we deny that it is absolute, but limited; or that it is equal with the divine laws; or that it is as great a sin to transgress the former as the latter. We deny that they can change the nature of things, so that what are in themselves indifferent can be made necessary and of perpetual right; or that any part of Christian righteousness is in them, much less any merit with God; or that they can extend themselves beyond ecclesiastical polity or good order (eutaxian), which by themselves are not of piety, but only on account of another thing and by accident. Again, we say that they are not to be measured by themselves, but by divine laws, that they may not in anyway obstruct, but may rather subserve the latter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, pp. 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3</span></figcaption>

<div class="actions"><button class="copy" data-copy="“XX. Although the authority of these constitutions is great in the church, we deny that it is absolute, but limited; or that it is equal with the divine laws; or that it is as great a sin to transgress the former as the latter. We deny that they can change the nature of things, so that what are in themselves indifferent can be made necessary and of perpetual right; or that any part of Christian righteousness is in them, much less any merit with God; or that they can extend themselves beyond ecclesiastical polity or good order (eutaxian), which by themselves are not of piety, but only on account of another thing and by accident. Again, we say that they are not to be measured by themselves, but by divine laws, that they may not in anyway obstruct, but may rather subserve the latter.”

— Francis Turretin, pp. 290-1 of Question 31, ‘Does a legislative power properly so called, of enacting laws binding the conscience, belong to the church? Or only an ordaining (diataktike) power, of sanctioning constitutions and canons for the sake of good order (eutaxian)? The former we deny; the latter we affirm against the Romanists.’ under ‘Ecclesiastical Power’ in the 18th topic, ‘The Church’ in Institutes, vol. 3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXX.+Although+the+authority+of+these+constitutions+is+great+in+the+church%2C+we+deny+that+it+is+absolute%2C+but+limited%3B+or+that+it+is+equal+with+the+divine+laws%3B+or+that+it+is+as+great+a+sin+to+transgress+the+former+as+the+latter.+We+deny+that+they+can+change+the+nature+of+things%2C+so+that+what+are+in+themselves+indifferent+can+be+made+necessary+and+of+perpetual+right%3B+or+that+any+part+of+Christian+righteousness+is+in+them%2C+much+less+any+merit+with+God%3B+or+that+they+can+extend+themselves+beyond+ecclesiastical+polity+or+good+order+%28eutaxian%29%2C+which+by+themselves+are+not+of+piety%2C+but+only+on+account+of+another+thing+and+by+accident.+Again%2C+we+say+that+they+are+not+to+be+measured+by+themselves%2C+but+by+divine+laws%2C+that+they+may+not+in+anyway+obstruct%2C+but+may+rather+subserve+the+latter.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+pp.+290-1+of+Question+31%2C+%E2%80%98Does+a+legislative+power+properly+so+called%2C+of+enacting+laws+binding+the+conscience%2C+belong+to+the+church%3F+Or+only+an+ordaining+%28diataktike%29+power%2C+of+sanctioning+constitutions+and+canons+for+the+sake+of+good+order+%28eutaxian%29%3F+The+former+we+deny%3B+the+latter+we+affirm+against+the+Romanists.%E2%80%99+under+%E2%80%98Ecclesiastical+Power%E2%80%99+in+the+18th+topic%2C+%E2%80%98The+Church%E2%80%99+in+Institutes%2C+vol.+3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9b66aea4fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href=". <blockquote><p>With this view agrees Calvin. (See Institutes, Bk. 4, ch. 10, pp. 28-31.) The notion of Calvin and our Confession is briefly this: In public worship, indeed in all commanded external actions, there are two elements, a fixed and a variable. The fixed element, involving the essence or the thing, is beyond the discretion of the church. The variable, involving only the ” circumstances” of the action, its separable accidents, may be changed, modified or altered, according to the exigencies of the case. The rules of social intercourse and of grave assemblies in different countries vary. The church accommodates her arrangements so as not to revolt the public sense of propriety.</p></blockquote>

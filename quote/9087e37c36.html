<blockquote><p>The continental Calvinists, with few exceptions, followed the great Geneva Reformer in confining salvation to elect infants after previous regeneration, whether baptized or not, and in excluding non-elect infants, whether baptized or not.</p></blockquote>

<blockquote><p>The promise, accepted by the parents in faith, also includes their children to a thousand generations… If it is objected that not all of them who are born of believing parents are elect, seeing that God did not choose all the children of Abraham and Issac, we do not lack an answer. Though we do not deny that this is the case, still we say that this hidden judgment must be left to God and that normally, by virtue of the promise, all who have been born of believing parents, or if one of the parents believe, are sanctified.</p></blockquote>

0are%20sanctified" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>8. [Baxter complains:] The [Anglican] rubric [post-1662] to which we [ministers] must declare our assent, approbation and consent [upon pain of defrocking], has this article of faith: ‘It is certain by God’s Word that children which are baptized, dying before they commit actual sin are undoubtedly saved.’ [1.] And the rubric at burial excepts all the unbaptized from Christian Burial, according to the office. …

12. There is no one Word of God cited in the rubric which tells us that it is certain by the Word of God.

13. Among Christian divines there are all these various opinions about the salvation of infants:

1. Some hold that the Covenant being to the faithful and their seed, and their children being holy, all the children of sincere Christians are certainly in a state of salvation, being by the parents intentionally dedicated to God, before or without baptism: And that baptism is but their solemn investiture in that state which was theirs by right before.

2. Others think that this right to salvation belongs to the children of all professed Christians godly and ungodly.

3. Others think that it belongs to all infants in the world.

4. Others think that it belongs only to sincere believers’ children that are baptized.

5. Others that it belongs to sound and unsound Christians’ baptized infants.

6. Others that it belongs to all baptized infants whose soever.

7. Others hold that it belongs also to the children of sincere adopters or proprieters.

8. Others that it belongs to such as even bad Christians adopt or own.

9. Others that they that have sincere godfathers, though not proprieters, are saved.

10. Others that even unsound or hypocritical Christian godfathers may suffice to their salvation.

11. Others that the ministers or the Church’s sincere (or professed) Faith is hereto sufficient.

12. And others think that only the elect are saved, of whom some are baptized and some unbaptized, but no man knows who they are. Out of all these opinions the Convocation has chosen one as an article of Faith of undoubted certainty by the Word of God.

13. The non-conformists know of no Word of God which ascertains salvation to any known determinate infants but the great Covenant of Grace, ‘I will be thy God, and the God of thy seed;’ which seed God uses as if they were parts of the parents, Ex. 34:6-7, and Second Commandment, and says to believers, ‘Else were your children unclean, but now, etc.’ [1 Cor. 7:14].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 9, pp. 169, 172-74</span></figcaption>

</figure><figure class="quote" id="q-c603154c54" data-kw="">
<blockquote><p>Are all these benefits received by baptism, equally by all those which receive the same? No, for they are not alike: for the ingrafting into Christ, and the benefits which follow it, are not bestowed upon the reprobate, although they be offered them when they are baptised. For God calleth and justifieth, regenerateth, and glorifieth effectually them whom He hath elected and predestinated to these things, Rom. 8:3, but the elect, as well infants, as they of years are equally incorporated into Christ, either in, or before baptism, and are endowed with the imputation of his righteousness, forgiveness of sins, and the right of eternal life, for they are all alike the sons of God, but regeneration is not wrought alike in all, nor are the gifts of the spirit, faith, hope, and charity, given alike unto all, or received alike of all, but according to the pleasure of God, as the parable of the talents teaches, and Eph. 4:7. To everyone is given grace according to the measure of the gifts of Christ: and we do see that the effects of regeneration are more and greater in some, and in other some fewer and lesser.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9a29be598b" data-kw="">
<blockquote><p>This delight is spiritual in God as the proper object, and in the ordinances as the only means to lead us unto God, Job 27:10; Ps. 43:4; Canticles, 2:3; Isa. 56:7. Reasons. 1. Because the duties of that day are higher, we have then all the means of communion with God: 1. We have them in a more raised solemn way without any interruption; there is then a double institution, not only of the worship, but the time. 2. Its a spiritual feast, a day of God’s appointment, our recompence as well as our duty, Neh. 2:26. Ordinances are fodinae gratiae [wells of grace], Isa. 12:3. 3. This day we come to remember the highest favours of God to the creature, to contemplate the works of Creation, God’s rest, and of Redemption, Christ’s rest, 1 Pet. 4:1, and our own eternal rest, Heb. 4:9, the Sabbaths of the faithful are the suburbs of Heaven, Heb. 12:23, the Lord’s Supper is heaven in a map, Luke 14:15; Mt. 26:29. 4. Many of the duties of the day are but spiritual recreations; meditation is the solace of the mind in the contemplation of God’s works, Ps. 104:34. Singing of Psalms is a vent for spiritual mirth, Lam. 5; Eph. 5:18-19; then God should be solemnly praised, Ps. 92:1-2. 5. It is the temper of the people of God to delight in his solemn worship, Ps. 2; 1 Cor. 2:12. Male concordat canticum novum et vetus homo [The new song and old man poorly agree]. Augustine; Ps. 84:1, 10; Ps. 122:1. 6. Delight in the Sabbath is the best way to discharge the duties: 1. With comfort; delight sweetens all; how will men toil at their sport? Neh. 11:8. 2. With profit, Isa. 64:5; God will not send them away sad which come into his presence with joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London: A.M., 1654), 9th Book, of the Moral Law, ch. 5, 4th Commandment</cite>, pp. 820-21</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e5b82d8f95" data-kw="">
<blockquote><p>19. 4. Although the day be wholly to be dedicated to the ends of a sacred rest before insisted on, yet, 1. Duties in their performance drawn out to such a length as to beget wearisomeness and satiety, tend not to edification, nor do any way promote the sanctification of the name of God in the worship itself. Regard, therefore, in all such performances is to be had: 1. Unto the weakness of the natural constitution of some, the infirmities and indispositions of others, who are not able to abide in the outward part of duties, as others can. And there is no wise shepherd but will rather suffer the stronger sheep of his flock to lose somewhat of what they might reach to in his guidance of them, than to compel the weaker to keep pace with them to their hurt, and it may be their ruin. Better a great number should complain of the shortness of some duties, who have strength and desires for a longer continuance in them, than that a few who are sincere should be really discouraged by being overburdened, and have the service thereby made useless unto them. I always loved in sacred duties that observation of Seneca concerning the orations of Cassius Severus, when they heard him, ‘Timebamus ne desineret,’ ‘We were afraid that he would end.’ 2. To the spiritual edge of the affections of men, which ought to be whetted, and not through tediousness in duties abated and taken off.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitation XL, ‘The Practical Observance of the Lord’s Day’ in Commentary on Hebrews (d. 1683), vol. 1 (of 4)</cite>, pp. 748-49</span></figcaption>

</figure><figure class="quote" id="q-71341c3740" data-kw="">
<blockquote><p>Lastly, if it were granted that Ambrose did entreat Count Arbogastes at a feast, whether will any believe it, who considers the austere life of Ambrose, chastising his body with that discipline (as Paulinus, ibidem) that he observed a daily fast, that he would distain himself with feasts on the Lord’s day which hindred the exercises of religion, either public or private? Nay, truly, He might perhaps dine on the Lord’s day, as the custom of the Church required: but we must not believe that the grave father did fare so daintily on that day as that he could not attend the duties of piety: concerning which nature of feasts we are here speaking: in which number that is to [be] reckoned, which Baronius mentions out of Gregor. Turonens, who tells us of a certain presbyter, invading the Bishopric of Avergue, after the death of Sidonius Apollinaris, who, when the Lord’s day came, having prepared a banquet, commanded that all the citizens should be invited into the Church: a wickedness indeed beseeming the author, that he who had ambitiously invaded the Bishops’ See, against the Canons of the Church, should violate the Lord’s solemnity by his feast, that hindered the duties of divine worship: which unlawful example, I hope nobody that relishes anything of Christ will follow. And now I will conclude with St. Austin [Augustine] (Epistle 86), that none can rightly deny that a Christian may on the Lord’s day be refreshed with a moderate and sober dinner, and also will affirm with that grave father, that those who fear God must not riot on the Lord’s Day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-young.html">Thomas Young</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord’s-Day, or a Succinct Narration compiled out of the Testimonies of Holy Scripture &amp; the Reverend Ancient Fathers… (London: Leach, 1672), bk. 1, ch. 13, pp. 227-28 Young was a Westminster divine.</cite></span></figcaption>

</figure><figure class="quote" id="q-b571955e76" data-kw="">
<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…”

<blockquote><p>In this commandment there are properly said to be two parts—the one natural, the other moral [positive]; the one the genus, the other the species. Of the former it is said, that the natural part or genus is perpetual, and cannot be abrogated, as being a command concerning the maintenance of the public ministry, so that on some one day the people should be taught, and divinely appointed ceremonies handled. But the species, which bears respect to the seventh day in particular, is abrogated.</p></blockquote>

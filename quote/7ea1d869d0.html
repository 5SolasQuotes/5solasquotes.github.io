<main class="wrap"><figure class="quote" id="q-7ea1d869d0" data-kw="">
<blockquote><p>3… Next, man’s mind is moved toward God by the Holy Spirit through Christ and this movement is through faith. Through this [faith] man’s mind believes with certainty all that God has transmitted [tradita], and also with full certainty and without doubt assents to the promises made to us by God who, as stated in the psalm [144:13], is faithful in all his words. From there he acquires confidence [fiduciam] on account of God’s promise, by which he has pledged that he will remit sins freely and that he will adopt as children those who believe in Christ, those I say who repent of their former life. By this faith, he is lifted up to God by the Holy Spirit and so he receives the Holy Spirit, remission of sins, imputation of righteousness and countless other gifts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/colloquy-of-regensburg.html">Colloquy of Regensburg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anthony Lane, Justification by Faith in Catholic-Protestant Dialogue. An Evangelical Assessment</cite>, tr. Anthony Lane (London: 2002), Appendix 1, pp. 233-34 This statement was affirmed by both the Reformed and Romanist sides.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

tion%20of%20righteousness%20and%20countless%20other%20gifts" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-14b4f74e38" data-kw="">
<blockquote><p>Secondly, I say Christ is a second Adam, and a public person, and became ours, we then being in his loins, so the righteousness of Christ is made ours, we being born in Christ by faith, and found in Him: He being our head, we have a spiritual life descending upon us; He being our husband, all his goods are ours also. This point is the soul of the Church and the golden key which opens Heaven for us…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Third Chapter of the Epistle of St. Paul to the Philippians</cite>, ... (London: Cotes, 1639), on verse 9, ‘But that which is through the faith of Christ…’, p. 110</span></figcaption>

</figure><figure class="quote" id="q-47557be10b" data-kw="">
<blockquote><p>15. But when and in what sort and degree Christ gives the actual operations of the Spirit to all covenanted infants, it is wonderful hard for us to know. But this much seems clear:

1. That Christ may when he please work on the soul of an infant to change its disposition, before he come to the use of reason.

2. That Christ and his Spirit as in Covenant with infants, are ready to give all necessary assistance to infants for their inherent sanctification in the use of those means, and on those further conditions, on which we must wait for it and expect it. For the Holy Ghost is not so engaged to us in our Covenant or baptism, as to be obliged presently to give us all the grace that we want; but only to give it us on certain further conditions, and in the use of certain means. … In that also they are by Covenant and their parents promise, engaged to use those means which Christ has appointed for sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, ... (London: 1673) | Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism?…’, p. 819</span></figcaption>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5d08c12ed3" data-kw="">
<blockquote><p>God’s sentence of life to those of us who are the objects of justification is executed when he regenerates us through his Holy Spirit—that is, when he creates within us that new life that he has assigned to us already by means of that earlier sentence of justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.5. ‘The Execution of God’s Judicial Sentence’, p. 108 Rollock (c. 1555-1599) was a Scottish minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-8d7e9a9d55" data-kw="">
<blockquote><p>Question: ‘Who are they who are to believe God shall give them a new heart?’ Answer: No man is positively to believe it while God work it in Him, for no man is to believe that he is predestinated to glory while he first have the effects thereof in him, ‘the hid Manna’, ‘the white Stone’, ‘the new Name’. But no man is to despair or to create fatal inferences that he is reprobate, since God begins kindly with him with a Gospel call.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (1655), p. 95</span></figcaption>

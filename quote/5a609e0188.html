<blockquote><p>I have therefore found in your [Beza’s] published letters two, namely Epistles 35 and 45, in the former of which you touch briefly upon this controversy, but in the latter you discuss it more fully and at greater length. In Epistle 35, then, you say: ‘What is more absurd than to reckon that man just who has not fulfilled the Law?’ But I reply: the righteousness of the Gospel must be carefully distinguished from the righteousness of the Law. That righteousness by which we are accounted righteous by God, and therefore justified or absolved by Him, is not the righteousness of the Law; for God does not justify us on the ground that either we ourselves have fulfilled the Law, or that Christ has fulfilled it for us. Rather, it is the righteousness of the Gospel, that is, that which God bestows upon us through the Gospel—namely, the remission of sins obtained by the blood of Christ. Therefore we seek life from God not by the right of a fulfilled Law or of obedience rendered to the Law, but by the right of adoption, which Christ has procured for us by his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Examen sententiae Domini Theodori Bezae, De justificatione Hominis coram Deo, quae habetur in annotatione ad Rom. 8</cite>, v. 2’ in Correspondance de Théodore de Bèze (1586), eds. Dufour, Genton &amp; Nicollier-de Weck, vol. 27, Travaux d’humanisme et Renaissance 401 (Geneva: Librairie Droz, 2005), p. 59, trans. ChatGPT-5 For a discussion of the import of the below, see Brink, The Transfer of Sin (Brill, 2024), pp. 219-20 ff.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

<blockquote><p>[You must distinguish:]

4. Betwixt a twofold righteousness of one and the same Covenant:

1. Of perfect obedience, or performance of the condition.

2. Of suffering, or satisfaction for disobedience or non-performance which makes the Law to have nothing against us, though we disobeyed. See [William] Pemble, Of Justification, p. 2. Our legal righteousness is of this last sort, and not of the first. Both these sorts of righteousness are not possible to be found in any one person, except Christ, who had the former righteousness as his own (incommunicable to us in that form). The second He had for us, as He was by imputation a sinner: And so we have it in, or by Him. Mark this.

5. Betwixt two kinds of righteousness, suitable to the two Covenants [of Works and of Grace] and their conditions:

1. Legal righteousness, which is our conformity, or satisfaction to the Law.

2. And evangelical righteousness, which is our conformity to the new Covenant. Note, that:

1. Every Christian must have both these.

2. That our legal righteousness is only that of satisfaction: but our evangelical is only that of obedience, or performance of the condition.

3. That our legal righteousness is all without us in Christ, the other in ourselves.

6. [Distinguish] Betwixt [1.] evangelical righteousness, improperly so called, viz. because the Gospel does reveal and offer it. This is our legal righteousness of Christ. 2. And evangelical righteousness properly so called viz. because the new Covenant is the rule to which it is conformed. This is our performance of the new Covenant’s conditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655) | Guide to the Reader Baxter here lays out his Neonomianism.</span></figcaption>

<blockquote><p>Rule II. That justification stands in two things: First in the remission of sins by the merit of Christ’s death: Secondly in the imputation of Christ’s righteousness; which is another action of God whereby He accounts and esteems that righteousness which is in Christ, as the righteousness of that sinner which believes in Him. By Christ’s righteousness we are to understand two things: First his sufferings, specially in his death and passion; Secondly his obedience in fulfilling the Law: both which go together: for Christ in suffering obeyed, and obeying suffered. And the very shedding of his blood to which our salvation is ascribed, must not only be considered as it is passive, that is a suffering, but also as it is active, that is, an obedience, in which He showed his exceeding love both to his Father and us, and thus fulfilled the law for us. This point, if some had well thought on, they would not have placed all justification in remission of sins as they do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... ([Cambridge] 1598), ch. 4, ‘The Justification of a Sinner’, p. 925</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-7c4489d22d" data-kw="">
<blockquote><p>For remission of sins does not only deliver from pain, to wit, eternal death; but also brings glory or eternal life. The reason of which thing is this, that remission of sins, wherein man’s justification consists, is remission of all sins: and therefore not only of sins of committing, but also of sins of omitting: whereby it comes that he to whom God forgives sins, is so accounted of, as if he had not only committed nothing which God has forbidden in his law: but also, omitted nothing of that which he has commanded: and therefore, as if he had perfectly fulfilled the law of God. Now where the perfect fulfilling of the law is, there also is life, according to that, ‘The man that doeth these things shall live in them.’ Moreover, the example of civil judgment which Bellarmine brings, proves not his assumption: because that absolution is unlike to the absolution of God. For this is universal, to wit from all sins against the law of God: but that is particular or special; to wit, from some certain crime or crimes, against the politic laws. Notwithstanding, the civil judge gives unto him whom he has quitted from certain crimes those rewards which he has promised to the innocent, namely, preservation in life and defence; although he give him no new and singular rewards which he has promised only to certain virtuous exploits. And so God gives eternal life as a reward to those unto whom He has promised it, to wit, unto those that keep his law: such as He accounts all those whose sins He has forgiven.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“For remission of sins does not only deliver from pain, to wit, eternal death; but also brings glory or eternal life. The reason of which thing is this, that remission of sins, wherein man’s justification consists, is remission of all sins: and therefore not only of sins of committing, but also of sins of omitting: whereby it comes that he to whom God forgives sins, is so accounted of, as if he had not only committed nothing which God has forbidden in his law: but also, omitted nothing of that which he has commanded: and therefore, as if he had perfectly fulfilled the law of God. Now where the perfect fulfilling of the law is, there also is life, according to that, ‘The man that doeth these things shall live in them.’ Moreover, the example of civil judgment which Bellarmine brings, proves not his assumption: because that absolution is unlike to the absolution of God. For this is universal, to wit from all sins against the law of God: but that is particular or special; to wit, from some certain crime or crimes, against the politic laws. Notwithstanding, the civil judge gives unto him whom he has quitted from certain crimes those rewards which he has promised to the innocent, namely, preservation in life and defence; although he give him no new and singular rewards which he has promised only to certain virtuous exploits. And so God gives eternal life as a reward to those unto whom He has promised it, to wit, unto those that keep his law: such as He accounts all those whose sins He has forgiven.”

— Johannes Piscator, A Learned &amp; Profitable Treatise of Man’s Justification. Two Books. Opposed to the Sophisms of Robert Bellarmine, Jesuit (London, 1599) 128 pp. ToC, bk. 2, ch. 4, pp. 106-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+remission+of+sins+does+not+only+deliver+from+pain%2C+to+wit%2C+eternal+death%3B+but+also+brings+glory+or+eternal+life.+The+reason+of+which+thing+is+this%2C+that+remission+of+sins%2C+wherein+man%E2%80%99s+justification+consists%2C+is+remission+of+all+sins%3A+and+therefore+not+only+of+sins+of+committing%2C+but+also+of+sins+of+omitting%3A+whereby+it+comes+that+he+to+whom+God+forgives+sins%2C+is+so+accounted+of%2C+as+if+he+had+not+only+committed+nothing+which+God+has+forbidden+in+his+law%3A+but+also%2C+omitted+nothing+of+that+which+he+has+commanded%3A+and+therefore%2C+as+if+he+had+perfectly+fulfilled+the+law+of+God.+Now+where+the+perfect+fulfilling+of+the+law+is%2C+there+also+is+life%2C+according+to+that%2C+%E2%80%98The+man+that+doeth+these+things+shall+live+in+them.%E2%80%99+Moreover%2C+the+example+of+civil+judgment+which+Bellarmine+brings%2C+proves+not+his+assumption%3A+because+that+absolution+is+unlike+to+the+absolution+of+God.+For+this+is+universal%2C+to+wit+from+all+sins+against+the+law+of+God%3A+but+that+is+particular+or+special%3B+to+wit%2C+from+some+certain+crime+or+crimes%2C+against+the+politic+laws.+Notwithstanding%2C+the+civil+judge+gives+unto+him+whom+he+has+quitted+from+certain+crimes+those+rewards+which+he+has+promised+to+the+innocent%2C+namely%2C+preservation+in+life+and+defence%3B+although+he+give+him+no+new+and+singular+rewards+which+he+has+promised+only+to+certain+virtuous+exploits.+And+so+God+gives+eternal+life+as+a+reward+to+those+unto+whom+He+has+promised+it%2C+to+wit%2C+unto+those+that+keep+his+law%3A+such+as+He+accounts+all+those+whose+sins+He+has+forgiven.%E2%80%9D%0A%0A%E2%80%94+Johannes+Piscator%2C+A+Learned+%26+Profitable+Treatise+of+Man%E2%80%99s+Justification.+Two+Books.+Opposed+to+the+Sophisms+of+Robert+Bellarmine%2C+Jesuit+%28London%2C+1599%29+128+pp.+ToC%2C+bk.+2%2C+ch.+4%2C+pp.+106-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c4489d22d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7c4489d22d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=For%20remission%20of%20sins%20does%20not,those%20whose%20sins%20He%20has%20forgiven&amp;text=For%20remission%20of%20sins%20does%20not%20only%20deliver&amp;text=accounts%20all%20those%20whose%20sins%20He%20has%20forgiven" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-00576a4c2f" data-kw="">
<blockquote><p>Lord, thou knows I am weak in grace, thou seest my faith is feeble, my love cold, my desires faint, my obedience small; but thou hast all fulness of grace; thou art the Fountain, and this Fountain is opened here; thou art the Treasury, and this Treasury is here unlocked.

Those graces I have, though weak, thou begatst them, and wilt not thou now nourish them? From thee I had the being of grace, and from thee I must have the nourishing. Thou hast set up this Ordinance as a means to convey grace, and thou hast promised to remember them that are in thy way, therefore help,—&amp;c.

Besides, may faith say, Lord, thou hast been pleased to implant me into Christ, and shall I die for want of nourishment? thou hast made me a member of Christ, and shall I decay and wither for want of influence? Oh! never let it be said, that a branch in Christ shall wither and decay for want of nourishment, when there is so much in the root; let it never be said, that a member of Christ should wither and die for want of influence and life, seeing there is so much in the Head.

Thou camest, that I might have life; yea, &amp; have it in abundance; why Lord, my graces are weak, here are dying affections, dying dispositions, dying graces, Oh! come down before I die, strengthen the things that are ready to die in me. Thou hast raised me from the death of sin, let me not again drop into the same grave; thou hast wrought graces in me, let them not decay for want of life, when such abundance in thee.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guard of the tree of life, or, A sacramental discourse shewing a Christians privilege in approaching to God in ordinances, duty in his sacramental approaches, danger if he do not sanctify God in them</cite>, (London: A. Kemble, 1644), pp 66-68.</span></figcaption>

<blockquote><p>By reason, therefore, of this laver of repentance and knowledge of God, which has been ordained on account of the transgression of God’s people, as Isaiah cries, we have believed, and testify that that very baptism which he announced is alone able to purify those who have repented; and this is the water of life. But the cisterns which you have dug for yourselves are broken and profitless to you. For what is the use of that baptism which cleanses the flesh and body alone? Baptize the soul from wrath and from covetousness, from envy, and from hatred; and, lo! the body is pure. For this is the symbolic significance of unleavened bread, that you do not commit the old deeds of wicked leaven. But you have understood all things in a carnal sense, and you suppose it to be piety if you do such things, while your souls are filled with deceit, and, in short, with every wickedness. Accordingly, also, after the seven days of eating unleavened bread, God commanded them to mingle new leaven, that is, the performance of other works, and not the imitation of the old and evil works.</p></blockquote>

</figure><figure class="quote" id="q-b1b1dc4900" data-kw="">
<blockquote><p>Now concerning the outward form and manner of admitting Professors unto the holy Communion, and distinguishing them from those that are without; we find nothing distinctly enjoined in the Word, or extant in the practice of the Apostles: Therefore that which may concern this matter, is conceived to be left free unto the discretion of the Eldership, as they shall think it most fit, for the edification and capacity of those with whom they have to do.

And herein the customs of the Reformed churches, in respect of circumstantials, are found to be different; yet, in the main, their agreement is this—

1. That every one who for the first time is to be admitted unto the Holy communion, is to be examined in respect of his knowledge and conversation; although from his infancy he hath been born, baptized, and bred in the Congregation.

2. If he come from abroad; having years of discretion and judgement fit to examine himself, it is expected he should have a testimonial of his former life and conversation, and of his diligence in attending the Ordinances in the place where he hath lived. And being found knowing in the fundamental truths of Christianity, he is desired

First, to declare that his purpose is to live and die in the communion of the Reformed churches.

Secondly, to promise, that if he should conceive any scruples of the Doctrine that is taught in the Reformed churches, he shall not conceal his doubts, and fall away from the Fellowship into which he is received; but make the same known unto his Teachers, to receive satisfaction therein.

Thirdly, to oblige himself to use all careful diligence to honour and adorn his profession with his life and conversation, and to avoid all occasion of scandal.

Fourthly and lastly, to promise to submit himself unto the Rules of Church-discipline, according to the Word; and to respect those that are set over him in the Lord.

All which he is engaged to do by word of mouth, and by giving his hand unto the Eldership.

In some places, this admission of Members is left to the Pastor, to be performed in private; yet so, as the reception of the party must be notified unto, and ratified by the Eldership. In some places, all is done before the whole Eldership. In some places also, the names of those that are admitted, are published unto the whole Congregation from the Pulpit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A model of church-government: or, The grounds of the spiritual frame and government of the house of God. Shewing, what the holy Scriptures have therein delivered; what the best Reformed Churches do practise; what the tender consciences may rest in. For the better satisfaction of such as scruple at t</cite>, (London: John Bellamy, 1647), pp 33-34.</span></figcaption>

— John Dury, A model of church-government: or, The grounds of the spiritual frame and government of the house of God. Shewing, what the holy Scriptures have therein delivered; what the best Reformed Churches do practise; what the tender consciences may rest in. For the better satisfaction of such as scruple at t, (London: John Bellamy, 1647), pp 33-34.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNow+concerning+the+outward+form+and+manner+of+admitting+Professors+unto+the+holy+Communion%2C+and+distinguishing+them+from+those+that+are+without%3B+we+find+nothing+distinctly+enjoined+in+the+Word%2C+or+extant+in+the+practice+of+the+Apostles%3A+Therefore+that+which+may+concern+this+matter%2C+is+conceived+to+be+left+free+unto+the+discretion+of+the+Eldership%2C+as+they+shall+think+it+most+fit%2C+for+the+edification+and+capacity+of+those+with+whom+they+have+to+do.%0A%0AAnd+herein+the+customs+of+the+Reformed+churches%2C+in+respect+of+circumstantials%2C+are+found+to+be+different%3B+yet%2C+in+the+main%2C+their+agreement+is+this%E2%80%94%0A%0A1.+That+every+one+who+for+the+first+time+is+to+be+admitted+unto+the+Holy+communion%2C+is+to+be+examined+in+respect+of+his+knowledge+and+conversation%3B+although+from+his+infancy+he+hath+been+born%2C+baptized%2C+and+bred+in+the+Congregation.%0A%0A2.+If+he+come+from+abroad%3B+having+years+of+discretion+and+judgement+fit+to+examine+himself%2C+it+is+expected+he+should+have+a+testimonial+of+his+former+life+and+conversation%2C+and+of+his+diligence+in+attending+the+Ordinances+in+the+place+where+he+hath+lived.+And+being+found+knowing+in+the+fundamental+truths+of+Christianity%2C+he+is+desired%0A%0AFirst%2C+to+declare+that+his+purpose+is+to+live+and+die+in+the+communion+of+the+Reformed+churches.%0A%0ASecondly%2C+to+promise%2C+that+if+he+should+conceive+any+scruples+of+the+Doctrine+that+is+taught+in+the+Reformed+churches%2C+he+shall+not+conceal+his+doubts%2C+and+fall+away+from+the+Fellowship+into+which+he+is+received%3B+but+make+the+same+known+unto+his+Teachers%2C+to+receive+satisfaction+therein.%0A%0AThirdly%2C+to+oblige+himself+to+use+all+careful+diligence+to+honour+and+adorn+his+profession+with+his+life+and+conversation%2C+and+to+avoid+all+occasion+of+scandal.%0A%0AFourthly+and+lastly%2C+to+promise+to+submit+himself+unto+the+Rules+of+Church-discipline%2C+according+to+the+Word%3B+and+to+respect+those+that+are+set+over+him+in+the+Lord.%0A%0AAll+which+he+is+engaged+to+do+by+word+of+mouth%2C+and+by+giving+his+hand+unto+the+Eldership.%0A%0AIn+some+places%2C+this+admission+of+Members+is+left+to+the+Pastor%2C+to+be+performed+in+private%3B+yet+so%2C+as+the+reception+of+the+party+must+be+notified+unto%2C+and+ratified+by+the+Eldership.+In+some+places%2C+all+is+done+before+the+whole+Eldership.+In+some+places+also%2C+the+names+of+those+that+are+admitted%2C+are+published+unto+the+whole+Congregation+from+the+Pulpit.%E2%80%9D%0A%0A%E2%80%94+John+Dury%2C+A+model+of+church-government%3A+or%2C+The+grounds+of+the+spiritual+frame+and+government+of+the+house+of+God.+Shewing%2C+what+the+holy+Scriptures+have+therein+delivered%3B+what+the+best+Reformed+Churches+do+practise%3B+what+the+tender+consciences+may+rest+in.+For+the+better+satisfaction+of+such+as+scruple+at+t%2C+%28London%3A+John+Bellamy%2C+1647%29%2C+pp+33-34.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb1b1dc4900.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b1b1dc4900.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/12/25/john-dury-on-the-admission-of-professors-to-communion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

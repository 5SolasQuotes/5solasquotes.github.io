</figure><figure class="quote" id="q-9e5ff02224" data-kw="">
<blockquote><p>When we use the word faith strictly and properly we mean that for certain reasons apprehended by us we are satisfied as to the reality, reliability or truth of a certain event, object or person… When it has respect to a person we mean that we credit him as trustworthy in respect of that character which is under consideration… … To sum up, faith is trust. Trust presupposes an object. An object evokes our trust when there is an antecedent judgment of the mind that the object is trustworthy. This judgment is formed by the evaluation of evidence as sufficient. It is a state of mind induced by considerations objective to ourselves though always apprehended by our minds. … In this case it is useless or futile to try to ground this conviction [that the Scripture is the Word of God] upon rational argumentation based upon evidence extraneous to the sum total of the data with which the Christian revelation confronts us. It might seem that such argumentation is necessary in order to avoid the charge of arguing in a circle. But it will become apparent how impossible it is to produce by evidence extraneous to the Scripture the faith which has as its object the Scripture itself. The Reformers were aware of the fallacy attaching to argumentation on the basis of extrinsic evidence, and so they laid down the principle that Scripture is autopistic, that is, self-authenticating, and this means that the evidence validating the faith of Scripture as the Word of God is the Scripture itself. This is to say that it contains within itself the evidence of its divine origin, character, and authority.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Faith’ in Collected Writings</cite>, 2.235-6, 237, 241</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>…our orthodox divines do say that faith justifies as it’s an instrument, laying hold on Christ, so that Christ received by faith is properly that which justifies, not faith itself, or any dignity in it. This is the hand that receiveth the jewel, which does enrich us. This doctrine, though so generally received and avowed by all Protestant writers, yet of late is rejected among other reasons, because [it is said] there cannot be any passive instrument. Now I much wonder that Bellarmine, Becanus and other subtil Jesuits that turned every stone to overthrow faith’s instrumentality in justification, should so far forget their logic and metaphysics as not to pitch upon this objection above all, that there cannot be any such thing as a passive instrument. Truly I think, when a man of godly affections broaches an error, which he takes to be a truth, he himself is a passive instrument to bring others into errors. If we regard natural causes and moral, we may easily mention many passive instruments: In natural things the throat is a passive instrument of drinking. The Conduit-pipe of conveying water, and twenty such instances men may think of. In morality, taking that largely, there are many passive instruments: Nebuchadnezzar and all wicked men are God’s passive instruments. The Serpent by which the Devil deceived Eve, was a passive instrument: and to come nearer to our purpose, who can deny but that miraculous faith was a passive instrument in doing miracles, for the power of working miracles is infinite and could not be communicated to a creature no more than the creation of a world, only they by resting on God’s power, God wrought these wonderful things by them. But nothing does so fully represent this as the opinion of Aristotle and others following him, that intelligere is pati, and so videre, audire, are pati, ‘to understand is to receive,’ and so ‘to see’ and ‘hear;’ the soul does these by those faculties which are passive instruments therein; and therefore when Bellarmine would prove that credere and apprehendere were actions and works, it’s well answered that to believe or to lay hold on Christ (the Greek word applied often to faith is [Greek]. Though they be grammatical actions, yet they are naturally passions, as intelligere, videre are active verbs according to grammar, but naturally and physically are passions: So that a man in believing is passive, that is, he receives Christ for his righteousness: But of a passive instrument more hereafter. Justification is not in giving something to God but in receiving from Him; we do not curiously litigate about the word ‘instrument;’ by instrumentum we mean no more than medium, whereby the soul receives the Gospel-righteousness tendered unto it, and those peculiar expressions you heard the Scripture gives to faith, can evince no less. If therefore faith justify upon a peculiar reason, that that grace only has, viz. because it receives and applies Christ our righteousness, then other graces and holy works, having no such capacity, cannot justify. As the hand only, not the eyes or the feet, are the instrument that take alms given to a poor man. This consideration made that learned man Mr. [John] Ball, say how faith and works should be conjoined as con-causes in justification is impossible to conceive. Treatise of the Covenant of Grace, p. 70. And it’s a mere sophism to say that if by faith we receive Christ, and faith is the receiving of Christ, then we receive Christ by receiving; for its not the notion of faith that is properly the instrument receiving, but faith as the habit putting itself into act. So that the meaning is, faith acting or laying hold upon Christ, is the instrument receiving Him. Neither is this to give too much to faith, no more than in the faith of miracles, when Christ said to some, ‘Thy faith hath made thee whole,’ that thereby our Savior gave any dignity to faith, as if that were the cause of their health.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, … (London, 1654), sermon 23, pp. 224-25</span></figcaption>

<blockquote><p>Question: Can any man be justified before he does actually believe? Answer: If we take justification [1] in the first, most proper and principal sense, as it is the act of God alone, communicating Christ’s righteousness and satisfaction to his elect, when He does first unite them to Christ by his Spirit, and make Christ theirs with all his treasures: then it must be granted that men may be and are justified, before and without any express act of believing. As for example: elect infants which die in their infancy, when they are regenerated and united to Christ by his Spirit, they have communion of his righteousness and are justified and made righteous, and all their sins are abolished and blotted out; and yet they do not actually believe, nor perform any explicit and express act of faith. Also they who are not effectually called to the state of grace and to communion with Christ till they come to years of discretion, though they have the gift of faith immediately at the same time infused into them: yet Christ’s righteousness is in order of nature communicated to them, and they are made righteous by it before God, before they do actually believe, or can truly believe that Christ is made to them righteousness, or can by believing possess and enjoy his righteousness for justification. As a child may be born, or made an heir to lands, honor and riches, and may have a true right and interest in them, and be lord of all, before he has wit [understanding] to know his own estate, or discretion to possess actually and use them: so men may be justified by Christ’s righteousness made theirs, in the first instant of their regeneration and spiritual union with Christ, before they do actually believe, and sensibly possess and enjoy Christ and his obedience for justification. [2] But if we take justification in a secondary sense, as it is an act wherein the elect themselves do cooperate and work together with God, by receiving and applying to themselves particularly the gift of righteousness freely given unto them, and by possessing and enjoying it; then must actual believing go before it as the instrumental cause, by which God justifies them in their own sense and feeling, and upon which He does esteem and account them righteous in the intercourse between Him and them, and gives them his warrant to esteem themselves justified with Him. [3] But if we take justification in a judiciary sense, as it is used in courts of justice and judgment, for proving, declaring, and pronouncing men righteous: then not only faith and actual believing, but also repentance, amendment of life, and all holy Christian duties, and good works of piety, mercy, and charity must necessarily go before as evidences, testimonies, and proofs by which men must be justified, that is, judged, declared, and pronounced righteous. First, in the court of their own conscience, so often as sin and Satan stand up against them to accuse them. Secondly, in the common judgment of men. Thirdly, in the general judgment at the last day. Of [1] the first [“most proper”] justification, the apostle speaks, Rom. 5:19, where he says that by the obedience of Christ many are made righteous, and Rom. 8:4 and 2 Cor. 5:21. Of [2] the second [of enjoying it] he speaks, Rom. 3:28, and 4:3, and Gal. 3:8, where he says we are justified by faith without works or deeds of the law. Of [3] the third [“in a judiciary sense”] Saint James speaks, where he says that Abraham was justified by works, James 2:21; and Job 13:18, where he says, “Behold now I have ordered my cause, I know that I shall be justified”; and this St. Paul calls ‘justification of life’, Rom. 5:18, because it is an adjudging of men to eternal life, according to the evidence of their works, as our Savior shows, Mt. 24:35.</p></blockquote>

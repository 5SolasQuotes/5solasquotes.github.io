<blockquote><p>What we can say with a stronger degree of certainty is that Geneva established a system designed to hide their ministry and that, thus, Geneva’s impact on France and the French Reformation was founded, in no small measure, on deception during the period from 1536 to 1563.</p></blockquote>

— Jon Balserak, ‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 100">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+we+can+say+with+a+stronger+degree+of+certainty+is+that+Geneva+established+a+system+designed+to+hide+their+ministry+and+that%2C+thus%2C+Geneva%E2%80%99s+impact+on+France+and+the+French+Reformation+was+founded%2C+in+no+small+measure%2C+on+deception+during+the+period+from+1536+to+1563.%E2%80%9D%0A%0A%E2%80%94+Jon+Balserak%2C+%E2%80%98Geneva%E2%80%99s+Use+of+Lies%2C+Deceit+%26+Simulation+in+Their+Efforts+to+Reform+France%2C+1536%E2%80%931563%E2%80%99+HTR+112%3A1+%282019%29%2C+pp.+76%E2%80%93100%2C+p.+100&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c3bfdc903.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7c3bfdc903.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/expositions-of-the-ninth-commandment/#:~:text=What%20we%20can%20say%20with%20a,the%20period%20from%201536%20to%201563&amp;text=What%20we%20can%20say%20with%20a%20stronger%20degree&amp;text=deception%20during%20the%20period%20from%201536%20to%201563" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25a3563ea4" data-kw="">
<blockquote><p>Truth is the daughter of time, was the saying of old, and our daily experience gives in evidence and proof hereof, to every man’s ordinary observation. Only as in other births, so here, the barrenness and fruitfulness of several ages, depend merely upon God’s good pleasure; who opens and shuts the womb of truth from bearing, as He sees fit, according to the counsel of his own will. Not that there is any change in the truth, but the alteration grows, according to men’s apprehensions, to whom it is more or less discovered, according to God’s most just judgment and their own deservings. Sometimes God makes an eclipse of the truth at midday, that so He might express his wrath from Heaven against the unthankfulness, prophaness and atheism of a malignant world. … Sometimes when men entertain the truth in profession, but not in the love of it and that endeared affection that is due thereunto, the Lord gives men up to the activity of error, as the apostle speaks, because they did not love that the trutb should be truth, they embraced falsehood instead of truth, that so they might be deluded and damned… He that will estrange his affection [to others] because of the difference of apprehension in things difficult, he must be a stranger to himself one time or other. If men would be tender and careful to keep off offensive expressions, they might keep some distance in opinion, in some things, without hazard to truth or love. But when men set up their sheaves (though it be but in a dream, as Joseph’s was) and fall out with every one that will not fall down and adore them, they will bring much trouble into the world, but little advantage to the truth or peace. Again, the Reader must know for his direction in this inquiry, my aim only was, and is, to lay down, and that briefly, the grounds of our practice, according to that measure of light I have received, and to give answer to such reasons which might seem to weaken the evidence thereof: declining purposely, for the present, the examination of such answers which are made to the arguments alledged by some of our reverend Brethren touching the same subject: because I would neither prejudice nor prevent their proper defense, which I do suppose in the fittest season they will so present unto the world as shall be fully satisfactory to such as love and desire the knowledge of the truth. The sum is, we doubt not what we practise, but it’s beyond all doubt that all men are liars and we are in the number of those poor feeble men; either we do, or may err, though we do not know it; what we have learned we do profess and yet profess still to live that we may learn. And therefore the errand upon which this present discourse is sent, is summarily to show these two things unto the world: 1. That there must be more said (than yet it has been my happiness to see) before the principles we profess will be shaken, and consequently it cannot be expected, that we should be unsetled in our practice. 2. That I might occasion men eminently gifted to make further search, and to dig deeper, that if there be any vein of reason which lies yet lower, it might be brought to light, and we profess and promise, not only a ready ear to hear it, but a heart willing to welcome it. It’s the perfection of a man, amidst these many weaknesses we are surrounded withal, by many changes to come to perfection. It’s the honour and conquest of a man truly wise to be conquered by the truth: and he has attained the greatest liberty that suffers himself to be led captive thereby. … In the handling of all these particulars, so full of difficulty and obscurity, I am not such a stranger at home, but that I am easily sensible of the weight of the matter and mine own weakness: and therefore I can professe in a word of truth that against mine own inclination and affection I was haled by importunity to this so hard a task, to kindle my rush candle, to join with the light of others, at least to occasion them to set up their lamps. Now He that is the way, the truth, and the life, pave out all the ways of his people and make their paths plain before them: Lead us all into that truth which will lead us unto eternall life: bring us once unto that impotency and impossibility that we can do nothing against the truth, but for it, that so our congregations may not only be styled as Ezekiel’s temple, but be really what was prophesied the Churches should be in these last days, Jehovah Shammah [the Lord is There]. In the arms of his everlasting mercy I leave thee…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hooker.html">Thomas Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Sum of Church-Discipline</cite>, … (London: Bellamy, 1648), Preface, no page numbers</span></figcaption>

</figure><figure class="quote" id="q-93c6663cc1" data-kw="">
<blockquote><p>As your heavenly Father has a common love, which he extends to all mankind… so ought you to have: though you are not obliged to take your enemies into your bosom, yet you ought to love them in their order. And as your heavenly Father, though he will one day have a satisfaction from sinners, for the wrong done to his majesty, unless they repent; yet, to heap coals of fire on their heads, gives them good things of common providence, that he might not leave them without witness, yea, and affords them the outward means of grace for their souls: so, although you are bound to seek some satisfaction for God’s honor and glory from flagitious sinners, and though you may in an orderly course seek a moderate satisfaction for the wrong done to yourselves, yet you ought to love them with a love consistent with these things; that so you may imitate your heavenly Father, and approve yourselves to be his children.</p></blockquote>

<blockquote><p>…from natural affections, there results an act of self-love for self-preservation. So David shall condemn another rich man who has many lambs and robs his poor brother of his one lamb and yet not condemn himself, though he be most deep in that fault, 1 Sam. 12:5-6;</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a48f1afc21" data-kw="">
<blockquote><p>Now, by this we set aside the error of some who say that corporeal punishments are illicit to use. These people adduce as a basis for their error the text of Exodus ( 20:13): “You shall not kill,” which is mentioned again in Matthew (5:21). They also bring up what is said in Matthew (13:30), that the Lord replied to the stewards who wanted to gather up the cockle from amidst the wheat: “Let both grow until the harvest.” By the cockle we understand the children of the wicked one, whereas by the harvest we understand the end of the world, as is explained in the same place (Mat. 13:38-40). So, the wicked are not to be removed from among the good by killing them.

They also allege that so long as a man is existing in this world he can be changed for the better. So, he should not be removed from the world by execution, but kept for punishment.

Now, these arguments are frivolous. Indeed, in the law which says “You shall not kill” there is the later statement: “You shall not allow wrongdoers to live” (Exod. 22: 18). From this we are given to understand that the unjust execution of men is prohibited. This is also apparent from the Lord’s words in Matthew 5. For, after He said: “You have heard that it was said to them of old: You shall not kill” (Mat. 5:21), He added: “But I say to you that whosoever is angry with his brother,” etc.

From this He makes us understand that the killing which results from anger is prohibited, but not that which stems from a zeal for justice. Moreover, how the Lord’s statement, “Let both grow until the harvest,” should be understood is apparent through what follows: “lest perhaps, gathering up the cockle, you root up the wheat also together with it” (Mat. 13: 29). So, the execution of the wicked is forbidden wherever cannot be done without danger to the good. Of course, this often happens when the wicked are not clearly distinguished from the good by their sins, or when the danger of the evil involving many good men in their ruin is feared.

Finally, the fact that the evil, as long as they live, can be corrected from their errors does not prohibit the fact that they may be justly executed, for the danger which threatens from their way of life is greater and more certain than the good which may be expected from their improvement. They also have at the critical point of death the opportunity to be converted to God through repentance. And if they are so stubborn that even at the point of death their heart does not draw back from evil, it is possible to make a highly probable judgment that they would never come away from evil to the right use of their powers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Contra Gentiles</cite>, trans. English Dominican Fathers (c. 1265; London, 1924), 3.146.</span></figcaption>

<blockquote><p>15. What is philosophy, and what is its relation to theology ? Philosophy, in its wide sense, embraces all human knowledge, acquired through the use of man’s natural faculties, and consists of that knowledge interpreted and systematized by the reason. Science is more specific, relating to some special department of knowledge thoroughly reduced to system… Philosophy is presupposed, therefore, in science as the first and most general knowledge. It inquires into the soul and the laws of thought, into intuition and ultimate truth, into substance and real being, into absolute cause, the ultimate nature of force and will, into conscience and duty. As to its relations to theology it will be observed — 1st. The first principles of a true philosophy are presupposed in all theology, natural and revealed. 2d. The Holy Scriptures, although not designed primarily to teach philosophy, yet necessarily presuppose and involve the fundamental principles of a true philosophy. Not the inferences of these principles drawn out into a system, but the principles themselves, as to substance and cause, as to conscience and right, etc. … 4th. The devout believer, however, who is assured that the Bible is the very word of God, can never allow his philosophy, derived from human sources, to dominate his interpretation of the Bible, but will seek with a docile spirit and with the assistance of the Holy Spirit, to bring his own philosophy into perfect harmony with that which is implicitly contained in the Word. He will, by all means, seek to realize a philosophy which proves itself to be the genuine and natural handmaid of the religion which the Word reveals.</p></blockquote>

<blockquote><p>117. How is systematic theology distinguished, as to its arrangement, or method of conducting it? Ans. Into Positive and Scholastic.

118. What is the Positive? Ans. Such as commentaries on the Scriptures, following the order of the Scriptures, and not the connexion of doctrines — and insulated discourses.

119. What is the Scholastic method? Ans. A method conducted according to the rules of logic, setting forth the doctrines of divine truth in their connexion of matter, and dependencies of one part on another.

120. Is the Scholastic method to be approved? Ans. Yes; it is properly the systematic method, the method of schools, and is commended to us by the schools of the prophets, the creeds and collections of the Fathers, and by the example of the apostle Paul, to the Romans, Galatians, Hebrews, &amp;c.

§ XXVI. 121. What is commonly meant by scholastic theology? Ans. A Popish theology, which was begun about the twelfth century, by Peter Lombard. They divided into sects, called Thomists, Scotists, Realists, Nominalists, &amp;c. They had some good philosophical speculations and expressions, and some clear testimonies to divine truth; but they are justly blamed for the use they make of the authority of the Fathers and Philosophers, leading to neglect the Scriptures, and for their errors, curious and useless questions, barbarous terms, and darkening of the Scriptures by their explanations.</p></blockquote>

§ XXVI. 121. What is commonly meant by scholastic theology? Ans. A Popish theology, which was begun about the twelfth century, by Peter Lombard. They divided into sects, called Thomists, Scotists, Realists, Nominalists, &amp;c. They had some good philosophical speculations and expressions, and some clear testimonies to divine truth; but they are justly blamed for the use they make of the authority of the Fathers and Philosophers, leading to neglect the Scriptures, and for their errors, curious and useless questions, barbarous terms, and darkening of the Scriptures by their explanations.”

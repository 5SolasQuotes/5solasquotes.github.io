<main class="wrap"><figure class="quote" id="q-335e256577" data-kw="">
<blockquote><p>…His Majesty with advice and consent forsaid ratifies approves and confirms the fifth act of the second session [in 1690] of this current Parliament entitled, ‘Act Ratifying the Confession of Faith, and Settling Presbyterian Church Government’ in the whole heads articles and clauses thereof as if at length herein set down…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/parliament.html">Parliament of Scotland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>For Securing the Protestant Religion and Presbyterian Church Government</cite>, For Securing the Protestant Religion and Presbyterian Church Government in Cooper, Confessions, pp. 55-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44939741d7" data-kw="">
<blockquote><p>While it’s likely that Machen himself took no doctrinal exceptions to the Westminister Standards, it’s clear from his own words and leadership in the formation of the OPC that he believed officers should be granted exceptions to doctrines (not just wording) that do not strike at the fundamentals of the Presbyterian and Reformed system and that they should be allowed to teach these exceptions. We know this because of how he approached the question of premillennialism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/derek-radney.html">Derek Radney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘J. Gresham Machen on Confessional Subscription: Not a Fundamentalist in holding to the Westminster Standards’</cite>, (2023) Substack</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“While it’s likely that Machen himself took no doctrinal exceptions to the Westminister Standards, it’s clear from his own words and leadership in the formation of the OPC that he believed officers should be granted exceptions to doctrines (not just wording) that do not strike at the fundamentals of the Presbyterian and Reformed system and that they should be allowed to teach these exceptions. We know this because of how he approached the question of premillennialism.”

— Derek Radney, ‘J. Gresham Machen on Confessional Subscription: Not a Fundamentalist in holding to the Westminster Standards’ (2023) Substack">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhile+it%E2%80%99s+likely+that+Machen+himself+took+no+doctrinal+exceptions+to+the+Westminister+Standards%2C+it%E2%80%99s+clear+from+his+own+words+and+leadership+in+the+formation+of+the+OPC+that+he+believed+officers+should+be+granted+exceptions+to+doctrines+%28not+just+wording%29+that+do+not+strike+at+the+fundamentals+of+the+Presbyterian+and+Reformed+system+and+that+they+should+be+allowed+to+teach+these+exceptions.+We+know+this+because+of+how+he+approached+the+question+of+premillennialism.%E2%80%9D%0A%0A%E2%80%94+Derek+Radney%2C+%E2%80%98J.+Gresham+Machen+on+Confessional+Subscription%3A+Not+a+Fundamentalist+in+holding+to+the+Westminster+Standards%E2%80%99+%282023%29+Substack&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44939741d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/44939741d7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-in-american-church-history/#:~:text=While%20it%E2%80%99s%20likely%20that%20Machen%20himself,he%20approached%20the%20question%20of%20premillennialism&amp;text=While%20it%E2%80%99s%20likely%20that%20Machen%20himself%20took%20no&amp;text=of%20how%20he%20approached%20the%20question%20of%20premillennialism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8e0bf6110d" data-kw="">
<blockquote><p>In 1720, the [Presbyterian] Synod [of Ulster] adopted the so-called ‘Pacific Act,’ which in the same breath professed adherence to the Westminster Confession, extended the Act of 1705 to all intrants to the ministry, though licensed and ordained elsewhere; and ‘legalized the practice of receiving explanations of objectionable phrases.’ In 1721 a motion was made and carried that all the members of Synod who are willing to subscribe the Westminster Confession of Faith, according to the terms of the Pacific Act, be allowed by this Synod to do it. Charitable declarations were made by both parties in the Synod and approved by Synod. The great majority of the members of Synod signed the following formula: ‘Reserving to ourselves the benefit of the Pacific Act, we believe the Westminster Confession of Faith to be founded on the Word of God, and therefore as such, by this our subscription, we do own the said Confession as the confession of our faith.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-cooper.html">James Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confessions of Faith &amp; Formulas of Subscription in the Reformed Churches</cite>, … (Glasgow: MacLehose &amp; Sons, 1907), pp. 19-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

oopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c929d6bc40" data-kw="">
<blockquote><p>2. Now I take the gospel to be the clear manifestation of the mystery of Christ. I recognize, of course, that since Paul calls the gospel ‘the doctrine of faith’ [1 Tim. 4:6], all those promises of free remission of sins which commonly occur in the law, whereby God reconciles men to himself, are counted as parts of it.</p></blockquote>

</figure><figure class="quote" id="q-b0292823f5" data-kw="">

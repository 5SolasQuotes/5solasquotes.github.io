<main class="wrap"><figure class="quote" id="q-abeb6de3c2" data-kw="">
<blockquote><p>Remember this, at least — the things in which the world is now interested are the things that are seen; but the things that are seen are temporal, and the things that are not seen are eternal. You, as ministers of Christ, are called to deal with the unseen things. You are stewards of the mysteries of God. You alone can lead men, by the proclamation of God’s word, out of the crash and jazz and noise and rattle and smoke of this weary age into the green pastures and beside the still waters; you alone, as minsters of reconciliation, can give what the world with all its boasting and pride can never give — the infinite sweetness of the communion of the redeemed soul with the living God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selected Shorter Writings</cite>, (2004), 205.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-90109a807c" data-kw="">
<blockquote><p>After his [Saul’s] death, the crown was set upon David‘s head. Whose constant pious life, and holy devotions (in Hymns, Psalms, and Spiritual Songs) are left, as the best patterns, directions, and encouragements to all posterity. And we are sure enough, that he himself, after his own use of them (to shew the difference betwixt His end, and Saul‘s) was happily assured to be one of the Heavenly Quire above, and there Crowned again with an immortal Crown of Glory. David is an ancient Pattern, a Royal Prophet, and Grand Guide to such, as are willing to fight the Battles of the Lord, in their Pilgrimage towards the true Land of Promise…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-stokes.html">David Stokes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Verus Christianus</cite>, [The True Christian], or, Directions for Private Devotions and Retirements… (Oxford, 1668), ‘A Transition to What Follows in the Appendix’, no page number. Stokes (1591?-1669) was an educated Anglican.</span></figcaption>

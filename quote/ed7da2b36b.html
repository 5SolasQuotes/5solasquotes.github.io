<main class="wrap"><figure class="quote" id="q-ed7da2b36b" data-kw="">
<blockquote><p>Now elders are either such as labor in the Word and doctrine, or else such as are appointed for discipline only…. And many more of our divines, who teach that the apostle 1 Tim. 5:17, directly implies that there were some elders who ruled well, and yet labored not in the Word and doctrine, and those elders he means by them that rule, Rom. 12:8 and by governments, 1 Cor. 12:28, where the apostle says not ‘helps in governements,’ as our new English translation corruptly reads, but ‘helps, governements,’ etc. plainly putting ‘governements’ for a different order from ‘helps’ or deacons… Deacons were instituted by the apostles for collecting, receiving, keeping, and distributing of ecclesiastical goods, which were given and dedicated for the maintenance of ministers, churches, schools, and for the help and relief of the poor, the stranger, the sick and the weak, also for furnishing of such things as are necessary to the ministration of the sacraments. Beside which employments, the Scripture has assigned neither preaching, nor baptizing, nor any other ecclesiastical function to ordinary deacons…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), ch. 8, Digression 1, ‘Of the Vocation of Men of Ecclesiastical Order’, pp. 160-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0bfe2e292d" data-kw="">
<blockquote><p>3. That the Fraternity only, and no women, gave their tacit [understood or implied without being stated] consent to the choosing of Matthias (Acts 1), of the deacons (Acts 6), of the elders (Acts 14:23), since their consciences were concerned and they are parts of the fed and redeemed Church as well as men, can never be proved; and who can deny women to be of the plebs, people and fraternity, as Cyprian speaks? and of the brethren that Paul, James and the apostles wrote unto?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 307</span></figcaption>

</figure><figure class="quote" id="q-15925668ab" data-kw="">
<blockquote><p>And if St. Paul in the choice of the widow to attend upon the sick of the church, which was the lowest office in the church, requires not only such a one as is at the time of the choice honest and holy, but such a one as has led her whole life in all good works and with commendation, how much more is that to be observed in the minister or bishop of the church…</p></blockquote>

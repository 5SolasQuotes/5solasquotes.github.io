<main class="wrap"><figure class="quote" id="q-44c82e3ab4" data-kw="">
<blockquote><p>First, then, we shall take into consideration the bounds of the power of particular [local] elderships, and how the same may be said to be independent, and how not… The first distinction is, between things which are proper and peculiar to one congregation, and things which are common to many: the former pertains to the particular eldership, the latter to the common eldership. Whence it comes that, in Scotland, the cases of ordination, suspension, deposition and excommunication, are determined in the greater presbyteries, because it does not concern one congregation alone, but many, who be taken into the common presbytery, and who be put out of the same; neither does the excommunication of a sinner concern only one congregation, but the neighboring congregations also, among whom, as it is to be commonly supposed, the sinner does often haunt and converse. Cyprian [A.D. 200-258], speaking of the admission of some who had fallen, and who had no recommendation from the martyrs [witnesses] to be received again, refers the matter to a common meeting, and his reason is, because it was a common cause, ‘and did not concern a few, nor one church only,’ see Book 2, Epistle 14.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, p. 43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5aea7a6f3c" data-kw="">
<blockquote><p>That no minister shall, upon any occasion, testify from the pulpit against any act of Assembly, be it never so sinful; or against any of the proceedings of the judicatories, be they never so unwarrantable.” (See 1st Testimony, p. 82) For there was far more ground to make their inference from the act of Assembly 1638, than from the act of Assembly 1733; and so all our worthy ancestors from that day, and the Brethren themselves, according to their argument, have been living in a Church in which there was a very sinful term of communion required of them; and yet they never complained of it, nor have they given the least testimony against it. But further, the above Act 1733, relating to these Brethren, being materially rescinded, as was shown above, this objection, even as to them, falls to the ground. But then, as to the second alleged sinful term of communion, viz. “That no minister, or member of this Church shall protest against acts, sentences or decisions of the supreme judicatory, etc.</p></blockquote>

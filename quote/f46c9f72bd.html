<main class="wrap"><figure class="quote" id="q-f46c9f72bd" data-kw="">
<blockquote><p>The doctrine of absolute election and reprobation infers that God had not an absolute will by those means of grace which He bestowed upon the non-elect angels or men to bring them unto glory; and that He had an absolute will to permit themselves to abuse them to the procuring of their own eternal misery: And yet he that should say that God by giving the non-elect angels such excellent endowments, or by giving Cain and Judas such fatherly admonitions, did in those means aim at their destruction, speaks both ignorantly and profanely. For the aim of God and the end of any good gift which He vouchsafes unto men, is to be measured by the nature of the gift itself and not by the perverse use which God suffers the receivers to make of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Animadversions upon a Treatise entitled, God’s Love to Mankind... (Cambridge: Daniel, 1641), ‘Answer: Whether the decree of absolute Reprobation is contrary unto the use and end of God’s gifts bestowed upon men,’</cite>, p. 396</span></figcaption>

<blockquote><p>On the Universality of the Gospel Offer”, a sermon on Luke 2:14, in Sermons, vol. 4 of Select Works of Thomas Chalmers, 1845, Edinburgh, pp. 411-14, this quote was compiled by Rev. Sherman Isbell It is the desire of God after you — it is His compassionate longing to have back again to Himself those sinful creatures who had wandered away from Him — it is His fatherly earnestness to recall His strayed children — it is this, which, by moving and subduing the will of man, exemplifies the assertion of the apostle when he says — “Know ye not that the goodness of God leadeth to repentance?” [Rom. 2:4] Institutes of Theology, vol. 2, On the Extent of the Remedy, p. 409-412, 1849, Edinburgh, this quote was compiled by Tony Byrne God waiting to be gracious—God not willing that any should perish, but that all should come to repentance [2 Pet. 3:9]—God swearing by Himself that He has no pleasure in the death of a sinner, but rather that all should come unto Him and live [Eze. 32:11]—God beseeching men to enter into reconciliation [2 Cor. 5:20], and this not as elect, but simply and generally as men and sinners;—these are the attitudes in which the Father of the human family sets Himself forth unto the world—these the terms in which He speaks to us from heaven. . . Gardiner Spring 1848 The Power of the Pulpit, 1848, reprinted 1986 by Banner of Truth, p. 49 The earliest communications to men were not made by written documents, nor by the press. Our first parents [Adam and Eve] were not, as some have supposed, the rude children of nature, nor were they untaught. It was the paternal voice of God that fell with such impressiveness upon their listening and obedient ear, before their apostasy. It was also through this channel that the subtle Deceiver conveyed his poison; the snare was laid by whispering his word of promise to the ear. . . Archibald Alexander †1851 ‘Privileges of the Sons of God’, Sermon 11 in Evangelical Truth, p. 151-2 To be descended from kings and nobles is an honor held in high estimation in the world; but when men are unworthy of their distinguished ancestors, they rather cast a reproach upon them, than inherit any real honor from them. The Jews prided themselves on being descended from Abraham, the friend of God, and the father of the faithful; and many of them rested in their connection with a pious ancestry, as the ground of their acceptance; but Christ makes a distinction between a natural and spiritual descent. He denies that the Jews, who rejected him, were the children of Abraham; because the works of Abraham they did not do. And John the Baptist, told them not to think within themselves that they had Abraham to their father, for God was able of the stones to raise up children to Abraham. Paul also draws a distinct line of division between those who were merely Jews by natural descent and outward privileges and those who were Israelites in heart. (Rom. 2:28,29) God has one only-begotten Son, generated from his own essence, without being separated from it. The angels also are called “the sons of God,” because God is their Father and Creator, and because they bear the image of God. Adam is called “the son of God,” because he proceeded immediately from the hand of God, and had no other Father. But believers are the sons of God in virtue of their union to Christ. . . J.A. Alexander 1857, was Princeton Seminary professor Commentary on Matthew, 1861, reprinted James Family Christian Publishers Matt 6:9, p. 172 ‘Our Father, the (one) in the heavens’ A description repeatedly employed by Christ before in this discourse, and now put into the mouths of his disciples, as an explicit recognition of their filial relation to God, not only as their maker and their providential benefactor, but as the Father of our Lord Himself, through whom they are adopted into a more intimate and spiritual sonship, which is here by implication represented as their only warrant for approaching Him. Matt 6:26, p. 186 ‘Your heavenly Father’ Is not a mere periphrasis for God, but suggestive of an almost infinite disparity between the cases. Instead of saying, ‘their heavenly father feedeth them’, which in a lower sense, would be correct, He says, ‘your heavenly father’, intimating that the God who thus provides for the inferior animals, is bound by a peculiar fatherly relation to provide for man, and still more for those men who, as his Son’s disciples, are his children in the most intimate and strictest sense. . A Commentary on the Acts of the Apostles, Banner of Truth, 2003 Acts 17:28 – “For in him we live, and move, and have our being; as certain also of your own poets have said, For we are also his offspring.</p></blockquote>

edly+employed+by+Christ+before+in+this+discourse%2C+and+now+put+into+the+mouths+of+his+disciples%2C+as+an+explicit+recognition+of+their+filial+relation+to+God%2C+not+only+as+their+maker+and+their+providential+benefactor%2C+but+as+the+Father+of+our+Lord+Himself%2C+through+whom+they+are+adopted+into+a+more+intimate+and+spiritual+sonship%2C+which+is+here+by+implication+represented+as+their+only+warrant+for+approaching+Him.+Matt+6%3A26%2C+p.+186+%E2%80%98Your+heavenly+Father%E2%80%99+Is+not+a+mere+periphrasis+for+God%2C+but+suggestive+of+an+almost+infinite+disparity+between+the+cases.+Instead+of+saying%2C+%E2%80%98their+heavenly+father+feedeth+them%E2%80%99%2C+which+in+a+lower+sense%2C+would+be+correct%2C+He+says%2C+%E2%80%98your+heavenly+father%E2%80%99%2C+intimating+that+the+God+who+thus+provides+for+the+inferior+animals%2C+is+bound+by+a+peculiar+fatherly+relation+to+provide+for+man%2C+and+still+more+for+those+men+who%2C+as+his+Son%E2%80%99s+disciples%2C+are+his+children+in+the+most+intimate+and+strictest+sense.+.+A+Commentary+on+the+Acts+of+the+Apostles%2C+Banner+of+Truth%2C+2003+Acts+17%3A28+%E2%80%93+%E2%80%9CFor+in+him+we+live%2C+and+move%2C+and+have+our+being%3B+as+certain+also+of+your+own+poets+have+said%2C+For+we+are+also+his+offspring.%E2%80%9D%0A%0A%E2%80%94+Thomas+Chalmers%2C+1847%2C+was+of+the+Free+Church+of+Scotland&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F03da73d89f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/03da73d89f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/quotes-on-the-fatherhood-of-god/#:~:text=On%20the%20Universality%20of%20the%20Gospel,For%20we%20are%20also%20his%20offspring&amp;text=On%20the%20Universality%20of%20the%20Gospel%20Offer%E2%80%9D%2C%20a&amp;text=have%20said%2C%20For%20we%20are%20also%20his%20offspring" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>1. The wicked, God’s adversaries, are in some way his own; and that ownness works patience. The Lord is a piece of a Father to them also. For He is: A common Father by office to all; A special Father by adoption to saints; A singular Father by nature to Christ. A Prince, besides his particular relation to his children, is Pater patriae [a father of fathers], Pater familias [a father of the family], and is good to all, though with a difference: So here. 2. Though Christ has purchased a peculiar people to Himself, to the purpose of salvation, yet others taste of this his goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-harris.html">Robert Harris</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon preached to the honorable House of Commons assembled in Parliament, at a public fast, May 25, 1642 (London: for John Bartlet, 1642)</cite>, p. 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/adoption/fatherhood-of-god.html">Fatherhood of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. The wicked, God’s adversaries, are in some way his own; and that ownness works patience. The Lord is a piece of a Father to them also. For He is: A common Father by office to all; A special Father by adoption to saints; A singular Father by nature to Christ. A Prince, besides his particular relation to his children, is Pater patriae [a father of fathers], Pater familias [a father of the family], and is good to all, though with a difference: So here. 2. Though Christ has purchased a peculiar people to Himself, to the purpose of salvation, yet others taste of this his goodness.”

— Robert Harris, A Sermon preached to the honorable House of Commons assembled in Parliament, at a public fast, May 25, 1642 (London: for John Bartlet, 1642), p. 32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+The+wicked%2C+God%E2%80%99s+adversaries%2C+are+in+some+way+his+own%3B+and+that+ownness+works+patience.+The+Lord+is+a+piece+of+a+Father+to+them+also.+For+He+is%3A+A+common+Father+by+office+to+all%3B+A+special+Father+by+adoption+to+saints%3B+A+singular+Father+by+nature+to+Christ.+A+Prince%2C+besides+his+particular+relation+to+his+children%2C+is+Pater+patriae+%5Ba+father+of+fathers%5D%2C+Pater+familias+%5Ba+father+of+the+family%5D%2C+and+is+good+to+all%2C+though+with+a+difference%3A+So+here.+2.+Though+Christ+has+purchased+a+peculiar+people+to+Himself%2C+to+the+purpose+of+salvation%2C+yet+others+taste+of+this+his+goodness.%E2%80%9D%0A%0A%E2%80%94+Robert+Harris%2C+A+Sermon+preached+to+the+honorable+House+of+Commons+assembled+in+Parliament%2C+at+a+public+fast%2C+May+25%2C+1642+%28London%3A+for+John+Bartlet%2C+1642%29%2C+p.+32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F95ac26add9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/95ac26add9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/quotes-on-the-fatherhood-of-god/#:~:text=1.%20The%20wicked%2C%20God%E2%80%99s%20adversaries%2C%20are,others%20taste%20of%20this%20his%20goodness&amp;text=1.%20The%20wicked%2C%20God%E2%80%99s%20adversaries%2C%20are%20in%20some&amp;text=salvation%2C%20yet%20others%20taste%20of%20this%20his%20goodness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Doctrine 2. This providence of God extends itself to all things. This is clear in the text [Rom. 11:36]. Reason 1. It is as much extended to all in the world as a good and wise master of a family hath a care (as much as in him lieth) of all things that are done in his house. Reason 2. It is extended to every thing that was created of God. For in the same manner providence follows upon creation, as the apostle teacheth that provision doth upon procreation, and seeing to children and others in the family, 1 Tim. 5:8. For God in some sort is called the Father of all things that He created.</p></blockquote>

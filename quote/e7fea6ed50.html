<main class="wrap"><figure class="quote" id="q-e7fea6ed50" data-kw="">
<blockquote><p>The mode of giving supernatural grace to nature is, Junius stated, infusion, a term that is strikingly redolent of Aquinas’s conception of the mode of communicating grace.” (Seung J. Lee, Orders of Nature &amp; Grace, p. 60) Gale: “That supernatural good and virtue comes from God by divine infusion is generally asserted and demonstrated by the sectators of Augustin and Aquinas.” (4.496) . No Proper Habitual vs. Actual Grace Distinction On Maresius and Thomas: “Supernatural habits, by contrast [with natural habits], are stirred into action by the Holy Spirit, who dwells in the recipients of habitual grace (Maresius 1646-48, 2:143). Maresius disagrees with some Roman Catholic theologians, who suggest that people imbued with habitual grace require an additional gift of ‘actual grace’ before habitual grace bears fruit. For Maresius, the Spirit’s powerful presence is quite sufficient. As a result, Maresius is suspicious of the distinction between habitual and actual grace—a distinction, he notes, which is not found in Aquinas. That said, if by ‘actual grace’ is meant simply the Spirit’s activity in exciting supernatural habits into action, Maresius does not object, although he prefers the term ‘moving grace’ (Maresius 1646-48, 2:144). And since the Holy Spirit dwells with believers permanently, he argues that moving grace is also permanently present as to the principle of its motion, even if it is not permanently active.” (Stephen Hampton in Oxford Handbook of Early Modern Theology, p. 236) . Deification Thomas: “Now the gift of grace surpasses every capability of created nature, since it is nothing short of a partaking of the Divine Nature, which exceeds every other nature. And thus it is impossible that any creature should cause grace. For it is as necessary that God alone should deify [deificet], bestowing a partaking of the Divine Nature by a participated likeness, as it is impossible that anything save fire should enkindle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Where Reformed Orthodox Writers Agreed &amp; Disagreed with Aquinas</cite>, Supernatural Grace: by Infusion</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb2eaf7123" data-kw="">
<blockquote><p>When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism</cite>, ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“When we demand the use of reason and logic, we no more turn them into the foundations, principles, and rules of faith than we do our eyes, ears, and tongues without which we can neither learn nor teach our religion, nor defend it against opponents. For us they are, therefore, means and requirements without which there is no faith or theological knowledge, but they are certainly not principles, norms, rules, and foundations.”

— Gisbertus Voetius, Appendix 2, ‘The Use of Reason In Matters of Faith’ in Introduction to Reformed Scholasticism ed. Joel R. Beeke &amp; Jay T. Collier, trans. Albert Gootjes (Reformation Heritage Books, 2011), p. 12">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+we+demand+the+use+of+reason+and+logic%2C+we+no+more+turn+them+into+the+foundations%2C+principles%2C+and+rules+of+faith+than+we+do+our+eyes%2C+ears%2C+and+tongues+without+which+we+can+neither+learn+nor+teach+our+religion%2C+nor+defend+it+against+opponents.+For+us+they+are%2C+therefore%2C+means+and+requirements+without+which+there+is+no+faith+or+theological+knowledge%2C+but+they+are+certainly+not+principles%2C+norms%2C+rules%2C+and+foundations.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Appendix+2%2C+%E2%80%98The+Use+of+Reason+In+Matters+of+Faith%E2%80%99+in+Introduction+to+Reformed+Scholasticism+ed.+Joel+R.+Beeke+%26+Jay+T.+Collier%2C+trans.+Albert+Gootjes+%28Reformation+Heritage+Books%2C+2011%29%2C+p.+12&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb2eaf7123.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb2eaf7123.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-use-of-reason-in-theology/#:~:text=When%20we%20demand%20the%20use%20of,not%20principles%2C%20norms%2C%20rules%2C%20and%20foundations&amp;text=When%20we%20demand%20the%20use%20of%20reason%20and&amp;text=are%20certainly%20not%20principles%2C%20norms%2C%20rules%2C%20and%20foundations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-220aa72596" data-kw="">
<blockquote><p>2 …but the metaphysician proves the principles of the inferior sciences in as much as if those principles are obstinately denied by anyone, he explains their terms, which having been declared and perceived by the adversary, he cannot but assent to the truth of the proposed principles, unless he be completely stripped of reason in the manner of a brute. For nothing conduces more to the confirmation of principles than the perception of the same: and nothing more helps the intellect, that it perceive principles than the understanding of the terms from which the principles are composed. Furthermore, he proves those principles a posteriori [from those things that follow], and indeed by leading the adversary through the impossible, in as much as unless he acknowledge the truth of the principles it will be necessary for him to have acknowledged the greatest absurdity resulting from the denied principles. Thus to one denying that the whole is greater than its part, it will be explained what part, what whole. If he be not yet sufficiently moved, it will be inferred from that negation, the acception of the terms having been presupposed according to the explained way, that the whole would not be whole, nor would the part be part; and thus the same would be and not be at the same time. Which, as most absurd, will not be to be admitted. 5. …All principles, of whatever genus they be, can be called first; and in what way first, in that way also they are indemonstrable. They are therefore first in as much as they do not recognize others through which they are demonstrated a priori [from things prior]. Then they are first in as much as in that science of which they are principles, they do not recognize others prior to themselves through which they are demonstrated. But what principles in their science are first can still in the order of another science be posterior and thus demonstrable, at least a posteriori, if not also a priori.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-voet.html">Paul Voet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>First Philosophy Reformed</cite>, tr. by AI by Onku (Utrecht: Johann Waesberg, 1657), ch. 2, sect. 2</span></figcaption>

<blockquote><p>I subscribe to that of Clement of Alexandrinia: We ought not to swear allegiance to any sect of philosophers, whether Stoics, Epicures, Platonists, or Peripatetics, but we must select and embrace whatsoever is true and faithfully delivered concerning God by any sect; and the Truth selected out of all sects is not vain philosophy, but Natural Divinity.</p></blockquote>

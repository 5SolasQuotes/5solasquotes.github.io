<main class="wrap"><figure class="quote" id="q-181a41f7a4" data-kw="">
<blockquote><p>The design of Christ was not like Mahomet’s, to get himself an earthly kingdom and numerous followers merely to cry up his name: and therefore He will not indulge men in their sin, nor abate or alter the conditions of his Covenant to win disciples: He will have his ministers deal plainly with all to whom they preach, and let them know that without self-denial and forsaking all (in estimation and resolution) and a willing exchange of earth for heaven, they cannot be his true disciples: Nor without a professed consent to thus much, they cannot be his visible professed disciples. But all that will not repent must perish. And therefore in their baptism they must profess a renunciation of all competitors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1, Direction 13</cite>, p. 106</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d76ea58305" data-kw="">
<blockquote><p>…let us note that God will have every of us nowadays for his own part to do his endeavor to multiply the church… And when God vouchsafeth us his grace to win any man, and to bring him into his flock, then are we as spiritual fathers… Now albeit that all have not that office of preaching the Word of God, yet a private person being a member of the Church, may beget spiritual children unto God, if he have occasion and ability to win a poor soul and to enlighten him with the faith of the gospel. Let us then bestow our pains to this end, knowing that if the carnal marriage was so precious under the law in the sight of God: Surely the mean whereby we be made members of our Lord Jesus Christ, is a thing now far dearer and of greater estimation with Him. And therefore let every man employ himself that way to the uttermost of his poor. For here is no forcing of us to marry against our wills, but of the winning of wives unto our Lord Jesus Christ, that by the multiplying of the Church, we may always be the more firmly linked unto Him. Seeing then that our condition is more gentle and sweet than that which was under the law, we ought to be stirred up so much the more to the discharging of that duty, and we shall have so much the less excuse if we be careless and negligent therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sermons… upon… Deuteronomy... (London: Middleton, 1583), 143rd Sermon</cite>, p. 883</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>

%20and%20negligent%20therein." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2954cf3d83" data-kw="">
<blockquote><p>Christ preached the Gospel to those that He knew sinned against the Holy Ghost, to the Pharisees who persecuted Christ to death and others, Mt. 12:31-34; Jn. 15:22-25; Jn. 7:28-29; Jn. 12:35-38; Jn. 10:31-32; Jn. 11:47-48… the word is a converting ordinance out of question, and preached to heathen and to the non-converted, though they refuse to embrace and believe the Gospel, and refuse to entertain the preachers of it: as is clear, Acts 19:22-25; Tit. 1:10-13; 2 Tim. 3:25-27. The texts that Master Prynne alledges, that the Gospel should not be preached to heathen who refuse to embrace and believe the Gospel, to wit, Mt. 10:14-15; Lk. 9:5; Acts 13:46, are to no purpose, for Mt. 10; Lk. 9, is but a temporary commandment, given for a time, that the disciples should depart from those houses of Judea (there is nothing of the heathen; but by the contrary the apostles are forbidden to go to Samaritans or gentiles at all, Mt. 10:5-6 [which was unique to those circumstances]) who would not receive the peace of God in the Gospel, which precept the apostles in the story of the Acts did not observe, but preached the Gospel to many heathen who refused to embrace and believe the Gospel: As Acts 16 and 17, and 19:2. The place Acts 13:15 is meant of the blaspheming Jews, to whom Paul preached long after they persecuted and stoned the prophets, and had killed the Lord of life, Acts▪2 and 4, and 8, and 9; Mt. 23:37-38. 3. Those places, are to better color of purpose brought by Arminians and Socinians to prove that the Gospel is preached to people for their good entertainment thereof, and denied to others for their unworthiness, and because they will not welcome it; So the Arminians in the conference at Hague, pp. 87-89, God sends the Gospel not according to his absolute will, sed ob alias causas in homine latent•s, for secret causes in man. Arminius, Against Perkins, p. 199, ‘The will of God in sending the Gospel has causes in the will of man according to that,’ habenti dabitur: So Corvinus, Ad Wallachros, p. 44. Socinus, Commentary on 1 Jn. 4, p. 307 says the same: and Mr. Prynne is pleased in the same sense to cite them, I conceive imprudently, for I believe that Reverend and learned man does hate those impious sects, the enemies of the grace of God; but truly if this be a rule to pastors to spread the Gospel, that they are to offer and give the pearl of the preached Gospel to those that willingly receive it and harbour the preachers, and presently to depart and preach no more the Word of the Kingdom to those who refuse it, as the places Mt. 10:14 and Lk. 9:5 carry that sense, because they are heathens who refuse to embrace and believe the Gospel, and harbor the preachers, as (the worthy divine says) conceiving that to be a casting of pearls to dogs and swine; I see not how the preachers and spreaders of the Gospel to the heathen are to believe that God out of mere grace and the good pleasure of his will, without respect to good or bad deserving, sends the Gospel to some and denies it to others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government (London, 1646), ch. 23</cite>, pp. 516-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/evangelism.html">Evangelism</a></span></div>

ns+in+the+conference+at+Hague%2C+pp.+87-89%2C+God+sends+the+Gospel+not+according+to+his+absolute+will%2C+sed+ob+alias+causas+in+homine+latent%E2%80%A2s%2C+for+secret+causes+in+man.+Arminius%2C+Against+Perkins%2C+p.+199%2C+%E2%80%98The+will+of+God+in+sending+the+Gospel+has+causes+in+the+will+of+man+according+to+that%2C%E2%80%99+habenti+dabitur%3A+So+Corvinus%2C+Ad+Wallachros%2C+p.+44.+Socinus%2C+Commentary+on+1+Jn.+4%2C+p.+307+says+the+same%3A+and+Mr.+Prynne+is+pleased+in+the+same+sense+to+cite+them%2C+I+conceive+imprudently%2C+for+I+believe+that+Reverend+and+learned+man+does+hate+those+impious+sects%2C+the+enemies+of+the+grace+of+God%3B+but+truly+if+this+be+a+rule+to+pastors+to+spread+the+Gospel%2C+that+they+are+to+offer+and+give+the+pearl+of+the+preached+Gospel+to+those+that+willingly+receive+it+and+harbour+the+preachers%2C+and+presently+to+depart+and+preach+no+more+the+Word+of+the+Kingdom+to+those+who+refuse+it%2C+as+the+places+Mt.+10%3A14+and+Lk.+9%3A5+carry+that+sense%2C+because+they+are+heathens+who+refuse+to+embrace+and+believe+the+Gospel%2C+and+harbor+the+preachers%2C+as+%28the+worthy+divine+says%29+conceiving+that+to+be+a+casting+of+pearls+to+dogs+and+swine%3B+I+see+not+how+the+preachers+and+spreaders+of+the+Gospel+to+the+heathen+are+to+believe+that+God+out+of+mere+grace+and+the+good+pleasure+of+his+will%2C+without+respect+to+good+or+bad+deserving%2C+sends+the+Gospel+to+some+and+denies+it+to+others.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government+%28London%2C+1646%29%2C+ch.+23%2C+pp.+516-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2954cf3d83.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2954cf3d83.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/evangelism#:~:text=Christ%20preached%20the%20Gospel%20to%20those,some%20and%20denies%20it%20to%20others." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-11880a3a39" data-kw="">
<blockquote><p>Thirdly, the Reformed Churches may send pastors to the Indians, for that which Acosta says of Jesuits we may with better reason say it of ourselves: That pastors are as soldiers, and some soldiers are to keep order and remain in a certain place; others run up and down in all places; So some are affixed to a congregation, to feed them; others may be sent to those people who have not heard of the Gospel, which sending is ordinary and lawful in respect of pastors sending and the pastors who are sent, because in pastors, even after the apostles be dead, there remains a general pastoral care for all the Churches of Christ. Thus sending is not ordinary, but extraordinary in respect of those to whom the pastors are sent; yet is it a pastoral sending [as opposed to this being absent in congregationalism in such a case].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (London: 1644), pt. 2</cite>, p. 204</span></figcaption>

<blockquote><p>Answer. First, we hold that by a calling or ordination he is made a pastor; by election he is restricted to be ordinarily the pastor of his flock. Secondly, a pastor is a pastor of the catholic Church, but he is not a catholic pastor of the catholic Church, as were the apostles. Thirdly, the Reformed Churches may send pastors to the Indians, for that which Acosta says of Jesuits, we may with better reason say it of our selves: That pastors are as soldiers, and some soldiers are to keep order and remain in a certain place; others run up and down in all places; So some are affixed to a congregation, to feed them; others may be sent to those people who have not heard of the Gospel, which sending is ordinary and lawful in respect of pastors sending and the pastors who are sent, because in pastors, even after the apostles be dead, there remains a general pastoral care for all the Churches of Christ. Thus sending is not ordinary, but extraordinary in respect of those to whom the pastors are sent; yet is it a pastoral sending [as opposed to this being absent in congregationalism in such a case]. …but a pastoral care for the Churches is not proper to apostles only, but only such a pastoral care by special direction from Christ immediately to preach to all, 2. Backed with the gift of tongues and of miracles; and this essentially differences the apostle from the ordinary pastor; but the former pastoral care to preach the Gospel to all nations, and to convert, is common both to the apostle and pastor.</p></blockquote>

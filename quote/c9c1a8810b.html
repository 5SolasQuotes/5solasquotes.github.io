<blockquote><p>Pt. 2, ‘Of Idolatry’ §2. ‘Of Idolatry in General’ Idolatry is a species of superstition, being an excess in the object of worship. It is the giving of worship that is proper to God to that which is not God… . Pt. 3, ‘Of Superstition Less than Idolatry’ §1. ‘Of Excess in the Quantity or Measure of Religious Observances’ All superstition is an excess in religion… this excess is either in the measure or in the kind when the rule of religion is transgressed in either of these ways; and in some instances there may be an excess in both… . §2. ‘Of Excess in Religious Observances, for the Kind Thereof’ …Some kinds of religious worship may not be vicious in their nature, nor contrary to God’s holiness to command or allow, yet may be forbidden by the general precept of Scripture or other supernatural revelation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship… in The Remains of the Reverend &amp; Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684) Corbet (d. 1680) was a congregationalist puritan.</span></figcaption>

<blockquote><p>9. Whether any constitutions may be tolerated in the church which in their nature indeed are not impious, but do not, nevertheless, tend to edification? I answer that if those constitutions which the queen’s majesty wishes to impose upon you are free from any impiety, they are rather to be tolerated than that the churches should be deserted. For if the edifying of the church is the chief thing to be regarded in this matter, we shall do the church a greater injury by deserting it than by wearing the habits [garments]. And where there is no impiety, and the conscience is not wounded, it is proper to submit, even if some degree of bondage be imposed. In the meantime, however, it might be demanded on the other hand, whether the imposition of the habits, as far as it tends to decency and order, may justly come under the denomination of bondage? … 11, 12. The last two questions come more closely to the point. Whether it is more expedient thus to obey the church, or on account of disobedience to be cast out of the ministry? And, whether good pastors may lawfully be removed from the ministry on account of their non-compliance with such ceremonies? I answer, if in these ceremonies there is no superstition, no impiety, but yet they are imposed upon godly pastors, who would rather that they should not be imposed upon them, I will certainly allow, and that most fully, that a burden and bondage is imposed upon them; but I will not allow, and this for most just reasons, that their station or ministry is on that account to be deserted and place given to wolves, as was before observed, or to ministers less qualified than themselves: especially, since there remains the liberty of preaching, and care may be taken that no greater bondage shall be imposed; with many other things of this kind, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Zurich Letters</cite>, … ed. Hastings Robinson for the Parker Society, 2nd ed. (Cambridge Univ. Press, 1846), Letter 104, Bullinger to L. Humphrey &amp; T. Sampson (1566), pp. 222-23</span></figcaption>

<blockquote><p>42nd Question, How Moses was contented with Aaron’s Answer.

1. He did not absolutely approve of his reason, as though he had done it intuita divino, by divine direction, as Cajetan: for Moses was better acquainted with God’s mind than Aaron, and there was a direct commandment, which should not have been omitted.

2. But Moses rather in human commiseration bears with Aaron’s infirmity: 1. because he saw him forced by a kind of necessity… 2. and afflication was not to be added to affliction, Osiander: and Moses found it to be of less fault than he supposed, Calvin: he did it not willingly, but of human frailty and of perplexity through grief, and therefore was to be pitied.

3. And it may be Moses deferred his further admonishing of Aaron till another time because he saw now he was in grief…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Leviticum, that is, A Sixfold Commentary upon the Third Book of Moses, called Leviticus</cite>, … (London, 1631), on Lev. 10, pp. 197-98</span></figcaption>

<blockquote><p>Discipline and all branches of it are compared to a spiritual rod, 1 Cor. 4:21. The Lord’s Supper is compared to spiritual food or bread; Now it is unlikely that a rod should be a necessary antecedent to food or bread, that is, that children be kept without bread until a rod be provided to whip the dogs and swine… So the commandment for the celebration of the Lord’s Supper is more clear, express, and evident than that for the exercise of discipline.</p></blockquote>

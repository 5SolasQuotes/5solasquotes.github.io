<main class="wrap"><figure class="quote" id="q-7ed22f2a08" data-kw="">
<blockquote><p>For Jeremiah, from the Lord, expressly forbade to fight against Nebuchadnezzar; show us the like for not defending ourselves against bloody papists and Irish cut-throats; for that example may as well prove (if it be a binding law to us) that our king should not raise his subjects to fight against a Spanish armada and a foreign prince; for before ever Nebuchadnezzar subdued the kingdom of Judah (Jer. 27:1) in the beginning of the reign of Jehoiakim (Jer. 36-37) the king of Judah is from the Lord commanded not to draw a sword against the king of Babylon. I hope this will not tie us and our king not to fight against foreign princes or against the great Turk, if they shall unjustly invade us and our king; and this example is against the king’s resisting of a foreign prince unjustly invading him as much as against us, for Nebuchadnezzar was a tyrannous invader and the king of Judah, the Lord’s anointed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 180</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9cb473f394" data-kw="">
<blockquote><p>…especially seeing his Majesty shall ever find that he has none more loyal and true subjects, who will more gladly employ and bestow their lives, lands, houses, holds, goods, gear, rents, revenues, places, privileges, means, moities and all, in his Highness’s service and mantainance of his royal crown; and moreover, have so deeply conceived a strong and full persuasion of his Majesty’s princely virtues, and much renowned propension to piety, and equity, that they will urge their consciences, by all good and lawful means, to assent unto every thing which he enjoins, as right and convenient; and when the just aversation [aversion] of conscience upon evident reasons is invincible, will notwithstanding be more willing to all other duties of subjection, and more averse from the least show of contempt.</p></blockquote>

</figure><figure class="quote" id="q-a02729a0cf" data-kw="">
<blockquote><p>If princes do right and keep promise with you, then do you owe to them all humble obedience: if not, ye are discharged, and your study ought to be in this case how ye may depose and punish according to the law such rebels against God and oppressors of their country.</p></blockquote>

</figure><figure class="quote" id="q-979a89d6ab" data-kw="">
<blockquote><p>…and I declare before God and the world that it was far from the intention of those that contrived it [the SL&amp;C], to wrong the King and his posterity… and the foresaid supplication doth manifestly declare their intent being only to have settled a conformity in Kirk government throughout all his Majesty’s dominions… I do further declare before God and the World that they [the English] are guilty of the breach of the Sacred Covenant, and that we have discharged our duty thereof (which is only promissory &amp; conditional as all oaths de futuro [of the future] are) by endeavoring to effectuate it quantum in nobis erat [insofar as we are in it], and that we are absolved in foro poli &amp; soli [in the sight of the city and self] of any oath or vow contained therein, insofar as concerns the settling of religion in the Kirk of England and Ireland, and that we are only bound thereby to preserve the Reformation of Religion in our own Kirk and Kingdom [of Scotland]… Therefore I exhort and conjure you, again and again, in the bowels of our Lord Christ, and words of a dying man, especially my brethren of the ministry… to stand fast and firm to this point of your Covenant, which you were bound to before by the Law of God and of this Land [of Scotland], and never suffer your selves by all the gilded allurement of this world, which will prove bitter and deceitful at last, to relinquish it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Declaration of Mr. Alexander Henderson</cite>, … Made upon his Death-Bed (London, 1648), pp. 8-10</span></figcaption>

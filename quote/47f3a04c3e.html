<main class="wrap"><figure class="quote" id="q-47f3a04c3e" data-kw="">
<blockquote><p>However, the law does not condemn homicide of every kind. For the magistrate is bound to punish the guilty, and every private person has the right to kill an unjust aggressor and robber for the sake of preserving life (a moderate use being made of the lawful right of protection); only homicide committed by a private person unjustly and without authority is condemned.

Moses’ act cannot be considered a homicide against the law because God had approved of it by a dispensation (Ex. 2:12). Moses was a public person, having already an internal call. The same may be said of Phineas, who was furnished with public authority and had an internal, if not an external, call to do it. …

Christ does not [in Matthew 5:39, 40] change the implanted law of nature, which teaches us to repel injury and force by force. Rather he only condemns retaliation (to antipeponthos) when to the defence of one’s self is added revenge and an equal or greater injury.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.2.23, 24.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-11d9553f78" data-kw="">
<blockquote><p>Christ clearly asserts that He did not come ’to abolish the Law’ (Matt. 5:17). Therefore He approves the laws of Moses.” We respond. Christ is speaking about the moral Law, which was not given temporarily but is the eternal wisdom and norm of righteousness in God. Christ did not abolish this but fulfilled it perfectly, and even renews believers for its obedience by giving them His righteousness and Holy Spirit. Furthermore, the circumstances of the text show clearly that Christ is talking here about the moral Law. As far as the forensic laws of Moses are concerned, the apostle asserts (Eph. 2:15) that “Christ voided (καταργήσας) the law of commandments and ordinances,” not to mention the fact that in the same passage (v. 31) Christ disapproves of the certificate of divorce even though the law of Moses allowed it (Matt. 19:8).

Note here that some forensic laws had reference to a part of the ceremonial law and depended on it. For example, whoever had committed an accidental homicide was compelled to keep himself within a city of refuge until the death of the high priest. But because the Levitical priesthood was abrogated through the coming of the Messiah, who is the one and only high priest of the New Testament, it turns out that that forensic law was also abrogated. As a result, the words of Christ cannot refer to the forensic law of Moses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Commonplaces: On the Law of God, on the Ceremonial and Forensic Laws</cite>, trans. Richard J. Dinda, ed. Benjamin T. G. Mayes and Joshua J. Hayes (1613; St Louis MO: Concordia Publishing House, 2015), XVI.3.4. § 41.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>32. They [presbyterians] hold (I believe with warrant of God’s Word) if the king refuse to reform religion, the inferior judges, and assembly of godly pastors and other church-officers may reform; if the king will not kiss the Son, and do his duty in purging the House of the Lord, may not Elijah and the people do their duty and cast out Baal’s priests [1 Kings 18:19-24, 30, 37-40]. Reformation of religion is a personal act that belongs to all, even to any one private person according to his place.

33. They may swear a covenant without the king, if he refuse, and build the Lord’s house (2 Chron. 15:9) themselves, and relieve and defend one another when they are oppressed. For my acts and duties of defending myself and the oppressed do not tie my conscience conditionally, so the king consent, but absolutely, as all duties of the law of nature do (Jer. 22:3; Prov. 24:11; Isa. 58:6; 1:17).

34. The Popish Prelate [John Maxwell] condemns our reformation because it was done against the will of our popish queen. This shows what estimation he has of popery and how he abhors protestant religion.</p></blockquote>

<blockquote><p>XIII. The glory of God, the good of souls, the happiness of Christian societies, are irresistible motives to quicken the magistrate to act (against such dangerous persons as we have described according to the law of judgement, and their different demerits) in Faith and Love:

      1. In Faith; for the Christian magistrate does not act like himself, if he does not perform acts of civil-justice in faith. And it is clear that if there be no moral equity in any of the judicial laws in the Old Testament (and there are none at all extant in the New) [then] the Christian magistrate cannot perform any act of Civil-justice in faith. But it is indeed too evident to be denied that all divine laws which concern the punishment of moral transgressions are of perpetual obligation, and therefore still remain in force according to their substance and general equity, abstracted from special circumstances, typical accessories and the old forms of Mosaical polity, for:

      1. These divine laws are not expired in their own nature.

      2. They are not repealed by God.

      3. The authority of the Lawgiver is the same under both administrations, old and new; the consciences of Christians as well as Jews are subject to his sovereign and perpetual jurisdiction.

      4. The matter of the laws is moral, and very agreeable to the dictates of nature, as does appear by the several laws and decrees of heathens: Dan. 3:29; Ezra. 7:23,25-27; Ezra 10:3,5,8 compared with Num. 15:30-31; Lev. 24:15-16; Deut. 13:8-9; Zech. 13:3,6. Seducing, poisoning, slaying of souls is by the law of Nature and Nations the worst of injuries.

      5. The reason of these divine laws is immutable, and that reason is sometimes expressed and declared: But it is not necessary that there should be any express ratification of every moral law in the New Testament which is plainly delivered in the Old.

      6. These divine laws are independent on the will of man, and therefore indispensable man’s authority.</p></blockquote>

<blockquote><p>What say you of that part, [Quest.] which is Typical and Ceremonial?

Though they cease and be abolished as to our practice, [Answ.] yet they are perpetual, and still a part of holy scripture, as for our teaching and learning, The Types and figures of the Law are a kind of Prophesies, for they do in certain Actions set forth Christ to come, and the benefits by him; as the Prophets did by their words and writings, they still teach and instruct, and we may fetch Arguments of faith and duty from them, as Paul doth in the Epistle to the Hebrews, and other places (as for example) if the Question be between us and the Socinians, whether Christ by dying did make Atonement for sin. We say, yea, and the Law and the daily Burnt offerings and sin offerings doe teach the same: if ye ask of the manner how? Answer, it is by sprinkling the sinner, (that is) by applying it to our own souls.

If the question be about Ministers and their maintenance, in the New Testament the Apostle proves it to be the peoples duty from the Law. 1 Cor. 9.7. Who goes a warfare at his own Charge? That’s Paul’s Argument; Ministers must be paid as well as soldiers, and he fortifies his reason by Testimony of old Testament ver. 8. Say I these things as a man? Or saith not the Law the same? For it is written in the Law of Moses, Thou shalt not muzzle the mouth of the Ox, that treadeth out the Corn; The same proof he uses upon another occasion. 1 Tim. 5.17.18.

But Paul’s proof is faulty, because it is a Ceremonial proof, [Obj.] and so denies Christ to be come in the flesh.

God intended in that Law, to teach us something, [Answ.] that is moral, (namely) that God doth take care for Ministers, and for his Labourers in his word, more than for Oxen; and if that Law be written for our sakes; then why may not other things written in the Ceremonial Law, teach a moral duty, as well as that? The Ceremonial law, as it doth set forth Christ, so also the duty of Christians in their holy administrations: Thus the Purging out of Leaven, did teach the putting away of filthy affections from our holy services, and polluted people from the society of the Church, 1 Cor. 5.7.13. So the sprinkling of the unclean, doth teach, that when we present any service to the Lord, we must renew our repentance, and not come with defiled hearts or hands, 1 Tim. 2.8. By the consecrating of the first fruits we are taught, that we ought to be consecrated as holy unto the Lord, as a kind of first fruits of his creatures, Jam. 1.18. Rev. 14.4.

We are not subject to those Ordinances to do them, we offer not the sacrifices, because Christ is come; yet look what they signify, they teach, and they serve for our learning, as is said.

But there is Heb. 7.18. [Obj.] A disannulling of the Commandment for the weakness and unprofitableness of it.

The meaning is this, [Answ. 1] that the blood of those sacrifices did not take away sin by any power or virtue, that was in them; they of themselves are weak and beggarly, if any body should rest in them, as the Carnal Jews did; and therefore, he says, those Ordinances were to cease, and give place, when the true Sacrifice, Jesus Christ was offered; which alone did and could take away sin; The law made nothing perfect, but in their relative use and end, they did lead unto Christ, that better hope, who made all perfect; For his blood served for the redemption of sins and transgressions, which were committed under the first Testament. So that the way of Salvation taught then in Types, and now without them; the substance of the Covenant is one and the same, only that former manner of Administering waxeth old, and is put into a new way, which is significantly expressed, Heb. 7.12.

There is … not an abolishing of the substance of the Covenant, but a Transposition of it into another way; As a Tenant, that holds by Copy, if he obtain to hold in Fee, the latter grant doth indeed actually null the former Tenure, yet not the former Benefit, his Tenure is mended, being changed into Fee simple: So the coming of the New Testament doth better our Tenure, but alters not the Promises, Commands, Counsels in the Old. For as the substance of the Priesthood was not to end, as having no more a being on the Earth, but only translated upon other persons. I will take of the Gentiles for Priests and Levites: So the matter of the Covenant was not destroyed, and taken quite away, but only changed into another Form, other Sacraments, and yet the same; other for the Sign, the same for Substance, the same spiritual meat and drink, the same Rock, Jesus Christ.

I answer, [Answ. 2] That when the Apostle there speaks of disannulling the Old Testament, he doth not mean the Books of the Old Testament, but that old manner of publishing, administering, and applying the Covenant.

The Books of the Old Testament had Christ for their principal scope and subject. Moses wrote of me, if ye believe Moses, you would believe me, if ye believe not Moses, ye cannot soundly believe the Apostles: Thus they reasoned and persuaded the things concerning Jesus out of the Law, and Prophets. Wherefore we conclude, that the Scriptures of the Old Testament, are to be retained still in force, as the good Word of God written for our learning, and a Word that still speaks unto us as unto Children, in Doctrines, in Exhortations, in Consolations.</p></blockquote>

<blockquote><p>Youth could also perform comedies and tragedies, and by such means a useful form of entertainment, honorable and contributing toward an increase of piety, may be staged for the people; but it will be necessary that devout and wise men experienced in the Kingdom of Christ compose these comedies and tragedies, in which there may be presented on the stage the plans, actions and events of mankind, whether common and ordinary as it occurs in compedies or unique and eliciting admiration as it is characteristic of tragedies. All this will contribute toward a correction of morals and a pious orientation to life (Aristotle, Poetics II, 1448a). … It must be observed, however, that when in both kinds of poetic material, comic and tragic, the activities and sins of men are described and actively presented to be seen with the eyes, it should be done in such a way that although the crimes of reprobate men are related, yet a certain terror of divine judgment and horror of sin should appear in these things, and a shameless daring and an exultant delight in crimes should not be expressed. It is better here to take something away from poetic fitness rather than from the concern for edifying the piety of the spectators, which demands that in every representation of sin there be felt the condemnation of one’s conscience and the horrible fear of God’s judgment. But when pious and good actions are shown, they should express as clearly as possible a happy, secure and confident sense of the divine mercy, but moderate and diffident as regards the self, and a joyful trust in God and his promises, with holy and spiritual pleasure in doing good.</p></blockquote>

— Martin Bucer, Other citations (work not named), pp. 349-52 of ch. 54, ‘Honest Games’ in On the Reign of Christ, bk. 2 in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYouth+could+also+perform+comedies+and+tragedies%2C+and+by+such+means+a+useful+form+of+entertainment%2C+honorable+and+contributing+toward+an+increase+of+piety%2C+may+be+staged+for+the+people%3B+but+it+will+be+necessary+that+devout+and+wise+men+experienced+in+the+Kingdom+of+Christ+compose+these+comedies+and+tragedies%2C+in+which+there+may+be+presented+on+the+stage+the+plans%2C+actions+and+events+of+mankind%2C+whether+common+and+ordinary+as+it+occurs+in+compedies+or+unique+and+eliciting+admiration+as+it+is+characteristic+of+tragedies.+All+this+will+contribute+toward+a+correction+of+morals+and+a+pious+orientation+to+life+%28Aristotle%2C+Poetics+II%2C+1448a%29.+%E2%80%A6+It+must+be+observed%2C+however%2C+that+when+in+both+kinds+of+poetic+material%2C+comic+and+tragic%2C+the+activities+and+sins+of+men+are+described+and+actively+presented+to+be+seen+with+the+eyes%2C+it+should+be+done+in+such+a+way+that+although+the+crimes+of+reprobate+men+are+related%2C+yet+a+certain+terror+of+divine+judgment+and+horror+of+sin+should+appear+in+these+things%2C+and+a+shameless+daring+and+an+exultant+delight+in+crimes+should+not+be+expressed.+It+is+better+here+to+take+something+away+from+poetic+fitness+rather+than+from+the+concern+for+edifying+the+piety+of+the+spectators%2C+which+demands+that+in+every+representation+of+sin+there+be+felt+the+condemnation+of+one%E2%80%99s+conscience+and+the+horrible+fear+of+God%E2%80%99s+judgment.+But+when+pious+and+good+actions+are+shown%2C+they+should+express+as+clearly+as+possible+a+happy%2C+secure+and+confident+sense+of+the+divine+mercy%2C+but+moderate+and+diffident+as+regards+the+self%2C+and+a+joyful+trust+in+God+and+his+promises%2C+with+holy+and+spiritual+pleasure+in+doing+good.%E2%80%9D%0A%0A%E2%80%94+Martin+Bucer%2C+Other+citations+%28work+not+named%29%2C+pp.+349-52+of+ch.+54%2C+%E2%80%98Honest+Games%E2%80%99+in+On+the+Reign+of+Christ%2C+bk.+2+in+Melanchthon+%26+Bucer%2C+ed.+Wilhelm+Pauck+%28Philadelphia%3A+Westminster+Press%2C+1969%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb3a3ffc529.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b3a3ffc529.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-theater-stage-plays-movies-acting-etc/#:~:text=Youth%20could%20also%20perform%20comedies%20and,and%20spiritual%20pleasure%20in%20doing%20good&amp;text=Youth%20could%20also%20perform%20comedies%20and%20tragedies%2C%20and&amp;text=with%20holy%20and%20spiritual%20pleasure%20in%20doing%20good" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7760eefc11" data-kw="">
<blockquote><p>‘Occasional‘, properly, is that which has a reason, not from the nature of the thing itself, but from such occasional occurrences of providence, as God will not alter, and its that which has no moral nor sacred conveniency with the nature of worship, but has only a conveniency for such a time and place, as Christ’s preaching in a ship, when He is at the sea side, and a multitude are to hear Him, the ship has no agreement with the nature of preaching, more than a house has. Time, place, and persons are clearly such as agreed with that [Last] Supper, as [a supper] first, not as a sacred worship; and therefore [these particulars] were merely occasional, and so not imitable [by us]; and though Christ might have altered them, yet had they been occasional, and they have no sacred conveniency with this Supper, as this Supper; and if Christ had altered these for mere will, upon no reasons that concerns all suppers, they had not been occasional, but positive points of worship, and so had obliged us;</p></blockquote>

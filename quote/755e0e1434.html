<blockquote><p>The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60</cite>, p. 559</span></figcaption>

<blockquote><p>…For I am of no other mind than Prosper [in the early Church] was: Habet populus Dei plenitudinem suam, et quamvis magna pars hominum salvantis gratiam aut repellat aut negligat, in electis tamen et praescitis atque ab omni generalitate discretis, specialis quaedam censetur universitas, ut de toto mundo, totus mundus liberatus, et de omnibus hominibus, omnes homines videantur assumpti. [“The people of God possess their own fullness; and although a great part of mankind either rejects or neglects saving grace, yet in the elect and foreknown, and those distinguished from the whole generality [of mankind], there is reckoned a certain special universality, so that, from the whole world, the whole world may be said to have been liberated, and from among all men, all men may appear to have been taken up.”] That Christ died for his apostles, for his sheep, for his friends, for his Church, may make peradventure against those who make all men to have a share alike in the death of our Savior: but I profess myself to hold fully with him who said: Etsi Christus pro omnibus mortuus est, tamen specialiter pro nobis passus est, quia pro Ecclesia passus est. [“Although Christ died for all, yet He suffered especially for us, because He suffered for the Church.”] Yea, and in my former writing I did directly conclude, that as in one respect Christ might have been said to die for all, so in another respect truly said not to have died for all; and my belief is, that the principal end of the Lord’s death, was, ‘that He might gather together in one the children of God scattered abroad,’ and, that for their sakes He did specially sanctify Himself, that they ‘also might be sanctified through the truth.’ And therefore it may be well concluded that Christ in a special manner died for these; but to infer from hence, that in no manner of respect He died for any others, is but a very weak collection, especially the respect by me expressed being so reasonable, that no sober mind advisedly considering thereof can justly make question of it, viz. That the Lamb of God offering Himself a sacrifice for the sins of the world, intended by giving satisfaction to God’s justice to make the nature of man which He assumed, a fit subject for mercy, and to prepare a sovereign medicine that should not only be a sufficient cure for the sins of the whole world, but also should be laid open to all, and denied to none, that indeed do take the benefit thereof: for he is much deceived that thinks a preaching of a bare sufficiency is able to yield sufficient ground of comfort to a distressed soul, without giving a further way to it, and opening a further passage.</p></blockquote>

<blockquote><p>We are often demanded whether every one that hears the Gospel be not bound to believe that Christ died for him? Now I say this phrase ‘Christ died for me’ includes many things, as the benefits which arise unto me by the death of Christ may be conceived to be many. But let these benefits be distinguished and we shall readily answer to the question made, and that perhaps differently, as namely, affirmatively to some, negatively to others; as thus: Do you speak of Christ’s dying for me, that is, for the pardon of my sins and for the salvation of my soul: I answer affirmatively and say I am bound to believe that Christ died for the procuring of these benefits unto me in such manner as God has ordained, to wit, not absolutely but conditionally, to wit, in case I do believe and repent. For God has not otherwise ordained that I should reap the benefit of pardon and salvation by virtue of Christ’s death and passion unless I believe in Him and repent. But if question be made whether I am bound to believe that Christ died for me to procure faith and repentance unto me: I do not say that I am bound, or that every one who hears the Gospel is bound to believe this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy, consistent with his absolute Hatred or Reprobation of the Vessels of Wrath, or an answer unto a book entitled, God’s Love unto Mankind... (Oxford: L.L., 1653), pt. 1, Intro</cite>, p. 5</span></figcaption>

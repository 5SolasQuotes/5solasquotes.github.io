<main class="wrap"><figure class="quote" id="q-ecb89ccf1c" data-kw="">
<blockquote><p>1. The benefits of a sound liturgy are: 1. to keep out heresy and ill words from public worship, 2. to be a help to men of unready utterance, 3. that the people may know beforehand what they join in. The inconveniences are: 1. the dulling of affection in hearing still the same words, 2. the tempting of slothful worldly candidates and ministers to learn no other way of praying when this will serve all their worldly turns. But I must add that this follows not from the imposing of a liturgy, but from the exclusion of other prayer and taking up with this alone. 2. The conveniences of praying from a habit are: 1. a just variation, as occasions vary, 2. help to fresh affection, 3. forcing ministers to get ability for utterance. The inconveniences are: 1. That the people know not till the words are past whether they may own them, and so hardly try all and follow with just consent. 2. That abundance of young, raw, unskillful men do ordinarily disgrace prayer by their unskillful methods and expressions. 3. That heretics and erroneous men have great opportunity to put their sins into their prayer, which yet the people should by joining in make their own were they sound (which they are not bound to do by sermons): And no man of understanding can choose, but suspect that weak ignorant ministers will be showing their weakness in the highest duties, and so must suspend their consent till late. 4. That less care will be taken in speaking to God than in speaking to men, while most sober ministers study their sermons. 5. That when to avoid disgraceful words and manner of praying, men must decree that no such weak or unready men shall be ministers, the number that can do it better will be so small as that most churches on earth must be so deprived of ministers and all public worship if that take place. 6. That by this means young ignorant men that by use can speak fluently and fervently in prayer shall be followed by the people when many great divines, judicious and holy that have not that readiness of utterance, shall be rejected as having not the Spirit. 7. That as all men’s bodies and minds be not in the like quickness and fitness at all times, but sometimes clouded by fumes or weakness, the public worship shall be as mutable, uncertain and various as men’s tempers are. All these on both sides are so great inconveniences that though both Formalists and Fanatics have derided me for it, I have formerly said, and still say that I believe that the best way to avoid both sorts of evils is to have meet set forms, which shall be owned by the Church as their professed desires, not being so long as to take up too much time from freer prayer, much less to forbid it, which Calvin wisely ordered for France and Geneva.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 53-54, on a mixture of a minister praying with forms in public worship with free prayer as the ideal.</span></figcaption>

<blockquote><p>The ritual of Calvinism, like its creed, was founded, therefore, on the theory of a simple return to the scriptural and primitive pattern. Differing from the systems of Luther and [the English] Cranmer, it lost sight completely of all practices which had originated in a less remote antiquity; it left the missal and the breviary [Romanist responsive, liturgical books] among the rubbish of ‘idolatrous gear’ swept out from its renovated churches; refusing to tamper with the complications of a corrupt ceremonial, whose forms had long enough weighed upon and wearied the souls of men. It went back for authority and inspiration to the law and to the testimony of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/switzerland-geneva.html">Charles Baird</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eutaxia</cite></span></figcaption>

<blockquote><p>While they [the Jews] had the tenth of their goods consecrated, these [Christians] on the other hand who have received freedom [from the Mosaic Law] assign all that they have to the uses of the Lord, cheerfully and freely giving them, and not in lesser portions only, as becomes men professing the hope of greater things.’ . . Start Here: Articles &amp; Book Articles Smyth, Thomas – The Parsimony of Professing Christians being Note A to The Rule &amp; Measure of Christian Charity in Works, vol. 7 American, southern presbyterian. Parsimony means an extreme unwillingness to spend money. Peck, Thomas – Moral Obligation of the Tithe (1890) in Miscellanies, vol. 1, pp. 146-57 Peck was an American, southern presbyterian.. He argues that while natural and Biblical principles morally obligate us to return a portion of our income to the service of the Lord, this does not obligate an exact amount of, or at least, 10% in the New Testament era. While this article is very valuable, yet throughout it Peck argues for Voluntaryism, which is contrary to the Establishment Principle of the Reformation.. This aspect of Peck’s article is not recommended. Balfour, William – The Establishment Principle Defended, pp. 126-34 (1873) Balfour was a minister in the Free Church of Scotland.. He here defends from Scripture the Reformation’s view of the Establishment Principle with regards to tithing. Balfour is here arguing against the Voluntary position of the Scottish United Presbyterian Church, with which Church the Free Church was considering union with in his time. The teaching of Scripture is clear. . Book Croteau, David – A Biblical &amp; Theological Analysis of Tithing: Toward a Theology of Giving in the New Covenant Era PhD dissertation (2005) 339 pp. Croteau brings out numerous, enlightening Biblical insights.. His historical survey on pp. 6-68 is very helpful, especially in documenting the tithing renewal that occurred in America during the late-1800’s and following.. Indispensable for further digging into the subject, especially for his citations of literature on the subject. . . Dictionary &amp; Encyclopedia Articles on the Biblical tithes 1800’s Smith, William – ‘Tithe’ in Dr. William Smith’s Dictionary of the Bible, Comprising its Antiquities, Biography, Geography &amp; Natural History, vol. 4 ed. H.B. Hackett &amp; Ezra Abbot (1871) ** ed. McClintock &amp; Strong – ‘Tithe’ in Cyclopedia of Biblical, Theological and Ecclesiastical Literature (1880) Davis, John D. – ‘Tithe’ in A Dictionary of the Bible (1898) . 1900’s Jewish Encyclopedia – ‘Tithe’ (1901-1906) ed. Orr, James – ‘Tithe’ in International Standard Bible Encyclopedia (1915 / 1939) . . Articles Theological &amp; Political 1500’s Bullinger, Henry – Tenth Sermon, pp. 486-500 in the Fifth Decade of The Decades 1550’s Bullinger (1504–1575) was a Swiss reformer, the successor of Zwingli as the head of the Zurich Church. ** Ursinus, Zacharias – p. 570 (bottom) of ‘The Fourth Commandment’ in Commentary on the Heidelberg Catechism trans. Williard, 3rd American ed. (1851) Ursinus (1534–1583) was a prominent German Reformed theologian. ** Vermigli, Peter Martyr – Pt. 4, ch. 13, ‘Of a Magistrate, &amp; of the Difference between Civil &amp; Ecclesiastical Power’, section 18-32 in Common Places (1583), pp. 235-45 Quote: “First we must understand that tithes in the old time pertained unto ceremonies, and that as well in Melchisedek as in the Levites: Because in either priesthood they were referred unto Christ, and either priesthood was in very deed a figure of Christ… But what signified the tenths in either priesthood? Truly they signified nothing else but that it behoved the old fathers to acknowledge that whatsoever they had came from Christ. By that ceremony, the people worshipped Christ Himself… Boniface says: “We receive the tithes of all laymen.” Ye take them indeed, but now that Christ is come, the paying of tithes is no more a ceremony as it was before the coming of Christ when by tithes men worshipped Christ which was to come in the flesh, and confessed that they ought unto Him, both themselves, and all that they had. After the very which manner they paid the first fruits of all that they had. Nevertheless our men in these days receive tithes: but by what law? Truly not by the ceremonial law, but by a moral Law: since it is requisite that the minister should be sustained by the people: (Mt. 10:10) For the laborer is worthy of his reward: And he which serves the Gospel ought to live by it. So then, whether stipends be paid unto ministers out of lands or out of houses, either in ready money or in tithes, it makes no matter so that they be not maintained dishonestly, but honestly. Indeed these rewards in some places do retain the old manner of tithes. Howbeit in many places they are not called tithes, but stipends or wages. And doubtless they be rather rewards which are due to the labors of ministers than tithes.</p></blockquote>

stical+Power%E2%80%99%2C+section+18-32+in+Common+Places+%281583%29%2C+pp.+235-45+Quote%3A+%E2%80%9CFirst+we+must+understand+that+tithes+in+the+old+time+pertained+unto+ceremonies%2C+and+that+as+well+in+Melchisedek+as+in+the+Levites%3A+Because+in+either+priesthood+they+were+referred+unto+Christ%2C+and+either+priesthood+was+in+very+deed+a+figure+of+Christ%E2%80%A6+But+what+signified+the+tenths+in+either+priesthood%3F+Truly+they+signified+nothing+else+but+that+it+behoved+the+old+fathers+to+acknowledge+that+whatsoever+they+had+came+from+Christ.+By+that+ceremony%2C+the+people+worshipped+Christ+Himself%E2%80%A6+Boniface+says%3A+%E2%80%9CWe+receive+the+tithes+of+all+laymen.%E2%80%9D+Ye+take+them+indeed%2C+but+now+that+Christ+is+come%2C+the+paying+of+tithes+is+no+more+a+ceremony+as+it+was+before+the+coming+of+Christ+when+by+tithes+men+worshipped+Christ+which+was+to+come+in+the+flesh%2C+and+confessed+that+they+ought+unto+Him%2C+both+themselves%2C+and+all+that+they+had.+After+the+very+which+manner+they+paid+the+first+fruits+of+all+that+they+had.+Nevertheless+our+men+in+these+days+receive+tithes%3A+but+by+what+law%3F+Truly+not+by+the+ceremonial+law%2C+but+by+a+moral+Law%3A+since+it+is+requisite+that+the+minister+should+be+sustained+by+the+people%3A+%28Mt.+10%3A10%29+For+the+laborer+is+worthy+of+his+reward%3A+And+he+which+serves+the+Gospel+ought+to+live+by+it.+So+then%2C+whether+stipends+be+paid+unto+ministers+out+of+lands+or+out+of+houses%2C+either+in+ready+money+or+in+tithes%2C+it+makes+no+matter+so+that+they+be+not+maintained+dishonestly%2C+but+honestly.+Indeed+these+rewards+in+some+places+do+retain+the+old+manner+of+tithes.+Howbeit+in+many+places+they+are+not+called+tithes%2C+but+stipends+or+wages.+And+doubtless+they+be+rather+rewards+which+are+due+to+the+labors+of+ministers+than+tithes.%E2%80%9D%0A%0A%E2%80%94+Start+Here%2C+There+are+higher+rewards+in+the+promises+of+God+for+sacrificing+the+things+of+this+life+than+we+can+conceive+of+%28Mk.+10%3A29-30%29.+Lord+increase+our+ <blockquote><p>As to praying a written prayer out of a book, it is a habit I cannot commend. If we can tell our doctors the state of our bodies without a book, we ought to be able to tell the state of our souls to God. I have no objection to a man using crutches, when he is first recovering from a broken limb. It is better to use crutches than not to walk at all. But if I saw him on crutches all his life, I would not consider it a matter for praise. I would like to see him strong enough to throw his crutches away.</p></blockquote>

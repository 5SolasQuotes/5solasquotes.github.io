<main class="wrap"><figure class="quote" id="q-7ebfafd06a" data-kw="">
<blockquote><p>The evangelical ceremonies [in the NT] are either natural or instituted. The natural either common or proper. The common natural ceremonies of religion, are such as are equally used in civil and in religious matters, as bowing the knee, uncovering the head, and some other things which respect that civil order, reverence, and decency, which ought to be observed in the external (and especially in the public) worship of God. The proper are such as are not used but in the matters of religion. The instituted ceremonies of the Gospel strictly and properly taken in contradistinction to natural, and which are designed to be of perpetual use, are only the two Sacraments… yet in a large sense even natural ceremonies, and matters of real decency and order, that is such things as are ex natura rei, pro hic et nunc [from the nature of the thing, here and now], necessary hereunto, and acceptable in the worship of God, are instituted too, i.e. commanded either implicitly or explicitly; for nothing offered by man, especially in worship, which is not in obedience to God, by virtue of some command, is honorable or acceptable to God; but what God has commanded, He has thereby instituted. So then, the matter in hand will fall under the notion of a common, natural ceremony of religion, pertaining to the decency or reverence of God’s worship in the public assemblies of his saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered</cite>, An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered in the Time &amp; Place of God’s Solemn Public Worship?: Affirmative. (London: Maxwell, 1682) 56 pp. ToC, pp. 3-4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-acfb5649fc" data-kw="">
<blockquote><p>V. 2. …and keep the ordinances] By the word [Greek] in the original, which signifies traditions, he means… particular ordinances of comeliness, and good order, which belong to ecclesiastical policy, which afterward were called canons. … V. 10. power on her head] That is, a vail or covering, in token of her husband’s power and authority over her; or a kind of warrant or pass to go abroad with credit and honesty: for there was no necessity of vailing or covering their head within doors, but if they went abroad without their vail, they were counted light and wanderers, like unto run-away servants, or soldiers that have no passe to show from their masters or captains… because of the Angels] Some by the angels understand the pastors of the congregations, who are termed angels, Mal. 2:7 and Rev. 1:20, and that the apostle draws his reason to enforce women’s modest carriage from the reverend respect the women ought to show, especially in the Church, to these angels of the Churches. Others take angels here in the proper sense for the coelestial spirits, which always attend upon Christ their Head, and are present in the congregation of the faithful, and are offended at all disorders and uncomeliness which may be used there… … V. 16. if any man seem to be contentious, we have no such custom] Either the meaning is, We have no such custom for women to pray uncovered; or, we have no such custom or the Churches of God to contend about matters of this nature, but willingly and cheerful to obey those that have the oversight of us in the Lord.</p></blockquote>

</figure><figure class="quote" id="q-87a9dd8be8" data-kw="">
<blockquote><p>Paul, when writing to the Corinthians who were Greeks, gives the preference to that [Greek] custom [of men having an uncovered head in worship]. In doing so, he did not intend to lay down a universal law which should be everywhere observed. He merely accommodated himself to a custom of civil life observed, at that time, by those to whom he was writing. This is admirably, I think, explained by [Johann H.] Altingius in a discourse already quoted… It must not be supposed that the same rule which he had given to the Corinthians from a regard to their customs would have been invariably given to Jews dwelling in their own country, or to Egyptians or Arabians, who followed a different custom. The usages of civil life are endlessly varied by place and time. Consequently what, at one place and time, is sufficiently becoming, would be, at anotlier place and time highly unbecoming. Yet the apostolic rule has been in force, since that time, among almost all Christians. Is it because keeping the head uncovered is universally regarded by them as a token of reverence? I hardly think so. It has spread widely in the north, through the nations of France and Germany. But among the Jews, the Greeks, ancient Italy, and the whole of the East, the custom is wholly unknown. It appears, therefore, to belong to the liberty of the New Testament. ‘With uncovered head,’ says Tertullian, ‘because we are not ashamed.&#x27;</p></blockquote>

<blockquote><p>…for when the Word determines not, conscience (though misinformed) casts the balance to the side which it judges to be necessary; As for instance, if a man think it a sin to hear the Word with the head uncovered, he is oblidged to cover his head, and contrarily; For conscience there casts the balance: but when the thing is unlawful on the matter, it may bind him up, while it remains in an error, so as he cannot without sin counteract its dictate; but it never oblidges him to sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heaven upon Earth</cite>, ... (Edinburgh, 1685), sermon 2, on Acts 24:16, p. 27</span></figcaption>

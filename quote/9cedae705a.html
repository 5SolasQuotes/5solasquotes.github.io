</figure><figure class="quote" id="q-b75b7256b9" data-kw="virgin birth Holy Spirit">
<blockquote><p>The conception is that by which Christ was invisibly formed in the womb of the blessed virgin, without the concurrence of man, but by the power and overshadowing of the Holy Spirit alone: “That which is conceived in her is of the Holy Ghost” (Mt. 1:20). In this a twofold principle must be remarked: an active—the Holy Spirit; a passive—the blessed virgin. The active principle was not a man (as in ordinary generation) because the conception should be such as to permit the virginity of the blessed virgin to remain pure and inviolate. It was also one by which Christ should be free from all taint of sin, which is usually propagated and contracted by ordinary generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.11.2–3</span></figcaption>

</figure><figure class="quote" id="q-0076ce0f8b" data-kw="sufferings soul wrath">
<blockquote><p>As the suffering of Christ is the principal part of the ransom paid for us by him and the special foundation of our confidence and consolation, it should also be the primary object of our faith and the theme of meditation, that with Paul we may count all things for loss but the knowledge of the crucified Jesus. Did Christ suffer only corporeal punishments for us in the body or in the soul, but only as to its lower and sensitive part? Or did he in truth also bear the spiritual and infernal punishments of sin themselves (in the superior as well as in the inferior part) properly in himself and from a sense of God’s wrath? We deny the former and affirm the latter against the papists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 13.14.1</span></figcaption>

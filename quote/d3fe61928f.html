<main class="wrap"><figure class="quote" id="q-d3fe61928f" data-kw="">
<blockquote><p>He [Jesus] plainly states that mankind, unchanged by divine influence, labor under such an indisposition to embrace his Gospel, and the blessings which it at once reveals and conveys, as amounts to a moral incapacity,—an indisposition which nothing short of divine influence can remove: ‘No man can come to Me, except the Father, which has sent Me, draw him;’ and with equal plainness He states that this influence, while absolutely necessary, is also fully competent to produce the desired effect,—‘All that the Father has given Me shall come to Me.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-edinburgh.html">John Brown of Edinburgh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses &amp; Sayings of our Lord</cite>, (1852; Banner of Truth, 1990), vol. 1, p. 462</span></figcaption>

<blockquote><p>…the Reformed customarily distinguish on the one side a fourfold good with which a person can be occupied in his choice, namely: (1) natural good, walking, reasoning; (2) moral good, the exercise of some sort of civil virtue; (3) ecclesiastical good, to which sort belong the duties of external divine worship; and (4) a spiritual and saving good, which accompanies salvation (Heb. 6:9)… With these things posited, they determine that… In the state of grace, through regeneration he recovers the strength lost by sin for doing spiritual and saving good, yet with some sort of a surviving inclination to evil… in the state of sin [being unconverted], to him is present some sort of strength toward natural, moral, and ecclesiastical good, but absolutely none for spiritual and saving good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 2 | section 25, pp. 462-63</span></figcaption>

</figure><figure class="quote" id="q-e052571c14" data-kw="">
<blockquote><p>I answer that immortality indicates a certain potential to live forever and not die. But this potential is not found in human nature on the side of the body, except imperfectly, as if by obediential potency alone, since everlasting life cannot be had through the principles of nature. Rather, the completion of this potency comes from a divine gift gratuitously conferred. And so, immortality can be considered in two ways: either with regard to incomplete natural potency, and in this way, there is one and the same immortality just as there is one and the same nature; or with regard to the gift of grace, which is like the formal element completing the aforementioned potency. And in this way, we find a difference between the two immortalities and impassibilities, since the first was through the grace of innocence whereas the final will be through the gift of glory. For in the first state the soul’s dominance over the body was such that nothing in the body could happen that would be adverse to the soul. But in the last state the dominance will be greater, inasmuch as the properties of the soul will in a certain way overflow into the body such that the body will be rendered agile, bright, and spiritual, as well as impassible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, distinction 19, Immortality in the Original State of Man, quest. 1, art. 5, Whether the immoratlity of Adam was the same as the immortality of the resurrected, I answer that, bk. 2</span></figcaption>

<blockquote><p>XXII. The subject in which it [original sin] resides is not only the lower faculties, namely of sensing and appetition, nor only the superior faculties, namely of understanding and willing, but the whole man, both soul and body, with all their powers. Besides experience, these passages testify: Gen. 6:5; Jer. 17:9; 1 Cor. 2:14; Eph. 4:17-18; Rom. 6:12-13, etc.</p></blockquote>

</figure><figure class="quote" id="q-687b8e6168" data-kw="">
<blockquote><p>Moreover, what the orthodox fathers and the scholastics who followed their steps handed down very well was commonly known: namely that the natural gifts have been corrupted and the supernatural ones lost. So from this statement we establish that supernatural theology, which by the sin of man had been, as it were, rejected and most undeservedly spurned, retreated from here to the heavens; and natural theology, as all the other things which arise from nature, was corrupted. For how could it have remained uncorrupted in a subject that was corrupted in every part?</p></blockquote>

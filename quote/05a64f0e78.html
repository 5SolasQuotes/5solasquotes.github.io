<main class="wrap"><figure class="quote" id="q-05a64f0e78" data-kw="">
<blockquote><p>Argum. 8. God hath set forth Christ that he might be a Reconcilement, and Propitiatory Sacrifice, whereby the wrath of God is appeased towards all that lay hold on him by Faith; therefore it is not possible that a man should be justified, but by Faith in Christ, offering up this atonement in his Blood, unless God should alter the means of appeasing himself.

To shew forth.] Argum. 9. God in this present time of the Gospel hath set forth Christ as the means of appeasing his anger, to those that embrace it by Faith, that by this way of justifying, his Righteousness might be manifest in the time past, in his forbearance and forgiveness of sins past, which from the beginning of the world he hath forborne and forgiven, to wit, that God did not pardon the sins of his own, but upon the account of the Propitiatory Sacrifice of Christ, which was to come, and that without any violation of his Justice: Therefore this ground of our Justification is no less to be asserted, than the glory of God’s Justice is to be manifested. The matter is clear: For if Justification by Faith in the Blood of Christ, shews that God never pardoned sins, but upon satisfaction made to his Justice by the Blood of Christ, certainly he would have the righteousness of God concealed, that would determine any other ground of our Justification than by Faith.

That he might be just] This confirms the Argument, that God hath set forth Christ, that he might be a Propitiation through Faith in his Blood; not only that he might declare himself just in sending the promised Messias, for whose sake freely and also justly he would pardon sin, but that he might shew himself the Author and Doner of true Righteousness to us, (that were without any righteousness of our own) by believing in Jesus Christ: Therefore this ground of our Justification by Faith, is no less to be maintained, than the glory of God’s Justice, Faithfulness and Goodness, to be declared in justifying Believers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 8.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ba5ff7aab" data-kw="">
<blockquote><p>2. That which is exhibited whither by doing or suffering, or both in way of satisfaction and so accepted, being such as makes a plenary compensation for an offence formerly committed; because it utterly extinguishes and abolishes the wrong, so takes it away, as if it never had been; it justly procures a guiltlessness, a blamelessness unto the delinqent, in whose behalf it is performed; and makes him therefore to be reputed in the eye of law and justice, as now no delinqent, but as guiltless, faultless and just: there being no medium between these two just and unjust, nor between guiltless and just. See Dt. 25:1. This guiltlessness therefore is justly termed justice; and the party conseqently by plea thereof upon any emergent occasion may be truly justified, and such guiltlessness achieved by Christ’s satisfaction made to God’s Law and his justice, makes the party unto whom the same is imputed, and who has interest therein, truly named and justly deemed just, and to be in the state of justification, or in a justifiable condition, 2 Cor. 5:21; and this is that, not the satisfaction itself, but the guiltlessness thereby procured, that is so oft in his argument termed ‘justice’ or ‘righteousness’, called the ‘Justice of God’, Rom. 1:17, and 3:21-22, and 2 Cor. 5:21, not, as some, for that the satisfaction was made by Christ, who is God, but because contrived, prepared, propounded and appointed us by God, for God as the party wronged, and Christ as the party satisfying, for the wrong, are in this argument distinguished, Rom. 3:24-25 and 2 Cor. 5:19, 21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), p. 34</span></figcaption>

<blockquote><p>Nor doth it follow, as [Tobias] Crispe and Antinomians say, Faith, obedience, and repentance are not conditions, because pardon, and justification, and salvation go before them; or because by them we purchase not Christ, it only followeth, they are not such conditions as are antecedent, and purchase Christ, which we grant.

2. If a condition be taken in Law terms for a condition, qualification, or something that issueth from free will, without the determining grace of Christ, and such a condition as salvation and righteousness imputed dependeth on, in a proper way of condition; so faith is neither strictly a condition of justification, nor of righteousness, or salvation; because God of mere grace worketh, both the condition, faith and the thing conditioned; for a condition is properly a qualification, or work to be done by a party, by way of contract, league, and bargain, and done, of the parties own strength, as the one side, half, or quarter of a covenant, that obligeth the other party, to bestow a favour or reward for the performed condition, as Arminians say, and neither in this sense, do we ascribe a condition to men. …

Because Christ as surety undertaketh by promise to fulfil both our part, and his own, I will write my Law in their hearts. Christ subscribeth the covenant for me, and himself, and leadeth our trembling hand at the pen, and causeth us consent; in this notion, the Gospel is all promise, rather then a covenant, or a bargain; and there is neither limb, nor lith, nor joint of the covenant, but its all pure grace, both work and wages. Antinomians cannot say that we teach, We are redeemed, justified, saved for faith, for works.

But if a condition be taken Evangelically for a qualification wrought in us, by the grace of Christ, and without which we are not justified, nor saved; then to deny the Gospel to be a conditional covenant, is to bely the Gospel. For the whole Gospel saith, He that believeth, hath life, is freely justified; he that believeth not, is damned, and the wrath of God abideth on him. And that repentance and doing of God’s will, and new obedience, are conditions, is evident by Scripture. Nor is it a Popish way by works, to say, We seek glory, and honour, and immortality by well doing. Works are not so much conditions of justification, as Faith is; yet are they conditions required in these that shall be saved. And because Christ worketh faith in us, it proveth it is not a condition of our own working, but not that it is no Evangelike condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A survey of the spiritual antichrist</cite>, (London: Andrew Crooke, 1648), Part 2.38, pp 39-40.</span></figcaption>

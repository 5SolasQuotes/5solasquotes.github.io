<main class="wrap"><figure class="quote" id="q-40ad41a1eb" data-kw="">
<blockquote><p>This election is not of many kinds, but one and the same for all who were to be saved in the Old and the New Testament. For Scripture declares that there is a single good pleasure, purpose, and plan of God’s will, by which he chose us from eternity both to grace and to glory, both to salvation and to the way of salvation, which God prepared in advance for us to walk in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/means-and-ends.html">Means and Ends</a> › <a href="../topics/election/means-and-ends/election-to-faith-holiness-and-glory.html">Election to faith, holiness and glory</a></span><span class="t"><a href="../topics/election/nature-of-election.html">Nature of Election</a> › <a href="../topics/election/nature-of-election/eternal.html">Eternal</a></span></div>

</figure><figure class="quote" id="q-609a8ee502" data-kw="">
<blockquote><p>As God hath appointed the elect unto glory, so hath he, by the eternal and most free purpose of his will, foreordained all the means thereunto. Wherefore, they who are elected, being fallen in Adam, are redeemed by Christ, are effectually called unto faith in Christ by his Spirit working in due season, are justified, adopted, sanctified, and kept by his power, through faith, unto salvation. Neither are any other redeemed by Christ, effectually called, justified, adopted, sanctified, and saved, but the elect only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 3.6</span></figcaption>

</figure><figure class="quote" id="q-5b39311daa" data-kw="election to faith means">
<blockquote><p>According to this hypothesis, there would be no election to faith, but only to salvation. Yet God cannot elect to salvation (as the end) without also electing to faith (as the means) (cf. Ps. 65:4; Acts 13:48; Rom. 8:30).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.18.7</span></figcaption>

</figure><figure class="quote" id="q-b2c78ecfc8" data-kw="elected in Christ unto holiness">
<blockquote><p>We are said to be “elected in Christ” (Eph. 1:4) … that Christ is the primary means of election to be executed and the cause of salvation destined to us through him, not the cause of the decree by which it is decreed. … He says that we are elected in Christ that “we should be holy.” Therefore we cannot be regarded as existing in Christ antecedently for then we would be holy already.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.10.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/means-and-ends.html">Means and Ends</a> › <a href="../topics/election/means-and-ends/election-to-faith-holiness-and-glory.html">Election to faith, holiness and glory</a></span></div>

<main class="wrap"><figure class="quote" id="q-4f39da9927" data-kw="">
<blockquote><p>The Estates of Parliament, now presently convened in this second session of the second triennial parliament, by virtue of an act of the Committee of Estates, who had power and authority from the last parliament for convening the parliament, having seriously considered the Catechisms, viz. the Larger and Shorter ones, with the Confession of Faith, with three acts of approbation thereof by the Commissioners of the General Assembly, presented unto them by the Commissioners of the said General Assembly; do ratify and approve the said Catechisms, Confession of Faith, and Acts of Approbation of the same, produced as it is; and ordains them to be recorded, published, and practiced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-parliament.html">Civil Parliament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charles I, Parliament 2, session 2, act 16, Act anenet the Catechisms, Confession of Faith, and Ratification thereof, at Edinburgh, Feb. 7</cite>, 1649</span></figcaption>

</figure><figure class="quote" id="q-eab22231a6" data-kw="">
<blockquote><p>The protesters [against mandated subscription] were led by Jonathan Dickinson (1688–1747)… Dickinson shows that he is well acquatined with the debates elsewhere [such as in Ireland]… Notably Dickinson sees it [presbyterianism] not as divinely mandated, but the best of many imperfect options. While acknowledging the usefulness of confessions…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

— Charles Scott Sealy, Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis (Univ. of Glasgow, 2010), pp. 169-28 | ch. 5, ‘The Synod of Philadelphia &amp; the Adopting Act (1729)’, pp. 173-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+protesters+%5Bagainst+mandated+subscription%5D+were+led+by+Jonathan+Dickinson+%281688%E2%80%931747%29%E2%80%A6+Dickinson+shows+that+he+is+well+acquatined+with+the+debates+elsewhere+%5Bsuch+as+in+Ireland%5D%E2%80%A6+Notably+Dickinson+sees+it+%5Bpresbyterianism%5D+not+as+divinely+mandated%2C+but+the+best+of+many+imperfect+options.+While+acknowledging+the+usefulness+of+confessions%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Charles+Scott+Sealy%2C+Church+Authority+%26+Non-Subscription+Controversies+in+Early+18th+Century+Presbyterianism+PhD+thesis+%28Univ.+of+Glasgow%2C+2010%29%2C+pp.+169-28+%7C+ch.+5%2C+%E2%80%98The+Synod+of+Philadelphia+%26+the+Adopting+Act+%281729%29%E2%80%99%2C+pp.+173-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Feab22231a6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/eab22231a6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-in-american-church-history/#:~:text=The%20protesters%20%5Bagainst%20mandated%20subscription%5D%20were,While%20acknowledging%20the%20usefulness%20of%20confessions&amp;text=The%20protesters%20%5Bagainst%20mandated%20subscription%5D%20were%20led%20by&amp;text=imperfect%20options.%20While%20acknowledging%20the%20usefulness%20of%20confessions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-98f1528e12" data-kw="">
<blockquote><p>It has been claimed that confessions were originally a statement of faith but were modified by the Roman Catholic Church into statements of what is to be confessed. “We believe” (Nicea) became “we teach that this is to be confessed” (Chalcedon) and finally “whoever does not believe… is condemned” (Athanasian Creed). With the adoption of anti-heretical creeds, binding to such creeds by means of subscription was also introduced. According to Schaff, the signing of the Creed adopted by the Council of Nicea (AD 325) is “the first instance of such signing of a document in the Christian Church.” Also worth mentioning is the seventh canon of the council of Laodicea (AD 364) which states that heretics are “to have thoroughly learned the symbols of faith.” In 1273 or 1274 the deputies sent from the Eastern Church to the Council of Lyons II were obliged to subscribe the unchanged NiceneConstantinopolitan Creed. It would thus seem that the custom of subscribing credal formulas is as old as the oldest extant credal formula adopted by an ecumenical council. It would be wrong, however, to assume that subscription as a custom was identical in both the Western and Eastern Churches. In the Western Church it was commonly practised. However, though the Eastern or Orthodox Church considers the decisions of the seven ecumenical councils to have credal authority, it does not have a tradition of confessions and subscription like that found in the Catholic and Protestant traditions. An authority on Orthodoxy states it as follows: ‘At a true Ecumenical Council the bishops recognize what the truth is and proclaim it; this proclamation is then verified by the assent of the whole Christian people, an assent which is not, as a rule, expressed formally and explicitly, but lived.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roelf-christiaan-janssen.html">Roelf Christiaan Janssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Credal Period’ in By this our Subscription</cite>, (Theologische Universiteit, Gereformeerde Kerken, 2009), pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-4382d149ad" data-kw="">
<blockquote><p>…the pastors of our reformed Churches, having (in common) had even an ordinary calling: and, therewith holding the true apostolic doctrine, we are the true successors of the apostles, and not our adversaries… …as says Gregory Nazianzen. His words are notable, and which alone are even enough to oppose to all our adversaries shameless brags of bare succession. They are to this sense: The succession of piety is properly to be holden succession: for who professes the same doctrine of faith, he is partner of the same chair: but who embraces a contrary faith, he ought to be accounted an adversary… … therefore, to approve themselves true successors to the apostles, they must also verify themselves to hold the same doctrine:</p></blockquote>

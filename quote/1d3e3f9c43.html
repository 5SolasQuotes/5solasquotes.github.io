<main class="wrap"><figure class="quote" id="q-1d3e3f9c43" data-kw="">
<blockquote><p>For God in his holy wisdom has set such a divine mark upon this our Lord’s day, that at once it reminds us of the greatest works of God, which either conduce to his glory, or his church’s good; as, of the creation of the world in six days, when he rested the seventh, which specially is attributed to the Father; and of man’s redemption by Christ, of whose resurrection this day is a remembrance, which is specially attributed to the Son; also of our sanctification by the Spirit, for that the observation of the Sabbath is a sign and means of holiness, which work is specially attributed to the Holy Ghost; lastly, of your and the church’s glorification, which shall be the joint work of the blessed Trinity, when we shall cease from all our works, Heb. iv. 9, 10, and shall rest, and be glorious with the same glory which our head Christ has with the Father, to whom be glory for ever and ever, Amen. Do all these with delight, Psa. xcii. Isa. lviii. 13, raising up yourself hereby to a greater measure of holiness and heavenly-mindedness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-scudder.html">Henry Scudder</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Daily Walk in Holy Security and Peace</cite>, (1627; Philadelphia, 1800), pp 92-93.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18487bdd66" data-kw="">
<blockquote><p>Now some would make a significancy in it [Christ sitting to preach, Lk. 4:20]; but I take it, it was only a civil gesture, that Christ observing what the way was at that time, He would conform himself to the order and way of sitting, not that it had any spiritual signification: As now, the French Ministers, they preach with their hats on, It’s the custom there, and no question, if any one were to go among them it were fit they should observe the customs that they have: and so here, to sit down, and in other Churches to stand… Therefore observe here, whatsoever ceremony is but natural and helpful in a natural way, there should be no contention, we have no such custom, nor the Churches of God to contend about these, but if they come to have a religious use put upon them… now they come to be sinful, and therefore Christ He observed the ceremony of the Jews [of sitting to preach] as a natural help.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints Happiness</cite>, … (London: M.S., 1660), pp. 15-16</span></figcaption>

</figure><figure class="quote" id="q-0d0c138d09" data-kw="">
<blockquote><p>Several of them [common Scottish people, after the second indulgence in 1672] were taught to believe, and urge a position, in itself of most dangerous consequences, that it is unlawful to hear a minister who was guilty of failures in his entry upon ministerial work, or mistakes in his management of it. I wish the remains of this dangerous position may be entirely out from among us;</p></blockquote>

</figure><figure class="quote" id="q-d3e9518ad8" data-kw="">
<blockquote><p>This is what they are doing here: for they do not mention what seemed good, that is, the restoration of the blind man’s sight, but stress what they can against Christ, that is, his breaking of the Sabbath. Thus some of the Pharisees said, that is, those who were malicious and corrupt, this man is not from God, who does not keep the Sabbath. But Christ did keep the Sabbath, for when the Lord forbade work on the Sabbath he had in mind servile work, which is a sin: whoever commits sin is the slave of sin (John 8:34). Therefore, he who performs works of sin on the Sabbath, breaks the Sabbath. So Christ, who was without sin, rather than they, kept the Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Evangelium S. Ioannis Lectura</cite>, (1270-72), C9.L2.n1326.</span></figcaption>

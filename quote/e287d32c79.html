<blockquote><p>In this discouraging time, a General Meeting met at Douglas upon the 6th of November, 1689. After the meeting was modeled, it was enquired, What the meeting ought first to consider of? Some answered, That the business concerning union with the [other Church of Scotland] ministers was of greatest consequence, and therefore should be first deliberated upon…</p></blockquote>

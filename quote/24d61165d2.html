<main class="wrap"><figure class="quote" id="q-24d61165d2" data-kw="">
<blockquote><p>The Reformers rejoiced in the assurance of salvation as a tower of strength. This Christian certitude made them irresistible in their attacks on the church of Rome and adamant in resisting the onslaughts of the enemy. They were the first to place the doctrine of assurance, which they regarded as a precious jewel, prominently in the foreground; the first also to impress upon the people the necessity of personal assurance. This was one of their most important points of departure from the church that claimed to be the only ark of safety, and yet was totally unable to engender a feeling of security in the hearts of those that sought shelter in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Assurance of Faith</cite>, (WM. B. Eerdmans Publishing Co., 1939), 19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d0b90c6748" data-kw="">
<blockquote><p>This infallible assurance doth not so belong to the essence of faith, but that a true believer may wait long, and conflict with many difficulties before he be partaker of it: yet, being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of ordinary means, attain thereunto. And therefore it is the duty of everyone to give all diligence to make his calling and election sure, that thereby his heart may be enlarged in peace and joy in the Holy Ghost, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance; so far is it from inclining men to looseness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.3</span></figcaption>

</figure><figure class="quote" id="q-0b044c059b" data-kw="">
<blockquote><p>True believers may have the assurance of their salvation divers ways shaken, diminished, and intermitted; as by negligence in preserving of it, by falling into some special sin which woundeth the conscience and grieveth the Spirit; by some sudden or vehement temptation, by God&#x27;s withdrawing the light of his countenance, and suffering even such as fear him to walk in darkness and to have no light, yet are they never destitute of the seed of God and life of faith, that love of Christ and the brethren, that sincerity of heart and conscience of duty out of which, by the operation of the Spirit, this assurance may in due time be revived, and by the which, in the meantime, they are preserved from utter despair.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 18.4</span></figcaption>

</figure><figure class="quote" id="q-fe9c151488" data-kw="">
<blockquote><p>This certainty is not a bare conjectural and probable persuasion grounded upon a fallible hope; but an infallible assurance of faith founded upon the divine truth of the promises of salvation, the inward evidence of those graces unto which these promises are made, the testimony of the Spirit of adoption witnessing with our spirits that we are the children of God, which Spirit is the earnest of our inheritance, whereby we are sealed to the day of redemption.</p></blockquote>

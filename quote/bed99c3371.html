<main class="wrap"><figure class="quote" id="q-bed99c3371" data-kw="">
<blockquote><p>My arguments against the derivation of magistracy from Jesus Christ as Mediator, and against the magistrate’s holding of his office of and under Christ as Mediator, are these: First, this doctrine does evacuate and nullify the civil authority and government of all heathen or pagan magistrates; for which way was the authority of government derived from Christ, and from Him as Mediator, to a pagan magistrate or emperor? If he has not his power from Christ, as Mediator, then He is but a usurper, and has no just title to reign, according to their principles, who hold that all government, even civil, is given to Christ, and to Him as Mediator. Mr. Hussey, forsooth, does learnedly yield the argument, and answers, p. 20, that not only it is a sin to be a heathen, but the government of a heathen is sinful and unlawful; for which he gives this reason, ‘Whatsoever is not of faith is sin.’ He might as well conclude, in that sense, that the best virtues of the heathen were sin, because not of faith; that is, accidentally sin, in respect of the end, or manner of doing, not materially, or in their own nature. Upon the same reason he must conclude, that the government of a heathen magistrate per se [in of itself], simpliciter [essentially], et ex natura sua [out of its nature], unlawful and sinful? Whether has he any just right or title to government and magistracy? If his title to civil magistracy be just, and if his government be in itself materially and substantially lawful, then he must have a commission from Christ, and from him as Mediator. This I suppose cannot be Mr. Hussey’s sense, for he has not answered one syllable to the argument, tending that way. But if the government of a heathen magistrate be in itself materially, substantially, and in the nature of the tenure, sinful and unlawful, so that, as long as he remains a heathen, he has no real right or true title to government, but only a pretended and usurped title (which must needs be Mr. Hussey’s sense, if he has answered anything at all to my argument), then he goes cross not only to the holy men of God in the Old Testament, who honored heathen princes, and were subject to them as to lawful magistrates, but also to the doctrine of Jesus Christ, who taught his disciples to give unto Caesar what is Caesar’s; and of the apostles, who in their time, exhorted the churches to be subject even to the heathen magistrates (for they had no other at that time), to obey them, to pray for them, Rom. 13; Titus 3:1; 1 Tim. 2:1-2; 1 Pet. 2:13-17. It is justly condemned as one of the errors of the Anabaptists, that a heathen magistrate is not to be acknowledged as a lawful magistrate, or as being from God. See Gerhard, Loc. Com., tom. 6, p. 498-9; P. Hinkelmannus, de Anabaptismo, disp. 13, cap. 1 The Scriptures now cited are so clear, that when Mr. Hussey says of the heathen magistrate, ‘Let Baal plead for himself,’ he might as well have said, that Christ and his apostles pleaded for Baal. They that plead for the authority of a heathen magistrate do not plead for Baal, but for God, and for his ordinance; ‘For the powers that be are ordained of God,’ says Paul, speaking even of the heathen magistrates, Rom. 13:1. But what will Mr. Hussey say, if his great master Erastus be found a pleader for Baal as much as I am? Confirm. Thes., lib. 3, cap. 2, p. 184, speaking of the heathen and unbelieving magistrates, before whom the Corinthians went to law one against another, he says, [contains Latin], Is not the ungodly magistrate also preferred by God, that he may defend any of his subjects from injury and violence. Yea, the Scriptures afore touched are so clear in this point, that Gamachaeus, in Primam Secundae, quest. 4-5, cap. 33, though he hold that by human and ecclesiastical right, pagan princes lose their dominion and authority over their subjects when their subjects turn Christians, yet he acknowledges that they still retain their former jurisdiction over those subjects by the law of God and nature. Surely one might as well say, that heathen parents are unlawful, and heathen husbands are unlawful (all which were contrary to the Word of God), as to say that heathen magistrates are unlawful. Take the instance in parents; for all lawful magistrates are fathers by the fifth commandment: Does the paternity of a heathen father differre specie [differ in kind] from the paternity of a Christian father? are they not both lawful parents, being made such by God and nature? are not their children bound to honor them, and be subject to them, and obey them in things lawful? The paternity is the same in se [in principle], but different modaliter [in way], that I may borrow a distinction from Mr. Hussey. The Christian father is sanctified, and qualified to do service to Jesus Christ, as a father, in educating his children Christianly, which a heathen father cannot do. The heathen magistrate and the Christian magistrate are both lawful magistrates, being made such by God and nature, or by election of people. They are both of them to be honored, submitted unto, and obeyed; they are both of them the ministers of God for the good to their people; their power is the same in actu signato [the intent of power], though not in actu exercito [in how the power is actually exercised in specific acts]. The heathen magistrate may do, and ought to do, what the Christian magistrate does; but the Christian magistrate is fitted, qualified, enabled, and sanctified to glorify and serve Jesus Christ as a magistrate, which the heathen magistrate is not.</p></blockquote>

</figure><figure class="quote" id="q-48222a1bd5" data-kw="">
<blockquote><p>…when there is a protestation against the constitution and very being of an Assembly, ‘tis true there is no submitting to it by the protesters. But yet there may be a protesting against some one or more particular deeds of an assembly when the constitution and being of it is acknowledged, and to such an assembly submission is not refused or denied by any principles of ours. So there may be a protesting or testifying against some particular abuses in a Church, and yet communion kept with that Church in lawful, true, necessary acts of divine worship.</p></blockquote>

</figure><figure class="quote" id="q-99be844587" data-kw="">
<blockquote><p>Conquest, seeing it is an act of violence and God’s revenging justice for the sins of a people, cannot give in God’s court such a just title to the throne as the people are to submit their consciences unto, except God reveal his regulating will by some immediate voice from heaven, as he commanded Judah to submit to Nebuchadnezzar as to their king by the mouth of Jeremiah. Now this is not a rule to us; for then, if the Spanish king should invade this land, and, as Nebuchadnezzar did, deface the temple and instruments and means of God’s worship, and abolish the true worship of God, it should be unlawful to resist him, after he had once conquered the land: neither God’s Word, nor the law of nature could permit this. I suppose, even by grant of adversaries, now no act of violence done to a people, though in God’s court they have deserved it, can be a testimony to us of God’s regulating will; except it have some warrant from the law and testimony [Scripture], it is no rule to our conscience to acknowledge him a lawful magistrate whose sole law to the throne is an act of the bloody instrument of divine wrath, I mean the sword. That, therefore, Judah was to submit, according to God’s Word, to Nebuchadnezzar, whose conscience and best warranted calling to the kingdom of Judah was his bloody sword, even if we suppose Jeremiah had not commanded them to submit to the king of Babylon, I think cannot be said.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex... (1644; Edinburgh: Ogle, 1843)</cite>, p. 41</span></figcaption>

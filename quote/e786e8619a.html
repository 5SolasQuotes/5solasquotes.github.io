<blockquote><p>62. The duties of justice are prior and of more binding obligation than those of charity (or love). 63. Therefore, we have a greater obligation to pay our debts than to give away anything of our own. And he who offends another has a greater obligation to seek reconciliation than he who is offended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology ed. John Eusden (Baker, 1997), bk. 2, ch. 16, ‘Justice &amp; Charity toward our Neighbor,’</cite>, p. 307</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-fa1d17a117" data-kw="">
<blockquote><p>Let us then bring our hearts to holy resolutions, and set ourselves upon that which is good, and against that which is evil in ourselves or others, according to our callings, upon this encouragement, that Christ’s grace and power shall go along with us. What had become of that great work of reformation of religion in the latter-spring of the gospel, if men had not been armed with invincible courage… that the cause was Christ’s, and that He would not be wanting to his own cause. Luther igenuously confessed that he carried matters often inconsiderately, and with mixture of passion. But upon acknowledgement, God took not advantage of his errors, but the cause being God’s, and his aims being holy, to promote the truth, and being a man mighty in prayer, and strong in faith, God by him kindled that fire which all the world shall never be able to quench.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bruised Reed &amp; Smoking Flax… (1620; Philadelphia; Presbyterian Board of Publication, n.d.)</cite>, ch. 28, p. 203</span></figcaption>

</figure><figure class="quote" id="q-96301fde29" data-kw="">
<blockquote><p>But there is one principle [George] Gillespie’s fore-analyzed rule did not allow him to adequately address.¹ [John] Sprint affirmed the principle of, regarding things not inherently wrong, avoiding the greater hurt and scandal, which is a form of the fundamental natural law of avoiding evil and doing the greatest good attainable. ¹ Gillespie acknowledges “in evils of punishment, we may choose a lesser” (Dispute, pt. 2, ch. 1, p. 10); cf. 2 Sam. 24:10–14. Yet the ethical issues of the permissibility of choosing material evils in justified circumstances go far deeper and wider than being limited to punishments. See Fentiman, ‘Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting’ throughout at ‘On Voting’ (RBO) and ‘An Extended Introduction’ at ‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’ (RBO). If God may graciously choose for us the lesser miserable evil, may not we concur (2 Chron. 12:5–8), when He reasons with us to do so (Jer. 27:12–13)?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, pp. 54-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

</figure><figure class="quote" id="q-b382e508f4" data-kw="">
<blockquote><p>…there is a twofold scandal which may be and has been given by things lawful in themselves… viz. the giving of occasion to the weak to condemn our lawful deeds, and the animating of them to follow our example against their own consciences: both ways we make them to sin. …Behold what scandal may arise, even out of things which are in themselves lawful, which also arises out of the ceremonies (let them be as lawful as can be): …2. We are animated by the example of Formalists to practice conformity, which in our consciences we condemn, and by consequence do sin, because he that doubteth is damned, and whatsoever is not of faith is sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | pt. 2, ch. 9</cite>, p. 41</span></figcaption>

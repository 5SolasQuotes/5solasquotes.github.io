<main class="wrap"><figure class="quote" id="q-b7435080a5" data-kw="">
<blockquote><p>The believer is bound to obey the rulers of the church only as long as they obey God and preach his pure and entire Word. But when they forsake the truth and rise up against God, the supreme ruler, he would be a rebel against God who would follow them. An inferior order is to be retained while the superior is unviolated; but where it is treated of the supreme power and of salvation, he would be injurious to God and to himself and his neighbor who should follow the erring and not withdraw from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 3, 18th Topic, Question 23</cite>, pp. 220-1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6522302f75" data-kw="">
<blockquote><p>93. Next it may be granted that the matter may be put under a further examination, yet upon condition, that when it is come to the revision of the former sentence, regard may be had of the weaker which are found willing to be taught, though they doubt; but that unto the wicked and contentious tempters, which do mainly strive to oppress our liberty which we have in Christ, and to bring us into bondage, we do not for a moment give place by subjecting ourselves; for what else seek they or wait for, than that under the pretense of a revising and of new debate, they cast in lets and impediments ever and anone, and that by cunning lyings in wait they may betray the liberty of the Church, and in process of time may by open violence more forceably break in upon it, or at least constrain the ministers of the Church to weave Penelope’s web, which they can never bring to an end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>111 Propositions</cite></span></figcaption>

</figure><figure class="quote" id="q-5cc8ab07d5" data-kw="">
<blockquote><p>There be some that call in question the warrant and authority of classical presbyteries, of provincial synods and national assemblies, as they are used and maintained in the Church of Scotland. I mean not the praelatical faction, whom we set aside, but even some who are as anti-episcopal as we are. The scrupulosity of such (at least of many such) herein [of the Independents] does (we conceive) proceed not from any perverseness of mind, but only from certain mistakings, which better information may remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland… (Edinburgh, 1641)</cite>, pp. 108-9</span></figcaption>

</figure><figure class="quote" id="q-b0ab03280e" data-kw="">
<blockquote><p>…the Canon law prohibiting to depart or swerve from the rules and discipline of the Roman Church, yet excepts discretionem justitiae [the discretion of righteousness], and so permits to do otherwise than the Church prescribes, if it be done cum discretione justitiae [with the discretion of righteousness]. The [Romaninst] Schoolmen also give liberty to a private man of proving the statutes of the Church, and neglecting the same, if he see cause for doing so, Si causa fit evidens, per se ipsum licite potest homo, statuti observantiam praeterire. If any be not able to examine and try all such things, debebant omnes posse, Dei jussu: deficiunt ergo sua culpa [all being able to keep the command of God, therefore they default by their own fault], says Pareus. Si recte probandi facultate destitui nos sentimus, ab eodem spiritu qui per prophetas suos loquitur petenda est, says Calvin. We will not then call any man Rabbi, nor jurare in verba magistri [swear on the words of a magistrate], nor yet be Pythagorean disciples to the Church herself, but we will believe her and obey her insofar only as she is the pillar and ground of truth.</p></blockquote>

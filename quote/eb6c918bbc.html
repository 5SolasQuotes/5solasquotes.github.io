<main class="wrap"><figure class="quote" id="q-eb6c918bbc" data-kw="">
<blockquote><p>Let us not say, ‘We have bad health.’ Remember the apostle Paul – he had a thorn in the flesh – some never-ceasing ailment, probably – and yet it seemed a spur rather, than a hindrance to his soul.

Let us not say, ‘We have many trials.’ Remember Job. Wave upon wave came rolling over him, and yet his faith did not give way; and the record of his patience is on high.

Let us not say, ‘We have families and children to make us anxious and keep us back.’ Remember David – none was ever so tried at home as he was, yet he was a man after God’s own heart.

Let us not say, ‘We have press of distracting business to attend on.’ Remember Daniel – he had far more affairs on his hands probably than any of us, yet he found time to pray three times a day and was a proverb for godliness.

Let us not say, ‘I stand alone, the times are evil, and none around me serve God.’ Remember Noah. The whole world was against him, yet he did not give way. By faith he held fast.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bishop J. C. Ryle’s Autobiography: The Early Years</cite>, ed. Andrew Atherstone (Edinburgh: Banner of Truth, 2017), pp 280-81.</span></figcaption>

</figure><figure class="quote" id="q-644cace173" data-kw="">
<blockquote><p>But now, to shut up this discourse, whereas the covenant which man originally was taken into was a covenant of works, wherein his obtaining rest with God depended absolutely on his doing all the work he had to do in a way of legal obedience, he was during the dispensation of that covenant tied up precisely to the observation of the seventh day, or that which followed the whole work of creation. And the seventh day, as such, is a pledge and token of the rest promised in the covenant of works, and no other.

And those who would advance that day again into a necessary observation do consequentially introduce the whole covenant of works, and are become debtors unto the whole law; for the works of God which preceded the seventh day precisely were those whereby man was initiated into and instructed in the covenant of works, and the day itself was a token and pledge of the righteousness thereof, or a moral and natural sign of it, and of the rest of God therein, and the rest of man with God thereby. And it is no service to the church of God, nor hath any tendency unto the honour of Christ in the gospel, to endeavour a reduction of us unto the covenant of nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations Concerning the Name, Original, Nature, Use, and Continuance of a Day of Sacred Rest</cite>, in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. William H. Goold (1671; 7 vols, Edinburgh: Johnston and Hunter, 1854), 2: 345-46.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-239084461a" data-kw="">
<blockquote><p>It was at Poietiers that the evangelisation of France began in a systematic way. The school which Calvin here gathered round him comprehended persons in all conditions of life… They discoursed about Divine mysteries as they walked together on the banks of the neighboring torrent, the Clain, or as they assembled in the garden of the Basses Treilles, where… they often held their re-unions… By-and-by it was thought prudent to discontinue these meetings in the Basses Treilles, and to seek some more remote and solitary place of re-union. A deep and narrow ravine… then known as the ‘Cave of Benedict,’ but which from that day to this has borne the name of “Calvin’s grotto,” was selected as the scene of the future gatherings of the converts. It was an hour’s walk from the town… In this grotto, so far as the light of history serves, was the Lord’s Supper celebrated for the first time in France after the Protestant fashion. On an appointed day the disciples met here, and Calvin, having expounded the Word and offered prayer, handed round the bread and cup, of which all partook… The place had none of the grandeurs of cathedral, but ‘the glory of God and the Lamb’ lent it beauty. No chant of priest, ‘no swell of organ accompanied the service, but the devotion of contrite hearts, in fellowship with Christ, was ascending from that rocky chamber, and coming up before the throne in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-a-wylie.html">J.A. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of Protestantism, vol. 2, p. 179</cite></span></figcaption>

<blockquote><p>8 Neither is the water turned into the blood or spirit of Christ, neither is the blood of Christ present in the water or in the same place with the water, neither are the bodies of such as are baptized sprinkled invisibly therewithal, neither is the holy Ghost in substance or vertue more in this water then elsewhere; but in the lawful use of baptism he worketh in their hearts which are baptised, and spiritually doth wash and sprinkle them with the blood of Christ, and useth this external sign as an instrument, &amp; as a visible word &amp; promise, to uphold &amp; stir up the faith of such as are baptised.

9 Therefore when baptism is said to be the washing of regeneration, or to save us, or to wash away our sins; it is meant; that external baptism is a sign of the internal baptism, that is, of regeneration; salvation, and spiritual washing &amp; that this internal washing is joined with the external, whensoever baptism is lawfully used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A collection of certain learned discourses, written by that famous man of memory Zachary Ursine; doctor and professor of divinity in the noble and flourishing schools of Neustad. For explication of divers difficult points, laid down by that author in his catechism. Lately put in print in Latin by th</cite>, (Oxford: Joseph Barnes, 1600), p. 294.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-41222c9eb2" data-kw="">
<blockquote><p>XII. There was no need that a particular precept concerning the baptism of infants should be given because it was known to the disciples that infants were circumcised. It therefore sufficed that there was a general command to baptize all nations, under which the particular is contained.

XIII. The baptism of Christ (performed when he was in his thirtieth year) cannot overthrow infant baptism. All the acts of Christ (which do not pertain to doctrine) are not forthwith to be imitated; otherwise baptism would have to be received only in the thirtieth year (which however our opponents do not say). There was a peculiar reason for his waiting until that time; not only because only in the preceding year was the baptism of John instituted, but also on account of the type of the Levitical priests (who although received in their twenty-fifth year into the priestly college, before their thirtieth year were not admitted to the exercise of their office). Christ (not needing baptism) could safely put it off. But our case is different, we being conceived and born in sin.

XIV. John admitted no one to baptism unless he confessed his sins because he was dealing with the baptism of adults and those called to the Christian church. But it does not follow that the same should be done with infants who are already in the church.

XV. A sign whose virtue depends on the disposition of the receiving subject differs from one whose virtue depends on the promise of the institutor. The former sign is to no purpose applied to one not understanding it; but it is not so with the latter (such as baptism and circumcision). Again, a subject receptive of the sign differs from one perceptive of it also; infants can be the former, although not the latter. Third, a sign is useless applied to one not understanding, or about to understand (which cannot be said of an infant). XVI. Baptism is called the sacrament of repentance; not because it requires that beforehand in everyone to be baptized, but because it binds the baptized to the desire of it, whether in the present (when they are capable of it) or in the future. XVII. Sacraments without faith in the user are said to be empty ceremonies with regard to adults; not with regard to infants, in whom (for a salutary use of baptism) the promise is sufficient and the grace of the covenant (which is sealed on the part of God), even though as yet there is not an answer and restipulation on the part of the baptized (as is evident in circumcision, Gen. 17:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 3 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 19.20.12–17 (p. 418–19).</span></figcaption>

<blockquote><p>XXVI. What is said by some (“Infants are baptized in the faith of their parents”) does not mean that what is in adults is imputed to infants or answers for infants; both because each one lives by his own faith and because if the parents should be hypocrites, their infants would be excluded from salvation. But the faith of parents bears this relation—that they bring their children to be baptized from the faith by which they believe that the gospel promises belong to them and to their children; again, that by it they obtain the grace of God for their children (?Mk. 7:19).</p></blockquote>

<blockquote><p>We may consider a visible Church either metaphysically or politically. It is one thing to consider men as living creatures endued with reason; another thing to consider them as magistrates, masters, fathers, children, servants, etc. So is it one thing to consider a visible Church as a society of men and women separated from the blind world by divine vocation [calling], and professing together the gospel of Jesus Christ; and another thing to consider it as a political body, in which the power of spiritual government and jurisdiction is exercised–some governing and some governed. These are very different considerations; for first, a visible Church being taken entitatively or metaphysically, her members do ordinarily communicate together in those holy things which fall under the power of order, which I may call sacra mystica [sacred, mystical rites]; but being taken politically, her members communicate together in such holy things as fall within the compass of the power of jurisdiction, which I may call sacra politica [sacred politics]. Secondly, infants under age, being initiated in baptism, are actually members of the Church in the former consideration, but potentially only in the latter; for they neither govern, nor yet have the use of reason to be subject and obedient to those that do govern.</p></blockquote>

<blockquote><p>Of all these great difficulties I have said what I know in my Appendix to Infant Baptism to Mr. Bedford and Dr. Ward, and of Bishop Davenant’s judgement. And I confess that my judgment agrees more in this with Davenant’s than any others, saving that he does not so much appropriate the benefits of baptism to the children of sincere believers as I do. And though by a Letter in pleading Davenant’s cause, I was the occasion of good Mr. [Thomas] Gataker’s printing of his answer to him, yet I am still most inclined to his judgement; Not that all the baptized, but that all the baptized seed of true Christians are pardoned, justified, adopted, and have a title to the Spirit and salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Question 42, ‘But the great question is, How the Holy Ghost is given to infants in baptism? And whether all the children of true Christians have inward sanctifying grace? Or whether they can be said to be justified, and to be in a state of salvation, that are not inherently sanctified? And whether any fall from this infant state of salvation?’ in A Christian Directory... (London: 1673), pp. 817-21, pp. 817-18</span></figcaption>

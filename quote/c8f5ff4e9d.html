<main class="wrap"><figure class="quote" id="q-c8f5ff4e9d" data-kw="">
<blockquote><p>These things being observed, we may consider that the Scripture doth plainly and expressly make mention of two testaments, or covenants, and distinguish between them in such a way, as what is spoken can hardly be accommodated unto a twofold administration of the same covenant. The one is mentioned and described, Exodus 24:3-8, Deuteronomy 5:2-5, — namely, the covenant that God made with the people of Israel in Sinai; and which is commonly called “the covenant,” where the people under the old testament are said to keep or break God&#x27;s covenant; which for the most part is spoken with respect unto that worship which was peculiar thereunto. The other is promised, Jeremiah 31:31-34, 32:40; which is the new or gospel covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 91</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f47dc6baee" data-kw="">
<blockquote><p>With respect hereunto it is that the Lord Christ is said to be the “mediator of a better covenant;” that is, of another distinct from it, and more excellent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 76</span></figcaption>

</figure><figure class="quote" id="q-18c1fcd7c3" data-kw="">
<blockquote><p>First, therefore, the apostle doth evidently in this place dispute concerning two covenants, or two testaments, comparing the one with the other, and declaring the disannulling of the one by the introduction and establishment of the other. What are these two covenants in general we have declared, — namely, that made with the church of Israel at mount Sinai, and that made with us in the gospel; not as absolutely the covenant of grace, but as actually established in the death of Christ, with all the worship that belongs unto it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 84</span></figcaption>

</figure><figure class="quote" id="q-ed7e8b1e1e" data-kw="">
<blockquote><p>On this consideration it is said, that the two covenants mentioned, the new and the old, were not indeed two distinct covenants, as unto their essence and substance, but only different administrations of the same covenant, called two covenants from some different outward solemnities and duties of worship attending of them.  […] But on the other hand, there is such express mention made, not only in this, but in sundry other places of the Scripture also, of two distinct covenants, or testaments, and such different natures, properties, and effects, ascribed unto them, as seem to constitute two distinct covenants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 85</span></figcaption>

</figure><figure class="quote" id="q-b0039051eb" data-kw="old new">
<blockquote><p>However, we readily grant that the Old Testament and the Mosaic covenant taken strictly and absolutely as to the legal relation (schesin) differ in entire substance from the New. Hence the law and Moses are opposed to grace and to Christ (Jn. 1:17) and by Paul the letter and the Spirit, the ministration of condemnation and of righteousness (2 Cor. 3:6, 7). So we maintain that taken broadly and with the other evangelical relation (schesei) (clothed, namely, with its pedagogical circumstances), it did not differ as to substance, but only as to manner of dispensation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.8.8</span></figcaption>

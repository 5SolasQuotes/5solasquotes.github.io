<main class="wrap"><figure class="quote" id="q-e902daaad4" data-kw="">
<blockquote><p>Thirdly, to introduce significant sacred ceremonies into the New testament, other than the holy sacraments of God’s own institution, were to reduce Judaism and to impose upon us again the yoke of a ceremonial Law, which Christ has taken off. … Upon this ground also does Perkins condemn all human significant ceremonies. ‘Ceremonies,’ says he, ‘are either of figure and signification, or of order.’ (Com. On Gal. 3:24) The first are abrogated at the coming of Christ, etc. Upon the same ground does Chemnitius condemn them, Quod vero praetenditur, etc. ‘But whereas,’ says he, ‘it is pretended that by those rites of men’s addition, many things are profitably signified, admonished, and taught: Hereto it may be answered that figures do properly belong to the Old Testament: but those things which Christ would have to be taught in the New Testament, he would have them delivered and propounded, not by shadows, but by the light of the Word. And we have a promise of the efficacy of the Word, but not of figures invented by men. (Exam., part 2, de rit. in admin. sacram., p. 32)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, p. 83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-59d7b78d34" data-kw="">
<blockquote><p>Indeed, nothing like the example of a ceremony has been exhibited thus far. On the laying on of hands and of the holy kiss, we speak below.</p></blockquote>

</figure><figure class="quote" id="q-cc7ada14c0" data-kw="">
<blockquote><p>And the Houshold of Onesiphorus. …As the apostle before, [2 Tim.] Ch. 1:16, prayed for the house of Onesiphorus, so here [2 Tim. 4:19] he salutes them. By ‘house’ here is meant (by a metonymy of the subject very frequent in Scripture) the people in the house, as wife, children, servants; which may serve as an answer to that cavil of the sottish illiterate Quakers who revile us for calling the place where the Church meets, ‘The Church’; when this metonymy is so frequent in Scripture, ‘The house’ for the people in the house, and ‘the Church’ for the people that meet in the church. The Apostle uses the very word Church in this very sense, 1 Cor. 14:28,35, ‘It is a shame for a woman to speak in the Church.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical &amp; Polemical Commentary, Or Exposition upon 2 Tim. 3-4</cite>, Question 55, ‘Whether we may call the Meeting-Place a Church?’ in A Practical &amp; Polemical Commentary, or, Exposition upon the Third &amp; Fourth Chapters of the Latter Epistle of Saint Paul to Timothy… (London, 1658), on 2 Tim. 4:19, p. 460. Hall (1610–1665) was an English, presbyterian puritan who was ejected at the Great Ejection of 1662.</span></figcaption>

</figure><figure class="quote" id="q-2bcb8c6370" data-kw="">
<blockquote><p>This comprehensive application of the [Scriptural] rule [articulated by Rutherford] was necessitated because the advocates for human ceremonies had argued that such things might be justified as circumstances of worship. It was maintained that circumstances which were not forbidden were lawful if they were edifying. Their reformed opponents quickly saw that this argument effectively created a class of religious actions which were beside the Word in matters of faith and worship. Their response was clear and concise: any action which served as a means of worship was a moral action and required the warrant of God’s Word. To the point, Rutherford asserted, “In actions or religious means of worship, and actions moral, whatever is beside the Word of God is against the Word of God”. (Divine Right of Church Government, 1646, [Intro, section 2], pp. 19-20)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-winzer.html">Matthew Winzer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Constitutional Principle of the Scottish Reformation</cite>, 2012, vol. 2, pp. 1-42</span></figcaption>

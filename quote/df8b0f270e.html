<main class="wrap"><figure class="quote" id="q-df8b0f270e" data-kw="">
<blockquote><p>. . . he is the best student who does not read his thoughts into the book, but lets it reveal its own; who draws from it its sense, and does not import his own into it, nor force upon its words a meaning which he had determined was the right one before he opened its pages. Since then we are to discourse of the things of God, let us assume that God has full knowledge of Himself, and bow with humble reverence to His words. For He Whom we can only know through His own utterances is the fitting witness concerning Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Trinity 1.18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-694d9cd5ae" data-kw="">
<blockquote><p>Further, he took upon him power, rule, and authority over the Christian church, and over the Holy Scriptures, the Word of God; … They who, against God&#x27;s Word, boast of the church&#x27;s authority, are mere idiots. The pope attributes more power to the church, which is begotten and born, than to the Word, which has begotten, conceived, and borne the church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Table Talk</cite>, Of the Pope, CCCCLIII, p. 269</span></figcaption>

</figure><figure class="quote" id="q-9dae215799" data-kw="">
<blockquote><p>Or if anyone should think this is untrue, I am not going to quarrel about it. After all, I am clearly dealing with Christians, who rejoice over their knowing the holy Scriptures without human guidance; and if that is the case, it is a genuine good they are rejoicing over, one quite out of the ordinary. So let them grant me that each one of us, from earliest childhood, has had to learn our own language by constantly hearing it spoken, and has acquired a knowledge of any other language, whether Hebrew or Greek, or any of the rest, either in the same way by hearing it spoken, or from a human teacher. So now then, if you agree, let us advise all our brothers and sisters not to teach their small children these things, because after all it was in a single instant of time, with the coming of the Holy Spirit, that the apostles were filled and spoke in the tongues of all nations; or else none of us who have not experienced such things should consider ourselves to be Christians, or to have received the Holy Spirit. But no, on the contrary, let us not be too proud to learn what has to be learned with the help of other people, and let those of us by whom others are taught pass on what we have received without pride and without jealousy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De doctrina christiana, prol. §5 in Teaching Christianity</cite>, trans. Edmund Hilll, The Works of Saint Augustine: A Translation for the 21st Century (Hyde Park, NY: New City Press, 1996), pp. 104–5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a></span></div>

</figure><figure class="quote" id="q-ca480713e5" data-kw="">
<blockquote><p>Providence without the word is a dark enigma. None can solve it. The best commentary on Providence is the Bible. The best commentary on the Bible is Providence. The events of a godly man&#x27;s life are to him the fulfillings of the Scriptures. In a thousand ways they teach him the true sense of promises and threatenings, predictions and narratives, precepts and doctrines. They mightily confirm his belief of the truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jehovah-Jireh: A Treatise on Providence</cite>, ch. “The Special Kindness of Providence Towards Godly Men”</span></figcaption>

</figure><figure class="quote" id="q-ee0846291f" data-kw="">

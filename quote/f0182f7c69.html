<main class="wrap"><figure class="quote" id="q-f0182f7c69" data-kw="">
<blockquote><p>Nobody should trust in his zeal for religious matters to the extent of believing that good intentions will automatically lead to right actions. Unless our zeal is controlled by the Word of God it will do more harm than good. The person who is addicted to superstitions and false doctrine will be a determined enemy of the truth and will probably turn out to be a fierce persecutor of those who worship it. That kind of zeal derives from an excessive devotion to ancestral traditions.

It is characteristic of such traditions of people that they invent a different God from the one who really exists but who appears to be close enough to ours that he takes pleasure in the things that we glorify. Before long, mixed forms of worship appear that are defended on the ground of their antiquity, the example of the masses and above all on the authority of their ancestors, which is sacrosanct for many and from which it would be wrong to depart. If they see other people who think and believe differently, they start to hate them and think that they should not be allowed to do anything, because they are considered to be enemies of religion and very dangerous people.

Furthermore, as Christ predicted, they think that they are better worshipers of God if they persecute such people and torture them with all kinds of torments. Paul provides us with an example of this because his zeal drove him to persecute the church. He took godly worshipers of both sexes to prison and forced them to deny their faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 37.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-bfa045621c" data-kw="">
<blockquote><p>It is not truth but goodness which is the ultimate object of the soul. And God who is infinite goodness itself, has revealed his truths to the world to do men good and not to hurt them. And the Devil, who is the Destroyer, so he may but do men hurt, will be content to make use even of truth to do it; though usually he only pretends truth to cover his lies: And this angel of Light has his ministers of light and righteousness, who are known by their fruits; whilst the pretenses of light and righteousness are used to Satan’s ends and not to Christ’s, to hurt and destroy and to hinder Christ’s Kingdom, and not to save and to do good: as the wolf is known by his bloody jaws, even in his sheep’s clothing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 38, ‘Neglect not any truth of God, much less renounce it or deny it: for lying and contempt of sacred truth is always sinful: But yet do not take it for your duty to publish all which you judge to be truth, nor a sin to silence many lesser truths, when the Church’s peace and welfare does require it’, pp. 208-9</span></figcaption>

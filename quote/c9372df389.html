<main class="wrap"><figure class="quote" id="q-c9372df389" data-kw="">
<blockquote><p>[Socinians and Photinians object:] (2) God is able to pardon sins without satisfaction. Therefore, it is probable, that He exacts no satisfaction. The antecedent is proven: Because He is able to remit of His own right as much as He pleases: since He is the absolute judge: but to each one one may remit as much as He pleases of his own right. Responses: 1. I deny the consequence; it is not valid to argue from the possible to the actual. 2. I also deny the antecedent. The proof is inconsequent: God is indeed able to remit of His own right as much as He pleases; but by His truth and righteousness He is not willing to remit so much, that without satisfaction He might forgive sins: because by His just judgment He once dictated to man the punishment of death: in the day that thou eatest therefore thou shalt surely die. Whence Scripture comments the righteousness of God in exacting satisfaction, Rom. 3:25. (3.) God wills to forgive us our sins without satisfaction. Therefore, He exacts no satisfaction. The antecedent is proven: because God does not exact anything from us except faith and repentance. Response: I deny the antecedent. The proof is inconsequent. For, even if from us He does not require and exact satisfaction: nevertheless, He exacts it from His Son, our Mediator, and imputes and grants the same to us freely. Faith itself implies this satisfaction: which is born toward Christ as the one redeeming and making satisfaction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd</cite>, ed. (1634), Species of the Office of Christ, pt. 2</span></figcaption>

<blockquote><p>Whether there were any flat necessity of man’s suffering after the Fall is doubted by many and denied by Socinus. Whether this necessity arises from God’s natural justice, or his ordinate, viz. his decree, and the verity of the threatening, is also with many of our own divines a great dispute: Whether God might have pardoned sin if He had not said, ‘The sinner shall die,’ may be doubted of (though I believe the affirmative, yet I judge it a frivolous presumptuous question. But the word of his threatening being once past, methinks it should be past question that He cannot absolutely pardon without the apparent violation of his truth, or wisdom. Some think that it proceeds from his wisdom rather than his justice, that man must suffer: see Mr. John Goodwin, Of Justification, pt. 2, p. 34), but why should we separate what God has conjoined? However, whether wisdom, or justice, or truth (or rather all these) were the ground of it, yet certain it is that a necessity there was that the penalty should be inflicted: or else the Son of God should not have made satisfaction, nor sinners bear so much themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aphorisms of Justification</cite>, … (Hague, 1655), thesis 5, pp. 12-13</span></figcaption>

h%20themselves" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Here Owen appears to waver. On the one hand he allows that punishments may vary provided that the end of satisfying justice is met. On the other hand he seems to make an exception of the atonement, arguing or rather implying that there could not be another mode of satisfaction for sin than atonement by the God-man, the surety who has substituted himself in the room of sinners. Yet he seems to allow the possibility (though one that we are not in a position to know about) that the manner, time etc. of punishment belongs entirely to God, whose counsel we do not know. Which raises the question of why, if punishments in general, in respect of their nature and circumstances, are in the hand of God, why the punishment for sin may not similarly be. And if it may similarly be, even if we have not a clue about what an alternative mode of punishment may be in this case, then the atonement by Christ is not necessary in even the restricted sense that Owen has argued for earlier.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-helm.html">Paul Helm</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analysis 13 – Owen’s Option’</cite>, (2008) 17 paragrpahs at Helm’s Deep</span></figcaption>

</figure><figure class="quote" id="q-e85297b56b" data-kw="">
<blockquote><p>Dr. Twisse maintained, as several eminently orthodox divines have done, ‘That God, by his absolute power, setting aside his decree or free constitution, can forgive sin without any satisfaction.’ He has a whole digression against Piscator and Lubbertus, on this subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Gratiae</cite>, bk. 1, Of Election, digression 8</span></figcaption>

<blockquote><p>III. …But what can man do for this? His demerit is infinite (by the previous thesis). But the moral value of human actions is only finite, for the act cannot exceed the dignity of its principle. Moreover, in personal offenses, such as this one, there ought to be order and proportion between the one making satisfaction and the one to whom it is made, but this is far less between God and man than between a king and the vilest slave. IV. …Indeed, so far is gratuitous remission of sins from being opposed to this satisfaction, that it cannot but have a place in that satisfaction (such as this one is) where another pays and something else is paid than he who was and what was in the obligation, and more so when he to whom satisfaction ought to be made can reject all satisfaction, and especially when he himself appoints the sponsor and in him reconciles himself with his enemies, all of which obtain here. Hence fall: 1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.). 2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)? 3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God. 4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said. V. …its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice. VI. …The price offered is the whole Christ, ἑαυτὸν ἔδωκεν [he gave himself], etc. For between the person who would make satisfaction and the one to whom it would be made, there ought to be proportion and order, since the nature of the latter demands the rigor of justice (by Theses 2 and 3). For this reason, Christ, a divine person, submitted himself to the whole Trinity, becoming obedient unto death (Phil 2:8)… It was necessary for Christ to bear these punishments for us in this way, since he took our guilt upon himself and was made our sponsor. I deny, therefore, that Christ was able to make satisfaction by a single drop of blood…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“III. …But what can man do for this? His demerit is infinite (by the previous thesis). But the moral value of human actions is only finite, for the act cannot exceed the dignity of its principle. Moreover, in personal offenses, such as this one, there ought to be order and proportion between the one making satisfaction and the one to whom it is made, but this is far less between God and man than between a king and the vilest slave. IV. …Indeed, so far is gratuitous remission of sins from being opposed to this satisfaction, that it cannot but have a place in that satisfaction (such as this one is) where another pays and something else is paid than he who was and what was in the obligation, and more so when he to whom satisfaction ought to be made can reject all satisfaction, and especially when he himself appoints the sponsor and in him reconciles himself with his enemies, all of which obtain here. Hence fall: 1. The mimicry of the Socinians arguing against the satisfaction of Christ from the gratuitous remission made to us, and refuting our arguments for it (see Socinus, De Servatore, part 3, ch. 2, and Praelections ch. 117, §5; Volkelius and Gitichius ibid.). 2. Their argument from Eph 4:32 that we ought to forgive our brothers as God has forgiven us. Right! Gratuitous remission has come about for us, but on account of Christ’s satisfaction “in Christ” (as the Apostle adds there), through whose blood we have remission of sins from the riches of divine grace (Eph 1:7). Indeed, what is clearer for the possibility of composing most strict satisfaction and gratuitous remission than the example of Paul entreating remission for Onesimus and offering his own payment (Philem 10,12,18-19)? 3. Nor is the transfer of our obligation to Christ repugnant to divine justice (as Socinus argues, part 3, ch. 3). It is indeed essential to sin that it be set in order through punishment, but it is not essential that it be vindicated in the very one who sinned. For God is placated provided that esteem is restored to him and his laws satisfied (for in these he was injured, by Thesis 1). But this is done through Jesus Christ; indeed, it can be done through him alone, because he alone has order and proportion with God. 4. Nor does it oppose the truth of [God’s] threats (as Socinus ibid.), since that too is preserved provided that someone sponsors for those who sinned. They indeed have this from transgression, that they are under obligation to punishments, but it is not required that the transgression actually be vindicated in them, as was just said. V. …its power and value flowed from the divine. Christ our Lord freely, willingly and lawfully undertook this sponsorship (Ps 40:8, Heb 10:9), for he was Lord of his life and had the power of laying it down (John 10:18). It was also of his dignity, that he was most apt for satisfying the rigor of justice. VI. …The price offered is the whole Christ, ἑαυτὸν ἔδωκεν [he gave himself], etc. For between the person who would make satisfaction and the one to whom it would be made, there ought to be proportion and order, since the nature of the latter demands the rigor of justice (by Theses 2 and 3). For this reason, Christ, a divine person, submitted himself to the whole Trinity, becoming obedient unto death (Phil 2:8)… It was necessary for Christ to bear these punishments for us in this way, since he took our guilt upon himself and was made our sponsor. I deny, therefore, that Christ was able to make satisfaction by a single drop of blood…”

— Johannes Hoornbeeck, ‘Theological Disputation on the Satisfaction of Christ’ tr. by AI by Onku (Utrecht, 1650) Latin">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+%E2%80%A6But+what+can+man+do+for+this%3F+His+demerit+is+infinite+%28by+the+previous+thesis%29.+But+the+moral+value+of+human+actions+is+only+finite%2C+for+the+act+cannot+exceed+the+dignity+of+its+principle.+Moreover%2C+in+personal+offenses%2C+such+as+this+one%2C+there+ought+to+be+order+and+proportion+between+the+one+making+satisfaction+and+the+one+to+whom+it+is+made%2C+but+this+is+far+less+between+God+and+man+than+between+a+king+and+the+vilest+slave.+IV.+%E2%80%A6Indeed%2C+so+far+is+gratuitous+remission+of+sins+from+being+opposed+to+this+satisfaction%2C+that+it+cannot+but+have+a+place+in+that+satisfaction+%28such+as+this+one+is%29+where+another+pays+and+something+else+is+paid+than+he+who+was+and+what+was+in+the+obligation%2C+and+more+so+when+he+to+whom+satisfaction+ought+to+be+made+can+reject+all+satisfaction%2C+and+especially+when+he+himself+appoints+the+sponsor+and+in+him+reconciles+himself+with+his+enemies%2C+all+of+which+obtain+here.+Hence+fall%3A+1.+The+mimicry+of+the+Socinians+arguing+against+the+satisfaction+of+Christ+from+the+gratuitous+remission+made+to+us%2C+and+refuting+our+arguments+for+it+%28see+Socinus%2C+De+Servatore%2C+part+3%2C+ch.+2%2C+and+Praelections+ch.+117%2C+%C2%A75%3B+Volkelius+and+Gitichius+ibid.%29.+2.+Their+argument+from+Eph+4%3A32+that+we+ought+to+forgive+our+brothers+as+God+has+forgiven+us.+Right%21+Gratuitous+remission+has+come+about+for+us%2C+but+on+account+of+Christ%E2%80%99s+satisfaction+%E2%80%9Cin+Christ%E2%80%9D+%28as+the+Apostle+adds+there%29%2C+through+whose+blood+we+have+remission+of+sins+from+the+riches+of+divine+grace+%28Eph+1%3A7%29.+Indeed%2C+what+is+clearer+for+the+possibility+of+composing+most+strict+satisfaction+and+gratuitous+remission+than+the+example+of+Paul+entreating+remission+for+Onesimus+and+offering+his+own+payment+%28Philem+10%2C12%2C18-19%29%3F+3.+Nor+is+the+transfer+of+our+obligation+to+Christ+repugnant+to+divine+justice+%28as+Socinus+argues%2C+part+3%2C+ch.+3%29.+It+is+indeed+essential+to+sin+that+it+be+set+in+order+through+punishment%2C+but+it+is+not+essential+that+it+be+vindicated+in+the+very+one+who+sinned.+For+God+is+placated+provided+that+esteem+is+restored+to+him+and+his+laws+satisfied+%28for+in+these+he+was+injured%2C+by+Thesis+1%29.+But+this+is+done+through+Jesus+Christ%3B+indeed%2C+it+can+be+done+through+him+alone%2C+because+he+alone+has+order+and+proportion+with+God.+4.+Nor+does+it+oppose+the+truth+of+%5BGod%E2%80%99s%5D+threats+%28as+Socinus+ibid.%29%2C+since+that+too+is+preserved+provided+that+someone+sponsors+for+those+who+sinned.+They+indeed+have+this+from+transgression%2C+that+they+are+under+obligation+to+punishments%2C+but+it+is+not+required+that+the+transgression+actually+be+vindicated+in+them%2C+as+was+just+said.+V.+%E2%80%A6its+power+and+value+flowed+from+the+divine.+Christ+our+Lord+freely%2C+willingly+and+lawfully+undertook+this+sponsorship+%28Ps+40%3A8%2C+Heb+10%3A9%29%2C+for+he+was+Lord+of+his+life+and+had+the+power+of+laying+it+down+%28John+10%3A18%29.+It+was+also+of+his+dignity%2C+that+he+was+most+apt+for+satisfying+the+rigor+of+justice.+VI.+%E2%80%A6The+price+offered+is+the+whole+Christ%2C+%E1%BC%91%CE%B1%CF%85%CF%84%E1%BD%B8%CE%BD+%E1%BC%94%CE%B4%CF%89%CE%BA%CE%B5%CE%BD+%5Bhe+gave+himself%5D%2C+etc.+For+between+the+person+who+would+make+satisfaction+and+the+one+to+whom+it+would+be+made%2C+there+ought+to+be+proportion+and+order%2C+since+the+nature+of+the+latter+demands+the+rigor+of+justice+%28by+Theses+2+and+3%29.+For+this+reason%2C+Christ%2C+a+divine+person%2C+submitted+himself+to+the+whole+Trinity%2C+becoming+obedient+unto+death+%28Phil+2%3A8%29%E2%80%A6+It+was+necessary+for+Christ+to+bear+these+punishments+for+us+in+this+way%2C+since+he+took+our+guilt+upon+himself+and+was+made+our+sponsor.+I+deny%2C+therefore%2C+that+Christ+was+able+to+make+satisfaction+by+a+single+drop+of+blood%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+%E2%80%98Theological+Disputation+on+the+Satisfaction+of+Christ%E2%80%99+tr.+by+AI+by+Onku+%28Utrecht%2C+1650%29+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbb155ef1e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bb155ef1e3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-necessity-of-the-atonement/#:~:text=But%20what%20can%20man%20do%20for,by%20a%20single%20drop%20of%20blood&amp;text=But%20what%20can%20man%20do%20for%20this%3F%20His&amp;text=make%20satisfaction%20by%20a%20single%20drop%20of%20blood" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

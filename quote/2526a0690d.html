<main class="wrap"><figure class="quote" id="q-2526a0690d" data-kw="">
<blockquote><p>And although the covenant of grace be stable and effectual unto all who are really partakers of it, yet as unto its external administration, and our entering into it by a visible profession, it may be broken, unto the temporal and eternal ruin of persons and whole churches.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c7372b0c9" data-kw="Perseverance Comfort">
<blockquote><p>Christ your Head is risen, therefore you cannot be lost: nay, he is not only risen from the dead himself, but is also &quot;become the first-fruits of them that slept,&quot; 1 Cor. 15: 20. Believers are his members, his fulness, he cannot therefore be complete without you: a part of Christ cannot perish in the grave, much less burn in hell. Remember, when you feel the natural union dissolving, that this mystical union can never be dissolved: the pangs of death cannot break this tye.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace</cite>, Sermon 2 (John 17:23), Inference 7</span></figcaption>

</figure><figure class="quote" id="q-5bb3907a8e" data-kw="">
<blockquote><p>The Lord has called you into the fellowship of His Son Jesus Christ, and by that act and deed He has put you into the place of infallible safeguard. If you are indeed a believer you are one with Jesus, and therefore you are secure. Do you not see that it must be so? You must be confirmed to the end until the day of His appearing, if you have indeed been made one with Jesus by the irrevocable act of God. Christ and the believing sinner are in the same boat: unless Jesus sinks, the believer will never drown.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>All of Grace</cite>, p. 89</span></figcaption>

</figure><figure class="quote" id="q-fa41277d16" data-kw="">
<blockquote><p>The communication of grace effectual, producing infallibly the good things proposed and promised in the minds and hearts of men, belonged not unto that covenant. If, therefore, there be no more in the making of the new covenant but only the adding of more forcible outward means and motives, more suitable unto our reasons, and meet to work on our affections, it differs only in some unassignable degrees from the former. But this is directly contrary unto the promise in the prophet, that it shall not be according unto it, or of the same kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:10; Works, vol. 22, p. 178</span></figcaption>

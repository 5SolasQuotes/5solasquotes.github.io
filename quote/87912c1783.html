<main class="wrap"><figure class="quote" id="q-87912c1783" data-kw="">
<blockquote><p>Strive after well-grounded Assurance of a good spiritual state. Labour not only, That God, Christ, Grace, and Glory may be yours: but also, That ye may know assuredly they are yours. Assurance is possible; For God’s Spirit is given to help us to it, &amp;c. Many have attained it.

Assurance is necessary: for God hath charged us to endeavour after it; Give diligence to make your calling and election sure, &amp;c. And Assurance is very comfortable, and advantageous to our Perseverance. This held up Job under all his misery. This cheered up Paul against approaching death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The chequer-work of God’s providences, towards His own people, made up of blacks and whites, viz., of their abasements, and advancements, their distresses, and deliverances, their sullying tribulations, and beautifying relaxations represented in a sermon preached at the funeral of that faithful serv</cite>, (London: G. Calvert, 1657), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy.html">Assurance, Peace and Joy</a></span></div>

</figure><figure class="quote" id="q-b54bc7e852" data-kw="">
<blockquote><p>For as it is in nature: first we are babes, &amp; then as we increase in years, so we grow in strength: so it is in the life of a Christian; first ordinarily he hath a weak faith, and after grows from grace to grace, till he come to stronger faith: and at the last he be able to say, he is fully assured in his heart and conscience of the pardon of his sins &amp; of reconciliation to God in Christ. And this assurance ariseth from many experiences and other blessings, which being deeply and duly considered bring a man to be fully persuaded, that God is his God, and God the father, his father, and Jesus Christ his redeemer, and the Holy Ghost his sanctifier.</p></blockquote>

</figure><figure class="quote" id="q-980d9f5504" data-kw="">
<blockquote><p>VIII. You will say, ‘How may I know that I am in a state of grace, since it is so important to discern this?’ Surely the apostle did not warn in vain that we should take care not to seem to have received the grace of God in vain (2 Cor 6:1). But they have received it in vain, who, seeming to have received it, either experience or show no power of it, or even fall away from that which they seemed to have received (Heb 12:15). Therefore you will know in this way that you are what you profess:

      1. If you know through faith that you are in Christ, the fount and origin of grace (Rom 5:1 – Therefore, since we have been justified by faith, we have peace with God through our Lord Jesus Christ, 8:1 – There is therefore now no condemnation for those who are in Christ Jesus).

      2. From a sense of reconciliation with God in your soul, whence also we approach the throne of grace with confidence (Rom 4:16, Luke 1:30 – you have found favor with God, Acts 7:46).

      3. From the testimony of the Holy Spirit certifying the soul of it (Rom 8:16, Eph 4:30).

      4. Finally from the holiness of life agreeing with the state of grace. For grace is a sanctifying grace, and is so incompatible with sin that the kingdom of grace and of sin cannot abide in the same seat, nor can anyone be at the same time under grace and under sin (Rom 6:14 – For sin will have no dominion over you, since you are not under law but under grace, v.22 – But now that you have been set free from sin and have become slaves of God, the fruit you get leads to sanctification). Jude v. 4 – ungodly people, who pervert the grace of our God into sensuality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-hoornbeeck.html">Johannes Hoornbeeck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Satisfaction of Christ’</cite>, (Leiden: Johann Elsevir, 1664) Latin</span></figcaption>

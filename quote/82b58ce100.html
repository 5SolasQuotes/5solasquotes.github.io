<main class="wrap"><figure class="quote" id="q-82b58ce100" data-kw="">
<blockquote><p>3. We neither have, nor can have here in flesh, any one proper formal conception of the Divine nature that is formally suited to the truth in the object, but only metaphorical or analogical conceptions borrowed from things better known. 4. Yet nothing beyond sense (at least) is so certainly known as God, so far as we can reach, though nothing be less perfectly or more defectively known, or less comprehended. Even as we know nothing visible more certainly than the sun, and yet comprehend nothing visible less. … 7. God is here seen in the glass of His works, with the revelation of His Word and Spirit. And from these works we must borrow our conceptions. 8. Therefore, though the thing intended when we speak of God be transcendently and only in Him, and not in the creature, yet the first use of the words is to signify something in the creature. And therefore the creature is the famosius analogatum, though nothing to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology (London: White, 1675), sect. 1, ‘Of our Knowledge of God as here Attainable’</cite>, p. 1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d532074d1" data-kw="">
<blockquote><p>I subscribe to that of Clement of Alexandrinia: We ought not to swear allegiance to any sect of philosophers, whether Stoics, Epicures, Platonists, or Peripatetics, but we must select and embrace whatsoever is true and faithfully delivered concerning God by any sect; and the Truth selected out of all sects is not vain philosophy, but Natural Divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Triunity of the Father, Son, and Holy Spirit</cite></span></figcaption>

</figure><figure class="quote" id="q-000930b8b9" data-kw="">
<blockquote><p>The theology of Christians approves the teachings of philosophy if they are true, correct, and salutary. It uses them by its own right and makes them catholic. If they are too unclear, it sheds light on them; if they are mixed with harmful errors, it separates the precious from the cheap and keeps the one and destroys the other.</p></blockquote>

</figure><figure class="quote" id="q-35466486f9" data-kw="">
<blockquote><p>The telos of a thing or process is the end or goal toward which it points… Naturalists generally hold that teleological descriptions of natural phenomena are either false or, if true, are reducible to descriptions cast in non-teleological terms. Non-naturalists generally hold that at least some natural phenomena exhibit irreducible teleology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 2, ‘Teleology: a Shopper’s Guide’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 28-49</cite>, p. 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-de69b506c5" data-kw="">
<blockquote><p>Therefore, our doctrine is that in elenctic theology, or in the refutation of falsehood, e.g. Purgatory, indulgences, etc, discourse and consequences are to be employed. And if it is the case that a resolute adversary denies them, then the proving of consequences is also to be employed, not only from the Holy Bible, but also from the axioms and principles of the light of nature, known either naturally or technically, from Philosophy and Logic, so that the suitable connection of the middle term with the major term is apparent. The truth of doctrines, rather, or of middle terms, and the connection of the middle term with the minor, is to be demonstrated either from the express words, or equivalent ones, or the good consequence, of Scripture alone (except if the doctrines belong to natural theology, which are proven from Scripture primarily, and also from the light of nature secondarily).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Selectarum Disputationum Theologicarum Pars Prima (Utrecht: Apud Joannem Waesberge, 1658), pp. 3-4 &amp; 7 as quoted in Johannes Hoornbeeck, ch. 1, ‘On Theology’ in Institutions of Theology Set in Order from the Best Authors (1658) tr. Charles Johnson</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

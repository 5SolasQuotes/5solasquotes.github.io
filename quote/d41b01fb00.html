</figure><figure class="quote" id="q-22c305050e" data-kw="">
<blockquote><p>Althought God is not manifest to the senses comprehensively as he is in himself, yet he can be perceived apprehensively as shining in his works, appearing in signs, heard in the word and manifested in the fabric of the whole universe. (2) It is a false assumption that there is nothing in the intellect which was not before in some sense. For universals are in the intellect and never were in any sense. A mind is known as also an angel, yet they are never pereceived or seen except from their effects. Why therefore may not God be most certainly known in the mind from his works and a posteriori, although we cannot perceive Him with our eyes or any of the other bodily senses.</p></blockquote>

</figure><figure class="quote" id="q-dc78cdef29" data-kw="">
<blockquote><p>A distinction is real (simply real) if it exists between thing and thing, for example between body and soul, between the members of the body, between cause and effect, between a faculty and its operation, between substance and accidents. A thing, at least according to Scotists, is whatever exists or can exist per se (i.e. through its own existence), and hence, if it is created, it can be directly and immediately produced by physical causality. The sign of a real distinction is separability or actual separation. Thomists, on the contrary, deny that separability is required for having a real distinction. So they say, for example, that faculties are really distinct from the soul though they cannot be separated from it. One must say the like of their real distinction between essence and existence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alan-b-wolter.html">Alan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), ch. 2, On the Attributes in General &amp; on ‘One”, Article 4, ‘On Identity &amp; Distinction’</cite>, p. 30</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

<blockquote><p>to children lacking the use of reason, who cannot distinguish between spiritual and bodily food, the Eucharist should not be given, although some of the Byzantines maintain the opposite, though irrationally: because actual devotion is required for the consumption of the Eucharist, which children of that age cannot have. However, once children have begun to have discretion, even before the age of maturity, for example when they are ten or eleven years old, or around then, it can be given to them, if signs of discretion and devotion appear in them… Baptized infants acquire the right to receive the body of Christ, not right away though, but at the fitting time;” (Sentences, bk. 4, dist. 9, q. 1, art. 5, resp. to Quaestiuncula 4) For the Reformed: ‘Paedocommunion’. . Contra Intinction Thomas: “Here he [Peter Lombard] considers… how it should be distributed now, at: ‘And the Eucharist is not to be given by intinction to the people ‘as a supplement of communion.”” (Sentences, bk. 4, dist. 11) On the Reformed: ‘Intinction’. . Disagreements Rome’s Supper is Not Valid &amp; is Not to be Received by Christians, or Attended apart from Necessity Needless to say, Thomas held the Roman Supper to be valid and ethically obliging to receive. The Reformed held the mass to be invalid (as it involved the formal idolatry of worshipping the creature, bread and wine), that it was sinful to receive from a priest, and that the mass ought not to be attended apart from necessity: ‘Why is Romish Baptism Valid but the Supper Not to be Received by a Romish Priest?’ ‘On the Mass &amp; Transubstantiation’ ‘On Attending the Mass’ . Only Ministers may Administer, even in “Necessity</p></blockquote>

<main class="wrap"><figure class="quote" id="q-112da71237" data-kw="">
<blockquote><p>Indeed, from the different mode in which Scotus speaks here of God’s concurrence toward the act of sin, it entirely follows that this is an exception to that general rule [according to Macedo] — namely, that God both predefines from eternity and predetermines in time antecedently all good acts of the will; and only with respect to evil and sinful acts does he behave differently — that is, not by determining antecedently, but by awaiting the action of the deficient and sinning will. If we establish this by proving it, we establish the doctrine of Scotus on the subordination of causes, and we marvelously reconcile it with the doctrine of the Council of Trent — as we will demonstrate afterward — which teaches against Calvin and the other innovators that God concurs in a different mode with the good and meritorious act than with the evil and demeritorious one. [Yet the Reformed affirm this, ignoring the part about meriting.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Concurrence with Evil Actions | Difference with the Reformed</cite>, p. 420</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9b496daf9c" data-kw="Author of sin">
<blockquote><p>Every action, as such, is undoubtedly good, it being an actual exertion of those operative powers given us by God for that very end; God therefore may be the Author of all actions (as He undoubtedly is), and yet not be the Author of evil. … Suppose a boy, who knows not how to write, has his hand guided by his master and nevertheless makes false letters, quite unlike the copy set him, though his preceptor, who guides his hand, is the cause of his writing at all, yet his own ignorance and unskilfulness are the cause of his writing so badly. Just so, God is the supreme Author of our action, abstractedly taken, but our own vitiosity is the cause of our acting amiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Absolute Predestination</cite>, tr. Augustus Toplady, on the omnipotence of God</span></figcaption>

</figure><figure class="quote" id="q-203bb6b5d2" data-kw="Author of sin">
<blockquote><p>Although the premotion of God is extended to evil actions, it does not on that account make God guilty of the fault or the author of sin. It only pertains to actions inasmuch as they are material and entitative (entitative), not however as they are moral, i.e., to the substance of the act, but not to its wickedness. … The magistrate is the cause of the death inflicted on the guilty person by the executioner, but is not the cause of the cruelty exhibited in that execution; the harp player is the cause of the sound, but not of the dissonance arising from the strings; and he who drives a lame horse is the cause of the motion, but not the lameness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.5.16</span></figcaption>

</figure><figure class="quote" id="q-4e185def0a" data-kw="">
<blockquote><p>…the Thomists, with whom — with one exception — we Scotists who wish to be true disciples of Scotus agree. Therefore all the schools agree that Durand’s [pure free will] opinion is absurd, and they posit that God concurs immediately with the effects of his creatures — both necessary and free — through one and the same action. They likewise assert concordantly the subordination and dependence of created causes upon God, and they do not deny that God concurs in the material element — that is, the physical entity of the sinful act — without concurring in the formal element of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Agreements</cite>, p. 373</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/concurrence.html">Concurrence</a></span></div>

</figure><figure class="quote" id="q-c0e0efefee" data-kw="">

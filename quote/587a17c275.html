<blockquote><p>The meaning of the words: which was conceived by the holy Ghost, born of the virgin Mary.

The meaning is, that the everlasting Son of God of the same substance with the Father, without any putting off, of his divine nature, without any conversion or commixtió, was made that which he first was not, to wit man, which the Scripture interpreteth.

He took the seed of Abraham, that is our flesh of the virgin Marie, and his very human soul, and that by the power of the holy Ghost, that he might be like unto his brethren in all things, sin only excepted, Joh. 1. And to the Hebr. 2. and the fourth: 1 Tim. 3. Rom. 1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol of the Apostles</cite>, trans. John Field (London: Thomas Man, 1581), p. 137.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03c94e9d27" data-kw="">
<blockquote><p>It is likely that Boethius (480-524) inaugurates, in Latin Christian theology, the consideration of personhood as such… a person is an individual substance of a rational nature… This chapter situates Boethius in relation to significant Christian theologians before and after him… In contemporary philosophy, there is a lot of attention paid to the rationality condition for personhood. But if we look at the text in which Boethius defines a person, we do not find any precise criteria for it… The intrusion of personhood into contemporary applied ethics with a focus on detailed and disputed criteria for rationality as a condition for personhood seems to be a modern development. From a Patristic and Medieval Christian theology point of view, trying to find just the right detailed criteria for rationality in order to define personhood is a wild goose chase… The chapter consists of six sections… 1. Origen of Alexandria and the Cappadocians: Basil of Caesarea and Gregory of Nyssa 2. Miaphysites: Severus of Antioch, John Philoponus, and Peter of Callinicum 3. Boethius and Rusticus the Deacon: Rationality, Subsistence, and the Invention of Personhood 4. Neo-Chalcedonians (II): Leontius of Byzantium and John of Damascus 5. Scholastic Neo-Chalcedonians (I): Gilbert of Poitiers, Richard of St. Victor,William of Auxerre, Alexander of Hales, Bonaventure, Thomas Aquinas, andWilliam of Ware 6. Scholastic Neo-Chalcedonians (II): Henry of Ghent, John Duns Scotus, andWilliam of Ockham</p></blockquote>

</figure><figure class="quote" id="q-0a469670f9" data-kw="">
<blockquote><p>So profound a repugnance to death and all that death meant,manifesting itself during his life, could not fail to seize upon him with peculiar intensity at the end. If the distant prospect of his sufferings was a perpetual Gethsemane to Him, the immediate imminence of them in the actual Gethsemane could not fail to bring with it that “awful and dreadful torture” which Calvin does not scruple to call the “exordium” of the pains of hell themselves. Matthew and Mark almost exhaust the resources of language to convey to us some conception of our Lord’s “agony”¹ as an early interpolator of Luke (Lk. xxii. 44) calls it, in this dreadful experience. The anguish of reluctance which constituted this “agony” is in part described by them both—they alone of the Evangelists enter into our Lord’s feelings here—by a term the primary idea of which is loathing, aversion, perhaps not unmixed with despondency.² ¹ [Greek] agonia: see G. Heine, Synonymik etc., 1898, p. 189: “Contest, quaking, agitation (and anxiety of the issue?) Lk. xxii. 44; Luther, ‘he grappled with death’, Weizsacker, ‘he struggled’, Bengel; ‘supreme grief and anguish. It properly denotes the anguish and passion of the mind, when it enters upon a conflict and arduous labor, even when there is no doubt of a good issue’.” Plummer in loc.: “Field contends that fear is the radical notion of the word. The passages in which it occurs in LXX confirm this view… It is therefore an agony of fear that is apparently to be understood.” It would be better to say consternation, appalled reluctance. ² [Greek] ademoneo: see Heine, Synonymik etc., 1898, p. 148: “pavesco, angor.” Cf. Lightfoot, on Phil. ii. 26: ” The primary idea of the word will be loathing and discontent.” “It describes the confused, restless, half-distracted state, which is produced by physical discouragement, or by mental distress, or grief, shame, disappointment, etc.” Lagrange on Mk. xviii. 33: “seized with despondency”. Thomas Goodwin (Works, v. 276): “so that we see Christ’s soul was sick and fainted,” “his heart failed him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’</cite>, (1912), pp. 74-76</span></figcaption>

<main class="wrap"><figure class="quote" id="q-eaeabaa2c8" data-kw="">
<blockquote><p>If any Reader should now be so unhappy in his charity as to calumniate this discovery of heresies and blasphemies to be an arrow subtly designed against holiness and good men: to such a one, all that I would reply is this; 1. The surest friends to holiness have been the sharpest enemies to errors; Christ and his Apostles were so. 2. That I never yet have learned what direct advantage did at any time redound to true sanctity, by a patient endurance of heresy and blasphemy. 3. Nor can I be so uncharitable as to think, that any person sincerely holy, or intending the progress of holiness, durst be a friend to such damnable and soul-destroying errors.

The design which I would commend to all in this time of Reformation, is this, That truth and holiness (which are so naturally combined, and so mutually interested) may be conscientiously promoted with equal zeal: encourage holiness, but contend for the truth too: maintain the truth, but countenance holiness too: he who pretends holiness, but regards not truth; and he who pretends the truth, but regards not holiness, neither of these is a cordial friend either to truth or holiness.

For your parts (Right Honourable) be you pleased to go on (as you have begun) in the strenuous support of them both: Both of them have a necessary respect to God’s glory: both of them have a necessary respect to man’s salvation: both of them have a necessary respect to our present Reformation: both of them will prove the Kingdom’s safety, your consciences comfort, and the crown of all your long and great labours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/obadiah-sedgwick.html">Obadiah Sedgwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The nature and danger of heresies: opened in a sermon before the Honourable House of Commons, January 27. 1646. at Margaret’s Westminster, being the day of their solemn monthly fast</cite>, (London: Samuel Gellibrand, 1647), to the Honourable the House of Commons now assembled in Parliament.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life.html">The Christian Life</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-26c2da0923" data-kw="">
<blockquote><p>Though the Old Testament rites after Christ’s death were called “the commandments and doctrines of men” (Col. 2:22), just as the sort that Jesus condemns in Mt. 15:2–9, yet Paul and the Christians did not put any opinion of holiness in these rites or opinion of necessity beyond their nature or what derived from the circumstances (though others did). Paul and the Christians used these material, inconvenient and scandalous (in some way) ceremonies in accord with nature’s light, Christian prudence and the Word’s general rules for the greater good: “Unto the pure all things are pure” (Tit. 1:15).</p></blockquote>

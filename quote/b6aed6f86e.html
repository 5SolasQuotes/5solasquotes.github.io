<blockquote><p>Labour to be more and more humble, and sensible of your own vileness. Self-abasing is the lifting up of Christ. The spirit that stoopeth lowest is best prepared to become a throne for Christ. For thus saith the High and lofty one that inhabiteth eternity, whose Name is holy; I dwell in the high and holy place, with him also that is of a contrite and humble spirit. This may seem strange that the highest place in heaven, and the lowest hearts on earth should be the fittest thrones for Christ.

And why? the heart that is lowest in humility, is highest in excellency in his esteem: the spirit that is lifted up to the greatest height of pride, is lowest for vileness and baseness in his account, God resisteth the proud, because they lift up themselves against His royal Majesty, and giveth grace to the humble, because they yield him subjection. Humility maketh way for more grace, and so for more full subjection unto Christ. They that delight to lie at the footstool of Christ in humility, shall see Christ sitting in the throne of their hearts, &amp; shall be exalted to sit with Christ in his throne of glory.</p></blockquote>

<blockquote><p>The Greek word κατηχησις (catechesis) is derived from κατηχεω (catecheo), as κατχισμος (catechismos) is from κατχιζω (catechizo). Both words, according to their common signification, mean to sound, to resound, to instruct by word of mouth, and to repeat the sayings of another. κατηχεω (catecheo) more properly, however, signifies to teach the first principles and rudiments of some particular doctrine. As applied to the doctrine of the church, and as understood when thus used, it means to teach the first principles of the Christian religion, in which sense it occurs in Luke 1:4, Acts 18:25, Galatians 6:6, etc. Hence, catechesis in its most general and comprehensive sense, means the first brief and elementary instruction which is given by word of mouth in relation to the rudiments of any particular doctrine. As used by the church, however, it signifies a system of instruction relating to the first principles of the Christian religion, designed for the ignorant and unlearned.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Corpus Doctrinae Orthodoxae on Heidelberg Catechism Q. 30</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>8. Does the fourth commandment require the observance of the seventh day of the week, or Saturday, as the Sabbath? No. It is of course true, as a matter of that the Old Testament Sabbath was on the seventh day of the week, but the fourth commandment does not require this. It commands diligent labour for six days, but does not specify on what day the week is to begin. The fourth commandment requires that the seventh day after six days of labour be observed as the Sabbath, but this does not imply that it must necessarily be on the seventh (or last) day of the week. The requirement of the commandment is met by the Christian practice of working from Monday through Saturday (six days) and then observing the first day of the foIlowing week as the Sabbath.

9. Why was the Old Testament Sabbath the seventh day of the week? The Old Testament Sabbath was the seventh (last) day of the week because of God’s example and ordinance at the time of the creation (Gen. 2:1-3). Apart from providing an appointed day for rest and worship, the Sabbath served as a reminder of God’s work of creation. This truth of creation, of course, implies that all things, including human beings, are absolutely dependent on God for their very existence. It also implies that human beings are morally responsible to God for their lives. Thus the weekly Sabbath, commemorating the creation, was calculated to serve as a continually repeated reminder of man’s dependence on God and his moral accountability to God, which is to say that the Sabbath was calculated to serve as a constant reminder of the very foundations of religion and morality.

10. Why is the Christian Sabbath on the first day of the week? The Christian Sabbath, or the Lord’s Day is on the first day of the week in remembrance of Christ’s resurrection from the dead. Thus it may he said that the Old Testament Sabbath commemorated God’s original creation, while the Christian Sabbath in addition calls attention to God’s new creation, his great work of redemption in Jesus Christ.

11. Who changed the day of the Sabbath from the seventh to the first day of the week? Our Lord Jesus Christ, by the accomplishment of his great redemptive work, brought about the close of the Old Testament dispensation and the opening of the New Testament dispensation of the covenant of grace. The change from the seventh to the first day of the week is a part of this change of dispensation. It has been observed that our Saviour was crucified on the sixth day of the week, and buried on the evening of the sixth day, and remained in the tomb the whole of the seventh day, and arose from the dead on the first day of the week. Thus Christ buried the Old Testament seventh day Sabbath in the tomb with himself; and left it there, and when he arose he brought with him the New Testament Sabbath, which is to he observed on the first day of the week.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), pp 323-24.</span></figcaption>

<blockquote><p>…there being no greater affront to God in the world, nor any thing more destructive to ourselves, than thus presumptuously to sin both against Him and our own souls by presenting ourselves before Him so directly contrary to his nature and commands; for He has taken such care that his worship should be free from all such mixtures of hatred and malice, that He will rather for a time dispense with his worship itself and have it deferred than endure that it should be thus unduly performed: ‘For if thou bring thy gift to the altar, and there remember that thy brother has ought against thee, leave there thy gift before the altar, first, be reconciled unto thy brother, and then come and offer thy gift.’ (Mt. 5:23-24) Whereby it appears that the performance of any outward service unto God, without Love to our brother, is very displeasing unto Him, who requires mercy rather than sacrifice at our hands: For if the gift, when brought to the altar, must rather be left there than offered up, sure there can be no acceptance or reconciliation with God, unless we be also reconciled unto our brother, because that this must be done before the other can be begun. How many then have offered not only fruitless, but abominable sacrifices unto Him, and instead of pacifying, have but the rather provoked Him, nay, and have with all earnestness, even besought Him to ruin and destroy them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-jekyll.html">Thomas Jekyll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Peace &amp; Love Recommended &amp; Persuaded in Two Sermons</cite>, … (1675) Jekyll (d. 1698) was an Anglican minister.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…there being no greater affront to God in the world, nor any thing more destructive to ourselves, than thus presumptuously to sin both against Him and our own souls by presenting ourselves before Him so directly contrary to his nature and commands; for He has taken such care that his worship should be free from all such mixtures of hatred and malice, that He will rather for a time dispense with his worship itself and have it deferred than endure that it should be thus unduly performed: ‘For if thou bring thy gift to the altar, and there remember that thy brother has ought against thee, leave there thy gift before the altar, first, be reconciled unto thy brother, and then come and offer thy gift.’ (Mt. 5:23-24) Whereby it appears that the performance of any outward service unto God, without Love to our brother, is very displeasing unto Him, who requires mercy rather than sacrifice at our hands: For if the gift, when brought to the altar, must rather be left there than offered up, sure there can be no acceptance or reconciliation with God, unless we be also reconciled unto our brother, because that this must be done before the other can be begun. How many then have offered not only fruitless, but abominable sacrifices unto Him, and instead of pacifying, have but the rather provoked Him, nay, and have with all earnestness, even besought Him to ruin and destroy them?”

<blockquote><p>I am taught by the… passage to give no unnecessary outrage to the customs, whether of my age or neighborhood — such customs as, however ephemeral or however local, cannot be violated without a moral hardihood and defiance on the part of the transgressor, and without scandalizing the observers of the offensive exhibition. To estimate the force of this remark, let us but think of how much and what evil would be implied and wrought if the men of our day were to commence the practice of sitting in Church with their hats on, and the women with their bonnets off. Our existing habit, which is a second nature, would cause us to feel that it were a shameful thing in the reckless few who dared such an innovation, and so as to warrant the interference of the Church authorities on the subject. There is enough of analogy between the hats and the long hair to make the apostle’s earnestness on the subject of that liberty which he here reproves to be not altogether unintelligible:</p></blockquote>

</figure><figure class="quote" id="q-2bc022c4e9" data-kw="">
<blockquote><p>Restoration England [post-1660] witnessed a prolonged period of ecclesiastical persecution to stamp out religious nonconformists, but women responded to this suppression by stepping into more prominent and public roles… many nonconformist women earned the title of ‘nursing mothers’ through their public efforts to nurture and promote Protestant dissent in the face of fierce resistance… Scholars have often depicted Margaret [Baxter] as a paragon of Puritan virtue who fulfilled the traditional role of a wife. However, such depictions underemphasize the controversial nature of Margaret’s agency in her own time. Like the ‘nursing mothers,’ her activities broke with established norms for women. Her efforts to aid her husband in composing religious literature, patronize the illegal ministry of non-conformist pastors, establish schools for religious education, and set up charities, all drew significant criticism, since they lay outside the ‘appropriate’ private sphere of a woman. And yet Richard Baxter used his memorialization of her life (A breviate of the life of Margaret) to not only praise her public labors but also defend her against critics of her public role. By appealing to biblical examples of women who helped Paul in his ministry, he rebuked those who maligned her for not being content to stay at home. Thus, Margaret’s life does not simply shed additional light on how many women of the period achieved a greater space for female agency; rather, her memorialization in print provided English readers with a new, biblically defended image of how godly female piety could be fleshed out in the public realm.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/seth-d-osborne.html">Seth D. Osborne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Margaret Baxter, Richard Baxter &amp; the Defense of Women’s Public Role in Restoration England’</cite>, (2020) 25 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

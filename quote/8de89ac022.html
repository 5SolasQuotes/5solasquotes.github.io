<blockquote><p>1. This contract between God and the first Adam, is in sacred writ, expressly styled a covenant. “These are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” Here are two covenants mentioned, the one of which, genders to bondage, and the other, to liberty or freedom. The covenant of grace, or “The law of the Spirit of life in Christ Jesus,” is the one which genders to liberty, or which makes free from the law of sin and death. The one, therefore, which genders to bondage, must be that law or covenant of works, which was republished to the Israelites, from mount Sinai; which required perfect obedience to the ten commandments, on pain of death, and contained a promise of life, to the man who should do, or perform such obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Covenant of Works</cite>, 5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d4fed99d8" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what kind of sin there was in Adam’s desertion that enkindled God’s fearful vengeance against the whole of mankind. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper than sensual intemperance. The prohibition to touch the Tree of Knowledge of good and evil was a trial of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. …The promise, which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the Tree of Knowledge of good and evil, were meant to test and exercise his faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559), 2.1.4.</span></figcaption>

</figure><figure class="quote" id="q-242b7b10a2" data-kw="natural symbolic law">
<blockquote><p>The duty was partly general, partly special (according to the twofold law given to him: the moral or natural and the symbolic). The general was the knowledge and worship of God, justice towards his neighbor and every kind of holiness; the special was abstinence from the forbidden fruit (in which obedience to the whole law was contained as in a compendium and specimen). The former was founded on the law of nature not written in a book, but engraven and stamped upon the heart of man; the latter upon a symbolic and positive law, added to the natural for the trial of his obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 8.3.12</span></figcaption>

</figure><figure class="quote" id="q-46ebad6447" data-kw="">
<blockquote><p>XXV. Such a perfect observance of the laws of the covenant, up to the period which God had fixed for probation, had given man a right to the reward. Not from any intrinsic proportion of the work to the reward, as the grosser Papists proudly boast; but from God’s covenant and engagement, which was no ways unbecoming him to enter into. Nor had man, before the consummation of his obedience, even in the state of innocence, a right to life. He was only in a state of acquiring a right, which would at length be actually acquired, when he could say, I could have fulfilled the conditions of the covenant, I have constantly and perfectly done what was commanded; now I claim and expect that thou, my God, wilt grant the promised happiness. XXVI. How absurdly again do the Papists assert, that Adam, as he came from the hands of his Creator, had a right, as the adopted Son of God, to supernatural happiness, as to his paternal inheritance; which, according to Bellarmine, de Justificat. l. v. 17. “is due to the adopted Son of God, in right of adoption, previous to all good works.” But this is truly a preposterous way of reasoning. For the right of adoption belongs to the covenant of grace in Christ Jesus: “the adoption of children is by Jesus Christ,” Eph. 1:5. Besides, was this opinion true, good works could not be required, as the condition of acquiring a right to eternal life; but could only serve to prevent the forfeiture of the right of a son: by this means, the whole design of the covenant of works, and all the righteousness which is by the law, are quite destroyed. In fine, what can be more absurd, than the trifling manner in which these sophisters talk of the grace of adoption, as giving Adam a right to enter upon an heavenly inheritance, in a legal covenant: when, on the other hand, they so stiffly contend for the merits of works, under a covenant of grace. It is only there (to wit, under the covenant of grace) that we are to apply the above sentiment, that the inheritance is due to an adopted Son of God, in right of adoption, previous to all good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), 1.3.25–26 (vol. 1.47).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-8c2bdfc123" data-kw="">
<blockquote><p>I. God made a double covenant with man, the one of works and the other of grace; the former before, the latter after the fall. II. The covenant of works was confirmed by a double sacrament, to wit, the Tree of Life, and the tree of the knowledge of good and evil both being planted in the midst of paradise. III. They had a double use. 1. That man’s obedience might be tried, by using of the one, and abstaining from the other. 2. That the Tree of Life might ratify eternal happiness to those that should obey, but the Tree of Knowledge should signify to the disobedient, the loss of the greatest happiness and the possession of the greatest mercy. IV. Therefore the Tree of Life was so called, not from any innate faculty it had to give life, but from a sacramental signification. V. Likewise the Tree of Knowledge of good and evil, had this denomination from signifying the chief good and evil and from the event. VI. The happiness of man being yet in his integrity, consisted chiefly in the image of God. …XIV. Man even in respect of his body was immortal, but not simply, as though his body being composed of the elements could not be resolved into its principles, but by Divine Covenant; not as thought it could not die, but because it had a possibility not to die….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“I. God made a double covenant with man, the one of works and the other of grace; the former before, the latter after the fall. II. The covenant of works was confirmed by a double sacrament, to wit, the Tree of Life, and the tree of the knowledge of good and evil both being planted in the midst of paradise. III. They had a double use. 1. That man’s obedience might be tried, by using of the one, and abstaining from the other. 2. That the Tree of Life might ratify eternal happiness to those that should obey, but the Tree of Knowledge should signify to the disobedient, the loss of the greatest happiness and the possession of the greatest mercy. IV. Therefore the Tree of Life was so called, not from any innate faculty it had to give life, but from a sacramental signification. V. Likewise the Tree of Knowledge of good and evil, had this denomination from signifying the chief good and evil and from the event. VI. The happiness of man being yet in his integrity, consisted chiefly in the image of God. …XIV. Man even in respect of his body was immortal, but not simply, as though his body being composed of the elements could not be resolved into its principles, but by Divine Covenant; not as thought it could not die, but because it had a possibility not to die….”

— Johannes Wollebius, Compendium of Christian Theology.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+God+made+a+double+covenant+with+man%2C+the+one+of+works+and+the+other+of+grace%3B+the+former+before%2C+the+latter+after+the+fall.+II.+The+covenant+of+works+was+confirmed+by+a+double+sacrament%2C+to+wit%2C+the+Tree+of+Life%2C+and+the+tree+of+the+knowledge+of+good+and+evil+both+being+planted+in+the+midst+of+paradise.+III.+They+had+a+double+use.+1.+That+man%E2%80%99s+obedience+might+be+tried%2C+by+using+of+the+one%2C+and+abstaining+from+the+other.+2.+That+the+Tree+of+Life+might+ratify+eternal+happiness+to+those+that+should+obey%2C+but+the+Tree+of+Knowledge+should+signify+to+the+disobedient%2C+the+loss+of+the+greatest+happiness+and+the+possession+of+the+greatest+mercy.+IV.+Therefore+the+Tree+of+Life+was+so+called%2C+not+from+any+innate+faculty+it+had+to+give+life%2C+but+from+a+sacramental+signification.+V.+Likewise+the+Tree+of+Knowledge+of+good+and+evil%2C+had+this+denomination+from+signifying+the+chief+good+and+evil+and+from+the+event.+VI.+The+happiness+of+man+being+yet+in+his+integrity%2C+consisted+chiefly+in+the+image+of+God.+%E2%80%A6XIV.+Man+even+in+respect+of+his+body+was+immortal%2C+but+not+simply%2C+as+though+his+body+being+composed+of+the+elements+could+not+be+resolved+into+its+principles%2C+but+by+Divine+Covenant%3B+not+as+thought+it+could+not+die%2C+but+because+it+had+a+possibility+not+to+die%E2%80%A6.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Theology.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8c2bdfc123.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8c2bdfc123.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/01/sacraments-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

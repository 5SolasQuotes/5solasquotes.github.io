<main class="wrap"><figure class="quote" id="q-7f6fd69470" data-kw="">
<blockquote><p>I am not, however, so superstitious as to think that all visible representations of every kind are unlawful. But as sculpture and paintings are gifts of God, what I insist for is, that both shall be used purely and lawfully, that gifts which the Lord has bestowed upon us, for his glory and our good, shall not be preposterously abused, nay, shall not be perverted to our destruction. We think it unlawful to give a visible shape to God, because God Himself has forbidden it… Visible representations are of two classes, viz., historical, which give a representation of events, and pictorial, which merely exhibit bodily shapes and figures. The former are of some use for instruction or admonition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559), bk. 1, ch. 11, section 12 trans. Beveridge</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44abecf5a8" data-kw="">
<blockquote><p>The typical reformed view and practice was that the material church buildings of Romanists, when cleansed, may be repurposed for good uses (1 Tim. 4:4–5). On the more exceptional cases where a Romanist building had been so notoriously idolatrous and scandalous, the scandal not removing with the removal of the idolatry, the reformed typically destroyed the building wholly, not allowing it to be further used. The Separatists, as seen here, were generally for destroying all the buildings that had been used by Romanists, not thinking it lawful to repurpose the material goods. See [also] ‘On Church Buildings &amp; Architecture’ (RBO)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; 1644; RBO, 2025), p. 295 fn. 727</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-aed3423aa7" data-kw="">
<blockquote><p>It is true that the Lord occasionally manifested his presence by certain signs, so that He was said to be seen face to face; but all the signs He ever employed were in apt accordance with the scheme of doctrine, and, at the same time, gave plain intimation of his incomprehensible essence. For the cloud, and smoke, and flame, though they were symbols of heavenly glory (Dt. 4:11), curbed men’s minds as with a bridle, that they might not attempt to penetrate farther… The Holy Spirit appeared under the form of a dove, but as it instantly vanished, who does not see that in this symbol of a moment, the faithful were admonished to regard the Spirit as invisible, to be contented with his power and grace, and not call for any external figure? God sometimes appeared in the form of a man, but this was in anticipation of the future revelation in Christ, and, therefore, did not give the Jews the least pretext for setting up a symbol of Deity under the human form. The mercy-seat, also (Ex. 25:17-18, 21) where, under the Law, God exhibited the presence of his power, was so framed as to intimate that God is best seen when the mind rises in admiration above itself: the cherubim with outstretched wings shaded, and the veil covered it, while the remoteness of the place was in itself a sufficient concealment. It is therefore mere infatuation to attempt to defend images of God and the saints by the example of the cherubim. For what, pray, did these figures mean, if not that images are unfit to represent the mysteries of God, since they were so formed as to cover the mercy-seat with their wings, thereby concealing the view of God, not only from the eye, but from every human sense, and curbing presumption?… Moreover, all men of sound judgment acknowledge that the cherubim in question belonged to the old tutelage of the law. It is absurd, therefore, to bring them forward as an example for our age. For that period of puerility, if I may so express it, to which such rudiments were adapted, has passed away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 1, bk. 1, ch. 11, section 3, pp. 122-23</span></figcaption>

</figure><figure class="quote" id="q-7d61bfb3e3" data-kw="">
<blockquote><p>What is it to have other gods besides the true God? I fear upon search, we have more idolaters among us than we are aware of. (1) To TRUST in anything more than God, is to make it a god. If we trust in our RICHES, we make riches our God.… Money is his creator, redeemer, comforter: his creator, for if he has money, he thinks he is made; his redeemer, for if he is in danger, he trusts to his money to redeem him; his comforter, for if he is sad, money is the golden harp to drive away the evil spirit. Thus by trusting to money, we make it a god.… If we trust in THE ARM OF FLESH, we make it a god.… If we trust in our WISDOM, we make it a god.… If we trust in our MORALITY, we make it a god.… If we trust to our DUTIES to save us, we make them a god.… Use duty—but do not trust to it; for then you make it a god.… If we trust in our GRACE, we make a god of it. Grace is but a creature; if we trust to it we make it an idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (trust as heart idolatry)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-76b42ef2c0" data-kw="">
<blockquote><p>…especially seeing his Majesty [King Charles I] shall ever find that he has none more loyal and true subjects, who will more gladly employ and bestow their lives, lands, houses, holds, goods, gear, rents, revenues, places, privileges, means, moities and all, in his Highness’s service and mantainance of his royal crown; and moreover, have so deeply conceived a strong and full persuasion of his Majesty’s princely virtues, and much renowned propension to piety, and equity, that they will urge their consciences, by all good and lawful means, to assent unto every thing which he enjoins, as right and convenient; and when the just aversation [aversion] of conscience upon evident reasons is invincible, will notwithstanding be more willing to all other duties of subjection, and more averse from the least show of contempt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 2, ch. 1</cite>, pp. 12-13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0617859933" data-kw="">
<blockquote><p>5thly. I shall only propose one thing more to your consideration. Although the institutions and examples of the Old Testament, of the duty of magistrates in the things and about the worship of God, are not, in their whole latitude and extent, to be drawn into rules that should be obligatory to all magistrates now, under the administration of the gospel,-and that because the magistrate then was ‘custos, vindex, et administrator legis judicialis, et politiae Mosaicae,’ [the custodian, vindicator and administrator of the Judicial Law and Mosaic polity] from which, as most think, we are freed;–yet, doubtless, there is something moral in those institutions, which, being unclothed of their Judaical form, is still binding to all in the like kind, as to some analogy and proportion. Subduct [subtract] from those administrations what was proper to, ad lies upon the account of, the church and nation of the Jews, and what remains upon the general notion of a church and nation must be everlastingly binding.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Kingdom &amp; the Magistrate’s Power: a Sermon</cite>, p. 509</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</div>
</figure><figure class="quote" id="q-f18afe3f69" data-kw="">
<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened… (Edinburgh, 1655)</cite>, pp. 17-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

Lord%2C%20%E2%80%98Who%20is%20like%20unto%20thee" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-88f912c2be" data-kw="">
<blockquote><p>It’s the Law of Nature in general that the whole rule the part, but it follows not [that] therefore every member is to submit to every positive law of the whole though most unjust; the member is to submit to every Law of Nature commanded by the whole: The little finger infected with a gangrene is to submit to the whole man that it be cut off for the safety of the whole body, but its against particular nature that it be cut off, but most suitable to universal nature [regarding the whole]. So in the general it’s natural for the creature-rational to obey the Creator; but it follows not, but it’s a mere positive law that Peter give his life for the Gospel when God by a positive command calls him to it; and the law-positive, if divine, is not contrary to the law of universal-nature [of the whole].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church Discipline Penned by Mr. Thomas Hooker… (1658)</cite>, p. 461</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>…but I owe subjection of conscience to God solely, independently, and only… Yea, though crosses and afflictions work only upon us, as occasions, and external objects; yet are we to submit our conscience to them, as to warnings, because they be sent as God’s messengers appointed by Him, as Mic. 6:9, ‘Hear the rod, and who has appointed it.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, p. 135</span></figcaption>

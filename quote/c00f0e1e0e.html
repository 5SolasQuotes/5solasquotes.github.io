<main class="wrap"><figure class="quote" id="q-c00f0e1e0e" data-kw="">
<blockquote><p>In the era when the Irish Articles of Religion (1615) held sway, the Church of Ireland clearly believed in the regulative principle of worship. We find this principle stated in the writings of one of its greatest divines, Bishop George Downame of Derry:

For it is not sufficient to do that which is good, but we must be careful of the manner also, that it be well done. It is not sufficient to worship God in the parts of his worship; unless they be performed in that manner, which God hath prescribed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Grace or An Exposition upon Luke 1. 73.74.75</cite>, (Dublin, 1631), p. 68.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-8f3b6a7a39" data-kw="">
<blockquote><p>This very wholesome care for the faith and method of observance, namely, that in God’s temple and before the divine altar only the melody of divine eloquence be rehearsed, is most strongly commended to us also by the authority and examples of the Old Testament, as in the book of Chronicles where one reads that blessed David, king and prophet of God, first established in tabernacle or temple the choirs of Levites praising the Lord, and delivered to them by divine providence inspired utterances, psalms, hymns, and canticles, his own as well as those of others who prophesied along with him, and decreed that they should be sung both morning and evening amid the divine burnt offerings and sacrifices.

It is fitting that this custom, handed down from the holy prophets, preserved most carefully by the fathers who came afterward, even to the time of the New Testament, when it was necessary for that temple to be destroyed, it is fitting that this custom be continued with devout reverence. It is therefore especially needful that we truly desire to celebrate the divine praises without even the least offence and hesitation. …

There is therefore no doubt that each instructed believer will freely assent to such holy authority and such evident truth. But if any contentious and stubborn person attempts to disagree, and should wish to drink from a muddy stream rather than from the purest spring, he should take care that he not become ill with that most ruinous debility which a certain one of the ancient fathers wisely and briefly warned should be avoided, observing that when truth has been despised the one who imagines he is complying with custom is either envious and spiteful toward the brethren to whom truth is revealed or ungrateful toward God by whose inspiration His church is set in order.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/agobard-of-lyon.html">Agobard of Lyon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Divine Psalmody</cite>, (c. 384-88), trans. Allen Cabaniss in George E. McCracken (ed.), Early Medieval Theology, The Library of Christian Classics (Louisville KY: The Westminster Press, 1957), pp 365-66, 367.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-53dc81c98d" data-kw="">
<blockquote><p>But Jesus in this passage also asserts His own Lordship over the Sabbath. “The Son of man is Lord even of the Sabbath.” The title Son of man is distinctly Messianic and points to the dominion which He in His capacity as the Messiah exercises. It is in His capacity as the Son of man that He exercises this Lordship over the Sabbath. And this simply means that, within that universal Lordship and authority that is His as the one to whom all authority in heaven and earth has been committed, the Sabbath has its proper place and function. Abolition of it is, as B. B. Warfield says, “as far as possible from the suggestion of the passage.”

Further, we must observe that Jesus says “even of the Sabbath.” The presence of the word “even” serves to show the extent of Jesus’ Lordship. This Lordship is so comprehensive that it even includes the Sabbath, and surely such an emphasis discloses the high conception of its sanctity and authority Jesus entertained.

Finally, the reason assigned for this Lordship over the Sabbath is the fact that the Sabbath was made for man. It was for the sake of man that Jesus came into the world, it was for man’s sake that He died and rose again, it is for man’s sake that He is exalted as the Messiah to supreme mediatorial sovereignty. But it was also for man’s sake that the Sabbath was made. If, then, it was for man’s sake that Jesus came, and suffered, and died, and rose again to ascend up where He was before, is it possible that that which was made for man – the Sabbath – should be annulled and abrogated by that which He became and did for man’s sake?

There is complete congruity between His Messianic work and Lordship on the one hand and the Sabbath ordinance on the other. They both serve the same purpose. And so His Lordship embraces the Sabbath institution, embraces it too for the purpose of preserving it, confirming it and blessing it. He is Lord of the Sabbath too.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fourth Commandment According to the Westminster Standards in The Calvin Forum</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

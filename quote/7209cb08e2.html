<blockquote><p>What are we to understand by an ABLE AND FAITHFUL MINISTRY? It is a ministry, at once qualified and disposed to perform, with enlightened and unwearied assiduity, all the duties, whether of instruction, of defence, or of discipline, which belong to ambassadors of Christ, to pastors and rulers in his church. This general character implies Piety, Talents, Learning, and Diligence, 1. The first requisite to form a faithful and able minister, is Piety. By this I mean, that he be a regenerated man; that he have a living faith in that Saviour whom he preaches to others; that the love of Christ habitually constrain him; that he have himself walked in those paths of humility, self-denial, and holy communion with God, through our Lord Jesus Christ, in which it is the business of his life to endeavour to lead his fellow-men.

I shall not now speak of the necessity of piety, to a minister’s personal salvation; nor of its inestimable importance to his personal comfort. I shall not dwell on the irksomeness, nay, the intolerable drudgery, of labouring in a vocation in which the heart does not go along; nor on the painful misgivings which must ever attend preaching an unknown Saviour, and recommending untasted hopes and joys. Neither shall I attempt to describe, tremendous and overwhelming as it is, the aggravated doom of that man, who, from the heights of this sacred office, shall sink into the abyss of the damned; who, after having preached to others, shall himself become a cast-away. But my object is, to show the importance, and the necessity, of this best of all attainments, in order to qualify any man for discharging the duties of the ministerial office. It is to show, that, without piety, he cannot be an able minister. He cannot be a workman, that needeth not to be ashamed, rightly dividing the word of truth, and giving to each his portion in due season.

How can a man who knows only the theory of religion, undertake to be a practical guide in spiritual things? How can he adapt his instructions to all the varieties of Christian experience? How can he direct the awakened, the inquiring, the tempted, and the doubting? How can he feed the sheep and the lambs of Christ? How can he sympathize with mourners in Zion? How can he comfort others with those consolations wherewith he himself has never been comforted of God? He cannot possibly perform, as he ought, any of these duties, and yet they are the most precious and interesting parts of the ministerial work. However gigantic his intellectual powers; however deep, and various, and accurate his learning, he is not able, in relation to any of these points, to teach others, seeing he is not taught himself. If he make the attempt, it will be the blind leading the blind; and of this, unerring wisdom has told us the consequence.

It were rash, indeed, and unwarranted, to say, that a man who knows nothing of the power of godliness, may not be employed, by a sovereign God, as the means of saving benefit to others. God undoubtedly may, and probably sometimes does, “by way of miracle, raise a man to life by the bones of a dead prophet.” He may, and, there is reason to believe sometimes does, “honour his own word so far as to make it effectual to salvation, even when it falls from unhallowed lips.” The ministry even of Judas Iscariot was, probably, not without its benefit to the church of Christ. But such a result is not, in ordinary cases, and certainly not in any considerable degree, to be expected. When unsanctified ministers are introduced into the church, we may generally expect them to prove, not only an offence to God, but also a curse to his people. Piety, orthodoxy, practical holiness, and all the spiritual glories of the household of faith, will commonly be found to decline in proportion to the number and influence of these enemies in disguise.

And here I cannot help bearing testimony against what appears to me a dangerous mistake; which, though it may not be common, yet sometimes occurs among parents and guardians of the more serious class. I mean the mistake of destining young persons to the Gospel Ministry, from a very early period of life, before they can be supposed, from any enlightened view of the subject, to concur in the choice themselves; and before they give any satisfactory evidence of vital piety. Brethren, I venerate the parent who desires, and daily prays, that it may please God to prepare and dispose his child, to serve him in the ministry of reconciliation.

Nay, I think that parent worthy of the thanks of every friend to religion, who solemnly devotes his child, even from the earliest period of life, to the service of the church, and avowedly conducts every part of his education with a view to this great object; provided the original consecration, and every subsequent arrangement, be made on the condition, carefully and frequently expressed, as well as implied, that God shall be pleased to sanction and accept the offering, by imparting his grace, and giving a heart to love, and desire the sacred work. But there is a wide difference between this, and resolving that a particular son shall be a minister, in the same manner, and on the same principles, as another is devoted to the medical profession, or to the bar, as a respectable employment in life; without recognizing vital piety, and the deliberate choice of the ministry, from religious motives, as indispensable qualifications. This kind of destination to the sacred office, is as dangerous as it is unwarranted.

Let the Christian parent, however solemnly he may have devoted his child to the work of the ministry, and however fondly he may have anticipated his entrance on that blessed work; if he find, at the proper age for deciding the question, no comfortable evidence of a heart regenerated, and governed by the spirit of grace; let him deliberately advise;—though his heart be wrung with anguish by the sacrifice;—let him deliberately advise the choice of another profession. When young men begin to enter the gospel ministry, because they were early destined to the office; because it is a respectable profession; or because they wish to gratify parents and friends; rather than because they love the office, and its work, and have reason to hope that God has been pleased to call them by his grace, and repeal his Son in them; we may consider the ministry as in a fair way to be made, in fact, a secular employment, and the church a prostituted theatre for the schemes and ambition of worldly men.</p></blockquote>

<blockquote><p>These lands, and particularly this, entered into solemn leagues and covenants, for preserving and carrying on a work of reformation, in opposition to Papists, Prelatists, Erastians, Sectarians, and all malignants, or enemies of the work of reformation under whatever denomination, and to adhere to the doctrine, discipline, worship, and government of the church of Christ; but alas! how treacherously have we and our fathers dealt with the great God, with respect to these covenant-engagements? How shamefully was the obligation of them rescinded by act of parliament; and not only so, but disgracefully and ignominiously burnt at the public cross of the capital city of the nation, and that by the countenance of authority?

And, as if that had not been enough in opposition to the royal authority of the Son of God, our covenanted Head and King, the prerogatives of his crown, by act of parliament, were taken from him, and a sinful mortal vested with one of the jewels of his mediatory crown, and declared head in all causes, civil and ecclesiastic. And how many sinful compliances (with these usurpations) have there been both before and since the revolution, contrary to these solemn covenant-engagements?

We have reason to fear that God is at this day upon his march to avenge the quarrel of his holy name, that was solemnly interposed in these covenants by all ranks. Ezek. xvii. from verse 12, and downwards, we read there of an oath taken from the king of Judah by the king of Babylon, that he and all the land should be tributaries unto him: Well, though the oath was extorted, although it was made to a heathen, yet because the name of God was interposed, God avenges the quarrel of his name upon Zedekiah for the breach of it, as you see, ver. 16—19, &amp;c.

How much more will not God avenge the breach of that oath, that was made to himself as the immediate party by king, nobles, gentry, commons, and all ranks in the land, especially when interposed for no other end but to maintain the doctrine, worship, discipline, and government of his house, according to his word? How little regard has been or is had to these solemn covenants? How little personal, family, church, or state reformation doth appear among us, when all manner of blasphemy, error, profanity, and wickedness of all sorts, is abounding without any check? yea, when ecclesiastic judicatories, themselves have been, and still are, acting the very reverse of these covenants, in violating the rights and liberties of the Lord’s people?

O Sirs! wrath from the Lord is hovering over our heads for the profanation of that great and dreadful name of the Lord, in the matter of solemn oaths and covenants, both of a more public and of a more private kind. The children of Israel were separated from the rest of the nations, and God declares them to be “a royal priesthood, a peculiar people, an holy nation,” and discharged them from making any league, or entering into any affinity with these abominations; and yet they went a whoring after the idols and abominations of the nations round about them, worshipped their gods, and learned their sinful customs, which made the Lord to abhor them, and to write their sin upon their punishment, by scattering them among the nations. And is not this the case with us?

By solemn covenant we were engaged never to join with malignants, or any enemies of the reformation, and to improve our endeavours for the reformation of Britain and Ireland; but how are these things observed, when, contrary unto these engagements, the public consent is given, that abjured Prelacy and superstition shall continue in England; and when the open enemies of the covenanted reformation are not only admitted into places civil and military, but taken into the bosom of the church, and vested with the sacred rights and privileges thereof?

And, as if that had not been enough in opposition to the royal authority of the Son of God, our covenanted Head and King, the prerogatives of his crown, by act of parliament, were taken from him, and a sinful mortal vested with one of the jewels of his mediatory crown, and declared head in all causes, civil and ecclesiastic. And how many sinful compliances (with these usurpations) have there been both before and since the revolution, contrary to these solemn covenant-engagements?

</figure><figure class="quote" id="q-6ca0517cfa" data-kw="">
<blockquote><p>See hence a good reason for that solemn work and duty of covenanting, by stretching out the hand into the Lord, as it is said of Ethiopia, Ps. lxviii. 31 This duty is warranted by scripture example, and scripture prophecy concerning the days of the New Testament, and the example of our worthy forefathers in the three kingdoms, and this land in a particular manner. As God the Father, by solemn oath, has constituted his own Son the great Manager of his house, hanging all the offspring and issue upon him; so it is highly reasonable that all the offspring and issue of the family should homologate his deed, by solemn oath and covenant, before the whole world, because this is for his declarative glory, upon whom all the glory hangs. …

There are a generation of men in our day, who set up only for a private, selfish kind of religion. If they believe with the heart, they think they have done enough. If they enjoy raptures and ecstasies of love to Christ, they are easy what come of Jerusalem, what come of the ark of God, or a covenanted reformation. Let error in doctrine, corruption in worship, tyranny in government, prevail as much as they will, it is all a matter; these are not the essentials; all is well with them if they have what they call the Spirit. But what sort of a spirit is that which follows, cleaves to, and coalesces with abjured prelacy, a corrupt backsliding ministry, and judicatories that deny the obligation of solemn covenants, and at the same time inspire men with enmity against a testimony for a covenanted reformation and all that own it?

Surely such a spirit must be the spirit of the old serpent transforming himself into an angel of light; the old malignant spirit that persecuted our forefathers unto death, for cleaving to a covenanted reformation, although now indeed, it has put on the name and vizard of Presbyterian. They that boast of such a spirit, as if it were a spirit of conversion, they boast themselves in a thing of nought; yea, in a thing that is worse than nought, even of a spirit of strong delusion. A deceived heart, and a subtle devil, has turned them aside from the truth, that they cannot deliver their souls, nor say, Is there not a lie in my right hand?</p></blockquote>

<blockquote><p>James Nisbet agonized over this difficult choice… should he join the clearly imperfect Church of Scotland? Based on the following account form his memoir, it is likely that he parted from the Society shortly after the Revolution Settlement because of the dangerous errors and behaviors of its members: ‘Their criticizing upon and censuring of all others who are not exactly of their judgment in every punctilio, grievously aggravating their faults and often fixing some where there is none; yea, seldom sparing one another even where they are one in judgment, [they made] the terms of their communion straighter than what God allows in his Word. They will allow no masters of families to be of their communion who pay any taxes to the present government, making no difference betwixt this legal and the former illegal and tyrannical government. They will allow no children or servants to be in their communion who obey their parents and masters in doing any service to those in public trust in the government. They will allow none to hear any of the present ministry, even though transiently, to be in their communion. They spend the most part of their precious time in arguing and praying against the sins and defections of the public, neglecting to watch the heart; and here, to my shame, I was greatly guilty of this, among others. We spent much of our precious time in framing arguments to debate with others, greatly neglecting to be distinctly acquainted with the principles of the Christian religion and to be savingly acquainted with the inward and serious part of real godliness. They would publish a declaration disowning the authority of the great King William [of the Glorious Revolution, 1689 ff.] and against the validity of the present church communion. When I earnestly besought, with much entreaty, that every article of that declaration might be reasoned, they would not allow it… Thus my protesting, and refusing to join with them, enraged them exceedingly against me. As their scourge of tongues was grievously bent against others, so now was it against myself in a most grievous, unjust, and unreasonable manner… Thus, I left that party of the dissenters who now commonly go under the name of Mr. McMillan’s people…’ (Nisbet, Private Life, pp. 235-238)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage</cite>, (2000) Moore is very sympathetic with the Cameronians., p. 159</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>Secondly, the Church being but one, this point and principle is to be holden, that there is no salvation out of the Church, as there is no condemnation to them that are of the Church, and consequently every one that looks to be saved by Christ, must necessarily range himself in that number, that so he may become a member and citizen of this one catholic Church. For as out of the sheepfold are goats, dogs, swine, wolves, and such like, so out of the Church are sorcerers, and whoremongers, and murderers, and idolaters, and whosoever loves and makes lies, Rev. 22. Such albeit they may be in the Church for a season, yet are not of the Church, for they remain not in it. They that were not in the ark of Noah, perished in the waters: so out of the Church, and out of this flock and sheepfold all are condemned. Hence it is that Luke teaches, ‘The Lord added to the Church from day to day such as should be saved.’ [Acts 2] So Solomon, Cant. 4, ‘A garden enclosed is my Sister, my Spouse, a Spring shut up, a Fountain sealed.’ This is plain in these four respects. First, because Christ Jesus is the only head of the Church, by whom all parts as by certain joints and sinews are knit and coupled together: but out of the militant Church there is no Christ, for He always walks in the midst of the seven golden candlesticks… Thirdly, out of the Church there are no ordinary means to come to salvation. Now what are the means to attain salvation? They are these, hearing, faith, prayer, the sacraments, and such like. But out of the bosom of the Church there is no sound preaching of the Word, no true believing in Christ, no devout calling upon God, no right partaking of the sacraments, no sincere holinesse of life, no brotherly communion of saints, no pure worshipping of God according to his Word. These are the privileges of the Church, and the marks whereby it is known, Acts 2, ‘They continued stedfastly in the apostles’ doctrine, and fellowship, and in breaking of bread, and in prayers.’ Where these are not, there can be no Church, nor salvation. Fourthly, the Church and the world are quite contrary the one to the other. Christ prays not for the world, as he does for the Church, and for all the parts and members of it, Jn. 17:9, 14, ‘the whole world lyeth in wickedness,’ only the Church is an holy company which follows the ways and practices the works of godliness.</p></blockquote>

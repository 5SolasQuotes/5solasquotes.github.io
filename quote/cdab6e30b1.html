<blockquote><p>4. The Holy Ghost speaks generally of all men, whether regenerate or unregenerate, and of all works, whether going before faith or following it, that a man, that is, every one, who is justified, is justified by faith without the works of the law, Rom. 3:28, that a man is not justified (that is, that no man is justified) by the works of the Law, but by the faith of Jesus Christ, for by the works of the Law no flesh, that is, as the Psalmist speaks, no man living shall be justified, Gal. 2:16. For as in the first act of justification we are justified by faith without respect of works, so our justification is continued unto us without respect of our works. And this appears most plainly in the examples of Abraham, of Job, of David, of Paul, etc. as I showed before, who, though they abounded with good works which they wrought by faith, yet were not justified by them, but by faith only. For that which Chrysostom says of Abraham is also verified of all the godly: for, says he, that a man having not works should be justified by faith, it is no unlikely thing: [Greek], but this, that a man flourishing in good works, should not thereby be justified, but by faith, it was wonderful, and very much sets forth the force of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification</cite>, (London: 1633), ch. 2, ‘That we are not justified by works’, pp. 446-47</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-16a6aa85d0" data-kw="">
<blockquote><p>Neither have we departed from the doctrine of the Church, in that we teach that faith only justifies. For many of the ancient have used this form of words [though they also affirmed justification involves an inherent righteousness], as: Origen on Rom. 3: Dicit apostolus sufficere solius fidei justificationem, ita ut credens quis tantummodo justificetur, etiamsi nihil ab eo operis fuerit expletum. [The apostle says that the justification of faith alone is sufficient, so that a man is justified by believing alone, even if no work has been performed by him.] Hilary, can. 8. in Matthew: Fides sola justificat. [Faith alone justifies.] Basil, Homily on Humility: Haec est perfecta &amp; integra gloriatio in Deo, quando neque ob justitiam suam quis se iactat, sed novit quidem seipsum verae justitiae indigum, solâ autem fide in Christum justificatum. [This is perfect and complete boasting in God: when a person does not boast on account of his own righteousness, but knows himself indeed to be lacking true righteousness, and is justified by faith alone in Christ.] Ambrose on Rom. 3: Iustificati sunt gratis, quia nihil operantes, neque vicem reddentes, sola fide justificati sunt dono Dei. [They are justified freely, because, doing nothing and rendering nothing in return, they are justified by faith alone, by the gift of God.] Chrysostom, Homily on Faith and the Law of Nature: Eum qui operatur opera iustitiae sine fide non potes probare vivum esse, fidem absque operibus possum monstrare, et vixisse, et regnum coelorum assecutam, nullus sine fide vitam habuit, latro autem credidit tantum, et iustificatus est. [You cannot prove that one who performs works of righteousness without faith is alive; but I can show that faith without works has both lived and attained the kingdom of Heaven. No one has had life without faith; but the thief believed only, and was justified.] Augustine bk. 1, Contra the Two Epistles of Pelagius, ch. 21 Quantaelibet fuisse virtutis antiquos praedices justos, non eos salvos fecit nisi fides mediatoris. [However great you may proclaim the virtue of the righteous of old to have been, it did not save them except the faith of the Mediator.] 83 Questions, q. 76 Si quis cum crediderit mox de hac vita decesserit, iustificatio fidei manet cum illo: nec praecedentibus bonis operibus, quia non merito ad illam, sed gratia pervenit, nec consequentibus, quia in hac vita esse non sinitur. [If anyone, after he has believed, immediately departs from this life, the justification of faith remains with him: not by preceding good works, because he attained to it not by merit but by grace; nor by subsequent works, because he is not permitted to remain in this life.] Theophylact, on Gal. 3: Nunc plane ostendit apostolus, fidem vel solam, iustificandi habere in se virtutem. [Now the apostle plainly shows that faith alone has within itself the power of justifying.] Bernard Sermon 22 on Canticles: Quisquis pro peccatis compunctus, esurit et sitit iustitiam, credat in te qui iustificas impium, at solam iustificatus per fidem, pacem habebitad te. [Whoever, pierced with sorrow for sins, hungers and thirsts for righteousness, let him believe in you who justifies the ungodly; and thus, justified by faith alone, he will have peace with you.] Epistle 77: Qui crediderit et baptizatus fuerit salvus erit. Caute, inquit, non repetiit, qui vero baptizatus non fuerit, condenabitur, sed tantum qui vero non crediderit, innuens nimirum solam fidem interdum sufficere ad salutem, et sine illa sufficere nihil. [He who has believed and has been baptized shall be saved. He carefully did not repeat, ‘but he who has not been baptized shall be condemned,’ but only, ‘he who has not believed,’ clearly indicating that faith alone sometimes suffices for salvation, and that without it nothing suffices.] Sometimes by these phrases of speech they exclude: [1] All that may be without supernatural knowledge, all that may be without a true profession. [2] Sometimes the necessity of good works in act or external good works. 3. The power of nature without illumination and grace. 4. The power of the Law. 5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.</p></blockquote>

h+without+works+has+both+lived+and+attained+the+kingdom+of+Heaven.+No+one+has+had+life+without+faith%3B+but+the+thief+believed+only%2C+and+was+justified.%5D+Augustine+bk.+1%2C+Contra+the+Two+Epistles+of+Pelagius%2C+ch.+21+Quantaelibet+fuisse+virtutis+antiquos+praedices+justos%2C+non+eos+salvos+fecit+nisi+fides+mediatoris.+%5BHowever+great+you+may+proclaim+the+virtue+of+the+righteous+of+old+to+have+been%2C+it+did+not+save+them+except+the+faith+of+the+Mediator.%5D+83+Questions%2C+q.+76+Si+quis+cum+crediderit+mox+de+hac+vita+decesserit%2C+iustificatio+fidei+manet+cum+illo%3A+nec+praecedentibus+bonis+operibus%2C+quia+non+merito+ad+illam%2C+sed+gratia+pervenit%2C+nec+consequentibus%2C+quia+in+hac+vita+esse+non+sinitur.+%5BIf+anyone%2C+after+he+has+believed%2C+immediately+departs+from+this+life%2C+the+justification+of+faith+remains+with+him%3A+not+by+preceding+good+works%2C+because+he+attained+to+it+not+by+merit+but+by+grace%3B+nor+by+subsequent+works%2C+because+he+is+not+permitted+to+remain+in+this+life.%5D+Theophylact%2C+on+Gal.+3%3A+Nunc+plane+ostendit+apostolus%2C+fidem+vel+solam%2C+iustificandi+habere+in+se+virtutem.+%5BNow+the+apostle+plainly+shows+that+faith+alone+has+within+itself+the+power+of+justifying.%5D+Bernard+Sermon+22+on+Canticles%3A+Quisquis+pro+peccatis+compunctus%2C+esurit+et+sitit+iustitiam%2C+credat+in+te+qui+iustificas+impium%2C+at+solam+iustificatus+per+fidem%2C+pacem+habebitad+te.+%5BWhoever%2C+pierced+with+sorrow+for+sins%2C+hungers+and+thirsts+for+righteousness%2C+let+him+believe+in+you+who+justifies+the+ungodly%3B+and+thus%2C+justified+by+faith+alone%2C+he+will+have+peace+with+you.%5D+Epistle+77%3A+Qui+crediderit+et+baptizatus+fuerit+salvus+erit.+Caute%2C+inquit%2C+non+repetiit%2C+qui+vero+baptizatus+non+fuerit%2C+condenabitur%2C+sed+tantum+qui+vero+non+crediderit%2C+innuens+nimirum+solam+fidem+interdum+sufficere+ad+salutem%2C+et+sine+illa+sufficere+nihil.+%5BHe+who+has+believed+and+has+been+baptized+shall+be+saved.+He+carefully+did+not+repeat%2C+%E2%80%98but+he+who+has+not+been+baptized+shall+be+condemned%2C%E2%80%99+but+only%2C+%E2%80%98he+who+has+not+believed%2C%E2%80%99+clearly+indicating+that+faith+alone+sometimes+suffices+for+salvation%2C+and+that+without+it+nothing+suffices.%5D+Sometimes+by+these+phrases+of+speech+they+exclude%3A+%5B1%5D+All+that+may+be+without+supernatural+knowledge%2C+all+that+may+be+without+a+true+profession.+%5B2%5D+Sometimes+the+necessity+of+good+works+in+act+or+external+good+works.+3.+The+power+of+nature+without+illumination+and+grace.+4.+The+power+of+the+Law.+5.+The+sufficiency+of+anything+found+in+us+to+make+us+stand+in+judgment%2C+to+abide+the+trial%2C+and+not+to+fear+condemnation.+And+in+this+sense+faith+only+is+said+to+justify%2C+that+is%2C+the+only+mercy+of+God+and+merit+of+Christ+apprehended+by+faith%3A+and+then+the+meaning+of+their+speech+is+that+only+the+persuasion+and+assured+trust+that+they+have%2C+to+be+accepted+of+God+for+Christ%E2%80%99s+sake%2C+is+that+that+makes+them+stand+in+judgment%2C+without+fear+of+condemnation.+And+in+this+sense+all+the+divines+formerly+alleged+for+proof+of+the+insufficiency+of+all+our+inherent+righteousness%2C+and+the+trust+which+we+should+have+in+the+only+mercy+of+God%2C+and+merit+of+Christ%2C+do+teach+as+we+do%2C+that+faith+only+justifies.+For+neither+they+nor+we+exclude+from+the+work+of+justification%2C+%5B1%5D+the+action+of+God+as+the+supreme+and+highest+cause+of+our+justification%3A+for+it+is+He+that+remits+sin%2C+and+receives+us+to+grace%3A+%5B2%5D+nor+the+merit+of+Christ%2C+as+that+for+which+God+inclines+to+show+mercy+to+us%2C+and+to+respect+us%3A+%5B3%5D+nor+the+remission+of+sins%2C+gracious+acceptation%2C+and+grant+of+the+gift+of+righteousness%2C+as+that+by+which+we+are+formally+justified%3A+%5B4%5D+nor+those+works+of+preventing+grace%2C+whereby+out+of+the+general+apprehension+of+faith%2C+God+works+in+us+dislike+of+our+former+condition%2C+desire+to+be+reconciled+to+God%2C+to+have+remission+of+that+%5Bwhich%5D+is+past%2C+and+grace+hereafter+to+decline+the+like+evils%2C+and+to+do+contrary+good+things.+For+by+these+we+are+prepared%2C+disposed+and+fitted+for+justification%3B+without+these+none+are+justified.+And+in+this+sense%2C+and+to+imply+a+necessity+of+these+to+be+found+in+us%2C+sometimes+the+Fathers+and+others+say+that+we+are+not+justified+by+faith+only.+And+we+all+agree%2C+that+it+is+not+our+conversion+to+God%2C+nor+the+change+we+find+in+ourselves%2C+that+can+any+way+make+us+stand+in+judgment+without+fear%2C+and+look+for+any+good+from+God%2C+otherwise+than+in+that+we+find+ourselves+so+disposed+and+fitted%2C+as+is+necessary+for+justification%2C+whence+we+assure+ourselves+God+will+in+mercy+accept+us+for+Christ%E2%80%99s+sake.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Of+the+Church...+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+appendix%2C+ch.+11%2C+pp.+323-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16a6aa85d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16a6aa85d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Neither%20have%20we%20departed%20from%20the,mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake&amp;text=Neither%20have%20we%20departed%20from%20the%20doctrine%20of&amp;text=will%20in%20mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-33c53a4209" data-kw="">
<blockquote><p>Question: But David grounds this redemption and blessing in the release of sins. Why then add you also the imputation of the sanctification that sticks in Christ, and his fulfilling of the law? Answer: What if I shold encounter thee with these texts: ‘Blessed are the clean in heart,’ ‘blessed are the blameless in the way,’ and such other like? wouldst thou gather here upon that the releasing of sins is excluded? I think not. So now and then sanctification is meant by the term of ‘justification’, because these two go never asunder. And why may I not make answer thus also? that sometimes there is mention made but only of the releasing of sins, not to the end to exclude all other pates that make men blessed, but because the rest are coverfly comprehended under it? And if thou wilt urge me yet further: I may also fitly answer that as the other are meant by the releasing of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Book of Christian Questions &amp; Answers</cite>, … (London: How, 1574), p. 57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-82485833f0" data-kw="">
<blockquote><p>We do not deny (as the Papists falsely slander us) all inherent righteousness, 2 Cor. 5:17, nor all justification before God by inherent righteousness, 1 Kn. 8:32 [“Then hear thou in heaven, and do, and judge thy servants, condemning the wicked, to bring his way upon his head; and justifying the righteous, to give him according to his righteousness.”]. But this we teach, that this inherent righteousness is not that righteousness whereby any poor sinner in this life can be justified before God’s Tribunal, for which he is pronounced to be innocent, absolved from death and condemnation, and adjudged unto eternal life. … Whether inherent justice be actual or habitual? Bishop Davenant, ch. 3, Of Habitual Righteousness, says a certain habitual or inherent justice is infused into all that are justified, Jn. 1:13; 2 Cor. 5:17; Gal. 6:15; 1 Cor. 6:11, 19; 2 Pet. 1:4. All those that are justified do supernatural works; Therefore, it is certain that they are endued with supernatural grace and holiness. We are said to be righteous, from this inherent justice we are said to be just, and that by God Himself, Gen. 6:9; Heb. 11:4; Lk. 1:61 &amp; 2:25; 1 Pet. 4:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6, Of Justification, pp. 517-18 Leigh, though he says what he says below, nor Davenant, who is referenced, evidences a twofold justification as such.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-15738e125c" data-kw="">
<blockquote><p>So that it is evident that to be justified has a threefold signification. For first it imports as much as to be absolved from sin, that is, to be freed from the woeful consequents of that disfavor and dislike, that unrighteousness and sin subjects us unto. Secondly, to be accepted and respected so as righteous men are wont to be: And thirdly to be framed to the love and desire of doing righteously.</p></blockquote>

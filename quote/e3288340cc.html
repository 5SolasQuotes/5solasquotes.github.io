<blockquote><p>Rather, it is used strictly for a real and internal renovation of man by which God delivers the man planted in Christ by faith and justified (by the ministry of the word and the efficacy of the Spirit) more and more from his native depravity and transforms him into his own image. Thus with separation from the world and sin and consecration to God, which is the killing of the old man and the vivifying of the new.</p></blockquote>

<blockquote><p>Controversy XI: Can the justified men fulfill God’s law? Orthodox Position: None of the justified can perfectly keep God’s law, as Scripture teaches (Romans 8; Galatians 3), experience, and the Church Fathers. The perfection of the righteous, mentioned in Matthew 5:48 and Genesis 6:9, 17:1, Philippians 3:15, consists in the imputation of Christ’s justice and in sincerity and uprightness, which consist in acknowledging one’s own imperfection and firmly resolving to obey all of God’s commandments. [Romanist] Position of [Robert] Bellarmine: The justified men can keep God’s law, not by the forces of free will, but by the aid of God’s grace, that is, by the spirit of faith and charity infused in justification. The reasons are:

1. Christ’s yoke is easy, and His commandments are not burdensome (Matthew 11; 1 John 5).

2. God gives us His Spirit, who makes us walk in His ways (Ezekiel 36). That is why the apostle says in Philippians 4:13 that he can do all things.

3. The elect are endowed with charity (John 13, 15; 1 John 3, 4). Charity is the fulfillment of the law (John 14; Romans 13).

4. We read about many saints who kept God’s commandments blamelessly and were perfect and truly righteous (Genesis 6, 17; 1 Samuel 14, 15; 2 Samuel 23; Luke 1).

5. God is not like a tyrant who demands impossible tributes from His friends. Therefore, the Church Fathers teach that no one is obligated to do the impossible.

6. Christ died so that the justice of the law might be fulfilled in us (Romans 8:4).

7. Man can do more than is commanded (Matthew 19:21). [The Reformed] Censure: 1.2. God’s commandments are not only possible but also easy for the elect, not by their own strength but by God’s grace. Furthermore, the defects found in their works are graciously forgiven by God. 3.4. Perfection of parts and sincerity are attributed to the elect, not absolute and supreme perfection, which is called perfection of degrees. Though the elect love God, the mode of this love in this life is imperfect.

5. Not every obligation to do the impossible is unjust, especially when one has incurred a debt by one’s own fault. Moreover, God requires from His own what is possible through Christ.

6. The substance of God’s law is fulfilled in us when we are justified in Christ according to the perfect formula of the law.

7. The conditional is not categorical. Christ is not saying here what the arrogant young man could do but refuting him for his false hope of justice. Moreover, it is true that there are works of supererogation, but in Christ. . Controversy XII: Are the good works of the justified truly pure? Orthodox Position: The good works of the justified, considered in themselves, are wrapped in many defects and are therefore not absolutely pure but only relatively, considering the justified person, who is pure in Christ. Scripture teaches this (Psalm 130; Romans 7; 1 Corinthians 13; James 3). Experience also confirms this, as we experience various temptations in thoughts, words, and deeds. The Church Fathers, like Bernard, also approve this: “If there is any justice in us, it is humble, perhaps upright, but not pure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>

<blockquote><p>The word saint in general signifies a person separated, or one set apart from others; Holiness is our separation from the world unto God: holy persons are separated persons; that’s their state.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, … (London: 1650), sermon on Job 15:15, pp. 61-62</span></figcaption>

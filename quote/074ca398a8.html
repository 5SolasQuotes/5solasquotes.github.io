<blockquote><p>Q155 What if someone is not endowed with faith until the very moment of death itself. For this seems to have happened to the thief hanging on the cross. What kind of good works will someone of this type have brought forth?

A155 No, the faith of that thief was in that brief time unspeakably active, for he rebuked the blasphemes and wickedness of the other thief, he detested his own crimes, and with a plain and marvelous faith he acknowledged Christ as the eternal king while he was in the very disgrace of the cross; as all the disciples kept silent, he invoked him as his Saviour, and finally he openly reproved the cruelties and ungodly voices of the Jews.

Moreover, the acknowledgement of sin, the invocation of God the Father in Christ, and thanksgiving, are the most excellent works of the first Table, which cannot be separated from faith in any man. Yet someone who is prevented by death is not able to demonstrate any of the works of the second table. Nevertheless, faith is not to be considered idle in him, since although it does not have charity joined in deed, it has it joined in potentiality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Little Book of Christian Questions and Responses. In which the Principal Headings of the Christian Religion are briefly set forth</cite>, trans. Kirk M. Summers, ed. Dikran Y. Hadidian (1570; Eugene OR: Pickwick Publications, 1986), p. 61.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4689b0b30b" data-kw="">
<blockquote><p>So a holy person rejoiceth that the way of holiness is the appointed way to Heaven… he delights in the Gospel-constitution, because it requires universal holiness… This is solid rational religion, fit to be depended upon, in opposition to the antinomian licentiousness, the freaks of enthusiasm, and the irrational flights of passion and imagination on the one hand; and in opposition to formality, mere morality, and the self-sprung religion of nature on the other… Men are naturally averse to this Gospel method of salvation… they will endeavor to widen the way to Heaven, and persuade themselves they shall attain it, notwithstanding their continuance in some known iniquity, and though their hearts have never been thoroughly sanctified… How many give up their hopes of Heaven rather than part with sin… and must not such degenerate creatures be renewed ere they can be holy, or see the Lord!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-davies.html">Samuel Davies</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons</cite>, (Philadelphia, 1864), vol. 1, Sermon 9, ‘The Connection Between Present Holiness and Future Felicity’, on Heb. 12:14, pp. 277-78</span></figcaption>

</figure><figure class="quote" id="q-0640bfcb7e" data-kw="">
<blockquote><p>Therefore we, being justified by faith, do good works, through which, as 2 Peter 1:10 says, our call and election are confirmed and made more certain day by day. But because we have only the first fruits of the Spirit and do not yet have the tithes, and because remnants of sin remain us, we do not keep the Law perfectly. But this is not imputed to us who believe in Christ—in Christ, who was promised to Abraham and has blessed us. For meanwhile we are cherished and fed, for the sake of Christ, in the lap of the forbearance of God. We are that wounded man who fell among robbers; whose wounds the Samaritan bound up, pouring on oil and wine; whom he set on his own beast and brought to an inn and took care of; and whom he entrusted to the innkeeper upon departing, with the words: “Take care of him” (Luke 10:30–35). Thus we are cherished meanwhile as in an inn, until the Lord reaches out His hand a second time, as Isaiah says, to deliver us (Is. 10:10–11).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 260.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-d0b90c6748" data-kw="">
<blockquote><p>This infallible assurance doth not so belong to the essence of faith, but that a true believer may wait long, and conflict with many difficulties before he be partaker of it: yet, being enabled by the Spirit to know the things which are freely given him of God, he may, without extraordinary revelation, in the right use of ordinary means, attain thereunto. And therefore it is the duty of everyone to give all diligence to make his calling and election sure, that thereby his heart may be enlarged in peace and joy in the Holy Ghost, in love and thankfulness to God, and in strength and cheerfulness in the duties of obedience, the proper fruits of this assurance; so far is it from inclining men to looseness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 18.3</span></figcaption>

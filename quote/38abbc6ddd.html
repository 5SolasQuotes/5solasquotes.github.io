<main class="wrap"><figure class="quote" id="q-38abbc6ddd" data-kw="">
<blockquote><p>In a letter to the Londonderry Standard explaining his decision to vote in the General Election of 1868, the Revd Samuel Patton of Waterside Eastern Reformed Presbyterian Church, Londonderry, made the following points concerning the Glorious Revolution:

The Revolution Settlement was effected under William III., and against that settlement our fathers took up position uncompromising dissent. Their grand ideal of Christian Church in a Christian State seemed rudely dashed to the ground. For by this Settlement a semi-Erastian Presbytery was established in Scotland, and wholly Erastian Prelacy in England and Ireland. With all the energy most determined dissent the Covenanters [Reformed Presbyterians] recoiled from this Settlement, and withdrew, not only from the Church, but also from the State.

Yet let it be considered that, by the Revolution Settlement, a part of the contendings of the farsighted Covenanters was nobly vindicated. The absolute sovereignty of the King over the nation was swept away, and civil liberty triumphed. The Revolution Settlement gave us a Constitution. Prelacy was set up, indeed, and Royal supremacy was established, but this was done by the nation itself now acting through its Parliament. The arrangement was bad, but it was capable of being reversed. …

One word, now, as to the Solemn League and Covenant and my vote. Once again we have come face to face with the Royal Supremacy. The field of action is not a Drumclog, but the broad territory of the United Kingdom, under the peaceful sway of Queen Victoria, and amid the forms of constitutional Government. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/londonderry-standard.html">Londonderry Standard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Londonderry Standard</cite>, 25 November 1868.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d28a27931b" data-kw="">
<blockquote><p>Robert Hamilton sent out for me to sup with him. When I came, there was none with him but Mr. Douglas, and Gredden came in afterward. He was extraordinary kind to me; he inquired many things at me, but the drift of all was to see if he could have gotten me brought over. He told me how unanimous they were [in the army camp] before the ministers came to them, and that they would do no good until they were removed, and that they [Hamilton’s crew] were for not owning of the king, who had deprived us of the gospel and was seeking our destruction both of soul and body. I gave him no answer at all, but heard all, and afterward returned to my men, who were lying in the close, where were Mr. [John] Welsh and the rest of the brethren for penning of the declaration. I went to him and told him all that had passed, and I desired him to put forth a declaration that would give satisfaction to the multitude; for if we meddled with the king or with the indulgence, it would hinder many [persons] to come [to the covenanter army] who would be as willing as we [to protest, supplicate and defensively fight] and were waiting till they saw it, and would make friends to become enemies; and no fear what Robert Hamilton and his party could do: that if he was clear therein as in the sight of God, I should stand by him as long as my life was in me, and so would most part of the army; and if he yielded to them, I would leave them all and go home. He told me my advice was very refreshing to them at that nick of time. With that they were resolved to do so— they desired me to come to them tomorrow and I should see what they had done [in writing up such a declaration]; and so I came, and it gave me and the army all satisfaction, except Robert Hamilton and his faction… Also we told them, they were more taken up with other men’s sins than they were with their own, and that it were our duty first to begin with ourselves. They spake likewise of putting off of officers [who were not on Hamilton’s side], and did put off him who was captain to the men who came from the east end of Stirlingshire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ure.html">James Ure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of Mr. William Veitch, and George Brysson, written by Themselves</cite>, ed. Thomas M’Crie (Edinburgh: William Blackwood, 1825) Ure was a covenanter, on the side of the moderate party, led by the minister John Welsh, and was a first-hand witness of the battle of Bothwell., pp. 462-65</span></figcaption>

</figure><figure class="quote" id="q-13f458389c" data-kw="">
<blockquote><p>The early Reformed Presbyterians and Seceders opposed evangelical latitudinarianism, the idea that important doctrines could be laid aside so that we can all stand “together for the gospel”. This mindset is similar to that of Liberalism, in that it thinks that some biblical truths are “essentials”, while others are “non-essentials”. Although it is true that some dogmas are more important than others, once something has been confessed by the church as biblical teaching it cannot be dismissed as a non-essential; if it was a non-essential God would not have put it in the Bible. Such was the extent of their opposition to such pernicious ideas, that the Anti-Burgher Seceders in Ireland declared it to be a disciplinarian offence for their people to join with latitudinarian evangelical groups:

[…] Evangelical Society of Ulster, question of discipline of such of our Communion as have connection with the same. […] Synod decided unanimously that such as join the Evangelical Society were following a divisive course &amp; that such should be tenderly dealt with, and that while all encouragement should be given to praying societies in our own congregations persons belonging to our communion should be admonished to withdraw from private religious societies not under our inspection […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/associate-synod-of-ireland.html">Associate Synod of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts &amp; proceedings of the Associate Synod of Ireland (Anti-Burgher) 1788-1818, 29 July 1800 (P.R.O.N.I., Belfast, D/3815/D/4), pp 62-3.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

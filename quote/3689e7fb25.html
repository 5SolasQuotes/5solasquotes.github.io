<blockquote><p>Secondly, Paul requires the elders of the Church of Ephesus to take heed unto and to oversee the whole flock, which did consist of more than did or could then meet together ordinarily into one place for the worship of God, as appears by the Church in the house of Aquila and Priscilla (which was one, but not the only one church assembly at Ephesus) by the great and wonderfull increase of the Gospel at Ephesus… Peter also writing to the churches of the strangers in several provinces, calls them the ‘flock’, not ‘flocks’, and commends unto the elders the feeding and oversight of that flock… No doubt they had the administration of the Word and sacraments partitive, or severally. Nor do I deny but they had a partitive several government: but there was also an union or association of them under one common government, which did denominate them to be one visible, ecclesiastical flock.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming</cite>, ... (1646), bk. 2, ch. 9, p. 298</span></figcaption>

</figure><figure class="quote" id="q-be733e97e7" data-kw="">
<blockquote><p>Among Protestant writers, prelates, and prelatical men plead hard for the divine right of tithes as the ministers’ due. Bishop [Lancelot] Andrews and Bishop [George] Carleton [whose works are below] have said as much for it as any that I have seen. But most of our reformed divines maintain the negative. So Peter Martyr (Common Places, pt. 4, ch. 13), Zanchy (Of Redemption, book 1, ch. 16), Daneus (Ethics, book 2, ch. 10), Rivet (in Genesis, Exercitation 80), Voetius (Eccle. pt. 1, book 4, p. 824), and to this we adhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Editorial note</cite>, It may be surprising to learn that the reformers and puritans largely did not hold that the Levitical tithe of ten percent was binding upon Christians. Those arguing that the Levitical tithe directly bound persons today, and that the revenues thereof were to be given directly to the ministry as a divine right (New Testament ministers being claimed, simplistically, to be the continuation of the Old Testament priests), were, rather, largely the entitled bishops of prelacy, especially in the Anglican Church. Increase Mather wrote (Discourse Concerning the Maintenance due to those that Preach, pp. 49-50; 1706):</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

A%2F%2F5solasquotes.github.io%2Fquote%2Fbe733e97e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/be733e97e7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/tithes-and-offerings#:~:text=Among%20Protestant%20writers%2C%20prelates%2C%20and%20prelatical,824%29%2C%20and%20to%20this%20we%20adhere&amp;text=Among%20Protestant%20writers%2C%20prelates%2C%20and%20prelatical%20men%20plead&amp;text=4%2C%20p.%20824%29%2C%20and%20to%20this%20we%20adhere" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-749ffbefe0" data-kw="">
<blockquote><p>As to praying a written prayer out of a book, it is a habit I cannot commend. If we can tell our doctors the state of our bodies without a book, we ought to be able to tell the state of our souls to God. I have no objection to a man using crutches, when he is first recovering from a broken limb. It is better to use crutches than not to walk at all. But if I saw him on crutches all his life, I would not consider it a matter for praise. I would like to see him strong enough to throw his crutches away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Prayer’ in Practical Religion</cite>, (Evangelical Press), pp. 97-98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<blockquote><p>4. For your ‘Amen’, as I am certain, that the Apostle’s words may be understood of a consentient, though silent, ‘Amen’; so it is evident that even in the point of order, your so frequently repeated ‘Amen’ is superfluous and vain: but if you will reduce your practice to a decent use, seeing the matter appears to be indifferent, if you love to express it, use your liberty, only permit us the like favor of ours.</p></blockquote>

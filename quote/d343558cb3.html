<main class="wrap"><figure class="quote" id="q-d343558cb3" data-kw="">
<blockquote><p>Whereas Paul says that “they are under the curse, that will be of works,” we see the whole world almost walks in the way of perdition. It is a conclusion of nature that we must be saved and justified by our works. The young prince in the Gospel said, “Good master, what must I do to be saved?” The Jews would not be subject to the [righteousness] of God, but they established their own righteousness of the law (Rom. 10:3). Our common people, and they that should be wise, say they look to be saved by faith, but indeed they turn their faith to works. For what is their faith? Surely nothing else (as they say) but their good meaning, or their good dealing, or their good serving of God. Hence again it follows that the papacy or popish religion is the way to perdition, in that it prescribes and teaches justification by works. On the contrary, our religion is the safest and surest from danger because it teaches the free justification of a sinner by the blood of Christ. Emphasis added.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of William Perkins: vol. 2: Commentary on Galatians</cite>, ed. Paul M. Smalley, Joel R. Beeke, and Derek W. H. Thomas, vol. 2 (Grand Rapids, MI: Reformation Heritage Books, 2015), 167.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d970ca3fcb" data-kw="">
<blockquote><p>It is a great sin to think any sin little; but it is a greater sin to think the righteousness of Christ is not above all sin. Our disobedience is the disobedience of man; but Christ’s obedience is the obedience of God: therefore, our believing in Christ doth please God better than if we had continued innocency, and never sinned. The least sin is unpardonable without this obedience and righteousness of Christ; and the greatest is pardonable by it. Therefore, O seek in to Christ, to be clothed upon with this righteousness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“And Walking in Him, Opened”</cite></span></figcaption>

</figure><figure class="quote" id="q-768f9fd334" data-kw="">
<blockquote><p>The doctrine of justification, which now follows, is one of the chief articles of our faith, not only because it treats of those things which are fundamental, but also because it is most frequently called in question by heretics. The controversies between the church and heretics have respect principally to two points: the one is concerning God, and the other concerning the justification of man in the sight of God. And such is the importance of these doctrines that if either one of them be overthrown, the other parts of our faith easily fall to pieces. Hence it becomes necessary for us, to fortify and establish ourselves, especially in these doctrines, against all the assaults of heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Orthodox Doctrine of the Explication of the Catechism, on Q. 7</cite></span></figcaption>

<blockquote><p>…faith is the beginning and root of all gospel righteousness, without which no virtue contributing to salvation can exist in a man, and which therefore, if it be not impeded, will attract all other virtues to it, so that Paul, when he expresses all the obedience described in the gospel under the name of faith, speaks in the same manner as the Latin writers do when they use hearing for obeying, as in Terence: “Shall I assist Pamphilus, or listen to the old man?” which figure is called the metonymy of the antecedent for the consequent;</p></blockquote>

</figure><figure class="quote" id="q-9696a1ee04" data-kw="">
<blockquote><p>Our works are meritorious from two causes: first, by virtue of the Divine motion; and thus we merit condignly; secondly, according as they proceed from free-will in so far as we do them willingly, and thus they have congruous merit, since it is congruous that when a man makes good use of his power God should by His super-excellent power work still higher things. And therefore it is clear that no one can merit condignly for another his first grace, save Christ alone. … But one may merit the first grace for another congruously; because a man in grace fulfils God&#x27;s will, and it is congruous and in harmony with friendship that God should fulfil man&#x27;s desire for the salvation of another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, I-II, q. 114, a. 6</span></figcaption>

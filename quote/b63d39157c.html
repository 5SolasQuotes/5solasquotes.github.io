<main class="wrap"><figure class="quote" id="q-b63d39157c" data-kw="">
<blockquote><p>2…. to endeavor the performance of the obligations and duties sworn to in our sacred Covenants with God… adhering to the [Westminster] Confession of Faith, Catechisms Larger and Shorter… these worthy martyrs who lately suffered in Scotland… whose wrestlings, faithful testifyings and declarations public and private we fully assent unto and approve of; we mean these that we have seen and are come to our hands… … 6. …we judge it expedient to reject all and every one who suffers themselves to be seduced to any sinful course or infected with error or shall be convicted of any public scandal…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“[12] Rules for Admission” &amp; “[15] Articles of the Society” in Maurice Grant, Preacher to the Remnant: The Story of James Renwick</cite>, (Blue Banner Productions, 2009), pp. 252-60, pp. 255-57</span></figcaption>

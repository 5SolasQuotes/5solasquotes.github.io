<main class="wrap"><figure class="quote" id="q-fda756477c" data-kw="">
<blockquote><p>For what reason does God send the Spirit of his Son into our hearts after we have become children of God? He does this in order to reveal to our hearts that we are indeed his children, in order to confirm and make us certain of that fact, in order to bear witness to it, in order to expel every doubt and uncertainty and in order to seal us in our sonship and inheritance. For this reason Scripture calls the Holy Spirit the first fruits of our inheritance. Note that the invocation of God the Father that comes from the heart is the expression of a mind that the Holy Spirit has made sure and certain of the fact that the Father has been placated by Christ the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erasmus-sarcerius.html">Erasmus Sarcerius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Epistolas Divi Pauli ad Galatas et Ephesios Annotationes</cite>, (Frankfurt, 1542). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 138.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f70e07d4bc" data-kw="">
<blockquote><p>If, then, the Holy Spirit is truly, and not in name only, called Divine both by Scripture and by our Fathers, what ground is left for those who oppose the glory of the Spirit? He is Divine, and absolutely good, and Omnipotent, and wise, and glorious, and eternal; He is everything of this kind that can be named to raise our thoughts to the grandeur of His being. The singleness of the subject of these properties testifies that He does not possess them in a measure only, as if we could imagine that He was one thing in His very substance, but became another by the presence of the aforesaid qualities.

That condition is peculiar to those beings who have been given a composite nature; whereas the Holy Spirit is single and simple in every respect equally. This is allowed by all; the man who denies it does not exist. If, then, there is but one simple and single definition of His being, the good which He possesses is not an acquired good; but, whatever He may be besides, He is Himself Goodness, and Wisdom, and Power, and Sanctification, and Righteousness, and Everlastingness, and Imperishability, and every name that is lofty, and elevating above other names.

What, then, is the state of mind that leads these men, who do not fear the fearful sentence passed upon the blasphemy against the Holy Ghost, to maintain that such a Being does not possess glory? For they clearly put that statement forward; that we ought not to believe that He should be glorified: though I know not for what reason they judge it to be expedient not to confess the true nature of that which is essentially glorious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-nyssen.html">Gregory of Nyssa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Holy Spirit. Against the Followers of Macedonius</cite>, (c. 380) in Nicene and Post-Nicene Fathers 2, 5: 316-17.</span></figcaption>

</figure><figure class="quote" id="q-d8a938995a" data-kw="Spirit proceeds Filioque deity">
<blockquote><p>The Holy Spirit proceeds from the Father and the Son, and the reason is that He is called the Spirit of the Son in Galatians 4:6 and Romans 8. He who is called the Spirit of God is the same who is also called the Spirit of Christ. The second reason is that He is so the Spirit of the Son that He is sent by the Son (John 16:7, 14). But if one is sent, he is sent either by authority, or by counsel, or by natural production. He is not sent by authority, since He is God; nor by counsel, since He is also God—for one who is such is instructed by one wiser than himself. Therefore He is sent by natural procession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputations on the Holy Spirit</cite>, II</span></figcaption>

</figure><figure class="quote" id="q-e568ece11d" data-kw="">
<blockquote><p>Christ, as God the Son, is of one substance, power, and eternity with God the Holy Spirit. Christ also, as the Son of man, had the Spirit bestowed on him without measure. His human nature was formed, in body and soul, and sanctified from the first, by the special operation of the Spirit. He was anointed with the immeasurable plenitude of the Spirit. By the light of the Spirit, the Man Christ Jesus thought all his thoughts; by the grace of the Spirit, willed all his purposes; by the strength of the Spirit wrought all his works; till finally he, “through the eternal Spirit, offered himself without spot to God,” thereafter rising from the dead by the Spirit of holiness, and ascending to pour out that Spirit of truth and consolations which he had promised so graciously to his disciples. In his Godhead, our Lord is one with the Spirit; and as man, – by the Spirit he was what he was.

When Christ, therefore, sends his Spirit, not to speak of himself, but to take of what is Christ’s and show it unto us; to create us again in Christ and like Christ; to dwell in us as in a living temple, as ourselves living spirits to which he has given a new and Christ-like life; – can we fail to see that there is something here which in no respect falls short even of the great marvel of our text, “Christ living in us?” Christ, the eternal Son, liveth in us, when the Spirit liveth in us; for the Spirit and the Son with the Father are inseparable in their joint possession of the all-fulness of the Godhead. And Christ, as God-man, the Son of man, the very Christ that tabernacled with men upon the earth, liveth in us, when the Spirit living in us confines himself to revealing Christ as the God-man, whose glory his disciples saw in human flesh, as the glory of the Only-begotten of the Father, full of grace and truth.

It is as the agent and ambassador of the God-man that the Spirit is given in the Church; it is the God-man whom the Spirit reveals and glorifies in the Church; it is within the limits of what he himself revealed and wrought in the God-man that he restricts himself in working in the Church or body of the faithful. He lives in them as he lived in him. He works to reveal in them progressively the truth which he implanted and developed in unclouded spiritual splendour in the mind of the Man Christ Jesus; to establish in them progressively the grace with which he replenished the heart of the Man Christ Jesus; – to conform them, in a word, to the “Firstborn of many brethren.” And how then can his in-dwelling, in-working, in-living in them be other than most adequately expressed by the doctrine that “Christ liveth in them?”

Christ, by his Spirit, liveth in them. By his Spirit he quickens them to new and spiritual life; and by his Spirit he takes possession of them as his living temple. As a living temple, he always regards them and acts in them. Their faculties as living men-alive from the dead-he animates and controls. Whatever in their thoughts, affections, purposes, actions, is opposed to his own, he sets himself to suppress; and the faculties themselves he undertakes to sanctify, – to form, and mould, and guide into harmony with his own. Nay; their whole character, their very natures, as living men, – spiritually living, he works by his Spirit to assimilate unto his own.

So far as this work advances, the very thoughts that he thinks they think; the affections he entertains they entertain; the purposes of his mind are theirs also; his work is their work; his nature theirs. And up to the limit to which this blessed result has in its onward progress been achieved, how can a better, a briefer, a more perfect expression be found for it, than to say that, to this extent, “Christ liveth in them?” It is, then, literally, profoundly true that Christ liveth in his people. He liveth in them by his Spirit which he hath given them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Treasury Pulpit. No. III. “Christ Liveth in Me. ’, Family Treasury of Sabbath Reading</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-holy-spirit.html">The Holy Spirit</a></span></div>

Christ, by his Spirit, liveth in them. By his Spirit he quickens them to new and spiritual life; and by his Spirit he takes possession of them as his living temple. As a living temple, he always regards them and acts in them. Their faculties as living men-alive from the dead-he animates and controls. Whatever in their thoughts, affections, purposes, actions, is opposed to his own, he sets himself to suppress; and the faculties themselves he undertakes to sanctify, – to form, and mould, and guide into harmony with his own. Nay; their whole character, their very natures, as living men, – spiritually living, he works by his Spirit to assimilate unto his own.

So far as this work advances, the very thoughts that he thinks they think; the affections he entertains they entertain; the purposes of his mind are theirs also; his work is their work; his nature theirs. And up to the limit to which this blessed result has in its onward progress been achieved, how can a better, a briefer, a more perfect expression be found for it, than to say that, to this extent, “Christ liveth in them?” It is, then, literally, profoundly true that Christ liveth in his people. He liveth in them by his Spirit which he hath given them.”

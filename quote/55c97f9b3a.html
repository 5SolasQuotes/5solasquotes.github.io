<main class="wrap"><figure class="quote" id="q-55c97f9b3a" data-kw="immutability all attributes">
<blockquote><p>Immutability is a glory belonging to all the attributes of God. It is not a single perfection of the divine nature. There is not one perfection but may be said to be, and truly is, immutable; none of them will appear so glorious without this beam, the sun of immutability, which renders them highly excellent without the least shadow of change.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Immutability of God</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/immutability.html">Immutability</a> › <a href="../topics/attributes-of-god/immutability/unchangeable-in-being-will-and-purpose.html">Unchangeable in being, will, and purpose</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7f9e890881" data-kw="omnipresence purity">
<blockquote><p>What place can defile a spirit? Is light polluted by shining upon a dunghill, or a sunbeam tainted by darting upon a quagmire? What can steam from the most noisome body, to pollute the spiritual nature of God? As he is of purer eyes than to behold iniquity, so he is of a more spiritual substance than to contract any physical pollution from the places where he doth diffuse himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Omnipresence of God</span></figcaption>

</figure><figure class="quote" id="q-7320ae0471" data-kw="">
<blockquote><p>The attaining of God&#x27;s glory was an end, which being ultimate and supreme, must in no case whatsoever give place. This is spoken of as the end of God&#x27;s executing judgments on his enemies in this world. … And this is spoken of as the end, both of the executions of wrath, and in the glorious exercises of mercy, in the misery and happiness of another world. Rom. 9:22–23, &quot;What if God, willing to show his wrath, and make his power known, endured with much long suffering, the vessels of wrath fitted to destruction: and that he might make known the riches of his glory on the vessels of mercy, which he hath afore prepared unto glory …?&quot; … Then his glory shall be obtained, with respect both to saints and sinners. From these things it is manifest … that God&#x27;s glory is the ultimate end of the creation of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissertation Concerning the End for Which God Created the World</cite>, on Ex. 14:17 and Rom. 9:22–23</span></figcaption>

</figure><figure class="quote" id="q-8fb05937d5" data-kw="Wisdom">
<blockquote><p>Who can trace the motions of God&#x27;s eyes in their race? &#x27;He makes the clouds his chariot,&#x27; Ps. 104:3, in his motions about the earth, and his throne is in the dark. He walks upon the wings of the wind, his providential speed makes it too quick for our understanding. His ways are mysterious, and put the reason and wisdom of men to a stand. The clearest-sighted servants of God do not see the bottom of his works, the motion of God&#x27;s eyes is too quick for ours.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on 2 Chron. 16:9, Doct. 1, Prop. 2</span></figcaption>

</figure><figure class="quote" id="q-3906a14668" data-kw="foreknowledge contingents">
<blockquote><p>Do all things fall under the knowledge of God, both singulars and future contingencies? We affirm against Socinus. He knows all things perfectly, undividedly, distinctly and immutably. Perfectly because he knows all things by himself or by his essence. Undividedly, because he knows all things intuitively and noetically, not discursively and dianoetically.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.12.1–2</span></figcaption>

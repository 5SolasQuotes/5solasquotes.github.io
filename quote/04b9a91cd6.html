<blockquote><p>2. What was the objective of the Covenant of Works?

The ultimate objective was eternal life, that is, the highest glorifying and enjoying of God by man. Specifically, God constituted Adam as the representative or “federal head” of the human race, and ordained the Covenant of Works as a probation of the human race through Adam, its official representative.

Mankind was created in a state of real, but untested, righteousness and holiness. There was no evil in man’s nature at the time of his creation by God, but he did not then exist in the highest state possible for him, because it was still possible for him to commit sin and fall from his original righteousness and holiness. Therefore man must go through a period of probation, that is, his obedience to God must pass through a test. If Adam, humanity’s representative, had passed this test successfully, he would have then been confirmed in his holiness. It would have become impossible for him to sin. Then he and all his posterity would have received eternal life (the highest glorifying and enjoyment of God).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Studies in the Covenant of Grace in Blue Banner Faith and Life</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-93553b2f79" data-kw="">
<blockquote><p>Now, the covenant of works being broken, the justice of Jehovah, required the execution of the curse of it; in order that a covenant of grace and peace, might be established. But, if the curse had been executed upon the sinners themselves, the fire of Divine wrath, should have burned eternally on them; and after all, such a sacrifice, could never have sent forth a savour, smelling so sweetly, as to be a savour of rest to vindicative justice; because they, were not only mere creatures, whose most exquisite torments, could never have amounted to a sufficient compensation, for the injury done to the honour of infinite Majesty; but were sinful creatures too, who would still, even under their eternal sufferings, have continued to sin. The Lord Jesus, therefore, being both “equal with God,” and “separate from sinners,” did in the covenant, consent to be, in the room of his elect seed, the sacrifice, upon whom the curse of the covenant of works, might be fully executed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), p. 104.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-d4e5db7ae8" data-kw="">
<blockquote><p>As an evidence that all unregenerate persons are under the dominion of the law as a covenant of works, the natural bent of their hearts in all their views respecting the means of salvation is to the way of that covenant [of works]. They all desire to be under the law of works. All who have embraced either one or another of the false religions that are in the world agree at least in this principle: it is by doing that men are to live. Hence, when the Lord opens the eyes of a man to see that horrible gulf of sin and misery into which the first Adam plunged him, he is strongly inclined to exert himself for deliverance in the way of the covenant of works. He struggles hard to forsake his sins and to perform his duties, hoping that by his own performances he will become so righteous as to pacify the wrath of God and to procure for himself eternal life. Ah, ignorant, proud, vain attempt! This, however, he resolutely persists in doing until he is made to despair of ever being able to procure salvation for himself in the way of that covenant. Indeed, this natural bent of the depraved heart toward the way of the law as a covenant, together with deep ignorance of the high demands of the law in that form, is the source of all the self-righteousness that is in the world. To take sinners off from this to a cordial reliance only on the righteousness of the second Adam for all their title to salvation is a special part of the Holy Spirit’s work in conviction and conversion, and to do it requires a greater exertion of His almighty power than even to create a world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 41–42 (emphasis added).</span></figcaption>

</figure><figure class="quote" id="q-04045502f0" data-kw="">
<blockquote><p>First, It was obedience to God merely as Creator, no further; Adam in innocency he looked upon God as Creator of all things, as the First being of all, and so Adam tendered up his service to God merely as the Creator and First-being. That was his obedience. Secondly, The Law to Adam had promise only of natural things, of a natural life to be continued: We do not read of God’s promising Adam to live in Heaven if he had obeyed; but, Do this and live; that was the Tenor of the Covenant with him: that is, he should have continued in Paradise and so have lived a natural life, but yet continued eternally, God would have upheld that natural life of his, that’s all we read of that ever God promised to Adam if he had stood by virtue of that Covenant of the Law:

That’s the second thing considerable in him. so that his obedience was tendered up to God to that end, that he might obtain the continuance of a natural life here in this world, only in order unto that, for we find no more revealed. The first man Adam he was Natural, the second Spiritual, the first of the Earth earthly, the second, the Lord from Heaven. The Apostle. 1 Cor. 15. speaks of Adam in innocency as the common head of al man-kind, he was of the Earth earthly, and in way of distinction the second Adam was the Lord from Heaven; He brings all heavenly glory. Though Adam had stood, yet we never read of any heavenly glory that ever he or his posterity should have had; but the second Adam he is the Lord from Heaven that brings Heavenly glory with him. That’s the second thing considerable in the Law as a Covenant with Adam.

The third thing in the Law as a Covenant with Adam was this, That Adam under the Law he must have wrought by his own strength that he had received. God at first gave man strength for obedience, and he puts his stock into his own hand, and so he must have wrought and continued by the power of the strength that God did at first give him, he had not that fountain to go to for that continual supply of strength as we have, which you shall see presently.

Fourthly, Adam, he was in such a condition, as he was in hazard of his miscarrying for his eternal estate; He was indeed in a way of obedience to the Law that God gave him, but still so as he was in hazard of eternal miscarrying; this was the condition of Adam under the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel-conversation: wherein is shewed, I. How the conversation of believers must be above what could be by the light of nature. II. Beyond those that lived under the law. III. And suitable to what truths the Gospel holds forth</cite>, (London: Peter Cole, 1650), pp 43-44.</span></figcaption>

econd+thing+considerable+in+the+Law+as+a+Covenant+with+Adam.%0A%0AThe+third+thing+in+the+Law+as+a+Covenant+with+Adam+was+this%2C+That+Adam+under+the+Law+he+must+have+wrought+by+his+own+strength+that+he+had+received.+God+at+first+gave+man+strength+for+obedience%2C+and+he+puts+his+stock+into+his+own+hand%2C+and+so+he+must+have+wrought+and+continued+by+the+power+of+the+strength+that+God+did+at+first+give+him%2C+he+had+not+that+fountain+to+go+to+for+that+continual+supply+of+strength+as+we+have%2C+which+you+shall+see+presently.%0A%0AFourthly%2C+Adam%2C+he+was+in+such+a+condition%2C+as+he+was+in+hazard+of+his+miscarrying+for+his+eternal+estate%3B+He+was+indeed+in+a+way+of+obedience+to+the+Law+that+God+gave+him%2C+but+still+so+as+he+was+in+hazard+of+eternal+miscarrying%3B+this+was+the+condition+of+Adam+under+the+Law.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel-conversation%3A+wherein+is+shewed%2C+I.+How+the+conversation+of+believers+must+be+above+what+could+be+by+the+light+of+nature.+II.+Beyond+those+that+lived+under+the+law.+III.+And+suitable+to+what+truths+the+Gospel+holds+forth%2C+%28London%3A+Peter+Cole%2C+1650%29%2C+pp+43-44.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F04045502f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/04045502f0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/09/03/jeremiah-burroughs-on-the-covenant-of-works-and-its-reward/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>XXV. Such a perfect observance of the laws of the covenant, up to the period which God had fixed for probation, had given man a right to the reward. Not from any intrinsic proportion of the work to the reward, as the grosser Papists proudly boast; but from God’s covenant and engagement, which was no ways unbecoming him to enter into. Nor had man, before the consummation of his obedience, even in the state of innocence, a right to life. He was only in a state of acquiring a right, which would at length be actually acquired, when he could say, I could have fulfilled the conditions of the covenant, I have constantly and perfectly done what was commanded; now I claim and expect that thou, my God, wilt grant the promised happiness. XXVI. How absurdly again do the Papists assert, that Adam, as he came from the hands of his Creator, had a right, as the adopted Son of God, to supernatural happiness, as to his paternal inheritance; which, according to Bellarmine, de Justificat. l. v. 17. “is due to the adopted Son of God, in right of adoption, previous to all good works.” But this is truly a preposterous way of reasoning. For the right of adoption belongs to the covenant of grace in Christ Jesus: “the adoption of children is by Jesus Christ,” Eph. 1:5. Besides, was this opinion true, good works could not be required, as the condition of acquiring a right to eternal life; but could only serve to prevent the forfeiture of the right of a son: by this means, the whole design of the covenant of works, and all the righteousness which is by the law, are quite destroyed. In fine, what can be more absurd, than the trifling manner in which these sophisters talk of the grace of adoption, as giving Adam a right to enter upon an heavenly inheritance, in a legal covenant: when, on the other hand, they so stiffly contend for the merits of works, under a covenant of grace. It is only there (to wit, under the covenant of grace) that we are to apply the above sentiment, that the inheritance is due to an adopted Son of God, in right of adoption, previous to all good works.</p></blockquote>

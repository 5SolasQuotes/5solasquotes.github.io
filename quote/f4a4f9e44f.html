<main class="wrap"><figure class="quote" id="q-f4a4f9e44f" data-kw="">
<blockquote><p>I could not help observing, one day, how much Mr. N[ewton]. was grieved with the mistake of a minister, who appeared to pay too much attention to politics. “For my part,” said he, “I have no temptation to turn politician, and much less to inflame a party, in these times. When a ship is leaky, and a mutinous spirit divides the company on board, a wise man would say, ‘My good friends, while we are debating the water is gaining on us. We had better leave the debate, and go to the pumps.’ — I endeavour,” continued he, “to turn my people’s eyes from instruments to God. I am continually attempting to shew them, how far they are from knowing either the matter of fact or the matter of right. I inculcate our great privileges in this country, and advise a discontented man to take a lodging for a little while in Russia or Prussia.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cecil.html">Richard Cecil</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Memoirs of the Rev. John Newton, with General Remarks on His Life, Connections, and Character</cite>, (1808) in The Works of the Rev. John Newton (6 vols, London: Hamilton, Adams, and Co., 1824), 1: 75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-00bac0fa81" data-kw="">
<blockquote><p>Forget not to mark here also the great care that GOD hath of his Sabbath, that it be kept holy according to his appointment, when he will not suffer these Israelites to gather so much as his Manna for their food upon the Sabbath day, but appointeth them to do it the day before. May not a good soul thus reason then with himself, or her self? Good Lord, what do I upon the Sabbath day? This people of his, might not gather Manna, and may I safely gad to Fairs and Markets, to dancings and drinkings, to wakes and wantonness, to Bearbaitings, and Bull-baitings, with such like wicked prophanations of the Lord’s day?

May I be absent from the Church, where God’s people are gathered together in his Name, &amp; he in the midst of them, walking about my Closes and grounds, sending my Servants and Cattle to Towns with corn which I have sold before, because I will not spare them on the week days, and so forth? Are these works for the Sabbath? Is this to keep holy the Sabbath day? Can I answer this to my God that giveth me six days for my self, and taketh but one day to himself of which I rob him also? No, no, assuredly I shall not be able to endure his wrath for these things one day; and therefore I will leave them, and regard hereafter his holy Sabbath better than I have done. Yes assuredly this is a sound and a blessed Reason: and therefore I pray God to set it in our hearts, since now a-days there is so much offending this way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfortable notes upon the books of Exodus and Leviticus, as before upon Genesis Gathered and laid down still in this plain manner, for the good of them that cannot use better helps, and yet are careful to read the Scriptures, and very desirous to find the comfort in them. … With a table of the prin</cite>, (London: Thomas Chard, 1604), pp 269-70.</span></figcaption>

<blockquote><p>4. It being the custom then to cover the faces of those that were put to any great shame, a man that shall vail his head and face does thereby take reproach unto himself. … 5. …As custom makes it a shame to her to be shaven, so also to be unvailed. (Note, that this was a changeable custom, and is contrary now with us). …

13. The signification of being uncovered, being by custom a note [of] superiority, judge in yourselves whether such be decent for a woman at the church’s prayers. …

14. And when common custom has made the wearing of hair at length the note of the female sex, does not nature itself tell you, that it is a shame for a man to be so like a woman? (when God forbids us so much as to be clothed as women, to confound the sexes, which must needs be visibly distinguished). …

15. But use tells us that for women to let their hair grow out at length is a signification of modesty, as a kind of covering, and so is decent to them. …

16. But if any will contentiously dispute against what I say, though I would make no greater a matter of such things than the nature of them requires, let this answer suffice to resolve sober minds: The custom of all the Churches is against women’s being uncovered, as an unseemly thing; and you should not easily be different from all the Churches in a matter which depends on the signification of an action, which use and common opinion must interpret. We that must be as concordant as we can, must not affect dissimilitude.</p></blockquote>

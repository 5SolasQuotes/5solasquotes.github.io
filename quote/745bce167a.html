<main class="wrap"><figure class="quote" id="q-745bce167a" data-kw="">
<blockquote><p>I notice as another of the means of growth in grace, the observance of the sabbath, in connection with public worship. On this subject, it must be acknowledged that there prevails extensively a lamentable deficiency in Christian practice. I refer not here to those who openly outrage holy time, by perverting it to worldly business or amusement; they, of course, cut themselves off from every claim to Christian character; but I refer rather to those, who, professing to sanctify the sabbath, yet adopt a low standard of duty, and take little pains to exclude the world either from their thoughts or conversation. That you may avoid this evil, and secure the benefit to be derived from a proper observance of holy time, attend to the following directions.

Make it an object religiously to observe the whole sabbath. I do not here attempt to decide the question at what time the sabbath commences: I only insist that your practice on this subject should be consistent with your principles. Whenever you believe the sabbath begins, then begin to observe it; and remember that it is just as criminal to devote the first half to secular purposes, as any other part of the day. Let all your worldly concerns be arranged to meet the earliest demands of holy time; that thus you may avoid the wretched practice of suffering the secular business of the week to crowd upon the sacred duties of the sabbath.

Be equally careful, on the other hand, that you do not curtail this sacred day, by suffering your spirituality gradually to decline with the sun. I urge this counsel upon you the rather, from the fact that the error to which I refer so extensively prevails, that you will be in danger of falling into it almost unconsciously. Remember that He who has fixed the stamp of His authority on the sabbath, has left the impress of holiness equally on all its hours. Remember that if you begin the sabbath too late, or close it too early, you are, in either case, guilty of robbing God.

I would say, in the next place, keep the day strictly holy. With the low standards of the world on this subject, have nothing to do; remembering that the command of Jehovah is resting upon you, that you should not think your own thoughts, or find your own pleasures. Wherever you are, recollect this command is to be strictly obeyed. What though you may be thrown into the company of those who profane the sabbath; or what though worldly courtesy should seem to claim that you should relax a little from your accustomed strictness, for the sake of making yourself agreeable to irreligious friends — you have no right to listen to any such demands for a moment; and you cannot venture on the experiment of a compliance, but at the hazard of fearfully provoking God, and bringing upon yourself crimson guilt.

That you may comply with this spirit of the divine command, take heed that you avoid everything inconsistent with a devout observance of the day. Never allow yourself in any reading which is not strictly religious. Beware that you do not, from conversing on subjects which have a remote bearing upon religion, slide into conversation of a mere secular character: the temptation to this will sometimes be almost irresistible. Guard against the indulgence of vain and worldly thoughts; for though the eye of man can take no cognizance of these, they fall within the full observation of Him who searches the heart. But in order to keep holy the sabbath, you have much to perform, as well as much to avoid.

With the exception of what are called “works of necessity and mercy,” (and in respect to these, an enlightened conscience is to be the judge,) the whole day is to be devoted to duties strictly religious. Beside attending on the public worship of the sanctuary, (in respect to an absence from which, you are never lightly to admit an excuse,) you are to devote a considerable part of the sabbath to the private exercises of meditation, prayer, and reading the scriptures and other religious books; and some part of it may be profitably spent, as you have opportunity, in serious conversation.

It is also an employment perfectly consistent with the sacredness of the day, to communicate religious instruction; and for this, a noble opportunity is presented by sabbath schools. Keeping the sabbath in the manner which I have now described, you may reasonably expect the blessing of the Lord of the sabbath, in a rapid advance in piety.</p></blockquote>

<blockquote><p>The state of the case turns on the definition. For the children of Reuben, Gad, and Manasseh, explain that they had a different intention, and thus exculpate themselves from the charge, inasmuch as the nature of the proceeding was quite different from what the others supposed… as if they had said, that it will be made palpable by the fact itself, that they never had any intention of devising any new form of worship; and they rightly explain how the altar would have been unlawful, namely, if they had built it for the purpose of offering sacrifice. For the Law did not condemn the mere raising of heaps of stones, but only enjoined that sacrifices should be offered in one place…</p></blockquote>

</figure><figure class="quote" id="q-cbdc1c3dce" data-kw="">
<blockquote><p>If no time be set apart by a competent authority for public worship, there will be no public worship. When Paul rebuked some of the early Christians, for “forsaking the assembling of themselves together,” Heb. 10:25, it would have been ample justification for them to have replied, “No such thing is required, and no time is set for it.” But we hear of no such plea. It never was made.

There was as much agreement among the early Christians in observing the Lord’s day as in observing the Lord’s supper. It would be mere will-worship to observe the Lord’s day, if it had not been appointed to be so observed by God himself. Is it credible that God should have left the whole church so ignorant of his will, that all believers for eighteen hundred years should have been mistaken as to their duty in so important a matter as this?

The apostle James says, “He that keepeth the whole law, and yet offendeth in one point, is guilty of all.” That he here means the moral law is evident, for he cites two of the precepts of it in the next verse: “Do not commit adultery,” “Do not kill.” James 2: 10, 11. Now, if you do not kill, or swear profanely, yet if you violate the fourth commandment, you are “become a transgressor of the law.” Let those who indulge in Antinomian laxity concerning the law of the Sabbath, solemnly consider the course of reasoning adopted by James, and be warned in time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law of the Sabbath Still Binding, and What it Forbids in Tracts of American Tract Society. General Series</cite>, vol. VI, no. 187 (New York, n.d.), p. 15.</span></figcaption>

<blockquote><p>XVI. OF THE PARTS OF GODS LAW.

1 There are in holy scripture found 3. parts of Gods law. That is to say, Moral, Ceremonial, and Judicial.

2 The moral law, whose sum is contained in the ten commandments, is a doctrine agreeing with the eternal and immutable wisdom and rule of justice in God, discerning good and evil, naturally known, and bread in reasonable creatures, in the creation, &amp; many times after repeated and declared by the mouth of God, teaching us that there is a God, and what manner of God he is, binding all reasonable creatures to perfect obedience &amp; conformity external &amp; internal to that rule, promising the favour of God and life eternal to all that perform perfect obedience, and denouncing the anger of God &amp; eternal punishment, to all that are not perfectly conformable thereunto, unless there be granted remission of sins &amp; reconciliation through the son of God our mediator.

3 The law of nature before the fall was altogether the same with the moral law of God: but the knowledge of God being after the fall obscured in man’s mind, the law of nature is now become only a part of the decalogue or ten commandments, being obscure and maimed especially in the knowledge and worship of God, for which cause also God repeated and declared again in his church the whole body of his law.

4 Ceremonial laws are certain precepts of ceremonies, that is, of actions, and external solemn gestures, or such as must be performed in the publique service of God, with observation of the self-same circumstances, ordained either to signify future things, or for order’s sake.

5 Judicial laws concern the external defence of discipline, according to both tables of the decalogue, or concerning civil government amongst the Jews, that is, touching the order &amp; duties of magistrates; judgments, punishments, contracts, and differences of being Lord or owner of ought.

6 This distinction of divine laws, must be observed, both because of the difference of these laws, which being neglected their right force and meaning cannot well be understood, &amp; also that we may well judge and instruct others in the abrogation and use of the law.

7 These are the differences between the law moral, and ceremonial and judicial laws. First, moral commandments or precepts are naturally known: ceremonial and judicial are not.

8 Secondly, moral laws bind all reasonable creatures, ceremonial and judicial were only prescribed to the Jews.

9 Thirdly, moral laws are ever in force, ceremonial and judicial are not.

10 Fourthly, moral laws command external &amp; internal obedience, ceremonial and judicial command only obedience external, which notwithstanding must be joined with internal moral obedience.

11 Fiftly, moral laws are general, not limited with certain circumstances, ceremonial and judicial are special, that is, determined by certain circumstances.

12 Sixtly, ceremonial and judicial laws are types foreshewing some thing; moral laws are not types but signified by types.

13 Seventhly, moral laws are a principal worship of God, or the end of other laws; ceremonial and judicial owe service to the moral, that by them these may the better be observed.

14 Eighthly, laws ceremonial yield to the moral; but moral laws yield not to the ceremonial.</p></blockquote>

<blockquote><p>And in the first place, consider whether such things may not be done more than hath yet been done for the Reformation of known evils, things that have been mentioned, faithfully &amp; solemnly Testified against, by those Messengers of the Lord, that have from year to year spoken to us in His Name on such days as this, as Drunkenness, Unrighteousness and other Immoralities, vicious &amp; prophane Practices; and among others, that of Prophanation of the Sabbath; concerning which I shall now briefly Observe something, and that only in one branch of it, and that is persons commonly &amp; without any just cause Absenting themselves from the Public Worship of God on the Sabbath-Day (I speak not of Quakers &amp; other Sectaries, but of them that make the same Profession that we generally do) I can’t but fear that many in this Government are very guilty of this great Neglect &amp; sinful Omission of their Duty.

And it may truly be said of them that are thus guilty, that they live much in the Violation of the Fourth Commandment, which is, Remember the Sabbath-day to keep it holy; and in the Neglect of a principal means of putting visible Honour upon God, and of doing their part to maintain &amp; keep up Religion in the Places where they dwell, and are guilty of putting an open slight upon Christ, the Offers and Tenders of the Gospel, and all the glorious things contained in it, and of the much in the neglect of the great &amp; principal means of their own Salvation. All these Evils they do at once, and live in them, that commonly neglect the Public Worship of God. Surely this practice in which so many great Evils are contained, can be no little Sin.

It may well be tho’t that every Member of this Assembly will readily own, that all ought to be done that can be done, in the great duty of turning from Sin to God: Now therefore let it be seriously Considered, whither that has been done for the Reformation of this Evil?</p></blockquote>

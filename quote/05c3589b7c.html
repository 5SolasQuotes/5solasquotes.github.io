<main class="wrap"><figure class="quote" id="q-05c3589b7c" data-kw="">
<blockquote><p>Secondly, there is Voluntas Signi [will of sign], a manifestation of his will, whether it be in his works, which are the fruits of his will, or his Word which is the evidence of his will, directing us to the knowledge what He would have us do. A sense tropical and figurative, yet most proper to inform us: and this is scattered into five divisions or species. First, Permissio, his permission or allowance, or privilege to things, without which they cannot be; Non fit aliquid nisi omnipotens fieri velit, vel sinendo ut fiat, vel faciendo [Nothing comes to be unless the Omnipotent wills it to come to be, either by permitting it to come to pass or by bringing it about]. (Augustine, Enchiridion) Secondly, Impletio, the perfecting or fulfilling of them. Thirdly, Consilium, his revealed decree. Fourthly, Praeceptum, his positive law; his precepts wherein He teaches and commands us to do what is acceptable in his sight. Fifthly and lastly, Prohibitio, the restraint He lays upon us, his command for the eschewing those actions which are contrary to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-king.html">Henry King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Lord’s Prayer delivered in Certain Sermons</cite>, (London: Haviland, 1628), ‘Thy will be done in earth as it is in heaven’, pp. 146-47 King (1592–1669) was the Bishop of Chichester, a poet and a friend of John Donne.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2de6b7a68d" data-kw="">
<blockquote><p>The former will [of command] is called by the [Medieval] Scholastics, on the authority, it is thought, of Hugh of St. Victor, voluntas signi, whether because it is signified by some sign, like a word, precept, interdict, etc.; or because it signifies God’s will as the effect and adjunct of it…</p></blockquote>

</figure><figure class="quote" id="q-3299ae28fa" data-kw="">
<blockquote><p>Question: But how could he [Paul] wish this [to be accursed from Christ for his brethren’s sake, in Rom. 9:3], seeing it imports a diminution of the love of God… Answer: If ye will consider this petition by itself, it was neither sin nor dimunition of this love: but if ye will consider the consequents of this wish, if indeed he had been excluded from the Kingdome of heaven, then it had been a sin for him to have wished it. One may wish a thing simply without sin, yet to wish it vestitum omnibus circumstantiis [clothed with all circumstances] it may be sin. Example: a woman has her husband to be executed for some capital offence, the woman wished her husband to live, as her husband and a father to her children to provide for them; but if she should desire her husband to live as an enemy to the commonwealth contrary to the law, then her wish were a sinful wish: So for Paul to wish this to testify his earnest love to the Church, it was no sin; but if he had wished it vestitum ominibus circumstantiis, with a diminution of the love of God and want of eternal happiness, then his wish had been sin. Again we wish a thing antecedente voluntate vel consequente voluntate, ‘with an antecedent or consequent will.’ Example: a judge by his antecedent will wishes that all the subjects may live; but by his consequent will, he wishes the malefactor to die. So Paul wished this by his antecedent will, but not considering it with all the consequents that might follow upon it. Fourthly, Paul wished not this absolutely, but in comparison: as the natural mother who pleaded before Solomon chose rather that the child should be given to her who was not the mother of it than that the child should be cut in two, 1 Kn. 3:26. If ye consider Paul’s wish here, it was only in comparison; rather than they should die, he wishes this to himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-weemes.html">John Weemes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Moral Law, or Ten Commandments</cite>, ... (London: Cotes, 1632), bk. 1, Commandment 1, Exercitation 7, pp. 50-51</span></figcaption>

</figure><figure class="quote" id="q-963b3cfced" data-kw="">
<blockquote><p>There is a twofold Word, or rather a double declaration of the same Word:

1. There is God’s external or outward Word, containing letters and syllables, and this is his external voice.

2. There is God’s internal Word and voice, which secretly speaks to the heart, even by the external Word, when that only speaks to the ear. … 2. This inward Word is double: 1. ineffectual (though inward); 2. effectual. 1. Ineffectual, is that which has some inward operation upon the heart, but it attains not God’s end to bring a man into a state of life; and thus, Heb. 6:2, 5. Many tasted of the good Word of God, yet fell away. And such a heart is compared to a field which a man plows and sows, and rain falls on it, and yet the end is not attained: it brings forth thistles; and this many Jews did hear, and hence had some kind of faith in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subjection to Christ in all his Ordinances &amp; Appointments the best means to preserve our Liberty</cite>, ... (d. 1649; London: S.G., 1657), ‘Of Ineffectual Hearing’, pp. 89-90</span></figcaption>

<blockquote><p>5. In so doing God does all that belongs to Him to do as Legislator: For it must be understood that here He speaks those words ‘that the world by Him might be saved’ not as absolute-Lord merely or properly, but as Rector per Leges [a Governor through laws]; And it belongs to Him as Legislator only to propound salvation to man as his end: and to promise it on his conditions, and prescribe those conditions and command man to perform them: and to threaten him with the loss of that end (of salvation) if he perform them not. But to give faith, which is the condition itself, does not belong so God as Legislator. (No man living can claim the first act of faith, or effectual grace thereto, from God by any promise that He has made): But He gives it as Dominus absolutus [an absolute Lord], and as one that may do with his own as he list. So that it is Finis prescriptus et conditionaliter datus [the end prescribed and conditionally given], that is here spoken of; and not Finis Decretus [the end decreed] to be by God eventually infallibly accomplished. It is the end of God’s Law and Legislative Will, and so of God as mere Legislator or Rector per Leges: and not of his decretive will de eventu [of the event], and of God as absolute Lord above Laws, without them disposing of his own. (The prediction of events does collaterally and secundum quid [according to that] belong to his Law: but not per se and directly.) And 6. Consider that if it be never so much denied that God has properly a conditional will de rerum eventu [respecting the event of things], yet it is beyond all question true that He has a conditional will de debito [of debt or obligation] (officii, Præmii et Pænæ [of office or duty, reward and punishment]) and so his Law is conditional most commonly. He has constituted the Debitum pramii [debt of reward], the dueness of salvation on condition of believing, loving and sincerely obeying Christ. And therefore they must nor deny conditional promises and threatnings, though they deny conditional, decrees. This I add, because I know they here usually answer that God intends no end conditionally, but where He intends also the condition itself, that so it may be equivalent to absolute: But He intends as Legislator that faith shall be the prescribed means to glory, and glory the end promised to all that perform that condition; and so conditionally gives it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universal Redemption of Mankind by the Lord Jesus Christ Stated &amp; Cleared</cite>, (London: Salusbury, 1694), pp. 305-8</span></figcaption>

<div class="actions"><button class="copy" data-copy="“5. In so doing God does all that belongs to Him to do as Legislator: For it must be understood that here He speaks those words ‘that the world by Him might be saved’ not as absolute-Lord merely or properly, but as Rector per Leges [a Governor through laws]; And it belongs to Him as Legislator only to propound salvation to man as his end: and to promise it on his conditions, and prescribe those conditions and command man to perform them: and to threaten him with the loss of that end (of salvation) if he perform them not. But to give faith, which is the condition itself, does not belong so God as Legislator. (No man living can claim the first act of faith, or effectual grace thereto, from God by any promise that He has made): But He gives it as Dominus absolutus [an absolute Lord], and as one that may do with his own as he list. So that it is Finis prescriptus et conditionaliter datus [the end prescribed and conditionally given], that is here spoken of; and not Finis Decretus [the end decreed] to be by God eventually infallibly accomplished. It is the end of God’s Law and Legislative Will, and so of God as mere Legislator or Rector per Leges: and not of his decretive will de eventu [of the event], and of God as absolute Lord above Laws, without them disposing of his own. (The prediction of events does collaterally and secundum quid [according to that] belong to his Law: but not per se and directly.) And 6. Consider that if it be never so much denied that God has properly a conditional will de rerum eventu [respecting the event of things], yet it is beyond all question true that He has a conditional will de debito [of debt or obligation] (officii, Præmii et Pænæ [of office or duty, reward and punishment]) and so his Law is conditional most commonly. He has constituted the Debitum pramii [debt of reward], the dueness of salvation on condition of believing, loving and sincerely obeying Christ. And therefore they must nor deny conditional promises and threatnings, though they deny conditional, decrees. This I add, because I know they here usually answer that God intends no end conditionally, but where He intends also the condition itself, that so it may be equivalent to absolute: But He intends as Legislator that faith shall be the prescribed means to glory, and glory the end promised to all that perform that condition; and so conditionally gives it.”

— Richard Baxter, Universal Redemption of Mankind by the Lord Jesus Christ (London: Salusbury, 1694), pp. 305-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+In+so+doing+God+does+all+that+belongs+to+Him+to+do+as+Legislator%3A+For+it+must+be+understood+that+here+He+speaks+those+words+%E2%80%98that+the+world+by+Him+might+be+saved%E2%80%99+not+as+absolute-Lord+merely+or+properly%2C+but+as+Rector+per+Leges+%5Ba+Governor+through+laws%5D%3B+And+it+belongs+to+Him+as+Legislator+only+to+propound+salvation+to+man+as+his+end%3A+and+to+promise+it+on+his+conditions%2C+and+prescribe+those+conditions+and+command+man+to+perform+them%3A+and+to+threaten+him+with+the+loss+of+that+end+%28of+salvation%29+if+he+perform+them+not.+But+to+give+faith%2C+which+is+the+condition+itself%2C+does+not+belong+so+God+as+Legislator.+%28No+man+living+can+claim+the+first+act+of+faith%2C+or+effectual+grace+thereto%2C+from+God+by+any+promise+that+He+has+made%29%3A+But+He+gives+it+as+Dominus+absolutus+%5Ban+absolute+Lord%5D%2C+and+as+one+that+may+do+with+his+own+as+he+list.+So+that+it+is+Finis+prescriptus+et+conditionaliter+datus+%5Bthe+end+prescribed+and+conditionally+given%5D%2C+that+is+here+spoken+of%3B+and+not+Finis+Decretus+%5Bthe+end+decreed%5D+to+be+by+God+eventually+infallibly+accomplished.+It+is+the+end+of+God%E2%80%99s+Law+and+Legislative+Will%2C+and+so+of+God+as+mere+Legislator+or+Rector+per+Leges%3A+and+not+of+his+decretive+will+de+eventu+%5Bof+the+event%5D%2C+and+of+God+as+absolute+Lord+above+Laws%2C+without+them+disposing+of+his+own.+%28The+prediction+of+events+does+collaterally+and+secundum+quid+%5Baccording+to+that%5D+belong+to+his+Law%3A+but+not+per+se+and+directly.%29+And+6.+Consider+that+if+it+be+never+so+much+denied+that+God+has+properly+a+conditional+will+de+rerum+eventu+%5Brespecting+the+event+of+things%5D%2C+yet+it+is+beyond+all+question+true+that+He+has+a+conditional+will+de+debito+%5Bof+debt+or+obligation%5D+%28officii%2C+Pr%C3%A6mii+et+P%C3%A6n%C3%A6+%5Bof+office+or+duty%2C+reward+and+punishment%5D%29+and+so+his+Law+is+conditional+most+commonly.+He+has+constituted+the+Debitum+pramii+%5Bdebt+of+reward%5D%2C+the+dueness+of+salvation+on+condition+of+believing%2C+loving+and+sincerely+obeying+Christ.+And+therefore+they+must+nor+deny+conditional+promises+and+threatnings%2C+though+they+deny+conditional%2C+decrees.+This+I+add%2C+because+I+know+they+here+usually+answer+that+God+intends+no+end+conditionally%2C+but+where+He+intends+also+the+condition+itself%2C+that+so+it+may+be+equivalent+to+absolute%3A+But+He+intends+as+Legislator+that+faith+shall+be+the+prescribed+means+to+glory%2C+and+glory+the+end+promised+to+all+that+perform+that+condition%3B+and+so+conditionally+gives+it.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Universal+Redemption+of+Mankind+by+the+Lord+Jesus+Christ+%28London%3A+Salusbury%2C+1694%29%2C+pp.+305-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8e3ad3e9fc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8e3ad3e9fc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-conditional-aspects-of-gods-revealed-will/#:~:text=5.%20In%20so%20doing%20God%20does,condition%3B%20and%20so%20conditionally%20gives%20it&amp;text=5.%20In%20so%20doing%20God%20does%20all%20that&amp;text=perform%20that%20condition%3B%20and%20so%20conditionally%20gives%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

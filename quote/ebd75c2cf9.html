<main class="wrap"><figure class="quote" id="q-ebd75c2cf9" data-kw="">
<blockquote><p>The disorderly brethren there spoken of, are the busy-bodies that work not at all, v. 11. So that it is not meant of ministers literally, though it may be transferred to ministers by analogy; where they do not work in preaching, they are to be withdrawn from after the Church’s sentence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-07ea07336f" data-kw="">
<blockquote><p>There were many great corruptions in the Church of the Jews in Christ’s time, the priests and teachers were ignorant and wicked, and had a corrupt and unlawful entrance into their calling; and the people were like to the priests, generally notoriously and obstinately ungodly; and the worship used in that Church was woefully corrupt; many superstitious ceremonies, the observation whereof were more strictly urged than the commandments and ordinances of God; the Temple made a den of thieves, the discipline and censures shamefully abused, the doctrine was corrupt in many points; Yet the Word tells you Christ (whose example it binds you to follow, and you profess your selves followers of Him in all imitable things) made no separation from this Church, professed Himself a member of it, was by circumcision incorporated a member, received baptism in a congregation of that people, was a hearer of their common service and their teachers, allowing and commanding his disciples to hear them, communicated in the Passover with the people and the priests: No more did his apostles make separation from this Church after his ascension, till their day had its period, etc. By their example it appears that till God has forsaken a Church, no man may forsake it, etc. So that we conclude from hence with Mr. [Arthur] Hildersham: Those assemblies that enjoy the Word and doctrine of salvation, though they have many corruptions remaining in them, are to be acknowledged as true Churches of God, and such as none of the faithful may make separation from. We shall need no further proof of this doctrine than the example of our Savior Himself, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dr-brian.html">Dr. Brian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dwelling with God, p. 294 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’</cite>, pp. 25-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-05b418c578" data-kw="">
<blockquote><p>Their inference then from that text, 1 Sam. 2:17, 24 (if they speak to the purpose) must be this, viz. We ought to separate from a true Church, and set up a distinct Church within it, if but two scandalous ministers be not brought under due censure, though somewhat be done against them, and their wickedness be truly represented; as old Eli the high priest had reproved his sons pertinently and gravely, though I confess he ought to have done more. I shall yet be more liberal: What though not only two, but a great number of scandalous ministers in a true Church do escape condign censure? This affords no ground for relinquishing of them, and setting up a distinct Church: In such a case the scandals are not espoused, nor do even errors and heresies become the sentiments of a Church that professes the truths opposite to them, though erroneous or scandalous persons may have so much countenance as to prove too strong for the sounder part, as the sons of Zeruiah were too strong for David.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-593ffe42d4" data-kw="">
<blockquote><p>It has been the sad observation of diverse, that every new trial has been the occasion of a new difference, if not division. The Lord partly, in his holy displeasure, withdrawing light and chastising his people for their sins, and partly trying and exercising of them in that great duty of mutual forbearance, so little made conscience of; and partly discovering infirmities, much dross in his own, by the contests so carnally managed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of a Book bearing the Title of The History of the Indulgence… (London: Cockerill, 1681), Preface</cite>, p. 4</span></figcaption>

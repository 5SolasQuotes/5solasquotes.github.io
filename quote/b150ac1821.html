<blockquote><p>As in the generation of man, though there be organical dispositions and qualifications for the soul, yet they have no causality upon the soul, but that is immediately infused by God.</p></blockquote>

<blockquote><p>Definition [of Ontological Goodness] Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty or the will. Just as the former consists in the knowability of being, so the latter consists in being’s appetibility. Hence it is defined as the property of being whereby it is made appetible or willable or, more briefly, it is appetibility or willability. On other interpretations of ontological goodness see what I wrote elsewhere (Wolter, Transcendentals, p.199 ff.). On the Convertibility of Ontological Goodness Conclusion 29: Every being is good, or being and good convert. The appetite or will tends to its object either because the object is perfect for it, namely insofar as it has the being-ness and perfection due to it (love of benevolence), or because the object confers perfection on another (love of concupiscence). As far as God is concerned, it is plain that he is altogether perfect and so supremely appetible both to himself and to another. As far as creatures are concerned, one must say that they are truly loved or willed by God himself, otherwise they would not exist; therefore they are lovable or willable. Further, creatures are also good for other creatures; for example substance upholds accidents, accidents give further perfection to substance, etc.</p></blockquote>

<blockquote><p>Now, as medieval thinkers like Thomas Aquinas argued, anything with an intellect must also possess a will. For a substance with an intellect acts by virtue of being inclined toward what its intellect takes to be good, and the will just is (on this analysis) an inclination of that sort.</p></blockquote>

<blockquote><p>Here ye must observe, that in this work of the restitution of mankind, and that in all the parts thereof, there is but one only grace of God, which is the beginning and first cause of all these proceedings; but we, according to the variety of the eflfects thereof, do thus distinguish it, and consider of it diversely; like as the Spirit of God, which is one, 1 Cor. 12:4, in respect of the diversity of the gifts and effects thereof, is after a sort distinguished, for that In some respect, but not in deed and verity, He seems not to be one and the same, as it were, Rom. 8:15, ‘For you have not received the spirit of bondage to fear any more, but you have received the Spirit of adoption.’ By this that has been spoken, understand that there are, as it were, four graces of God in the restoring of mankind, and in the parts thereof. For whereas there is a double mercy of God in our effectual vocation, to wit: First, an offering of Christ with all his benefits in the covenant of grace, or the Gospel; secondly, faith to receive Christ being offered (under faith I comprehend hope and calling, repentance, which follow faith). Therefore, In our effectual calling two graces must be understood; the grace of our vocation, or of offering Christ unto us, and the grace of faith, or of receiving Christ by us. In justification we have a third grace, which we may call the grace of justification. And in glorification there is a fourth grace, which we may not unfitly call the grace of glorification. Hence we may see that the first grace, which they call preventing grace, is that grace whereby God first calls us to Himself by his Gospel; and the last grace, which is the complement of grace, to be that grace whereby God does glorify us together with his Son in his kingdom; for He begins the last grace in this life by regeneration, but reserves the full consummation thereof to another life by glorification. Thus much of the parts of the restitution of mankind, all which proceed from the mere grace of God, and are directed unto the glory of his grace. We must observe this in general, that all the blessings of God, as well those that were from all eternity as those that are in time, be founded upon the only and mere grace of God. And that in respect of grace there is no difference between those benefits of God that were before all worlds, as his prescience and predestination, and these which are in time, as our vocation, justification, glorification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, ed. Gunn (d. 1599; Edinburgh: Wodrow Society, 1849), vol. 1, A Treatise of God’s Effectual Calling, ch. 38, ‘Concerning the Free Grace of God’, pp. 270-71</span></figcaption>

<blockquote><p>Some infer from this passage that men were content with herbs and fruits until the deluge, and that it was even unlawful for them to eat flesh. And this seems the more probable, because God confines, in some way, the food of mankind within certain limits. Then after the deluge [Gen. 9], He expressly grants them the use of flesh. These reasons, however are not sufficiently strong: for it may be adduced on the opposite side, that the first men offered sacrifices from their flocks [Gen. 4]. This, moreover, is the law of sacrificing rightly, not to offer unto God anything except what He has granted to our use. Lastly men were clothed in skins [Gen. 3:21]; therefore it was lawful for them to kill animals. For these reasons, I think it will be better for us to assert nothing concerning this matter. Let it suffice for us, that herbs and the fruits of trees were given them as their common food; yet it is not to be doubted that this was abundantly sufficient for their highest gratification. For they judge prudently who maintain that the earth was so marred by the deluge, that we retain scarcely a moderate portion of the original benediction. Even immediately after the fall of man, it had already begun to bring forth degenerate and noxious fruits, but at the deluge, the change became still greater. Yet, however this may be, God certainly did not intend that man should be slenderly and sparingly sustained; but rather, by these words, He promises a liberal abundance, which should leave nothing wanting to a sweet and pleasant life. For Moses relates how beneficent the Lord had been to them, in bestowing on them all things which they could desire, that their ingratitude might have the less excuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 1, verse 28</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Some infer from this passage that men were content with herbs and fruits until the deluge, and that it was even unlawful for them to eat flesh. And this seems the more probable, because God confines, in some way, the food of mankind within certain limits. Then after the deluge [Gen. 9], He expressly grants them the use of flesh. These reasons, however are not sufficiently strong: for it may be adduced on the opposite side, that the first men offered sacrifices from their flocks [Gen. 4]. This, moreover, is the law of sacrificing rightly, not to offer unto God anything except what He has granted to our use. Lastly men were clothed in skins [Gen. 3:21]; therefore it was lawful for them to kill animals. For these reasons, I think it will be better for us to assert nothing concerning this matter. Let it suffice for us, that herbs and the fruits of trees were given them as their common food; yet it is not to be doubted that this was abundantly sufficient for their highest gratification. For they judge prudently who maintain that the earth was so marred by the deluge, that we retain scarcely a moderate portion of the original benediction. Even immediately after the fall of man, it had already begun to bring forth degenerate and noxious fruits, but at the deluge, the change became still greater. Yet, however this may be, God certainly did not intend that man should be slenderly and sparingly sustained; but rather, by these words, He promises a liberal abundance, which should leave nothing wanting to a sweet and pleasant life. For Moses relates how beneficent the Lord had been to them, in bestowing on them all things which they could desire, that their ingratitude might have the less excuse.”

— John Calvin, Commentary on Gen. 1, verse 28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSome+infer+from+this+passage+that+men+were+content+with+herbs+and+fruits+until+the+deluge%2C+and+that+it+was+even+unlawful+for+them+to+eat+flesh.+And+this+seems+the+more+probable%2C+because+God+confines%2C+in+some+way%2C+the+food+of+mankind+within+certain+limits.+Then+after+the+deluge+%5BGen.+9%5D%2C+He+expressly+grants+them+the+use+of+flesh.+These+reasons%2C+however+are+not+sufficiently+strong%3A+for+it+may+be+adduced+on+the+opposite+side%2C+that+the+first+men+offered+sacrifices+from+their+flocks+%5BGen.+4%5D.+This%2C+moreover%2C+is+the+law+of+sacrificing+rightly%2C+not+to+offer+unto+God+anything+except+what+He+has+granted+to+our+use.+Lastly+men+were+clothed+in+skins+%5BGen.+3%3A21%5D%3B+therefore+it+was+lawful+for+them+to+kill+animals.+For+these+reasons%2C+I+think+it+will+be+better+for+us+to+assert+nothing+concerning+this+matter.+Let+it+suffice+for+us%2C+that+herbs+and+the+fruits+of+trees+were+given+them+as+their+common+food%3B+yet+it+is+not+to+be+doubted+that+this+was+abundantly+sufficient+for+their+highest+gratification.+For+they+judge+prudently+who+maintain+that+the+earth+was+so+marred+by+the+deluge%2C+that+we+retain+scarcely+a+moderate+portion+of+the+original+benediction.+Even+immediately+after+the+fall+of+man%2C+it+had+already+begun+to+bring+forth+degenerate+and+noxious+fruits%2C+but+at+the+deluge%2C+the+change+became+still+greater.+Yet%2C+however+this+may+be%2C+God+certainly+did+not+intend+that+man+should+be+slenderly+and+sparingly+sustained%3B+but+rather%2C+by+these+words%2C+He+promises+a+liberal+abundance%2C+which+should+leave+nothing+wanting+to+a+sweet+and+pleasant+life.+For+Moses+relates+how+beneficent+the+Lord+had+been+to+them%2C+in+bestowing+on+them+all+things+which+they+could+desire%2C+that+their+ingratitude+might+have+the+less+excuse.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+Gen.+1%2C+verse+28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8a312a8286.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8a312a8286.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=Some%20infer%20from%20this%20passage%20that,ingratitude%20might%20have%20the%20less%20excuse&amp;text=Some%20infer%20from%20this%20passage%20that%20men%20were&amp;text=that%20their%20ingratitude%20might%20have%20the%20less%20excuse" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

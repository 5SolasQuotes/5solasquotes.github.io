<main class="wrap"><figure class="quote" id="q-da5b01a815" data-kw="">
<blockquote><p>[T]he Promise made unto Adam, and all Mankind in him, The Man that doth those things shall live, which by the Rule of Contraries implies the threatening and the Curse against all Transgressors. If she shall live who fulfils the Law, then by the contrary proportion he shall die who transgresseth it.

And this threatening we find expressly annexed to one particular Command of the Covenant of Works, Gen. 2. 17. In the day thou eatest thereof, that is, of the Tree of the Knowledge of Good and Evil, thou shalt surely die. And to the general Tenor of the whole, Gal. 3. 10. Cursed is every one who continueth not in all things which are written in the Book of the Law to do them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Two Covenants</cite>, (London: Richard Smith, 1712), pp 59-60.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b3bd8ec8c" data-kw="">
<blockquote><p>These covenants differ, in relation to the Parties contracting the covenant of works, the Parties were God, and the first Adam, representing all his natural posterity; but in the covenant of grace, the Parties were God the Father, and Christ the second Adam, representing all his spiritual seed. The first covenant, was made with a mere man, a fallible creature: the second, was established with God-man, “the Lord from heaven, who enangeth not.” The former, depended on a righteous creature: the latter, on a righteous, an almighty Redeemer.

The one, was made with man in his best state, and yet he kept it not: the other, was made with God-man, our blessed Immanuel, who neither could nor would, fail in fulfilling it. In that, the triune God, is to be considered as the supreme Lawgiver, and the fountain of uncreated goodness, delighting in communicating happiness to an upright creature: in this, he is to be viewed as infinitely merciful and gracious, rejoicing to give, in a manner suited to the glory of all his perfections, eternal life to an elect sinner believing in Jesus.

According to the covenant of works, God could deal with man, and man with God, immediately; but according to the covenant of grace, he cannot deal with man, nor man with him, but through a Mediator. With the blessed Mediator it was, that he dealt primarily, and immediately; and with man, only in and through Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 536-37.</span></figcaption>

</figure><figure class="quote" id="q-0cdc556709" data-kw="">
<blockquote><p>As therefore I have showed in what sense the covenant of grace is called “the new covenant,” in this distinction and opposition, so I shall propose sundry things which relate unto the nature of the first covenant, which manifest it to have been a distinct covenant, and not a mere administration of the covenant of grace: — 1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 92</span></figcaption>

</figure><figure class="quote" id="q-45221490ee" data-kw="">
<blockquote><p>OBJECTION. If any shall say, “By ‘first and old covenant’ was meant God’s covenant with Israel, and not with Adam; and so, by ‘covenant of works’ the same is meant; namely, that which the Lord made at Mount Sinai:” (Heb. 8:7–9:) ANSWER. Hereunto I answer, There is a repetition of the covenant of works with Adam in the law of Moses; as in that of the apostle to the Galatians: “The law is not of faith: but, The man that doeth” these things “shall live in them.” (Gal. 3:12.) So likewise to the Romans: “Moses describeth the righteousness which is of the law, That the man who doeth those things shall live by them.” (Rom. 10:5.) Thus it was with Adam principally and properly: therefore he was under a covenant of works, when God gave him that command in my text.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cooper.html">William Cooper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Sermon VI: The Covenant of Works” in James Nichols</cite>, ed. Puritan Sermons (Wheaton, IL: Richard Owen Roberts, Publishers, 1981), 5.97.</span></figcaption>

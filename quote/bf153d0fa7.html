<main class="wrap"><figure class="quote" id="q-bf153d0fa7" data-kw="">
<blockquote><p>In the items of sporting intelligence, it is quite common to read of a horse in the steeple-chase thrown in the mire, falling against a fence, or in a river, in leaping, and of injuries of wind and limb, which are not likely to be soon repaired, while others are reported as having been deprived of the life in a moment. Has any person a right thus to treat animals which have peculiar claims upon human protection? Should public feeling tolerate such abuses?

Ought not the laws which punish cruelty to animals be applied here? and should not the authorities compel the promoters of the steeple-chase to desist from their unnatural practices, or heavily punish them if they persist? It is certainly too bad to fine a poor carman for cruelty to his horse that is of little use, and suffer those who cruelly maltreat and cause the death of animals that are very valuable to go on their reckless course, inflicting grievous injuries unrestrained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Races: The Evils Connected with Horse-Racing and the Steeple-Chase and their Demoralizing Effects</cite>, (1853) in Works: Doctrinal and Practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 4: 393-94.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

Ought not the laws which punish cruelty to animals be applied here? and should not the authorities compel the promoters of the steeple-chase to desist from their unnatural practices, or heavily punish them if they persist? It is certainly too bad to fine a poor carman for cruelty to his horse that is of little use, and suffer those who cruelly maltreat and cause the death of animals that are very valuable to go on their reckless course, inflicting grievous injuries unrestrained.”

<blockquote><p>…we are unworthy to lift up our eyes unto heaven and appear in thy presence, and that we ought not to presume to hope that thou wilt listen to our prayers if thou takest account of the things which we lay before thee; for we are accused by our own consciences, and our sins bear witness against us, while we know thee to be a just Judge, who justifiest not sinners and wicked men, but inflictest punishment on those who have broken thy commands. Hence it is, Lord, that when we reflect on the state of our whole life, we are ashamed of ourselves, and can do nothing but despond, just as if we were plunged into the abyss of death. And yet, Lord, since thou hast deigned, of thy boundless mercy, to command us to call upon thee, and that from the lowest hell, and the more devoid of strength we see ourselves to be to flee the more to thy supreme goodness ; since, moreover, thou hast promised that thou wilt listen to our prayers in the name of the Lord Jesus Christ, (whom thou hast appointed to be our advocate and intercessor,) and for his merit, without looking to what we have deserved, we here, renouncing all human confidence, and trusting solely to thy goodness, hesitate not to come into thy sight, and call upon thy holy name, in order to obtain mercy.</p></blockquote>

<blockquote><p>Then church and state are like[ly] to flourish when Moses and Aaron, Zerubbabel and Joshua, Zech 4:14, go hand in hand together. When the minister reproves sin, and the magistrate punishes it; when the magistrate makes use of the minister’s direction, and the minister enjoys the magistrate’s protection; when Joshua joins with Eleazar, and David consults with Nathan and Gad, the prophets of the Lord; and Josiah with Huldah, and Uzziah with Zechariah the priest, then, and never till then, can we look to prosper, 2 Chron 26:5. It is Aaron’s office to speak, but it is Moses’s rod that works the wonders. Ministers must preach, and magistrates must punish offenders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty of Magistracy in an Exposition of the 82nd Psalm</cite>, pp. 76-82 in The Beauty of Magistracy in an Exposition of the 82nd Psalm, where is set forth the necessity, utility, dignity, duty, and mortality of magistrates… (London, 1660)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

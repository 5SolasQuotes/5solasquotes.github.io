<blockquote><p>5. In the same light are we to consider the law of the Decalogue, delivered by God to His peculiar people, the Jews, by the hands of Moses. For though it reveals the greatness of sin,1 and more and more convinces man thereof, yet, as it neither points out a remedy nor imparts strength to extricate him from his misery,2 but, being weak through the flesh,3 leaves the transgressor under the curse,4 and man cannot by this law obtain saving grace. 6.What, therefore, neither the light of nature nor the law could do, that God performs by the operation of the Holy Spirit1 through the word or ministry of reconciliation;2 which is the gospel concerning the Messiah, by means whereof it has pleased God to save such as believe,3 as well under the Old as under the New Testament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/canons-of-the-synod-of-dort.html">Canons of the Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 3/4.5–6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c30af86216" data-kw="">
<blockquote><p>Just as Abraham, when God allied Himself with him, was obligated to ‘walk before his face’, so Israel as a people was similarly admonished by God’s covenant to a new obedience. The entire law, which the covenant of grace at Mount Sinai took into its service, is intended to prompt Israel as a people to ‘walk’ in the way of the covenant. It is but an explication of the one statement to Abraham: ‘Walk before me, and be blameless [Gen. 17:1], and therefore no more a cancellation of the covenant of grace and the foundation of a covenant of works than this word spoken to Abraham. The law of Moses, accordingly, is not antithetical to grace but subservient to it and was also thus understood and praised in every age by Israel’s pious men and women. But detached from the covenant of grace, it indeed became a letter that kills, a ministry of condemnation. Another reason why in the time of the Old Testament the covenant of grace took the law into its service was that it might arouse the consciousness of sin, increase the felt need for salvation, and reinforce the expectation of an even richer revelation of God’s grace. It is from that perspective that Paul views especially the Old Testament dispensation of the covenant of grace. He writes that Israel as a minor, placed under the care of the law, had to be led to Christ (Rom. 10:4; Gal. 3:23f.; 4:1f.) and that in that connection sin would be increased and the uselessness of works for justification and the necessity of faith would be understood (Rom. 4:15; 5:20; 7:7f.; 8:3; Gal. 3:19). On the one hand, therefore, the law was subservient to the covenant of grace; it was not a covenant of works in disguise and did not intend that humans would obtain justification by their own works. On the other hand, its purpose was to lay the groundwork for a higher and better dispensation of that same covenant of grace to come in the fullness of time. The impossibility of keeping the Sinaitic covenant and of meeting the demands of the law made another and better dispensation of the covenant of grace necessary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 3, pt. 2, ch. 5, ‘The Covenant in Old Testament Salvation History’, p. 222</span></figcaption>

</figure><figure class="quote" id="q-e0985778de" data-kw="">
<blockquote><p>The difference between us here is not: (1) Whether both these [the Covenant of Works with Adam and the Mosaic Covenant] be called covenants in Scripture? Nor (2) Whether there was no grace at all in both, or either of them; for we are agreed , it is grace in God to enter into covenant with man, whatever that covenant be. Nor (3) Whether the Sinai law be not a covenant of works to some men, by their own fault and occasion? Nor (4) Whether the Scriptures do not many times speak of it in that very sense and notion wherein carnal justiciaries apprehend and take it; and by rejecting Christ, make it so to themselves? Nor (5) Whether the very matter of the law of nature be not revived and represented in the Sinai law? These are not the points we contend about. But the question is: Whether the Sinai law do in its own nature, and according to God’s purpose and design in the promulgation of it, revive the law of nature, to the same ends and uses it served to in Adam’s covenant; and so be properly and truly a covenant of works? Or whether God had not gracious and evangelical ends and purposes, viz. by such a dreadful representation of the severe and impracticable terms of the first covenant, instead of obliging them to the personal and punctual observance observance of them for righteousness and life, He did not rather design to convince them of the impossibility of legal righteousness, humble proud nature, and show them the necessity of betaking themselves to Christ, now exhibited in the new covenant, as the only refuge to fallen sinners?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis et Foederis</cite>, [Vindications of the Law and Covenant]: or a Reply to Mr. Philip Cary’s Solemn Call in Works, vol. 6, p. 323</span></figcaption>

</figure><figure class="quote" id="q-a0ff0d7b1d" data-kw="">
<blockquote><p>The Church of Rome in a manner confounds the law and the gospel, saying that the gospel, which is the new law, reveals Christ more clearly than Moses’ law did, which they call the old law. But this is a wicked opinion, which overturns all religion, being the cause of many gross points in popery, which could not stand, if they would acknowledge a true distinction between the law and the gospel. They say for their defense that the precepts of both are the same in substance; that both require righteousness; both promise life, and threaten death; both command faith, repentance, and obedience; and therefore they are the same. Answer . First, the laws and precepts Answer . First, the laws and precepts of the law and gospel are not the same, for Adam in his innocence knew the law, but he knew nothing then of believing in Christ. And though both require righteousness, promise life, and threaten death, yet the manner is far different, as before was noted, so likewise they differ in the commanding of faith, for the gospel commands faith, not as a work done, as the law does, but as an instrument laying hold on Christ. Again, the law commands faith generally, as to believe in God, and to believe His Word to be true; but besides this, the gospel requires a particular faith in Christ the Redeemer, whom the law never knew. Thirdly, the law commands not repentance, for the knowledge of the law was in Adam’s heart, when he needed no repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on Christ’s Sermon on the Mount, in Works</cite>, 1:244–45.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Church of Rome in a manner confounds the law and the gospel, saying that the gospel, which is the new law, reveals Christ more clearly than Moses’ law did, which they call the old law. But this is a wicked opinion, which overturns all religion, being the cause of many gross points in popery, which could not stand, if they would acknowledge a true distinction between the law and the gospel. They say for their defense that the precepts of both are the same in substance; that both require righteousness; both promise life, and threaten death; both command faith, repentance, and obedience; and therefore they are the same. Answer . First, the laws and precepts Answer . First, the laws and precepts of the law and gospel are not the same, for Adam in his innocence knew the law, but he knew nothing then of believing in Christ. And though both require righteousness, promise life, and threaten death, yet the manner is far different, as before was noted, so likewise they differ in the commanding of faith, for the gospel commands faith, not as a work done, as the law does, but as an instrument laying hold on Christ. Again, the law commands faith generally, as to believe in God, and to believe His Word to be true; but besides this, the gospel requires a particular faith in Christ the Redeemer, whom the law never knew. Thirdly, the law commands not repentance, for the knowledge of the law was in Adam’s heart, when he needed no repentance.”

— William Perkins, An Exposition on Christ’s Sermon on the Mount, in Works, 1:244–45. (HT: Inwoo Lee)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Church+of+Rome+in+a+manner+confounds+the+law+and+the+gospel%2C+saying+that+the+gospel%2C+which+is+the+new+law%2C+reveals+Christ+more+clearly+than+Moses%E2%80%99+law+did%2C+which+they+call+the+old+law.+But+this+is+a+wicked+opinion%2C+which+overturns+all+religion%2C+being+the+cause+of+many+gross+points+in+popery%2C+which+could+not+stand%2C+if+they+would+acknowledge+a+true+distinction+between+the+law+and+the+gospel.+They+say+for+their+defense+that+the+precepts+of+both+are+the+same+in+substance%3B+that+both+require+righteousness%3B+both+promise+life%2C+and+threaten+death%3B+both+command+faith%2C+repentance%2C+and+obedience%3B+and+therefore+they+are+the+same.+Answer+.+First%2C+the+laws+and+precepts+Answer+.+First%2C+the+laws+and+precepts+of+the+law+and+gospel+are+not+the+same%2C+for+Adam+in+his+innocence+knew+the+law%2C+but+he+knew+nothing+then+of+believing+in+Christ.+And+though+both+require+righteousness%2C+promise+life%2C+and+threaten+death%2C+yet+the+manner+is+far+different%2C+as+before+was+noted%2C+so+likewise+they+differ+in+the+commanding+of+faith%2C+for+the+gospel+commands+faith%2C+not+as+a+work+done%2C+as+the+law+does%2C+but+as+an+instrument+laying+hold+on+Christ.+Again%2C+the+law+commands+faith+generally%2C+as+to+believe+in+God%2C+and+to+believe+His+Word+to+be+true%3B+but+besides+this%2C+the+gospel+requires+a+particular+faith+in+Christ+the+Redeemer%2C+whom+the+law+never+knew.+Thirdly%2C+the+law+commands+not+repentance%2C+for+the+knowledge+of+the+law+was+in+Adam%E2%80%99s+heart%2C+when+he+needed+no+repentance.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+An+Exposition+on+Christ%E2%80%99s+Sermon+on+the+Mount%2C+in+Works%2C+1%3A244%E2%80%9345.+%28HT%3A+Inwoo+Lee%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa0ff0d7b1d.html&amp;via=5Solas" target="_blank" rel="noopener">Share o

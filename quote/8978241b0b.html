<blockquote><p>In his great work, The Hexaëdemeron (1230–35), Grossteste attempts a synthesis of all major interpretations hitherto given in the church… Here, in this medieval scholastic bishop, lie the roots of what eventually became known as the framework hypothesis.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-af6b4efbb6" data-kw="">
<blockquote><p>There is talk of a new astrologer who wants to prove that the earth moves and goes around instead of the sky, the sun, the moon, just as if somebody were moving in a carriage or ship might hold that he was sitting still and at rest while the earth and the trees walked and moved. But that is how things are nowadays: when a man wishes to be clever he must needs invent something special, and the way he does it must needs be the best! The fool wants to turn the whole art of astronomy upside-down. However, as Holy Scripture tells us, so did Joshua bid the sun to stand still and not the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in</cite>, ed. Eriksson, Estep &amp; Johnson, Applied Mathematics: Body &amp; Soul, vol. 3, Calculus in Several Dimensions (Springer, 2004), p. 859</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-925b271fd6" data-kw="">
<blockquote><p>“But some dare say, either because of the love of novelties or in order to appear ingenious, that the earth moves, and contend that neither the eight sphere nor the sun moves while they assign other movement to the celestial spheres and place the earth among the stars. The joke is not new. There is a book by Archimedes called De Numeratione Arenae, in which he reports that Aristarchus of Samos defended this paradox, that the sun remains fixed and the earth turns around the sun. And although clever workers investigate many questions to give expression to their ingenuity, the young should know that it is not good to defend such absurd opinions publicly, nor is it honest or a good example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Bruce T. Moran, ‘The Universe of Philip Melanchthon: Criticism and Use of the Copernican Theory’ Comitatus 4</cite>, (1973), pp. 13-14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-e899841436" data-kw="">
<blockquote><p>The second is, why God called only the light ‘day’, and Moses calls both the evening and the morning, that is, the time of light and darkness, ‘one day’, or ‘the first day’. I answer that God’s ‘day’, which is most truly and properly so called, is the time of light, and in it there is no night or darkness. For God speaks of a natural day, distinct from the night: but Moses speaks of a civil day which comprehends in it the space of 24 hours, in which the sun runs round about the world with the heavens; which ‘day’ includes in it a day and a night: and here observe that God’s ‘day’ is all light, and man’s ‘day’ is mixed of light and darkness. Thirdly, it may asked whether the night, or the day went before in the first day of the creation. The answer is that the night or time of darkness was first; and it is likely that darkness did overspread the face of the deep the space of a night, that is 12 hours, before God formed the light, and setled the visible heavens in their place; and that after the light was created, it did shine forth for the space of 12 hours more before God went about to make the firmament, which was the second day’s work; and so the first day of the world was of the same length with all other civil or astronomical days, that is, 24 hours, divided equally between light and darkness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Creation as it is Written by Moses in the First &amp; Second Chapters of Genesis: Plainly Opened &amp; Expounded in Several Sermons</cite>, … (London: Barlet, 1641), Of the Creation of the World, ch. 6; p. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

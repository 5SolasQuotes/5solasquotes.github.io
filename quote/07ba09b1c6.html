<main class="wrap"><figure class="quote" id="q-07ba09b1c6" data-kw="">
<blockquote><p>The person spoken unto [in Psalm 110:1] is the Son, אָדוֹן, “the Lord,” David’s Lord; in what respect we must now inquire. The Lord Christ, the Son, in respect of his divine nature, is of the same essence, power, and glory, with the Father, John x. 30. Absolutely, therefore, and naturally, in that respect he is capable of no subordination to the Father or exaltation by him, but what depends on and flows from his eternal generation, John v. 26.

By dispensation he humbled himself, and emptied himself of this glory, Phil. ii. 7, 8; not by a real parting with it, but by the assumption of human nature into personal union with himself, being made flesh, John i. 14; wherein his eternal glory was clouded for a season, John xvii. 5, and his person humbled to the discharge of those acts of his mediation which were to be performed in the human nature, Phil. ii. 9, 10.

This person of Christ is here spoken unto, not in respect of his divine nature only, which is not capable of exaltation or glory by the way of free gift or donation; nor in respect of his human nature only, which is not the king and head of the church; but with respect unto his whole person, wherein the divine nature, exerting its power and glory with the will and understanding of the human nature, is the principle of those theandrical acts whereby Christ ruleth over all in the kingdom given him of his Father, Rev. i. 17, 18.

As he was God, he was David’s Lord, but not his son; as he was man, he was David’s son, and so absolutely could not be his Lord; in his person, as he was God and man, he was his Lord and his son, — which is the intention of our Saviour’s question, Matt. xxii. 45.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. William H. Goold (1674; 7 vols, Edinburgh: Johnston and Hunter, 1854), 3: 224-25.</span></figcaption>

<blockquote><p>1st Distinction. There is one power of public preaching in a Church not constitute[d], and another in a Church constitute[d]; gifted persons in extraordinary cases, where a Church is not planted, may publicly preach, but the case is otherwise in a Church constituted. … 4th Distinction. There is a call to an habitual and ordinary prophesying; here is required not only a calling by gifts, but also a collation of authority to the office, either immediately by God, or mediately by the Church, and there is a call to some particular or occasional acts of exhorting, as the martyrs and Stephen [Acts 7] are called to give confession of their faith, and a king in battle, to exhort his army, or a prince his subjects to piety, and to this latter there is no other call required but the place and profession of the exhorter, though he bee not by office a pastor. 5th Distinction. There is a formal calling of the Church, as the laying on of the hands of the elders, and a virtual and interpretative calling or tacit approbation of the Church, when learned men of eminent gifts, not in office, do write commentaries, sermons on canonic Scriptures, and tractates refuting heresies; to this the tacit approbation of the Church is required, but these have not ordinary pastoral care, nor are they the ordinary converters of souls to Christ, as the pretended prophets of [the] Separatists are.</p></blockquote>

<blockquote><p>Our judgment is that none may publicly in the church assembly of the faithful preach the Word of God in the Name of Christ and of God, but he who is sent by a divine calling for that work; as the Protestants demonstrate against the Socinians and Anabaptists from Rom. 10:14-15; Heb. 5:4-5; Acts 13:1-2 &amp; 14:22; Tit. 1:5; 2 Tim. 2:2, and other places and arguments; and from the examples of all those, who either in an extraordinary or ordinary manner were sent to preach the Word. Which mission, or sending, consists not only in conferring gifts, whereby an ability, [Greek], is given by God; but in conferring a power, whereby is given an authority, [Latin], to preach the Word of God; which authority is oft-times not conferred on those, on whom yet God bestows gifts and ability. For it is by the Word of God denied to women, in whose lips is the Law of God, Prov. 31:26, and a fitness to teach the yonger women, Tit. 2:3-4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated</cite>, (London: G.M., 1645), ch. 5, ‘Of the Ecclesiastical Ministry, and the Exercise thereof’, pp. 75-77</span></figcaption>

<blockquote><p>Therefore, though it is to be wished and endeavored that all elders may have due qualifications for all these things and though special care is to be taken everywhere to choose the most qualified, yet in particular congregations men may be chosen elders who have not such a measure of all these qualifications, they being otherwise men of a blameless and Christian conversation and having such a measure of knowledge and prudence as is fit for governing that congregation and judging of the things that are handled in the session thereof, which for the most part are matters of scandal and trying and admitting of penitents; but if there be any who are not of a blameless and Christian conversation and have not some measure of these qualifications required by the Word of God in a ruling elder, no congregation ought to choose any such, nor any session or presbytery to admit them to the charge…</p></blockquote>

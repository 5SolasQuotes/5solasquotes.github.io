<main class="wrap"><figure class="quote" id="q-7dc555aaa8" data-kw="">
<blockquote><p>Now besides the sacred signs of God’s own institution, we know that natural signs have also place in divine worship; thus kneeling in time of prayer signifies the submission of our hearts and minds, the lifting up of our eyes and hands signifies the elevation of our affections, the renting of the garments signified the renting of the heart by sorrow, standing with a religious respect to that which is before us, signifies veneration or reverence, sitting at table signifies familiarity and fellowship. ‘For which of you,’ says our Master, ‘having a servant plowing or feeding cattle, will say unto him by and by, when he is come from the field, go and sit down to meat.’ [Lk. 17:7] All these signs have their significations from nature. And if it be said that howbeit sitting at our common-tables be a sign natural, to signify familiarity amongst us, yet nature has not given such a signification to sitting at the Lord’s Table, I answer that sitting is a natural sign of familiarity at what table soever it be used. At the heavenly table in the Kingdome of Glory familiarly is expressed and signified by sitting, Mt. 8:11, ‘Many shall come from the east and west, and shall sit down with Abraham, etc.’ Much more then at the spiritual table in the Kingdom of Grace. The difference betwixt other common tables and the Lord’s Table can infer no more but that with great humility we ought to addresse ourselves unto it: yet still we are to make use of our familiarity with Christ ut tanquam in eodem toro accumbentes, as says Chrysostom. Wherefore we do not there so look to Christ in his princely throne and glorious majesty, exalted far above all principalities and powers, as to forget that He is our loving and kind banqueter, who has admitted us to that familiar fellowship with Him, which is signified by our sitting at his table.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, pp. 85-86</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-98a8c10b1e" data-kw="">
<blockquote><p>That has been the uniform and constant order of this Church [of Scotland], since the reformation [in 1560]: that the communicants should receive the sacramental elements of bread and wine, sitting at the table. In the second head of the First Book of Discipline [of the Church of Scotland, 1560], are set down these words: ‘The table of the Lord is then rightly ministered when it approaches most near to Christ’s own action, but it is plain that at that supper Christ Jesus sat with his disciples, and therefore we do judge that sitting at a table is most convenient to that holy action.’ In the general Assembly held in December 1562 it was ordained, That one uniform order be observed in the ministration of the sacraments, according to the order of Geneva [Switzerland, where John Calvin was]… But so it is, that sitting at the table in the act of receiving has been established by laws, custom, long prescription of time and confirmed by oaths and subscriptions as is evident by the former deduction.</p></blockquote>

</figure><figure class="quote" id="q-820b3cb529" data-kw="">
<blockquote><p>Do they [our divines] not teach… That the negative precepts of the Law do bind, not only at all times, but likewise to all times, (whereupon it follows that we may never do that which is inconvenient or scandalous), and that the affirmative precepts though they bind at all times, yet not to all times, but only quando expedit [when it is expedient] (whereupon it follows that we are never bound to the practice of any duty commanded in the Law of God except only when it is expedient to be done)? …forasmuch as to abstain from things scandalous and inconvenient is one of the negative precepts of the Law of God… it follows that the use and practice of the same is altogether unlawful unto us.</p></blockquote>

<blockquote><p>VI. Fifth, ‘the precepts of the first table take the preference of those of the second’ as to necessary internal and external acts, when they both cannot have place at the same time. Thus the love of our neighbor ought to be subjected to the love of God. We are bound to hate father and mother for Christ’s sake (Lk. 14:26), when the love of parents is incompatible (asystatos) with the love of Christ. Human commands are to be neglected when opposed to the commands of God (Mt. 10:37; Acts 4:19). But in turn ‘the ceremonial of the first table yields to the moral of the second because God desires mercy and not sacrifice’ (Hos. 6:6), i.e., moral worship principally and primarily as better and of itself necessary; the ceremonial, however, only secondarily on account of the moral. Hence we ought not to be so anxious about the former as about the latter. … VIII. Seventh, ‘the beginning and end of all the precepts is love.’… However as the object of love is twofold (God and our neighbor), so a twofold love is commanded: of God in the first table of the law; of our neighbor in the second. That is called ‘the first and great commandment’; this ‘the second like to it.’ The love of God is rightly called the ‘first’ commandment because as there is nothing before God, so his worship ought first to be attended to by us in order that all things may begin from and end in it. It is called ‘great’ (a) with regard to the object because conversant with the greatest and infinite object (viz., God)… The second is said to be ‘like’ unto it, not with regard to importance, but (1) with regard to quality because both in the love of God and of our neighbor sincerity and purity of heart are required; (2) with regard to authority because each is commanded by God and tends to his glory; (3) with regard to punishment because the violation of either table exposes to eternal death; (4) with regard to connection and dependence because they are so strictly connected with each other that neither can be fulfilled without the other (for as God cannot be loved without the love of God, who created him)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, ‘The Law of God’, Question 6, ‘The Rules of Explanation and of Observance of the Decalogue’, Sections VI &amp; VIII, pp. 35-37</span></figcaption>

<div class="actions"><button class="copy" data-copy="“VI. Fifth, ‘the precepts of the first table take the preference of those of the second’ as to necessary internal and external acts, when they both cannot have place at the same time. Thus the love of our neighbor ought to be subjected to the love of God. We are bound to hate father and mother for Christ’s sake (Lk. 14:26), when the love of parents is incompatible (asystatos) with the love of Christ. Human commands are to be neglected when opposed to the commands of God (Mt. 10:37; Acts 4:19). But in turn ‘the ceremonial of the first table yields to the moral of the second because God desires mercy and not sacrifice’ (Hos. 6:6), i.e., moral worship principally and primarily as better and of itself necessary; the ceremonial, however, only secondarily on account of the moral. Hence we ought not to be so anxious about the former as about the latter. … VIII. Seventh, ‘the beginning and end of all the precepts is love.’… However as the object of love is twofold (God and our neighbor), so a twofold love is commanded: of God in the first table of the law; of our neighbor in the second. That is called ‘the first and great commandment’; this ‘the second like to it.’ The love of God is rightly called the ‘first’ commandment because as there is nothing before God, so his worship ought first to be attended to by us in order that all things may begin from and end in it. It is called ‘great’ (a) with regard to the object because conversant with the greatest and infinite object (viz., God)… The second is said to be ‘like’ unto it, not with regard to importance, but (1) with regard to quality because both in the love of God and of our neighbor sincerity and purity of heart are required; (2) with regard to authority because each is commanded by God and tends to his glory; (3) with regard to punishment because the violation of either table exposes to eternal death; (4) with regard to connection and dependence because they are so strictly connected with each other that neither can be fulfilled without the other (for as God cannot be loved without the love of God, who created him)…”

— Francis Turretin, Institutes, vol. 2, 11th Topic, ‘The Law of God’, Question 6, ‘The Rules of Explanation and of Observance of the Decalogue’, Sections VI &amp; VIII, pp. 35-37">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVI.+Fifth%2C+%E2%80%98the+precepts+of+the+first+table+take+the+preference+of+those+of+the+second%E2%80%99+as+to+necessary+internal+and+external+acts%2C+when+they+both+cannot+have+place+at+the+same+time.+Thus+the+love+of+our+neighbor+ought+to+be+subjected+to+the+love+of+God.+We+are+bound+to+hate+father+and+mother+for+Christ%E2%80%99s+sake+%28Lk.+14%3A26%29%2C+when+the+love+of+parents+is+incompatible+%28asystatos%29+with+the+love+of+Christ.+Human+commands+are+to+be+neglected+when+opposed+to+the+commands+of+God+%28Mt.+10%3A37%3B+Acts+4%3A19%29.+But+in+turn+%E2%80%98the+ceremonial+of+the+first+table+yields+to+the+moral+of+the+second+because+God+desires+mercy+and+not+sacrifice%E2%80%99+%28Hos.+6%3A6%29%2C+i.e.%2C+moral+worship+principally+and+primarily+as+better+and+of+itself+necessary%3B+the+ceremonial%2C+however%2C+only+secondarily+on+account+of+the+moral.+Hence+we+ought+not+to+be+so+anxious+about+the+former+as+about+the+latter.+%E2%80%A6+VIII.+Seventh%2C+%E2%80%98the+beginning+and+end+of+all+the+precepts+is+love.%E2%80%99%E2%80%A6+However+as+the+object+of+love+is+twofold+%28God+and+our+neighbor%29%2C+so+a+twofold+love+is+commanded%3A+of+God+in+the+first+table+of+the+law%3B+of+our+neighbor+in+the+second.+That+is+called+%E2%80%98the+first+and+great+commandment%E2%80%99%3B+this+%E2%80%98the+second+like+to+it.%E2%80%99+The+love+of+God+is+rightly+called+the+%E2%80%98first%E2%80%99+commandment+because+as+there+is+nothing+before+God%2C+so+his+worship+ought+first+to+be+attended+to+by+us+in+order+that+all+things+may+begin+from+and+end+in+it.+It+is+called+%E2%80%98great%E2%80%99+%28a%29+with+regard+to+the+object+because+conversant+with+the+greatest+and+infinite+object+%28viz.%2C+God%29%E2%80%A6+The+second+is+said+to+be+%E2%80%98like%E2%80%99+unto+it%2C+not+with+regard+to+importance%2C+but+%281%29+with+regard+to+quality+because+both+in+the+love+of+God+and+of+our+neighbor+sincerity+and+purity+of+heart+are+required%3B+%282%29+with+regard+to+authority+because+each+is+commanded+by+God+and+tends+to+his+glory%3B+%283%29+with+regard+to+punishment+because+the+violation+of+either+table+exposes+to+eternal+death%3B+%284%29+with+regard+to+connection+and+dependence+because+they+are+so+strictly+connected+with+each+other+that+neither+can+be+fulfilled+without+the+other+%28for+as+God+cannot+be+loved+without+the+love+of+God%2C+who+created+him%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes%2C+vol.+2%2C+11th+Topic%2C+%E2%80%98The+Law+of+God%E2%80%99%2C+Question+6%2C+%E2%80%98The+Rules+of+Explanation+and+of+Observance+of+the+Decalogue%E2%80%99%2C+Sections+VI+%26+VIII%2C+pp.+35-37&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14ec447b49.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/14ec447b49.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relations-between-the-1st-2nd-tables-of-the-law/#:~:text=VI.%20Fifth%2C%20%E2%80%98the%20precepts%20of%20the,love%20of%20God%2C%20who%20created%20him&amp;text=VI.%20Fifth%2C%20%E2%80%98the%20precepts%20of%20the%20first%20table&amp;text=without%20the%20love%20of%20God%2C%20who%20created%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

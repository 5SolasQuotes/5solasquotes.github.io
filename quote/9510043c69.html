<blockquote><p>It is a delusion to think that it is the only way to testify against what I judge amiss in the minister, to cast at this ministry, and to withdraw from him. Whosoever adopts this principle and practices it accordingly, has not the mind of Christ; for there are other patent and obvious ways to witness against all the evil of our ways besides these: Nay, this way of witnessing is such as Christ will witness against it, as not the way.</p></blockquote>

</figure><figure class="quote" id="q-36242d952b" data-kw="">
<blockquote><p>Union may also be consistent with many particular failings and defects in the exercise of government; and possibly the sparing of so corrupt officers and members, yea, the censuring of some unjustly, or the admission of some that are unfit for the ministry, and such like. These indeed are faults, but they are not such as make a Church to be no Church. And though these have sometimes been pretended to be the causes of schisms and divisions in the Church in practice, yet were they never defended to be just grounds of schisms and divisions, but were ever condemned by all councils and fathers, and cannot be in reason sustained. Sure there were such corrupt acts of all kinds among the Jews’ Church officers: Yet is it clear that Nicodemus and Joseph of Arimathea did continue to govern jointly notwithstanding thereof, who yet cannot be counted accessory to any of their deeds, because (which is a third reason) men in such cases have access, even when they are present, to discountenance such corrupt acts by not consenting thereto, and testifying against the same; yea, they may by so doing stand in the way of many wicked acts, which by dividing they cannot do, which is sufficient for their exoneration both before God and men: As we may see in the instances of Joseph and Nicodemus mentioned, who continued united in the government, kept the meetings even when sentences pass against those who will acknowledge Christ, and orders for persecuting Him and them. And yet they are declared free, because they dissented from, and testified against the same: Yea, their freedom and exoneration, by virtue of their dissent, being present, is more solemnly recorded to their honor in the Gospel, than if they had divided.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

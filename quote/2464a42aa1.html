<main class="wrap"><figure class="quote" id="q-2464a42aa1" data-kw="">
<blockquote><p>The Westminster Confession of Faith is a document which will be the more appreciated the more carefully it is studied. … But while admission is thus freely made that the Westminster Confession of Faith is but a human document, liable to be modified by the Church in the way of revision or curtailment, it is most desirable, as the best means of preventing any incautious tampering with it, that the substance and scope of its teachings should be thoroughly apprehended.

In proportion as the truths contained in it are brought home to the heart and conscience in the strength of the Scriptural evidence for them and of their essential connection with the whole scheme of saving mercy, the Confession, so far as it expresses the mind of the Spirit, will cease to be accepted in heartless formalism; and, in the logical precision and coherence of the system of truth it unfolds, will prove a source of spiritual quickening and steadfastness and comfort to all who honestly and intelligently adopt or subscribe it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-h-goold.html">William H. Goold</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Preface to the British Edition , A. A. Hodge, A Commentary on the Confession of Faith</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-3af8ab438a" data-kw="">
<blockquote><p>If ye exclude all non-converts from the visible city of God (in which, daily, multitudes in Scotland, in all the four quarters of the land, above whatever our fathers saw, throng into Christ), shall they not be left to the lions and wild beasts of the forest, even to Jesuits, seminary-priests and other seducers? For the magistrate has no power to compel them to hear the Gospel, nor have ye any church-power over them, as ye teach; and they bring not love to the Gospel and to Christ out of the womb with them; and so they must be left to embrace what religion is most suitable to corrupt nature. Nor can it be a way approven by the Lord in Scripture to excommunicate from the visible church (which is the office-house of the free grace of Christ, and His draw-net) all the multitudes of non-converts, baptized and visibly within the Covenant of Grace which are in Great Britain and all the reformed Churches; and so to shut the gates of the Lord’s gracious calling upon all these (because they are not, in your judgment, chosen to salvation), when once you are within [salvation or the Church] yourselves. For how can the Lord call Egypt his people, and Assyria the work of his hands, and all the gentiles (who for numbers are as the flocks of Kedar, and the abundance of the sea) the kingdoms of our Lord and of His Christ, if you number infants (as many do) and all such as your charity cannot judge converts (as others do) among heathens and pagans, who have not a visible claim and interest in Christ? The candlestick is not yours, nor the House; but Christ fixes and removes the one and builds or casts down the other, according to his sovereignty. We in humility judge ourselves, though the chief of sinners, the sons of Zion and of the seed of Christ; if ye remove from us, and carry from hence the candlestick, let our Father be judge, and show us why the Lord has bidden you come out from among us. We look upon this visible church, though black and spotted, as the hospital and guest-house of sick, halt, maimed, and withered, over which Christ is Lord, Physician and Master: and we would wait upon those that are not yet in Christ, as our Lord waited upon us and you both. We, therefore, your brethren, children of one Father, cannot but with tears and exceeding sorrow of heart earnestly entreat, beseech, and obtest you, by the love of our Lord Jesus Christ, by His sufferings and precious ransom which He paid for us both, by the consolations of His Spirit, by your appearance before the dreadful tribunal of our Lord Jesus, yea, and charge you before God and the same Lord Jesus, “who shall judge the quick and the dead, at His appearing, and His kingdom,” break not the spirits and hearts of those to whom ye are dear as their own soul. Forsake not the assemblies of the people of God; let us not divide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters of Samuel Rutherford</cite>, (Edinburgh: Anderson &amp; Ferrier, 1894), Letter 364, to brethren in Aberdeen, pp. 706-7</span></figcaption>

<blockquote><p>24. And let us consider one another, etc. I doubt not but that he addresses the Jews especially in this exhortation. It is well­known how great was the arrogance of that nation; being the posterity of Abraham, they boasted that they alone, to the exclusion of all others, had been chosen by the Lord to inherit the covenant of eternal life. Inflated by such a privilege, they despised other nations, and wished to be thought as being alone in the Church of God; nay, they superciliously arrogated to themselves the name of being The Church. It was necessary for the Apostles to labor much to correct this pride; and this, in my judgment, is what the Apostle is doing here, in order that the Jews might not bear it ill that the Gentiles were associated with them and united as one body in the Church.

And first, indeed, he says, Let us consider one another; for God was then gathering a Church both from the Jews and from the Gentiles, between whom there had always been a great discord, so that their union was like the combination of fire and water. Hence the Jews recoiled from this, for they thought it a great indignity that the Gentiles, should be made equal with them. To this goad of wicked emulation which pricked them, the Apostle sets up another in opposition to it, even that of love; or the word παροξυσμὸς, which he uses, signifies the ardor of contention. Then that the Jews might not be inflamed with envy, and be led into contention, the Apostle exhorts them to a godly emulation, even to stimulate one another to love.

25. Not forsaking the assembling of ourselves together, etc. This confirms the view that has been given. The composition of the Greek word ought to be noticed; for ἐπὶ signifies an addition; then ἐπισυναγωγὴ, assembling together, means a congregation increased by additions. The wall of partition having been pulled down, God was then gathering those as his children who had been aliens from the Church; so the Gentiles were a new and unwonted addition to the Church. This the Jews regarded as a reproach to them, so that many made a secession from the Church, thinking that such a mixture afforded them a just excuse; nor could they be easily induced to surrender their own right; and further, they considered the right of adoption as peculiar, and as belonging exclusively to themselves. The Apostle, therefore, warns them, lest this equality should provoke them to forsake the Church; and that he might not seem to warn them for no reason, he mentions that this neglect was common to many.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p., 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 239-40.</span></figcaption>

+the+view+that+has+been+given.+The+composition+of+the+Greek+word+ought+to+be+noticed%3B+for+%E1%BC%90%CF%80%E1%BD%B6+signifies+an+addition%3B+then+%E1%BC%90%CF%80%CE%B9%CF%83%CF%85%CE%BD%CE%B1%CE%B3%CF%89%CE%B3%E1%BD%B4%2C+assembling+together%2C+means+a+congregation+increased+by+additions.+The+wall+of+partition+having+been+pulled+down%2C+God+was+then+gathering+those+as+his+children+who+had+been+aliens+from+the+Church%3B+so+the+Gentiles+were+a+new+and+unwonted+addition+to+the+Church.+This+the+Jews+regarded+as+a+reproach+to+them%2C+so+that+many+made+a+secession+from+the+Church%2C+thinking+that+such+a+mixture+afforded+them+a+just+excuse%3B+nor+could+they+be+easily+induced+to+surrender+their+own+right%3B+and+further%2C+they+considered+the+right+of+adoption+as+peculiar%2C+and+as+belonging+exclusively+to+themselves.+The+Apostle%2C+therefore%2C+warns+them%2C+lest+this+equality+should+provoke+them+to+forsake+the+Church%3B+and+that+he+might+not+seem+to+warn+them+for+no+reason%2C+he+mentions+that+this+neglect+was+common+to+many.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentaries+on+the+epistle+of+Paul+the+apostle+to+the+Hebrews%2C+trans.+John+Owen+%281549%3B+n.p.%2C+1853%29+in+Calvin%E2%80%99s+Commentaries+%2822+vols%2C+Grand+Rapids%2C+1993%29%2C+xxii%2C+239-40.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F03b79a484d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/03b79a484d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/04/03/john-calvin-on-racial-integration-in-the-church-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>IN the first place, we confess that Christians are obliged both by the will of their Master, and by their own welfare and salvation, to continue united one to another, and all together to make up but one body. And as this union is their sovereign happiness, and the necessary effect of charity, without which they cannot be Christians; so the breach of it, and division is the greatest of their infelicities, and the most grievous of their crimes. And they who either procure it or foment it, shall never be able to avoid that curse, which our Saviour doth often denounce, of not inheriting the kingdom of heaven; into which place none is received without this charity, which such men want.

For as the being and perfection of a natural body consists in the union of its parts; which dissolving and falling asunder, the whole doth presently lose not its form and beauty only, but likewise its force and life: so is it in all human Societies, which are called Bodies only by similitude. Their being and their excellence depends upon the union of the members whereof they are composed.

We see Kingdoms and States flourish while the Subjects are united and knit together with the lovely bond of concord, but straight crumble to nothing when dissension separates them each from other. And among all the evils that afflict them there is none so pernicious as division, which strikes at the very foundation of their being, and poisons the original of their life and strength. So that to kindle sedition and sow faction by breaking the peace of Subjects, is questionless the highest crime that any man can commit against a State.

So then, the Church being the heavenly Kingdome and everlasting State of Christ Jesus, the most admirable of all the Societies that ever have been either seen or sanctioned in the Universe; We must needs conclude, That by proportion their crime who trouble and disturb it (so far especially as to rend away from the Body any of its parts) is the blackest of all crimes whatsoever. Thus far we all agree. Nor are any ready to speak ought further in behalf of union or against division, which we are not ready to sign and consent unto; desiring still, if possible, to outbid any for unity.</p></blockquote>

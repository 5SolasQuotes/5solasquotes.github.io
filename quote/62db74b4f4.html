<blockquote><p>We are created unto good works which God hath ordained, that we should walk in them as the elect vessels of God, not thereby to merit salvation, but to signify unto the world that we be the elect of God, who being possessed with faith, show forth the fruits of faith, which are our good works, to the example of others, that they may follow in well-doing.</p></blockquote>

<blockquote><p>Question: But why is God pleased to promise to give unto his people in Covenant spiritual blessings as well as temporal? … …Spiritual blessings are necessary for them in relation unto that eternal life… Heb. 12:13… Lo, here is a necessity of holiness and regenertion for salvation, and they are congruous, and fitting us for salvation, or eternal life… It is meet to enjoy grace before we come to enjoy glory; it is meet to have a conformity to Christ on his cross before we come to have a conformity to Christ in his crown, etc.</p></blockquote>

<blockquote><p>These good works, done in obedience to God’s commandments, are the fruits and evidences of a true and lively faith; and by them believers manifest their thankfulness, strengthen their assurance, edify their brethren, adorn the profession of the gospel, stop the mouths of the adversaries, and glorify God, whose workmanship they are, created in Christ Jesus thereunto, that having their fruit unto holiness they may have the end eternal life.</p></blockquote>

</figure><figure class="quote" id="q-d93e854d06" data-kw="">
<blockquote><p>First therefore take notice what we mean by good works. We take not good works strictly, for the works of charity or liberality; nor for any external actions of religion, which may be done where the heart is not cleansed; much less for the Popish good works of supererogation: but for the graces of God’s Spirit in us, and the actions flowing from them: For, usually, with the Papists and Popish persons, good works are commonly called those superstitious and supererogant works, which God never commanded: or, if God has commanded them, they mean them as external and sensible; such as coming to church and receiving of sacraments; not internal and spiritual faith, and a contrite spirit, which are the soul of all duties: and if these be not there, the outward duties are like clothes upon a dead man, that cannot warm him, because there is no life within. Therefore much is required even to the essence of a godly work, though it be not perfect in degrees: As:

1. It must be commanded by God.

2. It must be wrought in us by the Spirit of God. All the unregenerate man’s actions, his prayers, and services are sins.

3. It must flow from an inward principle of grace, or a supernatural being in the soul, whereby a man is a new creature.

4. The end must be God’s glory. That which the most refined man can do is but a glow-worm, not a star: So that then only is the work good, when, being answerable to the rule, it’s from God, and through God, and to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants</cite>, … (London: Young, 1647), Lecture 4, p. 39</span></figcaption>

<blockquote><p>I. That there is one only God, distinct in three persons.

As we are taught therefore by the holy scriptures, which are his own word, we believe that there is only one God, that is, one simple, indivisible, eternal, living and most perfect essence in three existences, or (as the church useth to speak) persons, namely subsisting of the eternal Father, the eternal Son, and the eternal Holy spirit, truly distinct among themselves, yet without all division; being both beginning and cause of all things.

II. That so every person by it self is true God, that yet there be not three Gods.

For so we do believe and have learned out of the holy scriptures that the Father by himself is true and perfect God, the Son by himself is God and the Holie spirit by himself is God. And yet that they are not many, but one only God almighty, of whom all things, by whom all things, and for whom all things are.

III. One person to be distinct from another in personal proprieties, but in essential they differ from every creature.

And because the holy scriptures do so speak of God, that they attribute unto him many proprieties, both essential and personal, and they teach that in the essential he differeth from all things created, but in the personal one person to be distinguished from another, we therefore doe so believe, that as to beget the Son is such a propriety of the Father as can agree neither with the Son nor the Holy spirit, and again to be begotten can agree to none but the Son, and so of the rest; so likewise to be most pure, eternal, immeasurable, present every where, simply knowing all things, simply almighty, simply good and such like are in such sort the very proprieties of God, that they can by no means be communicated to any creature, so as it should be good (for example sake) in that immeasurable goodness or omnipotent in the same omnipotency, that God is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), II.I-III, 1: 129, 131.</span></figcaption>

<blockquote><p>The Scriptures recognize a single omnipotent, infinite, eternal, and supremely perfect God, and this is supported by reason. Since the creation, maintenance, and governance of the world require infinite power, if there were two or more gods, none of them would be infinite. One would limit the other and set boundaries to its power. Hence, it is necessary for the supreme and greatest being to be singular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Trinity, Thesis I</span></figcaption>

</figure><figure class="quote" id="q-8a2877e5ef" data-kw="">
<blockquote><p>It is a pious saying that the Father is not limited by times: for the true meaning of the name of Father which He bore before time began surpasses comprehension. Although religion teaches us to ascribe to Him this name of Father through which comes the impassible origin of the Son, yet He is not bound in time, for the eternal and infinite God cannot be understood as having become a Father in time, and according to the teaching of the Gospel the Only-begotten God the Word is recognized even in the beginning rather to be with God than to be born. …

The essential likeness conformed to the Father’s essence in kind is also taught to be identical in time: lest He who is the image of God, who is the Word, who is God with God in the beginning, who is like the Father, by the insertion of times between Himself and the Father should not have in Himself in perfection that which is both image, and Word, and God. For if He be proclaimed to be younger in time, He has lost the truth of the image and likeness: for that is no longer likeness which is found to be dissimilar in time. For that very fact that God is Father prevents there being any time in which He was not Father: consequently there can be no time in the Son’s existence in which He was not Son. Wherefore we must neither call the Father older than the Son nor the Son younger than the Father: for the true meaning of neither name can exist without the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hilary-of-poitiers.html">Hilary of Poitiers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Councils, or, The Faith of the Easterns</cite>, (c. 359), 24-25 in Nicene and Post-Nicene Fathers 2, 9: 10-11.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity.html">The Trinity</a></span></div>

<blockquote><p>Glorify thy Son. Glorify him in his death, by accepting it as the death of thy Son for the sins of the world; glorify him in his death, by manifesting at that time that I am thy Son. God did so by miraculous testimonies of his innocency in the time of his passion, by rending of the temple’s veil, obscurity of the sun, quaking of the earth, and the cleaving of the rocks, which made the centurion that guarded him pronounce him to be ‘truly the Son of God,’ Mat. xxvii. 54.

Glorify him in a resurrection; glorify thy Son in his deity, by a manifestation of it; glorify thy Son in his humanity, by conferring new endowments of honour and immortality upon it. He prays here for a manifestation of the glory of his deity, which had been obscured, for an addition of glory to his humanity, which had not been yet enjoyed, by a resurrection and exaltation of it to the right hand of the Father. He prays for a manifestation of his deity: ‘Glorify thy Son.’

He was the Son of God by eternal generation; it is the glory of his deity therefore which is here desired by him. Not the essential glory of the Deity, for that could not be interrupted; not any addition to it, for, being infinite, he was not capable of it, but a manifestation of it; not simply in itself, but in his humanity, which had been veiled by the flesh ever since he emptied himself into it. He prays to be glorified in that state wherein he prays, which was a state of union with the human nature. His essential glory could suffer no detriment, his manifestative did.

As the sins of men are said to dishonour God, not that they detract from the glory of his essence, which cannot suffer any diminution by the sins of men, but as they deny and obscure the manifestation of his glory; the sun suffers no loss of light in its body by the veil of a thick cloud, but the brightness of his beams is masked. As the Father was to be glorified by Christ, so was Christ to be glorified by the Father. Now, the Father could not be glorified by the Son in a way of addition, but manifestation, causing the glory of God to break out upon the world, which had so long been obscured by an universal idolatry. He glorified the Father by a manifestation of his name, ver. 4; and in like manner is glorified by the Father in the manifestation of his deity.

That Christ prays here for the glory of his deity as well as of his humanity is evident, because he prays as mediator and priest, desiring a mediatory glory; but he was mediator and priest according to his divine as well as human nature, and therefore desires that he might be known to the world, not only to be a just and innocent man, but the eternal Son of God, the Redeemer of the world, the expiator of sins, and in that work infinitely delightful to the Father.

Glorify thy Son. Glorify him as thy Son, that as thy Son he may glorify thee. The Son of God was in the world as a great light in a dark lantern, clouded and covered with clay, that though the candle burned, it did not appear, but through some crannies. He desires that this thick mist might be dispersed, that the glory of his divinity might shine forth in his humanity, as a candle through polished glass.

The glory of Christ was to be manifested to be the Son of God: John i. 14, ‘We beheld his glory, the glory as of the only begotten of the Father;’ a glory in his resurrection, his ascension, in the” mission of the Spirit, which declared him to be no other than the only Son of God; and so verse 22 of this chapter is to be understood, ‘The glory which thou gavest me I have given them.’ As it is my glory to be the Son of God, so I have given them this glory, to be the sons of God by adoption, ‘that they may be one, as we are one;’ in the same relation of sonship, though in a different manner.

His petition for this glory he urgeth by two arguments :

(1.) One in ver. 1, ‘That thy Son also may glorify thee.’ The glory of the Father was concerned in it, whose justice, wisdom, love (and all the attributes so signally manifested in redemption), had lain under as great a disguise without the glory of Christ, as the deity of the Son did under the veil of his flesh.

(2.) Another, taken from the happiness and salvation of the elect, ver. 2, ‘As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him.’ Unless the humanity had been glorified by a resurrection, there would have been no assurance that the debt had been satisfied, and no sure ground of faith; unless he had been exalted to the right hand of God as an advocate, there had been no security for our debts.

His resurrection was necessary to make men believers for what was passed, his exaltation was necessary to make them comfortable believers for the time to come; and unless his divine nature had been manifested in the mission of the Spirit, and the collation of miraculous gifts, there had been no foundation for the propagation of the doctrine of redemption, and so that glorious work had lain wrapped up from human view.

The other was necessary as a ground of faith, and this was necessary to the declaration of the doctrine of faith, and an incentive to the embracing of it. Since he was shortly to die, and be executed under the notion of a criminal, a blasphemer, and a wicked man, if he were not raised again, not one would believe in him as mediator, and so the glory of the Father, and the salvation of the elect, had sunk with the glory of the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>, A Discourse on the Knowledge of God</cite>, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 4-6.</span></figcaption>

(2.) Another, taken from the happiness and salvation of the elect, ver. 2, ‘As thou hast given him power over all flesh, that he should give eternal life to as many as thou hast given him.’ Unless the humanity had been glorified by a resurrection, there would have been no assurance that the debt had been satisfied, and no sure ground of faith; unless he had been exalted to the right hand of God as an advocate, there had been no security for our debts.

His resurrection was necessary to make men believers for what was passed, his exaltation was necessary to make them comfortable believers for the time to come; and unless his divine nature had been manifested in the mission of the Spirit, and the collation of miraculous gifts, there had been no foundation for the propagation of the doctrine of redemption, and so that glorious work had lain wrapped up from human view.

The other was necessary as a ground of faith, and this was necessary to the declaration of the doctrine of faith, and an incentive to the embracing of it. Since he was shortly to die, and be executed under the notion of a criminal, a blasphemer, and a wicked man, if he were not raised again, not one would believe in him as mediator, and so the glory of the Father, and the salvation of the elect, had sunk with the glory of the Son.”

— Stephen Charnock, , A Discourse on the Knowledge of God, in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 4-6.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGlorify+thy+Son.+Glorify+him+in+his+death%2C+by+accepting+it+as+the+death+of+thy+Son+for+the+sins+of+the+world%3B+glorify+him+in+his+death%2C+by+manifesting+at+that+time+that+I+am+thy+Son.+God+did+so+by+miraculous+testimonies+of+his+innocency+in+the+time+of+his+passion%2C+by+rending+of+the+temple%E2%80%99s+veil%2C+obscurity+of+the+sun%2C+quaking+of+the+earth%2C+and+the+cleaving+of+the+rocks%2C+which+made+the+centurion+that+guarded+him+pronounce+him+to+be+%E2%80%98truly+the+Son+of+God%2C%E2%80%99+Mat.+xxvii.+54.%0A%0AGlorify+him+in+a+resurrection%3B+glorify+thy+Son+in+his+deity%2C+by+a+manifestation+of+it%3B+glorify+thy+Son+in+his+humanity%2C+by+conferring+new+endowments+of+honour+and+immortality+upon+it.+He+prays+here+for+a+manifestation+of+the+glory+of+his+deity%2C+which+had+been+obscured%2C+for+an+addition+of+glory+to+his+humanity%2C+which+had+not+been+yet+enjoyed%2C+by+a+resurrection+and+exaltation+of+it+to+the+right+hand+of+the+Father.+He+prays+for+a+manifestation+of+his+deity%3A+%E2%80%98Glorify+thy+Son.%E2%80%99%0A%0AHe+was+the+Son+of+God+by+eternal+generation%3B+it+is+the+glory+of+his+deity+therefore+which+is+here+desired+by+him.+Not+the+essential+glory+of+the+Deity%2C+for+that+could+not+be+interrupted%3B+not+any+addition+to+it%2C+for%2C+being+infinite%2C+he+was+not+capable+of+it%2C+but+a+manifestation+of+it%3B+not+simply+in+itself%2C+but+in+his+humanity%2C+which+had+been+veiled+by+the+flesh+ever+since+he+emptied+himself+into+it.+He+prays+to+be+glorified+in+that+state+wherein+he+prays%2C+which+was+a+state+of+union+with+the+human+nature.+His+essential+glory+could+suffer+no+detriment%2C+his+manifestative+did.%0A%0AAs+the+sins+of+men+are+said+to+dishonour+God%2C+not+that+they+detract+from+the+glory+of+his+essence%2C+which+cannot+suffer+any+diminution+by+the+sins+of+men%2C+but+as+they+deny+and+obscure+the+manifestation+of+his+glory%3B+the+sun+suffers+no+loss+of+light+in+its+body+by+the+veil+of+a+thick+cloud%2C+but+the+brightness+of+his+beams+is+masked.+As+the+Father+was+to+be+glorified+by+Christ%2C+so+was+Christ+to+be+glorified+by+the+Father.+Now%2C+the+Father+could+not+be+glorified+by+the+Son+in+a+way+of+addition%2C+but+manifestation%2C+causing+the+glory+of+God+to+break+out+upon+the+world%2C+which+had+so+long+been+obscured+by+an+universal+idolatry.+He+glorified+the+Father+by+a+manifestation+of+his+name%2C+ver.+4%3B+and+in+like+manner+is+glorified+by+the+Father+in+the+manifestation+of+his+deity.%0A%0AThat+Christ+prays+here+for+the+glory+of+his+deity+as+well+as+of+his+humanity+is+evident%2C+because+he+prays+as+mediator+and+priest%2C+desiring+a+mediatory+glory%3B+but+he+was+mediator+and+priest+according+to+his+divine+as+well+as+human+nature%2C+and+therefore+desires+that+he+might+be+known+to+the+world%2C+not+only+to+be+a+just+and+innocent+man%2C+but+the+eternal+Son+of+God%2C+the+Redeemer+of+the+world%2C+the+expiator+of+sins%2C+and+in+that+work+infinitely+delightful+to+the+Father.%0A%0AGlorify+thy+Son.+Glorify+him+as+thy+Son%2C+that+as+thy+Son+he+may+glorify+thee.+The+Son+of+God+was+in+the+world+as+a+great+light+in+a+dark+lantern%2C+clouded+and+covered+with+clay%2C+that+though+the+candle+burned%2C+it+did+not+appear%2C+but+through+some+crannies.+He+desires+that+this+thick+mist+might+be+dispersed%2C+that+the+glory+of+his+divinity+might+shine+forth+in+his+humanity%2C+as+a+candle+through+polished+glass.%0A%0AThe+glory+of+Christ+was+to+be+manifested+to+be+the+Son+of+God%3A+John+i.+14%2C+%E2%80%98We+beheld+his+glory%2C+the+glory+as+of+the+only+begotten+of+the+Father%3B%E2%80%99+a+glory+in+his+resurrection%2C+his+ascension%2C+in+the%E2%80%9D+mission+of+the+Spirit%2C+which+declared+him+to+be+no+other+than+the+only+Son+of+God%3B+and+so+verse+22+of+this+chapter+is+to+be+understood%2C+%E2%80%98The+glory+which+thou+gavest+me+I+have+given+them.%E2%80%99+As+it+is+my+glory+to+be+the+Son+of+God%2C+so+I+have+given+them+this+glory%2C+to+be+the+sons+of+God+by+adoption%2C+%E2%80%98that+they+may+be+one%2C+as+we+are+one%3B%E2%80%99+in+the+same+relation+of+sonship%2C+though+in+a+different+manner.%0A%0AHis+petition+for+this+glory+he+urgeth+by+two+arguments+%3A%0A%0A%281.%29+One+in+ver.+1%2C+%E2%80%98That+thy+Son+also+may+glorify+thee.%E2%80%99+The+glory+of+the+Father+was+concerned+in+it%2C+whose+justice%2C+wisdom%2C+love+%28and+all+the+attributes+so+signally+manifested+in+redemption%29%2C+had+lain+under+as+great+a+disguise+without+the+glory+of+Christ%2C+as+the+deity+of+the+Son+did+under+the+veil+of+his+flesh.%0A%0A%282.%29+Another%2C+taken+from+the+happiness+and+salvation+of+the+elect%2C+ver.+2%2C+%E2%80%98As+thou+hast+given+him+power+over+all+flesh%2C+that+he+should+give+eternal+life+to+as+many+as+thou+hast+given+him.%E2%80%99+Unless+the+humanity+had+been+glorified+by+a+resurrection%2C+there+would+have+been+no+assurance+that+the+debt+had+been+satisfied%2C+and+no+sure+ground+of+faith%3B+unless+he+had+been+exalted+to+the+right+hand+of+God+as+an+advocate%2C+there+had+been+no+security+for+our+debts.%0A%0AHis+resurrection+was+necessary+to+make+men+believers+for+what+was+passed%2C+his+exaltation+was+necessary+to+make+them+comfortable+believers+for+the+time+to+come%3B+and+unless+his+divine+nature+had+been+manifested+in+the+mission+of+the+Spirit%2C+and+the+collation+of+miraculous+gifts%2C+there+had+been+no+foundation+for+the+propagation+of+the+doctrine+of+redemption%2C+and+so+that+glorious+work+had+lain+wrapped+up+from+human+view.%0A%0AThe+other+was+necessary+as+a+ground+of+faith%2C+and+this+was+necessary+to+the+declaration+of+the+doctrine+of+faith%2C+and+an+incentive+to+the+embracing+of+it.+Since+he+was+shortly+to+die%2C+and+be+executed+under+the+notion+of+a+criminal%2C+a+blasphemer%2C+and+a+wicked+man%2C+if+he+were+not+raised+again%2C+not+one+would+believe+in+him+as+mediator%2C+and+so+the+glory+of+the+Father%2C+and+the+salvation+of+the+elect%2C+had+sunk+with+the+glory+of+the+Son.%E2%80%9D%0A%0A%E2%80%94+Stephen+Charnock%2C+%2C+A+Discourse+on+the+Knowledge+of+God%2C+in+The+Complete+Works+of+Stephen+Charnock%2C+B.D.+%285+vols%2C+Edinburgh%3A+James+Nichol%2C+1865%29%2C+4%3A+4-6.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fddf8585ebc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ddf8585ebc.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/06/15/stephen-charnock-glorify-thy-son/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Hearken and consider. Jehovah our God is one Lord. Besides him there is not any other God. He is one. But in this one Jehovah, you are to reckon One, Two, Three, and no more. There are three, each of whom is Jehovah, yet Jehovah is one. These three are quite equal to each other, because every one of them is the one Jehovah.

Their names are, the Father, the Son, the Holy Spirit. The Father is the first who is Jehovah, the Son is the second who is also the same Jehovah, the Holy Spirit is the third who is likewise the same Jehovah. This is our God, The one Jehovah, the Father, the Son, and the Holy Spirit, whom the angels of heaven worship for ever and ever.</p></blockquote>

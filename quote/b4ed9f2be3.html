<blockquote><p>Frans Pieter van Stam, whose comprehensive historical study of the Amyraut controversy leans heavily in favour of the Amyraldians…” – Martyn J. McGeown, ‘A Critical Examination…’ . French Articles Saigey, Charles Edmond – ‘Moise Amyraut, Life &amp; Writings’ (Strasbourg, 1849) 50 pp. Sabatier, Andrew – ‘A Historical Study on the Hypothetical Universalism of Moise Amyraut’ (Toulouse, 1867) 45 pp. . . Medieval Hypothetical Universalist Writings Thomas Aquinas Commentary on 1 Tim. 2:4-6 62… And he proves that it is acceptable, when he says, who wills that all men be saved: not willing that anyone should perish (2 Pet 3:9). But something contrary to this is found in the Psalms: he has done all things whatsoever he would (Ps 113:11). Therefore, he saves everyone. But if you say that he does not, because man does not will it, then it seems that the omnipotent is frustrated by a will that is not omnipotent. The answer is that willing refers sometimes to the will of his good pleasure and sometimes to the signified will. By his signified will he wills to save all, because he offers to all the precepts, counsels and remedies required for salvation. As to the will of his good pleasure, this is explained in four ways: First, in the mode of a causal utterance, as when God is said to make something because he makes others do it: the Spirit asks for the saints (Rom 8:26), i.e., he causes them to ask. In this way God wills this, because he makes his saints will that all men be saved. This type of willing should be found in the saints, because they do not know who are predestined and who are not. Second, when it is applied to a limited number, i.e., to all who are saved, because no one is saved except through his will; just as in one school the teacher teaches all the boys of this city, because no one is taught by anyone but he. In a third way, when it is applied to the species of each individual but not to the individual of each species, i.e., no species of men are excepted from salvation; because formerly it was offered to the Jews only, but now to all men. Fourth, according to [John] Damascene, so that it is understood to be about his antecedent will, and not the consequent. For in God’s will, although there are no prior things and subsequent things, his will is nevertheless described as antecedent and consequent. Likewise, according to the order of things willed, according to which the will can be considered in two ways: namely, in general or absolutely, and according to certain circumstances, and in particular. Here the absolute and general consideration is considered prior to the particular and relative consideration. Then the absolute will is, as it were, antecedent, and the will of anything in particular is, as it were, consequent. For example, a merchant who absolutely wills to save all his goods, and this by his antecedent will; but if he considers the safety factor, he does not will all his goods to be saved, through comparison to others, namely, when the sinking of his ship follows the saving of all his goods. And this will is consequent. Similarly, in God’s case, the salvation of all men considered in itself has a reckoning so that is might be desirable; which is what the apostle means here: therefore, he is speaking of his antecedent will. But if the good of justice is considered, and that sins be punished, thus he does not want; And this is his consequent will. And he adds, ‘and come to the knowledge of the truth,’ because salvation depends on knowing the truth: ‘you shall know the truth, and the truth shall make you free’ (Jn. 8:32). 63… He says, therefore: it is obvious that God wills all men to be saved, because for all men there is one God who saves: is he the God of the Jews only? Is he not also of the gentiles? Yes, of the gentiles also: for there is one God who justifies circumcision by faith and uncircumcision through faith (Rom 3:29). 64. Then he gives the reason taken from the side of Christ as man, at and one mediator of God and men, the man Christ Jesus. First, he proves his intent; second, he proposes a sign, at who gave himself. He says, therefore: one mediator of God and men, the man Christ Jesus, and not of some men only, but of all; and this would not be true, unless he willed all men to be saved. And it can be said that Christ is a mediator who is like each of the extremes, namely, God and man, inasmuch as he is God and inasmuch as he is man; because a mediator should have something common to both extremes: and these are man and God. …but Christ is a medium which joins, because he is just and mortal, and by his death joins us to the God of justice: he is the propitiation for our sins (1 Jn. 2:2); for some in an efficacious way, but for all in a sufficient way: because the price of his blood is sufficient for the salvation of all, but because of obstacles it does not take effect in any but the elect.</p></blockquote>

en from the side of Christ as man, at and one mediator of God and men, the man Christ Jesus. First, he proves his intent; second, he proposes a sign, at who gave himself. He says, therefore: one mediator of God and men, the man Christ Jesus, and not of some men only, but of all; and this would not be true, unless he willed all men to be saved. And it can be said that Christ is a mediator who is like each of the extremes, namely, God and man, inasmuch as he is God and inasmuch as he is man; because a mediator should have something common to both extremes: and these are man and God. …but Christ is a medium which joins, because he is just and mortal, and by his death joins us to the God of justice: he is the propitiation for our sins (1 Jn. 2:2); for some in an efficacious way, but for all in a sufficient way: because the price of his blood is sufficient for the salvation of all, but because of obstacles it does not take effect in any but the elect.”

o+not+know+who+are+predestined+and+who+are+not.+Second%2C+when+it+is+applied+to+a+limited+number%2C+i.e.%2C+to+all+who+are+saved%2C+because+no+one+is+saved+except+through+his+will%3B+just+as+in+one+school+the+teacher+teaches+all+the+boys+of+this+city%2C+because+no+one+is+taught+by+anyone+but+he.+In+a+third+way%2C+when+it+is+applied+to+the+species+of+each+individual+but+not+to+the+individual+of+each+species%2C+i.e.%2C+no+species+of+men+are+excepted+from+salvation%3B+because+formerly+it+was+offered+to+the+Jews+only%2C+but+now+to+all+men.+Fourth%2C+according+to+%5BJohn%5D+Damascene%2C+so+that+it+is+understood+to+be+about+his+antecedent+will%2C+and+not+the+consequent.+For+in+God%E2%80%99s+will%2C+although+there+are+no+prior+things+and+subsequent+things%2C+his+will+is+nevertheless+described+as+antecedent+and+consequent.+Likewise%2C+according+to+the+order+of+things+willed%2C+according+to+which+the+will+can+be+considered+in+two+ways%3A+namely%2C+in+general+or+absolutely%2C+and+according+to+certain+circumstances%2C+and+in+particular.+Here+the+absolute+and+general+consideration+is+considered+prior+to+the+particular+and+relative+consideration.+Then+the+absolute+will+is%2C+as+it+were%2C+antecedent%2C+and+the+will+of+anything+in+particular+is%2C+as+it+were%2C+consequent.+For+example%2C+a+merchant+who+absolutely+wills+to+save+all+his+goods%2C+and+this+by+his+antecedent+will%3B+but+if+he+considers+the+safety+factor%2C+he+does+not+will+all+his+goods+to+be+saved%2C+through+comparison+to+others%2C+namely%2C+when+the+sinking+of+his+ship+follows+the+saving+of+all+his+goods.+And+this+will+is+consequent.+Similarly%2C+in+God%E2%80%99s+case%2C+the+salvation+of+all+men+considered+in+itself+has+a+reckoning+so+that+is+might+be+desirable%3B+which+is+what+the+apostle+means+here%3A+therefore%2C+he+is+speaking+of+his+antecedent+will.+But+if+the+good+of+justice+is+considered%2C+and+that+sins+be+punished%2C+thus+he+does+not+want%3B+And+this+is+his+consequent+will.+And+he+adds%2C+%E2%80%98and+come+ <blockquote><p>we affirm, that, according to the same Scripture, these precious fruits do belong to all the elect, and to them alone: but, as for the incredulous and impious, so long as they remain such, we exclude them from these benefits… As for the wicked, and such as want [lack] justifying faith, why should they partake so much happiness, who please not God?… Who belong not to Christ, who are not heirs, neither have right to, or in that life, how can Christ or his benefits belong to them?… For, if infidels belong not to Christ, they are none of Christ’s: We conclude strongly from the correlative, that Christ and his benefits belong not to the wicked: and as they are not Christs, so neither is Christ theirs. And how, I pray, should Christ belong to them whom He will, in the Last Judgment, pronounce before all the world, to be strangers from Himself, from his benefits, from his Kingdom?… But, you will say, ‘Christ died for all, therefore rose again for all.’ The answer is double: One is, as often as the Gospel extends the fruits of the works and benefits of Christ to all, this is to be understood of all those that believe in Christ: for, this is the perpetual and constant voice of the Gospel… Therefore, the Gospel debars from the benefits of Christ, all infidels; not only by a plain exclusion, but also by that condition of faith and repentance… So then, Christ is said to die for all, to wit, all that do or shall believe in Him; for whom alone He prayed, and in whom alone He finds the faith of his death: but as for infidels and reprobates, for whom Christ prayed not, whom He never acknowledged for his own, upon whom the wrath of God abides forever, to extend, I say on these the benefits of Christ, what is it else but against his own command to give that which is holy unto dogs, and to cast pearls before swine? These [things] we could solidly defend by authority of Scripture and orthodox Fathers… There is another answer usual in the schools, by which we may gratify the contentious, that Christ absolutely died for all, if you consider the amplitude and sufficiency of his price and merit: for, it is out of controversy, that the death of the Son of God is of that value, that it suffices to expiate the sins, not only of one, but of millions of worlds, if so be they had faith to apply this physic to their sins. But the question is properly of the efficacy and participation itself of these fruits, when we demand if Christ died for all: because, to die for another, is properly to die in the stead and place of another, so that he is freed from death, and saved alive; as when David, weeping, cried out, ‘I wish I had died for thee, O Absalom’; that is, I wish I had died in thy stead, that thou mightest have lived. But we utterly deny that this participation of Christ’s merits is common to all unbelievers, as well as to those that believe; or that this is promised or exhibited in the Gospel: for, in this regard, we conclude that Christ did not die properly for all, even for unbelievers and reprobates. But here some unlucky patrons of infidels, taking it ill that we do not divide the pearls equally amongst sheep and swine, cry out, that we deny the blood of Christ… But first, we protest against such bitter calumnies, making our appeal to the unanimous consent of the orthodoxal Church, and the perpetual voice of the Gospel, that we deny not, but honor the blood of Christ, when we say, it is poured out, not for those that slight it, and tread Christ under their feet; but for those who by faith are justified through it… They contend that Christ died for all. Who denies this? for this is the Scripture phrase. They add that He died for all and singular. Neither do we simply deny this; to wit, in that sense which we showed a little before: although we do not find the Scripture speak so. They go on: that He died for all and singular alike; for the elect and reprobate, for Cain and David, for Judas and Peter, for the damned, as well as for those that are saved, without any respect of faith or infidelity. This is hard. They proceed, finally, that He died for all and singular, not only in respect of sufficiency, but also in regard of the efficacy of the price. But what is this? to wit, that Christ by his death has truly delivered from death, purged from sin, sanctified, and reconciled to God all absolutely, even those who are not saved, but have been damned ever since Cain, and are damned, and furthermore are to be damned; all those, they say, He has received into his favor. This is that impious monster, by which they conclude another, no less impious and false: to wit, that wicked men, whosoever have perished, do, or shall perish, that they have perished, do, and shall perish not for their sins (for they were expiated by the blood of Christ), but only for their incredulity [unbelief]…. but how monstrous are these to Christian ears?</p></blockquote>

n the schools, by which we may gratify the contentious, that Christ absolutely died for all, if you consider the amplitude and sufficiency of his price and merit: for, it is out of controversy, that the death of the Son of God is of that value, that it suffices to expiate the sins, not only of one, but of millions of worlds, if so be they had faith to apply this physic to their sins. But the question is properly of the efficacy and participation itself of these fruits, when we demand if Christ died for all: because, to die for another, is properly to die in the stead and place of another, so that he is freed from death, and saved alive; as when David, weeping, cried out, ‘I wish I had died for thee, O Absalom’; that is, I wish I had died in thy stead, that thou mightest have lived. But we utterly deny that this participation of Christ’s merits is common to all unbelievers, as well as to those that believe; or that this is promised or exhibited in the Gospel: for, in this regard, we conclude that Christ did not die properly for all, even for unbelievers and reprobates. But here some unlucky patrons of infidels, taking it ill that we do not divide the pearls equally amongst sheep and swine, cry out, that we deny the blood of Christ… But first, we protest against such bitter calumnies, making our appeal to the unanimous consent of the orthodoxal Church, and the perpetual voice of the Gospel, that we deny not, but honor the blood of Christ, when we say, it is poured out, not for those that slight it, and tread Christ under their feet; but for those who by faith are justified through it… They contend that Christ died for all. Who denies this? for this is the Scripture phrase. They add that He died for all and singular. Neither do we simply deny this; to wit, in that sense which we showed a little before: although we do not find the Scripture speak so. They go on: that He died for all and singular alike; for the elect and reprobate, for Cain and David, for Judas and Peter, for the damned, as well as for those that are saved, without any respect of faith or infidelity. This is hard. They proceed, finally, that He died for all and singular, not only in respect of sufficiency, but also in regard of the efficacy of the price. But what is this? to wit, that Christ by his death has truly delivered from death, purged from sin, sanctified, and reconciled to God all absolutely, even those who are not saved, but have been damned ever since Cain, and are damned, and furthermore are to be damned; all those, they say, He has received into his favor. This is that impious monster, by which they conclude another, no less impious and false: to wit, that wicked men, whosoever have perished, do, or shall perish, that they have perished, do, and shall perish not for their sins (for they were expiated by the blood of Christ), but only for their incredulity [unbelief]…. but how monstrous are these to Christian ears?”

— David Pareus, ‘A Piece of a Speech concerning that Question, To whom properly do the benefits of Christ’s sufferings and death belong? And how Christ is said to die for all…’ in Zachary Ursinus, Sum of Christian Religion… (London: Young, 1645) Pareus (d. 1622), pp. 807-9">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cwe+affirm%2C+that%2C+according+to+the+same+Scripture%2C+these+precious+fruits+do+belong+to+all+the+elect%2C+and+to+them+alone%3A+but%2C+as+for+the+incredulous+and+impious%2C+so+long+as+they+remain+such%2C+we+exclude+them+from+these+benefits%E2%80%A6+As+for+the+wicked%2C+and+such+as+want+%5Black%5D+justifying+faith%2C+why+should+they+partake+so+much+happiness%2C+who+please+not+God%3F%E2%80%A6+Who+belong+not+to+Christ%2C+who+are+not+heirs%2C+neither+have+right+to%2C+or+in+that+life%2C+how+can+Christ+or+his+benefits+belong+to+them%3F%E2%80%A6+For%2C+if+infidels+belong+not+to+Christ%2C+they+are+none+of+Christ%E2%80%99s%3A+We+conclude+strongly+from+the+correlative%2C+that+Christ+and+his+benefits+belong+not+to+the+wicked%3A+and+as+they+are+not+Christs%2C+so+neither+is+Christ+theirs.+And+how%2C+I+pray%2C+should+Christ+belong+to+them+whom+He+will%2C+in+the+Last+Judgment%2C+pronounce+before+all+the+world%2C+to+be+strangers+from+Himself%2C+from+his+benefits%2C+from+his+Kingdom%3F%E2%80%A6+But%2C+you+will+say%2C+%E2%80%98Christ+died+for+all%2C+therefore+rose+again+for+all.%E2%80%99+The+answer+is+double%3A+One+is%2C+as+often+as+the+Gospel+extends+the+fruits+of+the+works+and+benefits+of+Christ+to+all%2C+this+is+to+be+understood+of+all+those+that+believe+in+Christ%3A+for%2C+this+is+the+perpetual+and+constant+voice+of+the+Gospel%E2%80%A6+Therefore%2C+the+Gospel+debars+from+the+benefits+of+Christ%2C+all+infidels%3B+not+only+by+a+plain+exclusion%2C+but+also+by+that+condition+of+faith+and+repentance%E2%80%A6+So+then%2C+Christ+is+said+to+die+for+all%2C+to+wit%2C+all+that+do+or+shall+believe+in+Him%3B+for+whom+alone+He+prayed%2C+and+in+whom+alone+He+finds+the+faith+of+his+death%3A+but+as+for+infidels+and+reprobates%2C+for+whom+Christ+prayed+not%2C+whom+He+never+acknowledged+for+his+own%2C+upon+whom+the+wrath+of+God+abides+forever%2C+to+extend%2C+I+say+on+these+the+benefits+of+Christ%2C+what+is+it+else+but+against+his+own+command+to+give+that+which+is+holy+unto+dogs%2C+and+to+cast+pearls+before+swine%3F+These+%5Bthings%5D+we+could+solidly+defend+by+authority+of+Scripture+and+orthodox+Fathers%E2%80%A6+There+is+another+answer+usual+in+the+schools%2C+by+which+we+may+gratify+the+contentious%2C+that+Christ+absolutely+died+for+all%2C+if+you+consider+the+amplitude+and+sufficiency+of+his+price+and+merit%3A+for%2C+it+is+out+of+controversy%2C+that+the+death+of+the+Son+of+God+is+of+that+value%2C+that+it+suffices+to+expiate+the+sins%2C+not+only+of+one%2C+but+of+millions+of+worlds%2C+if+so+be+they+had+faith+to+apply+this+physic+to+their+sins.+But+the+question+is+properly+of+the+efficacy+and+participation+itself+of+these+fruits%2C+when+we+demand+if+Christ+died+for+all%3A+because%2C+to+die+for+another%2C+is+properly+to+die+in+the+stead+and+place+of+another%2C+so+that+he+is+freed+from+death%2C+and+saved+alive%3B+as+when+David%2C+weeping%2C+cried+out%2C+%E2%80%98I+wish+I+had+died+for+thee%2C+O+Absalom%E2%80%99%3B+that+is%2C+I+wish+I+had+died+in+thy+stead%2C+that+thou+mightest+have+lived.+But+we+utterly+deny+that+this+participation+of+Christ%E2%80%99s+merits+is+common+to+all+unbelievers%2C+as+well+as+to+those+that+believe%3B+or+that+this+is+promised+or+exhibited+in+the+Gospel%3A+for%2C+in+this+regard%2C+we+conclude+that+Christ+did+not+die+properly+for+all%2C+even+for+unbelievers+and+reprobates.+But+here+some+unlucky+patrons+of+infidels%2C+taking+it+ill+that+we+do+not+divide+the+pearls+equally+amongst+sheep+and+swine%2C+cry+out%2C+that+we+deny+the+blood+of+Christ%E2%80%A6+But+first%2C+we+protest+against+such+bitter+calumnies%2C+making+our+appeal+to+the+unanimous+consent+of+the+orthodoxal+Church%2C+and+the+perpetual+voice+of+the+Gospel%2C+that+we+deny+not%2C+but+honor+the+blood+of+Christ%2C+when+we+say%2C+it+is+poured+out%2C+not+for+those+that+slight+it%2C+and+tread+Christ+under+their+feet%3B+but+for+those+who+by+faith+are+justified+through+it%E2%80%A6+They+contend+that+Christ+died+for+all.+Who+denies+this%3F+for+this+is+the+Scripture+phrase.+They+add+that+He+died+for+all+and+singular.+Neither+do+we+simply+deny+this%3B+to+wit%2C+in+that+sense+which+we+showed+a+little+before%3A+although+we+do+not+find+the+Scripture+speak+so.+They+go+on%3A+that+He+died+for+all+and+singular+alike%3B+for+the+elect+and+reprobate%2C+for+Cain+and+David%2C+for+Judas+and+Peter%2C+for+the+damned%2C+as+well+as+for+those+that+are+saved%2C+without+any+respect+of+faith+or+infidelity.+This+is+hard.+They+proceed%2C+finally%2C+that+He+died+for+all+and+singular%2C+not+only+in+respect+of+sufficiency%2C+but+also+in+regard+of+the+efficacy+of+the+price.+But+what+is+this%3F+to+wit%2C+that+Christ+by+his+death+has+truly+delivered+from+death%2C+purged+from+sin%2C+sanctified%2C+and+reconciled+to+God+all+absolutely%2C+even+those+who+are+not+saved%2C+but+have+been+damned+ever+since+Cain%2C+and+are+damned%2C+and+furthermore+are+to+be+damned%3B+all+those%2C+they+say%2C+He+has+received+into+his+favor.+This+is+that+impious+monster%2C+by+which+they+conclude+another%2C+no+less+impious+and+false%3A+to+wit%2C+that+wicked+men%2C+whosoever+have+perished%2C+do%2C+or+shall+perish%2C+that+they+have+perished%2C+do%2C+and+shall+perish+not+for+their+sins+%28for+they+were+expiated+by+the+blood+of+Christ%29%2C+but+only+for+their+incredulity+%5Bunbelief%5D%E2%80%A6.+but+how+monstrous+are+these+to+Christian+ears%3F%E2%80%9D%0A%0A%E2%80%94+David+Pareus%2C+%E2%80%98A+Piece+of+a+Speech+concerning+that+Question%2C+To+whom+properly+do+the+benefits+of+Christ%E2%80%99s+sufferings+and+death+belong%3F+And+how+Christ+is+said+to+die+for+all%E2%80%A6%E2%80%99+in+Zachary+Ursinus%2C+Sum+of+Christian+Religion%E2%80%A6+%28London%3A+Young%2C+1645%29+Pareus+%28d.+16 <blockquote><p>VIII. We do very much differ from this opinion [of Arminians]: We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted, or that salvation was purchased for him, whom God from eternity has decreed to condem: For this were a vaine purchase. We deny that election is after the death of Christ, as for many other causes, so also because Christ in the very agony of death gave a notable proof of election in the thief, whose heart He affected, and enlightned his mind after an unutterable manner; the other thief being left and neglected. And seeing Christ does everywhere say that He died for his sheep, and for those whom his Father gave Him, He does sufficiently declare that He died for the elect.

IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.</p></blockquote>

IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.”

+that+it+may+be+said%2C+not+only+that+Christ+died+for+all+men%2C+but+also+that+all+men+are+saved+by+Christ%2C+because+among+men%2C+there+is+none+saved+but+by+Christ%3A+After+the+same+manner+that+the+apostle+says%2C+1+Cor.+15%3A20%2C+that+all+men+are+made+alive+by+Christ%2C+because+no+man+is+made+alive+but+by+Him.%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Anatomy+of+Arminianism%2C+%E2%80%A6+%281619%3B+London%2C+1635%29%2C+ch.+27%2C+%E2%80%98How+far%2C+and+in+what+sense+Christ+died+for+all%E2%80%99%2C+pp.+226-28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa1e1024785.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a1e1024785.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/limited-atonement/#:~:text=VIII.%20We%20do%20very%20much%20differ,is%20made%20alive%20but%20by%20Him&amp;text=VIII.%20We%20do%20very%20much%20differ%20from%20this&amp;text=no%20man%20is%20made%20alive%20but%20by%20Him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

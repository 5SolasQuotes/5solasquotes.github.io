<blockquote><p>The expression, “whom the Father hath sanctified,” [John 10:36] must mean, “whom the Father hath set apart, and appointed from all eternity in the covenant of grace, as a priest is sanctified and set apart for the service of the temple.” It cannot mean literally “made holy.” It implies eternal dedication and appointment to a certain office.

This is one of the places which teach the eternal generation of Christ. Long before He came into the world, “the Father” (not God, observe) had sanctified and appointed the Son. He did not become the Son when He entered the world: He was the Son from all eternity.

The expression, “sent into the world,” means that mission of Christ’s to be the Saviour, which took place when he became incarnate, and came among us in the form of a man. He was the Father’s “sent One,” the “Apostle” of our profession. (See Heb. iii. 1; John iii. 17; and 1 John iv. 14.) He that was so “sanctified” and “sent,” might well speak of Himself as the Son of God, and equal with God.</p></blockquote>

<blockquote><p>XXVIII. This, then, is my position with regard to these things, and I hope it may be always my position, and that of whosoever is dear to me; to worship God the Father, God the Son, and God the Holy Ghost, Three Persons, One Godhead, undivided in honour and glory and substance and kingdom, as one of our own inspired philosophers not long departed shewed. Let him not see the rising of the Morning Star, as Scripture saith,2 nor the glory of its brightness, who is otherwise minded, or who follows the temper of the times, at one time being of one mind and of another at another time, and thinking unsoundly in the highest matters. For if He is not to be worshipped, how can He deify me by Baptism? but if He is to be worshipped, surely He is an Object of adoration, and if an Object of adoration He must be God; the one is linked to the other, a truly golden and saving chain. And indeed from the Spirit comes our New Birth, and from the New Birth our new creation, and from the new creation our deeper knowledge of the dignity of Him from Whom it is derived. XXIX. This, then, is what may be said by one who admits the silence of Scripture. But now the swarm of testimonies shall burst upon you from which the Deity of the Holy Ghost shall be shewn to all who are not excessively stupid, or else altogether enemies to the Spirit, to be most clearly recognized in Scripture. Look at these facts:—Christ is born; the Spirit is His Forerunner. He is baptized; the Spirit bears witness. He is tempted; the Spirit leads Him up.4 He works miracles; the Spirit accompanies them. He ascends; the Spirit takes His place. What great things are there in the idea of God which are not in His power? What titles which belong to God are not applied to Him, except only Unbegotten and Begotten? For it was needful that the distinctive properties of the Father and the Son should remain peculiar to Them, lest there should be confusion in the Godhead Which brings all things, even disorder itself, into due arrangement and good order. Indeed I tremble when I think of the abundance of the titles, and how many Names they outrage who fall foul of the Spirit. He is called the Spirit of God, the Spirit of Christ, the Mind of Christ, the Spirit of The Lord, and Himself The Lord, the Spirit of Adoption, of Truth, of Liberty; the Spirit of Wisdom, of Understanding, of Counsel, of Might, of Knowledge, of Godliness, of the Fear of God. For He is the Maker of all these, filling all with His Essence, containing all things, filling the world in His Essence, yet incapable of being comprehended in His power by the world; good, upright, princely, by nature not by adoption; sanctifying, not sanctified; measuring, not measured; shared, not sharing; filling, not filled; containing, not contained; inherited, glorified, reckoned with the Father and the Son; held out as a threat; the Finger of God; fire like God; to manifest, as I take it, His consubstantiality); the Creator-Spirit, Who by Baptism and by Resurrection creates anew; the Spirit That knoweth all things, That teacheth, That bloweth where and to what extent He listeth; That guideth, talketh, sendeth forth, separateth, is angry or tempted; That revealeth, illumineth, quickeneth, or rather is the very Light and Life; That maketh Temples; That deifieth; That perfecteth so as even to anticipate Baptism,8 yet after Baptism to be sought as a separate gift; That doeth all things that God doeth; divided into fiery tongues; dividing gifts; making Apostles, Prophets, Evangelists, Pastors, and Teachers; understanding manifold, clear, piercing, undefiled, unhindered, which is the same thing as Most wise and varied in His actions; and making all things clear and plain; and of independent power, unchangeable, Almighty, all-seeing, penetrating all spirits that are intelligent, pure, most subtle (the Angel Hosts I think); and also all prophetic spirits and apostolic in the same manner and not in the same places; for they lived in different places; thus showing that He is uncircumscript. XXX. They who say and teach these things, and moreover call Him another Paraclete in the sense of another God, who know that blasphemy against Him alone cannot be forgiven, and who branded with such fearful infamy Ananias and Sapphira for having lied to the Holy Ghost, what do you think of these men?11 Do they proclaim the Spirit God, or something else? Now really, you must be extraordinarily dull and far from the Spirit if you have any doubt about this and need some one to teach you. So important then, and so vivid are His Names. Why is it necessary to lay before you the testimony contained in the very words? And whatever in this case also is said in more lowly fashion, as that He is Given, Sent, Divided; that He is the Gift, the Bounty, the Inspiration, the Promise, the Intercession for us, and, not to go into any further detail, any other expressions of the sort, is to be referred to the First Cause, that it may be shewn from Whom He is, and that men may not in heathen fashion admit Three Principles. For it is equally impious to confuse the Persons with the Sabellians, or to divide the Natures with the Arians. XXXI. I have very carefully considered this matter in my own mind, and have looked at it in every point of view, in order to find some illustration of this most important subject, but I have been unable to discover any thing on earth with which to compare the nature of the Godhead. For even if I did happen upon some tiny likeness it escaped me for the most part, and left me down below with my example. I picture to myself an eye, a fountain, a river, as others have done before, to see if the first might be analogous to the Father, the second to the Son, and the third to the Holy Ghost. For in these there is no distinction in time, nor are they torn away from their connexion with each other, though they seem to be parted by three personalities. But I was afraid in the first place that I should present a flow in the Godhead, incapable of standing still; and secondly that by this figure a numerical unity would be introduced. For the eye and the spring and the river are numerically one, though in different forms. XXXII. Again I thought of the sun and a ray and light. But here again there was a fear lest people should get an idea of composition in the Uncompounded Nature, such as there is in the Sun and the things that are in the Sun. And in the second place lest we should give Essence to the Father but deny Personality to the Others, and make Them only Powers of God, existing in Him and not Personal. For neither the ray nor the light is another sun, but they are only effulgences from the Sun, and qualities of His essence. And lest we should thus, as far as the illustration goes, attribute both Being and Not-being to God, which is even more monstrous. I have also heard that some one has suggested an illustration of the following kind. A ray of the Sun flashing upon a wall and trembling with the movement of the moisture which the beam has taken up in mid air, and then, being checked by the hard body, has set up a strange quivering. For it quivers with many rapid movements, and is not one rather than it is many, nor yet many rather than one; because by the swiftness of its union and separating it escapes before the eye can see it. XXXIII. But it is not possible for me to make use of even this; because it is very evident what gives the ray its motion; but there is nothing prior to God which could set Him in motion; for He is Himself the Cause of all things, and He has no prior Cause. And secondly because in this case also there is a suggestion of such things as composition, diffusion, and an unsettled and unstable nature … none of which we can suppose in the Godhead. In a word, there is nothing which presents a standing point to my mind in these illustrations from which to consider the Object which I am trying to represent to myself, unless one may indulgently accept one point of the image while rejecting the rest. Finally, then, it seems best to me to let the images and the shadows go, as being deceitful and very far short of the truth; and clinging myself to the more reverent conception, and resting upon few words, using the guidance of the Holy Ghost, keeping to the end as my genuine comrade and companion the enlightenment which I have received from Him, and passing through this world to persuade all others also to the best of my power to worship Father, Son, and Holy Ghost, the One Godhead and Power. To Him belongs all glory and honour and might for ever and ever. Amen.</p></blockquote>

hem.+He+ascends%3B+the+Spirit+takes+His+place.+What+great+things+are+there+in+the+idea+of+God+which+are+not+in+His+power%3F+What+titles+which+belong+to+God+are+not+applied+to+Him%2C+except+only+Unbegotten+and+Begotten%3F+For+it+was+needful+that+the+distinctive+properties+of+the+Father+and+the+Son+should+remain+peculiar+to+Them%2C+lest+there+should+be+confusion+in+the+Godhead+Which+brings+all+things%2C+even+disorder+itself%2C+into+due+arrangement+and+good+order.+Indeed+I+tremble+when+I+think+of+the+abundance+of+the+titles%2C+and+how+many+Names+they+outrage+who+fall+foul+of+the+Spirit.+He+is+called+the+Spirit+of+God%2C+the+Spirit+of+Christ%2C+the+Mind+of+Christ%2C+the+Spirit+of+The+Lord%2C+and+Himself+The+Lord%2C+the+Spirit+of+Adoption%2C+of+Truth%2C+of+Liberty%3B+the+Spirit+of+Wisdom%2C+of+Understanding%2C+of+Counsel%2C+of+Might%2C+of+Knowledge%2C+of+Godliness%2C+of+the+Fear+of+God.+For+He+is+the+Maker+of+all+these%2C+filling+all+with+His+Essence%2C+containing+all+things%2C+filling+the+world+in+His+Essence%2C+yet+incapable+of+being+comprehended+in+His+power+by+the+world%3B+good%2C+upright%2C+princely%2C+by+nature+not+by+adoption%3B+sanctifying%2C+not+sanctified%3B+measuring%2C+not+measured%3B+shared%2C+not+sharing%3B+filling%2C+not+filled%3B+containing%2C+not+contained%3B+inherited%2C+glorified%2C+reckoned+with+the+Father+and+the+Son%3B+held+out+as+a+threat%3B+the+Finger+of+God%3B+fire+like+God%3B+to+manifest%2C+as+I+take+it%2C+His+consubstantiality%29%3B+the+Creator-Spirit%2C+Who+by+Baptism+and+by+Resurrection+creates+anew%3B+the+Spirit+That+knoweth+all+things%2C+That+teacheth%2C+That+bloweth+where+and+to+what+extent+He+listeth%3B+That+guideth%2C+talketh%2C+sendeth+forth%2C+separateth%2C+is+angry+or+tempted%3B+That+revealeth%2C+illumineth%2C+quickeneth%2C+or+rather+is+the+very+Light+and+Life%3B+That+maketh+Temples%3B+That+deifieth%3B+That+perfecteth+so+as+even+to+anticipate+Baptism%2C8+yet+after+Baptism+to+be+sought+as+a+separate+gift%3B+That+doeth+all+things+that+God+doeth%3B+divided+into+fiery+tongues%3B+dividing+gifts%3B+making+Apostles%2C+Prophets%2C+Evangelists%2C+Pastors%2C+and+Teachers%3B+understanding+manifold%2C+clear%2C+piercing%2C+undefiled%2C+unhindered%2C+which+is+the+same+thing+as+Most+wise+and+varied+in+His+actions%3B+and+making+all+things+clear+and+plain%3B+and+of+independent+power%2C+unchangeable%2C+Almighty%2C+all-seeing%2C+penetrating+all+spirits+that+are+intelligent%2C+pure%2C+most+subtle+%28the+Angel+Hosts+I+think%29%3B+and+also+all+prophetic+spirits+and+apostolic+in+the+same+manner+and+not+in+the+same+places%3B+for+they+lived+in+different+places%3B+thus+showing+that+He+is+uncircumscript.+XXX.+They+who+say+and+teach+these+things%2C+and+moreover+call+Him+another+Paraclete+in+the+sense+of+another+God%2C+who+know+that+blasphemy+against+Him+alone+cannot+be+forgiven%2C+and+who+branded+with+such+fearful+infamy+Ananias+and+Sapphira+for+having+lied+to+the+Holy+Ghost%2C+what+do+you+think+of+these+men%3F11+Do+they+proclaim+the+Spirit+God%2C+or+something+else%3F+Now+really%2C+you+must+be+extraordinarily+dull+and+far+from+the+Spirit+if+you+have+any+doubt+about+this+and+need+some+one+to+teach+you.+So+important+then%2C+and+so+vivid+are+His+Names.+Why+is+it+necessary+to+lay+before+you+the+testimony+contained+in+the+very+words%3F+And+whatever+in+this+case+also+is+said+in+more+lowly+fashion%2C+as+that+He+is+Given%2C+Sent%2C+Divided%3B+that+He+is+the+Gift%2C+the+Bounty%2C+the+Inspiration%2C+the+Promise%2C+the+Intercession+for+us%2C+and%2C+not+to+go+into+any+further+detail%2C+any+other+expressions+of+the+sort%2C+is+to+be+referred+to+the+First+Cause%2C+that+it+may+be+shewn+from+Whom+He+is%2C+and+that+men+may+not+in+heathen+fashion+admit+Three+Principles.+For+it+is+equally+impious+to+confuse+the+Persons+with+the+Sabellians%2C+or+to+divide+the+Natures+with+the+Arians.+XXXI.+I+have+very+carefully+considered+this+matter+in+my+own+mind%2C+and+have+looked+at+it+in+every+point+of+view%2C+in+order+to+find+some+illustration+of+this+most+important+subject%2C+but+I+have+been+unable+to+discover+any+thing+on+earth+with+which+to+compare+the+nature+of+the+Godhead.+For+even+if+I+did+happen+upon+some+tiny+likeness+it+escaped+me+for+the+most+part%2C+and+left+me+down+below+with+my+example.+I+picture+to+myself+an+eye%2C+a+fountain%2C+a+river%2C+as+others+have+done+before%2C+to+see+if+the+first+might+be+analogous+to+the+Father%2C+the+second+to+the+Son%2C+and+the+third+to+the+Holy+Ghost.+For+in+these+there+is+no+distinction+in+time%2C+nor+are+they+torn+away+from+their+connexion+with+each+other%2C+though+they+seem+to+be+parted+by+three+personalities.+But+I+was+afraid+in+the+first+place+that+I+should+present+a+flow+in+the+Godhead%2C+incapable+of+standing+still%3B+and+secondly+that+by+this+figure+a+numerical+unity+would+be+introduced.+For+the+eye+and+the+spring+and+the+river+are+numerically+one%2C+though+in+different+forms.+XXXII.+Again+I+thought+of+the+sun+and+a+ray+and+light.+But+here+again+there+was+a+fear+lest+people+should+get+an+idea+of+composition+in+the+Uncompounded+Nature%2C+such+as+there+is+in+the+Sun+and+the+things+that+are+in+the+Sun.+And+in+the+second+place+lest+we+should+give+Essence+to+the+Father+but+deny+Personality+to+the+Others%2C+and+make+Them+only+Powers+of+God%2C+existing+in+Him+and+not+Personal.+For+neither+the+ray+nor+the+light+is+another+sun%2C+but+they+are+only+effulgences+from+the+Sun%2C+and+qualities+of+His+essence.+And+lest+we+should+thus%2C+as+far+as+the+illustration+goes%2C+attribute+both+Being+and+Not-being+to+God%2C+which+is+even+more+monstrous.+I+have+also+heard+that+some+one+has+suggested+an+illustration+of+the+following+kind.+A+ray+of+the+Sun+flashing+upon+a+wall+and+trembling+with+the+movement+of+the+moisture+which+the+beam+has+taken+up+in+mid+air%2C+and+then%2C+being+checked+by+the+hard+body%2C+has+set+up+a+strange+quivering.+For+it+quivers+with+many+rapid+movements%2C+and+is+not+one+rather+than+it+is+many%2C+nor+yet+many+rather+than+one%3B+because+by+the+swiftness+of+its+union+and+separating+it+escapes+before+the+eye+can+see+it.+XXXIII.+But+it+is+not+possible+for+me+to+make+use+of+even+this%3B+because+it+is+very+evident+what+gives+the+ray+its+motion%3B+but+there+is+nothing+prior+to+God+which+could+set+Him+in+motion%3B+for+He+is+Himself+the+Cause+of+all+things%2C+and+He+has+no+prior+Cause.+And+secondly+because+in+this+case+also+there+is+a+suggestion+of+such+things+as+composition%2C+diffusion%2C+and+an+unsettled+and+unstable+nature+%E2%80%A6+none+of+which+we+can+suppose+in+the+Godhead.+In+a+word%2C+there+is+nothing+which+presents+a+standing+point+to+my+mind+in+these+illustrations+from+which+to+consider+the+Object+which+I+am+trying+to+represent+to+myself%2C+unless+one+may+indulgently+accept+one+point+of+the+image+while+rejecting+the+rest.+Finally%2C+then%2C+it+seems+best+to+me+to+let+the+images+and+the+shadows+go%2C+as+being+deceitful+and+very+far+short+of+the+truth%3B+and+clinging+myself+to+the+more+reverent+conception%2C+and+resting+upon+few+words%2C+using+the+guidance+of+the+Holy+Ghost%2C+keeping+to+the+end+as+my+genuine+comrade+and+companion+the+enlightenment+which+I+have+received+from+Him%2C+and+passing+through+this+world+to+persuade+all+others+also+to+the+best+of+my+power+to+worship+Father%2C+Son%2C+and+Holy+Ghost%2C+the+One+Godhead+and+Power.+To+Him+belongs+all+glory+and+honour+and+might+for+ever+and+ever.+Amen.%E2%80%9D%0A%0A%E2%80%94+Gregory+of+Nazianzus%2C+%E2%80%9COration+31%E2%80%9D+in+Select+Orations+of+Saint+Gregory+Nazianzen%2C+ed.+Philip+Schaff+and+Henry+Wace%2C+trans.+Charles+Gordon+Browne+and+James+Edward+Swallow%2C+vol.+7%2C+A+Select+Library+of+the+Nicene+and+Post-Nicene+Fathers+of+the+Christian+Church%2C+Second+Series+%28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F611adfb2af.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/611adfb2af.html">Permalink</a><a class="src" href="https://heidelblog.net/2021/05/gregory-of-nazianzus-on-the-deity-of-the-holy-spirit-and-against-analogies-for-the-trinity/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-74c3572d0d" data-kw="unity three persons">
<blockquote><p>While he proclaims his unity, he distinctly sets it before us as existing in three persons. These we must hold, unless the bare and empty name of Deity merely is to flutter in our brain without any genuine knowledge. Moreover, lest any one should dream of a threefold God, or think that the simple essence is divided by the three Persons, we must here seek a brief and easy definition which may effectually guard us from error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.13.2</span></figcaption>

</figure><figure class="quote" id="q-62955810eb" data-kw="">
<blockquote><p>Why is the Son so called? Answer. Because He was begotten of the Father by a perfect and eternal generation, not to be uttered of man or conceived. And we must be warned not to conceive it in any carnal or human manner. For an earthly father is in time before his son, and the son after. But God the Father and the Son are coeternal, and not one before or after the other for time. An earthly father is forth of [i.e., separate from] the son, and the son forth of the father. But God the Father is in the Son, and the Son in the Father. An earthly child is from his father by propagation, but the Son is from the heavenly Father not by propagation, but by communication of substance. Lastly, the heavenly Father begets the Son by communication of His whole substance, and so does no earthly father.</p></blockquote>

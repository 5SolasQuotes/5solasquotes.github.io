<main class="wrap"><figure class="quote" id="q-d064e98d32" data-kw="">
<blockquote><p>The argument from antiquity, or from ancestry, is wonderfully convenient for minds that, averse from patient inquiry and discriminating thought, love to acquiesce in the traditionary belief of former generations, without caring to ascertain if the convictions of past ages were consonant to truth, or if there be anything in the present order of Providence that would justify or demand a departure from the creed and customs of those that went before. To this easy-minded class belonged the woman of Samaria, who, in the conference with our Lord here recorded, held up the usage of progenitors as a shield impenetrable—she thought, to every form of objection, “Our fathers worshipped in this mountain.”

This was enough; here she took her stand, and on the same ground stood her countrymen and the Jewish nation generally, when Christianity was first proposed to them. On this ground, too, did the heathen of old, and the heathen that now are, allege their fathers’ belief as a reason for not listening to the claims of Divine revelation. Precisely similar was the position tenaciously maintained by the blinded opponents of reformation in Luther’s day; while among ourselves, numbers have no better reason, or, at least, will give us no better reason, for worshipping God in certain places, than that advanced by the woman of Samaria — “Our fathers worshipped there.”

Such was her plea, and to this plea she would probably have adhered till her dying hour, had she argued with one less mighty to enlighten and convince than Christ; but it was in his heart to rescue a captive of error, and bring her to a saving knowledge of the truth; and that not by means of a long process of reasoning—not by detecting and exposing her inveterate prejudices singly and in detail, but by sweeping them away at once by the announcement of a new order of things, involving in its development the abolition of all that was local, peculiar, and ceremonial in the established worship, and substituting for it a ritual more simple, and ordinances not exclusive, but accessible to all—ordinances characterized by spirituality, and having truth without a veil substantially enshrined in them. “The hour cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth; for the Father seeketh such to worship him.”

To evade questions touching personal character, the woman of Samaria tried to divert the discourse to the circumstantials of religion, and sought to engage our Lord in debate as to the place of worship most acceptable to God—a question vehemently agitated in those days betwixt Samaritans and Jews. How often is a like device still resorted to by people who show themselves cold, distant, and inaccessible in matters of experimental religion, the nature of conversion, and the operations of grace, but will hold us in endless dispute as to the validity of ancient forms, and the virtue of worshipping where their fathers did. Here their zeal, which on greater points was so latent, kindles into flame, and blazes intolerantly high. To render the fuel of prejudice less combustible, however, it were well to consider what is intended by the saying of Christ, that the hour had come “when the true worshippers were to worship the Father in spirit and in truth.”

To establish purity of worship in the earth, was an undertaking worthy of the Son of God. In the opinion of some, we believe, it had been a nobler enterprise of philanthropy to deal directly with man’s social state, to have rectified its inequalities, and provided for the secular interests of humanity, putting aside meanwhile the question of religion as of inferior importance—a world without God, or a God without worship, well according with their views. We suppose they would regulate heaven itself on the same principles, and haply find fault with its blest inhabitants for making so much ado about devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-sieveright.html">James Sieveright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Freedom of Gospel Worship from Local Circumstances and National Peculiarities Asserted in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water, which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears, and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now; There is sometimes an inevitable necessity by God’s providence, and sometimes a contracted necessity through want of care and foresight: in this case the work may sometimes be done, provided that our neglect beforehand be repented of:</p></blockquote>

<blockquote><p>2. There are many parts of God’s worship which are not essential, yet such as will not suffer any addition of the Church. For proof whereof, I demand, were all the ceremonies commanded to be used in the legal sacraments and sacrifices, essential parts of those worships? No man will say so. Yet the synagogue was tied to observe those (and no other than those) ceremonies which the Word prescribed. When Israel was again to keep the Passover, it was said; In the fourteenth day of this month at even, ye shall keep it in his appointed season: according to all the rites of it and according to all the ceremonies of it, shall ye keep it. And again: ‘According to all that the Lord commanded Moses, so did the Children of Israel.’ Ritibus et ceremoniis divinitus institutis, non licuit homini suo arbitrio aliquid adijcere aut detrahere, says Peter Martyr.

3. If those accidentary parts of worship which are commanded in the Word be both necessary to be used necessitatè praecepti [by the necessity of precept], and likewise sufficient means fully adequate and proportioned to that end, for which God has destinated such parts of his worship as are not essential (which must be granted by everyone who will not accuse the Scripture of some defect and imperfection: then it follows that other accidentary parts of worship which the Church adds thereto are but superfluous and superstitious.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. There are many parts of God’s worship which are not essential, yet such as will not suffer any addition of the Church. For proof whereof, I demand, were all the ceremonies commanded to be used in the legal sacraments and sacrifices, essential parts of those worships? No man will say so. Yet the synagogue was tied to observe those (and no other than those) ceremonies which the Word prescribed. When Israel was again to keep the Passover, it was said; In the fourteenth day of this month at even, ye shall keep it in his appointed season: according to all the rites of it and according to all the ceremonies of it, shall ye keep it. And again: ‘According to all that the Lord commanded Moses, so did the Children of Israel.’ Ritibus et ceremoniis divinitus institutis, non licuit homini suo arbitrio aliquid adijcere aut detrahere, says Peter Martyr.

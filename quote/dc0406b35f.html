<main class="wrap"><figure class="quote" id="q-dc0406b35f" data-kw="imputation">
<blockquote><p>However although this mode of general propagation is evident and is sufficient for establishing the truth of the traduction of sin; whence since Julian sought through what chinks sin could have entered, since he does not sin who is born; he does not sin who begat; he does not sin who made—Augustine answers, “Why does he seek a concealed crack, when he has a wide open gate? By one man.… What does he seek further; what clearer; what more impressive?” (On Marriage and Concupiscence 2.28 [NPNF1, 5:302; PL 44.464]). Still because the importunity of our opponents is wont to attack this mode violently as impossible (because sin can neither pass by the soul, which is created by God and is not drawn from the body, nor by the body which is brute and incapable of sin), let us see what can be said here more particularly to untie the knot which they think cannot be loosed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.12</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6156ddcc2e" data-kw="Author of sin The Fall Original Sin">

</figure><figure class="quote" id="q-9b230d1369" data-kw="seat">
<blockquote><p>Whatever is anomon (“lawless” in the abstract) or anomia (“lawlessness”) is really sin, but not forthwith what is called “lawless” (anomon) in the concrete because it has sin in itself. In this sense, human nature is called “lawless” (anomos); not that it is sin itself, but because having sin in itself it is well called “sinful.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.11</span></figcaption>

</figure><figure class="quote" id="q-19ea18ba90" data-kw="Original Sin The Fall Depravity">
<blockquote><p>We believe that through the disobedience of Adam original sin is extended to all mankind; which is a corruption of the whole nature and a hereditary disease, … and which produces in man all sorts of sin, being in him as a root thereof, and, therefore, is so vile and abominable in the sight of God that it is sufficient to condemn all mankind. … Not that they should rest securely in sin, but that a sense of this corruption should make believers often to sigh, desiring to be delivered from this body of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 15</span></figcaption>

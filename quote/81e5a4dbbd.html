<main class="wrap"><figure class="quote" id="q-81e5a4dbbd" data-kw="">
<blockquote><p>Calvin rules out this interpretation with sufficient clarity when he denies that Christ gained merit for Himself, and censured the Scholastics who taught that He did. Calvin’s censure would have been completely unwarranted if Christ could have merited reward for Himself in any way at all. He felt that it was enough to show that Christ could not merit reward for Himself as God for God, or as man for man. Calvin just takes it for granted that one nature could not merit reward for the other. And rightfully so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/faustus-socinus.html">Faustus Socinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Socinus &amp; the Racovian Catechism on Justification’ being ch. 13 in Michael Parsons, Aspects of Reforming</cite>, As quoted in J.V. Fesko, (Paternoster, 2013)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span></div>
<div class="actions"><button class="copy" data-copy="“Calvin rules out this interpretation with sufficient clarity when he denies that Christ gained merit for Himself, and censured the Scholastics who taught that He did. Calvin’s censure would have been completely unwarranted if Christ could have merited reward for Himself in any way at all. He felt that it was enough to show that Christ could not merit reward for Himself as God for God, or as man for man. Calvin just takes it for granted that one nature could not merit reward for the other. And rightfully so.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3573a6dea" data-kw="">
<blockquote><p>There is no definite doctrinal decision in this matter. The concept meritum de congruo is not without ambiguity, inasmuch as the claim arising from it can be greater or less, hence the opinions of theologians are divided. a) Meritum de congruo and the sinner. A person in mortal sin can merit de congruo, by his free co-operation with actual grace, further actual graces in preparation for justification, and finally the grace of justification itself. (Sent. probabilis.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 4, pt. 1, sec. 2, §25, 2</span></figcaption>

</figure><figure class="quote" id="q-964ec93cbe" data-kw="">
<blockquote><p>43. What is the connection of the exaltation of the Mediator to His humiliation? The connection of legal consequence. Christ is Mediator not as a private person but as an official person, as Head of His members. Hence He must receive the fruits of His merits in Himself. And as He did not suffer for Himself, so too He was not glorified for Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Ch. 5, ‘States’, #43, p. 218 in Reformed Dogmatics, vol. 3, Christology (Lexham Press, 2014)</span></figcaption>

</figure><figure class="quote" id="q-9713d497d0" data-kw="">
<blockquote><p>Nor ought it to be doubted that condign merit can vary in these three ways. For if some work were much inferior to the reward promised by agreement—as if the lord of a vineyard hired laborers and promised as wages, not a denarius a day, but a hundred gold pieces—such merit would be ex condigno by reason of the pact, not by reason of the work. Conversely, if the work were really equal to the reward, or perhaps even greater, but no agreement had intervened, then if such merit ought to be called ex condigno, it would have to be called ex condigno by reason of the work, not by reason of the pact. … Finally, if a pact both intervenes and the work is truly equal to the reward, as when laborers are hired for the vineyard for a denarius a day according to the Gospel, that merit will be ex condigno by reason of the work and by reason of the pact.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-b8e4f9d6ce" data-kw="">
<blockquote><p>What have these most pestilential Sophists left to Christ on which to exert his virtue? They say that he merited for us the first grace, that is, the occasion of meriting, and that it is our part not to let slip the occasion thus offered. O the daring effrontery of impiety! Who would have thought that men professing the name of Christ would thus strip him of his power, and all but trample him under foot?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.6</span></figcaption>

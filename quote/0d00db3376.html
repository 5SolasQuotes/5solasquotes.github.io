<main class="wrap"><figure class="quote" id="q-0d00db3376" data-kw="persons not class Arminian">
<blockquote><p>Far different however are the decrees of the Arminians. … The second is concerned only with the qualities of those to be saved or damned (without any distinction of persons). The fourth is indeed occupied about particular persons, but contingently and eventually … Nor does it so much respect persons, as faith in the persons.</p></blockquote>

</figure><figure class="quote" id="q-aeeb8f850d" data-kw="particular election persons">
<blockquote><p>Predestination is delivered in the word as always referred to particular individuals. Among them, it is determined according as they are either made vessels of grace or vessels of wrath; are destined to life or to destruction (Rom. 8:29, 30; Rom. 9:11, 16; Eph. 1:4, 5; Jn. 10:26; 13:18; 17:6, 12).</p></blockquote>

</figure><figure class="quote" id="q-db7c9a5cf7" data-kw="faith gift elect ordo">
<blockquote><p>Predestination to life necessarily includes the decree of God’s giving faith and perseverance (Acts 13:48; Rom. 8:29, 30). And the promise concerning the giving of faith to the elect no less pertains to the circuit of the gospel covenant (Heb. 8:10; Eph. 2:8; Phil. 1:29), than the promise concerning the giving of salvation to believers.</p></blockquote>

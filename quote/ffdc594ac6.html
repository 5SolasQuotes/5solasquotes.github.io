<main class="wrap"><figure class="quote" id="q-ffdc594ac6" data-kw="">
<blockquote><p>It has sometimes been said that George Gillespie taught a regulative principle of civil government. This notion seems to be based on a confusion with regard to his views on civil punishment and his theology of the state more generally. The Libertarian Theologians/American Theonomists have tended to divorce the former from the latter; as a result of this methodological error, they think they can cite Gillespie as one of their own. This conclusion appears to be misguided, as a fuller reading of Gillespie’s writings indicates that he held the standard Reformed position that the civil magistrate is to uphold both tables of law (positively and negatively), but is not bound by a “regulative principle” in the same way that the church is.

There is no question that in Wholesome Severity, Gillespie was adamant that capital punishment was tightly regulated by scripture. If God commands the magistrate to slay murderers, he cannot substitute the divinely-appointed penalty for a £5 fine under the pretext that he is still upholding the sixth commandment. However, it is a mistake to assume that just because Gillespie thought capital punishment was strictly regulated by scripture that he thus reasoned that all aspects of civil government were likewise so strictly regulated. In Aaron’s Rod Blossoming, for example, Gillespie explicitly denies any notion of a regulative principle of civil government by contrasting presbyterial and magisterial power:

The presbyterial government hath no such liberty nor arbitrariness, as civil or military government hath, there being in all civil or temporal affairs a great deal of latitude left to those who manage the same, so that they command nor act against the word of God. But presbyterial government is tied up to the rules of Scripture, in all such particulars as are properly spiritual and proper to the church, though, in other particulars, occasional circumstances of times, places, accommodations, and the like, the same light of nature and reason guideth both church and state; yet in things properly spiritual and ecclesiastical, there is not near so much latitude left to the presbytery, as there is in civil affairs to the magistrate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s rod blossoming; or, the divine ordinance of church government vindicated</cite>, (1646; Edinburgh, 1844), p. 84.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-d6568cc077" data-kw="">
<blockquote><p>How then can these things be gods, seeing that they need one another’s assistance? Or how is it proper to ask anything of them when they too ask help for themselves one from another? For if it is an admitted truth about God that He stands in need of nothing, but is self-sufficient and self-contained, and that in Him all things have their being, and that He ministers to all rather than they to Him, how is it right to proclaim as gods the sun and moon and other parts of creation, which are of no such kind, but which even stand in need of one another’s help?

But, perhaps, if divided and taken by themselves, our opponents themselves will admit that they are dependent, the demonstration being an ocular one. But they will combine all together, as constituting a single body, and will say that the whole is God. For the whole once put together, they will no longer need external help, but the whole will be sufficient for itself and independent in all respects; so at least the would-be philosophers will tell us, only to be refuted here once more.

Now this argument, not one whit less than those previously dealt with, will demonstrate their impiety coupled with great ignorance. For if the combination of the parts makes up the whole, and the whole is combined out of the parts, then the whole consists of the parts, and each of them is a portion of the whole. But this is very far removed from the conception of God. For God is a whole and not a number of parts, and does not consist of diverse elements, but is Himself the Maker of the system of the universe. For see what impiety they utter against the Deity when they say this. For if He consists of parts, certainly it will follow that He is unlike Himself, and made up of unlike parts. For if He is sun, He is not moon, and if He is moon, He is not earth, and if He is earth, He cannot be sea: and so on, taking the parts one by one, one may discover the absurdity of this theory of theirs.

But the following point, drawn from the observation of our human body, is enough to refute them. For just as the eye is not the sense of hearing, nor is the latter a hand: nor is the belly the breast, nor again is the neck a foot, but each of these has its own function, and a single body is composed of these distinct parts,—having its parts combined for use, but destined to be divided in course of time when nature, that brought them together, shall divide them at the will of God, Who so ordered it;—thus (but may He that is above pardon the argument), if they combine the parts of creation into one body and proclaim it God, it follows, firstly, that He is unlike Himself, as shewn above; secondly, that He is destined to be divided again, in accordance with the natural tendency of the parts to separation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Heathen</cite>, (c. 335), 28.1-4 in Nicene and Post-Nicene Fathers 2, 4: 18-19.</span></figcaption>

+up+of+unlike+parts.+For+if+He+is+sun%2C+He+is+not+moon%2C+and+if+He+is+moon%2C+He+is+not+earth%2C+and+if+He+is+earth%2C+He+cannot+be+sea%3A+and+so+on%2C+taking+the+parts+one+by+one%2C+one+may+discover+the+absurdity+of+this+theory+of+theirs.%0A%0ABut+the+following+point%2C+drawn+from+the+observation+of+our+human+body%2C+is+enough+to+refute+them.+For+just+as+the+eye+is+not+the+sense+of+hearing%2C+nor+is+the+latter+a+hand%3A+nor+is+the+belly+the+breast%2C+nor+again+is+the+neck+a+foot%2C+but+each+of+these+has+its+own+function%2C+and+a+single+body+is+composed+of+these+distinct+parts%2C%E2%80%94having+its+parts+combined+for+use%2C+but+destined+to+be+divided+in+course+of+time+when+nature%2C+that+brought+them+together%2C+shall+divide+them+at+the+will+of+God%2C+Who+so+ordered+it%3B%E2%80%94thus+%28but+may+He+that+is+above+pardon+the+argument%29%2C+if+they+combine+the+parts+of+creation+into+one+body+and+proclaim+it+God%2C+it+follows%2C+firstly%2C+that+He+is+unlike+Himself%2C+as+shewn+above%3B+secondly%2C+that+He+is+destined+to+be+divided+again%2C+in+accordance+with+the+natural+tendency+of+the+parts+to+separation.%E2%80%9D%0A%0A%E2%80%94+Athanasius+of+Alexandria%2C+Against+the+Heathen%2C+%28c.+335%29%2C+28.1-4+in+Nicene+and+Post-Nicene+Fathers+2%2C+4%3A+18-19.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd6568cc077.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d6568cc077.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/10/07/athanasius-of-alexandria-on-gods-all-sufficiency-in-opposition-to-polytheism/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-b8fadf4ca9" data-kw="">
<blockquote><p>I did judge it better to suffer then to sin, and therefore I am come hither to lay down my life this day, and I bless God I die not as a Fool, not that I have any thing wherein to glory in my self: I acknowledge I am a Sinner, yea one of the vilest and greatest that hath owned a profession of Religion, and one of the most unworthiest that hath preached the Gospel, my Corruptions have been strong and many and hath made me a sinner even in all things, yea even in following my Duty: And therefore righteousness have I none of my own, but I do believe that Jesus Christ came into the World to save sinners whereof I am the chief, through faith in his righteousness and blood, have I obtained mercy, and in him and through him alone have I the hope of a blessed conquest and victory over sin and Satan, and hell and death, and that I shall attain unto the Resurrection of the just and be made a partaker of eternal life, I know whom I have believed, and he is able to keep that which I have committed to him against that day.

I have preached Salvation through his name, and as I have Preached so I believe, and do commend the riches of his free grace and faith in his blood unto you all, as the only way whereby you can be saved, and I bless God as I die not as a fool, so also I die not for evil doing, not a few of you may happily judge that I suffer as a Thief, or as a Murderer, as an evil Doer, or as a busy-body in other men’s matters, that was the lot of our Lord Jesus Christ himself, and hath been the lot of many of his precious people and servants, to suffer by the World as evil doers, and as my soul stirs not at that, but desires to rejoice in being in conformity to my blessed head, and so blessed a company in these things, so do I desire in prayer that I may be to none of you to day on this account a stone of stumbling, or a Rock of offence.

Blessed is he that will not be offended in Christ, and his poor servants, because of their being condemned as evil doers by the World, God is my record that in these things for which sentence of death hath passed against me, I have a good Conscience, I bless God they are not matters of Compliance with the Sectaries, or designs and practices against his Majesty’s person, or Government, or the Person or Government of his Royal Father, my heart I bless God is Conscious of no disloyalty, nay Loyal I have been, and commend it to you all, to be Loyal and Obedient unto the King, true piety is the foundation of true loyalty, a Wicked man may be a flatterer, and a time server, but he will never be a loyal Subject …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The true and perfect speech of Mr. James Guthrey, late minister of Sterling as it was delivered by himself immediately before his execution on June 1, 1661 at Edinburgh. Sent from Edinburgh, and printed for public satisfaction, and to prevent the dispersing of false copies</cite>, (Edinburgh, 1661), pp 5-7.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed27b9bc75" data-kw="">
<blockquote><p>For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae theologicae: liber unus</cite>, (Geneva: Vignon, 1573), Epistle 35, to Olevianus (1560), p. 200 as trans. G.A. van den Brink, The Transfer of Sin… (Brill, 2024), p. 219 cf. Epistle 45, p. 228</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>
<div class="actions"><button class="copy" data-copy="“For what is vainer than regarding someone as righteous who has not kept the law? Yet the law not only forbids that anything be done which it condemns (to which is attached a threatening with death) but also prescribes the outcome of what it enjoins (to which is attached the promise of life). Thus, whoever in Christ is judged to be ‘no sinner’ has indeed evaded death; but on the grounds of what other right would anyone demand life, other than that he has in Christ fulfilled all the righteousness of the law?”

— Theodore Beza, Epistolae theologicae: liber unus, (Geneva: Vignon, 1573), Epistle 35, to Olevianus (1560), p. 200 as trans. G.A. van den Brink, The Transfer of Sin… (Brill, 2024), p. 219 cf. Epistle 45, p. 228">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+what+is+vainer+than+regarding+someone+as+righteous+who+has+not+kept+the+law%3F+Yet+the+law+not+only+forbids+that+anything+be+done+which+it+condemns+%28to+which+is+attached+a+threatening+with+death%29+but+also+prescribes+the+outcome+of+what+it+enjoins+%28to+which+is+attached+the+promise+of+life%29.+Thus%2C+whoever+in+Christ+is+judged+to+be+%E2%80%98no+sinner%E2%80%99+has+indeed+evaded+death%3B+but+on+the+grounds+of+what+other+right+would+anyone+demand+life%2C+other+than+that+he+has+in+Christ+fulfilled+all+the+righteousness+of+the+law%3F%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Epistolae+theologicae%3A+liber+unus%2C+%28Geneva%3A+Vignon%2C+1573%29%2C+Epistle+35%2C+to+Olevianus+%281560%29%2C+p.+200+as+trans.+G.A.+van+den+Brink%2C+The+Transfer+of+Sin%E2%80%A6+%28Brill%2C+2024%29%2C+p.+219+cf.+Epistle+45%2C+p.+228&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fed27b9bc75.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ed27b9bc75.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=For%20what%20is%20vainer%20than%20regarding,all%20the%20righteousness%20of%20the%20law&amp;text=For%20what%20is%20vainer%20than%20regarding%20someone%20as&amp;text=Christ%20fulfilled%20all%20the%20righteousness%20of%20the%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6876250b9b" data-kw="">
<blockquote><p>Hence, it is also manifest that if any good quality or work of ours were made the condition of our justification or title to eternal life, this would turn the covenant of grace exhibited in the gospel into a covenant of works. The covenant of grace revealed and offered to sinners in the gospel is the only covenant according to which a sinner can be justified and entitled to life eternal. It is absolutely impossible that he can be justified according to the broken covenant of works. But were any graces, acts, or works of his the proper conditions of his justification, the covenant of grace would be as much a covenant of works as ever the covenant made with Adam was. The condition of Adam’s covenant was perfect obedience, and according to this imaginary law of easier terms, the conditions of the covenant of grace are sincere faith and sincere obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 102.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

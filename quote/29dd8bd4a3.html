<main class="wrap"><figure class="quote" id="q-29dd8bd4a3" data-kw="">
<blockquote><p>Amazingly, there is no primary evidence to date contradicting the historical fact that the Westminster divines exclusively endored only one view, if they commented at all, in their published writings or commentaries… To summarize: There are up to 21 witnesses (the list is growing over time); there are at least 8 explicit testimonies for 24-hour days–and it is more likely that that number will increase than that other modern views will find superior support.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-hall.html">David Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, eds. Pipa, Joseph &amp; David Hall, Did God Create in Six Days?, p. 267</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

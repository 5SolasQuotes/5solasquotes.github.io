<main class="wrap"><figure class="quote" id="q-d6669adc36" data-kw="">
<blockquote><p>Jonah… cried, and said, ‘Yet forty days and Nineveh shall be overthrown.’ So the people of Nineveh believed God, and proclaimed a fast, and put on sackcloth, from the greatest of them even to the least of them… the king of Nineveh… caused it to be proclaimed and published through Nineveh… saying, ‘…let man and beast be covered with sackcloth, and cry mightily unto God: yea, let them turn every one from his evil way, and from the violence that is in their hands. Who can tell if God will turn and repent, and turn away from his fierce anger, that we perish not?’ And God saw their works, that they turned from their evil way; and God repented of the evil that He had said that He would do unto them; and He did it not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Jonah 3:4-10</cite></span></figcaption>

</figure><figure class="quote" id="q-aaeaead8bb" data-kw="">
<blockquote><p>…we believe that all things without exception are under divine providence: whether heavenly or sublunary, great or small, necessary and natural or free and contingent. Thus nothing in the nature of things can be granted or happen which does not depend on it. The reasons are: (1) God created all things, therefore He also takes care of all things. For if it was glorious for God to create them, it ought not to be unbecoming in Him to take care of them. Nay, as He created, He is bound to conserve and govern them continually, since He never deserts His own work, but ought to be perpetually present with it that it may not sink back into nothingness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, On Providence</span></figcaption>

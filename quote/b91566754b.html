<blockquote><p>Equality of wealth is in no respect necessary among mankind. Particular persons ought to reap the fruits of their lawful care and industry. And, it is not for the hurt, but for the advantage, of the public, that some be richer than others.</p></blockquote>

<blockquote><p>The division of tongues [(Genesis) 11:1–9]

The building of a city and tower [of Babel] was inspired first by the desire to obtain a centre of unity, such as would keep the human race together. But the securing of this unity was by no means the ultimate purpose of the effort. Unity was to afford the possibility for founding a gigantic empire, glorifying man in his independence of God. The latest criticism finds here two myths woven together, one describing the building of a tower for preserving unity, the other relating to the building of a city for gaining renown. But this, while resembling the explanation just given, misses the inner connection between the two projects.

The tower was for the sake of the city, and there is no need of dissection. God interferes with the execution of this plan, not so much, or at least not only, from opposition to its impious spirit, but chiefly from fidelity to His promise, that the sinful development of humanity will not again issue into a repeated catastrophe on the scale of the deluge. If this were not to happen, the progress of sin had to be checked. If the whole of humanity had remained concentrated, the power of sin would likewise have remained united, and doubtless soon again have reached stupendous proportions. Hence it was next necessary to break up the unity of the race. As Delitzsch has observed: ‘the immoral and irreligious products of one nation are not equally destructive as those of an undivided humanity’, and ‘many false religions are better than one, since they paralyse one another’.

It is true that in the abstract the unity of the race, unbroken by national distinctions, is the ideal. Had sin not entered, this would undoubtedly have been the actual state of things, as it will become so in the final eschatological dispensation [cp. Gal. 3:28]. But for the present intervening period this is not the will of God. Nationalism, within proper limits, has the divine sanction; an imperialism that would, in the interest of one people, obliterate all lines of distinction is everywhere condemned as contrary to the divine will. Later prophecy raises its voice against the attempt at world-power, and that not only, as is sometimes assumed, because it threatens Israel, but for the far more principal reason, that the whole idea is pagan and immoral.

Now it is through maintaining the national diversities, as these express themselves in the difference of language, and are in turn upheld by this difference, that God prevents realization of the attempted scheme. Besides this, however, a twofold positive divine purpose may be discerned in this occurrence. In the first place there was a positive intent that concerned the natural life of humanity. Under the providence of God each race or nation has a positive purpose to serve, fulfilment of which depends on relative seclusion from others. And secondly, the events at this stage were closely interwoven with the carrying out of the plan of redemption. They led to the election and separate training of one race and one people. Election from its very nature presupposes the existence of a larger number from among which the choice can be made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Biblical Theology: Old and New Testaments</cite>, (1948; Edinburgh: Banner of Truth, 1975), pp 59-60.</span></figcaption>

m/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-760683f9b2" data-kw="">
<blockquote><p>I will be thy king” supposes more than this: ye shall have no other king besides Me. I will tell you, the most part of the land cry out, We will have no other king but Caesar – no other king but king Charles. But we must cry we will have no other king but Christ. What is that? Say ye, Are ye all against monarchy and civil Government? We are much taken up with that, if God let pure government be established, that is most for the good and advantage of civil and ecclesiastical society. But we set up kings and princes, but not by Him. If you would have Him be for you ye must cut off this king, and these princes, and make able men be your rulers, endued with suitable qualifications both of body and mind, that may employ their power for the cause and interest of God. […] Our Lord will set up other magistrates according to His promise: “And kings shall be thy nursing fathers, and queens thy nursing mothers.” And who knows but God will make out that yet? “And their nobles shall be of themselves, and their governor shall proceed from the midst of them.” Indeed by governor we principally understand our Lord Jesus Christ. But when He turns back the captivity of His Church and people, none shall be governors but such as shall be for Him, at least by profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on Hosea 13:9-10 (1680)′ in Sermons in times of persecution in Scotland, by sufferers for the royal prerogatives of Jesus Christ</cite>, ed. James Kerr (Edinburgh, 1880), pp 413-14.</span></figcaption>

<blockquote><p>In an article on capital punishment in the Philadelphia Covenanter periodical (not to be confused with the Belfast Covenanter), edited by James M. Willson, the author contrasted the Gnostic or Marcionite view of the Old Testament’s penal laws held by John Paul, with the true Covenanter position adhered to by Thomas Houston:

Were the law which God gave to Moses admitted authority, there would be an end of this controversy [over capital punishment]; but the prevailing sentiment of the present day seems to be that of the Gnostics, who taught that the God of Israel was the devil, and that Jesus Christ came to destroy his power, and deliver men from his tyranny! The editor of the New York Tribune is wonderfully scandalized at being charged with infidelity; and yet he quotes, without remark, a passage from the Lynn Record, in which an “eye for an eye,” &amp;c., is termed infernal policy! Dr. Paul, of Ireland, (once a Covenanter,) calls the laws of the Old Testament Thomas Houston’s bloody laws! In this he offers a double insult to the Divine Majesty; first, in calling his laws bloody; secondly, by calling them Thomas Houston’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1847, pp 163-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>But still I ask, are we absolutely and always bound to obey magistrates? Nay, but only when they command such things as are according to the rules of the Word, so that either they must be obeyed, or the Law of Charity shall be broken: in this case, and no other, we are bidden obey.</p></blockquote>

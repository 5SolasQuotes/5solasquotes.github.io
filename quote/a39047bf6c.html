<blockquote><p>The case of human freedom, as a species of contingency, is quite different: it references a genuine alternativity in human choice that is ontically [the order of being, not just in the order of knowledge] grounded in the divine decree, maintained in the providential concursus, and rooted in the potencies belonging to the will and the free determinations of the intellect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Will &amp; Human Choice: Freedom, Contingency &amp; Necessity in Early Modern Reformed Thought Excerpt</cite>, p. 316</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

— Richard Muller, Divine Will &amp; Human Choice: Freedom, Contingency &amp; Necessity in Early Modern Reformed Thought Excerpt, p. 316">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+case+of+human+freedom%2C+as+a+species+of+contingency%2C+is+quite+different%3A+it+references+a+genuine+alternativity+in+human+choice+that+is+ontically+%5Bthe+order+of+being%2C+not+just+in+the+order+of+knowledge%5D+grounded+in+the+divine+decree%2C+maintained+in+the+providential+concursus%2C+and+rooted+in+the+potencies+belonging+to+the+will+and+the+free+determinations+of+the+intellect.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Divine+Will+%26+Human+Choice%3A+Freedom%2C+Contingency+%26+Necessity+in+Early+Modern+Reformed+Thought+Excerpt%2C+p.+316&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa39047bf6c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a39047bf6c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-free-choice/#:~:text=The%20case%20of%20human%20freedom%2C%20as,the%20free%20determinations%20of%20the%20intellect." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7d5eaa632" data-kw="">
<blockquote><p>What makes it the case that I do in fact act or refrain from acting on the reasons in question? Doesn’t a choice to act require a cause, and if the act is to be a free and thus self-determined one, doesn’t that entail that the cause must be some further choice on my part? If that is the case, doesn’t that further choice itself require yet another choice as a cause, and so on ad infinitum? The answer is that this does not follow. Just as the will’s ultimate ends in the order of final causes are simply given rather than pursued for the sake of yet further ends, so too its ultimate acts in the order of efficient causes can bring about effects (such as bodily movements) without themselves being caused. The will is in this sense an uncaused cause or unmoved mover.† † …as Cuypers goes on to note, this is consistent with holding that the will is ultimately moved by God, just as, for the Thomist, everything other than God ultimately exists and acts at any moment only insofar as God conserves it in being and concurs with its causal activity. If we acccept this theological picture (as I happen to), the will would count as an unmoved mover only in a relative sense, with God alone being an unmoved mover in an absolute sense… In my view, how divine causality related to the will is in any event more a question about the nature of divine causality than it is a question about the nature of the will. This does not entail that its operation is random, either in the snese of being an exception to the principle of causality or in the sense of being unintelligible or devoid of explanation. It is not an exception to the principle of causality, because events require causes insofar as they contain some passive potentiality that requires actualization… The exertion of the will by contrast, is entirely active rather than passive. It is a bringing about that is not itself brought about by anything else. Yet it is not unintelligible or devoid of explanation, because it is done for a reason–in particular, for the sake of the end grasped by the intellect–and something done for a reason is the opposite of unintelligible. Hence the defender of agent-causal free will [which Aquinas’s view more or less fits into] is not stuck with the dilemma of having to posit either ‘an infinite regress or a nonrational flip-flop.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortality of Souls: a Treatise on Human Nature (Editiones Scholastica, 2024), ch. 4, ‘The Will’ Feser is an Anyltical Thomist, writing in the Thomist tradition. What is said below is consistent with divine, physical predetermination.</cite>, pp. 169-70</span></figcaption>

</figure><figure class="quote" id="q-c952601d72" data-kw="">
<blockquote><p>…whereas original sin does necessarily incline him to sinful actions and courses in general; though to this kind of sin in special, or to this particular, in what kindsoever, it does not… when once God has planted in us a principle of new life, of the life of grace, by the spirit of regeneration, though all the powers thereof do incline only to that which is good, like as the powers of natural corruption incline only unto evil, yet the particular use and exercise of those is always free: Like as the particular use and exercise of the powers of our corruption is always free to the committing of this or that sin according unto emergent occasions standing in congruity to every man’s particular disposition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Riches of God’s Love unto the Vessels of Mercy… (d. 1646; Oxford, 1653), bk. 2, An Examination of Certain Passages inserted into Mr. Hord’s Discourse, Answer to the Additions</cite>, sect. 8, p. 103</span></figcaption>

</figure><figure class="quote" id="q-9b52c99742" data-kw="">
<blockquote><p>In his ‘Metaphysical investigations’ [appended to his Treatise on Providence, see the table of contents], Rutherford argues that God’s being is the first principle of all things… the law of non-contradiction cannot be the very first principle. The law of non-contradiction in complex, not simple… Possibilia are grounded in God’s omnipotence. God likewise becomes the ‘Lord of impossibilities, by creating the specific forms of things from which incompossibilities result.’ Accordingly, it is important to note that ‘all possibilia are possible because God is omnipotent; God is not, conversely omnnipotent because they are in themselves and intrinsically possible.’… Rutherford gives an affirmative answer to the question ‘whether God is the origin and cause of impossibilia and possibilia‘… Another question that Rutherford addresses is ‘whether possibilia are something real’. They are not, according to Rutherford, since they are just called ‘possible’ by a merely external reference to God’s omnipotence. Possibilia are, as their name suggests, merely ‘in potency’, not actually existing…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aza-goudriaan.html">Aza Goudriaan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Samuel Rutherford on the Divine Origin of Possibility’ being ch. 8 in ed. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology 1560-1775</cite>, pp. 142-3, 145</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

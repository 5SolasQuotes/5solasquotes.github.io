<main class="wrap"><figure class="quote" id="q-c3d5ad474f" data-kw="">
<blockquote><p>In early youth, we cannot avoid hearing much on the subject of affliction. As we are making our way forward to mature life, we perceive countenances sad, and we are often told, though it affects us little, that the time is coming when we shall be taught, as all others have been, that this is a suffering world. And whether we look into our Bibles, or read the records of those who have taken note of the history of our race, our attention is drawn to the fact, that none are exempt from the common lot. The child has been accustomed to look upon the countenance of maternal love, and, strange to tell, without any evidence of sickness or of bodily suffering, it bears the marks of anguish, and the big tear is stealing down that cheek which, till now, has been gladdened with a smile. …

It is but too true, that many are chastened, or visited with affliction, who either do not know the source of it, or do not take heed whence it comes. They smart under their affliction, whether approaching them in the form of poverty reverses, or death; nay, some are much cast down by them; but they do not connect them with the Supreme Disposer of events. Mistake me not. I do not speak of avowed unbelievers — of such as, if questioned, would say, that they are persuaded that the Supreme Being takes no cognizance of the petty affairs of men. It is of those who would warmly and heartily repudiate such a statement as irrational, and opposed, not only to their judgments, but their feelings too. But those now adverted to are such as practically receive their trials, as indeed they do their comforts and mercies, without connecting them with God as the source.

Affliction does indeed produce an impression of a stronger kind upon them than prosperity. It stuns them, and we are willing to admit that, for the moment, there may be a reflection of something like a Divine cause being the author. But this reflection (reflection is too strong a term — it is a mere passing shadow of a thought) — this reflection goes off, and is succeeded by a sort of feeling of fatalism — a conclusion that it is our lot — we have suffered loss — we have been deprived of what we loved — we have been bereaved — and, under these circumstances, we must bear as men what we cannot help, and continue the labours of life, which have for a time been interrupted. The path of life is resumed. New occupations, new pleasures, new cares, come in, and the remembrance of the affliction is avoided is what tends to do nothing else than to introduce painful and gloomy ideas. It stands forth, in the record of memory, an event by itself, having no relation to any cause, and leaving no effect of a moral kind behind to prove that it has occurred.

Such is the manner in which many receive affliction; and this, we need scarcely say, is not the way in which it should be received, or indeed is received, by the people of God. So far from this, their language — the language of their hearts — is. Thou hast chastised me — thou hast afflicted me — the Lord hath done it — it was no chance that visited me — no concurrence of events without the direction of Jehovah — it was thine arm which launched the dart that reached my heart — Jehovah hath done this — it was Thou that didst cast down the accumulations which I had raised by honest industry — it was Thou that didst take Rachel from my bosom — it was Thou that wouldst have my Isaac — the Lord gave, and the Lord hath taken away.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-thorburn.html">Joseph Thorburn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sanctified Affliction (November 1844) in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0aae216358" data-kw="">
<blockquote><p>Suffering especially tests and strengthens hope. Paul teaches that discovering God’s help increases our hope (Rom. 5:5). Because God enables us to experience his goodness, power, and faithfulness when we are in need, because he strengthens us against every temptation and safeguards us against every attack, and because he delivers us from all our fears, he in all these ways so establishes and guarantees in us the truth of his promises that whoever calls on him will be saved and whoever trusts in him will never be put to shame. …

By means of trials God puts our obedience to the test. When all goes well according to the flesh, it is not difficult for us to yield to his will and to recognize his goodness and love towards us. But when he visits us with sickness, poverty, reproach, or some other misery, it is then true obedience to feel that he loves us, to embrace his divine guidance, and to submit to his will. …

How shabbily we treat this one, true, and heavenly Father when in days of oppression we fail to hallow his name, to conform our will to his, and to confess that all things proceed from his goodness and love – all of which serves his praise as well as our salvation.

So we see how in the school of we learn what it actually means to be obedient to God. We need this education. For as Jesus Christ, even though he was God’s Son, nevertheless “learned obedience from what he suffered” (Heb. 5:8), how much more necessary it is for us in days of persecution to learn to submit our heads and our hearts to God’s leading.</p></blockquote>

</figure><figure class="quote" id="q-4e020f04d7" data-kw="">
<blockquote><p>It cannot be concluded that sufferings are not for God, because those who profess themselves to be the people of God are the instruments of them; or that it is not the cross of Christ which is borne, because it is laid on by those who profess Christ. Abel is called the protomartyr, the first sufferer for God; and he suffered by the hand of one who worshipped the same God, with the same kind of worship: both Abel and his persecutor offered sacrifice. Isaac suffered by Ishmael, Gal. iv. 29; yet Ishmael was Abraham’s son, and by him circumcised, and so admitted to the church and its privileges.

Who were those that persecuted the prophets of old, but they who professed themselves to be the peculiar people, and true worshippers of the true God? Jerusalem, the chosen city, killed the prophets, and stoned God’s messengers, Mat. xxiii. 37. Amongst this people, though there was no other people that owned the true God in the world, some persecutors were found in every generation. Even when they utterly disclaimed this, as thinking themselves far enough from being persecutors, yet then are they charged with this guilt by Christ himself, ver. 30, 31. Christ himself suffered by those who took themselves peculiarly to be the people of God. And since the profession of Christ became general, ordinarily a man’s enemies are those of his own house. The bitterest persecutors are those of the same profession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Taking up the Cross in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>

="perma" href="../quote/4e020f04d7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/03/03/david-clarkson-on-christians-suffering-at-the-hands-of-the-professing-people-of-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-7be8fd49ca" data-kw="">
<blockquote><p>It cannot be concluded, they do not suffer for Christ, who have some sin mixed with that which is made the cause of their sufferings, if it be the cause of God indeed, for the substance of it, and they sincere in it for the main. When the people of God are ready to offer up themselves, and what they have for him, he will not reject such a sacrifice for every blemish. Christ had something against the church of Ephesus, something to charge her with as matter of provocation, even when he is speaking of her sufferings, Rev. ii. 4. And yet he owns her as one that had suffered and laboured for his name’s sake, verse 3.

Nor can this be concluded, because of some miscarriage under their sufferings. David, while he was persecuted by Saul, miscarried divers ways, as you may see 1 Sam. xxi. 2, 12, 13, and elsewhere; yet this did not hinder him from being a sufferer for righteousness.

As the Lord has provided a way, that what his people do for him may be accepted as done for him, though there be too many sinful mixtures therein, so he has provided an expedient, that what they suffer for him may be accepted as suffered for him, though there be many flaws therein, both for matter and manner. The Lord Jesus, the advocate of and sacrifice for his people, is effectual for both. When they apply themselves to him, in the exercise of faith and repentance, through his mediation, that which is therein evil shall not be remembered, that which is good therein will be accepted, Rom. xii. 1. How acceptable, see Eph. i. 6, 7.

Licinius, as you may read, Eusebius De vita Constantini, makes an edict, that whosoever did relieve the imprisoned and distressed Christians should suffer the same things that were inflicted upon them. Now, suppose some, out of love to Christ and his afflicted members, should have ventured (as many did indeed) to have relieved them, and yet should have done it too sparingly, or too fearfully, or with some selfish reflections, and should, according to the edict, have suffered for relieving them, here had been some sin mixed with the cause of their sufferings. And yet in this case, since their cause was good, and the cause of Christ, for the substance of it, who would deny but they suffered for Christ?

Or suppose one should suffer because he would not leave praying (which was Daniel’s case, Dan. 6), and yet in his prayer should have some mixture of unbelief, and lukewarmness, and other distempers, which the best cannot always escape, here would be some sin mixed with the cause of sufferings; yet who would deny but that, suffering for doing his duty, he is a sufferer for God?

To proceed a little further: suppose some godly Lutherans should suffer for those great truths of the gospel, which they maintain against the papists, and together with them should suffer for consubstantiation, which indeed is an error, here would be a sin mixed with the cause of their suffering; yet I suppose their laying down their lives for those other great truths of Christ, notwithstanding this sinful mixture, would be accounted a suffering for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Taking up the Cross in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-182cbf89de" data-kw="">
<blockquote><p>And here also we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical; [1.] Circumstances merely physical are such adjuncts of divine worship as are common and inseparable concomitants of both civil, natural, and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof… All these are common concomitants of civil, natural, and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep; or civil, to declaim an oration before the people; or religious, to preach or pray, must be done… in some time, in some place… for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse… 2. Some circumstances are merely moral, for as divines distinguish time and place; in time as time, and as such a religious time, the Lord’s Sabbath, Tempus, &amp; tempus ut sic [time, and a time so thus], and place as place, or such a religious place, Locus, &amp; locus ut sic. [a place, and a place so thus]. So we may distinguish here between circumstances in common or in gross, and such and such circumstances; As time is a common adjunct of divine worship: But such a time, to wit, the Lord’s Day is both the time of worship, and worship itself [in observing it]. So there is place of worship, and there is such a religious place, [in the Old Testament,] the holy of holiest, the Temple. A habit [garment] is a mere accident of worship; the person, John or Thomas, is also an accident; but if God command such an ephod as Aaron and the priests were to wear, this is not a mere [physical] circumstance [rather it is a moral circumstance because of its religious appointment]… And therefore these circumstances, taken in common and their universal nature, are merely physical circumstances; but taken in their particular and determinate restrictions, as such circumstances, they may be merely moral circumstances, such as are the common adjunct of the time of worship, the place, and the Sabbath time and the Temple for Jewish Worship. The former [two] are circumstances merely physical, the latter [two are] merely moral;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), p.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-129532c924" data-kw="">
<blockquote><p>‘Such things’ (says Aaron) ‘have befallen me, and if I had eaten the sin-offering to day, should it have been good in the eyes of the Lord?’ [Lev. 10:19] In these words Aaron excuses himself, by reason of his sorrow, which made him unfit and unworthy to eat of those holy things. Dt. 12:7 &amp; 26:14; Hos. 9:4. The [Romanist] Douay divines, somewhat to the same purpose: ‘Natural grief of mind made Aaron both unwilling to eat, and less apt to complete all the ceremonies: so without sin he omitted that pertained to his own commodity, offering it unto God.’ The Geneva notes, ‘Moses bare with his infirmity, considering his great sorrow, but does not leave an example to forgive them that maliciously transgress the commandment of God.’… The conclusions from this text of Scripture may be such as these, that oftentimes the letter of the Law gives place to great necessities…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists in Amsterdam</cite>, … (London: R.B., 1642), ch. 1, section 4, p. 52</span></figcaption>

%20necessities" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>3. Labour or pains for the enjoyment of the benefit and advantage of the solemn assemblies of the church, and in them of the appointed worship of God, is so far from entrenching on the rest of this day that it belongs unto its due observance. A mere bodily rest is no part of religious worship in itself; nor does it belong unto the sanctification of this day any farther than as it is a means for the due performance of the other duties belonging to it. We have no bounds under the gospel for a Sabbath-day’s journey, provided it be for Sabbath ends. In brief, all pains or labour that our station and condition in this world, that our troubles which may befall us, or any thing else, make necessary, as that without which we cannot enjoy the solemn ends and uses of this holy day of rest, are no way inconsistent with the due observance of it. It may be the lot of one man to take so much pains and to travel so far for, and in the due celebration of the Lord’s day, as if another should do the like without his occasions and circumstances, it would be a profanation of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, (d. 1683), vol. 1 (of 4), p. 749</span></figcaption>

<blockquote><p>…let our rest and confidence be only in Christ, and to such as take Him for their rest, his work is but recreation, and so indeed we should esteem it in a spiritual sense; not looking upon it as a sour task, or a rigid exaction, but calling the Sabbath a delight, we should keep it accordingly, even the whole day, with the whole man, as a day of delights to the Lord, being transported beyond flesh and the world, and having our conversation in heaven, as much as is possible for creatures clothed with flesh.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-cd1ba51847" data-kw="">
<blockquote><p>The conclusion of universal atonement is that “Christ only secured for God the possibility of entering into a covenant of grace with us… if we believe. The most significant part of the work of salvation, that which really effects salvation, is still left for us to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, Vol. 3: Sin and Salvation in Christ, trans. John Bolt and John Vriend (Baker Academic, 2006), 468 (HT: Christian Bland)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-744bc248cd" data-kw="">
<blockquote><p>The truth is, we deny that Christ died for all, in as much as he died not to procure the grace of faith and regeneration for all, but only for Gods elect; and consequently neither shall any but God’s elect have any such interest in Christ’s death, as to obtain thereby pardon of sin and salvation, for Arminians themselves confess that this is the portion only of believers. But seeing pardon of sin and salvation are benefits merited by Christ, not to be conferred absolutely but conditionally, to wit, upon condition of faith; we may be bold to say that Christ in some sense died for all and every one, that is, he died to procure remission of sins and salvation unto all and every one in case they believe; and as this is true, so may we well say, and the Council of Dort might well say, that every one who hears the Gospel is bound to believe that Christ died for him in this sense, namely, to obtain salvation for him in case he believe. But what think Arminians; are we bound to believe that Christ died for us in such a sense, as to purchase faith and regeneration for us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Synod of Dort &amp; Arles Reduced to the Practice… (Amsterdam, 1631), 3rd Part | 3rd Section</cite>, p. 165</span></figcaption>

</figure><figure class="quote" id="q-39e6c20b73" data-kw="">
<blockquote><p>If the idea of a real succession in time between the parts of the divine decree be relinquished, as it must be; then this scheme is perfectly illusory, in representing God as decreeing to send Christ to provide a redemption to be offered to all, on condition of faith, and this out of His general compassion. For if He foresees the certain rejection of all at the time, and at the same time purposes sovereignly to withhold the grace which would work faith in the soul, from some, this scheme of election really makes Christ to be related, in God’s purpose, to the non-elect, no more closely nor beneficially than the stricter Calvinistic scheme. But second and chiefly, it represents Christ as not purchasing for His people the grace of effectual calling, by which they are persuaded and enabled to embrace redemption. But God’s purpose to confer this is represented as disconnected with Christ and His purchase, and subsequent, in order, to His work, and the foresight of its rejection by sinners. Whereas Scripture represents that this gift, along with all other graces of redemption, is given us in Christ, having been purchased for His people by Him (Eph. 1:3; Phil. 1:29; Heb. 12:2)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-l-dabney.html">R. L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology (Great Britain: Banner, rep. 1985)</cite>, pp. 235-236</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

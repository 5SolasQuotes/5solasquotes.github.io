<main class="wrap"><figure class="quote" id="q-8d44529ae1" data-kw="">
<blockquote><p>Some laws expire by limitation. Such are many of the laws of every country. Such were many of the laws given by Moses. They were in force until Christ, who was their end, came; and then they bound no longer. Thus the whole ceremonial law ceased to bind after the death of Christ, to which it was limited. But no limit was fixed to the observance of the fourth commandment, either when first given or afterwards.

A competent authority may repeal a law, and thus its obliging power may cease. Every free government affords numerous instances of the repeal of laws once useful, but no longer so. In a regular government, the repeal must be passed by the power which enacts the law. The great Lawgiver of the world is God. He ordained the law of the Sabbath, and he has never repealed it. Is any evidence of such repeal found in Scripture? If so, where is the book, the chapter, the verse containing it? All admit that the law was in force until Christ. Christ did not repeal it, for he says so. Matt. 5:17; nor did the apostles anywhere declare that it was repealed. If this law, therefore, has ceased to bind, it must be in some way utterly unknown to us. It is still practicable; it has not expired by limitation; it has not been repealed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-swan-plumer.html">William Swan Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Law of the Sabbath Still Binding, and What it Forbids in Tracts of American Tract Society. General Series</cite>, vol. VI, no. 187 (New York, n.d.), pp 2-3.</span></figcaption>

</figure><figure class="quote" id="q-c5ccf6e3fb" data-kw="">
<blockquote><p>THE Judicial Law which God gave to Israel by the hand of Moses, had the Law of the Sabbath inserted into it This forensic or judicial Law was for the Civil Government of that People of God, and contained a Body or System of Laws to be observed by the Magistrates and Rulers, for the good order and peaceable and quiet living of the people, in all Godliness and honesty. These Judgments Moses began to set before them, by order from God, presently after the delivery of the moral Law or ten Commandments. You have a great part of them in the 21, 22, and 23. Chapters of Exodus: And at the 12. verse of the 23. Chapter you find an abstract of the fourth Commandment, inserted thus,—Six days shalt thou do thy work, and on the seventh day thou shalt rest, that thine ox and thine ass may rest, and that the Son of thy handmaid and the stranger may be refreshed.

Here, as I take it, the fourth Commandment was made a Law of the State to Israel, whose Legislature was properly a Theocracy, and their Rulers and Magistrates had the Executive power and trust committed to them. And doubtless God thus honoured the Law of the Sabbath to Israel his people, by inserting it in the Body of their Judicial Laws, to teach civil Governments to do the like in all parts and ages of the World, to whom the knowledge thereof should come. And accordingly the good Government over us have in their wisdom and piety Enacted the strict Sanctification of the Lord’s day, and have forbid the profanation of it under such and such penalties; wherein they have but done the part of a Christian Government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-colman.html">Benjamin Colman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The doctrine and law of the Holy Sabbath: in the order wherein it lies through the Scriptures of the Old and New Testament. In two sermons, preached at the lecture in Boston, October 15. and December 10. 1724</cite>, (Boston: Thomas Hancock, 1725), pp 9-10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>2. Paul’s traditions which he delivered, were either concerning matters of doctrine and faith, which are perpetual, and they be all expressed in the Scriptures, or else of ceremonies which are mutable by authority of the church, according to time, places, and persons, observing the general rules prescribed by the Apostle, that all things be done in order and comeliness, and to edification. … 16. Paul saith, the apostles and church have no such custom to be contentious. Chrysostom, homily 27, in Epistle X. Cor. for matters of external order, yet does he give reasons for that order of covering women’s heads. By whose example the preachers are likewise to endeavour to satisfy by reason both men and women, that hurnbly desire their resolution for quiet of their conscience, and not to beat them down with the club of custom only. For so the apostle does not.</p></blockquote>

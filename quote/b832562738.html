<main class="wrap"><figure class="quote" id="q-b832562738" data-kw="">
<blockquote><p>What holy invectives does Paul in his epistles make against superstitious worship? Yet how few are the men that mind the pure instituted worship of God, that would have the fountains of Israel without the mixture of any mud in them? Outward oppressions in Popery were nothing so heavy upon the godly as the corrupt mixtures in God’s worship; but if you observe the general disposition of men, they are wholly carried out to some sensible superstitious ways of worship. They love not the simplicity and purity of God’s worship. It is great proficiency in Christianity not to have our minds corrupted herein. As children delight in babies, so do men [delight] in some worships of their own that they have made. What is Popery but a mere stage-play in the worship of God? And if you ask of hundreds of ceremonies they have: ‘Whose image and superscription is upon them?’ You shall find none of God’s imprinted on them. There were the statutes of the heathens (Lev. 20) and these the people must not go in (Eze. 20). There are statutes of our fathers we must not walk in: Oh there is too much of this superstition still in men! Men by false worship manifest they have not spiritual hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining… (London, 1652) | section 11, sermon 95</cite>, pp. 563-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-86b4e8dccd" data-kw="">
<blockquote><p>2. There are many parts of God’s worship which are not essential, yet such as will not suffer any addition of the Church. For proof whereof, I demand, were all the ceremonies commanded to be used in the legal sacraments and sacrifices, essential parts of those worships? No man will say so. Yet the synagogue was tied to observe those (and no other than those) ceremonies which the Word prescribed. When Israel was again to keep the Passover, it was said; In the fourteenth day of this month at even, ye shall keep it in his appointed season: according to all the rites of it and according to all the ceremonies of it, shall ye keep it. And again: ‘According to all that the Lord commanded Moses, so did the Children of Israel.’ Ritibus et ceremoniis divinitus institutis, non licuit homini suo arbitrio aliquid adijcere aut detrahere, says Peter Martyr. 3. If those accidentary parts of worship which are commanded in the Word be both necessary to be used necessitatè praecepti [by the necessity of precept], and likewise sufficient means fully adequate and proportioned to that end, for which God has destinated such parts of his worship as are not essential (which must be granted by everyone who will not accuse the Scripture of some defect and imperfection: then it follows that other accidentary parts of worship which the Church adds thereto are but superfluous and superstitious.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637), pt. 3, ch. 7</cite>, pp. 120-21</span></figcaption>

</figure><figure class="quote" id="q-9490e704dd" data-kw="">
<blockquote><p>It’s [the light of nature is] altogether insufficient to prescribe or set down any worship of God. Hence God does so often forbid us to walk after our own imaginations and to do that which we shall choose. The apostle calls it will-worship, when a man’s will is the mere cause of it. Now, it’s true, men are more apt to admire this, as we see in the Pharisees and Papists; they dote upon their traditions more then God’s institutions… It’s true indeed, even in worship, light of Nature and prudence is instrumentally required to order the institutions of God; but as reason may not make a new article of faith, so neither a new part of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or, A Vindication of the Moral Law &amp; the Covenants… (London, 1647), Lecture 7</cite>, pp. 74</span></figcaption>

</figure><figure class="quote" id="q-1224286efb" data-kw="">
<blockquote><p>Hence arises a manifold difference between the moral law and others [ceremonial and judicial] both in origin (because the moral is founded upon natural right and on this account is known by nature; but the others upon positive right and on this account are from free revelation) and in duration. The former is immutable and eternal; the latter mutable and temporary. In regard to object, the one is universal embracing all; the others particular applying only to the Jews… In regard to use, the moral is the end of the others, while the others are subservient to the moral.</p></blockquote>

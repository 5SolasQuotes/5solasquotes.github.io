<blockquote><p>V. The Romanists hold original righteousness to be a supernatural gift, super-added to the native gifts and powers of the entire man. [Robert] Bellarmine explains the reason why they determine this to be so. There was in man naturally a contest between the flesh and the spirit, the reason and the appetite [lower desirous part], from which flowed a certain disease and languor of nature, arising from the condition of the material. Therefore God added original righteousness as a ‘golden bridle,’ to repress that conflict and to cover like a precious garment their nakedness, and as a remedy to heal that weakness (‘De gratia primi hominis,’ 5, 6 in Opera [1858], 4:23-29) This is the more common opinion among them, although the Jansenists and others exclaim loudly against it. Whence arose this expression of the [Medieval] Scholastics: ‘Naturals remained untouched, but the supernaturals only were lost.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Reformed View</cite>, The Common View of Romanism, p. 471</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/man/image-of-god.html">Image of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4519cc270d" data-kw="">
<blockquote><p>The intellect is that power by which we are able to entertain concepts, to affirm the truth or falsity of propositions, and to assess the cogency of arguments… A further distinction traditionally drawn in Aristotelian-Thomistic philosophy is that between the external senses and the internal senses, both of which are typically possessed by sentient organisms. The external senses are the familiar ones: sight, hearing, taste, smell, and touch… The internal senses are the synthetic sense, instinct, the imagination, and sensory imagery. Some of the jargon may be unfamiliar, but the capacities it refers to are not. The synthetic sense is what unifies the deliverances of the five external senses into a coherent conscious experience… Instinct is also known as the ‘estimative power,’… the capacity of an organism to apprehend something sensed as either beneficial or harmful, and to be inclined, accordingly, either to pursue it or to avoid it… The imagination, in the sense we are concerned with, is the capacity to form images… understood as copies of what we experience in sensation… Sensory memory retains what is known via instinct or the estimative power, just as imagination retains what is sensed… It is not terribly controversial that sentient organisms possess something like the capacities just described… …a dog can see a triangle, but it does not conceptualize it as a closed plane figure with three straight sides… For that reason, it does not entertain propositions about triangles or human beings, much less reason from one proposition to other propositions. But a dog can do things like instinctively estimate the piece of food a particular human being is holding out to it as desirable, and thus be inclined to approach it. It can have images of sights, odors, tastes and the like that it has experienced in the past triggered in its consciousness. It can by virtue of such experience come to associate a certain human being with food, and thereby be moved in future to seek that human being out. Of course, human beings… do conceptualize the deliverances of these senses.</p></blockquote>

<blockquote><p>V. Next, we must examine those aspects that primarily and chiefly pertain here (πρώτως καὶ κυρίως, “primarily and chiefly”): namely, the infused and inherent habits (habitus infusi &amp; concreati), for considering only acquired habits, as the Socinians and Remonstrants do, is sheer nonsense. These habits perfected and adorned these faculties excellently, such as the clarity and rectitude of the mind, not only regarding that innate (ὑπάρχον) aspect of the divine (τὸ τοῦ θεοῦ), whether it is innate through common notions (κοιναὶ ἐννοίαι) and the subjective light of the mind, or acquired through the objective light of being, as Socinus vainly objects (Romans 1; Isaiah 40; Psalm 19; Acts 14; Romans 2). But as a supernatural good, spiritual and religious, man knew God, His revealed will, and found his supreme happiness therein with perfect accuracy… We do not, however, regard this Original Righteousness as something substantial, as Osiander does, nor do we consider it a supernatural addition extrinsically added to the first nature in its pure natural state, as the Roman Catholics do. Instead, we deem it natural or connatural; otherwise, God would have commanded man to fulfill His law by his own strength in vain. This is further confirmed by the fact that, as it was to be propagated because it was natural, so reciprocally it was to be propagated by divine grace (Genesis 1:28, 1 Corinthians 15:48). What pertains to the supernatural, as such, cannot be sought in vain. However, we can easily accept calling it supernatural insofar as it did not flow from the essential principles of human nature but was infused by the grace of God as a moral good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-essenius.html">Andreas Essenius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Disputation on the Image of God in Man’ Download</cite>, tr. Jonathan Tomes (Utrecht: Johannes Waesberg, 1653) Latin</span></figcaption>

<blockquote><p>But a great question here does justly offer itself, whether man might not eat flesh at the first, but herbs, seeds and fruits only. And because the other creatures are confined to herbs and seeds, whether such of them as live now upon flesh, were otherwise sustained then, as lions, beares, wolves, etc. Touching either of these diverse expositours are of diverse opinions. Some think that although herbs and seeds and fruits only are named, when man’s food is appointed unto him, yet for so much as flesh is not forbidden, and a dominion over the creatures to use them, as he thought good, was given unto him, he might at his pleasure make food of that also. And they argue from this that sacrifices were to be made of the creatures, some part of which was to be eaten, and likewise that they were to be killed, that they might have their skins for clothing, wherefore it is most probable that they ate their flesh. So that God in appointing these things to be eaten, did but appoint their ordinary food, there being a liberty to use flesh for food also, when man should think good. But others hold that seeds and herbs and fruits were mans only food till the Flood, because none but these are mentioned and an express allowance is given to eat flesh after the flood, as these things. Thus the Fathers generally, and most new writers of all sorts. And it seems to have been an ancient received opinion, by that which old poets have left written, as Boethius. The former age was content with the faithful fields, and satified their hunger with the acorn, when they had fasted long. And Ovid: Men were content with meat growing without forcing, they gathered the fruits growing in mountainous places and those that grow upon thorns, etc. (bk. 1, Metamor.) And it stands with good reason that man should feed then only upon such things, they being such as might well suffice nature, and most pleasant at the first, and men’s bodies being strong and healthful, and this was a most simple diet, and so most fit to be appointed at the first to rebuke the luxury of after times. Some also yield this for a reason, that man not being used to the shedding of blood might be better preserved from murder. But this reason is weak, because beasts were killed for sacrifice, and to have their skins for apparel, and therefore Cain, the very first man born into the world, fell into this damnable sin of murder. The reasons before rendered therefore are best, and that the creatures not being killed up at the first, might the better be multiplied upon the earth. After the flood men’s bodies grew weaker, and it is generally thought that neither herbs nor waters were so wholesome as before, but more corrupt through that deluge, and therefore flesh was now allowed to be eaten; and whereas waters were their only drink before, vines were now planted that they might have wine for their infirmity. Yet it is not to be doubted but that Noah and his sons did forbear the killing of beasts to eat for a time, that their increase might not be hindered. Calvin thinks it best to suspend and not to determine this question. Touching beasts, that now live upon flesh, some also think that they did so at the first, because the nature of a creature is always the same, and that when God assigned herbs and seeds for the beasts to feed upon, He meant not all beasts. But this is contrary to the text, speaking of all, wherein was the breath of life, and howsoever creatures never alter from their specifical nature, yet they may alter from their individual [nature], using such food at one time, as they used not at another, as children, who at the first are nourished with milk, and eat no solid meat, yet afterwards they eat it. Others therefore more probably hold, that even those beasts that since have lived upon flesh, and birds also, lived then all upon seeds and herbs, and that this discord and malignity of nature came upon them afterwards, since the Flood, one bearing a kind of hatred to another and so preying upon it and tearing and eating the flesh thereof. And this opinion has both the present text plainly for it and even at the time of the Flood it must needs be yielded to have been so, because all sorts of creatures earthly living with Noah in the ark, were susteined without eating flesh, for otherwise their number, being so few of each kind taken in, would not have sufficed, see also for this Isa. 11:7 and 65:25.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“But a great question here does justly offer itself, whether man might not eat flesh at the first, but herbs, seeds and fruits only. And because the other creatures are confined to herbs and seeds, whether such of them as live now upon flesh, were otherwise sustained then, as lions, beares, wolves, etc. Touching either of these diverse expositours are of diverse opinions. Some think that although herbs and seeds and fruits only are named, when man’s food is appointed unto him, yet for so much as flesh is not forbidden, and a dominion over the creatures to use them, as he thought good, was given unto him, he might at his pleasure make food of that also. And they argue from this that sacrifices were to be made of the creatures, some part of which was to be eaten, and likewise that they were to be killed, that they might have their skins for clothing, wherefore it is most probable that they ate their flesh. So that God in appointing these things to be eaten, did but appoint their ordinary food, there being a liberty to use flesh for food also, when man should think good. But others hold that seeds and herbs and fruits were mans only food till the Flood, because none but these are mentioned and an express allowance is given to eat flesh after the flood, as these things. Thus the Fathers generally, and most new writers of all sorts. And it seems to have been an ancient received opinion, by that which old poets have left written, as Boethius. The former age was content with the faithful fields, and satified their hunger with the acorn, when they had fasted long. And Ovid: Men were content with meat growing without forcing, they gathered the fruits growing in mountainous places and those that grow upon thorns, etc. (bk. 1, Metamor.) And it stands with good reason that man should feed then only upon such things, they being such as might well suffice nature, and most pleasant at the first, and men’s bodies being strong and healthful, and this was a most simple diet, and so most fit to be appointed at the first to rebuke the luxury of after times. Some also yield this for a reason, that man not being used to the shedding of blood might be better preserved from murder. But this reason is weak, because beasts were killed for sacrifice, and to have their skins for apparel, and therefore Cain, the very first man born into the world, fell into this damnable sin of murder. The reasons before rendered therefore are best, and that the creatures not being killed up at the first, might the better be multiplied upon the earth. After the flood men’s bodies grew weaker, and it is generally thought that neither herbs nor waters were so wholesome as before, but more corrupt through that deluge, and therefore flesh was now allowed to be eaten; and whereas waters were their only drink before, vines were now planted that they might have wine for their infirmity. Yet it is not to be doubted but that Noah and his sons did forbear the killing of beasts to eat for a time, that their increase might not be hindered. Calvin thinks it best to suspend and not to determine this question. Touching beasts, that now live upon flesh, some also think that they did so at the first, because the nature of a creature is always the same, and that when God assigned herbs and seeds for the beasts to feed upon, He meant not all beasts. But this is contrary to the text, speaking of all, wherein was the breath of life, and howsoever creatures never alter from their specifical nature, yet they may alter from their individual [nature], using such food at one time, as they used not at another, as children, who at the first are nourished with milk, and eat no solid meat, yet afterwards they eat it. Others therefore more probably hold, that even those beasts that since have lived upon flesh, and birds also, lived then all upon seeds and herbs, and that this discord and malignity of nature came upon them afterwards, since the Flood, one bearing a kind of hatred to another and so preying upon it and tearing and eating the flesh thereof. And this opinion has both the present text plainly for it and even at the time of the Flood it must needs be yielded to have been so, because all sorts of creatures earthly living with Noah in the ark, were susteined without eating flesh, for otherwise their number, being so few of each kind taken in, would not have sufficed, see also for this Isa. 11:7 and 65:25.”

— John Mayer, A Commentary upon the Whole Old Testament (1627; 1653), on Genesis, ch. 1, pp. 27-28">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+a+great+question+here+does+justly+offer+itself%2C+whether+man+might+not+eat+flesh+at+the+first%2C+but+herbs%2C+seeds+and+fruits+only.+And+because+the+other+creatures+are+confined+to+herbs+and+seeds%2C+whether+such+of+them+as+live+now+upon+flesh%2C+were+otherwise+sustained+then%2C+as+lions%2C+beares%2C+wolves%2C+etc.+Touching+either+of+these+diverse+expositours+are+of+diverse+opinions.+Some+think+that+although+herbs+and+seeds+and+fruits+only+are+named%2C+when+man%E2%80%99s+food+is+appointed+unto+him%2C+yet+for+so+much+as+flesh+is+not+forbidden%2C+and+a+dominion+over+the+creatures+to+use+them%2C+as+he+thought+good%2C+was+given+unto+him%2C+he+might+at+his+pleasure+make+food+of+that+also.+And+they+argue+from+this+that+sacrifices+were+to+be+made+of+the+creatures%2C+some+part+of+which+was+to+be+eaten%2C+and+likewise+that+they+were+to+be+killed%2C+that+they+might+have+their+skins+for+clothing%2C+wherefore+it+is+most+probable+that+they+ate+their+flesh.+So+that+God+in+appointing+these+things+to+be+eaten%2C+did+but+appoint+their+ordinary+food%2C+there+being+a+liberty+to+use+flesh+for+food+also%2C+when+man+should+think+good.+But+others+hold+that+seeds+and+herbs+and+fruits+were+mans+only+food+till+the+Flood%2C+because+none+but+these+are+mentioned+and+an+express+allowance+is+given+to+eat+flesh+after+the+flood%2C+as+these+things.+Thus+the+Fathers+generally%2C+and+most+new+writers+of+all+sorts.+And+it+seems+to+have+been+an+ancient+received+opinion%2C+by+that+which+old+poets+have+left+written%2C+as+Boethius.+The+former+age+was+content+with+the+faithful+fields%2C+and+satified+their+hunger+with+the+acorn%2C+when+they+had+fasted+long.+And+Ovid%3A+Men+were+content+with+meat+growing+without+forcing%2C+they+gathered+the+fruits+growing+in+mountainous+places+and+those+that+grow+upon+thorns%2C+etc.+%28bk.+1%2C+Metamor.%29+And+it+stands+with+good+reason+that+man+should+feed+then+only+upon+such+things%2C+they+being+such+as+might+well+suffice+nature%2C+and+most+pleasant+at+the+first%2C+and+men%E2%80%99s+bodies+being+strong+and+healthful%2C+and+this+was+a+most+simple+diet%2C+and+so+most+fit+to+be+appointed+at+the+first+to+rebuke+the+luxury+of+after+times.+Some+also+yield+this+for+a+reason%2C+that+man+not+being+used+to+the+shedding+of+blood+might+be+better+preserved+from+murder.+But+this+reason+is+weak%2C+because+beasts+were+killed+for+sacrifice%2C+and+to+have+their+skins+for+apparel%2C+and+therefore+Cain%2C+the+very+first+man+born+into+the+world%2C+fell+into+this+damnable+sin+of+murder.+The+reasons+before+rendered+therefore+are+best%2C+and+that+the+creatures+not+being+killed+up+at+the+first%2C+might+the+better+be+multiplied+upon+the+earth.+After+the+flood+men%E2%80%99s+bodies+grew+weaker%2C+and+it+is+generally+thought+that+neither+herbs+nor+waters+were+so+wholesome+as+before%2C+but+more+corrupt+through+that+deluge%2C+and+therefore+flesh+was+now+allowed+to+be+eaten%3B+and+whereas+waters+were+their+only+drink+before%2C+vines+were+now+planted+that+they+might+have+wine+for+their+infirmity.+Yet+it+is+not+to+be+doubted+but+that+Noah+and+his+sons+did+forbear+the+killing+of+beasts+to+eat+for+a+time%2C+that+their+increase+might+not+be+hindered.+Calvin+thinks+it+best+to+suspend+and+not+to+determine+this+question.+Touching+beasts%2C+that+now+live+upon+flesh%2C+some+also+think+that+they+did+so+at+the+first%2C+because+the+nature+of+a+creature+is+always+the+same%2C+and+that+when+God+assigned+herbs+and+seeds+for+the+beasts+to+feed+upon%2C+He+meant+not+all+beasts.+But+this+is+contrary+to+the+text%2C+speaking+of+all%2C+wherein+was+the+breath+of+life%2C+and+howsoever+creatures+never+alter+from+their+specifical+nature%2C+yet+they+may+alter+from+their+individual+%5Bnature%5D%2C+using+such+food+at+one+time%2C+as+they+used+not+at+another%2C+as+children%2C+who+at+the+first+are+nourished+with+milk%2C+and+eat+no+solid+meat%2C+yet+afterwards+they+eat+it.+Others+therefore+more+probably+hold%2C+that+even+those+beasts+that+since+have+lived+upon+flesh%2C+and+birds+also%2C+lived+then+all+upon+seeds+and+herbs%2C+and+that+this+discord+and+malignity+of+nature+came+upon+them+afterwards%2C+since+the+Flood%2C+one+bearing+a+kind+of+hatred+to+another+and+so+preying+upon+it+and+tearing+and+eating+the+flesh+thereof.+And+this+opinion+has+both+the+present+text+plainly+for+it+and+even+at+the+time+of+the+Flood+it+must+needs+be+yielded+to+have+been+so%2C+because+all+sorts+of+creatures+earthly+living+with+Noah+in+the+ark%2C+were+susteined+without+eating+flesh%2C+for+otherwise+their+number%2C+being+so+few+of+each+kind+taken+in%2C+would+not+have+sufficed%2C+see+also+for+this+Isa.+11%3A7+and+65%3A25.%E2%80%9D%0A%0A%E2%80%94+John+Mayer%2C+A+Commentary+upon+the+Whole+Old+Testament+%281627%3B+1653%29%2C+on+Genesis%2C+ch.+1%2C+pp.+27-28&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcdb094eedf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cdb094eedf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-mans-original-state-in-righteousness/#:~:text=But%20a%20great%20question%20here%20does,for%20this%20Isa.%2011%3A7%20and%2065%3A25&amp;text=But%20a%20great%20question%20here%20does%20justly%20offer&amp;text=see%20also%20for%20this%20Isa.%2011%3A7%20and%2065%3A25" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>All these principles are the principles of our natural intelligence. They are first manifested in that spontaneous form of intelligence which we call common sense, that is, the natural aptitude of intelligence, before all philosophic culture, to judge things sanely. Common sense, natural reason, seizes these self-evident principles from its notion of intelligible reality. But this natural common sense could not yet give these principles an exact and universal formulation.</p></blockquote>

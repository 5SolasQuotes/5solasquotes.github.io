<main class="wrap"><figure class="quote" id="q-fe6aa79128" data-kw="">
<blockquote><p>And now I shall leave to be considered by wise men these vast differences betwixt the Papists’ implicit faith and the case of our [presbyterian] Churches governed by elderships: 1. The Church assents not to that which the consistory of elders decrees or does, except it be agreeing to the Word of God, as the Reasoner [Independent writer] himself says: but there is no such limitation in the Papists’ implicit faith. 2. The consistory [local session] of elders does not press anything upon the Church imperiously, or by naked will and authority, without any reason, as the Church of Rome does with those from whom she requires implicit faith. 3. The Papists know not what those things be which they believe by implicit faith: so that such a faith is rightly called mera articulorum fidei ignorantia, a mere ignorance of the articles of faith: but the decrees of our elderships whereunto our Churches do consent are made known unto them. 4. Our Churches are, by the judgement of Christian discretion, to examine all things propounded unto them, even the decrees of the elders, whereas Papists may not examine what the Church propounds or commands. 5. Papists, by their implicit faith, believe whatsoever the Church believes because they think the Church cannot err, but our Churches conceive not only their particular elderships, but ecumenical councils, to be subject to error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the points of Ruling-Elders and of the Authority of Presbyteries and Synods</cite>, (Edinburgh, 1641), Postscript, pp. 16-18</span></figcaption>

</figure><figure class="quote" id="q-bcebeace50" data-kw="">
<blockquote><p>…turbulent spirits do not love to examine things by rule, to call things to account, but follow their own fiery humor and set upon their own will with violence: but godliness takes off men from this ruggedness and turbulency of spirit and makes them gentle and peaceable: let them be never so active, never so forward, never so zealous in any thing, yet if you will call them to examine things by rule, they will meekly and patiently hear you; yea, a child shall lead them, Isa. 11:6. And yet further; turbulent they are not, for none [are] more obedient to authority than they; none see that majesty of God in authority as they do; none obey authority out of conscience so as they do. If the will of men in authority, rather than authority, shall require anything that the authority of Heaven forbids, that they do not; because they cannot obey, for conscience sake: And so sacred do they account authority, that they would have no obedience performed to it, but obedience for conscience sake. Blind obedience the Church of God has long ago exploded as too servile for Christian spirits: this were more servile than selling men’s bodies in the market for slaves, which Christianity abhors. It were too uncharitable a conceit of Christian magistrates, to think that they should require of, or expect from any other obedience than in, and for the Lord; and in this obedience, those who are godly, are so forward…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Excellency of a Gracious Spirit</cite>, … (1639), p. 138-9</span></figcaption>

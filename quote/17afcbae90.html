<blockquote><p>21. Neither are they for stated anniversary feasts or fasts, which are sadly profaned and abused among the Romanists, for at least the superstitious unthinking vulgar make little other use of them than for rioting and raveling, sporting and gamming, and other such dissolute practices, highly unbeseeming days that pass under the character and opinion of holy-days: Yet when emergencies and dispensations of providence occur that call for public humiliation and fasting, or solemn Thanksgiving, they think it their duty to consecrate some part of their time for fasts and thanksgivings, devoutly to deprecate God’s imminent wrath, and to plead the aversion of impendent judgments due to them for their sins, or to praise God for benefits received and to beg further favors; These being such pieces of religious work which God both by his Word and providence sometimes requires. Geneva: Treatise of Fasting; Acts of the Assembly, 1645. ss: Vlt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-clark.html">James Clark</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterial Government Described, or, A Methodical Synopsis of it, as it is Professed &amp; Practiced in the Church of Scotland… (Edinburgh, 1695), no page number</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03a9544991" data-kw="">
<blockquote><p>…as Didoclavius [David Calderwood] observes (Altar of Damascus, ch. 10, p. 878), aliud est deputare, aliud dedicare, aliud sanctificare; Designation or deputation is when a man appoints a thing for such a use, still reserving power and right to put it to another use, if he please; so the Church appoints times and hours for preaching upon the week days, yet reserving power to employ those times otherwise when she shall think fit. Dedication is when a man so devotes a thing to some pious or civil use that he denudes himself of all right and title which thereafter he might claim unto it: as when a man dedicates a sum of money for the building of an exchange, a judgment-hall, etc. or a parcel of ground for a Church, a Church-yard, a glebe, a school, a hospital; he can claim no longer right to the dedicated thing. Sanctification is the setting apart of a thing for a holy or religious use in such sort that thereafter it may be put to no other use, Prov. 20:25. Now, whereas times set apart for ordinary and weekly preaching are only designed by the Church for this end and purpose, so that they are not holy, but only for the present they are applied to a holy use; neither is the worship appointed as convenient or beseeming for those times, but the times are appointed as convenient for the worship: festival days are holy both by dedication and consecration of them.</p></blockquote>

</figure><figure class="quote" id="q-fb44c0729d" data-kw="">
<blockquote><p>This one thing, however, we can scarcely refrain from mentioning, with regard to what is written in the 24th chapter of the aforesaid [Second Helvetic] Confession [of 1566] concerning the ‘festival of our Lord’s nativity, circumcision, passion, resurrection, ascension, and sending of the Holy Ghost upon his disciples,’ that these festivals at the present time obtain no place among us; for we dare not religiously celebrate any other feast-day than what the divine oracles have prescribed. Everything else, as we have said, we teach, approve, and most willingly embrace [in the Second Helvetic Confession].</p></blockquote>

</figure><figure class="quote" id="q-7241c527d9" data-kw="">
<blockquote><p>Magistrates certainly have a power to appoint public days, yea, annual days of thanksgivings, for mercies never to be forgotten. Indeed they cannot make a day holy, so as it shall be a sin against God to labor in it, or to use any pleasures (as in the case of the sabbath); but they may command the public worship of God to be performed on particular days, and men ought to attend it when with convenience they can; only they ought to take care that such days be not spent in luxury and profaneness, and that they be for signal providences, and not so multiplied, and frequently renewing, as that the service of them degenerate into mere matter of form. Whether Christ went up in order to the feast [of dedication], or because of the great concourse of people he knew would be there at that time, cannot be determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on John 10, v. 22</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

<blockquote><p>5. It is one question whether a day may be set apart for commemoration of some mystery of our religion, by men, and as a part of God’s worship. And another whether such days may be set apart for worshipping God merely as a piece of good order and policy. The first the Papists are for: the other most of our prelatists own, though some of them differ little from the Papists in this matter. 6. The question is not whether a day may be set apart occasionally for religious worship: that is, when any special providence gives occasion for fasting and humiliation or for thanksgiving and rejoicing: seeing in that case there is a special providential call to that solemn work: but whether a day may be set apart to be observed constantly and as it recurs every year. The one makes a difference between that day of the year and other days and exempts it altogether and constantly from civil use, the other does not so; the one makes a difference among days, the other makes the difference only in the works or dispensations of God which occasion such work on that day and not on another. All that the Church does in the one case, is, whereas the present providence calls to the work, as it is expressed, Isa. 22:12. The Church only determines the circumstance of time, which must be done: in the other, the Church determines more than a necessary circumstance, viz. that there shall be such a solemnity, which the Lord has not enjoined; neither do we doubt, but that the Church may appoint recurrent days for solemn worship, to wit, while the present providence that calls to such work continues. Weekly or monthly fasts may be appointed under a lasting calamity or threatening.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended… (Edinburgh: 1697), sect. 9</cite>, pp. 205-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

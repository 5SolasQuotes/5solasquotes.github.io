<blockquote><p>Ye are to be warry while ye eye these, viz. these faintings and flinchings, and unworthy declinings of ministers, that ye be not thereby drawn:

1. To a contempt of the ministry itself;

2. Into that delusion, to think that it is the only way to testify against what ye judge amiss in the minister, to cast at his ministry, to withdraw from him: Whosoever adopts this principle accordingly, has not the mind of Christ; for there are other patent and obvious ways to witness against all the evils of our ways besides these. Nay, this way of witnessing is such as Christ will witness against it as not the way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

<blockquote><p>I was a hearty Revolutioner, and a great adorer of God’s goodness to these lands in sending that great man, King William, to overthrow our enemies and redeem us from slavery. Yet the aforesaid nine grievances [on pp. 232-33] stuck close with me, and stumbled me greatly; whereupon I had thoughts to go off the country. But alas, alas! before that project was ripe, I met with some, who otherwise were good men, but they had stated a separation from church and state, after the Revolution, because of the aforesaid nine grievances, to which they added many more. I at least was overcome with their arguments, joined with them, in the inadvertent simplicity of my heart, and being influenced with a zeal not altogether according to knowlege, I continued embarked in communion with them for some time, which laid a foundation for a train of many after trials to me; for I quickly found that I was out of the frying-pan into the heart of the fire: for, though Isaw great reason for these grievances on the government side, yet, amongst the dissenters, I found many grievances, some of which were intolerable unto me…</p></blockquote>

<blockquote><p>as in the case of famous Mr. Alexander Henderson, who, at his first entry to the ministry at Leuchars, was prelatic, and by the bishop of St. Andrews brought in against the parish’s consent, so that, the day of his admission, the Church-doors being shut by the people, they were forced to break in by a window to get him entrance: But a little after, upon the report of a communion where Mr. Bruce was to help, he would needs, from a longing he had for to hear and see such a man, go secretly there, and placed himself in a dark place of the church where he might not be known. When Mr. Bruce was come to the pulpit, he did for a considerable time keep silence, as his manner was; which did some way astonish Mr. Henderson, but much more when he heard the first words wherewith he began, which were these, ‘He that comes not in by the door, but climbs up any other way, the same is a thief and a robber,’ which did, by the Lord’s blessing, at the very present take him by the heart, and had so great an impression on him, that it was the mean of his conversion.</p></blockquote>

rsion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>And to complete the dismal scene of our misery, we have had for a long time among us one of the most scandalous, pernicious and most unaccountable schisms that perhaps ever was in any age of the Church; a schism carried on by three weak men, supported by a poor people, and both are equally ignorant of the nature of union with, and separation from, a Church, and of what will justify the one or other; they cannot, in a consistency with their principles, hold communion with any Church this day on earth. We confess to our shame there are many things wrong with us, and that there are errors in the administration, against which we are, with the help of grace, still struggling and contending; and we resolve ever to plead against such corruptions: But no man of common understanding will think this national Church should be cast off, and that we should separate from her; we have a good constitution; we have a standard of doctrine without error; Westminster Confession of Faith, which we own as the confession of our faith; we have subscribed and preach the doctrine therein contained; our worship is pure, without men’s additions; our discipline and government, in their constitution, are agreeable unto, founded on, and appointed in the Word of God; and there are no sinful terms of communion imposed. As we cannot, and hope never shall, justify the measures some take, and for which they shall answer to God; so we will not despise the dust of Zion: What of the covenanted work of reformation is remaining among us, we must favor that dust, and look on it as precious, and pray and wrestle, by the help of grace, that our Lord would return to build his own House (for men have not courage to do it) and take a new infeftment[?] thereof by a cloud of his glory. There are a set of faithful ministers in this Church who are troubled for the many offenses that are given, and for laying so many stumbling blocks before the blind: And as they mourn for these in secret, so they give frequent testimony against them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

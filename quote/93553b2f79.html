<main class="wrap"><figure class="quote" id="q-93553b2f79" data-kw="">
<blockquote><p>Now, the covenant of works being broken, the justice of Jehovah, required the execution of the curse of it; in order that a covenant of grace and peace, might be established. But, if the curse had been executed upon the sinners themselves, the fire of Divine wrath, should have burned eternally on them; and after all, such a sacrifice, could never have sent forth a savour, smelling so sweetly, as to be a savour of rest to vindicative justice; because they, were not only mere creatures, whose most exquisite torments, could never have amounted to a sufficient compensation, for the injury done to the honour of infinite Majesty; but were sinful creatures too, who would still, even under their eternal sufferings, have continued to sin. The Lord Jesus, therefore, being both “equal with God,” and “separate from sinners,” did in the covenant, consent to be, in the room of his elect seed, the sacrifice, upon whom the curse of the covenant of works, might be fully executed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), p. 104.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-762291d26b" data-kw="">
<blockquote><p>How hath the Moral Law been delivered since the Fall? The Sum thereof was comprised in ten Words, (Exod. 34:28; Deut. 4:13.) commonly called the Decalogue or Ten Commandments; solemnly published and engraved in Table of Stone by God himself, (Deut. 4:14 &amp; 10:4.) Afterwards the same was more fully delivered in the Books of Holy Scripture, and so committed to the Church for all Ages, as the Royal Law for Direction of our Obedience to God our King, (James 1:8.) and for the Discovery of Sin, and the Punishment due thereto, Deut. 27:26; Rom. 1:31 &amp; 3:20. What then doth the Law now require of us? All such Duties as were required of Adam in his Innocency, (Levit. 18:5.) and all such as are required since by reason of his Fall, (Deut. 17:2–6.) binding us to eternal Death for our least defect therein. Declare now out of that which hath been said, what the Covenant of Works is? It is a Conditional Covenant between God and Man, whereby on the one side God commandeth the Perfection of Godliness and Righteousness, and promiseth that he will be our God, if we keep all his Commandments; and on the other side, Man bindeth himself to perform intire and perfect Obedience to God’s Law, by that Strength wherewith God hath indued him by the Nature of his first Creation. What was done in this Covenant on God’s part? There was his Law, backed with Promises and Threatnings; and unto them were added outward Seals. What was the Sum of this Law? Do this, and thou shalt live: If thou dost it not, thou shalt die the Death. What is meant by, Do this? Keep all my Commandments in Thought, Word, and Deed. What is meant by Life, promised to those that should keep all the Commandments? The Reward of Blessedness and Everlasting Life, Levit. 18:5; Luk. 10:28. What is meant by Death threatned to those that should transgress? In this World the Curse of God, and Death, with manifold Miseries both of Body and Soul: And (where this Curse is not taken away) Everlasting Death both of Body and Soul in the World to come, Deut. 27:26 &amp; 29:19, 20 &amp; 32:22; Levit. 26; Deut. 28. What were the outward Seals added hereunto? The two Trees, planted by God for that purpose in the midst of the Garden, Gen. 2:9 &amp; 3:3. that Adam before and in the sight of them might resort to some special place to serve God in, and might by the Sight of them be put in mind of those things whereof they were Signs and Seals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, (London: R. J.; Jonathan Robinson; A. and J. Churchill; J. Taylor; J. Wyatt, 1702), 170–71.</span></figcaption>

</figure><figure class="quote" id="q-706737c25c" data-kw="">
<blockquote><p>The Law—considered as a national covenant, by which their continued possession of the land of Canaan, and of all their privileges under the Theocracy, was left to depend on their external obedience to it,— might be called a national Covenant of Works, since their temporal welfare was suspended on the condition of their continued adherence to it; but, in that aspect of it, it had no relation to the spiritual salvation of individuals, otherwise than as this might be affected by their retaining, or forfeiting, their outward privileges and means of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification</cite>, (Oxford: Oxford University Press, 1867), 38–39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

<blockquote><p>[T]he Promise made unto Adam, and all Mankind in him, The Man that doth those things shall live, which by the Rule of Contraries implies the threatening and the Curse against all Transgressors. If she shall live who fulfils the Law, then by the contrary proportion he shall die who transgresseth it.

</figure><figure class="quote" id="q-2a9fc46282" data-kw="">
<blockquote><p>Before Adam’s fall it was not necessary for him to have Christ, because he was righteous and without sin, just as the angels have no need of Christ. If Adam had not fallen, it would not have been necessary for Christ to become our Redeemer. …The argument is true that eternal life is in the given to him who keeps the law without Christ, because whoever keeps the law is righteous. Adam would have entered into the kingdom of heaven without Christ, if he had not fallen. …The conclusion is that Adam alone kept the commandments of God before the Fall, but after the Fall and no one has truly been found who has fulfilled the law</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputatio de iustificatione</cite>, (1536) in Luther’s Works, 26.185, 187</span></figcaption>

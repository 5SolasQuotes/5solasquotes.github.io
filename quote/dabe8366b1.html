<main class="wrap"><figure class="quote" id="q-dabe8366b1" data-kw="">
<blockquote><p>Both kinds therefore of justice are contained in justification, and neither is separated from the other; and thus in the definition of justification, the merit of the blood of Christ is included with forgiveness of sins and the gift of the Holy Ghost, the Justifier and Regenerator. Concerning which gift of justice the apostle speaks in these words, ‘For if by the offence of one, etc.&#x27;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-443db5b103" data-kw="">
<blockquote><p>How have we used the mercies which are taken from us? Yea God Himself will judge us according to our works! He will not justify us, if we have been unfaithful in our little, and have been such as Satan and his instruments, the accusers of the brethren, do report us. But if we have been faithful we may expect his double justification: 1 By pardon He will justify us from our sins. 2. By plea and righteous sentence He will justify us against the false accusations of our enemies. And that’s enough. How small a thing should it seem to us, to be judged of man, who must stand or fall to the final sentence of the Almighty God?</p></blockquote>

</figure><figure class="quote" id="q-1b35431909" data-kw="">
<blockquote><p>22. This new obedience of ours, by which, so far as lies in us, we henceforth conduct ourselves in conformity to the divine law—since it is required by God himself and performed by us—according to its degree and measure is also called our righteousness; by which also, formally, inherently, habitually, or from works, we (according to our measure) are even truly said to be righteous before God, inasmuch as on its account we are regarded by God himself as righteous in part. And with respect to it, in the divine forum, we may in some way be justified (if there were need of it). (Lk. 1:6; Isa. 38:3; 1 Thess. 5:23)</p></blockquote>

</figure><figure class="quote" id="q-0ea9c90737" data-kw="">
<blockquote><p>There are four set periods of justification: First, in God’s purpose, which reaches as far as the eternal transactions between God and Christ, such as were set down in the Lamb’s book. Secondly, when Christ did in the name and stead of sinners perform that which was the matter of their justification, but in neither of these periods was the soul translated out of the state of nature into the state of grace. Thirdly, actually, at that moment when we come to own Christ as a Saviour by believing. Fourthly, when the Spirit which translates the soul out of the state of nature into the state of grace, makes it known to the soul. Others say there are five (as it were) periods or degrees of justification: 1. When the Lord passes a sentence of absolution on men at their first conversion, immediately upon their union with Christ, Acts 13:38-39. 2. He that is justified falls into daily transgressions, therefore there must be a daily imputation and application of the death of Christ, Jn. 13:10. 3. There is a high act of justification after great and eminent falls, though there be not an intercission, yet there is a sequestration, such cannot then plead their right. (A leper could not make use of his house, though he had a right to it.) David’s sin of adultery and murder made a great breach upon his justification, therefore he prays God, Ps. 51, to purge him with hyssop, to apply anew the blood of Christ. 4. There follows a certification, a sentence passed in the soul concerning man’s estate, 1 Jn. 5:9; Rom. 8:33. 5. Justification is never perfected till the Day of Judgment, Acts 3:19, then sentence is passed in open court before men and angels.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, A.M., 1654), bk. 7, ch. 6. Of Justification, p. 515</span></figcaption>

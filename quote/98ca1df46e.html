<blockquote><p>We are astonished at the man who is wholly intent on the pursuit of gain, while he neglects the salvation of his soul, “a good all price beyond.” But are none of us treading in his steps? The heart is deceitful above all things, and a covetous heart, perhaps, the most deceitful of all. On no subject do men more frequently mistake their own character.

We often see those over whom this vice reigns with the most unlimited sway, apparently as unconscious of the fact, as if their souls were baptised with the purest charity. They may even become a proverb for their covetousness without suspecting that this disposition has ever found its way into their hearts. But how is it with us? Are we so far absorbed in the world as to have neither time nor inclination to attend to the great duties of religion? Do we plead the multiplicity of our worldly cares as an excuse for neglecting the great and solemn concerns of our souls?

Then are we covetous. We indulge an inordinate desire for the good things of this world, and we are not willing to cast our care on divine providence in the humble discharge of our duty. We are not willing to seek the kingdom of God and his righteousness first of all, leaving it to the Lord to supply us with whatever is needful, according to his good promise. We tread in the steps of the rich worldling, whose heart was supremely set upon the acquisition and enjoyment of the present life.

But suppose we do not neglect the duties of religion altogether — yet if we attend to them only as our worldly interest and convenience will admit — if we subordinate them to the pursuits and acquisitions of the world, we are among the covetous, whom the Lord abhorreth. I will go farther. Suppose we are scrupulously attentive to all the external duties of religion, yet if our souls are not in them, what will it avail? If our hearts are not in heaven but on earth, are we not earthly?

The Pharisees abounded in the rites and forms of religion, while they devoured widows’ houses and gave other signs of the most deep rooted covetousness. Whoever toils chiefly for the body, not for the soul, is like the man in the parable, who hid up treasure for himself, but was not rich towards God.</p></blockquote>

<blockquote><p>Argument I. The first argument [against universal redemption] may be taken from the nature of the covenant of grace, which was established, ratified, and confirmed in and by the death of Christ; that was the testament whereof he was the testator, which was ratified in his death, and whence his blood is called “The blood of the new testament,” Matt. xxvi. 28. Neither can any effects thereof be extended beyond the compass of this covenant. But now this covenant was not made universally with all, but particularly only with some, and therefore those alone were intended in the benefits of the death of Christ.

The assumption appears from the nature of the covenant itself, described clearly, Jer. xxxi. 31, 32, “I will make a new covenant with the house of Israel, and with the house of Judah: not according to the covenant that I made with their fathers in the day that I took them by the hand to bring them out of the land of Egypt; which my covenant they brake, though I was an husband to them, saith the Lord;” — and Heb. viii. 9–11, “Not according to the covenant that I made with their fathers in the day when I took them by the hand to lead them out of the land of Egypt; because they continued not in my covenant, and I regarded them not, saith the Lord. For this is the covenant that I will make with the house of Israel after those days, saith the Lord; I will put my laws in their mind, and write them in their hearts: and I will be to them a God, and they shall be to me a people: and they shall not teach every man his neighbour, and every man his brother, saying, Know the Lord: for all shall know me, from the least to the greatest.”

Wherein, first, the condition of the covenant is not said to be required, but it is absolutely promised: “I will put my fear in their hearts.” And this is the main difference between the old covenant of works and the new one of grace, that in that the Lord did only require the fulfilling of the condition prescribed, but in this be promiseth to effect it in them himself with whom the covenant is made. And without this spiritual efficacy, the truth is, the new covenant would be as weak and unprofitable, for the end of a covenant (the bringing, of us and binding of us to God), as the old. For in what consisted the weakness and unprofitableness of the old covenant, for which God in his mercy abolished it? Was it not in this, because, by reason of sin, we were no way able to fulfil the condition thereof, “Do this, and live?” Otherwise the connection is still true, that “he that doeth these things shall live.”

And are we of ourselves any way more able to fulfil the condition of the new covenant? Is it not as easy for a man by his own strength to fulfil the whole law, as to repent and savingly believe the promise of the gospel? This, then, is one main difference of these two covenants, — that the Lord did in the old only require the condition; now, in the new, he will also effect it in all the federates, to whom this covenant is extended. And if the Lord should only exact the obedience required in the covenant of us, and not work and effect it also in us, the new covenant would be a show to increase our misery, and not a serious imparting and communicating of grace and mercy. If, then, this be the nature of the new testament, — as appears from the very words of it, and might abundantly be proved, — that the condition of the covenant should certainly, by free grace, be wrought and accomplished in all that are taken into covenant, then no more are in this covenant than in whom those conditions of it are effected.

But thus, as is apparent, it is not with all; for “all men have not faith,” — it is “of the elect of God:” therefore, it is not made with all, nor is the compass thereof to be extended beyond the remnant that are according to election. Yea, every blessing of the new covenant being certainly common, and to be communicated to all the covenantees, either faith is none of them, or all must have it, if the covenant itself be general. But some may say that it is true God promiseth to write his law in our hearts, and put his fear in our inward parts; but it is upon condition. Give me that condition, and I will yield the cause. Is it if they do believe? Nothing else can be imagined. That is, if they have the law written in their hearts (as every one that believes hath), then God promiseth to write his law in their hearts! Is this probable, friends? is it likely?

I cannot, then, be persuaded that God hath made a covenant of grace with all, especially those who never heard a word of covenant, grace, or condition of it, much less received grace for the fulfilling of the condition; without which the whole would be altogether unprofitable and useless. The covenant is made with Adam, and he is acquainted with it, Gen. iii. 15, — renewed with Noah, and not hidden from him, — again established with Abraham, accompanied with a full and rich declaration of the chief promises of it, Gen. xii.; which is most certain not to be effected towards all, as afterwards will appear. Yea, that first distinction, between the seed of the woman and the seed of the serpent is enough to overthrow the pretended universality of the covenant of grace; for who dares affirm that God entered into a covenant of grace with the seed of the serpent?

Most apparent, then, it is that the new covenant of grace, and the promises thereof, are all of them of distinguishing mercy, restrained to the people whom God did foreknow; and so not extended universally to all. Now, the blood of Jesus Christ being the blood of this covenant, and his oblation intended only for the procurement of the good things intended and promised thereby, — for he was the surety thereof, Heb. vii. 22, and of that only, — it cannot be conceived to have respect unto all, or any but only those that are intended in this covenant.</p></blockquote>

t+should+certainly%2C+by+free+grace%2C+be+wrought+and+accomplished+in+all+that+are+taken+into+covenant%2C+then+no+more+are+in+this+covenant+than+in+whom+those+conditions+of+it+are+effected.%0A%0ABut+thus%2C+as+is+apparent%2C+it+is+not+with+all%3B+for+%E2%80%9Call+men+have+not+faith%2C%E2%80%9D+%E2%80%94+it+is+%E2%80%9Cof+the+elect+of+God%3A%E2%80%9D+therefore%2C+it+is+not+made+with+all%2C+nor+is+the+compass+thereof+to+be+extended+beyond+the+remnant+that+are+according+to+election.+Yea%2C+every+blessing+of+the+new+covenant+being+certainly+common%2C+and+to+be+communicated+to+all+the+covenantees%2C+either+faith+is+none+of+them%2C+or+all+must+have+it%2C+if+the+covenant+itself+be+general.+But+some+may+say+that+it+is+true+God+promiseth+to+write+his+law+in+our+hearts%2C+and+put+his+fear+in+our+inward+parts%3B+but+it+is+upon+condition.+Give+me+that+condition%2C+and+I+will+yield+the+cause.+Is+it+if+they+do+believe%3F+Nothing+else+can+be+imagined.+That+is%2C+if+they+have+the+law+written+in+their+hearts+%28as+every+one+that+believes+hath%29%2C+then+God+promiseth+to+write+his+law+in+their+hearts%21+Is+this+probable%2C+friends%3F+is+it+likely%3F%0A%0AI+cannot%2C+then%2C+be+persuaded+that+God+hath+made+a+covenant+of+grace+with+all%2C+especially+those+who+never+heard+a+word+of+covenant%2C+grace%2C+or+condition+of+it%2C+much+less+received+grace+for+the+fulfilling+of+the+condition%3B+without+which+the+whole+would+be+altogether+unprofitable+and+useless.+The+covenant+is+made+with+Adam%2C+and+he+is+acquainted+with+it%2C+Gen.+iii.+15%2C+%E2%80%94+renewed+with+Noah%2C+and+not+hidden+from+him%2C+%E2%80%94+again+established+with+Abraham%2C+accompanied+with+a+full+and+rich+declaration+of+the+chief+promises+of+it%2C+Gen.+xii.%3B+which+is+most+certain+not+to+be+effected+towards+all%2C+as+afterwards+will+appear.+Yea%2C+that+first+distinction%2C+between+the+seed+of+the+woman+and+the+seed+of+the+serpent+is+enough+to+overthrow+the+pretended+universality+of+the+covenant+of+grace%3B+for+who+dares+affirm+that+God+entered+into+a+covenant+of+grace+with+the+seed+of+the+serpent%3F%0A%0AMost+apparent%2C+then%2C+it+is+that+the+new+covenant+of+grace%2C+and+the+promises+thereof%2C+are+all+of+them+of+distinguishing+mercy%2C+restrained+to+the+people+whom+God+did+foreknow%3B+and+so+not+extended+universally+to+all.+Now%2C+the+blood+of+Jesus+Christ+being+the+blood+of+this+covenant%2C+and+his+oblation+intended+only+for+the+procurement+of+the+good+things+intended+and+promised+thereby%2C+%E2%80%94+for+he+was+the+surety+thereof%2C+Heb.+vii.+22%2C+and+of+that+only%2C+%E2%80%94+it+cannot+be+conceived+to+have+respect+unto+all%2C+or+any+but+only+those+that+are+intended+in+this+covenant.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+Salus+Electorum%2C+Sanguis+Jesu%3A+or%2C+The+Death+of+Death+in+the+Death+of+Christ%2C+%281647%29%2C+Book+3.1+in+William+H.+Goold+%28ed.%29%2C+The+Works+of+John+Owen+%2816+vols%2C+Edinburgh%3A+Banner+of+Truth%2C+1967%29%2C+10%3A+236-38.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc0bb45a8c3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c0bb45a8c3.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/05/03/john-owen-on-the-new-covenant-of-grace-and-limited-atonement/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-4601d11d85" data-kw="">
<blockquote><p>Let this truth be fixed in the heart of every backsliding believer. The Lord restores the soul gently. The moment He discovers to it its sin, He conveys some token of His pardoning mercy; the balm is applied the moment the wound is given; the remedy is at hand the moment the distemper is discovered. There is a tenderness, an unutterable tenderness, in the heart and hand, in the mercy and the method of the Lord’s recovery of His child, which only He can feel. See it in the case of David. How did God bring his sin to remembrance? By the chastising rod? by heavy judgment? by severe expressions of displeasure? No; none of these were His messengers: but He sent a kind, tender, faithful prophet to discover to him his awful backsliding; and the astounding words, “Thou art the man,” had scarcely died away upon his ear, before he pours in this healing balm, “The Lord also hath put away thy sin, thou shalt not die.”

Oh, what gentleness, what tenderness, are thus shown in the Lord’s restorings of His wandering child! From whom could this have been expected but from Him whose nature and whose name is love—from whom, but Him who could thus speak to His backsliding Ephraim: “Is Ephraim my dear son? is he a pleasant child? for since I spoke against him, I do earnestly remember him still; therefore my bowels are troubled for him: I will surely have mercy upon him, saith the Lord.” (Jer. 31:20). This gush of tenderness towards a poor, returning, backsliding soul could only have had its dwelling-place in the heart of Jehovah.

All real return of a backsliding soul is through Jesus. Jesus is God’s great door of approach to His throne. No other entrance will conduct us to the golden scepter; no other will bring us to the holy of holies. Thus has the Holy Spirit unfolded this truth: “Having therefore, brethren, boldness to enter into the holiest by the blood of Jesus, by a new and living way, which he hath consecrated for us, through the veil, that is to say, His flesh; and having an High Priest over the house of God; let us draw near.” Oh, blessed Door of return for a poor, backsliding, heart-broken believer! A crucified Savior, in whom God is well pleased, and for whose sake He can receive the sinner, and put away his sin, can welcome the backslider, and heal his backsliding.</p></blockquote>

</figure><figure class="quote" id="q-14e906f598" data-kw="">
<blockquote><p>There is also a certain logic of interrelation of attributes in the orthodox presentation of the voluntary love of God for the world–God’s propensity to love the finite order rests on the grounding of the finite order in the goodness of God: ‘From the goodness springs the love of God, by which God is inclined towards the creature, and delights to do it good, and as it were, to unite himself with it.’ (Pictet, Theol. chr., II.vii.4; cf. Mastricht, Theoretico-practica theol., II.xvii.8; Synopsis purioris theologiae, VI.xl.) The love of God, therefore, belongs to the category of affection, arising inwardly and extending outward, and is not to be understood as a passion, arising because of some outward good that it apprehends and desires. (Beza et al. Propositions and Principles, IX.viii.)</p></blockquote>

<blockquote><p>In God it [‘mercy’] notes his readiness to do good to the miserable, notwithstanding sin. The motion comes from within, from his own breast and bowels. For our God is pitiful and of tender mercy, James 5:11, and the act of it is extended and reached out unto the creature in seasonable relief. For the throne of grace was erected for this purpose, Heb. 4:11. Two things there are in mercy: First, a propension and inclination to commiserate the afflicted. Secondly, a ready relief and succour of them according to our power, affectus and effectus. First, there is a compassion or a being affected with the misery of others. This properly cannot be in God, in whom as there is no passion, so strictly speaking there is no compassion; yet something analagous there is, a taking notice of our misery. Something like a pity arising in his heart upon the sight of it; which the Scripture frequently ascribes to God, and we can best understand as we consider the divine perfections shining forth in the human nature of Christ. Ex. 2:24, ‘He heard their groaning;’ and Isa. 63:4, ‘In all their afflictions He was afflicted.’ Judges 10:16, ‘His soul was grieved for the misery of Israel.’ Forms of speech taken from the manner of men, who use to be thus affected when they see a miserable object. God in his simple and perfect nature cannot be said either to joy or grieve: but He carries Himself as one thus affected. Or these expressions were laid in aforehand to suit with the divine perfections as manifested in Christ, who is touched with a feeling of our infirmities. Secondly, mercy notes the actual exhibition of help and relief to the miserable…</p></blockquote>

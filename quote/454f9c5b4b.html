<main class="wrap"><figure class="quote" id="q-454f9c5b4b" data-kw="">
<blockquote><p>3rd Argument. If Paul do not only not command separation in the Church of Corinth, but also command and approve their meeting together in Church-communion, 1 Cor. 5:4; 11:18, 20-22; 14:23; 16:2, where there was: Schisms and contentious, 1 Cor. 1:12-13, envying and strife, 1 Cor. 3:3, incest, and incest tolerated, such as is not named amongst the gentiles, 1 Cor. 5:1, going to law with their brethren for gain before infidels, 1 Cor. 6, harlotry, vv. 15-16, eating at the idols’ table, 1 Cor. 8, keeping fellowship with devils, 1 Cor. 10:20-22, coming to the Lord’s Table drunken, 1 Cor. 11:21, eating and drinking damnation, vv. 29-30. A denying of a fundamental point of faith, the resurrection of the dead, and that with scoffing at it, 1 Cor. 15:35, murdering of weak souls, whom Christ had died for, 1 Cor. 8:12-13, Paul’s name despitefully traduced, 2 Cor. 10:8-9, etc. Then it is unlawful to separate from the pure worship of God, because a Church is not constituted of visible saints and a people all taught of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’, pp. 141-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b016abb8db" data-kw="">
<blockquote><p>Reason 1. Because no man ought to separate himself from the true Church of Christ: Now such is an assembly professing the true faith, notwithstanding other corruption; for as holiness, if it might be supposed without true faith, cannot make a true Church, but false doctrine and error in the foundation overthrows it for being a Church: So e contra [from the contrary], corruptions in manners cannot make it no Church, when true faith is taught and maintained.</p></blockquote>

</figure><figure class="quote" id="q-c6c4db6eae" data-kw="">
<blockquote><p>Seeing the motion of furthering ecclesiastical reconcilement amongst Protestants has been hitherto very favourably entertained by foreign States and Churches… that there is a most laudable purpose intended, and a good inclination expressed towards the furthering of the good of all Protestants, for the preservation of true religion and the union of their Churches with ours in the same cause, against the common enemies, which by our divisions are encouraged to intend, and enabled to work out our destruction; which they will certainly bring to pass if the Fatherly providence of our good God, whose counsels are unsearchable, and his ways past finding out, does not prevent their malice, by our loving concurrence in the ways of brotherly union, for the maintaining of his glorious Gospel… Therefore your petitioner does humbly request, that in the order, which hopefully will be made for the observation of that day of fasting and praying, this purpose of ecclesiastical reconcilement of Protestants by the union of their spirits in the truth of God, and against the adversaries of Christ’s Gospel, may be expressly mentioned to be recommended unto God by the prayers of that public meeting. And also, that some divines may be thought upon and nominated unto your petitioner, to whom he should make his address to begin a spiritual correspondence, which in this purpose is necessary, for the preparing and ripening of such proposals, as by the grace of God will be able to bring the wished for union of Protestants in due time to some perfection.</p></blockquote>

</figure><figure class="quote" id="q-097c7b8d46" data-kw="">
<blockquote><p>But they would make some clearing here by telling us that: ‘All who are acquainted with the principles and practices of our worthy predecessors, and of the learned and godly non-conformists in England, will easily see how far they are from their judgments and practices who follow the ways of separation.’ [1.] Bel•ke they still dwell beside evil neighbors, but which is worse, they are hardly believed, when men call to mind and consider how now of a long time still they took the patrociny [patronage] of all that were suspected to follow those ways.

2. What progress some of their chief and cried up men have made in those ways.

3. What affection they still carry to them and how familiarly they converse with them, even although excommunicated.

4. But especially how unavoidable separation is upon their grounds: For if it be a matter of conscience for them to join with others in civil duties that necessarily belong to the incorporation whereof both are members, sure much more in ecclesiastic [affairs].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-resolutioners.html">Scottish Resolutioners</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Member of the General Assembly</cite>, The Protestation given in by the Dissenting Brethren, to the General Assembly, July 21, 1652, Reviewed &amp; Refuted (Leith: Tyler, 1652), p. 16</span></figcaption>

irs&amp;text=But%20they%20would%20make%20some%20clearing%20here%20by&amp;text=are%20members%2C%20sure%20much%20more%20in%20ecclesiastic%20%5Baffairs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c9eab65a4f" data-kw="">
<blockquote><p>So then did you know any to hold forth fundamental errours, such as are the overthrow of faith or destructive to the power of godliness, there is no countenance to be given to such, you make yourselves sharers with him in his sin and bring upon yourselves the same guilt. And therefore says Paul, Tit. 3:10: ‘A man that is an heretic after the first and second admonition reject, knowing that he that is such, is subverted, and sins being condemned of himself.’ These are the rules for undoing errors: Nay and were they defiling though not damning errors, were they but sinful, though not destroying errours, yet if they were evidenced to us, and manifest to us to be errors, we ought not to connive at them, to countenance them in their way, but to admonish, to reprove them, to exhort them and use all possible ways left by Christ to reclaim them. But now when the things held forth are but merely opinion, or if more, yet they are not any way injurious to faith, or hurtful to the power and practise of godliness, then there may be more agreement, the difference of judgment should not in this case alienate affections, though you are not all of one mind, yet you are all of one heart, and here you differ only about the way to advance God’s glory. You have both cordial affections to God and Christ, you desire to bring Him glory, only you differ in the way; one thinks this way, and the other this, and in both it may be the Scripture is silent, or holds out as much for one as the other. Now in this case why should there be falling out: certainly diversities of opinion, may be countenanced, and yet without sin, provided that it does not arise either from fickleness, unsettledness and inconstancy in us, or from pride, that we love to side and differ from others, or that it does not tend to make disturbance of the peace of the Churches of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, … (London: Kembe, 1646), pp. 67-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“So then did you know any to hold forth fundamental errours, such as are the overthrow of faith or destructive to the power of godliness, there is no countenance to be given to such, you make yourselves sharers with him in his sin and bring upon yourselves the same guilt. And therefore says Paul, Tit. 3:10: ‘A man that is an heretic after the first and second admonition reject, knowing that he that is such, is subverted, and sins being condemned of himself.’ These are the rules for undoing errors: Nay and were they defiling though not damning errors, were they but sinful, though not destroying errours, yet if they were evidenced to us, and manifest to us to be errors, we ought not to connive at them, to countenance them in their way, but to admonish, to reprove them, to exhort them and use all possible ways left by Christ to reclaim them. But now when the things held forth are but merely opinion, or if more, yet they are not any way injurious to faith, or hurtful to the power and practise of godliness, then there may be more agreement, the difference of judgment should not in this case alienate affections, though you are not all of one mind, yet you are all of one heart, and here you differ only about the way to advance God’s glory. You have both cordial affections to God and Christ, you desire to bring Him glory, only you differ in the way; one thinks this way, and the other this, and in both it may be the Scripture is silent, or holds out as much for one as the other. Now in this case why should there be falling out: certainly diversities of opinion, may be countenanced, and yet without sin, provided that it does not arise either from fickleness, unsettledness and inconstancy in us, or from pride, that we love to side and differ from others, or that it does not tend to make disturbance of the peace of the Churches of Christ.”

— Samuel Bolton, The Arraignment of Errour… (London: Kembe, 1646), pp. 67-68">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSo+then+did+you+know+any+to+hold+forth+fundamental+errours%2C+such+as+are+the+overthrow+of+faith+or+destructive+to+the+power+of+godliness%2C+there+is+no+countenance+to+be+given+to+such%2C+you+make+yourselves+sharers+with+him+in+his+sin+and+bring+upon+yourselves+the+same+guilt.+And+therefore+says+Paul%2C+Tit.+3%3A10%3A+%E2%80%98A+man+that+is+an+heretic+after+the+first+and+second+admonition+reject%2C+knowing+that+he+that+is+such%2C+is+subverted%2C+and+sins+being+condemned+of+himself.%E2%80%99+These+are+the+rules+for+undoing+errors%3A+Nay+and+were+they+defiling+though+not+damning+errors%2C+were+they+but+sinful%2C+though+not+destroying+errours%2C+yet+if+they+were+evidenced+to+us%2C+and+manifest+to+us+to+be+errors%2C+we+ought+not+to+connive+at+them%2C+to+countenance+them+in+their+way%2C+but+to+admonish%2C+to+reprove+them%2C+to+exhort+them+and+use+all+possible+ways+left+by+Christ+to+reclaim+them.+But+now+when+the+things+held+forth+are+but+merely+opinion%2C+or+if+more%2C+yet+they+are+not+any+way+injurious+to+faith%2C+or+hurtful+to+the+power+and+practise+of+godliness%2C+then+there+may+be+more+agreement%2C+the+difference+of+judgment+should+not+in+this+case+alienate+affections%2C+though+you+are+not+all+of+one+mind%2C+yet+you+are+all+of+one+heart%2C+and+here+you+differ+only+about+the+way+to+advance+God%E2%80%99s+glory.+You+have+both+cordial+affections+to+God+and+Christ%2C+you+desire+to+bring+Him+glory%2C+only+you+differ+in+the+way%3B+one+thinks+this+way%2C+and+the+other+this%2C+and+in+both+it+may+be+the+Scripture+is+silent%2C+or+holds+out+as+much+for+one+as+the+other.+Now+in+this+case+why+should+there+be+falling+out%3A+certainly+diversities+of+opinion%2C+may+be+countenanced%2C+and+yet+without+sin%2C+provided+that+it+does+not+arise+either+from+fickleness%2C+unsettledness+and+inconstancy+in+us%2C+or+from+pride%2C+that+we+love+t

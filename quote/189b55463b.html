<blockquote><p>Some, indeed, would object to national recognitions of religion, and such royal calls and injunctions to observe its duties. Civil magistracy, they tell us, is a civil, temporal, earthly institution, having under its regulation the affairs of time and the world, and having nothing to do with religion; — and the civil magistrate, or chief ruler, they would accordingly prevent from in any way intromitting with religious matters—matters belonging not to time but eternity, not to this world but the world to come.

There are a number of grievous errors wrapt up here in one. It seems to imply that the affairs of this world may and ought to be carried on apart from the affairs and obligations of religious truth and duty; — thus shutting up religion to a territory of its own, beyond which it must not be suffered to trespass. But apart from this; how can religious obligation lie upon the separate individuals of a nation, and yet the nation as a nation be exempt from it?

It is certain that nations as a whole may please or provoke God; just as a family may do; just as an individual may do. God deals with a community as a whole, just as He deals with a household as a whole. And as when God is angry with a family, He deals with them in His wrath for their family provocations, so He deals with communities and kingdoms. If a family, therefore, ought to be religious; — in the sense that not only are its individuals to be religious, but unitedly, and as in their mutual relations, they are to observe the duties of family religion; — it ought to be the same in a kingdom.

The father of a family is not only to be a pious man himself, but he is to see that in the united worship of his household, and in religious principles being brought to bear on all its movements, there be a household piety — a family recognition of God. For true religion is not a thing to be kept secret between a man’s own conscience and God. No doubt the springs of it are deep seated in the inmost soul; and the Christian life is a hidden life. But for that very reason, — by reason of the inmost secrecy, and therefore irrepressible power of its principles, — it will assert and vindicate its influence in all circumstances, and over all the relations in which men stand towards one another.

It will therefore guide those in whom it dwells, not merely in their own private relation to God, and in their worship and more immediate duty towards Him, but in the whole influence they can exert over their fellow-creatures, — in all their relations, whether as superiors, inferiors, or equals. But especially as superiors, — where authority belongs to them, — where they have it in their power to “ command their households after them,” — they will arrange that in all the ongoings of these households God shall be recognised, and His authority and will obeyed. They will say with Joshua, “ As for me and my house, we will serve the Lord.”

It is this element, however, of command, of authority, against the introduction of which in religious observances not a few reclaim. I would advise with my household, or any irreligious and wayward member of it; I would advise; I would exhort; I would instruct and entreat: but I can go no farther. I can’t make them religious, and I won’t command or compel them.

But all this sophistry is utterly laughed to scorn by the simple perusal of the fourth commandment:—“The seventh day is the sabbath of the Lord thy God: in it thou shalt not do any work, thou, nor thy son, nor thy daughter, thy manservant, nor thy maidservant, nor thy cattle, nor thy stranger that is within thy gates: ” — by the which terms thou art held of God guilty of Sabbath desecration all the same, whether it be “thou, or thy son, or thy daughter, or thy manservant, or thy maidservant, or thy stranger that is within thy gates.” Thou wilt not be held guiltless on the plea that thou didst instruct, didst entreat, didst plead. Didst thou command? Didst thou bring out, for securing obedience to God, all the authority with which thou art endowed as head of thy household, and which thou dost not scruple, if need be, to bring forth for securing obedience to thine own will?

To “the stranger that is within thy gates,” thou art bound, — when advice, entreaty, exhortation fail,—to give forth thy command; backed by the penalty that, if it be not obeyed, he can be “within thy gates” no longer. With “thy manservant, and thy maidservant,” thou art to deal, if need be, in like manner also. Yea, “thy son and thy daughter” are not to abide “within thy gates” and despise the commandments of God. Thou art to command them; and, failing obedience, then thou art to disown them, to cast them off, and cast them out. Eli, alas! acted on the principle that a parent may advise in religious things, but may not imperatively command and threaten. And his house and his name were blotted out for ever!

Have you any influence, any power, any authority over children and dependants which you may use in your own service and work, but which you would refrain from bringing forth on the side of God? What were this, but selfishly to surround the accomplishment of your own will with securities, which you refuse to adopt to secure observance in your household to God’s will? And can it be that, in such a case you really honour God?

Nay: it is not whole-hearted, sincere, thorough-going, and true honouring of God where your government of your household does not call into exercise, when needful, on the side of God, every influence which you can ever rightly use on your own side. If there be a principle of authority — an element of command — vested anywhere in a family at all, religion lays it under contribution to the cause of the Most High — under call to uphold and promote the observance of His will.

And the same principle holds in a nation. So far forth as a monarch’s authority goes, it goes all the length of entitling him to enjoin a fast and a solemn assembly — a public, universal, national recognition of God — the God who is dealing with the nation as a whole, and summoning the nation as a whole to acknowledge Him. Nature itself teaches this truth. It rises up to view in its own native reasonableness in the hour of solemn thoughtfulness, the hour of sad national calamity.

All sophistical objections about the impossibility of making men religious by Act of Parliament then disappear. The truth comes obviously to light, and commends itself to reason and conscience. Well was it for Nineveh that its king was not embued with certain modern notions about magistrates and kings having nothing to do with religion. The city’s doom had been scaled by them!</p></blockquote>

<blockquote><p>Christians have been known to spend much time debating who was technically right in the American Civil War/War Between the States. While not an entirely useless endeavour, this approach is in danger of missing the bigger picture. Isaac Nelson, of the Irish Presbyterian Church, reminds us of how the war demonstrated what happens when a nation abandons biblical justice:

His judgment long ago was – that slavery was entirely opposed to all justice. The pulpit had not done its duty in the matter, when it might have done so. The Churches of America had filled the cup of God’s indignation, and the people had now drunk it to the dregs. We find fault with the men who are corrupting the Word of the living God. It was quite possible for a nation as well as an individual to sin away its days of grace; and let us beware that as a nation we are not doing so. The lesson we have to learn from America is this – that they took to their bosom an adder of which we have to mourn, and learn the lesson that to do justice, to love mercy, to walk humbly with God is the only security for national prosperity.</p></blockquote>

— Isaac Nelson, Banner of Ulster, 22 Apr. 1865">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CChristians+have+been+known+to+spend+much+time+debating+who+was+technically+right+in+the+American+Civil+War%2FWar+Between+the+States.+While+not+an+entirely+useless+endeavour%2C+this+approach+is+in+danger+of+missing+the+bigger+picture.+Isaac+Nelson%2C+of+the+Irish+Presbyterian+Church%2C+reminds+us+of+how+the+war+demonstrated+what+happens+when+a+nation+abandons+biblical+justice%3A%0A%0AHis+judgment+long+ago+was+%E2%80%93+that+slavery+was+entirely+opposed+to+all+justice.+The+pulpit+had+not+done+its+duty+in+the+matter%2C+when+it+might+have+done+so.+The+Churches+of+America+had+filled+the+cup+of+God%E2%80%99s+indignation%2C+and+the+people+had+now+drunk+it+to+the+dregs.+We+find+fault+with+the+men+who+are+corrupting+the+Word+of+the+living+God.+It+was+quite+possible+for+a+nation+as+well+as+an+individual+to+sin+away+its+days+of+grace%3B+and+let+us+beware+that+as+a+nation+we+are+not+doing+so.+The+lesson+we+have+to+learn+from+America+is+this+%E2%80%93+that+they+took+to+their+bosom+an+adder+of+which+we+have+to+mourn%2C+and+learn+the+lesson+that+to+do+justice%2C+to+love+mercy%2C+to+walk+humbly+with+God+is+the+only+security+for+national+prosperity.%E2%80%9D%0A%0A%E2%80%94+Isaac+Nelson%2C+Banner+of+Ulster%2C+22+Apr.+1865&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fed61c83180.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ed61c83180.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/07/13/isaac-nelson-on-what-we-can-learn-from-the-american-civil-war/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…a permissive law of God… such as a law of a bill of divorcement… The law of a bill of divorcement is a mere positive law, permitted in a particular exigent, when a husband, out of levity of heart and affection, cannot love his wife; therefore God by a law permitted him out of indulgence to put her away, that both might have a seed (the want [lack] whereof, because of the blessed Seed to be born of woman, was a reproach in Israel [in the Old Testament]), and though this was an affliction to some particular women, yet the intent of the law and the soul thereof was a public benefit to the commonwealth of Israel, of which sort of laws I judge the hard usage permitted by God to his people — in the master toward the servant — and the people of God toward the stranger, of whom they might exact usury — though not toward their brethren.</p></blockquote>

<blockquote><p>9. [Maxwell’s accusation of presbyterians is false:] That the king must submit his sceptre to the presbytery. The king’s sceptre is his royal office, which is not subject to any judicature, no more than any lawful ordinance of Christ; but if the king, as a man, blaspheme God, murder the innocent, advance belly-gods (such as our prelates for the most part were) above the Lord’s inheritance, the ministers of Christ are to say, ‘The king troubles Israel, and they have the keys to open and shut heaven to, and upon the king, if he can offend.’ … 21. It is false that presbyteries usurp both swords because they censure sins which the civil magistrate should censure and punish. Elijah might be said then to mix himself with the civil business of the kingdom, because he prophesied against idolaters’ killing of the Lord’s prophets; which crime the civil magistrate was to punish. But the truth is, the assembly of Glasgow, 1637, condemned the prelates because they, being pastors, would be also lords of parliament, of session, of secret council, of exchequer, judges, barons, and in their lawless high commission, would fine, imprison, and use the sword. … 29. It is a lie that our General Assembly may repeal [civil] laws, command and expect performance of the king, or then excommunicate, subject to them, force and compel king, judges and all, to submit to them. They may not force the conscience of the poorest beggar, nor is any Assembly infallible, nor can it lay bounds upon the souls of judges, which they are to obey with blind obedience — their power is ministerial, subordinate to Christ’s law; and what civil laws parliaments make against God’s Word, they may authoritatively declare them to be unlawful, as though the emperor (Acts 15) had commanded fornication and eating of blood. Might not the Assembly forbid these in the synod?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), pp. xxii-xxiii</span></figcaption>

</figure><figure class="quote" id="q-a1b9e52002" data-kw="">
<blockquote><p>It is true, indeed, a prince should be loath to put out that life that God hath put in, and should beware, to judge rashly in capital crimes. It is no small matter to make a crime capital; but if the crime be capital and deadly, the prince hath no power to hold his hand aback from execution, and to forgive. Indeed, for weighty and great considerations, a prince may mitigate the punishment, but to say he may let the man go free, he hath no power. But yet they will insist further, and say, Is not this one of the judicial laws that was given to the Jews—then what have we to do with it? I answer, these laws, seeing the Jews, and their commonwealth, and laws politic, are abrogate, in so far as they concerned that people, we have nothing ado with them—they are abolished; but for as much as they are grounded upon nature, and natural law, we have ado with them. As for this law, it is natural. Ye know, that natural men, ethnics, who had never the law of the Jews, they executed the murderer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures Upon The Passion, Resurrection, And Ascension Of Christ</cite>, (Edinburgh: The Wodrow Society, 1616), 87–88.</span></figcaption>

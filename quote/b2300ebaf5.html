</figure><figure class="quote" id="q-d37baf5e4f" data-kw="">
<blockquote><p>At length the revolution of 1688 (in which, however, the fastidious nature of his principles would not sanction his concurrence) allowed him to return from exile. His attainder was reversed, and, on his brother’s death, he succeeded to the honours of the family; but from religious scruples as to acknowledging the prince of Orange, he never applied for the succession to his brother’s estates. In 1692 he was imprisoned for 8 months on account of being the suspected author of the ‘Sanquhar Declaration, 10th Aug. 1692,’ and was at length liberated in May 1693, and allowed to spend the remainder of his days in undisturbed tranquillity. Sir Robert died unmarried on the 20th Oct. 1701, at Borrowstonness, where he had resided for some period before.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-86e4f4dbbf" data-kw="">
<blockquote><p>We profess a difference between ourselves and the unrenewed, as radical as that between light and darkness, almost as wide as that between heaven and hell. But in all the visible and practical concerns which interest the unrenewed heart, we nearly resemble them. Our words say that we believe riches to be vanity and emptiness. Our acts seem to say that we love and seek them as intensely as those do who make them their all and their god. We say in words that ‘we have here no continuing city,’ but in act are as eager to adorn our dwellings here as though they were our only home…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Start Here</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Consider the words of the American, southern presbyterian, Robert Dabney (“Principles of Christian Economy,” in Discussions: Evangelical and Theological, 1.10):</cite></span></figcaption>

<blockquote><p>10th Question: What duties are done by the minister? A. 1 Reading the Word. Acts 13:27; Col. 4:16 2 Preaching it. Lk. 4:20-21; Acts 13:15 3 Praying and praising God. 1 Cor. 14:15-16; Neh. 8:6 &amp; 9:5-6 4 Administering Sacraments. Mt. 28:19 &amp; 26:26; Acts 20:11 5. Blessing the people. Num. 6:23 In performing the two first (reading and preaching the Word) and the two last (administering Sacraments, and blessing the people) the Minister stands in God’s room, and is his mouth: but in the middlemost duty (praying to God and praising Him) he is the peoples’ mouth to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification (1641)</cite>, p. 4</span></figcaption>

</figure><figure class="quote" id="q-8227d2ef9f" data-kw="">
<blockquote><p>To join to the public confession some notable promise which may raise sinners to the hope of pardon and reconciliation, there is none among us who does not acknowledge it to be most useful. And indeed from the beginning I wished to introduce this practice; but when certain persons feared that offence might arise from the novelty, I was too ready to yield. Thus the matter was let go. Yet now it would not be seasonable to make any change in this respect; because, before the confession has been finished, a great part of the people begin to rise. Hence we the more earnestly desire, while it is still in your power, that your people be accustomed to both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Question of some Ecclesiastical Rites’ (1561) in Opera, vol. 10, pt. 1, Consilia, col. 213</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-034818ef77" data-kw="">
<blockquote><p>Certainly in Christ’s time both liturgies by forms and also prayers by habit were used [Lk. 18:11-13]. And yet Christ never interposed in the controversy, so as to condemn the one or the other. He condemns the Pharisees for making long prayers to cover their devouring widows’ houses, and for their praying to be seen of men: But whether their prayers were a liturgy and set form, or whether they were extemporary, He takes no notice, as telling us that He condemned neither! (And it’s likely the Pharisees’ long liturgy was in many things worse than ours, though the psalms were a great part of it: and yet Christ and his apostles oft joined with them, and never condemned them). Nay as far as I can find, the Pharisees and other Jews were not in this so blind and quarrelsome as we; nor never made a controversy of it, nor ever presumed to condemn either liturgies or prayers by habit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1 | Direction 32</cite>, p. 176</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-739cd44fcb" data-kw="">
<blockquote><p>1. The word ‘church’ [say the Independents] signifies always a gathered together church, or such as may gather together, Acts 11:26, a whole year they assembled with the Church, Acts 20:7, the disciples came together to break bread; so Acts 1:10; 2:44,46; Acts 5:12; 15:25. [Rutherford’s] Answer: [1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands? 2. The Scripture speaks so [as] to give us an example of the public meeting for public worship where it is not needful that all met in one place collectively; it is enough they meet all distributively. 3. Neither does the word ‘church’ always signify a meeting of one single congregation, as Acts 12:5; prayers were made [for Peter in jail] by the church, that is by all professors [throughout Jerusalem]. Herod vexed the church, Acts 8:3. Saul made havoc of the church; ‘I persecuted the Church.’ (1 Cor. 15:9) There is no necessity to expound these of people meeting ordinarily to worship God; for Herod and Saul persecuted all, whither apostles or professors in houses, not respecting their meeting in one place; Also [that] it shall follow that prayers were not made in private, but only in the church, that is, in the convened congregation for Peter, which is absurd: And that they were a visible-church is clear, else Herod and Saul could not persecute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea… (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

necessity+to+expound+these+of+people+meeting+ordinarily+to+worship+God%3B+for+Herod+and+Saul+persecuted+all%2C+whither+apostles+or+professors+in+houses%2C+not+respecting+their+meeting+in+one+place%3B+Also+%5Bthat%5D+it+shall+follow+that+prayers+were+not+made+in+private%2C+but+only+in+the+church%2C+that+is%2C+in+the+convened+congregation+for+Peter%2C+which+is+absurd%3A+And+that+they+were+a+visible-church+is+clear%2C+else+Herod+and+Saul+could+not+persecute+them.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea%E2%80%A6+%281642%29%2C+ch.+7%2C+%E2%80%98If+there+be+No+True+Visible+Church+in+the+New+Testament%2C+but+Only+a+Congregation+Meeting+in+One+Place%2C+%26+No+Presbyterial+or+Representative+Church+%28as+They+Call+it%29+at+All%E2%80%99%2C+p.+81+Rutherford+is+arguing+against+the+novel+Independent+Church+government.+See+also+the+chapter+at+large.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F739cd44fcb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/739cd44fcb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-holding-public-worship-church-courts-by-distance-though-technology-on-using-satellite-campuses-under-necessity-for-edification/#:~:text=1.%20The%20word%20%E2%80%98church%E2%80%99%20%5Bsay%20the,and%20Saul%20could%20not%20persecute%20them&amp;text=1.%20The%20word%20%E2%80%98church%E2%80%99%20%5Bsay%20the%20Independents%5D%20signifies&amp;text=else%20Herod%20and%20Saul%20could%20not%20persecute%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

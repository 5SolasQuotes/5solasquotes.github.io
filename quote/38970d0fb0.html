<blockquote><p>Many never think of measuring things political with a moral measuring reed. And yet, as Christians we are bound so to do. The revealed will of God furnishes principles whereby all things are to be tested. In stating that constitutions of government are to be tested by the Scriptures it is not meant that they are to be pronounced defective unless they contain all Bible truth.

Church creeds should cover the whole field of revealed truth, but political constitutions have no such end to serve. Nevertheless, civil government exists within the sphere of morals. It has moral interests to conserve and moral ends to reach. …

The next task will be to take this moral standard and try the national constitution by it. Since the secular and the Christian are the only two theories of government there are, it is promised that the one or the other will show its presence and dominating power in every political constitution. Let us therefore examine the national constitution to see whether it measures up to the Christian standard, or whether the secular theory has determined its character. We begin with the preamble. It is as follows: “We, the people of the United States, in order to form a more perfect union, establish justice, insure domestic tranquillity, provide for the common defence, promote the general welfare, and secure the blessings of liberty to ourselves and our posterity, do ordain and establish this constitution for the United States of America.”

This is an admirable statement of the ends of civil government. It is difficult to see how it can be improved. Many a one, unprovided with a correct standard for measuring political documents would at once pronounce the constitution Christian. But a careful measurement with our moral standard already agreed upon will reveal a very serious defect. It declares that “We, the people . . . . do ordain and establish this Constitution.” This statement is objectionable, not because of what it contains, but because of what it omits. It is admitted that the people do ordain, and have the right to ordain constitutions of government. Peter says: “Submit your selves to every ordinance of man for the Lord’s sake.” Striking out the words above quoted would not make the constitution Christian, and therefore their presence does not make it secular.

But this preamble does not measure up to the Christian standard. Had the expression, “We, the people,” been followed by some such words as, “Acknowledging Almighty God as the source of all power and authority in civil government, the Lord Jesus Christ as the Ruler of Nations, and His revealed will as the supreme standard to decide moral issues in national life,” its Christian character would be placed beyond all doubt. But while the people are recognized as ordaining civil government, there is not a hint given that the authority to do this comes from God, or that the nation and its government exist in the sphere of divine authority and are subject to the moral law. To make prominent the human and to ignore the divine element in civil government is of the very nature of secularism.</p></blockquote>

<blockquote><p>Here I shall briefly advert to the main topics of discussion in the publications to which I have referred; and then notice the exceptions that have been taken to the way in which the writers conducted the Controversy.

As to the first of these, the principal topics on which Dr M’Crie and his friends laid emphasis, were the three following:—

I. The place assigned in matters of religion to the civil ruler or to the Christian nation acting through its Rulers in a corporate capacity. The Synod, in their new Testimony, had asserted that the power competent to worldly kingdoms is wholly temporal, respecting only the secular interests of society, (p. 193.) Of course, they adduced no scripture for this, because no scripture could be adduced to lend countenance to such a tenet. Nor can it be deduced by sound deduction from any revealed truth. The advocates of the Synod could only have recourse to the rights of man.

Were this dogma consistently carried out, the separating brethren clearly proved, that all the laws previously in force in every Christian country in favour of religion, the sabbath, scripture-education, and the like, must needs be cancelled by a universal act rescissory. They, on the contrary, maintained from scripture, that nations as such are under obligation to recognise the true religion and aid in its diffusion by wise and salutary laws. They maintained that rulers are bound to give civil sanction to the truth; to establish the church; and to contribute from the national resources, for the furtherance of the gospel. This was one point which they argued out in all its bearings.

II. Liberty of conscience, on its true foundation, was fully and admirably expounded. The doctrine of the Synod on this point was in the last degree unguarded. They not only tied up the magistrate’s hands from any exercise of civil authority in suppressing blasphemy, sabbath-breaking, or profaneness,—representing such coercive measures as inconsistent with the spiritual nature of Christ’s Kingdom,—but went so far as to allege that the national sanction of one particular profession of Christianity in preference to another, partook of the nature of compulsion, intolerance, and persecution.

On the contrary, the separating brethren put the question of liberty of conscience on its true ground: that is, they placed it not on the mere metaphysical rights of man, but on the ground that God alone is Lord of the conscience; and that its rights, as derived from him, can never be alleged as running counter to the authority of God speaking in His word, and commanding nations and rulers to obey Him. The unregulated license to which I have referred was well designated by the Rev. Mr Chalmers of Haddington, “the grim idol,” at whose shrine the entire national profession of religion and the due exercise of magistratical power about religion were recklessly sacrificed.

III. The Christian state, according to the Old Testament precedent, was represented by the separating brethren as an organised community, capable of being in covenant with God. On this they laid great stress This was the most definite expression, according to these brethren, for national religion; and their whole theory, in large measure, took its peculiar colour from this conviction.

Not that they supposed any step or act of man originating the relation between a State and God. Rather, their whole mode of representing the matter proceeded on the supposition that by an act of prevenient grace the nation to whom the word of God had come, occupied a position analogous to that of Israel; and the formal act of covenanting was but the expression of the national consciousness of being taken into such a relation. Nor was this a merely Scottish idea: for we find in other countries the same thing done or fully approved of.</p></blockquote>

Not that they supposed any step or act of man originating the relation between a State and God. Rather, their whole mode of representing the matter proceeded on the supposition that by an act of prevenient grace the nation to whom the word of God had come, occupied a position analogous to that of Israel; and the formal act of covenanting was but the expression of the national consciousness of being taken into such a relation. Nor was this a merely Scottish idea: for we find in other countries the same thing done or fully approved of.”

— George Smeaton, Preface to Thomas McCrie, Statement of the Difference Between the Profession of the Reformed Church of Scotland, as Adopted by Seceders, and the Profession Contained in the New Testimony and other Acts, Lately Adopted by the General Associate Synod; Particularly, on the Power of Civil Magistrates Re">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHere+I+shall+briefly+advert+to+the+main+topics+of+discussion+in+the+publications+to+which+I+have+referred%3B+and+then+notice+the+exceptions+that+have+been+taken+to+the+way+in+which+the+writers+conducted+the+Controversy.%0A%0AAs+to+the+first+of+these%2C+the+principal+topics+on+which+Dr+M%E2%80%99Crie+and+his+friends+laid+emphasis%2C+were+the+three+following%3A%E2%80%94%0A%0AI.+The+place+assigned+in+matters+of+religion+to+the+civil+ruler+or+to+the+Christian+nation+acting+through+its+Rulers+in+a+corporate+capacity.+The+Synod%2C+in+their+new+Testimony%2C+had+asserted+that+the+power+competent+to+worldly+kingdoms+is+wholly+temporal%2C+respecting+only+the+secular+interests+of+society%2C+%28p.+193.%29+Of+course%2C+they+adduced+no+scripture+for+this%2C+because+no+scripture+could+be+adduced+to+lend+countenance+to+such+a+tenet.+Nor+can+it+be+deduced+by+sound+deduction+from+any+revealed+truth.+The+advocates+of+the+Synod+could+only+have+recourse+to+the+rights+of+man.%0A%0AWere+this+dogma+consistently+carried+out%2C+the+separating+brethren+clearly+proved%2C+that+all+the+laws+previously+in+force+in+every+Christian+country+in+favour+of+religion%2C+the+sabbath%2C+scripture-education%2C+and+the+like%2C+must+needs+be+cancelled+by+a+universal+act+rescissory.+They%2C+on+the+contrary%2C+maintained+from+scripture%2C+that+nations+as+such+are+under+obligation+to+recognise+the+true+religion+and+aid+in+its+diffusion+by+wise+and+salutary+laws.+They+maintained+that+rulers+are+bound+to+give+civil+sanction+to+the+truth%3B+to+establish+the+church%3B+and+to+contribute+from+the+national+resources%2C+for+the+furtherance+of+the+gospel.+This+was+one+point+which+they+argued+out+in+all+its+bearings.%0A%0AII.+Liberty+of+conscience%2C+on+its+true+foundation%2C+was+fully+and+admirably+expounded.+The+doctrine+of+the+Synod+on+this+point+was+in+the+last+degree+unguarded.+They+not+only+tied+up+the+magistrate%E2%80%99s+hands+from+any+exercise+of+civil+authority+in+suppressing+blasphemy%2C+sabbath-breaking%2C+or+profaneness%2C%E2%80%94representing+such+coercive+measures+as+inconsistent+with+the+spiritual+nature+of+Christ%E2%80%99s+Kingdom%2C%E2%80%94but+went+so+far+as+to+allege+that+the+national+sanction+of+one+particular+profession+of+Christianity+in+preference+to+another%2C+partook+of+the+nature+of+compulsion%2C+intolerance%2C+and+persecution.%0A%0AOn+the+contrary%2C+the+separating+brethren+put+the+question+of+liberty+of+conscience+on+its+true+ground%3A+that+is%2C+they+placed+it+not+on+the+mere+metaphysical+rights+of+man%2C+but+on+the+ground+that+God+alone+is+Lord+of+the+conscience%3B+and+that+its+rights%2C+as+derived+from+him%2C+can+never+be+alleged+as+running+counter+to+the+authority+of+God+speaking+in+His+word%2C+and+commanding+nations+and+rulers+to+obey+Him.+The+unregulated+license+to+which+I+have+referred+was+well+designated+by+the+Rev.+Mr+Chalmers+of+Haddington%2C+%E2%80%9Cthe+grim+idol%2C%E2%80%9D+at+whose+shrine+the+entire+national+profession+of+religion+and+the+due+exercise+of+magistratical+power+about+religion+were+recklessly+sacrificed.%0A%0AIII.+The+Christian+state%2C+according+to+the+Old+Testament+precedent%2C+was+represented+by+the+separating+brethren+as+an+organised+community%2C+capable+of+being+in+covenant+with+God.+On+this+they+laid+great+stress+This+was+the+most+definite+expression%2C+according+to+these+brethren%2C+for+national+religion%3B+and+their+whole+theory%2C+in+large+measure%2C+took+its+peculiar+colour+from+this+conviction.%0A%0ANot+that+they+supposed+any+step+or+act+of+man+originating+the+relation+between+a+State+and+God.+Rather%2C+their+whole+mode+of+representing+the+matter+proceeded+on+the+supposition+that+by+an+act+of+prevenient+grace+the+nation+to+whom+the+word+of+God+had+come%2C+occupied+a+position+analogous+to+that+of+Israel%3B+and+the+formal+act+of+covenanting+was+but+the+expression+of+the+national+consciousness+of+being+taken+into+such+a+relation.+Nor+was+this+a+merely+Scottish+idea%3A+for+we+find+in+other+countries+the+same+thing+done+or+fully+approved+of.%E2%80%9D%0A%0A%E2%80%94+George+Smeaton%2C+Preface+to+Thomas+McCrie%2C+Statement+of+the+Difference+Between+the+Profession+of+the+Reformed+Church+of+Scotland%2C+as+Adopted+by+Seceders%2C+and+the+Profession+Contained+in+the+New+Testimony+and+other+Acts%2C+Lately+Adopted+by+the+General+Associate+Synod%3B+Particularly%2C+on+the+Power+of+Civil+Magistrates+Re&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F71c67a2d8a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/71c67a2d8a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/17/george-smeaton-on-the-establishment-principle-the-rights-of-god-and-national-covenanting/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

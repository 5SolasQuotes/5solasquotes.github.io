<main class="wrap"><figure class="quote" id="q-95e9714745" data-kw="">
<blockquote><p>Of the nature of painting that represents the Historie of the Bible There are many things are more clearly set forth in a picture then in a discourse. The fabrick of the Tabernacle, the architecture of the Temple; the dimensions, stories, and divers rooms of Noahs Ark, are more perceptible by us in a painting to the eye, then is the verbal description the Scripture gives us of it. A man verily may behold the situation and length of the Land of Canaan better in a Chorographick Map, then in the History of Josuah: But that which is the more evident and easie, is not neverthelesse the more excellent. These paintings are not divine, as are the words of the Scripture. A visible representation of Solomon’s Temple is meerly a humane figure; but the verball representation of the same Temple exhibited in Scripture terms is a divine work. The picture of a man crucified, is it as divine as the words of the Scripture describing the passion of Christ? or rather, is it comparable to a Sermon, in which Jesus Christ is drawn out before our eyes, and crucified among us? Gal. 3.1. Where is it authorized by God to plant Faith in our hearts? In many narrations a picture verily may serve for an help to the understanding of the Historie: but it can never be either instrument or object of our Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-d-espagne.html">Jean D’Espagne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>New Observations upon the Decalogue… (London, 1652), 2nd Commandment. D’Espagne (1591-1659) was a French, reformed minister who lived for a significant amount of time in London.</cite>, pp. 51-52</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-5f6717e9f4" data-kw="">
<blockquote><p>The worst men and the most superstitious will yet pretend the honoring of God. So it is again in regard of those days that men have set apart for God, and it is that which has settled men in the superstitious observation of them, that it is for the honor of Christ. ‘What’ (say they) ‘shall we not honor the birth of our blessed Savior?’ What a profaness, what a disrespect is this unto Jesus Christ? ‘Well let others do what they will, for our parts we will do it, for hereby we shall do honor unto our blessed Savior.’ So the Papists for the adoration of images, say they, ‘What not regard, not to reverence the image the picture of our blessed Savior and of the holy saints?’ And the truth is if it be duly weighed, there is the same reason of images of Christ and the saints, and of days set apart for the honor of Christ by man’s invention; and there is as fair a pretence of honoring Christ by setting up his image before me to put me in mind of Him as of honoring of Him by keeping a day of mine own appointment. There is (I say) the same reason of both, and whatsoever argument any man shall bring me against the one, I dare undertake to make it good to be against the other. As now, is not natural reason as strong to set up the picture of the King to honor him (and you do it for that end) is not this as much as to keep a day once a year to remember him? So the reason may be as strong to honor Christ by way of picture as to honor Him by observing any day set apart for that end by the inventions of men.</p></blockquote>

</figure><figure class="quote" id="q-1dff4e8341" data-kw="">
<blockquote><p>Your long labor in setting down the faults to be found in our Liturgy is to small purpose. The Nonconformists do except against many things appointed in the Book, as inconvenient at least, and such as should be taken away or reformed, as the reading of Apocryphal books under the title of holy Scripture, specially such parts as be corrupt for matter: The cross and surplice as idolothites by participation and signs of mystical signification: The corruptions in the translations: and some things in the forms of burial, matrimony, thanksgiving for women after child-bed, etc. But these they condemn not as idolatry, nor as that which makes the worship itself false and idolatrous. It is one thing to say such a rite is inconvenient, superstitious, scandalous borrowed from the Papists, not warranted by the Word of God, in the use will-worship, if the word be taken largely; another that the worship itself is false and idolatrous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Two Treatises of Mr. John Can, the Leader of the English Brownists… (London: R.B., 1642), ch. 2</cite>, p. 29</span></figcaption>

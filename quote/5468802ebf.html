<blockquote><p>Writing in opposition to the Oxford or Tractarian Movement in the Church of England, James Buchanan contrasted it with the contemporary efforts of the evangelical party in the Church of Scotland to purify their own established church. He also drew attention to the similarities between the Tractarians and the seventeenth-century Laudians:

It may be instructive to notice the contrast, in this respect, betwixt the conduct of the English Church and that of the sister Establishment in Scotland, when both were exposed to equal danger. In the latter, as well as in the former, the influence of those political changes to which I have referred was unquestionably felt,—and an apprehension existed that, in the progress of events, she might be deprived of State protection.

But the danger only roused her to more vigorous exertion in the old path of duty. She defended the principle of an Establishment by scriptural arguments,—she denounced and sought to redress the corruptions which existed in her own system; and with reference to the Dissenters, she put forth no new claims, but stood strictly on the defensive. And now her danger arises from the hostility of those who cannot endure the wholesome reforms which she has attempted to carry out in the practical working of her own system.

The consequence is likely to be that, in the first instance, the Church of Scotland will lose, while the Church of England may retain, the friendship and support of the world; but which will thrive best, in the long-run, for all the noblest ends of a Christian institute, is another and a very different question. Meanwhile, permit me, as I have incidentally noticed this contrast betwixt the two, to point out the equally striking resemblance between the conduct of the Oxford writers now, and that of Laud in the days of Charles.

Both sought to strengthen the Church by weakening Dissent; and both by the same means,—the assertion of exclusive claims to apostolical authority, and the denial of the ministerial commission of those who differed from them. May it not be, that both attempts will have the same issue?—that, after an interval of feverish elevation and excitement, the patient may relapse into a state of deliquescence; and that, with or without a great national convulsion, the Church of England may once more be humbled and purified as in a furnace of fire.

This is not the first time that these views have been promulgated. They have been repeatedly put forth by a party within the English Church in seasons of apprehended danger; but never without frustrating their object, and entailing calamities on the country. In the reign of Charles I., they were put forth by Laud, a man “virtuous, if severity of manners alone, and abstinence from pleasure could deserve that name; learned, if polemical knowledge could entitle him to that praise; and disinterested, but with unceasing industry he studied to exalt the priestly and prelatical character, which was his own;” [David Hume] but instead of averting, they increased the dangers of the Church, and were followed in quick succession by the abolition of Episcopacy in Scotland, the impeachment of the bishops in England, the execution of Laud, the bloody death of the king, and the Protectorate of Cromwell.

After the Restoration, they were revived, and most relentlessly applied, against the Nonconformists, when in Scotland more than 300, and in England about 2000, faithful ministers were ejected for nonconformity; but these apparent triumphs were of short continuance, and after a season of feverish discontent and grinding tyranny, the royal family was exiled, and the nation’s peace secured by a revolution.

Again, in the earlier part of last century, the same views reappeared and after setting the Church and country on a flame, during the Bangorian Controversy, they issued in the Church of England being deprived of her Convocation,—the name and the form remained, but the substance was gone. What effects may follow from the revival of the same pretensions at the present time, no one may foretell; but already we seem to discern, among the signs of the times, the “little cloud like a man’s hand,” which may suddenly spread till the whole sky is overcast, and break, not in refreshing showers, but in a wild, ungovernable tempest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the “Tracts for the Times.”</cite>, (Edinburgh: John Johnstone, 1843), pp 11-12.</span></figcaption>

<blockquote><p>According to the Westminster Confession, ‘It pleased God the Father, Son, and Holy Ghost, for the manifestation of the glory of His eternal power, wisdom, and goodness, in the beginning, to create, or make of nothing, the world, and all things therein whether visible or invisible, in the space of six days; and all very good.’ (IV.I) Some scholars have argued that this does not require confessional adherents to believe in six-day creation, even though such a conclusion appears to go against the obvious meaning of the words. This argument does not appear to harmonise with the primary sources, moreover. William Gouge, an important member of the Westminster Assembly, argues that the seventh-day of the creation week lasted for twenty-four hours and maintains that this was also the length of the other days:

3. Q. Of how many hours doth the Sabbath day consist?

A. Of four and twenty. Gen. 2.3.

The Sabbath is called the seventh day: so as it is a seventh part of the week: therefore so many hours as make up every of the other days (which are four and twenty) must be accounted to this day.</p></blockquote>

<blockquote><p>Some laws expire by limitation. Such are many of the laws of every country. Such were many of the laws given by Moses. They were in force until Christ, who was their end, came; and then they bound no longer. Thus the whole ceremonial law ceased to bind after the death of Christ, to which it was limited. But no limit was fixed to the observance of the fourth commandment, either when first given or afterwards.

A competent authority may repeal a law, and thus its obliging power may cease. Every free government affords numerous instances of the repeal of laws once useful, but no longer so. In a regular government, the repeal must be passed by the power which enacts the law. The great Lawgiver of the world is God. He ordained the law of the Sabbath, and he has never repealed it. Is any evidence of such repeal found in Scripture? If so, where is the book, the chapter, the verse containing it? All admit that the law was in force until Christ. Christ did not repeal it, for he says so. Matt. 5:17; nor did the apostles anywhere declare that it was repealed. If this law, therefore, has ceased to bind, it must be in some way utterly unknown to us. It is still practicable; it has not expired by limitation; it has not been repealed.</p></blockquote>

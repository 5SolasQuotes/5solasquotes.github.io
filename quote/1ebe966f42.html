<main class="wrap"><figure class="quote" id="q-1ebe966f42" data-kw="">
<blockquote><p>The Sabbath is an institution of great antiquity, having been appointed by God on the first seventh day of time, to commemorate the creation of the world. Some hold that the Sabbath was first instituted when Israel were in the wilderness. It is of importance to as certain whether this opinion, or that which we have announced is sanctioned by scripture. If the Sabbath was instituted before the fall, the command to devote a seventh part of their time to God, is binding upon the whole human race. Having been given many centuries before the Mosaic economy, this command is unaffected by its abrogation; on the other hand, if the Sabbath was first given in the wilderness, it was in tended for the Jews only, and is now abolished with the rest of their ceremonial rites. If this be the case, it may still be incumbent upon communities to devote some portion of the public time to God, but they are bound by no divine law to devote a seventh part of their time.

In opening the argument upon this subject, I feel the utmost confidence that you will all agree with me in thinking, that the Sabbath existed not only before the time of Moses, but before the flood, yea, before the fall. This seems to be taught in the second chapter of Genesis, as plainly as any doctrine can be taught in the language of men. Of that chapter, we quote the three first verses: 6. “Thus the heavens and the earth were finished, and all the host of them. And on the seventh day God ended his work which he had made; and he rested on the seventh day from all his work which he had made. And God blessed the seventh day, and sanctified it; because that in it he had rested from all his work which God created and made.”

Some are of opinion that the sanctification of the seventh day is mentioned in this passage, not because the Sabbath was now appointed, but because it was afterwards appointed for the reason here mentioned. This opinion is unsupported by evidence. The sanctification of the seventh day, and the finishing of creation, are recorded in the same passage of an historical narrative, as they would have been, if they had occurred together, and as they should not have been, if the one was two thousand years after the other.

This being the case, we are bound to believe that they did occur together, until it can be shewn by positive evidence that they did not. Now no such evidence exists. It is true, Sabbath is never mentioned again, until after Israel came out of Egypt; and this circumstance so far as the innate probability of the fact can go, is favourable to the supposition that the Sabbath was not instituted till then. The probability that the Sabbath was not instituted, because it is not mentioned, arises from the probability that it would have been mentioned if instituted; and a probability founded upon another probability, is surely of little weight, when opposed to a plain statement of inspired history.

And probable as it is, that Sabbath would have been frequently mentioned if instituted, it was equally probable that instances of circumcision would be frequently mentioned; yet, no instance of this is on record, from the time that Israel entered Canaan, until the circumcision of John the Baptist, though it is certain, that during the interval, all the males were circumcised: and why may not Sabbath have been instituted at the beginning, although no second reference to it occurs, until Israel were in the wilderness?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Sermons on the Sabbath, Preached in September 1838</cite>, (Haddington: Neill &amp; Sons, 1838), pp 4-6.</span></figcaption>

<blockquote><p>In the second member [of the verse] he betrays an evil conscience, or, at least, he shows that he handled rather a private business than any public cause, for he complains that the apostles will cause the priests and the scribes to be hated for the death of Christ. … Notwithstanding this is the principal point of the accusation, that they did not obey the commandment of the priests… But the chief priest does not consider what is his duty towards God and the Church; he abuses his authority tyrannously, as if the same were not under any laws, as the Pope deals with us at this day; for seeing that he takes to himself an unbridled authority and government, he fears not to condemn us for schismatics, so soon as he sees us refuse his decrees; for he catches at these sentences: “He which despiseth you despiseth me,” (Luke 10:16;) and thereupon he concludes that we will rebel against God. But if he will be heard as the ambassador of Christ, he must speak out of the mouth of Christ. Now, forasmuch as he does manifestly play the minister of Satan, he borrows authority, without shame and color, of the name of Christ; yea, the very form of speech which the chief priest uses doth prove how carelessly spiritual tyrants who usurp such authority and lordship as is not subject to the Word of God, dare grant liberty to themselves to attempt whatsoever pleases them. With a commandment (says he) have we commanded. Whence comes such strait rigor, save only because they think that all that must be received without exception which they shall command?</p></blockquote>

<blockquote><p>1. Some things are necessary by divine ordination, as magistracy; ‘Whosoever resists the power,’ says the apostle, ‘resists the ordinance of God;’ and ‘the powers that be, are ordained of God,’ Rom. 13:1-2, etc. And as magistracy, so ministry is the ordinance of God, 1 Cor. 12:28, ‘And God hath set some in the Church, first Apostles, etc.’

2. Some things are necessary by divine precept; as for example, the exercise of the power of the magistrate is not only necessary by virtue of God’s instituting and ordaining magistracy, but also by the command of God, which obliges magistrates to punish vice, to execute wrath upon them who do evil, to promove, encourage and praise that which is good; to protect their subjects in well-doing, and to preserve peace. And so ministers are under a necessity of preaching the Gospel by the command of God.

3. Some things are necessary because God has made them useful and convenient for man, and has given them to man for his use; they are in their nature convenient for man, given and designed of God for the good of man; thus meat and clothing, and houses, peace and the protection of lawful authority are necessary.

4. Some things are necessary means in order to a necessary end; and these again are necessary, either simply for attaining the end, or necessary for the better or more easy and convenient attaining of the end; as a house is necessary, not simply for hearing of the Word, but for the more convenient hearing of the Word, because it shelters the minister and people from storms, winds and scorching heat, etc. Thus the protection of lawful authority is necessary for the peaceable hearing of the Word without disturbance.

5. Some things are necessary for preventing of evil; the evil either of sin, or of affliction and calamity.

6. Some things become necessary, or the more necessary to be done, because of those who urge the forbearance of them out of some erroneous principle, or for establishing of some error. And thus Mr. Rutherford shows in the forecited treatise [the Appendix on Scandal to The Divine Right of Church Government], that to forbear the eating of swine’s-flesh before a Jew, who alleges that it is a sin, or breach of the commandment of God to do so; to forbear it now when we are fully possessed in that liberty wherewith Christ has made us free, were to harden the Jew in his Judaism, and the way to bring us again under the yoke of the Ceremonial Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-vilant.html">William Vilant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Review &amp; Examination of a Book bearing the Title of The History of the Indulgence</cite>, … (London, 1681), pp. 249-50</span></figcaption>

<blockquote><p>Is it not strange, to observe how carefully philosophers, who deplore the condition of world, and profess to expect its amelioration their speculations clear of every idea of Divine interposition? No builders of houses or cities were ever more attentive to guard the access of inundation and fire.

If He should but touch their prospective theories of improvement they would renounce them as defiled and fit only for vulgar fanaticism. Their system of Providence would be profaned by the intrusion of the Almighty. Man is to affect an apotheosis for himself, by the hopeful process of exhausting corruptions.

And should it take all but an endless series of ages, vices, and woes, to reach this glorious attainment, patience may sustain itself the while by the thought that when it is realized, it will be burdened with no duty of religious gratitude. No time is too long to wait, no cost too deep to incur, for the triumph of proving that we have no need of that one attribute of a Divinity, which creates the grand interest in acknowledging such a being the benevolence that would make us happy. But even if this triumph should found unattainable, the independence of spirit which has laboured for it must not at last sink into piety. This afflicted world, “this poor terrestrial citadel of man,” is to lock its gates and keep its miseries rather than admit the degradation of receiving help from God.</p></blockquote>

sophers-to-divine-intervention-in-human-affairs/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-3e878b279c" data-kw="">
<blockquote><p>As altered from the seventh to the first day of the week, the Sabbath should be kept by us, as we are enjoined to do so in the fourth commandment.

That precept requires us to devote one day in seven unto God; by abstaining “even from such worldy employments and recreations, as are lawful on other days, and spending the whole time in the public and private exercises of God’s worship, except so much as it to be taken upon in the works of necessity and mercy.” It is not disputed that the fourth commandment once required this, it is, however, denied that we are now bound to keep the Sabbath, with all the strictness which it enjoins.

To those who advocate a relaxed mode of observing the Sabbath, we reply; the fourth commandment was given by God, – it was once the duty of men to keep the Sabbath as required by that precept, – it is incumbent upon them to do so still – unless it can be shewn that it has been annulled or modified by divine authority. No such inference can be drawn from our spiritual necessities. Are not our hearts as carnal as were those of the Jews?

Are not our employments as secularizing? Had not they many other days, besides Sabbath, that were set apart for public worship, while we have no other? And have not we then as much need as they had, to spend one whole seventh part of our time in the public and private exercises of God’s worship? And are we not under stronger obligations to give a whole seventh of our time unto God, than the Jews were? Our privileges are greater than theirs, and shall our homage, therefore, be less?

The economy under which we live, is more spiritual than theirs, and we will not believe it, until we are expressly told so by God, that our Sabbaths should be less sacred. It is true, that there is no precept in the New Testament, that commands us to keep the Sabbath as strictly as we are required by the fourth commandment; but we must remember, that after a law is once enacted, it continues to bind unless it is repealed, although it be not enacted a second time; and, therefore, unless we can shew that the fourth commandment has been repealed, it is still binding upon us, although no similar law be found in the New Testament.

It is also true, that the Mosaical economy has come to an end, and abolished such things as were commanded only in the judicial or ceremonial law. The fourth commandment, however, has not its place in either of these laws, but in that law which was written by the finger of God upon the tables of stone. This law, the abrogation of the Mosaical economy did not affect; amid all that it swept away, it left every one of its precepts remaining.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-white.html">William White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Three Sermons on the Sabbath, Preached in September 1838</cite>, (Haddington: Neill &amp; Sons, 1838), pp 15-16.</span></figcaption>

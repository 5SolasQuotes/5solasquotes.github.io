</figure><figure class="quote" id="q-b07f9bac9e" data-kw="">
<blockquote><p>We have also the holy scriptures which declare unto us the wonderful works of God, by which things we may be lead to the knowledge of God without painted or carved images. Now peradventure some will say that Christ has a body, and likewise have saints, and therefore of them we may have images although of God there can be made no image. And further they wil say that the cause why images were forbid was peril of idolatry, and worshipping of them. So that where there is no such peril, we may have images. Yet as I will not utterly deny but they may be had, so I think it more convenient for Christ’s religion that they should be taken out of Christian men’s churches than that they should be placed in the temple [church building] of God. And of this my opinion I will show you certain good grounds, to the intent that whan you be demanded why we English men have no images in our churches, you may be able to make thereunto a reasonable answer, and that also in time to come you may declare to your children what abuses have crept into the church by the occasion of images…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Instruction into Christian Religion</cite>, (London: 1548), A Short Instruction Concerning the Ten Commandments, First Sermon, no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

tures%20which%20declare&amp;text=into%20the%20church%20by%20the%20occasion%20of%20images" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-170e2c1298" data-kw="">
<blockquote><p>What does it mean to have a god? or, what is God? Answer: A god means that from which we are to expect all good and to which we are to take refuge in all distress, so that to have a God is nothing else than to trust and believe Him from the [whole] heart; as I have often said that the confidence and faith of the heart alone make both God and an idol. If your faith and trust be right, then is your god also true; and, on the other hand, if your trust be false and wrong, then you have not the true God; for these two belong together, faith and God. That now, I say, upon which you set your heart and put your trust is properly your god. Therefore it is the intent of this commandment to require true faith and trust of the heart which settles upon the only true God, and clings to Him alone.… Whatever you lack of good things, expect it of Me, and look to Me for it, and whenever you suffer misfortune and distress, creep and cling to Me. I, yes, I, will give you enough and help you out of every need; only let not your heart cleave to or rest in any other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Large Catechism</cite>, First Commandment</span></figcaption>

</figure><figure class="quote" id="q-d779bccb41" data-kw="">
<blockquote><p>And indeed it [the Exodus] was the greatest typ of Christ’s redemption of any providential event whatsoever. This was by Jesus Christ, for it was wrought by Him who appeared to Moses to redeem that people. But that was Christ, as is evident, because He is called ‘the angel of the Lord,’ Ed. 3:2-3. The bush represented the human nature of Christ, who is called the ‘branch.’ This bush grew on mount Sinai or Horeb, a word that signifies a dry place, as the human nature of Christ was a root out of dry ground. The bush burning with fire, represented the sufferings of Christ, in the fire of God’s wrath. It burned, and was not consumed; so Christ, though He suffered extremely, yet perished not; but overcame at last, and rose from his sufferings. Because this great mystery of the incarnation and sufferings of Christ was here represented, therefore Moses says, ‘I will turn aside, and behold this great sight.’ A great sight he might well call it, when there was represented, ‘God manifest in the flesh,’ suffering a dreadful death, and rising from the dead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works</cite>, … ed. Edward Hickman (London: Ball, 1840), vol. 1, History of Redemption, period 1, pt. 4, p. 546</span></figcaption>

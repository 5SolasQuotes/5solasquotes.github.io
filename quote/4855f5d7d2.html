<main class="wrap"><figure class="quote" id="q-4855f5d7d2" data-kw="">
<blockquote><p>For if we be bound to hold out our left cheek to strangers which will smite us on the right cheek: how much more ought we to suffer an extreme and unkind husband? But yet I mean not that a man should beat his wife; God forbid that, for that is the greatest shame that can be, not so much to her that is beaten, as to him that does the deed. But if by such fortune thou chancest upon such an husband, take it not too heavily, but suppose thou, that thereby is laid up no small reward hereafter, and in this lifetime no small commendation to thee, if thou canst be quiet. But yet to you that be men, thus I speak: Let there be none so grievous fault to compel you to beat your wives. But what say I, your wives? no, it is not to be born with that an honest man should lay hands on his maid servant to beat her. Wherefore if it be a great shame for a man to beat his bondservant, much more [of a] rebuke it is to lay violent hands upon his freewoman. And this thing may be well understood by the laws which the Panims have made, which does discharge her any longer to dwell with such an husband, as unworthy to have any further company with her that does smite her. For it is an extreme point, thus so vilely to entreat her like a slave, that is fellow to thee of thy life, and so joined unto thee before time in the necessary matters of thy living. And therefore a man may well liken such a man (if he may be called a man, rather then a wild beast) to a killer of his father or his mother. And whereas we be commanded to forsake our father and mother, for our wife’s sake, and yet thereby do work them none injury, but do fulfill the Law of God… Who can worthily express the inconvenience that is to see what weepings and walings be made in the open streets when neighbors run together to the house of so unruly an husband, as to a Bedlem man, who goes about to overturn all that he has at home? Who would not think that it were better for such a man to wish the ground to open, and swallow him in, than once ever after to be seen in the market?… Understand that God has given thee children with her, and art made a father, and by such reason appease thyself. Doest thou not see the husbandmen what diligence they use to till that ground which once they have taken to farm, though it be never so full of faults? As for an example, though it be dry, though it brings forth weeds, though the soil cannot bear too much wet, yet he tills it, and so wins fruit thereof… But thou peradventure wilt say that she is a wrathful woman, a drunkard, and beastly, without wit and reason. For this cause bewail her the more. Chase not in anger, but pray unto Almighty God. Let her be admonished and helped with good counsel, and do thou thy best endevor, that she may be delivered of all these affections. But if thou shouldest beat her, thou shalt increase her evil affections: For frowardness and sharpness is not amended with frowardness, but with softness and gentleness. Furthermore, consider what reward thou shalt have at God’s hand: For where thou mightest beat her, and yet, for the respect of the fear of God, thou wilt abstain and bear patiently her great offences, the rather in respect of that Law which forbids that a man should cast out his wife what fault soever she be made the combred with, thou shalt have a very great reward, and before the receit of that reward, thou shalt feel many commodities. For by this meanes she shall bee more obedient, and thou for her sake shalt be made the more meek.</p></blockquote>

<blockquote><p>Finally Bavinck comes to the controversial topic of women voting for office bearers in the church. He begins this discussion with an overview of where things stand: he notes that there are many churches in America, Australia, Denmark, Norway, Iceland, and Switzerland where women vote. He points out that it was discussed and defended in the Netherlands as early as 1898 by Abraham Kuyper, as well as by pastors A.D.C Kok and C. Lindeboom. Bavinck notes that the issue did not seem to be a pressing one in the Netherlands of his day. Unlike in other countries, men were actively involved in Dutch church life and there didn’t seem to be any desire to have women voting for office bearers. He writes that, with such indifference, it would be foolish to press the issue. However, he notes that if we discuss it in principle, “there is little ground to condemn it.” Bavinck argues that women are equal members of the church with men. They have just as much an interest in having good office bearers as the men do. Because of their nature as women, they tend to actually have quite a great deal of interest in religious matters. Moreover, there are large numbers of widows, women married to “religiously indifferent men,” or women married to men who belong to another church. Without being able to vote, such women are all stripped of the opportunity to have an influence on church life. Bavinck strengthens his argument by noting that while women under the authority of their husbands in the home, as church members they receive the same benefits and should receive the same rights. He notes that young male communicant members who still live with their parents are subordinate to those parents, but yet they have the right to vote. This is unfair. Bavinck says the injustice becomes worse because women are allowed to raise objections to the election of an office bearer – yet they cannot vote. Then he notes that the vote in the church is not an exercise of power. The congregation only points out its preferences for office bearers; the consistory is responsible to call and appoint. He maintains that there is only one objection with any weight: if women can vote in the church, it will not be long before the church will be forced to have women standing as candidates. In other words, women’s voting will lead to women’s ordination. But Bavinck notes that this is an argument from fear. It is an argument that often persuades fearful minds concerned about novelties in the church. However, he points out, if the Scriptures are so strong that women may not serve as office bearers, then we have nothing to fear. The clarity of the Bible should prevent any such development. He then points out that it’s not unusual for people to be able to vote and not be able to stand as a candidate. One does not follow from the other. The requirements for eligibility to vote are often different from the eligibility requirements to stand as a candidate. In the Dutch situation of his time, a public servant, clergyman or teacher was not allowed to be a candidate in a city council election. Writes Bavinck, “Thus eligibility to any office in Scripture is bound by certain requirements, 1 Timothy 3; but no such limits are placed on the power to vote.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wes Bredenhof, ‘Herman Bavinck on Women in the Church’ (2021)</cite></span></figcaption>

justice+becomes+worse+because+women+are+allowed+to+raise+objections+to+the+election+of+an+office+bearer+%E2%80%93+yet+they+cannot+vote.+Then+he+notes+that+the+vote+in+the+church+is+not+an+exercise+of+power.+The+congregation+only+points+out+its+preferences+for+office+bearers%3B+the+consistory+is+responsible+to+call+and+appoint.+He+maintains+that+there+is+only+one+objection+with+any+weight%3A+if+women+can+vote+in+the+church%2C+it+will+not+be+long+before+the+church+will+be+forced+to+have+women+standing+as+candidates.+In+other+words%2C+women%E2%80%99s+voting+will+lead+to+women%E2%80%99s+ordination.+But+Bavinck+notes+that+this+is+an+argument+from+fear.+It+is+an+argument+that+often+persuades+fearful+minds+concerned+about+novelties+in+the+church.+However%2C+he+points+out%2C+if+the+Scriptures+are+so+strong+that+women+may+not+serve+as+office+bearers%2C+then+we+have+nothing+to+fear.+The+clarity+of+the+Bible+should+prevent+any+such+development.+He+then+points+out+that+it%E2%80%99s+not+unusual+for+people+to+be+able+to+vote+and+not+be+able+to+stand+as+a+candidate.+One+does+not+follow+from+the+other.+The+requirements+for+eligibility+to+vote+are+often+different+from+the+eligibility+requirements+to+stand+as+a+candidate.+In+the+Dutch+situation+of+his+time%2C+a+public+servant%2C+clergyman+or+teacher+was+not+allowed+to+be+a+candidate+in+a+city+council+election.+Writes+Bavinck%2C+%E2%80%9CThus+eligibility+to+any+office+in+Scripture+is+bound+by+certain+requirements%2C+1+Timothy+3%3B+but+no+such+limits+are+placed+on+the+power+to+vote.%E2%80%9D%0A%0A%E2%80%94+Herman+Bavinck%2C+Wes+Bredenhof%2C+%E2%80%98Herman+Bavinck+on+Women+in+the+Church%E2%80%99+%282021%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1a810adbbb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1a810adbbb.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/whether-ladies-have-the-right-to-vote-for-chu

<main class="wrap"><figure class="quote" id="q-315cc1113e" data-kw="">
<blockquote><p>It was the predicted peculiarity of the Man of Sin and Son of Perdition that he was to sit in the temple of God and show himself to be God. He was to oppose and exalt himself above all that is called God, and worshipped. The very essence of false worship, even under a profession of Protestantism, consists in setting aside the divine arrangements in the house of God and substituting our own. This is Popery in the germ; no matter under what name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anarchy in Worship or Recent Innovations Contrasted with the Constitution of the Presbyterian Church and the Vows of Her Office-Bearers</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), p. 15.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-75f12122c0" data-kw="">
<blockquote><p>…I will set down a catalogue of inventions of men used for religious ends and uses without any commandment of God, and that both before the Law and under the Law, and under the Gospel. First, before the Law we read of these things: The laying of the hand under the thigh in swearing, Gen. 24, etc. [Gen. 24:26, “And the man bowed down his head, and worshipped the Lord.”] Jacob’s pillar erected, as a religious monument, Gen. 28:18. Secondly, under the Law we read of these instances: [Josh. 7:6, “And Joshua rent his clothes, and fell to the earth upon his face before the ark of the Lord until the eventide, he and the elders of Israel, and put dust upon their heads.”] The altar of the two tribes and a half, Josh. 22:10 &amp; 27:30. [Josh. 24:25-27, “So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem. And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that was by the sanctuary of the Lord. And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the Lord which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God.] [1 Sam. 7:5-6, “Samuel said, Gather all Israel to Mizpeh, and I will pray for you unto the Lord. And they gathered together to Mizpeh, and drew water, and poured it out before the Lord, and fasted on that day, and said there, ‘We have sinned against the Lord.&#x27;”] David’s dancing and playing on all sorts of instruments and songs before the ark, 1 Chron. 13:8 and 15:16 and 2 Sam. 6:14. David’s wearing of a linen ephod, the garment of the Levites, 1 Chron. 15:27. David’s appointing of the offices of the Levites and his bringing in of the new order of singing men into the Temple, 1 Chron. 24 &amp; 25. The use of sackcloth and ashes in fasting. Solomon built another altar besides the altar of the Lord, 2 Chron. 7:7. Hezekiah kept the Passeover at a time not appointed by the Law, and the people kept it seven days longer, 2 Chron. 30:2-3, 23. About the celebration of the Passover, it is manifest that the godly Jews brought in of their own heads:

1. The gesture of sitting, which Christ Himself also used.

2. The solemn use of the cup, of which mention is made also that Christ used it, Lk. 22:17. The Rechabites abstinence not only from wine (according to the Law of the Nazarites), but from husbandry and houses, Jer. 35. The Jews had everywhere synagogues, which were not commanded by the Law, Lk. 7:5. [Jer. 34:18-19, “And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts thereof, The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;”] Mordecai appointed the feasts of Pur, or ‘lots’. Judas Maccabeus appointed the feast of Tabernacles, which our Saviour graced with his presence [Jn. 7:2]. Thirdly, under the Gospel: Our Savior Christ approved the gesture of sitting and the cup at the Passover, the Jewish synagogues, and the feast of Tabernacles. The apostle Paul used the Jewish ceremonies when they were no more the ordinances of God, as circumcision, shaving the head, purifying, vowing, contributing, yea sacrificing, Acts 21. Abstaining from meat sacrificed to idols. The observation of the Jewish Sabbath. The women’s coverings, 1 Cor. 11. The love-feasts. The holy kiss.</p></blockquote>

</figure><figure class="quote" id="q-843a56be0d" data-kw="">
<blockquote><p>The great, primary, responsible leader of all worship in the Church is our blessed Lord Himself – the minister of the true sanctuary which the Lord pitched, and not man. In this capacity He is pleased to say in the 22nd Psalm – and it is quoted in the New Testament too – “I will declare thy name unto my brethren; in the midst of the church will I sing praise unto thee.” On this verse Calvin has this beautiful comment:– “It thus appears that our Lord is the leader of our songs and chief composer of our hymns.” Are they uninspired hymns which Christ composes, and leads us in singing in the great congregation? He is spiritually present with His people in their worship in the sanctuary.

But were He bodily present, as in the synagogue of Nazareth, when there was given to Him the book of the prophet Isaiah, would you give Him any other book of song than the book of the Psalms of David, or other inspired songs of Scripture? Would you give Him other than His own Psalms to lead you in singing? – His own Psalms, in that they are composed by Himself; and His own Psalms, in that His soul sang them, with grace in His heart unto the Lord, in the days of His flesh. You maintain communion with Him, and He with you, when, in the praises of the sanctuary, you sing His Psalms.

You may think your hymns are in accordance with His Word, but the Psalms are His very Word itself. You can sing them in faith untainted with doubt, in the full assurance of faith, unshackled from the spirit of criticism which man’s word continually provokes, yea, demands – in that faith which cometh by hearing, when the hearing is the hearing of the Word of God, and which goeth forth in songs of faith, when the songs are the songs of the Spirit of God.</p></blockquote>

+when+the+hearing+is+the+hearing+of+the+Word+of+God%2C+and+which+goeth+forth+in+songs+of+faith%2C+when+the+songs+are+the+songs+of+the+Spirit+of+God.%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Psalms+and+Uninspired+Hymns.+Extracts+from+Speech+by+Dr.+Hugh+Martin%2C+in+the+General+Assembly+of+the+Free+Church%2C+3rd+June%2C+1872+in+Free+Presbyterian+Magazine&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F843a56be0d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/843a56be0d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/09/02/hugh-martin-on-christ-our-worship-leader/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

</figure><figure class="quote" id="q-5623f461a7" data-kw="">
<blockquote><p>It is not enough to justify such a choice and practice, that it be in itself or simply best, but that it be best in present circumstances and all things considered that ought to be considered in the present juncture…. The most sacred, external act of duty becomes a sin when it excludes that which is more a duty at that time… How long was sacramental obsignation [by circumcision and the Passover, Josh. 5:1-12] in the wilderness omitted! How much more may attending upon such an institution in what some may think a more eligible manner, if there be a reason that outweighs, when not the substance of the ordinance is wanting, but what is counted (perhaps by you) a fitter modus [mode, or way]?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience &amp; the Trinity… (d. 1705; Religious Tract Society, 1863), pp. 278-79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-097c7b8d46" data-kw="">
<blockquote><p>But they would make some clearing here by telling us that: ‘All who are acquainted with the principles and practices of our worthy predecessors, and of the learned and godly non-conformists in England, will easily see how far they are from their judgments and practices who follow the ways of separation.’ [1.] Bel•ke they still dwell beside evil neighbors, but which is worse, they are hardly believed, when men call to mind and consider how now of a long time still they took the patrociny [patronage] of all that were suspected to follow those ways. 2. What progress some of their chief and cried up men have made in those ways. 3. What affection they still carry to them and how familiarly they converse with them, even although excommunicated. 4. But especially how unavoidable separation is upon their grounds: For if it be a matter of conscience for them to join with others in civil duties that necessarily belong to the incorporation whereof both are members, sure much more in ecclesiastic [affairs].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-resolutioners.html">Scottish Resolutioners</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Member of the General Assembly | The Protestation given in by the Dissenting Brethren, to the General Assembly, July 21, 1652, Reviewed &amp; Refuted (Leith: Tyler, 1652)</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

fairs%5D." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-85e9dc4a2c" data-kw="">
<blockquote><p>We acknowledge separation from corruption, but not from the worship of corrupters, when they keep the foundation; the Samaritan-Church had not the foundation, but worshipped they knew not what, neither was there salvation in their Church, Jn. 4:2; but there was the true God worshipped among the Jews and salvation amongst them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbyterie in Scotland… (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’</cite>, p. 133</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“We acknowledge separation from corruption, but not from the worship of corrupters, when they keep the foundation; the Samaritan-Church had not the foundation, but worshipped they knew not what, neither was there salvation in their Church, Jn. 4:2; but there was the true God worshipped among the Jews and salvation amongst them.”

— Samuel Rutherford, A Peaceable &amp; Temperate Plea for Paul’s Presbyterie in Scotland… (London: Bartlet, 1642), ch. 10, ‘Whether or not it be lawful to separate from a true Church visible, for the corruption of teachers… where faith is begotten by the preaching of professed truth?’, p. 133">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+acknowledge+separation+from+corruption%2C+but+not+from+the+worship+of+corrupters%2C+when+they+keep+the+foundation%3B+the+Samaritan-Church+had+not+the+foundation%2C+but+worshipped+they+knew+not+what%2C+neither+was+there+salvation+in+their+Church%2C+Jn.+4%3A2%3B+but+there+was+the+true+God+worshipped+among+the+Jews+and+salvation+amongst+them.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Peaceable+%26+Temperate+Plea+for+Paul%E2%80%99s+Presbyterie+in+Scotland%E2%80%A6+%28London%3A+Bartlet%2C+1642%29%2C+ch.+10%2C+%E2%80%98Whether+or+not+it+be+lawful+to+separate+from+a+true+Church+visible%2C+for+the+corruption+of+teachers%E2%80%A6+where+faith+is+begotten+by+the+preaching+of+professed+truth%3F%E2%80%99%2C+p.+133&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F85e9dc4a2c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/85e9dc4a2c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=We%20acknowledge%20separation%20from%20corruption%2C%20but,the%20Jews%20and%20salvation%20amongst%20them." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9d904176a2" data-kw="">
<blockquote><p>That by giving out themselves in these meetings as the generality of the godly throughout the land, or delegates in a sort from them, they do cast an imputation upon the bulk of the national Church beside, who are against their way, and do not join with them in these courses, as not only wrong in that matter, but as not godly, some very few excepted. Which as we know to be a most false imputation (not many of these, of any rank, who owned the cause from the beginning, going along with them). So it is an evidence of a strange divisive and separating spirit in our Brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-sharp.html">James Sharp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Representation of the Rise, Progress &amp; State of the Present Divisions of the Church of Scotland (London, 1657)</cite>, p. 33</span></figcaption>

</figure><figure class="quote" id="q-4bd72e58b8" data-kw="">
<blockquote><p>I pray hear some of their words, the London [presbyterian] ministers (Vindication, p. 115), ‘Though we dare not make separation from a true Church… yet we do make separation in a true Church [by purging and reforming it…]’ Read over the whole answer and you may perceive their minds (p. 76)…</p></blockquote>

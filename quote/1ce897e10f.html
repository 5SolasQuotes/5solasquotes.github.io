<blockquote><p>We respond: it is further asked whether it be of a Scriptural or ecclesiastical use, or an ancient or new use.” 5 conclusions are given. 2nd Problem, ‘Whether the Old Testament Church from Moses to Ezra began to use and maintained liturgies?’, p. 361 3rd Problem, ‘Whether a liturgy from Ezra and the men of the great Synagogue (that consistory or Sanheidren, as it is termed in the Hebrew, beit deenu) was established, having been prescribed to the people of God, and was publicly used till Christ?’, p. 363 3 conclusions are given on p. 364. 4th Problem, ‘Whether forms &amp; litugies were established in the apostolic Church from the apostles to that Church, such that they have been prescribed to all succeeding churches?’, p. 364 3 conclusions. 5th Problem, ‘Whether a universal liturgy ought to be formed and written, and imposed on all the Churches throughout the whole globe?’, p. 365 3 reasons are given. 6th Problem, ‘Whether one provincial or national liturgy ought to be established, and introduced into all of its consociating churches?’, p. 367 4 conclusions. 7th Problem, ‘Whether liturgies in the national language, whatever is commonly used to write, ought to be taken up in the churches?’, p. 368 8th Problem, ‘Whether a liturgy in Churches already settled, from their first gathering or its introduction at the Reformation, may be changed?, p. 369 1 conclusion. 9th Problem, ‘What is the Gregorian or Roman service (named after Gregory VII) and what is the Mozarabic, or Gothic, and in what place were they used, or are used in the Roman Church?’, p. 370 [No 10th Problem] 11th Problem, ‘How far it is better for a populace having been accustomed to the Roman liturgies and rites from the Papacy to the Reformation, to carry them over, if they had been so engaged initially by the reformers, having purged and yet retained the Missal, Breviary and other liturgical books and rites?’, pp. 372-4 ch. 3, ‘Of Rituals or Ecclesiastical Ceremonies’, pp. 374-384 This chapter is on the general introductory principles of the nature and properties of ceremonies, including (1) their name, (2) their nature and definition, (3) division and (4) opposites. Under (1) Voet also briefly discusses adiaphora on p. 375. Under (2) Voet gives numerous principles and distinctions as to worship (and its kinds) in general (p. 375) before delineating distinctions about ceremonies in general (p. 376). p. 375, Voet distinguishes the following distinctions about worship: It is either natural or instituted. Natural is internal; instituted may be both internal and external. External is either alone or social, or private or public. Public worship is performed by the Church. p. 376, Ceremonies are either divine or human. Divine ceremonies have been immediately instituted by God; therefore their observance is necessary. Divine ceremonies are either political or ecclesiastical. Political are either general and perpetual, observance of natural decorum, or particular, as ceremonies of the judicial law of Moses. Ecclesiastical are sacred, mystical and religious, either of the Old Testament (before or after Moses) or of the New Testament. A human ceremony “which is observed in the practice of men, is called free. It is either civil or ecclesiastical. Civil is some external formality or a mode to be done between men, practiced by law or custom. These things are twofold: Either by a natural reason or necessity supporting, and therefore contributing to the essence or well being of something, such as a natural decorum or many aspects in the instruction of civil manners; or they are received by men as merely arbitrary and instituted. And such free ceremonies are either well-grounded or tolerated, or will be hissed at as vain, inept and rediculous as they may be seen openly in courts, halls, schools, barracks, colleges…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 2, ‘Some Questions on Liturgies &amp; Liturgical Actions Determined’, pp. 360-374 “We come now to the problems, which are either of sacred [Scriptural] history and are didactic, or of Church history.” | 1st Problem, ‘Whether ‘liturgy’ may designate a sacrifice properly so-called, it even being propitiating, or be a rule or order to be accomplished as like a sacrifice?’, p. 360</span></figcaption>

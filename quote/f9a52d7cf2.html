<main class="wrap"><figure class="quote" id="q-f9a52d7cf2" data-kw="">
<blockquote><p>Were we all bound together by a confession or subscription of the true fundamentals, and those other points that are next to fundamentals only, and there took up our Christianity and unity, yielding each other a freedom of differing in smaller or more difficult points, or in expressing ourselves in different terms, and so did live peaceably and lovingly together, notwithstanding such differences, as men that all knew the mysteriousness of Divinity, and the imperfection of their own understandings, and that here we know but in part [1 Cor. 13], and therefore shall most certainly err and differ in part: what a world of mischiefs might this course prevent?</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-843533abf8" data-kw="">
<blockquote><p>Let them [the Protesters] take heed if this be not a main step to Separation (which in words they seem to abhor), when as they protest and profess they will not hear us, so they would cast on us a kind of necessity to hold them as heathens and publicans; But to prevent this they have found a way of their own, and (as if they had not been of us) they are gone out from us, and setting up to do their own business without us, as they seem to intimate in the last page of their printed Paper after the Protestation, contrary to the very fundamentals of the discipline of our Kirk, which is, and has ever been professed to be by presbyteries, synods and national assemblies, duly subordinate one to another, all which their course overturns, while they walk in another way to make the matters of their propositions practicable, as they say.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-resolutioners.html">Scottish Resolutioners</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Member of the General Assembly</cite>, The Protestation given in by the Dissenting Brethren, to the General Assembly, July 21, 1652, Reviewed &amp; Refuted (Leith: Tyler, 1652), pp. 5-6</span></figcaption>

 target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9d87f1f662" data-kw="">
<blockquote><p>The student of Christian doctrine, because he strives after exactness of phrase, because he is conscious of the inadequacy of any one human formula to exhaust the truth, will be filled with sympathy for every genuine endeavour towards the embodiment of right opinion. Partial views attract and exist in virtue of the fragment of truth—be it great or small—which they include; and it is the work of the theologian to seize this no less than to detect the first spring of error. It is easier and, in one sense, it is more impressive to make a peremptory and exclusive statement, and to refuse to allow any place beside it to divergent expositions; but this show of clearness and power is dearly purchased at the cost of the ennobling conviction that the whole truth is far greater than our individual minds. He who believes that every judgement on the highest matters different from his own is simply a heresy must have a mean idea of the faith; and while the qualifications, the reserve, the lingering sympathies of the real student make him in many cases a poor controversialist, it may be said that a mere controversialist cannot be a real theologian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-f-westcott.html">B.F. Westcott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lessons from Work</cite>, pp. 84–85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-4800b7302b" data-kw="">
<blockquote><p>2. I do not speak against men’s seeking a reconciliation with Rome on just and honest terms. I think it one of the happiest works in the world, could it be accomplished: And I think the French are the only people to be first dealt with to that end. And I long to see providence so turn things about as that there might be a council first of these two nations for the attempting of such a work. And I am past doubt that it would be the happiest way to pull down Antichrist (if the Pope be he) that has been yet of late undertaken. But if ever such a thing be accomplished, it must be by uniting in one creed, as containing all things sufficient to salvation, which must be wholly taken out of Scripture and not such as the Trent Confession is: Upon which agreement they may openly acknowledge each other for brethren and true Churches, without compelling each other to uniformity in the lesser matters, but bearing with each others’ differences. I wish England such rulers as will faithfully prosecute such a pacific enterprise, without sinful compliance and betraying of the truth. Though I confess when I consider their principles and practices, I am afraid bishop Hall is in the right, that There’s no peace with Rome. Yet no fears must hinder men from any just and necessary enterprise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | ‘Objections Answered’, pp. 94-95</span></figcaption>

</figure><figure class="quote" id="q-aedb36876d" data-kw="">
<blockquote><p>Now of Churches faulty and corrupted, some raze the foundation; others, on the true foundation build timber, hay, stubble. From those we must separate; from these we may not. Peter’s is eternal, ‘Whither shall we go from Thee; Thou hast the words of eternal life.’ (Jn. 6:68) Where these words are found, woe be to us if we be not found. Amongst many good separations then, yours cannot be separated from evil, for that we should so far separate from the evil that therefore we should separate from God’s children in the communion of the holy things of God, that for some (after your worst done) not-fundamental corruptions, we should separate from that Church in whose womb we were conceived, and from betwixt whose knees we fell to God: in a word (as one of yours once said) to separate not only from visible evil, but from visible good, as all Antichristian: who but yours can think less than absurd and impious? Grant we should be clean separated from the world, yet if we be not, must you be separated from us?¹ ¹ Neque propter paleam relinquim are am Domini, neque propter pisces malos rumpimus retia Domini. Augustine, Epistle 48 Do but stay till God have separated us from Himself: will the wise husbandman cast away his corn-heap for the chaff and dust? Shall the fisher cast away a good draught because his drag-net has weeds? Does God separate from the faithful soul, because it has some corruptions, her inmates, though not her commanders?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Common Apology of the Church of England against the Unjust Challenges of the over-just Sect, commonly called Brownists</cite>, … (London: Macham, 1610), sect. 4, pp. 10-11</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3185d33397" data-kw="">
<blockquote><p>IV. Whence also it [original sin] is natural in us, because it is in us and in our nature—not as it was created upright from the beginning by God (for “God has made man upright,” Eccl. 7:29, which rectitude of the whole workmanship rejects crookedness and distortion), but as it is depraved by the fault of the first principle from which we all naturally descend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, (Geneva: de la Planche, 1625), p. 3 Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-1f18105752" data-kw="">
<blockquote><p>Desertion in sin is when, God withdrawing the assistance of his spirit, a man is left to fall into some actual and grievius sin. And for all this no man is to think that God is the author of sin, but only man that falls, and Satan. A resemblance of this truth we may see in a staff: which, if a man shall take and set upright upon the ground, so long as he holds it with his hand, it stands upright; but so soon as he withdraws his hand, though he never push it down, it falls of itself. In this desertion was the good king Hezekiah… God left him (namely, to the pride of his heart to exalt himself) in tempting him, that he might try out all that was in his heart. To this place appertain[s] Noah’s drunkenness, David’s adultery, Peter[‘s] denial of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chaine, or The Description of Theologie Containing the Order of the Causes of Salvation and Damnation</cite>, ... (Cambridge, 1600), A Declaration of Certain Spiritual Desertions…, p. 682</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-6536deebe0" data-kw="">
<blockquote><p>Objection 1: It seems that God does not exist; because if one of two contraries be infinite, the other would be altogether destroyed. But the word ‘God’ means that He is infinite goodness. If, therefore, God existed, there would be no evil discoverable; but there is evil in the world. Therefore God does not exist. … Reply to Objection 1: As Augustine says (Enchiridion, xi): Since God is the highest good, He would not allow any evil to exist in His works, unless His omnipotence and goodness were such as to bring good even out of evil. This is part of the infinite goodness of God, that He should allow evil to exist, and out of it produce good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/aquinas.html">Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae, pt. 1</cite>, q. 2, art. 3, ‘Whether God Exists’, obj. 1 &amp; reply to obj. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

</figure><figure class="quote" id="q-6ed08fe31b" data-kw="">
<blockquote><p>Then when we say all things to have been created by God, we include not those things which are evil, as they are evil. For those things are not from God, but from Satan, the parent of all evils. Execrable is the error of the Manichees, who contend that evil is from God, whom blessed Augustine very strongly repressed. And evil spirits, although they are from God, as spirits, yet from Him they are not, as evil spirits. For God saw all things which He had made, and they were very good (Gen. 1). But that we read, Isa. 45: ‘I am the Lord, and there is no other, forming light, and creating darkness, making peace, and creating evil,’ is not to be understood concerning the evil of iniquity and impiety, but concerning the evil of adversity and calamity: just as also that word, Amos 3: ‘If there is evil in the city, have I not done it?’ Thus ‘evil days’ are spoken of, in which we are pressed with some calamity and tribulation: which manner of speaking is common and vulgar, which also Christ used, saying: ‘Sufficient unto the day is the evil thereof.’ (Mt. 6) … That place, Prov. 16, where Solomon says: ‘The Lord works all things for Himself, and the impious also unto the evil day,’ is not to be adduced unto this operation of creation. For Solomon speaks there not concerning creation, although God Himself the principle and end of all things created all things for Himself: but concerning His providence and government, by which He so governs all things, even the minds of the impious, that they make unto His glory. Therefore it is to be taken heed, lest anyone from the words of Solomon badly understood and applied, should gather that God created the impious, as impious. For the impious as impious is not from God, but from the father the devil (Jn. 8).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wolfgang-musculus.html">Wolfgang Musculus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes Sacrae Theologiae 3rd</cite>, ed. (Basel: Hervagius, 1564), ‘On Creation’, trans. AI at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a></span></div>

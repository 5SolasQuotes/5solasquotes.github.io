<main class="wrap"><figure class="quote" id="q-dc25ddd417" data-kw="">
<blockquote><p>Objection #4: The Jewish church also instituted various practices — passing them on to subsequent generations — which nevertheless were not commanded, such as fasting in the fourth, fifth, seventh, and tenth month (Zechariah 7:5 and 8:19); the days of Purim (Esther 9:21-26); the feast of the dedication (John 10:22). In similar fashion the Reformed Church also has her traditions, which implies that also now we may and must uphold tradition.

Answer: The practice of fasting was commanded by God; the determination of necessity, time, and circumstances was left to the church (Joel 2). Special days of thanksgiving are also commanded, the occurrence and frequency of which are to be determined by the church. There is no basis in the Word, however, upon which the church may legislate the observation of such days for subsequent generations. Such practices should be denounced and the church should not observe them.

This is true also for our so-called feast days which ought to be eliminated. Regarding feast days consult Res Judicata by D. Koelman, as well as his other scholarly and devotional writings. Other external religious ordinances and circumstances are principally commanded in the Word of God, the stipulations of which are left to each individual church, and consequently are alterable according to time and place. In doing so, however, all superstition must be avoided and such practices must not have an adverse effect upon doctrine and practice. Thus, the perfection of the rule of Scripture will not be violated, nor will the use of unwritten traditions be advocated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 38-39.</span></figcaption>

<blockquote><p>Now England cannot abide this gear, they cannot be content to hear God’s Minister and his threatening for their sin. Though the Sermon be never so good, though it be never so true. It is a naughty fellow, a seditious fellow, he maketh trouble and rebellion in the Realm, he lacketh discretion, but the Ninevites rebuked not Jonas that he lacketh discretion, or that he spake out of time, that his Sermon was out of season made.

But in England if God’s Preacher, Gods Minister be any thing quick, or do speak sharply, then he is a foolish fellow, he is rash, he lacketh discretion. Nowadays if they cannot reprove the doctrine that is preached: then they will reprove the Preacher that he lacketh dew consideration of the times, and that he is of learning sufficient, but he wanteth discretion, what a time is this picked out to preach such things, he should have a respect and a regard to the time, and to the state of things, and of the Common weal.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b86bb291ee" data-kw="">
<blockquote><p>The Reformation doctrine of justification helps us to see that our salvation is the work of Christ for us. It also delivers us from a life of doubt and fear that causes us to wonder how God could possibly love sinners like us. It shows us that we have peace with God objectively because Christ has satisfied the demands of God for us, and it shows us subjectively because we can know confidently that by faith in Christ we are right with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/w-robert-godfrey.html">W. Robert Godfrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tabletalk</cite>, April 2004, p. 18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/fruits-of-justification.html">Fruits of Justification</a> › <a href="../topics/justification/fruits-of-justification/peace-with-god.html">Peace with God</a></span><span class="t"><a href="../topics/assurance-peace-and-joy/spiritual-peace-and-joy.html">Spiritual Peace and Joy</a> › <a href="../topics/assurance-peace-and-joy/spiritual-peace-and-joy/peace-of-conscience.html">Peace of conscience</a></span></div>

</figure><figure class="quote" id="q-1abfa1fa62" data-kw="">
<blockquote><p>In Christianity, the moment we believe, God imputes Christ’s perfect performance to us as if it were our own, and adopts us into His family. In other words, God can say to us just as He once said to Christ, “You are my Son, whom I love; with you I am well pleased.”</p></blockquote>

</figure><figure class="quote" id="q-4e9b07758c" data-kw="">
<blockquote><p>Osiander&#x27;s objection as to its being inconsistent with the nature of God, falls back upon himself; for though he clothes the saints with a twofold righteousness as with a coat of skins, he is, however, forced to admit, that without forgiveness no man is pleasing to God. If this be so, let him at least admit, that with reference to what is called the proportion of imputation, those are regarded as righteous who are not so in reality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.11.11</span></figcaption>

</figure><figure class="quote" id="q-8e85739b7f" data-kw="">
<blockquote><p>A man may be really justified before God, and yet not have the evidence or assurance of it in his own mind; wherefore that evidence or assurance is not of the nature or essence of that faith whereby we are justified, nor does necessarily accompany our justification. But this manifestation of a man’s own justification unto himself, although it depend on many especial causes, which are not necessary unto his justification absolutely before God, is not a second justification when it is attained; but only the application of the former unto his conscience by the Holy Ghost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>

<main class="wrap"><figure class="quote" id="q-5acd7519ef" data-kw="">
<blockquote><p>§XIII. The special subject, as to man, is either of denomination or the subject which, and this is the whole man; or of inhesion or the subject by which, and this, the remote and mediate, is the soul of man; the proximate and immediate is formally the will; but the intellect, according to Thomas, is so radically; according to Scotus, better, antecedently: because with Scotus and Henricus Gandavensis as authorities, the name of root signifies a true cause, but the intellect is not the true cause of the liberty of the will; but only the antecedent and the condition without which there would not be liberty in the will. … §XVIII. The object of free will is τὰ πρακτὰ, agibilia (doable things), proposed and shown to the will by the intellect. For the will is not borne toward the unknown: nor is anything willed, unless it is first known. Whence that trite saying: Of the unknown there is no desire. Therefore the intellect is not indeed properly the root of liberty, since root signifies a true cause, but causality cannot be attributed to the intellect with respect to liberty; but it is the antecedent and the condition without which the will would not choose freely; whence the will is called the rational appetite, since on the contrary the appetite in brutes is not free, because it is not rational. Nor yet is it always necessary for desiring an object that the intellect should practically judge that the proposed object is to be chosen, but sometimes a simple apprehension of the object as good suffices; which has its place before all others in the movements of the will which they call the very first, and which happen without deliberation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), pp. 8, 11 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aa1282cf42" data-kw="">
<blockquote><p>We are immediately conscious that we are free agents. The validity of this witness as regard our volitions themselves seems to be of the same weight and certitude that we have of our own cognition. Hence we are certain that something at least is contingent, namely our willing. To the extent that we can prove other actions or effects of this sort to be truly under the command or our will, to that extent is the existence of other contingent beings proved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-wolter.html">Allan Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), Wolter was a Scotist. | ‘On the Existence of Contingent Being’, p. 49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>only we may observe, that though there may such a thing be allowed to the Will, in actu primo [its first act], which the Schools call Simultas potentiae [simultaneous potentialities], by virtue where of the Will, according to its own nature, is capable of acting or not acting, or acting either thus or contrarily; and is capable of acting thus now, and is afterwards capable of revoking that act: nay indeed, this is the root of the liberty of the Will. Nevertheless, in actu secundo [the following act], or which the Schools call Potentia Simultatis [a potency for simultaneous alternatives], which is in the Wills applying itself to its act, it does not then act Indifferently, but upon choice, by which it is determined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Reply to Mr. George Kieth, as quoted in Muller, Divine Will</cite>, p. 290. Willard was a New England puritan and here follows the paradigm laid out in Turretin, that an initial free deliberation and power of the soul to alternatives ought to be distinguished from when the soul chooses its choice and no longer remains indifferent towards it, but determines it and follows through upon it.</span></figcaption>

al-necessity/#:~:text=only%20we%20may%20observe%2C%20that%20though,choice%2C%20by%20which%20it%20is%20determined&amp;text=only%20we%20may%20observe%2C%20that%20though%20there%20may&amp;text=but%20upon%20choice%2C%20by%20which%20it%20is%20determined" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8609c1b4f4" data-kw="">
<blockquote><p>The inability of sinful man is not… to be reckoned among those things which are absolutely impossible (adynata)… nor simplynatural (as that is natural from which we are called neither good nor bad; while this inability is certainly vicious and culpable); or as natural is contradistinguished from voluntary (as in a stone or brute there is a natural inability to speak). Our inability is in the highest degree voluntary; or as that is called natural which arises from a defect of natural faculty or power (such as the inability to see in the blind, to walk in the paralytic, to rise in the dead). Our inability does not exclude, but always supposes in man a natural power to understand and will… For although the phrase can in some measure be tolerated when understood of the natural power of willing (never taken away from us in whatever state we may be; as that by which we are distinguished from the brutes), still it cannot be admitted when we speak of the moral disposition of the will to good; not only to willing, but to willing well. Concerning this alone we dispute with our opponents…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, sections 39-40 of Question 4, ‘Whether the free will in a state of sin is so a servant of and enslaved by sin that it can do nothing but sin…’ in Institutes (P&amp;R), vol. 1, 10th Topic, pp. 681-83</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

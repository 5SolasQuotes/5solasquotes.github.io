<blockquote><p>At the meeting of the Reformed Presbyterian Synod of July 1829 there was a heated debate between Thomas Houston and John Paul and John Alexander over whether or not a section of Alexander’s congregation in Linenhall Street, Belfast could receive the sacraments from the minister of Knockbracken (Houston). The report one of the local newspapers tells us:

[A] part of the Belfast congregation were displeased by the choice of the Minister, (Rev. J. Alexander) – they in consequence attach themselves to the Knockbracken congregation, (Rev. T. Houston;) but according to the rules of the Reformed Church, no one Minister is allowed to come into the bounds of another to exercise his ministerial duties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belfast-commercial-chronicle.html">Belfast Commercial Chronicle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belfast Commercial Chronicle</cite>, 18 July 1829.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-74fed37c58" data-kw="">
<blockquote><p>…if the laws of the Church obliged the conscience in such a [absolute] manner, as that the transgression of them were a sin, the observance of them would then be a good action… …the persons against whom I dispute, pretend the violation of ecclesiastical laws to be therefore only sinful, because it implies an infraction of the law of God, who has commanded us to obey the Church: but if not to do what the Church enjoins be to violate the law of God, must it not be allowed, that to comply with her injunctions, is to observe the same divine law, and consequently to perform a good and virtuous act?… Lastly, if ecclesiastical laws obliged the conscience, the Church would only have changed her yoke by the establishment of Christianity: she would still continue a slave; and the only difference would be, that whereas under the [Mosaic] Law her servitude was terminated with respect to God, she would now be in bondage to men… …ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean La Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Ch. 10, ‘Of Ecclesiastical Ordinances’ &amp; ‘Remarks on the 10th Chapter’ in The Christian Casuist: or, a Treatise of Conscience (London: 1705). pp. 64-92, pp. 71-75</span></figcaption>

</figure><figure class="quote" id="q-76badbb90b" data-kw="">
<blockquote><p>…he [Paul] speaks of many special positive precepts and rules of policy, as of poor widows, the alms to be given to them; the not rebuking of an elder, the office of elders governing, and of elders laboring in the Word and doctrine, the not receiving an accusation against an elder, but under two or three witnesses, the public rebuking of those who offend publicly, the not admitting to the ministry raw and green soldiers not tried, and many other particulars of policy, of all which he says gravely, [1 Tim. 5] v. 21, ‘I charge thee before God and the Lord Jesus Christ, and the elect angels, that thou observe these things, etc.’ Certainly, [in Greek] these things were not one commandment, but all the precepts of faith and of Church-Government spoken of in this epistle; and truly I shall think that Paul who particularizes that Timothy should not drink water, but a little wine because of his infirmity, and of bringing with him the cloak that he left at Troas, and the parchments, 2 Tim. 4, does far more specify all the positives of policy and writ how all the Timothies and pastors are to behave themselves in the Church of God… … …for other positive things of policy that should be of perpetual use, and not all of the same kind, and of equal necessity…</p></blockquote>

<blockquote><p>4th Distinction. A calling may be expressly and formally corrupt in respect of the particular intention of the ordainers and of the particular Church, ex intentione ordinaris et operantis [out of the intention of the ordainers and of the one working]. Thus Luther’s calling to be a monk was a corrupt calling, and eatenus, and ‘in that respect’ he could not give a calling to others. But that some calling may be implicitly and virtually good and lawful in respect of the intention of the Catholic Church and ex intentione operis &amp; ipsius ordinationis [out of the intention of the work and the ordination itself], he was called to preach the Word of God. …

7. A calling to the ministry is either such: [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51].

8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself by a silver key, having given the prelate a bud. The ordinance of God is conferred upon him, and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving. … 11. The question, if such a pastor be called lawfully, is a question of fact, not a question of law; [it is] as this [case]: if such an one be baptized and there be an invincible ignorance in a question of fact which excuses. And therefore we may hear a gifted pastor taken and supposed by the Church to have the Church’s calling, though indeed he received no calling from the Church at his entry. … 3. We are nowhere forbidden in God’s Word to hear teachers sent and called, but only wolves in sheep skins, void of all calling, and intruders: for pastors may be antichristian in the manner of the entry, as Caiaphas… 3. Yea, and brook an antichristian calling, as prelates do and have done in Britain, and yet their ministry be valid. For that the calling of a minister be valid and his ministerial acts not null, it is sufficient that the governing Church give him a calling, either by themselves, their express call, their silence, or tacit consent, or their approbation communicating with him in his ministry, or by these to whom the Church resigned her power, or by these who stand in place of the Church, though prelates invade the place of the Church: yet: [1.] because first they themselves be pastors and have power to teach and baptize as pastors called of Christ. Mt. 18:19. 2. Because they stand for the Church, the Church approving or someway by silence consenting (as in the case of Caiaphas’s entry to the priesthood) thereunto. These who are baptized of them are not rebaptized, and these who are ordained pastors by them are not reordained, but have a calling to the ministry and do validly confer a calling upon others. Yea, many of great learning think that at the beginning of Reformation thousands being under popery baptized by midwives and private persons, were never rebaptized, not that they think such baptism valid, but where the sacrament is wanting, ex invincibili ignorantia facti, ‘out of an invincible ignorance of a fact’, such that way [the] baptized do indeed want the Lord’s seal; but we cannot for that say that they are no better than infidels and unbaptized Turks and Jews, because:

1. Their being born in the visible Church gives a federal holiness, as all of Jewish parents had a federal right to circumcision and were, eatenus, ‘insofar’, separated from the womb.

2. Because their profession of that Covenant whereof baptism is a seal, separates them sufficiently from infidels, though they want the seal external. But our divines esteem, and that justly, baptism administrated by women or such as have no calling, to be no baptism at all; for which let the reader see Calvin, Institutes, bk. 4, ch. 15, sect. 20; Epistle 326; Beza, Libel., Questione de Baptism; the learned Rivet, in Cathol. Orthod., tome 2, tract 2, q. 7. We stand not for what Bellarmine, Maldonatus, Gretserus and other papists say on the contrary.</p></blockquote>

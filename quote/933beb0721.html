<main class="wrap"><figure class="quote" id="q-933beb0721" data-kw="">
<blockquote><p>But there are some so grossly ignorant of what prayer is that they make use of the Ten Commands, and Belief [the Apostles’ Creed] as a prayer: so void are they of the knowledge and spirit of God that they cannot discern betwixt God’s commands to themselves and their own requests to God, betwixt his speaking to men and their speaking to Him, between their professing of Him before men and praying and confessing to Him; all this is but forged imaginary worship, worship falsely so called which the Father seeks not and receives not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Principles of Christian Religion… ([Glasgow] 1666 / 1667), on Jn. 4:24, 2nd Sermon</cite>, p. 133</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bdf4968223" data-kw="">
<blockquote><p>And to speak briefely, this worshipping of God, which is to serve in spirit, is reduced unto four principal points: which are adoration, trust, invocation, and giving of thanks. Adoration is an humble and religious submission, whereby we utterly submit ourselves unto God, and that in all things. Trust is whereby we rest in Him, considering the power, wisdom and high goodness wherewith He is adorned: For which things we cleave unto Him; neither do we think that He will forsake or frustrate us. Invocation is: whereby we fly unto God, in all perils, and adversities: as which know that He is everywhere at hand, and that, according to his promises, He both can and will succor us with his defence. Giving of thanks is, whereby we refer all good things unto Him, as unto the first author… But spiritual worshipping consists altogether of faith and charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Most Learned &amp; Fruitful Commentaries… upon… Romans… trans. H.B. (London: Daye, 1568), | on Romans 1, verse 9, pp. 7 &amp; 9</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-f64932c74e" data-kw="">
<blockquote><p>Thus there are certain devout Jews, so called, yet they stirred up persecution against Paul, Acts 13:50; 17:17. They were exceedingly affectionate and devout in their traditional worship they had of God; and so none [were] greater enemies to spiritual worship than they: So true is that of the apostle: ‘The wisdom of the flesh is enmity to God; and it is not, nor can be subject to Him,’ Rom. 8:7. [There is] No greater adversary in the world to the pure worship of God, than a man’s natural reason and carnal apprehensions, destitute of Scripture directions; all the false and superstitious worship which ever came into the Church (and she was scarce ever free) did flow from this fountain: a carnal and human judgment [about] what was fit and orderly, what was pleasing to God and what was displeasing. Austin observed this long ago; and certainly, the simplicity, and pure spiritual worship of God is very offensive and troublesome to carnal apprehensions. When therefore thou art to judge what is the best worship pleasing to God, and wherein He does most delight, do not consult with thy own methinks, or what custom and education has engaged thee to, but to what the Scripture informs therein.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining… (London, 1652) | section 7, sermon 57</cite></span></figcaption>

</figure><figure class="quote" id="q-63e52b3daf" data-kw="">
<blockquote><p>I do not here conceive that the Church acknowledges she has cast off her garments of Christ’s righteousness; for then how should she remain the spouse of Christ? Yea, how then should her heart have been otherwise than asleep too? But only she pleads she should appear too naked if she should open to Christ, if she should worship Him in the simplicity and nakedness of his simple ordinances.</p></blockquote>

<blockquote><p>That it is the property of the faithful man to be fully persuaded of the truth of those things that are delivered in the holy scripture, and not to dare either to reject or add any thing thereunto . For if whatsoever is not of faith be sin, as the Apostle saith, and faith is by hearing, and hearing by the word of God; then whatsoever is without the holy scripture, being not of faith, must needs be sin.</p></blockquote>

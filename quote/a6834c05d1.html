<main class="wrap"><figure class="quote" id="q-a6834c05d1" data-kw="">
<blockquote><p>It is impossible fully to express the great consolation which arises from the thought of the cross of Christ to those who are thus earnestly engaged in the crucifixion of the flesh. By his stripes, O Christian, he has sanctified and sweetened stripes of every sort to you. While they fell on his blessed body, they were blessed by him. Who art you, that you should presume to demand a life exempt from the rod in every shape, since you see that the Son of God himself, who came into the world without sin, did not leave it without suffering. Let it suffice you, that through Christ the sting of the curse is extracted from your sorrows, and that “by his stripes you are healed.” If it should be your lot, in common with Apostles, to be beaten with rods for the name of Christ, esteem it a joy and an honor that you are accounted worthy “to fill up that which is behind of the afflictions of Christ in your flesh.” The memorials of the ancients and all the historical records of the Church, abound with instances of men and women, boys and girls, who, superior to every feeling of pain, smiling and singing, and transported with celestial joy, presented to astonished spectators, not merely their limbs torn with lashes, but even their bones made bare by stripes, and the innermost recesses of their bowels exposed. To what was this owing? The reason is, that, animated by the stripes and cheered by the Spirit of Christ, they felt nothing unpleasant in their sufferings, but on the contrary experienced that the severest strokes were no sooner inflicted by the executioner than cured by the wounds of their Saviour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, trans. Donald Fraser, vol. 2 (Khull, Blackie &amp; Co., 1823), 108–09. NB: Translation modernized.</span></figcaption>

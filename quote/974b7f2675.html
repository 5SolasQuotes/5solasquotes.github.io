<main class="wrap"><figure class="quote" id="q-974b7f2675" data-kw="">
<blockquote><p>Regeneration is God’s action in elect sinners, redeemed, actively justified and called through Christ, by which He substantially (realiter) turns them from corruption to new life (or holiness), that they may henceforth live unto God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Heinrich Heppe, Reformed Dogmatics ed. Bizer, trans. Thomson (1950; Wipf &amp; Stock, 2007), ch. 20, ‘Calling’, section 17, pp. 518-9, citing Voet, II, 436 &amp; 449</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“Regeneration is God’s action in elect sinners, redeemed, actively justified and called through Christ, by which He substantially (realiter) turns them from corruption to new life (or holiness), that they may henceforth live unto God.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7f4e0e68b5" data-kw="">
<blockquote><p>(3) [‘Regeneration’ as taken] Most Strictly: For the Grace proper only to those who attain salvation in the work itself, and therefore for the donation of habitual faith, by which we apprehend the blood of Christ, our hearts are purified from dead works to serve the Living God. Heb. 9:14, i.e., by which our intellect, so evil from our youth, Gen. 8, is illuminated to know Christ, John 17:3, ‘And this is eternal Life.’ etc. Our will, so perverse, is so corrected that it rests in Christ alone. Ps. 73:25. Phil. 3 from v. 7 to v. 12 inclusive: ‘What things were gain to me, those I counted loss for Christ.’ Also v. 12, ‘Apprehended by Christ, that I may apprehend.’ In one Word: By which a man who before was plainly dead, is perfectly brought from spiritual death into spiritual life, Eph. 2:1, ‘And you He made alive, who were dead in trespasses and sins.’ Also vv. 5 &amp; 6. To this regeneration we [Grebenitz et al.] attribute, with the excellent Mr. President [Samuel Strimesius], operating grace. It is otherwise called conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elias-grebenitz.html">Elias Grebenitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), Disputation 1, ‘On Regeneration in General’, p. 7 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>
<div class="actions"><button class="copy" data-copy="“(3) [‘Regeneration’ as taken] Most Strictly: For the Grace proper only to those who attain salvation in the work itself, and therefore for the donation of habitual faith, by which we apprehend the blood of Christ, our hearts are purified from dead works to serve the Living God. Heb. 9:14, i.e., by which our intellect, so evil from our youth, Gen. 8, is illuminated to know Christ, John 17:3, ‘And this is eternal Life.’ etc. Our will, so perverse, is so corrected that it rests in Christ alone. Ps. 73:25. Phil. 3 from v. 7 to v. 12 inclusive: ‘What things were gain to me, those I counted loss for Christ.’ Also v. 12, ‘Apprehended by Christ, that I may apprehend.’ In one Word: By which a man who before was plainly dead, is perfectly brought from spiritual death into spiritual life, Eph. 2:1, ‘And you He made alive, who were dead in trespasses and sins.’ Also vv. 5 &amp; 6. To this regeneration we [Grebenitz et al.] attribute, with the excellent Mr. President [Samuel Strimesius], operating grace. It is otherwise called conversion.”

— Elias Grebenitz, ‘Theological Treatise on Regeneration in Three Disputations [&amp; on Conversion &amp; Preparation]’ trans. AI (Becman, 1671), Disputation 1, ‘On Regeneration in General’, p. 7 Grebenitz (1627-1689) was a German reformed professor of logic, metaphysics and theology at Frankfurt.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%283%29+%5B%E2%80%98Regeneration%E2%80%99+as+taken%5D+Most+Strictly%3A+For+the+Grace+proper+only+to+those+who+attain+salvation+in+the+work+itself%2C+and+therefore+for+the+donation+of+habitual+faith%2C+by+which+we+apprehend+the+blood+of+Christ%2C+our+hearts+are+purified+from+dead+works+to+serve+the+Living+God.+Heb.+9%3A14%2C+i.e.%2C+by+which+our+intellect%2C+so+evil+from+our+youth%2C+Gen.+8%2C+is+illuminated+to+know+Christ%2C+John+17%3A3%2C+%E2%80%98And+this+is+eternal+Life.%E2%80%99+etc.+Our+will%2C+so+perverse%2C+is+so+corrected+that+it+rests+in+Christ+alone.+Ps.+73%3A25.+Phil.+3+from+v.+7+to+v.+12+inclusive%3A+%E2%80%98What+things+were+gain+to+me%2C+those+I+counted+loss+for+Christ.%E2%80%99+Also+v.+12%2C+%E2%80%98Apprehended+by+Christ%2C+that+I+may+apprehend.%E2%80%99+In+one+Word%3A+By+which+a+man+who+before+was+plainly+dead%2C+is+perfectly+brought+from+spiritual+death+into+spiritual+life%2C+Eph.+2%3A1%2C+%E2%80%98And+you+He+made+alive%2C+who+were+dead+in+trespasses+and+sins.%E2%80%99+Also+vv.+5+%26+6.+To+this+regeneration+we+%5BGrebenitz+et+al.%5D+attribute%2C+with+the+excellent+Mr.+President+%5BSamuel+Strimesius%5D%2C+operating+grace.+It+is+otherwise+called+conversion.%E2%80%9D%0A%0A%E2%80%94+Elias+Grebenitz%2C+%E2%80%98Theological+Treatise+on+Regeneration+in+Three+Disputations+%5B%26+on+Conversion+%26+Preparation%5D%E2%80%99+trans.+AI+%28Becman%2C+1671%29%2C+Disputation+1%2C+%E2%80%98On+Regeneration+in+General%E2%80%99%2C+p.+7+Grebenitz+%281627-1689%29+was+a+German+reformed+professor+of+logic%2C+metaphysics+and+theology+at+Frankfurt.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7f4e0e68b5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7f4e0e68b5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/only-the-initial-aspect-of-regeneration-is-by-the-lord-working-alone-man-being-wholly-passive-therein/#:~:text=3%29%20%5B%E2%80%98Regeneration%E2%80%99%20as%20taken%5D%20Most%20Strictly,grace.%20It%20is%20otherwise%20called%20conversion&amp;text=3%29%20%5B%E2%80%98Regeneration%E2%80%99%20as%20taken%5D%20Most%20Strictly%3A%20For%20the&amp;text=Strimesius%5D%2C%20operating%20grace.%20It%20is%20otherwise%20called%20conversion" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-34e17462fb" data-kw="">
<blockquote><p>In one word, then, by repentance I understand regeneration, the only aim of which is to form in us anew the image of God, which was sullied, and all but effaced by the transgression of Adam. So the apostle teaches when he says, ‘We all with open face beholding as in a glass the glory of the Lord, are changed into the same image from glory to glory, as by the Spirit of the Lord.’ Again, ‘Be renewed in the spirit of your mind,’ and ‘put ye on the new man, which after God is created in righteousness and true holiness.’ Again, ‘Put ye on the new man, which is renewed in knowledge after the image of him that created him.’ Accordingly, through the blessing of Christ we are renewed by that regeneration into the righteousness of God from which we had fallen through Adam, the Lord being pleased in this manner to restore the integrity of all whom He appoints to the inheritance of life. This renewal, indeed, is not accomplished in a moment, a day, or a year, but by uninterrupted, sometimes even by slow, progress God abolishes the remains of carnal corruption in his elect, cleanses them from pollution, and consecrates them as his temples, restoring all their inclinations to real purity, so that during their whole lives they may practise repentance, and know that death is the only termination to this warfare.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>3. ‘Regeneration by Faith…’ in Institutes of the Christian Religion tr. Henry Beveridge (1559; Edinburgh: Calvin Translation Society, 1845), vol. 2, bk. 3, pp. 149-82</cite>, pp. 159-60</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-5d08c12ed3" data-kw="">
<blockquote><p>God’s sentence of life to those of us who are the objects of justification is executed when he regenerates us through his Holy Spirit—that is, when he creates within us that new life that he has assigned to us already by means of that earlier sentence of justification.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

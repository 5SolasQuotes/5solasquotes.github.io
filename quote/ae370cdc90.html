<main class="wrap"><figure class="quote" id="q-ae370cdc90" data-kw="">
<blockquote><p>What concupiscence is, it is better known of itself than that it need any declaration. It is a desire and an affection of the mind which the Greeks do rightly call epithumian, by which we endeavor to draw unto our use by any means that which does like us. And the strength of this desire is so great that unless we do obtain the things which we do desire, we do judge ourself to be here utterly unhappy. The contrary of concupiscence is the withdrawing of the mind, whereby we do turn and flee with a certain horror and abomination from those things which do mislike us, as the contrary of love is hate and the contrary of joy is sorrow. The nature of it is to extend itself unto those things which we have not. Else (as Paul says) how shall a man hope for that which he has already; so likewise is here to be said: Those things which a man has already, why shall he hope for them? Wherefore those things truly be in the reach of our concupiscence which by no right pertain unto us, but be in the power of others. . 2. How many sorts of concupiscences there be Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness. This corruption of our concupiscence is gotten of the old serpent, not grafted in our flesh of God. Wherefore we must beware that we do not ascribe our whole concupiscence neither to God, neither to Satan. The strength of desiring is given us from God, the strength of evil desiring from Satan: like as we do take it of God that we do live, and that we live evil we take it of Satan, the beginner of our malice. By this distinction we do foresee that we do not deny the work of God in us for the work of Satan, nor attribute the work of Satan unto God. It is the part of a wise man to consider diligently in himself the work of Satan and the work of God. I call it the work of God whatsoever is naturally given us. We take of God not only this outward body and soul whereby we do live, and the mind whereby discoursing we do understand and judge, but also the affections of the heart, such as desire is, the power to withstand, love, hate, hope, fear, joy, sorrow, anger, favor and mercy, etc. And these affections be to great use: and there is great cause why they be grafted in our nature. He made us in such sort that we do not receive those things that be necessary simply at his hand without any perseverance of necessity going before, or affection of desire, like stocks and stones, but moved by the perseverance of our necessity we do desire it even as the dry ground does most gladly receive and drink up the moisture that comes by the dews poured from heaven. The reason of this is that first when we do covet things necessary for us, we must turn to our Creator, the fountain of all goodness and the preserver of all things that be made: and ask of Him such things as we have need of. Secondly, that the gifts of God be so much the more welcome unto us after we have received them the more that we desired and besought them. God grafted in us also a sense of rejoicing, which we feel in the use of his gifts, and an effect of joy which rises in our hearts as oft as we do obtain our purpose. The cause of them is, that rejoicing and pleasantly using the gifts of God, we may be carried up in our minds to God the giver of them and give thanks unto his goodness with all our heart. He gave us also the strength of hope. The use of it is that we must trust and tarry for those things which we do desire and ask of God when they are not given by and by, and that we do travail with earnest endeavoring, devising and working in those things which are to be achieved by our own industry and labor. So these be trimly linked together: to have need, to desire, to ask of god, to hope in faith, to receive with joy, to use with liking, to give thanks to the giver of all good things, heartly to commend his goodness and with affection of love to be ravished unto Him. All these things would be utterly decayed if you take away the desire from them. Thus far forth desire and concupiscence is good, the rather necessary, and put into our nature by God. Take away all desire and concupiscence and the knot of wedlock shall decay, the desire of issue [children], the multiplication of our kind, the commodity of eating and drinking, the conservation of life, the study of wisdom, justice, humanity, goodness, mercy, the fellowship and company of man’s life, and all things shall be half dead in man. If it cannot be that we may lack all things, and that nothing that we do, see or hear should like us while we be in this flesh, then it cannot be that we may desire nothing. Therefore to desire nothing pertains not to the living, but to the dead. When we do consider these things, let us weigh withal how great the wickedness of Satan was that he came at the beginning in our first parents with the poison of his malice, corrupted and depraved a thing so necessary, and sticking fast in the very bowels of our life.</p></blockquote>

<blockquote><p>But still the images of such things live in my memory, of which I have spoken much, which my habitual way of life has deeply imprinted there, and they occur to me awake, although lacking strength, but in sleep not only to the point of pleasure, but even to the point of consent and an act very like the reality. And such is the force of illusion in my soul and in my flesh, that false visions persuade my sleeping mind of things which true visions cannot persuade my waking mind. Cannot your hand, O All-Powerful God, heal all the languors of my soul and by a more abundant grace extinguish even the lascivious motions of my sleep? You will increase in me more and more, O Lord, your gifts, that my soul may not be rebellious to itself and that not only in sleep it may not perpetrate those turpitudes of corruptions through animal imaginations even to the flow of the flesh, but may not even consent to them…</p></blockquote>

— Johannes Hoornbeeck, ‘A Practical Theological Disputation on Sin, pt. 2’ tr. Onku with AI (Leiden: Johann Elsevir, 1660), sect. 15-20 Latin | XVII. And so even during dreams we sometimes sin, being conscious of which, pious people more diligently commend themselves to God before sleep, lest they be defiled by any foul or evil thought, and they specially confess to God and grieve over sins committed during sleep. Augustine did this in his Confessions, Book 10, Chapter 30:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+still+the+images+of+such+things+live+in+my+memory%2C+of+which+I+have+spoken+much%2C+which+my+habitual+way+of+life+has+deeply+imprinted+there%2C+and+they+occur+to+me+awake%2C+although+lacking+strength%2C+but+in+sleep+not+only+to+the+point+of+pleasure%2C+but+even+to+the+point+of+consent+and+an+act+very+like+the+reality.+And+such+is+the+force+of+illusion+in+my+soul+and+in+my+flesh%2C+that+false+visions+persuade+my+sleeping+mind+of+things+which+true+visions+cannot+persuade+my+waking+mind.+Cannot+your+hand%2C+O+All-Powerful+God%2C+heal+all+the+languors+of+my+soul+and+by+a+more+abundant+grace+extinguish+even+the+lascivious+motions+of+my+sleep%3F+You+will+increase+in+me+more+and+more%2C+O+Lord%2C+your+gifts%2C+that+my+soul+may+not+be+rebellious+to+itself+and+that+not+only+in+sleep+it+may+not+perpetrate+those+turpitudes+of+corruptions+through+animal+imaginations+even+to+the+flow+of+the+flesh%2C+but+may+not+even+consent+to+them%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Johannes+Hoornbeeck%2C+%E2%80%98A+Practical+Theological+Disputation+on+Sin%2C+pt.+2%E2%80%99+tr.+Onku+with+AI+%28Leiden%3A+Johann+Elsevir%2C+1660%29%2C+sect.+15-20+Latin+%7C+XVII.+And+so+even+during+dreams+we+sometimes+sin%2C+being+conscious+of+which%2C+pious+people+more+diligently+commend+themselves+to+God+before+sleep%2C+lest+they+be+defiled+by+any+foul+or+evil+thought%2C+and+they+specially+confess+to+God+and+grieve+over+sins+committed+during+sleep.+Augustine+did+this+in+his+Confessions%2C+Book+10%2C+Chapter+30%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5e9a744e0c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5e9a744e0c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/concupiscence-or-desires-of-pre-motions-to-sin-are-sinful/#:~:text=But%20still%20the%20images%20of%20such,may%20not%20even%20consent%20to%20them&amp;text=But%20still%20the%20images%20of%20such%20things%20live&amp;text=flesh%2C%20but%20may%20not%20even%20consent%20to%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-634fea95c0" data-kw="Holiness">
<blockquote><p>Observe the holiness and perfection of God&#x27;s law, which forbids the first motions and risings of sin in the heart. The laws of men take hold of actions; but the law of God goes further—it forbids not only sinful actions—but sinful desires.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, The Tenth Commandment</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-is-truly-sin.html">Concupiscence is truly sin</a></span><span class="t"><a href="../topics/the-law-of-god/second-table-commandments-5-10.html">Second Table (Commandments 5-10)</a> › <a href="../topics/the-law-of-god/second-table-commandments-5-10/covetousness.html">Covetousness</a></span></div>

— Thomas Watson, The Ten Commandments, The Tenth Commandment">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObserve+the+holiness+and+perfection+of+God%27s+law%2C+which+forbids+the+first+motions+and+risings+of+sin+in+the+heart.+The+laws+of+men+take+hold+of+actions%3B+but+the+law+of+God+goes+further%E2%80%94it+forbids+not+only+sinful+actions%E2%80%94but+sinful+desires.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+The+Ten+Commandments%2C+The+Tenth+Commandment&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F634fea95c0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/634fea95c0.html">Permalink</a><a class="src" href="https://ccel.org/ccel/watson/commandments" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-ccdb759494" data-kw="">
<blockquote><p>But first of all, it is necessary to consider certain changes which took place in Christian thought on this subject during the preceding centuries. Be the origin of the doctrine in the attempt to smooth the rough places of law for the sake of the weak or tender conscience, or in the practical necessity for a guiding principle of division as a kind of ready reckoner for pastoral purposes, or in both these causes, a change of deep significance came about in its structure. At first, and up to the close of the patristic era, the key-note of the distinction was oþjectivity. The external act is the criterion, so that there is a regular tabula of sins, the commission of any of which involves the sinner in mortal sin. But by the time of the Schoolmen, and notably, of in the works of St. Thomas Aquinas, a tremendous ethical course, change in the idea has come about. There are still sins which are reckoned as mortal, suo genere [in its genera], but the governing factor is no longer the external act. It is the deliberateness with which the act is committed. In other words, intention or motive is receiving recognition as the determining element in assessing the gravity of sin. It was to Peter Abelard [c. 1079–1142)] that Aquinas and his fellows were indebted for this improved idea: In the Scito Te Ipsum [Know Yourself, by Abelard] the discussion of sin moves forward out of the realm of externals. Consequent on this stressing of deliberateness at the expense of drawing a clear line between what was mortal and what venial. This indeterminacy. inevitably paved the way for laxity in the computation of the guiltiness of certain sinful acts.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-675aaeb028" data-kw="">
<blockquote><p>She who bare (really) bare; and although she was a virgin when she conceived, she was a wife when she brought forth her son. Now, as a wife, she was under the very law of opening the womb, wherein it was quite immaterial whether the birth of the male was by virtue of a husband’s co-operation or not; it was the same sex that opened her womb. Indeed, hers is the womb on account of which it is written of others also: ‘Every male that opens the womb shall be called holy to the Lord.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Flesh of Christ, 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-31e2552aa2" data-kw="">
<blockquote><p>We by no means think or teach that the relics of the saints should be held in contempt, or treated in an irreverent and irreligious manner, but that they should be given that place, and be held in that regard, which the testimonies of Scripture we have quoted show. It does not follow from this, however, that we should gather from the cogitations of human reason, or learn from the examples of the heathen or of any people, or that everyone ought to figure out for himself, with what veneration the relics of the saints are to be honored; but the same Scripture which teaches that the relics of the saints are to be considered precious also shows the mode and manner of their true veneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part IV, First Topic (Relics of the Saints), Sec. II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/relics.html">Relics</a></span></div>

</figure><figure class="quote" id="q-46d7c2f8f1" data-kw="">
<blockquote><p>He [Isaiah] even describes, in Isaiah 7:14, the Mother of Christ, how she is to conceive and bear Him without injury to her virginity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/luther.html">Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Preface to the Prophet Isaiah’</cite>, (1528) in Luther’s Works, 35.275</span></figcaption>

</figure><figure class="quote" id="q-eab23cb342" data-kw="">
<blockquote><p>According to His humanity, He, Christ, our Savior, was the real and natural fruit of Mary’s virginal womb (of which Elizabeth, filled with the Holy Spirit, said to her in Luke 1:42: “Blessed is the fruit of your womb!”). This was without the co-operation of a man, and she remained a virgin after that. Everything else that a mother imparts to a child was imparted by Mary, the mother of God’s eternal Son. Even the milk He sucked had no other source than the breasts of this holy and pure mother.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on John, chs. 1-4</cite>, (1539) in ed. Jaroslav Pelikan, Luther’s Works (St. Louis: Concordia Pub. House, 1955), 22:23-24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-0b346e138f" data-kw="">
<blockquote><p>Objection 1. Yet our [Romanist] adversaries quarrel against this most rich and plentiful treasure of the holy Scriptures, alleging that we receive many things by tradition which are not in Scriptures, and yet we believe them; as Mary’s perpetual virginity and the baptism of infants? We make not Mary’s perpetual virginity any matter of religion, but a likely opinion so far as it can be maintained; that it were an unseemly and unfitting thing for a sinful man to use to the act of generation the vessel which was chosen and consecrated by the holy Ghost to so high an use as was the bringing forth of the Savior of the world; it has warrant from the apostle’s charge, Phil. 4:8, of doing whatsoever is honest, whatsoever is of good report, whatsoever is praise-worthy, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity: Or, the Sum and Substance of Christian Religion, Eighth Edition</cite>, ... (1645), ‘A Large Explication of the Body of Christian Religion’, p. 20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

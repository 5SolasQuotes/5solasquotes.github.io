<main class="wrap"><figure class="quote" id="q-faf351f8de" data-kw="">
<blockquote><p>And here let us premise that Presbyterians admit that every church on earth has some power in this matter, intrusted to her by her Head. They admit that the church possesses what an eminent divine has termed the power of arrangement. That is, Christ permits every church to arrange all those circumstantial modes of worship, which though in general necessary by divine precept, are yet in particulars to be determined by human prudence. Such, for example, as the regulating the time at which public worship shall commence on the Sabbath, the place in which it shall be conducted, and things of a like nature. These are things which do not concern the essence or form of Christ’s ordinances or the moral conduct of Christians; they are matters which are connected with the regular proceedings of any society, and which human prudence is competent to settle.

But we ask, Is there not a plain and wide distinction between these and unwarranted human inventions? Does it follow that because the church is free to arrange matters like these, that therefore she is at liberty to enact rites which are neither required in Scripture, nor implied in, nor deducible from any injunction of the Bible? Does it follow that therefore she has a right to decree ceremonies which make important changes in Christ’s sacraments, and which are imposed on his people as indispensable terms of communion? Unquestionably not.

But this is what the English church claims. Presbyterians maintain that she is not justified in doing so. For this, the writer on “The Church” seems to think them chargeable with inconsistency. “Every church visible on earth, says he, must have its usages.” We admit that Presbyterians have usages respecting church order, which, be it remembered, are not unauthorised by Scripture, and not imposed upon conscience; but we protest (and we do so with perfect consistency) against the claim set up by the Church of England to enact laws which are unsanctioned by the law of Christ, and to which there is required from his people an implicit and unqualified submission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-porter-goudy.html">Alexander Porter Goudy</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourse IV. Worship of the Presbyterian Church in Presbyterianism Defended, and the Arguments of Modern of Prelacy Examined and Refuted, in Four Discourses, by Ministers of the Synod of Ulster</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95eab27e0c" data-kw="">
<blockquote><p>Verse 5… But David was not the man he had appointed for this work, and therefore though the Lord commended David for this holy intention, as is evident, 1 Kings 8:18, ‘And the Lord said unto David my father, ‘Whereas it was in thine heart to build an house unto my name, thou didst well that it was in thine heart,” and made many gracious promises unto him at this time, vv. 10-12, etc. to testify how well He took it that he had such a purpose in his mind: yet withal He made known to him that He meant not that it should be done by him, but by his son… Verse 6… Though David’s intent was generally in itself good, insomuch that the Lord Himself commended him for it, as is manifest in that place before cited, 1 Kings 8:18, yet it was not without some mixture of error: for herein he failed, because he undertook to do it without any particular direction or warrant from God, led hereto only by the judgment of his own reason, that it was not fit God should dwell within curtains, when He dwelt in an house of cedar; and therefore though the Lord told him that his purpose was in the general commendable, yet withall He rejected his purpose and discovered thereby that he should have waited his leasure and direction, and disproved his reason…</p></blockquote>

<blockquote><p>Speaking at a Belfast Anti-Slavery Society meeting for the visit of the Revd Henry Highland Garnet in April 1849, the Revd Isaac Nelson (PCI minister) predicted that history would favourably judge William Wilberforce for his exertions in the cause of emancipation:

The exertions of Wilberforce in the cause of slavery were lightly regarded for a time: such men as George Canning, William Pitt, and Charles James Fox were wont to look on him as a good-natured, simple, rather dogmatic, and perservering enthusiast; but history, which would judge more accurately, would give to the name a high niche in the temple of moral truth.</p></blockquote>

<blockquote><p>But to celebrate solemnly the day of a man’s birth, it has been a custom of all nations: and in my judgment, it is not done amiss, so that there be used a godly modesty. Surely it is a notable gift that we may be reckoned among the number of God’s creatures. And who doubts, but that it is well done, to give thanks unto God for it, and in thanksgiving to testify the joyfulness of mind by an outward token of some modest banket? The use of honest pleasures is such, as they have always godliness joined with them.</p></blockquote>

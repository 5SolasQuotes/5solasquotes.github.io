</figure><figure class="quote" id="q-e31424f139" data-kw="">
<blockquote><p>So at this day, the public weal does sometime promise rewards unto such as can best handle their weapons, to the intent their citizens may be the better exercised. Howbeit, there must be heed taken, that the kinds of plays be not hurtful and pernicious, and that therein be no danger of killing, maiming, or miserable tearing them, which either exercise themselves or be present, or be assembled to behold. And this kind of games is forbidden Ad legem Aquiliam, in the law, Nam ludus, and in the decrees De tormentis. Those things which of their owne nature be not evil, but are evil oftentimes through that which ensues ought to be forbidden.</p></blockquote>

<blockquote><p>Part III will find the exact ‘covering’ prohibited to men while ‘praying or prophesying’ (11:4) is less certain [compared to the woman’s covering], though it seems Paul proscribed Corinthian men from wearing any dishonoring covering in the assemblies, namely which hung down from their heads, whether material, a hair–bun or long hair, yet not wreaths, helmets, hats or turbans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Part III of 1 Corinthians – Head-Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022), pp. 232-57, p. 9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c03c3aae9e" data-kw="">
<blockquote><p>…(as that sex is prone to follow the fashion) and accordingly cast off their veils, and discovered their faces immodestly in the congregation, and thereby (as the apostle speaks) dishonored their heads; that is, were unseemly accoutred, and dressed on their head: which he proves by three Arguments; partly from nature, which having given women their hair for a covering, taught them to be covered, as a sign of subjection; the manner of this covering being to be measured by the custom of the nation: Lastly, by an argument à pari, from men, for whom even themselves being judges, it would be an uncomely thing to wear a vail, that is, a woman’s habit; so by the like reason, was it as uncomely for a woman to be without a vail, that is, in the guise and dress of a man. And howsoever the devils of the gentiles, sometimes took pleasure in uncomeliness, and absurd garbs and gestures; yet the God whom they worshipped with his holy angels, who were present at their devotions, loved a comely accommodation, agreeable to nature and custom, in such as worshipped him. For this cause therefore (says he) ought a woman to have a covering on her head, because of the angels. Lastly, he concludes it, from the example and custom both of the Jewish and Christian Churches, neither of which had any such use, for their women to be unveiled in their sacred assemblies: If any man (says he) be contentious, (that is, will not be satisfied with these reasons) let him know, that we, (that is, we of the circumcision) have no such custom, nor the Church of God. For so, with St. Ambrose, Anselm, and some of the ancients, I take the meaning of the apostle to be in those words.</p></blockquote>

</figure><figure class="quote" id="q-2c2f68e531" data-kw="">
<blockquote><p>Sixthly, He tells us page 32, That in all Reformed Churches men used to enter into the place of public worship with their hats off, which is as great an untruth, as ever dropped from writers’ pen, unless it be understood of places of public worship, whilst public worship is actually performed in them, and if it may be so understood, then the Presbyterians would hugely approve of it. By the [Westminster] Directory it was enjoined that, all enter the assembly not irreverently, but in a grave and seemly manner: gravity and seemliness do include putting off the hat, which yet would be a ridiculous action, if a man should use it, as too many now a days do as oft as they go through the Church, though none be met for worship, and though they themselves intended no worship: nor does the Directory any where condemn the manner which Mr. Durell tells us has obtained among the French Ladies, viz. to unmask themselves when they come into the temple; provided they do not unmask themselves out of a vain or wanton design; if they should do so, they know by whom they are condemned. [I but says Mr. Durell, the devoutest sort both of men and women, use[d] to kneel and make a prayer for God’s blessing, before they sit down, and this the [Westminster] Directory prohibits.] Had he said that the devouter sort use a short prayer when they took no seats, and came to perform no service to God; then he had said something to excuse the actings of some among us. The peoples making a secret prayer before they sit down in their seats, is not forbidden by the Directory, unto all, or unto any, but these who come into the Church the public worship being begun, and whether it be more meet for such to betake themselves to their private devotions, or to join with the Assembly in that ordinance that is in hand, let the learned judge for they are wise. Seventhly, All might have been spared that is brought, page 33, Of people’s standing bare in time of divine service, and at the administration of sacraments: In the very Church of Scotland all are uncovered at the administration of the sacraments; here in England men had left off to put on their hats in time of sermon (which Mr. Durell seems to distinguish from Service) had Mr. Calamy and others been hearkened to. Eighthly, Above all, what need we be told, page 22, that Calvin wore a gown and a cap: Were not presbyterians accustomed so to do in the universities? Those sent down by the two Houses to Cambridge, did all of them preach in the University Church in their gowns, and in their hoods;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-hickman.html">Henry Hickman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bonasus vapulans</cite>, [A Bull being Whipped], or, Some Castigations given to Mr. John Durell for Fouling Himself &amp; Others in his English &amp; Latin Book by a Country Scholar (London, 1672) Hickman (bap.1629-1692) was an English puritan who was ejected in 1662., pp. 55-57</span></figcaption>

+by+the+Directory%2C+unto+all%2C+or+unto+any%2C+but+these+who+come+into+the+Church+the+public+worship+being+begun%2C+and+whether+it+be+more+meet+for+such+to+betake+themselves+to+their+private+devotions%2C+or+to+join+with+the+Assembly+in+that+ordinance+that+is+in+hand%2C+let+the+learned+judge+for+they+are+wise.+Seventhly%2C+All+might+have+been+spared+that+is+brought%2C+page+33%2C+Of+people%E2%80%99s+standing+bare+in+time+of+divine+service%2C+and+at+the+administration+of+sacraments%3A+In+the+very+Church+of+Scotland+all+are+uncovered+at+the+administration+of+the+sacraments%3B+here+in+England+men+had+left+off+to+put+on+their+hats+in+time+of+sermon+%28which+Mr.+Durell+seems+to+distinguish+from+Service%29+had+Mr.+Calamy+and+others+been+hearkened+to.+Eighthly%2C+Above+all%2C+what+need+we+be+told%2C+page+22%2C+that+Calvin+wore+a+gown+and+a+cap%3A+Were+not+presbyterians+accustomed+so+to+do+in+the+universities%3F+Those+sent+down+by+the+two+Houses+to+Cambridge%2C+did+all+of+them+preach+in+the+University+Church+in+their+gowns%2C+and+in+their+hoods%3B%E2%80%9D%0A%0A%E2%80%94+Henry+Hickman%2C+Bonasus+vapulans+%5BA+Bull+being+Whipped%5D%2C+or%2C+Some+Castigations+given+to+Mr.+John+Durell+for+Fouling+Himself+%26+Others+in+his+English+%26+Latin+Book+by+a+Country+Scholar+%28London%2C+1672%29+Hickman+%28bap.1629-1692%29+was+an+English+puritan+who+was+ejected+in+1662.%2C+pp.+55-57&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2c2f68e531.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2c2f68e531.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-history-of-head-coverings/head-coverings-in-the-post-reformation-era/#:~:text=Sixthly%2C%20He%20tells%20us%20page%2032,their%20gowns%2C%20and%20in%20their%20hoods&amp;text=Sixthly%2C%20He%20tells%20us%20page%2032%2C%20That%20in&amp;text=Church%20in%20their%20gowns%2C%20and%20in%20their%20hoods" rel="noopener" target="_blank">Read it online · Reformed Books Online

<blockquote><p>Therefore they are idle dreamers who extend God’s gracious calling to each and every human being [such as Arminians]. For they mix up God’s love towards humanity (whereby God embraces all people as his own creatures) with the love whereby He has ordained to take into his grace a select number of people from the common crowd of sinners who are perishing for their own wickedness, and to guide them in Jesus Christ, the Son in whom He delights.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ec40d74b95" data-kw="">
<blockquote><p>It must also be borne in mind that elsewhere Hoeksema’s [who denies common grace] definition of the word ‘goodness’ is very different from the meaning commonly given to it by Reformed writers and, more particularly, its usage in the Westminster Standards. For example, in Answer 4 of the Shorter Catechism, we read, ‘God is a Spirit, infinite eternal and unchangeable in his being, wisdom, power, holiness, justice, goodness and truth’. The Shorter Catechism has been criticised by some at this point for not using the terms ‘grace, mercy, love’, but it must be recognised that in the minds of the Westminster Assembly the term goodness included all of these. This explains why the term ‘goodness’ is expanded in the Larger Catechism as equivalent to ‘most merciful and gracious, long-suffering, and abundant in goodness’ (Answer 7) and in the Westminster Confession as ‘most loving, gracious, merciful, longsuffering, abundant in goodness…forgiving iniquity, transgression and sin; the rewarder of them that diligently seek him…’ (Ch. 2.1). The terms ‘good’ and ‘goodness’ (Heb. tob) are consistently linked to God’s mercy or faithful love (Heb. chesed), for example in Psalms 23:6, 25:7-8, 86:5, 100:5, 145:9 etc., and when Psalm 34:8 is referred to in 1 Peter 2:3, the term is rendered ‘gracious’ (Gk. chreestos: A.V. ‘kind’). No doubt this explains why the term is rendered ‘gracious’ in the 1650 Metrical Psalter rendering Psalm 86:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-silversides.html">David Silversides</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Free Offer: Biblical &amp; Reformed</cite>, (Marpet Press, 2005), p. 16-17.</span></figcaption>

<blockquote><p>[Margin Note:] What sparkles of grace all have For the first: God engages all men as Christ’s debtors thus far: that it is mercy that they live or have any opportunity of seeking God, whatever be the means, natural or supernatural; whereas for the sin of Adam God might by a like justice have destroyed the world and all mankind, vanity is penally inflicted on all the servants for treason of the master against the King of Heaven and earth; but in Christ there be two mitigations: 1. One is that the servants are not destroyed for the sin of the master. 2. That as the forefated lord is restored, so the sick servants groaning under vanity shall be delivered from that bondage they come under for the sin of man, Rom. 8:20-22. Hence it is, though we be outlaws by nature, that now by a privilige of grace from the Mediator, the tenants receive and lodge the master because Christ has taken off the statute and act of forfeiture. 2. No man living on earth, but he is beholding to Christ (though many know Him not) for common helps of providence, and experiences do teach him some more of God by nature. 3. The sound of Christ, God revealed in the Gospel in the apostles’ ministry, is declared and is gone to the ends of the earth and to the nations, Ps. 19:4; Rom. 10:18.</p></blockquote>

<blockquote><p>[7.] Seventhly, Get this principle rooted in you, That it is the delight of Christ to give poor sinners an interest [legal right] in Himself. He is not only able to do it, but it is his delight to do it. Christ’s soul is in nothing more. Witness his leaving his Father’s bosom; witness his laying down his crown; witness those many sufferings and deaths that He went through in this world; witness those gospel acclamations, Mark 16:16, Rev. 22:17; witness those persuasive exhortations and gracious impetrations [obtaining by asking or petition] and entreaties, Isa. 53:11, Matt 11:28, 2 Cor. 5:20; witness divine injunctions and comminations [threatening of divine vengeance], 1 John 5:23, Matt 11:21; witness those pathetical lamentations, Matt 23:37, Luke 19:42, Ps. 81:13; and witness the inward motions and secret excitations of his blessed Spirit, Gen. 6:3, all which speak out his great willingness and delight to save poor sinners; so in Ps. 40:7,8, ‘I delight to do thy will, O my God; thy law is in my heart;’ or, as the Hebrew has it b’tok m’ee, ‘It is in the midst of my bowels.’ Now mark, the will of the Father was the salvation of sinners. This was the will of the Father, ‘That Jesus Christ should seek and save them that are lost,’ Matt 18:11. Now says Christ, ‘I delight to do thy will, O my God;’ it is the joy and rejoicing of my heart to be a-seeking and a-saving lost sinners. When Christ was an hungry, He went not into a victualling house [a house of eating], but into the temple, and taught the people most part of the day, to show how much He delighted in the salvation of sinners, etc. [Footnote: Christ did so much delight, and his heart was so much set upon the conversion and salvation of the Samaritans, that He neglected his own body to save their souls, as you may clearly see in John 4.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unsearchable Riches of Christ in Works</cite>, vol. 3, p. 206</span></figcaption>

— Thomas Brooks, The Unsearchable Riches of Christ in Works, vol. 3, p. 206">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5B7.%5D+Seventhly%2C+Get+this+principle+rooted+in+you%2C+That+it+is+the+delight+of+Christ+to+give+poor+sinners+an+interest+%5Blegal+right%5D+in+Himself.+He+is+not+only+able+to+do+it%2C+but+it+is+his+delight+to+do+it.+Christ%E2%80%99s+soul+is+in+nothing+more.+Witness+his+leaving+his+Father%E2%80%99s+bosom%3B+witness+his+laying+down+his+crown%3B+witness+those+many+sufferings+and+deaths+that+He+went+through+in+this+world%3B+witness+those+gospel+acclamations%2C+Mark+16%3A16%2C+Rev.+22%3A17%3B+witness+those+persuasive+exhortations+and+gracious+impetrations+%5Bobtaining+by+asking+or+petition%5D+and+entreaties%2C+Isa.+53%3A11%2C+Matt+11%3A28%2C+2+Cor.+5%3A20%3B+witness+divine+injunctions+and+comminations+%5Bthreatening+of+divine+vengeance%5D%2C+1+John+5%3A23%2C+Matt+11%3A21%3B+witness+those+pathetical+lamentations%2C+Matt+23%3A37%2C+Luke+19%3A42%2C+Ps.+81%3A13%3B+and+witness+the+inward+motions+and+secret+excitations+of+his+blessed+Spirit%2C+Gen.+6%3A3%2C+all+which+speak+out+his+great+willingness+and+delight+to+save+poor+sinners%3B+so+in+Ps.+40%3A7%2C8%2C+%E2%80%98I+delight+to+do+thy+will%2C+O+my+God%3B+thy+law+is+in+my+heart%3B%E2%80%99+or%2C+as+the+Hebrew+has+it+b%E2%80%99tok+m%E2%80%99ee%2C+%E2%80%98It+is+in+the+midst+of+my+bowels.%E2%80%99+Now+mark%2C+the+will+of+the+Father+was+the+salvation+of+sinners.+This+was+the+will+of+the+Father%2C+%E2%80%98That+Jesus+Christ+should+seek+and+save+them+that+are+lost%2C%E2%80%99+Matt+18%3A11.+Now+says+Christ%2C+%E2%80%98I+delight+to+do+thy+will%2C+O+my+God%3B%E2%80%99+it+is+the+joy+and+rejoicing+of+my+heart+to+be+a-seeking+and+a-saving+lost+sinners.+When+Christ+was+an+hungry%2C+He+went+not+into+a+victualling+house+%5Ba+house+of+eating%5D%2C+but+into+the+temple%2C+and+taught+the+people+most+part+of+the+day%2C+to+show+how+much+He+delighted+in+the+salvation+of+sinners%2C+etc.+%5BFootno

<main class="wrap"><figure class="quote" id="q-06015b364f" data-kw="">
<blockquote><p>The Church may be corrupted many ways, in doctrine, ordinances, worship, etc. And there are degrees of this corruption; the doctrine in some remote points, the worship in some rituals of man’s invention or custom. How many Churches do we find thus corrupted, and yet no separation of Christ from the Jewish Church, nor any commandment to the godly of Corinth, etc. to separate. I must in such a case avoid the corruption, hold the communion—But if corruptions invade the fundamentals, the foundation of doctrine is destroyed, the worship is become idolatrous; and what is above all, if the Church impose such laws of her communion as there is a necessity of doing or approving things unlawful, in that case, ‘Come out of Babylon.’ The Churches of Protestants so separated from Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sacrament, p. 239 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’, p. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

<blockquote><p>The supremacy was advanced in such a way, and to such a height, as never any Christian Church acknowledged:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

— John Currie, An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+supremacy+was+advanced+in+such+a+way%2C+and+to+such+a+height%2C+as+never+any+Christian+Church+acknowledged%3A%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+An+Essay+on+Separation%3A+or+a+Vindication+of+the+Church+of+Scotland+contra+the+Seceders&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2a29f19240.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2a29f19240.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=The%20supremacy%20was%20advanced%20in%20such,as%20never%20any%20Christian%20Church%20acknowledged&amp;text=The%20supremacy%20was%20advanced%20in%20such%20a%20way&amp;text=a%20height%2C%20as%20never%20any%20Christian%20Church%20acknowledged" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f5ed4238e4" data-kw="">
<blockquote><p>It is one thing to deny total communion, and another to separate but secundum quid for some act or part; And that is either a great and necessary part or some small or indifferent thing or ceremony. It is one thing to separate locally by bodily absence, and another mentally by schismatical principles. It is one thing to separate from a church as accusing it to be no church of Christ, and another to separate from it only as a true Church, but so corrupted as not to be communicated with. It’s one thing to judge its communion absolutely unlawful, and another only to forsake it for a better which is preferred: It’s one thing to depart willfully, and another to be unwillingly cast out. It’s one thing to depart rashly and in haste, and another to depart after due patience, when reformation appears hopeless. It is one thing to remove upon religious reasons, and another upon civil or domestical, or corporal [reasons].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood</cite>, … (London, 1679), sect. 6, pp. 38-39</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

nline · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2f7e6abfd9" data-kw="">
<blockquote><p>It may be noted here that the term ‘Cameronian’, often loosely applied to the adherents of Cameron and Cargill, was originally coined about 1678 or 1679 to describe, disparagingly, those who shared [Richard] Cameron’s views on the supremacy [of the English and Scottish king] and Indulgence (cf. The Nonconformist’s Vindication, 1700, p. 16; A True and Impartial Relation of Bothwell Bridge, 1797, p. 16 [1751, p. 20]). It did not, however, gain much currency until after the Revolution of 1688, when it was used to denote those elements of the United Societies which did not join the Revolution Settlement (cf. [Patrick Walker] Six Saints of the Covenant, vol. I. p. 251)¹ ¹ [Walker says previously in the volume: “I am reflected upon, and that several times to my face, by all divided parties, especially Dissenters, and particularly by these of them commonly called M’Millanites, but quite wrong designed, who should be called Hamiltonians after Robert Hamilton, who was the only man (as I shall afterwards instruct) that led them in these untroden, dangerous paths of positive disowning of the State, and separation from the Church, and [from] all others that dare not nor will not go their lengths in principles and practices, proclaiming the same to the world;” Ibid., pp. 138-39] The term was never owned by those to whom it was applied, and it is uniformly described in their literature as a ‘by-name’ or ‘nick-name’ (cf. A Short Memorial of Sufferings and Grievances, 1690, title page). To the same effect are some remarks by John M’Main (Earnest Contendings, 1723, p. 376) when in taking Wodrow severely to task for using the term in his History he asserts, ‘He calumniates and fixes upon these faithful witnesses of Jesus Christ that stigma, or name of reproach, wherewith their enemies had branded them, calling them after a man, and falsely alleging that they termed themselves so, and labours to make his readers, in this and future generations, believe the calumny thus confirmed, that they were not Presbyterians. But he cannot produce one instance among all the cloud of witnesses, whom he so reproaches, evincing that ever any of them did so term themselves.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/maurice-grant.html">Maurice Grant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>No King but Christ: the Story of Donald Cargill</cite>, (Durham: Evangelical Press, 1988), p. 253, ch. 9, endnote 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>4. Suppose the general Assembly should ratify and confirm the unjust sentence of the inferior judicature, or annul their just sentence, the people of God are not obliged to stand to either the one or the other. So we disown the point which our Brethren delivered to us in their papers for union sought by us, as nothing belonging to the essence of presbyterial government, but reject it as unsound, tyrannical and popish.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a96796ee1c" data-kw="">
<blockquote><p>Took bread. Matthew 26:26 , it is said, “ as they were eating, ” i.e. during the repast, “ Jesus took bread, ” that is, he took of the bread lying on the table; and as it was at the time of the Passover, there is no doubt that the bread used was unleavened. It was the thin Passover bread of the Jews. But as no part of the significancy of the rite depends on the kind of bread used, as there is no precept on the subject, and as the apostles subsequently in the celebration of the ordinance used ordinary bread, it is evidently a matter of indifference what kind of bread is used. It was however for a long time a subject of bitter controversy. At first the Latins and Greeks used leavened bread; when the Latins introduced the unleavened wafer from superstitious fear of any of the fragments being dropped, the Greeks retained the use of fermented bread, and accused the Latins of Judaizing. Romanists and Lutherans use unleavened wafers; Protestants generally ordinary bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1878 | This quote was compiled by Andy Webb</span></figcaption>

v>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1c273677ba" data-kw="">
<blockquote><p>…the Rejoinder [in opposition to Ames] answers that sopping of bread in wine is worse than the cross: 1. Because the cross makes no alteration, of what Christ did ordain, saying ‘Do this.’ 2. It is not substituted in the place of baptism, as sops in wine were by those heretics in place of the [Lord’s] Supper. 3. It is not esteemed an instrumental sign of any grace given by the use of it, as they took their sops to be. 4. Their sopping destroyed the very sacrament. …But [Ames answers]: 1. Addition is as evil as alteration. For when Christ said, ‘Do this,’ He meant as well, do this only, as do this all. Fac hoc totum: fac hoc tantum: as [Jerome] Zanchi expounds it. Addition also is some alteration, if not of the things instituted, yet of the institution, as making it insufficient or incomplete by itself alone.</p></blockquote>

</figure><figure class="quote" id="q-05426fba33" data-kw="both kinds">
<blockquote><p>From this the opinion of the Romanists is evident without any further investigation. Ours is wholly contrary. In fact, we think that the communion under both kinds instituted by Christ should necessarily be retained; so that it is not only free to each one to use it, but from the command of Christ they are individually bound to it, unless they are prevented by some insuperable hindrance. Not without the highest sacrilege can the cup be taken away from the people against the express law of God. The state of the question therefore (1) is not Was communion under both kinds instituted by Christ? (which our opponents do not dispute); but Ought it to be instituted in like manner by believers, so that it is not only a thing indifferent and accidental, but necessary and essential to the perfection of the sacrament? (2) The question is not Is the believer so bound to communion under both kinds that he cannot in any case without sin commune under one kind only? For we confess if any unavoidable impediment interposes, either internal (arising from the disposition of the receiver) or external from other causes, by which he is prohibited from taking one kind, such an one is worthy of commiseration rather than of reprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.25.5</span></figcaption>

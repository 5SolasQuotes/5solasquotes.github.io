<main class="wrap"><figure class="quote" id="q-db1a5c7268" data-kw="">
<blockquote><p>They seem sometimes so to speak, as if it greatly offended them, that such hymns and psalms as are Scripture should in common prayer be otherwise used than the rest of the Scripture is wont: sometime displeased they are at the artificial music which we add unto psalms of this kind, or of any other nature else; sometime the plainest and the most intelligible rehearsal of them yet they savor not, because it is done by interlocution, and with a mutual return of sentences from side to side.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hooker</cite>, (1554-1600), a defender of the status quo in the Church of England, here lists the English puritans’ complaints with the English liturgy. Laws of Ecclesiastical Polity, Book 5, chs. 35, 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-18be386f2f" data-kw="">
<blockquote><p>Yea the fallible church may determine infallible points. This is a principle that Libertines proceed upon, that men who are not infallible may err, and therefore can hold forth to others no infallible truth, which is most false, for prophets and apostles, Nathan, Samuel, David, Peter, being deserted of the immediately inspiring Spirit, did err, as well as the Church and pastors now deserted of the ordinary Spirit can and do err. For ‘all men’, prophets and apostles, ‘are liars’, Rom. 3, yet they may and do carry infallible truth to others; a blind man may hold a candle to others.

3. By this reason [of the Libertines] pastors can preach nothing certain in fundamentals [which is absurd], though faith come by hearing and faith is of a certain and determinate fixed truth of God, more permanent than heaven or earth; Why? because by this reason pastors in preaching fundamentals are not infallible.

4. Nor is this a good reason: It is believed the Church may err in synods, ergo [therefore], it does err and determines nothing that is infallible and certain in synods; no more than this is a good consequence: David may sin in praying, ergo, he does sin in praying: a potentia ad actum non valet consequentia [a consequence from potential to an act is not valid].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, pp. 24-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-3bd4952534" data-kw="">
<blockquote><p>But how can we imagine that many thousands [of Jerusalem Christians] could in one meeting communicate at one Table in the Lord’s Supper, and that ordinarily? 1. What voice could reach to so many thousands, as they did grow unto?… 3. Can we believe that seeing congregational meetings of fewer, and that in private houses, was less obnoxious to the indignation of authority, than meeting in the Temple, as is most evident, Acts 4:1-2; and seeing [that] the apostles had liberty to meet, Acts 5:26, [can we believe] that they would draw the first mold of the Christian visible-Church after the pattern of a convention [i.e. all gathering unto one place] most unfit, yea impossible for attaining the intended end, to wit, edification, especially not being compelled thereunto by an extrinsical necessity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, p. 428</span></figcaption>

<blockquote><p>10th Question: What duties are done by the minister? A. 1 Reading the Word. Acts 13:27; Col. 4:16 2 Preaching it. Lk. 4:20-21; Acts 13:15 3 Praying and praising God. 1 Cor. 14:15-16; Neh. 8:6 &amp; 9:5-6 4 Administering Sacraments. Mt. 28:19 &amp; 26:26; Acts 20:11 5. Blessing the people. Num. 6:23 In performing the two first (reading and preaching the Word) and the two last (administering Sacraments, and blessing the people) the Minister stands in God’s room, and is his mouth: but in the middlemost duty (praying to God and praising Him) he is the peoples’ mouth to God.</p></blockquote>

<blockquote><p>For it is written in the law of Moses, ‘Thou shalt not muzzle the mouth of the ox that treadeth out the corn.’ Doth God take care for oxen?… Do ye not know that they which minister about holy things live of the things of the temple? and they which wait at the altar are partakers with the altar? Even so hath the Lord ordained that they which preach the gospel should live of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/start-here.html">Reformed Books Online</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Editorial note</cite>, At the Reformation Anabaptists, and later Quakers and many Independants, argued that, as the Levitical statutes are done away with, so no law remains to bind persons to systematic giving to the Christian ministry, and that ministers need not, and should not be paid. However, even before the Law with Moses, being yet a gentile, Abraham paid a tithe to the priest Melchizedek (Gen. 14:18-20; Heb. 7:4-9) and Jacob vowed to give a tenth unto God with all that He prospered him with (Gen. 28:20-22). If there were any question about the moral right of ministers to be paid (and the obligation for Christians to pay them), Paul argues this point from the general equity of Old Testament examples (1 Cor. 9:9:13-14):</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

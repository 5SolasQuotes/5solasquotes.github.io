<blockquote><p>(1)… Even if conception be contravened in certain instances, this is not necessarily contra-acting the design of one’s faculty and intention for procreation generally. (2) Numerous counter-examples prove Feser’s syllogism invalid, including counter-acting chosen bodily functions for some greater good. … (4) Feser’s (right) allowance for destroying and surgically removing one’s organs for a higher good, from the greater to the lesser, allows contra-acting them in the realization of their natural ends, which hence is not inherently wrong. (5) Sexual pleasure is directly subordinate to marital unity, which unity is more foundational than procreation, per the Word; hence sexual pleasure need not always be subordinate to conception or procreation. This ought to be recognized, and is by most, from nature’s light. … (7) Conception and all relating to it, including its rate, was cursed by God for man’s sin, and is so far not a standard to us… (8) Human flourishing is a greater and more foundational natural, teleological purpose and good than sex organs and contra-acting them in some way. Hence, so contra-acting, which is not inherently wrong, is right when it results in greater human flourishing, which could not occur (or would not best occur) except through this means… … (10) Aiming at a higher good and partially fulfilling it so far as one morally can (though it necessarily involve a partial counter-acting of an essential, facultative end) is good and is not an immoral deficiency. (11) God has provided through nature both natural and artificial contraceptive means, which most of history has recognized (whether giving Him thanks for it or not, Rom. 1:21). God set Adam in the garden to improve even pure-nature itself. (12) The further principles inherent in reality, as elucidated in this article, go much further to synthesizing and explaining the ethical balance of the gradations of our variegated circumstances in common life, which is much preferable, that one’s ethics reflect reality, in contrast to the anti-contraception view, which herein is seen to be extreme, and thus distorted and unnatural. (13) Feser’s syllogism, while true for God, yet, it appears, cannot account for: (1) how simultaneous natural and positive laws differently bear upon man, (2) temptation or (3) self-denial, (4) including with respect to our Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Using Contraceptives may be in Accord with Natural Law &amp; Scripture: a Response to Feser’ (RBO, 2025) | Fentiman delves into natural law in arguing the opposite, with 13 counter-arguments to Feser’s main argument. One counter-example (amongst many others) Fentiman uses against Feser’s syllogism is choosing to use artificial pain relievers: they contra-act an essential (and very important) end of one’s natural faculty for the greater good of the flourishing of the person, as nearly everyone (rightly) accepts. Here are some of Fentiman’s summary conclusions:</cite></span></figcaption>

<blockquote><p>The rational soul is infused around the third day from the conception of the seed, understand if the conception proceeds to life and is not frustrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1, pt. 2 tr. by AI by Onku (Utrecht: Johannes a Waesberg, 1648) Latin | Disputations on Creation, Appendix 1 | After problem 24, pp. 332-33 | “Problem 3: At what time the soul is infused into the body. | Where there is an open distinction between pregnant women in whom the fetus is animated [animatus est, ensouled], and in whom it is not. It is therefore expedient to know when it is animated. | Others who deny that the soul is infused immediately from conception do not agree among themselves at what point of time or with how many days having passed, the intellective soul is united to the body. Valles in his Controversies, bk. 2, ch. 9 at the end says that females are never formed before the fortieth day, but males are formed in thirty or thirty-five days. The Coimbrans in their commentary on Aristotle’s On the Soul, bk. 2, article 2, section 2 say that the more common opinion, which they also follow, is that in males the conformation of the body is completed, and consequently the soul infused, around the fortieth day, in females around the eightieth. Feyens in his treatise, On the Formation of the Fetus, question 8, conclusion 2, says:</cite></span></figcaption>

<blockquote><p>…for in the ordinary course, nature proceeds in this manner: first, there is the mass of blood or seed received in the womb, but there is no parts of a body framed at the first: after a certain number of weeks, nature forms that substance into the parts of the body distinctly, but yet it is without life: then is the soul infused, when the body is organical, and so it is quickened and a true man; it is not before a man, but embryo as they call it… Now in the course of nature: first, that which is material is formed, as it were the house of the soul, and then the soul is infused, not only as the guest of it, but as the form and life of it:</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b3534ad0fd" data-kw="">
<blockquote><p>Creation is the action of God, whereby out of nothing He brought forth nature itself and all things in nature, both substances and accidents, in and with the substances, and finished them in the space of six days, both to his own glory and the salvation of the elect… Or thus, creation is a transient or external action of God, whereby in the beginning He made the world by a mere command out of his own free will in six days’ space to the glory of his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, (London: 1654), bk. 3, ch. 2, p. 225</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-1072d9342b" data-kw="">
<blockquote><p>Of all the creatures in it, it may be truly said that they are but of yesterday, Job. 8:9, if we measure them according to God’s (that is according to the true) account, to whom a thousand years are but as yesterday, Ps. 90:4, in which estimation the world is not yet six days old… What are five or six thousand years to eternity? which God enjoys, who is from everlasting to everlasting, Ps. 90:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, (d. 1648; London, 1656), on 1:1, sect. 3, p. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>
<div class="actions"><button class="copy" data-copy="“Of all the creatures in it, it may be truly said that they are but of yesterday, Job. 8:9, if we measure them according to God’s (that is according to the true) account, to whom a thousand years are but as yesterday, Ps. 90:4, in which estimation the world is not yet six days old… What are five or six thousand years to eternity? which God enjoys, who is from everlasting to everlasting, Ps. 90:2.”

— John White, A Commentary upon the Three First Chapters of the First Book of Moses called Genesis… (d. 1648; London, 1656), on 1:1, sect. 3, p. 7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COf+all+the+creatures+in+it%2C+it+may+be+truly+said+that+they+are+but+of+yesterday%2C+Job.+8%3A9%2C+if+we+measure+them+according+to+God%E2%80%99s+%28that+is+according+to+the+true%29+account%2C+to+whom+a+thousand+years+are+but+as+yesterday%2C+Ps.+90%3A4%2C+in+which+estimation+the+world+is+not+yet+six+days+old%E2%80%A6+What+are+five+or+six+thousand+years+to+eternity%3F+which+God+enjoys%2C+who+is+from+everlasting+to+everlasting%2C+Ps.+90%3A2.%E2%80%9D%0A%0A%E2%80%94+John+White%2C+A+Commentary+upon+the+Three+First+Chapters+of+the+First+Book+of+Moses+called+Genesis%E2%80%A6+%28d.+1648%3B+London%2C+1656%29%2C+on+1%3A1%2C+sect.+3%2C+p.+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1072d9342b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1072d9342b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=Of%20all%20the%20creatures%20in%20it,from%20everlasting%20to%20everlasting%2C%20Ps.%2090%3A2&amp;text=Of%20all%20the%20creatures%20in%20it%2C%20it%20may&amp;text=who%20is%20from%20everlasting%20to%20everlasting%2C%20Ps.%2090%3A2" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c9b63a1088" data-kw="">
<blockquote><p>…Though the general time which they fulfil may be known, or is known and set down by writers, yet the precise particular time, the day of the month, or hour of the day, or (which is the thing inquired) when their months come out and are fulfilled, that’s a secret. Though it be commonly known that a woman goes nine months with child… I may say in this case, as our Lord Jesus Christ said about the end of the world, ‘Of that day and hour knows no man,’ we may know the general time, we may know it will not be long before the world shall end. The time which the world shall go with its great birth is commonly said to be six thousand years; but the day and hour of its travel, and of the consummation of all things according to the decree of God, no man, no nor angel, knows.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-caryl.html">Joseph Caryl</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Fifteenth, Sixteenth &amp; Seventeenth Chapters of the Book of Job</cite>, (London, 1666), on ch. 39, vv. 1-4, p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

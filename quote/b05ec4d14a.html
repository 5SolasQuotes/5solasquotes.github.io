<main class="wrap"><figure class="quote" id="q-b05ec4d14a" data-kw="">
<blockquote><p>Images are fair and beautiful; the churches are decked and beset with them; but they are a cloak of shame; they are set in place of teachers; the priests are ignorant, and live in idleness, and send the people to learn at pictures; they call them laymen’s books. Yet what profiteth the image? saith Habakkuk, for the maker thereof hath made it an image, and a teacher of lies. And Jeremiah saith (chap; x.), “The stock is a doctrine of vanity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Two Epistles of the Apostle St. Paul to the Thessalonians</cite>, (1584; London: John Hatchard, 1811), p. 36.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fba2aca988" data-kw="">
<blockquote><p>Furthermore, for Christ, our Lord and very God, though he have taken on him the nature of us men, yet, notwithstanding, there ought no image to be erected. For he did not become man to that intent; but he drew up his humanity into heaven, and therewithal gave us a charge, that, so often as we pray, we should lift up the eyes of our mind and bodies into heaven above.

Moreover, being once ascended, he sent his Spirit instead of himself unto the church, wherein he hath a spiritual kingdom, and needeth not any bodily or corruptible things. For he commanded that, if we would bestow any thing on him or for his sake, we should bestow it on the poor, and not on his picture or image. And now since, without all controversy, our Christ is the very true God, and that the very true God doth forbid to hallow to him any likeness of man, that is, to represent God in the shape of a man; it followeth consequently, that to Christ no image is to be dedicated, because he is the true and very God and life everlasting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly and Learned Sermons Divided into the Five Decades containing the Chief and Principal Points of Christian Religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids MI: Reformation Heritage Boos, 2004), 1: 230-31.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-05e609474e" data-kw="">
<blockquote><p>It is not lawful to have pictures of Jesus Christ, because his divine nature cannot be pictured at all, and because his body, as it is now glorified, cannot be pictured as it is; and because, if it do not stir up devotion, it is in vain; if it do stir up devotion, it is a worshipping by an image or picture, and so a palpable breach of the Second Commandment.</p></blockquote>

</figure><figure class="quote" id="q-498d889bda" data-kw="">
<blockquote><p>‘The honor rendered to the image passes to the prototype,’ to the model or original… This is the locus classicus of the defenders of the images in the Byzantine Iconoclastic Controversy… The sentence just cited is taken from St. Basil’s late fourth century anti-Arian treatise On the Holy Spirit, where it had served to illustrate the unifying image relation of the Son to the Father in the Divine Trinity, a relation first expressed by St. Paul when he said that Christ was the Image of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhart-b-ladner.html">Gerhart B. Ladner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Concept of the Image</cite>, vol. 7 (1953), pp. 3-34, p. 3</span></figcaption>

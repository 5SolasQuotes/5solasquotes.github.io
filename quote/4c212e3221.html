<main class="wrap"><figure class="quote" id="q-4c212e3221" data-kw="">
<blockquote><p>By this term [‘prophets’ in this passage] he means (in my opinion) not those who were endowed with the gift of prophesying, but those who were endowed with a peculiar gift, not merely for interpreting Scripture, but also for applying it wisely for present use. My reason for thinking so is this, that he prefers prophecy to all other gifts, on the ground of its yielding more edification — a commendation that would not be applicable to the predicting of future events. Farther, when he describes the office of prophet, or at least treats of what he ought principally to do, he says that he must devote himself to consolation, exhortation, and doctrine. Now these are things that are distinct from prophesyings. Let us, then, by ‘prophets’ in this passage understand, first of all, eminent interpreters of Scripture, and farther, persons who are endowed with no common wisdom and dexterity in taking a right view of the present necessity of the Church, that they may speak suitably to it, and in this way be, in a manner, ambassadors to communicate the divine will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians 12, verse 28</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b429bc8ea1" data-kw="">
<blockquote><p>Secondly, every office necessarily supposes the corresponding gift. No man could be an apostle without the gift of infalibility; nor a prophet without the gift of inspiration; nor a healer of diseases without the gift of healing. Man may appoint men to offices for which they have not the necessary gifts, but God never does, any more than he ordains the foot to see or the hand to hear. If any man, therefore, claims to be an apostle, or prophet, or worker of miracles, without the corresponding gift, he is a false pretender. In the early church, as now, there were many false apostles, i.e. those who claimed the honor and authority of the office without its gifts. Thirdly, the fact that any office existed in the apostolic church is no evidence that it was intended to be permanent. In that age there was a plenitude of spiritual manifestations and endowments demanded for the organization and propagation of the church, which is no longer required. We have no longer prophets, nor workers of miracles, nor gifts of tongues. The only evidence that an office was intended to be permanent is the continuance of the gift of which it was the organ, and the command to appoint to the office those who are found to possess the gift.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Epistle to the Corinthians (NY: Robert Carter, 1860), on 1 Cor. 12:28</cite>, p. 263</span></figcaption>

<blockquote><p>2. The united to Christ have new bodies, and two bodies, 1 Cor. 6:19. She knew not how Jesus could be united to our fleshly bodies. 3. Those who have union with Christ shall not rise with these fleshly bodies. 1 Cor. 15:44. 4. The Resurrection, 1 Cor. 15 and John 5:28, is not of the body but of our union with Christ in this life; so said Hymeneus, Phyletus, the Libertines, the Georgians, Henry Nicholas and his. … 8. No Scripture warrants Christ’s manhood to be now in Heaven, but the body of Christ is his Church; so Saltmarsh, Sparkles of Glory, as before observed.</p></blockquote>

</figure><figure class="quote" id="q-3163c0e2b3" data-kw="">
<blockquote><p>I have hesitated till the present time, not through lack of ability to refute the falsehood or bear testimony for the truth, but from fear and apprehension that I might seem to some to be making additions to the doctrines or precepts of the Gospel of the New Testament, which it is impossible for one who has chosen to live according to the Gospel, either to increase or to diminish. But being recently in Ancyra in Galatia, I found the church there greatly agitated by this novelty, not prophecy, as they call it, but rather false prophecy, as will be shown. Therefore, to the best of our ability, with the Lord’s help, we disputed in the church many days concerning these and other matters separately brought forward by them, so that the church rejoiced and was strengthened in the truth, and those of the opposite side were for the time confounded, and the adversaries were grieved… Their opposition and their recent heresy which has separated them from the Church arose on the following account… a recent convert, Montanus [fl. 157-172] by name… And he became beside himself, and being suddenly in a sort of frenzy and ecstasy, he raved, and began to babble and utter strange things, prophesying in a manner contrary to the constant custom of the Church handed down by tradition from the beginning. Some of those who heard his spurious utterances at that time were indignant, and they rebuked him as one that was possessed, and that was under the control of a demon, and was led by a deceitful spirit, and was distracting the multitude; and they forbade him to talk, remembering the distinction drawn by the Lord and his warning to guard watchfully against the coming of false prophets… For the faithful in Asia met often in many places throughout Asia to consider this matter, and examined the novel utterances and pronounced them profane, and rejected the heresy, and thus these persons were expelled from the Church and debarred from communion. Since, therefore, they called us slayers of the prophets because we did not receive their loquacious prophets, who, they say, are those that the Lord promised to send to the people…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/eusebius.html">Eusebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>339) | Church History, bk. 5, ch. 16, sections 3-4, 7-8, 10-12 in NPNF2 1:231-32. The following is from an account of an unnamed 2nd century observer.</cite></span></figcaption>

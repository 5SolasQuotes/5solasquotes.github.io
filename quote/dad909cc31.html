<main class="wrap"><figure class="quote" id="q-dad909cc31" data-kw="">
<blockquote><p>XVIII. The natural law cannot be said to have undergone a change… XIX. Nor by the introduction of slavery; while before, by the primeval law [Gen. 1], all were free. They were not otherwise free than inasmuch as they were free from criminality. When this entered [with the Fall of Adam], slavery passed upon all. For he who assails another’s liberty deservedly loses his own. Nor if the law of nature makes all men equal with regard to nature does it follow that they are equal with regard to qualities and external condition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, 2nd Question, ‘The Nature of the Moral Law’, section 19, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2d6a3c152a" data-kw="">
<blockquote><p>Note, the rules of a strict discipline must not be made too strict, but so as to admit of a dispensation when the necessity of a case calls for it, which therefore, in making vows of that nature, it is wisdom to provide expressly for, that the way may be made the more clear, and we may not afterwards be forced to say, ‘It was an error,’ Eccl. 5:6. Commands of that nature are to be understood with such limitations. These Rechabites would have tempted God, and not trusted Him, if they had not used proper means for their own safety in a time of common calamity [which they did, Jer. 35:11], notwithstanding the law and custom of their family [Jer. 35:7-10].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, 35, vv. 1-11</span></figcaption>

</figure><figure class="quote" id="q-ff3b9cf688" data-kw="">
<blockquote><p>What compelled people may do to redeem their lives, with loss of liberty, is nothing to the point… and that they may sell the liberty of their posterity, not yet born, is utterly denied as unlawful; yea, a violentated father to me is a father, and not a father, and the posterity may vindicate their own liberty given away unjustly before they were born, Qua omne regnum vi partum potest vi dissolvi.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 66 lt col bot</span></figcaption>

</figure><figure class="quote" id="q-31d5d00968" data-kw="">
<blockquote><p>Now that the prophet was ordered to offer them wine, and that they refused, a question here arises: Was their continency in this respect laudable? They seemed thus to prefer Jonadab [their forefather] to God, for they knew that Jeremiah, who offered them wine, was sent by God. But the Rechabites, no doubt, modestly excused themselves, when they said that it was not right for them to drink wine, because they had been forbidden by their father. It was not then their purpose to give more honor to their father than to God or to his prophet, but they simply answered for the sake of excusing themselves, that they had abstained from wine for three hundred years, that is, that the whole family had done so. This, then, is the solution of the question. But what the Papists do in bringing against us the Rechabites, first to support their tyrannical laws, and secondly, in order to torment miserable consciences at their pleasure, is frivolous in the extreme. As I have already said, the advice of Jonadab is not commended, as though he had rightly forbidden his sons to drink wine; but only his sons are spoken of as having reverently and humbly obeyed the command of their dead father. Then this passage gives no countenance to the Papists, as though the object of it was to bind the consciences of the faithful to their laws; for what is here spoken of is that the Rechabites proved by their obedience how base and wicked was the obduracy of the people, as they showed less reverence and honor to God than these did to a man that was dead. But the Papists, however, dwell much on another point, — that whatever has been handed down from the fathers ought to be observed; and thus they reason, “The authority of the whole Church is greater than that of a private man; now the Rechabites are commended for having followed the command of a private individual, much more then ought we to obey the laws of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Jeremiah</cite>, 35, v. 7, on the Rechabites</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><figure class="quote" id="q-0da10203e8" data-kw="">
<blockquote><p>To go as pirates and catch up poor negroes or people of another land, that never forfeited life or liberty, and to make them slaves, and sell them, is one of the worst kinds of thievery in the world; and such persons are to be taken for the common enemies of mankind; and they that buy them and use them as beasts, for their mere commodity, and betray, or destroy, or neglect their souls, are fitter to be called incarnate devils than Christians, though they be no Christians whom they so abuse.</p></blockquote>

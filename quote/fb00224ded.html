<main class="wrap"><figure class="quote" id="q-fb00224ded" data-kw="">
<blockquote><p>No one can merit the initial grace which is at the origin of conversion. Moved by the Holy Spirit, we can merit for ourselves and for others all the graces needed to attain eternal life, as well as necessary temporal goods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2027</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d5aa59359" data-kw="">
<blockquote><p>There remains the last question, whether God rewards good works out of mere liberality beyond what is condign. For the common opinion of theologians constantly affirms this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.19 (translated from the Latin)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There remains the last question, whether God rewards good works out of mere liberality beyond what is condign. For the common opinion of theologians constantly affirms this.”

— Robert Bellarmine, De Justificatione, 5.19 (translated from the Latin)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere%20remains%20the%20last%20question%2C%20whether%20God%20rewards%20good%20works%20out%20of%20mere%20liberality%20beyond%20what%20is%20condign.%20For%20the%20common%20opinion%20of%20theologians%20constantly%20affirms%20this.%E2%80%9D%0A%0A%E2%80%94%20Robert%20Bellarmine%2C%20De%20Justificatione%2C%205.19%20%28translated%20from%20the%20Latin%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d5aa59359.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d5aa59359.html">Permalink</a><a class="src" href="https://archive.org/details/operaomnia06bell" rel="noopener" target="_blank">Read it online · Internet Archive (Vivès 1873, Latin)</a></div>
</figure><figure class="quote" id="q-a168547595" data-kw="">
<blockquote><p>By merit is understood a work completed for the benefit of another on whom it establishes a claim for reward, or the claim for rewards founded on the work. According as the reward is due in justice or merely out of graciousness, the merit is a meritum de condigno or a meritum de congruo.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 3, pt. 2, §11, 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>
<div class="actions"><button class="copy" data-copy="“By merit is understood a work completed for the benefit of another on whom it establishes a claim for reward, or the claim for rewards founded on the work. According as the reward is due in justice or merely out of graciousness, the merit is a meritum de condigno or a meritum de congruo.”

— Ludwig Ott, Fundamentals of Catholic Dogma, bk. 3, pt. 2, §11, 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBy%20merit%20is%20understood%20a%20work%20completed%20for%20the%20benefit%20of%20another%20on%20whom%20it%20establishes%20a%20claim%20for%20reward%2C%20or%20the%20claim%20for%20rewards%20founded%20on%20the%20work.%20According%20as%20the%20reward%20is%20due%20in%20justice%20or%20merely%20out%20of%20graciousness%2C%20the%20merit%20is%20a%20meritum%20de%20condigno%20or%20a%20meritum%20de%20congruo.%E2%80%9D%0A%0A%E2%80%94%20Ludwig%20Ott%2C%20Fundamentals%20of%20Catholic%20Dogma%2C%20bk.%203%2C%20pt.%202%2C%20%C2%A711%2C%201&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa168547595.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a168547595.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-eca3f1de29" data-kw="">
<blockquote><p>There are those who think that the good works of the just are meritorious of eternal life ex condigno by reason of the work, even if no divine agreement existed. So Cajetan teaches. … Others, on the contrary, think that good works proceeding from grace are not meritorious ex condigno by reason of the work, but only by reason of the pact and of divine acceptance. So Scotus teaches. … To us the middle opinion seems more probable, which teaches that the good works of the just are meritorious of eternal life ex condigno by reason of the pact and of the work together; not indeed that without the pact or acceptance a good work has no proportion to eternal life, but because God is not bound to accept a good work for that reward, even though it be equal and on a par with the reward, unless an agreement intervene.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-14ddf125f9" data-kw="">
<blockquote><p>As to the first question, all Catholics acknowledge that the good works of the just are meritorious of eternal life; but some think these terms de condigno and de congruo should not be used, but that one should say absolutely that the good works of the just are meritorious of eternal life by the grace of God. … Others hold that the good works of the just are meritorious de condigno in a broad sense, so that this condignity, compared with condignity properly taken, may be called congruity, and compared with congruity properly taken, may be called condignity. … But the common opinion of theologians admits condign merit simply. And this opinion is most true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.16 (translated from the Latin)</span></figcaption>

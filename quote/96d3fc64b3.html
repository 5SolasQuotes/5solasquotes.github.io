<main class="wrap"><figure class="quote" id="q-96d3fc64b3" data-kw="">
<blockquote><p>The words of the apostle, ‘God will have all men to be saved,’ etc. can be understood in three ways. First, by a restricted application, in which case they would mean, as Augustine says (De praed. sanct. i, 8: Enchiridion 103), God wills all men to be saved that are saved, not because there is no man whom He does not wish saved, but because there is no man saved whose salvation He does not will. Second, they can be understood as applying to every class of individuals, not to every individual of each class; in which case they mean that God wills some men of every class and condition to be saved, males and females, Jews and Gentiles, great and small, but not all of every condition. Third, according to Damascene (De Fide Orth. ii, 29), they are understood of the antecedent will of God; not of the consequent will. This distinction must not be taken as applying to the divine will itself, in which there is nothing antecedent nor consequent, but to the things willed. To understand this we must consider that everything, in so far as it is good, is willed by God. A thing taken in its primary sense, and absolutely considered, may be good or evil, and yet when some additional circumstances are taken into account, by a consequent consideration may be changed into the contrary. Thus that a man should live is good; and that a man should be killed is evil, absolutely considered. But if in a particular case we add that a man is a murderer or dangerous to society, to kill him is a good; that he live is an evil. Hence it may be said of a just judge, that antecedently he wills all men to live; but consequently wills the murderer to be hanged. In the same way God antecedently wills all men to be saved, but consequently wills some to be damned, as His justice exacts. Nor do we will simply, what we will antecedently, but rather we will it in a qualified manner; for the will is directed to things as they are in themselves, and in themselves they exist under particular qualifications. Hence we will a thing simply inasmuch as we will it when all particular circumstances are considered; and this is what is meant by willing consequently. Thus it may be said that a just judge wills simply the hanging of a murderer, but in a qualified manner he would will him to live, to wit, inasmuch as he is a man. Such a qualified will may be called a willingness rather than an absolute will. Thus it is clear that whatever God simply wills takes place; although what He wills antecedently may not take place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1, quest. 19</cite>, article 6, reply to obj. 1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a6f09fda47" data-kw="">
<blockquote><p>Mr. [Thomas] Hooker [a congregationalist] leaves out the chief word, wherein stands the force of my argument, he speaks nothing of God’s revealed intention and command to call in fools that they may be made wise, and he frames his answer, as if I had argued from the bare intention and hidden decree of God. But I find that Mr. Hooker utterly mistakes the distinction of God’s decree, and of his approving will, and therefore he takes for one and the same, the decree or intention of God (from which I bring not my argument) and the revealed intention of God, or his commanding will: the ignorance of which is a stumbling to Arminians, and Socinians, and to Mr. Hooker, who, as we shall hear, goes on with them, but I judge it one mistake in judgment in that godly man, but no heretical spirit, and therefore his defenders and followers would take heed to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), Book 1, ch. 8, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-cd32f57039" data-kw="">
<blockquote><p>As in the previous controversies, the rectitude of the distinction depends upon its definition: ‘it is possible to allow a voluntas conditionata [conditional will]’ in God ‘but not in an a priori and antecedent sense, as if dependent on a condition, rather in an a posteriori and consequent sense, given that some condition in the creature intervenes between the will and its execution’; and then ‘only to the extent that the condition does not belong to the internal divine act (a parte actus interni) or volition (volitionis), but to the external object (a parte obiecti externi) or thing willed (rei volitae).’ In this sense, the distinction can legitimately be applied to the promises associated with God’s covenants… the covenants of law and gospel, where God’s promises are extended conditionally to sinners… In other words, the conditional will remains an immutable will, willed eternally by God, but it is understood as being directed toward a contingent or conditional event: the condition, strictly understood, obtains, not in the divine will, but in the temporal event.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd</cite>, 5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65, p. 464</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-0c2f5df2d3" data-kw="">
<blockquote><p>If we compare this text [Matt 23:37, Christ lamenting over Jerusalem] with Isa. 6:10 they seem to be contrary. For here Christ says, ‘I would have gathered you’: there He says, ‘Harden them that they be not gathered and converted.’ God therefore seems to will and not to will one and the same thing. Answer: There is but one will in God: yet does it not equally will all things, but in diverse respects it does will and nil the same thing. He wills the conversion of Jerusalem, in that He approves it as a good thing in itself: in that He commands it, and exhorts men to it: in that He gives them all outward means of their conversion. He wills it not, in that He did not decree effectually to work their conversion. For God does approve, and He may require many things, which nevertheless for just causes known to Himself, He will not do. The confirmation of the angels that fell, God approved as a thing good in itself, yet did not He will to confirm them. A judge in compassion approves and will[s] the life of a malefactor: and yet withal he wills the execution of justice in his death. Even so God sometimes wills that in his signifying will, which He wills not in the will of his good pleasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will</cite>, (Cambridge, 1601), p. 44</span></figcaption>

<div class="actions"><button class="copy" data-copy="“If we compare this text [Matt 23:37, Christ lamenting over Jerusalem] with Isa. 6:10 they seem to be contrary. For here Christ says, ‘I would have gathered you’: there He says, ‘Harden them that they be not gathered and converted.’ God therefore seems to will and not to will one and the same thing. Answer: There is but one will in God: yet does it not equally will all things, but in diverse respects it does will and nil the same thing. He wills the conversion of Jerusalem, in that He approves it as a good thing in itself: in that He commands it, and exhorts men to it: in that He gives them all outward means of their conversion. He wills it not, in that He did not decree effectually to work their conversion. For God does approve, and He may require many things, which nevertheless for just causes known to Himself, He will not do. The confirmation of the angels that fell, God approved as a thing good in itself, yet did not He will to confirm them. A judge in compassion approves and will[s] the life of a malefactor: and yet withal he wills the execution of justice in his death. Even so God sometimes wills that in his signifying will, which He wills not in the will of his good pleasure.”

— William Perkins, A Treatise of God’s Free Grace &amp; Man’s Free Will (Cambridge, 1601), p. 44">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+we+compare+this+text+%5BMatt+23%3A37%2C+Christ+lamenting+over+Jerusalem%5D+with+Isa.+6%3A10+they+seem+to+be+contrary.+For+here+Christ+says%2C+%E2%80%98I+would+have+gathered+you%E2%80%99%3A+there+He+says%2C+%E2%80%98Harden+them+that+they+be+not+gathered+and+converted.%E2%80%99+God+therefore+seems+to+will+and+not+to+will+one+and+the+same+thing.+Answer%3A+There+is+but+one+will+in+God%3A+yet+does+it+not+equally+will+all+things%2C+but+in+diverse+respects+it+does+will+and+nil+the+same+thing.+He+wills+the+conversion+of+Jerusalem%2C+in+that+He+approves+it+as+a+good+thing+in+itself%3A+in+that+He+commands+it%2C+and+exhorts+men+to+it%3A+in+that+He+gives+them+all+outward+means+of+their+conversion.+He+wills+it+not%2C+in+that+He+did+not+decree+effectually+to+work+their+conversion.+For+God+does+approve%2C+and+He+may+require+many+things%2C+which+nevertheless+for+just+causes+known+to+Himself%2C+He+will+not+do.+The+confirmation+of+the+angels+that+fell%2C+God+approved+as+a+thing+good+in+itself%2C+yet+did+not+He+will+to+confirm+them.+A+judge+in+compassion+approves+and+will%5Bs%5D+the+life+of+a+malefactor%3A+and+yet+withal+he+wills+the+execution+of+justice+in+his+death.+Even+so+God+sometimes+wills+that+in+his+signifying+will%2C+which+He+wills+not+in+the+will+of+his+good+pleasure.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Treatise+of+God%E2%80%99s+Free+Grace+%26+Man%E2%80%99s+Free+Will+%28Cambridge%2C+1601%29%2C+p.+44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c2f5df2d3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c2f5df2d3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/quotes-on-the-distinction-between-gods-revealed-will-and-his-will-of-decree/#:~:text=If%20w <blockquote><p>§.10. Otherwise the will of God is distinguished into the will of sign [voluntas signi] and the will of good pleasure [voluntas beneplaciti]. The latter is, and is conceived as, the very complacency of God decreeing concerning the futurition of things, and approving Himself and whatever is in some manner similar to Himself. The former, which is called of sign, is indicated through some sign, and is made manifest among men: of which the will of precept is also a part. For those signs are referred to the number of five, and were formerly comprehended in this verse: He foretells, forbids, permits, commands, fulfils [Prædicit, prohibet, permittit, præcipit, implet]. §.11. Here it is inquired whether the will of precept and the will of decree do not very often conflict with one another: because what He wills by the will of precept, we often see not to come to pass, and thus it is evident from the event that God in His decree willed it not to be done. But we easily reconcile these by observing that the will of the mandate says nothing other than that God wills the obligation of the rational creature: but the will of decree, that He wills to permit a particular man not to answer to his obligation; or sometimes, if the mandate be positive, that He wills the obligation to endure for a time, until He Himself dissolves it. §.12. Those who distinguish the will of God into efficacious and inefficacious, absolute and conditional, antecedent and consequent, etc., in order to free the liberty of the will [libertas arbitrii] from all necessity of the event, labor in vain and ascribe many imperfections to God. Wherefore we acknowledge no will of decree which is not efficacious, absolute, and antecedent, as in the chapter on the decree of God we shall see that no other is to be admitted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>

<blockquote><p>It is observed by the learned and reverend [Edward] Stillingfleet, Irenic, p. 108, that the word ‘schism’ (though it sound harsh, it being often taken in an ill sense) as it imports a separation from a Church, is not a thing intrinsically evil in itself, but is capable of the differences of good and evil, according to the ground, reasons, ends, and circumstances inducing to such a separation; the withdrawing from a society is but the materiality of schism; the formality of it must be fetched from the grounds on which that is built. He cites also another author, observing that heresy and schism as they are commonly used, are two theological scarecrows with which they who would uphold a party in religion use to fright away such, as making enquiry into it, are ready to relinquish and oppose it, if it appear either erroneous or suspicious. §2…. it is needful to premise a few things:

1. Schism is a breach of unity; and therefore, there can be no schism where there ought to be no unity; yea, where there need be no unity, or where there can be no unity. Wherefore that we may understand what schism is, it is needful to consider what unity should, and must be among Churches, and among Christians. There are several sorts of unity, that we cannot have with all Churches, as local communion: some that we need not have, as identity of rites: some that we ought not to have with some Churches, as communion in false doctrine, or impure worship.

2. The unity of the Church may be considered in all the notions in which the Church is considered, or in all the sorts of Churches: In the catholic Church, visible and invisible, in all the combinations of Churches among themselves, national, provincial, classical and in particular congregations. It is an undue notion of unity and schism that Independents have, that they are only to be considered as in a particular congregation.

3. Unity consists in joining with and cleaving to the Church in all these acts of communions with her that the Lord has made our duty, so that it is not only schism to depart from a Church (without just cause) that we have been joined to, but not to join with some society of Christians when it is possible for us and when we can do it without sin; the former may be called a positive, this a negative separation.

4. Schism may be also called positive or negative in another sense; the former [negative] when a party in a Church, does not join with the Church, yet sets up no Church in a separated way from that Church whereof they were members: the latter [positive], when they set up such a distinct society; there may be just causes for both: The first, when I cannot join with the congregation I belong to because of some corruption that I must partake of if I join, but I partake with some other more pure society; The second, when a body of people cannot join without sin, nor can they have the occasion of a society where they might join; they must either live without ordinances or set up another religious society; on this ground Protestants did thus separate from the Popish Churches.

5. There may be a partial separation when one ordinance is so corrupted that we cannot join in it, and yet can join with the Church in all other acts of communion: and a total separation, when either the Church will not suffer us to join with her in any part of her service unless we join in all; or she is so corrupt that we can join with her in nothing that is religous. The former by most wise and sober men is not reckoned such a schism as that any are to be blamed as schismatics on that account; but the author I now debate with aggravates that even to a very high degree of schism, as also do many of his partizans, driving many consciencious and good men from them for the sake of some usages which themselves count indifferent and the others apprehend to be unlawful.

6. The differences in opinion about religious matters, especially when managed with heat and animosities may be called schism, according to the import of the word; yet in the usual ecclesiastical notion of schism, they are not to be so reputed unless some kind of separation or shuning the ordinary Church communion one with another follow upon them. Diversity of opinion and of affection are sinful evils, but it is diversity of religious practice, following on these, that makes Church-schism.

7. When a separation falls out in a Church, the guilt of it does certainly lie on the one side or the other, and often neither side is wholly innocent. They who have cause to separate may manage their good cause by evil methods and in a way that is not wholly commendable: now to know on which side the blame of the schism lies, we must not always conclude that they are in the fault: 1. Who are the fewer number; otherwise most reformations of the Church were sinful: Nor, 2. Who separate from the Church rulers, themselves being in possession of Church authority: for this should condemn our Reformation from Popery; Nor, 3. Who separate from that party that has the countenance of civil authority, and has the law on its side; not only because it is the Gospel, not the law of the land, that is the rule of our religion, and Church practice, but also because that is variable, and by that rule, they who were the sound party one year, may be schismatics the other; without any change in their principles or practice, which is absurd. Wherefore the blame of schism, in that case, lies only on them who has the wrong side of that controverted matter about which they divide; or who, though their opinion be better than that of the opposite party, yet depart from the communion of their brethren without sufficient cause, everything that we may justly blame, not being sufficient for making a rent in the Church. Hence it plainly follows that men’s assuming to themselves the name of the Church is not sufficient ground for them to brand such as schismatics who depart from their communion: Where truth and Gospel purity is, there is the Church, and they who have most of these are the soundest Church. §3. Having laid this foundation for discerning what is truly schism, and where the blame of it lies: I shall next enquire into the opinion of the ancient Church about schism:</p></blockquote>

elves%2C+national%2C+provincial%2C+classical+and+in+particular+congregations.+It+is+an+undue+notion+of+unity+and+schism+that+Independents+have%2C+that+they+are+only+to+be+considered+as+in+a+particular+congregation.+3.+Unity+consists+in+joining+with+and+cleaving+to+the+Church+in+all+these+acts+of+communions+with+her+that+the+Lord+has+made+our+duty%2C+so+that+it+is+not+only+schism+to+depart+from+a+Church+%28without+just+cause%29+that+we+have+been+joined+to%2C+but+not+to+join+with+some+society+of+Christians+when+it+is+possible+for+us+and+when+we+can+do+it+without+sin%3B+the+former+may+be+called+a+positive%2C+this+a+negative+separation.+4.+Schism+may+be+also+called+positive+or+negative+in+another+sense%3B+the+former+%5Bnegative%5D+when+a+party+in+a+Church%2C+does+not+join+with+the+Church%2C+yet+sets+up+no+Church+in+a+separated+way+from+that+Church+whereof+they+were+members%3A+the+latter+%5Bpositive%5D%2C+when+they+set+up+such+a+distinct+society%3B+there+may+be+just+causes+for+both%3A+The+first%2C+when+I+cannot+join+with+the+congregation+I+belong+to+because+of+some+corruption+that+I+must+partake+of+if+I+join%2C+but+I+partake+with+some+other+more+pure+society%3B+The+second%2C+when+a+body+of+people+cannot+join+without+sin%2C+nor+can+they+have+the+occasion+of+a+society+where+they+might+join%3B+they+must+either+live+without+ordinances+or+set+up+another+religious+society%3B+on+this+ground+Protestants+did+thus+separate+from+the+Popish+Churches.+5.+There+may+be+a+partial+separation+when+one+ordinance+is+so+corrupted+that+we+cannot+join+in+it%2C+and+yet+can+join+with+the+Church+in+all+other+acts+of+communion%3A+and+a+total+separation%2C+when+either+the+Church+will+not+suffer+us+to+join+with+her+in+any+part+of+her+service+unless+we+join+in+all%3B+or+she+is+so+corrupt+that+we+can+join+with+her+in+nothing+that+is+religous.+The+former+by+most+wise+and+sober+men+is+not+reckoned+such+a+schism+as+that+any+are+to+be+blamed+as+schismatics+on+that+account%3B+but+the+author+I+now+debate+wi ugh+their+opinion+be+better+than+that+of+the+opposite+party%2C+yet+depart+from+the+communion+of+their+brethren+without+sufficient+cause%2C+everything+that+we+may+justly+blame%2C+not+being+sufficient+for+making+a+rent+in+the+Church.+Hence+it+plainly+follows+that+men%E2%80%99s+assuming+to+themselves+the+name+of+the+Church+is+not+sufficient+ground+for+them+to+brand+such+as+schismatics+who+depart+from+their+communion%3A+Where+truth+and+Gospel+purity+is%2C+there+is+the+Church%2C+and+they+who+have+most+of+these+are+the+soundest+Church.+%C2%A73.+Having+laid+this+foundation+for+discerning+what+is+truly+schism%2C+and+where+the+blame+of+it+lies%3A+I+shall+next+enquire+into+the+opinion+of+the+ancient+Church+about+schism%3A%E2%80%9D%0A%0A%E2%80%94+Gilbert+Rule%2C+sect.+10+in+The+Good+Old+Way+Defended%2C+%E2%80%A6+%28Edinburgh%3A+1697%29%2C+pp.+245-64+Rule+was+a+Scottish+divine-right+presbyterian.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8b5b7d1b3b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8b5b7d1b3b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separatism/#:~:text=It%20is%20observed%20by%20the%20learned,of%20the%20ancient%20Church%20about%20schism&amp;text=It%20is%20observed%20by%20the%20learned%20and%20reverend&amp;text=the%20opinion%20of%20the%20ancient%20Church%20about%20schism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…even by 1679 there were some twenty or thirty ministers still preaching in the fields, and no significant decline in the number of their hearers. But the year 1679 was to bring a very radical change and to usher in an era of persecution on a scale hitherto unknown. To some extent this situation resulted from the annoyance caused to the government by the activities of Robert Hamilton and his followers, who were by now acting as a kind of sel-appointed armed bodyguard to Cameron in his preaching tours about the country. Hamilton had already been involved, as early as November 1677, in a violent incident at the home of his friend John Balfour of Kinloch, in Fife [a principal actor in the assassination of Archbishop James Sharp in 1679], when a party of soldiers who approached the house were fired upon and one of them was seriously wounded. How far Hamilton himself may have been responsible for incidents of this kind is not altogether clear…</p></blockquote>

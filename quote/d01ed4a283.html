<main class="wrap"><figure class="quote" id="q-d01ed4a283" data-kw="">
<blockquote><p>It is inquired whether the judicial laws of Moses should still endure or thrive, and therefore whether the Christian magistrate should be bound to such laws today no less than before, and may render judgment according to them with certainty, or, in other words, whether he should enforce their precepts as much as the Israelite magistrate was formerly obliged to do.

I respond to this inquiry with a distinction: the magistrate is obliged to those judicial laws which teach concerning matters which are immutable and universally applicable to all nations, but not to those which teach concerning matters which are mutable and peculiar to the Jewish or Israelite nations for the times when those governments remained in existence.

Things common to all nations (that is, which befall all) and are immutable with respect to their own nature and merits are moral offences, that is, against the Decalogue, such as murder, adultery, theft, seduction from the true God, blasphemy, and smiting of parents.

Those laws which are mutable and which were peculiar to the Jews for that time are things such as the emancipation of Hebrew slaves in the seventh year, Levirate marriage, releasing of debts in the appointed year, marriage with a woman from one’s own tribe, and if there were any other of the same sort. Likewise, these include ceremonial offences such as touching a dead body, touching a woman suffering her menstrual cycle, and others of the same sort.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputations on the Judicial Laws of Moses</cite>, trans. Adam J. Brink, ed. Joel McDurmon (1646; Powder Springs GA: American Vision Press, 2015), pp 4-5.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-461853bbb1" data-kw="">
<blockquote><p>Thanks, be to God, we have a clean other opinion of the Eucharist. We hold it (as it is indeed) a very holy Sacrament of the body and blood of our Lord, to be one of the most precious instruments of his grace, which being lawfully and rightly celebrated, communicateth to us all the treasures of heaven, the flesh and blood of Christ, the pardon of our sins, the peace of our consciences, the sanctification of our souls, and the right to a blessed immortality.

Far be it from us to give it the profane and infamous name of an idol. We will not say, that it is simply and only bread: and if any of us do chance to speak so, in saying that ’tis bread, he means in regard of the substance of the thing, not in regard of its virtue or dignity; in regard of which we believe that it is quite another thing from bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-daille.html">Jean Daillé</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An apology for the Reformed churches wherein is shewed the necessity of their separation from the Church of Rome: against those who accuse them of making a schism in Christendom</cite>, trans. Thomas Smith (Cambridge: University of Cambridge, 1653), p. 38.</span></figcaption>

</figure><figure class="quote" id="q-0e203154b2" data-kw="">
<blockquote><p>The substance of the body and blood of Christ, is not in the bread and wine of the sacrament; his exalted body is no more to be broken and sliced in pieces; nor doth it consist with his state of glory, to have his substantial body shrouded under such mean elements. But the bread and wine are memorials and pledges of his body and blood, instituted by him as signs to signify him; therefore he that receives them without a due respect to Christ, and handles them unworthily, despising those things which are signified by them, is a contemner of the Son of God, since he hath no value for that which is a mark of his authority and his love.</p></blockquote>

</figure><figure class="quote" id="q-1a09d03e1c" data-kw="">
<blockquote><p>This fact of David [eating the showbread under natural and moral necessity] was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646) | Appendix, pp. 81-82</span></figcaption>

</figure><figure class="quote" id="q-ebf3a1e066" data-kw="">
<blockquote><p>The statement of the question is not: (1) whether proper reverence and honor are due to the bread and the cup, the symbols of the Lord’s body and blood, both on account of the majesty of the author and the divinity of the things they seal and the excellent and singular use they have in religion, such as is legitimately exhibited to baptism and other rites and signs of religion. … However, we, although not denying that a proper reverence should be paid to the sacred symbol, do deny that the adoration which is due to the supreme God (usually designated by the Romanists as the worship of latria) should be paid to them. And although in one and the same celebration of the sacrament, they are made once and at the same time, still we think that they ought to be distinct the one from the other and unconfounded that we may not receive the signs for the things themselves; but may pay reverence to the signs indeed, but adoration to Christ alone. As in baptism of adults, the adoration of Christ (into whom they are initiated) and the reverence towards the water (the sacred symbol of the mystery) remain widely distinct… But we deny that on this account the sacrament itself should be adored; nay, we reject this worship as a most foul and detestable idolatry and bread-worship (artolatreian).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.538-39</span></figcaption>

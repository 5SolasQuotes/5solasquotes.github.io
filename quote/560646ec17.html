<blockquote><p>A Repetition of the Law of the Covenant of Works. In the ministry of Moses, there was a repetition of the doctrine concerning the law of the covenant of works. The Mosaic Covenant, then, seems to be a sort of republication of the covenant of works. Of course it is not identical to the prelapsarian covenant, but there is that condition «by which formula, the righteousness, which is of the law, is described, Rom. x. 5. And the terror of the covenant of works is increased by repeated comminations; and that voice heard, cursed be he that confirmeth not all the words of this law to do them, Deut. xxvii. as the requirement of obedience was rigid under the ministry of Moses, the promises of spiritual and saving grace were more rare and obscure, the measure of the Spirit granted to the Israelites, scanty and short, Deut. xxix. 4. and on the contrary, the denunciation of the curse frequent and express; hence the ministry of Moses is called, “the ministration of death and condemnation,” 2 Cor. iii. 7,9. doubtless because it mentioned the condemnation of the sinner, and obliged the Israelites to subscribe to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 187.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-aafc608860" data-kw="">
<blockquote><p>As to his legal relations, the Scriptures clearly teach that, at his creation, he was put under the equitable Covenant of Works for a certain probationary period. This just constitution provided (a) everlasting well-being on condition of perfect obedience, and (b) everlasting ill-being on condition of disobedience. Now, although under that covenant man failed, it is evident that, nevertheless, both of these conditions must be maintained in their integrity. To relax them would be to violate the word of God, to dishonour his law, and to render his promises and his threatenings alike unworthy of respect. The penalty, when once incurred, can be preserved inviolate only by being executed. The promise of everlasting well-being can be truthfully granted only when the condition of perfect obedience has been fulfilled. Suffering a righteous penalty entitles no criminal to a reward; and to offer eternal blessedness to such, on terms denied to unfallen Adam and to all angels, would be placing a premium on sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement (Philadelphia, PA: Presbyterian Board of Publication, 1867), 26.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>

</figure><figure class="quote" id="q-88a1117ed6" data-kw="">
<blockquote><p>1. The distance between God and the creature is so great, that although reasonable creatures do owe obedience unto him as their Creator, yet they could never have any fruition of him as their blessedness and reward, but by some voluntary condescension on God’s part, which he hath been pleased to express by way of covenant. 2. The first covenant made with man was a covenant of works, wherein life was promised to Adam; and in him to his posterity, upon condition of perfect and personal obedience. 3. Man, by his fall, having made himself incapable of life by that covenant [of works], the Lord was pleased to make a second, commonly called the covenant of grace; wherein he freely offereth unto sinners life and salvation by Jesus Christ; requiring of them faith in him, that they may be saved, and promising to give unto all those that are ordained unto eternal life his Holy Spirit, to make them willing, and able to believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-confession-of-faith.html">Westminster Confession of Faith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 7.</cite></span></figcaption>

</figure><figure class="quote" id="q-d81ce9a933" data-kw="">
<blockquote><p>ARGUMENT. V. Though the patrons of the doctrine of the necessity of repentance in order to the obtaining of the pardon of sin, do not aim at any encroachment on the doctrine of free pardon; yet, with all deference to those learned men, I conceive, that such doctrine is injurious to the grace of God, and doth much darken the free pardon offered in the gospel, in regard the pardon is promised immediately to those that believe, Acts 10:43. “Through his name, whosoever believeth in him, shall receive remission of sins.” But they require, that believers bring something with them, if they would obtain it, even that they bring repentance along with them. I think Dr. Preston says well, when he tells us, “It is a fault to think God’s pardons are not free, and that you must bring something in your hand. The very end (says he) of thy going to Christ, is to get thy hardness of heart and deadness of spirit removed, to be healed and enlivened.” And it is truly strange to think from what airth repentance should come to people, while as yet their sins are unpardoned, and God is their enemy. What need is their of those ways? Why go we not by faith to a reconciled God, to get repentance; but must seek repentance wherewith we may go to an unreconciled God, who is a consuming fire? If I mistake not, that is not the way of the gospel. It is a seasonable admonition that one gives us to this purpose, “When you go to mourn for sin, begin aloft with Christ; and do not always think to begin below with sin, and so to come up to Christ; but begin aloft with Christ, and fall down upon your sin.” “Papists (says Dr. Preston) tell of escaping damnation, and of getting into heaven. But Scripture gives other motives (to good works). Thou art in Christ, and Christ is thine; consider what he hath done for thee, what thou hast by him, what thou hadst been without him, and thus stir up thyself to do for him what he requireth.” Let them that will, repent that Christ may do for them; I shall desire always to believe what Christ hath done for me, that I may repent; not doubting but that the being instructed therein is the plain way to smiting on the thigh, and saying, What have I done? So says a godly writer, “First of all, God’s favour is apprehended, and remission of sin believed; then upon that cometh alteration of life and conversation.” Upon the whole’ we may see that the gospel teaches us to come empty-handed to the market of free grace, for remission of sin and God’s favour. But he comes not empty, who brings repentance along with him. If any shall say, that if we screw up matters so high in this point, we must cast faith as well as repentance, in the matter of attaining pardon; for that is still something we bring with us. I shall answer; For the safety of God’s grace, let the work faith, the inherent quality faith, go, and be made to stand aback, while the sinner stands before God’s tribunal to be justified; that the empty-handed, taking faith, may alone have place. Hath not the Lord made it to be only of faith, that it might be of grace, while faith comes with an empty hand, and receives all? There is a vast difference betwixt faith and repentance in this matter, even as much as betwixt giving and receiving: for there is no grace of the Spirit that hath more of the nature of giving than repentance, in so far as it is a turning of the whole man from sin unto God; and upon that head it ought to be banished far from the soul’s justification, and to have no part nor lot in the matter of attaining free pardon. And seeing this doctrine doth so well agree with the natural religion that is in all men, whereby they, when they come to God to obtain a favour, would always be sure of some qualification in themselves fitting them for the receipt of it; let us take heed, that it turn not the covenant of grace into a bastard covenant of works. The covenant of works says, Do this; the covenant of grace says so too. Where is the difference then? Why, the covenant of works says, Do this, and thou shalt live, viz. in God’s favour, wherein life lies. But the covenant of grace saith, Live thou, and do this. Now, this doctrine says, Repent, and thy sins shall be pardoned; which is indeed, Do this, and thou shalt live. It requires not perfect obedience indeed; but if we resolve it, we find it to be this, Turn from sin sincerely unto God, though thou caust not perfectly, and thou shalt live in God’s favour. Now, we know magis et minus non variant speciem. I have almost lost sight of faith its relation to the pardon of sin: and no great wonder; seeing another thing is set betwixt them, which seems to take the right hand of faith; for they will not say repentance goes before faith, and yet they will not allow it to come after remission of sin. So then it must go betwixt them, and therefore is the nearest mean: and whichsoever of two means be in themselves the more noble, yet, in relation to the common end, it is highly reasonable to prefer the immediate and nearest mean to the mediate and remote; whereby it comes to pass, that, in the matter of the pardon of sin, repentance most be the more noble mean. Again, I say, I believe and desire to go immediately to Christ for pardon: but dost thou repent of thy sins, thy faith cannot obtain pardon without repentance? Well then, still repentance is preferable to faith here: for without it faith can do nothing; but with it, it proves effectual; now, Propter quod unumquodque est tale, illud ipsum est magis tale. But this I am confident is not the doctrine of the gospel. Let us take a watchword from holy and learned Rutherford: “We would beware (says he) of Mr. Baxter’s* order of setting repentance and works of new obedience before justification; which is indeed a new covenant of works.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“ARGUMENT. V. Though the patrons of the doctrine of the necessity of repentance in order to the obtaining of the pardon of sin, do not aim at any encroachment on the doctrine of free pardon; yet, with all deference to those learned men, I conceive, that such doctrine is injurious to the grace of God, and doth much darken the free pardon offered in the gospel, in regard the pardon is promised immediately to those that believe, Acts 10:43. “Through his name, whosoever believeth in him, shall receive remission of sins.” But they require, that believers bring something with them, if they would obtain it, even that they bring repentance along with them. I think Dr. Preston says well, when he tells us, “It is a fault to think God’s pardons are not free, and that you must bring something in your hand. The very end (says he) of thy going to Christ, is to get thy hardness of heart and deadness of spirit removed, to be healed and enlivened.” And it is truly strange to think from what airth repentance should come to people, while as yet their sins are unpardoned, and God is their enemy. What need is their of those ways? Why go we not by faith to a reconciled God, to get repentance; but must seek repentance wherewith we may go to an unreconciled God, who is a consuming fire? If I mistake not, that is not the way of the gospel. It is a seasonable admonition that one gives us to this purpose, “When you go to mourn for sin, begin aloft with Christ; and do not always think to begin below with sin, and so to come up to Christ; but begin aloft with Christ, and fall down upon your sin.” “Papists (says Dr. Preston) tell of escaping damnation, and of getting into heaven. But Scripture gives other motives (to good works). Thou art in Christ, and Christ is thine; consider what he hath done for thee, what thou hast by him, what thou hadst been without him, and thus stir up thyself to do for him what he requireth.” Let them that will, repent that Christ may do for them; I shall desire always to believe what Christ hath done for me, that I may repent; not doubting but that the being instructed therein is the plain way to smiting on the thigh, and saying, What have I done? So says a godly writer, “First of all, God’s favour is apprehended, and remission of sin believed; then upon that cometh alteration of life and conversation.” Upon the whole’ we may see that the gospel teaches us to come empty-handed to the market of free grace, for remission of sin and God’s favour. But he comes not empty, who brings repentance along with him. If any shall say, that if we screw up matters so high in this point, we must cast faith as well as repentance, in the matter of attaining pardon; for that is still something we bring with us. I shall answer; For the safety of God’s grace, let the work faith, the inherent quality faith, go, and be made to stand aback, while the sinner stands before God’s tribunal to be justified; that the empty-handed, taking faith, may alone have place. Hath not the Lord made it to be only of faith, that it might be of grace, while faith comes with an empty hand, and receives all? There is a vast difference betwixt faith and repentance in this matter, even as much as betwixt giving and receiving: for there is no grace of the Spirit that hath more of the nature of giving than repentance, in so far as it is a turning of the whole man from sin unto God; and upon that head it ought to be banished far from the soul’s justification, and to have no part nor lot in the matter of attaining free pardon. And seeing this doctrine doth so well agree with the natural religion that is in all men, whereby they, when they come to God to obtain a favour, would always be sure of some qualification in themselves fitting them for the receipt of it; let us take heed, that it turn not the covenant of grace into a bastard covenant of works. The covenant of works says, Do this; the covenant of grace says so too. Where is the difference then? Why, the covenant of works says, Do this, and thou shalt live, viz. in God’s favour, wherein life lies. But the covenant of grace saith, Live thou, and do this. Now, this doctrine says, Repent, and thy sins shall be pardoned; which is indeed, Do this, and thou shalt live. It requires not perfect obedience indeed; but if we resolve it, we find it to be this, Turn from sin sincerely unto God, though thou caust not perfectly, and thou shalt live in God’s favour. Now, we know magis et minus non variant speciem. I have almost lost sight of faith its relation to the pardon of sin: and no great wonder; seeing another thing is set betwixt them, which seems to take the right hand of faith; for they will not say repentance goes before faith, and yet they will not allow it to come after remission of sin. So then it must go betwixt them, and therefore is the nearest mean: and whichsoever of two means be in themselves the more noble, yet, in relation to the common end, it is highly reasonable to prefer the immediate and nearest mean to the mediate and remote; whereby it comes to pass, that, in the matter of the pardon of sin, repentance most be the more noble mean. Again, I say, I believe and desire to go immediately to Christ for pardon: but dost thou repent of thy sins, thy faith cannot obtain pardon without repentance? Well then, still repentance is preferable to faith here: for without it faith can do nothing; but with it, it proves effectual; now, Propter quod unumquodque est tale, illud ipsum est magis tale. But this I am confident is not the doctrine of the gospel. Let us take a watchword from holy and learned Rutherford: “We would beware (says he) of Mr. Baxter’s* order of setting repentance and works of new obedience before justification; which is indeed a new covenant of works.”

— Thomas Boston, The Whole Works of Thomas Boston: Sermons and Discourses on Several Important Subjects in Divinity, ed. Samuel M‘Millan, vol. 6 (Aberdeen: George and Robert King, 1849), 87–89.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CARGUMENT.+V.+Though+the+patrons+of+the+doctrine+of+the+necessity+of+repentance+in+order+to+the+obtaining+of+the+pardon+of+sin%2C+do+not+aim+at+any+encroachment+on+the+doctrine+of+free+pardon%3B+yet%2C+with+all+deference+to+those+learned+men%2C+I+conceive%2C+that+such+doctrine+is+injurious+to+the+grace+of+God%2C+and+doth+much+darken+the+free+pardon+offered+in+the+gospel%2C+in+regard+the+pardon+is+promised+immediately+to+those+that+believe%2C+Acts+10%3A43.+%E2%80%9CThrough+his+name%2C+whosoever+believeth+in+him%2C+shall+receive+remission+of+sins.%E2%80%9D+But+they+require%2C+that+believers+bring+something+with+them%2C+if+they+would+obtain+it%2C+even+that+they+bring+repentance+along+with+them.+I+think+Dr.+Preston+says+well%2C+when+he+tells+us%2C+%E2%80%9CIt+is+a+fault+to+think+God%E2%80%99s+pardons+are+not+free%2C+and+that+you+must+bring+something+in+your+hand.+The+very+end+%28says+he%29+of+thy+going+to+Christ%2C+is+to+get+thy+hardness+of+heart+and+deadness+of+spirit+removed%2C+to+be+healed+and+enlivened.%E2%80%9D+And+it+is+truly+strange+to+think+from+what+airth+repentance+should+come+to+people%2C+while+as+yet+their+sins+are+unpardoned%2C+and+God+is+their+enemy.+What+need+is+their+of+those+ways%3F+Why+go+we+not+by+faith+to+a+reconciled+God%2C+to+get+repentance%3B+but+must+seek+repentance+wherewith+we+may+go+to+an+unreconciled+God%2C+who+is+a+consuming+fire%3F+If+I+mistake+not%2C+that+is+not+the+way+of+the+gospel.+It+is+a+seasonable+admonition+that+one+gives+us+to+this+purpose%2C+%E2%80%9CWhen+you+go+to+mourn+for+sin%2C+begin+aloft+with+Christ%3B+and+do+not+always+think+to+begin+below+with+sin%2C+and+so+to+come+up+to+Christ%3B+but+begin+aloft+with+Christ%2C+and+fall+down+upon+your+sin.%E2%80%9D+%E2%80%9CPapists+%28says+Dr.+Preston%29+tell+of+escaping+damnation%2C+and+of+getting+into+heaven.+But+Scripture+gives+other+motives+%28to+good+works%29.+Thou+art+in+Christ%2C+and+Christ+is+thine%3B+consider+what+he+hath+done+for+thee%2C+what+thou+hast+by+him%2C+what+thou+hadst+been+without+him%2C+and+thus+stir+up+thyself+to+do+for+him+what+he+requireth.%E2%80%9D+Let+them+that+will%2C+repent+that+Christ+may+do+for+them%3B+I+shall+desire+always+to+believe+what+Christ+hath+done+for+me%2C+that+I+may+repent%3B+not+doubting+but+that+the+being+instructed+therein+is+the+plain+way+to+smiting+on+the+thigh%2C+and+saying%2C+What+have+I+done%3F+So+says+a+godly+writer%2C+%E2%80%9CFirst+of+all%2C+God%E2%80%99s+favour+is+apprehended%2C+and+remission+of+sin+believed%3B+then+upon+that+cometh+alteration+of+life+and+conversation.%E2%80%9D+Upon+the+whole%E2%80%99+we+may+see+that+the+gospel+teaches+us+to+come+empty-handed+to+the+market+of+free+grace%2C+for+remission+of+sin+and+God%E2%80%99s+favour.+But+he+comes+not+empty%2C+who+brings+repentance+along+with+him.+If+any+shall+say%2C+that+if+we+screw+up+matters+so+high+in+this+point%2C+we+must+cast+faith+as+well+as+repentance%2C+in+the+matter+of+attaining+pardon%3B+for+that+is+still+something+we+bring+with+us.+I+shall+answer%3B+For+the+safety+of+God%E2%80%99s+grace%2C+let+the+work+faith%2C+the+inherent+quality+faith%2C+go%2C+and+be+made+to+stand+aback%2C+while+the+sinner+stands+before+God%E2%80%99s+tribunal+to+be+justified%3B+that+the+empty-handed%2C+taking+faith%2C+may+alone+have+place.+Hath+not+the+Lord+made+it+to+be+only+of+faith%2C+that+it+might+be+of+grace%2C+while+faith+comes+with+an+empty+hand%2C+and+receives+all%3F+There+is+a+vast+difference+betwixt+faith+and+repentance+in+this+matter%2C+even+as+much+as+betwixt+giving+and+receiving%3A+for+there+is+no+grace+of+the+Spirit+that+hath+more+of+the+nature+of+giving+than+repentance%2C+in+so+far+as+it+is+a+turning+of+the+whole+man+from+sin+unto+God%3B+and+upon+that+head+it+ought+to+be+banished+far+from+the+soul%E2%80%99s+justification%2C+and+to+have+no+part+nor+lot+in+the+matter+of+attaining+free+pardon.+And+seeing+this+doctrine+doth+so+well+agree+with+the+natural+religion+that+is+in+all+men%2C+whereby+they%2C+when+they+come+to+God+to+obtain+a+favour%2C+would+always+be+sure+of+some+qualification+in+themselves+fitting+them+for+the+receipt+of+it%3B+let+us+take+heed%2C+that+it+turn+not+the+covenant+of+grace+into+a+bastard+covenant+of+works.+The+covenant+of+works+says%2C+Do+this%3B+the+covenant+of+grace+says+so+too.+Where+is+the+difference+then%3F+Why%2C+the+covenant+of+works+says%2C+Do+this%2C+and+thou+shalt+live%2C+viz.+in+God%E2%80%99s+favour%2C+wherein+life+lies.+But+the+covenant+of+grace+saith%2C+Live+thou%2C+and+do+this.+Now%2C+this+doctrine+says%2C+Repent%2C+and+thy+sins+shall+be+pardoned%3B+which+is+indeed%2C+Do+this%2C+and+thou+shalt+live.+It+requires+not+perfect+obedience+indeed%3B+but+if+we+resolve+it%2C+we+find+it+to+be+this%2C+Turn+from+sin+sincerely+unto+God%2C+though+thou+caust+not+perfectly%2C+and+thou+shalt+live+in+God%E2%80%99s+favour.+Now%2C+we+know+magis+et+minus+non+variant+speciem.+I+have+almost+lost+sight+of+faith+its+relation+to+the+pardon+of+sin%3A+and+no+great+wonder%3B+seeing+another+thing+is+set+betwixt+them%2C+which+seems+to+take+the+right+hand+of+faith%3B+for+they+will+not+say+repentance+goes+before+faith%2C+and+yet+they+will+not+allow+it+to+come+after+remission+of+sin.+So+then+it+must+go+betwixt+them%2C+and+therefore+is+the+nearest+mean%3A+and+whichsoever+of+two+means+be+in+themselves+the+more+noble%2C+yet%2C+in+relation+to+the+common+end%2C+it+is+highly+reasonable+to+prefer+the+immediate+and+nearest+mean+to+the+mediate+and+remote%3B+whereby+it+comes+to+pass%2C+that%2C+in+the+matter+of+the+pardon+of+sin%2C+repentance+most+be+the+more+noble+mean.+Again%2C+I+say%2C+I+believe+and+desire+to+go+immediately+to+Christ+for+pardon%3A+but+dost+thou+repent+of+thy+sins%2C+thy+faith+cannot+obtain+pardon+without+repentance%3F+Well+then%2C+still+repentance+is+preferable+to+faith+here%3A+for+without+it+faith+can+do+nothing%3B+but+with+it%2C+it+proves+effectual%3B+now%2C+Propter+quod+unumquodque+est+tale%2C+illud+ipsum+est+magis+tale.+But+this+I+am+confident+is+not+the+doctrine+of+the+gospel.+Let+us+take+a+watchword+from+holy+and+learned+Rutherford%3A+%E2%80%9CWe+would+beware+%28says+he%29+of+Mr.+Baxter%E2%80%99s%2A+order+of+setting+repentance+and+works+of+new+obedience+before+justification%3B+which+is+indeed+a+new+covenant+of+works.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Sermons+and+Discourses+on+Several+Important+Subjects+in+Divinity%2C+ed.+Samuel+M%E2%80%98Millan%2C+vol.+6+%28Aberdeen%3A+George+and+Robert+King%2C+1849%29%2C+87%E2%80%9389.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd81ce9a933.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d81ce9a933.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/04/boston-on-not-turning-the-covenant-of-grace-into-a-covenant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

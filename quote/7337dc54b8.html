<blockquote><p>…Godfathers, who are civil witnesses that the parents shall take care to educate the child, in the true Faith…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2f55322314" data-kw="">
<blockquote><p>But that all doubt may be better cleared away, this principle should ever be kept in mind, that baptism is not conferred on children in order that they may become sons and heirs of God, but, because they are already considered by God as occupying that place and rank, the grace of adoption is sealed in their flesh by the rite of baptism. Otherwise the Anabaptists are in the right in excluding them from baptism. For unless the thing signified by the external sign can be predicated of them, it will be a mere profanation to call them to a participation of the sign itself. But if any one were inclined to refuse them baptism, we have a ready answer; they are already of the flock of Christ, of the family of God, since the covenant of salvation which God enters into with believers is common also to their children. As the words import ‘I will be thy God and the God of thy seed after thee.’ Unless this promise had preceded, certainly it would have been wrong to confer on them baptism. Now I ask whether the Word of God is sufficient by its intrinsic value for our salvation, or whether some aid must be borrowed elsewhere to supply its defect, or help its infirmity? If this promise is not believed to be efficacious in itself, not only the virtue of God, but also his grace and truth will be attached to the external sign. Thus those men, while they strive to honor baptism, cast serious ignominy on God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 438–To John Clauburger in Letters of John Calvin</cite>, ed. Bonnet (Philadelphia: Presbyterian Board of Publication, 1858), vol. 3, pp. 282-283</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-363ccf782c" data-kw="">
<blockquote><p>Therefore, when we say that the proper power of outward baptism resides in being a seal, we mean two things: firstly, that it makes more certain the promised grace that the principal cause has conferred or is to confer, and secondly that it strengthens and increases that grace. But since that promise is not absolute but linked to the condition of faith and repentance, it follows that the grace is sealed only to those who believe and repent, and consequently do not use the signs in a unworthy manner, as the apostle says in 1 Corinthians 11:29. In this regard we grant that this sacrament–just like the other ones–is also exhibitive of the thing that is promised, because in the lawful and worthy use of this sacrament these things that are promised are through the Holy Spirit not merely offered to believers but they are in fact exhibited to and conferred upon them. For God is truthful in sealing his promises, and our sacraments are not supplements of a letter that kills, but of the life-giving Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, sections 31-32, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

<blockquote><p>You [John Robinson] will happily say [Rutherford approving], there is no such necessity of baptizing as of ordination of ministers; and baptizing is incommunicable, because we read not that any in the apostolic Church baptized but pastors.</p></blockquote>

</figure><figure class="quote" id="q-cebb4ffe52" data-kw="">
<blockquote><p>4. The Fathers erred not so much as many suppose in their ascribing [salvific effects] to baptism. For: 1. Sometime by baptism they mean not only the external ordinance, but the whole work therein to be done; viz. the accepting Christ solemnly in Covenant, and giving up ourselves as a sanctified people to Him, renouncing the flesh, the world and the Devil, and so becoming fully Christians. This is baptism with them, and not the outward sign alone. And what says Peter less, when he says, ‘Baptism saves us,’ and thus expounds himself when he has done? And what say the Fathers more? 2. When they speak of these effects of baptism, they suppose a due recipient or subject, that is, a true believer, or the seed of such: and therefore they oft speak of the inefficacy of the outward baptism to hypocrites. 3. When they speak of the outward ordinance only, the collation which they ascribe to it and all the great effects, are to be understood but by way of obsignation and solemnization, and not solely excluding the internal faith and the Covenant: as actual solemnized marriage gives a woman right to her husband and all that he has, when yet she had a right by secret covenant and contract before. Now common reason and the nature of the thing and many of the contexts showing that the Fathers and Councils must be thus expounded according to these rules, I would fain know how they deserve that heavy accusation that we commonly lay upon them for their judgement in this, or what ground the Papists have to plead them generally for their efficacy ex opere operato [from the work working]? And yet I will not excuse each particular person of them thus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Disputations of Right to Sacraments</cite>, ... (London: Simmons, 1658), 2nd Disputation, pp. 200-201</span></figcaption>

<blockquote><p>XV. So far is the inferior part of the soul [the carnal desires] from contending of itself with the superior [that which is rational and spiritual] that on the contrary (according to the Philosopher [Aristotle]), it was born to obey (peitharchein pephyke) and is naturally subordinated to it (Aristotle, Nichomachean Ethics 10.9.4 [Loeb, 628-29]). The propensions of both can be diverse, but not contrary in themselves (rather only accidentally on account of sin). Man could be carried naturally towards both sensible and spiritual good, but in their own order and without a rebellion between the flesh and the spirit. Thus the soul would always hold dominion and the flesh obey and subject all its own motions and inclinations to it. The sensible good is contained in the intelligible good and the object of the sensitive appetite stands related to the object of the natural (as the means to the end). Therefore, as long as man regarded the sensible good as the means, there was no vice in him. But when departing from God, he began to be drawn to the object of the sensitive appetite as his ultimate end and highest good (which was effected by sin). At length the disorder (ataxia) arose which disturbed the order constituted by God. Therefore, we must accurately distinguish here the appetite (which was natural and ordinate) from that which was preternatural and inordinate [as in Romanism]. The latter is repugnant to reason, but not equally the former.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, The Reformed View | Institutes (P&amp;R) | vol. 1, 5th Topic, ‘Creation’, Q. 11, ‘Was Original Righteousness Natural or Supernatural? The Former we Affirm, the Latter we Deny Against the Romanists.’, p. 473</span></figcaption>

<blockquote><p>Argument 8— He who, by office, is obliged to expend himself, and to give his life for the safety of the people, must be inferior to the people. So Christ says, the life is more than raiment or food, because both these give themselves to corruption for man’s life; so the beasts are inferior to man, because they die for our life, that they may sustain our life. And Caiaphas prophesied right, that it was better that one man die than the whole nation perish (John 11:50); and in nature, elements, against their particular inclination, defraud themselves of their private and particular ends, that the commonwealth of nature may stand; as heavy elements ascend, light descend, lest nature should perish by a vacuity. And the good Shepherd (John 10) gives his life for his sheep; so both Saul and David were made kings to fight the Lord’s battles, and to expose their lives to hazard for the safety of the church and people of God. But the king, by office, is obliged to expend his life for the safety of the people of God; he is obliged to fight the Lord’s battles for them; to go betwixt the flock and death, as Paul was willing to be spent for the church. It may be objected, Jesus Christ gave Himself a ransom for his church, and his life for the life of the world, and was a gift given to the world (John 3:16; 4:10) and He was a mean to save us; and so, what arguments we have before produced to prove that the king must be inferior to the people, because he is a ransom, a mean, a gift, are not conclusive, I answer: 1. Consider a mean reduplicatively, and formaliter, [formally] as a mean; and secondly, as a mean materially, that is, the thing which is a mean. 2. Consider that which is only a mean and ransom, and gift, and no more; and that which, beside that it is a mean, is of a higher nature also. So Christ formally as a mean, giving his temporal life for a time, according to the flesh, for the eternal life of all the catholic Church, to be glorified eternally—(not his blessed Godhead and glory, which, as God, He had with the Father from eternity)— in that respect Christ has the relation of a servant, ransom, gift, and some inferiority in comparison of the Church of God; and his Father’s glory, as a mean, is inferior to the end; but Christ materially, in concreto [in particular, materially]: Christ is not only a mean to save his Church, but, as God (in which consideration He was the immortal Lord of life) He was more than a mean— even the Author, Efficient and Creator of heaven and earth; and so there is no ground to say that He is inferior to the Church, but the absolute head, king— the chief of ten thousand— more in excellency and worth than ten thousand millions of possible worlds of men and angels. But such a consideration cannot befall any mortal king; because, consider the king materially as a mortal man, he must be inferior to the whole church, for he is but one, and so of less worth than the whole church; as the thumb, though the strongest of the fingers, yet it is inferior to the hand, and far more to the whole body, as any part is inferior to the whole. Consider the king reduplicative and formally as king, and by the official relation he has, he is no more than but a royal servant, an official mean tending, ex officio [from his office], to this end, to preserve the people, to ride and govern them; and a gift of God, given by virtue of his office, to rule the people of God, and so any way inferior to the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 79</span></figcaption>

<blockquote><p>But I add, that, as the Son was the common head [by creation] both of men and angels, so the dignity which was conferred on man belonged to the angels also. For when we hear them called the sons of God (Ps. lxxxii. 6) it would be incongruous to deny that they were endued with some quality in which they resembled the Father. But if He was pleased that his glory should be represented in men and angels, and made manifest in both natures, it is ignorant trifling in Osiander to say that angels were postponed to men, because they did not bear the image of Christ. They could not constantly enjoy the immediate presence of God if they were not like to Him; nor does Paul teach (Col. iii. 10) that men are renewed in the image of God in any other way than by being associated with angels, that they may be united together under one head. In fine, if we believe Christ our felicity will be perfected when we shall have been received into the heavens, and made like the angels. But if Osiander is entitled to infer that the primary type of the image of God was in the man Christ, on the same ground may anyone maintain that Christ behoved to partake of the angelic nature, seeing that angels also possess the image of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, tr: Beveridge (1559), bk. 2, ch. 12, section 6, pp. 9-10</span></figcaption>

<div class="actions"><button class="copy" data-copy="“But I add, that, as the Son was the common head [by creation] both of men and angels, so the dignity which was conferred on man belonged to the angels also. For when we hear them called the sons of God (Ps. lxxxii. 6) it would be incongruous to deny that they were endued with some quality in which they resembled the Father. But if He was pleased that his glory should be represented in men and angels, and made manifest in both natures, it is ignorant trifling in Osiander to say that angels were postponed to men, because they did not bear the image of Christ. They could not constantly enjoy the immediate presence of God if they were not like to Him; nor does Paul teach (Col. iii. 10) that men are renewed in the image of God in any other way than by being associated with angels, that they may be united together under one head. In fine, if we believe Christ our felicity will be perfected when we shall have been received into the heavens, and made like the angels. But if Osiander is entitled to infer that the primary type of the image of God was in the man Christ, on the same ground may anyone maintain that Christ behoved to partake of the angelic nature, seeing that angels also possess the image of God.”

— John Calvin, Institutes tr: Beveridge (1559), bk. 2, ch. 12, section 6, pp. 9-10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+I+add%2C+that%2C+as+the+Son+was+the+common+head+%5Bby+creation%5D+both+of+men+and+angels%2C+so+the+dignity+which+was+conferred+on+man+belonged+to+the+angels+also.+For+when+we+hear+them+called+the+sons+of+God+%28Ps.+lxxxii.+6%29+it+would+be+incongruous+to+deny+that+they+were+endued+with+some+quality+in+which+they+resembled+the+Father.+But+if+He+was+pleased+that+his+glory+should+be+represented+in+men+and+angels%2C+and+made+manifest+in+both+natures%2C+it+is+ignorant+trifling+in+Osiander+to+say+that+angels+were+postponed+to+men%2C+because+they+did+not+bear+the+image+of+Christ.+They+could+not+constantly+enjoy+the+immediate+presence+of+God+if+they+were+not+like+to+Him%3B+nor+does+Paul+teach+%28Col.+iii.+10%29+that+men+are+renewed+in+the+image+of+God+in+any+other+way+than+by+being+associated+with+angels%2C+that+they+may+be+united+together+under+one+head.+In+fine%2C+if+we+believe+Christ+our+felicity+will+be+perfected+when+we+shall+have+been+received+into+the+heavens%2C+and+made+like+the+angels.+But+if+Osiander+is+entitled+to+infer+that+the+primary+type+of+the+image+of+God+was+in+the+man+Christ%2C+on+the+same+ground+may+anyone+maintain+that+Christ+behoved+to+partake+of+the+angelic+nature%2C+seeing+that+angels+also+possess+the+image+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+tr%3A+Beveridge+%281559%29%2C+bk.+2%2C+ch.+12%2C+section+6%2C+pp.+9-10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc16e5bdc40.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c16e5bdc40.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/man-the-image-of-god#:~:text=But%20I%20add%2C%20that%2C%20as%20the,also%20possess%20the%20image%20of%20God&amp;text=But%20I%20add%2C%20that%2C%20as%20the%20Son%20was&amp;text=that%20angels%20also%20possess%20the%20image%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[3.] If parents, by refusing to comply with the desire of their children [in desiring to marry someone], plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them.</p></blockquote>

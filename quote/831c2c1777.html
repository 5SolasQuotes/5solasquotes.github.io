</figure><figure class="quote" id="q-a9a7b7065a" data-kw="">
<blockquote><p>I. Since a division arose among Protestants regarding certain key points of the Christian religion, and those who follow the Helvetic, French, and Belgic Confessions have openly separated from those who adhere more closely to the Augsburg Confession [1530], the former, known specifically as the Reformed, have always tried to reconcile with those [Lutherans] of the Augsburg Confession, and have attempted various ways to establish ecclesiastical peace and remove the schism between the two groups.

II. Although these latter ones have often rejected the offered peace [by the Reformed] and many of them still seem very averse to it, sometimes the effort has met with success. For example, a hundred years ago at the Synod of Sandomierz, ministers who taught the Gospel of Christ according to both the Augsburg Confession and the Confession of the Waldensian Brethren and the Helvetic Churches in both Poland, Lithuania, and Samogitia came together in a common confession and were reconciled. Recently, in the Colloquium of Kassel, between the theologians of Marburg and Rinteln, a mutual communion was agreed upon despite remaining disagreements on what were considered fundamental issues.

III. Furthermore, in this century, there have been among other theologians of the Augsburg Confession some highly learned and celebrated men who publicly declared in their writings their desire for such ecclesiastical peace between the two Protestant parties and outlined the means to achieve it. For instance, Matthias, Bishop of Strängnäs in Sweden, in his book Northern Olive Branch, and George Calixtus, professor of theology at the University of Helmstedt, in his book Judgment on Theological Controversies between the Reformed and Lutherans.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, ed. tr. by AI by Colloquia Scholastica (1675; London, 1683), ‘Whether from the proposed Reformed and Lutheran union, union with the Roman Church follows,’, pp. 950-57 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-cf3a92e9a9" data-kw="">
<blockquote><p>Much has been made by historians of the Scots ‘forcing’ their austere brand of religion upon their English brethren. However, it is clear that Scottish commissioners were aware their role was limited to advising only and that the construction of the Church rested with English members of the Assembly. Indeed, the Westminster Assembly did invite the Scottish commissioners to become full members of the Assembly, an invitation which the Scots declined, thereby recognising and respecting England’s right to define its own church government… The Scots fully encouraged the English to set up a Classical Presbytery based on English tradition and encouraged compromise [or rather a principled accommodation to the Independents]. In response to [the Independent] Philip Nye’s sharp accusation that the Scots had ‘given’ the Assembly a whole system of church government, the Scottish members responded that ‘we were well content the Assembly should take their own order, and not tie themselves to ours.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/kirsteen-m-mackenzie.html">Kirsteen M. MacKenzie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Solemn League &amp; Covenant of the Three Kingdoms &amp; the Cromwellian Union</cite>, 1643-1663 (Routledge, 2018), ch. 1, pp. 37-8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

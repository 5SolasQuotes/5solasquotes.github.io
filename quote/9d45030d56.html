<main class="wrap"><figure class="quote" id="q-9d45030d56" data-kw="">
<blockquote><p>The festivals of the Old Testament Church are done away in Christ (Col. ii. 16, 17); and although when Providence calls for fasting or thanksgiving, a period of time sufficient for the duty may be lawfully appointed, yet there is no day holy except the Sabbath of the Lord (Exod. xx. 9, 10).

The evil of observing holy days of human appointment is very great. It reflects on the wisdom of God (Col. ii. 23); is a direct violation of the Divine law (Ezek. xliii. 8); is a part of Antichristian superstition (Dan. vii. 25); and it also tends to banish true religion, by diminishing respect for the Lord’s day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), p. 42.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-112e47dff1" data-kw="">
<blockquote><p>I would to God that every [so-called] Holy-day whatsoever beside the Lord’s Day, were abolished. That zeal which brought them in, was without all warrant of the Word, and merely followed corrupt reason, forsooth to drive out the Holy days of the Pagans, as one nail drives out another. Those Holy days, have been so tainted with superstition that I wonder we tremble not at their very names.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Matt 12, quoted by William Ames, A Fresh Suit Against Human Ceremonies in God’s Worship, p. 360. This quote was compiled by Andrew Myers.</span></figcaption>

</figure><figure class="quote" id="q-f75031eb4f" data-kw="">
<blockquote><p>Q. May the church appoint holy days, to remember Christ’s birth, death, temptation, ascension, &amp;c.?

A. No: as God hath abolished the Jewish holy-days of his own appointment, so he hath given no warrant to the church to appoint any; but hath commanded us to labour six days, except when Providence calls to humiliation or thanksgiving; and expressly forbids us to observe holy-days of men[’]s appointment, Col. ii. 16. Gal. iv. 10, 11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown.html">John Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An essay towards an easy, plain, practical, and extensive explication of the Assembly’s Shorter Catechism</cite>, (Carlisle, 1747), p. 228.</span></figcaption>

</figure><figure class="quote" id="q-9714cc21b3" data-kw="">
<blockquote><p>5. By their fruits shall we know them; look whether they give so much liberty to others and take so much to themselves upon their holy days for staying from the public worship and attending wordly business, as they do at the diets of weekly and ordinary preaching: yet they would make the simple believe that their holy days are only appointed to be kept as those ordinary times set apart for divine service on the week-days. Nay, moreover, let it be observed, whether or not they keep the festival days more carefully, and urge the keeping of them more earnestly than the Lord’s own day. Those prelates that will not abase themselves to preach upon ordinary Sabbaths, think the high holy days worthy of their sermons. They have been also often seen to travel upon the Lord’s Day, whereas they hold it religion to travel upon a holy day. And whereas they can digest the common profanation of the Lord’s Day and not challenge it, they cannot away with the not observing of their festivities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 1, pp. 12-13</span></figcaption>

</figure><figure class="quote" id="q-1519ed2764" data-kw="">
<blockquote><p>When certain days are represented as holy in themselves, when one day is distinguished from another on religious grounds, when holy days are reckoned a part of divine worship, then days are improperly observed. The Jewish Sabbath, new moons, and other festivals, were earnestly pressed by the false apostles, because they had been appointed by the law. When we, in the present age, intake a distinction of days, we do not represent them as necessary, and thus lay a snare for the conscience; we do not reckon one day to be more holy than another; we do not make days to be the same thing with religion and the worship of God; but merely attend to the preservation of order and harmony. The observance of days among us is a free service, and void of all superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians and Ephesians</cite>, 4:10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/holy-days-and-church-calendar.html">Holy Days and Church Calendar</a></span></div>

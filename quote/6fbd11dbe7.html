<blockquote><p>I. It is a matter of the greatest moment, that we learn distinctly to consider the covenant of grace, either as it is in its substance or essence, as they call it, or as it is in diverse ways proposed by God, with respect to circumstantials, under different economies. If we view the substance of the covenant, it is but only one, nor is it possible it should be otherwise. There is no other way worthy of God, in which salvation can be bestowed on sinners, but that discovered in the Gospel. Whence the apostle, Gal. 1:7, has beautifully said, “which is not another.” And that testament which was consecrated by the blood of Christ, he calls “everlasting,” Heb. 13:20, because it was settled from eternity, published immediately upon the fall of the first man, constantly handed down by the ancients, more fully explained by Christ himself and his apostles, and is to continue throughout all ages, and, in virtue of which, believers shall inherit eternal happiness. But if we attend to the circumstances of the covenant, it was dispensed “at sundry times and in divers manners,” under various economies for the manifestation of the manifold wisdom of God. In considering this, we are first to discourse on those general things which appertain to the substance of the covenant, and have continued in every age; and then explain the different economies or dispensations, and the new accessions made to each; which we will, first, do in a general and concise manner, in this and the following chapter; then gradually descend to the more special considerations.

II. We therefore maintain, agreeable to the sacred writings, that to all the Elect, living in any period of time: 1st, One and the same eternal life was promised. 2dly, That Jesus Christ was held forth as the one and the same author and bestower of salvation. 3dly, That they could not become partakers of it any other way, but by a true and lively faith in him. If we demonstrate these three things, none can any longer doubt, but that the covenant of grace must be, as to its substance, only one from the beginning. For, if the salvation be the same, and the author of it the same, the manner of communion with him the same, it is certain, the covenant itself cannot be more than one. II. The Scriptures so plainly declare, that eternal life was promised to the Elect from the beginning, that if is astonishing any Christians could venture to deny it; who, indeed, are much blinder than the Jews themselves; of whom our Lord testifies, John 5:39. “Ye do search the Scriptures, for in them ye think ye have eternal life:” and that they were neither rash nor erroneous in thinking that the promises of eternal life, and the manner of enjoying them, were contained in the Scriptures they had, we prove by the most cogent arguments. 1st, Because, not only the Lord Jesus does not charge them, in this respect, with the least error, but makes use of that as a reason to recommend to them the search of the Scriptures. But it is very inconsistent with the great sincerity of the Lord Jesus, and the divine dignity of the Scriptures, to recommend them by arguments not genuine, or to recommend their value and usefulness from Jewish forgeries. Nay, had the Jews falsely persuaded themselves, that the promises of eternal life were contained in the Old Testament records, our Lord ought not, by any concession, to have cherished that mistake, which would have hindered them from acknowledging the excellence of his doctrine, and consequently the divinity of his person; but rather to have exclaimed against them: “In vain do you search the Scriptures, in hopes of finding eternal life in them; attend rather to me and my doctrine, who am the first who came into the world as a preacher of eternal life.” But every one may see how inconsistent this was from the design of the Lord Jesus. 2ndly, To this we add, that Paul’s hope was founded on the Law and the Prophets, as well as the expectation of the Jews, Acts 24:14, 15, “Believing all things, which are written in the Law and the Prophets; and have hope towards God, which they themselves also allow, that there shall be a resurrection of the dead, both of the just and unjust.” He testifies, that the Jews expected a resurrection of the dead; he professes the same belief and hope with them; and that he did not do so out of a vain presumption, but from a faith resting on the Law and the Prophets, which they also, in their manner, carefully read, and from which they had derived the same expectation with him. 3dly, The Jews were so far from judging amiss in this respect, that, on the contrary, the Lord Jesus reproved the Sadducees, as ignorant of the Scriptures, because from them they had not learned life eternal and the resurrection, Matt. 22:29.

IV. But let us argue from the very books of the Old Testament: and first, after the example of our Lord, who, Matt. 22:31, 32, speaks to this purpose: “But, as touching the resurrection of the dead, have ye not read that which was spoken unto you by God, saying, I am the God of Abraham, and the God of Isaac, and the God of Jacob; God is not the God of the dead, but of the living.” This inference appeared so evident to the multitude, that they were astonished at his doctrine, and the Sadducees were put to silence, ver. 33, 34. And, indeed, if the words of Moses, quoted by Christ, be accurately weighed, the evidence of this argument will easily appear to the attentive reader.

V. For, 1st, That expression, to be God to any, in its full import, includes life eternal, For, when God becomes the sinner’s God, he then becomes to him what he is to himself. But, what is he to himself? Doubtless, the fountain of eternal and complete blessedness. When God, out of his grace, gives himself to man, he gives him all things; for himself is all things. Such a man finds in God “a shield” against every evil, and an “exceeding great reward,” Gen. 15:1. And what can he desire more in order to his perfect happiness? Accordingly, the apostle joins these two, Heb. 11:16, God to be the God of any one, and to have prepared for them a city. And seeing the “gifts” of God’s grace, especially when he gives himself, “are without repentance”, Rom. 11:29; hereby also the eternity of this happiness is established. …XVII. But lest they should cavil, that we borrow our arguments only from the New Testament (though none can better instruct us in the contents of the Old Testament than Christ and his apostles), we shall consider some passages of the Old Testament, and free them from the misconstructions of our adversaries. And, first, we have that swanlike song of Jacob, Gen. 49:18. לישועתך קויתי יהוה “I wait for thy salvation, O Lord.” The aged Prophet was now at the point of death; and, being full of the Spirit of God, he, in the midst of his prophecies, in which he foretels what was to befall his children and latest posterity, breaks out into these words; which were not spoken without the Spirit of God, so as, with Smalcius, to be referred to a vain persuasion, nor possibly to be wrested to any other but this spiritual and eternal salvation. XVIII. Here, again, let a certain Jew put the followers of Socinus, if possible, to the blush: in opposition to whom we produce this paraphrase of the Jerusalem Targumist. “Our father Jacob said, My soul does not expect the redemption of Gideon, the son of Joaz, that being only momentary; nor the redemption of Samson, because a transient redemption; but the redemption thou hast mentioned in thy word, or by thy word, which is to come to thy people, the children of Israel; my soul, I say, expects this thy redemption.” Is not this a very clear testimony of the most certain persuasion and the fullest assurance of their salvation? …XXXIII. When the same apostle affirms that our “salvation at the first began to be spoken by the Lord,” Heb. 2:3, it is clear he speaks of the Gospel completed, and of the Messiah, the author of salvation, already exhibited; which Gospel the Lord first published, with respect to the apostles, evangelists, and the other ordinary preachers that followed them. For otherwise who can deny that Zacharias, the father of John the Baptist, and Mary the mother of our Lord, and the angels who proclaimed his nativity, and the aged Simeon, and John the Baptist, were preachers of salvation before the Lord? Of the Fathers the apostle himself affirms, that they were ευαγγελισμενοι, gospelized, or that “the Gospel was preached unto them as well as unto us,” Heb. 4:2. XXXIV. When it is written, Heb. 9:8. “That the way unto the holiest of all was not yet made manifest, while as the first tabernacle was yet standing;” the apostle indeed intimates, that the manner of obtaining salvation was, in some measure hid, in comparison of the brighter lustre of the Gospel. For then, doubtless, the way to life was clouded with much pomp of ceremonies and figures; which being now dispelled, we behold with open face, and ardently desire, heavenly and spiritual things. But from this it no ways follows, that those under the Old Testament had no knowledge of salvation; any more than it can be concluded, we know nothing of our glorious state, because John says, “It doth not yet appear what we shall be,” John 3:2. We may almost, in the same manner, answer the other objections advanced by our adversaries. But it is no part of our design to examine each in particular. XXXV. Now let us proceed to the second thing, which we undertook to prove; that in Christ, and in virtue of his suretiship, the fathers of the Old Testament also obtained salvation even as we. Which Peter declares almost in so many words, Acts 15:11: “But we believe that, through the grace of the Lord Jesus Christ, we shall be saved even as they.” Where the pronoun they is to be referred to the fathers, on whose neck an insupportable yoke of ceremonies was put, as appears both from the grammatical consideration of the gender, from the connexion and the force of the apostles argument. For, since κᾀκεῖνοι is masculine and τα ἔθνα, the Gentiles, mentioned ver. 7, is neuter, it is not so properly referred to the Gentiles as to the fathers. And we are not here, without necessity, to have recourse to an enallage of gender. And then, too, what method of commenting is it, to imagine so wide an hyperbaton or transposition, and to bring from verse 7 a noun, to which, after the interposition of so many other things, a pronoun shall at length answer in eleventh verse, and which yet does not answer; because, in the words immediately preceding, you may find a noun, with which the pronoun in question may be very well joined? In fine, it will either be nonsense, or, very insipid, if the words be so construed. For, what manner of reasoning is it, if we suppose the apostle to have said: “The yoke of ceremonies ought not to be put on the necks of the Gentiles, because, we Jews and apostles believe, that we shall be saved in the same manner as they, by the alone grace of the Lord Jesus Christ?” For besides this, it was improper to propose the Gentiles, to the Jews and apostles, as a pattern of salvation, because it appears, that the contrary should be done; and we could only conclude from that position, that the apostles and Jews were not bound to circumcision, and the other ceremonies, any more than the Gentiles. But that was not the thing in dispute. But according to our interpretation, the apostle argues in the strongest manner: “You ought not to put the yoke of ceremonies on the necks of the disciples, who are converted from among the Gentiles, because the fathers themselves, who were under that yoke, really felt the uneasiness of it, but did not find salvation in it, and yet they were saved, not in consequence of these ceremonies, but by the grace of our Lord Jesus Christ. Neither are we, nor any of the human race, to take any other way to attain salvation. They therefore are under a mistake, who tell the disciples, if you will be saved, you must be circumcised, and keep the law of Moses.” To sum up the whole, then, in short, the apostle here declares three things. 1st, That the fathers were saved. 2dly, By the very same covenant that we are. 3dly, Through the grace of our Lord Jesus Christ: intimating likewise by all this reasoning, that there can possibly be but ONE way of salvation. XXXVI. This is likewise confirmed by that famous passage, Heb. 13:8, “Jesus Christ the same yesterday, and to-day and for ever.” In the foregoing verse the apostle admonished them to keep fresh in their memory “the word,” which their guides had spoken unto them, whose faith they should follow. Now, he gives this for the reason of that admonition, because “Jesus Christ is the same yesterday, and to-day, and for ever;” constantly preached by all the teachers of the truth, believed on by all, and to be believed on by those that come after, if they will imitate the faith of their predecessors. The same doctrine therefore is always to be retained, because Christ, who was always both proposed, and believed, as the author of salvation, changeth not. But the particles, yesterday, to-day, and for ever, denote all the differences of times. Nor does yesterday here signify something of a late date, as we usually say, yesterday or lately; but all the time past: as the phrase to-day denotes the time of grace under the New Testament. For, this is compared to some one present day, as chap. 3:13. “While it is called to-day:” and chap. 4:7. “Again, he limiteth a certain day, saying in David, To-day,” &amp;c.; of which 2 Cor. 6:2, “Behold! now is the accepted time, behold! now is the day of salvation.” As, therefore, Christ is to-day, under the New Testament, acknowledged the alone author of salvation, and will be acknowledged as such for ever; so, in like manner, yesterday, under the Old Testament, which day is now past, he was the same, and as such was declared and acknowledged. XXXVII. Let us also add what we have in Heb. 9:15, “And for this cause he is the mediator of the New Testament, that, by means of death, for the redemption of the transgressions that were under the first testament, they which are called might receive the promise of eternal inheritance.” Where we have an open declaration, that the death of Jesus Christ was effectual for the redemption of transgressions committed under the Old Testament. For thus the apostle proceeds. He supposes that the fathers of the Old Testament were saved, notwithstanding their sins; which Socinus, with his followers, dare not deny. He says further, that the blood of bullocks and of goats, and consequently of all sacrifices whatever, could not really, and before the tribunal of God, expiate sin, and purify the conscience. Yet since, as he declares, without shedding of blood there can be no remission, verse 22, he concludes, it was necessary that the death of Christ should indeed be undergone, in order not only to the establishment of the New Testament, but by virtue of which the redemption of former sins might also be obtained. This is the genuine meaning of the sacred writer. XXXVIII. And, indeed, Grotius shamefully shuffles, when, to favour the Socinians, he thus writes on this place: “His death intervened for this end, that men might be delivered from those sins, which generally prevailed, before Christ, among those called God’s people.” Is it really so? Would thus “the redemption of the transgressions that were under the first testament,” denote such an action of Christ, whereby succeeding ages would abstain from the like sins, as were formerly committed? God forbid we should ever pervert Scripture thus. Redemption is כפד an expiation of sin, upon paying a ransom. Christ paid this for all the sins of his elect, at whatever time they lived. And upon the credit of that payment, to be made at the appointed time, believers, even under the Old Testament, obtained redemption. XXXIX. Moreover, since it is evident that Old Testament saints were saved, it must likewise be evident that they were saved through Christ. For our Saviour himself says, John 14:6: “No man cometh unto the Father but by me.” And Peter, Acts 4:12: “Neither is there salvation in any other; for there is none other name under heaven given among men, whereby we must be saved.” Nothing can be plainer than these words, which seem to be written as with a sun-beam. Yet the itch of contradiction has found something to say, but that something is less than nothing. XL. Our adversaries except, that these passages should be understood of those who live under the New Testament, and therefore that both Christ and Peter speak in the present, and not in the past time; of us, and not of the Old Testament saints; of the times when Christ was exhibited, and not of the Old Testament times. We answer: 1st, As both texts are expressed in universal terms, they are not to be limited without cause and necessity, as there is none in this case. For if salvation could be obtained formerly without Christ, equally as now through Christ, what need had we of Christ’s coming? Or, what so very great matter do we obtain Christ? 2dly, There are very solid reasons, why they neither ought nor can be thus restricted. Because they who were “without Christ, were strangers from the covenants of promise, having no hope, and without God in the world.” Eph. 2:12. 3dly, The quibbling about the verbs being of the present time is idle, because verbs of that time or tense may equally refer to all times. And whatever expression had been used, whether denoting the future or past time, there might always be room left for such cavils. Besides, no reason can be assigned, why the past time should be excluded any more than the future, if that verb of the present tense is thus to be racked. If this is not false reasoning against the Supreme Being, and a childish abuse of one’s genius and parts, what can be called so? …XLIII. The apostle writes nothing in opposition to this truth, when he says, Gal. 3:23. “But before faith came, we were kept under the law.” For it is far from the apostle’s intention to deny, that faith in Christ prevailed before his coming in the flesh, because, in the same chapter, he had highly commended the faith of Abraham, and proposed it as a pattern to us all, ver. 6, 7, 9. But by faith we here understand either the object of faith, the doctrine of the Gospel, as chap. 1:23, and the Lord Jesus himself, believed on in the world, 1 Tim. 3:16, or, the faith of the redemption already actually wrought out, as contradistinguished from the hope of the Old Testament saints, who, with earnest longing, as it were, expected the coming of the Lord, “waiting for the consolation of Israel,” Luke 2:25. And thus we have now shown, that the Old Testament saints had the same promises of eternal life with us, to be obtained by the same Christ, and the same faith in him, and consequently also had the same covenant of grace with us.</p></blockquote>

ent redemption; but the redemption thou hast mentioned in thy word, or by thy word, which is to come to thy people, the children of Israel; my soul, I say, expects this thy redemption.” Is not this a very clear testimony of the most certain persuasion and the fullest assurance of their salvation? …XXXIII. When the same apostle affirms that our “salvation at the first began to be spoken by the Lord,” Heb. 2:3, it is clear he speaks of the Gospel completed, and of the Messiah, the author of salvation, already exhibited; which Gospel the Lord first published, with respect to the apostles, evangelists, and the other ordinary preachers that followed them. For otherwise who can deny that Zacharias, the father of John the Baptist, and Mary the mother of our Lord, and the angels who proclaimed his nativity, and the aged Simeon, and John the Baptist, were preachers of salvation before the Lord? Of the Fathers the apostle himself affirms, that they were ευαγγελισμενοι, gospelized, or that “the Gospel was preached unto them as well as unto us,” Heb. 4:2. XXXIV. When it is written, Heb. 9:8. “That the way unto the holiest of all was not yet made manifest, while as the first tabernacle was yet standing;” the apostle indeed intimates, that the manner of obtaining salvation was, in some measure hid, in comparison of the brighter lustre of the Gospel. For then, doubtless, the way to life was clouded with much pomp of ceremonies and figures; which being now dispelled, we behold with open face, and ardently desire, heavenly and spiritual things. But from this it no ways follows, that those under the Old Testament had no knowledge of salvation; any more than it can be concluded, we know nothing of our glorious state, because John says, “It doth not yet appear what we shall be,” John 3:2. We may almost, in the same manner, answer the other objections advanced by our adversaries. But it is no part of our design to examine each in particular. XXXV. Now let us proceed to the second thing, r: “You ought not to put the yoke of ceremonies on the necks of the disciples, who are converted from among the Gentiles, because the fathers themselves, who were under that yoke, really felt the uneasiness of it, but did not find salvation in it, and yet they were saved, not in consequence of these ceremonies, but by the grace of our Lord Jesus Christ. Neither are we, nor any of the human race, to take any other way to attain salvation. They therefore are under a mistake, who tell the disciples, if you will be saved, you must be circumcised, and keep the law of Moses.” To sum up the whole, then, in short, the apostle here declares three things. 1st, That the fathers were saved. 2dly, By the very same covenant that we are. 3dly, Through the grace of our Lord Jesus Christ: intimating likewise by all this reasoning, that there can possibly be but ONE way of salvation. XXXVI. This is likewise confirmed by that famous passage, Heb. 13:8, “Jesus Christ the same yesterday, and to-day and for ever.” In the foregoing verse the apostle admonished them to keep fresh in their memory “the word,” which their guides had spoken unto them, whose faith they should follow. Now, he gives this for the reason of that admonition, because “Jesus Christ is the same yesterday, and to-day, and for ever;” constantly preached by all the teachers of the truth, believed on by all, and to be believed on by those that come after, if they will imitate the faith of their predecessors. The same doctrine therefore is always to be retained, because Christ, who was always both proposed, and believed, as the author of salvation, changeth not. But the particles, yesterday, to-day, and for ever, denote all the differences of times. Nor does yesterday here signify something of a late date, as we usually say, yesterday or lately; but all the time past: as the phrase to-day denotes the time of grace under the New Testament. For, this is compared to some one present day, as chap. 3:13. “While it is called to-day:” and chap. 4:7. “Again, he limiteth a certain day, saying in David, To-day,” &amp;c.; of which 2 Cor. 6:2, “Behold! now is the accepted time, behold! now is the day of salvation.” As, therefore, Christ is to-day, under the New Testament, acknowledged the alone author of salvation, and will be acknowledged as such for ever; so, in like manner, yesterday, under the Old Testament, which day is now past, he was the same, and as such was declared and acknowledged. XXXVII. Let us also add what we have in Heb. 9:15, “And for this cause he is the mediator of the New Testament, that, by means of death, for the redemption of the transgressions that were under the first testament, they which are called might receive the promise of eternal inheritance.” Where we have an open declaration, that the death of Jesus Christ was effectual for the redemption of transgressions committed under the Old Testament. For thus the apostle proceeds. He supposes that the fathers of the Old Testament were saved, notwithstanding their sins; which Socinus, with his followers, dare not deny. He says further, that the blood of bullocks and of goats, and consequently of all sacrifices whatever, could not really, and before the tribunal of God, expiate sin, and purify the conscience. Yet since, as he declares, without shedding of blood there can be no remission, verse 22, he concludes, it was necessary that the death of Christ should indeed be undergone, in order not only to the establishment of the New Testament, but by virtue of which the redemption of former sins might also be obtained. This is the genuine meaning of the sacred writer. XXXVIII. And, indeed, Grotius shamefully shuffles, when, to favour the Socinians, he thus writes on this place: “His death intervened for this end, that men might be delivered from those sins, which generally prevailed, before Christ, among those called God’s people.” Is it really so? Would thus “the redemption of the transgressions that were under the first testament,” denote such an action of Christ, whereby succeeding ages would abstain from the like sins, as were formerly committed? God forbid we should ever pervert Scripture thus. Redemption is כפד an expiation of sin, upon paying a ransom. Christ paid this for all the sins of his elect, at whatever time they lived. And upon the credit of that payment, to be made at the appointed time, believers, even under the Old Testament, obtained redemption. XXXIX. Moreover, since it is evident that Old Testament saints were saved, it must likewise be evident that they were saved through Christ. For our Saviour himself says, John 14:6: “No man cometh unto the Father but by me.” And Peter, Acts 4:12: “Neither is there salvation in any other; for there is none other name under heaven given among men, whereby we must be saved.” Nothing can be plainer than these words, which seem to be written as with a sun-beam. Yet the itch of contradiction has found something to say, but that something is less than nothing. XL. Our adversaries except, that these passages should be understood of those who live under the New Testament, and therefore that both Christ and Peter speak in the present, and not in the past time; of us, and not of the Old Testament saints; of the times when Christ was exhibited, and not of the Old Testament times. We answer: 1st, As both texts are expressed in universal terms, they are not to be limited without cause and necessity, as there is none in this case. For if salvation could be obtained formerly without Christ, equally as now through Christ, what need had we of Christ’s coming? Or, what so very great matter do we obtain Christ? 2dly, There are very solid reasons, why they neither ought nor can be thus restricted. Because they who were “without Christ, were strangers from the covenants of promise, having no hope, and without God in the world.” Eph. 2:12. 3dly, The quibbling about the verbs being of the present time is idle, because verbs of that time or tense may equally refer to all times. And whatever expression had been used, whether denoting the future or past time, there might always be room left for such cavils. Besides, no reason can be assigned, why the past time should be excluded any more than the future, if that verb of the present tense is thus to be racked. If this is not false reasoning against the Supreme Being, and a childish abuse of one’s genius and parts, what can be called so? …XLIII. The apostle writes nothing in opposition to this truth, when he says, Gal. 3:23. “But before faith came, we were kept under the law.” For it is far from the apostle’s intention to deny, that faith in Christ prevailed before his coming in the flesh, because, in the same chapter, he had highly commended the faith of Abraham, and proposed it as a pattern to us all, ver. 6, 7, 9. But by faith we here understand either the object of faith, the doctrine of the Gospel, as chap. 1:23, and the Lord Jesus himself, believed on in the world, 1 Tim. 3:16, or, the faith of the redemption already actually wrought out, as contradistinguished from the hope of the Old Testament saints, who, with earnest longing, as it were, expected the coming of the Lord, “waiting for the consolation of Israel,” Luke 2:25. And thus we have now shown, that the Old Testament saints had the same promises of eternal life with us, to be obtained by the same Christ, and the same faith in him, and consequently also had the same covenant of grace with us.”

— Herman Witsius, The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity, trans. William Crookshank, vol. 1 (London: T. Tegg &amp; Son, 1837), 259–73.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+It+is+a+matter+of+the+greatest+moment%2C+that+we+learn+distinctly+to+consider+the+covenant+of+grace%2C+either+as+it+is+in+its+substance+or+essence%2C+as+they+call+it%2C+or+as+it+is+in+diverse+ways+proposed+by+God%2C+with+respect+to+circumstantials%2C+under+different+economies.+If+we+view+the+substance+of+the+covenant%2C+it+is+but+only+one%2C+nor+is+it+possible+it+should+be+otherwise.+There+is+no+other+way+worthy+of+God%2C+in+which+salvation+can+be+bestowed+on+sinners%2C+but+that+discovered+in+the+Gospel.+Whence+the+apostle%2C+Gal.+1%3A7%2C+has+beautifully+said%2C+%E2%80%9Cwhich+is+not+another.%E2%80%9D+And+that+testament+which+was+consecrated+by+the+blood+of+Christ%2C+he+calls+%E2%80%9Ceverlasting%2C%E2%80%9D+Heb.+13%3A20%2C+because+it+was+settled+from+eternity%2C+published+immediately+upon+the+fall+of+the+first+man%2C+constantly+handed+down+by+the+ancients%2C+more+fully+explained+by+Christ+himself+and+his+apostles%2C+and+is+to+continue+throughout+all+ages%2C+and%2C+in+virtue+of+which%2C+believers+shall+inherit+eternal+happiness.+But+if+we+attend+to+the+circumstances+of+the+covenant%2C+it+was+dispensed+%E2%80%9Cat+sundry+times+and+in+divers+manners%2C%E2%80%9D+under+various+economies+for+the+manifestation+of+the+manifold+wisdom+of+God.+In+considering+this%2C+we+are+first+to+discourse+on+those+general+things+which+appertain+to+the+substance+of+the+covenant%2C+and+have+continued+in+every+age%3B+and+then+explain+the+different+economies+or+dispensations%2C+and+the+new+accessions+made+to+each%3B+which+we+will%2C+first%2C+do+in+a+general+and+concise+manner%2C+in+this+and+the+following+chapter%3B+then+gradually+descend+to+the+more+special+considerations.+II.+We+therefore+maintain%2C+agreeable+to+the+sacred+writings%2C+that+to+all+the+Elect%2C+living+in+any+period+of+time%3A+1st%2C+One+and+the+same+eternal+life+was+promised.+2dly%2C+That+Jesus+Christ+was+held+forth+as+the+one+and+the+same+author+and+bestower+of+salvation.+3dly%2C+That+they+could+not+become+partakers+of+it+any+other+way%2C+but+by+a+true+and+lively+faith+in+him.+If+we+demonstrate+these+three+things%2C+none+can+any+longer+doubt%2C+but+that+the+covenant+of+grace+must+be%2C+as+to+its+substance%2C+only+one+from+the+beginning.+For%2C+if+the+salvation+be+the+same%2C+and+the+author+of+it+the+same%2C+the+manner+of+communion+with+him+the+same%2C+it+is+certain%2C+the+covenant+itself+cannot+be+more+than+one.+II.+The+Scriptures+so+plainly+declare%2C+that+eternal+life+was+promised+to+the+Elect+from+the+beginning%2C+that+if+is+astonishing+any+Christians+could+venture+to+deny+it%3B+who%2C+indeed%2C+are+much+blinder+than+the+Jews+themselves%3B+of+whom+our+Lord+testifies%2C+John+5%3A39.+%E2%80%9CYe+do+search+the+Scriptures%2C+for+in+them+ye+think+ye+have+eternal+life%3A%E2%80%9D+and+that+they+were+neither+rash+nor+erroneous+in+thinking+that+the+promises+of+eternal+life%2C+and+the+manner+of+enjoying+them%2C+were+contained+in+the+Scriptures+they+had%2C+we+prove+by+the+most+cogent+arguments.+1st%2C+Because%2C+not+only+the+Lord+Jesus+does+not+charge+them%2C+in+this+respect%2C+with+the+least+error%2C+but+makes+use+of+that+as+a+reason+to+recommend+to+them+the+search+of+the+Scriptures.+But+it+is+very+inconsistent+with+the+great+sincerity+of+the+Lord+Jesus%2C+and+the+divine+dignity+of+the+Scriptures%2C+to+recommend+them+by+arguments+not+genuine%2C+or+to+recommend+their+value+and+usefulness+from+Jewish+forgeries.+Nay%2C+had+the+Jews+falsely+persuaded+themselves%2C+that+the+promises+of+eternal+life+were+contained+in+the+Old+Testament+records%2C+our+Lord+ought+not%2C+by+any+concession%2C+to+have+cherished+that+mistake%2C+which+would+have+hindered+them+from+acknowledging+the+excellence+of+his+doctrine%2C+and+consequently+the+divinity+of+his+person%3B+but+rather+to+have+exclaimed+against+them%3A+%E2%80%9CIn+vain+do+you+search+the+Scriptures%2C+in+hopes+of+finding+eternal+life+in+them%3B+attend+rather+to+me+and+my+doctrine%2C+who+am+the+first+who+came+into+the+world+as+a+preacher+of+eternal+life.%E2%80%9D+But+every+one+may+see+how+inconsistent+this+was+from+the+design+of+the+Lord+Jesus.+2ndly%2C+To+this+we+add%2C+that+Paul%E2%80%99s+hope+was+founded+on+the+Law+and+the+Prophets%2C+as+well+as+the+expectation+of+the+Jews%2C+Acts+24%3A14%2C+15%2C+%E2%80%9CBelieving+all+things%2C+which+are+written+in+the+Law+and+the+Prophets%3B+and+have+hope+towards+God%2C+which+they+themselves+also+allow%2C+that+there+shall+be+a+resurrection+of+the+dead%2C+both+of+the+just+and+unjust.%E2%80%9D+He+testifies%2C+that+the+Jews+expected+a+resurrection+of+the+dead%3B+he+professes+the+same+belief+and+hope+with+them%3B+and+that+he+did+not+do+so+out+of+a+vain+presumption%2C+but+from+a+faith+resting+on+the+Law+and+the+Prophets%2C+which+they+also%2C+in+their+manner%2C+carefully+read%2C+and+from+which+they+had+derived+the+same+expectation+with+him.+3dly%2C+The+Jews+were+so+far+from+judging+amiss+in+this+respect%2C+that%2C+on+the+contrary%2C+the+Lord+Jesus+reproved+the+Sadducees%2C+as+ignorant+of+the+Scriptures%2C+because+from+them+they+had+not+learned+life+eternal+and+the+resurrection%2C+Matt.+22%3A29.+IV.+But+let+us+argue+from+the+very+books+of+the+Old+Testament%3A+and+first%2C+after+the+example+of+our+Lord%2C+who%2C+Matt.+22%3A31%2C+32%2C+speaks+to+this+purpose%3A+%E2%80%9CBut%2C+as+touching+the+resurrection+of+the+dead%2C+have+ye+not+read+that+which+was+spoken+unto+you+by+God%2C+saying%2C+I+am+the+God+of+Abraham%2C+and+the+God+of+Isaac%2C+and+the+God+of+Jacob%3B+God+is+not+the+God+of+the+dead%2C+but+of+the+living.%E2%80%9D+This+inference+appeared+so+evident+to+the+multitude%2C+that+they+were+astonished+at+his+doctrine%2C+and+the+Sadducees+were+put+to+silence%2C+ver.+33%2C+34.+And%2C+indeed%2C+if+the+words+of+Moses%2C+quoted+by+Christ%2C+be+accurately+weighed%2C+the+evidence+of+this+argument+will+easily+appear+to+the+attentive+reader.+V.+For%2C+1st%2C+That+expression%2C+to+be+God+to+any%2C+in+its+full+import%2C+includes+life+eternal%2C+For%2C+when+God+becomes+the+sinner%E2%80%99s+God%2C+he+then+becomes+to+him+what+he+is+to+himself.+But%2C+what+is+he+to+himself%3F+Doubtless%2C+the+fountain+of+eternal+and+complete+blessedness.+When+God%2C+out+of+his+grace%2C+gives+himself+to+man%2C+he+gives+him+all+things%3B+for+himself+is+all+things.+Such+a+man+finds+in+God+%E2%80%9Ca+shield%E2%80%9D+against+every+evil%2C+and+an+%E2%80%9Cexceeding+great+reward%2C%E2%80%9D+Gen.+15%3A1.+And+what+can+he+desire+more+in+order+to+his+perfect+happiness%3F+Accordingly%2C+the+apostle+joins+these+two%2C+Heb.+11%3A16%2C+God+to+be+the+God+of+any+one%2C+and+to+have+prepared+for+them+a+city.+And+seeing+the+%E2%80%9Cgifts%E2%80%9D+of+God%E2%80%99s+grace%2C+especially+when+he+gives+himself%2C+%E2%80%9Care+without+repentance%E2%80%9D%2C+Rom.+11%3A29%3B+hereby+also+the+eternity+of+this+happiness+is+established.+%E2%80%A6XVII.+But+lest+they+should+cavil%2C+that+we+borrow+our+arguments+only+from+the+New+Testament+%28though+none+can+better+instruct+us+in+the+contents+of+the+Old+Testament+than+Christ+and+his+apostles%29%2C+we+shall+consider+some+passages+of+the+Old+Testament%2C+and+free+them+from+the+misconstructions+of+our+adversaries.+And%2C+first%2C+we+have+that+swanlike+song+of+Jacob%2C+Gen.+49%3A18.+%D7%9C%D7%99%D7%A9%D7%95%D7%A2%D7%AA%D7%9A+%D7%A7%D7%95%D7%99%D7%AA%D7%99+%D7%99%D7%94%D7%95%D7%94+%E2%80%9CI+wait+for+thy+salvation%2C+O+Lord.%E2%80%9D+The+aged+Prophet+was+now+at+the+point+of+death%3B+and%2C+being+full+of+the+Spirit+of+God%2C+he%2C+in+the+midst+of+his+prophecies%2C+in+which+he+foretels+what+was+to+befall+his+children+and+latest+posterity%2C+breaks+out+into+these+words%3B+which+were+not+spoken+without+the+Spirit+of+God%2C+so+as%2C+with+Smalcius%2C+to+be+referred+to+a+vain+persuasion%2C+nor+possibly+to+be+wrested+to+any+other+but+this+spiritual+and+eternal+salvation.+XVIII.+Here%2C+again%2C+let+a+certain+Jew+put+the+followers+of+Socinus%2C+if+possible%2C+to+the+blush%3A+in+opposition+to+whom+we+produce+this+paraphrase+of+the+Jerusalem+Targumist.+%E2%80%9COur+father+Jacob+said%2C+My+soul+does+not+expect+the+redemption+of+Gideon%2C+the+son+of+Joaz%2C+that+being+only+momentary%3B+nor+the+redemption+of+Samson%2C+because+a+transient+redemption%3B+but+the+redemption+thou+hast+mentioned+in+thy+word%2C+or+by+thy+word%2C+which+is+to+come+to+thy+people%2C+the+children+of+Israel%3B+my+soul%2C+I+say%2C+expects+this+thy+redemption.%E2%80%9D+Is+not+this+a+very+clear+testimony+of+the+most+certain+persuasion+and+the+fullest+assurance+of+their+salvation%3F+%E2%80%A6XXXIII.+When+the+same+apostle+affirms+that+our+%E2%80%9Csalvation+at+the+first+began+to+be+spoken+by+the+Lord%2C%E2%80%9D+Heb.+2%3A3%2C+it+is+clear+he+speaks+of+the+Gospel+completed%2C+and+of+the+Messiah%2C+the+author+of+salvation%2C+already+exhibited%3B+which+Gospel+the+Lord+first+published%2C+with+respect+to+the+apostles%2C+evangelists%2C+and+the+other+ordinary+preachers+that+followed+them.+For+otherwise+who+can+deny+that+Zacharias%2C+the+father+of+John+the+Baptist%2C+and+Mary+the+mother+of+our+Lord%2C+and+the+angels+who+proclaimed+his+nativity%2C+and+the+aged+Simeon%2C+and+John+the+Baptist%2C+were+preachers+of+salvation+before+the+Lord%3F+Of+the+Fathers+the+apostle+himself+affirms%2C+that+they+were+%CE%B5%CF%85%CE%B1%CE%B3%CE%B3%CE%B5%CE%BB%CE%B9%CF%83%CE%BC%CE%B5%CE%BD%CE%BF%CE%B9%2C+gospelized%2C+or+that+%E2%80%9Cthe+Gospel+was+preached+unto+them+as+well+as+unto+us%2C%E2%80%9D+Heb.+4%3A2.+XXXIV.+When+it+is+written%2C+Heb.+9%3A8.+%E2%80%9CThat+the+way+unto+the+holiest+of+all+was+not+yet+made+manifest%2C+while+as+the+first+tabernacle+was+yet+standing%3B%E2%80%9D+the+apostle+indeed+intimates%2C+that+the+manner+of+obtaining+salvation+was%2C+in+some+measure+hid%2C+in+comparison+of+the+brighter+lustre+of+the+Gospel.+For+then%2C+doubtless%2C+the+way+to+life+was+clouded+with+much+pomp+of+ceremonies+and+figures%3B+which+being+now+dispelled%2C+we+behold+with+open+face%2C+and+ardently+desire%2C+heavenly+and+spiritual+things.+But+from+this+it+no+ways+follows%2C+that+those+under+the+Old+Testament+had+no+knowledge+of+salvation%3B+any+more+than+it+can+be+concluded%2C+we+know+nothing+of+our+glorious+state%2C+because+John+says%2C+%E2%80%9CIt+doth+not+yet+appear+what+we+shall+be%2C%E2%80%9D+John+3%3A2.+We+may+almost%2C+in+the+same+manner%2C+answer+the+other+objections+advanced+by+our+adversaries.+But+it+is+no+part+of+our+design+to+examine+each+in+particular.+XXXV.+Now+let+us+proceed+to+the+second+thing%2C+which+we+undertook+to+prove%3B+that+in+Christ%2C+and+in+virtue+of+his+suretiship%2C+the+fathers+of+the+Old+Testament+also+obtained+salvation+even+as+we.+Which+Peter+declares+almost+in+so+many+words%2C+Acts+15%3A11%3A+%E2%80%9CBut+we+believe+that%2C+through+the+grace+of+the+Lord+Jesus+Christ%2C+we+shall+be+saved+even+as+they.%E2%80%9D+Where+the+pronoun+they+is+to+be+referred+to+the+fathers%2C+on+whose+neck+an+insupportable+yoke+of+ceremonies+was+put%2C+as+appears+both+from+the+grammatical+consideration+of+the+gender%2C+from+the+connexion+and+the+force+of+the+apostles+argument.+For%2C+since+%CE%BA%E1%BE%80%CE%BA%CE%B5%E1%BF%96%CE%BD%CE%BF%CE%B9+is+masculine+and+%CF%84%CE%B1+%E1%BC%94%CE%B8%CE%BD%CE%B1%2C+the+Gentiles%2C+mentioned+ver.+7%2C+is+neuter%2C+it+is+not+so+properly+referred+to+the+Gentiles+as+to+the+fathers.+And+we+are+not+here%2C+without+necessity%2C+to+have+recourse+to+an+enallage+of+gender.+And+then%2C+too%2C+what+method+of+commenting+is+it%2C+to+imagine+so+wide+an+hyperbaton+or+transposition%2C+and+to+bring+from+verse+7+a+noun%2C+to+which%2C+after+the+interposition+of+so+many+other+things%2C+a+pronoun+shall+at+length+answer+in+eleventh+verse%2C+and+which+yet+does+not+answer%3B+because%2C+in+the+words+immediately+preceding%2C+you+may+find+a+noun%2C+with+which+the+pronoun+in+question+may+be+very+well+joined%3F+In+fine%2C+it+will+either+be+nonsense%2C+or%2C+very+insipid%2C+if+the+words+be+so+construed.+For%2C+what+manner+of+reasoning+is+it%2C+if+we+suppose+the+apostle+to+have+said%3A+%E2%80%9CThe+yoke+of+ceremonies+ought+not+to+be+put+on+the+necks+of+the+Gentiles%2C+because%2C+we+Jews+and+apostles+believe%2C+that+we+shall+be+saved+in+the+same+manner+as+they%2C+by+the+alone+grace+of+the+Lord+Jesus+Christ%3F%E2%80%9D+For+besides+this%2C+it+was+improper+to+propose+the+Gentiles%2C+to+the+Jews+and+apostles%2C+as+a+pattern+of+salvation%2C+because+it+appears%2C+that+the+contrary+should+be+done%3B+and+we+could+only+conclude+from+that+position%2C+that+the+apostles+and+Jews+were+not+bound+to+circumcision%2C+and+the+other+ceremonies%2C+any+more+than+the+Gentiles.+But+that+was+not+the+thing+in+dispute.+But+according+to+our+interpretation%2C+the+apostle+argues+in+the+strongest+manner%3A+%E2%80%9CYou+ought+not+to+put+the+yoke+of+ceremonies+on+the+necks+of+the+disciples%2C+who+are+converted+from+among+the+Gentiles%2C+because+the+fathers+themselves%2C+who+were+under+that+yoke%2C+really+felt+the+uneasiness+of+it%2C+but+did+not+find+salvation+in+it%2C+and+yet+they+were+saved%2C+not+in+consequence+of+these+ceremonies%2C+but+by+the+grace+of+our+Lord+Jesus+Christ.+Neither+are+we%2C+nor+any+of+the+human+race%2C+to+take+any+other+way+to+attain+salvation.+They+therefore+are+under+a+mistake%2C+who+tell+the+disciples%2C+if+you+will+be+saved%2C+you+must+be+circumcised%2C+and+keep+the+law+of+Moses.%E2%80%9D+To+sum+up+the+whole%2C+then%2C+in+short%2C+the+apostle+here+declares+three+things.+1st%2C+That+the+fathers+were+saved.+2dly%2C+By+the+very+same+covenant+that+we+are.+3dly%2C+Through+the+grace+of+our+Lord+Jesus+Christ%3A+intimating+likewise+by+all+this+reasoning%2C+that+there+can+possibly+be+but+ONE+way+of+salvation.+XXXVI.+This+is+likewise+confirmed+by+that+famous+passage%2C+Heb.+13%3A8%2C+%E2%80%9CJesus+Christ+the+same+yesterday%2C+and+to-day+and+for+ever.%E2%80%9D+In+the+foregoing+verse+the+apostle+admonished+them+to+keep+fresh+in+their+memory+%E2%80%9Cthe+word%2C%E2%80%9D+which+their+guides+had+spoken+unto+them%2C+whose+faith+they+should+follow.+Now%2C+he+gives+this+for+the+reason+of+that+admonition%2C+because+%E2%80%9CJesus+Christ+is+the+same+yesterday%2C+and+to-day%2C+and+for+ever%3B%E2%80%9D+constantly+preached+by+all+the+teachers+of+the+truth%2C+believed+on+by+all%2C+and+to+be+believed+on+by+those+that+come+after%2C+if+they+will+imitate+the+faith+of+their+predecessors.+The+same+doctrine+therefore+is+always+to+be+retained%2C+because+Christ%2C+who+was+always+both+proposed%2C+and+believed%2C+as+the+author+of+salvation%2C+changeth+not.+But+the+particles%2C+yesterday%2C+to-day%2C+and+for+ever%2C+denote+all+the+differences+of+times.+Nor+does+yesterday+here+signify+something+of+a+late+date%2C+as+we+usually+say%2C+yesterday+or+lately%3B+but+all+the+time+past%3A+as+the+phrase+to-day+denotes+the+time+of+grace+under+the+New+Testament.+For%2C+this+is+compared+to+some+one+present+day%2C+as+chap.+3%3A13.+%E2%80%9CWhile+it+is+called+to-day%3A%E2%80%9D+and+chap.+4%3A7.+%E2%80%9CAgain%2C+he+limiteth+a+certain+day%2C+saying+in+David%2C+To-day%2C%E2%80%9D+%26c.%3B+of+which+2+Cor.+6%3A2%2C+%E2%80%9CBehold%21+now+is+the+accepted+time%2C+behold%21+now+is+the+day+of+salvation.%E2%80%9D+As%2C+therefore%2C+Christ+is+to-day%2C+under+the+New+Testament%2C+acknowledged+the+alone+author+of+salvation%2C+and+will+be+acknowledged+as+such+for+ever%3B+so%2C+in+like+manner%2C+yesterday%2C+under+the+Old+Testament%2C+which+day+is+now+past%2C+he+was+the+same%2C+and+as+such+was+declared+and+acknowledged.+XXXVII.+Let+us+also+add+what+we+have+in+Heb.+9%3A15%2C+%E2%80%9CAnd+for+this+cause+he+is+the+mediator+of+the+New+Testament%2C+that%2C+by+means+of+death%2C+for+the+redemption+of+the+transgressions+that+were+under+the+first+testament%2C+they+which+are+called+might+receive+the+promise+of+eternal+inheritance.%E2%80%9D+Where+we+have+an+open+declaration%2C+that+the+death+of+Jesus+Christ+was+effectual+for+the+redemption+of+transgressions+committed+under+the+Old+Testament.+For+thus+the+apostle+proceeds.+He+supposes+that+the+fathers+of+the+Old+Testament+were+saved%2C+notwithstanding+their+sins%3B+which+Socinus%2C+with+his+followers%2C+dare+not+deny.+He+says+further%2C+that+the+blood+of+bullocks+and+of+goats%2C+and+consequently+of+all+sacrifices+whatever%2C+could+not+really%2C+and+before+the+tribunal+of+God%2C+expiate+sin%2C+and+purify+the+conscience.+Yet+since%2C+as+he+declares%2C+without+shedding+of+blood+there+can+be+no+remission%2C+verse+22%2C+he+concludes%2C+it+was+necessary+that+the+death+of+Christ+should+indeed+be+undergone%2C+in+order+not+only+to+the+establishment+of+the+New+Testament%2C+but+by+virtue+of+which+the+redemption+of+former+sins+might+also+be+obtained.+This+is+the+genuine+meaning+of+the+sacred+writer.+XXXVIII.+And%2C+indeed%2C+Grotius+shamefully+shuffles%2C+when%2C+to+favour+the+Socinians%2C+he+thus+writes+on+this+place%3A+%E2%80%9CHis+death+intervened+for+this+end%2C+that+men+might+be+delivered+from+those+sins%2C+which+generally+prevailed%2C+before+Christ%2C+among+those+called+God%E2%80%99s+people.%E2%80%9D+Is+it+really+so%3F+Would+thus+%E2%80%9Cthe+redemption+of+the+transgressions+that+were+under+the+first+testament%2C%E2%80%9D+denote+such+an+action+of+Christ%2C+whereby+succeeding+ages+would+abstain+from+the+like+sins%2C+as+were+formerly+committed%3F+God+forbid+we+should+ever+pervert+Scripture+thus.+Redemption+is+%D7%9B%D7%A4%D7%93+an+expiation+of+sin%2C+upon+paying+a+ransom.+Christ+paid+this+for+all+the+sins+of+his+elect%2C+at+whatever+time+they+lived.+And+upon+the+credit+of+that+payment%2C+to+be+made+at+the+appointed+time%2C+believers%2C+even+under+the+Old+Testament%2C+obtained+redemption.+XXXIX.+Moreover%2C+since+it+is+evident+that+Old+Testament+saints+were+saved%2C+it+must+likewise+be+evident+that+they+were+saved+through+Christ.+For+our+Saviour+himself+says%2C+John+14%3A6%3A+%E2%80%9CNo+man+cometh+unto+the+Father+but+by+me.%E2%80%9D+And+Peter%2C+Acts+4%3A12%3A+%E2%80%9CNeither+is+there+salvation+in+any+other%3B+for+there+is+none+other+name+under+heaven+given+among+men%2C+whereby+we+must+be+saved.%E2%80%9D+Nothing+can+be+plainer+than+these+words%2C+which+seem+to+be+written+as+with+a+sun-beam.+Yet+the+itch+of+contradiction+has+found+something+to+say%2C+but+that+something+is+less+than+nothing.+XL.+Our+adversaries+except%2C+that+these+passages+should+be+understood+of+those+who+live+under+the+New+Testament%2C+and+therefore+that+both+Christ+and+Peter+speak+in+the+present%2C+and+not+in+the+past+time%3B+of+us%2C+and+not+of+the+Old+Testament+saints%3B+of+the+times+when+Christ+was+exhibited%2C+and+not+of+the+Old+Testament+times.+We+answer%3A+1st%2C+As+both+texts+are+expressed+in+universal+terms%2C+they+are+not+to+be+limited+without+cause+and+necessity%2C+as+there+is+none+in+this+case.+For+if+salvation+could+be+obtained+formerly+without+Christ%2C+equally+as+now+through+Christ%2C+what+need+had+we+of+Christ%E2%80%99s+coming%3F+Or%2C+what+so+very+great+matter+do+we+obtain+Christ%3F+2dly%2C+There+are+very+solid+reasons%2C+why+they+neither+ought+nor+can+be+thus+restricted.+Because+they+who+were+%E2%80%9Cwithout+Christ%2C+were+strangers+from+the+covenants+of+promise%2C+having+no+hope%2C+and+without+God+in+the+world.%E2%80%9D+Eph.+2%3A12.+3dly%2C+The+quibbling+about+the+verbs+being+of+the+present+time+is+idle%2C+because+verbs+of+that+time+or+tense+may+equally+refer+to+all+times.+And+whatever+expression+had+been+used%2C+whether+denoting+the+future+or+past+time%2C+there+might+always+be+room+left+for+such+cavils.+Besides%2C+no+reason+can+be+assigned%2C+why+the+past+time+should+be+excluded+any+more+than+the+future%2C+if+that+verb+of+the+present+tense+is+thus+to+be+racked.+If+this+is+not+false+reasoning+against+the+Supreme+Being%2C+and+a+childish+abuse+of+one%E2%80%99s+genius+and+parts%2C+what+can+be+called+so%3F+%E2%80%A6XLIII.+The+apostle+writes+nothing+in+opposition+to+this+truth%2C+when+he+says%2C+Gal.+3%3A23.+%E2%80%9CBut+before+faith+came%2C+we+were+kept+under+the+law.%E2%80%9D+For+it+is+far+from+the+apostle%E2%80%99s+intention+to+deny%2C+that+faith+in+Christ+prevailed+before+his+coming+in+the+flesh%2C+because%2C+in+the+same+chapter%2C+he+had+highly+commended+the+faith+of+Abraham%2C+and+proposed+it+as+a+pattern+to+us+all%2C+ver.+6%2C+7%2C+9.+But+by+faith+we+here+understand+either+the+object+of+faith%2C+the+doctrine+of+the+Gospel%2C+as+chap.+1%3A23%2C+and+the+Lord+Jesus+himself%2C+believed+on+in+the+world%2C+1+Tim.+3%3A16%2C+or%2C+the+faith+of+the+redemption+already+actually+wrought+out%2C+as+contradistinguished+from+the+hope+of+the+Old+Testament+saints%2C+who%2C+with+earnest+longing%2C+as+it+were%2C+expected+the+coming+of+the+Lord%2C+%E2%80%9Cwaiting+for+the+consolation+of+Israel%2C%E2%80%9D+Luke+2%3A25.+And+thus+we+have+now+shown%2C+that+the+Old+Testament+saints+had+the+same+promises+of+eternal+life+with+us%2C+to+be+obtained+by+the+same+Christ%2C+and+the+same+faith+in+him%2C+and+consequently+also+had+the+same+covenant+of+grace+with+us.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+between+God+and+Man%3A+Comprehending+a+Complete+Body+of+Divinity%2C+trans.+William+Crookshank%2C+vol.+1+%28London%3A+T.+Tegg+%26+Son%2C+1837%29%2C+259%E2%80%9373.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fbd11dbe7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6fbd11dbe7.html">Permalink</a><a class="src" href="https://heidelblog.net/2020/04/witsius-one-covenant-of-grace-multiple-administrations/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>In the Hebrew it is, ‘He does not afflict from his heart,’ that is, with pleasure and delight; or (which seems the best sense to me) not from his own mere motion without a cause given Him from the persons afflicted. Hence judgment is called God’s ‘strange work‘ [Isa. 28:21]. Showing mercy is his proper natural work, which flows from Himself without any cause in the creature. Judgment is his strange work, to which He never proceeds but when provoked, and as it were forced from the creature, whence it follows that He cannot delight in it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“In the Hebrew it is, ‘He does not afflict from his heart,’ that is, with pleasure and delight; or (which seems the best sense to me) not from his own mere motion without a cause given Him from the persons afflicted. Hence judgment is called God’s ‘strange work‘ [Isa. 28:21]. Showing mercy is his proper natural work, which flows from Himself without any cause in the creature. Judgment is his strange work, to which He never proceeds but when provoked, and as it were forced from the creature, whence it follows that He cannot delight in it.”

— Matthew Poole, Annotations on the Whole Bible | on Lamentations 3, verse 33">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+the+Hebrew+it+is%2C+%E2%80%98He+does+not+afflict+from+his+heart%2C%E2%80%99+that+is%2C+with+pleasure+and+delight%3B+or+%28which+seems+the+best+sense+to+me%29+not+from+his+own+mere+motion+without+a+cause+given+Him+from+the+persons+afflicted.+Hence+judgment+is+called+God%E2%80%99s+%E2%80%98strange+work%E2%80%98+%5BIsa.+28%3A21%5D.+Showing+mercy+is+his+proper+natural+work%2C+which+flows+from+Himself+without+any+cause+in+the+creature.+Judgment+is+his+strange+work%2C+to+which+He+never+proceeds+but+when+provoked%2C+and+as+it+were+forced+from+the+creature%2C+whence+it+follows+that+He+cannot+delight+in+it.%E2%80%9D%0A%0A%E2%80%94+Matthew+Poole%2C+Annotations+on+the+Whole+Bible+%7C+on+Lamentations+3%2C+verse+33&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d9ae7c8f5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6d9ae7c8f5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=In%20the%20Hebrew%20it%20is%2C%20%E2%80%98He,that%20He%20cannot%20delight%20in%20it&amp;text=In%20the%20Hebrew%20it%20is%2C%20%E2%80%98He%20does%20not&amp;text=it%20follows%20that%20He%20cannot%20delight%20in%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7302550d0c" data-kw="">
<blockquote><p>Ye,” says Christ, “who are evil, know how to do good to your children” (Mt. 7:11); what then are we to expect from the very fountain of goodness? As, then, parents are not willingly angry with their children, nor handle them roughly, there is no doubt but that God never punishes men except when He is constrained. There is, as I have said, an impropriety in the expression, but it is enough to know, that God derives no pleasure from the miseries of men, as profane men say, who utter such blasphemies as these, that we are like balls with which God plays, and that we are exposed to many evils, because God wishes to have as it were, a pleasant and delectable spectacle in looking on the innumerable afflictions, and at length on the death of men. That such thoughts, then, might not tempt us to unbelief, the prophet here puts a check on us, and declares that God does not afflict from his heart, that is, willingly, as though He delighted in the evils of men, as a judge, who, when he ascends his throne and condemns the guilty to death, does not do this from his heart, because he wishes all to be innocent, and thus to have a reason for acquitting them; but yet he willingly condemns the guilty, because this is his duty. So also God, when He adopts severity towards men, He indeed does so willingly, because He is the judge of the world; but He does not do so from the heart, because He wishes all to be innocent—for far away from Him is all fierceness and cruelty; and as He regards men with paternal love, so also He would have them to be saved, were they not as it were by force to drive Him to rigor. And this feeling he also expresses in Isaiah, “Ah! I will take consolation from mine adversaries.” (Isa. 1:24) He calls them adversaries who so often provoked Him by their obstinacy; yet He was led unwillingly to punish their sins, and hence He employed a particle expressive of grief, and exclaimed ‘Ah!’ as a father who wishes his son to be innocent, and yet is compelled to be severe with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Lamentations</cite>, 3 | verse 33, “For he doth not afflict willingly nor grieve the children of men.”</span></figcaption>

</figure><figure class="quote" id="q-25871be9fa" data-kw="">
<blockquote><p>The goodness of God is his inclination to deal well and bountifully with his creatures. (Cocceius, Sum, p. 50) ‘Tis that whereby He wills there should be something besides Himself for his own glory. God is good in Himself and to Himself, i.e. highly amiable to Himself; and therefore some define it a perfection of God, whereby He loves Himself and his own excellency; but as it stands in relation to his creatures, ’tis that perfection of God whereby He delights in his works and is beneficial to them. God is the highest goodness, because He does not act for his own profit, but for his creatures’ welfare and the manifestation of his own goodness. He sends out his beams without receiving any addition to Himself or substantial advantage from his creatures. ‘Tis from this perfection that He loves whatsoever is good, and that is whatsoever He has made, for ‘every creature of God is good.‘ (1 Tim. 4:4) Every creature has some communications from Him, which cannot be without some affection to them; Every creature has a footstep of divine goodness upon it; God therefore loves that goodness in the creature, else He would not love Himself. (Cajetan, in pt. 2 of 2, quest. 34, art. 3) God hates no creature, no not the devils and damned as creatures; He is not an enemy to them as they are the works of his hands: He is properly an enemy that does simply and absolutely wish evil to another; but God does not absolutely wish evil to the damned; that justice that He inflicts upon them, the deserved punishment of their sin, is part of his goodness (as shall afterward be shown).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Several Discourses upon the Existence &amp; Attributes of God</cite>, … (d. 1680; London: Newman, 1682), Goodness of God, pp. 584-85</span></figcaption>

<blockquote><p>III Proposition: In asking any spiritual gift we are encouraged by the bounty and mercy of God [as in Ps. 119:64]. David signifies both:

1. His bounty or benignity, or that free inclination which is in God to do good to his creatures.

2. His mercy respects the creature as affected with any misery. Mercy properly is a proneness to succour and relieve a man in misery notwithstanding sin. Now the larger thoughts of mercy, the more hope, partly because we have no plea of merit and therefore mercy is the fountain of all the good which comes to us from God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>One Hundred &amp; Ninety Sermons on the Hundred &amp; Nineteenth Psalm</cite>, … (London: T.P., 1681) | sermon 72, on Ps. 119:64, pp. 436-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

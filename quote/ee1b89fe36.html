<main class="wrap"><figure class="quote" id="q-ee1b89fe36" data-kw="">
<blockquote><p>Therefore, in this example even of Paul regenerate (for now regenerate he says this about himself) we see that even a regenerate person sometimes is made a slave of sin and is led away captive by it. ‘For what.’ He shows that he is sold under sin and dragged away captive as it were, to serve sin, from the disapproval of the deed that he perpetrates, that is, from the judgment of his mind. From alien judgment from sin that he nevertheless perpetrates, it follows that he is sold under sin as tyranny and is rendered captive to the law of sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey Carmichael, Classic Reformed Theology Series vol. 5 (Reformation Heritage Books, 2021), 109.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin.html">Sin</a></span></div>

<blockquote><p>Yet it is a doctrine of the highest importance to the surer perception of the misery of man and the necessity and efficacy of saving grace. Thus it is deservedly placed among the primary doctrines of the Christian religion. II. Original sin is sometimes used more broadly to embrace imputed and inherent sin, into which as two parts it is said to be resolvable (thus it is taken by Ursinus, Zanchius and others).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.10</span></figcaption>

</figure><figure class="quote" id="q-542411a48a" data-kw="degrees">
<blockquote><p>Hence it appears that the question does not concern the equality of sins or gradual inequality, but their essential demerit. The question is not whether all sins are equal to each other (the paradox of the ancient Stoics and falsely charged upon us by our opponents). If all sins agree in being mortal, it does not follow that they are equal in all things because they can differ from each other as to degree of demerit, so as to deserve a greater or lesser punishment. Rather the question is only whether they are equally mortal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.3</span></figcaption>

</figure><figure class="quote" id="q-53a09de88b" data-kw="">
<blockquote><p>‘he shall ask,’ i.e. with confidence, as 1 John 5:14. But ‘there is a sin unto death,’ i.e… of such as have apostatized from a former specious profession into heresy and debauchery, and continue obstinate therein, against all methods of recovery; that are, as Jude 1:12, even twice dead, etc. ‘I do not say that he shall pray for it;’ i.e. I do not give that encouragement to pray for such, with that hope and expectation of success, as for others; though he does not simply forbid praying for them neither.</p></blockquote>

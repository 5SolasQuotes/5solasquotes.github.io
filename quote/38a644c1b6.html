<main class="wrap"><figure class="quote" id="q-38a644c1b6" data-kw="">
<blockquote><p>And the Greek text, as also the Latin version, puts a clear difference between the person of Peter and the stone upon which the Church is founded: Tu es Petrus, et super hanc petram. Upon that Stone and ground which thou hast now laid, namely that Jesus is the Christ, the Son of the Living God, the Church is founded. For the Church is not founded upon a mortal man but upon the Son of the eternal God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery</cite>, bk. 2, ch. 4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bffd5fb0a7" data-kw="">
<blockquote><p>Thus, when the Pope usurps the triple office of Christ, he destroys Christ’s gospel by his own traditions, also destroying Christ’s redemption by his own indulgences, purgatory, masses, and rewards; all this while verbally professing Jesus to be the Christ. Notwithstanding his profession, he must be regarded as having denied Christ, together with the Father, by his very deeds and works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Whether It Can Be Proven the Pope Is the Antichrist</cite>, 7th Disputation, p. 58</span></figcaption>

</figure><figure class="quote" id="q-b6d80b7d0a" data-kw="">
<blockquote><p>Let Peter have the pre-eminence, still there is a great difference between the honour of rank and the possession of power. We see that the Apostles usually left it to Peter to address the meeting, and in some measure take precedence in relating, exhorting, admonishing, but we no where read any thing at all of power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.5</span></figcaption>

— John Calvin, Institutes of the Christian Religion, 4.6.5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLet%20Peter%20have%20the%20pre-eminence%2C%20still%20there%20is%20a%20great%20difference%20between%20the%20honour%20of%20rank%20and%20the%20possession%20of%20power.%20We%20see%20that%20the%20Apostles%20usually%20left%20it%20to%20Peter%20to%20address%20the%20meeting%2C%20and%20in%20some%20measure%20take%20precedence%20in%20relating%2C%20exhorting%2C%20admonishing%2C%20but%20we%20no%20where%20read%20any%20thing%20at%20all%20of%20power.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%204.6.5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb6d80b7d0a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b6d80b7d0a.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-63559a9ac2" data-kw="Scripture interprets Scripture">
<blockquote><p>Whatever, then, the papists talk so vauntingly of fathers and of councils, yet it is to their ecclesiastical prince, that is to the pope, that all controversies are finally referred, and with that prince and supreme interpreter rests the whole meaning of scripture and the right of adjudicating upon it. But we do not acknowledge that prince, whom Christ never constituted; and we say that the scripture itself publicly set forth and propounded is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 7</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Whatever, then, the papists talk so vauntingly of fathers and of councils, yet it is to their ecclesiastical prince, that is to the pope, that all controversies are finally referred, and with that prince and supreme interpreter rests the whole meaning of scripture and the right of adjudicating upon it. But we do not acknowledge that prince, whom Christ never constituted; and we say that the scripture itself publicly set forth and propounded is its own interpreter.”

</figure><figure class="quote" id="q-1aa6efdfbb" data-kw="Pope judge in own cause">
<blockquote><p>It is unjust that he who is the subject of the controversy should be the judge of the controversy; and I am in greater doubt of the pope’s authority than of the sense of this passage. There is need, therefore, of some other and more impartial judge. For who could say this was a legitimate interpretation;— since the pope says that infallibility is promised to him in this text, therefore he is infallible? Surely he needs some greater authority and testimony than his own word to prove that such a promise hath been made to him. Besides, the papists themselves acknowledge, that the pope may not only err, but even be a heretic, and so completely overturn this interpretation of the passage. Finally, councils, fathers, popes, are men; and scripture testifies that all men are deceitful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 8</span></figcaption>

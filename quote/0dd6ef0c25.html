<main class="wrap"><figure class="quote" id="q-0dd6ef0c25" data-kw="">
<blockquote><p>48. That which God wills, that is, swears to be, is not in diverse times, nor does He swear [jubet, commandingly oblige] and call by distinct actions, but by one most simple act. And therefore diverse decrees ought not to be discerned in God. Nor is it true with [amidst, apud] God ‘that which is last in execution, that is the first in intention’, unless we may assuredly so interpret this phrase, ‘that which is last in execution, that is the first in intention’ in the manner that every good most evidently shines forth from preceding acts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-cocceius.html">Johannes Cocceius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Sections 43 &amp; 47-48 of ch. 10, ‘Of the Communicable Attributes of God’ in A Sum of Theology Rehearsed out of the Scriptures (Geneva, 1665), pp. 149-150 See especially the end of section 47. | Speaking of the Revealed Will:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>
<div class="actions"><button class="copy" data-copy="“48. That which God wills, that is, swears to be, is not in diverse times, nor does He swear [jubet, commandingly oblige] and call by distinct actions, but by one most simple act. And therefore diverse decrees ought not to be discerned in God. Nor is it true with [amidst, apud] God ‘that which is last in execution, that is the first in intention’, unless we may assuredly so interpret this phrase, ‘that which is last in execution, that is the first in intention’ in the manner that every good most evidently shines forth from preceding acts.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c77fc470bc" data-kw="">
<blockquote><p>XXIV. All these [previous] things are not therefore spoken that we should reject this distinction of the will of God into his antecedent and consequent will: For we know that among the decrees of God, some are before and some are after in order. But we deny that there are two decrees of God, between which man’s will steps in, as if man’s will came between the decree of creating man and the decree of condemning certain men. But we deny that the will of man does so come between the two decrees of God that the first, or antecedent decree, is broken off by the will of man and that God is compelled to absist from that end which He had propounded to Himselfe and which He did seriously intend: We deny also in the work of our election, the precise will of God to depend on the foreseeing of any power or action of man’s free-will, or the consequent will of God to be suspended on man’s will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, ch. 5, ‘Of the Antecedent &amp; Consequent Will of God’ in The Anatomy of Arminianism… (London: Snodham, 1620), pp. 27-41, pp. 40-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

 Books Online</a></div>
</figure><figure class="quote" id="q-68af6d1841" data-kw="">
<blockquote><p>Hence it appears what we ought to think of Damascene his opinion, who divides the will of God into his precedent and consequent will… And indeed this distinction in itself is to be allowed, but that is not a very fit example [of it] which he has set down or alleged concerning his precedent will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace</cite>, pp. 96-102 in 4th Crimination in A Christian &amp; Plain Treatise of the Manner &amp; Order of Predestination &amp; of the Largeness of God’s Grace (d. 1602: London: Welby &amp; Clarke, 1606), pp. 96-97</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-0214bc5af0" data-kw="">
<blockquote><p>God from eternity either approves or disapproves of something. Approval in general is either bare and without the decree, or it is with the decree. Approval without the decree is when God approves something simply, yet He does not decree that it be chosen or followed after. Approval without the decree belongs to all good things with respect to themselves, though they are not at any time realized, of which sort are the conversion, faith, and salvation of reprobates; which God surely approves of simply, but does not decree to come about; thus He decrees them not to come about… Concerning approval without the decree, see Dt. 5:29, “O that there were such a heart in them, that they would fear me and keep all my commandments always, that it might be well with them, and with their children forever!” 1 Tim. 2:4, “Who will have all men to be saved, and to come unto the knowledge of the truth.” 1 Tim. 4:10, “…who is the Savior of all men, specially of those that believe.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Brief Instruction on the Eternal Approval &amp; Disapproval of the Divine Mind’</cite>, trans. Charles Johnson &amp; Travis Fentiman (1593/4; ReformedBooksOnline, 2020), p. 3 Rollock here positis an eternal foundation for the revealed will of God, namely God’s will of approval and disapproval. This paradigm would continue through Rutherford and others.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>[Edward Leigh:] ‘God is patient, Psalm 103:8; Job. 21:7. God’s patience is that whereby He bears the reproach of sinners and defers their punishments; or it is the most bountiful will of God, whereby He doth long bear with sin which He hates, sparing sinners, not minding their destruction, but that He might bring them to repentance. See Acts 13:18.’¹ … It is, thus, ‘the most bountiful will of God not suffering his displeasure suddenly to rise against his creatures offending, to be avenged of them, but He does warn them beforehand, lightly correct and seek to turn them unto Him.’² ¹ Leigh, Body of Divinity, II.xiii (p. 299), citing marginally Nahum 1:3 and Isa. 30:18; cf. Cocceius, Summa theol., III.x.67. ² Leigh, Treatise, II.xiii (p. 106).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-8335b7151c" data-kw="">
<blockquote><p>How faith is a condition. XI. As to the former, when we say that faith is a condition of the covenant, we do not mean it absolutely and according to its nature and essence… Rather it must be considered relatively and instrumentally, inasmuch as it embraces Christ and applies to Him for righteousness and through him obtains the right to eternal life. First, it is distinguished from the works of the law (which could not be done if it were taken absolutely because thus it is a work of the law)… Therefore it [being a condition] cannot be ascribed to faith materially (inasmuch as it is a work), but instrumentally (inasmuch as it is the hand apprehending).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Question 3, ‘Is the covenant of grace conditional and what are its conditions?’ in Institutes of Elenctic Theology, ed. James Dennison Jr., trans. George Giger, 3 vols. (P&amp;R, 1992–1997), vol. 2, pp. 184–89</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“How faith is a condition. XI. As to the former, when we say that faith is a condition of the covenant, we do not mean it absolutely and according to its nature and essence… Rather it must be considered relatively and instrumentally, inasmuch as it embraces Christ and applies to Him for righteousness and through him obtains the right to eternal life. First, it is distinguished from the works of the law (which could not be done if it were taken absolutely because thus it is a work of the law)… Therefore it [being a condition] cannot be ascribed to faith materially (inasmuch as it is a work), but instrumentally (inasmuch as it is the hand apprehending).”

— Francis Turretin, Question 3, ‘Is the covenant of grace conditional and what are its conditions?’ in Institutes of Elenctic Theology, ed. James Dennison Jr., trans. George Giger, 3 vols. (P&amp;R, 1992–1997), vol. 2, pp. 184–89">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHow+faith+is+a+condition.+XI.+As+to+the+former%2C+when+we+say+that+faith+is+a+condition+of+the+covenant%2C+we+do+not+mean+it+absolutely+and+according+to+its+nature+and+essence%E2%80%A6+Rather+it+must+be+considered+relatively+and+instrumentally%2C+inasmuch+as+it+embraces+Christ+and+applies+to+Him+for+righteousness+and+through+him+obtains+the+right+to+eternal+life.+First%2C+it+is+distinguished+from+the+works+of+the+law+%28which+could+not+be+done+if+it+were+taken+absolutely+because+thus+it+is+a+work+of+the+law%29%E2%80%A6+Therefore+it+%5Bbeing+a+condition%5D+cannot+be+ascribed+to+faith+materially+%28inasmuch+as+it+is+a+work%29%2C+but+instrumentally+%28inasmuch+as+it+is+the+hand+apprehending%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Question+3%2C+%E2%80%98Is+the+covenant+of+grace+conditional+and+what+are+its+conditions%3F%E2%80%99+in+Institutes+of+Elenctic+Theology%2C+ed.+James+Dennison+Jr.%2C+trans.+George+Giger%2C+3+vols.+%28P%26R%2C+1992%E2%80%931997%29%2C+vol.+2%2C+pp.+184%E2%80%9389&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8335b7151c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8335b7151c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=How%20faith%20is%20a%20condition.%20XI,as%20it%20is%20the%20hand%20apprehending&amp;text=How%20faith%20is%20a%20condition.%20XI.%20As%20to&amp;text=instrumentally%20%28inasmuch%20as%20it%20is%20the%20hand%20apprehending" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-040b5004ca" data-kw="">
<blockquote><p>As the act of healing through the eyes of the Israelites and the brazen serpent went together; so, in the act of justifying, these two, faith and Christ, have a mutual relation, and must always concur- faith as the action which apprehendeth, Christ as the object which is apprehended; so that neither the passion of Christ saveth without faith, nor doth faith help unless it be in Christ, its object.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Puritan Golden Treasury</cite>, p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a> › <a href="../topics/justification/faith-alone/faith-as-instrument.html">Faith as instrument</a></span><span class="t"><a href="../topics/faith/faith-as-instrument.html">Faith as Instrument</a> › <a href="../topics/faith/faith-as-instrument/faith-receives-christ.html">Faith receives Christ</a></span></div>

</figure><figure class="quote" id="q-5911d442cf" data-kw="">
<blockquote><p>Controversy II: What is justifying faith? … Antithesis [of Romanists]: Justifying faith is one of the dispositions for justification; it is not a certain knowledge of the divine will nor a trust in divine mercy in Christ, but a simple mental assent, by which we accept the whole word of God, even without understanding it, as well as the traditions of the Roman Church. [The Reformed] Censure:

1. The definition of faith and many examples in Hebrews 11 prove that faith is a confident assent, that is, a trust in God that generates obedience. See Romans 4, where Abraham’s faith is discussed.

2. The phrases “believe in God” (Job 12 and 14; 1 Peter 1) and “hope and trust in God,” and similar ones in the Psalms, prove that faith is not a simple assent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“Controversy II: What is justifying faith? … Antithesis [of Romanists]: Justifying faith is one of the dispositions for justification; it is not a certain knowledge of the divine will nor a trust in divine mercy in Christ, but a simple mental assent, by which we accept the whole word of God, even without understanding it, as well as the traditions of the Roman Church. [The Reformed] Censure:

1. The definition of faith and many examples in Hebrews 11 prove that faith is a confident assent, that is, a trust in God that generates obedience. See Romans 4, where Abraham’s faith is discussed.

2. The phrases “believe in God” (Job 12 and 14; 1 Peter 1) and “hope and trust in God,” and similar ones in the Psalms, prove that faith is not a simple assent.”

ne</a></div>
</figure><figure class="quote" id="q-45d25bffc7" data-kw="">
<blockquote><p>What is the work of the Holy Ghost with respect unto the objective evidence which we have concerning the Scripture, that it is the word of God, which is the formal reason of our faith, and whereinto it is resolved?… … These things being supposed , we do affirm, That it is the authority and truth of God, as manifesting themselves in the supernatural revelation made in the Scripture [emphasis added], that our faith arises from and is resolved into. … As the issue of this whole discourse, it is affirmed that our faith is built on and resolved into the Scripture itself, which carries with it its own evidence of being a divine revelation; and therefore doth that faith ultimately rest on the truth and authority of God alone, and not on any human testimony, such as is that of the church, nor on any rational arguments or motive that are absolutely fallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Holy Spirit</cite>, bk. 6, pt. 1, The Reason of Faith; or, an Answer unto that inquiry, ‘Wherefore we believe the Scripture to be the Word of God;’ with the causes and nature of that faith wherewith we do so: wherein the grounds whereon the Holy Scripture is believed to be the Word of God with faith divine and supernatural are declared and vindicated in Pneumatologia: or, A Discourse concerning the Holy Spirit, Continued in Works, vol. 4, pp. 1-115 | See especially Ch. 5, ‘Divine Revelation itself the only foundation and reason of faith’, p. 69 ff., pp. 69, 72, 81</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

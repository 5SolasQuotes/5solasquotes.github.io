<main class="wrap"><figure class="quote" id="q-e976162133" data-kw="">
<blockquote><p>If the door of thine heart be opened by this key, to give admission to the King of Glory, God’s hand must turn the key. The Lord opened the heart of Lydia, that she attended to the words of Paul, Acts 16. Paul might have preached his heart out before Lydia’s heart would have opened to let the Word in, if God had not undertaken the work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Man’s Calling… (London: T.P., 1662), ch. 15, ‘How a Christian may exercise himself to godliness in hearing and reading the Word, and of preparation for hearing’</cite>, p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f01cfd4d79" data-kw="">
<blockquote><p>Yet does he exhort the people that they should not only regard the outward building, and the outward rites and sacrifices: but that they should chiefly give their hearts unto Him that promised to dwell in the Temple. And this same doctrine does even now at this day declare the true use of the sacraments, and does much more appertain unto us, unto whom the truth is plainly revealed, all the shadows of the law being abolished, than it did to the old fathers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms of David Truly Opened &amp; Explained by Paraphrasis... (London: Denham, 1581), on Ps. 24</cite>, p. 39</span></figcaption>

</figure><figure class="quote" id="q-acf626ff03" data-kw="">
<blockquote><p>3. The wooings of Christ to gain your hearts: Consider Him bowing the heavens and coming down, and laying aside his robes of majesty, and putting on your filthy garments: Consider Him going about from place to place, on no other errand, but to gain your hearts and win your souls: And, whoever spake such effectual words as Christ spake when He was upon the earth? Who ever gave such precious jewels to a bride, as Christ gave to his spouse? Who ever put on such apparel as Christ did, when He wooed his Church?… Ah! poor Sinners, see your Jesus hanging on the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners; and come, Oh come and throw yourselves into his bleeding arms! Away with all prejudicate opinions! Who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth: Corrupt hearts speak truth; say not Christ is unwilling, but you are unwilling; ‘I would, but ye would not.’ [Mt. 23:37] 4. The weepings of Christ if He cannot prevail. Thus we find Him in the Gospel expressing Himself, not only in words, but in tears. And when He was come near Jerusalem, He beheld the city, and wept over it, Lk. 19:41… What? Christ to weep for you, over you? Methinks, if you had hearts of stone, it should melt your hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Looking Unto Jesus… (d. 1664; Edinburgh: Ormiston, 1723)</cite>, pp. 246–47</span></figcaption>

to-your-heart/#:~:text=3.%20The%20wooings%20of%20Christ%20to,stone%2C%20it%20should%20melt%20your%20hearts." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1f3510be1d" data-kw="">
<blockquote><p>3. This external and internal calling may be ineffectual or effectual. [1.] The ineffectual call consists in the bare tender and offer of grace, but it is not entertained. God may knock at the door of the heart that does not open to Him; knock by the word, knock by the motions of the Spirit and checks of conscience; so ‘many are called, but few are chosen,’ Matt 22:14. There is not the fruit of election, nor are these the called according to purpose. [2.] The effectual call is when God changes the heart, and brings it home to Himself by Jesus Christ…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 12, Sermons Upon Romans 8, Sermon 8, p. 288</span></figcaption>

</figure><figure class="quote" id="q-904eca776e" data-kw="">
<blockquote><p>(2) God has been importunate in entreaties of us. God offers not only truce, but a peace, and has been most active in urging a reconciliation. Can He manifest his willingness in clearer methods, than that of sending his Son to reconcile the world to Himself? Can He evidence more sincerity than by his repeated and reiterated pressing of our souls to the acceptance of Him? God knocks at our hearts, and we are deaf to Him; He thunders in our ears, and we regard Him not; He waits upon us for our acceptance of his love, and we grow more mad against Him; He beseeches us, and we ungratefully and proudly reject Him; He opens his bosom, and we turn our backs; He offers us his pearls, and we tread them under our feet; He would give us angels’ bread, and we feed on husks with swine. The wisdom of God shines upon us, and we account it foolishness. The infinite kindness of God courts us, and we refuse it, as if it were the greatest cruelty. Christ calls and begs, and we will not hear Him either commanding or entreating…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Stephen Charnock, 5 vols. (d. 1680; Edinburgh: Banner of Truth, 1997), vol. 5, “Man’s Enmity to God,”</cite>, p. 521</span></figcaption>

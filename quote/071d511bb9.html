<main class="wrap"><figure class="quote" id="q-071d511bb9" data-kw="">
<blockquote><p>X. While Christ remained on the earth, however, his body was not advanced to that full perfection of glory, which it has possessed ever since its exaltation above the heavens. From condescension to the weakness of the disciples, he suffered it to be somewhat obscured, so as not visibly to shine forth in all its brightness, during the forty days he conversed with them. They must, otherwise, have been incapable of looking stedfastly upon him, and far less able to behold his splendour, than were the Israelites of old, to behold the radiant face of Moses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sacred Dissertations, on What Is Commonly Called the Apostles’ Creed</cite>, trans. Donald Fraser, vol. 2 (London: Khull, Blackie &amp; Co., 1823), 171.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection.html">Resurrection</a></span></div>

</figure><figure class="quote" id="q-1d18119d92" data-kw="">
<blockquote><p>First, by His resurrection He has overcome death, that He might make us partakers of the righteousness which He has obtained for us by His death. Secondly, by His power we are also now raised up to a new life. Thirdly, the resurrection of Christ is to us a sure pledge of our blessed resurrection.</p></blockquote>

</figure><figure class="quote" id="q-a974238fb8" data-kw="">
<blockquote><p>Besides, he is just as well as merciful; and it is necessary from the justice of God, as will be observed hereafter, that the bodies of the wicked be raised, not merely to be tormented, but that his justice might be glorified in the righteous punishment of them.</p></blockquote>

</figure><figure class="quote" id="q-f74fe99bd9" data-kw="">
<blockquote><p>102 Q. What benefits do believers receive from the resurrection of Christ? A. Four in all. First, the resurrection of Christ is a sure testimony to us that God considers us to be as just and righteous in His eyes as the body of Christ was when He arose from the dead out of all of our sins. This is what St. Paul teaches in 1 Corinthians 15[:17]: “If Christ were not risen, you would still be in your sins.” From that it follows that since Christ has risen, believers are no longer in their sins. Not that there is no more sin them but that it is pardoned and not imputed to them. Christ died not in His own sin but in all of those sins of ours that we commit right up to our death, and He arose out of all of those selfsame sins. It necessarily follows, therefore, that every single one of our sins laid upon His body is completely punished and paid for. Otherwise Christ could not have arisen. For if even one sin remains, death, the penalty for sin, also remains (Rom. 6[:23]). This teaching is found in the verse mentioned a short while ago (1 Cor. 15[:17]) and in Romans 4[:25]: “Christ was delivered up because of our offenses and was raised because of our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Firm Foundation, Texts and Studies</cite>, trans. Lyle Bierma (Grand Rapids: Baker, 1995), 73.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/resurrection.html">Resurrection</a></span></div>

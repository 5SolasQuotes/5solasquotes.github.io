<main class="wrap"><figure class="quote" id="q-c4667ff95f" data-kw="">
<blockquote><p>All men are to be loved alike. But since you cannot do good to all men, you must therefore especially do good to those to whom you are more nearly joined by lot as it were — by opportunity either of time, place, or any other thing whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades</cite>, 1.10, vol. 1, pp. 185-86 | “Whatever man stands in need of our aid, he both is and is to be counted as our neighbour. And yet, all this notwithstanding, there is no reason that there should not be an order, a measure, and a decent regard, in love and well-doing. For Augustine rightly said, in the twenty-seventh chapter of his book de Doctrina Christiana: “No sinner, in that he is a sinner, is to be loved.” And in the twenty-eighth chapter:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><figure class="quote" id="q-32262f0348" data-kw="">
<blockquote><p>What we call beautiful in objects, to speak in the mathematical style, seems to be in a compound ratio of uniformity and variety; so that where the uniformity of bodies is equal, the beauty is as the variety; and where the variety is equal, the beauty is as the uniformity.</p></blockquote>

<blockquote><p>1. Whether every instituted worship and its parts and circumstances are prescribed by the Word of God? It is affirmed.

2. Whether any through pretended opinions, the authority of the Church or the power of the magistrate are able to impose these in part on consciences? It is denied.

3. Whether instituted worship is mutable? It is affirmed with a distinction.</p></blockquote>

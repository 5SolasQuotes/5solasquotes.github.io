<blockquote><p>Potential Being to Something is Pure Act [see pp. 50-55 of the Summary]

40. Act and potency¹ divide being and every kind of being. This Scholastic axiom must be understood of act and potency as disjunctive attributes of being, where its truth is sufficiently plain. The sense is: everything of which the definition of being holds (namely, what existence is not repugnant to) either actually exists or does not actually exist. This disjunctive is valid not only of being as a transcendental but also of categorical being, so that everything of which the definition of substance or any of the accidents is true, either actually exists or is in objective potency to existing.

41. Potency involves some imperfection if it is understood in the sense of subjective or objective potency (potential being) [see pp. 51-52] or of passive or obediential potency¹ [see pp. 52-53]; but not if it is understood as: the possible is opposed to the impossible. ¹ [See also ‘On Obediential Potency’.] The point is plain from the definitions of these potencies; for all these potencies adduced before agree in that they express the capacity of receiving some real perfection, and so that which is said to be in this sort of potency is in itself perfectible and hence in some way imperfect. Actual being on the contrary does not involve imperfection. The same must be said of the logically possible and of active potency¹ [that these do not involve imperfection]. ¹ [The importance here is because the First Cause (i.e. God) has no passive potency, or capability to be acted upon or effected, but has all active potency, that is, to act upon others. This is not special pleading for God, but is plainly necessary for what a First Cause must be. See ‘On the Distinction Between Passive Power (Denied) &amp; Active Power (Affirmed) About God’.]

42. Act and potency as constitutive principles involve imperfection insofar as they are mutually perfectible in themselves; for only the imperfect is perfectible.

43. Potential being considered in itself is not simply real, that is, does not really exist, save virtually in its causes. But it differs conceptually from the absolutely nothing and from being of reason [that which only exists in a mind]; for the idea of a possible quiddity [what-ness or essence] involves the relation of non-repugnance to existence, while the others do not.

44. Therefore that which is a potential being cannot have the reason for its existence in itself but in its cause; so the potential is the causable.

45. If something is a potential being, something else is actual. Potential being does not in fact exist; therefore if it can in fact exist, some being is required that can effect it; therefore (from conclusions 24 and 26) something actually exists, namely at least the first ineffectible efficient cause.

46. If something is in subjective, passive, objective, or obediential potency it is causable. The point is plain from the definitions, at least as concerns the real perfection to which something is in potency.

47. Therefore if something is uncausable, it is not in this sort of potency,¹ but is pure act (from negation of the previous conclusion). ¹ [The importance again, is that the First Cause (i.e. God) can have no passive potency to be acted on (which would be an imperfection), but, in the words of Wolter, has all logical potency, or active potency to cause others (which is no imperfection, but the height of perfection).] … 59. Every composite consists of act and potency. For parts have in their formal concept the idea of mutual perfectibility, and so are in potency to the whole.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’, ‘Conclusions respecting Reality’</cite></span></figcaption>

<blockquote><p>The purpose of this paper is to explain Descartes’ views on Metaphysics. It is my thesis that one of the ways in which he influenced not only modern philosophy, but the way in which we do philosophy even today, is by turning metaphysical inquiry into an epistemological enterprise. That is to say, he made the critique of knowledge necessary prior to any consideration of existence, and what may or may not have it… I will attempt to show that Descartes’ view of Metaphysics, in spite of the fact that he used familiar scholastic metaphysical terminology, actually turned Metaphysics into what is today termed Epistemology. Descartes, not Kant, was the first to perform a true critique of knowledge, and to make that critique a necessary preliminary to all questions about what exists outside our minds.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-haines.html">David Haines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Descartes &amp; Epistemological Metaphysics’</cite></span></figcaption>

<blockquote><p>I constantly keep exactly the same order of books, treatises, disputations, chapters, and sections which the author, Father Suárez, observed, so that, if anyone should at times wish to inspect or weigh more fully some subject that has been proposed, he may at once be able to ﬁnd it in the very archetype without any diﬃculty or toil. Sometimes, however, for the sake of brevity, I have gathered into a single heading certain chapters of his which were divided, but have a great mutual connexion; yet not even thus is the ease of ﬁnding the matter desired taken away, since I always retain the original order of the subject-matter. Further, if sometimes from the title the sense of the question does not suﬃciently appear, I preﬁx a brief explanation of it, and, when needful, I set out the whole question for clearer understanding by a successive series of cardinal numbers, saying 1, 2, 3, etc., as Father Suárez himself also more frequently is wont to set things forth. Next, because he oﬅen preﬁxes to his own position the diverse opinions of authors or the heresies, I likewise indicate these at the outset along with his own, and at the end I resolve in a body their arguments or objections. Yet do not expect, dear reader, that all and each of the original’s proofs and refutations—especially those drawn from authority—could have been included in so narrow a compendium; I have excerpted only those more necessary, suitable, and eﬀective, for the most part merely indicating the rest in general. Moreover, I have always striven, as brieﬂy as I could, to embrace his whole line of argument and meaning.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“I constantly keep exactly the same order of books, treatises, disputations, chapters, and sections which the author, Father Suárez, observed, so that, if anyone should at times wish to inspect or weigh more fully some subject that has been proposed, he may at once be able to ﬁnd it in the very archetype without any diﬃculty or toil. Sometimes, however, for the sake of brevity, I have gathered into a single heading certain chapters of his which were divided, but have a great mutual connexion; yet not even thus is the ease of ﬁnding the matter desired taken away, since I always retain the original order of the subject-matter. Further, if sometimes from the title the sense of the question does not suﬃciently appear, I preﬁx a brief explanation of it, and, when needful, I set out the whole question for clearer understanding by a successive series of cardinal numbers, saying 1, 2, 3, etc., as Father Suárez himself also more frequently is wont to set things forth. Next, because he oﬅen preﬁxes to his own position the diverse opinions of authors or the heresies, I likewise indicate these at the outset along with his own, and at the end I resolve in a body their arguments or objections. Yet do not expect, dear reader, that all and each of the original’s proofs and refutations—especially those drawn from authority—could have been included in so narrow a compendium; I have excerpted only those more necessary, suitable, and eﬀective, for the most part merely indicating the rest in general. Moreover, I have always striven, as brieﬂy as I could, to embrace his whole line of argument and meaning.”

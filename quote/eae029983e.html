<main class="wrap"><figure class="quote" id="q-eae029983e" data-kw="">
<blockquote><p>We are commanded to look to Christ, as the dying Israelites looked up to the brazen serpent. This looking involved trusting; and looking is declared to be believing. Sinners are exhorted to flee to Christ as a refuge. The man-slayer fled to the city of refuge because he relied upon it as a place of safety. We are said to receive Christ, to rest upon Him, to lay hold of Him. All these, and other modes of expression which teach us what we are to do when we are commanded to believe, show that trust is an essential element in the act of saving faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 3, pt. 3, ch. 16, “Faith”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/faith-as-instrument.html">Faith as Instrument</a> › <a href="../topics/faith/faith-as-instrument/faith-receives-christ.html">Faith receives Christ</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb098ede78" data-kw="">
<blockquote><p>True faith is not only a sure knowledge, whereby I hold for truth all that God has revealed to us in His Word (James 1:6), but also a hearty trust (Rom. 4:16–18; Rom. 5:1), which the Holy Ghost (2 Cor. 4:13; Phil. 1:19, 29) works in me by the Gospel (Rom. 1:16; 10:17), that not only to others, but to me also, forgiveness of sins, everlasting righteousness, and salvation are freely given by God (Heb. 11:1–2; Rom. 1:17), merely of grace, only for the sake of Christ’s merits (Eph. 2:7–9; Rom. 3:24–25; Gal. 2:16; Acts 10:43).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 21</span></figcaption>

</figure><figure class="quote" id="q-040b5004ca" data-kw="">
<blockquote><p>As the act of healing through the eyes of the Israelites and the brazen serpent went together; so, in the act of justifying, these two, faith and Christ, have a mutual relation, and must always concur- faith as the action which apprehendeth, Christ as the object which is apprehended; so that neither the passion of Christ saveth without faith, nor doth faith help unless it be in Christ, its object.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdray.html">Daniel Cawdray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Puritan Golden Treasury</cite>, p. 104</span></figcaption>

</figure><figure class="quote" id="q-8a2315e909" data-kw="">

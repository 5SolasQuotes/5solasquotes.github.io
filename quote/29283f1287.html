<blockquote><p>Other churches there are in the world which are not evidently guilty of the enormities in doctrine, worship and discipline before discoursed of. These all we judge to be true churches of Christ; and do hope that his promised presence is with them in their assemblies. Answerable hereunto is our judgment concerning their officers or rulers, and all their sacred administrations. It becomes us to think and believe that the one [their offices] have authority from Christ and that the other [their sacred administrations] are accepted with Him: For it is most unwarrantable rashness and presumption, yea an evident fruit of ignorance, or want of love, or secular private interest, when, upon lesser differences men judge churches to be no true churches and their ministers to be no true ministers, and consequently all their administrations to be invalid… But the validity or invalidity of the ordinances of Christ, which are the means of union and communion with Him unto all his disciples, depend not on the determination of things highly disputable in their notion, and not inconsistent with true Gospel-obedience in their practice… We stand to the judgment of Christ and his Word. We cannot but judge indeed that many Churches have missed, and do miss in some things the precise rules of their due constitution and walking; that many of them have added useless, superfluous rites to the worship of God among them; that there is in many of them a sinful neglect of evangelical discipline, or a carnal rule erected in the stead of it; that errors in doctrines of importance and danger, are prevalent in sundry of them; that their rulers are much influenced by a spirit of bitterness and envy against such as plead for reformation beyond their measure or interest; yet that hereupon they should all or any of them immediately forfeit their church-state, so as to have no lawful ministers, nor acceptable sacred administrations, is in itself a false imagination, and such as was never by us entertained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Evangelical Love, Church-Peace &amp; Unity, with the Occasions &amp; Reasons present Differences &amp; Divisions about Things Sacred &amp; Religious (1672)</cite>, ch. 3, pp. 84-86</span></figcaption>

<blockquote><p>This distinction the priests must carefully observe, and take heed of making any blunders… He enquires concerning one deviation from the appointment… Now observe here: 1. The gentle reproof Moses gives to Aaron and his sons for this irregularity… Yet observe how very mildly he deals with Aaron and his sons, considering their present affliction. He only tells them they should indeed have eaten it in the holy place, but is willing to hear what they have to say for themselves, being loth to speak to the grief of those whom God had wounded… 2. The plausible excuse which Aaron makes for this mistake. Moses charged the fault upon Eleazar and Ithamar (Lev. 10:16), but it is probable that what they did was by Aaron direction, and therefore he apologized for it… (2) How he makes this an excuse for his varying from the appointment about the sin-offering… He does not plead that his heart was so full of grief that he had no appetite for it, but that he feared it would not be accepted. Note: [1] Acceptance with God is the great thing we should desire and aim at in all our religious services… 3. The acquiescence of Moses in this excuse: He was content, Lev. 10:20. Perhaps he thought it justified what they had done. God had provided that what could not be eaten might be burnt. Our unfitness for duty, when it is natural and not sinful, will have great allowances made for it; and God will have mercy and not sacrifice. At least he thought it did very much extenuate the fault; the spirit indeed was willing, but the flesh was weak [Mt. 26:41]. God by Moses showed that he considered his frame. It appeared that Aaron sincerely aimed at God’s acceptance; and those that do so with an upright heart shall find He is not extreme to mark what they do amiss. Nor must we be severe in our animadversions upon every mistake, considering ourselves, lest we also be tempted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary, on Lev. 10, vv. 12-20</cite></span></figcaption>

<blockquote><p>…take heed that you not act like the weak in Rom. 14. Those who were weak in the Christian Faith (v. 1) held excessive religious strictures and scruples, especially in practical matters, however inconvenient (v. 2). Their simplistic beliefs determined their actions, which set them apart from other Christians. They prided themselves in their strict living, self-denial and high standard (v. 2), taking what they thought was righteous grief, offense and scandal at things actually lawful (vv. 20–21), they not thinking them best or godly enough (vv. 4–5). They spoke ill of their Christian brothers, judged them (vv. 3–4, 16, even Paul implicitly), whom they saw as worldly, licentious and not devoted enough, though their brethren were equally devoted (v. 6) and actually stronger and more understanding in the truth than they (v. 14). The weak’s distinctives exemplified misplaced priorities, valuing certain external practices they considered to be religiously necessary above their brethren’s fellowship, and hence also above the fundamentals of “righteousness, and peace, and joy in the Holy Ghost,” in which the kingdom of God consists. (v. 17) The weak practically valued what they considered to be sanctification, and that in others, above other Christians’ faith and justification (v. 18), that they are accepted with God forever in Christ, and He will make them stand. (v. 4) It was not only the strong, but the weak as well that were deficient in following “after the things which make for peace, and things wherewith one may edify another.” (v. 19) If such a weak person began to teach their distinctives and seek to bind them on others, would not he be sectarian?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Extended Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, pp. 185-86</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…take heed that you not act like the weak in Rom. 14. Those who were weak in the Christian Faith (v. 1) held excessive religious strictures and scruples, especially in practical matters, however inconvenient (v. 2). Their simplistic beliefs determined their actions, which set them apart from other Christians. They prided themselves in their strict living, self-denial and high standard (v. 2), taking what they thought was righteous grief, offense and scandal at things actually lawful (vv. 20–21), they not thinking them best or godly enough (vv. 4–5). They spoke ill of their Christian brothers, judged them (vv. 3–4, 16, even Paul implicitly), whom they saw as worldly, licentious and not devoted enough, though their brethren were equally devoted (v. 6) and actually stronger and more understanding in the truth than they (v. 14). The weak’s distinctives exemplified misplaced priorities, valuing certain external practices they considered to be religiously necessary above their brethren’s fellowship, and hence also above the fundamentals of “righteousness, and peace, and joy in the Holy Ghost,” in which the kingdom of God consists. (v. 17) The weak practically valued what they considered to be sanctification, and that in others, above other Christians’ faith and justification (v. 18), that they are accepted with God forever in Christ, and He will make them stand. (v. 4) It was not only the strong, but the weak as well that were deficient in following “after the things which make for peace, and things wherewith one may edify another.” (v. 19) If such a weak person began to teach their distinctives and seek to bind them on others, would not he be sectarian?”

— Travis Fentiman, “Extended Editor’s Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025), pp. 185-86">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6take+heed+that+you+not+act+like+the+weak+in+Rom.+14.+Those+who+were+weak+in+the+Christian+Faith+%28v.+1%29+held+excessive+religious+strictures+and+scruples%2C+especially+in+practical+matters%2C+however+inconvenient+%28v.+2%29.+Their+simplistic+beliefs+determined+their+actions%2C+which+set+them+apart+from+other+Christians.+They+prided+themselves+in+their+strict+living%2C+self-denial+and+high+standard+%28v.+2%29%2C+taking+what+they+thought+was+righteous+grief%2C+offense+and+scandal+at+things+actually+lawful+%28vv.+20%E2%80%9321%29%2C+they+not+thinking+them+best+or+godly+enough+%28vv.+4%E2%80%935%29.+They+spoke+ill+of+their+Christian+brothers%2C+judged+them+%28vv.+3%E2%80%934%2C+16%2C+even+Paul+implicitly%29%2C+whom+they+saw+as+worldly%2C+licentious+and+not+devoted+enough%2C+though+their+brethren+were+equally+devoted+%28v.+6%29+and+actually+stronger+and+more+understanding+in+the+truth+than+they+%28v.+14%29.+The+weak%E2%80%99s+distinctives+exemplified+misplaced+priorities%2C+valuing+certain+external+practices+they+considered+to+be+religiously+necessary+above+their+brethren%E2%80%99s+fellowship%2C+and+hence+also+above+the+fundamentals+of+%E2%80%9Crighteousness%2C+and+peace%2C+and+joy+in+the+Holy+Ghost%2C%E2%80%9D+in+which+the+kingdom+of+God+consists.+%28v.+17%29+The+weak+practically+valued+what+they+considered+to+be+sanctification%2C+and+that+in+others%2C+above+other+Christians%E2%80%99+faith+and+justification+%28v.+18%29%2C+that+they+are+accepted+with+God+forever+in+Christ%2C+and+He+will+make+them+stand.+%28v.+4%29+It+was+not+only+the+strong%2C+but+the+weak+as+well+that+were+deficient+in+following+%E2%80%9Cafter+the+things+which+make+for+peace%2C+and+things+wherewith+one+may+edify+another.%E2%80%9D+%28v.+19%29+If+such+a+weak+person+began+to+te <blockquote><p>v. 16, ‘And Moses diligently sought the goat of the sin-offering;’… in such serious matters Moses had not spared labor and care, whereas the sons of Aaron, as if they had neither heard nor seen anything of the sort, pervert the whole order of them, although they had been just before reminded that they had been appointed to keep the charge of God. Perhaps they were impelled to this error by the trouble arising from their grief… Further from the anger of Moses, which is mentioned in his praise, we may infer that the transgression was no light one, although it was not so severely punished as the presumption of Nadab and Abihu… But the reason why God was more merciful to them than to their brethren is only known to Himself. Conjectures may, indeed, be advanced; but at last we must come to this, that because God’s judgments are hidden, they are not therefore unjust; but that we must humbly adore their depth into which the minds of men cannot penetrate. v. 19, ‘And Aaron said unto Moses, Behold, this day;’ Aaron replies that it arose from pious fear that they had not feasted before God, because they would in a manner have defiled the sanctuary by their tears and melancholy… but it was not a just defense; for he ought rather to have striven against the feelings of the flesh so that his domestic calamity should not withhold him from the service of God. But, inasmuch as in his perplexity his fear was deserving of pity, Moses forgives him; and it is said that he was appeased, because he finds less of evil than he supposed.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-ba53e72b1d" data-kw="">
<blockquote><p>My joy is the greater because I discern the yearning of your mind, with its love for eternal life and truth and charity itself, directed toward that divine and heavenly country whose king is Christ, and in which alone we find eternal happiness if we live uprightly and devoutly in this world, and also because I see you drawing near to that life and I embrace you in your ardent desire to attain it. This is the source from which true friendship flows, not to be valued by temporal advantages, but to be drunk in through freely given love. No one can be a true friend of man unless he is first a friend of Truth; if friendship does not come into being spontaneously, it cannot exist at all.

The philosophers have much to say on this subject, but one does not find among them true affection, that is, true worship of the true God, to which all the activities of right living ought to be directed. This arises chiefly, as I understand it, because they wanted to construct their own happiness for themselves, in one way or another, and they thought this was more a matter of doing than of receiving, whereas God is its only giver. Only He who made man makes man’s happiness. He who lavishes such gifts on His creatures, both bad and good–existence, human nature, vigorous faculties of sense, strength of body, abundance of resources–will give Himself to the good to be their happiness, because their goodness is also His gift.

But there are others who, in spite of this toilsome life, of these bodies doomed to death under this burden of corruptible flesh, have chosen to be the originators and the creators, so to speak, of their own happiness, striving for it and holding it as if it were the result of their own strength, not seeking it and hoping for it from that source of strength, and these have not been able to see that God resists their pride. Hence, they fell into the most extravagant error, as when they assert that a wise man is happy even in the bull of Phalaris, and are then forced to admit that happiness is sometimes to be shunned. For they yield to an accumulation of bodily ills and decree that in their most grievous afflictions it is allowable to deprive oneself of life. I do not wish to discuss here how wicked it is for an innocent man to kill himself, something which even a guilty person has absolutely no right to do; I have spoken at length on this in the first of those three books which you have so kindly and so thoroughly read. But let us consider with certainty, let us determine, not proudly but temperately, how that life can be happy which the wise man does not hold and enjoy, but which he is obliged to forego by laying hands on himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 155 to Macedonius, c. 414 in Letters: Volume III</cite></span></figcaption>

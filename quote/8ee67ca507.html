<blockquote><p>Christ is not the righteousness of justification to any person that is not washed, and sanctified, 1 Cor: 6. 11. 2. None can be righteous by a righteousness infused from Christ, but thence floweth an inherent righteousness renewing our nature: for he gives us a godly nature, and purifieth our souls by the spirit: and thence issueth an external righteousness of life, which is an evidence of our justification by faith: for he that doth righteousness is righteous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-taylor.html">Thomas Taylor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Regula Vitæ, the rule of the law under the Gospel. Containing a discovery of the pestiferous sect of Libertines, Antinomians, and sons of Belial, lately sprung up both to destroy the law, and disturb the faith of the Gospel: wherein is manifestly proved, that God seeth sin in justified persons</cite>, (London: Robert Dawlman, 1631), pp 150-51.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>15. Did Christ redeem us only by his passive righteousness? The difference of opinions XXXVII. Fifteenth, it is asked whether Christ redeemed us only by his passive righteousness, or in addition also his active righteousness. Johannes Piscator, otherwise an outstanding theologian, together with several others, because they thought that the necessity of passive righteousness and death would be abolished if it were stated that in our place he most exactly kept the divine law, because one who kept the law exactly could not be punished with death, chose the prior. Protestants commonly prefer the latter, and certainly correctly, but not all in one way. Some divide the passive and active righteousness of Christ in such a way that only by his passive righteousness did he satisfy in our place for the law that was not observed, and by it delivered us only from the guilt of punishment, and likewise, only by his active righteousness did he keep the law perfectly in our place, and by keeping it, acquire for us the right of eternal life. Others, with that more subtle division laid aside, prefer to state that Christ devoted both these kinds of righteousness to us, to the end that he might satisfy for the divine law that was not observed by us, and by satisfying, also merit for us the right of life, in such a way that by this satisfaction he at the same time delivered us from every evil and gained the right of every good. The difficulties raised by Piscator are removed We have adduced the reasons for this view in §XX: with them presupposed, it is not so difficult to respond to the difficulties raised by Piscator. For if (1) it should be alleged that the law demands nothing but one or the other, either obedience or punishment, we will respond that the law, first from man in his integrity, demands only obedience under threat of punishment, but from the sinner, it demands punishment for past sin and obedience in the future, because punishment cannot deliver from the obedience owed to God. Wherefore the Redeemer had to supply both. If (2) it should be alleged that the necessity and use of the death and passive righteousness are removed when he has most fully kept the law on our behalf, we will respond that it is by no means removed, because both kinds of righteousness were necessary for him to satisfy for the injury we inflicted upon the divine majesty and his law, and in satisfying, to merit for us the right of eternal life. If (3) it should be alleged that Scripture refers the consummation of our salvation to his one and only sacrifice accomplished on the cross, we will respond that by that sacrifice is understood by synecdoche his entire satisfaction, the outstanding part of which his death on the cross supplied, just as by the same synecdoche, the blood of Christ designates the same satisfacation (1 John 1:7; Acts 20:28). If one should proceed (4) to allege that obedience was necessary for his own self as a man, and thus could not be expended for us, we will respond that (a) the obedience, insofar as it resulted from the God-man, was not necessary for him, because the law obligates not the God-man to obedience, but a mere man; (b) that obedience of the God-man is of infinite value, whereby it was able to suffice both for himself and for us, because an obedience greater than infinite could not be demanded or supplied for him, or at the same time for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 4, bk. 5, ch. 18, The Mediator’s Redemption Itself</span></figcaption>

<blockquote><p>Therefore, we always hold fast this foundation, ascribing all the glory to God, humbling ourselves before Him, and acknowledging ourselves to be such as we really are, without presuming to trust in any thing in ourselves, or in any merit of ours, relying and resting upon the obedience of Christ crucified alone, which becomes ours when we believe in Him. This is sufficient to cover all our iniquities, and to give us confidence in approaching to God; freeing the conscience of fear, terror, and dread, without following the example of our first father, Adam, who, trembling, attempted to cover himself with fig leaves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Belgic Confession Art. 34”</cite>, Art. 23</span></figcaption>

<blockquote><p>Inveni igitur in Epistolis tuis in lucem editis Epistolas duas 35 et 45 in quarum illa controversiam hanc paucis attingis. In ista vero copiosius et plenius edisseris. In 35 igitur epistola ‘Quid vanius est, inquis, quam justum arbitrari qui Legem non impleverit?’ At, inquam, justicia Evangelii a justicia Legis, prudenter discernenda est, Justicia qua nos justi censemur a Deo ac proinde ab eodem justificamur seu absolvimur, non est justicia Legis, neque enim Deus ideo nos justificat, quod Legem vel ipsi nos impleverimus, vel Christus pro nobis impleverit. Sed est justicia Evangelii, id est quam Deus nobis per Evangelium donat, nempe remissio peccatorum sanguine Christi parta. Vitam igitur petimus a Deo non jure impletae Legis seu obedientiae Legi praestitae sed jure adoptionis, quam Christus sua morte nobis peperit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Examen sententiae Domini Theodori Bezae, De justificatione Hominis coram Deo, quae habetur in annotatione ad Rom. 8</cite>, v. 2’ in Correspondance de Théodore de Bèze (1586), eds. Dufour, Genton &amp; Nicollier-de Weck, vol. 27, Travaux d’humanisme et Renaissance 401 (Geneva: Librairie Droz, 2005), p. 59, trans. ChatGPT-5 For a discussion of the import of the below, see Brink, The Transfer of Sin (Brill, 2024), pp. 219-20 ff.</span></figcaption>

8393.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/99a2a68393.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-active-obedience-of-christ#:~:text=Inveni%20igitur%20in%20Epistolis%20tuis%20in,quam%20Christus%20sua%20morte%20nobis%20peperit&amp;text=Inveni%20igitur%20in%20Epistolis%20tuis%20in%20lucem%20editis&amp;text=jure%20adoptionis%2C%20quam%20Christus%20sua%20morte%20nobis%20peperit" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>This epistle to the Galatians is polemical in nature because in it Paul is upbraiding the Galatians for having so easily turned away from the true doctrine of the gospel and fallen into the works of the law, which they were preaching as necessary for justification. But when Paul starts teaching about true righteousness, which is found in Christ Jesus without regard to the law or to works, the tone changes and the epistle becomes more didactic in nature.

In the first part of the epistle he calls the Galatians back from the error of justification by works into which they had fallen because of the teaching of false apostles who had visited them after his departure. In the second part he teaches what the difference is between the righteousness that comes from faith and the righteousness that comes from works.

In the epistle to the Romans, Paul’s main argument is that God is the God not only of the Jews but also of the Gentiles. In order to prove this he brings in all kinds of considerations, and to make things as clear as possible he adopts the technique of starting with an explanation of righteousness by faith, to which the Gentiles have been called by grace. He then describes the righteousness that comes by the law, under which the Jews had struggled until Christ came teaching justification by faith, without reference to works. In this epistle, Paul does exactly the same thing.

The false apostles had led the people astray by preaching circumcision and the works of the law, insisting that they were necessary for justification by faith. The apostle refutes their position and asserts that even uncircumcised Gentiles can belong to Christ. In order that the Galatians might understand this more easily, he adopts the same method that he used in the epistle to the Romans. Thus the epistle to the Galatians may rightly be called a summary of the epistle to the Romans.</p></blockquote>

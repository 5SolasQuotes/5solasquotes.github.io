<main class="wrap"><figure class="quote" id="q-3dabcb530e" data-kw="">
<blockquote><p>Q. Was this [Lord’s] day set apart thereunto from the beginning?

A. No: for from the first Creation, till the Resurrection of Christ, the last day of the week, commonly called Saturday, was the day that was appointed thereunto; and that which the people of God constantly observed.

Q. And why so?

A. Because upon that day, God ceased from the work of Creation.

Q. How came this day to be changed?

A. By Divine Authority.

Q. How doth that appear?

A. First, by the practice of our Saviour Christ, and his Apostles; which should be a sufficient rule unto us, especially the Apostles having added a commandment thereunto. Secondly, there is no reason why it should be called the Lord’s day, but in regard of the special dedication thereof to the Lord’s service. For otherwise all the days of the week are the Lord’s days, and he is to be served and worshipped in them.

Q. What was the cause why the day was changed?

A. Because it might serve for a thankful memorial of Christ’s Resurrection: for as God rested from his labour on the last day of the week; so Christ ceased from his labour and Afflictions on this day: as the one therefore was specially sanctified in regard of the Creation of the world; so was the other, in respect of the restauration and Redemption thereof, which is a greater work then the Creation it self.

Q. Cannot this day then be altered?

A. No, not by the power of any creature in heaven or earth.

Q. But doth not this Commandment directly require the seventh day from the Creation?

A. No, but the seventh day in general.

Q. But doth not the reason annexed (where the Lord is said in six days to make heaven and earth, and to rest the seventh, and therefore to hallow it), confirm so much?

A. No, not necessarily: for it doth not thence follow, that we should rest the same day the Lord rested, but that we should rest from our works the seventh day, as he rested from his: which seventh, as under the Law he appointed to be Saturday; so nothing hindreth, but that by his special appointment, under the Gospel, it may be Sunday, and yet the substance of the Commandment nothing altered.

Q. Why doth not the New Testament specially mention this change?

A. Because there was no question moved about the same, in the Apostles times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 109-10.</span></figcaption>

<blockquote><p>In regard to the false worship of the Jews (Jer. xix. 5), God says, “which I commanded not nor spake it, neither came it into my mind.” We have many other passages in Scripture to sanction and enforce the great principle, not only that we must not violate the direct commands of God in our service, but must not presume to offer Him unauthorised worship, and which He “hath not required at our hand.”

The reasons are clear. He is too exalted and majestic for sinful mortals to take such matters into their own hand, and to serve Him with their own inventions. If He has revealed Himself at all to ignorant and guilty men, surely it is reasonable to think He would reveal how He should be approached and served. If He has done so, and provided all the means, it is the height of presumption in human beings either to add to or take from what He has appointed.

“What things soever I command you, observe to do it: thou shalt not add thereto nor diminish therefrom” (Deut. xii. 32). Our Lord Himself hands down this great principle and command in His commission to His apostles, and through them to the church to the end of the world. Matt, xxviii. 18, 20, “And Jesus came and taught them, saying. All power is given unto me in heaven and in earth. Go ye therefore, and teach all nations, baptizing them in the name of the Father, and of the Son, and of the Holy Ghost; teaching them to observe all things whatsoever I HAVE COMMANDED YOU: and, lo, I am with you alway, even unto the end of the world. Amen.” His voice as the great Lawgiver and Head of His church, from the beginning to the end, is one and the same. He does not say, You are not to teach what I have forbidden, but you are to teach to observe and do what I have commanded, and neither “add thereto, nor diminish therefrom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-gibson.html">James Gibson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Public Worship of God: Its Authority and Modes, Hymns and Hymn Books</cite>, (London: James Nisbet and Son, 1869), pp 15-16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>14th Objection: They object: To be present at a mass is to countenance an idol worship; so to be present in a church worship where there is any error in the worship is to countenance the error. For what worship we countenance to that we say, ‘Amen,’ and so we must consent to the wrong constitution of a church where are profane people? Answer: To countenance a worship professedly idolatrous, where the name of the worship imports the worshipping of a false god, is unlawful, for others do interpret our presence [as] a joint worshipping with them. But our presence at every lawful worship that is acknowledged lawful, does not give so much as interpretatively signification of our consent to every particular in the worship, because hearing, discerning, choosing or refusing, believing or not believing, according as you find the points agreeable to God’s Word, or dissonant therefrom, intervenes between your presence at the worship, and your consent to the worship. Now the act of consenting, approving and receiving the point of worship is formally to partake of the worship, else we could not obey the precept (1 Thess. 5:21) ‘Try all things.’ Some things in the preacher are to be borne with; The preachers of the Separation have not an apostolic and infallible spirit; if any of them preach unsound doctrine, the presence of the hearers does not involve them in the guilt of the preacher’s erroneous worship. The Pharisees corrupting of the Law was known and rebuked by Christ, but yet Christ forbade Separation. ‘Hear them’ (Matt. 23) ‘they sit in Moses’ chair.’</p></blockquote>

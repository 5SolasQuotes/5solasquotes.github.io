<main class="wrap"><figure class="quote" id="q-8e797b9129" data-kw="">
<blockquote><p>That though a person has been thrust in upon a people in an undue manner, yet their after acceptance, approbation and submission to his ministry, makes him a pstor to them, supplying the want of election at first; as Jacob’s after-consent and acceptance of Leah made her to be his wife, though he was far from choosing her at first. And though it be a sin in ministers of the gospel to settle any pastor contrary to the inclinations of a people, yet in my opinion, though the people are not obliged, they may submit to the ministry of such without sin, declaring their non-approbation of the procedure, and testifying against the manner of settlement.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><figure class="quote" id="q-574cca3888" data-kw="">
<blockquote><p>…they [the Protesters] have learned to distinguish betwixt the government of the Church, and the male-administrations and corruptions of the Church-governors; and not to condemn the one when they are necessarily called to give a testimony against the other; Yea, the duty and care they owe to the preservation of the government constrains them to testify against the abusing and corrupting of it: So did our fathers of old, whose protestations against corrupt national Church assemblies are upon record to this day, and so far have they been by men of sound judgments, from being judged because thereof to be against the government, that they are honoured amongst the greatest patrons and preservers thereof… …neither do they [the Protesters] think that testifying against the corruptions of many of these that are now in the exercise of the government of the Church, is to dissent from, or to do injury to the government itself;</p></blockquote>

</figure><figure class="quote" id="q-0f012044f8" data-kw="">
<blockquote><p>7. We must distinguish betwixt a dependance ‘absolute’, and ‘in some respect’; a congregation does absolutely depend upon the holy Scriptures alone, as the perfect rule of faith, and manners, of worship and of Church-Government; for we accurse the tyranny of prelates, who claimed to themselves autocratoric power over congregations to whom they gave their naked-will for a law: one of themselves told a whole synod that they ought to esteem that best which seems so to superiors; and that this is a sufficient ground to the conscience for obeying, though the thing be inconvenient. We say that congregations ought indeed to be subject to presbyteries and synods, yet not absolutely, but in the Lord, and in things lawful: and to this purpose the constitutions of presbyteries and synods are to be examined by the judgement of Christian discretion; for a synod is judex judicandus [a judge which ought to be judged], and regula regulata [a rule having been regulated], so that it ought not to be blindly obeyed, whether the ordinances be convenient or inconvenient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland</cite>, (1641), pt. 2, ch. 2, p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

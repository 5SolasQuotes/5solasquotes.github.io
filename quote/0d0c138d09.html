<main class="wrap"><figure class="quote" id="q-0d0c138d09" data-kw="">
<blockquote><p>Several of them [common Scottish people, after the second indulgence in 1672] were taught to believe, and urge a position, in itself of most dangerous consequences, that it is unlawful to hear a minister who was guilty of failures in his entry upon ministerial work, or mistakes in his management of it. I wish the remains of this dangerous position may be entirely out from among us;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of the Sufferings of the Church of Scotland (d. 1734; Glasgow: Blackie, 1842), 2.210</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7126d39207" data-kw="">
<blockquote><p>If I were with [the Cameronian minister] Mr. [James] Renwick, I would put him to call to mind the saying which at his parting I said to him, while he was requiring of me some memorable token, ‘Be not righteous over much, neither make thyself over wise; why shouldest thou destroy thyself?’ Now you understand not this; but remember that this I said to you, that sometime it shall be useful. Now it is time to live according to that word. Oh what need has he now of that admonition! If I were present with them that do adhere to Mr. Renwick, these that refuse to hear ministers, I would show them how great a sin schism is; and that the wrath of God is not far off from them who make and cherish separation. I with tears in the name of Jesus would beg that, leaving schism, they might live with their brethren in peace, love and unanimity. To decline union in every truth is nothing but pride and lordliness… if there be any that in his conscience thinks other ministers ought not to be heard, he errs in simplicity, and it is necessary that most quickly he leave that error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Maurice Grant, Preacher to the Remnant: The Story of James Renwick (Blue Banner Productions, 2009)</cite>, pp. 140-41</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><figure class="quote" id="q-8252d74455" data-kw="">
<blockquote><p>2. It [the form of sound words] is our godly forefathers bequest which they have conveyed to us their posterity; should not our care be alike to transmit it to ours? Ps. 78:3-4. 3. The martyrs have sealed it with their blood, which we shall prove guilty of through our unfaithfulness, as they are accounted to tread underfoot the Son of God, and to account his blood an unholy thing who desert his truth, and despited the spirit of his grace, Heb. 10:29. 4. It will be the best part of our children’s inheritance: as the Law was Jacob’s, Dt. 33:4. Look to it therefore, that at our last reckoning our forefathers be not ashamed of us, and our posterity at the Resurrection do no not rise up, and, I say not, call us blessed, as Prov. 31:28, but curse us for betraying God’s truth, and our trust, and their and our own souls altogether. 5. And remember from this word [Greek] hold fast, that it is not the catching at what we have not, but only the holding fast what through God’s mercy we yet have; and therefore as Christ says to the Church of Philadelphia, ‘Hold fast what thou hast, let no man take away thy crown.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-tuckney.html">Anthony Tuckney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Form of Sound Words’ a sermon on 2 Tim. 1:13 in A Good Day well improved, or Five Sermons upon Acts 9:31… to which is annexed a sermon on 2 Tim. 1:13... (London: 1656)</cite>, pp. 244-319</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

ormedbooksonline.com/on-catechizing/#:~:text=2.%20It%20%5Bthe%20form%20of%20sound,no%20man%20take%20away%20thy%20crown&amp;text=2.%20It%20%5Bthe%20form%20of%20sound%20words%5D%20is&amp;text=hast%2C%20let%20no%20man%20take%20away%20thy%20crown" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-a24ec265da" data-kw="">
<blockquote><p>Reading of Homilies: Albeit that all learned and godly teachers do with one consent condemn an ignorant, unlearned slothful minister, and by all means do persuade to their uttermost endeavor in the furtherance and planting of a godly, learned and painful [characterized by taking many pains] ministry, as Calvin, Epist. 127, fol. 124 &amp; Epistle 87, fol. 164-65; Bucer, Censura, ch. 2, fol. 458 &amp; ch. 7, fol. 465 &amp; Epistle to Cranmer, fol. 683; Idem, On the Reign of Christ, bk. 1, ch. 15, fol. 52, 62; Beza, Epistle 12, fol. 95-96 &amp; Epistle 8, fol. 79; Hyperius, De Scriptur. lect., bk. 1, fol. 122-36 &amp; Tome 2, fol. 675-78; Peter Martyr, loc. inter Epist. fol. 1085; Danaeus, Isag., pt. 3, bk. 3, ch. 45, fol. 373; Zanchi, Obseruat. ad Confes., ch. 25, fol. 66-67; Whittaker, in Epistle Dedicatory contra Paraeus, with diverse others. Yet in a case of necessity, Bucer says that it is better that godly and learned homilies made by others should be rehearsed or read unto the people so long as preachers are wanting, which may holily and wholesomely teach and exhort them; Censura, ch. 7, fol. 465. Also in another place he commands the order used both in the primitive times among the Fathers, as also in England in his time of appointing readers in the Church, with condition, si idonei, if they be fit: if they read gravely, religiously, clearly, and to the people’s edification: if they be de singulari pietate commendati, of singular piety: Else he concludes Illos non esse Ministros Christi, that they are not the ministers of Christ which chop and mumble up their reading, as they cannot be understood with edification by the people: I script. Anglican. de vi et vsu ministerij, fol. 564-65. This Zanchi also cites and approves out of Bucer: Obseruat. ad confess., ch. 25, §10-11, fol. 65-67.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1623), ‘Reformed Practices’</cite>, p. 157</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

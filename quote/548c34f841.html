<blockquote><p>Gregory says in a homily (vi in Evang.): ‘An idle word is one that lacks either the usefulness of rectitude or the motive of just necessity or pious utility.’ But an idle word is an evil, because ‘men… shall render an account of it in the day of judgment’ (Mt. 12:36): while if it does not lack the motive of just necessity or pious utility, it is good. Therefore every word is either good or bad. For the same reason every other action is either good or bad. Therefore no individual action is indifferent. …It sometimes happens that an action is indifferent in its species, but considered in the individual it is good or evil. And the reason of this is because a moral action… derives its goodness not only from its object, whence it takes its species; but also from the circumstances, which are its accidents, as it were; just as something belongs to a man by reason of his individual accidents, which does not belong to him by reason of his species. And every individual action must needs have some circumstance that makes it good or bad, at least in respect of the intention of the end. For since it belongs to the reason to direct; if an action that proceeds from deliberate reason be not directed to the due end, it is, by that fact alone, repugnant to reason, and has the character of evil. But if it be directed to a due end, it is in accord with reason; wherefore it has the character of good. Now it must needs be either directed or not directed to a due end. Consequently every human action that proceeds from deliberate reason, if it be considered in the individual, must be good or bad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pt. 2, pt. 1, question 18, ‘Of the Good &amp; Evil of Human Acts in General’ in Summa | 9. ‘Whether an individual action can be indifferent?’ [No]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>For the Church does bind and loose in the external court, either by a commission from Him who as head of the Church, and who as King gave to her the keys of the Kingdom, or by a general arbitrary power given to the magistrate and Church, to do in these things as they please, so they do nothing contrary to the Word, though not according to the Word, as they are to do in doctrinals; If the former be said, then must the external government be upon the shoulder of Christ as King, which is that which we teach: If the latter be said, then might the magistrate &amp; Church appoint such an ordinance as excommunication, and so they may by their arbitrary power make a Gospel promise of ratifying an ordinance in heaven and of pardoning sins in heaven; for he that can make the ordinance can make also the Gospel-promise, and he that can by an arbitrary power make one promise or part of the Gospel, may make all. And if either magistrate or Church can appoint such an ordinance as has a promise of binding and loosing made good in heaven, they may also take away such ordinances and Gospel-promises; for it is the same power to make and add, to unmake and destroy ordinances. Hence also I argue for the immutability of a Scriptural Platform, that the Church cannot alter at her will… I infer that the whole Platform of Law and Gospel is of divine institution, and the particulars of obedience and faith are not arbitrary to the Church; just so in discipline, I say the like, there is no more reason for one part written by God than for another.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Introduction, Section 2, pp. 15-16</span></figcaption>

<blockquote><p>His [Knewstubs’s] objection against the cross consisted of three interrogatories: 1. Whether the Church had power to institute an external significant sign? To which was replied: First, that he did mistake the use of the cross with us, which was not used in baptism any otherwise than only as a ceremony. Secondly, by their own example, who make imposition of hands in their ordination of pastors to be a sign significant. Thirdly, in prayer, says the Bishop of Winton, the kneeling on the ground, the lifting up of our hands, the knocking of our breasts are ceremonies significant: the first, of our humility coming before the mighty God, the second, of our confidence and hope, the other of our sorrow and detestation of our sins, and these are, and may lawfully be used. Lastly, M. Deane of the chapel, remembered the practice of the Jews, who unto the institution of the Passeover, prescribed unto them by Moses, had as the rabbins witness added both signs and words, eating sour herbs and drinking wine, with these words to both, ‘Take, and eat these in remembrance, etc. Drink this in remembrance, etc.’ Upon which addition and tradition of theirs, our Sauiour instituted the sacrament of his Last Supper, in celebrating it with the same words and after the same manner; thereby approving that fact of theirs in particular; and generally, that a Church may institute and retain a sign significant: which satisfied his Maiesty exceeding well. And here the king desired, to have himself made acquainted about the antiquity of the use of the cross. Which Doctor [John] Reynolds confessed to have been ever since the apostles times, but this was the difficulty, to prove it of that ancient use in baptism… it fell from one, I think it was my Lord of Winchester, obiter, to say, that, in Constantine’s time it was used in baptism. What, quoth the King, and is it now come to that pass that we shall appeach Constantine of Popery and superstition; if then it were used, says his Majesty, I see no reason but that still we may continue it. Mr. Knewstubs’s second question was that, put [the] case [that] the Church had such power to add significant signs, whether it might there add them where Christ had already ordained one; which he said, was no less derogatory to Christ’s institution, as he thought, than if any potentate of this land should presume to add his seal unto the great seal of England. To which his Majesty answered that the case was not alike, for that no sign or thing was added to the sacrament, which was fully and perfectly finished, before any mention of the cross is made; for confirmation whereof, he willed the place to be read [in the Book of Common Prayer]. Lastly, if the Church had that power also, yet the greatest scruple to their conscience was, how far such an ordinance of the Church was to bind them, without impeaching their Christian liberty? Whereat the king, as it seemed, was much moved, and tolde him he would not argue that point with him, but answer therein as kings are wont to speak in Parliament, Le Roy J’auisera: adding withall, that it smelled very rankly of Anabaptism: comparing it unto the usage of a beardless boy (one Mr. John Black) who the last Conference his Majesty had with the ministers in Scotland (in December, 1602) told him that he would hold conformity with his Majesty’s ordinances for matters of doctrine: but for matters of ceremony, they were to be left in Christian liberty unto every man as he received more and more light from the illumination of God’s Spirit; even till they go mad, quoth the king, with their own light: but I will none of that, I will have one doctrine and one discipline, one religion in substance, and in ceremony: and therefore I charge you, never speak more to that point (how far you are bound to obey?) when the Church has ordained it. And so asked them again, if they had anything else to say? Dr. Reynolds objected the example of the brasen serpent, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways. First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Reynolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in time of Popery were made, for men to fall down before them, as they passed by them, to worship them (as the idolatrous Jews did the brazen serpent) are demolished, as you desire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. William Barlow, The Sum &amp; Substance of the Conference which it pleased his excellent Majesty to have with the Lords, Bishops &amp; other of his Clergy… at Hampton Court, January 14, 1603 (London: Windet, 1604), 2nd Day, pp. 67-74</span></figcaption>

t, demolished and stamped to powder by Ezekiel, because the people abused it to idolatry: wishing, that, in like sort, the cross should be abandoned, because in the time of Popery it had been superstitiously abused. Whereunto the King’s Majesty answered diverse ways. First, quoth he, though I be sufficiently persuaded of the cross in baptism, and the commendable use thereof in the Church so long: yet, if there were nothing else to move me, this very argument were an inducement to me for the retaining of it, as it is now by order established: For, inasmuch, as it was abused, so you say, to superstition in time of popery, it does plainly imply, that it was well used before Popery. I will tell you, I haue lived among this [dissenting] sort of men (speaking to the lords and bishops) ever since I was ten years old, but I may say of myself as Christ did of Himself: Though I lived amongst them, yet since I had ability to judge, I was never of them; neither did anything make me more to condemn and detest their courses than that they did so peremptorily disallow of all things which at all had been used in Popery. For my part, I know not how to answer the objection of the Papists, when they charge us with novelties: but truly to tell them that their abuses are new, but the things which they abused we retain in their primitive use, and forsake only the novel corruption. By this argument we might renounce the Trinity and all that is holy, because it was abused in Popery (and speaking to Doctor Reynolds merely) they used to wear hose and shoes in Popery, therefore, you shall, now, go barefoot. Secondly, quoth his Majesty, what resemblance is there between the brazen serpent, a material visible thing, and the sign of the cross made in the air? Thirdly, I am given to understand by the bishops, and I find it true, that the Papists themselves did never ascribe any power or spiritual grace to the sign of the cross in baptism. Fourthly, you see, that the material crosses, which in tim — King James I, ed. William Barlow, The Sum &amp; Substance of the Conference which it pleased his excellent Majesty to have with the Lords, Bishops &amp; other of his Clergy… at Hampton Court, January 14, 1603 (London: Windet, 1604), 2nd Day, pp. 67-74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHis+%5BKnewstubs%E2%80%99s%5D+objection+against+the+cross+consisted+of+three+interrogatories%3A+1.+Whether+the+Church+had+power+to+institute+an+external+significant+sign%3F+To+which+was+replied%3A+First%2C+that+he+did+mistake+the+use+of+the+cross+with+us%2C+which+was+not+used+in+baptism+any+otherwise+than+only+as+a+ceremony.+Secondly%2C+by+their+own+example%2C+who+make+imposition+of+hands+in+their+ordination+of+pastors+to+be+a+sign+significant.+Thirdly%2C+in+prayer%2C+says+the+Bishop+of+Winton%2C+the+kneeling+on+the+ground%2C+the+lifting+up+of+our+hands%2C+the+knocking+of+our+breasts+are+ceremonies+significant%3A+the+first%2C+of+our+humility+coming+before+the+mighty+God%2C+the+second%2C+of+our+confidence+and+hope%2C+the+other+of+our+sorrow+and+detestation+of+our+sins%2C+and+these+are%2C+and+may+lawfully+be+used.+Lastly%2C+M.+Deane+of+the+chapel%2C+remembered+the+practice+of+the+Jews%2C+who+unto+the+institution+of+the+Passeover%2C+prescribed+unto+them+by+Moses%2C+had+as+the+rabbins+witness+added+both+signs+and+words%2C+eating+sour+herbs+and+drinking+wine%2C+with+these+words+to+both%2C+%E2%80%98Take%2C+and+eat+these+in+remembrance%2C+etc.+Drink+this+in+remembrance%2C+etc.%E2%80%99+Upon+which+addition+and+tradition+of+theirs%2C+our+Sauiour+instituted+the+sacrament+of+his+Last+Supper%2C+in+celebrating+it+with+the+same+words+and+after+the+same+manner%3B+thereby+approving+that+fact+of+theirs+in+particular%3B+and+generally%2C+that+a+Church+may+institute+and+retain+a+sign+significant%3A+which+satisfied+his+Maiesty+exceeding+well.+And+here+the+king+desired%2C+to+have+himself+made+acquainted+about+the+antiquity+of+the+use+of+the+cross.+Which+Doctor+%5BJohn%5D+Reynolds+confessed+to+have+been+ever+since+the+apostles+times%2C+but+this+was+the+difficulty%2C+to+prove+it+of+that+ancient+use+in+baptism%E2%80%A6+it+fell+from+one%2C+I+think+it+was+my+Lord+of+Winchester%2C+obiter%2C+to+say%2C+that%2C+in+Constantine%E2%80%99s+time+it+was+used+in+baptism.+What%2C+quoth+the+King%2C+and+is+it+now+come+to+that+pass+that+we+shall+appeach+Constantine+of+Popery+and+superstition%3B+if+then+it+were+used%2C+says+his+Majesty%2C+I+see+no+reason+but+that+still+we+may+continue+it.+Mr.+Knewstubs%E2%80%99s+second+question+was+that%2C+put+%5Bthe%5D+case+%5Bthat%5D+the+Church+had+such+power+to+add+significant+signs%2C+whether+it+might+there+add+them+where+Christ+had+already+ordained+one%3B+which+he+said%2C+was+no+less+derogatory+to+Christ%E2%80%99s+institution%2C+as+he+thought%2C+than+if+any+potentate+of+this+land+should+presume+to+add+his+seal+unto+the+great+seal+of+England.+To+which+his+Majesty+answered+that+the+case+was+not+alike%2C+for+that+no+sign+or+thing+was+added+to+the+sacrament%2C+which+was+fully+and+perfectly+finished%2C+before+any+mention+of+the+cross+is+made%3B+for+confirmation+whereof%2C+he+willed+the+place+to+be+read+%5Bin+the+Book+of+Common+Prayer%5D.+Lastly%2C+if+the+Church+had+that+power+also%2C+yet+the+greatest+scruple+to+their+conscience+was%2C+how+far+such+an+ordinance+of+the+Church+was+to+bind+them%2C+without+impeaching+their+Christian+liberty%3F+Whereat+the+king%2C+as+it+seemed%2C+was+much+moved%2C+and+tolde+him+he+would+not+argue+that+point+with+him%2C+but+answer+therein+as+kings+are+wont+to+speak+in+Parliament%2C+Le+Roy+J%E2%80%99auisera%3A+adding+withall%2C+that+it+smelled+very+rankly+of+Anabaptism%3A+comparing+it+unto+the+usage+of+a+beardless+boy+%28one+Mr.+John+Black%29+who+the+last+Conference+his+Majesty+had+with+the+ministers+in+Scotland+%28in+December%2C+1602%29+told+him+that+he+would+hold+conformity+with+his+Majesty%E2%80%99s+ordinances+for+matters+of+doctrine%3A+but+for+matters+of+ceremony%2C+they+were+to+be+left+in+Christian+liberty+unto+every+man+as+he+received+more+and+more+light+from+the+illumination+of+God%E2%80%99s+Spirit%3B+even+till+they+go+mad%2C+quoth+the+king%2C+with+their+own+light%3A+but+I+will+none+of+that%2C+I+will+have+one+doctrine+and+one+discipline%2C+one+religion+in+substance%2C+and+in+ceremony%3A+and+therefore+I+charge+you%2C+never+speak+more+to+that+point+%28how+far+you+are+bound+to+obey%3F%29+when+the+Church+has+ordained+it.+And+so+asked+them+again%2C+if+they+had+anything+else+to+say%3F+Dr.+Reynolds+objected+the+example+of+the+brasen+serpent%2C+demolished+and+stamped+to+powder+by+Ezekiel%2C+because+the+people+abused+it+to+idolatry%3A+wishing%2C+that%2C+in+like+sort%2C+the+cross+should+be+abandoned%2C+because+in+the+time+of+Popery+it+had+been+superstitiously+abused.+Whereunto+the+King%E2%80%99s+Majesty+answered+diverse+ways.+First%2C+quoth+he%2C+though+I+be+sufficiently+persuaded+of+the+cross+in+baptism%2C+and+the+commendable+use+thereof+in+the+Church+so+long%3A+yet%2C+if+there+were+nothing+else+to+move+me%2C+this+very+argument+were+an+inducement+to+me+for+the+retaining+of+it%2C+as+it+is+now+by+order+established%3A+For%2C+inasmuch%2C+as+it+was+abused%2C+so+you+say%2C+to+superstition+in+time+of+popery%2C+it+does+plainly+imply%2C+that+it+was+well+used+before+Popery.+I+will+tell+you%2C+I+haue+lived+among+this+%5Bdissenting%5D+sort+of+men+%28speaking+to+the+lords+and+bishops%29+ever+since+I+was+ten+years+old%2C+but+I+may+say+of+myself+as+Christ+did+of+Himself%3A+Though+I+lived+amongst+them%2C+yet+since+I+had+ability+to+judge%2C+I+was+never+of+them%3B+neither+did+anything+make+me+more+to+condemn+and+detest+their+courses+than+that+they+did+so+peremptorily+disallow+of+all+things+which+at+all+had+been+used+in+Popery.+For+my+part%2C+I+know+not+how+to+answer+the+objection+of+the+Papists%2C+when+they+charge+us+with+novelties%3A+but+truly+to+tell+them+that+their+abuses+are+new%2C+but+the+things+which+they+abused+we+retain+in+their+primitive+use%2C+and+forsake+only+the+novel+corruption.+By+this+argument+we+might+renounce+the+Trinity+and+all+that+is+holy%2C+because+it+was+abused+in+Popery+%28and+speaking+to+Doctor+Reynolds+merely%29+they+used+to+wear+hose+and+shoes+in+Popery%2C+therefore%2C+you+shall%2C+now%2C+go+barefoot.+Secondly%2C+quoth+his+Majesty%2C+what+resemblance+is+there+between+the+brazen+serpent%2C+a+material+visible+thing%2C+and+the+sign+of+the+cross+made+in+the+air%3F+Thirdly%2C+I+am+given+to+understand+by+the+bishops%2C+and+I+find+it+true%2C+that+the+Papists+themselves+did+never+ascribe+any+power+or+spiritual+grace+to+the+sign+of+the+cross+in+baptism.+Fourthly%2C+you+see%2C+that+the+material+crosses%2C+which+in+time+of+Popery+were+made%2C+for+men+to+fall+down+before+them%2C+as+they+passed+by+them%2C+to+worship+them+%28as+the+idolatrous+Jews+did+the+brazen+serpent%29+are+demolished%2C+as+you+desire.%E2%80%9D%0A%0A%E2%80%94+King+James+I%2C+ed.+William+Barlow%2C+The+Sum+%26+Substance+of+the+Conference+which+it+pleased+his+excellent+Majesty+to+have+with+the+Lords%2C+Bishops+%26+other+of+his+Clergy%E2%80%A6+at+Hampton+Court%2C+January+14%2C+1603+%28London%3A+Windet%2C+1604%29%2C+2nd+Day%2C+pp.+67-74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff2aa09de7d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f2aa09de7d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=His%20%5BKnewstubs%E2%80%99s%5D%20objection%20against%20the%20cross,serpent%29%20are%20demolished%2C%20as%20you%20desire&amp;text=His%20%5BKnewstubs%E2%80%99s%5D%20objection%20against%20the%20cross%20consisted%20of&amp;text=the%20brazen%20serpent%29%20are%20demolished%2C%20as%20you%20desire" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>If the Church prescribe anything lawfully, so that she prescribe no more than she has power given her to prescribe, her ordinance must be accompanied with some good reason and warrant given for the satisfaction of tender consciences… It becomes not the spouse of Christ, endued with the spirit of meekness, to command anything imperiously, and without a reason given… Tertullian’s testimony is known (in Apologet.): Nulla lex, etc. ‘No law (says he) owes to itself alone the conscience of its equity, but to those from whom it expects obedience. Moreover, it is a suspected law which will not have itself to be proved, but a wicked law, which not being proved, yet bears rule.’… Neither can the Church prescribe anything lawfully which she shows not to have been convenient, even before her determination. … If the ceremonies be lawful to us because the law and ordinance of the Church prescribes them, then either the bare and naked prescription of the Church, having no other warrant than the Church’s own authority, make them to be thus lawful; or else the law of the Church, as grounded upon and warranted by the law of God and nature… If they take them (as needs they must) to the latter part, then let them either say that the ceremonies are lawful unto us, because the Church judges them to be agreeable to the law of God and nature, or because the Church proves unto us, by evident reasons, that they are indeed agreeable unto these laws. If they yield us the latter, then it is not the Church’s law, but the Church’s reasons given for her law, which can warrant the lawfulness of them unto us; which does elude and elide all that which they allege for the lawfulness of them from the power and authority of the Church. And further, if any such reasons be to be give forth for the ceremonies, why are they so long kept up from us?… It will be answered (I know), that if they Church command anything repugnant to God’s Word we are not bound to do it, nor to receive it as lawful, though the Church judge so of it; but otherwise, if that which the Church judges to be agreeable to the law of God and nature (and in that respect prescribes) be not repugnant to the Word of God, but in itself indifferent, then are we to embrace it as convenient, and consonant to the law of God and nature, neither ought we to call in question the lawfulness of it. But I reply, that [in this case] either we must judge a thing to be repugnant or not repugnant to the Word, to be indifferent or not indifferent in itself, [merely] because the Church judges so of it [which is insufficient to conscience], or else because the Church proves unto us by an evident reason that it is so… the argument is still set afoot [incomplete]; then we must receive everything (be it ever so bad) as indifferent, if only the Church happen so to judge of it; for quod competit alicui qua tale, etc. So that if we receive anything as indifferent, for this respect, because the Church judges it to be so, then shall we receive everything for indifferent which the Church shall so judge of [which is absurd].</p></blockquote>

— George Gillespie, English-Popish Ceremonies (1637), Pt. 3, Ch. 7, Sections 7, pp. 131-3">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+the+Church+prescribe+anything+lawfully%2C+so+that+she+prescribe+no+more+than+she+has+power+given+her+to+prescribe%2C+her+ordinance+must+be+accompanied+with+some+good+reason+and+warrant+given+for+the+satisfaction+of+tender+consciences%E2%80%A6+It+becomes+not+the+spouse+of+Christ%2C+endued+with+the+spirit+of+meekness%2C+to+command+anything+imperiously%2C+and+without+a+reason+given%E2%80%A6+Tertullian%E2%80%99s+testimony+is+known+%28in+Apologet.%29%3A+Nulla+lex%2C+etc.+%E2%80%98No+law+%28says+he%29+owes+to+itself+alone+the+conscience+of+its+equity%2C+but+to+those+from+whom+it+expects+obedience.+Moreover%2C+it+is+a+suspected+law+which+will+not+have+itself+to+be+proved%2C+but+a+wicked+law%2C+which+not+being+proved%2C+yet+bears+rule.%E2%80%99%E2%80%A6+Neither+can+the+Church+prescribe+anything+lawfully+which+she+shows+not+to+have+been+convenient%2C+even+before+her+determination.+%E2%80%A6+If+the+ceremonies+be+lawful+to+us+because+the+law+and+ordinance+of+the+Church+prescribes+them%2C+then+either+the+bare+and+naked+prescription+of+the+Church%2C+having+no+other+warrant+than+the+Church%E2%80%99s+own+authority%2C+make+them+to+be+thus+lawful%3B+or+else+the+law+of+the+Church%2C+as+grounded+upon+and+warranted+by+the+law+of+God+and+nature%E2%80%A6+If+they+take+them+%28as+needs+they+must%29+to+the+latter+part%2C+then+let+them+either+say+that+the+ceremonies+are+lawful+unto+us%2C+because+the+Church+judges+them+to+be+agreeable+to+the+law+of+God+and+nature%2C+or+because+the+Church+proves+unto+us%2C+by+evident+reasons%2C+that+they+are+indeed+agreeable+unto+these+laws.+If+they+yield+us+the+latter%2C+then+it+is+not+the+Church%E2%80%99s+law%2C+but+the+Church%E2%80%99s+reasons+given+for+her+law%2C+which+can+warrant+the+lawfulness+of+them+unto+us%3B+which+does+elude+and+elide+all+that+which+they+allege+for+the+lawfulness+of+them+from+the+power+and+authority+of+the+Church.+And+further%2C+if+any+such+reasons+be+to+be+give+forth+for+the+ceremonies%2C+why+are+they+so+long+kept+up+from+us%3F%E2%80%A6+It+will+be+answered+%28I+know%29%2C+that+if+they+Church+command+anything+repugnant+to+God%E2%80%99s+Word+we+are+not+bound+to+do+it%2C+nor+to+receive+it+as+lawful%2C+though+the+Church+judge+so+of+it%3B+but+otherwise%2C+if+that+which+the+Church+judges+to+be+agreeable+to+the+law+of+God+and+nature+%28and+in+that+respect+prescribes%29+be+not+repugnant+to+the+Word+of+God%2C+but+in+itself+indifferent%2C+then+are+we+to+embrace+it+as+convenient%2C+and+consonant+to+the+law+of+God+and+nature%2C+neither+ought+we+to+call+in+question+the+lawfulness+of+it.+But+I+reply%2C+that+%5Bin+this+case%5D+either+we+must+judge+a+thing+to+be+repugnant+or+not+repugnant+to+the+Word%2C+to+be+indifferent+or+not+indifferent+in+itself%2C+%5Bmerely%5D+because+the+Church+judges+so+of+it+%5Bwhich+is+insufficient+to+conscience%5D%2C+or+else+because+the+Church+proves+unto+us+by+an+evident+reason+that+it+is+so%E2%80%A6+the+argument+is+still+set+afoot+%5Bincomplete%5D%3B+then+we+must+receive+everything+%28be+it+ever+so+bad%29+as+indifferent%2C+if+only+the+Church+happen+so+to+judge+of+it%3B+for+quod+competit+alicui+qua+tale%2C+etc.+So+that+if+we+receive+anything+as+indifferent%2C+for+this+respect%2C+because+the+Church+judges+it+to+be+so%2C+then+shall+we+receive+everything+for+indifferent+which+the+Church+shall+so+judge+of+%5Bwhich+is+absurd%5D.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English-Popish+Ceremonies+%281637%29%2C+Pt.+3%2C+Ch.+7%2C+Sections+7%2C+pp.+131-3&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8b4283b22d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8b4283b22d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=If%20the%20Church%20prescribe%20anything%20lawfully,so%20judge%20of%20%5Bwhich%20is%20absurd&amp;text=If%20the%20Church%20prescribe%20anything%20lawfully%2C%20so%20that&amp;text=Church%20shall%20so%20judge%20of%20%5Bwhich%20is%20absurd" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Out of all these rules, testimonies, [and Scriptural] examples [put forth by an opponent] nothing follows in favor of our [imposed] ceremonies because no sound rule, just testimony or allowed example is brought for any ceremony of mystical signification, by man instituted, and brought into the solemn ordinary worship of God, for the use of teaching…</p></blockquote>

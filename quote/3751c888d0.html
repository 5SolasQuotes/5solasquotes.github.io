<main class="wrap"><figure class="quote" id="q-3751c888d0" data-kw="">
<blockquote><p>If, therefore, we would not be informed of it elsewhere, and had the Holy Spirit not so clearly taught it in the Word, nature itself would teach us that God is an intelligent being, Himself being the very source from which follows all reason in his creature. …

Of course the natural purpose of the world can only be the reflection of glory to the One who made it. By design God has given to the universe itself some concept of its being and of the marvelously beautiful composition of its many parts, and to each of those parts He has given some knowledge of the obligation of its existence to its Creator; thus, one must not doubt that all of the parts of creation, in general and in particular, have united toward the celebration of those virtues which God has instilled within them: His power is creating them; His wisdom in the order that He has kept them; and His goodness which has led them to testify as such.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/moses-amyraut.html">Moses Amyraut</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Treatise Concerning Predestination and its Dependent Principles</cite>, trans. Matthew Harding, ed. A. C. Clifford (1634; Norwich: Charenton Reformed Publishing, 2017), p. 58.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b51e8b1a95" data-kw="">
<blockquote><p>Philo Judaeus, Origen, Athanasius, Hilary, Augustine, Procopius of Gaza, Arnold of Chartres, R. Moses ben Maimonides in Moreh Nebuchim, bk. 2, ch. 30, 72, Cajetan, Bodin and Melchior Canus willed that the work of creation was accomplished in a moment, not in six days, and they thought that the six-day period of Moses should be understood allegorically. To whom we oppose:

1. The history of Creation in Gen. 1:5 ff., which relates in clear words what things were created on each day.

2. The sanctification of the Sabbath, for which this reason is given, because God created the heaven and the earth in six days and rested on the seventh day; which could not be said if the work of creation had been accomplished in a moment. Nor is the contrary opinion proved from Sirach 18:1, “He that lives for ever created all things at once (κοινῇ)”; for the little word κοινῇ refers not to “created,” but to “all things,” so that the sense is that God created all things without exception, and it is a collective of all created species, not, however, of time to a moment, and is to be taken not chronologically (χρονικῶς), but as a summary (συναγωγικῶς). Whence 3. Other fathers rightly defend the six-day creation with us, e.g., Chrysostom, Basil, Nazianzen, Ambrose, Gregory; to whom 4. Almost all the Scholastics subscribe. See Becanus, Theologia Scholastica, pt. 1, tract 4, ch. 1; Boyvin, Philosophia Scoti, pt. 1, Physics, pt. 2, disp. 1, ch. 3, sect. 1, quest. 6, p. 460-61. To the question, however: “Could not at least the works of individual days have been produced in a single moment?” we respond: The works of the first creation, or the first and immediate creation, were made in a single moment and a very brief space of time. In the mediate and second creation also [through the rest of the week], the command itself or the fiat of God was accomplished in a single moment, to which the works of the subsequent days, conformably to the nature of things, some were made without delay, at least a protracted one, some with some delay, in such a way, however, that the work of each day was completed on each day. What was disputed concerning this question between Maresius and Wittich, read in Wittich, Theologia Pacifica, ch. 7, §71-73, pp. 52-53; cf. also Burmann, Synopsis Theologiae, bk. 1, ch. 42, §6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706) Latin</span></figcaption>

</figure><figure class="quote" id="q-074219182d" data-kw="">
<blockquote><p>Seventhly, some may ask in what space did God make the world? I answer: God could have made the world and all things in it in one moment: but He began and finished the whole work in six distinct days. [This phrase is likely opposed to those in the early and Medieval Church who taught that the six days were but one day repeated six times.] In the first day He made the matter of all things and the light… and in the end of the sixth day He made man. Thus in six distinct spaces of time, the Lord did make all things: and that especially for three causes:

I. To teach men that they ought to have a distinct and serious consideration of every creature: for if God had made the world in a moment, some might have said, this work is so mystical that no man can speak of it. But for the preventing of this cavil, it was his pleasure to make the world and all things therein in six days: and the seventh day He commanded it to be sanctified by men, that they might distinctly and seriously meditate upon every work of the creation.

II. God made the world and every thing therein in six distinct days, to teach us what wonderful power and liberty He had over all his creatures: for He made the light when there was neither sun nor moon, nor stars: to show that in giving light to the world, He is not bound to the sun, to any creature or to any means: for the light was made the first day: but the sun, the moon and the stars were not created before the fourth day. Again, trees and plants were created the third day: but yet the sun, moon and the stars, and rain which nourish and make herbs, trees and plants to grow were not created till after the third day: which shows plainly that God can make trees, plants and herbs to grow without the means of rain, and without the virtue and operation of the sun, the moon and the stars.

III. He made the world in six distinct days and framed all things in this order to teach us his wonderful providence of his creatures: for before man was created He provided for him a dwelling place and all things necessary for his perpetual preservation and perfect happiness and felicity. So also He created beasts and cattle: but not before He had made herbs, plants and grass, and all means whereby they are preserved. And if God had this care over man when as yet He was not: much more will God have care over him now when he is, and has a being in nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles</cite>, … (London, 1595), pp. 62-63</span></figcaption>

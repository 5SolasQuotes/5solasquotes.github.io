<main class="wrap"><figure class="quote" id="q-cfff28fb4f" data-kw="">
<blockquote><p>The truth is, we cannot lawfully be either praying or praising in the very act of receiving because our hearts and minds should then be exercised in meditating upon Christ’s death and the inestimable benefits which comes to us thereby, 1 Cor. 11:24, ‘Do this in remembrance of Me.’ This remembrance is described, v. 26, ‘Ye do show the Lord’s death.’ Now one of the special ways whereby we remember Christ and so do show forth his death is by private meditation upon his death, as Pareus resolves (Commentary on 1 cor. 11:26). This meditation is a speech of the soul to itself: and though it may stand with short ejaculations, which may and should have place in all our actions, yet can it not stand with an ordinary and continued prayer purposely conceived, as Bishop Lindsey would maintain [who advocated for prayer to God while kneeling to receive the elements]. For how can we orderly both speak to God by prayer and to ourselves by meditation at one instant of time? If therefore prayer be purposely and orderly conceived, it banishes away meditation, which should be the souls exercise in the receiving of the sacrament. And by the contrary, if meditation be entertained, as it should be, it admits not prayer to have place at that time. For it is well said that Dum auribus, oculis, manibus, dentibus exterius; auribus, oculis, manibus, dentibus fidei interius occupamur, orationem continuam et durabilem, absque mentis diragatione ab opere praecepto et imperato, instruere non possumus. (Calderwood, Altar of Damascus, p. 803)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, pp. 74-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-71d0673dd4" data-kw="">
<blockquote><p>…this sacrament requiring a self-examination going before (1 Cor. 11:28). Therefore a sermon of preparation is preached the day before, even as Christ prepared and dieted his guests with heavenly sermons preceding the action (as is clear, Luke 22:14,15; Mark 14:18-20; Matt 26:21-23; John 13:13-16). … The nature of the sacrament requires thanksgiving, and therefore in the afternoon [on the Lord’s Day] a sermon of thanksgiving is preached, which is also warranted from Matt 26:30.</p></blockquote>

</figure><figure class="quote" id="q-0aad91c5a6" data-kw="">
<blockquote><p>For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (1645), ch. 6, p. 121</span></figcaption>

</figure><figure class="quote" id="q-8eb3be1fc7" data-kw="">
<blockquote><p>This sacrament, therefore, consists in the rite and the promise annexed to it, or in the signs and the things signified. The rite, or signs are the bread which is broken and eaten, and the wine which is poured out, and drunk. The things signified are the broken body, and shed blood of Christ, which are eaten and drunk, or our union with Christ by faith, by which we are made partakers of Christ and all his benefits, so that we derive from him everlasting life, as the branches draw their life from the vine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, (P&amp;R), pp. 378 &amp; 385</span></figcaption>

<blockquote><p>Finally, neither the Majesty of God, nor a regard to his glory, would allow him to permit men to continue in a state of ignorance, with respect to him, and to suffer the mean workmanship of his hands to receive the tribute of religious homage due unto himself. For, among all the nations destitute of revelation, scarcely any traces could be perceived of their believing in the government of God. They were, as the scriptures speak, “the empire of darkness” they were the empire of Satan and of death – The Deity, for a time, permitted this to happen, for reasons justified by his wisdom.

But, at last, it became him to resume the government snatched the influence of his authority, and, through the various nations of the world, to recall mankind to the acknowledgement of their sovereign and to the obedience of his laws. Hence the Psalmist, “Jehovah reigns, let the earth be glad.” Ps. xcvii. And, the kingdom of God, “or, the kingdom of heaven” is perceived to be established by the preaching of Christ.</p></blockquote>

<blockquote><p>A conclusion certain enough: God loves himself.” p. 100 Proof: 1) A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) If love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was [not] formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection. 2) Blessedness seems to be a pure perfection, and therefore it belongs to God in supreme degree. But love seems to be either the principal element in blessedness, or at any rate intimately connected with the blessedness of an intellectual being. That blessedness is a pure perfection is clear from the notion of it; for blessedness is nothing other than an intellectual being pleased, that follows upon possession of one’s proper perfection. But God knows himself as infinitely perfect; he seems, therefore, to be blessed; therefore blessedness seems to be a pure perfection. That this blessedness is not simply intellection, but includes an act of will or love, seems to follow from the fact that there is in God some operation besides what is formally called intellection, for God is formally willing, at least in respect of creatures. (See the next chapter [Part 3] about the proof of free volition in God.) For if God freely creates things outside himself and so has volition, it seems that he also has some act of volition, namely love, toward himself. 3) God is the first cause of all love in us. Hence he has this perfection either formally or virtually. If you concede that the love is better than not to love, God cannot have love only virtually, because the more imperfect does not include the more perfect virtually. Therefore God has love formally. As was said above about divine intellection, this divine love is not something really distinct from God’s essence. It extends, therefore, to everything that is really identified with the same essence. Hence it can be said that God loves his essence, his decrees, his knowledge, etc. This love is also eternal, unchangeable, non-contingent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Proof of God’</span></figcaption>

<blockquote><p>Heaven is that place alone where is to [be] obtained our highest end, and highest good. God hath made us for himself: “of God, and through God, and to God are all things” (Romans 11:36). Therefore then do we attain to our highest end, when we are brought to God. But that is by being brought to heaven, for that is God’s throne; that is the place of his special presence, and of his glorious residence. There is but a very imperfect union with God to be had in this world: a very imperfect knowledge of God in the midst of abundance of darkness, a very imperfect conformity to God, mingled with abundance of enmity and estrangement. Here we can serve and glorify God but in an exceeding imperfect manner, our service being mingled with much sin and dishonouring to God.

But when we get to heaven, if ever that be, there we shall be brought to a perfect union with God. There we shall have the clear views of God’s glory: we shall see face to face, and know as we are known [1 Corinthians 13:12]. There we shall be fully conformed to God, without any remains of sin: “we shall be like him; for we shall see him as he is” [1 John 3:2]. There we shall serve God perfectly. We shall glorify him in an exalted manner, and to the utmost of the powers and capacity of our nature. Then we shall perfectly give up ourselves to God; then will our hearts be wholly a pure and holy offering to God, offered all in the flame of divine love.

In heaven alone is attainment of our highest good. God is the highest good of the reasonable creature. The enjoyment of him is our proper happiness, and is the only happiness with which our souls can be satisfied. To go to heaven, fully to enjoy God, is infinitely better than the most pleasant accommodations here: better than fathers and mothers, husbands, wives, or children, or the company of any or all earthly friends. These are but shadows; but God is the substance. These are but scattered beams; but God is the sun. These are but streams; but God is the fountain. These are but drops; but God is the ocean.

Therefore, it becomes us to spend this life only as a journey towards heaven, as it becomes us to make the seeking of our highest end, and proper good, the whole work of our lives; and we should subordinate all the other concerns of life to it. Why should we labour for anything else, or set our hearts on anything else, but that which is our proper end, and true happiness?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Christian’s Life a Journey Towards Heaven</cite>, (1734) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 437-38.</span></figcaption>

— Jonathan Edwards, The True Christian’s Life a Journey Towards Heaven, (1734) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 437-38.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHeaven+is+that+place+alone+where+is+to+%5Bbe%5D+obtained+our+highest+end%2C+and+highest+good.+God+hath+made+us+for+himself%3A+%E2%80%9Cof+God%2C+and+through+God%2C+and+to+God+are+all+things%E2%80%9D+%28Romans+11%3A36%29.+Therefore+then+do+we+attain+to+our+highest+end%2C+when+we+are+brought+to+God.+But+that+is+by+being+brought+to+heaven%2C+for+that+is+God%E2%80%99s+throne%3B+that+is+the+place+of+his+special+presence%2C+and+of+his+glorious+residence.+There+is+but+a+very+imperfect+union+with+God+to+be+had+in+this+world%3A+a+very+imperfect+knowledge+of+God+in+the+midst+of+abundance+of+darkness%2C+a+very+imperfect+conformity+to+God%2C+mingled+with+abundance+of+enmity+and+estrangement.+Here+we+can+serve+and+glorify+God+but+in+an+exceeding+imperfect+manner%2C+our+service+being+mingled+with+much+sin+and+dishonouring+to+God.%0A%0ABut+when+we+get+to+heaven%2C+if+ever+that+be%2C+there+we+shall+be+brought+to+a+perfect+union+with+God.+There+we+shall+have+the+clear+views+of+God%E2%80%99s+glory%3A+we+shall+see+face+to+face%2C+and+know+as+we+are+known+%5B1+Corinthians+13%3A12%5D.+There+we+shall+be+fully+conformed+to+God%2C+without+any+remains+of+sin%3A+%E2%80%9Cwe+shall+be+like+him%3B+for+we+shall+see+him+as+he+is%E2%80%9D+%5B1+John+3%3A2%5D.+There+we+shall+serve+God+perfectly.+We+shall+glorify+him+in+an+exalted+manner%2C+and+to+the+utmost+of+the+powers+and+capacity+of+our+nature.+Then+we+shall+perfectly+give+up+ourselves+to+God%3B+then+will+our+hearts+be+wholly+a+pure+and+holy+offering+to+God%2C+offered+all+in+the+flame+of+divine+love.%0A%0AIn+heaven+alone+is+attainment+of+our+highest+good.+God+is+the+highest+good+of+the+reasonable+creature.+The+enjoyment+of+him+is+our+proper+happiness%2C+and+is+the+only+happiness+with+which+our+souls+can+be+satisfied.+To+go+to+heaven%2C+fully+to+enjoy+God%2C+is+infinitely+better+than+the+most+pleasant+accommodations+here%3A+better+than+fathers+and+mothers%2C+husbands%2C+wives%2C+or+children%2C+or+the+company+of+any+or+all+earthly+friends.+These+are+but+shadows%3B+but+God+is+the+substance.+These+are+but+scattered+beams%3B+but+God+is+the+sun.+These+are+but+streams%3B+but+God+is+the+fountain.+These+are+but+drops%3B+but+God+is+the+ocean.%0A%0ATherefore%2C+it+becomes+us+to+spend+this+life+only+as+a+journey+towards+heaven%2C+as+it+becomes+us+to+make+the+seeking+of+our+highest+end%2C+and+proper+good%2C+the+whole+work+of+our+lives%3B+and+we+should+subordinate+all+the+other+concerns+of+life+to+it.+Why+should+we+labour+for+anything+else%2C+or+set+our+hearts+on+anything+else%2C+but+that+which+is+our+proper+end%2C+and+true+happiness%3F%E2%80%9D%0A%0A%E2%80%94+Jonathan+Edwards%2C+The+True+Christian%E2%80%99s+Life+a+Journey+Towards+Heaven%2C+%281734%29+in+Mark+Valeri+%28ed.%29%2C+Sermons+and+Discourses%2C+1730-1733%3A+The+Works+of+Jonathan+Edwards+Volume+17+%28New+Haven+CN%3A+Yale+University+Press%2C+2000%29%2C+pp+437-38.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4ad15fa0e7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4ad15fa0e7.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/08/05/jonathan-edwards-on-heaven-and-our-highest-good/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

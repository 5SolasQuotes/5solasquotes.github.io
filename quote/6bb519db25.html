<main class="wrap"><figure class="quote" id="q-6bb519db25" data-kw="">
<blockquote><p>The presbyterians deny not but private men may preach in some cases. None that fear God do desire any to bury their talent, nor would hinder men from doing the work of God. But they would have bona bene [good things done well], God’s work done in God’s order. On these conditions we [congregationalists of Baxter’s stripe] allow private men to preach. 1. If they do it but ex charitate [out of charity], and pretend not to the ministerial office. 2. And if they do it occasionally, and not as men separated to that work as their calling (for then they become ministers indeed while they disclaim it in name). 3. If they do it not needlessly, to a proud ostentation of their parts, but only when abler men, or ministers, are not to be had or else [are] on some urgent weighty cause. 4. If they make not themselves the judges of their own fitness, but expect the approbation of the judicious, faithful, concordant ministers that know them. 5. If they undertake no more than they can perform, and suppose not themselves fitter than they are, and so run not beyond their knowledge, nor dishonor not the work of God. 6. If they thrust not themselves into any church to preach without a call, nor ordinarily without the pastor’s consent. 7. If they do it not unseasonably when by offending they are likely to do more hurt than good. 8. If in the manner, season and continuance they submit to the guidance of the pastors of the Church (if it be more than ordinary teaching, and not such as every able master of a family may there do). With these cautions we grant that private men may preach; many episcopal divines grant it: and the presbyterians ordinarily permit it in their expectants that are trained up for the ministry… And, says Dr. Fulke, Demetrius himself does seem to allow that when no bishop was present, a layman might preach: Eusebius, Ecclesiastical History, bk. 6, ch. 19 [sect. 15-18]. But that every proud unworthy man and every seducing heretick should preach, yea and thrust himself into other men’s charges, or that any should preach besides the forementioned rules, this we deny, and take it for a dangerous usurpation. But are we not agreed [with the presbyterians] in this? Hear and judge: Mr. [John] Cotton so downright denies ordinary private men to prophesy, interpreting 1 Cor. 14:31 of extraordinarily gifted prophets (of which see his Keys, pp. 20-21) that Mr. [Thomas] Goodwin and Mr. [Philip] Nye thought meet to signify some dissent, ‘Preface’, p. 6. And yet they grant, that this must be performed by private men: 1. Only occasionally, not in an ordinary course. 2. By men of such abilities as are fit for office. 3. And not assuming this of themselves, but judged such by those that have the power, and so allowed and designed to it. And, 4. So as their doctrine be subjected (for the judging of it) in an especial manner to the teaching elders of that church. And I think that this is enough to signify that here we shall have no cause of a breach with them [presbyterians]. Mr. [John] Norton speaks to the same purpose, pp. 123-25, and joins with Mr. Cotton in denying prophesy to private men and expounding 1 Cor. 14 of extraordinarily gifted prophets only: In this therefore doctrinally we agree [with the presbyterians].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Church Concord, containing: I. A Dissuasive from Unnecessary Division &amp; Separation, &amp; the Real Concord of the Moderate Independents with the Presbyterians, instanced in Ten seeming Differences</cite>, … (1655 / 1667; London: 1691), ch. 10, difference 8, pp. 38-39</span></figcaption>

<blockquote><p>Article 13, Private Worship None may preach the Word with us but pastors and the sons of the prophets, and such of their sort who aim at the holy ministry, and that authority Ecclesiastical must warrant them is clear by our Law and practice, as it was in the Jewish Church, 1 Sam. 10:5; 2 Kings 2:7; 2 Kings 4:1; 1 Kings 20:35. … Our Assembly also commands godly conference at all occasional meetings, or as God’s providence shall dispose, as the Word of God commands, Heb. 3:13; 1 Thess. 5:11,12; Lev. 19:17; Zech. 8:21; Mal. 3:16; Col. 3:16, providing none invade the pastor’s office to preach the word who are not called thereunto by God and his Church, Heb. 5:4,5; Rom. 10:14-15; 1 Cor. 12:28,29.</p></blockquote>

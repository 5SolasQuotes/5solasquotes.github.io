<main class="wrap"><figure class="quote" id="q-eff4be033f" data-kw="">
<blockquote><p>Q: 4 Why is the redemption or reconciliation of humanity with God presented to us in the form of a covenant, indeed a covenant of grace? A: God compares the means of our salvation to a covenant, indeed an eternal covenant, so that we might be certain and assured that a lasting, eternal peace and friendship between God and us has been made through the sacrifice of His son. After a bitter quarrel, the disputants have peace of mind first and foremost when they commit and bind themselves to each other with a promise and sworn oath that on such-and-such a matter they wont peace. God acts in the same way toward us: in order that we might have rest and peace in our consciences, God was willing our of His great goodness and grace, to bind himself to us, His enemies, with His promise and His oath. He promised that He would have his only begotten Son become human and die for us, and that through the sacrifice of his Son He would establish a lasting reconciliation and eternal peace. . . . He would be our God and bless us, that is, forgive our sins and impart to us the Holy Spirit and eternal life — and all this without any merit on our part. All we would have to do is accept the Son — promised and sent — by faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation</cite>, (Vester Grund, 1567).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b40dbb55ac" data-kw="">
<blockquote><p>The law, as it has a promise of life, is very unlike the gospel. The former promises eternal life to a man on condition of his own perfect obedience and of the obedience of no other, whereas the latter promises it on condition of the perfect obedience of Christ received by faith, and of that of no other. The promise of the law as a covenant is the promise of God as an absolute God, but the promise of the gospel is the promise of God as a God of grace in Christ. The promise of the former was to have been performed after obedience, whereas the promise of the latter begins to be performed to the true believer before, and in order to, his obedience. In the law of works the promise of privilege is grounded on the performance of duty, but in the gospel the performance of duty is founded on the promise, and even on the enjoyment, of privilege. The promise of the law is strictly conditional, but the leading promises of the gospel are, to us, entirely absolute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 134.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-c201986fef" data-kw="">
<blockquote><p>I believe it is the duty of every minister of Christ plainly and faithfully to preach the gospel to all who will hear it; and as I believe the inability of men to do spiritually good things to be wholly of the moral, and therefore of the criminal kind and that it is their duty to love the Lord Jesus Christ and trust in Him for salvation, though they do not; I therefore believe free and solemn and solemn addresses, invitations, calls, and warnings to them to be not only consistent, but directly adapted, as means, in the hand of the Spirit of God, to bring them to Christ. I consider it as part of my duty which I could not omit without being guilty of the blood of souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/preface.html">T. E. Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Summary of Andrew Fuller’s The Gospel Worthy of All Acceptation</cite>, in Puritan Papers, vol. 1 (1959)</span></figcaption>

</figure><figure class="quote" id="q-c358548691" data-kw="">
<blockquote><p>3… The true resolution is that God wills all things on account of His own goodness, as the ultimate end and the first reason for willing all things. However, this does not exclude that, in willing, He attends to the greater or lesser goodness in the things themselves, for from this arises also the greater or lesser fittingness of acting or willing, even on account of His own goodness. And the fact that God operates all things for Himself does not prevent Him from pursuing rational creatures with true love of benevolence and friendship. For they are capable of such love, and it befits the divine goodness to love them thus. Also, because He does not love them for His own utility or advantage, but for their own good. That this good of theirs is ordered to the glory of God as the ultimate end by God Himself is not contrary to the nature of friendship, for this does not exclude the due order to God or to the ultimate end. But God loves lower creatures with the love of concupiscence, because He wills all of them for the advantage and utility of rational creatures, and irrational beings are not capable of greater love. This is clear from Aristotle (Ethics VIII, ch. 2), St. Thomas (I, q. 20, a. 2, ad 3 and 4; Contra Gentiles, ch. 19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-suarez.html">Francis Suarez</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Thomas, pt. 1, On the Divine Substance &amp; its Attributes, pp. 505-6 tr. AI in All the Works (d. 1617; Paris: Vives, 1855), vol. 1 Latin Suarez was a major Jesuit theologian.</span></figcaption>

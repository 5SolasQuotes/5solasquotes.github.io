<main class="wrap"><figure class="quote" id="q-89c952eadc" data-kw="">
<blockquote><p>If they say that men of such erroneous principles, if they cannot be rectified, are bound to give up the ministry to others of better judgments. I answer: 1. Show me but where those men are, in so full a number as may supply the churches necessities, but so far as that I and such as I may conscionably cease without the church’s loss, and I here promise that I will joyfully give up my office whenever any such fitter man shall be called to my place. And I think the rest of my brethren will do the like. But we live in the open world, where we have opportunity to know men, as well as others: and we cannot see any such plentiful choice of able, pious men to supply all our places if we should give them up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’</cite>, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“If they say that men of such erroneous principles, if they cannot be rectified, are bound to give up the ministry to others of better judgments. I answer: 1. Show me but where those men are, in so full a number as may supply the churches necessities, but so far as that I and such as I may conscionably cease without the church’s loss, and I here promise that I will joyfully give up my office whenever any such fitter man shall be called to my place. And I think the rest of my brethren will do the like. But we live in the open world, where we have opportunity to know men, as well as others: and we cannot see any such plentiful choice of able, pious men to supply all our places if we should give them up.”

— Richard Baxter, Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘Objections Answered’, p. 76">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+they+say+that+men+of+such+erroneous+principles%2C+if+they+cannot+be+rectified%2C+are+bound+to+give+up+the+ministry+to+others+of+better+judgments.+I+answer%3A+1.+Show+me+but+where+those+men+are%2C+in+so+full+a+number+as+may+supply+the+churches+necessities%2C+but+so+far+as+that+I+and+such+as+I+may+conscionably+cease+without+the+church%E2%80%99s+loss%2C+and+I+here+promise+that+I+will+joyfully+give+up+my+office+whenever+any+such+fitter+man+shall+be+called+to+my+place.+And+I+think+the+rest+of+my+brethren+will+do+the+like.+But+we+live+in+the+open+world%2C+where+we+have+opportunity+to+know+men%2C+as+well+as+others%3A+and+we+cannot+see+any+such+plentiful+choice+of+able%2C+pious+men+to+supply+all+our+places+if+we+should+give+them+up.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Christian+Concord%2C+or+the+Agreement+of+the+Associated+Pastors+%26+Churches+of+Worcestershire%2C+with+Richard+Baxter%E2%80%99s+Explication+%26+Defence+of+it%2C+%26+his+Exhortation+to+Unity+%28London%3A+A.M.%2C+1653%29%2C+%E2%80%98Objections+Answered%E2%80%99%2C+p.+76&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89c952eadc.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89c952eadc.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/pastors#:~:text=If%20they%20say%20that%20men%20of,if%20we%20should%20give%20them%20up&amp;text=If%20they%20say%20that%20men%20of%20such%20erroneous&amp;text=our%20places%20if%20we%20should%20give%20them%20up" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Concerning the first, thus: it seems that they are not to be tolerated: 1. For they blaspheme both against Christ and against the blessed Virgin; they also persecute the catholic Faith, and they inflict injury upon the ecclesiastical sacraments, as is had in the Extravagants, On the Jews, Etsi Iudaeos. But blasphemers, according to the Old Law also, were to be handed over to death; therefore the Jews too are not to be tolerated, but to be exposed to death, especially those who conduct themselves thus. 2. Furthermore, in their book, which is called the Talmud, many things were contained that pertained to the blasphemy of Christ and the blessed Virgin; since therefore they observe the doctrine of that book as though it were a law, together with books of this sort they must be destroyed. 3. Likewise, Christians persecute pagans even to death, who are the holders of the Holy Land; but an insult to the Redeemer is a greater injury; therefore Christians ought to persecute those who perpetrate such an insult even to death; therefore they are not to be tolerated. But that they inflict an insult is evident from what is said in the Extravagants, On the Jews, In nonnullis. On the contrary: a. By what is said in the Psalm, on that verse: ‘Kill them not,’ the Gloss says: ‘This can be taken especially of the Jews;’ he prays that the Jews may not perish utterly: for they have indeed been dispersed in order that they may be provoked to conversion; and he also said concerning them: ‘Kill not those who killed me, but let the nation of the Jews remain with the sign of circumcision.’ They are to be tolerated. b. Likewise, testimony that is received from adversaries is stronger; but the catholic Church takes testimony from the Old Law, which the Jews observe; therefore, in order that the catholic Church may have testimony from enemies, the Jews are to be tolerated: for from the Old Law, namely from the Law of Moses and the Prophets, testimony about Christ is taken, which they cannot deny. c. Likewise, Isa. 10:22 has that the remnant of Israel shall be saved; and similarly the apostle says, Rom. 11:5; but the remnant could not be saved unless the seed of the Jews remained; therefore the seed of the Jews must be saved; therefore the Jews are to be tolerated. This must be granted. [Replies to objections:] 1. To the contrary objection, however, it must be said that although they commit blasphemy, still they believe that they are not sinning in this, because they do not yet believe that the Messiah has come, and in this they err and are reserved for future damnation unless they come to their senses, as is said on that verse of the Psalm: ‘I will repay them.’ The Gloss: ‘In the present however, they should persist in manifest blasphemy, so that they may be dispersed; in the future, so that they may be condemned. They ought to be restrained by secular princes, as is had in the Extravagants, On the Jews, In nonnullis, where it is said: in the provinces we most strictly forbid that they presume to burst forth into insult against the Creator; and since we ought not to conceal the reproach of Him who has wiped away our reproaches, we command that such presumptuous persons be restrained by secular princes with the addition of worthy punishment, lest they presume in any way to blaspheme the Crucified for us. 2. To the second it must be said that their books, in which blasphemies of this sort are contained, ought to be burned; but they themselves, if they should persist pertinaciously in blasphemy of this sort and are convicted before a judge, are to be punished with a fitting penalty. But it is otherwise if they blaspheme secretly. 3. To the third it must be said that there is a different reason concerning the pagan holders of the Holy Land themselves and concerning the Jews themselves. For Christians persecute those pagans as unjust holders and violators of a sacred place, to the injury of Christ; but the Jews are permitted to live and to dwell among Christians for many reasons, both because from the Jews we have received the Old Law, and because Christ came from that seed, then because the promise of their salvation was made; when the fullness of the gentiles shall have entered into Christ, they are to be restrained by due admonition; nor does it seem that greater pardon should be shown to them in manifest offenses than to evil Christians.</p></blockquote>

<blockquote><p>On occasion of this question it is asked whether those who come to the Faith from the Jews are to be received quickly or not, and similarly it can be asked concerning pagans. And it seems that not: a. from the fact that it is said in dist. 4, On Consecration, Jews, where it is said that for eight months they should enter within the catechumens of the church this threshold, and, if they are known to come with pure faith, only then should they merit the grace of baptism; the same is found there, Lest, which God forbid, where it is said that abstinence for forty days is enjoined. In both places therefore a great space of time is given for probation and for the work of penance to be carried out. But the contrary seems true: 1. From the fact that it is said, Acts 2:38, where Peter speaks to the Jews, saying: ‘Repent, and let each one of you be baptized.’ Since therefore they were baptized quickly, by his example it does not seem that reception into the Faith, or the sacrament of Faith, which is Baptism, should be deferred so long. 2. Likewise it is found, Acts 10:47-48, where it is said by Peter: ‘Can anyone forbid water, so that those who have received the Holy Spirit should not be baptized? And he commanded them to be baptized in the name of Jesus Christ.’ Acts 8:36-38. From these things therefore it seems that so great a delay is not fitting. [Solution]: To which it must be said that things were otherwise in the primitive Church in part and otherwise in the progress of the Church. For in the primitive Church there was the gift of the Holy Spirit, which was also shown in a visible sign in believers; there were also other signs manifesting faith in them; on account of which it was not necessary to defer the sacrament of Faith. But in the progress of the Church, where there were no such signs showing or powerfully proving faith, and hypocrisy of heart was hidden or could be hidden, a delay of time was necessary, so that there might be a testing of faith and catechesis, through which there would be enabling for baptism. And therefore according to the different times a different term was appointed according to earlier and later, so that it might be clear concerning the enabling for faith and that the ease of returning to vomit might be removed in the judgment of a discerning prelate, according as more or less it shall seem expedient. But such a term is left to the judgment of a discerning prelate, according as more or less it shall seem expedient.</p></blockquote>

— Alexander of Hales, Sum of Universal Theology (Paris, 1230-1245), pt. 2 of 2, inq. 3, tract 8, sect. 1, quest. 1, title 2 | member 1 | ch. 5, ‘Whether those coming to the Faith are to be Quickly Received?’">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COn+occasion+of+this+question+it+is+asked+whether+those+who+come+to+the+Faith+from+the+Jews+are+to+be+received+quickly+or+not%2C+and+similarly+it+can+be+asked+concerning+pagans.+And+it+seems+that+not%3A+a.+from+the+fact+that+it+is+said+in+dist.+4%2C+On+Consecration%2C+Jews%2C+where+it+is+said+that+for+eight+months+they+should+enter+within+the+catechumens+of+the+church+this+threshold%2C+and%2C+if+they+are+known+to+come+with+pure+faith%2C+only+then+should+they+merit+the+grace+of+baptism%3B+the+same+is+found+there%2C+Lest%2C+which+God+forbid%2C+where+it+is+said+that+abstinence+for+forty+days+is+enjoined.+In+both+places+therefore+a+great+space+of+time+is+given+for+probation+and+for+the+work+of+penance+to+be+carried+out.+But+the+contrary+seems+true%3A+1.+From+the+fact+that+it+is+said%2C+Acts+2%3A38%2C+where+Peter+speaks+to+the+Jews%2C+saying%3A+%E2%80%98Repent%2C+and+let+each+one+of+you+be+baptized.%E2%80%99+Since+therefore+they+were+baptized+quickly%2C+by+his+example+it+does+not+seem+that+reception+into+the+Faith%2C+or+the+sacrament+of+Faith%2C+which+is+Baptism%2C+should+be+deferred+so+long.+2.+Likewise+it+is+found%2C+Acts+10%3A47-48%2C+where+it+is+said+by+Peter%3A+%E2%80%98Can+anyone+forbid+water%2C+so+that+those+who+have+received+the+Holy+Spirit+should+not+be+baptized%3F+And+he+commanded+them+to+be+baptized+in+the+name+of+Jesus+Christ.%E2%80%99+Acts+8%3A36-38.+From+these+things+therefore+it+seems+that+so+great+a+delay+is+not+fitting.+%5BSolution%5D%3A+To+which+it+must+be+said+that+things+were+otherwise+in+the+primitive+Church+in+part+and+otherwise+in+the+progress+of+the+Church.+For+in+the+primitive+Church+there+was+the+gift+of+the+Holy+Spirit%2C+which+was+also+shown+in+a+visible+sign+in+believers%3B+there+were+also+other+signs+manifesting+faith+in+them%3B+on+account+of+which+it+was+not+necessary+to+defer+the+sacrament+of+Faith.+But+in+the+progress+of+the+Church%2C+where+there+were+no+such+signs+showing+or+powerfully+proving+faith%2C+and+hypocrisy+of+heart+was+hidden+or+could+be+hidden%2C+a+delay+of+time+was+necessary%2C+so+that+there+might+be+a+testing+of+faith+and+catechesis%2C+through+which+there+would+be+enabling+for+baptism.+And+therefore+according+to+the+different+times+a+different+term+was+appointed+according+to+earlier+and+later%2C+so+that+it+might+be+clear+concerning+the+enabling+for+faith+and+that+the+ease+of+returning+to+vomit+might+be+removed+in+the+judgment+of+a+discerning+prelate%2C+according+as+more+or+less+it+shall+seem+expedient.+But+such+a+term+is+left+to+the+judgment+of+a+discerning+prelate%2C+according+as+more+or+less+it+shall+seem+expedient.%E2%80%9D%0A%0A%E2%80%94+Alexander+of+Hales%2C+Sum+of+Universal+Theology+%28Paris%2C+1230-1245%29%2C+pt.+2+of+2%2C+inq.+3%2C+tract+8%2C+sect.+1%2C+quest.+1%2C+title+2+%7C+member+1+%7C+ch.+5%2C+%E2%80%98Whether+those+coming+to+the+Faith+are+to+be+Quickly+Received%3F%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdb846f7892.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/db846f7892.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=On%20occasion%20of%20this%20question%20it,or%20less%20it%20shall%20seem%20expedient&amp;text=On%20occasion%20of%20this%20question%20it%20is%20asked&amp;text=as%20more%20or%20less%20it%20shall%20seem%20expedient" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c4a236c97d" data-kw="">
<blockquote><p>On the other hand [in contrast to Christianity], those who introduced the errors of the sects proceeded in contrary fashion, as is clear from Mohammed, who enticed peoples with the promise of carnal pleasures, to the desire of which the concupiscence of the flesh instigates. He also delivered commandments in keeping with his promises, by giving the reins to carnal pleasure, in which it is easy for carnal men to obey. Also, the lessons of truth which he inculcated were only such as can be easily known to any man of average wisdom by his natural powers—in fact, he mingled the truths which he taught with many fables and most false doctrines. Nor did he add any signs of supernatural agency, which alone are a fitting witness to divine inspiration, since a visible work that can only be from God proves the teacher of truth to be invisibly inspired, but he asserted that he was sent in the power of arms, which sign is not lacking even to robbers and tyrants. Again, those who believed in him from the outset were not wise men practiced in things divine and human, but bestial men who dwelt in the deserts, utterly ignorant of all divine teaching, and it was by a multitude of such men and the force of arms that he compelled others to submit to his law. Lastly, no divine oracles of prophets in a previous age bore witness to him; rather, he corrupted almost all the teaching of the Old and New Testaments by a narrative replete with fables, as one may see by a perusal of his law. Hence, by a cunning device, he did not commit the reading of the Old and New Testament books to his followers, lest he should thereby be convicted of falsehood. Thus it is evident that those who believe his words believe lightly.</p></blockquote>

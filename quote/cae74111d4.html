<blockquote><p>Vers. 24. Then cometh the end, when he shall have delivered up the Kingdom to God, even the Father, when he shall have put down all rule, and authority, and power.

He further declares this Argument, shewing that by the purpose of God, two things are conjoined in time, with the end of the world, viz. The delivering up the Kingdom by the Son into the hands of the Father, and the putting down of all rule, authority, and contrary power; whereof this is the meaning: After Christ shall have subdued and abolished all adverse power, as the Devil, the World, and the rest, of what kind soever, he will vanquish those powers so far forth, that they shall not any longer be injurious to his members, all of them being thrust down to hell; at last Christ shall present his Church (which is called the Kingdom of Christ, given him of his Father) every way perfect, and deliver it up, as it were, into the hands of his Father.

Thirdly, Having now perfected his Mediatory Office, and laid aside that manner of ruling, by those means which he now useth for the gathering and governing of his Church. Fourthly, Having finished all things which were committed to him by his Father to finish, he shall resign up the Kingdom also committed to him, over all things which are in the world, to the perfecting the work of our Redemption, he shall (I say) deliver up the Kingdom to God, according to his Humanity, and to his Father, according to his Divinity; not that he shall cease to reign immediately, but mediately, and as before: not that he shall leave off to reign with the Father, but shall cease to reign as deputed by the Father, to conflict with his enemies, or to administer any longer in a laborious and painful work of gathering his Church, otherwise there is no end of his Kingdom, he shall indeed reign much more gloriously than now he doth, when his adversaries are conquered, without the Ministry of Angels or men, he shall govern, together with the Father, and fill all his with light, love, life, with his virtues immediately. …

Vers. 28. And when all things shall be subdued unto him, then shall the Son also himself bee subject unto him that put all things under him, that God may be all in all.

This he further illustrates, because the Mediatory Kingdom of Christ being delivered up, as was now said, the Son himself is to be subjected unto God, who hath subdued all things to him, that God may be all in all, i. e. Christ as man having laid aside his Mediatory Embassage, will most fully manifest, that all things which were done by him as man, were done in the power, authority, and Name of God; and that he, as man, is less than the Father, being for ever united to his Body, the Church, is subject to the Father; that the mediation, and means, and instruments, and helps which are now used being laid aside, God the Father, Son, and Holy Ghost, may supply all the necessities of the Saints immediately; and may by his power bee all means in all his Saints, and may altogether extinguish the necessity of all means, instruments, and helps by his immediate presence with them most fully for ever; and he will more than supply the room of all those; and he himself by his power and efficacy, will be more than all these, and what ever may be needful for the most happy felicity of all his Saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 66-67.</span></figcaption>

<blockquote><p>That they [Romanists] cry up a private, unproved, unwritten tradition of their own, as of equal authority with this safe and full rule, which is contained in this written Word of God. Their crime and fault may be considered, partly with respect to the object and matter; that these traditions are not indifferent customs, but essential points necessary to faith and christian practice. And so though a Christian be never so through and sound in his obedience to the Word of God, and true to the baptismal covenant, yet if he submits not to these unwritten traditions, he wants [lacks] some point necessary to faith and practice, and so to life eternal: which is contrary to Mark 16:16. “He that believes and is baptized, shall be saved; and he that believes not, shall be damned.” And John 17:3.” This is life eternal, to know you the only true God, and Jesus Christ whom you have sent.” Partly as to the subject, as they make their own faction to be the only keepers of these things; and that nothing is to be owned as apostolic tradition, but what is delivered as such by their authority; which is to leave the church to the tyranny and usurpation of a corrupt faction; to declare for apostolic tradition any thing which serves their end and interest, and for which no true historical evidence is produced. Now the unjust and fraudulent practices which they have used, to promote this usurpation over the churches of Christ, render them false men, most unfit to be trusted in this kind. Partly with respect to the manner, they will have these things to be received, pari reverentia et pietatis affectu, with the same reverence and pious affection with which we receive the Holy Scriptures; and so man’s post is set by God’s, and unproved traditions equaled with doctrines of faith. Their opinion is bad enough, but their practice is worse. For there they show they value these things more than the Scriptures. As superstition always abounds in its own things. Did ever any of their doctors [teachers] say the same things of traditions, which they take the boldness to say of Scripture? Did they ever call them pen and inkhorn, or parchment divinity, a nose of wax, a dumb rule, an obscure and ambiguous doctrine? These Blasphemies they vent boldly against the Scriptures: but did they ever speak these of traditions? And again, their common people are a thousand times better instructed in their traditions, than in the doctrine of salvation. They skill more of Lent, and Ember-weeks, etc. than they truly understand the doctrine of man’s misery and remedy. And call you this reverence and pious affection to the Scriptures and traditions? Partly because they would never give us a catalogue of unwritten traditions, necessary to be observed by all Christians; It may be lest they should amaze the people with the multitude of them, or else that the people may not know how many of their doctrines are destitute of Scripture proof, and so they plainly be discovered to be imposers on the belief of the Christian world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>XVIII Sermons on the Second Chapter of the 2nd Epistle to the Thessalonians</cite>, … (London, 1679), 340–42 [Spelling and punctuation modernized].</span></figcaption>

<blockquote><p>And here it is to be observed that as preaching of the Word is an essential note of the visible Church, and agreeing to the visible Church as necessary ad esse simpliciter [to its essence simply], to the very being of a visible Church… and meeting in one place for Word and sacraments is but accidental for a ministerial Church…</p></blockquote>

<blockquote><p>Like as the Samaritan judged even his enemy to be his neighbour, and dealt friendly with him, when he stood in need of his friendship; so see that thou take every one that needeth thy help to be that neighbour, and do him good.</p></blockquote>

</figure><figure class="quote" id="q-51c6ead609" data-kw="">
<blockquote><p>Second you may say that I translated the New Testament conscientiously and to the best of my ability. I have compelled no one to read it, but have left that open, doing the work only as a service to those who could not do it better. No one is forbidden to do a better piece of work. If anyone does not want to read it, he can let it alone. I neither ask anybody to read it nor praise anyone who does so. It is my Testament and my translation, and it shall continue to be mine. If I have made some mistakes in it—though I am not conscious of any and would certainly be most unwilling to give a single letter a wrong translation intentionally—I will not allow the papists [to act] as judges. For their ears are still too long, and their hee-haws too weak, for them to criticize my translating. I know very well—and they know it even less than the miller’s beast—how much skill, energy, sense, and brains are required in a good translator. For they have never tried it. …But to return to the matter in hand! If your papist wants to make so much fuss about the word sola (alone) tell him this, “Dr. Martin Luther will have it so, and says that a papist and an ass are the same thing.” Sic volo, sic jubeo; sit pro ratione voluntas [I will it. I command it. My will is sufficient reason]. We are not going to be the pupils and disciples of the papists, but their masters and judges. For once, we too are going to be proud and brag with these blockheads; and as St. Paul boasts over against his mad raving saints [II Cor. 11:21ff.], so I shall boast over against these asses of mine. Are they doctors? So am I. Are they learned? So am I. Are they preachers? So am I. Are they theologians? So am I. Are they debaters? So am I. Are they philosophers? So am I. Are they dialecticians? So am I. Are they lecturers? So am I. Do they write books? So do I. I will go further with my boasting. I can expound psalms and prophets; they cannot. I can translate; they cannot. I can read the Holy Scriptures; they cannot. I can pray; they cannot. And, to come down to their level, I can use their own dialectics and philosophy better than all of them put together; and besides I know for sure that none of them understands their Aristotle.23 If there is a single one among them all who correctly understands one proemium [preface] or chapter in Aristotle, I’ll eat my hat. I am not saying too much, for I have been trained and practiced from my youth up in all their science and am well aware how deep and broad it is. They are very well aware, too, that I can do everything they can. Yet these incurable fellows treat me as though I were a stranger to their field, who had just arrived this morning for the first time and had never before either seen or heard what they teach and know. So brilliantly do they parade about with their science, teaching me what I outgrew25 twenty years ago, that to all their blatting and shouting I have to sing, with the harlot, “I have known for seven years that horseshoe-nails are iron.” Let this be the answer to your first question. And please give these asses no other and no further answer to their useless braying about the word sola than simply this, “Luther will have it so, and says that he is a doctor above all the doctors of the whole papacy.” It shall stay at that! Henceforth I shall simply hold them in contempt, and have them held in contempt, so long as they are the kind of people—I should say, asses—that they are. There are shameless nincompoops among them who have never learned their own art of sophistry—like Dr. Schmidt and Doctor Snotty-Nose, and their likes—and who set themselves against me in this matter, which transcends not only sophistry, but (as St. Paul says [I Cor. 1:19–25]), all the world’s wisdom and understanding as well. Truly an ass need not sing much; he is already well known anyway by his ears.</p></blockquote>

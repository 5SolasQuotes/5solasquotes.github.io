<main class="wrap"><figure class="quote" id="q-ef0d9d52f8" data-kw="">
<blockquote><p>We acknowledge not what Navarrus and Gregory say, that excommunication, whether just or unjust, is to be feared, for the curse causlessly does not fall. The sentence is either given out: [1.] a jure, vel ab homine, by the Law, or the persons. Secondly, it is either just or unjust. Thirdly, and that three ways: exanimo, [out of] good or ill zeal; secondly, ex causa, [out of] a just or unjust cause; thirdly, ex ordine [out of order], when order of law is kept. An unjust sentence is either valid or null. That which is invalid is either invalid through defect of the good mind of the excommunicators, and this is not essential to the excommunication’s validity. That which is invalid this way only, ligat, ‘it binds’ in foro exteriore [in the external court]. But that which is unjust through want [lack] of a just cause, it only binds from external communion; but because God’s ordinances are to be measured from their own nature, and the general intention of the catholic Church, and not from abuses and particular intentions of such excommunicators: therefore they do not exclude from the general Church-desires. The fourth Council of Carthage, as also Gerson says, an unjust sentence neminem gravare debet, ‘should affright no man’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1, ‘Of the Addition of Members to the Church’</cite>, pp. 279-80</span></figcaption>

<blockquote><p>[Rutherford’s Anglican opponents said:] ‘Notwithstanding, that crossing, kneeling, surplice, human holy days occasion the soul-murder of him for whom Christ died, yet we the Prelates command the practice of the foresaid ceremonies as good and expedient for edification, for our commandment makes the murdering of our brethren, to be obedience to the Fifth Commandment.’ [Rutherford responds:] But if Prelates may command that which would be otherwise, without, or before the Commandment [of God], [even] spiritual murdering and scandalizing of our brother, they may command also that which would be otherwise without or before their command: adultery against the Seventh, and theft against the Eighth, and Perjury and lying against the Ninth Commandment, and concupiscence against the Tenth; for the Fifth Commandment has the precedency before the Seventh, Eighth, Ninth and Tenth Commandments no less than before the Sixth, which forbids the killing of our brother’s soul.</p></blockquote>

<blockquote><p>Question 2. Is A Magistrate Held Responsible To Render Account Of All His Laws To His Subjects? And How Far Are They To Presume Such Laws To Be Just? After this foundation has been laid we would also inquire into certain other questions which would appear to be germane to this discourse that the consciences of many may be satisfied. First the question is raised whether the magistrate is held to render account of all his laws to any man soever so as to offer proof that they be fair and in accordance with the precepts of religion. I answer that he is not so held; nay more, that it is fair that all virtuous subjects should regard their lords in the light of virtue and should not presume of suspect anything unjust concerning them; nay, that it is not becoming that men in private station should inquire over curiously even concerning doubtful matters beyond their comprehension or station in life. If, however, the conscience of some be at a loss, they can and are even under an obligation to examine (albeit discreetly and in a peaceful manner) what elements of reason and justice are to be found in the command by which they are bidden or forbidden to do something; for the word of the apostle abides: “whatsoever is not of faith (that is while the conscience is in doubt whether that is being done justly or not) is sin”. But if what is commanded is openly sinful or unjust, then indeed that which has been said above applies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Concerning the Rights of Rulers Over Their Subjects &amp; the Duty Of Subjects Towards Their Rulers (1574)</cite></span></figcaption>

<blockquote><p>That which wicked men bind on earth is not bound in heaven… Excommunication, persecution, and imprisonment have generally been favorite weapons with ecclesiastical tyrants. Unable, like the Pharisees, to answer arguments, they have resorted to violence and injustice. Let the child of God console himself with the thought that there is a true Church out of which no man can cast him, and a Church-membership which no earthly power can take away. He only is blessed whom Christ calls blessed; and he only is accursed whom Christ shall pronounce accursed at the last day.</p></blockquote>

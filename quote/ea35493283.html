<blockquote><p>There is much underhanded dealing against the cause and covenant of God. We did swear the extirpation of prelacy, popery and schism; now we preach, profess and print that liberty is to be given for consciences of men, and how can this be denied to papists and prelates? Not only every city, but every family almost has a new religion. The former unrepented will worship in the breasts of men, against the power of godliness, vanity in apparel, whoring, extortion, injustice to widows and orphans, whose husbands and parents were killed in the wars, drunkenness, excess, lying and cozening, unjust and false slanders and calumnies, trusting in the arm of men and multitudes, halting between God and Baal, postponing of Christ matters to the end of the day, as if religion and the house of God were of less concernment to us than liberties and civil laws, and as if both kingdoms miraculously defended by the right arm of God, against merciless and blood thirsty Babylon, were not more obliged to the Lord of Hosts, who has saved us, than that we should now be debtors to our own carnal ends […] Oh that our Lord would boil out on the fire the scum of both kingdoms […] our breach of our Covenant, denying justice to the oppressed, to the widow, strangers, and orphans, to the poor and needy […]</p></blockquote>

</figure><figure class="quote" id="q-895023b525" data-kw="">
<blockquote><p>[T]he special statute designed to prevent this crime, “He that stealeth a man and selleth him, or if he be found in his hand, he shall surely be put to death,” forever brands with the stamp of God’s reprobation and curse American slavery, and rendered the practice of such an iniquity in the Jewish Commonwealth impossible. The law does not read, he that stealeth a slave and selleth him, nor he that stealeth a servant even, and selleth him, but he that stealeth a man. It was the crime of stealing a man from himself, of removing him from a condition of freedom to a condition of bondage, as our slaves were stolen in the first instance from Africa, against which this law was directed; the very grossest outrage that can be perpetrated on humanity, a crime in God’s sight of the deepest dye, and therefore adjudged worthy of the severest punishment known to the divine law, namely, death.

Dare Mr. Van Dyke deny this? So have said all the churches; – his own included, in its testimony of 1801 – previous to its enlightenment and sanctification by the price of cotton, sugar, and tobacco! So have all the civilized nations of the world agreed, by declaring the foreign slave-trade murder and piracy, words all too mild to express the enormity of its guilt. There was no such crime as slave-stealing known in Israel, for the simple reason that there were no slaves to steal. However criminal helping a man to freedom may be, it is not forbidden in the divine word; on the contrary … it is highly commended. But the crime of man-stealing was known in the heathen nations round about Israel; and against the practice of such enormity, God guarded his chosen people by the fiery sword of this express and unqualified enactment. Can any man deny that American slavery originated in man-stealing? If so, does it not stand condemned and cursed in its very root, by the law of that God whose judgment is according to truth? Moreover, as if the Spirit designed to anticipate all subterfuges, it is added, “and if he be found in his hand, he shall surely be put to death.” Had it been made for our system, and designed to meet the argument with which it is attempted to be supported, it could not have been more specific.

How many transfers then, I ask, in the name of all that is sacred, does it require to transform this vice into a virtue? – this crime, against which the judgments of Heaven are denounced, into a grand missionary enterprise, and its practice into the highest exercise of a heavenly beneficence and piety? …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-r-w-sloane.html">J. R. W. Sloane</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of Rev. Henry J. Van Dyke’s discourse on “The character and influence of abolitionism,” a sermon preached in the Third Reformed Presbyterian Church, Twenty-Third Street, New York, on Sabbath evening, December 23, 1860</cite>, (New York, 1861), pp 10-11. Available from here.</span></figcaption>

<blockquote><p>Forasmuch as it has pleased the Almighty God by the wise disposition of his divine providence so to Order and dispose of things that we… are now cohabiting and dwelling in and upon the River of Conectecotte… And well knowing where a people are gathered together the word of God requires that to maintain the peace and union of such a people there should be an orderly and decent Government established according to God… do therefore… enter into Combination and Confederation together, to maintain and preserve the liberty and purity of the gospel of our Lord Jesus which we now profess, as also the discipline of the Churches, which according to the truth of the said gospel is now practiced amongst us… 1. It is Ordered, sentenced and decreed that there shall be yearly two general Assemblies or Courts… wherein shall be yearly chosen form time to time so many magistrates and other public officers… Whereof one to be chosen Governor… which… shall have power to administer justice according to the Laws here established, and for want thereof according to the rule of the word of God… … The Oath of the Governor, for the [Present] I N. W…. do swear by the great and dreadful name of the everliving God, to promote the public good and peace of the same… and will further the execution of Justice according to the rule of God’s word; so help me God, in the name of the Lord Jesus Christ.</p></blockquote>

ass="src" href="https://reformedbooksonline.com/the-establishment-principle-in-the-american-westminster-standards-and-early-american-states/#:~:text=Forasmuch%20as%20it%20has%20pleased%20the,name%20of%20the%20Lord%20Jesus%20Christ&amp;text=Forasmuch%20as%20it%20has%20pleased%20the%20Almighty%20God&amp;text=in%20the%20name%20of%20the%20Lord%20Jesus%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>When, recently, you jumped into a well in order to die there, you certainly did this of your own free will, but how cruel the servants of God would have been had they abandoned you to your evil will and had not delivered you from that death! Yet you threw yourself into the water deliberately in order to die there, and they pulled you out of the water against your will so that you might not die there; you acted according to your own evil will to your own destruction; they acted against your will to save you. If, then, that bodily welfare is to be so safeguarded that it is preserved even in those who do not want it by those who love them, how much more is that spiritual welfare to be preserved since by its loss eternal death is feared! Yet, you would have remained in that death which you wanted to inflict on yourself, not for time but for eternity, because even if you were being forced to some evil deed instead of to salvation, to the peace of the Church, to the unity of the body of Christ, to holy and indivisible charity, you had no right to try to kill yourself.

Examine the divine Scriptures and scrutinize them as closely as you can, and see whether this was ever done by any of the good and faithful souls, even though they suffered great trials at the hands of those who were trying to drive them to eternal destruction, not to eternal life, to which you are being forced. I have heard that you said the Apostle Paul meant that this was lawful when he said: ‘If I should deliver my body to be burned.’ Probably because he was listing all kinds of good things which are worth nothing without charity, such as tongues of men and angels, and all mysteries, and all knowledge, and all prophecy, and all faith so as to move mountains, and distribution of his goods to the poor, you thought he included among good things the taking of one’s own life.

But notice carefully and understand in what sense Scripture says that anyone should deliver his body to be burned: not, certainly, that he should jump into the fire when harassed by a pursuing enemy, but that, when a choice is offered him of either doing wrong or suffering wrong, he chooses not to do wrong rather than not to suffer wrong. In this case he delivers his body into the power of the slayer, as those three men did who were being forced to adore the golden statue, and who were threatened by the one who was forcing them with the furnace of burning fire if they did not do it. They refused to adore the idol, but they did not cast themselves into the fire, yet it is written of them: ‘They delivered up their bodies that they might not serve nor adore any god but their own God.’ This is what the Apostle means by ‘If I deliver my body to be burned.’</p></blockquote>

<blockquote><p>3. The word ‘regeneration’ also signifies the same thing with conversion, but with this small difference:

1. The term is metaphorical, taken from our natural generation; because there is so great a change, that a man is as it were another man.

2. The word is in Scripture-sense, I think more comprehensive than conversion, repentance or vocation: For it signifies not only the newness of our qualities, but also of our relations, even our whole new state. This is not ordinarily acknowledged, but if we view the places where the word is used, it will prove so. For as Paul describing the thing, though he use not the word, 2 Cor. 5:11, says, ‘He that is in Christ is a new creature, old things are passed away, behold all things are become new,’ where relations must needs be part of that ‘all,’ as the context will show. So Titus 3:5, it is called the ‘laver’ or ‘washing of regeneration;’ and is distinguished from the ‘renewing of the Holy Ghost,’ at least as the general, comprehending that as a part.

1. Most expositors think that the word has reference to baptism, and expresses its effects or consequents. And no doubt baptism is for remission of sins, and therefore the laver of regeneration is for remission of sins.

2. The very text mentions plainly that grace by which we are saved; by free grace, and that is our free justification as well as free sanctification. And our divines commonly cite that text against the Papists upon that account, as pleading for free justification. ‘Not by works of righteousness that we have done, but according to his mercy He saved us, by the washing of regeneration, and the renewing of the Holy Ghost:’ Is not saving from the guilt of sin a part of our salvation? what reason to restrain ‘saving’ here to sanctification only? Doubtless if there were reason to restrain the word ‘regeneration’ to either, it would be to justification only: Because the giving of the Holy Ghost is next mentioned by itself, but justification is not mentioned at all if ‘regeneration’ comprehends it not. And it is certain, that the apostle intends not only to tell us that we are freely sanctified without works, but also that we are freely justified by grace without works. So Jn. 3:3, ‘Except a man be born of water and of the Spirit, he cannot enter into the Kingdom of God.’ Where he at least has some respect to baptism, as most suppose; and baptism is for the remission of sins: to be born of water therefore must needs include remission of sin. And this regeneration makes a man a new creature, and as Paul says, in the new creature all things are become new; and not the qualities only. But in the main, regeneration is the same with conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, pp. 8-9</span></figcaption>

<blockquote><p>Conversion, accepted in this notion, is considered either according to the acts of second regenerating grace as they are on the part of God; or according to new and spiritual acts as they are from us, who being acted upon, act. … The acts and progress of regeneration in the second moment (as indeed it is considered in its effect, on our part—namely, insofar as, the divine impression and touch being passively received by us, we simultaneously actively formally work those acts, Phil. 2:12–13)…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c054defa15" data-kw="">
<blockquote><p>III. For the will of God is two fold, the one is his decree, the other is his commandment. The decree of God, belongeth to the providence of God, and the commandment of God, belongeth to his justice; By his decree, he doth appoint and dispose the events of things; by his commandment he doth govern our actions. By the former will, God doth appoint what he will have done; by the latter, what he would have us do. To the former all creatures obey, even the Devils themselves; to the latter only the faithful, and yet not that perfectly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 4.3, p. 18.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination</cite>, (Maxwell &amp; Roberts, 1677), pt. 1, bk. 2, p. 357</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-2cf47a9734" data-kw="">
<blockquote><p>I long ago began a treatise [Baxter’s Catholick Theology] to reconcile the Arminians and Anti-Arminians in these matters… And because I know not whether ever I shall live to reassume it… I must give the judicious a few hints of the media [means] of conciliation which I would have used: …

20. The doctrine of God’s antecedent and consequent will must be better explained, as being but his governing will, so called from legislation and judgment, which are the antecedent and consequent parts of government.

21. So must God’s will de naturalibus et moralibus [of natural and moral things], and his legislative antecedent will be well opened, and the uselessness and confusion of the distinction of signi [sign] and beneplaciti [good-pleasure] manifested.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Nonconformists’ Ministry</cite>, … (London: Parkhurst, 1681), pp. 122-23, 127</span></figcaption>

</figure><figure class="quote" id="q-e458fb20dc" data-kw="">
<blockquote><p>The third point comes now to be considered, namely the harmony or consent of both wills. For the words are, ‘I would, ye would not.’ [Mt. 23:37] Here it may justly be demanded whether there be a harmony or consent between God’s will and man’s will, and how it stands with this text. I answer, there is an excellent harmony: and generally it stands in this, that God’s will has a sovereign lordship over the will of man, and man’s will stands subject to it absolutely, and simply depends upon it. And by this means, where man has a will, God has an antecedent will;† and where man’s will has any stroke or action, there God’s will formerly had his stroke and action. † [Given the context and below, it is likely Perkins means God’s will of decree is antecedent to man’s will, involving the predetermination of man’s will. Perkins below criticizes Damascene’s sense of the term antecedent will.]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Free Grace &amp; Man’s Free Will</cite>, (Cambridge, 1601), pp. 133-34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-40416f46d3" data-kw="">
<blockquote><p>It happens, however, sometimes that God moves a man to some good, yet does not perfect him, so that such preparation precedes grace. But sometimes He moves him immediately and perfectly to good, and the man receives grace suddenly: according to that of John 6: ‘Everyone who has heard from the Father and has learned, comes to me.&#x27;</p></blockquote>

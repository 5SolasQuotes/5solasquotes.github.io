<main class="wrap"><figure class="quote" id="q-9abb3f2784" data-kw="">
<blockquote><p>Here’s an answer to all the objections of unbelief and diffidence, the chief whereof lies here; O, says unbelief, may I, sinful guilty I, lay hold on the promise of mercy and peace in the gospel, when I see the great ordnance of the divine threatening hard charged with the truth and righteousness of God, and ready to be discharged against me with thunder and lightning, saying, no mercy, no peace; He that made thee will not have mercy upon thee; and there is no peace, says my God, to the wicked?

Mercy and peace in the promise then, says unbelief, cannot take place with respect to me; for truth and righteousness in the threatening stand in the way, like a flaming sword, to keep the way of the tree of life. Nay, but, says faith, here the promise and the threatening have met together, and kissed each other in Christ; mercy in the promise, and justice in the threatening, have met and agreed in him, in whom all the promises are Yea and Amen, and in whom all the threatenings are fully executed, by drawing out his heart-blood. Thus then, we have boldness to enter into the holiest by the blood of Jesus, Heb. 10.19. By a new and living way, which he hath consecrated for us through the vail of his flesh: Therefore let us draw near with a true heart, in full assurance of saith.

O what ground for the boldness and assured confidence of faith, with particular application, notwithstanding the threatening! The threatening hath nothing to say to me, saith faith, for Christ hath spoken with it already, and spoken it out of breath; he hath left it speechless and breathless; not a breathing of wrath in it towards me. The believer may have a million of doubts, while his unbelief keeps the chair; but let gallant faith come in, and take the room, it will dispel them all. Let once unbelief break the harmony of this meeting of divine attributes in Christ, and then nothing but doubts of God’s favour and mercy must ensue; but let faith view the harmony, and see them meeting and kissing each other, and then, according to the measure of faith, such will be the measure of holy boldness, confidence and persuasion of the favour, mercy and good-will of God in Christ, with particular application to the person himself.

Take away unbelief from faith, and then not a single doubt will remain behind: Unbelief creates all the doubts that are in the believer, his faith hath no part in them. The general doubtful faith of the Papists is not faith, but unbelief; and therefore no wonder that our forefathers abjured it in our national covenant. Behold the sure ground and firm bottom that faith stands upon, even the mutual meeting and embracement among the divine perfections in Christ. If you break and separate the meeting by unbelief, then your confidence is broken, and your peace with God marred; but, if you keep them together in your view by faith in Christ, then you have boldness confidence and affiance on this ground: yea, then God in Christ and you meet together, and kiss each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The harmony of the divine attributes displayed; in the redemption &amp; salvation of sinners by Jesus Christ. Being a sermon preached at Dunfermline on the 20th of September 1723; immediately after the celebration of the Lord’s Supper</cite>, (1723; Boston: S. Kneeland and T. Green, 1748), pp 48-49.</span></figcaption>

<blockquote><p>1. Because out of the amiable invitation, this only is concluded: the simple obligation of the creature to obedience, an earnest [seria] approbation and complacency which God has with respect to the obedience, inasmuch as the thing is holy, has been required of Him, is morally pleasing, and as it is unto the convenience and salvation of a man. On account of this disposition [affectus] in God, nothing is further added by the simple complacency of God around obedience except a certain quasi-intention and vehemency of divine obligation to the thing, which testifies to the obedience of all by an earnestness from the precept and from having obliged men to the thing; and thus it is to Him singularly and vehemently pleasing in his sight inasmuch as salvation is made glorious to men; but except He decree it, by the corruption of men, it will not come to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. Johnson &amp; Fentiman (1639-1642; RBO, 2019), ch. 2, ‘On God’, Section 20, ‘Whether because God amiably invites and by supplications solicits, entreats and calls upon reprobates, and as He mourns over them, is grieved by them and laments on account of the disobedient, whether He, therefore, intends the obedience of them?’, pp. 57-58</span></figcaption>

</figure><figure class="quote" id="q-0480249b8d" data-kw="">
<blockquote><p>I was standing on the 10th of December, 1846, at the end of my Father’s house, and meditating on that precious word that has brought peace to countless weary ones: ‘God so loved the world, that He gave his only begotten Son, that whosoever believeth in Him, should not perish, but have eternal life’ (John 3:16). I saw the proof of his love in the giving of his Son Jesus. I saw that ‘whosoever’ meant anybody and everybody, and therefore me, even me. I saw the result of believing—that I would not perish, but have everlasting life. I was enabled to take God at his word. I saw no one, but Jesus only, all in all in redemption. My burden fell from my back, and I was saved. Yes, saved!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/duncan-matheson.html">Duncan Matheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life and Labors of Duncan Matheson</cite>, (Kilmarnock: Ritchie, n.d.), p. 26, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love, n.d., p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-8710ddaec7" data-kw="">
<blockquote><p>When you feel doubts about being God’s child because you have not shown God that obedience that you owe to him, know that the devil is very near you. He will attempt to falsify the gospel by convincing you that you must be saved by your works. Or he will attempt to seduce you to blaspheme the Lord Jesus by causing you to think that you can be or deserve to be your own savior, at least in part. Respond to this temptation by saying that you are a poor sinner, that Jesus Christ has come to save sinners, and that there is salvation only in him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-taffin.html">Jean Taffin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. James A De Jong, and Peter Y De Jong. Classics of Reformed Spirituality (Grand Rapids: Baker Academic, 2003), 56</span></figcaption>

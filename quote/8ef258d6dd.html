<main class="wrap"><figure class="quote" id="q-8ef258d6dd" data-kw="">
<blockquote><p>3. ‘Tis contrary to the example of the Apostles themselves, and condemns them as well as us, for they did not only teach and commend to the Churches that Reformation which Mr. Dell calls the mortifying or destroying of corruption and lust, or Christ dwelling and living in us, but likewise an external acclesiastical reformation, and several canons concerning the reformation of external abuses and scandals in the Church: as for instance, that the Churches should abstain from blood and things strangled; that two or three at most should prophesy in the Church at one meeting; that the men should pray with their heads uncovered, the women covered; that young widows should be no longer admitted to serve the Church in attending the sick and that such widows must be at least 60 years old, and the like.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Miscellany Questions</cite>, ch. 18, ‘Whether conscionable Christians and such as love the power and practice of piety, can without defiling their conscience…’, pp. 165-66</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fecf99c6a7" data-kw="">
<blockquote><p>The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 12-13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-3e90e17e47" data-kw="">
<blockquote><p>Again, if the unbelieving party shall solicit the other and use all means, both fair and foul, to draw him or her to idolatry, the believing party in this case, may go aside for a time and omit the duty of marriage. For this is all one as if the idolatrous and unbelieving party should depart. For indeed, that party is said to depart in whom the cause of departing is, as in the Church he is a schismatic in whom the cause of the schism is, and not always he that separates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 692</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-80c5de050a" data-kw="">
<blockquote><p>For, though you were contracted before a thousand witnesses and married publicly in the frequentest and most solemn assembly, not by the hand of an ordinary minister, but of a bishop or an archbishop, no rite or ceremony omitted, either the wedding ring, (that Tertullian [c. 155–c. 240 AD] more than once mentions,ª and frees from taint of superstition) or any other: Yet are you no wife, if you do not the duty of a wife; ª Annulus pronubus, Tertullian, On Idiolatry and in Apology. Etiam nunc sponsae annul’ ferreus mittitur, id{que} sine gemma, Pliny, Natural History, bk. 33, ch. 1. Atqui aureus is Tertulliani tempore; prout et nobis nunc dierum.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Good Wife, God’s Gift &amp; a Wife Indeed. Two Marriage Sermons</cite>, (1623), p. 12. Gataker was a Westminster divine.</span></figcaption>

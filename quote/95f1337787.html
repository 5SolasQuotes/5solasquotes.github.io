<blockquote><p>As then we are wont to say in relation of our actions to the laws of God, that some things are forbidden because they are sinful, and some things are sinful because they are forbidden, so it holds also in the laws of men: some things are forbidden because they are justly offensive and some other things are only therefore offensive because they are forbidden;</p></blockquote>

<blockquote><p>5. Where it is said [in the Westminster Confession of Faith], ch. 21, sect. 7, that: ‘by a positive, moral and perpetual commandment, binding all men in all ages, He has particularly appointed one day in seven for a Sabbath,’ I understand it only of a virtual obligation, as much as belongs to the Law, as enacted before promulgation, but not of a true actual obligation. For no law can bind till it is promulgated; and positives are not promulgated by nature; therefore not to all men in all ages; therefore they bind not all men in all ages.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith</cite>, … (London: R.W., 1655), ch. 2, sect. 5</span></figcaption>

</figure><figure class="quote" id="q-72c5a026dc" data-kw="">
<blockquote><p>Did the Lord by Moses give to the Jews as a body politic sundry judicial laws which expired with their state? Yes. Do they oblige any other now, further than the general equity thereof may require? No (Ex. 21; 22:1-29; Gen. 49:10; 1 Cor. 9:8-10; 1 Pet. 2:13-14; Mt. 5:17,38-39). Well then, do not some err, though otherwise orthodox, who maintain that the whole judicial law of the Jews is yet alive and binding all of us who are Christian gentiles? Yes. By what reasons are they confuted?

1. Because the judicial law was delivered by Moses to the Israelites to be observed, as to a body politic (Ex. 21).

2. Because this law, in many things which are of particular right, was accommodated to the commonwealth of the Jews, and not to other nations also (Ex. 22:3; 21:2; Lev. 25:2-3; Dt. 24:1-3; 25:5-7).

3. Because, in other things which are not of particular right, it is neither from the law of nature obliging by reason; neither is it pressed upon believers under the gospel to be observed.

4. Because believers are appointed under the gospel to obey the civil law and commands of those under whose government they live, providing they be just, and that for conscience’ sake (Rom. 13:1; 1 Pet. 2:13-14; Titus 3:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth’s Victory Over Error: a Commentary on the Westminster Confession of Faith</cite>, ch. 19, question 4 (the first commentary defending the Westminster Confession)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-c3844dc234" data-kw="">
<blockquote><p>Hence that is a fiduciary power, or a power of trust, wherein the thing put in trust is not either his own proper heritage or gift, so as he may dispose of it as he pleases, as men dispose of their goods or heritage. But the king may not dispose of men as men, as he pleases; nor of laws as he pleases; nor of governing men, killing or keeping alive, punishing and rewarding, as he pleases… But tbe law is not the king’s own, but given to him in trust.</p></blockquote>

<blockquote><p>2. What rulers think good is not a rule for constitutions and for peoples obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command…

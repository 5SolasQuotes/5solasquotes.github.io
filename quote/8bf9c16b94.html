</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a52135c6d4" data-kw="">
<blockquote><p>9. Though we must not by profession, word or subscription own the sin of any Church, we must [in some circumstances] join in their communion in the worship of God, with those whose worship is mixed with sin in matter and manner, so it be not sin that is by its evil predominant against the good of the duty, to make the work rejected of God (like poison in our food, which makes the hurt greater than the good), because else we must neither worship God ourselves [because of our own impurities], nor join with any in the world: all the works of sinful men being mixed with sin. To deny this, is virtually to separate from all the Christian world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Must not own Sin, Yet must Join with Others with Mixed Worship</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-9f35839d58" data-kw="">
<blockquote><p>In Queen Elizabeth’s days [1558-1603] the Bishop’s Translation of the Bible and that called “the Old one,” being faulty, were only in use. King James procured a better [translation in 1611, the KJV], but the [Anglican] Liturgy still retained the Old one. Suppose a law were made [in the 1630’s] that only the Old faulty translation be used; many refuse it and suffer for it; the [largely puritan] Parliament comes [in the 1640’s] and establishes the New Translation, and swears all men [in the Solemn League &amp; Covenant, 1643] to promote it as a part of reformation; we are in possession of it for sixteen years: then a law is made [in 1662] that all shall go to prison that use any but the Old; two thousand [ministers] break this law and use the New, and suffer part of the penalty [in the Great Ejection of 1662], and shift from the rest as long as they can. At last the State is resolved to suffer them no longer [in the following two decades], but in prison they shall lie: Hereupon many suffer imprisonment; many die there. Some few in London keep up secret worship with the New Translation and others go to the Churches where the Old is used. In the countries there is not past one minister in twelve or twenty miles that keeps up a meeting in the use of the New one. The few that yet do say that to use the Old one, or join with such as do, is covenant-breaking and false worship, and unlawful, and a going back from reformation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity</cite>, Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | A Real Parable</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-888b69ded3" data-kw="">
<blockquote><p>We do not say (for our parts) that all praying upon a book or instituted forms is but cold prayer, because God may pardon the ignorance of his people and accept the sincerity of their hearts, help them with some spiritual affections, even in such prayers…</p></blockquote>

</figure><figure class="quote" id="q-ebd8e798d0" data-kw="">
<blockquote><p>For excepting imperfections, wants, spots, blemishes and faults, which destroy not the true worship of God, our Church does worship the Lord aright, without heresy, blasphemy or idolatry… He that will have it to be no true worship of God in which there be errors and spots holds the heresy of perfection, which is very foul and detestable: for it is as far beyond our power to be perfect in God’s worship as to perform perfect obedience in the Second Table of the Law.</p></blockquote>

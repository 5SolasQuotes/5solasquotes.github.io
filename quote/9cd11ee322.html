<blockquote><p>4. Since all of both sides [Reformed and Romanist] allow that forgiveness of sins belongs to the formal cause of our justification, let us now discuss the imputation of the justice of Christ, and whether by that also we are formally justified. … 6. Christ merited for us by everything which He did or suffered on earth; for all infinitely pleased God the Father, and were of immeasureable and inexhaustible merit, because of the hypostatic union of the Divine Person, for He worked human works in a divine manner, as testify S. Dionysius the Areopagite and S. John Damascene. But amongst all that Christ did and suffered, undertaken for us, his death, with the passion immediately preceding it, has chiefly and most especially merited to us justification; for in it the obedience of Christ to the Father, and his love to the human race, shone forth in a wonderful manner, and his whole obedience was therein consummated, as the apostle clearly teaches. This is testified by innumerable passages of Scripture and the Fathers, and moreover, in this all Protestants and Romanists agree…</p></blockquote>

0of%20both%20sides%20%5BReformed%20and&amp;text=moreover%2C%20in%20this%20all%20Protestants%20and%20Romanists%20agree" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7011f9b00" data-kw="">
<blockquote><p>We are today accepted in the Beloved, today absolved from sin, today acquitted at the bar of God… We are now pardoned; even now are our sins put away; even now we stand in the sight of God accepted, as though we had never been guilty. “There is therefore now no condemnation to them which are in Christ Jesus.” There is not a sin in the Book of God, even now, against one of His people. Who dares to lay anything to their charge? There is neither speck, nor spot, nor wrinkle, nor any such thing remaining upon any one believer in the matter of justification in the sight of the Judge of all the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Morning and Evening</cite>, Morning, May 15</span></figcaption>

</figure><figure class="quote" id="q-e06d74f326" data-kw="">
<blockquote><p>Our justification means not only that our sins are forgiven and that we have been declared to be righteous by God Himself, not merely that we were righteous at the moment when we believed, but permanently righteous. For justification means this also, that we are given by God the positive righteousness of His own Son, the Lord Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/d-martyn-lloyd-jones.html">D. Martyn Lloyd-Jones</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Depression – Its Causes and its Cures</cite>, p. 74</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-as-a-one-time-act.html">Justification as a one-time act</a></span></div>

— D. Martyn Lloyd-Jones, Spiritual Depression – Its Causes and its Cures, p. 74">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COur+justification+means+not+only+that+our+sins+are+forgiven+and+that+we+have+been+declared+to+be+righteous+by+God+Himself%2C+not+merely+that+we+were+righteous+at+the+moment+when+we+believed%2C+but+permanently+righteous.+For+justification+means+this+also%2C+that+we+are+given+by+God+the+positive+righteousness+of+His+own+Son%2C+the+Lord+Jesus+Christ.%E2%80%9D%0A%0A%E2%80%94+D.+Martyn+Lloyd-Jones%2C+Spiritual+Depression+%E2%80%93+Its+Causes+and+its+Cures%2C+p.+74&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe06d74f326.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e06d74f326.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7d4de1144d" data-kw="">
<blockquote><p>…I shall manifest: (1) That they have not the same scope, design or end in their discourses; That they do not consider the same question, nor state the same case, nor determine on the same inquiry, and therefore not speaking ad idem, ‘unto the same thing,’ do not contradict one another. (2) That as faith is a word of various signification in the Scripture… they speak not of the same faith, or faith of the same kind… (3) That they do not speak of justification in the same sense, nor with respect unto the same ends. (4) That as unto works they both intend the same, namely, the works of obedience unto the moral Law. …As to the scope and design of the apostle Paul… is to declare how a guilty, convinced sinner comes through faith in the blood of Christ to have all his sins pardoned, to be accepted with God and obtain a right unto the heavenly inheritance, that is, be acquitted and justified in the sight of God… The apostle James on the other hand had no such scope or design… But he had in hand a business quite of another nature… there were many in those days who professed the Christian religion or faith in the Gospel, whereon they presumed that as they were already justified, so that there was nothing more needful unto them that they might be saved. A desirable estate they thought they had attained, suited unto all the interest of the flesh, whereby they might live in sin and neglect of all duty of obedience, and yet be eternally saved… Against this sort of persons, or for their conviction, he designs two things: (1) In general to prove the necessity of works unto all that profess the gospel or faith in Christ thereby; (2) To evidence the vanity and folly of their pretense unto justification, or that they were justified and should be saved by that faith that was indeed so far from being fruitful in good works, as that it was pretended by them only to countenance themselves in sin. Unto these ends are all his arguings designed and no other. He proves effectually that the faith which is wholly barren and fruitless as unto obedience, and which men pretended to countenance themselves in their sins, is not that faith whereby we are justified and whereby we may be saved, but a dead carcass, of no use nor benefit, as he declares by the conclusion of his whole dispute in the last verse of the chapter. He does not direct any how they may be justified before God, but convinces some that they are not justified by trusting unto such a dead faith, and declares the only way whereby any man may really evidence and manifest that he is so justified indeed. This design of his is so plain, as nothing can be more evident…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 20, ‘The Doctrine of the Apostle James concerning Faith &amp; Works, its Agreement with that of St. Paul’ in The Doctrine of Justification by Faith in Works (†1683; Johnstone &amp; Hunter, 1850), 5.384-400, pp. 387-89</span></figcaption>

</figure><figure class="quote" id="q-9def8be007" data-kw="">
<blockquote><p>To be justified means more than to be declared “not guilty.” It actually means to be declared righteous before God. It means God has imputed or charged the guilt of our sin to His Son, Jesus Christ, and has imputed or credited Christ’s righteousness to us.</p></blockquote>

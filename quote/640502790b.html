<main class="wrap"><figure class="quote" id="q-640502790b" data-kw="">
<blockquote><p>The passing of sentence will take place after the trial of the cause; first, the sentence of acquittal, then that of condemnation; the Judge will begin with the former, to show that he is more willing to pardon than to punish; and to the greater joy of the faithful, and to the greater sorrow of the wicked. It might appear strange to some, that Christ, in describing the kind of judgment which he will exercise at the last day, does not mention any works, except works of mercy towards himself, whereas neither the performance of them can be ascribed to, nor the neglect of them be charged upon, vast numbers of persons who have never heard of Christ; but it has been justly observed, that these are only brought forward by Christ by way of specimen or example, as some good works out of many. There is a question also raised, as to whether the sins of the righteous, as well as of the wicked, will be brought forth to view? We do not think they will; first, because, if they were, it would turn to the confusion of the righteous, who are surely not then to be confounded: again, because the free mercy of Christ will not remember the offences of believers; nor is it likely, that Christ will reproach his own members with their iniquities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology, trans. Frederick Reyroux (Philadelphia: Presbyterian Board of Publication, n.d.), 358.</cite></span></figcaption>

<blockquote><p>Against claims that John Calvin repudiated the beatific vision and teleological virtue ethics, this article demonstrates the importance of the visio Dei by examining sections of Calvin’s exegesis and several important sermons. To explicate how such a teleology impacts the Christian’s relation to ‘lower goods’, it then explores Augustine’s theology of created being. Together these conversations contribute to an explanation of Calvin’s view of Christian moral life now through growth in virtue and in relation to the hope of seeing or contemplating God.</p></blockquote>

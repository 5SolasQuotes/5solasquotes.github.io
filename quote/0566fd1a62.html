</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57765b3c9f" data-kw="">
<blockquote><p>The sufficiency of the Bible means its sole sufficiency. It is sufficient to achieve the purposes of redemptive revelation without supplementation by new revelations (claimed by some Anabaptists and others) or traditions of men (like those extra-biblical traditions claimed by the Roman Catholic church). It is this and no other view of the sufficiency of the Scriptures which must now be demonstrated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-e-waldron.html">Samuel E. Waldron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Modern Exposition of the 1689 Baptist Confession of Faith</cite>, ch. 1, p. 53</span></figcaption>

</figure><figure class="quote" id="q-1ae5a421f4" data-kw="Rule of faith">
<blockquote><p>For unless scripture be a whole and perfect rule, it cannot be a rule at all; because there ought to be the exactest agreement between the rule and the thing to which it is applied. If, therefore, our faith be longer or broader than the scripture, then the scripture is not its rule; because a rule should be adequate to the thing measured by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 6, ch. 16</span></figcaption>

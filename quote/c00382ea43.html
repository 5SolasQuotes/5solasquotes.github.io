<blockquote><p>14th Objection: They object: To be present at a mass is to countenance an idol worship; so to be present in a church worship where there is any error in the worship is to countenance the error. For what worship we countenance to that we say, ‘Amen,’ and so we must consent to the wrong constitution of a church where are profane people? Answer: To countenance a worship professedly idolatrous, where the name of the worship imports the worshipping of a false god, is unlawful, for others do interpret our presence [as] a joint worshipping with them. But our presence at every lawful worship that is acknowledged lawful, does not give so much as interpretatively signification of our consent to every particular in the worship, because hearing, discerning, choosing or refusing, believing or not believing, according as you find the points agreeable to God’s Word, or dissonant therefrom, intervenes between your presence at the worship, and your consent to the worship. Now the act of consenting, approving and receiving the point of worship is formally to partake of the worship, else we could not obey the precept (1 Thess. 5:21) ‘Try all things.’ Some things in the preacher are to be borne with; The preachers of the Separation have not an apostolic and infallible spirit; if any of them preach unsound doctrine, the presence of the hearers does not involve them in the guilt of the preacher’s erroneous worship. The Pharisees corrupting of the Law was known and rebuked by Christ, but yet Christ forbade Separation. ‘Hear them’ (Matt. 23) ‘they sit in Moses’ chair.’</p></blockquote>

<blockquote><p>14. God has by nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances or accidents of this universal religion which are not themselves meet for an universal and unchangeable obligation, but [for] local, temporary and mutable [circumstances and obligations]: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin. I have often named many particulars, as: The translation of the Scripture, which to choose: the version of the Psalms in rhyme or meter, the common use of new made hymns,¹ the dividing the Scripture into chapter and verse, the words of sermons, their method, the particular text to be chosen, what chapters to read, at what hour to begin, how long to preach, in what words to pray, whether the same oft or changed, whether forestudied or not, whether written or unwritten, whether studied and written by ourselves or by others, where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? ¹ [Elsewhere Baxter speaks of, “the choice of psalms and hymns: the use of David’s are lawful and so are others: but no institution ties us to one, but leaves us to choose.” Schism Detected in Both Extremes (1684), pt. 2, pp. 5-6. This is plainly false: Ex. 15:20-21; 2 Sam. 23:1; 1 Chron. 25:1-7; 2 Chron. 29:25-30; Neh. 12:45-46; Ps. 95:2; etc. See ‘Singing of Psalms’.] Whether we be bareheaded or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit or be prostrate at prayer, etc. What distinctive garments pastors shall use, by what signs of consent and obligation men vow and swear, whether by putting the hand under the thigh [Gen. 24:2, 9; 47:29], lifting it up [Gen. 14:22; Dt. 32:40], subscribing, laying it on the Book,² kissing the Book,³ etc. What catechisms to use, with many more such. ² [See ‘On Laying One’s Hand on the Bible to Swear’.] ³ [See ‘On Trembling at the Word, Weeping before the Bible, Kissing the Stake, etc.’] God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc. 15. These [things] may be called ‘worship’ in a sense subservient to God’s ordinances of worship¹ (as we worship men by putting off the hat, kneeling, bowing [Mt. 18:26; Lk. 14:10; Rev. 3:9], etc.). But if any will not call it ‘worship’, they must [then] not call it ‘false worship’, nor pretend that the controversy is any more than about the bare name. ¹ [For an explanation of this, see pp. 73-84 of Travis Fentiman, 1 Corinthians – Head-Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022).] 16. They that feign such things as these to be sinful additions and an invading of Christ’s office and denying his faithfulness, etc. condemn the Scripture that commands such determinations, and contradict the Law of Nature and the practice of all Churches on earth, and would exterminate all God’s worship, which cannot be performed without some such determinations.</p></blockquote>

<blockquote><p>…it is too evident that many and great corruptions are to our sin and shame retained… but yet they are extrinsic and not of the substance of God’s worship, which for matter, and essential form, remains entire and properly his own (though not so acceptable) under, as well as without them; and will not therefore warrant my separation, or non-communion so far as to lie at home, or loiter in the churchyard, until the Common-Prayer (whereby God is truly, though not orderly, invocated and worshipped; wherein I, as a member of that Church, am interested, and unto which, as it is public, solemn prayer, though in an unsuitable method, my ‘Amen’ is an indispensable duty) being ended.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…it is too evident that many and great corruptions are to our sin and shame retained… but yet they are extrinsic and not of the substance of God’s worship, which for matter, and essential form, remains entire and properly his own (though not so acceptable) under, as well as without them; and will not therefore warrant my separation, or non-communion so far as to lie at home, or loiter in the churchyard, until the Common-Prayer (whereby God is truly, though not orderly, invocated and worshipped; wherein I, as a member of that Church, am interested, and unto which, as it is public, solemn prayer, though in an unsuitable method, my ‘Amen’ is an indispensable duty) being ended.”

— Zachary Crofton, Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662), pp. 23-24 Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6it+is+too+evident+that+many+and+great+corruptions+are+to+our+sin+and+shame+retained%E2%80%A6+but+yet+they+are+extrinsic+and+not+of+the+substance+of+God%E2%80%99s+worship%2C+which+for+matter%2C+and+essential+form%2C+remains+entire+and+properly+his+own+%28though+not+so+acceptable%29+under%2C+as+well+as+without+them%3B+and+will+not+therefore+warrant+my+separation%2C+or+non-communion+so+far+as+to+lie+at+home%2C+or+loiter+in+the+churchyard%2C+until+the+Common-Prayer+%28whereby+God+is+truly%2C+though+not+orderly%2C+invocated+and+worshipped%3B+wherein+I%2C+as+a+member+of+that+Church%2C+am+interested%2C+and+unto+which%2C+as+it+is+public%2C+solemn+prayer%2C+though+in+an+unsuitable+method%2C+my+%E2%80%98Amen%E2%80%99+is+an+indispensable+duty%29+being+ended.%E2%80%9D%0A%0A%E2%80%94+Zachary+Crofton%2C+Reformation%2C+Not+Separation%2C+or%2C+Mr.+Crofton%E2%80%99s+Plea+for+Communion+with+the+Church%E2%80%A6+in+a+Letter%2C+written+July+20%2C+1661%E2%80%A6+%281662%29%2C+pp.+23-24+Crofton+%281626-1672%29+was+a+presbyterian+and+puritan+born+and+raised+in+Ireland.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4d5f7f00bd.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4d5f7f00bd.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=it%20is%20too%20evident%20that%20many,is%20an%20indispensable%20duty%29%20being%20ended&amp;text=it%20is%20too%20evident%20that%20many%20and%20great&amp;text=my%20%E2%80%98Amen%E2%80%99%20is%20an%20indispensable%20duty%29%20being%20ended" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-374878614f" data-kw="">
<blockquote><p>About receiving the Lord’s Supper with inconvenient ceremonies and persons in differing doctrine: Peter Martyr, when he came into England first, and the opinion of the corporal presence of Christ in the Lord’s Supper was in force, and when the ministers, albeit differing from him in judgment, yet did not refuse to admit him with open confession of [the] contrary judgment, he joined with them and received the Lord’s Supper, Non obstantibus illorum ceremonijs sibilicet ipsi molestis, ‘notwithstanding the ceremonies, though very much troubling him.’ This counsel did P. Martyr give to [Zachary] Ursinus and to other Christians in Germany; Ursinus, Exercitat., lib 2, fol. 840.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, p. 162</span></figcaption>

</figure><figure class="quote" id="q-dc45fd21f5" data-kw="">
<blockquote><p>XXI… Rulers have authority to command that which is good, though not in a faulty manner; and when we cannot do the good without the faulty manner, it is their fault and not ours: e.g. If an inconvenient time, place, text, tune, etc. be chosen, the union and concord which is held by agreeing in those modes is necessary: He that will not join in them cannot join in the worship. So that we obey the ruler or guide as a determiner of the means of concord, which is necessary, and not sub ratione erroris [under the rule of the error], [we do not obey and perform the action formally] as misdetermining, though [we do the action] in that which is [materially] misdetermined…º And it’s to us a lawful circumstance, because [it is] necessary to concord and [is] commanded, though mistakingly. XXII. We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us. … XXIV. We never judged needless affected singularity a duty, but judge it best in lawful things for concord’s sake to conform to the custom of the Churches where we live or come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (London, 1689), ch. 2, pp. 11-16</span></figcaption>

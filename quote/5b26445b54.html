<main class="wrap"><figure class="quote" id="q-5b26445b54" data-kw="">
<blockquote><p>In the holy Church there cannot be bad people without the good, and good people without the bad. For as long as we live here below, we must walk the path of this present age intermingled. But we are distinguished when we reach the next life. Now the good are never alone except in heaven and the bad are never alone except in hell. But just as this life, which lies between heaven and hell, is accessible to all, so too it admits citizens from both regions alike. Though the holy Church now receives them both indiscriminately, afterward she will make distinctions between them as they exit from this life.

And so, if you are good, for as long as you abide in this life, calmly bear with the bad. For anyone who does not bear with the bad through a lack of forbearance testifies against himself that he is not good. The one whom a Cain does not vex with wickedness refuses to be an Abel. Just as on threshing floors grains are pressed under the chaff, so too do flowers rise among thorns and a fragrant rose grows when a thorn pricks it.

Now the first man had two sons: one of these was elect, the other was reprobate. Noah’s ark held three of his sons: while two were steadfast in their humility, one was quick to mock his father. Abraham had two sons: one was innocent but the other was the persecutor of his brother. Isaac had two sons: one served in humility but the other was reprobate even before he was born. Jacob had twelve sons: one of them was sold on account of his innocence but the others sold their brother on account of their wickedness. Twelve Apostles were elected but one of them became involved with the reprobate in order to put the others to the test, persecuting them lest they remain untested. There were seven deacons ordained by the Apostles: six were steadfast in correct faith but one arose as an originator of error.

And so, dear brothers, reflect upon these past times and strengthen yourselves to bear with mean people. For if we are the sons of the elect, their examples teach us how we ought to progress. After all, none of them was good if he refused to bear with the bad. It is not very praiseworthy if someone is good with the good, but rather if someone is good with the bad. Just as not being good among the bad is a serious fault, so too does being good even among the bad deserve boundless commendation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Excerpts from the Books of Blessed Gregory on the Song of Songs. Compiled by William of Saint Thierry</cite>, (1692) in Gregory the Great on the Song of Songs (594-98), trans. Mark DelCogliano (Collegeville MN: Liturgical Press, 2012), pp 191-92.</span></figcaption>

<blockquote><p>I have said that I would fain regard it as a presumption that you have chosen the ministry from the right motives, and are resolved to prosecute your studies in a right spirit, that you have cast in your lot with the Free Church of Scotland; but I must warn you against imagining that this circumstance, or indeed anything that is external and applies to men in the mass, can afford any sufficient ground for establishing the soundness of your principles or the purity of your motives. The deceitfulness of sin, and the deceitfulness of men’s hearts, are continually at work, leading men to think more highly of themselves than they ought to think.

Satan is continually exerting his utmost skill and activity to introduce into the ministry of the professing church men who will be in reality his servants and not the servants of Christ. He knows well that nothing tends so much to the advancement of his cause as an unconverted ministry. He will not fail to direct his efforts in this respect against the Free Church of Scotland, and we can scarcely cherish the hope that he will be altogether unsuccessful. There are some obvious advantages of which he will not fail to avail himself.

There are some views and considerations which may induce men to join the Free Church of Scotland, of a more creditable and elevated kind than worldliness or selfishness in their proper forms, but which yet may be entirely separated from that fear of God which is the beginning of wisdom, from real godliness of heart and motive, from real love to the Saviour and regard to his honour. There cannot be a reasonable doubt that the principles for which the Free Church of Scotland has been called upon to testify and to suffer are in substance the same for which our forefathers laid down their lives, and are thus associated with circumstances and transactions which have always had a strong hold upon the hearts and feelings of Scottish Presbyterians, and which must appeal most powerfully to every patriotic and generous mind.

Although, then, your preferring the Free Church may prove that you have triumphed over selfishness in some of its lower and grosser forms, and have subordinated them to some of the higher and nobler principles of our nature, it is still quite a possible thing that you may be deceiving yourselves as to your motives in entering upon the study of theology with a view to the office of the ministry, and in doing so in the circumstances in which you have placed yourselves.

And I have adverted to this subject for the purpose of warning you that you should not trust to mere presumptions and probabilities in judging of the state of your hearts, and the motives by which you are animated, but that, fully alive to the dangers of self-deceit, you search and try your ways, see that you have really devoted yourselves to Christ’s service, and are now ready and willing to do whatever may be best fitted to prepare you for usefulness in his vineyard; to exert yourselves and to deny yourselves, that you may acquire all that knowledge, and form all those habits, which may prepare you for usefulness and respectability in the ministry; animated and encouraged amid all your studies and all your labours by a growing regard to the glory of God, by increasing love to the Lord Jesus Christ, and to the souls of perishing men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, ed. Thomas Smith (New York: Robert Carter and Brothers, 1878), Lecture I, pp 18-19.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-7d48192352" data-kw="">
<blockquote><p>1. We have learned from none others the plan of our salvation, than from those through whom the Gospel has come down to us, which they did at one time proclaim in public, and, at a later period, by the will of God, handed down to us in the Scriptures, to be the ground and pillar of our faith. …

2. These have all declared to us that there is one God, Creator of heaven and earth, announced by the law and the prophets; and one Christ the Son of God. If any one do not agree to these truths, he despises the companions of the Lord; nay more, he despises Christ Himself the Lord; yea, he despises the Father also, and stands self-condemned, resisting and opposing his own salvation, as is the case with all heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, (c. 175-85), 3.1.1 in Ante-Nicene Fathers, 1: 414-15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ae5a421f4" data-kw="Rule of faith">
<blockquote><p>For unless scripture be a whole and perfect rule, it cannot be a rule at all; because there ought to be the exactest agreement between the rule and the thing to which it is applied. If, therefore, our faith be longer or broader than the scripture, then the scripture is not its rule; because a rule should be adequate to the thing measured by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 6, ch. 16</span></figcaption>

</figure><figure class="quote" id="q-38e6700b84" data-kw="">
<blockquote><p>For it is to be held undoubtingly, as we shall hereafter prove most largely, that the revealed and written word of God is the sole rule of faith, which is a thing prior to the faith of the church. … If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone.</p></blockquote>

</figure><figure class="quote" id="q-44b4dcf481" data-kw="">
<blockquote><p>If the consequence is truly able to be proved according to natural light, then it may yet be proved from the Word of God because the light of reason is contained in the Word of God as a part is in the whole, and so to this extent the Word of God will prove the consequence. If truly the consequence is proved through natural reason which is not in the Word of God, we desire to hear such an invincible demonstration!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, tr. Charles Johnson &amp; Travis Fentiman (1639-1642; 1668; RBO, 2019), ch. 1, section 17, p. 47</span></figcaption>

</figure><figure class="quote" id="q-93e36ab959" data-kw="">
<blockquote><p>If the Scriptures be what they claim to be, the word of God, they are the work of one mind, and that mind divine. From this it follows that Scripture cannot contradict Scripture. God cannot teach in one place anything which is inconsistent with what He teaches in another. Hence Scripture must explain Scripture. If a passage admits of different interpretations, that only can be the true one which agrees with what the Bible teaches elsewhere on the same subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §6</span></figcaption>

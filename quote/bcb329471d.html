<main class="wrap"><figure class="quote" id="q-bcb329471d" data-kw="">
<blockquote><p>The two records of it are held to be inconsistent with and exclusive of each other.

Schleiermacher holds that each of them is credible in some particulars, while in others each of them contains matter which cannot be received as fact. In point of style, Matthew’s narrative is the most naked prose; Luke’s is for the most part poetry, with prosaic bits, which are probably from a different: hand. Luke finds both parents resident at Nazareth, their presence at Bethlehem being but accidental: Matthew knows nothing of a family residence at Nazareth; with him their proper place of residence is Bethlehem, where they would have settled as a matter of course on their return with the Child from Egypt, but for a divine warning not to do so, but to go to Galilee, and dwell at Nazareth. Leaving his readers to choose between these contradictions, for himself he is disposed to think there is a basis of truth in Matthew’s unadorned prose; whereas Luke’s story is such a mixture of prose and poetry—of probable fact and too probable fable—that we cannot accept it.

Strauss, and after him Keim, hold that since Luke places the angelic visit to Mary before the Conception, while in Matthew the same angel appears, not to Mary, but to Joseph, and not before, but after, the Conception, therefore the two accounts are irreconcilable. Never, I venture to say, was more frivolous objection to the consistency of any Biblical narrative advanced. Yet Meyer, I regret to say, endorses it. In Germany such things may be accounted formidable objections, but in this country I do not believe there is one critic, of any name for impartiality and grasp, who sees, or even imagines, any discrepancy between the two records. Who that is not seeking some pretext for getting rid of the stupendous fact would find any inconsistency between a divine announcement to the Virgin Mary, to prepare her for what had never occurred in the history of human births before, and a subsequent visit to Joseph, to set his troubled mind at rest as to the condition of his betrothed, and assure him that there was no bar to the honourable connection to which he was looking forward?

Before passing from this objection, let us notice in a word or two the poetry which Schleiermacher finds in Luke’s narrative. With what different eyes do some read those words of the evangelist where doubtless the poetry is supposed to lie!— “The Holy Ghost shall come upon thee, and the power of the most High shall overshadow thee.” For myself, I have always been at a loss to say whether the sublimity of them or their exquisite delicacy is the more to be wondered at. Calvin, I observe, was struck with the same features of them; and I cannot conceive how any reader, whose taste in the phraseology of sacred things has been cast in a Biblical mold, can fail to participate in this feeling. With Schleiermacher it is all poetry; but I am persuaded that the tastes and instincts of every healthy critic, as well as private Christian, in this country, will leave the poetical view of this narrative to those who can bring themselves to surrender the fact which it expresses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-brown.html">David Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Miraculous Conception of our Lord Jesus Christ: its Truth and Place in New Testament Christianity in British and Foreign Evangelical Review</cite></span></figcaption>

<blockquote><p>Humiliation is that base, and voluntary condition of Christ, God-man upon earth; whereby he debased himself, as touching both Natures, that he might both die, and by dying satisfy: as touching his Divine Nature, he debased himself, both by a voluntary subjection of his Person, and by a hiding of his glory, and majesty before men, for the time: as touching his Human Nature, both by taking unto him the Infirmity of our Nature; and secondly, by his most humble Obedience of Life, and Death.

Exaltation is the condition of Christ, God-man, whereby he was advanced into the glory and dignity, which was meet, or convenient for the person of a Mediator, and that according to both natures; according to the divine nature by relation, or by a divine manifestation of that majesty which he hid, during the time of his abasement; according to the human; partly, by the deposition of his servile condition, and partly by the receiving gifts, in body &amp; in soul, concurring together unto the perfection and blessedness of his human nature, above all nature.

Of both states, there are proper degrees, opposite one to the other. Of Humiliation; and first of that which is outward, or of his Submission unto death, there are three degrees: death, with the curse conjoined: Burial, that the truth of his death might be ratified: Descent into Hell, or that voluntary debasement of Christ to suffer, and as it were, with wrestling, to overcome the pains of Hell, which Christ chiefly felt in his soul, when he was assaulted; first with heaviness, afterwards with the sorrows of both deaths.

To these are opposed three degrees of Exaltation: Resurrection, in which by divine power, having subdued death, he raised up himself unto life everlasting: Ascension, whereby, through the same power, he verily and visibly translated his body into the Heaven of the blessed sitting at the right hand of the Father, whereby Christ was actually endued with all fullness, both of glory, and power.</p></blockquote>

<blockquote><p>Consider the odious filthiness of sin, the pertinacious adherence thereof unto thy nature; so that nothing but the incarnation and blood of the Son of God, the creator of the world, could wash it out. Consider the justice, and indispensable severity of our God against sin, which would not spare the life of his own Son, nor be satisfied without a sacrifice of infinite and co-equal virtue with itself.

Consider that it was thy sins, which were the associates with Judas, and Pilate, and the Jews, to crucify him: it was thy hypocrisy which was the kiss, that betrayed him; thy covetousness the thorns, that crowned him; thy oppression and cruelty the nails and spears, that pierced him; thy idolatry and superstition the knee, that mocked him; thy contempt of religion the spittle, that defiled him; thy anger and bitterness the gall and vinegar, that distasted him; thy crimson and redoubled sins the purple that dishonoured him: in a word, thou wert the Jew that killed him.

Canst thou, then, have so many members, as weapons, wherewith to crucify thy Saviour, and hast thou not a heart wherein to recognise, and a tongue wherewith to celebrate, the benefits of that blood which thy sins had poured out? The fire is quenched by that water, which by its heat was caused to run over; and shall not any of thy sins be put out by the overflowing of that precious blood, which thy sins caused to run out of his sacred body?</p></blockquote>

ers+%286+vols%2C+London%2C+1826%29%2C+iii%2C+107-08.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe63b4b4bbb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e63b4b4bbb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/01/02/edward-reynolds-our-sins-crucified-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Was the soul of Christ, after its separation from the body, translated to paradise immediately? Or did it descend locally to hell? The former we affirm; the latter we deny against the papists and Lutherans. The papists maintain that the soul of Christ really and by presence descended into hell and remained there just as long as his body was in the sepulchre, for the purpose of freeing the souls of the fathers of the Old Testament detained in limbo. We reject a local descent.</p></blockquote>

<blockquote><p>This is commonly held to be twofold: the one of emptying and humiliation; the other of exaltation and majesty; of suffering and of glory; of battle and of triumph; of the way and of the goal; of death and of life. The following demonstrate the verity of both. (1) The oracles of the Old Testament in which he is foretold. In Ps. 8 mention is made of his being made a little lower than the angels (which is the emptying) and of his being crowned with glory and honor (which is the exaltation). In Ps. 110:7, it is said of the Messiah, “He shall drink of the brook in the way; therefore shall he lift up the head.”</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a1d616dcca" data-kw="">
<blockquote><p>Lawyer: But you did not answer [the verse], ‘from such turn away, and with such not to eat, etc.’ Minister: The answer is obvious:

1. It is the duty of the Church to cast out wicked impenitent men; and this Christ commands them; but He never bids particular Christians to separate from the Church where some such are because the Church omits its duty: For then you should separate from duty, from God’s worship and holy communion on pretence of separating from sinners.

2. But for family and private converse, every Christian is judge himself, and must refuse all familiarity with scandalous Christians which encourages them in sin or seems to own it. God commands no man to do that which is not in his power; to put a scandalous impenitent man from the Church, is in the Church’s power, and so that command belongs to them; it is not in your power, and therefore belongs not to you save to admonish men and tell the Church; but to put men from your table and familiarity is in your power and belongs to you. Suppose the king write to the city of London to put all rebels out of their company and converse; it’s easy to understand that every one must do it only in his own place. Every single man cannot turn such out of the common-council: The city rulers must do that, and till it be done, single men may not deny obedience to the governours: But all may turn them out of their houses, shops and familiarity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, pp. 231-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cd9083cc8d" data-kw="">
<blockquote><p>Auxilius, a fresh young Bishop, having excommunicated a person of good account with his whole family for infringing the liberties of his Church, as he supposed, saint Augustine treats with him by letters to know what ground he had out of the Scriptures to excommunicate the son for the father’s, the wife for the husband’s, the servants for their master’s offense; and amongst others uses these words (Augustine Epistle 75): ‘Lo, I am ready to learn, an old man of a young, a bishop of so long continuance, from my colleague, not yet a year’s standing: what good reason we may yield to God or to men, if for another man’s sin we endanger innocent souls with a spiritual punishment. If you can give a reason for it, vouchsafe by writing to acquaint me with it, that I may be able likewise; if you cannot, what is it for you to do (such a thing) upon an unadvised motion of the mind, whereof being asked, you are not able to yield a just reason? Neither think that uniust anger cannot overtake us, because we are bishops; but let us rather remember we live dangerously amidst the snares of temptations, because we are men.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-bilson.html">Thomas Bilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetual Government of Christ’s Church</cite>, (London, 1593), ch. 9, p. 121</span></figcaption>

<blockquote><p>5. All our divines, standing for the certainty of the perseverance of the regenerated, answer Papists and Arminians alleging for the apostasy of the saints, the example of the regenerated who may be excommunicated, that excommunication does never evince [prove] that the person excommunicated is out of the state of grace, but only that he has fallen into a scandalous external fact, which deserves that he should be delivered to Satan; and that one may be a member [in some way] of the visible Church and converted to God, who is excommunicated.</p></blockquote>

<blockquote><p>4. …it is sure [that] baptism in fieri, as it is administrate[d] and professed, is the means of the excommunicate[d] man’s solemn installing and engaging to be a follower of Christ: and by the scandal that brings on excommunication, baptism as professed and as binding is so far hurt as the Covenant-baptismal is violated: and if the man be excommunicate[d] for apostasy, then it is disputable whether baptism be not quite undone.</p></blockquote>

</figure><figure class="quote" id="q-8a69526e11" data-kw="">
<blockquote><p>That this covenant is not dissolved without the consent of this Church. Distinguish here direct dissolution from indirect, or that which consequently accompanies something else. The former is when someone decides to migrate elsewhere of his own accord; cessation of actual and explicit communion with and in that particular Church follows migration. Here, a free person is subject to the judgment of no Church; nor do the Bin and Luc. 12, D. 14, 14, which pertain directly to the Church. Unless someone extends ecclesiastical unity and power with the Pontificals to all secular matters, in order, as they say, to spiritual matters. … Furthermore, another departure is different from renunciation and separation or division, from exchange: just as one moves from one room to another in the same house, or from house to house in the same city. The former is directly subordinated to the judgment and authority of the Church; the latter is not at all. For he does not depart from Christ and ecclesiastical communion who migrates from one church to another. But he does depart who through migration forsakes all external communion of the Church or even passes over to sects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, tr. by AI (Amsterdam: Joannes à Waesberge, 1663–1676), vol. 1, ‘The Nature of the Instituted Church’, pp. 62-63 (PDF p. 67)</span></figcaption>

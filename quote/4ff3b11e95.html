<blockquote><p>Nevertheless, it [death as a penalty] is not just any impotence, but a spiritual impotence. For in spiritual death, man retains his natural power of understanding, willing, and operating, though he becomes devoid of spiritual power. Furthermore, it is a spiritual impotence not for every kind of good, natural, civil, and moral, but for spiritual and saving good, good that accompanies salvation (Heb. 6:9), at least that he might do it spiritually (1 Cor. 2:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology (RHB)</cite>, vol. 3, bk. 4; ch. 4, ‘The Penalty &amp; State of Sin’, section 9, p. 526</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b88a5fd30" data-kw="">
<blockquote><p>Some writers, as has been already observed, have allowed that sinners are the subjects of an inability which arises from the depravity; but they still contend that this is not all, but that they are both naturally and morally unable to believe in Christ; and this they think agreeable to the Scriptures, which represent them as both unable and unwilling to come to Him for life. But these two kinds of inability cannot consist with each other, so as both to exist in the same subject and towards the same thing. A moral inability supposes a natural ability. He who never, in any state, was possessed of the power of seeing, cannot be said to shut his eyes against the light. If the Jews had not been possessed of natural powers equal to the knowledge of Christ’s doctrine, there had been no justice in that cutting question and answer, “Why do ye not understand my speech? Because ye cannot hear my word.” [Jn. 8:41] A total physical inability must, of necessity, supersede a moral one. To suppose, therefore, that the phrase, “No man can come to Me,” [Jn. 6:44] is meant to describe the former; and, “Ye will not come to Me that ye may have life,” [Jn. 5:40] the latter; is to suppose that our Savior taught what is self contradictory. Some have supposed that, in attributing physical or natural power to men, we deny their natural depravity. Through the poverty of language, words are obliged to be used in different senses. When we speak of men as by nature depraved, we do not mean to convey the idea of sin being an essential part of human nature, or of the constitution of man: our meaning is that it is not a mere effect of education and example; but is, from his very birth, so interwoven through all his powers, so ingrained, as it were, in his very soul, as to grow up with him, and become natural to him. On the other hand, when the term natural is used as opposed to moral, and applied to the powers of the soul, it is designed to express those faculties which are strictly a part of our nature as men, and which are necessary to our being accountable creatures. By confounding these ideas we may be always disputing, and bring nothing to an issue. … Some have alleged that ‘natural power is only sufficient to perform natural things, and that spiritual power is required to the performance of spiritual things.’ But this statement is far from accurate. Natural power is as necessary to the performance of spiritual as of natural things; we must possess the powers of men in order to perform the duties of good men. And as to spiritual power, or, which is the same thing, a right state of mind, it is not properly a faculty of the soul, but a quality which it possesses; and which, though it be essential to the actual performance of spiritual obedience, yet is not necessary to our being under obligation to perform it.</p></blockquote>

<blockquote><p>XXII. The subject in which it [original sin] resides is not only the lower faculties, namely of sensing and appetition, nor only the superior faculties, namely of understanding and willing, but the whole man, both soul and body, with all their powers. Besides experience, these passages testify: Gen. 6:5; Jer. 17:9; 1 Cor. 2:14; Eph. 4:17-18; Rom. 6:12-13, etc.</p></blockquote>

<blockquote><p>2. Consider upon what terms you may have this God for your God… You give more for your bread, your clothes, your house, for the needful comforts that are for the support of your frail body, than you need give for the great, glorious, incomprehensible, incomparable God. You pay money for them, but you may have Him without money and without price. One would think that the equity of the condition should both amaze you and allure you. Consider, I say, God does not require of you things impossible to you; He does not say, If you will remove mountains, dry up oceans, stop the course of nature, create worlds, I will then be yours, as great as I am; He does not say, If you will satisfy my justice, answer the demands of my law, merit my love and favor, then I will be your God. No; He Himself has done all this for you by the death of his Son; all He desires is, that you would accept Him in his Son for your God. Nay, He does not require of you anything that is barbarous or cruel, as the heathen deities did, by the devil, of their worshippers. He does not say, If you will lance and mangle your bodies, as Baal’s priests did; if you will go barefoot in sackcloth long and tedious pilgrimages, as the papists do; if you will offer your children in the fire, and give the fruit of your bodies for the sins of your souls, as some did, then I will be your God. Again, He does not require of you things that are chargeable, to offer the best and chief of your flock daily in the sacrifice to Him; nor, as He once did of the young man, to sell all that you have, and give it to the poor; nor, as idolators, to lay down such a part of your estate for your portion; but He only requires that you would take the Lord for your God; and will you not do it? Can you deny Him and your poor soul so reasonable, so equitable a request? As the servant said to Nama, ‘If the prophet had commanded you some great thing, would not you have done it? how much more then when He only says, Wash, and be clean?’ So say I to you; if God had commanded the greatest things imaginable, would you not to your power have done them, that you might enjoy the blessed God for your eternal portion? how much more then when He only says, ‘Thou shalt have no other God before me’? O reader, do but observe that first command, which contains the sum both of your duty and felicity, and you are made, you are a blessed man for ever. Take the true God in Jesus Christ for your God, prize Him as your God, love Him as your God, honor Him as your God, and obey Him as your God, and He will be your God forever. Do but as much for the true God as the covetous man does for his wealth, which is his god, as the intemperate man for his belly, which is his god; they give their highest esteem, their choicest affections, and their greatest service to that which they take for their god. And surely the true God is more worthy hereof, and will requite you best for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-swinnock.html">George Swinnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Incomparableness of God, in his Works (Banner of Truth)</cite>, 4:493-97</span></figcaption>

e then when He only says, Wash, and be clean?’ So say I to you; if God had commanded the greatest things imaginable, would you not to your power have done them, that you might enjoy the blessed God for your eternal portion? how much more then when He only says, ‘Thou shalt have no other God before me’? O reader, do but observe that first command, which contains the sum both of your duty and felicity, and you are made, you are a blessed man for ever. Take the true God in Jesus Christ for your God, prize Him as your God, love Him as your God, honor Him as your God, and obey Him as your God, and He will be your God forever. Do but as much for the true God as the covetous man does for his wealth, which is his god, as the intemperate man for his belly, which is his god; they give their highest esteem, their choicest affections, and their greatest service to that which they take for their god. And surely the true God is more worthy hereof, and will requite you best for them.”

— George Swinnock, The Incomparableness of God, in his Works (Banner of Truth), 4:493-97">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+Consider+upon+what+terms+you+may+have+this+God+for+your+God%E2%80%A6+You+give+more+for+your+bread%2C+your+clothes%2C+your+house%2C+for+the+needful+comforts+that+are+for+the+support+of+your+frail+body%2C+than+you+need+give+for+the+great%2C+glorious%2C+incomprehensible%2C+incomparable+God.+You+pay+money+for+them%2C+but+you+may+have+Him+without+money+and+without+price.+One+would+think+that+the+equity+of+the+condition+should+both+amaze+you+and+allure+you.+Consider%2C+I+say%2C+God+does+not+require+of+you+things+impossible+to+you%3B+He+does+not+say%2C+If+you+will+remove+mountains%2C+dry+up+oceans%2C+stop+the+course+of+nature%2C+create+worlds%2C+I+will+then+be+yours%2C+as+great+as+I+am%3B+He+does+not+say%2C+If+you+will+satisfy+my+justice%2C+answer+the+demands+of+my+law%2C+merit+my+love+and+favor%2C+then+I+will+be+your+God.+No%3B+He+Himself+has+done+all+this+for+you+by+the+death+of+his+Son%3B+all+He+desires+is%2C+that+you+would+accept+Him+in+his+Son+for+your+God.+Nay%2C+He+does+not+require+of+you+anything+that+is+barbarous+or+cruel%2C+as+the+heathen+deities+did%2C+by+the+devil%2C+of+their+worshippers.+He+does+not+say%2C+If+you+will+lance+and+mangle+your+bodies%2C+as+Baal%E2%80%99s+priests+did%3B+if+you+will+go+barefoot+in+sackcloth+long+and+tedious+pilgrimages%2C+as+the+papists+do%3B+if+you+will+offer+your+children+in+the+fire%2C+and+give+the+fruit+of+your+bodies+for+the+sins+of+your+souls%2C+as+some+did%2C+then+I+will+be+your+God.+Again%2C+He+does+not+require+of+you+things+that+are+chargeable%2C+to+offer+the+best+and+chief+of+your+flock+daily+in+the+sacrifice+to+Him%3B+nor%2C+as+He+once+did+of+the+young+man%2C+to+sell+all+that+you+have%2C+and+give+it+to+the+poor%3B+nor%2C+as+idolators%2C+to+lay+down+such+a+part+of+your+estate+for+your+portion%3B+but+He+only+requires+that+you+would+take+the+Lord+for+your+God <blockquote><p>…the Fall causes a damage or loss of moral and spiritual freedom (man can no longer do the good or love God); the natural freedom, by which man’s will can choose between opposites without being necessitated towards one of both, remains after the Fall. This natural freedom is essential to man, in the sense that without this freedom he would no longer be man as a rational and responsible creature. The Reformed authors treated in this volume [Zanchius, Junius, Gomarus, Voetius, Turretin, de Moore] take pains to combine the permanence of essential freedom (presupposing contingency in reality) with the disastrous slavery of sin by which man’s will s bound (accounting for the factual impossibility of doing the good, since we can only do the good by loving and obeying God). …human freedom does not go unqualified: man does not act out of nature, or contrary to the (ultimate) judgment of his intellect, or outside of God’s providence. Still, these forms of necessity obtain in terms of the necessity of the consequence by which the outcome (the consequent) is not made necessary in itself.</p></blockquote>

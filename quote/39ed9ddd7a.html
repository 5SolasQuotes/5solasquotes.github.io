<blockquote><p>WE are disposed to think there must be, on an average, at least one misrepresentation for every page in this work. As it requires more words to correct a misstatement than to make it, we should be obliged to write a book instead of a review, if we thought it necessary to correct all these errors. We believe they may be safely allowed to work their own cure.</p></blockquote>

<blockquote><p>During his formative years, while studying at Herborn and Heidelberg, Comenius came under the influence of teachers who strengthened his ecumenical predisposition. This is particularly true of the period of study at Heidelberg, where he became acquainted with David Pareus, whose house, ‘Pareanum’, served as the center for those who worked for Protestant union. Two years after his return to his native land, Comenius was ordained priest of the Unity, and became pastor at Fulnek in Moravia. But with the outbreak of the Thirty Years War, Fulnek fell a prey to the fury of the Imperial armies. Comenius was compelled to take refuge on the Bohemian estates of one of the most important members of the Unity, Count Charles of Zerotin… There he wrote his celebrated Labyrinth of the World, a book in which the ecumenical theme found expression in condemnation of the fanaticism and bigotry of the confessional groups…” – Martin Schmidt in A History of the Ecumnical Movement, vol. 1, p. 89 Various – Good Counsels for the Peace of Reformed Churches by some reverend &amp; learned Bishops &amp; other Divines (Oxford: 1641) 150 pp. ToC King James I, To Cardinal Perron Richard Hooker, Answer to Travers Edwin Sandys, View of the State of Religion in the Western World John Davenent, Opinion of Thomas Morton, On the Peace of the Church Joseph Hall Opinion of To John Dury James Ussher Opinion of Sermon before King James Some French Reformed Divines, Opinion of Dury, John A Summary Discourse Concerning the Work of Peace-Ecclesiastical, how it may Concur with the Aim of a Civil Confederation Amongst Protestants (Cambrdige, 1641) 50 pp. A Motion Tending to the Public Good of this Age &amp; of Posterity, or, The Copies of Certain Letters Written by Mr. John Dury to a Worthy Knight at his Earnest Desire, Showing Briefly what a Public Good is &amp; how by the best Means of Reformation in learning &amp; religion it may be Advanced to Some Perfection (1642) 50 pp. Giles Firmin – Separation Examined: or a Treatise wherein the Grounds for Separation from the Ministry &amp; Churches of England are weighed and found too light… Also an humble request presented to the congregational divines, that since the differences between them and the classical [presbyterial]-divines are very small, they would please to strike in with the classical-divines in carrying on the work of reformation… (London: R.I., 1652) 111 pp. Firmin (1614–1697) was a puritan English minister who appeared to lean congregationalist, but could submit to episcopacy and presbyterianism. He actively promoted Baxter’s model of persons of different persuasions in Church government uniting in a consensus practice (as Phil. 3:15-16 says Christians ought to do). Firmin was ejected in the Great Ejection of 1662. Baxter, Richard Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653) 145 pp. ToC See the second part of this, ‘An Explication of some Passages in the foregoing Propositions.. with an Answer to some Objections’ at EEBO. For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. For the creedal Profession and 20 Propositions of the discipline of the Association, typed out, see below. See also ‘A Brief Explication of Some Passages in the Profession’. ‘An Explication of Some Passages in the Propositions’ gives a lot more of the philosophy of the whole. Cooper: “England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>

<blockquote><p>I answer that [if] the true Church was only at Jerusalem radically [during the time Israel was divided in the O.T.], as you [the Separatist John Robinson] say, [then it] would import that the 10 Tribes revolting from David’s house ceased to be a Church, which is false: [1.] Israel, though all the land were in Covenant with God, had circumcision and the Passover, and so were a true visible Church, even when they did meet in their synagogues. The altar, sacrifices, Temple, are not the essentials of a visible Church; they were a Church and did pray toward the Temple even in Babylon, and were to profess the true God before the heathen, Jer. 10:11. 2. There be typical reasons to hinder men why they cannot be capable of the priesthood [1 Kings 12:31], that did not exclude them from Church-state; but this hinders not but if the seals administered by a minister be true seals, then is the minister thereof catenus, insofar, a true minister.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644), | pt. 1, p. 236</span></figcaption>

<div class="actions"><button class="copy" data-copy="“I answer that [if] the true Church was only at Jerusalem radically [during the time Israel was divided in the O.T.], as you [the Separatist John Robinson] say, [then it] would import that the 10 Tribes revolting from David’s house ceased to be a Church, which is false: [1.] Israel, though all the land were in Covenant with God, had circumcision and the Passover, and so were a true visible Church, even when they did meet in their synagogues. The altar, sacrifices, Temple, are not the essentials of a visible Church; they were a Church and did pray toward the Temple even in Babylon, and were to profess the true God before the heathen, Jer. 10:11. 2. There be typical reasons to hinder men why they cannot be capable of the priesthood [1 Kings 12:31], that did not exclude them from Church-state; but this hinders not but if the seals administered by a minister be true seals, then is the minister thereof catenus, insofar, a true minister.”

— Samuel Rutherford, The Due Right of Presbyteries... (1644), | pt. 1, p. 236">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+answer+that+%5Bif%5D+the+true+Church+was+only+at+Jerusalem+radically+%5Bduring+the+time+Israel+was+divided+in+the+O.T.%5D%2C+as+you+%5Bthe+Separatist+John+Robinson%5D+say%2C+%5Bthen+it%5D+would+import+that+the+10+Tribes+revolting+from+David%E2%80%99s+house+ceased+to+be+a+Church%2C+which+is+false%3A+%5B1.%5D+Israel%2C+though+all+the+land+were+in+Covenant+with+God%2C+had+circumcision+and+the+Passover%2C+and+so+were+a+true+visible+Church%2C+even+when+they+did+meet+in+their+synagogues.+The+altar%2C+sacrifices%2C+Temple%2C+are+not+the+essentials+of+a+visible+Church%3B+they+were+a+Church+and+did+pray+toward+the+Temple+even+in+Babylon%2C+and+were+to+profess+the+true+God+before+the+heathen%2C+Jer.+10%3A11.+2.+There+be+typical+reasons+to+hinder+men+why+they+cannot+be+capable+of+the+priesthood+%5B1+Kings+12%3A31%5D%2C+that+did+not+exclude+them+from+Church-state%3B+but+this+hinders+not+but+if+the+seals+administered+by+a+minister+be+true+seals%2C+then+is+the+minister+thereof+catenus%2C+insofar%2C+a+true+minister.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries...+%281644%29%2C+%7C+pt.+1%2C+p.+236&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F824010ec1c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/824010ec1c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/is-roman-catholic-baptism-valid/#:~:text=I%20answer%20that%20%5Bif%5D%20the%20true,thereof%20catenus%2C%20insofar%2C%20a%20true%20minister&amp;text=I%20answer%20that%20%5Bif%5D%20the%20true%20Church%20was&amp;text=the%20minister%20thereof%20catenus%2C%20insofar%2C%20a%20true%20minister" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b2ae994528" data-kw="">
<blockquote><p>And shall we now set up a Church-tyranny, the mere will and abitriment, yea, the unjust sentences of Church-judicatories for laws, and require absolute submission thereunto, not only of private and single persons, but of all inferior judicatories, not allowing the congregational-eldership once to whisper against what is resolved by the presbytery, or the presbytery against what is resolved by the synod, or the synod against what is resolved by the General Assembly. If then the superior judicatories will tyrannize, what remedy is there? or if they become corrupt, how shall the ruin of religion, or the persecution and oppression of these who desire to keep faith and a good conscience, be avoided? Have the Ministers and saints and courts of Jesus Christ received religion and His ordinances upon these terms, that if a superior Court will have it so, they shall all crouch down as asses under the burden, and let them, without gainsaying (they being now cudgeled into silence by a sentence of suspension from the sacrament, or deposition or excommunication) ruin Church, and Ministers, and ordinances, and professors, and all the precious interests of Jesus Christ; And shall we say that such a submission is required in this case, as though they ought to do nothing but weep and pray in secret? How great tyranny is this, and how remedy-less a way to ruin?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters no Subverters, and presbyterie no papacie</cite>, … (1658), pp. 113-14</span></figcaption>

<blockquote><p>…Van Til fails to communicate clearly, and at times clearly equivocates, regarding three points at the heart of his system of philosophy: [1.] whether man must know everything to know anything, [2.] whether knowledge is true if it corresponds to God’s knowledge, or on the contrary, [it is] only [true] if he consciously refers it to God, [3.] and whether this referring to God is [to] be sufficient, or whether one must be regenerate and possessing a saving faith of God in order to possess ‘true knowledge’.</p></blockquote>

</figure><figure class="quote" id="q-757858b68f" data-kw="">
<blockquote><p>In this scholastic theology is to be praised: 1. the simple and concise kind of language; 2. the accurate and dialectical method; 3. the use or support of philosophy and natural disciplines. They are to be blamed, however, out of themselves, even the defenders of it, by: 1. the obnoxious doctrine of the papacy unto tyranny; and hence it is false in many ways; 2. the multitude of philosophical things; 3. the curiosity of vain inquiries [or topics]; 4. the confusion itself of things, arising out of an ignorance of languages; 5. obscurity and barbarities.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-burman.html">Francis Burman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of Theology</cite>, (Utrecht: Noenardus, 1671), vol. 1, bk. 1, ch. 2, section 47, p. 12 trans. T. Fentiman</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-d4371b9201" data-kw="">
<blockquote><p>The idea that no philosophies are better than [an]other has also only become less plausible in the last ten years… The idea that there are no gradations among secular thinkers with regard to natural theology and natural law or even the hidden things is empirically disproven by Jordan Peterson and like thinkers… Cornelius Van Til and Karl Barth both argued that, among all the various positions of philosophers, we should not acknowledge that some are better and others worse. They are all equally the wisdom of this age to which the hidden wisdom of Christ is opposed. Emil Brunner came back with a rebuttal, affirming the betterness of the kind of anti-materialist and moral realist philosophy of Socrates, Plato, and Aristotle and their modern successors, as opposed to the naturalism of Darwin, Marx, Freud, and Nietzsche. I would say the same for Jordan Peterson with respect to the New Atheists.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joel-carini.html">Joel Carini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”The Natural Man does Not Accept the Things of the Spirit of God’ – But He Can Accept Natural Theology: A Response to Brian Mattson &amp; Richard Gaffin’</cite>, (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-cf8c8a1fda" data-kw="">
<blockquote><p>Being is what is called in A[ristotelian]-T[homistic] metaphysics a transcendental, something above every genus, common to all beings and thus not restricted to any category or individual. The other transcendentals are thing, one, something, true, and good, and each is ‘convertible’ with being in the sense that each designates one and the same thing—namely being—under a different aspect. (To put the point in terms made familiar by Frege, the transcendentals differ in sense but not in reference, referring to the same thing under different names just as ‘Superman’ and ‘Clark Kent’ do.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>III. ‘The Transcendentals’ in Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015), pp. 303-7, pp. 304-5</span></figcaption>

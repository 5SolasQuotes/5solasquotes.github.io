<main class="wrap"><figure class="quote" id="q-fb72240770" data-kw="">
<blockquote><p>7th Distinction. It is one thing to hate a fundamental point, as that Christ is consubstantial with the Father, as the Arians do, and another thing by consequence to subvert a fundamental point, as Papists by consequence deny Christ to be true man while they hold the wonder of Transubstantiation, yet doe not they hate this conclusion formally, that Christ is true man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 2, pp. 227-28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3be6d89447" data-kw="">
<blockquote><p>The pope makes everything right. Where the pope is, there is the true church, pure doctrine, and apostolic succession. The truth is, there is not a word in Scripture about such an apostolic succession. Even as such it is no more a guarantee of purity of doctrine than the hereditary high-priestly office of Caiaphas validated the justice of his pronouncements and actions. For that reason Protestants were right in saying that not “the succession of places and persons” (successio locorum et personarum) but “the succession of doctrine” (successio doctrinae) is a distinguishing feature of the true church. If the latter is missing, the former can make no church into a true church; and if it is present, the former is of very minor significance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, vol. 4, §496</span></figcaption>

</figure><figure class="quote" id="q-b9c379f251" data-kw="">
<blockquote><p>For we also say that the church is the interpreter of scripture, and that this gift of interpretation resides only in the church: but we deny that it pertains to particular persons, or is tied to any particular see or succession of men.</p></blockquote>

</figure><figure class="quote" id="q-373f952ee3" data-kw="">
<blockquote><p>From all such persons, therefore, it behooves us to keep aloof, but to adhere to those who, as I have already observed, do hold the doctrine of the apostles, and who, together with the order of priesthood (presbyterii ordine), display sound speech and blameless conduct for the confirmation and correction of others.</p></blockquote>

</figure><figure class="quote" id="q-49003e754d" data-kw="">
<blockquote><p>Certain it is that many popes have been notorious heretics, as Liberius and Felix, who were Arians; Honorius, a Monothelite; and John XXIII, who denied the immortality of the soul. In the papal see, several schisms have been, and divers times many popes together, excommunicating one another and reciprocally calling one another Antichrist; and of those Antichrists, the worst commonly overcame. So according to the very canons of the Roman Church, factions and corruptions in the creation of the popes have several times made their election void and therefore have broken the thread of that succession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, bk. 1, ch. 32</span></figcaption>

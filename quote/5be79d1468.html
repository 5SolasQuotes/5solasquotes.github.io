<blockquote><p>First, we conceive that by the great salvation is understood the Gospel, as is clear, Ephes. 1. 13. where it is called the Gospel of our salvation; and Acts 13. 26. it is called the word of this salvation; so that by the words of this salvation is understood the Gospel, and those precious offers which are contained in it. And we conceive it may be called a great salvation, in these eight respects.

First, it is called the great salvation in respect of the price which was laid down for it; there being no less price laid down to purchase this great salvation, than the blood of the Son of God. From whence then doth salvation flow unto you? it comes running to you in a stream of the blood of the Son of God; this is clear, Heb. 9. 12. Neither by the blood of Goats and Calves, but by his own blood he entered in once into the holy place, having obtained eternal redemption for us.

Secondly, it is called a great salvation in respect of the many difficulties and oppositions which lie in the way of bringing it about. What great impediments (suppose ye) lay in Christ’s way before he could accomplish and bring about this great salvation? Was not the Justice of God to be satisfied? was he not to die, and to be made like unto one of us? was he not to lie in the grave? and was he not to bear the torments of hell before this great salvation could be accomplished and brought to pass? there were such impediments in the way of bringing about this great salvation, that if all the Angels in heaven had been set to work, they had been all crushed under it; had it been but that one great impediment to satisfy the justice, and pacify the wrath of God, even that was a pass, through which none could go but the eternal Son of God. It was so guarded, that none durst to adventure to enter it (much less could any win through it) save he only who was mighty to save.

Thirdly, it is called a great salvation in respect of that high estimation which the Saints have of it. O what an high estimation have the Saints of this Gospel salvation! there is no mercy which they think comparable to this; all other mercies are but little Zoars in comparison of this great mercy and Gospel salvation.

Fourthly, it is called a great salvation in respect of those noble effects which this salvation bringeth about and produceth. Some of the great effects of the Gospel, David hath cleared, Psa. 19. 7, 8, 9, 10. Is not this a great effect (of this Gospel salvation) to bring us out of nature into an estate of grace? And that is an effect of this great salvation. Is not this a great effect to make us who were enemies, become friends? And that is an effect of this great salvation. Is not this a great effect to make us who were moving in the way to hell, move in the way to heaven? And that is an effect of this great salvation. Is not this a great effect to make us who were far off, to be now made near? And yet that is an effect of this great salvation. And is not this a great effect to make us who were darkness become light in the Lord? And that is the great effect of this Gospel-salvation. Yea, I may say, time would fail me to tell all the great effects of this great salvation. But O will ye come and see, and that will best resolve the question unto you, what the noble effects of this great salvation are.

Fifthly, it is called a great salvation in respect of the great advantages which do redound to the person who embraceth it. First, is not heaven a noble advantage? and that is the gain which attendeth the embracers of this great salvation. Secondly, Is not Jesus Christ a notable advantage? And yet he is the advantage which attendeth the embracers of this great salvation. 3dly, is not eternal communion with God a noble advantage? and that advantage attendeth the embracers of this great salvation. 4thly, is not eternal liberation from the body of death a great advantage? and that attendeth the embracers of this great salvation. Fifthly, is not eternal singing in the enjoyment of God a great advantage? and that attendeth the embracers of this salvation. Sixthly, is not eternal seeing of God as he is, a great and noble advantage? And yet this (as all the former) attendeth the embracers of this great salvation. Yea, would ye be rich? O then embrace this great salvation. Would ye be honourable? Come and embrace this great salvation. Would ye be eternally happy? O then come and partake of this great salvation.

Sixthly, it is called a great salvation in respect of all other salvations that ever were accomplished. There was never a salvation or victory obtained by any General or Captain (unto a Land or people) that could have the name of great salvation in comparison of this.

Seventhly, it is called a great salvation in respect of the authority of it; we have spoken of the greatness (as to the meritorious cause) of it, and how great things it doth effectuate; and also in respect of the authority of it, it is a great salvation. Would you know who is the Author of this great salvation? it is Christ. Hebr. 5. 9. He became the Author of eternal salvation to all them that obey him. And must not this salvation be suitable to him who is the Author of it? this is one of the most noble and irradiant beams of the Majesty of the Son of God the Mediator, that he is the Author of this great salvation.

Eighthly, it is called a great salvation in respect of the continuance and duration of it. It is not a salvation which is but for a day; but it is an eternal salvation, Hebr. 9. 12. He obtained eternal Redemption for us.</p></blockquote>

<blockquote><p>In this covenant [of grace] the principle of representation was involved as an essential element. Christ, by the appointment of the Father, and by his own spontaneous election, became the legal representative of the elect seed who were given to him to be redeemed. He undertook all their legal responsibilities, as well those which related them to the preceptive requirements of the moral law, as those which bound them as transgressors to endure its penalty. Whatever the law exacted of them, in order to their justification, he as their representative obligated himself to render. The life of obedience due from them he engaged to live, the death demanded of them he bound himself to die.

It is indispensable to a just apprehension of this vitally important subject, to notice that what was a covenant of redeeming grace to his seed was a covenant of works to Christ. It was they, not he, who needed to be redeemed; they, not he, who were to be debtors to grace. He stood under the covenant, as the second Adam, a probationer, required and undertaking to render perfect, personal obedience to every demand of law, in order to the justification of his seed in him.

This exhaustive obedience he performed. Viewed in relation to the commands of the law, it may properly be denominated preceptive obedience; in relation to its curse, penal obedience. It is usual to distinguish these two aspects of it by the terms active and passive obedience. But it was both, during his life and at his death, at the same time active and passive. From the inception of his obedience he suffered, and at the climax of his sufferings he acted. From beginning to end he was a suffering actor, an acting sufferer. In life and death, consequently, and in relation to precept and penalty alike, he rendered obedience. This obedience was marred by not the slightest flaw—it was absolutely perfect. By it justice was completely satisfied and the law gloriously exalted.</p></blockquote>

— John L. Girardeau, The Federal Theology: Its Import and its Regulative Influence in Memorial Volume of the Semi-Centennial of the Theological Seminary at Columbia, South Carolina">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+this+covenant+%5Bof+grace%5D+the+principle+of+representation+was+involved+as+an+essential+element.+Christ%2C+by+the+appointment+of+the+Father%2C+and+by+his+own+spontaneous+election%2C+became+the+legal+representative+of+the+elect+seed+who+were+given+to+him+to+be+redeemed.+He+undertook+all+their+legal+responsibilities%2C+as+well+those+which+related+them+to+the+preceptive+requirements+of+the+moral+law%2C+as+those+which+bound+them+as+transgressors+to+endure+its+penalty.+Whatever+the+law+exacted+of+them%2C+in+order+to+their+justification%2C+he+as+their+representative+obligated+himself+to+render.+The+life+of+obedience+due+from+them+he+engaged+to+live%2C+the+death+demanded+of+them+he+bound+himself+to+die.%0A%0AIt+is+indispensable+to+a+just+apprehension+of+this+vitally+important+subject%2C+to+notice+that+what+was+a+covenant+of+redeeming+grace+to+his+seed+was+a+covenant+of+works+to+Christ.+It+was+they%2C+not+he%2C+who+needed+to+be+redeemed%3B+they%2C+not+he%2C+who+were+to+be+debtors+to+grace.+He+stood+under+the+covenant%2C+as+the+second+Adam%2C+a+probationer%2C+required+and+undertaking+to+render+perfect%2C+personal+obedience+to+every+demand+of+law%2C+in+order+to+the+justification+of+his+seed+in+him.%0A%0AThis+exhaustive+obedience+he+performed.+Viewed+in+relation+to+the+commands+of+the+law%2C+it+may+properly+be+denominated+preceptive+obedience%3B+in+relation+to+its+curse%2C+penal+obedience.+It+is+usual+to+distinguish+these+two+aspects+of+it+by+the+terms+active+and+passive+obedience.+But+it+was+both%2C+during+his+life+and+at+his+death%2C+at+the+same+time+active+and+passive.+From+the+inception+of+his+obedience+he+suffered%2C+and+at+the+climax+of+his+sufferings+he+acted.+From+beginning+to+end+he+was+a+suffering+actor%2C+an+acting+sufferer.+In+life+and+death%2C+consequently%2C+and+in+relation+to+precept+and+penalty+alike%2C+he+rendered+obedience.+This+obedience+was+marred+by+not+the+slightest+flaw%E2%80%94it+was+absolutely+perfect.+By+it+justice+was+completely+satisfied+and+the+law+gloriously+exalted.%E2%80%9D%0A%0A%E2%80%94+John+L.+Girardeau%2C+The+Federal+Theology%3A+Its+Import+and+its+Regulative+Influence+in+Memorial+Volume+of+the+Semi-Centennial+of+the+Theological+Seminary+at+Columbia%2C+South+Carolina&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe2c91f18eb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e2c91f18eb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/12/03/john-lafayette-girardeau-on-christ-as-the-surety-of-the-covenant/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-98ebf40a4f" data-kw="">
<blockquote><p>In reference to grateful love, nothing so much tends to fill the heart with this emotion as the believing realization of Christ’s redemption work—nothing so melts the heart; and no purer love to God can be imbibed. … There is no motive to a holy life so powerful and efficacious as that which is drawn from the propitiatory work of Christ, who, after meeting the demands of the law and bearing its curse, makes that same law a rule to direct our steps; and Christians learn to take it from the Mediator’s hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Atonement as Taught by Christ Himself</cite>, ch. 8, sec. 52</span></figcaption>

</figure><figure class="quote" id="q-b5af0f9625" data-kw="">
<blockquote><p>It is true that Calvin has intimated more than once his con- viction, that the position laid down by some of the schoolmen, viz. that Christ died ” sufficienter pro omnibus, efficaciter pro electis,” is sound and orthodox in some sense. But then he has never, so far as we remember or have seen proved, explained precisely in what sense he held it, and there is a sense in which the advocates of particular redemption can consistently admit and adopt it.† † When the subject of the extent of the atonement came to be more fully and exactly discussed, orthodox Calvinists generally objected to adopt this scholastic position, on the ground that it seemed to imply an ascription to Christ of a, purpose or intention of dying in some sense for all men. For this reason they usually declined to adopt it as it stood, or they proposed to alter it into this form, — Christ’s death was sufficient for all, efficacious for the elect. By this change in the position, the question was made to turn, not on what Christ did, but on what His death was; and thus the appearance of ascribing to Him personally a purpose or intention of dying, in some sense, for all men, was removed.</p></blockquote>

</figure><figure class="quote" id="q-eaed42d1dd" data-kw="">
<blockquote><p>What then is our foundation in Christ? Is it that he begins salvation and leaves us to complete it? Is it that he only opened up the way, and left us to follow it in our own strength? By no means, but as Paul had a little before declared, it is to acknowledge that he has been given us for righteousness. … in short, all things of his are ours, we have all things in him, he nothing in us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.15.5</span></figcaption>

<blockquote><p>2. Whether a separation may be iustly made from our Church for some errors or corruptions of life. I know that diverse who were once among us, never of us, have put out their own lights, indeed excommunicated themselves. What’s their plea? That our assemblies are full of enormities. I answer: That the defects and corruptions of a Church must be distinguished: they are either in doctrine or in manners. For doctrine, some errors are Citra fundamentum, some Circa fundamentum, others Contra fundamentum. Errors beside the foundation trouble, errors about the foundation shake, errors against the foundation ouerturn all. So long then as no foundation is harmed, it is not lawful depart until the Church separates from Christ, we must not separate from it. In two cases there is warrant of separation: First, when the substance of God’s worship is quite corrupted. What agreement has the Temple of God with idols? (2 Cor. 6:16) When this is, verse 17, ‘Come out from among them, and be ye separate, says the Lord,’ When Jeroboam had set up idols in Israel, the priests and the Levites left their suburbs and possession and came to Judah and Jerusalem. (2 Chron. 11:14) Secondly, when the substance of doctrine is quite corrupted. If any man consent not to the words of our Lord Jesus Christ, and to the doctrine which is according to godliness, etc. (1 Tim. 6:3) ‘From such,’ verse 5, ‘withdraw thyself.’ Paul in the synagogue at Ephesus preached for the space of three months together. (Acts 19:9) But when diverse were hardened, and believed not, but spake evil of that way, he departed from them, and separated the disciples. In these two cases lawful, not else.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Happiness of the Church, or a Description of those Spiritual Prerogatives wherewith Christ has endowed her, considered in some Contemplations upon part of the 12th Chapter of the Hebrews (London, 1619), ‘To the General Assembly, and Church of the Firstborn which are Written in Heaven,’</cite>, pp. 66-67</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-097263c6db" data-kw="">
<blockquote><p>Schismatical is such as was the schisms of the Donatists [in the Early Church], which separated themselves from the true Church of God under the pretense of a more absolute life and a more perfect holiness… But none of these [kinds of schisms] can be justly imputed unto us declining from the Romish Church, for that departing is without all blame, which is not from a true Church, but from a false Church: not from the people of God, but from the persecuters of the people of God, not from the articles of the Faith and sound doctrine of the church, but from errors which darken the articles of the Faith and from the wicked traditions of men, which specially is not done by any lightness but by necessity, not for the desire of innovation but for true religion’s sake, and to recover the true Faith according to the testimony of the eternal verity, that leaving the fellowship of darkness, we may be gathered again in true light, placed with Christ and all his members. So we at this day have forsaken that Romish Sea full of false doctrine and idolatry, and flowing with the innocent blood of martyrs, and have embraced the evangelic and apostolic doctrine, and so Christ Himself being head of the Church, which is the commmunion of all saints believing in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-alley.html">William Alley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Poor Man’s Library Rapsodiæ G.A. Bishop of Exeter upon the First Epistle of Saint Peter... (1560; London: Day, 1565), Lecture 7, Now to the Romish Church, Response, 3. Schismatical, p. 246 Alley was the Anglican bishop of Exeter during the reign of Queen Elizabeth I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Who are they that divide in judgement from all the Reformed Churches of Christ in the world, that have opinions and judgements differing from the opinions and judgements of all the Reformed Churches? we or the Anabaptists? we or the Separatists? we or the—? Possibly they will all say they are of the same opinion with the Reformed Churches in fundamentals as well as we, and their differences are but in minutioribus. Now supposing this to be true (as it may be in some of them), why then do they transgress the apostles’ rule? Why do they not, if that it be in matters of lesser moment wherein they differ from us, why do not they keep their opinions private, and have their faith unto themselves before God [Rom. 14:22]? Why do they upon so small differences (if the differences be so small) withdraw from communion with us and the rest of the Churches, and gather themselves into distinct and separate Churches; some of them not holding one body with us, others neither holding one body nor one baptism with us? Their agreeing with us and the Reformed Churches, in doctrines that are fundamental; their holding one Head and one faith, does not excuse them from being guilty of breach of unity and down-right schism, as long as they hold not one body, one baptism. Schisma (says Augustine) est eadem opinantem et eodem ritu utentem solo Congregationis delectari dissidio. ‘Schisme is, when a man that professes the same faith and worship, is delighted only with the difference of an assembly or congregation. And again, Schismaticos facit non diversa fides sed communion is disrupta societas: ‘It is not a differing faith, but breaking the fellowship of communion that makes men schismatics.’ And again, Schisma est, Recens Congregationis ex aliqua sententiarum diversitate dissensio: ‘Schism is a new or late dissension or disagreement of a congregation, arising from some diversity of opinion.’ It is Beza’s observation that the Corinthians did agree in the fundamentals of religion, and yet they had schisms among them, from whence he takes occasion to say,That [Greek], sive [Greek], est cum alij alijs hominibus sive externis ritibus it a sunt addicti, ut quamvis alioquin in ipsis religionis capitibus consentiant, tamen animis sint ab alienati et factiones quasdam ineant: ‘Schism or division’ (says he) ‘is this, when men are so addicted to some men, or to some outward rites, that though they do agree in the chief points of religion, yet they are estranged in their minds, and engage themselves into parties and factions’: Now who are they that though they professe to agree with us in doctrine, have yet made a secession, withdrawn themselves, gathered Churches, engaged parties? Consider and give sentence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-newcomen.html">Matthew Newcomen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of such as would Walk Worthy of the Gospel (London: 1646), pp. 41-42 Newcomen (c. 1610–1669) was a Westminter divine. He appears to have been presbyterian and then became a congregationalist, before being ejected in the Great Ejection (1662).</cite></span></figcaption>

<blockquote><p>Wherefore I cannot marvel enough at the corrupt and scismatical manners of certain men, who separate themselves for every light cause, from the most wholesome and pleasant company or society of the Church. For you shall find in these days, captious and phantastical men, not a few, which of many years have had fellowship with no Church, nor as yet have fellowship with any. For in every man that is, they find some kind of fault, in themselves only they find nothing worthy reprehension. Therefore they conceive with themselves a wonderful fashion of the Church, which except they see somewhere established after that fashion which they themselves haue devised, they contend (with shame enough) that there is as yet no true Church of Christ in the world.</p></blockquote>

<blockquote><p>(1.) It is clear that the specific and essential form of a fundamental article is not taken from the authority of God speaking in the Word (seeing God’s authority is one and the same in all that He speaks), but from the influence that the knowledge of an article has to unite us to God in Christ, and bring us to salvation. (2.) And secondly, it will follow that this, Thou shalt not by the use of things indifferent kill him for whom Christ died, and the like is no less fundamental, by evident consequence, in respect it is spoken by God’s own authority, than articles of our faith. (3.) It follows that formalists ignorantly divide matters of God’s worship, into matters of faith, or points fundamental, and things indifferent, as if many scriptural truths were not to be found in God’s Word, such as the miracles of Moses, and Elias, the journeys of Paul, which are neither matters fundamental, nor yet things indifferent. (4.) Many things may be fundamental, by consequence, to one who can read the Word, and hear it read, which is not by consequence fundamental to a rude and ignorant man.</p></blockquote>

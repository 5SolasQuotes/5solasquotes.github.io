<main class="wrap"><figure class="quote" id="q-7aee18ce20" data-kw="">
<blockquote><p>That they indeed quote Paul in the same sense does them very little good: “The doers of the law, not the hearers, are justified” [Rom. 2:13 p.]. I do not intend to evade the question through Ambrose’s solution: that this was said because fulfillment of the law is faith in Christ.15 For I see this as a mere evasion, quite needless where the way lies open. Here the apostle is casting down the foolish confidence of the Jews, who claimed for themselves the sole knowledge of the law, even while they were its greatest despisers. Lest, then, mere skill in the law should please them so much, he warns that if righteousness be sought from the law, not knowledge but observance of it is sought. We assuredly do not question that the righteousness of the law consists in works, and not even that righteousness consists in the worth and merits of works. But it has not yet been proved that we are justified by works unless they produce some one man who has fulfilled the law. That Paul meant precisely this is sufficiently attested by the context of his utterance. After having condemned Gentiles and Jews together for their unrighteousness, he then gets down to details and says: “Those who have sinned without law will perish without law,” which has reference to the Gentiles; and “those who have sinned in the law will be judged by the law” [Rom. 2:12], which concerns the Jews. Now, since they, winking at their own shortcomings, plumed themselves on the law alone, Paul adds something especially fitting: the law was not laid down merely that men might be made righteous by hearing its voice; but only if and when they obeyed it. It is as if he said: “Do you seek righteousness in the law? Do not claim to have heard it, something of little weight in itself, but bring works whereby you may declare that the law was not laid down for you in vain.” Since they were all lacking in these works, it followed that they were bereft of boasting about the law. Paul’s meaning, then, requires us, rather, to frame the opposite argument: the righteousness of the law lies in perfection of works; no one can boast that he has fulfilled the law through works; consequently, there is no righteousness arising from the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Ford Lewis Battles, 3.17.12.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-36af3e1b9b" data-kw="">
<blockquote><p>Good works proceed from saving faith; faith that does not bear fruit is not saving faith (see James 2:19). James 2:24 is talking about works as fruit and evidence of saving faith, not meritorious works that save us. In fact, James reminds us what kind of perfection is required in order for our works to merit salvation: “For whoever keeps the whole law but fails in one point has become guilty of all of it.” (James 2:10) Thus, if you want to boast in your works, or even in your work of faith, James reminds us that you must keep every point of the law, since even one miss justifies our condemnation for the entire law (see Gal. 5:3-4). And there is only one man who kept the law perfectly, the man Christ Jesus (Heb. 4:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rowlands.html">Daniel Rowlands</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Are Good Works Enough?</cite>, May 19. 2022</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-c0122119bb" data-kw="Indulgences Treasury of merits">

</figure><figure class="quote" id="q-e231ecdd56" data-kw="">
<blockquote><p>Faith alone also justifies, insofar as it denotes a certain obedience which awaits the promise as a free gift; in which respect it formally consists indeed in the application of the promise. Yet certain dispositions precede this very act of faith (concerning which see Pareus, book 10 on Justification against Bellarmine, chapter 3), and fruits follow it. Hence it connotes several virtues or acts, both preceding and consequent, and it is opposed to that obedience which does not expect the promise as a wholly gratuitous gift, but as a reward set forth under the condition of some work, beyond mere acceptance and the gratitude owed—such as by its nature is usually required in every donation, however free. And this kind of [latter legal] obedience is peculiarly called by the apostle and by the Latins a “work,” and properly “merit”; and those who obey under this condition are called “workers” (Rom. 4:4; 11:6). And if this proposition is thus explained, those works which cannot coexist with faith—that is, which are done with confidence in and an opinion of merit—are altogether excluded, so that they are denied not only to justify, but even to be present either in one who is justified, or in the act of justifying.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludovicus-crocius.html">Ludovicus Crocius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Syntagma</cite>, bk. 4, ch. 7, p. 1223, as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, pp. 369-70, trans. ChatGPT-5 Crocius (1586 – 1653 or 1655) was a German reformed minister, a delegate at the Synod of Dort and a professor of theology and philosophy in Bremen.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<main class="wrap"><figure class="quote" id="q-b839c2986d" data-kw="">
<blockquote><p>Forsomuch now as the word of God is the only truth that driveth away all lies, and discloseth all joggling and deceit, therefore is our Baalam of Rome so loath that the scripture should be known in the mother, tongue; lest, if kings and princes, specially above all other, were exercised therein, they should reclaim and challenge again their due authority, which he falsely hath usurped so many years, and so to tie him shorter; and lest the people, being taught by the word of God, should fall from the false feigned obedience of him and his disguised apostles into the true obedience commanded by God’s own mouth; as namely, to obey their prince, to obey father and mother, &amp;c., and not to step over father and mother’s belly to enter into his painted religions, as his hypocrites teach. For he knoweth well enough, that if the clear sun of God’s word come once to the heat of the day, it shall drive away all the foul mist of his devilish doctrines. Therefore were it more to the maintenance of antichrist’s kingdom, that the world were still in ignorance and blindness, and that the scripture should never come to light.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/myles-coverdale.html">Myles Coverdale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Translation of the Bible. Unto the Most Victorious Prince and our Most Gracious Sovereign Lord King Henry the Eighth, King of England and of France, Lord of Ireland, &amp;c., Defender of the Faith, and under God the Chief and Supreme Head of the Church of England (1535) in Remains of Myles</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>
<div class="actions"><button class="copy" data-copy="“Forsomuch now as the word of God is the only truth that driveth away all lies, and discloseth all joggling and deceit, therefore is our Baalam of Rome so loath that the scripture should be known in the mother, tongue; lest, if kings and princes, specially above all other, were exercised therein, they should reclaim and challenge again their due authority, which he falsely hath usurped so many years, and so to tie him shorter; and lest the people, being taught by the word of God, should fall from the false feigned obedience of him and his disguised apostles into the true obedience commanded by God’s own mouth; as namely, to obey their prince, to obey father and mother, &amp;c., and not to step over father and mother’s belly to enter into his painted religions, as his hypocrites teach. For he knoweth well enough, that if the clear sun of God’s word come once to the heat of the day, it shall drive away all the foul mist of his devilish doctrines. Therefore were it more to the maintenance of antichrist’s kingdom, that the world were still in ignorance and blindness, and that the scripture should never come to light.”

</figure><figure class="quote" id="q-8f810e3226" data-kw="">
<blockquote><p>It is the duty of the civil government to uphold not only the second table of the law, but also the first. It must see to it that God is honoured. It may not tolerate any idolatry, worship of images, or any false religion within her jurisdiction, but must rather eradicate these. It must prevent the vain use of God’s Name practiced by cursing, swearing, and blasphemy. It must prevent the desecration of the Sabbath, punish violators of this commandment, and see to it that the gospel is proclaimed everywhere within its jurisdiction.

It must see to it that the church as the darling of the Lord Jesus is protected and preserved and that neither internal dissension nor any external oppression disturb or destroy the church, but that instead she be safely preserved in the use of the privileges and liberties which her King Jesus has given her.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 2: 179.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

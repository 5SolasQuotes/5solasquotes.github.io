<blockquote><p>Man is naturally a Lover of Society, and was not created to live in solitude: they which so affections to renounce converse with other men, must be (as One said long since) either some thing more or some thing less then Men. Now we have for the principal objects of our affections, God, and Men like our selves; which are also the two chief, and perhaps only things to which we owe any Duties. Concerning those duties, in which we stand obliged one towards another, it hath been requisite to establish certain Societies upon good constitutions as upon firm bases, to the end there might be certain Laws to regulate those duties, to correct our excesses, amend our defaults, restrain the licentiousness of some, and excite the supinity and negligence of others; that by such means all things might be preserved in good order.

And nature her self first gave the model thereof in families, where Parents and Children are held in reciprocal obligations, and so brethren one towards another, and likewise servants themselves. For from that Pattern were Cities first formed, which are as great Families, and Kingdoms which are as great Cities; in like manner as a Family is like a small City, or a narrow Kingdom. And he that sequesters himself from humane Society to live by himself, is looked upon as an Enemy of Mankind, as Timon the Athenian was; a sort of Monster wonderfully rare in the World.

As for the Duties incumbent upon us towards the Deity, men have likewise appeared sociable therein, and have not chosen to serve God a part by themselves; but have constituted an other kind of Society, in which they might serve him all in common, and in some sort partake in the devotions one of another; and this according to certain sacred constitutions, serving to regulate the mind of man, and to bind every one in conscience. So that in this Society, yet much more then in the other, whosoever separated himself from it, has been by common judgment of all the rest held for an enemy of the Deity, and as a beast unworthy to live upon the face of the Earth. And that this is so, experience and evidence of Truth attests beyond all contradiction.</p></blockquote>

<blockquote><p>…neither can he [an opponent] be ignorant of that which he has so often read and learned of your most godly writings, that it pertains not to the prince either to prescribe religion to the kirk or discipline to the pastors thereof, but by his authority to confirm both the one and the other, appointed by God, and sincerely declared out of his Word by the ministry of his servants; to revenge and punish all corrupting of clean doctrine, contempt of holy discipline, and perturbation of lawful order (for which use and purpose he has received the sword), to decore the Assemblies, if need be, with his presence; to arm the innocency of the ministry by his safe-guard and defense; if there arise controversies among the pastors, sometimes to compose and agree the same by his authority interpouned; to promove, by good laws made for that effect these things which are lawfully constituted by the Assemblies, and to do many other things for the weale of the kirk which were long to rehearse, and unneedful. But far otherwise does he sit in the synods among the pastors than he does in the throne of the kingdom among the estates: here to make laws for subjects and command, but there to receive laws from God and to obey. And albeit that some things be called ecclesiastical, and other things civil, and the civil appertain to the commonweal, and the other to the kirk; yet it is not so much to be considered what things are handled, as how, seeing the knowledge of one and the self-same thing one way, and in some respect, appertains to the magistrate, and another way to the senate ecclesiastical. And yet such a matter neither does the kirk civilly, nor the counsel or parliament ecclesiastically entreat.</p></blockquote>

<blockquote><p>Why is it right to defend ourselves against unlawful violence?

Self-defence against unlawful violence is always legitimate. It is more than legitimate: it is a moral obligation. Our life is not our own; it belongs to God, and therefore as stewards of God’s possessions we are under obligation to preserve our own life, and the lives of others, from destruction by criminal violence. The principle that necessary self-defence is legitimate is generally upheld by the civil laws of nations.

To claim that the “Golden Rule,” or the obligation to love our neighbour, means that it is wrong to kill in an effort at self-defence is to push loving our neighbour to an absurd and fanatical extreme. The Scripture commands a person to love his neighbour as himself: that is, love for one’s neighbour is to be kept in balance with a proper love for oneself. The person who will let himself be murdered by a criminal, without attempting self-defence, loves his neighbour too much, and does not love himself enough.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-g-vos.html">Johannes G. Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Larger Catechism: A Commentary</cite>, ed. G. I. Williamson (Phillipsburg NJ: P&amp;R, 2002), pp 369-70.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-4a048d1f58" data-kw="">
<blockquote><p>Tis certainly as much a Treason and Rebellion against this constitution, and the known Laws, in a Prince to endeavour to break through them, as ’tis in the People to rise against him, whilst he keeps within their Bounds and does his Duty. Our Constitution is a Government of Laws, not of Persons. Allegiance and Protection are Obligations that cannot subsist separately; when one fails, the other falls of Course. The true Etymology of the word ‘Loyalty’ (which has been so strangely wrested in the late Reigns ) is an entire Obedience to the Prince in all his Commands according to Law; that is, to the Laws themselves, to which we owe both an active and passive Obedience. By the old and true Maxim, that the King can do no Wrong, no body is so foolish as to conclude, that he has not strength to murder, to offer violence to women, or power enough to dispossess a man wrongfully of his Estate, or that whatever he does (how wicked soever) is just: but the meaning is, he has no lawful Power to do such things; and our Constitution considers no power as irresistible, but what is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-hotman.html">Francis Hotman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Franco-Gallia: Or an Account of the Ancient Free State of France and most other Parts of Europe before the Loss of their Liberties</cite>, 1573 | From the Translator’s Preface:</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Tis certainly as much a Treason and Rebellion against this constitution, and the known Laws, in a Prince to endeavour to break through them, as ’tis in the People to rise against him, whilst he keeps within their Bounds and does his Duty. Our Constitution is a Government of Laws, not of Persons. Allegiance and Protection are Obligations that cannot subsist separately; when one fails, the other falls of Course. The true Etymology of the word ‘Loyalty’ (which has been so strangely wrested in the late Reigns ) is an entire Obedience to the Prince in all his Commands according to Law; that is, to the Laws themselves, to which we owe both an active and passive Obedience. By the old and true Maxim, that the King can do no Wrong, no body is so foolish as to conclude, that he has not strength to murder, to offer violence to women, or power enough to dispossess a man wrongfully of his Estate, or that whatever he does (how wicked soever) is just: but the meaning is, he has no lawful Power to do such things; and our Constitution considers no power as irresistible, but what is lawful.”

o-tyranny/#:~:text=Tis%20certainly%20as%20much%20a%20Treason,as%20irresistible%2C%20but%20what%20is%20lawful&amp;text=Tis%20certainly%20as%20much%20a%20Treason%20and%20Rebellion&amp;text=no%20power%20as%20irresistible%2C%20but%20what%20is%20lawful" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The immediate nearest end of civil power is that the good of the commonwealth may be provided for and procured, whether it be in time of peace, according to the rules of law and council of judges, or in time of war according to the rules of military prudence; and so the temporal safety of the subjects may be procured and that external peace and civil liberty may be preserved, and being lost may be again restored.</p></blockquote>

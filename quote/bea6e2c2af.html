<main class="wrap"><figure class="quote" id="q-bea6e2c2af" data-kw="">
<blockquote><p>Nor will it follow that it is intrinsically unlawful for a synod of New England [who were congregationalists] to send 24 gracious youths understanding in the language, ordain them pastors by laying on of hands of the elders, and by fasting and praying, instruct them to go and act as pastors among the savages, preaching and baptizing; and their warrant is Acts 13; and here are pastors without certain flocks [contra congregationalism]. If any (Acts 13) say [that] the Spirit gives a special command there, and names Saul and Barnabas, but its not so here: I answer, there is without question something extraordinary in Acts 13, nor are we with Seekers (too much fortified in their way by our [congregationalist] Brethren’s doctrine) to wait for the Lord’s naming from heaven John, Thomas, to be preachers in such a place. But to me: 1. The nearness to the savages, 2. The knowledge of their language (as I suppose), 3. Their weak desire, or the professed not hating of the Gospel [by the savages], were equivalent to a command from heaven, ‘Go preach to the Americans’, and that in the capacity as proper pastors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (1658), pp. 421-3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

arget="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e35b1b865e" data-kw="">
<blockquote><p>…some private Christians, Acts 8:4, preached the Gospel, but when? In time of heavy persecution when they were scattered, vv. 1,4. [According to the inference of congregationalists:] Then all gifted Christians, tradesmen or what else, not separated by Christ and his Churches’ calling may now preach the Gospel, yea be the ordinary and only converters of souls and gatherers of the saints [as regular preachers or pastors]; it follows no ways.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), p. 257</span></figcaption>

</figure><figure class="quote" id="q-5bccefe48c" data-kw="">
<blockquote><p>XXXVI… For as to the laying on of hands, it cannot be considered as a sign. (a) It is not an element, but an action. (b) It is common with confirmation and many other things and was practiced even under the Old Testament. (c) It was not instituted by Christ by any command, but is a free ceremony, which we read indeed of having been employed, but not of having been instituted; what has been employed, however, ought not at once to be said to have been instituted. Thus the washing of feet and breathing upon the apostles were employed by Christ (Jn. 13:5; Jn. 20:22); yet they were not on that account instituted. (d) Imposition of hands does not pertain to all the orders [of Church office], but only to some.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, Institutes of Eclenctic Theology, vol. 3, Topic 19, Question 31, ‘The Five False Sacraments of the Romanists’, section 36, ‘Proof that the Orders [of Church Office] are not Sacraments’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-a1a4b463fa" data-kw="">
<blockquote><p>And as for the other sort of elders, together with deacons, we judge the ancient order of this Church [of Scotland], to have been most convenient for providing of well-qualified men for those functions and offices. For the eighth head of the First Book of Discipline, touching the election of elders and deacons, ordains that men of best knowledge and cleanest life, be nominat[ed] to be in election, and that their names be publicly read to the whole church by the minister, giving them advertisement, that from among them must be chosen elders and deacons: that if any of these nominat[ed] be noted with public infamy, he ought to be repelled: and that if any man know others of better qualities within the Church than these that be nominat[ed], they should be put in election, that the Church may have the choice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 8, Digression 1, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-2234dc3d43" data-kw="">
<blockquote><p>Many at this day can scarce digest it, that He sent forth a Judas to preach the Gospel, when He knew that he was a thief and a hypocrite, and foreknew that he was a son of perdition and would betray Him, and that the Devil would enter into him; yea, knew that he was a devil, Jn. 6:70 &amp; 13:2, yet that this Judas should be one of the twelve select apostles and one of the family of Christ. Yet Christ repulsed him not; and if he did not partake of the sacrament at his last Supper, it was not because Christ did turn him out, but because he went away himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1 | Direction 12, p. 102</span></figcaption>

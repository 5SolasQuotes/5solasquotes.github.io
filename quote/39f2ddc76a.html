</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-174a77c82b" data-kw="">
<blockquote><p>Fourthly. [Romanist objection:] Yea, but there is no baptism but in the Church, and when you separate yourselves from us, you then separate yourselves from the Church. The answer: There is no baptism but in the Church, and we deny not also, that the Church of Rome is a Church. For in that we affirm that Antichrist rules there, we consequently hold that it is the Church, inasmuch as he cannot sit anywhere but in the Church [2 Thess. 2:4]. But it is one thing to separate ourselves from the Church of Rome defiled by Antichrist, and another thing to depart from the communion of the universal Church, as we have already declared. Again we depart not from the temple, but from the idolatry committed in the temple, nor from the commonwealth, but from the tyranny which oppresses the commonwealth, nor from the city, but from the pestilence which infects the city, nor from the communion and fellowship of the people (to whom we wish all happiness and salvation) but from the conspiracy of Antichrist and of his maintainers: we therefore renounce not their baptism, but we ratify it. By the same we are bound to serve God, and to renounce the devil: and following the same, we seek to serve God according to his Word, and renounce all idols. By these letters of natural birth, we are bound to maintain the laws of the ancient Christian commonwealth, which is the Church: and folowing them, we set up again before us the law of God, the only lawgiver of the Church, and would deliver the Church from all new impositions and burdens, which Antichrist has laid upon their consciences. By baptism we haue made an oath unto Christ, and the pope would turn our service from Christ, to his idols and to himself: we therefore set Christ against Antichrist, and the Church against his conspiracy. And this is that for which by the grace of God, we have been baptized into the Church, how tyrannical and disordered soever it has been. ‘But the ministers thereof, whom you pretense to be of Antichrist, they have baptized you.’ Indeed they have put water on my head, but Christ has baptized me. The tyranny or his officers, which he has established after his fashion, have made me lift up my hand and give him an oath: but they have made me to make it to the commonwealth, and not to the tyranny, in the name of Christ, and not in the name of Antichrist. The form of the oath has remained entire and sound, albeit the estate were changed. To follow therefore the tenor of mine oath, I will retire myself into the army of true citizens, and I will seek out the true Church in the place wherunto it has withdrawn itself, and I will renounce the communion of Antichrist, who under color of mine oath, makes me to break mine oath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philip Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 10</span></figcaption>

<blockquote><p>3rd Consideration. There is a separation from the Church in the most part, or from the Church in the least and best part. In Ahab’s time, Israel, and the Church thereof, for the most part, worshipped Baal; Elijah, Micah, Obadiah and other godly separated from the Church of Israel in the most part: Jeremiah wished to have a cottage in the wilderness (no doubt a godly wish) that he might separate from the Church all then for the most part corrupted, yet remained they a part of the visible Church and a part in the visible Church, and therefore did he not separate from the Church according to the least and best part thereof; The godly in England who refused the Popish ceremonies and Antichristian Bishops did well not to separate from the visible Church in England, and yet they separated from the mainest and worst part [in the Roman fold], which cannot be denied to be a ministerial Church. … 5th Consideration. I see not but we may separate from the Lord’s Supper where bread is adored, and from baptism where the sign of the cross is added to Christ’s ordinances, and yet are we not separated from the Church, for we professedly hear the word and visibly allow truth of the doctrine maintained by that Church which do pollute the sacraments, and we are ready to seal it with our blood, and it is an act of visible profession of a Church to suffer for the doctrine mentioned by that Church. 6. We may well hold that Ambrose says well that a Church wanting the foundation of the apostles is to be forsaken. 7. There is a forced separation through tyranny from personal communion, and a voluntary separation; David was forced to leave Israel and was cast out of the Inheritance of the Lord; the former is not our sin, and our separation from Rome has something of the former, the latter would be wisely considered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644) | pt. 2, pp. 253-4</span></figcaption>

<blockquote><p>IV. From this concord sought and sometimes achieved by the Reformed with the Churches of the Augsburg Confession, Roman Catholic scholars infer and believe that the Reformed can and should also unite with the Roman Church and not reject its communion. As if, in their view, there were no reason to secede from the Roman Church more than from the Churches of the Augsburg Confession, with which they also have significant controversies. Therefore, it will be useful to explain the reason for this distinction and to show why Protestants, despite the controversies between them, can and should seek unity among themselves, while such a union with the Roman Church is neither lawful nor possible.</p></blockquote>

<blockquote><p>Answer 1. A promiscuous baptizing of all we deny: It may import a baptizing of the infants of Turks, or of Papists, who avow they will bring up the child baptized in the Roman faith: In which case, it would seem Baptism should be denied, as the learned Walleus thinketh (in loc., commentary).</p></blockquote>

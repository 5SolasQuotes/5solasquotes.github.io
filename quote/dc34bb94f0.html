<blockquote><p>But whether every truth be fundamental or necessary: ‘Discipline’ (you say) ‘is so’: [it is] indeed necessary to the well-being of a church, no more: it may be true without it, [though] not perfect. Christ compares his spouse to an army with banners: as order is to an army, so is discipline to the Church: if the troops be not well marshalled in their several ranks, and move not forward, according to the discipline of war, it is an army still: confusion may hinder their sucess, it cannot bereave them of their name: it is as beautiful proportion to the body, an hedge to a vineyard, a wall to a city, an hem to a garment, ceiling to an house. It may be a body, vineyard, city, garment, house, without them: it cannot be well and perfect. Yet which of our adversaries will say we have no discipline? Some they grant, but not the right: as if they said, Your city has a brick wall indeed, but it should have one of hewn stone; your vineyard is hedged, but it should be paled and ditched: while they cavil at what we want, we thank God for what we have; and so much we have, in spite of all detraction, as makes us both a true Church and a worthy one.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistles, the Second Volume</cite>, (London: 1608), 6th Decade, Epistle 5… dissuading from Separation &amp; Shortly Oppugning the Grounds of that Error, pp. 50-55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a></span></div>

<blockquote><p>Yea a conditional covenant agreed unto and accepted, is a covenant, if we shall (as in reason we ought) distinguish between a covenant, in its essence and nature, and a covenant broken or fulfilled. A covenant or threatening is a covenant and threatening obliging Adam, if it shall be agreed unto by silence, as Adam accepted the threatening, Gen. 2:17, by silence; and professors within the visible church, by their professing of the doctrine of the Gospel or covenant of grace, their receiving of the seals and professed hearing of the word, are under the covenant of grace, and engage themselves to obey commands, promises, threatenings; and therefore promises are as properly made to them, Acts 2:39, as commands, and threatenings, exhortations, invitations, and Gospel requests are made to them. But though the Anabaptists ignorantly confound the promise and the thing promised, the covenant and benefits covenanted: the promise is to you, and so are the commands and threatenings, whether ye believe or not; the command is to you, and lays an obligation on you, whether ye obey or obey not, and the threatenings are to you, whether ye transgress or transgress not. It is true indeed, the promise, that is, the blessing promised, righteousness and eternal life, is not given to you until ye first believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh: Anderson, 1655), pt. 1, ch. 13; p. 90</span></figcaption>

<blockquote><p>…we also conceive that the visible Church described in the holy Scripture is not only a parochial or particular Church, but that there is also a national and universal Church, dispersed through a whole kingdom, yea through the whole world; which does in ecclesiastical communion make up one body catholic.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelm-apollonius.html">Wilhelm Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God</cite>, (London: 1645), ch. 3, ‘Of an Institute Visible Church’, p. 25</span></figcaption>

</figure><figure class="quote" id="q-6d3d08eca5" data-kw="">
<blockquote><p>The third use is for reproof of those that hold outward government essentially necessary to the Church, as if the Church without this could have no being at all. I for my part desire, and would gladly go as far as I see Christ and his apostles have gone before me; and where they stay, there would I stay too. I find that the Church can never be long nor well without government, but yet it may be sometimes without it, and yet be a true Church. It is true of the inward government, for where that is not, it is not possible that the Church should have any being at all, but it is not so of the outward. Therefore we must rightly distinguish betwixt the inward and the outward government, otherwise we shall run into many absurdities: First, the inward is merely spiritual, the outward is for the most part bodily, that is, such as affects the ear, or the eye, or some other parts; only it is thus far spiritual, in regard of the end it aims at, that is, to make us spiritually minded. Secondly, the inward is proper to God, and reserued to Him only; the outward, though it be from God too, yet it is committed to the administration of men. Thirdly, the inward is peculiar to the faithful and elect alone, God rules in their hearts and consciences, justifying and sanctifying them, and none others; the outward is common to all that profess themselves to be members, though they be hypocrites. Fourthly, the inward is the highest and principal, the outward is but a serviceable dispensation fitted to the inward. Fifthly, the inward seconds the outward, and makes it effectual and fruitful; the outward does but lead vs by the hand (as it were) to the inward. I note this difference the rather, because many men do clamorously exclaim that Christ is robbed of the one half of his kingdom when that outward form which they pretend is not observed. And this is the Brownists’ exception: ‘You’ (say they) ‘deny Christ to be your King, because you own not his discipline which He has prescribed.’ I am with the apostle: God’s kingdom consists not of meats and drinks, and of outward rites, but of righteousnesse and peace, and joy in the Holy Ghost. [Rom. 14] The principal part of God’s kingdom is when He rules by his Spirit in the hearts of his children: and therefore if there were any such discipline prescribed by the Word as they pretend, yet we should not lose the one half of Christ’s kingdom, though it were not observed. Happily it is not known to them that do not observe it; and then it is no rebellion; if it be knowne by them, the sin is much the greater, if it be not observed. But yet Christ may still exercise his Kingdom in the hearts of many members of the Church by his Spirit, though this were wanting. The case may seem to be well paralleled by our outward and inward worship in prayer: The outward worship is but an appurtenance to the inward, for the inward may be true without the outward. And so discipline is rather an appurtenance to God’s kingdom, than the kingdom itself; so that we see that God’s Church may be without discipline, though it cannot be well nor long without it; where outward government is wanting, the Church may be defective and maimed, yea half-dead in outward show at least, and yet a true Church still. Yet, but are not the Word and the sacraments parts of the outward government, and they are necessary to the very being of the Church. Therefore some part of the outward government is essential to the Church. I answer: That they are not necessary to themselves, but by accident, because they 〈…〉to the inward, as that it cannot be without this. And besides, the Word and the sacraments are not so much of the outward government of themselves, but rather the carriage and manner of using of them is of the outward government. Lastly, I answer, they are simply necessary, as they are the causes and gathering of the Church, but not as they are parts of outward government. As Moses his message and gathering of the Israelites to the Lord was one thing, his governing of them another. So that the Word and sacraments must be considered in both these respects, and so in respect of gathering the Church, they are simply necessary, not in respect of governing of it. So that outward government is not simply necessary to the being of the Church, but to the well-being only.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London, 1631), Lecture 14 Randall (1570–1622) was an English puritan who held that the particular form of Church government is not by divine-right., pp. 242-44</span></figcaption>

s+it+were%29+to+the+inward.+I+note+this+difference+the+rather%2C+because+many+men+do+clamorously+exclaim+that+Christ+is+robbed+of+the+one+half+of+his+kingdom+when+that+outward+form+which+they+pretend+is+not+observed.+And+this+is+the+Brownists%E2%80%99+exception%3A+%E2%80%98You%E2%80%99+%28say+they%29+%E2%80%98deny+Christ+to+be+your+King%2C+because+you+own+not+his+discipline+which+He+has+prescribed.%E2%80%99+I+am+with+the+apostle%3A+God%E2%80%99s+kingdom+consists+not+of+meats+and+drinks%2C+and+of+outward+rites%2C+but+of+righteousnesse+and+peace%2C+and+joy+in+the+Holy+Ghost.+%5BRom.+14%5D+The+principal+part+of+God%E2%80%99s+kingdom+is+when+He+rules+by+his+Spirit+in+the+hearts+of+his+children%3A+and+therefore+if+there+were+any+such+discipline+prescribed+by+the+Word+as+they+pretend%2C+yet+we+should+not+lose+the+one+half+of+Christ%E2%80%99s+kingdom%2C+though+it+were+not+observed.+Happily+it+is+not+known+to+them+that+do+not+observe+it%3B+and+then+it+is+no+rebellion%3B+if+it+be+knowne+by+them%2C+the+sin+is+much+the+greater%2C+if+it+be+not+observed.+But+yet+Christ+may+still+exercise+his+Kingdom+in+the+hearts+of+many+members+of+the+Church+by+his+Spirit%2C+though+this+were+wanting.+The+case+may+seem+to+be+well+paralleled+by+our+outward+and+inward+worship+in+prayer%3A+The+outward+worship+is+but+an+appurtenance+to+the+inward%2C+for+the+inward+may+be+true+without+the+outward.+And+so+discipline+is+rather+an+appurtenance+to+God%E2%80%99s+kingdom%2C+than+the+kingdom+itself%3B+so+that+we+see+that+God%E2%80%99s+Church+may+be+without+discipline%2C+though+it+cannot+be+well+nor+long+without+it%3B+where+outward+government+is+wanting%2C+the+Church+may+be+defective+and+maimed%2C+yea+half-dead+in+outward+show+at+least%2C+and+yet+a+true+Church+still.+Yet%2C+but+are+not+the+Word+and+the+sacraments+parts+of+the+outward+government%2C+and+they+are+necessary+to+the+very+being+of+the+Church.+Therefore+some+part+of+the+outward+government+is+essential+to+the+Church.+I+answer%3A+That+they+are+not+necessary+to+themselves%2C+but+by+accident%2C+because+they+%E3%80%88%E2%80%A6%E3%80%89to+the+inward%2C+as+that+it+cannot+be+without+this.+And+besides%2C+the+Word+and+the+sacraments+are+not+so+much+of+the+outward+government+of+themselves%2C+but+rather+the+carriage+and+manner+of+using+of+them+is+of+the+outward+government.+Lastly%2C+I+answer%2C+they+are+simply+necessary%2C+as+they+are+the+causes+and+gathering+of+the+Church%2C+but+not+as+they+are+parts+of+outward+government.+As+Moses+his+message+and+gathering+of+the+Israelites+to+the+Lord+was+one+thing%2C+his+governing+of+them+another.+So+that+the+Word+and+sacraments+must+be+considered+in+both+these+respects%2C+and+so+in+respect+of+gathering+the+Church%2C+they+are+simply+necessary%2C+not+in+respect+of+governing+of+it.+So+that+outward+government+is+not+simply+necessary+to+the+being+of+the+Church%2C+but+to+the+well-being+only.%E2%80%9D%0A%0A%E2%80%94+John+Randall%2C+Twenty-Nine+Lectures+of+the+Church%E2%80%A6+%28London%2C+1631%29%2C+Lecture+14+Randall+%281570%E2%80%931622%29+was+an+English+puritan+who+held+that+the+particular+form+of+Church+government+is+not+by+divine-right.%2C+pp.+242-44&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6d3d08eca5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6d3d08eca5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/the-church#:~:text=The%20third%20use%20is%20for%20reproof,Church%2C%20but%20to%20the%20well%2Dbeing%20only&amp;text=The%20third%20use%20is%20for%20reproof%20of%20those&amp;text=of%20the%20Church%2C%20but%20to%20the%20well%2Dbeing%20only" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

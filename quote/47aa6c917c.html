<blockquote><p>1. Of God’s Covenant of Works, with the First Adam, and his natural seed before the fall. APHORISM I. GOD was pleased to enter into covenant with the first Adam, before his fall. Under the term, Adam, Scripture sometimes comprehends both sexes, both Adam and his wife. And if any shall contend that God entered into covenant with both Adam and we at once, as the complete root of mankind, I shall not much gainsay: and yet this will not so easily be proved, nor know I any inconvenience that would follow, should it be denied, the woman coming of Adam as well as any of his posterity. Nor am I ignorant that some are of opinion, that Adam received the covenant alone, and was to teach it, and did teach it to his wife, which opinion hath the more weight, because when God forbids the Eating of the tree of knowledge under pain of death, (wherein the promise of life contrariwise is implied,) he speaks only in the singular number, viz. to Adam only. But how may it be evidenced, That God entered into covenant with the first Adam, even into a Covenant of Works, before the Fall? Answ. Though it be not positively and plainly said in Scripture, that God gave Adam a Covenant of Works, before his fall: and though the characters and footsteps of this covenant are not so expressly discovered in Holy Writ, as of some others; yet notwithstanding, upon sundry Scripture-grounds and considerations, it may be evinced sufficiently. As, From the Inscription of the Covenant of Works in Adam’s heart. Before the Fall God wrote the Covenant of Works, viz. The Substance of the Moral Law, perfectly in Adam’s heart; and in so doing, entered into Covenant with him. Here are three thing in this Position to be cleared; viz. That the Moral Law is the Covenant of Works. That this Moral Law was perfectly written in Adams heart before the Fall. That God in Writing the Moral Law in his heart, entered into Covenant of Works with him.

1. That the Moral Law (abstractly and precisely in its self considered, without the additionals, viz. the preface, ceremonial law, &amp;c. jointly promulgated with it in Horeb) is the Covenant of Works is manifest; (1) Because, the Moral Law (by which is the knowledge of sin, and which works wrath) is styled by the Apostle “The Law of works,” and is set in opposition to “The Law of Faith.” Now this Law of Works, and Law of Faith, amount in effect to as much as the Covenant of works, and Covenant of Faith. (2) Because Righteousness and life were at first by the Moral Law, and should have been so still, had not the Law become unable to give Righteousness and life, in that it was weak through the flesh, man through Sin being unable to keep it. Now the Law, requiring obedience, and promising life upon that condition, must needs be a covenant, and that a Covenant of Works: Works being the proper Condition of it.

2. That this Moral Law for Substance was perfectly written in Adams heart before the Fall, is certain; (1) Because, Man was made in God’s image upright, and perfect. And consequently was thoroughly furnished with all accomplishments of upright and perfect Humane nature: and particularly with the Moral Law, that Law of Nature; The substance whereof was engraved both in his mind, by natural light, knowing it; and in his will, by natural integrity conforming unto it. (2) Because, The Work of the Law remains imperfectly written in some dim characters in the very hearts of pagans and heathens since the fall; They doing by nature the things contained in the Law, and being a Law unto themselves, without the Law of God written. Whence we may strongly conclude that much more before the fall the Moral Law was perfectly written in Adam’s heart, there being in him no sin to deface it in the least degree.

3. That, God, in writing the Moral Law in Adam’s heart, entered into Covenant of Works with him. viz. by real impressions upon his heart: though not by verbal expressions to the ear. For by this Law written in Adam’s heart, he had laid before him, what obedience was required and assented to on Adam’s part: And what recompense should be performed on God’s part. And this was at least an implicit, if not an explicit, covenanting. 2. From God’s express prescription of a positive Law unto Adam in his innocent State. God’s positive Law is laid down in these words, “And the LORD God commanded the man, saying, of every Tree of the Garden you may freely eat: But of the Tree of the Knowledge of good and evil, you shall not eat of it; for in the day that you eat thereof thou shall surely die.” Here are parties covenanting, and agreeing upon terms, viz. God and Adam: Here are also terms agreed upon and matters covenanted reciprocally by these parties; Adam on his part was to be obedient to God, in forbearing to Eat of the Tree of Knowledge only: God on his part, for present, permits Adam to eat of all other Trees of the Garden; And for future (in his explicit threatening of death in case of disobedience,) implicitly promises life in case of obedience herein. Now where there are parties covenanting and agreeing upon terms: And terms mutually agreed upon by those parties, as here; there’s the substance of an express covenant, though it be not formally and in express words called a covenant.</p></blockquote>

<blockquote><p>We can never state our thoughts aright in this matter, unless we have a clear apprehension of, and satisfaction in, the introduction of grace by Jesus Christ into the whole of our relation unto God, with its respect unto all parts of our obedience. There was no such thing, nothing of that nature or kind, in the first constitution of that relation and obedience by the law of our creation. We were made in a state of immediate relation unto God in our own persons, as our creator, preserver, and rewarder. There was no mystery of grace in the covenant of works. No more was required unto the consummation of that state but what was given us in our creation, enabling us unto rewardable obedience. “Do this, and live,” was the sole rule of our relation unto God. There was nothing in religion originally of that which the gospel celebrates under the name of the grace, kindness, and love of God, whence all our favourable relation unto God doth now proceed, and whereinto it is resolved; nothing of the interposition of a mediator with respect unto our righteousness before God, and acceptance with him;—which is at present the life and soul of religion, the substance of the gospel, and the centre of all the truths revealed in it.</p></blockquote>

<blockquote><p>CHAP. XVI. Of the Covenant of Works. Righteousness thus set forth in his several parts and branches, has of God’s free goodness a reward belonging to it, (whereupon the same called the Law, or covenant of works;) as contrariwise a punishment in his Justice to those that sin against it: both more or less, as the righteousness or sin abounds. The reward is blessedness, which is the having of all things that make the creature happy, and stands in the fruition of God’s love, or, from thence coming, a conjunction and communion with him. Conjunction is the enjoying of his personal presence. Communion is a participation (in some sort) of his blessedness both kingdom power and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-fenner.html">Dudley Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sacred Doctrine of Divinitie</cite>, (London, 1599, repr. 1613), 9. [Spelling modernized]</span></figcaption>

<div class="actions"><button class="copy" data-copy="“CHAP. XVI. Of the Covenant of Works. Righteousness thus set forth in his several parts and branches, has of God’s free goodness a reward belonging to it, (whereupon the same called the Law, or covenant of works;) as contrariwise a punishment in his Justice to those that sin against it: both more or less, as the righteousness or sin abounds. The reward is blessedness, which is the having of all things that make the creature happy, and stands in the fruition of God’s love, or, from thence coming, a conjunction and communion with him. Conjunction is the enjoying of his personal presence. Communion is a participation (in some sort) of his blessedness both kingdom power and glory.”

— Dudley Fenner, The Sacred Doctrine of Divinitie (London, 1599, repr. 1613), 9. [Spelling modernized]">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CCHAP.+XVI.+Of+the+Covenant+of+Works.+Righteousness+thus+set+forth+in+his+several+parts+and+branches%2C+has+of+God%E2%80%99s+free+goodness+a+reward+belonging+to+it%2C+%28whereupon+the+same+called+the+Law%2C+or+covenant+of+works%3B%29+as+contrariwise+a+punishment+in+his+Justice+to+those+that+sin+against+it%3A+both+more+or+less%2C+as+the+righteousness+or+sin+abounds.+The+reward+is+blessedness%2C+which+is+the+having+of+all+things+that+make+the+creature+happy%2C+and+stands+in+the+fruition+of+God%E2%80%99s+love%2C+or%2C+from+thence+coming%2C+a+conjunction+and+communion+with+him.+Conjunction+is+the+enjoying+of+his+personal+presence.+Communion+is+a+participation+%28in+some+sort%29+of+his+blessedness+both+kingdom+power+and+glory.%E2%80%9D%0A%0A%E2%80%94+Dudley+Fenner%2C+The+Sacred+Doctrine+of+Divinitie+%28London%2C+1599%2C+repr.+1613%29%2C+9.+%5BSpelling+modernized%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5dd4f05610.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5dd4f05610.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/01/dudley-fenner-the-covenant-of-works-promised-blessedness/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-654774880c" data-kw="">
<blockquote><p>The covenant of God generally is a promise under some one certain condition. And it is twofold; the first is the covenant of works; the second is the covenant of grace. Paul ( Gal. iv. 24) expressly sets down two covenants, which in the Old Testament were shadowed by two women, as by types, to wit, Hagar, the handmaid, and Sarah, the free woman; for, saith he, these be those two covenants. Let us then speak something of these two covenants; and first of the covenant of works. The covenant of works, which may also be called a legal or natural covenant, is founded in nature, which by creation was pure and holy, and in the law of God, which in the first creation was engraven in man’s heart. For after that God had created man after his own image, pure and holy, and had written his law in his mind, he made a covenant with man, wherein he promised him eternal life, under the condition of holy and good works, which should be answerable to the holiness and goodness of their creation, and conformable to his law. And that nature thus beautified with holiness and righteousness and the light of God’s law, is the foundation of the covenant of works, it is very evident; for that it could not well stand with the justice of God to make a covenant under condition of good works and perfect obedience to his law, except he had first created man pure and holy, and had engraven his law in his heart, whence those good works might proceed. For this cause, when he was to repeat that covenant of works to the people of Israel, he first gave the law written in tables of stone; then he made a covenant with his people, saying, Do these things, and ye shall live. Therefore the ground of the covenant of works was not Christ, nor the grace of God in Christ, but the nature of man in the first creation holy and perfect, endued also with the knowledge of the law. For, as touching the covenant of works, there was no mediator in the beginning between God and man, that God should in him, as in and by a mediator, make his covenant with man. And the cause that there was no need of a mediator was this, that albeit there were two parties entering into a covenant, yet there was no such breach or variance betwixt them that they had need of any mediator to make reconciliation between them; for, as for the covenant of works, God made this covenant with man, as one friend doth with another. For in the creation we were God’s friends, and not his enemies. Thus far of the ground of the covenant of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of God’s Effectual Calling in Select Works of Robert Rollock</cite>, (1597), trans. 1849, 34–35.</span></figcaption>

<blockquote><p>Controversy – Did man before the Fall have the promises of a blessed life and the glory of heaven? We affirm against the Socinians and Anabaptists. Arguments:

1. The covenant of God, “Do this and live,” only had a place before the Fall and in the case of Christ, but it means, “you will live forever” (Gal. 3:12, 21).

2. The death denounced to man includes eternal death under the dominion of the devil, as we may conclude from Gen. 3:13 and 1 Cor. 15:22; therefore, the promised life was eternal life.

3. The law has only been weakened through sin so that it cannot save (salvare) (Rom. 8:3); therefore, before sin it was able to save (salvare).

4. He had the tree of life, and the thing that it signified was eternal life (Rev. 2:7).</p></blockquote>

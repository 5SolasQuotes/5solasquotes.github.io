</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57754a76e9" data-kw="">
<blockquote><p>Such as truly believe in Christ, and endeavour to walk in all good conscience before him (1 John 2:3), may, without extraordinary revelation, by faith grounded upon the truth of God’s promises, and by the Spirit enabling them to discern in themselves those graces to which the promises of life are made (1 Cor. 2:12; 1 John 3:14, 18–19, 21, 24; 4:13, 16; Heb. 6:11–12), and bearing witness with their spirits that they are the children of God (Rom. 8:16), be infallibly assured that they are in the estate of grace, and shall persevere therein unto salvation (1 John 5:13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Larger Catechism</cite>, Q. 80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a> › <a href="../topics/assurance-peace-and-joy/assurance-of-salvation/assurance-of-grace-and-salvation.html">Assurance of grace and salvation</a></span></div>
<div class="actions"><button class="copy" data-copy="“Such as truly believe in Christ, and endeavour to walk in all good conscience before him (1 John 2:3), may, without extraordinary revelation, by faith grounded upon the truth of God’s promises, and by the Spirit enabling them to discern in themselves those graces to which the promises of life are made (1 Cor. 2:12; 1 John 3:14, 18–19, 21, 24; 4:13, 16; Heb. 6:11–12), and bearing witness with their spirits that they are the children of God (Rom. 8:16), be infallibly assured that they are in the estate of grace, and shall persevere therein unto salvation (1 John 5:13).”

— Westminster Assembly, Westminster Larger Catechism, Q. 80">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSuch+as+truly+believe+in+Christ%2C+and+endeavour+to+walk+in+all+good+conscience+before+him+%281+John+2%3A3%29%2C+may%2C+without+extraordinary+revelation%2C+by+faith+grounded+upon+the+truth+of+God%E2%80%99s+promises%2C+and+by+the+Spirit+enabling+them+to+discern+in+themselves+those+graces+to+which+the+promises+of+life+are+made+%281+Cor.+2%3A12%3B+1+John+3%3A14%2C+18%E2%80%9319%2C+21%2C+24%3B+4%3A13%2C+16%3B+Heb.+6%3A11%E2%80%9312%29%2C+and+bearing+witness+with+their+spirits+that+they+are+the+children+of+God+%28Rom.+8%3A16%29%2C+be+infallibly+assured+that+they+are+in+the+estate+of+grace%2C+and+shall+persevere+therein+unto+salvation+%281+John+5%3A13%29.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+Westminster+Larger+Catechism%2C+Q.+80&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F57754a76e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/57754a76e9.html">Permalink</a><a class="src" href="https://opc.org/lc.html" rel="noopener" target="_blank">Read it online · OPC</a></div>
</figure><figure class="quote" id="q-3966afb32c" data-kw="">
<blockquote><p>X. That our own regeneration can and ought to be known with certainty a posteriori from ourselves, or from those things which we feel in ourselves, 2 Cor. 13:5 with Rom. 8:5, 9, 11, 15–16. But that of other adults is known with the interposed judgment of charity, that is, with hypothetical certainty only, not absolute. Therefore the certainty of faith or of experience does not have place here, unless God has peculiarly revealed it to someone.

XI. That its [regeneration’s] primordial or infantile acts or effects in the second moment seem not rarely to be both more numerous and more perfect, at least more sensible and with greater commotion, than those which are elicited in adolescence or in adult age. Problems:

      1. Whether they are more perfect in themselves, or more sensible, with sensible commotion, devotion, sweetness, and taste?

      2. Whence is this? Whether also from the novelty of the thing, or the nearness of the opposite (namely, of the state and acts of corruption), so that contraries placed next to each other may more easily shine forth—as immediately after disease health is more vehemently felt, after darkness light? Whether God wishes to affect and attract the tender infancy of His own with tastes and sweetness of sensible devotion more than adult age?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2</cite>, (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/assurance-peace-and-joy/assurance-of-salvation.html">Assurance of Salvation</a></span></div>

XI. That its [regeneration’s] primordial or infantile acts or effects in the second moment seem not rarely to be both more numerous and more perfect, at least more sensible and with greater commotion, than those which are elicited in adolescence or in adult age. Problems:

      1. Whether they are more perfect in themselves, or more sensible, with sensible commotion, devotion, sweetness, and taste?

nk" rel="noopener">Share on X</a><a class="perma" href="../quote/3966afb32c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/assurance/#:~:text=X.%20That%20our%20own%20regeneration%20can,sensible%20devotion%20more%20than%20adult%20age&amp;text=X.%20That%20our%20own%20regeneration%20can%20and%20ought&amp;text=sweetness%20of%20sensible%20devotion%20more%20than%20adult%20age" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e969d4333a" data-kw="">
<blockquote><p>This is, therefore, done because the promises of life offered to us in Him are then applied to our use and made effectual to us when we accept them, and in no wise doubt but that we will enjoy those things which the Lord by His own mouth has assured us of. So that the righteousness which we obtain by faith depends upon the free, gracious promises of God, by which God declares and testifies unto us that we are beloved of Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The French Confession</cite>, 1559, Art. 20</span></figcaption>

</figure><figure class="quote" id="q-f773a7b874" data-kw="">
<blockquote><p>Since we have been delivered from our misery by grace alone through Christ, without any merit of our own, why must we yet do good works? Because Christ, having redeemed us by his blood, also renews us by his Holy Spirit to be his image, so that with our whole life we may show ourselves thankful to God for his benefits, and he may be praised by us. Further, that we ourselves may be assured of our faith by its fruits, and that by our godly walk of life we may win our neighbours for Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q&amp;A 86</span></figcaption>

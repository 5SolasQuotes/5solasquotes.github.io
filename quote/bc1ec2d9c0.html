</figure><figure class="quote" id="q-6cb2b4fae1" data-kw="">
<blockquote><p>A leading theory is that the increased risk for depression stems from an altered stress response among birth control pill users. Studies indicate that women on the pill have a blunted cortisol response: In acute stress tasks, they have a slow rise and a gradual fall of cortisol rather than the classic spike that signifies a healthy stress response. Despite the cortisol differences, these women report feeling at least as much stress as non–pill takers… women on the pill also tend to show differences in their inflammatory stress response, which occurs just before the cortisol spike.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zara-abrams.html">Zara Abrams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘How birth control pills affect the brain: Research on cognition, stress responses, and health impacts helps women make informed reproductive health decisions’ in Monitor on Psychology, vol. 56, no. 3 (Apr/May 2025)</cite>, p. 50 ff.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><figure class="quote" id="q-16c407d07f" data-kw="">
<blockquote><p>Whether it was a natural conception or a miraculous one? The latter is affirmed. Whether the flesh of Christ was conceived and formed in an instant? It is denied. Whether it was first conceived and formed and then united? It is denied with a distinction. …. Whether the soul of Christ was infused in the first instantiating of the conception of the body, or rather after? The latter is affirmed. Whether and in what way the embryo, or that body not yet animated, was able to be said to be the body of Christ? It is explained. Whether the flesh of Christ had its beginning from Adam? It is affirmed with a distinction. … Whether in the instantiating of the conception or of the union Christ was sactified by grace? It is distinguished. Whether in the same instantiating it had the use of free choice and reason? It is denied. Whether in the same instantiating, He was able to merit? It is denied. Whether from the first moment of conception Christ enjoyed the beatific vision? It is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Syllabus of Theological Problems… (Utrecht, 1643), Tract 2, On the Person, Offices &amp; States of Christ the Mediator, Title 1, on the Person of Christ the Mediator, Subtitle: On the Assumption &amp; Union of the Human Nature. trans. T. Fentiman | On the Conception &amp; Gestation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whether it was a natural conception or a miraculous one? The latter is affirmed. Whether the flesh of Christ was conceived and formed in an instant? It is denied. Whether it was first conceived and formed and then united? It is denied with a distinction. …. Whether the soul of Christ was infused in the first instantiating of the conception of the body, or rather after? The latter is affirmed. Whether and in what way the embryo, or that body not yet animated, was able to be said to be the body of Christ? It is explained. Whether the flesh of Christ had its beginning from Adam? It is affirmed with a distinction. … Whether in the instantiating of the conception or of the union Christ was sactified by grace? It is distinguished. Whether in the same instantiating it had the use of free choice and reason? It is denied. Whether in the same instantiating, He was able to merit? It is denied. Whether from the first moment of conception Christ enjoyed the beatific vision? It is denied.”

edbooksonline.com/on-when-the-soul-is-joined-to-the-body-in-the-womb/#:~:text=Whether%20it%20was%20a%20natural%20conception,the%20beatific%20vision%3F%20It%20is%20denied." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

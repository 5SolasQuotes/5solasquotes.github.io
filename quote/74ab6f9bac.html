<main class="wrap"><figure class="quote" id="q-74ab6f9bac" data-kw="">
<blockquote><p>The conjecture which some have drawn from these words [‘How shall this be, seeing I know not a man?’], that she had formed a vow of perpetual virginity, is unfounded and altogether absurd. She would, in that case, have committed treachery by allowing herself to be united to a husband, and would have poured contempt on the holy covenant of marriage; which could not have been done without mockery of God. Although the Papists have exercised barbarous tyranny on this subject, yet they have never proceeded so far as to allow the wife to form a vow of continence at her own pleasure. Besides, it is an idle and unfounded supposition that a monastic life existed among the Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Luke</cite>, ch. 1, v. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2cfa4393d8" data-kw="Mary Queen of Heaven Satan Grace">
<blockquote><p>Hence we see how widely the Papists differ from her, who idly adorn her with their empty devices, and reckon almost as nothing the benefits which she received from God. They heap up an abundance of magnificent and very presumptuous titles, such as, &quot;Queen of Heaven, Star of Salvation, Gate of Life, Sweetness, Hope, and Salvation.&quot; Nay more, to such a pitch of insolence and fury have they been hurried by Satan, that they give her authority over Christ; for this is their pretty song, &quot;Beseech the Father, Order the Son.&quot; None of these modes of expression, it is evident, proceeded from the Lord. All are disclaimed by the holy virgin in a single word, when she makes her whole glory to consist in acts of the divine kindness. If it was her duty to praise the name of God alone, who had done to her wonderful things, no room is left for the pretended titles, which come from another quarter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:48-49</span></figcaption>

</figure><figure class="quote" id="q-fa4cbd8681" data-kw="">
<blockquote><p>He turns, in September 1522, to a lyrical defense of the perpetual virginity of the mother of Christ… To deny that Mary remained ‘inviolata’ before, during and after the birth of her Son, was to doubt the omnipotence of God… and it was right and profitable [according to Zwingli] to repeat the angelic greeting – not prayer – ‘Hail Mary’… God esteemed Mary above all creatures, including the saints and angels – it was her purity, innocence and invincible faith that mankind must follow. Prayer, however, must be… to God alone… . p. 395 ‘Fidei expositio,’ [An Exposition of the Faith, 1536] the last pamphlet from his pen [d. 1531]… There is a special insistence upon the perpetual virginity of Mary….</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/affirmation-of.html">Affirmation of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Ulrich Zwingli | G. R. Potter, Zwingli (London: Cambridge Univ. Press, 1976). Also Zwingli, The Perpetual Virginity of Mary…, Sept. 17, 1522, pp. 88-89</span></figcaption>

</figure><figure class="quote" id="q-5466316c74" data-kw="">
<blockquote><p>Mary’s virginity did not flow from a vow, whether on the parents’ part or on her own. With many other fairy tales contrary to the practice of the gens and the nature of wedlock she entered upon, this is a fiction of the Papists, using Lk. 1:34 (‘How shall this be, seeing I know not a man?’) for empty weaving of words, which, whether we translate them in the past with a frequent change of tense, or in the present or even, with reference to Isaiah’s prophecy, in the future, establish not a prayer but only a particular fact. Nor does Christian faith demand that Mary’s virginity be extended perpetually beyond the nativity of Jesus, as the Papists will again have it on the pretext of a vow and the of the excellency of virginity and of the passage Eze. 44:2 dealt with allegorically with this in view… But so far we agree with them against the Helvidians and the Antidico-Marianites, that we believe it more probable that Joseph abstained from conjugal contact with Mary even after the nativity of Jesus, because he sensed a gracious miracle.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-marck.html">Johannes Marck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium Theologiae Christianae</cite>, … (Groningen, 1690), XVIII, section 11 as quoted by Heinrich Heppe, Reformed Dogmatics ed. Ernst Bizer (1950; Wipf &amp; Stock, 2007), ch. 17, section 10, pp. 422-23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

</figure><figure class="quote" id="q-675aaeb028" data-kw="">
<blockquote><p>She who bare (really) bare; and although she was a virgin when she conceived, she was a wife when she brought forth her son. Now, as a wife, she was under the very law of opening the womb, wherein it was quite immaterial whether the birth of the male was by virtue of a husband’s co-operation or not; it was the same sex that opened her womb. Indeed, hers is the womb on account of which it is written of others also: ‘Every male that opens the womb shall be called holy to the Lord.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/tertullian.html">Tertullian</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Flesh of Christ, 23</span></figcaption>

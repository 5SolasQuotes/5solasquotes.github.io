<main class="wrap"><figure class="quote" id="q-c0a2ee307a" data-kw="">
<blockquote><p>By the name of covenant, we understand, not that general earthly, and temporary covenant, which God made, and keepeth with all created things, according to their nature, by the free law of his providence; neither that special covenant, which he entered into, with our first Parents in that state of integrity, a special examination or trial of obedience being added, as also both the promise of a life supernatural, and the threat of a double death being put thereto; the one is of nature, universal, the other of human nature limited by a certain bound of time and state; neither of both are properly pertaining to us, who are to be advanced from the universal nature, and the corruption of particular nature to the communion of supernatural glory: but we understand that covenant, which God entered into with man after his fall, by his special grace: which covenant is one only; for as much as there is but one only way of salvation, though a variable, and divers manner of administering the same, be pointed out: Wherefore, first we must speak concerning the very substance of the covenant: Secondly, of the Forms thereof which diversly it had from the outward manner, and circumstances.

The Covenant then which God entered into with man corrupt, is the free disposition of God, whereby he promiseth eternal salvation, by the death of his Son, to the glory of his Grace. The Efficient cause of this Covenant is God: for here is not the disposition of two parties, which is wont to presuppose the equality of persons, and right, between parties: for such a one can never befall between God and the creature: but it is of God alone, who of his mere will, stroke that covenant with man, whereby he might be advanced from his own nature, unto the communion of God’s grace, and glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius-jr.html">Lucas Trelcatius Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief institution of the common places of sacred divinity. Wherein, the truth of every place is proved, and the sophisms of Bellarmine are reproved</cite>, trans. John Gawen (London: Francis Burton, 1610), 2.10, pp 277-79.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5c532f04d9" data-kw="">
<blockquote><p>Man, after the fall, abides under the covenant of works; and to this day, life is promised him under condition of works done by strength and nature. But if he will not do so well, death and the everlasting curse of God is denounced against him, so long as he is without Christ and without the gospel. And being freed from the covenant of works…he is admitted to the covenant of grace…. Christ, therefore, our Mediator, subjected himself to the covenant of works, and unto the law for our sake, and did both fulfill the condition of the covenant of works in his holy and good life…and also did undergo that curse with which man was threatened in the covenant of works, if that condition of good and holy works were not kept…Wherefore we see Christ in two respects, to wit, in doing and suffering, subject to the covenant of works, and in both respects he has most perfectly fulfilled it, and that for our sake whose Mediator he is become.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Works of Robert Rollock</cite>, 1.52.</span></figcaption>

<blockquote><p>And now, before we close, let us once more entreat you who are unconverted to turn to Jesus. Could ministers but give you some faint idea of Christ’s willingness to save you! If any soul here can declare that it is willing to receive Christ, let it know that Christ is yet more willing to save and to bless. He does not wish you to remain an hour longer a stranger to his love. Why did He suffer? Why did He die? Oh! not merely that He might be glorified in your destruction.</p></blockquote>

<blockquote><p>And will place thee for a covenant. He now states the reason why God promises that he will be a guardian to Christ. Besides, the Prophet spoke of the Jews and the Gentiles separately; not that they differ by nature, or that the one is more excellent than the other, (for all need the grace of God, (Rom. iii.23,) and Christ has brought salvation to all indiscriminately,) but because the Lord assigned the first rank to the Jews, (Matt. x.6,) it was therefore proper that they should be distinguished from the others. Accordingly, before “the partition-wall” (Eph. ii.14) was thrown down, they excelled, not by their merit, but by the favor of God, because with them in the first instance the covenant of grace was made.

It may be objected, “Why is Christ appointed to a covenant which was ratified long before? for, more than two thousand years before, God had adopted Abraham, and thus the origin of the distinction was long previous to the coming of Christ.” I reply, the covenant which was made with Abraham and his posterity had its foundation in Christ; for the words of the covenant are these, “In thy seed shall all nations be blessed.” (Gen. xxii.18.)

And the covenant was ratified in no other manner than in the seed of Abraham, that is, in Christ, by whose coming, though it had been previously made, it was confirmed and actually sanctioned. Hence also Paul says, “that the promises of God are yea and amen in Christ,” (2 Cor. i.20,) and in another passage calls Christ “the minister of circumcision, to fulfill the promises which were given to the fathers.” (Rom. xv.8.) Still more clearly does he declare that Christ is “the peace” of all, so that they who were formerly separated are united in him, and both they who were far off and they who were near are thus reconciled to God. (Eph. ii.17.) Hence also it is evident that Christ was promised, not only to the Jews, but to the whole world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Third</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), viii, 294.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>And surely no Context of Holy Scripture can be solidly explicated, No Common Place of Divinity can be rightly handled, No Polemical or Controversal point can be dextrously descided, No Case of Conscience or Practical Question can be accurately resolved, No Christian Duty can be skilfully urged or advised, without due respect and Scope had to the COVENANT of GOD…. And so should every faithful and skilful Minister have it principally in Design, To be a Preacher of Gods Covenant; and every prudent Christian to be an Hearer and Practitioner of Gods Covenant: Gods Covenant Calling for most intentive respect from them both. So that whilst we are ignorant of the mysteries of Gods Covenant; we are Ignorant of Scriptures, of Christ, and of all Gods gracious Administrations to his Church.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And surely no Context of Holy Scripture can be solidly explicated, No Common Place of Divinity can be rightly handled, No Polemical or Controversal point can be dextrously descided, No Case of Conscience or Practical Question can be accurately resolved, No Christian Duty can be skilfully urged or advised, without due respect and Scope had to the COVENANT of GOD…. And so should every faithful and skilful Minister have it principally in Design, To be a Preacher of Gods Covenant; and every prudent Christian to be an Hearer and Practitioner of Gods Covenant: Gods Covenant Calling for most intentive respect from them both. So that whilst we are ignorant of the mysteries of Gods Covenant; we are Ignorant of Scriptures, of Christ, and of all Gods gracious Administrations to his Church.”

— Francis Roberts, Mysterium &amp; Medulla Bibliorum, Mysterium &amp; medulla bibliorum. The mysterie and marrow of the Bible: viz. God’s covenants with man, in the first Adam, before the fall: and in the last Adam Jesus Christ, after the fall; from the beginning to the end of the world; unfolded &amp; illustrated in positive aphorisms &amp; their explanations (Lo">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+surely+no+Context+of+Holy+Scripture+can+be+solidly+explicated%2C+No+Common+Place+of+Divinity+can+be+rightly+handled%2C+No+Polemical+or+Controversal+point+can+be+dextrously+descided%2C+No+Case+of+Conscience+or+Practical+Question+can+be+accurately+resolved%2C+No+Christian+Duty+can+be+skilfully+urged+or+advised%2C+without+due+respect+and+Scope+had+to+the+COVENANT+of+GOD%E2%80%A6.+And+so+should+every+faithful+and+skilful+Minister+have+it+principally+in+Design%2C+To+be+a+Preacher+of+Gods+Covenant%3B+and+every+prudent+Christian+to+be+an+Hearer+and+Practitioner+of+Gods+Covenant%3A+Gods+Covenant+Calling+for+most+intentive+respect+from+them+both.+So+that+whilst+we+are+ignorant+of+the+mysteries+of+Gods+Covenant%3B+we+are+Ignorant+of+Scriptures%2C+of+Christ%2C+and+of+all+Gods+gracious+Administrations+to+his+Church.%E2%80%9D%0A%0A%E2%80%94+Francis+Roberts%2C+Mysterium+%26+Medulla+Bibliorum%2C+Mysterium+%26+medulla+bibliorum.+The+mysterie+and+marrow+of+the+Bible%3A+viz.+God%E2%80%99s+covenants+with+man%2C+in+the+first+Adam%2C+before+the+fall%3A+and+in+the+last+Adam+Jesus+Christ%2C+after+the+fall%3B+from+the+beginning+to+the+end+of+the+world%3B+unfolded+%26+illustrated+in+positive+aphorisms+%26+their+explanations+%28Lo&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc6349ae5b1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c6349ae5b1.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/11/the-indispensability-of-the-covenant-of-grace/" rel="noopener" target="_blank">Re

<main class="wrap"><figure class="quote" id="q-8fcc09bb8f" data-kw="">
<blockquote><p>‘Go and tell my servant David.’ The Lord speaks very honorably and respectfully of him, owns him to be his servant in other things though he did not choose to employ him in this; and though he was not the person, nor this the time, to build the house of the Lord, yet, as he showed a good will towards it, so far it was acceptable to God:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition of Whole Bible, on 2 Samuel</cite>, ch. 7, v. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“‘Go and tell my servant David.’ The Lord speaks very honorably and respectfully of him, owns him to be his servant in other things though he did not choose to employ him in this; and though he was not the person, nor this the time, to build the house of the Lord, yet, as he showed a good will towards it, so far it was acceptable to God:”

— John Gill, Exposition of Whole Bible, on 2 Samuel, ch. 7, v. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98Go+and+tell+my+servant+David.%E2%80%99+The+Lord+speaks+very+honorably+and+respectfully+of+him%2C+owns+him+to+be+his+servant+in+other+things+though+he+did+not+choose+to+employ+him+in+this%3B+and+though+he+was+not+the+person%2C+nor+this+the+time%2C+to+build+the+house+of+the+Lord%2C+yet%2C+as+he+showed+a+good+will+towards+it%2C+so+far+it+was+acceptable+to+God%3A%E2%80%9D%0A%0A%E2%80%94+John+Gill%2C+Exposition+of+Whole+Bible%2C+on+2+Samuel%2C+ch.+7%2C+v.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8fcc09bb8f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8fcc09bb8f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Go%20and%20tell%20my%20servant%20David,far%20it%20was%20acceptable%20to%20God&amp;text=Go%20and%20tell%20my%20servant%20David.%E2%80%99%20The%20Lord&amp;text=it%2C%20so%20far%20it%20was%20acceptable%20to%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-049f8a4265" data-kw="">
<blockquote><p>Verse 20. ‘And the Lord hearkened to Hezekiah, and healed the people.’ That is, He sanctified them by his Spirit in an extraordinary way; or, He did not punish them, but forgive them that their infirmity, and accepted them as if they had been purified. Verse 22. ‘And Hezekiah spake comfortably to all the Levites, that taught the good knowledge of the Lord.’ That is, he encouraged them in their work, and gave them hope of God’s mercy to the people as concerning those that had eaten the Passover and were not cleansed according to the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-jackson.html">Arthur Jackson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon the Remaining Historical Part of the Old Testament</cite>, ... (Cambridge, 1646) Jackson (1593?-1666) was an English clergyman of strong presbyterian and royalist views; he was ejected in the Great Ejection of 1662. | on 2 Chron. 30, vv. 20 &amp; 22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Verse 20. ‘And the Lord hearkened to Hezekiah, and healed the people.’ That is, He sanctified them by his Spirit in an extraordinary way; or, He did not punish them, but forgive them that their infirmity, and accepted them as if they had been purified. Verse 22. ‘And Hezekiah spake comfortably to all the Levites, that taught the good knowledge of the Lord.’ That is, he encouraged them in their work, and gave them hope of God’s mercy to the people as concerning those that had eaten the Passover and were not cleansed according to the Law.”

</figure><figure class="quote" id="q-0751cb3541" data-kw="">
<blockquote><p>…the retaining and using of temples [church buildings] which have been polluted with idols, be not in itself unlawful, yet the retaining of every such temple is not ever necessary, but sometimes it is expedient for further extirpation of superstition to demolish and destroy some such temples as have been horribly abused to idolatry, as Calvin (Commentary on Dt. 12:2 [80th sermon on Dt., on 12:1-5, pp. 491-92]) also and Zanchius (On the 4th Commandment, col. 709 [in All the Theological Works (1649), vol. 4]) do plainly insinuate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 2, p. 23</span></figcaption>

</figure><figure class="quote" id="q-2e0d54db80" data-kw="">
<blockquote><p>And that David might not think this motion of building God an house displeasing unto Him, although he was not permitted so to do, it is said, 1 King: 8:18, ‘Whereas it was in thy mind to build Me an house, thou didst well,’ which is here omitted, the Lord approved it expressly as a pious intention in David. And lastly because he bent his mind to the building of an house for God, the Lord promises to requite him with the like, and to build him an house, as it is said He did for the midwives of Egypt, He built them houses…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-mayer.html">John Mayer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Whole Old Testament</cite>, ... (London: 1653), on 2 Samuel, ch. 7, p. 390</span></figcaption>

<blockquote><p>First then, Deists object, that the excellent light of reason, derived from God, common to all men and wrought into the inmost frame of their constitution, is quite sufficient for the purpose of instruction and of directing our practice, and consequently any new light, any new revelation, is unnecessary.

Answer. We acknowledge that reason is the gift of God and an excellent gift, nor are we of the number of those who depreciate and vilify it. But this we say, that mankind were inattentive to the light of nature, and that they miserably abused it, as plainly appears from the experience of heathen nations, ancient and modern. That the light of nature was exceedingly obscured by the mistakes and immoral practices of men, so as to be almost extinguished, was a matter well known to the heathens. …

But they say, may we not collect from reason the chief and most important truths of religion, viz. “The existence and perfections of God; the laws of justice, the laws of temperance, &amp;c. Finally, the rewards and punishments of a future state.”

Ans. First, reason may teach some, but not all these truths; revelation adds others very momentous, as we have already demonstrated. Secondly, our present enquiry is not concerning reason, considered in itself, but of reason, such as it was in men, destitute of the aids of revelation. The enquiry is not, what mankind might have known, had they made a proper use of reason, but, whether they had a clear perception of divine things, whether this perception was free from uncertainty, whether it was easily acquired, whether it was not corrupted by any mixture of error? Long experience has evidently evinced the truth of the contrary position.

With respect to us, who by the kindness of Deity, have been enlightened by revelation, the eyes of the whole understanding have been opened by the gospel, we easily deduce the knowledge of divine things from the light of reason. But were we still involved amidst heathenish darkness, Gracious God! How much more imperfectly, how much more indistinctly, entangled in how many errors and absurdities, would we philosophise, concerning all these points? We hence deduce, that the very advantages we receive from the exercise of reason are to be ascribed to the light of revelation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Revealed Religion</cite>, trans. William Crawford (1737; Belfast: James Magee, 1778), § 1, pp 35, 36-37.</span></figcaption>

<blockquote><p>50. Being is divided into substance and accident. … About knowledge of the formal idea of accident one must note that ‘in another’ or ‘in-anotherness’ is correlative, for it involves something in which it is. But to perceive some relation, there is need of knowledge of the terms of the relation in themselves. Our first knowledge of reality, therefore, seems to be knowledge of things as absolute objects and not in their relation to other beings. But when we say that accidents are immediately experienced as beings in another the sense is: this knowledge is not by way of reasoning out but, from phenomenological analysis of the givens of experience, we perceive through simple apprehension this relation of ‘in-anotherness’. Shape, for instance, is not only perceived in itself and as something absolute but also in its relation to extension and color, namely as the limit of a colored expanse. But in other cases it seems we do not immediately perceive the idea of ‘in-anotherness’, but rather we infer it by reasoning out. This happens, for example, with quantity. No wonder then that some, as Descartes, identified extension with material substance as such. … Relative Being to Absolute Being [see pp. 69-72 of the Summary]

52. If there is relative being, absolute being must exist. For once the existence of a purely relative being has been admitted, some other beings must exist, namely subject, term and foundation [p. 69]. But all these are as it were the matter of relation and so are not formally the relation, nor formally ‘existing-to’; therefore they are absolute beings. But even on the other opinion, this proposition can in some way be saved. For if relative being is formally a being of reason with a foundation in the thing, something truly real and therefore absolute is required, namely the foundation itself.

53. From the nature of relation, it is plain that relation cannot be found, nor be known, unless subject, term, and foundation are present and known respectively at the same time. And in this sense can the Aristotelian-Scholastic dictum be understood: ‘relatives are simultaneous in nature and in understanding’. … Proof of God … 7. God knows all individuals, not only as absolute beings and in themselves, but also knows them according to all the relations that one has to all the others. This conclusion too is plain from the perfection of God’s knowledge. … Conclusions Respecting Reality … 29. Every being is good, or being and good convert. Just as ontological truth states the relation of being to the cognitive faculty, so goodness involves a relation to the appetitive faculty, or the will…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Allan Wolter’s Conclusions respecting Reality, Proving God’</cite>, (1958), ‘Conclusions respecting Reality’</span></figcaption>

<blockquote><p>Schoolmen say that a law, properly so called, is both illuminative and impulsive: illuminative, to inform and direct the judgement; impulsive, to move and apply the will to action. (Suarez, Of Laws, bk. 1, ch. 5; Cospensis curs. Theol tract. 13, disp. 1, sect. 1) And accordingly there are two names in this text [Eze. 43:11] given to Christ’s laws and institutions: one which imports the instruction and information of our minds: another which signifies a deep imprinting or engraving (and that is made upon our hearts and affections), such as a pen of iron and other instruments could make upon a stone.</p></blockquote>

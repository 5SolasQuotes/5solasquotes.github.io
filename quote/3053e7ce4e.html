<main class="wrap"><figure class="quote" id="q-3053e7ce4e" data-kw="">
<blockquote><p>D. G. Hart writes that ‘worship in the age of the Holy Spirit is not flashy or visibly powerful but instead is so simple that it appears to be inconsequential.’ As we have seen in this book, that is the great problem most of mainstream Christianity has with corporate worship. The traditionally Reformed approach seems so simple that surely something must change. The two main ways to address this are either to make worship far more exciting and entertaining or to make worship far more ethereal and mystical. At least then the act of worship will seem to be significant. What are these simple and seemingly inconsequential means of worship that are spurned by many Christians today? The word, the sacraments, and prayer, all experienced corporately in the life of the church. They are often referred to as the ordinary (there’s that word again) means of grace. Why “ordinary”? There is certainly nothing about the Scriptures that would attract itself to a modern society that has all but given up on reading. What could a book possibly do to give me a spiritual experience? Similarly, what is so spectacular about bread, wine, and water? The elements of the sacraments are culled from mundane, everyday life. “I can get those things at home,” one might object, “so what makes church so special?” And prayer is certainly far from fantastical. Haven’t we all, in our weakest moments, viewed it as a tedious chore? And yet these elements are to fill the worship service because they are ordained by God to communicate His grace and blessing to us. The early church understood this: “And they continued steadfastly in the apostles’ doctrine and fellowship, in the breaking of bread, and in prayers” (Acts 2:42). Do we? Are we content to persist in and dedicate ourselves to these simple means? We must remember that while they appear simple to the naked eye, the eye of faith will see in them so much more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-landry-cruse.html">Jonathan Landry Cruse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Happens When We Worship</cite>, (RHB, 2020)</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

<blockquote><p>Early in the Reformation the liturgy of Strasbourg [Germany] eliminated the offertory. No collection was taken in the service of worship itself. Nevertheless a chest was put in each of the churches so that on leaving the church worshippers could deposit their alms. The collection of alms as people left worship became characteristic of Reformed churches. We hear of this being the practice of the Reformed Church of Augsburg [Germany]. In Basel [Switzerland], after the minister had given the Benediction, he was to remind the congregation to contribute to the care of the poor, and as the people left the service they put their alms in one of the alms chests which stood near the door.</p></blockquote>

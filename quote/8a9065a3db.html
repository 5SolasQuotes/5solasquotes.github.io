<main class="wrap"><figure class="quote" id="q-8a9065a3db" data-kw="">
<blockquote><p>But we are not hence to conclude that faith recumbs on works; for though every one receives a testimony to his faith from his works, yet it does not follow that it is founded on them, since they are added as an evidence. Then the certainty of faith depends on the grace of Christ alone; but piety and holiness of life distinguish true faith from that knowledge of God which is fictitious and dead; for the truth is, that those who are in Christ, as Paul says, have put off the old man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Catholic Epistles</cite>, 1 John 2:3</span></figcaption>

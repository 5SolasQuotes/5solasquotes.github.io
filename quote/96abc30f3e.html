<main class="wrap"><figure class="quote" id="q-96abc30f3e" data-kw="">
<blockquote><p>Assertion 2: All the goods of the subjects belong not to the king. I presuppose that the division of goods does not necessarily flow from the law of nature [which is more fundamental than the positive laws of society and kings], for God made man, before the Fall, lord of the creatures indefinitely [Gen. 1:26-30]; but what goods be Peter’s, and not Paul’s, we know not [from nature’s law]. But supposing man’s sin, though the light of the sun and air be common to all, and religious places [such as buildings for public worship] be proper to none [as they were provided in his day out of the public funds, by and for all], yet it is morally impossible that there should not be a distinction of meum et tuum, ‘mine and thine’; and the Decalogue forbidding theft, and coveting the wife of another man (yet is she the wife of Peter, not of Thomas, by free election, not by an act of nature’s law) does evidence to us, that the division of things is so far forth (men now being in the state of sin) of the law of nature, that it has evident ground in the law of nations [which is more specific and positive, being built upon the law of nature, but less fundamental than it]; and thus far natural, that the heat that I have from my own coat and cloak, and the nourishment from my own meat are physically incommunicable to any. But I hasten to prove the proposition: If I have leave to permit that, in time of necessity [which is more fundamental than positive, societal laws], all things are common by God’s law [as at Creation], [then] a man travelling might eat grapes in his neighbor’s vineyard, though he was not licensed to carry any [a]way. I doubt if David, wanting [lacking] money, was necessitated to pay money for the showbread, or for Goliath’s sword, supposing these to be the very goods of private men and ordinarily to be bought and sold. Nature’s law in extremity, for self-preservation, has rather a prerogative royal above all laws of nations and all civil laws than any moral king. In this meaning:

1. Any one man is obliged to give all he has for the good of the commonwealth, and so far the good of the king, inasfar as he is head and father of the commonwealth.

2. All things are the king’s, in regard of his public power to defend all men and their goods from unjust violence.

3. All are the king’s, in regard of his act of conservation of goods, for the use of the just owner.

4. All are the king’s in regard of a legal limitation, in case of a damage offered to the commonwealth. Justice requires confiscation of goods for a fault; but confiscated goods are to help the interested commonwealth, and the king, not as a man (to bestow them on his children) but as a king. To this we may refer these called bona caduca et inventa [goods fallen and found], things lost by shipwreck or any other providences…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, question 16, p. 67</span></figcaption>

<blockquote><p>3. Magistrates as magistrates hold forth in their Law abstinence from these sins [of adultery, incest, murder, etc.], not as the ambassadors of Christ, craving subjection of conscience and divine faith to those charges, but only external obedience: For though ministers as ministers crave faith and subjection of conscience to all commandments and inhibitions, as in Christ’s stead, 2 Cor. 5:19-20, yet the magistrate as the magistrate does not crave either faith or subjection of conscience, nor is he in Christ’s stead to lay divine bands on the conscience to submit the soul and conscience to believe and abstain; he is the deputy of God as the God of Order and as the Creator, and Founder, and another of human societies and of peace, to exact external obedience and to lay bands on your hands, not to shed innocent blood, and on your body not to defile it with adultery or incest, nor to violate the chastity of your brother; Hence it is evident that the adversaries are far out who would have ministers who do hold forth commands that lay hold on the conscience and crave faith and soul-submission under the pain of eternal wrath, to do and act as the deputies and vicars of those who have nothing to do with the conscience [such as prelates who simultaneously held civil offices], and have neither office nor authority to crave soul submission or to threaten or inflict any punishment but such as is circumscribed within the limits of time and which the body of clay is capable of; yea, when the magistrate punishes spiritual sins, heresy, idolatry, he punishes them only with temporary punishment.</p></blockquote>

— Samuel Rutherford, The Divine Right of Church Government… (1646), pp. 550-51">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+Magistrates+as+magistrates+hold+forth+in+their+Law+abstinence+from+these+sins+%5Bof+adultery%2C+incest%2C+murder%2C+etc.%5D%2C+not+as+the+ambassadors+of+Christ%2C+craving+subjection+of+conscience+and+divine+faith+to+those+charges%2C+but+only+external+obedience%3A+For+though+ministers+as+ministers+crave+faith+and+subjection+of+conscience+to+all+commandments+and+inhibitions%2C+as+in+Christ%E2%80%99s+stead%2C+2+Cor.+5%3A19-20%2C+yet+the+magistrate+as+the+magistrate+does+not+crave+either+faith+or+subjection+of+conscience%2C+nor+is+he+in+Christ%E2%80%99s+stead+to+lay+divine+bands+on+the+conscience+to+submit+the+soul+and+conscience+to+believe+and+abstain%3B+he+is+the+deputy+of+God+as+the+God+of+Order+and+as+the+Creator%2C+and+Founder%2C+and+another+of+human+societies+and+of+peace%2C+to+exact+external+obedience+and+to+lay+bands+on+your+hands%2C+not+to+shed+innocent+blood%2C+and+on+your+body+not+to+defile+it+with+adultery+or+incest%2C+nor+to+violate+the+chastity+of+your+brother%3B+Hence+it+is+evident+that+the+adversaries+are+far+out+who+would+have+ministers+who+do+hold+forth+commands+that+lay+hold+on+the+conscience+and+crave+faith+and+soul-submission+under+the+pain+of+eternal+wrath%2C+to+do+and+act+as+the+deputies+and+vicars+of+those+who+have+nothing+to+do+with+the+conscience+%5Bsuch+as+prelates+who+simultaneously+held+civil+offices%5D%2C+and+have+neither+office+nor+authority+to+crave+soul+submission+or+to+threaten+or+inflict+any+punishment+but+such+as+is+circumscribed+within+the+limits+of+time+and+which+the+body+of+clay+is+capable+of%3B+yea%2C+when+the+magistrate+punishes+spiritual+sins%2C+heresy%2C+idolatry%2C+he+punishes+them+only+with+temporary+punishment.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%281646%29%2C+pp.+550-51&amp;url=https%3A%2F%2F5solasquotes.github.i

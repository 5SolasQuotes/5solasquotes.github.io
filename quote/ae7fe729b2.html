<blockquote><p>VI. Take the Law and the Testimony for your alone oracle in all things, Isa. 8:20. Set not up your own imaginations, nor yet take any man’s bare assertion for the supreme judge of controversies or rule of right and directory of your way. Listen to ministers and be not lightly suspicious of their judgment, but take nothing upon trust; but see with your own eyes, as they, Acts 17:11…</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e2e0dfb48a" data-kw="">
<blockquote><p>5th Distinction. The faith of fundamentals [of Christianity] is implicit three ways:

1. In respect of the degree of believing;

2. In respect of the object;

3. In respect of the subject, or our adherence to things believed. [1.] In respect of degrees, the faith is implicit and weak three ways, as Calvin may teach:

1. Because we are ignorant of some less-fundamentals;

2. Because we see in a mirror and imperfectly [1 Cor. 13];

3. In respect of believing upon a false ground, as for [believing doctrine solely for] miracles [and not ultimately because it is God’s Word]. [2.] In respect of the object, the certainty is most sure, as sure as that God cannot lie. [3.] In respect of our adherence of understanding and affections: in this respect the knowledge of fundamentals must be certain:

1. By a negative certitude which excludes doubting, and so pastor and people must have a certitude of fundamentals, as Rom. 14:5; Col. 1:9; Heb. 5:12; but for a positive certitude, there is not that measure required in a teacher that is in a scholar, for all the body cannot be an eye, 1 Cor. 12:17, yet is a Christian certitude and fulness of persuasion required even of all Christians, Col. 2:2; Col. 3:16, highest and greatest in its kind, though many may be saved with less; yet a distinct knowledge of fundamentals in all is not necessary by a necessity of the means, necessitate medii, as Beza and Doctor Ames teach (Beza, vol. 1, opul., p. 141; Ames, De C•ust., bk. 4, ch. 2, q. 3). [3. continued] There is a faith of fundamentals implicit in respect of the will and affections, which Papists make a wide faith, as the Jesuit Becanus (2nd part, de V•tu•i. Theolog., ch. 2, q. 3) think[s] to believe these [are the] two fundamentals, 1. That there is a God;

2. That this God has a providence concerning men’s salvation, though other particulars be not known. Or implicit faith is, says Estius (bk. 3, d. 25, q. 2), when any is ready to believe what the Church shall teach; which faith (Suarez says, de Trip., disp. virt. Theolo., 13, section 8), though it include ignorance, yet keeps men from the danger of errors, because it does submit the mind to the nearest rule of teaching, to wit, to the Church; the knowledge of fundamentals in this sense does not save, but condemn. Thomas says better than he (22, q. 2, art. 5).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 2, ch. 4, section 5, pp. 224-9</span></figcaption>

<blockquote><p>…his [Christ’s] servants, who stood firm in their opposition to Prelacy… but if they will have patience to hear me to ‘Amen’ [at the end], I may possibly convince them of a truth they, are not willing to hear; for I not only grant that they have forgotten their Master’s directions, inhibiting them to to lift up themselves above their brethren… they must have leave to put out mine and other men’s eyes besides (which we are not willing to give them; though if any man would gratify his Grace [the king], and their Lordships [the prelates], he must part with these in the first place; for an implicit faith is the basis and foundation of their Kingdom of darkness, without which it would fall about their ears and but overwhelm them in the rubbish… before this come so much as under debate, almost with indifferent men, whether God be angry at their way? His very giving of them up to persecute his people &amp; servants, says nothing, if it say not this, that whatever be their outward prosperity, he has classed them with Pharaoh, in pouring out his plagues upon their heart…</p></blockquote>

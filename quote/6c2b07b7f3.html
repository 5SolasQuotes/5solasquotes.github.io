<main class="wrap"><figure class="quote" id="q-6c2b07b7f3" data-kw="">
<blockquote><p>Q. What are the works that we must decline, and leave undone on the Lord’s day?

A. Not only the works of sin, which we ought to leave undone every day; but also the works of our ordinary callings concerning this life, and all bodily exercises and labours, which upon other days are lawful and necessary to be done.

Q. Is it unlawful to do any bodily work, or worldly business on the Lord’s day?

A. Yea, excepting those works which belong to common honesty, and are necessary for the preservation of life, health, and goods; which otherwise would be in great danger to perish, if they were not saved on that day; or those, which are requisite for the performance of God’s service.

Q. Are we as strictly bound to forbear all worldly labour upon this day, as the Jews?

A. Yes verily, so far as the Commandment reacheth; and more then they, because of the greater measure of God’s graces upon us, above that which was upon them.

Q. What do you say to the making of a fire, and dressing of meat upon the Lord’s day? for neither of these were lawful to the Jews.

A. Not to make a fire, or dress meat on the Sabbath, were proper to the Pedagogy, or manner of government of the children under the Law; as may appear by this, that there was no such thing commanded, before the Law was given by Moses; and therefore it followeth that this was Ceremonial, and not Moral.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Christian religion. Or, the whole body and substance of divinity</cite>, (2nd edn, London: Thomas Man, 1616), pp 113-14.</span></figcaption>

</figure><figure class="quote" id="q-c24b8f5357" data-kw="">
<blockquote><p>‘Say not thou, What is the cause that the former days were better than these? for thou dost not inquire wisely concerning this,’ Eccles. vii. 10. There are some ever telling us that the theology of former times is much superior to that of our day. Some prefer the theology of the so-called fathers of the church, some that of the middle ages, some that of the Reformation, some that of the puritans.

Now we believe that it may be good for us to look to the way in which great and good men have conceived, expressed, and enforced the truth in divers ages, were it only to widen the narrowness of our views, and recall attention to catholic verities which particular ages or sects have allowed to sink out of sight.

Let us by all means rise from time to time above the contracted valleys in which we dwell, and ascend a height whence we may observe the whole broad and diversified territory which God has given us as an inheritance, and the relation of the varied parts which branch out from Christ as the centre, as do the hills and valleys of our country from some great mountain, the axis of its range. There is, we should acknowledge, an attractive simplicity in the expositions of divine truth by the early fathers; and we are under deep obligations to the divines of the fourth century for establishing on Scripture evidence the doctrine of the Trinity.

Those who look into it with a desire to discover what is good, will find not a few excellencies even in the mediaeval divinity, notwithstanding the restraints laid on it by crutches and bandages. It is not to be forgotten that Thomas à Kempis lived in what are called the dark ages; and that we owe to a philosophic divine of that time, not certainly the doctrine of the atonement, which had been in the revealed religion of God since Adam and Abel offered lambs in sacrifice, but a very masterly and comprehensive exposition of that cardinal truth.

Free grace, which had been so limited and hindered in the priestly and ecclesiastical ages, breathes from every page of the Reformers as fragrance does from the flower. The puritan preaching is unsurpassed for clear enunciation of divine truth, accompanied with close, searching, and fervent appeal, which now shakes the whole soul, as the earthquake did the prison at Philippi, and anon relieves it by the command and promise, ‘Believe in the Lord Jesus Christ, and thou shalt be saved.’

But we should put implicit trust in no human, or hereditary, or traditional theology, in no theology except what comes direct from the Bible, interpreted according to the letter, but received after the spirit. How often does it happen that you will know what sect a man belongs to by the favourite passages which ho quotes in his sermons, and in his very prayers, shewing how apt we are to take our very Scriptures from the traditions of our churches. We act as if the well were shut up from us, and as if we were obliged to go to the streams, which may have caught earthliness in their course, and which at the best cannot be so fresh as the fountain. That is the theology best suited to the age which is put forth by living men of the age, drinking of the living word for themselves by the power of the living Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-mccosh.html">James McCosh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction to, The Complete Works of Stephen Charnock, B.D.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>The seventh [day of creation] is the institution of the Sabbath on the seventh day of the world, on which day Christ was promised: and by the promise of Christ which was the greatest blessing given and revealed to the fathers in the old testament, that day came to be the most blessed day of the week, and was sanctified by God to be the weekly Sabbath, until by the full exhibition of Christ a perfect redeemer in his resurrection on the first day of the week, that first day became a more blessed day, and by Christ the Lord of the Sabbath, was sanctified, and had the honour of the weekly Sabbath transferred unto it, and is to be observed of Christians for their holy day of rest, until they come to the eternal rest in heaven.</p></blockquote>

<blockquote><p>2. They [indifferent things] are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands… so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion, yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil.

3. Of the same account is that εὐσχημονία, or decency of religious actions, required by God before Himself… of which the apostle discourses: ‘Every man praying with his head uncovered, dishonoureth his head’ [1 Cor. 11:4]… such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“2. They [indifferent things] are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands… so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion, yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil.

3. Of the same account is that εὐσχημονία, or decency of religious actions, required by God before Himself… of which the apostle discourses: ‘Every man praying with his head uncovered, dishonoureth his head’ [1 Cor. 11:4]… such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.”

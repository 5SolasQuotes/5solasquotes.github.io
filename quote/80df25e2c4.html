<main class="wrap"><figure class="quote" id="q-80df25e2c4" data-kw="">
<blockquote><p>We are not simply ordered to hallow the Sabbath, but we have the addition: “Remember to hallow the Sabbath Day”—not because God wanted to confirm a superstitious observation of days, but that we may be taught to hallow the entire day of the Sabbath and spend it in good works. It is a common and, indeed, very wicked custom to spend only a part of the holy day—and, in fact, the least part of it—on divine worship and to give the rest of that day to worthless idleness or even to dancing and feasting. However, we must remember that the day, not merely several hours of the Sabbath, must be hallowed. Next, when we are ordered to hallow a day, it follows by common sense that a holy day requires also holy works and holy behaviour …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-gerhard.html">Johann Gerhard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Commonplaces: On the Law of God, on the Ceremonial and Forensic Laws</cite>, trans. Richard J. Dinda, ed. Benjamin T. G. Mayes and Joshua J. Hayes (1613; St Louis MO: Concordia Publishing House, 2015), XV.4.9.3. § 126.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-ae8aafe112" data-kw="">
<blockquote><p>Thus we see how the Lord granteth us six days for our bodies, and the seventh day for our souls: not that we must think, that other days are to be separated from this use, but that this day must be wholly severed from other for that use. For, if it were possible, or could be convenient, either in respect of our calling, or the places where we dwell, twice to meet every week day, as it is yet used in some places, though more of custom and fashion, then in faith and of conscience in most of those places, it were nothing but equal. For look what proportion is from six days to the seventh, the same may be gathered from nine, or rather twelve hours to the tenth: whereby the tithe at the least may be afforded for the Lord.

And herein is the only difference between the six days and the seventh, that the worship of God must in the six days be used at such seasons, as in wisdom are so separated and divided to that end, without any hindrance of our lawful and necessary callings, as it doth not take up the principal, but shreds and overplus of our vocation: but on the seventh day we must make such a separation from other days, that what we did but in part, in the week, or working days, we may do in whole on the seventh and Sabbath day.

True it is, that this equity of twice meeting every day, is more convenient for Cities and populous towns, where many dwell together, than in other places and situations, which for distance of place have not the congregation so dwelling together. Here our common distinction of calling the week days working days, and the Sabbath days holy days, taketh away their frivolous assertion, who think that every day should be our Sabbath day, as though we should confound and shuffle together our working days and resting days.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two</cite></span></figcaption>

</figure><figure class="quote" id="q-06c71ceaed" data-kw="">
<blockquote><p>Q. 21. Why doth God mention not only servants but beasts?

A. As he would not have servants enslaved and abused by such labour as should unfit them for sabbath work and comfort, so he would have man exercise the clemency of his nature, even towards the brutes; and beasts cannot labour, but man will be put to some labour or diversion by it: and God would have the whole place where we dwell, and all that we have to do with, to bear an open signification of our obedience to his command, and our reverence to his sanctified day and worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catechising of Families. A Teacher of Householders how to Teach their Households</cite>, (1682) in The Practical Works of Richard Baxter (4 vols, London: George Virtue, 1838), 3: 129.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

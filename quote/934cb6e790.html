<main class="wrap"><figure class="quote" id="q-934cb6e790" data-kw="">
<blockquote><p>The barbarous Irish never thought their hands and weapons better employed than in butchering the Protestants: And this not more from the savageness of their nature, than from the Laws and Doctrine wherein they have so much encouragement for such bloodiness. The least they could expect for it, was full pardon of all sin, such as is promised to those who make War against the Turks, and for the recovery of the Holy Land.

For several Popes had thus rewarded the Irish, for less bloody Feats than these; and thereby testified how meritorious it is, to shed the blood of English Protestants. Charles the Ninth, with the French Papists, never acted any thing with more satisfaction to his Holiness, than that Tragedy in Paris, and other Cities, where so many Thousand Huguenots were most treacherously and inhumanely slaughtered. The Pope would not have so great delight as he took therein to be transient, but that it might afford him a continued entertainment, would have it Painted in his Palace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The case of Protestants in England under a popish prince if any shall happen to wear the imperial crown</cite>, (London: Richard Janeway, 1681), p. 15.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c13cf2cdcd" data-kw="">
<blockquote><p>But the authority of the magistrate in religious matters is not absolute, but limited, and is very different from that of pastors. For, first, he cannot make new articles of faith. Secondly, he cannot force the conscience. Maximilianus Caesar said, that to wish to bear rule over consciences, was to invade the citadel of heaven; and justly, for God alone has authority over the conscience.

Paul does indeed say, that we must submit to the magistrate “for conscience’ sake,” (Rom. xiii. 5); but his meaning is, that we must obey governors, not merely from fear of punishment, but also that we may act agreeably to the dictates of conscience, which commands us to submit to the powers that be according to the ordinance of God. Thirdly, the magistrates cannot preach the word, nor administer the sacraments. Fourthly, he cannot exercise church discipline.

Lastly, he cannot enjoin the ministers to do any thing inconsistent with the rules of the ministry. But on the contrary, the civil magistrate is bound to set up the pure doctrine and worship of God; to preserve them when set up, and to restore them when fallen to decay; to place suitable teachers over schools and academies; to defend the church to the utmost of his power; to allow pecuniary support to ministers of religion; to take care that each minister discharge his duty; to restrain the disturbers of the church’s peace; to build places of worship; to convene synods and assemblies; to sanction, by his authority, ecclesiastical laws, and to prevent the profanation of the holy Sabbath.</p></blockquote>

<blockquote><p>XXV. As every escape, error, or act of unfaithfulness (even known and continued in) whether in a minister’s entry to the ministry, or in his doctrine or deportment, does not non-minister him, nor give sufficient ground to withdraw from, or reject him as a minister of Christ: So neither does every enormity, mis-demeanure or act of tyranny, injustice, perfidy or profanity etc. in the civil magistrate, whether as to his way of entry to that office or in the execution of it, or in his private and personal behavior, denominate him a tyrant or an usurper, or give sufficient ground to divest him of his magistratical power, and reject him as the lawful magistrate.</p></blockquote>

</figure><figure class="quote" id="q-28a5d737cb" data-kw="">
<blockquote><p>I judge a free Parliament, the most natural Ordinance (and the nearest that Divine government which once was) for the true good of a Nation that would not be slaves to sin and man’s will, of any yet known, or in use in the world; and if my Judgement were of any weight in a business of this nature, I would think those the more unnatural to themselves and others, who otherwise speak and act amongst us. Our lusts would be Laws and Judges of them too, and may, as well one as tother; ’tis thus with us, ’tis thus with you; ’tis so in Divinity, ’tis so in morality, ’tis so in the first Table, ’tis so in the second.

Christ meant civil Government really, when he bade us submit to it, and pray for it, and practised it himself by giving to Caesar the things which were Caesars; if in these last and worst days we need it less than then, I do not yet understand it. Wild beasts love no bound, but if this should be, then all the world would be a wilderness, and where should we live without tearing in pieces? I think just Government in a Turk to be a beam of God, and we admire it abroad, and trample upon it at home.</p></blockquote>

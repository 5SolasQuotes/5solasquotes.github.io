<main class="wrap"><figure class="quote" id="q-968fa83779" data-kw="">
<blockquote><p>The power of order alone shall make the difference betwixt the pastor and the ruling elder; for by the power of order, the pastor does preach the Word, minister the sacraments, pray in public, bless the congregation, celebrate marriage, which the ruling elder cannot.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland... (Edinburgh, 1641), pt. 1, ch. 2, ‘Of the Function of Ruling Elders…’</cite>, p. 15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc6148f3bb" data-kw="">
<blockquote><p>‘Do not harshly rebuke an elder.’ He now recommends to Timothy gentleness and moderation in correcting faults. Correction is a medicine, which has always some bitterness, and consequently is disagreeable. Besides, Timothy being a young man, his severity would have been less tolerable, if it had not been somewhat moderated. ‘But exhort him as a father.’ The Apostle enjoins him to reprove elder persons as parents; and he even employs the milder term, ‘exhort.’ It is impossible not to be moved with reverence, when we place before our eyes our father or our mother; in consequence of which, instead of harsher vehemence, we are immediately influenced by modesty. Yet it ought to be observed, that he does not wish old men to be spared or indulged in such a manner as to sin with impunity and without correction; he only wishes that some respect should be paid to their age, that they may more patiently bear to be admonished. ‘The younger as brethren.’ Even towards younger persons he wishes moderation to be used, though not in an equal degree; for the vinegar must always be mingled with oil, but with this difference, that reverence should always be shown to older persons, and equals should be treated with brotherly gentleness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Tim.</cite>, 5:1</span></figcaption>

</figure><figure class="quote" id="q-682902fc1f" data-kw="">
<blockquote><p>We find, that in the ministry of the New Testament there is a comely, beautiful and divine order: one kind of ministers, both ordinary and extraordinary, being placed in degree and dignity before another, as the apostles before all other ministers, the pastor before the elder, and deacon: But we do not find in ministers of the same kind that one has majority of power over others, or priority of degree and dignity before others, except upon the moral respect of age, zeal, gifts, etc. No apostle is in degree above other apostles, no evangelist above other evangelists, nor elder above other elders, no deacon above other deacons: Upon what ground then from Scripture can we believe or conceive that one pastor is in degree superior to other pastors, or that, in all other sorts of ministers, ordinary and extraordinary, there’s all [to] be a parity in their own kind and only in the office of pastors an inequality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unlawfulness and danger of Limited Prelacy, or Perpetual Presidency in the Church, Briefly Discovered (1641)</cite>, p. 4</span></figcaption>

</figure><figure class="quote" id="q-1a810adbbb" data-kw="">
<blockquote><p>Finally Bavinck comes to the controversial topic of women voting for office bearers in the church. He begins this discussion with an overview of where things stand: he notes that there are many churches in America, Australia, Denmark, Norway, Iceland, and Switzerland where women vote. He points out that it was discussed and defended in the Netherlands as early as 1898 by Abraham Kuyper, as well as by pastors A.D.C Kok and C. Lindeboom. Bavinck notes that the issue did not seem to be a pressing one in the Netherlands of his day. Unlike in other countries, men were actively involved in Dutch church life and there didn’t seem to be any desire to have women voting for office bearers. He writes that, with such indifference, it would be foolish to press the issue. However, he notes that if we discuss it in principle, “there is little ground to condemn it.” Bavinck argues that women are equal members of the church with men. They have just as much an interest in having good office bearers as the men do. Because of their nature as women, they tend to actually have quite a great deal of interest in religious matters. Moreover, there are large numbers of widows, women married to “religiously indifferent men,” or women married to men who belong to another church. Without being able to vote, such women are all stripped of the opportunity to have an influence on church life. Bavinck strengthens his argument by noting that while women under the authority of their husbands in the home, as church members they receive the same benefits and should receive the same rights. He notes that young male communicant members who still live with their parents are subordinate to those parents, but yet they have the right to vote. This is unfair. Bavinck says the injustice becomes worse because women are allowed to raise objections to the election of an office bearer – yet they cannot vote. Then he notes that the vote in the church is not an exercise of power. The congregation only points out its preferences for office bearers; the consistory is responsible to call and appoint. He maintains that there is only one objection with any weight: if women can vote in the church, it will not be long before the church will be forced to have women standing as candidates. In other words, women’s voting will lead to women’s ordination. But Bavinck notes that this is an argument from fear. It is an argument that often persuades fearful minds concerned about novelties in the church. However, he points out, if the Scriptures are so strong that women may not serve as office bearers, then we have nothing to fear. The clarity of the Bible should prevent any such development. He then points out that it’s not unusual for people to be able to vote and not be able to stand as a candidate. One does not follow from the other. The requirements for eligibility to vote are often different from the eligibility requirements to stand as a candidate. In the Dutch situation of his time, a public servant, clergyman or teacher was not allowed to be a candidate in a city council election. Writes Bavinck, “Thus eligibility to any office in Scripture is bound by certain requirements, 1 Timothy 3; but no such limits are placed on the power to vote.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wes Bredenhof, ‘Herman Bavinck on Women in the Church’ (2021)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

<main class="wrap"><figure class="quote" id="q-645ce6a9aa" data-kw="">
<blockquote><p>But the Lord is not slack, or, delays not. He checks extreme and unreasonable haste by another reason, that is, that the Lord defers his coming that he might invite all mankind to repentance. For our minds are always prurient, and a doubt often creeps in, why he does not come sooner. But when we hear that the Lord, in delaying, shews a concern for our salvation, and that he defers the time because he has a care for us, there is no reason why we should any longer complain of tardiness. He is tardy who allows an occasion to pass by through slothfulness: there is nothing like this in God, who in the best manner regulates time to promote our salvation. And as to the duration of the whole world, we must think exactly the same as of the life of every individual; for God by prolonging time to each, sustains him that he may repent. In the like manner he does not hasten the end of the world, in order to give to all time to repent.

This is a very necessary admonition, so that we may learn to employ time aright, as we shall otherwise suffer a just punishment for our idleness.

Not willing that any should perish. So wonderful is his love towards mankind, that he would have them all to be saved, and is of his own self prepared to bestow salvation on the lost. But the order is to be noticed, that God is ready to receive all to repentance, so that none may perish; for in these words the way and manner of obtaining salvation is pointed out. Every one of us, therefore, who is desirous of salvation, must learn to enter in by this way.

But it may be asked, If God wishes none to perish, why is it that so many do perish? To this my answer is, that no mention is here made of the hidden purpose of God, according to which the reprobate are doomed to their own ruin, but only of his will as made known to us in the gospel. For God there stretches forth his hand without a difference to all, but lays hold only of those, to lead them to himself, whom he has chosen before the foundation of the world.

But as the verb χωρὢσαι is often taken passively by the Greeks, no less suitable to this passage is the verb which I have put in the margin, that God would have all, who had been before wandering and scattered, to be gathered or come together to repentance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the catholic epistles</cite>, trans. and ed. John Owen (1551; n.p., 1855) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, 419-20.</span></figcaption>

<blockquote><p>First, What is this love of God in Christ? Here I take it actively for the love wherewith He loves us. Love may be considered: First, as an attribute or a perfection in God; so it is said, 1 John 4:8, ‘God is love.’ Which notes his readiness, self-propension or inclination to do good. Secondly, as it relates and passes out to the creature; so there is a common love and a special love. His common love is set forth: Ps. 145:9, ‘The Lord is good to all, and his tender mercies are over all his works.’…</p></blockquote>

</figure><figure class="quote" id="q-0e2c309fd8" data-kw="">
<blockquote><p>We shall now be prepared to understand how the recognition, that the two worlds exist and have existed side by side from the beginning, enables the author of Hebrews to solve the chief problem of the history of redemption and revelation. For it is in Hebrews that the first age and the first world are identified with the first covenant. When, therefore, the question is raised, how the Old Covenant can be identical in substance with the New, what is the common essence, that notwithstanding the great progress from one to the other, makes them two coherent stages in the expression and conveyance of the same spiritual reality, the answer is immediately forthcoming: the same world of heavenly spiritual realities, which has now come to light in the Person and work of Christ, already existed during the course of the Old Covenant, and in a provisional typical way through revelation reflected itself in and through redemption projected itself into the religious experience of the ancient people of God, so that they in their own partial manner and measure had access to and communion with and enjoyment of the higher world, which has now been let down and thrown open to our full knowledge and possession. In other words, the bond that links the Old and the New Covenant together is not a purely evolutionary one, inasmuch as the one has grown out of the other; it is, if we may so call it, a transcendental bond: the New Covenant in its preexistent, heavenly state reaches back and stretches its eternal wings over the Old, and the Old Testament people of God were one with us in religious dignity and privilege; they were, to speak in a Pauline figure, sons of the Jerusalem above, which is the mother of all. This is a profounder solution than is offered in the well-known formula of Augustine: “The New Testament is latent in the Old, the Old Testament lies open in the New.” More profound because, together with the statement of the fact, it gives the reason for the fact. The latent existence of the verities and potencies of the Christian religion in the old dispensation are due to no other cause than that the Christian religion lived even at that time as redemptive truth and redemptive power in the heavenly world and from there created for itself an embryonic form of existence in the life of Israel. The writer of Hebrews would have subscribed to the belief that Christianity is as old as Abraham and as old as Moses, nay as old as Paradise, because it is heaven-born and not the child of earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Redemptive History and Biblical Interpretation</cite>, ed. Richard B. Gaffin Jr. (Phillipsburg, NJ: P&amp;R Publishing, 2001), 199–200.</span></figcaption>

<blockquote><p>No man was ever questioned by God for having too much grace; we may all complain of too little: More grace is the constant desire of every holy soul as there is a propensity in God to give it; ‘To him that has, more shall be given’: God loves to accumulate his favors, to load us with his benefits; he gives liberally that He may draw out our hope to follow Him for more and more still. ‘Let us then abound in hope, holding fast our confidence firm unto the end.&#x27;</p></blockquote>

<blockquote><p>This pattern of definition results in the understanding of mercy as an affection, although there remains among the Reformed orthodox the assumption that the inclination to aid the creature is so intrinsic to the divine nature that mercy also can be understood as an essential attribute of God: the disposition belongs to God essentially, although its transient revelation belongs to the category of affection. (Cf. Brakel, Redelijke Godsdienst, I.iii.35.)</p></blockquote>

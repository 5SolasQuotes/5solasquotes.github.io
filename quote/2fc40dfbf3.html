<main class="wrap"><figure class="quote" id="q-2fc40dfbf3" data-kw="">
<blockquote><p>3. According to the good pleasure and everlasting counsels of the Father, Son, and Holy Spirit, and for the manifestation of the divine glory in the salvation of sinners, the Father, from eternity, entered into a covenant with Son, the Lord Jesus Christ, promising to Him great mediatorial glory, and the eternal life of the elect, upon condition of His fulfilling all righteousness as their Surety.

To the terms of this covenant, the Lord Jesus voluntarily and graciously acceded, and, being accepted as the head and representative of the elect, was invested, with mediatorial offices, and by the oath of God constituted the Surety of the everlasting covenant.

The Holy Spirit participated with the Father and the Son in the formation of the covenant, and graciously undertook to sustain an infinitely important part in its execution. In this covenant there is not only a display of the perfections of the Godhead, but a display of these perfections as subsisting in the persons of the Father, Son, and Holy Spirit, the mystery of trinity in unity being exhibited in a peculiarly convincing and glorious manner in the federal economy.

4. This covenant is sometimes called by the church the covenant of redemption, but more commonly the covenant of grace. The former name is applied to it when it is viewed as an agreement between the Father and the Son that Christ should redeem the elect by satisfying, in their room, all the demands that divine justice had upon them. The latter name is applied to it when it is viewed as originating solely in the sovereign love of the Godhead, and as freely conveying Christ and all blessings in Him to elect sinners, notwithstanding their absolute unworthiness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reformed-presbyterian-church-of-ireland.html">Reformed Presbyterian Church of Ireland</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Testimony of the Reformed Presbyterian Church of Ireland. Part I. Doctrinal and Practical (Belfast: R. Carswell &amp; Son, 1901), pp 23-24.</cite></span></figcaption>

<blockquote><p>IV. This double covenant is proposed to us in Scripture: of nature and of grace; of works and of faith; legal and evangelical. The foundation of this distinction rests both on the different relation (σχέσει) of God contracting (who can be considered now as Creator and Lord, then as Redeemer and Father) and on the diverse condition of man (who may be viewed either as a perfect or as a fallen creature); also on the diverse mode of obtaining life and happiness (either by proper obedience or by another’s imputed); finally on the diverse duties prescribed to man (to wit, works or faith). For in the former, God as Creator demands perfect obedience from innocent man with the promise of life and eternal happiness; but in the latter, God as Father promises salvation in Christ to the fallen man under the condition of faith. The former rests upon the work of man; the latter upon the grace of God alone. The former upon a just Creator; the latter upon a merciful Redeemer. The former was made with innocent man without a mediator; the latter was made with fallen man by the intervention of a mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 8.3.4 (p. 575, modified according to the 1679 edition).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>‘I will make an everlasting covenant with you, even the sure mercies of David.’ The sinner who comes to Christ is in covenant with God. God reveals to that sinner the fulness that’s in the covenant, and out of that covenant fulness he meets the sinner’s every need with the mercies of David.

These are the mercies that were promised to David’s greater Son and Lord, Jesus Christ. David himself recognised that the covenant was something that would survive after his death. ‘He hath made with me an everlasting covenant, ordered in all things, and sure.’ It was a covenant that was finding its fulfilment in Jesus Christ. What is promised to sinners who come to Christ in response to this call is that they will enter into the possession and the enjoyment of all those mercies promised to Christ in the everlasting covenant for his people. You see, the promise was made in eternity. We didn’t exist in eternity, but the Son of God existed, and the promises were made to him, for himself and for his people.

What was promised to him is described here as ‘sure mercies’. All the provisions of the gospel of the grace of God — justification, adoption, sanctification, and all the benefits that flow from them, in this life, at death, and at the resurrection. All these things are sure mercies, because God has promised them and provides them — because Jesus Christ God’s Son has procured them for his people, he met all the conditions — and because the Holy Spirit applies them to his people. That’s how sure they are. That’s how sure the salvation of the sinner who trusts in Christ is — they have the sure mercies of David, covenanted mercies. ‘I will make an everlasting covenant with them,’ as we have it in Jeremiah. The covenant was, ‘I will not turn away from them, but I’ll put my fear in their hearts so that they will not turn away from me’ (Jeremiah 32: 40).

These are sure mercies. God will never abandon us, and we will never abandon God. Although we have in us an evil heart of unbelief, departing from the living God, the Lord will not allow his people to depart. The Lord holds on to them. They may wander, they may fall, they may go through very dark passages. But the Lord’s everlasting arms are underneath them. His mercies are sure. They’re bound up with Christ. Their life is hid with Christ in God (Colossians 3: 3). How more secure could a person be than that? Your life is hid with Christ in God— is there anywhere more secure than in God and bound up with Christ in God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-m-cartwright.html">Hugh M. Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>With An Everlasting Love: Selected Sermons of Rev Hugh M Cartwright</cite>, (Stornoway, Reformation Press. Kindle edition, 2015), pp 144-45.</span></figcaption>

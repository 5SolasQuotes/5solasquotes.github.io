<main class="wrap"><figure class="quote" id="q-7d6e29db6f" data-kw="">
<blockquote><p>Such ceremonies as had signification put upon them were notwithstanding lawful, as is manifest by the consideration of most of those ceremonies mentioned before; the altar by Jordan, the cup used at the Passover, the cover on the heads of women, and the love-feasts with the holy kiss: and so had all the Jewish ceremonies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or, Sermons upon the Second Chapter of the First Epistle of Saint Peter… (London, 1623), on v. 13, pp. 588-90 &amp; 594 Byfield was an Anglican minister that had practical, puritan characteristics, but here takes an Anglican view on ceremonies.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>To those who, in a narrow spirit, insist on having divine prescription for the most insignificant details of religious life and public worship, this appeal to ‘nature itself,’ [v. 14] as a great guide in relation to the decencies of public worship, should read a wholesome lesson. Nature, though uniform in its essential features, varies in all that is subordinate in different regions and at different periods. In matters of feeling, taste, and decorum, as to the way in which the relation of the sexes should be expressed, eastern and western ideas notoriously and widely differ, and they should be allowed their natural and proper development.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-brown.html">David Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1 Cor. 11 in A Popular Commentary on the New Testament, ed. Philip Schaff</cite>, p. 203</span></figcaption>

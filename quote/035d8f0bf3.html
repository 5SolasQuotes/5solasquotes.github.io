<main class="wrap"><figure class="quote" id="q-035d8f0bf3" data-kw="">
<blockquote><p>Here it may be considered whether every adjunct of worship instituted of God does by that institution become a matter or part of worship, which otherwise it would not be. Some say that in the old Law the least ceremony prescribed of God was a part of worship, which assertion I do not now so far examine as to declare my assent or dissent. But if it were so, I think it was not merely as prescribed of God, but upon some further reason. For I do not see that God cannot prescribe a mere adjunct of worship, but it must thereby lose its formal state, or become formally another thing, viz. a matter of worship, but think it may remain in its own state, a mere adjunct still. Nevertheless, the observation of that divinely prescribed adjunct may be an act of worship so far as every act of obedience to God as such may be so called. But here we speak of worship, not in so large, but in the stricter sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, (London, 1684), Of Divine Worship, pt. 1, §16. ‘Of Time &amp; Place considered as Adjuncts, or as Matter of Worship’, pp. 184-85.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

<blockquote><p>§17. 11. He that has commanded us to express our minds in several cases about his worship (as in confession of our sins, in profession of our faith, in choosing of our pastors, in consenting to the casting out or taking in, or restoring of members, in renewing promises of obedience, and the like) has hereby made a profession necessary in general, and so has made it our duty to signify our consent in all these cases by some convenient sign: For man’s mind is not known to others but by signs. But He has not tied us absolutely to any particular sign. If a confession of faith be read, and we are called to signify our consent, or if we are called to signify our consent to be Church-members, or to be guided by our pastors, or submit to discipline; God has not tied us in such cases, whether we shall signify this consent by speaking, or by subscribing our names (Isa. 44:3-5) or by lifting up the hand, or by laying it on a Book (as in swearing) or by standing up, or such like. A sufficient signification or profession of our minds is necessary; but the special sign is left to our own, or our governor’s determination. Of which I shall speak more anon. §18. To this end, and on these terms was the sign of the cross used heretofore by Christians, and to this end they used standing in public worship every Lord’s Day (forbidding kneeling) and afterward standing up at the [saying of the Apostles’] Creed: as also adoring with their faces towards the east, etc. They used these only as significations of their own minds, instead of words; As the prophets of old were wont by other signs, as well as words to prophesy to the people… And I dare not condemn the cautelous [prudent, cautious] use of such professing signs as these: Though the tongue be the chief instrument, yet not the only instrument to express the mind; and though words be the ordinary sign, yet not the only sign. Dumb men must speak by other signs: And usually more silent signs are fitter for assemblies, to avoid disturbance: And sometimes more permanent signs (as subscription, or a stone or pillar of remembrance, as Josh. 24, etc.) are more desirable. And this is left to human prudence. §19. And therefore I durst not have reproved any of the ancient Christians that used the sign of the cross merely as a professing signal action, to show to the heathen and Jews about them that they believed in a crucified Christ, and were not ashamed of his cross. The occasional, indifferent use of this, when it is merely to this end, I durst not have condemned. Nor will I now condemn a man that, living among the enemies of a crucified Christ, shall wear a cross in his hat, or on his breast, or set it on his doors, or other convenient place, merely as a professing sign of his mind, to be but instead of so many words, q. d. [as to say] ‘I thus profess myself the servant of a crucified Christ, of whom I am not ashamed.’ Whether these things be fit or unfit, the time, place, occasion and other circumstances must show: but the lawfulness I dare not deny. … §40… I think neither magistrate nor synod should do any more than hinder undecency: But yet if they do more, and tie all to one habit [garment] (and suppose it were an undecent habit), yet this is but an imprudent use of power. It is a thing within the magistrate’s reach; He does not an alien work, but his own work amiss: and therefore the thing in itself being lawful, I would obey him and use that garment if I could not be dispensed with [it]. Yea though secondarily the whiteness be to signify purity, and so it be made a teaching sign, yet would I obey: For secondarily, we may lawfully and piously make teaching signs of our food and raiment, and everything we see. But if the magistrate had said that the primary reason or use of the surplice was to be an instituted sacramental sign, to work grace on my soul, and engage me to God, then I durst not have used it, though secondarily it had been commanded as a decent garment. New sacraments I durst not use, though a secondary use were lawful. … §57. That it [the minister making the sign of the cross in baptism] is ordained for this use, appears from the words (anon to be recited) in the use of it, and by those words prefixed before the Common Prayer Book, ‘of ceremonies; why some are abolished and some retained,’ where they say that they ‘be not dark and dumb ceremonies, but are so set forth that every man may understand what they do mean, and to what use they do serve,’ and ‘that they are such as are apt to stir up the dull mind of man, to the remembrance of his duty to God, by some notable and special signification, whereby he might be edified.’ So that this and such other (if there be more such) are appointed by their signification to teach the understanding, and stir up the dull mind of man to the remembrance of his duty to God: Which are good works, but to be done only by good means. [Baxter goes on to take exceptions to the use of the cross in baptism]</p></blockquote>

<blockquote><p>Question. After the ministry of the Word and the seals, how is the freewill-offering, or collection for the saints, to be administered? Answer:

1. For the time, it is to be made every Lord’s Day, which is the first day of the week.

2. For the measure, as God hath prospered every man. 3 For the manner; not of constraint, but freely, and to be presented, as an offering to the Lord, and laid down, as at first before the apostles, so afterward, by their appointment, before the deacons of church, as into a common treasury.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenport.html">John Davenport</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Catechism Containing the Chief Heads of Christian Religion</cite>, … (London, 1659), ‘Concerning the Subject of this Application’, p. 43</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“Question. After the ministry of the Word and the seals, how is the freewill-offering, or collection for the saints, to be administered? Answer:

1. For the time, it is to be made every Lord’s Day, which is the first day of the week.

2. For the measure, as God hath prospered every man. 3 For the manner; not of constraint, but freely, and to be presented, as an offering to the Lord, and laid down, as at first before the apostles, so afterward, by their appointment, before the deacons of church, as into a common treasury.”

<blockquote><p>And these temporal circumstances, whether of evening or night-time, or of the sixth day of the week [i.e. Thursday night] or that particular day of the year (i.e., of the third day before Christ’s resurrection), and also of the place (i.e. a private place), do not have any force of prescribed necessity or of observance. Nor do the following facts have any force of being required or observed: that the supper was given to them after they had eaten a meal, after their feet had been washed, when they were lying at table, and even that there were twelve in number (some of which were observed for some time in the early church).</p></blockquote>

<blockquote><p>It is wont to be excepted against this that Christian Liberty stands not in the freedom of outward actions, but only in the freedom of conscience. As long therefore as there is no doctrinal necessity put upon the conscience to limit the lawfulness of the use of outward things, Christian Liberty is preserved, though the use and practise of outward things be limitted. Whereto I answer 1. that the apostle in this case leaves the people of God at liberty, not only in point of conscience for lawfulness to marry [1 Cor. 7], but even in outward actions and practise, ‘Let him do’ (says he) ‘what he will; he sins not, let him be married,’ verses 30 &amp; 38, as who should say, the conscience being free from sin in it, I will put no tie on the outward practice to restrain it. 2. That true Christian Liberty consists principally in the free, actual use of things lawful and indifferent in themselves, and the prohibition of their free, actual use to Christians is expressly censured as anti-evangelical, a badge of false apostles, of apostates from the faith, hypocrites, men of seared consciences, anti-Christian usurpers, 1 Tim. 4:1,3-4: ‘Now the Spirit speaks expresly that in the later times some shall depart from the faith, giving heed to seducing spirits and doctrines of devils, speaking lies in hypocrisy, having their consciences seared with a hot Iron, forbidding to marry, and commanding to abstain from meats which God has created to be received with thanksgiving: for every creature of God is good, and nothing to be refused if it be received with thanksgiving; For it is sanctified by the Word of God and prayer.’ Col. 2:20-21: ‘Wherefore if ye be dead with Christ from the rudiments of the world; why as though living in this world are ye subject to ordinances?’ (or canons) ‘touch not, taste not, handle not’ (no not God’s ordinances, sacraments, creatures but in such vestiments, gestures, postures) ‘which all are to perish with the using; which things have indeed a show of wisdom in will-worship and punishing of the body.’ 1 Cor. 4:5-6: ‘Have we not power to eat and to drink? Have we not power to lead about a sister, wife, as well as other apostles, and as the brethren of the Lord and Cephas?’ compared with verses 19 to 24. Rom. 14:2-3: ‘For one believeth that he may eat all things another who is weak eateth herbs; Let not him that eateth despise him that eateth not; and let not him which eateth not, judge him that eateth; For God hath received him. Who art thou that judgest another man’s servant? To his own master he standeth and falleth. But why dost thou judge thy brother’ (or refrain him in the use of things indifferent) ‘or why dost thou set at nought thy brother? We shall all stand before the judgement seat of Christ? etc. Let us not therefore iudge one another any more, but judge this rather that no man put a stumbling block or an occasion to fall in his brother’s way, etc.’ to wit, by any restraints, canons, inhibitions, censures, in or concerning things or ceremonies that are but indifferent, and not absolutely necessary by God’s prescription, or the nature of the things themselves. Therefore to prohibit any ministers of the gospel who are able and faithfull to preach the Word, or to excommunicate or cast them, or any other consciencious Christians out of the Church, or debar them from the sacrament, because they cannot wear a surplice, kneel at the Lord’s Table or Supper, or conform to every punctilio in the Liturgy or Canons, and to deny them their Christian Liberty in the free use or forbearing of ceremonies which are only decent and indifferent, indirectly repugnant to Christian Liberty, the Gospel of Christ, and to Acts 4:18-20; ch. 5:27-29, 41-42; 1 Thess. 2:14-16; 3 John 9-10; Rev. 13:16-17; 1 Cor. 7:8-9, 25-28, 35-40; Gal. 5:13-14.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-482ef3c483" data-kw="">
<blockquote><p>It’s further also to be observed in the general, that God has always had apparitions suitable to the matter in hand. Thus He appeared in a burning bush to Moses, like an armed man to Joshua; and with all signs of majesty, and a great God, being to deliver laws to the people that they might see how potent He was to be avenged for every breach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or, A Vindication of the Moral Law &amp; the Covenants… (London: Young, 1647), lecture 16</cite>, p. 154</span></figcaption>

<blockquote><p>if any man go about to express God’s Majesty by any shape: he does Him wrong, and it is high treason to Him, because He is uncomprehensible in his glory… Now we see that the Papists have gone about to express God by shapes: therefore it follows that they have marred all religion. And whereas they allege that there were cherubins painted upon the vail of the Temple, and that two likewise did cover the ark: it serves to condemn them the more. When the Papists pretend that men may make any manner of image: What, say they? Has not God permitted it? No: but the imagery that was set there, served to put the Jews in mind that they ought to abstain from all counterfeiting of God, insomuch that it was a mean to confirm them the better, that it was not lawful for them to represent God’s Majesty, or to make any resemblance thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sermons of… Calvin upon the Fifth Book of Moses… (London: Middleton, 1583), Sermon 23, the 5th upon Dt. 4</cite>, p. 138</span></figcaption>

</figure><figure class="quote" id="q-b07f9bac9e" data-kw="">
<blockquote><p>We have also the holy scriptures which declare unto us the wonderful works of God, by which things we may be lead to the knowledge of God without painted or carved images. Now peradventure some will say that Christ has a body, and likewise have saints, and therefore of them we may have images although of God there can be made no image. And further they wil say that the cause why images were forbid was peril of idolatry, and worshipping of them. So that where there is no such peril, we may have images. Yet as I will not utterly deny but they may be had, so I think it more convenient for Christ’s religion that they should be taken out of Christian men’s churches than that they should be placed in the temple [church building] of God. And of this my opinion I will show you certain good grounds, to the intent that whan you be demanded why we English men have no images in our churches, you may be able to make thereunto a reasonable answer, and that also in time to come you may declare to your children what abuses have crept into the church by the occasion of images…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Instruction into Christian Religion, (London: 1548), A Short Instruction Concerning the Ten Commandments, First Sermon, no page numbers</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

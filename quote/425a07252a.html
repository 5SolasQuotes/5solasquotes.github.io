<blockquote><p>Sanctification then may be described [as] The grace of God infused into the soul of a sinner, and purifying it by faith… Thirdly, both sanctification and justification are alike owing to faith as their immediate cause, next under God’s Spirit, as may be gathered from the prayer of Christ for his disciples: ‘Sanctify them through thy truth: thy word is truth,’ [Jn. 17:17] that is, the doctrine of Faith, received. To which faith, the effect of sanctification is ascribed by St. Peter in the Acts, whereby the hearts of the gentiles were purified or sanctified. (Acts 15:9 [‘And put no difference between us and them, purifying their hearts by faith.’])</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-574bb6ee1e" data-kw="">
<blockquote><p>A disposition to good works is necessary to justification, being the qualification of an active and lively faith… Sincere, uniform and constant [obedience], though imperfect in measure and degree, and this is so necessary that without it there is no salvation to be expected. The Covenant of Grace calls for perfection, accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection was rigidly exacted, no flesh could be saved: if not at all commanded, imperfection should not be sin, nor perfection to be labored after. The faith that is lively to embrace mercy is ever conjoined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, does ever attend that faith whereby we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life, than it does virtually or actually lead us forward in the way to Heaven. For: ‘If we say we have fellowship with God and walk in darkness, we lie and do not the truth: But if we walk in the light, as He is in the light, we have fellowship one with another,’ 1 Jn. 1:6-7. This walking in the light as He is in the light is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins, or actual approbation with God. The truth of which doctrine St. John likewise ratifies in terms equivalent, in the words presently following: ‘and the blood of Christ cleanseth us’ (walking in the light as God is in the light) ‘from all sin.’ [v. 7]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, pp. 20-21</span></figcaption>

<blockquote><p>Controversy XI: Can the justified men fulfill God’s law? Orthodox Position: None of the justified can perfectly keep God’s law, as Scripture teaches (Romans 8; Galatians 3), experience, and the Church Fathers. The perfection of the righteous, mentioned in Matthew 5:48 and Genesis 6:9, 17:1, Philippians 3:15, consists in the imputation of Christ’s justice and in sincerity and uprightness, which consist in acknowledging one’s own imperfection and firmly resolving to obey all of God’s commandments. [Romanist] Position of [Robert] Bellarmine: The justified men can keep God’s law, not by the forces of free will, but by the aid of God’s grace, that is, by the spirit of faith and charity infused in justification. The reasons are:

1. Christ’s yoke is easy, and His commandments are not burdensome (Matthew 11; 1 John 5).

2. God gives us His Spirit, who makes us walk in His ways (Ezekiel 36). That is why the apostle says in Philippians 4:13 that he can do all things.

3. The elect are endowed with charity (John 13, 15; 1 John 3, 4). Charity is the fulfillment of the law (John 14; Romans 13).

4. We read about many saints who kept God’s commandments blamelessly and were perfect and truly righteous (Genesis 6, 17; 1 Samuel 14, 15; 2 Samuel 23; Luke 1).

5. God is not like a tyrant who demands impossible tributes from His friends. Therefore, the Church Fathers teach that no one is obligated to do the impossible.

6. Christ died so that the justice of the law might be fulfilled in us (Romans 8:4).

7. Man can do more than is commanded (Matthew 19:21). [The Reformed] Censure: 1.2. God’s commandments are not only possible but also easy for the elect, not by their own strength but by God’s grace. Furthermore, the defects found in their works are graciously forgiven by God. 3.4. Perfection of parts and sincerity are attributed to the elect, not absolute and supreme perfection, which is called perfection of degrees. Though the elect love God, the mode of this love in this life is imperfect.

5. Not every obligation to do the impossible is unjust, especially when one has incurred a debt by one’s own fault. Moreover, God requires from His own what is possible through Christ.

6. The substance of God’s law is fulfilled in us when we are justified in Christ according to the perfect formula of the law.

7. The conditional is not categorical. Christ is not saying here what the arrogant young man could do but refuting him for his false hope of justice. Moreover, it is true that there are works of supererogation, but in Christ. . Controversy XII: Are the good works of the justified truly pure? Orthodox Position: The good works of the justified, considered in themselves, are wrapped in many defects and are therefore not absolutely pure but only relatively, considering the justified person, who is pure in Christ. Scripture teaches this (Psalm 130; Romans 7; 1 Corinthians 13; James 3). Experience also confirms this, as we experience various temptations in thoughts, words, and deeds. The Church Fathers, like Bernard, also approve this: “If there is any justice in us, it is humble, perhaps upright, but not pure.</p></blockquote>

<blockquote><p>First, in the Creation; his essence and attributes are clearly revealed, his absolute power, unerring wisdom, and infinite goodness are discovered to every capacity; therefore the apostle urges this as the most proper argument to convince the heathens, Acts 14:15, ‘That they should turn from their vanities, to the living God which made heaven and earth, and sea, and all things that are therein.’ To this they must naturally assent, as shadows represent the figure of those bodies from whence they are derived; so in the world there are such traces of the divine perfections that it is easy to infer there is a Sovereign being which is the cause of it; all the creatures and their various excellencies are as so many beams which reflect upon this Sun, or lines which direct to this Center; nay, the meanest being carries some impression of the first cause, as the image of a prince is stamped upon a penny, as well as upon greater money; the beasts will instruct, and the mute fishes teach the atheist there is a God; and though he is not discerned by the outward sight, yet the understanding will as certainly discover him as it does an invisible spirit in a living body…</p></blockquote>

<blockquote><p>3. Though we must not conceive of God as of a human or corporeal shape, yet we cannot think of God without some reflection upon our own being. We cannot conceive Him to be an intelligent being, but we must make some comparison between him and our own understanding nature, to come to a knowledge of him. Since we are enclosed in bodies, we apprehend nothing but what comes in by sense, and what we in some sort measure by sensible objects. And in the consideration of those things, which we desire to abstract from sense, we are fain to make use of the assistances of sense and visible things: And therefore when we frame the highest notion, there will be some similitude of some corporeal thing in our fancy; and though we would spiritualize our thoughts, and aim at a more abstracted and raised understanding, yet there will be some dregs of matter sticking to our conceptions; yet we still judge by argument and reasoning, what the thing is we think of under those material images. A corporeal image will follow us, as the shadow does the body: While we are in the body, and surrounded with fleshly matter, we cannot think of things without some help from corporeal representations: Something of sense will interpose itself in our purest conceptions of spiritual things; for the faculties which serve for contemplation, are either corporeal, as the sense and fancy, or so allied to them that nothing passes into them but by the organs of the body; so that there is a natural inclination to figure nothing but under a corporeal notion, till by an attentive application of the mind and reason to the object thought upon, we separate that which is bodily from that which is spiritual, and by degrees ascend to that true notion of that we think upon, and would have a due conception of in our mind. Therefore God tempers the declaration of Himself to our weakness, and the condition of our natures. He condescends to our littleness and narrowness, when he declares himself by the similitude of bodily members. As the light of the sun is tempered, and diffuses itself to our sense through the air and vapors, that our weak eyes may not be too much dazzled with it: Without it we could not know or judge of the sun, because we could have no use of our sense, which we must have before we can judge of it in our understanding: So we are not able to conceive of spiritual beings in the purity of their own nature, without such a temperament, and such shadows to usher them into our minds. And therefore we find the Spirit of God accommodates himself to our contracted and teddered capacities, and uses such expressions of God, as are suited to us in this state of flesh wherein we are: And therefore because we cannot apprehend God in the simplicity of his own Being, and his undivided essence, he draws the representations of Himself from several Creatures and several actions of those creatures: As sometimes he is said to be angry, to walk, to sit, to fly; not that we should rest in such conceptions of Him, but take our rise from this foundation, and such perfections in the creatures, to mount up to a knowledge of God’s nature by those several steps, and conceive of him by those divided excellencies, because we cannot conceive of him in the purity of his own essence. We cannot possibly think or speak of God, unless we transfer the names of created perfections to Him; yet we are to conceive of them in a higher manner when we apply them to the Divine Nature, than when we consider them in the several creatures formally, exceeding those perfections and excellencies which are in the creature, and in a more excellent manner: as one says, “Though we cannot comprehend God without the help of such resemblances, yet we may without making an image of Him; so that inability of ours excuses those apprehensions of Him from any way offending against his Divine Nature.” These are not notions so much suited to the nature of God as the weakness of man: They are helps to our meditations, but ought not to be formal conceptions of Him. We may assist ourselves in our apprehensions of Him, by considering the subtilty and spirituality of air; and considering the members of a body, without thinking him to be air, or to have any corporeal member. Our reason tells us, that whatsoever is a body, is limited and bounded; and the notion of infiniteness and bodiliness, cannot agree and consist together: And therefore what is offered by our fancy should be purified by our reason.</p></blockquote>

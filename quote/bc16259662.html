<main class="wrap"><figure class="quote" id="q-bc16259662" data-kw="">
<blockquote><p>It was made very clear, however, by other statutes on this subject, that when actual murder had been committed, no advantage was to accrue to the perpetrator from the cities of refuge; though he might have fled thither, he was, on the proof of his guilt, to be delivered up to the Goel for summary execution. Nor was the altar of God – a still more sacred place than the cities of refuge, and in ancient times almost universally regarded as an asylum for criminals – to be permitted in such cases to afford protection; from this also the murderer was to be dragged to his deserved doom. In short, deliberate murder was to admit of no compromise and no palliation: the original law, ‘whoso sheddest man’s blood by man shall his blood be shed,’ must be rigorously enforced; and, doubtless, mainly also on the original ground, ‘because in the image of God made He him.’

To disregard the sanctity of human life, and tread it vilely in the dust, was like aiming a thrust at God Himself, disparaging His noblest work in creation, and the one that stood in peculiar relationship to His own spiritual being. Therefore, the violation of the sixth command by deliberate murder involved also a kind of secondary violation of the first; and to suffer the blood of the innocent to lie unavenged, was, in the highest sense, to pollute the land; it was to render it unworthy of the name of God’s inheritance.

So great was the horror entertained of this unnatural crime, and so anxious was the Lawgiver to impress men with the feeling of its contrariety to the whole spirit and object of the law, that, even in the case of an uncertain murder, there was a cry of blood which could not be disregarded; and when every effort had failed to discover the author of the deed, the elders of the city which lay nearest to the corpse were to regard themselves as in a manner implicated; they had to come publicly forward, and not only protest their innocence of the crime, and their ignorance of the manner in which it had been committed, but also to go through a process of purification by blood and water, that the charge of blood-guiltiness might not rest upon them and their land.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-fairbairn.html">Patrick Fairbairn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Revelation of Law in Scripture: Considered with respect both to its own Nature, and to its Relative Place in Successive Dispensations. The Third Series of the ‘Cunningham Lectures’</cite>, (Edinburgh: T. &amp; T. Clark, 1869), pp 110-12.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0b38dacc62" data-kw="">
<blockquote><p>This may possibly be also a new encouragement to your Majesty, who is already engaged in the work of restoring the kingdom of Christ, and to many who live under your government to further the same work. Your kingdom is extensive and renowned, and abounds in many excellencies; Christ as its chief ruler and governor, so that it may be defended by his safeguarded and protection; for to submit your sceptre to him, is not inconsistent with that elevation in which you are placed; but it would be far more glorious than all the triumphs of the world. For since among men gratitude is deemed the proper virtue of a great and exalted mind, what in kings can be more unbecoming than to be ungrateful to the Son, by whom they have been raised to the highest degree of honour? It is, therefore, not only an honourable, but more than a royal service, which raises us to the rank of angels, when the throne of Christ is erected among us, so that his celestial voice becomes the only rule for living and dying both to the highest and to the lowest. For though at this day to obey the authority of Christ is the common profession, made almost by all, yet there are very few who render this obedience of which they boast.

Now this obedience cannot be rendered, except the whole of religion be formed according to the infallible rule of his holy truth. But on this point strange conflicts arise, while men, not only inflated with pride, but also bewitched by monstrous madness, pay less regard to his unchangeable oracles of our heavenly Master than to their own vain fictions […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the epistle of Paul the apostle to the Hebrews</cite>, trans. John Owen (1549; n.p. 1853) in Calvin’s Commentaries (22 vols, Grand Rapids, 1993), xxii, pp xx-xxi.</span></figcaption>

</figure><figure class="quote" id="q-d5580a7dec" data-kw="">
<blockquote><p>Fifthly, God hath Sovereign Authority over all Kingdoms, Now is the Axe laid unto the Root of the Tree, this axe was the Roman State, this Tree was the Jewish State. God hath the Authority of all in his hand, he sets one Kingdom against another. Babylon must ruin Sion: Titus and Vespatian, are stirred up by God to cut down and destroy the Jewish Nation: God hath Sovereignty over all Kingdoms, Psal. 103. 19. and can imply them to execute his judgements. Senacherib was his axe, Esa 10. 15. to cut down Nations. God makes one Kingdom an Axe to hew down another, he makes one part of a State to hew down another part of the same.

The Jewish Common-wealth was now under the Roman Empire; it’s so in England at this day, hath not God mingled a perverse Spirit amongst us, Esa. 9. 21. Ephraim against Manasseh, Manasseh against Ephraim, and both against Judah; They sought each others’ destruction as we do at this day; a perverse Spirit was mingled among them and among us. Kingdoms depend upon God, Dan. 4. 32. 2 Chap. 21. and where there is the greatest dependency, there is the greatest Sovereignty. Now Kingdoms depend upon God, quoad omnia, for their beings, upholdings and blessings, and therefore he hath, jus utendi, he may do with his own what he list, he can and may dash one Family, one Towne, one Country, and one Kingdom against another, and that without control. Who shall say to him, what doest thou?

What should this beget in us, but to fear this God that hath Sovereign authority over all flesh, over all Kingdoms; let us fear this God, Jer. 10. 7. Who would not fear thee O King of Nations? for to thee doth it appertain: Shall God be the King of Nations, the King of all Kings and not be feared? to the doth it appertain, not to men to be feared but to thee doth it appertain: The great God must be feared. Ye that are petty Kings on the Earth, you that are Gods on the Earth, you must know that this God hath Sovereign Authority over Nations, Persons, lives, consciences, he is the everlasting King or King of eternity, Jer. 10. 10. He can, will, and must, dispose of you err long eternally in heaven or hell, Job 36. 8, 9, 10.

When Families and Kingdoms are in fetters under the afflicting hand of God, then He shews them the excessiveness of their sins, and commands them to return from iniquity. Did not God command them before? yes, but then they slighted God, being at ease and in prosperity, His commands were not regarded, but when God cast into straights, fetters and afflicts Families or Kingdoms, their ears are opened, they harken to Discipline? What they formerly contemned, is now precious, and they see Authority and Majesty in the command of God, Mic. 6. 9.

The King of Nations is wroth with this Kingdom, He hath it in fetters, let us hearken to His commands, and tremble at his Sovereignty. Psal. 99. 1. The Lord Reigneth let the Earth tremble; let all the Potentates and Inhabitants of it tremble and quake before him: It’s for our advantage to do it. Hab. 3. 16. when the Chaldeans were to come up and besiege Jerusalem, the Prophet apprehending it beforehand, quivered and quaked, and why was it? that he might rest in the day of trouble: that soul which trembleth when judgement is in the Cloud, when the Axe is at the root of the tree, shall have rest in the day of trouble: Isa. 66 2. To him will I look that is of a contrite Spirit, and trembleth at my word: God will look to him, that the flood shall not drown him, nor the Axe cut him down. Lot is saved when the fire consumed Sodom; God was to him a Sanctuary, he feared God and God was his defence, Esa. 8. 13, 14. When we have frames of Spirit suitable to the Authority and Majesty of the great God, that is Lord of Kingdoms, that raises and ruins them at his pleasure, then we sanctify God in our hearts, and he will be a Sanctuary unto us, and such a Sanctuary is needful for these times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Αξινε προσ τεν Ριζαν. The axe at the root, a sermon preached before the Honourable House of Commons, at their public fast, April 26. 1643</cite>, (London: Benjamin Allen, 1643), pp 17-18.</span></figcaption>

<blockquote><p>Objection 3: If kings be governors in all causes over all persons, then may they dissolve churches and their government, and mold and order them as they will. Answer: So far as Church constitution, government and ordering is by Christ’s appointment, or such example which has the force of an institution of Christ, it may not be altered by a king; But in such things as are left to human prudence, and there is a concernment of the weal-public, kings have authority to order them so, as that they tend to the real good and advantage of the churches of Christ and the glory of God, which is the highest and ultimate end of all. Objection 4: This will make the use of synods and assemblies of pastors to determine things of religion and to order government unnecessary, since the determination of all will lie in the king’s breast. Answer: Though statute-laws require the king’s assent, and the government is to be exercised in his name, by his commission, yet are not debates in parliament and passing bills by both Houses, nor consultations with judges, nor their decisions of cases unnecessary [but assumed in the oath]: The like is to be said of the use of synods and assemblies of Pastors and learned men, though the calling of them, and validity of their canons, that is rules, in respect of the imposing them on others with civil penalties, require the king’s concurrence. Objection 5. This has occasioned great evils in so much that persecution has been raised against godly persons as heretiques and schismatics, when princes have been misled so as to burn, banish, imprison and otherwise to afflict persons judged by prelates and others to be such. Answer: ‘Tis true this has fallen out when princes ignorant of the true religion, corrupted in their education, perverted by seducers and ungodly guides in their judgments have yielded too much to the misinformation of others, and so have been unhappy in the abuse of their government to the great hurt in life, liberty and estate of innocent persons: And the like has been in mal-administration of civil affairs through the like causes: yet the power and authority in neither is to be denied for some abuse: for that would introduce a worse evil of anarchy and mischievous confusions. On the other side when princes have been good, and have used such good counselors, as Jehoiada was to Joash, their government in religion has been of great advantage to the Church of Christ. And as things have stood in England, it was the means under God whereby Popery was expelled and the protestant Reformation was established. … Objection 8: The acknowledgement of this supremacy of the king has been opposed by sundry godly protestants who have in their writings excepted against it, as Calvin and the Century writers of Magdeburg. Answer: Tis true they excepted against the title of Head of the Church given to King Henry VIII, as Stephen Gardiner [a Papist] and such like persons misreported it, as if it gave to the king an uncontrollable authentic power, to determine of faith and worship of God: but when those learned protestants better understood what was meant by it, they withdrew their exceptions, as doctor Rainold shows in his Conference with Hart in the Tower [1584], ch. 10 [pp. 673-74]. Objection 9: Many godly persons are offended with the taking and defending the lawfulness of the taking of this oath as fearing it many tend to the taking away those liberties of their consciences in religion, which are dearer to them then their lives: and being jealous of those who take it, lest they betray those liberties. Answer: It is to be considered by those conscientious persons who make this objection that the takers, and defenders of the taking of this oath do apprehend that the imposing this oath was for the excluding the Pope’s jurisdiction and other foreign power, as the admonition of Queen Elizabeth here prefixed shows… But they that have taken it, or conceive they may take it if imposed, do it, as being satisfied in their consciences by the foregoing arguments or such like that they do but what they may do lawfully without offence, and hope that it will fall out as it did in the business of the altar of Ed, Josh. 22, that a right intelligence of their fact will prevent any breach between them and others and unite them more closely.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2c685ead63" data-kw="">
<blockquote><p>This command, as all the rest of the decalogue, was written twice by the finger of God in tables of stone. And hereof there was a double reason:- First, That it was a stable renovation and objective representation of that law, which being implanted on the heart of man, and communicated unto him in his creation, was variously defaced; partly by the corruption and loss of that light, through the entrance of sin, which should have guided us in the right apprehension and understanding of its dictates, and of the obedience that it required; partly through a long course of a corrupt conversation, which the world had, in the pursuit of the first apostasy, and according to the principles of it, plunged itself into.

God now again fixed that law objectively, in a way of durable preservation, which in its primitive seat and subject was so impaired and defaced. And hereof the additions mentioned, with peculiar respect unto the application of the whole, or any part of it, unto that people, were no impeachment, as is acknowledged in the preface given unto them all containing a motive unto their dutiful observance of the whole. And hence this law must necessarily be esteemed a part of the antecedent law of nature; neither can any other reason be given why God wrote it himself with those and only those that are so, in tables of stone.

Secondly, This was done as an emblem that the whole decalogue was a representation of that law which, by his Spirit, he would write in the fleshy tables of the hearts of his elect. And this is well observed by the church of England, which, after the reading of the whole decalogue, the fourth command among the rest, directs the people to pray that God would write all these laws in their hearts.

Now, this concerneth only the moral law; for although obedience unto all God’s ceremonial and typical institutions, whilst they were in force, was moral, and a part of the law written in the heart, or required in general in the precepts of the first table of the decalogue, yet those laws themselves had no place in the promise of the covenant that they should be written in our hearts; for if it should be so, especial grace would be yet administered for the observation of those laws now they are abolished, which would not only be vain and useless, but contradictory to the whole design of the grace bestowed upon us, which is to be improved in a due and genuine exercise of it. Neither doth God bestow any grace upon men but withal he requires the exercise of it at their hands. If, then, this law was written in tables of stone together with the other nine, that we might pray and endeavour to have it written in our hearts, according to the promise of the covenant, it is, and must be, of the nature of the rest, that is, moral, and everlastingly obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exercitations Concerning the Name, Original, Nature, Use, and Continuance of a Day of Sacred Rest</cite>, in An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations, ed. William H. Goold (1671; 7 vols, Edinburgh: Johnston and Hunter, 1854), 2: 367-68 (emphasis added).</span></figcaption>

<blockquote><p>If it be said that the best man who lives ties not himself to these rules, in the use of every indifferent thing, but oftimes uses or omits a thing of that nature at his own pleasure. I answer: In many things we offend all. And who can understand his errors? But in the mean time, the rules of the Word limit us so strictly that we may never use a thing in its own nature indifferent at our arbitrament and pleasure, and that the use of it is never lawful to us except it be done piously for God’s glory, profitably for man’s edification and purely with full assurance that that which we do is approved of God.</p></blockquote>

<blockquote><p>2nd Point. …whereby we have good light for the expounding of a place in Paul, 1 Cor. 11:10, saying, that the woman ought to have power over her head, that is, be covered, because of the angels. Whereby ‘angels’ may well be understood the preachers and ministers of the Gospel. And the reason of that precept may be this: Among the Corinthians the covering of the head was not as it is with us, a token of preeminence and superiority, but a sign of subjection. And therefore the apostle would have the women of Corinth, when they came into the congregation, to have their heads covered, according to the custom of their country in other assemblies, to signify their submission and reverence unto the ministry of the Gospel.</p></blockquote>

</figure><figure class="quote" id="q-91a53fdb92" data-kw="">
<blockquote><p>…that such godly men as have been desirous of reformation, and most zealous against human inventions in the worship of God, they always intended such human inventions in the worship of God as had no warrant but the wit and will of man, not such as had warrant either from consequence of Scripture, or light of nature, or civil custom. For a woman to cover her head in time of public prayer, or prophesying, and for a man to uncover his head, the apostle warrants both from the light of nature and the custom of the churches, 1 Cor. 11:4 to 16. The kiss of love in holy assemblies was warranted, not by divine institution (for then it were a sin in us to neglect it now), but by occasion of civil custom in those nations; where, it being usual in their civil assemblies to greet one another with a kiss of love, the apostles do not disallow the use of it in holy assemblies, but only require the sincerity and holiness of the love expressed in such kisses, 1 Cor. 16:20; 1 Thess. 5:26; 1 Pet. 5:14. These apostles did not believe in this point, as you do, that God never betrusted corrupt nature, to frame anything in God’s worship to his praise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalms: a Gospel Ordinance</cite>, … (London, 1650), ch. 10, ‘Of the Manner of Singing’, pp. 58-59</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…that such godly men as have been desirous of reformation, and most zealous against human inventions in the worship of God, they always intended such human inventions in the worship of God as had no warrant but the wit and will of man, not such as had warrant either from consequence of Scripture, or light of nature, or civil custom. For a woman to cover her head in time of public prayer, or prophesying, and for a man to uncover his head, the apostle warrants both from the light of nature and the custom of the churches, 1 Cor. 11:4 to 16. The kiss of love in holy assemblies was warranted, not by divine institution (for then it were a sin in us to neglect it now), but by occasion of civil custom in those nations; where, it being usual in their civil assemblies to greet one another with a kiss of love, the apostles do not disallow the use of it in holy assemblies, but only require the sincerity and holiness of the love expressed in such kisses, 1 Cor. 16:20; 1 Thess. 5:26; 1 Pet. 5:14. These apostles did not believe in this point, as you do, that God never betrusted corrupt nature, to frame anything in God’s worship to his praise.”

<main class="wrap"><figure class="quote" id="q-9f33f0d679" data-kw="">
<blockquote><p>They are not only such as shall be happy, but they are very useful and beneficial in the world, they are those for whose sake the world was made, they are the great common blessings of the world, like fire and water, they are those for whose sake God spares the world.

If God would have spared the City for ten righteous persons’ sake, surely for many tens God spares the world; those that are pulled down by the world, are those for whose sake God doth not pull down the world, they are the soul of the world, as I may so say; If God had gathered in all his Elect, the world would not continue one hour longer.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b854e1dec7" data-kw="">
<blockquote><p>It is clear the question must be thus stated, for all the laws of the old Testament (which we hold in their moral equity to be perpetual) that are touching blasphemies, heresies, solicitation to worship false Gods and the breach of which the Godly Magistrate was to punish, command or forbid only such things as may be proved by two or three witnesses, and which husband and wife are not to conceal, and from which all Israel must abstain for fear of the like punishment. Deut. 13.8, 9, 10, 11. Deut. 17. 5, 6. Levit. 20. 1, 2, 3, 4, 5. But opinions in the Mind, acts of the understanding, can never be proved by witnesses and such as neither Magistrate nor Church can censure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A free disputation against pretended liberty of conscience</cite>, (London, 1649), p. 47.</span></figcaption>

</figure><figure class="quote" id="q-c420b444e9" data-kw="">
<blockquote><p>In the sixteenth century, the narrowest views of politics and of popular education everywhere prevailed, even in Reformed countries. All political power was lodged, and was everywhere deemed to be rightly lodged, in the hands of princes, and all liberal knowledge was regarded as the prerogative of the few, and was withheld from the many.

The rights and interests of the masses were almost wholly ignored in the governmental and educational economy of nations; the champions of popular rights and education were extremely few; and the men who attained to enlightened views on such questions may justly claim to be regarded by the men of this present age as having been enlightened indeed — lights shining in a dark place — heralds and precursors of the politics and economics of the nineteenth century.

On questions of political principle and right, the views of [John] Knox and [George] Buchanan are before the world, and can be compared with the opinions which prevailed in their own and subsequent times. They contended for the principle of limited monarchy, and the supremacy of law; the prince, they urged, had his duties as well as his rights, and the people their rights as well as their duties. In opposition to the long-descended tradition of the divine and indefeasible right of princes, they held the principle (if they were not, indeed, the very first to put it forward) of a mutual compact between prince and people, as lying at the foundation of the political order and relations of society.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-lorimer.html">Peter Lorimer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Learning and Enlightened Views of the Scottish Reformers in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-d6829949de" data-kw="">
<blockquote><p>If it be said, that God hath forbidden such a forcible resistance by Rom. 13. 1, 2, 3. or the like Scriptures, then it must be affirmed that the Parliament are not the higher powers, which Dr Ferne granteth: for if the Parliament come within the compass of those words (higher Powers) then that Scripture Rom. 13. doth not reach them, but rather requires others to be obedient to them; yea, if by the higher powers is understood only the King, then the two Houses may not make any forcible resistance against any petty Constable that comes in the K[ing’s] authority to do violence to the two Houses.

Surely therefore this and the like Scriptures are much abused, the meaning being only to command obedience to authority in all things that tend to the encouragement of good, and punishment of evil; and therefore there is such a power in the subjects, both by the law of nature, and constitution of the kingdom, to take up Arms when the State or two Houses express it; notwithstanding the expression of any one man to the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved</cite>, (London: Ben. Allen, 1643), pp 17-18.</span></figcaption>

idge-on-romans-13-and-parliament/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>To say that God carryeth all things by an absolute and unconditional decree of providence, viz. opposing absolute to all conditions presupposed in the creature, in my judgment is neither agreeing to the Doctrine of Scripture, nor of our Divines; who do both teach that as God in the fulness of time doth administer and dispense the way of his providence, so he decreed to dispense them in the same manner from eternity.

Now in dispensing the performance of the Covenant of works, the Lord punisheth and rewardeth the creature according to the condition of obedience or disobedience performed by it, as it is at large described, Levit. 26; Deut. 28. and therefore surely he decreed to carry such works of his providence upon the same conditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 245.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-93553b2f79" data-kw="">
<blockquote><p>Now, the covenant of works being broken, the justice of Jehovah, required the execution of the curse of it; in order that a covenant of grace and peace, might be established. But, if the curse had been executed upon the sinners themselves, the fire of Divine wrath, should have burned eternally on them; and after all, such a sacrifice, could never have sent forth a savour, smelling so sweetly, as to be a savour of rest to vindicative justice; because they, were not only mere creatures, whose most exquisite torments, could never have amounted to a sufficient compensation, for the injury done to the honour of infinite Majesty; but were sinful creatures too, who would still, even under their eternal sufferings, have continued to sin. The Lord Jesus, therefore, being both “equal with God,” and “separate from sinners,” did in the covenant, consent to be, in the room of his elect seed, the sacrifice, upon whom the curse of the covenant of works, might be fully executed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), p. 104.</span></figcaption>

</figure><figure class="quote" id="q-956ef8743f" data-kw="">
<blockquote><p>Controversy – Did man before the Fall have the promises of a blessed life and the glory of heaven? We affirm against the Socinians and Anabaptists. Arguments:

1. The covenant of God, “Do this and live,” only had a place before the Fall and in the case of Christ, but it means, “you will live forever” (Gal. 3:12, 21).

2. The death denounced to man includes eternal death under the dominion of the devil, as we may conclude from Gen. 3:13 and 1 Cor. 15:22; therefore, the promised life was eternal life.

3. The law has only been weakened through sin so that it cannot save (salvare) (Rom. 8:3); therefore, before sin it was able to save (salvare).

4. He had the tree of life, and the thing that it signified was eternal life (Rev. 2:7).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-riissen.html">Leonard Riissen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Summary of Elenctic Theology &amp; of as Much Didactic Theology as is Necessary</cite>, trans. J. Wesley White MTh thesis (Bern, 1676; GPTS, 2009), Ch. 9, ‘The Law, the Fall &amp; Sin’, pp. 82-99</span></figcaption>

Online</a></div>

<blockquote><p>VI. Episcopius, and with him the Remonstrants, deny that a covenant of nature was made with Adam (“Institutiones theologica,” 2.1 in Opera theologica [1678], p. 23); but it can be proved. (1) There are granted the essential parties of a covenant, God and man. God, who as the Creator of man, must also be his governor and from this, his legislator, and because good in his own nature, the rewarder also of those who seek him (Heb. 11:6), so that he would not only give him a law for his direction, but also hold forth a reward to him for keeping it (although bound by no right to that). Man who, because a creature, must also wholly depend upon God and, because upright, could keep the inscribed law, and because rational, ought not otherwise than in a rational manner (i.e., by the intellect and will) be governed, both by the prescription of a law, the promise of rewards and the threatening of punishment. Also since he was created after the image of divine holiness, he ought to have been led to a communion of that happiness also which is the inseparable attendant of holiness.

VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12).

VIII. Third, the passage in Hos. 6:7 seems not obscurely to intimate this: the Israelites are said to have “transgressed the covenant like Adam” (hmh k’dhm ‘bhrv bhryth). For although these words may also be explained of the inconstancy of men (that they may be said to have transgressed the covenant as men are wont to do, who are naturally false and fickle, and often deceive expectation), still nothing prevents their being referred also to Adam (that they may be said to have violated the covenant like Adam, their first parent, who miserably broke the covenant contracted with him by God). A similar locution occurs in Job 31:33: “If I covered,” says he, “my transgressions as Adam [k’dhm].” Here is a manifest reference to the fact of Adam’s endeavoring to excuse and hide his sin (Gen. 3:12).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg: P&amp;R Publishing, 1992–97), 575–76 (8.3.6–8).</span></figcaption>

the+tree+of+life+%28by+which+it+was+sealed%29+and+from+the+threatening+of+death+%28which+by+reason+of+contraries+had+the+implied+promise+of+life+and+from+the+various+passages+of+Scripture+which+express+more+clearly+the+nature+and+sanction+of+the+law%2C+as+Lev.+18%3A5%E2%80%94%E2%80%9CIf+a+man+do+these%2C+he+shall+live+in+them%2C%E2%80%9D+cf.+Dt.+27%3A26%3B+Ezk.+20%3A11%3B+Mt.+19%3A17%3B+Gal.+3%3A12%29.+VIII.+Third%2C+the+passage+in+Hos.+6%3A7+seems+not+obscurely+to+intimate+this%3A+the+Israelites+are+said+to+have+%E2%80%9Ctransgressed+the+covenant+like+Adam%E2%80%9D+%28hmh+k%E2%80%99dhm+%E2%80%98bhrv+bhryth%29.+For+although+these+words+may+also+be+explained+of+the+inconstancy+of+men+%28that+they+may+be+said+to+have+transgressed+the+covenant+as+men+are+wont+to+do%2C+who+are+naturally+false+and+fickle%2C+and+often+deceive+expectation%29%2C+still+nothing+prevents+their+being+referred+also+to+Adam+%28that+they+may+be+said+to+have+violated+the+covenant+like+Adam%2C+their+first+parent%2C+who+miserably+broke+the+covenant+contracted+with+him+by+God%29.+A+similar+locution+occurs+in+Job+31%3A33%3A+%E2%80%9CIf+I+covered%2C%E2%80%9D+says+he%2C+%E2%80%9Cmy+transgressions+as+Adam+%5Bk%E2%80%99dhm%5D.%E2%80%9D+Here+is+a+manifest+reference+to+the+fact+of+Adam%E2%80%99s+endeavoring+to+excuse+and+hide+his+sin+%28Gen.+3%3A12%29.%E2%80%9D%0A%0A%E2%80%94+Francis+Turretin%2C+Institutes+of+Elenctic+Theology%2C+ed.+James+T.+Dennison+Jr.%2C+trans.+George+Musgrave+Giger%2C+vol.+1+%28Phillipsburg%3A+P%26R+Publishing%2C+1992%E2%80%9397%29%2C+575%E2%80%9376+%288.3.6%E2%80%938%29.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c9a8c1a34.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c9a8c1a34.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/03/turretin-defended-covenant-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Jer. chap. 31:31 Behold, the days come, says the Lord, that I will make a new covenant with the house of Israel, with the house of Judah, 32 Not according to the covenant that I made with their fathers, when I took them by the hand to bring them out of the land of Egypt, the which my covenant they broke, although I was a husband unto them, says the Lord. 33 But this shall be the covenant that I will make with the house of Israel, After those days, says the Lord, I will put my Law in their inward parts, and write it in their hearts, and will be their God, and they shall be my people. 34 And they shall teach no more every man his neighbor, and every man his brother, saying, ‘Know the Lord:’ for they shall all know me from the least of them to the greatest of them, says the Lord: for I will forgive their iniquity, and will remember their sins no more. What follows to be spoken of? The covenant of grace. Seeing by the covenant of works life everlasting is propounded, what need is there that the covenant of grace should be set before us? Because, as has been said, the covenant of works cannot through the infirmity of our flesh give life to any: And therefore if God should justify any by it, he should be unjust, as one that should give the kingdom of heaven to wicked men. Seeing the nature of a covenant is to reconcile and join those together which are at variance; as we see in the example of Abraham, and Abimelech, Laban and Jacob: why is this called the covenant that can make no reconciliation between God and us? Although it be not able to reconcile us, yet it does make way to reconciliation by another covenant: neither is it meet strictly to bind God’s covenant with men, to the laws or covenants of one man with another; for among men the weaker seeks reconciliation at the hand of the mightier: but God neither able to be hurt or benefited by us, seeks unto us for peace. What is the covenant of grace? That God will give us life everlasting through Christ, if we believe in him. How are they convinced by the giving of this covenant, which seek righteousness in the law or old covenant? Because thereby they make God unwise, that would enter into a new and second covenant, if the former had been sufficient. Of how many sorts is this? It is either the old or new Testament. What is the old Testament? It is the covenant of God, under shadows to give life everlasting by faith in Christ that was to come. What is the new Testament? It is the covenant of God, without shadows to give life everlasting by faith in Christ that is come. Are these Testaments divers? They be in substance the same, but in manner they differ. What are the parts of this covenant of God? Two: the one is the covenant that God makes with us; the other is the covenant that we make with God. What is the sum of that covenant God makes with us.? That he will be our God.</p></blockquote>

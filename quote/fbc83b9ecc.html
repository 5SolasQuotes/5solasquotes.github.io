<main class="wrap"><figure class="quote" id="q-fbc83b9ecc" data-kw="">
<blockquote><p>O Lord Jehovah, how little do we poor miserable mortals know of thy Supreme Deity, and incomprehensible perfections! how far short do our thoughts come about thee, who art infinite or immense in thy being, thy attributes, thy sovereignty over the creatures! what mortal can take upon him to set bounds to this thy sovereignty, where thou dost not lead the way!

Lord, we know that thou art indebted to none, and that there is none who can say to thee, what dost thou, or why dost thou so? That thou art also holy, and infinitely good, and therefore a lover and rewarder of holiness. May the consciousness of our ignorance in other things kindle in our hearts an ineffable desire of that beatific vision, by which, knowing as we are known, we may in the abyss of thy infinity behold those things which no thought of our at present can reach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity</cite>, trans. William Crookshank (1677; 2 vols, London, 1822), i, pp 81-82, 1.4.23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7ccd6764ee" data-kw="">
<blockquote><p>We do not reject the commemoration or honorable mention of the dead saints, nor an annual thanksgiving for those who have departed in the faith of Christ: besides we have acknowledged that we may pray for a blessed resurrection, for a public absolution in the day of judgment and the perfect happiness of deceased believers, without any superstition. Hence that solemn prayer in our English [Anglican] Church, when the dead are conveyed to the tomb: ‘Almighty God… beseeching Thee, that it may please Thee of thy gracious goodness shortly to accomplish… that we, with all those who are departed in the true faith of thy holy name, may have our perfect consummation and bliss, both in body and soul, in they eternal and everlasting glory, etc.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Prayers of the Papists for the Dead are Vain’</cite>, p. 222 in The Determinations, or Resolutions of Certain Theological Questions, Publicly Discussed in the University of Cambridge trans. Josiah Allport (1634; 1846) bound at the end of John Davenant, A Treatise on Justification, or the Disputatio de Justitia... trans. Josiah Allport (1631; London, 1846), vol. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/nature-and-necessity-of-prayer.html">Nature and Necessity of Prayer</a></span></div>

</figure><figure class="quote" id="q-68720784c2" data-kw="">
<blockquote><p>Now let us prostrate ourselves before the majesty of our good God, recognizing the infinite faults of which we are guilty, praying that it will please him to make us feel them more and more, so that we may ask him to pardon them. And may we recognize ourselves as we truly are, in order to compel ourselves to reform by correcting all the vices which are still in us, and to submit ourselves to his holy will, so that we may not cease blessing him in our afflictions. Thus, may we recognize our offenses and, at the same time, may we ever taste the fatherly love he shows us, so that we may invoke his name and call upon him until he shows us signs of his favour, after we have felt his wrath. May he show his grace not only to us, but also to all the people and nations of the Earth…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons On Second Samuel Chapters 1–13</cite>, trans. Douglas Kelly (Edinburgh: The Banner of Truth Trust, 1992), 15..</span></figcaption>

</figure><figure class="quote" id="q-38a909b283" data-kw="kingdom come">
<blockquote><p>The second petition is: that God&#x27;s Kingdom come [Matt. 6:10]. Even though it contains nothing new, it is with good reason kept separate from the first petition; for if we consider our languor in the greatest matters of all, it behooves us to extend our discussion in order to drive home something that ought to have been thoroughly known of itself. … God reigns where men, both by denial of themselves and by contempt of the world and of earthly life, pledge themselves to his righteousness in order to aspire to a heavenly life. Thus there are two parts to this Kingdom: first, that God by the power of his Spirit correct all the desires of the flesh which by squadrons war against him; second, that he shape all our thoughts in obedience to his rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.20.42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer/the-lords-prayer.html">The Lord&#x27;s Prayer</a> › <a href="../topics/prayer/the-lords-prayer/thy-kingdom-come.html">Thy kingdom come</a></span></div>

</figure><figure class="quote" id="q-9db79a3fbd" data-kw="">
<blockquote><p>To praying aright is required light and warmth, a light of the mind, and warmth of affections; the former for the matter, the latter for the manner. And it is a false light and warmth that makes some natural men think that sometimes they pray aright, Isa. lxiii. 2. But all genuine light, and vital warmth comes from the Spirit, Eph. i. 17, 18; 2 Tim. i. 7.

Hence the emblem of the virtue of the Holy Spirit was “cloven tongues, like as of fire,” Acts ii. 3, 4. And the effect thereof is someway compared with that of drunkenness (which excuses it no more than Christ’s being compared to a thief excuses stealing, Rev. xvi. 15); for as the liquor being received to excess, influences the man, so that things come in his head which otherwise would not, and the affections and passions are wrought up by it, Prov. xxiii. 33, so the Spirit indwelling and influencing, presents to the mind matter of prayer, and works up the affections suitable thereto, Eph. v. 18, 19, Cant. vii. 9.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses on Prayer</cite>, (1727) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 58.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

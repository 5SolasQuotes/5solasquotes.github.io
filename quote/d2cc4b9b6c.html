<main class="wrap"><figure class="quote" id="q-d2cc4b9b6c" data-kw="">
<blockquote><p>Thirdly, all pride and vanity of garments are to be shunned and all those ornaments which do rather beseem the profane theaters of the gentiles than the sacred temples of Christians and which rather tend to delight the flesh than to edify the spirit: but all things must be done in the churches with most high reverence and modesty, as in the very sight of God and his angels. And albeit concerning the fashion of garments which ministers ought publicly to wear, either in their ministery or out of it, we do not think it a matter to be so stood upon that for it the peace of the church ought to be troubled; yet where they come nearest to the simplicity of the apostles, there we judge the church rather to be approved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of Christian Religion</cite>, (1599), ch. 25, section 30, pp. 229-30</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d5c4fbf3c4" data-kw="">
<blockquote><p>As for those who allege some conveniency in the ceremonies, they say more than can abide the proof of reason, which the induction [enumeration] of some particulars shall demonstrate. Dr. [Thomas] Morton (Particular Defense, ch. 1, sect. 1 [1618]) alleges for the surplice that the difference of outward garments cannot but be held convenient for the distinguishing of ministers from laics [laity] in the discharge of their function. Answer: This conveniency is as well seen to without the surplice. If a man having a black gown upon him be seen exercising the function of a minister, it is very strange if any man think it not sufficiently distinguished from laics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (Naphtali Press, 1993) | Part 2, Ch. 2, p. 73</span></figcaption>

</figure><figure class="quote" id="q-230adffc50" data-kw="">
<blockquote><p>Seeing that Christ Jesus is He whom God the Father hath commanded only to be heard and followed of his sheep, we judge it necessary that… all doctrine repugnant to the same, be utterly repressed, as damnable to man’s salvation. …By the contrary doctrine we understand whatsoever men by laws, counsels, or constitutions, have imposed upon the consciences of men, without the expressed commandment of God’s Word, such as be the vows to chastity, forswearing of marriage, binding of men and women to several and disguised apparels…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Head of Doctrine &amp; The Explication of the First Head</cite></span></figcaption>

</figure><figure class="quote" id="q-3ca928498c" data-kw="">
<blockquote><p>The church and its supreme governor demanded obedience in all things indifferent. Nonconformists (and it was in this context that the word ‘nonconformist’ first entered the English religious vocabulary) complained that to enforce the use of these things on reluctant consciences was to deprive them of their indifference. The doctrine of ‘Christian liberty’ which came to the fore in these circumstances, was arguably the taproot of that species of Christian conviction known ever since as Puritanism. It was not equivalent to individualistic license, but rather to a conviction that the edification of the church, composed of ‘lively stones’, required the emancipation of conscience from all human ordinances and its total subjection to the word of God… … In 1566 Archbishop Matthew Parker, in consultation with his suffragans and prompted by the queen, published some ‘Advertisements,’ a call to strict conformity… The resultant crisis rocked both the universities of Oxford and Cambridge and came to its head in London, toward Easter 1566. Thirty-seven ministers, much of the preaching ministry in London, at first refused to conform and were suspended; of these a few, the hardest of the hard core, were eventually deprived of their livings… …the Vestiarian Controversy introduced a lasting fault line into the Elizabethan church. The more drastic presbyterianism of the 1570’s might never have come about if it had not been for the episcopal ‘persecution’ of those who cast off the surplice in the 1560’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-collinson.html">Patrick Collinson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Vestiarian Controversy’ in Oxford Encyclopedia of the Reformation</cite>, (1996), vol. 4, pp. 231-32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/vestments-and-dress.html">Vestments and Dress</a></span></div>

1996%29%2C+vol.+4%2C+pp.+231-32&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3ca928498c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3ca928498c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-black-genevan-gowns/#:~:text=The%20church%20and%20its%20supreme%20governor,off%20the%20surplice%20in%20the%201560%E2%80%99s&amp;text=The%20church%20and%20its%20supreme%20governor%20demanded%20obedience&amp;text=who%20cast%20off%20the%20surplice%20in%20the%201560%E2%80%99s" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6bc2cb80c6" data-kw="">
<blockquote><p>Many good Christians knowing the Lord’s Day to be an instituted day of thanksgiving for the greatest mercies, do as an act of honor wear their best clothes, and feast themselves and the poor accordingly that day: This is lawful, by the general law, but [it is] not particularly instituted by God.</p></blockquote>

<blockquote><p>For they again affirm that we are truly righteous, and not merely counted so. I, on the contrary, while I admit that we are never received into the favor of God without being at the same time regenerated to holiness of life, contend that it is false to say that any part of righteousness (justification) consists in quality, or in the habit which resides in us, and that we are righteous (justified) only by gratuitous acceptance.</p></blockquote>
<figcaption>— <a href="../authors/john-calvin.html">John Calvin</a>, <cite>Acts of the Council of Trent with the Antidote</cite>, Antidote to the Sixth Session, on the decree (ch. 7, the formal cause)</figcaption>
<div class="meta"><span class="t">Forensic, Not Moral</span><span class="t">Justification and Sanctification Distinguished</span><span class="t">Rome: Justification</span></div>

<blockquote><p>The thing (says he) that makes us righteous before God, and causes us to be accepted to life everlasting, is remission of sins, and the habit of inward righteousness, or charity with the fruits thereof. We condescend and grant that the habit of righteousness, which we call sanctification is an excellent gift of God … yet we deny it to be the thing, which makes us of sinners to become righteous or just before God.</p></blockquote>

</figure><figure class="quote" id="q-41fa5bb1e6" data-kw="">
<blockquote><p>How can a man be just with God? The answer given to this question decides the character of our religion and, if practically adopted, our future destiny. To give a wrong answer is to mistake the way to heaven. It is to err where error is fatal, because it cannot be corrected.</p></blockquote>
<figcaption>— <a href="../authors/charles-hodge.html">Charles Hodge</a>, <cite>Justification, the Law, and the Righteousness of Christ</cite>, I.A, “Introduction”</figcaption>

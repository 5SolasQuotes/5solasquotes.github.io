<blockquote><p>22. This new obedience of ours, by which, so far as lies in us, we henceforth conduct ourselves in conformity to the divine law—since it is required by God himself and performed by us—according to its degree and measure is also called our righteousness; by which also, formally, inherently, habitually, or from works, we (according to our measure) are even truly said to be righteous before God, inasmuch as on its account we are regarded by God himself as righteous in part. And with respect to it, in the divine forum, we may in some way be justified (if there were need of it). (Lk. 1:6; Isa. 38:3; 1 Thess. 5:23)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-eeac0e8f62" data-kw="">
<blockquote><p>§12. Question 7. May a true man promise money to a robber for the saving of his life or of a greater sum or more precious commodity? Answer: Yes, in case of necessity, when his life or estate cannot better be preserved: And so taxes may be paid to an enemy in arms, or to a plundering soldier (supposing that it do no other hurt which is greater than the good). Any man may part with a lesser good to preserve a greater: And it is no more voluntary or imputable to our wills than the casting of our goods into the sea to save the vessel and our lives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Directory in Practical Works</cite>, (London, 1673), pt. 4, ch. 19, title 2, p. 116</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-ef2f2a676e" data-kw="">
<blockquote><p>Assertion 3. The king is more properly a sort of patron, to defend the people (and therefore has no power given either by God or man to hurt the people) and a minister, or public and honorable servant (Rom. 13:4), for he is the minister of God to thee for good. 1. He is the commonwealth’s servant objectively, because all the king’s service, as he is king, is for the good, safety, peace and salvation of the people, and in this he is a servant. 2. He is the servant of the people representatively, in that the people has impawned in his hand all their power to do royal service.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 70 lt col mid</span></figcaption>

</figure><figure class="quote" id="q-89f7088cea" data-kw="">
<blockquote><p>Next to fidelity towards God, study to adorn your cause with loyalty to your king, in the Lord, Rom. 13:1, 5; Prov. 24:21; 1 Pet. 2:13. ‘Give unto God the things which are God’s, and unto Ceasar the things which are Cesar’s,” that hereby ye may stop the mouths of them that falsely speak evil of the presbyterian interest and party as inimical to king’s crowns, 1 Pet. 2:15. Did he not in the Usurper’s [Cromwell’s] time find you the most faithful party to him of any? And albeit ye be but ill requat, yet discourage not to follow your duty for the Lord’s sake. We are apt to believe, if any other party in the nation had been so crushed and harassed by his power as ye, none would have born it better. Let him still find that no discouragement will fret or tempt you from your duty and that for conscience-sake, without by-ends; yea, bear due allegiance to him so far as may stand with your allegiance to the King of kings and Lord of lords. And who knows what a conviction this may produce in end? 1 Sam. 24:17-18, testifying to him and all men your cause is of God, which leads you to be so conscientious toward man; and that you are the only fast and faithful friends to authority, who will cleave to it in a stormy day out of the fear of God when all its self-seeking friends will desert it when their interest parts with it; and that it is not humor, but conscience which keeps you off from complying with his will in the matters of your God wherein ye differ from him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, (1674; London: Cockerill, 1681), pp. 171-72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-a9aceb5085" data-kw="">
<blockquote><p>Nay suppose some should so extol the fullness and sufficiency of the Scriptures that they should hold them so perfect and sufficient for all Christians as to be a perfect rule for all civil government, and that Chrstian commonwealths ought to be governed by laws only there recorded and by no other (which opinion in substance Carolostadius held; that in courts of justice judges should not proceed according to humane laws, but according to the law of Moses; and so for military practices, should hold all the way of war must be founded upon the Scriptures, and thereupon should clamor against any other art and way of war than what was practised there. What would you reply to these men, or what strength were there in such principles? Would not you answer them in what sense the Scriptures were perfect, and how they must understand it?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or a Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge</cite>, (London: G.M., 1644), p. 72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

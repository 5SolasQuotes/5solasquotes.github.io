<main class="wrap"><figure class="quote" id="q-e424c5b52a" data-kw="">
<blockquote><p>‘You will not come unto Me that ye may have life,’ you will have none of my counsel, you will not return, you are a stiff-necked people, obstinate and rebellious, whence the common assistances of Gods Spirit proves ineffectual and if God did not glorify free-grace any further, none, not the elect would return unto God, for although common grace given unto all is sufficient to leave all men without excuse, their non-improvement being their sin, yet none are thereby effectually engaged to turn unto God in faith, no not the elect, who, while unregenerate, are as sinfully obstinate as any;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-lobb.html">Stephen Lobb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glory of Free Grace Displayed</cite>, ... (London, 1680), ch. 7, p. 72</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5cd726bb37" data-kw="">
<blockquote><p>41. And indeed, God loves all his creatures, insofar as they are his creatures, but not with the same level of love. For he loves some in Christ, whom he chose in Christ from eternity according to the will of his good pleasure. He does not love the reprobate in the same way, whom nevertheless he does not damn as innocent, but on account of their voluntary wickedness and willful unbelief.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Theological Disputation on that Place of Paul</cite>, 1 Cor. 15:22, ‘As in Adam All Die, so in Christ All shall be Made Alive’, &amp; of this Question, Whether Christ has Died for All?, pt. 5 tr. Michael Lynch (Heidelberg, 1589)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“41. And indeed, God loves all his creatures, insofar as they are his creatures, but not with the same level of love. For he loves some in Christ, whom he chose in Christ from eternity according to the will of his good pleasure. He does not love the reprobate in the same way, whom nevertheless he does not damn as innocent, but on account of their voluntary wickedness and willful unbelief.”

</figure><figure class="quote" id="q-829edfe447" data-kw="">
<blockquote><p>5. Although through this call salvation becomes the possession of only a few, as everyone must admit, it nevertheless retains its great value and significance also for those who reject it… Frequently, even for those who harden themselves in their unbelief, it is a source of various blessings. The enlightenment of the mind, a taste of the heavenly gift, partaking of the Holy Spirit, enjoyment of the Word of God, the experience of the powers of the age to come–these have sometimes even come to those who later fell away and held the Son of God in contempt (Heb. 6:4–6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics: God and Creation</cite>, 4:37-38</span></figcaption>

</figure><figure class="quote" id="q-0dc953a165" data-kw="">
<blockquote><p>8. When Christ knocks and presses hardest, it’s for our own good, and it’s a token of love in Him to do so; for, there is nothing more deplorable, than when He says to one under indisposition, and in an evil case, ‘Let him alone.’ … 10. Christ may call very pressingly, and his Word may have some work on the conscience and affections of hearers, and they be some-way affected with it, and yet the Word be rejected, and the heart not made open to Christ; as here she sleeps still notwithstanding; and the following verse confirms it. 11. There are some operations of the Spirit, which though they be more than a common work on the generality of hearers, yet are not saving, and may be, and often are, even by believers frustrated for a time, and by others for ever; for, this knocking gets a refusal, verse 3. So deceiving, beguiling and dangerous are common motions to rest on, when the finger of gracious Omnipotency is not applied, as verse 4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Song of Solomon</cite>, 5:2</span></figcaption>

<main class="wrap"><figure class="quote" id="q-61eaaaa886" data-kw="">
<blockquote><p>While we declare ourselves friendly to every sober and solid political reformation, it becomes us, as persons of ecclesiastical character, with still greater zeal to avow our desire of a reformation higher and more important.

This, therefore, is the wish where with the love of our country inspires our breasts, that the God of heaven, by his most merciful interposition, may remove from our great men that spirit of irreligion and pride, of luxury and oppression, which hath long been too manifest and prevalent among them; of which the awful counterpart and consequence is, among the lower ranks in society, a profligate and ungovernable spirit, ready for sedition and every mischief.

And we are bold to express our apprehensions that, unless reformation of this kind be vigorously attended to, it cannot justly be hoped that national prosperity shall be lasting, or that, if it should continue for a time, it shall answer any purposes that ought to be much valued by rational and immortal beings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-love.html">John Love</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation in Christian Miscellany</cite></span></figcaption>

</figure><figure class="quote" id="q-38abbc6ddd" data-kw="">
<blockquote><p>In a letter to the Londonderry Standard explaining his decision to vote in the General Election of 1868, the Revd Samuel Patton of Waterside Eastern Reformed Presbyterian Church, Londonderry, made the following points concerning the Glorious Revolution:

The Revolution Settlement was effected under William III., and against that settlement our fathers took up position uncompromising dissent. Their grand ideal of Christian Church in a Christian State seemed rudely dashed to the ground. For by this Settlement a semi-Erastian Presbytery was established in Scotland, and wholly Erastian Prelacy in England and Ireland. With all the energy most determined dissent the Covenanters [Reformed Presbyterians] recoiled from this Settlement, and withdrew, not only from the Church, but also from the State.

Yet let it be considered that, by the Revolution Settlement, a part of the contendings of the farsighted Covenanters was nobly vindicated. The absolute sovereignty of the King over the nation was swept away, and civil liberty triumphed. The Revolution Settlement gave us a Constitution. Prelacy was set up, indeed, and Royal supremacy was established, but this was done by the nation itself now acting through its Parliament. The arrangement was bad, but it was capable of being reversed. …

One word, now, as to the Solemn League and Covenant and my vote. Once again we have come face to face with the Royal Supremacy. The field of action is not a Drumclog, but the broad territory of the United Kingdom, under the peaceful sway of Queen Victoria, and amid the forms of constitutional Government. …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/londonderry-standard.html">Londonderry Standard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Londonderry Standard</cite>, 25 November 1868.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<main class="wrap"><figure class="quote" id="q-f07f34146a" data-kw="">
<blockquote><p>Those of the church of Rome do hence fancy a limbus, a subterraneous receptacle of souls, wherein they say the spirits of believers under the old testament were detained until after the resurrection of Christ, so as that they without us were not made perfect. But that the saints departed from the beginning of the world were excluded from rest and refreshment in the presence of God, is false and contrary unto the Scripture. However, the apostle treats not here at all about the difference between one sort of men and another after death, but of that which was between them who lived under the old testament church-state whilst they lived, and those that live under and enjoy the privileges of the new; as is evident in the very reading of the epistle, especially of the seventh chapter, and is expressly declared by himself in the next chapter to this, verses 18–24, as, God willing, we shall see on the place.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 24, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 215–16.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church.html">The Church</a></span></div>

</figure><figure class="quote" id="q-678f093652" data-kw="">
<blockquote><p>To treat with us upon that posture, or upon such terms, is a treatment neither scriptural, reasonable, just nor fair; nor is it the habile way to get grievances redressed. If this be the condition of union, it can never take place in our day, nor in any other period for what I know; at this rate ye proclaim a perpetual war. Nor is there any condescension here; for we might return to the Church of Rome, would they redress just grievances, and return to their happy state wherein they were when the apostle Paul wrote his epistle to the Romans. But, to make Church communion necessarily depend on such a redress in every part, is both destitute of a necessary warrant from the Word, and requires a standing-out until the Churches of Christ be brought to such a state as we are never like to see, nor for what I know is contained within the verge of the Lord’s gracious promises unto his Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

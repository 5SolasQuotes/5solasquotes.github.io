<main class="wrap"><figure class="quote" id="q-53a575220c" data-kw="">
<blockquote><p>However political parties or sentimentalists in religion may assert that ministers of the Gospel are travelling out of their proper province by introducing into the pulpit subjects connected with national institutions or acts, we have no fear that you, brethren, will readily adopt such a conclusion. […] The Word of God is a perfect rule of faith and practice for men in every relation; and to its inspired and unerring dictates, as the ultimate arbiter, every question in morals or religion must be referred for decision. The sacred Scriptures contain a complete system of politics, stamped with a heavenly origin, and susceptible of application to men in every condition, and in all countries, till the end of time. Large portions of the Inspired volume are taken up with the concerns of civil government; and some of the most eminent believers, whose lives are recorded, and whose characters are delineated in the Bible, are not less distinguished as patriots than as saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The duty of nations favoured with divine revelation to promote scriptural education: in two discourses</cite>, (Belfast, 1840), pp 3-4.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-64bc73c7da" data-kw="">
<blockquote><p>We said above that in the Church of God the teacher’s error is the people’s trial, a trial by so much the greater in proportion to the greater learning of the erring teacher. This we showed first by the authority of Scripture, and then by instances from Church History, of persons who having at one time had the reputation of being sound in the faith, eventually either fell away to some sect already in existence, or else founded a heresy of their own. An important fact truly, useful to be learnt, and necessary to be remembered, and to be illustrated and enforced again and again, by example upon example, in order that all true Catholics may understand that it behoves them with the Church to receive Teachers, not with Teachers to desert the faith of the Church.

My belief is, that among many instances of this sort of trial which might be produced, there is not one to be compared with that of Origen, in whom there were many things so excellent, so unique, so admirable, that antecedently any one would readily deem that implicit faith was to be placed all his assertions. For if the conversation and manner of life carry authority, great was his industry, great his modesty, his patience, his endurance; if his descent or his erudition, what more noble than his birth of a house rendered illustrious by martyrdom? Afterwards, when in the cause of Christ he had been deprived not only of his father, but also of all his property, he attained so high a standard in the midst of the straits of holy poverty, that he suffered several times, it is said, as a Confessor.

Nor were these the only circumstances connected with him, all of which afterwards proved an occasion of trial. He had a genius so powerful, so profound, so acute, so elegant, that there was hardly any one whom he did not very far surpass. The splendour of his learning, and of his erudition generally, was such that there were few points of divine philosophy, hardly any of human which he did not thoroughly master. When Greek had yielded to his industry, he made himself a proficient in Hebrew. What shall I say of his eloquence, the style of which was so charming, so soft, so sweet, that honey rather than words seemed to flow from his mouth! What subjects were there, however difficult, which he did not render clear and perspicuous by the force of his reasoning? What undertakings, however hard to accomplish, which he did not make to appear most easy?

But perhaps his assertions rested simply on ingeniously woven argumentation? On the contrary, no teacher ever used more proofs drawn from Scripture. Then I suppose he wrote little? No man more, so that, if I mistake not, his writings not only cannot all be read through, they cannot all be found; for that nothing might be wanting to his opportunities of obtaining knowledge, he had the additional advantage of a life greatly prolonged. But perhaps he was not particularly happy in his disciples? Who ever more so? From his school came forth doctors, priests, confessors, martyrs, without number.

Then who can express how much he was admired by all, how great his renown, how wide his influence? Who was there whose religion was at all above the common standard that did not hasten to him from the ends of the earth? What Christian did not reverence him almost as a prophet; what philosopher as a master? How great was the veneration with which he was regarded, not only by private persons, but also by the Court, is declared by the histories which relate how he was sent for by the mother of the Emperor Alexander, moved by the heavenly wisdom with the love of which she, as he, was inflamed. To this also his letters bear witness, which, with the authority which he assumed as a Christian Teacher, he wrote to the Emperor Philip, the first Roman prince that was a Christian.

As to his incredible learning, if any one is unwilling to receive the testimony of Christians at our hands, let him at least accept that of heathens at the hands of philosophers. For that impious Porphyry says that when he was little more than a boy, incited by his fame, he went to Alexandria, and there saw him, then an old man, but a man evidently of so great attainments, that he had reached the summit of universal knowledge.

Time would fail me to recount, even in a very small measure, the excellencies of this man, all of which, nevertheless, not only contributed to the glory of religion, but also increased the magnitude of the trial. For who in the world would lightly desert a man of so great genius, so great learning, so great influence, and would not rather adopt that saying, That he would rather be wrong with Origen, than be right with others.

What shall I say more? The result was that very many were led astray from the integrity of the faith, not by any human excellencies of this so great man, this so great doctor, this so great prophet, but, as the event showed, by the too perilous trial which he proved to be. Hence it came to pass, that this Origen, such and so great as he was, wantonly abusing the grace of God, rashly following the bent of his own genius, and placing overmuch confidence in himself, making light account of the ancient simplicity of the Christian religion, presuming that he knew more than all the world besides, despising the traditions of the Church and the determinations of the ancients, and interpreting certain passages of Scripture in a novel way, deserved for himself the warning given to the Church of God, as applicable in his case as in that of others, “If there arise a prophet in the midst of thee,”… “thou shalt not hearken to the words of that prophet,”…“because the Lord your God doth make trial of you, whether you love Him or not.”

Truly, thus of a sudden to seduce the Church which was devoted to him, and hung upon him through admiration of his genius, his learning, his eloquence, his manner of life and influence, while she had no fear, no suspicion for herself,—thus, I say, to seduce the Church, slowly and little by little, from the old religion to a new profaneness, was not only a trial, but a great trial.

But some one will say, Origen’s books have been corrupted. I do not deny it; nay, I grant it readily. For that such is the case has been handed down both orally and in writing, not only by Catholics, but by heretics as well. But the point is, that though himself be not, yet books published under his name are, a great trial, which, abounding in many hurtful blasphemies, are both read and delighted in, not as being some one else’s, but as being believed to be his, so that, although there was no error in Origen’s original meaning, yet Origen’s authority appears to be an effectual cause in leading people to embrace error.</p></blockquote>

e+warning+given+to+the+Church+of+God%2C+as+applicable+in+his+case+as+in+that+of+others%2C+%E2%80%9CIf+there+arise+a+prophet+in+the+midst+of+thee%2C%E2%80%9D%E2%80%A6+%E2%80%9Cthou+shalt+not+hearken+to+the+words+of+that+prophet%2C%E2%80%9D%E2%80%A6%E2%80%9Cbecause+the+Lord+your+God+doth+make+trial+of+you%2C+whether+you+love+Him+or+not.%E2%80%9D%0A%0ATruly%2C+thus+of+a+sudden+to+seduce+the+Church+which+was+devoted+to+him%2C+and+hung+upon+him+through+admiration+of+his+genius%2C+his+learning%2C+his+eloquence%2C+his+manner+of+life+and+influence%2C+while+she+had+no+fear%2C+no+suspicion+for+herself%2C%E2%80%94thus%2C+I+say%2C+to+seduce+the+Church%2C+slowly+and+little+by+little%2C+from+the+old+religion+to+a+new+profaneness%2C+was+not+only+a+trial%2C+but+a+great+trial.%0A%0ABut+some+one+will+say%2C+Origen%E2%80%99s+books+have+been+corrupted.+I+do+not+deny+it%3B+nay%2C+I+grant+it+readily.+For+that+such+is+the+case+has+been+handed+down+both+orally+and+in+writing%2C+not+only+by+Catholics%2C+but+by+heretics+as+well.+But+the+point+is%2C+that+though+himself+be+not%2C+yet+books+published+under+his+name+are%2C+a+great+trial%2C+which%2C+abounding+in+many+hurtful+blasphemies%2C+are+both+read+and+delighted+in%2C+not+as+being+some+one+else%E2%80%99s%2C+but+as+being+believed+to+be+his%2C+so+that%2C+although+there+was+no+error+in+Origen%E2%80%99s+original+meaning%2C+yet+Origen%E2%80%99s+authority+appears+to+be+an+effectual+cause+in+leading+people+to+embrace+error.%E2%80%9D%0A%0A%E2%80%94+Vincent+of+L%C3%A9rins%2C+The+Commonitory+for+the+Antiquity+and+Universality+of+the+Catholic+Faith+Against+the+Profane+Novelties+of+all+Heresies%2C+%28434%29%2C+17.42-45+in+Nicene+and+Post-Nicene+Fathers+2%2C+11%3A+143-45.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F64bc73c7da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/64bc73c7da.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/06/20/vincent-of-lerins-on </figure><figure class="quote" id="q-4bd858e03d" data-kw="">
<blockquote><p>Though the Reformers were unanimous in rejecting the claim of the apocryphal books of the Old Testament to a place in the canon, in denying to them divine inspiration and authority, they generally allowed them to retain their place in the Bible, and translated them into the vulgar languages. And in some editions of the Bible which were circulated on the Continent, the apocryphal books were not merely collected together and appended to the Old Testament—the form and position in which they commonly appear in Bibles printed in England—but they even were intermingled with the sacred Scriptures, coming in without any obvious and palpable mark of distinction at the places where they are introduced in the Septuagint, the source from which those apocryphal books and portions of books are derived.

This was a very erroneous and dangerous practice, even in the less offensive form which it assumed in Bibles printed in England, in which the Apocrypha was appended and not intermingled, as tending to break down in men’s minds a right sense of the distinction that ought ever to be maintained full and unimpaired between the word of God and the word of man, between writings which come from God, and are therefore possessed of supreme and infallible authority, and writings which besides being possessed of no authority whatever, are some of them liable to the still more serious objection of putting forth a false claim to a divine origin.</p></blockquote>

<blockquote><p>ONE of the leading forms which, in the present day, aversion to divine truth exhibits, is a dislike to precise and definite statements upon the great subjects brought before us in the sacred Scriptures. This dislike to precision and definiteness in doctrinal statements, sometimes assumes the form of reverence for the Bible, as if it arose from an absolute deference to the authority of the divine word, and an unwillingness to mix up the reasonings and deductions of men with the direct declarations of God. We believe that it arises, much more frequently, and to a much greater extent, from a dislike to the controlling influence of Scripture, from a desire to escape, as far as possible without denying its authority, from the trammels of its regulating power as an infallible rule of faith and duty.

It is abundantly evident, from the statements of Scripture, as well as from the experience of every age and country, that men, in their natural condition, unrenewed by divine grace, have a strong aversion to right views of the divine character and of the way of salvation, or to the great system of doctrines revealed to us in the Bible, and are anxious to escape from any apparent obligation to believe them. The most obvious and effectual way of accomplishing this, is to deny the divine origin and authority of the sacred Scriptures, their title and their fitness to be a rule of faith, or standard of doctrine.

And when men, from whatever cause, do not see their way to do this plainly and openly, they often attempt it, or something like it, in an indirect and insidious way, by distorting and perverting the statements of Scripture, by evading their fair meaning and application, or by devising pretences for declining, to turn them to full account as a revelation of God’s will to men, or to derive from them the whole amount of information about divine and eternal things which they seem fitted and intended to convey.

It has been the generally received doctrine of orthodox divines, and it is in entire accordance with reason and common sense, that we are bound to receive as true, on God’s authority, not only what is “expressly set down in Scripture,” but also what, “by good and necessary consequence, may be deduced from Scripture” (Westminster Confession, c. i. s. 6 ); and heretics, in every age, and of every class, have, even when they made a profession of receiving what is expressly set down in Scripture, shewn the greatest aversion to what are sometimes called Scripture consequences, that is, inferences or deductions from scriptural statements, beyond what is expressly contained in the mere words of Scripture, as they stand in the page of the sacred record. Some interesting discussion on the subject of the warrantableness, the validity, and the binding obligation of Scripture consequences took place, in the early part of last century, among the English Presbyterians, when some of them had been led to embrace Arian views.

With the dishonesty which the history of the church proves to have been so generally a marked characteristic of heretics and men of progress, those of them who had really, in their convictions, abandoned the generally received doctrine of the Trinity, professed, at first, to object only to the unscriptural terms in which the doctrine was usually embodied, declaimed about freedom of thought and ecclesiastical tyranny, and denounced all Scripture consequences as unwarrantable and precarious, while they were, of course, quite willing to subscribe to the ipsissima verba of Scripture.

But the progress of the discussion soon shewed that these were hypocritical pretences, and that the men who employed them, had deliberately adopted opinions in regard to the Father, the Son, and the Holy Spirit, which have been generally repudiated by the church of Christ, and which could no more be brought out fully and distinctly as opposed to what they reckoned error, in the mere words of Scripture, than the sounder views which they rejected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practical Application of Calvinism in British and Foreign Evangelical Review</cite></span></figcaption>

+full+account+as+a+revelation+of+God%E2%80%99s+will+to+men%2C+or+to+derive+from+them+the+whole+amount+of+information+about+divine+and+eternal+things+which+they+seem+fitted+and+intended+to+convey.%0A%0AIt+has+been+the+generally+received+doctrine+of+orthodox+divines%2C+and+it+is+in+entire+accordance+with+reason+and+common+sense%2C+that+we+are+bound+to+receive+as+true%2C+on+God%E2%80%99s+authority%2C+not+only+what+is+%E2%80%9Cexpressly+set+down+in+Scripture%2C%E2%80%9D+but+also+what%2C+%E2%80%9Cby+good+and+necessary+consequence%2C+may+be+deduced+from+Scripture%E2%80%9D+%28Westminster+Confession%2C+c.+i.+s.+6+%29%3B+and+heretics%2C+in+every+age%2C+and+of+every+class%2C+have%2C+even+when+they+made+a+profession+of+receiving+what+is+expressly+set+down+in+Scripture%2C+shewn+the+greatest+aversion+to+what+are+sometimes+called+Scripture+consequences%2C+that+is%2C+inferences+or+deductions+from+scriptural+statements%2C+beyond+what+is+expressly+contained+in+the+mere+words+of+Scripture%2C+as+they+stand+in+the+page+of+the+sacred+record.+Some+interesting+discussion+on+the+subject+of+the+warrantableness%2C+the+validity%2C+and+the+binding+obligation+of+Scripture+consequences+took+place%2C+in+the+early+part+of+last+century%2C+among+the+English+Presbyterians%2C+when+some+of+them+had+been+led+to+embrace+Arian+views.%0A%0AWith+the+dishonesty+which+the+history+of+the+church+proves+to+have+been+so+generally+a+marked+characteristic+of+heretics+and+men+of+progress%2C+those+of+them+who+had+really%2C+in+their+convictions%2C+abandoned+the+generally+received+doctrine+of+the+Trinity%2C+professed%2C+at+first%2C+to+object+only+to+the+unscriptural+terms+in+which+the+doctrine+was+usually+embodied%2C+declaimed+about+freedom+of+thought+and+ecclesiastical+tyranny%2C+and+denounced+all+Scripture+consequences+as+unwarrantable+and+precarious%2C+while+they+were%2C+of+course%2C+quite+willing+to+subscribe+to+the+ipsissima+verba+of+Scripture.%0A%0ABut+the+progress+of+the+discussion+soon+shewed+that+these+were+hypocritical+pretences%2C+and+that+the+men+who+employed+them%2C+had+deliberately+adopted+opinions+in+regard+to+the+Father%2C+the+Son%2C+and+the+Holy+Spirit%2C+which+have+been+generally+repudiated+by+the+church+of+Christ%2C+and+which+could+no+more+be+brought+out+fully+and+distinctly+as+opposed+to+what+they+reckoned+error%2C+in+the+mere+words+of+Scripture%2C+than+the+sounder+views+which+they+rejected.%E2%80%9D%0A%0A%E2%80%94+William+Cunningham%2C+The+Practical+Application+of+Calvinism+in+British+and+Foreign+Evangelical+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3d2a180040.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3d2a180040.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/09/17/william-cunningham-on-the-need-for-a-system-of-doctrine/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

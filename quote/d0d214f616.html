<main class="wrap"><figure class="quote" id="q-d0d214f616" data-kw="">
<blockquote><p>Synonyms [of regeneration] more properly signifying are: I. Sanctification, because it produces holiness, that is, conformity of man with the law, Jn. 17:17, 19; 1 Cor. 1:2; Eph. 5:26. It is also called sanctification of the Spirit, 2 Thess. 2:13.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a1b0a92aaf" data-kw="">
<blockquote><p>Whether sanctification precede justification. Bishop [George] Downame in his appendix to the Covenant of Grace, does oppose my worthy tutor Mr. [William] Pemble for holding this opinion, but perhaps a distinction may solve all. As sanctification is taken for the act of the Holy Ghost working holiness into us, so it goes before faith and justification, so the apostle puts it before justifying, saying 1 Cor. 6:11, ‘But ye are sanctified, justified;’ but as it is taken for the exercise of holiness in regard of amendment of heart and life, so it follows justification in nature, but it is joined with it in time. The apostle Rom. 8:30, places vocation before justification, which vocation is the same thing with the first sanctification or regeneration. See Acts 26:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity... (London, 1654), bk. 7, ch. 10, ‘Whether Faith Alone does Justify?’</cite>, p. 530</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-5f9ffa19d6" data-kw="">
<blockquote><p>Q. 2. On the Way that we Know God Positively we can say, following the lead of Scotus (Oxon. 1 d. 3 part one q.1) that our knowledge of God is: 1) Positive and not merely negative, because a purely negative knowledge is no knowledge. 2) Quidditative or essential and not merely knowledge of his existence or attributes, for in understanding existence or property we must pre-understand some quasi-subject in which we understand that quasi-property to be present in; therefore we do not merely understand whether God is but to some extent and imperfectly what God is. 3) Not merely in a concept analogous to the concept of a creature which, concept is altogether other than the one said of a creature, but in some concept univocal to God and creatures. This is plain directly from experience and indirectly follows once innatism, illuminationism, and ontologism have been rejected (see below). 4) Proper, but through concepts composed of common concepts. We can attain to many concepts proper to God that do not belong to creatures, for example, supreme being, infinite good, pure act, supreme legislator, etc. But concepts of this sort are not proper notions from proper notions but from transcendental notions, as first, supreme, being, good, which are predicated in common of God and creatures. 5) Notions abstracted from creatures, for as Scotus says, “All metaphysical investigation of God proceeds as follows: a) by considering the formal idea of something, and b) by taking away from that formal idea the imperfection that it has in creatures, and c) by keeping that formal idea and attributing to it altogether supreme perfection, and by thus attributing it to God” (Oxon. ibid.). Note the triple way, namely of affirmation, of negation, and of eminence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958) Wolter was a Scotus scholar and writes from that perspective.</cite>, p. 87</span></figcaption>

</figure><figure class="quote" id="q-6d53836d81" data-kw="">
<blockquote><p>Positive attributes are such which so ascribe some perfection to God, as not inferring any respect unto the creature’s existing or in present being; by these, our understanding is helped in our meditation of God by way of eminency. The more principal of them are in number six: 1. Holiness. 2. Wisdom. 3. Will. 4. Liberty. 5. Omnipotency. 6. Perfection. To which, or some of which, the rest of like nature may conveniently be referred. … God comprehending his own essence, sees all things, because all possibilities, futuritions and beings, that is, all things that might have been, shall be or actually be, are eminently contained in the divine essence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, p. 16</span></figcaption>

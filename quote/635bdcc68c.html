<blockquote><p>…there was a morning and an evening-sacrifice, which were offered about the third and ninth hours; and there was a great expediency in it, that there might be some bodily refreshing betwlxt the times, and the necessity of nature was provided for in it, and Sabbath-exercises were distinguished thereby from fasts; and upon this accompt [account], it is equitable that Christian service should be carried for time after such manner:</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d42f7d329e" data-kw="">
<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day [Ex. 35:3] was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsettled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-white.html">John White</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures</cite>, ... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.</span></figcaption>

</figure><figure class="quote" id="q-16bd4886a2" data-kw="">
<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Plainly Laid forth</cite>, … (London, 1595), | pt. 2, p. 249</span></figcaption>

<blockquote><p>That saying of our Savior, that the Sabbath was not made for man etc. was not uttered by Him to show that the action of the disciples in plucking and eating the ears of corn was warranted by necessity against the command of the Sabbath, but that it was not within the prohibition of works on the Sabbath, which ordinarily is restrained to works of a civil or servile nature, not to natural refreshment, which is always indulged on the Sabbath and so that work of mercy is not under the prohibition, for the plucking of the ears of corn, when they were in the field was no more then drawing drink out of a vessel and of this opinion is learned [Martin] Chemnitz: Hoc Christus it a defendit, ut simul ostendat extra casum contempus publici ministry, et turbationis cultus sabati propter otium externum Sabati, hominem ne levi quidē incommodo assiciendum. ‘By this Christ does so defend his disciples, as withal He shows that, out of the case of contempt of the public ministry and disturbance of the worships of the Sabbath, for the external rest of the Sabbath, a man is not to undergo the least damage.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-geree.html">John Geree</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Might Overcoming Right. Or a Clear Answer to Mr. John Goodwin’s Might and Right well met</cite>, (London: Bostock, 1649), ch. 1, section 3</span></figcaption>

<blockquote><p>2. As to the question on which you wish my opinion, whether it is lawful to fast on the seventh day of the week, I answer, that if it were wholly unlawful, neither Moses nor Elijah, nor our Lord Himself, would have fasted for forty successive days. But by the same argument it is proved that even on the Lord’s day fasting is not unlawful.</p></blockquote>

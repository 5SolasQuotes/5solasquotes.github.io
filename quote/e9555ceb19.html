<blockquote><p>THAT the Lord’s-day, or weekly Sabbath, is a Sign between God and us, that he is the Lord our Sanctifier.

IT is great Condescension and Grace in God to us, to annex a reason unto any of his Commandments. His Sovereign will is the highest reason.— Yet is there much of Majesty and much Grace in this Reason, It is a Sign between me and you. And will God in very deed give us such a Sign and Token between Himself and us? will he in very deed deal so with Man upon the Earth? And give a standing Sign too, throughout all the Generations of men on earth? O the favour and Grace to dust and ashes! while He humbleth himself to behold the things that are above!

BUT what is the Lord’s Sabbaths a Sign of thro’ all the Generations of men? Why they signify and let us know, 1. That he is the Lord and our Lord: Lord of the world, and Lord of our time and lives. The great Proprietor and absolute Disposer of them. 2. That he is the Lord our Sanctifier. This is that Glory wherein he delights to appear unto his Creatures, and for which to be adored by them. So the Seraphims worship him above, and cover their faces, crying, Holy, Holy, Holy is the Lord of Hosts. And so we worship the Lord in the Beauties of Holiness on earth; His Sabbaths being unto us the sign, and his Ordinances the blessed means of holiness and Sanctification.

THE Lord our Sanctifier. It speaks the utmost favour, grace and mercy to us, and the utmost holiness in the Lord our God. He is the Sanctifier of all whom he saves. His Elect are chosen unto Salvation thro’ sanctification of the Spirit. And he has appointed his Holy Sabbath and all the Ordinances of his worship, under the blessing of his Spirit, to be the season and means of the Regeneration and Sanctification of souls, and of their growth and increase in Holiness.

GOD’s Sabbaths were from the beginning of the world given for a Sign and a Memorial. They are a Sign that in six days the Lord made Heaven and earth— Our Lord’s days are now a Sign of the Resurrection of Christ from the dead. And in short, both the Jewish and Christian Sabbath are a Sign to fallen man, of a Covenant of Grace and Salvation granted to him thro’ Jesus Christ; the promised seed of the Woman, but the Only Begotten of the Eternal Father.

TO be sure, The Observation of a weekly Sabbath is a very public and open thing; a thing of much Solemnity and Significancy. It is a perpetual and universal Memorial of something very great and important between God and man.— Every child is ready to ask, What meaneth this Service? what signifies such a weekly Solemnity? —God answers in my Text, It is a sign between Me and you. Surely then a sign of something very great and good on God’s part, and worthy of his blessed and glorious Name, and of something very good and great, beneficial and necessary to us! Yes truly: the work and grace is great on God’s part, to be our Sanctifier! the benefit and mercy vast to us, our Sanctification!— This, this is signified by the weekly Sabbath. What more worthy of the Holy God? what more important to polluted, guilty and perishing Sinners? Of his mercy he thus saves us.</p></blockquote>

<blockquote><p>For the more clear opening of the ensuing treatise it is necessary to speak somewhat of worship and adoration, and especially of these: 1. honor. 2. praise. 3. glory, 4. reverence. 5. veneration. 6. devotion. 7. religion. 8. service. 9. worship. 10. love. 11. obedience. 12. adoration.

1. Honor, is a testification of the excellency of any, Aristotle, Ethics, bk. 8, ch. 8; Aquinas, Honos est signum quoddam excellentiae. ‘Honour is a sign or expression of excellency in any,’ it does not import any superiority in the party whom we honor, as adoration does. [2.] Praise is a special honoring of any, consisting in words. [3.] Glory is formally the effect of honor, though it be taken, pro claritate, ‘for the celebrity’ or renownedness of any; yet glory seems to be founded upon celebrity, as its foundation. [4.] Reverence is a sort of veneration of a person for excellency connotating a sort of fear. [5.] Veneration is a sort of fear, and reverencing of a person: I see not well any difference between reverence and veneration, except that veneration seems to be some more, and comes nearer to adoration. [6.] Devotion is the promptitude, cheerfulness, or spiritual propension of the will to serve God; [7.] Religion is formally in this, when a man subjects himself to God, as to his supreme Lord, and thence arises to give him honor, as his God and absolute Lord. The two integral parts of religion are the subjection of the reasonable creature to God.

2. An exhibition of honour… [8.] Service is from the bond of subjection, to reverence God as an inferior or servant does his Lord and Master: A servant does properly do the will of his master for the gain or profit that redounds to his master… [9.] For worship formally is to give reverence to God for his excellency; in one and the same act we may both worship God and serve Him. Only service does include the obligation of a servant to a lord. As concerning [10.] love, faith and hope, they are internal worship, not properly adoration: Love as love does rather import an equality with the thing loved, and a desire of an union, rather than a submission. It is true, there is a perfection in that which we love, but not essentially to perfect the lover… Faith and hope may suppose a resting on a helper as a helper, and so are internal worship; if they be adoration formally may be a question… [11.] Obedience is founded, not formally upon God’s excellency, properly so called, but upon his jurisdiction and authority to command. [12.] Adoration is the subjection or prostration of soul or body to God in the due recognition and acknowledgement of his absolute supremacy. There is no need, that Vasquez [a Romanist] should deny that there is any internal adoration, for that adoration is only an external and bodily worship of God, can hardly be defended… as external adoration is an act by which we offer our bodies to God and subject the utter man to him, in sign of service and reverence to so supreme a Lord, so there is a heart-prostration and inward bowing of the soul answerable thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646) | Introduction, Section 6, ‘What Honor, Praise, Glory, Reverence, Veneration, Devotion, Service, Worship, etc. are’, p. 83</span></figcaption>

<blockquote><p>4. It being the custom then to cover the faces of those that were put to any great shame, a man that shall vail his head and face does thereby take reproach unto himself. … 5. …As custom makes it a shame to her to be shaven, so also to be unvailed. (Note, that this was a changeable custom, and is contrary now with us). …

13. The signification of being uncovered, being by custom a note [of] superiority, judge in yourselves whether such be decent for a woman at the church’s prayers. …

14. And when common custom has made the wearing of hair at length the note of the female sex, does not nature itself tell you, that it is a shame for a man to be so like a woman? (when God forbids us so much as to be clothed as women, to confound the sexes, which must needs be visibly distinguished). …

15. But use tells us that for women to let their hair grow out at length is a signification of modesty, as a kind of covering, and so is decent to them. …

16. But if any will contentiously dispute against what I say, though I would make no greater a matter of such things than the nature of them requires, let this answer suffice to resolve sober minds: The custom of all the Churches is against women’s being uncovered, as an unseemly thing; and you should not easily be different from all the Churches in a matter which depends on the signification of an action, which use and common opinion must interpret. We that must be as concordant as we can, must not affect dissimilitude.</p></blockquote>

<blockquote><p>This fire was a type or declaration of the presence of God in the Person of the Son. For with respect unto the Father He is called an angel, the Angel of the Covenant; but absolutely in Himself, He was Jehovah, the God of Abraham, etc. And of his presence the fire was a proper representation. For in his nature He is as a consuming fire; and his present work was the delivery of the Church out of a fiery trial. This fire placed itself in a bush, where it burned, but the bush was not consumed: And although the continuance of the fire in the bush was but for a short season, a present appearance; yet thence was God said to dwell in the bush; the goodwill of Him that dwelt in the bush; Deut. 33:16. And this is so spoken because the being of the fire in the bush for a season was a type of Him in whom the fulness of the Godhead dwelt bodily, and that forever, Col. 2:9. Of Him who was made flesh and dwelt among us, Jn. 1:14. The eternal fire of the divine nature dwells in the bush of our frail nature, yet is not consumed thereby. God thus dwells in this bush, with all his goodwill towards sinners.</p></blockquote>

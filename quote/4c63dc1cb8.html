<main class="wrap"><figure class="quote" id="q-4c63dc1cb8" data-kw="">
<blockquote><p>Then again, we have had an argument from Scripture, from the text, “Let the Word of Christ dwell in you richly, in all wisdom, teaching and admonishing one another in psalms and hymns and spiritual songs.” But first, let it be inquired how the Word of Christ – the Word of God – is to dwell in us richly by singing the word of man? That is a strange idea to extract from the writings of a well regulated intellect like that of Paul – not to speak of their being written under the inspiration of the Spirit.

I can understand how the Word of God should dwell in us richly by singing the Word of God – dwelling on it in solemn, meditative, grave, sweet singing of it, till – to use a Scotch phrase – it seeps into the soul and takes its dwelling there, while in warm emotion of faith the worshipper’s spirit in believing song dwells deliberately upon it. Thus it may come to dwell richly in us. But how is God’s Word to dwell in us by singing man’s word? How is the Divine Word to dwell in us by singing human hymns?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Psalms and Uninspired Hymns. Extracts from Speech by Dr. Hugh Martin, in the General Assembly of the Free Church, 3rd June, 1872 in Free Presbyterian Magazine</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>43. Vocal prayer is either in prose, or in meter.

44. In meter singing is joined, and therefore there must be more care of the speech and tone, then in prose.

45. But the melody of singing is ordained for a certain spiritual delight, whereby the mind is detained in the meditation of the thing that is sung. … 48. But because this religious melody has the respect of prayers: therefore it is not so fit, that the Decalogue, and other such like which do not partake the nature of prayer, be turned into meter and be sung instead of psalms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-fisher.html">Edward Fisher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, &amp; the Interpreters thereof, and brought into Method</cite>, (London: 1642), Book 2, ch. 9, ‘Of Prayer’, pp. 283-4</span></figcaption>

</figure><figure class="quote" id="q-4ddeaf76d2" data-kw="">
<blockquote><p>It is well known, that in the last century Mr. Rouse’s and Mr. Barton’s versions of the Psalms were much in use and highly esteemed and recommended by many; several other versions were also in use; but the New England and the Scotch were sung by many congregations, much recommended, being preferred by them as the closest versions and most agreeable to the original. For it was then the concurrent judgement of the dissenting churches, that nothing ought to be sung in public worship, but those psalms, hymns, and spiritual songs which God has provided his Church with in his inspired Word. But of late years these versions have been much despised by some, and laid aside by many congregations which formerly used them; because of the roughness of the lines… and other versions, or rather paraphrases on the psalms are made use of by them. Many others use hymns of mere human composure as preferable to the inspired ones. But there are yet many serious Christians, and some churches, that adhere to the sentiments of our godly ancestors in preferring Scripture psalms, hymns and songs to any mere human composures, lest they should incur the guilt of bringing strange fire to God’s altar…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-pike.html">Samuel Pike</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Book of Psalms in Metre. Fitted to the Various Tunes in Common Use</cite>, … (London, 1751), ‘The Preface’, p. iii. Pike (1717?–1773) was an Independent minister in London, known for his work on cases of conscience. He argues for inspired Bible-song singing in the Preface.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-a6e684dc8d" data-kw="">
<blockquote><p>But it can be proved by perfectly sufficient evidence that the terms “hymns” and “songs” are actually different names for the inspired Psalms, and must have been perfectly familiar as such to the Ephesians and Colossians. The terms “psalms, and hymns, and songs” are all employed as titles to different psalms in the inspired collection in the Septuagint translation of the Old Testament into the Greek language. Moreover, in Colossians iii. 16, the command to sing psalms and hymns and song is prefaced by the expression, “Let the word of Christ dwell in you richly;” and then there follow the participial clauses, “speaking to one another, and singing with grace,” as explanatory of the command about the word of Christ, and showing, we think, unmistakably that the psalms, hymns, and songs are all “the word of Christ,” or portions of his inspired psalmody. Besides, the word “spiritual” following all three terms, as it does in the Greek, may more rationally be regarded as qualifying all three than only the last one, and may without violence he translated “inspired.” The command would then be to sing the psalms, hymns, and songs given by the Spirit of God for that purpose.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

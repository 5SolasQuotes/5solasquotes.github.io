<main class="wrap"><figure class="quote" id="q-3f2f815566" data-kw="">
<blockquote><p>Now the Galatians had been forced by the false apostles to observe these same rites as something necessary for righteousness. This is why he says that they have lost grace and Christian liberty, and have turned back to the slavery of the weak and beggarly elements. They had been persuaded by the false apostles that these laws had to be observed; that when they were observed, they granted righteousness; but that when they were neglected, they brought damnation. But Paul does not permit consciences to be bound by the Mosaic Law in any way, but everywhere he sets them free from the Law. “Now I, Paul,” he says later on, in chapter five (v. 2), “say to you that if you receive circumcision, Christ will be of no advantage to you.” In Col. 2:16 he says: “Let no one pass judgment on you in questions of food and drink or with regard to a festival or a new moon or a Sabbath.” Thus Christ says (Luke 17:20): “The kingdom of God does not come by observance.” Much less should consciences be burdened and ensnared by human traditions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 411.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>if any man go about to express God’s Majesty by any shape: he does Him wrong, and it is high treason to Him, because He is uncomprehensible in his glory… Now we see that the Papists have gone about to express God by shapes: therefore it follows that they have marred all religion. And whereas they allege that there were cherubins painted upon the vail of the Temple, and that two likewise did cover the ark: it serves to condemn them the more. When the Papists pretend that men may make any manner of image: What, say they? Has not God permitted it? No: but the imagery that was set there, served to put the Jews in mind that they ought to abstain from all counterfeiting of God, insomuch that it was a mean to confirm them the better, that it was not lawful for them to represent God’s Majesty, or to make any resemblance thereof.</p></blockquote>

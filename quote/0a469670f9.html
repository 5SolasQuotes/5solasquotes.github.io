<main class="wrap"><figure class="quote" id="q-0a469670f9" data-kw="">
<blockquote><p>So profound a repugnance to death and all that death meant,manifesting itself during his life, could not fail to seize upon him with peculiar intensity at the end. If the distant prospect of his sufferings was a perpetual Gethsemane to Him, the immediate imminence of them in the actual Gethsemane could not fail to bring with it that “awful and dreadful torture” which Calvin does not scruple to call the “exordium” of the pains of hell themselves. Matthew and Mark almost exhaust the resources of language to convey to us some conception of our Lord’s “agony”¹ as an early interpolator of Luke (Lk. xxii. 44) calls it, in this dreadful experience. The anguish of reluctance which constituted this “agony” is in part described by them both—they alone of the Evangelists enter into our Lord’s feelings here—by a term the primary idea of which is loathing, aversion, perhaps not unmixed with despondency.² ¹ [Greek] agonia: see G. Heine, Synonymik etc., 1898, p. 189: “Contest, quaking, agitation (and anxiety of the issue?) Lk. xxii. 44; Luther, ‘he grappled with death’, Weizsacker, ‘he struggled’, Bengel; ‘supreme grief and anguish. It properly denotes the anguish and passion of the mind, when it enters upon a conflict and arduous labor, even when there is no doubt of a good issue’.” Plummer in loc.: “Field contends that fear is the radical notion of the word. The passages in which it occurs in LXX confirm this view… It is therefore an agony of fear that is apparently to be understood.” It would be better to say consternation, appalled reluctance. ² [Greek] ademoneo: see Heine, Synonymik etc., 1898, p. 148: “pavesco, angor.” Cf. Lightfoot, on Phil. ii. 26: ” The primary idea of the word will be loathing and discontent.” “It describes the confused, restless, half-distracted state, which is produced by physical discouragement, or by mental distress, or grief, shame, disappointment, etc.” Lagrange on Mk. xviii. 33: “seized with despondency”. Thomas Goodwin (Works, v. 276): “so that we see Christ’s soul was sick and fainted,” “his heart failed him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Emotional Life of our Lord’</cite>, (1912), pp. 74-76</span></figcaption>

<blockquote><p>In the Christian religion there are two questions above all others which are difficult. The first concerns the unity of the three persons in the one essence in the Trinity; the other concerns the union of the two natures in the one person in the incarnation. As in the Trinity the unity of essence does not hinder the persons from being distinct, so the union of natures in the person of Christ does not prevent both the natures and their properties from remaining unconfounded and distinct.</p></blockquote>

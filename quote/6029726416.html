<main class="wrap"><figure class="quote" id="q-6029726416" data-kw="">
<blockquote><p>He bled every vein dry for us: and what remained lodged about the heart of a dead Jesus, was let out by that bloody spear which pierced the Pericardium: so that he bestowed the whole treasure of his blood upon us. And thus liberal was he of his blood to us when we were enemies.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9bef223640" data-kw="">
<blockquote><p>A person so great, so high, so glorious, as this Jesus Christ was, should have love for us, that passes knowledge. It is common for equals to love, and for superiors to be beloved; but for the King of princes, for the Son of God, for Jesus Christ to love man thus: this is amazing, and that so much the more, for that man the object of this love, is so low, so mean, so vile, so undeserving, and so inconsiderable, as by the scriptures, everywhere he is described to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Saints’ Knowledge of Christ’s Love</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-states-of-christ/state-of-humiliation.html">State of Humiliation</a></span></div>

</figure><figure class="quote" id="q-98ebf40a4f" data-kw="">
<blockquote><p>In reference to grateful love, nothing so much tends to fill the heart with this emotion as the believing realization of Christ’s redemption work—nothing so melts the heart; and no purer love to God can be imbibed. … There is no motive to a holy life so powerful and efficacious as that which is drawn from the propitiatory work of Christ, who, after meeting the demands of the law and bearing its curse, makes that same law a rule to direct our steps; and Christians learn to take it from the Mediator’s hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Atonement as Taught by Christ Himself</cite>, ch. 8, sec. 52</span></figcaption>

</figure><figure class="quote" id="q-33e3a0f80d" data-kw="Communion">
<blockquote><p>Christ hath never enough of the soul. He would have them more and more open to him. Our hearts are for Christ, who hath the heaven of heavens, and the soul of a believing Christian for himself to dwell in. He contents not himself to be in heaven alone, but he will have our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bowels Opened</cite>, Sermon V (Song 5:2)</span></figcaption>

</figure><figure class="quote" id="q-ca4e6df0b2" data-kw="Communion">
<blockquote><p>Christ gives himself to the soul, with all his excellencies, righteousness, preciousness, graces, and eminencies, to be its Saviour, head, and husband, for ever to dwell with it in this holy relation. He looks upon the souls of his saints, likes them well, counts them fair and beautiful, because he has made them so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Communion with God</cite>, Part 2, ch. 3, “He Gives Himself to Us”</span></figcaption>

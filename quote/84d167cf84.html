<main class="wrap"><figure class="quote" id="q-84d167cf84" data-kw="">
<blockquote><p>From Boulogne we travelled to Paris, by day and by night, and spent a Sabbath there. Alas! poor Paris knows no Sabbath; all the shops are open, and all the inhabitants are on the wing in search of pleasures,—pleasures that perish in the using. I thought of Babylon and of Sodom as I passed through the crowd. I cannot tell how I longed for the peace of a Scottish Sabbath.

There is a place in Paris called the Champs Elysées, or Plains of Heaven,—a beautiful public walk, with trees and gardens; we had to cross it on passing to the Protestant church. It is the chief scene of their Sabbath desecration, and an awful scene it is. Oh, thought I, if this is the heaven a Parisian loves, he will never enjoy the pure heaven that is above! Try yourselves by that text, Isa. Iviii. 13, 14. I remember of once preaching to you from it. Do you really delight in the Sabbath day? If not, you are no child of God.

I remember with grief that there are many among you that despise the Sabbath,—some who buy and sell on that holy day,—some who spend its blessed hours in worldly pleasures, in folly and sin. Oh, you would make Dundee another Paris if you could! Dear believers, oppose these ungodly practices with all your might. The more others dishonour God’s holy day, the more do you honour it, and show that you love it of all the seven the best. Even in Paris, as in Sardis, we found a little flock of believers. We heard a sweet sermon in English, and another in French. There are only 2000 Protestant hearers out of the half million that inhabit Paris, and there are fourteen faithful sermons preached every Sabbath.</p></blockquote>

<blockquote><p>Therefore, if the activity is conducive to worship, then it is lawful. We cannot ignore the human conscience here either, since an activity that might be conducive for worship to one person may not be conducive to worship for someone else. To take one example, it is certainly wise to let small children let loose some of their excess energy on the Sabbath (contrary to Laura Ingalls Wilder’s Farmer Boy! [below]). Otherwise, they will not be able to sit still and pay attention in worship. One does not have to take the attitude of Almanzo Wilder’s father [in Farmer Boy] in order to have a Puritan view of what is acceptable on the Sabbath! It is certainly a work of necessity to do something about the energy of small children. We must avoid both extremes of legalism and antinomianism here, as well as everywhere in our treatment of the law.</p></blockquote>

<blockquote><p>Now followeth that duty which one day in seven must be given unto the Lord, in the sanctification of his Sabbath. Remember, So he seemeth to speak, because when as this commandment was before given, they had neglected the same. The Sabbath day to sanctify, that is, to separate it from a common use, and dedicate it to a peculiar and holy use unto the Lord. So the gold, the vessels, &amp;c. were said to be holy and dedicated for the holy use of the Temple, and might not be given or put to any other use: To sanctify a Sabbath therefore, is to call our selves, not from our own sinful ways, which we must do every day, but from out honest and lawful callings, that giving our selves to godly and Christianly exercises of our faith, we may be strengthened in the ways of God, and so in thought, word, and deed consecrate a glorious Sabbath unto the Lord.

Therefore it is called the Sabbath of God, Exod. 20. 10. and Levi. 23. 3. He calleth it a holy convocation, that is, dedicated to holy meetings. So Esai 58. 13. Hereby is confuted their opinion that take it a Sabbath kept, if their rest from their labours, so in the mean time they labour in plays, dancings, vain songs and interludes, &amp;c. as though the Lord had called us from our profitable labour commanded, to displease him in these vanities. Again others also who if they be better then the former, abstaining from those things, have notwithstanding their heads, hearts, and mouths, so full of worldly things, as they do not indeed perform the truth of the Sabbath, when as it should be kept as the rest of the Law, not only in action, but also in the thoughts of the heart and words of the mouth. Esa. 58. Amos. 8. 5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/dudley-fenner.html">Dudley Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief treatise upon the first table of the law orderly disposing the principles of religion, whereby we may examine our selves</cite>, ([Middleburg: R. Schilders, 1588]), unpaginated.</span></figcaption>

<blockquote><p>Obj. 12. “The king of Great Britain, &amp;c. is an Erastian king.” That is, the supeme judge in the church, as well as in the state.

Ans. The king has too much power in church matters, but it is not true, that his power in them is supreme.

The oath of allegiance, acknowledging the supremacy of King Charles II. and of his successors, over all persons, and in all causes, was rescinded at the happy Revolution in 1688, both by the English, and Scotch parliament. The English parliament abrogated the oaths of allegiance, and supremacy, which had been sworn to the late king, and framed the two following oaths, to be taken instead of them. –

“I A. B. do sincerely promise and swear, that I will be faithful, and bear true allegiance to their Majesties King WILLIAM and Queen MARY. So help me GOD.” – “I A. B. do swear, that I do from my heart abhor, detest, and abjure, as impious and heretical, this damnable doctrine and position, that princes excommunicate or deprived by the Pope, or any authority of the See of Rome, may be deposed or murdered by the subjects, or any others whatsoever. And I do declare, that no foreign prince, person, prelate, state, or potentate, has, or ought to have any jurisdiction, power, superiority, pre-eminence, or authority, ecclesiastical or spiritual, within this realm. So help me, GOD.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fletcher.html">William Fletcher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scripture-Loyalist: Containing a Vindication of Obedience to the Present Civil Government, in things Lawful</cite>, (Carlisle: John McCarrell, 1806), p. 55.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/oaths-and-vows.html">Oaths and Vows</a></span></div>

The oath of allegiance, acknowledging the supremacy of King Charles II. and of his successors, over all persons, and in all causes, was rescinded at the happy Revolution in 1688, both by the English, and Scotch parliament. The English parliament abrogated the oaths of allegiance, and supremacy, which had been sworn to the late king, and framed the two following oaths, to be taken instead of them. –

“I A. B. do sincerely promise and swear, that I will be faithful, and bear true allegiance to their Majesties King WILLIAM and Queen MARY. So help me GOD.” – “I A. B. do swear, that I do from my heart abhor, detest, and abjure, as impious and heretical, this damnable doctrine and position, that princes excommunicate or deprived by the Pope, or any authority of the See of Rome, may be deposed or murdered by the subjects, or any others whatsoever. And I do declare, that no foreign prince, person, prelate, state, or potentate, has, or ought to have any jurisdiction, power, superiority, pre-eminence, or authority, ecclesiastical or spiritual, within this realm. So help me, GOD.”

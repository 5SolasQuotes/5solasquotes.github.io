<main class="wrap"><figure class="quote" id="q-338e77a979" data-kw="">
<blockquote><p>And thereupon it is found in reason to be a presuming of our own against the divine wisdom either to change an ordinance which God has instituted for another ordinance of our own devising, of the same reason and to the same intent, or to add to the divine ordinances by way of supplement human ordinances of the same reason and intent with the divine, and that either as necessary to divine service or only as profitable and de bene esse [of its well-being]. For so to do is plainly to derogate from the divine ordinances. … The express text of Scripture proves this, that some additions are forbidden: Dt. 4:2; 12:32. The prohibition is not merely of adding to the rule, but of doing more than the rule requires, as the precept is not of preserving the rule, but observing what is commanded in it. It is indeed against mingling the heathenish observations with divine institutions; and it is not to be imagined that it is only a prohibition of the forgery of divine oracles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Remains of</cite>, Of Divine Worship… in The Remains of the Reverend and Learned Mr. John Corbet, Late of Chichester Printed from his own Manuscripts (London: Thomas Parkhurst, 1684), pt. 3, sect. 3, Of the Rule that Limits the Kinds of Worship</span></figcaption>

</figure><figure class="quote" id="q-160d84e036" data-kw="">
<blockquote><p>Concerning the Worship of God We call upon God in Spirit and in truth, in true faith, in accordance with the Word of the Lord in Christ Jesus, and worship Him inwardly and outwardly with the deeds commanded by God. For God is not worshipped by human doctrines, mandates, and works, but only by those which He Himself commands and effects by His Holy Spirit through faith and the Word (John 4; Matt. 5; Isa. 29; Rom. 14). We, therefore, confess that the worship of God is the work commanded by God, performed by the Holy Spirit in the elect, with confidence in the Mediator, in Spirit and in truth that we should obey God, celebrate, and acknowledge God (Rom. 12). So the fathers and the councils teach (Ex. 34; Matt. 4; Deut. 6).</p></blockquote>

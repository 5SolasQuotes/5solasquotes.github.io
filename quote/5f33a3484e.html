<main class="wrap"><figure class="quote" id="q-5f33a3484e" data-kw="">
<blockquote><p>They have taken from its fullness and perfection, its sufficiency and excellency, by their Masora, their oral law, or verbum agrafon, their unknown, endless, bottomless, boundless treasure of traditions, — that pánasofon fármakon for all their abominations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Divine Original of the Scriptures</cite>, Works (Goold), vol. 16</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-22b111434a" data-kw="">
<blockquote><p>The Holy Scripture is the only sufficient, certain and infallible rule of all saving knowledge, faith and obedience … The whole counsel of God concerning all things necessary for his own glory, man’s salvation, faith and life, is either expressly set down or necessarily contained in the Holy Scripture: unto which nothing at any time is to be added, whether by new revelation of the Spirit, or traditions of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.1, 1.6</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Holy Scripture is the only sufficient, certain and infallible rule of all saving knowledge, faith and obedience … The whole counsel of God concerning all things necessary for his own glory, man’s salvation, faith and life, is either expressly set down or necessarily contained in the Holy Scripture: unto which nothing at any time is to be added, whether by new revelation of the Spirit, or traditions of men.”

— Particular Baptists, Second London Baptist Confession of Faith, 1689, 1.1, 1.6">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Holy+Scripture+is+the+only+sufficient%2C+certain+and+infallible+rule+of+all+saving+knowledge%2C+faith+and+obedience+%E2%80%A6+The+whole+counsel+of+God+concerning+all+things+necessary+for+his+own+glory%2C+man%E2%80%99s+salvation%2C+faith+and+life%2C+is+either+expressly+set+down+or+necessarily+contained+in+the+Holy+Scripture%3A+unto+which+nothing+at+any+time+is+to+be+added%2C+whether+by+new+revelation+of+the+Spirit%2C+or+traditions+of+men.%E2%80%9D%0A%0A%E2%80%94+Particular+Baptists%2C+Second+London+Baptist+Confession+of+Faith%2C+1689%2C+1.1%2C+1.6&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F22b111434a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/22b111434a.html">Permalink</a><a class="src" href="https://founders.org/library/1689-confession/" rel="noopener" target="_blank">Read it online · Founders Ministries</a></div>
</figure><figure class="quote" id="q-4a2d1718e9" data-kw="">
<blockquote><p>Therefore we ought gratefully and reverently to embrace and kiss this blessing of the Holy Spirit, that He condescended to our infirmity and did not want to burden it too much but selected and assigned for writing that of the doctrine and miracles of Christ which He judged to be sufficient and necessary for true faith and eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part 1, Concerning Sacred Scripture</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Therefore we ought gratefully and reverently to embrace and kiss this blessing of the Holy Spirit, that He condescended to our infirmity and did not want to burden it too much but selected and assigned for writing that of the doctrine and miracles of Christ which He judged to be sufficient and necessary for true faith and eternal life.”

— Martin Chemnitz, Examination of the Council of Trent, Part 1, Concerning Sacred Scripture">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CTherefore%20we%20ought%20gratefully%20and%20reverently%20to%20embrace%20and%20kiss%20this%20blessing%20of%20the%20Holy%20Spirit%2C%20that%20He%20condescended%20to%20our%20infirmity%20and%20did%20not%20want%20to%20burden%20it%20too%20much%20but%20selected%20and%20assigned%20for%20writing%20that%20of%20the%20doctrine%20and%20miracles%20of%20Christ%20which%20He%20judged%20to%20be%20sufficient%20and%20necessary%20for%20true%20faith%20and%20eternal%20life.%E2%80%9D%0A%0A%E2%80%94%20Martin%20Chemnitz%2C%20Examination%20of%20the%20Council%20of%20Trent%2C%20Part%201%2C%20Concerning%20Sacred%20Scripture&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4a2d1718e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4a2d1718e9.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-8141366f7a" data-kw="">
<blockquote><p>Likewise we reject human traditions, even if they be adorned with high-sounding titles, as though they were divine and apostolical, delivered to the Church by the living voice of the apostles, and, as it were, through the hands of apostolical men to succeeding bishops which, when compared with the Scriptures, disagree with them; and by their disagreement show that they are not Apostolic at all. … it would be wicked to assert that the apostles by a living voice delivered anything contrary to their writings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Second Helvetic Confession</cite>, 1566, ch. 2</span></figcaption>

</figure><figure class="quote" id="q-a09c007962" data-kw="Augustine canonical scriptures">
<blockquote><p>Augustine, De Natura et Gratia, c. 91, writes thus: “I owe an absolute assent only to the canonical scriptures.” What value, may I ask, did this father set upon traditions, when he declared that he owed an absolute assent to nothing but the canonical scriptures?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 6, ch. 17</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1e0d602464" data-kw="">
<blockquote><p>It is this fact which makes the doctrine of the deposing power so great a stumbling-block in the way not only of the theory of the personal infallibility of the Popes but of every theory of infallibility whatsoever. Take the theory most opposed to the Ultramontane, the Gallican, and I say that the theory that the Pope possesses by divine right the power of deposing kings, satisfies all the Gallican tests whether a doctrine is infallibly true. It was solemnly propounded by the Pope as ‘de fide,’ and acquiesced in generally by the Western Christian world. Particular exercises of the power were objected to by the parties whom they affected, as transgressing the just limits of the power; but the general existence of the power was not denied. If, therefore, we now do not admit that Christ gave the Popes that power in temporal things which they claim, it follows inevitably that what Romanists count the Catholic Church may err; for, setting aside the Eastern nations which they do not include in it, all the West agreed in accepting the Pope&#x27;s account of his power as true.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture XXIII</span></figcaption>

</figure><figure class="quote" id="q-584b7f205d" data-kw="See of Peter Vicar of Christ">
<blockquote><p>To fix down Christ and the Holy Spirit and the Church to a particular spot, so that every one who presides in it, should he be a devil, must still be deemed vicegerent of Christ, and the head of the Church, because that spot was formerly the See of Peter, is not only impious and insulting to Christ, but absurd and contrary to common sense. … The see which they occupy, therefore, no more makes them the vicars of Christ, than it makes an idol to become God, when it is placed in the temple of God (2 Thess. 2:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.7.29</span></figcaption>

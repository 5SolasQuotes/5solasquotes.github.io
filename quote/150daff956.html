<main class="wrap"><figure class="quote" id="q-150daff956" data-kw="">
<blockquote><p>The Schoolmen are generally for the negative, and so are many able Protestant Divines: Rivet (in Gen. 28, Exercitation 125 and in his Jesuita Vapulans), Capel (in Thes. Theol. Salmur), Mr. Cartwright (Against the Rhemists, on Heb. 7:4 and in his Necessity of Discipline). Mr. [John] Dod, Bishop [George] Carleton, Dr. [John] Prideaux, Dr. [William] Sclater [I] and Mr. Whateley, were for the affirmative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Of Pastors: of their Maintenance’ in Body of Divinity</cite>, p. 461 (1654)</span></figcaption>

</figure><figure class="quote" id="q-ee7f641456" data-kw="">
<blockquote><p>Because there is a difference betwixt carrying the colors [banner or flag] in an army tali modo [in such a way] as all the army at once may see the colors, and the carrying of the colors. Yet the colors are a note-visible of such an army: so there is a difference betwixt preaching the Word, simpliciter, and preaching the Word, tali modo, ‘in such a way’ in one material house only. And therefore it is necessary that government which concerns many Churches consociated, be in its exercise hic &amp; nunc [here and now], larger than preaching of the Word in its exercise, hic &amp; nunc: which cannot be done but to a multitude which convenes epi to auto, ‘to the same material place’. And we see an act of government, Acts 15, by confession of our [Independent] Brethren, belonging to diverse consociated Churches and performed by them, and yet these cannot ordinarily meet to one and the same place in all their members for hearing of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1644), pt. 1</cite>, pp. 303-304</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-14172bfe30" data-kw="">
<blockquote><p>…for you lay down as an undeniable principle, and the basis of your whole doctrine of independent government that there are no visible Churches in the world but a congregation meeting in one place to worship God, which I have demonstrated to be most false… so, though a congregation may only be actually seen when it is convened within the four angles of a material house, yet all the congregations on earth make one visible Church, and have some visible and audible acts of external government common to all, as that all pray, praise, fast, mourn, rejoice, one with another; and are to rebuke, exhort, comfort one another and to censure one another, so far as is possible, and of right and by law meet in one council, and so by Christ’s institution are that way visible, that a single congegation is visible which meets in one house, though many be absent de facto, through sickness, callings, imprisonment and some through sinful neglect;</p></blockquote>

</figure><figure class="quote" id="q-37c15bd479" data-kw="">
<blockquote><p>Having showed what ruling elders are, it follows to show Scripture and divine right for them. Our first argument is taken from the governement and policy of the Jewish Church thus: Whatsoever kind of office-bearers the Jewish Church had, not as it was Jewish, but as it was a Church, such ought the Christian Church to have also. But the Jewish Church, not as it was Jewish, but as it was a Church, had elders of the people who assisted in their ecclesiastical government and were members of their ecclesiastical consistories. Therefore such ought the Christian Church to have also. The proposition will no man call in question, for quod competit alicui qua tali competit omni tali. That which agrees to any Church as it is a Church, agrees to every Church. I speak of the Church as it is a political body and setled ecclesiastical republic. Let us see then to the assumption. The Jewish Church, not as it was a Church, but as it was Jewish, had an high priest, typifying our great high Priest Jesus Christ… But as it was a Church, and not as Jewish, it had four sorts of ordinary office-bearers, priests, Levites, doctors, and elders, and we conformably have pastors, deacons, doctors and elders. To their priests and Levites, Cyprian does rightly liken our pastors and deacons, for howsoever sundry things were done by the priests and Levites, which were typical and Jewish only, yet may we well parallel our pastors with their priests, in respect of a perpetual ecclesiastical office common to both, viz. the teaching and governing of the people of God, Mal. 2:7; 2 Chron. 19:8, and our deacons with their Levites, in respect of the care of ecclesiastical goods and of the work of the service of the house of God in the materials and appurtenances thereof, a function likewise common to both, 1 Chron. 26:20 &amp; 23:24-28. The Jewish Church had also doctors and schools, or colleges for the preservation of true divinity among them, and of tongues, arts and sciences, necessary thereto, 1 Chron. 15:22-27; 2 Kings 22:14; 1 Sam. 19:20; 2 Kings 2:3-5; Acts 19:9. These office-bearers they had for no typical use, but we have them for the same use and end for which they had them. And all these sorts of office-bearers among us we do as rightly warrant from the like sorts among them as other whiles we warrant our baptizing of infants from their circumcising of them, our churches by their synagogues, etc. Now that the Jewish Church had also such elders as we plead for, it is manifest: for besides the elders of the priests, there were also elders of the people joined with them in the hearing and handling of ecclesiastical matters, Jer. 19:1, ‘Take of the ancients of the people and of the ancients of the priests.’ The Lord sending a message by the prophet would have a representative body of all Judah to be gathered together for receiving it, as Tremellius notes. So 2 Kings 6:32. Elisha sat in his house and the elders sat with him. We read, 2 Chron. 19:8, that with the priests were joined some of the chief of the fathers of Israel to judge ecclesiastical causes and controversies. And howsoever many things among the Jews in the latter times, after the captivity, did wear to confusion and misorder, yet we find even in the days of Christ and the apostles, that the elders of the people still sat and voiced in council with the priests, according to the ancient form, as is clear from sundry places of the New Testament, Mt. 16:21 and 21:23 and 26:57-59 and 27:1-12; Mk. 14:43; Lk. 22:66; Acts 4:5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Assertion of the Government of the Church of Scotland in the Points of Ruling-Elders</cite>, ... (Edinburgh: Bryson, 1641), ch. 3, pp. 17-20</span></figcaption>

</figure><figure class="quote" id="q-02839b324d" data-kw="">
<blockquote><p>It is to be carefully observed, that Paul, though an apostle, does not himself, as an individual, excommunicate according to his own pleasure [in 1 Cor. 5], but consults with the Church, that the matter may be transacted by common authority. He, it is true, takes the lead, and shows the way, but, in taking others as his associates, he intimates with sufficient plainness, that this authority does not belong to any one individual. As, however, a multitude never accomplishes anything with moderation or seriousness, if not governed by counsel, there was appointed in the ancient Church a presbytery, that is, an assembly of elders, who, by the consent of all, had the power of first judging in the case. From them the matter was brought before the people, but it was as a thing already judged of. Whatever the matter may be, it is quite contrary to the appointment of Christ and his apostles — to the order of the Church, and even to equity itself, that this right should be put into the hands of any one man, of excommunicating at his pleasure any that he may choose. Let us take notice, then, that in excommunicating this limitation be observed — that this part of discipline be exercised by the common counsel of the elders, and with the consent of the people, and that this is a remedy in opposition to tyranny. For nothing is more at variance with the discipline of Christ than tyranny, for which you open a wide door, if you give one man the entire power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, 5, v. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is to be carefully observed, that Paul, though an apostle, does not himself, as an individual, excommunicate according to his own pleasure [in 1 Cor. 5], but consults with the Church, that the matter may be transacted by common authority. He, it is true, takes the lead, and shows the way, but, in taking others as his associates, he intimates with sufficient plainness, that this authority does not belong to any one individual. As, however, a multitude never accomplishes anything with moderation or seriousness, if not governed by counsel, there was appointed in the ancient Church a presbytery, that is, an assembly of elders, who, by the consent of all, had the power of first judging in the case. From them the matter was brought before the people, but it was as a thing already judged of. Whatever the matter may be, it is quite contrary to the appointment of Christ and his apostles — to the order of the Church, and even to equity itself, that this right should be put into the hands of any one man, of excommunicating at his pleasure any that he may choose. Let us take notice, then, that in excommunicating this limitation be observed — that this part of discipline be exercised by the common counsel of the elders, and with the consent of the people, and that this is a remedy in opposition to tyranny. For nothing is more at variance with the discipline of Christ than tyranny, for which you open a wide door, if you give one man the entire power.”

— John Calvin, Commentary on 1 Cor. 5, v. 4">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+to+be+carefully+observed%2C+that+Paul%2C+though+an+apostle%2C+does+not+himself%2C+as+an+individual%2C+excommunicate+according+to+his+own+pleasure+%5Bin+1+Cor.+5%5D%2C+but+consults+with+the+Church%2C+that+the+matter+may+be+transacted+by+common+authority.+He%2C+it+is+true%2C+takes+the+lead%2C+and+shows+the+way%2C+but%2C+in+taking+others+as+his+associates%2C+he+intimates+with+sufficient+plainness%2C+that+this+authority+does+not+belong+to+any+one+individual.+As%2C+however%2C+a+multitude+never+accomplishes+anything+with+moderation+or+seriousness%2C+if+not+governed+by+counsel%2C+there+was+appointed+in+the+ancient+Church+a+presbytery%2C+that+is%2C+an+assembly+of+elders%2C+who%2C+by+the+consent+of+all%2C+had+the+power+of+first+judging+in+the+case.+From+them+the+matter+was+brought+before+the+people%2C+but+it+was+as+a+thing+already+judged+of.+Whatever+the+matter+may+be%2C+it+is+quite+contrary+to+the+appointment+of+Christ+and+his+apostles+%E2%80%94+to+the+order+of+the+Church%2C+and+even+to+equity+itself%2C+that+this+right+should+be+put+into+the+hands+of+any+one+man%2C+of+excommunicating+at+his+pleasure+any+that+he+may+choose.+Let+us+take+notice%2C+then%2C+that+in+excommunicating+this+limitation+be+observed+%E2%80%94+that+this+part+of+discipline+be+exercised+by+the+common+counsel+of+the+elders%2C+and+with+the+consent+of+the+people%2C+and+that+this+is+a+remedy+in+opposition+to+tyranny.+For+nothing+is+more+at+variance+with+the+discipline+of+Christ+than+tyranny%2C+for+which+you+open+a+wide+door%2C+if+you+give+one+man+the+entire+power.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+1+Cor.+5%2C+v.+4&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F02839b324d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/02839b324d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/ruling-elders#:~:text=It%20is%20to%20be%20carefully%20observed,give%20one%20man%20the%20entire%20power&amp;text=It%20is%20to%20be%20carefully%20observed%2C%20that%20Paul&amp;text=if%20you%20give%20one%20man%20the%20entire%20power" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

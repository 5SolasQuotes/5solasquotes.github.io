<main class="wrap"><figure class="quote" id="q-b9cc3fe6ec" data-kw="">
<blockquote><p>New School ministers, while often perceived as enemies of confessional subscription, were in fact strong advocates of the principles of 1729. The leaders of the New School asserted that throughout the nineteenth century, the majority of New School members had maintained a solid attachment to the Presbyterian creed. They allowed more theological diversity than their Old School counterparts, but there were confessional boundaries to that latitude which they openly acknowledged. New School Presbyterians were moderate Calvinists who loved the Reformed Tradition but were unwilling to allow the West minster Standards to become the only test of one’s orthodoxy. While viewing itself as generally conservative, the New School also promoted an openness to express traditional Reformed theology in fresh ways.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History</cite>, (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43, p. 239</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

<blockquote><p>2… He testifies that the church is ‘built upon the foundation of the prophets and apostles’ [Eph. 2:20]. If the teaching of the prophets and apostles is the foundation, this must have had authority before the church began to exist… For if the Christian church was from the beginning founded upon the writings of the prophets and the preaching of the apostles, wherever this doctrine is found, the acceptance of it–without which the church itself would never have existed–must certainly have preceded the church.</p></blockquote>

</figure><figure class="quote" id="q-4e512906fb" data-kw="">
<blockquote><p>Finally all the doctrine of Christ is so defiled with the learning of logicians, sophisters, astronomers, orators, poets, philosophers, laweyrs and gentiles that a man shall spend the most part of his life ere he may have any leisure to search holy Scripture, to the which when a man at last comes, he must come infected with so many worldly opinions that either he must be offended with Christ’s doctrines, or else he must apply them to the mind and doctrine of them that he has learned before. And this thing is so much approved, that it is now a heinous deed if a man presume to study holy Scripture, which has not nosilled himself up to the hard ears in those trifles, or rather sophistries of Aristotle. As though Christ’s doctrine were such that it were not lawful for all men to know it, or else that it could by any means agree with the wisdom of philosophers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/desiderius-erasmus.html">Desiderius Erasmus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bellum Erasmi</cite>, (London: 1534), p. 25</span></figcaption>

</figure><figure class="quote" id="q-0aa27d7a28" data-kw="">
<blockquote><p>3… these forms of sound words are useful, and in some cases are necessary, and so have been used as declarations, not only of what we ourselves believe, but also, of what we judge that all should believe (unless we could think that others might rightly believe that as true, which we in our conscience judge to be false, a goodly piece of our ingenuous, loving-hearted Arminians’ charity) and also desire and require, that all should profess, or at least not openly contradict, with whom we join in nearest Church communion: So it was with the apostles in their canons, Acts 15. And so it is with particular Churches in their articles and confessions to this day; and so may it be always; Ringantur licet et rumpantur Socino-Remonstrantes [Let the Socinians and Remonstrants rage and burst, if they please]. Notwithstanding all the rage and invectives of Socinians, Arminians, Libertines and other sectaries, who will rather disturb, yea and ruin both Churches and States, and snap asunder the sacred bond of peace, than be thus hampered. 4. They [creeds and synopses of theology] are therefore in the 4th place Communionis Tessarae et Judices, not only badges of our Christian Church communion, but also great helps and furtherers of it, whereby uncomfortable divisions may be prevented, and the peace of the Church the better preserved, whilst we all profess the same truth and speak the same thing, being perfectly joined together in the same mind, and the same judgment, 1 Cor. 1:10. The Remonstrants indeed tell us that there are Non pauci pii, et probi, many honest godly men (they mean their own sweet selves and their dear party, for who [are] so honest and godly as they?) who dislike such forms and confessions…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-tuckney.html">Anthony Tuckney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Form of Sound Words’ a sermon on 2 Tim. 1:13 in A Good Day well improved, or Five Sermons upon Acts 9:31</cite>, … to which is annexed a sermon on 2 Tim. 1:13… (London: 1656), pp. 252-54</span></figcaption>

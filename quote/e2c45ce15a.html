<main class="wrap"><figure class="quote" id="q-e2c45ce15a" data-kw="">
<blockquote><p>Touching the catechesis of children in the Jewish church, the Old Testament abounds in many explicit commands. In the 12th and 13th chapters of Exodus, God commands the Jews to give particular instruction to their children and families in relation to the institution and benefits of the Passover. In the fourth chapter of the book of Deuteronomy he enjoins it upon parents to repeat to their children the entire history of the law which he had given them. In the sixth chapter of the same book, he requires that the doctrine of the unity of God, and of perfect love to him should be inculcated and impressed upon the minds of their children; and in the eleventh he commands them to explain the Decalogue to their children. Hence, under the Old Testament dispensation, children were taught in the family by their parents, and in the schools by the teachers of religion, the principal things contained in the prophets, viz.: such as respects God, the law, the promise of the gospel, the use of the sacraments, and sacrifices, which were types of the Messiah that was to come, and of the benefits which he was to purchase; for there can be no doubt but that the schools of the prophets Elijah, Elisha, etc., were established for this very purpose. It was also with this design that God delivered his law in the short and condensed form in which it is. “You shalt love the Lord your God with all your heart,” etc., “and your neighbor as yourself.” So also as it respects the gospel; it was briefly comprehended in the promises, “The seed of the woman shall bruise the serpent’s head;” “And in your seed shall all the nations be blessed.” They had, likewise, sacrifices, prayers, and other things which God required Abraham and his posterity to teach their children and families. Hence it is that this doctrine is presented in such a plain and simple form as to meet the capacity of children and such as are unlearned. In the New Testament we are told that Christ laid his hands upon little children and blessed them, and commanded that they should be brought unto him. Hence he says, in Mark 10:14, “Allow the little children to come to me and do not forbid them for of such is the kingdom of God.” That the catechesis of children was diligently attended to in the times of the apostles is evident from the example of Timothy, of whom it is said that he knew the holy Scriptures from a little child; and from what is said in the epistle to the Hebrews, where mention is made of some of the principal heads included in the catechism of the apostles, such as repentance from dead works, and of faith towards God, of the doctrine of baptism, and of laying on of hands, and of resurrection from the dead, and of eternal judgment, which the apostle terms milk for babes. These and similar points of doctrine were required from the Catechumens of adult age at the time of their baptism, and of children at the time of their confirmation by the laying on of hands. Hence, the apostle calls them the doctrine of baptism and laying on of hands. So likewise the Fathers wrote short summaries of doctrine, some fragments of which may still be seen in the Papal church. Eusebius writes of Origen, that he restored the custom of catechesis in Alexandria, which had been suffered to grow out of use during the times of persecution. Socrates writes thus in relation to the system of catechesis in the primitive church: “Our form of catechesis,” he says, “is in accordance with the mode which we have received from the Bishops who have preceded us, and according as we were taught when we laid the foundation of faith and were baptized, and according as we have learned from the Scriptures,” etc. Pope Gregory caused images and idols to be placed in the churches, that they might serve as books for the laity and children. After this period the doctrine of the church, through the negligence of the bishops and the subtlety of the Roman priests, became gradually more and more corrupt, and the custom of catechesis grew more and more into disuse, until at length it was changed into the ridiculous ceremony which to this day they call confirmation. So much concerning the origin and practice of catechesis in the church.</p></blockquote>

<blockquote><p>‘The Lord is well pleased.’… This passage is interpreted in various ways. Some render it, “The Lord has so willed it;” others, “He is merciful;” but, for my own part, I have translated it, “The Lord is willing,” that is, disposed and inclined to deliver his people, and that for the purpose of magnifying his Law and extolling his righteousness. Thus God assigns the reason why He is ready to aid those who are unworthy, that He wishes to spread his glory in their salvation, that in this manner his righteousness may be illustriously displayed, and that his Law may prevail and flourish. As to the heavy calamities that have come on the Jews, the reason is, that of their own accord they have resolved to be blind, and to bring afflictions on themselves, instead of obeying God; for otherwise the Lord would have wished to enrich and exalt them…. Others render it, “For his righteous one,” and refer it to Christ; but they mistake the meaning of the word צדקו, (tzidko) and unquestionably He speaks of righteousness, and means that the Lord would willingly have displayed the magnificence of his promises: and would have given proofs of his righteousness in preserving his people, if they had not shown themselves to be ungrateful and unworthy. Some think that the Lord here offers an excuse for Himself, because, when the people whom He had adopted were exposed to so many evils, it appeared as if his truth were shaken, and that the prophet intended to meet this calumny, for they were seized and became a prey, not because the Lord delights in their miseries, but because He prefers his righteousness to everything else. For my own part, I explain it simply to mean, “The Lord, for the sake of doing honor to his Law, was inclined to do good to his people, in order that his glory and righteousness might shine forth in it; but his people showed themselves to be unworthy of so great a favor; and, therefore, by their own obduracy they made their wounds incurable.</p></blockquote>

<blockquote><p>3rdly, Some natural good wishes for his welfare are implied in this love [to the rich young ruler]. There is in every wise and good man a hearty desire of the happiness of his fellow-creatures; he loves them all in this sense, even the foolish and the wicked. Human nature that has any goodness in it, is ready to wish well to any person, though he be an utter stranger and unknown, especially if he has some agreeable qualities. There may be an innocent inclination to see all men happy, though we know this shall not be brought to pass; for the Word of God declares that the most part of men walk in the broad way, and shall go down to hell. You know how passionately St. Paul longed for the salvation of all his countrymen the Jews [Rom. 9]. This is called a love of benevolence; and it is evident, by the following particulars, that the Lord expressed this good-will toward the young man in my text.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3rdly, Some natural good wishes for his welfare are implied in this love [to the rich young ruler]. There is in every wise and good man a hearty desire of the happiness of his fellow-creatures; he loves them all in this sense, even the foolish and the wicked. Human nature that has any goodness in it, is ready to wish well to any person, though he be an utter stranger and unknown, especially if he has some agreeable qualities. There may be an innocent inclination to see all men happy, though we know this shall not be brought to pass; for the Word of God declares that the most part of men walk in the broad way, and shall go down to hell. You know how passionately St. Paul longed for the salvation of all his countrymen the Jews [Rom. 9]. This is called a love of benevolence; and it is evident, by the following particulars, that the Lord expressed this good-will toward the young man in my text.”

— Isaac Watts, “Sermon VII: A hopeful Youth falling short of Heaven” in Sermons on Various Subjects (London: A. Macpherson, 1811), vol. 1, p. 160">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3rdly%2C+Some+natural+good+wishes+for+his+welfare+are+implied+in+this+love+%5Bto+the+rich+young+ruler%5D.+There+is+in+every+wise+and+good+man+a+hearty+desire+of+the+happiness+of+his+fellow-creatures%3B+he+loves+them+all+in+this+sense%2C+even+the+foolish+and+the+wicked.+Human+nature+that+has+any+goodness+in+it%2C+is+ready+to+wish+well+to+any+person%2C+though+he+be+an+utter+stranger+and+unknown%2C+especially+if+he+has+some+agreeable+qualities.+There+may+be+an+innocent+inclination+to+see+all+men+happy%2C+though+we+know+this+shall+not+be+brought+to+pass%3B+for+the+Word+of+God+declares+that+the+most+part+of+men+walk+in+the+broad+way%2C+and+shall+go+down+to+hell.+You+know+how+passionately+St.+Paul+longed+for+the+salvation+of+all+his+countrymen+the+Jews+%5BRom.+9%5D.+This+is+called+a+love+of+benevolence%3B+and+it+is+evident%2C+by+the+following+particulars%2C+that+the+Lord+expressed+this+good-will+toward+the+young+man+in+my+text.%E2%80%9D%0A%0A%E2%80%94+Isaac+Watts%2C+%E2%80%9CSermon+VII%3A+A+hopeful+Youth+falling+short+of+Heaven%E2%80%9D+in+Sermons+on+Various+Subjects+%28London%3A+A.+Macpherson%2C+1811%29%2C+vol.+1%2C+p.+160&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fed3d48e38e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ed3d48e38e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=3rdly%2C%20Some%20natural%20good%20wishes%20for,the%20young%20man%20in%20my%20text&amp;text=3rdly%2C%20Some%20natural%20good%20wishes%20for%20his%20welfare&amp;text=good%2Dwill%20toward%20the%20young%20man%20in%20my%20text" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Touching the subject or persons to whom it is appropriate, faith is the proper and peculiar gift of God’s elect, which only [alone] distinguishes them from the rest of the world; for all other graces, be they never so bright, or shining, are common with the reprobate; but faith, with the fruits thereof, is proper to the godly. Whereupon, (Tit. 1:1) it is called, The “faith of God’s elect”: for only they, and of them all and every one, are in their time, by virtue of God’s covenant, brought to believe (John 6:37). “Every one that the Father gives me, comes to me.” Else, in what better case are we now, then when the covenant of works did hold us, seeing it is as impossible of our selves, and by our own strength, to repent, and believe the gospel, (which is the condition of the covenant of grace) as it was to fulfill the law? Wherefore we must understand, that God, to speak properly, does not require the same, as a mutual re-stipulation of our part, as it was in the former covenant, where nothing is imposed which man’s nature could not wield: but here it is rather a declaration of his pleasure, what he would have us do, and whereunto he will enable us: not a condition to endanger the covenant, but an assurance that he will give us strength to keep it. So as the whole covenant properly and in truth rises of his part, and lies upon him: like his other covenant (brought to confirm this) with the sun and moon, and stars, whom (otherwise unable of themselves) he makes to run their course. But howsoever, all come from his only grace and virtue, yet to us that are not stocks and stones, but endued with a reasonable soul, understanding, will, and other faculties, this covenant is wont to be expressed, sometimes by words conditional, sometimes in commanding wise; that the greatness of the peril, and the difficulty of the precept might make us to bestir ourselves, to use with care and conscience the mean that he appoints, for the attaining of that precious gift, and to work together with God, when we are once wrought upon by his Spirit. And herein lies one other main difference between the law and the gospel, or the covenant of works, and this covenant of grace: The law only commands obedience, but gives no power to obey; and therefore is called, “the dead letter,” “written with ink,” and “in tables of stone,” ready indeed to be read and seen, but having no life in it to change the heart, which remains as stony as before. The Gospel not only commands, but gives faith and newness of life; and is therefore said to be written in our hearts, and called The ministration of the Spirit, because it gives the Spirit of Christ, and righteousness through him. The law therefore, pronouncing nothing but judgement and condemnation against us, as that which commands things impossible, by reason of our weakness, terrifies and amazes the conscience: In which respect it is called, “the ministry of death and condemnation.” Contrariwise, the gospel bringing glad tidings of peace and reconciliation, quiets and appeases the conscience (Rom. 5:1) “Being justified by faith, we have peace with God, through Jesus Christ our Lord.” Both parts of this difference are found (Rom. 10:5, 6, 7, 8). For Moses thus describes the righteousness which is of the law, that the man which does these things, shall live thereby. But the righteousness which is of faith, speaks on this wise, “Say not in your heart, ‘who shall ascend into heaven?’ That is to bring Christ from above. Or, ‘Who shall descend into the deep?’ That is, to bring Christ again from the dead. But what says it? The word is near you, even in your mouth and in your heart. This is the Word of Faith which we preach.</p></blockquote>

<blockquote><p>Although the Church existed from the beginning, it was, before the calling of Abraham, for the most part in a state of dispersion. Too little is recorded of it, prior to that event, to give us definite knowledge of its nature and requirements. Our written constitution, so to speak, dates from the father of the faithful. God made a covenant with Abraham. By covenant is meant, a contract between two or more parties, in which there are mutual stipulations and promises. The transaction with Abraham was of this kind. God promised certain blessings to the patriarch, and he promised faith and obedience to God. Not only, therefore, in the Old Testament is this transaction called a covenant, but in the New Testament the same designation is applied to it. And, further than this, the New Testament writers, referring to the transaction with Abraham, not only call it a covenant, but they argue from its nature as such, to show that its original stipulations can be neither annulled nor altered. Rom. 4:13, 14; Gal. 3:15–18. “The covenant,” says the apostle, “that was confirmed before (to Abraham) of God in Christ, the law, which was four hundred and thirty years after, cannot disannul.” It is of importance, therefore, that this word should be retained, not only because it is scriptural, but because the idea which it expresses is essential to a proper understanding of the case. Many modern theological writers discard the word entirely, and stigmatize the system of the Reformers as the federal theology. In discarding the word, the truth which it was intended to convey is almost always discarded with it. If we would retain the truth, we must retain the forms in which God has seen fit to reveal it. God then formed a covenant with Abraham. The question is, What was that covenant, and who were the parties to it? We answer, in common with all Christendom, The covenant was the covenant of grace, and the parties were Abraham and those whom Abraham represented. Of course this does not mean that the covenant of grace originated in this transaction, or that none are included in it but Abraham and those whom Abraham represented. Nor does it mean that all represented by Abraham were savingly interested in its benefits. It only means that the covenant in question was a reënactment or renewed revelation of the covenant of grace in relation to Abraham, and that those represented by him were to be regarded and treated as included in it. By the covenant of grace is meant the plan of salvation, in which God promises to give to believers all the benefits of redemption, and they promise faith and obedience. If, therefore, in the covenant with Abraham, God promised to him the benefits of redemption on the condition of faith, that covenant was the covenant of grace. In other words, it was the gospel; for the gospel is nothing else than the proclamation of salvation through faith in Christ. That such was the nature of the covenant made with Abraham, is too clearly revealed to admit of doubt. When God promised that in his seed all the nations of the earth should be blessed, he promised to send Christ to be the Redeemer of men. It is the fulfilment of this promise and the exposition of it in the New Testament, which authoritatively determines its meaning. Our Lord himself said, “Abraham saw my day and was glad.” This can only mean that Abraham foresaw the advent of Christ, and rejoiced in the accomplishment of the work which Christ came to perform. The apostle therefore says, “God preached before the gospel unto Abraham.” The gospel, in the New Testament sense of the term, is the glad news of salvation through Jesus Christ. This therefore was, according to the apostle, what was preached to Abraham, when it was said, “In thee shall all nations be blessed.” The apostle Peter also, after he had healed the lame man, told the astonished multitude that Christ, in whose name the miracle had been performed, had been promised to Abraham, and predicted by the prophets. “Ye,” he added, “are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed. Unto you first, God having raised up his Son Jesus, sent him to bless you, in turning away every one of you from his iniquities.” Acts 3:25, 26. It is here clearly taught that the Abrahamic covenant, of which the Jews were the children, had reference to Christ; that the promise, “In thy seed shall all the kindreds of the earth be blessed,” was fulfilled in the advent of the Son of God; and that the blessedness promised, was turning men from their iniquities. To the same effect Paul said in the synagogue at Antioch, in Pisidia, “We declare unto you glad tidings, how that the promise made unto the fathers, God hath fulfilled the same unto us their children, in that he hath raised up Jesus.” Acts 13:32, 33. When arraigned before Agrippa he said, “Now I stand and am judged for the hope of the promise made unto our fathers: unto which promise the twelve tribes, instantly serving God day and night, hope to come: for which hope’s sake, king Agrippa, I am accused of the Jews.” Acts 26:6, 7. The great promise made to Abraham and to the other fathers, according to this passage, was the promise of Christ, on whose behalf Paul was a prisoner; and this was the promise toward which the eyes of all who served God were constantly fixed. Paul said to the Romans, “Jesus Christ was a minister of the circumcision, for the truth of God, to confirm the promises made unto the fathers.” Rom. 15:9. That is, Jesus Christ came and exercised his ministry among the Jews, to set forth the truth or veracity of God, in fulfilling the promises made to the fathers. In all these passages, “the promises made to the fathers,” means the promise of Christ thrice made to Abraham, Gen. 12:3, 18:18, 22:18, repeated to Isaac and Jacob, Gen. 26:4, 28:14, and which thenceforth became the burden of prophecy, renewed to every generation, constantly unfolded in its inexhaustible contents until the fulfilment came. Nothing, therefore, can be plainer than that the covenant made with Abraham was the covenant of grace, i.e. the promise of redemption through faith in the Messiah. This, however, is not a doctrine which rests on such general allusions or declarations merely, it is taught in the most explicit terms by the apostles. The design of the epistle to the Galatians was to convince them of the folly of apostatizing to Judaism. To do this the apostle raises them above the Mosaic period, and sets them back into communion with the great Abrahamic covenant, to which the law of Moses was not only posterior but subordinate. The special purpose of the third chapter of that epistle is to prove that justification is by faith, and not by the law. His first argument is from the fact that the Holy Ghost, in his manifold miraculous and sanctifying influences, had been given in confirmation of the doctrine of justification by faith. His second argument is from the case of Abraham. He was justified by faith, and therefore those who share his inheritance, i.e. who inherit the blessing of redemption promised him, are believers. Know therefore, he says, that believers are the sons (i.e. heirs) of Abraham. The third argument is from the impossibility of rendering the perfect obedience which the law demands. The fourth, from the explicit declaration of the Scriptures, that those who are just by faith shall live. The fifth, from the fact that Christ has redeemed us from the curse of the law in order that the blessing of Abraham, (i.e. the blessing promised to Abraham,) might come upon the gentiles. The only blessing, however, promised to Abraham, which comes upon the gentiles, is redemption. And finally, Paul argues from the nature of the covenant made with Abraham. He reminds his readers that even a human covenant cannot, when once ratified, be either annulled or altered, much less can a divine covenant be changed, either in its promises or conditions. In the covenant with Abraham in reference to Christ, the inheritance, (that inheritance in which the gentiles share,) was suspended upon faith in the promise. The law, therefore, which was long subsequent, could not alter this covenant, or make the inheritance to depend upon works. Here everything is taught, first, the Abrahamic covenant had reference to Christ; second, the thing promised was that inheritance of which Christ is the author, and all nations (not the Jews only) the heirs; third, the condition on which a participation in this inheritance is suspended, is faith and not works.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Although the Church existed from the beginning, it was, before the calling of Abraham, for the most part in a state of dispersion. Too little is recorded of it, prior to that event, to give us definite knowledge of its nature and requirements. Our written constitution, so to speak, dates from the father of the faithful. God made a covenant with Abraham. By covenant is meant, a contract between two or more parties, in which there are mutual stipulations and promises. The transaction with Abraham was of this kind. God promised certain blessings to the patriarch, and he promised faith and obedience to God. Not only, therefore, in the Old Testament is this transaction called a covenant, but in the New Testament the same designation is applied to it. And, further than this, the New Testament writers, referring to the transaction with Abraham, not only call it a covenant, but they argue from its nature as such, to show that its original stipulations can be neither annulled nor altered. Rom. 4:13, 14; Gal. 3:15–18. “The covenant,” says the apostle, “that was confirmed before (to Abraham) of God in Christ, the law, which was four hundred and thirty years after, cannot disannul.” It is of importance, therefore, that this word should be retained, not only because it is scriptural, but because the idea which it expresses is essential to a proper understanding of the case. Many modern theological writers discard the word entirely, and stigmatize the system of the Reformers as the federal theology. In discarding the word, the truth which it was intended to convey is almost always discarded with it. If we would retain the truth, we must retain the forms in which God has seen fit to reveal it. God then formed a covenant with Abraham. The question is, What was that covenant, and who were the parties to it? We answer, in common with all Christendom, The covenant was the covenant of grace, and the parties were Abraham and those whom Abraham represented. Of course this does not mean that the covenant of grace originated in this transaction, or that none are included in it but Abraham and those whom Abraham represented. Nor does it mean that all represented by Abraham were savingly interested in its benefits. It only means that the covenant in question was a reënactment or renewed revelation of the covenant of grace in relation to Abraham, and that those represented by him were to be regarded and treated as included in it. By the covenant of grace is meant the plan of salvation, in which God promises to give to believers all the benefits of redemption, and they promise faith and obedience. If, therefore, in the covenant with Abraham, God promised to him the benefits of redemption on the condition of faith, that covenant was the covenant of grace. In other words, it was the gospel; for the gospel is nothing else than the proclamation of salvation through faith in Christ. That such was the nature of the covenant made with Abraham, is too clearly revealed to admit of doubt. When God promised that in his seed all the nations of the earth should be blessed, he promised to send Christ to be the Redeemer of men. It is the fulfilment of this promise and the exposition of it in the New Testament, which authoritatively determines its meaning. Our Lord himself said, “Abraham saw my day and was glad.” This can only mean that Abraham foresaw the advent of Christ, and rejoiced in the accomplishment of the work which Christ came to perform. The apostle therefore says, “God preached before the gospel unto Abraham.” The gospel, in the New Testament sense of the term, is the glad news of salvation through Jesus Christ. This therefore was, according to the apostle, what was preached to Abraham, when it was said, “In thee shall all nations be blessed.” The apostle Peter also, after he had healed the lame man, told the astonished multitude that Christ, in whose name the miracle had been performed, had been promised to Abraham, and predicted by the prophets. “Ye,” he added, “are the children of the prophets, and of the covenant which God made with our fathers, saying unto Abraham, And in thy seed shall all the kindreds of the earth be blessed. Unto you first, God having raised up his Son Jesus, sent him to bless you, in turning away every one of you from his iniquities.” Acts 3:25, 26. It is here clearly taught that the Abrahamic covenant, of which the Jews were the children, had reference to Christ; that the promise, “In thy seed shall all the kindreds of the earth be blessed,” was fulfilled in the advent of the Son of God; and that the blessedness promised, was turning men from their iniquities. To the same effect Paul said in the synagogue at Antioch, in Pisidia, “We declare unto you glad tidings, how that the promise made unto the fathers, God hath fulfilled the same unto us their children, in that he hath raised up Jesus.” Acts 13:32, 33. When arraigned before Agrippa he said, “Now I stand and am judged for the hope of the promise made unto our fathers: unto which promise the twelve tribes, instantly serving God day and night, hope to come: for which hope’s sake, king Agrippa, I am accused of the Jews.” Acts 26:6, 7. The great promise made to Abraham and to the other fathers, according to this passage, was the promise of Christ, on whose behalf Paul was a prisoner; and this was the promise toward which the eyes of all who served God were constantly fixed. Paul said to the Romans, “Jesus Christ was a minister of the circumcision, for the truth of God, to confirm the promises made unto the fathers.” Rom. 15:9. That is, Jesus Christ came and exercised his ministry among the Jews, to set forth the truth or veracity of God, in fulfilling the promises made to the fathers. In all these passages, “the promises made to the fathers,” means the promise of Christ thrice made to Abraham, Gen. 12:3, 18:18, 22:18, repeated to Isaac and Jacob, Gen. 26:4, 28:14, and which thenceforth became the burden of prophecy, renewed to every generation, constantly unfolded in its inexhaustible contents until the fulfilment came. Nothing, therefore, can be plainer than that the covenant made with Abraham was the covenant of grace, i.e. the promise of redemption through faith in the Messiah. This, however, is not a doctrine which rests on such general allusions or declarations merely, it is taught in the most explicit terms by the apostles. The design of the epistle to the Galatians was to convince them of the folly of apostatizing to Judaism. To do this the apostle raises them above the Mosaic period, and sets them back into communion with the great Abrahamic covenant, to which the law of Moses was not only posterior but subordinate. The special purpose of the third chapter of that epistle is to prove that justification is by faith, and not by the law. His first argument is from the fact that the Holy Ghost, in his manifold miraculous and sanctifying influences, had been given in confirmation of the doctrine of justification by faith. His second argument is from the case of Abraham. He was justified by faith, and therefore those who share his inheritance, i.e. who inherit the blessing of redemption promised him, are believers. Know therefore, he says, that believers are the sons (i.e. heirs) of Abraham. The third argument is from the impossibility of rendering the perfect obedience which the law demands. The fourth, from the explicit declaration of the Scriptures, that those who are just by faith shall live. The fifth, from the fact that Christ has redeemed us from the curse of the law in order that the blessing of Abraham, (i.e. the blessing promised to Abraham,) might come upon the gentiles. The only blessing, however, promised to Abraham, which comes upon the gentiles, is redemption. And finally, Paul argues from the nature of the covenant made with Abraham. He reminds his readers that even a human covenant cannot, when once ratified, be either annulled or altered, much less can a divine covenant be changed, either in its promises or conditions. In the covenant with Abraham in reference to Christ, the inheritance, (that inheritance in which the gentiles share,) was suspended upon faith in the promise. The law, therefore, which was long subsequent, could not alter this covenant, or make the inheritance to depend upon works. Here everything is taught, first, the Abrahamic covenant had reference to Christ; second, the thing promised was that inheritance of which Christ is the author, and all nations (not the Jews only) the heirs; third, the condition on which a participation in this inheritance is suspended, is faith and not works.”

— Charles Hodge, “Review of The Tecnobaptist: A Discourse, Wherein an Honest Baptist, by a Course of Argument to Which No Honest Baptist Can Object, Is Convinced That Infant Christians Are Proper Subjects Of Baptism by R. B. Mayes,” in The Book Reviews of Charles Hodge (repr. Bellingham, WA: Logos Bible Software, 20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAlthough+the+Church+existed+from+the+beginning%2C+it+was%2C+before+the+calling+of+Abraham%2C+for+the+most+part+in+a+state+of+dispersion.+Too+little+is+recorded+of+it%2C+prior+to+that+event%2C+to+give+us+definite+knowledge+of+its+nature+and+requirements.+Our+written+constitution%2C+so+to+speak%2C+dates+from+the+father+of+the+faithful.+God+made+a+covenant+with+Abraham.+By+covenant+is+meant%2C+a+contract+between+two+or+more+parties%2C+in+which+there+are+mutual+stipulations+and+promises.+The+transaction+with+Abraham+was+of+this+kind.+God+promised+certain+blessings+to+the+patriarch%2C+and+he+promised+faith+and+obedience+to+God.+Not+only%2C+therefore%2C+in+the+Old+Testament+is+this+transaction+called+a+covenant%2C+but+in+the+New+Testament+the+same+designation+is+applied+to+it.+And%2C+further+than+this%2C+the+New+Testament+writers%2C+referring+to+the+transaction+with+Abraham%2C+not+only+call+it+a+covenant%2C+but+they+argue+from+its+nature+as+such%2C+to+show+that+its+original+stipulations+can+be+neither+annulled+nor+altered.+Rom.+4%3A13%2C+14%3B+Gal.+3%3A15%E2%80%9318.+%E2%80%9CThe+covenant%2C%E2%80%9D+says+the+apostle%2C+%E2%80%9Cthat+was+confirmed+before+%28to+Abraham%29+of+God+in+Christ%2C+the+law%2C+which+was+four+hundred+and+thirty+years+after%2C+cannot+disannul.%E2%80%9D+It+is+of+importance%2C+therefore%2C+that+this+word+should+be+retained%2C+not+only+because+it+is+scriptural%2C+but+because+the+idea+which+it+expresses+is+essential+to+a+proper+understanding+of+the+case.+Many+modern+theological+writers+discard+the+word+entirely%2C+and+stigmatize+the+system+of+the+Reformers+as+the+federal+theology.+In+discarding+the+word%2C+the+truth+which+it+was+intended+to+convey+is+almost+always+discarded+with+it.+If+we+would+retain+the+truth%2C+we+must+retain+the+forms+in+which+God+has+seen+fit+to+reveal+it.+God+then+formed+a+covenant+with+Abraham.+The+question+is%2C+What+was+that+covenant%2C+and+who+were+the+parties+to+it%3F+We+answer%2C+in+common+with+all+Christendom%2C+The+covenant+was+the+covenant+of+grace%2C+and+the+parties+were+Abraham+and+those+whom+Abraham+represented.+Of+course+this+does+not+mean+that+the+covenant+of+grace+originated+in+this+transaction%2C+or+that+none+are+included+in+it+but+Abraham+and+those+whom+Abraham+represented.+Nor+does+it+mean+that+all+represented+by+Abraham+were+savingly+interested+in+its+benefits.+It+only+means+that+the+covenant+in+question+was+a+re%C3%ABnactment+or+renewed+revelation+of+the+covenant+of+grace+in+relation+to+Abraham%2C+and+that+those+represented+by+him+were+to+be+regarded+and+treated+as+included+in+it.+By+the+covenant+of+grace+is+meant+the+plan+of+salvation%2C+in+which+God+promises+to+give+to+believers+all+the+benefits+of+redemption%2C+and+they+promise+faith+and+obedience.+If%2C+therefore%2C+in+the+covenant+with+Abraham%2C+God+promised+to+him+the+benefits+of+redemption+on+the+condition+of+faith%2C+that+covenant+was+the+covenant+of+grace.+In+other+words%2C+it+was+the+gospel%3B+for+the+gospel+is+nothing+else+than+the+proclamation+of+salvation+through+faith+in+Christ.+That+such+was+the+nature+of+the+covenant+made+with+Abraham%2C+is+too+clearly+revealed+to+admit+of+doubt.+When+God+promised+that+in+his+seed+all+the+nations+of+the+earth+should+be+blessed%2C+he+promised+to+send+Christ+to+be+the+Redeemer+of+men.+It+is+the+fulfilment+of+this+promise+and+the+exposition+of+it+in+the+New+Testament%2C+which+authoritatively+determines+its+meaning.+Our+Lord+himself+said%2C+%E2%80%9CAbraham+saw+my+day+and+was+glad.%E2%80%9D+This+can+only+mean+that+Abraham+foresaw+the+advent+of+Christ%2C+and+rejoiced+in+the+accomplishment+of+the+work+which+Christ+came+to+perform.+The+apostle+therefore+says%2C+%E2%80%9CGod+preached+before+the+gospel+unto+Abraham.%E2%80%9D+The+gospel%2C+in+the+New+Testament+sense+of+the+term%2C+is+the+glad+news+of+salvation+through+Jesus+Christ.+This+therefore+was%2C+according+to+the+apostle%2C+what+was+preached+to+Abraham%2C+when+it+was+said%2C+%E2%80%9CIn+thee+shall+all+nations+be+blessed.%E2%80%9D+The+apostle+Peter+also%2C+after+he+had+healed+the+lame+man%2C+told+the+astonished+multitude+that+Christ%2C+in+whose+name+the+miracle+had+been+performed%2C+had+been+promised+to+Abraham%2C+and+predicted+by+the+prophets.+%E2%80%9CYe%2C%E2%80%9D+he+added%2C+%E2%80%9Care+the+children+of+the+prophets%2C+and+of+the+covenant+which+God+made+with+our+fathers%2C+saying+unto+Abraham%2C+And+in+thy+seed+shall+all+the+kindreds+of+the+earth+be+blessed.+Unto+you+first%2C+God+having+raised+up+his+Son+Jesus%2C+sent+him+to+bless+you%2C+in+turning+away+every+one+of+you+from+his+iniquities.%E2%80%9D+Acts+3%3A25%2C+26.+It+is+here+clearly+taught+that+the+Abrahamic+covenant%2C+of+which+the+Jews+were+the+children%2C+had+reference+to+Christ%3B+that+the+promise%2C+%E2%80%9CIn+thy+seed+shall+all+the+kindreds+of+the+earth+be+blessed%2C%E2%80%9D+was+fulfilled+in+the+advent+of+the+Son+of+God%3B+and+that+the+blessedness+promised%2C+was+turning+men+from+their+iniquities.+To+the+same+effect+Paul+said+in+the+synagogue+at+Antioch%2C+in+Pisidia%2C+%E2%80%9CWe+declare+unto+you+glad+tidings%2C+how+that+the+promise+made+unto+the+fathers%2C+God+hath+fulfilled+the+same+unto+us+their+children%2C+in+that+he+hath+raised+up+Jesus.%E2%80%9D+Acts+13%3A32%2C+33.+When+arraigned+before+Agrippa+he+said%2C+%E2%80%9CNow+I+stand+and+am+judged+for+the+hope+of+the+promise+made+unto+our+fathers%3A+unto+which+promise+the+twelve+tribes%2C+instantly+serving+God+day+and+night%2C+hope+to+come%3A+for+which+hope%E2%80%99s+sake%2C+king+Agrippa%2C+I+am+accused+of+the+Jews.%E2%80%9D+Acts+26%3A6%2C+7.+The+great+promise+made+to+Abraham+and+to+the+other+fathers%2C+according+to+this+passage%2C+was+the+promise+of+Christ%2C+on+whose+behalf+Paul+was+a+prisoner%3B+and+this+was+the+promise+toward+which+the+eyes+of+all+who+served+God+were+constantly+fixed.+Paul+said+to+the+Romans%2C+%E2%80%9CJesus+Christ+was+a+minister+of+the+circumcision%2C+for+the+truth+of+God%2C+to+confirm+the+promises+made+unto+the+fathers.%E2%80%9D+Rom.+15%3A9.+That+is%2C+Jesus+Christ+came+and+exercised+his+ministry+among+the+Jews%2C+to+set+forth+the+truth+or+veracity+of+God%2C+in+fulfilling+the+promises+made+to+the+fathers.+In+all+these+passages%2C+%E2%80%9Cthe+promises+made+to+the+fathers%2C%E2%80%9D+means+the+promise+of+Christ+thrice+made+to+Abraham%2C+Gen.+12%3A3%2C+18%3A18%2C+22%3A18%2C+repeated+to+Isaac+and+Jacob%2C+Gen.+26%3A4%2C+28%3A14%2C+and+which+thenceforth+became+the+burden+of+prophecy%2C+renewed+to+every+generation%2C+constantly+unfolded+in+its+inexhaustible+contents+until+the+fulfilment+came.+Nothing%2C+therefore%2C+can+be+plainer+than+that+the+covenant+made+with+Abraham+was+the+covenant+of+grace%2C+i.e.+the+promise+of+redemption+through+faith+in+the+Messiah.+This%2C+however%2C+is+not+a+doctrine+which+rests+on+such+general+allusions+or+declarations+merely%2C+it+is+taught+in+the+most+explicit+terms+by+the+apostles.+The+design+of+the+epistle+to+the+Galatians+was+to+convince+them+of+the+folly+of+apostatizing+to+Judaism.+To+do+this+the+apostle+raises+them+above+the+Mosaic+period%2C+and+sets+them+back+into+communion+with+the+great+Abrahamic+covenant%2C+to+which+the+law+of+Moses+was+not+only+posterior+but+subordinate.+The+special+purpose+of+the+third+chapter+of+that+epistle+is+to+prove+that+justification+is+by+faith%2C+and+not+by+the+law.+His+first+argument+is+from+the+fact+that+the+Holy+Ghost%2C+in+his+manifold+miraculous+and+sanctifying+influences%2C+had+been+given+in+confirmation+of+the+doctrine+of+justification+by+faith.+His+second+argument+is+from+the+case+of+Abraham.+He+was+justified+by+faith%2C+and+therefore+those+who+share+his+inheritance%2C+i.e.+who+inherit+the+blessing+of+redemption+promised+him%2C+are+believers.+Know+therefore%2C+he+says%2C+that+believers+are+the+sons+%28i.e.+heirs%29+of+Abraham.+The+third+argument+is+from+the+impossibility+of+rendering+the+perfect+obedience+which+the+law+demands.+The+fourth%2C+from+the+explicit+declaration+of+the+Scriptures%2C+that+those+who+are+just+by+faith+shall+live.+The+fifth%2C+from+the+fact+that+Christ+has+redeemed+us+from+the+curse+of+the+law+in+order+that+the+blessing+of+Abraham%2C+%28i.e.+the+blessing+promised+to+Abraham%2C%29+might+come+upon+the+gentiles.+The+only+blessing%2C+however%2C+promised+to+Abraham%2C+which+comes+upon+the+gentiles%2C+is+redemption.+And+finally%2C+Paul+argues+from+the+nature+of+the+covenant+made+with+Abraham.+He+reminds+his+readers+that+even+a+human+covenant+cannot%2C+when+once+ratified%2C+be+either+annulled+or+altered%2C+much+less+can+a+divine+covenant+be+changed%2C+either+in+its+promises+or+conditions.+In+the+covenant+with+Abraham+in+reference+to+Christ%2C+the+inheritance%2C+%28that+inheritance+in+which+the+gentiles+share%2C%29+was+suspended+upon+faith+in+the+promise.+The+law%2C+therefore%2C+which+was+long+subsequent%2C+could+not+alter+this+covenant%2C+or+make+the+inheritance+to+depend+upon+works.+Here+everything+is+taught%2C+first%2C+the+Abrahamic+covenant+had+reference+to+Christ%3B+second%2C+the+thing+promised+was+that+inheritance+of+which+Christ+is+the+author%2C+and+all+nations+%28not+the+Jews+only%29+the+heirs%3B+third%2C+the+condition+on+which+a+participation+in+this+inheritance+is+suspended%2C+is+faith+and+not+works.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+%E2%80%9CReview+of+The+Tecnobaptist%3A+A+Discourse%2C+Wherein+an+Honest+Baptist%2C+by+a+Course+of+Argument+to+Which+No+Honest+Baptist+Can+Object%2C+Is+Convinced+That+Infant+Christians+Are+Proper+Subjects+Of+Baptism+by+R.+B.+Mayes%2C%E2%80%9D+in+The+Book+Reviews+of+Charles+Hodge+%28repr.+Bellingham%2C+WA%3A+Logos+Bible+Software%2C+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F62298a5a2e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/62298a5a2e.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/10/hodge-abraham-was-in-a-spiritual-gracious-covenant/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<main class="wrap"><figure class="quote" id="q-5d08c12ed3" data-kw="">
<blockquote><p>God’s sentence of life to those of us who are the objects of justification is executed when he regenerates us through his Holy Spirit—that is, when he creates within us that new life that he has assigned to us already by means of that earlier sentence of justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’ tr. Aaron Denlinger &amp; Noah Phillips MAJT 27 (2016), 1.5. ‘The Execution of God’s Judicial Sentence’, p. 108 Rollock (c. 1555-1599) was a Scottish minister.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da69ec648e" data-kw="">
<blockquote><p>For the Spirit in the work of application sustains a double office, and so a double respect: As a Spirit Assisting, As a Spirit Inhabiting, And yet the same Spirit of Regeneration in such as shall be saved (taking Regeneration in the breadth thereof, including the whole work), though the operation be double or divers, according to the diversity of the subject, as the soul of a sinner, upon which the work of application must be made according to the degrees thereof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hooker.html">Thomas Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Application of Redemption by the Effectual Work of the Word &amp; Spirit of Christ for the bringing home of lost sinners to God (d. 1647; London: Cole, 1656), bk. 10</cite>, p. 675</span></figcaption>

</figure><figure class="quote" id="q-69a6893b9f" data-kw="">
<blockquote><p>XXIII. The mode by which God acts in efficacious vocation having now been explained, it remains for us to see how man conducts himself toward it. Here, there can be a twofold notion of man, as he is considered either in the first act of conversion or in the second act. Considered in the former, he behaves purely passively toward the efficacy of his vocation, contributing nothing as such, only receiving what is impressed upon him from elsewhere. XXIV. In the second act, however, there is some operation of man, and here he also performs his parts, so that he himself acts, believes, and wills rightly; yet in such a way that he perfects all these things in the virtue of the Holy Spirit as the principal mover. He indeed moves himself, but as one who has been moved, and thus he receives all good inclinations from Him, by which he is active (Phil. 2:12-13).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Anthony Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation trans. AI (Leiden: Marcus, 1620)</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span><span class="t"><a href="../topics/regeneration/nature-of-regeneration.html">Nature of Regeneration</a></span></div>

</figure><figure class="quote" id="q-716fae5111" data-kw="">
<blockquote><p>These things cannot occur until we have been justified by faith, and, regenerated, we receive the Holy Ghost: first, because the Law cannot be kept without [the knowledge of] Christ; and likewise the Law cannot be kept without the Holy Ghost. But the Holy Ghost is received by faith, according to the declaration of Paul, Gal. 3:14, ‘That we might receive the promise of the Spirit through faith.’ … Wherefore, when Paul says, Rom. 3:31, ‘We establish the Law through faith,’ by this we ought to understand, not only that those regenerated by faith receive the Holy Ghost, and have movements agreeing with God’s Law, but it is by far of the greatest importance that we add also this, that we ought to perceive that we are far distant from the perfection of the Law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology of the Augsburg Confession Trans. F. Bente &amp; W. H. T. Dau (1531; Project Gutenberg, 2004) | pt. 6, Article 3, Of Love and the Fulfilling of the Law</cite></span></figcaption>

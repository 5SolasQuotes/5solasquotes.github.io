<main class="wrap"><figure class="quote" id="q-274a098af2" data-kw="">
<blockquote><p>Now if the Pope’s Commands are in force, and the Commands of God dispensed with, the Commands of the Pope will soon just out the Commands of God. You know the Pope hath by the Plenitude of his power struck out the second Commandment, and by the same authority he may when he please, strike out the first Commandment, and by consequent all the rest; and then he may make a new Preface, and a new Decalogue, if that number will content him, he may say as the Extravagant saith, that he himself [is the Lord our God,] who desires to bring us into the land of Egypt, the house of bondage (he should do well to put in that) where we shall have no other God but the Pope, for he exalts himself above all that is called God; but we may have as many Images, and Idols as we please, and so take the Name of our God in vain; we must keep all the Saint’s days, and then we shall not be at leisure to keep the Lord’s-day; you know the Pope’s Agents here in England, about four years ago, did not only dispense with the people for observing the Lord’s-day, but enjoin them to prophane it: you know their Doctrine about equivocation, and Fornication; they do too often count Murther meritorious, a Doctrine which doth well become the mouth of that purple whore, who is drunk with the blood of Saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-cheynell.html">Francis Cheynell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sion’s memento, and Gods alarum. In a sermon at Westminster, before the Honourable House of Commons, on the 31. of May 1643. the solemn day of their monthly fast</cite>, (London: Samuel Gellibrand, 1643), p. 15.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

.github.io%2Fquote%2F274a098af2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/274a098af2.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/02/francis-cheynell-on-the-danger-of-popery-to-the-lords-day/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f7522500b5" data-kw="">
<blockquote><p>That King Hezekiah rent his clothes. He likewise adds the outward expressions of repentance, the “rending of the clothes and wearing sackcloth,” sprinkling of ashes, and other things of the same kind; for these were the ordinary signs of repentance, when, under the weight of any calamity by which they were afflicted, they confessed their guilt before God and implored pardon from him.

Wonderful is the modesty of the holy king, who, after having performed so many illustrious works, and after having been adorned by the excellence of so many virtues, does not hesitate to prostrate himself humbly before God; and, on the other hand, wonderful is his courage and the steadfastness of his faith, in not being hindered by the weight of so heavy a temptation from freely seeking God by whom he was so severely smitten.

Scarcely do we find one man in a hundred who does not murmur if God treats him with any degree of severity, who does not bring forward his good deeds as a ground of complaint, and remonstrate that he has been unjustly rewarded. Other men, when God does not comply with their wishes, complain that their worship of God has served no good purpose.

We perceive nothing of this kind in Hezekiah, who, though he is conscious of possessing uncommon piety, does not shrink from a confession of guilt, and therefore if we desire to turn away God’s anger, and to experience his favour in adversity, we must testify our repentance and sincerely acknowledge our guilt; for adversity does not fall out to us by chance, but is the method by which God arouses us to repentance.

True, indeed, sackcloth and ashes will be of little avail, if they be not preceded by the inward feelings of the heart; for we know that hypocrites are abundantly liberal in the use of ceremonies; but as we have formerly said, the Holy Spirit justly commends those exercises, when they are directed to their proper object. And indeed it was a proof of uncommon piety and modesty, that the pious king and the whole nation excited themselves in this manner to fear God, and that he made a voluntary acknowledgement of guilt in a form attended by wretched filthiness; for we know how unwilling kings are to let themselves down from their rank.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Third</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 8: 106-07.</span></figcaption>

</figure><figure class="quote" id="q-cb89063a1f" data-kw="">
<blockquote><p>§37. It seems to me that mystical signs stated by man in God’s public worship, directly to work grace on his soul from God, and that as instituted, and also to oblige man to God again, are unlawfully brought into the Church.</p></blockquote>

<blockquote><p>The Samaritans could show no Scriptural authority, no revelation of God, commanding and sanctioning their worship. Whatever it was, it was purely an invention of man, which God had never formally authorized or accredited. They had no warrant for believing that it was accepted. They had no right to feel sure that their prayers, praises, and offerings were received. … In contrast to the Samaritan religious system, our Lord declares that the Jews at any rate could show divine warrant and scriptural authority for all they did in their religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels: John, Volume One</cite>, (1869; Edinburgh: Banner of Truth, 1987), p. 223.</span></figcaption>

</figure><figure class="quote" id="q-4c7c1a7844" data-kw="">
<blockquote><p>[O]ur Lord Jesus Christ was a true man, and that his disciples had all possible evidence of it, which the history more abundantly shews. He conversed with them familiarly, he eat and drank with them, yea, his conversation in the world was very much condescending, in outward behaviour, to the customs of the world. He eat with Pharisees; when they invited him, he refused not; but he was more bold with publicans and sinners, to converse with them, as being their greatest friend. He was uncivil to none; would deter none through a rigid austere conversation.

And, indeed, to testify the truth of his human nature, he came so low to partake of all human infirmities without sin, and to be subject to extraordinary afflictions and crosses, as to the eyes of the world it did quite extinguish his divine glory, and bury it in misbelief. This which we speak of, as a testimony and evidence that he was man, was the very grand stumbling-block and offence of the Jews and Gentiles; which they made use of as an evidence and certain testimony that he was not God. The evidence of the one seems to give an evidence to the other.

But let us consider this, for it is a sweet and pleasant subject, if our hearts were suitably framed to delight in it, that there was as much evidence to the conviction of all men’s senses, of his divine majesty, as of his human infirmity; and that there are two concurring evidences, which enlighten one another; which we shall shew, partly from his own works and miracles, and partly from the more than miraculous success and progress of the gospel after him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fellowship with God, or Twenty-Eight Sermons on the First and Second Chapters of the First Epistle of John</cite>, (1671) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 200-01.</span></figcaption>

And, indeed, to testify the truth of his human nature, he came so low to partake of all human infirmities without sin, and to be subject to extraordinary afflictions and crosses, as to the eyes of the world it did quite extinguish his divine glory, and bury it in misbelief. This which we speak of, as a testimony and evidence that he was man, was the very grand stumbling-block and offence of the Jews and Gentiles; which they made use of as an evidence and certain testimony that he was not God. The evidence of the one seems to give an evidence to the other.

But let us consider this, for it is a sweet and pleasant subject, if our hearts were suitably framed to delight in it, that there was as much evidence to the conviction of all men’s senses, of his divine majesty, as of his human infirmity; and that there are two concurring evidences, which enlighten one another; which we shall shew, partly from his own works and miracles, and partly from the more than miraculous success and progress of the gospel after him.”

— Hugh Binning, Fellowship with God, or Twenty-Eight Sermons on the First and Second Chapters of the First Epistle of John, (1671) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 200-01.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%5BO%5Dur+Lord+Jesus+Christ+was+a+true+man%2C+and+that+his+disciples+had+all+possible+evidence+of+it%2C+which+the+history+more+abundantly+shews.+He+conversed+with+them+familiarly%2C+he+eat+and+drank+with+them%2C+yea%2C+his+conversation+in+the+world+was+very+much+condescending%2C+in+outward+behaviour%2C+to+the+customs+of+the+world.+He+eat+with+Pharisees%3B+when+they+invited+him%2C+he+refused+not%3B+but+he+was+more+bold+with+publicans+and+sinners%2C+to+converse+with+them%2C+as+being+their+greatest+friend.+He+was+uncivil+to+none%3B+would+deter+none+through+a+rigid+austere+conversation.%0A%0AAnd%2C+indeed%2C+to+testify+the+truth+of+his+human+nature%2C+he+came+so+low+to+partake+of+all+human+infirmities+without+sin%2C+and+to+be+subject+to+extraordinary+afflictions+and+crosses%2C+as+to+the+eyes+of+the+world+it+did+quite+extinguish+his+divine+glory%2C+and+bury+it+in+misbelief.+This+which+we+speak+of%2C+as+a+testimony+and+evidence+that+he+was+man%2C+was+the+very+grand+stumbling-block+and+offence+of+the+Jews+and+Gentiles%3B+which+they+made+use+of+as+an+evidence+and+certain+testimony+that+he+was+not+God.+The+evidence+of+the+one+seems+to+give+an+evidence+to+the+other.%0A%0ABut+let+us+consider+this%2C+for+it+is+a+sweet+and+pleasant+subject%2C+if+our+hearts+were+suitably+framed+to+delight+in+it%2C+that+there+was+as+much+evidence+to+the+conviction+of+all+men%E2%80%99s+senses%2C+of+his+divine+majesty%2C+as+of+his+human+infirmity%3B+and+that+there+are+two+concurring+evidences%2C+which+enlighten+one+another%3B+which+we+shall+shew%2C+partly+from+his+own+works+and+miracles%2C+and+partly+from+the+more+than+miraculous+success+and+progress+of+the+gospel+after+him.%E2%80%9D%0A%0A%E2%80%94+Hugh+Binning%2C+Fellowship+with+God%2C+or+Twenty-Eight+Sermons+on+the+First+and+Second+Chapters+of+the+First+Epistle+of+John%2C+%281671%29+in+The+Works+of+Hugh+Binning%2C+ed.+James+Cochrane+%283+vols%2C+Edinburgh%3A+William+Whyte%2C+1839%29%2C+2%3A+200-01.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4c7c1a7844.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4c7c1a7844.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/08/25/hugh-binning-on-the-humanity-of-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>…administration of the Lord’s Supper is a more important and necessary duty than exclusion [from it], etc. or any other part of the exercise of discipline; for it is more properly and immediately the worship of God than the exercise of discipline, as may be seen in the place before quoted out of Ames, bk. 2, [Marrow of] Theology, ch. 13, n. 17-18. God is more worshipped by the administration of the sacraments than by Church censures; the sacraments are a principal worship of God; Church censures and the exercise of discipline less principal. Now it is improbable that a less principal worship of God should be a necessary antecedent to a principal worship. There is says Rada: duplex ordo naturae; alius ordo essentialis dependendentiae; alius est ordo essentialis eminentiae et perfectionis; qualis est inter excedens, &amp; excessum. Now exclusion (and we may say the like of all other acts of discipline) is not before the Lord’s Supper in regard of the order, either of essential dependency, or of essential eminency and perfection. The Lord’s Supper has not an essential dependency upon exclusion, or any other acts of discipline: and it is in ratione cultus of more essential eminency and perfection; as being more immediatly and properly the worship of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government… (London, 1650), p. 31 Jeanes was an English presbyterian.</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (1683; London: Parkhurst, 1689), ch. 58, ‘Whether Communion with so Faulty a Church be Lawful’, pp. 226-27</span></figcaption>

</figure><figure class="quote" id="q-1de66e8c9a" data-kw="">
<blockquote><p>If all the people may lawfully join themselves with that Church which has the ablest teacher, then almost all the world must go to a few men and leave the rest. Then Barnabas may be forsaken, if Paul be the chief speaker… And God has more means than ministerial abilities to increase men’s graces: He that keeps in God’s order under a meaner [less excellent], honest minister, is like to be a more humble, thriving Christian than he that will break that order under pretense of edification. The Lord knows that I speak against my own visible carnal interests in all this… 10. Christians should not first ask, ‘Where may I have the best minister, or company, or purest Ordinances? or where may I receive most good?’ But they must first ask, ‘Where lies my duty? and where may I do most good?’ For God’s work must be done before our own. And the saving of souls and propagation of the Gospel must be preferred before our comforts. Yea let me tell you my observation: The comfort that Christians have in a suffering, self-denying course of doing good is a surer and more stable comfort than that which is drawn from the special advantages of ordinances. That man that lives among a company of poor ignorant souls, and will set himself night and day resolvedly and unweariedly to teach them, persuade them and win them to Christ, till he have bettered the imperfect church where he is, shall usually be a man of solid settled peace. When he that says, ‘These are carnal, heathens, wicked; This is a weak ministry; I will go join myself to such an excellent minister and Church, and let them alone,’ this man will likely be soon sadded with his new comforts, and weary of his precious ordinances, and be as ready to vilify them and turn to some other till in this disorder he have run himself out of breath, if not out of all appearance of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653), ‘Objections Answered’</span></figcaption>

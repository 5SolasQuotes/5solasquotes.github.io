<main class="wrap"><figure class="quote" id="q-b971b9c2fa" data-kw="">
<blockquote><p>In reality, this reconciliation will prove a total defection from the protestant religion; for the church of Rome neither will nor can part with any thing that shall change its antichristian state and idolatrous worship. The whole of their pretension is but a decoy to get us into their power; where we shall be made to understand both where we are and where we have been also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief and Impartial Account of the Nature of the Protestant Religion</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf384d238d" data-kw="">
<blockquote><p>There, instead of the ministry of the word, prevails a perverted government, compounded of lies, a government which partly extinguishes, partly suppresses, the pure light. In place of the Lord&#x27;s Supper, the foulest sacrilege has entered, the worship of God is deformed by a varied mass of intolerable superstitions; doctrine (without which Christianity exists not) is wholly buried and exploded, the public assemblies are schools of idolatry and impiety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.2</span></figcaption>

</figure><figure class="quote" id="q-373000dea1" data-kw="">
<blockquote><p>Hence, then, it is obvious that we do not at all deny that churches remain under his tyranny; churches, however, which by sacrilegious impiety he has profaned, by cruel domination has oppressed, by evil and deadly doctrines like poisoned potions has corrupted and almost slain; churches where Christ lies half-buried, the gospel is suppressed, piety is put to flight, and the worship of God almost abolished; where, in short, all things are in such disorder as to present the appearance of Babylon rather than the holy city of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.12</span></figcaption>

</figure><figure class="quote" id="q-7fe5a20427" data-kw="Church can err">
<blockquote><p>The purest churches under heaven are subject to mixture and error; and some have so degenerated as to become no churches of Christ, but synagogues of Satan; nevertheless Christ always has had, and ever shall have a kingdom in this world, to the end thereof, of such as believe in him, and make profession of his name.</p></blockquote>

</figure><figure class="quote" id="q-84de3e55fc" data-kw="">
<blockquote><p>For this I affirm (and would that I could not, for such just causes, affirm it): that white does not more oppose black than Papism opposes Christianity; which I have now resolved to prove in a few words. Nor do I here dispute about their crimes and most abandoned morals, but I aim at the very throat of the cause, namely their doctrine, than which I affirm that nothing more impure or corrupt can even be feigned.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-96b8ef64dd" data-kw="">
<blockquote><p>Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense:

1. Because Christ assumed the nature which is common; it is not conceded that it was common to all, but it was the nature of Abraham, the father of the believing (Heb. 2:16). Hence, the devils are not at all made salvable by Christ, of course, as the angelic nature has not itself been united to his person.

2. Because Christ has expiated the common sin of Adam on the tree of the cross, though it is not conceded that it was as common, but as it was in the elect and the believing.

3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the Reprobate are made Reconcilable by the Death of Christ?’</cite>, [Distinguish] in Rutherford’s Examination of Arminianism: The Tables of Contents with Excerpts from Every Chapter, trans. T. Fentiman &amp; C. Johnson (RBO, 2019), pp. 90-92</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-95fd72c726" data-kw="">
<blockquote><p>It is not able to be said that Christ does not in any way pertain to reprobates. Christ pertains to them even (1) by right [jure] in the offer of the Gospel, (2) by the sufficiency of the death of Christ, (3) by the right of sharing in a common nature, (4) by right of the common, first transgression being expiated by Christ, (5) by right of the New Covenant being preached to the reprobate out of the grace of Christ, (6) by right of the charge of God inciting so that reprobates receive Christ.</p></blockquote>

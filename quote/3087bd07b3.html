<main class="wrap"><figure class="quote" id="q-3087bd07b3" data-kw="">
<blockquote><p>The Reformation was united in seeking the essence of the church in the invisible, in union with Christ, and not in an external, visible bond, as Rome does… In order to check this danger [of losing the historical progress of the Church through individualism] Luther moved a long way back to Rome. In a certain sense he again imprisoned the supernatural, invisible grace which maintained the church within something external… Where the church is found with the ministry of the Word and sacraments, it is self-sustaining. God, as it were, has let go of the grace which sustains the church and placed it in the means of grace. The Reformed believer cannot be satisfied with this presentation. Certainly he believes in the continuity of the church, but he believes in it and therefore does not need to support it by instruments of salvation, into which grace is poured. For him that continuity is assured by the faithful promise of God. Hence, in back of Word and sacrament he places the covenant as the strongest expression of how the unbroken work of grace from generation to generation rests, as all grace, on the sovereign pleasure of God. The church does not abide because we baptize or work regeneration by baptism; rather because God establishes his covenant from generation to generation, therefore the church remains and we baptize. Since it is God’s covenant an not man’s, it is appropriate for the Christian to recognize this goodness of God in quiet gratitude and in faith and to be strengthened by its sealing. Here again the concept of the covenant requires that faith will react freely and actively to this pronouncement of God… It is evident how strongly the idea of the covenant makes itself felt here, and how it elevates itself above all idolatrous worship of the sacraments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’, pp. 261-2 in Redemptive History and Biblical Interpretation: The Shorter Writings of Geerhardus Vos ed. Gaffin (P&amp;R, 1980)</cite></span></figcaption>

<blockquote><p>[Objection:] Sixthly, if it be the will of God that the death of Christ should be available for the immediate reconciliation of some of the elect, without any condition performed by them, then it was his will that it should be for all of them. But it is the will of God that it should be available for the immediate reconciliation of some of the elect, viz. infants, or else they cannot be reconciled. I answer: Mr. [William] Eyre is hardly put to it, that he must run to the Philistines to sharpen his goad; this argument is taken from [Francis] Suarez [a Romanist], who argues against faith in general upon this ground, because infants are justified without it. Now this argument proves, if it proves anything at all, that we are justified without it, and not before it, and so believers are not the sole subjects of justification, as Mr. Eyre elsewhere affirms; but the case of infants is not to be urged in most questions, especially when we are speaking of what God requires in those that are adulti, ‘of age’ unto salvation; but I deny his minor and affirm that infants are not united to Christ without faith; they are saved by faith as well as we. Thus [Jerome] Zanchi (tome 5, Commentary on Hosea, p. 28): Ut uniamur huic capiti Christo, Spiritus propriae fidei per sese omnibus ipsis etiam parvulis pernecessarius est; justus enim ex sola fide sua vivet, non aliena: assensus autem propriae voluntatis omnibus adultis est necessarius, etc.’ ‘ac proinde etiam parvuli quodammodo sibi ponunt hoc caput, cum Spiritu fidei interno in hoc caput donantur:’ ‘That we may be united to Christ, the spirit of a man’s own faith by itself is necessary to all, yea to infants also; for the just shall live by his own faith, not by another man’s; but the assent of our own proper will is necessary to all that are of age.’ And a little after he says: ‘and therefore also infants do in a manner appoint themselves this head, when they are given unto this head by the internal Spirit of faith.’ So also learned [Andrew] Rivet (ad vers. Babyl Jesui. Tom., [section ?] 297, p. 254.): Agnoscimus Deum in infantibus supplere quod deest propter aetatis imbecillitatem interna Spiritus sui operatione, qui fidei semen in ipsis ingenerat, et vi sua eis applicat meritum Christi, cujus suo tempore in eis sensum est excitaturus: ‘We acknowledge that God supplies in infants what is wanting through the weakness of their age by the internal work of his Spirit, who engenders a seed of faith, and by his power applies the merits of Christ to them, whereof He will raise up a sense in his time;’ Therefore I acknowledge there is at least wrought in them semen fidei, ‘a seed of faith’, by which they become members of Christ, and that relation which is in their faith to Christ’s merits is the instrument by which they obtain remission of sins, and without which they could not be saved. Nor may this seem strange, seeing we grant that in men grown up they are merely passive in the first work of grace, their understandings and wills no ways concurring antecedently to this work; and seeing it is a work wrought in us without us, why may not children be capable of this? Besides, if Adam had stood, even infants before the use of reason had been sanctified, and Christ was so from the womb, and John Baptist, and infants received the seal of the righteousness of faith; and are they capable of the seal of the righteousness of faith, and not of faith? And therefore though they have not the use of knowledge, this hinders not a seed and work of faith; they have not actual reason, yet they have reasonable souls; and when it is said that faith comes by hearing [Rom. 10], it is to be applied to persons that are of age, to whom the ordinary means to beget faith is hearing of the Word preached.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-warren.html">Thomas Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unbelievers No Subjects of Justification… (London: Browne, 1654)</cite>, pp. 247-49</span></figcaption>

<blockquote><p>The sealing of God’s promises has respect either unto the faith of the Covenant [objectively], or unto the faith of them that are in the Covenant [subjectively]. In infants, the sealing of God’s promise is made properly, in respect of the faith of the Covenant, but in them that are of ripe years, in respect of their faith in the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Common Places…, Distinction 4, in ‘Defense of the End of a Sacrament’</cite>, p. 330</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

— Lucas Trelcatius, Common Places…, Distinction 4, in ‘Defense of the End of a Sacrament’, p. 330">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+sealing+of+God%E2%80%99s+promises+has+respect+either+unto+the+faith+of+the+Covenant+%5Bobjectively%5D%2C+or+unto+the+faith+of+them+that+are+in+the+Covenant+%5Bsubjectively%5D.+In+infants%2C+the+sealing+of+God%E2%80%99s+promise+is+made+properly%2C+in+respect+of+the+faith+of+the+Covenant%2C+but+in+them+that+are+of+ripe+years%2C+in+respect+of+their+faith+in+the+Covenant.%E2%80%9D%0A%0A%E2%80%94+Lucas+Trelcatius%2C+Common+Places%E2%80%A6%2C+Distinction+4%2C+in+%E2%80%98Defense+of+the+End+of+a+Sacrament%E2%80%99%2C+p.+330&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe9930b92b7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e9930b92b7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/infant-baptism/#:~:text=The%20sealing%20of%20God%E2%80%99s%20promises%20has,of%20their%20faith%20in%20the%20Covenant&amp;text=The%20sealing%20of%20God%E2%80%99s%20promises%20has%20respect%20either&amp;text=in%20respect%20of%20their%20faith%20in%20the%20Covenant" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-53e153ff97" data-kw="">
<blockquote><p>1. It is certain that it is the parents great duty to bring up their children in the nurture and admonition of the Lord. 2. It is certain that God has appointed this to be the means of their actual knowledge, faith and holiness. (Eph. 6:4-5; Col. 3:21; Gen. 18:19; Dt. 6:6-8 &amp; 11:18-20) 3. And God does not appoint such means unnecessarily or in vain: nor may we ordinarily expect his grace but in the use of the means of grace, which He has appointed us to use. 4. It is certain that God’s receiving the children of the faithful is an act of God’s love to the parents as well as the children, and promised as a part of his blessing on themselves. … 6. Even before children are capable of instruction, there are certain duties imposed by God on the parents for their sanctification, viz.: 1. That the parents pray earnestly and believingly for them. 2. That they themselves so live towards God as may invite Him still to bless their children for their sakes, as he did Abraham’s, and usually did to the faithful’s seed. (2nd Commandment; Prov. 20:7) 7. It is certain that the Church ever required parents not only to enter their children into the Covenant, and so to leave them, but to do their after duty for their good, and to pray for them, and educate them according to their Covenant. 8. It is plain that if there were none to promise so to educate them, the Church would not baptize them. And God Himself, who allowed the Israelites, and still allows us, to bring our children into his Covenant, does it on this supposition, that we promise also to go on to do our duty for them, and that we actually do it. 9. All this set together maketh it plain: 1. That God never promises the adult in baptism, though true believers, that He will work in them all graces further by his sanctifying Spirit, let them never so much neglect or resist Him: or that He will absolutely see that they never shall resist Him: nor that the Spirit shall still help them, though they neglect all his means; or that He will keep them from neglecting the means (election may secure this to the elect as such; but the Baptismal Covenant as such secures it not to the baptized, nor to believers as such). 2. And consequently… that the Holy Ghost as your Sanctifier will afford you all necessary help in the use of those means which He has appointed you to receive his help in. … 11. And how dangerously parents may make partial forfeitures of the Spirit’s assistance to their children, and operations on them, by their own sinful lives, and neglect of prayer, and of prudent and holy education, even in particular acts, I fear many believing parents never well considered. 12. Yet is not this forfeiture such as obliges God to deny his Spirit: For He may do with his own, as a free benefactor, as He list; and may have mercy freely, beyond his promise (though not against his Word) on whom He will have mercy. But I say that He that considers the woeful unfaithfulness and neglect of most parents, even the religious, in the great work of holy educating their children, may take the blame of their ungodliness on themselves, and not lay it on Christ or the Spirit who was in Covenant with them as their Sanctifier, seeing He promised but conditionally to give them the sanctifying heavenly influences of his life, light, and love, in their just use of his appointed means, according to their abilities. 13. Also as soon as children come to a little use of reason, they stand conjunctly on their parents’ wills and on their own. As their parents are bound to teach and rule them, so they are bound to learn of them and be ruled by them for their good. And though every sin of a parent or a child be not a total forfeiture of grace, yet both their notable actual sins may justly be punished with a denial of some further help of the Spirit which they grieve and quench.</p></blockquote>

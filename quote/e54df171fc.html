<main class="wrap"><figure class="quote" id="q-e54df171fc" data-kw="">
<blockquote><p>Repentance goes before justification, even as faith and hope; for of the Baptist it is said, that he preached the baptism of repentance for the remission of sins, Mk. 1:4; Lk. 3:3. But regeneration follows justification; for, being justified, we receive the Spirit of sanctification, whereby we are renewed, and, as it were, find a new creature begun even in this life. Repentance is the cause, regeneration is the effect; for therefore God does renew us in Christ, and make us new men, because we repent us of our old life, and begin to be wise after sin committed. Notwithstanding in the middle place, betwixt repentance and regeneration, comes in justification, when as God does of his mere mercy account and repute us as just. The name of repentance implies sorrow, but the name of regeneration gladness. To conclude, the points of repentance, as whence it proceeds and whereunto it tends, they are deeds, the evil or sin committed, and the good which ought to be practised; but the bounds of regeneration are qualities — inherent corruption, and sanctity or holiness, which is wrought in us; the old man and new man renewed in Christ. …For every change of the mind is not to be deemed forthwith regeneration, but there are certain changes of man’s mind which go before regeneration, and which prepare the mind, and so the whole man, unto regeneration, and to that new creation; in which kind repentance is a special grace. These things are to be distinguished not in time but in nature; for at that very same instant, we believe, and be effectually called, and do repent, and be justified, and be regenerate.</p></blockquote>

<blockquote><p>‘Born again’. Being turned unto God by true faith and repentance: A metaphorical term. We are born again four ways:

1. Sacramentally, by Baptism.

2. Spiritually, by the Word.

3. Corporally, in the Resurrection.

4. Eternally, in our Glorification. Question: But why is our repentance likened to a new birth? Answer: [1] To distinguish true repentance, from that which is false and fained: for it imports five differences. …

2. That in true repentance there is a total change in the whole nature of man: He has grace in every part; a new mind and a new heart, a new memory, and a new conscience, a new language, and a new carriage both to God and man: for birth is the producing of all essential parts of man.

3. That in true repentance there is the pain of contrition, a broken spirit, the throws and pains of travail, there is true godly sorrow and grief in the birth of grace.

4. That there is in true repentance a daily hunger and thirst after the sincere milk of the Word, 1 Pet. 2:2.

5. That in the things of God’s Kingdom there is new life, and sense, and feeling, and motion. Secondly, to show the privilege of the penitent: for it signifies he gets more by his new birth than any child in nature can do by pleading his birthright: For if in repentance we be born unto God, then it shows:

1. That we have received power to be the sons of God, Jn. 1:2.

2. That with our adoption we enjoy the privileges of sons.

1. The favor of God, as a father.

2. The care of God to maintain us, Mt. 6:33.

3. The pardon of God in saving us from condemnation, Rom. 8:1.

4. The portion of God, even the inheritance which God gives as a Father, which is spoken of Rom. 8:17; Gal. 4:7. The use should be twofold: 1. That wee try ourselves carefully in the businesse of our repentance by the former signes:* 1.2 and secondly, that we comfort ourselves in the privileges of our new birth, rejoicing in our portion, and the favor of our heavenly Father. And thus of the reason of the phrase. Concerning the new birth, here we have occasion to consider of two things: 1. That it is needful often to be remembered of the doctrine of regeneration: the apostle having spoken of it before, falls upon it here again.</p></blockquote>

</figure><figure class="quote" id="q-c7d28ddb58" data-kw="">
<blockquote><p>Thesis 10… But one also speaks of a wider meaning of the term ‘righteousness’, as about that most perfect, which is subjectively in Christ alone according to the flesh and which alone, imputed to us by faith, pacifies our consciences before the tribunal of God. This concerning holiness within us, is applied and inchoate in another gift of God. Thus, if ‘justification’ is taken as the free application of the latter rather than the former benefit, Christ having been seized by faith, we do not deny that the term ‘justification’ is comprehended as much as that benefit of that imputed and most perfect righteousness as the benefit of sanctification inchoate in us is. Yet we say that careful and painstaking care must be applied in order that one may not be confounded with the other and that we may know that the part first in order pleases and is accepted by God on account of Christ and in Christ alone is seized by faith, and that second gift of regeneration follows later.</p></blockquote>

<blockquote><p>IV. Problem: Whether the will, both in the first and in the second moment of conversion, is determined by grace immediately, or indeed mediately through the ultimate judgment of the practical intellect? Response: See concerning this question the Appendix to the Disputations on Creation.

V. Problem: Whether the affirmative opinion [that the will is determined in conversion only mediately] does not favor Pelagianism, and deny the necessity and efficacy of grace in the will? Response: Negative, because they can nevertheless defend special grace, and that efficaciously prevailing and conquering, which is never rejected or can be rejected by any hard heart, in the composite sense; moreover they attribute nothing of faculty or cooperation for spiritual life to man in the first moment of conversion—as can be seen in [John] Cameron’s disputation with Tilenus, and his apology against the epistle of the anonymous Remonstrant (entitled “The Epistle of a Learned Man,” etc.) afterwards published.

VI. Problem: Whether the truth can be more easily, evidently, and solidly explained and defended against the Pelagians by this reasoning? Response: So indeed Cameron, just praised, seems to think, and with him Dr. Maccovius in his Academic Disputations recently published. Yet the ancient and received opinion is not obscurely preferred by Molinaeus in his Disputation on Free Will; Walaeus in his Disputation on the Conversion of the Will, in the year 1622, on the 17th day of March; Ames in his Medulla, and passim in his Anti-Remonstrant writings; and Spanheim, who appeared after the first edition of the present disputation, in his latest writing against Universal Grace. The Dominicans and other genuine Thomists, who today plead the cause of God in this matter against the Jesuits and other more recent Pelagians, do not think alike here—concerning which elsewhere. We touch on this question in the Disputations and Problems on Creation.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“IV. Problem: Whether the will, both in the first and in the second moment of conversion, is determined by grace immediately, or indeed mediately through the ultimate judgment of the practical intellect? Response: See concerning this question the Appendix to the Disputations on Creation.

V. Problem: Whether the affirmative opinion [that the will is determined in conversion only mediately] does not favor Pelagianism, and deny the necessity and efficacy of grace in the will? Response: Negative, because they can nevertheless defend special grace, and that efficaciously prevailing and conquering, which is never rejected or can be rejected by any hard heart, in the composite sense; moreover they attribute nothing of faculty or cooperation for spiritual life to man in the first moment of conversion—as can be seen in [John] Cameron’s disputation with Tilenus, and his apology against the epistle of the anonymous Remonstrant (entitled “The Epistle of a Learned Man,” etc.) afterwards published.

VI. Problem: Whether the truth can be more easily, evidently, and solidly explained and defended against the Pelagians by this reasoning? Response: So indeed Cameron, just praised, seems to think, and with him Dr. Maccovius in his Academic Disputations recently published. Yet the ancient and received opinion is not obscurely preferred by Molinaeus in his Disputation on Free Will; Walaeus in his Disputation on the Conversion of the Will, in the year 1622, on the 17th day of March; Ames in his Medulla, and passim in his Anti-Remonstrant writings; and Spanheim, who appeared after the first edition of the present disputation, in his latest writing against Universal Grace. The Dominicans and other genuine Thomists, who today plead the cause of God in this matter against the Jesuits and other more recent Pelagians, do not think alike here—concerning which elsewhere. We touch on this question in the Disputations and Problems on Creation.”

— Gisbertus Voetius, Select Theological Disputations, (1655), vol. 2, Disputation 30, ‘On Regeneration’, pt. 2 (1639), p. 447 ff. tr. AI by Roman Prestarri Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIV.+Problem%3A+Whether+the+will%2C+both+in+the+first+and+in+the+second+moment+of+conversion%2C+is+determined+by+grace+immediately%2C+or+indeed+mediately+through+the+ultimate+judgment+of+the+practical+intellect%3F+Response%3A+See+concerning+this+question+the+Appendix+to+the+Disputations+on+Creation.+V.+Problem%3A+Whether+the+affirmative+opinion+%5Bthat+the+will+is+determined+in+conversion+only+mediately%5D+does+not+favor+Pelagianism%2C+and+deny+the+necessity+and+efficacy+of+grace+in+the+will%3F+Response%3A+Negative%2C+because+they+can+nevertheless+defend+special+grace%2C+and+that+efficaciously+prevailing+and+conquering%2C+which+is+never+rejected+or+can+be+rejected+by+any+hard+heart%2C+in+the+composite+sense%3B+moreover+they+attribute+nothing+of+faculty+or+cooperation+for+spiritual+life+to+man+in+the+first+moment+of+conversion%E2%80%94as+can+be+seen+in+%5BJohn%5D+Cameron%E2%80%99s+disputation+with+Tilenus%2C+and+his+apology+against+the+epistle+of+the+anonymous+Remonstrant+%28entitled+%E2%80%9CThe+Epistle+of+a+Learned+Man%2C%E2%80%9D+etc.%29+afterwards+published.+VI.+Problem%3A+Whether+the+truth+can+be+more+easily%2C+evidently%2C+and+solidly+explained+and+defended+against+the+Pelagians+by+this+reasoning%3F+Response%3A+So+indeed+Cameron%2C+just+praised%2C+seems+to+think%2C+and+with+him+Dr.+Maccovius+in+his+Academic+Disputations+recently+published.+Yet+the+ancient+and+received+opinion+is+not+obscurely+preferred+by+Molinaeus+in+his+Disputation+on+Free+Will%3B+Walaeus+in+his+Disputation+on+the+Conversion+of+the+Will%2C+in+the+year+1622%2C+on+the+17th+day+of+March%3B+Ames+in+his+Medulla%2C+and+passim+in+his+Anti-Remonstrant+writings%3B+and+Spanheim%2C+who+appeared+after+the+first+edition+of+the+present+d

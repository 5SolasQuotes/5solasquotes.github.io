<blockquote><p>…though such has been the dotage, and is at this day of superstitious ones, that they think to charm the devil with their carnal exorcisms; hence the Romish reliques, cross, holy water, yea, and among the Jews themselves in corrupter times, who thought by their phylacteries and circumcision to scare away the devil, which made some of them expound that, Cant. 3:8, of circumcision, ‘Every man hath his sword on his thigh, because of fear in the night.’ By sword on the thigh, they expound circumcision, which they will vainly have given as a charm against evil spirits that affright them in the night. But alas, the devil cares for none of these, no, not for an ordinance of God, when by fleshly confidence we make it a spell: he has been often bound with these fetters and chaines (as is said of him in the Gospel) and the chains have been plucked asunder by him, neither could any man thus tame him. He esteems, as Job says of the Leviathan, iron as straw, and brass as rotten wood. It must be a stronger than the strong man must bind him, and none stronger but God the Father of spirits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian in Complete Armor</cite>, … (London, 1655), ch. 4, section 1, pp. 197-98</span></figcaption>

k">Read it online · Reformed Books Online</a></div>

<blockquote><p>Is Baptism to be administered without exorcism, or conjuring out of the Devil, or blowing? To exorcise is to adjure a man by holy things, as by God, or by Christ, to do a thing, which men commonly call ‘to conjure’, as the 26th of Mathew, the high-priest says unto Christ, “I conjure thee by the living God, to tell us if thou be Christ.” And the sons of Sceva in the 19th of Acts conjured the devil by Jesus, whom Paul preached: Hence come exorcists and true exorcism: which gift was peculiar to the Holy Ghost, by which the apostles at the first, and other faithful, drave devils out of the possessed, as we read in the Acts, and Christ says, they shall cast out devils, Mark 16; but yet without baptism as Tertullian observes: Therefore it is not to be retained: First, because when Christ instituted baptism, He did not command any to exorcise; Secondly, for that the devil is driven out by Christ even in baptism, for as Cyprian says, like as scorpions and serpents, which are of force on dry land, can do no hurt, being flung into the water, so an evil spirit can inhabit no longer in whom the Spirit of God begins to dwell after baptism and sanctification. Thirdly, for that the apostles administered it without exorcism. Fourthly, neither those that are possessed, or the heathen worshippers of devils are to be baptized, but only they who are holy and partakers of the Covenant of Grace and the members of Christ, and to say that such are subject to the devils’ destroying power were very absurd. Fifthly, that gift of exorcising joined with the gift of miracles was but for a time, as that also was when many sick people were healed by the anointing of the ministers of the Church, and by invocation of the name of Christ (James 5:14), till such time as Christian religion was spread over all the world. Sixthly, for that exorcism was never used at the circumcising of infants. But whereas the heathen did bring testimony unto the Church, before their baptizing (as Tertullian witnesses) that they renounced the devil and his angels, this was a public testimony of repentance in them of years, as also that blowing, with clapped hands, which he that was to be baptized performed, did give the Church thereby to understand that he renounced Satan and his kingdom. But in the Papacy it is done by the baptizer, even [in] the face of infant to be baptized, and is therefore frivolous and to be rejected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, … (London, 1606), ch. 47, ‘Of Baptism’, pp. 729-30</span></figcaption>

<blockquote><p>([Margin Note:] Places Haunted by Evil Spirits must be Shunned) 3rd Use. This branch of the petition serves to direct us what to do in this case: say that a dwelling house or some other place is by God’s permission haunted and abused by some evil spirit, whether may a man lawfully frequent or abide in such a place? Answer: By this petition is plain he may not; for here we pray to be delivered from evil, and therefore we may not voluntarily thrust ourselves into such a place as is haunted by the devil: would we come within the compass of the lion’s paw, or within the chain of a mad dog, or of an hunger-bitten bear? Why then should we rashly thrust ourselues into the danger of the devil, who like a roaring lion seeks continually whom he may devour. Many ignorant people are so bold-hardy that they will rai•e upon and defy the deuil, and command him to be gone. But without a calling thereunto we may not so do. Indeed, if by God’s providence we be called to live in such places necessarily, then this we may do, we must not reason with the devil, but betake ourselves to God by humble and earnest prayer, and complain of Satan’s vexation, making God our shelter and defence both for soul and body: else if we presume to meddle with him without a calling from God, we may justly be foiled and abused by him (as the sons of Sceva were, Acts 19:14,16) because we have no promise from the Lord to be protected from him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount</cite>, on Mt. 6:13 in A Godly &amp; Learned Exposition of Christ’s Sermon in the Mount... (Cambridge, 1608), pp. 315-6</span></figcaption>

<blockquote><p>A 1700’s treatise surfaced two centuries ago regarding the supernatural and scientific phenomenon that plagued Europe in an era when magic, witchcraft, demonology, instances of haunting and even cases of vampires were recorded in historical documentation. It was during the age of reason when a Black Monk from the Benedictine Order of the 18th century penned a work that would become one of the most influential and controversial works of his time. A plethora of cases regarding events in the supernatural had plagued mankind with fear and mystery throughout history, many inhabitants to the regions of Europe came under an epidemic of social hysteria which steamed from reports of corpses rising from their graves, killing and sucking the blood of victims inhabiting small villages or visitations and the haunting of ghosts, evil spirits and demons. The Black Monk, Abbot Don Augustin Calmet tasked himself with the study of these… historically documented reports for the purpose of providing the public with the rules to determine a claim’s legitimacy through philosophical reasoning and scientific examination that was approved by the King of France in 1746. This work provides an in depth look into the history of most superstitions, mythologies, the analysis of events depicted in ancient texts from various religions and historically renowned cases… Calmet lays out the rules for determining the fraudulent claims from the real while also providing a “how to” manual when dealing with or investigating occult matters in witchcraft, ghosts, vampires and demonic possessions. This work was written by an ordained abbot monk and was accepted by European society as scientific research in his time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-calmet.html">Augustine Calmet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations 50-52 in Treatise on the Apparitions of Spirits and on Vampires or Revenants of Hungary, Moravia, et al</cite>, ed. Warren; tr. Christmas</span></figcaption>

<div class="actions"><button class="copy" data-copy="“A 1700’s treatise surfaced two centuries ago regarding the supernatural and scientific phenomenon that plagued Europe in an era when magic, witchcraft, demonology, instances of haunting and even cases of vampires were recorded in historical documentation. It was during the age of reason when a Black Monk from the Benedictine Order of the 18th century penned a work that would become one of the most influential and controversial works of his time. A plethora of cases regarding events in the supernatural had plagued mankind with fear and mystery throughout history, many inhabitants to the regions of Europe came under an epidemic of social hysteria which steamed from reports of corpses rising from their graves, killing and sucking the blood of victims inhabiting small villages or visitations and the haunting of ghosts, evil spirits and demons. The Black Monk, Abbot Don Augustin Calmet tasked himself with the study of these… historically documented reports for the purpose of providing the public with the rules to determine a claim’s legitimacy through philosophical reasoning and scientific examination that was approved by the King of France in 1746. This work provides an in depth look into the history of most superstitions, mythologies, the analysis of events depicted in ancient texts from various religions and historically renowned cases… Calmet lays out the rules for determining the fraudulent claims from the real while also providing a “how to” manual when dealing with or investigating occult matters in witchcraft, ghosts, vampires and demonic possessions. This work was written by an ordained abbot monk and was accepted by European society as scientific research in his time.”

<main class="wrap"><figure class="quote" id="q-31c43e2a8c" data-kw="">
<blockquote><p>Among Treatises fit to be published and read, Treatises of Devotion are most fit: as being freest from offence, and fullest of divine matter. If comparison may be made betwixt parts of sacred Scripture, the Psalms of David have an excellency in that they consist of matters of Devotion. Answerable to the style of his name, is the style of his book. The style of his name was, A man after GOD’S own heart. For such was his piety and sincerity as GOD was well pleased therewith, and took much delight therein. The rather because his devotion towards GOD incited him to do what GOD required to be done. So the Book of Psalms, may well carry this style, A book after God’s own heart, in that nothing is more acceptable unto GOD, nothing wherein he takes more delight then Devotion.

And no book of sacred Scripture fuller of Devotion then that book. Most of the Psalms wholly consist of Prayers or Praises: very few, if any at all, wherein there are not some divine raptures, and such heavenly ejaculations, as manifest an heart full of Devotion. For Devotion is a pious and humble affection to God-wards. Humble through conscience of a man’s own infirmity. Pious through a due consideration of the divine clemency. Such Devotion is never more fully and to the life manifested then in Prayers and Praises.

For in these divine duties, if rightly performed, the soul presents it self before GOD, and that in a special manner, being after a sort even rapt out of the body. Then, if ever, doth the Soul, so far as it is capable, with an holy admiration apprehend the divine Majesty, Purity, Justice, Wisdom, Power, yea Mercy, Goodness, and other excellencies wherewith GOD is decked. Then, if ever is the soul brought thoroughly to discern its own infirmity, impurity, baseness, vileness and cursedness.

For contraries paralleled, or laid together do most lively set forth each other in their own proper colours. He that liveth in a dark dungeon, will be enamoured with the bright shining of the Sun, when he can have liberty to see it. And he that hath long lived under bright Sun-shine, more thoroughly discerns the horror and damage of darkness. Now GOD and man are in many respects directly opposite each to other: This opposition is best discerned in our most serious contemplations of Gods excellencies and due consideration of our own manifold infirmities, which is most to purpose done in acts and exercises of Devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Robert Bolton, Certain devout prayers of Mr. Bolton upon solemn occasions</cite></span></figcaption>

<blockquote><p>We allege, further, that there is no ground to conclude that the use of the inspired Psalms in the Church was abrogated at the close of the former economy.

It is an incontrovertible maxim, that whatever God has appointed to be observed in his worship should be perpetually observed, unless he himself intimated that it is temporary, or declares its abrogation. Singing God’s praise is obviously a moral duty, and, as such, of permanent obligation. Jehovah himself once appointed this duty to be performed in the words of David and Asaph; that is, by means of the inspired Psalms. Neither the duty of singing not the form of psalmody was of a ceremonial of judicial nature, [1] and, consequently, there is no reason to regard them abrogated when Christ came, and the partition wall was broken down. The church is, moreover, one in all ages. Every institution which her glorious Head has given her, she is bound carefully to observe, until it be abrogated by the same authority which first ordained it. No instance can be adduced in which the King of Zion has abrogated the use of the church’s inspired songs, or given permission to supplant them by the effusions of men. The divine sanction for using the Psalms is, therefore, yet disannulled, and the church now has the same warrant for drawing hence spiritual consolation, as had those to whom the sweet singer of Israel first delivered the inspired songs of Zion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Jan. 1835, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

<blockquote><p>It is affirmed, that in Col. 3:16, and in the parallel scriptures, we have indubitable evidence of the divine right of psalms, hymns, and spiritual songs, of human composition. The word of Christ, that is, according to a very lame exposition, the gospel, or writings of the New Testament, exclusively, must dwell in us richly, and that with a reference to our mutual improvement; which is effected by teaching one another, in the singing of psalms, hymns, and spiritual songs; which compositions not being found in the Old Testament, must be drawn from, and formed according to the doctrines of the gospel, found in the New Testament; for there alone, “the word of Christ,” which is to constitute the great matter of these compositions, is to be found, being expressly distinguished by the apostle, in writing to the Hebrews, from all former revelations.

To these assertions I make the following replies:—You will justify me in remarking, in the first place, that it is not true, that the “word of Christ,” or the gospel, is confined, exclusively, to the writings of the New Testament. One who well understood what the gospel is, informs us, that it was preached unto Abraham; and that to the Antediluvians the righteousness of faith, of which Noah was both an heir and a preacher, was made known. To them Christ by his Spirit preached in the day of forbearance, though now they occupy the place of imprisoned spirits. If the Spirit of Christ preached to them, one would reasonably conclude, they enjoyed the revelation of the word of Christ.

We are also certified, that the gospel was preached to the Israelites in the wilderness.—Unto us was the gospel preached as well as unto them. How could these writers presume to assert, that “where the apostle writes immediately to the Jews themselves, he expressly distinguishes the word of Christ from all former revelations, made by Moses and the prophets,”—“distinguishes the gospel from all the revelations of the divine will, in the Old Testament,”—when that apostle informs those very people, and in that same epistle, that the gospel, in “the revelation of the divine will in the Old Testament,” was preached to their fathers? May not a suspicion, without illiberality, exist, that men who write and talk at this rate, are novices in the knowledge of what the gospel is? But, in every age of the church, teachers have been found, understanding neither what they said, nor whereof they affirmed.

My second remark is this:—It is gratuitous to assert, that in the Old Testament scriptures, psalms, hymns, and spiritual songs, are not to be found. Is not this a pitiful play on words? Does it become men of sense thus to write? …

My third remark is on the text, Col. 3:16.—It appears to be both misunderstood and misapplied. Duties highly important, and the manner of performing them, are enjoined. They are three: An intimate and extensive acquaintance with the doctrine of Christ: Let the word of Christ dwell in you richly—Wisely promoting each other’s edification: In all wisdom, teaching and admonishing one another—Praising God, with proper dispositions of heart, in the use of psalms, hymns, and spiritual songs: In psalms, and hymns, and spiritual songs, singing with grace in your heart to the Lord. The celebration of the divine perfections, in suitable songs, wisely teaching and admonishing one another, are duties demanded by God; and that to discharge these duties aright, requires an extensive acquaintance with the inspired page, our apostle teaches, and the Christian readily acknowledges; but the scripture under consideration neither requires the members of the church to commence making hymns, nor authorizes the use of such, in the church, when made.

Psalms, and hymns, and spiritual songs, are, indeed, to be sung; but these are found in this inspired Book. The attempt to justify the expulsion of the Book of Psalms, and the introduction of uninspired hymns, from these injunctions of the sacred writer, argues a remarkable obliquity of intellect, not excused, even by the unhappy punctuation of our version. I have said, unhappy punctuation; for “through bad pointing this verse is not very intelligible; the several members of it should be distinguished thus: Let the doctrine of Christ dwell richly among you; teaching and admonishing each other in all wisdom; singing, with grace in your hearts unto the Lord, in psalms, hymns, and spiritual songs. This arrangement the original will not only bear, but it absolutely requires it, and it is not sense without it.” Still, it must be seen, that no pointing, however bad, can give any countenance to a human, in preference to an inspired system of psalms. Whether the argument upon which I have animadverted, merits a better character than “gratuitous assumption,” I leave to my reader to decide.</p></blockquote>

— Gilbert McMaster, An Apology for the Book of Psalms, in Five Letters; Addressed to the Friends of Union in the Church of God, (1818; 4th edn, Philadelphia: Daniels &amp; Smith, 1852), pp 156-59n.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+affirmed%2C+that+in+Col.+3%3A16%2C+and+in+the+parallel+scriptures%2C+we+have+indubitable+evidence+of+the+divine+right+of+psalms%2C+hymns%2C+and+spiritual+songs%2C+of+human+composition.+The+word+of+Christ%2C+that+is%2C+according+to+a+very+lame+exposition%2C+the+gospel%2C+or+writings+of+the+New+Testament%2C+exclusively%2C+must+dwell+in+us+richly%2C+and+that+with+a+reference+to+our+mutual+improvement%3B+which+is+effected+by+teaching+one+another%2C+in+the+singing+of+psalms%2C+hymns%2C+and+spiritual+songs%3B+which+compositions+not+being+found+in+the+Old+Testament%2C+must+be+drawn+from%2C+and+formed+according+to+the+doctrines+of+the+gospel%2C+found+in+the+New+Testament%3B+for+there+alone%2C+%E2%80%9Cthe+word+of+Christ%2C%E2%80%9D+which+is+to+constitute+the+great+matter+of+these+compositions%2C+is+to+be+found%2C+being+expressly+distinguished+by+the+apostle%2C+in+writing+to+the+Hebrews%2C+from+all+former+revelations.%0A%0ATo+these+assertions+I+make+the+following+replies%3A%E2%80%94You+will+justify+me+in+remarking%2C+in+the+first+place%2C+that+it+is+not+true%2C+that+the+%E2%80%9Cword+of+Christ%2C%E2%80%9D+or+the+gospel%2C+is+confined%2C+exclusively%2C+to+the+writings+of+the+New+Testament.+One+who+well+understood+what+the+gospel+is%2C+informs+us%2C+that+it+was+preached+unto+Abraham%3B+and+that+to+the+Antediluvians+the+righteousness+of+faith%2C+of+which+Noah+was+both+an+heir+and+a+preacher%2C+was+made+known.+To+them+Christ+by+his+Spirit+preached+in+the+day+of+forbearance%2C+though+now+they+occupy+the+place+of+imprisoned+spirits.+If+the+Spirit+of+Christ+preached+to+them%2C+one+would+reasonably+conclude%2C+they+enjoyed+the+revelation+of+the+word+of+Christ.%0A%0AWe+are+also+certified%2C+that+the+gospel+was+preached+to+the+Israelites+in+the+wilderness.%E2%80%94Unto+us+was+the+gospel+preached+as+well+as+unto+them.+How+could+these+writers+presume+to+assert%2C+that+%E2%80%9Cwhere+the+apostle+writes+immediately+to+the+Jews+themselves%2C+he+expressly+distinguishes+the+word+of+Christ+from+all+former+revelations%2C+made+by+Moses+and+the+prophets%2C%E2%80%9D%E2%80%94%E2%80%9Cdistinguishes+the+gospel+from+all+the+revelations+of+the+divine+will%2C+in+the+Old+Testament%2C%E2%80%9D%E2%80%94when+that+apostle+informs+those+very+people%2C+and+in+that+same+epistle%2C+that+the+gospel%2C+in+%E2%80%9Cthe+revelation+of+the+divine+will+in+the+Old+Testament%2C%E2%80%9D+was+preached+to+their+fathers%3F+May+not+a+suspicion%2C+without+illiberality%2C+exist%2C+that+men+who+write+and+talk+at+this+rate%2C+are+novices+in+the+knowledge+of+what+the+gospel+is%3F+But%2C+in+every+age+of+the+church%2C+teachers+have+been+found%2C+understanding+neither+what+they+said%2C+nor+whereof+they+affirmed.%0A%0AMy+second+remark+is+this%3A%E2%80%94It+is+gratuitous+to+assert%2C+that+in+the+Old+Testament+scriptures%2C+psalms%2C+hymns%2C+and+spiritual+songs%2C+are+not+to+be+found.+Is+not+this+a+pitiful+play+on+words%3F+Does+it+become+men+of+sense+thus+to+write%3F+%E2%80%A6%0A%0AMy+third+remark+is+on+the+text%2C+Col.+3%3A16.%E2%80%94It+appears+to+be+both+misunderstood+and+misapplied.+Duties+highly+important%2C+and+the+manner+of+performing+them%2C+are+enjoined.+They+are+three%3A+An+intimate+and+extensive+acquaintance+with+the+doctrine+of+Christ%3A+Let+the+word+of+Christ+dwell+in+you+richly%E2%80%94Wisely+promoting+each+other%E2%80%99s+edification%3A+In+all+wisdom%2C+teaching+and+admonishing+one+another%E2%80%94Praising+God%2C+with+proper+dispositions+of+heart%2C+in+the+use+of+psalms%2C+hymns%2C+and+spiritual+songs%3A+In+psalms%2C+and+hymns%2C+and+spiritual+songs%2C+singing+with+grace+in+your+heart+to+the+Lord.+The+celebration+of+the+divine+perfections%2C+in+suitable+songs%2C+wisely+teaching+and+admonishing+one+another%2C+are+duties+demanded+by+God%3B+and+that+to+discharge+these+duties+aright%2C+requires+an+extensive+acquaintance+with+the+inspired+page%2C+our+apostle+teaches%2C+and+the+Christian+readily+acknowledges%3B+but+the+scripture+under+consideration+neither+requires+the+members+of+the+church+to+commence+making+hymns%2C+nor+authorizes+the+use+of+such%2C+in+the+church%2C+when+made.%0A%0APsalms%2C+and+hymns%2C+and+spiritual+songs%2C+are%2C+indeed%2C+to+be+sung%3B+but+these+are+found+in+this+inspired+Book.+The+attempt+to+justify+the+expulsion+of+the+Book+of+Psalms%2C+and+the+introduction+of+uninspired+hymns%2C+from+these+injunctions+of+the+sacred+writer%2C+argues+a+remarkable+obliquity+of+intellect%2C+not+excused%2C+even+by+the+unhappy+punctuation+of+our+version.+I+have+said%2C+unhappy+punctuation%3B+for+%E2%80%9Cthrough+bad+pointing+this+verse+is+not+very+intelligible%3B+the+several+members+of+it+should+be+distinguished+thus%3A+Let+the+doctrine+of+Christ+dwell+richly+among+you%3B+teaching+and+admonishing+each+other+in+all+wisdom%3B+singing%2C+with+grace+in+your+hearts+unto+the+Lord%2C+in+psalms%2C+hymns%2C+and+spiritual+songs.+This+arrangement+the+original+will+not+only+bear%2C+but+it+absolutely+requires+it%2C+and+it+is+not+sense+without+it.%E2%80%9D+Still%2C+it+must+be+seen%2C+that+no+pointing%2C+however+bad%2C+can+give+any+countenance+to+a+human%2C+in+preference+to+an+inspired+system+of+psalms.+Whether+the+argument+upon+which+I+have+animadverted%2C+merits+a+better+character+than+%E2%80%9Cgratuitous+assumption%2C%E2%80%9D+I+leave+to+my+reader+to+decide.%E2%80%9D%0A%0A%E2%80%94+Gilbert+McMaster%2C+An+Apology+for+the+Book+of+Psalms%2C+in+Five+Letters%3B+Addressed+to+the+Friends+of+Union+in+the+Church+of+God%2C+%281818%3B+4th+edn%2C+Philadelphia%3A+Daniels+%26+Smith%2C+1852%29%2C+pp+156-59n.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6a2d046ea4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6a2d046ea4.html">Permalin

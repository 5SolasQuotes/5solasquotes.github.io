<main class="wrap"><figure class="quote" id="q-dee51bbe6b" data-kw="">
<blockquote><p>But I know for certain that Your Excellency has such great expertise in this controversy that it would be difficult for anyone to find its equal in any other person. Indeed, there is not one of the Fathers that you have not carefully examined. There is no book by an author old or new in which with these eyes of mine I have not seen annotations in your own hand about all that pertains to this whole disputation. You yourself with intense labour have digested under the main headings the councils, canons, and papal decrees which pertain to this question so that, unless I had witnessed these things with my own eyes, I would never have given a ready belief to other people who related this.

You have committed this sort of work, devotion, and labour not just to this question of the Eucharist; I have observed that you have also done the same regarding almost all other doctrines most subject to controversy in this age of ours. For this reason I need not have shown this little book of mine to you so that you might learn something new from it (since I rather have drawn the greater part of my teaching from your labours …</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise on the Sacrament of the Eucharist</cite>, (1549), trans. and ed. Joseph C. McLelland in The Peter Martyr Library: Volume 7 (Kirksville MO: Sixteenth Century Essays &amp; Studies, 2000), dedication, p. 7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper.html">The Lord&#x27;s Supper</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5825e88ff5" data-kw="">
<blockquote><p>Promulgation of a truth and Christian reproof are duties commanded by God; and yet are sometimes to be abstained from for scandals taken, by not only the weak, but also malicious. ‘Reprove not a scorner, least he hate thee,’ Prov. 9:8; ‘speak not in the ears of a fool; for he will despise the wisdom of thy words,’ Prov. 23:9. ‘Give not that which is holy unto dogs, neither cast ye your pearls before swine, lest they trample them under their feet and turn again and rent you,’ Mt. 7:6. Pro vitando scandalo cessat rigor disciplinae. ‘To avoid scandal the rigor of discipline ceases.’ To explain this, farther recourse must be had unto that old and golden rule, Affirmativa praecepta semper obligant, non ad semper. Affirmative precepts do always bind, but not to always; so that we are not bound to perform always what they enjoin but only Loco &amp; tempore debitis, when we have due time and place. Now as by the intercurrency of other circumstances, so especially by intercurrence of scandal, there may not be opportunity and seasonableness of doing what we are urged unto by some affirmative precepts; so these precepts may pro hic &amp; nunc, cease to be obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-jeanes.html">Henry Jeanes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Want</cite>, [Lack] of Church-Government [is] No Warrant for a Total Omission of the Lord’s Supper. Or a Brief &amp; Scholastical Debate of that Question which has so Wonderfully Perplexed Many, Both Ministers &amp; People: Whether or No the Sacrament of the Lord’s Supper may (according to Presbyterial Principles) be Lawfully Administered [by a Minister] in an un-presbyterated church, that is, a church destitute of ruling elders. Wherein the affirmative is confirmed… (London, 1650) Jeanes was an English presbyterian., p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><figure class="quote" id="q-9438919582" data-kw="">
<blockquote><p>This toleration of drunkards and swearers in the Lord’s Church and at his Table infects and is apt to leaven all with their evil conversation, but does not leaven the worship to the fellow-worshippers, nor is the sin of private persons, yea nor of our ministers, who have not power to help it (but it is the fault of the Church), except you make no separation from a Church where a scandalous person is tolerated (for suffering more or fewer does not vary the species) to be a sin publicly to be repented, before any can be members of your Church, which is prodigious to us.</p></blockquote>

<blockquote><p>14 Q. How often is the Lord’s Supper to be administered and received?

14 A. The Lord’s Supper is to be often administered, and received often by every Christian. 1 Cor. 11 24, 25, 26, 27, 28.

Is it often to be administered?

Yes.

Or, Seldom?

No.

And, Must it be received often?

Yes.

Or, Seldom?

No.

Or, May any keep away at their own pleasure, and come only when they list?

No.

Or, Are they excusable that refuse to come, because they have no leisure for worldly businesses?

No.

Or, Because they have not repented of their sins?

No.

Or, Because they are not in charity?

No.

Or, Any such like excuse?

No.</p></blockquote>

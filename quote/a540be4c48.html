<blockquote><p>The second part of the division, however, that between ‘proper’ and ‘figurative,’ is the point of distinction between the affections and all of the attributes discussed previously [life, intellect, will, righteousness, truth, pwer, glory, etc.]. For the affections of the divine will or, as they are sometimes called, divine virtues, are attributed to God, not properly, but figuratively… The affections are, therefore, either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. … …the [reformed] orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions… …This, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept… A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.433 433. [William] Ames, Marrow, I.iv.63… the point of the theological argument is that God act[s] but is not acted upon. The Reformed orthodox understanding of God, in accord with the greater part of the Christian tradition, assumes the divine immutability, and, typically, denies change and, certainly, acquired qualities to God. … The divine affections… are divine perfections that have some analogy to the dispositions or habits of the human will.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95fb5874b7" data-kw="">
<blockquote><p>The more principal Relative Attributes are in number seven:

1. Creation.

2. Providence.

3. Lordship.

4. Benignity.

5. Mercy.

6. Redemption.

7. Justice. To which, or some of which, the rest of like nature may conveniently be referred. Though the terms Creator, Governor, Redeemer and Lord do more clearly hold forth the relation between God and the creature, yet (after others) the fore-named terms are here made use of: both as sufficiently containing the relation and better conducing to teach the doctrine intended. A new Relative Attribute or praedication does not always presuppose a change in that thing unto which that new relation is given, though it always presupposes a change in that whereunto such relation does really belong: for example sake: Peter may sit at the right hand of John without any change in Peter, the change being only in John who places himself at Peter’s left hand. The princes are said to stand on the right hand of the wall, Neh. 12:31, without any change in the wall; the change was only in them so placing themselves. So God who was not a Creator from eternity, is a Creator in time: yet this new appellation puts no change in God, but only in the creature. The Second Person who was not incarnate from eternity, becomes incarnate in the fulness of time, yet without any change: the change was, and is only in the human nature assumed, not in the divine nature assuming. In these Relative Attributes (the Creator being above the order of the creature), the extremes not being alike, the relation is not alike. The relation on Gods part is only a relation of reason: that is, such a respect of the Creator to the creature, as is without any change in Him: but on the creature’s part, it is a real relation: that is, such a relation as infers a change in it. Relative Attributes add a new predication or title to, but cause no real mutation or change in God: as concerning the creature, they both add a new predication to it and cause a real mutation in it. In all Relative Attributes there are considerable (but especially in Creation, Providence and Redemption) an eternal immanent act, whereby God wills such a thing to be; and a transient temporal act, whereby He works the thing according to his will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, Of the Divine Essence, pp. 10-11</span></figcaption>

<blockquote><p>Hence although love considered affectively and on the part of the internal act is equal in God (because it does not admit of increase and diminution), yet regarded effectively (or on the part of the good which He wills to anyone) it is unequal because some effects of love are greater than others.</p></blockquote>

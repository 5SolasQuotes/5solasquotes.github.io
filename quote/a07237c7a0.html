<blockquote><p>For the pope not contenting himself with the transcendency of ecclesiastical jurisdiction over the whole church, though he has no warrant for it in his boundless and endless ambition, did climb yet higher, and partly by the favour, or foolishness rather, of Christian princes, and partly by his own fraudulent and violent dealing, as the son of him who has been a murderer and a liar from the beginning, has set himself up first amongst, and next over the greatest princes and mightiest emperors, to dispose of their crowns and dignities at his pleasure, which is the mark and character of him who is spoken of by the apostle, Who sitteth in the temple of God as God, showing himself that he is God, and opposing and exalting himself above all that is called God (2 Thess. 2:4).</p></blockquote>

<blockquote><p>Qu. What reason have we to think that the Pope about that time began to be the great Antichrist.

Ans. For answer: We are to know that there are two particular characters of the Beast, as some Divines have observed out of the text, the former the cause of the later, viz. 1. Blasphemy; for he is full of names of blasphemy, Rev. 17.3. by which understand heresy and Idolatry. 2. cruelty, for he is a scarlet-coloured beast, and makes war with the Saints, ibid. &amp; ch. 13.7. But both these flow from an higher principle, which is (as I may say) proprium quarti modi, and a more convertible character of the beast, and that is his primacy or supremacy: This supremacy hath in it two things that make it up; one is a claiming of authority over the consciences of men, and so over their faith and worship; secondly the extending of this power to all Churches in all Nations.

I will not say that these two are the same thing, nor that they issue both from one and the same root; but surely this I may say, they are near a kin &amp; have their roots not far asunder, because they are generally still found in one and the self same person.

That both these meet in the grand Antichrist will appear.

First, he arrogates authority over the soul; so much I take to be intimated in those words of Daniel speaking of him, Dan. 7.25 He shall speak great words against the most high, and think to change times and laws; that he shall arrogate power to himself to change Gods laws, as in coining and altering Articles of Faith, appointing worship for God, &amp;c. high words, great words against God; so the Apostle, 2 Thes. 2.4. He as God sits in the Temple of God, shewing himself that he is God. How does he that? viz. by Lording it over the consciences of Gods people as if he were God, and thereby he deprives Christ of one of the principal Flowers of his Crown, which is to have dominion over the Faith: see more for this. Rev. 13.5 6.15, 16.

Secondly, the great Antichrist is to extend this power, at least, presumptively and intentionally where he cannot do it actually over all Kindreds, Tongues and Nations, Rev. 13.7.

It is Antichristian to claim such authority, though but over one man, or one Church; It is more Antichristian to claim such authority over many Churches, as the Hierarchical Bishop useth to do; it is yet more Antichristian to claim this authority over whole Provinces as the Hierarchical Archbishop useth to do; it is yet still more Antichristian to claim it over many Provinces &amp; Kingdoms, as the Hierarchical Patriarch useth to do; but yet all these do not amount to the grand Antichrist, why? because there may be a greater; but now he that claims such sovereignty over all the Churches of the world is the grand Antichrist indeed, for there can be no greater.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-reyner.html">William Reyner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Babylon’s ruining-earthquake and the restoration of Zion delivered in a sermon before the honourable House of Commons at Margaret’s Westminster, at their public fast, August 28, 1644</cite>, (London: Samuel Enderby, 1644), pp 33-34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

</figure><figure class="quote" id="q-6d95bf0c06" data-kw="">
<blockquote><p>Thus, if Tertullian be believed, true succession consists in conformity with the doctrine of the apostles: which being found in a church, whether great or small, of old or fresh date, such a church is truly apostolical, although for lack of histories she cannot show the line of her succession.</p></blockquote>

</figure><figure class="quote" id="q-5dd7f1a21d" data-kw="Papacy Papal supremacy">
<blockquote><p>The question, then, may be thus stated, Is it necessary for the true order of the hierarchy (as they term it), or of ecclesiastical order, that one See should surpass the others in dignity and power, so as to be the head of the whole body? We subject the Church to unjust laws if we lay this necessity upon her without sanction from the word of God. … Every one knows that the high priest was a type of Christ; now, the priesthood being transferred, that right must also be transferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.6.2</span></figcaption>

</figure><figure class="quote" id="q-a4040f858a" data-kw="">
<blockquote><p>We are constrained by the care of government which we have undertaken to extend vigilantly the solicitude of our office, and to instruct the minds of our brethren by addresses of admonition, that no wrongful presumption may avail to deceive the ignorant, nor any dissimulation to excuse those who know, lie it known then to your Fraternity that John, formerly bishop of the city of Constantinople, against God, against the peace of the Church, to the contempt and injury of all priests, exceeded the bounds of modesty and of his own measure, and unlawfully usurped in synod the proud and pestiferous title of oecumenical, that is to say, universal. When our predecessor Pelagius of blessed memory became aware of this, he annulled by a fully valid censure all the proceedings of that same synod, except what had therein been done in the cause of Gregory, bishop of Antioch, of venerable memory; taking him to task with most severe rebuke, and warning him to abstain from that new and temerarious name of superstition; even so as to forbid his deacon to go in procession with him, unless he should amend so great a wickedness… we once and again addressed the same most holy John by letter, bidding him relinquish that name of pride, and incline the elation of his heart to the humility which our Master and Lord has taught us. And having found that he paid no regard, we have not desisted, in our desire of concord, from addressing the like admonitions to our most blessed brother and fellow-priest Cyriacus, his successor. But since it is the case, as we see, now that the end of this world is near at hand, that the enemy of the human race has already appeared in his harbingers, so as to have as his precursors, through this title of pride, the very priests who ought to have opposed him by living well and humbly, I exhort and entreat that not one of you ever accept this name, that not one consent to it, that not one write it, that not one admit it wherever it may have been written, or add his subscription to it; but, as becomes ministers of Almighty God, that each keep himself from this kind of poisoned infection, and give no place to the cunning lier-in-wait, since this thing is being done to the injury and rendering asunder of the whole Church, and, as we have said, to the contemning of all of you. For if one, as he supposes, is universal bishop, it remains that you are not bishops.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“We are constrained by the care of government which we have undertaken to extend vigilantly the solicitude of our office, and to instruct the minds of our brethren by addresses of admonition, that no wrongful presumption may avail to deceive the ignorant, nor any dissimulation to excuse those who know, lie it known then to your Fraternity that John, formerly bishop of the city of Constantinople, against God, against the peace of the Church, to the contempt and injury of all priests, exceeded the bounds of modesty and of his own measure, and unlawfully usurped in synod the proud and pestiferous title of oecumenical, that is to say, universal. When our predecessor Pelagius of blessed memory became aware of this, he annulled by a fully valid censure all the proceedings of that same synod, except what had therein been done in the cause of Gregory, bishop of Antioch, of venerable memory; taking him to task with most severe rebuke, and warning him to abstain from that new and temerarious name of superstition; even so as to forbid his deacon to go in procession with him, unless he should amend so great a wickedness… we once and again addressed the same most holy John by letter, bidding him relinquish that name of pride, and incline the elation of his heart to the humility which our Master and Lord has taught us. And having found that he paid no regard, we have not desisted, in our desire of concord, from addressing the like admonitions to our most blessed brother and fellow-priest Cyriacus, his successor. But since it is the case, as we see, now that the end of this world is near at hand, that the enemy of the human race has already appeared in his harbingers, so as to have as his precursors, through this title of pride, the very priests who ought to have opposed him by living well and humbly, I exhort and entreat that not one of you ever accept this name, that not one consent to it, that not one write it, that not one admit it wherever it may have been written, or add his subscription to it; but, as becomes ministers of Almighty God, that each keep himself from this kind of poisoned infection, and give no place to the cunning lier-in-wait, since this thing is being done to the injury and rendering asunder of the whole Church, and, as we have said, to the contemning of all of you. For if one, as he supposes, is universal bishop, it remains that you are not bishops.”

sed+him+by+living+well+and+humbly%2C+I+exhort+and+entreat+that+not+one+of+you+ever+accept+this+name%2C+that+not+one+consent+to+it%2C+that+not+one+write+it%2C+that+not+one+admit+it+wherever+it+may+have+been+written%2C+or+add+his+subscription+to+it%3B+but%2C+as+becomes+ministers+of+Almighty+God%2C+that+each+keep+himself+from+this+kind+of+poisoned+infection%2C+and+give+no+place+to+the+cunning+lier-in-wait%2C+since+this+thing+is+being+done+to+the+injury+and+rendering+asunder+of+the+whole+Church%2C+and%2C+as+we+have+said%2C+to+the+contemning+of+all+of+you.+For+if+one%2C+as+he+supposes%2C+is+universal+bishop%2C+it+remains+that+you+are+not+bishops.%E2%80%9D%0A%0A%E2%80%94+Gregory+the+Great%2C+Epistles+of%2C+bk.+9%2C+letter+68+in+NPNF2+13.18-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa4040f858a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a4040f858a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/roman-catholicism/historic-quotes-on-the-papacy-being-the-antichrist/#:~:text=We%20are%20constrained%20by%20the%20care,remains%20that%20you%20are%20not%20bishops&amp;text=We%20are%20constrained%20by%20the%20care%20of%20government&amp;text=bishop%2C%20it%20remains%20that%20you%20are%20not%20bishops" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

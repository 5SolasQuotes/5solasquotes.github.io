<blockquote><p>[Amyraldianism is] a revolt from the position maintained at the Synod of Dordt, under the guise of an explanation… When we examine the [Amyraldian] theory minutely, it will not hang together. Its advocates speak of a Universal Decree, in which God was supposed to have given Christ as a Mediator for the whole human race; and of a Special Decree, in which God, foreseeing that no one would believe in his unaided strength, was supposed to have elected some to receive the gift of faith. Unquestionably it differs form the Arminian positions in this respect, that the faith was not referred to man’s free will, but was supposed to be derived form God’s free grace. The theory acknowledged the sovereign election of God, according to His good pleasure. But it laboured under the defect of supposing a double and a conflicting decree; that is, a general decree, in which he was said to will the salvation of all, and a special decree, in which He was said to will the salvation of the elect. To Christ also it ascribed a twofold and discordant aim, viz. to satisfy for all men, and to satisfy merely for the elect. As a reconciling system, and an incoherent one, it aimed to harmonize the passages of Scripture, which at one time seem to extend Christ’s merits to the world, and at another to limit them to the church; not to mention that God is supposed to be disappointed in His purpose</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fbf177cc5d" data-kw="">
<blockquote><p>The Confession, therefore, must be regarded as teaching, that it is not true of any but the elect only that they are redeemed by Christ, any more than it is true that any others are called, justified, or saved. Here I may remark by the way, that though many modern defenders of a universal atonement regard the word redemption as including the application as well as the impetration of pardon and reconciliation, — and, in this sense, disclaim the doctrine of universal redemption, — yet a different phraseology was commonly used in theological discussions about the period at which the Confession was prepared, and in the seventeenth century generally. Then the defenders of a universal atonement generally maintained, without any hesitation, the doctrine of universal redemption, — using the word, of course, to describe only the impetration, and not the application, of spiritual and saving blessings; and this holds true, both of those who admitted, and of those who denied, the Calvinistic doctrine of election. Of the first of these cases (the Calvinists) we have an instance in Richard Baxter’s work, which he entitled Universal Redemption of Mankind by the Lord Jesus Christ; and of the second (the Arminians) in Dr. Isaac Barrow’s sermons, entitled The Doctrine of Universal Redemption Asserted and Explained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Historical Theology</cite>, pp. 325-31 of Historical Theology (Edinburgh: T&amp;T Clark, 1863), vol. 2, p. 327</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

al-universalism/#:~:text=The%20Confession%2C%20therefore%2C%20must%20be%20regarded,of%20Universal%20Redemption%20Asserted%20and%20Explained&amp;text=The%20Confession%2C%20therefore%2C%20must%20be%20regarded%20as%20teaching&amp;text=The%20Doctrine%20of%20Universal%20Redemption%20Asserted%20and%20Explained" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>VIII. We do very much differ from this opinion [of Arminians]: We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted, or that salvation was purchased for him, whom God from eternity has decreed to condem: For this were a vaine purchase. We deny that election is after the death of Christ, as for many other causes, so also because Christ in the very agony of death gave a notable proof of election in the thief, whose heart He affected, and enlightned his mind after an unutterable manner; the other thief being left and neglected. And seeing Christ does everywhere say that He died for his sheep, and for those whom his Father gave Him, He does sufficiently declare that He died for the elect.

IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1635), ch. 27, ‘How far, and in what sense Christ died for all’, pp. 226-28</span></figcaption>

</figure><figure class="quote" id="q-d33ddd19d4" data-kw="">
<blockquote><p>Amyraut, however, builds on Calvin’s argument and, indeed, claims to be interpreting and clarifying it by arguing two mercies and two wills in God where Calvin did not; in fact where Calvin had specifically stated that the will of God is one and simple, albeit with distinctions that can be observed in its revelation. Where Calvin resolved the issue of the universal call and particular election by simply declaring a resolution in the fact that, as promised, the repentant are saved, Amyraut indicated a double divine intentionality… Even if Amyraut had added, as he would do at the Synod of Alençon, that his language of two decrees was by rational distinction and intended “without any succession of Thought, or Order of Priority and Posteriority” in God, his exegesis still would differ from Calvin’s in its postulation of two divine mercies and two intentions. The exegesis of the particular text, therefore, does not fully support those who appeal to it in order to interpret Amyraut as a precise follower of Calvin… Amyraut offered his own conclusion, modifying and supplementing Calvin’s argument with a concept of two wills in God—a scholastic distinction not found in Calvin’s reading of the text and related, probably, to Amyraut’s own training under John Cameron.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Tale of Two Wills: Calvin &amp; Amyraut on Ezekiel 18:23’ in Calvin Theological Journal 44</cite>, (2009): 211-25, p. 224</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Amyraut, however, builds on Calvin’s argument and, indeed, claims to be interpreting and clarifying it by arguing two mercies and two wills in God where Calvin did not; in fact where Calvin had specifically stated that the will of God is one and simple, albeit with distinctions that can be observed in its revelation. Where Calvin resolved the issue of the universal call and particular election by simply declaring a resolution in the fact that, as promised, the repentant are saved, Amyraut indicated a double divine intentionality… Even if Amyraut had added, as he would do at the Synod of Alençon, that his language of two decrees was by rational distinction and intended “without any succession of Thought, or Order of Priority and Posteriority” in God, his exegesis still would differ from Calvin’s in its postulation of two divine mercies and two intentions. The exegesis of the particular text, therefore, does not fully support those who appeal to it in order to interpret Amyraut as a precise follower of Calvin… Amyraut offered his own conclusion, modifying and supplementing Calvin’s argument with a concept of two wills in God—a scholastic distinction not found in Calvin’s reading of the text and related, probably, to Amyraut’s own training under John Cameron.”

— Richard Muller, ‘A Tale of Two Wills: Calvin &amp; Amyraut on Ezekiel 18:23’ in Calvin Theological Journal 44 (2009): 211-25, p. 224">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAmyraut%2C+however%2C+builds+on+Calvin%E2%80%99s+argument+and%2C+indeed%2C+claims+to+be+interpreting+and+clarifying+it+by+arguing+two+mercies+and+two+wills+in+God+where+Calvin+did+not%3B+in+fact+where+Calvin+had+specifically+stated+that+the+will+of+God+is+one+and+simple%2C+albeit+with+distinctions+that+can+be+observed+in+its+revelation.+Where+Calvin+resolved+the+issue+of+the+universal+call+and+particular+election+by+simply+declaring+a+resolution+in+the+fact+that%2C+as+promised%2C+the+repentant+are+saved%2C+Amyraut+indicated+a+double+divine+intentionality%E2%80%A6+Even+if+Amyraut+had+added%2C+as+he+would+do+at+the+Synod+of+Alen%C3%A7on%2C+that+his+language+of+two+decrees+was+by+rational+distinction+and+intended+%E2%80%9Cwithout+any+succession+of+Thought%2C+or+Order+of+Priority+and+Posteriority%E2%80%9D+in+God%2C+his+exegesis+still+would+differ+from+Calvin%E2%80%99s+in+its+postulation+of+two+divine+mercies+and+two+intentions.+The+exegesis+of+the+particular+text%2C+therefore%2C+does+not+fully+support+those+who+appeal+to+it+in+order+to+interpret+Amyraut+as+a+precise+follower+of+Calvin%E2%80%A6+Amyraut+offered+his+own+conclusion%2C+modifying+and+supplementing+Calvin%E2%80%99s+argument+with+a+concept+of+two+wills+in+God%E2%80%94a+scholastic+distinction+not+found+in+Calvin%E2%80%99s+reading+of+the+text+and+related%2C+probably%2C+to+Amyraut%E2%80%99s+own+training+under+John+Cameron.%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+%E2%80%98A+Tale+of+Two+Wills%3A+Calvin+%26+Amyraut+on+Ezekiel+18%3A23%E2%80%99+in+Calvin+Theological+Journal+44+%282009%29%3A+211-25%2C+p.+224&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd33ddd19d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d33ddd19d4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-hypothetical-universalism/#:~:text=Amyraut%2C%20however%2C%20builds%20on%20Calvin%E2%80%99s%20argument,Amyraut%E2%80%99s%20own%20training%20under%20John%20Cameron&amp;text=Amyraut%2C%20however%2C%20builds%20on%20Calvin%E2%80%99s%20argument%20and%2C%20indeed&amp;text=probably%2C%20to%20Amyraut%E2%80%99s%20own%20training%20under%20John%20Cameron" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The doctrine of hypothetical universalism acted as a corrosive factor in the French Reformed Church. Tolerated at first because it was felt that an outright condemnation would lead to schism, it slowly undermined respect for the confessional standards and disrupted internal unity and cohesion… it did provide a bridge toward Arminianism and perhaps toward the Semi-Pelagian tendencies of the Church of Rome. The advantages that Amyraut had envisioned failed to materialize, and the dangers against which his opponents had warned did in fact eventuate.</p></blockquote>

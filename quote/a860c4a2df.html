<main class="wrap"><figure class="quote" id="q-a860c4a2df" data-kw="">
<blockquote><p>We are all naturally inclined to lean upon man whom we can see, rather than upon God whom we cannot see. We naturally love to lean upon the ministers of the visible Church, rather than upon the Lord Jesus Christ, the great Shepherd and High Priest, who is invisible. We need to be continually warned and set on our guard. I see this tendency to lean on man everywhere. I know no branch of the Protestant Church of Christ which does not require to be cautioned upon the point…. We all naturally love to have a pope of our own. We are far too ready to think, that because some great minister or some learned man says a thing, or because our own minister, whom we love, says a thing—that it must be right, without examining whether it is in Scripture or not. Most men dislike the trouble of thinking for themselves. They like following a leader. They are like sheep, when one goes over the hill all the rest follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Warning to the Churches, ‘The Fallibility of Ministers’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a190a878ae" data-kw="">
<blockquote><p>And though women be forbidden authoritatively to teach in the Church, 1 Tim. 2:7; 1 Cor. 14, and publicly, yet they may teach the younger women, Tit. 2:2-3, give a seasonable rebuke and counsel to men, 2 Sam. 20:16-17; 1 Sam 25:23-24, 32-33, and a woman, a sister is to labor to gain a sister, by Mt. 18, and that in a Church-way; and women, as other Church-members, are to teach, exhort, warn, according to their place, as well as men, Col. 3:16; Rom. 15:14; 1 Thess. 5:14; Heb. 3:13 &amp; 20, 25.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 260</span></figcaption>

</figure><figure class="quote" id="q-bdf86fef4e" data-kw="">
<blockquote><p>1… And the first word ‘vocation’ is taken often for God’s act of calling when it has no success, and this is called uneffectual calling. So it is used, Prov. 1:24, ‘Because I called and ye refused, I have stretched forth my hands and no man regarded; But ye have set at nought all my counsel, and would none of my reproof.’ So Isa. 65:12; Jer. 7:13, ‘I called, but ye answered not,’ and many other places: Sometimes it is taken for the act of God when it is successful; as 1 Thess. 2:12 and many more places: 2. This success itself is termed our calling in a passive sense: and it is twofold: 1. Common; when men are brought but to outward profession and common gifts; and so the word is used often. 2. Special; when men are savingly converted to Christ; The former is common effectual calling; the latter is special effectual calling: and this last is the same with conversion:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Conversion</cite>, … (London: R.W., 1657), ch. 1, sect. 3, pp. 6-7</span></figcaption>

<blockquote><p>3. We are much in the dark concerning the degree of infants’ glory: And therefore we can as little know what degree of grace is necessary to prepare them for their glory. 4. It is certain that infants before they are glorified, shall have all that grace that is prerequisite to their preparation and fruition.</p></blockquote>

</figure><figure class="quote" id="q-c19b347d3b" data-kw="">
<blockquote><p>The admission of ministers to their offices must consist in consent of the people and kirk whereto they shall be appointed, and in approbation of the learned ministers appointed for their examination. … Other ceremony than the public approbation of the people, and declaration of the chief minister, that the person there presented is appointed to serve that kirk, we cannot approve; for albeit the apostles used the imposition of hands, yet seeing the miracle is ceased, the using of the ceremony we judge is not necessary.</p></blockquote>

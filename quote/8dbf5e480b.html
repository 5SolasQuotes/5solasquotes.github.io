<main class="wrap"><figure class="quote" id="q-8dbf5e480b" data-kw="">
<blockquote><p>It frequently happens that God takes good men out of this world, when he intends to punish severely the iniquities of the ungodly; for the Lord, having a peculiar regard to his own people, takes compassion upon them, and, as it were, snatches them from the burning, that even survivors may perceive in it the wrath of God. And yet this is not an invariable rule; for righteous men are frequently involved, along with the reprobate, in temporal punishments; but it is so frequent that it rarely happens otherwise.

In our own times a remarkable instance of this was given in the death of Luther, who was snatched from the world a short time before that terrible calamity befell Germany, which he had foretold many years before, when he exclaimed loudly against that contempt of the Gospel, and that wickedness and licentiousness which everywhere prevailed. Frequently had he entreated the Lord to call him out of this life before he beheld that dreadful punishment, the anticipation of which filled him with trembling and horror. And he obtained it from the Lord. Soon after his death, lo, a sudden and unforeseen war sprang up, by which Germany was terribly afflicted, when nothing was farther from her thoughts than the dread of such a calamity.

Instances of this kind occur every day; and if men observed them, they would not so heedlessly flatter themselves and their vices. But I thought it right to take special notice of this event, both because it happened lately, and because in so distinguished a preacher of the Gospel and prophet of God it must be more clearly seen. We ought, therefore, to consider diligently the worlds of the Lord, both in the life and in the death of “the righteous,” but especially in their death, by which the Lord calls them away to a better life, that they may be rescued from those afflictions in which the wicked must be plunged.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Fourth</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 8a: 196-97.</span></figcaption>

<blockquote><p>He takes it unkindly that I will not stand to the English Translation of the word κρίμα, damnation, but rather translate it so, They that resist shall receive to themselves judgement.

To which I say, that I do not deny but grant that the Word may be translated Damnation: but seeing the word firstly signifies Judgement, as Piscator observes; I would not have the Dr. so peremptory, scaring people with the word damnation, when as more naturally the word may be rendered otherwise, I told him before what Piscator’s reason is, for the translating of it Judgement, he may read what Musculus also said, and in him what many other Divines, who speaks thus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved</cite>, (London: Ben. Allen, 1643), pp 38-39.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/the-civil-magistrate.html">The Civil Magistrate</a></span></div>

</figure><figure class="quote" id="q-af1a6a0b75" data-kw="">
<blockquote><p>Who would think there were any evil in forcing of virginity, chastity, or single life? He that is unmarried, careth for the things of the Lord, how he may please the Lord, that he may be holy, both in body and also in spirit: would God it were so with all that have taken the profession of single life: but the colour is fair. Hence hath it grown, that bishops and priests, and young men and maidens, have continued single. This seemed strange, and a miracle, and a matter of great holiness.

But this is a mystery; this is a way to bring in antichrist. Mark what St. Paul speaketh hereof (1 Tim. iv): “They shall forbid to marry.” Of whom speaketh he? of antichrist and his disciples, they shall forbid lawful marriage, as unholy, and as a state of life unfit for their holiness. Yet Christ Jesus, the Son of God, did never forbid it: his Apostles were married, and had wives.

“This (saith St. Paul) is a mark of antichrist, by this shall he be known.” Forbidding of marriage is a doctrine of devils; not of Christ, or of God, but of devils. It is a gulf, it is a sea, it is a world, it is a hell of iniquity, and the vilest villainy that ever crept into the church of God. Jerome expounding the words of Daniel (chap.vii.), “He shall have no regard to the desires of women,” saith, “The better exposition hereof is, to apply these words to antichrist, for that he shall pretend chastity, that he may deceive many.” This is the mystery of iniquity. This is the practice of antichrist: he shall come with a cloak of counterfeited chastity, not with true chastity, both in body and also in spirit; but with counterfeit chastity, and so shall deceive the hearts of many.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-jewel.html">John Jewel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the Two Epistles of the Apostle St. Paul to the Thessalonians</cite>, (1584; London: John Hatchard, 1811), pp 216-17.</span></figcaption>

</figure><figure class="quote" id="q-899ec16a4d" data-kw="">
<blockquote><p>Yet we must remember, that this restriction [against eating blood] was part of the old law. Wherefore, what Tertullian relates, that in his time it was unlawful among Christians to taste the blood of cattle, savours of superstition. For the apostles, in commanding the Gentiles to observe this rite, for a short time, did not intend to inject a scruple into their consciences, but only to prevent the liberty which was otherwise sacred, from proving an occasion of offense to the ignorant and the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Genesis</cite>, 9:4</span></figcaption>

<blockquote><p>Can there be any more willing to help us than Christ? whose whole head was sick, and whose heart was heavy for our sakes? yea, in whose body, from the sole of the foot to the crown of the head, was nothing but wounds and swellings, and sores? but alas this was nothing to that He suffered for our sakes. He was compassed about with fears and horrors, till his sweat was drops of blood, and his bones bruised in the flesh: he was whipped, and scourged, and chastised with sorrows, till He cried out in the bitterness of his soul: ‘O Lord, if it be possible let this cup pass from Me.’ The heavy hand of God was so grievous upon Him, that it bruised his very bones and rent his reigns asunder: he could find no health in his flesh, but was wounded, yea, wounded to the death, even the most bitter death upon the cross. His tender fingers were nailed to the cross, his face was wrinkled with weeping and wailing, his sides embrued and gored with his own blood. spurting and gushing fresh from his ribs, the shadow of death was upon his eyes. O what grief could be like to this, or what condemnation could be so heavy, since there was no wickedness in his hands? since He was the brightness of his father’s glory, and the son of righteousness that shined in the world: as to see his days at an end, to see such throbing, sighs, and careful thoughts (without cause of his) so deeply engraven in the tables of his breast. But was this all? No my brethren, since his excellency was such above all creatures, that the world was not worthy to give Him breath, it was a greater grief unto Him, to see Himself made a worm and not a man, a shame of men, and contempt of the people; to see his life shut up in shame and reproaches, how could it but shake his bones out of joint, and make his heart melt in midst of his bowels: who was ever so full of woe? and whoever been brought so low into the dust of death? upon whom did the malice of Satan ever get so great a conquest? This though it were exceeding, yet it was not all, no, it was but a taste of grief in comparison of the rest: behold therefore (if your watery eyes will suffer ye to behold) the depth of all miseries yet behind: the sin that he hated he must take upon his own body, and bear the wrath of his Father poured out against it. This is the fullness of all pains that compassed Him round about, which no tongue is able to utter, nor heart conceive: the anger of the father burneth in Him, even to the bottom of hell, and deep sink of confusion: it wrapped Him in the chains of eternal death: it crucified Him, and threw Him down into the bottomless pit of calamity, and made his soul by weeping and wailing to melt into these bitter tears trickling from his eyes: “O God my God, why hast Thou forsaken Me?</p></blockquote>

reat a conquest? This though it were exceeding, yet it was not all, no, it was but a taste of grief in comparison of the rest: behold therefore (if your watery eyes will suffer ye to behold) the depth of all miseries yet behind: the sin that he hated he must take upon his own body, and bear the wrath of his Father poured out against it. This is the fullness of all pains that compassed Him round about, which no tongue is able to utter, nor heart conceive: the anger of the father burneth in Him, even to the bottom of hell, and deep sink of confusion: it wrapped Him in the chains of eternal death: it crucified Him, and threw Him down into the bottomless pit of calamity, and made his soul by weeping and wailing to melt into these bitter tears trickling from his eyes: “O God my God, why hast Thou forsaken Me?”

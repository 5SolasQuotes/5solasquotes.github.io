</figure><figure class="quote" id="q-a937edf31a" data-kw="">
<blockquote><p>But we can hardly say the physical fact of the genetic uniqueness of human fetal tissue is the basis of all the anxious inquiry, for the same uniqueness prevails in the animal world…. …when the fetus becomes a human being… the “breath of life” and the “blood which is the life” are applicable to animals as well as men. The biblical description of man’s distinctive creation “in the divine image” refers to a quality of life that, though it depends upon breath and blood, is not equated with them… although Augustine and Thomas condemned deliberate interference with the life of the fetus, they considered it homicide only when the fetus was possessed of a human soul.</p></blockquote>

</figure><figure class="quote" id="q-c459073e43" data-kw="">
<blockquote><p>If by birth control is meant that married couples should use their common sense in spacing births–that with pure and unselfish motives they should strive not to beget children when their physical, financial and other circumstances do not warrant it–we whole heartedly agree that it is permissible. Indeed it is an offence against God, against their offspring and against themselves, if a couple continue to bring forth children when their circumstances do not justify it. When, however, birth control is practiced for selfish reasons and with false motives, it is to be strongly opposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/norval-geldenhuys.html">Norval Geldenhuys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 5, ‘Birth Control’ in The Intimate Life, or the Christian’s Sex-Life… (Eerdmans, 1957), pp. 48-88, p. 48</span></figcaption>

</figure><figure class="quote" id="q-cd6d2ebebc" data-kw="">
<blockquote><p>The same command of fruitfulness that was given to man was also given to the land (Gen. 1:11-12; Psalm 107:37; Ezek. 36:29) and was called a blessing (Deut. 7:13; Ezek. 36:19). Is failing to make the land be fruitful every year a “despising of God’s blessings” or a violation of His Dominion Command? Obviously not. The land has been fruitful for six years, and taking a year off (spacing) in no way violates the command. If spacing crops does not violate the identical command to be fruitful and multiply, I fail to see how spacing children (whether by six months, 12 months, or more) violates that command. This is using the analogy of Scripture to understand the command to be fruitful and multiply… the [Levitical] law allowed the land to rest one year in seven… If the woman ‘who has many children has become feeble’ (1 Sam. 2:5), it might be time to let her strengthen… the burden of proof is upon those who say spacing babies is a sin… is it sinful to take days off beyond the Sabbath day in our yearly schedules?… What makes giving a very productive wife some rest from child-bearing a sin? Could this not justify spacing babies by one year or more to provide for the wife’s strength and health, and/or to save up money to be able to pay for the delivery costs of the next baby? Could it not be used to postpone having a child while the wife’s health was in jeopardy? If a woman was having chemotherapy for cancer, the chemo would endanger the baby’s life. This would certainly be a good time to exercise conception control.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/phillip-kayser.html">Phillip Kayser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Conception Control: Avoiding Antinomianism &amp; Legalism’</cite>, (2017)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

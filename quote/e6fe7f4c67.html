<blockquote><p>XXXII… 2. The Gospel differs from the Law because the Law is known to us by nature since it is engraved in the minds of humans through creation, even if no other revelation is added. Romans 2:14-15 states, “For when Gentiles, who do not have the law, by nature do what the law requires, they are a law to themselves, even though they do not have the law. They show that the work of the law is written on their hearts.</p></blockquote>

<blockquote><p>§6. The reasons of this are obvious and clear. Even because it is the office of the governors to determine of such circumstances: It is the pastor’s office to guide and oversee the flock. And so the determining of time and place of worship (that’s undetermined) belongs to his office: and the choice of the subject on which he shall preach, the leading them in prayer and praise, and choice of versions, translations and other ordinary helps in his work. And therefore when he determines these, he is but in his own way and does but his own work: and therefore he is therein the judge, if the case be controvertible. If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied. We are sure that God has commanded us to obey them that are over us in the Lord (1 Thess. 5:12; Heb. 13:7, 17, etc.), and therefore a certain duty may not be forborn upon uncertain conjectures, or upon every miscarriage in them that we owe it to. This would unchurch all Churches (as they are political societies). For if pastors be taken down, and the work of pastors, the Church is taken down; and if government and obedience be taken down, then pastors and their work is taken down, which will be the fruit of this disorder.</p></blockquote>

<blockquote><p>I conceive, though the State make a positive law, for order’s cause, that the king ordinarily convene parliaments; yet, if we dispute the matter in the court of conscience, the [parliamentary] estates have intrinsically (because they are the estates, and essentially judges of the land) ordinary power to convene themselves.</p></blockquote>

<blockquote><p>Now then, so many ways and no more as a thing may be known to come from God with an intention to oblige all perpetually, a thing may be said to be of an unalterable divine right; and those can be no more than these two: either by the Law of Nature, or by some positive Law of God. Nothing else can bind universally and perpetually but one of these two, or by virtue of them, as shall be made appear. I begin with the Law of Nature. The Law of Nature binds indispensably, as it depends not upon any arbitrary constitutions, but is founded upon the intrinsical nature of good and evil in the things themselves, antecedently to any positive declaration of God’s will. So that till the nature of good and evil be changed, that Law is unalterable as to its obligation. When I say the Law of Nature is indispensable, my meaning is, that in those things which immediately flow from that Law by way of precept, as the three first Commands of the Moral Law, no man can by any positive law be exempted from his obligation to do them, neither by any abrogation of the laws themselves, nor by derogation from them, nor interpretation of them, nor change in the object, matter, or circumstance whatsoever it be. Now although the formal reason of man’s obedience to the precepts of this Law be the conformity which the things commanded have to the divine nature and goodness, yet I conceive the efficient cause of man’s obligation to these things is to be fetched from the will, command and pleasure of God: Not as it is taken for an arbitrary positive will, but as it is executive of divine purposes, and as it engraves such a Law upon the hearts of men. For notwithstanding man’s reason, considered in itself, be the chiefest instrument of discovery what are these necessary duties of human nature (in which sense Aristotle defines a natural law to be that which [Greek] has everywhere the same force and strength (Ethics, bk. 5, ch. 10), i.e. as Andronicus Rhodius very well interprets it, [Greek], among all that have the free use of their reason and faculties), yet I say it is not bare reason which binds men to the doing of those things commanded in that Law, but as it is expressive of an eternal Law, and deduces its obligation from thence. And so this Law, if we respect the rise, extent and immutability of it, may be called deservedly the Law of Nature (V. Selden, De jure Nat. apud▪ Ebrae, bk. 1, ch. 7-8); but if we look at the emanation, efflux and original of it, it is a divine Law, and so it is called by Molina, Alphonsus à Castr••, and others (Mol., De Just et Jur., p. 1, Disputation 3; Alphons., De leg. pur▪, bk. 2, ch. 14). For the sanction of this Law of Nature, as well as others, depends upon the will of God, and therefore the obligation must come from Him, it being in the power of no other to punish for the breach of a law, but those who had the legislative power to cause the obligation to it. It appears then from hence that whatever by just consequence can be deduced from the preceptive Law of Nature, is of divine right, because from the very nature of that Law (it being indispensable), it appears that God had an intent to oblige all persons in the world by it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-stillingfleet.html">Edward Stillingfleet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Irenicum: a Weapon-Salve for the Church’s Wounds, or the Divine-Right of Particular Forms of Church-Government: Discussed &amp; Examined according to the Principles of the Law of Nature, the Positive Laws of God… (London: Mortlock, 1662), pt. 1, ch. 1</cite>, pp. 14-15</span></figcaption>

utive+of+divine+purposes%2C+and+as+it+engraves+such+a+Law+upon+the+hearts+of+men.+For+notwithstanding+man%E2%80%99s+reason%2C+considered+in+itself%2C+be+the+chiefest+instrument+of+discovery+what+are+these+necessary+duties+of+human+nature+%28in+which+sense+Aristotle+defines+a+natural+law+to+be+that+which+%5BGreek%5D+has+everywhere+the+same+force+and+strength+%28Ethics%2C+bk.+5%2C+ch.+10%29%2C+i.e.+as+Andronicus+Rhodius+very+well+interprets+it%2C+%5BGreek%5D%2C+among+all+that+have+the+free+use+of+their+reason+and+faculties%29%2C+yet+I+say+it+is+not+bare+reason+which+binds+men+to+the+doing+of+those+things+commanded+in+that+Law%2C+but+as+it+is+expressive+of+an+eternal+Law%2C+and+deduces+its+obligation+from+thence.+And+so+this+Law%2C+if+we+respect+the+rise%2C+extent+and+immutability+of+it%2C+may+be+called+deservedly+the+Law+of+Nature+%28V.+Selden%2C+De+jure+Nat.+apud%E2%96%AA+Ebrae%2C+bk.+1%2C+ch.+7-8%29%3B+but+if+we+look+at+the+emanation%2C+efflux+and+original+of+it%2C+it+is+a+divine+Law%2C+and+so+it+is+called+by+Molina%2C+Alphonsus+%C3%A0+Castr%E2%80%A2%E2%80%A2%2C+and+others+%28Mol.%2C+De+Just+et+Jur.%2C+p.+1%2C+Disputation+3%3B+Alphons.%2C+De+leg.+pur%E2%96%AA%2C+bk.+2%2C+ch.+14%29.+For+the+sanction+of+this+Law+of+Nature%2C+as+well+as+others%2C+depends+upon+the+will+of+God%2C+and+therefore+the+obligation+must+come+from+Him%2C+it+being+in+the+power+of+no+other+to+punish+for+the+breach+of+a+law%2C+but+those+who+had+the+legislative+power+to+cause+the+obligation+to+it.+It+appears+then+from+hence+that+whatever+by+just+consequence+can+be+deduced+from+the+preceptive+Law+of+Nature%2C+is+of+divine+right%2C+because+from+the+very+nature+of+that+Law+%28it+being+indispensable%29%2C+it+appears+that+God+had+an+intent+to+oblige+all+persons+in+the+world+by+it.%E2%80%9D%0A%0A%E2%80%94+Edward+Stillingfleet%2C+Irenicum%3A+a+Weapon-Salve+for+the+Church%E2%80%99s+Wounds%2C+or+the+Divine-Right+of+Particular+Forms+of+Church-Government%3A+Discussed+%26+Examined+according+to+the+Principles+of+the+Law+of+Nature%2C+the+Positive+Laws+of+God%E2%80%A6+%28London%3A+Mortlock%2C+1662%29%2C+pt.+1%2C+ch.+1%2C+pp.+14-15&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe4f583aece.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e4f583aece.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/natural-law/#:~:text=Now%20then%2C%20so%20many%20ways%20and,persons%20in%20the%20world%20by%20it&amp;text=Now%20then%2C%20so%20many%20ways%20and%20no%20more&amp;text=oblige%20all%20persons%20in%20the%20world%20by%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>This consideration may be very useful: For it may first serve to be a cure of two great ills in this land: One is of such as conceive that the Law of God, belongs not to Christians; They may as well say that common and natural equity belongs not to Christians. Is it not written in the heart of man by nature? Is it not confirmed by Jesus Christ? Is it not recommended to Christians by the apostles? Is it not established by faith? Is not the observing of it, a testimony of our communion with God? Is not the end of it love from a pure heart, a good conscience, and faith unfeigned? Is it thankfulness to God, because we are delivered from the condemnation, coaction [compulsory force], and rigor of the Law, not to acknowledge the obligation of the Law? Shall not the domestics of the house of God observe the commandments of God, or shall they not be grieved when they transgress and observe them not?</p></blockquote>

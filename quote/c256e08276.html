<main class="wrap"><figure class="quote" id="q-c256e08276" data-kw="">
<blockquote><p>We [nonconformists] never held it unlawful to join with a Church or minister that has some faults, both personal and in their acts of worship, as if all that joined were guilty of all the faults there committed: No not though we knew before hand that some false doctrine would be uttered or fault committed: Else we must separate from all the world, and all [people must separate] from us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Nonconformity as under King Charles II &amp; King James II Truly Stated &amp; Argued</cite>, (London, 1689), ch. 2, p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-f034a947f8" data-kw="">
<blockquote><p>V. 11. Where it is told David that in respect he intended to build a house to God, the Lord likewise should make him a house. We see that the Lord will not suffer the good and laudable intentions of the godly to be unrewarded: much more their pious and commendable actions, no, not a cup of cold water given to one of his, which shall want its reward. Which should be a great encouragement to pious and good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-guild.html">William Guild</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Throne of David, or an Exposition of the Second of Samuel</cite>, (d. 1657; Oxford, 1659), on ch. 7:1-18, p. 131</span></figcaption>

</figure><figure class="quote" id="q-9289b6c64d" data-kw="">
<blockquote><p>In a word, God has bound all his ministers to use all their gifts to the churches’ greatest edification: But to use a more defective form, with liberty to use my best gifts also, and to exercise my ministry publicly to all, is more to the churches’ edification than to use my own gifts only a few days in a corner and then to lie in prison and use them no more. Though no man must of choice prefer the less congruous before the more congruous, when he is free (which I confess is a sin), yet it is a duty to prefer a less congruous order before none, or before a better for a day with a restraint of that and all our ministry hereafter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 32, p. 186</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-a79e38bdde" data-kw="">
<blockquote><p>If head-coverings were by a sovereign, positive, religious appointment, Paul might be expected to condemn their misuse as disobedience, lawlessness, a transgression, sin, iniquity or idolatry, possibly on par with… Saul’s religious treason (1 Sam. 15), Nadab and Abihu’s debacle (Lev. 10) or some of the Colossians’ and Galatians’ will-worship (Col. 2:16–23; Gal. 4:8–11). Instead his language is far different: Paul speaks of dishonor ([1 Cor. 11] v. 4), shame (vv. 6, 14), custom (v. 16), comeliness (v. 13), glory (v. 15) (also “becometh” in 1 Tim. 2:9–10), appeals for persons to judge within themselves (v. 13), and speaks of disagreements herein involving contention (v. 16). Peter associates women’s modest hair with an “ornament” and being “chaste” (1 Pet. 3:2–4). All these factors are common to nature’s light and society, arising therefrom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1 Corinthians – Head Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022), pt. 1, ch. 5, ‘1 Corinthians 11’, ‘A Matter of Decorum, Not Necessarily Sin’, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“If head-coverings were by a sovereign, positive, religious appointment, Paul might be expected to condemn their misuse as disobedience, lawlessness, a transgression, sin, iniquity or idolatry, possibly on par with… Saul’s religious treason (1 Sam. 15), Nadab and Abihu’s debacle (Lev. 10) or some of the Colossians’ and Galatians’ will-worship (Col. 2:16–23; Gal. 4:8–11). Instead his language is far different: Paul speaks of dishonor ([1 Cor. 11] v. 4), shame (vv. 6, 14), custom (v. 16), comeliness (v. 13), glory (v. 15) (also “becometh” in 1 Tim. 2:9–10), appeals for persons to judge within themselves (v. 13), and speaks of disagreements herein involving contention (v. 16). Peter associates women’s modest hair with an “ornament” and being “chaste” (1 Pet. 3:2–4). All these factors are common to nature’s light and society, arising therefrom.”

— Travis Fentiman, 1 Corinthians – Head Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022), pt. 1, ch. 5, ‘1 Corinthians 11’, ‘A Matter of Decorum, Not Necessarily Sin’, p. 59">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+head-coverings+were+by+a+sovereign%2C+positive%2C+religious+appointment%2C+Paul+might+be+expected+to+condemn+their+misuse+as+disobedience%2C+lawlessness%2C+a+transgression%2C+sin%2C+iniquity+or+idolatry%2C+possibly+on+par+with%E2%80%A6+Saul%E2%80%99s+religious+treason+%281+Sam.+15%29%2C+Nadab+and+Abihu%E2%80%99s+debacle+%28Lev.+10%29+or+some+of+the+Colossians%E2%80%99+and+Galatians%E2%80%99+will-worship+%28Col.+2%3A16%E2%80%9323%3B+Gal.+4%3A8%E2%80%9311%29.+Instead+his+language+is+far+different%3A+Paul+speaks+of+dishonor+%28%5B1+Cor.+11%5D+v.+4%29%2C+shame+%28vv.+6%2C+14%29%2C+custom+%28v.+16%29%2C+comeliness+%28v.+13%29%2C+glory+%28v.+15%29+%28also+%E2%80%9Cbecometh%E2%80%9D+in+1+Tim.+2%3A9%E2%80%9310%29%2C+appeals+for+persons+to+judge+within+themselves+%28v.+13%29%2C+and+speaks+of+disagreements+herein+involving+contention+%28v.+16%29.+Peter+associates+women%E2%80%99s+modest+hair+with+an+%E2%80%9Cornament%E2%80%9D+and+being+%E2%80%9Cchaste%E2%80%9D+%281+Pet.+3%3A2%E2%80%934%29.+All+these+factors+are+common+to+nature%E2%80%99s+light+and+society%2C+arising+therefrom.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+1+Corinthians+%E2%80%93+Head+Coverings+are+Not+Perpetual+%26+they+were+Hair-Buns%2C+with+or+without+Material%3A+Proven+%28RBO%2C+2022%29%2C+pt.+1%2C+ch.+5%2C+%E2%80%981+Corinthians+11%E2%80%99%2C+%E2%80%98A+Matter+of+Decorum%2C+Not+Necessarily+Sin%E2%80%99%2C+p.+59&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa79e38bdde.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a79e38bdde.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=If%20head%2Dcoverings%

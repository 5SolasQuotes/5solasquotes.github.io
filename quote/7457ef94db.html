<blockquote><p>1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law.

2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it.

3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.</p></blockquote>

<blockquote><p>1. Christ is a doer and fulfiller of the covenant of works most exactly in all points, both the command, and the curse and penalty of the Covenant, is satisfied by him; this is works, and this was the condition required upon his part, Heb. 10. 7, “Then said I, lo I come, in the volume of the book it is written of me, to do your will, O God.” Gal. 3. 13, “Christ has redeemed us from the curse of the Law, being made a curse for us.”

2. Christ as a doer and obedient fulfiller of the Law, has a reward in justice by the promise of this covenant: For (I humbly conceive) he had his reward of debt, and merit, having paid a condign price to the justice of God; therefore his reward is due to him, by commutative Justice, Phil. 2. 7, 8, “But made himself of no reputation, and took upon him the form of a servant, and was made in the likeness of man; And being found in fashion as a man, he humbled himself, and became obedient unto death, even the death of the Cross; wherefore God also hath highly exalted him,” and is craved by him, Joh. 17. 4, 5, “I have glorified you on earth, I have finished the work which you gaves me to do. And now, O Father, glorify me with your own self.</p></blockquote>

<blockquote><p>Man, on the other hand, whose nature was to be a mean between the angelic and bestial, [God] created in such sort, that if he remained in subjection to His Creator as his rightful Lord, and piously kept His commandments, he should pass into the company of the angels; and obtain, without the intervention of death, a blessed and endless immortality.</p></blockquote>

</figure><figure class="quote" id="q-02da253815" data-kw="">
<blockquote><p>1. This covenant, called “the old covenant,” was never intended to be of itself the absolute rule and law of life and salvation unto the church, but was made with a particular design, and with respect unto particular ends. This the apostle proves undeniably in this epistle, especially in the chapter foregoing, and those two that follow. Hence it follows that it could abrogate or disannul nothing which God at any time before had given as a general rule unto the church. For that which is particular cannot abrogate any thing that was general, and before it; as that which is general doth abrogate all antecedent particulars, as the new covenant doth abrogate the old. And this we must consider in both the instances belonging hereunto. For,— (1.) God had before given the covenant of works, or perfect obedience, unto all mankind, in the law of creation. But this covenant at Sinai did not abrogate or disannul that covenant, nor any way fulfil it. And the reason is, because it was never intended to come in the place or room thereof, as a covenant, containing an entire rule of all the faith and obedience of the whole church. God did not intend in it to abrogate the covenant of works, and to substitute this in the place thereof; yea, in sundry things it re-enforced, established, and confirmed that covenant. For,— [1.] It revived, declared, and expressed all the commands of that covenant in the decalogue; for that is nothing but a divine summary of the law written in the heart of man at his creation. And herein the dreadful manner of its delivery or promulgation, with its writing in tables of stone, is also to be considered; for in them the nature of that first covenant, with its inexorableness as unto perfect obedience, was represented. And because none could answer its demands, or comply with it therein, it was called “the ministration of death,” causing fear and bondage, 2 Cor. 3:7. [2.] It revived the sanction of the first covenant, in the curse or sentence of death which it denounced against all transgressors. Death was the penalty of the transgression of the first covenant: “In the day that thou eatest, thou shalt die the death.” And this sentence was revived and represented anew in the curse wherewith this covenant was ratified, “Cursed be he that confirmeth not all the words of this law to do them,” Deut. 27:26; Gal. 3:10. For the design of God in it was to bind a sense of that curse on the consciences of men, until He came by whom it was taken away, as the apostle declares, Gal. 3:19. [3.] It revived the promise of that covenant,—that of eternal life upon perfect obedience. So the apostle tells us that Moses thus describeth the righteousness of the law, “That the man which doeth those things shall live by them,” Rom. 10:5; as he doth, Lev. 18:5. Now this is no other but the covenant of works revived. Nor had this covenant of Sinai any promise of eternal life annexed unto it, as such, but only the promise inseparable from the covenant of works which it revived, saying, “Do this, and live.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 23.77–78.</span></figcaption>

enant-of-works/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-79a18339a4" data-kw="">
<blockquote><p>Once more, are true believers delivered from the commanding, condemning, and irritating power of the law as a covenant? Let them then, amid all their trials and all their conflicts with spiritual enemies, be of good comfort. Oh, let them rejoice exceedingly in that almighty, compassionate, dear Redeemer who, in His love and pity, has redeemed them from the dominion and curse of the broken law (Gal. 3:13). You, O believer, have become dead to the law by the body of Christ and are married to another husband, even to Him who is raised from the dead, that you may bring forth fruit unto God (Rom. 7:4). You are dead to the law of works; nevertheless, you live. You live to God as your own God, your covenant God, and you serve Him in newness of spirit. In union with your living Redeemer, who loved you and gave Himself for you, you live a life of justification, and consequently, it is your privilege as well as your duty to live a life of sanctification and consolation. Being justified by faith, you have peace with God through our Lord Jesus Christ and, in some measure, peace of conscience. If then the law as a covenant of works should at any time enter your conscience again and require perfect obedience from you as the ground of your title to eternal life, saying, “This do, and thou shalt live” (Luke 10:28), present to it, in the hand of faith, the perfect obedience of your divine Surety in answer to that demand. And as often as the law in your conscience repeats the high demand, renew your application of His consummate obedience and trust firmly that it was performed for you in order to entitle you to eternal life. The righteous law, magnified and made honorable by that meritorious obedience, will, in proportion as you do so, cease to disturb the peace of your conscience. The spotless obedience of the second Adam is, as was observed above, the only obedience that you should present to the law as a covenant of works; and your own personal obedience is the only obedience that you ought to exhibit to it as a rule of life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 223–24.</span></figcaption>

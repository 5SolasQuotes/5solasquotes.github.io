tivities+of+the+Federal+Government+constitute+a+question+with+which+I+am+not+now+attempting+to+deal.+I+have+tried+to+observe%2C+in+the+sphere+of+education%2C+the+results+of+the+present+tendency+towardstandardization%2C+and+I+think+those+results+are+lamentable.+I+think+we+are+having+to-+day+a+very+marked+intellectual+as+well+as+moral+decline+through+the+gradual+extension+of+this+principle+of+standardization+in+education.+People+are+ready+to+admit+to+some+extent+that+there+is+a+sort+of+moral+decline%2C+but+what+is+not+always+observed+is+that+there+is+a+terrible+intellectual+decline%2C+and+that+intellectual+decline+comes+through+the+development+of+this+principle+of+unification+and+standardization+to+which+I+object%3B+for+I+think+that+in+the+sphere+of+education+uniformity+always+means+not+something+uniformly+high+but+something+uniformly+low.+MR.+HOLADAY%3A+Doctor%2C+I+understood+you+to+say+that+in+your+opinion+the+public+schools+have+already+gone+too+far+in+moral+teaching.+I+should+like+a+little+further+information+about+your+ideas+on+that+question.+DR.+MACHEN%3A+I+am+not+sufficiently+familiar+with+the+actual+working+out+of+these+proposals+in+detail%3B+but+I+am+opposed+in+general+to+the+morality+codes+which+have+been+proposed+here+in+Washington%2C+for+example%2C+which+represent+morality+as+the+result+of+human+experience%2C+and+so+seem+to+me+to+undermine+the+very+basis+of+morality+and+to+be+producing+moral+decline.+My+position+with+regard+to+moral+and+religious+training+in+its+connection+with+the+State+is+rather+simple.+I+think+it+is+a+very+good+thing+if+the+public+schools+release+children+at+convenient+hours+during+the+week+for+religious+training%2C+but+I+am+absolutely+opposed+to+any+granting+of+school+credit+for+work+done+in+those+hours%2C+to+the+slightest+scrutiny+of+attendance+or+of+the+standards+of+instruction%2C+or+anything+of+the+kind%3B+and+I+hold+that+the+solution+of+our+difficulties+is+in+the+restriction+in+general+of+the+public+schools+to+their+function+of+imparting+knowledge%2C+and+the+gradual+production+in+the+minds+of+our+people+of+the+notion+that+moral+and+religious+training+is+a+responsibility+of+the+parents+and+not+of+the+State.+I+do+not+know%2C+sir%2C+whether+that+answers+your+question.+MR.+HOLADAY%3A+I+think+so.+MR.+ROBISON%3A+Mr.+Chairman%2C+I+should+like+to+ask+the+witness+a+few+questions.+What+is+the+nature+of+your+work+at+Princeton%3F+DR.+MACHEN%3A+I+am+a+professor+in+Princeton+Theological+Seminary%2C+which+is+an+institution+for+the+training+of+ministers.+MR.+ROBISON%3A+I+understand+that%2C+but+what+is+your+particular+work+in+that+institution%3F+DR.+MACHEN%3A+I+am+a+teacher+in+the+New+Testament+department.+MR.+ROBISON%3A+Have+you+ever+had+any+experience+in+teaching+in+the+public+schools%3F+DR.+MACHEN%3A+No%2C+sir.+I+have+had+an+experience+of+the+result+of+such+activities%E2%80%94a+rather+wide+experience.+MR.+ROBISON%3A+Have+you+ever+had+any+experience+in+directing+the+public-school+work+of+any+community+or+State%3F+DR.+MACHEN%3A+No%2C+sir.+MR.+ROBISON%3A+Your+fear+is+that+this+department+of+education+would+have+a+tendency+to+federalize+or+centralize+and+enslave+the+public-school+system+of+the+Nation%3F+DR.+MACHEN%3A+Yes%2C+sir.+MR.+ROBISON%3A+And+then+I+take+it%2C+as+a+logical+result+or+sequence%2C+that+you+are+opposed+to+the+present+Bureau+of+Education+in+so+far+as+it+acts+as+a+fact-finding+organization%2C+or+gives+leadership+and+stimulation%2C+or+undertakes+to+do+so%2C+to+the+public-school+work+of+the+Nation%3F+DR.+MACHEN%3A+I+am+not+entirely+prepared+to+answer+that+question+categorically+MR.+ROBISON%3A+I+mean%2C+outside+the+District+of+Columbia.+DR.+MACHEN%3A+There+are+a+good+many+functions+in+the+sphere+of+education+which+legitimately+belong+to+the+Federal+Government%3B+but+I+am+opposed+to+the+extension+of+an+agency+which+assists+the+States+and+assists+private+individuals%2C+or+a+Federal+agency+even+in+the+spheres+about+which+you+are+speaking.+MR.+ROBISON%3A+So+that+we+may+understand+each+other+and+so+that+we+may+understand+your+testimony%2C+what+spheres+do+you+think+are+properly+occupied+by+the+Federal+Government%2C+or+could+be%2C+so+far+as+its+relations+to+the+public+schools+in+the+States%2C+outside+of+the+District+of+Columbia%2C+are+concerned%3F+DR.+MACHEN%3A+I+am+inclined+to+think+that+it+would+have+been+better+if+it+had+not+entered+on+that+field+at+all.+MR.+ROBISON%3A+No%3B+you+said+you+were+in+favor+of+some+things.+I+want+to+know+what+those+things+are.+DR.+MACHEN%3A+I+mentioned+one%E2%80%94the+District+of+Columbia.+MR.+ROBISON%3A+Outside+of+the+District+make+laws+here+for+the+District+of+Columbia%2C+and+make+the+laws+of+the+Federal+Government.+DR.+MACHEN%3A+I+hate+to+speak+about+a+subject+where+I+have+not+all+of+the+facts+in+hand%2C+and+I+am+not+speaking+in+general+about+detailed+activities+of+the+Federal+Bureau+of+Education.+Until+I+am+asked+about+every+one+of+those+activities+separately+I+should+not+like+to+make+general+statements+about+them.+MR.+ROBISON%3A+But+your+statement+was%2C+if+I+understood+you%2C+that+you+thought+there+were+spheres+in+which+the+Federal+Government+could+and+should+properly+participate+in+public+education+outside+of+the+District+of+Columbia.+My+inquiry+is%2C+What+are+those+spheres%3F+What+should+it+do+properly%3F+DR.+MACHEN%3A+Well%2C+sir%2C+I+do+not+feel+that+I+can+undertake+the+rather+difficult+duty+of+mapping+a+program+for+a+Federal+agency.+I+am+speaking+only+in+opposition+to+something.+I+am+not+speaking+in+favor+of+other+things+or+mapping+out+a+legitimate+program.+MR.+ROBISON%3A+But+I+asked+that+question+because+of+your+statement+that+the+Federal+Government+had+proper+spheres+in+public+education+outside+of+the+District+of+Columbia.+I+am+merely+inquiring+what+are+those+spheres+in+your+mind%3F+DR.+MACHEN%3A+I+do+not+know+that+I+made+that+assertion%2C+sir%E2%80%94that+the+Federal+Government+has+proper+spheres+for+education+outside+of+the+District+of+Columbia.+I+am+not+saying+that+it+has+not%2C+and+I+am+not+saying+that+it+has%2C+sir.+MR.+ROBISON%3A+Then+you+have+not+made+sufficient+investigation+to+know+whether+these+activities+of+the+Bureau+of+Education+have+been+helpful+or+harmful+to+the+public+schools+of+the+Nation%3F+Is+not+that+your+position%3F+DR.+MACHEN%3A+I+think+it+is+quite+possible+that+some+of+those+activities+have+been+helpful%3B+but+I+am+opposed+to+the+increase+of+the+functions+of+this+Federal+agency+because+that+increase+is+distinctly+in+the+interest+of+a+general+aid+carried+on+by+the+Federal+Government+in+the+sphere+of+the+individual+States%2C+and+I+am+sorry+that+such+a+Federal+agency+is+already+in+existence.+I+am+sorry+that+part+of+Federal+activities+has+already+begun.+I+think+it+is+perfectly+proper+for+the+Federal+Government+to+maintain+here+in+Washington+certain+museums+and+certain+agencies+for+education+in+the+National+Capital.+I+think+a+good+many+of+those+activities+may+be+of+benefit+to+the+people+of+the+whole+country%2C+and+I+am+not+attempting+to+draw+the+line+in+any+clear+way.+MR.+ROBISON%3A+Now%2C+if+I+understand+you%2C+if+you+are+sorry+that+there+is+a+Bureau+of+Education+here+in+Washington%2C+then+it+follows+that+your+mind+tells+you+that+it+ought+to+be+abolished%3B+and+then%2C+further%2C+if+you+do+not+know+the+activities+of+the+Bureau+of+Education+here+and+its+relation+to+the+public+schools+and+public+education+of+the+country%2C+how+can+you+say+that+an+enlargement+of+this+bureau+would+be+harmful+or+helpful%3F+DR.+MACHEN%3A+I+am+opposed+to+it%2C+as+I+tried+to+explain%2C+sir%2C+in+principle.+MR.+ROBISON%3A+I+know+you+said+you+are+opposed+to+it.+DR.+MACHEN%3A+I+am+opposed+to+the+principle+of+Federal+aid%2C+and+I+am+opposed+to+the+activities+of+the+Federal+bureau+where+they+involve+the+laying+down+of+standards+of+education%E2%80%94of+certain+standards+for+colleges%2C+for+example.+I+think+that+is+an+unfortunate+thing.+I+think+it+is+very+much+better+to+have+men+who+are+engaged+in+education+examine+methods+of+education%2C+examine+standards%2C+rather+than+to+have+such+agencies+of+research+come+before+the+people+with+the+authority+of+the+Federal+Government%2C+with+the+fear+at+all+times+that+we+shall+have+an+agitation+to+compel+schools+to+maintain+those+standards.+We+have+very+frequently+the+principle+that+the+States+are+to+be+allowed+to+do+this+and+that%3B+but+if+they+do+not+maintain+certain+standards+which+have+been+laid+down+by+Federal+agencies+of+research%2C+they+should+then+be+compelled+to+do+it+by+some+sort+of+an+amendment+to+the+Constitution+or+the+like.+MR.+ROBISON%3A+I+want+you+to+point+out+what+section+of+this+bill+in+your+opinion+would+give+the+Federal+Government+control+or+direction+of+any+public+school+or%2C+for+that+matter%2C+any+private+school+in+any+State+or+community.+DR.+MACHEN%3A+This+provision+at+the+beginning+of+it-that+there+is+established+at+the+seat+of+Government+an+executive+department+to+be+known+as+the+department+of+education.+That+I+think%2C+establishes+an+extent+of+Federal+activity+in+principle+which+will+be+deleterious%2C+which+will+lead+to+a+great+many+activities+in+the+future.+If+you+have+a+Federal+department+of+education+that+has+a+place+in+the+Cabinet%2C+you+have+a+department+which+is+going+to+extend+constantly+its+activities+and+is+going+to+ask+for+more+and+more+funds.+We+have%2C+of+course%2C+an+illustration+of+this+in+the+extremely+radical+bill+which+is+now+in+Congress+which+would+extend+this+principle+of+Federal+aid+to+the+States+and+which+lays+down+the+conditions+upon+which+that+Federal+aid+is+to+be+received.+That+has+always+been+in+connection+with+this+demand+for+this+establishment+of+a+Federal+department+of+education%2C+and+I+think+it+is+in+organic+connection+with+it.+The+very+establishment+of+a+Federal+department+of+education%2C+I+think%2C+is+dangerous%2C+because+it+will+lead+to+such+measures+as+those+which+have+been+proposed+for+a+great+many+years%2C+which+provide+for+Federal+aid+on+a+large+scale.+MR.+ROBISON%3A+Do+you+believe+that+Congress+has+the+power+to+pass+any+law+that+would+give+the+Federal+Government+control+of+the+public+schools+in+any+State%3F+DR.+MACHEN%3A+I+think+the+powers+of+the+Federal+Government+in+this+respect+under+the+Constitution+may+be+doubtful%3B+but+I+think+that+there+are+indirect+ways+of+establishing+this+unification+which+are+very+effective+and+which+are+very+disastrous.+Now%2C+of+course+there+is+another+specific+portion+of+this+bill+which+provides+for+the+activities+to+which+I+object%3A+%E2%80%9CThe+department+of+education+shall+collect+such+statistics+and+facts+as+shall+show+the+condition+and+progress+of+education+in+the+several+States+and+in+foreign+countries%E2%80%94%E2%80%9D+And+so+forth.+And+then+there+is+assistance+in+devising+methods+of+operation.+In+the+revised+form+of+this+bill%2C+Senate+bill+2841%2C+we+have%2C+as+I+say%2C+the+purpose+of+such+activity+explicitly+stated+SENATOR+COPELAND%3A+Where+is+that%3F+DR.+MACHEN%3A+It+is+section+5+of+Senate+bill+2841%3A+%E2%80%9CThe+department+of+education+shall+%2A+%2A+%2A+with+the+consent+of+the+advisory+board+hereafter+mentioned%2C+attempt+developing+a+more+uniform+and+efficient+system+of+public+common-school+education.%E2%80%9D+I+am+opposed+to+a+more+uniform+system+of+public+common-school+education.+That+is+explicit+in+this+revised+form+of+the+bill%2C+and+I+think+it+is+clearly+implicit+in+the+section+to+which+I+have+referred.+MR.+ROBISON%3A+There+is+nothing+compulsory+there%2C+is+there%3F+DR.+MACHEN%3A+There+is+nothing+compulsory+in+form%2C+but+I+think+there+is+an+establishment+of+uniformity+which+has+already+gone+to+disastrous+lengths+in+this+country%2C+and+the+encouragement+of+which+I+think+is+a+very+unfortunate+thing.+The+proper+way+in+which+suggestions+as+to+educational+standards+should+come+before+the+authorities+of+schools+is+without+the+extraneous+authority+of+the+Federal+Government%2C+which%2C+because+of+the+tendency+which+has+been+operative+in+recent+years%2C+is+far+more+than+merely+advisory%3B+it+contains+all+the+time+an+implied+threat%2C+you+see%2C+and+for+that+reason+is+very+unfortunate.+SENATOR+FERRIS%3A+I+should+like+to+ask+one+question.+SENATOR+PHIPPS%3A+Certainly%2C+Senator.+SENATOR+FERRIS%3A+For+my+own+information+I+wish+to+ask+what+you+regard+as+the+basic+element+or+elements+in+moral+conduct.+Perhaps+that+is+a+foolish+question.+DR.+MACHEN%3A+The+basic+elements+in+moral+conduct%3F+SENATOR+FERRIS%3A+Yes%2C+sir.+What+is+the+basis.+I+judge+from+your+remarks+that+experience+received+minor+consideration.+DR.+MACHEN%3A+Yes%2C+sir%E2%80%94Well%2C+I+am+an+adherent+of+a+certain+religious+group.+We+have+our+definite+notion+as+to+the+basis+of+morality%2C+and+it+is+in+my+belief+altogether+a+religious+one.+I+intend+to+proclaim+that+basis+of+morality+is+the+will+of+God+as+revealed+by+God%2C+and+I+am+interested+in+the+right+of+all+others+to+maintain+that+as+the+only+basis+of+morality.+I+belong+to+what+is+often+called+a+very+strict+sect%2C+the+Presbyterian+Church%2C+but+it+is+a+sect+which+has+always+been+devoted+to+the+principles+of+liberty%3B+and+I+am+unlike+a+great+many+of+my+fellow+citizens%E2%80%94tolerance+to+me+means+not+only+tolerance+for+that+with+whichI+am+agreed%2C+but+it+means+also+tolerance+for+that+to+which+I+am+most+violently+opposed.+I+was+thoroughly+opposed%2C+for+example%2C+to+the+Lusk+laws+in+the+State+of+New+York+which+were+intended+to+bring+about+the+closing+of+the+Rand+School+in+the+city+of+New+York.+I+cannot+imagine+anything+more+harmful+than+the+Rand+School%3B+there+is+nothing+to+which+I+am+more+opposed%2C+which+I+think+more+subversive+of+morality%3B+and+yet+I+was+absolutely+opposed+to+any+such+law+as+that.+I+believe+in+liberty%2C+and%2C+therefore%2C+when+I+believe+I+have+a+right+to+proclaim+the+basis+of+morality+which+I+think+is+only+in+the+will+of+God%2C+I+also+claim+the+right+for+other+persons+to+proclaim+whatever+else+they+may+hold+with+regard+to+it.+But+to+proclaim+in+our+public+schools+that+morality+is+only+the+result+of+human+experimentation%E2%80%94%E2%80%9Dthis+is+the+conduct+which+Uncle+Sam+has+found+in+the+course+of+American+history+to+be+right%E2%80%9D%E2%80%94that%2C+I+think%2C+is+subversive+of+morality%3B+and+I+do+not+believe+that+anyone+can+encourage+moral+conduct+in+others+unless+he+has+first+in+his+own+mind+the+notion+of+an+absolute+distinction+and+not+a+merely+relative+distinction+between+right+and+wrong.+I+do+not+know+whether+that+at+all+answers+your+question.+SENATOR+FERRIS%3A+I+am+just+wondering+whether+there+is+any+such+thing+as+moral+conduct+in+the+United+States+Congress+or+among+the+citizens+of+the+United+States+apart+from+a+distinctively+religious+basis.+I+am+just+wondering+whether+the+public+schools+have+any+function+in+the+way+of+teaching+morality+which+is+not+distinctively+religious+in+its+basic+idea.+DR.+MACHEN%3A+I+think+that+the+solution+lies+not+in+a+theoretic+teaching+in+the+public+schools+as+to+the+basis+of+morality%2C+because+I+do+not+think+you+can+keep+that+free+from+religious+questions%3B+but+I+do+hold+that+a+teacher+who+himself+or+herself+is+imbued+with+the+absolute+distinction+between+right+and+wrong+can+maintain+the+moral+standing%2C+the+moral+temper+of+a+public+school.+SENATOR+FERRIS%3A+Is+the+ethical+culturist+ruled+out+from+the+consideration+of+morality+in+his+views+and+conduct%3F+DR.+MACHEN%3A+I+am+not+ruling+out+anybody+at+all%2C+sir%E2%80%94the+ethical+culturist+or+anyone+else.+SENATOR+FERRIS%3A+No%3B+but+if+religion+is+the+basic+element+in+all+morality%2C+then+can+we+have+a+morality+that+is+not+founded+on+a+religious+idea%3F+DR.+MACHEN%3A+I+myself+do+not+believe+that+you+can+have+such+a+morality+permanently%2C+and+that+is+exactly+what+I+am+interested+in+trying+to+get+other+people+to+believe%3B+but+I+am+not+at+all+interested+in+trying+to+proclaim+that+view+of+mine+by+any+measures+that+involve+compulsion%2C+and+I+am+not+interested+in+making+the+public+school+an+agency+for+the+proclamation+of+such+a+view%3B+but+I+am+interested+in+diminishing+rather+than+increasing+the+function+of+the+public+school%2C+in+order+to+leave+room+for+the+opportunity+of+a+propagation+of+the+view+that+I+hold+in+free+conflict+with+all+other+views+which+may+be+held%2C+in+order+that+in+that+way+the+truth+finally+may+prevail.+SENATOR+PHIPPS%3A+Thank+you%2C+Doctor.+%5BApplause.%5D%E2%80%9D%0A%0A%E2%80%94+J.+Gresham+Machen%2C+Testimony+before+the+Senate+Committee+on+Education+and+Labor%2C+and+the+House+Committee+on+Education%2C+February+25%2C+1926%2C+Congress+of+the+United+States%2C+Washington+D.C.+%5BSource%3A+Reformed.Org%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb81055cce0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b81055cce0.html">Permalink</a><a class="src" href="https://heidelblog.net/2017/02/machens-senate-testimony-against-the-proposed-department-of-education-1926/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<div class="actions"><button class="copy" data-copy="“6. As morality and piety, rightly grounded on evangelical principles, will give the best and greatest security to government, and will lay in the hearts of men the strongest obligations to due subjection: and as the knowledge of these, is most likely to be propagated through a society by the institution of the public worship of the Deity, and of public instruction in morality and religion: therefore, to promote those important purposes, the people of this state have a right to impower, and do hereby fully impower the legislature to authorize form time to time, the several towns, parishes, bodies-corporate, or religious societies within this state, to make adequate provision at their own expense, for the support and maintenance of public protestant teachers of piety, religion and morality:”

— New Hampshire, Constitution of New Hampshire, 1784 (Thorpe, 4.2454, 2460)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C6.+As+morality+and+piety%2C+rightly+grounded+on+evangelical+principles%2C+will+give+the+best+and+greatest+security+to+government%2C+and+will+lay+in+the+hearts+of+men+the+strongest+obligations+to+due+subjection%3A+and+as+the+knowledge+of+these%2C+is+most+likely+to+be+propagated+through+a+society+by+the+institution+of+the+public+worship+of+the+Deity%2C+and+of+public+instruction+in+morality+and+religion%3A+therefore%2C+to+promote+those+important+purposes%2C+the+people+of+this+state+have+a+right+to+impower%2C+and+do+hereby+fully+impower+the+legislature+to+authorize+form+time+to+time%2C+the+several+towns%2C+parishes%2C+bodies-corporate%2C+or+religious+societies+within+this+state%2C+to+make+adequate+provision+at+their+own+expense%2C+for+the+support+and+maintenance+of+public+protestant+teachers+of+piety%2C+religion+and+morality%3A%E2%80%9D%0A%0A%E2%80%94+New+Hampshire%2C+Constitution+of+New+Hampshire%2C+1784+%28Thorpe%2C+4.2454%2C+2460%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3b0779f7e3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3b0779f7e3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-establishment-principle-in-the-american-westminster-standards-and-early-american-states/#:~:text=6.%20As%20morality%20and%20piety%2C%20rightly,teachers%20of%20piety%2C%20religion%20and%20morality&amp;text=6.%20As%20morality%20and%20piety%2C%20rightly%20grounded%20on&amp;text=public%20protestant%20teachers%20of%20piety%2C%20religion%20and%20morality" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7b3ddb0eda" data-kw="">
<blockquote><p>We, therefore, maintain that the rational soul is infused by God into the embryo, not indeed θύραθεν ἐπεισιέναι (entering from without), as Aristotle wishes in book 2 of On the Generation of Animals, chapter 3, but is formed by God in the fetus itself and the rudiment of the human body. Scripture teaches this. For in Isa. 57:16 God speaks thus: “The spirit from my face shall clothe man, and I make the souls.” And in Zech. 12:1: “Thus says the Lord, who stretches out the heavens, and lays the foundation of the earth, and forms the spirit within him.”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Untying of Grave Questions</cite>, (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, ‘Whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ trans. AI Latin</span></figcaption>

0within%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-de76fe8313" data-kw="">
<blockquote><p>Neverthelesse, if any man think the sentence of the bshop and the presbytery given forth against him to be unjust, he ought to have liberty of recourse to the synod and there to be heard, according as it was decreed by the Fourth Council of Carthage, Canon 66. But oftimes the matter is of such difficulty or importance, that the bishop and the presbytery may not giveout an peremptory sentence of suspension or deprivation (Fenner, Theol., bk. 7, ch. 7, p. 153), till the matter be brought to the synod of the province (Hemming, Enchir., class. 3, ch. 11, pp. 390-91), where according to the ancient order the matter is to be handled, not by the censure of one bishop, but by the judgement of the whole clergy gathered together.</p></blockquote>

</figure><figure class="quote" id="q-85add7577a" data-kw="">
<blockquote><p>They have their ministerial calling, or which is all one, authority to exercise the acts of their ministerial office, from Jesus Christ, as the fountain of their spiritual power… But they have the peaceable, public exercise of their ministry in these places by the magistrate, under God. It’s the magistrate’s civil authority by which the penal statutes which rendered their preaching hazardous are removed or relaxed; by the protection of civil authority they have the peaceable exercise of their ministry, or they have freedom from molestation or disturbance while they are exercising their ministry in these places. Before the act of indulgence they had their ministerial authority and did preach upon hazard before they were indulged; but by the indulgence they had this benefit, that whereas before it they were exposed to hazard wherever they preached, whether in private or public; after it, they might preach publicly and exercise the other parts of the ministerial office, in some places, without molestation.</p></blockquote>

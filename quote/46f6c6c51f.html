<main class="wrap"><figure class="quote" id="q-46f6c6c51f" data-kw="">
<blockquote><p>…we maintain this, that properly and truly, by faith itself, we are for Christ’s sake accounted righteous, or are acceptable to God. And because ‘to be justified’ means that out of unjust men, just men are made, or born again, it means also that they are pronounced or accounted just. For Scripture speaks in both ways. [Margin note:] (The term ‘to be justified’ is used in two ways: to denote being converted or regenerated; again, being accounted righteous.]) Accordingly we wish first to show this, that faith alone makes of an unjust, a just man, i.e., receives remission of sins.</p></blockquote>

<blockquote><p>Justification is an act. It is not a work, or a series of acts. It is not progressive. The weakest believer and the strongest saint are alike equally justified. Justification admits no degrees. A man is either wholly justified or wholly condemned in the sight of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-s-plumer.html">William S. Plumer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Grace of Christ</cite>, p. 195</span></figcaption>

<blockquote><p>‘That being justified by his grace’ If we understand ‘regeneration’ in its strict and ordinary meaning, it might be thought that the apostle employs the word ‘justified’ instead of ‘regenerated;’ and this is sometimes the meaning of it, but very seldom; yet there is no necessity which constrains us to depart from its strict and more natural [forensic] signification. The design of Paul is to ascribe to the grace of God all that we are, and all that we have, so that we may not exalt ourselves proudly against others. Thus he now extols the mercy of God, by ascribing to it entirely the cause of our salvation. But because he had spoken of the vices of unbelievers, it would have been improper to leave out the grace of regeneration, which is the medicine for curing them. Still this does not prevent him from returning immediately to praise divine mercy; and he even mingles both blessings together — that our sins have been freely pardoned, and that we have been renewed so as to obey God. This, at least, is evident, that Paul maintains that “justification,” is the free gift of God; and the only question is, what he means by the word justified. The contest seems to demand that its meaning shall be extended further than to the imputation of righteousness; and in this larger sense it is seldom (as I have said) employed by Paul; yet there is nothing that hinders the meaning of it from being limited to the forgiveness of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Titus 3, v. 7</cite></span></figcaption>

<blockquote><p>6th Objection: The Messiah brings everlasting justice and righteousness. Imputed righteousness is not eternal. Therefore we are not thereby justified. Answer: It is said that Christ’s righteousness shall be an everlasting righteousness; but after a diverse manner. For in the life to come we shall be just after another manner than in this life. For although we shall then be just by the same righteousness, even by the righteousness of Christ imputed unto us: yet with this shall also the legal justice and righteousness be continued, so that then also by the legal righteousness we shall be perfectly just, because now only we are, as concerning that, but in part and beginning just. Each justice, both the justice of the Law, and the justice of the Gospel, is eternal, by continuation: And the justice and righteousness of the Gospel, that is, the justice of Christ imputed unto us, is eternal by continuation of the imputation: The justice of the Law is eternal by continuation of good works, even as it is continued by good works, first, and beginning in this life, until at length after this life it be perfected, and become perfect, and so continue to all eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered… in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’</cite>, p. 687</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

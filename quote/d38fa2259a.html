<main class="wrap"><figure class="quote" id="q-d38fa2259a" data-kw="">
<blockquote><p>Unlike many today, the Scottish Reformers saw no incongruency between church discipline and the state’s implementation of biblical penology:

Marriage once lawfully contracted, may not be dissolved at man’s pleasure, as our master Christ Jesus does witness, only [if] adultery be committed; which being sufficiently proven in presence of the Civil Magistrate, the innocent (if they so require) ought to be pronounced free, and the offender ought to suffer the death as God hath commanded. If the Civil sword foolishly spare the life of the offender, yet may not the Church be negligent in their office, which is to excommunicate the wicked, and to repute them as dead members, and to pronounce the innocent party to be at freedom, be they never so honourable before the world. If the life be spared (as it ought not to be) to the offenders, and if the fruits of repentance of long time appear the same, and if they earnestly desire to be reconciled with the Church, we judge that they may be received to participation of the Sacraments, and of the other benefits of the Church, (for we would not that the Church should hold those excommunicant whom God absolved, that is, the Penitent.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>repr in The works of John Knox, ed. David Laing</cite>, (6 vols, Edinburgh, 1856), ii, 248.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

nk">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27a50a3489" data-kw="">
<blockquote><p>To be more plain, let me be more particular. The Voluntaries mistake us, if they conceive us to be Voluntaries. We hold by the duty of Government to give of their resources and their means for the maintenance of a gospel ministry in the land; and we pray that their eyes may be opened, so that they may learn how to acquit themselves as the protectors of the Church, and not as its corrupters or its tyrants. We pray that the sin of Uzziah, into which they have fallen, may be forgiven them, and that those days of light and blessedness may speedily arrive, when “kings shall be the nursing-fathers, and queens the nursing-mothers” of our Zion.

In a word, we hold that every part and every function of a common-wealth should be leavened with Christianity, and that every functionary, from the highest to the lowest, should, in their respective spheres, do all that in them lies to countenance and uphold it. That is to say, though we quit the Establishment, we go out on the Establishment principle — we quit a vitiated Establishment, but would rejoice in returning to a pure one. To express it otherwise — we are the advocates for a national recognition and national support of religion — and we are not Voluntaries.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-chalmers.html">Thomas Chalmers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Proceedings of the General Assembly of the Free Church of Scotland; with A Sketch of the Proceedings of the Residuary Assembly. 1843, ed. John Baillie (Edinburgh: W. P. Kennedy, 1843), p. 12.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

e/27a50a3489.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/09/13/thomas-chalmers-on-the-free-church-and-the-establishment-principle/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-a299d3c350" data-kw="">
<blockquote><p>Conclusion 1: This civil coercive power is not only unnecessary, but unlawful to be exercised in the planting of the Church, and bringing men to the faith of Christ. Churches are not to be planted by weapons, but by doctrines (Lactantius, Institutes, bk. 5, ch. 20); not by the power of the sword, but by the efficacy of the Word; not by carnal weapons, but by spiritual means. The commission that Christ gave his apostles for the spreading and planting of the Gospel was only this, ‘Go and teach all nations, baptizing them in the name of the Father, and of the Son and of the Holy Ghost,’ Mt. 28:19-20, the like, in Mk. 16:15. And Christ tells us his kingdom is not of this world, for then his servants would fight for him, Jn. 18:36, but that was not the way to plant or advance his kingdom. Christ has no need of such carnal weapons for the planting of his Church, or the settling Him in his kingdom: the apostles had a warfare to fight, but the weapons of their warfare were not carnal, but spiritual, and yet strong to pull down the strongest holds of sin and Satan, and to bring every thought in obedience to Christ, 2 Cor. 10:3-4. They had a sword to wield, but that sword was no other but the Word of God, the sword of the Spirit, Eph. 6:17; Rev. 19:15. Here were armies to subdue even nations to Christ, but these were armies of teachers, not of soldiers, as the Psalmist alludes, Ps. 68:11. External force is not the way of Christ for the spreading his Gospel, and planting of his kingdom: It is true here, Religio suaderi potest, cogi non potest, ‘Men may be persuaded into a religion, but they can never be compelled.’ All externall acts of power are not able to beget internal acts of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Arraignment of Error</cite>, (London: Miller, 1646), p. 326</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-9ef4b72a8f" data-kw="">
<blockquote><p>[T]he [New Testament] dispensation would not come to a close till the religion of Messiah the Prince should be legally established in every nation under heaven, and till rulers and nations as such, should “kiss the Son,” and bow down under the sceptre of his power. Inspired prophecy foretels [sic] that “kings should be nursing fathers, and their queens nursing mothers” to the Church; that rulers shall bring their “glory and riches to Zion;” and that the “isles” shall submissively “wait for the Saviour’s law.” The Spirit of the Lord commands kings to be “wise and kiss the Son,” and expressly intimates that the command shall be, one day, universally obeyed. When Ethiopia shall stretch out her hands to God, “mighty princes shall come out of Egypt” to Mount Zion; the “saints of the Most High God shall take the kingdom, and possess it,” and the “kingdoms of this world” shall become “the kingdoms of our Lord and of his Christ.”

These declarations are sufficient to set aside all the vain reasonings of men of corrupt minds on this matter. In their plain and unsophisticated meaning, they do, beyond all question, warrant the opinion, that civil rulers have to do with the Church of Christ – are bound to cherish and support her, and act under a solemn responsibility to employ their influence and authority to promote her peace and prosperity. And, they, furthermore, as the voice of the Lord, assure us that the faithful witnesses of the Lamb, having regard to their Master’s honour, should in every age assert this part of his prerogative.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Nov. 1831, p. 391</span></figcaption>

https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9ef4b72a8f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9ef4b72a8f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2012/07/12/the-belfast-covenanter-on-postmillennialism-and-the-establishment-principle/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-edb3caa851" data-kw="">
<blockquote><p>They [Papists] do not only say… that one born in an heretical country may deny his country, but that by heresy a man, nay, a king, is deprived of all his jurisdiction, whether natural, civil or politic… One of their own bishops says, “As soon as a Christian king becomes heretical, forthwith the people are freed from subjection.” A cardinal says, “As long as the prince continues excommunicated (as he must do ever, if he be not a Romanist, for the Pope excommunicates ipso facto all heretics) the subject is freed from the oath of subjection,” but by whom? By the Pope, says a Jesuit, who upon just cause has power to absolve from oaths both himself, (as Gregory the 12th did when he sware that if he were chosen Pope he would give it over) and all others. If he be personally excommunicated, then, says their lawyer, subjects are freed from their allegiance and all his heretical assistants are to be rooted out, and their land to be exposed to be possessed of (strangers) Catholics. Nay, says another lawyer, if he be not excommunicated, yet if his heresy be publicly known, there needs no pronunciation of the sentence of excommunication, so that (says the Jesuit) subjects may lawfully deny him obediencer? How so? For the evidence of the crime, (says their whole school, and make it a matter of certainty and faith) does infer a sentence of condemnations because (as the more common opinion does define it) there must we understand the Pope’s will to have him excommunicated, whom upon the knowledge of his fault he would excommunicate. Nay, suppose that a Protestant prince have a just quarrel: yet, no war can be lawfully denounced or waged by the Queen (being excommunicated by name) though otherwise in itself it were most just: because her power is unlawful.</p></blockquote>

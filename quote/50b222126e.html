<main class="wrap"><figure class="quote" id="q-50b222126e" data-kw="">
<blockquote><p>The Matter, or Subject, partaking the Supper, are all they, who, being by Baptism made the members of the Church, and now, being of years, profess sound doctrine, and have the testimony of a holy life.

From the circumscription of this Subject, are excluded first, the dead, or they that are departed this life; from whom, both the power of using the Sacrament is taken away, and unto whom all the use thereof is in vain, &amp; ineffectual; as also the use of the preaching of the Gospel, whereof the Sacraments are appendants. Secondly, the Sick like to die: for Christ would have this communion not to be private, and domestical, but ecclesiastical, and public: neither doth the want, but the contempt of the same hurt the party that doth not communicate, though peradventure there be another respect to be had concerning them that have slipped, and that are Excommunicated out of the church, and concerning prisoners, who are to be punished, and are now penitent.

Thirdly, Children and Infants; for, to speak properly, the Supper is meat, for the stronger, and the further grown in years, and not for Infants: neither can they yield a reason of their Faith, nor examine themselves; which, notwithstanding, how needful it is, the Form, &amp; End of the Lord’s institution, as also Tradition do prove with great likely hood. Fourthly they, who for heresy, or for their dissolute life, are lawfully excommunicated: for this Supper requireth worthy guests, which live to Christ in Spirit, &amp; Faith. Whence it was, that the persons, who were excommunicated, or did Penance, after the Sermon ended, were in former time, commanded to go forth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius-jr.html">Lucas Trelcatius Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief institution of the common places of sacred divinity. Wherein, the truth of every place is proved, and the sophisms of Bellarmine are reproved</cite>, trans. John Gawen (London: Francis Burton, 1610), 2.13, pp 373-74.</span></figcaption>

<blockquote><p>But the conjunction between the sign and the reality signified is made by the force and power of the Holy Spirit alone. Through Him, Jesus Christ, who, as Scripture testifies, as a man is in Heaven and nowhere else, is as truly given to us, to us who are on the earth, as the signs which are used in the Sacraments.

Thus, as the promise expressly assures us, our faith contemplates Him in the Sacraments, and climbs up to heaven to embrace Him more and more and joins us to Him.</p></blockquote>

<blockquote><p>3. By forgetting the difference between their private familiarity, where they are choosers of their company themselves, and their Church-communion, where the pastors are the rulers and judges of the fitness of the members. Or else not understanding that this use of the keys, and judging of the fitness of the members, is indeed the pastor’s office and not theirs.

4. By not considering that nothing must be done by discipline upon offenders but in a course of Church-justice, upon due accusations, summons, audience, proof and patient admonition: And not by casting out any irregularly upon the expectation of every one that will say that they are ungodly and scandalous. … 8. By forgetting that God has not left the Church at arbitrary liberty to judge any godly or ungodly at their pleasure; But has given us a set test or rule to judge them by, which is their sober profession of consent to the baptismal Covenant, upon which the adult and their infants have right to baptism; and being baptized have right to Church-communion in all the acts which their age and understanding makes them capable of: And it is Church-tyranny to refuse such as show this title, till they are openly proved to forfeit it, by impenitency in gross sin after public admonition and due means. This is the truth, and the method of Christ’s discipline, and the rule of our communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), ‘To those Readers…’, p. 3</span></figcaption>

<blockquote><p>XXV. Next follow the actions of the disciples, and consequently of the other guests. And these, according to Christ’s appointment, are three: first, to receive both the bread and the cup; but each separately, for so Christ distributed them: in this manner he commanded his people to take them; thus the body of Christ, as broken for us; his blood as poured out of his body, are more distinctly represented; and in fine, as a complete entertainment requires both meat and drink, so this most complete spiritual repast which we have in Christ, is thus most excellently represented. And therefore we cannot so well approve of that custom which prevailed in Cyprian’s time, to give a piece of bread dipt in wine to infants and the sick; which was the practice in some places, about the year of Christ 340, in the public and ordinary celebration of the sacrament. The same judgment we are to pass on the custom of the Greeks, who crumble the consecrated bread into the wine, and take it out with a spoon.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 4.17.27 (2.452). HT: Amy Warren.</span></figcaption>

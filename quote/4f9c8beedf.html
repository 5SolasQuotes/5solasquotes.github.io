<main class="wrap"><figure class="quote" id="q-4f9c8beedf" data-kw="">
<blockquote><p>First, that we may put a difference between Christian and heathen virtues. For, howbeit the same virtues in kind and name are and may be found both in those that profess Christ and those also that are ignorant of the true God. Yet they are in them after a divers manner. For in heathen men they are the gifts of God, but not parts of regeneration and new birth. But in those that be true Christians they are indeed not only the gifts of God’s Spirit but also essential parts of regeneration. That we may better yet conceive this difference we must understand that the grace of God in man is twofold: restraining and renewing. Restraining [grace] is that which bridles and restrains the corruption of men’s hearts from breaking forth into outward actions, for the common good, that societies may be preserved and one man may live orderly with another. Renewing grace is that which not only restrains corruption but also mortifies sin and renews the heart daily more and more. The former of these is incident to heathen men and the virtues which they have. It serves only to repress the act of sin their outward actions. But in Christians, they are graces of God, not only bridling and restraining the affection, but renewing the heart, and mortifying all corruption. And though those virtues of the heathen be graces of God, yet they are but general and common to all. Whereas the virtues of Christians, are special graces of the Spirit, sanctifying and renewing the mind, will, and affections. For example, chastity in Joseph was a grace of God’s Spirit, renewing his heart. But chastity in Xenocrates was a common grace serving only to curb and restrain the corruption of his heart. And the like may be said of the justice of Abraham, a Christian, and of Aristides, a heathen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cases of Conscience</cite>, 1st edn, 1606; repr. 1617, 113. [modernized]</span></figcaption>

<blockquote><p>‘The love of God is the essential property or essence of God, whereby delighting Himself in it, He wishes it the good which He approves.’ To be distinguished are ‘the general love of God’, the object of which is creation generally, so that ‘no one either of men or even of demons may say that he is not loved by God’; God hates the sin in the godless, but loves the nature created by Him — and the ‘special love of God, by which He peculiarly pursues the separate elect.’</p></blockquote>

<blockquote><p>XIV. The efficacy of this instrument, and its entire power in producing the effect, depends on the Holy Spirit and his interior operation in the soul (Acts 16:14). It gives to this vocation its formal character, by which it is distinguished from that general call which is common even to the reprobate, so much so that if the Spirit of God did nothing more here than there, it would not be efficacious, but would be vain for salvation (2 Pet. 1:3).

XV. Just as, on the contrary, if He should operate here as He is accustomed to do in the conversion of the elect (for even in the reprobate He is often efficacious in some manner and degree) (Mt. 13:20), the effect would necessarily exist, and the man would necessarily be brought to obedience and to a new life in Christ (Jn. 6:44-45).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the Efficacious Vocation of the Sinner to Salvation</cite>, trans. AI (Leiden: Marcus, 1620), pp. 3-4</span></figcaption>

<blockquote><p>5. Here is added great and gracious encouragement to this sinful [unconverted, as is made clear by the larger context] people to take the admonition and advice well that Christ had given them, v. 19, v. 20. He tells them, (1.) It was given them in true and tender affection: “Whom I love, I rebuke and chasten. You may think I have given you hard words and severe reproofs; it is all out of love to your souls. I would not have thus openly rebuked and corrected your sinful lukewarmness and vain confidence, if I had not been a lover of your souls; had I hated you, I would have let you alone, to go on in sin till it had been your ruin.’’ Sinners ought to take the rebukes of God’s word and rod as tokens of his good-will to their souls, and should accordingly repent in good earnest, and turn to him that smites them; better are the frowns and wounds of a friend than the flattering smiles of an enemy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tong.html">William Tong</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, in Matthew Henry’s Commentary, on Rev., 3:19</span></figcaption>

</figure><figure class="quote" id="q-1468d42deb" data-kw="">
<blockquote><p>The infinite goodness of God bestows more mercies upon us in the method of prevention, than of answer to particular prayers. We enjoy most things before we ask, and often more excellent in kind and more abundant in measure than we ask… He makes his sun to rise every morning upon the unjust, and his moon to fill her orb with light upon the ungodly crescent [Muslims]. His paths in the clouds drops fatness upon the fields of bloody tyrants, and His ocean is open, and sweet western gales often swell the sails of rambling and roving pirates. The earth is full of his goodness. He spread and filled the tables of Heliogabalus with His hidden treasures. There is no inhabitant but is laden with his benefits, however abused to their luxury, pride, and wantonness. His mercies are over all his works; He makes the out-goings of the morning and evening to sing. He preserves the goings out and the comings in of all the children of Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-lee.html">Samuel Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eliothriambos: Or the Triumph of Mercy in the Chariot of Praise</cite>, (London: John Hancock, 1677), 1, 2, 11 as quoted in Day by Day with the English Puritans: Selected Readings for Daily Reflection, ed. Randall J. Pederson (Hendrickson, 2004), p. 202</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

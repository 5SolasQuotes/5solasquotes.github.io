<main class="wrap"><figure class="quote" id="q-cec65697ee" data-kw="">
<blockquote><p>But Scripture, to conduct us to this [seeking the good of our neighbor], reminds us, that whatever we obtain from the Lord is granted on the condition of our employing it for the common good of the Church, and that, therefore, the legitimate use of all our gifts is a kind and liberal communication of them with others. There cannot be a surer rule, nor a stronger exhortation to the observance of it, than when we are taught that all the endowments which we possess are divine deposits entrusted to us for the very purpose of being distributed for the good of our neighbour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559), bk. 3, ch. 7, sect. 5, p. 265</span></figcaption>

<blockquote><p>Scripture, moreover, has a, third rule for modifying the use of earthly blessings. We have already adverted to it when considering the offices of charity. For it declares that they have all been given us by the kindness of God, and appointed for our use under the condition of being regarded as trusts, of which one day we must give an account. We must, therefore, administer them as if we constantly heard the words sounding in our ears, ‘Give an account of your stewardship.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, trans. Henry Beveridge (1559), bk. 3, ch. 10, sect. 5, p. 297</span></figcaption>

</figure><figure class="quote" id="q-af7229c6c6" data-kw="">
<blockquote><p>Obedience to all God’s commandments is covenanted (Dt. 7:1• &amp; 10, 12; Jer. 7:23; Lev. 19:17-18; Lk. 10:27; Mk. 12:30), not as the cause of life, but as the qualification and effect of faith, and as the way to life. Faith that embraces life is obedient and fruitful in all good works; but in one sort faith is the cause of obedience and good works, and in another of justification and eternal life. These it seeks in the promises of the covenant; those it works and produces, as the cause does the effect. Faith was the efficient cause of that precious oblation in Abel (Heb. 11:4, 7, etc.), of reverence and preparing the ark in Noah, of obedience in Abraham; but it was the instrument only of their justification. For it does not justify as it produces good works, but as it receives Christ, though it cannot receive Christ unless it brings forth good works. A disposition to good works is necessary to justification, being the qualification of an active and lively faith. Good works of all sorts are necessary to our continuance in the state of justification, and so to our final absolution, if God give opportunity; but they are not the cause of, but only a preceding qualification or condition to final forgiveness and eternal bliss. If then, when we speak of the conditions of the covenant of grace, by “condition” we understand whatsoever is required on our part, as precedent, concomitant, or subsequent to justification, repentance, faith, and obedience are all conditions; but if by “condition” we understand what is required on our part as the cause of the good promised, though only instrumental, faith or belief in the promises of free mercy is the only condition. Faith and works are opposed in the matter of justification and salvation in the covenant, not that they cannot stand together in the same subject—for they are inseparably united—but because they cannot concur or meet together in one and the same court to the justification or absolution of man. For in the court of justice, according to the first covenant, either being just he is acquitted, or unjust he is condemned; but in the court of mercy, if you receive the promise of pardon, which is done by a lively faith, you are acquitted and set free, and accepted as just and righteous; but if you do not believe, you are sent over to the court of justice. Obedience is twofold: [1] Perfect in measure and degree—this is so far required that, if it be not performed, we must acknowledge our sin in coming short. And this God is pleased to exact at our hands, that we might walk in humility before him, strive after perfection, and freely acknowledge his rich grace and mercy in accepting and rewarding the best service we can render to his Highness, when in the court of justice it deserves to be rejected. [2] Sincere, uniform, and constant, though imperfect in measure and degree; and this is so necessary that without it there is no salvation to be expected. The covenant of grace calls for perfection, yet accepts sincerity, God in mercy pardoning the imperfections of our best performances. If perfection were rigidly exacted, no flesh could be saved; if it were not at all commanded, imperfection would not be sin, nor would perfection be something to be labored after. The faith that is lively to embrace mercy is ever joined with an unfeigned purpose to walk in all well-pleasing, and the sincere performance of all holy obedience, as opportunity is offered, ever attends that faith by which we continually lay hold upon the promises once embraced. Actual good works of all sorts (though not perfect in degree) are necessary to the continuance of actual justification, because faith can no longer lay faithful claim to the promises of life than it does virtually or actually lead us forward in the way to heaven. For if we say we have fellowship with God and walk in darkness, we lie and do not the truth; but if we walk in the light, as he is in the light, we have fellowship one with another (1 John 1:6–7). This walking in the light, as He is in the light, is that qualification whereby we become immediately capable of Christ’s righteousness, or actual participants of his propitiation, which is the sole immediate cause of our justification, taken for remission of sins or actual approbation with God. The truth of this doctrine St. John likewise ratifies in terms equivalent in the words immediately following: “And the blood of Christ cleanses us (walking in the light as God is in the light) from all sin.” (1 Jn. 1:7) But of these things more fully in their several degrees, as this covenant has been revealed. In this covenant man promises to repent of his sins, and, repenting, to cleave to the promise of mercy made in Jesus Christ, and in faith to yield willing, cheerful, and continual obedience. In contracts among men, one may ask more and another bid less, and yet they may come to agreement; but it is altogether fruitless for men to think of entering into covenant with God if they are not resolved to obey in all things. The practice of all God’s people who have ever made covenant with Him expressly declares as much when they solemnly entered into or renewed their covenant. For thus they promise: “Whatever the Lord says, that we will do” (Exod. 24:3, 7). The people said to Joshua, “The Lord our God we will serve, and his voice we will obey” (Josh. 24:23). And they entered into a covenant to seek the Lord God of their fathers with all their heart and with all their soul, so that whoever would not seek the Lord God of Israel should be put to death, whether small or great, whether man or woman (2 Chron. 15:12–13). And the king stood by the pillar and made a covenant before the Lord to walk after the Lord, and to keep his commandments, his testimonies, and his statutes with all his heart and all his soul, to perform the words of this covenant that were written in this book; and all the people stood to the covenant (2 Chron. 34:31; 2 Kings 23:3). They entered into a curse and into an oath to walk in God’s law, which was given by Moses the servant of God, and to observe and do all the commandments of the Lord our God, and his judgments and his statutes (Neh. 10:29). And thus runs the exhortation of Joshua to the two tribes and a half when he sent them home: “Take diligent heed to do the commandments of the law, which Moses the servant of the Lord charged you, to love the Lord your God, and to walk in all his ways, and to keep his commandments, and to cleave to him, and to serve him with all your heart and with all your soul” (Josh. 22:5). This must not be understood as if one who, through frailty and infirmity, offends in any one jot or tittle should be counted a covenant-breaker; for then no man would be innocent. Rather, the promise must be interpreted according to the rule of obedience given, which calls for perfection but accepts sincerity. In the covenant of mercy we bind ourselves to believe and rest upon God with the whole heart, so that doubting or distrust arising from weakness and infirmity must indeed be acknowledged as sin, yet every such frailty does not prove the person to be a transgressor of the covenant. The same holds true of obedience. But of this more fully when treating the particular manner in which God has been pleased to administer this covenant.</p></blockquote>

— John Ball, A Treatise of the Covenant of Grace… (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, pp. 19-">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CObedience+to+all+God%E2%80%99s+commandments+is+covenanted+%28Dt.+7%3A1%E2%80%A2+%26+10%2C+12%3B+Jer.+7%3A23%3B+Lev.+19%3A17-18%3B+Lk.+10%3A27%3B+Mk.+12%3A30%29%2C+not+as+the+cause+of+life%2C+but+as+the+qualification+and+effect+of+faith%2C+and+as+the+way+to+life.+Faith+that+embraces+life+is+obedient+and+fruitful+in+all+good+works%3B+but+in+one+sort+faith+is+the+cause+of+obedience+and+good+works%2C+and+in+another+of+justification+and+eternal+life.+These+it+seeks+in+the+promises+of+the+covenant%3B+those+it+works+and+produces%2C+as+the+cause+does+the+effect.+Faith+was+the+efficient+cause+of+that+precious+oblation+in+Abel+%28Heb.+11%3A4%2C+7%2C+etc.%29%2C+of+reverence+and+preparing+the+ark+in+Noah%2C+of+obedience+in+Abraham%3B+but+it+was+the+instrument+only+of+their+justification.+For+it+does+not+justify+as+it+produces+good+works%2C+but+as+it+receives+Christ%2C+though+it+cannot+receive+Christ+unless+it+brings+forth+good+works.+A+disposition+to+good+works+is+necessary+to+justification%2C+being+the+qualification+of+an+active+and+lively+faith.+Good+works+of+all+sorts+are+necessary+to+our+continuance+in+the+state+of+justification%2C+and+so+to+our+final+absolution%2C+if+God+give+opportunity%3B+but+they+are+not+the+cause+of%2C+but+only+a+preceding+qualification+or+condition+to+final+forgiveness+and+eternal+bliss.+If+then%2C+when+we+speak+of+the+conditions+of+the+covenant+of+grace%2C+by+%E2%80%9Ccondition%E2%80%9D+we+understand+whatsoever+is+required+on+our+part%2C+as+precedent%2C+concomitant%2C+or+subsequent+to+justification%2C+repentance%2C+faith%2C+and+obedience+are+all+conditions%3B+but+if+by+%E2%80%9Ccondition%E2%80%9D+we+understand+what+is+required+on+our+part+as+the+cause+of+the+good+promised%2C+though+only+instrumental%2C+faith+or+belief+in+the+promises+of+free+mercy+is+the+only+condition.+Faith+and+works+are+opposed+in+the+matter+of+justification+and+salvation+in+the+covenant%2C+not+that+they+cannot+stand+together+in+the+same+subject%E2%80%94for+they+are+inseparably+united%E2%80%94but+because+they+cannot+concur+or+meet+together+in+one+and+the+same+court+to+the+justification+or+absolution+of+man.+For+in+the+court+of+justice%2C+according+to+the+first+covenant%2C+either+being+just+he+is+acquitted%2C+or+unjust+he+is+condemned%3B+but+in+the+court+of+mercy%2C+if+you+receive+the+promise+of+pardon%2C+which+is+done+by+a+lively+faith%2C+you+are+acquitted+and+set+free%2C+and+accepted+as+just+and+righteous%3B+but+if+you+do+not+believe%2C+you+are+sent+over+to+the+court+of+justice.+Obedience+is+twofold%3A+%5B1%5D+Perfect+in+measure+and+degree%E2%80%94this+is+so+far+required+that%2C+if+it+be+not+performed%2C+we+must+acknowledge+our+sin+in+coming+short.+And+this+God+is+pleased+to+exact+at+our+hands%2C+that+we+might+walk+in+humility+before+him%2C+strive+after+perfection%2C+and+freely+acknowledge+his+rich+grace+and+mercy+in+accepting+and+rewarding+the+best+service+we+can+render+to+his+Highness%2C+when+in+the+court+of+justice+it+deserves+to+be+rejected.+%5B2%5D+Sincere%2C+uniform%2C+and+constant%2C+though+imperfect+in+measure+and+degree%3B+and+this+is+so+necessary+that+without+it+there+is+no+salvation+to+be+expected.+The+covenant+of+grace+calls+for+perfection%2C+yet+accepts+sincerity%2C+God+in+mercy+pardoning+the+imperfections+of+our+best+performances.+If+perfection+were+rigidly+exacted%2C+no+flesh+could+be+saved%3B+if+it+were+not+at+all+commanded%2C+imperfection+would+not+be+sin%2C+nor+would+perfection+be+something+to+be+labored+after.+The+faith+that+is+lively+to+embrace+mercy+is+ever+joined+with+an+unfeigned+purpose+to+walk+in+all+well-pleasing%2C+and+the+sincere+performance+of+all+holy+obedience%2C+as+opportunity+is+offered%2C+ever+attends+that+faith+by+which+we+continually+lay+hold+upon+the+promises+once+embraced.+Actual+good+works+of+all+sorts+%28though+not+perfect+in+degree%29+are+necessary+to+the+continuance+of+actual+justification%2C+because+faith+can+no+longer+lay+faithful+claim+to+the+promises+of+life+than+it+does+virtually+or+actually+lead+us+forward+in+the+way+to+heaven.+For+if+we+say+we+have+fellowship+with+God+and+walk+in+darkness%2C+we+lie+and+do+not+the+truth%3B+but+if+we+walk+in+the+light%2C+as+he+is+in+the+light%2C+we+have+fellowship+one+with+another+%281+John+1%3A6%E2%80%937%29.+This+walking+in+the+light%2C+as+He+is+in+the+light%2C+is+that+qualification+whereby+we+become+immediately+capable+of+Christ%E2%80%99s+righteousness%2C+or+actual+participants+of+his+propitiation%2C+which+is+the+sole+immediate+cause+of+our+justification%2C+taken+for+remission+of+sins+or+actual+approbation+with+God.+The+truth+of+this+doctrine+St.+John+likewise+ratifies+in+terms+equivalent+in+the+words+immediately+following%3A+%E2%80%9CAnd+the+blood+of+Christ+cleanses+us+%28walking+in+the+light+as+God+is+in+the+light%29+from+all+sin.%E2%80%9D+%281+Jn.+1%3A7%29+But+of+these+things+more+fully+in+their+several+degrees%2C+as+this+covenant+has+been+revealed.+In+this+covenant+man+promises+to+repent+of+his+sins%2C+and%2C+repenting%2C+to+cleave+to+the+promise+of+mercy+made+in+Jesus+Christ%2C+and+in+faith+to+yield+willing%2C+cheerful%2C+and+continual+obedience.+In+contracts+among+men%2C+one+may+ask+more+and+another+bid+less%2C+and+yet+they+may+come+to+agreement%3B+but+it+is+altogether+fruitless+for+men+to+think+of+entering+into+covenant+with+God+if+they+are+not+resolved+to+obey+in+all+things.+The+practice+of+all+God%E2%80%99s+people+who+have+ever+made+covenant+with+Him+expressly+declares+as+much+when+they+solemnly+entered+into+or+renewed+their+covenant.+For+thus+they+promise%3A+%E2%80%9CWhatever+the+Lord+says%2C+that+we+will+do%E2%80%9D+%28Exod.+24%3A3%2C+7%29.+The+people+said+to+Joshua%2C+%E2%80%9CThe+Lord+our+God+we+will+serve%2C+and+his+voice+we+will+obey%E2%80%9D+%28Josh.+24%3A23%29.+And+they+entered+into+a+covenant+to+seek+the+Lord+God+of+their+fathers+with+all+their+heart+and+with+all+their+soul%2C+so+that+whoever+would+not+seek+the+Lord+God+of+Israel+should+be+put+to+death%2C+whether+small+or+great%2C+whether+man+or+woman+%282+Chron.+15%3A12%E2%80%9313%29.+And+the+king+stood+by+the+pillar+and+made+a+covenant+before+the+Lord+to+walk+after+the+Lord%2C+and+to+keep+his+commandments%2C+his+testimonies%2C+and+his+statutes+with+all+his+heart+and+all+his+soul%2C+to+perform+the+words+of+this+covenant+that+were+written+in+this+book%3B+and+all+the+people+stood+to+the+covenant+%282+Chron.+34%3A31%3B+2+Kings+23%3A3%29.+They+entered+into+a+curse+and+into+an+oath+to+walk+in+God%E2%80%99s+law%2C+which+was+given+by+Moses+the+servant+of+God%2C+and+to+observe+and+do+all+the+commandments+of+the+Lord+our+God%2C+and+his+judgments+and+his+statutes+%28Neh.+10%3A29%29.+And+thus+runs+the+exhortation+of+Joshua+to+the+two+tribes+and+a+half+when+he+sent+them+home%3A+%E2%80%9CTake+diligent+heed+to+do+the+commandments+of+the+law%2C+which+Moses+the+servant+of+the+Lord+charged+you%2C+to+love+the+Lord+your+God%2C+and+to+walk+in+all+his+ways%2C+and+to+keep+his+commandments%2C+and+to+cleave+to+him%2C+and+to+serve+him+with+all+your+heart+and+with+all+your+soul%E2%80%9D+%28Josh.+22%3A5%29.+This+must+not+be+understood+as+if+one+who%2C+through+frailty+and+infirmity%2C+offends+in+any+one+jot+or+tittle+should+be+counted+a+covenant-breaker%3B+for+then+no+man+would+be+innocent.+Rather%2C+the+promise+must+be+interpreted+according+to+the+rule+of+obedience+given%2C+which+calls+for+perfection+but+accepts+sincerity.+In+the+covenant+of+mercy+we+bind+ourselves+to+believe+and+rest+upon+God+with+the+whole+heart%2C+so+that+doubting+or+distrust+arising+from+weakness+and+infirmity+must+indeed+be+acknowledged+as+sin%2C+yet+every+such+frailty+does+not+prove+the+person+to+be+a+transgressor+of+the+covenant.+The+same+holds+true+of+obedience.+But+of+this+more+fully+when+treating+the+particular+manner+in+which+God+has+been+pleased+to+administer+this+covenant.%E2%80%9D%0A%0A%E2%80%94+John+Ball%2C+A+Treatise+of+the+Covenant+of+Grace%E2%80%A6+%28London%3A+1645%29%2C+ch.+3%2C+%E2%80%98Of+the+Covenant+of+Grace+in+General%E2%80%99%2C+pp.+19-&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Faf7229c6c6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/af7229c6c6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=Obedience%20to%20all%20God%E2%80%99s%20commandments%20is,been%20pleased%20to%20administer%20this%20covenant&amp;text=Obedience%20to%20all%20God%E2%80%99s%20commandments%20is%20covenanted%20%28Dt&amp;text=God%20has%20been%20pleased%20to%20administer%20this%20covenant" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

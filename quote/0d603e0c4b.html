<blockquote><p>Following in every way the decrees of the holy fathers and recognising the canon which has recently been read out—the canon of the 150 most devout bishops who assembled in the time of the great Theodosius of pious memory, then emperor, in imperial Constantinople, new Rome—we issue the same decree and resolution concerning the prerogatives of the most holy church of the same Constantinople, new Rome. The fathers rightly accorded prerogatives to the see of older Rome, since that is an imperial city; and moved by the same purpose the 150 most devout bishops apportioned equal prerogatives to the most holy see of new Rome, reasonably judging that the city which is honoured by the imperial power and senate and enjoying privileges equalling older imperial Rome, should also be elevated to her level in ecclesiastical affairs and take second place after her. The metropolitans of the dioceses of Pontus, Asia and Thrace, but only these, as well as the bishops of these dioceses who work among non-Greeks, are to be ordained by the aforesaid most holy see of the most holy church in Constantinople. That is, each metropolitan of the aforesaid dioceses along with the bishops of the province ordain the bishops of the province, as has been declared in the divine canons; but the metropolitans of the aforesaid dioceses, as has been said, are to be ordained by the archbishop of Constantinople, once agreement has been reached by vote in the usual way and has been reported to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/canon-28-of-the-council-of-chalcedon.html">Council of Chalcedon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 451 AD</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-015970734b" data-kw="">
<blockquote><p>Then he [Satan] begins his strongest batteries, or main temptations, when we are first entering into a renewed state: Now this is most usual in the days of our youth. Thus many of our worthies observe, Mr. [Thomas] Ford, speaking of young people, faith, Amongst the usually the stream of converting grace most runs. It may be in some grace is wrought very early, even in childhood, but ordinarily ’tis after they come under catechising, and are more adult. And Mr. Burges thus, Conversion does not only belong to the old, but to the young; yea, commonly conversion is sooner wrought upon the younger sort of people; for they have not resisted the grace of God so much, they have not provoked God to give them up to their own heart’s lusts, and desires, as many ages persons have; so then let young ones hearken to sermons, let them attend to what the ministers of God exhort. Remember thy Creator in the days of thy youth; and it is good to bear the yoke in they youth; it is good to feel the bitterness of sin betimes, Eccl. 12:1; Lam. 3:27. And Vortier thus, The Lord can convert and bring home to himself at all times, in middle age, in old age, at the very last, as the thief upon the cross; yet the time of effectual calling is more ordinary in the time of youth. Some have observed the time of effectual calling to be between the years of eighteen and thirty, most commonly. And I believe that most saints experience, that the Lord wrought upon them in their younger days. Marriages are most in younger times, so are spiritual contracts in Jesus Christ. David was good when young, Daniel a young prophet; Timothy a young preacher, Samuel began with God betimes, Abijah good when a child, so was Josiah. Hammers thus, Those who in their infancy were considered as parts of their parents, and so by virtue of their parents’ membership enjoyed the ordinance of baptism; when once grown up to maturity and ripeness of years, they are to be looked upon and considered in themselves, and no longer as in their parents, and therefore as being in a capacity so to do, they ought now to take hold of the covenant for themselves, and to render a personal account of their faith. It pleases God, that many do so even very early; which agrees with the former opinion, that some are regenerated after they come under catechizing. It was the use of the Jews, as Mr. Buxtorf reports, that so soon as their circumcised children were able to speak, they taught them some select places of Scripture, and so proceeding on by degrees at thirteen years of age, they were called filii praecepti, sons of the precept; and then they were to receive the passover, as says Mr. Weem, and to observe the 613 precepts, which comprehended in them the sum of the Mosaical law, and Jewish religion, and then they themselves were accounted guilty and liable to punishment, both divine and human, if they did transgress the law, whereas before their faults were imputed to their fathers, of whom the punishment was exacted… I hope, I may say of Gentiles as well as Jews, that conversion is sometimes very early, even as early as at thirteen years of age, though it be not ordinary. And oh! how good is it for a man to bear the yoke in his youth, seeing it must be born at one time or other? The burden of sin at that age will be the lighter, the flowing of heavenly affections will be the sweeter, the removal of sin, in all likehood will be sooner, at least the surer; God having engaged Himself that ‘they that seek Him early shall find Him,’ Prov. 8:17. Satan knows all this very well, and therefore he sets a stricter watch on youth…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/isaac-ambrose.html">Isaac Ambrose</a></span><span class="wk"><span class="lbl">Work:</span> <cite>War with Devils</cite>, … (d. 1663), pp. 52-54</span></figcaption>

<blockquote><p>XI. …For as they [men] are concerned only with externals and cannot search into the inner motives of the mind, the ministry can be committed to those who are little suited to this sacred office and who can in different ways corrupt it, whether through ignorance or wickedness… But from the time that calls began to be made by men, they could easily be corrupted; nor has God ever promised to accompany such human calls with the spirit of infallibility so that they might always continue pure and without any corruption.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 18th Topic, Question 23, p. 218</span></figcaption>

<blockquote><p>…if the laws of the Church obliged the conscience in such a [absolute] manner, as that the transgression of them were a sin, the observance of them would then be a good action… …the persons against whom I dispute, pretend the violation of ecclesiastical laws to be therefore only sinful, because it implies an infraction of the law of God, who has commanded us to obey the Church: but if not to do what the Church enjoins be to violate the law of God, must it not be allowed, that to comply with her injunctions, is to observe the same divine law, and consequently to perform a good and virtuous act?… Lastly, if ecclesiastical laws obliged the conscience, the Church would only have changed her yoke by the establishment of Christianity: she would still continue a slave; and the only difference would be, that whereas under the [Mosaic] Law her servitude was terminated with respect to God, she would now be in bondage to men… …ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…if the laws of the Church obliged the conscience in such a [absolute] manner, as that the transgression of them were a sin, the observance of them would then be a good action… …the persons against whom I dispute, pretend the violation of ecclesiastical laws to be therefore only sinful, because it implies an infraction of the law of God, who has commanded us to obey the Church: but if not to do what the Church enjoins be to violate the law of God, must it not be allowed, that to comply with her injunctions, is to observe the same divine law, and consequently to perform a good and virtuous act?… Lastly, if ecclesiastical laws obliged the conscience, the Church would only have changed her yoke by the establishment of Christianity: she would still continue a slave; and the only difference would be, that whereas under the [Mosaic] Law her servitude was terminated with respect to God, she would now be in bondage to men… …ever since the Reformation, it has been a particular controversy between the Romanists and us, whether ecclesiastical laws oblige the conscience, in other cases besides those of contempt and scandal. The Church of Rome has declared for the affirmative; and Protestant authors, as well Lutherans as Calvinists, for the negative. If any question this, let them give themselves the trouble of reading Bellarmine De Bonis Operibus [Of Good Works], particularly book 2, ch. 7 [‘Ecclesiastical Law Obliges the Faithful in Conscience…’], and the Brothers of Valemborch, tome 1, p. 183; tome 2, p. 187, among the papists; and among those of our communion, the supplement to Chamier, p. 375; Rivet’s Summary of Controversies [in French], tract 2, question 9 [‘Whether the Church may Make Laws?’]; [Jean] Mestrezat, Of the Church, Theses of Salmur, tome 1, disputation 1 [‘Whether Conscience to the Faith is Prior to that of the Church, or that to the Church is Prior to that of the Faith?’]. But this is not all, the Confession of Faith, published by the Reformed Churches of France, is express to the same purpose; see Article 33. So that if I have gone too far in this respect, I have all the Protestant Churches for my vouchers.”

e+supplement+to+Chamier%2C+p.+375%3B+Rivet%E2%80%99s+Summary+of+Controversies+%5Bin+French%5D%2C+tract+2%2C+question+9+%5B%E2%80%98Whether+the+Church+may+Make+Laws%3F%E2%80%99%5D%3B+%5BJean%5D+Mestrezat%2C+Of+the+Church%2C+Theses+of+Salmur%2C+tome+1%2C+disputation+1+%5B%E2%80%98Whether+Conscience+to+the+Faith+is+Prior+to+that+of+the+Church%2C+or+that+to+the+Church+is+Prior+to+that+of+the+Faith%3F%E2%80%99%5D.+But+this+is+not+all%2C+the+Confession+of+Faith%2C+published+by+the+Reformed+Churches+of+France%2C+is+express+to+the+same+purpose%3B+see+Article+33.+So+that+if+I+have+gone+too+far+in+this+respect%2C+I+have+all+the+Protestant+Churches+for+my+vouchers.%E2%80%9D%0A%0A%E2%80%94+Jean+La+Placette%2C+Ch.+10%2C+%E2%80%98Of+Ecclesiastical+Ordinances%E2%80%99+%26+%E2%80%98Remarks+on+the+10th+Chapter%E2%80%99+in+The+Christian+Casuist%3A+or%2C+a+Treatise+of+Conscience+%28London%3A+1705%29.+pp.+64-92%2C+pp.+71-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74fed37c58.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/74fed37c58.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-church-ordinances/#:~:text=if%20the%20laws%20of%20the%20Church,the%20Protestant%20Churches%20for%20my%20vouchers&amp;text=if%20the%20laws%20of%20the%20Church%20obliged%20the&amp;text=have%20all%20the%20Protestant%20Churches%20for%20my%20vouchers" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…Whether pastors are to be believed or obeyed any farther than they show a Word of God revealing or commanding the particular thing? Divine faith and obedience is one thing, and human is another: 1. If as a preacher he say, ‘This is God’s Word, believe it and obey it as such,’ you must believe with a human faith that it is likelier that he knows what he says than you do (unless 1. you see evidence, 2. or the consent of more credible persons to be against him, and then you are not to believe him at all). Even as a child believes his teacher in order to learn the things himself, so you are so far to take his word while you are learning to know whether it be so or not. But not to rest in it as certain, nor to take your belief of him and obedience to him, to be a believing and obeying God formally, though a duty.</p></blockquote>

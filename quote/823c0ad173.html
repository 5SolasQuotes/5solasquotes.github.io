<blockquote><p>Verse. 13 For * ‖ not the hearers of the Law are just with God: but the doers of the Law ‖ shall be justified. RHEM. 5. [ 13. Not the hearers] This same sentence agreeable also to Christs words (Mat, 7. 21.) is the very ground of S. James disputation that not faith alone, but good works also do justify, [note] Therefore S. Paul (howsoever some perversely construe his words in other places) meaneth the same that S. James. And here he speaketh * not properly of the first justification, when an Infidel or ill man is made just, who had no acceptable works before to be justified by (of which kind he specially meaneth in other places of this Epistle) but he speaketh of the second justification or increase of former justice, which he that is in Gods grace, daily proceedeth in, by doing all kind of good works, which be justices: and for doing of which, he is just indeed before God, and of this kind doth S. James namely treate. Which is directly against the Heretics of this time, who not only attribute nothing to the works done in sin and infidelity, but esteeme nothing at all of all Christian mens works toward justification and salvation, condemning them unclean, sinful, hypocritical, and Pharisaical: which is directly against these and other Scriptures, and plain blaspheming of Christ and his grace, by whose spirit and cooperation we do them, CARTW. 5 [13. Not the hearers.] And if the wresting of mens words from their honest meaning be a sin worthy of death, what a horrible condemnation waiteth for these Jesuits, that pull and hale the Lords words to a quite contrary meaning then he set them downe. For the Apostle [note] having disputed in the former chapter, that no man hath any righteousness of his owne by any manner of worke. In this second chapter he descendeth to the special cause of the Jews, which of all other might seeme to be exempted from that generallity of Injustice, wherewith he had charged the whole world, the opinion of whose Justice might rise in that they had not only an exact knowledge of the law, in such sort, that every Jew was able after a sort to be a guide unto the blind, and a Doctor to the unlearned: But also for that in some measure of the holy spirit they received, many of [note] them gave their endeavor to do the works of the law, Now the Apostle to throw down this stately &amp; proud Castle of the opinion of their own justice, declareth that the Justification that is of the law, standeth not in the hearing or knowledge of the law, no if (possibly) they could attain the full and perfect knowledge thereof, but in the full and perfect doing and accomplishment thereof, which he doth more expressly set forth to the Galatians, where he requireth to justification by the works [note] of the law a performance of all the commandments, and that constant and perpetual without any intermission or interruption by stepping a hair breadth aside, either on the right hand or on the left. Now that the Apostle meaneth not those only which either heard the law only, or did the outward and civil works of the law, which a mere natural man doth, that but he withal compriseth those which having believed brought forth by the work of the spirit, good fruits; it appeareth diversely. First by the writing of this Epistle, wherein he instructed those that believed in Christ, but not without some wavering in this doctrine which he so largely unfoldeth, as appeareth in that his desire was [note] to come to them, that they might be strengthened. Secondly it appeareth by the testimony of the Prophet Ezechiel, who doth evidently as well by that which goeth before, as by that which cometh after, refer the sentence which the Apostle draweth from him, touching the name of God blasphemed amongst the Gentiles for the Jews sake, unto the true Church and spouse of Christ. And this the floating and unconstant Jesuits have in their marginal note at unawares confessed. wherein they say; It is a great sin that by the evil life of the faithful our Lords name should be evil [note] spoken of. And the example of David, a faithful man, who caused the name of God to be blasphemed, will not suffer us to remaine in any doubt, but that the cause of blaspheming of Gods name may fall into the Church of God. Last of all, this is evident by the examples of Abraham and David, which the [note] Apostle setteth forth. For touching Abraham, he obeying the voice of the Lord when he called him first out of Chaldea, and then out of Charan, must needs even then have faith; yet some years after upon the promise made unto him of the blessed seede received by faith, it is said that his faith did justify him, and not his good works, which he had done very excellent and manifold. So that although he were a doer of the law after he believed, yet still his Justification is placed in faith. This is yet more manifest in the example of David, who having believed, or at least having been sanctified more than 40 years, and done many singular acts of true godliness before his foul crimes, of the murder of many his faithful servants by the sword of the Ammonites, of the adultery with Bathsheba, and finally of the drunkenness that he threw Uriah into, placeth his repaire not as the Jesuits blasphemously do in the [note] satisfaction which is by works, but in faith which believeth and layeth hold of remission of sins by Christ. Whereby appeareth the lewd and blockish answer of the Jesuits, which wrest the Apostles denial of justification by works of the law to those civil works that men either worke by the light and strength of nature, or by a bare knowledge of the law, without any assistance of Gods spirit, and with all their sottish καινοφονία, and newfangled distinction of the first justification by faith alone, and of the second justification by faith and works together is crushed all to pieces; seeing the Apostles ascribeth the justification which men have after they are entered into the way of righteousness, not to works [note] done, either before or after to be done, but unto that faith which being first planted in their hearts after waxeth and groweh to that proportion that the Lord seeth good in his great wisdome to be fit for every one according to the place he occupieth in the body of Christ, and trials that he will prove them with. Hereupon the Apostle in the stairs whereby we orderly come to the kingdom of [note] heaven, doth never set one justification after another, but placeth sanctification after justification. And if this new and unlawful coine of distinction were true, then the sentence of the Apostle, should not have where to set foot, which declareth that as there is but one true body, one spirit whereby [note] that body liveth, one hope of our calling, one true Lord, one lawful baptisme, one true God: so there is but one true and holy faith. Touching Saint James it shall be answered (God willing) in the proper place. As for Augustine, he utterly refuseth to be fraughted with such beggarly merchandise, as you would load him with. But so (saith he) it must be understood that the doers of the law shall be justified, that we may know that they are not otherwise doers of the law, unless they be justified: that justification should not come to the doers of the law, or be an after comer to them, but that justification should go before the doers of the law, which cleane overturneth the Jesuits diversely. First that he maketh the doing of the law to be the effect of justification, which they make the cause, and call it the second Justification. Secondly because he maketh one Justification which always goeth before good works, and is done that we may be fit for good works. So this giveth answere to his words alleged in the next Annotation. For those words meane thus much, that we being just in Christ, because we have in him done the law, must have that grace ere we can do the law, as apeareth first because these words follow upon the former sentence, and is so expounded by the words immediately following. And by this it is as much as if a man would say, they shall be made doers of the law, not that they were, but that they may be, that so the Jews might understand which are the hearers of the law, that they have need of the grace of the just justifier: that they may be doers. For that Augustine doth not acknowledge a second righteousness, whereby a man may be justified, shall once for all appeare by these places following. Every living man justifieth [note] himselfe before himselfe, not before thee. How before himselfe? In pleasing themselves and displeasing thee. But before thee no man is justified. Enter not therefore with me into judgment O Lord my God, how much soever I seem to be righteous. Thou bringest out of thy treasure a rule, which when thou appliest unto me I shall be found nought. And after having noted with thy servant, that all, even the Apostles, after they were Apostles must pray, forgive us our sins. He saith in the end; Let therefore the Apostles say, Let them hardly say forgive us our debts as we forgive our debtors. And when it is said to them why say you so? what be your debts? [note] Let them answere, because no man living shall be justified in thy sight. And in another place he saith; He said not I shall not be able to abide it, but who shall be able to abide it, for that the whole life of man is in a manner barked at by their owne sins, that all consciences are accused by their owne thoughts, that there is not found a chaste heart which presumeth of it owne righteousness. If therefore there is no chaste heart that can presume of it own righteousness, let every mans heart presume of Gods mercy, and let it say unto God; If thou O Lord wilt observe or marke up our iniquities, O Lord who shall abide it? But what hope is there? because with thee there is mercy: And what is this mercy but the sacrifice? And what is the sacrifice but that which was offered for us? even the innocent blood that was shed hath done away all the sins of the guilty: the price only which was given redeemeth all captive from the hands of the enemy that carried them captive. Therefore there is mercy with the Lord: for if there were not mercy with thee: and if thou wilt be nothing else but a Judge, and not merciful, and observe or marke up all our iniquities, and inquire into them, who shall be able to abide it; who should stand and say I am innocent. As for the other trash which they have in their next noteless note. First let the good Reader marke, that they confessing proofe of our part out of the Scripture that to justify is to impute justifice, bring nothing to the reproofe thereof beside their owne barking. For their sottish consequence that God should be either ignorant or unjust, if he should repute him as righteous which is not so, is unworthy any answere: for first he hath Christs righteousness, which being a true and perfect righteousness is as verily his through faith, as if he had done it in his owne person. Secondly, they wickedly speak of a man that being justified by faith, is made a member of the body of Christ; when they say he is wicked, impious and unjust: for although they have remnant of sin them, yet for [note] that the same is not imputed unto them, it is blasphemous against Christ to account his members impious, and to make him a head of any impious body. Thirdly, this is not so much against us as against the Apostle, who speaketh so plainly that God justifieth the wicked, that he loved us when we were his enemies, as we cannot speak plainer. Againe they impudently belie us, when they make the state of the question between us and them; Whither it be more glory to God, and more to the commendation of Christs justice, to call and count an evil man so continuing for just, then by his grace to make him of an evil one just indeed, and so truly to justify him. For they know well that we teach, that the justified man must walk in all the ways and commandments of God, and urge the keeping of the Law much more straightly then they do, which make partly sin no sin, partly make venial sins, which a little holy, or rather harlotry water may take away: yea so we urge it, as we pronounce that they never truly believed, nor were ever justified which remaine in the same wickedness wherein they were when they first obtained mercy. Now take away your slanderous and lying forgery of us, that a man justified by faith remaineth still in impiety. And we boldly affirme that there is more glory to God, and commendation to Christs Justice, to call and account an evil man just; theu to make him of an evil one just, in the works that are done in and by himselfe. And this we say not only as you beggarly Sophisters are wont to do, but with sound and substantial proofe. And first after this sort, it is more to Gods glory, whereby glory is to be taken from men and given unto God, then that whereby glory being added to men is taken from God: But by justification through faith alone, or by imputation, glory is taken from men, and given to God; and contrariwise in justification by the deeds of the law. Wherefore it is more to Gods glory that he justifieth us by faith only then by the works of the law. The first proposition is both evident in itself, and is confirmed by the plaine testimonies of the Apostle. The second is as evident by the same Apostle, who shutteth out glorying from men not by the law of works, but by the law of faith. Where if the Jesuits would run to their old hole, that he meaneth the civil and outward works done of Jews and Gentiles not believing in Christ, their own disciples would hiss and clap their hands against them: for so much as so they should place greater excellency in works done infidelity, than in the faith that is in Christ; considering that the Apostle by that doing of the law there spoken of, affirmeth that more glory is pulled to men from God, then when their justification standeth by faith without works, wherein if there were yet any manner of scruple, yet the same is most evidently remedied of the Apostle, who by and by asking whether faith which he had mentioned in the former words were contrary to that law which likewise he had mentioned before: he (with great detestation) affirmeth, that faith not only doth not make the law void, or is contrary unto it: but that by faith he and all other of his fellows did establish the law. And indeed whither we consider the exact righteousness which God requireth in his law, it was never heretofore, nor ever shall be hereafter, that any the sons of Adam beside Christ, could or can precisely observe the law of God, or whither we consider that the Lord requireth sanctification in some acceptable measure, according to the gifts which he hath dealt to every of the faithful: there could not so much as the least and smallest commandment of God be once with a good heart (I say) not done, but not so much as endeavored by unbelievers, seeing all good works come from faith as the fountaine of them all. Now it is manifest that the faith of Christ is contrary to all such works proceeding from infidelity, as those which are not done of faith, nor proceede from a pure conscience purged by faith. Secondly we say that by our judgment of faith alone in the cause of salvation the justice of God is maintained, which by their fantasy of justification by works of the law is utterly overthrowne. For whilst the redemption and riddance from sin is placed in the death of Christ, and our stole and robe of righteousness, whereby we may confidently stand against the sentence of Gods judgment is placed in the obedience which our Saviour Christ yielded unto God his father in his own person: It is brought to pass that we have both a full &amp; perfect satisfaction for all our sins, and a whole and unmaimed righteousness, against which God in his most exact justice cannot proceede, no more than he can call his owne son unto a second death, or not accept his face, who is the righteousness of God himselfe. On the other side, if he should accept in Christ mens owne satisfaction for their sins, or the worke that they do after they be engraffed in this body of Christ for righteousness. It must necessarily follow, that God should be unjust in both, for he should take that for a perfect satisfaction which is not, (no man being able to make payment for the manifold talents wherewith he is indebted unto God) and that for a perfect and whole righteousness, which hath many transgressions of the law joined therewith: when therefore this justice (wherein his glory consisteth as well as in his mercy) would not suffer him to show mercy without a full recompence for sin, and an exact righteousness of the law: there remained only this way to accord his justice and mercy, and to cause them to embrace one another, that Christ should be both our surety to pay our debts, and our righteousness, by the which we might come into the presence of God. And if this imputative Justice without the works of the law be so strange in your ears; how cometh it to pass that yourselves hold that original sin of infants that are baptized is (without any work of theirs) pardoned in the blood of Christ: If imputation be generally refused in the Scripture, why have you admitted it in the remission of sins? why should you thrust it out in the other part of our salvation, which is righteousuess. And if God may impute mens sins to Christ being just, why may he not impute his righteousness to those that are not in themselves righteous? If therefore the pride of your heart doth carry you away that you will not amend yourselves at our correction, yet suffer yourselves to be corrected by yourselves. Having answered your question tell us we pray you, whether there is more honour to a King in freely forgiving his servant a debt, and giving him forthwith to be rich of; or to give him some means office or occupation, whereby he may in time (if he will) both pay his debt, and grow to wealth again. And for that you would seeme to be jealous of Gods glory, and of the commendation of Christs Justice, tell us further whither we or you shot nearer this mark: we which affirm that we have no manner of ability in ourselves, or by our natural power to do any thing which is good, but only by the grace of God in Christ; or you that affirme that we have some strength of nature in ourselves, which being helped by the grace of God in Christ is able to do the will of God. We which say with the Apostles that naturally we are stark dead; or you that say we are but half dead: we which give greater [note] power unto Christ in the healing of the soul, then to the Physician in healing of the body, or you which give no more unto Christ in healing the soul than is given to Physicians in healing the body: For when as the Physician through his cunning is able to recover a man that is halfe dead by his skill, notwithstanding cannot attaine to the restoring of a man that is dead: By this doctrine of yours you match and mate the Physicians cunning in his faculty, and our Saviour Christs in his. Finally we which make Christ a whole Saviour, or you that make him halfe a Saviour.</p></blockquote>

ence, and is so expounded by the words immediately following. And by this it is as much as if a man would say, they shall be made doers of the law, not that they were, but that they may be, that so the Jews might understand which are the hearers of the law, that they have need of the grace of the just justifier: that they may be doers. For that Augustine doth not acknowledge a second righteousness, whereby a man may be justified, shall once for all appeare by these places following. Every living man justifieth [note] himselfe before himselfe, not before thee. How before himselfe? In pleasing themselves and displeasing thee. But before thee no man is justified. Enter not therefore with me into judgment O Lord my God, how much soever I seem to be righteous. Thou bringest out of thy treasure a rule, which when thou appliest unto me I shall be found nought. And after having noted with thy servant, that all, even the Apostles, after they were Apostles must pray, forgive us our sins. He saith in the end; Let therefore the Apostles say, Let them hardly say forgive us our debts as we forgive our debtors. And when it is said to them why say you so? what be your debts? [note] Let them answere, because no man living shall be justified in thy sight. And in another place he saith; He said not I shall not be able to abide it, but who shall be able to abide it, for that the whole life of man is in a manner barked at by their owne sins, that all consciences are accused by their owne thoughts, that there is not found a chaste heart which presumeth of it owne righteousness. If therefore there is no chaste heart that can presume of it own righteousness, let every mans heart presume of Gods mercy, and let it say unto God; If thou O Lord wilt observe or marke up our iniquities, O Lord who shall abide it? But what hope is there? because with thee there is mercy: And what is this mercy but the sacrifice? And what is the sacrifice but that which was offered for us? even the innocent blood that was shed hath done away all the sins of the guilty: the price only which was given redeemeth all captive from the hands of the enemy that carried them captive. Therefore there is mercy with the Lord: for if there were not mercy with thee: and if thou wilt be nothing else but a Judge, and not merciful, and observe or marke up all our iniquities, and inquire into them, who shall be able to abide it; who should stand and say I am innocent. As for the other trash which they have in their next noteless note. First let the good Reader marke, that they confessing proofe of our part out of the Scripture that to justify is to impute justifice, bring nothing to the reproofe thereof beside their owne barking. For their sottish consequence that God should be either ignorant or unjust, if he should repute him as righteous which is not so, is unworthy any answere: for first he hath Christs righteousness, which being a true and perfect righteousness is as verily his through faith, as if he had done it in his owne person. Secondly, they wickedly speak of a man that being justified by faith, is made a member of the body of Christ; when they say he is wicked, impious and unjust: for although they have remnant of sin them, yet for [note] that the same is not imputed unto them, it is blasphemous against Christ to account his members impious, and to make him a head of any impious body. Thirdly, this is not so much against us as against the Apostle, who speaketh so plainly that God justifieth the wicked, that he loved us when we were his enemies, as we cannot speak plainer. Againe they impudently belie us, when they make the state of the question between us and them; Whither it be more glory to God, and more to the commendation of Christs justice, to call and count an evil man so continuing for just, then by his grace to make him of an evil one just indeed, and so truly to justify him. For they know well that we teach, that the justified man must walk in all the ways and commandments of God, and urge the keeping of the Law much more straightly then they do, which make partly sin no sin, partly make venial sins, which a little holy, or rather harlotry water may take away: yea so we urge it, as we pronounce that they never truly believed, nor were ever justified which remaine in the same wickedness wherein they were when they first obtained mercy. Now take away your slanderous and lying forgery of us, that a man justified by faith remaineth still in impiety. And we boldly affirme that there is more glory to God, and commendation to Christs Justice, to call and account an evil man just; theu to make him of an evil one just, in the works that are done in and by himselfe. And this we say not only as you beggarly Sophisters are wont to do, but with sound and substantial proofe. And first after this sort, it is more to Gods glory, whereby glory is to be taken from men and given unto God, then that whereby glory being added to men is taken from God: But by justification through faith alone, or by imputation, glory is taken from men, and given to God; and contrariwise in justification by the deeds of the law. Wherefore it is more to Gods glory that he justifieth us by faith only then by the works of the law. The first proposition is both evident in itself, and is confirmed by the plaine testimonies of the Apostle. The second is as evident by the same Apostle, who shutteth out glorying from men not by the law of works, but by the law of faith. Where if the Jesuits would run to their old hole, that he meaneth the civil and outward works done of Jews and Gentiles not believing in Christ, their own disciples would hiss and clap their hands against them: for so much as so they should place greater excellency in works done infidelity, than in the faith that is in Christ; considering that the Apostle by that doing of the law there spoken of, affirmeth that more glory is pulled to men from God, then when their justification standeth by faith without works, wherein if there were yet any manner of scruple, yet the same is most evidently remedied of the Apostle, who by and by asking whether faith which he had mentioned in the former words were contrary to that law which likewise he had mentioned before: he (with great detestation) affirmeth, that faith not only doth not make the law void, or is contrary unto it: but that by faith he and all other of his fellows did establish the law. And indeed whither we consider the exact righteousness which God requireth in his law, it was never heretofore, nor ever shall be hereafter, that any the sons of Adam beside Christ, could or can precisely observe the law of God, or whither we consider that the Lord requireth sanctification in some acceptable measure, according to the gifts which he hath dealt to every of the faithful: there could not so much as the least and smallest commandment of God be once with a good heart (I say) not done, but not so much as endeavored by unbelievers, seeing all good works come from faith as the fountaine of them all. Now it is manifest that the faith of Christ is contrary to all such works proceeding from infidelity, as those which are not done of faith, nor proceede from a pure conscience purged by faith. Secondly we say that by our judgment of faith alone in the cause of salvation the justice of God is maintained, which by their fantasy of justification by works of the law is utterly overthrowne. For whilst the redemption and riddance from sin is placed in the death of Christ, and our stole and robe of righteousness, whereby we may confidently stand against the sentence of Gods judgment is placed in the obedience which our Saviour Christ yielded unto God his father in his own person: It is brought to pass that we have both a full &amp; perfect satisfaction for all our sins, and a whole and unmaimed righteousness, against which God in his most exact justice cannot proceede, no more than he can call his owne son unto a second death, or not accept his face, who is the righteousness of God himselfe. On the other side, if he should accept in Christ mens owne satisfaction for their sins, or the worke that they do after they be engraffed in this body of Christ for righteousness. It must necessarily follow, that God should be unjust in both, for he should take that for a perfect satisfaction which is not, (no man being able to make payment for the manifold talents wherewith he is indebted unto God) and that for a perfect and whole righteousness, which hath many transgressions of the law joined therewith: when therefore this justice (wherein his glory consisteth as well as in his mercy) would not suffer him to show mercy without a full recompence for sin, and an exact righteousness of the law: there remained only this way to accord his justice and mercy, and to cause them to embrace one another, that Christ should be both our surety to pay our debts, and our righteousness, by the which we might come into the presence of God. And if this imputative Justice without the works of the law be so strange in your ears; how cometh it to pass that yourselves hold that original sin of infants that are baptized is (without any work of theirs) pardoned in the blood of Christ: If imputation be generally refused in the Scripture, why have you admitted it in the remission of sins? why should you thrust it out in the other part of our salvation, which is righteousuess. And if God may impute mens sins to Christ being just, why may he not impute his righteousness to those that are not in themselves righteous? If therefore the pride of your heart doth carry you away that you will not amend yourselves at our correction, yet suffer yourselves to be corrected by yourselves. Having answered your question tell us we pray you, whether there is more honour to a King in freely forgiving his servant a debt, and giving him forthwith to be rich of; or to give him some means office or occupation, whereby he may in time (if he will) both pay his debt, and grow to wealth again. And for that you would seeme to be jealous of Gods glory, and of the commendation of Christs Justice, tell us further whither we or you shot nearer this mark: we which affirm that we have no manner of ability in ourselves, or by our natural power to do any thing which is good, but only by the grace of God in Christ; or you that affirme that we have some strength of nature in ourselves, which being helped by the grace of God in Christ is able to do the will of God. We which say with the Apostles that naturally we are stark dead; or you that say we are but half dead: we which give greater [note] power unto Christ in the healing of the soul, then to the Physician in healing of the body, or you which give no more unto Christ in healing the soul than is given to Physicians in healing the body: For when as the Physician through his cunning is able to recover a man that is halfe dead by his skill, notwithstanding cannot attaine to the restoring of a man that is dead: By this doctrine of yours you match and mate the Physicians cunning in his faculty, and our Saviour Christs in his. Finally we which make Christ a whole Saviour, or you that make him halfe a Saviour.”

— Thomas Cartwright A Confutation Of The Rhemists Translation, Glosses And Annotations On The New Testament (Leiden, 1618), 331–34.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVerse.+13+For+%2A+%E2%80%96+not+the+hearers+of+the+Law+are+just+with+God%3A+but+the+doers+of+the+Law+%E2%80%96+shall+be+justified.+RHEM.+5.+%5B+13.+Not+the+hearers%5D+This+same+sentence+agreeable+also+to+Christs+words+%28Mat%2C+7.+21.%29+is+the+very+ground+of+S.+James+disputation+that+not+faith+alone%2C+but+good+works+also+do+justify%2C+%5Bnote%5D+Therefore+S.+Paul+%28howsoever+some+perversely+construe+his+words+in+other+places%29+meaneth+the+same+that+S.+James.+And+here+he+speaketh+%2A+not+properly+of+the+first+justification%2C+when+an+Infidel+or+ill+man+is+made+just%2C+who+had+no+acceptable+works+before+to+be+justified+by+%28of+which+kind+he+specially+meaneth+in+other+places+of+this+Epistle%29+but+he+speaketh+of+the+second+justification+or+increase+of+former+justice%2C+which+he+that+is+in+Gods+grace%2C+daily+proceedeth+in%2C+by+doing+all+kind+of+good+works%2C+which+be+justices%3A+and+for+doing+of+which%2C+he+is+just+indeed+before+God%2C+and+of+this+kind+doth+S.+James+namely+treate.+Which+is+directly+against+the+Heretics+of+this+time%2C+who+not+only+attribute+nothing+to+the+works+done+in+sin+and+infidelity%2C+but+esteeme+nothing+at+all+of+all+Christian+mens+works+toward+justification+and+salvation%2C+condemning+them+unclean%2C+sinful%2C+hypocritical%2C+and+Pharisaical%3A+which+is+directly+against+these+and+other+Scriptures%2C+and+plain+blaspheming+of+Christ+and+his+grace%2C+by+whose+spirit+and+cooperation+we+do+them%2C+CARTW.+5+%5B13.+Not+the+hearers.%5D+And+if+the+wresting+of+mens+words+from+their+honest+meaning+be+a+sin+worthy+of+death%2C+what+a+horrible+condemnation+waiteth+for+these+Jesuits%2C+that+pull+and+hale+the+Lords+words+to+a+quite+contrary+meaning+then+he+set+them+downe.+For+the+Apostle+%5Bnote%5D+having+disputed+in+the+former+chapter%2C+that+no+man+hath+any+righteousness+of+his+owne+by+any+manner+of+worke.+In+this+second+chapter+he+descendeth+to+the+special+cause+of+the+Jews%2C+which+of+all+other+might+seeme+to+be+exempted+from+that+generallity+of+Injustice%2C+wherewith+he+had+charged+the+whole+world%2C+the+opinion+of+whose+Justice+might+rise+in+that+they+had+not+only+an+exact+knowledge+of+the+law%2C+in+such+sort%2C+that+every+Jew+was+able+after+a+sort+to+be+a+guide+unto+the+blind%2C+and+a+Doctor+to+the+unlearned%3A+But+also+for+that+in+some+measure+of+the+holy+spirit+they+received%2C+many+of+%5Bnote%5D+them+gave+their+endeavor+to+do+the+works+of+the+law%2C+Now+the+Apostle+to+throw+down+this+stately+%26+proud+Castle+of+the+opinion+of+their+own+justice%2C+declareth+that+the+Justification+that+is+of+the+law%2C+standeth+not+in+the+hearing+or+knowledge+of+the+law%2C+no+if+%28possibly%29+they+could+attain+the+full+and+perfect+knowledge+thereof%2C+but+in+the+full+and+perfect+doing+and+accomplishment+thereof%2C+which+he+doth+more+expressly+set+forth+to+the+Galatians%2C+where+he+requireth+to+justification+by+the+works+%5Bnote%5D+of+the+law+a+performance+of+all+the+commandments%2C+and+that+constant+and+perpetual+without+any+intermission+or+interruption+by+stepping+a+hair+breadth+aside%2C+either+on+the+right+hand+or+on+the+left.+Now+that+the+Apostle+meaneth+not+those+only+which+either+heard+the+law+only%2C+or+did+the+outward+and+civil+works+of+the+law%2C+which+a+mere+natural+man+doth%2C+that+but+he+withal+compriseth+those+which+having+believed+brought+forth+by+the+work+of+the+spirit%2C+good+fruits%3B+it+appeareth+diversely.+First+by+the+writing+of+this+Epistle%2C+wherein+he+instructed+those+that+believed+in+Christ%2C+but+not+without+some+wavering+in+this+doctrine+which+he+so+largely+unfoldeth%2C+as+appeareth+in+that+his+desire+was+%5Bnote%5D+to+come+to+them%2C+that+they+might+be+strengthened.+Secondly+it+appeareth+by+the+testimony+of+the+Prophet+Ezechiel%2C+who+doth+evidently+as+well+by+that+which+goeth+before%2C+as+by+that+which+cometh+after%2C+refer+the+sentence+which+the+Apostle+draweth+from+him%2C+touching+the+name+of+God+blasphemed+amongst+the+Gentiles+for+the+Jews+sake%2C+unto+the+true+Church+and+spouse+of+Christ.+And+this+the+floating+and+unconstant+Jesuits+have+in+their+marginal+note+at+unawares+confessed.+wherein+they+say%3B+It+is+a+great+sin+that+by+the+evil+life+of+the+faithful+our+Lords+name+should+be+evil+%5Bnote%5D+spoken+of.+And+the+example+of+David%2C+a+faithful+man%2C+who+caused+the+name+of+God+to+be+blasphemed%2C+will+not+suffer+us+to+remaine+in+any+doubt%2C+but+that+the+cause+of+blaspheming+of+Gods+name+may+fall+into+the+Church+of+God.+Last+of+all%2C+this+is+evident+by+the+examples+of+Abraham+and+David%2C+which+the+%5Bnote%5D+Apostle+setteth+forth.+For+touching+Abraham%2C+he+obeying+the+voice+of+the+Lord+when+he+called+him+first+out+of+Chaldea%2C+and+then+out+of+Charan%2C+must+needs+even+then+have+faith%3B+yet+some+years+after+upon+the+promise+made+unto+him+of+the+blessed+seede+received+by+faith%2C+it+is+said+that+his+faith+did+justify+him%2C+and+not+his+good+works%2C+which+he+had+done+very+excellent+and+manifold.+So+that+although+he+were+a+doer+of+the+law+after+he+believed%2C+yet+still+his+Justification+is+placed+in+faith.+This+is+yet+more+manifest+in+the+example+of+David%2C+who+having+believed%2C+or+at+least+having+been+sanctified+more+than+40+years%2C+and+done+many+singular+acts+of+true+godliness+before+his+foul+crimes%2C+of+the+murder+of+many+his+faithful+servants+by+the+sword+of+the+Ammonites%2C+of+the+adultery+with+Bathsheba%2C+and+finally+of+the+drunkenness+that+he+threw+Uriah+into%2C+placeth+his+repaire+not+as+the+Jesuits+blasphemously+do+in+the+%5Bnote%5D+satisfaction+which+is+by+works%2C+but+in+faith+which+believeth+and+layeth+hold+of+remission+of+sins+by+Christ.+Whereby+appeareth+the+lewd+and+blockish+answer+of+the+Jesuits%2C+which+wrest+the+Apostles+denial+of+justification+by+works+of+the+law+to+those+civil+works+that+men+either+worke+by+the+light+and+strength+of+nature%2C+or+by+a+bare+knowledge+of+the+law%2C+without+any+assistance+of+Gods+spirit%2C+and+with+all+their+sottish+%CE%BA%CE%B1%CE%B9%CE%BD%CE%BF%CF%86%CE%BF%CE%BD%E1%BD%B7%CE%B1%2C+and+newfangled+distinction+of+the+first+justification+by+faith+alone%2C+and+of+the+second+justification+by+faith+and+works+together+is+crushed+all+to+pieces%3B+seeing+the+Apostles+ascribeth+the+justification+which+men+have+after+they+are+entered+into+the+way+of+righteousness%2C+not+to+works+%5Bnote%5D+done%2C+either+before+or+after+to+be+done%2C+but+unto+that+faith+which+being+first+planted+in+their+hearts+after+waxeth+and+groweh+to+that+proportion+that+the+Lord+seeth+good+in+his+great+wisdome+to+be+fit+for+every+one+according+to+the+place+he+occupieth+in+the+body+of+Christ%2C+and+trials+that+he+will+prove+them+with.+Hereupon+the+Apostle+in+the+stairs+whereby+we+orderly+come+to+the+kingdom+of+%5Bnote%5D+heaven%2C+doth+never+set+one+justification+after+another%2C+but+placeth+sanctification+after+justification.+And+if+this+new+and+unlawful+coine+of+distinction+were+true%2C+then+the+sentence+of+the+Apostle%2C+should+not+have+where+to+set+foot%2C+which+declareth+that+as+there+is+but+one+true+body%2C+one+spirit+whereby+%5Bnote%5D+that+body+liveth%2C+one+hope+of+our+calling%2C+one+true+Lord%2C+one+lawful+baptisme%2C+one+true+God%3A+so+there+is+but+one+true+and+holy+faith.+Touching+Saint+James+it+shall+be+answered+%28God+willing%29+in+the+proper+place.+As+for+Augustine%2C+he+utterly+refuseth+to+be+fraughted+with+such+beggarly+merchandise%2C+as+you+would+load+him+with.+But+so+%28saith+he%29+it+must+be+understood+that+the+doers+of+the+law+shall+be+justified%2C+that+we+may+know+that+they+are+not+otherwise+doers+of+the+law%2C+unless+they+be+justified%3A+that+justification+should+not+come+to+the+doers+of+the+law%2C+or+be+an+after+comer+to+them%2C+but+that+justification+should+go+before+the+doers+of+the+law%2C+which+cleane+overturneth+the+Jesuits+diversely.+First+that+he+maketh+the+doing+of+the+law+to+be+the+effect+of+justification%2C+which+they+make+the+cause%2C+and+call+it+the+second+Justification.+Secondly+because+he+maketh+one+Justification+which+always+goeth+before+good+works%2C+and+is+done+that+we+may+be+fit+for+good+works.+So+this+giveth+answere+to+his+words+alleged+in+the+next+Annotation.+For+those+words+meane+thus+much%2C+that+we+being+just+in+Christ%2C+because+we+have+in+him+done+the+law%2C+must+have+that+grace+ere+we+can+do+the+law%2C+as+apeareth+first+because+these+words+follow+upon+the+former+sentence%2C+and+is+so+expounded+by+the+words+immediately+following.+And+by+this+it+is+as+much+as+if+a+man+would+say%2C+they+shall+be+made+doers+of+the+law%2C+not+that+they+were%2C+but+that+they+may+be%2C+that+so+the+Jews+might+understand+which+are+the+hearers+of+the+law%2C+that+they+have+need+of+the+grace+of+the+just+justifier%3A+that+they+may+be+doers.+For+that+Augustine+doth+not+acknowledge+a+second+righteousness%2C+whereby+a+man+may+be+justified%2C+shall+once+for+all+appeare+by+these+places+following.+Every+living+man+justifieth+%5Bnote%5D+himselfe+before+himselfe%2C+not+before+thee.+How+before+himselfe%3F+In+pleasing+themselves+and+displeasing+thee.+But+before+thee+no+man+is+justified.+Enter+not+therefore+with+me+into+judgment+O+Lord+my+God%2C+how+much+soever+I+seem+to+be+righteous.+Thou+bringest+out+of+thy+treasure+a+rule%2C+which+when+thou+appliest+unto+me+I+shall+be+found+nought.+And+after+having+noted+with+thy+servant%2C+that+all%2C+even+the+Apostles%2C+after+they+were+Apostles+must+pray%2C+forgive+us+our+sins.+He+saith+in+the+end%3B+Let+therefore+the+Apostles+say%2C+Let+them+hardly+say+forgive+us+our+debts+as+we+forgive+our+debtors.+And+when+it+is+said+to+them+why+say+you+so%3F+what+be+your+debts%3F+%5Bnote%5D+Let+them+answere%2C+because+no+man+living+shall+be+justified+in+thy+sight.+And+in+another+place+he+saith%3B+He+said+not+I+shall+not+be+able+to+abide+it%2C+but+who+shall+be+able+to+abide+it%2C+for+that+the+whole+life+of+man+is+in+a+manner+barked+at+by+their+owne+sins%2C+that+all+consciences+are+accused+by+their+owne+thoughts%2C+that+there+is+not+found+a+chaste+heart+which+presumeth+of+it+owne+righteousness.+If+therefore+there+is+no+chaste+heart+that+can+presume+of+it+own+righteousness%2C+let+every+mans+heart+presume+of+Gods+mercy%2C+and+let+it+say+unto+God%3B+If+thou+O+Lord+wilt+observe+or+marke+up+our+iniquities%2C+O+Lord+who+shall+abide+it%3F+But+what+hope+is+there%3F+because+with+thee+there+is+mercy%3A+And+what+is+this+mercy+but+the+sacrifice%3F+And+what+is+the+sacrifice+but+that+which+was+offered+for+us%3F+even+the+innocent+blood+that+was+shed+hath+done+away+all+the+sins+of+the+guilty%3A+the+price+only+which+was+given+redeemeth+all+captive+from+the+hands+of+the+enemy+that+carried+them+captive.+Therefore+there+is+mercy+with+the+Lord%3A+for+if+there+were+not+mercy+with+thee%3A+and+if+thou+wilt+be+nothing+else+but+a+Judge%2C+and+not+merciful%2C+and+observe+or+marke+up+all+our+iniquities%2C+and+inquire+into+them%2C+who+shall+be+able+to+abide+it%3B+who+should+stand+and+say+I+am+innocent.+As+for+the+other+trash+which+they+have+in+their+next+noteless+note.+First+let+the+good+Reader+marke%2C+that+they+confessing+proofe+of+our+part+out+of+the+Scripture+that+to+justify+is+to+impute+justifice%2C+bring+nothing+to+the+reproofe+thereof+beside+their+owne+barking.+For+their+sottish+consequence+that+God+should+be+either+ignorant+or+unjust%2C+if+he+should+repute+him+as+righteous+which+is+not+so%2C+is+unworthy+any+answere%3A+for+first+he+hath+Christs+righteousness%2C+which+being+a+true+and+perfect+righteousness+is+as+verily+his+through+faith%2C+as+if+he+had+done+it+in+his+owne+person.+Secondly%2C+they+wickedly+speak+of+a+man+that+being+justified+by+faith%2C+is+made+a+member+of+the+body+of+Christ%3B+when+they+say+he+is+wicked%2C+impious+and+unjust%3A+for+although+they+have+remnant+of+sin+them%2C+yet+for+%5Bnote%5D+that+the+same+is+not+imputed+unto+them%2C+it+is+blasphemous+against+Christ+to+account+his+members+impious%2C+and+to+make+him+a+head+of+any+impious+body.+Thirdly%2C+this+is+not+so+much+against+us+as+against+the+Apostle%2C+who+speaketh+so+plainly+that+God+justifieth+the+wicked%2C+that+he+loved+us+when+we+were+his+enemies%2C+as+we+cannot+speak+plainer.+Againe+they+impudently+belie+us%2C+when+they+make+the+state+of+the+question+between+us+and+them%3B+Whither+it+be+more+glory+to+God%2C+and+more+to+the+commendation+of+Christs+justice%2C+to+call+and+count+an+evil+man+so+continuing+for+just%2C+then+by+his+grace+to+make+him+of+an+evil+one+just+indeed%2C+and+so+truly+to+justify+him.+For+they+know+well+that+we+teach%2C+that+the+justified+man+must+walk+in+all+the+ways+and+commandments+of+God%2C+and+urge+the+keeping+of+the+Law+much+more+straightly+then+they+do%2C+which+make+partly+sin+no+sin%2C+partly+make+venial+sins%2C+which+a+little+holy%2C+or+rather+harlotry+water+may+take+away%3A+yea+so+we+urge+it%2C+as+we+pronounce+that+they+never+truly+believed%2C+nor+were+ever+justified+which+remaine+in+the+same+wickedness+wherein+they+were+when+they+first+obtained+mercy.+Now+take+away+your+slanderous+and+lying+forgery+of+us%2C+that+a+man+justified+by+faith+remaineth+still+in+impiety.+And+we+boldly+affirme+that+there+is+more+glory+to+God%2C+and+commendation+to+Christs+Justice%2C+to+call+and+account+an+evil+man+just%3B+theu+to+make+him+of+an+evil+one+just%2C+in+the+works+that+are+done+in+and+by+himselfe.+And+this+we+say+not+only+as+you+beggarly+Sophisters+are+wont+to+do%2C+but+with+sound+and+substantial+proofe.+And+first+after+this+sort%2C+it+is+more+to+Gods+glory%2C+whereby+glory+is+to+be+taken+from+men+and+given+unto+God%2C+then+that+whereby+glory+being+added+to+men+is+taken+from+God%3A+But+by+justification+through+faith+alone%2C+or+by+imputation%2C+glory+is+taken+from+men%2C+and+given+to+God%3B+and+contrariwise+in+justification+by+the+deeds+of+the+law.+Wherefore+it+is+more+to+Gods+glory+that+he+justifieth+us+by+faith+only+then+by+the+works+of+the+law.+The+first+proposition+is+both+evident+in+itself%2C+and+is+confirmed+by+the+plaine+testimonies+of+the+Apostle.+The+second+is+as+evident+by+the+same+Apostle%2C+who+shutteth+out+glorying+from+men+not+by+the+law+of+works%2C+but+by+the+law+of+faith.+Where+if+the+Jesuits+would+run+to+their+old+hole%2C+that+he+meaneth+the+civil+and+outward+works+done+of+Jews+and+Gentiles+not+believing+in+Christ%2C+their+own+disciples+would+hiss+and+clap+their+hands+against+them%3A+for+so+much+as+so+they+should+place+greater+excellency+in+works+done+infidelity%2C+than+in+the+faith+that+is+in+Christ%3B+considering+that+the+Apostle+by+that+doing+of+the+law+there+spoken+of%2C+affirmeth+that+more+glory+is+pulled+to+men+from+God%2C+then+when+their+justification+standeth+by+faith+without+works%2C+wherein+if+there+were+yet+any+manner+of+scruple%2C+yet+the+same+is+most+evidently+remedied+of+the+Apostle%2C+who+by+and+by+asking+whether+faith+which+he+had+mentioned+in+the+former+words+were+contrary+to+that+law+which+likewise+he+had+mentioned+before%3A+he+%28with+great+detestation%29+affirmeth%2C+that+faith+not+only+doth+not+make+the+law+void%2C+or+is+contrary+unto+it%3A+but+that+by+faith+he+and+all+other+of+his+fellows+did+establish+the+law.+And+indeed+whither+we+consider+the+exact+righteousness+which+God+requireth+in+his+law%2C+it+was+never+heretofore%2C+nor+ever+shall+be+hereafter%2C+that+any+the+sons+of+Adam+beside+Christ%2C+could+or+can+precisely+observe+the+law+of+God%2C+or+whither+we+consider+that+the+Lord+requireth+sanctification+in+some+acceptable+measure%2C+according+to+the+gifts+which+he+hath+dealt+to+every+of+the+faithful%3A+there+could+not+so+much+as+the+least+and+smallest+commandment+of+God+be+once+with+a+good+heart+%28I+say%29+not+done%2C+but+not+so+much+as+endeavored+by+unbelievers%2C+seeing+all+good+works+come+from+faith+as+the+fountaine+of+them+all.+Now+it+is+manifest+that+the+faith+of+Christ+is+contrary+to+all+such+works+proceeding+from+infidelity%2C+as+those+which+are+not+done+of+faith%2C+nor+proceede+from+a+pure+conscience+purged+by+faith.+Secondly+we+say+that+by+our+judgment+of+faith+alone+in+the+cause+of+salvation+the+justice+of+God+is+maintained%2C+which+by+their+fantasy+of+justification+by+works+of+the+law+is+utterly+overthrowne.+For+whilst+the+redemption+and+riddance+from+sin+is+placed+in+the+death+of+Christ%2C+and+our+stole+and+robe+of+righteousness%2C+whereby+we+may+confidently+stand+against+the+sentence+of+Gods+judgment+is+placed+in+the+obedience+which+our+Saviour+Christ+yielded+unto+God+his+father+in+his+own+person%3A+It+is+brought+to+pass+that+we+have+both+a+full+%26+perfect+satisfaction+for+all+our+sins%2C+and+a+whole+and+unmaimed+righteousness%2C+against+which+God+in+his+most+exact+justice+cannot+proceede%2C+no+more+than+he+can+call+his+owne+son+unto+a+second+death%2C+or+not+accept+his+face%2C+who+is+the+righteousness+of+God+himselfe.+On+the+other+side%2C+if+he+should+accept+in+Christ+mens+owne+satisfaction+for+their+sins%2C+or+the+worke+that+they+do+after+they+be+engraffed+in+this+body+of+Christ+for+righteousness.+It+must+necessarily+follow%2C+that+God+should+be+unjust+in+both%2C+for+he+should+take+that+for+a+perfect+satisfaction+which+is+not%2C+%28no+man+being+able+to+make+payment+for+the+manifold+talents+wherewith+he+is+indebted+unto+God%29+and+that+for+a+perfect+and+whole+righteousness%2C+which+hath+many+transgressions+of+the+law+joined+therewith%3A+when+therefore+this+justice+%28wherein+his+glory+consisteth+as+well+as+in+his+mercy%29+would+not+suffer+him+to+show+mercy+without+a+full+recompence+for+sin%2C+and+an+exact+righteousness+of+the+law%3A+there+remained+only+this+way+to+accord+his+justice+and+mercy%2C+and+to+cause+them+to+embrace+one+another%2C+that+Christ+should+be+both+our+surety+to+pay+our+debts%2C+and+our+righteousness%2C+by+the+which+we+might+come+into+the+presence+of+God.+And+if+this+imputative+Justice+without+the+works+of+the+law+be+so+strange+in+your+ears%3B+how+cometh+it+to+pass+that+yourselves+hold+that+original+sin+of+infants+that+are+baptized+is+%28without+any+work+of+theirs%29+pardoned+in+the+blood+of+Christ%3A+If+imputation+be+generally+refused+in+the+Scripture%2C+why+have+you+admitted+it+in+the+remission+of+sins%3F+why+should+you+thrust+it+out+in+the+other+part+of+our+salvation%2C+which+is+righteousuess.+And+if+God+may+impute+mens+sins+to+Christ+being+just%2C+why+may+he+not+impute+his+righteousness+to+those+that+are+not+in+themselves+righteous%3F+If+therefore+the+pride+of+your+heart+doth+carry+you+away+that+you+will+not+amend+yourselves+at+our+correction%2C+yet+suffer+yourselves+to+be+corrected+by+yourselves.+Having+answered+your+question+tell+us+we+pray+you%2C+whether+there+is+more+honour+to+a+King+in+freely+forgiving+his+servant+a+debt%2C+and+giving+him+forthwith+to+be+rich+of%3B+or+to+give+him+some+means+office+or+occupation%2C+whereby+he+may+in+time+%28if+he+will%29+both+pay+his+debt%2C+and+grow+to+wealth+again.+And+for+that+you+would+seeme+to+be+jealous+of+Gods+glory%2C+and+of+the+commendation+of+Christs+Justice%2C+tell+us+further+whither+we+or+you+shot+nearer+this+mark%3A+we+which+affirm+that+we+have+no+manner+of+ability+in+ourselves%2C+or+by+our+natural+power+to+do+any+thing+which+is+good%2C+but+only+by+the+grace+of+God+in+Christ%3B+or+you+that+affirme+that+we+have+some+strength+of+nature+in+ourselves%2C+which+being+helped+by+the+grace+of+God+in+Christ+is+able+to+do+the+will+of+God.+We+which+say+with+the+Apostles+that+naturally+we+are+stark+dead%3B+or+you+that+say+we+are+but+half+dead%3A+we+which+give+greater+%5Bnote%5D+power+unto+Christ+in+the+healing+of+the+soul%2C+then+to+the+Physician+in+healing+of+the+body%2C+or+you+which+give+no+more+unto+Christ+in+healing+the+soul+than+is+given+to+Physicians+in+healing+the+body%3A+For+when+as+the+Physician+through+his+cunning+is+able+to+recover+a+man+that+is+halfe+dead+by+his+skill%2C+notwithstanding+cannot+attaine+to+the+restoring+of+a+man+that+is+dead%3A+By+this+doctrine+of+yours+you+match+and+mate+the+Physicians+cunning+in+his+faculty%2C+and+our+Saviour+Christs+in+his.+Finally+we+which+make+Christ+a+whole+Saviour%2C+or+you+that+make+him+halfe+a+Saviour.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright+A+Confutation+Of+The+Rhemists+Translation%2C+Glosses+And+Annotations+On+The+New+Testament+%28Leiden%2C+1618%29%2C+331%E2%80%9334.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F823c0ad173.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/823c0ad173.html">Permalink</a><a class="src" href="https://heidelblog.net/2017/10/thomas-cartwright-contra-rome-on-romans-213/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Neither have we departed from the doctrine of the Church, in that we teach that faith only justifies. For many of the ancient have used this form of words [though they also affirmed justification involves an inherent righteousness], as: Origen on Rom. 3: Dicit apostolus sufficere solius fidei justificationem, ita ut credens quis tantummodo justificetur, etiamsi nihil ab eo operis fuerit expletum. [The apostle says that the justification of faith alone is sufficient, so that a man is justified by believing alone, even if no work has been performed by him.] Hilary, can. 8. in Matthew: Fides sola justificat. [Faith alone justifies.] Basil, Homily on Humility: Haec est perfecta &amp; integra gloriatio in Deo, quando neque ob justitiam suam quis se iactat, sed novit quidem seipsum verae justitiae indigum, solâ autem fide in Christum justificatum. [This is perfect and complete boasting in God: when a person does not boast on account of his own righteousness, but knows himself indeed to be lacking true righteousness, and is justified by faith alone in Christ.] Ambrose on Rom. 3: Iustificati sunt gratis, quia nihil operantes, neque vicem reddentes, sola fide justificati sunt dono Dei. [They are justified freely, because, doing nothing and rendering nothing in return, they are justified by faith alone, by the gift of God.] Chrysostom, Homily on Faith and the Law of Nature: Eum qui operatur opera iustitiae sine fide non potes probare vivum esse, fidem absque operibus possum monstrare, et vixisse, et regnum coelorum assecutam, nullus sine fide vitam habuit, latro autem credidit tantum, et iustificatus est. [You cannot prove that one who performs works of righteousness without faith is alive; but I can show that faith without works has both lived and attained the kingdom of Heaven. No one has had life without faith; but the thief believed only, and was justified.] Augustine bk. 1, Contra the Two Epistles of Pelagius, ch. 21 Quantaelibet fuisse virtutis antiquos praedices justos, non eos salvos fecit nisi fides mediatoris. [However great you may proclaim the virtue of the righteous of old to have been, it did not save them except the faith of the Mediator.] 83 Questions, q. 76 Si quis cum crediderit mox de hac vita decesserit, iustificatio fidei manet cum illo: nec praecedentibus bonis operibus, quia non merito ad illam, sed gratia pervenit, nec consequentibus, quia in hac vita esse non sinitur. [If anyone, after he has believed, immediately departs from this life, the justification of faith remains with him: not by preceding good works, because he attained to it not by merit but by grace; nor by subsequent works, because he is not permitted to remain in this life.] Theophylact, on Gal. 3: Nunc plane ostendit apostolus, fidem vel solam, iustificandi habere in se virtutem. [Now the apostle plainly shows that faith alone has within itself the power of justifying.] Bernard Sermon 22 on Canticles: Quisquis pro peccatis compunctus, esurit et sitit iustitiam, credat in te qui iustificas impium, at solam iustificatus per fidem, pacem habebitad te. [Whoever, pierced with sorrow for sins, hungers and thirsts for righteousness, let him believe in you who justifies the ungodly; and thus, justified by faith alone, he will have peace with you.] Epistle 77: Qui crediderit et baptizatus fuerit salvus erit. Caute, inquit, non repetiit, qui vero baptizatus non fuerit, condenabitur, sed tantum qui vero non crediderit, innuens nimirum solam fidem interdum sufficere ad salutem, et sine illa sufficere nihil. [He who has believed and has been baptized shall be saved. He carefully did not repeat, ‘but he who has not been baptized shall be condemned,’ but only, ‘he who has not believed,’ clearly indicating that faith alone sometimes suffices for salvation, and that without it nothing suffices.] Sometimes by these phrases of speech they exclude: [1] All that may be without supernatural knowledge, all that may be without a true profession. [2] Sometimes the necessity of good works in act or external good works.

3. The power of nature without illumination and grace.

4. The power of the Law.

5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.</p></blockquote>

Quantaelibet fuisse virtutis antiquos praedices justos, non eos salvos fecit nisi fides mediatoris. [However great you may proclaim the virtue of the righteous of old to have been, it did not save them except the faith of the Mediator.] 83 Questions, q. 76 Si quis cum crediderit mox de hac vita decesserit, iustificatio fidei manet cum illo: nec praecedentibus bonis operibus, quia non merito ad illam, sed gratia pervenit, nec consequentibus, quia in hac vita esse non sinitur. [If anyone, after he has believed, immediately departs from this life, the justification of faith remains with him: not by preceding good works, because he attained to it not by merit but by grace; nor by subsequent works, because he is not permitted to remain in this life.] Theophylact, on Gal. 3: Nunc plane ostendit apostolus, fidem vel solam, iustificandi habere in se virtutem. [Now the apostle plainly shows that faith alone has within itself the power of justifying.] Bernard Sermon 22 on Canticles: Quisquis pro peccatis compunctus, esurit et sitit iustitiam, credat in te qui iustificas impium, at solam iustificatus per fidem, pacem habebitad te. [Whoever, pierced with sorrow for sins, hungers and thirsts for righteousness, let him believe in you who justifies the ungodly; and thus, justified by faith alone, he will have peace with you.] Epistle 77: Qui crediderit et baptizatus fuerit salvus erit. Caute, inquit, non repetiit, qui vero baptizatus non fuerit, condenabitur, sed tantum qui vero non crediderit, innuens nimirum solam fidem interdum sufficere ad salutem, et sine illa sufficere nihil. [He who has believed and has been baptized shall be saved. He carefully did not repeat, ‘but he who has not been baptized shall be condemned,’ but only, ‘he who has not believed,’ clearly indicating that faith alone sometimes suffices for salvation, and that without it nothing suffices.] Sometimes by these phrases of speech they exclude: [1] All that may be without supernatural knowledge, all that may be without a true profession. [2] Sometimes the necessity of good works in act or external good works.

3. The power of nature without illumination and grace.

4. The power of the Law.

5. The sufficiency of anything found in us to make us stand in judgment, to abide the trial, and not to fear condemnation. And in this sense faith only is said to justify, that is, the only mercy of God and merit of Christ apprehended by faith: and then the meaning of their speech is that only the persuasion and assured trust that they have, to be accepted of God for Christ’s sake, is that that makes them stand in judgment, without fear of condemnation. And in this sense all the divines formerly alleged for proof of the insufficiency of all our inherent righteousness, and the trust which we should have in the only mercy of God, and merit of Christ, do teach as we do, that faith only justifies. For neither they nor we exclude from the work of justification, [1] the action of God as the supreme and highest cause of our justification: for it is He that remits sin, and receives us to grace: [2] nor the merit of Christ, as that for which God inclines to show mercy to us, and to respect us: [3] nor the remission of sins, gracious acceptation, and grant of the gift of righteousness, as that by which we are formally justified: [4] nor those works of preventing grace, whereby out of the general apprehension of faith, God works in us dislike of our former condition, desire to be reconciled to God, to have remission of that [which] is past, and grace hereafter to decline the like evils, and to do contrary good things. For by these we are prepared, disposed and fitted for justification; without these none are justified. And in this sense, and to imply a necessity of these to be found in us, sometimes the Fathers and others say that we are not justified by faith only. And we all agree, that it is not our conversion to God, nor the change we find in ourselves, that can any way make us stand in judgment without fear, and look for any good from God, otherwise than in that we find ourselves so disposed and fitted, as is necessary for justification, whence we assure ourselves God will in mercy accept us for Christ’s sake.”

ved.+He+carefully+did+not+repeat%2C+%E2%80%98but+he+who+has+not+been+baptized+shall+be+condemned%2C%E2%80%99+but+only%2C+%E2%80%98he+who+has+not+believed%2C%E2%80%99+clearly+indicating+that+faith+alone+sometimes+suffices+for+salvation%2C+and+that+without+it+nothing+suffices.%5D+Sometimes+by+these+phrases+of+speech+they+exclude%3A+%5B1%5D+All+that+may+be+without+supernatural+knowledge%2C+all+that+may+be+without+a+true+profession.+%5B2%5D+Sometimes+the+necessity+of+good+works+in+act+or+external+good+works.+3.+The+power+of+nature+without+illumination+and+grace.+4.+The+power+of+the+Law.+5.+The+sufficiency+of+anything+found+in+us+to+make+us+stand+in+judgment%2C+to+abide+the+trial%2C+and+not+to+fear+condemnation.+And+in+this+sense+faith+only+is+said+to+justify%2C+that+is%2C+the+only+mercy+of+God+and+merit+of+Christ+apprehended+by+faith%3A+and+then+the+meaning+of+their+speech+is+that+only+the+persuasion+and+assured+trust+that+they+have%2C+to+be+accepted+of+God+for+Christ%E2%80%99s+sake%2C+is+that+that+makes+them+stand+in+judgment%2C+without+fear+of+condemnation.+And+in+this+sense+all+the+divines+formerly+alleged+for+proof+of+the+insufficiency+of+all+our+inherent+righteousness%2C+and+the+trust+which+we+should+have+in+the+only+mercy+of+God%2C+and+merit+of+Christ%2C+do+teach+as+we+do%2C+that+faith+only+justifies.+For+neither+they+nor+we+exclude+from+the+work+of+justification%2C+%5B1%5D+the+action+of+God+as+the+supreme+and+highest+cause+of+our+justification%3A+for+it+is+He+that+remits+sin%2C+and+receives+us+to+grace%3A+%5B2%5D+nor+the+merit+of+Christ%2C+as+that+for+which+God+inclines+to+show+mercy+to+us%2C+and+to+respect+us%3A+%5B3%5D+nor+the+remission+of+sins%2C+gracious+acceptation%2C+and+grant+of+the+gift+of+righteousness%2C+as+that+by+which+we+are+formally+justified%3A+%5B4%5D+nor+those+works+of+preventing+grace%2C+whereby+out+of+the+general+apprehension+of+faith%2C+God+works+in+us+dislike+of+our+former+condition%2C+desire+to+be+reconciled+to+God%2C+to+have+remission+of+that+%5Bwhich%5D+is+past%2C+and+grace+hereafter+to+decline+the+like+evils%2C+and+to+do+contrary+good+things.+For+by+these+we+are+prepared%2C+disposed+and+fitted+for+justification%3B+without+these+none+are+justified.+And+in+this+sense%2C+and+to+imply+a+necessity+of+these+to+be+found+in+us%2C+sometimes+the+Fathers+and+others+say+that+we+are+not+justified+by+faith+only.+And+we+all+agree%2C+that+it+is+not+our+conversion+to+God%2C+nor+the+change+we+find+in+ourselves%2C+that+can+any+way+make+us+stand+in+judgment+without+fear%2C+and+look+for+any+good+from+God%2C+otherwise+than+in+that+we+find+ourselves+so+disposed+and+fitted%2C+as+is+necessary+for+justification%2C+whence+we+assure+ourselves+God+will+in+mercy+accept+us+for+Christ%E2%80%99s+sake.%E2%80%9D%0A%0A%E2%80%94+Richard+Field%2C+Other+citations+%28work+not+named%29%2C+Of+the+Church...+%28Oxford%3A+Turner%2C+1628%29%2C+bk.+3%2C+appendix%2C+ch.+11%2C+pp.+323-24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16a6aa85d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16a6aa85d0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=Neither%20have%20we%20departed%20from%20the,mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake&amp;text=Neither%20have%20we%20departed%20from%20the%20doctrine%20of&amp;text=will%20in%20mercy%20accept%20us%20for%20Christ%E2%80%99s%20sake" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>779. Now besides this justification of the sinner which has its place in the first conversion of the sinner to God and which is renewed so long as he repents (for the faithful life is the continual exercise of faith), he is also given a justification of the just which is by works, which James discusses.

780. By this we understand the declaration of God with respect to the accusation of Satan, since in the regenerated sinner are true, colored, and indubitable signs and proofs of true faith which are pleasing to Him, and which are required among the heirs of the goods of grace.

781. This second justification is necessarily connected with the first (it is necessary to distinguish this from the variation of the Papists) so that it cannot be separated from it for any reason.</p></blockquote>

<blockquote><p>…this is not to be conceived in the way of some transient actions that pass away and leave not so much as a relative change. No, for when God does justify us at first, we are upon our believing put into a state and a fixed condition of peace with God. Thus the Scripture speaks of it as a state, like that of sanctification and glorification; so that while we are sleeping we are justified, because put into that estate, although we do not then actually believe. The first act therefore of faith receiving Christ, in whom we are justified, is like the putting of one into a state of marriage, or of magistracy: Though the first act pass away, yet the relative change it has made continues always; We are not justified by the habit of faith, but by the act, and yet after the first act we stand justified, though we are not all the day long actually believing. Its true, many learned divines say justification is a continued action, and it may be granted in this sense, that God does daily justify believers, even as He constantly preserves them in their natural being; but it is not true in this sense, as if we were put into a new state of justification every day. This is not only to make a first and a second justification, but a thousand justifications; remission of sins and imputation of Christ’s righteousness are reiterated; but justification besides these does connote a fixed estate of the justified person, which is but once, and the Mediator of the Covenant of grace does so firmly uphold this privilege, that there shall never be any total intercission of it, neither do ever any plenarily apostatize from this wonderful favor, that once received it.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…this is not to be conceived in the way of some transient actions that pass away and leave not so much as a relative change. No, for when God does justify us at first, we are upon our believing put into a state and a fixed condition of peace with God. Thus the Scripture speaks of it as a state, like that of sanctification and glorification; so that while we are sleeping we are justified, because put into that estate, although we do not then actually believe. The first act therefore of faith receiving Christ, in whom we are justified, is like the putting of one into a state of marriage, or of magistracy: Though the first act pass away, yet the relative change it has made continues always; We are not justified by the habit of faith, but by the act, and yet after the first act we stand justified, though we are not all the day long actually believing. Its true, many learned divines say justification is a continued action, and it may be granted in this sense, that God does daily justify believers, even as He constantly preserves them in their natural being; but it is not true in this sense, as if we were put into a new state of justification every day. This is not only to make a first and a second justification, but a thousand justifications; remission of sins and imputation of Christ’s righteousness are reiterated; but justification besides these does connote a fixed estate of the justified person, which is but once, and the Mediator of the Covenant of grace does so firmly uphold this privilege, that there shall never be any total intercission of it, neither do ever any plenarily apostatize from this wonderful favor, that once received it.”

— Anthony Burgess, The True Doctrine of Justification… (London: Underhill, 1654), pt. 2, | sermon 13, n.p.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6this+is+not+to+be+conceived+in+the+way+of+some+transient+actions+that+pass+away+and+leave+not+so+much+as+a+relative+change.+No%2C+for+when+God+does+justify+us+at+first%2C+we+are+upon+our+believing+put+into+a+state+and+a+fixed+condition+of+peace+with+God.+Thus+the+Scripture+speaks+of+it+as+a+state%2C+like+that+of+sanctification+and+glorification%3B+so+that+while+we+are+sleeping+we+are+justified%2C+because+put+into+that+estate%2C+although+we+do+not+then+actually+believe.+The+first+act+therefore+of+faith+receiving+Christ%2C+in+whom+we+are+justified%2C+is+like+the+putting+of+one+into+a+state+of+marriage%2C+or+of+magistracy%3A+Though+the+first+act+pass+away%2C+yet+the+relative+change+it+has+made+continues+always%3B+We+are+not+justified+by+the+habit+of+faith%2C+but+by+the+act%2C+and+yet+after+the+first+act+we+stand+justified%2C+though+we+are+not+all+the+day+long+actually+believing.+Its+true%2C+many+learned+divines+say+justification+is+a+continued+action%2C+and+it+may+be+granted+in+this+sense%2C+that+God+does+daily+justify+believers%2C+even+as+He+constantly+preserves+them+in+their+natural+being%3B+but+it+is+not+true+in+this+sense%2C+as+if+we+were+put+into+a+new+state+of+justification+every+day.+This+is+not+only+to+make+a+first+and+a+second+justification%2C+but+a+thousand+justifications%3B+remission+of+sins+and+imputation+of+Christ%E2%80%99s+righteousness+are+reiterated%3B+but+justification+besides+these+does+connote+a+fixed+estate+of+the+justified+person%2C+which+is+but+once%2C+and+the+Mediator+of+the+Covenant+of+grace+does+so+firmly+uphold+this+privilege%2C+that+there+shall+never+be+any+total+intercission+of+it%2C+neither+do+ever+any+plenarily+apostatize+from+this+wonderful+favor%2C+that+once+received+it.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification%E2%80%A6+%28London%3A+Underhill%2C+1654%29%2C+pt.+2%2C+%7C+sermon+13%2C+n.p.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8f093ce78a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8f093ce78a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=this%20is%20not%20to%20be%20conceived,wonderful%20favor%2C%20that%20once%20received%20it&amp;text=this%20is%20not%20to%20be%20conceived%20in%20the&amp;text=from%20this%20wonderful%20favor%2C%20that%20once%20received%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. We are justified by works, and not by faith only; by which are meant the fruits of sanctification: for true faith and true holiness will show itself by good works; faith gives us the first right, but works continue it, for otherwise a course of sin would put us into a state of damnation again: therefore at the Last Judgment these are considered, Rev. 20:12, ‘And the dead were judged out of those things which were written in the books, according to their works.’ Mt. 25:35-36: ‘For I was an hungry, and ye gave me meat; I was thirsty, and ye gave me drink; I was a stranger, and ye took me in; naked, and ye cloathed me; I was sick, and ye visited me; I was in prison, and ye came unto me.’ Faith is our consent, but obedience verifies it, or is our performance of what we consented unto; the one as covenant-making, the other as covenant-keeping; we are admitted by covenant-making, but continued in our privileges by covenant-keeping, Ps. 25:10, ‘All the paths of the Lord are mercy and truth unto such as keep his Covenant.’</p></blockquote>

<main class="wrap"><figure class="quote" id="q-f7522500b5" data-kw="">
<blockquote><p>That King Hezekiah rent his clothes. He likewise adds the outward expressions of repentance, the “rending of the clothes and wearing sackcloth,” sprinkling of ashes, and other things of the same kind; for these were the ordinary signs of repentance, when, under the weight of any calamity by which they were afflicted, they confessed their guilt before God and implored pardon from him.

Wonderful is the modesty of the holy king, who, after having performed so many illustrious works, and after having been adorned by the excellence of so many virtues, does not hesitate to prostrate himself humbly before God; and, on the other hand, wonderful is his courage and the steadfastness of his faith, in not being hindered by the weight of so heavy a temptation from freely seeking God by whom he was so severely smitten.

Scarcely do we find one man in a hundred who does not murmur if God treats him with any degree of severity, who does not bring forward his good deeds as a ground of complaint, and remonstrate that he has been unjustly rewarded. Other men, when God does not comply with their wishes, complain that their worship of God has served no good purpose.

We perceive nothing of this kind in Hezekiah, who, though he is conscious of possessing uncommon piety, does not shrink from a confession of guilt, and therefore if we desire to turn away God’s anger, and to experience his favour in adversity, we must testify our repentance and sincerely acknowledge our guilt; for adversity does not fall out to us by chance, but is the method by which God arouses us to repentance.

True, indeed, sackcloth and ashes will be of little avail, if they be not preceded by the inward feelings of the heart; for we know that hypocrites are abundantly liberal in the use of ceremonies; but as we have formerly said, the Holy Spirit justly commends those exercises, when they are directed to their proper object. And indeed it was a proof of uncommon piety and modesty, that the pious king and the whole nation excited themselves in this manner to fear God, and that he made a voluntary acknowledgement of guilt in a form attended by wretched filthiness; for we know how unwilling kings are to let themselves down from their rank.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Third</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 8: 106-07.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0da00a44f2" data-kw="">
<blockquote><p>I saw the evil of legal preaching, which lies in one of two things, or in both. 1. In laying too much stress upon the works of the law, our duties and strength: Or, 2. In pressing evangelical doctrines without an eye to that which is the spring of the church’s edification, the Spirit of the Lord… O Lord, thou knowest how much of it is in this poor church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Of Legal Preaching” in Memoirs of the Rev. Thomas Halyburton</cite>, (William Collins, 1838), 261-62.</span></figcaption>

</figure><figure class="quote" id="q-4e1e545f0c" data-kw="">
<blockquote><p>The next Sin we shall take notice of, is Murder; which surely, if any, hath a crying voice. Abel’s blood soon wrought Heaven with its cry for vengeance. And how many Murders have we daily heard of, committed amongst us? How common is it grown for the Gallants of our times, to Sacrifice one another Lives to their Lusts, to their Passion, or their Pride? And I wish that the impunity of some, may not have encouraged others. Is it not time then for God to take the Sword into his own hand, and let his audacious Creatures know, that their Lives they are so prodigal of are his, and at his disposure? And if they value them at no higher rates, they have no reason to complain if they are taken away, since they knew no better what to do with them. If indeed they are so weary of the world, they shall stay no longer in it.

And here especially, let me bring to remembrance that Heathenish practice of Duelling; which of late is grown so much in fashion, that none must pass for a Gentleman, but he who dare murder his brother; and to be an Hector, is more commendable than a Christian. The Example and Precepts of that pattern, and Master of Meekness the Holy Jesus, the very mention of them is little less than ridiculous to our Brave Fellows.

Alas, those Precepts seem suited to the mean state of Christianity, when poor Fishermen and Tent-makers were the Preachers, and tradesmen like them, were for the most part Retainers to it; but we must have them calculated again for those of a more Elevated Meridian; viz. for our Gentry who had the luck to be born of Parents that were called Christian. The Jesuit must fit them with rules that shall allow for their birth and breeding: for surely Christ never meant to have Gentlemen his Disciples, when he tied them up to such strict commands, not practicable by men of their blood and Spirits.

Religion now adays is thought to emasculate men, and render them tame and cowardly. Basely to submit themselves to their own unruly passions, with these is Courage; To be Bears and Tigers, is accounted Gentle and Manly. These are the Lordly creatures that are so tender of their Honours, that they will rather violate the Laws of the great God, than the least Punctilio of it. To humour or win a Fantastical Mistress (’tis well they are not in hearing when I call her so) they durst venture upon the wrath of their maker. For the wall, or the way, for a wry word, or a straw, they durst venture their necks to the Halter, and their souls to the Devil. Are not these the true Sons of Valour? Such that even in cold blood, and upon sober deliberation dare damn themselves? And why? because forsooth they are afraid of being called Cowards, and abused by every body else, should they have passed by one injury.

They could tell what this was, but what the Hell they leapt into was, they knew not till they found themselves there; and by that time poor wretches how was their courage cooled? And now at length you valiant Fighters, wonder not if God himself be stept into the Field against you. What? do you think you have met with your match yet? Nay, but he hath not yet appeared with all his strength. He hath only sent one of his Warriors, Death sitting upon the Pale-Horse, but see what a terrible Second there is, Hell followed after him. Rev. 6. 8.

But come try your Manhood upon this first. The hour he appoints is, when he pleaseth; the Weapon he now chiefly fights with is the Plague, take you what you will; the Place is London. What Cowards, do you turn your backs now? Are you afraid to Die, and yet are not afraid to be Dammed? What will you laugh at Hell, and now quake at Death, and fly from it? But think not your heels can secure you, nor any place you can fly to, sooner or later be sure he’ll find you out. What did you challenge God to the Combat and now do you run for’t? Can you deny it? What else meant all your open, impudent wickedness, but to bid God do his worst?

For to find you were resolved, let him right himself how he could. God threw down his Gauntlet, when he said, The Soul that sins shall die. You took it up, when you rushed upon those sins. What, you miserable Caitiffs, you Children of the Devil, who is a Murderer, must you stand upon your terms, and command observance from your Company, and will draw at the least Affront, and shall God be careless of his Honour? Was it not present death for a man to throw a Glass of Liquor in your face? And have you done less against God one day after another, by pouring down your superfluous Glasses?

Did the Lie deserve the stab, and shall you go Scot-free, who have so often given the Lie to God himself, speaking to you by his Word and Ministers, his Spirit and your own Consciences? Nay, what you count the most unsufferable Reproach, have you not been ready to interpret God’s Patience for Cowardice? Well, you are wont to call your selves Gentlemen: Know then, That for these, and a multitude of such Affronts, God demands Satisfaction, and have it he will one way or other. Your speedy Repentance, and believing recourse to the blood that speaks better things than that of murdered Abel, may appease him; otherwise, when he makes Inquisition for blood, he’ll take the proudest of you by the Throat, and cast you to the Tormentors, and verily you shall not come thence, till you have paid the utmost Farthing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-mead.html">Matthew Mead</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Solomon’s prescription for the removal of the pestilence, or, The discovery of the plague of our hearts, in order to the healing of that in our flesh</cite>, (London, 1665), pp 30-32.</span></figcaption>

<blockquote><p>On the other side, narrow and temporary precepts and examples:

1. Are void of all these foresaid [universal and perpetual] characters;

2. They are about materials of temporary use;

3. Or they are but the ordering of such customs as were there before, and were proper to those countries;

4. And many speeches are plainly appropriated to the time and persons;

5. And many actions were manifestly occasional, without any intimation of reason or purpose of obliging others to imitation. … So the women’s veil and the custom of kissing each other as a token of love, and men’s not wearing long hair, were the customs of the country there ordered and improved by the apostles about sacred things, but not introduced into other countries that had no such custom.</p></blockquote>

</figure><figure class="quote" id="q-37e96bfd8c" data-kw="">
<blockquote><p>Man as a sinner, as all true Christians will admit, has no right to approach into God’s presence at all. The amity which previously existed in Eden was broken up by the Fall. God “drove out the man,” and He alone is entitled to say whether, and on what conditions, he shall never again be permitted to approach His throne. It is manifest presumption on the part of fallen creatures to dictate to God either that there shall be worship at all or what form it shall assume.

In entering the courts of earthly monarchs, even where a right to enter is conceded, every rule and form of the court must be carefully observed; and far more is this important in entering, by gracious permission, into the immediate presence of the King of kings and Lord of lords. “See thou do all things according to the pattern showed thee in the mount,” was the command of God to Moses. “God is greatly to be feared in the assembly of the saints.”

It is in connection with worship that the solemn question is asked, “Who hath required this at your hands?” It is in connection with the second commandment, which concerns the mode of Divine worship, that the Lord says, “I the Lord thy God am a jealous God, visiting the iniquity of the fathers upon the children, even unto the third and fourth generation of them that hate me.” Korah and his company were swallowed up for disregarding the ordinance of God in regard to worship. It was in connection with this that Christ drove the buyers and sellers out of the temple, and that He said on another occasion, “In vain do they worship me, teaching for doctrines the commandments of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-a-begg.html">James A. Begg</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Anarchy in Worship or Recent Innovations Contrasted with the Constitution of the Presbyterian Church and the Vows of Her Office-Bearers</cite>, (Edinburgh: Lyon &amp; Gemmell, 1875), pp 4-5.</span></figcaption>

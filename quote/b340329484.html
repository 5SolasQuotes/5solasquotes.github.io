<main class="wrap"><figure class="quote" id="q-b340329484" data-kw="">
<blockquote><p>It matters not that many will judge us too precise for doing so. What? Do they think this preciseness any other than that which the law of God requireth, even observing of the commandment of God, without adding to it, or diminishing from it, Deut. xii. 32; and keeping the straight path, without declining to the right hand or to the left? Deut. xxviii. 14 […] Are we more precise than Daniel, who would not close his window when he was praying, no, not for the king’s edict, knowing, that because he had used to do so aforetime, his doing otherwise had been both a denying of his former profession, and an ensnaring of himself by yielding in small things, to yield in greater, and after an inch to take an ell? Dan. vi. 10. Are we more precise than that Apostle Paul who gave no place to the adversaries of Christian liberty, no, not for an hour? Gal. ii. 5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English Popish ceremonies obtruded on the Church of Scotland</cite>, (1637; Edinburgh, 1844), pp 35-6.</span></figcaption>

<blockquote><p>2. The anger, then, which in the Scripture is assigned to God, we say denotes two things:—

(1.) His vindictive justice, or constant and immutable will of rendering vengeance for sin. So God’s purpose of the demonstration of his justice is called his being “willing to show his wrath” or anger, Rom. ix. 22; so God’s anger and his judgments are placed together, Ps. vii. 6; and in that anger he judgeth, verse 8. And in this sense is the “wrath of God” said to be “revealed from heaven,” Rom. i. 18; that is, the vindictive justice of God against sin to be manifested in the effects of it, or the judgments sent and punishments inflicted on and throughout the world.

(2.) By anger, wrath, zeal, fury, the effects of anger are denoted: Rom. iii. 5, “Is God unrighteous who taketh vengeance?” … We say, then, anger is not properly ascribed to God, but metaphorically, denoting partly his vindictive justice, whence all punishments flow, partly the effects of it in the punishments themselves, either threatened or inflicted, in their terror and bitterness, upon the account of what is analogous therein to our proceeding under the power of that passion …

3. Properly, in the sense by him pointed to, anger, wrath, etc., are not in God. Anger is defined by the philosopher to be … “desire joined with grief of that which appears to be revenge, for an appearing neglect or contempt.” To this grief, he tells you, there is a kind of pleasure annexed, arising from the vehement fancy which an angry person hath of the revenge he apprehends as future, — which, saith he, “is like the fancy of them that dream,” — and he ascribes this passion mostly to weak, impotent persons. Ascribe this to God, and you leave him nothing else. There is not one property of his nature wherewith it is consistent. If he be properly and literally angry, and furious, and wrathful, he is moved, troubled, perplexed, desires revenge, and is neither blessed nor perfect. …

(2.) The apostle tells us that God is “blessed for ever,” Rom. ix. 5; “He is the blessed and only Potentate” 1 Tim. vi. 15; “God all-sufficient,” Gen. xvii. 1. That which is inconsistent with absolute blessedness and all-sufficiency is not to be ascribed to God; to do so casts him down from his excellency. But can he be blessed, is he all-sufficient, who is tossed up and down with hope, joy, fear, sorrow, repentance, anger, and the like? …

When we speak of the anger of God, his wrath, and his being appeased towards us, we speak after the manner of men; but yet by the allowance of God himself. Not that God is properly angry, and properly altered from that state and appeased, whereby he should properly be mutable and be actually changed; — but by the anger of God, which sometimes in Scripture signifieth his justice, from whence punishment proceeds, sometimes the effects of anger, or punishment itself, the obstacles before mentioned on the part of God, from his nature, justice, law, and truth, are intended; and by his being appeased towards us, his being satisfied as to all the bars so laid in the way of receiving us to favour, without the least alteration in him, his nature, will, or justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 111-12, 114-15, 533.</span></figcaption>

<blockquote><p>What meaneth that joy that the faithful find in their hearts, accompanying the benefits that cometh from Him, but that the Lord giveth His benefits cheerfully? for if the LORD gave thee them not cheerfully, but in anger and wrath, and threw them to thee as to a reprobate, thou wouldest never have joy in the receiving of them. There is not such a thing, as a reprobate can have joy in the giver, or ever have his mouth open with true thanksgiving to the Lord to say once, I thank thee: Why? Because the Lord giveth him not His benefits in love, but in anger.</p></blockquote>

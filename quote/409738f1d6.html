<main class="wrap"><figure class="quote" id="q-409738f1d6" data-kw="">
<blockquote><p>But the Christian Church is by no means to be considered as a mere voluntary association. It is a Body called out of the world, created by divine institution, and created, as its members believe, for the express purpose of bearing testimony for Christ, in the midst of a revolted and rebellious world, and maintaining in their purity the truth and ordinances which He has appointed. The members of this body, therefore, by the act of uniting themselves with it, profess to believe certain doctrines, to be under obligation to perform certain duties, and to be bound to possess a certain character.

Of course, the very purpose for which, and the very terms on which the Master has formed this body, and bound its members together, necessarily imply, not only the right, but the, duty, of refusing to admit those who are manifestly hostile to the essential principles of its institution, and of casting out those who, after their admission, as manifestly depart from those principles. To suppose less than this, would be to suppose that a God of infinite wisdom has withheld from a body, formed for a certain purpose, that which is absolutely necessary for its defence against intrusion, insult, and perversion; in other words, for its own preservation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay, on the Warrant, Nature and Duties of the Office of the Ruling Elder in the Presbyterian Church</cite>, (New York: Jonathan Leavitt, 1831), pp 22-23.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2de2f2a80a" data-kw="">
<blockquote><p>I presuppose that the division of goods does not necessarily flow from the law of nature, for God made man, before the Fall, lord of the creatures indefinitely [Gen. 1:26-30]; but what goods be Peter’s, and not Paul’s, we know not [from nature’s law]… If I have leave to permit that, in time of necessity, all things are common by God’s law, [then] a man travelling might eat grapes in his neighbor’s vineyard, though he was not licensed to carry any [a]way. I doubt if David, wanting [lacking] money, was necessitated to pay money for the showbread, or for Goliath’s sword, supposing these to be the very goods of private men and ordinarily to be bought and sold. Nature’s law in extremity, for self-preservation, has rather a prerogative royal above all laws of nations and all civil laws than any moral king. In this meaning:

1. Any one man is obliged to give all he has for the good of the commonwealth, and so far the good of the king, inasfar as he is head and father of the commonwealth.

2. All things are the king’s, in regard of his public power to defend all men and their goods from unjust violence.

3. All are the king’s, in regard of his act of conservation of goods, for the use of the just owner.

4. All are the king’s in regard of a legal limitation, in case of a damage offered to the commonwealth. Justice requires confiscation of goods for a fault; but confiscated goods are to help the interested commonwealth, and the king, not as a man (to bestow them on his children) but as a king. To this we may refer these called bona caduca et inventa [goods fallen and found], things lost by shipwreck or any other providences…</p></blockquote>

</figure><figure class="quote" id="q-ac832da950" data-kw="">
<blockquote><p>For the first, we lay hold on all the arguments that prove the Word preached to be the only means of converting the soul, begetting of faith and that carnal weapons are not able, yea nor were they ever appointed of God to doing down strong holds, nor can they make a willing people: and Lactantius said well, ‘What is left to us, if another’s lust 〈◊〉 th•t by force, which we must do willingly?’ (Lactantius, Institutes, bk. 5, ch. 14) And that of Tertullian: ‘It is of the law or right of man and of his natural power what every man worships, what he thinks he should worship, nor does the religion of one either do good or do evil to another man, nor is it religion to compel religion, which ought to be received by will, not by force: since sacrifices (of worship) are required of a willing mind.’ (Tertullian ad Scapul••) In which I observe:

1. Tertullian speaks not of the true Christian religion, which is now in question, but of religion in general as it is comprehensive of both true and false religion. Because he speaks of that religion which by the Law of nature a man chooses, and is humani juris et naturalis potestatis [‘of human law and natural power’]: but it is not of the law of man or natural power, nor in flesh and blood’s power to choose the true Christian religion; that election is supernatural says Tertullian there and elsewhere often, as also the Scripture: Jn. 6:44; Mt. 16:17; 11:25-27.

2. ‘Religion’ is taken two ways: 1. For the inward and outward acts of religion as seen both to God and man, as Lactantius, Tertullian and others say: so it is most true. Christians ought not with force of sword compel Jews, nor Jews or pagans compel Christians to be of their religion, because religion has begotten many by persuasion of the mind, not by forcing of the man. [2.] Again ‘religion’ is taken for the external profession and acting and performances of true religion within the Church, or by such as profess the truth, that are obvious to the eyes of magistrates and pastors, and thus the sword is no means of God to force men [who are not professing Christians] positively to external worship or performances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (London: R.I. for Andrew Crook, 1649), ch. 4, pp. 50-51</span></figcaption>

1. Tertullian speaks not of the true Christian religion, which is now in question, but of religion in general as it is comprehensive of both true and false religion. Because he speaks of that religion which by the Law of nature a man chooses, and is humani juris et naturalis potestatis [‘of human law and natural power’]: but it is not of the law of man or natural power, nor in flesh and blood’s power to choose the true Christian religion; that election is supernatural says Tertullian there and elsewhere often, as also the Scripture: Jn. 6:44; Mt. 16:17; 11:25-27.

2. ‘Religion’ is taken two ways: 1. For the inward and outward acts of religion as seen both to God and man, as Lactantius, Tertullian and others say: so it is most true. Christians ought not with force of sword compel Jews, nor Jews or pagans compel Christians to be of their religion, because religion has begotten many by persuasion of the mind, not by forcing of the man. [2.] Again ‘religion’ is taken for the external profession and acting and performances of true religion within the Church, or by such as profess the truth, that are obvious to the eyes of magistrates and pastors, and thus the sword is no means of God to force men [who are not professing Christians] positively to external worship or performances.”

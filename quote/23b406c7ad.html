<blockquote><p>2. And as it is opposite to charity, so it is injurious to Christ, who seems by this means to be (as it were) divided. So Paul urges it in the third verse after the text, ‘Is Christ divided?’ Using this as an argument to induce his Corinthians to eschew all such divisions and schisms (1 Cor. 1:13), in as much as Christ Himself seems hereby to be parted and torn in pieces; the unity of his mystical body being hereby dissolved, and Himself made the head of two disagreeing bodies; which is dishonorable and monstrous to conceive of Him.

3. As it is injurious to the head, so to the body. As to Christ, so to the Church. And that many ways:

1. Shaming it. The Church’s unity is her glory. ‘My Dove, my undefiled is one’ (Cant. 6:9). Now to break this unity, to divide the Spouse of Christ, as the Levite’s concubine was, into many pieces (Jud. 19:1), what a shame is this? A shame in special to the Church, from which this separation is made. Paul, writing to his Corinthians of their excluding the poor from communicating with them, tells them that herein they shamed them. (1 Cor. 11:22) They shamed them which had not as themselves had.

2. Despising and contemning it. So Paul there again charges it. Or despise you the Church of God? Why, wherein did they despise it? This they did (as by other ways, so) by their schismatical practices, dividing themselves from their brethren, making their love-feasts and the sacrament itself (both which were instituted and ordained for bands of union) to be an occasion of fomenting their divisions; namely, by celebrating them apart from their brethren. So the apostle there taxes them (v.21): In eating, every one takes before other his own supper. Each prevented the other. This they did in their love-feasts. And this most probably they did in the Lord’s Supper itself (as Parcus conceives of it),¹ communicating apart, each faction by itself: those that were of Paul by themselves, and those which were of Peter by themselves, and those which were of Apollo by themselves; none of them staying for those which were of Christ (the best and truest piece of the Church), nor yet one for another; but each seeking to prevent the other, that so they might communicate apart. ¹ Adò divisi erant, ut invicem communicare sacram cenam non dignarentur. Singulae factiones id agebant ut alia aliam praeverteret. Paulini, verbi gratia, primi venientes suam cenam celebrabant, non expectatis Petrinis, Apollinis, etc. [They were so divided that they did not deem it worthy to receive the holy supper together. Each faction aimed to get ahead of the others. The followers of Paul, for example, arriving first, celebrated their own supper without waiting for the followers of Peter, of Apollos, etc.] This Paul calls here their own supper [v. 21]; in as much as they so made it, by appropriating it each to themselves and their party, contrary to the institution of Christ. Christ had instituted it, that it should be a communion, a common Supper, wherein the whole Church should communicate together. But they, by their celebrating it in such a separated way, had made it their own supper. A foul perverting of the ordinance; not only an abusing and corrupting of it, but plainly a destroying of it. So Paul there tells them in downright words in the verse foregoing: ‘When you come together into one place, this is not to eat the Lord’s Supper.’ What then? Their own supper. Of such dangerous consequence is it to celebrate this ordinance of God, the sacrament of the Lord’s Supper, in a separated way (1 Cor. 11:20). If Paul’s judgement may be taken in the case, it is not only a corrupting, but a perverting of the ordinance: a celebrating not of the Lord’s Supper, but of our own Supper. Which whoso do, what do they therein but despise and contemn the Church of God? namely, that Church from which they so separate. Now this, if it be a true Church, can be no small evil. To contemn and despise a private Christian, by shutting him out from desired communion, there being no just cause for it, is a great evil. But to despise and contemn a Church, a true Church of Christ, by shutting it out from communion, and by separating from it, this is a far greater.

3. As the Church is hereby despised, so it is disquieted. Even as it is in the natural body, if there be a solutio continui [a breaking of continuity], so as it be divided and parted, it breeds smart and pain, which sometimes puts the body into feverish distempers. And surely such are the symptoms of schism. The mystical body cannot be rent and torn by divisions, but it goes to the heart of all the sensible members of it. The divisions of Reuben were great thoughts of heart (Jud. 5:25). Reuben, dwelling on the other side Jordan, kept themselves separate, not joining with their brethren against their enemies, but stood as neutral, regarding more their own private than the public interest. And possibly they were divided among themselves, distracted with several opinions what they should do: some would join, others would not. Now these divisions were great thoughts of heart, working many strange impressions in the minds both of themselves and others; of very sad consequence to all the tribes of Israel. And truly, such are divisions in the Church of God, specially when they are boiled up to complete and perfect schisms (as it is in the case of separation, specially when it comes to the setting up of Churches against Churches). O these are sad thoughts of heart to the Israel of God; causing grief to the particular members of the Church, and great disquiet and disturbance to the whole Body. Oft-times breeding those feverish distempers, those un-Christian heats of hatred, variance, emulation, wrath, strife, seditions, envyings, yea, and murders too, as the apostle puts them together (Gal. 5:20). These, all these, are the fruits of schism, by reason whereof there cannot but follow a dreadful combustion in the Body of the Church, tending to the great trouble and disquietment of it.

4. As the Church is hereby disquieted, so hindered. As disquieted in the peace, so hindered in the edification of it. We know what it was which hindered the building of Babel, even a schism in their tongues, division of languages. (What do we think a schism in their hands would have done, if one had fallen to pulling down what the other built up?) And surely, there is no one thing that can more hinder the building of Jerusalem, the edification of the Church, than this, when Christians shall be divided in their heads, hearts, tongues, hands; in their judgments, affections, language, practice. How should the work of the Lord now go on? Even as it is in civil wars: whilst the parties are contending, the commonwealth suffers. So is it in Church-divisions: whilst the parties are contending, the Church suffers. As it is with a ship brought to the back-stays: one sail bears the one way, and another another; in the meantime the ship stands still. The wall and temple of Jerusalem went slowly on in troublous times. So will Church work do, wherever schisms and factions break it.

5. Again, as the Church is disquieted and hindered, so endangered by it.¹ As disquieted in the peace of it, and hindered in the edification of it, so endangered in the state of it. The cutting off of one member from the body is dangerous to the whole. What is the dismembering of a Church? The withdrawing of communion with it, the breaking off of all fellowship and communion with it by an actual and positive Separation. Certainly, this cannot but endanger the state of that Church from which this separation is made. Which, if it live and continue, is no thanks to them who have thus withdrawn themselves, who by their separation have done what in them lies to destroy it. Thus is schism injurious to the Church of God. ¹ Hoc consensu stat et subnixa est salus Ecclesiae [On this agreement the safety of the Church stands and is supported], Calvin on the text. Corpus Organicum non potest dissecari quin pariter et totum et partes intereant [An organic body cannot be cut in pieces without both the whole and the parts perishing together]. Peter Martyr on the text.</p></blockquote>

y+one+takes+before+other+his+own+supper.+Each+prevented+the+other.+This+they+did+in+their+love-feasts.+And+this+most+probably+they+did+in+the+Lord%E2%80%99s+Supper+itself+%28as+Parcus+conceives+of+it%29%2C%C2%B9+communicating+apart%2C+each+faction+by+itself%3A+those+that+were+of+Paul+by+themselves%2C+and+those+which+were+of+Peter+by+themselves%2C+and+those+which+were+of+Apollo+by+themselves%3B+none+of+them+staying+for+those+which+were+of+Christ+%28the+best+and+truest+piece+of+the+Church%29%2C+nor+yet+one+for+another%3B+but+each+seeking+to+prevent+the+other%2C+that+so+they+might+communicate+apart.+%C2%B9+Ad%C3%B2+divisi+erant%2C+ut+invicem+communicare+sacram+cenam+non+dignarentur.+Singulae+factiones+id+agebant+ut+alia+aliam+praeverteret.+Paulini%2C+verbi+gratia%2C+primi+venientes+suam+cenam+celebrabant%2C+non+expectatis+Petrinis%2C+Apollinis%2C+etc.+%5BThey+were+so+divided+that+they+did+not+deem+it+worthy+to+receive+the+holy+supper+together.+Each+faction+aimed+to+get+ahead+of+the+others.+The+followers+of+Paul%2C+for+example%2C+arriving+first%2C+celebrated+their+own+supper+without+waiting+for+the+followers+of+Peter%2C+of+Apollos%2C+etc.%5D+This+Paul+calls+here+their+own+supper+%5Bv.+21%5D%3B+in+as+much+as+they+so+made+it%2C+by+appropriating+it+each+to+themselves+and+their+party%2C+contrary+to+the+institution+of+Christ.+Christ+had+instituted+it%2C+that+it+should+be+a+communion%2C+a+common+Supper%2C+wherein+the+whole+Church+should+communicate+together.+But+they%2C+by+their+celebrating+it+in+such+a+separated+way%2C+had+made+it+their+own+supper.+A+foul+perverting+of+the+ordinance%3B+not+only+an+abusing+and+corrupting+of+it%2C+but+plainly+a+destroying+of+it.+So+Paul+there+tells+them+in+downright+words+in+the+verse+foregoing%3A+%E2%80%98When+you+come+together+into+one+place%2C+this+is+not+to+eat+the+Lord%E2%80%99s+Supper.%E2%80%99+What+then%3F+Their+own+supper.+Of+such+dangerous+consequence+is+it+to+celebrate+this+ordinance+of+God%2C+the+sacrament+of+the+Lord%E2%80%99s+Supper%2C+in+a+separated+way+%281+Cor.+11%3A20%29.+If+Paul%E2%80%99s+judgement+may+be+taken+in+the+case%2C+it+is+not+only+a+corrupting%2C+but+a+perverting+of+the+ordinance%3A+a+celebrating+not+of+the+Lord%E2%80%99s+Supper%2C+but+of+our+own+Supper.+Which+whoso+do%2C+what+do+they+therein+but+despise+and+contemn+the+Church+of+God%3F+namely%2C+that+Church+from+which+they+so+separate.+Now+this%2C+if+it+be+a+true+Church%2C+can+be+no+small+evil.+To+contemn+and+despise+a+private+Christian%2C+by+shutting+him+out+from+desired+communion%2C+there+being+no+just+cause+for+it%2C+is+a+great+evil.+But+to+despise+and+contemn+a+Church%2C+a+true+Church+of+Christ%2C+by+shutting+it+out+from+communion%2C+and+by+separating+from+it%2C+this+is+a+far+greater.+3.+As+the+Church+is+hereby+despised%2C+so+it+is+disquieted.+Even+as+it+is+in+the+natural+body%2C+if+there+be+a+solutio+continui+%5Ba+breaking+of+continuity%5D%2C+so+as+it+be+divided+and+parted%2C+it+breeds+smart+and+pain%2C+which+sometimes+puts+the+body+into+feverish+distempers.+And+surely+such+are+the+symptoms+of+schism.+The+mystical+body+cannot+be+rent+and+torn+by+divisions%2C+but+it+goes+to+the+heart+of+all+the+sensible+members+of+it.+The+divisions+of+Reuben+were+great+thoughts+of+heart+%28Jud.+5%3A25%29.+Reuben%2C+dwelling+on+the+other+side+Jordan%2C+kept+themselves+separate%2C+not+joining+with+their+brethren+against+their+enemies%2C+but+stood+as+neutral%2C+regarding+more+their+own+private+than+the+public+interest.+And+possibly+they+were+divided+among+themselves%2C+distracted+with+several+opinions+what+they+should+do%3A+some+would+join%2C+others+would+not.+Now+these+divisions+were+great+thoughts+of+heart%2C+working+many+strange+impressions+in+the+minds+both+of+themselves+and+others%3B+of+very+sad+consequence+to+all+the+tribes+of+Israel.+And+truly%2C+such+are+divisions+in+the+Church+of+God%2C+specially+when+they+are+boiled+up+to+complete+and+perfect+schisms+%28as+it+is+in+the+case+of+separation%2C+specially+when+it+comes+to+the+setting+up+of+Churches+against+Churches%29.+O+these+are+sad+thoughts+of+heart+to+the+Israel+of+God%3B+causing+grief+to+the+particular+members+of+the+Church%2C+and+great+disquiet+and+disturbance+to+the+whole+Body.+Oft-times+breeding+those+feverish+distempers%2C+those+un-Christian+heats+of+hatred%2C+variance%2C+emulation%2C+wrath%2C+strife%2C+seditions%2C+envyings%2C+yea%2C+and+murders+too%2C+as+the+apostle+puts+them+together+%28Gal.+5%3A20%29.+These%2C+all+these%2C+are+the+fruits+of+schism%2C+by+reason+whereof+there+cannot+but+follow+a+dreadful+combustion+in+the+Body+of+the+Church%2C+tending+to+the+great+trouble+and+disquietment+of+it.+4.+As+the+Church+is+hereby+disquieted%2C+so+hindered.+As+disquieted+in+the+peace%2C+so+hindered+in+the+edification+of+it.+We+know+what+it+was+which+hindered+the+building+of+Babel%2C+even+a+schism+in+their+tongues%2C+division+of+languages.+%28What+do+we+think+a+schism+in+their+hands+would+have+done%2C+if+one+had+fallen+to+pulling+down+what+the+other+built+up%3F%29+And+surely%2C+there+is+no+one+thing+that+can+more+hinder+the+building+of+Jerusalem%2C+the+edification+of+the+Church%2C+than+this%2C+when+Christians+shall+be+divided+in+their+heads%2C+hearts%2C+tongues%2C+hands%3B+in+their+judgments%2C+affections%2C+language%2C+practice.+How+should+the+work+of+the+Lord+now+go+on%3F+Even+as+it+is+in+civil+wars%3A+whilst+the+parties+are+contending%2C+the+commonwealth+suffers.+So+is+it+in+Church-divisions%3A+whilst+the+parties+are+contending%2C+the+Church+suffers.+As+it+is+with+a+ship+brought+to+the+back-stays%3A+one+sail+bears+the+one+way%2C+and+another+another%3B+in+the+meantime+the+ship+stands+still.+The+wall+and+temple+of+Jerusalem+went+slowly+on+in+troublous+times.+So+will+Church+work+do%2C+wherever+schisms+and+factions+break+it.+5.+Again%2C+as+the+Church+is+disquieted+and+hindered%2C+so+endangered+by+it.%C2%B9+As+disquieted+in+the+peace+of+it%2C+and+hindered+in+the+edification+of+it%2C+so+endangered+in+the+state+of+it.+The+cutting+off+of+one+member+from+the+body+is+dangerous+to+the+whole.+What+is+the+dismembering+of+a+Church%3F+The+withdrawing+of+communion+with+it%2C+the+breaking+off+of+all+fellowship+and+communion+with+it+by+an+actual+and+positive+Separation.+Certainly%2C+this+cannot+but+endanger+the+state+of+that+Church+from+which+this+separation+is+made.+Which%2C+if+it+live+and+continue%2C+is+no+thanks+to+them+who+have+thus+withdrawn+themselves%2C+who+by+their+separation+have+done+what+in+them+lies+to+destroy+it.+Thus+is+schism+injurious+to+the+Church+of+God.+%C2%B9+Hoc+consensu+stat+et+subnixa+est+salus+Ecclesiae+%5BOn+this+agreement+the+safety+of+the+Church+stands+and+is+supported%5D%2C+Calvin+on+the+text.+Corpus+Organicum+non+potest+dissecari+quin+pariter+et+totum+et+partes+intereant+%5BAn+organic+body+cannot+be+cut+in+pieces+without+both+the+whole+and+the+parts+perishing+together%5D.+Peter+Martyr+on+the+text.%E2%80%9D%0A%0A%E2%80%94+John+Brinsley%2C+The+Arraignment+of+the+Present+Schism+of+New+Separation+in+old+England%2C+%28London%3A+Field%2C+1646%29%2C+pp.+19-22&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F23b406c7ad.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/23b406c7ad.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=2.%20And%20as%20it%20is%20opposite,together%5D.%20Peter%20Martyr%20on%20the%20text&amp;text=2.%20And%20as%20it%20is%20opposite%20to%20charity&amp;text=parts%20perishing%20together%5D.%20Peter%20Martyr%20on%20the%20text" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>2. I do not speak against men’s seeking a reconciliation with Rome on just and honest terms. I think it one of the happiest works in the world, could it be accomplished: And I think the French are the only people to be first dealt with to that end. And I long to see providence so turn things about as that there might be a council first of these two nations for the attempting of such a work. And I am past doubt that it would be the happiest way to pull down Antichrist (if the Pope be he) that has been yet of late undertaken. But if ever such a thing be accomplished, it must be by uniting in one creed, as containing all things sufficient to salvation, which must be wholly taken out of Scripture and not such as the Trent Confession is: Upon which agreement they may openly acknowledge each other for brethren and true Churches, without compelling each other to uniformity in the lesser matters, but bearing with each others’ differences. I wish England such rulers as will faithfully prosecute such a pacific enterprise, without sinful compliance and betraying of the truth. Though I confess when I consider their principles and practices, I am afraid bishop Hall is in the right, that There’s no peace with Rome. Yet no fears must hinder men from any just and necessary enterprise.</p></blockquote>

<blockquote><p>Bucer believed that in a face-to-face dialogue it would be easierto persuade one’s opponents of the truth… Bucer knew well that written documents were subjected to differing interpretations. His preference for public dialogue also influenced many of his written works, which adopted the literary genre of a fictional dialogue. In these works, he would exemplify how men of differing opinions could peaceably and gradually arrive at agreement on the truth. This gradual approach was illustrative of his pedagogy for persuading and teaching others the truth of God’s word… As Stupperich has asserted, for Bucer unity would result not from compromise but from the clarification of misunderstandings that enable a unity in the truth.</p></blockquote>

<blockquote><p>Much has been made by historians of the Scots ‘forcing’ their austere brand of religion upon their English brethren. However, it is clear that Scottish commissioners were aware their role was limited to advising only and that the construction of the Church rested with English members of the Assembly. Indeed, the Westminster Assembly did invite the Scottish commissioners to become full members of the Assembly, an invitation which the Scots declined, thereby recognising and respecting England’s right to define its own church government… The Scots fully encouraged the English to set up a Classical Presbytery based on English tradition and encouraged compromise [or rather a principled accommodation to the Independents]. In response to [the Independent] Philip Nye’s sharp accusation that the Scots had ‘given’ the Assembly a whole system of church government, the Scottish members responded that ‘we were well content the Assembly should take their own order, and not tie themselves to ours.&#x27;</p></blockquote>

<blockquote><p>For the work of peace, at the persuasion of some friends, he took a journey thitherward [to Lutheran Sweden], where he arrived in June, anno 1636… a resolution was taken to permit Master Dury to treat with the divines of that kingdom… to which he might address himself particularly, and lay open his intention… There he had conference both collegially and severally with the professors of divinity, who gave full assent unto his desires, and set down these conditions, upon which they were ready to agree, and join with the reformed side:

1. That a full agreement should be made in all the fundamental articles of Faith.

2. That all errors overthrowing the foundation, or tending to overthrow the same, should be condemned.

3. That in matters ceremonial and of indifferency, there should be a mutual toleration.

4. That betwixt the parties, united sincerity and uprightness should be maintained, lest ancient errors might be upheld under doubtful speeches.

5. That when peace is made, none should be suffered to maintain, excuse or spread any more the errors once condemned.

6. That ambitious and needless disputes and brabblings should be inhibited on all sides.

7. That former reproaches and injuries should be put to oblivion.

8. That the Church government should be settled according to apostolical rules. These demands the rest agreed unto, neither was any thing of moment added thereunto by any.</p></blockquote>

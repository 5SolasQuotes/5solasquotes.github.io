<main class="wrap"><figure class="quote" id="q-a88fa34175" data-kw="">
<blockquote><p>William Alexander of Duntocher [a congregationalist professor], to whom he wrote about [William] White’s [of Haddington] unfavorable judgment [of Candlish’s work on the Atonement], decidedly approved of his positions, told the lecturer [Candlish] so, and won his gratitude. It may have been the case that the leaning in the direction of Supralapsarianism which readers have detected in the Fatherhood [of God, by Candlish] may account for the welcome that Alexander gave the book. For he was a very definite Supralapsarian at the same time as he was a very militant Calvinist. These two of Candlish’s friends were divines of good standing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/supralapsarians.html">John Macleod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scottish Theology in Relation to Church History (RAP, 1995), p. 275</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-49d3983410" data-kw="unconditional election good pleasure">
<blockquote><p>Election was made from God’s mere good pleasure; therefore, not on account of Christ [as antecedent cause] because good pleasure excludes every cause out of God upon which election may depend. … “That the purpose of God according to election might stand, not of works, but of him that calleth” (Rom. 9:11); “It is not of him that willeth, nor of him that runneth, but of God that sheweth mercy” (Rom. 9:16).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.10.5</span></figcaption>

</figure><figure class="quote" id="q-e733164a3e" data-kw="">
<blockquote><p>It should be noted that both [Robert] Rollock and [Robert] Howie confined the effectual application of the covenant and its benefits to ‘God’s elect’. The doctrine of election permeated their writings and sermons, but, more specifically, both wrote treatises which presented strong predestinarian views advocating double and supralapsarian predestination. At Basel Academy on February 25, 1591, Howie defended a paper entitled De Aeterna Dei Praedestinatione Aphorismi Theologici [Theological Aphorisms on the Eternal Predestination of God].. He chose to glorify his mercy and love in the salvation of the elect, and to glorify his justice in the damnation of the reprobate. Man’s primal condition, his fall, and his corruption through sin were all included in this decree. (Howie, De Aeterna, 8-10)… There is one chapter in Rollock’s De Vocatione [Of Effectual Calling], entitled ‘Concerning the Free Grace of God,’ [ch. 38] which has a reference to predestination capable of an infralapsarian interpretation. Here he placed the decree to glorify Christ before the decree concerning the creation of man [which is a supra-viewpoint]. (Rollock, Select Works, 1:266-267; see Letham, ‘Saving Faith’, 1:270) But Rollock went on to say that in the execution of the decree ‘the decree of God concerning man hath the first place… Then after the fall of man, followed the restitution of man… in and by his Son Christ… Therefore the execution of the decree concerning Christ the Son of God, which was first, falls now as it were in the midst of the repairing of mankind, or of the execution of the decree concerning man’s redemption.’ (Select Works, 1:267-8) This passage in no way detracts from the overwhelming supralapsarian character of Rollock’s predestinarianism…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-woolsey.html">Andrew Woolsey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unity &amp; Continuity in Covenantal Thought, pp. 531, 534</cite></span></figcaption>

</figure><figure class="quote" id="q-ae3b352671" data-kw="">
<blockquote><p>Election is the fountain of distinguishing grace… by the most gracious and freee act of his own will, He chose some out of the corrupt generality (and they are but a little diminutive flock) to make them vessels of honor, Acts 13, that his goodness might be the more admirable.</p></blockquote>

</figure><figure class="quote" id="q-408011b53a" data-kw="">
<blockquote><p>But instead of attending to the true state of the controversy, and instead of referring the decision of it to the divine oracles, tradition and corruption has carried them into the way which this writer pursues, of representing our doctrine to be, that God decrees some men to misery in the same manner that he does others to happiness; yea this slanderer, in imitation of those who have gone before him, sets reprobation foremost, and would have people believe that we hold, God’s first design to be the damnation of multitudes, and then secondly, the irresistible salvation of a number!</p></blockquote>

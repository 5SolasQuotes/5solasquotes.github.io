<main class="wrap"><figure class="quote" id="q-af417d0dd5" data-kw="">
<blockquote><p>As a minister who has tolerable gifts for preaching may yet need the writings of other men before hand, and may bring both their matter and method into the pulpit, yea and oft times their words; so that though he have gifts, yet being weak, he may use the gifts of others. I have been counseled since I was silenced [in 1662] to compose sermons myself and give them in writing to some weak minister that has an excellent voice and utterance and to let him preach them. And really if I had not known that such have good books enough at hand for such a use, I think I should have done it: And who can prove that this had been his sin? And yet this was a using of another man’s gifts instead of his own. And I have heard men that are much against parish churches and liturgies wish that some unlearned men of good utterance might read some excellent sermon books to the people in ignorant places that can get no better: And who can prove the reading of a homily unlawful?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 32, p. 182</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-67a848c7de" data-kw="">
<blockquote><p>1. Jesus preached peace (Eph. 2:17); don’t be a better preacher than Jesus.

2. Preach first to yourself.

3. Preach from your heart, not only to their heart.

4. Leverage your own distress.

5. How much do you have to hate the people to try to impress them rather than help them?

6. A pervasive tone of encouragement.

7. Vivid imagery. Visceral, sensory. Littered with analogues.

8. They’re more distressed than they’re revealing.

9. The power is in the Word, not your cleverness.

10. The Spirit works with your weakness and need, not our strength and sufficiency.

11. Think yourself full, pray yourself aglow.

12. Be concrete, not abstract.

13. Specificity communicates universality.

14. Be clear. Lewis: sheep. If you given them a route to misunderstand, they’ll take it.

15. Be simple but not simplistic.

16. Ruthlessly cut everything extraneous.

17. Smile. And mean it. Preaching is an act of pastoral love.

18. Doctrine is not enough; but, people do want to know doctrine.

19. Regularly reveal something of your own weakness.

20. Let them know of exegetical discoveries new to you.

21. Don’t ask adjectives to do the work verbs should be doing.

22. Make the gospel clear at some point.

23. Both unbelievers and believers are present.

24. Both eager and stagnant belieers are present.

25. Remember, and speak directly to, the kids.

26. Speak in your natural everyday voice; resist every form of ‘the preacher’s voice’.

27. Handle objections.

28. When on the fence, shorter is better.

29. Quit preaching while you still have them.

30. You don’t look as happy as you are; so stretch for joy.

31. If they feel loved by you (Phil. 4:1), they will feel hurt with you (Phil. 4:14).

32. ‘We will hear you again about this’ (Acts 17:32). Intrigue them with Jesus, even if they haven’t collapsed into his arms yet.

33. Don’t let your main points be transposable onto any other text in the Bible.

34. Slow down to notice every actual word of the text–what it says, and doesn’t say.

35. Calm down and be yourself.

36. Be a farmer, not a penny stock trader. Crock pot, not microwave.

37. They don’t need eloquence; they need radiance.

38. T.F. Tenney: ‘Preach every sermon like your son is sitting on the last row and giving church one last chance.’

39. Tincture. Give them a taste of what Jesus himself is like. Rutherford.</p></blockquote>

</figure><figure class="quote" id="q-74af20edbe" data-kw="">
<blockquote><p>From this cause [native depravity] it proceeds, that many children, who have the opportunity of a good religious education, learn scarcely any thing of the most important truths of Christianity. If they are compelled to commit the Catechism to memory, they are wont to do this without ever thinking of the doctrines contained in the words which they recite; so that, when the attention is at any time awakened to the subject of religion, as a personal concern, they feel themselves to be completely ignorant of the system of divine truth taught in the Bible. Yet even to these, the truths committed to memory are now of great utility. They are like a treasure which has been hidden, but is now discovered. Of two persons under conviction of sin, one of whom has had sound religious instruction, and the other none, the former will have an unspeakable advantage over the latter in many respects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), ch. 1, p. 13</span></figcaption>

<blockquote><p>If Paul in preaching had either substituted human wisdom for the doctrine of the cross, or had so presented that doctrine as to turn it into a philosophy, his preaching would have been powerless. It would lose its divine element and become nothing more than human wisdom. Whatever obscures the cross deprives the gospel of its power.</p></blockquote>

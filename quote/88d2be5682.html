</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e7a46e733c" data-kw="">
<blockquote><p>Controversy XVI: Is it lawful to do good for the sake of the eternal reward? [Romanist] Position of Bellarmine: It is lawful and useful to do good for the sake of the eternal reward as a meritorious work. The saints were moved to true piety in this way, like Moses (Hebrews 11), David (Psalm 119), and Paul (Philippians 3). And the apostles use this argument to exhort to piety (1 Corinthians 9; Galatians 6; Colossians 3). Orthodox Position: In doing good, we should primarily seek God and His glory as the ultimate end (Colossians 3) and secondarily our salvation. Subordinate ends are not incompatible. And our salvation is closely linked to God’s glory. Moreover, this is done to stir our zeal. And this is what is proved by the cited passages. Care must always be taken to love God for Himself, not for our own benefit, with the love of friendship, not of concupiscence, so that it is not a mercenary friendship. Therefore, Bernard says: ‘God is not loved without reward, though He should be loved without the intention of reward.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-alsted.html">Johann Heinrich Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio</cite>, (d. 1638) at Nosferatu’s Substack (2024)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/judgment-and-the-final-state/heaven-and-eternal-glory.html">Heaven and Eternal Glory</a></span></div>
<div class="actions"><button class="copy" data-copy="“Controversy XVI: Is it lawful to do good for the sake of the eternal reward? [Romanist] Position of Bellarmine: It is lawful and useful to do good for the sake of the eternal reward as a meritorious work. The saints were moved to true piety in this way, like Moses (Hebrews 11), David (Psalm 119), and Paul (Philippians 3). And the apostles use this argument to exhort to piety (1 Corinthians 9; Galatians 6; Colossians 3). Orthodox Position: In doing good, we should primarily seek God and His glory as the ultimate end (Colossians 3) and secondarily our salvation. Subordinate ends are not incompatible. And our salvation is closely linked to God’s glory. Moreover, this is done to stir our zeal. And this is what is proved by the cited passages. Care must always be taken to love God for Himself, not for our own benefit, with the love of friendship, not of concupiscence, so that it is not a mercenary friendship. Therefore, Bernard says: ‘God is not loved without reward, though He should be loved without the intention of reward.&#x27;”

</figure><figure class="quote" id="q-e51aa60dd1" data-kw="">
<blockquote><p>It is a question: An sancti fruantur beatitudine ante ultimum judicium? [Whether the saints enjoy blessedness before the Last Judgment?] It was a current opinion among most of the Fathers, if not all that the souls of men after their death do not go immediately to heaven, but are in a receptacle or mansion-place till the day of Judgement, and some of late have followed it, especially the Anabaptists. The souls immediately departed have not the compleat fullness of that happiness which they shall have, yet they are not excluded from the enjoying of God, Lk. 23:43; 2 Cor. 5:1; Phil. 1:23. Some say there is a difference of those that are raised again, as Lazarus and some others; for it is likely (say they) that their souls went not into heaven, but were detained by God, who would unite them again to show forth his glory. The accidental joy of the saints (say the [Medieval] Schoolmen) shall be greater, both extensively, because it shall be in soul and body, and intensively, because the soul shall rejoyce to see the body glorified. 2. The essential glory shall increase extensively, because it shall redound unto the body. The souls of the godly immediately after their departure hence from the body are said to be in rest, Heb. 4:11 in consolation, Lk. 16:25, in security, Jn. 11:15,18, therefore they presently go to heaven, to God and Christ. Consider the names given to the state of glory: it is called Life, ‘These shall enter into life’; Rest, find rest, go to rest; our home, our Fathers’ house; a purchased and glorious inheritance; A Kingdom, the Kingdom of heaven; Joy, our Master’s joy, everlasting joy; Glory, weight of glory, eternal weight of glory; The City of our God. The Scripture calls it Paradise, a place of all delight and pleasure, alluding to that Paradise planted by God’s own hand, to make it a delight for the innocent state of man, and Abrahams bosom, wherein the Saints receive refreshing, which is a borrowed speech taken from fathers carrying and cherishing their little one, in their bosome, so the elect are cherished in the bosom of the father of all the faithful. There is perfection, perpetuity, immutability, there is Foelix securitas, secura foelicitas. Bernard.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity</cite>, … (London, 1654), bk. 10, ch. 4, ‘Of Everlasting Life’, pp. 869-70</span></figcaption>

<blockquote><p>There was a little Christian child who was asked, when she was dying, why she was so happy? ‘Because,’ she said, ‘I am going to be with Christ.’ ‘But,’ they said to her, ‘perhaps Christ will leave heaven.’ ‘Ah! Then,’ she said, ‘I will leave it, too, and go with Him.’ It is our very heaven to be with Christ; we shall see eye to eye.</p></blockquote>

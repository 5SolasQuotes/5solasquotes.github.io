<main class="wrap"><figure class="quote" id="q-a7061ec4b5" data-kw="">
<blockquote><p>Does not the importance of the Sabbath, in a civil view, invest it with an undeniable claim to the protection of public law? The laws of all Christian States have, to a greater or less extent, given their authority and protection to the Sabbath. Men of wisdom, honour, and virtue, have ever felt that it ought to be among the earliest objects of their solicitude to perpetuate the blessings of this holy day.

And does not the importance of the Sabbath plead irresistibly for this paternal interposition? Is the Sabbath the great means of perpetuating in the earth the knowledge of the true religion? Is it the great means of intellectual advancement? Does it lie at the foundation of all sound morality? Is it not less a distinguished means of temporal prosperity, than of holiness and eternal life? Then is there no institution around which a more impenetrable barrier of wholesome restrictions ought to be erected.

The Sabbath is the noblest and firmest pillar of a well-regulated society. It is the corner-stone of that noble edifice of morals, liberty, and public weal, which is the pride and exultation of every prosperous community. If our political institutions cannot be preserved unless the laws and usages of the land are formed on the basis of sound morality; if morality cannot be maintained without the active impression of religious principle; and if neither can exist long, where the Sabbath exerts none of its heaven-born influence; then is it not the truest policy of a State to enforce the observance of this day?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gardiner-spring.html">Gardiner Spring</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath a Blessing to Mankind</cite>, in Tracts of the American Tract Society. General Series. Volume 1 (n.d.), no. 37, pp 14-15.</span></figcaption>

</figure><figure class="quote" id="q-7e8994c7ce" data-kw="">
<blockquote><p>To me there appears no doubt that, by antithesis, there is a comparison here made between the doctrine openly set forth in the Law, and the hidden and incomprehensible counsel of God, concerning which it is not lawful to inquire…. It is a remarkable passage, and especially deserving of our observation, for by it audacity and excessive curiosity are condemned, whilst pious minds are aroused to be zealous in seeking instruction. We know how anxious men are to understand things, the knowledge of which is altogether unprofitable, and even the investigation of them injurious. All of them would desire to be God’s counsellors, and to penetrate into the deepest recesses of heaven, nay, they would search into its very cabinets. …On the other hand, what God plainly sets before us, and would have familiarly known, is either neglected, or turned from in disgust, or put far away from us, as if it were too obscure. In the first clause, then, Moses briefly reproves and restrains that temerity which leaps beyond the bounds imposed by God; and in the latter, exhorts us to embrace the doctrine of the Law, in which God’s will is declared to us, as if He were openly speaking to us; and thus he encounters the folly of those who fly from the light presented to them, and wrongfully accuse of obscurity that doctrine, wherein God has let Himself down to the measure of our understanding. In sum, he declares that God is the best master to all who come to Him as disciples, because He faithfully and clearly explains to them all that it is useful for them to know. The perpetuity of the doctrine is also asserted, and that it never is to be let go, or to become obsolete by the lapse of ages. How far the Law is perpetual I have more fully discussed in the Second Book of the Institutes, chap. xi. The rule of just and pious living even now retains its force, although we are delivered from the yoke of bondage and from the curse; but the coming of Christ has put an end to its ceremonies in such a way as to prove more certainly that they were not mere vain and empty shadows. Lastly, Moses requires obedience of the people, and reminds them that the Law was not only given that the Israelites might know what was right, but that they might do all that God taught. True is it indeed that all His precepts cannot be fully obeyed; but the perfection which is required, compels those to ask for pardon who otherwise feel themselves to be exposed to God’s judgment, as will be hereafter explained. Besides, we must observe that the doctrine that we must keep the whole Law has this object, that men should not separate one commandment from the others, and think that they have done their duty by performing only a part of it; since God admits no such divorce, having forbidden us to steal no less than to kill.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Four Last Books of Moses (Harmony)</cite>, Commentaries on the Four Last Books of Moses Arranged in the Form of a Harmony, vol. 1, trans. Charles William Bingham (Bellingham, WA: Logos Bible Software, 2010), 410–412.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

e+is+also+asserted%2C+and+that+it+never+is+to+be+let+go%2C+or+to+become+obsolete+by+the+lapse+of+ages.+How+far+the+Law+is+perpetual+I+have+more+fully+discussed+in+the+Second+Book+of+the+Institutes%2C+chap.+xi.+The+rule+of+just+and+pious+living+even+now+retains+its+force%2C+although+we+are+delivered+from+the+yoke+of+bondage+and+from+the+curse%3B+but+the+coming+of+Christ+has+put+an+end+to+its+ceremonies+in+such+a+way+as+to+prove+more+certainly+that+they+were+not+mere+vain+and+empty+shadows.+Lastly%2C+Moses+requires+obedience+of+the+people%2C+and+reminds+them+that+the+Law+was+not+only+given+that+the+Israelites+might+know+what+was+right%2C+but+that+they+might+do+all+that+God+taught.+True+is+it+indeed+that+all+His+precepts+cannot+be+fully+obeyed%3B+but+the+perfection+which+is+required%2C+compels+those+to+ask+for+pardon+who+otherwise+feel+themselves+to+be+exposed+to+God%E2%80%99s+judgment%2C+as+will+be+hereafter+explained.+Besides%2C+we+must+observe+that+the+doctrine+that+we+must+keep+the+whole+Law+has+this+object%2C+that+men+should+not+separate+one+commandment+from+the+others%2C+and+think+that+they+have+done+their+duty+by+performing+only+a+part+of+it%3B+since+God+admits+no+such+divorce%2C+having+forbidden+us+to+steal+no+less+than+to+kill.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+the+Four+Last+Books+of+Moses+%28Harmony%29%2C+Commentaries+on+the+Four+Last+Books+of+Moses+Arranged+in+the+Form+of+a+Harmony%2C+vol.+1%2C+trans.+Charles+William+Bingham+%28Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2010%29%2C+410%E2%80%93412.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7e8994c7ce.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7e8994c7ce.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/08/calvin-deut-29-29-gods-word-is-enough/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13755d1246" data-kw="Comfort Justice Assurance">
<blockquote><p>Let us oft think of this nearness between Christ and us, if we have once given our names to him, and not be discouraged for any sin or unworthiness in us. Who sues a wife for debt, when she is married? Uxori lis non intenditur. Therefore answer all accusations thus:—&#x27;Go to Christ.&#x27; If you have anything to say to me, go to my husband. God is just, but he will not have his justice twice satisfied, seeing whatsoever is due thereunto is satisfied by Christ our husband. What a comfort is this to a distressed conscience! If sin cannot dismay us, which is the ill of ills and cause of all evil, what other ill can dismay us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bowels Opened</cite>, Sermon II (Song 5:1)</span></figcaption>

</figure><figure class="quote" id="q-476692b76f" data-kw="">
<blockquote><p>Nor, lastly, that of the head and members united by one vital spirit, and so making one physical body, mentioned Eph. 4: 15, 16. for though one soul actuates every member, yet it does not knit every member alike near to the head, but some are nearer, and others removed farther from it; but here every member is alike nearly united with Christ the Head; the weak are as near to him as the strong.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace</cite>, Sermon 2 (John 17:23), on the metaphors of union</span></figcaption>

</figure><figure class="quote" id="q-e7011f9b00" data-kw="">
<blockquote><p>We are today accepted in the Beloved, today absolved from sin, today acquitted at the bar of God… We are now pardoned; even now are our sins put away; even now we stand in the sight of God accepted, as though we had never been guilty. “There is therefore now no condemnation to them which are in Christ Jesus.” There is not a sin in the Book of God, even now, against one of His people. Who dares to lay anything to their charge? There is neither speck, nor spot, nor wrinkle, nor any such thing remaining upon any one believer in the matter of justification in the sight of the Judge of all the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Morning and Evening</cite>, Morning, May 15</span></figcaption>

</figure><figure class="quote" id="q-fd92ded097" data-kw="Assurance Election Holy Spirit">
<blockquote><p>When the Holy Ghost sealeth a man up, the thing he makes known, the thing he sealeth to him is this, that he is in Christ, that he hath been elected in Christ by God the Father from everlasting, that he is one in Christ; he was one with him from everlasting, he was one with him when he hung upon the cross, he is one with him now in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the First Chapter of Ephesians</cite>, Works, vol. 1, Sermon XVI (Eph. 1:13)</span></figcaption>

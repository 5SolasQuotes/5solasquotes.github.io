<main class="wrap"><figure class="quote" id="q-8f75f43af8" data-kw="">
<blockquote><p>Obiection 2: Secondly, Christ took on Him man’s nature; He became man like to us: therefore, say some, He may be resembled, and an image of Him may be made. Question: How is this to be answered? Answer: Thus, Christ being both God and Man, the chief thing that makes him Christ is his Godhead, and that cannot be expressed by an image; and therefore an image made to resemble whole-Christ must needs be a living image, leaving out the chief part of Christ, which is his Godhead: so that an image made of Christ, either separates his Godhead from his manhood, or else it makes his Godhead to be such as may be circumscribed: both which are gross errors; therefore there may no image of Christ be made. Objection 3: May not Christ as well be painted with colors as set before us with words in a sermon? Question: How is this to be answered? Answer: No: the one God allows in his Word, namely the describing of Christ in speech, in the preaching of the Word and administration of the sacraments, but not the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Holy Mind Touching Matters Moral which Himself Uttered in Ten Words</cite>, … (d. 1624; London: Robert Mylbourne, 1625), God’s Holy Mind touching matters Moral, which Himself uttered in Ten Words, or Ten Commandments…, p. 30</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0181e0f60e" data-kw="invocation of saints refuted memory not worship">
<blockquote><p>Rather the question is whether they are to be reverenced with religious worship properly so called. This our opponents wish; we deny. At the outset, we oppose the calumnies of the papists who slander us as despisers and enemies of the saints because we repudiate the worship of them (as if disgrace were thrown upon the saints when what belongs to God and Christ alone is not attributed to them). Now although their memory is very sacred to us, still we think that care should be diligently taken that they be not worshipped to the injury of God.</p></blockquote>

</figure><figure class="quote" id="q-99848ae32d" data-kw="">
<blockquote><p>The phrase that follows, “before my face,” makes the offense more heinous because God is provoked to jealousy as often as we substitute our own inventions in place of him. This is like a shameless woman who brings in an adulterer before her husband’s very eyes only to vex his mind the more.… Therefore, when God by his present power and grace testified that he kept watch over the people whom he had chosen, he warned them—to keep them even more from the crime of rebellion—that they could introduce no new gods without his witnessing and observing their sacrilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 2.8.16</span></figcaption>

</figure><figure class="quote" id="q-fa58b92034" data-kw="">
<blockquote><p>…God was immediately present in and with the ark, the temple, the holy mountain, the bush, the cloud and the fire which came from heaven, speaking and manifesting Himself to his people by his own immediate voice and miraculous extraordinary presence: So that worshipping before these things had the same reason which makes the 24 elders in heaven worship before the throne. For in these things God did immediately manifest his presence, as well as in heaven. Though there be a difference in the degrees of the immediate manifestation of his presence in earth and in heaven, yet magne et minus non variant speciem [greater and less do not vary the species]. Now God is present in the sacrament, not extraordinarily, but in the way of an ordinary dispensation, not immediately but mediately. [While pictures of the ark, temple and Mt. Sinai might be lawfully made, because those things only extraordinarily revealed God’s presence at extraordinary times, and apart from that they did not but only revealed God’s presence in an ordinary manner (as like the sacraments, which pictures may be made of), yet there were no times at which the burning bush and the pillar and cloud of fire did not extraordinarily reveal God’s presence.] Yet to no better purpose they [formalist opponents] tell us that when God spake Abraham fell on his face. And when the fire came down at Elijah’s prayer, the people fell on their faces. What is this to the purpose? And how shall kneeling in a mediate and ordinary worship [such as in receiving the Supper] be warranted by kneeling in the hearing of God’s own immediate voice, or in seeing the miraculous signs of his extraordinary presence?… Moreover it is objected out of Lev. 9:24; 2 Chron. 7:3; Mic. 6:6; 2 Chron. 29:28-30, that all the people fell on their faces before the legal sacrifices when the fire consumed the burnt-offering. Whereunto it may be answered that the fire which came from God and consumed the burnt offerings was one of the miraculous signs of God’s extraordinary and immediate presence… But if we will particularly consider all these places, we find in the first two, that beside the fire, the glory of the Lord did also appear in a more miraculous and extraordinary manner, Lev. 9:23, ‘The glory of the Lord appeared to all the people,’ 2 Chron. 7:1, 12, ‘The glory of the Lord filled the house.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4, p. 69</span></figcaption>

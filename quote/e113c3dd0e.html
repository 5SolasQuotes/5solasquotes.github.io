<blockquote><p>for the obligation of all oaths is only observable while the matter thereof is in being: and this rule is undeniable, sublata juramenti materia tollitur obligatio [the matter of the oath being taken away, the obligation is removed]. I conceive therefore, that although when time was, I was bound to monarchical government, both to the substance and to the settled form and circumstances thereof, as they stood in law, yet that now I am no more bound thereunto, because ipso facto these ties are unloosed not by the absolution of any earthly power to pronounce the tie void (which nevertheless has also been done by the supreme power of the nation when they declared the government to be altered), but by the decree of heaven, which has providentially and ipso facto loosened the ties by removing the late king and his heirs from the legal capacity wherein they stood towards me formerly, that is, before this parliament made it treason to make any more addresses to him, and before he was sentenced for treason himself. Now that God has a right by the changes of government to absolve you from your sacred ties I suppose you will not deny, and that He has changed this government is undeniable; for without Him it could not have been done, and He claims to Himself the sole power of changing governments, Dan. 4:17. And that the commonwealth has also a power according to emergencies to dispose of the government within itself for its own safety, I think will not by you be denied; and if by the changes which it has power to make within itself, as emergencies require, the matter of your oath be taken away, it is clear that thereby the obligation is extinct. Above all this, I shall offer unto your consideration something concerning the original of your sacred tie; for the oath which you took to maintain certain forms and circumstances of government (which in their own nature are alterable) was lawful to be taken by you, either because the supreme authority that then was required it of you, and you saw no just cause to refuse that which they required, or because only you of your own accord did choose to take such an oath: I suppose you will not say the last… it will follow then that the tie to those things was sacred; that is, it was lawful for you to be bound by an oath to them only, because the supreme authority which was over you, and had power to establish those forms and circumstances of government, did require such an obligation from you, to engage you to be faithful thereunto, and if this is the only lawful original of such a sacred tie; Then I say, that the dissolution of that tie, may arise from the same power which did establish it: he that has power to oblige me to a form of his creating has also power to absolve me from that obligation. In old times and now also in some places, the soldiers were wont to be obliged by oath to serve their commanders faithfully, till they should be dismissed: the Romans called this sacramentum militare: Now he that might lawfully give them this oath, might also absolve them from it; and so it is in all obligations unto things which in their own nature are not morally good, but good only ex instituto legitimo [out of the legitimate institution]: the power which gives them a being, may take it from them; If therefore the supreme power which now is over you has absolved you from those ties, your voluntary continuance under them cannot make them any longer sacred, no more than your voluntary taking an oath at first to them, without the conduct of the authority which was over you, could have made your obligation lawful. I conceive then, that in things merely civil and human (that is of a changeable nature, as being subject to civil and human ordinances) your oath cannot put a stronger tie upon you towards them than their nature will bear; that is, you cannot be unalterably bound unto them, for if they cease to be, you cannot stand obliged towards them; now that they do cease to be is clear, and that they may cease to be by the power which is over you, and by the acts of divine providence absolving subjects from such oaths.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Objections Against the Taking of the Engagement Answered… (London, 1650)</cite>, pp. 7-9</span></figcaption>

<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into by all the members of the visible Church of one nation or kingdom: when the Church in that kingdom or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not accrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn Covenant in the presence of God. 4. …it is lawful also expressely, publicly and solemnly to vow to God those things which are in the precepts of God enjoined to all believers: But that necessity of making this public, solemn and express covenant, in the presence of the whole Church, requiring it as a thing of absolute necessity to the essential constitution of a particular church, we do not acknowledge: But that union above mentioned, we conceive sufficient by the Word of God for the joining men professing the faith into one particular church. So that, by the Word of God, to the essence and entireness of a particular Church, this union is sufficient.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/apollonius.html">Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England concerning the Government of the Church of God (London, 1645), ch. 2, ‘Of a church-covenant’</cite>, pp. 15-16</span></figcaption>

<blockquote><p>It is farther observed in this Answer [of the Larger Catechism], that men take the name of God in vain by sinful lots. This subject, however, needs explanation. Let it be considered, then, that when lots were an ordinance, by which God in an extraordinary manner determined things which were before unknown, they being an instituted means of appealing to Him for that end, as in the case of Achan and others, were not to be used in a common way; for to have used them so would have been a profaning of a sacred institution. But as this extraordinary ordinance has now ceased, it does not seem unlawful, so as to be an instance of profaneness to make use of lots in civil matters, provided we do not consider them as an ordinance which God has appointed, in which we think we have ground to expect his immediate interposition and to depend upon it as if it were a divine oracle. In this view it would be unlawful, at present, to use lots in any respect whatsoever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity (d. 1734; NY: Robert Carter, 1855), vol. 2, p. 340 Ridgley (c. 1667–1734) was an English dissetning minister and here wrote the first commentary on Westminster’s Larger Catechism.</cite></span></figcaption>

<blockquote><p>Now because lots may say to cards what Naomi said to Boaz, ‘They are near unto us, and of our affinity,’ something also of the use of them. It were no great harm if there were no other cards used than those of clothiers about wool and of mariners in the ship. But as for cards to play with, let us not wholly condemn them, lest lacing our consciences too straight we make them to grow awry on the wrong side. Such recreations are lawful if we use them as Jonathan tasted the honey, putting forth the end of his rod he touched a little of it, and his eyes were cleared. But let us take heed of a surfeit into which those do fall who either play out of covetousness, or for more than their estates can bear, or constantly and continually; all their meat is sauce, all the days in their almanac play-days, though few holy-days. The Creation lasted but a week, but these men’s recreations all the days of their lives; such using of lawful exercises is altogether unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-fuller.html">Thomas Fuller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Collection of Sermons … together with Notes upon Jonah (London: Stafford, 1655-1657), on Jonah 1:7</cite>, pp. 40-41</span></figcaption>

</figure><figure class="quote" id="q-d08938eaf8" data-kw="">
<blockquote><p>The ordinary recreations which we have in winter, and in most solitary times busy our minds with, are cards, tables, and dice, shovelboard, chess-play, the philosophers’ game, small trunks, music, masks, singing, dancing, ulegames, catches, purposes, xmerry tales, news, etc. Many too nicely take exceptions at cards, tables, and dice, and such lusorious lots, whom Gataker well confutes. Which though they be honest recreations in themselves, yet may justly be otherwise excepted at, as they are often abused… So good things may be abused, and that which was first invented to refresh men’s weary spirits, when they come from other labors and studies to exhilarate the mind, to entertain time and company, tedious otherwise in those long solitary winter nights, and keep them from worse matters, an honest exercise is contrarily perverted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-burton.html">Robert Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Melancholy… (Oxford: Lichfield, 1621), 2nd Partition, Section 2, Member 4, ‘Exercise Rectified of Body &amp; Mind,’ pp. 346-47 Burton (1577-1640) was an Anglican clergyman and Oxford fellow.</cite></span></figcaption>

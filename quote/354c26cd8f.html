<main class="wrap"><figure class="quote" id="q-354c26cd8f" data-kw="">
<blockquote><p>Because what God so severely punished must have been no light sin but a detestable crime, we must consider what species of sin (peccati) there was in Adam’s fall that kindled God’s horrible vengeance against the whole human race. To regard Adam’s sin as gluttonous intemperance (a common notion) is childish. As if the sum and head of all virtues lay in abstaining solely from one fruit, when all sorts of desirable delights abounded everywhere; and not only abundance but also magnificent variety was at hand in that blessed fruitfulness of earth! We must, therefore, look deeper. The prohibition from the tree of knowledge of good and evil was a test of obedience (obedientiae examen), that Adam, by observing it, might prove his willing submission to the command of God. The very name of the tree shows the sole purpose of the precept was to keep him content with his lot and to prevent him from becoming puffed up with cupidity. The promise (promissio), which gave him hope of eternal life as long as he should eat of the tree of life (arbore vitae), and, on the other hand, the fearful denunciation of death the moment he should taste of the tree of knowledge of good and evil, were meant to test (probandam) and exercise his faith. Hence it is not hard to deduce by what means Adam provoked God’s wrath upon himself. Indeed, Augustine speaks rightly when he declares that pride was the beginning of all evils. For if ambition had not raised man higher than was meet and right, he could have remained in his original state.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, 2.1.4.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f29b709d88" data-kw="">
<blockquote><p>God intended a Law-dispensation but for a time. 2. Adam, how he was ordained for a Law-life. 3. How predestinated to glory in Christ, how not. 4. That the heathens have no more universal grace than devils. 5. No ground for such grace. It is apparent that God intended not a Law-dispensation in paradise to stand for ever. For nothing is spoken of Adam, after the fall, but of his procreating of children, of the patriarchs, of Adam’s dying and of his acts before the fall, the place of paradise being scarce well known, which says the Lord had a farther design to lay aside the transient Law-dispensation and to set up Christ. The Lord, of purpose, gave a positive Law, forbidding eating of such a tree, added a threatening thereunto particularly, suffered the serpent to tempt, and foresaw what frail nature would do, that he might deal with man, in a dispensation of free grace. Object. Did not God ordain that Adam should have life and righteousness, if he should continue in obedience. Answ. That was a decree conditional of things, (“the man that does these things shall live”) and shows the equity and holiness of the Law, but it was not a decree of persons, by which God predestinated Adam to a Law-glory, as the end, and to Law-obedience as the effectual means leading to that end. Q. Was not Adam chosen? Ans. Adam, according to the Lord’s design, finaliter and objective (finally and objectively) was created in the state of predestination to glory and grace in Christ, as touching [his] person, but according to his inherent condition, he was created in a legal dispensation, which was a gracious inlet to Christ; And according to his Law-state as he represented all mankind, he was created as a lubric [slippery] and frail copy of weak nature. Many who are such as are not chosen are created and live under a covenant of works, having only some concomitant favors of the Gospel, as the preaching thereof. 2. Common grace, inward warnings. 3. Protections of providence and forbearance, in regard they are mixed with the elect. The heathen cannot be said to have any inward calling to grace and glory, because there be some remnants of the image of God left in them, which no more can be called universal grace, then the same sparkles that are left in devils can be called Gospel grace, for they believe, “There is one God and confess the Son of God,” (Jam. 2:19; Luk. 4:34. Mark 1:24). Only if this be called grace, that the nature of man is so capable of Gospel mercy, and the nature of the fallen angels morally not so. 2. The offer is made to them of Christ; not so to devils, we shall not contend. Reason may seem to say that all should have a share of Gospel-grace, but it may be replied to reason, why should it seem to be a part of the goodness and bounty of God to will and desire all and every one to be saved, and not to institute such a dispensation, as all and every one should actually be saved? 2. How should that stand, (“he has mercy on whom he will”) if free-will of the creature absolutely dispose of salvation and damnation? 3. How is it that the calling, adoption, and the offer of mercy is restricted to few, and was confined to the Jews only of old? But we are more ready to call the Lord to a reckoning, for his dispensation of grace to others, then to use our own, as becomes us. 2. We cannot judge aright of God and of his goodness, except he be God our very way. 3. It is a matter of no small difficulty to make right use of the Lord’s freedom of grace, and for clay humbly to adore Sovereignty, and not to stumble at the highness of his ways, who, in these points, has ways and thoughts above ours, “as the heavens are above the earth” (Isa. 55).</p></blockquote>

<blockquote><p>1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law. 2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it. 3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. I shall confirm this great truth, and evince the being of such a covenant. It is altogether denied by the Arminians that there was any such covenant, and amongst ourselves by Professor Simson, that it was a proper covenant. The weight of this matter lies here, that if the covenant made with Adam was not a proper covenant, he could not be a proper representing head; and if he was not, then there cannot be a proper imputation of Adam’s sin unto his posterity. None could ever dream, but there must be a manifest difference betwixt covenants between God and man, and those between men and men. There is no manner of equality betwixt God and man; God could require all duty of men without any covenant; yea, they have nothing but what is from him, and so owe it to him. But those things do not hinder, that, upon God’s condescending to enter into a covenant with man, there may be a proper covenant betwixt them. Though all similitudes here must halt; yet let us suppose a father to propose to his son, that if he will obey his orders, and especially in one point give him punctual obedience, for instance, labour his vineyard, he will give him a certain sum of money; and the son having nothing to labour it with, the father furnishes him with all things necessary thereto; the son accepts of this proposal. Can any man say that there is not a proper bargain, or covenant, in this case betwixt the father and his son, although the son was tied by the bond of nature to obey his father’s commands in all this antecedently to the bargain, and though he has nothing to labour it with, but what he has from the father? Let him perform his father’s orders now according to the covenant, and he can challenge the sum as a debt, which he could not do before. For proof this, consider, 1. Here is a concurrence of all that is necessary to constitute a true and proper covenant of works. The parties contracting, God and man; God requiring obedience as the condition of life; a penalty fixed in case of breaking; and man acquiescing in the proposal. The force of this cannot be evaded, by comparing it with the consent of subjects to the laws of an absolute prince. For such a law proposed by a prince, promising a reward upon obedience to it, is indeed the proposing of a covenant, the which the subject consenting to for himself and his, and taking on him to obey, does indeed enter into a covenant with the prince, and having obeyed the law may claim the reward by virtue of paction. And so the covenant of works is ordinarily in scripture called “the law,” being in its own nature a pactional law. 2. It is expressly called a covenant in scripture, Gal. 4:2, “For these are the two covenants, the one from the Mount Sinai,” &amp;c. This covenant from Mount Sinai was the covenant of works as being opposed to the covenant of grace, namely, the law of the ten commandments, with promise and sanction, as before expressed. At Sinai it was renewed indeed, but that was not its first appearance in the world. For there being but two ways of life to be found in scripture, one by works, the other by grace; the latter hath no place, but where the first is rendered ineffectual; therefore the covenant of works was before the covenant of grace in the world; yet the covenant of grace was promulgated quickly after Adam’s fall; therefore the covenant of works behoved to have been made with him before. And how can one imagine a covenant of works set before poor impotent sinners, if there had not been such a covenant with man in his state of integrity? Hos. 6:7, “But as for them; like Adam, they have transgressed the covenant.” Our translators set the word Adam on the margin. But in Job 31:33, they translate the very same word, “as Adam.” This word occurs but three times in scripture, and still in the same sense. Job 31:33, “If I covered my transgressions, as Adam,” Psalm 82:7, “But ye shall die like Adam.” Compare ver. 6, “I have said, Ye are gods; and all of you are children of the Most High;” compared with Luke 3:38, “Adam, which was the son of God.” And also here, Hos. 6:7. While Adam’s hiding his sin, and his death are made an example, how natural is it that his transgression, that led the way to all, be made so too? This is the proper and literal sense of the words; it is so read by several, and is certainly the meaning of it. 3. We find a law of works opposed to the law of faith, Rom. 3:27. “Where is boasting then? It is excluded. By what law? of works? Nay; but by the law of faith.” This law of works is the covenant of works, requiring works, or obedience, as the condition pleadable for life; for otherwise the law as a rule of life requires works too. Again, it is a law that does not exclude boasting, which is the very nature of the covenant of works, that makes the reward to be of debt. And further, the law of faith is the covenant of grace; therefore the law of works is the covenant of works. So Rom. 6:14, “Ye are not under the law, but under grace.” And this was the way of life without question, which was given to Adam at first.”

— Thomas Boston, The Whole Works of Thomas Boston: Discourses on Prayer, ed. Samuel M‘Millan (Aberdeen: George and Robert King, 1852), 11.180–82. (HT: John Fonville)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C1.+I+shall+confirm+this+great+truth%2C+and+evince+the+being+of+such+a+covenant.+It+is+altogether+denied+by+the+Arminians+that+there+was+any+such+covenant%2C+and+amongst+ourselves+by+Professor+Simson%2C+that+it+was+a+proper+covenant.+The+weight+of+this+matter+lies+here%2C+that+if+the+covenant+made+with+Adam+was+not+a+proper+covenant%2C+he+could+not+be+a+proper+representing+head%3B+and+if+he+was+not%2C+then+there+cannot+be+a+proper+imputation+of+Adam%E2%80%99s+sin+unto+his+posterity.+None+could+ever+dream%2C+but+there+must+be+a+manifest+difference+betwixt+covenants+between+God+and+man%2C+and+those+between+men+and+men.+There+is+no+manner+of+equality+betwixt+God+and+man%3B+God+could+require+all+duty+of+men+without+any+covenant%3B+yea%2C+they+have+nothing+but+what+is+from+him%2C+and+so+owe+it+to+him.+But+those+things+do+not+hinder%2C+that%2C+upon+God%E2%80%99s+condescending+to+enter+into+a+covenant+with+man%2C+there+may+be+a+proper+covenant+betwixt+them.+Though+all+similitudes+here+must+halt%3B+yet+let+us+suppose+a+father+to+propose+to+his+son%2C+that+if+he+will+obey+his+orders%2C+and+especially+in+one+point+give+him+punctual+obedience%2C+for+instance%2C+labour+his+vineyard%2C+he+will+give+him+a+certain+sum+of+money%3B+and+the+son+having+nothing+to+labour+it+with%2C+the+father+furnishes+him+with+all+things+necessary+thereto%3B+the+son+accepts+of+this+proposal.+Can+any+man+say+that+there+is+not+a+proper+bargain%2C+or+covenant%2C+in+this+case+betwixt+the+father+and+his+son%2C+although+the+son+was+tied+by+the+bond+of+nature+to+obey+his+father%E2%80%99s+commands+in+all+this+antecedently+to+the+bargain%2C+and+though+he+has+nothing+to+labour+it+with%2C+but+what+he+has+from+the+father%3F+Let+him+perform+his+father%E2%80%99s+orders+now+according+to+the+covenant%2C+and+he+can+challenge+the+sum+as+a+debt%2C+which+he+could+not+do+before.+For+proof+this%2C+consider%2C+1.+Here+is+a+concurrence+of+all+that+is+necessary+to+constitute+a+true+and+proper+covenant+of+works.+The+parties+contracting%2C+God+and+man%3B+God+requiring+obedience+as+the+condition+of+life%3B+a+penalty+fixed+in+case+of+breaking%3B+and+man+acquiescing+in+the+proposal.+The+force+of+this+cannot+be+evaded%2C+by+comparing+it+with+the+consent+of+subjects+to+the+laws+of+an+absolute+prince.+For+such+a+law+proposed+by+a+prince%2C+promising+a+reward+upon+obedience+to+it%2C+is+indeed+the+proposing+of+a+covenant%2C+the+which+the+subject+consenting+to+for+himself+and+his%2C+and+taking+on+him+to+obey%2C+does+indeed+enter+into+a+covenant+with+the+prince%2C+and+having+obeyed+the+law+may+claim+the+reward+by+virtue+of+paction.+And+so+the+covenant+of+works+is+ordinarily+in+scripture+called+%E2%80%9Cthe+law%2C%E2%80%9D+being+in+its+own+nature+a+pactional+law.+2.+It+is+expressly+called+a+covenant+in+scripture%2C+Gal.+4%3A2%2C+%E2%80%9CFor+these+are+the+two+covenants%2C+the+one+from+the+Mount+Sinai%2C%E2%80%9D+%26c.+This+covenant+from+Mount+Sinai+was+the+covenant+of+works+as+being+opposed+to+the+covenant+of+grace%2C+namely%2C+the+law+of+the+ten+commandments%2C+with+promise+and+sanction%2C+as+before+expressed.+At+Sinai+it+was+renewed+indeed%2C+but+that+was+not+its+first+appearance+in+the+world.+For+there+being+but+two+ways+of+life+to+be+found+in+scripture%2C+one+by+works%2C+the+other+by+grace%3B+the+latter+hath+no+place%2C+but+where+the+first+is+rendered+ineffectual%3B+therefore+the+covenant+of+works+was+before+the+covenant+of+grace+in+the+world%3B+yet+the+covenant+of+grace+was+promulgated+quickly+after+Adam%E2%80%99s+fall%3B+therefore+the+covenant+of+works+behoved+to+have+been+made+with+him+before.+And+how+can+one+imagine+a+covenant+of+works+set+before+poor+impotent+sinners%2C+if+there+had+not+been+such+a+covenant+with+man+in+his+state+of+integrity%3F+Hos.+6%3A7%2C+%E2%80%9CBut+as+for+them%3B+like+Adam%2C+they+have+transgressed+the+covenant.%E2%80%9D+Our+translators+set+the+word+Adam+on+the+margin.+But+in+Job+31%3A33%2C+they+translate+the+very+same+word%2C+%E2%80%9Cas+Adam.%E2%80%9D+This+word+occurs+but+three+times+in+scripture%2C+and+still+in+the+same+sense.+Job+31%3A33%2C+%E2%80%9CIf+I+covered+my+transgressions%2C+as+Adam%2C%E2%80%9D+Psalm+82%3A7%2C+%E2%80%9CBut+ye+shall+die+like+Adam.%E2%80%9D+Compare+ver.+6%2C+%E2%80%9CI+have+said%2C+Ye+are+gods%3B+and+all+of+you+are+children+of+the+Most+High%3B%E2%80%9D+compared+with+Luke+3%3A38%2C+%E2%80%9CAdam%2C+which+was+the+son+of+God.%E2%80%9D+And+also+here%2C+Hos.+6%3A7.+While+Adam%E2%80%99s+hiding+his+sin%2C+and+his+death+are+made+an+example%2C+how+natural+is+it+that+his+transgression%2C+that+led+the+way+to+all%2C+be+made+so+too%3F+This+is+the+proper+and+literal+sense+of+the+words%3B+it+is+so+read+by+several%2C+and+is+certainly+the+meaning+of+it.+3.+We+find+a+law+of+works+opposed+to+the+law+of+faith%2C+Rom.+3%3A27.+%E2%80%9CWhere+is+boasting+then%3F+It+is+excluded.+By+what+law%3F+of+works%3F+Nay%3B+but+by+the+law+of+faith.%E2%80%9D+This+law+of+works+is+the+covenant+of+works%2C+requiring+works%2C+or+obedience%2C+as+the+condition+pleadable+for+life%3B+for+otherwise+the+law+as+a+rule+of+life+requires+works+too.+Again%2C+it+is+a+law+that+does+not+exclude+boasting%2C+which+is+the+very+nature+of+the+covenant+of+works%2C+that+makes+the+reward+to+be+of+debt.+And+further%2C+the+law+of+faith+is+the+covenant+of+grace%3B+therefore+the+law+of+works+is+the+covenant+of+works.+So+Rom.+6%3A14%2C+%E2%80%9CYe+are+not+under+the+law%2C+but+under+grace.%E2%80%9D+And+this+was+the+way+of+life+without+question%2C+which+was+given+to+Adam+at+first.%E2%80%9D%0A%0A%E2%80%94+Thomas+Boston%2C+The+Whole+Works+of+Thomas+Boston%3A+Discourses+on+Prayer%2C+ed.+Samuel+M%E2%80%98Millan+%28Aberdeen%3A+George+and+Robert+King%2C+1852%29%2C+11.180%E2%80%9382.+%28HT%3A+John+Fonville%29&amp;url=https%3A%2F%2F5solasquo </figure><figure class="quote" id="q-fe5106738c" data-kw="">
<blockquote><p>The law that was given from Mount Sinai by the ministry of Moses, considered as the matter of the covenant of works, was a ministry of rigor and of terror in opposition to the gospel dispensation, which is called grace; it was a ministration of condemnation and of death. Considered as a rule of duty in the covenant of grace and in the hand of Moses the typical mediator, it was a ministration of shadows as opposed to truth. The gospel, or New Testament dispensation of the covenant of grace, is styled “grace and truth” (John 1:14, 17). It is grace, for it is a clear and efficacious exhibition of the covenant of grace to sinners of mankind. It is truth, as opposed not only to falsehood but to shadows. While Jesus Christ has brought to His church the clearest discoveries of redeeming grace, He Himself is the substance of all the Jewish types and the accomplishment of all their predictions and promises. Moses was the minister of the law; Christ is the author of grace and truth. All the promises and blessings of salvation flow from His grace and are performed by His truth.</p></blockquote>

<blockquote><p>1. This contract between God and the first Adam, is in sacred writ, expressly styled a covenant. “These are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” Here are two covenants mentioned, the one of which, genders to bondage, and the other, to liberty or freedom. The covenant of grace, or “The law of the Spirit of life in Christ Jesus,” is the one which genders to liberty, or which makes free from the law of sin and death. The one, therefore, which genders to bondage, must be that law or covenant of works, which was republished to the Israelites, from mount Sinai; which required perfect obedience to the ten commandments, on pain of death, and contained a promise of life, to the man who should do, or perform such obedience.</p></blockquote>

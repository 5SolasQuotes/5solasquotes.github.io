<main class="wrap"><figure class="quote" id="q-b1be368dec" data-kw="">
<blockquote><p>The words are, That the day of the Lord shall not be until the time that that man of sin be revealed. That man of sin must be revealed ere the Lord come in the world again. This is one thing with that which went before of an universal Apostasy, the coming of an universal Apostasy and the revelation of that man of sin the Antichrist, is one thing in sundry words: For what is the Antichrist but the head of this Apostasy and universal defection? and of all Apostates under the Heavens he is the chief Apostate. Now he is called here a man, the Antichrist as though there were but one person.

Mark it, (for this place is mistaken) When ye hear of this name of the Antichrist, who is here called the man of sin, be not deceived. The Antichrist would persuade you that this name of Antichrist signifies but one man some one person who shall be in the world at such a time. No, the name of Antichrist imports not one man only, but a succession of persons, one after another: in one kingdom or tyranny over the Church of Christ in the world; All this succession of persons is expressed by the name of one man or one person, because they ran on all one course, and every one of them has but one purpose to exercise their time in oppression of the Church of God. Therefore the whole succession is called but on man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), Part II, pp 58-59.</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Inquiry into the Original, Nature, Institution, Power, Order, and Communion of Evangelical Churches</cite>, ch. 3 (Works 15)</span></figcaption>

</figure><figure class="quote" id="q-63d112067c" data-kw="Succession of doctrine">
<blockquote><p>Succession is necessary in the church, but of doctrine and of the common and pastoral office; but not of place, or of persons and of the extraordinary apostolic office. Pastors in the first way succeed the apostles, but no one could have succeeded them in the latter way. … There are officers who must perpetually accompany the church, as pastors and teachers. Others, who were appointed to found it (such as apostles and evangelists), ought to remain only for a time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.19.16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a> › <a href="../topics/church-government-and-the-ministry/papacy/apostolic-succession.html">Apostolic succession</a></span></div>

<blockquote><p>Have the Apostles any successors? To speak properly, they had none to succeed them in the degree and dignity of apostleship; and therefore when James was beheaded, none was chosen into his place. Otherwise all pastors and ministers of the gospel, who are lawfully called to the dispensation of the Word, sacraments, and keys, are the true and undoubted successors of the Apostles and have the same commission in the ministration of the Gospel which they had, though not in the same degree or dignity, What is the property of the head? To be highest; and therefore there can be but one, even Christ, What is the office of the head? To convey the powers of it into all the members. For as the natural members take spirit and sense from the head, so the church hath her spiritual life and feeling of Christ, who is only able to quicken and give life. Whom by this title of the head of the Church Paul lifts up above all angels, archangels, principalities and powers. And therefore if the pope were the successor of Peter and Paul, yet should he not be therefore the head of the church, which agrees to no simple creature in heaven or under heaven. But may not the pope be a ministerial head? It would make the Church a monster, if it should have more heads at once then one: or to be at any time without a needful head; as it must needs be in the death of the pope. Besides that, when Christ is always effectually present in his Church by his spirit, what needs he to have a vicar or deputy? What then shall we say to the words of Christ, &amp;8220;You are Peter and upon this rock will I build my Church&amp;8221;? whereby is inferred that Peter was ruler of the apostles, and consequently of the world and therefore the popes, as Peter’s successors, should be rulers over all. The rock whereupon Christ will build his church is not Peter but the effectual and confessing faith of Peter as appears by the divers words the evangelist uses from that whereby Peter is called. And if it be understood of Peter, yet it must be esteemed that, to avoid confusion, Peter gave answer in the name of all, upon whom in respect of their ministry, the church is as well builded as upon Peter. How may it be showed that Peter answered for all? Because all were asked, otherwise our Savior Christ received no answer. Which, to think, is a charge of disobedience upon the other apostles, upon our Savior Christ, of negligence. Who, seeking by this question to strengthen all the Apostles in the faith towards himself, should have given them no strength. Neither by experience of the work of God within themselves nor by the glorious promises which he annexed to this confession, unless he had in Peter’s answer received the answer of others. Secondly, when it appears other where, by Peter’s own confession, that the rest knew that Christ was the son of the living God, as well as he himself, what should hinder them not to make confession of it as well as did Peter? If Peter were chief of all, doth it follow that the Pope of Rome should be so? No verily: for howsoever they say Peter was Bishop of Rome, yet indeed that cannot be proved by Scripture. Rather the contrary, for if Peter had been at Rome when Paul was there, amongst many others he would not have forgotten to make mention of him, upon divers occasions he had thereof. Especially he would not have wrapped him in the common charge, that all had forsaken him. Also his proper charge being amongst the Jews, who were never frequent, or many in Rome: and after the few that were there, banished from thence, what likelihood is there that Peter would most reside there where he had least to do? And if he had been there, yet would he not be Bishop there; the Bishopric being a degree of ministry far under the apostleship whereunto he was called. But grant he were Bishop of Rome; does it follow thereof that the Bishop of Rome must be his successor? No: for first it should have been but a personal right. And secondly, if it belonged to his successors, Jerusalem and Antioch, where he sat before he is supposed to sit at Rome, might challenge it as well as they of Rome. Neither can his death, which they suppose to have been at Rome, give that privilege to him above them, more then the death of Christ privileged Jerusalem, which by the just judgment of God for the same cause was made an heap of stones. And thirdly, if it did belong to his successors at Rome; yet it belongs to his successors in doctrine, and not in place only. Consider more, that if the Church were builded upon Peter, it was in respect of the doctrine he taught.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise Of Christian Religion</cite>, (1611), 196–99. [spelling and punctuation revised]</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

rs%2C+should+be+rulers+over+all.+The+rock+whereupon+Christ+will+build+his+church+is+not+Peter+but+the+effectual+and+confessing+faith+of+Peter+as+appears+by+the+divers+words+the+evangelist+uses+from+that+whereby+Peter+is+called.+And+if+it+be+understood+of+Peter%2C+yet+it+must+be+esteemed+that%2C+to+avoid+confusion%2C+Peter+gave+answer+in+the+name+of+all%2C+upon+whom+in+respect+of+their+ministry%2C+the+church+is+as+well+builded+as+upon+Peter.+How+may+it+be+showed+that+Peter+answered+for+all%3F+Because+all+were+asked%2C+otherwise+our+Savior+Christ+received+no+answer.+Which%2C+to+think%2C+is+a+charge+of+disobedience+upon+the+other+apostles%2C+upon+our+Savior+Christ%2C+of+negligence.+Who%2C+seeking+by+this+question+to+strengthen+all+the+Apostles+in+the+faith+towards+himself%2C+should+have+given+them+no+strength.+Neither+by+experience+of+the+work+of+God+within+themselves+nor+by+the+glorious+promises+which+he+annexed+to+this+confession%2C+unless+he+had+in+Peter%E2%80%99s+answer+received+the+answer+of+others.+Secondly%2C+when+it+appears+other+where%2C+by+Peter%E2%80%99s+own+confession%2C+that+the+rest+knew+that+Christ+was+the+son+of+the+living+God%2C+as+well+as+he+himself%2C+what+should+hinder+them+not+to+make+confession+of+it+as+well+as+did+Peter%3F+If+Peter+were+chief+of+all%2C+doth+it+follow+that+the+Pope+of+Rome+should+be+so%3F+No+verily%3A+for+howsoever+they+say+Peter+was+Bishop+of+Rome%2C+yet+indeed+that+cannot+be+proved+by+Scripture.+Rather+the+contrary%2C+for+if+Peter+had+been+at+Rome+when+Paul+was+there%2C+amongst+many+others+he+would+not+have+forgotten+to+make+mention+of+him%2C+upon+divers+occasions+he+had+thereof.+Especially+he+would+not+have+wrapped+him+in+the+common+charge%2C+that+all+had+forsaken+him.+Also+his+proper+charge+being+amongst+the+Jews%2C+who+were+never+frequent%2C+or+many+in+Rome%3A+and+after+the+few+that+were+there%2C+banished+from+thence%2C+what+likelihood+is+there+that+Peter+would+most+reside+there+where+he+had+least+to+do%3F+And+if+he+had+been+there%2C+yet+would+he+not+be+Bishop+there%3B+the+Bishopric+being+a+degree+of+ministry+far+under+the+apostleship+whereunto+he+was+called.+But+grant+he+were+Bishop+of+Rome%3B+does+it+follow+thereof+that+the+Bishop+of+Rome+must+be+his+successor%3F+No%3A+for+first+it+should+have+been+but+a+personal+right.+And+secondly%2C+if+it+belonged+to+his+successors%2C+Jerusalem+and+Antioch%2C+where+he+sat+before+he+is+supposed+to+sit+at+Rome%2C+might+challenge+it+as+well+as+they+of+Rome.+Neither+can+his+death%2C+which+they+suppose+to+have+been+at+Rome%2C+give+that+privilege+to+him+above+them%2C+more+then+the+death+of+Christ+privileged+Jerusalem%2C+which+by+the+just+judgment+of+God+for+the+same+cause+was+made+an+heap+of+stones.+And+thirdly%2C+if+it+did+belong+to+his+successors+at+Rome%3B+yet+it+belongs+to+his+successors+in+doctrine%2C+and+not+in+place+only.+Consider+more%2C+that+if+the+Church+were+builded+upon+Peter%2C+it+was+in+respect+of+the+doctrine+he+taught.%E2%80%9D%0A%0A%E2%80%94+Thomas+Cartwright%2C+A+Treatise+Of+Christian+Religion%2C+%281611%29%2C+196%E2%80%9399.+%5Bspelling+and+punctuation+revised%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7dda5a7f07.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7dda5a7f07.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/02/protestant-catechism-on-the-papacy/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

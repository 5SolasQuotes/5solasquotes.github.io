<main class="wrap"><figure class="quote" id="q-6ceaa3133c" data-kw="">
<blockquote><p>Objection: These gracious effects and fruits of singing Psalms, do plead as much for singing and playing with instruments, as for singing with voices. Answer 1: This last effect of singing to the glory of God with our glory is peculiar only to singing with our tongues. Answer 2: Suppose it were true that these effects of singing Psalms did plead as much for singing and playing with instruments, as singing with voices; yet evident it is that singing with voices had the preeminence, as that which uttering the Word of God did chiefly utter the Spirit of God breathing in it. And withal evident likewise it is that it is no impeachment to an ordinance that the outward dispensing of it may be performed by Nature and Art; but notwithstanding that it may be accompanied of God with a spiritual blessing. Answer 3: Singing with instruments was typical, and so a ceremonial worship and therefore is ceased. But singing with heart and voice is a moral worship such as it written in the hearts of all men by Nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Singing of Psalms: a Gospel Ordinance</cite>, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

</figure><figure class="quote" id="q-239084461a" data-kw="">
<blockquote><p>It was at Poietiers that the evangelisation of France began in a systematic way. The school which Calvin here gathered round him comprehended persons in all conditions of life… They discoursed about Divine mysteries as they walked together on the banks of the neighboring torrent, the Clain, or as they assembled in the garden of the Basses Treilles, where… they often held their re-unions… By-and-by it was thought prudent to discontinue these meetings in the Basses Treilles, and to seek some more remote and solitary place of re-union. A deep and narrow ravine… then known as the ‘Cave of Benedict,’ but which from that day to this has borne the name of “Calvin’s grotto,” was selected as the scene of the future gatherings of the converts. It was an hour’s walk from the town… In this grotto, so far as the light of history serves, was the Lord’s Supper celebrated for the first time in France after the Protestant fashion. On an appointed day the disciples met here, and Calvin, having expounded the Word and offered prayer, handed round the bread and cup, of which all partook… The place had none of the grandeurs of cathedral, but ‘the glory of God and the Lamb’ lent it beauty. No chant of priest, ‘no swell of organ accompanied the service, but the devotion of contrite hearts, in fellowship with Christ, was ascending from that rocky chamber, and coming up before the throne in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-a-wylie.html">J.A. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of Protestantism, vol. 2, p. 179</cite></span></figcaption>

9084461a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/239084461a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/musical-instruments/#:~:text=It%20was%20at%20Poietiers%20that%20the,up%20before%20the%20throne%20in%20heaven&amp;text=It%20was%20at%20Poietiers%20that%20the%20evangelisation%20of&amp;text=and%20coming%20up%20before%20the%20throne%20in%20heaven" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-e600bb499b" data-kw="">
<blockquote><p>Concerning Musical Organs It is certain that in the ancient church and in Solomon’s temple, the use of musical instruments was accepted. Now that Christ has come, and together with the ancient priesthood and sacrifice and the representation appertaining to the Law, the use of instruments in churches has vanished like a shadow. For the various instruments of the musicians symbolized the parts and members of the elect, i.e., that the elect must worship the Lord with heart, soul, word and in every way. Thus David mentions every kind of instrument so that man may glorify God with all his strength, mind and members. He must speak and sing in the assembly with delight from the soul. For Paul would not only disapprove of the use of crude instruments, but does not permit in the church incomprehensible human words and singing that lacks edifying force; indeed, he calls them mindless that teach and sing in the assembly like barbarians in unfamiliar languages (1 Cor. 14). The fathers teach the same. There is not so much as a reference to the organ in the New Testament, nor of its introduction into the purer church; but it was only introduced in theatrical Masses, as if in obscene sport, by immoral priests to make clowns cut capers. The papal chronicles attribute its introduction to Pope Vitalian [†672]. The resolutions of the councils, together with Jerome, condemn the stentorian noise in churches of persons shouting in theatrical fashion (Amos 5, 6). In the prophets, the Lord prohibits the playing of the harp and organs, and commands that teaching be done with the human voice, not with shadows and tricks. Therefore, they do wrong that mumble foolishly before God the canonical hours as if superstitiously chattering to themselves something of merit in the process, and who keep an organ in the sacred assembly like papists and others. What my father has not planted will be rooted out (Matt. 15:13)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hungarian-confessio-catholica.html">Hungarian Confessio Catholica</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Hungarian Confessio Catholica</cite>, 1562 | ed. Dennison, Jr., Reformed Confessions of the 16th and 17th Centuries in English Translation (RHB), vol. 2, pp. 565-66</span></figcaption>

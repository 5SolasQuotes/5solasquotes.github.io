<main class="wrap"><figure class="quote" id="q-3257a990ce" data-kw="">
<blockquote><p>4. Mr. Hooker [a congregationalist] will not say all that were scattered, Acts 8[:4] (for they were all scattered, except the apostles, verse 1) did preach the Gospel, for there were of them women, verse 3; then some of them only preached. And if Mr. Hooker say they were not officers, Mr. Rutherford says they were officers, and that the extraordinariness of their condition supplied the want of a Church-calling, and let Mr. Hooker but attempt to bring a proof for it.

5. If nothing extraordinary was here, l […]t Mr. Hooker or any for him vindicate the place, Acts 8, from Anabaptists who allege the same place, Acts 8, to destroy the standing ordinance of the ministry: and read the judicious Tractate of the Ministers of London, of Mr. Collings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (1658), p. 426</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4263fc2771" data-kw="">
<blockquote><p>3. When God commands such offices to be in his house, which depend immediately upon his own immediate will of giving gifts essentially required to these offices, then these offices are so long in his Church as God is pleased by his immediate will to give these gifts; and when God denies these gifts essentially requisite, sure it is, his immediate will has altered and removed the office, not the will of the Church, so the Lord has altered and removed these offices and gifts of apostles, who could speak with tongues and seal their doctrine with miracles, evangelists, prophets extraordinarily inspired, gifts of healing, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646), p. 64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-20014c7035" data-kw="">
<blockquote><p>But you [a congregationalist] will say, in a church in an island, one may be a pastor without any ordination if the people elect him and there be no elders to ordain. I answer: it is true: but so many pastors send a pastor to be a pastor to a congregation, though that congregation never choose him, as possibly they be for the most part Popish or unwilling; yet both cases are extraordinary and the Church [is in the case of] not [being] constituted and established.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644) | pt. 1, p. 493</span></figcaption>

</figure><figure class="quote" id="q-5690fca2e6" data-kw="">
<blockquote><p>…we have in these verses a remarkable testimony to Christ’s infinite superiority over all that are born of women… There is a constant tendency in human nature to ‘hear man’ [contrast Mt. 17:5]. Bishops, priests, deacons, popes, cardinals, councils, presbyterian preachers, and independent ministers, are continually exalted to a place which God never intended them to fill, and made practically to usurp the honor of Christ. Against this tendency let us all watch, and be on our guard. Let these solemn words of the vision ever ring in our ears, ‘Hear ye Christ.’ [Mt. 17:5] The best of men are only men at their very best.</p></blockquote>

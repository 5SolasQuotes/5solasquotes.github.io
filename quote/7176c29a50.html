<blockquote><p>Hence likewise we may collect how really and cheerfully willing Christ is to save sinners. Certainly, He that makes such bitter lamentation over the foreseen ruins of Jerusalem, must needs have a very cordial, and unfeigned will and desire of her salvation… What a pathetic expostulation is here, which carries in it notices of vehement affections? Oh! how willing is Christ to give unto sinners the things that belong unto their peace? Yea, is He not more willing to bestow great things than small? Does not his willingness to give, infinitely exceed the sinners’ willingness to receive? Is not Christ more glad to receive poor and weary souls, than they are to come unto Him?… Is not every thing about Christ mighty drawing, alluring, and inviting?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ’s Tears for Jerusalem’s Unbelief &amp; Ruin, Now Humbly Recommended to England’s Consideration in this Her Day of Trial &amp; Danger (1679) 254 pp.</cite>, pp. 66-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0902f1baa4" data-kw="">
<blockquote><p>goodness (bonitas) is that act of the divine will, by which he is disposed to self-communication. Love (amor), that by which God is moved toward created things and bestows blessings on them. Grace (gratia), that by which God is moved to communicate himself to creatures of his own accord, not on grounds of merit or debt. Mercy (misericordia) is the disposition of the divine will to help the wretched, not because of any external cause, but solely of the divine goodness. Hatred (odium) in God indicates either the disapproval of sin, or the will to punish sinners that follows sin, or the denial of those salutary benefits that flow from the divine will. Longing (desiderium) in God indicates that the obedience of human beings is exceedingly pleasing to him, and not without future reward. Hope and expectation (spes et expectatio) in God signify that something is owed. God is said to rejoice (gaudere) when something is pleasing to him. Dread (metus) is something attributed to him, in order to indicate that he desires to prevent evil. Sorrow (tristia) in God indicates something that is exceedingly displeasing to God and contrary to his virtues.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/leonard-rijssen.html">Leonard Rijssen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as translated in Richard Muller, Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3, ch. 6.3, Divine Affections &amp; Virtues, A. General Considerations, 3. Doctrinal Conclusions</cite>, pp. 560-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>(2) There is more goodwill in his heart than is visible in his dealings. The merciful nature of God should be a support to us, though we see nothing of the effects of it in his providence. Job 10:13, ‘These things hast Thou hid in thine heart; I know that it is with Thee.’ He speaks of his favourable inclination to show pity to distressed creatures. We are not able always to reconcile his present dispensations with his gracious nature, yet faith must not quit its holdfast: We must see what is hid in God’s heart and comfort ourselves with that favor and mercy which we know to be essential to Him: Though the mercy and pity be not visible and obvious to sense, the disposition and inclination abides in God unchangeable and sure. God is a merciful God still, and Christ a compassionate Savior, though the effects be suspended to try and sharpen our faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fourth Volume containing One Hundred &amp; Fifty Sermons on Several Texts of Scripture… (London: J.D., 1693) | A Sermon on Mt. 15:21-28</cite>, p. 472</span></figcaption>

</figure><figure class="quote" id="q-2d590d39b0" data-kw="">
<blockquote><p>But God (says Simon Magus) would not that Adam should have eaten of the forbidden fruit, who nevertheless did eat of that fruit; it follows therefore that he remained not as his Creator would have had him to have remained; how then can God be omnipotent, or his will always fulfilled? It were necessary, if we should fully satisfy this argument, to entreat more largely of the will of God than were convenient for this place: wherefore, that we may briefly answer this objection, we must presuppose with the school-divines a threefold distinction of the will of God, according to the diversity of their proper objects:¹ the first they call his efficient, effectual, or working will, by which God does so effectually intend anything that He performs it actually by some external operation and work, either actually produced or to be produced. ¹ Aquinas, [Summa] pt. 1, quest. 19; the same: Molina, Vasquez, Suarez, Sumel, Bannez and many others. The other kind of will which the divines distinguish in God, in regard of some objects which He does not really produce, is called inefficax voluntas, a kind of propension or inclination of his divine will to the effectuating of any good effect, which might redound to the felicity of man: yet for the attaining of the end, which out of his unsearchable wisdom He has prefixed, He oftentimes permits the contrary to this his divine inclination and will; the which therefore is called God’s permissive will. As for example, God would that all men should be saved, according to that of the apostle [1 Tim. 2:4], Deus vult omnes homines saluos fieri; to wit, in his universal grace, calling and inspirations and other general means, offered to all, so that out of his infinite goodness He wishes and wills in this sort all to be saved; and that He might the more manifest his infinite mercy by the efficacy of his working will, He actually saves some; even so, to manifest his justice by his other permissive decree, He permits others to work their own ruin and eternal damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-salkeld.html">John Salkeld</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Paradise… (London: Griffin, 1617), ch. 64, pp. 319-21 Salkeld (1576–1660) was born in England, studied with Jesuits in the university of Coimbra and in Portugal, but had become a protestant again living in England by the time of this work.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<blockquote><p>At other times, He parleys and works with them, and makes gracious overtures and offers of the gospel to them. He opens a door of hope and woos and beseeches them to throw down their rebellious arms and come to Christ for life. He reveals how Christ is in a present disposition to embrace their first motion towards mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian in Complete Armor (†1679)</cite>, 1:116-17</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9712d5b242" data-kw="marks tekmēria">
<blockquote><p>By marks, however, are commonly understood certain external signs striking the senses by which we arrive at the knowledge of a hidden thing. Now these are either only probable and verisimilar, of which this is the nature—that they in some measure designate by a probable but least necessary reason a thing; or they are necessary and essential, which indicate the thing investigated certainly and infallibly: as smoke, fire; respiration, life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.12.2</span></figcaption>

<blockquote><p>That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).</p></blockquote>

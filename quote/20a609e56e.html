<blockquote><p>We have showed that the First Commandment requires that we serve and worship Jehovah, the only true God. In the three other Commandments of the First Table is showed how He is to be worshipped… how He is to be glorified at all times in the whole course of our lives in the Third [Commandment].</p></blockquote>

<blockquote><p>In rites and ceremonies divinely instituted, it is not lawful for man by his choice to add or detract anything.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“In rites and ceremonies divinely instituted, it is not lawful for man by his choice to add or detract anything.”

</figure><figure class="quote" id="q-ee9c14edcf" data-kw="">
<blockquote><p>Herein it [the 2nd Commandment] differs from the First Commandment, that commanded the worship of God which is natural, this the worship which is by divine institution. Downame Sum of Divinity. Cultus naturalis [natural worship] is that which nature directs all people to, or which arises from the nature of God. This belongs to all reasonable creatures. He that acknowledges there is a God, will acknowledge that He is to be be believed, feared, trusted, loved and prayed to: this was performed by Adam in Paradise and by the angels in Heaven, Isa. 6:3; Heb. 1:6. Cultus institutus, ‘instituted worship’ depends on the revelation of the will of God, this was commanded Adam in his innocency, as the Tree of Knowledge of Good and Evil, and the Tree of Life show. Natural worship is the chief, instituted worship may be interrupted. A time of worship is juris naturalis [of the law of nature], the seventh day juris positivi [of positive law]. Some in these days say all institutions are mere forms, and men may use or not use them at their pleasure according to their light: Qui non est religiosus non est Christianus. Cultus institutus est medium ex Dei voluntate ordinatum, ad cultum naturalem exercendum et pro nov•ndum. indica•tur hujusmodi media omnia à Deo instituta, in secundò praecepto per prohibitionem oppositorum mediorum omnium cultus ab hominibus excogitatorum, sub titulo sculptilis et imaginis, que cum praecipua fuerunt olim▪ hominum inventa, cultum Dei depravantia, aptissimè proponuntur (per Syn••dochen in Decalogo praecipuam) loco omnium humani ingenii commentorum ad cu••um spectantium. Ames, Marrow of Theology, bk. 2, ch. 13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity… (London: A.M., 1654), bk. 9, ch. 3, ‘2nd Commandment’, p. 767 margin note on Dt.</cite>, 4:15-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-748db3f4cb" data-kw="">
<blockquote><p>And thus have we made good our argument that the lawfulnss of the ceremonies cannot be warranted by any ecclesiastical law. If we had no more against them, this were enough, that they are but human additions and want the warrant of the Word. When Nadab and Abihu offered strange fire before the Lord (Lev. 10:1), and when the Jews burnt their sons and their daughters in the valley of the son of Hinnon, howsoever manifold wickedness might have been challenged in that which they did, yet if any would dispute with God upon the matter, He stops their mouths with this one answer, ‘I commanded it not, neither came it into my heart.’ (Jer. 7:31)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), bk. 3, ch. 7, section 14</cite>, p. 122</span></figcaption>

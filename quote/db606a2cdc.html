<main class="wrap"><figure class="quote" id="q-db606a2cdc" data-kw="">
<blockquote><p>And upon the first day of the week, when the disciples came together to break bread, Paul preached unto them… and continued his speech until midnight… And there sat in a window a certain young man named Eutychus, being fallen into a deep sleep: and as Paul was long preaching, he sunk down with sleep, and fell down from the third loft, and was taken up dead. And Paul went down, and fell on him, and embracing him said, Trouble not yourselves; for his life is in him. When he therefore was come up again, and had broken bread, and eaten, and talked a long while, even till break of day, so he departed.” (Acts 20:7[-11]) Where we see that upon the Lord’s Day, when this casualty fell out even in the midst of God’s worship, and a little before the sacrament, that the congregation was for a time dissolved, and Paul the preacher, and the rest of the people, the hearers, came forth to succor this man, and then returned to perform the rest of God’s service that remained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of the Sabbath</cite>, …</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-98a386b464" data-kw="">
<blockquote><p>Reason 12. Those (moderate men) that are most against Church-covenantings, speak only against the necessity of them; but the lawfulness they deny not, no nor the convenience in case of liberty; no nor the necessity of the thing, but only of the circumstantials and manner of expression, and ends by some affixed. They require that the people expressly consent to the choice of their minister, and that they be examined before the sacrament of their knowledge in the fundamentals. This differs from what we propound but in circumstances. And I should think it more seasonable and convenient to be satisfied of our people’s spiritual sufficiency and capacity for Church-communion at our first reformation of a disordered Church, or in a well-ordered Church, at their first transition out of the state of imperfect, infant members, and admission into the number of adult members (and after this, to suppose their right good to communion and Church privileges, till it be on sufficient grounds disproved, excepted against or questioned by any) than to try them as only for admission to the Lord’s Supper, suffering them to live quietly in the reputation of members, [even] so [when] they will not come to the Table of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653) | ‘An Explication of some Passages in the foregoing Propositions’, p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-cf8d9e31f7" data-kw="">
<blockquote><p>Its a wide mistake that a presbyterian Church has its formal essence from a voluntary, actual combination in such bounds, or such a circuit more or less. That is not a pillar of presbyterian Churches. For their near association, by dwelling where they may edify or scandalize one another, gives them right to be an associated Church; not simply habitation, but the habitation of such and such professors in covenant with God, baptized and giving themselves up in profession to Christ as disciples, before there be a formal consent, they are obliged to associate: yea, nor does that voluntary combination make a presbyterial Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … wherein the way of the churches of N. England is now re-examined (London, 1658), p. 190</span></figcaption>

</figure><figure class="quote" id="q-07a2916b3b" data-kw="">
<blockquote><p>In the sacrament of baptism the Independents lay a pathway to Anabaptism, for first they come close up to the most rigid Brownists, denying baptism to the most part of Christian infants; yea they will grant it to a very few: to these alone whose immediate parents are members of their congregation, who are a wonderful poor handful: all other infants they will have unbaptized till they come to the years of understanding and declare not only their actual faith and holiness, but their subjection to the Kingdom of Christ, that is to their Independency: they will have no stipulation made for the infants’ education… … Secondly, they esteem not baptized infants to be members of their church before they have entered into their [church] covenant; till then they hold them from the Lord’s Table and all the acts of discipline, as people without the Church and not members of it: If it be so, their baptism was of so small use that well they might have wanted it to the time of their admission to be members.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (1645), ch. 6, pp. 119-20</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

acrament%20of%20baptism%20the%20Independents%20lay&amp;text=the%20time%20of%20their%20admission%20to%20be%20members" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-916cd650fe" data-kw="">
<blockquote><p>Also it is said, Acts 2:47, ‘God added to the Church daily such as should be saved’; which was not a particular congregational church, but the catholic. For it is not probable that those hundred and twenty that were together at Pentecost were one congregational church, for many of them were men of Galilee, which by their habitation could not pertain to the Church in Jerusalem, and yet the rest were added to them. … Again Eph. 4:4-5, the apostle proves the Church to be but one by diverse arguments. First he says, ‘There is but one body’ of Christ… Secondly, there is but one Spirit in that whole body, which is as one soul in one body. Thirdly, there is but one hope of their calling. Fourthly, there is but one Lord or King over the whole Church. Fifthly, there is but one Faith, i.e. one religion, doctrine, worship, the same commands and statutes for all. Sixthly, There is but one baptism to admit into this Church. Now if the whole world were under one King, and governed by one Law, and all capable of the same privileges, and all made denizons by the same way of enrollment, it would make but one empire; yet so it is with all the Churches in the world: they have the same King, Law, Word, sacraments, of admission and nutrition, which they visibly subject themselves unto and receive; therefore they are all one visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-hudson.html">Samuel Hudson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Essence &amp; Unity of the Church, catholic, visible</cite>, (London, 1645), pp. 16-17</span></figcaption>

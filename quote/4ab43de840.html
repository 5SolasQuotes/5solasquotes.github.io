<blockquote><p>The debate over Remonstrant Arminianism involved more than a dispute over soteriology. The Scottish Covenanter and Commissioner to the Westminster Assembly, Robert Baillie reminds us that the original Arminians were also suspect on the doctrines of the Trinity and divine simplicity:

It is to be remarked that the Arminian spirit in Holland leads men to hell another way than here in Britain; there the Arminians with great boldness running after Vorstius &amp; Socinus with a marvelous petulancy fell to brangle [shake into confusion] the Trinity of the Divine persons, yea, the simplicity of the Divine nature itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scotch Antidote Against the English Infection of Arminianism</cite>, (London: Samuel Gellibrand, 1652), pp 18-19.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-698d53b4a3" data-kw="">
<blockquote><p>The Reformed orthodox did not only deal with the internal distinguishing marks of the Trinitarian persons, but also with their outward marks, the ‘oecumenical offices of the three persons,’ as Mastricht labeled them (Mastricht 1699, 238-40; Neele 2009, 245-78). These outward marks concern works that are appropriated to specific persons, like creation preeminently to the Father, redemption to the incarnate Son, and sanctification to the Holy Spirit (Te Velde et al. 2014, 192-93). This was not meant to deny that ultimately all Trinitarian persons participate in these works, in accordance with the rule that the externally directed works of the Trinity are undivided (opera trinitatis ad extra indivisa sunt) (Mastricht 1699, 239). To be sure, this rule applies to immanent acts that are directed ad extra, like the divine decrees or decisions, just as to the external divine works ad extra, like creation and providence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andreas-beck.html">Andreas Beck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 13, ‘God, Creation, and Providence in Post-Reformation Reformed Theology’, p. 205 in eds. Lehner, Muller, Roeber, The Oxford Handbook of Early Modern Theology, 1600-1800 (Oxford, 2016)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-trinity/the-persons.html">The Persons</a></span></div>
<div class="actions"><button class="copy" data-copy="“The Reformed orthodox did not only deal with the internal distinguishing marks of the Trinitarian persons, but also with their outward marks, the ‘oecumenical offices of the three persons,’ as Mastricht labeled them (Mastricht 1699, 238-40; Neele 2009, 245-78). These outward marks concern works that are appropriated to specific persons, like creation preeminently to the Father, redemption to the incarnate Son, and sanctification to the Holy Spirit (Te Velde et al. 2014, 192-93). This was not meant to deny that ultimately all Trinitarian persons participate in these works, in accordance with the rule that the externally directed works of the Trinity are undivided (opera trinitatis ad extra indivisa sunt) (Mastricht 1699, 239). To be sure, this rule applies to immanent acts that are directed ad extra, like the divine decrees or decisions, just as to the external divine works ad extra, like creation and providence.”

mp;text=The%20Reformed%20orthodox%20did%20not%20only%20deal%20with&amp;text=divine%20works%20ad%20extra%2C%20like%20creation%20and%20providence" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Q. What is God?

A. He is a Spirit, having his being of himself.

Expos. 9. God is a spiritual, invisible, and immaterial substance. 1. Tim. 1. 17. Luk. 24. 39.

10. God is without beginning, Psal. 90. 2. and 93. 2. Esa. 43. 10. and 44. 6. and without cause, Apoc. 1. 8. Esa. 41. 4. and 43. 10. and 48. 12. and so he is without composition, infinite, Psa. 147. 5. &amp; 145. 3. Exod. 3. 14. eternal, Prov. 8. 22, 23. Rom. 16. 26. incomprehensible, Exod. 33. 22. 23. 1. Tim. 6. 16. 1. Kin. 8. 27. Esa. 66. 1. and unchangeable, Jam. 1. 17. Mal. 3. 6.

Q. How many Gods be there?

A. Only one God and three Persons, the Father, Son, and Holy Ghost.

Expos. 11. There can be but one Omnipotent, Dan. 4. 35. infinite, eternal, most perfect first cause, and director of all things; all things are referred to one first, Rom. 11. 35. Apocal. 1. 8. and 4. 11.

12. A person generally taken, is one entire substance, not common to many, endued with life and understanding, will, and power. A person in the Godhead, is the Godhead restrained, or distinguished by his personal property. Joh. 14. 16. and 15. 1. The whole divine nature being indivisible, 1. Cor. 8. 6. is common to all three persons, Father, Son, and Holy Ghost. Act. 4. 24. 2. Cor. 1. 3. Joh. 1. 1. Rom. 9. 5. Heb. 1. 8. Numb. 12. 6. 7. with Act. 1. 16. 1. Pet. 1. 11. Heb. 1. 1. Act. 4. 25. with 2. Pet. 1. 21. and therefore whatsoever doth absolutely agree to the divine nature, or is spoken of the divine nature by relation unto the creatures, that doth agree likewise to every person in Trinity. Joh. 1. 1. Prov. 8. 22. Apoc. 1. 8. Matth. 18. 20. Joh. 3. 13. Job 26. 13. and 33. 4. Joh. 14. 26. Luk. 1. 35. Every person in Trinity, is equal in glory and eternity. Joh. 10. 30. Joh. 17. 5. Phil. 2. 6. Eph. 1. 17. with Joh. 12. 41. and there is a most near communion and union between them, by which each one is in the rest, and with the rest. Joh. 14. 10. 11. Io. 1. 1. and every one doth possess, love, and glorify each other. Prov. 8. 22. 30. v. Joh. 17. 5. working the same things. Joh. 5. 19. But the Godhead considered with the personal property of begetting, is the Father, &amp;c.

Q. What is the property of the Father?

A. To be of himself, and to beget his Son.

Expos. 13. The divine nature doth neither beget, nor is begotten: but the Father doth beget his Son by an eternal and necessary communication of his essence, wholly and indivisibly to his Son, which yet he wholly retaineth in himself. Joh. 1. 1. Pro. 8. 22, 23.

Q. What is the property of the Son?

A. To be begotten of the Father.

Q. What is the property of the Holy Ghost?

A. To proceed from the Father, and the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A short treatise: containing all the principal grounds of Christian religion. By way of questions and answers: very profitable for all sorts of men, but especially for householders</cite>, (London: William Welby, 1617), pp 50-52.</span></figcaption>

</figure><figure class="quote" id="q-ccec615c7d" data-kw="eternal generation essence">
<blockquote><p>As all generation indicates a communication of essence on the part of the begetter to the begotten (by which the begotten becomes like the begetter and partakes of the same nature with him), so this wonderful generation is rightly expressed as a communication of essence from the Father (by which the Son possesses indivisibly the same essence with him and is made perfectly like him).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.29.4</span></figcaption>

</figure><figure class="quote" id="q-411d5086bd" data-kw="">
<blockquote><p>And as the Author, and fellow-Counsellor, and Framer of the things that are in formation, He begot the Word; and as He bears this Word in Himself, and that, too, as (yet) invisible to the world which is created, He makes Him visible; (and) uttering the voice first, and begetting Him as Light of Light, He set Him forth to the world as its Lord, (and) His own mind; and whereas He was visible formerly to Himself alone, and invisible to the world which is made, He makes Him visible in order that the world might see Him in His manifestation, and be capable of being saved. 11. And thus there appeared another beside Himself. But when I say another, I do not mean that there are two Gods, but that it is only as light of light, or as water from a fountain, or as a ray from the sun. For there is but one power, which is from the All; and the Father is the All, from whom comes this Power, the Word. And this is the mind which came forth into the world, and was manifested as the Son of God. All things, then, are by Him, and He alone is of the Father. Who then adduces a multitude of gods brought in, time after time? For all are shut up, however unwillingly, to admit this fact, that the All runs up into one.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“And as the Author, and fellow-Counsellor, and Framer of the things that are in formation, He begot the Word; and as He bears this Word in Himself, and that, too, as (yet) invisible to the world which is created, He makes Him visible; (and) uttering the voice first, and begetting Him as Light of Light, He set Him forth to the world as its Lord, (and) His own mind; and whereas He was visible formerly to Himself alone, and invisible to the world which is made, He makes Him visible in order that the world might see Him in His manifestation, and be capable of being saved. 11. And thus there appeared another beside Himself. But when I say another, I do not mean that there are two Gods, but that it is only as light of light, or as water from a fountain, or as a ray from the sun. For there is but one power, which is from the All; and the Father is the All, from whom comes this Power, the Word. And this is the mind which came forth into the world, and was manifested as the Son of God. All things, then, are by Him, and He alone is of the Father. Who then adduces a multitude of gods brought in, time after time? For all are shut up, however unwillingly, to admit this fact, that the All runs up into one.”

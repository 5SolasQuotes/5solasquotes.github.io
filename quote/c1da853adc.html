</figure><figure class="quote" id="q-f9ceab92ff" data-kw="">
<blockquote><p>He prescribes not a rule necessary every where to be observed; but accommodates himself unto the custom then observed among the Corinthians. It is admirably expounded by Alting… Almost all Christians have observed the canon of the apostle. Not because the uncovering of the head is counted a token of reverence; for with a very great part of the world it is not so to this day. But as my [Herman] Witsius thinks, Videtur potius perinere ad libertatem Novi Testamenti [This seems to more pertain to the liberty of the New Testament].</p></blockquote>

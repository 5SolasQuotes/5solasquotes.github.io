<main class="wrap"><figure class="quote" id="q-81aaec752a" data-kw="">
<blockquote><p>If here it be demanded which of these we do first receive, I answere that the spirit, the virtues of the Spirit, the habitual justice which is engrafted, the external justice of Jesus Christ, which is imputed: these we receice all at one and the same time; whensoever we have any of these, we haue all; they goe together. Yet since no man is justified except he believe, and no man believes except he have faith, and no man except he have received the spirit of adoption, has faith, for asmuch as they do necessarily infer justification, and justification does of necessity presuppose them: we must needs hold that imputed righteousness, in dignity being the chiefest, is notwithstanding in order the last of all these: but actual righteousness, which is the righteousness of good works, succeeds all, follows after all, both in order and time. Which being attentively marked, shows plainly how the faith of true believers cannot be divorced from hope and love; how faith is a part of sanctification, and yet unto justification necessary; how faith is perfected by good works, and no work of ours without faith;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Discourse of Justification, Works &amp; how the Foundation of Faith is Overthrown (d. 1600; Oxford: Barnes, 1612)</cite>, pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

<blockquote><p>It is asked further: But since through faith the righteousness of Christ belongs to him who has been effectually called, cannot one be at least denominated righteous according to that righteousness which belongs to him through faith? I would not, indeed, completely deny that one who has been effectually called is already righteous through faith. But I would not admit that he can be called and named righteous, because the Judge’s sentence—which sentence evidently arises from some further grace—has not yet been delivered and pronounced concerning him. For it is entirely of grace that God pronounces righteous those who are already (in accordance with effectual calling) righteous through faith, and imputes to them another’s righteousness as if it were their own.</p></blockquote>

</figure><figure class="quote" id="q-0c51fe25c0" data-kw="">
<blockquote><p>Objection [of Papists]: But the minister may mistake the matter [in assuring a person of salvation]. Answer: True, if he speak absolutely, but if he speak upon condition of faith and true repentance he may thereupon assure a man of salvation: he may say, ‘Believe thou and repent truly, and thou shalt be saved.’ If a king should publish and make known that whosoever of such a city shall come and do such a thing, shall be thus or thus rewarded, and give charge to some to make it known to that city, shall we say that any having authority to publish the king’s pleasure, does mistake the matter in so doing, or that any of that place, to whom it should be said, go thou and do that which the king has appointed, and he thereupon going, and doing the thing appointed, does presume to take on him to know more than he ought touching the king’s pleasure? Surely no.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-elton.html">Edward Elton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians (London: Griffin, 1615), on Col. 2:18</cite>, p. 704</span></figcaption>

<blockquote><p>III. What is the cause that among the dogmatic and practical writers so many ἐναντιοφανῆ [enantiophane, apparent contradictions] occur concerning the consequent dependence, order, and succession of acts and effects of regeneration? Response: Partly that the mode of regeneration is so hidden, and many things escape us, according to that passage John 3:8; partly that the following distinctions are either not expressly observed by all, or are not applied by the reader. They are: 1. The question concerning the order, succession, and consequent dependence of habits or first acts among themselves is one thing; and the question concerning their order and dependence compared with second acts is another. So in turn the question concerning the dependence, succession, and order of second acts among themselves is one thing; and the question concerning their order compared with first acts is another. 2. Again, the question concerning the succession, priority, and posteriority of second acts in themselves is one thing; and the question concerning the succession of the same καθ’ ἡμᾶς [kath’ hēmas, according to us], or in our sense, is another. So, for example, the second act of faith, which really precedes the second acts of true grief according to God, of desire for grace, and other such motions of repentance, is in our sense and καθ’ ἡμᾶς regarded as posterior, and thus is mostly placed by the Practical writers. The reason is that those initial acts of faith (which may be called first and primary, unformed, incomplete motions) are so obscure and insensible that they are not perceived or regarded as acts of faith in that haste, in those ὠδῖνες [ōdines, birth pangs] of spiritual birth—although those now completely converted in the second act, and more and more often by the renewed practice of repentance and faith, reading back through the traces and recalling to memory that whole change of the right hand of the Most High, seem to themselves with some mental and as it were twilight evidence and diminished perspicacity to see and observe in that disturbance and commotion the mode, order, leading, and discordant concord of those affections and acts (of hope and despair, joy and grief, fear and confidence, accusation and apology, credulity and doubt, etc., 2 Corinthians 7:11; Romans 7:8–9), and their mutual dependence, promotion, impulse, and excitation—which, however, then when those things were happening they could not distinctly see or judge with certain and resolved knowledge. Not otherwise than a man, thinking back after a disease or its paroxysm, better judges concerning the state of the disease and its various affections and concomitants. But that Practical writers do not count or scarcely count those unformed, incomplete, and insensible motions of faith (which precede, accompany, and follow the acts of grief, desire, etc., and ἀχωρίστως [achōristōs, inseparably] intermingle themselves with them) among the acts of faith is not surprising. For it happens to them nearly as to physicists, who do not reckon insensible motion or impulse among motions. In the same way astronomers call the solstice the progress of the sun insensible to us. Finally, the question concerning the order of first or second acts in nature, or as to essence, is one thing; and the question concerning their order in time, or as to existence, is another. We think these distinctions have their use for explaining and reconciling many things in this matter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“III. What is the cause that among the dogmatic and practical writers so many ἐναντιοφανῆ [enantiophane, apparent contradictions] occur concerning the consequent dependence, order, and succession of acts and effects of regeneration? Response: Partly that the mode of regeneration is so hidden, and many things escape us, according to that passage John 3:8; partly that the following distinctions are either not expressly observed by all, or are not applied by the reader. They are: 1. The question concerning the order, succession, and consequent dependence of habits or first acts among themselves is one thing; and the question concerning their order and dependence compared with second acts is another. So in turn the question concerning the dependence, succession, and order of second acts among themselves is one thing; and the question concerning their order compared with first acts is another. 2. Again, the question concerning the succession, priority, and posteriority of second acts in themselves is one thing; and the question concerning the succession of the same καθ’ ἡμᾶς [kath’ hēmas, according to us], or in our sense, is another. So, for example, the second act of faith, which really precedes the second acts of true grief according to God, of desire for grace, and other such motions of repentance, is in our sense and καθ’ ἡμᾶς regarded as posterior, and thus is mostly placed by the Practical writers. The reason is that those initial acts of faith (which may be called first and primary, unformed, incomplete motions) are so obscure and insensible that they are not perceived or regarded as acts of faith in that haste, in those ὠδῖνες [ōdines, birth pangs] of spiritual birth—although those now completely converted in the second act, and more and more often by the renewed practice of repentance and faith, reading back through the traces and recalling to memory that whole change of the right hand of the Most High, seem to themselves with some mental and as it were twilight evidence and diminished perspicacity to see and observe in that disturbance and commotion the mode, order, leading, and discordant concord of those affections and acts (of hope and despair, joy and grief, fear and confidence, accusation and apology, credulity and doubt, etc., 2 Corinthians 7:11; Romans 7:8–9), and their mutual dependence, promotion, impulse, and excitation—which, however, then when those things were happening they could not distinctly see or judge with certain and resolved knowledge. Not otherwise than a man, thinking back after a disease or its paroxysm, better judges concerning the state of the disease and its various affections and concomitants. But that Practical writers do not count or scarcely count those unformed, incomplete, and insensible motions of faith (which precede, accompany, and follow the acts of grief, desire, etc., and ἀχωρίστως [achōristōs, inseparably] intermingle themselves with them) among the acts of faith is not surprising. For it happens to them nearly as to physicists, who do not reckon insensible motion or impulse among motions. In the same way astronomers call the solstice the progress of the sun insensible to us. Finally, the question concerning the order of first or second acts in nature, or as to essence, is one thing; and the question concerning their order in time, or as to existence, is another. We think these distinctions have their use for explaining and reconciling many things in this matter.”

— Gisbertus Voetius, Disputation 30, ‘On Regeneration’, pt. 2 (1639) tr. AI by Roman Prestarri in Select Theological Disputations (1655), vol. 2, pp. 447ff. Latin at Confessionally Reformed Theology">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIII.+What+is+the+cause+that+among+the+dogmatic+and+practical+writers+so+many+%E1%BC%90%CE%BD%CE%B1%CE%BD%CF%84%CE%B9%CE%BF%CF%86%CE%B1%CE%BD%E1%BF%86+%5Benantiophane%2C+apparent+contradictions%5D+occur+concerning+the+consequent+dependence%2C+order%2C+and+succession+of+acts+and+effects+of+regeneration%3F+Response%3A+Partly+that+the+mode+of+regeneration+is+so+hidden%2C+and+many+things+escape+us%2C+according+to+that+passage+John+3%3A8%3B+partly+that+the+following+distinctions+are+either+not+expressly+observed+by+all%2C+or+are+not+applied+by+the+reader.+They+are%3A+1.+The+question+concerning+the+order%2C+succession%2C+and+consequent+dependence+of+habits+or+first+acts+among+themselves+is+one+thing%3B+and+the+question+concerning+their+order+and+dependence+compared+with+second+acts+is+another.+So+in+turn+the+question+concerning+the+dependence%2C+succession%2C+and+order+of+second+acts+among+themselves+is+one+thing%3B+and+the+question+concerning+their+order+compared+with+first+acts+is+another.+2.+Again%2C+the+question+concerning+the+succession%2C+priority%2C+and+posteriority+of+second+acts+in+themselves+is+one+thing%3B+and+the+question+concerning+the+succession+of+the+same+%CE%BA%CE%B1%CE%B8%E2%80%99+%E1%BC%A1%CE%BC%E1%BE%B6%CF%82+%5Bkath%E2%80%99+h%C4%93mas%2C+according+to+us%5D%2C+or+in+our+sense%2C+is+another.+So%2C+for+example%2C+the+second+act+of+faith%2C+which+really+precedes+the+second+acts+of+true+grief+according+to+God%2C+of+desire+for+grace%2C+and+other+such+motions+of+repentance%2C+is+in+our+sense+and+%CE%BA%CE%B1%CE%B8%E2%80%99+%E1%BC%A1%CE%BC%E1%BE%B6%CF%82+regarded+as+posterior%2C+and+thus+is+mostly+placed+by+the+Practical+writers.+The+reason+is+that+those+initial+acts+of+faith+%28which+may+be+called+first+and+primary%2C+unformed%2C+incomplete+motions%29+are+so+obscure+and+insensible+that+they+are+not+perceived+or+regarded+as+acts+of+faith+in+that+haste%2C+in+those+%E1%BD%A0%CE%B4%E1%BF%96%CE%BD%CE%B5%CF%82+%5B%C5%8Ddines%2C+birth+pangs%5D+of+spiritual+birth%E2%80%94although+those+now+completely+converted+in+the+second+act%2C+and+more+and+more+often+by+the+renewed+practice+of+repentance+and+faith%2C+reading+back+through+the+traces+and+recalling+to+memory+that+whole+change+of+the+right+hand+of+the+Most+High%2C+seem+to+themselves+with+some+mental+and+as+it+were+twilight+evidence+and+diminished+perspicacity+to+see+and+observe+in+that+disturbance+and+commotion+the+mode%2C+order%2C+leading%2C+and+discordant+concord+of+those+affections+and+acts+%28of+hope+and+despair%2C+joy+and+grief%2C+fear+and+confidence%2C+accusation+and+apology%2C+credulity+and+doubt%2C+etc.%2C+2+Corinthians+7%3A11%3B+Romans+7%3A8%E2%80%939%29%2C+and+their+mutual+dependence%2C+promotion%2C+impulse%2C+and+excitation%E2%80%94which%2C+however%2C+then+when+those+things+were+happening+they+could+not+distinctly+see+or+judge+with+certain+and+resolved+knowledge.+Not+otherwise+than+a+man%2C+thinking+back+after+a+disease+or+its+paroxysm%2C+better+judges+concerning+the+state+of+the+disease+and+its+various+affections+and+concomitants.+But+that+Practical+writers+do+not+count+or+scarcely+count+those+unformed%2C+incomplete%2C+and+insensible+motions+of+faith+%28which+precede%2C+accompany%2C+and+follow+the+acts+of+grief%2C+desire%2C+etc.%2C+and+%E1%BC%80%CF%87%CF%89%CF%81%CE%AF%CF%83%CF%84%CF%89%CF%82+%5Bach%C5%8Drist%C5%8Ds%2C+inseparably%5D+intermingle+themselves+with+them%29+among+the+acts+of+faith+is+not+surprising.+For+it+happens+to+them+nearly+as+to+physicists%2C+who+do+not+reckon+insensible+motion+or+impulse+among+motions.+In+the+same+way+astronomers+call+the+solstice+the+progress+of+the+sun+insensible+to+us.+Finally%2C+the+question+concerning+the+order+of+first+or+second+acts+in+nature%2C+or+as+to+essence%2C+is+one+thing%3B+and+the+question+concerning+their+order+in+time%2C+or+as+to+existence%2C+is+another.+We+think+these+distinctions+have+their+use+for+explaining+and+reconciling+many+things+in+this+matter.%E2%80%9D%0A%0A%E2%80%94+Gisbertus+Voetius%2C+Disputation+30%2C+%E2%80%98On+Regeneration%E2%80%99%2C+pt.+2+%281639%29+tr.+AI+by+Roman+Prestarri+in+Select+Theological+Disputations+%281655%29%2C+vol.+2%2C+pp.+447ff.+Latin+at+Confessionally+Reformed+Theology&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1ccd7ccfd6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1ccd7ccfd6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=III.%20What%20is%20the%20cause%20that,reconciling%20many%20things%20in%20this%20matter&amp;text=III.%20What%20is%20the%20cause%20that%20among%20the&amp;text=explaining%20and%20reconciling%20many%20things%20in%20this%20matter" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

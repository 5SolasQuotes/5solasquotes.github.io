<main class="wrap"><figure class="quote" id="q-cd4ab28589" data-kw="against Sabellius">
<blockquote><p>The passages that the Apostle to the Hebrews applies to Christ are not obscure praises of the supreme God: &quot;You, Lord, laid the foundation of the earth in the beginning, and the heavens are the work of your hands.&quot; Also, &quot;Let all God&#x27;s angels worship him.&quot; John begins his Gospel with a splendid proclamation of Christ&#x27;s divinity: &quot;In the beginning was the Word, and the Word was with God, and the Word was God.&quot; This phrase, &quot;the Word was God, and was with God,&quot; clearly argues both the divinity of Christ and the distinction of persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XV</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6fcdad7bf1" data-kw="against Arian">
<blockquote><p>The Scriptures teach so frequently and so explicitly that the Son is God and eternal that to argue otherwise is to willfully ignore the clear light of evidence. Notable is Psalm 45, where, according to the Apostle in Hebrews 1, the Psalmist addresses Christ: &quot;Your throne, O God, is forever and ever; the scepter of your kingdom is a scepter of uprightness. You have loved righteousness and hated wickedness; therefore, God, your God, has anointed you with the oil of gladness beyond your companions.&quot; And in Isaiah 9:6, the Son is called &quot;Mighty God, Everlasting Father.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XIV</span></figcaption>

— Pierre Du Moulin, Theological Theses on the One God and Three Persons, XIV">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20Scriptures%20teach%20so%20frequently%20and%20so%20explicitly%20that%20the%20Son%20is%20God%20and%20eternal%20that%20to%20argue%20otherwise%20is%20to%20willfully%20ignore%20the%20clear%20light%20of%20evidence.%20Notable%20is%20Psalm%2045%2C%20where%2C%20according%20to%20the%20Apostle%20in%20Hebrews%201%2C%20the%20Psalmist%20addresses%20Christ%3A%20%22Your%20throne%2C%20O%20God%2C%20is%20forever%20and%20ever%3B%20the%20scepter%20of%20your%20kingdom%20is%20a%20scepter%20of%20uprightness.%20You%20have%20loved%20righteousness%20and%20hated%20wickedness%3B%20therefore%2C%20God%2C%20your%20God%2C%20has%20anointed%20you%20with%20the%20oil%20of%20gladness%20beyond%20your%20companions.%22%20And%20in%20Isaiah%209%3A6%2C%20the%20Son%20is%20called%20%22Mighty%20God%2C%20Everlasting%20Father.%E2%80%9D%0A%0A%E2%80%94%20Pierre%20Du%20Moulin%2C%20Theological%20Theses%20on%20the%20One%20God%20and%20Three%20Persons%2C%20XIV&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fcdad7bf1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6fcdad7bf1.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-d3901eaec3" data-kw="">

</figure><figure class="quote" id="q-b0d6ffec2e" data-kw="Word Wisdom Spirit">
<blockquote><p>The Son is the Word and Wisdom of the Father, begotten from eternity and without beginning in time, and the Holy Spirit is the divine power proceeding from the Father and the Son. In this matter, we must tread cautiously and with suspended judgment. This doctrine must be approached soberly and reverently, as it surpasses human comprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Trinity</cite>, Thesis VIII–IX</span></figcaption>

</figure><figure class="quote" id="q-ccec615c7d" data-kw="eternal generation essence">
<blockquote><p>As all generation indicates a communication of essence on the part of the begetter to the begotten (by which the begotten becomes like the begetter and partakes of the same nature with him), so this wonderful generation is rightly expressed as a communication of essence from the Father (by which the Son possesses indivisibly the same essence with him and is made perfectly like him).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.29.4</span></figcaption>

<main class="wrap"><figure class="quote" id="q-9045564d62" data-kw="">
<blockquote><p>The rule of faith (regula fidei), indeed, is altogether one, alone immoveable and irreformable; the rule, to wit, of believing in one only God omnipotent, the Creator of the universe, and His Son Jesus Christ, born of the Virgin Mary, crucified under Pontius Pilate, raised again the third day from the dead, received in the heavens, sitting now at the right (hand) of the Father, destined to come to judge quick and dead through the resurrection of the flesh as well (as of the spirit). First we affirm that we desire to follow Scripture alone as rule of faith and religion, without mixing with it any other thing which might be devised by the opinion of men apart from the Word of God, and without wishing to accept for our spiritual government any other doctrine than what is conveyed to us by the same Word without addition or diminution, according to the command of our Lord. Genevan Confession (1536), art. 1 But we hold that the interpretation of the Scripture to be orthodox and genuine which is gleaned from the Scriptures themselves (from the nature of the language in which they were written, likewise according to the circumstances in which they were set down, and expounded in the light of and unlike passages and of many and clearer passages) and which agree with the rule of faith (regula fidei) and love, and contributes much to the glory of God and man’s salvation. Second Helvetic Confession (Heinrich Bullinger; 1566), ch. 2. Under the name of Holy Scripture, or the Word of God written, are now contained all the books of the Old and New Testaments…All which are given by inspiration of God to be the rule of faith and life. Westminster Confession of Faith 1.2. All synods or councils, since the Apostles’ times, whether general or particular, may err; and many have erred. Therefore they are not to be made the rule of faith, or practice; but to be used as a help in both. Westminster Confession of Faith 31.3 3. Q: What is the Word of God? A. The Holy Scriptures of the Old and New Testament are the Word of God, the only rule of faith and obedience. Westminster Larger Catechism, 3.</p></blockquote>

</figure><figure class="quote" id="q-926b5fe04f" data-kw="">
<blockquote><p>First, that God offers to the men of this world, helps and means, either of the knowledge of God in Nature, or of grace in Christ: and that to this end, to lead them to repentance and salvation… Thus God offered to the carnal Israelites means of grace to purge them, to turn them, Prov. 1:13, to gather them, Mt. 23:37, to convince them, Jn. 16:8-9, to draw them with cords of man and bands of love, Hos. 11:4, to dress them to bring forth good fruit, Isa. 5:4. Secondly, that the means God uses for these good ends are in some measure sufficient (if they be not hindered by men) to bring them to the attainment of these ends: for when God says Himself, He uses these means for these ends; for us to say, these means are not sufficient for these ends, seems to me to derogate from the wisdom and sufficiency of God, whose works are all of them perfect, Deut. 32:4, and so sufficient for the ends for which He wrought them. Yet God forbid I should doubt of that which our Savior tells the Jews, ‘No man can come to Christ, except the Father draw him,’ Jn. 6:44, by the same almighty power and authority whereby He sent Christ into the world.</p></blockquote>

<blockquote><p>What does it mean to have a god? or, what is God? Answer: A god means that from which we are to expect all good and to which we are to take refuge in all distress, so that to have a God is nothing else than to trust and believe Him from the [whole] heart; as I have often said that the confidence and faith of the heart alone make both God and an idol. If your faith and trust be right, then is your god also true; and, on the other hand, if your trust be false and wrong, then you have not the true God; for these two belong together, faith and God. That now, I say, upon which you set your heart and put your trust is properly your god. Therefore it is the intent of this commandment to require true faith and trust of the heart which settles upon the only true God, and clings to Him alone.… Whatever you lack of good things, expect it of Me, and look to Me for it, and whenever you suffer misfortune and distress, creep and cling to Me. I, yes, I, will give you enough and help you out of every need; only let not your heart cleave to or rest in any other.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f4237cccc" data-kw="">
<blockquote><p>I know that even by some of the Fathers these two places, to wit, Eph. 4:11-12 and 1 Tim. 3:2 with 8, are adduced for the same end [for bishops]: because, in the first place, the apostle reckons out both extraordinary and ordinary preaching-officers, without making any mention of bishops: which could not be, if they were not the same with pastors that are named, as Ambrose on the place asserts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lecture 3, ‘Concerning the Identity of Angel, Bishop &amp; Presbyter’ in A Commentary upon the Book of the Revelation</cite>, (Edinburgh, 1658), pp. 223-33, p. 224</span></figcaption>

</figure><figure class="quote" id="q-76badbb90b" data-kw="">
<blockquote><p>…he [Paul] speaks of many special positive precepts and rules of policy, as of poor widows, the alms to be given to them; the not rebuking of an elder, the office of elders governing, and of elders laboring in the Word and doctrine, the not receiving an accusation against an elder, but under two or three witnesses, the public rebuking of those who offend publicly, the not admitting to the ministry raw and green soldiers not tried, and many other particulars of policy, of all which he says gravely, [1 Tim. 5] v. 21, ‘I charge thee before God and the Lord Jesus Christ, and the elect angels, that thou observe these things, etc.’ Certainly, [in Greek] these things were not one commandment, but all the precepts of faith and of Church-Government spoken of in this epistle; and truly I shall think that Paul who particularizes that Timothy should not drink water, but a little wine because of his infirmity, and of bringing with him the cloak that he left at Troas, and the parchments, 2 Tim. 4, does far more specify all the positives of policy and writ how all the Timothies and pastors are to behave themselves in the Church of God… … …for other positive things of policy that should be of perpetual use, and not all of the same kind, and of equal necessity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Introduction, Section 1, pp. 11-12</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

</figure><figure class="quote" id="q-719ef5777b" data-kw="">
<blockquote><p>…The case is not here as in earthly cities: a man who is a free citizen in one burrough is not for that a free citizen of all the burroughs and cities on earth; nor is he who is civilly excommunicated and cast out of his city privileges in one city, cast out of his city privileges in all other cities whereof he is a free member: and the reason is, there is not one common owner and Lord of all the cities on earth, who can give or take away, in a law-way, city privileges; But the case is far otherwise in the privileges of visible Churches, for he who is a member of one visible congregation is by his baptism and sincere profession, and his professed standing in Covenant with God, a member of all visible congregations on earth, as he is baptized in all congregations on earth; and if he be excommunicated out of a single congregation, he is excommunicated out of all, and loses right to the seal of the Lord’s Supper in all visible congregations, as his sins are bound in Heaven to all also, for that one common Head and Savior, who gives him right to the seals of Christ’s body and blood in one, gives him right to these seals in all. For we worthily communicate with Christ in his body and blood, not as his body was broken and his blood shed for one single visible congregation, but as broken and shed for the whole Church-universal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 2, ch. 4, section 5, pp. 194-5</span></figcaption>

<blockquote><p>By 1644, Rutherford was already involved in another round of debate, which was set off by John Cotton. Particularly, Cotton’s ‘The Keys Of The Kingdom Of Heaven’ (1644) was so influential in England that John Owen, a Presbyterian, became convinced that Cotton was right and, finally, supported the Congregational form of church government.¹ ¹ See John Owen’s Preface in A Defence of Mr. John Cotton from the Imputation of Self-Contradiction Charged on Him by Mr. Daniel Cawdrey (Oxford: H. Hall for T. Robinson, 1658)…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3f80f93133" data-kw="">
<blockquote><p>Goodness so descends and comes from God unto the creature as that it stops not there, but ascends and returns again unto God: either by way of manifesting of his glory as a mere subject and representative glass of his goodness in the unreasonable creature, or by way of giving glory to Him, not only as a mere subject whereon his goodness is legibly engraven, but also as a subject yielding obedience to the command in the reasonable and sanctified creature. (Amor est [Greek]. Circulus perpetuus est in amore. [Love is [Greek]. A perpetual circle is in love]). Hence love is said to be both ecstatical, that is, carrying the lover as it were out of himself unto the loved, as it is with the soul removed out of the body in a trance: and circular, the beginning and end of which circle is God, that Alpha and Omega from whom and to whom are all things. Unto that infinite and increated sea whence all created rivers of goodness come, thither they return again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist</cite>, … (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d847c7d254" data-kw="">
<blockquote><p>XXXVIII. Although God can be said to will men to be saved who yet are not saved (when it treats of the will of complacency [eurestias] which commands man’s duty and declares what is pleasing to God), yet this cannot be said equally of the will of decree. As many as God wills to be saved, He also wills to save and actually saves at the appointed time, that his will may not be rendered vain and frustrated. But in this question (as was just said), it is not treated simply of that which He holds dear and wills to be done by men, but of that which He Himself wills to do towards men by destinating to them salvation under the condition of faith, and determining to send Christ for this end that He might acquire it for them. Therefore they are mistaken who discover a hiding place in this distinction, as if in this affair the question were only whether God wills all men to be saved and not whether He wills to save them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1 | 4th Topic, 17th Question, ‘Can there be attributed to God any conditional will, or universal purpose of pitying the whole human race fallen in sin, of destinating Christ as Mediator to each and all, and of calling them all to a saving participation of his benefits? We deny., p. 412</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

sonline.com/on-conditional-aspects-of-gods-revealed-will/#:~:text=XXXVIII.%20Although%20God%20can%20be%20said,whether%20He%20wills%20to%20save%20them&amp;text=XXXVIII.%20Although%20God%20can%20be%20said%20to%20will&amp;text=and%20not%20whether%20He%20wills%20to%20save%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d59742bc63" data-kw="">
<blockquote><p>But Damascene makes the emphasis on the mode of willing. For he distinguishes in God an antecedent will and a consequent will. And the antecedent will is the will with respect to that for which God makes man, and it is irrefragably of goods. The consequent will, however, is the will, not that which follows merits, but that which wills some things according to the foreknowledge of merits. The first, namely the antecedent, is called by the masters the conditional will or the will by which God wills, as far as it depends on Him. The second, however, namely the consequent, is called absolute. The difference, however, between this will and that is not according to a diversity of affection or mode of willing that is in God, but according to the reason of connoting and understanding. For as God is said to will the salvation of all, as far as it depends on Him and antecedently, there is connoted in all men an orderability to salvation, both on the part of the nature given and on the part of the grace offered. For God gave a nature according to which they could know Him and, once known, seek Him, and once sought, find Him, and once found, adhere to Him, and through this obtain salvation. He similarly offered grace, when he sent and offered his Son, whose price sufficed for the salvation of all. He also bestowed and showed the laws and mandates of salvation. He Himself is also present to all who inquire and is near to all who call upon Him. Therefore, to will antecedently to save man is to do what is ordered to salvation and not to be lacking to the one who wills to arrive. Whence, to will antecedently to save does not connote salvation, but orderability to salvation. To will, however, consequently or absolutely to save is to will to give salvation to him whom he foreknows will arrive at salvation through his help and grace, and it connotes the event of salvation. And thus it is not to be said that God wills all men to be saved. The masters agree more with this response, although both are good. According to this, therefore, it must be answered that God wills all men to be saved, as far as it depends on Him or by his antecedent will, but not by his absolute or consequent will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 46, Question 1, ‘Whether God wills all men to be saved by the will of his good-pleasure? [No]’</span></figcaption>

</figure><figure class="quote" id="q-518af43fee" data-kw="">
<blockquote><p>Just as God can be metaphorically signified as willing what He does not will (by will properly understood), so He can be metaphorically signified as willing what He properly wills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-baptiste-gonet.html">Jean Baptiste Gonet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Shield of Thomistic Theology</cite>, 5 vols. 10th ed. (1667; Antwerp: Pitteri, 1744), vol. 1, tract 4, On the Will of God &amp; his Providence, disp. 4, Antecedent &amp; Consequent Will of God tr. AI by The Faith Received | It must also be noted that although these two wills [good-pleasure and sign] differ from each other, they do not always mutually exclude each other, but sometimes both are concerned with the same object considered in different ways, for as St. Thomas says here, art. 12, reply to obj. 2:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

ine</a></div>

<blockquote><p>38. Hence the will of God is the first cause of things. Rev. 4:11, ‘By thy will they are, and were created.’ But the will of God, as it wills to work outwardly, does not presuppose the goodness of the object, but by willing does make the object. James 1:18, ‘Because He would, He begat us.’ Rom. 9:18, ‘He hath mercy on whom He will.’ 39. Therefore there is no cause properly so called to be given of God’s will. 40. Hence it is rightly said that God does will one thing to exist for another: but not that that one thing is a proper cause whereby the will of God is inwardly moved to appoint that other thing. So God would that the sun and stars should exist, for the generation, conservation and corruption of things below: yet the sun and stars are not a cause why God would that those things should be generated, conserved and corrupted. And so it is in all things out of God, which indeed among themselves are causes and effects, even as they depend upon the divine will, but there is no cause of God’s will out of itself. 41. Also the willing of one thing in God is not properly a cause effecting that He will another thing in Himself, because the efficiency of a cause upon an effect, and dependance of the effect upon a cause, cannot be in the will of God, which is God Himself, truly and simply willing all things together and at once, with one only act; yet it is true that the Schoolmen say that a passive attingency of the divine will in respect of one thing is a cause of a passive attingency in respect of another: and so in this sense it is truly and piously said that God wills some one thing because He wills another. 42. Therefore although He wills many things which will not follow but upon some antecedent act of the creature, yet the very act of willing in God does not properly depend as a consequent thing upon the act of the creature. Neither is it lawful under the appellation of an ‘antecedent will’ to give unto God that imperfect will which is called velleitas, a ‘woulding’ in the schools. For it does not agree to an omniscient, omnipotent and infinitely, blessed Nature. 43. Wherefore that opinion which determines that God does will something antecedently to the act of the creature, which same thing afterwards He wills not towards them, but wills another thing, is not to be admitted: because it makes the will of God mutable and depending upon the act of the creature, so that as often as the act of the creature is changed, so often also it is changed. 44. By that opinion also, that form of speech prescribed in the Word of God wherein we commit ourselves and all ours to God, as ‘I will do this or that if God will,’ [Jm. 4:15] should not be used in all things, but [rather, it is by that opinion] turned contrarily, ‘God will do this or that, if man will.’ 45. This will determines of all things, greatest, least, contingent, necessary, free, without exception…</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5911d442cf" data-kw="">
<blockquote><p>Controversy II: What is justifying faith? … Antithesis [of Romanists]: Justifying faith is one of the dispositions for justification; it is not a certain knowledge of the divine will nor a trust in divine mercy in Christ, but a simple mental assent, by which we accept the whole word of God, even without understanding it, as well as the traditions of the Roman Church. [The Reformed] Censure: 1. The definition of faith and many examples in Hebrews 11 prove that faith is a confident assent, that is, a trust in God that generates obedience. See Romans 4, where Abraham’s faith is discussed. 2. The phrases “believe in God” (Job 12 and 14; 1 Peter 1) and “hope and trust in God,” and similar ones in the Psalms, prove that faith is not a simple assent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-h-alsted.html">Johann H. Alsted</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio (d. 1638) at Nosferatu’s Substack (2024)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>
<div class="actions"><button class="copy" data-copy="“Controversy II: What is justifying faith? … Antithesis [of Romanists]: Justifying faith is one of the dispositions for justification; it is not a certain knowledge of the divine will nor a trust in divine mercy in Christ, but a simple mental assent, by which we accept the whole word of God, even without understanding it, as well as the traditions of the Roman Church. [The Reformed] Censure: 1. The definition of faith and many examples in Hebrews 11 prove that faith is a confident assent, that is, a trust in God that generates obedience. See Romans 4, where Abraham’s faith is discussed. 2. The phrases “believe in God” (Job 12 and 14; 1 Peter 1) and “hope and trust in God,” and similar ones in the Psalms, prove that faith is not a simple assent.”

— Johann H. Alsted, ‘On Justification &amp; Good Works in General’ in Theologia polemica, exhibens praecipuas huius aeui in religionis negotio controuersias sex in partes tributa studio (d. 1638) at Nosferatu’s Substack (2024)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CControversy+II%3A+What+is+justifying+faith%3F+%E2%80%A6+Antithesis+%5Bof+Romanists%5D%3A+Justifying+faith+is+one+of+the+dispositions+for+justification%3B+it+is+not+a+certain+knowledge+of+the+divine+will+nor+a+trust+in+divine+mercy+in+Christ%2C+but+a+simple+mental+assent%2C+by+which+we+accept+the+whole+word+of+God%2C+even+without+understanding+it%2C+as+well+as+the+traditions+of+the+Roman+Church.+%5BThe+Reformed%5D+Censure%3A+1.+The+definition+of+faith+and+many+examples+in+Hebrews+11+prove+that+faith+is+a+confident+assent%2C+that+is%2C+a+trust+in+God+that+generates+obedience.+See+Romans+4%2C+where+Abraham%E2%80%99s+faith+is+discussed.+2.+The+phrases+%E2%80%9Cbelieve+in+God%E2%80%9D+%28Job+12+and+14%3B+1+Peter+1%29+and+%E2%80%9Chope+and+trust+in+God%2C%E2%80%9D+and+similar+ones+in+the+Psalms%2C+prove+that+faith+is+not+a+simple+assent.%E2%80%9D%0A%0A%E2%80%94+Johann+H.+Alsted%2C+%E2%80%98On+Justification+%26+Good+Works+in+General%E2%80%99+in+Theologia+polemica%2C+exhibens+praecipuas+huius+aeui+in+religionis+negotio+controuersias+sex+in+partes+tributa+studio+%28d.+1638%29+at+Nosferatu%E2%80%99s+Substack+%282024%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5911d442cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5911d442cf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/faith#:~:text=Controversy%20II%3A%20What%20is%20justifying%20faith,faith%20is%20not%20a%20simple%20assent&amp;text=Controversy%20II%3A%20What%20is%20justifying%20faith&amp;text=prove%20that%20faith%20is%20not%20a%20simple%20assent" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

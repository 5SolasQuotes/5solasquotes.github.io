<blockquote><p>God’s call sometimes is ineffectual, and sometimes effectual. So the same apostle plainly declares in 1 Thess. 2:13: “For this cause also thank we God, which effectually works also in you that believe.” Observe that it is the work of God’s Spirit in the heart, superadded to the Word of the Gospel, as spoken by men, that makes any call effectual. Without this inward work, God may call, and the soul will never answer… It is this effectual work of God’s Spirit, in regenerating the soul by infusing of habits of grace, which distinguishes an internal effectual call of God form a mere external and ineffectual one… The text makes sure that it might be known whether or not God has so called you by His Word, as that also He has worked in you by His Spirit; whether God has illuminated your understanding, and inclined your will, so that you have complied with God’s will, and have answered His call. Whether, when God drew you, you ran after Him (Cant. 1:4); whether, when God entreated and persuaded you to be reconciled to Him you consented (2 Cor. 5:20); whether, when He wooed you, He also won you; whether, when He invited you to the wedding supper of His Son, you made no excuse or delay, but accepted, and welcomed the offer of the Gospel with faith and love (Luke 14:18). All which if you did do, it arose from the power of an inward call, being superadded to the outward call of the Word…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-fairclough.html">Richard Fairclough</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Puritan Sermons</cite>, vol. 6, ‘The Papal Doctrine In Denying The Possibility Of Assurance Is False, And Has A Dangerous Tendency To Destroy The True Place And Comfort Of Souls In The Certain Hopes Of Everlasting Happiness. – 2 Peter 1:10’, p. 377-78</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8118efa58" data-kw="">
<blockquote><p>Divine decrees are of two kinds: one efficacious and absolute, the other inefficacious and conditional. The latter is concerned with the thing to be realized taken in itself, abstracting from all actual circumstance. Thus, for example, God wills the salvation of all men. But, in fact, God permits final impenitence in a sinner (e.g. Judas) as manifestation of infinite justice. Efficacious decrees on the contrary are concerned with the thing to be realized taken with all its concrete circumstances of place and time. Hence these decrees are immutable and infallible. (Ia, q. 19, a. 6 [Whether the Will of God is always fulfilled?], ad 1)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-garrigou-lagrange.html">Reginald Garrigou-Lagrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reality: a Synthesis of Thomistic Thought</cite>, (Herder Book Co., 1950) | pt. 5, Redemptive Incarnation, ch. 32, “Introduction”, pp. 204-5</span></figcaption>

</figure><figure class="quote" id="q-4c394ca331" data-kw="">
<blockquote><p>Three things are to be observed in this speech:

1. God’s resolution not always to strive with man by his Spirit. My Spirit has striven a great while; it shall strive yet a little longer; but it shall not strive always. The Holy Spirit is a striving Spirit with the children of men; striving them away from sin, and to bring them to God; striving by the checks of their own consciences, but the ministry of the Word, by the rebukes of Providence; striving by one fair warning after another to reclaim the sinner. Have not we ourselves experienced these strivings?—something within us that has whispered in an hour of temptation, “Do not this abominable thing which the Lord hates?” ‘Twill be our wisdom to hearken to such whispers, and to close with them, striving against sin. Heb 12:4. If the Spirit of God be resisted in its strivings, and quenched in its motions, though it may strive long, yet it will not strive always. ‘Tis a principle with men not to be always persuading those with whom they cannot prevail; neither will the blessed Spirit do so. If Ephraim be joined to idols, is it not a righteous thing with God to say, Strive no more with him, let him alone? Hosea 4:17. What guest will stay long there where he is not welcome? Is it not wisdom then to improve these strivings while we have them?

2. The reason of that resolution: For that he also is flesh; carnal, earthly, sensual, corrupted, depraved, defiled; and therefore ‘tis to no purpose to strive with him; ‘tis but labor lost. It is as good to go about to change the Ethiopian’s skin or the leopard’s spots, as to reclaim and reform these impenitent sinners. Flesh, in scripture, is frequently opposed to spirit. It is the corrupt nature that renders the strivings of the blessed Spirit ineffectual. ‘Tis the law in the members that wars against the law of the mind. Rom. 7:23. The flesh and the spirit are sworn enemies one to another, and between them there is a constant conflict. Gal. 5:17. Now where the flesh, the carnal part, is so far suffered to prevail, as that the man may be denominated flesh, there the Spirit will not always, will not long strive. Those therefore that would enjoy the Spirit’s strivings, must curb and restrain, and not gratify and encourage, the corrupt motions and carnal desires of the flesh and of the mind. Eph. 2:3.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-henry.html">Philip Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition upon the First 11 Chapters of Genesis</cite>, (d. 1696; London: Nisbet &amp; Co., 1839), pp. 166-67 on Gen. 6:3, “And the Lord said, My Spirit shall not always strive with man, for that he also is flesh.”</span></figcaption>

<blockquote><p>Section 4, ‘On the imperfections which an inefficacious will and a will suspended from a condition seem to display: objections are dissolved.’ .

1. Certain arguments of the contrary opinion have been solved elsewhere, or will have to be solved below; for certain arguments are directed immediately to proving that the divine will totally precedes our wills, so that in no way does it wait for them. But these have been solved elsewhere. Other arguments, however, contend immediately and directly that the application of God to concur with free choice would be confused, blind, and fortuitous, if it were to depend on a condition, provided that free choice should will. Nevertheless we shall show this inference to be null below in disputation 45 and the following.

2. But the following objections seem to be proper to the present undertaking. The first is: Inefficacy of will is an imperfection; therefore no will of God is inefficacious. It is confirmed, because the desire of a thing not to be obtained by its nature is apt to sadden and afflict the one desiring. It is answered: Inefficacy is an imperfection when it proceeds from impotence of the will. But when the will could, if it willed, effectively obtain any object whatsoever, and yet does not will to obtain it effectively, but only to desire it ineffectively; then rather it is a perfection of the will, and a dominion over itself and over its power. It is confirmed, since to will not to produce other worlds is not an imperfection, but rather a perfection; therefore likewise to will not to produce effectively free actions, but only to supply to them a sufficient concurrence, will not be an imperfection. To the confirmation it is answered: if the desired thing is not obtained on account of a defect of power, or if the desired thing increases in some way the happiness of the desiring will; then not to obtain that thing can of itself sadden and afflict. But to God neither is there lacking power to obtain, nor is the happiness of God increased in anyway by the obtaining of the desired thing.

3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation.

4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Section 4, ‘On the imperfections which an inefficacious will and a will suspended from a condition seem to display: objections are dissolved.’ .

1. Certain arguments of the contrary opinion have been solved elsewhere, or will have to be solved below; for certain arguments are directed immediately to proving that the divine will totally precedes our wills, so that in no way does it wait for them. But these have been solved elsewhere. Other arguments, however, contend immediately and directly that the application of God to concur with free choice would be confused, blind, and fortuitous, if it were to depend on a condition, provided that free choice should will. Nevertheless we shall show this inference to be null below in disputation 45 and the following.

2. But the following objections seem to be proper to the present undertaking. The first is: Inefficacy of will is an imperfection; therefore no will of God is inefficacious. It is confirmed, because the desire of a thing not to be obtained by its nature is apt to sadden and afflict the one desiring. It is answered: Inefficacy is an imperfection when it proceeds from impotence of the will. But when the will could, if it willed, effectively obtain any object whatsoever, and yet does not will to obtain it effectively, but only to desire it ineffectively; then rather it is a perfection of the will, and a dominion over itself and over its power. It is confirmed, since to will not to produce other worlds is not an imperfection, but rather a perfection; therefore likewise to will not to produce effectively free actions, but only to supply to them a sufficient concurrence, will not be an imperfection. To the confirmation it is answered: if the desired thing is not obtained on account of a defect of power, or if the desired thing increases in some way the happiness of the desiring will; then not to obtain that thing can of itself sadden and afflict. But to God neither is there lacking power to obtain, nor is the happiness of God increased in anyway by the obtaining of the desired thing.

3. The second objection is, that: A conditional volition is proper to a will which cannot obtain that good without the condition appended: just as a conditional will of retaining wares in a storm [on the sea] is proper to a will which cannot avoid shipwreck unless a jettison of the wares be made. It is confirmed, because that will of the merchant would effectively preserve the wares, if he could without danger, or inconvenience, and difficulty. But God, without danger, inconvenience, and difficulty, could have saved all men, if He willed. Therefore neither by a conditional will does He will their salvation.

4. It is answered: By denying the first antecedent. For although the will be omnipotent, and can without an appended condition obtain such a good, nonetheless most wisely and most powerfully it uses a conditioned volition, when another greater good, incompatible, is loved by an efficacious volition, which depends on the aforesaid condition. But the [proposed] greater good is a better administration of the universe, and a more illustrious manifestation of divine justice together with mercy requires that the salvation of all be loved, as much as regards God, efficaciously; nor does it allow that, by the antecedent will of God, impediments of salvation be decreed and procured; yet at the same time it requires that many men be so left to their own choice that they be permitted, if they will, to resist the aforesaid will of God. Since therefore this greater good efficaciously willed by God implies a contradiction with the salvation of those same men efficaciously willed, for that reason God most wisely and most powerfully appends a condition to His will, depending upon the choice of men. For this volition satisfies the natural propensity and benevolence, which He professes toward men, even the reprobate, without dissimulation. It is confirmed: By the example of the human will of Christ the Lord, to whom there was not lacking the power of avoiding death, according to that of Mt. 26: “Do you think that I cannot ask my Father, and He will provide for Me now more than twelve legions of angels?” and Jn. 10: “I lay down my life, that I may take it again. No one takes it from Me; but I lay it down of Myself.”

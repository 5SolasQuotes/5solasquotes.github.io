<main class="wrap"><figure class="quote" id="q-44939741d7" data-kw="">
<blockquote><p>While it’s likely that Machen himself took no doctrinal exceptions to the Westminister Standards, it’s clear from his own words and leadership in the formation of the OPC that he believed officers should be granted exceptions to doctrines (not just wording) that do not strike at the fundamentals of the Presbyterian and Reformed system and that they should be allowed to teach these exceptions. We know this because of how he approached the question of premillennialism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/derek-radney.html">Derek Radney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘J. Gresham Machen on Confessional Subscription: Not a Fundamentalist in holding to the Westminster Standards’</cite>, (2023) Substack</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“While it’s likely that Machen himself took no doctrinal exceptions to the Westminister Standards, it’s clear from his own words and leadership in the formation of the OPC that he believed officers should be granted exceptions to doctrines (not just wording) that do not strike at the fundamentals of the Presbyterian and Reformed system and that they should be allowed to teach these exceptions. We know this because of how he approached the question of premillennialism.”

</figure><figure class="quote" id="q-518aae817d" data-kw="">
<blockquote><p>Therefore I exhorted all men equally in my doctrine, that they should leave the unsure way, and follow that way, which was taught us by our master Christ. He is our only Mediator and makes intercession for us to God his Father. He is the dore by the which we must enter in. He that enters not in by this door, but climbs another way is a thief and murder. He is the verity and life. He that goes out of this way, there is no doubt but he shal fall into the mire: yea verily he is fallen into it already. This is the fashion of my doctrine, the which I have ever followed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-wishart.html">George Wishart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Tragical Death of David Beaton, Bishop of St. Andrews in Scotland, whereunto is joined the martyrdom of master George Wishart</cite>, … (London, 1548) John Knox was a bodyguard to Wishart for a time.</span></figcaption>

</figure><figure class="quote" id="q-7150fa0a38" data-kw="">
<blockquote><p>Thirdly, the doctrine it self (short, but exceeding effectual) of the Lord Jesus and his office, as we shall hear hereafter. Fourthly, after the doctrine, he comes to the exhortation, exhorting the Colossians to constancy and perseverance in the faith and doctrine of Jesus Christ. … for the office of every Evangelist was to water where the apostles before had planted, and to build where they had laid the foundation of the true doctrine of Jesus Christ the Savior.</p></blockquote>

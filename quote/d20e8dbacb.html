<blockquote><p>After indicating that the Genevans, of course, wish and hope for the gospel to be spread everywhere, the letter states: “But we know well also what is within our compass, and we do not presume even to wish to reform extensive kingdoms.”… What is fascinating here is the apparent renouncing, on the part of the Genevans, of any connection to the evangelical movement within France or anywhere else. They would seem to wish for the king to believe that Geneva stays resolutely and quietly within its own geographical border and does not meddle in the work of reforming other parts of Europe, let alone France. In all of this, Geneva kept up a near-constant state of deception in regards to the French king and his government… Geneva was extremely effective at feigning obedience to French kings.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 99</span></figcaption>

</figure><figure class="quote" id="q-92245bfd04" data-kw="">
<blockquote><p>III. With these words [Col. 1:12-13], our eternal salvation is ascribed to the heavenly Father with due thanksgiving…

IV. Now, following the footsteps of the Apostle, we will first discuss thanksgiving, and then its arguments. Thanksgiving to God is the worship of God when we give Him proper praise for His benefits.

V. This thanksgiving is rendered to God in three ways: in thought, in words, and in deeds.

VI. In thought, when we truly acknowledge that whatever good we are and have, we owe it all to God the Father, through and on account of Christ, by the efficacy of the Holy Spirit, according to the gracious will and eternal benevolence of the Father, Son, and Holy Spirit towards us. Furthermore, we have perpetual gratitude in our hearts towards God.

VII. This thanksgiving, which pertains to thought, holds the first place in order and dignity, without which the other expressions of gratitude are not pleasing and acceptable to God.

VIII. In words, when we privately or publicly commemorate the benefits of God, from which they have come forth, through preaching His goodness.

IX. In deeds, when, to testify our gratitude to God, we offer ourselves and our material and spiritual possessions to Him, willingly devoting them for His glory and the use of the saints.

X. The arguments for thanksgiving are derived both from the cause that impels God to bestow benefits upon us and from the benefits themselves as effects of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians</cite>, (on Col. 1:12-13) $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601)</span></figcaption>

<blockquote><p>1. Whether all rites which adhere in the exercise of religion or in divine worship, whether public or private, are sacred? It is denied.

2. Whether ceremonies or rites in public worship are to be multiplied, to excite greater devotion, attention or reverence in men? It is denied.

3. Whether some ceremonies, which are called indifferent, are to be imposed on unwilling churches and ministers, indeed, under the penalty of a most grave censure, even deposition? It is denied.

4. Whether ceremonies are rightly distinguished into divine and human? It is affirmed.

5. Whether divine things are necessary for observation, at least by a necessity of divine precept? It is affirmed. For remaining questions on ceremonies, see Ecclesiastical Politics, bk. 2, tract 2.</p></blockquote>

<blockquote><p>I. The sin of Adam doth pass to his posterity by two means, by imputation, &amp; propagation.

II. The punishments which all men suffer in the name of Adam, do argue that the sin of Adam is imputed to us: This the Apostle teacheth, Rom. 5.12. Death passed on all men, by one man, in whom all men sinned, or because all men sinned in him: For the sin of Adam was not only personal, neither did he sin as a singular person, but as carrying all mankind in the stock and original; no otherwise, than Christ satisfying for us on the Cross, hath not suffered as a private person, but as sustaining and representing the whole Church in the head. Saint Paul, 2 Cor. 5.15 speaketh thus: If one died for all, all likewise were dead. And Rom. 6, doth affirm that we are dead and crucified with Christ.

If therefore we died in Christ dying, and were crucified with him, it is no doubt but that it may likewise be said, that we sinned in Adam: For if the satisfaction and righteousness of the second Adam be imputed to us, why shall not the sin of Adam be imputed to us, why shall not the sin of the first Adam be imputed to us; seeing that therefore the righteousness of Christ is imputed to us, that the sin of Adam might not be imputed to us?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 9.1-2, pp 50-51.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

<blockquote><p>I tell you the truth, he who believes has everlasting life. John 6:47 One could preach a hundred thousand years about these words and emphasize them again and again. Yes, one can’t speak enough about these words. Here Christ explicitly promises eternal life to the believer. He doesn’t say that if we believe in him we will have eternal life. Rather, he says that as soon as we believe in him, we already have eternal life. He is speaking, not of future gifts, but of present ones. He is saying, “If you believe in me, you are saved. You already have eternal life.” This passage is the cornerstone of our justification. With it, we can settle the disputes we’re having about how we receive God’s approval. Good works don’t lead us to heaven or help us in the sight of God. Only faith can do this. Of course, we should do good works and live holy lives in obedience to God. But these efforts won’t help us earn salvation. We already have eternal life. If we don’t receive it while here on earth, we’ll never receive it after we leave. Eternal life must be attained and received in this body. Yet how do we acquire eternal life? God becomes our teacher, for he tells us about eternal life through those who preach his Word. He convinces us that we should accept his Word and believe in him. That is how it begins. Those same words that we hear and believe will lead us to none other than the person of Christ, born of the Virgin Mary. God will take us nowhere else. If we believe in Christ and cling to him, we are redeemed from both physical and spiritual death. We already have eternal life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Faith Alone: A Daily Devotional</cite>, 192.</span></figcaption>

<blockquote><p>170 Q. You are not saying, then, that good works are useless? A. They do not serve to make us right with God, either wholly or in part, but they do serve this purpose: after we have been freely and graciously justified through the imputation of Christ’s righteousness, we show with good works that we are thankful to God the Lord, so that God might be praised through us. That is the reason we were originally created and then redeemed, as Zachariah teaches in Luke 1 [:74, 75]: “That we, being delivered from the hand of our enemies, might serve him without fear, in holiness and righteousness that is pleasing to him all the days of our life.” Good works are also useful because by them as the fruit of faith it is confirmed that we have not a hypocritical but a true faith. Third, they are useful because by the example of our good works we win others to Christ and keep those already won from falling away. The longer they are kept close to Christ, the more they are built up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Firm Foundation</cite>, (Carlisle UK; Grand Rapids: Baker Books, 1995), 116–17.</span></figcaption>

<blockquote><p>First, the word [justificare] does imply an accounting just: And this is acknowledged by the Papists themselves as more frequent though they plead much for such a sense as to make just. Now the truth is there needs not much quarrel even about that signification, though the Scripture does not manifest it: For we confess that he is made just, who is justified, and that not only in respect of the inward renovation of a man, but also in respect of justification; for God does not account him just who is not so, and certainly to esteem a man just without righteousness, is as absurd as to account a man learned without learning, or the wall white without whiteness; only we say this righteousness that does to make a man just, is not inherent in him, but reckoned to him by the satisfaction of another: for a man is accounted righteous two ways, either when he is not guilty of the crime charged upon him, or when he does make satisfaction; and in this latter sense by Christ we become righteous. 2. So that if the word should signify as much as to make righteous, as to sanctify does signify to make holy, still we could grant it, though not in the Popish way; and indeed the apostle, Rom. 5, says many are made righteous by the second Adam, which if not meant of inherent holiness, does imply that the righteousness we have by Christ is not merely declarative, but also constitutive; and indeed one is in order before the other, for a man must be righteous before he can be pronounced or declared so to be. But the Hebrew word does not signify this sense primarily; for whereas the Hebrew word in [the tense] qal does signify to be righteous by a positive quality; The word in hiphil, according to that rule in grammar, signifies to attribute and account this righteousness unto a man by some words, or other testimony, even as the word that in qal signifies to be wicked, does in hiphil signify to condemn and judge a man as wicked, so that there are these two things in justifying, whereof one is the ground of the other, first to make righteous, and then to pronounce or declare so. From these two follows a third, which is to deal with a man so justified as a just man, so that condemnation, crimes, reproach and fear shall be taken away from him. This declares the admirable benefit of being justified before God, for when this is done, Rom. 5:1, we have peace with God, Eph. 3, we come with boldness into his presence, and open face; so that unbelief and slavish fears in the godly are great enemies to this grace of justification; yea, they are a reproach and dishonor to it. Thou thinkest if thy heart were not conscious to sin, if nothing but holiness were in thee, thou wouldest be bold, thou wouldst not fear or be troubled, but thou dost not consider that God walks towards thee as a righteous man, looks upon thee as so, so that if Christ be bold thou mayst, if God will not reject Christ, or thy sins cannot condemn Him, so neither will God reject thee, or shall thy sins overwhelm thee; this is the sweet consolation of the Gospel, to a sinner broken-hearted, who would give a world for a perfect righteousness to make him accepted.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures</cite>, ... (London: Miller, 1651), Lecture 1, pp. 6-8</span></figcaption>

— Anthony Burgess, The True Doctrine of Justification Asserted &amp; Vindicated, from the Errours of Papists, Arminians, Socinians &amp; more especially Antinomians in 30 Lectures, ... (London: Miller, 1651), Lecture 1, pp. 6-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C+the+word+%5Bjustificare%5D+does+imply+an+accounting+just%3A+And+this+is+acknowledged+by+the+Papists+themselves+as+more+frequent+though+they+plead+much+for+such+a+sense+as+to+make+just.+Now+the+truth+is+there+needs+not+much+quarrel+even+about+that+signification%2C+though+the+Scripture+does+not+manifest+it%3A+For+we+confess+that+he+is+made+just%2C+who+is+justified%2C+and+that+not+only+in+respect+of+the+inward+renovation+of+a+man%2C+but+also+in+respect+of+justification%3B+for+God+does+not+account+him+just+who+is+not+so%2C+and+certainly+to+esteem+a+man+just+without+righteousness%2C+is+as+absurd+as+to+account+a+man+learned+without+learning%2C+or+the+wall+white+without+whiteness%3B+only+we+say+this+righteousness+that+does+to+make+a+man+just%2C+is+not+inherent+in+him%2C+but+reckoned+to+him+by+the+satisfaction+of+another%3A+for+a+man+is+accounted+righteous+two+ways%2C+either+when+he+is+not+guilty+of+the+crime+charged+upon+him%2C+or+when+he+does+make+satisfaction%3B+and+in+this+latter+sense+by+Christ+we+become+righteous.+2.+So+that+if+the+word+should+signify+as+much+as+to+make+righteous%2C+as+to+sanctify+does+signify+to+make+holy%2C+still+we+could+grant+it%2C+though+not+in+the+Popish+way%3B+and+indeed+the+apostle%2C+Rom.+5%2C+says+many+are+made+righteous+by+the+second+Adam%2C+which+if+not+meant+of+inherent+holiness%2C+does+imply+that+the+righteousness+we+have+by+Christ+is+not+merely+declarative%2C+but+also+constitutive%3B+and+indeed+one+is+in+order+before+the+other%2C+for+a+man+must+be+righteous+before+he+can+be+pronounced+or+declared+so+to+be.+But+the+Hebrew+word+does+not+signify+this+sense+primarily%3B+for+whereas+the+Hebrew+word+in+%5Bthe+tense%5D+qal+does+signify+to+be+righteous+by+a+positive+quality%3B+The+word+in+hiphil%2C+according+to+that+rule+in+grammar%2C+signifies+to+attribute+and+account+this+righteousness+unto+a+man+by+some+words%2C+or+other+testimony%2C+even+as+the+word+that+in+qal+signifies+to+be+wicked%2C+does+in+hiphil+signify+to+condemn+and+judge+a+man+as+wicked%2C+so+that+there+are+these+two+things+in+justifying%2C+whereof+one+is+the+ground+of+the+other%2C+first+to+make+righteous%2C+and+then+to+pronounce+or+declare+so.+From+these+two+follows+a+third%2C+which+is+to+deal+with+a+man+so+justified+as+a+just+man%2C+so+that+condemnation%2C+crimes%2C+reproach+and+fear+shall+be+taken+away+from+him.+This+declares+the+admirable+benefit+of+being+justified+before+God%2C+for+when+this+is+done%2C+Rom.+5%3A1%2C+we+have+peace+with+God%2C+Eph.+3%2C+we+come+with+boldness+into+his+presence%2C+and+open+face%3B+so+that+unbelief+and+slavish+fears+in+the+godly+are+great+enemies+to+this+grace+of+justification%3B+yea%2C+they+are+a+reproach+and+dishonor+to+it.+Thou+thinkest+if+thy+heart+were+not+conscious+to+sin%2C+if+nothing+but+holiness+were+in+thee%2C+thou+wouldest+be+bold%2C+thou+wouldst+not+fear+or+be+troubled%2C+but+thou+dost+not+consider+that+God+walks+towards+thee+as+a+righteous+man%2C+looks+upon+thee+as+so%2C+so+that+if+Christ+be+bold+thou+mayst%2C+if+God+will+not+reject+Christ%2C+or+thy+sins+cannot+condemn+Him%2C+so+neither+will+God+reject+thee%2C+or+shall+thy+sins+overwhelm+thee%3B+this+is+the+sweet+consolation+of+the+Gospel%2C+to+a+sinner+broken-hearted%2C+who+would+give+a+world+for+a+perfect+righteousness+to+make+him+accepted.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+The+True+Doctrine+of+Justification+Asserted+%26+Vindicated%2C+from+the+Errours+of+Papists%2C+Arminians%2C+Socinians+%26+more+especially+Antinomians+in+30+Lectures%2C+...+%28London%3A+Miller%2C+1651%29%2C+Lecture+1%2C+pp.+6-8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b63c82837.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a <blockquote><p>Despair, which is a manifest dissent, not so much in respect of the thing, or object, (for this is assented unto as true in respect of it self, viz. That God is merciful, and Christ did die for sinners) but in respect of the person or subject, wherein the soul gives up it self as lost, as without the compass and hopefulness of the divine proclamation:

It is persuaded that there is no possibility for it to recover the shore, and therefore sinks in the depths: My meaning is, That such a soul, though it sees that in God, and that in Christ which can save, and doth save others, yet cuts off it self as not at all capable of any interest in the mercy of God, or blood of Christ, and so eternally falls under its own weight, as is evident in Judas and Cain.

Now despair, so far as it makes assent unto Truths, it is opposed unto Infidelity; and so far as it dissents from special goodness in them, it is opposed to Faith; and so far as it concludes impossibility of that good unto it self, it is opposed to Hope.</p></blockquote>

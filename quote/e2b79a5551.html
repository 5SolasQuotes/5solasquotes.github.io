<main class="wrap"><figure class="quote" id="q-e2b79a5551" data-kw="">
<blockquote><p>In former times those who accepted the divine preaching and who were baptized for their salvation were given visible signs of the grace of the Holy Spirit at work in them. Some spoke in tongues which they did not know and which nobody had taught them, while others performed miracles or prophesied. These Corinthians also did these things, but they did not use the gifts as they should have done. They were more interested in showing off than in using them for the edification of the church… Even in our time grace is given to those who are deemed worthy of holy baptism, but it may not take the same form as it did in those days.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b57b819614" data-kw="">
<blockquote><p>The Catalogue of the Errors, Heresies, Blasphemies, is as follows: … 144. That there are revelations and visions in these times, yea to some they are more ordinary, and shall be to the people of God, generally within a while. 145. That the gift of miracles is not ceased in these times, but that some of the sectaries have wrought miracles, and miracles have accompanied them in their baptism, etc. and the people of God shall have power of miracles shortly. 146. That anointing the sick with oil by the Elders praying over them, with laying on of hands [James 5], is a Church-ordinance for Church-members that are sick, for their recovery. 147. ‘Tis ordinary for Christians now in these days, with Paul to be rapt up to the third Heavens, and to hear words unutterable, and they cannot well have assurance of being Christians, that have not found and had experience of this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna, or, A Catalogue &amp; Discovery of Many of the Errors, Heresies, Blasphemies &amp; Pernicious Practices of the Sectaries of this Time… (London, 1646)</cite>, pp. 15, 28</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

f%20this" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e1c9e29009" data-kw="">
<blockquote><p>2. Yet is it not altogether to be denied but that the Lord may in particulars of the last kind sometimes reveal himself to some by foretelling events before they come, such as the famine that Agabus foretold of, or Pauls imprisonment, were: of such the story of the martyrs and saints do sometimes make mention;</p></blockquote>

</figure><figure class="quote" id="q-4519123cd8" data-kw="">
<blockquote><p>4. ‘By this the justified man lives and abides’ (as Towne says) ‘forever, by faith, in the sight of God.’ But what haste? The Resurrection is not past yet, except Antinomians with Familists follow Hymeneus and Phyletus: [1.] Nor are the justified yet glorified; they abide not ever under God’s eye sinless and as clean as Christ (as Eaton blasphemes to his everlasting shame), for the Jebusite (says Towne) remains in the land, the law of the members and sinful corruption of the flesh dwells in them. 2. They must say daily, ‘Forgive us our sins,’ if God be their Father, else they need not pray daily, ‘hallowed be thy name, thy kingdom come,’ etc. 3. The flesh of sin dwells with the Spirit, Rom. 7, while they live. 4. Death is not an imaginary lie and fancy, so as faith must believe the contradicent [contrary], that is, that believers’ breath goes not out, they return not to their dust, [rather] they are to believe, sure, believers see corruption, Acts 13:36; 2:27-29; 1 Cor. 15:42-44. Then Antinomians cannot say true[ly] that there is no more sin in believers, nor anything having the nature and being of sin, than is in Christ. 5. They are not yet enjoying God in a vision of glory, as Christ did, even in the days of his flesh, for He was both ‘viator’ [wayfarer] and ‘comprehensor’ [attainer], a traveller to the crown and an enjoyer of the crown, and therefore though justified, they must walk here below, and cannot choose but sin, though they be ‘not forced’ to sin (as Towne says).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist... (London, 1648) | pt. 2 | ch. 58, ‘Antinomians teach, believers must not walk in their conversation as in the sight of God, but must live by faith with God’</cite>, p. 103</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-dc91030cbf" data-kw="">
<blockquote><p>We do not profess to teach anything new. We consider the teaching of the Westminster Confession of Faith and other standards of the Reformed Churches to be absolutely true and sufficient, as they set forth the gracious operations of the Holy Spirit in redemption. We do hope, however, to set up and maintain the traditional view as taught in them, by treating the subject from a different point of view, and in refutation of heresies that were not prominently before the minds of those who formulated these standards. … Our aim is to ascertain and classify all the works of the Holy Spirit in all ages and dispensations, and to differentiate them one from the other by accurate definition; and also to determine, from the Scriptures, which have been permanent and universal and will be till the end of time, and which were limited and temporary. So far as we know, this ground has not been traversed, nor indeed has its importance been appreciated. Having accomplished this, as we hope and believe, we then bring the more popular claims of Modern Mysticism to the test of ascertained principles, and then consider their special pleas based on the Scriptures. … The thoughtful reader may perhaps find it profitable to read ‘Summary I’ at the close before reading the discussion.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

<main class="wrap"><figure class="quote" id="q-19abe66ad7" data-kw="">
<blockquote><p>1. Because this is faith; and the Scripture says we are justified by faith. 2. We receive Christ by faith, Jn. 1:12. (3) We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them. 4. We are to believe without staggering, Rom. 4:19. (5) We have peace of conscience through faith, Rom. 5:1. (6) By faith we have access into this grace wherein wee stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but no where does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace, or pardon, but this they ascribe to faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London: 1647) | pt. 3, p. 272</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“1. Because this is faith; and the Scripture says we are justified by faith. 2. We receive Christ by faith, Jn. 1:12. (3) We receive and embrace the promise by faith, Heb. 11:11, and were persuaded of them. 4. We are to believe without staggering, Rom. 4:19. (5) We have peace of conscience through faith, Rom. 5:1. (6) By faith we have access into this grace wherein wee stand, Rom. 5:2. And boldness to enter into the holy of holiest, and draw near to our High Priest, with full assurance of faith, Heb. 10:19-22. Now we are not justified by repentance and mortification; we neither receive Christ, nor embrace the promises by repentance. The apostle requires in repentance, sorrow, carefulness to eschew sin, clearing, indignation, fear, zeal, desire, revenge, 2 Cor. 7:10-11, but no where does the Scripture require this as an ingredient of repentance, that we have boldness and access, and full assurance: nor do Antinomians admit that by repentance we have peace, or pardon, but this they ascribe to faith.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8e78e51003" data-kw="">
<blockquote><p>…in my judgment the usual solution of this appearing difficulty… in the discourse of St. James, ch. 2, v. 14 to the end, has not been in the least impeached, nor has had any new difficulty put upon it in some late discourses to that purpose… …It is taken for granted on all hands that there is no real repugnancy or contradiction between what is delivered by these two apostles… …It is taken also for granted on all other occasions that when there is an appearance of repugnancy or contradiction in any places of Scripture, if some or any of them do treat directly, designedly and largely about the matter concerning which there is a seeming repugnancy or contradiction, and others, or any other speak of the same things only obiter, occasionally, transiently, in order unto other ends, the truth is to be learned, stated and fixed from the former places… According unto this rule, it is unquestionable that the doctrine of justification before God is to be learned from the writings of the apostle Paul, and from them is light to be taken into all other places of Scripture where it is occasionally mentioned… For it must be acknowledged that he wrote of this subject of our justification before God on purpose to declare it for its own sake, and its use in the Church, and that he does it fully, largely and frequently in a constant harmony of expressions… As unto what is delivered by the apostle James, so far as our justification is included therein, things are quite otherwise. He does not undertake to declare the doctrine of our justification before God, but having another design in hand as we shall see…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 20, ‘The Doctrine of the Apostle James concerning Faith &amp; Works, its Agreement with that of St. Paul’ in The Doctrine of Justification by Faith in Works (†1683; Johnstone &amp; Hunter, 1850), 5.384-400, pp. 384-86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-9af05ed455" data-kw="">

</figure><figure class="quote" id="q-5b54395096" data-kw="">
<blockquote><p>Let them, if they will, expect eternal life for their good works; only let us on the authority of Paul hope for it from the grace of God. … Let the saying of Paul then stand fast — that “the inheritance is not of the law but of faith, that the promise according to grace may be sure to every one that believeth.” (Romans 4:14.)</p></blockquote>

</figure><figure class="quote" id="q-94faf9202e" data-kw="">
<blockquote><p>Justification by faith is an answer to the greatest personal question ever asked by a human soul: “How shall I be right with God? How do I stand in God’s sight? With what favor does he look upon me?” There are those, I admit, who never raise that question. There are those who are concerned with the question of their standing before men but never with the question of their standing before God. There are those who are interested in what “people say” but not in the question of what God says. Such men, however, are not those who move the world. They are apt to go with the current. They are apt to do as others do. They are not the heroes who change the destinies of the race. The beginning of true nobility comes when a man ceases to be interested in the judgment of men and becomes interested in the judgment of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-gresham-machen.html">J. Gresham Machen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God Transcendent</cite></span></figcaption>

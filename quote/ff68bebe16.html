<main class="wrap"><figure class="quote" id="q-ff68bebe16" data-kw="">
<blockquote><p>This is a highly original study of demon possession and the ritual of exorcism, both of which were rife in early modern times, and which reached epidemic proportions in France… The rite of exorcism… generated as many problems as it resolved. Possessed women endured frequently violent exorcisms, exorcists were suspected of conjuring devils, and possession itself came to be seen as a form of holiness, elevating several women to the status of living saints.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sarah-ferber.html">Sarah Ferber</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Demonic Possession &amp; Exorcism In Early Modern France</cite>, (Routledge, 2004)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/angels-and-demons/evil-angels.html">Evil Angels</a></span></div>

<blockquote><p>3. The ceremonies are proven to be superstitious by this reason: If there were no more, they have no necessary nor profitable use in the Church (as has been proved), which kind of things cannot be used without superstition. It was according to this rule, that the Waldenses and Albingenses taught that the exorcisms, breathings, crossings, salt, spittle, unction, chrism, etc. used by the Church of Rome in baptism, being neither necessary nor requisite in the administration of the same, did occasion error and superstition rather than edification to salvation. (History of the Waldenses, pt. 3, bk. 1, ch. 6)</p></blockquote>

<blockquote><p>Sixthly, escaping of worldly pollutions is not always an argument of a renewed nature, because sin may drive out sin, even as divines say about popish exorcisms, when the priest calls out devils from men possessed, it is by collusion: the devil recedes not because those exorcismes are of divine efficacy, but because hereby he would confirm people more in believing a lie.</p></blockquote>

</figure><figure class="quote" id="q-9941fe4cd2" data-kw="">
<blockquote><p>…though such has been the dotage, and is at this day of superstitious ones, that they think to charm the devil with their carnal exorcisms; hence the Romish reliques, cross, holy water, yea, and among the Jews themselves in corrupter times, who thought by their phylacteries and circumcision to scare away the devil, which made some of them expound that, Cant. 3:8, of circumcision, ‘Every man hath his sword on his thigh, because of fear in the night.’ By sword on the thigh, they expound circumcision, which they will vainly have given as a charm against evil spirits that affright them in the night. But alas, the devil cares for none of these, no, not for an ordinance of God, when by fleshly confidence we make it a spell: he has been often bound with these fetters and chaines (as is said of him in the Gospel) and the chains have been plucked asunder by him, neither could any man thus tame him. He esteems, as Job says of the Leviathan, iron as straw, and brass as rotten wood. It must be a stronger than the strong man must bind him, and none stronger but God the Father of spirits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gurnall.html">William Gurnall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian in Complete Armor</cite>, … (London, 1655), ch. 4, section 1, pp. 197-98</span></figcaption>

k">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-41c2b84fa0" data-kw="">
<blockquote><p>Is Baptism to be administered without exorcism, or conjuring out of the Devil, or blowing? To exorcise is to adjure a man by holy things, as by God, or by Christ, to do a thing, which men commonly call ‘to conjure’, as the 26th of Mathew, the high-priest says unto Christ, “I conjure thee by the living God, to tell us if thou be Christ.” And the sons of Sceva in the 19th of Acts conjured the devil by Jesus, whom Paul preached: Hence come exorcists and true exorcism: which gift was peculiar to the Holy Ghost, by which the apostles at the first, and other faithful, drave devils out of the possessed, as we read in the Acts, and Christ says, they shall cast out devils, Mark 16; but yet without baptism as Tertullian observes: Therefore it is not to be retained: First, because when Christ instituted baptism, He did not command any to exorcise; Secondly, for that the devil is driven out by Christ even in baptism, for as Cyprian says, like as scorpions and serpents, which are of force on dry land, can do no hurt, being flung into the water, so an evil spirit can inhabit no longer in whom the Spirit of God begins to dwell after baptism and sanctification. Thirdly, for that the apostles administered it without exorcism. Fourthly, neither those that are possessed, or the heathen worshippers of devils are to be baptized, but only they who are holy and partakers of the Covenant of Grace and the members of Christ, and to say that such are subject to the devils’ destroying power were very absurd. Fifthly, that gift of exorcising joined with the gift of miracles was but for a time, as that also was when many sick people were healed by the anointing of the ministers of the Church, and by invocation of the name of Christ (James 5:14), till such time as Christian religion was spread over all the world. Sixthly, for that exorcism was never used at the circumcising of infants. But whereas the heathen did bring testimony unto the Church, before their baptizing (as Tertullian witnesses) that they renounced the devil and his angels, this was a public testimony of repentance in them of years, as also that blowing, with clapped hands, which he that was to be baptized performed, did give the Church thereby to understand that he renounced Satan and his kingdom. But in the Papacy it is done by the baptizer, even [in] the face of infant to be baptized, and is therefore frivolous and to be rejected.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion Framed out of God’s Word, &amp; the Writings of the Best Divines</cite>, … (London, 1606), ch. 47, ‘Of Baptism’, pp. 729-30</span></figcaption>

+by+invocation+of+the+name+of+Christ+%28James+5%3A14%29%2C+till+such+time+as+Christian+religion+was+spread+over+all+the+world.+Sixthly%2C+for+that+exorcism+was+never+used+at+the+circumcising+of+infants.+But+whereas+the+heathen+did+bring+testimony+unto+the+Church%2C+before+their+baptizing+%28as+Tertullian+witnesses%29+that+they+renounced+the+devil+and+his+angels%2C+this+was+a+public+testimony+of+repentance+in+them+of+years%2C+as+also+that+blowing%2C+with+clapped+hands%2C+which+he+that+was+to+be+baptized+performed%2C+did+give+the+Church+thereby+to+understand+that+he+renounced+Satan+and+his+kingdom.+But+in+the+Papacy+it+is+done+by+the+baptizer%2C+even+%5Bin%5D+the+face+of+infant+to+be+baptized%2C+and+is+therefore+frivolous+and+to+be+rejected.%E2%80%9D%0A%0A%E2%80%94+William+Bucanus%2C+Institutions+of+Christian+Religion%E2%80%A6+%28London%2C+1606%29%2C+ch.+47%2C+%E2%80%98Of+Baptism%E2%80%99%2C+pp.+729-30&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41c2b84fa0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/41c2b84fa0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-exorcism/#:~:text=Is%20Baptism%20to%20be%20administered%20without,therefore%20frivolous%20and%20to%20be%20rejected&amp;text=Is%20Baptism%20to%20be%20administered%20without%20exorcism%2C%20or&amp;text=and%20is%20therefore%20frivolous%20and%20to%20be%20rejected" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

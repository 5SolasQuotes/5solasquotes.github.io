<main class="wrap"><figure class="quote" id="q-849e97bf3b" data-kw="">
<blockquote><p>Jephtha Williams was gathered to his people August 19th, 1851, in the 77th year of his age.

This exemplary Christian acceded to the Reformed Presbyterian Church, with his wife, thirty-two years ago, in the Congregation of Coldenham. It was then under the care of the Rev. Mr. Willson. They were both greatly respected members of Goodwill Presbyterian Congregation, in full communion. In that church they had been both held as slaves, in Long Island, and had bought their own freedom for $.500. Jephtha, among his Presbyterian brethren, heard it said that Covenanters were a very bad people, “turners of the world upside down.” Curiosity led, him to hear the Rev. James Milligan, then pastor of the Coldenham Congregation. The preaching pleased him greatly, as evangelical and edifying. He expected, during the interval of public worship, to find out, by the talk of the people, their evil designs as traitors to the commonwealth. The Presbyterians then held slaves. [It is not clear why this sentence is here – DR] He was, however, disappointed, as the conversation of the Covenanters was on religious topics altogether, such as the worship of the forenoon. Of that he approved, of course, and could not but contrast it with the talk of his Goodwill brethren on politics, harvests, butter, cows, calves, dollars, and cents. But his mind had been so prejudiced by the slanders of many, that he thought it all hypocrisy; still, he began to think that possibly Covenanters might be Christians. He came often to hear the word preached, sought acquaintance with the members, and read the terms of communion. He requested the pastor of the Coldenham Congregation to point out to him the alterations that the Presbyterian General Assembly had made in the Westminster Confession of Faith, and give him the history of the National Covenant of Scotland, and of the Solemn League and Covenant. He asked whether coloured members would be buried in our grave-yard, — “for,” he said, “we are not permitted to bury our dead in Goodwill burying-ground.” It seems almost incredible that any who profess to be the disciples of the meek and lowly Jesus, would carry the cruelties of slavery down to “the house appointed for all living.” But they do; yes, even those who call themselves orthodox Presbyterians! After much searching of heart, consultation with his intelligent and very exemplary wife, and prayer, he and she applied to session, gave great satisfaction when examined, and were enrolled among Christ’s witnesses.

For thirty-two years he and his household “have adorned the doctrine of God our Saviour.” His conversation, prayer, and example, have been blessed of God to bring into the church more than sixty souls of his coloured brethren, and thirteen families, nine of which are in his own family. No ne of all these in Orange county have ever been subjected to church censure. For thirty-two years, we have good reason for believing, that family worship, night and morning, was never omitted in his household.

He died in the full assurance of faith – on his death-bed “speaking peace to all his seed.” Is slavery better than the lot of these disciples of Christ? A large funeral testified the respect in which he was held by his brethren and neighbours.

J. R. W.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/covenanter.html">Covenanter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Covenanter</cite>, Nov. 1851, p. 128</span></figcaption>

<blockquote><p>On the 12 August 1873, the Scottish and Irish Synods of the Original Seceders renewed the covenants in Belfast. As part of the work of covenant renovation, the Revd Thomas Hobart of Carluke preached on Jeremiah 50:5, “Come let us join ourselves to the Lord in a perpetual covenant that shall not be forgotten.” Applying this text to the peculiar circumstances of a covenant-breaking nation such as the United Kingdom, he reminded his hearers that Britain must repay her debt to the Lord; a debt which she has incurred by setting aside its sacred bonds:

That national covenants which are permanent in their matter are permanent also in their obligation. Covenants that are entered into for the attainment of a particular object, are said to be temporary in their matter, and cease to exist when they object contemplated is gained. Covenants in which men engage to love and serve the Lord, are said to be permanent in their matter, and so must be permanent in their obligation. Such in their matter, are the covenants entered into, at Sinai, at the time specified in our text, and during the two reforming periods in our native land. From the obligation under which they were brought by these deeds, to love and serve the Lord, to take His Spirit as their guide, and His word as their rule of life, the covenanters can never be released. But man covenants in both his individual and in his corporate capacity. His individual obligation ceases with his individual existence. His corporate obligation can cease only with his corporate existence. Now corporate society is viewed alike by God and by man as if it were one individual from the beginning to the end of its corporate existence. The debt, for instance, contracted by the corporate individual at one period of his existence is reckoned as the debt for which he is justly liable at every subsequent period until it is discharged. On this principle, Britain, as a corporate society, is held liable for the debt it as a nation contracted generations ago. On this principle God declares that nations that have been enabled to enter into covenant with Him, are under a special obligation to live for him as long as the national existence is maintained.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hobart.html">Thomas Hobart</a></span><span class="wk"><span class="lbl">Work:</span> <cite>National covenanting a national privilege: a sermon, preached in the Rev. J. Chancellor’s church, Belfast</cite>, (Perth, 1874), pp 16-17.</span></figcaption>

— Thomas Hobart, National covenanting a national privilege: a sermon, preached in the Rev. J. Chancellor’s church, Belfast, (Perth, 1874), pp 16-17.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9COn+the+12+August+1873%2C+the+Scottish+and+Irish+Synods+of+the+Original+Seceders+renewed+the+covenants+in+Belfast.+As+part+of+the+work+of+covenant+renovation%2C+the+Revd+Thomas+Hobart+of+Carluke+preached+on+Jeremiah+50%3A5%2C+%E2%80%9CCome+let+us+join+ourselves+to+the+Lord+in+a+perpetual+covenant+that+shall+not+be+forgotten.%E2%80%9D+Applying+this+text+to+the+peculiar+circumstances+of+a+covenant-breaking+nation+such+as+the+United+Kingdom%2C+he+reminded+his+hearers+that+Britain+must+repay+her+debt+to+the+Lord%3B+a+debt+which+she+has+incurred+by+setting+aside+its+sacred+bonds%3A%0A%0AThat+national+covenants+which+are+permanent+in+their+matter+are+permanent+also+in+their+obligation.+Covenants+that+are+entered+into+for+the+attainment+of+a+particular+object%2C+are+said+to+be+temporary+in+their+matter%2C+and+cease+to+exist+when+they+object+contemplated+is+gained.+Covenants+in+which+men+engage+to+love+and+serve+the+Lord%2C+are+said+to+be+permanent+in+their+matter%2C+and+so+must+be+permanent+in+their+obligation.+Such+in+their+matter%2C+are+the+covenants+entered+into%2C+at+Sinai%2C+at+the+time+specified+in+our+text%2C+and+during+the+two+reforming+periods+in+our+native+land.+From+the+obligation+under+which+they+were+brought+by+these+deeds%2C+to+love+and+serve+the+Lord%2C+to+take+His+Spirit+as+their+guide%2C+and+His+word+as+their+rule+of+life%2C+the+covenanters+can+never+be+released.+But+man+covenants+in+both+his+individual+and+in+his+corporate+capacity.+His+individual+obligation+ceases+with+his+individual+existence.+His+corporate+obligation+can+cease+only+with+his+corporate+existence.+Now+corporate+society+is+viewed+alike+by+God+and+by+man+as+if+it+were+one+individual+from+the+beginning+to+the+end+of+its+corporate+existence.+The+debt%2C+for+instance%2C+contracted+by+the+corporate+individual+at+one+period+of+his+existence+is+reckoned+as+the+debt+for+which+he+is+justly+liable+at+every+subsequent+period+until+it+is+discharged.+On+this+principle%2C+Britain%2C+as+a+corporate+society%2C+is+held+liable+for+the+debt+it+as+a+nation+contracted+generations+ago.+On+this+principle+God+declares+that+nations+that+have+been+enabled+to+enter+into+covenant+with+Him%2C+are+under+a+special+obligation+to+live+for+him+as+long+as+the+national+existence+is+maintained.%E2%80%9D%0A%0A%E2%80%94+Thomas+Hobart%2C+National+covenanting+a+national+privilege%3A+a+sermon%2C+preached+in+the+Rev.+J.+Chancellor%E2%80%99s+church%2C+Belfast%2C+%28Perth%2C+1874%29%2C+pp+16-17.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb9ab195d12.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b9ab195d12.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2011/10/08/thomas-hobart-on-britains-national-debt-to-god/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

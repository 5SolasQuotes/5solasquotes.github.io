</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b4af681b72" data-kw="Author of sin">
<blockquote><p>The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, bk. 3, ch. 8 (Of the Sin and Fall of Our First Parents)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The influences of divine providence concur with every action, be it what it may, as an action, since all live, and move, and have their being in God; every action, as an action, is from God; but the obliquity, irregularity, and sinfulness of the action, is from the creature: wherefore God is not the author of any sin.”

</figure><figure class="quote" id="q-1f18105752" data-kw="">
<blockquote><p>Desertion in sin is when, God withdrawing the assistance of his spirit, a man is left to fall into some actual and grievius sin. And for all this no man is to think that God is the author of sin, but only man that falls, and Satan. A resemblance of this truth we may see in a staff: which, if a man shall take and set upright upon the ground, so long as he holds it with his hand, it stands upright; but so soon as he withdraws his hand, though he never push it down, it falls of itself. In this desertion was the good king Hezekiah… God left him (namely, to the pride of his heart to exalt himself) in tempting him, that he might try out all that was in his heart. To this place appertain[s] Noah’s drunkenness, David’s adultery, Peter[‘s] denial of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chain... (Cambridge, 1600), A Declaration of Certain Spiritual Desertions…</cite>, p. 682</span></figcaption>

</figure><figure class="quote" id="q-f36de3147a" data-kw="Author of sin Satan">
<blockquote><p>Yet we deny that He is the author of sin, or that the blame of things done amiss can be laid upon Him, seeing His will is the sovereign and infallible rule of all righteousness and equity: but this we confess that He has those admirable means as whereby He makes the devils and the ungodly, as His instruments to serve Him and to turn the evil which they do and whereof they are guilty into good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed-churches.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The French Confession</cite>, 1559, Art. 8</span></figcaption>

</figure><figure class="quote" id="q-c93619138f" data-kw="Hardening Justice Satan">
<blockquote><p>As for those wicked and ungodly men whom God, as a righteous judge, for former sins, doth blind and harden; from them He not only withholdeth his grace, whereby they might have been enlightened in their understandings, and wrought upon in their hearts; but sometimes also withdraweth the gifts which they had, and exposeth them to such objects as their corruption makes occasions of sin; and withal, gives them over to their own lusts, the temptations of the world, and the power of Satan.</p></blockquote>

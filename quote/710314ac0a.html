<main class="wrap"><figure class="quote" id="q-710314ac0a" data-kw="">
<blockquote><p>Together with these external means, serving for drawing on the covenant and going on in it, the common operations of God do concur; common to all the called, both elect and reprobate, and gifts common to both, are bestowed, such as illumination, moral persuasion, historical, dogmatic and temporary faith, moral change of affections, and some sort of external amendment of their outward conversation, saving grace being the special gift of God to His own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/therapeutica-sacra.html">Therapeutica Sacra</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 1, Chapter 6</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1468d42deb" data-kw="">
<blockquote><p>The infinite goodness of God bestows more mercies upon us in the method of prevention, than of answer to particular prayers. We enjoy most things before we ask, and often more excellent in kind and more abundant in measure than we ask… He makes his sun to rise every morning upon the unjust, and his moon to fill her orb with light upon the ungodly crescent [Muslims]. His paths in the clouds drops fatness upon the fields of bloody tyrants, and His ocean is open, and sweet western gales often swell the sails of rambling and roving pirates. The earth is full of his goodness. He spread and filled the tables of Heliogabalus with His hidden treasures. There is no inhabitant but is laden with his benefits, however abused to their luxury, pride, and wantonness. His mercies are over all his works; He makes the out-goings of the morning and evening to sing. He preserves the goings out and the comings in of all the children of Adam.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-lee.html">Samuel Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eliothriambos: Or the Triumph of Mercy in the Chariot of Praise (London: John Hancock, 1677), 1, 2, 11 as quoted in Day by Day with the English Puritans: Selected Readings for Daily Reflection, ed. Randall J. Pederson (Hendrickson, 2004)</cite>, p. 202</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“The infinite goodness of God bestows more mercies upon us in the method of prevention, than of answer to particular prayers. We enjoy most things before we ask, and often more excellent in kind and more abundant in measure than we ask… He makes his sun to rise every morning upon the unjust, and his moon to fill her orb with light upon the ungodly crescent [Muslims]. His paths in the clouds drops fatness upon the fields of bloody tyrants, and His ocean is open, and sweet western gales often swell the sails of rambling and roving pirates. The earth is full of his goodness. He spread and filled the tables of Heliogabalus with His hidden treasures. There is no inhabitant but is laden with his benefits, however abused to their luxury, pride, and wantonness. His mercies are over all his works; He makes the out-goings of the morning and evening to sing. He preserves the goings out and the comings in of all the children of Adam.”

0all%20the%20children%20of%20Adam." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-29331cf633" data-kw="">
<blockquote><p>Now this general call and operation of the Holy Spirit has these degrees following: viz. First, an understanding of the Word, for the mere natural man cannot understand it, Mt. 16:23 &amp; 1 Cor. 2:14. Here observe two things, to wit, First, there are many in the places of the Gospel who hear the Word preached all the days of their lives and yet understand nothing, but remain children in understanding; now these never were made partakers so much as of common or general grace:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canterbury’s Doom, or the first part of a complete history of the commitment, charge, trial, condemnation, execution of William Laud... (London: Macock, 1646), 73. ‘Passages razed out concerning our effectual vocation’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-e2adefc78e" data-kw="">
<blockquote><p>That there is a divine influence of the Spirit granted to all men, is plain both from Scripture and from experience… To the general influence of the Spirit (or to common grace) we owe: 1. All the decorum, order, refinement, and virtue existing among men… 2. To the same divine agent is due specially that general fear of God, and the religious feeling which prevail among men…, 3. The Scriptures refer to this general influence of the Spirit those religious experiences, varied in character and degree, which so often occur where genuine conversion, or regeneration does not attend or follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology (Eerdmans, 1997), vol. 2</cite>, pp. 654-75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<main class="wrap"><figure class="quote" id="q-78b2c4fb71" data-kw="">
<blockquote><p>The Cardinal is continually urging this proposition, that there is no salvation out of the Church; And that he has not God for his Father that has not the Church for his mother. It imports then to know in what sense, and how far that proposition is true. I say then, that if by the word ‘Church’, you understand the Church or Assembly of the elect, or predestinated unto salvation, it is clear and questionless that out of the Church so understood there is no salvation: For whosoever is none of the elect, is of necessity a reprobate. If by the ‘Church’, you understand some particular Church, as the Greek, the Roman, the English, it is certain that out of such a Church a man may be saved. For example, if the Roman Church were as pure in the faith as it is corrupt, yet a faithful man could be saved in any other particular Church of the like purity. But if by the ‘Church’, one understands the whole body of those that profess themselves to be Christians, or the whole body of the orthodox Churches united in communion; it is certain that out of the communion of the Church taken in that sense a man may be saved. For if one were unjustly excommunicated from that Church, and should die during that excommunication, he should not be therefore excluded from salvation. For God is not subject to men’s vices, nor obliged to comply with the unjust passions of pastors handling the keys unrighteously, or abusing them ignorantly. Such a man having the Church for his step-mother, shall nevertheless have God for his Father. It may also happen that a pagan or a Jew being prisoner, or living in a country where there is no Christians, will come by reading, or conference, or inspiration from God, to acknowledge the truth of Christian religion, and make a resolution to profess it at the next opportunity, and as soon as he shall have his freedom: if death prevent such a man before he can openly join with the communion of the Church, I make no doubt but that he may be saved, believing in Jesus Christ, though he never did aggregate himself to the communion of the Church. For our Savior’s words can never be false, ‘Whosoever believeth in Jesus Christ, hath eternal life,’ Jn. 6. The thief crucified with Jesus, and converted when he was near death, was a pagan before, or of no religion; we cannot tell that ever he was a member of the visible Church, yet he was saved. In this sense then that proposition may be true, That out of the visible Church there is no salvation. Who so by profaneness or error in the foundation of the faith does separate himself from the communion of the universal visible Church, and renounces the communion of the faithful, to live according to his fancy, and to be no more a member of the Church, that man cannot be saved. Of such men the apostle Jude speaks, verses 18-19, where he calls those mockers and sensual men that separate themselves; And the apostle to the Hebrews, ch. 10, v. 25, forbids us to forsake the assembling of ourselves together. In this sense Cyprian in his book of the Unity of the Church, says, ‘He hath not God for his Father, that has not the Church for his Mother.’ For he speaks of schismatics, who out of pride despise the communion of the orthodox Church, and are authors of disension and division in the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Novelty of Popery, Opposed to the Antiquity of True Christianity</cite>, … (London: White, 1662), ch. 7, How this Proposition must be understood: That out of the Church there is no Salvation, p. 13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-820cf352cf" data-kw="">
<blockquote><p>What now will you say to these things, that your Church is not the catholic Church, but a part of it only; and is only catholic, because of the catholic doctrine that she professes? But if this be true, wherefore then did your general council condemn it in John Hus, and burn him for that doctrine, which both yourself must confess to be true, and is agreeable to Scripture, Fathers, and your own Popes? …yet for all this, not only call ye [Romanists] your Church Catholic, because of the soundness of doctrine which ye suppose she professes, but also and specially to make the simple believe that there is no salvation out of her… Therefore ye call it the only true Church, and the Catholic Church: for out of the particular Church there is salvation, but out of the catholic Church there is no salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-welch.html">John Welch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Popery Anatomized</cite>, ... (d. 1622; Glasgow: Sanders, 1672), Section 2, ‘Whether the Church of Rome is the Catholic Church?’, p. 9</span></figcaption>

<blockquote><p>3. We must know that there is no salvation out of this Church; such as never become members of it, must eternally perish: they that are true members, shall be saved. If they had been of us, they would haue continued with us: but they went out from us, that it might be manifest they were not of us. Without are dogs and scorners, etc. All out of the ark perished in the waters. ‘The Lord added to the Church daily such as should bee saved.’ First, because there is no means of salvation out of it; no word to teach, no sacraments to confirm. And especially because out of the Church there is no Christ, and out of Christ no salvation. Who have not the Church their mother, cannot have God their Father… ‘The general assembly’ [Heb. 12:23]: this is the property of the Church; ‘General’. It is catholic in three respects; of Time, of Persons, of Place:

1. Of Time, because the Church had a being in all ages, ever since the promise was given to our first parents in Paradise…

2. Of persons; for it consists of all degrees and sorts of men… There is no order nor state excluded, if they exclude not themselves…

3. Of Place, it is gathered from all parts of the earth; especially under the New Testament… When Christ gave his apostles their commission, He gave also the whole world for their parish… Thus we see the property of this Church, catholic or general. It is one, but not tied to one time, nor one place, nor one person: it is catholic to all times, to all places, to all persons…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-adams.html">Thomas Adams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Happiness of the Church</cite>, … together with certain other Meditations… (London: Grismand, 1619), ‘The Happiness of the Church’, ‘To the General Assembly…’, pp. 56-58</span></figcaption>

</figure><figure class="quote" id="q-cdb3944bc9" data-kw="">
<blockquote><p>Secondly, There is no salvation out of the Church, but there may be salvation out of the visible Church. As multitudes that are in the visible Church are not saved, so some out of it may be saved. I speak not this to encourage any to neglect being of the visible Church… Is not the greatest company in any visible Church either such open profane, or careless Christians, or downright hypocrites? Are there not ten, an hundred of such for one that truly fears God? Well, when we speak of the Holy Catholic Church, can we only think of that which is visible, as to an outward profession, in which millions perish and go to Hell forever? No, we are to think of the Church invisible; the number known to God of his faithful ones.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6dcdc5f68a" data-kw="">
<blockquote><p>The anti-protestant principles of Dr. Schaff, as it appears to us, are either included in his theory of development, or are its legitimate consequences. That theory he and Dr. Nevin for a time held in common. But it contains antagonistic principles. When carried out, the one must eliminate the other. And the precise difference between Dr. Nevin and Dr. Schaff, as we conceive, is that the former has given himself up to that element of the system which necessitates a return to Rome; while Dr. Schaff has remained true to that feature of theory, which enables him to look on Rome as a station long since past, in the onward progress of the Church, to which she can no more return than a man can become a boy. In order, however, to understand this subject, it will be necessary to ascertain what is meant by “development of the Church.” In Dr. Schaff’s exhibition of his doctrine there is much that is true, much that is common presented in new form, and much that is new, anti-scriptural, and anti-protestant. The plausibility of theory arises, in a great degree, from this large admixture of what every one is ready to admit, with subtle principles which spoil and pervert the whole. There is a form of the doctrine of development, or of the constant advance of the Church, which we presume all Protestants admit. Their view on this subject we understand to be substantially as follows:

1. Christianity is a system of doctrines supernaturally revealed and now recorded in the Bible. Of that system there can be no development. No new doctrines can be added to those contained in the word of God. No doctrine can ever be unfolded or expanded beyond what is there revealed. The whole revelation is there, and is there as distinctly, as fully, and as clearly as it can ever be made, without a new supernataral revelation. Every question, therefore, as to what is, or what is not Christian doctrine, is simply a question as to what the Bible teaches. There is no analogy, consequently, between theology and other sciences. The materials of theology do not admit of increase. They are all in the Bible. The materials of human science are constantly accumulating, as new facts are brought to light and old assumptions corrected. Theology, therefore, as it existed in the mind of Paul, and is recorded in his writings, is precisely what will be theology of the last saint who is to live on the earth. Whereas the astronomy of Pythagoras is as different from that of La Place, as the men are widely separated in time.

2. While Christianity, considered as a system of doctrine, is thus complete and unchangeable, the knowledge of that system as it lies in the mind of the individual Christian, or in the Church collectively, is susceptible of progress, and does in fact advance. Every believer, when he first receives the truth, receives it partially, and necessarily mingles it with the previous contents of his mind, which to a greater or less degree perverts and corrupts it. As he grows in grace, he grows in knowledge. The more the Spirit of God leads him into conformity with the truth, the more correct do his apprehensions become, the more is the dross of error removed, and the more fully does he coincide in all his conceptions of divine things with the infallible standard of the word of God. With this increase of knowledge there is connected a corresponding increase of holiness, and of power to influence those around him for good. This is matter of daily experience and observation, and is in accordance with everything taught in the Bible, on the progress of the life of God in the soul. This progress is neither uniform nor constant. In some days, or even hours, the Christian may grow more than in years of ordinary experience. Sometimes his course is backward; he loses ground in knowledge, in faith, in love, in zeal and obedience. From these backslidings he is recalled only by the power of the Holy Ghost. This restoration is commonly effected only through a deeper conviction of sin, and a clearer apprehension and more cordial reception of the truth than he had before experienced. He becomes thus a better man and a more advanced Christian than he was before. It was thus with Peter; and it is thus that the Christian is led from strength to strength until he appears before God. No part of a believer’s life is isolated. As the present is conditioned more or less by the past, so in its turn it conditions the future.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Review of History of the Apostolic Church; with a General Introduction to Church History by Philip Schaff,” in The Book Reviews of Charles Hodge</cite>, (Bellingham, WA: Logos Bible Software, 2014).</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-42a48afdd7" data-kw="">
<blockquote><p>Much of recent American Reformed theology has been caught up for some time in a distorted form of biblicism that has fallen into the trap of trying to reinvent the theological wheel in areas where doing so is fraught with danger—in particular, the doctrine of the divine attributes and the doctrine of the Trinity. More often than should be the case, important aspects of these essential doctrines of the Christian faith have been seriously misunderstood and then, on the basis of such misunderstanding, rejected or revised, with disastrous consequences. One way in which these misunderstandings could have been avoided would have been to grapple with the way these doctrines were defined and defended by the greatest theologians of the past, theologians such as Augustine, Gregory of Nazianzus, and yes, even Thomas Aquinas.</p></blockquote>

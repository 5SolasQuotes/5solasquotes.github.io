<blockquote><p>So much of the respect which we do owe our Neighbours. Is it not required also, that we should show mercifulness unto our beasts?

Yes. A righteous man is to regard the life of his beast. Pro. 12. 10. And all hard usage of the creatures of God is forbidden, (Deut. 22. 6, 7. and 25. 4.) yet not so much in regard of them, (1 Cor. 9. 9, 10) as that the Lord would train us forward to show mercy to our Neighbour. For it being unlawful to use the dumb creatures cruelly; it is much more unlawful to use men so.</p></blockquote>

<blockquote><p>In the Law or priesthood of Aaron there were:

1. Sacraments, whereby it pleased God to confirm and seal the promises of Christ to come, all which I know are abolished and that we must believe that Christ is already given, not to be given: And seeing other seals of God’s promises are under the Gospel given by our Lord Himself, namely, bread and wine, we ought not to recall the antiquated signs.

2. Howbeit, there were some actions in the law of that nature that properly they may not be said to be sacraments: For they made to decency, to order and some benefit, which I do judge may be recalled and retained as agreeable to the light of nature, and furthering some profit to ourselves… no man is ignorant that tithes are enjoined in innumerable places for the maintenance of ministers: besides, if I might more diligently search and consider, as the time now will not permit me, I could find out not a few things which our Church has borrowed out of the law of Moses, and that from the first beginning of the Church…</p></blockquote>

<blockquote><p>XVI. OF THE PARTS OF GODS LAW.

1 There are in holy scripture found 3. parts of Gods law. That is to say, Moral, Ceremonial, and Judicial.

2 The moral law, whose sum is contained in the ten commandments, is a doctrine agreeing with the eternal and immutable wisdom and rule of justice in God, discerning good and evil, naturally known, and bread in reasonable creatures, in the creation, &amp; many times after repeated and declared by the mouth of God, teaching us that there is a God, and what manner of God he is, binding all reasonable creatures to perfect obedience &amp; conformity external &amp; internal to that rule, promising the favour of God and life eternal to all that perform perfect obedience, and denouncing the anger of God &amp; eternal punishment, to all that are not perfectly conformable thereunto, unless there be granted remission of sins &amp; reconciliation through the son of God our mediator.

3 The law of nature before the fall was altogether the same with the moral law of God: but the knowledge of God being after the fall obscured in man’s mind, the law of nature is now become only a part of the decalogue or ten commandments, being obscure and maimed especially in the knowledge and worship of God, for which cause also God repeated and declared again in his church the whole body of his law.

4 Ceremonial laws are certain precepts of ceremonies, that is, of actions, and external solemn gestures, or such as must be performed in the publique service of God, with observation of the self-same circumstances, ordained either to signify future things, or for order’s sake.

5 Judicial laws concern the external defence of discipline, according to both tables of the decalogue, or concerning civil government amongst the Jews, that is, touching the order &amp; duties of magistrates; judgments, punishments, contracts, and differences of being Lord or owner of ought.

6 This distinction of divine laws, must be observed, both because of the difference of these laws, which being neglected their right force and meaning cannot well be understood, &amp; also that we may well judge and instruct others in the abrogation and use of the law.

7 These are the differences between the law moral, and ceremonial and judicial laws. First, moral commandments or precepts are naturally known: ceremonial and judicial are not.

8 Secondly, moral laws bind all reasonable creatures, ceremonial and judicial were only prescribed to the Jews.

9 Thirdly, moral laws are ever in force, ceremonial and judicial are not.

10 Fourthly, moral laws command external &amp; internal obedience, ceremonial and judicial command only obedience external, which notwithstanding must be joined with internal moral obedience.

11 Fiftly, moral laws are general, not limited with certain circumstances, ceremonial and judicial are special, that is, determined by certain circumstances.

12 Sixtly, ceremonial and judicial laws are types foreshewing some thing; moral laws are not types but signified by types.

13 Seventhly, moral laws are a principal worship of God, or the end of other laws; ceremonial and judicial owe service to the moral, that by them these may the better be observed.

14 Eighthly, laws ceremonial yield to the moral; but moral laws yield not to the ceremonial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A collection of certain learned discourses, written by that famous man of memory Zachary Ursine; doctor and professor of divinity in the noble and flourishing schools of Neustad. For explication of divers difficult points, laid down by that author in his catechism. Lately put in print in Latin by th</cite>, (Oxford: Joseph Barnes, 1600), pp 257-59.</span></figcaption>

<blockquote><p>I must by the way tell you that I find not sackcloth therein commanded as a solemn significant ceremony; I say commanded as a solemn ceremony, for that you find it not only mentioned as the ordinary concomitant of more grievous mournings, nay by the prophets even literally commanded, as also baldness, sitting in the dust, howling and wallowing in ashes, the better to express that serious mourning, whereunto the Lord did call, is plainly obvious, and can only infer that therefore and after this manner it is the more capable to be still contained.</p></blockquote>

<blockquote><p>The unction and fragrance of the Spirit with which the Psalms are replete lead me to notice, before leaving this portion of our survey, that it is an utter misconception to represent the Old Testament religion as more fed by mundane hopes, than by the influence of the Holy Spirit.

It is to pervert the plainest evidence to affirm, as Cocceius and his school affirmed, that there was neither sonship nor the spirit of adoption in the Old Testament Church. That was to ignore the Abrahamic Covenant, and Christ’s divine presence with His Church, and merely to fix all attention upon the intermediate and transitory Sinai Covenant. But the Psalms to which we are adverting, when considered as the actual expression of praise for the Israelitish Church, as well as a legacy handed down to us in the Christian Church, sufficiently refute that view.

No book of a similar kind was prepared for the New Testament Church. The Holy Spirit, replenishing the sweet singers of Israel with spiritual truth and holy love, anticipated in this way much of the necessity that should be felt in Christian times. I am not here discussing the debated point as to the use of psalms in public worship.

My object is to show the spirituality of the Israelitish Church as evinced by its inspired and invaluable psalms. They describe the eternity and omnipresence, the majesty and condescension, the justice and mercy of God in a strain of the most fervid devotion. They sing of repentance and faith, of joy in God and delight in God’s law, with an ardour beyond which it is impossible to go. They depict Christ’s royal reign and His union with His Church; the anointing with the oil of gladness (Ps. 45.7); the receiving of gifts for men (Ps. 68.18); and the supreme dominion with which Christ was to be invested by the Father with a tenderness, unction, and joy, to which no other words are equal And those psalms which are called “new songs” anticipate the full millennial glory.

To reason back from effect to cause, the power and presence of the Spirit in ample fulness must have been graciously conferred to produce these psalms, and to use them fitly when prepared. We trace the power of God’s Spirit in turning the captivity of Israel, and in filling them with penitence. Not only so: the apostle, when adducing the quotation from the Psalms, “I believed, therefore have I spoken,” prefixes “We having the same spirit of faith — we also believe and therefore speak” (2 Cor 4.13; Ps. 116.10). The language of the apostle affirms the same faith and the possession of the same Spirit.

From this fact, and from the whole series of quotations made from them, it is evident that the experience of the Church was the same in both economies, though complexional varieties attached to each. But these varieties, as Calvin well remarks, describe the Church more in its corporate character than in the experience of the individual members. The true Church in the Old Testament, whatever might be the character of the nominal adherents, cannot be said to be unspiritual when we trace a faith and a knowledge of God, a fidelity and courage, an endurance and self-denial in all that great cloud of witnesses that fill us with astonishment, and leave us conscious that we are practically far behind.</p></blockquote>

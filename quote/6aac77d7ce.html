<blockquote><p>Q. 6. Who caused the Holy Scripture to be written?

A. God (2 Tim. 3:16), through prophets, gospel writers, and apostles, who, through the inspiration of the Holy Spirit, could not err in their writing (Ex. 17:4; Rev. 1:19; 2 Peter 1:21; John 16:13).

Q. 7. In which languages is Holy Scripture written?

A. The Old Testament in Hebrew and a little in Chaldean, and the New Testament in Greek.

Q. 8. Is the Holy Scripture a divine book?

A. All of Scripture is, in terms of all words and matters, a divine book (2 Tim. 3:16), and it therefore has divine authority that obliges us to the most conscientious submission and obedience (Isa. 8:20; Ps. 12:7).

Q. 9. How is the divinity of Holy Scripture shown?

A. (1) From its holy and exalted content, (2) from the piety of its authors (2 Peter 1:21), (3) from its mysteries; (4) from the fulfilment of prophecies; (5) from its powerful effect on the hearts of the unconverted (Jer. 23:29) and the converted (Ps. 119:92); and (6) from the miracles through which it is confirmed.

Q. 10. How is a Christian convinced of the divinity and authority of Holy Scripture?

A. (1) Through the inner illumination and conviction of the Holy Spirit (Ps. 119:18; 2 Cor. 4:13; 1 John 5:6); (2) through its divine marks (2 Peter 1:19; Luke 16:29); and (3) by means of the witness of the church, on which, however, the authority of Holy Scripture does not only or even fundamentally depend (Eph. 2:20).

Q. 11. Is Holy Scripture infallible?

A. Scripture is infallible in its essence and in its parts (1 Cor. 4:6; 2 Tim. 3:14; Ps. 19:8), so that nothing is in error or lost (Matt. 5:18), and we therefore do not need human traditions (Matt. 15:6–9).</p></blockquote>

<blockquote><p>But, although these things were in principle present in Mary’s heart, she did not at that moment perceive the pledge of hope contained in them. Her grief was too profound to leave room for introspection. It even hid from her vision the objective evidence of the resurrection that lay around her. Worse than this, she turned what was intended to help her into an additional reason for unbelief. But who of us shall blame her? Have not we ourselves under as favorable circumstances made the mistake of nourishing our unbelief on what was meant to be food for our faith? Do we not all remember occasions when we stood outside the grave of our hopes weeping, and did not perceive the hand stretched out to prepare us by the very thing we interpreted as sorrow for a higher joy? From Mary’s experience let us learn to do better. What the Lord expects from us at such seasons is not to abandon ourselves to unreasoning sorrow, but trustingly to look sorrow in the face, to scan its features, to search for the help and hope, which, as surely as God is our Father, must be there. In such trials there can be no comfort for us so long as we stand outside weeping. If only we will take the courage to fix our gaze deliberately upon the stern countenance of grief, and enter unafraid into the darkest recesses of our trouble, we shall find the terror gone, because the Lord has been there before us, and, coming out again, has left the place transfigured, making out of it by the grace of his resurrection a house of life, the very gate of heaven. This was just what happened to Mary. Not forever could she stand weeping, forgetful of what went on around her. “As she wept she looked into the tomb, and she beholdeth two angels in white sitting one at the head and one at the feet, where the body of Jesus had lain.” It was a step in the right direction that she roused herself from her inaction. Still, what strikes us as most characteristic in this statement is its implying that even the vision of angels did not sufficiently impress her to raise the question, to what the appearance of these celestial messengers might be due. Probably this was the first time she had come in direct contact with the supernatural in that particular form. The place was doubtless charged with the atmosphere of mystery and wonder angels bring with themselves when entering into our world of sense. And yet no tremor seems to have run through her, no feeling of awe to have made her draw back. A greater blindness to fact is here than that which made her miss the sign of the empty grave. What more convincing evidence of the truth of the resurrection could have been offered than the presence of these two angels, silently, reverently, majestically sitting where the body of Jesus had lain? Placed like the Cherubim on the mercy-seat, they covered between themselves the spot where the Lord had reposed, and flooded it with celestial glory. It needed no voice of theirs to proclaim that here death had been swallowed up in victory. Ever since the angels descended into this tomb the symbolism of burial has been radically changed. From this moment onward every last resting-place where the bodies of believers are laid is a furrow in that great harvest field of Christ whence heaven draws upward into light each seed sunk into it, whence Christ himself was raised, the first fruits of them that sleep. Let us not overlook, however, that Mary’s disregard of the angels revealed in a most striking form something good also, to-wit: her intense preoccupation with the one thought of finding the Lord. For Him she had been looking into the tomb. He not being there, it was empty to her view, though filled with angelic glory. She would have turned aside without speaking, had not the angels of their own accord spoken to her: “Woman, why weepest thou?” These words were meant as an expression of sympathy quite natural in beings wont to rejoice over repenting sinners. But in this question there is at the same time a note of wonder at the fact that she should be weeping at all. To the mind of the angels the resurrection was so real, so self-evident, that they could scarcely understand how to her it could be otherwise. They felt, as it were, the discord between the songs of joy with which their own world was jubilant, and this sound of weeping coming out of a world of darkness and despair. “Woman, why weepest thou?” Tears would be called for indeed, hadst thou found Him in the tomb, but not at a time like this, when heaven and earth unite in announcing: He is risen in glory, the King of life! Mary’s answer to the angels shows that neither their sympathy nor their wonder had succeeded in piercing her sorrow. “She saith unto them, Because they have taken away my Lord, and I know not where they have laid Him.” These are almost the identical words in which she had informed Peter and John of her discovery of the empty tomb. Still a slight change appears. To the Apostles she had said “the Lord” and “we know not.” To the angels it is: “my Lord” and “I know not.” In this is revealed once more her intense sense of proprietorship in Jesus. In that sense the angels could not have appropriated Him for themselves. They might hail Him as their matchless King, but to Mary He was even more than this, her Lord, her Savior, the One who had sought and saved and owned her in her sins.</p></blockquote>

rned+aside+without+speaking%2C+had+not+the+angels+of+their+own+accord+spoken+to+her%3A+%E2%80%9CWoman%2C+why+weepest+thou%3F%E2%80%9D+These+words+were+meant+as+an+expression+of+sympathy+quite+natural+in+beings+wont+to+rejoice+over+repenting+sinners.+But+in+this+question+there+is+at+the+same+time+a+note+of+wonder+at+the+fact+that+she+should+be+weeping+at+all.+To+the+mind+of+the+angels+the+resurrection+was+so+real%2C+so+self-evident%2C+that+they+could+scarcely+understand+how+to+her+it+could+be+otherwise.+They+felt%2C+as+it+were%2C+the+discord+between+the+songs+of+joy+with+which+their+own+world+was+jubilant%2C+and+this+sound+of+weeping+coming+out+of+a+world+of+darkness+and+despair.+%E2%80%9CWoman%2C+why+weepest+thou%3F%E2%80%9D+Tears+would+be+called+for+indeed%2C+hadst+thou+found+Him+in+the+tomb%2C+but+not+at+a+time+like+this%2C+when+heaven+and+earth+unite+in+announcing%3A+He+is+risen+in+glory%2C+the+King+of+life%21+Mary%E2%80%99s+answer+to+the+angels+shows+that+neither+their+sympathy+nor+their+wonder+had+succeeded+in+piercing+her+sorrow.+%E2%80%9CShe+saith+unto+them%2C+Because+they+have+taken+away+my+Lord%2C+and+I+know+not+where+they+have+laid+Him.%E2%80%9D+These+are+almost+the+identical+words+in+which+she+had+informed+Peter+and+John+of+her+discovery+of+the+empty+tomb.+Still+a+slight+change+appears.+To+the+Apostles+she+had+said+%E2%80%9Cthe+Lord%E2%80%9D+and+%E2%80%9Cwe+know+not.%E2%80%9D+To+the+angels+it+is%3A+%E2%80%9Cmy+Lord%E2%80%9D+and+%E2%80%9CI+know+not.%E2%80%9D+In+this+is+revealed+once+more+her+intense+sense+of+proprietorship+in+Jesus.+In+that+sense+the+angels+could+not+have+appropriated+Him+for+themselves.+They+might+hail+Him+as+their+matchless+King%2C+but+to+Mary+He+was+even+more+than+this%2C+her+Lord%2C+her+Savior%2C+the+One+who+had+sought+and+saved+and+owned+her+in+her+sins.%E2%80%9D%0A%0A%E2%80%94+Geerhardus+Vos%2C+Grace+and+Glory%2C+%28Grand+Rapids%2C+MI%3A+The+Reformed+Press+1922%29%2C+94%E2%80%9396&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0828f46e77.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0828f46e77.html">Permalink</a><a class="src" href="https://heidelblog.net/2023/04/woman-why-are-you-weeping-part-2/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>‘Yea, but’ (say they) ‘our ceremonies are typical and Jewish ceremonies, which hurt our worship.’ They mean (as I conceive) they are teaching ceremonies, not ceremonies of mere order, but significant, to put us in mind of duty. I am sorry that this should be accounted a fault. If they did not signify, how could they edify? (1 Cor. 14:26) Were they types and shadows of the mysteries of the Gospel invented by men, indeed Christ were ill-advised not to ordain them. But being only moral documents and monitors of some duties, I wonder where their guilt lies. If I had an hundred boxes in my house for my uses, and some few of them had a mark upon them to direct me where my money lay, that I might be careful of that, does this savor of want of natural wisdom? So neither does it taste of want of spiritual wisdom to set a mark upon some few ceremonies, to put me in mind of my duty to Christ. ‘What are these’ (say they) ‘but images set up to ourselves for religious use?’ What? to worship? to adore God in or by? No, but to remind us of what we ought to do. And this was the practice of the Church in all ages: Abraham put his servant’s hand under his thigh in swearing, surely to signify his subjection to him in that business about the promised seed (Gen. 24:2). Moses set up an altar when Amalek was overthrown and called it Jehovah-Nissi, to signify that the Lord was their banner (Ex. 17:15). The two tribes and a half built an altar, not to distinguish their borders, but to signify that they were God’s people and that they had all one God, to whom they and their posterity must sacrifice upon his own altar (Josh. 22:24–35). Samuel set up a stone when the Philistines were discomfited and called it Eben-Ezer, to signify that the Lord helped them (1 Sam. 7:12). When Christ the truth was come, he used human significant ceremonies, as the feast of dedication (John 10:22), sitting at the Passover—a sign of rest (Matt. 26:20)—the water pots of the Jewish purifications (John 2:6), the custom of embalming (John 19:39–40), besides other formalities of the synagogue. (Lk. 4:17-20) The Corinthians had the women’s veil in the congregation, to signify subjection (1 Cor. 11:5–6), and the kiss of peace to signify love (Rom. 16:20; 2 Pet. 2:11). Other Christians had agapae [love-feasts] at the sacrament (Jude), in the room whereof the Christians’ offertory was brought in for pious uses, to signify that love they should have one to another. So we have standing at the Belief [Apostles’ Creed], to signify that it is not a prayer and that we are ready to confess our faith; kneeling at the commandments, to signify the honor we have to that God that gave it, and that we must be ready to dart up prayer for our obedience; and kneeling at the sacrament, to signify an humble acknowledgment of God’s love for so great a benefit. And do we and all these saints before us set up images to ourselves in these ceremonies for religious use? God forbid. The practice of these saints, when the laws of God were purely taught and kept, teaches us that though we may not set up an image to worship God by or in, yet may we set up some edifying signs to put us in mind of those duties we owe to God (1 Cor. 14): The patriarchs may build altars, give their children proper names to be admonishing signs of their duties to God; and we may set all our senses on work that way. We may set up a post in a dark and dangerous passage, that when I go that way and touch it, it may signify my danger, and I may avoid it. I may set a watchman in a tower to give a sound when the enemy comes, that he may signify my enemy’s approach, and I may avoid him. I may set up a sea mark to signify a rock near, that I split not upon it. And may not we be as wise for our souls as for our bodies? God forbid. I am sure He has nowhere forbidden it. Therefore it is not against Christ. If it be not against Him, it is for Him, says our Savior (Mk. 9:40).</p></blockquote>

<blockquote><p>Dr. [Thomas] Jackson [d. 1640] in his Original of Unbelief [1625], pp. 334-35, very aptly to this purpose notes that some expressions may sometime be used, and observed well, which to use ordinarily (much more to institute) would be ridiculous or impious. As Jacob did unblameablely kiss his son Joseph’s coat, yet to have hanged it about his bed or table that it might receive such salutations evening and morning or at every meal time, might have countenanced many branches of superstition: once and use it not, may be discretion of those things whose continual use degenerates into abuse.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Dr. [Thomas] Jackson [d. 1640] in his Original of Unbelief [1625], pp. 334-35, very aptly to this purpose notes that some expressions may sometime be used, and observed well, which to use ordinarily (much more to institute) would be ridiculous or impious. As Jacob did unblameablely kiss his son Joseph’s coat, yet to have hanged it about his bed or table that it might receive such salutations evening and morning or at every meal time, might have countenanced many branches of superstition: once and use it not, may be discretion of those things whose continual use degenerates into abuse.”

— William Ames, A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’, … (Amsterdam: Thorp, 1633), Manuduction, ch. 4, ‘Concerning the nature and definition of a ceremony’, pp. 26-27">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CDr.+%5BThomas%5D+Jackson+%5Bd.+1640%5D+in+his+Original+of+Unbelief+%5B1625%5D%2C+pp.+334-35%2C+very+aptly+to+this+purpose+notes+that+some+expressions+may+sometime+be+used%2C+and+observed+well%2C+which+to+use+ordinarily+%28much+more+to+institute%29+would+be+ridiculous+or+impious.+As+Jacob+did+unblameablely+kiss+his+son+Joseph%E2%80%99s+coat%2C+yet+to+have+hanged+it+about+his+bed+or+table+that+it+might+receive+such+salutations+evening+and+morning+or+at+every+meal+time%2C+might+have+countenanced+many+branches+of+superstition%3A+once+and+use+it+not%2C+may+be+discretion+of+those+things+whose+continual+use+degenerates+into+abuse.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+A+Fresh+Suit+Against+Human+Ceremonies+in+God%E2%80%99s+Worship%2C+%E2%80%98An+Addition+of+the+two+last+reasons+of+the+former+reply%E2%80%99%2C+%E2%80%A6+%28Amsterdam%3A+Thorp%2C+1633%29%2C+Manuduction%2C+ch.+4%2C+%E2%80%98Concerning+the+nature+and+definition+of+a+ceremony%E2%80%99%2C+pp.+26-27&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0a04facbbf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0a04facbbf.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/natural-vs-instituted-worship/#:~:text=Dr.%20%5BThomas%5D%20Jackson%20%5Bd.%201640%5D%20in,whose%20continual%20use%20degenerates%20into%20abuse&amp;text=Dr.%20%5BThomas%5D%20Jackson%20%5Bd.%201640%5D%20in%20his%20Original&amp;text=those%20things%20whose%20continual%20use%20degenerates%20into%20abuse" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

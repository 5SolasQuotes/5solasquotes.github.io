<main class="wrap"><figure class="quote" id="q-3b3bd8ec8c" data-kw="">
<blockquote><p>These covenants differ, in relation to the Parties contracting the covenant of works, the Parties were God, and the first Adam, representing all his natural posterity; but in the covenant of grace, the Parties were God the Father, and Christ the second Adam, representing all his spiritual seed. The first covenant, was made with a mere man, a fallible creature: the second, was established with God-man, “the Lord from heaven, who enangeth not.” The former, depended on a righteous creature: the latter, on a righteous, an almighty Redeemer.

The one, was made with man in his best state, and yet he kept it not: the other, was made with God-man, our blessed Immanuel, who neither could nor would, fail in fulfilling it. In that, the triune God, is to be considered as the supreme Lawgiver, and the fountain of uncreated goodness, delighting in communicating happiness to an upright creature: in this, he is to be viewed as infinitely merciful and gracious, rejoicing to give, in a manner suited to the glory of all his perfections, eternal life to an elect sinner believing in Jesus.

According to the covenant of works, God could deal with man, and man with God, immediately; but according to the covenant of grace, he cannot deal with man, nor man with him, but through a Mediator. With the blessed Mediator it was, that he dealt primarily, and immediately; and with man, only in and through Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), pp 536-37.</span></figcaption>

</figure><figure class="quote" id="q-94621b57e0" data-kw="">
<blockquote><p>Now also, God’s kindness is that he would want to summon the creature, who by default has been subordinated to him and owes him everything by natural obligation, to special communion with him by entering into a covenant, and would want to temper his completely absolute rule with that self-indulgence of love and mutual obligation.

The result was that the man, who had been made with a fixed means to the supreme blessedness, was firmly able to expect that blessedness, not only because of God’s sheer goodness and natural love for the creatures, in each manner promised to him, but certainly also because of the covenant, and thus on account of God’s truthfulness and faithfulness. Now also, this agreement of the covenant impels reward and certain great and abundant gift, which the man would have been able to hold out to God because of God’s law that he knew by nature.</p></blockquote>

</figure><figure class="quote" id="q-ef5dce598c" data-kw="">
<blockquote><p>At present there is gneral agreement that the doctrine of the covenants is a peculiarly Reformed doctrine. It emerged in Reformed theology where it was assured of a permanent place and in a way that has also remained confined within these bounds. It is true that towards the end fo the seventeenth century this doctrine was taken over by several Lutheran theologians,¹ but this apparently took place by way of imitation, the doctrine being unknown within the genuine Lutheran framework. ¹ Diestel (Jahrbucher fur Deutsche Theologie, 10, 266) lists those Lutheran theologians who gave a place to the covenant in their system, viz., Calixtus, Wolfgang Jager of Tubingen, Caspar, Exner, Reuter, and others. Cocceius enjoyed a good reputation in Germany, especially as an exegete, even among the Lutherans. The covenant of works was emphasized. This is strange since there is no place for it in a consistent Lutheran system. Federal and natural unity were placed side by side in the covenant of works without subordinating the one to the other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Doctrine of the Covenant in Reformed Theology’ in Redemptive History &amp; Biblical Interpretation</cite>, ed. Richard Gaffin (d. 1949; Presbyterian &amp; Reformed, 1980), p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works/nature-of-the-covenant.html">Nature of the Covenant</a></span></div>

<blockquote><p>3. It is not impossible that one act should be so high and intense in its kind as to induce a habit into the subject, and so Adam’s nature be vitiated by it; and he begot a son in his own likeness. The devils upon one sin became obstinate in all the wickedness that their nature is capable of. (2.) This one act was a breach of covenant with God, upon the tenor and observation whereof depended the enjoyment of all that strength and rectitude with God wherewith, by the law of his creation, man was endued, (3.) All man’s covenant good, for that eternal end to which he was created, depended upon his conformity to God, his subjection to him, and dependence on him; all which, by that one sin, he wilfully cast away for himself and posterity (whose common, natural, and federal head he was), and righteously fell into that condition which we have described. (4.) The apostle is much of a different mind from our catechists, Rom. v. 15, 16, etc., as hath been declared.

4. What is credible concerning God and his goodness with these gentlemen I know not. To me, that is not only in itself credible which lie hath revealed concerning himself, but of necessity to be believed. That he gave man a law, threatening him, and all his posterity in him and with him, with eternal death upon the breach of it; that upon that sin he cast all mankind judicially out of covenant, imputing that sin unto them all unto the guilt of condemnation, seeing it is “his judgment that they who commit sin are worthy of death;” and that ” he is of purer eyes than to behold evil,” — is to us credible, yea, as was said, of necessity to be believed. But they will answer the proofs that are produced from Scripture in the asserting of this original sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 165.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“3. It is not impossible that one act should be so high and intense in its kind as to induce a habit into the subject, and so Adam’s nature be vitiated by it; and he begot a son in his own likeness. The devils upon one sin became obstinate in all the wickedness that their nature is capable of. (2.) This one act was a breach of covenant with God, upon the tenor and observation whereof depended the enjoyment of all that strength and rectitude with God wherewith, by the law of his creation, man was endued, (3.) All man’s covenant good, for that eternal end to which he was created, depended upon his conformity to God, his subjection to him, and dependence on him; all which, by that one sin, he wilfully cast away for himself and posterity (whose common, natural, and federal head he was), and righteously fell into that condition which we have described. (4.) The apostle is much of a different mind from our catechists, Rom. v. 15, 16, etc., as hath been declared.

— John Owen, Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 165.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+It+is+not+impossible+that+one+act+should+be+so+high+and+intense+in+its+kind+as+to+induce+a+habit+into+the+subject%2C+and+so+Adam%E2%80%99s+nature+be+vitiated+by+it%3B+and+he+begot+a+son+in+his+own+likeness.+The+devils+upon+one+sin+became+obstinate+in+all+the+wickedness+that+their+nature+is+capable+of.+%282.%29+This+one+act+was+a+breach+of+covenant+with+God%2C+upon+the+tenor+and+observation+whereof+depended+the+enjoyment+of+all+that+strength+and+rectitude+with+God+wherewith%2C+by+the+law+of+his+creation%2C+man+was+endued%2C+%283.%29+All+man%E2%80%99s+covenant+good%2C+for+that+eternal+end+to+which+he+was+created%2C+depended+upon+his+conformity+to+God%2C+his+subjection+to+him%2C+and+dependence+on+him%3B+all+which%2C+by+that+one+sin%2C+he+wilfully+cast+away+for+himself+and+posterity+%28whose+common%2C+natural%2C+and+federal+head+he+was%29%2C+and+righteously+fell+into+that+condition+which+we+have+described.+%284.%29+The+apostle+is+much+of+a+different+mind+from+our+catechists%2C+Rom.+v.+15%2C+16%2C+etc.%2C+as+hath+been+declared.%0A%0A4.+What+is+credible+concerning+God+and+his+goodness+with+these+gentlemen+I+know+not.+To+me%2C+that+is+not+only+in+itself+credible+which+lie+hath+revealed+concerning+himself%2C+but+of+necessity+to+be+believed.+That+he+gave+man+a+law%2C+threatening+him%2C+and+all+his+posterity+in+him+and+with+him%2C+with+eternal+death+upon+the+breach+of+it%3B+that+upon+that+sin+he+cast+all+mankind+judicially+out+of+covenant%2C+imputing+that+sin+unto+them+all+unto+the+guilt+of+condemnation%2C+seeing+it+is+%E2%80%9Chis+judgment+that+they+who+commit+sin+are+worthy+of+death%3B%E2%80%9D+and+that+%E2%80%9D+he+is+of+purer+eyes+than+to+behold+evil%2C%E2%80%9D+%E2%8

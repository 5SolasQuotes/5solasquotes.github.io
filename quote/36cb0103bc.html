<main class="wrap"><figure class="quote" id="q-36cb0103bc" data-kw="">
<blockquote><p>1. As love stands opposed to hatred and wrath, and enmity. Considering man as God’s creature, he was not hated of God; God hates not the work of his own hand; but considering him as a lapsed creature, as degenerated into the plant of a strange vine, after that God had created him a generous, noble plant… How suitable to us now is it to have a Savior? That is love, and who has loves, considering the aversion in the holy Divine Being from mankind as rebellious seed, a seed of evil-doers? Who could have suited us to have become a Savior unto us, but one who had a kind propension and inclination to us, inclining Him to the great work of man’s redemption and reconciliation to God, especially also considering that there could be no remission of sins without blood…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Intercourses of Divine Love betwixt Christ &amp; his Church</cite>, (London: Snowden, 1683), p. 156</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-buchanan.html">James Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Comfort in Affliction, See all of Meditation</cite>, 4, pp. 62-79:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

— James Buchanan, Comfort in Affliction, See all of Meditation 4, pp. 62-79:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+that+cometh+to+Me%2C+I+will+in+no+wise+cast+out%E2%80%9D%0A%0A%E2%80%94+James+Buchanan%2C+Comfort+in+Affliction%2C+See+all+of+Meditation+4%2C+pp.+62-79%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fe6ff45258e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/e6ff45258e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/historic-reformed-quotes-on-the-sincere-free-offer-of-the-gospel-interpretation-of-john-316/#:~:text=He%20that%20cometh%20to%20Me%2C%20I%20will%20in%20no%20wise%20cast%20out" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1fa2e2b5f2" data-kw="">
<blockquote><p>‘The Lord is well pleased.’… This passage is interpreted in various ways. Some render it, “The Lord has so willed it;” others, “He is merciful;” but, for my own part, I have translated it, “The Lord is willing,” that is, disposed and inclined to deliver his people, and that for the purpose of magnifying his Law and extolling his righteousness. Thus God assigns the reason why He is ready to aid those who are unworthy, that He wishes to spread his glory in their salvation, that in this manner his righteousness may be illustriously displayed, and that his Law may prevail and flourish. As to the heavy calamities that have come on the Jews, the reason is, that of their own accord they have resolved to be blind, and to bring afflictions on themselves, instead of obeying God; for otherwise the Lord would have wished to enrich and exalt them…. Others render it, “For his righteous one,” and refer it to Christ; but they mistake the meaning of the word צדקו, (tzidko) and unquestionably He speaks of righteousness, and means that the Lord would willingly have displayed the magnificence of his promises: and would have given proofs of his righteousness in preserving his people, if they had not shown themselves to be ungrateful and unworthy. Some think that the Lord here offers an excuse for Himself, because, when the people whom He had adopted were exposed to so many evils, it appeared as if his truth were shaken, and that the prophet intended to meet this calumny, for they were seized and became a prey, not because the Lord delights in their miseries, but because He prefers his righteousness to everything else. For my own part, I explain it simply to mean, “The Lord, for the sake of doing honor to his Law, was inclined to do good to his people, in order that his glory and righteousness might shine forth in it; but his people showed themselves to be unworthy of so great a favor; and, therefore, by their own obduracy they made their wounds incurable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Isaiah</cite>, 42, verse 21, “The Lord is well pleased for his righteousness’ sake; he will magnify the law, and make it honourable.”</span></figcaption>

</figure><figure class="quote" id="q-dec1e52d00" data-kw="">
<blockquote><p>No man was ever questioned by God for having too much grace; we may all complain of too little: More grace is the constant desire of every holy soul as there is a propensity in God to give it; ‘To him that has, more shall be given’: God loves to accumulate his favors, to load us with his benefits; he gives liberally that He may draw out our hope to follow Him for more and more still. ‘Let us then abound in hope, holding fast our confidence firm unto the end.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Christian Religion</cite>, ... (London: R.R., 1692), Christ the Hope of Glory, ch. 6, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-2ccc0475a4" data-kw="">
<blockquote><p>…when He has decreed it, He does not presently execute it, but He does denounce it: why? because He is most merciful, slow to wrath, and therefore He does denounce: Isa. 34:7, He is a God that will not punish, but upon necessity; He would willingly be always showing good, and when He is angry, He is compelled and provoked to it; and because He would not willingly punish, therefore He denounces punishment; He speaks often, before He will do it once, that if it might be, He might be prevented by repentance. Lastly, after threatening, He proceeds to execution, not with delight (God delights not in the death of a sinner, He afflicts not willingly), but compassion. As Titus the Emperor, before he sacked the city of Jerusalem, wept over it, pitying them he should destroy it; so does God, when threatnings prevail not, and by them, men are not reclaimed, then He comes to execution… as Savian says of Sodom, that God showed mercy, in that He was long before He did execute; and justice, and wrath, in that He did execute at last.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-stock.html">Richard Stock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Stock of Divine Knowledge, being a lively Description of the Divine Nature, or the Divine Essence, Attributes &amp; Trinity particularly explained and profitably applied</cite>, … (London: T.H., 1641) Stock (c.1568-1626) was an English puritan., ch. 19, Of the Anger of God, pp. 217-18</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<main class="wrap"><figure class="quote" id="q-93252c259f" data-kw="">
<blockquote><p>The whole Book of Psalms hath a peculiar respect unto Jesus Christ, either directly or in the person of David, who was his greatest personal type, next to Aaron and Melchizedeck [sic]; but there are some psalms that are altogether directly prophetical of him and of his offices,—namely, the 2d psalm is prophetical of his kingdom; the 16th psalm, of the work of his mediation and obedience to God therein; the 22d, of his priestly office, his sufferings, death, his resurrection, and intercession; the 40th, of his oblation and suffering; the 72d, of his kingly and prophetical power and glorious regard unto his people; the 68th, of his glorious exaltation; and this 45th psalm is a prophecy and description of his person, and his kingly office, and of the espousals of him and his church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon VI: The Excellency of Christ (1674) in William H. Goold (ed.), The Works of John Owen</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5d1d7cee19" data-kw="">
<blockquote><p>Psalms are song by emperors; the common people rejoice in them. Each man does his utmost in singing what will be a blessing to all. Psalms are sung in the home and rehearsed on the streets. The psalm is learned without labor and remembered with delight. Psalmody unites those who disagree, makes friends of those at odds, and brings together those who are out of charity with one another. Who could retain a grievance against the man whom he had joined in singing before God? The singing of praise is the very bond of unity, when the whole people join a single act of song.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/st-ambrose.html">Ambrose of Milan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition 9</cite>, trans. Erik Routley in The Church and Music (London: Duckworth, 1950), 129.</span></figcaption>

— Gilbert Rule, The Good Old Way Defended, … (Edinburgh: 1697), sect. 10, p. 258">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+falls+next+on+the+doxology%E2%80%A6+We+%5BScottish+presbyterians%5D+do+not+use+it%2C+but+we+never+laid+such+weight+on+using+it+as+to+forbear+all+communion+with+a+congregation+where+it+is+used%3B+I+called+it+a+%E2%80%98human+composure%E2%80%99%E2%80%A6+for+I+think+neither+ancient+nor+modern+divines+will+call+them+schismatics+who+cordially+join+with+the+Church+where+they+live+in+all+of+her+worship%2C+except+this%3B%E2%80%9D%0A%0A%E2%80%94+Gilbert+Rule%2C+The+Good+Old+Way+Defended%2C+%E2%80%A6+%28Edinburgh%3A+1697%29%2C+sect.+10%2C+p.+258&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff31f72356f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f31f72356f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/singing-of-praise#:~:text=He%20falls%20next%20on%20the%20doxology,all%20of%20her%20worship%2C%20except%20this&amp;text=He%20falls%20next%20on%20the%20doxology&amp;text=live%20in%20all%20of%20her%20worship%2C%20except%20this" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-31c43e2a8c" data-kw="">
<blockquote><p>Among Treatises fit to be published and read, Treatises of Devotion are most fit: as being freest from offence, and fullest of divine matter. If comparison may be made betwixt parts of sacred Scripture, the Psalms of David have an excellency in that they consist of matters of Devotion. Answerable to the style of his name, is the style of his book. The style of his name was, A man after GOD’S own heart. For such was his piety and sincerity as GOD was well pleased therewith, and took much delight therein. The rather because his devotion towards GOD incited him to do what GOD required to be done. So the Book of Psalms, may well carry this style, A book after God’s own heart, in that nothing is more acceptable unto GOD, nothing wherein he takes more delight then Devotion.

And no book of sacred Scripture fuller of Devotion then that book. Most of the Psalms wholly consist of Prayers or Praises: very few, if any at all, wherein there are not some divine raptures, and such heavenly ejaculations, as manifest an heart full of Devotion. For Devotion is a pious and humble affection to God-wards. Humble through conscience of a man’s own infirmity. Pious through a due consideration of the divine clemency. Such Devotion is never more fully and to the life manifested then in Prayers and Praises.

For in these divine duties, if rightly performed, the soul presents it self before GOD, and that in a special manner, being after a sort even rapt out of the body. Then, if ever, doth the Soul, so far as it is capable, with an holy admiration apprehend the divine Majesty, Purity, Justice, Wisdom, Power, yea Mercy, Goodness, and other excellencies wherewith GOD is decked. Then, if ever is the soul brought thoroughly to discern its own infirmity, impurity, baseness, vileness and cursedness.

For contraries paralleled, or laid together do most lively set forth each other in their own proper colours. He that liveth in a dark dungeon, will be enamoured with the bright shining of the Sun, when he can have liberty to see it. And he that hath long lived under bright Sun-shine, more thoroughly discerns the horror and damage of darkness. Now GOD and man are in many respects directly opposite each to other: This opposition is best discerned in our most serious contemplations of Gods excellencies and due consideration of our own manifold infirmities, which is most to purpose done in acts and exercises of Devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>To the Reader in Robert Bolton, Certain devout prayers of Mr. Bolton upon solemn occasions</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-5d18bed3b9" data-kw="">
<blockquote><p>The first great thing in this Controversy is, to consider the nature of the Covenant, which is the first foundation of the privilege to believers, and their seed, as it was first made with Abraham and his seed, in the name of all believers, and their seed both Jews and Gentiles; for so large is the extent of that Covenant to both, as hereafter shall be proved from the New Testament expressions; and if we find the same Covenant reaching Gentile-believers, and their Children, as Abraham and his, we cannot be denied the new external sign and seal of the same Covenant; for though the outward signs may be changed, yet there is no change of the privileges, if the Covenant remain entire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/cuthbert-sidenham.html">Cuthbert Sidenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian, Sober &amp; Plain Exercitation on the Two Grand Practical Controversies of These Times; Infant-Baptism and Singing of Psalms</cite>, (London: Robert White, 1654), pp 9-10.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d64f9341df" data-kw="">
<blockquote><p>The word Testament is a Latin word, whereby the Greek word Diatheke is rendered, which the Greek Translators use to express the Hebrew word Berith, that is, Covenant. And thereby is properly understood the Covenant itself, which God hath made with mankind upon certain conditions to give them everlasting life: which Covenant is twofold, the Old and the New.

The Old is that which God made with the first man before the fall, wherein eternal life was promised upon condition of a thoroughly perfect, and keeping of the Law; and is therefore called the Legal Covenant, which God again propounded to the Israelites, that from thence they might learn to understand (seeing this condition is transgressed by all men, and can now be fulfilled by no man) that they must seek their salvation in another Covenant, which is called the New [Covenant,] and consisteth in this: That God hath appointed his Son for a Mediator, and promiseth eternal life upon condition that we believe in him; and is called the Covenant of Grace.

And this also in regard of the several administrations thereof unto mankind is called Old and New. The Old is the administration of the Covenant before the coming of the Mediator, which was promised to Abraham and his posterity [to come] of his seed, and prefigured by manifold Ceremonies laid down by Moses. The New is the administration of the same Covenant, since the Son of God, the Mediator of this Covenant came in the flesh, and hath accomplished man’s reconciliation with God. These two Covenants are of one kind as concerning their substance, forasmuch as in both forgiveness of sins, salvation and eternal life are promised upon condition of faith in the Mediator: but are different in respect of their several administrations, which in the New is much clearer, without figures, and extends itself unto all Nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-haak.html">Theodore Haak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Argument of the New Testament in The Dutch Annotations upon the Whole Bible</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

</figure><figure class="quote" id="q-a0345b0486" data-kw="">
<blockquote><p>When we speak of the “new covenant,” we do not intend the covenant of grace absolutely, as though that were not before in being and efficacy, before the introduction of that which is promised in this place. For it was always the same, as to the substance of it, from the beginning. It passed through the whole dispensation of times before the law, and under the law, of the same nature and efficacy, unalterable, “everlasting, ordered in all things, and sure.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 89</span></figcaption>

</figure><figure class="quote" id="q-bf0de92f98" data-kw="">
<blockquote><p>…and if it be asked, what may be imported by this speech properly? We answer, ‘O that my people had hearkened unto Me, etc.’ [Ps. 81:13] shows these six things: … 4. Fourthly, that God delights not in the death or destruction of his people, but that they should repent and live. … 6. Sixthly, that God requires a suitable meeting of his people to his dispensations, that is, that they may be so willing to hearken to his voice, and so loath to offend Him, as He does manifest by Word and works his willingness to save them and his loathness to destroy them. From the Lord’s lamenting, learn further: … 3. He who hears God uttering his wishes for the conversion of His people and lamenting that His Word is not believed, and that his offer of grace is not received, does give God an evil meeting and neither believes God’s goodness, nor cares for his own salvation, except he join with God lamenting his own misbelief in time past, and do with heartily the same with God for his own conversion for time to come;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London: T.R. &amp; E.M., 1653), on Ps. 81:13, pp. 254-55</span></figcaption>

<blockquote><p>Does the new economy surpass the old, in regard to extent? Thou then who art a believer, and a partaker of the inestimable blessings of the gospel, shouldst be zealous in promoting missions to infidel and Heathen nations. By thy prayers, thy counsel, and thy substance, thou oughtest to exert thyself, for the diffusion of evangelical knowledge among benighted nations; in order that the spiritual kingdom of Christ, may be universally extended.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, (Edinburgh: Ogle, Allardice and Thomson, 1818), p. 390.</span></figcaption>

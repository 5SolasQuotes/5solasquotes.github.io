<blockquote><p>1. God never did, nor ever will, justify and save a wicked Jew that lived and died impenitent, though he was of the seed of Abraham, and a Hebrew of the Hebrews, and had all the honour and advantages that attended circumcision. He does and will render indignation and wrath, tribulation and anguish, upon every soul of man that doeth evil; and of the Jew first, whose privileges and professions, instead of screening him from the judgment of God, will but aggravate his guilt and condemnation. See Rom. 2:3, 8–9, 17. Though God has favoured the Jews, above other nations, with the dignities of visible church-membership, yet He will not therefore accept of any particular persons of that dignity, if they allow themselves in immoralities contradictory to their profession; and particularly in persecution, which was now, more than any other, the national sin of the Jews. 2. He never did, nor ever will, reject or refuse an honest Gentile, who, though he has not the privileges and advantages that the Jews have, yet, like Cornelius, fears God, and worships Him, and works righteousness, that is, is just and charitable towards all men, who lives up to the light he has, both in a sincere devotion and in a regular conversation. Whatever nation he is of, though ever so far remote from kindred to the seed of Abraham, though ever so despicable, nay, though in ever so ill a name, that shall be no prejudice to him. God judges of men by their hearts, not by their country or parentage; and, wherever He finds an upright man, He will be found an upright God, Ps. 18:25. Observe, Fearing God, and working righteousness, must go together; for, as righteousness towards men is a branch of true religion, so religion towards God is a branch of universal righteousness. Godliness and honesty must go together, and neither will excuse for the want of the other. But, where these are predominant, no doubt is to be made of acceptance with God. Not that any man, since the fall, can obtain the favour of God otherwise than through the mediation of Jesus Christ, and by the grace of God in Him; but those that have not the knowledge of Him, and therefore cannot have an explicit regard to Him, may yet receive grace from God for his sake, to fear God and to work righteousness; and wherever God gives grace to do so, as He did to Cornelius, He will, through Christ, accept the work of his own hands. Now: (1) This was always a truth, before Peter perceived it, that God respecteth no man’s person; it was the fixed rule of judgment from the beginning: If thou doest well, shalt thou not be accepted? And, if not well, sin, and the punishment of it, lie at the door, Gen. 4:7. God will not ask in the great day what country men were of, but what they were, what they did, and how they stood affected towards Him and towards their neighbors; and, if men’s personal characters received neither advantage nor disadvantage from the great difference that existed between Jews and Gentiles, much less from any less difference of sentiments and practices that may happen to be among Christians themselves, as those about meats and days, Rom. 14:1-23. It is certain the kingdom of God is not meat and drink, but righteousness, and peace, and joy in the Holy Ghost; and he that in these things serveth Christ is accepted of God, and ought to be approved of men; for dare we reject those whom God doth not? (2) Yet now it was made more clear than it had been; this great truth had been darkened by the covenant of peculiarity made with Israel, and the badges of distinction put upon them; the ceremonial law was a wall of partition between them and other nations; it is true that in it God favoured that nation (Rom. 3:1–2; 9:4), and thence particular persons among them were ready to infer that they were sure of God’s acceptance, though they lived as they listed, and that no Gentile could possibly be accepted of God. God had said a great deal by the prophets to prevent and rectify this mistake, but now at length he does it effectually, by abolishing the covenant of peculiarity, repealing the ceremonial law, and so setting the matter at large, and placing both Jew and Gentile upon the same level before God; and Peter is here made to perceive it, by comparing the vision which he had with that which Cornelius had. Now in Christ Jesus, it is plain, neither circumcision availeth any thing, nor uncircumcision,Gal. 5:6; Col. 3:11.</p></blockquote>

<blockquote><p>7. A calling to the ministry is either such as wants the essentials, as gifts in any messenger, and the Churches’ consent, or these who occupy the room of the Church, the Church consenting, such a minister is to be reputed for no minister. Or. 2. An entry to a calling, or a calling, where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas who entered by favor and money, and contrary to the Law was High-Priest but for a year: yet was a true High-Priest, and prophesied as the High-Priest. 8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself, by a silver key, having given the prelate a bud, the ordinance of God is conferred upon him and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving.</p></blockquote>

<blockquote><p>4th Distinction. A calling may be expressly and formally corrupt in respect of the particular intention of the ordainers and of the particular Church, ex intentione ordinanris &amp; operantis [out of the intention of the ordainers and of the one working]. Thus Luther’s calling to be a monk was a corrupt calling, and eatenus, and ‘in that respect’ he could not give a calling to others. But that some calling may be implicitly and virtually good and lawful in respect of the intention of the Catholic Church and ex intentione operis &amp; ipsius ordinationis [out of the intention of the work and the ordination itself], he was called to preach the Word of God. … 7. A calling to the ministry is either such [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51]. 8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself, by a silver key, having given the prelate a bud. The ordinance of God is conferred upon him, and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“4th Distinction. A calling may be expressly and formally corrupt in respect of the particular intention of the ordainers and of the particular Church, ex intentione ordinanris &amp; operantis [out of the intention of the ordainers and of the one working]. Thus Luther’s calling to be a monk was a corrupt calling, and eatenus, and ‘in that respect’ he could not give a calling to others. But that some calling may be implicitly and virtually good and lawful in respect of the intention of the Catholic Church and ex intentione operis &amp; ipsius ordinationis [out of the intention of the work and the ordination itself], he was called to preach the Word of God. … 7. A calling to the ministry is either such [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51]. 8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself, by a silver key, having given the prelate a bud. The ordinance of God is conferred upon him, and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving.”

<blockquote><p>But it is further objected by Sutlivius that this could not be such a Presbytery as is among us, because ordination and imposition of hands pertain to none but the ministers of the Word. Answer 1. The children of Israel laid their hands upon the Levites (Num. 8:10), and we would know his reason why he denies the like power to ruling elders now, especially since this imposition of hands is but a gesture of one praying, and a moral sign declaring the person prayed for. 2. Howsoever our practice (which is also approved by good divines, Junius, Cont. 5, book 1, ch. 3; Synopsis Pur. Theol., Disputation 42, Thesis 37) is to put a difference betwixt the act of ordination and the external right thereof, which is imposition of hands, ascribing the former to the whole Presbytery both pastors and elders, and reserving the latter to the ministers of the Word, yet to be done in the name of all.</p></blockquote>

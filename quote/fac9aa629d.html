<blockquote><p>Nabuchodnosor, whose purpose was to toast with fire and utterly to destroy the martyrs of God for true religion, was immediately after compelled to praise God, because he saw the martyrs preserved: and he himself doth by edicts given out publicly proclaim and set forth the only true God and his true religion.</p></blockquote>

<blockquote><p>Previous to the time of Constantine, we find no trace of an image of Christ, properly speaking, except among the Gnostic Carpocratians, and in the case of the heathen emperor Alexander Severus, who adorned his domestic chapel, as a sort of syncretistic Pantheon, with representatives of all religions. The above-mentioned idea of the uncomely personal appearance of Jesus, the entire silence of the Gospels about it, and the Old Testament prohibition of images, restrained the church from making either pictures or statues of Christ, until in the Nicene age a great change took place, though not without energetic and long-continued opposition. Eusebius gives us, from his own observation, the oldest report of a statue of Christ, which was said to have been erected by the woman with the issue of blood, together with her own statue, in memory of her cure, before her dwelling at Cæsarea Philippi (Paneas). But the same historian, in a letter to the empress Constantia (the sister of Constantine and widow of Licinius), strongly protested against images of Christ, who had laid aside his earthly servant form, and whose heavenly glory transcends the conception and artistic skill of man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-schaff.html">Philip Schaff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of the Christian Church</cite>, (Charles Scribner’s Sons, 1910), 2.280–81.</span></figcaption>

</figure><figure class="quote" id="q-b3a3ffc529" data-kw="">
<blockquote><p>Youth could also perform comedies and tragedies, and by such means a useful form of entertainment, honorable and contributing toward an increase of piety, may be staged for the people; but it will be necessary that devout and wise men experienced in the Kingdom of Christ compose these comedies and tragedies, in which there may be presented on the stage the plans, actions and events of mankind, whether common and ordinary as it occurs in compedies or unique and eliciting admiration as it is characteristic of tragedies. All this will contribute toward a correction of morals and a pious orientation to life (Aristotle, Poetics II, 1448a). … It must be observed, however, that when in both kinds of poetic material, comic and tragic, the activities and sins of men are described and actively presented to be seen with the eyes, it should be done in such a way that although the crimes of reprobate men are related, yet a certain terror of divine judgment and horror of sin should appear in these things, and a shameless daring and an exultant delight in crimes should not be expressed. It is better here to take something away from poetic fitness rather than from the concern for edifying the piety of the spectators, which demands that in every representation of sin there be felt the condemnation of one’s conscience and the horrible fear of God’s judgment. But when pious and good actions are shown, they should express as clearly as possible a happy, secure and confident sense of the divine mercy, but moderate and diffident as regards the self, and a joyful trust in God and his promises, with holy and spiritual pleasure in doing good.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 349-52 of ch. 54, ‘Honest Games’ in On the Reign of Christ, bk. 2 in Melanchthon &amp; Bucer, ed. Wilhelm Pauck (Philadelphia: Westminster Press, 1969)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-01e94e1088" data-kw="">
<blockquote><p>In 1649, the General Assembly at Edinburgh, adopted the version which she still uses. The ground-work of this was laid by Mr. Francis Rouse, who is represented as a man of piety and learning. It was recommended to the attention of the Assembly of Divines at Westminster. Under their correcting hand, in the course of several years, it was improved. It was then forwarded to the North, and was, by the supreme judicatory of the Scottish Church, committed to committees for revision. Years were by them employed in comparing it with the original Hebrew, and in attempting to carry as much as possible of the spirit of the primitive composition into the translation.

And the man of literature and taste, who shall carefully examine the subject, it is believed, will admit, that they admirably succeeded. Like the version of the Bible, this of the Psalms, is not remarkable for modern elegance of diction; but it is remarkably literal. To present the book of Psalms in its native simplicity, beauties, and force, was the aim of the Westminster divines, as well as of the Assembly at Edinburgh. To the man of God, to the child of grace, and the man of legitimate taste, these characteristics must be a recommendation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-mcmaster.html">Gilbert McMaster</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Apology for the Book of Psalms, in Five Letters; Addressed to the Friends of Union in the Church of God</cite>, (1818; 4th edn, Philadelphia: Daniels &amp; Smith, 1852), pp 74-75.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><figure class="quote" id="q-0be51627bb" data-kw="">
<blockquote><p>Besides, you mistake him [Tertullian] if you think he meant by the name of ‘tradition’ a tradition of the apostles. For whatsoever custom not written in the scripture was kept by the faithful, that, because it was delivered by some body from whom the use thereof was taken, he says it came in by tradition. In so much that he affirms it both of Jewish customs before the apostles, as that their women covered their faces with vails…</p></blockquote>

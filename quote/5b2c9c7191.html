<main class="wrap"><figure class="quote" id="q-5b2c9c7191" data-kw="">
<blockquote><p>§35. And 2. No man may of his own head command anything in or belonging to the worship of God: but he must have either a special or general warrant and command from God Himself to do it. God’s Law must either make the thing necessary in specie, and so leave man nothing about it but to second it by his Law, and see it executed: or else God’s Law must make the thing necessary in genere, and so leave man to determine of the species (as is oft said). But where neither of these are done by God, man has no power for the imposing of that thing.</p></blockquote>

<blockquote><p>But there are some so grossly ignorant of what prayer is that they make use of the Ten Commands, and Belief [the Apostles’ Creed] as a prayer: so void are they of the knowledge and spirit of God that they cannot discern betwixt God’s commands to themselves and their own requests to God, betwixt his speaking to men and their speaking to Him, between their professing of Him before men and praying and confessing to Him; all this is but forged imaginary worship, worship falsely so called which the Father seeks not and receives not.</p></blockquote>

</figure><figure class="quote" id="q-fd7f6ad98e" data-kw="">
<blockquote><p>…a definition of the worship of God may be framed thus: The worship or service of God is when, upon right knowledge of God, we freely give Him the honor that is proper to him, in our hearts, according to his own will. Worship thus defined must be condsidered as a distinct thing from that honor which is called ‘veneration’. For worship properly belongs to persons, and veneration to things which appertain to persons. And veneration is to have a reverent estimation of anything or to preserve and keep it without hurt, as making store of it, and to use it reverently if it be to be used.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (d. 1602; London: Legatt, 1626), vol. 1, p. 702</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-9093877d1c" data-kw="">
<blockquote><p>There is a twofold opinion concerning the reformation of Churches: some hold that nothing at all should be added to apostolical simplicity, and by consequence are of mind that whatsoever the apostles did, they think they are to do it, but whatsoever the Church after the apostles did add to the first rites, they think them fit even all at once to be abolished. There are others on the other side which hold that certain ancient rites (besides the apostolical ordinances) are to be retained, partly as profitable and necessary: partly also albeit not necessary, yet to be tolerated for concord sake’s. For mine own part I doubt not but the apostolical doctrine to be most absolutely perfect without all exception, to the which it is not lawful to add or to detract any thing; howbeit, touching ceremonies my judgement is otherwise. For first, it is certain that even the apostles themselves could not determinately set down what they judged to be expedient for the Churches in their first beginning: and therefore necessarily they proceeded by little and little, as the institution of deacons does make evident, inasmuch as they suffered for a season many Jewish ceremonies, as appears in the story of their Acts: again, to whom can it be doubtful that the apostles had exceeding regard unto their times, places and persons in external rites. Inasmuch as it is not profitable that the same rites were observed everywhere, as appears in that excellent epistle of Irenaeus to Victor. Besides, necessity itself abolished certain of their ordinances, as their common feasts of love. Wherefore whatsoever was performed by the apostles in rites and ceremonies, I do not judge that presently, neither yet without some exception, to be followed as a rule. And indeed I wonder not that those ancient fathers, having respect unto their own times, did take away some things, some things add and somewhat alter. Only herein (with their good leave be it spoken) they seem to me to have often failed, that they neither held any measure in their rites, neither had that due regard to Christian simplicity and purity as was meet.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolarum theologicarum Theodori Bezae Vezelii, liber unus</cite>, (Geneva: Vignon, 1575), Epistle 8, p. 70-71, as translated by John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1618), ‘Reformed Practices’, ‘Practice’, pp. 175-76</span></figcaption>

</figure><figure class="quote" id="q-9490e704dd" data-kw="">
<blockquote><p>It’s [the light of nature is] altogether insufficient to prescribe or set down any worship of God. Hence God does so often forbid us to walk after our own imaginations and to do that which we shall choose. The apostle calls it will-worship, when a man’s will is the mere cause of it. Now, it’s true, men are more apt to admire this, as we see in the Pharisees and Papists; they dote upon their traditions more then God’s institutions… It’s true indeed, even in worship, light of Nature and prudence is instrumentally required to order the institutions of God; but as reason may not make a new article of faith, so neither a new part of worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis</cite>, … (London, 1647), Lecture 7, pp. 74</span></figcaption>

<main class="wrap"><figure class="quote" id="q-33ef8d9b22" data-kw="">
<blockquote><p>For if a lord also is not so called unless when he begins to have a slave, that appellation likewise is relative and in time to God; for the creature is not from all eternity, of which He is the Lord. How then shall we make it good that relative terms themselves are not accidental, since nothing happens accidentally to God in time, because He is incapable of change, as we have argued in the beginning of this discussion? Behold! To be the Lord is not eternal to God; otherwise we should be compelled to say that the creature also is from eternity, since He would not be a lord from all eternity unless the creature also was a servant from all eternity… Certainly to be the Lord of man happened to God in time. And that all dispute may seem to be taken away, certainly to be your Lord, or mine, who have only lately begun to be, happened to God in time. How then shall we make it good that nothing is said of God according to accident, except because nothing happens to His nature by which He may be changed, so that those things are relative accidents which happen in connection with some change of the things of which they are spoken. As a friend is so called relatively… how much more easily ought we to admit, concerning that unchangeable substance of God, that something may be so predicated relatively in respect to the creature, that although it begin to be so predicated in time, yet nothing shall be understood to have happened to the substance itself of God, but only to that creature in respect to which it is predicated? Lord, it is said, ‘You have been made our refuge.’ God, therefore, is said to be our refuge relatively, for He is referred to us, and He then becomes our refuge when we flee to Him; pray does anything come to pass then in His nature, which, before we fled to Him, was not? In us therefore some change does take place; for we were worse before we fled to Him, and we become better by fleeing to Him: but in Him there is no change… Therefore that which begins to be spoken of God in time, and which was not spoken of Him before, is manifestly spoken of Him relatively; yet not according to any accident of God, so that anything should have happened to Him, but clearly according to some accident of that [thing or person], in respect to which God begins to be called something relatively… that what is said may be said in that way in which it can be comprehended by human affections. So also, when He is said to be angry with the unrighteous, and gentle with the good, they are changed, not He: just as the light is troublesome to weak eyes, pleasant to those that are strong; namely, by their change, not its own.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a540be4c48" data-kw="">
<blockquote><p>The second part of the division, however, that between ‘proper’ and ‘figurative,’ is the point of distinction between the affections and all of the attributes discussed previously [life, intellect, will, righteousness, truth, pwer, glory, etc.]. For the affections of the divine will or, as they are sometimes called, divine virtues, are attributed to God, not properly, but figuratively… The affections are, therefore, either inward and inalterable dispositions of the divine will or figurative attributions based on ad extra manifestations. Furthermore, what makes the attribution of an affection to God figurative or metaphorical is its apparent variation, temporality, or alterability. … …the [reformed] orthodox assume that God has affectiones that characterize his relationship to the world and that some analogy can be drawn between these ‘divine affections’ and the affections that belong to human willing–with the major qualification that, unlike human affections, the divine affections do not indicate essential change in God and that they are permanent rather than transient dispositions… …This, an affection is a disposition of nature or an inclination of will toward an object and, as such, it can indicate either a transient disposition (in contrast to a habitus) that is caused by an external object or a permanent disposition or virtue. It is the latter sense of the term, as a permanent disposition or virtue, that the orthodox accept… A virtue is, quite simply, a moral perfection–in the case of God, the perfection of his understanding and/or will.433 433. [William] Ames, Marrow, I.iv.63… the point of the theological argument is that God act[s] but is not acted upon. The Reformed orthodox understanding of God, in accord with the greater part of the Christian tradition, assumes the divine immutability, and, typically, denies change and, certainly, acquired qualities to God. … The divine affections… are divine perfections that have some analogy to the dispositions or habits of the human will.</p></blockquote>

</figure><figure class="quote" id="q-4fcad14e0a" data-kw="">
<blockquote><p>Besides, creation is the only first discovery of his dominion. Before the world was framed there was nothing but God Himself, and, properly, nothing is said to have dominion over itself; this is a relative attribute, reflecting on the works of God; He had a right of dominion in his nature from eternity, but before creation He was actually Lord only of a nullity; where there is nothing it can have no relation; nothing is not the subject of possession nor of dominion. There could be no exercise of this dominion without creation: what exercise can a sovereign have without subjects? Sovereignty speaks a relation to subjects, and none is properly a sovereign without subjects. To conclude: from hence does result God’s universal dominion; for being Maker of all, He is the ruler of all, and his perpetual dominion; for as long as God continues in the relation of Creator, the right of his sovereignty as Creator cannot be abolished.</p></blockquote>

s Online</a></div>

<blockquote><p>Now it is usual to understand it [grace] principally in two ways: either affectively (as they say), i.e., with respect to the ‘internal act’ in God; or effectively, with regard to the effects which it produces outwardly in the creatures. The former is toward us, and we stand objectively related to it; the latter is in us, and we stand subjectively related to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 1, 3rd Topic, 20th Question, | section 7, p. 242</span></figcaption>

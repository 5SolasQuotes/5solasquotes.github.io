<main class="wrap"><figure class="quote" id="q-e9131ac709" data-kw="">
<blockquote><p>This doctrine [of Hooker, a congregationalist] deprives godly travellers, sojourners, savoury professors of the Lord’s Supper… of Church-teaching, rebuking, prayer, Church comforts… and of all communion with Christ, the Head of the visible Church… for no scandal or sin, but only for going about a lawful duty in all the visible Churches on earth, as is clear: Cant. 1:7 &amp; 2:1-4; Ps. 27:4 &amp; 73:16-17 &amp; 84:4 &amp; 42:1-4; Heb. 2:12; Ps. 22:22 &amp; 40:9-10…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, ... (1658), bk. 1, ch. 19; p. 103</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-10e7eb0cf1" data-kw="">
<blockquote><p>It is uncharitable, and against the Word, to teach that when a church is dissolved, by no sin and scandal-visible, but by persecution or pestilence, that the dissolved members, though both real and visible converts, have no right to the ordinances: for if the formal cause, to wit, their confederacy into one visible body, as Mr. [Thomas] Hooker [a congregationalist] says, be removed, their visible and external right is removed. The like is to be said of visible professors, and of members of another congregation, and known godly sojourners [travelers]; these Mr. Hooker [by implication] excommunicates for no scandal, visible and invisible: for impossible it is that they can meet together in one place with their own church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 1 | ch. 19, ‘Mr. [Thomas] Hooker [a congregationalist], his formal cause of a Church visible, or Church confederating, is considered’, pp. 96-104, p. 96</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>

 target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-3f53e00f4c" data-kw="">
<blockquote><p>3. We grant that there may be an express and solemn covenant, in the presence of God and the Church, upon extraordinary occasions, entered into, by all the members of the visible Church of one nation or kingdom: when the Church in that kingdome or nation has made defection from God and his worship, or some other necessity call for it; for the preserving, or propagating, or restoring of the decayed worship of God. By which covenant notwithstanding there does not acrue to the Church of that kingdom any new right, but that right which before they had to enjoy the ordinances of God, which by reason of their defection, or some other cause, was hindered and as it were suspended, they may now freely and purely again reduce to practise. Thus did the Church of God under the Old Testament often in the time of defection, or extraordinary necessity, enter into a solemn covenant in the presence of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/apollonius.html">Apollonius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Consideration of Certain Controversies at this Time Agitated in the Kingdom of England, concerning the Government of the Church of God</cite>, (1645), ch. 2, ‘Of a Church-Covenant’ Apollonius was a Dutch presbyterian., pp. 15-16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

</figure><figure class="quote" id="q-125b61d58b" data-kw="">
<blockquote><p>Concerning the matter of the Church, the Independents have learned all their unjust scrupulosity from the other; as the Brownists [separatists] require every church member to be a saint, really regenerate and justified, who at their admission have publicly satisfied the whole congregation by convincing signs of their true holiness: the other requires the same. Whatever indulgence here the Independents profess to give, either to weak ones in whom they find the least of Christ, or to women whom they remit from the congregation to speak more privately in the eldership (yet this is no other than the present practice of the Brownists at Amsterdam.</p></blockquote>

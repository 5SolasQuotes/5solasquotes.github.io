<main class="wrap"><figure class="quote" id="q-4027e08688" data-kw="">
<blockquote><p>When Moses writes that God created Heaven and Earth and whatever is in them in six days, then let this period continue to have been six days, and do not venture to devise any comment according to which six days were one day. But, if you cannot understand how this could have been done in six days, then grant the Holy Spirit the honor of being more learned than you are. For you are to deal with Scripture in such a way that you bear in mind that God Himself says what is written. But since God is speaking, it is not fitting for you wantonly to turn His word in the direction you wish to go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Luther Says. A Practical In-Home Anthology for the Active Christian</cite>, ed. Ewald M. Plass (St. Louis: Concordia, 1959), p. 1523</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-6048777324" data-kw="">
<blockquote><p>For He is the First immaterial Being; and as intellectuality is a result of immateriality, it follows that He is the First intelligent Being. Therefore since in each order the first is the cause of all that follows, we must conclude that from Him proceeds all intellectual power. In like manner, since He is the First Being, and all other beings pre-exist in Him as in their First Cause, it follows that they exist intelligibly in Him, after the mode of His own Nature. For as the intelligible types of everything exist first of all in God, and are derived from Him by other intellects in order that these may actually understand; so also are they derived by creatures that they may subsist.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5b76ba6123" data-kw="">
<blockquote><p>And the reason why there must be this sanctifying of the heart is:

1. First, because the Lord does first accept of the person before He does accept of the action: Men indeed do accept of the persons of men because they do good actions, but God accepts of the actions of men because their persons are good. If indeed we see a man do good, then we love him and accept of the person of the man; but God first will accept of the person before the action: As the Lord accepted of Abel first, and then He accepted his offering [Gen. 4:4; Heb. 11:4]… you must first look after means of acceptation of your persons, which is through the righteousness of Jesus Christ, and through the sanctification of his Spirit, whereby you come to have his image and life, and so are accepted, and then all that proceeds from you comes to be accepted…

2. Secondly, our hearts must be sanctified because the Lord does look more to the principle from whence a thing comes than at the thing itself… So God is not pleased with anything that comes from us except He knows that it comes from a principle of love, grace, and holiness in our hearts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Gospel Worship</cite>, ... (London: 1647) | Sermon 4, on Lev. 10:3, “I will be sanctified in them that come nigh Me.”, pp. 69-70</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-316ce28289" data-kw="">
<blockquote><p>Come friends, there is no end, nor much hope in disputing against fixed prejudice and wrong confident conceits, how clear soever the light be against it. Hold your judgment and I shall hold mine till God irresistibly reconcile us; and if you cannot forgive me, I can forgive you, but not own the guilt of your mistakes and the effects; I have too much already of my own. I had rather you accused me than [my own] conscience [accuse me] for wilful contracting¹ anymore. The Lord save us from our enemies, but more especially from our friends and all their temptations, and above all, from ourselves.</p></blockquote>

</figure><figure class="quote" id="q-7b93b1b030" data-kw="">
<blockquote><p>Will any object unto us the profaneness of the ministers, rudeness and disorder of the ministration of God’s worship, we yield it is too visibly true; but more vile administrators, or irregular administrations cannot be than were the sons of Eli in their service, who made the people to loathe the offerings of the Lord, and were rebuked, and described by Samuel in 1 Sam. 2:12-17… O horrid uncleanness, most heaven-daring villany! Yet I find not that any God-fearing-Israelite forsook the sanctuary, or durst forbear their sacrifice; nor did Samuel (who reproved, and denounced God’s judgment against this profaneness) ever advise or direct the same.</p></blockquote>

<blockquote><p>4. Zepperus, On the Sacraments, ch. 13, fol. 324-26, 328.

1. The furious clamors and persecutions of the Papists did not permit this reformation of ceremonies at the first: which were so violent and bloody, that it gave small or no leisure to the teachers and lights of the Church, neither was it safe for them to bend their care or cogitations this way.

2. The people were so drowned in the deep darkeness and idolatry of the Papacy that the amendment of ceremonies, and of external worship could not in those beginnings be undertaken. It was necessary to use doctrine, and to instruct the people of sundry and horrible errors, idolatry, superstitions and abuses, which the whole Papacy and Popish ceremonies have in their departure, that so all those ugly things might first be removed out of their minds, before they were removed from their sight. That which is not the work of one year, but a task of long season: For as ceremonies which are visible things and apprehended by the eyes do more affect and move than the invisible doctrine; So the people did closely stick to their accustomed ceremonies, and opposed themselves vehemently against the reformation of them: Even as we see at this day to come to pass, when as yet sound doctrine has prevailed and flourished for above these 80 years.

3. The Church in Popery was nothing else but a sick body: In which from the sole of the foot to the crown of the head, there was nothing sound and entire: Wherefore at the first beginning of reformation that whole chaos and abomination of error, and of Popish idolatry could not suddenly be perceived, but use and experience did daily manifest and teach every day more, than at the first.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623) | ‘Reformed Practices’, pp. 173-74</span></figcaption>

</figure><figure class="quote" id="q-4e00f766c2" data-kw="">
<blockquote><p>Calvin: In the English Liturgy as you [the English exiles at Frankfurt] do describe unto me, I spy out many tolerabiles ineptias, ‘tolerable unfit things:’ By which two words I express thus much, that there was not that purity which were to be wished, which errors could not immediately the first day be corrected (Cum nulla subesset manifesta impietas ferenda ad tempus fuisse). Seeing there was therein contained no manifest impiety, these things† should have been born withal for a time; Epistle 200, fol. 336.</p></blockquote>

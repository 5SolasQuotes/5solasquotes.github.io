<main class="wrap"><figure class="quote" id="q-afef11b719" data-kw="">
<blockquote><p>To clear this, hear how some distinguish of Tyrants. There is Tyrannus titulo a Tyrant in title, and tyrannus exercitio, a Tyrant in exercise. Of Tyrants by title there be two sorts; some whose function is good, but they have no right to it (or the power which they assume is lawful in it self, but not for them) others whose office or power as they assume it, and in the substance of the thing it self is unlawful. The Pope’s power is a Tyranny in the highest kind because that authority which he challenges is not lawful neither in him, as Bishop of Rome, nor in any Bishop of the world. The power which Prelates assumed in ordination and jurisdiction in the substance of it was a lawful power, but unlawful and Tyrannous in them as they appropriated it unto themselves, excluding those to whom of right it did belong.

In the exercise of power, they whose authority in it self is most unquestionable, and whose title is confessed, may yet become Tyrannous, by abuse of power. And therefore care should be had every way by all those who take upon them any thing in affaires of religion. This also (3.) concerns all Christian people and that singly, or combined; for single Christians, they should not take upon them the work of officers, that’s absolutely inconsistable with order, polity, an organical body, and with the nature of the Church, which is built upon the foundation of the Apostles and Prophets, Jesus Christ himself being the chief corner stone.

And because all the congregation is holy, every one of them upon that ground or under that pretence for the congregation to oppose those who are over them in the Lord, in those things wherein they are over them, is directly to fall into the sin of Korah, Dathan and Abiram, and that whereof Saint Jude gives special warning in his Epistle. It’s of great use for every one that does any thing either in government or worship, to have an answer ready unto that question, when Christ shall propound it at the last who hath required this at your hands?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lazarus-seaman.html">Lazarus Seaman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The head of the church, the judge of the world. Or, The doctrine of the day of judgement briefly opened and applied: in a sermon preached before the Right Honourable, the House of Peers; in the Abby-Church at Westminster, on a public fast day, Jan. 27. 1646. By Lazarus Seaman Preacher at All hallows</cite>, (London: I. Rothwell, 1647), pp 20-21.</span></figcaption>

</figure><figure class="quote" id="q-4300405dab" data-kw="">
<blockquote><p>There ever have been, and are, those in greater or less numbers, who hear the word anon with joy; who perhaps for the time soar above all others in the impassioned zeal and high-toned professions with which they appear to embrace religion; whose ardour not only faints, but expires, as soon as it ceases to be fanned by the breath of extraneous excitement which first gave it being; or, at all events, as soon as they are brought into a position in which religion involves any self-denial. As our Saviour elsewhere expresses it, when tribulation or persecution ariseth because of the word, by-and-by he is offended. This declension of multitudes, who did run well for a time, into list-less indifference, or utter apostacy, has occurred with greater or less frequency in all ages, thus wounding the hearts of the pious, and the cause of Christ in the house of his friends.</p></blockquote>

</figure><figure class="quote" id="q-39f230ea36" data-kw="">
<blockquote><p>From the title of this volume the reader will be prepared to find that I take decided views, and vindicate one system of polity in preference to others. It does not follow that I advocate an existing Presbyterianism unqualifiedly and indiscriminately — that I perceive everything among ourselves to be right, and all things in which our neighbours differ from us to be wrong. Such partisanship will never promote the discovery of truth, nor bring our debates by one step nearer to a conclusion.

We are sadly ignorant of ourselves, and frequently we know not what spirit we are of. That I have nowhere in these pages transgressed the laws of Christian charity and courtesy, I dare not assert. But I have certainly aimed to treat opponents respectfully, to meet their arguments fairly, and to offer no reply to the reader which I did not feel, on calm reflection, to be satisfactory to myself.

While I have defended Presbyterianism in the honest belief that it is defensible on good grounds, though admitting in various points of nearer approximation to the primitive model, I have rejoiced to find, that without underestimating a single argument, or compromising one iota of my convictions, I have been induced to moderate, in several important particulars, my estimate of denominational differences; and I would reckon myself favoured beyond expression if this small work should convey to others the same persuasion, and thus advance Christian conciliation and co-operative beneficence.</p></blockquote>

<blockquote><p>For seeing that Christ is the rock (Petra), Peter is the Christian people. For the rock (Petra) is the original name. Therefore Peter is so called from the rock; not the rock from Peter; as Christ is not called Christ from the Christian, but the Christian from Christ. Therefore, he says, You are Peter; and upon this Rock which you have confessed, upon this Rock which you have acknowledged, saying, You are the Christ, the Son of the living God, will I build My Church; that is upon Myself, the Son of the living God, will I build My Church. I will build you upon Myself, not Myself upon you.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-03516e18da" data-kw="">
<blockquote><p>Before leaving these erratic theories, let me briefly advert to Amyraldism, sometimes called hypothetic Universalism, which was ill the last degree disastrous to French Protestantism before the revocation of the Edict of Nantes. I refer to it more especially because the phraseology which it introduced is still current in America, and is found in this country in quarters where we are surprised to find it.

By those who were competent to take the measure of Amyraldism — such as Rivetus, Maresius, and Spanheim — it was regarded as a subtle form of Arminianism, though its author and his followers declared their harmony with the Articles of the Synod of Dort. After a long discussion of this middle way by one synod after another, in 1637 and 1645, Amyraldus, by his protestations to the effect that he assented and consented to the Articles of Dort, succeeded in disarming further opposition, and in obtaining an acquittal from the charge of heterodoxy in 1649.

But it was the death-blow of French Protestantism. The majority of the theologians and pastors soon adopted his opinions. The French Protestant Church virtually ceased to be a witness for the doctrines of grace. A scholar of Amyraldus, Pajon, went farther than his master in minimizing the extent of natural corruption and the power of the Spirit in conversion. For the gracious operations of the Spirit, he, in fact, substituted the moral influence of the word, or moral suasion. After this, it was rather the Jansenists than the Protestants in France that gave any testimony to the doctrines of special grace.

A few years later a terrible storm of persecution broke out, and scattered the French Protestants over the globe. It is not for us to call this a divine retribution, or a visitation in wrath. But few will deny that a deep declension had begun — or hesitate to affirm that the salt was beginning to lose its savour. Of those refugees who were scattered in all directions, no fewer than TWO HUNDRED PASTORS repaired to Holland, and were received with deep sympathy, and yet with due caution.

They were not to be received as pastors into the Walloon Church, unless they subscribed an article binding them to accept the Articles of Dort, and never to refer in public or in private to those Amyraldist and Pajonian doctrines which Spanheim, Jurieu, Saurin, and others regarded as an Arminian leaven which had destroyed the French Protestant Church. These pastors consented to subscribe that article, and the Church was thus freed from the evil leaven by which it was menaced.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-smeaton.html">George Smeaton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Holy Spirit. The Ninth Series of the Cunningham Lectures, 1882</cite>, (Edinburgh: T. &amp; T. Clark, 1882), pp 322-24.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9268f81703" data-kw="">
<blockquote><p>In fact it seems much more accurate to say that Amyraut was the real Reformed “scholastic,” and “Reformed Thomas Aquinas,” the balancer, the synthesizer, the creator of new categories, and structures. And Reformed orthodoxy, with its insistence on limited redemption, was actually a primitive throwback to the rigorous and markedly non-rationalistic particularism of Augustine and Gottschalk. Under whatever label, John Calvin, as a limited redemptionist, belongs historically with Augustine, Gottschalk, Bucer, Beza and Reformed orthodoxy–not with Amyraut.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-rainbow.html">Jonathan Rainbow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Will of God and the Cross</cite>, (Allison Park, PA: Pickwick Publications, 1990), p. 62</span></figcaption>

<blockquote><p>The interest of the debate to us lies in the revelation which it gives us of the presence in the Assembly of an influential and able, but apparently small, body of men whose convictions lay in the direction of the modified Calvinism which had been lately promulgated by Cameron and Amyraut for the express purpose of finding a place for a universal redemption in the Calvinistic system. For the origin of this party Dr. Mitchell would point us to English sources: but Baillie especially mentions Amyraut in this connection; and it would seem that it was Amyraut and Cameron—both of whom Gillespie mentions in this debate—whom men had especially in mind during the discussion; and it would seem further to be clear that while the adherents of this universalistic view of the atonement in the Assembly held it with British moderation, and were not prepared to go all lengths with the French Divines who had lately promulgated it with such force, they yet looked upon them as of their school and sought support from them. The result of the debate was a refusal to modify the Calvinistic statement in this direction—or perhaps we should rather say the definitive rejection of the Amyraldian views and the adoption of language which was precisely framed to exclude them. Dr. Mitchell, reviving an old contention, suggests indeed that unless the clause of the Confession in question be read disjunctively rather than, as it is actually phrased, conjunctively, it will not operate for the exclusion of Amyraldians. It is not clearly obvious, however, that the word “and” here binds the several items of the enumeration so closely together as to make it appear that all that is affirmed is only that the whole of this process takes place in the case of the elect only: the natural sense of the clause is clearly that no one of the transactions here brought together is to be affirmed of the non-elect. And this impression is increased by the broader context, not to speak of the parallel passages in viii. 3 and 5. It might seem somewhat more to the point, possibly, to recall that in this section the language is so ordered as to seem to deal with the actual ordo salutis rather than directly with the ordo decretorum. It is asserted that the ordo salutis is the result of the decreeing of the means by which the elect are brought to glory. But what is subsequently asserted is that none but the elect are (actually) redeemed by Christ, effectually called, etc.—the mind being abstracted for the moment from the intention to the performance. The Westminster Amyraldians—if we may venture so to call them—had, of course, freely admitted the distinction between the elect and non-elect in the application: it was only in the impetration that they disputed it: and it might perhaps seem to them possible to confess that though Christ had died for all, the merits of His death had actually been applied only to some, and to contend that only this is actually expressed by saying that none but the elect “are redeemed by Christ.” Even this, however, appears more subtle than satisfactory; and in any event it would seem quite obvious that the Assembly intended to state in this clause with adequate clearness their reasoned and deliberate conviction that the decree of election lies behind the decree of the gift of Christ for redemption, and that the latter is to be classed as one of the means for the execution of the decree of election. This is the definite exclusion of the Amyraldian view, and anything that can be made really consistent with this conception of the ordo decretorum will be found to differ fundamentally from Amyraldism.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Benjamin B. Warfield</cite>, vol. 6 (Bellingham, WA: Logos Bible Software, 2008), 142–44.</span></figcaption>

e+case+of+the+elect+only%3A+the+natural+sense+of+the+clause+is+clearly+that+no+one+of+the+transactions+here+brought+together+is+to+be+affirmed+of+the+non-elect.+And+this+impression+is+increased+by+the+broader+context%2C+not+to+speak+of+the+parallel+passages+in+viii.+3+and+5.+It+might+seem+somewhat+more+to+the+point%2C+possibly%2C+to+recall+that+in+this+section+the+language+is+so+ordered+as+to+seem+to+deal+with+the+actual+ordo+salutis+rather+than+directly+with+the+ordo+decretorum.+It+is+asserted+that+the+ordo+salutis+is+the+result+of+the+decreeing+of+the+means+by+which+the+elect+are+brought+to+glory.+But+what+is+subsequently+asserted+is+that+none+but+the+elect+are+%28actually%29+redeemed+by+Christ%2C+effectually+called%2C+etc.%E2%80%94the+mind+being+abstracted+for+the+moment+from+the+intention+to+the+performance.+The+Westminster+Amyraldians%E2%80%94if+we+may+venture+so+to+call+them%E2%80%94had%2C+of+course%2C+freely+admitted+the+distinction+between+the+elect+and+non-elect+in+the+application%3A+it+was+only+in+the+impetration+that+they+disputed+it%3A+and+it+might+perhaps+seem+to+them+possible+to+confess+that+though+Christ+had+died+for+all%2C+the+merits+of+His+death+had+actually+been+applied+only+to+some%2C+and+to+contend+that+only+this+is+actually+expressed+by+saying+that+none+but+the+elect+%E2%80%9Care+redeemed+by+Christ.%E2%80%9D+Even+this%2C+however%2C+appears+more+subtle+than+satisfactory%3B+and+in+any+event+it+would+seem+quite+obvious+that+the+Assembly+intended+to+state+in+this+clause+with+adequate+clearness+their+reasoned+and+deliberate+conviction+that+the+decree+of+election+lies+behind+the+decree+of+the+gift+of+Christ+for+redemption%2C+and+that+the+latter+is+to+be+classed+as+one+of+the+means+for+the+execution+of+the+decree+of+election.+This+is+the+definite+exclusion+of+the+Amyraldian+view%2C+and+anything+that+can+be+made+really+consistent+with+this+conception+of+the+ordo+decretorum+will+be+found+to+differ+fundamentally+from+Amyraldism.%E2%80%9D%0A%0A%E2%80%94+Benjamin+B.+Warfield%2C+The+Works+of+Benjamin+B.+Warfield%2C+vol.+6+%28Bellingham%2C+WA%3A+Logos+Bible+Software%2C+2008%29%2C+142%E2%80%9344.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4e8d3153f7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4e8d3153f7.html">Permalink</a><a class="src" href="https://heidelblog.net/2015/11/warfield-the-westminster-excluded-amyraldianism/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>Their own system was generally styled Universalismus Hypotheticus, an hypothetic or conditional universalism. They taught that there were two wills or purposes in God in respect to man’s salvation. The one will is a purpose to provide, at the cost of the sacrifice of his own Son, salvation for each and every human being without exception if they believe—a condition foreknown to be universally and certainly impossible. The other will is an absolute purpose, depending only upon his own sovereign good pleasure, to secure the certain salvation of a definite number… This view represents God as loving the non-elect sufficiently to give them his Son to die for them, but not loving them enough to give them faith and repentance… It represents God as willing at the same time that all men be saved and that only the elect be saved. It denies, in opposition to the Arminian, that any of God’s decrees are conditioned upon the self-determined will of the creature, and yet puts into the mouths of confessed Calvinists the very catch-words of the Arminian system, such as universal grace, the conditional will of God, universal redemption, etc. The language of Amyraldus, the ‘Marrow Men,’ Baxter, Wardlaw, Richards, and Brown is now used to cover much more serious departures from the truth. All really consistent Calvinists ought to have learned by now that the original position of the great writers and confessions of the Reformed Churches have only been confused, and neither improved, strengthened nor illustrated, by all the talk with which the Church has… been distracted as to the ‘double will’ of God, or the ‘double reference’ of the Atonement. If men will be consistent in their adherence to these ‘Novelties,’ they must become Arminians. If they would hold consistently to the essential principles of Calvinism, they must discard the ‘Novelties’.</p></blockquote>

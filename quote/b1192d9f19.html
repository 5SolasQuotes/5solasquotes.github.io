</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46a44aec95" data-kw="">
<blockquote><p>We the undersigned preachers, under the jurisdiction of the Classis of Alkmaar, declare and witness that the teaching which is in that catechism adopted unanimously by the Reformed [the Heidelberg Catechism] and which is comprehended in the 37 articles of the Dutch Reformed Churches [the Belgic Confession] agrees in everything with the Holy Word of God, and consequently with the foundation of the teaching of salvation. We promise to maintain this same teaching, through God’s grace; and openly to reject teachings that are brought against or oppose it; and with all diligence and faithfulness according to our ability to stand against them, as we affirm the same with our signatures.</p></blockquote>

</figure><figure class="quote" id="q-134828ed61" data-kw="">
<blockquote><p>… That this Commission may receive into ministerial communion such of the late conform ministers, as having qualified themselves according to law, shall apply personally to them, one by one, duly and orderly, and shall acknowledge, engage, and subscribe upon the end of the Confession of Faith, as follows, viz.: I… do sincerely own and declare, the above Confession of Faith, approven by former General Assemblies of this Church, and ratified by law in the year 1690, to be the confession of my faith; and that I own the doctrine therein contained to be the true doctrine which I will constantly adhere to; as likeways that I own and acknowledge Presbyterian Church government of this Church, now settled by law, by Kirk-Sessions, Presbyteries, Provincial Synods and General Assemblies, to be the only government of this Church, and that I will submit thereto, concur therewith, and never endeavour directly nor indirectly, the prejudice or subversion thereof… As also that the General Assembly require all Presbyteries and Synods, in their admitting or receiving any to ministerial communion, that they oblidge them to take and subscribe the same acknowledgment…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/formulas-of-subscription.html">Formulas of Subscription</a></span><span class="wk"><span class="lbl">Work:</span> <cite>General Assembly 1694 | Act approving Overtures anent a Commission of the General Assembly and Instructions thereto</cite></span></figcaption>

nto,take%20and%20subscribe%20the%20same%20acknowledgment&amp;text=That%20this%20Commission%20may%20receive%20into%20ministerial%20communion&amp;text=them%20to%20take%20and%20subscribe%20the%20same%20acknowledgment" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-39ccd92681" data-kw="Councils">
<blockquote><p>The authority of councils sinks far below that of the Scriptures, nor do their decisions bind the conscience any further than they appear to be conformed to the word of God. Hence a judgment belongs to them in matters of faith; not authoritative, infallible and supreme, but subaltern and ministerial; obligatory as to the external order of ecclesiastical communion and which ought to be of great weight among all the pious, but not as to faith and conscience, except insofar as they coincide with the Scriptures, which alone can bind the conscience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.14</span></figcaption>

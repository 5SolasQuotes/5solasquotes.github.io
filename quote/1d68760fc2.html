<main class="wrap"><figure class="quote" id="q-1d68760fc2" data-kw="">
<blockquote><p>But especially take heed of that which is true superstition indeed, by which here I mean the making of any new parts of religion to ourselves and fathering them upon God, who never made them. Of this there are two sorts, positive and negative: When we falsely say, ‘This is a duty commanded by God,’ or when we falsely say, ‘This is a sin forbidden by God.’ Take heed of both. I do not speak here of doing or not doing the same things upon any other account (as human duties, or mere conveniences or the like), but as they are falsely pretended to be divine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Direction 58, ‘Take heed of Superstition, and observe well the circular course of zealous superstition…’ in The Cure of Church Divisions… (London, 1670), pt. 1, pp. 278-95</cite>, p. 282</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44abecf5a8" data-kw="">
<blockquote><p>The typical reformed view and practice was that the material church buildings of Romanists, when cleansed, may be repurposed for good uses (1 Tim. 4:4–5). On the more exceptional cases where a Romanist building had been so notoriously idolatrous and scandalous, the scandal not removing with the removal of the idolatry, the reformed typically destroyed the building wholly, not allowing it to be further used. The Separatists, as seen here, were generally for destroying all the buildings that had been used by Romanists, not thinking it lawful to repurpose the material goods. See [also] ‘On Church Buildings &amp; Architecture’ (RBO)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; 1644; RBO, 2025)</cite>, p. 295 fn. 727</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>

</figure><figure class="quote" id="q-eb69c2ef5b" data-kw="">
<blockquote><p>Representations of God, Angels, and Saints.; Copes, Surplisses, Roods, etc.; Organs. The Lords and Commons assembled in Parliament, the better to accomplish the blessed Reformation so happily begun, and to remove all offences and things illegal in the worship of God, do Ordain, That all Representations of any of the Persons of the Trinity, or of any Angel or Saint, in or about any Cathedral, Collegiate or Parish Church, or Chapel, or in any open place within this Kingdom, shall be taken away, defaced, and utterly demolished; And that no such shall hereafter be set up, And that the Chancel-ground of every such Church or Chapel, raised for any altar, or Communion Table to stand upon, shall be laid down and leveled; And that no copes, surplisses, superstitious vestments, roods, or roodlons, holy-water fonts, shall be, or be any more used in any Church or Chapel within this realm; And that no cross, crucifix, picture, or representation of any of the Persons of the Trinity, or of any angel or saint shall be, or continue upon any plate, or other thing used, or to be used in or about the worship of God; And that all organs, and the frames or cases wherein they stand in all Churches or Chapels aforesaid, shall be taken away, and utterly defaced, and none other hereafter set up in their places; and that all copes, surplisses, superstitious vestments, roods, and fonts aforesaid, be likewise utterly defaced; whereunto all persons within this Kingdom, whom it may concern, are hereby required at their peril to yield due obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-parliament.html">English Parliament</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Ordinance for the Further Demolishing of Monuments of Idolatry &amp; Superstition’</cite></span></figcaption>

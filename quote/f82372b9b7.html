<main class="wrap"><figure class="quote" id="q-f82372b9b7" data-kw="">
<blockquote><p>5. Still, however, we see not how necessary that obedience is, unless we at the same time consider how prone our carnal nature is to shake off the yoke of God whenever it has been treated with some degree of gentleness and indulgence. It just happens to it, as with refractory horses, which, if kept idle for a few days at hack and manger, become ungovernable and no longer recognize the rider, whose command before they implicitly obeyed. And we invariably become what God complains of in the people of Israel — waxing gross and fat, we kick against Him who reared and nursed us (Deut. xxxii. 15). The kindness of God should allure us to ponder and love his goodness…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, bk. 3, ch. 8, section 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f181b2d4be" data-kw="">
<blockquote><p>7. Let reason be brought in captivity to the obedience of Christ, 2 Cor. 10:5. That which made the Antitrinitarians and Socinians fall away from the belief of the Trinity of persons in the Godhead, and of the union of the two natures of God and man in the person of Christ, was because their reason could not comprehend these articles: which is the ground of their opinion professed by themselves. When I speak of captivating reason, I do not mean implicit faith: the eyes of my understanding must be so far opened by the Holy Ghost, that I may know such an article is held forth in Scripture to be believed, and therefore I do believe that it is, though my reason cannot comprehend how it is.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ... (Edinburgh, 1649), ch. 11, ‘Of Stability &amp; Firmness in the Truth’, p. 140</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/implicit-faith.html">Implicit Faith</a></span></div>

</figure><figure class="quote" id="q-5829a2b680" data-kw="">
<blockquote><p>When we kneel to kings, we signify by that gesture that we submit ourselves to higher powers, not simply (says Peter Martyr) but insofar as they command not things against the Word of the Lord. When we adore God, we adore Him as the Supreme Majesty, being ready to obey Him in what He shall command, without any exception…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (1646), Introduction, section 6, p. 86</span></figcaption>

<blockquote><p>Now, even at this very time, when we are seeking and searching to find out the misdeeds on account of which God punishes us, and in what we have offended, you allege against us, that we have changed the divine service, and the order of the Church, which had been so well established and observed in this town. This is not any new reproach, for it was made against Jeremiah in his time, as he relates in the forty-fourth chapter. It is, that the hypocrites complain, that since they had left off the adoration of the Queen of Heaven, they had had nothing but famine, war, and all poverty. Lactantius also, an ancient doctor of the Church, and St. Augustine, demonstrate that in their time all the afflictions which had happened in the world were imputed to the Evangel, because it had brought about the abolition of the Pagan superstitions, which were thought to be service to God. You will reply, that it was not all alike; we hold that it was. What then is to be done? We must ascertain what is the truth upon the point, in order to pronounce a sound and correct opinion. Well, then, besides that our consciences speak peace to us before God as touching that, the thing itself can clearly answer for us before men. For no one has hitherto shewn us that we had changed anything which was commanded of God, nor that we had introduced any novelty against his person, nor that we had declined from the truth to lay hold on some evil doctrine. On the contrary, it is notorious that we have reformed our Church according to the pure doctrine of God, which is the rule to apply and to keep up a healthy state. It is true, that it is rather an odious thing to alter what has been hitherto received. But the order which our Lord has once delivered to us ought to be for ever inviolable. Thus, when it has been forsaken for a season, it ought to be renewed and set up again, even should heaven and earth commingle. There is no antiquity, no custom which can be set up or pleaded in prejudice of this doctrine, that the government of the Church established by the authority of God should be perpetual even to the end of the world, since he has willed and determined that it should be so. The reasons which have made us change are more than sufficiently urgent. The first point in Christianity is the true adoration of God. Now, we have come to know, that the form of adoration which we have been in the habit of observing was false and perverted, and, moreover, that it was not in the spirit of truth, (John 4,) but in external ceremonies, and even in superstitious practices. It is certain that then we did not adore God alone, but wood and stones instead of him, the pictures, the reliquaries of the dead, and things of a like kind. To the adoration of God is conjoined the rule of worshipping him aright. And in what manner is it that he is invoked throughout the Papacy, except with doubt and distrust, inasmuch as they know nothing about the office of Jesus Christ as our Advocate and Intercessor, by whom we obtain our requests? (Rom. 8; 1 Tim. 2; 1 John 2; Heb. 4) Besides, what are the public prayers but murmurs and ululations, vain repetitions without understanding? Thirdly, how many blasphemies are there in it, in so far as the power of the sole Mediator is attributed to saints and saintesses, to obtain grace in their name and by their merits? After the invocation follows the service, as if we were instructed to serve God by the vain traditions of men. On the contrary, he wills and requires that we take for our rule his will alone throughout. (Deut. 12; 1 Kings 15) As concerning the confidence and firm persuasion of our salvation, which is like, as it were, the foundation of all, instead of relying on his pure mercy, in order to have our consciences at rest, and give to him the glory which appertains to him, we were taught, like the rest of the world, to put our trust partly in ourselves, and partly in other creatures. There is no need, however, to rehearse all the rest, for there would be no end of that. For, in short, it has come to this, that the grace of Jesus Christ was, as it were, buried out of sight to us. When we have understood so much, and that it has been clearly proven to us, that all that was abomination in the sight of God, what could we have done? Were we to withstand God, and to resist his truth? Had it merely been a matter of Church order, if it had been at all bearable, we might have been content to remain, but it was such a Babel of confusion and disorder, that there remained no other remedy but that of an entire renovation. What shall we say of the Sacraments, the observance and use of which had been altogether perverted from the ordinance of Jesus Christ our Lord? How many silly baptismal ceremonies had been sought out and invented by men, without the authority of God! And what is worse, the true and pure institution of our Lord was, as it were, abolished by such frivolous patchwork. In short, they set a greater value upon the anointing chrism than the water, and at present it seems to be a settled point with you, that our baptism is null, because we have only retained what the Lord has commanded, and what the Apostles have observed and held fast in practice. As for the holy Supper, it has been much more profaned. Our Lord has left us that as a pledge, on purpose that (we might be) certain that our souls are nourished from his body and from his blood, to make us partakers of all his benefits, and peculiarly so of his death and passion. In order that we may do this, we ought to distribute it according to the terms of his commandment, namely, in declaring the worth and efficacy of the mystery. On the contrary, they have converted it into a sacrifice, to make reconciliation anew with God by man’s work, and not for the living only, but also for the dead. The priest, to make what he considers a due use of the sacrament, separates himself from the Church. The whole is done and spoken in an unknown language, after the manner of enchanters with their charms. When Easter comes, again they only give to the people the half of the sacrament, depriving them of the cup, against the express command of the Master. To consent to such sacrilege as that, is not even to be thought of. And yet, nevertheless, they reproach us with having let down and abased this holy sacrament. But the thing speaks for itself, that we have restored it in complete integrity, where it had been corrupted and polluted in so many ways. St. Paul, wishing to correct an abuse which had grown up among the Corinthians in reference to this sacrament, sends them back to the first institution of the ordinance by the Lord himself, as to an inviolable statute. (1 Cor. 11) What could we do, then, to correct the infinite abuses with which it had been contaminated, except to follow that same rule? Let them shew us, if they can, if there be anything in the manner of our worship which is not conformable to the institution of our Lord, to the usage of the Apostles, and we are ready to amend our fault. But when they accuse us without either rhyme or reason, that will not in the least disturb or excite us, so as to make us renounce the true and settled institution. Wherefore, that which you impute to us as a fault, we hold and take to be a work of God, the best which we had been able to attain to. Yet nevertheless, we do not deny that we have come very far short in many respects, for which our Lord has good right to punish us, but it is in regard that our life does not correspond with his holy doctrine of which we make a profession.</p></blockquote>

<blockquote><p>I shall therefore a little further explain this distinction and then show you the soundness of it, and then the exceeding usefulness and necessity of it, both in this and many other controversies:

1. For the title I choose rather to denominate it from the object than the act, because the diversity is in the object, but none in the species of the act naturally considered: Debitum and natural being are two distinct things; but ‘to will’ one and ‘to will’ the other is all one as to the nature of willing. God does as properly will duty as He wills natural beings. Yet if I must denominate it from the acts, I would distinguish between God’s Directive Will and his Legislative. For to call it voluntas praecepti is too narrow a term, for the precept is but one part of God’s Law and determines only of one sort of right, that is, of the dueness of obediential actions or forbearance of forbidden actions. But there is also a debitum praemii et beneficii–pure vel absolute–dati, et debitum poenae [debt of reward and benefit, whether purely or absolutely given, and a debt of punishment], which the rest of the Law, Testament or Covenant of God determines of, which must all be here included as well as the former. In sum, the Law determines:

1. What shall be due from us; 2. and what shall be due to us, and on what terms. I call it therefore, The will of God de eventu, et de debito [of event, and of debt], as such. I say ‘as such,’ for else they are coincident: For God’s will de rerum natura, vel existentia determines de debito quatenus evenit esse debitum [determines the nature or existence of things, and debt so far as debt comes about], but not qua debitum [as debt]. And his will de debito determines of the dueness of some events, not as eventual [as to the event], but as due. Or to avoid all ambiguity: call it God’s will de ente mere naturali [concerning merely natural being] and his will de debito morali [concerning moral debt], or Legislative or Governing.

2. And for the nature of the distinction, understand further that there are two acts which I call God’s will de debito: The first is that immanent act of his will by which He strictly and properly wills what shall be due. This also is twofold:

1. Productive, or instituting dueness; 2. and approbative, or taking complacency in duty. The former of these I principally intend, but exclude not the latter. God does eternally will every due, but it is not therefore eternally or from eternity due. For He wills from eternity (to speak vulgarly) only that this shall be due at such a time and by such a means. I say by such means: For though God’s will produce all dueness, yet only by means does He produce it. That means is the revelation of his will.

2. This revelation of God’s will de debito we call his Law. This therefore is the second thing which I call God’s will de debito, or his Legislative will, that is, the Law as it is signum voluntatis divinae [a sign of the divine will], that is, formally as a law. This I call God’s will de debito, only metonymically, as it is the sign of his will before expressed. If the proper will of God were separated from this, it would then be no producer of dueness or right at all, for it would be no law, no signum; it would lose its nature as abrogated laws do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Universal Redemption of Mankind by the Lord Jesus Christ Stated &amp; Cleared</cite>, … (London: Salusbury, 1694), ch. 2, pp. 28-32</span></figcaption>

<blockquote><p>Answer… It is blasphemy to seek this distinction of person and office in the King of kings, because by person in a mortal king, we understand a man that can sin.

1. I am not obliged to obey his [the king’s] personal commandment, except I were his domestic [servant], nor his unlawful personal commandments, because they are sinful.

2. It is false that you obey the king’s law because you obey the king; for then you say but this: ‘I obey the king because I obey the king.’ The truth is, obedience is not formally terminated on the person of the king. Obedience is relative to a precept, and it is men-service to obey a law, not because it is good and just, but upon this formal motive, because it is the will of a mortal man to command it. And reverence, love, fear, being acts of the affection, are not terminated on a law, but properly on the person of the judge; and they are modifications, or laudable qualifications of acts of obedience, not motives, not the formal reason why I obey, but the manner how I obey. And the apostle makes expressly fear of punishment a motive of obedience (Rom. 13:4), while he says, “He beareth not the sword in vain,” therefore be subject to the king; and this hinders not personal resistance to unjust commandments. … Answer.

1. To obey the king’s personal will when it is sinful (as we now suppose), against his legal will, is a sin and a disobedience to God and the king also, seeing the law is the king’s will as king; but to obey his legal will against his sinful personal will (as it must be sinful if contrary to a just law) is obedience to the king as king, and so obedience to God.

2. You take the king’s person to be himself, but you take quid pro quo [this for that]; for his ‘person’ here, you must not take physically for his suppost [agent] of soul and body, but morally: it is the king as a sinful man, doing his worst will against the law, which is his just and best will and the rule of the subjects. And the king’s personal will is so far just and to regulate the subjects insofar as it agrees with his legal will or his law, and this [personal] will can sin, and therefore may be crossed without breach of the Fifth Commandment; but his legal will cannot be crossed without disobedience both to God and the king. … Answer… We are to obey the king’s personal will when the thing commanded is not sin; but his subjects, as subjects, have little to do with his personal will in that notion. It concerns his domestic servant, and is the king’s will as he is the master of servants, not as he is king in relation to subjects; But we speak of the king’s personal will as repugnant to law and contrary to the king’s will as king, and so contrary to the Fifth Commandment; and this [personal will] is attended often not only with passion, but also with prejudice; and we owe no subjection to prejudice and passions, or to actions commanded by these disordered powers, because they are not from God, nor his ordinances, but from men and the flesh, and we owe no subjection to the flesh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, … (1644; Edinburgh: Ogle, 1843), p. 150. Rutherford is responding to the royalist, Symmons.</span></figcaption>

e+the+king%E2%80%99s+person+to+be+himself%2C+but+you+take+quid+pro+quo+%5Bthis+for+that%5D%3B+for+his+%E2%80%98person%E2%80%99+here%2C+you+must+not+take+physically+for+his+suppost+%5Bagent%5D+of+soul+and+body%2C+but+morally%3A+it+is+the+king+as+a+sinful+man%2C+doing+his+worst+will+against+the+law%2C+which+is+his+just+and+best+will+and+the+rule+of+the+subjects.+And+the+king%E2%80%99s+personal+will+is+so+far+just+and+to+regulate+the+subjects+insofar+as+it+agrees+with+his+legal+will+or+his+law%2C+and+this+%5Bpersonal%5D+will+can+sin%2C+and+therefore+may+be+crossed+without+breach+of+the+Fifth+Commandment%3B+but+his+legal+will+cannot+be+crossed+without+disobedience+both+to+God+and+the+king.+%E2%80%A6+Answer%E2%80%A6+We+are+to+obey+the+king%E2%80%99s+personal+will+when+the+thing+commanded+is+not+sin%3B+but+his+subjects%2C+as+subjects%2C+have+little+to+do+with+his+personal+will+in+that+notion.+It+concerns+his+domestic+servant%2C+and+is+the+king%E2%80%99s+will+as+he+is+the+master+of+servants%2C+not+as+he+is+king+in+relation+to+subjects%3B+But+we+speak+of+the+king%E2%80%99s+personal+will+as+repugnant+to+law+and+contrary+to+the+king%E2%80%99s+will+as+king%2C+and+so+contrary+to+the+Fifth+Commandment%3B+and+this+%5Bpersonal+will%5D+is+attended+often+not+only+with+passion%2C+but+also+with+prejudice%3B+and+we+owe+no+subjection+to+prejudice+and+passions%2C+or+to+actions+commanded+by+these+disordered+powers%2C+because+they+are+not+from+God%2C+nor+his+ordinances%2C+but+from+men+and+the+flesh%2C+and+we+owe+no+subjection+to+the+flesh.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Lex+Rex%2C+%E2%80%A6+%281644%3B+Edinburgh%3A+Ogle%2C+1843%29%2C+p.+150.+Rutherford+is+responding+to+the+royalist%2C+Symmons.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbd9b8b3b09.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bd9b8b3b09.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-arbitrary-laws-commands/#:~:text=It%20is%20blasphemy%20to%20seek%20this,owe%20no%20subjection%20to%20the%20flesh&amp;text=It%20is%20blasphemy%20to%20seek%20this%20distinction%20of&amp;text=and%20we%20owe%20no%20subjection%20to%20the%20flesh" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…for you lay down as an undeniable principle, and the basis of your whole doctrine of independent government that there are no visible Churches in the world but a congregation meeting in one place to worship God, which I have demonstrated to be most false… so, though a congregation may only be actually seen when it is convened within the four angles of a material house, yet all the congregations on earth make one visible Church, and have some visible and audible acts of external government common to all, as that all pray, praise, fast, mourn, rejoice, one with another; and are to rebuke, exhort, comfort one another and to censure one another, so far as is possible, and of right and by law meet in one council, and so by Christ’s institution are that way visible, that a single congegation is visible which meets in one house, though many be absent de facto, through sickness, callings, imprisonment and some through sinful neglect;</p></blockquote>

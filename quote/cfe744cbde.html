<main class="wrap"><figure class="quote" id="q-cfe744cbde" data-kw="">
<blockquote><p>And the Decalogue, or Ten Commandments, is a summary or brief epitome of those laws, written by the immediate finger of God: and contracted into so short an abridgement, not only to ease our memories, but to gain our veneration; for sententious commands are best befitting Majesty. And, indeed, if we consider the paucity of the expressions, and yet the copiousness and variety of the matter contained in them, we must needs acknowledge, not only their authority to be divine, but likewise the skill and art in reducing the Whole Duty of Man to so brief a compendium. … The rest of the Scripture is but a commentary upon them: either exhorting us to obedience, by arguments; or alluring us to it, by promises; or frightening us from transgressing, by threatenings: or exciting us to the one, and restraining us from the other, by examples recorded in the historical part of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition on the Ten Commandments: With Other Sermons</cite>, (London, 1692), pp 24-25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

<blockquote><p>Many arguments prove the existence of such a natural law. First, the voice of Scripture asserts that “the Gentiles which have not the law” (to wit, the written law of Moses) as the Jews “do by nature the things contained in the law, and are a law unto themselves: since they show the work of the law written in their hearts, their conscience also bearing witness, and their thoughts the meanwhile accusing or else excusing one another” (Rom. 2:14, 15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.1.12</span></figcaption>

<blockquote><p>(2) To LOVE anything more than God, is to make it a god. If we love our ESTATE more than God, we make it a god.… The covetous man is called an idolater. Eph 5:5. Why so? Because he loves his estate more than God, and so makes it his god. Though he does not bow down to an idol, if he worships the engraved image in his coins, he is an idolater. That which has most of the heart, we make a god of. If we love our PLEASURE more than God, we make a god of it.… If we love our BELLY more than God, we make a god of it. “Whose god is their belly.” Phil 3:19.… But to mind nothing but the indulging of the appetite, is idolatry.… If we love a CHILD more than God, we make a god of it.… This is to make an idol of a child, and to set it in God’s place. Thus God is often provoked to take away our children. If we love the jewel more than him who gave it, God will take away the jewel, that our love may return to him again.</p></blockquote>

<blockquote><p>9. From this speciall and proper way of governing reasonable Creatures, there ariseth that covenant, which is between God and them. For this covenant is as it were a certaine transaction of God with the Creature, whereby God commandeth, promiseth, threatneth, fulfilleth, and the Creature doth tie it selfe in obedience to God thus covenanting. Deut. 26. 16, 17, 18, 19. This day Jehova thy God commandeth thee. &amp;c. Thou hast avouched this day the Lord to be thy God, &amp;c. Jehova hath avouched thee this day, &amp;c. To make thee high, &amp;c. And that thou mayest be an holy people, &amp;c.

10. Now because this way of entring into covenant is not between those that are equall, but between Lord and servant. Therefore it pertaines to government, whence also it is most properly called not the covenant of man, but of God, who is the author, and chiefe Executor of it. Deut. 8. 17. 18. That he may performe his covenant.

11. By vertue of this covenant the morall workes of the intelligent Creature, whilst he is in the way, have alwayes a respect, either to happinesse as a reward, of to unhappinesse as a punishment: but in the last there is meriting, but in the other not.

12. Hence the proper and highest difference of a good work and sinne doth flow, namely in that a good worke is an operation expecting happinesse of another by way of reward: as by the opposite privation of it, evill workes are made in their kind extreamly evill.

13. Hence ariseth the force &amp; reason of conscience, which is the judgement of an intelligent Creature of it selfe, as he is subjected to God.

14. Speciall government of the reasonable Creature is of Angels and men.

15. Speciall government of Angels, is either a speciall prescription, or ordering the event that followes upon it.

16. This was the same Law as touching the substance, with the morall Law which is contained in the Decalogue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Sacred Divinity Drawn out of the Holy Scriptures, and the Interpreters thereof, and brought into Method</cite>, (1642 edn), 51–52.</span></figcaption>

<blockquote><p>Nom. Did he break all the commandments, say you? Sir, I beseech you shew me wherein.

Evan. 1. He chose himself another God when he follows the devil.

2. He idolized and deified his own belly; as the apostle’s phrase is, “He made his belly his God.”

3. He took the name of God in vain, when he believed him not.

4. He kept not the rest and estate wherein God had set him.

5. He dishonoured his Father who was in heaven; and therefore his days were not prolonged in that land which the Lord his God had given him.

6. He massacred himself and all his posterity.

7. From Eve he was a virgin, but in eyes and mind he committed spiritual fornication.

8. He stole, like Achan, that which God had set aside not to be meddled with; and this his stealth is that which troubles all Israel :— the whole world.

9. He bear witness against God, when he believed the witness of the devil before him.

10. He coveted an evil covetousness, like Ammon, which cost him his life, and all his progeny. Now, whosoever considers what a nest of evils here were committed at one blow, must needs, with Musculus, see our case to be such, that we are compelled every way to commend the justice of God, and to condemn the sin of our first parents, saying concerning all mankind, as the prophet Hosea does concerning Israel, “Israel, thou hast destroyed thyself,” Hos. xiii. 9.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9170246cd4" data-kw="">
<blockquote><p>...it is a dreadful sin to depart from the church for the purpose of establishing one which is better, for the church is one, being the body of Christ. To separate ourselves from the church is to separate from the people of Christ and thus from His body, thereby withdrawing from the confession of Christ and departing from the fellowship of the saints. If we indeed deem the church to be what she really is, we shall then cause schism in the body of Christ, grieve the godly, offend others, give cause for the blaspheming of God‟s Name, and cause the common church member to err. By maintaining that the church is no church, we thereby deny the church of Christ, and therefore are also guilty of the sins just mentioned. We thereby displease God, who will not leave this unavenged, regardless of how much we please and flatter ourselves. Such activity the apostle opposes when he refers to such individuals as being carnal in 1 Cor 3:1, 3. He warns against this when he writes, “Now I beseech you, brethren, by the name of our Lord Jesus Christ, that ye all speak the same thing, and that there be no divisions among you” (1 Cor 1:10); “I hear that there be divisions among you” (1 Cor 11:18).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, pp. 61-62</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

ng%20you%E2%80%9D%20%281%20Cor%2011%3A18" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-8b60e1e0ff" data-kw="">
<blockquote><p>That Scripture, Rom. 16:17, does not command us to avoid everyone that causes divisions and offenses occasionally and passively, by giving the first rise to divisions by offensive courses; for that way divisions may be caused by infirmities and a man’s using his own light, and by the offense of others, whom upon that account to avoid, were contrary to the same apostle’s doctrine in that same epistle, chs. 14 and 15. But it commands us to avoid them which cause divisions and offenses actively, designedly and purposely, and do promote and abet a downright schism, and will not be persuaded to let divisions fall, though it may be done without prejudice to truth. Next, to “avoid,” there is the same with the duty of turning away, 2 Tim. 3:5, extended there to self-lovers, covetous proud, unholy, having a form of godliness without the power. This cannot be interpreted always and only of withdrawing from Church-communion; for then we must withdraw from all that are self-lovers, from all that are unholy, from all that are hypocrites, which none will affirm: But we may avoid men several other ways, by withdrawing from personal communion with them, or familiar converse, and from communion in their corrupt designs and courses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

<blockquote><p>…Monmouth gave the order [to the government troops] to advance. His prime objective was control of the bridge separating the two sides… When their [the covenanters’] ammunition gave out, they sent for fresh supplies, but Hamilton, instead of sending them the help they requested, ordered them back to the main body of the army. Whether this was because no supplies were available, or for some other reason, has never been satisfactorily explained, and even the most sympathetic commentators have found it difficult to justify Hamilton’s action.</p></blockquote>

<blockquote><p>…they [the Protesters] have learned to distinguish betwixt the government of the Church, and the male-administrations and corruptions of the Church-governors; and not to condemn the one when they are necessarily called to give a testimony against the other; Yea, the duty and care they owe to the preservation of the government constrains them to testify against the abusing and corrupting of it: So did our fathers of old, whose protestations against corrupt national Church assemblies are upon record to this day, and so far have they been by men of sound judgments, from being judged because thereof to be against the government, that they are honoured amongst the greatest patrons and preservers thereof… …neither do they [the Protesters] think that testifying against the corruptions of many of these that are now in the exercise of the government of the Church, is to dissent from, or to do injury to the government itself;</p></blockquote>

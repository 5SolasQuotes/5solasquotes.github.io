<main class="wrap"><figure class="quote" id="q-201763f59f" data-kw="">
<blockquote><p>How then holds the difference assigned by the Apostle, between the Worker and the Believer in the manner of obtaining Righteousness? How sets he the Worker and Believer in direct opposition in the point of Justification? How doth he describe the righteousness of the Believer to be without works, Rom. 4, 5, 6 The Lord imputeth righteousness without works; And what righteousness can that be? Inherent righteousness it cannot be, for that is not without works, it must needs therefore be Christs righteousness, according as it is said, By the obedience of one many are made righteous; Christ’s righteousness is made ours of God; 2 Cor. 5.21. We are made the righteousness of God in him (that is) righteous by such a righteousness, as God requireth and imputeth to us. Thirdly, Lastly, whatsoever may occasion boasting in man is excluded, Rom. 3.27. Now as great occasion of boasting is left to man in the act of Faith, and its Obedience, as in any work of the Law whatsoever, inasmuch as according to these men’s doctrine, these would believe; others would not, though they had the same helps and means.

Note this therefore for conclusion of this point, that the Grace of the new Covenant does not stand in this, that God accepts our imperfect obedience loco impletionis totius legis, that God accepts a Pepper corn instead of his full Rent, as Mr. Baxter glosseth it, a jejune and empty conceit of so high a mystery. But that glorious rich magnificent Grace of the Gospel, so much magnified and exalted by the Apostle to the praise and glory of God’s rich mercy and love to mankind, stands in this, that whereas God’s justice doth require full satisfaction; and he in justice might have required the same at our hands; he hath provided the Price, and accepts the full payment at the hands of our Mediator.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-lyford.html">William Lyford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The plain man’s senses exercised to discern both good and evil, or, A discovery of the errors, heresies, and blasphemies of these times and the toleration of them, as they are collected and testified against by the ministers of London, in their testimony to the truth of Jesus Christ</cite>, (London: Richard Royston, 1655), p. 326.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a5833f0a1f" data-kw="">
<blockquote><p>Would ye then obtain justification in Christ? You must previously possess Christ. But you cannot possess him without being made a partaker of his sanctification: for Christ cannot be divided. Since the Lord, therefore, does not grant us the enjoyment of these blessings without bestowing himself, he bestows both at once but never the one without the other. Thus it appears how true it is that we are justified not without, and yet not by works, since in the participation of Christ, by which we are justified, is contained not less sanctification than justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.16.1</span></figcaption>

</figure><figure class="quote" id="q-ff7932509f" data-kw="">
<blockquote><p>1. There are some men who object to all authorized creeds and articles of faith whatsoever, on the ground that they make the name of Christian and the advantages of Christian fellowship dependent on assent to certain positive truths or dogmas, whether more or fewer. There are some writers in the present day who hold the extreme position, that a man may be fully entitled to call himself a Christian, although he does not believe a single fact or doctrine of Christianity, although he denies the historical existence of the Christ of the Gospels, and the Divine origin of the system which He founded. “To declare any one unworthy of the name of Christian,” says Blanco White, “because he does not agree with your belief, is to fall into the intolerance of the articled Churches. The moment that the name Christian is made necessarily to contain its signification belief in certain historical or metaphysical propositions, that moment the name itself becomes a creed: the length of that creed is of little consequence.… No man has a right to reject another from the Christian union on account of any abstract opinion whatever.” “A total disbelief of miracles and prophecy,” observes Mr. Hennel in his Christian Theism, “no more disqualifies a man for bearing with propriety and consistency the Christian name, than any other deduction from the exuberant belief which places Christ in the Triune Godhead.” Upon views such as these it is not needful to dwell.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ</cite>, vol. 1 (Edinburgh: T&amp;T Clark, 1868), 316–17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-ce76bf1039" data-kw="">
<blockquote><p>First of all, the style of this epistle to the Galatians is excited and vibrant, which is what the state of the church, which at that time was bewitched by false apostles, demanded. But this epistle has always been a favourite of the great men of the church, and justifiably so.

Jerome was not slow to follow Origen, and after him came Augustine and a host of others. Luther wrote two commentaries on it … which he explained by saying that the greatest danger was that the devil would crush the pure doctrine of faith and bring back false teachings about the merits of works, which sound good and are satisfying to the flesh.

Even when the apostles were still living their churches were not free of such tares. It is impossible to overstate the degree to which human minds are subject to vanity and emptiness, how great is their desire for novelty and how easily people tire of the plain and simple doctrine of the truth. How great and unquenchable too is the hatred of the devil for the gospel and the doctrine of faith, by which he sees his kingdom being destroyed and the rule of Christ, who reigns in our hearts by faith, ushered in instead. …

The apostle himself shows us how necessary the article on true justification is, because if that is left out, Christ disappears, as does Christian freedom and all assurance in life and death, nor is it possible to receive the Holy Spirit of sanctification, who is the source of all good works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-tossanus.html">Daniel Tossanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Opera Theologica II, quod Commentarios in Reliquos Divi Pauli Aliorumque Aposolorum Epistolas Continent</cite>, (Hanau, 1604). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), pp 4-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-cdab6e30b1" data-kw="">
<blockquote><p>4. The Holy Ghost speaks generally of all men, whether regenerate or unregenerate, and of all works, whether going before faith or following it, that a man, that is, every one, who is justified, is justified by faith without the works of the law, Rom. 3:28, that a man is not justified (that is, that no man is justified) by the works of the Law, but by the faith of Jesus Christ, for by the works of the Law no flesh, that is, as the Psalmist speaks, no man living shall be justified, Gal. 2:16. For as in the first act of justification we are justified by faith without respect of works, so our justification is continued unto us without respect of our works. And this appears most plainly in the examples of Abraham, of Job, of David, of Paul, etc. as I showed before, who, though they abounded with good works which they wrought by faith, yet were not justified by them, but by faith only. For that which Chrysostom says of Abraham is also verified of all the godly: for, says he, that a man having not works should be justified by faith, it is no unlikely thing: [Greek], but this, that a man flourishing in good works, should not thereby be justified, but by faith, it was wonderful, and very much sets forth the force of faith.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-d43bc1cc26" data-kw="">
<blockquote><p>From these things, what they object to the contrary can be dealt with easily, namely: (1) The primary-first motions of sins or of concupiscence, although they lack prior consent, nevertheless do not lack all consent. (2) That man is a rational being. For it does not follow from this that all his acts are rational or voluntary. For there are also natural acts, such as falling down, and those things for example that are committed during sleep. I would not say that all acts of the will flow from the prior consent of the will; it is sufficient that they have concomitant consent. This can also be responded regarding original sin: for that also has the concomitant consent of the will, although it does not have antecedent consent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (RHB), vol. 3, bk. 4, ch. 2 | section 22, pp. 458-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1aaeedfdf5" data-kw="infants original sin">
<blockquote><p>From Ps. 51:5—“Behold, I was shapen in iniquity, and in sin did my mother conceive me.” David, by ascending from the consideration of actual sin committed by him to the first taint of evil, confesses before God that he was corrupt even from the womb and inclined to sin. Hence an invincible argument flows for original sin. One conceived in iniquity and nourished in sin cannot be without original sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.10.10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a> › <a href="../topics/sin/original-sin/original-sin-in-infants.html">Original sin in infants</a></span><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a> › <a href="../topics/sin/original-sin/imputation-of-adams-sin.html">Imputation of Adam&#x27;s sin</a></span></div>

</figure><figure class="quote" id="q-8fdd55acae" data-kw="">
<blockquote><p>Wherefore, just as the eggs of an asp, which have harmed no one, are rightly crushed, so infants are rightly subject to punishment on account of that inherent and death-bringing pestilence, by which they are prone to evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Untying of Grave Questions</cite>, ch. 1, ‘In which the question is examined, whether there is original sin, in whom it exists, and whether it is removed by Baptism. Only Christ is excepted from this stain. Not even the Virgin Mary was immune from it’ in An Untying of Grave Questions (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, trans. AI Latin, p. 24</span></figcaption>

</figure><figure class="quote" id="q-21e37df4ec" data-kw="">
<blockquote><p>…by reason of original sin it is, that a natural man cannot perform anything in a gracious manner, to wit, for want [lack] of the love of God: Original sin being an habitual aversion from God and conversion unto the creature, or more briefly an inordinate conversing with the creature, either in enjoying it, whereas he should only use it, God alone being to be enjoyed; or in using it, but not in a gracious manner, that is, not for God;s sake; to wit, through want of the love of God, which is brought upon us by the sin of Adam, as whereby our natures were bereaved of the Spirit of God. Thus in prosecuting mine answer unto a devised argument, I have made bold to open my mind concerning original sin: A point that has seemed unto me of such difficulty that I have been wont to range it amongst those three [things] whereabouts I could not expect to be satisfied whilst I lived.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, (London: J.D., 1646), 3rd Doubt, p. 148</span></figcaption>

</figure><figure class="quote" id="q-9b230d1369" data-kw="seat">
<blockquote><p>Whatever is anomon (“lawless” in the abstract) or anomia (“lawlessness”) is really sin, but not forthwith what is called “lawless” (anomon) in the concrete because it has sin in itself. In this sense, human nature is called “lawless” (anomos); not that it is sin itself, but because having sin in itself it is well called “sinful.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.11</span></figcaption>

<blockquote><p>No one can merit the initial grace which is at the origin of conversion. Moved by the Holy Spirit, we can merit for ourselves and for others all the graces needed to attain eternal life, as well as necessary temporal goods.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/catholic-church.html">Catholic Church</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catechism of the Catholic Church</cite>, §2027</span></figcaption>

</figure><figure class="quote" id="q-d8aa891617" data-kw="">
<blockquote><p>Therefore the Papists err grievously when they confuse works taken generally with merits, and as soon as they hear of a pious work being commanded, immediately understand merit and a work spoken of in a legal sense. Likewise, when they hear that a reward is promised, they again understand it juridically and legally, as in some contract of hiring and payment; whereas reward is commonly called whatever we obtain after preceding labor and difficulties, whose fear might have deterred us from a good purpose, and which are compensated by the sweetness of the good that follows. Such are not only: (1) the rendering of a good to which a preceding work corresponds in equal worth (that is, merit of condignity)… … (3) Likewise, the execution of a promise made under a condition—not only of gratefully accepting and not despising the gift (for no donation is so free and pure as not to include this condition), but also of a certain work, besides acceptance and gratitude, required in addition—which therefore is in some sense meritorious, although there is perhaps no equality or commutation between the work and the promised reward; as if a father promises a jewel to his son who takes bitter medicine, or a prince promises a prize to a subject engaged in an exercise or contest beneficial to him. In this case, the donation is not purely free, since the thing does not begin to be owed as soon as the promise is accepted, but only when the condition is fulfilled; nor is it properly merit of condignity, since the worker benefits himself rather than giving something to another for which he ought to receive an equal price. Hence again it effects nothing properly by its own virtue or dignity, but only from the liberality, magnificence, and mercy of the giver, or of one interceding with him. Yet it is a certain merit improperly so called, which they call merit by covenant. Something of this kind, with respect to good works in the children of God, to whom God has promised rewards, is admitted by the Apology of the Augsburg Confession [written by Philip Melanchthon] in response to the argument—although others, on account of the ambiguity and great abuse of the term “merit,” not without reason reject it altogether. [4] Another [kind of merit] is what they call merit of congruity [or proportion], which either seems not to signify merit at all, or involves a contradiction, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/conrad-bergius.html">Conrad Bergius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Praexi Cathol. Divin. Canon., Dissertation 7</cite>, pp. 963-64 as the Latin is in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 364, trans. ChatGPT-5 Bergius (1544-1592) was a German reformed theologian.</span></figcaption>

<blockquote><p>43. What is the connection of the exaltation of the Mediator to His humiliation? The connection of legal consequence. Christ is Mediator not as a private person but as an official person, as Head of His members. Hence He must receive the fruits of His merits in Himself. And as He did not suffer for Himself, so too He was not glorified for Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Ch. 5, ‘States’, #43, p. 218 in Reformed Dogmatics, vol. 3, Christology (Lexham Press, 2014)</span></figcaption>

</figure><figure class="quote" id="q-26878d10ee" data-kw="">
<blockquote><p>There follows the other part of the disputation on merit, in which we must discuss “what and how many conditions are necessary for a work to be called truly and properly meritorious of eternal happiness.” … Seven conditions in all seem to be required, three of which are granted by all, while the other four are in controversy. The first condition is that it be a good work. For evil works do indeed merit, but punishment, not reward. … The second condition is that the good work be done in obedience to God. For merit implies a relation to a reward to be received from another; hence he who merits, merits with someone. The third, that he who merits be a wayfarer. For in this life is the race and the battle; in the next, the prize and the crown. … The fourth, that the work be not only good but also free. The fifth, that he who merits be a friend of God and pleasing to him. The sixth, that a promise intervene. The seventh, that the work proceed from the virtue of charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.10 (translated from the Latin)</span></figcaption>

<main class="wrap"><figure class="quote" id="q-537ce0a611" data-kw="">
<blockquote><p>Where such sins are made the condition of ministration by men in power, as that all the whole ministry of a kingdom are bound in conscience to deny consent and conformity thereto [such as in 1662 in England], it is the duty of all the ministry in primo instante [‘in the first instance’], to forbear their ministerial office or [for] none [of them to do so]; for the reason is the same to all. For example: If ten or twenty untrue or unrighteous forbidden things must be subscribed, declared, covenanted or sworn, or as many sins practiced, yea were it but one, no doubt but the whole ministry is bound to deny conformity to any one such thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), sect. 6, p, 114</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bda0dba676" data-kw="">
<blockquote><p>If [as Thomas Hooker says,] ‘the laying on of hands be no specificating act of an office, because it is used in other performances, as in the sending of Paul and Barnabas to preach to the Gentiles, Acts 13,’ then shall water not be essential to baptism, nor drinking to the Lord’s Supper, nor blessing sacramental in that Supper, because in Levitical washings, in the feasts-sacred, in the Passover, in praying for a blessing to the Word preached, all these were used. It’s loose logic, a genere ad speciem [a genus to the species]; the question is not of laying on of hands in general, but of a certain kind and species of laying on of hands by way of prayer and designation. Mr. Rutherford knows there be diverse kinds of laying on of hands. 2. Nor do I say that the rite is essential to ordination, but of the necessity of before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), pp. 428-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-a860c4a2df" data-kw="">
<blockquote><p>We are all naturally inclined to lean upon man whom we can see, rather than upon God whom we cannot see. We naturally love to lean upon the ministers of the visible Church, rather than upon the Lord Jesus Christ, the great Shepherd and High Priest, who is invisible. We need to be continually warned and set on our guard. I see this tendency to lean on man everywhere. I know no branch of the Protestant Church of Christ which does not require to be cautioned upon the point…. We all naturally love to have a pope of our own. We are far too ready to think, that because some great minister or some learned man says a thing, or because our own minister, whom we love, says a thing—that it must be right, without examining whether it is in Scripture or not. Most men dislike the trouble of thinking for themselves. They like following a leader. They are like sheep, when one goes over the hill all the rest follow.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Warning to the Churches, ‘The Fallibility of Ministers’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

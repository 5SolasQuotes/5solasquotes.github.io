<main class="wrap"><figure class="quote" id="q-c43aa0dda8" data-kw="">
<blockquote><p>Dr COOKE … He had no doubt that there might be a number of little coteries assembled round dinner tables and tea tables, who united the cup of temperance with the enjoyment of intemperance of the tongue, and who, while they remember that a man should govern his appetite, forget that a man is equally bound to govern his tongue, and that it is not Christian, having heard an evil report, to take it up and cast it abroad, to the ruin of a brother’s character.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-cooke.html">Henry Cooke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Banner of Ulster</cite>, 2 July 1850.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4f4d498e05" data-kw="">
<blockquote><p>‘Alas, this business is beyond my strength, I cannot change mine own heart; though there are encouragements and helps, I know not which way to go, nor how to plead them.’ Well, but is the Spirit of God able to quicken thee, and to teach thee, and to enable thee? He stands especially engaged, ’tis his immediate work to prevail upon the heart. Go to the Spirit, and beg of Him, that He would lead thee to the Father, and to Christ, that thou mayst have fellowship with the Father and the Son. ‘Alas, I cannot go unto the Spirit, I have so long resisted Him, so often grieved Him, with what face can I go? I am unworthy of his guidance.’ Well, but Jesus Christ stands engaged; and never speak of merit that day thou speakest of Christ. Go to Christ, and beg that He would send his Spirit into thy heart. Jesus Christ is thy Kinsman, he knows how to pity thee; and the Spirit of Grace is at his dispose. Oh then go to Christ. ‘Alas, I cannot go to Christ, I have no ability to go, nor so much as a will to move towards Him. I cannot go to Christ.’ Well, but the Father is engaged to draw thee, though thou canst not go; a man may be drawn, which has no natural willingness of his own. The Father stands engaged to change the will, and absolute promises are theirs that lay claim to them (provided they do not overthrow their own claim). Go therefore and tell the Father thy case.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f966c5e672" data-kw="">
<blockquote><p>Secondly, Those who have not as yet received Christ to dwell in them are to be moved, as they desire Heaven’s glory hereafter and the comfortable hopes of it here upon earth, to give entertainment unto Jesus Chist. Zacchaeus upon a hint given of Christ’s willingness to come into his house, comes down out of the sycamore tree quickly, and receives him joyfully (Lk. 19:4). Now do you with seriousness consider with what 1. importunity, 2. patience, 3. and promises the Lord Jesus calls upon you for entertainment. ‘Behold, I stand at the door and knock, if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ (Rev. 3:20)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simeon-ashe.html">Simeon Ashe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Riches of the Gospel &amp; the Hope of Christians, a Sermon</cite>, … (London, A.M., 1654), p. 32</span></figcaption>

<blockquote><p>2. He has a love, not only of benevolence, but of beneficence; He not only wishes you well, but does well unto you. O Sirs! many a good turn has He done you, particularly you who are members of the visible church; He gives you line upon line, precept upon precept; He makes you to hear the joyful sound, the voice of the turtle[-dove]; many a minister has He sent you; many an offer of Christ, and of life through Him, has He made to you; many a time has He knocked at thy door, by word, by conscience, and the motions and whispers of his Spirit; so that He may say to us, as He did of his vineyard, Isa. 5:4, “What could have been done more for them, that I have not done?”… Thus, I say, God’s love of benevolence and beneficence is, in some respects, extended unto all.</p></blockquote>

</figure><figure class="quote" id="q-1aa5655632" data-kw="">
<blockquote><p>He tarries the sinner’s leisure till the day of patience be quite spent ere [before] He executes this threatening of the new covenant; and offers men all this while many helps and advantages, enticing them by his mercies, awing them by his judgments, persuading them by his Word, drawing them by his Spirit, knocking at the door of their hearts by the serious impressions of his grace, and awakening them by the stings and checks of their own consciences; all which are so many signs and evidences that He takes no pleasure in the death of sinners, as the prejudiced world thinks, but does all that becomes Him to do, as a prudent and gracious lawgiver (though not all that He could do as an almighty God) and sovereign disposer of his grace;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 21, Two sermons on Eze. 18:23, Sermon 1, pp. 463-79</span></figcaption>

</figure><figure class="quote" id="q-13bbb190bd" data-kw="">
<blockquote><p>20. ‘Behold, I stand at the door, and knock: if any man hear my voice, and open the door, I will come in to him, and will sup with him, and he with Me.’ 20. I have my time of offering mercy, and desiring you to entertain it: And if any man hear and obey this call, I will come in by my Spirit, and take habitual possession of him, and have spiritual communion with him, and he with Me. Note: Though it be not without the grace of Christ that we open to him when He knocks, and receive his offered special grace, yet, in this, He lays so much on man as to make our opening, that is, our accepting-faith, the condition of his entering for a fixed habitation by habitual love and holiness. On which account divines used to say that faith and repentance, wrought first in conversion, are the conditions or qualifications for consequent justification and sanctification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Paraphrase on the New Testament with Notes, Doctrinal &amp; Practical</cite>, ... (1685), on Rev. 3, verse 20</span></figcaption>

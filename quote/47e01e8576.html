<blockquote><p>5. Voluntatas absoluta and voluntas conditionata. The distinction between decretive and perceptive will, voluntas beneplaciti and voluntas signi, relates also to a distinction between absolute will and conditioned will (voluntas absoluta et voluntas conditionata). According to the former, God wills and determines that something should occur ‘without any condition’ in the object of God’s willing—but the latter, the conditional will, rests upon the fulfillment of a condition in or by the object of the divine will, for example, the will of God to save men upon condition of faith. Maccovius notes, against the Arminians, that the distinction is ‘utterly vain.’ Wendelin indicates that this distinction causes some difficulty, but makes perfectly good sense if it is understood solely in terms of the voluntas signi [will of sign, or revealed will]—granting that most of the divine precepts, promises, and condemnations are stated conditionally. The distinction is, however, extended improperly to the eternal decree, inasmuch as the decree cannot be ‘suspended on conditions’…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd</cite>, 5. ‘Voluntas absoluta and voluntas conditionata’ in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725 2nd ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, pp. 463-65, p. 463</span></figcaption>

rget="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/47e01e8576.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-conditional-aspects-of-gods-revealed-will/#:~:text=5.%20Voluntatas%20absoluta%20and%20voluntas%20conditionata,decree%20cannot%20be%20%E2%80%98suspended%20on%20conditions&amp;text=5.%20Voluntatas%20absoluta%20and%20voluntas%20conditionata.%20The%20distinction&amp;text=as%20the%20decree%20cannot%20be%20%E2%80%98suspended%20on%20conditions" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ce882a2742" data-kw="">
<blockquote><p>And this much touching the wisdom of God. Now follows concerning his will. … 2. Again the will of God is either absolute or conditional. … The conditional will of God is that by which God wills certain things, with a condition adjoined thereunto. And this is called the will of sign, because God does declare and manifest the same, both in precepts and prohibition, and also in promises, and threatenings, as it were by signs. It is also called the antecedent [that which comes before] will, because it goes before the reward or the punishment, that is propounded in the promises, or in the threatenings. By this, God will have all men to be saved and to come to the acknowledgment of truth [1 Tim. 2:4]: to with, if they believe the promises and preaching of the Gospel, and also obey the same. And therefore He calls and invites all men of all sorts and degrees (and therefore magistrates also) to the fellowship of salvation, and to the confession of the truth: yet he commands all to work their own salvation, and to come to the acknowledging of his truth, though all do it not. 1 Tim. 2:4. By this will Christ would have gathered together the Israelites, as a hen does her chickens, Lk. 13:34 to wit, unless they that were called had refused to come. This will is manifested, not by our conjectures, but only out of his word. And it is the square of all our works, and the perfect rule of all righteousness and holiness. Neither is this will of God dissembled or counterfeit, as though God commanded many things, which he would not: for example, when Gen. 22, He commanded Abraham to offer his son, and yet afterwards forbade it. Whatsoever God commands that He wills. So He commanded that Abraham should offer up his son, to wit, in will, in mind, and in appointing him for a burnt offering, for so God tried his faith and readiness to obey his commandments, and not that Abraham should indeed kill and slay his son Isaac, though Abraham did so understand the word of offering: and this the Lord Himself does sufficiently declare when in verse 12. He says, ‘Now I know and have tried that thou fearest God, seeing that thou hast not spared or withheld thy son even thy only son from me.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, (London, 1600), pp. 11-16</span></figcaption>

</figure><figure class="quote" id="q-2cf47a9734" data-kw="">
<blockquote><p>I long ago began a treatise [Baxter’s Catholick Theology] to reconcile the Arminians and Anti-Arminians in these matters… And because I know not whether ever I shall live to reassume it… I must give the judicious a few hints of the media [means] of conciliation which I would have used: …

20. The doctrine of God’s antecedent and consequent will must be better explained, as being but his governing will, so called from legislation and judgment, which are the antecedent and consequent parts of government.

21. So must God’s will de naturalibus et moralibus [of natural and moral things], and his legislative antecedent will be well opened, and the uselessness and confusion of the distinction of signi [sign] and beneplaciti [good-pleasure] manifested.</p></blockquote>

<blockquote><p>The term voluntas signi, literally, the will of the sign [the revealed will], is closely related to the term signum voluntatis, the sign of the will or purpose. It indicates an overt sign or indication that someone wills something and can therefore be understood as a revealed will or, specifically, as a revealed precept or ‘preceptive will’—thus, what is literally called the ‘signified will’ is a will that God makes known and in effect ‘signifies’ what is commanded. This signified or perceptive will moreover, does not contradict the will of the divine good pleasure, although the relationship between the two may sometimes be difficult to establish immediately. The voluntas signi, therefore, is not a ‘mere sign’ but one that corresponds with something that is truly in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker, 2003), vol. 3 | ch. 5.4, Will and Freedom, E. The Ad Intra–Ad Extra Distinctions, 1. Voluntas beneplaciti and voluntas signi, p. 458</span></figcaption>

<blockquote><p>48. In whatever God wills He is universally effectual; He is not hindered or frustrated in obtaining what He wills. For if He should properly will anything and not attain it He would not be wholly perfect and blessed. … 53. Those means through which that will is revealed are the ‘intention of the sign’ [voluntas signi]–rightly so called not only by metaphor because they show men what they mean, but also by metonymy because they are the effects or adjuncts or partial declarations of God’s own will.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-27682b7137" data-kw="">
<blockquote><p>It is not very just to chastise men for the offenses of their natural ancestors, but to take the fiction of ancestry in a corporate succession as a ground for punishing men who have no relation to guilty acts, except in names and general descriptions, is a sort of refinement in injustice belonging to the philosophy of this enlightened age… [they punish] men, many, if not most, of whom abhor the violent conduct of… former times as much as their present persecutors can do, and who would be as loud and as strong in the expression of that sense, if they were not well aware of the purposes for which all this declamation is employed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edmund-burke.html">Edmund Burke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reflections on the Revolution in France… (1790)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c2ea72c458" data-kw="">
<blockquote><p>When we pursue worldly wealth or worldly reputation with more vehemence than the riches of grace or the favor of God; when we have a foolish imagination that our happiness consists in them, we prefer earth before heaven, broken cisterns that can hold no water before an ever-springing fountain of glory and bliss, and, as though there were a defect in God, cannot be content with him as our portion without an addition of something inferior to him; when we make it our hopes to say to the wedge, “You are my confidence,” and rejoice more because it is great and because our hand has gotten much than in the privilege of communion with God and the promise of an everlasting fruition of him (Job 31:24–25)—this is so gross that Job joins it with the idolatry of the sun and moon.… And the apostle, when he mentions covetousness or covetous men, passes it not over without the title of idolatry to the vice and idolater to the person (Col. 3:5), in that it is a preferring of clay and dirt as an end more desirable than the original of all goodness, in regard of affection and dependence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse 2, On Practical Atheism (covetousness as idolatry)</span></figcaption>

</figure><figure class="quote" id="q-143f18ee47" data-kw="">
<blockquote><p>Once more, it is named, &quot;lust&quot; or &quot;concupiscence&quot;; which is sin itself, and the mother of all sin; it consists of various branches, called fleshly lusts, and worldly lusts, the lust of the flesh, the lust of the eyes, and the pride of life (Romans 7:7; Jam. 1:15; 1 John 2:15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gill.html">John Gill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Doctrinal Divinity</cite>, 3.11</span></figcaption>

</figure><figure class="quote" id="q-326c2c60d2" data-kw="">
<blockquote><p>1. But suppose a person has wronged another in his estate, and the party wronged be dead, what shall he do in this case? Let him restore his ill-gotten goods to that man’s heirs and successors. Question: But what if none of them be living? Answer: Let him restore to God; that is, let him put his unjust gain into God’s treasury by relieving the poor. 2. But what if the party who did the wrong be dead? Then they who are his heirs ought to make restitution. Mark what I say: if there be any who have estates left them, and they knew that the parties who left their estates did defraud others, and died with that guilt upon them, then the heirs or executors who possess those estates are bound in conscience to make restitution, else they entail the curse of God upon their family. 3. But if a man has wronged another, and he be not able to restore, what shall he do in this case? Let him deeply humble himself before God, promising to the party wronged (if the Lord make him able) full satisfaction, and God will accept of the will for the deed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Repentance, Useful for these Times (London, 1668), ch. 4, section 2</cite>, pp. 23-24</span></figcaption>

</figure><figure class="quote" id="q-41214a3615" data-kw="">
<blockquote><p>Accordingly, it is not valid to say: (1) it begets sin, therefore it is not sin. For a man, because he begets a man, does not cease to be a man; indeed, as we have said, it is sin by the very fact that it begets sin.</p></blockquote>

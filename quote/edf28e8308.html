<blockquote><p>DATHENUS: Just as this is very comforting, so it also is certain and true. For this is what Paul is teaching us with these similar words, namely, that “by the deeds of the law no flesh shall justified in his sight: for by the law is knowledge of sin” (Rom. 3:20). Also, “Nay, I had not know sin, but by the law: for I had not known lust except the law had said, Thou shalt not covet” (Rom. 7:7; Exod. 20:17). As summation, Paul points out that the law is our disciplinarian, or what which leads us to Christ, to be justified by faith. However, once we have come to faith, we are no longer under the disciplinarian guide. ELIZABETH: That is comforting and true. But accommodate yourself to my ignorance, and explain it to me even more. DATHENUS: I will gladly do that. You did understand what we discussed earlier about the blindness, alienation and depravity of the natural man, in which he is spiritually dead before God, did you not? ELIZABETH: I did hear you say that, but I did not understand it very well. DATHENUS: In spite of what the real state of man is before God, he likes to see himself as being pious, holy and righteous. This we can see by the example of the rich young ruler who boasted that he had kept all the commandments of God from his youth (Mat. 19:20). When the penitent woman who was a sinner touched Jesus, Simon the Pharisee regarded himself as if he were not likewise a sinner (Luke 18:11). ELIZABETH: Indeed, that is the case all too often with unbelievers. DATHENUS: Oh Elizabeth, God grant that it does not happen with those who think themselves to be the best of Christians, who see the splinter in another’s eye, but do not notice the beam in their own eye. ELIZABETH: But can this also happen with those who truly know God? DATHENUS: Alas, yes, far too often. I have to complain that I come across it many times, and I do not doubt that you sometimes have discovered it in yourself. Spiritual pride, self-love and self-centeredness have not died in the children of God. You can see this very plainly in the example of Loadicea, where the say themselves as rich and enriched and having lack of nothing. But the Lord testifies to the contrary, that they were poor, miserable, blind and naked (Rev. 3:17). ELIZABETH: That, indeed, is true. DATHENUS: Because we are so blinded by spiritual pride that we do not feel our miserable state, the law of God serves as an eye salve (Rev. 3:11), to clear up our dim vision, as a mirror (James 2:5), in which we can see and acknowledge how far we fall short. He does this in order that we will be displeased with ourselves (Ps. 19:13) and become ashamed like the poor publican who did not even dare to lift up his eyes to heaven, and say with him, “God be merciful to me a sinner” (Luke 18:13). ELIZABETH: I also need that eye salve and that mirror. DATHENUS: Not only you, dear Elizabeth, but also the holiest of people. Therefore also the more experienced of God’s elect see themselves mirrored faithfully when they have made a sincere confession (Ps. 19:13; 38:5; Job 13:23; 14:4; Isa. 38:17; 64:6; 1 John 1:9). The highest perfection of people, as long as they live on earth, lies in a sincere confession of imperfections. ELIZABETH: This cannot be denied, for who does not have to say and confess with David, “Who can understand his errors? Cleanse though me from secret faults” (Ps. 19:12). Please, also teach me something of the gospel which, as you taught me earlier, is the other part of God’s Word. I now pretty well understand what the law is about. DATHENUS: This I would wish you from the heart, but I fear that you still have quite deficiency in the knowledge of the law; but we can always make up that deficiency later. So not let us talk about the gospel. Tell me, Elizabeth, what definition would you give me of the gospel? ELIZABETH: All that Christ and His apostles have taught us and handed down to us in writing in the New Testament. DATHENUS: Here you are again making quite a big mistake. Have you forgotten so soon that which I point out earlier– that Christ and His apostles (Rom. 8:3) also proclaim and enforce the law? Don’t you remember that they exhort all people to keep the commandments of God, which we are not able to do (Acts 15:10)? ELIZABETH: Yes, that is true, but I had almost forgotten that. So please instruct me. What is the true gospel? DATHENUS: The Greek word for gospel denotes joyful good news which causes people to speak and sing joyfully and be glad in heart, just like the good news that came to Israel that David triumphed over the arrogant Goliath and slain him (1 Sam. 18:6). Such also is the good news of the gospel that proclaims to us and tells us that God will be gracious to a poor sinner, and will forgive and forget our sins (Jer. 31:34; Heb. 8:12). Yes, for Christ’s sake (1 Tim. 1:15) God will regard us as holy and righteous (2 Cor. 5:21), out of pure grace, by faith alone, without adding any works (1 Cor. 1:30; Rom. 3:28).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-be4c076f2a" data-kw="">
<blockquote><p>When Paul says, “The law is not of faith,” he sets down the main difference between the law and the gospel. The law promises life to him that performs perfect obedience, and that for his works. The gospel promises life to him that does nothing in the cause of his salvation, but only believes in Christ. And it promises salvation to him that believes, yet not for his faith, or for any works else, but for the merit of Christ. The law then requires doing to salvation; and the gospel, believing, and nothing else.</p></blockquote>

<blockquote><p>The law is the Word in which God teaches and tells us what we are to do and not to do, as in the Ten commandments. …The other word of God is not Law or commandment, nor does it require anything of us; but after the first Word, that of the Law, has done this work and distressful misery and poverty have been produced in the heart, God comes and offers his lovely, living Word, and promises, pledges, and obligates himself to give grace and help, that we may get out of this misery and that all sins not only be forgiven but also blotted out and that love and delight to fulfill the law may be given besides. See, this divine promise of his grace and of the forgiveness of his is properly called Gospel. And I say again and yet again that you should never understand Gospel to mean anything but the divine promise of his grace and of the forgiveness of sin. For this is why hitherto St. Paul’s epistles were not understood and cannot be understood by our adversaries even now; they do not know what Law and Gospel really are. For they consider Christ a Legislator and the Gospel nothing but the teaching of new laws. This is nothing else but locking up the gospel and obscuring everything. For “Gospel” is Greek and means “good news,” because in it is proclaimed the saving doctrine of life, of the divine promise, and grace and the forgiveness of sins are offered. Therefore works do not belong to the gospel; for it is not laws but faith alone, because it is nothing whatever but the promise and offer of divine grace. He, then, who believes the Gospel receives grace and the Holy Spirit. Thereby the heart becomes glad and joyful in God and then keeps the Law gladly and freely, without the fear of punishment and without the expectation of reward; for it is sated and satisfied with that grace of God by which the law has been satisfied.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The law is the Word in which God teaches and tells us what we are to do and not to do, as in the Ten commandments. …The other word of God is not Law or commandment, nor does it require anything of us; but after the first Word, that of the Law, has done this work and distressful misery and poverty have been produced in the heart, God comes and offers his lovely, living Word, and promises, pledges, and obligates himself to give grace and help, that we may get out of this misery and that all sins not only be forgiven but also blotted out and that love and delight to fulfill the law may be given besides. See, this divine promise of his grace and of the forgiveness of his is properly called Gospel. And I say again and yet again that you should never understand Gospel to mean anything but the divine promise of his grace and of the forgiveness of sin. For this is why hitherto St. Paul’s epistles were not understood and cannot be understood by our adversaries even now; they do not know what Law and Gospel really are. For they consider Christ a Legislator and the Gospel nothing but the teaching of new laws. This is nothing else but locking up the gospel and obscuring everything. For “Gospel” is Greek and means “good news,” because in it is proclaimed the saving doctrine of life, of the divine promise, and grace and the forgiveness of sins are offered. Therefore works do not belong to the gospel; for it is not laws but faith alone, because it is nothing whatever but the promise and offer of divine grace. He, then, who believes the Gospel receives grace and the Holy Spirit. Thereby the heart becomes glad and joyful in God and then keeps the Law gladly and freely, without the fear of punishment and without the expectation of reward; for it is sated and satisfied with that grace of God by which the law has been satisfied.”

— Martin Luther, Luther’s Sermons, trans. John Nicholas Lenker and Eugene F. A. Klug, 7 vols (Grand Rapids: Baker, 2000), 1.99">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+law+is+the+Word+in+which+God+teaches+and+tells+us+what+we+are+to+do+and+not+to+do%2C+as+in+the+Ten+commandments.+%E2%80%A6The+other+word+of+God+is+not+Law+or+commandment%2C+nor+does+it+require+anything+of+us%3B+but+after+the+first+Word%2C+that+of+the+Law%2C+has+done+this+work+and+distressful+misery+and+poverty+have+been+produced+in+the+heart%2C+God+comes+and+offers+his+lovely%2C+living+Word%2C+and+promises%2C+pledges%2C+and+obligates+himself+to+give+grace+and+help%2C+that+we+may+get+out+of+this+misery+and+that+all+sins+not+only+be+forgiven+but+also+blotted+out+and+that+love+and+delight+to+fulfill+the+law+may+be+given+besides.+See%2C+this+divine+promise+of+his+grace+and+of+the+forgiveness+of+his+is+properly+called+Gospel.+And+I+say+again+and+yet+again+that+you+should+never+understand+Gospel+to+mean+anything+but+the+divine+promise+of+his+grace+and+of+the+forgiveness+of+sin.+For+this+is+why+hitherto+St.+Paul%E2%80%99s+epistles+were+not+understood+and+cannot+be+understood+by+our+adversaries+even+now%3B+they+do+not+know+what+Law+and+Gospel+really+are.+For+they+consider+Christ+a+Legislator+and+the+Gospel+nothing+but+the+teaching+of+new+laws.+This+is+nothing+else+but+locking+up+the+gospel+and+obscuring+everything.+For+%E2%80%9CGospel%E2%80%9D+is+Greek+and+means+%E2%80%9Cgood+news%2C%E2%80%9D+because+in+it+is+proclaimed+the+saving+doctrine+of+life%2C+of+the+divine+promise%2C+and+grace+and+the+forgiveness+of+sins+are+offered.+Therefore+works+do+not+belong+to+the+gospel%3B+for+it+is+not+laws+but+faith+alone%2C+because+it+is+nothing+whatever+but+the+promise+and+offer+of+divine+grace.+He%2C+then%2C+who+believes+the+Gospel+receives+grace+and+the+Holy+Spirit.+Thereby+the+heart+becomes+glad+and+joyful+in+God+and+then+keeps+the+Law+gladly+and+freely%2C+without+the+fear+of+punishment+and+without+the+expectation+of+reward%3B+for+it+is+sated+and+satisfied+with+that+grace+of+God+by+which+the+law+has+been+satisfied.%E2%80%9D%0A%0A%E2%80%94+Martin+Luther%2C+Luther%E2%80%99s+Sermons%2C+trans.+John+Nicholas+Lenker+and+Eugene+F.+A.+Klug%2C+7+vols+%28Grand+Rapids%3A+Baker%2C+2000%29%2C+1.99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F19e307d759.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/19e307d759.html">Permalink</a><a class="src" href="https://heidelblog.net/2016/11/luther-difference-law-gospel/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-7d61bfb3e3" data-kw="">
<blockquote><p>What is it to have other gods besides the true God? I fear upon search, we have more idolaters among us than we are aware of. (1) To TRUST in anything more than God, is to make it a god. If we trust in our RICHES, we make riches our God.… Money is his creator, redeemer, comforter: his creator, for if he has money, he thinks he is made; his redeemer, for if he is in danger, he trusts to his money to redeem him; his comforter, for if he is sad, money is the golden harp to drive away the evil spirit. Thus by trusting to money, we make it a god.… If we trust in THE ARM OF FLESH, we make it a god.… If we trust in our WISDOM, we make it a god.… If we trust in our MORALITY, we make it a god.… If we trust to our DUTIES to save us, we make them a god.… Use duty—but do not trust to it; for then you make it a god.… If we trust in our GRACE, we make a god of it. Grace is but a creature; if we trust to it we make it an idol.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, First Commandment (trust as heart idolatry)</span></figcaption>

</figure><figure class="quote" id="q-dfc5eed2bf" data-kw="">
<blockquote><p>But you might say, “Isn’t there also much Law in the Gospels and in the Epistles of Paul, and again many promises in the books of Moses and the prophets?” Answer: There is no book in the Bible in which both are not found. God has always placed side by side both Law and promise. For He teaches by the Law what is to be done and by the promises where we are to receive that. But the New Testament is especially called “Gospel” above the other books because it was written after the coming of Christ, who fulfilled the divine promises, brought them to us, and publicly proclaimed them by oral preaching, which previously were concealed in the Scriptures. Therefore, hold to this distinction, and no matter what books you have before you, whether of the Old or of the New Testament, read them with this distinction so that you observe that when promises are made in a book, it is a Gospel book; when commandments are given, it is a Law book. But because in the New Testament the promises are found so abundantly, and in the Old Testament so many laws are found, the former is called “Gospel” and the latter, “the Book of the Law.</p></blockquote>

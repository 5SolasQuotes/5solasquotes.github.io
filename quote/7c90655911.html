<main class="wrap"><figure class="quote" id="q-7c90655911" data-kw="providence sin mean">
<blockquote><p>The orthodox hold the mean between these extremes, maintaining that the providence of God is so occupied about sin as neither idly to permit it (as the Pelagians think) nor efficiently to produce it (as the Libertines suppose), but efficaciously to concur about it, so that he is neither the author of sin nor a mere idle spectator of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.7.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-and-evil.html">Providence and Evil</a> › <a href="../topics/providence/providence-and-evil/goodness-of-god-in-evil.html">Goodness of God in evil</a></span></div>
<div class="actions"><button class="copy" data-copy="“The orthodox hold the mean between these extremes, maintaining that the providence of God is so occupied about sin as neither idly to permit it (as the Pelagians think) nor efficiently to produce it (as the Libertines suppose), but efficaciously to concur about it, so that he is neither the author of sin nor a mere idle spectator of it.”

— Francis Turretin, Institutes of Elenctic Theology, 6.7.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20orthodox%20hold%20the%20mean%20between%20these%20extremes%2C%20maintaining%20that%20the%20providence%20of%20God%20is%20so%20occupied%20about%20sin%20as%20neither%20idly%20to%20permit%20it%20%28as%20the%20Pelagians%20think%29%20nor%20efficiently%20to%20produce%20it%20%28as%20the%20Libertines%20suppose%29%2C%20but%20efficaciously%20to%20concur%20about%20it%2C%20so%20that%20he%20is%20neither%20the%20author%20of%20sin%20nor%20a%20mere%20idle%20spectator%20of%20it.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%206.7.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7c90655911.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7c90655911.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-12a63f8296" data-kw="Author of sin Depravity">
<blockquote><p>First, the offering of occasions which can be procured only by the peculiar providence of God by the concourse of circumstances and the proposition of objects, fitted to move faculties constituted in this or that way (in which manner God does not infuse wickedness into the minds of men, but draws out into action the wickedness latent there).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.7.15</span></figcaption>

</figure><figure class="quote" id="q-19caa75f31" data-kw="Author of sin">
<blockquote><p>Nor does he become the author of sin by his providence, because that lawlessness is nothing except a defect of operation, of which there cannot exist an author or efficient cause, but only a deficient cause, for which reason alone, the author of sin, insofar as it is such, is the creature, by its transgressing of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology</cite>, Vol. 3, bk. 3, ch. 10 (Providence), §18</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Nor does he become the author of sin by his providence, because that lawlessness is nothing except a defect of operation, of which there cannot exist an author or efficient cause, but only a deficient cause, for which reason alone, the author of sin, insofar as it is such, is the creature, by its transgressing of the law.”

</figure><figure class="quote" id="q-bc72ee2b84" data-kw="Permission Author of sin">
<blockquote><p>Not by permitting the evil action, because he is bound by no law to hinder sin. Not by determining it; for as he who puts out a fire so that it may not spread further is not the cause of the fire, so he who fixes bounds to sin is not the cause of sin. Not by directing it to a good end; for as it is the highest art to prepare a wholesome medicine from venomous animals, so it is glorious for God to draw light even out of darkness, and something good out of evils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wollebius.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, bk. 1, ch. 6 (providence), canon 11</span></figcaption>

</figure><figure class="quote" id="q-c93619138f" data-kw="Hardening Justice Satan">
<blockquote><p>As for those wicked and ungodly men whom God, as a righteous judge, for former sins, doth blind and harden; from them He not only withholdeth his grace, whereby they might have been enlightened in their understandings, and wrought upon in their hearts; but sometimes also withdraweth the gifts which they had, and exposeth them to such objects as their corruption makes occasions of sin; and withal, gives them over to their own lusts, the temptations of the world, and the power of Satan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 5.6</span></figcaption>

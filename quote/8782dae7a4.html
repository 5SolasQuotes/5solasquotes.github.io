<main class="wrap"><figure class="quote" id="q-8782dae7a4" data-kw="">
<blockquote><p>We believe that those Holy Scriptures fully contain the will of God, and whatsoever man ought to believe unto salvation is sufficiently taught therein. For since the whole manner of worship which God requires of us is written in them at large, it is unlawful for any one, though an apostle, to teach otherwise than we are now taught in the Holy Scriptures: nay, though it were an angel from heaven, as the apostle Paul says. For since it is forbidden to add unto or take away anything from the Word of God, it does thereby evidently appear that the doctrine thereof is most perfect and complete in all respects. Neither may we consider any writings of men, however holy these men may have been, of equal value with those divine Scriptures, nor ought we to consider custom, or the great multitude, or antiquity, or succession of times and persons, or councils or decrees or statutes, as of equal value with the truth of God, since the truth is above all; for all men or of themselves liars, and more van than vanity itself. Therefore we reject with all our hearts whatever does not agree with this infallible rule, as the apostles have taught us saying, Test the spirits, whether they are of God. Likewise: any one comes to you and brings not this teaching, receive him not into your house (Art. 7) We also believe that although it is useful and good for those who govern the churches to establish and set up a certain order among themselves for maintaining the body of the church, they ought always to guard against deviating from what Christ, our only Master, has ordained for us. Therefore we reject all human innovations and all laws imposed on us, in our worship of God, which bind and force our consciences in any way (Art. 32).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/belgic-confession.html">Belgic Confession</a></span><span class="wk"><span class="lbl">Work:</span> <cite>(1561; emphasis added)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-35279583c3" data-kw="">
<blockquote><p>The primitive Church also of Christ his apostles had no images, either of Christ himself or of other saints set up in their places of public prayer, nor in their Churches. The deed of Epiphanius is very well known which he committed at Anablacha in Syria. It is written in Greek in an epistle to John Bishop of Jerusalem, and translated into Latin by St. Jerome: He rent the vail that hung in the temple [church building], bearing in it the image of Christ or some other saint, testifying therewithal that it is against Christian religion for the picture of a man, to hang in the Church of God. Saint Augustine in Catalogo haerese [Greek] makes mention of one Marcella a follower of Carpocrates his sect, which worshipped the images of Jesu, Paul Homer and Pythagoras, with falling down prostrate before them and offering incense unto them…. Furthermore, for Christ our Lord and very God, though he have taken on him the nature of us men, yet that notwithstanding, there ought no image to be erected. For he did not become man to that intent. But he drew up his humanity into heaven, and therewithal gave us a charge, that so often as we pray, we shoulde lift up the eyes of our minds and bodies into heaven above. Moreover, being once ascended, he sent his Spirit instead of himself, unto the Church wherin he has a spiritual kingdom, and needs not any bodily or corruptible things. For he commanded that if we would bestow any thing on him or for his sake, we should bestow it on the poor, and not on his picture or image. And now, since without all controuersy, our Christ is the very true God, and that the very true God does forbid to hallow to him any likeness of man, that is, to represent God in the shape of a man, it follows consequently that to Christ no image is to be dedicated, because he is the true and very God and life everlasting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty Godly &amp; Learned Sermons divided into Five Decades</cite>, … (1549; London: 1577), 2nd Decade, 2nd Sermon, Of God’s Law, and of the Two First Commandments of the First Table, pp. 121-22</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-74140b6793" data-kw="">

</figure><figure class="quote" id="q-9cfa4ce655" data-kw="">
<blockquote><p>…one of our doctors objects that we lift up our eyes and our hands to heaven and worship God, yet do not worship the heaven: that a man going to bed prays before his bed: that David offered the sacrifices of thanksgiving in the presence of all the people, Ps. 116, that Paul having taken bread gave thanks before all them who were in the ship, Acts 27:35, that the Israelites worshipped before Moses and Aaron, Ex. 4:31. Hereupon another doctor harping on the same string tells us that when we kneel in the act of receiving the sacrament, we kneel no more to bread than to the pulpit when we join our prayers with the ministers. Oh, unworthy instances and reproachful to doctors! All these things were and are accidentally present to the worshippers and not purposely before them, not respected as having a religious state in the worship. What? do we worship before the bread in the sacrament even as before a pulpit, a bed, etc? Nay, graduate men should understand better what they speak of.</p></blockquote>

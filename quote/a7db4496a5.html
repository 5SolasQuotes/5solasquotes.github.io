<main class="wrap"><figure class="quote" id="q-a7db4496a5" data-kw="">
<blockquote><p>…we did never condemn all significant rites in religion, even though they be not founded on divine institution. Uncovering the head is a significant rite, and we know no divine institution for it; and yet we use it in the worship of God, viz. prayer and several other exercises; and will separate from no Church because of it. That a minister preach in a decent garb, and not in a fool’s coat, is a significant rite used in religion, not founded on divine institution, yet we shall not separate for enjoyning that.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended… wherein the Divine Right of the Government of the Church by Presbyters acting in Parity, is Asserted… (Edinburgh, 1697) Rule was a leading father of the Revolution Church of Scotland who wrote numerous works at that time for the divine right of presbyterianism. | section 12</cite>, pp. 275-6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9ca1fa7911" data-kw="">
<blockquote><p>The uncovering of the head is a gesture of reverence, and yet the gentiles had their heads covered when they worshiped their gods, as Brissonius proves (Formulae, bk. 1). Drusius proves the like of the Jews, that they covered their head when they prayed to God (Preterita, 1. Cor. 1:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly… (1619), ‘Kneeling in the act of receiving the sacramental elements of bread and wine proved unlawful’, ‘Kneeling considered as it is a breach of the Second Commandment’</cite>, p. 48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-aaa70fed60" data-kw="">
<blockquote><p>Wherefore let it be set down that it is lawful for the Church to make to itself either canons or laws, or decrees, or statutes, or call them by what name thou wilt. For the Church is a company, and must be ruled by the Word of God, especially because it belongs to the salvation thereof, and to the worshiping of God. But there be other things which belong only unto outward discipline. For there is need of certain outward bonds, to the end that the fellowship of the people may be retained. So the apostle decreed that women ought to pray with the head covered, and men uncovered. And the apostles in the Acts, decreed that we should abstain from blood, from strangled, and from things dedicated unto idols. And always in councils after they had done with doctrine, they began to entreat of discipline. Finally so did all the fathers as Tertullian, Origen, Basil, Augustine and Jerome. The end of these laws must be edifying and good order. But for so much as they be not of necessity, they may be changed according to the times and places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places (d. 1562; London, 1583)</cite>, ch. 4, ‘Of Ecclesiastical Laws…’, p.42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-1de89f7c5a" data-kw="">
<blockquote><p>The trifling objection of the abuse of this psalm [psalm 121], by the woman’s usual coming in a vail is easily answered, by affirming that the Church, as she does not forbid, so neither does she command any such habit, but leaves it as an indifferent thing; and if the woman, who has an arbitrary power in this concernment, think fit to come forth vailed, that is, better armed against the cold, her act cannot constitute a ceremony of the Church, and so the Church not chargeable with the abuse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hamon-l-estrange.html">Hamon L’Estrange</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Alliance of Divine Offices, exhibiting all the Liturgies of the Church of England since the Reformation as also the late Scotch Service-Book [1637], with all their Respective Variations: and upon them all Annotations, Vindicating the Book of Common-Prayer from the Main Objections of its Adversaries… (London, 1659), Annotations upon ch. 11</cite>, p. 317</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

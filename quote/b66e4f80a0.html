<main class="wrap"><figure class="quote" id="q-b66e4f80a0" data-kw="">
<blockquote><p>The moral grandeur of the death of Jesus is not a little enhanced when it is apprehended in its distinctive character as an act of worship. If we consider it exclusively in the light of a judicial sentence, and detach from the Saviour those active sentiments of piety and religion which make Him a doer rather than a sufferer, we may understand the principles of moral government which underlie the atonement, but we shall fail to appreciate the dignity and glory of Jesus. It is not right to consider Him as the helpless victim of inexorable wrath; and all the imputations upon the goodness and clemency of God, which the malice of the human heart has made His vicarious punishment the pretext of suggesting, are at once dispelled when we enter into His own mind, and see the spirit of devotion in which He presented His soul as an offering for sin… We dare not entertain the thought, even for an instance, that the Father is harsh or vindictive, or that a cloud obscures the benevolence of His nature, when the very circumstances which are most revolting in the tragedy of Calvary are elements of a worship which the Son delighted to render, and felt that the Father was glorious in accepting. Considered as an act of worship, there is a majestic awe, a moral sublimity thrown around the death of Jesus, which fails to be impressed when attention is exclusively confined to the legal principles which made it indispensable to the pardon of the guilty. It is invested with a sacredness which makes us pause and adore. Never was there such a doxology as when Jesus died, and the whole work of redemption is a grand litany which has no parallel in the history of the universe. There can be no wonder that the Father should love the Son. Such worshippers are not to be dismissed from the sanctuary, nor such homage lightly esteemed. Never, never was there displayed before, and never, never will there be displayed again, such piety as that which burned in the bosom of Jesus when He laid down His life of Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-henley-thornwell.html">James Henley Thornwell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collected Writings</cite>, vol. 2, ‘The Sacrifice of Christ: the Type &amp; Model of Missionary Effort’, pp. 418-19</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33a10a09f9" data-kw="">
<blockquote><p>Civil worship is the honor done to men set above us by God Himself, either in respect of their excellent gifts, or in respect of their offices and authority whereby they govern others. The right end of this worship is to testify and declare that we reverence the gifts of God, and that power which He has placed in those that be his instruments. And this kind of worship is commanded only in the Second Table and in the First Commandment thereof, ‘Honor thy father and mother.’ Upon this distinction we may judge what honor is due to everyone. Honor is to be given to God, and to whom He commands. He commands that inferiors should honor or worship their betters… Good angels, because they excel men both in nature and gifts, when they appeared were lawfully honored: yet so, as when the least signification of honor was given that was proper to God, they refused it. And because they appear not now as in former times, not so much as civil adoration in any bodily gesture is to be done unto them. Lastly, governors and magistrates have civil adoration as their due: and it cannot be omitted without offense. Thus Abraham worshipped the Hittites, Gen. 23, and Joseph his brethren, Gen. 50. To come to the very point: upon the former distinction, we deny against the Papists that any civil worship in the bending of the knee or prostrating of the body is to be given to the saints, they being absent from us; much less any religious worship, as namely invocation signified by any bodily adoration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... (Cambridge, Legat, 1598), 14th Point, ‘Worshipping of Saints’, ‘The Dissent’, pp. 248-50</span></figcaption>

asquotes.github.io%2Fquote%2F33a10a09f9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/33a10a09f9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-definition-of-worship/#:~:text=Civil%20worship%20is%20the%20honor%20done,invocation%20signified%20by%20any%20bodily%20adoration&amp;text=Civil%20worship%20is%20the%20honor%20done%20to%20men&amp;text=as%20namely%20invocation%20signified%20by%20any%20bodily%20adoration" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Therefore, that thou be not beguiled with falsehood of sophistical words, understand that the words which the scripture uses in the worshipping or honoring of God, are these: Love God, cleave to God, dread, serve, bow, pray and call on God, believe and trust in God, and such like: which words all we use in the worshipping of man also, howbeit diversely; and the difference thereof does all the scripture teach.</p></blockquote>

<blockquote><p>This is the great secret of their religion, the original spring that sets all their endeavors in motion. They are a covenanted people, i.e. linked and confederated together to advance and propagate their faction and discipline, which they upon all occasions blasphemously call the kingdom of Jesus Christ. … …they confine the name of the godly only to themselves, as Papists do the name of catholic to them: And I have heard some of them say that it was not possible the power of godliness should prevail but under presbytery: If it be so, the world is much mistaken…</p></blockquote>

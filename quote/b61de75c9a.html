<main class="wrap"><figure class="quote" id="q-b61de75c9a" data-kw="">
<blockquote><p>We have heard pleadings for a thing so good in itself, and in measure good for so many practical reasons, as Christian union, which we find ourselves compelled to watch with double scrutiny since they would reduce to such a minimum the truth that we may be allowed to profess and proclaim, and for which we are permitted to be valiant, and since from that minimum so much is excluded that has been in the past so inspiring to Christian hope, so sustaining to Christian strength and heroism.

This is an evil day for polemics and scholastics, and dogmatists and denominationalists. The only man who may be valiant without falling into disrepute is the irenic; he may be as dogmatic and combative as you please. We involuntarily call to mind the unpopularity of Elijah, the troubler of Israel, with Ahab. In the view of some there are no other troublers of Israel like the persistent, aggressive believers in truth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-augustus-aiken.html">Charles Augustus Aiken</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Valiant for the Truth in Princeton Sermons: Chiefly by the Professors in Princeton Theological Seminary</cite></span></figcaption>

<blockquote><p>3. Some object the heinousness of the sins of ministers’ conformity as being deliberate covenanting to (I am loath to name them), and so the command, “from such turn away” [2 Tim. 3:5], with such “not to eat” [1 Cor. 5:11]… But these sins were never so surely proved as great as alleged:

1. Every minister cannot be proved guilty of the worst part.

2. And the matter of a sin may be heinous, and yet ignorance take off much of the guilt, as it did of Paul ‘s persecution [1 Tim. 1:13]. An unlawful war in which thousands were murdered and countries ruined is materially one of the greatest sins in the world; and yet woe to the abundance of princes and people if ignorance excuse it not and if we must renounce communion with all countries and persons that are guilty of it.

3. And when whole countries and Churches are in sin which we cannot cure and have no government of, the case of commanded communion much differs from that which is with single offenders, and that which is in our power to choose or refuse.

4. Some object that the fifth, sixth, seventh and eighth canons have excommunicated us already. Therefore we separate not, but they cast us out. Answer: Let them that are concerned in those canons defend them if they can and justify themselves, for it’s past my skill; but we are not bound (though excommunicated) to execute them on ourselves: Let others do it if it must be done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 86-87</span></figcaption>

<blockquote><p>Their former discord anent the state of their appearance, and their declaration, did a vast deal of hurt to the common cause, and to both sides. When the reports of it came abroad, multitudes who were coming to the army were discouraged, and great numbers, when they came to the camp, and saw how matters went, very soon left them. And I find both sides, in their papers, complaining of this; Mr. Hamilton’s party especially, towards the close of this rising, and when the moderate party overbalanced them, complained that many came to the camp, and finding that the cause was not clearly stated, and the indulgence not plainly opposed, they left the army: the other side complain, I imagine, with as much reason, that many quit the camp, and more who wished them well, came not up, by reason of the heights and extremities run into by many. As the time of the engagement approached, these differences run higher. The publishing the above-named declaration, June 13th, did very much ruffle those who opposed it; and they were not only broken in their affections, but the common soldiers were under no kind of discipline: their confusions increased, and numbers lessened much, before the king’s army came up; and, as has been hinted, they wanted skilled officers; their arms were out of case; they had very little ammunition, their rising being without any prior concert; and were in very melancholy circumstances… The officers met upon Saturday, June 21st, where the moderate party were supernumerary, by the accession of a good many gentlemen of some note, who joined them, and could not well be excluded [from] the meeting, which they named the council of war. At this meeting their debates run higher than ever, even when the enemy was within their view… …and Mr. Hamilton [a lay-leader in the army], who, as one of his own side acknowledges upon this occasion, “was often too forward, pretending to exercise a power which he had not, and that, his carriage at this time gave just occasion of offence to both sides,” opposed much the consulting with the ministers there, because, he said, none of the faithful ministers were present, but only such who owned the indulgence [which is false]; adding, that since the sword was drawn, he thought it duty to appear against all sin. It was reported he laid his hand upon his sword when he spoke what follows; but Mr. Hackston of Rathillet, in his relation of the divisions at Bothwell, denies this, but owns he added, “I have drawn my sword, and am equally ready against the indulged men and curates.” So high did the flame rise at a time when harmony was absolutely necessary. The moderate side continued to urge to have leaders chosen who were most capable of that trust, whether for or against the indulgence, whereupon Mr. Hamilton, and a good many with him, left the meeting, telling them as they went away, “That hitherto they had carried on this work, and now since they were setting up upon the foot of the indulgence, they had no freedom to venture their lives in that cause.”… Now the fatal nature of their divisions began to appear. When the commissioners came back, the officers fell a debating, and would come to no resolution. Mr. Hamilton, who assumed the general command, was against all accommodation, and others did not relish the proposal of laying down their arms; in short, they were quite disjointed and broken, and nothing was agreed upon, nor any answer returned to the general. So the lord Livingstone, upon the head of the foot-guards, came up with the cannon to force the bridge… Never was a good cause and gallant army, generally speaking, hearty and bold, worse managed…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-wodrow.html">Robert Wodrow</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of the Sufferings of the Church of Scotland from the Restoration to the Revolution</cite>, 4 vols. (d. 1734; Glasgow: Blackie &amp; Son, 1832), vol. 3, pp. 102-6</span></figcaption>

<blockquote><p>Have ye had a care to keep a Christian state to Christ’s honor? Have ye loved public assemblies to that end and use? Have ye not forsaken the assemblies of Christ’s people for no just cause? Is not that a true church which professes the name of Christ according to his Word, whereto it submits as the rule of the religion it has? Is not that a true Church which enters covenant with Me, as all the Christians in the world by entering into my school by baptism?</p></blockquote>

</figure><figure class="quote" id="q-8e6b20902e" data-kw="Creeds below Scripture">
<blockquote><p>The authority of confessions ought indeed to be great with the pious in the churches, but still sinking below the authority of the Scripture. For the latter is a rule, they the thing ruled. It alone is self-credible (autopistos) with respect to words as well as to things, divine and infallible; they, as divine in things, still in words and manner of treatment are human writings. Faith is immediately and absolutely due to it; to them an examination is due and that having been made, if they agree with the word, faith. It is the constant and immutable canon of faith; while they are subject to revision and new examination, in which it is right not only to explain and amplify them, but also to correct whatever fault should be found in them and reform according to the rule of the word. Hence it is evident that they err here in excess who hold such confessions as the rule of the truth itself and make them equal to the word of God.</p></blockquote>

<blockquote><p>33. The divine ideas, therefore, are not the creatures themselves known by God, but are objective reasons, that is, the divine essence itself, conceived by God, insofar as it is imitable by created things: so that the divine exemplar is infinitely more perfect than created things, since it is the divine essence itself known as imitable.

34. But they express the things themselves, because the divine essence, which holds the nature of an idea, insofar as it is known by God, as in tablets by creatures, eminently contains man, for example, of whom it is the idea, as it is imitable by him, and similarly the other things, and represents them most perfectly.

35. The ideas are removed and separated from the commerce of matter and the concretion of singulars.

36. They are eternal, stable, unchangeable, and incorruptible. And they themselves are not formed: just as neither are created ideas made by an artificer, as Plato rightly teaches in the tenth book of the Republic, not far from the beginning.

37. They agree in part with created ideas and in part differ from them. They agree in that both are objective reasons: they differ in that the ideas of the supreme Architect are not things which he intends to produce, as the created ideas of a created artisan. The reason for this distinction is that in the divine essence, which is the primary object of divine understanding, all things that can be made are contained and reflected; therefore, it is necessary that God, in making any work, principally regards the idea of it in his mind and primarily imitates it. In the created artisan, however, the matter is not so, who sometimes changes something as the situation arises and does not always imitate the idea first conceived. They also differ from the conjoined forms of things. For ideas are objective forms, from which imitation is taken, and they always remain outside the essences of made things, not becoming part of them: but the conjoined forms of things are [Hebrew or Greek] forms, constitutive, and part of composite things. Furthermore, ideas are the prototypical reasons of things, of which they are the exemplars: but the conjoined forms, induced into things by God the Creator, are certain principled likenesses of them, which by informing matter comprehend essence.</p></blockquote>

<blockquote><p>How long is it since God did create the world? Four thousand years before the birth of our Saviour Christ, and so about 5614 years before this time. Why is the order of the years of the world so carefully set down in the Scripture?

1. To convince all heathen that either thought that the world was without beginning, or that it began millions of years before it did.

2. To give light to all sacred histories of the Bible… … How long was God creating the world? Six days and six nights. Why was He creating so long, seeing He could have perfected all the creatures at once and in a moment? First, to show the variety, distinction and excellency of his several creatures. Secondly, to teach us the better to understand their workmanship, even as a man which will teach a child in the frame of a letter will first teach him one line of the letter, and not the whole letter together. Thirdly, to admonish us that we are bound to bestow more time in discerning and knowing them than we do. Fourthly, that we might also by his example finish our work in six days. Fifthly, that we might observe, that many of the creatures were made before those which are ordinarily their causes, and thereby learn, that the Lord is not bound to any creature, or to any means: thus the sun was not created before the fourth day, and yet days which now are caused by the rising of the sun were before that; so trees and plants were created the third day, but the sun, moon and stars, by which they are now nourished and made to grow, were not created till after the third day.</p></blockquote>

<blockquote><p>…consider the selection pressures which operated during his presumed rise from the apes… The first [problem] is that on this hypothesis, the only genes that are consistently passed on are the ones for traits which have adaptive value. But obviously this isn’t so. Tell me the adaptive value in seeking to know the meaning of life, or in the ability to be awed, humbled, and transported by the music of J.S. Bach. One eminent sociobiologist claims that we have genes for believing in God, which are adaptive because belief in God unites the social group. Apparently no one told him that believing different things about God can tear the group apart. Besides — why not just have genes for social unity?</p></blockquote>

<blockquote><p>In God, however, it is otherwise. For it was shown above (Q. 4, A. 2) that whatever perfection exists in any creature, wholly pre-exists and is contained in God in an excelling manner. Now not only what is common to creatures—viz., being—belongs to their perfection, but also what makes them distinguished from each other; as living and understanding, and the like, whereby living beings are distinguished from the non-living, and the intelligent from the non-intelligent. Likewise every form whereby each thing is constituted in its own species, is a perfection; and thus all things pre-exist in God, not only as regards what is common to all, but also as regards what distinguishes one thing from another. And therefore as God contains all perfections in Himself, the essence of God is compared to all other essences of things, not as the common to the proper, as unity is to numbers, or as the center (of a circle) to the (radiating) lines; but as perfect acts to imperfect; as if I were to compare man to animal; or six, a perfect number, to the imperfect numbers contained under it. Now it is manifest that by a perfect act, imperfect acts can be known not only in general, but also by proper knowledge; thus, for example, whoever knows a man, knows an animal by proper knowledge; and whoever knows the number six, knows the number three also by proper knowledge. As therefore the essence of God contains in itself all the perfection contained in the essence of any other being, and far more, God can know in Himself all of them with proper knowledge. For the nature proper to each thing consists in some degree of participation in the divine perfection. Now God could not be said to know Himself perfectly unless He knew all the ways in which His own perfection can be shared by others. Neither could He know the very nature of being perfectly, unless He knew all modes of being. Hence it is manifest that God knows all things with proper knowledge, in their distinction from each other.</p></blockquote>

nowledge, in their distinction from each other.”

— Thomas Aquinas, Summa, pt. 1 | quest. 14, art. 6, I answer that">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+God%2C+however%2C+it+is+otherwise.+For+it+was+shown+above+%28Q.+4%2C+A.+2%29+that+whatever+perfection+exists+in+any+creature%2C+wholly+pre-exists+and+is+contained+in+God+in+an+excelling+manner.+Now+not+only+what+is+common+to+creatures%E2%80%94viz.%2C+being%E2%80%94belongs+to+their+perfection%2C+but+also+what+makes+them+distinguished+from+each+other%3B+as+living+and+understanding%2C+and+the+like%2C+whereby+living+beings+are+distinguished+from+the+non-living%2C+and+the+intelligent+from+the+non-intelligent.+Likewise+every+form+whereby+each+thing+is+constituted+in+its+own+species%2C+is+a+perfection%3B+and+thus+all+things+pre-exist+in+God%2C+not+only+as+regards+what+is+common+to+all%2C+but+also+as+regards+what+distinguishes+one+thing+from+another.+And+therefore+as+God+contains+all+perfections+in+Himself%2C+the+essence+of+God+is+compared+to+all+other+essences+of+things%2C+not+as+the+common+to+the+proper%2C+as+unity+is+to+numbers%2C+or+as+the+center+%28of+a+circle%29+to+the+%28radiating%29+lines%3B+but+as+perfect+acts+to+imperfect%3B+as+if+I+were+to+compare+man+to+animal%3B+or+six%2C+a+perfect+number%2C+to+the+imperfect+numbers+contained+under+it.+Now+it+is+manifest+that+by+a+perfect+act%2C+imperfect+acts+can+be+known+not+only+in+general%2C+but+also+by+proper+knowledge%3B+thus%2C+for+example%2C+whoever+knows+a+man%2C+knows+an+animal+by+proper+knowledge%3B+and+whoever+knows+the+number+six%2C+knows+the+number+three+also+by+proper+knowledge.+As+therefore+the+essence+of+God+contains+in+itself+all+the+perfection+contained+in+the+essence+of+any+other+being%2C+and+far+more%2C+God+can+know+in+Himself+all+of+them+with+proper+knowledge.+For+the+nature+proper+to+each+thing+consists+in+some+degree+of+participation+in+the+divine+perfection.+Now+God+could+not+be+said+to+know+Himself+perfectly+unless+He+knew+all+the+ways+in+which+His+own+perfection+can+be+shared+by+others.+Neither+could+He+know+the+very+nature+of+being+perfectly%2C+unless+He+knew+all+modes+of+being.+Hence+it+is+manifest+that+God+knows+all+things+with+proper+knowledge%2C+in+their+distinction+from+each+other.%E2%80%9D%0A%0A%E2%80%94+Thomas+Aquinas%2C+Summa%2C+pt.+1+%7C+quest.+14%2C+art.+6%2C+I+answer+that&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F879510ff62.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/879510ff62.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/creation#:~:text=In%20God%2C%20however%2C%20it%20is%20otherwise,in%20their%20distinction%20from%20each%20other&amp;text=In%20God%2C%20however%2C%20it%20is%20otherwise.%20For%20it&amp;text=proper%20knowledge%2C%20in%20their%20distinction%20from%20each%20other" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. Newness of being is essential to it [created being], or of its notion…

5. As also assiduous dependence on the First Being and containment or inexistence in it. But its being in God is threefold: eminent, ideal, intelligible. In that way it is in his power as in an efficient cause, conserving and governing: in that [ideal way] in the idea as in an exemplary cause: in this [intelligible way] in knowledge as in the knower, the most beautiful Himself bearing the beautiful world in mind, etc., Boethius sings. And divinely the apostle, Acts 17: ‘In Him we live, and move, and are:’ and, τοῦ γὰρ καὶ γένος ἐσμέν, as the apostle [cites] there from Aratus. [This is] Against Durandus and those of whom Augustine makes mention, bk. 5, On the Literal Meaning of Genesis, who denied concourse.</p></blockquote>

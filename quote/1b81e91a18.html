<main class="wrap"><figure class="quote" id="q-1b81e91a18" data-kw="">
<blockquote><p>Question: What is Creation? Answer: Creation is a work proper only to God, undividedly common to the Father, the Son, and to the Holy Ghost, whereby, in the beginning, and in the space of six days, God made of nothing, the heavens and earth, and all the host of them visible, and invisible, to the glory of his Name, and the use of man… Yea whereas the Lord could have made the world in an instant, it pleased Him to take six days to finish the heaven and the earth, with all the host of them, to this end (we may well suppose) that we should take good notice of the same. For this, was the Sabbath ordained, that we might preserve the memory of the Creation, and praise the Lord…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/elnathan-parr.html">Elnathan Parr</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Grounds of Divinity Plainly Discovering the Mysteries of Christian Religion</cite>, (London, 1614), Grounds of Divinity, pp. 73, 75-76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d8f4358a5e" data-kw="">
<blockquote><p>As God is perfect in His works, He bestowed perfection on all of them according to their capacity: God’s works are perfect (Deut 32:4). He Himself is simply perfect by the fact that all things are pre-contained in Him, not as component parts, but as united in one simple whole, as Dionysius says (Div. Nom. v); in the same way as various effects pre-exist in their cause, according to its one virtue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 91, art. 1, I answer that</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-acc83a0673" data-kw="">
<blockquote><p>The creation of the world was distinguished by the space of six days, in respect of the effects, and whole world created; and for our better capacity. And for as much as God is above all time, and of infinite power, it is to be thought He created every thing particular [every particular thing] in a moment, saying, ‘Let there be light, and there was light’, Gen. 1:3.</p></blockquote>

</figure><figure class="quote" id="q-b7cd1f6c82" data-kw="">
<blockquote><p>But now let us come to that which is commanded here concerning the Easterday of the Jews [Dt. 16:8], ‘Ye shall eat unleavened bread or cakes’ (says he) ‘by the space of six days, and there shall no leavened bread be found in your houses’… [Note that while the phrase occurs in a translation of a Bible verse, the term “space” is not explicitly in the Hebrew, nor the later KJV. Hence it reflects Calvin’s interpretation and use of that term and concept.] …when God commanded them to eat unleavened bread. And it was his will that this should be done, not only the same night that they ate the pascal lamb: but also that the same ceremony should be continued by the space of six days together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, The Sermons of Mr. John Calvin upon the Fifth Book of Moses called Deuteronomy... (London, 1583), On Tuesday, Nov. 5, 1555, 97th Sermon, first on ch. 16, pp. 598-99</span></figcaption>

</figure><figure class="quote" id="q-46682f7824" data-kw="">
<blockquote><p>The forme of Creation, to wit, of that which is primary, is both that hidden force of divine power, put into that first matter, according to the being and conditions of the same: as also the external, immediate and instant bringing forth of the matter &amp; the state thereof, without shape and order: But, of that which is secondary, the form internal is that common and hidden nature of the whole frame, which God has imprinted into all things after a common mean and manner: but the external, whereof speech is here, is that powerful bringing forth of all things, out of the first matter in the beginning of time, by the space of six days; as also the most godly disposing of the same, both in themselues and among themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lucas-trelcatius.html">Lucas Trelcatius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Institution of the Common Places of Sacred Divinity</cite>, (London, 1610), bk. 2, ch. 3, Of Creation, Confirming Part, p. 104</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<main class="wrap"><figure class="quote" id="q-4a048d1f58" data-kw="">
<blockquote><p>Tis certainly as much a Treason and Rebellion against this constitution, and the known Laws, in a Prince to endeavour to break through them, as ’tis in the People to rise against him, whilst he keeps within their Bounds and does his Duty. Our Constitution is a Government of Laws, not of Persons. Allegiance and Protection are Obligations that cannot subsist separately; when one fails, the other falls of Course. The true Etymology of the word ‘Loyalty’ (which has been so strangely wrested in the late Reigns ) is an entire Obedience to the Prince in all his Commands according to Law; that is, to the Laws themselves, to which we owe both an active and passive Obedience. By the old and true Maxim, that the King can do no Wrong, no body is so foolish as to conclude, that he has not strength to murder, to offer violence to women, or power enough to dispossess a man wrongfully of his Estate, or that whatever he does (how wicked soever) is just: but the meaning is, he has no lawful Power to do such things; and our Constitution considers no power as irresistible, but what is lawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-hotman.html">Francis Hotman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Franco-Gallia: Or an Account of the Ancient Free State of France and most other Parts of Europe before the Loss of their Liberties, 1573 | From the Translator’s Preface:</cite></span></figcaption>

</figure><figure class="quote" id="q-79decefbf0" data-kw="">
<blockquote><p>And the truth is, that, besides many other evils, the iniquity and unhappiness of such oaths and covenants [such as the SL&amp;C, which he was just examining] lie much in this, that being commonly framed by persons that even, amongst themselves, are not fully of one mind, but have their different opinions and interests to serve, (and it was so even in this) they commonly patch up so many several articles and clauses, and those too of so versatile and ambiguous terms, that they prove most wretched snares and thickets of briers and thorns to the consciences of those who are engaged in them, and matter of endless contentions and disputes amongst them, about the true sense and intendment, and the ties and obligations of those doubtful clauses: especially in such alterations and revolutions of affairs as always may, and often do, even within few years, follow after them; for the models and productions of such devices are not usually long-lived. And whatsoever may be said for their excuse in whole or in part, who, in yielding to the power that pressed it, and the general opinion of this Church at that time, did take that [Solemn League and] Covenant [1643] in the most moderate and least schismatical sense that the terms can admit; yet, I know not what can be said to clear them of a very great sin, that not only framed such an engine, but violently imposed it upon all ranks of men; not ministers and other public persons only, but the whole body and community of the people, thereby engaging such droves of poor ignorant persons to they knew not what, and (to speak freely) to such a hodge-podge of things of various concernments, religious and civil, as church discipline and government, the privileges of parliaments, and liberties of subjects, and condign punishment of malignants— things hard enough for the wisest and learnedest to draw the just lines of, and to give plain definitions and decisions of them, and therefore certainly as far off from the reach of poor country people’s understanding as from the true interest of their souls. And yet to tie them by a religious oath, either to know all, or to contend for them blindfold, without knowing of them, where will there be instanced a greater oppression and tyranny over consciences than this? Certainly, they that now govern in this Church cannot be charged with anything near or like unto it; for whatsoever they require of entrants to the ministry, they require neither subscriptions nor oaths of ministers already entered, and far less of the whole body of the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rober-leighton.html">Rober Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works new ed. (London: Duncan, 1830), vol. 4, ‘A Modest Defence of Moderate Episcopacy, as Established in Scotland at the Restoration of King Charles II [1660]’</cite>, pp. 391-92</span></figcaption>

</figure><figure class="quote" id="q-fdf1d500b0" data-kw="">
<blockquote><p>And yet we conceive another case… wherein this submission to a new power may be called legal. For the end of all law and government is to preserve our persons and estates; and they who are in supremacy of power have power to preserve or destroy both if they please; and therefore have as great a power over our laws, which are less then our lives. So soon as one supreme power is expelled by another, law, life and estate fall all into the hands of the succeeding power; and what it does not actually take away, stands in effect as deriving from it; and if that supreme power make a sanction for our obedience to it (as always is immediately done) then we may say our submission is legal, or else the supreme power cannot make a law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-ascham.html">Anthony Ascham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bounds &amp; Bonds of Public Obedience, or a Vindication of our Lawful Submission to the Present Government… (London, 1649) This was mor than likely written by Ascham despite it being attributed to Rouse.</cite>, p. 31</span></figcaption>

<blockquote><p>And hereupon the question is wont to be demanded: Whether an evil, that is, a tyrannical magistrate be of God or no? To this I answer, that God is the author of good and not of evil. For God by nature is good, and all his purposes are good, being directed to the health and preservation, not to the destruction, of us men. Therefore the good and healthful ordaining of the magistrate, without all doubt, is of God Himself, who is the author of all goodness. But here it is requisite, that we make a difference between the office which is the good ordinance of God, and the evil person that does not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that comes of other causes, and the fault thereof is in the men and persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupts the ways of God, and by his own fault and naughtiness transgresses God’s ordinance, so far, that he does worthily deserve the name of devilish power, and not divine authority;-(we have an example hereof in the magistrate of Jerusalem: for although he were able to refer the beginning of his power by degrees unto Moses, and so unto God Himself who did ordain it; yet, for because he takes the Savior in the garden and binds Him, to his servants it is said, ‘Ye are come out as it were to a thief with swords and staves; when I was daily with you in the temple, ye stretched not forth your hands against me; but this is even your hour, and the power of darkness.’ Lo, here he calls the ordinary magistrate the power of the devil, when he abuses his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office. Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Decades, 1570’s-1580’s, as quoted in, ed. Edmund Morgan, Puritan Political Ideas, 1558-1794</cite>, pp. 18-19</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“And hereupon the question is wont to be demanded: Whether an evil, that is, a tyrannical magistrate be of God or no? To this I answer, that God is the author of good and not of evil. For God by nature is good, and all his purposes are good, being directed to the health and preservation, not to the destruction, of us men. Therefore the good and healthful ordaining of the magistrate, without all doubt, is of God Himself, who is the author of all goodness. But here it is requisite, that we make a difference between the office which is the good ordinance of God, and the evil person that does not rightly execute that good office. If therefore in the magistrate evil be found, and not the good for which he was ordained, that comes of other causes, and the fault thereof is in the men and persons, which neglect God and corrupt the ordinance of God, and not in God, nor in his ordinance: for either the evil prince, seduced by the devil, corrupts the ways of God, and by his own fault and naughtiness transgresses God’s ordinance, so far, that he does worthily deserve the name of devilish power, and not divine authority;-(we have an example hereof in the magistrate of Jerusalem: for although he were able to refer the beginning of his power by degrees unto Moses, and so unto God Himself who did ordain it; yet, for because he takes the Savior in the garden and binds Him, to his servants it is said, ‘Ye are come out as it were to a thief with swords and staves; when I was daily with you in the temple, ye stretched not forth your hands against me; but this is even your hour, and the power of darkness.’ Lo, here he calls the ordinary magistrate the power of the devil, when he abuses his power. What could be more evidently spoken? But here ye must mark, that the reproach was in the person, and not in the office. Likewise also the Roman empire was ordained by God, as by the visions of Daniel it is clearly evident: and yet, when Nero, not without God’s ordinance, bare the sway in the empire, whatsoever he did as king and emperor, contrary to the office of a good king, that did he not of God, but of the devil…”

— Heinrich Bullinger, The Decades, 1570’s-1580’s, as quoted in, ed. Edmund Morgan, Puritan Political Ideas, 1558-1794, pp. 18-19">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+hereupon+the+question+is+wont+to+be+demanded%3A+Whether+an+evil%2C+that+is%2C+a+tyrannical+magistrate+be+of+God+or+no%3F+To+this+I+answer%2C+that+God+is+the+author+of+good+and+not+of+evil.+For+God+by+nature+is+good%2C+and+all+his+purposes+are+good%2C+being+directed+to+the+health+and+preservation%2C+not+to+the+destruction%2C+of+us+men.+Therefore+the+good+and+healthful+ordaining+of+the+magistrate%2C+without+all+doubt%2C+is+of+God+Himself%2C+who+is+the+author+of+all+goodness.+But+here+it+is+requisite%2C+that+we+make+a+difference+between+the+office+which+is+the+good+ordinance+of+God%2C+and+the+evil+person+that+does+not+rightly+execute+that+good+office.+If+therefore+in+the+magistrate+evil+be+found%2C+and+not+the+good+for+which+he+was+ordained%2C+that+comes+of+other+causes%2C+and+the+fault+thereof+is+in+the+men+and+persons%2C+which+neglect+God+and+corrupt+the+ordinance+of+God%2C+and+not+in+God%2C+nor+in+his+ordinance%3A+for+either+the+evil+prince%2C+seduced+by+the+devil%2C+corrupts+the+ways+of+God%2C+and+by+his+own+fault+and+naughtiness+transgresses+God%E2%80%99s+ordinance%2C+so+far%2C+that+he+does+worthily+deserve+the+name+of+devilish+power%2C+and+not+divine+authority%3B-%28we+have+an+example+hereof+in+the+magistrate+of+Jerusalem%3A+for+although+he+were+able+to+refer+the+beginning+of+his+power+by+degrees+unto+Moses%2C+and+so+unto+God+Himself+who+did+ordain+it%3B+yet%2C+for+because+he+takes+the+Savior+in+the+garden+and+binds+Him%2C+to+his+servants+it+is+said%2C+%E2%80%98Ye+are+come+out+as+it+were+to+a+thief+with+swords+and+staves%3B+when+I+was+daily+with+you+in+the+temple%2C+ye+stretched+not+forth+your+hands+against+me%3B+but+this+is+even+your+hour%2C+and+the+power+of+darkness.%E2%80%99+Lo%2C+here+he+calls+the+ordinary+magistrate+the+power+of+the+devil%2C+when+he+abuses+his+power.+What+could+be+more+evidently+spoken%3F+But+here+ye+must+mark%2C+that+the+reproach+was+in+the+person%2C+and+not+in+the+office.+Likewise+also+the+Roman+empire+was+ordained+by+God%2C+as+by+the+visions+of+Daniel+it+is+clearly+evident%3A+and+yet%2C+when+Nero%2C+not+without+God%E2%80%99s+ordinance%2C+bare+the+sway+in+the+empire%2C+whatsoever+he+did+as+king+and+emperor%2C+contrary+to+the+office+of+a+good+king%2C+that+did+he+not+of+God%2C+but+of+the+devil%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+The+Decades%2C+1570%E2%80%99s-1580%E2%80%99s%2C+as+quoted+in%2C+ed.+Edmund+Morgan%2C+Puritan+Political+Ideas%2C+1558-1794%2C+pp.+18-19&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F49c8841963.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/49c8841963.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separation-from-impure-civil-governments/#:~:text=And%20hereupon%20the%20question%20is%20wont,of%20God%2C%20but%20of%20the%20devil%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

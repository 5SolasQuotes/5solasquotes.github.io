<blockquote><p>For since it is natural and moral not only that man should worship God publicly with some external service (and indeed in the communion of saints and in a public assembly), but also that some time should be set apart for this purpose…</p></blockquote>

<blockquote><p>True worship of God may be defined generally thus: Worship of God is the true honor shown to God from a sense of his kindness and power towards us, as resulting from his Word. But this honor is not civil, but divine and religious and is seated mainly in the heart and mind. Thus worship arises from the sense of God’s power and kindness.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-5f100654c4" data-kw="">
<blockquote><p>…notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field.</p></blockquote>

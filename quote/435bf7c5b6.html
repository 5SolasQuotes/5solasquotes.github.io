<main class="wrap"><figure class="quote" id="q-435bf7c5b6" data-kw="">
<blockquote><p>That the proper observance of the Christian Sabbath is essential alike to the purity and progress of the church, and to the prosperity of the state. A church without the Sabbath is apostate; a people who habitually desecrate this divine institution have abandoned one of the grand foundations of social order and political freedom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-peck.html">Thomas Peck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Pastoral Letter on the Observance of the Sabbath (1855) in Miscellanies of Rev. Thomas E. Peck</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-620f2e4647" data-kw="">
<blockquote><p>Two prominent Westminster divines remind us of the correct interpretation of the head-covering mentioned 1 Corinthians 11, namely, that it is to be understood as a custom-able sign and not as a universal principle:

Divine Apostolical Institutions, (that we may draw to our purpose) were again of two sorts:

First, variable, or temporary, which were such injunctions as were prescribed, either for some special ends, as that law for abstaining from blood, and things strangled, Acts 15.1 for avoiding offence to the Jews, or to some special nations, or persons, as agreeable to the customs of those places and times, as that of women being vailed in the Congregations, and some other the like.

Secondly, invariable and perpetual: such as concerned the whole Church: This distinction we received from that learned and Professor; His instances of the later part of it, are Imposition of hands, in the election of Ministers, and the distinction of Deacons from the Pastors; we would say, Presbyters.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey-and-herbert-palmer.html">Daniel Cawdrey and Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sabbatum Redivivum: or, The Christian Sabbath vindicated</cite>, (London, 1652), second part, p. 463.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-be062831dc" data-kw="">
<blockquote><p>That Law was to shew them their absolute need of an Expiatory Sacrifice to take away the guilt of sin from them. It was to convince them of sin; hence we read, Heb. 10.3. In these Sacrifices there is a remembrance of sins. There were hereupon in that Law many Ceremonial uncleanness by a positive Command, added unto such as were in themselves Moral, which was to give them a deeper Conviction of sin: and this Law requiring an Offering upon the breach of any Precept Moral or Ceremonial, under a severe threatening of being cut off from their People, in case of the Omission, told them, that the wrath of God certainly abode on them, except they obtained an Interest in, and applied themselves accordingly unto another who might make an Atonement unto God for them.

It said that they could not satisfy the Justice of God for their own sins, so as to obtain a discharge from the guilt of them, by any righteousness of their own, but must have a Sacrifice to do it for them, else the Condemnation must abide upon them. The Sacrifice was to be presented, their sins must be laid on the head of it, they must be confessed over it, it must then be slain, and its blood sprinkled and poured out, and we are told Heb. 9.22. Without shedding of blood there is no remission.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The law established by the Gospel or, A brief discourse, wherein is asserted and declared, the great honour which is put upon the law of God, in the Gospel way of justification be faith alone. Being the substance of a sermon preached on the lecture in Boston, September 20. 1694</cite>, (Boston MA: Michael Perry, 1694), pp 8-9.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-8b4ec1842b" data-kw="">
<blockquote><p>The Anatomie of Abuses probably carried additional weight with a certain class, because in its attitude toward the drama it took in the first edition a liberal position. The preface of that edition was careful to explain that its author did not condemn all plays. ‘Who seeth not,’ it read, ‘that some kind of playes, tragedies and enterluds, in their own nature are not onely of great ancientie, but also very honest and very commendable exercyses,’ containing matter ‘both of doctrine, erudition, good example, and wholsome instruction; And may be vsed, in tyme and place conuenient, as conducible to example of life and reformation of maners.’ In thus commending ‘honest &amp; chast playes’ as a Godly recreation of the min,’ and as a ‘good example of life,’ Stubbes advanced close to Lodge’s position. Yet, strange to say, in all subsequent editions this explanatory preface was left out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-stubbes.html">Philip Stubbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Stubbes’ Outlook | Elbert N.S. Thompson, XX. The Controversy Between the Puritans &amp; the Stage in Yale Studies in English PhD diss. (NY: Henry Holt &amp; Co., 1903), pp. 81-82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

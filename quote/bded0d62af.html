<blockquote><p>…for God has commanded his ministers to bless his people (Num. 6:22-27), which by just analogy belongs to the ministers of the gospel; neither is there any ground for making herein a difference between them and the minister of the Law, but we must conceive the commandment to tie both alike to the blessing of God’s people… And if we farther consider, that the duty of blessing was performed by the minister of the Lord (Heb. 7:6), even before the Law of Moses, we are yet more confirmed to think, that the blessing of the people was not commanded in the Law as a thing peculiar and proper to the Levitical priesthood, but as a moral and perpetual duty belonging to the Lord’s ministers forever.</p></blockquote>

</figure><figure class="quote" id="q-07a400f136" data-kw="">
<blockquote><p>1. Our [Independent] Brethren say [that] it is… another thing to say [as the presbyterians] that it was impossible that they [the Christians in Jerusalem in Acts] could be one congregation and meet in one place… [Rutherford’s] Answer: …now the question then is… whether or no[t] was the Church at Jerusalem of such a competent number, only as that they could meet not only occasionally to hear a sermon, but in an ordinary Church-meeting, to hear the Word and communicate in the breaking of bread and seals of the Covenant; and though the want [lack] of a capacious house be also an extrinsic impediment why they could not meet… but it cannot be said that they wanted a capacious house for the ordinary meeting of a congregation, the ordinary and genuine use whereof is to be edified by the Word and sacraments; and that an ordinary house could contain such a number of thousands and multitudes as can be edified in a congregational way is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 1, pp. 426-27</span></figcaption>

 Books Online</a></div>
</figure><figure class="quote" id="q-18be386f2f" data-kw="">
<blockquote><p>Yea the fallible church may determine infallible points. This is a principle that Libertines proceed upon, that men who are not infallible may err, and therefore can hold forth to others no infallible truth, which is most false, for prophets and apostles, Nathan, Samuel, David, Peter, being deserted of the immediately inspiring Spirit, did err, as well as the Church and pastors now deserted of the ordinary Spirit can and do err. For ‘all men’, prophets and apostles, ‘are liars’, Rom. 3, yet they may and do carry infallible truth to others; a blind man may hold a candle to others.

3. By this reason [of the Libertines] pastors can preach nothing certain in fundamentals [which is absurd], though faith come by hearing and faith is of a certain and determinate fixed truth of God, more permanent than heaven or earth; Why? because by this reason pastors in preaching fundamentals are not infallible.

4. Nor is this a good reason: It is believed the Church may err in synods, ergo [therefore], it does err and determines nothing that is infallible and certain in synods; no more than this is a good consequence: David may sin in praying, ergo, he does sin in praying: a potentia ad actum non valet consequentia [a consequence from potential to an act is not valid].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Free Disputation Against Pretended Liberty of Conscience</cite>, … (1649), ch. 2, pp. 24-5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

<main class="wrap"><figure class="quote" id="q-27f4dbbbfd" data-kw="">
<blockquote><p>The strongest support of the doctrine of Endless Punishment is the teaching of Christ, the Redeemer of man. Though the doctrine is plainly taught in the Pauline Epistles, and other parts of Scripture, yet without the explicit and reiterated statements of God incarnate, it is doubtful whether so awful a truth would have had such a conspicuous place as it always has had in the creed of Christendom.

If, in spite of that large mass of positive and solemn threatening of everlasting punishment from the lips of Jesus Christ, which is recorded in the four Gospels, the attempt has nevertheless been made to prove that the tenet is not an integral part of the Christian system, we may be certain that had this portion of Revelation been wanting, this attempt would have been much more frequent, and much more successful.

The Apostles enter far less into detailed description, and are far less emphatic upon this solemn theme, than their divine Lord and Master. And well they might be. For as none but God has the right, and would dare, to sentence a soul to eternal misery, for sin; and as none but God has the right, and would dare, to execute the sentence; so none but God has the right, and should presume, to delineate the nature and consequences of this sentence.

This is the reason why most of the awful imagery in which the sufferings of the lost are described is found in the discourses of our Lord and Saviour. He took it upon himself to sound the note of warning. He, the Judge of quick and dead, assumed the responsibility of teaching the doctrine of Endless Retribution. “I will forewarn you whom ye shall fear: Fear him who after he hath killed hath power to cast into hell; yea, I say unto you, Fear him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Endless Punishment</cite>, (New York: Charles Scribner’s Sons, 1886), pp 12-13.</span></figcaption>

</figure><figure class="quote" id="q-0562aa81a6" data-kw="">
<blockquote><p>Oh Brethren! deceive not your selves. If this be all you look at; if, upon opening this door of hope, this be all you aim at, to make use of the time to secure your selves against oppressors, and never think of closing with God; or, but think of it; you may perhaps go far in pursuit of your own designs, in providing against the evils you sigh under; and, this Parliament may do great things this way:

But let me tell you from God, that this will never do the deed, till the Covenant we have been all this while speaking of, be resolved on, and solemnly entered into by all those that expect any blessing from that High Assembly. Nor this, nor all the Parliaments in the world shall ever be able to make in happy in such a degree at least as we expect, till the Lord hath even glued, and married us all unto himself by mutual Covenant.

It is not only the making of good Laws to remove our present grievances; no, nor the cutting down of all the evil Instruments in our State or Church at one blow, that can secure us against the like; yea, worse evils for the future; but rather, as one wave follows another, so one mischief will still tread on the heels of another, and greater plagues will ever crowd in after the former, till we close with God by such a solemn Covenant.</p></blockquote>

<blockquote><p>There is so great a difference of men and cases that it’s gross sottishness to think that their duties and sins are the same in mutable circumstances: It’s a sin to preach or pray when we should be quenching a fire, saving men’s lives. Christians, as well as Pharisees, are yet to learn what that means, “I will have mercy and not sacrifice, and therefore accuse the guiltless.” [Mt. 12:7] Some men have no possibility of any other church-worship but in the parish-churches. Some have no other possibility but what is worse. Some may have abler teachers, but at the cost of imprisonment and ruin. It is not lawful to lie in prison merely for refusing to hear a weak nonconformist when you might hear an abler: and so it is in the case of conformists, else all were bound to a few men. Some have liberty to hear fitter men, or at the least, more agreeable to them, without greater hurt than good (as the Dutch and French here have). Some are commanded by husbands, parents and masters to one church, and some to another. Some have more able and godly ministers in the parish-churches, and some have such as I would never own or encourage in the ministry by seeming to own them. Some can remove their dwelling and some cannot. Some had liberty the last year that cannot have it this year without more hurt than their benefit will compensate. In these cases where God has not at all tied us to a [Service-]book, or no book, to this church or to that, he that can truly tell which way he shall do and get most good or hurt, may by that better know his duty than by these arguments or men’s censures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), pp. 77-78</span></figcaption>

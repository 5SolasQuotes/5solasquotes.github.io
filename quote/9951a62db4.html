<main class="wrap"><figure class="quote" id="q-9951a62db4" data-kw="">
<blockquote><p>But those inventions of men and customs of the nations, which the texts alleged mention, were such as were expressly forbidden, drew them to serve other gods and to forsake the Lord, not such as are usually by Seperatives [Separatists] called ‘inventions of men’, to wit human ceremonies, confessed out of the case of worship in themselves to be things indifferent, such as out of pretended prudence at least, or public authority are imposed for discipline, order or decency without giving any divine worship to a creature. Let all the texts alleged be viewed, and there is none of them that mentions the mingling such inventions of men, no not those which our Savior reprehends in the Pharisees, Mk. 7:3-4, 8 (which are far worse [than the Anglican ceremonies]) as the departing from God’s pure institutions… and therefore the threatnings and punishments in those places are grossly abused when they are applied to the imposing or use of such ceremonies or discipline as are (whether rightly or wrongly) retained in the Church of England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England against a book unjustly entitled, A Christian testimony against them that serve the image of the beast</cite>, … (London: E. Cotes, 1667) | Section 9, ‘The defection of the Jews to idolatrous inventions of men is of a more heinous degree than use of human ceremonies with us’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

db4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-idolatry/#:~:text=But%20those%20inventions%20of%20men%20and,retained%20in%20the%20Church%20of%20England&amp;text=But%20those%20inventions%20of%20men%20and%20customs%20of&amp;text=or%20wrongly%29%20retained%20in%20the%20Church%20of%20England" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b26669486a" data-kw="Mary">
<blockquote><p>As at other times, he put a comparative neglect upon his mother, which seemed purposely designed to obviate the extravagant respect which men in aftertimes would be apt to pay her. Our respect ought to be guided and governed by Christ&#x27;s; now the virgin Mary, or Christ&#x27;s mother, is not equalled with, but postponed to, ordinary believers, on whom Christ here puts a superlative honour.</p></blockquote>

</figure><figure class="quote" id="q-5b36801b03" data-kw="Mary Queen of Heaven">
<blockquote><p>In fact it contradicts the nature of deceased saints that they should be present in and care for diverse and widely scattered places at one and the same time, as when the [papal teachers] want to put one and the same saint in charge of diverse and widely scattered places. Think of Saint James for the Spanish, who dwell in Europe, India, and America. Or Saints Dominic and Francis, etc., for all their monasteries spread across the whole globe. Or even the blessed Virgin, whom they call Queen of Heaven, Mistress of the Earth, and Star of the Sea (Stella Maris)—even though this is a wrong rendering of Drop of the Sea (Stilla maris)—since it is fitting only for God to “look down from the heavens and behold all the sons of men, and from his dwelling-place to look forth upon all the inhabitants of the earth” (Psalm 33:13–14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, Disp. 40, On the Church (vol. 2)</span></figcaption>

</figure><figure class="quote" id="q-7f6fd69470" data-kw="">
<blockquote><p>I am not, however, so superstitious as to think that all visible representations of every kind are unlawful. But as sculpture and paintings are gifts of God, what I insist for is, that both shall be used purely and lawfully, that gifts which the Lord has bestowed upon us, for his glory and our good, shall not be preposterously abused, nay, shall not be perverted to our destruction. We think it unlawful to give a visible shape to God, because God Himself has forbidden it… Visible representations are of two classes, viz., historical, which give a representation of events, and pictorial, which merely exhibit bodily shapes and figures. The former are of some use for instruction or admonition…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, (1559), bk. 1, ch. 11, section 12 trans. Beveridge</span></figcaption>

</figure><figure class="quote" id="q-fbc7626e71" data-kw="">
<blockquote><p>…it is added by the Rejoinder that Beza says of some that retain the cross, they may use their own liberty. But in the next words he adds: ‘If they have any just causes of retaining this sign in their churches.’ So that he limits that liberty unto such causes as he was not privy to; nay [not for any use] to such as they at Geneva found to be clean contrary. As for us, we have many necessary reasons why we do no way tolerate that sign, and their causes (alleged in the 8th Epistle) were not peculiar to any time or place, but pertain as well to England as to Geneva.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, pp. 7-8, 214, 232, 353, 464</span></figcaption>

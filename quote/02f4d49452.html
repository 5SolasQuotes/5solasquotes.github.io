<main class="wrap"><figure class="quote" id="q-02f4d49452" data-kw="">
<blockquote><p>[1.] In order to engage us to this charity, which would issue in an unity of measures, let us consider what melancholy consequences may ensue upon our divisions, if they be not happily removed. ‘Tis notour, they have been fatal to all societies, have tumbled down flourishing monarchies, and laid magnificent cities into ashes; they have rent Churches into pieces, and knocked religion on the head. 2. The enemies of our Zion, whose projects have been baffled of Heaven, and their counsels infatuated of God, will have this piece of satisfaction left them, to rejoice when they see us disagree among ourselves, and be pleased with the agreeable thoughts that we are about to accomplish ourselves what they designed for us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f4347ee5eb" data-kw="">
<blockquote><p>The most that these [particular] arguments of our [separatist] Brethren do prove, is but that it is lawful to go, and dwell in a congregation where Christ is worshiped in all his ordinances, rather than to remain in that congregation where He is not worshipped in all his ordinances and where the Church censures are neglected, which to us is no separation from the visible Church, but [only] a removal from one part of the visible Church to another, as he separates not out of the house, who removes from the gallery, to remain and lie and eat in the chamber of the same house, because the gallery is cold and smokey, and the chamber not so, for he has not made a vow never to set his foot in the gallery.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries... (London, 1644), pt. 1, ch. 4, section 4, question 5</cite>, p. 73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-68b231c68e" data-kw="">
<blockquote><p>You must do it in a peaceable way, so as to manifest that you desire peace, and not to be the least disturbance to the peace of the Church, but that the peace of it is dear and precious to you; therefore, when ye have witnessed the truth, and discharged your conscience in it, you must then be content to sit down quiet: For so the rule is, ‘That the spirits of the prophets must be subject to the prophets,’ in that case. But if it should prove that the Church should continue, if the evil be notorious and great as requires departing, and the Church, after all means used, and all patience, should continue in it; in such a case you may desire to be dismissed from it and depart, but in as peaceable a way as possibly can be; yet continuing in due respect unto the Church for all that, though you should depart, only leaving your witness behind you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

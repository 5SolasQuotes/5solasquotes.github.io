<main class="wrap"><figure class="quote" id="q-9cfa4ce655" data-kw="">
<blockquote><p>…one of our doctors objects that we lift up our eyes and our hands to heaven and worship God, yet do not worship the heaven: that a man going to bed prays before his bed: that David offered the sacrifices of thanksgiving in the presence of all the people, Ps. 116, that Paul having taken bread gave thanks before all them who were in the ship, Acts 27:35, that the Israelites worshipped before Moses and Aaron, Ex. 4:31. Hereupon another doctor harping on the same string tells us that when we kneel in the act of receiving the sacrament, we kneel no more to bread than to the pulpit when we join our prayers with the ministers. Oh, unworthy instances and reproachful to doctors! All these things were and are accidentally present to the worshippers and not purposely before them, not respected as having a religious state in the worship. What? do we worship before the bread in the sacrament even as before a pulpit, a bed, etc? Nay, graduate men should understand better what they speak of.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 3, ch. 4, p. 73</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-13058b77a4" data-kw="">
<blockquote><p>…he [the opponent] was required to prove it significative of some spiritual duty [in order for it to be warrant for a human, significant ceremony in worship]: For it was in probability only a common sign of subjection, as well out of an oath, as in it, without any respect unto Christ. …but men’s conceits are no great proofs. He adds 2. that if it were a sign of subjection yet might it be significant of a spiritual duty. But may be and might be is no proof.</p></blockquote>

</figure><figure class="quote" id="q-501c80bd1e" data-kw="">
<blockquote><p>Paybody thinks kneeling in the act of receiving the Communion to be expedient for the reverend using and handling of that holy sacrament, and that much reverence arises to the sacrament from it. Answer: I verily believe that more reverence arises to the sacrament from kneeling than is due to it, but I am sure there is no less true reverence of that holy sacrament among such as kneel not in the receiving of it than among such as do kneel. I hope it is not unknown how humbly and reverently many sincere Christians, with feare and trembling, do address themselves to that most holy sacrament, who yet for all the world, would not kneel in receiving it. Thus we see that these expediencies pretended for the ceremonies are attained unto as well and better without them, than by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637) | pt. 2, ch. 2, p. 14</span></figcaption>

</figure><figure class="quote" id="q-f63f38128e" data-kw="">
<blockquote><p>4. As in serious prayer, specially in secret, the affections of the heart do utter themselves in the answerable gestures of the body, as well as in the voice and words of the mouth: so those gestures have their own speech unto God, no less than the words of the mouth have; as here, ‘I have stretched out my hands unto Thee,’ is brought forth to express his submissive rendering up of himself unto God and his dependance upon him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Explication of the Last Fifty Psalms from Ps. 100 to the End</cite>, (London, 1653), on Ps., 88:9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-f073f8f4b1" data-kw="">
<blockquote><p>Swearing by appeal to God is a most solemn act of worship: but the sign of taking an oath is left free to convenient choice. Abraham‘s servant did it by putting his hand under his thigh: Was this a common law or institution? Others did it otherwise: We do it by laying our hand on the Book and kissing it. These are neither sinful additions or idolatry. The memorial of God’s works and men’s covenants were kept, sometime by pitching stones, sometime by pillars, sometime by set days (as the Feast of Purim), sometime by laying up the ensigns (as Goliah‘s sword, etc.). And all these lawful and no idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes, or Two Sorts of Sinful Separation</cite>, … (London: 1684), pt. 2, pp. 13-14</span></figcaption>

<blockquote><p>It would be tedious, dearly beloved, were I to recount every episode from the history of the Psalms, especially since it is necessary now to offer something from the New Testament and confirmation of the Old, lest one think the ministry of psalmody to be forbidden inasmuch as many of the usages of the Old Law have been abolished. For those things that are carnal have been rejected, circumcision for example, and the observance of the [Jewish] Sabbath, sacrifices, discrimination among foods, as well as trumpets, citharas, cymbals, and timpana (all of which are now understood to reside in the bodily members of man, and there better to sound).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niceta-of-remesiana.html">Niceta of Remesiana</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On The Benefit of Psalmody in Oliver Strunk and Leo Treitler, ed. Source Readings in Music History (New York: W. W. Norton &amp; Company, 1950, repr. 1998), 130.</span></figcaption>

<blockquote><p>It was at Poietiers that the evangelisation of France began in a systematic way. The school which Calvin here gathered round him comprehended persons in all conditions of life… They discoursed about Divine mysteries as they walked together on the banks of the neighboring torrent, the Clain, or as they assembled in the garden of the Basses Treilles, where… they often held their re-unions… By-and-by it was thought prudent to discontinue these meetings in the Basses Treilles, and to seek some more remote and solitary place of re-union. A deep and narrow ravine… then known as the ‘Cave of Benedict,’ but which from that day to this has borne the name of “Calvin’s grotto,” was selected as the scene of the future gatherings of the converts. It was an hour’s walk from the town… In this grotto, so far as the light of history serves, was the Lord’s Supper celebrated for the first time in France after the Protestant fashion. On an appointed day the disciples met here, and Calvin, having expounded the Word and offered prayer, handed round the bread and cup, of which all partook… The place had none of the grandeurs of cathedral, but ‘the glory of God and the Lamb’ lent it beauty. No chant of priest, ‘no swell of organ accompanied the service, but the devotion of contrite hearts, in fellowship with Christ, was ascending from that rocky chamber, and coming up before the throne in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/france.html">France</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First Protestant Administration of the Lord’s Supper</cite>, 1534 | J.A. Wylie, The History of Protestantism, vol. 2, p. 179</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

9084461a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/239084461a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/musical-instruments/#:~:text=It%20was%20at%20Poietiers%20that%20the,up%20before%20the%20throne%20in%20heaven&amp;text=It%20was%20at%20Poietiers%20that%20the%20evangelisation%20of&amp;text=and%20coming%20up%20before%20the%20throne%20in%20heaven" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>I have showed, how. And if you see it not: the veil may be the cause, which is very likely to be laid on your heart in reading of the new testament, as it was on the heart of others, in reading of the old. …Whereas Christians, of the other side, neither have those altars, or offerings made thereon to join with their spiritual sacrifice of praise, and they may sing the songs of the Lord in all places. No land is strange: no ground unholy. Every coast is Jewry, and every town Jerusalem, and every house Zion, and every faithful company, yea every faithful body a temple to serve God in. …But these points of difference between us and them be perhaps the harder for you to understand, because your Popish worship is so like the Jewish, both for the temple, and the ceremonies, that you may justly think their worship was in spirit and truth as much as yours. For as the Priest with them was severed from the people by the division of the sanctuary and court of the temple: s so with you, by the chancel and body of the church. As with them he burned incense at the altar: so with you he doth. As with them he was clad in an Ephod, a miter, a broidered coat, a girdle, a breastplate, and a robe, and they who served him were in their linen coats too: so with you he must have an amice, an alb, a girdle, a fanel, a chisible, and a stole, and they who are about him have surplices, yea, copes also. Their Priests had a laver whereat they must wash before they sacrificed: so have yours. Your veil between the choir and the altar in lent, resembles theirs, that severed the holy place from the most holy. Your Pyx with the sacrament and their ark with the mercy seat: your phylactery with saints relics, and their pot with manna: your monstrancy with the host, and their table with the show-bread: your holy oil of balm, and theirs of myrrh with spices: their purifying water made of the ashes of an heifer, and a yours of other ashes with water, wine, and salt: their fire sent from heaven, and yours fetched thence by art: their rod of Aaron, and your cross of Christ: finally your candles, or tapers, or torches, and their candlestick with lamps, do match one an other in proportion of rites: nay. you surpass them in your candles. For theirs were lighted in the night: yours, in the day too. Theirs, in the temple only: yours, abroad also. Theirs, before the Lord: yours, before images. Theirs, in one manner: yours, with great variety. Theirs, in small number: yours, at times, and places, as many as the sand of the sea. And what should I speak of the rest of the things in which you do not only follow their ceremonies, but also go beyond them? Your consecrating of Bishops, of Churches, of altars, of patents, of chalices, and other instruments of your priesthood, by anointing them, according to the order of Aaron and the tabernacle. Your shaving, as of Levites: your imagery, as from Solomon: your hallowing of men, bells, ashes, boughs, bread, the paschal Lamb, the paschal taper, agnus-Dei (and what not?) with exorcised water: wherewith almost all things are purged by your law, as by theirs with blood. Your purifying (as they called it) or (as you term it) reconciling of a churchyard, or other sacred place, if it be polluted. In conclusion, to pass over your festival days, exceeding theirs in shadows: your mystical devices in sacraments, to their pattern: your pontifical robes, in figures incomparable, in number double unto theirs: and infinite solemnities of your highest priest, who enters once a year into the place most holy, as did the high priest of the Jews: your daily sacrifice of the mass, though inferior to theirs in that it is no burnt offering, wherein yet I marvel you came no nearer them, for as they kept fire on the altar always, so do you require it, and what should you have fire upon your altar as they had, unless you burn as they did? but your daily sacrifice of the mass is celebrated in such Levitical sort, as if you contended to set forth a Jewish worship more lively then the Levitical priests could. In attire like them, in mysteries above them, in orders more exquisite, in cauteles more diligent, in furniture abundantly: in lifting up the whole host, and not (as they) a part of it, in ringing of the sacring bell to countervail their trumpets: in washing often, in blessing and crossing, in censing often, in soft speech and whispering, in kissing of the amice, kissing of the fanel, kissing of the stole, kissing of the altar, kissing of the book, kissing of the priests’ hand, and kissing of the pax: in smiting and knocking, in gesturing by rule and measure, in bowing and ducking, in spacing forward, backward, and turning round about, and traversing of the ground, beside the sweet music of organs, and so forth, where it may be had, as in the temple it might. …But in very truth it is more than Jewish: and his conceit thereof is childish, and carnal. For although it might be delightful to the flesh, the eyes with gallant sights: the ears, with pleasant sounds: the nose, with fragrant savors: the mind, with show of godliness, to him that does not understand: yet a spiritual man would be grieved at it, as Paul was in Athens, and lament that the people should dote upon that by which they are not edified, and weep over them as Christ over Jerusalem, O if you had known at least in this thy day those things which belong unto your peace: but now are they hidden from your eyes. The Lord take away this veil from your heart, if it be his good pleasure: that you may see at length, what it is to worship him in spirit and truth, and when you see it, do it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The summe of the conference between John Rainoldes and John Hart: touching the head and the faith of the Church</cite>, (London, 1598), 490–93. [spelling modernized]</span></figcaption>

l sort, as if you contended to set forth a Jewish worship more lively then the Levitical priests could. In attire like them, in mysteries above them, in orders more exquisite, in cauteles more diligent, in furniture abundantly: in lifting up the whole host, and not (as they) a part of it, in ringing of the sacring bell to countervail their trumpets: in washing often, in blessing and crossing, in censing often, in soft speech and whispering, in kissing of the amice, kissing of the fanel, kissing of the stole, kissing of the altar, kissing of the book, kissing of the priests’ hand, and kissing of the pax: in smiting and knocking, in gesturing by rule and measure, in bowing and ducking, in spacing forward, backward, and turning round about, and traversing of the ground, beside the sweet music of organs, and so forth, where it may be had, as in the temple it might. …But in very truth it is more than Jewish: and his conceit thereof is childish, and carnal. For although it might be delightful to the flesh, the eyes with gallant sights: the ears, with pleasant sounds: the nose, with fragrant savors: the mind, with show of godliness, to him that does not understand: yet a spiritual man would be grieved at it, as Paul was in Athens, and lament that the people should dote upon that by which they are not edified, and weep over them as Christ over Jerusalem, O if you had known at least in this thy day those things which belong unto your peace: but now are they hidden from your eyes. The Lord take away this veil from your heart, if it be his good pleasure: that you may see at length, what it is to worship him in spirit and truth, and when you see it, do it.”

who+enters+once+a+year+into+the+place+most+holy%2C+as+did+the+high+priest+of+the+Jews%3A+your+daily+sacrifice+of+the+mass%2C+though+inferior+to+theirs+in+that+it+is+no+burnt+offering%2C+wherein+yet+I+marvel+you+came+no+nearer+them%2C+for+as+they+kept+fire+on+the+altar+always%2C+so+do+you+require+it%2C+and+what+should+you+have+fire+upon+your+altar+as+they+had%2C+unless+you+burn+as+they+did%3F+but+your+daily+sacrifice+of+the+mass+is+celebrated+in+such+Levitical+sort%2C+as+if+you+contended+to+set+forth+a+Jewish+worship+more+lively+then+the+Levitical+priests+could.+In+attire+like+them%2C+in+mysteries+above+them%2C+in+orders+more+exquisite%2C+in+cauteles+more+diligent%2C+in+furniture+abundantly%3A+in+lifting+up+the+whole+host%2C+and+not+%28as+they%29+a+part+of+it%2C+in+ringing+of+the+sacring+bell+to+countervail+their+trumpets%3A+in+washing+often%2C+in+blessing+and+crossing%2C+in+censing+often%2C+in+soft+speech+and+whispering%2C+in+kissing+of+the+amice%2C+kissing+of+the+fanel%2C+kissing+of+the+stole%2C+kissing+of+the+altar%2C+kissing+of+the+book%2C+kissing+of+the+priests%E2%80%99+hand%2C+and+kissing+of+the+pax%3A+in+smiting+and+knocking%2C+in+gesturing+by+rule+and+measure%2C+in+bowing+and+ducking%2C+in+spacing+forward%2C+backward%2C+and+turning+round+about%2C+and+traversing+of+the+ground%2C+beside+the+sweet+music+of+organs%2C+and+so+forth%2C+where+it+may+be+had%2C+as+in+the+temple+it+might.+%E2%80%A6But+in+very+truth+it+is+more+than+Jewish%3A+and+his+conceit+thereof+is+childish%2C+and+carnal.+For+although+it+might+be+delightful+to+the+flesh%2C+the+eyes+with+gallant+sights%3A+the+ears%2C+with+pleasant+sounds%3A+the+nose%2C+with+fragrant+savors%3A+the+mind%2C+with+show+of+godliness%2C+to+him+that+does+not+understand%3A+yet+a+spiritual+man+would+be+grieved+at+it%2C+as+Paul+was+in+Athens%2C+and+lament+that+the+people+should+dote+upon+that+by+which+they+are+not+edified%2C+and+weep+over+them+as+Christ+over+Jerusalem%2C+O+if+you+had+known+at+least+in+this+thy+day+those+things+which+belong+unto+your+peace%3A+but+now+are+they+hidden+from+your+eyes.+The+Lord+take+away+this+veil+from+your+heart%2C+if+it+be+his+good+pleasure%3A+that+you+may+see+at+length%2C+what+it+is+to+worship+him+in+spirit+and+truth%2C+and+when+you+see+it%2C+do+it.%E2%80%9D%0A%0A%E2%80%94+John+Rainolds%2C+The+summe+of+the+conference+between+John+Rainoldes+and+John+Hart%3A+touching+the+head+and+the+faith+of+the+Church+%28London%2C+1598%29%2C+490%E2%80%9393.+%5Bspelling+modernized%5D&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41904c05b0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/41904c05b0.html">Permalink</a><a class="src" href="https://heidelblog.net/2013/10/john-rainolds-on-the-jewishness-of-roman-masses-and-instruments/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>…The reader will see that I only declared my dislike of organs in our churches, and therein I think I have better authority than those that are of another mind, forasmuch as in the Homily of the Place and time of Prayer (a book established and enjoined by the laws of the land) p. 131, they bring in some superstitious persons, complaining that they could not “hear the like piping, singing, chanting and playing upon the organs, that they could before”: To this is immediately answered thus; “But (dearly beloved) we ought greatly to rejoice and to give thanks to God, that our Churches are delivered out of those things which displeased God so sore, and filthily defiled his holy House”…</p></blockquote>

</figure><figure class="quote" id="q-9aed13649e" data-kw="">
<blockquote><p>What natural, or carnal affections may be excited by them [ceremonies], as men may inflame themselves with idols, Isa. 57:5, or what outward, outside devotion they may direct unto or excite, is uncertain; but that they are no means of stirring up the grace of God in the hearts of believers, or of the increase or strengthening of their faith, which things alone God accepts in Gospel worship, seeing they are not appointed by Him for any such purpose, is most certain: For to say that anything will effectually stir up devotion, that is, excite, strengthen or increase grace in the heart towards God, that is not of his own appointment, is on the one hand to reflect on his wisdom and care towards his Church, as if he had been wanting towards it in things so necessary, which He declares against, Isa. 5:4, ‘What,’ says He, ‘could have been done more to my vineyard, that I have not done in it?’; So on the other [hand], it extols the wisdom of men above what is meet to ascribe unto it. Shall men find out that which God would not, or could not, in matters of so great importance unto his glory and the souls of them that obey Him? yea, and it cannot be but that attendance unto them and their effects must needs divert the mind from those proper spiritual actings of faith and grace, which is its duty to attend unto. And this is evidently seen in them who indulging to themselves in their observation in multiplied instances, as in the Church of Rome, have changed the whole spiritual worship of the Church, into a theatrical pompeous show of carnal devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers, and render the worship itself in its performance more decent, beautiful and orderly…?’ pp. 57-58 This quote’s context does not specifically respect musical instruments.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-3f50691a76" data-kw="">
<blockquote><p>Now, here that exousia / power / authority is here to be understood as liberty, concerning which it was treated in Rev. 13:2, of exercising his rage against Christians through Roman idolatry, or through idolatrous princes; and therefore the beginning of those thousand years ought to be taken from the Edict of Constantine, which is in Eusebius, in which mention is made of the bound dragon. Now, the kings followed the example of the Roman Emperor, some quickly, some slowly, just as previously they had imitated the rage of the emperors against the Christians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of the Critics in The Exegetical Labors of</cite>, … Poole, vol. 82, on Rev. 15-22 ed. R. Andrew Myers (VA: Master Poole Publishing, 2010), p. 214, on Rev. 20:2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

</figure><figure class="quote" id="q-812f45c829" data-kw="">
<blockquote><p>Another important division of historical interpreters is into Post-Millennarians and Pre-Millennarians, according as the millennium predicted in Rev. 20 is regarded as past or future. Augustine committed the radical error of dating the millennium from the time of the Apocalypse or the beginning of the Christian era (although the seer mentioned it near the end of his book), and his view had great influence; hence the wide expectation of the end of the world at the close of the first millennium of the Christian church. Other post-millennarian interpreters date the millennium from the triumph of Christianity over paganism in Rome at the accession of Constantine the Great (311); still others (as Hengstenberg) from the conversion of the Germanic nations or the age of Charlemagne.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-schaff.html">Philip Schaff</a></span><span class="wk"><span class="lbl">Work:</span> <cite>History of the Christian Church</cite>, 3rd rev., (NY: Charles Scribner’s Sons, 1928), vol. 1, Apostolic Christianity, 1st Perdiod, ch. 12, section 101, ‘The Apocalypse’, p. 839</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

get="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6d5fca2ad6" data-kw="">
<blockquote><p>Those who make it fully past, begin at four periods, 1. some at Christs birth, and end at Pope Sylvester II, a magician.

2. Some at His death, and end at Benedict III, suffocated by the devil.

3. Others, at the destruction of Jerusalem, and so end it in Gregory VII, or Hildebrand.

4. Most begin it at Constantine’s reign, making this contemporary with that of Satan’s being cast from heaven, ch. 12. This is also ended, anno 1300, in Boniface VIII, when the wars against the Waldenses began. [John] Prideaux, De mille annis Apoc. does thus sum those of that opinion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Revelation</cite>, (Edinburgh: Higgins, 1658), ch. 20, Lecture 4, p. 723</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-return-of-christ-antichrist-and-the-millennium/second-coming.html">Second Coming</a></span></div>

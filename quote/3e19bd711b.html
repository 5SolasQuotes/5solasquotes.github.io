<blockquote><p>Sin is a sweet morsal that makes God’s elect sick souls ere they get it vomited up; it leaves a sting behind it, which some one time or other will create them no little pain. Elihu shows us both the case and cure, Job 33. Behold the case one may be in whom God has thoughts of love to: He darts convictions into his conscience, and makes them stick so fast, that he cannot rid himself of them, v. 16; his very body sickens, v.

19. He is chastened also with pain upon his bed, and the multitude of his bones with strong pain: He loses his stomach, v.

20. His life abhors bread, and his soul dainty meat. His body pines away, so that there is nothing on him but skin and bone; He is looking every moment when devils, those destroyers, Heb. 9:11, those murderers or manslayers, Jn. 8:44, will comeand carry away his soul to Hell. O dreadful case! yet there is hope. Now, see how the sick man is cured: The phsician’s art cannot prevail here; ‘Tis soul-trouble that has brought the body into this disorder.</p></blockquote>

</figure><figure class="quote" id="q-796a2944fa" data-kw="">
<blockquote><p>Though in some cases as we are warranted, so we are necessitated to withdraw, yet neither do we allow it upon slight or slender grounds; nor can any tender soul be forced to discountenance the ministers of Christ (I do not speak here of the prelatic curates) without great reluctancy and grief of heart, even when the grounds of it are solid and valid, and the necessity unavoidable: Therefore we reject these as insufficient grounds, besides what are given already:

1. We cannot withdraw from a minister for his infirmities and weaknesses, natural, spiritual or moral.

2. Neither for personal faults and escapes; we expect a faithful but not a sinless ministry.

3. Nor for every defect in faithfulness through ignorance, want of courage, misinformation, or being biased with affection for particular persons. We do not hold that faults in members, or defects in ministers do pollute the ordinances, and so necessitate a separation; but agree with what Mr. Durham says on Revelation, ch. 2, lect. 6, ‘Sincerity discovered will cover many faults.’

4. Nor for every discovery of hypocrisy: Though we may have ground to suspect a man’s principle and motive be not right, yet if he be following duty unblameably, and have a lawful call, what then? “Notwithstanding every way, whether in pretense or in truth, Christ is preached; therein we may rejoice,” Phil. 1:18.

5. Nor yet for real scandals not attended with obstinacy, if ministers will take reproof and admonition, and at least by doctrinal confessing, and practical forsaking them, satisfy the offended, etc.</p></blockquote>

</figure><figure class="quote" id="q-8161c95a42" data-kw="">
<blockquote><p>Lawyer: But why go you to the parish-churches when you might have better? Minister:

1. All non-conformists preach not better than many of them; yea, the liturgy is better words of prayer than some weak or faulty non-conformists often use.

2. A brown loaf and a white one both may be better than a white one alone; I found both best; and I knew it sin to renounce communion with any Church for weakness because they are not as good as others.

3. That is best at one time and place that is not so at another; praying in itself is better than working, and eating, sleeping. And yet in their proper time your servant’s working and your eating and sleeping is better than praying at that time. One that is a son, a servant, a wife who is commanded by the master of the family to hear a tolerable parish-minister may then find it better than disorderly and disobediently to hear an abler man; that may by variety of conditions be one man’s duty which is another’s sin.</p></blockquote>

</figure><figure class="quote" id="q-b7f4593e65" data-kw="">
<blockquote><p>James Nisbet agonized over this difficult choice… should he join the clearly imperfect Church of Scotland? Based on the following account form his memoir, it is likely that he parted from the Society shortly after the Revolution Settlement because of the dangerous errors and behaviors of its members: ‘Their criticizing upon and censuring of all others who are not exactly of their judgment in every punctilio, grievously aggravating their faults and often fixing some where there is none; yea, seldom sparing one another even where they are one in judgment, [they made] the terms of their communion straighter than what God allows in his Word. They will allow no masters of families to be of their communion who pay any taxes to the present government, making no difference betwixt this legal and the former illegal and tyrannical government. They will allow no children or servants to be in their communion who obey their parents and masters in doing any service to those in public trust in the government. They will allow none to hear any of the present ministry, even though transiently, to be in their communion. They spend the most part of their precious time in arguing and praying against the sins and defections of the public, neglecting to watch the heart; and here, to my shame, I was greatly guilty of this, among others. We spent much of our precious time in framing arguments to debate with others, greatly neglecting to be distinctly acquainted with the principles of the Christian religion and to be savingly acquainted with the inward and serious part of real godliness. They would publish a declaration disowning the authority of the great King William [of the Glorious Revolution, 1689 ff.] and against the validity of the present church communion. When I earnestly besought, with much entreaty, that every article of that declaration might be reasoned, they would not allow it… Thus my protesting, and refusing to join with them, enraged them exceedingly against me. As their scourge of tongues was grievously bent against others, so now was it against myself in a most grievous, unjust, and unreasonable manner… Thus, I left that party of the dissenters who now commonly go under the name of Mr. McMillan’s people…’ (Nisbet, Private Life, pp. 235-238)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-nisbet-moore.html">Edwin Nisbet Moore</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Our Covenant Heritage</cite>, (2000) Moore is very sympathetic with the Cameronians., p. 159</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

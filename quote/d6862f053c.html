<blockquote><p>26. In most countries of England, many hundred persons to one must have Church communion in the parish churches, or have none at all: And to renounce all Church worship and communion rather than join in the parish churches and with the liturgy, and to persuade all to do so, is almost to draw the land to live like atheists and is so pernicious to souls that no good Christian should favour it. And it is a gross breach of the [Solemn League and] Covenant [1643] which renounces profaneness, schism and all that is contrary to godliness. 27. So much are Papists angry at Protestant ministers that keep them [non-conformists] out of the parish churches, [Papists] reviling them [such Protestant ministers] as trimmers, [Papists] supposing that conventicles [worship assemblies of non-conformists] can do them less harm, that all that love the Protestant religion should do their best to encourage† all such orthodox men and to strengthen the Protestant interest in the parish churches, and not join against them with the Papists (however it be with other intents and minds).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb64ce6484" data-kw="">
<blockquote><p>Objection: But this case is unlike to that of liturgies. Answer: The Scripture is God’s own Word: A mistranslation makes that to be his Word that is not; which sure is a tenderer matter than in what words we speak our own minds to God. Sure [it is that] a depravation of Scripture is more [of a depravavation] than [that of] a ceremony: Were liturgies such an alteration of God’s own words, you would more plausibly accuse them. One that said, ‘God said this’ or that, which He said not, was worse than one that spake his own words indecently to God. To say, ‘This is God’s Word,’ which is not, is indeed adding to it [Prov. 30:6]; but so it is not to speak words as our own. How much the Septuagint differs from the Hebrew, how many verses it leaves out, how many additions and alterations it makes, is commonly known. Christ’s and the apostles’ use of this was no approbation of its faults, much less their presence in the synagogues when others read Moses and the prophets in them. And the Psalms in the Septuagint translation were part of their liturgy. For man to speak faultily is no wonder: It has a more plausible pretence for separation to say that men corrupt the Word of God. And yet when it is but such an effect of human imperfection, it is no just pretence. But yet a word more: Question 1: Do you think that the Pharisees and scribes had so much of the gift of extemporary prayer that they could, and did use to make long prayers, as if it were by the spirit-extempore? Say so and you will disgrace the doctors’ arguments that lay so much on this manner of praying [by forms]. No doubt but it was forms and liturgies that they used; yet when Christ condemns them for praying in the streets to be seen and using long prayer for a pretence to devour widows’ houses: 2. Did Christ speak one word against them as forms or liturgies? Did He want [lack] zeal or knowledge? 3. Had they not been good in themselves, what cloak could they have made for so great evil? 4. Did Christ or his apostles ever forbear [abstain from] the synagogues for the sake of these long liturgies?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation &amp; Conformity | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 5, ‘A comparison of the use of a faulty translation of the Scripture and a faulty liturgy’ | Bad Translation &amp; Bad Liturgy</cite></span></figcaption>

<blockquote><p>11. He [a schismatic] condemns as idolaters all the Churches on earth for six hundred, if not one thousand years after the apostles; not one Church, Christian or heretic (as far as any history tells us that I have found), did ever deny such things as he calls false worship or idolatry. They all went further than our [Anglican] parish churches do. At baptism they used the white garment, tasting milk and honey, chrism or anointing the forehead, crossing; they adored only standing, and not kneeling, every Lord’s Day, all as significant ceremonies: No one Church or person is said to scruple these; I think they did not [do] well: but God rejected not their worship. 12. He makes all or near all the Churches on earth idolaters at this day: All on earth save the Protestants are far grosser in their liturgies and ceremonies than the English: Of the Protesants, Sweden, Denmark, Saxony and all the Lutherans have liturgies, crossing, ceremonies, church-images, consubstantiation. The Helvetians [Swiss] are such as are called Erastians, making the magistrate the only ruler, and [making] sacraments common [to all, having no excommunication]. Geneva and France, yea and Holland, have their liturgies and some rites.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes… (London: 1684), pt. 2</cite>, p. 15</span></figcaption>

<blockquote><p>The scribes and Pharisees in the days of our Savior said but did not; laid heavy burdens on the people, which themselves would not touch with one of their fingers… yet the Lord Himself, who reproved them, heard them and charged his disciples to hear them, because they sat in Moses’s seat. Let it be observed and remembered: the authority may, but the quality of the minister does not add to or abstract from the entity or efficacy of God’s ordinances; he may preach to my salvation who is himself a castaway.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland.</cite>, p. 16</span></figcaption>

<blockquote><p>But, lest any honest Christian should by his frequent distractions be discouraged from his duties, or in his holy duties, I shall… prevent such a temptation by laying down some encouragements: … The fifth encouragement is that our God can gather some sense out of a distracted duty, and do us some good by it. Rom. 8:27, ‘He that searcheth the hearts, knoweth what is the mind of the Spirit;’ ’tis true of our spirit as well as of God’s. The great searcher of hearts knows what you came pregnant with, what you meant, though you missed it in the delivery. He can tell what was written in the letter, though it did miscarry, and will answer your godly meaning, and overlook your unwilling failing, Ps. 103:13, ‘As a father pitieth his children, so the Lord…’ Why, the child comes sometimes full of a suit to the Father, and he is quite out in his tale, has forgotten what he would have, but the Father knows what he wants and what he would have said, and grants the whole. And so, provided thou be a child, and art heartily sensible of thy wants, and comest panting to the Throne of Grace; thy heavenly Father will accept thy meaning, and grant thy petition…</p></blockquote>

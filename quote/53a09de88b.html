<blockquote><p>‘he shall ask,’ i.e. with confidence, as 1 John 5:14. But ‘there is a sin unto death,’ i.e… of such as have apostatized from a former specious profession into heresy and debauchery, and continue obstinate therein, against all methods of recovery; that are, as Jude 1:12, even twice dead, etc. ‘I do not say that he shall pray for it;’ i.e. I do not give that encouragement to pray for such, with that hope and expectation of success, as for others; though he does not simply forbid praying for them neither.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Matthew Poole, Annotations, on 1 John</cite>, ch. 5, verse 16. Poole died previous to completing his Annotations; Howe was the continuator for 1 John.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c5bbff1a1" data-kw="">
<blockquote><p>The faithless are the enemies of God and some of them the enemies of our Church and country, and some enemies to ourselves; and shall we pray for such? Although now they be the enemies of God, yet hereafter they may become friends and be reconciled unto Him: whereof our prayer may be a means: And therefore howsoever we are to pray against their wicked practices, we are to pray for their persons, that they of enemies may become friends; of infidels, faithful; of heretics and schismatics, sound Christians; of wicked and profane, religious and holy: ‘for this is good and acceptable in the sight of God our Savior, who wills that all men should be saved and come unto the knowledge of the truth.’ (1 Tim. 2:4) Examples of them who have prayed for the wicked are very many in the Word of God: As of Abraham, for the Sodomites, Gen. 18, Moses, for the rebellious Israelites, Ex. 32, yea, for Pharaoh and the Egyptians; Samuel, for Saul, the man of God for Jerdboam, 1 Kn. 13. But why seek [????] examples? We have a commandment to pray for such as have sinned not unto death, and a promise to procure mercy for them, 1 Jn. 5:16, and a complaint of God when this is not performed, Eze. 22:30. Prayers made for the wicked are many times without fruit. If they be without fruit, though they be to them idle, yet not to thee: Thy prayer shall return into thine own bosom, Ps. 35:13, according to that, Mt. 10:13, ‘When ye come into an house, salute it, or wish peace unto it: if the house be worthy, let your peace come upon it; but if it be not worthy, let your peace return to you.’ As for those that be our enemies, though the Schoolmen teach that we are not, or at least need not, specially to pray for them, yet our Savior Christ has commanded us to love our enemies, to bless them that curse us and to pray for them who despitefully use us and persecute us. So Jer. 29:7; Rom. 12:14. And this was practiced by our Savior, Lk. 13:34, by Stephen, Acts 7:60.</p></blockquote>

</figure><figure class="quote" id="q-ca7db8ecf7" data-kw="">
<blockquote><p>But here arises a doubt: Are we not to pray for wicked men, yea, the impenitent, the persecutors of the Church, contemners of the Word? I answer:

1. Yea, partly because we know not the secret purposes of God’s grace. Christ in the light of his divinity, knew the elect and the reprobate, but we know not, therefore we are to pray for them that persecute, Mt. 5:44. Paul once breathed out threatenings against the Church; Christ received gifts for the rebellious; partly because many wicked men are considerable in their station, therefore, at least, we pray for temporal blessings for them, though we have little hopes that ever they shall be gained to the knowledge of the truth. Thus we are to pray for wicked rulers, for the conservation of human society, they may serve as a thorn hedge about a garden of roses. Thus it is said, Ezra 6:10, that in the Temple they should pray for the life of the king and of his sons, meaning the King of Babylon, Darius, at least for temporal favors.

2. We have not such encouragement to pray for them as for the saints: For the saints we pray out of the unity of the Spirit, for wicked men, out of common charity: for the saints we pray out of a delight in their graces; for wicked men, out of a loose possible hope. Heb. 13:18, ‘Pray for us, for we trust that we have a good conscience in all things, willing to live honestly.’ These should have the greatest share of our prayers; we have the more encouragements and hopes of them, which should be an engagement to us to pray for them.

3. Conditionally we may pray against the obstinate and them that sin of malicious wickedness. There are many imprecations in Ps. 109 which are not to serve our private revenge, but by us to be conceived conditionally: Those curses are uttered against Judas in a prophetical spirit, and therefore not to be drawn into example, to justify any heats of revenge and private passion. 1 Jn. 5:16: ‘If any man see his brother sin a sin which is not unto death, he shall ask, and he shall give him life for them that sin not unto death. There is a sin unto death; I do not say that he shall pray for it.’ It is a tempting of God to intercede for that sin, seeing He has declared his will; the irremissible sin, is that sin, though it be hard to be found out. Therefore it is good to keep to the conditional form when a man, after the profession of religion, falls to an utter revolt and deadly hatred of it: it is a shrewd presumption they have committed that sin.

4. We feel sometimes a restraint upon our prayers. God by oracle forbade the prophet to pray for the people; Jer. 7:16: ‘Therefore pray not thou for this people, neither lift up cry nor prayer for them, neither make intercession to Me, for I will not hear thee.’ When He was resolved to put his wrath in execution, He would not have his people’s prayers lost; and still the same Spirit that stirs up to prayer searches out the deep counsels of God. So that there is a kind of prophetical light in prayers; God [at times] suspends the servency and actual assistance, by which we are carried on at other times. I would not justify every private passionate conceit, but yet we must look upon the Spirit of God as the interpreter of God’s counsel, and that He will not stir up prayers to no purpose. Yea, sometimes we feel that after much striving, we have no heart to pray for them, which is a very great mark of God’s displeasure upon any person, when God’s people, yea, even after much struggling with themselves, have no heart to pray for him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Volume of Sermons preached by the late reverend and learned Thomas Manton in two parts: the first containing 27 Sermons on the Twenty-Fifth chapter of St. Matthew</cite>, … (d. 1677; London: Astwood, 1684), Sermons on John 17, Sermon 12, on Jn. 17:9, p. 106-7</span></figcaption>

+we+may+pray+against+the+obstinate+and+them+that+sin+of+malicious+wickedness.+There+are+many+imprecations+in+Ps.+109+which+are+not+to+serve+our+private+revenge%2C+but+by+us+to+be+conceived+conditionally%3A+Those+curses+are+uttered+against+Judas+in+a+prophetical+spirit%2C+and+therefore+not+to+be+drawn+into+example%2C+to+justify+any+heats+of+revenge+and+private+passion.+1+Jn.+5%3A16%3A+%E2%80%98If+any+man+see+his+brother+sin+a+sin+which+is+not+unto+death%2C+he+shall+ask%2C+and+he+shall+give+him+life+for+them+that+sin+not+unto+death.+There+is+a+sin+unto+death%3B+I+do+not+say+that+he+shall+pray+for+it.%E2%80%99+It+is+a+tempting+of+God+to+intercede+for+that+sin%2C+seeing+He+has+declared+his+will%3B+the+irremissible+sin%2C+is+that+sin%2C+though+it+be+hard+to+be+found+out.+Therefore+it+is+good+to+keep+to+the+conditional+form+when+a+man%2C+after+the+profession+of+religion%2C+falls+to+an+utter+revolt+and+deadly+hatred+of+it%3A+it+is+a+shrewd+presumption+they+have+committed+that+sin.+4.+We+feel+sometimes+a+restraint+upon+our+prayers.+God+by+oracle+forbade+the+prophet+to+pray+for+the+people%3B+Jer.+7%3A16%3A+%E2%80%98Therefore+pray+not+thou+for+this+people%2C+neither+lift+up+cry+nor+prayer+for+them%2C+neither+make+intercession+to+Me%2C+for+I+will+not+hear+thee.%E2%80%99+When+He+was+resolved+to+put+his+wrath+in+execution%2C+He+would+not+have+his+people%E2%80%99s+prayers+lost%3B+and+still+the+same+Spirit+that+stirs+up+to+prayer+searches+out+the+deep+counsels+of+God.+So+that+there+is+a+kind+of+prophetical+light+in+prayers%3B+God+%5Bat+times%5D+suspends+the+servency+and+actual+assistance%2C+by+which+we+are+carried+on+at+other+times.+I+would+not+justify+every+private+passionate+conceit%2C+but+yet+we+must+look+upon+the+Spirit+of+God+as+the+interpreter+of+God%E2%80%99s+counsel%2C+and+that+He+will+not+stir+up+prayers+to+no+purpose.+Yea%2C+sometimes+we+feel+that+after+much+striving%2C+we+have+no+heart+to+pray+for+them%2C+which+is+a+very+great+mark+of+God%E2%80%99s+displeasure+upon+any+person%2C+when+God%E2%80%99s+people%2C+yea%2C+even+after+much+struggling+with+themselves%2C+have+no+heart+to+pray+for+him.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+A+Second+Volume+of+Sermons+preached+by+the+late+reverend+and+learned+Thomas+Manton+in+two+parts%3A+the+first+containing+27+Sermons+on+the+Twenty-Fifth+chapter+of+St.+Matthew%2C+%E2%80%A6+%28d.+1677%3B+London%3A+Astwood%2C+1684%29%2C+Sermons+on+John+17%2C+Sermon+12%2C+on+Jn.+17%3A9%2C+p.+106-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca7db8ecf7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ca7db8ecf7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/of-the-sin-against-the-holy-spirit/#:~:text=But%20here%20arises%20a%20doubt%3A%20Are,no%20heart%20to%20pray%20for%20him&amp;text=But%20here%20arises%20a%20doubt%3A%20Are%20we%20not&amp;text=themselves%2C%20have%20no%20heart%20to%20pray%20for%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

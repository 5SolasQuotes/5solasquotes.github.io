<main class="wrap"><figure class="quote" id="q-3d85e80ba9" data-kw="">
<blockquote><p>Let me therefore warn young men to dread the sin of drunkenness; keep at a distance from it; avoid all appearances of it, and approaches towards it. It has slain its thousands,—its ten thousands of young people; has ruined their health, brought diseases upon them, and cut them off in the flower of their days.

How many fall unpitied sacrifices to this base lust? It has ruined their estates and trades at their first setting out; when the time that should have been spent in the shop and warehouse, is spent in the tavern and alehouse,—when the money they should buy goods with, and pay their debts with, is thrown away in the gratification of an inordinate love of wine and strong drink, no wonder if they soon break, and flee their country.

Take heed of the beginnings of this sin, for the way of it is down-hill; and many, under pretence of an innocent entertainment, and passing the evening in a pleasant conversation, are drawn in to drink to excess, and make beasts of themselves; and you should tremble to think how fatal the consequences of it are, how unfit it renders you for the service of God at night, yea, and for your own business the next morning,—how many are thus besotted, and sunk in to that drowsiness which clothes a man with rags; and yet that is not the worst,—it extinguishes convictions and sparks of devotion,—and provokes the Spirit of grace to withdraw, and it will be the sinner’s eternal ruin, if it be not repented of, and forsaken in time; for the word of God hath said it, and it shall not be unsaid, it cannot be gainsaid, that ‘drunkards shall not inherit the kingdom of God.’

‘Look not then upon the wine when it is red, when it gives its colour in the cup, is charming, is tempting; be not overcome by its allurements, for at the last it ‘bites like a serpent, and stings like an adder.’ If you saw the devil putting the cup of drunkenness into your hand, I dare say, you would not take it out of his: you may be sure the temptation to it comes from him, and therefore ought to dread it as much as if you saw it. If you saw poison put into the glass, you would not drink it; and if it be provoking to God, and ruining to your souls, it is worse than poison; there is worse than death, there is hell in the cup, and will you not then refuse it?

How many ways may you spend your evening, when you are fatigued with the business of the day, better than in drinking? I am sorry we cannot urge against you, so much as gladly we would, the scandal of it,—it is grown so fashionable. But whether you will hear, or whether you will forbear, we will insist upon the sin of it, and its prejudice to the soul both here and forever, and beg of you in consideration of this, to frighten yourselves from it; we will insist likewise upon the real disgrace that it is to a reasonable creature, who is hereby spoiled of his crown, and levelled with the brutes, and beg of you in consideration of this, to shame yourselves out of it before God and your own conscience.

It is a sin that is in a special manner shameful and hurtful to those who profess religion. You that have been well educated, that have been bred up in sober families, have had examples of sobriety set you, and have known what the honours and pleasures of a sober conversation are, if, when you set up for yourselves, you think yourselves happy in getting clear from the restraints of a sober regimen, and take the liberty of the drunkards, what a reproach will it be to you ! what a degeneracy what a fall from your first love! and where will it stop?

Perhaps you have given up your names to the Lord Jesus at his table, and dare you partake of the cup of the Lord, and the cup of devils? Let Christians that are made to our God kings and priests, take to themselves the lesson which Solomon’s mother taught him, ‘It is not for kings, O Lemuel, it is not for kings; so it is not for Chris tians, ‘to drink wine,’ but with great moderation, ‘lest they drink and forget the law,’ forget the gospel, Prov. xxxi. 4, 5.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sober-Mindedness Pressed upon Young People, in a Discourse on Titus II.6</cite>, (1712) in The Complete Works of the Rev. Matthew Henry; Being a Collection of all his Treatises, Sermons, and Tracts, as Published by Himself: And a Memoir of his Life (2 vols, Edinburgh: A. Fullarton and Co., 1853), 1: 64-65.</span></figcaption>

<blockquote><p>First, the Scripture will inform us that singing of Psalms is a necessary and profitable duty:

1. A necessary duty, because God requires it, Eph. 5:17-19. It is the will of God that (on the one side) Christians should not be drunk with wine; and, on the other side, be filled with the Spirit, speaking to themselves in Psalms, etc. (Col. 3:16; Beza (in location) shows that the three Greek words that are translated Psalms, Hymns, and Songs, are the same that are used by the Septuagint to render the Hebrew words, which are the Titles of diverse Psalms, which we call the Psalms of David) [We have not been able to find this reference in Beza’s NT Commentary] It is the Spirit of God that saith to the afflicted, ‘Pray’; and to the merry, ‘Sing psalms‘, Jam. 5:13.

2. And a profitable duty, because the Spirit of God declares unto us the benefit of it, prescribing that the Word of God should dwell in us richly, and then adding further, ‘teaching and admonishing one another in psalms’, etc. Now it’s true, that teaching and admonishing may be referred either to the Word of God going before, or to psalms and hymns following after; but, it comes all to one, if the psalms, hymns, and songs spoken of there, be such as are recorded in Scripture, for then they are a part of the Word of God: and so the intent of the apostle may be to show that of every part of the Word of God, and in particular of the psalms and songs thereof (the rejoicing part) use is to be made for our edification; thereby something may be added to our light in a teaching way, and to our life and vigor in piety in an admonishing way. Secondly, the Scripture gives excellent rules also for singing, that it may be a profitable duty; As that it be, 1. With understanding, Ps. 47:7; 1 Cor. 14:14-15.

2. With the heart and affection; not without the voice: but the meaning is, that we should not please and content our selves with the outward sound without an inward sense.

3. With grace in the heart, Col. 3:16, that is, (as I conceive), with a godly and gracious frame of heart inwardly, (according as the matter of the Psalm is), showing itself in a graceful and dexterous demeanor in that duty outwardly (as in a comely and reverent gesture, a decent tune and tone)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-thomas.html">William Thomas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Preservative of Piety in a Quiet Reasoning for those duties of religion, that are the means and helps appointed of God for the preserving and promoting of godliness</cite>, … (London, 1662), Pt. 2, Ch. 4, ‘Of Singing of Psalms, and namely, in Families’, pp. 195-6. Thomas was a rector in the Anglican Church.</span></figcaption>

g+part%29+use+is+to+be+made+for+our+edification%3B+thereby+something+may+be+added+to+our+light+in+a+teaching+way%2C+and+to+our+life+and+vigor+in+piety+in+an+admonishing+way.+Secondly%2C+the+Scripture+gives+excellent+rules+also+for+singing%2C+that+it+may+be+a+profitable+duty%3B+As+that+it+be%2C+1.+With+understanding%2C+Ps.+47%3A7%3B+1+Cor.+14%3A14-15.+2.+With+the+heart+and+affection%3B+not+without+the+voice%3A+but+the+meaning+is%2C+that+we+should+not+please+and+content+our+selves+with+the+outward+sound+without+an+inward+sense.+3.+With+grace+in+the+heart%2C+Col.+3%3A16%2C+that+is%2C+%28as+I+conceive%29%2C+with+a+godly+and+gracious+frame+of+heart+inwardly%2C+%28according+as+the+matter+of+the+Psalm+is%29%2C+showing+itself+in+a+graceful+and+dexterous+demeanor+in+that+duty+outwardly+%28as+in+a+comely+and+reverent+gesture%2C+a+decent+tune+and+tone%29%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+William+Thomas%2C+A+Preservative+of+Piety+in+a+Quiet+Reasoning+for+those+duties+of+religion%2C+that+are+the+means+and+helps+appointed+of+God+for+the+preserving+and+promoting+of+godliness%2C+%E2%80%A6+%28London%2C+1662%29%2C+Pt.+2%2C+Ch.+4%2C+%E2%80%98Of+Singing+of+Psalms%2C+and+namely%2C+in+Families%E2%80%99%2C+pp.+195-6.+Thomas+was+a+rector+in+the+Anglican+Church.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6fa6991128.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6fa6991128.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=First%2C%20the%20Scripture%20will%20inform%20us,gesture%2C%20a%20decent%20tune%20and%20tone&amp;text=First%2C%20the%20Scripture%20will%20inform%20us%20that%20singing&amp;text=and%20reverent%20gesture%2C%20a%20decent%20tune%20and%20tone" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-992ebd07b1" data-kw="">
<blockquote><p>Of course there are many other arguments for the use of hymns, as, for instance, that the Psalms are unsuitable for New Testament worship, breathe a spirit of revenge, and so forth, which borders, we think, on blasphemy; or that, as we are at liberty to pray in our own words, so we must be at liberty to sing praise in our own words in answer to this is that our liberty depends altogether on God’s revealed will, not on what we may think reasonable and further, that men were at liberty to pray in Old Testament times in their own words, but were required to employ only authorized psalmody in praise; and there is no reason for change in the matter now, and no reason for supposing that men are able now to frame suitable ones of praise, when they were considered so unable then that God furnished them with songs from heaven. Besides when people sing a hymn, they are not singing in their own words, but in the words of the hymn-writer, or in the words of an ecclesiastically authorized hymn-book. And if congregations are to take words other than their own in any case, one would think they would be safer with God’s words than with man’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

<blockquote><p>My being present and hearing of a Conformist [minister is] no approbation of the evil of his conformity, and so no occasional or transient relation is raised thereby. Approbation is an act of the mind or heart; It is not showed to him or others by me until it be expressed outwardly by my words or gestures, which I have not in this case any occasion to do, his evil being done elsewhere and formerly, and not in our presence that now hear him.</p></blockquote>

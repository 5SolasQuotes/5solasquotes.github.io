<main class="wrap"><figure class="quote" id="q-c8094e9c71" data-kw="">
<blockquote><p>verse 4. That the justification of the law might be fulfilled, etc. They who understand that the renewed, by the Spirit of Christ, fulfil the law, introduce a gloss wholly alien to the meaning of Paul; for the faithful, while they sojourn in this world, never make such a proficiency, as that the justification of the law becomes in them full or complete. This then must be applied to forgiveness; for when the obedience of Christ is accepted for us, the law is satisfied, so that we are counted just. For the perfection which the law demands was exhibited in our flesh, and for this reason — that its rigor should no longer have the power to condemn us. But as Christ communicates his righteousness to none but to those whom he joins to himself by the bond of his Spirit, the work of renewal is again mentioned, lest Christ should be thought to be the minister of sin: for it is the inclination of many so to apply whatever is taught respecting the paternal kindness of God, as to encourage the lasciviousness of the flesh; and some malignantly slander this doctrine, as though it extinquished the desire to live uprightly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Romans</cite>, 8:4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a9065a3db" data-kw="">
<blockquote><p>But we are not hence to conclude that faith recumbs on works; for though every one receives a testimony to his faith from his works, yet it does not follow that it is founded on them, since they are added as an evidence. Then the certainty of faith depends on the grace of Christ alone; but piety and holiness of life distinguish true faith from that knowledge of God which is fictitious and dead; for the truth is, that those who are in Christ, as Paul says, have put off the old man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Catholic Epistles</cite>, 1 John 2:3</span></figcaption>

</figure><figure class="quote" id="q-f3c2b6d568" data-kw="">
<blockquote><p>Objection: Faith is never without good works. Therefore, it cannot justify alone. Response. Faith may be said to justify without good works in two ways: either in such a way that we say the faith which justifies does not have good works joined with it, or in such a way that we say good works are not co-causes of justification. Faith indeed is never without good works; yet it does not follow from this that good works are a co-operating cause concurring with faith unto justification. Thus, the sun never gives light without heat, yet heat is not a co-operating cause which concurs with the sun unto illumination. So faith does not justify as separated from good works, nor yet for that reason are good works a co-operating cause of our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, … (Geneva: Chovet, 1658), Arguments Proposed in Disputation against the Preceding Theses, with Solutions, To Corollary V, p. 364, trans. ChatGPT-5</span></figcaption>

</figure><figure class="quote" id="q-bb0fcd2aac" data-kw="">
<blockquote><p>6th Objection: The Messiah brings everlasting justice and righteousness. Imputed righteousness is not eternal. Therefore we are not thereby justified. Answer: It is said that Christ’s righteousness shall be an everlasting righteousness; but after a diverse manner. For in the life to come we shall be just after another manner than in this life. For although we shall then be just by the same righteousness, even by the righteousness of Christ imputed unto us: yet with this shall also the legal justice and righteousness be continued, so that then also by the legal righteousness we shall be perfectly just, because now only we are, as concerning that, but in part and beginning just. Each justice, both the justice of the Law, and the justice of the Gospel, is eternal, by continuation: And the justice and righteousness of the Gospel, that is, the justice of Christ imputed unto us, is eternal by continuation of the imputation: The justice of the Law is eternal by continuation of good works, even as it is continued by good works, first, and beginning in this life, until at length after this life it be perfected, and become perfect, and so continue to all eternity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … in his Lectures upon the Catechism… tr. Henrie Parrie (Oxford, 1587), ‘Of Justification’, 7. ‘Why Christ’s satisfaction is made ours by faith only’, ‘Objections against this Doctrine of Justification’, p. 687</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

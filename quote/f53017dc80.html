<main class="wrap"><figure class="quote" id="q-f53017dc80" data-kw="">
<blockquote><p>Although Christ is to be adored wherever He is present, it does not follow that everything in which He is present is to be adored. Christ dwells in all believers and yet believers are not to be adored with Christ… We are not bound to adore God with an external adoration wherever He is present; but only where He is present with rays of his glorious majesty and where He wishes to be adored. Otherwise as God is in all creatures (in stones, in trees and in animals), He would have to be adored in them. Thus we are commanded to adore God in the heavens, where He manifests Himself gloriously. The Israelites were bound to adore Him at the ark, which was teh symbol of his presence…. The essential and internal glory of God (which consists in the eminence of his perfections) differs from the accidental and external glory (which is placed in some sensible, miraculous and extraordinary effect; as was seen in the bush, the ark and other like symbols of God’s presence). Although the internal and essential glory is the foundation of external adoration, still it does not bind to the exercise of actual adoration unless it is connected with the external glory (i.e., with some miraculous and extraordinary effect which makes an impression on the senses). Otherwise, as God is everywhere with his essential glory and in all his creatures, He would have to be adored there (which is absurd). … The distinctions between the absolute, ultimate, intransitive, direct and formal worship (which is exhibited to Christ in the Eucharist); and the transitive, indirect, relative, and concomitant worship (given to the species of the Eucharist), cannot remove the crime of idolatry. (1) They are unknown to the Scriptures, which recognize no religious worship excepting one alone, which is absolute and direct…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3:545-46</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-81ed76e0e9" data-kw="">
<blockquote><p>Some things were created in themselves, others in their causes, such as meteors; animals that arise from the commixture of species, like mules, leopards; and according to some, insects, which are thought, but falsely, to be made from putrefaction. Some things are co-created rather than created, such as accidents and adjuncts in their subjects; universals in their species and individuals; time and place or space, in which creatures are received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), trans. AI Latin</span></figcaption>

<blockquote><p>As God did not make the whole fabric of the world at once, though it was not impossible to Him, being a God Almighty, but in the space of six days: So does God deal with his children, in creating in them a clean heart; first he suffers their hearts to be as a rude and massy lump, full of darkness, and then God sends his Holy Spirit into their hearts, and it does illuminate them; and drive away those black clouds of darkness and ignorance… 4… As the sun does now move with much celerity, so fast, that it does in the space of a day, run over many millions of miles.</p></blockquote>

<blockquote><p>So that the creation of the world was like the building of the Temple, there was no noise of any tool or hammer heard in it; but like Jonas his gourd though it was not planted, nor watered grew up on a sudden, even in the short space of six days, and this is another wonder. The Temple of Jerusalem was a stately and magnificent building, yet it was not built in less time than forty and six years, notwithstanding many hands went to it; but the whole fabric of heaven and earth was finished in the space of six days: and He that made it in so few days, could (if he had pleased) have made it in as few minutes.</p></blockquote>

<blockquote><p>‘the first day’ …This first day consisting of twenty four hours had (as some think) for the first half of it the precedent [preceeding] darkness, and for the other the light newly created: the night they take to be meant by evening, a part of it, and the day by the morning which is part of it also: and according to this the Sabbath (being as large a day as any of the rest, and so containing twenty four hours) is measured from even to even, Lev. 23:32; the Romans and other Western nations reckon the twenty four hours from mid-night to mid-night; the Egyptians contrariwise from mid-day to mid-day. Yet it may be with good probability thought that at the first (according to the Chaldean account, which is quite contrary to that of the Jews’ forecited, measuring the day from sunrising to sunrising) the day natural began with the light: for even is the declining light of the foregoing day; and the morning may as well be called the end of the night past, as the beginning of the day following: and so diverse of the learned by the evening understand the day, as the end thereof; and by morning the night, at which time it is at an end: for denominations are many times taken from the end, because thereby the thing is made complete: so the whole week is called by the name Sabbath, Lev. 23:15 &amp; Mt. 18:12, because with it the week is wholly made up and fully finished.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ley.html">John Ley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the books of the Old &amp; New Testament</cite>, (London: Legatt, 1645), On Genesis | on Gen., 1:5</span></figcaption>

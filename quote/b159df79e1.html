<main class="wrap"><figure class="quote" id="q-b159df79e1" data-kw="">
<blockquote><p>I challenge all men to shew me a nation that, till Christianity appeared to bless this world, enjoyed a constitution like our own. God be thanked for it, thanked for the Sovereign that fills the throne, thanked for the loyalty of her people, and thanked for our calm but resolute determination — as this city lately saw — to stand by the liberties and protect the privileges which came down to us from battles which our fathers fought, and scaffolds where they fell …

It is our freedom, our mental, social, political, religious freedom — which has made us great; and these, with God’s blessing, we owe to his word. The Bible has been the source of our liberties. The Bible and the Shorter Catechism, read and studied by Scotchmen, these have toughened their intellects, and set all the wheels of their minds in motion.

Talk of Liberty! liberty without the Bible is either dead or delirious. Look at France, where they would have liberty divorced from religion! …

No political regeneration has ever stood, or will ever stand, unless it is preceded, accompanied, or followed by a spiritual awakening. In our case, there was no failure. The Argyles, and Guthries, and Cargills of other days — Knox, with his indomitable spirit and bold endurance, the martyrs who sleep in the Greyfriars’ churchyard, and those who lie on Scotland’s hills, with nothing to mark their graves but a weathered stone, with its rude sketch of an open Bible, and a naked sword, they neither prayed, nor laboured, nor bled, nor died in vain.

And why? Why, but because they laid the foundations of our liberties deep in the Word of God. Therefore, we have a sovereign, but no slaves in this land; we have authority, but no oppression; we have rulers, but no tyrants; we have liberty without license, and religion without superstition: free trade, a free parliament, free justice, free thought; liberty, not the false, which is every man doing what he will, but the true, which is every man doing what he ought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-guthrie.html">Thomas Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God s Truth and Man’s Freedom: A Sermon’ in J. A. Wylie (ed.), Ter-Centenary of the Scottish Reformation, as Commemorated at Edinburgh, August 1860</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cac584ea0d" data-kw="">
<blockquote><p>Grace be with you, and peace from god our father, &amp; from our Lord Jesus Christ. We could not but rejoice, when we heard that in England as in other countries the joyful message of the glory of God was very well taken of divers. Notwithstanding, this also is showed us that many weaklings yet be draw back again because of unknown rumours that there be noised of us by them that withstood the gospel of God. This is our rejoicing: Nevertheless I think it not need to withstand such lies as be uttered against the preachers of the gospel. For whereto should this blessing be meet else, namely Blessed be ye when men curse you, and revile you, &amp;c. But we do not allow, &amp; support of any body under pretence of Christian liberty behave himself unchristianly: for all they that have taken upon them the name of Christ, have also put on Christ. And this we marvel of, why some with you fear to take upon them the holy gospel of Christ by reason of the misreport that we are misreported not remembering that it behoveth the son of God to be reproved of the world &amp; the preaching of the cross to be counted foolishness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-bugenhagen.html">Johannes Bugenhagen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A compe[n]dious letter which Jhon Pomerane curate of the congregation at Wittenberg sent to the faithful christen congregation in England</cite>, (Southwark: J. Nicholson, 1536), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/christian-liberty-and-conscience.html">Christian Liberty and Conscience</a></span></div>

</figure><figure class="quote" id="q-ea8cc5f65b" data-kw="">
<blockquote><p>It is not unlawful of itself to sell poison, or give a knife to another, or to bid another to do it [sell the goods]; but if it were foreseen that they will be used to poison or kill the buyer, it is unlawful; and I think the [civil] Law would make him believe it that were guilty. It is not of itself unlawful to light a candle, or set fire on a straw; but if it may be foreknown that by another’s negligence or willfulness [that] it is like[ly] to set fire on the city, or give fire to a train or store of gun-powder that is under the Parliament House, when the King and Parliament are there, I crave the Bishop’s [his opponent’s] pardon for believing that it were sinful to do it, or command it;</p></blockquote>

<blockquote><p>Wherefore let it be set down that it is lawful for the Church to make to itself either canons or laws, or decrees, or statutes, or call them by what name thou wilt. For the Church is a company, and must be ruled by the Word of God, especially because it belongs to the salvation thereof, and to the worshiping of God. But there be other things which belong only unto outward discipline. For there is need of certain outward bonds, to the end that the fellowship of the people may be retained. So the apostle decreed that women ought to pray with the head covered, and men uncovered. And the apostles in the Acts, decreed that we should abstain from blood, from strangled, and from things dedicated unto idols. And always in councils after they had done with doctrine, they began to entreat of discipline. Finally so did all the fathers as Tertullian, Origen, Basil, Augustine and Jerome. The end of these laws must be edifying and good order. But for so much as they be not of necessity, they may be changed according to the times and places.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Common Places (d. 1562; London, 1583)</cite>, ch. 4, ‘Of Ecclesiastical Laws…’, p.42</span></figcaption>

<blockquote><p>Plato (5th-4th cent. B.C.), describing the parts of the human body, wrote of ‘the head which is the most divine part and which reigns (δεσποτέω) over all the parts within us’ (Timaeus 44.D). Plutarch (A.D. 46-120), one of the most prominent Greek authors from the New Testament period (and one who reflected secular thinking independent of Jewish or Christian influence), explained why the words soul (ψυχη) and head (κεφαλή) can be used to speak of the whole person: ‘We affectionately call a person ‘soul’ or ‘head’ from his ruling parts…’ (Table-Talk 692.D.11). Philo (Jewish philosopher, c. 30 B.C.—c. A.D. 45), representing one aspect of first century Judaism, had a similar understanding: ‘As the head in the living body is the ruling place… so Ptolemy became head among kings’ (Life of Moses 2.30). ‘The mind is the head and ruler… of the sense-perception in us’ (Life of Moses 2.82); ‘’Head’ we interpret allegorically to be the ruling… mind of the soul’ (On Dreams 2.207).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wayne-grudem.html">Wayne Grudem</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Does Kefale (‘Head’) Mean ‘Source’ Or ‘Authority Over’ in Greek Literature?: a Survey of 2,336 Examples’ Trinity Journal, no. 6.1 (Spring 1985), pp. 38-59</cite>, p. 42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>1. Indifferent Things are far below the scale of divine institutions, though these institutions are but positive, and not of eternal goodness and righteousness. All the appointments of God and Christ are lifted up into that state the divine appointment designs them to; and shall, if used according to those appointments, be made efficacious to those ends for which they are appointed, according to the effectual working of that power and grace from which they received their original: So that they do make us better, they do commend us to God, if we observe the will and law of God concerning them; and we are the worse in the sinful neglect of them, according to the degree of neglect. 2. They are not of the scale of those things, wherein that order, of which God, by the very laws of rational nature is the author, stands; and not of confusion; so that though this order runs, or ought to run along, and conduct all human actions, and so is not in itself a point of religion; yet when it is applied to religious services and actions, does indeed commend our religious actions and services to God, and the contrary is an evil. 3. Of the same account is that euschemonia, or decency of religious actions, required by God before Himself, and before the holy angels, of which the apostle discourses; ‘Every man praying with his Head uncovered, dishonoureth his head;’ every Woman praying so, ‘ought to have a covering on her head, because of the angels;’ such a distinction of sexes being founded in nature; and in what is beyond nature, the grave customs of ages and places, carry a great weight of determination.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-beverly.html">Thomas Beverly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Principles of Protestant Truth &amp; Peace in Four Treatises… (London, 1683)</cite>, pp. 39-40</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

<blockquote><p>we must see why it is that St. Paul praises the Corinthians… Now we note that in the Church of God there is first of all doctrine, and then there is order and policy… As for the rest, other than doctrine, there is also policy, and this policy is left to us in liberty. So, for example, we are presently assembled at eight o’clock; one might well arrange for it to be at seven o’clock, or change the order in some regard. And, indeed, we often see that one Church will by no means have precisely the same order as another… and do we have a different Christianity on that account? Not at all. For what belongs to outward order and policy (as I said) has been left to human liberty. It is true we must proceed with sound-mindedness and modesty, and ever consider what is fitting for the edification of the Church, as we will be exhorted in the fourteenth chapter, and there it will be treated more fully. …he did not inject himself by imposing certain laws, bringing souls into bondage; he did not erect a ‘divine service’ such as one sees in Papistry. None of all that. Rather he conveyed to them an order designed to maintain decency, peace and concord among them… So, when the gospel is preached in any place, and a church is raised up, some particular ordinances must be established, which one will know to be proper and which everyone will use in his liberty. But this (as I said) has nothing to do with adding to the doctrine of faith, nor with making laws that put our souls in bondage.</p></blockquote>

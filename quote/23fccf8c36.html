<main class="wrap"><figure class="quote" id="q-23fccf8c36" data-kw="">
<blockquote><p>The hopes of the Arminians in England were but small so long as K[ing]. James did live, for that good Prince both in word and writing did threaten to burn these Hereticks if any of them should appear in his Dominions; see his Declaration against Vorstius: yea, so long as [George] Abbot was in grace at Court, the Arminians kept a low sail, but after that his Successor even in his own time had come in favour, that unhappy Sect under the patronage of Mountagu and White’s learning began to spread far and near, yea, at last silence in a public Edict was enjoined to their opposers, and all favours conferred on those who had skill and will to promote that Cause, &amp; many evident disgraces poured on well-deserving men for no other reason but their Anti-Arminian spirit.

All this time our Church [the Church of Scotland] was free of these evils; but so soon as the advancers of Arminianism at the English Court, began to intermeddle with the affairs of our Kingdom, at once these men were eyed, who inclined that way, prime places were put into their hands for no other virtue the World could discern in them, but their boldness to let out their inclination towards the Arminian Error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scotch Antidote Against the English Infection of Arminianism</cite>, (London: Samuel Gellibrand, 1652), pp 15-18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a60b3960c" data-kw="">
<blockquote><p>We also renounce Arminianism, which is a System containing many gross Errors; such as, notwithstanding of the Fall, Man retains a Freedom of Will to that which is spiritually good; that the Grace of God is not irresistible and efficacious of itself; that Believers in Christ may fall totally and finally away from a State of Grace; that Election depends upon foreseen good Works; and that Christ merited Grace to all Mankind; that the Reason why some are chose to Salvation, and others rejected, is for the foreseen Faith and good Works of the one, and for the foreseen Unbelief and evil Works of the other …</p></blockquote>

</figure><figure class="quote" id="q-5cf7dccd86" data-kw="">
<blockquote><p>In his review of a sermon by his fellow New York Presbyterian, Gardiner Spring, the nineteenth-century American Reformed Presbyterian, Alexander McLeod, made the following interesting distinction between the original (liberal) Remonstrant Arminians and later evangelical Arminians:

However decidedly we are ourselves opposed to Arminian tenets, we would not think it becoming to class all men, who disagree with us upon the doctrine of election, among the venomous seed of the serpent. The judgment of men’s persons and state belongs to God.

We think it, therefore, at least indecorous in the preacher, to designate, not only such men as Episcopius and old John Goodwin, but also John Wesley and Adam Clarke, and the great body of respectable men, who are associated, in so many benevolent institutions, along with himself [Gardiner Spring] in this city [New York], as “the seed of the serpent spiting our their venom,” because they do not recognize his doctrine of election.

While, with all our talents, we oppose their doctrines, whereinsoever we think them erroneous, we esteem it altogether improper to hold up their persons in such an execrable light, and disgusting attitude, to public detestation – “the seed of the serpent spitting out venom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-mcleod.html">Alexander McLeod</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Review of Gardiner Spring The Doctrine of Election Illustrated and Established in Evangelical Guardian and Review</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

/22/alexander-mcleod-on-distinguishing-between-the-original-arminians-and-evangelical-arminians/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>I. They bring that place of Saint John, Chapter 3. Verse 16. Where God is said to have so loved the world, that he gave his Son: which place we have already taught, doth hurt Arminius; and that the sending of the Son is in the following words, restrained to the believers alone. Whence it is manifest, that Christ was not sent, but to save them who were to believe.

I might say that the world is here taken for the faithful alone; as, John 6. 33 and I Tim. 3.16 and Heb. 2.5. But although we grant, that by the world all mankind are contained in the whole, yet it will not thence follow, that Christ purchased Salvation for all, and particular men, doth abundantly testify, that mankind is loved by God.

II. And it is worth the labour to know what meaning the Arminians apply to Christ, and what according to the Arminians is the sense of these Words of Christ. God so loved the world that he gave his only begotten Son, that whosoever believeth in him, should not perish, but have everlasting life.

According to the Doctrine of Arminius, this must be the sense of these words; God so loved all mankind, with a love wherewith he hath not willed their Salvation that he decreed to send his Son, before he thought of saving man, to purchase for himself the power of saving man, and afterward he decreed to give every man power of believing, if he himself would, that so he might have eternal life. A monster of Doctrine and a new Gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 29.1-2, p. 215.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/arminians-remonstrants/free-will-and-prevenient-grace.html">Arminians (Remonstrants): Free Will and Prevenient Grace</a></span></div>

II. And it is worth the labour to know what meaning the Arminians apply to Christ, and what according to the Arminians is the sense of these Words of Christ. God so loved the world that he gave his only begotten Son, that whosoever believeth in him, should not perish, but have everlasting life.

According to the Doctrine of Arminius, this must be the sense of these words; God so loved all mankind, with a love wherewith he hath not willed their Salvation that he decreed to send his Son, before he thought of saving man, to purchase for himself the power of saving man, and afterward he decreed to give every man power of believing, if he himself would, that so he might have eternal life. A monster of Doctrine and a new Gospel.”

— Pierre Du Moulin, The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c, (1619; London: Nathanael Newbery, 1635), 29.1-2, p. 215.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+They+bring+that+place+of+Saint+John%2C+Chapter+3.+Verse+16.+Where+God+is+said+to+have+so+loved+the+world%2C+that+he+gave+his+Son%3A+which+place+we+have+already+taught%2C+doth+hurt+Arminius%3B+and+that+the+sending+of+the+Son+is+in+the+following+words%2C+restrained+to+the+believers+alone.+Whence+it+is+manifest%2C+that+Christ+was+not+sent%2C+but+to+save+them+who+were+to+believe.%0A%0AI+might+say+that+the+world+is+here+taken+for+the+faithful+alone%3B+as%2C+John+6.+33+and+I+Tim.+3.16+and+Heb.+2.5.+But+although+we+grant%2C+that+by+the+world+all+mankind+are+contained+in+the+whole%2C+yet+it+will+not+thence+follow%2C+that+Christ+purchased+Salvation+for+all%2C+and+particular+men%2C+doth+abundantly+testify%2C+that+mankind+is+loved+by+God.%0A%0AII.+And+it+is+worth+the+labour+to+know+what+meaning+the+Arminians+apply+to+Christ%2C+and+what+according+to+the+Arminians+is+the+sense+of+these+Words+of+Christ.+God+so+loved+the+world+that+he+gave+his+only+begotten+Son%2C+that+whosoever+believeth+in+him%2C+should+not+perish%2C+but+have+everlasting+life.%0A%0AAccording+to+the+Doctrine+of+Arminius%2C+this+must+be+the+sense+of+these+words%3B+God+so+loved+all+mankind%2C+with+a+love+wherewith+he+hath+not+willed+their+Salvation+that+he+decreed+to+send+his+Son%2C+before+he+thought+of+saving+man%2C+to+purchase+for+himself+the+power+of+saving+man%2C+and+afterward+he+decreed+to+give+every+man+power+of+believing%2C+if+he+himself+would%2C+that+so+he+might+have+eternal+life.+A+monster+of+Doctrine+and+a+new+Gospel.%E2%80%9D%0A%0A%E2%80%94+Pierre+Du+Moulin%2C+The+Anatomy+of+Arminianism%3A+Or%2C+The+Opening+of+the+Controver

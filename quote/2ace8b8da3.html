<main class="wrap"><figure class="quote" id="q-2ace8b8da3" data-kw="">
<blockquote><p>After the thanksgiving, it is very clear that our Divine Lord broke the bread. We scarcely know what kind of bread was used on that occasion; it was probably the thin passover cake of the Jews; but there is nothing said in Scripture about the use of leavened or unleavened bread, and therefore it matters not which we use. Where there is no ordinance, there is no obligation; and we are, therefore, left free to use the bread. which it is our custom to eat.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quote was compiled by Andy Webb</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a019d5253b" data-kw="">
<blockquote><p>In the mean while Satan, using every exertion to subvert entirely the church erected at Geneva, which had been shaken to its very foundation, found in a short time some idle characters, who, for the purpose of concealing the great iniquity of the decree under the pretext of religion, determined that unleavened bread should be substituted for common, formerly used at the Lord’s table, with a view to afford an opportunity for fomenting new dissensions. And the great enemy of the Church would have succeeded in this plan, had not Calvin seriously admonished some good men, so displeased with the change as to consider it their duty to refrain from taking the Lord’s Supper, not to contend about a subject in itself indifferent. The use of unleavened bread commenced in the manner now stated, nor did Calvin on his future restoration think it worth while to make any opposition to the practice, though he [Calvin] did not attempt to conceal his approval of the use of common bread.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quote was compiled by Andy Webb</cite></span></figcaption>

</figure><figure class="quote" id="q-894e025b26" data-kw="">
<blockquote><p>An act of Christ alone is not sufficient to form a command; for although He consecrated in white wine, or at night, for example, He did not on that account command us to consecrate” (3. Thom. De Sacra. +). Nor if unleavened cakes have a mystical signification, are they immediately of divine institution, since it is evident that the cause of the institution was the memory of the hasty departure from Egypt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 3, ed. James Dennison Jr., 1997, p. 430 | 19th Topic: The Sacraments | 22nd Question: Why was the holy Supper instituted by our Lord and of how many parts does it consist? | The example of Christ neither can nor ought to be made an objection here, because as we have said there was a peculiar reason which impelled him to the use of unleavened bread (which no longer exists). Therefore, his example binds us as to the essence of the thing itself, that we should do whatever He did (take, bless, and break the bread and other acts of this kind mentioned by the sacred writers); but not forthwith as to the particular circumstances, which do not belong to the thing. Suarez remarks:</span></figcaption>

</figure><figure class="quote" id="q-05426fba33" data-kw="both kinds">
<blockquote><p>From this the opinion of the Romanists is evident without any further investigation. Ours is wholly contrary. In fact, we think that the communion under both kinds instituted by Christ should necessarily be retained; so that it is not only free to each one to use it, but from the command of Christ they are individually bound to it, unless they are prevented by some insuperable hindrance. Not without the highest sacrilege can the cup be taken away from the people against the express law of God. The state of the question therefore (1) is not Was communion under both kinds instituted by Christ? (which our opponents do not dispute); but Ought it to be instituted in like manner by believers, so that it is not only a thing indifferent and accidental, but necessary and essential to the perfection of the sacrament? (2) The question is not Is the believer so bound to communion under both kinds that he cannot in any case without sin commune under one kind only? For we confess if any unavoidable impediment interposes, either internal (arising from the disposition of the receiver) or external from other causes, by which he is prohibited from taking one kind, such an one is worthy of commiseration rather than of reprehension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.25.5</span></figcaption>

</figure><figure class="quote" id="q-5c9c2625f4" data-kw="">
<blockquote><p>The third breach of the institution [of the Lord’s Supper] made by kneeling is the taking away of that mystical rite representing Christ’s passion, to wit, the breaking of the bread. The apostle says not, the communion of one bread, but, the communion of one broken bread, hath in it a mystery of our unity. When the bread is carved in little morsels before it be presented to the table, it is not the sacramental and mystical breaking in the use of the sacrament which ought to be performed after the thanksgiving, according to Christ’s example. Augustine says, ‘When that which is blessed on the Lord’s table, sanctified, and broken in small pieces to be distributed,’ etc. This breaking was needful both for mystery and distribution. The breaking of the bread was thought so needful in the sacrament, that it was called ‘breaking of bread.’ The Syriac interpreter translates the breaking of bread ‘Eucharist’ (Acts 2:24, 20:7). [David] Pareus (on 1 Cor. 11) proves at length this rite not to be indifferent, but a thing commanded. Where kneeling is practiced, we read not in their service-books [of the Church of England, seeking to be imposed on the Church of Scotland] of this breaking of bread after thanksgiving, whereby the passion of Christ is not set forth to the communicants as it ought to be.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, … ([Leiden: Pilgrim Press, 1619]), p. 40</span></figcaption>

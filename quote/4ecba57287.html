<main class="wrap"><figure class="quote" id="q-4ecba57287" data-kw="">
<blockquote><p>What are the different opinions as to the relation between faith and love? 1st. The Romanists, in order to maintain their doctrine that faith alone is not saving, distinguish between a formed, or perfect, and an unformed faith. They acknowledge that faith is distinct from love, but maintain that love is essential to render faith meritorious and effectual as the instrument of our salvation. 2d. Some have regarded love as the root out of which faith springs. 3d. The true view is that love is the immediate and necessary effect of faith. Faith includes the spiritual apprehension of the beauty and excellence of the truth, and an act of the will embracing it and relying upon it. Yet these graces can not be analytically separated, since they mutually involve one another. There can be no love without faith, nor any faith without love. Faith apprehends the loveliness of the object, the heart spontaneously loves it. Thus “faith works by love,” since these affections are the source of those motives that control the will. The Romish doctrine is inconsistent with the essential principles of the gospel. Faith is not a work, nor can it have, when formed or unformed, any merit, it is essentially a self-emptying act, which saves by laying hold of the merits of Christ. It leads to works, and proves itself by its fruits, but in its relation to justification it is in its very nature a strong protest against the merits of all human works, Gal. 3:10, 11; Eph. 2:8, 9. The Protestant doctrine that love is the fruit of faith is established by what the Scriptures declare concerning faith, that it “sanctifies,” “works by love,” “overcomes the world,” Gal. 5:6; Acts 26:18; 1 John 5:4. This is accomplished thus—by faith we are united to Christ, Eph. 3:17, and so become partakers of his Spirit, 1 John 3:24, one of the fruits of the Spirit is love, Gal. 5:22, and love is the principle of all obedience, Rom. 13:10.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Outlines of Theology</cite>, (New York: Robert Carter &amp; Brothers, 1863), 362–63 (emphasis added)</span></figcaption>

<blockquote><p>1. That righteouseness whereby we are justified before God is the fulfilling of God’s law.

2. Legal justice is the fulfilling of the law, performed by him which is named just.

3. Evangelical justice is the punnishment of our sins, which Christ endured for us, freely imputed by God to them that believe.

4. Since the fall of man no man besides Christ alone in this life is justified before God by the righteouseness of the law.

5. We are justified only by faith in Christ.

6. And yet the righteousness of the law must in this life be begun in all that will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Rules &amp; Axions of Certain Chief Points of Christianity in A Collection of Certain Learned Discourses</cite>, … (d. 1587; Oxford, 1600), 22. ‘Of Man’s Justification before God’, pp. 271-72</span></figcaption>

</figure><figure class="quote" id="q-beb1f4e886" data-kw="">
<blockquote><p>If someone could believe with a certain and constant faith, and could understand the magnitude of it all, that he is the son and heir of God, he could regard all the power and wealth of all the kingdoms of the world as filth and refuse in comparison with his heavenly inheritance. Whatever the world has that is sublime and glorious would make him sick. And the greater the pomp and glory of the world is, the more detestable it would be to him. In other words, whatever the world admires and exalts most, that is foul and worthless in his eyes. For what is the whole world with its power, wealth, and glory in comparison with God, whose heir and son he is? He also desires anxiously to depart with Paul and to be with Christ (Phil. 1:23). Nothing more delightful could happen to him than a premature death, which he would embrace as the most joyous peace; for he would know that it is the end of all his evils and that through it he comes into his inheritance. In fact, a man who believed this completely would not go on living very long but would soon be consumed by his overwhelming joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1–4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 392–93.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

ared-to-christ/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>
</figure><figure class="quote" id="q-bba9aeb039" data-kw="">
<blockquote><p>It is true, that all those who place the formal cause or reason of our justification in ourselves, or our inherent righteousness, and so either directly or by just consequence, deny all imputation of the righteousness of Christ unto our justification,are not capable of admitting faith to be an instrument in this work, nor are pressed with this consideration; for they acknowledge not that we receive a righteousness which is not our own, by way of gift, whereby we are justified, and so cannot allow of any instrument whereby it should be received.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, Works of John Owen 5.112.</span></figcaption>

</figure><figure class="quote" id="q-897e637887" data-kw="">
<blockquote><p>Our predestination is not wrought in ourselves, but in secret with Him, in His foreknowledge. But we are called by the preaching of repentance. We are justified in the calling of mercy and fear of judgment. He feareth not judgment, who hath previously attained salvation. Being called, we renounce the devil by repentance, that we may not continue under his yoke: being justified, we are healed by mercy, that we may not fear judgment: being glorified, we pass into everlasting life, where we praise God without end.… The verse wherewith this Psalm concludeth is the voice of life everlasting.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Expositions on the Book of Psalms,” in Saint Augustin: Expositions on the Book of Psalms</cite>, ed. Philip Schaff, trans. A. Cleveland Coxe, vol. 8, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, First Series (New York: Christian Literature Company, 1888), 682.</span></figcaption>

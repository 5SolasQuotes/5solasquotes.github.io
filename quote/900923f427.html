<blockquote><p>God in this attribute of mercy is infinite and incomprehensible. He is in this as in other attributes; indeed He is God. Heaps of places I might bring in; the Bible abounds with passages of the merciful inclination of God: Ex. 34:6-7, ‘The Lord God merciful and gracious, etc.’ And again, ‘Keeping mercy for thousands.’ Dt. 5:10, ‘And showing mercy unto thousands.’ Ps. 36:5, ‘Thy mercy O Lord is in the heavens,’ or unto the heavens. So that we need not ask as Esau did of Jacob his father about a blessing, ‘Hast thou but one blessing my father?’ (Gen. 27:38) So hast Thou but one mercy, O God? For come there never so many, there is mercy for all. The bottomless ocean of God’s mercy can never possibly be drawn dry by the creature. Many admirable sayings have we touching God’s mercy: First, God inclines to it; it comes naturally from Him: not as waters out of the pump, but as showers from heaven. Tis but ‘open our mouths’ and God will fill them [Ps. 95]. Yea secondly (to use the words of a painful and learned writer; [John] Downame’s Christian Warfare, bk. 2, ch. 34, sect. 4, p. 204), ‘It is not only not troublesome and painful’ (to wit because it is natural to God to show mercy) ‘but also pleasant and delightful for God to show mercy, etc.’ And a little after: ‘And contrariwise it should be troublesome and irksome, if I may so speak‘ (says mine author) ‘for God not to show and exercise his nature and mercy, etc.’ And once more: ‘For as the eye is delighted with seeing, and to be restrained therefrom is grievous unto it, as the ear is delighted with hearing and is much molested if it be stopped; and as every part and faculty of the body and soul are delighted in exercising their several actions and functions and are much vexed and cumbered if by any means they should be hindered, so is the Lord delighted and well pleased in showing and exercising his own nature and attributes.’ God weeps when He strikes, but smiles when He strokes. It does his heart good (as we use to say of men). Certainly God will not be barred of his pleasure; He rejoices much to have an occasion offered of exercising his mercy. Ps. 147:11, David says that, ‘the Lord is delighted in them that fear Him and attend upon his mercy.’ When men wait for mercy, God is delighted to exercise it towards them. Judicious Mr. [Joseph] Caryl, ‘To show mercy pleases Him more than it relieves us.’ Thirdly, God is said ‘to multiply’ to show mercy. Single acts of mercy cannot give Him content: He shows mercies by thousands, unto thousands of his people. Fourthly, ye have an expression, Isa. 30:18, ‘And therefore will He be exalted that He may have mercy upon you.’ But what do I speak of that which is infinite and incomprehensible? Sooner can we number the stars of heaven, drops of the ocean, sands on the shore, yea atoms in the sun, than give you a true account of the mercies of this most merciful God. What is a drop to the ocean? (Quantum scintilla ad mare se habet, tantum hominis malitia ad Dei clementiam imo vero non tantum; [As much as a spark is to the sea, so much is man’s wickedness to God’s clemency; indeed, not even so much.] Chrysostom) And what are our sins to the mercies of God. Infiniteness cannot be limited. God’s thoughts of mercy are exalted above the thoughts of our unworthiness far higher than the heavens are exalted above the earth. Mercy is as it were God’s fetching of breath. His infinite and incomprehensible goodness does in a sort wholly live in works of mercy; For all the world are object of God’s mercy since Adam’s fall: ‘For all have sinned, and have come short of the glory of God.’ That famous man, Jerome Zanchi has notable stuff about this matter. I will take notice but of one passage, upon Ex. 34:6-7, where it is said that God is slow to anger. He writes (On the Attributes, bk. 2, ch. 1, quest. 2): ‘And therefore we must note, although anger be attributed unto God, it is in God nothing else but the chief goodness and justice whereby He abhors evil, and according to his just judgment, does at length punish it if it be not amended by his longsuffering and patience. This here hence appears evidently speaking of revenge, which is an effect of anger; He does not say that He does presently inflict punishment, or that He is so ready to inflict it as to show mercy: but He says that He ‘is slow to anger,’ etc.’ And upon the 28th of Isa. 21, where the words are: ‘For the Lord shall rise up as in mount Perahim; He shall be wrath as in the valley of Gibeon, that He may do his work, his strange work, and bring to pass his acts, his strange act.’ ‘The prophet’ (says Zanchi): ‘makes two sorts of God’s works: his proper and strange works. The proper work of God is to show mercy and to spare or forgive; his strange work is to be angry and to punish.’ So far he. I have been somewhat long about this quotation. The weight lies upon this, that mercy in God is his nature, and therefore infinite; it is the very life of God, his drawing of breath in his proper works. Mercy, goodness, longsuffering are according to the nature of the Deity, which is far remote from all unjust severity, cruelty, tyranny and pride. All providences have mercy in them. Tis of the infinite mercy of God that the world is borne up, which would else sink into its first: nothing. It is mercy [that] respites the damnation of wicked men and saves the elect; yea, behold I tell you a mystery, mercies bring calamities: 1 Cor. 11:32, ‘But when we are judged we are chastened of the Lord that we should not be condemned with the world.’ O let me draw breath a little! Consider what unexpected, even incredible mercies God sometimes breathes out. Even when He seems to breathe out smoke and flames, yet He is angry that He may bring his work to pass, that is to say, his proper work; that is, that he may have mercy and preserve. The Devil, he breathes out deaths, miseries and mischiefs, but God loads us with mercies, and (as I said) the attribute of goodness sets God on work to put Himself out in endless mercies and tender bowels beyond what man or angel can possibly imagine.</p></blockquote>

<blockquote><p>There is also a certain logic of interrelation of attributes in the orthodox presentation of the voluntary love of God for the world–God’s propensity to love the finite order rests on the grounding of the finite order in the goodness of God: ‘From the goodness springs the love of God, by which God is inclined towards the creature, and delights to do it good, and as it were, to unite himself with it.’ (Pictet, Theol. chr., II.vii.4; cf. Mastricht, Theoretico-practica theol., II.xvii.8; Synopsis purioris theologiae, VI.xl.) The love of God, therefore, belongs to the category of affection, arising inwardly and extending outward, and is not to be understood as a passion, arising because of some outward good that it apprehends and desires. (Beza et al. Propositions and Principles, IX.viii.)</p></blockquote>

<div class="actions"><button class="copy" data-copy="“There is also a certain logic of interrelation of attributes in the orthodox presentation of the voluntary love of God for the world–God’s propensity to love the finite order rests on the grounding of the finite order in the goodness of God: ‘From the goodness springs the love of God, by which God is inclined towards the creature, and delights to do it good, and as it were, to unite himself with it.’ (Pictet, Theol. chr., II.vii.4; cf. Mastricht, Theoretico-practica theol., II.xvii.8; Synopsis purioris theologiae, VI.xl.) The love of God, therefore, belongs to the category of affection, arising inwardly and extending outward, and is not to be understood as a passion, arising because of some outward good that it apprehends and desires. (Beza et al. Propositions and Principles, IX.viii.)”

— Richard Muller, Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3, p. 566">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+also+a+certain+logic+of+interrelation+of+attributes+in+the+orthodox+presentation+of+the+voluntary+love+of+God+for+the+world%E2%80%93God%E2%80%99s+propensity+to+love+the+finite+order+rests+on+the+grounding+of+the+finite+order+in+the+goodness+of+God%3A+%E2%80%98From+the+goodness+springs+the+love+of+God%2C+by+which+God+is+inclined+towards+the+creature%2C+and+delights+to+do+it+good%2C+and+as+it+were%2C+to+unite+himself+with+it.%E2%80%99+%28Pictet%2C+Theol.+chr.%2C+II.vii.4%3B+cf.+Mastricht%2C+Theoretico-practica+theol.%2C+II.xvii.8%3B+Synopsis+purioris+theologiae%2C+VI.xl.%29+The+love+of+God%2C+therefore%2C+belongs+to+the+category+of+affection%2C+arising+inwardly+and+extending+outward%2C+and+is+not+to+be+understood+as+a+passion%2C+arising+because+of+some+outward+good+that+it+apprehends+and+desires.+%28Beza+et+al.+Propositions+and+Principles%2C+IX.viii.%29%E2%80%9D%0A%0A%E2%80%94+Richard+Muller%2C+Post-Reformation+Reformed+Dogmatics+%28Baker+Academic%2C+2003%29%2C+vol.+3%2C+p.+566&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F14e906f598.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/14e906f598.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=There%20is%20also%20a%20certain%20logic,et%20al.%20Propositions%20and%20Principles%2C%20IX.viii&amp;text=There%20is%20also%20a%20certain%20logic%20of%20interrelation&amp;text=desires.%20%28Beza%20et%20al.%20Propositions%20and%20Principles%2C%20IX.viii" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>But I receive not testimony from man: but these things I say, that ye might be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Bible</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“But I receive not testimony from man: but these things I say, that ye might be saved.”

— Matthew Henry, Commentary on the Bible">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+I+receive+not+testimony+from+man%3A+but+these+things+I+say%2C+that+ye+might+be+saved.%E2%80%9D%0A%0A%E2%80%94+Matthew+Henry%2C+Commentary+on+the+Bible&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5078be8909.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5078be8909.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-sincere-free-offer-of-the-gospel/historic-reformed-quotes-on-gods-revealed-will-as-his-desire-wish-and-pleasure/#:~:text=But%20I%20receive%20not%20testimony%20from,say%2C%20that%20ye%20might%20be%20saved&amp;text=But%20I%20receive%20not%20testimony%20from%20man%3A%20but&amp;text=things%20I%20say%2C%20that%20ye%20might%20be%20saved" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-c8942359ec" data-kw="">
<blockquote><p>It is admitted that God’s love to man is in one sense universal. He bears good-will towards them, as the work of his hands; but it does not follow thence that He must do all that he could do for their salvation… As to God’s willingness that all should turn and live, as God’s will has been observed sometimes expresses what He approves, and sometimes what He purposes. God wills, approves and desires a sinner’s turning unto Him. It is that which, through the whole Bible, is required of him; and whosoever thus returns shall live. I may add, God is willing to receive and forgive every sinner that returns to Him through Jesus Christ. He desires not the death of a sinner, but rather that he would repent and live. But He has not purposed the salvation of every sinner, or to incline his heart to embrace the salvation exhibited in the gospel. In this sense, the salvation of some is neither desired nor designed: if it were, it would be effected; for “his counsel shall stand, and He will do all his pleasure.”–“Whatsoever his soul desires, even that he does,” Isa. 46:10; Job 23:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-fuller.html">Andrew Fuller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Reality and Efficacy of Divine Grace”</cite>, (1815) in The Complete Works of Andrew Fuller (Harrisonburg, Virginia: Sprinkle Publications, 1988), 2:554</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

20that%20God%E2%80%99s%20love,he%20does%2C%E2%80%9D%20Isa.%2046%3A10%3B%20Job%2023%3A13&amp;text=It%20is%20admitted%20that%20God%E2%80%99s%20love%20to%20man&amp;text=even%20that%20he%20does%2C%E2%80%9D%20Isa.%2046%3A10%3B%20Job%2023%3A13" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-32484f2f45" data-kw="">
<blockquote><p>The Reformed orthodox describe God’s love as an act of the divine will or a movement toward the good–both toward the good in itself and toward the good as it is embodied in the creature. Indeed, the predications of will, love, and goodness conjoin in the basic definition, granting that the divine will is God’s propensity for the good that is ultimately the divine essence itself as the source of all good–and amor [love], strictly defined, is a propensity for the good (Mastricht, Theoretico-practica theol., II.xvii.3, 4, 6; cf. Brakel, Redelijke Godsdienst, I.iii.33. Note the similar definitions in Arminius, Disputationes privatae, XX.iii-iv.), or a desire or ‘appetite for union.’ (Heidanus, Corpus theol., II (p. 172).)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, pp. 564-65</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

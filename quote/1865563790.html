<blockquote><p>XXI. The fourth commandment is moral and perpetual as to the substance of the thing commanded (to wit, that some solemn external worship is due to God and that a certain time should be devoted to it; not as to the particular determination of the seventh day [a matter of positive right], which moreover as ceremonial could be changed…).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes, vol. 2, 11th Topic, Question 2, section 21</cite>, p. 13</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

<blockquote><p>4. That this whole time is, as far as may be, to be employed in some or other of these exercises. That it cannot all of it be actually so attended, will be considered afterwards: … 3. …The whole Sabbath is not to be spent in public, nor yet in private ordinarily, except when the providence of God prevents the opportunity of public assemblies, which is wont [accustomed] to fall out in times of persecution… … 2. Such as fall out extraordinarily, or on special occasions, which put unavoidable necessity of intermitting the proper duties of the Day; and if we do not attend them, we shall be further exposed. And of this sort are: (1.) To fight or fly from an invading enemy: if not to be aggressors on such a Day, yet to stand on their own defense, when assaulted. The law of self-preservation calls for it, and the thing itself puts by duties of worship, and if this were not a duty, but unlawful, we should by it become a prey to them that hate us. And as to flying, when oppressed on a Sabbath by a prevailing foe, against whom we cannot defend ourselves, our Savior supposes it lawful, though afflictive, in Mt. 24:20, ‘Pray that your flight be not on the Sabbath Day.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-willard.html">Samuel Willard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Complete Body of Divinity… (Boston, 1726), Sermon 172, Q. 60</cite>, pp. 584-88</span></figcaption>

</figure><figure class="quote" id="q-935e3e47e2" data-kw="">
<blockquote><p>Hence also works of necessity, not only for preservation of life, but also for comfort and comeliness of life, are not unlawful; for it is a gross mistake to think that works only of absolute necessity are allowed only upon this day; for to lead an ox to water, which in the strictest times was not disallowed of, is not of absolute necessity, for it may live more than a day without it; only it is necessary for the comfort of the life of the beast: how much more is allowed to the comfort of the life of man! The disciples possibly might have lived longer than the Sabbath without rubbing corn ears, and men may live on Sabbath days generally without warm meat, yea, they may fast perhaps all that day; yet it is not unlawful to eat such meat, because it is necessary for the comfort of life. Hence also to put on comely garments, to wash hands and face, and many such thnigs as are necessary tor the comeliness as well as the comfort of life, are not unlawful now; There is sometimes an inevitable necessity by God’s providence, and sometimes a contracted necessity through want of care and foresight: in this case the work may sometimes be done, provided that our neglect beforehand be repented of:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-shepard.html">Thomas Shepard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sanctification of the Sabbath in The Works of Thomas Shepard… (Boston, 1853), vol. 3, Theses Sabbaticae</cite>, pp. 258-59</span></figcaption>

<blockquote><p>6. Works of comliness, tending to honest or decent walking… By all which believers have allowance: 1. for piety, 2. for charity, 3. for what is needful for their beasts, 4. what is needful and convenient, or comely for themselves; and more is not necessary: In these the Lord has not straightned them, neither has He pinched and pinned them up to absolute necessity, but has left them to walk by Christian prudence (yet so as they may not exceed) for the disciples possibly might have endured that hunger, and not plucked the ears of corn, or beasts may live a day without water, and not be much the worse, or some sort of victuals may be provided to be set beside men on the Sabbath needing no dressing or preparing; yea, a man may live on little or nothing for one day: but the Lord has thought good not to straighten them, so as to make his day and worship a weariness and burden unto them, seeing He has made the Sabbath for man, to be refreshing to him, and not man for the Sabbath; nor will he have their consciences to be fettered with inextricable scruples: He leaveth it to men on other days how much to eat and drink by a Christian prudence (yet allows them not to exceed even on these) so here there is some latitude left to conscientious reason to walk by; for some may do something at one time, and not at another, yea, one man may take more pains in upholding his body than is called for from another who is stronger, so that it’s impossible to set particular rules which will agree to all, but [that] men would look: 1. to their end, 2. to their need, 3. to what may conveniently attain the end.</p></blockquote>

<blockquote><p>…as to the duties wherein the Sabbath is to be spent, which are shortly, all duties of immediate worship, whether they be inward, as meditation, self-examination, heart-prayer, either ejaculatory or more continued, heart-sorrow for sins, etc. or outward, as vocal prayer and singing of psalms, reading the Scriptures and other pious books, hearing the Word, etc.; or whether they be secret which may be both inward and outward, or private in families, as reading of the Word, confering on it, repeating sermons, praying together, etc. or public, as joining with the congregation in prayers and praises, hearing the Word read and the sense given, hearing of sermons, participating of the sacraments when dispensed, joining in solemn humiliations and thanksgivings when they fall necessarily or more conveniently to be on the Sabbath; All which and such like are proper duties for that day; to which liberal laying up and giving for the relief of the poor according to ability and as God blesses every man would be added as a suitable duty of it, though it be no duty of immediate worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition of the Ten Commandments… (London: Newman, 1675), 4th Commandment, Sanctification of</cite>, pp. 289-90</span></figcaption>

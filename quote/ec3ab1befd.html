<blockquote><p>§6. The reasons of this are obvious and clear. Even because it is the office of the governors to determine of such circumstances: It is the pastor’s office to guide and oversee the flock. And so the determining of time and place of worship (that’s undetermined) belongs to his office: and the choice of the subject on which he shall preach, the leading them in prayer and praise, and choice of versions, translations and other ordinary helps in his work. And therefore when he determines these, he is but in his own way and does but his own work: and therefore he is therein the judge, if the case be controvertible. If none shall obey a magistrate or pastor in the works of their own office, as long as they think he did them not the best way, all government then would be presently overthrown, and obedience denied. We are sure that God has commanded us to obey them that are over us in the Lord (1 Thess. 5:12; Heb. 13:7, 17, etc.), and therefore a certain duty may not be forborn upon uncertain conjectures, or upon every miscarriage in them that we owe it to. This would unchurch all Churches (as they are political societies). For if pastors be taken down, and the work of pastors, the Church is taken down; and if government and obedience be taken down, then pastors and their work is taken down, which will be the fruit of this disorder.</p></blockquote>

<blockquote><p>A Holy Commonwealth… is a candid confession as to why a conservative [congregationalist] Puritan fought for Parliament in the Civil War and gave his support to the Cromwells. Baxter publicly repudiated the work in 1670, and in 1683 the Oxford University authorities ordered it to be part of a book-burning that included the works of Hobbes and Milton.” – on Amazon Hale, Matthew – The Analysis of the Law 3rd ed. (d. 1676; n.p., n.d.) Hale (1609-1676) was an Anglican and influential barrister, judge and jurist most noted for his treatise, The History of the Pleas of the Crown. Hale’s early works, including, A Discourse of the Knowledge of God, reflect his early Puritan and Reformed background. After ca. 1660 his thought becomes more Arminian. Hale’s Analysis of the Common Law (below) is noted as the first published history of English law and a strong influence on William Blackstone’s Commentaries on the Laws of England. Hale’s jurisprudence struck a middle-ground between Edward Coke’s “appeal to reason” and John Selden’s “appeal to contract”, while refuting elements of Thomas Hobbes’s theory of natural law. Stair, James Dalrymple – The Institutions of the Law of Scotland, Deduced from its Originals, &amp; Collated with the Civil, Canon &amp; Feudal Laws, &amp; with the Customs of Neighboring Nations… (Edinburgh, 1681) Dalrymple (1619–1695), 1st Viscount of Stair, was a Scottish lawyer, statesman and had close relationships at times with leading covenanters. In 1662, as a judge, though it was required of him, he refused to declare the National Covenant and the Solemn League &amp; Covenant to be unlawful oaths. The work above shows influences from Stair’s philosophical training, his foreign travels, and continental jurists as well as English lawyers. In 1695 there was published a small volume entitled, A Vindication of the Divine Perfections, Illustrating the Glory of God in them by Reason and Revelation, methodically digested… It is undoubtedly Stair’s work, and was edited by the two Nonconformist divines, William Bates and John Howe. . 1700’s See below on Common Law &amp; English law. . 1800’s Thomas, John Penford – A Treatise of Universal Jurisprudence (London, 1829) ToC Bastiat, Frederic – The Law (1850; NY: 1964) Bastiat (1801–1850) was a French economist, writer and a prominent member of the French Liberal School. A Freemason and a member of the French National Assembly, Bastiat developed the economic concept of opportunity cost. As an advocate of classical economics and the economics of Adam Smith, his views favored a free market and influenced the Austrian School. Bastiat did most of his writing during the years just before — and immediately following — the Revolution of February 1848. This was the period when France was rapidly turning to complete socialism. As a Deputy to the Legislative Assembly, Bastiat was studying and explaining each socialist fallacy as it appeared. And he explained how socialism must inevitably degenerate into communism. But most of his countrymen chose to ignore his logic. Lindley, Nathaniel – An Introduction to the Study of Jurisprudence, being a translation of the general part of [Anton] Thibaut’s System Des Pandekten Rechts, with Notes &amp; Illustrations (London, 1855) Thibaut (1772–1840) was a German jurist. Wiki: “The fame of this book [of Thibaut’s] results from its being the first modern complete compendium of the subject, distinguished alike by the accuracy of its sources and the freedom and unpedantic manner in which the subject is handled. It is, in effect, a codification of the Roman law as it then obtained in Germany, modified by canon law and the practice of the courts into a comprehensive system of Pandect [Roman] law.</p></blockquote>

<blockquote><p>Some judicial precepts are Juris communis, of common equity, such as are agreeable to the instinct and law of nature, common to all men; and these for substance bind all persons, both Jews and Gentiles; as being Moral, and so agreeing with the Moral Law. These judicial precepts which were Juris particularis, of particular equity, such as pertained especially to the Jews’ commonwealth, and were fitted for them and their time, are now abolished, e.g., that a man should marry with none but his own stock; that the brother should raise up seed to his brother, and that a thief should restore fourfold, this was peculiar to the Jewish commonwealth and not to ours…. So then those judicial and civil precepts which are agreeable to the Moral Law, and do confirm and uphold it, they bind for ever. For example, ’tis a judicial Law that adulterers and adulteresses should die the death; now this being agreeable to common equity, and to the Law of Nature, as appears (Gen. 38:24) where Judah (before this judicial Law was publish by Moses) appoints Tamar his daughter-in-Law to be burnt for this sin, and Nebuchadnezzar burnt Ahab and Zedekiah for it (Jer. 29:21-23), so this judicial Law of putting witches to death by the magistrate, is agreeable to common equity, it helps to preserve all the Moral precepts which are broken by the idolatry, murder, and malice, of witches.</p></blockquote>

<blockquote><p>God can serve Himself of nothing, yea, that there are not created, locusts, caterpillars more numerous than that all the fruits of the earth can be food to them, preach the glory of the Lord’s goodness to man, and what are never to be, no less than all things that have futurition [come into being], or shall come to pass either absolutely or conditionally, are under the positive decree of God, else we should not owe thanks to the Lord for many evils that never fall out, that the Lord turns away violent death, violence of men and wild beasts, and many possible mischiefs, contrair to Deut. 28:11-12; Lev. 26:6; Ps. 34:20; Ps. 91:5-8. And all these beings or no-beings owe themselves to God to hold forth the glory of goodness, wisdom, mercy, justice, etc. suppone [suppose] there had never been sin: Far more now, who wants matter of meditation, or can write a book of all the pains, achings, convulsions, pests, diseases that the Lord decreed to hold off? so that every bone, joint, lith [limb], hair, member, should write a Psalm Book of praises, Ps. 35:10, ‘All my bones shall say, Lord, ‘Who is like unto thee?”</p></blockquote>

<main class="wrap"><figure class="quote" id="q-52f6077798" data-kw="">
<blockquote><p>There is a twofold difference between God’s forgiveness of our sins and our forgiving of others. First, we may and ought in some cases to forgive others freely, without any satisfaction at all, but God has bound Himself to another way… Again secondly, we may and ought to forgive others though they do not repent and ask pardon of us; but God has declared his will [regarding his forgiving of others] otherwise…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Doctrine of Justification Asserted &amp; Vindicated… (London, 1651), Lecture 14</cite>, p. 112</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a8149775c0" data-kw="">
<blockquote><p>1. Whether the sacred is founded in a special ordination and by divine mandate? It is affirmed. 2. Whether under the New Testament some things are relatively sacred, such as church-buildings, times (except the weekly Sabbath), utensils, tables, cups, lamps, pulpits, furnishings, cloths, garments of ministers? It is denied. 3. Whether under the New Testament, is the preaching of the Word, the water of baptism and the bread and wine in the eucharist sacred? It is affirmed. 4. Whether whatever external particular the Church has instituted is sacred? It is affirmed. See the disputation on benedictions and sacramental things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations | On the sacred 780</cite>, vol. 4 (Utrecht, 1667), ‘On the 2nd Commandment’</span></figcaption>

</figure><figure class="quote" id="q-4aab833104" data-kw="">
<blockquote><p>Anger, as stated above (Article 1), is properly the name of a passion. A passion of the sensitive appetite is good in so far as it is regulated by reason, whereas it is evil if it set the order of reason aside. Now the order of reason, in regard to anger, may be considered in relation to two things. First, in relation to the appetible object to which anger tends, and that is revenge. Wherefore if one desire revenge to be taken in accordance with the order of reason, the desire of anger is praiseworthy, and is called “zealous anger” [Cf. Gregory, Moral. v, 45. On the other hand, if one desire the taking of vengeance in any way whatever contrary to the order of reason, for instance if he desire the punishment of one who has not deserved it, or beyond his deserts, or again contrary to the order prescribed by law, or not for the due end, namely the maintaining of justice and the correction of defaults, then the desire of anger will be sinful, and this is called sinful anger. Secondly, the order of reason in regard to anger may be considered in relation to the mode of being angry, namely that the movement of anger should not be immoderately fierce, neither internally nor externally; and if this condition be disregarded, anger will not lack sin, even though just vengeance be desired.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, 2nd pt. of 2nd pt., question 158, ‘Anger’, article 2, ‘Whether anger is a sin’</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-89d508a61f" data-kw="">
<blockquote><p>Such as are sincere, will be careful to maintain Family Religion, from the Conscience of the Charge they have of them. Masters and Parents have the Charge of their Families, and are in some Measure accountable to God for them. Parents are commanded to train up their Children, and Masters are to command their Household to keep the Way of the LORD, as we see in the LORD’s Testimony of Abraham.

Thus we see, in the Fourth Command, the Master of the Family is obliged to fee to the religious observance of the Sabbath by all within his House, and so he has a Charge for which he is accountable to the great GOD: And therefore a sincere Person looks on himself as bound to be careful to maintain the Worship of GOD in his Family, and amongst those whom he has the Charge of. This made holy Job concerned to sacrifice for his Children: And the Neglect of paternal Duty in Eli provoked the LORD’s Displeasure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-halyburton.html">Thomas Halyburton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Concern of Salvation</cite>, (Edinburgh, 1721), pp 513-14.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7db4496a5" data-kw="">
<blockquote><p>…we did never condemn all significant rites in religion, even though they be not founded on divine institution. Uncovering the head is a significant rite, and we know no divine institution for it; and yet we use it in the worship of God, viz. prayer and several other exercises; and will separate from no Church because of it. That a minister preach in a decent garb, and not in a fool’s coat, is a significant rite used in religion, not founded on divine institution, yet we shall not separate for enjoyning that.</p></blockquote>

</figure><figure class="quote" id="q-10c5bf7df6" data-kw="">
<blockquote><p>Obs. IV. That our utmost care and diligence in the consideration of the mind of God are required in all that we do about his worship.—There is nothing wherein men for the most part are more careless. Some suppose it belongs unto their own wisdom to order things in the worship of God as it seems most meet unto them;—an apprehension that I shall leave this world in admiration of, that ever it should befall the minds of so many good and honest men as it hath done. But the power of prejudice is inexpressible. Some think they are no further concerned in these things than only to follow the traditions of their fathers. This unto the community of Christians is the only rule of divine worship. To suppose that it is their duty to inquire into the way and manner of the worship of God, the grounds and reasons of what they practise therein, is most remote from them. ‘It was Moses that had the command to take care about the making of the tabernacle, and not the people. There was nothing left unto them but to do and observe what he had appointed.’ And it is true; when God first reveals the way of his worship immediately from himself, as he did first by Moses, and last of all by his Son Jesus Christ, the people have nothing to do therewith, but only to observe and do what is appointed, as our Saviour expressly declares, Matt. 28:20: but when his worship is so revealed and declared, there is not the meanest person, who professeth obedience unto him, who is exempted from this command of taking most diligent care about the due discharge of his duty herein. And this care and diligence are necessary,—</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, ed. W. H. Goold, vol. 23, Works of John Owen (Edinburgh: Johnstone and Hunter, 1854), 42–43.</span></figcaption>

</figure><figure class="quote" id="q-d96ffe0e6a" data-kw="">
<blockquote><p>Much less can he [a magistrate] on pretence of parish-order tie me to an ignorant, drunken, malignant, or an inexperienced sapless [religious] teacher, that is to my soul as a silly emperic [a medical practitioner who relies solely on observation and experiment] to my health. Scripture and the world’s experience tell how much God morally gives his light and grace according to the aptitude of means: Habitus infusi se habent ad modum acquisitorum [infused habits hold themselves unto the way of those things having been acquired], is common in the schools. Twenty sinners are usually sooner brought to repentance under skilful, fit teachers than under one unskilful or ungodly man. And no man has power from God to damn my soul or forbid me the needful means of my salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Answer to Dr. Edward Stillingfleet’s Charge of Separation</cite>, … (London: 1680), ‘A Reply to Dr. Stillingfleet’s Letter’, p. 16</span></figcaption>

</figure><figure class="quote" id="q-18ab2a95ec" data-kw="">
<blockquote><p>The gestures or the external manner of administration of this sacrament must be such as most closely resembles the first Lord’s Supper administered by Christ, as well as the administration of the Lord’s Supper by the apostles and the apostolic churches as recorded in the Holy Scriptures. Then the Lord’s Supper was administered while seated at a table. Since it is a meal, it is therefore proper that it be administered in such a manner as one would serve either common or special meals. To come, one by one, to that which one calls an altar, to there receive the bread out of the hand of the celebrant—who time and again takes it from the altar and gives it to the communicant—to there receive it while kneeling, and to let it be put into his mouth, is superstitious and gives occasion for superstition. To use the sacrament standing and while passing the table is not as edifying. It also does not agree as fully with the first administration as does sitting at the table—be it that the minister gives the bread and the cup to each person one by one, or be it that he breaks the bread and puts it upon dishes which he passes on to those guests who are partaking, subsequently giving the cup to be passed on from hand to hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, vol. 2, pp. 566-67</span></figcaption>

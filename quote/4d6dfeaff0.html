<blockquote><p>Lesson 4: In that judgment the condition of the pious and of the impious will be utterly dissimilar and opposed. This is taught in the text by the separation of the sheep and the goats, by the right hand and the left hand, and by “come, ye blessed” and “depart, ye cursed.” Reasons There is a great dissimilarity and opposition between the lives and ways of the impious and [those of] the pious while they are in this world. There is a great dissimilarity and opposition between the promises that pertain to the pious and the threats that concern the impious. There is the greatest dissimilarity and opposition between the manifestation of the greatest mercy and the manifestation of the greatest avenging of justice. Use For admonition, so that we might separate ourselves from impious persons to whatever extent and in whatever way it can be done. That is, although we may not be able to be separate in regard to place, we ought to be as dissimilar as possible as much in the inner affection of our soul as [we are] from their outer conversation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sketch of the Christian’s Catechism</cite>, trans. Todd Rester, ed. R. Scott Clark (Grand Rapids: Reformation Heritage Books), on Heidelberg Catechism Lord’s Day 19.</span></figcaption>

</figure><figure class="quote" id="q-d616c94f53" data-kw="">
<blockquote><p>Heaven is not heaven without Christ. It is better to be in any place with Christ than to be in heaven itself without him. Paul loved to see Christ, to embrace him, and enjoy him that had done so much and suffered so much for his soul. To be with Christ is to be at the springhead of all happiness. Every creature thinks itself best in its own element, that is the place it thrives in, and enjoys its happiness in; now Christ is the element of a Christian. Again, it is far better, because to be with Christ is to have the marriage consummated. Is not marriage better than the contract? Is not home better than absence? To be with Christ is to be at home. Is not triumph better than to be in conflict? But to be with Christ is to triumph over all enemies, to be out of Satan’s reach. Is not perfection better than imperfection? Here all is but imperfect, in heaven there is perfection. Here the grace in a man is with combat of flesh and spirit, but in heaven there is pure peace, pure joy, pure grace. Grace indeed is glory here, but it is glory with conflict. Is it not much far better to die, that we may be with Christ, than to live a conflicting life here? Death is but a grim sergeant that lets us into a glorious palace, that takes off our rags, that we may be clothed with better robes, that ends all our misery, and is the beginning of all our happiness. Why should we be afraid of death? It is but a departure to a better condition. It is but as Jordan to the children of Israel, by which they passed to Canaan. Of itself it is an enemy indeed, but now it is harmless, nay, now it has become a friend. It is one part of the church’s journey. It ends all our misery and sin; and it is the suburbs of heaven. It is a shame for Christians to be afraid of that which Paul makes the object of his desire (Phil. 1:23).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>David B. MacKinnon</cite>, ed., Refreshment for the Soul: A Year of Daily Readings From ‘The Heavenly Doctor’ Richard Sibbes (The Banner of Truth, 2022), 30.</span></figcaption>

<blockquote><p>4. If indeed theology is considered as it is knowledge endowed by God upon creatures, either communicated in this age or to be communicated in the future age, that theology is ectypal. And this theology is fashioned by God alone from the archetype, as it were, through various ways and degrees of communication; for men turning to and fro in this world, through the grace of revelation; for angels rather, and for blessed spirits in heaven, it is received through the grace of vision, by benefit of which we also, after this life, face to face; that is, before him and closely, shall contemplate him as he is, 1 Jn. 3:2.</p></blockquote>

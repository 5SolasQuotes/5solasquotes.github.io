<main class="wrap"><figure class="quote" id="q-a72bb82a70" data-kw="">
<blockquote><p>15. The universal Monarch of the Church, the Catholic Church, is Jesus Christ alone. 16. And this universal Monarch does not need anyone besides Christ. Against Bellarmine, Book I, Chapter 9, On the Roman Pontiff. 17. Peter the Apostle was not the Monarch, Head, and Prince of the whole Church in the place of Christ. Against Chapter 10 and the following until the end of the book. 18. The Roman Pontiff did not succeed Peter the Apostle in the Ecclesiastical Monarchy or in the primacy of the universal Church. Against Book 2, On the Roman Pontiff.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Analytical Theses on Colossians, containing the Exordium of the Epistle’, pt. 2 $3 Download tr. Jonathan Tomes (Basel: Johannes Schroeter, 1601), sect. XIV, Consequences</cite></span></figcaption>

</figure><figure class="quote" id="q-3addbfe7cd" data-kw="">
<blockquote><p>V. 7. ‘I would that all men were even as I my self.’ The apostle does not simply wish that all men and women led a single life; for so the Church of God could not be propagated, nor [would] the divine benediction upon the married [be] fulfilled: but that all had the gift of continency, and were as free from worldly cares, and fleshly entanglings, as he. And this gift of continencie may stand with holy matrimony; as we read of Malchus and many others in the Ecclesiastical stories, who though they were married, yet having the gift of continency fulfilled the apostle’s precepts, verses 29 &amp; 32, having wives as if they had them not, and caring for the things of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/english-annotations.html">English Annotations</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Annotations on the Whole Bible, vol. 2 (Isa-Rev), 1st ed. (1645), on 1 Cor. 7, v. 7</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-f03dd13181" data-kw="">
<blockquote><p>Thus, intellect and reason may not be considered as a basis for, as a rule to go by, or as a touchstone, in determining whether that which God reveals in His Word is truth. We believe this solely … because God declares it to be so. Reason must surrender itself to the Word; the Word must never surrender itself to reason. Reason is to Scripture what Hagar was to Sarah; it is the servant and not the master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian&#x27;s Reasonable Service</cite>, vol. 1, ch. 2, pp. 59–60</span></figcaption>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, 1560, Point 7, §4: The Papists Abolish the True Intercession of Jesus Christ</span></figcaption>

</figure><figure class="quote" id="q-6b39c2095a" data-kw="">
<blockquote><p>Therefore no other writings of men, although never so holy, no custom, no multitude, no antiquity, nor prescription of times, nor personal succession, nor any councils; and, to conclude, no decrees or ordinances of men, are to be matched or compared with these divine Scriptures, and this bare truth of God; for so much as God&#x27;s truth excelleth all things. For all men of their own nature are liars, and lighter than vanity itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 7</span></figcaption>

</figure><figure class="quote" id="q-8d052c2daa" data-kw="">
<blockquote><p>Some distinguished men among the Roman Catholics have asserted, that the Scriptures owe all their authority to the Church; so that if she did not give her attestation to the gospels, they would have no more authority than Æsop&#x27;s Fables. But when asked how the Church can establish her authority, they must answer, that it is proved by the testimony of the Scriptures. This is a perfect example of the sophism called &quot;a circle,&quot; for they prove the authority of the Scriptures by the Church, and the authority of the Church by the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evidences of the Authenticity, Inspiration, and Canonical Authority of the Holy Scriptures</cite>, ch. on the canon of the New Testament, pp. 273–274</span></figcaption>

</figure><figure class="quote" id="q-38e6700b84" data-kw="">
<blockquote><p>For it is to be held undoubtingly, as we shall hereafter prove most largely, that the revealed and written word of God is the sole rule of faith, which is a thing prior to the faith of the church. … If he feign another rule of faith besides the written word of God, we reject, repudiate, and refuse to acknowledge any such, and reduce the whole rule of the catholic faith to the scripture alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question III, ch. 10</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-52cea21618" data-kw="">
<blockquote><p>2. But then all that are justified must be fully persuaded of their justification and that faith is essentially a persuasion and assurance of the love of God to me in Christ [as Antinomians taught], it’s more than I could ever learn to be the nature of faith, a consequent separable I believe it is. 3. If by ‘apprehending Christ and his righteousness’ be understood a relying and fiducial acquiescing and recumbency on Christ for salvation: It is granted in this sense that faith is a bottom to our assurance of our being in Christ; but that it breeds assurance in a reflect knowledge always that a believer is in Christ, is not true: for: 1. I may believe and be justified and not know, yea positively doubt that I believe and am justified, as thousands have pardon and have no peace nor assurance of their pardon and have faith in Christ and in his free love, and have no feeling of Christ and of his free love. For we believe more truth of our own graces (and so of our faith and assurance of our pardon) than we can see or feel, which is God’s dispensation, that our life should be hid with Christ in God; therefore the life of faith, by which the just do live, is hid, and above the reach of feeling at all times. 2. As faith, which is the direct act of knowing and relying on Christ for pardon, is a work of the Spirit, above the reach of reason, so also the reflect act of my knowing and feeling, that I believe and am in Christ, which proceeds sometime from faith and the immediate testimony of the Spirit, sometime from our walking in Christ, 1 Jn. 2:3-4; 1 Jn. 3:14, is a supernatural work, above the compass and reach of our free-will, and is dispensed according to the spirations and stirrings of the free grace of God; and as the keeping of his commandements, actu primo [by the first act, as it is in itself], and in itself, gives testimony that the soul is in Christ and justified, even as the act of believing in itself does the same, yet that we actu secundo [by the second or following, exercised act], efficaciously know and feel that we are in Christ, from the irradiation and light of faith and sincere walking with God, is not necessary, save only when the wind of the actual motion and flowing of the Spirit concur with these means; just as the Gospel-promises of themselves are life and power, but they then only actually, actu secundo, animate and quicken whithered souls, when the Lord is pleased to contribute his influence in the shining of his Spirit. Otherwise I may walk in darkeness, yea believe, pray, love, die for pain of love and have no light, reflect-knowledge and feeling that I am in Christ, Isa. •0:10. I may be sick of love for Christ, call, knock, pray, confer with the watchmen, and daughters of Jerusalem, and be at a low ebb in my own sense; yea the beloved may to my feeling and actual assurance have withdrawn Himself, Cant. 3:1-5; 5:5-8, and all my inherent evidences cannot quicken me in any tolerable assurance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself (London: 1647)</cite>, pp. 85-86</span></figcaption>

</figure><figure class="quote" id="q-e969d4333a" data-kw="">
<blockquote><p>This is, therefore, done because the promises of life offered to us in Him are then applied to our use and made effectual to us when we accept them, and in no wise doubt but that we will enjoy those things which the Lord by His own mouth has assured us of. So that the righteousness which we obtain by faith depends upon the free, gracious promises of God, by which God declares and testifies unto us that we are beloved of Him.</p></blockquote>

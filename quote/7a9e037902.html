<blockquote><p>(6) Works may be considered either as meritorious ex condigno, so as their merit should arise from their own intrinsic worth, or ex congruo only with respect unto the Covenant and promise of God. Those of the first sort are excluded at least from the first justification; the latter may have place both in the first and second. (7) Moral causes may be of many sorts; preparatory, dispository, meritorious, conditionally efficient, or only sine quibus non. And we must diligently inquire in what sense, under the notion of what cause or causes, our works are excluded from our justification, and under what notions they are necessary thereunto. And there is no one of these distinctions but it needs many more to explain it, which accordingly are made use of by learned men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), | General Considerations, p. 34</span></figcaption>

<blockquote><p>I. Repentance unto life is an evangelical gracea… a. Zec 12:10; Acts 11:18 II. By it a sinner… upon the apprehension of his mercy in Christ to such as are penitent, so grieves for and hates his sins as to turn from them all unto God,a purposing and endeavoring to walk with him in all the ways of his commandments.b a. Ps 51:4; 119:128; Isa 30:22; Jer 31:18-19; Ezek 18:30-31; 36:31; Joel 2:12-13; Amos 5:15; 2 Cor 7:11 b. 2 Kings 23:25; Psa 119:6, 59, 106; Luke 1:6 III. Although repentance be not to be rested in as any satisfaction for sin, or any cause of the pardon thereof,a which is the act of God’s free grace in Christ;b yet is it of such necessity to all sinners that none may expect pardon without it.c a. Eze 16:61-63; 36:31-32 b. Hos 14:2, 4; Rom 3:24; Eph 1:7 c. Luke 13:3, 5; Acts 17:30-31“ . . Articles 1600’s Davenant, John – section 5 in ch. 31, ‘Of the Necessity of Works to Salvation, or Justification’ in A Treatise on Justification: or The Disputatio de justitia habituali et actuali…, vol. 1 trans. Josiah Allport (d. 1641; London: Hamilton, 1844/1846), pp. 299-300 Note that what Davenant says here is substantially the same as what Owen says below, with a bit of difference of some terminology. Davenant would have done better to, instead of using the term “good works” in this context, to use “a certain inherent righteousness,” similar to Goodwin below. Davenant here denies that works are efficient or meritorious causes of justification. Yet he affirms that certain inward works, or a certain inherent righteousness, is necessary as concurrent or preliminary conditions to justification, which accompany it, by way of order, not of causality; and these things “He Himself effects in us.</p></blockquote>

</figure><figure class="quote" id="q-11aad528b3" data-kw="">
<blockquote><p>Assertion 7. Not any protestant divines I know make true repentance a work of the Law, going before faith in Christ.

1. The Law speaks not one word of repentance, but says either do or die. Repentance is an evangelic ingredient in a saint.

2. Christ was made a Prince and exalted to give repentance, Acts 5:31, and the Law, as the Law, has not one word of Christ, though it cannot contradict Christ, except we say that there be two contradictory wills in Christ, which were blasphemy; but some dispositions before conversion I conceive Antinomians yield to us. For one says, speaking of the manner of his conversion: ‘One main thing, I am sure, was to get some soul-saving-comfort; that moved me to reveal my troubled conscience to godly ministers, and not in general to allay my trouble.’ Yet I can make good from Scripture that this desire can be in no unconverted soul; a physician that mistakes the cure doctrinally will prove a cousening [deceiving] comforter. And another says: ‘The persons capable of justification are such as truly feel what lost creatures they are in themselves and in all their works: this is all the preparative condition that God requires on our part to this high and heavenly work, for hereby is a man truly humbled in himself, of whom God speaks, saying, ‘I dwell with him that is of an humble spirit, etc. [Isa. 57:15]’ To make persons capable of justification, here is required a true feeling that they are lost in themselves and in all their works. But this can be no preparative condition of justification, as Eaton says, because: [1.] True feeling must follow faith, not go before it.

2. And true feeling is proper to justified persons, nothing going before justification, and so, [that] which is found in unjustified persons, can be proper to justified persons only.

3. Antinomians say, ‘Sinners as Sinners, and consequently all sinners’ are to believe justification in Christ, without any foregoing preparation. This man says, ‘Prepared and feeling persons that are sensible of sin, are only capable of justification.’

4. To truly feel a lost condition cannot be all the preparative condition, for the Word has annexed no promise of justification to the unjustified who shall feel his lost condition. For the place Isa. 57 speaks of a justified sinner, not of an unjustified [person] who is only prepared for justification:

1. Because God dwells in this humbled soul, then He must be justified and converted. Eph. 3:17, ‘That Christ may dwell in your heart by faith.’

2. This is a liver by faith, and so justified; ‘The just shall live by faith,’ Hab. 2:4; Rom. 1:17; Gal. 3:11; Heb. 10:38; and he must live by faith whom the high and lofty One revives.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), pp. 244-45</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

nd+so%2C+%5Bthat%5D+which+is+found+in+unjustified+persons%2C+can+be+proper+to+justified+persons+only.+3.+Antinomians+say%2C+%E2%80%98Sinners+as+Sinners%2C+and+consequently+all+sinners%E2%80%99+are+to+believe+justification+in+Christ%2C+without+any+foregoing+preparation.+This+man+says%2C+%E2%80%98Prepared+and+feeling+persons+that+are+sensible+of+sin%2C+are+only+capable+of+justification.%E2%80%99+4.+To+truly+feel+a+lost+condition+cannot+be+all+the+preparative+condition%2C+for+the+Word+has+annexed+no+promise+of+justification+to+the+unjustified+who+shall+feel+his+lost+condition.+For+the+place+Isa.+57+speaks+of+a+justified+sinner%2C+not+of+an+unjustified+%5Bperson%5D+who+is+only+prepared+for+justification%3A+1.+Because+God+dwells+in+this+humbled+soul%2C+then+He+must+be+justified+and+converted.+Eph.+3%3A17%2C+%E2%80%98That+Christ+may+dwell+in+your+heart+by+faith.%E2%80%99+2.+This+is+a+liver+by+faith%2C+and+so+justified%3B+%E2%80%98The+just+shall+live+by+faith%2C%E2%80%99+Hab.+2%3A4%3B+Rom.+1%3A17%3B+Gal.+3%3A11%3B+Heb.+10%3A38%3B+and+he+must+live+by+faith+whom+the+high+and+lofty+One+revives.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Christ+Dying+%26+Drawing+Sinners+to+Himself%2C+%28London%3A+1647%29%2C+pp.+244-45&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F11aad528b3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/11aad528b3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-relation-of-repentance-to-saving-faith-justification/#:~:text=Assertion%207.%20Not%20any%20protestant%20divines,the%20high%20and%20lofty%20One%20revives&amp;text=Assertion%207.%20Not%20any%20protestant%20divines%20I%20know&amp;text=faith%20whom%20the%20high%20and%20lofty%20One%20revives" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Objection [of Papists]: But the minister may mistake the matter [in assuring a person of salvation]. Answer: True, if he speak absolutely, but if he speak upon condition of faith and true repentance he may thereupon assure a man of salvation: he may say, ‘Believe thou and repent truly, and thou shalt be saved.’ If a king should publish and make known that whosoever of such a city shall come and do such a thing, shall be thus or thus rewarded, and give charge to some to make it known to that city, shall we say that any having authority to publish the king’s pleasure, does mistake the matter in so doing, or that any of that place, to whom it should be said, go thou and do that which the king has appointed, and he thereupon going, and doing the thing appointed, does presume to take on him to know more than he ought touching the king’s pleasure? Surely no.</p></blockquote>

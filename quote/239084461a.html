<main class="wrap"><figure class="quote" id="q-239084461a" data-kw="">
<blockquote><p>It was at Poietiers that the evangelisation of France began in a systematic way. The school which Calvin here gathered round him comprehended persons in all conditions of life… They discoursed about Divine mysteries as they walked together on the banks of the neighboring torrent, the Clain, or as they assembled in the garden of the Basses Treilles, where… they often held their re-unions… By-and-by it was thought prudent to discontinue these meetings in the Basses Treilles, and to seek some more remote and solitary place of re-union. A deep and narrow ravine… then known as the ‘Cave of Benedict,’ but which from that day to this has borne the name of “Calvin’s grotto,” was selected as the scene of the future gatherings of the converts. It was an hour’s walk from the town… In this grotto, so far as the light of history serves, was the Lord’s Supper celebrated for the first time in France after the Protestant fashion. On an appointed day the disciples met here, and Calvin, having expounded the Word and offered prayer, handed round the bread and cup, of which all partook… The place had none of the grandeurs of cathedral, but ‘the glory of God and the Lamb’ lent it beauty. No chant of priest, ‘no swell of organ accompanied the service, but the devotion of contrite hearts, in fellowship with Christ, was ascending from that rocky chamber, and coming up before the throne in heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-a-wylie.html">J.A. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The History of Protestantism, vol. 2, p. 179</cite></span></figcaption>

9084461a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/239084461a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/musical-instruments/#:~:text=It%20was%20at%20Poietiers%20that%20the,up%20before%20the%20throne%20in%20heaven&amp;text=It%20was%20at%20Poietiers%20that%20the%20evangelisation%20of&amp;text=and%20coming%20up%20before%20the%20throne%20in%20heaven" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9aed13649e" data-kw="">
<blockquote><p>What natural, or carnal affections may be excited by them [ceremonies], as men may inflame themselves with idols, Isa. 57:5, or what outward, outside devotion they may direct unto or excite, is uncertain; but that they are no means of stirring up the grace of God in the hearts of believers, or of the increase or strengthening of their faith, which things alone God accepts in Gospel worship, seeing they are not appointed by Him for any such purpose, is most certain: For to say that anything will effectually stir up devotion, that is, excite, strengthen or increase grace in the heart towards God, that is not of his own appointment, is on the one hand to reflect on his wisdom and care towards his Church, as if he had been wanting towards it in things so necessary, which He declares against, Isa. 5:4, ‘What,’ says He, ‘could have been done more to my vineyard, that I have not done in it?’; So on the other [hand], it extols the wisdom of men above what is meet to ascribe unto it. Shall men find out that which God would not, or could not, in matters of so great importance unto his glory and the souls of them that obey Him? yea, and it cannot be but that attendance unto them and their effects must needs divert the mind from those proper spiritual actings of faith and grace, which is its duty to attend unto. And this is evidently seen in them who indulging to themselves in their observation in multiplied instances, as in the Church of Rome, have changed the whole spiritual worship of the Church, into a theatrical pompeous show of carnal devotion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Instruction in the Worship of God</cite>, … (London: 1667), Question 14, ‘May not the Church find out and appoint to be observed such religious rites as being adjoined unto the celebration of God’s instituted worship, may farther the devotion of the worshippers, and render the worship itself in its performance more decent, beautiful and orderly…?’ pp. 57-58 This quote’s context does not specifically respect musical instruments.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>

%20in%20the%20worship%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

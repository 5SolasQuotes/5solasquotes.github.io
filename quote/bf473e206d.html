<main class="wrap"><figure class="quote" id="q-bf473e206d" data-kw="">
<blockquote><p>Doct. 1. Our good works are no ways the cause of our justification, but the effects and fruits of a man justified.

It is gathered from the Text [James 2: 22], for as much as works are the effects of faith: And faith and justification according to the nature of relatives, are at once or together in nature. A true believer and a justified man are the same thing. If therefore good works are the effects of a believer, then are they the effects of one justified also. And that works justify us not, is apparent from four reasons.

Reas. 1. Because believers are not now under the Covenant of works, and therefore cannot be justified by works, but are all condemned by them; if we stand to them in that point, because none of them come up to what the Law requires, and so are sinful and imperfect.

Reas. 2. Because all our good works are debts, and therefore they can never properly merit or deserve pardon.

Reas. 3. Because the good works we do, came not from our own strength, but from the grace of God.

Reas. 4. Because our best good works are in themselves imperfect, and defiled with many uncleannesses.

Object. 1. Our good works are perfect, as they come from the Holy Spirit, whose works are all perfect.

Ans. 1. If in respect of us they be imperfect, they cannot as ours be of force to our justification, though in some other respect they may be perfect.

2. That perfection which they have in reference to the Holy Spirit, doth not redound properly unto our meriting or deserving by them, because the holy Ghost is no ways united unto us, into one person, which is the only ground, why the works of Christ had a divine merit and worth in them; namely, because they were divine works, as being his, that was, as man personally united unto the God-head and person of the Son, so as they made but one person. The Holy Spirit, then though he be the principal cause of our good works, yet this is in its own manner, as an external efficient, as having no personal union with the party working.

Object. 2. Our reward is given according to our works.

Ans. That reward is not of our merit, but of God’s free grace and favour. For there is a reward of servants and a reward of sons; the reward of servants looks not to the person, but to the merit, or desert of the work; but the reward of sons looks at the person chiefly, and so is given of grace and good will to the person of the worker, more than to the merit of the work. For the Father in his Son crowns that with reward, which in it self deserves no such thing for the most part: Otherways he were unjust not to reward it so in servants likewise.

Use, Of Admonition, that we never glory in our selves or our own works before God, but always acknowledge, when we have done all that we can; that we are but unprofitable servants, as our Lord himself teacheth us to do; and that we depend wholly on the grace of God, putting no trust in our own works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism, in LII. Lectures, on chosen texts of Scripture, for each Lord’s-Day of the Year, Learnedly and Perspicuously Illustrated with Doctrines, Reasons and Uses</cite>, (London: Thomas Davies, 1659), Lecture XXIV, pp 162-64.</span></figcaption>

<blockquote><p>4. That the promises concerning perseverance (as has been often intimated) are of two sorts. The first, of the continuance of the favor of God to us, which respects our justification. The other, of the continuance of our obedience unto God, which respects our sanctification… … 2. For those of the first sort, which I shall now handle… I shall propose only some few things unto consideration… … 2. That these promises of God do not properly, and as to their original rise, depend on any conditions in believers or by them to be fulfilled, but are the fountains and springs of all conditions whatever that are required to be in them or expected from them; though the grace and obedience of believers are often mentioned in them, as the means, whereby they are carried on according to the appointment of God unto the enjoyment (or continued in it) of what is promised.</p></blockquote>

<blockquote><p>The sum of my doctrine which I bring them [Scriptures] to confirm, I contract into these heads.

1. That faith justifies not as an instrumental efficient cause, but as conditio applicans et disponens, the applying and disposing condition: its applicatory nature being the aptitude to the office, and its being the condition of the promise being the formal or nearest reason of its interest.

2. That repentance is conditio disponens, a dispositive condition of our first justification.

3. That Covenant-keeping by sincere love, thankfulness and obedience to God▪ Redeemer is a condition of the continuing, or not-losing our state of justification.

4. That the renewal of our faith and repentance, upon our lapses into discerned wounding sins, is a condition of the particular pardon of those sins, and our discharge or justification from the guilt of them.

5. That all the foresaid conditions, faith, repentance, love, thankfulness, sincere obedience, together with final perseverance, do make up the condition of our final absolution in judgment, and our eternal glorification.

6. That in the Day of Judgement, seeing we must be Judged by the Gospel or New Covenant, and it will be no small part of the work of the day to enquire whether we have performed the conditions of that Covenant which gives us Christ, and life and pardon, or not; we must therefore against the accusation of non-performance (real or supposed) be justified by our own performance as our particular righteousness: and this is the judging or jusiifying us according to our works, which Scripture mentions. And upon this will our universal and final justification depend, as upon its condition. And therefore whoever will be justified at that day, must have a Justitia prolegalis or a righteousness of remission of sin through the blood of Christ, to plead against the Law, and also a personal evangelical righteousness, consisting in a performance of the conditions of the Gospel or new Covenant, which is the condition of our interest in the first; or else he cannot be justified (yet is this latter but subordinate to the former, as to that sentential absolution).

7. Seeing this twofold righteousness is necessary to our justification in judgment, therefore it must needs follow that it is necessary to the making us righteous, or our constitutive justification in this life (in the order before laid down): For the Law is the rule of judgment; and God judges men to be as they are; and therefore He makes them righteous, both by remission of all sin and by giving them to perform the conditions of the New Covenant, before He judge them so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter’s Confession of his Faith</cite>, … (London: 1655), ch. 3, pp. 56-57</span></figcaption>

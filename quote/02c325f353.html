</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3df12a43cc" data-kw="">
<blockquote><p>And I make no doubt but some opinions as well as practices render men unmeet for Church-communion, Tit. 3:10; 2 Jn. 10. All opinions which overthrow doctrines necessary to be believed, which the apostle comprehends under the name of Faith; and all such opinions as are inconsistent with an holy life and te power of godliness, which the apostle comprehends under the name of a good conscience, 1 Tim. 1:19-20. Whosoever shall hold or maintain any such opinions as these, he is either to be kept out, if not admitted; or cast out, if he be in Church-fellowship. In receiving such you receive but spies and incendiaries among you. What a fire-brand did Arius prove, not only in the Church of Constantinople, but even to the whole world? Men of graceless hearts and erroneous heads will give a continual exercise to the patience of sober Christians… if they can be discerned before they be admitted, a little preventive care would be of singular and seasonable use to the tranquillity of Church-societies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Planelogia, a Succinct &amp; Seasonable Discourse of the Occasions, Causes, Nature, Rise, Growth &amp; Remedies of Mental Errors</cite>, ... (London: Roberts, 1691), pp. 438-39, 446 Flavel was a presbyterian. | Direction 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>England had a divided church. Even among puritans, fault lines had visibly widened under the pressure of the civil war and its aftermath. After his own traumatic experience of the war, Baxter longed for order and peace, and he developed a lifelong yearning to bring Christians together in unity. He identified four main parties within the English church (Congregationalists, Episcopalians, Erastians, and Presbyterians), but he felt that the moderates within each party held similar views and, more importantly, could work together in practice even if their principles varied. He believed that if England’s ministers simply got on with the work of ministry, they would be too busy to notice how their differing doctrines of church government might otherwise keep them apart. So he formed the Worcestershire Association, a network open to local parish ministers of all stripes who met monthly for the purpose of mutual edification and encouragement. In 1653 they published their agreement to work together, and similar ministerial associations sprang up in other counties.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Intro | For background to Baxter’s paradigmatic and influential association of moderates of the differing parties for the sake of the Gospel and pastoral work (during a political and ecclesiastical vacuum), and the other similar associations which were modeled after it, see Tim Cooper, When Christians Disagree: Lessons from the Fractured Relationship of John Owen and Richard Baxter (Crossway, 2024), pp. 23, 91-92, 104. Cooper:, p. 23</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>2. I do not speak against men’s seeking a reconciliation with Rome on just and honest terms. I think it one of the happiest works in the world, could it be accomplished: And I think the French are the only people to be first dealt with to that end. And I long to see providence so turn things about as that there might be a council first of these two nations for the attempting of such a work. And I am past doubt that it would be the happiest way to pull down Antichrist (if the Pope be he) that has been yet of late undertaken. But if ever such a thing be accomplished, it must be by uniting in one creed, as containing all things sufficient to salvation, which must be wholly taken out of Scripture and not such as the Trent Confession is: Upon which agreement they may openly acknowledge each other for brethren and true Churches, without compelling each other to uniformity in the lesser matters, but bearing with each others’ differences. I wish England such rulers as will faithfully prosecute such a pacific enterprise, without sinful compliance and betraying of the truth. Though I confess when I consider their principles and practices, I am afraid bishop Hall is in the right, that There’s no peace with Rome. Yet no fears must hinder men from any just and necessary enterprise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord</cite>, (London: A.M., 1653) | ‘Objections Answered’, pp. 94-95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Schismatical is such as was the schisms of the Donatists [in the Early Church], which separated themselves from the true Church of God under the pretense of a more absolute life and a more perfect holiness… But none of these [kinds of schisms] can be justly imputed unto us declining from the Romish Church, for that departing is without all blame, which is not from a true Church, but from a false Church: not from the people of God, but from the persecuters of the people of God, not from the articles of the Faith and sound doctrine of the church, but from errors which darken the articles of the Faith and from the wicked traditions of men, which specially is not done by any lightness but by necessity, not for the desire of innovation but for true religion’s sake, and to recover the true Faith according to the testimony of the eternal verity, that leaving the fellowship of darkness, we may be gathered again in true light, placed with Christ and all his members. So we at this day have forsaken that Romish Sea full of false doctrine and idolatry, and flowing with the innocent blood of martyrs, and have embraced the evangelic and apostolic doctrine, and so Christ Himself being head of the Church, which is the commmunion of all saints believing in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-alley.html">William Alley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Poor Man’s Library Rapsodiæ G.A. Bishop of Exeter upon the First Epistle of Saint Peter</cite>, ... (1560; London: Day, 1565), Lecture 7, Now to the Romish Church, Response, 3. Schismatical, p. 246 Alley was the Anglican bishop of Exeter during the reign of Queen Elizabeth I.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Schismatical is such as was the schisms of the Donatists [in the Early Church], which separated themselves from the true Church of God under the pretense of a more absolute life and a more perfect holiness… But none of these [kinds of schisms] can be justly imputed unto us declining from the Romish Church, for that departing is without all blame, which is not from a true Church, but from a false Church: not from the people of God, but from the persecuters of the people of God, not from the articles of the Faith and sound doctrine of the church, but from errors which darken the articles of the Faith and from the wicked traditions of men, which specially is not done by any lightness but by necessity, not for the desire of innovation but for true religion’s sake, and to recover the true Faith according to the testimony of the eternal verity, that leaving the fellowship of darkness, we may be gathered again in true light, placed with Christ and all his members. So we at this day have forsaken that Romish Sea full of false doctrine and idolatry, and flowing with the innocent blood of martyrs, and have embraced the evangelic and apostolic doctrine, and so Christ Himself being head of the Church, which is the commmunion of all saints believing in Christ.”

— William Alley, The Poor Man’s Library Rapsodiæ G.A. Bishop of Exeter upon the First Epistle of Saint Peter... (1560; London: Day, 1565), Lecture 7, Now to the Romish Church, Response, 3. Schismatical, p. 246 Alley was the Anglican bishop of Exeter during the reign of Queen Elizabeth I.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSchismatical+is+such+as+was+the+schisms+of+the+Donatists+%5Bin+the+Early+Church%5D%2C+which+separated+themselves+from+the+true+Church+of+God+under+the+pretense+of+a+more+absolute+life+and+a+more+perfect+holiness%E2%80%A6+But+none+of+these+%5Bkinds+of+schisms%5D+can+be+justly+imputed+unto+us+declining+from+the+Romish+Church%2C+for+that+departing+is+without+all+blame%2C+which+is+not+from+a+true+Church%2C+but+from+a+false+Church%3A+not+from+the+people+of+God%2C+but+from+the+persecuters+of+the+people+of+God%2C+not+from+the+articles+of+the+Faith+and+sound+doctrine+of+the+church%2C+but+from+errors+which+darken+the+articles+of+the+Faith+and+from+the+wicked+traditions+of+men%2C+which+specially+is+not+done+by+any+lightness+but+by+necessity%2C+not+for+the+desire+of+innovation+but+for+true+religion%E2%80%99s+sake%2C+and+to+recover+the+true+Faith+according+to+the+testimony+of+the+eternal+verity%2C+that+leaving+the+fellowship+of+darkness%2C+we+may+be+gathered+again+in+true+light%2C+placed+with+Christ+and+all+his+members.+So+we+at+this+day+have+forsaken+that+Romish+Sea+full+of+false+doctrine+and+idolatry%2C+and+flowing+with+the+innocent+blood+of+martyrs%2C+and+have+embraced+the+evangelic+and+apostolic+doctrine%2C+and+so+Christ+Himself+being+head+of+the+Church%2C+which+is+the+commmunion+of+all+saints+believing+in+Christ.%E2%80%9D%0A%0A%E2%80%94+William+Alley%2C+The+Poor+Man%E2%80%99s+Library+Rapsodi%C3%A6+G.A.+Bishop+of+Exeter+upon+the+First+Epistle+of+Saint+Peter...+%281560%3B+London%3A+Day%2C+1565%29%2C+Lecture+7%2C+Now+to+the+Romish+Church%2C+Response%2C+3.+Schismatical%2C+p.+246+Alley+was+the+Anglican+bishop+of+Exeter

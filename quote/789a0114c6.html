<main class="wrap"><figure class="quote" id="q-789a0114c6" data-kw="">
<blockquote><p>Behold, they paint and portray Jesus Christ, who (as we know) is not only man, but also God manifested in the flesh: and what a representation is that? He is God’s eternal Son in whom dwells the fullness of the God head, yea even substantially. Seeing it is said, substantially, should we have portraitures and images whereby only the flesh may be represented? Is it not a wiping away of that which is chiefest in our Lord Jesus Christ, that is to wit, of his divine Majesty? Yes: and therefore whensoever a crucifix stands mopping and mowing in the Church, it is all one as if the Devil had defaced the Son of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons on Deuteronomy</cite>, Sermon on Deuteronomy, May 23, 1555</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-33147b1c16" data-kw="">
<blockquote><p>The angel of the Lord; not a created angel, but the Angel of the covenant, Christ Jesus, who then and ever was God, and was to be man… And these temporary apparitions of his were presages or forerunners of his more solemn mission and coming… I am the Lord, etc. …By a flame of fire was fitly represented God’s majesty, and purity, and power.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations on the Bible, on Exodus</cite>, ch. 3, verse 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-942af74721" data-kw="">
<blockquote><p>Though making of images simply be not unlawful and discharged by this [2nd] Commandment, yet thereby every representation of God (who is the object to be worshipped) and every image religiously made use of in worship is condemned (though civil and political images and statues, which are used as ornaments, or badges of honor, or remembrancers of some fact, etc. be not condemned)… …images (otherwise lawful) when abused to idolatry become unlawful, and are not to be suffered but orderly to be removed, we call that more than a civil or a common use, when religious worship or reverence is purposely intended to them, or there is, by some one occasion or other, danger lest they may be so abused; and of this sort (viz. dangerous ones) are: 1. Images in places of worship, but it is not idolatry to have dead men’s images on their tombs or monuments in churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Ten Commandments</cite>, … (London, 1675), 1st Commandment, pp. 55 &amp; 57-58</span></figcaption>

</figure><figure class="quote" id="q-3811ee3ef9" data-kw="">
<blockquote><p>Let those attend to this who set about hunting for miserable pretexts in defence of the execrable idolatry in which for many past ages true religion has been buried and sunk.</p></blockquote>

</figure><figure class="quote" id="q-21f55b1030" data-kw="">
<blockquote><p>Beginning in the second half of the sixth century, a slow but steady diffusion of icons of saints, of Christ, and of the Virgin is evident in the Empire… These icons do not, however, indicate the prevalence of a form of icon worship during this period, for most of them were, in fact, ‘simple commemorative and ex voto images,’ with the exception of some that were considered relics and therefore endowed with miraculous or intercessory powers. The origin of the cult of icons apparently dates to a later time, probably toward the end of the seventh century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/juan-s-codoner.html">Juan S. Codoñer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Melkites &amp; Icon Worship during the Iconoclastic Period’ in Dumbarton Oaks Papers</cite>, vol. 67 (2013), pp. 135-87, p. 135</span></figcaption>

<main class="wrap"><figure class="quote" id="q-8647513db6" data-kw="">
<blockquote><p>2nd Conclusion. Thence may well be deduced that they are lawful pastors and need not a calling revealed, who, in cases of extraordinary necessity are only chosen by the people, and not ordained by pastors; and that pastors ordained by pastors, as such, are pastors of the same nature, as Matthias called by the Church and Paul immediately called from Heaven, had one and the same office by nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (1644), pt. 1</cite>, p. 186</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

<blockquote><p>3. When God commands such offices to be in his house, which depend immediately upon his own immediate will of giving gifts essentially required to these offices, then these offices are so long in his Church as God is pleased by his immediate will to give these gifts; and when God denies these gifts essentially requisite, sure it is, his immediate will has altered and removed the office, not the will of the Church, so the Lord has altered and removed these offices and gifts of apostles, who could speak with tongues and seal their doctrine with miracles, evangelists, prophets extraordinarily inspired, gifts of healing, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646)</cite>, p. 64</span></figcaption>

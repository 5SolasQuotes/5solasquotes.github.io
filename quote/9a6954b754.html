<main class="wrap"><figure class="quote" id="q-9a6954b754" data-kw="">
<blockquote><p>In a posthumously published undated discourse, which was probably written in the 1670s, John Owen alluded to the selling of the Scottish Covenanters into slavery. When commenting on the recent religious declension in Britain after a period of significant progress following the Reformation, Owen observed that “Many [believers], indeed, are in great misery and distress: some I have heard of lately sold for slaves, for the testimony of their conscience.” [1]

The editor of Owen’s Works, William H. Goold, notes that at the time Owen delivered these discourses, “many of the Scottish Covenanters were banished. They were crowded into vessels bound for the West Indies or North America; and, after enduring fearful sufferings on the passage, were sold, when they reached Jamaica or Carolina, to work as slaves on the plantations.” Goold also observes that Owen’s language suggests that he is alluding to events at some distance from himself, which makes it most probable that he was referring to the actions of the government in Scotland. [2]

[1] John Owen, Several Practical Cases of Conscience Resolved. Delivered in Some Short Discourses at Church Meetings (1721), Discourse III (n.d.) in The Works of John Owen, ed. William H. Goold (16 vols, Edinburgh: Banner of Truth, 1965), ix, 367.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Founding Sins: How a Group of Antislavery Radicals Fought to put Christ into the Constitution</cite>, (New York: Oxford University Press, 2016), pp 32-34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>1 Cor. 6:12, ‘All things (indifferent) are lawful in themselves, but they are not expedient,’ if we be brought under the power or band of them by law. Therefore, in the means of worship, not only must we see what is lawful, but also what is profitable and conducing to the end… 1 Cor. 7:6, ‘But this I speak by permission, not of commandment.’ Therefore in things in which God has granted us liberty, to do or not to do, permission has place, not obliging necessity or penal laws. 13th Proposition. There cannot be commanding laws in things that are politicly good or evil according to the individual complexion, temperature, or gifts of singular men: [for example] to marry or not to marry, cannot be commanded, for where God looses, no power on earth can bind, v. 33. 1 Cor. 8:7, Paul condemns them in the use of their Christian liberty, ‘Howbeit there be not in every man this knowledge;’ then that rulers may make laws in things indifferent, without scandal, they must remove ignorance. 2. If there be but one person weak in knowledge (there is not in every man that knowledge), a law obliging all in things indifferent cannot be made.</p></blockquote>

<blockquote><p>Besides the moral law, God gave to Israel ceremonial and judicial laws; the two latter are of limited and temporary use; the former is of universal and perpetual obilgation. … 2. The judicial law respected the Jews in their political capacity, or as a nation, and consisted of those institutions which God prescribed to them for their civil government. This law, as far as the Jewish polity was peculiar, has also been entirely abolished; but as far as it contains any statute founded in the law of nature common to all nations, it is still obligatory.</p></blockquote>

</figure><figure class="quote" id="q-833ea0c68f" data-kw="">
<blockquote><p>They that shall adventure to bring into the city and to sell things forbidden are worthily to be punished with the loss of the things themselves. The same punishment is to be laid upon the buyers, if they yet now have with them the things whole and untouched: otherwise let the punishment be equal unto the price of the things. He that is found selling of profitable things, as meats or drinks, in any other place than in the place appointed, let him bear the loss of all that he sets to sale. Whosoever of his own private authority shall covetously increase the price of things sellable above that [which] is reasonable or above the appointed rate, let him be under the punishment of unlawful usuries, and for a time forbidden to occupy any more.</p></blockquote>

</figure><figure class="quote" id="q-cee0d0c6a9" data-kw="">
<blockquote><p>In the siege of Leyden we have a thrilling example of their sufferings and heroism. Three months after the commencement of the siege the food-supply was exhausted. A fearful famine began to rage. For seven weeks the inhabitants had no bread to eat and multitudes perished of hunger. On the heels of the famine came the plague or black death, which carried off a third part of the citizens. The apparently doomed survivors subsisted on dogs and cats. To the summons to surrender, they replied: ” As long as you hear the mew of a cat or the bark of a dog you may know that the city holds out. And when all have perished but ourselves, we will devour our left arms, retaining our right to defend our women, our liberty, and our religion against the foreign tyrant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/netherlands-leiden.html">Egbert Watson Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Creed of the Presbyterians</cite></span></figcaption>

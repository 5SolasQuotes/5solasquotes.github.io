<blockquote><p>The first Doubt is, What kind of act in God forgiveness of sin is? Whether it be an immanent act in-dwelling and abiding in God, or transient, working some real effect and change upon the creature.

Now in handling of this, I shall not trouble you with that perplex Question so much vexed by the Schoolmen, Whether a transient action be in the Agent, or in the Patient, but lay down some differences between an immanent action, and a transient action; only you must take notice that we are in mere darkness, and not able to comprehend how God is said to act or work.

For on the one side, we must not hold that there are any accidents in God; or that he can be a subject recipient of such, because of his most pure and simple Essence; so that whatsoever is in God is God. And yet on the other side, the Scripture doth represent God doing and working such mercies and judgements as seemeth good to him. …

Let us come to give the differences between an immanent action, and a transient, and then we may easily see, which of these two Justification or Remission of sin is.

The first and proper difference is this, An immanent action is that which abides in God, so that it works no real effect without: As when God doth merely know or understand a thing; but a transient action, is when a positive change is made thereby in a creature, as in Creation, &amp;c. So that we may conclude of all Gods actions, which do relate to believers, only predestination is an immanent act of God, and all the rest, Justification, Regeneration, Glorification, are transient acts: for Predestination though it be an act of God choosing such an one to happiness, yet it doth not work any real change or positive effect in a man, unless we understand it virtually, for it is the cause of all those transient actions that are wrought in time. Howsoever therefore Justification be called by some an immanent action, and so made to go before Faith and Repentance as if Faith were only a declaration and sign of pardon of sin from all eternity, yet that cannot be made good, as is to be shewed.

A second difference floweth from the other, An immanent action is from eternity, and the same with God’s essence, but a transient action is the same with the effect produced. Hence the Orthodox maintain, That God’s decrees are the same with his nature. Hence when we speak of God’s willing such a thing, it is no more then his divine Essence, with an habitude and respect to such objects; God’s Decrees are no more then God decreeing, God’s will no more then God willing: otherwise the simplicity of God’s nature will be overthrown, and those volitions of God will be created entities, and so must be created by other new volitions, and so in infinitum, as Spanheimius well argueth, only the later part seemeth not to be strong or sufficient, because when man willeth, he doth not will that by a new volition, and so in infinitum, and why then would such a thing follow in God?

Besides it’s no such absurdity in the actings of the soul, to hold a progress in infinitum, thus far, that it doth not determinately pitch or end at such an act. It is one thing to have things distinguished in God, and another thing for us to conceive distinctly of them. The former is false: The latter is true and necessary. But with transient actions it is otherwise, they being the same with the effects produced, are in time; And this is a perpetual mistake in the Antinomian, to confound Gods Decree and Purpose to justify, with Justification, God’s immanent action from all eternity, with that transient, which is done in time. Whereas if they should do thus in matters of Sanctification and Glorification, it would be absurd to every man’s experience, whereas indeed a man may as truly say, That his body is glorified from all eternity, as that his sins are forgiven from all eternity. And certainly Scripture speaks for one as well as the other, when it saith, Whom he hath justified, them he hath glorified.

By these two differences, you may see, That pardon of sin is a transient action, and so Justification also, partly, because it leaveth a positive, real effect upon a man justified; he that was in the state of hatred, is hereby in a state of love and friendship, he hath peace with God now, that once was at variance with him. Now when we say, There is a change made in a man by Justification, it is not meant of an inward, absolute and physical one, such as is in Sanctification, when of unholy we are made holy, but moral and relative; as when one is made a Magistrate, or husband and wife: partly, because this is done to us in time, whereas immanent actions were from all eternity, and therefore it would be absurd to pray for them, as it is ridiculous for a man to pray he may be predestinated or elected.</p></blockquote>

<blockquote><p>The attaining of God&#x27;s glory was an end, which being ultimate and supreme, must in no case whatsoever give place. This is spoken of as the end of God&#x27;s executing judgments on his enemies in this world. … And this is spoken of as the end, both of the executions of wrath, and in the glorious exercises of mercy, in the misery and happiness of another world. Rom. 9:22–23, &quot;What if God, willing to show his wrath, and make his power known, endured with much long suffering, the vessels of wrath fitted to destruction: and that he might make known the riches of his glory on the vessels of mercy, which he hath afore prepared unto glory …?&quot; … Then his glory shall be obtained, with respect both to saints and sinners. From these things it is manifest … that God&#x27;s glory is the ultimate end of the creation of the world.</p></blockquote>

<blockquote><p>God, at the creation, beheld man, a goodly frame of his own rearing, adorned with his own image, beautified with his graces, embellished with holiness and righteousness, and furnished with a power to stand; and afterwards beheld him ungratefully rebelling against his sovereign, invading his rights, and contemning his goodness, forfeiting his own privileges, courting his ruin, and sinking into misery.

So blinded is his mind, as not to be able to find out a way for his own recovery; so perverse is his will, that instead of craving pardon of his judge, he flies from him, and when his flight would not advantage him, he stands upon his own defence, and extenuates his crime; thus adding one provocation to another, as if he had an ambition to harden the heart of God against him, and render himself irrecoverably miserable.

God so overlooks these, as in immense love and grace to settle a way for man’s recovery, without giving any dissatisfaction to his justice, so strongly engaged for the punishment of the offence. And rather than this notorious rebel and prodigious apostate should perish according to his merit, he would transfer the punishment (which he could not remit without a violation of his truth, and an injury to his righteousness) upon a person equal to himself, most beloved by him, his delight from eternity, and infinitely dearer to him than anything in heaven or earth. Herein was the emphasis of divine love to us, that ‘he sent his Son to be the propitiation for our sin,’ 1 John iv. 10.

It was love that he would restore man after the fall; there was no more necessity of doing this, than of creating the world. As it added nothing to the happiness of God, so the want of it had detracted nothing from it. There was no more absolute necessity of setting up man again after his breaking, than of a new repair of the world after the destructive deluge. But that he might wind up his love to the highest pitch, he would not only restore man, but rather than let him lie in his deserved misery, would punish his own bowels to secure man from it. It was purely his grace which was the cause that his Son ‘tasted death for every man,’ Heb. ii. 9.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“God, at the creation, beheld man, a goodly frame of his own rearing, adorned with his own image, beautified with his graces, embellished with holiness and righteousness, and furnished with a power to stand; and afterwards beheld him ungratefully rebelling against his sovereign, invading his rights, and contemning his goodness, forfeiting his own privileges, courting his ruin, and sinking into misery.

God so overlooks these, as in immense love and grace to settle a way for man’s recovery, without giving any dissatisfaction to his justice, so strongly engaged for the punishment of the offence. And rather than this notorious rebel and prodigious apostate should perish according to his merit, he would transfer the punishment (which he could not remit without a violation of his truth, and an injury to his righteousness) upon a person equal to himself, most beloved by him, his delight from eternity, and infinitely dearer to him than anything in heaven or earth. Herein was the emphasis of divine love to us, that ‘he sent his Son to be the propitiation for our sin,’ 1 John iv. 10.

It was love that he would restore man after the fall; there was no more necessity of doing this, than of creating the world. As it added nothing to the happiness of God, so the want of it had detracted nothing from it. There was no more absolute necessity of setting up man again after his breaking, than of a new repair of the world after the destructive deluge. But that he might wind up his love to the highest pitch, he would not only restore man, but rather than let him lie in his deserved misery, would punish his own bowels to secure man from it. It was purely his grace which was the cause that his Son ‘tasted death for every man,’ Heb. ii. 9.”

— Stephen Charnock, A Discourse of the Knowledge of Christ Crucified, (1684) in The Complete Works of Stephen Charnock, B.D. (5 vols, Edinburgh: James Nichol, 1865), 4: 496-97.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CGod%2C+at+the+creation%2C+beheld+man%2C+a+goodly+frame+of+his+own+rearing%2C+adorned+with+his+own+image%2C+beautified+with+his+graces%2C+embellished+with+holiness+and+righteousness%2C+and+furnished+with+a+power+to+stand%3B+and+afterwards+beheld+him+ungratefully+rebelling+against+his+sovereign%2C+invading+his+rights%2C+and+contemning+his+goodness%2C+forfeiting+his+own+privileges%2C+courting+his+ruin%2C+and+sinking+into+misery.%0A%0ASo+blinded+is+his+mind%2C+as+not+to+be+able+to+find+out+a+way+for+his+own+recovery%3B+so+perverse+is+his+will%2C+that+instead+of+craving+pardon+of+his+judge%2C+he+flies+from+him%2C+and+when+his+flight+would+not+advantage+him%2C+he+stands+upon+his+own+defence%2C+and+extenuates+his+crime%3B+thus+adding+one+provocation+to+another%2C+as+if+he+had+an+ambition+to+harden+the+heart+of+God+against+him%2C+and+render+himself+irrecoverably+miserable.%0A%0AGod+so+overlooks+these%2C+as+in+immense+love+and+grace+to+settle+a+way+for+man%E2%80%99s+recovery%2C+without+giving+any+dissatisfaction+to+his+justice%2C+so+strongly+engaged+for+the+punishment+of+the+offence.+And+rather+than+this+notorious+rebel+and+prodigious+apostate+should+perish+according+to+his+merit%2C+he+would+transfer+the+punishment+%28which+he+could+not+remit+without+a+violation+of+his+truth%2C+and+an+injury+to+his+righteousness%29+upon+a+person+equal+to+himself%2C+most+beloved+by+him%2C+his+delight+from+eternity%2C+and+infinitely+dearer+to+him+than+anything+in+heaven+or+earth.+Herein+was+the+emphasis+of+divine+love+to+us%2C+that+%E2%80%98he+sent+his+Son+to+be+the+propitiation+for+our+sin%2C%E2%80%99+1+John+iv.+10.%0A%0AIt+was+love+that+he+would+restore+man+after+the+fall%3B+there+was+no+more+necessity+of+doing+this%2C+than+of+creating+the+wo <blockquote><p>13. In the same way too it cannot be concluded that because the outward calling of the rejected is ineffectual it is therefore not seriously meant by God. Outward calling is always per se [of itself, in principle] a real calling to salvation, since everyone who follows it up thereby gains righteousness in Christ and eternal life: only, in the case of the godless, it is ineffectual because of their hardness of heart. Similarly, the calling from God’s side is always seriously intended, since God promises grace even to the rejected upon condition of faith, and makes faith for them a duty. But of course God omits to give faith to the rejected, because He is not bound to do so in the case of any man… From this it follows that even the calling of the godless is on God’s side ‘sincere and serious’.</p></blockquote>

<blockquote><p>This Argument which the Atheists do assume, drawn from the Eternity of the World may be retorted against them, for if a thing Corporeal, Finite, Material, so gross, and so imperfect as this World is, can nevertheless have been, and subsisted from all Eternity, as now it is existent; how much more is it according to right Reason to constitute a spiritual, immaterial, infinite, and eternal Essence, subsisting of it self which is nothing else but the Deity? For by how much the more things are immaterial and spiritual, by so much the greater activity have they, and consequently are more able to subsist and last longer, as is seen in Souls, Angels, and Spirits. Moreover we see that this World is corruptible almost in all its parts, which are in perpetual vicissitudes &amp; changes of being and not being, which doth argue that it draweth towards its end, and that finally it will be dissolved, for the whole participates of the Nature of its parts, and cannot be contrary to them, now how can that have been from all Eternity, and without any Beginning, that draweth to an end, and that at last will come to it? For if hitherto it hath endured infinitely, it may do the same for the future, if it cannot last for the future, it is clearly evident that it cannot have been from all Eternity.

If then the World hath neither been, nor can be supposed to have existed from all Eternity, it hath necessarily had a Beginning, and since nothing can produce it self, we must conclude, That it hath been produced by some one that hath had no Beginning, but hath been from all Eternity, who is no other but God himself; otherwise we must affirm that this Architect of the world hath been produced by some other, and this also by another, and so to the infinite, which is grossly absurd.</p></blockquote>

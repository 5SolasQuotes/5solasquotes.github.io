<blockquote><p>I am afraid of a controversy on this subject [instrumental music], or of its issue, so far as the merits of the question are concerned. I believe that it is a question which touches some of the highest and deepest points of Christian theology. Is the Temple destroyed? Is the Temple worship wholly superseded? Have we, or have we not, priests and sacrifices among us now? Is the Temple or the Synagogue the model on which the Church of the New Testament is formed?

Does the Old Testament itself point to anything but “the fruit of the lips” as the peace-offering or thank-offering of Gospel times? Is there a trace in the New Testament of any other mode of praise? For my part, I am persuaded that if the Organ be admitted, there is no barrier, in principle, against the sacerdotal system in all its fulness,—against the substitution again, in our whole religion, of the formal for the spiritual, the symbolical for the real.

I do not judge others. The case is very different with those who never reached our measure of reformation from what it is with us. A Church which, stopping short in the process of its emancipation from a false system, retains certain of the usages of that false system, is in a very different position from a Church which, having advanced farther in the direction of purity and simplicity, voluntarily retrogrades and returns to these usages.

To the one they may be comparatively harmless, while to the other they may prove deeply hazardous. In the former instance, the continuance of them indicates no new leaning towards ritualism, no decline from what is more pure and spiritual. In the latter instance, the adoption of them may have a significancy, and may exert an influence, of a very serious character indeed. A landing-place which is tolerable for those who are going forward, may be the reverse of tolerable for those who are retreating.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introductory Notice in The Organ Question: Statements by Dr Ritchie, and Dr Porteous, for and against the use of the organ in public worship, in the proceedings of the Presbytery of Glasgow, 1807-8. With an introductory notice, by Robert S. Candlish, D.D., Edinburgh</cite></span></figcaption>

<blockquote><p>What evidence for the truth of the Holy Scriptures arises from this harmony of the whole? Ans. (1.) Truth is but one; error is manifold. The truth must harmonize; error cannot. And truth, as the character of the whole Scriptures, and coming from God, the infallible Source of truth, can alone account for this. (2.) All other systems and theories of doctrines and morals differ, in different ages, by increasing light, or by change of taste or fancies. If divine truth were not from God, the infallible source, it also would have varied in different ages.

(3.) The sacred writers were of very different ages of the world—under very different circumstances—and of very different natural talents, tastes, and acquirements; all which produce discord in human theories, but they produced none in the doctrines, or narratives, or morals of the Bible. (4.) Although the early ages of the world were necessarily less intelligent, of less experience, and less opportunity of enlarged and correct views, yet the first writers are fully sustained by the latter. Now, nothing but Infinite Wisdom, as the source of Bible revelation, can account for this. Therefore, the writings of the early ages were communications from God, and not the discoveries of human wisdom; and the latter also were from the same God, to sustain and approve the first writers.

(5.) The chief subject of Bible doctrine was wholly above nature’s light, and even contrary to human conception and taste, in many points, and yet all the sacred penmen agree fully, from first to last, on those points on which human minds, when left to themselves, cannot agree; and they pursued the same great ends, and maintained the same means of attaining these. Nothing can account for this but inspiration by the same Spirit of infinite and eternal wisdom.

(6.) No other book in the world was ever produced as the Bible, or produced under so many disadvantages for attaining unity, if it had been the production of man, composed piece by piece, by many different men, through a period of about 2,000 years of writers, and 4,000 of inspired communications. Nothing, therefore, but its coming from the same divine Author, can account for this. (7.) The doctrines which the sacred writers deliver have been, and are evidently against the opinions, the feelings, inclinations, propensities, and practice of mankind; and nothing but their origin from God could account for the agreement of all the divine writers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/abraham-anderson.html">Abraham Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Theology</cite>, (Philadelphia PA: Wm. S. Young, 1857), pp 45-46.</span></figcaption>

<blockquote><p>This is the promise: The Spirit shall lead you into all truth. You are now searching into the deep things of God, which concern Religion; Live in the Spirit, and the Spirit shall bring all into your mind, and shew you the things of Jesus Christ. It behoves you to know the method of Satan; the stratagems and dark deeps of the Devil himself, in mysteries of State and Religion. Walk in the Spirit; he shall lead you into their chambers, as he did Ezekiel; and let you see what mischiefs they are there contriving in secret.

This is the promise: The Spirit of God and of glory shall rest on his servants, in their conflicts and sufferings. Sit still in all humble resignation of your selves, to the working of this Spirit; that he may rest on you: so shall he manage your counsels, finish your wars; and end all your sufferings with glory.

I shall conclude my Epistle with an humble Petition to your Honours: an hearty Prayer for you.

My humble Petition is, that You would ever remember to converse as Doves, among Doves; with this Dove; He is a tender Spirit, take heed of grieving this Spirit, where ever he dwells: For by him alone can your hopes be sealed to a day of full accomplishment.

My hearty Prayer is, that, as you sit debating in Parliament, the appearances of the Holy Ghost may be among you; as he was with the Apostles, sitting over them in the form of fiery tongues: that when you fight in the field, the Holy Ghost may be as a two-edged sword going forth from the mouth of the Lord Jesus into your enemy’s hearts: that you may never see upon the walls of your house, that hand-writing which made Belshazzer tremble; Your kingdom is divided; but in stead of this, that uniting and building Principle; Not by might, nor by power, but by my Spirit, saith the Lord. This is the fervent, constant prayer of

Your Honours humble servant in Christ, Peter Sterry.</p></blockquote>

<blockquote><p>Even in Evangelical Churches at this moment men professing subjection to Christ are madly thrusting aside His authority, and subjecting the Church to human caprice. Doctrines and rites and practices for which no Divine warrant can be pleaded are multiplying in the Visible Church. Some so-called Protestant Churches are almost as Ritualistic and idolatrous and disobedient to Christ as Rome itself. And other Protestant Churches are following. There is a kind of procession – Rome leading the way, then Prelatic ritualism close behind, but rapidly shortening their distance, and then other Presbyterian Churches being drawn in because they admire the glitter and pomp of the precession without waiting to consider what is the beginning of it all and what is the end of it all. And while all this is going on Christ is standing by and saying, “Who hath believed our report? And to whom is the arm of the Lord revealed?” “All day long I stretched forth My hands unto a disobedient and gainsaying people.</p></blockquote>

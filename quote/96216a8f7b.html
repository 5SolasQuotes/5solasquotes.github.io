<main class="wrap"><figure class="quote" id="q-96216a8f7b" data-kw="">
<blockquote><p>And do not wonder, nor think what we are saying hard to believe, inasmuch as it is not long since, even if it be not still the case that the Roman Senate vote to those emperors who have ever ruled them from the beginning, either all of them, or such as they wish and decide, a place among the gods, and decree them to be worshipped. For those to whom they are hostile, they treat as enemies and call men, admitting their real nature, while those who are popular with them they order to be worshipped on account of their virtue, as though they had it in their own power to make gods, though they are themselves men, and do not profess to be other than mortal.

Whereas if they are to make gods, they ought to be themselves gods; for that which makes must needs be better than that which it makes, and he that judges is of necessity in authority over him that is judged, while he that gives, at any rate that which he has, confers a layout, just as, of course, every king, in giving as a favour what he has to give, is greater and in a higher position than those who receive. If then they decree whomsoever they please to be gods, they ought first to be gods themselves. But the strange thing is this, that they themselves by dying as men, expose the falsehood of their own vote concerning those deified by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/athanasius-of-alexandria.html">Athanasius of Alexandria</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against the Heathen</cite>, (c. 335), 9.5, 6 in Nicene and Post-Nicene Fathers 2, 4: 9.</span></figcaption>

-folly-of-self-made-gods/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-699f3edb9c" data-kw="">
<blockquote><p>To be taken without consent from my home and friends; to lose my liberty; to undergo all those assaults on my personality which modern psychotherapy knows how to deliver; to be re-made after some pattern of “normality” hatched in a Viennese laboratory to which I never professed allegiance; to know that this process will never end until either my captors have succeeded or I grown wise enough to cheat them with apparent success – who cares whether this is called Punishment or not? That it includes most of the elements for which any punishment is feared – shame, exile, bondage, and years eaten by the locust – is obvious. …

Of all tyrannies a tyranny sincerely exercised for the good of its victims may be the most oppressive. It may be better to live under robber barons than under omnipotent moral busybodies. The robber baron’s cruelty may sometimes sleep, his cupidity may at some point be satiated; but those who torment us for our own good will torment us without end for they do so with the approval of their own conscience. They may be more likely to go to Heaven yet at the same time likelier to make a Hell of earth.

Their very kindness stings with intolerable insult. To be “cured” against one’s will and cured of states which we may not regard as disease is to be put on a level with those who have not yet reached the age of reason or those who never will; to be classed with infants, imbeciles, and domestic animals. But to be punished, however severely, because we have deserved it, because we “ought to have known better”, is to be treated as a human person made in God’s image.

In reality, however, we must face the possibility of bad rulers armed with a Humanitarian theory of punishment. … And when they are wicked· the Humanitarian theory of punishment will put in their hands a finer instrument of tyranny than wickedness ever had before. For if crime and disease are to be regarded as the same thing, it follows that any state of mind which our masters choose to call “disease” can be treated as crime; and compulsorily cured. It will be vain to plead that states of mind which displease government need not always involve moral turpitude and do not therefore always deserve forfeiture of liberty.

For our masters will not be using the concepts of Desert and Punishment but those of disease and cure. We know that one school of psychology already regards religion as a neurosis. When this particular neurosis becomes inconvenient to government, what is to hinder government from proceeding to “cure” it? Such “cure” will, of course, be compulsory; but under the Humanitarian theory it will not be called by the shocking name of Persecution. No one will blame us for being Christian, no one will hate us, no one will revile us.

The new Nero will approach us with the silky manners of a doctor, and though all will be in fact as compulsory as the tunica molesta or Smithfield or Tyburn, all will go on within the unemotional therapeutic sphere where words like “right” and “wrong” or “freedom” and “slavery” are never heard. And thus when the command is given, every prominent Christian in the land may vanish overnight into Institutions for the Treatment of the Ideologically Unsound, and it will rest with the expert gaolers to say when (if ever) they are to re-emerge. But it will not be persecution. Even if the treatment is painful, even if it is life-long, even if it is fatal, that will be only a regrettable accident; the intention was purely therapeutic.</p></blockquote>

<blockquote><p>Forasmuch as it has pleased the Almighty God by the wise disposition of his divine providence so to Order and dispose of things that we… are now cohabiting and dwelling in and upon the River of Conectecotte… And well knowing where a people are gathered together the word of God requires that to maintain the peace and union of such a people there should be an orderly and decent Government established according to God… do therefore… enter into Combination and Confederation together, to maintain and preserve the liberty and purity of the gospel of our Lord Jesus which we now profess, as also the discipline of the Churches, which according to the truth of the said gospel is now practiced amongst us… 1. It is Ordered, sentenced and decreed that there shall be yearly two general Assemblies or Courts… wherein shall be yearly chosen form time to time so many magistrates and other public officers… Whereof one to be chosen Governor… which… shall have power to administer justice according to the Laws here established, and for want thereof according to the rule of the word of God… … The Oath of the Governor, for the [Present] I N. W…. do swear by the great and dreadful name of the everliving God, to promote the public good and peace of the same… and will further the execution of Justice according to the rule of God’s word; so help me God, in the name of the Lord Jesus Christ.</p></blockquote>

<blockquote><p>For rulers are not a terror to good works, but to evil. Do you want to be unafraid of the authority? Do what is good, and you will have praise from the same. (Romans 13:3)

The rewards for well-doing are, in the apostle’s language, expressed by the term “praise,” to signify benignant regards, careful protection, sure defence, and advancement in comfort and happiness; and this, after the example of that divine providence to which humble and faithful servants of God look up with trust and confidence, enjoying a constant peace, and resting in the assurance of the ever-watchful care of their great Master.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c8e8edfd80" data-kw="">
<blockquote><p>Now, if our Covenants, National, and Solemn League, are not now binding upon the nation, it is not because we have not the very same enemy to contend with which our fathers grappled with in former ages. If, then, it is always a Scriptural duty to oppose error, and Popery in particular, the British covenants must, of necessity, be of continued obligation, till Popery shall be no more. But again; as well as Popery, have we not “Prelacy, superstition, heresy, schism, and profaneness,” still to be resisted? It is still a duty to “endeavour the extirpation” of all these evils; and if so, then it must still be a duty to adhere to the Covenants which bind us to this duty! […]

There is no doctrine more clearly revealed in Scripture, than that of descending or continued obligation of public social Covenants. A practical denial of this doctrine must lead to the most disastrous consequences. Deny this doctrine, and the subject not born at the time of the coronation of the prince, may justly rise up in rebellion against his sovereign, and in turn the prince may refuse such a subject his civil rights; the heir may refuse to acknowledge the liabilities of his predecessors, and some stronger man may refuse to acknowledge the rights of the heir; and in one word, national deeds, however important, at once lose all their value in sustaining and regulating national concerns!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-simms.html">Samuel Simms</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bible, the church, and terms of communion: together with the terms of communion of the Reformed Presbyterian Church in Ireland. To which is appended the Cameronian Dream</cite>, (Belfast, 1879), pp 34-5.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-189b55463b" data-kw="">
<blockquote><p>Some, indeed, would object to national recognitions of religion, and such royal calls and injunctions to observe its duties. Civil magistracy, they tell us, is a civil, temporal, earthly institution, having under its regulation the affairs of time and the world, and having nothing to do with religion; — and the civil magistrate, or chief ruler, they would accordingly prevent from in any way intromitting with religious matters—matters belonging not to time but eternity, not to this world but the world to come.

There are a number of grievous errors wrapt up here in one. It seems to imply that the affairs of this world may and ought to be carried on apart from the affairs and obligations of religious truth and duty; — thus shutting up religion to a territory of its own, beyond which it must not be suffered to trespass. But apart from this; how can religious obligation lie upon the separate individuals of a nation, and yet the nation as a nation be exempt from it?

It is certain that nations as a whole may please or provoke God; just as a family may do; just as an individual may do. God deals with a community as a whole, just as He deals with a household as a whole. And as when God is angry with a family, He deals with them in His wrath for their family provocations, so He deals with communities and kingdoms. If a family, therefore, ought to be religious; — in the sense that not only are its individuals to be religious, but unitedly, and as in their mutual relations, they are to observe the duties of family religion; — it ought to be the same in a kingdom.

The father of a family is not only to be a pious man himself, but he is to see that in the united worship of his household, and in religious principles being brought to bear on all its movements, there be a household piety — a family recognition of God. For true religion is not a thing to be kept secret between a man’s own conscience and God. No doubt the springs of it are deep seated in the inmost soul; and the Christian life is a hidden life. But for that very reason, — by reason of the inmost secrecy, and therefore irrepressible power of its principles, — it will assert and vindicate its influence in all circumstances, and over all the relations in which men stand towards one another.

It will therefore guide those in whom it dwells, not merely in their own private relation to God, and in their worship and more immediate duty towards Him, but in the whole influence they can exert over their fellow-creatures, — in all their relations, whether as superiors, inferiors, or equals. But especially as superiors, — where authority belongs to them, — where they have it in their power to “ command their households after them,” — they will arrange that in all the ongoings of these households God shall be recognised, and His authority and will obeyed. They will say with Joshua, “ As for me and my house, we will serve the Lord.”

It is this element, however, of command, of authority, against the introduction of which in religious observances not a few reclaim. I would advise with my household, or any irreligious and wayward member of it; I would advise; I would exhort; I would instruct and entreat: but I can go no farther. I can’t make them religious, and I won’t command or compel them.

But all this sophistry is utterly laughed to scorn by the simple perusal of the fourth commandment:—“The seventh day is the sabbath of the Lord thy God: in it thou shalt not do any work, thou, nor thy son, nor thy daughter, thy manservant, nor thy maidservant, nor thy cattle, nor thy stranger that is within thy gates: ” — by the which terms thou art held of God guilty of Sabbath desecration all the same, whether it be “thou, or thy son, or thy daughter, or thy manservant, or thy maidservant, or thy stranger that is within thy gates.” Thou wilt not be held guiltless on the plea that thou didst instruct, didst entreat, didst plead. Didst thou command? Didst thou bring out, for securing obedience to God, all the authority with which thou art endowed as head of thy household, and which thou dost not scruple, if need be, to bring forth for securing obedience to thine own will?

To “the stranger that is within thy gates,” thou art bound, — when advice, entreaty, exhortation fail,—to give forth thy command; backed by the penalty that, if it be not obeyed, he can be “within thy gates” no longer. With “thy manservant, and thy maidservant,” thou art to deal, if need be, in like manner also. Yea, “thy son and thy daughter” are not to abide “within thy gates” and despise the commandments of God. Thou art to command them; and, failing obedience, then thou art to disown them, to cast them off, and cast them out. Eli, alas! acted on the principle that a parent may advise in religious things, but may not imperatively command and threaten. And his house and his name were blotted out for ever!

Have you any influence, any power, any authority over children and dependants which you may use in your own service and work, but which you would refrain from bringing forth on the side of God? What were this, but selfishly to surround the accomplishment of your own will with securities, which you refuse to adopt to secure observance in your household to God’s will? And can it be that, in such a case you really honour God?

Nay: it is not whole-hearted, sincere, thorough-going, and true honouring of God where your government of your household does not call into exercise, when needful, on the side of God, every influence which you can ever rightly use on your own side. If there be a principle of authority — an element of command — vested anywhere in a family at all, religion lays it under contribution to the cause of the Most High — under call to uphold and promote the observance of His will.

And the same principle holds in a nation. So far forth as a monarch’s authority goes, it goes all the length of entitling him to enjoin a fast and a solemn assembly — a public, universal, national recognition of God — the God who is dealing with the nation as a whole, and summoning the nation as a whole to acknowledge Him. Nature itself teaches this truth. It rises up to view in its own native reasonableness in the hour of solemn thoughtfulness, the hour of sad national calamity.

All sophistical objections about the impossibility of making men religious by Act of Parliament then disappear. The truth comes obviously to light, and commends itself to reason and conscience. Well was it for Nineveh that its king was not embued with certain modern notions about magistrates and kings having nothing to do with religion. The city’s doom had been scaled by them!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-martin.html">Hugh Martin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Prophet Jonah: His Character and Mission to Nineveh</cite>, (London: Alexander Strahan, 1866), pp 356-60.</span></figcaption>

r+thy+son%2C+nor+thy+daughter%2C+thy+manservant%2C+nor+thy+maidservant%2C+nor+thy+cattle%2C+nor+thy+stranger+that+is+within+thy+gates%3A+%E2%80%9D+%E2%80%94+by+the+which+terms+thou+art+held+of+God+guilty+of+Sabbath+desecration+all+the+same%2C+whether+it+be+%E2%80%9Cthou%2C+or+thy+son%2C+or+thy+daughter%2C+or+thy+manservant%2C+or+thy+maidservant%2C+or+thy+stranger+that+is+within+thy+gates.%E2%80%9D+Thou+wilt+not+be+held+guiltless+on+the+plea+that+thou+didst+instruct%2C+didst+entreat%2C+didst+plead.+Didst+thou+command%3F+Didst+thou+bring+out%2C+for+securing+obedience+to+God%2C+all+the+authority+with+which+thou+art+endowed+as+head+of+thy+household%2C+and+which+thou+dost+not+scruple%2C+if+need+be%2C+to+bring+forth+for+securing+obedience+to+thine+own+will%3F%0A%0ATo+%E2%80%9Cthe+stranger+that+is+within+thy+gates%2C%E2%80%9D+thou+art+bound%2C+%E2%80%94+when+advice%2C+entreaty%2C+exhortation+fail%2C%E2%80%94to+give+forth+thy+command%3B+backed+by+the+penalty+that%2C+if+it+be+not+obeyed%2C+he+can+be+%E2%80%9Cwithin+thy+gates%E2%80%9D+no+longer.+With+%E2%80%9Cthy+manservant%2C+and+thy+maidservant%2C%E2%80%9D+thou+art+to+deal%2C+if+need+be%2C+in+like+manner+also.+Yea%2C+%E2%80%9Cthy+son+and+thy+daughter%E2%80%9D+are+not+to+abide+%E2%80%9Cwithin+thy+gates%E2%80%9D+and+despise+the+commandments+of+God.+Thou+art+to+command+them%3B+and%2C+failing+obedience%2C+then+thou+art+to+disown+them%2C+to+cast+them+off%2C+and+cast+them+out.+Eli%2C+alas%21+acted+on+the+principle+that+a+parent+may+advise+in+religious+things%2C+but+may+not+imperatively+command+and+threaten.+And+his+house+and+his+name+were+blotted+out+for+ever%21%0A%0AHave+you+any+influence%2C+any+power%2C+any+authority+over+children+and+dependants+which+you+may+use+in+your+own+service+and+work%2C+but+which+you+would+refrain+from+bringing+forth+on+the+side+of+God%3F+What+were+this%2C+but+selfishly+to+surround+the+accomplishment+of+your+own+will+with+securities%2C+which+you+refuse+to+adopt+to+secure+observance+in+your+household+to+God%E2%80%99s+will%3F+And+can+it+be+that%2C+in+such+a+case+you+really+honour+God%3F%0A%0ANay%3A+it+is+not+whole-hearted%2C+sincere%2C+thorough-going%2C+and+true+honouring+of+God+where+your+government+of+your+household+does+not+call+into+exercise%2C+when+needful%2C+on+the+side+of+God%2C+every+influence+which+you+can+ever+rightly+use+on+your+own+side.+If+there+be+a+principle+of+authority+%E2%80%94+an+element+of+command+%E2%80%94+vested+anywhere+in+a+family+at+all%2C+religion+lays+it+under+contribution+to+the+cause+of+the+Most+High+%E2%80%94+under+call+to+uphold+and+promote+the+observance+of+His+will.%0A%0AAnd+the+same+principle+holds+in+a+nation.+So+far+forth+as+a+monarch%E2%80%99s+authority+goes%2C+it+goes+all+the+length+of+entitling+him+to+enjoin+a+fast+and+a+solemn+assembly+%E2%80%94+a+public%2C+universal%2C+national+recognition+of+God+%E2%80%94+the+God+who+is+dealing+with+the+nation+as+a+whole%2C+and+summoning+the+nation+as+a+whole+to+acknowledge+Him.+Nature+itself+teaches+this+truth.+It+rises+up+to+view+in+its+own+native+reasonableness+in+the+hour+of+solemn+thoughtfulness%2C+the+hour+of+sad+national+calamity.%0A%0AAll+sophistical+objections+about+the+impossibility+of+making+men+religious+by+Act+of+Parliament+then+disappear.+The+truth+comes+obviously+to+light%2C+and+commends+itself+to+reason+and+conscience.+Well+was+it+for+Nineveh+that+its+king+was+not+embued+with+certain+modern+notions+about+magistrates+and+kings+having+nothing+to+do+with+religion.+The+city%E2%80%99s+doom+had+been+scaled+by+them%21%E2%80%9D%0A%0A%E2%80%94+Hugh+Martin%2C+The+Prophet+Jonah%3A+His+Character+and+Mission+to+Nineveh%2C+%28London%3A+Alexander+Strahan%2C+1866%29%2C+pp+356-60.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F189b55463b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/189b55463b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/06/22/hugh-martin-on-national-recognition-of-true-religion-1/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>Individuals, who enter into such public bonds, bind their children by the moral principles of the covenant; and the obligations continue upon posterity until the purpose of the engagement has been accomplished. Moral obligations will be honoured by the honourable; and can be ignored by none without sin.

</figure><figure class="quote" id="q-bb28d063cd" data-kw="">
<blockquote><p>But these general truths may be added, concerning the Judicial Laws: 1. None can say that none of the Judicial Laws, concerning political constitutions, is to be observed in the New Testament: for then many special rules of natural and necessary equity would be rejected, which are contained in the Judicial Laws of God: Yea all the laws of equity in the world would be so cast; for none can be instanced, which may not be reduced to some of the Judicial Laws: And if any of them are to be observed, certainly these penal statutes so necessary for the preservation of policies, must be binding. …

3. Those Judicial Laws, which had either somewhat typical, or pedagogical, or peculiar to the then Judaical State, are indeed not binding to us under that formality; though even these doctrinally are very useful, in so far as in their general nature, or equity of proportion, they exhibit to us some documents of duty: but those penal judgments, which in the matter of them are appended to the Moral Law, and are in effect but accurate determinations and accommodations of the Law of Nature, which may suit our circumstances as well as the Jews, do oblige us as well as them. And such are these penal statutes I adduce; for, that blasphemy, murder and idolatry, are heinous crimes and that they are to be punished, the Law of Nature dictates; and how, and by whom, in several cases, they are to be punished, the Law judicial determines. Concerning the Moral Equity even of the strictest of them: [William] Ames, Of the Conscience, Book 5, ‘Of the Appended Precepts of Moses’.

4. Those Judicial Laws, which are but Positive in their form, yet if their special internal and proper reason and ground by Moral, which pertains to all nations, which is necessary and useful to mankind, which is rooted in and may be fortified by human reason, and as to the substance of them approven by the more intelligent heathens; those are Moral, and oblige all Christians as well as Jews: and such are these laws of punishing idolaters, etc. founded upon Moral grounds, pertaining to all nations necessary and useful to mankind, rooted in and fortified by human reason, to wit that the wrath of God may be averted, and that all may hear and fear and do no more so wickedly; especially this reason be superadded, when the case is such, that innocent and honest people cannot be preserved, if such wicked persons be not take order with.</p></blockquote>

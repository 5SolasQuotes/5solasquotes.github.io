<main class="wrap"><figure class="quote" id="q-e2292fd89c" data-kw="Mortification" data-pol="">
<blockquote><p>Every spark of fire is fire, and will burn; so is every thing of the law of sin, the last, the least of it, -- it is enmity, it will poison, it will burn. … Mortification abates of its force, but doth not change its nature. Grace changeth the nature of man, but nothing can change the nature of sin. Whatever effect be wrought upon it, there is no effect wrought in it, but that it is enmity still, sin still.</p></blockquote>
<figcaption>— <a href="../authors/john-owen.html">John Owen</a>, <cite>Indwelling Sin in Believers</cite>, ch. 4</figcaption>

</figure><figure class="quote" id="q-06607c4dc4" data-kw="Temptation" data-pol="">
<blockquote><p>That which lusts against the spirit, and by lusting tempts, and in tempting entices and draws the heart to sin, is for nature sin itself: but concupiscence in the regenerate lusts against the spirit, Gal. 5. 17. … And therefore it is sin properly: such as the fruit is, such is the tree.</p></blockquote>
<figcaption>— <a href="../authors/william-perkins.html">William Perkins</a>, <cite>A Reformed Catholic</cite>, Of Original Sin</figcaption>

</figure><figure class="quote" id="q-c4db61a2d0" data-kw="Imputation|Forgiveness" data-pol="">
<blockquote><p>That concupiscence does not condemn the regenerate, comes to pass by an accident, which is the grace of God, which does not impute it to the faithful. This, however, does not occur in this way, as though concupiscence were no sin; for other sins in like manner do not condemn the regenerate, not because they are no sins, but because they have obtained the pardon of them through Christ.</p></blockquote>
<figcaption>— <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a>, <cite>Commentary on the Heidelberg Catechism</cite>, Q. 113</figcaption>

<main class="wrap"><figure class="quote" id="q-b7442c1df2" data-kw="">
<blockquote><p>This great execution upon them together with the diligence of Luther and other Divines to inform their minds did for some time much compesce [to restrain] that evil spirit and so much fright him out of all the bounds of upper Germany, that he did never since that time stir much in these Quarters: but behold his behavior elsewhere. Being rejected of Luther and his Disciples, he went to try Zwingli and his friends: unaware, and upon a sudden great numbers of Anabaptists did arise in Zurich, Bern, Basle, and many other parts of Switzerland: at the beginning they dissembled [lied about] the worst of their tenets [beliefs], they dealt earnestly with Zwingli to gather out of the churches he had reformed new separate congregations: many remonstrances [complaints] did they make to him against the profanity of the common multitude, and for the holiness that ought to be in every church member; they alleged a necessity for the saints to put themselves in new distinct churches (S). The same things did they press upon Oeco­lampadius at Basle, but when these grave men had rejected their motion, and demonstrated the iniquity of their schismatic way: then without more ado having seduced multitudes by their cor­ner and night sermons, they did themselves erect without any permission either of the magistrates or ministers, their separate congregations (T), and for a visible distinguishing character of their way they publicly anabaptized all who did enter into their society (V). For these insolencies the magistrate was offended and put some of them in prison, presently they cried out loud of persecution for conscience (X), and of unjust condemnation be­fore their cause was tried: hereupon many public disputations were instituted, Zwingli and others in Zurich many days from morning till evening did debate with them in presence of the magistrate and all who pleased at great length upon all their tenets; this same did Oecolampadius in Basle, and others in Bern, the arguments and answers with the consent of both sides were written and published, by this means many received satisfaction, many also remained obstinate in their error and became tumul­tuous in their practices, which caused the most of them to be ba­nished out of these States. To this severity the magistrate was forced by the danger of their principles, and their usual wal­king accordingly, where fear kept them not in order: in Chri­stian Commonwealths they counted magistrates unlawful, they took their enthusiasms and revelations for Gods express commandments, and it was one of their prophets ordinary revela­tions to cut off by the sword all magistrates, and whosoever op­posed their way, though father, mother, brother, or dearest friend, yea so powerfully did Satan insinuate himself in their or­dinary raptures, that no man could be secure from their cruelty, as by this example is visible. At Saint gall in Zwitzerland in the year 1526. Feb. 8. Thomas Skyker having spent the whole night with a company of Ana­baptists in their religious exercises, in the morning he was filled with an enthusiasm, and before his father, mother, and whole company, he commanded in the name of God his German bro­ther Leonard Skyker to kneel before him, and having gotten obe­dience thus far, his next prank was before them all to cut off his brother’s head, avowing he had an express warrant from God so to do (Y). Many such private murders and divers public uproars, made the magistrate every where to keep a severe hand over them; yet for all that could be done, they got into their hands the town of Munster; here the wisdom and patience of God permitted them to act to the full, all their speculations. A Story recorded by many, and needful to be remembered to the world’s end, for a memento unto all men to be very wary of an erroneous spirit, though he do appear at the first in the habit of the greatest piety and innocence; the matter was thus: In the year 1533 and 1534 by the labors of Bernard Rotman and some Hessian Preachers, Munster the greatest and strongest town of Westphalia was persuaded to cast out the Popish cor­ruptions; while the work of Reformation was there going on apace, the Anabaptists came in and mixed themselves according to their custom; for this has ever been the way of schismatics, like drones and wasps to fall upon the labors of others; they use not any where to be the instruments of any Reformation or con­version, but when that work by the labor of others is done, then they come in to spoil all, pressing upon a reformed and a con­verted people their fancies (Z). When the Gospel was flourishing in Munster, a certain Tay­lor of Leiden in Holland, one John Becold did come to Town, who at home in his own country, had drunk in all the Anabaptist ra­very [madness]: the man was of a quick and subtle wit, a great dissembler [liar], insinuating himself in the favor of the ministers, he did propone [put forward] at first only by way of scruple his arguments against infant bap­tism (AA): but in the mean time in his secret conventicles over all the city, he did instill the whole mystery of Anabaptism: The chief Minister Rotman did at the beginning preach zealously against that way (BB), but after that one Stapreda, a violent Anabaptist had eropen [?] in to be his colleague, Rotman was gai­ned to that party, and at a public disputation declared himself for them, notwithstanding the other Ministers did confute so clearly the Anabaptists grounds, that the Town Senate remained satisfied, and by that Edict commanded all the Anabaptists to depart the City (CC). But this Statute was so slackly executed, that the most remained still in Town, and did in their night meetings so diligently advance their cause, that a great many more were conquered; upon which strength waxing confident they defied their opposites, and came to a public insurrecti­on (DD). As yet the orthodox were the greater part, but the schisma­tics were the more witty [intelligent] and industrious, they managed so well their smaller strength, that they became not only considerable, but so formidable, that their adversaries were glad to indulge them their liberty and toleration which they had long desired (EE); but behold the issue of that indulgence. They who of a long time had made it their great work to cry down persecution and up toleration, when they had obtained that desire, they did not stand there, but went on every day to add new members to their society, til at last finding the great increase of their strength within the city, they did invite by messengers and letters their associates abroad from all quarters to join with them. These sum­mons made many strangers to slock [to entice] to the town, upon whose appearance without farther delay a public proclamation was issued for all to be rebaptized, or else immediately to depart the city under the pain of death (FF). Many of the best did flee, whose houses and goods were seized, yet many good people were forced to stay, for the Bishop of Munster had then blocked the City, whereby divers of those who offered to get out were killed and spoiled, and the rest were frighted from attempting any escape to the country. The Anabaptists becoming absolute masters of the town, made it their first care to discharge all the former magistrates, and to substitute in their place a new senate of their own fa­ction (GG), over which they did set two consuls, Knipperdolling and Kippenburgh, two of their most forward friends.They seised on the goods of all and killed whom they would. About that time a certain Baker of Harlem, Jan Mathis did make himself a great prophet among them, this man one day did deliver as a revelation from heaven, that every one should bring together all his books and papers, the Bible only excepted, of all these he made a fair bonfire (HH). His next command was, that every one should bring forth all his money and goods under the pain of death, that all might be common (II): none durst [to dare] be bold to disobey, justice was so quick and severe amongst them. One Truteling a smith for a merry [humorous] word against the prophets was brought forth before the people and shot dead by the Prophet Mathis own hands (KK); after this Mathis pretending a commission from God went out his alone, with confidence to overthrow the whole camp of them who besieged the city, but by the first of the enemy’s soldiers the false prophet was killed (LL).</p></blockquote>

F%5D+in+to+be+his+colleague%2C+Rotman+was+gai%C2%ADned+to+that+party%2C+and+at+a+public+disputation+declared+himself+for+them%2C+notwithstanding+the+other+Ministers+did+confute+so+clearly+the+Anabaptists+grounds%2C+that+the+Town+Senate+remained+satisfied%2C+and+by+that+Edict+commanded+all+the+Anabaptists+to+depart+the+City+%28CC%29.+But+this+Statute+was+so+slackly+executed%2C+that+the+most+remained+still+in+Town%2C+and+did+in+their+night+meetings+so+diligently+advance+their+cause%2C+that+a+great+many+more+were+conquered%3B+upon+which+strength+waxing+confident+they+defied+their+opposites%2C+and+came+to+a+public+insurrecti%C2%ADon+%28DD%29.+As+yet+the+orthodox+were+the+greater+part%2C+but+the+schisma%C2%ADtics+were+the+more+witty+%5Bintelligent%5D+and+industrious%2C+they+managed+so+well+their+smaller+strength%2C+that+they+became+not+only+considerable%2C+but+so+formidable%2C+that+their+adversaries+were+glad+to+indulge+them+their+liberty+and+toleration+which+they+had+long+desired+%28EE%29%3B+but+behold+the+issue+of+that+indulgence.+They+who+of+a+long+time+had+made+it+their+great+work+to+cry+down+persecution+and+up+toleration%2C+when+they+had+obtained+that+desire%2C+they+did+not+stand+there%2C+but+went+on+every+day+to+add+new+members+to+their+society%2C+til+at+last+finding+the+great+increase+of+their+strength+within+the+city%2C+they+did+invite+by+messengers+and+letters+their+associates+abroad+from+all+quarters+to+join+with+them.+These+sum%C2%ADmons+made+many+strangers+to+slock+%5Bto+entice%5D+to+the+town%2C+upon+whose+appearance+without+farther+delay+a+public+proclamation+was+issued+for+all+to+be+rebaptized%2C+or+else+immediately+to+depart+the+city+under+the+pain+of+death+%28FF%29.+Many+of+the+best+did+flee%2C+whose+houses+and+goods+were+seized%2C+yet+many+good+people+were+forced+to+stay%2C+for+the+Bishop+of+Munster+had+then+blocked+the+City%2C+whereby+divers+of+those+who+offered+to+get+out+were+killed+and+spoiled%2C+and+the+rest+were+frighted+from+attempting+any+escape+to+the+country.+The+Anabaptists+becoming+absolute+masters+of+the+town%2C+made+it+their+first+care+to+discharge+all+the+former+magistrates%2C+and+to+substitute+in+their+place+a+new+senate+of+their+own+fa%C2%ADction+%28GG%29%2C+over+which+they+did+set+two+consuls%2C+Knipperdolling+and+Kippenburgh%2C+two+of+their+most+forward+friends.They+seised+on+the+goods+of+all+and+killed+whom+they+would.+About+that+time+a+certain+Baker+of+Harlem%2C+Jan+Mathis+did+make+himself+a+great+prophet+among+them%2C+this+man+one+day+did+deliver+as+a+revelation+from+heaven%2C+that+every+one+should+bring+together+all+his+books+and+papers%2C+the+Bible+only+excepted%2C+of+all+these+he+made+a+fair+bonfire+%28HH%29.+His+next+command+was%2C+that+every+one+should+bring+forth+all+his+money+and+goods+under+the+pain+of+death%2C+that+all+might+be+common+%28II%29%3A+none+durst+%5Bto+dare%5D+be+bold+to+disobey%2C+justice+was+so+quick+and+severe+amongst+them.+One+Truteling+a+smith+for+a+merry+%5Bhumorous%5D+word+against+the+prophets+was+brought+forth+before+the+people+and+shot+dead+by+the+Prophet+Mathis+own+hands+%28KK%29%3B+after+this+Mathis+pretending+a+commission+from+God+went+out+his+alone%2C+with+confidence+to+overthrow+the+whole+camp+of+them+who+besieged+the+city%2C+but+by+the+first+of+the+enemy%E2%80%99s+soldiers+the+false+prophet+was+killed+%28LL%29.%E2%80%9D%0A%0A%E2%80%94+Robert+Baillie%2C+Anabaptism%2C+The+True+Fountain+of+Independency%2C+Brownisme%2C+Antinomy%2C+Familism%2C+and+the+most+of+the+other+Errors+Which+For+The+Time+Do+Trouble+the+Church+of+England%2C+Unsealed+%28London%2C+1647%29%2C+6%E2%80%9310.+NB%3A+For+ease+of+reading+and+because+archaic+spelling+tend+to+make+older+writers+seem+unintelligent%2C+the+s&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb7442c1df2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b7442c1df2.html">Permalink</a><a class="src" href="https://heidelblog.net/2025/05/baillie-versus-tombes-3-how-the-particular-baptists-appeared-to-early-presbyterians/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>4th Distinction. A calling may be expressly and formally corrupt in respect of the particular intention of the ordainers and of the particular Church, ex intentione ordinaris et operantis [out of the intention of the ordainers and of the one working]. Thus Luther’s calling to be a monk was a corrupt calling, and eatenus, and ‘in that respect’ he could not give a calling to others. But that some calling may be implicitly and virtually good and lawful in respect of the intention of the Catholic Church and ex intentione operis &amp; ipsius ordinationis [out of the intention of the work and the ordination itself], he was called to preach the Word of God. …

7. A calling to the ministry is either such: [1.] as wants the essentials, as gifts in any messenger and the Church’s consent, or these who occupy the room of the Church, the Church consenting: such a minister is to be reputed for no minister; or 2. an entry to a calling, or a calling where diverse of the apostles’ requisites are wanting, may be a valid calling, as if one enter as Caiphas, who entered by favor and money and contrary to the Law, was High-Priest but for a year: yet was a true High-Priest and prophesied as the High-priest [Jn. 11:49-51].

8. If the Church approve by silence, or countenance the ministry of a man who opened the Church door to himself by a silver key, having given the prelate a bud. The ordinance of God is conferred upon him, and his calling ceases not to be God’s calling because of the sins of the instruments both taking and giving. … 11. The question, if such a pastor be called lawfully, is a question of fact, not a question of law; [it is] as this [case]: if such an one be baptized and there be an invincible ignorance in a question of fact which excuses. And therefore we may hear a gifted pastor taken and supposed by the Church to have the Church’s calling, though indeed he received no calling from the Church at his entry. … 3. We are nowhere forbidden in God’s Word to hear teachers sent and called, but only wolves in sheep skins, void of all calling, and intruders: for pastors may be antichristian in the manner of the entry, as Caiaphas… 3. Yea, and brook an antichristian calling, as prelates do and have done in Britain, and yet their ministry be valid. For that the calling of a minister be valid and his ministerial acts not null, it is sufficient that the governing Church give him a calling, either by themselves, their express call, their silence, or tacit consent, or their approbation communicating with him in his ministry, or by these to whom the Church resigned her power, or by these who stand in place of the Church, though prelates invade the place of the Church: yet: [1.] because first they themselves be pastors and have power to teach and baptize as pastors called of Christ. Mt. 18:19. 2. Because they stand for the Church, the Church approving or someway by silence consenting (as in the case of Caiaphas’s entry to the priesthood) thereunto. These who are baptized of them are not rebaptized, and these who are ordained pastors by them are not reordained, but have a calling to the ministry and do validly confer a calling upon others. Yea, many of great learning think that at the beginning of Reformation thousands being under popery baptized by midwives and private persons, were never rebaptized, not that they think such baptism valid, but where the sacrament is wanting, ex invincibili ignorantia facti, ‘out of an invincible ignorance of a fact’, such that way [the] baptized do indeed want the Lord’s seal; but we cannot for that say that they are no better than infidels and unbaptized Turks and Jews, because:

1. Their being born in the visible Church gives a federal holiness, as all of Jewish parents had a federal right to circumcision and were, eatenus, ‘insofar’, separated from the womb.

2. Because their profession of that Covenant whereof baptism is a seal, separates them sufficiently from infidels, though they want the seal external. But our divines esteem, and that justly, baptism administrated by women or such as have no calling, to be no baptism at all; for which let the reader see Calvin, Institutes, bk. 4, ch. 15, sect. 20; Epistle 326; Beza, Libel., Questione de Baptism; the learned Rivet, in Cathol. Orthod., tome 2, tract 2, q. 7. We stand not for what Bellarmine, Maldonatus, Gretserus and other papists say on the contrary.</p></blockquote>

— Samuel Rutherford, The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’, … (London, 1644), pt. 1, pp. 204-8, 229, 235 irregular numbering">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4th+Distinction.+A+calling+may+be+expressly+and+formally+corrupt+in+respect+of+the+particular+intention+of+the+ordainers+and+of+the+particular+Church%2C+ex+intentione+ordinaris+et+operantis+%5Bout+of+the+intention+of+the+ordainers+and+of+the+one+working%5D.+Thus+Luther%E2%80%99s+calling+to+be+a+monk+was+a+corrupt+calling%2C+and+eatenus%2C+and+%E2%80%98in+that+respect%E2%80%99+he+could+not+give+a+calling+to+others.+But+that+some+calling+may+be+implicitly+and+virtually+good+and+lawful+in+respect+of+the+intention+of+the+Catholic+Church+and+ex+intentione+operis+%26+ipsius+ordinationis+%5Bout+of+the+intention+of+the+work+and+the+ordination+itself%5D%2C+he+was+called+to+preach+the+Word+of+God.+%E2%80%A6+7.+A+calling+to+the+ministry+is+either+such%3A+%5B1.%5D+as+wants+the+essentials%2C+as+gifts+in+any+messenger+and+the+Church%E2%80%99s+consent%2C+or+these+who+occupy+the+room+of+the+Church%2C+the+Church+consenting%3A+such+a+minister+is+to+be+reputed+for+no+minister%3B+or+2.+an+entry+to+a+calling%2C+or+a+calling+where+diverse+of+the+apostles%E2%80%99+requisites+are+wanting%2C+may+be+a+valid+calling%2C+as+if+one+enter+as+Caiphas%2C+who+entered+by+favor+and+money+and+contrary+to+the+Law%2C+was+High-Priest+but+for+a+year%3A+yet+was+a+true+High-Priest+and+prophesied+as+the+High-priest+%5BJn.+11%3A49-51%5D.+8.+If+the+Church+approve+by+silence%2C+or+countenance+the+ministry+of+a+man+who+opened+the+Church+door+to+himself+by+a+silver+key%2C+having+given+the+prelate+a+bud.+The+ordinance+of+God+is+conferred+upon+him%2C+and+his+calling+ceases+not+to+be+God%E2%80%99s+calling+because+of+the+sins+of+the+instruments+both+taking+and+giving.+%E2%80%A6+11.+The+question%2C+if+such+a+pastor+be+called+lawfully%2C+is+a+question+of+fact%2C+not+a+question+of+law%3B t+way+%5Bthe%5D+baptized+do+indeed+want+the+Lord%E2%80%99s+seal%3B+but+we+cannot+for+that+say+that+they+are+no+better+than+infidels+and+unbaptized+Turks+and+Jews%2C+because%3A+1.+Their+being+born+in+the+visible+Church+gives+a+federal+holiness%2C+as+all+of+Jewish+parents+had+a+federal+right+to+circumcision+and+were%2C+eatenus%2C+%E2%80%98insofar%E2%80%99%2C+separated+from+the+womb.+2.+Because+their+profession+of+that+Covenant+whereof+baptism+is+a+seal%2C+separates+them+sufficiently+from+infidels%2C+though+they+want+the+seal+external.+But+our+divines+esteem%2C+and+that+justly%2C+baptism+administrated+by+women+or+such+as+have+no+calling%2C+to+be+no+baptism+at+all%3B+for+which+let+the+reader+see+Calvin%2C+Institutes%2C+bk.+4%2C+ch.+15%2C+sect.+20%3B+Epistle+326%3B+Beza%2C+Libel.%2C+Questione+de+Baptism%3B+the+learned+Rivet%2C+in+Cathol.+Orthod.%2C+tome+2%2C+tract+2%2C+q.+7.+We+stand+not+for+what+Bellarmine%2C+Maldonatus%2C+Gretserus+and+other+papists+say+on+the+contrary.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries%2C+%E2%80%98Acts+15%2C+A+Pattern+of+a+Juridicial+Synod%E2%80%99%2C+%E2%80%A6+%28London%2C+1644%29%2C+pt.+1%2C+pp.+204-8%2C+229%2C+235+irregular+numbering&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce6f22c7a1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce6f22c7a1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=4th%20Distinction.%20A%20calling%20may%20be,other%20papists%20say%20on%20the%20contrary&amp;text=4th%20Distinction.%20A%20calling%20may%20be%20expressly%20and&amp;text=Gretserus%20and%20other%20papists%20say%20on%20the%20contrary" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>XX. Although the authority of these constitutions is great in the church, we deny that it is absolute, but limited; or that it is equal with the divine laws; or that it is as great a sin to transgress the former as the latter. We deny that they can change the nature of things, so that what are in themselves indifferent can be made necessary and of perpetual right; or that any part of Christian righteousness is in them, much less any merit with God; or that they can extend themselves beyond ecclesiastical polity or good order (eutaxian), which by themselves are not of piety, but only on account of another thing and by accident. Again, we say that they are not to be measured by themselves, but by divine laws, that they may not in anyway obstruct, but may rather subserve the latter.</p></blockquote>

<blockquote><p>III. (2) We must distinguish between simple precepts (i.e., merely moral) belonging to natural right and mixed precepts (moral and ceremonial, partly of natural and partly of positive right; as the fourth commandment concerning the Sabbath, which is moral as to the genus of public worship, but ceremonial as to the circumstance of the defined time; and the fifth, which is moral as to the prescribed duty and the promise of longevity, but ceremonial as to the appended promise of the land of Canaan).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-2ad8e44f61" data-kw="">
<blockquote><p>Therefore, that thou be not beguiled with falsehood of sophistical words, understand that the words which the scripture uses in the worshipping or honoring of God, are these: Love God, cleave to God, dread, serve, bow, pray and call on God, believe and trust in God, and such like: which words all we use in the worshipping of man also, howbeit diversely; and the difference thereof does all the scripture teach.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-tyndale.html">William Tyndale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to Sir Thomas More’s Dialogue, the Supper of the Lord</cite>, … (d. c. 1536; Cambridge: Parker Society, 1850), pp. 56-57</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1873affc2a" data-kw="">
<blockquote><p>Application 1: This may first let us see that notwithstanding the reformation of religion, Christ may be pleased rather to live abroad in the fields than at home, where the people would willingly assemble: The house of God was now repaired, and the bed green: and the Church invites Christ to come in unto her, in it, yet He disposes Himself so, as more willing to call her abroad. So we may see that notwithstanding the purity and simplicity of Christ’s worship, yet Christ is not bound to any place; if things were never so reformed, yet He might leave us, and go into the wild field. Rome has long doted on Peter’s Chair, and Jerusalem might as well have bragged of her privileges as any other place, but Christ leaves them: Never rest we then in any outward estate, for Christ may leave us. The Palatinate [Germany] has been as reformed as any Church for doctrine, and though they might say, their bed was green, and their beams were of cedar, and their rafters of fir, yet God has left them: for do we think that if God had been there, these things had befallen them that now are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canticles, or Song of Songs, Opened &amp; Explained</cite>, … (London, 1642), ch. 2, pp. 60-61</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-f93816dc6b" data-kw="">
<blockquote><p>No man of sound judgment (saith Beza) will deny, that Jesus Christ, the more naked He be, is made the more manifest to us: whereas contrarywise all false religions use by certain external gesturings to turn away men from divine things.</p></blockquote>

</figure><figure class="quote" id="q-e1aa6ff992" data-kw="">
<blockquote><p>Does not our Savior tell the men of Capernaum, that had the wonderful means of grace, Mt. 11:31, If those things had been done in Tyre and Sidon (two heathenish places) they would have repented in dust, in ashes? It’s thought, true repentance and conversion is not here meant; but palpable and sensible demonstrations they would have made of some sorrow and humiliation; and therefore Christ threatens to take away the Kingdom of heaven from the Jews; viz. The Gospel, and give it to a nation bringing forth fruit better than they: Oh consider then, whether the very Heathens and Pagans would not give more respect, and show more joy at the Word preached than you do: Take heed, for there are none further off grace, than those that have been called, and yet reject it: There is more hopes of those to whom the Gospel was never rendered;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Spiritual Refining: or A Treatise of Grace and Assurance</cite>, (1652; repr.: Ames, Iowa: 1990) | Sermon 120</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-a2708ddae5" data-kw="">
<blockquote><p>My experience after two decades both at the local level and institutional level is this: for Southern Baptists image is everything. There is nothing and no one they will not sacrifice on the altar of their image. But it’s not just a commitment; it’s embedded in the culture itself. When image is everything, a culture of fear follows, so that anyone who does not match up with that image is considered a threat. As we’ve seen in the last couple of years, the SBC has been plagued with covering up sin to protect its image. But this occurs at the local church level as well. When there is sin in the leadership, the impulse is to cover it up to protect the image rather than being transparent with the church. Southern Baptist pastors often tell their congregations, “Just trust us,” and “Don’t gossip,” which results in a church incapable of acting when they suspect sin in the leadership. Moreover, they have little recourse to an external ecclesiastical authority to hold the leadership accountable… I can no longer go along with Southern Baptists who pride themselves on a type of independence that locks out effective external accountability. Nor can I continue ignoring the spiritual abuse that so many have suffered as a consequence. In short, when image is everything, the cross is eclipsed. Ironically, this does not image the humility of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-barrett.html">Matthew Barrett</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘I am leaving the SBC and becoming Anglican’</cite>, (2025) at Anselm House</span></figcaption>

lts/#:~:text=My%20experience%20after%20two%20decades%20both,not%20image%20the%20humility%20of%20Christ&amp;text=My%20experience%20after%20two%20decades%20both%20at%20the&amp;text=this%20does%20not%20image%20the%20humility%20of%20Christ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

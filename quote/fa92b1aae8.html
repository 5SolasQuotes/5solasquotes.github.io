<blockquote><p>2. But in respect of the case of the infants, which you say ought not to be baptized within the second or third day after their birth, and that the law of ancient circumcision should be regarded, so that you think that one who is just born should not be baptized and sanctified within the eighth day, we all thought very differently in our council. For in this course which you thought was to be taken, no one agreed; but we all rather judge that the mercy and grace of God is not to be refused to any one born of man. For as the Lord says in His Gospel, “The Son of man is not come to destroy men’s lives, but to save them,” as far as we can, we must strive that, if possible, no soul be lost. For what is wanting to him who has once been formed in the womb by the hand of God? To us, indeed, and to our eyes, according to the worldly course of days, they who are born appear to receive an increase. But whatever things are made by God, are completed by the majesty and work of God their Maker.</p></blockquote>

<blockquote><p>‘It comes sometime to pass’ (says St. Augustine) ‘that the children of bond-slaves are brought to baptism by their Lord; sometime the parents being dead, the friends alive undertake that office, sometime stangers or virgins consecrated unto God, which neither have, nor can have children of their own, take up infants in the open streets, and so offer them unto baptism, whom the cruelty of unnatural parents casts out, and leaves to the adventure of uncertain pity.’ As therefore he which did the part of a neighbor, was a neighbor to that wounded man whom the parable of the Gospel describes, so they are fathers, although strangers, that bring infants to him which makes them the sons of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Mr. Richard Hooker</cite>, (that learned and judicious divine), in Eight Books of Ecclesiastical Polity… (London, 1666), bk.5, section 64, p. 244 Hooker (1554–1600) was a prominent Anglican apologist.</span></figcaption>

<blockquote><p>VI. To no purpose is the reply: (1) “Hence it would follow that the Lord’s Supper should also be administered to infants because the thing signified belongs to them.” Although the same thing is signified in both, still there is a difference in the manner of signifying. In the Supper, the grace of Christ is sealed by way of solid food, which infants are not capable of receiving; but in baptism, it is signified by way of the washing of regeneration, which they are (Jn. 3:5). Again, the Supper demands a twofold condition: a preceding in examination; a concomitant in a commemoration of the death of Christ, both of which presuppose the use of reason. Neither is required in baptism; thus formerly the Passover was distinguished from circumcision—that the latter was administered to infants and the former to adults alone. (2) “It is added that infants are not capacious of the grace of regeneration, nor of the other blessings of the covenant which are accustomed to be conferred by the Spirit through the word.” But it is gratuitously supposed that they are not capacious of the blessing of the covenant. For who denies that they are capacious of the remission of sins and of Christ’s redemption, and of the other benefits which depend upon the covenant into which infants are received? Who can doubt that baptism (with respect to these) is able to be a distinctive sign (introducing into the visible church) and a seal both of the divine truth in the federal promises and of our obligation to mutual duty? For if they are not capable of obligation in the present, they can be in the future. As to regeneration, however, why should infants not be capable of regeneration as they are of sin (unless we say that guilt has more power than grace)? And as they are rational (although they do not put forth an act of reason), what hinders them from being called holy and believers by the Holy Spirit given to them, although they cannot as yet exert an act of faith?</p></blockquote>

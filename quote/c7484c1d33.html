<main class="wrap"><figure class="quote" id="q-c7484c1d33" data-kw="">
<blockquote><p>The person of Christ, as invested with his righteousness, is the formal object. Not the person of Christ barely considered, but as clothed with a righteousness qualifying him to a Mediator, a Saviour; as one that has fulfilled the law and satisfied justice in whatever it could demand on our behalf. As Christ without this would not be a Saviour, so without this he cannot be the object of saving faith: Rom. 3:25, ‘Through faith in his blood;’ where blood, being the most signal part of his satisfaction, is put for his whole righteousness. Here is in this verse whatever is assigned as a special object of faith. Here is Christ and his righteousness expressly the formal object; faith in his blood, called ἀπολύτρωσις, ver. 24, through the redemption, i.e., through the satisfaction of Christ, who paid a satisfactory price (a λύτρον) that captive sinners might be delivered. And that price was his righteousness, here called his blood: ut significetur fidem non aliò quam ad Christi sacrificium ferri.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Faith in The Practical Works of David Clarkson, B.D., Fellow and Tutor of Clare Hall, Cambridge</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-89aeb62812" data-kw="">
<blockquote><p>[Margin Note:] It’s false that Christ so died for us, that is, in our stead, as that in our stead He fulfilled the Law and performed all active obedience and passive by doing and dying that God can require of us. 2. Christ may be said to die for us, as if we had substituted Him in our place, in so rigid a sense as if He had been made our surety to fulfill both the preceptive and active, and also the satisfying and suffering part of the Law in our room. This may please Antinomians, but a doubt it is, if it stand with the truth: For then whatever we, yea all mortal men be (for Christ died for them all, as many teach) most wicked, yet Christ’s active and surety, and cautionary righteousness should be ours; and though we should never believe, yet Christ who fulfilled the Law, and preceptive as well as the threatening part, must have believed for all that He died for, and what need we then in our persons either [to] believe or repent? It’s true, we need not perform any active obedience, as a part of active fulfilling of that Covenant of Works, which either must have all or no obedience. If it be said that alio titulo, ‘upon another account’ of thankfulness to our ransom-payer we owe active obedience: Yet all [persons] that Christ died for, both actively and passively, must be perfectly righteous and justified, [He] having paid the most perfect active and passive obedience that the Law required, though we never believe, and Christ must have paid the active part of justifying faith for us. And why, but we should be formally justified in Him without faith also? As also, God, not we, laid our sins upon Christ, Isa. 53:6; 2 Cor. 5:21, and therefore we did commissionate and substitute Christ to die in our room.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, (1655), pt. 2, ch. 3, pp. 246-47</span></figcaption>

<main class="wrap"><figure class="quote" id="q-b92ca2da9e" data-kw="">
<blockquote><p>The covenant of works, which may also be called a legal or natural covenant, is founded in nature, which by creation was pure and holy, and in the law of God, which in the first creation was engraven in man’s heart. For after that God had created man after his own image, pure and holy, and had written his law in his mind, he made a covenant with man, wherein he promised him eternal life, under the condition of holy and good works, which should be answerable to the holiness and goodness of their creation, and conformable to his law. And that nature thus beautified with holiness and righteousness and the light of God’s law, is the foundation of the covenant of works, it is very evident; for that it could not well stand with the justice of God to make a covenant under condition of good works and perfect obedience to his law, except he had first created man pure and holy, and had engraven his law in his heart, whence those good works might proceed. For this cause, when he was to repeat that covenant of works to the people of Israel, he first gave the law written in tables of stone; then he made a covenant with his people, saying, “Do these things, and ye shall live.” Therefore the ground of the covenant of works was not Christ, nor the grace of God in Christ, but the nature of man in the first creation holy and perfect, endued also with the knowledge of the law. For, as touching the covenant of works, there was no mediator in the beginning between God and man, that God should in him, as in and by a mediator, make his covenant with man. And the cause that there was no need of a mediator was this, that albeit there were two parties entering into a covenant, yet there was no such breach or variance betwixt them that they had need of any mediator to make reconciliation between them; for, as for the covenant of works, God made this covenant [note] with man, as one friend doth with another. For in the creation we were God’s friends, and not his enemies. Thus far of the ground of the covenant of works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tractatus de vocatione efficaci</cite>, (Edinburgh, 1597), idem, A Treatise of God’s Effectual Calling in Select works of Robert Rollock (Edinburgh: The Wodrow Society, 1849), 1.34–35.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-da88f29e9d" data-kw="">
<blockquote><p>The same doctrine Moses repeated in his ministry. For he also inculcated the same precepts upon which the covenant of works had been built: he both repeated the same solemn saying, He who doeth these things shall live in them, Lev. 18:5 and also added another, Cursed be he who shall not perform the words of this law in doing them, Deut. 27:26. That this is the curse of the law, as it stands opposed to the covenant of grace, Paul teacheth, Gal. 3:10. which, however, is not so to be understood, as if God had intended, by the ministry of Moses, to make a new covenant of works with Israel, with a view to obtain righteousness and salvation by such a covenant. But that repetition of the covenant of works was designed to convince the Israelites of their sin and misery, to drive them out of themselves, to teach them the necessity of a satisfaction, and to compel them to cleave to Christ: and thus it was subservient to the covenant of grace, Rom. 10:4.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain</cite>, trans. Thomas Bell (Glasgow: W. Lang, 1807), 87.</span></figcaption>

<blockquote><p>VI. Episcopius, and with him the Remonstrants, deny that a covenant of nature was made with Adam (“Institutiones theologica,” 2.1 in Opera theologica [1678], p. 23); but it can be proved. (1) There are granted the essential parties of a covenant, God and man. God, who as the Creator of man, must also be his governor and from this, his legislator, and because good in his own nature, the rewarder also of those who seek him (Heb. 11:6), so that he would not only give him a law for his direction, but also hold forth a reward to him for keeping it (although bound by no right to that). Man who, because a creature, must also wholly depend upon God and, because upright, could keep the inscribed law, and because rational, ought not otherwise than in a rational manner (i.e., by the intellect and will) be governed, both by the prescription of a law, the promise of rewards and the threatening of punishment. Also since he was created after the image of divine holiness, he ought to have been led to a communion of that happiness also which is the inseparable attendant of holiness. VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12). VIII. Third, the passage in Hos. 6:7 seems not obscurely to intimate this: the Israelites are said to have “transgressed the covenant like Adam” (hmh k’dhm ‘bhrv bhryth). For although these words may also be explained of the inconstancy of men (that they may be said to have transgressed the covenant as men are wont to do, who are naturally false and fickle, and often deceive expectation), still nothing prevents their being referred also to Adam (that they may be said to have violated the covenant like Adam, their first parent, who miserably broke the covenant contracted with him by God). A similar locution occurs in Job 31:33: “If I covered,” says he, “my transgressions as Adam [k’dhm].” Here is a manifest reference to the fact of Adam’s endeavoring to excuse and hide his sin (Gen. 3:12).</p></blockquote>

<blockquote><p>1. This contract between God and the first Adam, is in sacred writ, expressly styled a covenant. “These are the two covenants; the one from the mount Sinai, which gendereth to bondage, which is Agar.” Here are two covenants mentioned, the one of which, genders to bondage, and the other, to liberty or freedom. The covenant of grace, or “The law of the Spirit of life in Christ Jesus,” is the one which genders to liberty, or which makes free from the law of sin and death. The one, therefore, which genders to bondage, must be that law or covenant of works, which was republished to the Israelites, from mount Sinai; which required perfect obedience to the ten commandments, on pain of death, and contained a promise of life, to the man who should do, or perform such obedience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Covenant of Works</cite>, 5</span></figcaption>

<blockquote><p>The second consequence attributed to the imputation of Christ’s righteousness, is a title to eternal life. This in the older writers is often expressed by the words “adoption and heirship.” Being made the children of God by faith in Christ Jesus (Gal. 3:26), they are heirs of God and joint heirs with Jesus Christ of a heavenly inheritance. (Romans 8:17.) The mere expiation of guilt confers no title to eternal life. The condition of the covenant under which man was placed was perfect obedience. This, from all that appears in Scripture, the perfection of God requires. As He never pardons sins unless the demands of justice be satisfied, so He never grants eternal life unless perfect obedience be rendered. Heaven is always represented as a purchased possession. In the covenant between the Father and the Son the salvation of his people was promised as the reward of his humiliation, obedience, and death. Having performed the stipulated conditions, He has a claim to the promised recompense. And this claim inures to the benefit of his people. But besides this, as the work of Christ consisted in his doing all that the law of God, or covenant of works requires for the salvation of men, and as that righteousness is freely offered to every one that believes. every such believer has as valid a claim to eternal life as he would have had, had he personally done all that the law demands. Thus broad and firm is the foundation which God has laid for the hopes of his people. It is the rock of ages; Jehovah our righteousness.</p></blockquote>

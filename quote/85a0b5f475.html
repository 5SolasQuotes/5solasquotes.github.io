<main class="wrap"><figure class="quote" id="q-85a0b5f475" data-kw="">
<blockquote><p>LXIV. On the other hand, if someone asks about adults who foster and profess faith but are not yet baptized, who are called catechumens, and also about those who have been excommunicated from the Church but still retain faith and charity in their hearts, whether they are part of the Church and should be considered true members of it, the Romanist doctors simply deny it, while our [Reformed] theologians affirm it. However, there seems to be agreement in reality; for such individuals, according to the Romanists, pertain, as they say, to the soul of the Church and the mystical body of Christ to be granted salvation by Him. Our theologians concede that such individuals are not, at least absolutely and perfectly, part of the visible Church, that is, they do not pertain to the external society of the Church, nor are they aggregated to any particular Church, which does not prejudice their salvation according to both sides. See Whitaker, On the Church against Bellarmine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), Nature &amp; Definition of the Church, p. 435 Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

rmine&amp;text=LXIV.%20On%20the%20other%20hand%2C%20if%20someone%20asks&amp;text=sides.%20See%20Whitaker%2C%20On%20the%20Church%20against%20Bellarmine" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b20f80a414" data-kw="">
<blockquote><p>5. When we teach the perseverance of the saints in a state of justification once obtained, we do not deny that the quality, or exercise of the faithful or righteous man is mutable or may be lost, by reason of the subject matter; but we affirm that the special love of God does not permit, that he who by believing in Christ shall have been justified and adopted as a son of God, by losing that faith and holiness should cease to be a child of God and perish for ever.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-363ccf782c" data-kw="">
<blockquote><p>Therefore, when we say that the proper power of outward baptism resides in being a seal, we mean two things: firstly, that it makes more certain the promised grace that the principal cause has conferred or is to confer, and secondly that it strengthens and increases that grace. But since that promise is not absolute but linked to the condition of faith and repentance, it follows that the grace is sealed only to those who believe and repent, and consequently do not use the signs in a unworthy manner, as the apostle says in 1 Corinthians 11:29. In this regard we grant that this sacrament–just like the other ones–is also exhibitive of the thing that is promised, because in the lawful and worthy use of this sacrament these things that are promised are through the Holy Spirit not merely offered to believers but they are in fact exhibited to and conferred upon them. For God is truthful in sealing his promises, and our sacraments are not supplements of a letter that kills, but of the life-giving Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, (Brill, 2020), vol. 3, Disputation 44, ‘On the Sacrament of Baptism’, sections 31-32, p. 155</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

t="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-feda7ad161" data-kw="">
<blockquote><p>…hence we seek a warrant, why these who were once members of the visible Church and baptized, as the Answer to the 32 [Questions, a previously published congregationalist work] says, and so [are] clean and holy, 1 Cor. 7:14; Rom. 11:16, (2) in covenant with God, Acts 2:38-39; Acts 15:14-15; Gen. 17:7; 2 Cor. 6:16-18, etc. (3) and so redeemed by the blood of Christ and baptized into his body, 1 Cor. 12:13, even unto Christ, Gal. 3:17; Acts 2:38-39, when they come to age, are for no scandal unchurched, and because they cannot give evidence of real conversion, yet for 60 or 80 years, and to their dying day, are no more Church-members than pagans? ([Margin note:] Our [congregationalist] Brethren cast out of the Church these who were baptized in their infancy, and members thereof, because visibly non-regenerated. What warrant for this censure?)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4180bde67e" data-kw="">
<blockquote><p>If it be just to do, which thou through constraint hast promised, it is just also for thee to promise by oath to do it. For what we may lawfully do, the same also we may lawfully promise by an oath to do. As, if a man falling into the hands of a thief, should be required by the thief to give a piece of money for the redeeming of his life; verily he not only may, but also ought, if he be able, to perform that which the thief requires. And if this be lawfully performed unto a thief, it is lawfully also performed unto him by an oath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sum of Christian Religion: Delivered</cite>, … tr. Henrie Parrie (Oxford, 1587), 3rd Commandment, 4. ‘Whether all oaths are to be kept’, p. 919</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-900ae0fb00" data-kw="">
<blockquote><p>XVII. The consideration of this, that magistracy is an ordinance of the only wise God, and that such as are in authority are warranted of Him, and have commission from Him, should move Christians to carry themselves under them in the exercise of their power, as loyal, dutiful subjects, whatever their persons be, tho’ heathens and strangers to Christ, and enemies to his kingdom; for He would have the Christian Romans live in subjection unto their heathen magistrates, emperors, consul or senate, upon this motive, that there is no power but of God; and the powers that be, are ordained of God [Rom. 13].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of Romans</cite>, (Edinburgh: Paterson, 1766), ch. 13, p. 505 Wamphray was an influential and leading Scottish covenanter.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-b3da5474ff" data-kw="">
<blockquote><p>When kings or rulers become blasphemers of God, oppressors and murderers of their subjects, they ought no more to be accounted kings or lawful magistrates, but as private men to be examined, accused, condemned and punished by the Law of God, and being convicted and punished by that law, it is not man’s but God’s doing,</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-goodman.html">Christopher Goodman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Obedience, Ch. 10, p. 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-e661f7cd8d" data-kw="">
<blockquote><p>2. This [God’s injunction to obey civil magistrates] condemns the clergy of Rome, that exempt themselves from all princes’ authority, whereas God has said, ‘Let every soul be subject to the higher powers’ [Rom. 13:1]: If they have souls they must be subject. But how do they exempt themselves? … 2. By the Donation of Constantine; but its not in the power of princes so to do: They [princes] may exempt them [clergy] from tribute [taxes], if they will, as Pharoah took not the priests’ lands to gage for Corn; but to exempt them from subjection: they cannot. This were to make themselves wiser then God, who has put them under their authority, yea, the too much indulgence and favor of emperors, has been the bane of the Church, and helped up the Pope into his stirrup; Therefore its wisdom in them to hold their authority which God has given them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rogers.html">John Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly and Fruitful Exposition upon all the First Epistle of Peter</cite>, (d. 1636; 1650) | On 1 Pet. 2:13, pp. 318-19</span></figcaption>

</figure><figure class="quote" id="q-c4e8300ca3" data-kw="">
<blockquote><p>Absolute censorship of the Nazi data does not seem proper, especially when the secrets of saving lives may lie solely in its contents… When the value of the Nazi data is of great value to humanity, then the morally appropriate policy would be to utilize the data, while explicitly condemning the atrocities… To further justify its use, the scientific validity of the experiment must be clear; there must be no other alternative source from which to gain that information, and the capacity to save lives must be evident. …it must not be included as ordinary scientific research, just to be cited and placed in a medical journal… citation of the data must contain a thorough expose’ of exactly what tortures and atrocities were committed for that experiment… [and it] must be accompanied with the author’s condemnation of the data… as medical evil, never to be repeated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/baruch-c-cohen.html">Baruch C. Cohen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Nazi Medical Experimentation: The Ethics Of Using Medical Data From Nazi Experiments’</cite>, (n.d.) 115 paragraphs | It is clear that good can be, and has been brought out of the Nazis’ preserved data (which can’t be obtained in any other way), but should it? The main cost involved in doing so, besides the sheer revoltingness of it all, is the very scandal of the knowledge of these things becoming known. The article concludes:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

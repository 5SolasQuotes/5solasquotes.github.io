<main class="wrap"><figure class="quote" id="q-7726fab6b7" data-kw="">
<blockquote><p>This man being pastor to a church in Salem in New England, though he had formerly bragged or boasted that of all the Churches of the world those of New England were the purest, and of all in New England that whereof he was the teacher; yet there he set up for so much strictness that he told his congregation if they would not separate from all the churches in New England, as well as from the churches of Old England, he would separate from them: But his congregation in Salem refusing to go in with his proposals, he separated from them, and would never have any communion with any person in it, nay, not with his own wife, that went into their assemblies; keeping a meeting at the same time in his own house, whereto resorted such as he had infected with his extravagancies: And though pains were taken upon this man, yet he went on in his ways, renouncing all the churches of New England.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c8e0c91602" data-kw="">
<blockquote><p>1. I see not how all these arguments [of Thomas Hooker] taken from moral commandments, do not oblige son as well as father, servant as master, all are Christ’s freemen, son or servant, so as they are to obey what ever Christ commands, Mt. 18:10, and with the Spouse to seek Christ in the fullest measure and in all his ordinances; and son and servant are to know their own heart, so as they have need of all Christ’s ordinances, and are no more to remain in a congregation where their souls are famished because fathers and masters neglect to remove to other congregations where their souls may be fed in the fullest measure; [If the sinful exercise of an authority over us releases us from God’s commandment] then the apostles Acts 4:29 &amp; 5:29 were to preach no more in the name of Jesus, because the rulers commanded them to preach no more in his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (London, 1644), pt. 1, ch. 4, section 4, question 5, p. 71</span></figcaption>

</figure><figure class="quote" id="q-e15e1b5f18" data-kw="">
<blockquote><p>VIII. The occasion of a scandal which is only passive should be removed, if it be not some necessary thing, and we are not only to shun that which gives scandal, but also that whereupon follows a scandal taken, whatsoever it be, if it be not necessary. This is so evident, that Papists themselves subscribe to it, for both Cardinal Cajetan and Dominicus Bannes say that we should abstain even spiritualibus non necessariis [non-necessary spiritual things] when scandal rises out of them. … XII. We ought for the scandal of the malicious to abstain from all things from which we ought to abstain for the scandal of the weak; for we ought not to abstain from necessary things for the scandal of the weak no more than for the scandal of the malicious; and from things that are not necessary, we ought to abstain for the scandal of the malicious as well as for the scandal of the weak.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 2, ch. 8, p. 32-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

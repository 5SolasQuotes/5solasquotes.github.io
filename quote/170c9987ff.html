<main class="wrap"><figure class="quote" id="q-170c9987ff" data-kw="">
<blockquote><p>It is possible that I shall not be an eyewitness to it in the flesh, but I believe He cometh quickly who will remove our darkness, and shine gloriously in the Isle of Britain, as a crowned King, either in a formally sworn covenant, or in His own glorious way, which I leave to the determination of His infinite wisdom and goodness. And this is the hope and confidence of a dying man, who is longing and fainting for the salvation of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters of Samuel Rutherford</cite>, (Edinburgh: Anderson &amp; Ferrier, 1894), Letter 363, to Robert Campbell, pp. 703-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-25a73203b7" data-kw="">
<blockquote><p>But I pray you what do people get when wars for recoveries of dubious rights are long and calamitous? What are the people of France or the people of Spain better for the long and hereditary anger of their two kings? Or what was the world better for Alexander’s conquering it? The [English Parliament] Houses which are burnt and the millions of bodies left dead in the field are the peoples; and princes scorning to derive from them [the people] still trample them to dung.</p></blockquote>

</figure><figure class="quote" id="q-c467d0fb58" data-kw="">
<blockquote><p>It is the duty of people to pray for magistrates, to pay them tribute and other dues, and to be subject to their authority for conscience sake: infidelity, or difference in religion, doth not make void the magistrate’s just and legal authority?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Evil, Nature &amp; Danger of Schism: a Sermon’</cite>, (1708): | As to the [Westminster] Confession of Faith, | 1. How does their refusing to pray for the queen, to pay her cess [tax], and to own her authority, because she is not a covenanted queen, agree with the Confession of Faith, chap. 23, § 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-67937c6a69" data-kw="">
<blockquote><p>In regard of the justness and necessity of some things which may be the subject or matter of the usurpers’ command and the arbitrariness of others, and the lawfulness of either, not depending upon the command or warrant of a superior, but resulting out of the nature of the action itself; so that a private man might do it, were there no magistrate to command it, or no command from the magistrate for it. We must needs grant there are things which may be done upon the usurpers’ command or injunction (though not because or by virtue of it) for the command of him that unwarrantably assumes power cannot, by itself, make that unlawful which were lawful if that were not. For instance, the performance of acts of common equity, charity, order, public utility and self-preservation is requisite: suppose it be in concurrence with a usurpers’ command, and in thus doing we do materially, but not formally obey him; the ground of acting in such things being not at all any relation or principle of subjection to him, but conscience of obedience to the will of God and due respect to others and our own safety and good. Under this sort of actions I comprehend: 1. Taking up arms for the preservation of ourselves and the country against a common enemy, upon the usurpers’ summons; the which we might do of ourselves, were there no authority; or if a just authority were in being, yet if it could not, or did not, maturely enough call us forth to it. 2. Payment of taxes and bearing other impositions for the usurping power, where, and while we are under his compulsive power, because such contributions may, and will be taken whether I will pay them or not; and I yield them under his enforcement, as a ransom for my life, or liberty, or somewhat else that is better to me than the payment; and consequently I am to choose the parting with it as the less evil, rather than with that which is better, which to loose is to incur a greater evil for the avoidance of a less… 3. Complaining, petitioning or going to law before the magistrates or courts authorized by the usurpers provided you give not the usurpers to whom you petition such titles as you give to the lawful magistrate). (“…excusantur à peccato inducendi tyrannum ad actum, et opus illicitum petentes ab illo iustitiam, quia non petunt actum illicitum, sed justitiam illius actus illiciti… pie interpretandae sunt petitiones tam iustitiae quam honestae gratiae quae offeruntur tyrannis, s. si vis, seu ex quo vis detinere, et exercere hoc dominium, utere illo iuste, utere honeste, utere pie, utere ad utilitatem publicam, et privatorum, prout deceret dominium… nec intendunt, nec petunt actum usurpatum, sed qualitatem sanctam inactu usurpato exercendo.” Cajetan, Summula [Venice: Carampellum, 1596], title: Rempublicam tyrannice occupare… [pp. 411-12]) In thus doing, I seek my necessary self-preservation; neither do I yield or ascribe to them to whom I have recourse any just power of judicature or participate in their sin of usurping it; only I acknowledge they have might and ability in their hand to right me; which, though they ought not to assume, yet I may take the benefit of their unjust use of it; as a poor man may receive relief at the hands of him that has gotten those goods he distributes unjustly; and I may receive my money, with a good conscience, from the hands of a thief that is willing to return it to me though he took it by robbery from another thief that robbed me of it; and if the party, with whom I have a controversy for my right will agree to refer the matter betwixt us to a private person as an arbitrator, and stand to his arbitrement; that is a lawful means of coming by my own, though by his help and award that has not claim of authority over me… But, in granting liberty of concurrence with some commands of an usurped authority, we neither yield any obedience at all to be due, or performable to it; nor can we allow a correspondence with it in diverse things, and therefore we are to put a difference: First, betwixt things that are in themselves necessary, and those that are of a middle or an indifferent nature in themselves considered… 2. Betwixt moral, or prudential acts competible [competent] to private men or subjects, and political acts or judicial proceedings that flow from power and authority inherent in the person that acts them, or are the issues of distributive justice, and either come forth from a person clothed with government, or unto which is requisite a stamp of authority to make them lawful, and justifiable: as to bear the office of a magistrate, or commander in civil or military affairs, or to be any under agent, or servant in carrying on, or assisting the government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered</cite>, An Exercitation concerning Usurped Powers: wherein the Difference betwixt Civil Authority &amp; Usurpation is Stated. That the obedience due to lawful magistrates, is not owing, or payable, to usurped powers, is maintained. The obligation of oaths and other sanctions to the former, notwithstanding the antipolity of the latter is asserted. And the arguments urged on the contrary part in diverse late printed discourses are answered… (London, 1650) 88 pp. ToC, pp. 22-25</span></figcaption>

f+at+the+hands+of+him+that+has+gotten+those+goods+he+distributes+unjustly%3B+and+I+may+receive+my+money%2C+with+a+good+conscience%2C+from+the+hands+of+a+thief+that+is+willing+to+return+it+to+me+though+he+took+it+by+robbery+from+another+thief+that+robbed+me+of+it%3B+and+if+the+party%2C+with+whom+I+have+a+controversy+for+my+right+will+agree+to+refer+the+matter+betwixt+us+to+a+private+person+as+an+arbitrator%2C+and+stand+to+his+arbitrement%3B+that+is+a+lawful+means+of+coming+by+my+own%2C+though+by+his+help+and+award+that+has+not+claim+of+authority+over+me%E2%80%A6+But%2C+in+granting+liberty+of+concurrence+with+some+commands+of+an+usurped+authority%2C+we+neither+yield+any+obedience+at+all+to+be+due%2C+or+performable+to+it%3B+nor+can+we+allow+a+correspondence+with+it+in+diverse+things%2C+and+therefore+we+are+to+put+a+difference%3A+First%2C+betwixt+things+that+are+in+themselves+necessary%2C+and+those+that+are+of+a+middle+or+an+indifferent+nature+in+themselves+considered%E2%80%A6+2.+Betwixt+moral%2C+or+prudential+acts+competible+%5Bcompetent%5D+to+private+men+or+subjects%2C+and+political+acts+or+judicial+proceedings+that+flow+from+power+and+authority+inherent+in+the+person+that+acts+them%2C+or+are+the+issues+of+distributive+justice%2C+and+either+come+forth+from+a+person+clothed+with+government%2C+or+unto+which+is+requisite+a+stamp+of+authority+to+make+them+lawful%2C+and+justifiable%3A+as+to+bear+the+office+of+a+magistrate%2C+or+commander+in+civil+or+military+affairs%2C+or+to+be+any+under+agent%2C+or+servant+in+carrying+on%2C+or+assisting+the+government.%E2%80%9D%0A%0A%E2%80%94+Edward+Gee%2C+An+Exercitation+concerning+Usurped+Powers%3A+wherein+the+Difference+betwixt+Civil+Authority+%26+Usurpation+is+Stated.+That+the+obedience+due+to+lawful+magistrates%2C+is+not+owing%2C+or+payable%2C+to+usurped+powers%2C+is+maintained.+The+obligation+of+oaths+and+other+sanctions+to+the+former%2C+notwithstanding+the+antipolity+of+the+latter+is+asserted.+And+the+arguments+urged+on+the+contrary+part+in+diverse+late+printed+discourses+are+answered%E2%80%A6+%28London%2C+1650%29+88+pp.+ToC%2C+pp.+22-25&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67937c6a69.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67937c6a69.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-ethics-of-usurped-powers/#:~:text=In%20regard%20of%20the%20justness%20and,carrying%20on%2C%20or%20assisting%20the%20government&amp;text=In%20regard%20of%20the%20justness%20and%20necessity%20of&amp;text=servant%20in%20carrying%20on%2C%20or%20assisting%20the%20government" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…and came with his family to Broad Oak… and did not preach for a great while… expecting that God would yet open a door of return to former public liberty, which he much desired and prayed for; and in hopes of that, was backward to fall into the stated exercise of his ministry otherwise, as were all the sober nonconformists generally in those parts, but it was his grief and burden that he had not an opportunity of doing more for God. He has scarce one talent of opportunity, but that one he was very diligent and faithful in the improvement of… ‘I own myself a minister of Christ, yet do nothing as a minister. What will excuse me? Is it enough for me to say, ‘Behold I stand in the market-place, and no man has hired me?’ And he comforts himself with this appeal; ‘Lord, Thou knowest what will I have to thy work, public or private, if I had a call and opportunity. And shall this willing mind be accepted?’… In these circumstances of silence and restraint… It is obvious, he writes, to observe at four several times, and upon four several occasions, ministers have been silenced and turned out of their places; and yet still, after a time, more or less restored again. 1. In Queen Mary’s days, because they would not close with Popery at the return of it. But that interdict lasted under five years, being taken off upon Queen Elizabeth’s coming to the throne. 2. In Queen Elizabeth’s, King James’s and King Charles’s days, because they could not conform to the hierarchy and ceremonies; and this interdict lasted long, even till the long Parliament, A.D. 1640; but it was then taken off. 3. Under the long Parliament many ministers were sequestered and silenced for malignancy and not covenanting [under the Solemn League and Covenant, 1643; Philip Henry did not hold to the SL&amp;C]. 4. Many others, after the King’s death [1649], for not engaging to be true to the Commonwealth [under Oliver Cromwell, 1649-1658], as then established; both which restraints, though much remitted before, yet quite ceased at the coming in of the King [Charles II], A.D. 1660. And now more ministers are silenced, and with more severity than ever, by the Act of August 24 [1662]. And who among us can tell for how long? This only I know, ‘He who hath delivered, doth deliver.’ Script. March 31, 1663.</p></blockquote>

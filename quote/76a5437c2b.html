<main class="wrap"><figure class="quote" id="q-76a5437c2b" data-kw="">
<blockquote><p>We do not deny that there can be in the church a ministerial and secondary judge, who can officially moderate controversies over the faith by the Word of God, but we hold that the Holy Spirit, as its source, teaches us the true interpretation of Scripture where inner assurance is concerned. We deny that any supreme and infallible judge except Scripture need be sought with regard to external proof of the object, much less that the pope, who assumes such a task, is to be accepted. We believe that Scripture alone, or God speaking in it, is enough.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-788f2fe55a" data-kw="Papal infallibility">
<blockquote><p>Thirdly, if Christ asked this for all the Roman pontiffs, that they should be exempt from error, then he did not obtain what he asked. For it is certain that many Roman pontiffs have erred, even when teaching ex cathedra, that is, determining controversies; as Alphonsus asserts, Contra Hæres. Lib. I. c. 4, where he affirms that the pope not only may err, but even be a heretic. The same is written and held by other papists also. Then who, I pray you, will be the supreme judge of the church, when the supreme pontiff hath fallen into heresy? Is he a fit person to be the supreme judge in religion, and one in whose judgment we should acquiesce, who may be, and is a heretic, as the very papists themselves confess? Surely, never. The supreme judge of all controversies must be such a one as can neither err nor prove a heretic: and such is Christ himself, that true High Priest, and the sacred scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 5</span></figcaption>

</figure><figure class="quote" id="q-07abf794c2" data-kw="">
<blockquote><p>Do the papists make a reasonable demand, when they would have us submit ourselves to his judgment, and depend upon his interpretation, whom we accuse as a false interpreter of scripture, yea, whom we affirm to be the very antichrist himself?</p></blockquote>

</figure><figure class="quote" id="q-63559a9ac2" data-kw="Scripture interprets Scripture">
<blockquote><p>Whatever, then, the papists talk so vauntingly of fathers and of councils, yet it is to their ecclesiastical prince, that is to the pope, that all controversies are finally referred, and with that prince and supreme interpreter rests the whole meaning of scripture and the right of adjudicating upon it. But we do not acknowledge that prince, whom Christ never constituted; and we say that the scripture itself publicly set forth and propounded is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Question 5, ch. 7</span></figcaption>

</figure><figure class="quote" id="q-64ef925976" data-kw="infallibility of the church">
<blockquote><p>Man cannot be the infallible interpreter of the Scriptures and judge of controversies because he is liable to error. Our faith cannot be placed in him, but upon God alone from whom depends the sense and meaning of the Scriptures and who is the best interpreter of his own words. … If the rulers of the church are influenced by the Holy Spirit, they do not cease to be men and therefore fallible.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 1, Second Topic, Q. 20, §XI</span></figcaption>

<main class="wrap"><figure class="quote" id="q-84f4da8a14" data-kw="">
<blockquote><p>If yet you see not the pride of these men, I will shew it you in these four particular Evidences, and that so plainly, that if you know the difference between the language of heaven and of hell, you may easily perceive the devil speaking by their mouths.

1. They affirm themselves to be perfect without sin (yea, some of them say they are Christ and God.) And is it possible that any man in this life, that is not mad with spiritual pride, can indeed believe that he hath no sin? what? that he transgresseth no Law? That he doth love God in the highest degree that he is bound to do? That he never hath a thought or word that is sinful, nor sinfully loseth one minute of his time?

Yea, and this when in the eyes and ears of the wisest, they foam out their own shame, as the raging Sea doth cast out the dirt. The devil himself hath either less pride or less ignorance, then to think himself to be perfect without sin; If they have no sin, what need they pray, Forgive us our sins, or what further need have they of the blood of Christ or his Intercession to procure them any further forgiveness? If you can see no pride in this, I fear you are blinded with them to destruction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers catechism, or, The Quakers questioned, their questions answered, and both published for the sake of those of them that have not yet sinned unto death and of those ungrounded novices that are most in danger of their seduction</cite>, (London: Thomas Underhill and Francis Tyton, 1655), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

<blockquote><p>3. He [the Arminian Conrad Vorstius] first says that ‘Scripture does not call God infinite.’ This is false. For Scripture thus says in Psalm 144:3: “Great is the Lord, exceedingly praiseworthy, whose magnitude has no end.” And Baruch 3:25: “It is great and has no bounds, immeasurable and highly-exalted.” These witnesses are not able to be interpreted as about magnitude of mass or quantity, which is not in God. But [it must be interpreted] as respecting his magnitude of perfection or virtue. Therefore, this is the sense: God is so great in virtue and perfection that he does not have an end or terminus of his virtue and perfection. From this, I reason thus: just as the end in virtue and perfection is that which has an end or terminus of its virtue and perfection, so on the opposite side, an infinite in virtue and perfection is that which does not have an end or terminus of its virtue and perfection. But God does not have an end or terminus of his virtue and perfection. Therefore, he is infinite in virtue and perfection. What shall Vorstius say at this point? The major premise is per se known by implication. The minor premise is openly expressed in Scripture. The conclusion is legitimately inferred.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-becanus.html">Martin Becanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae Scolasticae</cite>, (d. 1624; Leiden, 1683), First Tract on God &amp; the Divine Attributes, ch. 5, ‘Infinity of God’, pt. 1 tr. Michael Lynch Becanus is a Romanist.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sanctification/nature-of-sanctification.html">Nature of Sanctification</a></span></div>

</figure><figure class="quote" id="q-f12b10fe99" data-kw="">
<blockquote><p>There is no imagination wherewith man is besotted, more foolish, none so pernicious, as this, — that persons not purified, not sanctified, not made holy in their life, should afterwards be taken into that state of blessedness which consists in the enjoyment of God. Neither can such persons enjoy God, nor would God be a reward to them. — Holiness indeed is perfected in heaven: but the beginning of it is invariably confined to this world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Holy Spirit, p. 575 (Goold edition)</span></figcaption>

<blockquote><p>Our consent [with Romanists on the state of perfection] I will set down in two conclusions: I. All true believers have a state of true perfection in this life: Mt. 5:48, ‘Be you perfect as your father in heaven is perfect.’ Gen. 6:9, ‘Noah was a just and perfect man in his time, and walked with God.’ Gen. 17:1, ‘Walk before me and be perfect.’ And sundry kings of Judah are said to walk uprightly before God with a perfect heart, as David, Josiah, Hezekiah, etc. And Paul accounts himself with the rest of the faithfull to be perfect, saying, ‘Let us all that are perfect be thus minded.’ Phil. 3:15. Now this perfection has two parts: The first is the imputation of Christ’s perfect obedience, which is the ground and fountain of all our perfection whatsoever. Heb. 10:14, ‘By one offering,’ that is, by his obedience in his death and passion, ‘has He consecrated, or made perfect, forever them that believe.’ The second part of Christian perfection is sincerity, or uprightness, standing in two things: The first is to acknowledge our imperfection and unworthiness in respect of ourselves: and hereupon, though Paul had said he was perfect, yet he adds further that he did account of himself, not as though he had attained to perfection: but did forget the good things behind, and endeavored himself to that which was before. Here therefore it must be remembered that the perfection whereof I speak may stand with sundry wants and imperfections. It is said of Asa that his heart was perfect with God all his days, and yet he pulled not down the high places, and being diseased in his feet, he put his trust in the physicians and not in the Lord. Secondly this uprightness stands in a constant purpose, endeavor and care to keep not some few, but all and every commandment of the Law of God, as David says, Ps. 119:6, ‘Then shall I not be confounded, when I have respect to all thy commandments.’ And this endeavor is a fruit of perfection, in that it proceeds from a man regenerate. For, as all men through Adam’s Fall, have in them by nature the seeds of all sin, none excepted, no not the sin against the Holy Ghost: so by grace of regeneration through Christ, all the faithful have in them likewise the seeds of all virtues needfull to salvation: and hereupon they both can and do endeavor to yield perfect obedience unto God, according to the whole law. And they may be termed ‘perfect,’ as a child is called a perfect man: though it want [lack] perfection of age and stature and reason: yet has it perfection of parts: because it has all and every part and faculty both of body and soul that is required to a perfect man.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, … ([Cambridge] 1598), ch. 13. ‘Of the State of Perfection’, pp. 980-81</span></figcaption>

+in+the+physicians+and+not+in+the+Lord.+Secondly+this+uprightness+stands+in+a+constant+purpose%2C+endeavor+and+care+to+keep+not+some+few%2C+but+all+and+every+commandment+of+the+Law+of+God%2C+as+David+says%2C+Ps.+119%3A6%2C+%E2%80%98Then+shall+I+not+be+confounded%2C+when+I+have+respect+to+all+thy+commandments.%E2%80%99+And+this+endeavor+is+a+fruit+of+perfection%2C+in+that+it+proceeds+from+a+man+regenerate.+For%2C+as+all+men+through+Adam%E2%80%99s+Fall%2C+have+in+them+by+nature+the+seeds+of+all+sin%2C+none+excepted%2C+no+not+the+sin+against+the+Holy+Ghost%3A+so+by+grace+of+regeneration+through+Christ%2C+all+the+faithful+have+in+them+likewise+the+seeds+of+all+virtues+needfull+to+salvation%3A+and+hereupon+they+both+can+and+do+endeavor+to+yield+perfect+obedience+unto+God%2C+according+to+the+whole+law.+And+they+may+be+termed+%E2%80%98perfect%2C%E2%80%99+as+a+child+is+called+a+perfect+man%3A+though+it+want+%5Black%5D+perfection+of+age+and+stature+and+reason%3A+yet+has+it+perfection+of+parts%3A+because+it+has+all+and+every+part+and+faculty+both+of+body+and+soul+that+is+required+to+a+perfect+man.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholic%2C+The+Eleventh+Point%2C+%E2%80%A6+%28%5BCambridge%5D+1598%29%2C+ch.+13.+%E2%80%98Of+the+State+of+Perfection%E2%80%99%2C+pp.+980-81&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fee49ad5efe.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ee49ad5efe.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-perfectionism/#:~:text=Our%20consent%20%5Bwith%20Romanists%20on%20the,is%20required%20to%20a%20perfect%20man&amp;text=Our%20consent%20%5Bwith%20Romanists%20on%20the%20state%20of&amp;text=soul%20that%20is%20required%20to%20a%20perfect%20man" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Sanctification then may be described [as] The grace of God infused into the soul of a sinner, and purifying it by faith… Thirdly, both sanctification and justification are alike owing to faith as their immediate cause, next under God’s Spirit, as may be gathered from the prayer of Christ for his disciples: ‘Sanctify them through thy truth: thy word is truth,’ [Jn. 17:17] that is, the doctrine of Faith, received. To which faith, the effect of sanctification is ascribed by St. Peter in the Acts, whereby the hearts of the gentiles were purified or sanctified. (Acts 15:9 [‘And put no difference between us and them, purifying their hearts by faith.’])</p></blockquote>

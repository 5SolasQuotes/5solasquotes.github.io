<main class="wrap"><figure class="quote" id="q-9b963fadac" data-kw="">
<blockquote><p>In the first place, it will be said, are we not failing to do justice to the true humanity of Jesus, which is affirmed by the creeds of the Church as well as by the modern theologians? When we say that Jesus could not illustrate Christian faith any more than God can be religious, are we not denying to Jesus that religious experience which is a necessary element in true humanity? Must not Jesus, if He be true man, have been more than the object of religious faith; must He not have had a religion of His own? The answer is not far to seek. Certainly Jesus had a religion of His own; His prayer was real prayer, His faith was real religious faith. His relation to His heavenly Father was not merely that of a child to a father; it was that of a man to his God. Certainly Jesus had a religion; without it His humanity would indeed have been but incomplete. Without doubt Jesus had a religion; the fact is of the utmost importance. But it is equally important to observe that religion which Jesus had was not Christianity. Christianity is a way of getting rid of sin, and Jesus was without sin. His religion was a religion of Paradise, not a religion of sinful humanity. It was a religion to which we may perhaps in some sort attain heaven, when the process of our purification is complete (though even then the memory of redemption will never leave us); but certainly it is not a religion with which we can begin. The religion of Jesus was a religion of untroubled sonship; Christianity is a religion of the attainment of sonship by the redeeming work of Christ.</p></blockquote>

</figure><figure class="quote" id="q-1ec541e6ce" data-kw="">
<blockquote><p>Now from gymnastic art those sports will have to be proposed to youth which, besides what they contribute to the health and preservation of the body and the production of graceful movements, also render men fit and ready for military service and the advantageous use of arms. Young men should therefore exercise themselves in running, jumping, wrestling, horseback riding, the handling of all arms and weapons which are used for open and hand-to-hand combat, the arrangement of battle formations, the positioning of camp, and mock battle (Plato, Laws, VII, 803c, 813d-e). To these, nobles may add the exercise of hunting. These exercises which pertain to military science ought to be so constituted and conducted in such a serious manner that they approximate as much as possible the actual operations of war, as Plato has said (Plato, Laws VII, 824 a-c)… according to the words of the psalm: ‘It is God who girds me with strength for war and prepares my path’ (Ps. 18:32). In charge of these sports, as of the kind previously mentioned, there should always be men singularly experienced in the field involved, men of universal wisdom most zealous for all piety and virtue, who are admired and therefore have the authority and power to relate and to adapt all youthful sport to a zeal for and practice of the virtues, which is the one goal of all sports among Christians; for we have been created for the praise of God…</p></blockquote>

</figure><figure class="quote" id="q-4ae08d984d" data-kw="">
<blockquote><p>A perfect being’s love seems to be a pure perfection; therefore it belongs to God and indeed in supreme degree. The proof of the antecedent is: a) if love of this sort were not a pure perfection formally, it could be reduced to one or other pure perfections that were not formally love. But I do not see how such love could be reduced to something that was formally love. b) To love seems to be better than not to love; therefore love seems to be a pure perfection, because it is better than what is incompatible with it (namely not to love). The proof of the antecedent here is: a distinction must be drawn between love of friendship (benevolence) and love of concupiscence. The former is love of an object for its own sake, that is, because of the object’s intrinsic perfection, and this love does not seem to involve imperfection in the lover. Love of concupiscence is love of an object and not for the object’s sake finally but because the object perfects the lover or is a good for the lover. But this love does involve imperfection because the object is wanted precisely because it perfects a lover that is in itself capable of perfection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pt. 3, pp. 100-101 Wolter was a Scotus scholar.</span></figcaption>

<blockquote><p>Even pictures of Jesus can only hinder our understanding of God’s truth. For instance, no true picture of Jesus exists, so the ones artists do make merely reflect the artist’s own image of our Savior rather than what God has sovereignly revealed by his word. An image also cannot truly reflect the deity of Christ, only his humanity, which again serves only to limit our knowledge of Christ Jesus.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e31e9ad7d3" data-kw="Original Sin">
<blockquote><p>Concupiscence, although it is without doubt born in us, is both an evil and sin; for we are not to judge according to nature, but according to the law whether a thing be sin or not. Whatever is opposed to the law is sin, whether it be born in us, or not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus.html">Zacharias Ursinus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Heidelberg Catechism</cite>, Q. 113</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/concupiscence.html">Concupiscence</a> › <a href="../topics/sin/concupiscence/concupiscence-is-truly-sin.html">Concupiscence is truly sin</a></span></div>

</figure><figure class="quote" id="q-8831222c6d" data-kw="">

</figure><figure class="quote" id="q-8c9a5919f4" data-kw="Temptation">
<blockquote><p>First, therefore, we must resist suggestion, or thoughts: which are either ascending, from the tinder of concupiscence, or descending, suggested from elsewhere. The former are not without fault; the latter, even if they are cast in by Satan, but fly past and are not received by you, are not sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Theology</cite>, 2.14</span></figcaption>

</figure><figure class="quote" id="q-faa99bc244" data-kw="">

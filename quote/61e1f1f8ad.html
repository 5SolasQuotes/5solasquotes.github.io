<main class="wrap"><figure class="quote" id="q-61e1f1f8ad" data-kw="">
<blockquote><p>But soon after a new acquaintance provoked me to a deeper study of the whole controversy than I had undertaken before; which left me persuaded that the use of liturgie and ceremonies was lawful in that case of necessity, except the baptismal use of the cross, and the subscription to all things, etc. But in 1640 the oath called ‘Et Caetera’ being offered the ministry, forced me to a yet more searching study of the case of our diocesan prelacy (which else I had never been like to have gainsaid). At a meeting of ministers to debate the case, it fell to Mr. Christopher Cartwright’s lot and mine to be the disputers; and the issue of all (that and my studies) was, that I setled in the approbation of the episcopacy asserted by Ignatius, yea, and Cyprian, but such a dissent from the English frame, as I have given account of in my Disputations of Church Government.</p></blockquote>

<blockquote><p>2. A representative Church may be thought a number sent by a community and elected to give laws absolutely tying, as if believers should say, ‘We resign our faith and conscience to you, to hold good whatever you determine without repeal or trial;’ that is blind faith; that we disclaim: all our rulers’ acts in our assemblies do bind, 1. conditionally, if they be lawful and convenient, 2. matters to be enacted are first to be referred to the congregations and elderships of particular congregations before they be enacted.</p></blockquote>

</figure><figure class="quote" id="q-4307c99bbc" data-kw="">
<blockquote><p>I remember one of our brethren of Scotland, in a discourse tending to the advancing of the presbyterian way, tells us that Dr. Montague, the late worthy bishop of Winchester, asked King James of blessed memory (whose sweet affability the world well knew) how it came about that there were so few heresies and errors of doctrine broached and prosecuted to the public disturbance of the Church of Scotland? Unto which the wise and learned king is said to have returned this answer: ‘That every parish has their pastor ever present with them and watching over them; that the pastor has his elders and deacons sorted with him; that he with them once a week meets at a set time and place for the censure of manners or whatever disorder falls out in the parish; so as he by this means perfectly knows his flock and every aberration of them, either in matter of opinion or practice: And lest any error or heresy may seize upon the pastor; they have their presbyteries, consisting of several shrivalties, which meet together in the chief town or city next to them, every week also once; and have there their exercise of prophesying; after which the moderator of the said meeting asks and gathers the judgements of all the said pastors concerning the doctrine then delivered, or, of any other doubtful point that is then and there propounded; And if the said presbyters be divided in their opinions, then the question is, under an enjoined silence, put over to the next synod, which is held twice a year; unto that all the pastors of that quarter or province duly resort; accompanied with their elders; the moderator of the former synod begins the action; then a new moderator is chosen for the present, or (as it seldom falls out) the last moderator, by voices, continued. Any question of doubt being proposed is either decided by that meeting or (if it cannot be so done) is, with charge of silence, reserved till the national synod or general assembly; which they hold every year once; whither come not the pastors only, but the king himself or his commissioners and some of all orders and degrees sufficiently authorized for the determining of any controversy that shall arise amongst them.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/king-james-i.html">King James I</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as narrated by Joseph Hall, ‘A Modest Offer of some meet Considerations tendered to the Learned Prolocutor and to the rest of the Assembly of Divines met at Westminster’</cite>, (Oxford, 1644), pp. 8-10</span></figcaption>

<blockquote><p>§63. As for the Common Prayer itself, I never rejected it because it was a form, nor thought it simply unlawful because it was such a form, but have made use of it and would do again in the like case. But I must needs say: 1. That the shredding it into such abundance of small parcels seems to me very inconvenient. It seems too light and ludicrous to toss sentences so formally between the priest and clerk, and to make such a multitude of prayers consisting but of a sentence, or two at most: And it seems to be tautology and vain repetition to repeat over the same word so oft: and a taking of God’s name in vain, or too unreverently, to begin with his titles and attributes, and end with his name again, and the merits or sake of Christ, and this at almost every sentence: as if we had done with Him and were taking our leave, and had forgot somewhat that called us to begin again: and thus we begin and end, and begin and end again, it may be twenty times together. 2. But the enforcing imposition of these prayers is most to be condemned, of which I have spoken in the former disputation. But for my part, I censure none that use them, nor take them to be therefore men of another religion or worship: It is but a modal difference in the same worship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship</cite>, (London: R.W., 1659), 5th Disputation, ch. 2, pp. 421-22</span></figcaption>

<div class="actions"><button class="copy" data-copy="“§63. As for the Common Prayer itself, I never rejected it because it was a form, nor thought it simply unlawful because it was such a form, but have made use of it and would do again in the like case. But I must needs say: 1. That the shredding it into such abundance of small parcels seems to me very inconvenient. It seems too light and ludicrous to toss sentences so formally between the priest and clerk, and to make such a multitude of prayers consisting but of a sentence, or two at most: And it seems to be tautology and vain repetition to repeat over the same word so oft: and a taking of God’s name in vain, or too unreverently, to begin with his titles and attributes, and end with his name again, and the merits or sake of Christ, and this at almost every sentence: as if we had done with Him and were taking our leave, and had forgot somewhat that called us to begin again: and thus we begin and end, and begin and end again, it may be twenty times together. 2. But the enforcing imposition of these prayers is most to be condemned, of which I have spoken in the former disputation. But for my part, I censure none that use them, nor take them to be therefore men of another religion or worship: It is but a modal difference in the same worship.”

<main class="wrap"><figure class="quote" id="q-f7b70f3652" data-kw="">
<blockquote><p>Since this is not able to be done without the drawing of Consequences, our AUTHOR [Johannes Marckius] on this occasion contends that Consequences, if they be legitimate and innate, not imported, are lawful, useful, necessary in Theology, and that truths thus drawn out are divinely revealed: he argues this, 1. From the Example of Christ and of the Apostles, which it is lawful for us to imitate according to the measure of knowledge given to us. Thus in Matthew 22:31, 32: But as touching the resurrection of the dead, have ye not read that which was spoken unto you by God, saying, I am the God of Abraham, and the God of Isaac, and the God of Jacob? God is not the God of the dead, but of the living.

In which the principal force of the argument is not in this, that God spoke these words after the death of Abraham, Isaac, and Jacob; for without a future Resurrection God was able to be called also the God of Abraham after his death in this sense, that Abraham while living had acknowledged and worshipped Him, indeed also because after death he was yet living to God according to the spirit: but in this, that God to those, whose God He is, ought to render a reward worthy of Himself, of which sort there is none, except that which is eternal; of which they ought to have full enjoyment according to the spirit and the body equally, since they are equally God’s, and in which two equally they worshipped Him, and which as two essential parts together constitute man: now, the promise, I shall be a God to thee, was not made to the soul of Abraham apart from the rest, but to the whole person consisting of soul and body; hence, if Abraham, Isaac, and Jacob were now after death living to God according to the spirit, they also would live at some point according to the body: see VOETIUS’ Disputationum theologicarum, volume I, page 758; WITSIUS’ Œconomiam Fœderum, book III, chapter II, § 4-16.

Thus Paul from the Resurrection of Christ proves the Resurrection of all believers; and he also confirms the truth of the Resurrection of Christ Himself from various absurdities that otherwise follow, 1 Corinthians 15:12-23. Thus by inference the Apostles were also obliged to prove that Jesus of Nazareth is the true Messiah promised in the Old Testament, since concerning Him nothing αὐτολεξεὶ, in express words, is read in the Old Testament. Neither ought it to be excepted that the authority of Christ and the Apostles is infallible, and that therefore the consequences which they derive are of indubitable truth, but that our consequences are not such.

For, although in themselves, by the authority of the one speaking, the consequences of Christ and the Apostles are infallible; the consequence does not have its force, for example, which consequence the Lord derived in Matthew 22:31, 32 among the Sadducees, from the authority of the one speaking, which authority they were not acknowledging; but from the nature of the things said, and for that reason only was it admitted by them, for it was discerned to have its foundation in the saying of Moses alleged by Christ. And thus always, when the Sacred Scriptures are argued, the force of the Consequence is situated in the natural connection of the Truths set forth and deduced from them.

2. From the commandments to Search, distinct from a simple reading, John 5:39; Daniel 12:4. Now, we search, not when we stick in the skin of the words, but when we attempt to penetrate unto the very marrow and inner sense; and from those things that we read, we also in some way or other understand things which we read not, as Augustine says. Those that neglect this are refuted, Matthew 22:29; Luke 24:25, 26.

3. From the Uses of the Sacred Scripture, which are not able to be obtained without consequences, 2 Timothy 3:16; Romans 15:4. But no thesis shall ever be able to be translated into a hypothesis, neither shall any application of Scripture ever be able to be made available for Uses, either Theoretical or Practical, without consequences brought in.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 29, pp 194-95.</span></figcaption>

<blockquote><p>1. The word ‘church’ [say the Independents] signifies always a gathered together church, or such as may gather together, Acts 11:26, a whole year they assembled with the Church, Acts 20:7, the disciples came together to break bread; so Acts 1:10; 2:44,46; Acts 5:12; 15:25. [Rutherford’s] Answer: [1.] Our brother Mr. [George] Gillespie (Assertion of the Government of the Church of Scotland, pt. 2, ch. 3, p. 141-42) says many interpreters expound [in Greek], ‘they were together’, that is, of one accord in love and amity: and also [physical] churches not being builded, and they meeting in private houses, as in Mary’s house, Acts 12, school of Tyrranus, Acts 19:9, in an upper chamber, Acts 20:8, Paul’s lodging at Rome, Acts 28:13. What private houses (Acts 10:9) could ordinarily contain so many thousands?

2. The Scripture speaks so [as] to give us an example of the public meeting for public worship where it is not needful that all met in one place collectively; it is enough they meet all distributively.

3. Neither does the word ‘church’ always signify a meeting of one single congregation, as Acts 12:5; prayers were made [for Peter in jail] by the church, that is by all professors [throughout Jerusalem]. Herod vexed the church, Acts 8:3. Saul made havoc of the church; ‘I persecuted the Church.’ (1 Cor. 15:9) There is no necessity to expound these of people meeting ordinarily to worship God; for Herod and Saul persecuted all, whither apostles or professors in houses, not respecting their meeting in one place; Also [that] it shall follow that prayers were not made in private, but only in the church, that is, in the convened congregation for Peter, which is absurd: And that they were a visible-church is clear, else Herod and Saul could not persecute them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 7, ‘If there be No True Visible Church in the New Testament, but Only a Congregation Meeting in One Place, &amp; No Presbyterial or Representative Church (as They Call it) at All’, p. 81 Rutherford is arguing against the novel Independent Church government. See also the chapter at large.</span></figcaption>

<blockquote><p>Do we find it difficult to rise as early on that day as during the week, that with the morning we may commence our duties? Let conscience speak, and we shall wake early. Let our love to God, and his service, only be as strong as our attachment to the things of the world, and no more of the Sabbath will be wasted in slumber, than of Monday morning. Men who labour through the week, contend for this indulgence; that they are wearied and need rest: besides, that the Sabbath is given for rest.

But, no reader of the Bible can say, that it is the rest of indolence and spiritual inactivity. The worship of God does not commonly demand the labours and exercise of the body; the mind only is called into healthful action; and this is also refreshing to the body. In answer to the plea, that being worn down with the cares of the week, and its toils, we may, consistently with duty, lie later on Sabbath morning than any other, it may be asked, Have we a right to expend our strength during the week, so as to unfit us for the duties of the Sabbath when they arrive?

If we found ourselves disinclined early to seek the Lord, last Sabbath, are we not bound to guard against such languor, when this holy day shall again dawn? Is not duty plain, that we ought to relax our labours on Saturday, that we may not lose the most precious hours of the Lord’s day? Were we our own, we might exercise our pleasure. But we are not. Man’s chief end is, to glorify God, and enjoy him, in this world, as well as hereafter.

Suppose you hire a man, to labour for you — you have a right to all his time; but you give him five days in the week for his own employment on condition that he will devote himself wholly to your work on the sixth. Has this man a right, so to arrange his business, and expend his strength, during the five days he labours for himself, that when the sixth day arrives, he cannot rise until late, nor commence his work until the morning be nearly past?</p></blockquote>

<blockquote><p>(6.) They that want faith cannot bring forth fruit unto the glory of God. No more than these branches broken down can bear fruit, no more can a man without faith bring forth good fruit unto God. What is that which makes folk like briers and thorns? Whence their profanity, ungodliness, and throwing out oaths for every trifling matter? Is it not owing to their unbelief? And,

(7.) This is the woefulness of their case that want faith, that whatsoever they do is sin. “Whatsoever is not of faith is sin.” Everything that people do is sin, if they believe not. The very work and labour they are about is sin. Their plowing, their eating, their drinking, their walking, their sitting, their sleeping, and all that they do is sin. Their hearing, their reading, their praying is sin. And is not that a deplorable case, to have all that a man doeth looked upon as sin? And so it is with such as are destitute of the grace of faith.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-c071d76d2d" data-kw="">
<blockquote><p>[Margin note:] Which be the principal points of the catholic Faith or religion? Now, because I see some [persons] (not yielding unto these things which we have spoken in general concerning the fundamental or principal points of our religion) again to demand what those should be: I answer: That these articles are to be called grounds or principles, which being laid, the whole building remains: and which being overthrown, all things builded thereupon fall to the ground. And all these things we profess to have been described with great shortness and plainness out of the Word of God in the Creed which they call the Apostles’. Which thing ought to be added to the Ten Commandments and the Lord’s prayer, of the which, that, to wit, the Ten Commandments do very compendiously set out the order of Christian life: and this, that is, the Lord’s Prayer, does very briefly also set out, right invocation and prayer. This (I say) is that fundamental, true and perpetual mark of the catholic Church, which shall never be blotted out unto the world’s end: but which nevertheless ought to be expounded out of the writings of the prophets and apostles, from whence it is taken, that all men may understand it and keep it as much as in them lies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of the True &amp; Visible Marks of the catholic Church</cite>, … (London: 1582), n.p.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ac4752d8cf" data-kw="">
<blockquote><p>We will call then the true and pure Churches all those wherein we find the Word of God and sacraments purely and lawfully administered, that is to say (as Cyprian says) according to the institution of the Lord. And we nothing doubt to communicate with them, and that God is there president, howsoever in some certain points of doctrine there have been some error, and in the outward policy some abuse and corruption, and impurity in manners: for it behooves that always we resort thither, when the chief points of the foundation of our salvation be there truly taught, seeing we are men, and the Churches are compounded of men…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philippe de Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 2, n.p.</span></figcaption>

</figure><figure class="quote" id="q-f8269055c4" data-kw="">
<blockquote><p>Yet with these heretics and schismatics [the Donatists], our Jacobites, Brownists and Barrowsts symbolize; for, as the Donatists refused communion with the catholic Church in regard of some scandals they observed in it, so do these separate from the true Church of England in regard of some abuses, and, as they term them, popish corruptions in it. As they excluded all from hope of salvation who were not of their pure precise sect, so these go not much behind them in their uncharitable censures of all those who are not of their fraternity…</p></blockquote>

</figure><figure class="quote" id="q-7c2cd21a76" data-kw="">
<blockquote><p>First, that the blessed and long sought for union of Protestant Churches may be recommended unto the public prayers of the Church. And secondly, that either an Evangelical correspondency for mutual edification, for healing of breaches, for taking away of scandals and for the advancement of the Gospel of Jesus Christ amongst Protestants should henceforth be entertained with foreign Churches, by those to whom the care of so blessed a work may be with authority referred: Or that his Majesty, with your Honours’ advice and grave counsel, might be moved to call together a general synod of Protestants in due time, for the better setling of weighty matters in the Church, which now trouble not only the consciences of most men, but disturb the tranquility of publick states and divide the Churches one from another to the great hinderance of Christianity, and the dishonour of religion. All which evils by this means may be taken out of the way, and from hence a great blessing of God, and much honour amongst men will redound to this Church and nation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Petition to the Honourable House of Commons</cite>, John Dury, his Petition to the Honourable House of Commons in England, now Assembled in Parliament, (London, 1641) 2 pp.</span></figcaption>

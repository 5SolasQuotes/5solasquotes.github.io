<main class="wrap"><figure class="quote" id="q-63888d76cf" data-kw="">
<blockquote><p>Whether good or bad. That is, whether he did good or evil. Each person will receive according to his deeds, whether good or bad. It is from passages such as this that some American theologians have inferred that the only benefit the believer receives from Christ is the forgiveness of sin, and that being pardoned he is dealt with according to the principles of justice. Others, especially in Germany, have drawn from the same source the conclusion that the doctrine of Paul is that the merit of Christ cleanses only from the sins committed before conversion. If a Jew or Gentile became a Christian, his sins were blotted out, and then he was rewarded or punished, saved or lost, according to his works. The merit of Christ did not bring pardon for sin committed after conversion. This is very much the ancient doctrine that there is no forgiveness for post-baptismal sins. The benefits of Christ’s work, according to many of the ancients, are conveyed to the soul in baptism, but if once forfeited by sin can never be reapplied. This gloomy doctrine, which belonged to the transition period that preceded the full development of theology of the papal church, has been revived by the Roman Catholics of the present day. But according to the Scriptures, the blood of Jesus Christ cleanses from all sin, whether committed before or after baptism or conversion. It is a fountain to which we may come every day for cleansing. He is a priest who lives forever to make intercession for us and who always presents before God the merit of his sacrifice as a perpetual offering, typified by the morning and evening sacrifice under the law. According to the anti-scriptural views mentioned above, when a person first comes to Christ his sins are forgiven, and he then begins afresh under the covenant of works and stands in the same relationship to God as Adam did before the fall. The condition of salvation is to him as it was to our first parent: “Do this and live.” Christ is of no use to him from now on. See Romans 6:14. But in truth, because of the one offering of Christ, by which those who believe are sanctified forever (that is, they are atoned for), God does not impute the penitent believer’s sins to him and condemn him. He is not judged by the law or treated according to its principles, for then no one could be saved. But he is treated as someone for all whose sins—past, present, and future—an infinite satisfaction has been made and who has a perpetual claim to that satisfaction as long as he is united to Christ by faith and the indwelling of his Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 2 Corinthians, ed. Alister McGrath, Crossway Classic Commentaries (Wheaton, IL: Crossway Books, 1995), 2 Co 5:10.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-26c617e229" data-kw="">
<blockquote><p>VII. He calls both [kinds of people] in earnest [serio] and without any deceit. Concerning the elect there is no doubt. As to the reprobate, although they are not called ‘according to his purpose,’ or to salvation, nevertheless they are called in earnest, and salvation is offered them on condition of faith. Nor are they mocked because they have been deprived of the grace of believing. Rather, because they destroyed the original grace of their own accord, and also, by their evil passion, despised the means of grace, God therefore has the right to demand faith from them and uses it no less justly than do other creditors, so that their mouths are closed, they are without excuse, and the justice of God is upheld. Therefore, He does not call them to mock them, but in order to declare and reveal his justice.

VIII. Therefore, common calling is not the basis for any conclusion regarding election, both because common calling is extended to both the reprobate and the elect, and because it is subject to the condition of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Doctrine, pt. 1 in</cite>, ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 20, sect. 7–8, pp. 116-17 Latin: conditione</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-110dec18fb" data-kw="">
<blockquote><p>It’s all the reason in the world that a sinner be drawn to Christ. For Christ is the most rational object that is, He being the wisdom of God. And man is led and taken with reason. Christ is a convincing thing and invincibly binds reason: So the forlorne Son, before he return to his Father, argues… and the wise merchant must discourse, Mt. 13:45-46… So Mt. 9:21, the diseased woman has heart-logic within herself… and the unjust steward cast syllogisms thus… Yea, a fool’s paradise, a wedge of gold, is a strong reason, Prov. 7:21… Faith is the deepest and soundest understanding, the gold, the flower of reason…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, … (London, 1647), p. 280</span></figcaption>

<blockquote><p>The passages in which it is said that God will reward every man according to his works are easily disposed of. For that mode of expression indicates not the cause but the order of sequence. … Hence it appears, that working is not at all opposed to grace, but refers to pursuit, and, therefore, it follows not that believers are the authors of their own salvation, or that it is the result of their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.1</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3889c8ecc7" data-kw="">
<blockquote><p>In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons</cite>, In ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2:108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“In respect of God, our election standeth certain from all eternity… But in respect of ourselves it is uncertain, and therefore we must ‘strive to make the same sure’ by good works, 2 Peter 1:10. These are the ways to come to heaven, though they be not the cause why we should come to heaven; therefore we must keep the way, if ever we mean to come to heaven; for as we are ordained to the end, so are we ordained to the means which bring us to that end.”

— Henry Smith, In ‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2:108">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIn+respect+of+God%2C+our+election+standeth+certain+from+all+eternity%E2%80%A6+But+in+respect+of+ourselves+it+is+uncertain%2C+and+therefore+we+must+%E2%80%98strive+to+make+the+same+sure%E2%80%99+by+good+works%2C+2+Peter+1%3A10.+These+are+the+ways+to+come+to+heaven%2C+though+they+be+not+the+cause+why+we+should+come+to+heaven%3B+therefore+we+must+keep+the+way%2C+if+ever+we+mean+to+come+to+heaven%3B+for+as+we+are+ordained+to+the+end%2C+so+are+we+ordained+to+the+means+which+bring+us+to+that+end.%E2%80%9D%0A%0A%E2%80%94+Henry+Smith%2C+In+%E2%80%98Good+Works+are+the+Way+to+Heaven%E2%80%99+in+The+Lawyer%E2%80%99s+Question%3A+In+Three+Sermons+%281595%29+in+The+Works+of+Henry+Smith%3B+Including+Sermons%2C+Treatises%2C+Prayers%2C+and+Poems%2C+ed.+Thomas+Fuller+%282+vols%2C+Edinburgh%3A+James+Nichol%2C+1866%29%2C+2%3A108&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3889c8ecc7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3889c8ecc7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=In%20respect%20of%20God%2C%20our%20election,which%20bring%20us%20to%20that%20end&amp;text=In%20respect%20of%20God%2C%20our%20election%20standeth%20certain&amp;text=the%20means%20which%20bring%20us%20to%20that%20end" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-6f6fc665e9" data-kw="">
<blockquote><p>The passages in which it is said that God will reward every man according to his works are easily disposed of. For that mode of expression indicates not the cause but the order of sequence. … Hence it appears, that working is not at all opposed to grace, but refers to pursuit, and, therefore, it follows not that believers are the authors of their own salvation, or that it is the result of their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.18.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-good-works.html">Justification and Good Works</a> › <a href="../topics/justification/justification-and-good-works/good-works-fruit-not-ground.html">Good works: fruit, not ground</a></span><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a> › <a href="../topics/good-works/necessity-of-good-works/not-for-justification.html">Not for justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“The passages in which it is said that God will reward every man according to his works are easily disposed of. For that mode of expression indicates not the cause but the order of sequence. … Hence it appears, that working is not at all opposed to grace, but refers to pursuit, and, therefore, it follows not that believers are the authors of their own salvation, or that it is the result of their works.”

— John Calvin, Institutes of the Christian Religion, 3.18.1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe%20passages%20in%20which%20it%20is%20said%20that%20God%20will%20reward%20every%20man%20according%20to%20his%20works%20are%20easily%20disposed%20of.%20For%20that%20mode%20of%20expression%20indicates%20not%20the%20cause%20but%20the%20order%20of%20sequence.%20%E2%80%A6%20Hence%20it%20appears%2C%20that%20working%20is%20not%20at%20all%20opposed%20to%20grace%2C%20but%20refers%20to%20pursuit%2C%20and%2C%20therefore%2C%20it%20follows%20not%20that%20believers%20are%20the%20authors%20of%20their%20own%20salvation%2C%20or%20that%20it%20is%20the%20result%20of%20their%20works.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%203.18.1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f6fc665e9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f6fc665e9.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-94fef87e96" data-kw="">
<blockquote><p>But are not works required in the covenant of grace? Yes. “This is a faithful saying, that those who believe in God, should be careful to maintain good works.” But the covenant of grace does not require works in the same manner as the covenant of works did. In the first covenant, works were required as the condition of life; in the second covenant, they are required only as the signs of life. In the first covenant, works were required as grounds of salvation; in the new covenant, they are required as evidences of our love to God. In the first covenant, they were required to the justification of our persons; in the new covenant, to the manifestation of our grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Body of Divinity, ‘Of Sanctification’</cite>, Question 20, ‘Of the Covenant of Grace’, p. 106 in The Select Works of the Rev. Thomas Watson… (New York, 1855) See also Question 22, ‘Of the Covenant of Works’, p. 90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“But are not works required in the covenant of grace? Yes. “This is a faithful saying, that those who believe in God, should be careful to maintain good works.” But the covenant of grace does not require works in the same manner as the covenant of works did. In the first covenant, works were required as the condition of life; in the second covenant, they are required only as the signs of life. In the first covenant, works were required as grounds of salvation; in the new covenant, they are required as evidences of our love to God. In the first covenant, they were required to the justification of our persons; in the new covenant, to the manifestation of our grace.”

— Thomas Watson, Body of Divinity, Question 20, ‘Of the Covenant of Grace’, p. 106 in The Select Works of the Rev. Thomas Watson… (New York, 1855) See also Question 22, ‘Of the Covenant of Works’, p. 90">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+are+not+works+required+in+the+covenant+of+grace%3F+Yes.+%E2%80%9CThis+is+a+faithful+saying%2C+that+those+who+believe+in+God%2C+should+be+careful+to+maintain+good+works.%E2%80%9D+But+the+covenant+of+grace+does+not+require+works+in+the+same+manner+as+the+covenant+of+works+did.+In+the+first+covenant%2C+works+were+required+as+the+condition+of+life%3B+in+the+second+covenant%2C+they+are+required+only+as+the+signs+of+life.+In+the+first+covenant%2C+works+were+required+as+grounds+of+salvation%3B+in+the+new+covenant%2C+they+are+required+as+evidences+of+our+love+to+God.+In+the+first+covenant%2C+they+were+required+to+the+justification+of+our+persons%3B+in+the+new+covenant%2C+to+the+manifestation+of+our+grace.%E2%80%9D%0A%0A%E2%80%94+Thomas+Watson%2C+Body+of+Divinity%2C+Question+20%2C+%E2%80%98Of+the+Covenant+of+Grace%E2%80%99%2C+p.+106+in+The+Select+Works+of+the+Rev.+Thomas+Watson%E2%80%A6+%28New+York%2C+1855%29+See+also+Question+22%2C+%E2%80%98Of+the+Covenant+of+Works%E2%80%99%2C+p.+90&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F94fef87e96.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/94fef87e96.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=But%20are%20not%20works%20required%20in,to%20the%20manifestation%20of%20our%20grace&amp;text=But%20are%20not%20works%20required%20in%20the%20covenant&amp;text=new%20covenant%2C%20to%20the%20manifestation%20of%20our%20grace" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-da08aaf6da" data-kw="">
<blockquote><p>Many things are necessary to us either as causes, or as conditions, or as means, as instruments, as helps, as props, by which we may be brought to eternal life: by which either the bars and impediments may be taken away, which block up to us the way and passage to eternal life, or the necessary stairs are laid under, for our ascending to the height of that sublimity; or else necessary strength is afforded us to go that hard journey, and bear that hard conflict; or that the strength and force of our enemies may be broken and foiled. We have need of knowledge, constancy, charity, sanctity, prayers, good works, etc. But above all these we must seek faith as a certain epitome and compendium of them all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-boyd.html">Robert Boyd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, ch. 4, vv. 12-13, p. 521 trans. Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 10, sect. 3, p. 410</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

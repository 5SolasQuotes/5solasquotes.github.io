<main class="wrap"><figure class="quote" id="q-db6052ad2e" data-kw="">
<blockquote><p>What then is your opinion of liberum arbitrium [free will] in the state of man before conversion? That it is thoroughly bad. The soul, it is true, with its faculties of knowledge (intellectus) and will has remained intact as an essence. But the powers of these faculties for spiritual good have been completely lost…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Theology, 1602, XVIII, 4, as quoted in Heinrich Heppe, Reformed Dogmatics, p. 362. Bucanus’s Institutes was one of the first reformed systematic theologies.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0e41903d87" data-kw="">
<blockquote><p>The sum of all is this, that the determination or predetermination of Divine concurse to this or that act does not make the negation of that act, or a contrary act, a simple or most strictly natural impossibility, as some would persuade us, but only infers a necessity of the consequence, the will having still, in sensu diviso [in a divided sense], i. e. on supposition of the withdrawment of Divine concurse, an habitual indifference to act or not to act, though, in sensu composito [in a combined sense], as predetermined by Divine concurse, it cannot but act. Or summarily thus: The will has at that very time, when it is predetermined by God to this or that act, an habitual power or radical indifference to the negation of that act, or to the putting forth a contrary act: So that Divine predetermination excludes only a contrary act, not the radical power to that act.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination, wherein the Nature of Divine Predetermination is fully explicated &amp; demonstrated, both in the general, as also more particularly, as to the substrate mater or entitative act of sin (1678) 217 pp.</cite>, pp. 16-17</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>
<div class="actions"><button class="copy" data-copy="“The sum of all is this, that the determination or predetermination of Divine concurse to this or that act does not make the negation of that act, or a contrary act, a simple or most strictly natural impossibility, as some would persuade us, but only infers a necessity of the consequence, the will having still, in sensu diviso [in a divided sense], i. e. on supposition of the withdrawment of Divine concurse, an habitual indifference to act or not to act, though, in sensu composito [in a combined sense], as predetermined by Divine concurse, it cannot but act. Or summarily thus: The will has at that very time, when it is predetermined by God to this or that act, an habitual power or radical indifference to the negation of that act, or to the putting forth a contrary act: So that Divine predetermination excludes only a contrary act, not the radical power to that act.”

</figure><figure class="quote" id="q-a1a48e9131" data-kw="">
<blockquote><p>Holding the distinction of natural and moral ability and inability, decides nothing in this behalf, because these terms are used by different men in different senses. Some mean by natural ability, plenary [complete] ability, in the full Pelagian sense; others mean, a partial, or gracious; an Arminian, or Semi-Pelagian ability. The orthodox, however, use it, if at all, simply to denote the natural faculties of understanding, desire, and will, which are essential to moral agency and responsibility, and belong to man, as such, whether unfallen, fallen, or renewed by grace. So, by moral inability, the former class [of Pelagians and Arminians] mean merely an aversion or unwillingness which the sinner can remove by his own will. The old Calvinists mean by moral inability, that indeed which characterizes fallen man; but still that which is real, which the subject of it cannot, while the Almighty power of God can, remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lyman-atwater.html">Lyman Atwater</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Witherspoon’s Theology’, The Biblical Repertory &amp; Princeton Review (1863)</cite>, pp. 598-99</span></figcaption>

</figure><figure class="quote" id="q-4e8cb2b806" data-kw="">
<blockquote><p>…we can distinguish between natural passive potency and supernatural or obediential passive potency. A natural passive potency points to an outcome that can be realized given only a thing’s natural capacities, and can be actualized by some agent that is itself a mixture of active and passive potency. A supernatural or obediential potency points to an outcome that cannot be realized given only a thing’s natural capacities, and requires as an agent a purely actual divine cause. In human beings, potencies for eating, sleeping, walking, talking, thinking, willing, writing poems or doing science, and even coming to know the truths of natural theology and natural law are for the Scholastic all natural potencies; whereas the capacity to attain the Beatific Vision is an obediential potency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scholastic Metaphysics (Editiones Scholasticae, 2014), 1.1.3, ‘Divisions of act and potency’</cite>, p. 44</span></figcaption>

</figure><figure class="quote" id="q-91d458e168" data-kw="">
<blockquote><p>Be it so that God rewards the right use of natural things with an increase of natural goods, but not with the collation of supernatural ones. For this would be “to cross over into another kind” (metabainein eis to allo genos). For it is as if someone said that God promised good health to one who makes good use of honors. It is certain that the natural does not have an order of causality to the supernatural, because they are distant by a whole kind; nor can the seed of nature ever rise into the fruit of grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658)</cite>, p. 57</span></figcaption>

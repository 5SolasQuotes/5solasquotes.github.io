<main class="wrap"><figure class="quote" id="q-23bb04dd79" data-kw="">
<blockquote><p>For, from everlasting, nothing was extant to cause them of things possible to become future, but God himself: and in God himself, nothing can be imagined to be the cause hereof, but the will of God. This is the insoluble demonstration that cuts the throat of Scientia media, whereupon the Jesuits and Arminians, and all that oppose the absoluteness of God’s proceedings, do, and must rely; either wittingly or unwittingly, and whether they will or no; unless they will directly turn Atheists, and with Cicero deny that God fore-knows things that are to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of Mr. Cotton’s, Clearing certain doubts concerning predestination. Together with an examination thereof</cite>, (London: Andrew Crook, 1646), p. 69.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dd70aeaad2" data-kw="scientia media">
<blockquote><p>Besides these two species of divine knowledge, a third was devised by the Jesuits, Fonseca, Lessius, Molina, which they called “middle knowledge.” Is there a middle knowledge in God between the natural and the free? We deny against the Jesuits, Socinians and Remonstrants. The free knowledge depends upon his will and decree by which things pass from a state of possibility to a state of futurition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 3.13.1–2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a> › <a href="../topics/attributes-of-god/knowledge-and-wisdom/middle-knowledge-scientia-media.html">Middle knowledge (scientia media)</a></span></div>
<div class="actions"><button class="copy" data-copy="“Besides these two species of divine knowledge, a third was devised by the Jesuits, Fonseca, Lessius, Molina, which they called “middle knowledge.” Is there a middle knowledge in God between the natural and the free? We deny against the Jesuits, Socinians and Remonstrants. The free knowledge depends upon his will and decree by which things pass from a state of possibility to a state of futurition.”

— Francis Turretin, Institutes of Elenctic Theology, 3.13.1–2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBesides%20these%20two%20species%20of%20divine%20knowledge%2C%20a%20third%20was%20devised%20by%20the%20Jesuits%2C%20Fonseca%2C%20Lessius%2C%20Molina%2C%20which%20they%20called%20%E2%80%9Cmiddle%20knowledge.%E2%80%9D%20Is%20there%20a%20middle%20knowledge%20in%20God%20between%20the%20natural%20and%20the%20free%3F%20We%20deny%20against%20the%20Jesuits%2C%20Socinians%20and%20Remonstrants.%20The%20free%20knowledge%20depends%20upon%20his%20will%20and%20decree%20by%20which%20things%20pass%20from%20a%20state%20of%20possibility%20to%20a%20state%20of%20futurition.%E2%80%9D%0A%0A%E2%80%94%20Francis%20Turretin%2C%20Institutes%20of%20Elenctic%20Theology%2C%203.13.1%E2%80%932&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdd70aeaad2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dd70aeaad2.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-ff0bb50d01" data-kw="">
<blockquote><p>Furthermore, one ought to know that the Arminians have fabricated a third category in the divine knowledge; they call this knowledge middle or conditioned knowledge according to which God knows a certain event He has never decreed. But this is absurd. Because nothing happens what God did not decree, Thr 3,37 [Lam. 3:37].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ed. van Asselt, Bell, van den Brink, Ferwerda, Scholastic Discourse: Johannes Maccovius (1588–1644) on Theological and Philosophical Distinctions and Rules (Apeldoorn, 2009), ch. 4, ‘On God’, p. 119</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>
<div class="actions"><button class="copy" data-copy="“Furthermore, one ought to know that the Arminians have fabricated a third category in the divine knowledge; they call this knowledge middle or conditioned knowledge according to which God knows a certain event He has never decreed. But this is absurd. Because nothing happens what God did not decree, Thr 3,37 [Lam. 3:37].”

— Johannes Maccovius, Other citations (work not named), ed. van Asselt, Bell, van den Brink, Ferwerda, Scholastic Discourse: Johannes Maccovius (1588–1644) on Theological and Philosophical Distinctions and Rules (Apeldoorn, 2009), ch. 4, ‘On God’, p. 119">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFurthermore%2C+one+ought+to+know+that+the+Arminians+have+fabricated+a+third+category+in+the+divine+knowledge%3B+they+call+this+knowledge+middle+or+conditioned+knowledge+according+to+which+God+knows+a+certain+event+He+has+never+decreed.+But+this+is+absurd.+Because+nothing+happens+what+God+did+not+decree%2C+Thr+3%2C37+%5BLam.+3%3A37%5D.%E2%80%9D%0A%0A%E2%80%94+Johannes+Maccovius%2C+Other+citations+%28work+not+named%29%2C+ed.+van+Asselt%2C+Bell%2C+van+den+Brink%2C+Ferwerda%2C+Scholastic+Discourse%3A+Johannes+Maccovius+%281588%E2%80%931644%29+on+Theological+and+Philosophical+Distinctions+and+Rules+%28Apeldoorn%2C+2009%29%2C+ch.+4%2C+%E2%80%98On+God%E2%80%99%2C+p.+119&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fff0bb50d01.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ff0bb50d01.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/middle-knowledge/#:~:text=Furthermore%2C%20one%20ought%20to%20know%20that,not%20decree%2C%20Thr%203%2C37%20%5BLam.%203%3A37&amp;text=Furthermore%2C%20one%20ought%20to%20know%20that%20the%20Arminians&amp;text=God%20did%20not%20decree%2C%20Thr%203%2C37%20%5BLam.%203%3A37" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-83f590c74d" data-kw="">
<blockquote><p>Thine, O Lord is the greatness, and the power, and the glory, and the victory, and the majesty: for all that is in the heaven and in the earth is thine; thine is the kingdom, O Lord, and thou art exalted as head above all. Both riches and honour come of thee, and thou reignest over all; and in thine hand is power and might; and in thine hand it is to make great, and to give strength unto all… But who am I, and what is my people, that we should be able to offer so willingly after this sort? for all things come of thee, and of thine own have we given thee… O Lord our God, all this store that we have prepared to build thee an house for thine holy name cometh of thine hand, and is all thine own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1 Chron. 29:11-12, 14, 16</cite></span></figcaption>

</figure><figure class="quote" id="q-7399b051a7" data-kw="">
<blockquote><p>Of course, some Reformed teachers, e.g., Gomarus, Walaeus, Ludwig Crocius, assumed a ‘conditioned or middle knowledge’ on God’s part which was related to a ‘conditional proposition as to its object’ (as Heidegger Corp. Theol. III, 22 remarks) ‘in respect of bad actions, in which divine providence concurs not effectively but permissively and on the supposition of a conditional or permissive decree’. Alsted too (97) says that ‘there is a middle knowledge, by which He knows that if this exists that will exist.’ For the rest the distinction of a scientia media was decisively rejected by all dogmaticians.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-heppe.html">Heinrich Heppe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics rev. Ernst Bizer</cite>, ed. Ernst Bizer (1950; Eugene, OR: Wipf &amp; Stock, 2007), ch. 5, ‘The Attributes of God’, sect. 17, p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/knowledge-and-wisdom.html">Knowledge and Wisdom</a></span></div>

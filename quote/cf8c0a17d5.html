<main class="wrap"><figure class="quote" id="q-cf8c0a17d5" data-kw="">
<blockquote><p>The heart is the thing He chiefly calls for, expects, and eyes in all our performances… When we pray unto Him, praise Him, sing Psalms (2 Chron. 7:14; Isa. 26:9; Ps. 9:1; Col. 3:16; 1 Chron. 30:19), let’s do it with the heart. When we read or hear his Word, receive the Sacrament, or celebrate any other ordinance; let’s do it with the heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-wilson.html">John Wilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cultus Evangelicus, or, A Brief Discourse concerning the Spirituality and Simplicity of New-Testament Worship</cite>, (London, 1667), pp. 78-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0fa7d1695a" data-kw="">
<blockquote><p>…you say we ‘are not bound, or rather have no warrant to use the Psalms in meter or with tunes.’ To this I answer, that we are bound to sing is evident, both from Scripture-precept and example; and that we are thereby warranted to have the Psalms in meter with tunes is as clear, as both are necessary, at least convenient in the propriety of our language, for the use of singing: I deny not, but prose may be sung; but seeing it is certain that our language has no such exact prosody, as either to render it easily measurable, or the measures distinguishable by points and accents; nay that the import of the music or tonici accentus, in the Hebrew, qui olim moderabantur harmoniam musicam, is so far now lost and unknown, that if we were now to sing the Hebrew Psalms, we could not make use of them: Pray, Sir, leave us but the way of meter in place of points and accents until you teach us better grammar: whereas you hint, that we ‘may have all David‘s instruments as well as tunes’, if you could learn us to sing without tunes, as we may well do without organs, I shall not contend, but seeing that David did, no doubt, invent and introduce these his instruments, as well by the special direction of the Spirit, as he did all other things anent the service of the Temple, and that the Primitive Christians, worshipping more in the simplicity of the Spirit than in outward shows, canebant assâ voce non […], I think you may now put up your pipes and spare the cost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered, pp. 277-278. MacWard was the protege of Samuel Rutherford.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-90109a807c" data-kw="">
<blockquote><p>After his [Saul’s] death, the crown was set upon David‘s head. Whose constant pious life, and holy devotions (in Hymns, Psalms, and Spiritual Songs) are left, as the best patterns, directions, and encouragements to all posterity. And we are sure enough, that he himself, after his own use of them (to shew the difference betwixt His end, and Saul‘s) was happily assured to be one of the Heavenly Quire above, and there Crowned again with an immortal Crown of Glory. David is an ancient Pattern, a Royal Prophet, and Grand Guide to such, as are willing to fight the Battles of the Lord, in their Pilgrimage towards the true Land of Promise…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-stokes.html">David Stokes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Verus Christianus</cite>, [The True Christian], or, Directions for Private Devotions and Retirements… (Oxford, 1668), ‘A Transition to What Follows in the Appendix’, no page number. Stokes (1591?-1669) was an educated Anglican.</span></figcaption>

</figure><figure class="quote" id="q-8ed0f09344" data-kw="">
<blockquote><p>Until the Civil War the various Presbyterian bodies used psalms predominantly, singing hymns only now and then, especially in informal gatherings. Their songbook, Psalms and Hymns, had a clearly defined psalter section. After the Civil War the use of hymns increased greatly. In the Presbyterian Hymnal published in 1874 by the northern branch of the church, psalms were mixed in with hymns. The 1901 Psalms and Hymns of the southern church followed suit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/various.html">Various</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘We Used to Sing Only Psalms — What Happened?’</cite>, (1987)</span></figcaption>

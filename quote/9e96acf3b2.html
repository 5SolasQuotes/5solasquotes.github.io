<main class="wrap"><figure class="quote" id="q-9e96acf3b2" data-kw="">
<blockquote><p>‘And it shall come to pass, that as the Lord rejoiced over you.’ The wonderful and inestimable love of God towards his people is here set forth, via, that He had rejoiced in heaping blessings upon them; wherefore their depravity was all the more base and intolerable, in that God, though voluntarily disposed to be bountiful, was obliged by it to lay aside His affection for them. But although it is only by a metaphor that God is said to rejoice in destroying the wicked, yet it is not without good reason that this expression is applied to Him; that we may know that He can no more fail to be the defender of His Law, and the Avenger of its contempt, than deny Himself. He complains, indeed, by Isaiah, (Isa. 10:24) that He is unwillingly forced to punish the Jews; but these two things are quite consistent, that He rejoices in His just judgment and at the same time is mindful of His clemency and indulgence, so that He would rather pardon, if the wickedness of men would allow Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Deuteronomy 28, verse 63</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed3d48e38e" data-kw="">
<blockquote><p>3rdly, Some natural good wishes for his welfare are implied in this love [to the rich young ruler]. There is in every wise and good man a hearty desire of the happiness of his fellow-creatures; he loves them all in this sense, even the foolish and the wicked. Human nature that has any goodness in it, is ready to wish well to any person, though he be an utter stranger and unknown, especially if he has some agreeable qualities. There may be an innocent inclination to see all men happy, though we know this shall not be brought to pass; for the Word of God declares that the most part of men walk in the broad way, and shall go down to hell. You know how passionately St. Paul longed for the salvation of all his countrymen the Jews [Rom. 9]. This is called a love of benevolence; and it is evident, by the following particulars, that the Lord expressed this good-will toward the young man in my text.</p></blockquote>

</figure><figure class="quote" id="q-604ab9a57f" data-kw="">

</figure><figure class="quote" id="q-36cb0103bc" data-kw="">
<blockquote><p>1. As love stands opposed to hatred and wrath, and enmity. Considering man as God’s creature, he was not hated of God; God hates not the work of his own hand; but considering him as a lapsed creature, as degenerated into the plant of a strange vine, after that God had created him a generous, noble plant… How suitable to us now is it to have a Savior? That is love, and who has loves, considering the aversion in the holy Divine Being from mankind as rebellious seed, a seed of evil-doers? Who could have suited us to have become a Savior unto us, but one who had a kind propension and inclination to us, inclining Him to the great work of man’s redemption and reconciliation to God, especially also considering that there could be no remission of sins without blood…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Intercourses of Divine Love betwixt Christ &amp; his Church (London: Snowden, 1683)</cite>, p. 156</span></figcaption>

</figure><figure class="quote" id="q-0480249b8d" data-kw="">
<blockquote><p>I was standing on the 10th of December, 1846, at the end of my Father’s house, and meditating on that precious word that has brought peace to countless weary ones: ‘God so loved the world, that He gave his only begotten Son, that whosoever believeth in Him, should not perish, but have eternal life’ (John 3:16). I saw the proof of his love in the giving of his Son Jesus. I saw that ‘whosoever’ meant anybody and everybody, and therefore me, even me. I saw the result of believing—that I would not perish, but have everlasting life. I was enabled to take God at his word. I saw no one, but Jesus only, all in all in redemption. My burden fell from my back, and I was saved. Yes, saved!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/duncan-matheson.html">Duncan Matheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life and Labors of Duncan Matheson: The Scotttish Evangelist, by John MacPherson, (Kilmarnock: Ritchie, n.d.), p. 26, as quoted by Ian Murray, The Cross: the Pulpit of God’s Love, n.d.</cite>, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

<main class="wrap"><figure class="quote" id="q-64484590ae" data-kw="">
<blockquote><p>Man&#x27;s meritorious work may be considered in two ways: first, as it proceeds from free-will; secondly, as it proceeds from the grace of the Holy Ghost. If it is considered as regards the substance of the work, and inasmuch as it springs from the free-will, there can be no condignity because of the very great inequality. But there is congruity, on account of an equality of proportion: for it would seem congruous that, if a man does what he can, God should reward him according to the excellence of his power. If, however, we speak of a meritorious work, inasmuch as it proceeds from the grace of the Holy Ghost moving us to life everlasting, it is meritorious of life everlasting condignly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa Theologiae</cite>, I-II, q. 114, a. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-eca3f1de29" data-kw="">
<blockquote><p>There are those who think that the good works of the just are meritorious of eternal life ex condigno by reason of the work, even if no divine agreement existed. So Cajetan teaches. … Others, on the contrary, think that good works proceeding from grace are not meritorious ex condigno by reason of the work, but only by reason of the pact and of divine acceptance. So Scotus teaches. … To us the middle opinion seems more probable, which teaches that the good works of the just are meritorious of eternal life ex condigno by reason of the pact and of the work together; not indeed that without the pact or acceptance a good work has no proportion to eternal life, but because God is not bound to accept a good work for that reward, even though it be equal and on a par with the reward, unless an agreement intervene.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-bellarmine.html">Robert Bellarmine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De Justificatione</cite>, 5.17 (translated from the Latin)</span></figcaption>

</figure><figure class="quote" id="q-289bf00ef4" data-kw="">
<blockquote><p>By his good works the just man may merit for himself many graces and favours, not, however, by right and justice (de condigno), but only congruously (de congruo). Most theologians incline to the opinion that the grace of final perseverance is among the objects of congruous merit, which grace, as has been shown above, is not and cannot be merited condignly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-congruity.html">Merit of congruity (de congruo)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-fd1c7f51b5" data-kw="">
<blockquote><p>According to the view of the Scotists and the Nominalists, the reason for the meritoriousness of good works lies exclusively in God’s free acceptance so that God could have accepted as merit and rewarded with everlasting life merely naturally good works. According to the better-founded Thomistic view, the ground of the meritoriousness lies also in the intrinsic value of good works performed in the state of grace. The state of grace effects an inner equivalence (meritum de condigno) between the good actions and the eternal reward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ludwig-ott.html">Ludwig Ott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fundamentals of Catholic Dogma</cite>, bk. 4, pt. 1, sec. 2, §24, 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/merit-of-congruity-and-condignity.html">Merit of Congruity and Condignity</a> › <a href="../topics/justification/merit-of-congruity-and-condignity/merit-of-condignity.html">Merit of condignity (de condigno)</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a> › <a href="../topics/good-works/merit-and-reward/merit-of-condignity-and-congruity.html">Merit of condignity and congruity</a></span><span class="t"><a href="../topics/rome/justification.html">Rome: Justification</a> › <a href="../topics/rome/justification/merit.html">Merit</a></span></div>

</figure><figure class="quote" id="q-1be46483e7" data-kw="">
<blockquote><p>From an ethical point of view the difference practically amounts to this that, if the reward due to condign merit be withheld, there is a violation of right and justice and the consequent obligation in conscience to make restitution, while, in the case of congruous merit, to withhold the reward involves no violation of right and no obligation to restore, it being merely an offence against what is fitting or a matter of personal discrimination (acceptio personarum). Hence the reward of congruous merit always depends in great measure on the kindness and liberality of the giver, though not purely and simply on his good will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-pohle.html">Joseph Pohle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Catholic Encyclopedia</cite>, s.v. “Merit” (1911)</span></figcaption>

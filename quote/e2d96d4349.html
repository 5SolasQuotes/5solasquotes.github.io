<main class="wrap"><figure class="quote" id="q-e2d96d4349" data-kw="">
<blockquote><p>As for the external [senses], God makes little use of three of them for this end, viz. touching, smelling and tasting, but does frequently employ the other two: for He has been presented visibly to our eyes, as well in human appearance, as to Abraham and Manoe and to some others, as in other shapes, as to Moses in the burning Bush:</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

<blockquote><p>XI. But whatever may be said about this diversity of opinions in the Roman school, all its doctors agree on this, as has often been stated:

      1. That some form of worship is to be given to images of Christ and the saints.

      2. That this worship can rightly be signified by the term “adoration.</p></blockquote>

</figure><figure class="quote" id="q-0093c45483" data-kw="">
<blockquote><p>the eighth anathema of the Council of 754, which condemns anyone who would contemplate the incarnate Logos ‘through the medium of material colors, and does not worship him with the whole heart, with the eyes of the mind, as he sits in excelsis, more dazzling than the sun, at the right hand of God, on the throne of glory.’ The whole case in behalf of this type of image is summarized in the sixteenth anathema of the Council as follows: ‘If anyone ventures to set up profitless figures of all the saints in soul-less, speechless images made of material colors — for this is a vain invention and the discovery of diabolical craft — and does not, on the contrary, reproduce their virtues in himself as actually living images, with the aid of what has been recorded about them in books, in order to be stimulated to zeal like theirs, as our inspired fathers have said, let him be anathema.’</p></blockquote>

</figure><figure class="quote" id="q-5445743b15" data-kw="">
<blockquote><p>Though God is pleased to stoop to our weak capacities, and set himself out in scripture by eyes, to signify his omnisciency; and hands to signify his power; yet it is very absurd, from metaphors and figurative expressions, to bring an argument for images and pictures; for, by that rule, God may be pictured by the sun and the element of fire, and by a rock; for God is set forth by these metaphors in scripture; and sure the papists themselves would not like to have such images made of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity</cite>, ... (Berwick: W. Gracie, 1806), p. 389</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

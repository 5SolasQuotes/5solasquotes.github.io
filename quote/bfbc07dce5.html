<main class="wrap"><figure class="quote" id="q-bfbc07dce5" data-kw="">
<blockquote><p>Although women are ashamed to acknowledge this, Scriptures and experience teach us that there is only one in several thousands to whom God gives the gift to live chastely in a state of virginity. A woman does not have complete mastery over herself. God so created her body that she should be with a man and bear and raise children. The words of Gen., ch. i, clearly state this, and the members of her body sufficiently show that God himself formed her for this purpose.

Just as eating, drinking, waking, and sleeping are appointed by God to be natural, so God also wills that it be natural for a man and a woman to live together in matrimony. This is enough, therefore, and no woman need be ashamed of that for which God has created and fashioned her, and if she feels that she does not possess that high and rare gift, she may leave the convent and do that for which she is adapted by nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to three nuns, 6 August 1524 in Luther: Letters of Spiritual Counsel, ed. and trans. Theodore G. Tappert, Library of Christian Classics, vol. 18 (London: SCM Press, 1955), p. 271.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<blockquote><p>[1.] We do not speak of parents that are so far deprived of judgment, that they are not fit to determine this matter; nor, [2.] Such as have divested themselves of the natural affection of parents, and entertaining an ungrounded prejudice against some of their children, are endeavoring to expose them to ruin, that they may show more kindness to others. These forfeit that right, which is otherwise founded in nature. [3.] If parents, by refusing to comply with the desire of their children, plainly, in the judgment of the wisest of men, obstruct their happiness, and the glory of God herein. Or, if they have no reason for their not complying, or the reason given is contrary to the laws of God, or the common sense of all impartial judges; especially if the affair took its first rise from them, and afterwards they changed their mind, without sufficient ground. This, without doubt, lessens, or it may be so circumstanced, that it wholly takes away the charge of sin in the child, in acting contrary to the will of his parents, and fastens the guilt on them. [4.] The case is vastly different, when applied to children who are so far from being dependent on their parents, that they depend on them. Nevertheless, in this case, some deference and respect ought to be paid to them; and as it is the children’s duty, it may be their interest so to do; since we can hardly suppose, that parents, who depend on their children, would oppose their happiness, in an affair that is apparently contrary to their own interest, if they did not think that they had sufficient reason for it; which ought to be duly weighed, that it may be known, whether their advice is expedient to be complied with, or no. And if in this, or any other instance, children are obliged to act contrary to the will of their parents; they ought to satisfy them, that it is not out of contempt to their authority, but a conscientious regard to the glory of God; and that it is conducive to their happiness, in the opinion of the wisest and best of men.</p></blockquote>

<blockquote><p>That power is given by the Presbyteries’ act of ordination, by order of nature, before the people’s formal act of election: As the husband who in a lapidaries shop chooses a gold ring for his wife, and puts it on her finger, presupposes it was a gold ring before his choosing thereof, neither does his choosing thereof make it a gold ring, but only makes it his wife’s gold ring by application to her: Just so, peoples election appropriates such a man who is already a pastor to such a charge, but does not make the pastor a pastor, but chooses him only to be their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 17, p. 267</span></figcaption>

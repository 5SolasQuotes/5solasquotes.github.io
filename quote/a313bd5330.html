</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4cb8cffe8a" data-kw="">
<blockquote><p>This argument proves that veneration is not due to the images, as to books of the Trinity, because that the veneration of the image is an honoring of God, there must be a union betwixt the images and God or Christ, betwixt the tree and Christ [in the case of a crucifix]. 1. There is no union-lawful that can be a warrant of honoring anything but a union warranted of God, [to give false examples] betwixt crossing in the air and dedication to Christ’s service, betwixt surplice and pastoral sanctity; There is no union, nor is there a personal union betwixt Christ and the image: Nor 2. a union of parts, as betwixt the shoulders and the head. Nor 3. is there a divine relative union, as betwixt the mean or the end, the servant or the lord: for as John White says well [a puritan, d. 1648], and the Scripture proves, all union betwixt God and the means of worship, which are to be reverenced as means of worship in relation to God, is by divine institution (Mt. 10:14, 42; 2 Cor. 8:4; Gal. 4:14; Acts 10:34; Ps. 119:97, 159, 147, 82, 103, 111, 113, 114, 120, 127, 128, 140, 143, 167, 174); now certainly if by divine ordination there had been a union betwixt the image and God, then had it been lawful to lay the image in the heart, to say: ‘How love I thy image? The painted pictures and wooden portraits of Christ, the wood of the cross are my delight’, ‘I hope in the wood,’ ‘I have taken images for my heritage, they are sweeter to me, nor the honey or the honey comb,’ ‘How pleasant are the wooden feet of these dead and senseless ambassadors of Christ, who bring to my soul news of God, or of my Redeemer Jesus.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Ch. 1, Question 5, Section 3; p. 189</span></figcaption>

</figure><figure class="quote" id="q-5aa04506f5" data-kw="">
<blockquote><p>But those [leading presbyterian and congregationalist ministers] that were called by the king, and one another, 1660 and 1661, to treat of concord, and that assembled at Sion College, and elsewhere about it, did openly make known their minds: And I think they meddled not against any of these things following, by any accusation of them as sinful: … XIX. We never thought that things indifferent do become unlawful to us because the magistrate commands them.</p></blockquote>

<blockquote><p>There is a twofold intention in worship, one formal and properlly religious, and is expounded moral, ex natura rei [out of the nature of the thing], to be religious, it being such an intention, as can have no other state in worship, but a religious state… an intrinsical intention, ex natura et conditione operis [out of the nature and condition of the work], to worship… But there is another intention not religious: if a child read a chapter of the Bible, that he may learn to read and spell, that is an action of art, not of worship; because the object of the child’s reading is not Scripture as Scripture, but only the printed characters as they are, Signa rerum ut rerum, non ut rerum sacrarum, ‘signs of things, not of holy things’, and here the object not being religious, the intrinsical operation cannot raise up any religious intention of the child… the latter intention of the worker, is so far extraneous to worship, as whether it be, or be not, the nature of worship is not impaired nor violated. Hence, adoration is worship, but every worship is not adoration… all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly, either of God, or of these means; it is lawful to tremble at the Word, and for Josiah to weep before the Book of the Law read, and for the martyrs to kiss the stake as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, (London, 1646) | Introduction, pp. 88-89</span></figcaption>

<blockquote><p>…he [the opponent] was required to prove it significative of some spiritual duty [in order for it to be warrant for a human, significant ceremony in worship]: For it was in probability only a common sign of subjection, as well out of an oath, as in it, without any respect unto Christ. …but men’s conceits are no great proofs. He adds 2. that if it were a sign of subjection yet might it be significant of a spiritual duty. But may be and might be is no proof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, … (1633), ch. 3 | section 7, ‘Concerning the Oath-Gesture of Abraham’s Servant’, pp. 304-9</span></figcaption>

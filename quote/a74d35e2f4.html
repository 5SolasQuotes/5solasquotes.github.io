<main class="wrap"><figure class="quote" id="q-a74d35e2f4" data-kw="">
<blockquote><p>The state of the controversy: Whether in order to public obedience in civil government, the consideration of the things commanded (as they are not in themselves bad) be above the circumstantial qualification of the persons commanding? As to do the do the offices of a judge or justice of the peace by virtue of commission derived from any governor whatever.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-83f4d58b1c" data-kw="">
<blockquote><p>And surely whatsoever ill consequences may appear upon obeying, they appear at more distance, but confusion and destruction come in presently upon disobeying. The commonwealth is presently put unto ungovernment and confusion by inobedience, or into sedition, civil war, yea destruction, by striving against a prevalent power. Therefore as that which has the less ill consequences, not ours only, but generally all nations have given obedience to power; and both sought and received laws and government from those that have overpowered them… And whereas some speak of a time for settlement, they indeed do rather speak for a time of unsettlement; for they will have an unsettlement first, and a settlement after. And whereas like does produce its like, yet they would have an unsettlement to beget a settlement. They would have confusion, distraction, destruction to bring forth order and safety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-rouse.html">Francis Rouse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lawfulness of Obeying the Present Government… (London, 1649) Rouse was a Westminster divine.</cite>, pp. 9-10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-170c9987ff" data-kw="">
<blockquote><p>It is possible that I shall not be an eyewitness to it in the flesh, but I believe He cometh quickly who will remove our darkness, and shine gloriously in the Isle of Britain, as a crowned King, either in a formally sworn covenant, or in His own glorious way, which I leave to the determination of His infinite wisdom and goodness. And this is the hope and confidence of a dying man, who is longing and fainting for the salvation of God.</p></blockquote>

</figure><figure class="quote" id="q-dbdf8c5578" data-kw="">
<blockquote><p>But this is not all the usurpers that rose up in those days. Eugenius [the usurper] soon becomes more terrible than he (who once was but a schoolmaster). And how does this loyal St. Ambrose carry it? When he had got of Theodosius a pardon for all that took part with Maximus, even his army except two or three, yea and benefits too, yet did not this holy loyal man think it sinful to write thus to the tyrant Eugenius (Epistles, bk. 2, p. 103), Clementissimo Imperatori Eugenio, Ambrosius Episcopus, ‘Bishop Ambrose to the most clement emperor Eugenius.’ And thus concludes: In his vero in quibus vos rogari decet, etiam exhibere sedulitatem potestati debitam▪ sicut et scriptum est, cui honorem, honorem, cui tributum, tributum: Nam cum privato detulerim corde intimo, quomodo non deferrem Imperatori? i.e. ‘But in these matters where it becomes us to petition you, we must also give the diligence due to power: as it is written, honor to whom honor, tribute to whom tribute: For when I honored you, when you were a private man from the inwards of my heart, how should I not honor you an emperor?’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Episcopacy… (London: Simmons, 1681) | pt. 2, ch. 22</cite>, p. 210</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

pener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bef0e1ad07" data-kw="">
<blockquote><p>To displace and throw down this Exactor, this Phalaris, this Nero, is a work well pleasing to God; Namely, for being such a one: which is a moral reason. Shall then so slight a consideration as his hap to be not elective simply, but by birth, which was a mere accident, overthrow that which is moral, and make unpleasing to God that which otherwise had so well pleased Him? certainly not: for if the matter be rightly argued, Election much rather than chance, binds a man to content himself with what he suffers by his own bad Election. Though indeed neither the one nor other binds any man, much less any people to a necessary sufferance of those wrongs and evils, which they have ability and strength enough given them to remove.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted of Luther by Cochlæus in his Miscellanies, when the Protestants in Germany entered into a Covenant at Smalcaldia:</cite></span></figcaption>

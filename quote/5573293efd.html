</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b612f4cfc4" data-kw="Mary Saviour">
<blockquote><p>It is with great propriety, in speaking of the joy of her heart, that she gives to God the appellation of Savior. Till God has been recognised as a Savior, the minds of men are not free to indulge in true and full joy, but will remain in doubt and anxiety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on a Harmony of the Evangelists</cite>, Luke 1:47</span></figcaption>

<div class="actions"><button class="copy" data-copy="“It is with great propriety, in speaking of the joy of her heart, that she gives to God the appellation of Savior. Till God has been recognised as a Savior, the minds of men are not free to indulge in true and full joy, but will remain in doubt and anxiety.”

— John Calvin, Commentary on a Harmony of the Evangelists, Luke 1:47">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+is+with+great+propriety%2C+in+speaking+of+the+joy+of+her+heart%2C+that+she+gives+to+God+the+appellation+of+Savior.+Till+God+has+been+recognised+as+a+Savior%2C+the+minds+of+men+are+not+free+to+indulge+in+true+and+full+joy%2C+but+will+remain+in+doubt+and+anxiety.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Commentary+on+a+Harmony+of+the+Evangelists%2C+Luke+1%3A47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb612f4cfc4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b612f4cfc4.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom31" rel="noopener" target="_blank">Read it online · CCEL, vol. 1</a></div>
</figure><figure class="quote" id="q-31e2552aa2" data-kw="">
<blockquote><p>We by no means think or teach that the relics of the saints should be held in contempt, or treated in an irreverent and irreligious manner, but that they should be given that place, and be held in that regard, which the testimonies of Scripture we have quoted show. It does not follow from this, however, that we should gather from the cogitations of human reason, or learn from the examples of the heathen or of any people, or that everyone ought to figure out for himself, with what veneration the relics of the saints are to be honored; but the same Scripture which teaches that the relics of the saints are to be considered precious also shows the mode and manner of their true veneration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part IV, First Topic (Relics of the Saints), Sec. II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a> › <a href="../topics/rome/mary-and-the-saints/relics.html">Relics</a></span></div>

</figure><figure class="quote" id="q-0a2bd3d9c6" data-kw="">
<blockquote><p>He took unto him his wife, that is, he took her unto his house (for betrothed virgins used to abide at their own friends’ houses till the consummation of the marriage) and owned her as his wife, yet not fully using her as such, for the text saith he knew her not (a modest phrase used from the beginning of the world, as appears from Gen 4:1, to express the conjugal act) till she had brought forth her firstborn Son. Some make a great stir in determining whether he knew her afterwards, yea or no. Some of the ancients were stiff in their opinion that he did not, so are the popish writers, and many protestant interpreters. Mr. Calvin I think determines best, that none will move such a question, but such as are unwarrantably curious; nor contend for either part, but such as are unreasonably quarrelsome. For as, on the one side, none can conclude that she had more children from the word till, further than they can conclude, from Ps 110:1, that Christ shall not for ever sit at his Father’s right hand (the word until being a particle only exclusive of a preceding time, not affirming the thing in future time), nor doth the term firstborn conclude any born afterward; so, on the other side, there are no cogent arguments to prove that Mary had no more children by Joseph. We read of the brother of our Lord, Gal 1:19, and of his mother and his brethren, Matt 12:47; and though it be true brethren may signify kinsmen, according to the Hebrew dialect, yet that it doth so in these texts cannot be proved. The Holy Ghost had made use of the virgin for the production of the Messias; why after this her womb should be shut up, and Joseph take her home to be his wife, and not use her as such I cannot tell, nor yet what reproach it could be to Mary or to our Savior, marriage being God’s ordinance, and the undefiled bed honorable: and those who think our Savior would have been dishonoured in any others lying in the same bed after him, seem to forget how much he humbled himself in lying in that bed first, and then in a stable and a manger. We know he knew her not till Christ was born, whether he did afterward or no we are willingly ignorant because God hath not told us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 1, vv. 24-25</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/mary-and-the-saints.html">Rome: Mary and the Saints</a></span></div>

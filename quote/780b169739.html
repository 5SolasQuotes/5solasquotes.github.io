<main class="wrap"><figure class="quote" id="q-780b169739" data-kw="">
<blockquote><p>It is the Lord, particularly Jesus Christ, who gave this law in the name of the Trinity. This is plain from the Scripture, Acts 7:38; Heb. 12:24-26. It was He that brought the people out of Egypt, and that appeared in the bush that burned with fire, and yet was not consumed, giving commission to Moses for their deliverance, Ex. 3:2-8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Illustration of the Doctrines of the Christian Religion</cite>, … ‘Preface of the Ten Commandments’ in ed. Samuel M’Millan (Aberdeen: King, 1848), vol. 2, p. 84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-aff4a3ff44" data-kw="">
<blockquote><p>Not only the covetous, but the unclean, are idolaters; for the apostle, who here makes covetousness to be idolatry, counts voluptuous persons idolaters also, where he speaks of some who make their belly their God, Philip. 3. Indeed, every reigning lust is an idol, and every person in whom it reigns is an idolater. ‘The lust of the flesh, the lust of the eye, and the pride of life,’ i.e. pleasures, and riches, and honours, are the carnal man’s trinity, the three great idols of worldly men, to which they prostrate their souls; and giving that to them which is due only to God, they hereby become guilty of idolatry.… Idolatry is … to give that honour and worship to the creature which is due only to God.… Now this worship due to God only is not only given by heathens to their false gods, and by papists to angels, saints, images, &amp;c., but also by carnal men to their lusts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (Practical Works)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god/first-table-commandments-1-4.html">First Table (Commandments 1-4)</a> › <a href="../topics/the-law-of-god/first-table-commandments-1-4/first-commandment.html">First commandment</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-e627d178b5" data-kw="">
<blockquote><p>4. The Province of Burgundy demanding, Whether the faithful of the Augustane [Augsburg] Confession might be permitted to contract marriages in our Churches, and to present children in our churches unto baptism, without a precedaneous abjuration of those opinions held by them, contrary to the belief of our churches? This synod declares that inasmuch as the Churches of the Confession of Ausbourg do agree with the other Reformed Churches in the principal and fundamental Points of the True Religion, and that there is neither superstition nor idolatry in their worship, the faithful of the said Confession, who with a spirit of love and peaceableness do join themselves to the communion of our churches in this kingdom, may be, without any abjuration at all made by them, admitted unto the Lord’s Table with us; and as sureties may present children unto baptism, they promising the consistory that they will never solicit them, either directly or indirectly, to transgress the doctrine believed and professed in our Churches, but will be content to instruct and educate them in those points and articles which are in common between us and them, and wherein both the Lutherans and we are unanimously agreed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/french-reformed.html">French Reformed Churches</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synodicon in Gallia Reformata (John Quick, London, 1692)</cite>, ed. John Quick,Synodicon in Gallia reformata, or, The Acts, Decisions, Decrees &amp; Canons of those Famous National Councils of the Reformed Churches in France (London: Parkhurst, 1692), Ch. 22, An Act in favor of the Lutheran Brethren, p. 297</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-b4ae3141e7" data-kw="">
<blockquote><p>The extraordinary presence of God was by his miraculous apparitions and discovering Himself by some miraculous token, vision, sign, or manifestation of his presence, as now here in this burning, and not consumed bush; here was a miraculous token of God’s presence. We shall and in the fifth of Joshua… I conceive, hence it is, the mountain in which Christ was transfigured is called, ‘the holy mountain,’ 2 Pet. 1:18… Why holy? Not as if it were holy at that time when the apostle writ that epistle, but it were manifest there was an extraordinary manifestation and sign of God’s presence, and so long as this extraordinary manifestation of God’s presence continued it was called ‘holy.’… And remember this place now, of God’s extraordinary miraculous manifestation of Himself in the bush was holy for that time, and no longer, wherein He did manifest Himself; for otherwise, in the time of the Law, it were unholy to offer up sacrifice there.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkins.html">William Jenkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exact Collection of Farewell Sermons preached by the Late London-Ministers</cite>, … (London: 1662), Mr. Jenkin’s Afternoon Sermon, pp. 287-88</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

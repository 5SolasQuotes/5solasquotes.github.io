<main class="wrap"><figure class="quote" id="q-7b62193997" data-kw="">
<blockquote><p>For it is said [in Acts 8] that Philip, having found the eunuch reading a passage from Isaiah, announced to him, beginning from that text. Now to announce Jesus is to announce Christian doctrine. And how many years, on this reckoning [of the Romanist opponent], would have been required for catechumens to be introduced into the Church, since they could not enter the Church except through knowledge of the doctrine? Thus the matter here concerns a knowledge sufficient for salvation, which consists in a measure of light of which the simple and the lowly are capable in a short time. The matter here is not to form a doctor of theology, but a Christian…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-mestrezat.html">Jean Mestrezat</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tract on the Church (1649), bk. 1, ch. 1 as quoted in J.A. Turretin, Discourse concerning Fundamental Articles (London: Darby, 1720), Appendix, “Testimonies from Church History” tr. ChatGPT-5</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“For it is said [in Acts 8] that Philip, having found the eunuch reading a passage from Isaiah, announced to him, beginning from that text. Now to announce Jesus is to announce Christian doctrine. And how many years, on this reckoning [of the Romanist opponent], would have been required for catechumens to be introduced into the Church, since they could not enter the Church except through knowledge of the doctrine? Thus the matter here concerns a knowledge sufficient for salvation, which consists in a measure of light of which the simple and the lowly are capable in a short time. The matter here is not to form a doctor of theology, but a Christian…”

— Jean Mestrezat, Tract on the Church (1649), bk. 1, ch. 1 as quoted in J.A. Turretin, Discourse concerning Fundamental Articles (London: Darby, 1720), Appendix, “Testimonies from Church History” tr. ChatGPT-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+it+is+said+%5Bin+Acts+8%5D+that+Philip%2C+having+found+the+eunuch+reading+a+passage+from+Isaiah%2C+announced+to+him%2C+beginning+from+that+text.+Now+to+announce+Jesus+is+to+announce+Christian+doctrine.+And+how+many+years%2C+on+this+reckoning+%5Bof+the+Romanist+opponent%5D%2C+would+have+been+required+for+catechumens+to+be+introduced+into+the+Church%2C+since+they+could+not+enter+the+Church+except+through+knowledge+of+the+doctrine%3F+Thus+the+matter+here+concerns+a+knowledge+sufficient+for+salvation%2C+which+consists+in+a+measure+of+light+of+which+the+simple+and+the+lowly+are+capable+in+a+short+time.+The+matter+here+is+not+to+form+a+doctor+of+theology%2C+but+a+Christian%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Jean+Mestrezat%2C+Tract+on+the+Church+%281649%29%2C+bk.+1%2C+ch.+1+as+quoted+in+J.A.+Turretin%2C+Discourse+concerning+Fundamental+Articles+%28London%3A+Darby%2C+1720%29%2C+Appendix%2C+%E2%80%9CTestimonies+from+Church+History%E2%80%9D+tr.+ChatGPT-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7b62193997.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7b62193997.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=For%20it%20is%20said%20%5Bin%20Acts,doctor%20of%20theology%2C%20but%20a%20Christian&amp;text=For%20it%20is%20said%20%5Bin%20Acts%208%5D%20that&amp;text=form%20a%20doctor%20of%20theology%2C%20but%20a%20Christian" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4caaa5bee8" data-kw="">

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-reformers.html">Scottish Reformers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scots Confession</cite>, 1560, Art. 20</span></figcaption>

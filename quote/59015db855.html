<blockquote><p>It is a work above the reach of men or angels to persuade a soul to come to Christ. There is nothing so difficult or perplexing to flesh and blood as to close with Christ. There is nothing that corrupt nature has such a reluctancy to and prejudice against as this. It requires the mighty power of God to bring folk to subjection to Him, and to bring down the strongholds of sin within them and every vain thought.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cameron.html">Richard Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermon on John 5:40 (1680) in Sermons in Times of Persecution in Scotland, by Sufferers for the Royal Prerogatives of Jesus Christ</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f9b5f464f6" data-kw="">
<blockquote><p>4. Antecedent and consequent wills are such as cannot agree to God as they [Arminians] understand them. For his antecedent will they make to be such whereby He wills and earnestly desires the salvation of all men: the consequent will, that whereby He wills the damnation of some, namely such as persist in unbelief; and the salvation of others; namely such as persevere in the faith; now these cannot agree with the nature of God; for:

1. For this antecedent will has sometimes an end and the consequent will always a beginning; the absolute or peremptory decree of damnation, never taking place till the antecedent or conditional will touching salvation be expired: and so likewise the peremptory decree of salvation, not taking place till the ceasing of the other. Now the acts of God’s will are immanent acts, therefore eternal like Himself. Objection: But God foresees who will persevere in believing, and upon this foresight grounds his purpose. Answer: Then upon this foresight, He only purposes to will their salvation when they do believe and persevere; but He does not actually will it, that is, will it with his consequent and peremptory will, till they do believe; which cannot stand with the eternity of his will.

2. This antecedent will they make rather to be a velleietas, than a volitio, rather ‘a wishing’ and desiring, than ‘a willing,’ which cannot agree to God; who is totus actus, all act, yea actus purissimus et perfectissimus, the most pure and perfect act: therefore no imperfect wishes and desires belong to Him. (Si Deus non potest, est impotens, si potest sed non efficit quia non licet, tum Deus vellet aliquid quod non liceret [If God cannot, He is impotent; if He can, but does not effect it because it is not permitted, then God would will something which is not permitted]. Dr. Twisse)

3. If God by his antecedent will does seriously and heartily desire the salvation of all men, when some of these come to be damned, then this desire either still continues in Him or not: If it does not continue, then his will is changeable, but he says of Himself, ‘I am the Lord, I change not,’ Mal. 3:6. Besides, they make this antecedent will whereby He wills the salvation of all to flow from his nature; and being natural to him, it must be unchangeable as his nature is: If it does continue, then God continues earnestly to desire the salvation of wicked men when they are damned; so never has his desire accomplished, which cannot stand with perfect felicity: yea if it does continue, then God does seriously will their salvation and damnation at one time, and so wills a flat contradiction: or else when He damns men, He does not will to damn them; and so his actions are not guided by his will.

4. If he does will their salvation, why does He not work it, for He is in heaven, and does whatsoever He will? ‘He works all things according to the pleasure of his will,’ Eph. 1:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-whitfield.html">Thomas Whitfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrines of the Arminians &amp; Pelagians truly stated and clearly answered</cite>, ... (London, 1651), ‘An Examination and Confutation of the Arminian erroneous tenets concerning Election’, pp. 34-35</span></figcaption>

cedent%20and%20consequent%20wills%20are,pleasure%20of%20his%20will%2C%E2%80%99%20Eph.%201%3A11&amp;text=4.%20Antecedent%20and%20consequent%20wills%20are%20such%20as&amp;text=to%20the%20pleasure%20of%20his%20will%2C%E2%80%99%20Eph.%201%3A11" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b8cb63195f" data-kw="">
<blockquote><p>I answer that… Therefore, that toward which God has ordered the creature with regard to himself is said to be willed by him as by a first intention or by an antecedent will. But when a creature is impeded from this end because of its defect, God still fulfills in it the goodness of which it is capable; and this pertains, as it were, to his second intention and it is called a consequent will. Thus, since God made all men for blessedness, he is said to will the salvation of all men by an antecedent will; but since some are turned against their own salvation, whom the order of his wisdom does not allow to come to salvation because of their defect, he fulfills in them what pertains to his goodness in another way, namely, condemning them by justice; so that whereas they do not attain to the first order of his will, they fall into the second; and while they do not carry out God’s will, the will of God is fulfilled in them. However, the very defect of sin by which someone is rendered worthy of punishment in the present or else the future is not willed by God either by an antecedent or a consequent will, but it is only permitted by him… and neither did he order him to salvation according to the order of predestination, which is the order of absolute will; rather, to the extent that this order is from himself, he gave to him a nature ordered to beatitude. Reply Obj. 1: Neither order nor distinction comes from the act of the will, but only from the things willed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Whether the divine will can be distinguished by antecedent and consequent?’ in Disputed Questions, On Truth</cite>, question 23, On the Will of God</span></figcaption>

<blockquote><p>Surely it is easy to observe that we are too fearful of some distinctions which carry in them a jealousy of former abuse and yet both may well be admitted in a good sense and serve for excellent purpose. As that (if we labor for our better understanding to explicate the one will of God by several notions of the antecedent and consequent will of God, which Paulus Ferrius, a reformed schoolman, approves by the suffrages of Zanchi, Polanus and other orthodox divines, to look at it a little running, as that which gives no small light to the business in hand. As there is wont to be conceived a double knowledge of God, the one of mere understanding whereby He foreknows all things that may be; the other of vision, or approbation, whereby he foreknows that which undoubtedly shall be, so there is a double will to be conceived of God answerable to this double knowledge: an antecedent will, which answers to the mere understanding whereby God wills every possible good without the consideration of the adjuncts appertaining to it; a consequent will answering to the knowledge of approbation, whereby (all circumstances prepensed) God does simply will this or that particular event as simply good to be and which is there upon impossible not to be. The one of these is a will of complacency, the other of prosecution; the one is as it were an optative will, the other an absolute. In the first of these God would have all to be saved because it is in a sort good in itself, in that the nature of man is ordainable to life and man has by God common helps seriously offered for the attaining thereof; neither can we think it other than pleasing to God that his creatures should both do well and fare well. In the latter He wills some of all to be saved, as not finding it simply good (all circumstances considered) to extend this favor to all; this appears in the effect, for if God absolutely willed it, it could not fail of being, neither does ought hinder, but these two may stand well together, a complacence in the blessedness of his creature and a will of his smart. For both that which we will in one regard, we may not will in another, as we may wish a felon to live as a man, to die as a malefactor; and besides, the possibility of one opposite does not hinder the act of another, as he that has power to run perhaps does sit or lie. Learned Zanchi methinks gives at once a good satisfaction as to this doubt (Of the Nature of God, 1.3, ch. 4); so to the ordinary exception whereat many have stumbled, of the pretended mockage of God’s invitations, where He means not, as some have misconceived, a serious effect. In the parable of the Gospel (says he) those which were first bidden to the marriage feast and came not, were they therefore mocked by the king because he only signified unto them what would be acceptable unto him and what was their duty to perform? and yet he did not command them to be compelled as he did the second guests to come to the wedding? Surely no, yet in the mean time, there was not the same will of the king in the inviting of the first and of the second, for in these second there was an absolute will of the king, that they should without fail come; and therefore he effectually caused them to come. In the former he only signified, and that fairly and ingenuously, what would be pleasing to him: Thus he. The entertainment of this one distinction, which has the allowance of orthodox and learned authors to be free from any danger or inconvenience, would mitigate this strife since it is that which the opponents contend for, which the defendents may yield without any sensible prejudice.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Surely it is easy to observe that we are too fearful of some distinctions which carry in them a jealousy of former abuse and yet both may well be admitted in a good sense and serve for excellent purpose. As that (if we labor for our better understanding to explicate the one will of God by several notions of the antecedent and consequent will of God, which Paulus Ferrius, a reformed schoolman, approves by the suffrages of Zanchi, Polanus and other orthodox divines, to look at it a little running, as that which gives no small light to the business in hand. As there is wont to be conceived a double knowledge of God, the one of mere understanding whereby He foreknows all things that may be; the other of vision, or approbation, whereby he foreknows that which undoubtedly shall be, so there is a double will to be conceived of God answerable to this double knowledge: an antecedent will, which answers to the mere understanding whereby God wills every possible good without the consideration of the adjuncts appertaining to it; a consequent will answering to the knowledge of approbation, whereby (all circumstances prepensed) God does simply will this or that particular event as simply good to be and which is there upon impossible not to be. The one of these is a will of complacency, the other of prosecution; the one is as it were an optative will, the other an absolute. In the first of these God would have all to be saved because it is in a sort good in itself, in that the nature of man is ordainable to life and man has by God common helps seriously offered for the attaining thereof; neither can we think it other than pleasing to God that his creatures should both do well and fare well. In the latter He wills some of all to be saved, as not finding it simply good (all circumstances considered) to extend this favor to all; this appears in the effect, for if God absolutely willed it, it could not fail of being, neither does ought hinder, but these two may stand well together, a complacence in the blessedness of his creature and a will of his smart. For both that which we will in one regard, we may not will in another, as we may wish a felon to live as a man, to die as a malefactor; and besides, the possibility of one opposite does not hinder the act of another, as he that has power to run perhaps does sit or lie. Learned Zanchi methinks gives at once a good satisfaction as to this doubt (Of the Nature of God, 1.3, ch. 4); so to the ordinary exception whereat many have stumbled, of the pretended mockage of God’s invitations, where He means not, as some have misconceived, a serious effect. In the parable of the Gospel (says he) those which were first bidden to the marriage feast and came not, were they therefore mocked by the king because he only signified unto them what would be acceptable unto him and what was their duty to perform? and yet he did not command them to be compelled as he did the second guests to come to the wedding? Surely no, yet in the mean time, there was not the same will of the king in the inviting of the first and of the second, for in these second there was an absolute will of the king, that they should without fail come; and therefore he effectually caused them to come. In the former he only signified, and that fairly and ingenuously, what would be pleasing to him: Thus he. The entertainment of this one distinction, which has the allowance of orthodox and learned authors to be free from any danger or inconvenience, would mitigate this strife since it is that which the opponents contend for, which the defendents may yield without any sensible prejudice.”

— Joseph Hall, The Shaking of the Olive Tree, the Remaining Works of that incomparable prelate Joseph Hall, … (London: Cadwell, 1660), Via Media: the Way of Peace in the Five Busy Articles commonly known by the name of Arminius, Of the Fifth Article of Perseverance, pp. 376-78">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSurely+it+is+easy+to+observe+that+we+are+too+fearful+of+some+distinctions+which+carry+in+them+a+jealousy+of+former+abuse+and+yet+both+may+well+be+admitted+in+a+good+sense+and+serve+for+excellent+purpose.+As+that+%28if+we+labor+for+our+better+understanding+to+explicate+the+one+will+of+God+by+several+notions+of+the+antecedent+and+consequent+will+of+God%2C+which+Paulus+Ferrius%2C+a+reformed+schoolman%2C+approves+by+the+suffrages+of+Zanchi%2C+Polanus+and+other+orthodox+divines%2C+to+look+at+it+a+little+running%2C+as+that+which+gives+no+small+light+to+the+business+in+hand.+As+there+is+wont+to+be+conceived+a+double+knowledge+of+God%2C+the+one+of+mere+understanding+whereby+He+foreknows+all+things+that+may+be%3B+the+other+of+vision%2C+or+approbation%2C+whereby+he+foreknows+that+which+undoubtedly+shall+be%2C+so+there+is+a+double+will+to+be+conceived+of+God+answerable+to+this+double+knowledge%3A+an+antecedent+will%2C+which+answers+to+the+mere+understanding+whereby+God+wills+every+possible+good+without+the+consideration+of+the+adjuncts+appertaining+to+it%3B+a+consequent+will+answering+to+the+knowledge+of+approbation%2C+whereby+%28all+circumstances+prepensed%29+God+does+simply+will+this+or+that+particular+event+as+simply+good+to+be+and+which+is+there+upon+impossible+not+to+be.+The+one+of+these+is+a+will+of+complacency%2C+the+other+of+prosecution%3B+the+one+is+as+it+were+an+optative+will%2C+the+other+an+absolute.+In+the+first+of+these+God+would+have+all+to+be+saved+because+it+is+in+a+sort+good+in+itself%2C+in+that+the+nature+of+man+is+ordainable+to+life+and+man+has+by+God+common+helps+seriously+offered+for+the+attaining+thereof%3B+neither+can+we+think+it+other+than+pleasing+to+God+that+his+creatures+should+both+do+well+and+fare+well.+In+the+latter+He+wills+some+of+all+to+be+saved%2C+as+not+finding+it+simply+good+%28all+circumstances+considered%29+to+extend+this+favor+to+all%3B+this+appears+in+the+effect%2C+for+if+God+absolutely+willed+it%2C+it+could+not+fail+of+being%2C+neither+does+ought+hinder%2C+but+these+two+may+stand+well+together%2C+a+complacence+in+the+blessedness+of+his+creature+and+a+will+of+his+smart.+For+both+that+which+we+will+in+one+regard%2C+we+may+not+will+in+another%2C+as+we+may+wish+a+felon+to+live+as+a+man%2C+to+die+as+a+malefactor%3B+and+besides%2C+the+possibility+of+one+opposite+does+not+hinder+the+act+of+another%2C+as+he+that+has+power+to+run+perhaps+does+sit+or+lie.+Learned+Zanchi+methinks+gives+at+once+a+good+satisfaction+as+to+this+doubt+%28Of+the+Nature+of+God%2C+1.3%2C+ch.+4%29%3B+so+to+the+ordinary+exception+whereat+many+have+stumbled%2C+of+the+pretended+mockage+of+God%E2%80%99s+invitations%2C+where+He+means+not%2C+as+some+have+misconceived%2C+a+serious+effect.+In+the+parable+of+the+Gospel+%28says+he%29+those+which+were+first+bidden+to+the+marriage+feast+and+came+not%2C+were+they+therefore+mocked+by+the+king+because+he+only+signified+unto+them+what+would+be+acceptable+unto+him+and+what+was+their+duty+to+perform%3F+and+yet+he+did+not+command+them+to+be+compelled+as+he+did+the+second+guests+to+come+to+the+wedding%3F+Surely+no%2C+yet+in+the+mean+time%2C+there+was+not+the+same+will+of+the+king+in+the+inviting+of+the+first+and+of+the+second%2C+for+in+these+second+there+was+an+absolute+will+of+the+king%2C+that+they+should+without+fail+come%3B+and+therefore+he+effectually+caused+them+to+come.+In+the+former+he+only+signified%2C+and+that+fairly+and+ingenuously%2C+what+would+be+pleasing+to+him%3A+Thus+he.+The+entertainment+of+this+one+distinction%2C+which+has+the+allowance+of+orthodox+and+learned+authors+to+be+free+from+any+danger+or+inconvenience%2C+would+mitigate+this+strife+since+it+is+that+which+the+opponents+contend+for%2C+which+the+defendents+may+yield+without+any+sensible+prejudice.%E2%80%9D%0A%0A%E2%80%94+Joseph+Hall%2C+The+Shaking+of+the+Olive+Tree%2C+the+Remaining+Works+of+that+incomparable+prelate+Joseph+Hall%2C+%E2%80%A6+%28London%3A+Cadwell%2C+1660%29%2C+Via+Media%3A+the+Way+of+Peace+in+the+Five+Busy+Articles+commonly+known+by+the+name+of+Arminius%2C+Of+the+Fifth+Article+of+Perseverance%2C+pp.+376-78&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3a1212302c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3a1212302c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=Surely%20it%20is%20easy%20to%20observe,may%20yield%20without%20any%20sensible%20prejudice&amp;text=Surely%20it%20is%20easy%20to%20observe%20that%20we&amp;text=the%20defendents%20may%20yield%20without%20any%20sensible%20prejudice" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The term voluntas signi, literally, the will of the sign [the revealed will], is closely related to the term signum voluntatis, the sign of the will or purpose. It indicates an overt sign or indication that someone wills something and can therefore be understood as a revealed will or, specifically, as a revealed precept or ‘preceptive will’—thus, what is literally called the ‘signified will’ is a will that God makes known and in effect ‘signifies’ what is commanded. This signified or perceptive will moreover, does not contradict the will of the divine good pleasure, although the relationship between the two may sometimes be difficult to establish immediately. The voluntas signi, therefore, is not a ‘mere sign’ but one that corresponds with something that is truly in God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-26ffe900ba" data-kw="">
<blockquote><p>Following the Revolutionary war, religious diversity in Connecticut continued to increase. In 1784, Connecticut finally passed an “Act for Securing the Rights of Conscience,” that secured religious freedom for those “professing the Christian religion,” of whatever denomination, and decreed they no longer be taxed to support the Congregational church. But non-Christians could be taxed to support the established church, and Congregationalism remained the established state religion until 1818, when Connecticut passed a new state constitution, replacing the laws of the old colonial charter obtained in 1662. This was not the end of the power and influence of the descendants of the Puritans, however…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nancy-finlay.html">Nancy Finlay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Importance of Being Puritan: Church and State in Colonial Connecticut’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

<blockquote><p>48. For to that end also is the holy Scripture profitable, to show which is the best manner of governing a commonwealth, and that the Magistrate as being God’s Minister may by this guiding star be so directed, as that he may execute the parts of his office, according to the will of God, and may perfectly be instructed to every good work; yet the Minister is not said properly to treat of civil businesses, but of the scandals which arise about them, or of the cases of conscience which occur in the administration of the commonwealth: So also the Magistrate is not properly said to be exercised about the spiritual things of the Church, but rather about those external things which adhere unto and accompany the spiritual things. … 53. The object of ecclesiastical power is not the same with the object of the civil power, but much differing from it; for the ecclesiastical power does determine and appoint nothing concerning men’s bodies, goods, dignities, civil rights, but is employed only about the inward man, or the soul… … 56. Surely the faithful and godly ministers, although they could do it unchallenged and uncontrolled, and were therein allowed by the Magistrate (as in the prelatical times it was), yet would not usurp the power of life and death, or judge and determine concerning men’s honors, goods, inheritance, division of families, or other civil businesses; seeing they well know these things to be heterogeneous to their office: But as they ought not to entangle themselves with the judging of civil causes… 86. What then? Shall it be lawful ordinarily for ministers and elders to do what they list, or shall the governors in the Churches, glorying in the Law, by their transgression dishonor God? God forbid. For first, if they shall trespass in anything against the Magistrate or municipal Laws, whether by intermeddling in judging of civil causes, or otherwise disturbing the peace and order of the commonwealth, they are liable to civil trial and judgments, and it is in the power of the Magistrate to restrain and punish them.</p></blockquote>

<blockquote><p>9. [Maxwell’s accusation of presbyterians is false:] That the king must submit his sceptre to the presbytery. The king’s sceptre is his royal office, which is not subject to any judicature, no more than any lawful ordinance of Christ; but if the king, as a man, blaspheme God, murder the innocent, advance belly-gods (such as our prelates for the most part were) above the Lord’s inheritance, the ministers of Christ are to say, ‘The king troubles Israel, and they have the keys to open and shut heaven to, and upon the king, if he can offend.’ … 21. It is false that presbyteries usurp both swords because they censure sins which the civil magistrate should censure and punish. Elijah might be said then to mix himself with the civil business of the kingdom, because he prophesied against idolaters’ killing of the Lord’s prophets; which crime the civil magistrate was to punish. But the truth is, the assembly of Glasgow, 1637, condemned the prelates because they, being pastors, would be also lords of parliament, of session, of secret council, of exchequer, judges, barons, and in their lawless high commission, would fine, imprison, and use the sword. … 29. It is a lie that our General Assembly may repeal [civil] laws, command and expect performance of the king, or then excommunicate, subject to them, force and compel king, judges and all, to submit to them. They may not force the conscience of the poorest beggar, nor is any Assembly infallible, nor can it lay bounds upon the souls of judges, which they are to obey with blind obedience — their power is ministerial, subordinate to Christ’s law; and what civil laws parliaments make against God’s Word, they may authoritatively declare them to be unlawful, as though the emperor (Acts 15) had commanded fornication and eating of blood. Might not the Assembly forbid these in the synod?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), pp. xxii-xxiii</span></figcaption>

— Samuel Rutherford, Lex Rex... (1644; Edinburgh: Ogle, 1843), pp. xxii-xxiii">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C9.+%5BMaxwell%E2%80%99s+accusation+of+presbyterians+is+false%3A%5D+That+the+king+must+submit+his+sceptre+to+the+presbytery.+The+king%E2%80%99s+sceptre+is+his+royal+office%2C+which+is+not+subject+to+any+judicature%2C+no+more+than+any+lawful+ordinance+of+Christ%3B+but+if+the+king%2C+as+a+man%2C+blaspheme+God%2C+murder+the+innocent%2C+advance+belly-gods+%28such+as+our+prelates+for+the+most+part+were%29+above+the+Lord%E2%80%99s+inheritance%2C+the+ministers+of+Christ+are+to+say%2C+%E2%80%98The+king+troubles+Israel%2C+and+they+have+the+keys+to+open+and+shut+heaven+to%2C+and+upon+the+king%2C+if+he+can+offend.%E2%80%99+%E2%80%A6+21.+It+is+false+that+presbyteries+usurp+both+swords+because+they+censure+sins+which+the+civil+magistrate+should+censure+and+punish.+Elijah+might+be+said+then+to+mix+himself+with+the+civil+business+of+the+kingdom%2C+because+he+prophesied+against+idolaters%E2%80%99+killing+of+the+Lord%E2%80%99s+prophets%3B+which+crime+the+civil+magistrate+was+to+punish.+But+the+truth+is%2C+the+assembly+of+Glasgow%2C+1637%2C+condemned+the+prelates+because+they%2C+being+pastors%2C+would+be+also+lords+of+parliament%2C+of+session%2C+of+secret+council%2C+of+exchequer%2C+judges%2C+barons%2C+and+in+their+lawless+high+commission%2C+would+fine%2C+imprison%2C+and+use+the+sword.+%E2%80%A6+29.+It+is+a+lie+that+our+General+Assembly+may+repeal+%5Bcivil%5D+laws%2C+command+and+expect+performance+of+the+king%2C+or+then+excommunicate%2C+subject+to+them%2C+force+and+compel+king%2C+judges+and+all%2C+to+submit+to+them.+They+may+not+force+the+conscience+of+the+poorest+beggar%2C+nor+is+any+Assembly+infallible%2C+nor+can+it+lay+bounds+upon+the+souls+of+judges%2C+which+they+are+to+obey+with+blind+obedience+%E2%80%94+their+power+is+ministerial%2C+subordinate+to+Christ%E2%80%99s+law%3B+and+what+civil+laws+parliaments+make+against+God%E2%80%99

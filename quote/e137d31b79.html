<main class="wrap"><figure class="quote" id="q-e137d31b79" data-kw="">
<blockquote><p>1. Justification is an action, by which God makes an ungodly man righteous, according to the good pleasure of his will, and without any merit of his own for salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-junius.html">Francis Junius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction: On Justification by Faith in Theological Theses for Exercises in Public Disputations in the Famous Academy at Leiden (1584) at ReformedOrthodoxy.org</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0b03df12ae" data-kw="">
<blockquote><p>23. Not only are past sins of justified persons remitted but also those to come, Num. 23:25. God sees no iniquity in Jacob or perverseness in Israel. Justification has left no place for condemnation. John 5:24, ‘He who believes has eternal life and shall not come into condemnation’ — justification gives eternal life surely and immediately. It also makes the whole remission obtained for us in Christ actually ours. Neither past or present sins can be altogether fully remitted unless sins to come are in some way remitted. 24. The difference is that past sins are remitted specifically and sins to come potentially. Past sins are remitted in themselves, sins to come in the subject or the person sinning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology (Baker, 1997), ch. 27, ‘Justification’</cite>, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

— William Ames, The Marrow of Theology (Baker, 1997), ch. 27, ‘Justification’, p. 163">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C23.+Not+only+are+past+sins+of+justified+persons+remitted+but+also+those+to+come%2C+Num.+23%3A25.+God+sees+no+iniquity+in+Jacob+or+perverseness+in+Israel.+Justification+has+left+no+place+for+condemnation.+John+5%3A24%2C+%E2%80%98He+who+believes+has+eternal+life+and+shall+not+come+into+condemnation%E2%80%99+%E2%80%94+justification+gives+eternal+life+surely+and+immediately.+It+also+makes+the+whole+remission+obtained+for+us+in+Christ+actually+ours.+Neither+past+or+present+sins+can+be+altogether+fully+remitted+unless+sins+to+come+are+in+some+way+remitted.+24.+The+difference+is+that+past+sins+are+remitted+specifically+and+sins+to+come+potentially.+Past+sins+are+remitted+in+themselves%2C+sins+to+come+in+the+subject+or+the+person+sinning.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+The+Marrow+of+Theology+%28Baker%2C+1997%29%2C+ch.+27%2C+%E2%80%98Justification%E2%80%99%2C+p.+163&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0b03df12ae.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0b03df12ae.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=23.%20Not%20only%20are%20past%20sins,the%20subject%20or%20the%20person%20sinning&amp;text=23.%20Not%20only%20are%20past%20sins%20of%20justified&amp;text=come%20in%20the%20subject%20or%20the%20person%20sinning" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-513ea6e239" data-kw="">
<blockquote><p>10. The form of active justification we hold to be both the plenary remission of sins and the imputation of the righteousness of Christ; nor do we hold that these phrases ought to be either equated or confounded. The form of passive justification we constitute in the apprehension and sense of both in subjects who are capable thereof.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“10. The form of active justification we hold to be both the plenary remission of sins and the imputation of the righteousness of Christ; nor do we hold that these phrases ought to be either equated or confounded. The form of passive justification we constitute in the apprehension and sense of both in subjects who are capable thereof.”

</figure><figure class="quote" id="q-8e78e51003" data-kw="">
<blockquote><p>…in my judgment the usual solution of this appearing difficulty… in the discourse of St. James, ch. 2, v. 14 to the end, has not been in the least impeached, nor has had any new difficulty put upon it in some late discourses to that purpose… …It is taken for granted on all hands that there is no real repugnancy or contradiction between what is delivered by these two apostles… …It is taken also for granted on all other occasions that when there is an appearance of repugnancy or contradiction in any places of Scripture, if some or any of them do treat directly, designedly and largely about the matter concerning which there is a seeming repugnancy or contradiction, and others, or any other speak of the same things only obiter, occasionally, transiently, in order unto other ends, the truth is to be learned, stated and fixed from the former places… According unto this rule, it is unquestionable that the doctrine of justification before God is to be learned from the writings of the apostle Paul, and from them is light to be taken into all other places of Scripture where it is occasionally mentioned… For it must be acknowledged that he wrote of this subject of our justification before God on purpose to declare it for its own sake, and its use in the Church, and that he does it fully, largely and frequently in a constant harmony of expressions… As unto what is delivered by the apostle James, so far as our justification is included therein, things are quite otherwise. He does not undertake to declare the doctrine of our justification before God, but having another design in hand as we shall see…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 20, ‘The Doctrine of the Apostle James concerning Faith &amp; Works, its Agreement with that of St. Paul’ in The Doctrine of Justification by Faith in Works (†1683; Johnstone &amp; Hunter, 1850), 5.384-400</cite>, pp. 384-86</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

<main class="wrap"><figure class="quote" id="q-f6fc3268f2" data-kw="">
<blockquote><p>I. As in the chain of salvation justification follows calling (Rom. 8:30) and is everywhere set forth as the primary effect of faith, the topic concerning calling and faith begets the topic concerning justification. This must be handled with the greater care and accuracy as this saving doctrine is of the greatest importance in religion. It is called by Luther “the article of a standing and a falling church” (Articulus stantis, et cadentis Ecclesiae).1 By other Christians, it is termed the characteristic and basis of Christianity—not without reason—the principal rampart of the Christian religion. This being adulterated or subverted, it is impossible to retain purity of doctrine in other places. Hence Satan in every way has endeavored to corrupt this doctrine in all ages, as has been done especially in the papacy. For this reason, it is deservedly placed among the primary causes of our secession from the Roman church and of the Reformation. 1 Luther said things like this but in this form, the saying has been traced to the Reformed theologian J. H. Alsted (1618).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 2 (Phillipsburg, NJ: P&amp;R Publishing, 1992–1997), 16.1.1 (p. 633).</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9a507d44d8" data-kw="">
<blockquote><p>If Christ made satisfaction for our sins by the obedience with which He fulfilled the law, so that that [obedience] is imputed to us by God as though we ourselves had fulfilled [the law], then it follows therefrom that we are set free from obedience of the law, because—according to this hypothesis—Christ has fulfilled it for us or in our stead.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-piscator.html">Johannes Piscator</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolae ecclesiasticae, Epistle 68</cite>, p. 124b as trans. G.A. van den Brink, The Transfer of Sin: The Debate on Imputation in the English Antinomian Controversy (1690–1700)… (Brill, 2024), p. 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/active-and-passive-obedience-imputed.html">Active and Passive Obedience Imputed</a></span></div>

</figure><figure class="quote" id="q-e52f9a1a92" data-kw="">
<blockquote><p>Rule II. That justification stands in two things: First in the remission of sins by the merit of Christ’s death: Secondly in the imputation of Christ’s righteousness; which is another action of God whereby He accounts and esteems that righteousness which is in Christ, as the righteousness of that sinner which believes in Him. By Christ’s righteousness we are to understand two things: First his sufferings, specially in his death and passion; Secondly his obedience in fulfilling the Law: both which go together: for Christ in suffering obeyed, and obeying suffered. And the very shedding of his blood to which our salvation is ascribed, must not only be considered as it is passive, that is a suffering, but also as it is active, that is, an obedience, in which He showed his exceeding love both to his Father and us, and thus fulfilled the law for us. This point, if some had well thought on, they would not have placed all justification in remission of sins as they do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, ... ([Cambridge] 1598), ch. 4, ‘The Justification of a Sinner’, p. 925</span></figcaption>

</figure><figure class="quote" id="q-d970ca3fcb" data-kw="">
<blockquote><p>It is a great sin to think any sin little; but it is a greater sin to think the righteousness of Christ is not above all sin. Our disobedience is the disobedience of man; but Christ’s obedience is the obedience of God: therefore, our believing in Christ doth please God better than if we had continued innocency, and never sinned. The least sin is unpardonable without this obedience and righteousness of Christ; and the greatest is pardonable by it. Therefore, O seek in to Christ, to be clothed upon with this righteousness.</p></blockquote>

</figure><figure class="quote" id="q-502fe444b3" data-kw="">
<blockquote><p>If at this day we should take a survey of the several professions of Christianity that have any large spread in any part of the world (as of the religion of the Roman and the Reformed Churches in our quarters, of the Egyptians and Ethiopians in the South, of the Grecians and other Christians in the Eastern parts) and should put-by the points wherein they differ one from another, and gather into one body the rest of the articles wherein they do all generally agree, we should find that in those propositions which without all controversy are universally received in the whole Christian world, so much truth is contained, as being joined with holy obedience, may be sufficient to bring a man unto everlasting salvation. Neither have we cause to doubt, but that as many as do walk according to this rule (neither overthrowing that which they have builded by superinducing any damnable heresies thereupon, nor otherwise vitiating their holy faith with a lewd and wicked conversation), peace shall be upon them and mercy, and upon the Israel of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Opinions of Certain Reverend &amp; Learned Divines concerning the Fundamental Points of the True Protestant Religion, &amp; the Right Government of Reformed Churches</cite>, ([Oxford] Downes, 1643), ‘The Judgment of… Lord Archbishop of Armagh, delivered in a Sermon of his preached before King James at Wansted, June 20th, 1624’, pp. 6-7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

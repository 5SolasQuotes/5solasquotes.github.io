<main class="wrap"><figure class="quote" id="q-60858bca7e" data-kw="">
<blockquote><p>Now England cannot abide this gear, they cannot be content to hear God’s Minister and his threatening for their sin. Though the Sermon be never so good, though it be never so true. It is a naughty fellow, a seditious fellow, he maketh trouble and rebellion in the Realm, he lacketh discretion, but the Ninevites rebuked not Jonas that he lacketh discretion, or that he spake out of time, that his Sermon was out of season made.

But in England if God’s Preacher, Gods Minister be any thing quick, or do speak sharply, then he is a foolish fellow, he is rash, he lacketh discretion. Nowadays if they cannot reprove the doctrine that is preached: then they will reprove the Preacher that he lacketh dew consideration of the times, and that he is of learning sufficient, but he wanteth discretion, what a time is this picked out to preach such things, he should have a respect and a regard to the time, and to the state of things, and of the Common weal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-latimer.html">Hugh Latimer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A most faithful sermon preached before the King’s most excellent Majesty, and his most honourable Council, in his court at Westminster</cite>, (London: John Day, 1550), unpaginated.</span></figcaption>

</figure><figure class="quote" id="q-c327d58595" data-kw="">
<blockquote><p>At Glasgow, Mr. Andrew Gray, a youth of twenty-two years at most, lately laureate at St. Andrew’s, upon one preaching or two at Glasgow, Mr. Patrick Gillespie and his friends will have him admitted to his place. I refused to consent; the youth being so young, and utterly a stranger to us; his trials of expectant being hastily past in the Presbytery of Hamilton; and none of the ministers either of Edinburgh or St. Andrew’s, the places of his residence, being acquainted with him, as he professed; also his voice being so weak, that the most in our kirks heard him not.

The Magistrates and Town-Counsel being utterly against his admission, dealt with him earnestly not to trouble them: at first, his modesty was so great, that a small impediment seemed enough to scare him from accepting of any charge; but so soon as our Session (which is bot the echo of what our brethren speaks) had given him a call, without haste he went on to his trials, and, over the belly of the town’s protestation, was admitted by their part of the Presbytery minister of Glasgow.

His voice is not yet so good as to be heard by diverse. He has the new guise of preaching, which Mr. Hew Binning and Mr. Robert Leighton began, contemning the ordinary way of exponing and dividing a text, of railing doctrines and uses; but runs out in a discourse on some common head, in a high, romancing, unscriptural style, tickling the ear for the present, and moving the affections in some, but leaving, as he confesses, little or nought to the memory and understanding. This we must misken [sic], for we cannot help it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William Spang, 21 July 1654 in The Letters and Journals of Robert Baillie, ed. David Laing (3 vols, Edinburgh: Robert Ogle, 1842), 3: 258-59.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><figure class="quote" id="q-237da2d55b" data-kw="">
<blockquote><p>That God cannot but prove efficient when those means are used for the salvation of men which he himself hath ordained for that purpose. Although, therefore, the preaching of the Gospel by men weak, despised, defiled by sin, may seem an insignificant means to the attainment of human salvation; yet, since it is the ordinance and will of God, it will prove most effectual: for the foolishness of God is wiser than men, and the weakness of God is stronger than man, 1 Cor. i. 25. There will be no need therefore to expect either an angel from heaven, or extraordinary visions and divine revelations; we have only to hearken to apostolic doctrine, and it will be the power of God to salvation to all that believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), i, 9.</span></figcaption>

</figure><figure class="quote" id="q-7c702f3844" data-kw="">
<blockquote><p>REV. AND DEAR SIR,

I rejoice to hear that my poor labours have been of any service to any in New England. All glory be to the great and glorious God, when out of the mouths of babes and sucklings, he is pleased sometimes to ordain praise. I rejoice to hear the progress of God’s work among you, this last summer and that there are any appearances of its continuance: Blessed be God, dear brother! As to the subject you mention of laymen being sent out to exhort and to teach, supposing them to be real converts, I cannot but think, if it be encouraged and continued, it will be of dreadful consequence to the church’s peace and soundness in the faith. I will not gainsay but that private persons may be of service to the church of God by private, humble, fraternal reproof, and exhortations; and no doubt it is their duty to be faithful in these things.

But in the mean time if christian prudence and humility do not attend their essays, they are like to be prejudicial to the church’s real well-being. But for ignorant young converts to take upon them authoritatively to instruct and exhort publicly, tends to introduce the greatest errors and the grossest anarchy and confusion. The ministers of Christ should be apt to teach and able to convince gainsayers, and it is dangerous to the pure church of God, when those are novices, whose lips should preserve knowledge. It is base presumption, whatever zeal be pretended to, notwithstanding, for any persons to take this honour to themselves, unless they be called of God, as Aaron.

I know most young zealots are apt, through ignorance, inconsideration, and pride of heart, to undertake what they have no proper qualifications for: and, through their imprudences and enthusiasm, the church of God suffers. I think all that fear God, should rise up and crush the enthusiastic creature in the egg. Dear brother, the times we live in are dangerous. The churches in America and elsewhere are in great hazard of enthusiasm: we have need to think of the maxim, principiis obsta. May Zion’s King protect his church! I add no more, but love, and beg a remembrance in your prayers.

GILBERT TENNENT.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-tennent.html">Gilbert Tennent</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Jonathan Edwards, [1741] in S. E. Dwight, The Life of President Edwards (New York: G. &amp; C. &amp; H. Carvill, 1830), p. 153.</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-965b1a1ef8" data-kw="">
<blockquote><p>That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zacharias-ursinus-caspar-olevianus.html">Zacharias Ursinus &amp; Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heidelberg Catechism</cite>, Q. 54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/nature-of-the-church.html">Nature of the Church</a> › <a href="../topics/the-church/nature-of-the-church/catholic-church.html">Catholic church</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 26.4</span></figcaption>

</figure><figure class="quote" id="q-bf384d238d" data-kw="">
<blockquote><p>There, instead of the ministry of the word, prevails a perverted government, compounded of lies, a government which partly extinguishes, partly suppresses, the pure light. In place of the Lord&#x27;s Supper, the foulest sacrilege has entered, the worship of God is deformed by a varied mass of intolerable superstitions; doctrine (without which Christianity exists not) is wholly buried and exploded, the public assemblies are schools of idolatry and impiety.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.2.2</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There, instead of the ministry of the word, prevails a perverted government, compounded of lies, a government which partly extinguishes, partly suppresses, the pure light. In place of the Lord&#x27;s Supper, the foulest sacrilege has entered, the worship of God is deformed by a varied mass of intolerable superstitions; doctrine (without which Christianity exists not) is wholly buried and exploded, the public assemblies are schools of idolatry and impiety.”

— John Calvin, Institutes of the Christian Religion, 4.2.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere%2C+instead+of+the+ministry+of+the+word%2C+prevails+a+perverted+government%2C+compounded+of+lies%2C+a+government+which+partly+extinguishes%2C+partly+suppresses%2C+the+pure+light.+In+place+of+the+Lord%27s+Supper%2C+the+foulest+sacrilege+has+entered%2C+the+worship+of+God+is+deformed+by+a+varied+mass+of+intolerable+superstitions%3B+doctrine+%28without+which+Christianity+exists+not%29+is+wholly+buried+and+exploded%2C+the+public+assemblies+are+schools+of+idolatry+and+impiety.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+4.2.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fbf384d238d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/bf384d238d.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>

</figure><figure class="quote" id="q-669e01d933" data-kw="">
<blockquote><p>Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Pope Leo X</cite>, p. 2</span></figcaption>

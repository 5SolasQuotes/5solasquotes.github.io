<main class="wrap"><figure class="quote" id="q-5ad51bb31d" data-kw="">
<blockquote><p>I know that in the primitive church they had in every church certain Seniors, to whom the government of the congregation was committed, but that was before there was any Christian Prince or magistrate that openly professed the Gospel, and before there was any Church by public authority established, or under Civil government: I told you before, that the diversity of time and state of the church requireth diversity of government in the same. …

Both the names &amp; offices of Seniors were extinguished before Ambrose time, as he himself doth testify, writing upon the fifth of the first to Timothy.

Indeed as Ambrose saith, writing upon the fifth of the first to Timothy, The Synagogue, and after, the Church had Seniors, without whose counsel nothing was done in the Church, but that was before his time, and before there was any Christian Magistrates, or any Church established.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-whitgift.html">John Whitgift</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The defense of the answer to the Admonition against the reply of T.C.</cite>, (London: Henry Binneman, 1574), Tract 17.2.7, 22, pp 638-39, 651.</span></figcaption>

</figure><figure class="quote" id="q-1737c351a3" data-kw="">
<blockquote><p>He adds, secondly, the extent of this subjection and obedience, even to all things: which is not to be understood of all things absolutely, and without exception, Acts 5:29, but all things lawful, godly, honest, and which are not forbidden in the word of God, even though they cross the humor of the wives, and argue little discretion in the husband who commands them. Numb. 5:1-15, etc.; for nothing is excepted here but what is contrary to that subjection which is due to Him who has commanded this subjection of wives to their husbands, as Paul comments upon an expression like to this, 1 Cor. 15:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians</cite>, … (London: T. Ward, 1841) | on Eph. 5:24, p. 243</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a></span></div>

</figure><figure class="quote" id="q-acd0b817f0" data-kw="">
<blockquote><p>Nor are women, sons, servants, debarred from voicing in election because it is a Church-power, for it is no power of jurisdiction. For: 1. Their tacit [understood or implied without being stated] voices and consents are not excluded, because they must try the spirits, and not upon trust and fide implicita [implicit faith] believe every teacher more than men, or believe as the Church believes, more than their husbands, nor must they take doctrines as truth upon their husband’s word; nor are women so excluded from speaking in the Church as [that] they may upon no occasion: confess their faith, 2. profess vocally repentance, 3. depose as witnesses, [or] 4. accuse the guilty before the binding Church.

4. Nor may a [civil] corporation cast out a major [an official] by an authoritative power such as binding and loosing is, Mt. 18 [that is, the power by which they do it is not of the same kind as ecclesiastical power].

5. We seek a warrant why the votes of women in choosing their pastors must more be included in the votes of the male than their being essential parts of the redeemed Church is included in the males, or their confessing publicly that Jesus is the Christ, as many women martyrs and sons and servants have gloriously done; and yet their confession of Christ to the death must be personal, and not included in the confession of husband or parents, as Mt. 10:32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), p. 257</span></figcaption>

</figure><figure class="quote" id="q-0d603e0c4b" data-kw="">
<blockquote><p>Following in every way the decrees of the holy fathers and recognising the canon which has recently been read out—the canon of the 150 most devout bishops who assembled in the time of the great Theodosius of pious memory, then emperor, in imperial Constantinople, new Rome—we issue the same decree and resolution concerning the prerogatives of the most holy church of the same Constantinople, new Rome. The fathers rightly accorded prerogatives to the see of older Rome, since that is an imperial city; and moved by the same purpose the 150 most devout bishops apportioned equal prerogatives to the most holy see of new Rome, reasonably judging that the city which is honoured by the imperial power and senate and enjoying privileges equalling older imperial Rome, should also be elevated to her level in ecclesiastical affairs and take second place after her. The metropolitans of the dioceses of Pontus, Asia and Thrace, but only these, as well as the bishops of these dioceses who work among non-Greeks, are to be ordained by the aforesaid most holy see of the most holy church in Constantinople. That is, each metropolitan of the aforesaid dioceses along with the bishops of the province ordain the bishops of the province, as has been declared in the divine canons; but the metropolitans of the aforesaid dioceses, as has been said, are to be ordained by the archbishop of Constantinople, once agreement has been reached by vote in the usual way and has been reported to him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/canon-28-of-the-council-of-chalcedon.html">Council of Chalcedon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 451 AD</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry.html">Church Government and the Ministry</a></span></div>

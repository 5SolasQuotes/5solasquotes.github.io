<main class="wrap"><figure class="quote" id="q-13b90e1f73" data-kw="">
<blockquote><p>III. (2) We must distinguish between simple precepts (i.e., merely moral) belonging to natural right and mixed precepts (moral and ceremonial, partly of natural and partly of positive right; as the fourth commandment concerning the Sabbath, which is moral as to the genus of public worship, but ceremonial as to the circumstance of the defined time; and the fifth, which is moral as to the prescribed duty and the promise of longevity, but ceremonial as to the appended promise of the land of Canaan).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, vol. 2, 11th Topic, The Law of God, 2nd Question, The Nature of the Moral Law, section 3, p. 8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-327ff82937" data-kw="">
<blockquote><p>…this exercise of discipline for restraining of scandals is to be subservient to the preaching of the Word: which is the main and great edifying ordinance; Therefore discipline would be ordered so as it may not mar, but further that… 1. That no censure would be blindly or implicitly made use of, but both in reference to the party, and others, there would be instruction, exhortation, conviction, etc. by the Word going before or alongst with the same. In which respect (though improperly) censures may be some way looked upon as sacraments in a large sense in these particular cases, because there is in them both some signifying and confirming use; They being considered with respect to the end wherefore they were appointed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Dying Man’s Testament to the Church of Scotland, or a Treatise concerning Scandal</cite>, … (Edinburgh, 1659), pt. 2, ch. 2, p. 69</span></figcaption>

</figure><figure class="quote" id="q-4cf11c097b" data-kw="">
<blockquote><p>As for the prelate, who is pretended to be the pastor of pastors and an ecclesiastical creature, having majority of power, both of order and jurisdiction above the pastor and doctor, the Church of Scotland did ever repute such an one the fifth element, and the sixth finger in the hand, as having no warrant in the Word, and therefore unlawful, Ex. 25:9; Heb. 8:5; 1 Chron. 8. 19. 11, 12, 13; 1 Kings 6:38, as also expressly condemned, Lk 22:24-26; 1 Pet. 5:3-4; Mt. 18:18; 1 Cor. 5:4-6; Acts 1:23; 15:24. In the first constitution and infancy of our Church there were some visitors and superintendents for planting of churches, because breasts and hair of our churches were not grown, after the example of the apostles, who sent such to plant and visit churches, and appoint elders in congregations, Acts 8:14-16; 13:14-16; 14:23; Tit. 1:5-9; 21:17-18, but after the Church was planted there was no need of such. Titular doctors, who were pastors only, and taught not in the schools, but were only previous dispositions to episcopacy, as [the] blue color prepares a cloth for purple, our Church never allowed, upon the grounds allowing lawful doctors, as the Scripture does, Rom. 12:7-8; 1 Cor. 12:28; Eph. 4:11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, … (1642), ch. 20, 2nd Article, ‘Officers of the Church’</span></figcaption>

</figure><figure class="quote" id="q-6a15cfada7" data-kw="">
<blockquote><p>27. But ordinances about such circumstances as place, time and the like are rightly said by the best authorities to be partly divine and partly human. They are grounded in part upon the will of God because of their chief and primary purpose, and partly upon man’s prudence, insofar as a special observation agreeable to God’s will is concerned. If no human error is made in this matter, the ordinance is to be held as wholly divine. It is the will of God that the church meet at the most convenient hour of the day, all circumstances considered. If, therefore, no error occurs in estimating the circumstances, the hour assigned for meeting after due consideration must be acknowledged as if appointed by God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, tr. John D. Eusden (1623; Baker, 1997), bk. 2, in ch. 14, ‘The Manner of Divine Worship’, section 27, p. 286</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a></span></div>

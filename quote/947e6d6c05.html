<main class="wrap"><figure class="quote" id="q-947e6d6c05" data-kw="">
<blockquote><p>Ordinary Ministers follow the form of the Church that is instituted; they are not Ecumenical, National, Provincial, or Diocesan Bishops, but Elders of one Congregation, who in the same sense are also called Bishops in the Scriptures. 29. Those transcendent members of the Hierarchy were merely human creations, brought into the Church without any Divine precept or example.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology</cite>, 1.39.28–29</span></figcaption>

</figure><figure class="quote" id="q-aacb89e623" data-kw="">
<blockquote><p>In both epistles commandment is given that only monogamists should be chosen for the clerical office whether as bishops or as presbyters. Indeed with the ancients these names were synonymous, one alluding to the office, the other to the age of the clergy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome.html">Jerome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter 69 (to Oceanus)</cite>, §3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/elders.html">Elders</a></span></div>
<div class="actions"><button class="copy" data-copy="“In both epistles commandment is given that only monogamists should be chosen for the clerical office whether as bishops or as presbyters. Indeed with the ancients these names were synonymous, one alluding to the office, the other to the age of the clergy.”

</figure><figure class="quote" id="q-c937f8d010" data-kw="">
<blockquote><p>All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.4.2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/offices.html">Offices</a> › <a href="../topics/church-government-and-the-ministry/offices/bishop-and-presbyter.html">Bishop and presbyter</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/forms-of-government.html">Forms of Government</a> › <a href="../topics/church-government-and-the-ministry/forms-of-government/episcopal-presbyterian-congregational.html">Episcopal, presbyterian, congregational</a></span></div>
<div class="actions"><button class="copy" data-copy="“All, therefore, to whom the office of teaching was committed, they called presbyters, and in each city these presbyters selected one of their number to whom they gave the special title of bishop, lest, as usually happens, from equality dissension should arise. The bishop, however, was not so superior in honour and dignity as to have dominion over his colleagues, but as it belongs to a president in an assembly to bring matters before them, collect their opinions, take precedence of others in consulting, advising, exhorting, guide the whole procedure by his authority, and execute what is decreed by common consent, a bishop held the same office in a meeting of presbyters. And the ancients themselves confess that this practice was introduced by human arrangement, according to the exigency of the times.”

— John Calvin, Institutes of the Christian Religion, 4.4.2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAll%2C%20therefore%2C%20to%20whom%20the%20office%20of%20teaching%20was%20committed%2C%20they%20called%20presbyters%2C%20and%20in%20each%20city%20these%20presbyters%20selected%20one%20of%20their%20number%20to%20whom%20they%20gave%20the%20special%20title%20of%20bishop%2C%20lest%2C%20as%20usually%20happens%2C%20from%20equality%20dissension%20should%20arise.%20The%20bishop%2C%20however%2C%20was%20not%20so%20superior%20in%20honour%20and%20dignity%20as%20to%20have%20dominion%20over%20his%20colleagues%2C%20but%20as%20it%20belongs%20to%20a%20president%20in%20an%20assembly%20to%20bring%20matters%20before%20them%2C%20collect%20their%20opinions%2C%20take%20precedence%20of%20others%20in%20consulting%2C%20advising%2C%20exhorting%2C%20guide%20the%20whole%20procedure%20by%20his%20authority%2C%20and%20execute%20what%20is%20decreed%20by%20common%20consent%2C%20a%20bishop%20held%20the%20same%20office%20in%20a%20meeting%20of%20presbyters.%20And%20the%20ancients%20themselves%20confess%20that%20this%20practice%20was%20introduced%20by%20human%20arrangement%2C%20according%20to%20the%20exigency%20of%20the%20times.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Institutes%20of%20the%20Christian%20Religion%2C%204.4.2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc937f8d010.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c937f8d010.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/institutes" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-636237e129" data-kw="">
<blockquote><p>If &quot;elders&quot; and &quot;bishops&quot; be not the same persons, having the same office, the same function, and the same duties, and the same names, it is impossible, So far as I understand, how it should be expressed: for these elders are they whom the Holy Ghost made bishops, they were many of them in the same church, their duty it was to attend unto the flock and to feed the church, which comprise all the duties, the whole function of elders and bishops; which must therefore be the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Nature of a Gospel Church and Its Government</cite>, ch. 4 (Works 16)</span></figcaption>

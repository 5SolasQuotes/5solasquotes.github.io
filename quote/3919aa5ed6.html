</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c33103c99" data-kw="">
<blockquote><p>Second, there are means of a most indispensable kind to be employed in the way of explanation and instruction, counsel and persuasion, to secure the convictions and concurrence of the private members of the Church, in whatever act or declaration the rulers, in the exercise of their judicial, or legislative, or administrative functions, may find it necessary for them to perform or to adopt. Without the use of such means to carry the conscience and understanding of the members of the Church along with them in all that they do and declare, the office-bearers are not at liberty to use or enforce their peculiar power at all. And it is only when all such means have been employed and exhausted without effect, and when the members of the Church, so dealt with in the way of Christian persuasion and instruction, still refuse their concurrence, that it may be necessary and is lawful to use authority to strengthen the appeal, and to fall back upon the ultimate resource of all societies, — namely, the inherent right of the rulers to rule, and the no less inherent duty of the ruled to obey.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-bannerman.html">James Bannerman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Church of Christ, vol. 1 (Edinburgh, 1868)</cite>, pp. 241-3</span></figcaption>

ne</a></div>

<blockquote><p>Answer: 1. We owe to equals, to Mahomet, conditional and cautionary faith and obedience; thus, I believe what Mahomet says, so he speak God’s Word; yea, so Samaritans who worshipped they knew not what (Jn. 4:26) gave faith to their teachers in a blind way, so they speak according to God’s Word. 2. It follows in no sort, if rulers are only to be obeyed when they bring God’s Word, that then they are no more to be obeyed than equals and inferiors, because there is a double obedience, one of conscience, and [one] objective, coming from the thing commanded; And in respect of this, the Word has no less authority, and does no less challenge obedience of conscience, and objective, when my equal speaks it in a private way, yea, when I write it in my muse, than when a pastor speaks it by public authority; For we teach against Papists that the Word borrows no authority from men, nor is it with certainty of faith to be received as the Word of man, but as indeed the Word of God, as the Scripture says: 1. There is another obedience-official, which is also obedience of conscience, because the Fifth Commandment enjoins it. Yet not obedience of conscience coming from the particular [positive aspect] commanded in human laws, as human; so I owe obedience of subjection, and submission of affection, of fear, love, honor, respect, by virtue of the Fifth Commandment to rulers when they command according to God’s Word, and this I owe not to equals or inferiors; and so it follows not that the power of rulers and synods is titular, because they must warrant their mandates from the Word… But 3. That I owe no more objective subjection of conscience to this, ‘Thou shalt not murder’, ‘Believe in Jesus Christ,’ when rulers and pastors command them, than when I read them in God’s Word… …whether public or private person, adds not any intrinsical authority to the Word, for then the Word should be more or less God’s Word, as the bearers were public, or private, more or less worthy. As God’s Word spoken by Amos, a prophet, should not be a word of such intrinsical authority as spoken by Moses, both a prince and a prophet. 4. …and there is reason that synods and pastors, should rather promulgate God’s laws than the people: 1. Because God has given to them by office, the key of knowledge. 2. Because by office they are watchmen, and so have authority of office to hear the Law at God’s mouth, and in synods to give directories or canons according to that Word, which people have not, and that their canons must be according to God’s Word, is said in the Word, Neh. 10:32, “Also we made ordinances for us… (v. 34) as it is written in the law of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646), Ch. 2, Question 2, ‘Whether Human Laws Bind the Conscience or Not?’</cite>, pp. 210-11</span></figcaption>

</figure><figure class="quote" id="q-6649a5160f" data-kw="">
<blockquote><p>…for rulers in making laws, and creating by their sole pleasure goodness-moral, in particular matters without the Word of God, are not God’s servants, nor is human authority as human, the nearest cause of obligation of conscience, instamped in these laws, nor is it the cause at all, and therefore to resist them, is not to resist God. They be God’s instruments and ministers in: 1. Propounding and expounding God’s laws. 2. In executing them and defending them from the violence of men. 3. In making positive and directory civil laws for civil government that are laws improperly so called, which bind the conscience as above is said, insofar as they have dependence upon God’s Law; For James says, ‘There is but one Lawgiver’ [James 4:12]. As for Church-canons, all, except physical circumstances in them, are to be warranted by the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646)</cite>, Ch. 2, Question 2, p. 208</span></figcaption>

</figure><figure class="quote" id="q-67509949cf" data-kw="Councils under Scripture">
<blockquote><p>The weightiest controversies have been determined and settled in councils, but not by the absolute authority of the council itself, but by the judgment and authority of scripture in the council. Pious bishops never assembled to define a point themselves by their own authority, but by that of scripture. Therefore all religious councils have ascribed the supreme decision to the scriptures. … Since, then, councils, whenever they are good and pious, follow the scriptures, it is manifest that the supreme authority of judging belongs to the scriptures.</p></blockquote>

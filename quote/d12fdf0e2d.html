<main class="wrap"><figure class="quote" id="q-d12fdf0e2d" data-kw="">
<blockquote><p>Bishops, Priests, and Deacons, are not commanded by God&#x27;s Law, either to vow the estate of single life, or to abstain from marriage: therefore it is lawful for them, as for all other Christian men, to marry at their own discretion, as they shall judge the same to serve better to godliness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/church-of-england.html">Church of England</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Thirty-Nine Articles</cite>, 1563, Art. 32</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc9b2435c9" data-kw="">
<blockquote><p>Whoever chooses celibacy because he detests marriage as an unclean thing, such a one, says Paul, not only does not please God but follows a doctrine of demons (1 Tim. 4:1). And anyone who prefers celibacy on account of Epicurean ease, likewise anyone who abstains from marriage only in order to escape the burdens of a household, such a one, Clement rightly says, Stromata, Bk. 3, sins against charity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-chemnitz.html">Martin Chemnitz</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of the Council of Trent</cite>, Part III, First Topic (Chastity, Celibacy, and Virginity), Sec. II, ch. II</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/celibacy.html">Celibacy</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/monasticism.html">Monasticism</a></span></div>
<div class="actions"><button class="copy" data-copy="“Whoever chooses celibacy because he detests marriage as an unclean thing, such a one, says Paul, not only does not please God but follows a doctrine of demons (1 Tim. 4:1). And anyone who prefers celibacy on account of Epicurean ease, likewise anyone who abstains from marriage only in order to escape the burdens of a household, such a one, Clement rightly says, Stromata, Bk. 3, sins against charity.”

— Martin Chemnitz, Examination of the Council of Trent, Part III, First Topic (Chastity, Celibacy, and Virginity), Sec. II, ch. II">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhoever%20chooses%20celibacy%20because%20he%20detests%20marriage%20as%20an%20unclean%20thing%2C%20such%20a%20one%2C%20says%20Paul%2C%20not%20only%20does%20not%20please%20God%20but%20follows%20a%20doctrine%20of%20demons%20%281%20Tim.%204%3A1%29.%20And%20anyone%20who%20prefers%20celibacy%20on%20account%20of%20Epicurean%20ease%2C%20likewise%20anyone%20who%20abstains%20from%20marriage%20only%20in%20order%20to%20escape%20the%20burdens%20of%20a%20household%2C%20such%20a%20one%2C%20Clement%20rightly%20says%2C%20Stromata%2C%20Bk.%203%2C%20sins%20against%20charity.%E2%80%9D%0A%0A%E2%80%94%20Martin%20Chemnitz%2C%20Examination%20of%20the%20Council%20of%20Trent%2C%20Part%20III%2C%20First%20Topic%20%28Chastity%2C%20Celibacy%2C%20and%20Virginity%29%2C%20Sec.%20II%2C%20ch.%20II&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdc9b2435c9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/dc9b2435c9.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-a6d63b8e1f" data-kw="">
<blockquote><p>It reproves and condemns the church of Rome, who from the Alpha of their religion to the Omega, are wholly idolatrous. They make images of God the Father,—painting him in their church windows as an old man,—and an image of Christ on the crucifix; and, because it is against the letter of this commandment, therefore they sacrilegiously blot out the second commandment out of their catechises, dividing the tenth commandment into two.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Ten Commandments</cite>, Second Commandment, p. 96</span></figcaption>

</figure><figure class="quote" id="q-d9cb792a33" data-kw="">
<blockquote><p>Meanwhile, seeing that this brutish stupidity has overspread the globe, men longing after visible forms of God, and so forming deities of wood and stone, silver and gold, or of any other dead and corruptible matter, we must hold it as a first principle, that as often as any form is assigned to God, his glory is corrupted by an impious lie.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.11.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a> › <a href="../topics/worship/idolatry-and-images/images-icons-and-crucifixes.html">Images, icons and crucifixes</a></span><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/images.html">Images</a></span></div>

</figure><figure class="quote" id="q-4d7398975f" data-kw="celibacy">
<blockquote><p>What are thrust forward as evangelical counsels are either commanded in the word (such as the love of enemies [Mt. 5:44; Rom. 12:20]; the suffering of injuries [Mt. 5:39]; chastity or even celibacy, if the gift of continence is possessed and it is required for any reason [1 Cor. 9:5]; voluntary poverty for the sake of Christ and the gospel [Lk. 14:33; Mt. 16:24]); or they have been invented by men without the authority of the word and rest upon no other ground than that of voluntary worship (as regular obedience, which is repugnant to the liberty in which Christ has established us [Gal. 5:1] and according to which we ought no longer to be made the servants of men [1 Cor. 7:23]; perpetual continence, because Christ testifies that this is not a gift belonging to every one [Mt. 19:11] and by the apostle he commands, “If they cannot contain, let them marry: for it is better to marry than to burn” [1 Cor. 7:9]; voluntary poverty, such as is recommended by the papists, because no one without a special call or necessity ought to throw away his resources [Mt. 19:21, 27], lest he tempt God [Mt. 4:7] or be compelled to neglect charity towards his neighbor [Eph. 4:28]).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/rome/worship.html">Rome: Worship</a> › <a href="../topics/rome/worship/celibacy.html">Celibacy</a></span></div>

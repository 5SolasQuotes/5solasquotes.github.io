<blockquote><p>3. Immodest spectacles: lascivious representations on a stage, wanton places, amorous books, etc.

4. Lewd company, which is as pitch: touch pitch and it defiles. This is it which the wiseman intends about fire, Prov. 6:27-28, Young mens and maids dalliance: so husbands and wives of others, without just cause, are occasions of whoredom and adultery. … 6. Lascivious dancing and masking, Mt. 14:6-7.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-75f12122c0" data-kw="">
<blockquote><p>…I will set down a catalogue of inventions of men used for religious ends and uses without any commandment of God, and that both before the Law and under the Law, and under the Gospel. First, before the Law we read of these things: The laying of the hand under the thigh in swearing, Gen. 24, etc. [Gen. 24:26, “And the man bowed down his head, and worshipped the Lord.”] Jacob’s pillar erected, as a religious monument, Gen. 28:18. Secondly, under the Law we read of these instances: [Josh. 7:6, “And Joshua rent his clothes, and fell to the earth upon his face before the ark of the Lord until the eventide, he and the elders of Israel, and put dust upon their heads.”] The altar of the two tribes and a half, Josh. 22:10 &amp; 27:30. [Josh. 24:25-27, “So Joshua made a covenant with the people that day, and set them a statute and an ordinance in Shechem. And Joshua wrote these words in the book of the law of God, and took a great stone, and set it up there under an oak, that was by the sanctuary of the Lord. And Joshua said unto all the people, Behold, this stone shall be a witness unto us; for it hath heard all the words of the Lord which he spake unto us: it shall be therefore a witness unto you, lest ye deny your God.] [1 Sam. 7:5-6, “Samuel said, Gather all Israel to Mizpeh, and I will pray for you unto the Lord. And they gathered together to Mizpeh, and drew water, and poured it out before the Lord, and fasted on that day, and said there, ‘We have sinned against the Lord.&#x27;”] David’s dancing and playing on all sorts of instruments and songs before the ark, 1 Chron. 13:8 and 15:16 and 2 Sam. 6:14. David’s wearing of a linen ephod, the garment of the Levites, 1 Chron. 15:27. David’s appointing of the offices of the Levites and his bringing in of the new order of singing men into the Temple, 1 Chron. 24 &amp; 25. The use of sackcloth and ashes in fasting. Solomon built another altar besides the altar of the Lord, 2 Chron. 7:7. Hezekiah kept the Passeover at a time not appointed by the Law, and the people kept it seven days longer, 2 Chron. 30:2-3, 23. About the celebration of the Passover, it is manifest that the godly Jews brought in of their own heads:

1. The gesture of sitting, which Christ Himself also used.

2. The solemn use of the cup, of which mention is made also that Christ used it, Lk. 22:17. The Rechabites abstinence not only from wine (according to the Law of the Nazarites), but from husbandry and houses, Jer. 35. The Jews had everywhere synagogues, which were not commanded by the Law, Lk. 7:5. [Jer. 34:18-19, “And I will give the men that have transgressed my covenant, which have not performed the words of the covenant which they had made before me, when they cut the calf in twain, and passed between the parts thereof, The princes of Judah, and the princes of Jerusalem, the eunuchs, and the priests, and all the people of the land, which passed between the parts of the calf;”] Mordecai appointed the feasts of Pur, or ‘lots’. Judas Maccabeus appointed the feast of Tabernacles, which our Saviour graced with his presence [Jn. 7:2]. Thirdly, under the Gospel: Our Savior Christ approved the gesture of sitting and the cup at the Passover, the Jewish synagogues, and the feast of Tabernacles. The apostle Paul used the Jewish ceremonies when they were no more the ordinances of God, as circumcision, shaving the head, purifying, vowing, contributing, yea sacrificing, Acts 21. Abstaining from meat sacrificed to idols. The observation of the Jewish Sabbath. The women’s coverings, 1 Cor. 11. The love-feasts. The holy kiss.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary: or Sermons upon the Second Chapter of the First Epistle of Saint Peter</cite>, ... (London, 1623), on 1 Pet. 2:13, pp. 588-90</span></figcaption>

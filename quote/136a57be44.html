<main class="wrap"><figure class="quote" id="q-136a57be44" data-kw="">
<blockquote><p>Are you polluted? I offer him to you, as made unto you sanctification. Are you miserable and forlorn? I offer him to you, as made of God unto you complete redemption. Are you hard-hearted ? I offer him in that promise, I will take away the heart of stone. Are you content that he break your hard heart, according to his promise, Come then, put your hard heart in his hands. Are you a wretched backslider, that has back-slidden an hundred times, a thousand times more than an hundred? I offer him in that promise, I will heal your backslidings. Are your corruptions strong and prevalent ? I offer him in that promise, I will subdue your iniquities. Are you pleased that he do so? Are you afraid, that you revolt more and more? I offer him in that promise, I will put my Spirit within you, and cause you to walk in my statutes. I will put my fear in your heart, and you shall not depart from me. Are you afraid you were never elected? Meddle not with that secret; but according to the revealed will of God, I offer God’s chief Elect to you, in whom his soul is well pleased; and if your heart go in to the offer, and you make him your Elect too, by choosing him, then your election is sure. Are you afraid you have sinned the sin against the Holy Ghost? I tell you, that as your fear of that says you were never guilty of it, so I offer the Man that is God’s Fellow; and if you be content to have him, you shall never be guilty of it. Are you full of enmity against God? I offer him as a Saviour that can kill your enmity: Do you consent that he do so? Are you an impenitent creature, destitute of repentance? I offer him as a Prince and a Saviour, exalted to give repentance and remission of sin. Do you consent? Have you received him formerly? I offer him anew, that you may receive him again, and take a more larger armful of him than ever.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ralph-erskine.html">Ralph Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Sword of Justice Awakened Against God’s Fellow” in The Practical Works of Ralph Erskine, vol. 1 (William Smith, 1878), 79–80.</cite></span></figcaption>

<blockquote><p>45. Without a doubt, He has spoken this comforting word also for the fainthearted, who, though they are godly and prepared for the Last Day, are yet filled with great anxiety and [thus] hinder their desire for this coming, which is especially found at the end of the world; therefore, He calls it their redemption. For at the end of the world, when sin will so terribly hold sway, and along with sin the second part (the punishment for sin with pestilence, war, and famine) will also hold sway, it is necessary that believers have a strong confidence and comfort against both afflictions: sin and its punishment. Therefore, He uses the sweet word “redemption,” which all hearts gladly hear. What is redemption? Who would not gladly be redeemed? Who would desire to remain such a desert, both of sin and of punishment? Who would not wish an end to such misery, such danger for souls, such ruin for man—especially when Christ so sweetly allures, invites, and comforts us? 46. The godless preachers of dreams [cf. Jer. 23:25–28] should be censured; in their sermons they hide these words of Christ from the hearts of people and turn faith away from them, who want to make people godly by terrifying them, and who afterward prepare [people] for this day with their own good works and satisfaction for their sins. Here despair, fear, and terror must remain and grow—and with it, hatred, aversion, and abhorrence for the coming of the Lord—and enmity against God must be established in the heart. Meanwhile, they teach people to picture Christ as nothing but a stern judge whom they are to appease and expiate by their works, and never regard [Him] as the Redeemer, as He calls and offers Himself, of whom we are to expect in firm faith that out of pure grace He will redeem us from sin and all evil. 47. See, this is the way it always happens. When people do not preach the Gospel correctly, and only pursue hearts with commands and threats, they only drive them farther from God and only make them angry at God. They ought to terrify, but only the obstinate and hardened; but afterward, when people have become fearful and fainthearted, they are to strengthen and comfort them again.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Gospel for the Second Sunday in Advent,” in Luther’s Works: Church Postil I, ed. Benjamin T. G. Mayes, James L. Langebartels, and Christopher Boyd Brown, vol. 75 (Saint Louis, MO: Concordia Publishing House, 2013), 105–06. (HT: John Fonville)</cite></span></figcaption>

</figure><figure class="quote" id="q-8b80c52ba5" data-kw="">
<blockquote><p>Doctrine Two. We may consider Christ’s sufferings and death in the fruits of it, either as they respect common favors, and mercies, common gifts, and means of grace, which are not peculiar and saving, but common to believers with others, being bestowed upon professors in the visible Church; or as they are peculiar and saving, such as faith, justification, adoption, etc. Now when we say that Christ’s sufferings and death are a price for the sins of his people, we exclude not the reprobate simply from temporal and common favors and mercies that come by his death; they may have, and actually have, common gifts and works of the Spirit, the means of grace, which are some way effects and fruits of the same covenant. But we say, that the reprobate partake not of saving mercy and that Christ’s death is a satisfaction only for the elect, and that none others get pardon of sin, faith, repentance, etc. by it, but they only; it was intended for none others. And this we clear and confirm from, and by, these following grounds and arguments, which we will shortly hint at.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Crucified: The Marrow of the Gospel in 72 Sermons on Isaiah 53 (Dallas, TX: Naphtali Press, 2001)</cite>, pp. 343-44</span></figcaption>

<blockquote><p>LVIII. 3. The will of God is also distinguished into that by which He wills to do or to prevent something, and which is called “the will of his good pleasure,” or rather “of his pleasure” (Ps. 115:3), and into that by which He wills something to be done, or to be omitted, by creatures endued with understanding, and which is called “the will [signi] which is signified.” The latter is revealed; the former is partly revealed, and partly hidden. (Mk. 3:35; 1 Thess. 4:3; Dt. 29:29; 1 Cor. 2:11-12) The former is efficacious, for it uses power, either [tanta] so much as cannot be resisted, or [tali] such a kind as He certainly knows nothing will withstand: (Ps. 33:9; Rom. 9::19) The latter is called “inefficacious,” and resistance is frequently made to it; yet so that, when the creature [excedit ordinem] transgresses the order of this revealed Will, the creature by it may be reduced to order, and that the Will of God may be done [de] on those by whom his Will has not been performed. (2 Sam. 17:14; Isa. 5:4-5; Mt. 21:39-41; Acts 5:4; 1 Cor. 7:28) To this twofold Will is opposed the remission of the Will, which is called “Permission,” and which is also two-fold. The one, which permits something to the power of a rational creature, by not circumscribing its act with a law; and this is opposed to “the revealed Will.” The other is that by which God permits something [potentiae] to the capability and will of the creature, by not interposing an efficacious hindrance; and this is opposed to “the Will of God’s pleasure” that is efficacious. (Acts 14:16; Ps. 81:13)</p></blockquote>

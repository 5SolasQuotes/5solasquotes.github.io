<blockquote><p>I respond: The Papists make ordination a sacrament, and this the material of it, the laying on of hands (see Cornelius a Lapide, Commentary in location). This opinion has been refuted, see their antagonists. The Lutherans however reckon it according to the indifferent rites (see Eckhardt in location cited); however they are seen to discover something in it mystical and necessary however often they knowingly touch upon our indifferent things on this rite. We, however varied in locations and possibly in however many churches this right is used, yet adjudge it to be merely indifferent. See Piscator, Daneus and other commentators in 1 Timothy and Acts 6 &amp; 13; and Alting in the Exegesis of the Augsburg Confession, p. 90. This right was commonly used in synagogues, schools and the polity of the Jews, from where it is seen the apostles took it, which is the opinion of Calvin in his Commentary on Acts 6 &amp; 13, and Institutes, bk. 4, ch. 3, section 16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 8. ‘Questions on Some Rituals in Particular: on the Laying on of Hands, the [Holy] Kiss, Abstinence from Things Strangled &amp; Blood, the Marriage Rite, Anointing, Shaking the Feet of Dust, Love Feasts, the Rite of Covenanting &amp; of the Washing of Feet.’, pp. 460-81 3 sections | Section 1, p. 460 “Problems on rites follow, certainly not all, but only some select ones in particular that the Scripture has mentioned. Those remaining are nearly innumerable which occur in the books of the Old and New Testament or ecclesiastical writings, whether ancient, medieval, modern or recent…” | 4th Problem, ‘What is to be decided about the laying on of hands in ordination or the constituting of ministers (on which see 1 Tim. 4 &amp; 5)?’, pp. 461-66</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7c2060f6f5" data-kw="">
<blockquote><p>Most false it is that the Tabernacle and Temple were nothing but a meeting place of the people for worship, as our churches or chapels, are:

1. Because it is to argue the Holy Ghost of want [lack] of wisdom, to spend so much canonic Scripture in setting down things idly, not tending, at all to edification, and teaching us nothing of God, and in specifying the form, height, length, breadth, curtains, candlesticks, sockets, rings of natural places that contained their bodies… Now certain it is, ‘Whatsoever things were written aforetime, were written for our learning, Rom. 15:4.

2. Many things in the Tabernacle, as candles in daylight, rings, sockets, showbread, belonged nothing to a natural place, as our chapels, or meeting houses do.

3. Expressly the Scripture makes them more than places; to wit, holy, religious, and typical signs of divine institution; as the Tabernacle was a type, Heb. 8:2,5; 9:1,2 etc.; 10:1-3. And the Temple a type of Christ’s body, Jn. 2:19; 1:14-15. And all these were types and shadows of heavenly things, Heb. chapters 8-10; Gal. 4:1-2, etc.; Col. 2:16,17. Which our churches and chapels are not, being only places common to sacred and civil actions. …

3. Yea, because the Tabernacle and Temple and their implements were teaching shadows of good things to come, and our Churches and Chapels are not so, nor have they any moral or religious use or influence on our spirits as the Tabernacle and Temple had; therefore the Lord, who is express in all morals, which of their own nature do teach and edify; he behoved to name Bezaliel, and Aholiah, and the form and color of the priests’ garments, which also are typical, and could not name our elders, or the color or form of their garments.

4. All these weak retortions [of Rutherford’s Anglican opponents] suppose that the Tabernacle and Temple were types of our meeting houses for worship, which is a mere conjecture; they were no more types of our chapels than of the Jewish synagogues;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Intro, section 3, pp. 48-49</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

</figure><figure class="quote" id="q-1069a594a4" data-kw="">
<blockquote><p>…but the imposing of synods is conditional, not absolute as Libertines suppose [of the presbyterians]; for after synods impose, if believers after trying and due examining, shall find that truly and really the decrees are beside or contrary to the word of truth, the imposing neither is a just imposing, nor any imposing at all. For neither prophet, nor apostle, nor angel from heaven [Gal. 1:8], nor Church can lay commands upon men imposing or binding under pain of censures to that which is unsound and false or unjust or wicked; and if people shall find their decrees truly to be so after trial, they have power to reject them.</p></blockquote>

<blockquote><p>This invented or will-worship [Col. 2:23], Cultus arbitrarius, has two specious things in it, as the apostle says: 1. The first is a kind of wisdom, and carries with it a trim show thereof: when a man shall be thought so wise as that he is able to devise and invent a worship for God, especially when men consider not what God has already prescribed, whereby their rites prove contrary to what He has appointed, and so they will be wiser than God. … Although, all will-worship, [Greek], be taken in an evil sense by many, upon the vulgar exposition of that place in Col. 2:23, yet that there may be some voluntary or free worship acceptable to God, though not specially commanded, provided it be not corruptive of or contrary to any right or worship commanded by Him, but subservient or agreeable thereto, is the judgement of learned divines; For under the law they had their voluntary and free-will offerings, besides those commanded by God, and though things were more particularly prescribed in the Levitical worship than now under the Gospel, the Church being then in its childhood, and confined to one nation, and the Spirit not then so plentifully given as now since the ascension of Christ, yet even then the Church prescribed diverse things in God’s worship not specially commanded, as in fasts and festival days, as that of the dedication of the Temple, approved by Christ’s own observance, Jn. 10, and sundry other things, all which were never taxed as unlawful, unless the worship appointed by God Himself were thereby corrupted or neglected, and so the continual practice of the Christian Church has been to prescribe and order several things in God’s worship, which no peaceable and holy men ever found fault with, provided, that they were agreeable to those general rules of moral worship required by God and no ways repugnant to those rites by Him appointed, but rather subservient to them, and contained nothing either impious and forbidden, or vain and ridiculous; nor the observance of them preferred before the commandments of God, or made equal to them; but a difference observed between things of immediate divine institution and those of ecclesiastical institution: To add to God’s institution anything as from God is forbidden, Dt. 12:32, but to add something for the more decent and orderly performance of what God has appointed, and to observe the same as an ecclesiastical institution, is nowhere forbidden, but rather commanded in all those texts that require us to hear the Church [Mt. 18] and to give obedience to her; and to observe this is also to obey God, who has given his Church power to ordain such things: And that that place in Col. 2:23, condemns not all voluntary or free worship no more than it does humility and chastening, or keeping under the body which are joined therewith, but rather that it makes for it has been lately proved by judicious and learned divines; and by one in a full tract upon this subject of will-worship; for the apostle there condemning certain Jewish and Pythagorean observances about touching, tasting, etc. says, verse 23, that they had a show of wisdom, if due cautions were observed, viz. if they were freely and voluntarily undertaken, not as necessary to salvation, and without rejecting what God had made, and if they were used in humility or modesty not condemning others which used them not, and if they sought thereby only to keep under the flesh. The contrary to all which those Pythagoreans and Jews practiced. By which exposition, which I take to be the most true, it is plain that the apostle is so far from condemning all voluntary or will-worship, that he rather approves and commends it, and condemns their forbearance of meats and other things because it was not freely or voluntarily undertaken, but as a thing necessary to salvation, etc. See [Hugo] Grotius in Col. 2:23, Et votum pro pace, pp. 100-103, and [Andrew] Rivet, Apologeticus, pp. 109-10, etc. Dr. [Henry] Hammond, Of Will-Worship. See also our reverend author in his sermon on Mt. 6:16, p. 124, etc. and on 1 Cor. 11:16.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“This invented or will-worship [Col. 2:23], Cultus arbitrarius, has two specious things in it, as the apostle says: 1. The first is a kind of wisdom, and carries with it a trim show thereof: when a man shall be thought so wise as that he is able to devise and invent a worship for God, especially when men consider not what God has already prescribed, whereby their rites prove contrary to what He has appointed, and so they will be wiser than God. … Although, all will-worship, [Greek], be taken in an evil sense by many, upon the vulgar exposition of that place in Col. 2:23, yet that there may be some voluntary or free worship acceptable to God, though not specially commanded, provided it be not corruptive of or contrary to any right or worship commanded by Him, but subservient or agreeable thereto, is the judgement of learned divines; For under the law they had their voluntary and free-will offerings, besides those commanded by God, and though things were more particularly prescribed in the Levitical worship than now under the Gospel, the Church being then in its childhood, and confined to one nation, and the Spirit not then so plentifully given as now since the ascension of Christ, yet even then the Church prescribed diverse things in God’s worship not specially commanded, as in fasts and festival days, as that of the dedication of the Temple, approved by Christ’s own observance, Jn. 10, and sundry other things, all which were never taxed as unlawful, unless the worship appointed by God Himself were thereby corrupted or neglected, and so the continual practice of the Christian Church has been to prescribe and order several things in God’s worship, which no peaceable and holy men ever found fault with, provided, that they were agreeable to those general rules of moral worship required by God and no ways repugnant to those rites by Him appointed, but rather subservient to them, and contained nothing either impious and forbidden, or vain and ridiculous; nor the observance of them preferred before the commandments of God, or made equal to them; but a difference observed between things of immediate divine institution and those of ecclesiastical institution: To add to God’s institution anything as from God is forbidden, Dt. 12:32, but to add something for the more decent and orderly performance of what God has appointed, and to observe the same as an ecclesiastical institution, is nowhere forbidden, but rather commanded in all those texts that require us to hear the Church [Mt. 18] and to give obedience to her; and to observe this is also to obey God, who has given his Church power to ordain such things: And that that place in Col. 2:23, condemns not all voluntary or free worship no more than it does humility and chastening, or keeping under the body which are joined therewith, but rather that it makes for it has been lately proved by judicious and learned divines; and by one in a full tract upon this subject of will-worship; for the apostle there condemning certain Jewish and Pythagorean observances about touching, tasting, etc. says, verse 23, that they had a show of wisdom, if due cautions were observed, viz. if they were freely and voluntarily undertaken, not as necessary to salvation, and without rejecting what God had made, and if they were used in humility or modesty not condemning others which used them not, and if they sought thereby only to keep under the flesh. The contrary to all which those Pythagoreans and Jews practiced. By which exposition, which I take to be the most true, it is plain that the apostle is so far from condemning all voluntary or will-worship, that he rather approves and commends it, and condemns their forbearance of meats and other things because it was not freely or voluntarily undertaken, but as a thing necessary to salvation, etc. See [Hugo] Grotius in Col. 2:23, Et votum pro pace, pp. 100-103, and [Andrew] Rivet, Apologeticus, pp. 109-10, etc. Dr. [Henry] Hammond, Of Will-Worship. See also our reverend author in his sermon on Mt. 6:16, p. 124, etc. and on 1 Cor. 11:16.”

— Andrewes Lancelot, The Moral Law Expounded: Largely, Learnedly, Orthodoxly… upon the Ten Commandments… (d. 1626; London: Sparke, 1642), On the Ten Commandments, 2nd Commandment, ch. 1, pp. 194-95 See, p. 196 for more.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThis+invented+or+will-worship+%5BCol.+2%3A23%5D%2C+Cultus+arbitrarius%2C+has+two+specious+things+in+it%2C+as+the+apostle+says%3A+1.+The+first+is+a+kind+of+wisdom%2C+and+carries+with+it+a+trim+show+thereof%3A+when+a+man+shall+be+thought+so+wise+as+that+he+is+able+to+devise+and+invent+a+worship+for+God%2C+especially+when+men+consider+not+what+God+has+already+prescribed%2C+whereby+their+rites+prove+contrary+to+what+He+has+appointed%2C+and+so+they+will+be+wiser+than+God.+%E2%80%A6+Although%2C+all+will-worship%2C+%5BGreek%5D%2C+be+taken+in+an+evil+sense+by+many%2C+upon+the+vulgar+exposition+of+that+place+in+Col.+2%3A23%2C+yet+that+there+may+be+some+voluntary+or+free+worship+acceptable+to+God%2C+though+not+specially+commanded%2C+provided+it+be+not+corruptive+of+or+contrary+to+any+right+or+worship+commanded+by+Him%2C+but+subservient+or+agreeable+thereto%2C+is+the+judgement+of+learned+divines%3B+For+under+the+law+they+had+their+voluntary+and+free-will+offerings%2C+besides+those+commanded+by+God%2C+and+though+things+were+more+particularly+prescribed+in+the+Levitical+worship+than+now+under+the+Gospel%2C+the+Church+being+then+in+its+childhood%2C+and+confined+to+one+nation%2C+and+the+Spirit+not+then+so+plentifully+given+as+now+since+the+ascension+of+Christ%2C+yet+even+then+the+Church+prescribed+diverse+things+in+God%E2%80%99s+worship+not+specially+commanded%2C+as+in+fasts+and+festival+days%2C+as+that+of+the+dedication+of+the+Temple%2C+approved+by+Christ%E2%80%99s+own+observance%2C+Jn.+10%2C+and+sundry+other+things%2C+all+which+were+never+taxed+as+unlawful%2C+unless+the+worship+appointed+by+God+Himself+were+thereby+corrupted+or+neglected%2C+and+so+the+continual+practice+of+the+Christian+Church+has+been+to+prescribe+and+order+several+things+in+God%E2%80%99s+worship%2C+which+no+peaceable+and+holy+men+ever+found+fault+with%2C+provided%2C+that+they+were+agreeable+to+those+general+rules+of+moral+worship+required+by+God+and+no+ways+repugnant+to+those+rites+by+Him+appointed%2C+but+rather+subservient+to+them%2C+and+contained+nothing+either+impious+and+forbidden%2C+or+vain+and+ridiculous%3B+nor+the+observance+of+them+preferred+before+the+commandments+of+God%2C+or+made+equal+to+them%3B+but+a+difference+observed+between+things+of+immediate+divine+institution+and+those+of+ecclesiastical+institution%3A+To+add+to+God%E2%80%99s+institution+anything+as+from+God+is+forbidden%2C+Dt.+12%3A32%2C+but+to+add+something+for+the+more+decent+and+orderly+performance+of+what+God+has+appointed%2C+and+to+observe+the+same+as+an+ecclesiastical+institution%2C+is+nowhere+forbidden%2C+but+rather+commanded+in+all+those+texts+that+require+us+to+hear+the+Church+%5BMt.+18%5D+and+to+give+obedience+to+her%3B+and+to+observe+this+is+also+to+obey+God%2C+who+has+given+his+Church+power+to+ordain+such+things%3A+And+that+that+place+in+Col.+2%3A23%2C+condemns+not+all+voluntary+or+free+worship+no+more+than+it+does+humility+and+chastening%2C+or+keeping+under+the+body+which+are+joined+therewith%2C+but+rather+that+it+makes+for+it+has+been+lately+proved+by+judicious+and+learned+divines%3B+and+by+one+in+a+full+tract+upon+this+subject+of+will-worship%3B+for+the+apostle+there+condemning+certain+Jewish+and+Pythagorean+observances+about+touching%2C+tasting%2C+etc.+says%2C+verse+23%2C+that+they+had+a+show+of+wisdom%2C+if+due+cautions+were+observed%2C+viz.+if+they+were+freely+and+voluntarily+undertaken%2C+not+as+necessary+to+salvation%2C+and+without+rejecting+what+God+had+made%2C+and+if+they+were+used+in+humility+or+modesty+not+condemning+others+which+used+them+not%2C+and+if+they+sought+thereby+only+to+keep+under+the+flesh.+The+contrary+to+all+which+those+Pythagoreans+and+Jews+practiced.+By+which+exposition%2C+which+I+take+to+be+the+most+true%2C+it+is+plain+that+the+apostle+is+so+far+from+condemning+all+voluntary+or+will-worship%2C+that+he+rather+approves+and+commends+it%2C+and+condemns+their+forbearance+of+meats+and+other+things+because+it+was+not+freely+or+voluntarily+undertaken%2C+but+as+a+thing+necessary+to+salvation%2C+etc.+See+%5BHugo%5D+Grotius+in+Col.+2%3A23%2C+Et+votum+pro+pace%2C+pp.+100-103%2C+and+%5BAndrew%5D+Rivet%2C+Apologeticus%2C+pp.+109-10%2C+etc.+Dr.+%5BHenry%5D+Hammond%2C+Of+Will-Worship.+See+also+our+reverend+author+in+his+sermon+on+Mt.+6%3A16%2C+p.+124%2C+etc.+and+on+1+Cor.+11%3A16.%E2%80%9D%0A%0A%E2%80%94+Andrewes+Lancelot%2C+The+Moral+Law+Expounded%3A+Largely%2C+Learnedly%2C+Orthodoxly%E2%80%A6+upon+the+Ten+Commandments%E2%80%A6+%28d.+1626%3B+London%3A+Sparke%2C+1642%29%2C+On+the+Ten+Commandments%2C+2nd+Commandment%2C+ch.+1%2C+pp.+194-95+See%2C+p.+196+for+more.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F647983ef1f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/647983ef1f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=This%20invented%20or%20will%2Dworship%20%5BCol.%202%3A23,etc.%20and%20on%201%20Cor.%2011%3A16&amp;text=This%20invented%20or%20will%2Dworship%20%5BCol.%202%3A23%5D%2C%20Cultus%20arbitrarius&amp;text=p.%20124%2C%20etc.%20and%20on%201%20Cor.%2011%3A16" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>[Col. 2] verse. 17, What should we do with the shadow, when we have the body? another, verse 20, Why should we be subject to human ordinances, since through Christ we are dead to them, and have nothing ado with them?… …whereas it might bee thought, that the apostle does not condemn all holy-days, because both he permits others to observe days, Rom. 14:5, and he himself also did observe one of the Jewish feasts, Acts 18:21. It is easily answered that our holy-days have no warrant from these places… …that which the apostle either said or did hereanent, is to be expounded and understood of bearing with the weak Jews, whom he permitted to esteeme one day above another, and for whose cause he did in his own practice, thus far apply himself to their infirmity at [???] time, when they could not possibly be as yet fully and throughly instructed concerning Christian liberty and the abrogation of the Ceremonial Law, because the Gospel was as yet not fully propagated: and when the Mosaical rites were like a dead man not yet buried, as Augustine’s simile runs. So that all this can make nothing for holy-days after the full promulgation of the Gospel, and after that the Jewish ceremonies are not only dead, but also buried, and so deadly to be used by us. Hence it is, that the apostle will not bear with the observation days in Christian Churches, who have known God as he speaks.</p></blockquote>

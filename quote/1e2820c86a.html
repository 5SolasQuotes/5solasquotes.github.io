<blockquote><p>The term voluntas signi, literally, the will of the sign, is closely related to the term signum voluntatis, the sign of the will or purpose. It indicates an overt sign or indication that someone wills something and can therefore be understood as a revealed will or, specifically, as a revealed precept or ‘preceptive will’–thus, what is literally called the ‘signified will’ is a will that God makes known and in effect ‘signifies’ what is commanded… The voluntas signi, therefore, is not a ‘mere sign’ but one that corresponds with something that is truly in God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD</cite>, vol. 3 (Baker, 2003), Part 2, ch. 5.4, E., ‘The Ad Intra–Ad Extra Distinctions’, sections 1, p. 458</span></figcaption>

<blockquote><p>48. In whatever God wills He is universally effectual; He is not hindered or frustrated in obtaining what He wills. For if He should properly will anything and not attain it He would not be wholly perfect and blessed. … 53. Those means through which that will is revealed are the ‘intention of the sign’ [voluntas signi]–rightly so called not only by metaphor because they show men what they mean, but also by metonymy because they are the effects or adjuncts or partial declarations of God’s own will.</p></blockquote>

<blockquote><p>2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion, the faith of Judas the traitor, which nevertheless He by no means willed or decreed by the will of good pleasure since such things never happen in the nature of things… the object of the will of sign or approving of God, is that which is morally good and honest, but of the disapproving, what is unjust and evil: whether it happen in the nature of things, or not… Thus God willed and commanded the repentance of Cain, but it by no means follows therefore Cain repents, because the event of the thing or non-event of the thing is badly, and by no art of logic concluded from the will of sign or approving… the commandment of God does not signify to us the will of God about such an event; but only the will of God about such moral equity of the thing. … as far as pertains to the essence of the will of sign, God equally approves with moral complacency the final obedience of Judas the traitor, as the obedience of Peter the apostle:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Scholastic Disputation on Divine Providence, chs. 1-10</cite>, tr. by AI by Onku (Edinburgh, 1649), ch. 2. ‘What is the nature of the permissive will of God, and of the will of good pleasure and sign. The Remonstrants, Arminians are called to the discussion’ Latin, pp. 12-13</span></figcaption>

<blockquote><p>[I] This is called his [Greek] (Acts 2:23), Determined purpose, [Greek] (Acts 4:28), The hand and counsel of God; [Greek] (Eph. 1:9), The good pleasure of God and Gods eternal providence. (Now this is called his eternal providence, that it may be distinguished from actual providence, which is nothing else but the execution of God’s decrees.) II. This is called, the Will of God, or The will of his good pleasure. Indeed the decree is the very will of God; yet for our better understanding, the will is considered as the cause efficient, the decree is the effect. Now whereas this word ‘will’ is taken diversely, it is diverse ways distinguished by divines, to wit, into the will of his good pleasure and the will of the sign; into an antecedent and consequent; into absolute, and conditional; into secret and revealed. But these are not real distributions of the divine will, but distinctions only of the name: For to speak properly, there is in God but one only will, which is called the will of his good pleasure, because out of his most free good pleasure He has decreed what shall be done: It is called also his antecedent will because it had existence before any creature and from eternity with God it was established: It is named also absolute, because it depends upon God’s good pleasure and not from the things which are done in time. Lastly it is called secret, because in respect of priority it is known neither to men nor angels. But these things are improperly styled by the name of divine will which are comprehended in that ordinary verse: Praecipit, et prohibet, promittit, consulit, implet: “Commands, forbids, promises, consults, fulfills.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, ... (d. 1629; London: Mabb, 1660), bk. 1, ch. 3, Concerning the Works of God &amp; the Decrees of God in General, The Rules, pp. 33-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>XVIII. God by his antecedent will decreed to bestow faith and grace on us, which by his consequent will He resolved to deny us; his former will was moved by his own goodness, but his latter will was provoked by our wickedness: if we have unjustly rejected the grace which by his former will He resolved to give us, may not He justly by his latter will deny that grace, which was rejected so perversely by us. Lord, if thou art resolved by thy first will to bestow grace on me, let me not by my disobedience provoke thy second will to deny that grace unto me. XIX. Our wickedness is the cause that moves God to exercise his acts of justice; but his own bounty is the cause, and our misery the occasion, why He exercises his acts of mercy…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“XVIII. God by his antecedent will decreed to bestow faith and grace on us, which by his consequent will He resolved to deny us; his former will was moved by his own goodness, but his latter will was provoked by our wickedness: if we have unjustly rejected the grace which by his former will He resolved to give us, may not He justly by his latter will deny that grace, which was rejected so perversely by us. Lord, if thou art resolved by thy first will to bestow grace on me, let me not by my disobedience provoke thy second will to deny that grace unto me. XIX. Our wickedness is the cause that moves God to exercise his acts of justice; but his own bounty is the cause, and our misery the occasion, why He exercises his acts of mercy…”

— Alexander Ross, A Century of Divine Meditations upon Predestination… (London: Young, 1646), pp. 15-16, 19, 21-23, 89-92 Ross (c. 1590–1654) was a Scottish minister and chaplain-in-ordinary to King Charles I. He was not the Aberdeen doctor of the same name.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXVIII.+God+by+his+antecedent+will+decreed+to+bestow+faith+and+grace+on+us%2C+which+by+his+consequent+will+He+resolved+to+deny+us%3B+his+former+will+was+moved+by+his+own+goodness%2C+but+his+latter+will+was+provoked+by+our+wickedness%3A+if+we+have+unjustly+rejected+the+grace+which+by+his+former+will+He+resolved+to+give+us%2C+may+not+He+justly+by+his+latter+will+deny+that+grace%2C+which+was+rejected+so+perversely+by+us.+Lord%2C+if+thou+art+resolved+by+thy+first+will+to+bestow+grace+on+me%2C+let+me+not+by+my+disobedience+provoke+thy+second+will+to+deny+that+grace+unto+me.+XIX.+Our+wickedness+is+the+cause+that+moves+God+to+exercise+his+acts+of+justice%3B+but+his+own+bounty+is+the+cause%2C+and+our+misery+the+occasion%2C+why+He+exercises+his+acts+of+mercy%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Alexander+Ross%2C+A+Century+of+Divine+Meditations+upon+Predestination%E2%80%A6+%28London%3A+Young%2C+1646%29%2C+pp.+15-16%2C+19%2C+21-23%2C+89-92+Ross+%28c.+1590%E2%80%931654%29+was+a+Scottish+minister+and+chaplain-in-ordinary+to+King+Charles+I.+He+was+not+the+Aberdeen+doctor+of+the+same+name.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffa4d387437.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fa4d387437.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-antecedent-consequent-aspects-of-gods-willing/#:~:text=XVIII.%20God%20by%20his%20antecedent%20will,He%20exercises%20his%20acts%20of%20mercy&amp;text=XVIII.%20God%20by%20his%20antecedent%20will%20decreed%20to&amp;text=occasion%2C%20why%20He%20exercises%20his%20acts%20of%20mercy" rel="noopener" target="_blank">Read it online ·

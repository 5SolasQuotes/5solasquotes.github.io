<main class="wrap"><figure class="quote" id="q-74af20edbe" data-kw="">
<blockquote><p>From this cause [native depravity] it proceeds, that many children, who have the opportunity of a good religious education, learn scarcely any thing of the most important truths of Christianity. If they are compelled to commit the Catechism to memory, they are wont to do this without ever thinking of the doctrines contained in the words which they recite; so that, when the attention is at any time awakened to the subject of religion, as a personal concern, they feel themselves to be completely ignorant of the system of divine truth taught in the Bible. Yet even to these, the truths committed to memory are now of great utility. They are like a treasure which has been hidden, but is now discovered. Of two persons under conviction of sin, one of whom has had sound religious instruction, and the other none, the former will have an unspeakable advantage over the latter in many respects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience (Philadelphia: Presbyterian Board of Publication, 1841), ch. 1</cite>, p. 13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-353437fd6b" data-kw="">
<blockquote><p>The light of nature, which is a spark of the will of God, has taught many useful rules even to pagans, anent the right way of making solemn speeches before others, the most of which are to be applied to preaching with due discretion; so that what is thought unseemly in the one is to be avoided in the other. But the best rules are taken from the preachings of Christ, of the apostles and prophets.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-livingstone.html">John Livingstone</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Remarks on Preaching and Praying in Public by John Livingstone’, in Scottish Puritans: Select Biographies, vol. 1</cite>, p. 288</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/preaching.html">Preaching</a></span></div>

</figure><figure class="quote" id="q-78aaab70d4" data-kw="">
<blockquote><p>15… As for the differences which arose about the public resolutions [in the late-1640’s], they made a division indeed in the Church, but no schism, at lest in worship (of which we speak), but only in government, except by accident in some places where presbyteries divided themselves, whereupon followed opposite ordinations, which brought in division among the people, some adhering to one minister, some to another. But I never heard that any held it unlawful to hear ministers on either side, though comparatively they judged it duty rather to hear others. By the way I wish the question about hearing of curates had never come a greater length. See below. However (as dogs, they say, gars swine ‘gree (make to agree)) by the reintroduction of prelacy [in 1661] this difference was buried, as fire under ashes.” Ministers, who had before been putting and thrusting at one another, being, by this, put all an one condition, that is, thrust all out together [in 1662, for 30% of the ministry], except those who complied with Prelacy [or rather a relatively low form of episcopacy]. These, and others whom the prelates and tey put in, occupying the room of pastors, debates arose among presbyterians, ministers and others, anent the lawfulness or unlawfulness, duty or sin of hearing them. Some pleading compliance in hearing, to prove it sinful; some pleading separation in withdrawing to prove hearing to be duty: Some pleading soundness in doctrine to prove it lawful and duty to hear, some pleading corruption in government to prove it unlawful and sinful. And though these different pleadings, accompanied with different practices, in hearing or not hearing curates, as they were called, made no schism among presbyterians. In regard, ministers, who heard and who heard not, preached sometimes privately; and people of either practice heard any of them indifferently. Yet, in these debates, some laid down principles, which, if followed out, would oblige them to hear none that were not of their mind or way, in all matters whether of judgment or practice, which were too much improven afterward. (See Dr. [Gilbert] Rule’s Rational Defence of Non-Conformity, and Mene Tekel)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gavin-hamilton.html">Gavin Hamilton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Just Reflections upon a Pamphlet entitled, ‘A Modest Reply to a Letter from a Friend to Mr John M’millan’ ([Edinburgh?], 1712)</cite>, p. 17</span></figcaption>

</figure><figure class="quote" id="q-0d0c138d09" data-kw="">
<blockquote><p>Several of them [common Scottish people, after the second indulgence in 1672] were taught to believe, and urge a position, in itself of most dangerous consequences, that it is unlawful to hear a minister who was guilty of failures in his entry upon ministerial work, or mistakes in his management of it. I wish the remains of this dangerous position may be entirely out from among us;</p></blockquote>

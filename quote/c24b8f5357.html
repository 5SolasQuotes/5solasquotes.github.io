<main class="wrap"><figure class="quote" id="q-c24b8f5357" data-kw="">
<blockquote><p>‘Say not thou, What is the cause that the former days were better than these? for thou dost not inquire wisely concerning this,’ Eccles. vii. 10. There are some ever telling us that the theology of former times is much superior to that of our day. Some prefer the theology of the so-called fathers of the church, some that of the middle ages, some that of the Reformation, some that of the puritans.

Now we believe that it may be good for us to look to the way in which great and good men have conceived, expressed, and enforced the truth in divers ages, were it only to widen the narrowness of our views, and recall attention to catholic verities which particular ages or sects have allowed to sink out of sight.

Let us by all means rise from time to time above the contracted valleys in which we dwell, and ascend a height whence we may observe the whole broad and diversified territory which God has given us as an inheritance, and the relation of the varied parts which branch out from Christ as the centre, as do the hills and valleys of our country from some great mountain, the axis of its range. There is, we should acknowledge, an attractive simplicity in the expositions of divine truth by the early fathers; and we are under deep obligations to the divines of the fourth century for establishing on Scripture evidence the doctrine of the Trinity.

Those who look into it with a desire to discover what is good, will find not a few excellencies even in the mediaeval divinity, notwithstanding the restraints laid on it by crutches and bandages. It is not to be forgotten that Thomas à Kempis lived in what are called the dark ages; and that we owe to a philosophic divine of that time, not certainly the doctrine of the atonement, which had been in the revealed religion of God since Adam and Abel offered lambs in sacrifice, but a very masterly and comprehensive exposition of that cardinal truth.

Free grace, which had been so limited and hindered in the priestly and ecclesiastical ages, breathes from every page of the Reformers as fragrance does from the flower. The puritan preaching is unsurpassed for clear enunciation of divine truth, accompanied with close, searching, and fervent appeal, which now shakes the whole soul, as the earthquake did the prison at Philippi, and anon relieves it by the command and promise, ‘Believe in the Lord Jesus Christ, and thou shalt be saved.’

But we should put implicit trust in no human, or hereditary, or traditional theology, in no theology except what comes direct from the Bible, interpreted according to the letter, but received after the spirit. How often does it happen that you will know what sect a man belongs to by the favourite passages which ho quotes in his sermons, and in his very prayers, shewing how apt we are to take our very Scriptures from the traditions of our churches. We act as if the well were shut up from us, and as if we were obliged to go to the streams, which may have caught earthliness in their course, and which at the best cannot be so fresh as the fountain. That is the theology best suited to the age which is put forth by living men of the age, drinking of the living word for themselves by the power of the living Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-mccosh.html">James McCosh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Introduction to, The Complete Works of Stephen Charnock, B.D.</cite></span></figcaption>

<blockquote><p>The Lord Christ Jesus takes delight in his own day. He delights to honour it. He delights to meet with and manifest himself to his disciples on it, as he showed before his ascension by appearing to them from time to time on this day. He delights to give his Holy Spirit on this day, as he intimated by choosing of it to pour it out on the primitive church in so remarkable a manner upon it, and by giving his Spirit to the apostle John on this day.

God blessed the seventh day of old, or appointed it to be a day wherein he especially would bestow blessings on his people as an expression, as it were, of his own joyful remembrance of that day and of the rest and refreshment he had on it; Exodus 31:16–17, “Wherefore the children of Israel shall keep the sabbath … for in six days the Lord made heaven and earth, and on the seventh day he rested, and was refreshed,” as princes give gifts on their birthday, on their marriage days, and the like.

But how much more reason has Christ to bless the day of his resurrection, and to delight to honour it, and to be conferring his graces and blessed gifts on his people on this day. It was a day wherein Christ rested and was refreshed in a literal sense. It was a day of great refreshment and joy to Christ, being the day of his deliverance from the chains of death, the day of his finishing that great and difficult work of redemption that had been upon his heart from all eternity, the day of his justification of the Father, the day of the beginning of his exaltation and the fulfilment of the promises of his Father, the day when he had eternal life, which he had purchased, put into his hands. And Christ does delight to distribute gifts and blessings and joy and happiness on this day, and will to the end of the world.

O, therefore, how well is it worth our while to improve this day, to call upon God and seek Jesus Christ on it!

Let awakened sinners be stirred up by these things to improve the sabbath day, as they would lay themselves most in the way of the Spirit of God. Improve the sabbath day to call upon God, for then he is near. Improve the sabbath day for reading the holy Scriptures and diligently attending his Word preached, for then is the likeliest time to have the Spirit accompanying of it. Let the saints that are desirous of growing in grace and enjoying communion with Christ improve the sabbath in order to it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetuity and Change of the Sabbath</cite>, (1730-31) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), p. 246.</span></figcaption>

<blockquote><p>The sting of Death is Sin, and the strength of Sin is the Law; but thanks be to God, which giveth us the victory, through our Lord Jesus Christ. [1 Cor. 15:56-57] This indeed is our David, who cut off the head of this Goliath with his own sword, killed Death by falling dead upon it; he unstung this Serpent by receiving its sting into his own blessed body. He overcame this great Conqueror, by submitting himself for a time to be conquered by it; when Christ lost his life, then his whole Army of Saints won the day.

Death now to them is no death, that which was their punishment as Sinners, is now their privilege as Saints. That which stood amongst the threatnings of the Law, and was the most formidable of them all, hath now changed its place, and is got amongst the promises of the Gospel. All things are yours, or Life or Death. 1 Cor. 3.21. So precious an oil doth our Apostle extract from this slain Scorpion; so sweet an honey comb doth he find in this dead Lion’s breast, and gives it into the hand of the Saints, to go eating of it, to their unspeakable joy and comfort.</p></blockquote>

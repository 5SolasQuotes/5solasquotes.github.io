<main class="wrap"><figure class="quote" id="q-5b0f33f57b" data-kw="">
<blockquote><p>From the end of magistracy. The Lord hath ordained magistrates to be his ministers for the good of his people, and their defence, whence have proceeded these common principles of policy, “Princes principally are for the people and their defence, and not the people principally for them: The safety and good of the people is the supreme law.” Magistracy is the inferior and subordinate law. The people make the magistrate, but the magistrate maketh not the people. The people may be without the magistrate, for the world was governed in another way, till Cain, building a city, made the godly first take this order for their defence; but the magistrate cannot be without the people. The body of the magistrate is mortal, but the people as a society is immortal. And therefore it were a direct overturning of all the foundations of policy and government, to prefer subjection to the prince to the preservation of the commonwealth, or to expose the public, wherein every man’s person, family and private estate are contained, to lie a prey to the fury of the prince, rather than by all our power to defend and preserve the commonwealth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-henderson.html">Alexander Henderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Instructions for Defensive Arms (1639) in Andrew Stevenson, The History of the Church and State of Scotland, from the Accession of King Charles I. to the year 1649. To which is prefixed, An Abstract of the State of Religion in Scotland, from the Earliest Ages of Christianity, to the year 1625</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

0f33f57b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5b0f33f57b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/11/04/alexander-henderson-the-magistrate-was-made-for-the-people-not-the-people-for-the-magistrate/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-23d4a689e3" data-kw="">
<blockquote><p>I grant and confess, that faith is God’s gift in the heart of man, which God alone doth search and know. But men are judged by their words and deeds. Admit, therefore, that the erroneous opinion of the mind may not be punished; yet notwithstanding, wicked and infective profession and doctrine must in no wise be suffered. Verily, no man doth in this world punish profane and wicked thoughts of the mind: but if those thoughts break forth into blasphemous words, then are those blaspheming tongues to be punished of good princes.

And yet by this I say not, that godliness lieth in the magistrate to give and bestow. Justice is the very gift of God, which none but God doth give to men: but who is so foolish as to gather thereupon, that unjust men, robbers, murderers, and witches are not to be punished, because the magistrate by punishment cannot bestow righteousness upon unrighteous people?

We must therefore make a difference betwixt faith, as it is the gift of God in the heart of man, and as it is the outward profession uttered and declared before the face of men. For while false faith doth lurk and lie hid within the heart, and infecteth none but the unbeliever, so long the unbelieving infidel cannot be punished: but if this false and forged faith, that so lay hid, do once break forth to blaspheme, to the open tearing of God and the infecting of his neighbours, then must that blasphemer be by and by plucked under, and kept from creeping to further annoyance. Not to suppress such a fellow as this, is to put a sword in a madman’s hand to kill unwise and weakly men.

Faith is the gift of God; but, where he bestoweth faith, he useth means to give it by: those means he will not have us to neglect. An householder knoweth that faith is the gift of God; and yet notwithstanding, he instructeth his children in the word of truth, he chargeth them to go to church, to pray for faith, and to learn it at the preacher’s mouth. A good father would think much, yea, he would not think well of it, if his son should say: Father, I pray you, teach me not, send me not so much to church, and beat me not if I be not there; for faith is the gift of God, which whipping cannot bring me to. Then what man can quietly abide to hear that faith is the gift of God, and that therefore no man ought for faith, that is, for the corruption of faith and open blasphemy, to suffer any punishment?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids MI: Reformation Heritage Books, 2004), 1: 363-64.</span></figcaption>

</figure><figure class="quote" id="q-dfcdf3c447" data-kw="">
<blockquote><p>Then church and state are like[ly] to flourish when Moses and Aaron, Zerubbabel and Joshua, Zech 4:14, go hand in hand together. When the minister reproves sin, and the magistrate punishes it; when the magistrate makes use of the minister’s direction, and the minister enjoys the magistrate’s protection; when Joshua joins with Eleazar, and David consults with Nathan and Gad, the prophets of the Lord; and Josiah with Huldah, and Uzziah with Zechariah the priest, then, and never till then, can we look to prosper, 2 Chron 26:5. It is Aaron’s office to speak, but it is Moses’s rod that works the wonders. Ministers must preach, and magistrates must punish offenders.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-hall.html">Thomas Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Beauty of Magistracy in an Exposition of the 82nd Psalm</cite>, pp. 76-82 in The Beauty of Magistracy in an Exposition of the 82nd Psalm, where is set forth the necessity, utility, dignity, duty, and mortality of magistrates… (London, 1660)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/church-and-state.html">Civil Government and Society: Church and State</a></span></div>

</figure><figure class="quote" id="q-379021b5c3" data-kw="">
<blockquote><p>The Gibbites in 1681, and Russelites in 1682, and for some years, did maintain the same unhappy principles and practices [as the later M’Millianites after 1689]; and stated their testimonies against paying of excise and customs, and other fool things, not only for themselves, but separation from all that durst not go their lengths, even when imprisoned together going as far from us as the walls of the prison would allow them, and stopping their ears when we went about publick worship three times a day, which was our ordinary in each room… It is a piece of demented infatuation to make little or no difference betwixt that period [before 1689] and this [period after 1689 during toleration], and to follow the same methods that the Lord’s people were obliged to take against tyranny and defections.</p></blockquote>

<blockquote><p>They whose part it is to set up magistrates, may restrain them also from outrageous deeds, or pull them down; but all magistrates are set up either by parliament, or by electors, or by other magistrates; They therefore who exalted them, may lawfully degrade and punish them.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-b1a9d43570" data-kw="">
<blockquote><p>Is it not preposterous to be hot against prelacy and Erastianism (sad ills indeed!) and yet friendly enough toward schism, error and some other things repugnant to the Word of God and your covenants as well as these? Let your zeal be universal and impartial against all evil, hating every false way; and while ye shun Scylla, dash not upon Charybdis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bairdie.html">John Bairdie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Balm from Gilead, or the Differences about the Indulgence Stated &amp; Impleaded in a Sober &amp; Serious Letter to Ministers &amp; Christians in Scotland</cite>, … (London, 1681), p. 166</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4f0ef1198d" data-kw="">
<blockquote><p>This is a very uncertain rule; for he may give his presence where he does not approve of the minister, and he may approve of the minister where he does not give his presence; and if he be absent, it is uncertain whether it be the minister’s fault or our own. And upon that ground the other party may be justified in dividing from us, because they may miss his presence among us and in our meetings; his presence in communion is the end of our meetings, and not the rule: The meeting is always lawful, and may have the expectation of his presence, that is gathered ‘in his name’; and none can say the meeting of presbyterian ministers in Scotland at this time, in these circumstances, are gathered in any other name. However, if we would expect a blessing, let us endeavor unity; for that is “as the dew of Hermon, and there the Lord commands the blessing,” Ps. 133 last.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

</figure><figure class="quote" id="q-ecb794e643" data-kw="">
<blockquote><p>While that act stands unrepealed, or not annulled, it remains an act and rule of this Church still, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature.’ Now, as to the Brethren: [1] I cannot see any ground to say the sentenced anent them are not materially rescinded, seeing as the Assembly 1733 and their commission did cast them out from this Church, so the Assembly 1734 gave the synod of Perth power and full authority to restore and unite them again to the communion thereof, and to their ministerial charges, which accordingly was done by that synod: And this, in my opinion, was a material condemning of the sentences of the former Assembly and commission that had been pronounced against them. (2) But, whereas ’tis said the act of Assembly 1733 against them, while unrepealed, ‘It still remains an act and rule of this Church, so far as an act in a particular case is a rule in a way of precedent in cases of the like nature,’ and therefore they cannot accede to the judicatories till that act is rescinded, lest they homologate that sinful deed or sentence. Now if this argument prove anything, it proves too much; for it says we are never to join with a Church which has made any unjust or sinful act till repealed: And so the Brethren could never be justified for joining formerly with the Church of Scotland when such unaccountable acts as that of the Assembly 1638, sessions 23-24, was unrepealed: which discharges all persons of whatever quality, ministers or others, to speak or write against that Assembly, or any act of that Assembly, under pain of the censures of the Church: A very bad precedent! And so the Assembly 1642, session 7, enjoins that every presbytery proceed against non-communicants, whether Papists or others, according to the act of parliament, which looks too like the English Sacramental Test: And also the above-cited act of Assembly 1648, anent deposing all suspended ministers who do not submit to the sentences of Church judicatories, and so of other bad acts of Assembly from 1638 to 1649 inclusive. And, if an act in a particular case is a rule in a way of precedent in similar cases, or cases of the like nature, then the instance of overturning the settlement made by the Commission at Auchtermuchty, and the repeated instances of our late General Assemblies in allowing the people of Stow, Troqueir, Dennie, etc. the privilege of sealing ordinances, are good precedents to plead in like cases where ministers are intruded upon Christian congregations. 4thly, They say: “Seeing an accession to a Church cannot be made but in the situation in which that Church is when the accession is made unto her; therefore any accession to her in that situation so far approves of her, as to submit it to her authority what is to be counted defections, and what not; and, if that Church maintain not that testimony which they that accede to her maintain, then they fall from their testimony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation: or a Vindication of the Church of Scotland contra the Seceders</cite></span></figcaption>

ry+presbytery+proceed+against+non-communicants%2C+whether+Papists+or+others%2C+according+to+the+act+of+parliament%2C+which+looks+too+like+the+English+Sacramental+Test%3A+And+also+the+above-cited+act+of+Assembly+1648%2C+anent+deposing+all+suspended+ministers+who+do+not+submit+to+the+sentences+of+Church+judicatories%2C+and+so+of+other+bad+acts+of+Assembly+from+1638+to+1649+inclusive.+And%2C+if+an+act+in+a+particular+case+is+a+rule+in+a+way+of+precedent+in+similar+cases%2C+or+cases+of+the+like+nature%2C+then+the+instance+of+overturning+the+settlement+made+by+the+Commission+at+Auchtermuchty%2C+and+the+repeated+instances+of+our+late+General+Assemblies+in+allowing+the+people+of+Stow%2C+Troqueir%2C+Dennie%2C+etc.+the+privilege+of+sealing+ordinances%2C+are+good+precedents+to+plead+in+like+cases+where+ministers+are+intruded+upon+Christian+congregations.+4thly%2C+They+say%3A+%E2%80%9CSeeing+an+accession+to+a+Church+cannot+be+made+but+in+the+situation+in+which+that+Church+is+when+the+accession+is+made+unto+her%3B+therefore+any+accession+to+her+in+that+situation+so+far+approves+of+her%2C+as+to+submit+it+to+her+authority+what+is+to+be+counted+defections%2C+and+what+not%3B+and%2C+if+that+Church+maintain+not+that+testimony+which+they+that+accede+to+her+maintain%2C+then+they+fall+from+their+testimony.%E2%80%9D%0A%0A%E2%80%94+John+Currie%2C+An+Essay+on+Separation%3A+or+a+Vindication+of+the+Church+of+Scotland+contra+the+Seceders&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fecb794e643.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ecb794e643.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/john-currie-essay-on-separation-or-a-vindication-of-the-church-of-scotland-contra-the-seceders/#:~:text=While%20that%20act%20stands%20unrepealed%2C%20or,then%20they%20fall%20from%20their%20testimony&amp;text=While%20that%20act%20stands%20unrepealed%2C%20or%20not%20annulled&amp;text=her%20maintain%2C%20then%20they%20f

<main class="wrap"><figure class="quote" id="q-eb68156088" data-kw="">
<blockquote><p>The Holy Scripture is the only sufficient, certain, and infallible rule of all saving knowledge, faith, and obedience, although the light of nature, and the works of creation and providence do so far manifest the goodness, wisdom, and power of God, as to leave men inexcusable; yet they are not sufficient to give that knowledge of God and His will which is necessary unto salvation. Therefore it pleased the Lord at sundry times and in diversified manners to reveal Himself, and to declare that His will unto His church; and afterward for the better preserving and propagating of the truth, and for the more sure establishment and comfort of the church against the corruption of the flesh, and the malice of Satan, and of the world, to commit the same wholly unto writing; which makes the Holy Scriptures to be most necessary, those former ways of God&#x27;s revealing His will unto His people being now completed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 1.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span><span class="t"><a href="../topics/holy-scripture/necessity-of-scripture.html">Necessity of Scripture</a> › <a href="../topics/holy-scripture/necessity-of-scripture/necessity-of-a-written-word.html">Necessity of a written word</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-24b4e60934" data-kw="">

<main class="wrap"><figure class="quote" id="q-cefea8f90b" data-kw="">
<blockquote><p>The destruction of the little horn [the papacy] will be followed by an event the most important that has ever gladdened the world – the universal establishment of the Redeemer’s kingdom; and therefore is the date of this great moral revolution definitely fixed and fully declared, – that the hopes of the faithful may be animated and strengthened, and that the Church may be sustained and strengthened, and that the Church may be sustained and consoled in suffering and trial, cheered with the prospect of deliverance, and prepared for her Lord’s coming.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Judgment of the Papacy: And the Reign of Righteousness</cite>, (1851) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D., Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 1: 272.</span></figcaption>

<blockquote><p>Certainly, that succession is a goodly ornament—if, with the succession of persons, there be also a succession of doctrine and conformity of virtue. But there are many chairs in which those who sit hold a contrary doctrine to their predecessors. Thus, the scribes and Pharisees were sitting in the chair of Moses and had the personal succession; nevertheless, Jesus Christ commanded His disciples to beware of the leaven of their doctrine and reproached them for transgressing the law of God by their tradition (Matt. 15). Thus, the bishops of the churches of Antioch, Rome, and Alexandria boast themselves to be successors of Saint Peter, yet are dissenting and separate in communion. The bishops of Constantinople trace their succession from the Apostle Saint Andrew, as Nicephorus attempts to prove in the eighth book of his Chronology, chapter 6. Yet these bishops, by the judgment of the Roman Church, are schismatics and heretics.</p></blockquote>

</figure><figure class="quote" id="q-df7c06ac5a" data-kw="">
<blockquote><p>The papal antichrist doctrine is a crucial component of the Reformed faith; hence it is enshrined in the Westminster Confession (25:6). Indeed, it is not merely a Reformed view, but is part of historic Protestantism (Lutherans, Anglicans and others held to it). Sadly, this important teaching is both denied and expunged from the Confession (as in the American Presbyterian churches, the Presbyterian Church in Ireland and the Evangelical Presbyterian Church in Ireland), or else it is downplayed and rarely preached upon. Thomas Manton, however, reminds us of several reasons why this teaching should not be abandoned or forgotten about:

Observe, then, that the doctrine of Antichrist is a profitable doctrine, and a point very necessary to be preached and known.

1. It is a point very necessary to admonish and warn the faithful, that they be not circumvented with these delusions, and be found in the opposite state to Christ Jesus, and the interests of his kingdom. God hath blown his trumpet: Rev. xviii. 4, ‘Come out of her, my people, that ye be not partakers of her sins, and that ye receive not of her plagues;’ God calleth his people out of spiritual Babylon; it is dangerous and unsafe being there. If we would escape Babylon’s punishments we must escape her sins, not live in that communion and society where there are such temptations to idolatry and other detestable enormities. It is disputable whether the errors of Popery be damnable, or there be any possibility of salvation in that religion. Some deny all possibility; others, abating from the rigour of that opinion, assert a very great difficulty: 1 Cor. iii. 13, ‘Saved as by fire;’ if so much Christianity left as to save them, it is with much ado. But the question is not about our benefit, but our duty; not whether possibly we may be saved? but what is the way the Lord will have us to walk in? And if there were possibility or probability of salvation in the way, in the general, yet there is very little or none for them that live in a known sin, and especially in a sin of such a dangerous nature as abetting an opposite faction to Christ, such as is that of Antichrist.

2. It is necessary to fortify and forewarn the people of God against a double temptation. (1.) Against scandal; (2.) Against persecutions.

[1.] Against scandal. It is a dangerous temptation to atheism to see Christianity so corrupted and debauched by a vile submission to serve worldly ends, and turned into the pageantry of empty and ridiculous ceremonies, which beget scorn and contempt of it in the minds of all considering beholders; and therefore there are more atheists in Rome and Italy than in other countries. Supernatural things, disguised with a vain pomp, lose their reverence, and do not alarm the conscience, but harden the heart in a settled atheism and contempt of Christ. Now it is a mighty stay to the heart to see that this degeneration was foreseen and foretold: John xvi. 1, ‘These things have I spoken to you, that you should not be offended;’ Mat. xviii. 7, ‘Woe unto the world because of offences! for it must needs be that offences come; but woe to that man by whom the offence cometh!’

[2.] Against persecutions; for the man of sin is also a son of perdition, a destroyer of the saints, and maketh havoc of the people of God. Now it is grievous when Christians suffer by Christians, and we may have many doubtings and misgivings about our cause; but when Antichrist is clearly discovered, we submit the more cheerfully to suffer the hardest things under his tyranny; for suffering under antichristian persecution is martyrdom and suffering for Christ, as much as suffering under Pagan persecution: Rev. xiv. 13, ‘And I heard a voice from heaven saying unto me, write, Blessed are the dead which die in the Lord from henceforth,’ &amp;c. Not only the primitive martyrs, who were put to death by heathens, but those that are condemned by Christians and burned for heretics, those are martyrs also.

3. That we may the better understand true Christianity; ἀντικείμενα παραλληλειμένα μάλιστα φαίνεται, opposites illustrate each other. The two opposite states are Christianity and Antichristianity; the one is a ‘mystery of godliness,’ 1 Tim. iii. 16; the other, ‘a mystery of iniquity.’ The design of the mystery of godliness is to recover men from the devil, the world, and the flesh, unto God; the other, to seduce men from God to the devil, the world, and the flesh again; and that by corrupting the former mystery, or the most excellent institution that ever the world was acquainted with for the ennobling and refining man’s nature; so that Christ’s religion is turned against himself, to lull men’s consciences asleep, whilst they gratify the lusts of the eyes, the lusts of the flesh, or live in pride of life. The devil is gratified by all sin, but especially he is εἰδωλοχαρὴς, as Synesius calleth him; one that delighteth in idols, as knowing this is the best way to make men brutish, or to live in an oblivion or neglect of God; for an idol is ‘a teacher of lies,’ Hab. ii. 18, doth imprint upon the mind carnal and false conceptions of a deity.

4. To confirm us in the truth of the Christian faith, when we see the prophecies of it expressly fulfilled; for this is the Lord’s direction to know a true prophet, Deut. xviii. 22, if the thing come to pass, and the event doth punctually answer the prediction; but when a prophet speaketh in the name of the Lord, and the thing follow not, nor come to pass, that is the thing which the Lord hath not spoken. Now, the apostles did not only teach the church the doctrine of Christianity, but by a prophetic spirit and divine revelation foretold things to come; and among these, the great thing which is to happen and come to pass before Christ’s second coming is Antichrist, or the appearing of the man of sin. Therefore, that we may not doubt of what is past, nor suspect what is further to come, it is good to study these prophecies, and know they are to be fulfilled in their time, that we may say that God, who hath kept touch with the world hitherto in all the predictions of the word, will not fail at last.

Use 1. To reprove them that think this is a curious point not to be searched into. Why then did God reveal it, and that so often by St Paul, by St John, in so many prophetical representations of it? Surely it is not curiosity to search into things revealed, but to intrude ourselves into things hidden, and which God hath put under a veil of secrecy. It is true men must know their measure, and not attempt to run before they can go, and venture upon obscure points before well versed in plain; and it is true, in more abstruse points, men must not rashly define, but soberly and modestly inquire, and compare predictions with plain events; this is no way culpable.

2. To reprove those that are so impatient of giving a little attendance to such doctrines for a while, and think at least matter more profitable should be insisted on; they are persuaded enough already. It is well if it be so; but those that stand should take heed lest they fall; and presumptuous confidence soonest giveth out, and forsaketh Christ. I would but propound this argument to them: If it were profitable for them that were to go out of the body long before Antichrist was revealed to be taught these things again and again, and they be charged to keep these things in remembrance, certainly it is more profitable for others that live at the time when these things are in being, and the temptation is at the next door, ready to break in upon them. Surely it is profitable to discover Antichrist, to reduce those that are gone astray, much more to prevent a revolt, that we may not return to this bondage after a deliverance from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome</cite>, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 46-8.</span></figcaption>

2. It is necessary to fortify and forewarn the people of God against a double temptation. (1.) Against scandal; (2.) Against persecutions.

[1.] Against scandal. It is a dangerous temptation to atheism to see Christianity so corrupted and debauched by a vile submission to serve worldly ends, and turned into the pageantry of empty and ridiculous ceremonies, which beget scorn and contempt of it in the minds of all considering beholders; and therefore there are more atheists in Rome and Italy than in other countries. Supernatural things, disguised with a vain pomp, lose their reverence, and do not alarm the conscience, but harden the heart in a settled atheism and contempt of Christ. Now it is a mighty stay to the heart to see that this degeneration was foreseen and foretold: John xvi. 1, ‘These things have I spoken to you, that you should not be offended;’ Mat. xviii. 7, ‘Woe unto the world because of offences! for it must needs be that offences come; but woe to that man by whom the offence cometh!’

[2.] Against persecutions; for the man of sin is also a son of perdition, a destroyer of the saints, and maketh havoc of the people of God. Now it is grievous when Christians suffer by Christians, and we may have many doubtings and misgivings about our cause; but when Antichrist is clearly discovered, we submit the more cheerfully to suffer the hardest things under his tyranny; for suffering under antichristian persecution is martyrdom and suffering for Christ, as much as suffering under Pagan persecution: Rev. xiv. 13, ‘And I heard a voice from heaven saying unto me, write, Blessed are the dead which die in the Lord from henceforth,’ &amp;c. Not only the primitive martyrs, who were put to death by heathens, but those that are condemned by Christians and burned for heretics, those are martyrs also.

3. That we may the better understand true Christianity; ἀντικείμενα παραλληλειμένα μάλιστα φαίνεται, opposites illustrate each other. The two opposite states are Christianity and Antichristianity; the one is a ‘mystery of godliness,’ 1 Tim. iii. 16; the other, ‘a mystery of iniquity.’ The design of the mystery of godliness is to recover men from the devil, the world, and the flesh, unto God; the other, to seduce men from God to the devil, the world, and the flesh again; and that by corrupting the former mystery, or the most excellent institution that ever the world was acquainted with for the ennobling and refining man’s nature; so that Christ’s religion is turned against himself, to lull men’s consciences asleep, whilst they gratify the lusts of the eyes, the lusts of the flesh, or live in pride of life. The devil is gratified by all sin, but especially he is εἰδωλοχαρὴς, as Synesius calleth him; one that delighteth in idols, as knowing this is the best way to make men brutish, or to live in an oblivion or neglect of God; for an idol is ‘a teacher of lies,’ Hab. ii. 18, doth imprint upon the mind carnal and false conceptions of a deity.

4. To confirm us in the truth of the Christian faith, when we see the prophecies of it expressly fulfilled; for this is the Lord’s direction to know a true prophet, Deut. xviii. 22, if the thing come to pass, and the event doth punctually answer the prediction; but when a prophet speaketh in the name of the Lord, and the thing follow not, nor come to pass, that is the thing which the Lord hath not spoken. Now, the apostles did not only teach the church the doctrine of Christianity, but by a prophetic spirit and divine revelation foretold things to come; and among these, the great thing which is to happen and come to pass before Christ’s second coming is Antichrist, or the appearing of the man of sin. Therefore, that we may not doubt of what is past, nor suspect what is further to come, it is good to study these prophecies, and know they are to be fulfilled in their time, that we may say that God, who hath kept touch with the world hitherto in all the predictions of the word, will not fail at last.

Use 1. To reprove them that think this is a curious point not to be searched into. Why then did God reveal it, and that so often by St Paul, by St John, in so many prophetical representations of it? Surely it is not curiosity to search into things revealed, but to intrude ourselves into things hidden, and which God hath put under a veil of secrecy. It is true men must know their measure, and not attempt to run before they can go, and venture upon obscure points before well versed in plain; and it is true, in more abstruse points, men must not rashly define, but soberly and modestly inquire, and compare predictions with plain events; this is no way culpable.

2. To reprove those that are so impatient of giving a little attendance to such doctrines for a while, and think at least matter more profitable should be insisted on; they are persuaded enough already. It is well if it be so; but those that stand should take heed lest they fall; and presumptuous confidence soonest giveth out, and forsaketh Christ. I would but propound this argument to them: If it were profitable for them that were to go out of the body long before Antichrist was revealed to be taught these things again and again, and they be charged to keep these things in remembrance, certainly it is more profitable for others that live at the time when these things are in being, and the temptation is at the next door, ready to break in upon them. Surely it is profitable to discover Antichrist, to reduce those that are gone astray, much more to prevent a revolt, that we may not return to this bondage after a deliverance from it.”

— Thomas Manton, Eighteen sermons on the second chapter of the second epistle to the Thessalonians, containing the description, rise, growth, and fall of antichrist, with divers cautions and arguments to establish Christians against the apostasy of the Church of Rome, (1679) in The complete works of Thomas Manton, D.D. (22 vols, London, 1871), iii, 46-8.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+papal+antichrist+doctrine+is+a+crucial+component+of+the+Reformed+faith%3B+hence+it+is+enshrined+in+the+Westminster+Confession+%2825%3A6%29.+Indeed%2C+it+is+not+merely+a+Reformed+view%2C+but+is+part+of+historic+Protestantism+%28Lutherans%2C+Anglicans+and+others+held+to+it%29.+Sadly%2C+this+important+teaching+is+both+denied+and+expunged+from+the+Confession+%28as+in+the+American+Presbyterian+churches%2C+the+Presbyterian+Church+in+Ireland+and+the+Evangelical+Presbyterian+Church+in+Ireland%29%2C+or+else+it+is+downplayed+and+rarely+preached+upon.+Thomas+Manton%2C+however%2C+reminds+us+of+several+reasons+why+this+teaching+should+not+be+abandoned+or+forgotten+about%3A%0A%0AObserve%2C+then%2C+that+the+doctrine+of+Antichrist+is+a+profitable+doctrine%2C+and+a+point+very+necessary+to+be+preached+and+known.%0A%0A1.+It+is+a+point+very+necessary+to+admonish+and+warn+the+faithful%2C+that+they+be+not+circumvented+with+these+delusions%2C+and+be+found+in+the+opposite+state+to+Christ+Jesus%2C+and+the+interests+of+his+kingdom.+God+hath+blown+his+trumpet%3A+Rev.+xviii.+4%2C+%E2%80%98Come+out+of+her%2C+my+people%2C+that+ye+be+not+partakers+of+her+sins%2C+and+that+ye+receive+not+of+her+plagues%3B%E2%80%99+God+calleth+his+people+out+of+spiritual+Babylon%3B+it+is+dangerous+and+unsafe+being+there.+If+we+would+escape+Babylon%E2%80%99s+punishments+we+must+escape+her+sins%2C+not+live+in+that+communion+and+society+where+there+are+such+temptations+to+idolatry+and+other+detestable+enormities.+It+is+disputable+whether+the+errors+of+Popery+be+damnable%2C+or+there+be+any+possibility+of+salvation+in+that+religion.+Some+deny+all+possibility%3B+others%2C+abating+from+the+rigour+of+that+opinion%2C+assert+a+very+great+difficulty%3A+1+Cor.+iii.+13%2C+%E2%80%98Saved+as+by+fire%3B%E2%80%99+if+so+much+Christianity+left+as+to+save+them%2C+it+is+with+much+ado.+But+the+question+is+not+about+our+benefit%2C+but+our+duty%3B+not+whether+possibly+we+may+be+saved%3F+but+what+is+the+way+the+Lord+will+have+us+to+walk+in%3F+And+if+there+were+possibility+or+probability+of+salvation+in+the+way%2C+in+the+general%2C+yet+there+is+very+little+or+none+for+them+that+live+in+a+known+sin%2C+and+especially+in+a+sin+of+such+a+dangerous+nature+as+abetting+an+opposite+faction+to+Christ%2C+such+as+is+that+of+Antichrist.%0A%0A2.+It+is+necessary+to+fortify+and+forewarn+the+people+of+God+against+a+double+temptation.+%281.%29+Against+scandal%3B+%282.%29+Against+persecutions.%0A%0A%5B1.%5D+Against+scandal.+It+is+a+dangerous+temptation+to+atheism+to+see+Christianity+so+corrupted+and+debauched+by+a+vile+submission+to+serve+worldly+ends%2C+and+turned+into+the+pageantry+of+empty+and+ridiculous+ceremonies%2C+which+beget+scorn+and+contempt+of+it+in+the+minds+of+all+considering+beholders%3B+and+therefore+there+are+more+atheists+in+Rome+and+Italy+than+in+other+countries.+Supernatural+things%2C+disguised+with+a+vain+pomp%2C+lose+their+reverence%2C+and+do+not+alarm+the+conscience%2C+but+harden+the+heart+in+a+settled+atheism+and+contempt+of+Christ.+Now+it+is+a+mighty+stay+to+the+heart+to+see+that+this+degeneration+was+foreseen+and+foretold%3A+John+xvi.+1%2C+%E2%80%98These+things+have+I+spoken+to+you%2C+that+you+should+not+be+offended%3B%E2%80%99+Mat.+xviii.+7%2C+%E2%80%98Woe+unto+the+world+because+of+offences%21+for+it+must+needs+be+that+offences+come%3B+but+woe+to+that+man+by+whom+the+offence+cometh%21%E2%80%99%0A%0A%5B2.%5D+Against+persecutions%3B+for+the+man+of+sin+is+also+a+son+of+perdition%2C+a+destroyer+of+the+saints%2C+and+maketh+havoc+of+the+people+of+God.+Now+it+is+grievous+when+Christians+suffer+by+Christians%2C+and+we+may+have+many+doubtings+and+misgivings+about+our+cause%3B+but+when+Antichrist+is+clearly+discovered%2C+we+submit+the+more+cheerfully+to+suffer+the+hardest+things+under+his+tyranny%3B+for+suffering+under+antichristian+persecution+is+martyrdom+and+suffering+for+Christ%2C+as+much+as+suffering+under+Pagan+persecution%3A+Rev.+xiv.+13%2C+%E2%80%98And+I+heard+a+voice+from+heaven+saying+unto+me%2C+write%2C+Blessed+are+the+dead+which+die+in+the+Lord+from+henceforth%2C%E2%80%99+%26c.+Not+only+the+primitive+martyrs%2C+who+were+put+to+death+by+heathens%2C+but+those+that+are+condemned+by+Christians+and+burned+for+heretics%2C+those+are+martyrs+also.%0A%0A3.+That+we+may+the+better+understand+true+Christianity%3B+%E1%BC%80%CE%BD%CF%84%CE%B9%CE%BA%CE%B5%CE%AF%CE%BC%CE%B5%CE%BD%CE%B1+%CF%80%CE%B1%CF%81%CE%B1%CE%BB%CE%BB%CE%B7%CE%BB%CE%B5%CE%B9%CE%BC%CE%AD%CE%BD%CE%B1+%CE%BC%CE%AC%CE%BB%CE%B9%CF%83%CF%84%CE%B1+%CF%86%CE%B1%CE%AF%CE%BD%CE%B5%CF%84%CE%B1%CE%B9%2C+opposites+illustrate+each+other.+The+two+opposite+states+are+Christianity+and+Antichristianity%3B+the+one+is+a+%E2%80%98mystery+of+godliness%2C%E2%80%99+1+Tim.+iii.+16%3B+the+other%2C+%E2%80%98a+mystery+of+iniquity.%E2%80%99+The+design+of+the+mystery+of+godliness+is+to+recover+men+from+the+devil%2C+the+world%2C+and+the+flesh%2C+unto+God%3B+the+other%2C+to+seduce+men+from+God+to+the+devil%2C+the+world%2C+and+the+flesh+again%3B+and+that+by+corrupting+the+former+mystery%2C+or+the+most+excellent+institution+that+ever+the+world+was+acquainted+with+for+the+ennobling+and+refining+man%E2%80%99s+nature%3B+so+that+Christ%E2%80%99s+religion+is+turned+against+himself%2C+to+lull+men%E2%80%99s+consciences+asleep%2C+whilst+they+gratify+the+lusts+of+the+eyes%2C+the+lusts+of+the+flesh%2C+or+live+in+pride+of+life.+The+devil+is+gratified+by+all+sin%2C+but+especially+he+is+%CE%B5%E1%BC%B0%CE%B4%CF%89%CE%BB%CE%BF%CF%87%CE%B1%CF%81%E1%BD%B4%CF%82%2C+as+Synesius+calleth+him%3B+one+that+delighteth+in+idols%2C+as+knowing+this+is+the+best+way+to+make+men+brutish%2C+or+to+live+in+an+oblivion+or+neglect+of+God%3B+for+an+idol+is+%E2%80%98a+teacher+of+lies%2C%E2%80%99+Hab.+ii.+18%2C+doth+imprint+upon+the+mind+carnal+and+false+conceptions+of+a+deity.%0A%0A4.+To+confirm+us+in+the+truth+of+the+Christian+faith%2C+when+we+see+the+prophecies+of+it+expressly+fulfilled%3B+for+this+is+the+Lord%E2%80%99s+direction+to+know+a+true+prophet%2C+Deut.+xviii.+22%2C+if+the+thing+come+to+pass%2C+and+the+event+doth+punctually+answer+the+prediction%3B+but+when+a+prophet+speaketh+in+the+name+of+the+Lord%2C+and+the+thing+follow+not%2C+nor+come+to+pass%2C+that+is+the+thing+which+the+Lord+hath+not+spoken.+Now%2C+the+apostles+did+not+only+teach+the+church+the+doctrine+of+Christianity%2C+but+by+a+prophetic+spirit+and+divine+revelation+foretold+things+to+come%3B+and+among+these%2C+the+great+thing+which+is+to+happen+and+come+to+pass+before+Christ%E2%80%99s+second+coming+is+Antichrist%2C+or+the+appearing+of+the+man+of+sin.+Therefore%2C+that+we+may+not+doubt+of+what+is+past%2C+nor+suspect+what+is+further+to+come%2C+it+is+good+to+study+these+prophecies%2C+and+know+they+are+to+be+fulfilled+in+their+time%2C+that+we+may+say+that+God%2C+who+hath+kept+touch+with+the+world+hitherto+in+all+the+predictions+of+the+word%2C+will+not+fail+at+last.%0A%0AUse+1.+To+reprove+them+that+think+this+is+a+curious+point+not+to+be+searched+into.+Why+then+did+God+reveal+it%2C+and+that+so+often+by+St+Paul%2C+by+St+John%2C+in+so+many+prophetical+representations+of+it%3F+Surely+it+is+not+curiosity+to+search+into+things+revealed%2C+but+to+intrude+ourselves+into+things+hidden%2C+and+which+God+hath+put+under+a+veil+of+secrecy.+It+is+true+men+must+know+their+measure%2C+and+not+attempt+to+run+before+they+can+go%2C+and+venture+upon+obscure+points+before+well+versed+in+plain%3B+and+it+is+true%2C+in+more+abstruse+points%2C+men+must+not+rashly+define%2C+but+soberly+and+modestly+inquire%2C+and+compare+predictions+with+plain+events%3B+this+is+no+way+culpable.%0A%0A2.+To+reprove+those+that+are+so+impatient+of+giving+a+little+attendance+to+such+doctrines+for+a+while%2C+and+think+at+least+matter+more+profitable+should+be+insisted+on%3B+they+are+persuaded+enough+already.+It+is+well+if+it+be+so%3B+but+those+that+stand+should+take+heed+lest+they+fall%3B+and+presumptuous+confidence+soonest+giveth+out%2C+and+forsaketh+Christ.+I+would+but+propound+this+argument+to+them%3A+If+it+were+profitable+for+them+that+were+to+go+out+of+the+body+long+before+Antichrist+was+revealed+to+be+taught+these+things+again+and+again%2C+and+they+be+charged+to+keep+these+things+in+remembrance%2C+certainly+it+is+more+profitable+for+others+that+live+at+the+time+when+these+things+are+in+being%2C+and+the+temptation+is+at+the+next+door%2C+ready+to+break+in+upon+them.+Surely+it+is+profitable+to+discover+Antichrist%2C+to+reduce+those+that+are+gone+astray%2C+much+more+to+prevent+a+revolt%2C+that+we+may+not+return+to+this+bondage+after+a+deliverance+from+it.%E2%80%9D%0A%0A%E2%80%94+Thomas+Manton%2C+Eighteen+sermons+on+the+second+chapter+of+the+second+epistle+to+the+Thessalonians%2C+containing+the+description%2C+rise%2C+growth%2C+and+fall+of+antichrist%2C+with+divers+cautions+and+arguments+to+establish+Christians+against+the+apostasy+of+the+Church+of+Rome%2C+%281679%29+in+The+complete+works+of+Thomas+Manton%2C+D.D.+%2822+vols%2C+London%2C+1871%29%2C+iii%2C+46-8.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdf7c06ac5a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/df7c06ac5a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2013/01/15/thomas-manton-on-the-importance-of-believing-that-the-pope-is-the-antichrist/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

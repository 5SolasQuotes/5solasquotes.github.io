<main class="wrap"><figure class="quote" id="q-5ce1756f65" data-kw="">
<blockquote><p>Warfield, following the Scottish Reformation, made the case that all humans can use reason to know God. This isn’t a statement about the noetic effects of the fall but a statement about reason. Reason makes God known. Reason is that by which we understand anything at all. It is not simply a first principle because we use reason even to form first principles. Reason is transcendental, meaning it cannot be questioned because it makes questioning possible. We use reason to form beliefs about nature, and we use reason to form beliefs about scripture. Humans are fallen having a darkened mind meaning they have rejected reason and for that they are without excuse. Reason and argument are still there to reveal their condition in unbelief and its consequences. Warfield is speaking of reason as the laws of thought (right reason), Kuyper of man’s reasoning process. Warfield’s definition is more basic. It is the failure to correctly define reason that allowed the challenges of Hume and Kant to the knowledge of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/owen-anderson.html">Owen Anderson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Natural Theology &amp; the Clarity of General Revelation’ (2022)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>Rom. 1:19, 20 (concerning that which may be known of God, gnōstō tou Theou) does not favor a common religion by which all may be saved and which is sufficient for salvation. (1) Only that which may be known (gnōstō) is there spoken of and not that which is to be believed (pistō), which alone is saving. (2) Paul says the knowledge (to gnōston) of God is manifest in the Gentiles, but not all knowledge (pan gnōston) (viz., what may be learned from the book of nature, but not all that may be known of him from his word and which must be known in order to salvation, such as the mystery of the Trinity, and of Christ the Redeemer, etc.). (3) This knowledge (gnōston) which is restricted by the apostle to his “power and godhead” (i.e., to the knowledge of his existence and of those attributes which strike our senses in the works of creation and providence) is usually referred to natural theology; but is not extended to the knowledge of his will and mercy in Christ which can be derived only from his word, and not at all from his works and without which there can be no salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 1.4</span></figcaption>

</figure><figure class="quote" id="q-113e4d4b8c" data-kw="">
<blockquote><p>But if ye take it [“calling”] to be meant of the other calling which has a much larger scope, namely of the beholding (Rom. 1:19) of nature whereby is understood that which may be known of God: not even this other is so universally true as that it comprehends every several person. For how many have died and daily do die in such age as is utterly unfit for that contemplation? There cannot, nor may not, any calling, and much less any election, be warranted to be universal, but only to be indefinite: and that must also be only with an exclusion of these certain circumstances aforesaid.</p></blockquote>

<blockquote><p>What is the purpose of human existence? Both Christianity and classical philosophy in the Platonic and Aristotelian traditions answer that our highest end is to know God. But there is, according to Roman Catholic theology, a crucial difference between the knowledge of God that philosophy makes possible, and the kind that Christian revelation promises. Unaided human reason can establish that there exists a divine first cause of the world. It can infer God’s unity, perfect goodness, omnipotence, omniscience, and many other divine attributes. But it cannot afford us a direct (as opposed to merely inferential) knowledge of God’s very essence or nature. For example, it cannot reveal the Trinitarian inner life of God as three divine Persons. The direct apprehension of God’s essence is known as the beatific vision, and Catholic teaching holds that it is not something we are naturally capable of. Attaining it requires grace or supernatural assistance in the sense of special divine action to raise us above or beyond (hence the prefix “super-”) what our nature makes possible. Since it is not an end we are naturally capable of achieving, neither is it an end we are by nature made for. Rather, it is a supernatural end (again, in the sense of above or beyond our nature), to which God has graciously raised us. By nature alone we are aimed only toward an incomplete knowledge of God, such as the kind that philosophy provides. By grace we are directed toward the most intimate knowledge of him that is possible for a created thing. I have left out various nuances and details… On one side [of the 20th century Romanist debate] were Thomist theologians (that is to say, followers of St. Thomas Aquinas) such as Reginald Garrigou-Lagrange (1877–1964), who developed and defended the account just summarized. … …human beings are not, by nature, completely closed off to the beatific vision. They do by nature have what is called an “obediential potency” for it, a built-in capacity to have a supernatural end added to them. But Hart [who is Eastern Orthodox] dismisses this notion as doubletalk. If we really have such a capacity, he says, then this would after all amount to a natural orientation toward the beatific vision; whereas if it would not amount to that, then we are back to the problem that, by raising us to that end, God would be replacing us with some other kind of creature rather than transforming us. The notion of an “obediential potency” is supposed to be a middle ground between these options, but, Hart insists, there is no such middle ground. Yet that Hart is wrong about this is clear even from simple analogies drawn from everyday modern life. Consider the laptop computer on which you might be reading this. There is an obvious sense in which it is complete all by itself, with its operating system, other software installed in the factory, built-in Wi-Fi capability, and so on. Yet it has the capacity to have added to it all sorts of new software and accessories (via download, or through USB and HDMI ports and the like)—including, if it is old enough, some that had not even been invented at the time the computer was designed and manufactured. Since software and accessories of the latter sort were not even in view when the computer was designed, they cannot be said to be ends for which the computer was made. All the same, they are ends that might be added to it, because it does at least have the inherent capacity to have such ends added to it. This is analogous to the notion of an “obediential potency,” and it indicates the sense in which there is indeed a middle ground of just the sort Hart claims is impossible. In what Thomists call a state of “pure nature,” human beings would not have the beatific vision as an end to which they are directed, any more than a computer is oriented toward running some application that did not even exist when it was manufactured. But just as a computer does nevertheless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them. Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice. Now, like other critics of the Thomist position, Hart insists that an orientation toward the supernatural end of the beatific vision is natural to us. Taken at face value, this is simply incoherent. If an orientation toward a certain end really is natural to us, then it makes no sense to describe it as supernatural (that is to say, beyond our nature). Or, if it really is supernatural, then it makes no sense to describe it as natural. However, in fairness to Hart, I don’t think he is actually guilty of this particular sort of incoherence. In order to be guilty of it, you have to acknowledge that there really is a distinction in reality between the natural order and the supernatural order. Catholic thinkers like de Lubac do acknowledge this, which is why it is difficult for them to formulate a coherent alternative to the Thomist position. But Hart does not acknowledge it. He insists on collapsing the distinctions between natural and supernatural, between nature and grace, and between God’s creating us and his orienting us to the beatific vision. And this is where his position becomes truly radical—indeed, as I have said, pantheistic. To understand how and why Hart goes in the extreme direction he does, it is useful to note that one of the motivations for the Thomist position he rejects is the thesis that the vision of God’s very essence is natural only to God himself, and not to any created thing (as Aquinas says in Question 27, Article 2 of De Veritate). This implies that to attribute to human beings a natural capacity to know God’s very essence would be to identify them with God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘David Bentley Hart’s Post-Christian Pantheism’ (2022) at Public Discourse</cite></span></figcaption>

eless have a capacity to have such applications added to it, so too are human beings made in such a way that an orientation toward the beatific vision might be imparted to them. Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice. Now, like other critics of the Thomist position, Hart insists that an orientation toward the supernatural end of the beatific vision is natural to us. Taken at face value, this is simply incoherent. If an orientation toward a certain end really is natural to us, then it makes no sense to describe it as supernatural (that is to say, beyond our nature). Or, if it really is supernatural, then it makes no sense to describe it as natural. However, in fairness to Hart, I don’t think he is actually guilty of this particular sort of incoherence. In order to be guilty of it, you have to acknowledge that there really is a distinction in reality between the natural order and the supernatural order. Catholic thinkers like de Lubac do acknowledge this, which is why it is difficult for them to formulate a coherent alternative to the Thomist position. But Hart does not acknowledge it. He insists on collapsing the distinctions between natural and supernatural, between nature and grace, and between God’s creating us and his orienting us to the beatific vision. And this is where his position becomes truly radical—indeed, as I have said, pantheistic. To understand how and why Hart goes in the extreme direction he does, it is useful to note that one of the motivations for the Thomist position he rejects is the thesis that the vision of God’s very essence is natural only to God himself, and not to any created thing (as Aquinas says in Question 27, Article 2 of De Veritate). This implies that to attribute to human beings a natural capacity to know God’s very essence would be to identify them with God.”

— Edward Feser, ‘David Bentley Hart’s Post-Christian Pantheism’ (2022) at Public Discourse">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhat+is+the+purpose+of+human+existence%3F+Both+Christianity+and+classical+philosophy+in+the+Platonic+and+Aristotelian+traditions+answer+that+our+highest+end+is+to+know+God.+But+there+is%2C+according+to+Roman+Catholic+theology%2C+a+crucial+difference+between+the+knowledge+of+God+that+philosophy+makes+possible%2C+and+the+kind+that+Christian+revelation+promises.+Unaided+human+reason+can+establish+that+there+exists+a+divine+first+cause+of+the+world.+It+can+infer+God%E2%80%99s+unity%2C+perfect+goodness%2C+omnipotence%2C+omniscience%2C+and+many+other+divine+attributes.+But+it+cannot+afford+us+a+direct+%28as+opposed+to+merely+inferential%29+knowledge+of+God%E2%80%99s+very+essence+or+nature.+For+example%2C+it+cannot+reveal+the+Trinitarian+inner+life+of+God+as+three+divine+Persons.+The+direct+apprehension+of+God%E2%80%99s+essence+is+known+as+the+beatific+vision%2C+and+Catholic+teaching+holds+that+it+is+not+something+we+are+naturally+capable+of.+Attaining+it+requires+grace+or+supernatural+assistance+in+the+sense+of+special+divine+action+to+raise+us+above+or+beyond+%28hence+the+prefix+%E2%80%9Csuper-%E2%80%9D%29+what+our+nature+makes+possible.+Since+it+is+not+an+end+we+are+naturally+capable+of+achieving%2C+neither+is+it+an+end+we+are+by+nature+made+for.+Rather%2C+it+is+a+supernatural+end+%28again%2C+in+the+sense+of+above+or+beyond+our+nature%29%2C+to+which+God+has+graciously+raised+us.+By+nature+alone+we+are+aimed+only+toward+an+incomplete+knowledge+of+God%2C+such+as+the+kind+that+philosophy+provides.+By+grace+we+are+directed+toward+the+most+intimate+knowledge+of+him+that+is+possible+for+a+created+thing.+I+have+left+out+various+nuances+and+details%E2%80%A6+On+one+side+%5Bof+the+20th+century+Romanist+debate%5D+were+Thomist+theologians+%28that+is+to+say%2C+followers+of+St.+Thomas+Aquinas%29+such+as+Reginald+Garrigou-Lagrange+%281877%E2%80%931964%29%2C+who+developed+and+defended+the+account+just+summarized.+%E2%80%A6+%E2%80%A6human+beings+are+not%2C+by+nature%2C+completely+closed+off+to+the+beatific+vision.+They+do+by+nature+have+what+is+called+an+%E2%80%9Cobediential+potency%E2%80%9D+for+it%2C+a+built-in+capacity+to+have+a+supernatural+end+added+to+them.+But+Hart+%5Bwho+is+Eastern+Orthodox%5D+dismisses+this+notion+as+doubletalk.+If+we+really+have+such+a+capacity%2C+he+says%2C+then+this+would+after+all+amount+to+a+natural+orientation+toward+the+beatific+vision%3B+whereas+if+it+would+not+amount+to+that%2C+then+we+are+back+to+the+problem+that%2C+by+raising+us+to+that+end%2C+God+would+be+replacing+us+with+some+other+kind+of+creature+rather+than+transforming+us.+The+notion+of+an+%E2%80%9Cobediential+potency%E2%80%9D+is+supposed+to+be+a+middle+ground+between+these+options%2C+but%2C+Hart+insists%2C+there+is+no+such+middle+ground.+Yet+that+Hart+is+wrong+about+this+is+clear+even+from+simple+analogies+drawn+from+everyday+modern+life.+Consider+the+laptop+computer+on+which+you+might+be+reading+this.+There+is+an+obvious+sense+in+which+it+is+complete+all+by+itself%2C+with+its+operating+system%2C+other+software+installed+in+the+factory%2C+built-in+Wi-Fi+capability%2C+and+so+on.+Yet+it+has+the+capacity+to+have+added+to+it+all+sorts+of+new+software+and+accessories+%28via+download%2C+or+through+USB+and+HDMI+ports+and+the+like%29%E2%80%94including%2C+if+it+is+old+enough%2C+some+that+had+not+even+been+invented+at+the+time+the+computer+was+designed+and+manufactured.+Since+software+and+accessories+of+the+latter+sort+were+not+even+in+view+when+the+computer+was+designed%2C+they+cannot+be+said+to+be+ends+for+which+the+computer+was+made.+All+the+same%2C+they+are+ends+that+might+be+added+to+it%2C+because+it+does+at+least+have+the+inherent+capacity+to+have+such+ends+added+to+it.+This+is+analogous+to+the+notion+of+an+%E2%80%9Cobediential+potency%2C%E2%80%9D+and+it+indicates+the+sense+in+which+there+is+indeed+a+middle+ground+of+just+the+sort+Hart+claims+is+impossible.+In+what+Thomists+call+a+state+of+%E2%80%9Cpure+nature%2C%E2%80%9D+human+beings+would+not+have+the+beatific+vision+as+an+end+to+which+they+are+directed%2C+any+more+than+a+computer+is+oriented+toward+running+some+application+that+did+not+even+exist+when+it+was+manufactured.+But+just+as+a+computer+does+nevertheless+have+a+capacity+to+have+such+applications+added+to+it%2C+so+too+are+human+beings+made+in+such+a+way+that+an+orientation+toward+the+beatific+vision+might+be+imparted+to+them.+Hart%E2%80%99s+second+main+objection+is+that+any+rational+creature+would%2C+just+by+virtue+of+being+rational%2C+desire+to+know+the+very+essence+of+the+first+cause+of+all+things%2C+so+that+such+knowledge+would+be+its+natural+end.+There+is+a+sense+in+which+the+premise+is+true%2C+but+the+conclusion+does+not+follow.+To+borrow+an+example+from+the+philosopher+Thomas+Nagel%2C+consider+that+there+is+an+obvious+sense+in+which+a+human+being+might+desire+to+know+what+it+is+like+to+be+a+bat%E2%80%94to+fly+through+the+air+the+way+a+bat+does%2C+to+get+around+via+echolocation%2C+and+so+on.+Yet+there+is+also+an+obvious+sense+in+which+it+is+simply+not+part+of+our+nature+to+do+these+things%2C+so+that+human+beings+can+live+complete+lives+as+the+kind+of+creatures+we+are+without+doing+them.+For+that+reason%2C+our+curiosity+about+what+it+is+like+to+be+a+bat+does+not+entail+a+sense+of+deprivation+or+loss+in+the+way+that%2C+say%2C+a+missing+limb+would.+In+an+analogous+way%2C+had+human+beings+been+created+in+a+state+of+%E2%80%9Cpure+nature%2C%E2%80%9D+without+a+divinely+imparted+orientation+toward+the+supernatural+end+of+the+beatific+vision%2C+they+might+in+a+sense+nevertheless+wish+that+they+could+have+a+direct+knowledge+of+God%E2%80%99s+very+essence.+But+they+would+also+judge+that+this+is+simply+no+more+possible+for+them+than+it+is+possible+for+them+to+know+what+it+is+like+to+be+a+bat%2C+and+thus+they+would+not+feel+this+impossibility+as+a+deprivation+of+something+they+were+by+nature+made+for.+The+indirect+knowledge+of+God+that+they+are+capable+of+would+suffice.+Now%2C+like+other+critics+of+the+Thomist+position%2C+Hart+insists+that+an+orientation+toward+the+supernatural+end+of+the+beatific+vision+is+natural+to+us.+Taken+at+face+value%2C+this+is+simply+incoherent.+If+an+orientation+toward+a+certain+end+really+is+natural+to+us%2C+then+it+makes+no+sense+to+describe+it+as+supernatural+%28that+is+to+say%2C+beyond+our+nature%29.+Or%2C+if+it+really+is+supernatural%2C+then+it+makes+no+sense+to+describe+it+as+natural.+However%2C+in+fairness+to+Hart%2C+I+don%E2%80%99t+think+he+is+actually+guilty+of+this+particular+sort+of+incoherence.+In+order+to+be+guilty+of+it%2C+you+have+to+acknowledge+that+there+really+is+a+distinction+in+reality+between+the+natural+order+and+the+supernatural+order.+Catholic+thinkers+like+de+Lubac+do+acknowledge+this%2C+which+is+why+it+is+difficult+for+them+to+formulate+a+coherent+alternative+to+the+Thomist+position.+But+Hart+does+not+acknowledge+it.+He+insists+on+collapsing+the+distinctions+between+natural+and+supernatural%2C+between+nature+and+grace%2C+and+between+God%E2%80%99s+creating+us+and+his+orienting+us+to+the+beatific+vision.+And+this+is+where+his+position+becomes+truly+radical%E2%80%94indeed%2C+as+I+have+said%2C+pantheistic.+To+understand+how+and+why+Hart+goes+in+the+extreme+direction+he+does%2C+it+is+useful+to+note+that+one+of+the+motivations+for+the+Thomist+position+he+rejects+is+the+thesis+that+the+vision+of+God%E2%80%99s+very+essence+is+natural+only+to+God+himself%2C+and+not+to+any+created+thing+%28as+Aquinas+says+in+Question+27%2C+Article+2+of+De+Veritate%29.+This+implies+that+to+attribute+to+human+beings+a+natural+capacity+to+know+God%E2%80%99s+very+essence+would+be+to+identify+them+with+God.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+%E2%80%98David+Bentley+Hart%E2%80%99s+Post-Christian+Pantheism%E2%80%99+%282022%29+at+Public+Discourse&amp;url=https%3A%2F%2F5solasquotes.github.io%2

<main class="wrap"><figure class="quote" id="q-a2a46dd05d" data-kw="">
<blockquote><p>…there can exist circumstances under which it is not only advisable but imperative that birth control should be practiced–for instance, where there are conditions of the utmost poverty in which it is impossible to provide for the needs of the children and to give them a fair chance in life. Or, where one of the parents is physically or mentally in such a state that it is undesirable for them to have children–if one of them, for instance, is subject to a disease that is likely to be handed on from parent to child, or if the mother’s physical condition makes pregnancy undesirable. And for every couple birth control is essential for the best spacing of children–so as to fit financial, physical and other circumstances. No hard and fast rules can be laid down.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed6aab79e7" data-kw="">
<blockquote><p>The Third Proposition, The soul being thus created an essential part of a man, and the form informing of him: Hence it is that we must not conceive the soul to be first created, as it were, of itself subsisting, and then infused into the body, but when the materials are sufficiently prepared then as the schoolmen expresse it well, Infundendo creatur, and creando infuditur, ‘it’s infused by the creating of it’, and ‘created by infusing’; So that the soul is made in the body organized, not without it; so the Scripture, Zech. 12:1, ‘Who formeth the spirit of man with him,’ and because of the soul’s union to the body when thus disposed;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Original Sin</cite>, (London, 1658), p. 2, ch. 24, sect. 7, p. 201</span></figcaption>

</figure><figure class="quote" id="q-cd6d2ebebc" data-kw="">
<blockquote><p>The same command of fruitfulness that was given to man was also given to the land (Gen. 1:11-12; Psalm 107:37; Ezek. 36:29) and was called a blessing (Deut. 7:13; Ezek. 36:19). Is failing to make the land be fruitful every year a “despising of God’s blessings” or a violation of His Dominion Command? Obviously not. The land has been fruitful for six years, and taking a year off (spacing) in no way violates the command. If spacing crops does not violate the identical command to be fruitful and multiply, I fail to see how spacing children (whether by six months, 12 months, or more) violates that command. This is using the analogy of Scripture to understand the command to be fruitful and multiply… the [Levitical] law allowed the land to rest one year in seven… If the woman ‘who has many children has become feeble’ (1 Sam. 2:5), it might be time to let her strengthen… the burden of proof is upon those who say spacing babies is a sin… is it sinful to take days off beyond the Sabbath day in our yearly schedules?… What makes giving a very productive wife some rest from child-bearing a sin? Could this not justify spacing babies by one year or more to provide for the wife’s strength and health, and/or to save up money to be able to pay for the delivery costs of the next baby? Could it not be used to postpone having a child while the wife’s health was in jeopardy? If a woman was having chemotherapy for cancer, the chemo would endanger the baby’s life. This would certainly be a good time to exercise conception control.</p></blockquote>

<blockquote><p>The oral contraceptive principle has its basis in the Talmud as a potion or ‘cup of roots,’ the kos shel ikkarin. The ‘roots’ in that potion may refer to its herbal ingredients (the modern progesterone pill makes use of roots of the Mexican yam), and the mixture, in varying compositions, had many purposes… The kos shel ikkarin itself could, in a different dosage or composition, cause fertility rather than sterility, or could cure certain ailments [pointing to its hormonal nature]. An inquiry concerning the wife’s right to drink a potion that would help her become pregnant (sam l’hit-abber) was addressed to the eminent R. Solomon ben Adret of the thirteenth century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-m-feldman.html">David M. Feldman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Birth Control in Jewish Law</cite>, (1968; Schocken Books, 1974) 315 pp. ToC, p. 235</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/life-birth-and-medical-ethics.html">Life, Birth and Medical Ethics</a></span></div>

<blockquote><p>…first I say that death of its own nature is evil: for God threatens the same and does cast it upon us as a punishment. Moreover, it is put as contrary unto life, which we doubt not but is good… But now I only ask this: If death be evil, why is it sometime wished for: for nothing can be desired but has some consideration of good? But you will say that even this has then some consideration of good, when men are thereby delivered from the grievous evils which they think that either they be not able to bear, or that in abiding of them they shall be grievously troubled: or else, when by the same they obtain some notable good thing. Wherefore, though it sometime appear lawful to wish death for any of these, yet is it a doubt whether one may kill himself for those things… But I speak nothing hear of them which slay themselves through frenzy and madness [insanity]… it may rather seem hear that they should be pitied… And we will use this proposition: It is not lawful for one to kill himself for any of those things which I have showed… And when the Amalechite had said that he stood upon the body of Saul while he was dying and did press him down that he might die the more easily, David answered, ‘Thou art the son of death.’ (2 Sam. 1:16) But if it had been lawful for Saul to have killed himself, how could the young man, which hastened his death, be worthy of death? For it is lawful for one to help another in an honest matter, and especially his prince. And if the law forbid thee to kill another man, it much rather forbids thee to kill thyself, since that which is not lawful for thee to do to another, is unlawful for thee to do to thyself. For the rule of charity must be taken from that charity wherewith we love ourselves.</p></blockquote>

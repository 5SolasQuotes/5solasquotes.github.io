<main class="wrap"><figure class="quote" id="q-fbb9050d7e" data-kw="">
<blockquote><p>The great question is, of which sort is our righteousness whereby we are justified? I answer, of the second sort [Christ’s passive righteousness], which yet is no derogation from it: for though it be not a righteousness so honoring ourselves, yet is it as excellent in Christ, and honorable to Him. And this first kind of righteousness [Christ’s active righteousness] as it is in Christ, cannot, retaining its own form, be made ours. And to that the Papists arguments will hold good. The Law commanded our own personal obedience, and not another for us; We did not so personally obey, we did not really obey in Christ: and God does not judge us to do what we did not; If we had, yet it would not have made us just: for one sin will make us unjust, though we were never so obedient before and after; Therefore if we had obeyed in Christ, and yet sinned in ourselves, we are breakers of the Law still. And so our righteousness cannot be of the first sort. This breach therefore must be satisfied for, and consequently, our righteousness must be of the second sort: seeing both cannot stand in one person as before said. Christ indeed had both these kinds of righteousness, viz. the righteousness of perfect obedience; and the righteousness of satisfaction for disobedience. But the former only was his own personal righteousnes, not communicable to another under that notion, and in that form of ‘a righteousness by obeying’. The latter, was his righteousness, as he stood in our room, and was by imputation a sinner: and so is also our righteousness in and through Him. Yet the former [Christ’s active righteousness] (as I have proved before etc.) is ours too, and our righteousness too (though many divines think otherwise), but how? Not as retaining its form, in the former sense: but as it is also in a further consideration, a part of the righteousness by satisfaction: seeing that Christ’s very personal obediential righteousness was also in a further respect satisfactory.</p></blockquote>

</figure><figure class="quote" id="q-6b0386e2f3" data-kw="">
<blockquote><p>XXX. We are justified by that righteousness alone by which our Surety was freed from our guilt. But He was fully freed from our guilt by the power of the satisfaction which He rendered on our behalf; therefore, by that same righteousness alone, we too are fully justified. Who would deny that, when the debt owed by us is paid, the handwriting that was against us (Col. 2:14) is erased, and we are no longer liable to our creditor? That by the same righteousness by which we are redeemed from condemnation and the curse of the law (Gal. 3:13), we are also justified? That by the same satisfaction by which divine justice was perfectly satisfied for us, and by which we were so reconciled to God that He adopted us as sons and heirs, God is now completely propitiated toward us? That by the same propitiation by which our sins were fully expiated and cleansed, we now obtain the right of access into the Temple of God?</p></blockquote>

</figure><figure class="quote" id="q-f635f317d4" data-kw="">
<blockquote><p>Justification goes beyond forgiveness. Not only are we forgiven because of Christ, but God also declares us righteous because of Christ. God requires two things of us: punishment for our sins and perfection in our lives. Our sins must be punished, and our lives must be righteous. But we cannot bear our own punishment (Ps. 49:7-8), and we cannot provide our own righteousness. “None is righteous; no, not one” (Rom. 3:10). Therefore, God, out of His immeasurable love for us, provided His own Son to do both. Christ bears our punishment, and Christ performs our righteousness. And when we receive Christ (John 1:12), all of His punishment and all of His righteousness is counted as ours (Rom. 4:4-6; 5:1, 19; 8:1; 10:4; 2 Cor. 5:21; Phil. 3:8-9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-piper.html">John Piper</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This Momentary Marriage</cite>, p. 46</span></figcaption>

</figure><figure class="quote" id="q-488385444a" data-kw="">
<blockquote><p>Howbeit this exposition of the term justification seems faulty as well as the former: and that two ways: … 2. With them all, it presumes in the matter of justification a needles twofold act, the not-imputation of sin, and the imputation of righteousness, as two distinct things; whereas not to impute sin in consideration of satisfaction made for it, is no other thing than to impute righteousness to the party therein concerned. Since that a man cannot be deemed or doomed guiltless or faultless, but he must of necessity be deemed or doomed just or righteous; there being no medium or middle state between a delinquent or a guilty person and one guiltless or just. He that can prove himself no delinquent, but free from fault, must of necessity be justified, acquitted and assoiled as just. See Dt. 25:1. If nothing but sin can make a man unjust, then surely the utter absence of sin must necessarily make a man just. See Paul’s plea, Acts 25:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-gataker.html">Thomas Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Antidote Against Error Concerning Justification</cite>, … (d. 1654; London: Brome, 1670), pp. 19-20</span></figcaption>

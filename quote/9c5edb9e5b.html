<blockquote><p>Thesis XIV… For because divine essence is infinite, most simple, and eternal, therefore the three hypostases subsisting in it—although they are truly three in number—because these individual hypostases are distinguished by their own incommunicable properties, they are nevertheless not three gods nor are they said to be three gods in the same way that there are three men… But instead, in the divine this happens by an indescribable communication of the whole essence from eternity, in which no point of beginning, middle, or end can be stated.† † dari, i.e., cannot be stated or supplied because it does not exist.</p></blockquote>

<blockquote><p>VI. On the Personality of God. The use has spread among pantheists of denying God’s true and real personality, so that those who defend a personal God are accused by them of anthropomorphism, as if the notion of personality cannot apply to God without anthropomorphizing Him, or constituting Him in the image and likeness of humans. These views are widely disseminated in Hegelian philosophy, as can be seen in Vera’s Introduction à la philosophie de Hegel. Avant-propos, p. 20, and the following (2nd edition). However, to deny the existence of a personal God is tantamount to denying God Himself, nor does asserting the personal nature of God lead to anthropomorphism. Let us prove both assertions.

VII. The Admission of a Personal God. We defined elsewhere a suppositum, which is a perfectly subsistent substance, self-owned and incommunicable to another. From this it follows that since substantiality, by virtue of its subsistence, is the perfection by which substance exceeds accidents, a fortiori, perfect subsistence, by which a substance becomes self-owned and incommunicable to another, exhibits true and real perfection. And because a spiritual nature is the most perfect among beings, a subsisting complete subsistence (which is therefore called a person, as we stated in Ontology loc. cit.), implies something supremely perfect. Or, as St. Thomas says in STh. I, q. 29, a. 3, “Person signifies what is most perfect in all nature — that is, a subsistent individual of a rational nature.” We have indeed proved the truly and really existing First Efficient Cause of all substances, the Most Perfect Being, the Supreme Reason ordering all created things towards their end; therefore, the first Substance truly exists, most perfect in the notion of subsistence, and therefore fully self-owned and incommunicable, supremely intelligent, most notably endowed with the requisites for the notion of personality; and this first substance is called God. Consequently, God is truly a person, with a personality distinct from other things, as proven against pantheists. However, the term “person” is not applied to God in the same way as it is to creatures but in a more excellent manner, just as other names are attributed to God in a more excellent manner than to creatures. Those who wish to deny a personal God should indeed be considered atheists. For without a doubt, they either concede that God is a real substance, perfectly subsistent and intelligent in Himself, and by this admission, they must acknowledge God as personal, as is evident from what has been said, or they deny to God proper perfect substantiality and intelligence, and in this second hypothesis, God becomes something abstract or indeterminate, like every universal, as the adversaries indeed contend. However, what is abstract, as abstract, and what is indeterminate, as indeterminate, etc., exists not in reality outside the mind but in the mind itself, without its proper actions; for they do not act unless through singulars. Therefore, an impersonal God is merely a concept of reason, and thus by word only God is left, while in reality God is removed. Moreover, not only are the assertions about anthropomorphism absurd but also blatantly ridiculous. For they suppose that the notion of personality requires a body, or that real infinity is incompatible with personality; yet they fail to realize that if personality is a perfection derived uniquely from a spiritual nature, then to any subsisting substance, the notion of personality must correspond to the extent to which it is more spiritual, dissociated from and independent of the body, and possesses the most perfect nature. Now, God is in the highest degree of spirituality and infinite perfection. Therefore, He is in the highest degree of personality, so that personality in God not only does not imply anthropomorphism but essentially excludes it.</p></blockquote>

<blockquote><p>Helpful history of key figures and moves.” – Mark Jones . On the Medieval Church Articles Muller, Richard – pt. 1, ch. 1, ‘The Doctrine of the Trinity in the Christian Tradition: the Medieval Backgroun’ ToC in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725, vol. 4, The Triunity of God 2nd ed. (Baker Books, 2003), pp. 17-59 Butner, D. Glenn – ‘For &amp; Against [Theodore] de Regnon: Trinitarianism East &amp; West’ (2015) 13 pp. Abstract: “Modern systematic theologians frequently claim that Eastern trinitarianism begins with the persons while Western trinitarianism begins with the divine essence, and fails to truly differentiate the persons. This article explores the origins of this claim in the writing of Theodore de Régnon [1831-1893], noting recent criticism of his paradigm’s applicability to the patristic era. In response to these criticisms, I argue ﬁrst for the limited validity of the de Régnon paradigm by demonstrating its applicability in the Carolingian–Photian dispute surrounding the ﬁlioque. I then argue against the deployment of the paradigm as a controlling schema in systematic theology by pointing to problems this narrative has created in the theology of Robert Jenson and John Zizioulas.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Helpful history of key figures and moves.” – Mark Jones . On the Medieval Church Articles Muller, Richard – pt. 1, ch. 1, ‘The Doctrine of the Trinity in the Christian Tradition: the Medieval Backgroun’ ToC in Post-Reformation Reformed Dogmatics: the Rise &amp; Development of Reformed Theology, ca. 1520 – ca. 1725, vol. 4, The Triunity of God 2nd ed. (Baker Books, 2003), pp. 17-59 Butner, D. Glenn – ‘For &amp; Against [Theodore] de Regnon: Trinitarianism East &amp; West’ (2015) 13 pp. Abstract: “Modern systematic theologians frequently claim that Eastern trinitarianism begins with the persons while Western trinitarianism begins with the divine essence, and fails to truly differentiate the persons. This article explores the origins of this claim in the writing of Theodore de Régnon [1831-1893], noting recent criticism of his paradigm’s applicability to the patristic era. In response to these criticisms, I argue ﬁrst for the limited validity of the de Régnon paradigm by demonstrating its applicability in the Carolingian–Photian dispute surrounding the ﬁlioque. I then argue against the deployment of the paradigm as a controlling schema in systematic theology by pointing to problems this narrative has created in the theology of Robert Jenson and John Zizioulas.”

<blockquote><p>Engages narrative theology and post-metaphysical thought of the last 75 years by retrieving the exegetical and metaphysical account of Aquinas.” – Mark Jones Wanless, Brandon L. – Universality &amp; the Divine Essence: St. Thomas Aquinas on the Unity Characteristic of the Trinitarian Persons a Masters thesis (University of St. Thomas, 2015) 92 pp. Introduction: “The greatest of the Scholastic doctors understood himself as a conduit of the wisdom he himself received from earlier doctors of the Church. This medieval method of theology—originating in part with such persons as St. John of Damascus in the East and Peter Lombard in the West—amounted to a synthetic engagement of the patristic theologians with the goal of producing a unified and holistic theological account of the faith… …The disagreement itself regards the proper predication of the relation of the three persons of the Trinity to the divine nature, and whether we can speak of the divine essence as a universal, that is, as a relation of three individuals to a species. In other words, are the trinitarian persons three individuals of the one divine species of divinity? Augustine argues in the negative, whereas [John the] Damascene speaks affirmatively…. After addressing the specifics of the relative positions of Augustine and Damascene, and their treatment by Peter Lombard in his Sentences in the following chapter, I will spend the bulk of this paper examining Aquinas’s theology of the Trinity… he uniquely provides a definitive account of the various concepts needed to thoroughly understand the relation of individuals to a species and its applicability to the Godhead… Aquinas proves on multiple levels that, properly speaking, God cannot be said to be a divine species with three subordinate individuals… I will also show how it is that Aquinas recognizes some similarities (and thus allows for Damascene’s position) between the species/individual relationship and that of the divine essence and persons… What follows in this paper is a relatively unique Thomistic analysis of this question, putting to use his trinitarian and metaphysical principles as a way to understand all the critical implications of a relationship of universality between essence and persons in the Godhead.</p></blockquote>

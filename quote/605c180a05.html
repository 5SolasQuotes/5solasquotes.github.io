<main class="wrap"><figure class="quote" id="q-605c180a05" data-kw="">
<blockquote><p>What need is there, then, for adding to God’s book of praise a hymn-book of our own making? And what is gained when the addition is made? Nothing is gained in the way of spirituality, or beauty, or power. Nothing is gained but spiritual loss. Nor is a hymn ever used without loss; for the best hymn that ever was written by man on a Scriptural subject is excelled by a psalm, or perhaps by many psalms on the same subject. For example, the pretty hymn written by the papist Cardinal Newman, beginning

Lead kindly light amid the encircling gloom,

is infinitely inferior to the 5th, and 25th, and 27th, and 36th, and 86th, and 119th, and 143d, and many other psalms on the same subject. Yet this hymn appears in the hymn-books of the Established, the United Presbyterian, and the Free Churches. Every time the papist’s hymn is sung by any of their congregations, it is preferred for the time being and for the purpose in hand to a divine hymn, which is of course as much superior as God’s Word is to man’s. It is nowhere said in Scripture that the entrance of John Henry Newman’s words gives light, yet “cultured” congregations use them in preference to the perfect Word on which the blessing depends, and while they are but pleasing themselves they think they are doing God service and receiving his blessing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-dick.html">James Dick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hymns and hymn-books in Original Covenanter</cite></span></figcaption>

</figure><figure class="quote" id="q-1ed38d6d8a" data-kw="">
<blockquote><p>Of joining with the congregation in hearing the Word, even read as well as preached. See what a reverend respect God’s people shewed even to the Word read, Nehem 8, 3. The ears of all the people were attentive unto the book of the Law; and ver. 5. When Ezra opened the book (to read it) all the people stood up.

Make conscience to join with the congregation in those prayers that are read as well as in those that are conceived. For those that are read are holy, &amp; good prayers, and all the congregation should make their prayers and supplications with one accord, as they did, Act. 1. 14. Hold thy self bound to join with the congregation in singing of Psalms also. See how well God shewed himself to be pleased with this duty, 2 Chron. 20. 22. When they began to sing, and to praise; the Lord set ambushments against the children of Ammon, &amp;c.</p></blockquote>

</figure><figure class="quote" id="q-e7b83c6949" data-kw="">
<blockquote><p>Prayer of any sort is either mental or vocal… The latter goes outside the mind… Song is added to this. “Be full of the Spirit, speaking to one another with Psalms (also through musical instruments, which psallontai are mentioned), hymns (songs of whatever sort), and spiritual songs (constant in singing), singing the Psalms in your heart to the Lord” (Eph. 5:19; Col. 3:16). Some prayer is sudden, while some is premeditated and composed, and those either conceived or prescribed. Some are private, solitary or domestic, others are public, ordinary or extraordinary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-heinrich-heidegger.html">Johann Heinrich Heidegger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Concise Marrow of Theology</cite>, (1697; RHB, 2019), Locus 23, ‘On the Grace of Sanctification’, section 14, p. 166</span></figcaption>

</figure><figure class="quote" id="q-fe91d3a304" data-kw="">
<blockquote><p>Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 278</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Next you say, ‘Why may not the Christian Church compose new Hymnes, as they of Corinth did?’ And this you judge to be the more necessary because that David‘s Psalms have not such full and clear Hymns upon the great mysteries of the Christian belief: And you think the liberty which we plead for in prayer should much persuade it. ‘Tis answered, if you consider that Scripture, 1 Cor. 14, and particularly the 26th verse, you may understand that as the apostle’s business in the place is to set an order to the use of extraordinary gifts, wherein that Church abounded; so, the Psalms, doctrine, tongue, revelation, and interpretation there spoken of, appear to be inspired and afflatitious motions, which will not found you any argument: And you yourself do so plainly observe that these Psalms of the Corinthians were framed by private persons, that I marvel that your remembering of the thing to be extraordinary did not stop your translation of it by way of privilege to the Churches in our days. 2. Seeing the Lord hath provided us with a plentiful variety of Psalms and Hymns; and beside, hath allowed us as full a liberty of praising in prose, as of prayer, I think it doth fully remove all that is here by you objected, and abundantly warrant us both to abide content with God’s institutions, and refuse a superfluous mixture of humane odes with these divine Psalms, which He hath appointed, for the matter of our more solemn praises.”

onformist%2C+%E2%80%A6+%28%5BAmsterdam%5D%2C+1671%29%2C+The+Fifth+Dialogue+Answered.+MacWard+was+the+protege+of+Samuel+Rutherford.+He+does+not+explicitly+cite+Eph.+5%3A19+%26+Col.+3%3A16+below%2C+but+the+allusions+to+those+passages+are+obvious.+He+appears+to+allow+for+singing+Scripture+songs+in+some+respect.%2C+p.+278&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ffe91d3a304.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/fe91d3a304.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=Next%20you%20say%2C%20%E2%80%98Why%20may%20not,matter%20of%20our%20more%20solemn%20praises&amp;text=Next%20you%20say%2C%20%E2%80%98Why%20may%20not%20the%20Christian&amp;text=for%20the%20matter%20of%20our%20more%20solemn%20praises" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-cc7e6c2842" data-kw="">
<blockquote><p>Whatever is in God is essential to Him and to that end the very nature and essence of God. Therefore, God’s righteousness is God’s very essence, whereby He wills and does all things justly according to His law. For in the moral law, God expressed to us His righteousness and nature. Holiness in God embraces the highest of all God’s virtues—wisdom, righteousness, power, mercy, goodness, et cetera. This is what elsewhere is called goodness, as in Psalm 143:10, “Your good Spirit leads me through an upright journey,” and the light of God (1 John 1:5). And this is about these in God, in the ideal Himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, trans. Casey B. Carmichael, Classic Reformed Theology, vol. 5 (1593; Kindle edn, Grand Rapids MI: Reformation Heritage Books, 2021), Kindle Locations 3364-3368.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god.html">Attributes of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d1758a69a1" data-kw="intuitive knowledge">
<blockquote><p>God knows all things by one intuitive act. As there is no succession in his being, so there is no succession in his knowledge. He knows things that are successive, before their existence and succession, by one single act of intuition. By one cast of his eye, all things future are present to him in regard of his eternity and omnipresence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Existence and Attributes of God</cite>, Discourse on the Knowledge of God</span></figcaption>

<blockquote><p>The former will [of command] is called by the [Medieval] Scholastics, on the authority, it is thought, of Hugh of St. Victor, voluntas signi, whether because it is signified by some sign, like a word, precept, interdict, etc.; or because it signifies God’s will as the effect and adjunct of it…</p></blockquote>

</figure><figure class="quote" id="q-64e8d980e2" data-kw="">
<blockquote><p>This thesis presents a case for the traditional doctrine of divine simplicity by construing it along the lines that God exists as actus purus. My formulation of divine simplicity draws upon the medieval insight that God is what He is in virtue of what He does in one, eternal act of will with which He is identical. In chapter I, I survey the contemporary literature on divine simplicity. In chapter II, I critique Alvin Plantinga’s Platonic theory of the divine attributes… In chapter III, I provide rejoinders to all of Plantinga’s defeaters against divine simplicity… In chapter IV, I develop a viable theory of divine simplicity, given an actus purus conception of God, and I formulate a number of arguments supporting it… As such, I seek to demonstrate that the traditional understanding of the divine essence is something that is worthy for theists to embrace and to explore…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allen-stanley-gehring.html">Allen Stanley Gehring</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Simplicity as Actus Purus Ref</cite>, (Texas A &amp; M University, 2005)</span></figcaption>

<blockquote><p>From these [Mt. 23:27; Lk. 13:34; Mk. 7:24; 14:35-36; Mt. 26:39] and other like passages, the Fathers in the Sixth General Council concluded against the heresy of the Monothelites [that Christ has only one will], and established the true doctrine of a twofold will in Christ, not contrary to themselves, but still subordinate the one unto the other, at least in the final issue.</p></blockquote>

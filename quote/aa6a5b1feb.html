<blockquote><p>St. Paul giving a rule how men should sing, first says, “I will sing in voice, and I will sing with understanding.” And in another place, showing what songs should be song, exhorts the Ephesians to “edify one another with psalms, songs of praise, and such as are spiritual, singing in their hearts to the Lord with thanks giving.” As if the Holy Ghost would say, that the song did inflame the heart to call upon God, and praise him with a more fervent and lively zeal. And as music or singing is natural unto us, and therefore every man delights therein; so our merciful God sets before our eyes, how we may rejoice and singe to the glory of his name, recreation of our spirits, and profit of ourselves. But as there is no gift of God so precious or excellent, that Satan has not after a sort drawn to himself and corrupt, so has he most impudently abused this notable gift of singing, chiefly by the Papists his ministers, in disfiguring it, partly by strange language, that cannot edify, and partly by a curious wanton sort, hiring men to tickle the ears and flatter the fantasies, not esteeming it as a gift approved by the Word of God, profitable for the Church, and confirmed by all antiquity. As, besides other places, is most manifest by the words of Pliny, called the younger, who, when he was depute in Asia unto the Emperor Trajan, and had received charge to inquire out the Christians to put them to death, writ among other things, touching the Christians, “That their manners were to sing verses or psalms early in the morning to Christ their God.” If any, perhaps, would doubt, when, or by whom these churches or assemblies were institute, it is likewise evident, that St. John the Apostle, who, although in Domitian’s time he was banished in the Isle Patmos; yet when Nerva his successor, and next before Trajan reigned, returned to Ephesus, and so planted the churches, as the stories report. Seeing therefore God’s Word does approve it, antiquity bears witness thereof, and best reformed Churches have received the same, no man can reprove it, except he will condemn God’s Word, despise antiquity, and utterly condemn the godly reformed Churches. And there are no songs more appropriate than the Psalms of the Prophet David, which the Holy Ghost has framed to the same use, and commended to the Church, as containing the effect of the whole Scriptures, that hereby our hearts might be more lively touched, as appears by Moses, Hezekiah, Judith, Debora, Mary, Zechariah, and others, who by songs and metre, rather than in their common speech and prose, gave thanks to God for such comfort as He sent them. Here it were to long to entreat of the metre; but for as much as the learned doubt not thereof, and it is plainly proven that the Psalms are not only metre, and contain just pauses, but also have grace and majesty in the verse more than any other places of the Scriptures, we need not to enter into any probation. For they that are skillful in the Hebrew tongue, [Read Moses Chabib, in his books called, מרפא לשון דרכי נרעם] by comparing the Psalms with the rest of the Scriptures, easily may perceive the metre. And to whom is it not known, how the Holy Ghost by all means sought to help our memory, when he fashioned many Psalms according to the letters of the alphabet; so that every verse begins with the letters thereof in order. Sometimes ‘A’ begins the half verse, and ‘B’ the other half; and in another place, three verses, yea and eight verses with one letter, even the Psalm throughout; as if all men should be inflamed with the love thereof, both for variety of matter, and also briefness, easiness, and delectation. Now, to make you privy also why we altered the rhyme in certain places of him, whom for the gifts that God had given him, we esteemed and reverenced, this may suffice: that in this enterprise, we did only set God before our eyes, and therefore weighed the words and sense of the Prophet, rather considering the meaning thereof than what any man had write. And chiefly being in this place, whereas most perfect and godly judgment did assure us, and exhortations to the same encourage us, we thought it better to frame the rhyme to the Hebrew sense, than to bind that sense to the English meter: and so either altered for the better, in such places as he had not attained unto, or else where he had escaped part of the verse, or sometimes the whole, we added the same, not as men desirous to find faults, but only as such which covet to hide them, as the learned can judge.</p></blockquote>

<blockquote><p>…we would not only fall down upon our faces and give him thanks, but with loud voices would we praise Him, and in the midst of the congregation would we extol his name, as David and Asaph do almost in every psalm. For doubtless whoso believeth that God loveth him, and feeleth by his faith, that he hath forgiven him all his sins, and careth for him… shall be compelled by the Spirit of God to break out into praise and thanksgiving therefore… but shall cry and call upon them, as David doth, saying: “Praise the Lord with me, and let us magnify his name together. I sought the Lord, and He heard me, yea, He delivered me out of all my fear.”… Yea, would God that our minstrels had none other thing to play upon, neither our carters and ploughmen other thing to whistle upon, save psalms, hymns, and such godly songs as David is occupied withal! And if women, sitting at their rocks [instruments used in spinning], or spinning at the wheels, had none other songs to pass their time withal, than such as Moses’ sister, Glehana’s [Elkanah’s] wife, Debora, and Mary the mother of Christ, have sung before them, they should be better occupied than with ‘hey nony nony, hey troly loly,’ and such like fantasies. If young men also that have the gift of singing, took their pleasure in such wholesome ballads as the [apocryphal] three children sing in the fire, and as Jesus the Son of Sirac doth in his last chapter, it were a token, both that they felt some spark of God’s love in their hearts, and that they also had some love unto Him; for truly, as we love, so sing we… Seeing then that, as the prophet David saith, it is so good and pleasant a thing to praise the Lord, and so expedient for us to be thankful (Ps. 147); therefore, to give our youth of England some occasion to change their foul and corrupt ballads into sweet songs and spiritual hymns of God s honor, and for their own consolation in him, I have here, good reader, set out certain comfortable songs grounded on God’s Word, and taken some out of the holy scripture, specially out of the Psalms of David, all whom would God that our musicians would learn to make their songs! and if they which are disposed to be merry, would in their mirth follow the counsel of St. Paul and St. James (Col. 3; James 5), and not to pass their time in naughty songs of fleshly love and wantonness, but with singing of psalms, and such songs as edify, and corrupt not men’s conversation. … The children of Israel in the old time, when God had delivered them from their enemies, gave thanks unto Him, and made their song of Him, as thou seest by Moses, Barak, David, and other more. Why should not we then make our songs and mirth of God, as well as they? Hath He not done as much for us as for them? Hath He not delivered us from as great troubles as them? Yes, doubtless. Why should He not then be our pastime, as well as theirs? As for such psalms as the scripture describeth (beside the great consolation that they bring into the heart of the spiritual singer) they do not only cause him to spend his time well by exercising himself in the sweet Word of God; but through such ensamples they provoke other men also unto the praise of God and virtuous living. And this is the very right use wherefore psalms should be sung; namely, to comfort a man’s heart in God, to make him thankful, and to exercise him in his Word, to encourage him in the way of godliness, and to provoke other men unto the same. By this thou mayest perceive, what spiritual edifying cometh of godly psalms and songs of God s Word; and what inconvenience foloweth the corrupt ballads of this vain world. …</p></blockquote>

— Miles Coverdale, Ghostly [Spiritual] Psalms and Spiritual Songs (1539), ‘Unto the Christian Reader’ in Remains of Myles Coverdale (Cambridge: Parker Society, 1846), pp. 536-540">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6we+would+not+only+fall+down+upon+our+faces+and+give+him+thanks%2C+but+with+loud+voices+would+we+praise+Him%2C+and+in+the+midst+of+the+congregation+would+we+extol+his+name%2C+as+David+and+Asaph+do+almost+in+every+psalm.+For+doubtless+whoso+believeth+that+God+loveth+him%2C+and+feeleth+by+his+faith%2C+that+he+hath+forgiven+him+all+his+sins%2C+and+careth+for+him%E2%80%A6+shall+be+compelled+by+the+Spirit+of+God+to+break+out+into+praise+and+thanksgiving+therefore%E2%80%A6+but+shall+cry+and+call+upon+them%2C+as+David+doth%2C+saying%3A+%E2%80%9CPraise+the+Lord+with+me%2C+and+let+us+magnify+his+name+together.+I+sought+the+Lord%2C+and+He+heard+me%2C+yea%2C+He+delivered+me+out+of+all+my+fear.%E2%80%9D%E2%80%A6+Yea%2C+would+God+that+our+minstrels+had+none+other+thing+to+play+upon%2C+neither+our+carters+and+ploughmen+other+thing+to+whistle+upon%2C+save+psalms%2C+hymns%2C+and+such+godly+songs+as+David+is+occupied+withal%21+And+if+women%2C+sitting+at+their+rocks+%5Binstruments+used+in+spinning%5D%2C+or+spinning+at+the+wheels%2C+had+none+other+songs+to+pass+their+time+withal%2C+than+such+as+Moses%E2%80%99+sister%2C+Glehana%E2%80%99s+%5BElkanah%E2%80%99s%5D+wife%2C+Debora%2C+and+Mary+the+mother+of+Christ%2C+have+sung+before+them%2C+they+should+be+better+occupied+than+with+%E2%80%98hey+nony+nony%2C+hey+troly+loly%2C%E2%80%99+and+such+like+fantasies.+If+young+men+also+that+have+the+gift+of+singing%2C+took+their+pleasure+in+such+wholesome+ballads+as+the+%5Bapocryphal%5D+three+children+sing+in+the+fire%2C+and+as+Jesus+the+Son+of+Sirac+doth+in+his+last+chapter%2C+it+were+a+token%2C+both+that+they+felt+some+spark+of+God%E2%80%99s+love+in+their+hearts%2C+and+that+they+also+had+some+love+unto+Him%3B+for+truly%2C+as+we+love%2C+so+sing+we%E2%80%A6+Seeing+then+that%2C+as+the+prophet+David+saith%2C+it+is+so+good+and+pleasant+a+thing+to+praise+the+Lord%2C+and+so+expedient+for+us+to+be+thankful+%28Ps.+147%29%3B+therefore%2C+to+give+our+youth+of+England+some+occasion+to+change+their+foul+and+corrupt+ballads+into+sweet+songs+and+spiritual+hymns+of+God+s+honor%2C+and+for+their+own+consolation+in+him%2C+I+have+here%2C+good+reader%2C+set+out+certain+comfortable+songs+grounded+on+God%E2%80%99s+Word%2C+and+taken+some+out+of+the+holy+scripture%2C+specially+out+of+the+Psalms+of+David%2C+all+whom+would+God+that+our+musicians+would+learn+to+make+their+songs%21+and+if+they+which+are+disposed+to+be+merry%2C+would+in+their+mirth+follow+the+counsel+of+St.+Paul+and+St.+James+%28Col.+3%3B+James+5%29%2C+and+not+to+pass+their+time+in+naughty+songs+of+fleshly+love+and+wantonness%2C+but+with+singing+of+psalms%2C+and+such+songs+as+edify%2C+and+corrupt+not+men%E2%80%99s+conversation.+%E2%80%A6+The+children+of+Israel+in+the+old+time%2C+when+God+had+delivered+them+from+their+enemies%2C+gave+thanks+unto+Him%2C+and+made+their+song+of+Him%2C+as+thou+seest+by+Moses%2C+Barak%2C+David%2C+and+other+more.+Why+should+not+we+then+make+our+songs+and+mirth+of+God%2C+as+well+as+they%3F+Hath+He+not+done+as+much+for+us+as+for+them%3F+Hath+He+not+delivered+us+from+as+great+troubles+as+them%3F+Yes%2C+doubtless.+Why+should+He+not+then+be+our+pastime%2C+as+well+as+theirs%3F+As+for+such+psalms+as+the+scripture+describeth+%28beside+the+great+consolation+that+they+bring+into+the+heart+of+the+spiritual+singer%29+they+do+not+only+cause+him+to+spend+his+time+well+by+exercising+himself+in+the+sweet+Word+of+God%3B+but+through+such+ensamples+they+provoke+other+men+also+unto+the+praise+of+God+and+virtuous+living.+And+this+is+the+very+right+use+wherefore+psalms+should+be+sung%3B+namely%2C+to+comfort+a+man%E2%80%99s+heart+in+God%2C+to+make+him+thankful%2C+and+to+exercise+him+in+his+Word%2C+to+encourage+him+in+the+way+of+godliness%2C+and+to+provoke+other+men+unto+the+same.+By+this+thou+mayest+perceive%2C+what+spiritual+edifying+cometh+of+godly+psalms+and+songs+of+God+s+Word%3B+and+what+inconvenience+foloweth+the+corrupt+ballads+of+this+vain+world.+%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Miles+Coverdale%2C+Ghostly+%5BSpiritual%5D+Psalms+and+Spiritual+Songs+%281539%29%2C+%E2%80%98Unto+the+Christian+Reader%E2%80%99+in+Remains+of+Myles+Coverdale+%28Cambridge%3A+Parker+Society%2C+1846%29%2C+pp.+536-540&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F97557a90c5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/97557a90c5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-puritans-on-psalms-hymns-and-spiritual-songs-eph-519-col-316/#:~:text=%E2%80%A6we%20would%20not%20only%20fall%20down,ballads%20of%20this%20vain%20world.%20%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-685145a5ee" data-kw="">
<blockquote><p>Thirdly, he expresseth the matter to be sung in three words, the very titles which are given to David’s Psalms and other scriptural songs: and though there be some difference among interpreters about the kind of songs, which are expressed by every one of those in particular, yet the most received and probable opinion is that by ‘psalms’ are meant all holy songs in general of whatsoever argument, whether they contain prayers, praises, complaints, deprecations, prophecy, history, or a purpose mixed of all those; and by ‘hymns’ are meant special songs of praise to God; and by ‘songs’, a certain kind of hymns, expressing the praises of God for some of his noble acts, great and wonderful beyond others. And those ‘songs’ he calleth ‘spiritual’ (which epithet is to be extended to the psalms and hymns also), as being framed by the Spirit of God, containing spiritual and heavenly purpose, and requiring the assistance of God’s Spirit and a spiritual frame of heart for singing them aright; and this in opposition to the obscene, filthy, and fleshly songs of carnal men and drunkards. … 2. That we may go about this worship of singing praises to God acceptably, it is necessary that we be filled with the Spirit and have a rich and copious measure of his presence and assistance, though not to compose new songs: for he pointeth at scriptural songs, as the most fitting purpose to be sung, under the titles of “psalms, hymns, and spiritual songs;” yet that we may be enabled to choose the fittest songs for the present occasion, and sing them with such a spiritual, elevated frame of heart, as such a divine and heavenly piece of worship requireth; for he saith, “be filled with the Spirit, speaking to yourselves in psalms and hymns and spiritual songs.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians (1656-1674; London, 1841), p. 239 &amp; 365 | On Eph. 5:19</cite>, p. 239</span></figcaption>

<blockquote><p>Mr. Flavel after this, returned to Dartmouth, where with his family and dear people he blessed God for his mercies towards him. He was in a little time after confined close prisoner to his house, where many of his dear flock stole in over night, or betimes on the Lord’s Day in the morning, to enjoy the benefit of his labors, and spend the sabbath in hearing, praying, singing of psalms, and holy discourses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God | Life of Flavel, p. ix</cite>, vol. 1</span></figcaption>

<blockquote><p>I. First then, as to the Praises of God. The Scriptures both of the Old and New Testaments require the use of the Psalms in offering up praises to God. We find in the Old Testament (2 Chron. 29:30) [that] Hezekiah the King and the princes commanded the Levites to sing praises to the Lord with the words of David, and of Asaph, and they sang with gladness. This Command of Hezekiah proceeded from God, and was approved by Him. The same way of praising God continued in the Jewish Church till our Saviour’s time: And after that, we have yet a more positive command for the use of them by the apostle, Eph. 5:19, ‘Speaking to your selves in psalms, and hymns, and spiritual songs.’ And Col. 3:16, ‘Let the words of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs; singing and making melody with grace in your hearts to the Lord.’ I think there is no room to doubt, but by the psalms, etc. in these places, is meant the Book of Psalms, which the Holy Ghost has left for this purpose to the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-king.html">William King</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning the Inventions of men in the Worship of God (Dublin, 1694), Ch. 1, ‘Of Praises’, Section 1, ‘What the Holy Scriptures prescribe concerning them’, pp. 6-7. King (1650-1729) was an Anglican divine in the Church of Ireland and was the archbishop of Dublin.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“I. First then, as to the Praises of God. The Scriptures both of the Old and New Testaments require the use of the Psalms in offering up praises to God. We find in the Old Testament (2 Chron. 29:30) [that] Hezekiah the King and the princes commanded the Levites to sing praises to the Lord with the words of David, and of Asaph, and they sang with gladness. This Command of Hezekiah proceeded from God, and was approved by Him. The same way of praising God continued in the Jewish Church till our Saviour’s time: And after that, we have yet a more positive command for the use of them by the apostle, Eph. 5:19, ‘Speaking to your selves in psalms, and hymns, and spiritual songs.’ And Col. 3:16, ‘Let the words of Christ dwell in you richly in all wisdom, teaching and admonishing one another in psalms, and hymns, and spiritual songs; singing and making melody with grace in your hearts to the Lord.’ I think there is no room to doubt, but by the psalms, etc. in these places, is meant the Book of Psalms, which the Holy Ghost has left for this purpose to the Church.”

— William King, A Discourse concerning the Inventions of men in the Worship of God (Dublin, 1694), Ch. 1, ‘Of Praises’, Section 1, ‘What the Holy Scriptures prescribe concerning them’, pp. 6-7. King (1650-1729) was an Anglican divine in the Church of Ireland and was the archbishop of Dublin.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+First+then%2C+as+to+the+Praises+of+God.+The+Scriptures+both+of+the+Old+and+New+Testaments+require+the+use+of+the+Psalms+in+offering+up+praises+to+God.+We+find+in+the+Old+Testament+%282+Chron.+29%3A30%29+%5Bthat%5D+Hezekiah+the+King+and+the+princes+commanded+the+Levites+to+sing+praises+to+the+Lord+with+the+words+of+David%2C+and+of+Asaph%2C+and+they+sang+with+gladness.+This+Command+of+Hezekiah+proceeded+from+God%2C+and+was+approved+by+Him.+The+same+way+of+praising+God+continued+in+the+Jewish+Church+till+our+Saviour%E2%80%99s+time%3A+And+after+that%2C+we+have+yet+a+more+positive+command+for+the+use+of+them+by+the+apostle%2C+Eph.+5%3A19%2C+%E2%80%98Speaking+to+your+selves+in+psalms%2C+and+hymns%2C+and+spiritual+songs.%E2%80%99+And+Col.+3%3A16%2C+%E2%80%98Let+the+words+of+Christ+dwell+in+you+richly+in+all+wisdom%2C+teaching+and+admonishing+one+another+in+psalms%2C+and+hymns%2C+and+spiritual+songs%3B+singing+and+making+melody+with+grace+in+your+hearts+to+the+Lord.%E2%80%99+I+think+there+is+no+room+to+doubt%2C+but+by+the+psalms%2C+etc.+in+these+places%2C+is+meant+the+Book+of+Psalms%2C+which+the+Holy+Ghost+has+left+for+this+purpose+to+the+Church.%E2%80%9D%0A%0A%E2%80%94+William+King%2C+A+Discourse+concerning+the+Inventions+of+men+in+the+Worship+of+God+%28Dublin%2C+1694%29%2C+Ch.+1%2C+%E2%80%98Of+Praises%E2%80%99%2C+Section+1%2C+%E2%80%98What+the+Holy+Scriptures+prescribe+concerning+them%E2%80%99%2C+pp.+6-7.+King+%281650-1729%29+was+an+Anglican+divine+in+the+Church+of+Ireland+and+was+the+archbishop+of+Dublin.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9e7bfcd23f.html&amp;via=5Solas" target="_blank

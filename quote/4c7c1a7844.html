<main class="wrap"><figure class="quote" id="q-4c7c1a7844" data-kw="">
<blockquote><p>[O]ur Lord Jesus Christ was a true man, and that his disciples had all possible evidence of it, which the history more abundantly shews. He conversed with them familiarly, he eat and drank with them, yea, his conversation in the world was very much condescending, in outward behaviour, to the customs of the world. He eat with Pharisees; when they invited him, he refused not; but he was more bold with publicans and sinners, to converse with them, as being their greatest friend. He was uncivil to none; would deter none through a rigid austere conversation.

And, indeed, to testify the truth of his human nature, he came so low to partake of all human infirmities without sin, and to be subject to extraordinary afflictions and crosses, as to the eyes of the world it did quite extinguish his divine glory, and bury it in misbelief. This which we speak of, as a testimony and evidence that he was man, was the very grand stumbling-block and offence of the Jews and Gentiles; which they made use of as an evidence and certain testimony that he was not God. The evidence of the one seems to give an evidence to the other.

But let us consider this, for it is a sweet and pleasant subject, if our hearts were suitably framed to delight in it, that there was as much evidence to the conviction of all men’s senses, of his divine majesty, as of his human infirmity; and that there are two concurring evidences, which enlighten one another; which we shall shew, partly from his own works and miracles, and partly from the more than miraculous success and progress of the gospel after him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hugh-binning.html">Hugh Binning</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fellowship with God, or Twenty-Eight Sermons on the First and Second Chapters of the First Epistle of John</cite>, (1671) in The Works of Hugh Binning, ed. James Cochrane (3 vols, Edinburgh: William Whyte, 1839), 2: 200-01.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b5b9c684e5" data-kw="">
<blockquote><p>9. Whether any constitutions may be tolerated in the church which in their nature indeed are not impious, but do not, nevertheless, tend to edification? I answer that if those constitutions which the queen’s majesty wishes to impose upon you are free from any impiety, they are rather to be tolerated than that the churches should be deserted. For if the edifying of the church is the chief thing to be regarded in this matter, we shall do the church a greater injury by deserting it than by wearing the habits [garments]. And where there is no impiety, and the conscience is not wounded, it is proper to submit, even if some degree of bondage be imposed. In the meantime, however, it might be demanded on the other hand, whether the imposition of the habits, as far as it tends to decency and order, may justly come under the denomination of bondage? … 11, 12. The last two questions come more closely to the point. Whether it is more expedient thus to obey the church, or on account of disobedience to be cast out of the ministry? And, whether good pastors may lawfully be removed from the ministry on account of their non-compliance with such ceremonies? I answer, if in these ceremonies there is no superstition, no impiety, but yet they are imposed upon godly pastors, who would rather that they should not be imposed upon them, I will certainly allow, and that most fully, that a burden and bondage is imposed upon them; but I will not allow, and this for most just reasons, that their station or ministry is on that account to be deserted and place given to wolves, as was before observed, or to ministers less qualified than themselves: especially, since there remains the liberty of preaching, and care may be taken that no greater bondage shall be imposed; with many other things of this kind, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Zurich Letters</cite>, … ed. Hastings Robinson for the Parker Society, 2nd ed. (Cambridge Univ. Press, 1846), Letter 104, Bullinger to L. Humphrey &amp; T. Sampson (1566), pp. 222-23</span></figcaption>

</figure><figure class="quote" id="q-8c419ca35a" data-kw="">
<blockquote><p>In our days we see that because there hath been much crying out against holy days, some also will not stick to cry out against the Sabbath. Well, if a papist in all other general points of doctrine should be truly converted unto Christ, and for want of instruction doubteth of the Sabbath, we are in love to deal with him, and for a season to support his weakness. How be it we must remember that the weak must not always be born with, as appeareth by the Apostle’s words chap 15:2. Let every man please his neighbour in that, that is good to edification.

So long then as the error is of weakness, and that it is but an infirmity in the man, from which by the knowledge of the truth he would be rid and be delivered, he must be born with. But if it proceed of illusion, obstinacy, and of a prefract [sic] judgment as deceived by the devil, then he must not be borne with, no not even now a days: nay, if we be herein faulty, the error is not so tolerable in us, as it was in them, in that they wanted the old and New Testament, both which are so abundantly opened unto us. But if one truly repenting him of his sins, and faithfully believing in Christ, shall through ignorance be afraid of the Sabbath, as of a servile ceremony, he is so far to be borne with, as he desireth to come to the truth, and if he come once to be obstinate, he is no longer to be borne with.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two</cite></span></figcaption>

<blockquote><p>2. As to the question on which you wish my opinion, whether it is lawful to fast on the seventh day of the week, I answer, that if it were wholly unlawful, neither Moses nor Elijah, nor our Lord Himself, would have fasted for forty successive days. But by the same argument it is proved that even on the Lord’s day fasting is not unlawful.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Nicene &amp; Post-Nicene Fathers, First Series</cite>, vol. 1, ed. Schaff (Buffalo, NY: Christian Literature Publishing Co., 1887), Letters of St. Augustine of Hippo, 2nd Division, Letter 36, ch. 1</span></figcaption>

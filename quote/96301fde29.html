<main class="wrap"><figure class="quote" id="q-96301fde29" data-kw="">
<blockquote><p>But there is one principle [George] Gillespie’s fore-analyzed rule did not allow him to adequately address.¹ [John] Sprint affirmed the principle of, regarding things not inherently wrong, avoiding the greater hurt and scandal, which is a form of the fundamental natural law of avoiding evil and doing the greatest good attainable. ¹ Gillespie acknowledges “in evils of punishment, we may choose a lesser” (Dispute, pt. 2, ch. 1, p. 10); cf. 2 Sam. 24:10–14. Yet the ethical issues of the permissibility of choosing material evils in justified circumstances go far deeper and wider than being limited to punishments. See Fentiman, ‘Theses on the Ethics of Civil Voting, with a Correction to the Booklet, Christ Centered Voting’ throughout at ‘On Voting’ (RBO) and ‘An Extended Introduction’ at ‘On the Ethics of Material Cooperation with, &amp; Associations with Evil’ (RBO). If God may graciously choose for us the lesser miserable evil, may not we concur (2 Chron. 12:5–8), when He reasons with us to do so (Jer. 27:12–13)?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), pp. 54-55</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fa1d17a117" data-kw="">
<blockquote><p>Let us then bring our hearts to holy resolutions, and set ourselves upon that which is good, and against that which is evil in ourselves or others, according to our callings, upon this encouragement, that Christ’s grace and power shall go along with us. What had become of that great work of reformation of religion in the latter-spring of the gospel, if men had not been armed with invincible courage… that the cause was Christ’s, and that He would not be wanting to his own cause. Luther igenuously confessed that he carried matters often inconsiderately, and with mixture of passion. But upon acknowledgement, God took not advantage of his errors, but the cause being God’s, and his aims being holy, to promote the truth, and being a man mighty in prayer, and strong in faith, God by him kindled that fire which all the world shall never be able to quench.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Bruised Reed, in Works</cite>, … (1620; Philadelphia; Presbyterian Board of Publication, n.d.), ch. 28, p. 203</span></figcaption>

</figure><figure class="quote" id="q-9f643623cd" data-kw="">
<blockquote><p>Not just Paul, but the apostles and elders at the synod in Jerusalem, bindingly (Acts 15:28; 16:4) laid some of these beggarly, burdensome ceremonies on the whole regional Church (Acts 15:23, 41; 16:4), as “it seemed good to the Holy Ghost” (Acts 15:28), yet not for the formal reason of service to that law of bondage. Rather, the circumstances made it necessary (Acts 15:28), to prevent the greater scandal of erring (Jewish) unbelievers and weak Christians (who expected the observance of such carnal and false, material ordinances), and for the spread of the Gospel amongst them. In the case of Paul, he had his reasons for keeping the ceremonies in each instance, though they are not always told to us or onlookers. But each time his necessity (Acts 16:1–5; 18:21) was less than ministerial deprivation. Sometimes it was simply to prevent unnecessary conflict.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 30</span></figcaption>

</figure><figure class="quote" id="q-b00b9b705f" data-kw="">
<blockquote><p>5th Rule: To do any good action, or lawful, or indifferent, when I probably foresee a scandal will follow, is an active scandal, for I prefer my own will to my brother’s salvation (says Antoninus, and Navarret), and therefore says Antoninus: ‘A virgin going abroad, without just necessity, where her beauty shall be a snare to young men, or to go out upon a necessary cause with a whorish attire, is an active scandal,’ her feet ‘abideth not in her house,’ says Solomon (Prov. 7). And Navarre says, ‘It is to sin mortally’ and Silvester says: ‘If the Pope’s commandment do but smell of venial [light] sin, and if by giving audience thereunto it be presumed that the state of the Church shall be troubled, or a scandal shall arise, though the commandment go out under the pain of excommunication, it is not to be obeyed.’ Vasques and Suarez say to sell, gift or dispose of any things indifferent, when we foresee they shall abuse them, is to commit the sin of active scandalizing. Yea, the form of an idol, though he never adore it, does highly scandalize, and Antoninus, Silvester, Corduba, Metina [and] the Jesuit Zanches teach that to contribute to that which we see shall induce any to sin, is to be guilty of scandalizing. And the reasons be these:

1. We are not to prefer our will to the salvation of our brother.

2. Things less necessary than our brother’s salvation, in that case, become not necessary, and so fruitless and idl.

3. Charity infers that we hinder, so far as we can, the ruin of our brother’s soul; scandal is spiritual homicide.

4. To contribute any moral help and influence to our brother’s fall and soul-ruin, is to be accessary to his sin. Hence ceremonies and things not necessary to salvation may be omitted altogether in their specialities when the practicing of them does scandalize, and so though kneeling in God’s worship cannot well be universally omitted, yet kneeling appropriate to such an act of worship may be omitted, and ought to be omitted if it scandalize; and ceremonies which scandalize universally, seeing they are not in their very kind necessary to salvation, are to be abolished. Yet I may add one caution here. To contribute help for the doing of that which of itself is necessary, which I know another, in respect of human frailty, will abuse to sin is no active scandal. So to lay hands on a qualified pastor is not sin, though I foresee through human frailty [that] he will abuse his power in some things to sin. So for an artificer to make swords, though he know some shall abuse them to murdering the innocent, is no scandalous work. I take not on me to prescribe rules for eschewing scandal in all occurrences of providence. The godly-learned can see more than I can do in this matter, where love should be wary to lay a straw in the way of any weak traveler.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, pp. 13-14 of Question 2 in An Introduction to the Doctrine of Scandal in The Divine Right of Church Government (1646)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/nature-and-purpose.html">Nature and Purpose</a></span></div>

<blockquote><p>Now for the last thing which makes things indifferent with us scandalous: we are not left without witness from the Scriptures in such cases. But that ceremonies, known to be scandalous, were notwithstanding used: for, it is manifest concerning the Jewish ceremonies that they were scandalous in the usage to the gentiles and in the omitting to the Jews, Acts 21:21-22, 27-28; Gal. 2:3, 9, 12. But that this point of scandal may be distinctly understood, diverse rules are to be considered of: First, that the angering or bare displeasing of other men is not the offense or scandal condemned in Scripture, as not only the words in the original show, but all sound divines grant. A scandal is a stumbling block that occasions a man to fall from grace in the profession of it, into sin or error. Secondly, that to give offense, by doing anything which is simply evil in itself (as David did by his adultery and murder), this is out of all question abominable. Thirdly, that the offense of aliens is to be regarded, that is, we must not do anything by which men that are not yet converted may be hardened from the liking of religion: and so, offense must not be given either to the Jews or to the Grecian, 1 Cor. 10:31. Fourthly, that when the authority of the magistrate or Church has determined concerning the use of things indifferent, we are not now left free, nor are bound to look at the scandal of particular persons; but must make conscience of it, that we offend not the Church, by working a greater hurt or loss to the Church than the particular hurt of private persons can extend unto. In such cases as this, the apostle’s rule holds: ‘If any man seem to be contentious, we have no such custom, nor the Church of God,’ 1 Cor. 11:16. And we are bound, in this text of the apostle Peter [1 Pet. 2:13] to obey the human ordinances of men in authority, from which obligation other men’s offense cannot free us. And the apostle charges us to look to it that we offend not the Church in prescribed ordinances, and that we be careful not to offend private men in free ceremonies. Fiftly, that where ceremonies are left free and indifferent and have no commandement to restrain their use or enjoin it, there are men to redeem the offense of their brethren with no other price than the loss of liberty in things indifferent. The apostle Paul says rather than [that] he will offend his brother, he will never eat flesh while he lives, 1 Cor. 10:8, 13. He does not say he will never preach the Gospel while he lives, or never receive the sacraments while he lives: a necessity lay upon him to preach the Gospel, and to yield to the use of all lawful things to get his liberty, whosoever be offended. Sixtly, that where the person that takes offense is wilfully ignorant and by all means avoids instruction and will not have the patience to be taught, such offense is not to be regarded. Thus our Savior Christ teaches confidently his doctrine of eating his flesh, though the Capernaites were offended: and some of his disciples turned apostates about it, being such persons as would not abide the exposition of his meaning, Jn. 6:52. Seventhly, the like is to be said of such persons as take offense out of envy or malice, as the man in the parable that envied Christ’s bounty (Mt. 20:15), or the Pharisees, that out of malice were offended at Christ, Mt. 15:14; 1 Pet. 2:8. Eighthly, that in things that have proved scandalous, yet we are not bound to lose our liberty till the weak brother declare his offense. Meat sacrificed to idols was offensive to many in all countries, yet the apostle’s rule is, ‘Eat and make no question unless one say, ‘This is meat sacrificed to idols,” 1 Cor. 10:25, 28.</p></blockquote>

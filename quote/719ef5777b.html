<blockquote><p>…The case is not here as in earthly cities: a man who is a free citizen in one burrough is not for that a free citizen of all the burroughs and cities on earth; nor is he who is civilly excommunicated and cast out of his city privileges in one city, cast out of his city privileges in all other cities whereof he is a free member: and the reason is, there is not one common owner and Lord of all the cities on earth, who can give or take away, in a law-way, city privileges; But the case is far otherwise in the privileges of visible Churches, for he who is a member of one visible congregation is by his baptism and sincere profession, and his professed standing in Covenant with God, a member of all visible congregations on earth, as he is baptized in all congregations on earth; and if he be excommunicated out of a single congregation, he is excommunicated out of all, and loses right to the seal of the Lord’s Supper in all visible congregations, as his sins are bound in Heaven to all also, for that one common Head and Savior, who gives him right to the seals of Christ’s body and blood in one, gives him right to these seals in all. For we worthily communicate with Christ in his body and blood, not as his body was broken and his blood shed for one single visible congregation, but as broken and shed for the whole Church-universal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (1644), pt. 2, ch. 4, section 5, pp. 194-5</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c2e86419c9" data-kw="">
<blockquote><p>…his [John Robinson’s] answer is that no parish assemblies [under patrons and bishops] have power of right to choose their ministers. Whereas on the contrary it is most evident that every congregation of Christians has right unto this thing from Christ Himself so inseparably annexed unto it that no external oppression by others or abuse of their own can possibly deprive them of this right, so long as they remain a Christian assembly or congregation. Suppose they be in external bondage, and that in some sense spiritual, yet no matter of fact can take away right, while they abide such as Christ has given that right unto. The whole case may be cleared in this example: two single persons agree on mariage betwixt themselves, with allowance of parents, and have by virtue of that contract mutual right one in other; yet the laws of the place where they live, having ordered that none shall be held for married persons without certain forms which they appoint, they have not external legal power or liberty one in the other before such rites be performed. Even so stands the matter betwixt minister and people in England, they agreeing or contracting betwixt themselves have right one in other: but external legal power or liberty they must receive from others. Another example also I would have considered: the emperor sometime was so subiect unto the pope that he had not liberty of emperial rule until he received his crown from Rome: yet was the emperor then no proper part of the papacy, nor did he take his right from the pope, neither did those that submitted unto him therein communicate with the pope’s authority. So is this in hand.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Manuduction for Mr</cite>, [John] Robinson. Or a confirmation of the former in an answer to his manumission (Amsterdam, 1615), pp. 12-13</span></figcaption>

<blockquote><p>III. (2) We must distinguish between simple precepts (i.e., merely moral) belonging to natural right and mixed precepts (moral and ceremonial, partly of natural and partly of positive right; as the fourth commandment concerning the Sabbath, which is moral as to the genus of public worship, but ceremonial as to the circumstance of the defined time; and the fifth, which is moral as to the prescribed duty and the promise of longevity, but ceremonial as to the appended promise of the land of Canaan).</p></blockquote>

</figure><figure class="quote" id="q-3eb9fdb2ac" data-kw="">
<blockquote><p>Whether by ‘the sinful evil of those corruptions, in the public worship and government of this Church,’ you [Independent divines at Westminster] understand… the Book of Common Prayer, the entrance into our ministry by ordination of bishops and living under the episcopal government?… Now if you mean… [this], that which usually was called, Old conformity, in opposition to the New [under Archbishop Laud]: So I deny that all do now generally acknowledge and decry that as sinfully evil; which appears thus: Because that remonstrance presented to the House of Commons in the beginning of the Parliament, subscribed by many hundred godly ministers, conformists, and non-conformists for reformation in worship, doctrine, government and discipline: The government, worship and ceremonies were impleaded, in respect of many inconveniences and evil consequents; but petitioning against them as sinfully evil and absolutely unlawful was declined: And there are many parliament men and ministers who have a great zeal to the present reformation in casting out the hierarchy and ceremonies, who are not yet convinced that all their former practice in the way of old conformity was sinful: But as those times were, do judge they did lawfully continue their standing in their places and in this Church: much less are they satisfied that either Episcopal government, or the Liturgy were sufficient grounds of forsaking our public assemblies and erecting new. Amongst a cloud of learned and godly men, take the testimony of Gerson Bucerus in his learned answer to Doctor Downame (Dissert. de Guber. Eccl., p. 620), who for the point of Episcopacy allows not of schism in the Church, but vindicates himself and others who keep within the bounds of his opinion from being guilty in that kind. Which answer… is not here given by me in the least to plead for the hierarchy, ceremonies or present Liturgy (for I heartily desire their removal), but only to show the Apologists’ mistake in asserting that all do now so generally acknowledge and decry them as sinfully evil… We [be] as much abhorring bowing to altars, publishing the Declaration for Sports, etc. as you: and witnessing more frequently against them in our ministry than some of you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Antapologia, or a Full Answer to the Apologetical Narration of Mr. Goodwin, Mr. Nye, Mr. Sympson, Mr. Burroughs, Mr. Bridge</cite>, (London: G.M., 1644), pp. 15-16</span></figcaption>

hers+who+keep+within+the+bounds+of+his+opinion+from+being+guilty+in+that+kind.+Which+answer%E2%80%A6+is+not+here+given+by+me+in+the+least+to+plead+for+the+hierarchy%2C+ceremonies+or+present+Liturgy+%28for+I+heartily+desire+their+removal%29%2C+but+only+to+show+the+Apologists%E2%80%99+mistake+in+asserting+that+all+do+now+so+generally+acknowledge+and+decry+them+as+sinfully+evil%E2%80%A6+We+%5Bbe%5D+as+much+abhorring+bowing+to+altars%2C+publishing+the+Declaration+for+Sports%2C+etc.+as+you%3A+and+witnessing+more+frequently+against+them+in+our+ministry+than+some+of+you.%E2%80%9D%0A%0A%E2%80%94+Thomas+Edwards%2C+Antapologia%2C+or+a+Full+Answer+to+the+Apologetical+Narration+%28London%3A+G.M.%2C+1644%29%2C+pp.+15-16&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3eb9fdb2ac.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3eb9fdb2ac.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/church-government/prelacy#:~:text=Whether%20by%20%E2%80%98the%20sinful%20evil%20of,our%20ministry%20than%20some%20of%20you&amp;text=Whether%20by%20%E2%80%98the%20sinful%20evil%20of%20those%20corruptions&amp;text=them%20in%20our%20ministry%20than%20some%20of%20you" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Objection: But we are bound by the canons of the Church which are still in force. Answer: 1. Scripture is the Church’s sufficient rule, and the perfect Law of God. 2. Those things that Scripture has left to occasional determination, no councils must make standing laws for to bind at all times. For if such laws had been fit, God would have made them. 3. It is the present guides of the Church that are upon the place, and see the occasions, that must determine such circumstantials as are of mutable determination. And former Church-governors can no more take away the power of the present, than they can deprive them of their office; it being essential to the office of every pastor to be a guide or ruler of his flock. 4. If you think that all Church canons (yea though it be General Councils) bind, then you are bound to contradictories: for one Council has oft crossed another. And Papists themselves disclaim many things enjoined by canons. The 16th canon of the 4th Council of Carthage requires ministers not to read the books of heathens: Does this bind now? Many the like might be mentioned.</p></blockquote>

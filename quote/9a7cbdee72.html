<main class="wrap"><figure class="quote" id="q-9a7cbdee72" data-kw="">
<blockquote><p>We are unwilling to dispute about words; but we do not admit the term Fate, both because it is of the class which Paul teaches us to shun, as profane novelties (1 Tim. 6:20), and also because it is attempted, by means of an odious term, to fix a stigma on the truth of God. But the dogma itself is falsely and maliciously imputed to us. For we do not with the Stoics imagine a necessity consisting of a perpetual chain of causes, and a kind of involved series contained in nature, but we hold that God is the disposer and ruler of all things,--that from the remotest eternity, according to his own wisdom, he decreed what he was to do, and now by his power executes what he decreed. Hence we maintain, that by his providence, not heaven and earth and inanimate creatures only, but also the counsels and wills of men are so governed as to move exactly in the course which he has destined.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 1.16.8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4abeab1df8" data-kw="liberty decree free">
<blockquote><p>The eternity of God’s decrees does not take away his liberty in decreeing. Although no moment can be assigned in which God was actually indifferent to decreeing this or that thing, still it is certain that the nature of God was in itself indifferent to decreeing this or that thing. For there was no necessary connection between God and creatures as exists between the Father and the Son (whom he could not but beget). On the other hand, he might (if he had willed) have abstained from any production of things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 4.2.13</span></figcaption>

</figure><figure class="quote" id="q-971ab9da52" data-kw="">
<blockquote><p>Although, in relation to the foreknowledge and decree of God, the first Cause, all things come to pass immutably, and infallibly; yet, by the same providence, he ordereth them to fall out, according to the nature of second causes, either necessarily, freely, or contingently.</p></blockquote>

</figure><figure class="quote" id="q-89fd3b7e62" data-kw="">
<blockquote><p>Why do we say that he permits, but just because he wills? Nor, indeed, is there any probability in the thing itself--viz. that man brought death upon himself merely by the permission, and not by the ordination of God; as if God had not determined what he wished the condition of the chief of his creatures to be. I will not hesitate, therefore, simply to confess with Augustine that the will of God is necessity, and that every thing is necessary which he has willed; just as those things will certainly happen which he has foreseen (August. de Gen. ad Lit., Lib. 6, cap. 15).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.23.8</span></figcaption>

</figure><figure class="quote" id="q-0566894940" data-kw="">
<blockquote><p>God, from all eternity, did, by the most wise and holy counsel of his own will, freely, and unchangeably ordain whatsoever comes to pass: yet so, as thereby neither is God the author of sin, nor is violence offered to the will of the creatures; nor is the liberty or contingency of second causes taken away, but rather established.</p></blockquote>

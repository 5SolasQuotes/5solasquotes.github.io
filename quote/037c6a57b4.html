<main class="wrap"><figure class="quote" id="q-037c6a57b4" data-kw="">
<blockquote><p>Many martyrs faithfully perform congregational duties, yet does not Christ make good this promise [to build them on the Rock, Mt. 16], for when members are dissolved by banishment, they are thrown off the rock [Hooker had defined a local congregationalist church as those built on the Rock]. That which by our Savior is set down, as contrary to their comfortable union with and building upon Christ their rock, is being foiled [by governments banishing faithful local church members out of the local church] with the temptations of Satan and Hell, and being thrown off the rock [on the congregationalists’ definition], like the hypocrite, Mt. 7, who is the house built on the sand… and so by this interpretation the Lord’s dissolving of a church, which often is a work of mercy, and putting of his children to an honorable condition of martyrdom, and glorifying of God by suffering and scattering of his Church, as Acts 8:12, must be a throwing them off the rock Christ and a prevailing of the ports of Hell against them: contrary to the scope and intent of Christ in the text.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658) Rutherford in these passages is arguing against Congregationalism., Bk. 2; ch. 6, p. 348</span></figcaption>

<blockquote><p>2. …For the power of the keys is not given to the catholic presbytery as to the first subject, to be a mean of edification in an ordinary and constant way; but only in an extraordinary and occasional way, in those things which concern the power of jurisdiction belonging to the whole catholic Church. By ‘extraordinary’ here, I mean not that which is against a particular law of God, and cannot be done without a divine dispensation of providence, but by ‘extraordinary’ I mean that which is raro contingens, and does not oft fall out; as almost it never falls out that the universal Church has need to excommunicate a national Church, for all and every one of a national Church do never fall away from the faith. Yet a remote power for excommunication is in the catholic visible Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), pt. 1, p. 299</span></figcaption>

</figure><figure class="quote" id="q-d5c862daf2" data-kw="">
<blockquote><p>10. If after this public admonition the sinner shall obstinately refuse to manifest repentance, or to reform; it is the duty of the ministers to make a personal application to him of those threatenings which Christ has denounced in Scripture against such as he is; and especially to declare in the name of Christ, that he is one whose communion the church is bound to avoid; and to require him to forbear usurping that communion, and to charge the chuch in Christ’s name to avoid all familiarity with him, not only in God’s worship, but in common conversation, further than natural and civil relations bind us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | The Propositions agreed on by the Associated Ministers of the County of Worcester and some Adjacent Parts, n.p.</span></figcaption>

ed Books Online</a></div>
</figure><figure class="quote" id="q-de92034391" data-kw="">
<blockquote><p>…for an excommunicate[d] person may remain externally without the Covenant to the visible Church, when baptism remains a seal, and may be a seal of a grace or privilege, which is interrupted or removed in act, but remains in habit: as to be the eldest son of a king may be a seal of the son’s heirship, and yet he may for a fault be disherited and cast out of his place. The Church and Church-membership are relata secundum esse [related according to being], not secundum dici [according to speaking] only, or relata [Greek]: but baptism and Church-membership are not so perfect relatives, but baptism does remain and the Church-membership may be dissolved: as the burgess ticket whereby a man has right to all the city privileges may remain, when the man for some crime committed against the city has lost all his city privileges and is not now a free citizen, in which case his burgess ticket seals nothing to him: So baptism seals not actual membership in case of excommunication, yet remains baptism valid in the acts of sealing other things [such as the invisible promises of God to the elect and regenerate, the forgiveness of sins, etc.].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 4, section 5, p. 220</span></figcaption>

<blockquote><p>5. All our divines, standing for the certainty of the perseverance of the regenerated, answer Papists and Arminians alleging for the apostasy of the saints, the example of the regenerated who may be excommunicated, that excommunication does never evince [prove] that the person excommunicated is out of the state of grace, but only that he has fallen into a scandalous external fact, which deserves that he should be delivered to Satan; and that one may be a member [in some way] of the visible Church and converted to God, who is excommunicated.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), p. 278</span></figcaption>

<main class="wrap"><figure class="quote" id="q-4978fea938" data-kw="">
<blockquote><p>All times are naturally equal, as being distinguished by the same constant and uniform motion of the heavens: yet notwithstanding, when God shall, by any notable and extraordinary work of his, honour and sanctify some certain days, as he did the Jewish sabbath with respect to the creation, and our Lord’s day, by raising up Christ from the dead; as they are, by this wonderful work of his, severed from the rank of common times;–so are we, ever when we come unto them, not to pass them over without the memory of that work which had so advanced them: otherwise to solemnize a day, without reference unto the cause of its solemnization, is but a blind observance. And for this cause, when God commands reverence to places, and sanctification of days, he annexeth the ground of both, and leads us to a sight of those works, from which they receive both their dignity and institution.

So likewise in Sacraments, to eat bread and drink wine are naked, common, simple actions, and in themselves always alike: but when Christ shall, by that great work of his death, set them apart unto a holy use, and make them representations of his own sacred body, as they are by this divine relation hallowed, so to partake of them, without commemorating that great work which hath so sanctified them, is not only impious, in that it perverteth the divine institution, but absurd likewise; it being all one, as if a man should, with much ceremony and solemnity, receive parchment and wax, never so much as thinking on the land it conveys; or look on a picture, without any reflection on the pattern and original which it resembleth, – which is indeed to look on the wood, and not on the picture; it being naturally impossible to separate things in notion, whose being do consist in relation to each other.

So then, the Sacrament being a typical service, is not, nor can be, celebrated without a remembrance of the substance which it resembleth: which thing, according as the preciousness, value, and importance of it doth proportionably impose on us a greater necessity of this duty; which is then rightly performed, when there is a deep impression of Christ crucified made on the soul, by these seals of his death; than which there is not any thing in the world more fit to fasten a stamp of itself in the minds of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-reynolds.html">Edward Reynolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Meditations on the Holy Sacrament of the Lord’s Last Supper</cite>, (1638) in The Whole Works of the Right Rev. Edward Reynolds, D.D., ed. Alexander Chalmers (6 vols, London, 1826), 3: 88-89.</span></figcaption>

<blockquote><p>Question 6. Whether any singular and individual action be indifferent? 10th Answer. First, there be some actions which though they be actions of a man, yet they are not human actions; such are those which proceed from imagination only, and not from deliberate reason, as the rubbings of men’s hands, to scratch the head or beard, to take up a straw, etc. while we are thinking of something else: these actions are not morally good or evil, they want that which is required to make them so, namely counsel and deliberation. For although a man may sin by those actions, as if in time of prayer he suffer his imagination to wander, and do give way to such toyings as those. Yet these actions considered in themselves are neither good nor evil. It is true these motions are subject to the command of man’s will, but yet they are so subject that they may be exercised without any precedent act of reason: Neither are we bound any further by reason to prevent them; but only so far that they hinder not the duties we are about. So for moving of the eyelids, reason and the will have power to moderate them, but it is not worth the while to take notice how often we wink, if so be we take heed that in such things nothing be done which is indecent, or against our duty.

11. Secondly, every action which proceeds from deliberate reason and is properly called human, considered singularly and in the individual, as it is an exercised action, is either good or evil. For such a kind of action is either ordered to a good end, or it is not; If it be, then it has the nature of a good action, if other circumstances be correspondent; if it be not ordered to a good end, it is an evil action because it wants the perfection which ought to be in it, and is not according to its rule.

12. Yet is not required to the goodness of natural action that it be always actually and explicitly referred to the due end, so that this [at least] be done implicity and virtually; because reason in that exercise of such kind of actions, may often with more profit be conversant about those objects.

13. Thirdly, some one or two circumstances of an human action may be indifferent, as if one scholar be speaking with another, it is sometimes indifferent whether they use the Latin tongue, or any other. But their talk taken with all the circumstances is necessarily either good or bad: the reason is, because the determination of an action does not depend upon one circumstance apart, but upon all jointly together.

14. Fourthly, there may be some singular action in which there is no goodness-special to be found, which may not be found in another, and so, that at this time we do this or that, rather than another thing, therein is ofttimes neither good nor evil. Opportunity, or the suggestion of our minds, without any respect of moral goodness, may be of weight sufficient to make the determination.

15. Fifthly, although therefore there be no singular actions-human, that is neither good, nor evil; yet there are diverse, which singularly and in comparison of others, are neither necessary nor unlawful. For as the carver oftentimes has no certain reason why he rather makes this image than that: yet if he make any, it is necessary that he either follow the rules of his art and make a good one, or fail and so make a bad one. So it is in many singular actions of men, which in respect of the exercise, have no proper reason beside the inclination of the mind, but in the doing they are either good or bad.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience with the Power &amp; Cases Thereof</cite>, pp. 89-91 of bk. 3, ch. 18, ‘Of Things Indifferent’ in Conscience with the Power &amp; Cases Thereof ([Leiden &amp; London] 1639)</span></figcaption>

<blockquote><p>We respond: it is further asked whether it be of a Scriptural or ecclesiastical use, or an ancient or new use.” 5 conclusions are given. 2nd Problem, ‘Whether the Old Testament Church from Moses to Ezra began to use and maintained liturgies?’, p. 361 3rd Problem, ‘Whether a liturgy from Ezra and the men of the great Synagogue (that consistory or Sanheidren, as it is termed in the Hebrew, beit deenu) was established, having been prescribed to the people of God, and was publicly used till Christ?’, p. 363 3 conclusions are given on p. 364. 4th Problem, ‘Whether forms &amp; litugies were established in the apostolic Church from the apostles to that Church, such that they have been prescribed to all succeeding churches?’, p. 364 3 conclusions. 5th Problem, ‘Whether a universal liturgy ought to be formed and written, and imposed on all the Churches throughout the whole globe?’, p. 365 3 reasons are given. 6th Problem, ‘Whether one provincial or national liturgy ought to be established, and introduced into all of its consociating churches?’, p. 367 4 conclusions. 7th Problem, ‘Whether liturgies in the national language, whatever is commonly used to write, ought to be taken up in the churches?’, p. 368 8th Problem, ‘Whether a liturgy in Churches already settled, from their first gathering or its introduction at the Reformation, may be changed?, p. 369 1 conclusion. 9th Problem, ‘What is the Gregorian or Roman service (named after Gregory VII) and what is the Mozarabic, or Gothic, and in what place were they used, or are used in the Roman Church?’, p. 370 [No 10th Problem] 11th Problem, ‘How far it is better for a populace having been accustomed to the Roman liturgies and rites from the Papacy to the Reformation, to carry them over, if they had been so engaged initially by the reformers, having purged and yet retained the Missal, Breviary and other liturgical books and rites?’, pp. 372-4 ch. 3, ‘Of Rituals or Ecclesiastical Ceremonies’, pp. 374-384 This chapter is on the general introductory principles of the nature and properties of ceremonies, including (1) their name, (2) their nature and definition, (3) division and (4) opposites. Under (1) Voet also briefly discusses adiaphora on p. 375. Under (2) Voet gives numerous principles and distinctions as to worship (and its kinds) in general (p. 375) before delineating distinctions about ceremonies in general (p. 376). p. 375, Voet distinguishes the following distinctions about worship: It is either natural or instituted. Natural is internal; instituted may be both internal and external. External is either alone or social, or private or public. Public worship is performed by the Church. p. 376, Ceremonies are either divine or human. Divine ceremonies have been immediately instituted by God; therefore their observance is necessary. Divine ceremonies are either political or ecclesiastical. Political are either general and perpetual, observance of natural decorum, or particular, as ceremonies of the judicial law of Moses. Ecclesiastical are sacred, mystical and religious, either of the Old Testament (before or after Moses) or of the New Testament. A human ceremony “which is observed in the practice of men, is called free. It is either civil or ecclesiastical. Civil is some external formality or a mode to be done between men, practiced by law or custom. These things are twofold: Either by a natural reason or necessity supporting, and therefore contributing to the essence or well being of something, such as a natural decorum or many aspects in the instruction of civil manners; or they are received by men as merely arbitrary and instituted. And such free ceremonies are either well-grounded or tolerated, or will be hissed at as vain, inept and rediculous as they may be seen openly in courts, halls, schools, barracks, colleges…</p></blockquote>

<blockquote><p>But if they [the Resolutioners] will extend it [the ordination vows] further, and say that it is meaned of absolute subjection to the sentence of his brethren, whether he have offended or not, they may as well, and with more color of reason, say that he is bound by his oath, not only to give subjection, but also obedience† to all their admonitions, whether just or unjust, lawful or unlawful; because there is no express limitation in the words of the oath, these qualifications, being as we said before, amongst the praecognita [assumptions] and praesupposita [presuppositions] of all such questions and answers, and there being no need to express them, except where there are grounds of jealousy.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-97fefbc4da" data-kw="">
<blockquote><p>I say from this prime defect of inner union, all the temporiser’s graces produced are superficial, sleight, full of overture: whereas those in sound believers are solid, substantial, not res intrinsecus defectuosae, things which though outwardly they have the appearance, yet are inwardly defective. Hence it is that Paul calleth their godliness, a figure of godliness, 2. Tim. 3.5. their knowledge an external form of knowledge, Rom. 2.20. that Christ maketh all they have, a semblance, a seeming only, Luke 8.18: for look as a wild herb, though it have the name and common nature, yet it differeth much from one which groweth in gardens, better manured and dressed: and as a blew, died with blockwood, though it seem brighter a while, yet is not so substantial as that which is woaded (and therefore we say it is a true colour): so here though the graces of the temporiser have the same name and common nature, (for they are inferior works of the spirit) yea though they may exceed in shew, yet for the truth and substance, they are nothing to those that are wrought in honest hearts; and from hence come two things.

First, their graces are soon grown up; for a thing superficial is done in half the time that a substantial thing is in working. They get the start: and, while many a true heart before them in the Lord is complaining of wants, and weaknesses, sinful inclinations, usurping in them; they are carried, as it were, per saltum, to their perfection. But as a true birth, though slowly at the first, yet still taketh increase, whereas a mole groweth faster at the first, but soon ceaseth: and look as in nature, things the soonest ripe, are the soonest rotten: So it fareth with these leap-Christians.

Secondly, I say their graces are insincere, their hearts are never purged from some sin which they love and like to live in, for sinister ends entertaining the message of God’s mercy, which is not, that they may reverence him, and serve him all their days without slavish terror: but they gladly hear it, as hoping that they have a protection by it, though they hold on in their own courses. For this it is that the elects faith, which never faileth, is called a faith without hypocrisy; that the true believer is only said to have an honest heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/paul-baynes.html">Paul Baynes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The trial of a Christian’s estate: or a discovery of the causes, degrees, signs and differences of the apostasy both of the true Christians and false in a sermon preached in London by Master Paul Bayne, and afterward sent in writing by him to his friend W.F.</cite>, (London: Nathanael Newbery, 1618), pp 8-9.</span></figcaption>

<blockquote><p>The first is, how we may discern whether particular men and particular Churches holding errors, be found members of the Catholic church or no. For the answering of this, we must make a double distinction, one of errors, the other of persons that err. Of errors, some are destroyers of the faith, some only weakners of it.

A destroyer is that, which overturneth any fundamental point of religion; which is of that nature, that if it be denied, religion it self is overturned; as the denial of the death of Christ, and the immortality of the soul, justification by works, and such like: and the sum of these fundamental points is comprised in the Creed of the Apostles and the Decalogue. A weakening error is that, the holding whereof doth not overturn any point in the foundation of salvation; as the error of freewill, and sundry such like.

This distinction is made by the holy Ghost, who saith expressly that the doctrines of repentance, and faith, and baptisms, and laying on of hands, and the resurrection, and the last judgement, are the foundation, namely of religion: and again, that Christ is the foundation, and that other doctrines consonant to the word, are as gold and silver laid thereupon.

Secondly, persons erring, are of two sorts: some err of weakness, being carried away by others; or of simple ignorance, not yet being convicted and informed concerning the truth. Some again err of obstinacy, or affected ignorance, which having been admonished and convicted, still persevere in their forged opinions.

This being said, we now come to the point. If any man or Church, shall hold an error of the lighter kind, he still remains a member of the Church of God, and so must be reputed of us. As when a Lutheran shall hold, that images are still to be retained in the church; that there is an Universal Election of all men, &amp;c. for these and such like opinions may be maintained, the foundation of salvation unrased.

This which I say is flatly avouched by Paul. If any man (saith he) build on this foundation gold, silver, precious stones; timber, hay, or stubble, his work shall be made manifest by the fire, &amp;c. and if any man’s work burn, he shall lose, but yet he shall be safe himself. And therefore the hay and stubble of men’s errors that are beside the foundation, on which they are laid, do not debar them from being Christians or members of the church.

A man breaks down the windows of his house; the house stands: he breaks down the roof or the walls; the house yet stands, though deformed: he pulls up the foundation; the house it self falls and ceaseth to be an house. Now religion which we profess is like an house or building: and some points thereof are like windows, doors, walls, roofs, and some are the very foundation: and the former may be battered, the foundation standing.

Again, if the error be directly or by necessary consequent, even in common sense against the foundation, consideration must be had whether the Church or party erreth of weakness or malice: if of weakness, the party is to be esteemed as a member of the Catholic church. And thus Paul writes unto the church of Galatia, as to a church of God, though by false teachers it had been turned away to another Gospel, and embraced the fundamental error of justification by works.

But when any man or church shall hold fundamental errors in obstinacy or affected ignorance, we are not then bound to repute them any longer as churches or Christians, but as such to whom condemnation belongs, as Paul sheweth by the example of Jannes and Jambres. And as Jannes and Jambres, saith he, withstood Moses, so do these also resist the truth, men of corrupt minds, reprobate concerning the faith.

Yet withal, this caveat must ever be remembered, that we rather condemn the error then the person that erreth, because Gods mercy is like a bottomless sea, whereby he worketh what he will and when he will in the hearts of miserable sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol or Creed of the Apostles, According to the Tenor of Scripture</cite>, in The Work of William Perkins (Cambridge: John Legat, 1600), pp 493-94.</span></figcaption>

<blockquote><p>6. We believe that lawful rulers have power to forbid such ministers to preach in this or that place, or anywhere in their dominions, whose preaching is such as tends to do more harm than good.

7. Had we any reasonable conviction that our ministry is unnecessary, we would obey our rulers, though they silenced us causlessly, and would seek some other place or way of serving God.

8. In those times, places, and circumstances which persuade us that more hurt than good will come by it if we preach, we will then and there forbear it, though it be not as an act of formal obedience, nor a desertion of our office, or of the exercise of it at other times.

9. We judge it our duty to further the good success of the conformable ministers to the utmost of our power.

10. And we take schism to be a great sin, and that which we are bound to do the best we can not only to avoid ourselves, but to cure or hinder in others.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“6. We believe that lawful rulers have power to forbid such ministers to preach in this or that place, or anywhere in their dominions, whose preaching is such as tends to do more harm than good.

7. Had we any reasonable conviction that our ministry is unnecessary, we would obey our rulers, though they silenced us causlessly, and would seek some other place or way of serving God.

8. In those times, places, and circumstances which persuade us that more hurt than good will come by it if we preach, we will then and there forbear it, though it be not as an act of formal obedience, nor a desertion of our office, or of the exercise of it at other times.

9. We judge it our duty to further the good success of the conformable ministers to the utmost of our power.

10. And we take schism to be a great sin, and that which we are bound to do the best we can not only to avoid ourselves, but to cure or hinder in others.”

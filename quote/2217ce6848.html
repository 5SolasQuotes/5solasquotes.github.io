<blockquote><p>…other children of the same condition who have been baptized and obtained eternal life… Although unbaptized children are separated from God as regards the union of glory…” (Summa, app. 2, art. 2) Voet: “Whether all infants without baptism withdraw to the resurrection of the damned? It is denied contra the Papists.” (Syllabus, sect. 2, tract 6, title 3, subtitle 3, ‘Of the Resurection’, ‘Of the Subject &amp; Object’) . Not Absolutely Tied to a Certain Form of Words Gillespie affirms Thomas (Summa, pt. 3, q. 60, art. 8) holding “that the consecration of a sacrament is not absolutely tied to a certain form of words.” (English-Popish, pt. 4, ch. 7, p. 34) Voet: “Whether the form of baptism consists in precisely that form of words, ‘I baptize you in the name of the Father, etc.’? It is denied.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-69ab3a0edf" data-kw="">
<blockquote><p>A second period in the history of Thomism is sometimes dated roughly from the period of the Protestant Reformation and the Council of Trent (1545-63) which was called in reaction against it. Thomas de Vio, also known as Cardinal Cajetan (1469-1534), produced a major commentary on the Summa Theologiae that would have a decisive influence upon the general understanding of Aquinas’s doctrines. Cajetan’s emphasis on continuity with Aquinas’s own positions was followed by later commentators such as Dominic Banez (1528-1604), and John Poinsot (1589-1644), who would come to be known as John of St. Thomas. This contrasted with the tendency of thinkers from the new Jesuit order, such as Luis de Molina (1535-1600) and Francisco Suarez (1548-1617), to combine Aquinas’s thought with various non-Thomistic elements. These different tendencies, roughly associated with Dominicans and Jesuits respectively, gave rise to sometimes heated doctrinal disputes, the most famous being the controversy over grace, free will, and divine foreknowledge. Ancient and medieval philosophy in general, and Thomism in particular, emphasized metaphysics over epistemology, and objective reality over our subjective awareness of it. The right order of inquiry, from this point of view, is first to determine the nature of the world and the place of human beings within it, and then on that basis to investigate how human beings come to acquire knowledge of the world. Modern philosophy, beginning with Rene Descartes (1596-1650), reverses this approach, tending as it does to start with questions about how we can come to have knowledge of the world and only then going on to consider what the world must be like, based on an account of our knowledge of it. In particular, both Descartes’ rationalism and the empiricism of writers like Locke, Berkeley, and Hume begin with the individual conscious subject or self, develop a theory about how that self can know anything, and then determine what reality in general must be like in line with their respective theories of knowledge. One result of this subjectivist method was to make objective reality and common sense problematic in a way they had not been for Aristotle and Aquinas; skepticism thus came to seem a serious threat, and idealism (the view that the material world is an illusion and that mind alone is real) came to seem a serious option. Another consequence was that even when some sort of objective reality was acknowledged, doubts were raised about the possibility of knowing much about it beyond what the senses could tell us directly. Accordingly, grand metaphysical systems of the sort presented by Plato, Aristotle, and Aquinas were called into question. The philosophy of Immanuel Kant (1724-1804) was an especially influential expression of hostility to traditional metaphysics, distinguishing as it does between ‘phenomena’ (the world as it appears to us, of which we can have knowledge) and ‘noumena’ (the world as it exists in itself, which we cannot know).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’ (2009)</cite></span></figcaption>

<blockquote><p>But the errors of philosophers are not the dictates of philosophy, any more than the mistakes of artificers are to be imputed to the art itself. ‘Philosophy,’ says Clement of Alexandria, ‘is not to be called Stoic, nor Platonic, nor Epicurean, nor Aristotelian, but whatever has been properly spoken by these sects–this, gathered into one whole, is to be called philosophy’ (Stromata 1.7 [ANF 2:308; PG 8.731]).</p></blockquote>

</figure><figure class="quote" id="q-23cb3ef646" data-kw="">
<blockquote><p>A guiding presupposition [of Matthew Barrett’s The Reformation as Renewal] is that the intellectual life of the second half of the thirteenth century was ‘characterized by a Thomistic atmosphere’ and that the later medieval theologians progressively fell away from the classical positions affirmed by Aquinas. Indeed, according to Barrett it was this degeneration away from Thomism in the later middle ages that was a significant catalyst for the Reformation. As soon as this presupposition is outlined, however, it is possible to see that Barrett’s account has, at the very best, an outdated view of later medieval thought. This kind of ‘decline’ narrative has not been maintained by experts in the thought of the period for many years, despite its persistence among historians whose direct acquaintance with scholastic texts ends with the death of Aquinas. The reason is that, outside the Dominican order (and, for that matter, inside it too at least until the middle of the fifteenth century), there never was a ‘Thomistic atmosphere.’ Why it was ever believed that there was one is not clear to me. But it is true to say that we do not pervasively find the kind of narrative Barrett reproduces until after Leo XIII’s Aeterni patris of 1879, and it is hard to avoid the conclusion that this encyclical itself had something to do with bringing about the anachronistic centering of Aquinas in our medieval intellectual history. This was no doubt an unintended consequence of Leo’s action, since it is clear enough that Leo’s motivation had to do with an appraisal of Aquinas’s intellectual weight, not of his influence on later medieval theology and philosophy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-cross.html">Richard Cross</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘An Accidental Reformation?’ in Hanover Review, 3.1 (2024)</cite></span></figcaption>

<main class="wrap"><figure class="quote" id="q-393d2e29b6" data-kw="">
<blockquote><p>The ordinance of the magistrate is a decree made by him for maintaining of religion, honesty, justice, and public peace; and it consisteth on two points; in ordering rightly matters of religion, and making good laws for the preservation of honesty, justice, and common peace. […] For I see many of of opinion, that the care and ordering of religion doth belong to bishops alone, and that kings, princes, and senators ought not to meddle therewith.

But the catholic verity teacheth, that the care of religion doth especially belong to the magistrate; and that it is not in his power only, but his office and duty also, to dispose and advance religion. For among them of old their kings were priests; I mean, masters and overseers of religion. Melchizedech [sic], that holy and wise prince of the Canaanitish people, who bare the type or figure of Christ our Lord, is wonderfully commended in the holy scriptures: now he was both king and priest together. Moreover, in the book of Numbers, to Josue, newly ordained and lately consecrated, are the laws belonging to religion given up and delivered. The kings of Juda also, and the elect people of God, have for the well ordering of religion (as I will by examples anon declare unto you) obtained very great praise: and again, as many as were slack in looking to religion are noted with the mark of perpetual reproach. Who is ignorant, that the magistrate’s especial care ought to be to keep the commonweal in safeguard and prosperity? Which undoubtedly he cannot do, unless he provide to have the word of God preached to his people, and cause them to be taught the true worship of God, by that means of making himself, as it were, the minister of true religion.

In Leviticus and Deuteronomy the Lord doth largely set down the good prepared for men that are religious and zealous indeed; and reckoneth up, on the other side, the evil appointed for the contemners of true religion. […] Whereby we gather, that they, which would not have the care of religion to appertain to princes, do seek and bring in the confusion of all things, the dissolution of princes and their people, and lastly, the neglecting and oppression of the poor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 323-4.</span></figcaption>

<blockquote><p>And the truth is, that, besides many other evils, the iniquity and unhappiness of such oaths and covenants [such as the SL&amp;C, which he was just examining] lie much in this, that being commonly framed by persons that even, amongst themselves, are not fully of one mind, but have their different opinions and interests to serve, (and it was so even in this) they commonly patch up so many several articles and clauses, and those too of so versatile and ambiguous terms, that they prove most wretched snares and thickets of briers and thorns to the consciences of those who are engaged in them, and matter of endless contentions and disputes amongst them, about the true sense and intendment, and the ties and obligations of those doubtful clauses: especially in such alterations and revolutions of affairs as always may, and often do, even within few years, follow after them; for the models and productions of such devices are not usually long-lived. And whatsoever may be said for their excuse in whole or in part, who, in yielding to the power that pressed it, and the general opinion of this Church at that time, did take that [Solemn League and] Covenant [1643] in the most moderate and least schismatical sense that the terms can admit; yet, I know not what can be said to clear them of a very great sin, that not only framed such an engine, but violently imposed it upon all ranks of men; not ministers and other public persons only, but the whole body and community of the people, thereby engaging such droves of poor ignorant persons to they knew not what, and (to speak freely) to such a hodge-podge of things of various concernments, religious and civil, as church discipline and government, the privileges of parliaments, and liberties of subjects, and condign punishment of malignants— things hard enough for the wisest and learnedest to draw the just lines of, and to give plain definitions and decisions of them, and therefore certainly as far off from the reach of poor country people’s understanding as from the true interest of their souls. And yet to tie them by a religious oath, either to know all, or to contend for them blindfold, without knowing of them, where will there be instanced a greater oppression and tyranny over consciences than this? Certainly, they that now govern in this Church cannot be charged with anything near or like unto it; for whatsoever they require of entrants to the ministry, they require neither subscriptions nor oaths of ministers already entered, and far less of the whole body of the people.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-leighton.html">Robert Leighton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works new</cite>, ed. (London: Duncan, 1830), vol. 4, ‘A Modest Defence of Moderate Episcopacy, as Established in Scotland at the Restoration of King Charles II [1660]’, pp. 391-92</span></figcaption>

</figure><figure class="quote" id="q-1d9b9fecdf" data-kw="">
<blockquote><p>Let us not own the way of God by halves, but wholly, fully, and in all things. And particularly, he is against our noble and faithful declaration, published at Sanquhar, whereby that wretched tyrant, Charles Stuart, and all his accomplices, were cast off by us, as we ought; which alas! was too long a doing: and by this he buries the blood, and condemns the faithful testimonies of so many worthies who have died upon that head, and therein have been eminently owned and assisted of the Lord. Indeed, herein he will run this subterfuge, and say, he acknowledges he ought to be rejected and deposed; yea, he may possibly grant that he deserveth death, both by the laws of God and the just laws of man; yet he cannot see how that can be done without another magistrate or magistrates. But we would answer, if he sees no other ways than those, he is but blind, and that is deceitful and double dealing; for magistrates have no power but what is derivative from the people; and magistrates have nothing actually, but what the people have virtually; yea, and more than virtually, for they may actually confer it upon whom they think most fit, for the power of government is natural and radical to them, being unitedly in the whole, and singularly in every one. So whatever magistrates may do, the people may do the same, either when they want magistrates, or when the magistrates fail and refuse to do their duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-renwick.html">James Renwick</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to Henry Jenkinson, 3 Oct. 1682 in Thomas Houston (ed.), Spiritual support and consolation in difficult times: the letters of the Rev. James Renwick, the last of Scotland’s covenanted martyrs, with and introduction, containing a historical sketch of Renwick’s life, labours, and martyrdom, and</cite></span></figcaption>

</figure><figure class="quote" id="q-5f8500454e" data-kw="">
<blockquote><p>The donation of Ananias and Sapphira was made to God for the use of the poor, it lay not now in their power nor in the Churches to revoke and reverse that grant, wherein God became now to be interessed. We see this in marriage, published in the face of the Church, solemnized by consent of parties and parents, ratified by the action of the minister, and celebrated in the presence of many friends; the knot cannot be untied, no not by agreement of the parents, of the parties, of the minister, of the friends, and of the whole congregation, because marriage is not of the nature of a civil contract, but God is a party and hath a special hand in it, and whom God hath joined together let no man put asunder, or separate again without his consent. (Mt. 19:6)</p></blockquote>

<blockquote><p>8. They [civil magistrates] may and ought to make such [spiritual seducers] incapable of public places of trust, and remove them from such: Because, 1. They cannot be supposed to employ their power singly. 2. Because such trust agreeth not to men and subjects as such, but are voluntarily conferred as tokens of respect put upon men eminently qualified, and as may be for the good of the commonwealth: And therefore it cannot be justly accounted a marring of their liberty as men or subjects. Upon this ground was Maachah the mother of Asa removed from being Queen, or having any government, 1 Kings 15:13; 2 Chron. 15:16, yet it cannot be said she was wronged when she was so dealt with.</p></blockquote>

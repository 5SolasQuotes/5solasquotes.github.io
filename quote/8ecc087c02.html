<main class="wrap"><figure class="quote" id="q-8ecc087c02" data-kw="">
<blockquote><p>…whatsoever recreations and exercises of body and mind are necessar[il]y required for the bettering of our sanctification of the Lord’s day and the enabling of us to perform with more cheerfulness, strength and courage the holy worship of God, and the work and service of his holy Sabbath, and which are also intended by us only to that end and use, them we may use, and so far as they serve to further and in no wise to hinder God’s holy worship and the immediate works and duties thereof. This is manifest by God’s allowing to his people in the Law dressing of meat and cheerful feasting on his Sabbath and holy days: which are needfull to cheer up men, and to provoke them to worship Him with all thankfulness of heart, also to put on our best apparel that we may come decently to God’s house. As these are lawful, being directed to holy use, so undoubtedly honest refreshing with recreations which cheer up the heart and refresh the spirits are lawful when they are helpful to holy exercises and are directed to that end, as stirring of the body, walking into gardens or fields to take fresh air, being found very helpful to preachers to revive their spirits, strengthen their loins, clear their voices, sharpen and quicken their wits and memories; and being done only to that end are lawful. So also walking into the corn fields in summer or harvest, or into meadows or pastures in the spring, both to refresh our bodies and spirits, and to give us occasion to admire God’s bounty in clothing the bodies, and his Fatherly providence in making the earth so fruitful, and to laud and praise Him, is lawful for us. And if after public and private exercise we do so walk about, diverse together, conferring of heavenly things and taking occasion by sight of earthly blessings to provoke one another to thankfulness and acknowledgment of God’s love, this no doubt is a recreation fit for the Lord’s day, and helps much our devotion; and this seems to have been practiced by our Savior, who went through the corn fields on the Sabbath day, Mt. 12:1, and his disciples with them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath</cite>, … (1638), ch. 21 Westminster divine, pp. 158-59</span></figcaption>

<blockquote><p>‘Such things’ (says Aaron) ‘have befallen me, and if I had eaten the sin-offering to day, should it have been good in the eyes of the Lord?’ [Lev. 10:19] In these words Aaron excuses himself, by reason of his sorrow, which made him unfit and unworthy to eat of those holy things. Dt. 12:7 &amp; 26:14; Hos. 9:4. The [Romanist] Douay divines, somewhat to the same purpose: ‘Natural grief of mind made Aaron both unwilling to eat, and less apt to complete all the ceremonies: so without sin he omitted that pertained to his own commodity, offering it unto God.’ The Geneva notes, ‘Moses bare with his infirmity, considering his great sorrow, but does not leave an example to forgive them that maliciously transgress the commandment of God.’… The conclusions from this text of Scripture may be such as these, that oftentimes the letter of the Law gives place to great necessities…</p></blockquote>

<blockquote><p>8. Of the beginning and ending of the Sabbath — The first rule about time. 8. It may seem to some necessary that something should be premised concerning the measure or continuance of the day to be set apart to a holy rest to the Lord; but it being a matter of controversy, and to me, on the reasons to be mentioned afterwards, of no great importance, I shall not insist upon the examination of it, but only give my judgment in a word concerning it. Some contend that it is a natural day, consisting of twenty-four hours, beginning with the evening of the preceding day, and ending with the same of its own. And accordingly so was the church of Israel directed, Lev. 23:32, “From even unto even shall ye celebrate your Sabbath;” although that does not seem to be a general direction for the observation of the weekly Sabbath, but to regard only that particular extraordinary Sabbath which was then instituted, namely, the day of atonement, on the tenth day of the seventh month, verse 27. However, suppose it to belong also to the weekly Sabbath, it is evidently an addition to the command, particularly suited to the Mosaical pedagogy, that the day might comprise the sacrifice of the preceding evening in the services of it; from an obedience whereunto we are freed by the gospel. Neither can I subscribe to this opinion; and that because, — (1.) In the description and limitation of the first original seven days, it is said of each of the six that it was constituted of an evening and a morning, but of the day of rest there is no such description; it is only called “the seventh day,” without any assignation of the preceding evening unto it. (2.) A day of rest, according to rules of natural equity, ought to be proportioned to a day of work or labor, which God has granted to us for our own use. Now, this is to be reckoned from morning to evening: Psalm 104:20-23: “Thou makest darkness, and it is night: wherein all the beasts of the forest do creep” (from whose yelling the night has its name in the Hebrew tongue.) “The young lions roar after their prey, and seek their meat from God. The sun arises, they gather themselves together, and lay them down in their dens. Man goes forth unto his work and to his labor until the evening.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews in the Works of John Owen</cite>, 4 vols. (London: Tegg, 1840), vol. 1, Exercitation 40, Practical Observance of the Lord’s Day, pp. 736-37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>
<div class="actions"><button class="copy" data-copy="“8. Of the beginning and ending of the Sabbath — The first rule about time. 8. It may seem to some necessary that something should be premised concerning the measure or continuance of the day to be set apart to a holy rest to the Lord; but it being a matter of controversy, and to me, on the reasons to be mentioned afterwards, of no great importance, I shall not insist upon the examination of it, but only give my judgment in a word concerning it. Some contend that it is a natural day, consisting of twenty-four hours, beginning with the evening of the preceding day, and ending with the same of its own. And accordingly so was the church of Israel directed, Lev. 23:32, “From even unto even shall ye celebrate your Sabbath;” although that does not seem to be a general direction for the observation of the weekly Sabbath, but to regard only that particular extraordinary Sabbath which was then instituted, namely, the day of atonement, on the tenth day of the seventh month, verse 27. However, suppose it to belong also to the weekly Sabbath, it is evidently an addition to the command, particularly suited to the Mosaical pedagogy, that the day might comprise the sacrifice of the preceding evening in the services of it; from an obedience whereunto we are freed by the gospel. Neither can I subscribe to this opinion; and that because, — (1.) In the description and limitation of the first original seven days, it is said of each of the six that it was constituted of an evening and a morning, but of the day of rest there is no such description; it is only called “the seventh day,” without any assignation of the preceding evening unto it. (2.) A day of rest, according to rules of natural equity, ought to be proportioned to a day of work or labor, which God has granted to us for our own use. Now, this is to be reckoned from morning to evening: Psalm 104:20-23: “Thou makest darkness, and it is night: wherein all the beasts of the forest do creep” (from whose yelling the night has its name in the Hebrew tongue.) “The young lions roar after their prey, and seek their meat from God. The sun arises, they gather themselves together, and lay them down in their dens. Man goes forth unto his work and to his labor until the evening.”

— John Owen, An Exposition of the Epistle to the Hebrews, with Preliminary Exercitations, 4 vols. (London: Tegg, 1840), vol. 1, Exercitation 40, Practical Observance of the Lord’s Day, pp. 736-37">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C8.+Of+the+beginning+and+ending+of+the+Sabbath+%E2%80%94+The+first+rule+about+time.+8.+It+may+seem+to+some+necessary+that+something+should+be+premised+concerning+the+measure+or+continuance+of+the+day+to+be+set+apart+to+a+holy+rest+to+the+Lord%3B+but+it+being+a+matter+of+controversy%2C+and+to+me%2C+on+the+reasons+to+be+mentioned+afterwards%2C+of+no+great+importance%2C+I+shall+not+insist+upon+the+examination+of+it%2C+but+only+give+my+judgment+in+a+word+concerning+it.+Some+contend+that+it+is+a+natural+day%2C+consisting+of+twenty-four+hours%2C+beginning+with+the+evening+of+the+preceding+day%2C+and+ending+with+the+same+of+its+own.+And+accordingly+so+was+the+church+of+Israel+directed%2C+Lev.+23%3A32%2C+%E2%80%9CFrom+even+unto+even+shall+ye+celebrate+your+Sabbath%3B%E2%80%9D+although+that+does+not+seem+to+be+a+general+direction+for+the+observation+of+the+weekly+Sabbath%2C+but+to+regard+only+that+particular+extraordinary+Sabbath+which+was+then+instituted%2C+namely%2C+the+day+of+atonement%2C+on+the+tenth+day+of+the+seventh+month%2C+verse+27.+However%2C+suppose+it+to+belong+also+to+the+weekly+Sabbath%2C+it+is+evidently+an+addition+to+the+command%2C+particularly+suited+to+the+Mosaical+pedagogy%2C+that+the+day+might+comprise+the+sacrifice+of+the+preceding+evening+in+the+services+of+it%3B+from+an+obedience+whereunto+we+are+freed+by+the+gospel.+Neither+can+I+subscribe+to+this+opinion%3B+and+that+because%2C+%E2%80%94+%281.%29+In+the+description+and+limitation+of+the+first+original+seven+days%2C+it+is+said+of+each+of+the+six+that+it+was+constituted+of+an+evening+and+a+morning%2C+but+of+the+day+of+rest+there+is+no+such+description%3B+it+is+only+called+%E2%80%9Cthe+seventh+day%2C%E2%80%9D+without+any+assignation+of+the+preceding+evening+unto+it.+%282.%29+A+day+of+rest%2C+according+to+rules+of+natural+equity%2C+ought+to+be+proportioned+to+a+day+of+work+or+labor%2C+which+God+has+granted+to+us+for+our+own+use.+Now%2C+this+is+to+be+reckoned+from+morning+to+evening%3A+Psalm+104%3A20-23%3A+%E2%80%9CThou+makest+darkness%2C+and+it+is+night%3A+wherein+all+the+beasts+of+the+forest+do+creep%E2%80%9D+%28from+whose+yelling+the+night+has+its+name+in+the+Hebrew+tongue.%29+%E2%80%9CThe+young+lions+roar+after+their+prey%2C+and+seek+their+meat+from+God.+The+sun+arises%2C+they+gather+themselves+together%2C+and+lay+them+down+in+their+dens.+Man+goes+forth+unto+his+work+and+to+his+labor+until+the+evening.%E2%80%9D%0A%0A%E2%80%94+John+Owen%2C+An+Exposition+of+the+Epistle+to+the+Hebrews%2C+with+Preliminary+Exercitations%2C+4+vols.+%28London%3A+Tegg%2C+1840%29%2C+vol.+1%2C+Exercitation+40%2C+Practical+Observance+of+the+Lord%E2%80%99s+Day%2C+pp.+736-37&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F44716ae32d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/44716ae32d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-day/the-whole-lords-day-is-sanctified/#:~:text=8.%20Of%20the%20beginning%20and%20ending,to%20his%20labor%20until%20the%20evening&amp;text=8.%20Of%20the%20beginning%20and%20ending%20of%20the&amp;text=work%20and%20to%20his%20labor%20until%20the%20evening" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

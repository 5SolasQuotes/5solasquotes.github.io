<main class="wrap"><figure class="quote" id="q-fc79a50ce6" data-kw="">
<blockquote><p>Creation is the production of something from nothing both as to itself and as to its subject. It differs from formation, which is production from nothing as to itself but not as to its subject. Conclusion 23: The first external production of God must be creation. This conclusion is against the philosophers who reckoned that God was only the former of the world but not its creator. The conclusion is proved from the fact that all beings outside God are effects. Therefore if you say the matter from which God made things was present beforehand I ask: what about the matter? It cannot exist from itself because it lacks the properties of a being from-itself (from conclusion 2 of this part 3); therefore from another, and therefore ultimately from God (from corollary 1 of conclusion 3 of this part).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pp. 103-4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-1d83a2433e" data-kw="">
<blockquote><p>The stability of the earth is very useful to plants, beasts, and men, that abide thereon. The damages and mischiefs that fall out upon earthquakes give further proof hereof. It is a gross error of Aristarchus, Samius, Copernicus, and other philosophers, who imagine that the earth continually moveth, and that the heaven and the host thereof do but seem to our sight to move, as the banks and trees thereon do to such as are in a boat rowed with oars, or in a ship under sail. This conceit cannot stand with the metaphor of a foundation, here and in other places applied to the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, ch. 1, verse 10, section 131</span></figcaption>

</figure><figure class="quote" id="q-a68262c412" data-kw="">
<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Plain, Brief &amp; Comfortable Notes upon every Chapter of Genesis</cite>, (London: 1592), ch. 1, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-b7fc69887b" data-kw="">
<blockquote><p>4th Problem. Whether creatures can be similar to God? Answer: Of an accidental similitude, and by participation, Affirmed—as is manifestly proved from Gen. 1, where it treats of the creation of man to the image and likeness of God. But of an essential similitude, or one by essence, Denied. And under this distinction is to be explained, against the enthusiastic distortions, the passage 2 Pet. 1:4, where the participation of θείας φύσεως [the divine nature] is to be understood accidentally, by imitation and similitude—but not essentially according to substance, whether the same in number or in species. Hence, too, the passage Isa. 46 receives light, where God denies Himself to be similar to any thing—much less that any external image can be a picture of Him, or a formal sign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, ‘Problems on God, pt. 2’ tr. AI by Roman Prestarri Latin, vol. 5 (1669)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<main class="wrap"><figure class="quote" id="q-0d1136388a" data-kw="">
<blockquote><p>With regard to public worship, the Presbyterian system is characterized by great simplicity and plainness. Many have censured the Presbyterian mode of worship as too plain–as not availing itself enough of those external means which tend to excite reverential emotion. But in this point, also, it took for its rule the simplicity of the Scriptures. The great idea presented in the Gospel is spiritual worship, free alike from multitudinous forms that cumber memory and distract the mind, and from a gorgeous apparatus that dazzles and beguiles the senses. Its object is to direct the eye of faith to the Savior alone, and to fill the mind with nothing but sacred truth. Such is scriptural simplicity in worship and in instruction; and this perfect example the Presbyterian Church strove closely to follow. Praise, prayer, and preaching, all simple, all direct, all spiritual, all from the heart, all for God’s glory and man’s salvation, were the sole elements and aim of Presbyterian worship. This was its idea of what public worship ought to be; because this was all for which the Gospel record gave authority. And the Scottish Reformers firmly held that will-worship was sinful and pernicious; that God alone could prescribe what mode of worship would be acceptable in his sight; and that it was equally dangerous to add to, or to take from, whatsoever God had commanded. They had seen too much of the ignorance, folly, and crime prevalent among those who were addicted to the sensuous and emotional worship of Rome, to attach much value to mere forma and show in matters of religion. And when they turned to the pure and simple worship of the New Testament, they beheld in it the majestic simplicity of the clear blue heavens in their cloudless glory. They felt, therefore, that they were rendering homage to the God of heaven best, when they were worshipping Him after the example of the Lord Jesus Christ and his apostles. No other defense for the plainness and simplicity of their mode of worship would they have offered; and no other defense does any true Presbyterian think it can require–perhaps it were more correct to say, in this very simplicity and plainness, so directly scriptural, consists its greatest merit. And it may be safely said, that in no other system has there been produced a greater amount of religious knowledge, strong faith, and practical piety throughout the entire body of worshippers.</p></blockquote>

<blockquote><p>It’s [the light of nature is] altogether insufficient to prescribe or set down any worship of God. Hence God does so often forbid us to walk after our own imaginations and to do that which we shall choose. The apostle calls it will-worship, when a man’s will is the mere cause of it. Now, it’s true, men are more apt to admire this, as we see in the Pharisees and Papists; they dote upon their traditions more then God’s institutions… It’s true indeed, even in worship, light of Nature and prudence is instrumentally required to order the institutions of God; but as reason may not make a new article of faith, so neither a new part of worship.</p></blockquote>

</figure><figure class="quote" id="q-5510b393e4" data-kw="">
<blockquote><p>‘It’s not always easy to identify a cult,’ Jenkinson says, explaining that there isn’t one type of person that joins a cult, they don’t dress a certain way and they can operate from ‘ordinary’ houses. The Family Survival Trust… defines a cult as a system controlled by a charismatic and authoritarian leadership that is ‘rigidly bounded’ and supported by a fixed set of beliefs. It involves brainwashing designed to isolate, control and exploit followers. Cults do not have to be religious. Linguist Amanda Montell, author of Cultish: The Language of Fanaticism, explains people can ‘erect a cult around anything, as long as you can inject it with fear and an ‘us-versus-them’ mentality’. … While cults can be hard to spot, Jenkinson and Montell note some ‘red flags’ people can look for: – One possible indicator Jenkinson highlights is ‘love bombing,’ a manipulation tactic that sees abusers use affection and declarations of love as a way of gaining power and control. – Another common theme is promising ‘answers to life’s very complex problems’… – Montell says the combination of mantras, buzzwords and nicknames for insiders and outsiders of the group, as well as language that elicits a strong reaction while encouraging us not to ask further questions, can be indicators. – The linguist adds that certain texts being ‘off-limits’ in the group can also be a warning sign. – The most ‘extreme’ trait of a cult for Montell is a ‘high barrier to exit’, meaning group members being made to feel they might lose their identity or friendships, or fear retaliation, if they leave the group.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/shola-lee.html">Shola Lee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”You’re sold a lie’: How do you spot a cult’</cite>, (2025) at BBC.com</span></figcaption>

<blockquote><p>Lawfulnesse is an essential property of divine worship resulting from God’s particular approving will in his Word, as is clear, Hosea 8:5; 1 Chron. 15:13; Lev. 10:1; 2 Sam. 7:7; Jer. 7:30; Acts 15:24… …for it [arbitrary worship] cannot have its warrant from God’s general will whereby the proposition of a syllogism is warranted, but not the assumption, for thus the golden calfe of Jeroboam, the worshipping of Satan, should be lawful: for I can form a syllogism to it from Scripture (All worship commanded in the Word is lawful, but Jeroboam’s golden calf is commanded in the Word; Therefore, it is lawful… If ceremonies come partly from men’s will, partly from the light of reason, then do they conclude the lawfulness of ceremonies either fallibly or necessarily: If the former be said, we have little warrant of conscience to practice them; nor can God be honored, nor these things lawful, good, and edificative, more than unlawful, evil and unapt to edify, seeing there be no light of Scripture or nature to make them good to us; and because a fallible and unnecessary consequence is over fallible and unnecessary, and stands (as Aristotle says well) in an indivisible point. It is a non-consequence, and so men’s will is the best house that ceremonies are descended of. If they can be proved by a necessary and infallible consequence, we desire to hear it…</p></blockquote>

— Samuel Rutherford, The Divine Right of Church Government… (London, 1646) Westminster divine, pp. 120-21">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLawfulnesse+is+an+essential+property+of+divine+worship+resulting+from+God%E2%80%99s+particular+approving+will+in+his+Word%2C+as+is+clear%2C+Hosea+8%3A5%3B+1+Chron.+15%3A13%3B+Lev.+10%3A1%3B+2+Sam.+7%3A7%3B+Jer.+7%3A30%3B+Acts+15%3A24%E2%80%A6+%E2%80%A6for+it+%5Barbitrary+worship%5D+cannot+have+its+warrant+from+God%E2%80%99s+general+will+whereby+the+proposition+of+a+syllogism+is+warranted%2C+but+not+the+assumption%2C+for+thus+the+golden+calfe+of+Jeroboam%2C+the+worshipping+of+Satan%2C+should+be+lawful%3A+for+I+can+form+a+syllogism+to+it+from+Scripture+%28All+worship+commanded+in+the+Word+is+lawful%2C+but+Jeroboam%E2%80%99s+golden+calf+is+commanded+in+the+Word%3B+Therefore%2C+it+is+lawful%E2%80%A6+If+ceremonies+come+partly+from+men%E2%80%99s+will%2C+partly+from+the+light+of+reason%2C+then+do+they+conclude+the+lawfulness+of+ceremonies+either+fallibly+or+necessarily%3A+If+the+former+be+said%2C+we+have+little+warrant+of+conscience+to+practice+them%3B+nor+can+God+be+honored%2C+nor+these+things+lawful%2C+good%2C+and+edificative%2C+more+than+unlawful%2C+evil+and+unapt+to+edify%2C+seeing+there+be+no+light+of+Scripture+or+nature+to+make+them+good+to+us%3B+and+because+a+fallible+and+unnecessary+consequence+is+over+fallible+and+unnecessary%2C+and+stands+%28as+Aristotle+says+well%29+in+an+indivisible+point.+It+is+a+non-consequence%2C+and+so+men%E2%80%99s+will+is+the+best+house+that+ceremonies+are+descended+of.+If+they+can+be+proved+by+a+necessary+and+infallible+consequence%2C+we+desire+to+hear+it%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%E2%80%A6+%28London%2C+1646%29+Westminster+divine%2C+pp.+120-21&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F74b6e0f3c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href <blockquote><p>True worship of God may be defined generally thus: Worship of God is the true honor shown to God from a sense of his kindness and power towards us, as resulting from his Word. But this honor is not civil, but divine and religious and is seated mainly in the heart and mind. Thus worship arises from the sense of God’s power and kindness.</p></blockquote>

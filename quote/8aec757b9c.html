<blockquote><p>However, God’s activity differs from an artisan’s activity in two ways. The first way is on the part of the matter. For since an artisan does not produce matter but rather works with a given matter, he does not confer on the matter the potency to receive the forms that he introduces to the matter, nor can he put this into the matter. But God, who is the author of the entire thing, conferred not only natural forms and powers on things but also the potency for receiving that which he would make in the matter. The second way is on the part of the form, because the forms that the artisan introduces do not reproduce themselves; for a couch that putrefies does not sprout into a couch but into a plant, as is clear from the Physics 1. But natural forms [of living things] can reproduce themselves. Thus, they have the property of a seed and are called ‘seedlike.’ Now, the forms of things as existing in the divine art are called ‘primordial’ because they are, simply speaking, the first principles of things to be produced. The potency that has been implanted in things for receiving into themselves that which the will of God decrees is called ‘obediential principles’ by some, based on which matter has the ability to become what God wills it to be. Finally, the actual powers placed in matter, which give rise to natural effects, are called ‘seedlike principles.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences | distinction 18, Creation of Woman, quest. 1, art. 2, I answer that</cite>, bk. 2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a7f8ab653f" data-kw="">
<blockquote><p>Hart’s second main objection is that any rational creature would, just by virtue of being rational, desire to know the very essence of the first cause of all things, so that such knowledge would be its natural end. There is a sense in which the premise is true, but the conclusion does not follow. To borrow an example from the philosopher Thomas Nagel, consider that there is an obvious sense in which a human being might desire to know what it is like to be a bat—to fly through the air the way a bat does, to get around via echolocation, and so on. Yet there is also an obvious sense in which it is simply not part of our nature to do these things, so that human beings can live complete lives as the kind of creatures we are without doing them. For that reason, our curiosity about what it is like to be a bat does not entail a sense of deprivation or loss in the way that, say, a missing limb would. In an analogous way, had human beings been created in a state of “pure nature,” without a divinely imparted orientation toward the supernatural end of the beatific vision, they might in a sense nevertheless wish that they could have a direct knowledge of God’s very essence. But they would also judge that this is simply no more possible for them than it is possible for them to know what it is like to be a bat, and thus they would not feel this impossibility as a deprivation of something they were by nature made for. The indirect knowledge of God that they are capable of would suffice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘David Bentley Hart’s Post-Christian Pantheism’ (2022) at Public Discourse</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

<blockquote><p>…whereas original sin does necessarily incline him to sinful actions and courses in general; though to this kind of sin in special, or to this particular, in what kindsoever, it does not… when once God has planted in us a principle of new life, of the life of grace, by the spirit of regeneration, though all the powers thereof do incline only to that which is good, like as the powers of natural corruption incline only unto evil, yet the particular use and exercise of those is always free: Like as the particular use and exercise of the powers of our corruption is always free to the committing of this or that sin according unto emergent occasions standing in congruity to every man’s particular disposition.</p></blockquote>

<blockquote><p>…the will, for Aquinas, just is the inclination of a rational substance toward what the intellect judges to be good… for Aquinas the will inclines of necessity toward what the intellect judges to be good, and in particular at what we judge will bring happiness. That does not entail that we cannot will what we judge to be in some way bad. Aquinas’s view is rather that whenever we will some end, it is because of some good we judge it to have, even if the intellect acknowledges it to be bad in other respects. At the moment of choice, it is the good that the intellect sees in it that it focuses on, and the will opts for it under that aspect. Though I follow here the common practice of speaking about what the intellect sees, what the will opts for, and so on, it is important to emphasize that strictly sepaking, it is the person or rational substance who does these things. The intellect and will are powers or capacities of this substance rather than substances in their own right. When it is said that the intellect knows something, this is to be understood as a shorthand way of saying that the person knows it, by virtue of his intellect. Similarly, when it is said that the will chooses some end, this is a shorthand way of saying that the person chooses it, by virtue of his will. Now many ends are pursued for the sake of further ends. You labor in order to earn an income… But Aquinas holds that there must be one ultimate end toward which all our actions are directed… he hold that that end is happiness. Moreover, he argues that what alone can bring happiness is to know and love God. That is not to deny that people disagree about what will bring happiness, and that many seek it in something other than God. The point is that whatever ultimate end they seek, they seek it as that which they suppose will bring happiness. And, Aquinas holds, what alone can really bring it is in fact God, even if some do not see that.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…the will, for Aquinas, just is the inclination of a rational substance toward what the intellect judges to be good… for Aquinas the will inclines of necessity toward what the intellect judges to be good, and in particular at what we judge will bring happiness. That does not entail that we cannot will what we judge to be in some way bad. Aquinas’s view is rather that whenever we will some end, it is because of some good we judge it to have, even if the intellect acknowledges it to be bad in other respects. At the moment of choice, it is the good that the intellect sees in it that it focuses on, and the will opts for it under that aspect. Though I follow here the common practice of speaking about what the intellect sees, what the will opts for, and so on, it is important to emphasize that strictly sepaking, it is the person or rational substance who does these things. The intellect and will are powers or capacities of this substance rather than substances in their own right. When it is said that the intellect knows something, this is to be understood as a shorthand way of saying that the person knows it, by virtue of his intellect. Similarly, when it is said that the will chooses some end, this is a shorthand way of saying that the person chooses it, by virtue of his will. Now many ends are pursued for the sake of further ends. You labor in order to earn an income… But Aquinas holds that there must be one ultimate end toward which all our actions are directed… he hold that that end is happiness. Moreover, he argues that what alone can bring happiness is to know and love God. That is not to deny that people disagree about what will bring happiness, and that many seek it in something other than God. The point is that whatever ultimate end they seek, they seek it as that which they suppose will bring happiness. And, Aquinas holds, what alone can really bring it is in fact God, even if some do not see that.”

— Edward Feser, Immortal Souls: a Treatise on Human Nature (Editiones Scholasticae, 2024), pt. 4, ‘What is the Soul’ Feser is an Analytical Thomist., ch. 10, ‘Immortality’, pp. 478-79">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6the+will%2C+for+Aquinas%2C+just+is+the+inclination+of+a+rational+substance+toward+what+the+intellect+judges+to+be+good%E2%80%A6+for+Aquinas+the+will+inclines+of+necessity+toward+what+the+intellect+judges+to+be+good%2C+and+in+particular+at+what+we+judge+will+bring+happiness.+That+does+not+entail+that+we+cannot+will+what+we+judge+to+be+in+some+way+bad.+Aquinas%E2%80%99s+view+is+rather+that+whenever+we+will+some+end%2C+it+is+because+of+some+good+we+judge+it+to+have%2C+even+if+the+intellect+acknowledges+it+to+be+bad+in+other+respects.+At+the+moment+of+choice%2C+it+is+the+good+that+the+intellect+sees+in+it+that+it+focuses+on%2C+and+the+will+opts+for+it+under+that+aspect.+Though+I+follow+here+the+common+practice+of+speaking+about+what+the+intellect+sees%2C+what+the+will+opts+for%2C+and+so+on%2C+it+is+important+to+emphasize+that+strictly+sepaking%2C+it+is+the+person+or+rational+substance+who+does+these+things.+The+intellect+and+will+are+powers+or+capacities+of+this+substance+rather+than+substances+in+their+own+right.+When+it+is+said+that+the+intellect+knows+something%2C+this+is+to+be+understood+as+a+shorthand+way+of+saying+that+the+person+knows+it%2C+by+virtue+of+his+intellect.+Similarly%2C+when+it+is+said+that+the+will+chooses+some+end%2C+this+is+a+shorthand+way+of+saying+that+the+person+chooses+it%2C+by+virtue+of+his+will.+Now+many+ends+are+pursued+for+the+sake+of+further+ends.+You+labor+in+order+to+earn+an+income%E2%80%A6+But+Aquinas+holds+that+there+must+be+one+ultimate+end+toward+which+all+our+actions+are+directed%E2%80%A6+he+hold+that+that+end+is+happiness.+Moreover%2C+he+argues+that+what+alone+can+bring+happiness+is+to+know+and+love+God.+That+is+not+to+deny+that+people+disagree+about+what+will+bring+happiness%2C+and+that+many+seek+it+in+something+other+than+God.+The+point+is+that+whatever+ultimate+end+they+seek%2C+they+seek+it+as+that+which+they+suppose+will+bring+happiness.+And%2C+Aquinas+holds%2C+what+alone+can+really+bring+it+is+in+fact+God%2C+even+if+some+do+not+see+that.%E2%80%9D%0A%0A%E2%80%94+Edward+Feser%2C+Immortal+Souls%3A+a+Treatise+on+Human+Nature+%28Editiones+Scholasticae%2C+2024%29%2C+pt.+4%2C+%E2%80%98What+is+the+Soul%E2%80%99+Feser+is+an+Analytical+Thomist.%2C+ch.+10%2C+%E2%80%98Immortality%E2%80%99%2C+pp.+478-79&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4a2e857a3c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4a2e857a3c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-free-choice/#:~:text=the%20will%2C%20for%20Aquinas%2C%20just%20is,if%20some%20do%20not%20see%20that&amp;text=the%20will%2C%20for%20Aquinas%2C%20just%20is%20the%20inclination&amp;text=God%2C%20even%20if%20some%20do%20not%20see%20that" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

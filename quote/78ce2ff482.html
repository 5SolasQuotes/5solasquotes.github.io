<main class="wrap"><figure class="quote" id="q-78ce2ff482" data-kw="">
<blockquote><p>It is also plain that the inspiration of Scripture extends to every part of it. Even its historic records must be treated in the same way as its doctrinal statements. In fact, we can draw no line of separation between the two here, for some of the most important views of divine truth which the Bible contains, are embodied in the incidents which it narrates.

If we may not, then, speak of inspired facts, it is nevertheless evident that divine wisdom was needed by those who record these facts, lest they should be so stated as to intercept or obscure the light of divine truth which was let in upon the world in this way.

Nor can it be denied that divine wisdom was also needed for the selection of the facts which were to be recorded. In one word, we must recognise, from the first page of Scripture to the last, the presence of the Spirit of God, not destroying the individuality of the writers, but superintending its actings, prompting the communications which it was needful to make, restraining them from those which would have marred the design of their revelations, letting mind meet mind in the sacred page, and yet so pervading every portion with heavenly wisdom and divine grace, as to make the Bible, from Genesis to Revelation, a volume which is all given by inspiration of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-macewan.html">Alexander MacEwan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Revelation Embodied in Scripture Supernatural, as Contradistinguished from the Productions of merely Human Thought and Genius in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-615059786d" data-kw="">
<blockquote><p>There is, brethren, one God, the knowledge of whom we gain from the Holy Scriptures, and from no other source. For just as a man if he wishes to be skilled in the wisdom of this world will find himself unable to get at it in any other way than by mastering the dogmas of philosophers, so all of us who wish to practice piety will be unable to learn its practice from any quarter than the oracles of God. Whatever things then the Holy Scriptures declare, at these let us look; and whatsoever things they teach these let us learn.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/hippolytus-of-rome.html">Hippolytus of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, 9</span></figcaption>

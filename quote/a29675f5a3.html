<main class="wrap"><figure class="quote" id="q-a29675f5a3" data-kw="">
<blockquote><p>I confess, when persons are entered into a visible Church-society by baptism, if they will own that profession they were baptized into, and are not guilty either of plain ignorance of it, or manifest scandal, and demand as their right the other ordinances of the Gospel, I see not by what power they may be excluded. If we fix not in a serious visible profession as the ground of giving right, but require positive evidences of grace in every one to be admitted to ordinances as the only thing giving right, for my part, setting aside the many inconveniences besides which attend that in reference to the persons to be admitted, I see not how with a safe and good conscience ordinances can be administered by any. My reason is this: Every one, especially a minister, in that case ought to proceed upon certain grounds that the person admitted has right to the ordinance to be administered; but if positive signs of grace be required, a man’s conscience cannot proceed upon any certainty, without infallible knowledge of another’s spiritual state, which I suppose none will pretend to. My meaning is, that which gives right, must be something evident to the person admitting into it, if it be his duty to enquire after it; but if only positive signs of grace be looked on as giving right, the ground of right can never be so evident to another person, as to proceed with a good conscience, i.e. with a full persuasion of another’s right to the administration of any ordinance to him. If it be said that these are required only as tokens of a true visible profession, and it is that which gives the right, I reply, Our knowledge of, and assent to the conclusion can be no stronger, nor more certain than to the premises from whence it is inferred; if therefore true profession gives right, and our knowledge of that proceeds upon our knowledge of the work of grace, we are left at the same uncertainty we were at before. But if we say, that an outward profession of the Gospel (where there is nothing rendering men uncapable of owning it, which is ignorance, nor declaring they do not own it, which is scandal) is that which gives a visible right to the ordinances of the Church as visible, we have something to fix ourselves upon, and to bottom a persuasion of the right of persons to ordinances. Christ when He instituted Churches, did institute them as visible societies, that is, to have marks whereby to be known and distinguished, as other societies in the world are; now that which puts a difference between this and other societies, is an open profession of Christianity, which profession is looked upon as the outward expression of the internal consent of the soul to the doctrine and laws of the Gospel. Which outward evidence of consent, where there is nothing evidently and directly oppugning it, is that which the Church of God in admission of visible members is to proceed upon. I nowhere find that ever Christ or his apostles in making disciples, or admitting to Church-membership, did exact anymore than a professed willingness to adhere to the doctrine which they preached; nor that they refused any who did declare their desire to join with them. An owning Christianity is all we read of antecedent to admission of Church-members. And if anything else be further required as necessary, we must either say the Word of God is defective in institutions of necessity to the Church, which I suppose the assertors of it will not be so inconsistent to their own principles as to do; or else must produce where anything further is required by the Word of God. … 3. The reality of consent may be sufficiently manifested without an explicit [man-composed Church-] covenant, as in the joining with those who are under the same profession in the common acts of the society and acceptance of, and submission to the rulers of that society, which implicitly is that covenant which they would have expressed; and actions in this case, are as declarative and significative as words.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cab4783fca" data-kw="">
<blockquote><p>Apostles and members-dissolved are not fixed members of a single congregation, and yet members they must be of the visible, Church-catholic: sure it is no paradox, that the Apostles are such members, for they had right to all the seals in all congregations; Therefore, they must by this reason be members and no members: the like may be said of godly professors-sojourners [travellers], of these baptized by John Baptist, Mt. 3, by Peter, Acts 10, by Paul, Acts 16. For if we say that professors are only members of a particular congregation, then we confine a brother to be gained only to one congregation: ‘let all the rest perish: they are not my brethren.’</p></blockquote>

</figure><figure class="quote" id="q-ee28a452b6" data-kw="">
<blockquote><p>‘But’ (says he [John Robinson, a Separatist]) ‘the bare profession of fundamentals makes not a Church; they must be a company of faithful people, and if they must not be truly faithful, then they must be falsely faithful; for God requires true and ready obedience in his word, according to which we must define Churches, and not according to casual things.’ [Rutherford’s] Answer: This is a special ground that deceives the Separatists, their ignorance (I mean) of the visible Church, for the visible Church consists essentially neither of such as be truly faithful, nor of such as must be falsely faithful; for the ignorant man sees not that the visible Church includes neither faith, nor unbelief in its essence or definition. It is true, to the end that professors may be members of the invisible Church, they must be believers, and must believe, except they would be condemned eternally; but to make them members of the visible Church, neither believing nor unbelieving is essential, but only a profession ecclesiastically intear[?], that is not scandalous &amp; visibly &amp; apparently lewd and flagitious, such as was the profession of Simon Magus when he was baptized with the rest of the visible Church, Acts 8. And God indeed requires of us true worship and ready obedience, as he says, but not that a visible Church should be defined by true and sincere obedience: for essentials only are taken in a definition, and casual corruptions are only accidental to Churches and fall out through men’s faults, and therefore should not be in the definition either of a visible or an invisible Church; nor should ready and sincere obedience which is a thing invisible to men’s eyes be put in the definition of a visible Church, for it is accidental to a visible Church, and nothing invisible can be essential to that which essentially is visible; the visible Church is essentially visible.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“‘But’ (says he [John Robinson, a Separatist]) ‘the bare profession of fundamentals makes not a Church; they must be a company of faithful people, and if they must not be truly faithful, then they must be falsely faithful; for God requires true and ready obedience in his word, according to which we must define Churches, and not according to casual things.’ [Rutherford’s] Answer: This is a special ground that deceives the Separatists, their ignorance (I mean) of the visible Church, for the visible Church consists essentially neither of such as be truly faithful, nor of such as must be falsely faithful; for the ignorant man sees not that the visible Church includes neither faith, nor unbelief in its essence or definition. It is true, to the end that professors may be members of the invisible Church, they must be believers, and must believe, except they would be condemned eternally; but to make them members of the visible Church, neither believing nor unbelieving is essential, but only a profession ecclesiastically intear[?], that is not scandalous &amp; visibly &amp; apparently lewd and flagitious, such as was the profession of Simon Magus when he was baptized with the rest of the visible Church, Acts 8. And God indeed requires of us true worship and ready obedience, as he says, but not that a visible Church should be defined by true and sincere obedience: for essentials only are taken in a definition, and casual corruptions are only accidental to Churches and fall out through men’s faults, and therefore should not be in the definition either of a visible or an invisible Church; nor should ready and sincere obedience which is a thing invisible to men’s eyes be put in the definition of a visible Church, for it is accidental to a visible Church, and nothing invisible can be essential to that which essentially is visible; the visible Church is essentially visible.”

— Samuel Rutherford, The Due Right of Presbyteries… (1644), pt. 2, ch. 4, section 5, pp. 231-32">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%98But%E2%80%99+%28says+he+%5BJohn+Robinson%2C+a+Separatist%5D%29+%E2%80%98the+bare+profession+of+fundamentals+makes+not+a+Church%3B+they+must+be+a+company+of+faithful+people%2C+and+if+they+must+not+be+truly+faithful%2C+then+they+must+be+falsely+faithful%3B+for+God+requires+true+and+ready+obedience+in+his+word%2C+according+to+which+we+must+define+Churches%2C+and+not+according+to+casual+things.%E2%80%99+%5BRutherford%E2%80%99s%5D+Answer%3A+This+is+a+special+ground+that+deceives+the+Separatists%2C+their+ignorance+%28I+mean%29+of+the+visible+Church%2C+for+the+visible+Church+consists+essentially+neither+of+such+as+be+truly+faithful%2C+nor+of+such+as+must+be+falsely+faithful%3B+for+the+ignorant+man+sees+not+that+the+visible+Church+includes+neither+faith%2C+nor+unbelief+in+its+essence+or+definition.+It+is+true%2C+to+the+end+that+professors+may+be+members+of+the+invisible+Church%2C+they+must+be+believers%2C+and+must+believe%2C+except+they+would+be+condemned+eternally%3B+but+to+make+them+members+of+the+visible+Church%2C+neither+believing+nor+unbelieving+is+essential%2C+but+only+a+profession+ecclesiastically+intear%5B%3F%5D%2C+that+is+not+scandalous+%26+visibly+%26+apparently+lewd+and+flagitious%2C+such+as+was+the+profession+of+Simon+Magus+when+he+was+baptized+with+the+rest+of+the+visible+Church%2C+Acts+8.+And+God+indeed+requires+of+us+true+worship+and+ready+obedience%2C+as+he+says%2C+but+not+that+a+visible+Church+should+be+defined+by+true+and+sincere+obedience%3A+for+essentials+only+are+taken+in+a+definition%2C+and+casual+corruptions+are+only+accidental+to+Churches+and+fall+out+through+men%E2%80%99s+faults%2C+and+therefore+should+not+be+in+the+definition+either+of+a+visible+or+an+invisible+Church%3B+nor+should+ready+and+sincere+obedience+which+is+a+thing+invisible+to+men%E2%80%99s+eyes+be+put+in+th

<main class="wrap"><figure class="quote" id="q-740f6cf934" data-kw="">
<blockquote><p>But man is capable of knowing God from such creatures in three ways, as Denis says in The Divine Names. He knows him, first of all, through causality. For since these creatures are subject to change and decay, it is necessary to trace them back to some unchangeable and unfailing principle. In this way, it can be known that God exists. Second, he can be known by the way of excellence. For all things are not traced back to the first principle as to a proper and univocal cause, as when man produces man, but to a common and exceeding cause. From this it is known that God is above all things. Third, he can be known by the way of negation. For if God is a cause exceeding his effects, nothing in creatures can belong to him, just as a heavenly body is not properly called heavy or light or hot or cold. And in this way, we say that God is unchangeable and infinite; and we use other negative expressions to describe him. Men had such knowledge through the light of reason bestowed on them: ‘many say: O, that we might see some good! Lift up the light of your countenance upon us, O Lord’ (Ps 4:6).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Romans, ch. 1, bk. 6, sect. 115</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f1d8e2c61a" data-kw="">
<blockquote><p>[1.] A twofold revelation of God is given to wayfarers [persons in this life], one in the sphere of nature, another in the sphere of grace. 2. Revelation in the sphere of nature is either Objective in the works of creation, or Subjective in the consciences of men. 3. The revelation alone exhibited in the sphere of nature cannot be salutary, nor has any mortal through it alone either been led to salvation or been able to be led. 4. To those therefore to whom the grace of superior revelation in the sphere of grace after sin introduced into the world has not been made, salvation was never destined by God: for the wise one does not will the end for him to whom he by no means grants the necessary means, without which it cannot come to pass that he should attain the end, when those can be had only by his giving. 5. And since the sphere of nature exhibits only τὸ γνωστὸν τοῦ θεοῦ [the knowledge of God], by no means indeed σοφίαν τοῦ θεοῦ ἐν μυστηρίῳ [the wisdom of God in mystery], that is, the Gospel and doctrine concerning Christ the Savior and faith in Him, who, without knowledge of Him who alone is the way, can come to life? 6. Therefore the revelation alone exhibited to sinners in the sphere of grace through God’s word can be salutary, which reveals both the actual expiation of sin, and the mode of it, and him through whom it is expiated, and the means of applying that expiation to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/disputationum-theologicarum-miscellaneorum-pars-prima.html">Disputationum Theologicarum Miscellaneorum Pars Prima</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<blockquote><p>nature; a term having three primary meanings in scholastic theology and in Protestant orthodox usage: (1) essence; (2) a particular kind or species of essence in its actual existence; (3) the entire physical universe and its phenomenon… In the third sense, natura simply refers to the order of nature and is used in such terms as lex naturalis (q.v.), natural law, or theologia naturalis (q.v.), natural theology–the law implicit in the order of the phenomenal world and the knowledge of God obtainable from examination of the physical universe.</p></blockquote>

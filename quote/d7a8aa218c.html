<main class="wrap"><figure class="quote" id="q-d7a8aa218c" data-kw="">
<blockquote><p>If you confess with your mouth the Lord Jesus and believe in your heart that God has raised Him from the dead, you will be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times in the Academy of Sedan 3rd</cite>, vol. 2 3rd ed. tr. AI by Colloquia Scholastica (1645; London: Moses Pitt, 1683), On Justifying Faith, pt. 1, pp. 160-61 Le Blanc (1614-1675) was a reformed professor of theology at Sedan, France. | XCII. Nevertheless, when it is said that faith, as it justifies and saves, primarily deals with the Gospel promises, it should signify mainly and principally, not exclusively. For faith, as it saves and justifies, does not deal only with those promises. Faith is said to save and justify as it is the condition of the covenant of grace, where God no longer demands from us, under the penalty of eternal death and curse, the perfect and absolute observation of the law in all its details as the covenant of works required, but instead requires living faith, which works through love. While the Law of Moses says, “do and live,” the Gospel says, “believe and be saved.” However, the faith that the Gospel demands as the condition under which it offers us salvation, does not only regard the promises of the Gospel but also its commands and doctrines, such as the Resurrection of our Lord Jesus Christ, as is evident from the words of Paul:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

</figure><figure class="quote" id="q-54f697d22b" data-kw="">
<blockquote><p>(1.) What we mean by a condition in the gospel-covenant. By a condition of the covenant, we do not mean in the strictest rigid sense of the word, such a restipulation to God from man of perfect obedience in his own person, at all times, so as the least failure therein forfeits all the mercies of the covenant; that is rather the condition of Adam’s covenant of works, than of the evangelical covenant: nor do we assert any meritorious condition, that in the nature of an impulsive cause shall bring man into the covenant and its privileges, or continue him in when brought in. This we renounce as well as you: but our question is about such a condition as is neither in the nature of an act perfect in every degree, nor meritorious in the least of the benefit conferred, nor yet done in our own strength. But plainly and briefly, our question is, Whether there be not something as an act required of us in point of duty, to a blessing consequent by virtue of a promise? Such a thing, whatever it be, hath the nature of a condition, inasmuch as it is antecedent to the benefit of the promise; and the mercy or benefit granted, is suspended until it be performed. The question is not, whether there be any intrinsical worth or value in the thing so required, to oblige the disposer to make or perform the grant or promise, but merely that it be antecedent to the enjoyment of the benefit; and that the disposer of the benefit do suspend the benefit until it be performed? Thus an act or duty of ours, which has nothing at all of merit in it, or answerable value to the benefit it relates to, may be in a proper sense a condition of the said benefit. ‘For what is a condition in the true notion of it, but (1) the suspension of a grant until something future be done?’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“John Flavel’s</cite>, (1630–1691) Reply to Baptist Hyper-Calvinism from Vindiciæ Legis et Fœderis and the Issue of Conditions” from Vindiciæ Legis et Fœderis: Or, A Reply to Mr. Philip Cary’s Solemn Call (1690) in The Whole Works of the Rev. Mr. John Flavel, 6 vols. (London: Baynes &amp; Son, 1820), vol. 6, pp. 348–56 at Theological Meditations</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/faith-alone.html">Instrumental Cause: Faith Alone</a></span></div>

<blockquote><p>36. The instrument of application is faith, not theoretical but practical, nor an act of the mind only but also of the heart, and that not superficial but radical.

37. But this faith is regarded in application neither habitually or qualitatively, but only relatively and organically, whence the benefit of justification is promiscuously ascribed, sometimes to the instrument, sometimes to the object apprehended through the instrument, in an identical sense.

38. The instruments of producing this faith are the Word and sacraments, not by reason of inherent virtue, but by reason of adhering blessing, and that from God’s ordination. Whence both the use of the Word and Sacraments is to be employed, yet to be circumscribed, and neither is to be attributed to the instruments what belongs to Him who acts through instruments, nor is God to be bound to them, but man only, nor is the same latitude to be judged of our duty and of grace.

39. The efficient cause of this faith is God’s Spirit, who through internal calling produces its act, through sanctification its habit, and through this omnimodo-sanctity according to parts, although not according to degrees, both as to the repurgation of faculties corrupted through sin and as to the convenient subordination of them inverted through sin.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/friedrich-spanheim.html">Friedrich Spanheim</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Miscellaneous Theological Disputation exhibiting a Theological Compendium’ in Disputationum Theologicarum Miscellaneorum Pars Prima</cite>, (d. 1649; Geneva: Chouët, 1652), trans. AI by Roman Prestarri at Confessionally Reformed Theology Latin</span></figcaption>

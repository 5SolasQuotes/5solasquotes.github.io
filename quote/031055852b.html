<blockquote><p>Q. 9. What is the work of creation? A. The work of creation is God’s making all things of nothing, by the Word of his power, in the space of six days, and all very good. … Q. In what time did He make them? A. In the space of six days.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1d83a2433e" data-kw="">
<blockquote><p>The stability of the earth is very useful to plants, beasts, and men, that abide thereon. The damages and mischiefs that fall out upon earthquakes give further proof hereof. It is a gross error of Aristarchus, Samius, Copernicus, and other philosophers, who imagine that the earth continually moveth, and that the heaven and the host thereof do but seem to our sight to move, as the banks and trees thereon do to such as are in a boat rowed with oars, or in a ship under sail. This conceit cannot stand with the metaphor of a foundation, here and in other places applied to the earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hebrews</cite>, ch. 1, verse 10, section 131</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-a68262c412" data-kw="">
<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Plain, Brief &amp; Comfortable Notes upon every Chapter of Genesis</cite>, (London: 1592), ch. 1, p. 6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>…the Israelites agreed with the Egyptians in the long and curious ceremony of embalming for forty days, which were days of sadness, because they were spent in applications to the dead; and the Egyptians agreed with the Hebrews in their thirty days of mourning, in the places fore-mentioned. There is afterward mention made of a mourning by the space of seven days, verse 10….</p></blockquote>

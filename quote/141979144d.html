<main class="wrap"><figure class="quote" id="q-141979144d" data-kw="">
<blockquote><p>One of the basic principles of covenant theology is that we must presume continuity with the Old Testament unless discontinuity can be proved from the New Testament. In other words, when God gives a command we must presume that it is still in force unless he has altered it. William Twisse helpfully applies this to the issue of Sabbath observance:

For in this respect it was, that at the first the Lord blessed the seventh day and sanctified it: and some thousand of years after gives this reason, why after six days of labour the seventh being the Sabbath of the Lord our God, no manner of work should be done therein: which being once thus ordered by the Lord of the Sabbath, it must be in force of perpetual observation, as a requisite determination of the morality of this Law; and not of an alterable nature, save only by the same authority whereby it was ordained.

Now to my understanding, by the fourth Commandment it is clear: First, that God commanded some time to be set apart, and sanctified unto his service. Second, that the proportion of this time he hath defined to be one day in seven. Thirdly, that the particular day under this proportion was designed to be the seventh, and that unto the Jews in correspondence to the seventh day from the first creation, whereon God commanded them to rest from all their works, like as on that day the Lord rested from his works. And there is no question amongst Christians, but that all this ought to be religiously observed by the people of God, until the Lord himself manifest his pleasure for alteration, and no farther, in any particular, than God shall manifest his pleasure for alteration.

As for example. First for the time, then for the rest, lastly, for the service of the day it self. First, if God hath not manifested his will for any alteration, of setting apart some time for divine service; we must still continue to set some time apart for divine service. Likewise, if God hath not manifested his pleasure, to have the proportion of time altered, which hath been originally allotted unto his service, we must not presume to allow a less proportion of time for his service, than hath been formerly prescribed by him. […] And as for the particularity of the day, if God hath manifested his pleasure to have it altered, it must be altered, (as in case it appear to have been ceremonial, in respect of the rest commanded thereon) and another in the seven substituted in place thereof, and that according to God’s direction, and not otherwise.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the morality of the fourth commandment, as still in force to bind Christians. Delivered by way of answer to the translator of Doctor Prideaux his lecture, concerning the doctrine of the Sabbath</cite>, (London, 1641), the preface.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4d2447d66c" data-kw="">
<blockquote><p>On the other side, narrow and temporary precepts and examples:

1. Are void of all these foresaid [universal and perpetual] characters;

2. They are about materials of temporary use;

3. Or they are but the ordering of such customs as were there before, and were proper to those countries;

4. And many speeches are plainly appropriated to the time and persons;

5. And many actions were manifestly occasional, without any intimation of reason or purpose of obliging others to imitation. … So the women’s veil and the custom of kissing each other as a token of love, and men’s not wearing long hair, were the customs of the country there ordered and improved by the apostles about sacred things, but not introduced into other countries that had no such custom.</p></blockquote>

<blockquote><p>It is pity that any wise and judicious minister should want [lack] that fervor and seriousness of speech which the weight of so great a business does require. And it is greater pity that any serious, affectionate minister should be ignorant and injudicious: And it is yet greater pity that in any good men, too much of their fervor should be merely affected and seem to be what it is not; or at least be raised by a selfish desire to advance ourselves in the hearers’ thoughts and to exercise our parts upon their affections. But it is most pitiful that the Church has any hypocrites who have no other but such affected dissembled fervency. And it is not the least pity that so many good people, especially youths and women, should be so weak, as to value an affectionate tone of speech above a judicious opening of the Gospel. I confess there is something in an affectionate expression, which will move the wisest: And as light and judgment tend to generate judgment, so heat of affection tends to beget affection. And I never loved a senseless delivery of matters of eternal consequence, as if we were asleep ourselves, or would make the hearers to be so: or would have them think by our cold expressions that we believe not ourselves, when we set forth the great inestimable things of the life to come. But yet it grieves my very soul to think what pitiful, raw and ignorant kind of preaching is crowded most after in many places for the mere affectionate manner of expression and loudness of the preacher’s voice! How oft have I known the ablest preachers undervalued and an ignorant man by crowds applauded, when I that have been acquainted with the preacher ab incunabulis [from infancy], have known him to be unable well to answer most questions in the common catechism. And I durst not tell them of his great insufficiency and ignorance for fear of hindering the success of his labors and being thought envious at other men’s acceptance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions</cite>, … (London, 1670), pt. 1, Direction 41, pp. 214-15</span></figcaption>

<blockquote><p>Yet we know that reading [homilies from the pulpit] is a sort of preaching…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace</cite>, … (London, 1679), sect. 6, p. 106</span></figcaption>

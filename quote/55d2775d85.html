<main class="wrap"><figure class="quote" id="q-55d2775d85" data-kw="Spirit and Word">
<blockquote><p>We may now easily infer how erroneously our opponents act in vaunting of the Holy Spirit, for no other end than to give the credit of his name to strange doctrines, extraneous to the word of God, whereas he himself desires to be inseparably connected with the word of God; and Christ declares the same thing of him, when he promises him to the Church. And so indeed it is. The soberness which our Lord once prescribed to his Church, he wishes to be perpetually observed. He forbade that anything should be added to his word, and that anything should be taken from it. This is the inviolable decree of God and the Holy Spirit, a decree which our opponents endeavour to annul when they pretend that the Church is guided by the Spirit without the word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.13</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1057e41071" data-kw="">
<blockquote><p>All things which are necessary to salvation are contained in the Scriptures, and also all those things which are necessarily required to the instruction and edification of the Church. … Hence the Scripture is not a partial, but a perfect rule of Faith, and manners: neither is here any thing that is constantly and every where necessary to be observed in the Church of God, which depends either upon any tradition, or upon any authority whatsoever and is not contained in the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology</cite>, Book I, ch. XXXIV, theses 15–16</span></figcaption>

</figure><figure class="quote" id="q-39cdcf3c15" data-kw="">
<blockquote><p>We believe that the word, contained in these books, came from one God; of whom alone, and not of men, the authority thereof dependeth. … it is not lawful to oppose either antiquity, custom, multitude, man&#x27;s wisdom and judgment, or edicts, or any decrees, or councils, or visions, or miracles, unto this holy Scripture; but rather that all things ought to be examined and tried by the rule and square thereof.</p></blockquote>

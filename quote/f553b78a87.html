<main class="wrap"><figure class="quote" id="q-f553b78a87" data-kw="">
<blockquote><p>We seek the ninth argument from Galatians 3:27, “Whoever among you who has been baptized into Christ, has been clothed with Christ.” The meaning is that the church is necessary for Christ as to be covered with clothes, and under it to take refuge, that it may be absolutely holy and above reproach. Just as Jacob did not merit the right of first born by himself, hidden in the style of his brother, and wearing his clothes, which breathed the best odor, he made his way to his father, so that for his own advantage he might receive the blessing under a foreign person, so it is necessary that we take refuge under the precious purity of our firstborn brother Christ, that we may bring back the testimony of righteousness in the sight of God. In order that we may make ourselves ready in salvation before the face of God, it is necessary that we emit His sweet smell, and that our vices be covered up by and buried in His perfection. Christ is put on by us first and principally, because His satisfaction having been imputed to us, He covers us and adorns us as a garment in the sight of God. Then also Christ is put on by us, because we begin in this life to become conformed to Him. But here Paul speaks especially about imputation of righteousness and reconciliation through Christ, the testimony of which baptism alleges. Hence, we argue thus: whoever have put on Christ, to them that most perfect obedience of Christ, whereby He fulfilled the whole law, is imputed for righteousness. But we, as many as have been baptized into Christ, have put on Christ. Therefore, that most perfect obedience, whereby He fulfilled the whole Law, is imputed for righteousness to us, as many as have been baptized into Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Free Justification of Man the Sinner Before God</cite>, (1615) in Justification By Faith Alone: Selected Writings From Theodore Beza (1519–1605), Amandus Polanus (1561–1610), Francis Turretin (1623–1687), trans. Casey Carmichael, Volume 6: Classic Reformed Theology Theology (Reformation Heritage Books</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

</figure><figure class="quote" id="q-093986bd25" data-kw="">
<blockquote><p>I do not, however, concede to [Rome] that Paedobaptism had its origin the Tradition of the Church. It certainly appears to be founded on the institution of God, and to have derived its origin from circumcision. It would have little foundation if it depended only on the will of man. Accordingly, we must hold it as an universal rule, that no Sacrament is legitimate, unless it be of God and not of men. But to return to the present subject; not only the Blessing of the Pascal taper, the Exorcism of Water, and similar follies, which are of endless number, but the ritual of the Mass, and all the impious worship of this description, they make perfectly pure by a simple process, by merely giving them the name of Traditions, so that everything to which time has given a kind of prescriptive right is, as it were, placed beyond controversy, and holds up its head among the commandments of God. Will no man oppose this? Nay, rather a thousand times incur the obloquy of disturbing the peace, than by perfidious dissimulation betray the essential truth which is here endangered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tracts Relating to the Reformation</cite>, On The Truth Method of Giving Peace to Christendom in Tracts Relating to the Reformation, vol. 3, trans. Henry Beveridge (Edinburgh: Calvin Translation Society, 1851), 269.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism.html">Baptism</a></span></div>

idelblog</a></div>
</figure><figure class="quote" id="q-2a58eef5f2" data-kw="">
<blockquote><p>The children of those that are indeed in the church, but, because of their unclean way of living, declare that they are not indeed of the church; if they be offered to baptism, they cannot be debarred therefrom, nor ought they. The reason is, because though the parents be wicked, yet their impiety ought not to prejudge their children which are born within the church. But if you say, only the children of the faithful are to be baptized, because those infants only are judged to be within the covenant, and they only holy; I answer, the impiety of their nearest parents is not to be considered here, but the piety of the church in which they are born;—as also their ancestors who have lived godly and holily.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 226. As quoted by Thomas Boston, Works, vol. 6, ‘Miscellaneous Questions’, Question 6, pp. 139-140</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

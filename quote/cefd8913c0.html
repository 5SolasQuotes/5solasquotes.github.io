<main class="wrap"><figure class="quote" id="q-cefd8913c0" data-kw="">
<blockquote><p>4. Although political Cunning is to be acknowledged in established Paganism and Mohammadanism, it is impossible for true Christianity to owe its origin to the deceits of Politicians: for nothing is more adverse to the pride of impious Politicians, desiring to govern all things according to their pleasure, than that precept in Acts 5:29, Πειθαρχεῖν δεῖ Θεῷ μᾶλλον ἢ ἀνθρώποις, we ought to obey God rather than men, and in Luke 12:4, 5, λέγω δὲ ὑμῖν τοῖς φίλοις μου, Μὴ φοβηθῆτε ἀπὸ τῶν ἀποκτεινόντων τὸ σῶμα, καὶ μετὰ ταῦτα μὴ ἐχόντων περισσότερόν τι ποιῆσαι. Ὑποδείξω δὲ ὑμῖν τίνα φοβηθῆτε· φοβήθητε τὸν μετὰ τὸ ἀποκτεῖναι ἐξουσίαν ἔχοντα ἐμβαλεῖν εἰς τὴν γέενναν· ναί, λέγω ὑμῖν, τοῦτον φοβήθητε, And I say unto you my friends, Be not afraid of them that kill the body, and after that have no more that they can do: But I will forewarn you whom ye shall fear: Fear Him, which after He hath killed hath power to cast into hell; yea, I say unto you, Fear Him.

Indeed, unless this Religion came from God Himself, truly Existing, it would have been exterminated a long time ago by the power of Politicians, frequently persecuting and being eager to annihilate Christians: which is the pious observation, suited to our use, of the Eminent NIEUWENTYT, Cosmotheoria, chapter XXI, § 43, pages 490, 491. 5. The opinion of Hobbes, insofar as he traces the Worship and veneration of God from the fear of a superior Power only, is exceedingly injurious to God, inasmuch as he, depriving Him of the natural right of requiring worship, and actually turning it into Tyranny, also destroys the true character of Religion, which men, only when compelled by force and fear, will observe; indeed which they will easily abjure again, thinking that God according to His own right is able to punish even His pious worshippers, indeed actually to dispense evils to good men: see VAN DE WYNPERSSE, in his Dissertatione de Libertinismo, pages 32-35.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 11, p. 106.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-dc9d6f7f58" data-kw="">
<blockquote><p>St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Moderation a Virtue</cite>, … (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful.</span></figcaption>

<blockquote><p>Wherefore we thought it right, to shew forth with all accuracy, in our present definition the error of such as make and venerate these, for it is the unanimous doctrine of all the holy Fathers and of the six Ecumenical Synods, that no one may imagine any kind of separation or mingling in opposition to the unsearchable, unspeakable, and incomprehensible union of the two natures in the one hypostasis or person. What avails, then, the folly of the painter, who from sinful love of gain depicts that which should not be depicted—that is, with his polluted hands he tries to fashion that which should only be believed in the heart and confessed with the mouth? He makes an image and calls it Christ. The name Christ signifies God and man. Consequently it is an image of God and man, and consequently he has in his foolish mind, in his representation of the created flesh, depicted the Godhead which cannot be represented, and thus mingled what should not be mingled. Thus he is guilty of a double blasphemy—the one in making an image of the Godhead, and the other by mingling the Godhead and manhood. Those fall into the same blasphemy who venerate the image, and the same woe rests upon both, because they err with Arius, Dioscorus, and Eutyches, and with the heresy of the Acephali. When, however, they are blamed for undertaking to depict the divine nature of Christ, which should not be depicted, they take refuge in the excuse: We represent only the flesh of Christ which we have seen and handled. But that is a Nestorian error. For it should be considered that flesh was also the flesh of God the Word, without any separation, perfectly assumed by the divine nature and made wholly divine. How could it now be separated and represented apart? So is it wish the human soul of Christ which mediates between the Godhead of the Son and the dulness of the flesh. As the human flesh is at the same time flesh of God the Word, so is the human soul also soul of God the Word, and both at the same time, the soul being deified as well as the body, and the Godhead remained undivided even in the separation of the soul from the body in his voluntary passion. For where the soul of Christ is, there is also his Godhead; and where the body of Christ is, there too is his Godhead. If then in his passion the divinity remained inseparable from these, how do the fools venture to separate the flesh from the Godhead, and represent it by itself as the image of a mere man? They fall into the abyss of impiety, since they separate the flesh from the Godhead, ascribe to it a subsistence of its own, a personality of its own, which they depict, and thus introduce a fourth person into the Trinity. Moreover, they represent as not being made divine, that which has been made divine by being assumed by the Godhead. Whoever, then, makes an image of Christ, either depicts the Godhead which cannot be depicted, and mingles it with the manhood (like the Monophysites), or he represents the body of Christ as not made divine and separate and as a person apart, like the Nestorians. The only admissible figure of the humanity of Christ, however, is bread and wine in the holy Supper. This and no other form, this and no other type, has he chosen to represent his incarnation. Bread he ordered to be brought, but not a representation of the human form, so that idolatry might not arise. And as the body of Christ is made divine, so also this figure of the body of Christ, the bread, is made divine by the descent of the Holy Spirit; it becomes the divine body of Christ by the mediation of the priest who, separating the oblation from that which is common, sanctifies it. The evil custom of assigning names to the images does not come down from Christ and the Apostles and the holy Fathers; nor have these left behind them, any prayer by which an image should be hallowed or made anything else than ordinary matter.</p></blockquote>

also soul of God the Word, and both at the same time, the soul being deified as well as the body, and the Godhead remained undivided even in the separation of the soul from the body in his voluntary passion. For where the soul of Christ is, there is also his Godhead; and where the body of Christ is, there too is his Godhead. If then in his passion the divinity remained inseparable from these, how do the fools venture to separate the flesh from the Godhead, and represent it by itself as the image of a mere man? They fall into the abyss of impiety, since they separate the flesh from the Godhead, ascribe to it a subsistence of its own, a personality of its own, which they depict, and thus introduce a fourth person into the Trinity. Moreover, they represent as not being made divine, that which has been made divine by being assumed by the Godhead. Whoever, then, makes an image of Christ, either depicts the Godhead which cannot be depicted, and mingles it with the manhood (like the Monophysites), or he represents the body of Christ as not made divine and separate and as a person apart, like the Nestorians. The only admissible figure of the humanity of Christ, however, is bread and wine in the holy Supper. This and no other form, this and no other type, has he chosen to represent his incarnation. Bread he ordered to be brought, but not a representation of the human form, so that idolatry might not arise. And as the body of Christ is made divine, so also this figure of the body of Christ, the bread, is made divine by the descent of the Holy Spirit; it becomes the divine body of Christ by the mediation of the priest who, separating the oblation from that which is common, sanctifies it. The evil custom of assigning names to the images does not come down from Christ and the Apostles and the holy Fathers; nor have these left behind them, any prayer by which an image should be hallowed or made anything else than ordinary matter.”

— Philip Schaff, Other citations (work not named), eds., “Epitome of the Definition of the Iconoclastic Conciliabulum,” in The Seven Ecumenical Councils, trans. Henry R. Percival, vol. 14, A Select Library of the Nicene and Post-Nicene Fathers of the Christian Church, Second Series (New York: Charles Scribner’s Sons, 1900), 543–44.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWherefore+we+thought+it+right%2C+to+shew+forth+with+all+accuracy%2C+in+our+present+definition+the+error+of+such+as+make+and+venerate+these%2C+for+it+is+the+unanimous+doctrine+of+all+the+holy+Fathers+and+of+the+six+Ecumenical+Synods%2C+that+no+one+may+imagine+any+kind+of+separation+or+mingling+in+opposition+to+the+unsearchable%2C+unspeakable%2C+and+incomprehensible+union+of+the+two+natures+in+the+one+hypostasis+or+person.+What+avails%2C+then%2C+the+folly+of+the+painter%2C+who+from+sinful+love+of+gain+depicts+that+which+should+not+be+depicted%E2%80%94that+is%2C+with+his+polluted+hands+he+tries+to+fashion+that+which+should+only+be+believed+in+the+heart+and+confessed+with+the+mouth%3F+He+makes+an+image+and+calls+it+Christ.+The+name+Christ+signifies+God+and+man.+Consequently+it+is+an+image+of+God+and+man%2C+and+consequently+he+has+in+his+foolish+mind%2C+in+his+representation+of+the+created+flesh%2C+depicted+the+Godhead+which+cannot+be+represented%2C+and+thus+mingled+what+should+not+be+mingled.+Thus+he+is+guilty+of+a+double+blasphemy%E2%80%94the+one+in+making+an+image+of+the+Godhead%2C+and+the+other+by+mingling+the+Godhead+and+manhood.+Those+fall+into+the+same+blasphemy+who+venerate+the+image%2C+and+the+same+woe+rests+upon+both%2C+because+they+err+with+Arius%2C+Dioscorus%2C+and+Eutyches%2C+and+with+the+heresy+of+the+Acephali.+When%2C+however%2C+they+are+blamed+for+undertaking+to+depict+the+divine+nature+of+Christ%2C+which+should+not+be+depicted%2C+they+take+refuge+in+the+excuse%3A+We+represent+only+the+flesh+of+Christ+which+we+have+seen+and+handled.+But+that+is+a+Nestorian+error.+For+it+should+be+considered+that+flesh+was+also+the+flesh+of+God+the+Word%2C+without+any+separation%2C+perfectly+assumed+by+the+divine+nature+and+made+wholly+divine.+How+could+it+now+be+separated+and+represented+apart%3F+So+is+it+wish+the+human+soul+of+Christ+which+mediates+between+the+Godhead+of+the+Son+and+the+dulness+of+the+flesh.+As+the+human+flesh+is+at+the+same+time+flesh+of+God+the+Word%2C+so+is+the+human+soul+also+soul+of+God+the+Word%2C+and+both+at+the+same+time%2C+the+soul+being+deified+as+well+as+the+body%2C+and+the+Godhead+remained+undivided+even+in+the+separation+of+the+soul+from+the+body+in+his+voluntary+passion.+For+where+the+soul+of+Christ+is%2C+there+is+also+his+Godhead%3B+and+where+the+body+of+Christ+is%2C+there+too+is+his+Godhead.+If+then+in+his+passion+the+divinity+remained+inseparable+from+these%2C+how+do+the+fools+venture+to+separate+the+flesh+from+the+Godhead%2C+and+represent+it+by+itself+as+the+image+of+a+mere+man%3F+They+fall+into+the+abyss+of+impiety%2C+since+they+separate+the+flesh+from+the+Godhead%2C+ascribe+to+it+a+subsistence+of+its+own%2C+a+personality+of+its+own%2C+which+they+depict%2C+and+thus+introduce+a+fourth+person+into+the+Trinity.+Moreover%2C+they+represent+as+not+being+made+divine%2C+that+which+has+been+made+divine+by+being+assumed+by+the+Godhead.+Whoever%2C+then%2C+makes+an+image+of+Christ%2C+either+depicts+the+Godhead+which+cannot+be+depicted%2C+and+mingles+it+with+the+manhood+%28like+the+Monophysites%29%2C+or+he+represents+the+body+of+Christ+as+not+made+divine+and+separate+and+as+a+person+apart%2C+like+the+Nestorians.+The+only+admissible+figure+of+the+humanity+of+Christ%2C+however%2C+is+bread+and+wine+in+the+holy+Supper.+This+and+no+other+form%2C+this+and+no+other+type%2C+has+he+chosen+to+represent+his+incarnation.+Bread+he+ordered+to+be+brought%2C+but+not+a+representation+of+the+human+form%2C+so+that+idolatry+might+not+arise.+And+as+the+body+of+Christ+is+made+divine%2C+so+also+this+figure+of+the+body+of+Christ%2C+the+bread%2C+is+made+divine+by+the+descent+of+the+Holy+Spirit%3B+it+becomes+the+divine+body+of+Christ+by+the+mediation+of+the+priest+who%2C+separating+the+oblation+from+that+which+is+common%2C+sanctifies+it.+The+evil+custom+of+assigning+names+to+the+images+does+not+come+down+from+Christ+and+the+Apostles+and+the+holy+Fathers%3B+nor+have+these+left+behind+them%2C+any+prayer+by+which+an+image+should+be+hallowed+or+made+anything+else+than+ordinary+matter.%E2%80%9D%0A%0A%E2%80%94+Philip+Schaff%2C+Other+citations+%28work+not+named%29%2C+eds.%2C+%E2%80%9CEpitome+of+the+Definition+of+the+Iconoclastic+Conciliabulum%2C%E2%80%9D+in+The+Seven+Ecumenical+Councils%2C+trans.+Henry+R.+Percival%2C+vol.+14%2C+A+Select+Library+of+the+Nicene+and+Post-Nicene+Fathers+of+the+Christian+Church%2C+Second+Series+%28New+York%3A+Charles+Scribner%E2%80%99s+Sons%2C+1900%29%2C+543%E2%80%9344.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd49f56a941.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d49f56a941.html">Permalink</a><a class="src" href="https://heidelblog.net/2018/12/the-case-of-the-8th-century-iconoclasts-against-images-of-christ/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>The second virtue of adoration is inward obedience of the hidden man of the heart. The Lord prefers this obedience before all sacrifice, 1 Sam. 15:22. This stands in two things. First, in yielding subjection of the conscience to the commandments, threatnings and promises of God, so as we are willing that it should become bound unto them. Secondly, when the rest of the powers of the soul, in their place and time, perform obedience unto God.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-91d2f4baae" data-kw="">
<blockquote><p>We must ponder and meditate on the death of Christ for us not just because he suffered the most terrible things on our behalf but also because he did so voluntarily. He emptied himself of his own free will and became obedient, even to death on a cross. Nor was the death of Christ acceptable to God the Father because it was the free act of the human Christ (although the man Jesus Christ did in fact die of his own free will) but much more because it was the will of the Logos and Son of God.

The obedience of Christ depends on the will of him who was God in the person of the Son, his self-emptying was that of the Godhead in the person of the Son, and his obedience to the glory of God was in the person of the Son. So when he took human nature on himself and suffered all that he did, it was the self-emptying of the Godhead in the person of the Son in order to obtain the righteousness needed to satisfy God’s justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Analysis Logica in Epistolam Pauli Apostoli ad Galatas</cite>, (London: Felix Kyngston, 1602). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement.html">Priestly Office: Satisfaction and Atonement</a></span></div>

The obedience of Christ depends on the will of him who was God in the person of the Son, his self-emptying was that of the Godhead in the person of the Son, and his obedience to the glory of God was in the person of the Son. So when he took human nature on himself and suffered all that he did, it was the self-emptying of the Godhead in the person of the Son in order to obtain the righteousness needed to satisfy God’s justice.”

<main class="wrap"><figure class="quote" id="q-0ab17e83da" data-kw="">
<blockquote><p>…for no doubt God in his decree and secret intention may intend, by the ministry of his servants, the true and real conversion of many hypocrites, such as are no less unconverted, then [Simon] Magus and Demas; for He hath mercy, on whom He will, Rom. 9:17, but according to this way, ‘these who are converts in the judgment of charity’ (he [Hooker] should say only converts in that judgment) are not according to God’s revealed intention and approving will or command taken in by pastors, that they may be really converted: for God giveth, in no sort, this command to pastors in his revealed intention. [Hooker:] ‘See that ye admit no fools to wisdom’s table or within wisdom’s house, but such only as you believe in charity are real converts, and both called and chosen,’ contrary to Prov. 9:1-4; Mt. 22:8-9,14. Therefore [it would follow on Hooker’s terms], by my revealed intention and command you are not to intend their conversion, but to presuppose that they were already converted: otherwise, if the Lord by his revealed intention and command will have such hypocrites who are but nominal saints, brought in that they may be truly converted, there must follow two contradictory intentions revealed in God: for the Lord’s command to pastors is [would be] ‘I command you to preach to these who are converts in the judgment of charity, that upon my intention, they may be truly converted’; and also: ‘I command you, my pastors, preach to no Church members, that upon my intention, they may be converted, because you are not to preach to any as pastors, but to such as ye know are already converted, according to my revealed intention and will.’ M. Hooker seeing this addeth: ‘But if M. Rutherford mean that the Church doeth of purpose receive them into the Church to be converted, then it is cross to his own tenet, and a person may be received to the seals of the covenant, who doeth not notify that he hath faith, nay the Church may receive them to the seals, whom she knoweth hath no right to the seals, for she knoweth they are not invisible members, which in Mr. Rutherford’s judgment only giveth them right.’ [Rutherford’s] Answer: It is not cross to my tenet, that a person, such as Demas and Magus may be received to the seals, and yet they doe not notify [that] they have saving faith and internal conversion, for my tenet is that the Church can only judge of visible walking and profession in point of admission or not admission to seals, and in that point the Church hath nothing to do to judge whether they have faith-saving or not; none can partake savingly of the seals for their own personal salvation and without sin, but these only who have saving faith, but the Church may admit without sin multitudes, who eat and drink their own damnation, 1 Cor. 11:26-27, and yet pass no sentence of signs notifying faith or no faith, internal conversion or no internal conversion upon them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), Book 1, Ch. 8, pp. 34-35</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d575ae87c3" data-kw="">
<blockquote><p>Regarding the baptism of infants, we have stated our case sufficiently and more: we consider it nothing else than the holy washing of regeneration. Yet at the same time, we do not suppose that our salvation depends upon the sacrament of baptism, but upon our adoption according to the covenantal formula: “I will be your God and that of your seed.” [Gen. 17:7] We diligently attend to this adoption in the children of the saints according to the Word of the Lord since it has been sealed upon them through the sacrament of baptism… …little corruptions have arisen from no other source than from the understanding that baptism is necessary for salvation, which we consider entirely false. We hold this view to be false because adoption by God must take place before anyone can be baptized rightly. Otherwise why is a confession of faith required of adults before they are baptized?… …those children whom (we claim) the Lord has already truly adopted before, according to the covenantal formula, are introduced into the outward company of the church through baptism. Thus we leave the hidden judgments to God, just as we should.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Clear &amp; Simple Treatise on the Lord’s Supper</cite>, (1559, RHB, 2016), p. 146-7</span></figcaption>

<blockquote><p>We reject the opinion of certain Ubiquitarians [Lutherans], who connect the regenerating power of the Holy Spirit in such a way with the external water in baptism that either it must exist in the water itself or at least can inchoate [begin] regeneration only in the very act of baptism, for this opinion is at variance with all those passages of Scripture in which faith and repentance, and therefore both the root and seed of regeneration, are demanded as a prerequisite in those who are to be baptized.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, … (Leiden, 1625), 44.27</span></figcaption>

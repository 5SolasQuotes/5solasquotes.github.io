<main class="wrap"><figure class="quote" id="q-c6dad495f3" data-kw="">
<blockquote><p>And what shall we say to this; that without this Doctrine, due honour cannot be given to God, nor our faith made stable? For by the Doctrine of Predestination, that immeasurable heap of the goodness and love of God towards us, by which he loved us and respected us, before the foundations of the world were laid, doth enter into our minds. Also whatsoever light or grace God doth measure to us, is acknowledged to be a river flowing from that eternal love. By this doctrine man’s merits do fall to the ground; and the imaginary faculty of free-will in things pertaining to salvation, doth vanish away. The confidence of our salvation will also stagger, unless it be upholden by the immutable decree of God, and not by man’s free-will.

This doctrine also is a great lightning of our sorrows, and mitigation of all bitterness: while we consider that all things, even those that are most grievous, turn to the good of them, who are called by the purpose of God. Neither is there any more forcible instigation to good works, than the acknowledgement of that eternal love, wherewith God, in Christ, hath loved us before all worlds. Finally, by this doctrine we are taught to search into our selves and to try our own consciences, to find in us, and to stir up the testimonies of our election; knowing that our own endeavour and care ought to further the election of God, and that by the way of hell, that is by impenitency and unbelief it is impossible to come to heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism: Or, The Opening of the Controversies of These Times (Formerly Handled in the Low-Countries) Concerning the Doctrine of Providence, of Predestination, of the Death of Christ, of Nature and Grace, &amp;c</cite>, (1619; London: Nathanael Newbery, 1635), 2, p. 4.</span></figcaption>

</figure><figure class="quote" id="q-3e2f114643" data-kw="">
<blockquote><p>III. The third article [of difference between the Reformed and Lutherans] is that concerning predestination, which began to be controverted after Luther’s time, perhaps on the occasion of certain theologians who, asserting gratuitous predestination, sought out the mode and order of the signs of reason and of the divine acts perhaps more deeply than sacred Scripture, and than was fitting; and they use harsher forms of speaking. I plainly think that it can be explained in that mode and order according to the Scriptures, Augustine, and the article of our [Anglican] Church, as the late most reverend [John] Overall [d. 1619] explained it, so that I may easily hope that the more moderate Lutherans can be brought to our opinion, especially if they will not refuse to stand by Luther’s tenets in his book On the Bondage of the Will against Erasmus, and in his Annotations on the 9th chapter of Romans. From what has been said, it can be somewhat established that the Reformed Churches [including Lutherans] do not dissent in the fundamentals of faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Reformed Churches do not Dissent</cite>, … ed. Seth Ward trans. AI (d. 1643; Gallibrand, 1658), pp. 152-53</span></figcaption>

aith" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-bb12d423be" data-kw="">
<blockquote><p>Upon this ground of difference and distinction between man and man, we may well be admonished to beware of the error of some divines, who thus define of God’s will touching man’s estate; they say it is the first will of God, that every man in the world should be saved, if they would, and therefore (say they) he ministers unto them all helps both of nature and grace, whereby they may repent and believe if they will. And having laid down this his first will, he then (say they) foresees that some men will not believe, nor persevere in the faith: and hereupon it is (in their conceit) that he will not know some men for his own.

Again, foreseeing that others will believe and persevere in faith, them he knows and acknowledgeth to be his; dealing herein like unto a good father that hath many sons, who would have them all to do well, and to have each one a good portion; but yet seeing that some will not become frugal and obedient, he changeth his mind, and doth disinherit them: or like unto a good Prince, who would have all his subjects to do well; but seeing some to be rebels, he is of another mind, and willeth their death.

Answ. But this opinion is a mere invention of man’s brain; for whereas they say, that God by a second act of his will acknowledgeth some for his own, and not others, upon the foresight of their faith and unbelief, whereas by his first will he would have all men to be saved, it is not true; for the first will of God, is to know some, and not to know others: the ground whereof, is his good pleasure alone, and no foreseen works in them. And therefore it cannot be, that he should will all men to be saved equally, Cain as well as Abel, Judas as well as Peter. Again, their opinion confutes it self, for God foresees men’s faith and unbelief, because he hath decreed the same, and his decree depends upon his own will alone: and therefore unless we make the same thing in the same respect, both the cause and the effect, we cannot make foreseen works the ground of difference between man and man.

Then their comparisons are not fit: a father would have all his children to do well, and to enjoy his portion: true; and more then that, he would make all his children to do well, if it lay in his power; neither would he disinherit any, if it lay in his power to make them good: the change of his purpose in disinheriting his son, ariseth upon the impotency of his will, that cannot do that he would. And the same must be said of the will of Princes toward their subjects: but if their should be such a will in God to have all men saved, if he could save them; then undoubtedly all men should be saved, for who hath resisted his will? nay, whatsoever the Lord willeth, that doth he in heaven, in earth, and every where, Dan. 4. 32.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), pp 527-28.</span></figcaption>

Then their comparisons are not fit: a father would have all his children to do well, and to enjoy his portion: true; and more then that, he would make all his children to do well, if it lay in his power; neither would he disinherit any, if it lay in his power to make them good: the change of his purpose in disinheriting his son, ariseth upon the impotency of his will, that cannot do that he would. And the same must be said of the will of Princes toward their subjects: but if their should be such a will in God to have all men saved, if he could save them; then undoubtedly all men should be saved, for who hath resisted his will? nay, whatsoever the Lord willeth, that doth he in heaven, in earth, and every where, Dan. 4. 32.”

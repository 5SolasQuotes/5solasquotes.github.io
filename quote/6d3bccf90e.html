<blockquote><p>It was agreed on both sides, that the Law was from God, and that the Prophets spake by the inspiration of the Holy Ghost; all that was now left was only to find out the true meaning of them, and to compare Prophecies with events. As in the case of the Messias, if the circumstances foretold by the Prophets had their exact accomplishment in Christ, as might appear to those who carefully compared them; If he were born at Bethlehem, of the Tribe of Judah, when the Scepter was departed from it, and during the second Temple, and all other circumstances agreeing; then though the ordinary judgement concerning true Prophets belonged to the Sanhedrin, yet it was far more reasonable to believe that they were mistaken, than that all the Prophecies should be accomplished in a person that was not the true Messias.

For those Prophecies were not intended only for the Priests and Rulers, but for directions to the People, that they might be able to judge of the accomplishment of them: otherwise when the Authority of the Jewish Church condemned our Saviour, the People could have no reason to believe him to be the Messias; if they were bound in the sense of Scripture to submit their judgement wholly to the Church’s Authority. It is plain then, that the sense of Scripture may be so evident to private capacities, that they are not to submit in it to the present Authority of a Church. For notwithstanding all the promises made to the Jewish Church, and the command of submitting to the sentence of their Priests and Rulers, in a matter of the highest concernment, viz. concerning the true Messias, men were bound to believe directly contrary to the present Authority in the Church.

For the people were bound to believe Christ to be the true Messias; although the High Priest and Elders had condemned him for a deceiver and malefactor. But besides this particular case, there may be several others wherein men may lawfully reject the Authority of the present Church; and those are, when that Authority shall go about to overthrow those things which must be supposed antecedent to the belief of any such Authority: as, 1. The common sense of mankind. 2. The force of a divine Law. 3. The liberty of judgement concerning truth and falsehood. All these must necessarily be supposed before any Authority of a Church; but if any Church goes about to overthrow these, it thereby forfeits its own Authority over men.

1. If it requires things contrary to common sense; as in that instance wherein some of the Jewish Rabbis required submission to their Authority, viz. in believing the right hand to be the left, or the left to be the right, if they determined so; or supposing the Jews to have required the people to deny that they ever saw any Miracle wrought by Christ; or in the Miracle of the Loaves, that what they saw and handled, and tasted, to be bread was true bread; or to say, that the same individual body might be in a thousand places at once, or that things whose nature it is to be in another, can subsist without their proper subject; what Church soever requires such things as these from its members to be believed, gives them just reason to reject its Authority.

2. If it requires things contrary to the force and reason of a divine Law: as the Jews themselves would have acknowledged, if any Authority among them had gone about either to have left out the second Commandment, or made it lawful to give Religious worship to Images, under any distinctions whatsoever: or if the Priests had taken away from the people their share in the sacrifices, under pretence of the unsanctified teeth, or the long beards of the Laity, which were not fit to touch what had been offered in sacrifice to God. But we need not put cases among them, for our Saviour therefore bids men have a care of the leaven of the Scribes and Pharisees, because by their traditions they made the Commandment of God of none effect: as in their Corban, if they made a vow to God they thought themselves excused from relieving their Parents; and in this way our Saviour generally deals with them, shewing that though they pretended to keep the letter of the Law; yet by their corrupt additions and false glosses they overthrew the scope and design of it: which he thought sufficient reason to reject their Authority; and therefore when he bids his Disciples, observe and do whatsoever the Scribes and Pharisees bid them; it must be supposed to be only while they keep to the letter and reason of the Law; for if he had intended an absolute obedience, he would never elsewhere bid his Disciples beware of their Doctrine.

3. If it takes away all liberty of judgement concerning truth and falsehood in Religion. For this is a natural right which every man hath to judge for himself: and they that take this away, may as well command all men to put out their eyes, that they may better follow their Guides. But the other is so much worse, because it is an assault upon our understandings, it is a robbing us of the greatest talent God hath committed to our management, it is a rape upon our best faculties, and prostituting them to the lusts of Spiritual Tyrants; it is not captivating our understandings to the obedience of faith, but enslaving them to the proud and domineering usurpations of men; wherein they would do by us as the Philistines did by Sampson; they would put out our eyes, that we might grind in their prison, and make them sport. I would not be mistaken, it is the liberty of judgement I plead for, and not of practice; that may be justly restrained by the Laws of the Church, where the other is allowed; because the obligations to peace and unity are different from those to faith and inward assent.

And that no absolute submission of judgement could be required by the Law of Moses, notwithstanding the command of outward obedience in the cases mentioned, Deut. 17. 8, 9, &amp;c. is most evident from hence, because that Law makes provision for a sin-offering in case the whole Congregation of Israel sin through ignorance, and the thing be hid from the eyes of the Assembly, or Supreme Council, and they have done something against the commandment of the Lord: which had been a Law made to no purpose, if it had been impossible for their chief Authority to have erred or been mistaken in their judgement. From hence we see St. Paul had great reason to appeal from the High Priest and Elders to the Law and the Prophets, because they were subject to error and mistake, but these are not.</p></blockquote>

<blockquote><p>We are constrained by the care of government which we have undertaken to extend vigilantly the solicitude of our office, and to instruct the minds of our brethren by addresses of admonition, that no wrongful presumption may avail to deceive the ignorant, nor any dissimulation to excuse those who know, lie it known then to your Fraternity that John, formerly bishop of the city of Constantinople, against God, against the peace of the Church, to the contempt and injury of all priests, exceeded the bounds of modesty and of his own measure, and unlawfully usurped in synod the proud and pestiferous title of oecumenical, that is to say, universal. When our predecessor Pelagius of blessed memory became aware of this, he annulled by a fully valid censure all the proceedings of that same synod, except what had therein been done in the cause of Gregory, bishop of Antioch, of venerable memory; taking him to task with most severe rebuke, and warning him to abstain from that new and temerarious name of superstition; even so as to forbid his deacon to go in procession with him, unless he should amend so great a wickedness… we once and again addressed the same most holy John by letter, bidding him relinquish that name of pride, and incline the elation of his heart to the humility which our Master and Lord has taught us. And having found that he paid no regard, we have not desisted, in our desire of concord, from addressing the like admonitions to our most blessed brother and fellow-priest Cyriacus, his successor. But since it is the case, as we see, now that the end of this world is near at hand, that the enemy of the human race has already appeared in his harbingers, so as to have as his precursors, through this title of pride, the very priests who ought to have opposed him by living well and humbly, I exhort and entreat that not one of you ever accept this name, that not one consent to it, that not one write it, that not one admit it wherever it may have been written, or add his subscription to it; but, as becomes ministers of Almighty God, that each keep himself from this kind of poisoned infection, and give no place to the cunning lier-in-wait, since this thing is being done to the injury and rendering asunder of the whole Church, and, as we have said, to the contemning of all of you. For if one, as he supposes, is universal bishop, it remains that you are not bishops.</p></blockquote>

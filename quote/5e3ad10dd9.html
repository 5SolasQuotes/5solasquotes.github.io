<blockquote><p>13th Problem: Whether in this method the proof or consequence from effect to cause, or from works to the maker, which they commonly call the way of causality with the saying of Dionysius the Areopagite, and the proof from the book of nature, makes a part and indeed the principal one. I respond in the affirmative, and it is proven: 1. By the authority and example of the Holy Spirit: Rom. 1:19-20; Acts 14:15-17, 17:27-28; Ps. 8:2-4 &amp; 19:1-3, etc., Job 38-39, Isa. 40:21-22, 26; Jer. 10:10-11. These passages should be carefully considered, in which you will hear God himself, the prophets and the apostles disputing by this method. Secondly, this method is defended against all objections, as can be seen among the scholastics on [Thomas’s Summa,] pt. 1, quest. 2, articles 2-3. Thirdly, it has been felicitously employed and applied thus far by all the wise men of all ages. Those who object to this method today are one or another inept petty philosopher, or certain idle Athenians eager for novelty (Acts 17), or men who are scarcely semi-literate, especially in metaphysics and natural theology, to the point that they have never even learned the terms or heard of them in conversation. But there are those who have already exposed, and will further expose, the ineptitudes and vertigos of those men. Meanwhile, on this occasion, let the following be considered and compared: 1. From the Fathers: Lactantius, bk. 1, ch. 2; Eusebius, bk. 1 of Preparation for the Gospel; Theodoret’s Discourses on Providence, and On the Cure of Greek Affections, oration 3; the aforementioned Dionysius the Areopagite, On the Divine Names, ch. 17; John of Damascus, bk. 1, On the Orthodox Faith, ch. 3. 2. From the Scholastics: Thomas Aquinas, Opusculum 6 and bk 1, Against the Gentiles, chs. 12-13, and Summa, pt 1, quest. 2, articles 2-3, with Cajetan and other commentators. [Peter Lombard] The Master of the Sentences, bk. 1, distinct. 3, and all his commentators there. 3. From the natural theologians and antagonists of the atheists, Epicureans, gentiles, etc.: Savonarola in The Triumph of the Cross, bk. 1, ch. 6; Raymond of Sabunde in his Natural Theology (which was translated into French by Michel de Montaigne), ch. 1; Steuchus in The Perennial Philosophy, bk. 7, ch. 22; Luis Vives, On the Truth of the Christian Religion, bk. 1, ch. 9; Mutius Pansa in The Kiss of Christian &amp; Pagan Philosophy; Mornay, On the Truth of the Christian Religion, chs. 1, 11-12; Thomas à Jesu, On Procuring the Salvation of the Gentiles, bk. 11, chs. 6 &amp; 8; Possevinus, bk. 10 of the Select Library, ch. 2, sect. 414; Charron, bk. 1 of Truth, chs. 6-7; Pierre Du Moulin in his little book On the Knowledge of God; Alsted in his Natural Theology; Grotius in his book On the Truth of the Faith; Guillaume de Rebreviettes in his Atheomastix. Add also the French tracts against the atheists: Alexandre Cappe’s in duodecimo; Baruch Canephe’s Atheomachus in octavo; the three tracts of Infanticus, Hotman, where in the first On Providence, ch. 2; And the English ones: Smith’s The Quiver Against the Atheists, which was published together with his sermons; John Weemes of Lathokar in his tract, On the Four Degenerate Sons; Meredith Hanmer in his Atheomastix, Tract 1. 4. From the writers of common places, at least those who are intimately known to me or currently at hand: Philip Melanchthon, Wolfgang Musculus, John Calvin, Peter Martyr Vermigli, Andreas Hyperius, Stephen Szegedinus, Lambert Daneau, Daniel Tilenus, Amandus Polanus, in the common place on God. Compare also the same authors in the common place on Providence, and other writers who have defended providence ex professo, such as Leonard Lessius, Against the Atheists; Andreas Gorrutius, On Providence; Ulrich Zwingli, On Providence. 5. From the commentators on the aforementioned passages of Scripture: Juan de Pineda, Cornelius a Lapide, Juan de Lorinus, Andrew Willet, André Rivet, David Pareus, etc. 6. From preachers, practical and ascetic writers: Bonaventure in The Mind’s Journey to God; Robert Bellarmine, On the Ascent of the Mind to God, etc.; Jean Taffin, On the Amendment of Life; John Preston in his sermon on 1 Thess. 1. 7. From the metaphysicians: Francisco Suárez and others commonly. 8. From learned jurists, politicians, physicians, philologists: Innocent Gentillet in his Anti-Machiavel, pt. 2, axiom 1; Justus Lipsius in his letter to Berchemius; Hugo Grotius, On the Truth of the Christian Religion; Christoph Besold in his Specimen of Common Places, pt. 2, pp. 19 &amp; 363 in the 16mo edition; François Vallès, ch. 58, Philosophical Sacred 9. 9. From the heterodox or suspect, the above-mentioned Arminius and Vorstius, especially Volckelius the Socinian in Institutions, bk. 1, chs. 2-5; John Trithemius in the book, Eight Questions, question 8 which is about providence. 10. From the Gentiles, such as Aristotle bk. 8 of Physics, Sextus Empiricus, Maximus of Tyre, dissertation 1. See many others cited by Plessis, ch. 2; 12 Against the Mathematicians, pp. 317, 319. Cicero, bk. 2, On the Nature of the Gods. Seneca, On Providence. Galen, bk. 3, On the Usefulness of Parts, which illustrious passage Beza described in the notes to Rom. 1:19. 11. From the Jews, Maimonides in The Constitution on the Fundamentals of Law, ch. 1.</p></blockquote>

<blockquote><p>…the Fifth Way, at least as developed by later Thomists, does indeed plausibly get us to a divine intelligence. By contrast, Paley’s argument is often acknowledged to get us at best to a designer who is extremely powerful and and intelligent, but who for all we know may yet be finite and, thus non-divine. But it is not just that Paley’ s designer may be something other than God as Aquinas understands Him. There is reason to think that Paley’s designer could not be God as Aquinas understands Him. For Aquinas, when we predicate attributes of God, we necessarily do so analogously rather than univocally. But Paley is evidently predicating attributes to his designer and to us in a univocal way, which (for the Thomist at least) entails a radically deficient conception of God.</p></blockquote>

<blockquote><p>What! is not natural theology the very basis and foundation of revealed? nor without the former can the latter be at all supported. For the instructions we receive from nature want [lack] no further proof, they are in themselves perfectly evident, we are born with them, they are deeply wrought into our frame as rational beings, nor can they be rejected by any, but such as are quite destitute of an intelligent principle; bit revelation, being contained in particular books, must be confirmed by the test of truth, before we can receive it, and it cannot be proved by any principles except such as are derived from the light of nature. For how can I be certain that what God has revealed is credible, unless I have first learned from the light of nature that He is a being of veracity, and therefore cannot possibly deceive me? How can I be sure that this or that revelation derives its origin from the Deity, unless the light of nature has first taught me to know what is worthy and what unworthy of God, and consequently what are the proper characters of a divine revelation? How can I be prevailed with to pay any tribute of adoration to the deity, to discharge certain duties to Him, to cultivate a sense of piety and virtue, unless I have previously learned my duty from the light of nature what I am to understand by an obligation, and the original from which it is derived, and been instructed in the difference betwixt justice and injustice, betwixt piety and impiety? For if justice and injustice are nothing, if virtue is nothing but a word, as it is expressed by the poet, and there is no such thing as a natural obligation, then no revelation can compel me either to avoid or pursue any particular course of action. Wherefore our natural sentiments of things are to be laid down as the principles of all our other knowledge. It is a very just thought of Tertullian that: ‘the Deity has sent nature before as our guide, and afterwards favored us with prophesy, that it might obtain the more easy belief from the person qualified to receive it by the instructions of nature.’ (Of the Resurrection of the Body, ch. 12) But as in recognizing the authority of revelation, so in investigating the sense of it, and settling controversies, we must perpetually have recourse to natural theology. Nor can we possibly give our assent to any thing, as a divine revelation which contradicts the light of nature. Wherefore if any doctrine is attempted to be imposed on us as a revealed truth, which is inconsistent with natural theology, we are on that very account to be absolutely certain that it is an imposture, or at least to try if the passages which seem to contain such a doctrine will bear a construction which will remove the inconsistence, for it is impossible that God can contradict Himself. Thus when the Anthropomorphite asserts that the Deity is possessed of a human form, because the Scripture speaks of his face, his eyes, his ears and arms; natural theology at once convinces us of the delusion, teaching us that God is a being absolutely perfect, and therefore must of consequence be immaterial. … The Scripture itself appeals to these natural perceptions wwe have of the attributes of the supreme Being, and points out to us their great importance and excellence. Thus in the place quoted above from the nineteenth psalm, and in many others of the psalms and prophets, the greatness, wisdom, power and goodness of the Deity are demonstrated from his works. Agreeable to this, Job 12:7-9: ‘But ask now the beasts, and they shall teach thee, and the fowls of the air, and they shall tell thee; or speak to the earth, etc. who knows not that in all these, the hand of the Lord has wrought this?’ In like manner when God complains of the ingratitude and corrupt morals of the people of Israel, as in Isa. 1, 5; Mic. 6 and in a variety of passage of Scripture, He condemns them by appealing to no other principles than the natural perceptions they had of the duties they owed to Him–And when Christ or his apostles endeavor either to prove the truth of their doctrine, or to refute those who had fallen into mistakes with respect to it; when they either blame their disciples, or exhort them to the discharge of any duty, they continually have recourse to the light of reason, or to natural principles–‘Judge not according to the outward appearance, but judge right judgment,’ Jn. 7:24. I speak to those who have understanding, judge ye what I say,’ 1 Cor. 10:15. And on such occasions the Scripture not only appeals to our natural sentiments, but points out the particular ends for which they were implanted in us, and in what manner we are to make the best use of them. The Scripture declares that the works of nature are an immediate declaration made by God Himself of his parental regard and gracious intentions towards all nations, ‘sending fruitful seasons, and filling their hearts with food and gladness.’ (Acts 14:17) It asserts that the whole of God’s providential care, more especially in those dispensations which respect mankind, is expressed with an immediate view, ‘that men may seek the Lord, if haply they might feel after Him, and find Him’ (Acts 17:25-27) It declares that what may and ought to be known of God is made manifest to all nations; and likewise that ‘the invisible things of God, may be seen from his works, and are placed as it were before our eyes, even his eternal power and godhead;’ and that so great is the brightness of the light of nature, that they who do not give proper attention to it, and glorify God, and praise Him for his goodness, are altogether without excuse; Rom. 1:19-21. It says that these are the riches of his goodness, and forbearance and long suffering, by which God leads us to repentance, Rom. 11:4. It says that our natural sentiments, with respect to the several duties of life, supply the place of a revealed law, ‘that they who have not the law are a law unto themselves, having the work of the law written in their hearts.’ (Rom. 11:14-15) Nor does Christ hesitate to affirm that in the rule which right reason has prescribed to every people, which is, that ‘we should do unto another, what we wish should be done unto ourselves, is contained in the law and the prophets;’ (Mt. 7:12). the strength and excellence of these [Biblical] encomiums on natural revelation cannot be exceeded by anything that can be said on the subject.</p></blockquote>

shall+tell+thee%3B+or+speak+to+the+earth%2C+etc.+who+knows+not+that+in+all+these%2C+the+hand+of+the+Lord+has+wrought+this%3F%E2%80%99+In+like+manner+when+God+complains+of+the+ingratitude+and+corrupt+morals+of+the+people+of+Israel%2C+as+in+Isa.+1%2C+5%3B+Mic.+6+and+in+a+variety+of+passage+of+Scripture%2C+He+condemns+them+by+appealing+to+no+other+principles+than+the+natural+perceptions+they+had+of+the+duties+they+owed+to+Him%E2%80%93And+when+Christ+or+his+apostles+endeavor+either+to+prove+the+truth+of+their+doctrine%2C+or+to+refute+those+who+had+fallen+into+mistakes+with+respect+to+it%3B+when+they+either+blame+their+disciples%2C+or+exhort+them+to+the+discharge+of+any+duty%2C+they+continually+have+recourse+to+the+light+of+reason%2C+or+to+natural+principles%E2%80%93%E2%80%98Judge+not+according+to+the+outward+appearance%2C+but+judge+right+judgment%2C%E2%80%99+Jn.+7%3A24.+I+speak+to+those+who+have+understanding%2C+judge+ye+what+I+say%2C%E2%80%99+1+Cor.+10%3A15.+And+on+such+occasions+the+Scripture+not+only+appeals+to+our+natural+sentiments%2C+but+points+out+the+particular+ends+for+which+they+were+implanted+in+us%2C+and+in+what+manner+we+are+to+make+the+best+use+of+them.+The+Scripture+declares+that+the+works+of+nature+are+an+immediate+declaration+made+by+God+Himself+of+his+parental+regard+and+gracious+intentions+towards+all+nations%2C+%E2%80%98sending+fruitful+seasons%2C+and+filling+their+hearts+with+food+and+gladness.%E2%80%99+%28Acts+14%3A17%29+It+asserts+that+the+whole+of+God%E2%80%99s+providential+care%2C+more+especially+in+those+dispensations+which+respect+mankind%2C+is+expressed+with+an+immediate+view%2C+%E2%80%98that+men+may+seek+the+Lord%2C+if+haply+they+might+feel+after+Him%2C+and+find+Him%E2%80%99+%28Acts+17%3A25-27%29+It+declares+that+what+may+and+ought+to+be+known+of+God+is+made+manifest+to+all+nations%3B+and+likewise+that+%E2%80%98the+invisible+things+of+God%2C+may+be+seen+from+his+works%2C+and+are+placed+as+it+were+before+our+eyes%2C+even+his+eternal+power+and+godhead%3B%E2%80%99+and+that+so+great+is+the+brightness+of+the+light+of+nature%2C+that+they+who+do+not+give+proper+attention+to+it%2C+and+glorify+God%2C+and+praise+Him+for+his+goodness%2C+are+altogether+without+excuse%3B+Rom.+1%3A19-21.+It+says+that+these+are+the+riches+of+his+goodness%2C+and+forbearance+and+long+suffering%2C+by+which+God+leads+us+to+repentance%2C+Rom.+11%3A4.+It+says+that+our+natural+sentiments%2C+with+respect+to+the+several+duties+of+life%2C+supply+the+place+of+a+revealed+law%2C+%E2%80%98that+they+who+have+not+the+law+are+a+law+unto+themselves%2C+having+the+work+of+the+law+written+in+their+hearts.%E2%80%99+%28Rom.+11%3A14-15%29+Nor+does+Christ+hesitate+to+affirm+that+in+the+rule+which+right+reason+has+prescribed+to+every+people%2C+which+is%2C+that+%E2%80%98we+should+do+unto+another%2C+what+we+wish+should+be+done+unto+ourselves%2C+is+contained+in+the+law+and+the+prophets%3B%E2%80%99+%28Mt.+7%3A12%29.+the+strength+and+excellence+of+these+%5BBiblical%5D+encomiums+on+natural+revelation+cannot+be+exceeded+by+anything+that+can+be+said+on+the+subject.%E2%80%9D%0A%0A%E2%80%94+Jean-Alphonse+Turretin%2C+Dissertations+on+Natural+Theology+tr.+William+Crawford+%28d.+1737%3B+Belfast%3A+Magee%2C+1777%29%2C+Theses+concerning+Natural+Theology+in+General%2C+pp.+12-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F89807cb19b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/89807cb19b.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-light-of-nature/#:~:text=What%21%20is%20not%20natural%20theology%20the,can%20be%20said%20on%20the%20subject&amp;text=What%21%20is%20not%20natural%20theology%20the%20very%20basis&amp;text=anything%20that%20can%20be%20said%20on%20the%20subject" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-45d4a14433" data-kw="">
<blockquote><p>24. Applicatory works of grace are either external or internal. 25. External ones are both calling through the Word, partly of Law, partly of gospel, and the sealing of those called through sacraments. 26. Calling through Law is prior, and that partly imperative of obedience, partly declarative of sanction, both promissory and comminatory. … 29. Calling through nature to God the Creator is broader; calling through the Word to God the redeemer is stricter. 30. Universal calling to salvation neither was, nor is, nor will be. 31. That hope of special mercy is shown in nature, or that this is the instrument of gospel-calling, is false, nor can this be said without nature being established as a herald of grace.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-5a0e2e650e" data-kw="">
<blockquote><p>As we see from the Westminster Confession and the 1689 Baptist Confession the Puritans… followed Calvin in resisting false human rationalisations. For instance they resisted the idea that God only loves the elect and hates the non-elect. This error is called hyper-Calvinism. It is a very serious error which is recurring today. The Puritans… believed in the universal love of God for all mankind (1 Tim 2:1-6; 2 Peter 3:9).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erroll-hulse.html">Erroll Hulse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Example of the English Puritans” (Reformation Today 153, Sept/Oct 1996)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d58b909713" data-kw="">
<blockquote><p>Goodness is the very opposite of harshness, cruelty, gruffness, severity, mercilessness–all of which are far removed from God. How unbecoming it is to have such thoughts about God! Such sinful emotions are found in man. The goodness of God, on the contrary, is the loveliness, benign character, sweetness, friendliness, kindness, and generosity of God. Goodness is the very essence of God’s being, even if there were no creature to whom this could be manifested. “The good LORD pardon every one” (2 Chr.30:18); “Good and upright is the LORD: therefore will He teach sinners in the way” (Psa. 25:B); “There is none good but one, that is, God” (Mat. 19:17). From this goodness issues forth lovingkindness and an inclination to bless His creatures. This is to the astonishment of all who take note of this, which explains why David exclaims twenty-six times in Ps. 136, “For His Mercy endureth for ever.” In the following texts we read likewise. “Also unto Thee, O Lord, belongeth mercy” (Psa. 62:12); “All the paths of the LORD are mercy” (Psa. 25:10). From goodness and benevolence issues forth the doing of that which is good. “Thou art good, and doest good” (Psa. 119:68); “Rejoice the soul of Thy servant: and attend unto the voice of my supplications. For Thou Lord, art good, and ready to forgive; and plenteous in mercy unto all them that call upon Thee” (Psa. 86:4, 6, 5). This goodness is of a general nature in reference to all God’s creatures, since they are His creatures. “The LORD is good to all: and His tender mercies are over all is works” (Psa. 145:9); “The earth is full of the goodness of the LORD” (Psa. 33:5); “For He maketh His sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust” (Mat. 5:45). The goodness which is of a special or particular nature as it relates to God’s children is thus expressed: ‘Truly God is good to Israel, even to such as arc of a clean heart” (Psa. 73:1); “The LORD is good unto them that wait for Him, to the soul that seeketh Him” (Lam. 3:25). This goodness of God is the reason why a believer, even after many backslidings, is motivated by renewal to return unto the Lord. “The children of Israel shall return… and shall fear the LORD and His goodness” (Hosea 3:5); “But I have trusted in Thy mercy” (Psa. 13:5). This is why they call the Lord “the God of my mercy” (Psa. 59:10, 17) . In this goodness they rejoice and this goodness they magnify. “I will sing of the mercies of the LORD for ever” (Psa. 89:1); “Praise ye the LORD. O give thanks unto the LORD; for He is good: for His mercy endureth for ever” (Psa. 106:1).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service, trans. Bartel Elshout (Soli Deo Gloria, 1992)</cite>, 1:122-23</span></figcaption>

<blockquote><p>the entire history of the human race, from the apostasy to the final judgment, is a dispensation of forbearance in respect to the reprobate, in which many blessings, physical and moral, affecting their characters and destinies forever, accrue even to the heathen, and many more to the educated and refined citizens of Christian communities. These come to them through the mediation of Christ, and coming to them now, must have been designed for them from the beginning.</p></blockquote>

<blockquote><p>Common grace is great and undeserved mercy to a sinner, and would save him if he did not resist and frustrate it. In and by it, ‘God commandeth all men everywhere to repent,’ and whoever repents will find mercy… Scripture denies that God is under obligation to follow up his defeated common grace with his irresistible special grace. It asserts his just liberty to do as He pleases in regard to imparting that measure of grace which produces the new birth, and makes the sinner ‘willing in the day of God’s power.’… God sincerely desires that the sinner would hear his outward call, and that his common grace might succeed with him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvinism: Pure &amp; Mixed (NY: 1893)</cite>, ch. 5, pp. 48-51</span></figcaption>

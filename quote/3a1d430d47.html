<main class="wrap"><figure class="quote" id="q-3a1d430d47" data-kw="">
<blockquote><p>But sometimes even the wise of this world appear to devote themselves to some of the virtues. For you notice that many have charity, observe mildness, practice exterior goodness toward all. Yet they display these virtues not to please God but men. Accordingly, they are not really virtues at all since they do not strive to please God. Nevertheless, a pleasant odour reaches people’s noses when they think that these so-called virtues confer a good reputation.

But if these were to be compared to the true odour of our Redeemer, they would be compared to the truly true virtues, and it would be said: The odour of your ointments surpasses all perfumes [Song 1:2a]. That is, “The aroma of your virtues is superior to every pretence of virtue possessed by the wise of this world precisely because by its truth it transcends their concocted facades of virtue.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gregory-the-great.html">Gregory the Great</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Exposition</cite>, on the Song of Songs (594-98), 17, trans. Mark DelCogliano (Collegeville MN: Liturgical Press, 2012), pp 121-22.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life.html">The Christian Life</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d7a94b00e0" data-kw="">
<blockquote><p>Things inconvenient, even in matters of religion, may be commanded in some cases: as when it is to redeem a far worse inconvenience. For of two evils of punishments, the magistrate may take the less as well as any other private man. And if that subjects, to prevent worse inconveniences, may use inconvenient ceremonies, then may the Magistrate, to prevent worse inconveniences, command inconvenient ceremonies. If the apostles may use the inconvenient Jewish ceremonies, then the apostles may enjoin for a time the use of inconvenient ceremonies: as they did make ordinances about things which yet they called burdens, Acts 15. (Circumcision was a burden, Acts 15:10, and these burthens were necessary things, v. 28, and they were said to do well if they observe them, v. 29.) And Moses may make an ordinance about the use of a bill of divorcement, which yet was a grievous inconvenience to redeem a worse inconvenience. But if magistrates do appoint inconvenient things, and burden the Church with them, when there would be no great inconvenience to the Church if such things were not, then such magistrates must give their account to Christ for so doing; but yet the people are bound to obey still, because we cannot be freed from our subjection laid upon us by God, except it appear to us that they command not only an inconvenience, but a sin, as all sound divines confess.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 &amp; 2 Peter</cite>, (London, 1637), on 1 Tim. 2:13, pp. 434-35</span></figcaption>

</figure><figure class="quote" id="q-59fe7daeaa" data-kw="">
<blockquote><p>It is permitted to the expectants [students for the ministry], having entered before upon the public exercise or prophesy [the elders’ conference], to sit by the ministers and elders in the meeting of the presbytery and to give their judgement of the doctrine, but they have no voice when matters of doctrine or discipline are debated. And in the handling of some matters which are thought fit to be concealed and kept secret till they be by common consent published, they are to be removed.</p></blockquote>

</figure><figure class="quote" id="q-ba1a071221" data-kw="">
<blockquote><p>The third consolation which Moses here describes is gladness at beauty bestowed — ‘Let the beauty of the Lord our God be upon us.’ Sorrow mars the countenance and clothes the body with sackcloth; but if the Lord will come to us and adorn us with his beauty, then the stains of mourning will speedily disappear. Brethren, what a beauty is this which the Lord giveth— ‘the beauty of the Lord our God!’ This comeliness is the beauty of his grace; for our covenant God is the God of all grace. If the Lord makes us to know that we are his our faces shine. If He fills us with his life and love, then brightness flashes from the eyes, and there is a grace about every movement. This ‘beauty’ means holiness; for holiness is the beauty of God. If the Holy Spirit works in you the beauty of holiness, you will rise superior to your afflictions. If this church shall be made the holier by its bereavements, we shall gain much by our losses. This beauty of the Lord must surely mean his presence with us. As the sun beautifies all things, so does God’s presence. When we know that Jesus is with us, when we feel that he is our helper, when we bask in his love, when he abides with us in power, this is the beauty of the saints. If we have Christ in us, Christ with us, we can bear any amount of trouble. ‘I can do all things, or can bear All suffering if my Lord be there.’ This beauty gives to the believer an attractiveness in the eyes of men: they perceive that we have been with Jesus, and they behold our faces shining like the faces of angels. It is a great thing when a Christian is so happy, so holy, and so heavenly that he attracts others to Christ, and people seek his company because they perceive that he has been in the company of the blessed Lord. God give you this, and if you have it, dear friend, you may forget your sorrows: they are transfigured into joy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-h-spurgeon.html">Charles H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Gladness for Sadness’ on Ps. 90:15-17</cite>, (Jan. 14, 1883) in Metropolitan Tabernacle Pulpit, vol. 29</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>To be precise, if we may consider frankly the actual system of virtue which Aristotle proposes, by which alone access to happiness is acquired, we will see that it is an arrogant supposition peddling the mere shadow of virtue, rather than that disposition of mind which comports with the human condition and its dependency on the most high God.</p></blockquote>

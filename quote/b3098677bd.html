<blockquote><p>Let us therefore go out of ourselves, as out of tabernacles of misery, and leave a large and open room for Him to enter, who is the fulness of infinite felicity. Next, if we consider Christ’s manner of entering; Christ enters into us, killing and giving life: killing our old nature, and begetting in us a new.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3a4fd6c2c2" data-kw="">
<blockquote><p>…but as for that which no hypocrite or unsound professor can attain to, a broken, hungry, self-deined heart, that Christ and his grace might enter and dwell there, oh, how harsh is it?… what shall they look for that despise the grace of the Gospel, and that offer which God has honored by so many miracles, and such abundance of sermons, and the powerful ministry of so many preachers? Beware of refusing such salvation, as being a more spiritual wickedness than any moral offense. Thirdly, its reproof to all cavillers that descant upon this free, plain and simple-hearted offer of God. Being urged to receive it, they answer so they would if they knew themselves elected. But (say they) we are afraid God means it us not. If we be chosen, we are sure to be called to believe it: if not, none of their preachers can give it us. It must be God (say they) and not man that must work our hearts and draw us. But, oh vain jangler, tell me, has not God revealed his will in his offer? Dost thou know his secrets? Is not his offer ingenuous? Say not in thine heart, ‘Who shall go up to Heaven or descend, etc? Lo, the Word is in thy mouth, it is neare thee.’ (Dt. 29:19) If Jeremiah in the dungeon had told Ebedmelech [Jer. 38] he knew not whether he meant to help him out or no, and so have refused to come out, had he not justly been left there still? So, when the Lord lets down the ladder of his offer, into thy dungeon, casts thee his cords and rags to put under thy armholes, that He may draw thee out, dost thou cavil and say, ‘Lord, I know not whether thou meanst me well or no; perhaps Thou wilt pull me out a little way, and then let me fall back again; perhaps I am not elected!’ Is not this a woeful dishonor to the simplicity of the offer? Was he ever tied at all to offer it? and dost thou distrust his ingenuous meaning in it? Thy blood be upon thy own head, in that thou choosest rather to smite the Lord to thy own destruction than to set thy foot in his ladder and put on his cords, that thou mightst come out! The way for thee is first to step upward that thou mayst come to the top than to leap to the top at first, to break thy neck backward.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-rogers.html">Daniel Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Catechism</cite>, ... (London: Norton, 1632), pt. 2, 4th Article, pp. 182-83</span></figcaption>

</figure><figure class="quote" id="q-618d4c692e" data-kw="">
<blockquote><p>Here you see how the waters of free grace rise higher and higher; an invitation is much, a promise of welcome is more; but the actual grants of mercy is most satisfying of all. Come on poor trembling soul, don’t be discouraged, stretch out the small weak arms of thy faith to that great and gracious Redeemer; open thy heart wide to receive Him, He will not refuse to come in; He has sealed thousands of pardons to as vile wretches as thyself; He never yet shut the door of mercy upon a willing, hungering soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>England’s Duty under the Present Gospel Liberty from Rev. 3</cite>, verse 20: wherein is opened the admirable condescension and patience of Christ in waiting upon trifling and obstinate sinners… (London: Wotton, 1689), sermon 7, doctrine 7, p. 244</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/means-of-calling.html">Means of Calling</a></span></div>

</figure><figure class="quote" id="q-1b30b2e0d5" data-kw="">
<blockquote><p>Hereby also the Lord allures the Laodiceans to repentance, showing that every time is meet for conversion and that God is evermore ready to receive sinners, and provokes them always that they should amend and live. And this matter he expounds in an allegorical and goodly speech taken out of the fifth chapter of the book of Canticles. For he fains the Lord to stand at the door and knock, yea and to promise to them that open the greatest familiarity and joys unspeakeable. First, therefore is declared the benevolence of God towards sinners and his most ready will always to receive the same, yea and his infinite study to move men to repentance [Rom. 2:4] that they might live. For the Lord stands at the door and knocks. The word of ‘standing’ does signify that God is always prepared, always watches over our salvation. For He sits not still, nor lies not on the one side like a sluggard: He stands busily to his work. And ‘I stand’ says He, not ‘I stood’, or ‘shall stand’: But ‘I stand’ evermore ready, evermore loving and gentle. What does He? He knocks, and that indeed at the door, desiring to be let in. For like as he that knocks at the door seriously covets to be let in: so God desires earnestly to be of us received. And God uses sundry kinds of knocking. For He warns and excites with his Word by the prophets, again by signs and wonders, and also by sundry chances and movings. These things may be seen in the city of Jerusalem. He sends to them his prophets and apostles. He shows diverse wonders. He brings on them sorrowful chances that they might admonish them: Such as are reported, Lk. 13, of the Galileans, and of those whom the tower of Siloh had overwhelmed. We may see the like at this day how the Lord knocks. Therefore He said truly, ‘Jerusalem, Jerusalem, etc.’ Mt. 23. These are doubtless the parts and doings of God which will not that a sinner should die, but rather convert and live. Then must we see what is required of us, verily that we should hear the knocking and noise of the Knocker, and that also we open and receive such as desire to come in. Here are they confuted which speak of man as though he were a block and image, ‘I know not what manner of drawing,’ sayng: ‘It is neither in the runner, nor in the willer, etc.’ Certain [persons] altogether abstain from well-doing, saying, ‘If I be chosen, it is enough.’ But the Scripture requires everywhere hearing and obedience. We know that the elect are only saved, and that the elect in Christ: In Christ to be they that believe: That faith is of hearing, hearing by the Word of God. Therefore says the prophet, ‘This day if you heare his voice. etc.’ [Ps. 95] This same is recited of the apostle, Heb. 4. The apostle also, 2 Tim. 2, ‘In a great house there be not only vessels of gold, but of earth also. If any purge himself, etc.’ And therefore the Lord says, ‘I knock’: It shall be thy part not to despise Him that knocks, but to open unto Him. And he recites indeed two things, [1] to hear, which both in the 8th and 9th of John is required of the children of God and of the true sheep: And [2] to open, that is to receive the Lord, or believe, to obey, and to frame themselves after the will of God and to do penance. Notwithstanding we must here beware, that we think not that man has power of himself to receive the Lord. The Lord illumines his elect, and by Him we can do all things, without whom we can do nothing. Other places must be conferred with this as Jn. 15; 2 Cor. 3; Phil. 2. They therefore that open, do open by the grace of God. They that open not being wrapped in their sins, through their own fault open not, and not through any fault of God. Let us hear moreover what the Lord promises to them that open, that is to say, to such as receive Christ with true faith. The Lord promises to them two things chiefly. First, ‘I will go into him’, says He. The scripture signifies that Christ dwells everywhere through faith in the hearts of the faithful and with a most straight knot to be joined unto them… And in the 14th chapter [of John] He says, ‘He that loves Me, will keep my Word: And my Father and I will come unto him, and will make abode with him.’ St. Paul says that he lives not now, but that Christ lives in him. [Gal. 2:20] The same affirms that Christ through faith dwells in the hearts of the faithful. And so the Lord enters the hearts of them that let Him in. Not the least part of felicity consists in this conjunction. For to be united with God is blessedness, which begins here, and is made perfect in another life. And therefore in the second place the Lord says: ‘And I will sup with him, and he with Me.’ Whereby he notes not only again a most dear friendship and familiarity (for the table is consecrated to amity) but rather the fruition of eternal glory. For by the supper are signified the joys, celestial, greatest and unspeakeable, which after their souls the godly receive immediately after death: but more fully in the end of times when the bodies shall arise again. Therefore is it not applied to a dinner, but to a supper, as it is also in the 14th of Luke. Then if we receive Christ, we shall have Him dwelling with us continually whilst we live in this world. And in the world to come we shall have the full fruition of all the joys celestial. These things be certain and true.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Hereby also the Lord allures the Laodiceans to repentance, showing that every time is meet for conversion and that God is evermore ready to receive sinners, and provokes them always that they should amend and live. And this matter he expounds in an allegorical and goodly speech taken out of the fifth chapter of the book of Canticles. For he fains the Lord to stand at the door and knock, yea and to promise to them that open the greatest familiarity and joys unspeakeable. First, therefore is declared the benevolence of God towards sinners and his most ready will always to receive the same, yea and his infinite study to move men to repentance [Rom. 2:4] that they might live. For the Lord stands at the door and knocks. The word of ‘standing’ does signify that God is always prepared, always watches over our salvation. For He sits not still, nor lies not on the one side like a sluggard: He stands busily to his work. And ‘I stand’ says He, not ‘I stood’, or ‘shall stand’: But ‘I stand’ evermore ready, evermore loving and gentle. What does He? He knocks, and that indeed at the door, desiring to be let in. For like as he that knocks at the door seriously covets to be let in: so God desires earnestly to be of us received. And God uses sundry kinds of knocking. For He warns and excites with his Word by the prophets, again by signs and wonders, and also by sundry chances and movings. These things may be seen in the city of Jerusalem. He sends to them his prophets and apostles. He shows diverse wonders. He brings on them sorrowful chances that they might admonish them: Such as are reported, Lk. 13, of the Galileans, and of those whom the tower of Siloh had overwhelmed. We may see the like at this day how the Lord knocks. Therefore He said truly, ‘Jerusalem, Jerusalem, etc.’ Mt. 23. These are doubtless the parts and doings of God which will not that a sinner should die, but rather convert and live. Then must we see what is required of us, verily that we should hear the knocking and noise of the Knocker, and that also we open and receive such as desire to come in. Here are they confuted which speak of man as though he were a block and image, ‘I know not what manner of drawing,’ sayng: ‘It is neither in the runner, nor in the willer, etc.’ Certain [persons] altogether abstain from well-doing, saying, ‘If I be chosen, it is enough.’ But the Scripture requires everywhere hearing and obedience. We know that the elect are only saved, and that the elect in Christ: In Christ to be they that believe: That faith is of hearing, hearing by the Word of God. Therefore says the prophet, ‘This day if you heare his voice. etc.’ [Ps. 95] This same is recited of the apostle, Heb. 4. The apostle also, 2 Tim. 2, ‘In a great house there be not only vessels of gold, but of earth also. If any purge himself, etc.’ And therefore the Lord says, ‘I knock’: It shall be thy part not to despise Him that knocks, but to open unto Him. And he recites indeed two things, [1] to hear, which both in the 8th and 9th of John is required of the children of God and of the true sheep: And [2] to open, that is to receive the Lord, or believe, to obey, and to frame themselves after the will of God and to do penance. Notwithstanding we must here beware, that we think not that man has power of himself to receive the Lord. The Lord illumines his elect, and by Him we can do all things, without whom we can do nothing. Other places must be conferred with this as Jn. 15; 2 Cor. 3; Phil. 2. They therefore that open, do open by the grace of God. They that open not being wrapped in their sins, through their own fault open not, and not through any fault of God. Let us hear moreover what the Lord promises to them that open, that is to say, to such as receive Christ with true faith. The Lord promises to them two things chiefly. First, ‘I will go into him’, says He. The scripture signifies that Christ dwells everywhere through faith in the hearts of the faithful and with a most straight knot to be joined unto them… And in the 14th chapter [of John] He says, ‘He that loves Me, will keep my Word: And my Father and I will come unto him, and will make abode with him.’ St. Paul says that he lives not now, but that Christ lives in him. [Gal. 2:20] The same affirms that Christ through faith dwells in the hearts of the faithful. And so the Lord enters the hearts of them that let Him in. Not the least part of felicity consists in this conjunction. For to be united with God is blessedness, which begins here, and is made perfect in another life. And therefore in the second place the Lord says: ‘And I will sup with him, and he with Me.’ Whereby he notes not only again a most dear friendship and familiarity (for the table is consecrated to amity) but rather the fruition of eternal glory. For by the supper are signified the joys, celestial, greatest and unspeakeable, which after their souls the godly receive immediately after death: but more fully in the end of times when the bodies shall arise again. Therefore is it not applied to a dinner, but to a supper, as it is also in the 14th of Luke. Then if we receive Christ, we shall have Him dwelling with us continually whilst we live in this world. And in the world to come we shall have the full fruition of all the joys celestial. These things be certain and true.”

— Heinrich Bullinger, A Hundred Sermons upon the Apocalypse… (1561), on Rev. 3:20, pp. 134-36">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHereby+also+the+Lord+allures+the+Laodiceans+to+repentance%2C+showing+that+every+time+is+meet+for+conversion+and+that+God+is+evermore+ready+to+receive+sinners%2C+and+provokes+them+always+that+they+should+amend+and+live.+And+this+matter+he+expounds+in+an+allegorical+and+goodly+speech+taken+out+of+the+fifth+chapter+of+the+book+of+Canticles.+For+he+fains+the+Lord+to+stand+at+the+door+and+knock%2C+yea+and+to+promise+to+them+that+open+the+greatest+familiarity+and+joys+unspeakeable.+First%2C+therefore+is+declared+the+benevolence+of+God+towards+sinners+and+his+most+ready+will+always+to+receive+the+same%2C+yea+and+his+infinite+study+to+move+men+to+repentance+%5BRom.+2%3A4%5D+that+they+might+live.+For+the+Lord+stands+at+the+door+and+knocks.+The+word+of+%E2%80%98standing%E2%80%99+does+signify+that+God+is+always+prepared%2C+always+watches+over+our+salvation.+For+He+sits+not+still%2C+nor+lies+not+on+the+one+side+like+a+sluggard%3A+He+stands+busily+to+his+work.+And+%E2%80%98I+stand%E2%80%99+says+He%2C+not+%E2%80%98I+stood%E2%80%99%2C+or+%E2%80%98shall+stand%E2%80%99%3A+But+%E2%80%98I+stand%E2%80%99+evermore+ready%2C+evermore+loving+and+gentle.+What+does+He%3F+He+knocks%2C+and+that+indeed+at+the+door%2C+desiring+to+be+let+in.+For+like+as+he+that+knocks+at+the+door+seriously+covets+to+be+let+in%3A+so+God+desires+earnestly+to+be+of+us+received.+And+God+uses+sundry+kinds+of+knocking.+For+He+warns+and+excites+with+his+Word+by+the+prophets%2C+again+by+signs+and+wonders%2C+and+also+by+sundry+chances+and+movings.+These+things+may+be+seen+in+the+city+of+Jerusalem.+He+sends+to+them+his+prophets+and+apostles.+He+shows+diverse+wonders.+He+brings+on+them+sorrowful+chances+that+they+might+admonish+them%3A+Such+as+are+reported%2C+Lk.+13%2C+of+the+Galileans%2C+and+of+those+whom+the+tower+of+Siloh+had+overwhelmed.+We+may+see+the+like+at+this+day+how+the+Lord+knocks.+Therefore+He+said+truly%2C+%E2%80%98Jerusalem%2C+Jerusalem%2C+etc.%E2%80%99+Mt.+23.+These+are+doubtless+the+parts+and+doings+of+God+which+will+not+that+a+sinner+should+die%2C+but+rather+convert+and+live.+Then+must+we+see+what+is+required+of+us%2C+verily+that+we+should+hear+the+knocking+and+noise+of+the+Knocker%2C+and+that+also+we+open+and+receive+such+as+desire+to+come+in.+Here+are+they+confuted+which+speak+of+man+as+though+he+were+a+block+and+image%2C+%E2%80%98I+know+not+what+manner+of+drawing%2C%E2%80%99+sayng%3A+%E2%80%98It+is+neither+in+the+runner%2C+nor+in+the+willer%2C+etc.%E2%80%99+Certain+%5Bpersons%5D+altogether+abstain+from+well-doing%2C+saying%2C+%E2%80%98If+I+be+chosen%2C+it+is+enough.%E2%80%99+But+the+Scripture+requires+everywhere+hearing+and+obedience.+We+know+that+the+elect+are+only+saved%2C+and+that+the+elect+in+Christ%3A+In+Christ+to+be+they+that+believe%3A+That+faith+is+of+hearing%2C+hearing+by+the+Word+of+God.+Therefore+says+the+prophet%2C+%E2%80%98This+day+if+you+heare+his+voice.+etc.%E2%80%99+%5BPs.+95%5D+This+same+is+recited+of+the+apostle%2C+Heb.+4.+The+apostle+also%2C+2+Tim.+2%2C+%E2%80%98In+a+great+house+there+be+not+only+vessels+of+gold%2C+but+of+earth+also.+If+any+purge+himself%2C+etc.%E2%80%99+And+therefore+the+Lord+says%2C+%E2%80%98I+knock%E2%80%99%3A+It+shall+be+thy+part+not+to+despise+Him+that+knocks%2C+but+to+open+unto+Him.+And+he+recites+indeed+two+things%2C+%5B1%5D+to+hear%2C+which+both+in+the+8th+and+9th+of+John+is+required+of+the+children+of+God+and+of+the+true+sheep%3A+And+%5B2%5D+to+open%2C+that+is+to+receive+the+Lord%2C+or+believe%2C+to+obey%2C+and+to+frame+themselves+after+the+will+of+God+and+to+do+penance.+Notwithstanding+we+must+here+beware%2C+that+we+think+not+that+man+has+power+of+himself+to+receive+the+Lord.+The+Lord+illumines+his+elect%2C+and+by+Him+we+can+do+all+things%2C+without+whom+we+can+do+nothing.+Other+places+must+be+conferred+with+this+as+Jn.+15%3B+2+Cor.+3%3B+Phil.+2.+They+therefore+that+open%2C+do+open+by+the+grace+of+God.+They+that+open+not+being+wrapped+in+their+sins%2C+through+their+own+fault+open+not%2C+and+not+through+any+fault+of+God.+Let+us+hear+moreover+what+the+Lord+promises+to+them+that+open%2C+that+is+to+say%2C+to+such+as+receive+Christ+with+true+faith.+The+Lord+promises+to+them+two+things+chiefly.+First%2C+%E2%80%98I+will+go+into+him%E2%80%99%2C+says+He.+The+scripture+signifies+that+Christ+dwells+everywhere+through+faith+in+the+hearts+of+the+faithful+and+with+a+most+straight+knot+to+be+joined+unto+them%E2%80%A6+And+in+the+14th+chapter+%5Bof+John%5D+He+says%2C+%E2%80%98He+that+loves+Me%2C+will+keep+my+Word%3A+And+my+Father+and+I+will+come+unto+him%2C+and+will+make+abode+with+him.%E2%80%99+St.+Paul+says+that+he+lives+not+now%2C+but+that+Christ+lives+in+him.+%5BGal.+2%3A20%5D+The+same+affirms+that+Christ+through+faith+dwells+in+the+hearts+of+the+faithful.+And+so+the+Lord+enters+the+hearts+of+them+that+let+Him+in.+Not+the+least+part+of+felicity+consists+in+this+conjunction.+For+to+be+united+with+God+is+blessedness%2C+which+begins+here%2C+and+is+made+perfect+in+another+life.+And+therefore+in+the+second+place+the+Lord+says%3A+%E2%80%98And+I+will+sup+with+him%2C+and+he+with+Me.%E2%80%99+Whereby+he+notes+not+only+again+a+most+dear+friendship+and+familiarity+%28for+the+table+is+consecrated+to+amity%29+but+rather+the+fruition+of+eternal+glory.+For+by+the+supper+are+signified+the+joys%2C+celestial%2C+greatest+and+unspeakeable%2C+which+after+their+souls+the+godly+receive+immediately+after+death%3A+but+more+fully+in+the+end+of+times+when+the+bodies+shall+arise+again.+Therefore+is+it+not+applied+to+a+dinner%2C+but+to+a+supper%2C+as+it+is+also+in+the+14th+of+Luke.+Then+if+we+receive+Christ%2C+we+shall+have+Him+dwelling+with+us+continually+whilst+we+live+in+this+world.+And+in+the+world+to+come+we+shall+have+the+full+fruition+of+all+the+joys+celestial.+These+things+be+certain+and+true.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+A+Hundred+Sermons+upon+the+Apocalypse%E2%80%A6+%281561%29%2C+on+Rev.+3%3A20%2C+pp.+134-36&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1b30b2e0d5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1b30b2e0d5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/let-jesus-come-into-your-heart/#:~:text=Hereby%20also%20the%20Lord%20allures%20the,These%20things%20be%20certain%20and%20true&amp;text=Hereby%20also%20the%20Lord%20allures%20the%20Laodiceans%20to&amp;text=joys%20celestial.%20These%20things%20be%20certain%20and%20true" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

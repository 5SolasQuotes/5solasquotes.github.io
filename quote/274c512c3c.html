<main class="wrap"><figure class="quote" id="q-274c512c3c" data-kw="">
<blockquote><p>§2. Just as the essence and existence of God do not really differ from His vital actuality [actuositas vitalis], but are distinguished only by a mental abstraction: so His understanding and willing are comprehended under His life, or most perfect thought, as by no means really distinct from one another, but as identified in God—so that the distinction here also is nothing but the abstraction of our mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/salomon-van-til.html">Salomon Van Til</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Both Theologies, even Natural &amp; Revealed</cite>, … (1703; 1719), 1. Nature of God, subsection 4, ‘On the Will of God’ tr. AI by Roman Prestarri Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><figure class="quote" id="q-d205dc04a4" data-kw="">
<blockquote><p>…Grim’s objection also seems to assume a model of divine knowledge which would be rejected by those who hold (as, again, Scholastic realists do) that God is absolutely simple or noncomposite. In particular, it seems to assume that the truths God knows correspond to discrete ideas in the divine intellect, which together form a set. But given divine simplicity, what we describe in terms of such discrete ideas is really one and the same thing in God. There is in God something analogous to what we call, in the case of our own intellects, a grasp of the proposition that all men are mortal, something analogous to what we call a grasp of the proposition that Socrates is a man, and so forth. But these are different ways of describing what, in God, is really one and the same thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Proofs of the Existence of God</cite>, (San Francisco: Ignatius Press, 2017), ch. 3, ‘The Augustinian Proof’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><figure class="quote" id="q-c4aab08fa6" data-kw="">
<blockquote><p>…engages the recent critics and addresses one of their major concerns: that the doctrine of divine simplicity is not a biblical teaching. By analyzing the use of Scripture by key theologians from the early church to Karl Barth, Barrett finds that divine simplicity developed in order to respond to theological errors (e.g., Eunomianism) and to avoid misreading Scripture. Through close attention to Scripture, the work also argues that divine simplicity has two biblical roots: the names of God and the indivisible operations of the Trinity ad extra [outside of Himself]… divine simplicity can be rearticulated by following a formal analogy from the doctrine of the Trinity–the analogia diversitatis (analogy of diversity)–in which the divine attributes are identical to the divine essence but are not identical to each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jodan-p-barrett.html">Jodan P. Barrett</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Simplicity: a Biblical &amp; Trinitarian Account Pre</cite></span></figcaption>

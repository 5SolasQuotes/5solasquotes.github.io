<main class="wrap"><figure class="quote" id="q-77b89dd3e3" data-kw="">
<blockquote><p>XII. Moreover, (1) not only does the universal consensus of all nations (Rom. 2:15) declare that a certain theology is given, but (2) nature itself teaches that God exists and that he must be glorified (Ps. 19:1; Rom. 1:19-21), and that he in turn will be a rewarder of those who seek him (Heb. 11:6), the method of whose worship we proclaim in theology. (3) Nature teaches that the soul is immortal, burning to have its immortal desire for perpetual beatitude satisfied, and theology is believed to open the path to this satisfaction. (4) Nature also teaches that the rational creature, having been created by God strives toward God, so that he is satisfied in God alone, to whom theology leads.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.1.XII, p. 74.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-626fccc13c" data-kw="">
<blockquote><p>It is an indubitable truth that the light of nature gives considerable information, with respect to the knowledge of God and divine things. That there is a supreme Being on whom every other being in the universe is dependent; that he is eternal, infinite in wisdom, power, goodness and justice, in a word, possessed of absolute perfection; that by him all things were at first created and are continually governed; that the affairs of mankind are, in a particular manner, the object of his attention; that there are laws of nature by which we are enabled to distinguish the difference betwixt just and unjust; finally, that the souls of men are immortal, and that there is a future state of rewards and punishment, all these truths are pretty clearly discovered by the light of nature. The heathens were not strangers to them, who had no other guide, with respect to such matters, but the aids derived from unassisted reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertations on Revealed Religion</cite>, trans. William Crawford (1737; Belfast: James Magee, 1778), § 1, pp 1-2.</span></figcaption>

</figure><figure class="quote" id="q-7d1142bb68" data-kw="">
<blockquote><p>Paley’s argument presupposes that teleology is extrinsic; Aquinas follows Aristotle in holding that it is immanent to the natural order. Paley therefore focuses on complex phenomena, especially biological phenomena, as uniquely indicative of teleology; Aquinas takes all natural phenomena, however simple or complex and whether organic or inorganic, to manifest teleology. Paley is presenting a cumulative and probabilistic “argument to the best explanation”; Aquinas is putting forward a metaphysical demonstration… But Paley is at least seriously threatened by it [Darwinian evolution], while the Fifth Way is not threatened by it at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, (South Bend, IN: St. Augustine’s Press, 2015) | 7. Between Aristotle &amp; William Paley: Aquinas’s Fifth Way 147, p. 82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

</figure><figure class="quote" id="q-f5fd75eefd" data-kw="">
<blockquote><p>An extreme opinion on this subject has been held by some Christians, to the effect that no true and certain knowledge of God can be derived by man, in his present condition, from the light of nature in the entire absence of a supernatural revelation; that we are altogether dependent upon such a revelation for any certain knowledge that God exists, as well as for all knowledge of his nature and his purposes. This opinion is disproved: (a.) By the direct testimony of Scripture. Rom. 1:20–24; 2:14, 15. (b.) By the fact that many conclusive arguments for the existence of a great first Cause, who is at the same time an intelligent personal Spirit and righteous moral Governor, have been drawn by a strict induction from the facts of nature alone, as they lie open to the natural understanding. The fact that this argument remains unanswerable shows that the process by which the conclusions are drawn from purely natural sources is legitimate. (c.) All nations, however destitute of a supernatural revelation they may have been, have yet possessed some knowledge of a God. And in the case of the most enlightened of the heathen, natural religion has given birth to a considerable natural theology. We must, however, distinguish between that knowledge of the divine character which may be obtained by men from the works of nature and providence in the exercise of their natural powers alone, without any suggestions or assistance derived from a supernatural revelation—as is illustrated in theological writings of some most eminent of the heathen who lived before Christ—and that knowledge which men in this age, under the clear light of a supernatural revelation, are competent to deduce from a study of nature. The natural theology of the modern rationalists demonstrably owes all its special excellences to that Christian revelation it is intended to supersede.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary on the Confession of Faith</cite>, (Philadelphia: Presbyterian Board of Publications, 1920), 45–46.</span></figcaption>

</figure><figure class="quote" id="q-f59812f657" data-kw="">
<blockquote><p>In the book The Open Secret: A New Vision for Natural Theology, Alister McGrath sets out to lay the foundations for an entirely new natural theology… ‘…if nature is to disclose the transcendent, it must be ‘seen’ or ‘read’ in certain specific ways – ways that are not themselves necessarily mandated by nature itself.’ He does not wish to embark on a neutral natural theology, but to advance a Christian natural theology – one which, rather than proving the doctrinal claims of Christianity, begins by accepting the doctrinal claims of Christianity, and then goes on to show how the Christian worldview gives the best interpretation of our perceptions of this universe. The claim that he will seek to validate in his book is summarized briefly as follows: ‘…A Christian understanding of nature is the intellectual prerequisite for a natural theology which discloses the Christian God.’ In order to understand his revised natural theology we must first understand the need for this revision. What does McGrath perceive as the old natural theology, and what is so wrong with it that we need a new vision? Once we have understood these contentions we will be able to better understand McGrath’s revised version, which will allow us to give it a critical analysis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-haines.html">David Haines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Alister McGrath &amp; Natural Theology’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/natural-theology.html">Natural Theology</a></span></div>

<main class="wrap"><figure class="quote" id="q-26568c59be" data-kw="">
<blockquote><p>For the first, Thy will, &amp;c. God’s will is only one, considered in it self, as God is one; yet for our understanding, it may be thus distinguished: It is either absolute, or revealed. God’s absolute will, is the will of his good pleasure, whereby according to his eternal counsel, he determines of all things, what shall be done, or what shall not be done, and in what manner. This absolute will extendeth over all creatures, and over all their actions: Ephes. 1. 11. We are predestinate according to the purpose of him that worketh all things after the counsel of his own will. Roman. 9. 19. Who hath resisted his will? Matth. 10. 26. Without this will of God, a sparrow cannot fall to the ground. And this absolute will of God is hidden from us, till God reveal it by the event.

God’s revealed will, is the sacred doctrine of God in his word, whereby he signifieth unto man, so far as concerns his happiness and salvation, what he ought to do, or what he ought not to do. This is not Gods absolute will, but rather an effect thereof concerning man, revealing unto him, not what he simply and absolutely willeth to be done, for that must needs be done; but what is pleasing or displeasing unto him, done by man, and what he will have man to do, or not to do, if he desire to come to life, and would not be condemned. And this revealed will comprehendeth both the Law and the Gospel, with all their commandments, prohibitions, threatenings, exhortations, promises, &amp; such like, whereto the Apostle hath relation, when he saith, Prove what is the good will of God, and acceptable, Rom. 12. 2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A godly and learned exposition of Christ’s Sermon in the Mount</cite>, (Cambridge: University of Cambridge, 1608), p. 275.</span></figcaption>

<blockquote><p>360. XII. The last now to be named is the antecedent and consequent will. This also is handled by many Schoolmen and much used by the Jesuits and Arminians. To pass by others, Pennottus handles it Propugn. bk. 4, ch. 21, having first showed, ch. 20, p. 225 that Chrysostom and Damascene first used it. His explicatory propositions are:

1. Voluntas antecedens et consequens non est in Deo respectu omnium volitorum, sed solum respectu eorum quae aliquo modo pendent ex lib. arbtrio creaturae. [The antecedent and consequent will do not exist in God with respect to all things willed, but only with respect to those things which in some manner depend upon the free will of the creature.]

2. Voluntas antecedens est illa qua Deus vult hominis salutem quantum in ipso est, et qua illum ad salutem ordinat, et media ad salutem necessaria praeparat, quibus nisi per ipsum hominem steterit, salutem assequatur. [The antecedent will is that by which God wills the salvation of man, insofar as it lies in Him, and by which He ordains him to salvation and prepares the means necessary for salvation, so that, unless the hindrance to salvation should arise from the man himself, he may attain salvation.]

3. Non semper voluntas antecedens et consequens circa objecta contraria versantur, sed potest idem objectum esse volitum à Deo voluntate tum antecedente tum consequente. [The antecedent and consequent will do not always concern contrary objects; rather, the same object may be willed by God both by the antecedent will and by the consequent will.]

4. Voluntas antecedens in Deo est voluntas beneplaciti, et non solum voluntas signi. [The antecedent will in God is the will of good pleasure, and not merely the will of sign.]

5. Voluntas antecedens est formaliter et proprie in Deo existens, et non solum per metaphoram ad eum modum, quo voluntas signi. [The antecedent will exists formally and properly in God, and not merely metaphorically, in the manner in which the will of sign does.]

361. I tell you their sense that I may the better open the plain truth to you, which is as follows:

1. This distinction of voluntas antecedens et consequens is not applied to God as He is our Creator, or end, nor as He is mere Proprietor or Benefactor, but only as He is Rector or [the] Moral Ruler of man.

2. As government has an antecedent and consequent part, viz. legislation and judgement (with execution), so God’s antecedent will is nothing but his legal will, or his will as Rector signified by his laws; and his consequent will is his judicial will, or expressed in judgment: one antecedent to man’s part (obedience or disobedience) and the other consequent to it.

3. It is most certain that God wills antecedently all that is in his Law, that is, that all that believe and repent shall be saved: and that He wills consequently that Judas e.g., and every finally impenitent unbeliever, shall be damned. For what God does, that He wills to do: But God does Himself make such a Law and pass such a judgement: Therefore He is willing of it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, ... (London: White, 1675) | pt. 1, sect. 14, Of Several Distinctions of God’s Will, pp. 56-57</span></figcaption>

<blockquote><p>In the particular sense of a distinction between the voluntas beneplaciti as the decree and the voluntas signi as the divine command, the distinction is little different than the correctly understood distinction between the absolute and the conditional will of God. (Leigh, Body of Divinity, II.vii (p. 198); Cocceius, Summa theol., III.x47.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, ed. (Baker Books, 2003), vol. 3, ch. 5.4, E. The Ad Intra–Ad Extra Distinctions, 1. Voluntas beneplaciti and voluntas signi, p. 458</span></figcaption>

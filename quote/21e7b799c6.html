<main class="wrap"><figure class="quote" id="q-21e7b799c6" data-kw="">
<blockquote><p>Whether the Person assuming is outside the nature assumed? It is affirmed with a distinction. Whether from this it follows that one Word is enfleshed and another is without the flesh? It is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’ in A Syllabus of Theological Problems</cite>, … (Utrecht, 1643) n.p. | 1. ‘Of the Assumption &amp; Union of the Human Nature’ in I. ‘Of the Person of Christ the Mediator’ | ‘Of the Person Assuming’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a469aee8d1" data-kw="Faith">
<blockquote><p>It is a REAL union. Such is our weakness in our present state, so much are we sunk in sin, that in our mind, we are prone to suspect spiritual realities to be only a fiction. But nothing is more real than what is spiritual: as approaching nearest to the nature of him who is the fountain of all reality, namely, God himself. We do not see with our eyes the union between our own soul and body; neither can we represent it to ourselves truly, by imagination, as we do sensible things: yet the reality of it is not to be doubted. Faith is no fancy—but &quot;the substance of things hoped for,&quot; Heb. 11:1. Neither is the union thereby made between Christ and believers imaginary—but most real: &quot;For we are members of his body, of his flesh, and of his bones,&quot; Eph. 5:30.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Human Nature in Its Fourfold State</cite>, State III, Head 2 “Mystical Union,” general observations (2)</span></figcaption>

</figure><figure class="quote" id="q-b39dc87ab2" data-kw="">
<blockquote><p>Developing from Girolama Zanchi’s exegetical labors through Ephesians, Spiritual Marriage draws readers into the rich theological of doctrine of union with Christ. Following the lead of the apostle Paul, Zanchi demonstrates how our earthly marriages fulfill their truest purpose by drawing our attention toward the spiritual marriage between Christ and His Church. By paying attention to the Genesis account of Adam’s marriage to Eve, to pertinent Old Testament laws, and to the teachings of Jesus and His apostles, we begin to understand something of that higher and heavenly union.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Marriage between Christ &amp; His Church &amp; Every One of the Faithful</cite>, (RHB, 2021) 152, pp. ToC</span></figcaption>

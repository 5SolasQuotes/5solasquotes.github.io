<main class="wrap"><figure class="quote" id="q-a89df48283" data-kw="">
<blockquote><p>Reply to Objection 4: Although the drop of blood that bled in the circumcision would be sufficient for every satisfaction, considering the condition of the divine person, nevertheless it would not be sufficient relative to the kind of penalty. For the human race was obligated to death, for which it was necessary that a death be paid. … Reply to Objection 6: The other penalties that Christ endured, although they were sufficient to make satisfaction on behalf of human nature, considering the condition of the one suffering, nonetheless this is not the case when considering the kind of penalty. For all other penalties were not contained in those penalties, as they were in the suffering of death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Lombard’s Sentences</cite>, bk. 3, distinction 20, article 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

<blockquote><p>1. That Jesus Christ did effectually die for all the elect, and every one of them, whether Jews or Gentiles; and all the benefits of his death do reach unto every one of them, when they come to believe on Him.

sonline.com/limited-atonement/#:~:text=1.%20That%20Jesus%20Christ%20did%20effectually,every%20particular%20sinner%20in%20the%20world&amp;text=1.%20That%20Jesus%20Christ%20did%20effectually%20die%20for&amp;text=and%20for%20every%20particular%20sinner%20in%20the%20world" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-1b869e136d" data-kw="">
<blockquote><p>Universal redemption must be denied in the very sense of Calvinists themselves [New Lights?], whether predestination is acknowledged or no, if we acknowledge that Christ knows all things. For if Christ certainly knows all things to come, he certainly knew, when he died, that there were such and such men that would never be the better for his death. And therefore, it was impossible that he should die with an intent to make them (particular persons) happy. For it is a right-down contradiction [to say that] he died with an intent to make them happy, when at the same time he knew they would not be happy-Predestination or no predestination, it is all one for that. This is all that Calvinists mean when they say that Christ did not die for all, that he did not die intending and designing that such and such particular persons should be the better for it; and that is evident to a demonstration. Now Arminians, when [they] say that Christ died for all, cannot mean, with any sense, that he died for all any otherwise than to give all an opportunity to be saved; and that, Calvinists themselves never denied. He did die for all in this sense; ’tis past all contradiction.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The “Miscellanies”</cite>, (1722), WJE Online vol. 13, t. ‘Universal Redemption’, p. 174</span></figcaption>

<blockquote><p>VIII. …We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted; or that salvation was purchased for him, whom God from eternity hath decreed to condemn: for this were a vain purchase… IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: and that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally, Christ may be said to reconcile all men to God by his death, after the same manner, that we say that the sun doth enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkness: Because if all and several men had their eyes, and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: after the same manner that the apostle saith, 1 Cor. 15:20, that ‘all men are made alive by Christ’, because no man is made alive but by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, ch. 27, ‘How Far, &amp; in What Sense Christ Died for All? The Opinions of the Parties’ in The Anatomy of Arminianism… (1619; London, 1635), p. 196 ff. | Moulin first surveys the opinions and statements of the Arminians and then concludes the chapter with a positive statement of his (and others’) position:, pp. 198-199</span></figcaption>

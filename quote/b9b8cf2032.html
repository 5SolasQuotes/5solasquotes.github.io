<main class="wrap"><figure class="quote" id="q-b9b8cf2032" data-kw="">
<blockquote><p>Unless they will abolish their laws and ordinances and restore to Christ’s churches their liberty and have it taught among them, they are guilty of all the souls that perish under this miserable captivity, and the papacy is truly the kingdom of Babylon and of the very Antichrist. For who is “the man of sin” and “the son of perdition” [II Thess. 2:3] but he who with his doctrines and his laws increases the sins and perdition of souls in the church, while sitting in the church as if he were God? [II Thess. 2:4]. All this the papal tyranny has fulfilled, and more than fulfilled, these many centuries. It has extinguished faith, obscured the sacraments and oppressed the gospel; but its own laws, which are not only impious and sacrilegious, but even barbarous and foolish, it has decreed and multiplied without end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Babylonian captivity of the church</cite>, (1520) in Luther’s works, trans. A. T. Steinhauser, ed. A. R. Wentz (55 vols, Philadelphia, 1959), xxxvi, 72-3.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/papacy.html">Papacy</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-de8f816fdc" data-kw="">
<blockquote><p>This system also conflicts with Scripture, which recognizes no such primacy of Peter as that on which the system is built, and distinctly recognizes the voice of the people in ecclesiastical affairs. Moreover, the claim of the Roman Catholic Church, that there has been an unbroken line of succession from the time of Peter down to the present day, is contradicted by history. The papal system is, both exegetically and historically, untenable.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, pt. 5, “The Government of the Church”</span></figcaption>

<blockquote><p>From all such persons, therefore, it behooves us to keep aloof, but to adhere to those who, as I have already observed, do hold the doctrine of the apostles, and who, together with the order of priesthood (presbyterii ordine), display sound speech and blameless conduct for the confirmation and correction of others.</p></blockquote>

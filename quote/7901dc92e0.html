<blockquote><p>But as we have seen in what respect the laws of the Church do not bind, let us now see how they may be said to bind. That which binds is not the authority of the Church, nor any force which the Church can give to her laws. It must be then somewhat else which makes them able to bind, when they bind at all, and that is, ratio legis, ‘the reason of the law,’ without which the law itself cannot bind, and which has the chiefest and most principal power of binding. An ecclesiastical law says Junius (Animad. in Bellarmine, Controversy 3, bk. 4, ch. 16, note 87): ‘[Greek] sive depositio, non vere lex est, sed [Greek] aut canon, ac proinde dirigit quidem ut canon agentem voluntarie: non autem necessitate cogit, ut lex, etiam involuntarium quod si forte ante accedit coactio, ea non est de natura Canonis sed aliunde pervenit.’ An ecclesiastical canon says Tilen, ducit volentem, non trahit nolentem: quod si accedat coactio, ea Ecclesiastici Canonis natura est prorsus aliena. Calvin’s judgment is that an ecclesistical canon binds when manifestam utilitatem prae se fert [it bears a manifest utility before it], and when either [Greek] or charitatis ratio [the law of charity] does require that we impose a necessity on our liberty. It binds not then by its own authority in his mind. And what says the Canon Law itself? Sed sciendum est quod Ecclesiasticae prohibitiones proprias habent causas, quibus cessantibus, cessant &amp; ipsae. Hence Junius says that the law binds not per se [of itself], but only propter ordinem, charitatem, &amp; cautionem scandali [for the order, charity and caution of scandal]. Hence Ames: ‘quamvis ad justas leges humanas, justo modo observandas, obligentur homines in conscientiis suis a Deo; ipsae tamen leges humanae, qua sunt leges hominum, non obligant conscientiam.’ Hence Alsted: Lawes made by men of things indifferent, whether they be civil or ecclesiastical, do bind the conscience insofar as they agree with God’s Word, serve for the public good, maintain order, and finally, take not away liberty of conscience. Hence the Professors of Leiden say that laws bind not primo &amp; per se, sed secundario &amp; per accidens [firstly and of themselves, but secondarily and by accident], that is quatenus in illis lex aliqua Dei violatur [insofar as in them the law of God is anyway violated]. Hence I may compare the constitutions of the Church with responsa juris consultorum [responses of the lawyers of the law] among the Romans, which obliged no man, nisi ex aequo &amp; bono [except out of equity and good] says Danaeus. Hence it may be said that the lawes of the Church do only bind scandali &amp; contemptus ratione [by the reason of scandal and contempt], as Hospinian, and in case libertas fiat cum scandalo [liberty may be turned into scandal], as Paraeus: for it were scandal, not to give obedience to the laws of the Church when they prescribe things necessary or expedient for the eschewing of scandal, and it were contempt to refuse obedience to them when we are not certainly perswaded of the unlawfulness or inexpediency of the things prescribed. … We deny not then that the Churches’ canons about rites which serve for public order and edification do bind: We say only that it is not the authority of the Church framing the canon that binds, but the matter of the canon chiefly, warranted by God’s Word. Scimus enim quaecunque ad decorum &amp; ordinem pertinent, non habenda esse pro humanis placitis, quia divinitus approbantur (Calvin, Resp. ad Libel. de Pii Viri Officio, p. 413). Therefore we think concerning such canons that ‘they are necessary to be observed so far forth only as the keeping of them maintains decent order and prevents open offence.’ (Theodore Beza, Confession, ch. 5, Article 18; Perkins, ubi supra. &amp; Meisner, Philos. sobr., part 3, section 2, question 12)</p></blockquote>

<blockquote><p>6. If matters in their expediency be questionable and probable on both sides, the Church’s determination should end the controversy (say the Doctors), this is the doctrine of the Jesuits, Suarez, Thomas Sanches, and Gregory de Valentia, as I show[ed] before (supra, Question 6 of this treatise), when a thing is probable and I be resolved in conscience against neither of the sides, and fear the one side be [a] murdering him for whom Christ died, which is against God’s commandment, and know that human authority commands the contrary and am persuaded it is indifferent and a positive commandment of men: if the Church’s determination be here to sway my conscience to practice, is to me blind obedience for human authority, as it is such, gives no light. Ergo, it [the Church’s judgment] cannot remove my doubting and beget faith; and also the conscience is so much the bolder to venture on a sin against God for fear of eschewing a sin against men, which is questionable, and [that] in a matter indifferent; this is also the stout conscience of Bonaventura (2 Sentences, dist. 39), plus est standum praecepto Praelati quam conscientiae.

7. Our [Prelatist] Doctors say [that] our way is against the peace of the Church: But I answer [that] their way is Popish and against the truth of God in commanding our consciences to rest upon the wicked will of men.</p></blockquote>

<blockquote><p>St. Augustine says, ‘The church ought not to be preferred before Jesus Christ. For He always judges truly; but the ecclesiastical judges often may deceive themselves and truly do so.’ For who condemned Jesus Christ? A council lawfully assembled, if we consider that outward succession and appearance. Who concluded that those who were baptized by heretics should be re-baptized? A council in Africa where St. Cyprian was.</p></blockquote>

<blockquote><p>By which it does manifestly appear that they would bear dominion over our consciences, not as lords only, by requiring the willing and ready assent of our consciences to those things which are urged upon us by their sole will and authority, but even as tyrants, not caring if they get so much as constrained obedience, and if by their authority they can compel conscience to that which is contrary to the [Greek] and full persuasion which it has conceived. It will be said that our consciences are in an error, and therefore ought to be corrected by the sentence of superiors, whose authority and will does bind us to receive and embrace the ceremonies, though our consciences do condemn them. Answer: Giving and not granting that our consciences do err in condemning the ceremonies, yet so long as they cannot be otherwise persuaded, the ceremonies ought not to be urged upon us, for if we be made to do that which our consciences do condemn, we are made to sin. Rom. 14:23. It is an audacious contempt in Calvin’s judgment to do any thing repugnante conscientia.</p></blockquote>

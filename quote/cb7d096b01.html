<main class="wrap"><figure class="quote" id="q-cb7d096b01" data-kw="thanksgiving">
<blockquote><p>In this sacramental blessing, however, a twofold relation (schesis) must be attended to: the first to God, the second to the symbols themselves. To God, that thanks may be given to him for the wonderful blessing of the whole work of redemption because he sent Christ into the world and delivered him to death and because he gives him to us for vivifying food. To the symbols, that a blessing may be obtained upon the creatures spread before us (and soon to be extended to believers) in virtue of which they (otherwise of themselves incapable of it) may be rendered efficacious to the spiritual use and benefit of the recipients. Thus in this blessing is contained both the giving of thanks for blessings already received and a supplication for the consecration of the symbols. This is rightly referred to the symbols, not immediately, but because faith excited towards God (the author of sanctification) brings back from him the power of use to the celebration of the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.23</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b1da1a9cb3" data-kw="self-exam">
<blockquote><p>Christ used bread because with the divine blessing it is of all the elements the most efficacious for nourishing and strengthening the body; the most common, the most familiar and to be found everywhere, easily prepared and the most pleasant. However, the bread he used was unleavened; not from the necessity of the thing, but from an accidental circumstance of time, on account of the feast of the Passover, in which it was lawful neither to use nor to have any other (Ex. 12:19). Otherwise it was always fermented in Judea (whenever the Supper was celebrated outside of that time, Acts 2:42) as well as among the Gentiles (who used common and not unleavened bread). Hence it was called simply the “breaking of bread” (Acts 20:7; 1 Cor. 10:16; 11:26, 27). So that here so fierce a dispute on this subject falsely sprang up between the Greeks and Latins; the Greeks pressing the necessity of leavened, the latter of unleavened bread. The former were called “fermentarians” and the latter “azymites.” The thing is in itself indifferent (as many of the Romanists acknowledge); on account of which the peace of the church ought not to be disturbed, but it should be left to their freedom (as it is evident that both the ancient and also the modern uses vary).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.22</span></figcaption>

</figure><figure class="quote" id="q-5fae02486d" data-kw="unworthy">
<blockquote><p>The reasons are: (1) from the institution and the example of Christ. Christ broke the bread and all the evangelists, and Paul, who individually relate this, agree that he did. Now who would affirm that the Son of God in so sacred an action did anything superfluous, or that all the apostles would have related this with so great carefulness, if the thing was merely indifferent and free? Who, on the other hand, does not see that Christ wished to prescribe the sacramental rites and ceremonies by his example and command when he ordered his disciples “to do this” (i.e., with respect to those administering, to take the bread, to bless, to break and give it to the communicants)? Again, there ought to be the same reason for the breaking as the giving of thanks and for the distribution because it is placed between them. Now no one denies that these latter ceremonies are necessary, belonging to the instituted rite and not merely indifferent.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 19.24</span></figcaption>

</figure><figure class="quote" id="q-8a64591cf5" data-kw="">
<blockquote><p>Third, their idolatry exceeds the idolatry of the heathen, in that they worship a breaden god, or Christ in and under the forms of bread and wine. And if Christ according to His humanity be absent from the earth, as I have proved, the popish host is as abominable an idol as ever was.</p></blockquote>

</figure><figure class="quote" id="q-19a2e6f8a1" data-kw="">
<blockquote><p>What remains but for the blind to see, the deaf to hear, children even to perceive this abomination of the mass, which, held forth in a golden cup, has so intoxicated all the kings and nations of the earth, from the highest to the lowest; so struck them with stupor and giddiness, that, duller than the lower animals, they have placed the vessel of their salvation in this fatal vortex. Certainly Satan never employed a more powerful engine to assail and storm the kingdom of Christ.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a916fff20e" data-kw="">
<blockquote><p>What ought to be the gesture of him that prays? A diverse gesture is not prescribed, but yet is described in the Scriptures: 1. The Jews in time past did pray somtimes standing, but sometimes with bowed knees, as Solomon and Christ Himself kneeled down and prayed, as also Peter and Stephen; Paul also used bowing of the knees, Eph. 3:14, “For this cause (says he) I bow my knees unto the Father of our Lord Jesus Christ,” by which gesture a lowly subjection, and an emptying of ourselves before God is signified. 2. Moses lifts up his hands towards Heaven, and Paul wills, 1 Tim. 2:8, that pure hands should be lifted up unto God: which gesture belongs unto children who do reach their hand to the parents when they will obtain anything or are suppliant to them. But this ceremony of lifting up of hands does admonish us, that the heart and senses are to be lifted upon high, least they which desire to be heard of God should abide in their dregs, as David interprets Ps. 86:4; 25:1, “Unto Thee O Lord I lift up my soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion (1606)</cite>, p. 416</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5302f036bd" data-kw="">
<blockquote><p>We observe comely circumstances in the celebration of the sacrament, but we justly condemn those who have added such things unto which they have fancied mysteries, and proper significations, and that of those effects which appertain unto the water of baptism: As though the work should be twice or thrice done, and that either nothing, or that was not sufficient which was done by divine appointment, unless human rashness should have added supply.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-chamier.html">Daniel Chamier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ch. 6, section 27 as quoted in William Ames, A Fresh Suit Against Human Ceremonies in God’s Worship (Amsterdam: Thorp, 1633), Manuduction, ch. 7, ‘Touching other Partitions of Ceremonies’</cite>, p. 84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>

</figure><figure class="quote" id="q-fea30d9bc7" data-kw="">
<blockquote><p>And by this posture [lifting up his eyes] did [Christ] testify the heavenly and depending frame of his spirit. 4. Albeit the Lord know the most secret desires of the heart, and do respect and hear the very thoughts of his people, yet it is their duty, as they have opportunity, to make use of their tongue in prayer, that so they may do Him homage with the whole man, may, by that means (among others) excite their own affections in prayer and may edify others in their place and station, for some (at least) of these causes it is that Christ in prayer spake in the audience of his disciples, ‘He lift up his eyes, and said,’ and by his practice and example would teach us our duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-hutcheson.html">George Hutcheson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Gospel of Jesus Christ, According to John (London, 1657) | on Jn.</cite>, 17:1</span></figcaption>

</figure><figure class="quote" id="q-13058b77a4" data-kw="">
<blockquote><p>…he [the opponent] was required to prove it significative of some spiritual duty [in order for it to be warrant for a human, significant ceremony in worship]: For it was in probability only a common sign of subjection, as well out of an oath, as in it, without any respect unto Christ. …but men’s conceits are no great proofs. He adds 2. that if it were a sign of subjection yet might it be significant of a spiritual duty. But may be and might be is no proof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit against Human Ceremonies in God’s Worship… (1633), ch. 3 | section 7, ‘Concerning the Oath-Gesture of Abraham’s Servant’</cite>, pp. 304-9</span></figcaption>

</figure><figure class="quote" id="q-f0574d4095" data-kw="">
<blockquote><p>…2 Chron. 29 [vv. 29-30], out of which no more can be drawn but that the people worshipped while the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), pt. 3, ch. 4</cite>, pp. 72</span></figcaption>

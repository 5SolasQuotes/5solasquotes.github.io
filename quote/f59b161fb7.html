<blockquote><p>2… When sinners shall consider they were in a fair way to the kingdom; they had a possibility of salvation; though the door of Heaven were strait, yet it was open; they had the means of grace; the jubilee of the gospel was proclaimed in their ears; God called but they refused; Jesus Christ offered them a plaister of his own blood to heal them, but they trampled it under foot; the Holy Spirit stood at the door of their heart knocking and crying to them to receive Christ and Heaven, but they repulsed the Spirit and sent away this Dove, and now they have, through their own folly and willfulness, lost the Kingdom of Heaven.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity</cite>, (d. 1686; London: Parkhurst, 1692), The Lord’s Prayer, ‘Thy Kingdom Come’ | Use 4, p. 488</span></figcaption>

<blockquote><p>If you say that though such righteousness in Saul was no moving cause to God to give him saving grace: in like manner I say that no sin in Pharaoh was a moving cause in God to deny him saving grace: For if it were, then either by necessity of nature, or by the constitution of God. Not by necessity of nature; for undoubtedly God could have pardoned this sin of his, and changed his heart, as well as he pardoned the sins of Manassah, the sins of the Jews in crucifying the Son of God, Acts 2, the sins of Saul in persecuting God’s saints; and changed all their hearts. Nor by any constitution of God; for show me if you can any such constitution of God. And if you would but explicate wherein the hardening of Pharaoh did consist, I presume it would clearly appear that the mere pleasure of God’s will is the cause of it; like as it is the mere pleasure of God that He does not harden others in like manner… … All confess that God is not the cause of hardness of heart in any man, but man being born in hardness of heart, Eze. 36:31[?]. God is said to harden, not infundendo malitiam, sed non infundendo gratiam [not by infusing malice, but by not infusing grace]: By leaving him thereunto, whereby it comes to pass that naturally it is increased, especially in case a man be moved to courses contrary to his corrupt humors, whether by God’s Word, or by his works, and God does not by grace correct those corrupt humors which are so contrariant to good motions; good motions, I mean such as have their course only in the way of instruction and persuasion; In this case, thus to move and to deny grace is to harden. But when God does forbear thus to move, and gives men over to follow the swing of their own lusts, this I confess is to harden in greater measure, and properly a punishment. But this was not the manner of Pharaohs hardening. For long after the ninth chapter of Exodus we read how God continued to admonish Pharaoh by his servant Moses to let his people go; neither ceased He this discipline till the ten plagues or nine of them at the least were fulfilled. And like as to shew mercy is not to move only to obedience, but effectually to work men to obedience, so the hardening of man in opposition thereunto, consists not in not moving unto obedience, but rather in not working unto obedience, although they be moved thereunto both in the way of instruction and exhortation. As for the punishing of sin with sin in the hardening of the creature, let us understand ourselves aright, and not confound ourselves when we need not. Is it a sober speech to say that God punishes his denial of grace with denial of grace? or that God punishes the sins of the heathen with the denial of that grace, which they never enjoyed? But as for the punishing of sin with sin, this is a large field of God’s providence, consisting in diverse kinds, and it is no way fit to consider them without distinction. God made the unnaturalness of Senacherib’s sons a scourge to chastise Senacherib’s unnaturalness towards God; one mans sinful act to be the punishment of another’s. Here is one kind utterly distinct from that you treat of. Again, some say (and I think justly) and Augustine acknowledges it, that every man’s sin may be a just punishment unto him in respect of a former, as Rom. 1:25. When men for their idolatry were given over to vile affections, to defile themselves in abominable manner, it is said that herein they received in themselves, such recompence of their error as was meet. So 2 Thess. 2:10-11, because men received not the truth of God with love, God is said to send them strong delusions that they should believe lies. …For to punish is either to inflict evil, which formerly they suffered not, or to withdraw some good which formerly they enjoyed… we see hereby apparently how God can punish sin with sin in this kind, not by denial of grace which they never enjoyed, but by denying some outward means of grace which formerly they enjoyed. And withal it appears that this is nothing to our present purpose, who treat of obduration as it consists in or is joined with the denial of saving grace, in proper opposition to the showing of mercy or affording saving grace… I say also that God’s punishing consists in denying, or not maintaining some kind of grace, or rather not so much to be called grace as a natural restraint, not from sin in general (for that cannot be but by saving grace), but from some sins in special, which are foul in the judgment of a natural man’s conscience; such as are those unnatural defilements the apostle speaks of, Rom. 1. Now God in a natural manner restrains men from such excess, either for fear of shame of the world or by reason of some natural detriment that may arise thereby, or by the ministry of his angels restraining the temptations of Satan in this kind; And it is found by experience that Nemo repente fit turpissimus, but they grow to extremes by degrees, and the longer a man lives, the worse he grows, if grace correct not the course of corrupt nature, according to that saying, Nemo senex metuit Jovem. Now if God shall forbear this restraint, and give them over to the power of Satan, they shall be exposed to the commission of such abominable things, and therein they shall receive in themselves a just recompence of their former errors.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, (London: J.D., 1646), 4th Doubt, pp. 189-94</span></figcaption>

<blockquote><p>It should be noted that both [Robert] Rollock and [Robert] Howie confined the effectual application of the covenant and its benefits to ‘God’s elect’. The doctrine of election permeated their writings and sermons, but, more specifically, both wrote treatises which presented strong predestinarian views advocating double and supralapsarian predestination. At Basel Academy on February 25, 1591, Howie defended a paper entitled De Aeterna Dei Praedestinatione Aphorismi Theologici [Theological Aphorisms on the Eternal Predestination of God].. He chose to glorify his mercy and love in the salvation of the elect, and to glorify his justice in the damnation of the reprobate. Man’s primal condition, his fall, and his corruption through sin were all included in this decree. (Howie, De Aeterna, 8-10)… There is one chapter in Rollock’s De Vocatione [Of Effectual Calling], entitled ‘Concerning the Free Grace of God,’ [ch. 38] which has a reference to predestination capable of an infralapsarian interpretation. Here he placed the decree to glorify Christ before the decree concerning the creation of man [which is a supra-viewpoint]. (Rollock, Select Works, 1:266-267; see Letham, ‘Saving Faith’, 1:270) But Rollock went on to say that in the execution of the decree ‘the decree of God concerning man hath the first place… Then after the fall of man, followed the restitution of man… in and by his Son Christ… Therefore the execution of the decree concerning Christ the Son of God, which was first, falls now as it were in the midst of the repairing of mankind, or of the execution of the decree concerning man’s redemption.’ (Select Works, 1:267-8) This passage in no way detracts from the overwhelming supralapsarian character of Rollock’s predestinarianism…</p></blockquote>

<div class="actions"><button class="copy" data-copy="“It should be noted that both [Robert] Rollock and [Robert] Howie confined the effectual application of the covenant and its benefits to ‘God’s elect’. The doctrine of election permeated their writings and sermons, but, more specifically, both wrote treatises which presented strong predestinarian views advocating double and supralapsarian predestination. At Basel Academy on February 25, 1591, Howie defended a paper entitled De Aeterna Dei Praedestinatione Aphorismi Theologici [Theological Aphorisms on the Eternal Predestination of God].. He chose to glorify his mercy and love in the salvation of the elect, and to glorify his justice in the damnation of the reprobate. Man’s primal condition, his fall, and his corruption through sin were all included in this decree. (Howie, De Aeterna, 8-10)… There is one chapter in Rollock’s De Vocatione [Of Effectual Calling], entitled ‘Concerning the Free Grace of God,’ [ch. 38] which has a reference to predestination capable of an infralapsarian interpretation. Here he placed the decree to glorify Christ before the decree concerning the creation of man [which is a supra-viewpoint]. (Rollock, Select Works, 1:266-267; see Letham, ‘Saving Faith’, 1:270) But Rollock went on to say that in the execution of the decree ‘the decree of God concerning man hath the first place… Then after the fall of man, followed the restitution of man… in and by his Son Christ… Therefore the execution of the decree concerning Christ the Son of God, which was first, falls now as it were in the midst of the repairing of mankind, or of the execution of the decree concerning man’s redemption.’ (Select Works, 1:267-8) This passage in no way detracts from the overwhelming supralapsarian character of Rollock’s predestinarianism…”

</figure><figure class="quote" id="q-9d7bd937c1" data-kw="">
<blockquote><p>Predestination &amp; Reprobation Contrasted 1. The [Westminster] Confession does not teach or imply a double predestination. In an attempt to distinguish between election and reprobation we should use predestination for the elect and foreordination for the reprobate [as the Confession does].

2. Election and reprobation rest on different grounds: election on the redeeming love of God that undertakes the salvation of the lost; reprobation on the moral necessity to manifest to the universe the nature and consequences of sin in moral personality.

3. Means are used of God to fulfil the purpose of election, but God uses no means to fulfil His purpose of reprobation. It is left to sin to run its course and receive its wages.

4. The fruits of election are attributable to divine grace, the fruits of reprobation to personal sin. This means that while there is grace to some, there is injustice to none.

5. While God finds pleasure in the salvation of the elect, He has sworn by Himself that He has no pleasure in the death of the wicked. God does not need sin or its retribution for His self-manifestation, but its reality in the universe can serve that end.

6. That the elect will constitute a recreation of the race under a new Head is evident, while the reprobate are but the branches cut off from the tree of humanity. Christ will be revealed as the Savior of the world, though many are lost in the process.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/r-a-finlayson.html">R.A. Finlayson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Theological Writings of R.A. Finlayson</cite>, p. 265. Finlayson was a Free Church of Scotland professor during the mid-1900’s.</span></figcaption>

<blockquote><p>But instead of attending to the true state of the controversy, and instead of referring the decision of it to the divine oracles, tradition and corruption has carried them into the way which this writer pursues, of representing our doctrine to be, that God decrees some men to misery in the same manner that he does others to happiness; yea this slanderer, in imitation of those who have gone before him, sets reprobation foremost, and would have people believe that we hold, God’s first design to be the damnation of multitudes, and then secondly, the irresistible salvation of a number!</p></blockquote>

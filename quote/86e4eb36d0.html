<main class="wrap"><figure class="quote" id="q-86e4eb36d0" data-kw="">
<blockquote><p>And the passion of Christ had his effect and power from everlasting. For Christ yesterday and to day, for ever and the same world without end. Hebr. 13.8. And Paul to the Romans 4. defineth justification by David: Blessed are they whose iniquities are forgiven. Therefore in the time of David, before Christ had suffered, sins were forgiven by confidence and trust in that sacrifice of Christ to come.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Symbol of the Apostles</cite>, trans. John Field (London: Thomas Man, 1581), p. 169.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification.html">Justification</a></span></div>

</figure><figure class="quote" id="q-7d7e242940" data-kw="">
<blockquote><p>XXII… (7) Protestants in common, in agreement with Augustine, think that good works do not precede the one to be justified, but follow the one who is justified, yet with the differences of stages observed, such that for the first constitution of justification, besides faith, not even the presence of good works is necessary, just as for the first constitution of fleshly marriage nothing is required but a consent of the spouses, because God justifies the ungodly (Rom. 4:5); then for its continuation their coexistence is required, just as for the continuation of marriage a coexistence of marriage duties is required, because faith working through love is required (Gal. 5:6); and finally for the consummation (insofar as the possession of eternal life is pronounced), the preexistence of good works is also required for the possession of eternal life (Mt. 25:35).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, (2nd ed. 1698; RHB), vol. 5, pt. 1, bk. 6, ch. 6, ‘The Justification of those to be Redeemed’, p. 128</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

nline</a></div>
</figure><figure class="quote" id="q-f15e88832a" data-kw="">
<blockquote><p>Faith therefore justifies because it is an instrument to apprehend and apply that which justifies, namely, Christ and His obedience. As the Israelites stung of fiery serpents were cured, so are we saved (John 3:14). The Israelites did nothing at all, but only look upon the brazen serpent; so are we to do nothing for our justification and salvation, but to fix the eye of our faith on Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Galatians</cite>, 2:122.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d8b7b6c6d8" data-kw="">
<blockquote><p>The followers of Christ are the sons of Nobles All blood is of one colour, holiness maketh the difference. Fortuna vitrea est, tum cum splendet, frangitur. Things we rest on here be made of crystal glass, while they glister, they are broken. Plures tegit fortuna, quam tutor facit. The world may cover men, it cannot make them secure. But the Lord is a Sun and a shield. What hath Jesus Christ on Earth, which he loveth, as he doth his Church? What a created peace is the true Church? A woman clothed with the Sun, and the Moon under her feet, and upon her head a Crowne of twelve Stars. Her very servants are the glory of Christ.

Yet is this poor woman in Britain, crying, travelling in birth, pained while she be delivered, because of the Idolatry of the Land, and our defection and apostacy practised, countenanced, tolerated in both Kingdoms. Many graves, many Widows, and the Land turned into a field of blood are the just fruits of many Altars, of Mass-idols, of Bread worship, of many inventions of men, let then: have a name and flourish in the House of the Lord, and let them be written with the living in Jerusalem who contribute help for the desired birth of the manchild. Prelacy and Popery wither, as in a Land of drought, except they be planted beside Rivers of blood; but the Lord shall build his own Jerusalem.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The due right of presbyteries, or, A peaceable plea for the government of the Church of Scotland</cite>, (London: Richard Whittaker and Andrew Crook, 1644), epistle dedicatory.</span></figcaption>

</figure><figure class="quote" id="q-09ade8ee7b" data-kw="">
<blockquote><p>The Reformed, however openly they embrace the fact that it is lawul to have a concept of God, and even more, that it is most necessary–unless we want to be atheists!–nevertheless say that a concept of God under the form of a man, or of any corporeal entity at all, is altogether unlawful, because: (1) the Savior in John 4:24 commands us to have a concept of God that agrees with the nature of God, that defines God as a Spirit, and that therefore leads to the result that God is worshipped and adored in spirit, that is, spiritually, without any such forms, and in truth, meaning in thoughts that are true and that agree with the concept… Balduin [a Lutheran] objects: (1) that since whenever we have a concept of God, and we therefore conceive a certain image of God… I respond, Balduin presupposes that having a concept and conceiving an image are synonymous, when in fact they are worlds apart. For under what likeness or image will you conceive of a spirit as it exists in itself?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical Practical Theology</cite>, trans. Rester &amp; Spangler (RHB, 2019), vol. 2, bk. 2, ch. 6, ‘The Spirituality &amp; Simplicity of God’ | section 12, ‘Is it permitted, while praying, to put God before us under the form of a man? [No]’, pp. 137-38</span></figcaption>

<blockquote><p>Abrogation is then properly, when a Law is totally taken away. And this Abrogation ariseth sometimes from the express constitution at first, which did limit and prescribe the time of the laws continuance: sometimes by an express revoking and repealing of it by that authority which made it: sometimes by adding to that repeal an express law commanding the contrary.

Now it may be easily proved, that the Ceremonial and Judicial laws they are abrogated by express repeal. The Judicial Law 1 Pet. 2. 13. where they are commanded to be subject to every ordination of man: and this was long foretold Genes. 49.10. The Law-giver shall be taken from Judah. The Ceremonial Law that is also expressly repealed Act. 15. and other places: not that these were ill, or that they did come from an ill author; but because the fullness and substance of them was now come, of whom the ceremonies were a shadow.

Yet still you must remember, that while they were commanded of God, they were the exercises of faith and piety, &amp; God did dispense grace in the use of them; only they were beggarly and empty to such who trusted in them, &amp; neglected Christ. Nor doth this assertion contradict that of the Apostle, Ephes. 2. 15. where he calls those ordinances enmity, and decrees against us: for those ceremonies may be considered two ways; first as they were signs of God’s grace and favour: and secondly as they were demonstrative of a duty, which we were tied unto, but could not perform, and in this sense all those purifications and cleansings were against us.

Thus we see these laws in every consideration made void; so that it is not now an indifferent thing to use them, though we would not put our trust in them, but sinful. Hence I cannot see how that of Luther is true upon Gal. 2. who saith, He believeth, that if the Jews believing had observed the Law and Circumcision in that manner which the Apostles permitted them, that Judaism had yet stood, and that all the world should have received the ceremonies of the Jews.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae Legis: or, a vindication of the moral law and the covenants, from the errors of the papists, Arminians, Socinians, and more especially, Antinomians. In XXX lectures, preached at Laurence-Jury,</cite>, London (2nd edn, London, 1647), pp 211-12.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

tion+made+void%3B+so+that+it+is+not+now+an+indifferent+thing+to+use+them%2C+though+we+would+not+put+our+trust+in+them%2C+but+sinful.+Hence+I+cannot+see+how+that+of+Luther+is+true+upon+Gal.+2.+who+saith%2C+He+believeth%2C+that+if+the+Jews+believing+had+observed+the+Law+and+Circumcision+in+that+manner+which+the+Apostles+permitted+them%2C+that+Judaism+had+yet+stood%2C+and+that+all+the+world+should+have+received+the+ceremonies+of+the+Jews.%E2%80%9D%0A%0A%E2%80%94+Anthony+Burgess%2C+Vindiciae+Legis%3A+or%2C+a+vindication+of+the+moral+law+and+the+covenants%2C+from+the+errors+of+the+papists%2C+Arminians%2C+Socinians%2C+and+more+especially%2C+Antinomians.+In+XXX+lectures%2C+preached+at+Laurence-Jury%2C%2C+London+%282nd+edn%2C+London%2C+1647%29%2C+pp+211-12.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F275f33d73d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/275f33d73d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/10/18/anthony-burgess-on-the-abrogation-of-the-jewish-judicial-and-ceremonial-laws/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

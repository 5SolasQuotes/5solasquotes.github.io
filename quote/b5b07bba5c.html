<main class="wrap"><figure class="quote" id="q-b5b07bba5c" data-kw="">
<blockquote><p>God’s Will Complancential, Providential and Beneplaciti. 3. Aquinas and others distinguished God’s Will unto Complacential , Providential, and Beneplaciti. (1) God’s Complacential Will, is his simple complacence in all good actions, habits, and events of men; yea it extends not only to moral, but to natural goods, as Gen. 1:31. There is a perpetual necessary volition in God which takes pleasure in all good, whether created or increated. Such is the infinite bonitie and purity of the divine nature as that it cannot but take infinite complacence in all good. This they call God’s Love of simple complacence, of which see Ruiz, De Volunt. Dei, Disp. 6, §2, p. 38 and Disp. 19, p. 214.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theophilus-gale.html">Theophilus Gale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Court of the Gentiles. Part IV, Of Reformed Philosophy. Book III, Of Divine Predetermination</cite>, (Maxwell &amp; Roberts, 1677), pt. 1, bk. 2, p. 357</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05bfcc2fdb" data-kw="">
<blockquote><p>Question 13: Whether God wills Himself as the end, and creatures as means? Distinguished. Answer: As the ultimate end He always wills Himself, Prov. 16:4. Creatures, and their actions, He sometimes wills as means in respect of others, sometimes as ends; but those ends are always subordinated, in respect of God, who is the universal and ultimate end of all things, Rom. 11, last verse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Problems on God, pt. 5 in Select Theological Disputations, pt. 5</cite>, (Utrecht, 1669) tr. AI by Roman Prestarri Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-6f9facaff9" data-kw="">
<blockquote><p>The Reformed [of the 1500’s and 1600’s], by contrast [from the Lutherans], argue a hidden will of God to bestow special saving grace irresistibly upon the elect, a voluntas decreti sive beneplaciti arcana [will of decree or hidden good-pleasure], more ultimate than the revealed will of God to offer salvation to all by means of a universal grace… The voluntas signi vel praecepti, the will of the sign or precept, is the voluntas revelata, or revealed will, of God and the voluntas moralis, or moral will, according to which God reveals in signs and precepts his plan for mankind both in the law and in the gospel. Here, again, the Lutherans and Reformed differ insofar as the former [the Lutherans] deny the contrast between a universally offered salvation revealed in the voluntas signi and a secret elective will in the voluntas beneplaciti. … The Reformed further argue the distinction of the voluntas decreti vel beneplaciti [will of decree or good-pleasure] or voluntas decernens [decreeing will] into the categories of voluntas efficiens, effecting will, and voluntas permittens, permitting will. Under the former category, God is viewed as directly or indirectly through instrumental causes effecting his positive will, whereas under the latter category God is understood as permitting both contingent events and acts of free will even when such events and acts go against his revealed will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dictionary of Latin &amp; Greek Theological Terms</cite>, ed. (Baker, 1985), pp. 222, 329 &amp; 332-33 | voluntas Dei, ‘the will of God’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

2%80%98the+will+of+God%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6f9facaff9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6f9facaff9.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-gods-revealed-will/#:~:text=The%20Reformed%20%5Bof%20the%201500%E2%80%99s%20and,acts%20go%20against%20his%20revealed%20will&amp;text=The%20Reformed%20%5Bof%20the%201500%E2%80%99s%20and%201600%E2%80%99s%5D%2C%20by&amp;text=events%20and%20acts%20go%20against%20his%20revealed%20will" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-403f6adf5c" data-kw="">
<blockquote><p>Q. 145. Has God such a will in Him, as He calls a conditional will? as for example, to will all men’s salvation if they repent? Answer: Properly there cannot be a conditional will in God: First, because such a will supposes a superior that may hinder, Acts 18:21. Secondly, it supposes ignorance how things may fall out, as Abraham willed his servant to fetch a wife for Isaac out of the land of his kindred, Gen. 24:4, if she were willing, verse 8. Nevertheless, improperly it may be given to God, not as though his will can have a condition, for that’s the property of a created will, to have a condition of it, Jam. 4:15, but because the thing willed of God may have a condition, Isa. 7:9. Now, that the Lord may be said to have a conditional will in some sense is plain: First, because He is said to will the connection of things when He does not will the things asunder; and therefore He wills them only upon the condition of a connection: God would have all men to repent and come to the knowledge of the truth, 1 Tim. 2:4. Secondly, because He is said to will the salvation of all believers and true penitent persons, and therefore if a reprobate do believe, He wills his salvation, 1 Kn. 11:38. This is true of God towards a reprobate: “If thou wilt obey Me, I will bless thee,” Dt. 7:12-13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fenner.html">William Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Man’s Directory</cite>, … (London: T.F., 1648), Of Catechizing, Of Thoughts, pp. 108-9</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>II. The one of these wills is called the antecedent will, the other is called the consequent, not because that will goes before this, for in this sense, this distinction may be admitted, because there is a certain order among the purposes of God: Thus his will of creating man was in order before his will of feeding or clothing him. But with [John] Damascene and [James] Arminius…</p></blockquote>

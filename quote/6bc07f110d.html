<blockquote><p>[T]here is a further consideration that will make it appear, that the Grace of God does exceed the grace of the most glorious angel in heaven: which is the unlimited perfection of God’s nature, the Angels have a stinted measure of perfection: the excelling of their nature is not sufficient in order to some acts of grace: as in other respects, they are not sufficient, so they have not grace enough to pardon such wrongs as God pardons; to be at such cost for man’s salvation, as God has been at: ’tis true that they do approve of and rejoice in all those acts of Grace that God does? but such actions do exceed the grace that is in their hearts; they have can’t perform those acts of mercy that God does: therefore where God would shew his sufficiency to pardon the iniquities of his people, he tells them, that God, Hos. 11.6. this infiniteness of God’s grace is the foundation of our faith, for such things as we are utterly unworthy of: Psal. 36.7. how excellent is thy loving kindness O Lord, therefore the Sons of men put their trust under the shadow of thy wings.

There is an infinite Ocean of grace in the heart of God, whereby he can bestow the greatest gifts upon his creatures, that their natures are capable of: this plain from that absolute liberty which the Scripture does ascribe unto God in all his actions; he does all things after the counsel of his own Will. Eph. 1.11. I will have mercy on whom I will have mercy, Rom 9.15. which shews there is no limitedness in his perfection, to be any restraint unto him: or a reason why he does not pardon and save these and those: his glorious excellency is such, that no unworthiness, nor provocation can overcome his mercy: but there is a sufficiency of grace in him, for any thing that is an act of mercy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/solomon-stoddard.html">Solomon Stoddard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The safety of appearing at the day of judgement, in the righteousness of Christ: opened and applied</cite>, (Boston MA: Samuel Phillips, 1687), pp 17-18.</span></figcaption>

<blockquote><p>There is not the same signification attached to God’s covenant in the Scriptures. It denotes properly a pact and agreement entered into between God and man, consisting partly in a stipulation of duty (or of the thing to be done) and partly in the promise of a reward (which is the meaning in Gen. 17:2 where God is said to wish to make a covenant with Abraham). At one time it is taken improperly for a simple promise (as the promise not to destroy the world again by a flood is called a covenant, Gen. 9:9). At another time, it is taken metonymically for the symbols and sacraments of a covenant: as circumcision is called a covenant (Gen. 17); the eucharistic “cup” is said to be “the new testament in the blood of Christ” (Lk. 22:20), i.e., a sign and seal of it; then for “the tables of the covenant” laid up in the ark (1 K. 8:21); again for the “covenanted people,” as the people of God are called “the holy covenant” (Dan. 11:28, 30); and for the Messiah, the foundation of that covenant, in whom it is made with us (“I will give thee for a covenant of the people,” Is. 49:8). But we, dismissing the improper significations, attend here to the proper signification, when we dispute concerning the covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12.1.8</span></figcaption>

</figure><figure class="quote" id="q-5c50f1c820" data-kw="">
<blockquote><p>The gospel after the fall was revealed in the form of a free and absolute promise of a Savior with salvation in Him to lost sinners of mankind. It was then promised that the seed of the woman would bruise the head of the serpent (Gen. 3:15). The gospel was preached to Abraham also under the form of an absolutely free promise: in thee and in thy seed shall all the nations of the earth be blessed (see Gen. 12:3; 22:18; Gal. 3:8). In the gospel, salvation from sin, from the curse of the law, and from the wrath of God, as well as restoration to fellowship with God, conformity to Him, and the eternal enjoyment of Him are graciously promised in Christ to all who cordially believe in Him. The Lord promises in His gospel that He will give His Holy Spirit to elect sinners to quicken their dead souls; to enlighten their dark minds; to enable them to believe in Jesus; to repent of their sins after a godly sort; to love, obey, and enjoy Him now; and to attain the perfect fruition of Him forevermore. In the gospel, as preached under the Old Testament, were promises of the coming of Messiah in human nature; and in the same gospel, as preached under the New, are promises of the coming of the Spirit, or of Christ’s coming in a greater measure of spiritual influences. These promises are, in the gospel, presented or offered to sinners in common and are made and performed to such sinners as believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, (Grand Rapids: Reformation Heritage Books), 95–96.</span></figcaption>

ass="src" href="https://heidelblog.net/2024/11/colquhoun-the-gospel-promise-has-always-been-free-and-absolute/" rel="noopener" target="_blank">Read it online · Heidelblog</a></div>

<blockquote><p>When we speak of the “new covenant,” we do not intend the covenant of grace absolutely, as though that were not before in being and efficacy, before the introduction of that which is promised in this place. For it was always the same, as to the substance of it, from the beginning. It passed through the whole dispensation of times before the law, and under the law, of the same nature and efficacy, unalterable, “everlasting, ordered in all things, and sure.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews</cite>, 8:6; Works, vol. 22, p. 89</span></figcaption>

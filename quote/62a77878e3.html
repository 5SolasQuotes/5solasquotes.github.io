<blockquote><p>Scripture Mt. 12:31-32, Mk. 3:28-29 (which compare and see 1 Jn. 5:16 (the sin unto death)) both makes this one sin singular and eloquently opposes it to others for its singularity.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c8c15e343" data-kw="wages curse">
<blockquote><p>The reasons are: (1) “The wages of sin is death” (Rom. 6:23) and “the soul that sinneth, it shall die” (Ezk. 18:20). These deal not with any sin in particular, but with sin in general. Thus either venial sin is not sin or it deserves death and so is not venial. Second, the terrible formula of the law proves this: “Cursed be he that confirmeth not all the words of this law to do them” (Dt. 27:26; Gal. 3:10). If every deviation from the law deserves a curse and every sin is illegality, no sin can be granted (even the smallest) which does not bring upon it the curse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 9.4.7-8</span></figcaption>

</figure><figure class="quote" id="q-df11b1cbb5" data-kw="">
<blockquote><p>Bridgnorth had made me resolve that I would never go among a people that had been hardened in unprofitableness under an awakening ministry; but either to such as had never had any convincing preacher, or to such as had profited by him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reliquae, I.i.29</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>
<div class="actions"><button class="copy" data-copy="“Bridgnorth had made me resolve that I would never go among a people that had been hardened in unprofitableness under an awakening ministry; but either to such as had never had any convincing preacher, or to such as had profited by him.”

— Richard Baxter, Reliquae, I.i.29">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBridgnorth+had+made+me+resolve+that+I+would+never+go+among+a+people+that+had+been+hardened+in+unprofitableness+under+an+awakening+ministry%3B+but+either+to+such+as+had+never+had+any+convincing+preacher%2C+or+to+such+as+had+profited+by+him.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Reliquae%2C+I.i.29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fdf11b1cbb5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/df11b1cbb5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/of-the-sin-against-the-holy-spirit/#:~:text=Bridgnorth%20had%20made%20me%20resolve%20that,such%20as%20had%20profited%20by%20him&amp;text=Bridgnorth%20had%20made%20me%20resolve%20that%20I%20would&amp;text=or%20to%20such%20as%20had%20profited%20by%20him" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-394dd02b63" data-kw="">
<blockquote><p>We find three old opinions concerning the sin against the Holy-Ghost, but they were long since exploded; I will but only name them: First, saint Origen thought all sins committed after baptism, to be sins against the Holy Ghost: his reason was only a witty conceit of his own, that God the Father is in all things, the Son is only in all reasonable creatures, the Holy Ghost is only in all regenerate men; therefore when men sin against that divine Person that is in them, if they be heathens, they sin against God the Father or the Son; if they be Christians, they sin against the Holy Ghost. The Novatian heretics agreed with Origen in opinion, for they denied remission of sins to any that fell, thinking all falls of Christians to be the sin against the Holy Ghost: but this opinion is false; For else all sins were unpardonable to Christians: yet we find saint Paul remit the sin of the incestuous Corinthian; also our Savior charges the Pharisees with this sin, who were no Christians. Secondly, saint Augustine thought [after a revision of his earlier view] final impenitency to be the sin against the Holy Ghost; but final impenitency is no blasphemy, but only a general circumstance that may accompany any sin. Besides, our Savior intends that this sin may be found in this life, for he says it shall not be forgiven in this life, and the Pharisees were alive when they were accused of it. Thirdly, Peter Lombard and Thomas Aquinas thought sins of malice to be the sin against the Holy Ghost, and sins of infirmity against the Father, and sins of ignorance against the Son. This opinion is false, because the sin against the Holy Ghost must be a sin of some certain blasphemy; but malice is no certain sin, but a general [sin], and it is not always a blasphemy. The six differences the Schoolmen make of the sin against the Holy Ghost are: first, envying of our brother’s grace: secondly, impugning the known truth: thirdly, desperation, fourthly, presumption: fifthly, obstinacy: sixthly, final impenitency.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-hales.html">John Hales</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Blasphemy against the Holy Ghost (London: 1646), pp. 20-21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/degrees-of-sin.html">Degrees of Sin</a></span></div>

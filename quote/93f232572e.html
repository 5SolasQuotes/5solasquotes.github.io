<blockquote><p>16. Neither has the doctrine of the Old Testament been abrogated today, nor the use, although the observance of many things in the Old Testament has been abrogated, which namely were merely positive, of private right, destined and given to the Jews as Jews, and good only as commanded, and as long as commanded.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9251b8fa2a" data-kw="">
<blockquote><p>Assertion 2: That the king only has the power of war and raising armies must be but a positive civil law. For: 1. By divine right, if the inferior judges have the sword given to them of God, then have they also power of war and raising armies. 2. …as therefore the king cannot take from one particular man the power of the sword for natural self-preservation, because it is the birthright of life, neither can the king take from a community and kingdom a power of rising in arms for their own defense… 3. Because no king, no civil power can take away nature’s birthright of self-defense from any man or a community of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex (1644; Edinburgh: Ogle, 1843)</cite>, p. 184 rt col</span></figcaption>

<blockquote><p>Moreover, grace perfects nature and does not annul it (ibid., I, qu. 1, art. 8, ad 2). Grace presupposes nature (ibid., qu. 2, art. 2, ad 1) and perfects nature according to the proper mode of that nature (ibid., qu. 62, art. 5, a). Just as grace presupposes nature and perfects it, divine law presupposes and perfects natural law (ibid., I-II, qu. 90, art. 2, ad 1).</p></blockquote>

</figure><figure class="quote" id="q-94a10c0bd4" data-kw="">
<blockquote><p>Objection 9 [of a congregationalist to presbyterianism]: ‘From the church here spoken of [in Mt. 18] there is no appeal because the sentence is ratified in heaven. It inflicts the highest punishment: the censure of excommunication; and a higher judicature can do no more. There is no reason to appeal to a higher judicature because the inferior may err, because all above a congregation are courts which may err also. For presbyteries, provincial councils, national, and the universal council of the catholic Church may err.’ So Mr. Mather (Richard Mather &amp; William Tompson, Answer to Mr. Herle, ch. 2, pp. 13-14). [Rutherford’s] Answer [1.]: Because the sentence is ratified in heaven is no reason why we may not appeal from a congregation. The sentence of an inferior judge proceeding rightly is ratified in heaven, yet we may appeal from him. To appeal is but upon fears of ill administration; to desert a lower court and go to a higher court. So when we fear that a counsel and advice given by a sister church is not according to the Word of God, which yet is according to the Word of God, upon the supposal of that fear we decline that council and take another. Neither are we to appeal de jure, ‘from a just sentence,’ in a presbytery. Illud possumus quod jure possumus [‘What we can do, is that which we can do by law’]. What the inferior Sanhedrin of Israel did justly was ratified in heaven. Yet by God’s Law there might be an appeal from it to the highest Sanhedrin. 2. Nor is this a good reason: that we may not appeal from a judicature which may inflict the highest censure. For inferior judicatures in Israel had power of life and death, yet might man appeal from them. 3. The cause of appeals is not because inferior judicatures may err: for so we might appeal from all judicatures, even from a general council, for it may err. But the true grounding [of appeals] is: 1. Because rarius errant, they [higher councils] ‘do not so frequently err’. 2. They are not so inclined and disposed to err, ‘for many eyes see more than one,’ and many eyes do more seldom miscarry in not taking up the right object than one. 3. Because we conceive more equality and less partiality in higher courts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Due Right of Presbyteries (1644), Part 1, ch. 10, sect. 10</cite>, pp. 315-316</span></figcaption>

</figure><figure class="quote" id="q-dd27223d60" data-kw="">
<blockquote><p>Question 9: Is a man ever bound to accuse himself, and seek justice against himself? Answer 1: In many cases a man is bound to punish himself: As when the law against swearing, cursing or the like, does give the poor a certain mulct [fine] which is the penalty: He ought to give that money himself: And in cases where it is a necessary cure to himself: And in any case where the public good requires it: As if a magistrate offend whom none else will punish, or who is the judge in his own cause: he should so far punish himself as is necessary to the suppression of sin, and to the preserving of the honor of the laws: As I have heard of a justice that swore twenty oaths, and paid his twenty shillings for it. 2. A man may be bound in such a divine vengeance or judgment as seeks after his particular sin, to offer himself to be a sacrifice to justice, to stop the judgement: As Jonah and Achan did. 3. A man may be bound to confess his guilt and offer himself to justice to save the innocent, who is falsely accused and condemned for his crime. 4. But in ordinary cases a man is not bound to be his own public accuser or executioner. Question 10: May a witness voluntarily speak that truth which he knows will further an unrighteous cause, and be made use of to oppress the innocent? Answer: He may never do it as a confederate in that intention: Nor may he do it when he knows that it will tend to such an event (though threatened or commanded) except when some weightier accident does preponderate for the doing it (as the avoiding of a greater hurt to others than it will bring on the oppressed, etc.). Question 11: May a witness conceal some part of the truth? Answer: Not when he swears to deliver the whole truth: nor when a good cause is like[ly] to suffer, or a bad cause to be furthered by the concealment: nor when he is under any other obligation to reveal the whole.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory… (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’</cite>, p. 149</span></figcaption>

— Richard Baxter, A Christian Directory… (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’, p. 149">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuestion+9%3A+Is+a+man+ever+bound+to+accuse+himself%2C+and+seek+justice+against+himself%3F+Answer+1%3A+In+many+cases+a+man+is+bound+to+punish+himself%3A+As+when+the+law+against+swearing%2C+cursing+or+the+like%2C+does+give+the+poor+a+certain+mulct+%5Bfine%5D+which+is+the+penalty%3A+He+ought+to+give+that+money+himself%3A+And+in+cases+where+it+is+a+necessary+cure+to+himself%3A+And+in+any+case+where+the+public+good+requires+it%3A+As+if+a+magistrate+offend+whom+none+else+will+punish%2C+or+who+is+the+judge+in+his+own+cause%3A+he+should+so+far+punish+himself+as+is+necessary+to+the+suppression+of+sin%2C+and+to+the+preserving+of+the+honor+of+the+laws%3A+As+I+have+heard+of+a+justice+that+swore+twenty+oaths%2C+and+paid+his+twenty+shillings+for+it.+2.+A+man+may+be+bound+in+such+a+divine+vengeance+or+judgment+as+seeks+after+his+particular+sin%2C+to+offer+himself+to+be+a+sacrifice+to+justice%2C+to+stop+the+judgement%3A+As+Jonah+and+Achan+did.+3.+A+man+may+be+bound+to+confess+his+guilt+and+offer+himself+to+justice+to+save+the+innocent%2C+who+is+falsely+accused+and+condemned+for+his+crime.+4.+But+in+ordinary+cases+a+man+is+not+bound+to+be+his+own+public+accuser+or+executioner.+Question+10%3A+May+a+witness+voluntarily+speak+that+truth+which+he+knows+will+further+an+unrighteous+cause%2C+and+be+made+use+of+to+oppress+the+innocent%3F+Answer%3A+He+may+never+do+it+as+a+confederate+in+that+intention%3A+Nor+may+he+do+it+when+he+knows+that+it+will+tend+to+such+an+event+%28though+threatened+or+commanded%29+except+when+some+weightier+accident+does+preponderate+for+the+doing+it+%28as+the+avoiding+of+a+greater+hurt+to+others+than+it+will+bring+on+the+oppressed%2C+etc.%29.+Question+11%3A+May+a+witness+conceal+some+part+of+the+truth%3F+Answer%3A+Not+when+he+swears+

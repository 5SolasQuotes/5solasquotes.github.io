<blockquote><p>That Prohibition of Resistance cannot be meant here, which is wholly contrary to the Apostle’s reasons following, which persuade to Subjection and not Resistance. Or that Assertion, or Interpretation, is not according to the Apostle’s scope, which is formally opposite to his Arguments afterward.

But such is the Doctor’s Interpretation and Assertion, Ergo, His Assertion and Interpretation is, that Subjects may not resist a Prince, who is bent to subvert Religion, Laws and Liberties.

The Apostles Reasons against Resisters are.

1. For Rulers are not a terror to good works, but to evil.

Now is this a reason why I may not resist such a Tyrant?

Who can be more a terror to good works, and not to evil then he that is bent to subvert Religion, Laws and Liberties? Ergo of such a Resistance of a tyrant the Apostle speaks not. But of Resistance of that Ruler, who goes altogether according to Laws and Liberties, which is justly punishable with Damnation without Gainsaying.

2. A second Reason or enforcement of the Apostles argument against Resistance is, Wilt thou then not be afraid of the power. Do that which is good and thou shalt have praise of the same. Now doth this argue a Tyrant is not to be resisted? Is there no cause of fear of him (while a man does that which is good) that is bent to subvert Religion, Laws and Liberties? Or shall a man have praise in doing good, of such a Tyrant.

Therefore is not a Tyrant that power which may not be resisted. But he that stands to the Lawes, and Rules according to them, Damnation is just against those that resist him without question.

3. Thirdly, The Apostle proceeds, vers. 4. For he is the Minister of God to thee for good (and so not to be resisted without resisting the Ordinance of God, and so incurring damnation) But is this true of a Tyrant bent to subvert Religion, Laws, and Liberties? Is he the Minister of God to thee for good? Or the Minister of his own lusts rather, for evil? Resistance of such an one then, is not the Resistance the Apostle forbids, but of one who is the conservator of Religion, for he, and he only is the Minister of God to thee for good, and worthy is he of Damnation that resists such an one.

4. The Apostle adds, If thou do that which is evil fear, for he beareth not the Sword in vain: For he is the Minister of God, a Revenger to execute wrath upon him that doth evil.

Is this man a Tyrant, bent to subvert Religion, Laws and Liberties, or most directly opposite to Tyranny.

A Tyrant secures those that do evil (so they will join with him and serve him in his Tyranny) from fear. And he bears the Sword, not only in vain, in reference to any good end intended by Gods ordinance, but altogether contrary to it; and is so far from being the Minister of God, that he is (as before) a Minister of his own lusts, to shelter those that doe evil, and to pursue with all wrath, and revenge him that doth good, and will not be a slave to his laws designs and desires. Still then of such a Tyrant S. Paul argues, not that he may not be resisted: but him that he describes, which is a just Governor, and so upon no terms to be resisted.

5. Upon all this the Apostle resumes: Wherefore you must of necessity be subject, not only for wrath, but also for Conscience sake.

What rules of conscience (before laid, inferred now by the word, wherefore) urge such an Asinine or stupid subject, as to be subject even passively, and not to resist one that is bent to subvert Religion, Laws and Liberties, when all that went before speak expressly of another power and Rulers of another temper?

A man then for fear of wrath, not being able to make good his Resistance, may yield such passive subjection, but sure conscience (at least not in this place) urges him not to it.

6. Yet the Apostle goes-on: For this cause also pay you Tribute, for they are God’s Ministers continually attending on this very thing.

For what cause? Because they may attempt to subvert Religion, Laws and Liberties? Do we pay Tribute for this cause, that they plunder and change Laws, &amp;c. Or that they may defend them? Also upon what thing are they thus God’s Ministers to attend continually? Is it to subvert Laws, &amp;c. Or to preserve them? The Apostle then speaks not of a Tyrant, but a just ruling Prince, and pity but he should be damned that resists him.

7. Finally, he concludes this matter with saying, Render to all their due. By what Law of God or man may a Tyrant subvert Religion, Laws and Liberties, or even be let alone in so doing.

I am sure the Apostle hath not expressed any such thing hitherto. It is Ergo, but the Doctor’s mistake, though I confess it hath been many wise and good men’s before him, that the Apostle forbids resisting such a Tyrant, which as I said above, all his Reasons go rather quite contrary unto, as describing the Power and Ruler that is to be subjected to, and not resisted, altogether cross to Tyranny, and his Interpretation and Assertion is altogether cross to the Apostle’s.</p></blockquote>

<blockquote><p>He takes it unkindly that I will not stand to the English Translation of the word κρίμα, damnation, but rather translate it so, They that resist shall receive to themselves judgement.

To which I say, that I do not deny but grant that the Word may be translated Damnation: but seeing the word firstly signifies Judgement, as Piscator observes; I would not have the Dr. so peremptory, scaring people with the word damnation, when as more naturally the word may be rendered otherwise, I told him before what Piscator’s reason is, for the translating of it Judgement, he may read what Musculus also said, and in him what many other Divines, who speaks thus.</p></blockquote>

<blockquote><p>If any say [such as the Erastians], ‘Who can deny but the magistrate as the magistrate may command that which is obedience to Christ, and reward it, and forbid sin and punish it?’ Answer: But the magistrate as such forbids not sin as sin, for then as a magistrate he should forbid sin under the punishment of eternal wrath, which he cannot do as a magistrate, he only can forbid sin under the pain of his temporary punishment, which he can inflict, and as it disturbs societies and incorporations.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“If any say [such as the Erastians], ‘Who can deny but the magistrate as the magistrate may command that which is obedience to Christ, and reward it, and forbid sin and punish it?’ Answer: But the magistrate as such forbids not sin as sin, for then as a magistrate he should forbid sin under the punishment of eternal wrath, which he cannot do as a magistrate, he only can forbid sin under the pain of his temporary punishment, which he can inflict, and as it disturbs societies and incorporations.”

— Samuel Rutherford, The Divine Right of Church Government, ... (1646), p. 600">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIf+any+say+%5Bsuch+as+the+Erastians%5D%2C+%E2%80%98Who+can+deny+but+the+magistrate+as+the+magistrate+may+command+that+which+is+obedience+to+Christ%2C+and+reward+it%2C+and+forbid+sin+and+punish+it%3F%E2%80%99+Answer%3A+But+the+magistrate+as+such+forbids+not+sin+as+sin%2C+for+then+as+a+magistrate+he+should+forbid+sin+under+the+punishment+of+eternal+wrath%2C+which+he+cannot+do+as+a+magistrate%2C+he+only+can+forbid+sin+under+the+pain+of+his+temporary+punishment%2C+which+he+can+inflict%2C+and+as+it+disturbs+societies+and+incorporations.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Divine+Right+of+Church+Government%2C+...+%281646%29%2C+p.+600&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F70ba221700.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/70ba221700.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/civil-government/#:~:text=If%20any%20say%20%5Bsuch%20as%20the,as%20it%20disturbs%20societies%20and%20incorporations&amp;text=If%20any%20say%20%5Bsuch%20as%20the%20Erastians%5D%2C%20%E2%80%98Who&amp;text=inflict%2C%20and%20as%20it%20disturbs%20societies%20and%20incorporations" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-4698f1b8ef" data-kw="">
<blockquote><p>And because the king being made a king leaves not off to be a reasonable creature, he must be under a law, and so his will and lust cannot be the rule of his power and dominion, but law and reason must regulate him. Now if God had given to the king a dominion over men as reasonable creatures, his power and dominion which by royalists is conceived to be above law, should be a rule to men as reasonable men, which would make men under kings no better than brute beasts, for then should subjects exercise acts of reason, not because good and honest, but because their prince commands them so to do; and if this cannot be said, none can be at the disposing of kings in politic acts liable to royal government, that way that the slave is in his actions under the dominion of his master.</p></blockquote>

</figure><figure class="quote" id="q-4e18228019" data-kw="">
<blockquote><p>Question: Why is the Magistracy called an ‘ordinance of man’ [1 Pet. 2] v. 13, seeing all powers are ordained of God, and every power is the ordinance of God, Rom. 13:1-2? Answer: The superiority of power, or government itself, is simply and absolutely commanded by God, and in that respect [it] is called the ordinance of God; but this or that special manner of power or government is not determined by God, but by men; and is therefore [it is] called an ordinance of man, which as touching the nature of it, may also be called an ordinance of God: And this is the difference betwixt an ecclesiastical and a civil office: An ecclesiastical office is not legitimate if it be not directly determined by God Himself, and consequently cannot be changed by men: but this or that civil office may be made and changed by men. And the reason of the difference is this, because God and Christ alone has dominion and power in spiritual matters; but in civil matters men are also [g]ods, though not absolute.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Analytical Exposition of both the Epistles of the Apostle Peter</cite>, … (London, 1641), p. 58</span></figcaption>

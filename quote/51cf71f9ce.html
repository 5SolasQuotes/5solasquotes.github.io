<blockquote><p>Doct. 3. One part of our duty is that on the Lord’s day, we cease from all our own works.

It is gathered from the Text; In six days shalt thou doe all thy work; but on the seventh day thou shalt do no work. &amp;c. That is, no work that is thine. Now that work is said to be our work, which neither directly belongs to the worship of God, nor yet is otherways imposed upon us by any necessity from God; but is chosen by our selves for some human, or worldly end.

Now such are 1. All our common and mercenary works. 2 All things, that call away our mind from that intention that is required unto the worship of God on that day, though otherways they be not servile. Yet such things are not forbidden, as either belong unto common honesty, or are of a very urgent and not of a made necessity of our own. The reason of this rest is, that we may be at convenient leisure for divine worship: For worldly businesses do in divers ways withstand this more solemn worship of God.

Reas. 1. Because the very external acts of both are for the most part such, as that they cannot consist or stand together at one time.

Reas. 2. Because the mind being distracted with such worldly business, cannot compose or settle it self in good order to perform solemn worship to God, as it ought.

Reas. 3. Because the taste, and savour, and power of holy exercises is impaired, and dulled at least, or blunted by mixture of such things with them, which in comparison should be but vile to them.

Use Is of Reproof, of such as easily break the rest of this day, either by their ordinary and vulgar occupations; or with merchandizes, or with sports or plays, or with troublesome and long feastings on it, &amp;c.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Substance of Christian Religion: Or, A Plain and Easy Draught of the Christian Catechism, in LII. Lectures, on chosen texts of Scripture, for each Lord’s-Day of the Year, Learnedly and Perspicuously Illustrated with Doctrines, Reasons and Uses</cite>, (London: Thomas Davies, 1659), Lecture XXXVIII, pp 232-33.</span></figcaption>

<blockquote><p>There may be therefore two heads of superstition. §5.

1. Negative, when men abstain from some things under a notion of religion, or worship of God, which are not forbidden by God, but left free and indifferent: either not forbidden, or, if once they were, now [they are] antiquated, or outdated… And of this sort was that, Col. 2:21, ‘Touch not, taste not, handle not;’ which was superstitious negative will-worship. §6.

2. Positive, when men of their own hearts and heads set up ways of religion, to worship God by, which He never commanded; and this (as was said) may be committed against any of the four first Commandments… Now this positive superstition may be exemplified in many particulars…</p></blockquote>

<blockquote><p>…the most part of men have some form in worshipping God and please themselves in it so well that they think God well-pleased with it; but few there are who know indeed what it is to worship Him in a manner acceptable to his majesty: Now you know it is all one not to worship Him at all, as not to worship Him in that way He likes to be worshipped: Therefore the most part of men are but self-worshippers, because they please none but themselves in it, it is not the worship his soul has chosen, but their own invention, for you must take this as an undeniable ground, that God must be worshipped according to his own will and pleasure, and not according to your humor, or invention; therefore his soul abhors will-worship, devised by men out of ignorant zeal, or superstition, though there might seem much devotion in it, and much affection to God, as in the Israelites sacrificing their children, what more seeming self-denial? And yet what more real self-idolatry; God owns not such a service, for it is not service and obedience to his will and pleasure, but to men’s own will and humor: therefore a man must not look for a reward but from Himself. Now it is not only will-worship when the matter and substance of the worship is not commanded of God, but also when a commanded worship is not discharged in the appointed manner: Therefore, O how few true worshippers will the Father find? True worship must have truth for the substance and spirit for the manner of it: else it is not such a worship as the Father seeks and will be pleased with; divine worship must have truth in it, that is plain, but what was that truth, it must be conformed to the rule and pattern of worship, which is God’s will and pleasure revealed in the word of truth, true worship is the very practice of the word of truth, it caries the image and superscription and command upon it, which is a necessary ingredient in it, and constituent of it. Therefore if thy service have the image of thy own will stamped on it, it is not divine worship, but will-worship. Thus all human ceremonies and ordinances enjoined for service of God, carry the inscription not of God, but of man who is the author and original of them, and so are but adulterated and false coin, that will not pass current with God…</p></blockquote>

<blockquote><p>ALTHOUGH I am persuaded that nothing hath a greater Tendency to strengthen the Hands of Infidels, than the too frequent Altercations between the Professors of Christianity; yet there are certain Occasions wherein the necessary Defence of the Principles of our holy Religion, as well as the Practice of it, renders public Remonstrances of the greatest Use and Importance. The sacred Pages afford us many Examples of this Nature.

When Aaron was prevailed on by the Israelites to make a golden Calf, and offer Sacrifice to it, what a holy Indignation did Moses express both against him and them! — When Peter and Barnabas were carried away with the Dissimulation of the Jews, how openly did the Apostle Paul withstand them to the Face and reprove them before all, because they were to be blamed! and when this same Apostle saw the Churches of Corinth and Galatia in Danger of being drawn away from the Simplicity of the Gospel, what a fervent Testimony did he bear against the Authors and Abetters of such a destructive Scheme.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-whitefield.html">George Whitefield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An expostulatory letter addressed to Nicholas Lewis, Count Zinzendorff, and lord advocate of the Unitas Fratrum</cite>, (3rd edn, Philadelphia: William Bradford, 1753), pp 3-4.</span></figcaption>

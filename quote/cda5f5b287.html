<main class="wrap"><figure class="quote" id="q-cda5f5b287" data-kw="">
<blockquote><p>XI. But whatever may be said about this diversity of opinions in the Roman school, all its doctors agree on this, as has often been stated:

      1. That some form of worship is to be given to images of Christ and the saints.

      2. That this worship can rightly be signified by the term “adoration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Veneration of Images, Angels &amp; Saints tr. by AI by WesternCatholike | The Roman Church’s Doctrine on the Veneration &amp; Adoration of Images 1</span></figcaption>

</figure><figure class="quote" id="q-af00fdcfb0" data-kw="">
<blockquote><p>It is true, likewise, that God directed his people under the Law to bend and bow themselves toward the ark and the temple, wherein the ark was, and the mountain whereon the temple was situate: partly lest that rude people should turn their worship another way, partly because of his promise to hear them when they should pray toward the temple or the ark; partly because of his singular manner of presence in the ark: He was said to dwell between the cherubims, the ark is called his ‘foot-stool,’ and sometime the ‘face of God,’ ‘the glory of the Lord.’ It is reason, where God is present after an extraordinary manner, as when He spake out of the bush and the cloud, that adoration be directed to the place of his extraordinary presence. The altars, the offerings and other holy things wanted [lacked] the like presence and the like promise. The ark and the cherubims upon the ark were not seen [being in the Holy of Holies]: and therefore could not be readily abused to idolatry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-calderwood.html">David Calderwood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Perth Assembly</cite>, … (Leiden, 1619), ‘Kneeling considered, as it is a Breach of the Second Commandment’, p. 51</span></figcaption>

<blockquote><p>Again, their idolatry is manifest, in that they worship God in, at, or before images; having no commandment so to do, but the contrary. They allege that they use and worship images only in a remembrance of God. But this is all one as if an unchaste wife should receive many lovers into her house in the absence of her husband and, being reproved, should answer that they were the friends of her husband and that she kept them only in remembrance of him.</p></blockquote>

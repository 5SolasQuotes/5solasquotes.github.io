<blockquote><p>There are five Arguments of consolation to the Justified, who bewail the imperfection of their own obedience.

Become dead] Argum. 1. You are freed from the Covenant of Works, which admits no obedience besides what is perfect, and every way complete: Therefore all you that are Justified have consolation, which bewail the imperfection of your new obedience.

Of another] Argum 2. You are now married to another Husband, viz. to Christ, who is raised from the dead, who when he could answer the imperfections of your obedience, and (according to the Covenant of Grace) render your begun obedience acceptable unto God, he took it upon himself: You have this consolation that mourn over the imperfections of your new obedience.

Fruit] Argum. 3. Ye are married unto Christ, which is raised from the dead, that you may not abide unfruitful, but may bring forth fruit to the glory of God: Therefore take ye comfort, who bewail your imperfect obedience.

Argum. 4. Confirming the former, from the change of our condition, while we were unregenerate (and by consequence under a Law-Covenant) evil affections by the holy Law of God were stirred up, and put forth themselves powerfully in our members, and all our faculties both of soul and body, to the production of the deadly fruit of actual sin:

Therefore it will follow, when we are now regenerated, and under the Covenant of Grace, holy desires stirred up by the New Covenant, powerfully shew forth themselves in our members, to the bringing forth the fruit of good works unto God, that we might not abide unfruitful. Which is no small consolation; for if we by Faith would lay hold upon the Covenant of Grace, and would stir up our souls by the promises thereof applied unto us, there is no doubt but we should more plentifully bring forth good works; That is it which Christ saith, Joh. 15.5. I am the vine, ye are the branches, he that abides in me, and I in him, he brings forth much fruit: for without me you can do nothing.

Argum. 5. Opening and confirming the former, from the end of our changed condition, Now, to wit, after Justification, through the Grace of Christ we are freed from the Law-Covenant (that Covenant being dead in which we were held, or we being dead in Christ, in whom we were contained judicially) to that very end, that we should serve God, by the power of the Holy Ghost, bestowing new strength upon us, by bringing forth new and spiritual fruit, not superficial and hypocritical, which the letter of the old legal Covenant (now abolished) at the most, brought forth:

Therefore God will not fail of his end, but will cause those that are justified, bewailing their imperfect obedience, to bring forth much fruit in the newness of the letter, for the fruits which are brought forth by virtue of the Covenant of Grace, are truly new, and arise from the regenerating Spirit, furnishing us with new strength forthwith to good works; But the fruits which are brought forth by virtue of the Covenant of Works, either are open rebellion of corrupt Nature against God’s Law, or counterfeit obedience only in the outward performance; such as the fruits of the Pharisees are, who in the letter, that is, the outward shew, and formality obeyed, without any renovation of the heart.</p></blockquote>

<blockquote><p>All spiritual blessings are procured for us. The blessedness of a Christian lieth in these three things: in pardon, grace, and glory; in justification, sanctification, and glorification. And all these are confirmed by Christ’s being risen, and taken from prison and from judgment.

(1.) For pardon or justification. If any one sin had remained unsatisfied for, Christ could not have risen; every sin must be expiated with death: Rom. 6:23, ‘The wages of [every] sin is death;’ and Christ would fulfil every tittle of the law, Mat. 5:18. But seeing he is got free, you may be sure he hath paid the wages of every sin 1 Cor. 15:17, ‘If Christ be not risen, your faith is vain, ye are yet in your sins.’ While the surety is in prison, it is a sign the debt is not satisfied; but your surety is taken from prison and from judgment. Be of good comfort, all is paid: Rom. 4:25, ‘Who was delivered for our offences, and was raised again for our justification.’ God had him to prison for the debt of the creatures, and took him from prison and from judgment for their comfort, and that they might be persuaded of his satisfaction.

(2.) For the grace of sanctification; he rose that he might purchase the Spirit to raise us from the death of sin to the life of grace: Rom. 6:4, ‘That like as Christ was raised up from the dead by the glory of the Father, even so we also should walk in newness of life.’ By the same glory of the Father both is done, that is, by the same glorious power that raised Jesus from the dead: Phil. 3:10, the apostle speaketh of the power of Christ’s resurrection, that is, the virtue that goeth out from it unto believers.

(3.) Glorification. Christ rose before us to open the way; and therefore he is called ‘the first-fruits of them that slept,’ 1 Cor. 15:20. Others rise as a single ear of corn, but Christ as the first-fruits. The first-fruits were consecrated in lieu of all the rest; so is Christ in your stead: Col. 1:18, Christ is called ‘the first-born from the dead;’ that is, the chiefest, and one that rose for us all,—the first that entered into heaven as a common person. There was a resurrection of some before the glorification of Christ’s body, but he was the first-born that stood for all: Heb. 6:20, ‘Whither the forerunner is for us entered.’ Jesus Christ is our forerunner, his resurrection doth make way for us to rise after him; he is our harbinger that is gone before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Exposition upon the Fifty-Third Chapter of Isaiah</cite>, (1703) in The Complete Works of Thomas Manton, D.D. (22 vols, London: James Nisbet &amp; Co., 1871), 3: 350-51.</span></figcaption>

<blockquote><p>Thus the divine will is also called that which God wants done [voluntas signi], because it signifies what is acceptable to god; what He wants done by us. It is called ‘consequent’ because it follows that eternal antecedent; ‘conditional’ because the commandments, prohibitions, warnings, and promises of God all have a condition of obedience or disobedience attached to them. Finally it is called ‘revealed,’ because it is always explained in the word of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Compendium of Christian Doctrine, pt. 1 in</cite>, ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 3, (3), proposition 2, p. 48</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Thus the divine will is also called that which God wants done [voluntas signi], because it signifies what is acceptable to god; what He wants done by us. It is called ‘consequent’ because it follows that eternal antecedent; ‘conditional’ because the commandments, prohibitions, warnings, and promises of God all have a condition of obedience or disobedience attached to them. Finally it is called ‘revealed,’ because it is always explained in the word of God.”

— Johannes Wollebius, Compendium of Christian Doctrine, pt. 1 in, ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 3, (3), proposition 2, p. 48">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThus+the+divine+will+is+also+called+that+which+God+wants+done+%5Bvoluntas+signi%5D%2C+because+it+signifies+what+is+acceptable+to+god%3B+what+He+wants+done+by+us.+It+is+called+%E2%80%98consequent%E2%80%99+because+it+follows+that+eternal+antecedent%3B+%E2%80%98conditional%E2%80%99+because+the+commandments%2C+prohibitions%2C+warnings%2C+and+promises+of+God+all+have+a+condition+of+obedience+or+disobedience+attached+to+them.+Finally+it+is+called+%E2%80%98revealed%2C%E2%80%99+because+it+is+always+explained+in+the+word+of+God.%E2%80%9D%0A%0A%E2%80%94+Johannes+Wollebius%2C+Compendium+of+Christian+Doctrine%2C+pt.+1+in%2C+ed.+John+Beardslee%2C+Reformed+Dogmatics%3A+J.+Wollebius%2C+G.+Voetius+%26+F.+Turretin+%28Oxford+Univ.+Press%2C+1965%29%2C+ch.+3%2C+%283%29%2C+proposition+2%2C+p.+48&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fca9e52e604.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ca9e52e604.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/faith-as-a-condition-instrument-of-justification/#:~:text=Thus%20the%20divine%20will%20is%20also,explained%20in%20the%20word%20of%20God&amp;text=Thus%20the%20divine%20will%20is%20also%20called%20that&amp;text=is%20always%20explained%20in%20the%20word%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Pauline doctrine of justification by faith alone, which we have just treated at considerable length, is, as we have seen, the very foundation of Christian liberty. It makes our standing with God dependent not at upon what we have done, but altogether upon what God has done. If our salvation depended upon what we have done, then, according to Paul we should still be bondslaves; we should still be endeavouring feverishly to keep God’s law so well that at the end we might possibly win His favour. It would be a hopeless endeavour because of the deadly guilt of sin; we should be like debtors endeavouring to pay, but in the very effort getting deeper and deeper into debt. But as it is, in accordance with the gospel, God has granted us His favour as an absolutely free gift; He has brought us in right relation to Himself not on the basis of any merit of ours, but altogether on the basis of the merit of Christ. Great is the guilt of our sins; but Christ took it all upon Himself not on the basis of any merit of ours, but altogether on the basis of the merit of Christ. Great is the guilt of our sins; but Christ took it all upon Himself when he died for us on Calvary. We do not need, then, to make ourselves good before we become God’s children; but we can come to God just as we are, all laden with our sins, and be quite certain that the guilt of sin will be removed and that we shall be received. When God looks upon us, to receive us or to cast us off, it is not we that He regards but our great Advocate, Christ Jesus the Lord. Such is the glorious certainty of the gospel. The salvation of the Christian is certain because it depends altogether upon God; if it depended in slightest measure upon us, the certainty of it would be gone. Hence appears the vital importance of the great Reformation doctrine of justification by faith alone; that doctrine is at the very centre of Christianity. It means that acceptance with God is not something that we earn; it is not something that is subject to the wretched uncertainties of human endeavour; but it is a free gift of God. It may seem strange that we should be received by the holy God as His children; but God has chosen to receive us; it has been done on His responsibility not ours; He has a right to receive whom He will into His presence; and in the mystery of His grace He has chosen to receive us. That central doctrine of the Christian faith is really presupposed in the whole New Testament; but it is made particularly plain the Epistles of Paul.</p></blockquote>

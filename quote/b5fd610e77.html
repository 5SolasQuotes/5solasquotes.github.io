<main class="wrap"><figure class="quote" id="q-b5fd610e77" data-kw="">
<blockquote><p>And when the Scripture assures us that it was their practice to use Psalms and Hymns, and spiritual songs, praising God and praying unto Him in the words of David… And when we all account it our duty to praise God in singing David’s Psalms, some of which, as we use them [in the psalters they had], are of a mean composure and carry expressions beneath the majesty of Scripture; others, such as concerned the Jewish Church only; why ought not the apostles, and we as necessarily, to use this form of prayer sanctified by our Savior’s own lips?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-long.html">Thomas Long</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation Concerning the Frequent Use of our Lord’s Prayer in the public Worship of God and a view of what hath been said by Mr</cite>, [John] Owen concerning that subject (London, 1658), p. 42-3</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-653b7211b4" data-kw="">
<blockquote><p>It is storied of Caius Marius Victorius, who lived about three hundred years after Christ, and to his old age continued a Pagan; but at last being convinced of the Christian verity, he came to Simplicianus, and told him he would be a Christian; but neither he nor the church could believe it, it being so rare an example for any to be converted at his age; but at last seeing it was real, there was a shouting and gladness, and singing of psalms in all churches; the people crying, Caius Marius Victorius. is become a Christian!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God</cite>, vol. 1; vol. 5, ‘Husbandry Spiritualized’, p. 120</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-a97bc1325f" data-kw="">
<blockquote><p>And in your meetings to make merry, let your mirth be showed forth in psalms, singing as well with instrument as with voice; also with hymns of thanksgiving for benefits received; and for further variety against irksomeness, which our nature easily falleth into, with songs of praising God for his noble acts; all spiritual unto the Lord…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Colossians</cite>, (d. 1603; rep. Edinburgh, 1864), Sermon 26, on Col. 3:16-17, p. 54, lt. col.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><figure class="quote" id="q-395d8ecd70" data-kw="">
<blockquote><p>Towards God the duty is set down, that when we are merry and cheerful, to sing psalms and hymns unto God, ver. 16. And therefore St. James saith, chap. 5:13, ‘if any be merry, let him sing psalms ;’ … …a hymn, is a song of thanksgiving for a benefit received, and therefore our Savior, after his supper, sang an hymn, Mt. 26:30, viz., for a particular benefit. Lastly, a song is a more general thing than either the psalm or hymn, viz., wherein we give thanks, not for particular benefits, but for general blessings received at God’s hands, as when David praised the Lord for the works of creation, as the heavens, etc., Ps. 104… Use. These must be spiritual songs, viz. holy psalms and songs, not profane and wicked love-songs…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cartwright.html">Thomas Cartwright</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Colossians</cite>, (d. 1603; rep. Edinburgh, 1864), Sermon 26, on Col. 3:16-17, p. 55, rt. col.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

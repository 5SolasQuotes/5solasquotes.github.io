<main class="wrap"><figure class="quote" id="q-40a18ab869" data-kw="">
<blockquote><p>It [assurance] is an intelligent and enlightened persuasion. “I know—and am persuaded,” says the apostle. How, and whence he knew this, will afterwards be noticed; in the mean time, it is proper to observe at the very outset, that he bases his persuasion on knowledge. What is said of it in all the riches of its full-grown strength, is true of it in its greenest and least advanced state—it is the “assurance of understanding.” It differs essentially and totally from all blind impulses, all enthusiastic imaginations, all sudden impressions made on the mind, but of which the person can give no intelligent or satisfactory account.

It is not the result of dreams or visions. It is not produced by immediate suggestions of the Spirit. It is not grafted on texts of Scripture ill-understood, and broken off from their connexion, which have been forcibly injected into the mind, or selected by a kind of spiritual lottery. “This persuasion cometh not of him that calleth you,” Christian; but is to be suspected of delusion, nourishing pride and self-conceit, and creating a fanciful and presumptuous confidence, accompanied with a feverish tumult in the affections, which bursts out into extravagance of sentiment and irregularity of conduct, and then gradually subsides and sinks to the point of freezing indifference and incredulity.

Genuine Christian assurance proceeds from spiritual illumination by means of the word of God. It is the effect of the Spirit’s “opening the understanding to understand the Scriptures,” and to know what they testify of Christ. “The God of our Lord Jesus Christ, the Father of glory, give unto you the Spirit of wisdom and revelation in the knowledge of Christ, that ye may know what is the hope of his calling, and what the riches of the glory of his inheritance.” “We have known and believed the love of God to us.” “The Son of God is come and hath given us an understanding that we may know him that is true.”

Faith is the act of an enlightened mind. The convinced sinner does not commit himself to the Saviour blindly, or in ignorance of his revealed character and qualifications. The weakest believer is always ready to give “a reason of the hope that is in him.” He cannot answer all the cavils of adversaries, but he can maintain his cause with the words of truth and soberness, and sometimes silence the caviller, by the reply of the man whose eyes the Lord opened, “Whether what you allege be true or no, I know not; but one thing I know, that whereas I was blind, now I see.” This persuasion is coolly formed, and cautiously expressed, and it is so because it is enlightened.

The Christian, especially at his first believing, is apt to suspect his perceptions, however clear and satisfactory, and to check his assurance, until he has dispassionately examined its grounds, and allowed the transport of his mind to subside. He is apt to go to the opposite extreme from the enthusiast: the latter is presumptuous, the former is jealous and diffident; the latter is satisfied with too little evidence, the former requires too much; the latter mistakes visions for realities, the former, like Thomas of old, suspects the reality to be a vision.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Assurance in Sermons</cite></span></figcaption>

<blockquote><p>Such as truly believe in Christ, and endeavour to walk in all good conscience before him (1 John 2:3), may, without extraordinary revelation, by faith grounded upon the truth of God’s promises, and by the Spirit enabling them to discern in themselves those graces to which the promises of life are made (1 Cor. 2:12; 1 John 3:14, 18–19, 21, 24; 4:13, 16; Heb. 6:11–12), and bearing witness with their spirits that they are the children of God (Rom. 8:16), be infallibly assured that they are in the estate of grace, and shall persevere therein unto salvation (1 John 5:13).</p></blockquote>

<blockquote><p>Remedy (1). The first remedy against this device of Satan is, solemnly to consider, That there may be true faith, yea, great measures of faith, where there is no assurance. The Canaanite woman in the Gospel had strong faith, yet no assurance that we read of. ‘These things have I written unto you,’ saith John, ‘that believe on the name of the Son of God, that ye may know that ye have eternal life, and that ye may believe on the name of the Son of God,’ 1 John v. 13.

In these words you see that they did believe, and had eternal life, in respect of the purpose and promise of God, and in respect of the seeds and beginnings of it in their souls, and in respect of Christ their head, who sits in heaven as a public person, representing all his chosen ones, ‘Who hath raised us up together, and made us sit together in heavenly places in Christ Jesus,’ Eph. ii. 6; and yet they did not know that they had eternal life. It is one thing to have a right to heaven, and another thing to know it; it is one thing to be beloved, and another thing for a man to know that he is beloved.

It is one thing for God to write a man’s name in the book of life, and another thing for God to tell a man that his name is written in the book of life; and to say to him, Luke x. 20, ‘Rejoice, because thy name is written in heaven.’ So Paul, ‘In whom ye also trusted, after ye heard the word of truth, the gospel of your salvation: in whom also, after ye believed, ye were sealed with that Holy Spirit of promise,’ Eph. i. 1 3. So Micah: ‘Rejoice not against me, O my enemy: for when I shall fall, I shall rise; when I shall sit in darkness, the Lord shall be a light unto me. I will bear the indignation of the Lord, because I have sinned,’ &amp;c., or, ‘the sad countenance of God,’ as the Hebrew hath it, Micah vii. 8, 9. This soul had no assurance, for he sits in darkness, and was under the sad countenance of God; and yet had strong faith, as appears in those words, ‘ When I fall, I shall rise; when I sit in darkness, the Lord shall be a light unto me.’ He will bring me forth to the Light, and I shall behold his righteousness. And let this suffice for the first answer.

Remedy (2). The second remedy against this device of Satan is, solemnly to consider, That God in the Scripture doth define faith otherwise. God defines faith to be a receiving of Christ—’As many as received him, to them he gave this privilege, to be the sons of God,’ John i. 12. ‘To as many as believed on his name,’ Acts xi. 23 — to be a cleaving of the soul unto God, though no joy, but afflictions, attend the soul. Yea, the Lord defines faith to be a coming to God in Christ, and often to a resting and staying, rolling of the soul upon Christ. It is safest and sweetest to define as God defines, both vices and graces. This is the only way to settle the soul, and to secure it against the wiles of men and devils, who labour, by false definitions of grace, to keep precious souls in a doubting, staggering, and languishing condition, and so make their lives a burden, a hell, unto, them.

Remedy (3). The third remedy against this device of Satan is, seriously to consider this, That there may be true faith where there is much doublings. Witness those frequent sayings of Christ to his disciples, ‘Why are ye afraid, O ye of little faith?’ Persons may be truly believing who nevertheless are sometimes doubting. In the same persons that the fore-mentioned scriptures speak of, you may see their faith commended and their doubts condemned, which doth necessarily suppose a presence of both.

Remedy (4). The fourth remedy against this device of Satan is, solemnly to consider, That assurance is an effect of faith; therefore it cannot be faith. The cause cannot be the effect, nor the root the fruit. As the effect flows from the cause, the fruit from the root, the stream from the fountain, so doth assurance flow from faith. This truth I shall make good thus: The assurance of our salvation and pardon of sin doth primarily arise from the witness of the Spirit of God that we are the children of God, Eph. i. 13; and the Spirit never witnesseth this till we are believers: ‘For we are sons by faith in Christ Jesus,’ Gal. iv. 6. Therefore assurance is not faith, but follows it, as the effect follows the cause. Again, no man can be assured and persuaded of his salvation till he be united to Christ, till he be ingrafted into Christ; and a man cannot be ingrafted into Christ till he hath faith. He must first be ingrafted into Christ by faith before he can have assurance of his salvation; which doth clearly evidence, that assurance is not faith, but an effect and fruit of faith, &amp;c.

Again, faith cannot be lost, but assurance may; therefore assurance is not faith. 1 Though assurance be a precious flower in the garden of a saint, and is more infinitely sweet and delightful to the soul than all outward comforts and contents; yet it is but a flower that is subject to fade, and to lose its freshness and beauty, as saints by sad experience find, &amp;c.

Again, a man must first have faith before he can have assurance, therefore assurance is not faith. And that a man must first have faith before he can have assurance, is clear by this, a man must first be saved before he can be assured of his salvation; for he cannot be assured of that which is not. And a man must first have a saving faith before he can be saved by faith, for he cannot be saved by that which he hath not; therefore a man must first have faith before he can have assurance, and so it roundly follows that assurance is not faith, &amp;c.</p></blockquote>

Remedy (3). The third remedy against this device of Satan is, seriously to consider this, That there may be true faith where there is much doublings. Witness those frequent sayings of Christ to his disciples, ‘Why are ye afraid, O ye of little faith?’ Persons may be truly believing who nevertheless are sometimes doubting. In the same persons that the fore-mentioned scriptures speak of, you may see their faith commended and their doubts condemned, which doth necessarily suppose a presence of both.

Remedy (4). The fourth remedy against this device of Satan is, solemnly to consider, That assurance is an effect of faith; therefore it cannot be faith. The cause cannot be the effect, nor the root the fruit. As the effect flows from the cause, the fruit from the root, the stream from the fountain, so doth assurance flow from faith. This truth I shall make good thus: The assurance of our salvation and pardon of sin doth primarily arise from the witness of the Spirit of God that we are the children of God, Eph. i. 13; and the Spirit never witnesseth this till we are believers: ‘For we are sons by faith in Christ Jesus,’ Gal. iv. 6. Therefore assurance is not faith, but follows it, as the effect follows the cause. Again, no man can be assured and persuaded of his salvation till he be united to Christ, till he be ingrafted into Christ; and a man cannot be ingrafted into Christ till he hath faith. He must first be ingrafted into Christ by faith before he can have assurance of his salvation; which doth clearly evidence, that assurance is not faith, but an effect and fruit of faith, &amp;c.

Again, faith cannot be lost, but assurance may; therefore assurance is not faith. 1 Though assurance be a precious flower in the garden of a saint, and is more infinitely sweet and delightful to the soul than all outward comforts and contents; yet it is but a flower that is subject to fade, and to lose its freshness and beauty, as saints by sad experience find, &amp;c.

Again, a man must first have faith before he can have assurance, therefore assurance is not faith. And that a man must first have faith before he can have assurance, is clear by this, a man must first be saved before he can be assured of his salvation; for he cannot be assured of that which is not. And a man must first have a saving faith before he can be saved by faith, for he cannot be saved by that which he hath not; therefore a man must first have faith before he can have assurance, and so it roundly follows that assurance is not faith, &amp;c.”

— Thomas Brooks, Precious Remedies Against Satan’s Devices, (1676) in The Works of Thomas Brooks, ed. Alexander B. Grossart (6 vols, Edinburgh: James Nichol, 1861-67), 1: 95-97.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CRemedy+%281%29.+The+first+remedy+against+this+device+of+Satan+is%2C+solemnly+to+consider%2C+That+there+may+be+true+faith%2C+yea%2C+great+measures+of+faith%2C+where+there+is+no+assurance.+The+Canaanite+woman+in+the+Gospel+had+strong+faith%2C+yet+no+assurance+that+we+read+of.+%E2%80%98These+things+have+I+written+unto+you%2C%E2%80%99+saith+John%2C+%E2%80%98that+believe+on+the+name+of+the+Son+of+God%2C+that+ye+may+know+that+ye+have+eternal+life%2C+and+that+ye+may+believe+on+the+name+of+the+Son+of+God%2C%E2%80%99+1+John+v.+13.%0A%0AIn+these+words+you+see+that+they+did+believe%2C+and+had+eternal+life%2C+in+respect+of+the+purpose+and+promise+of+God%2C+and+in+respect+of+the+seeds+and+beginnings+of+it+in+their+souls%2C+and+in+respect+of+Christ+their+head%2C+who+sits+in+heaven+as+a+public+person%2C+representing+all+his+chosen+ones%2C+%E2%80%98Who+hath+raised+us+up+together%2C+and+made+us+sit+together+in+heavenly+places+in+Christ+Jesus%2C%E2%80%99+Eph.+ii.+6%3B+and+yet+they+did+not+know+that+they+had+eternal+life.+It+is+one+thing+to+have+a+right+to+heaven%2C+and+another+thing+to+know+it%3B+it+is+one+thing+to+be+beloved%2C+and+another+thing+for+a+man+to+know+that+he+is+beloved.%0A%0AIt+is+one+thing+for+God+to+write+a+man%E2%80%99s+name+in+the+book+of+life%2C+and+another+thing+for+God+to+tell+a+man+that+his+name+is+written+in+the+book+of+life%3B+and+to+say+to+him%2C+Luke+x.+20%2C+%E2%80%98Rejoice%2C+because+thy+name+is+written+in+heaven.%E2%80%99+So+Paul%2C+%E2%80%98In+whom+ye+also+trusted%2C+after+ye+heard+the+word+of+truth%2C+the+gospel+of+your+salvation%3A+in+whom+also%2C+after+ye+believed%2C+ye+were+sealed+with+that+Holy+Spirit+of+promise%2C%E2%80%99+Eph.+i.+1+3.+So+Micah%3A+%E2%80%98Rejoice+not+against+me%2C+O+my+enemy%3A+for+when+I+shall+fall%2C+I+shall+rise%3B+when+I+shall+sit+in+darkness%2C+the+Lord+shall+be+a+light+unto+me.+I+will+bear+the+indignation+of+the+Lord%2C+because+I+have+sinned%2C%E2%80%99+%26c.%2C+or%2C+%E2%80%98the+sad+countenance+of+God%2C%E2%80%99+as+the+Hebrew+hath+it%2C+Micah+vii.+8%2C+9.+This+soul+had+no+assurance%2C+for+he+sits+in+darkness%2C+and+was+under+the+sad+countenance+of+God%3B+and+yet+had+strong+faith%2C+as+appears+in+those+words%2C+%E2%80%98+When+I+fall%2C+I+shall+rise%3B+when+I+sit+in+darkness%2C+the+Lord+shall+be+a+light+unto+me.%E2%80%99+He+will+bring+me+forth+to+the+Light%2C+and+I+shall+behold+his+righteousness.+And+let+this+suffice+for+the+first+answer.%0A%0ARemedy+%282%29.+The+second+remedy+against+this+device+of+Satan+is%2C+solemnly+to+consider%2C+That+God+in+the+Scripture+doth+define+faith+otherwise.+God+defines+faith+to+be+a+receiving+of+Christ%E2%80%94%E2%80%99As+many+as+received+him%2C+to+them+he+gave+this+privilege%2C+to+be+the+sons+of+God%2C%E2%80%99+John+i.+12.+%E2%80%98To+as+many+as+believed+on+his+name%2C%E2%80%99+Acts+xi.+23+%E2%80%94+to+be+a+cleaving+of+the+soul+unto+God%2C+though+no+joy%2C+but+afflictions%2C+attend+the+soul.+Yea%2C+the+Lord+defines+faith+to+be+a+coming+to+God+in+Christ%2C+and+often+to+a+resting+and+staying%2C+rolling+of+the+soul+upon+Christ.+It+is+safest+and+sweetest+to+define+as+God+defines%2C+both+vices+and+graces.+This+is+the+only+way+to+settle+the+soul%2C+and+to+secure+it+against+the+wiles+of+men+and+devils%2C+who+labour%2C+by+false+definitions+of+grace%2C+to+keep+precious+souls+in+a+doubting%2C+staggering%2C+and+languishing+condition%2C+and+so+make+their+lives+a+burden%2C+a+hell%2C+unto%2C+them.%0A%0ARemedy+%283%29.+The+third+remedy+against+this+device+of+Satan+is%2C+seriously+to+consider+this%2C+That+there+may+be+true+faith+where+there+is+much+doublings.+Witness+those+frequent+sayings+of+Christ+to+his+disciples%2C+%E2%80%98Why+are+ye+afraid%2C+O+ye+of+little+faith%3F%E2%80%99+Persons+may+be+truly+believing+who+nevertheless+are+sometimes+doubting.+In+the+same+persons+that+the+fore-mentioned+scriptures+speak+of%2C+you+may+see+their+faith+commended+and+their+doubts+condemned%2C+which+doth+necessarily+suppose+a+presence+of+both.%0A%0ARemedy+%284%29.+The+fourth+remedy+against+this+device+of+Satan+is%2C+solemnly+to+consider%2C+That+assurance+is+an+effect+of+faith%3B+therefore+it+cannot+be+faith.+The+cause+cannot+be+the+effect%2C+nor+the+root+the+fruit.+As+the+effect+flows+from+the+cause%2C+the+fruit+from+the+root%2C+the+stream+from+the+fountain%2C+so+doth+assurance+flow+from+faith.+This+truth+I+shall+make+good+thus%3A+The+assurance+of+our+salvation+and+pardon+of+sin+doth+primarily+arise+from+the+witness+of+the+Spirit+of+God+that+we+are+the+children+of+God%2C+Eph.+i.+13%3B+and+the+Spirit+never+witnesseth+this+till+we+are+believers%3A+%E2%80%98For+we+are+sons+by+faith+in+Christ+Jesus%2C%E2%80%99+Gal.+iv.+6.+Therefore+assurance+is+not+faith%2C+but+follows+it%2C+as+the+effect+follows+the+cause.+Again%2C+no+man+can+be+assured+and+persuaded+of+his+salvation+till+he+be+united+to+Christ%2C+till+he+be+ingrafted+into+Christ%3B+and+a+man+cannot+be+ingrafted+into+Christ+till+he+hath+faith.+He+must+first+be+ingrafted+into+Christ+by+faith+before+he+can+have+assurance+of+his+salvation%3B+which+doth+clearly+evidence%2C+that+assurance+is+not+faith%2C+but+an+effect+and+fruit+of+faith%2C+%26c.%0A%0AAgain%2C+faith+cannot+be+lost%2C+but+assurance+may%3B+therefore+assurance+is+not+faith.+1+Though+assurance+be+a+precious+flower+in+the+garden+of+a+saint%2C+and+is+more+infinitely+sweet+and+delightful+to+the+soul+than+all+outward+comforts+and+contents%3B+yet+it+is+but+a+flower+that+is+subject+to+fade%2C+and+to+lose+its+freshness+and+beauty%2C+as+saints+by+sad+experience+find%2C+%26c.%0A%0AAgain%2C+a+man+must+first+have+faith+before+he+can+have+assurance%2C+therefore+assurance+is+not+faith.+And+that+a+man+must+first+have+faith+before+he+can+have+assurance%2C+is+clear+by+this%2C+a+man+must+first+be+saved+before+he+can+be+assured+of+his+salvation%3B+for+he+cannot+be+assured+of+that+which+is+not.+And+a+man+must+first+have+a+saving+faith+before+he+can+be+saved+by+faith%2C+for+he+cannot+be+saved+by+that+which+he+hath+not%3B+therefore+a+man+must+first+have+faith+before+he+can+have+assurance%2C+and+so+it+roundly+follows+that+assurance+is+not+faith%2C+%26c.%E2%80%9D%0A%0A%E2%80%94+Thomas+Brooks%2C+Precious+Remedies+Against+Satan%E2%80%99s+Devices%2C+%281676%29+in+The+Works+of+Thomas+Brooks%2C+ed.+Alexander+B.+Grossart+%286+vols%2C+Edinburgh%3A+James+Nichol%2C+1861-67%29%2C+1%3A+95-97.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1183b5d442.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1183b5d442.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/06/06/thomas-brooks-on-the-difference-between-faith-and-assurance/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

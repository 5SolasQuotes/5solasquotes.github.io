<main class="wrap"><figure class="quote" id="q-7fe483e537" data-kw="">
<blockquote><p>For as our own salvation is, so verily is altogether the salvation of our children of the mere election and mercy of God, which oftentimes goes together with natural propagation. Weigh with thyself, that even they be elected of God which be also born of saints, as we saw it came to pass in Isaac… Not that it doth always so happen of necessity: because the promise is not general as touching all the seed, but of that only in which the election together consents. Otherwise the posterity of Ishmael and Esau were of Abraham. But because we ought not to be over-curious of searching out the secret providence and election of God, therefore we judge the children of the saints to be saints, so long as by reason of their age, shall not declare themselves strangers from Christ. We exclude them not from the Church, but embrace them as members thereof, hoping well, that as they be the seed of the saints according to the flesh, so also they be partakers of the divine election, &amp; that they have the Holy Ghost and grace of Christ: and for this cause we baptize them. Neither must they be heard [e.g. Anabaptists] which move a doubt of this matter and say: What if the minister be deceived; And what if for a very truth, the child be not the child of promise, of divine election and of mercy? Because the same cavil may also be as touching them that be of lawful age [who are baptized]. For we also know not whether they come feigned, or whether they believe truly: whether they be the children of predestination, or of perdition; whether they have the grace of Christ, or whether they be destitute thereof, and do falsely say that they believe… And so not all, so many as are baptized, are either saved or predestinated unto eternal life. Neither can we by any other means discern between the baptized who belong unto salvation, and who be not the sons of God, but that we daily judge of them by their works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/common-places.html">Common Places</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 4 | Ch. 8, ‘Of baptism, baptizing of infants and the holiness of them’</cite>, p. 116</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2b86d55d86" data-kw="">
<blockquote><p>The faith demanded of parents in the formula of baptism is indefinite: this, to wit that godly persons’ infants are sanctified in Christ. And that faith is true, although there should be here and there an exception… That divine promise has a common truth, though God reserve to Himself, according to His own power and liberty, the exclusion of some infants. Faith… performs its office when it lays hold of the promise as it is given, and reverently leaves to God liberty of application. The believer is bound… to acquiesce in the promise given… and to trust in it, or, in the judgment of charity to hope well concerning this infant which is to be baptized— nay, to believe that this infant belongs to Christ, unless God, by a singular decision, wills its exclusion. The faith demanded of parents is not vain… though here and there one (of the infants) does not belong to the election… although there is not an internal baptizing of exactly all infants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/melchior-leydekker.html">Melchior Leydekker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Truth of the Reformed Faith &amp; of the Sanctity of the Same, in 3 Books, or a Commentary on the Palatinate Catechism (Utrecht, 1694), Lord’s Day 27, Q. 74, Annexum, p. 327. As trans. in Kraut</cite>, p. 27.</span></figcaption>

</figure><figure class="quote" id="q-c5636274b2" data-kw="">

</figure><figure class="quote" id="q-c8169f3d76" data-kw="">
<blockquote><p>All infants of Christians, even before baptism are holy, with a federal and external holiness, on account of which they ought to be reputed a part of the visible Church and people of God, and as federates be admitted to the seal of the Covenant. Some infants of Christians, even before Baptism, nay even in their mother’s womb, not indeed by nature, but by grace, are holy with an internal sanctity, and these infants are believers and regenerate… The internal sanctity is not necessarily conjoined with the federal, but in many infants and adults is separated from it. This we learn from the event; for those who were once sanctified never wholly lose their sanctity. … There is no need here of inferences or citations, to convince me. Of my own accord, and freely and expressly I confess, with [Zacharias] Ursinus and our other teachers, that not all who are baptized, whether adults or infants, become participants of the grace of Christ, for the election of God is most free: it is therefore a prerogative of the elect alone, which baptism seals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marc-frederic-wendelin.html">Marc Frederic Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Exercitations, 37.1,18-19 as translated in Charles P. Krauth, Infant Baptism and Infant Salvation in the Calvinistic system. A Review of Dr. Hodge’s Theology (Philadelphia: Lutheran Books Store, 1874)</cite>, p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>

n-of-infants-in-without-the-church/#:~:text=All%20infants%20of%20Christians%2C%20even%20before,the%20elect%20alone%2C%20which%20baptism%20seals." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-55aeaf294c" data-kw="">
<blockquote><p>And by the way I observe, you are apt to discourse of God’s infinite love towards them that perish amongst men, but of any such love towards them that perish amongst angels, not a word: yet it is as evident, that if any perish amongst angels, it is merely their own faults also: Nay, much more evident is this in the nation of angels than in the nation of men. For many thousand infants perish in original sin, for no personal original fault of their own, but for the transgression of Adam, and in that corruption which is naturally derived unto them from the loins of Adam, after that by his actual transgression he fell into the state of that corruption, which since from him is become hereditary unto us all. As for that miscarriage which makes all men obnoxious unto the wrath of God, and unto condemnation, we hold it impossible to be prevented. For original sin and Adam’s transgression is it, which you well know, cannot be prevented: Only God may have mercy on whom He will, even in despite of any actual miscarriage (which you dote upon as an only hinderer from grace) like as on the other side He hardens whom He will, in spite of all civil and moral good carriage found in the best of heathen men. This I speak according to the doctrine of Saint Paul…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discovery of Dr. Jackson’s Vanity… (London: Thorp, 1631), sect. 2</cite>, sect. 3, ch. 18, p. 641</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/salvation-of-infants-and-heathen.html">Salvation of Infants and Heathen</a></span></div>
<div class="actions"><button class="copy" data-copy="“And by the way I observe, you are apt to discourse of God’s infinite love towards them that perish amongst men, but of any such love towards them that perish amongst angels, not a word: yet it is as evident, that if any perish amongst angels, it is merely their own faults also: Nay, much more evident is this in the nation of angels than in the nation of men. For many thousand infants perish in original sin, for no personal original fault of their own, but for the transgression of Adam, and in that corruption which is naturally derived unto them from the loins of Adam, after that by his actual transgression he fell into the state of that corruption, which since from him is become hereditary unto us all. As for that miscarriage which makes all men obnoxious unto the wrath of God, and unto condemnation, we hold it impossible to be prevented. For original sin and Adam’s transgression is it, which you well know, cannot be prevented: Only God may have mercy on whom He will, even in despite of any actual miscarriage (which you dote upon as an only hinderer from grace) like as on the other side He hardens whom He will, in spite of all civil and moral good carriage found in the best of heathen men. This I speak according to the doctrine of Saint Paul…”

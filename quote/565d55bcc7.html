<main class="wrap"><figure class="quote" id="q-565d55bcc7" data-kw="">
<blockquote><p>FAITH, as it stands described and recommended in the Bible, is a firm and assured confidence in God, founded in the belief of the testimony he has given us in the history of the Bible; where we have his true character, instructed by sensible documents, his works and ways with men; particularly in the provision he has made, and the comprehensive promise and grant he hath given, of eternal life. This is rendered credible by the perfection, the faithfulness, and power, of the promiser; but especially by the pledge he has given of his wonderful grace and love to man in Jesus Christ, who is the foundation and surety of the promise.

This security is recommended, as a good ground of confidence, by the Spirit and power of God, and all the fullness of life being lodged in his hand; and as they appear to have been lodged there for this very purpose, that he might convey the promised blessing, spirit and life to us, this finishes the assurance. Hence it is obvious, that faith, or trust and confidence in God, must begin at Jesus Christ, the fare, and the only sure, foundation on which it can stand. And where faith in Christ is, there naturally and necessarily our faith and hope in God follow upon it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-riccaltoun.html">Robert Riccaltoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Essays on Several of the Doctrines of Revelation</cite>, in The Works of the Late Reverend Mr Robert Riccaltoun, Minister of the Gospel at Hobkirk (3 vols, Edinburgh: A. Murray &amp; J. Cochran, 1771-72), 1: 170-71.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-996cdeb453" data-kw="">
<blockquote><p>He [the religious hypocrite] is one that is partial in his goodness; zealous in lesser things, and remiss in greater. As Luther complained of some in his time, and our Saviour in his time, which strain at a gnat, and swallow a Camel. He is one that sweats only in some part, but is cool in all the rest, which is a sign his zeal is distempered.

He is zealous against a Ceremony, a Relique or painted Glass, (not that I plead for these) but in the mean time lives in known sin; Lying, Cozening, Extortion, &amp;c. Just as the High Priests, It is not lawful, say they, to put the money into the Treasury, because it is the price of blood.

They speak like conscientious men. Oh do not defile the treasury! But let me ask the question, Why did they shed that blood it was innocent blood. They will not take the price of blood into the treasury, but they never scruple to take the guilt of blood into their souls. They were zealous for the Temple, but in the mean time murderers of the Son of God. And we have a parallel Scripture to this, Rom. 2. 22. Thou that abhorrest idols, dost thou commit sacrilege?

Who at the first blush would not have taken these for very holy, devout men; they were zealous against idolatry? But see a root of hypocrisy! They were partially good, they hated one sin, but not another; idolatry, but not sacrilege. Though it was an abominable sin, and there was an express Law of God against it, yet these seeming Zealots make no conscience of robbing God of his tithes.

And here as in a Scripture looking-glass, we may see our own faces; have we not many now adays seemingly zealous against Popery? if they see a Cross, though it be in a Coat of Arms, they are much offended, and are in a kind of convulsion: but in the mean time make no conscience of sacrilege, starving out the Ministry, they put out the fire on God’s Altar, shut the doors of his Temple; is not this visible hypocrisy?

There are some it may be will not be heard to swear, it will not stand with their Saintship, that were to call the devil father aloud, but they will defraud and defame, which is a sin they can never satisfy for; take away a man’s name, what amends can you make him? ’tis no better then murder; and if these be Saints, there are as good Saints in hell?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s anatomy upon man’s heart. Or, A sermon preached by order of the Honourable House of Commons, at Margaret’s Westminster, Decemb. 27. Being a day of publick humiliation</cite>, (London: Ralph Smith, 1654), pp 39-41.</span></figcaption>

</figure><figure class="quote" id="q-69f6a5ed1e" data-kw="">
<blockquote><p>But people evaluate things also according to the standard of beauty and ugliness… But the beautiful is nevertheless essentially distinct from the pleasant. People do not argue about what is pleasant. One person finds this food and that drink enjoyable, but another does not. People are comfortable with this and do not argue about these differences. However, in connection with what is beautiful, people tend not to be satisfied with the notion that something attracts one person but not another; people attempt to account for beauty to themselves and others and attempt, as it were, to demonstrate why something is attractive. People proceed from the notion that what is genuinely beautiful should be attractive to everyone, given sufficient enlightenment and education.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921), p. 163</span></figcaption>

</figure><figure class="quote" id="q-024bd578e7" data-kw="">
<blockquote><p>What is meant by our forgiving them [Mt. 6:12]? It is our hearty forgiving them the injury done to us (to forgive the injury against God is not in our power), entertaining no hatred or malice against them, but loving them with a love of goodwill, heartily wishing their good, and being ready to do them good, Mt. 5:44-45: ‘But I say unto you, Love your enemies, bless them that curse you, do good to them that hate you, pray for them that despitefully use you, and persecute you; that ye may be the children of your Father which is in heaven, for he maketh his sun to rise on the evil and on the good, and sendeth rain on the just and on the unjust.’ But it does not extend to a love of complacency or delight in them in whom there appears no ground for that, either as men or as Christians. Ps. 26:4, ‘I have not sat with vain persons,’ says David, ‘neither will I go in with dissemblers.’</p></blockquote>

<blockquote><p>Yet this is not the whole truth of the matter. We do assert that God, that is, the whole Godhead, is one person…. In other words, we are bound to maintain the identity of the attributes of God with the being of God in order to avoid the specter of brute fact.” …Over against all other beings, that is over against created beings, we must therefore hold that God’s being presents an absolute numerical identity. And even within the ontological Trinity we must maintain that God is numerically one. He is one person. We say that we believe in a personal God we do not merely mean that we believe in a God to whom the adjective “personality” may be attached. God is not an essence that has personality; He is absolute personality. Yet, within the being of the one person we are permitted and compelled by Scripture to make the distinction between a specific or generic type of being, and three personal subsistences.</p></blockquote>

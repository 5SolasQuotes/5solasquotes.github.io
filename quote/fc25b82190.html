<blockquote><p>Men of lax and corrupt principles, take great delight in speaking to the praise of human nature, and extolling its dignity, without distinguishing what it was, at its first creation, from what it is in its present fallen state. These fine speculations are very grateful to a worldly mind. They are also much more pernicious to uncautious and unthinking youth, than even the temptations to a dissolute and sensual life, against which they are fortified by the dictates of natural conscience, and a sense of public shame. But I appeal from these visionary reasonings to the history of all ages, and the inflexible testimony of daily experience. These will tell us what men have been in their practice, and from thence you may judge what they are by nature, while unrenewed.

If I am not mistaken, a cool and candid attention, either to the past history, or present state of the world, but above all, to the ravages of lawless power, ought to humble us in the dust. It should at once lead us to acknowledge the just view given us in scripture, of our lost state; to desire the happy influence of renewing grace each for ourselves; and to long for the dominion of righteousness and peace, when men shall beat their swords into plowshares, and their spears into pruning hooks; when nation shall not lift up sword against nation, neither shall they learn war any more.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-witherspoon.html">John Witherspoon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The dominion of Providence over the passions of men. A sermon preached at Princeton, on the 17th of May, 1776. Being the general fast appointed by the Congress through the United Colonies. To which is added, an address to the natives of Scotland residing in America</cite>, (Philadelphia: R. Aitken, 1776), pp 12-13.</span></figcaption>

</figure><figure class="quote" id="q-0a469670f9" data-kw="">
<blockquote><p>So profound a repugnance to death and all that death meant,manifesting itself during his life, could not fail to seize upon him with peculiar intensity at the end. If the distant prospect of his sufferings was a perpetual Gethsemane to Him, the immediate imminence of them in the actual Gethsemane could not fail to bring with it that “awful and dreadful torture” which Calvin does not scruple to call the “exordium” of the pains of hell themselves. Matthew and Mark almost exhaust the resources of language to convey to us some conception of our Lord’s “agony”¹ as an early interpolator of Luke (Lk. xxii. 44) calls it, in this dreadful experience. The anguish of reluctance which constituted this “agony” is in part described by them both—they alone of the Evangelists enter into our Lord’s feelings here—by a term the primary idea of which is loathing, aversion, perhaps not unmixed with despondency.² ¹ [Greek] agonia: see G. Heine, Synonymik etc., 1898, p. 189: “Contest, quaking, agitation (and anxiety of the issue?) Lk. xxii. 44; Luther, ‘he grappled with death’, Weizsacker, ‘he struggled’, Bengel; ‘supreme grief and anguish. It properly denotes the anguish and passion of the mind, when it enters upon a conflict and arduous labor, even when there is no doubt of a good issue’.” Plummer in loc.: “Field contends that fear is the radical notion of the word. The passages in which it occurs in LXX confirm this view… It is therefore an agony of fear that is apparently to be understood.” It would be better to say consternation, appalled reluctance. ² [Greek] ademoneo: see Heine, Synonymik etc., 1898, p. 148: “pavesco, angor.” Cf. Lightfoot, on Phil. ii. 26: ” The primary idea of the word will be loathing and discontent.” “It describes the confused, restless, half-distracted state, which is produced by physical discouragement, or by mental distress, or grief, shame, disappointment, etc.” Lagrange on Mk. xviii. 33: “seized with despondency”. Thomas Goodwin (Works, v. 276): “so that we see Christ’s soul was sick and fainted,” “his heart failed him.</p></blockquote>

<blockquote><p>Nor was this perfect exemption from violence or injury at the hand of men a mere isolated fact. It was part of the general scheme or of the understood relation to human life occupied by Christ. He was not to dash His foot against a stone (Ps. xci.). Disease in the ordinary course, or as it is commonly contracted, could not touch Him, because He did not come within the power of sin in the world; and hence we never read of His contracting any distemper or disease like other men. Nor could death in any of the thousand forms in which it comes to other men, come to Him, till He consented…</p></blockquote>

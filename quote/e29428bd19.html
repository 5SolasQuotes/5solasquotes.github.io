<main class="wrap"><figure class="quote" id="q-e29428bd19" data-kw="">
<blockquote><p>Concerning the communion of charity or love, which consists in suffering and bearing the evils one of another, and in not lightly condemning one another: we hold all them for the true members of Christ which worship one God in spirit and in truth, and hope for their salvation in one Jesus Christ alone, the Son of God come in the flesh, and crucified for the sins of the world, which is the foundation of salvation to all men. We desire all union and agreement with them, in whatsoeuer countries and regions they are, and whatsoever corruptions may be yet remaining amongst them, not only in manner, but also in certain points of doctrine, bewailing the bodily servitude which they endure, and praying the Father of light, that it will please Him to enlighten them more and more by his Holy Spirit.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-mornay.html">Philip Mornay</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Notable Treatise of the Church in which are handled all the Principal Questions that have been moved in our Time concerning that matter</cite>, [in controversy with Romanism] (London: Barker, 1579), ch. 10, n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-9fae10ed87" data-kw="">
<blockquote><p>The God of truth and of peace (which two titles are the most resplendent gems in the crown of God’s glorious attributes) has commanded us to embrace and maintain with equal love and zeal the truth and peace (Zech. 8:19). Since also both these are the legacies of our blessed Saviour, bequeathed to his Church by his Testament, sealed with his blood; certainly every sincere Christian is concerned in both (2 Cor. 4:1); but the stewards of the mysteries of God are yet more deeply engaged in the preservation or restoration of both, to their utmost ability. At present, our amazing and distressing thoughts are great for the divisions of Reuben (to use the words of Deborah, Jud. 5:15) and the spiritual flames of dissension which (like the late dreadful fire in the city) devour the strength and beauty of our Church, call for the assistance of all hands to quench them. But as in a conflagration, while some labor to repress the violence, or stop the course of the spreading fire, others are employed to guard the goods, and, while they stand with aching hearts for the calamity, do good service in perserving their neighbours as well as their own goods from perishing or plunder: so while my brethren, the blessed sons of peace, are hard at work, in drawing water out of the ever-living spring, the Scripture, which plentifully affords the Word of truth and peace, and applying the same for the allaying of these consuming flames (whose endeavours for the peace of Jerusalem I pray God to prosper) I have undertaken to preserve and rescue an important truth concerning justification, from the attempts made by same to corrupt or obscure this heavenly doctrine.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-gataker.html">Charles Gataker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface in Thomas Gataker, An Antidote Against Error Concerning Justification… (d. 1654; London: Brome, 1670)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-9ee383f7db" data-kw="">
<blockquote><p>Let there be no strife between us and you, for we be brethren: and is not the Canaanite and the Perizzite yet in the land? O let it not be told in Gath, nor published in the streets of Ashkelon! Let it not be said that there can be no unity in the Church… It shall be no grief of heart to you afterward, that you have pleased others as well as yourselves, and have stretched your principles for an accommodation in Church government, as well as in worship, and that for the Church’s peace and edification; and that the ears of our common enemies may tingle (Act. 9:31) when it shall be said, ‘The Churches of Christ… have rest, and are edified, and walking in the fear of the Lord, and in the joy of the Holy Ghost are multiplied.’ Alas, how shall our divisions and contentions hinder the preaching and learning of Christ, and the edifying one another in love! Is Christ divided? says the apostle. There is but one Christ, yea the Head and the Body makes one Christ, so that you cannot divide the Body without dividing Christ. Is there so much as a seam in all Christ’s garment? Is it not woven throughout from the top to the bottom? Will you have one half of Israel to follow Tibni, and another half to follow Omri? O brethren, we shall be one in heaven, let us pack up differences in this place of our pilgrimage the best way we can. Nay, we will not despair of unity in this world. Has not God promised to give us ‘one heart and one way’? (Jer. 32:39; Eze. 11:19) And that Ephraim shall not envy Judah, and Judah shall not vex Ephraim, but they shall flee upon the shoulders of the Philistines toward the East, they shall spoil them of the East together? Isa. 11:13,14 Has not the Mediator (whom the Father hears always) prayed that all his may be one? (John 17:21) Brethren, it is not impossible, pray for it, endeavor it, press hard toward the mark of accommodation. How much better is it that you be one with the other Reformed Churches, though somewhat straitened and bound up, than to be divided though at full liberty and elbow-room?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Wholesome Severity Reconciled with Christian Liberty, Appendix</cite></span></figcaption>

<blockquote><p>Then there may and ought to be uniting [in church union] when the evils that follow division or schism, are greater and more hurtful to the Church, than the evils that may be supposed to follow on union. I speak not of ills of sin (for the least of these are never to be chosen), but of evils and inconveniences that may indeed be hurtful to the Church in themselves, and sinful in respect of some persons, yet are not so to all: Now, in such evils the lesser is to be chosen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Treatise Concerning Scandal</cite>, pp. 321–22</span></figcaption>

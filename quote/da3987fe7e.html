<main class="wrap"><figure class="quote" id="q-da3987fe7e" data-kw="">
<blockquote><p>3 Q. Of how many hours does the Sabbath day consist? A. Of four and twenty. Gen. 2:3 The Sabbath is called the seventh day: so as it is a seventh part of the week: therefore so many hours as make up every of the other days (which are four and twenty) must be accounted to this day. 4 Q. Are all those hours to be sanctified? A. Yes. Exod. 20:11 The Lord rested the whole seventh day: and all the time wherein He rested He sanctified. Gen. 2:2,3 5 Q. How can all that time be sanctified? A. 1. By observing things commanded. Jer. 17:22 2. By observing things permitted. Exod. 12:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sabbath’s Sanctification</cite>, (1641), p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-378a173592" data-kw="">
<blockquote><p>If the smelter in a foundry takes several days to reach its proper temperature, then it cannot be shut down every Lord’s day without shutting down the whole steel industry. Thus, at least a minimal crew is needed to keep the operation running through Sunday. But the benefits of steel for mankind (e.g., safer cars and buildings, the need for steel for the military) render it a necessity (wooden sailing ships would not have fared well against Japanese destroyers in the battles of the Pacific). Another example would be certain types of shipping. An oil tanker could not reach Japan from a port in Alaska in less than a week and thus would be in transit on the Sabbath (the shipping of oil is a necessity, since energy is needed for large populations to heat buildings and for generating electricity). God does not require people to deforest the countryside or freeze to death in order to keep the Sabbath. Power and electric utilities and telephone companies must maintain service on the Lord’s day. Hospitals, churches, homes, retirement communities and nursing homes need heat and electricity to preserve life and minister to the sick… The percentage of people working on the Lord’s day should be very small compared to those who work on a given week day. The vast majority of economic activities on the Sabbath in America are totally unnecessary and sinful (e.g., shopping malls, sporting events, restaurants, movie complexes, newspapers, retail outlets). Those industries which require sabbath labor should rotate staff…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-schwertley.html">Brian Schwertley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath &amp; Modern Industrial Civilization</cite>, (1999) 6 pp., p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-db215012fe" data-kw="Lord&#x27;s day apostolic institution">
<blockquote><p>Others ascend to a divine ordination, so that either Christ himself may be said to have immediately and expressly instituted that day, which Junius holds and some others with him; or mediately only inasmuch as the apostles inspired of God sanctioned it in the Christian church by precept, example and their own practice. This is the more common opinion of the orthodox and to this we adhere.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.14.3</span></figcaption>

</figure><figure class="quote" id="q-420573c200" data-kw="">
<blockquote><p>4. Hence that the body may be fit to discharge these duties aright there is something to be done for it on that Day. The body has a dependence on means for the maintaining of the vigor and activity of it whereby it may be fit to attend the service it is appointed to without tiring, fainting or giving in: and it stands in need of this as well for Sabbath service, as for the business of this life; for we are to do these with our might, as well as the other: whatsoever is requisite for this, must be very proper for the Day…</p></blockquote>

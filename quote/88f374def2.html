<blockquote><p>Thus it appears that faith in Christ is love to Christ in Chamier’s judgment: and therefore love justifies: and I showed before that Calvin makes sperare, ‘hoping,’ to be justifying faith (and so do many others) and so love and hope must justify according to them.</p></blockquote>

</figure><figure class="quote" id="q-9cd11ee322" data-kw="">
<blockquote><p>4. Since all of both sides [Reformed and Romanist] allow that forgiveness of sins belongs to the formal cause of our justification, let us now discuss the imputation of the justice of Christ, and whether by that also we are formally justified. … 6. Christ merited for us by everything which He did or suffered on earth; for all infinitely pleased God the Father, and were of immeasureable and inexhaustible merit, because of the hypostatic union of the Divine Person, for He worked human works in a divine manner, as testify S. Dionysius the Areopagite and S. John Damascene. But amongst all that Christ did and suffered, undertaken for us, his death, with the passion immediately preceding it, has chiefly and most especially merited to us justification; for in it the obedience of Christ to the Father, and his love to the human race, shone forth in a wonderful manner, and his whole obedience was therein consummated, as the apostle clearly teaches. This is testified by innumerable passages of Scripture and the Fathers, and moreover, in this all Protestants and Romanists agree…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-forbes.html">William Forbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Considerationes Modestae et Pacificae Controversiarum de Justificatione</cite>, ... 4th ed. (d. 1634; 1658; Oxford: Parker, 1850), vol. 1, bk. 2, ch. 2, pp. 101-103</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“4. Since all of both sides [Reformed and Romanist] allow that forgiveness of sins belongs to the formal cause of our justification, let us now discuss the imputation of the justice of Christ, and whether by that also we are formally justified. … 6. Christ merited for us by everything which He did or suffered on earth; for all infinitely pleased God the Father, and were of immeasureable and inexhaustible merit, because of the hypostatic union of the Divine Person, for He worked human works in a divine manner, as testify S. Dionysius the Areopagite and S. John Damascene. But amongst all that Christ did and suffered, undertaken for us, his death, with the passion immediately preceding it, has chiefly and most especially merited to us justification; for in it the obedience of Christ to the Father, and his love to the human race, shone forth in a wonderful manner, and his whole obedience was therein consummated, as the apostle clearly teaches. This is testified by innumerable passages of Scripture and the Fathers, and moreover, in this all Protestants and Romanists agree…”

0of%20both%20sides%20%5BReformed%20and&amp;text=moreover%2C%20in%20this%20all%20Protestants%20and%20Romanists%20agree" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-744915c510" data-kw="">
<blockquote><p>But now comes a greater question: If by justification our sins be forgiven us, what sins are forgiven I pray? sins past, or sins to come? We are taught that in the instant of justification all our sins past and to come are remitted; which is in my mind an unsound doctrine: for if we look narrowly into it, we shall find that in propriety of speech, remission of sins has relation to that which is past; it’s said therefore, Rom. 3:25: ‘Whom God hath set forth to be a propitiation through faith in his blood, to declare his righteousness for the remission of sins that are past through the forbearance of God.’ And remission of sins has relation to those that are past, as appears by inevitable reason; for what is remission of sins, but sin covered? Now can a thing be covered before it be? ‘Blot out mine iniquities,’ etc. says David; can a thing be blotted out before it’s written? This is the thing [that] makes the Pope so ridiculous, that he will forgive sins for the time before they are committed; but what, do we get nothing for the time to come? Yes, yes, when the sin is past, by faith we have a new access unto God; and having risen by repentance, we get a new act, not of universal justification, but of a particular justification, from this and that particular sin. But if there be forgiveness of sins past already, and I know that I am justified, and my sins remitted: may I now pray for forgiveness of sins past? The Papists say it is active infidelity, and as absurd as to pray to God to create the world anew, or incarnate his Son again. But there is no conversion where there is no praying; and there is need of praying for the remission of sins past, and against sin for the time to come, as I shall show next time; as also consider whether there be any interruption of the act of justification by falling into great sins. There’s no man has a mind more against quirks and quillets than I; yet for the opening of these things, and staying and settling the mind, and clearing the understanding, give me leave the next time to clear these things unto you.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Eighteen Sermons preached in Oxford</cite>, 1640, of conversion, unto God, of redemption &amp; justification, by Christ (London: 1660) | 15th Sermon, on Rom. 5:1, pp. 402-3</span></figcaption>

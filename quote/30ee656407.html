<blockquote><p>Great indeed is He Who deserves to be called the Son of the Most High. Is not He great whose immensity knows no limitation? Who is great as the Lord our God? It is He Who is as great as He is high yea, Who is Most High. As “Son of the Most High,” He thought it not robbery to equal Himself to the Most High. Satan, indeed, meditated robbery. Though made out of nothing in angelic form, he compared himself with his Maker, and arrogated to himself what belonged of right to the Son of the Most High, the Son not made by God, but begotten of Him.

For the Most High God the Father, though Omnipotent, could not make a creature equal to Himself, nor beget a Son who was not His equal. He made the angel great, but not as Himself, therefore not Most High. In one alone did He think it no robbery that He should equal Himself with Him in all things; the only-begotten Son, Who was not made, but begotten, by the Omnipotent, Omnipotent; by the Most High, Most High; by the Eternal, Co-eternal. Rightly, then, shall He be great Who shall be called the Son of the Most High.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-of-clairvaux.html">Bernard of Clairvaux</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of St. Bernard on Advent &amp; Christmas including the Famous Treatise on the Incarnation called “Missus Est”</cite>, ed. J. C. Hedley (1508; London: Paternoster, 1909), pp 57-58.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-487c250015" data-kw="Arius homoousios Nicene">
<blockquote><p>Arius confessed that Christ was God, and the Son of God; because the passages of Scripture to this effect were too clear to be resisted, and then, as if he had done well, pretended to concur with others. But, meanwhile, he ceased not to give out that Christ was created, and had a beginning like other creatures. To drag this man of wiles out of his lurking-places, the ancient Church took a further step, and declared that Christ is the eternal Son of the Father, and consubstantial with the Father.</p></blockquote>

</figure><figure class="quote" id="q-106c272b30" data-kw="">
<blockquote><p>In the Divine Essence we are to consider two things: First, The diverse manner of being therein; secondly, The attributes thereof.

The diverse manner of being therein, are called Persons (Heb. i. 3.)

A person is a distinct subsistence of the whole Godhead (John i. 1; v. 31, 37; xiv. 16; Col. ii. 9; John xiv. 9.)

There are Three Divine Persons, the Father, the Son, and the Holy Ghost (Gen. i. 26; iii. 22; xi. 7; Exod. xx. 2; Hos. i. 4, 7; Isa. lxiii. 9, 10; Zech. iii. 2; Hag. ii. 5, 6; 1 John v. 7; Matt. iii. 16, 17; xxviii. 19; John xiv. 26; 2 Cor. xiii. 13.) These three persons are not three several substances, but three distinct subsistences; or three diverse manner of beings, of one and the same substance and divine essence. So that a person in the Godhead is an individual Understanding and incommunicable subsistence, living of itself, and not sustained by another.

In the unity of the Godhead there is a plurality which is not accidental (Gen. i. 26; iii. 22; xi. 7; Isa. vi. 8), for God is a most pure act, and admits no accidents; nor essential, for God is one essence only—but personal.

The persons in this one essence are but three. In this mystery there is alius et alius, another and another; but not aliud et aliud, another thing and another thing. The Divine Essence in itself is neither divided nor distinguished, but the three Persons in the Divine Essence are distinguished amongst themselves three manner of ways: 1. By their Names. 2. By their Order. 3. By their Actions.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lewis-bayly.html">Lewis Bayly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Practice of Piety: Directing a Christian to walk, that he may please God</cite>, (1612; Grand Rapids MI: Soli Deo Gloria, 2019), pp 3-4.</span></figcaption>

</figure><figure class="quote" id="q-1395fe0704" data-kw="">
<blockquote><p>Is this difference rational, essential, or real?

It is not essential, as in the creatures, where every one hath his proper essence or being, defined and circumscribed: for the essence of the Father is not one, and the essence of the son another, and of the holy Ghost another: but one and the same, which the Father doth wholly communicate to the Son; the Father and the Son to the holy Ghost. Not only in reason, because not in notion, or mind, or only in word is he called Father, Son, and holy Ghost: neither respectively or by relation: as one man may both be, and be called a father and a son. But it is real, yet altogether incomprehensible, because each person hath his own peculiar definition, or his essential and incommunicable propriety, and differs from another not in essence, but in the manner of subsisting.

What is the outward difference?

It is taken from the works of God that be without, as that the Father sends the Son, the Son is sent as the Redeemer: the holy Ghost is the sanctifier. As in the Creed, the Father is distinguished from the Son by the work of creation: the Son by his incarnation, the holy Ghost from them both, by the work of sanctification and regeneration as where he appeared like a Dove, (Mat. 3.) and in cloven tongues, Act. 2. although all these things be effected by one and the self same God. As we use to say, the works of the Trinity without are indivisible: therefore here let us remember the saying of Gregory Nazianzen: I cannot imagine one, but presently I am compassed about on every side with the brightness of three: neither can I distinguish three, but forthwith I am brought again to one. Further, in the persons of the Deity there is an order, but there is none inequality: there is a distinction, but no diversity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guillaume-bucanus.html">Guillaume Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian religion framed out of God’s word, and the writings of the best divines, methodically handled by questions and answers, fit for all such as desire to know, or practise the will of God</cite>, trans. Robert Hill (London: George Snowdon and Leonell Snowdon, 1606), p. 11.</span></figcaption>

<blockquote><p>Q. 2. Is this doctrine of the Trinity, then; a fundamental article, upon the belief of which our salvation depends?

A. Beyond all doubt it is: because without the knowledge and belief of the Trinity of persons, we would remain ignorant of the love of the Father, the merit of the Son, and the sanctifying influences of the Holy Ghost, in the purchase and application of redemption; without which there could be no salvation, John 17:3, – “This is life eternal, that they might know thee the only true God, and Jesus Christ whom thou hast sent.</p></blockquote>

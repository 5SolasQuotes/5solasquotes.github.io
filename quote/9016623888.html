<main class="wrap"><figure class="quote" id="q-9016623888" data-kw="">
<blockquote><p>Prejudice against color! To the writer it always seemed not only cruel and mean but also unaccountable. And here I leave my record that, as far as I can remember, from my early life and on through all these years I was a stranger to the feeling. To God be all the praise, for he gave me anti-slavery parents and these gave me anti-slavery books to read; and I so early was trained in an anti-slavery school that I can not remember when I became an Abolitionist.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/n-r-johnston.html">N. R. Johnston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Looking back from the sunset land or people worth knowing</cite>, (Oakland, 1898), p. 70.</span></figcaption>

<blockquote><p>Question: Is it simply unlawful to play for any money at all, the game being lawful? Answer: No; if the play be for a small matter, the loss whereof is no hurt to him that loses it, and if it be applied to a common good, and be bestowed in some honest meeting for the increase of love, then it is lawful: otherwise not.</p></blockquote>

</figure><figure class="quote" id="q-13867aee89" data-kw="">
<blockquote><p>1. That no human engagements are or ought to be binding to the conscience of those that take them further than the meaning of those that give them is declared and assented unto by the taker.

2. That no engagements whereof the meaning is declared ought to be further binding to the conscience than the intent declared is lawful and allowable in the presence of God.

3. That the intents of no engagements amongst men can be further lawful and allowable in the presence of God than as they are subordinate unto the main rules of our Christian profession and to the principles of natural equity in human societies, whence this corollary will follow: That if upon unforeseen accidents and emergences (which alter the nature of all human affairs) one and the same intent and design may be at one time agreeable to these rules and principles, and at another time become disagreeable thereunto: then that intent and design not only may, but must be laid down; for it is wholly unlawful to maintain any purposes which cease the practice or the profession of duties flowing from these rules and principles.

4. That the intents and designs of the Oath of Allegiance [to Charles I, who was executed] and of the National [Solemn League &amp;] Covenant were never made by the parliaments which framed them to contradict one another; or in their proper times to oppress the rules of our Christian profession or the principles of natural equity by which our society is upheld: although in respect of certain expressions which relate to the circumstances of several times wherein they were framed, they are clearly different one from another. Whence this again will follow: That to be obliged to different intentions (though contrary) upon several occasion (if both agree in their proper times to the forenamed rules and principles) this can be no breach of duty or prejudice of conscience.

5. That it does belong only to the superior powers of human societies to judge and determine at all times that the public engagements and designs ought to be, and what the form of government is, which is most proper for the times, and agreeable to natural equity to be yielded unto by all for common preservation in humane societies.

6. That the supreme powers cannot be bound up unalterably to any particular design or human engagement so as not to be free upon emergencies to entertain other designs and engagements; when they shall think it most expedient for common safety, and agreeable to Christianity, nay, they are not only free to do this, but they are bound to it: else they are not faithful to the charge which God has committed to them.

7. That subjects (that is, particular men in private stations) ought not to make themselves interpreters of the intents of public engagements otherwise than as they are agreeable to the rules of Christianity and the principles of natural equity; and so far as they bear a sense agreeable unto these, so far they are bound in conscience professedly to own them; but if a sense be imposed upon them contrary to any of these, then they are not obliged to own that sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-dury.html">John Dury</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Conscience Eased</cite>, … (London, 1651), pp. 6-8</span></figcaption>

</figure><figure class="quote" id="q-19b096a9df" data-kw="">
<blockquote><p>Although the oath which Joshua and the princes of Israel made to the Gibeonites was made unadvisedly, and without asking counsel from the mouth of the Lord, yet, some hundred years after, being broken, that breach brought a national judgment, till justice was done upon the offenders. How much more may a national judgment be feared, if even in our days the contempt and violation of a most lawful and sacred oath be winked at? Surely God will not wink at their sin who wink at his dishonour. Better not to have vowed than not to pay and perform.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A treatise of miscellany questions</cite>, (1649; Edinburgh, 1844), p. 86.</span></figcaption>

<blockquote><p>VI. If at the first it were lawful, and afterward become impossible and unlawful. For such oaths God Himself may be said to reverse. Thus if a man bind himself by oath to live in single life without marriage, and after finds that God-has not given him the gift of continency; in this case, his oath becomes impossible to be kept, and therefore, being reversed by God and becoming unlawful, it may be broken without impiety.</p></blockquote>

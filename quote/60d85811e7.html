<main class="wrap"><figure class="quote" id="q-60d85811e7" data-kw="">
<blockquote><p>And, fine linnen is the righteousness of the saints, Rev. 19; Therefore, a surplice is good. And, Mt. 16, ‘Take up your cross’: Therefore, the crossing in baptism is lawful. Enough of this. But so the worship of the Devil is lawful and Aaron’s golden calf is lawful, for I can find a major proposition for them in Scripture, of which you have a faith both negative and positive [because both can be derived from Scripture in this general way];</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646) Westminster divine</cite>, p. 111</span></figcaption>

<blockquote><p>I do not here conceive that the Church acknowledges she has cast off her garments of Christ’s righteousness; for then how should she remain the spouse of Christ? Yea, how then should her heart have been otherwise than asleep too? But only she pleads she should appear too naked if she should open to Christ, if she should worship Him in the simplicity and nakedness of his simple ordinances.</p></blockquote>

</figure><figure class="quote" id="q-3c364f2acd" data-kw="">
<blockquote><p>For principally and properly God is worshipped in our spirit: Jn. 4:24, ‘The true worshippers shall worship the Father in spirit.’ Rom. 1:9, ‘Whom I serve in my spirit.’ 1 Pet. 3:15, ‘Sanctify God in your hearts.’ By the ‘spirit’ I understand the thought of the mind, the consience and the affections of the heart. For in these is the first and principal seat of divine and spiritual worship. As for the body, it is but a secondary instrument of the service of God… the true religion of the New Testament has but few prescribed ceremonies and for the most part is divine and spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works (London: Legatt, 1626), vol. 1</cite>, p. 700</span></figcaption>

</figure><figure class="quote" id="q-6201f5bc82" data-kw="">
<blockquote><p>It is an untruth which Raphael de la Torres [a Dominican Romanist], with other schoolmen say, that with the same religion by which we honor holy men, we honor God; upon this reason, because holiness in them is a participation of the divine nature, therefore God must be the intrinsical end, and formal reason for which we honor the saints. [1.] For holiness in saints is a participation of the divine nature; but it is a temporary and a created participation, it is not the same very holiness that is in God; but the created effect thereof: and so the love I bear to any creature, because there is somewhat of God in every creature; and the love to our neighbor, commanded in the Second Table of the Law, should be the love of God, commanded in the First Table of the Law. 2. When I bow to the gray-haired, and to the king, I then do an act of obedience to the Fifth Commandment: No man can say that when I bow to the king or to a holy man, that I am then bowing to the God of heaven and Worshipping God: No acts terminated upon saints living or dead are acts of worshipping God; yea, reverencing of the ordinances of God, as the delighting in or trembling at the Word, are not properly acts of adoring God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646), Introduction, section 6</cite>, pp. 83-84</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

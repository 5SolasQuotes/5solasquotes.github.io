<main class="wrap"><figure class="quote" id="q-42a4d4d71e" data-kw="">
<blockquote><p>We distinguish and teach that in this sense they [reprobates] are made to be reconciliable by the death of Christ, by which Prosper says (Response to the Little Head of the Gauls, ch. 9): “Christ is the Savior of the whole world on account of his true undertaking of human nature and communion in the ruin of the first man.” Hence, it is not allowed that Christ has died for the reprobate, yet by the death of Christ they have been made reconciliable in this sense: … 3. Because the grace of the preaching of the Gospel has been procured [impetrata est] by the death of Christ to reprobates born in the visible Church, and the sacrifice of Christ has been made approved and of simple complacency to them. Wherefore they are called to the Supper (Mt. 22; Lk. 14:16) and are called to Christ (Mt. 11:16; 23:37-38; 1 Cor. 1:18,23; [sic] Acts 14:46; Prov. 1:24-25; Isa. 6:10-11; 65:2-3). These previous things cannot be said of devils.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Examination of Arminianism</cite>, pp. 421-422 c. 1638-1643 trans. T. Fentiman</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-90078a779d" data-kw="">
<blockquote><p>4. A change from the offers of Grace, to the revelations of wrath: Shall thy loving kindness be declared in the grave, or thy faithfulness in destruction (says the Psalmist) in Psalm 88:11… There is never an offer of grace and love made to souls in the grave; while life lasts, the soul hears the joyful sound: And O the sweet offers, the gracious tenders, the loving invitations, that are made to him of Christ, of Grace, of Eternal Life and Love! O the wooings, the meltings, the entreatings, the allurings of Divine Love to and over the soul! but when death comes, farewell all these, farewell all the sweet offers of Christ, and all the blessed motions of the Spirit; then there’s nothing but wrath revealed, and wrath shall come on the neglecting soul to the uttermost.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-pearse.html">Edward Pearse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Great Concern, or A Serious Warning to a Timely &amp; Thorough Preparation for Death</cite>, (London: J. Robinson, 1674), pp. 73–75</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-43136e986f" data-kw="">
<blockquote><p>All preparations even wrought in us, by the common and general restraining grace of God, can have no effectual influence to produce our conversion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (1647), p. 240</span></figcaption>

</figure><figure class="quote" id="q-21fd72064c" data-kw="">
<blockquote><p>Surely such a Testimony or voice in the soul [as claimed by Gillespie’s opponent], as the soul sits down satisfied with before ever any work of sanctification can possibly give any evidence, is not an evidence according to the word, but contrary to the word, and therefore not the revealing evidence of the spirit of God, so that in this I must needs dissent from him, for he casts the soul upon a most dangerous precipice, neither is the danger helped, but rather increased by that posterior evidence, or after comfort of sanctification, which he speaks of, for the soul being before set down satisfied with the Testimony of the spirit of the Lord, and Faith receiving that Testimony (so he supposes) it cannot now examine whether its sanctification be sound or not sound, whether its graces be common or special, seeming or real:…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Miscellany Questions</cite>, ch. 21</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-2815a9cbdd" data-kw="">
<blockquote><p>Had not Christ interposed to satisfy the justice of God, man upon his sin had been actually bound over to punishment, as well as the fallen angels were upon theirs, and been fettered in chains as strong as those spirits feel. The reason why man was not hurled into the same deplorable condition upon his sin, as they were, is Christ’s promise of taking our nature, and not theirs. Had God designed Christ’s taking their nature, the same patience had been exercised towards them, and the same offers would have been made to them, as are made to us. In regard of the fruits of his patience, Christ is said to buy the wickedest apostates from him: 2 Peter 2:1, ‘Denying the Lord that bought them;’ such were bought by Him as ‘bring upon themselves just destruction, and whose damnation slumbers not,’ ver. 3; He purchased the continuance of their lives, and the stay of their execution, that offers of grace might be made to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“On God’s Patience” in The Existence &amp; Attributes of God</cite>, (1682; Grand Rapids: Baker, 1996), 2:482</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

<main class="wrap"><figure class="quote" id="q-b6b4f6e150" data-kw="">
<blockquote><p>The Ordinances and Sacred Rites of Christ’s Institutions; I mean the Sacraments, which are only two, Baptism and the LORD’s Supper, both which are intrusted to Ministers, and as Stewards they only have the Administration of them. So is Baptism, Go and disciple all nations, baptising them in the name of the Father, and of the Son, and of the Holy Ghost. Those same Persons that are authorized to Teach, are authorized to Baptize, and none other, and therefore we say, that if the Form and Matter of Baptism be used by any prophane Person, that is not a Minister that is Null, and ’tis no Baptism.

So is the LORD’s Supper; and therefore St. Paul saith, I have received of the Lord, that which I also delivered unto you, that the Lord Jesus, the same night in which he was betrayed, took bread: and when he had given thanks, he brake it, and said, Take, eat; this is my body, which is broken for you: this do in remembrance of me. After the same manner also he took the cup, when he had supped, saying, This cup is the new testament in my blood: this do ye, as oft as ye drink it, in remembrance of me. Where he tells us, that he delivered to them the Eucharist after the same manner that Christ instituted, as he had received Authority from him. And whoever has a Right as a Steward of God’s Mysteries to Administer one Sacrament, has as great a Right and Authority to Administer both.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-trosse.html">George Trosse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The pastor’s care and dignity, and the people’s duty a sermon preached at the assembly of ministers at Taunton, 7th September, 1692</cite>, (London: John Salisbury and R. Osborne, 1693), pp 17-18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-873da605b8" data-kw="">
<blockquote><p>Controversy 11 – Should the holy Supper for convenience be celebrated by the sick in private dwellings? We deny against the Lutherans. Arguments:

1. Christ only administered the Supper in the assembly of the disciples.

2. Paul wanted us to gather together and to wait on one another (1 Cor. 11:33).

3. The Supper seals communion of many with Christ, because all are partakers of the one bread. Objections:

1. Christ performed it in private houses. Reply: But the Church gathered there.

2. The sick need the confirmation of their faith. Reply: From the Word of God, and they can have that confirmation from a Supper they have taken previously. Controversy 12 – Should the leftover bread and wine from the holy Supper be kept in vases or containers to be solemnly carried around to the sick and for other similar uses? We deny against the Papists. Arguments:

1. The water of baptism cannot be carried around this way, for many were baptized in a river (Acts 8:38); therefore, the bread of the Supper should not be either.

2. It is only a sacrament when it is used, and it has no greater sanctity outside of that use than any other bread.

3. There is no example or institution of it in the Word of God. Objections:

1. It is the body of Christ. Reply: No. The body of Christ is not bread.

2. It is the cup of the New Testament. Reply: Insofar as it is a sign and seal of it.</p></blockquote>

</figure><figure class="quote" id="q-35927c7d95" data-kw="">
<blockquote><p>I had in answer to Mr. [William] Prynne’s third Query, given this reason why profane and scandalous persons are to be kept off from the Sacrament, and yet not from hearing the Word: because the word is not only a confirming and comforting, but a converting Ordinance, and is a mean appointed of God to turn sinners from darkness to light, and from the power of Satan to God: Whereas the Sacrament is not a converting, but a confirming and sealing Ordinance, which is not given to the Church for the conversion of Sinners, but for the Communion of Saints: It is not appointed to put a man in the state of grace, but to seal unto a man that interest in Christ and in the Covenant of Grace which he already hath.

Mr. Prynne doth with much eagerness contradict me in this, and argue at length the contrary. (Which is the marrow and fatness (if there be any) in his debate concerning the eighth point of difference) Whereby he doth not only contradict me, but himself too (as shall appear) yea and join not only with the more rigid Lutherans, but with the Papists themselves against the Writers of the Reformed Churches. For the very same thing which is controverted between him and me, is controverted between Papists and Protestants. The Papists hold that the Sacraments are instrumental, to confer, give, or work grace; yea ex opere operato.

Our divines hold that the Sacraments are appointed of God, and delivered to the Church as sealing Ordinances, not to give, but to testify what is given, not to make, but confirm Saints. And they do not only oppose the Papists’ opus operatum, but they simply deny this instrumentality of Sacraments, that they are appointed of God for working or giving grace where it is not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Aaron’s Rod Blossoming; or, The Divine Ordinance of Church Government Vindicated, So as the present Erastian Controversy concerning the distinction of Civil and Ecclesiasticall Government, Excommunication, and Suspension, is fully debated and discussed, from the holy Scripture, from the Jewish and C</cite>, (London: Richard Whitaker, 1646), Book 3.12, p. 229.</span></figcaption>

</figure><figure class="quote" id="q-28a371500c" data-kw="">
<blockquote><p>Dr. Forbess goes about to warrant private baptism by Philip’s baptizing the eunuch, there being no greater company present, so far as we can gather from the narration of Luke, Acts 8. As likewise by Paul and Silas, their baptizing the goaler [jailer] and all his in his own private house, Acts 16. Touching the first of those places, we answer:

1. How thinks he that a man of so great authority and charge was alone in his journey? We suppose a great man traveling in a chariot must have some number of attendants, especially having come to a solemn worship at Jerusalem.

2. What Philip then did, the extraordinary direction of the Spirit guided him unto it, vv. 29, 39. As to the other place, there was in that time of persecution no liberty for Christians to meet together in temples and public places as now there is. Wherefore the example of Paul and Silas does prove the lawfulness of the like deed in the like case.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Against the English-Popish Ceremonies</cite>, … (1637), pt. 3, ch. 6, p. 96</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Dr. Forbess goes about to warrant private baptism by Philip’s baptizing the eunuch, there being no greater company present, so far as we can gather from the narration of Luke, Acts 8. As likewise by Paul and Silas, their baptizing the goaler [jailer] and all his in his own private house, Acts 16. Touching the first of those places, we answer:

1. How thinks he that a man of so great authority and charge was alone in his journey? We suppose a great man traveling in a chariot must have some number of attendants, especially having come to a solemn worship at Jerusalem.

2. What Philip then did, the extraordinary direction of the Spirit guided him unto it, vv. 29, 39. As to the other place, there was in that time of persecution no liberty for Christians to meet together in temples and public places as now there is. Wherefore the example of Paul and Silas does prove the lawfulness of the like deed in the like case.”

<blockquote><p>If I am not mistaken, the uniqueness of the Reformed doctrine of the sacraments, both of the Lord’s Supper and of baptism, is often not understood clearly. Certainly the sacrament is not a sealing of [something in] the recipient, but of the promises of God. The questions facing us, however, are: What are those promises and what do they contain? This refers not simply in general to the forgiveness of sins and eternal life in Christ the Saviour of sinners. Rather, more pointedly it is this: The Lord says, I will be your God and the God of your descendants forever.

Therefore the objective, certain, and to that degree also rich comfort residing in the covenant seals is frequently misperceived. The sacraments were instituted for believers, for covenant recipients, and they confirm and strengthen with visible signs that in Christ God is and eternally will remain their God. The expressions in our Confessions may not be weakened, which state that we thus truly receive Christ’s body and blood when we eat of the bread and drink of the wine.</p></blockquote>

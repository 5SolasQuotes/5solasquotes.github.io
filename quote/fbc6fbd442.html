<blockquote><p>6. …Yea, he bound that malicious Satan and made him sure for a thousand years’ space, to make of the vessels of wrath the vessels of mercy. This did he by his strong word of covenaunt, whom he made for a thousand generations. And a full performance it is of God’s first promise for man’s behove, that Christ should tread down the head of the serpent. For a thousande years was this restraint. Mark besides the mystery, the time from the ascension of Christ unto the days of Silvester the second bishop of Rome of that name, and ye shall all find that it was from Christ’s nativity a complete thousand, after all the historiographers. By such necromancy as he learned of a Sarazin in Spain obtained he the papacy, and as witnesses John Wycliff in his book, De solutiōe sathane, in Christ’s vicarship he loosened that devil who Christ had afore shut up, and set him again at large to deceive afresh. Consider for the time that he was thus bound, the constaunt says of the Christians, and the invincible hearts of their martyrs, and ye shall find them far different from them which has been since. He was then so weak, so infatuate and babish, that not only wise men, learned men, and strong men, did set him light, but also young maidens, children, and tender infants in a manner did laugh him to scorn, and set all his subtle sleights at nought. Evident will this be to all them that shall read the lives of the holy martyrs and saints of the primative Church… 8. …Neither was he able to pluck them from Christ’s faith by flattering prosperity, nor yet by urgent adversity. Neither could tyrannies nor heresies for that time prevail against the Gospel. … 12. And where as it is here said that after these thousand years Satan must be let loose again for a certain time… In the end of these thousand years reigned in the papacy at Rome the aforenamed necromanser Silvester, which was both a black monk and also a Frenchman born. This beastly Antichrist boasting himself not only to be Christ’s vicar in earth, but also to be equal with him in majesty and power, set first the Devil at large by his necromancy, which took from the hearts of men the living Word of the Lord lest they should be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bale.html">John Bale</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Image of both Churches after the most wonderful and heavenly Revelation of St. John the Evangelist… (d. 1563; London [c. 1570]), on Rev. 20 no page numbers Bale was an Anglican reformer.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c0ee5bb7c7" data-kw="end of world signs">
<blockquote><p>Can anything certain and determinate be held concerning the time of the end of the world? And are certain signs to precede it? The former we deny; the latter we affirm. The end of the world will close and put an end to the world and worldly things. It is called the consummation of ages because it will consummate all things belonging to this state of life and close the duration of the present time, that room may be given for eternity.</p></blockquote>

<blockquote><p>II. Where these thousand yeers have their beginning and ending. Such as understand the thousand yeers definitely are diversly minded about their beginning, as by and by I will show. I suppose it best to take their beginning from the angel’s descension: because otherwise the determination of the thousand yeers, so often repeated, should be uncertain and vain: I say, in case they should have an indeterminated beginning elsewhere: Now the descension of the angel was in the incarnation of the Son of God, as before we showed. Notwithstanding Satan was not bound presently upon his nativity: because the Son of God did not immediatly exercise his power in his childhood. But the true beginning is understood from the cause why the dragon should be bound: which was that he should deceive the nations no more: to wit, by keeping them in paganism and turning them from the Gospel of Christ. Therefore when the Dragon began to desist from deceiving the nations, then he was bound. Now he desisted from seducing the nations any longer, not presently, at the beginning of the ministry, or resurrection of Christ, or of the preaching of the apostles (although the angel did then begin to cast the great chain upon the dragon) but especially after the dispersion of the Jews and the destruction of the Jewish temple, and worship by the Romans: for before that time, the beginnings of the gentiles’ conversion to Christ were but small: because the dragon never ceased to hinder the gentiles from the Gospel of Christ by means of the turbulent Jews, as the history of the Acts of the Apostles testifies. But afterward, Jerusalem being destroyed, the Jews were rejected and dissipated, and in their room the Gentiles were called and added to the Church, as Paul teaches, Acts 13:46; Rom. 11:11, etc. Then at length it appeared that Satan was bound, because he was not able to seduce the nations any longer or uphold paganism. But that was in the year of our Lord 73. This year therefore we make the beginning of the thousand years of Satan’s binding. From hence unto the year of our Lord 1073 are a thousand years, at which time Pope Gregory VII, a Celtiberian monk, and diabolical juggler, poisoning Alexander II, invaded the Papacy by most wicked arts: who sitting on the papal chair, the devill began again to be loosed and to rage tumultuously, filling the Christian world in a horrible manner with wars and slaughters by the means of this his cursed instrument…. … Thus I have laid down my judgement, agreeing with other most learned interpreters before me, as Bullinger, Junius, etc. not that I do tie any man unto it, but leave it to consideration: but they who begin the thousand years from Christ’s nativity, as Aretius, or from his resurrection, as Chytraeus [a Lutheran]: or from the time of universal Christianism under Constantine the Great, as Brightman, Napier, etc. although they differ a little in the terms, yet all have this common with us, that the first thousand years from Christ’s birth is to be ascribed to Satan’s imprisonment and that the dragon is now long ago loosed out of prison.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Divine Revelation of the Apostle &amp; Evangelist John… tr. Elias Arnold (d. 1622; Amsterdam: C.P., 1644), ch. 20, pp. 508 &amp; 510</cite></span></figcaption>

<blockquote><p>Another important division of historical interpreters is into Post-Millennarians and Pre-Millennarians, according as the millennium predicted in Rev. 20 is regarded as past or future. Augustine committed the radical error of dating the millennium from the time of the Apocalypse or the beginning of the Christian era (although the seer mentioned it near the end of his book), and his view had great influence; hence the wide expectation of the end of the world at the close of the first millennium of the Christian church. Other post-millennarian interpreters date the millennium from the triumph of Christianity over paganism in Rome at the accession of Constantine the Great (311); still others (as Hengstenberg) from the conversion of the Germanic nations or the age of Charlemagne.</p></blockquote>

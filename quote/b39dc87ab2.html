<main class="wrap"><figure class="quote" id="q-b39dc87ab2" data-kw="">
<blockquote><p>Developing from Girolama Zanchi’s exegetical labors through Ephesians, Spiritual Marriage draws readers into the rich theological of doctrine of union with Christ. Following the lead of the apostle Paul, Zanchi demonstrates how our earthly marriages fulfill their truest purpose by drawing our attention toward the spiritual marriage between Christ and His Church. By paying attention to the Genesis account of Adam’s marriage to Eve, to pertinent Old Testament laws, and to the teachings of Jesus and His apostles, we begin to understand something of that higher and heavenly union.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spiritual Marriage between Christ &amp; His Church &amp; Every One of the Faithful</cite>, (RHB, 2021) 152, pp. ToC</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

<blockquote><p>The consubstantiality (homoousion) of Christ with us consists in identity of nature and essential properties, but not in the relation of subsistence which was wanting to the human nature. Therefore, the singular human nature of Christ was complete physically in its substantial being as to its integral parts, but not metaphysically as to the mode of subsistence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2 | Question 5, section 13, p. 309</span></figcaption>

</figure><figure class="quote" id="q-335170807d" data-kw="">
<blockquote><p>Reply to Objection 3: …Yet we must bear in mind that not every individual in the genus of substance, even in rational nature, is a person, but that alone which exists by itself, and not that which exists in some more perfect thing. Hence the hand of Socrates, although it is a kind of individual, is not a person, because it does not exist by itself, but in something more perfect, viz. in the whole [of Socates, who has a suppositum]. And hence, too, this is signified by a ‘person’ being defined as ‘an individual substance,’ for the hand is not a complete substance, but part of a substance. Therefore, although this human nature is a kind of individual in the genus of substance, it has not its own personality, because it does not exist separately, but in something more perfect, viz. in the Person of the Word.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 3</cite>, question 2, ‘Of the Mode of Union of the Word Incarnate’ | article 2, ‘Whether the union of the Incarnate Word took place in the Person?’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

</figure><figure class="quote" id="q-58c1fdd9d1" data-kw="">
<blockquote><p>Whether Christ is one or two? The prior is affirmed. … Whether Christ is able to be called a composite? It is denied. Whether a whole? It is distinguished. … Whether there are two beings [esse] in Christ, or a twofold existence and individualness? It is affirmed with a distinction. Whether a twofold life? It is affirmed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Subtitle II, ‘Of the Consequences &amp; Effects of the Union’, ‘Of Christ the Theanthropos’ in Tract 2, ‘Of the Person, Offices &amp; States of Christ the Mediator’ in A Syllabus of Theological Problems</cite>, … (Utrecht, 1643) n.p.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/union-with-christ/nature-of-union.html">Nature of Union</a></span></div>

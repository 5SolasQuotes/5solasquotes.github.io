<main class="wrap"><figure class="quote" id="q-4c853984b6" data-kw="">
<blockquote><p>A sacrament, is an outward sign, which God joins to his covenant, which he hath made with men. And that is either of an eternal, or temporal covenant. A sacrament of an eternal covenant, is a sacrament, whereby God confirms the promise of eternal life. And that is either of the covenant of works, or of the covenant of grace. The sacrament of the covenant of works, is a sacrament, which God gave our first parents in the state of their first integrity. And that was twofold: the tree of life, and the tree of the knowledge of good and evil. The tree of life was a sacrament of the covenant of works, whereby that life was signified, which man should have lived, if he had stood in the obedience of God. Gen. 2. 9. The tree of the knowledge of good and evil, was a sacrament by which was signified to man, in how good estate he was while he performed obedience to God his creator: and into how evil and miserable estate he should cast himself if he obeyed not God. Gen. 2. 17 &amp; 3. 7. 8. 9. 10. 11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Substance of Christian Religion Soundly set forth in Two Books, by Definitions &amp; Partitions</cite>, trans. E. W. (London, 1595), 116–17. [Spelling and punctuation modernized]</span></figcaption>

</figure><figure class="quote" id="q-da88f29e9d" data-kw="">
<blockquote><p>The same doctrine Moses repeated in his ministry. For he also inculcated the same precepts upon which the covenant of works had been built: he both repeated the same solemn saying, He who doeth these things shall live in them, Lev. 18:5 and also added another, Cursed be he who shall not perform the words of this law in doing them, Deut. 27:26. That this is the curse of the law, as it stands opposed to the covenant of grace, Paul teacheth, Gal. 3:10. which, however, is not so to be understood, as if God had intended, by the ministry of Moses, to make a new covenant of works with Israel, with a view to obtain righteousness and salvation by such a covenant. But that repetition of the covenant of works was designed to convince the Israelites of their sin and misery, to drive them out of themselves, to teach them the necessity of a satisfaction, and to compel them to cleave to Christ: and thus it was subservient to the covenant of grace, Rom. 10:4.</p></blockquote>

<blockquote><p>VI. Episcopius, and with him the Remonstrants, deny that a covenant of nature was made with Adam (“Institutiones theologica,” 2.1 in Opera theologica [1678], p. 23); but it can be proved. (1) There are granted the essential parties of a covenant, God and man. God, who as the Creator of man, must also be his governor and from this, his legislator, and because good in his own nature, the rewarder also of those who seek him (Heb. 11:6), so that he would not only give him a law for his direction, but also hold forth a reward to him for keeping it (although bound by no right to that). Man who, because a creature, must also wholly depend upon God and, because upright, could keep the inscribed law, and because rational, ought not otherwise than in a rational manner (i.e., by the intellect and will) be governed, both by the prescription of a law, the promise of rewards and the threatening of punishment. Also since he was created after the image of divine holiness, he ought to have been led to a communion of that happiness also which is the inseparable attendant of holiness. VII. Second, a law was imposed upon Adam, which necessarily implies a federal agreement and contract. For he who receives it, binds himself officially to obedience under the punishment denounced through the same; he who gives it (for the very reason that he exacts obedience) is bound to furnish indemnity and security to the one obeying. Although Moses sets forth only one part of that federal sanction (referring to punishment, Gen. 2:17), still he proves that the former concerning the promise should not be excluded, both from the sacrament of the tree of life (by which it was sealed) and from the threatening of death (which by reason of contraries had the implied promise of life and from the various passages of Scripture which express more clearly the nature and sanction of the law, as Lev. 18:5—“If a man do these, he shall live in them,” cf. Dt. 27:26; Ezk. 20:11; Mt. 19:17; Gal. 3:12). VIII. Third, the passage in Hos. 6:7 seems not obscurely to intimate this: the Israelites are said to have “transgressed the covenant like Adam” (hmh k’dhm ‘bhrv bhryth). For although these words may also be explained of the inconstancy of men (that they may be said to have transgressed the covenant as men are wont to do, who are naturally false and fickle, and often deceive expectation), still nothing prevents their being referred also to Adam (that they may be said to have violated the covenant like Adam, their first parent, who miserably broke the covenant contracted with him by God). A similar locution occurs in Job 31:33: “If I covered,” says he, “my transgressions as Adam [k’dhm].” Here is a manifest reference to the fact of Adam’s endeavoring to excuse and hide his sin (Gen. 3:12).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg: P&amp;R Publishing, 1992–97), 575–76 (8.3.6–8).</span></figcaption>

<blockquote><p>XLVIII. Secondly, we more especially remark, that when the law was given from Mount Sinai or Horeb there was a repetition of the covenant of works. For those tremendous signs of thunders and lightnings, of an earthquake, a thick smoke and black darkness, were adapted to strike Israel with great terror. And the setting bounds and limits round about the mount, whereby the Israelites were kept at a distance from the presence of God, upbraided them with that separation which sin had made between God and them. “In a word, whatever we read, Exod. 19 (says Calvin, on Heb. 12:19) is intended to inform the people, that God then ascended his tribunal, and manifested himself as an impartial Judge. If an innocent animal happened to approach, he commanded it to be thrust through with a dart; how much sorer punishment were sinners liable to, who were conscious of their sins, nay, and knew themselves indicted by the law, as guilty of eternal death.” See the same author on Exod. 19:1, 16. And the apostle in this matter, Heb. 12:18–22, sets Mount Sinai in opposition to Mount Sion, the terrors of the law to the sweetness of the gospel.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“XLVIII. Secondly, we more especially remark, that when the law was given from Mount Sinai or Horeb there was a repetition of the covenant of works. For those tremendous signs of thunders and lightnings, of an earthquake, a thick smoke and black darkness, were adapted to strike Israel with great terror. And the setting bounds and limits round about the mount, whereby the Israelites were kept at a distance from the presence of God, upbraided them with that separation which sin had made between God and them. “In a word, whatever we read, Exod. 19 (says Calvin, on Heb. 12:19) is intended to inform the people, that God then ascended his tribunal, and manifested himself as an impartial Judge. If an innocent animal happened to approach, he commanded it to be thrust through with a dart; how much sorer punishment were sinners liable to, who were conscious of their sins, nay, and knew themselves indicted by the law, as guilty of eternal death.” See the same author on Exod. 19:1, 16. And the apostle in this matter, Heb. 12:18–22, sets Mount Sinai in opposition to Mount Sion, the terrors of the law to the sweetness of the gospel.”

— Herman Witsius, The Economy of the Covenants Between God and Man: Comprehending a Complete Body of Divinity (4.4.48), trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 188.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CXLVIII.+Secondly%2C+we+more+especially+remark%2C+that+when+the+law+was+given+from+Mount+Sinai+or+Horeb+there+was+a+repetition+of+the+covenant+of+works.+For+those+tremendous+signs+of+thunders+and+lightnings%2C+of+an+earthquake%2C+a+thick+smoke+and+black+darkness%2C+were+adapted+to+strike+Israel+with+great+terror.+And+the+setting+bounds+and+limits+round+about+the+mount%2C+whereby+the+Israelites+were+kept+at+a+distance+from+the+presence+of+God%2C+upbraided+them+with+that+separation+which+sin+had+made+between+God+and+them.+%E2%80%9CIn+a+word%2C+whatever+we+read%2C+Exod.+19+%28says+Calvin%2C+on+Heb.+12%3A19%29+is+intended+to+inform+the+people%2C+that+God+then+ascended+his+tribunal%2C+and+manifested+himself+as+an+impartial+Judge.+If+an+innocent+animal+happened+to+approach%2C+he+commanded+it+to+be+thrust+through+with+a+dart%3B+how+much+sorer+punishment+were+sinners+liable+to%2C+who+were+conscious+of+their+sins%2C+nay%2C+and+knew+themselves+indicted+by+the+law%2C+as+guilty+of+eternal+death.%E2%80%9D+See+the+same+author+on+Exod.+19%3A1%2C+16.+And+the+apostle+in+this+matter%2C+Heb.+12%3A18%E2%80%9322%2C+sets+Mount+Sinai+in+opposition+to+Mount+Sion%2C+the+terrors+of+the+law+to+the+sweetness+of+the+gospel.%E2%80%9D%0A%0A%E2%80%94+Herman+Witsius%2C+The+Economy+of+the+Covenants+Between+God+and+Man%3A+Comprehending+a+Complete+Body+of+Divinity+%284.4.48%29%2C+trans.+William+Crookshank%2C+vol.+2+%28London%3A+T.+Tegg+%26+Son%2C+1837%29%2C+188.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F20ee32ad01.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/20ee32ad01.html">Permalink</a><a class="src" href="https://heidelblog.net/2014/06/witsius-the-law-given-at-sinai-wa

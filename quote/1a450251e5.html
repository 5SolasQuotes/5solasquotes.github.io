<main class="wrap"><figure class="quote" id="q-1a450251e5" data-kw="">
<blockquote><p>Who does not see, that this is a common case, among those on whom God has bestowed the riches of this world? The more they are indebted to their great benefactor, the more do they forget him. The more he causes their cup to run over, the more presumptuous, hardened, and ungrateful do they appear.

This is so plainly the fact, that if a man were to ask, where shall I find the best friends of my God? Where shall I find the heart that glows with the warmest sensibility for the common blessings of divine providence? We must for the most part direct him to the humble dwellings of the poor, and often to those who subsist upon the slender charity of their fellow men.

Read what the pious Asaph has said of the rich in the seventy-third Psalm. “Their eyes stand out with fatness; they have more than heart can wish. — They set their mouth against the heavens and their tongue walketh through the earth. They say, how doth God know? And, is there knowledge in the Most High? Behold these are the ungodly, who prosper in the world: they increase in riches.” We know that this is not true of all: we know that there are many who, like Abraham, abound in the good things of this life — and at the same time are rich in faith and heirs of the kingdom. Still it cannot be denied that men who increase in wealth, often increase in pride and self-sufficiency, and forget their dependence on God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-richards.html">James Richards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Danger and Folly of Indulging a Covetous Temper in The New-Jersey Preacher: or, Sermons on Plain &amp; Practical Subjects. By some of the Ministers of the Gospel, Residing in the State of New-Jersey. Vol. I.</cite></span></figcaption>

<blockquote><p>…and if violence made the surrender of liberty, here is slavery, and slaves taken in war, so soon as they can escape and return to their own, they are free (D. Sect. item. ea Justit. de rerum divin. l. nihil. F. de capt. l. 3). So the learned Ferdinand Vasquez (Illustri. l. 2. c. 82. n. 15) says, ‘The bird that was taken, and has escaped, is free;’ nature in a forced people, so soon as they can escape from a violent conqueror makes them a free people; and si solo tempore (says Ferdinand Vasquez, l. 2. c. 82. n. 6) justificatur subjectio, solo tempore facilius justificabitur liberatio.</p></blockquote>

<blockquote><p>Messiah’s subjects are his, because by his spirit and power he forms them anew; fitting them now for his service here, and for the full enjoyment of heaven hereafter. To rescue men from external slavery, yet to leave their slavish habits and propensities in full force, would not greatly ameliorate their condition nor render them proper subjects of a free state. Christ does more than this for his people, and thereby his right to their persons and services is strengthened and confirmed. “Behold,” says he, “I make all things new,” and through his creative energy new light shines into the understanding, and new affections are kindled in the heart—new principles are implanted in the mind, and new hopes gladden the soul—new desires influence the will, and new actions characterise the life—old things pass away, and all things become new.

All this is effected by his blessed spirit. “Lo,” said Jesus, when about to leave this scene of suffering and of sorrow, “Lo I am with you always, even to the end of the world.” The disciples to whom this promise was made, continued not long upon earth, and we now behold him with the eye of flesh no more. Yet is he still present with his people. Yea he will never leave nor forsake them. Soon was his promise fulfilled, and the Comforter, sent from on high, took up his abode in the hearts of his people. They thus become temples of the Holy Ghost, in which he delights to dwell, and will for ever be glorified; they are members of that body of which Christ is at once the sovereign and head, and one spirit animates the whole.

If slight benefits conferred, or trivial changes of character produced, furnish claims of gratitude or of submission, what must be due from Messiah’s subjects to their Lord, who makes them new creatures, and fits them for the society of angels, and the spirits of just men made perfect? In consequence of this, whatever their previous character or conduct may have been, they now perceive that Christ is indeed a King; they cordially submit to him as their king; and, by cheerfully submitting themselves to him as his subjects, they confirm his right to their persons and services, they secure their own felicity in time and for ever, and they verify the prediction of our text, “Thy people shall be willing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/christopher-greig.html">Christopher Greig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Subdues a People to Himself in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>

</figure><figure class="quote" id="q-0df971ffcb" data-kw="">
<blockquote><p>Persons who are justly condemned to slavery [penal servitude], as a punishment of their dishonesty or other crimes, may be lawfully bought for slaves: and prisoners may be bought from conquerors, if it be in order to preserve their lives.

But to make war upon neighbours, or encourage others to it, in order to procure slaves, – or to trade in buying slaves, – is altogether unmerciful, and shocking to right reason and humanity, – natively entailing upon these merchants the blood of the souls and bodies of their fellow-creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-haddington.html">John Brown of Haddington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A compendious view of natural and revealed religion</cite>, (1782; Fearn: Christian Focus Publications, 2002), p. 22.</span></figcaption>

</figure><figure class="quote" id="q-ab89edfd4f" data-kw="">
<blockquote><p>The abolition of the slave trade and of slavery was effected by the vigorous and persevering efforts of noble-minded philanthropists; and the awakened conscience of a Christian people, and the generous sacrifice of twenty-millions of pounds of the public treasury, testified to the earnest desire of Britain to wipe away the last foul stain of the accursed system from the national escutcheon.

The measures proposed for the termination of slavery were at first vehemently denounced by those whose vested rights were interfered with, and were ultimately carried, on the principle of establishing what humanity and justice equally demanded, whatever should become of private or class interests.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-houston.html">Thomas Houston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Races: The Evils Connected with Horse-Racing and the Steeple-Chase and their Demoralizing Effects</cite>, (1853) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 4: 329.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/work-wealth-and-poverty.html">Work, Wealth and Poverty</a></span></div>
<div class="actions"><button class="copy" data-copy="“The abolition of the slave trade and of slavery was effected by the vigorous and persevering efforts of noble-minded philanthropists; and the awakened conscience of a Christian people, and the generous sacrifice of twenty-millions of pounds of the public treasury, testified to the earnest desire of Britain to wipe away the last foul stain of the accursed system from the national escutcheon.

The measures proposed for the termination of slavery were at first vehemently denounced by those whose vested rights were interfered with, and were ultimately carried, on the principle of establishing what humanity and justice equally demanded, whatever should become of private or class interests.”

— Thomas Houston, The Races: The Evils Connected with Horse-Racing and the Steeple-Chase and their Demoralizing Effects, (1853) in Works Doctrinal and Practical of the Rev. Thomas Houston, D.D, Knockbracken (4 vols, Edinburgh: Andrew Elliot, 1876), 4: 329.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+abolition+of+the+slave+trade+and+of+slavery+was+effected+by+the+vigorous+and+persevering+efforts+of+noble-minded+philanthropists%3B+and+the+awakened+conscience+of+a+Christian+people%2C+and+the+generous+sacrifice+of+twenty-millions+of+pounds+of+the+public+treasury%2C+testified+to+the+earnest+desire+of+Britain+to+wipe+away+the+last+foul+stain+of+the+accursed+system+from+the+national+escutcheon.%0A%0AThe+measures+proposed+for+the+termination+of+slavery+were+at+first+vehemently+denounced+by+those+whose+vested+rights+were+interfered+with%2C+and+were+ultimately+carried%2C+on+the+principle+of+establishing+what+humanity+and+justice+equally+demanded%2C+whatever+should+become+of+private+or+class+interests.%E2%80%9D%0A%0A%E2%80%94+Thomas+Houston%2C+The+Races%3A+The+Evils+Connected+with+Horse-Racing+and+the+Steeple-Chase+and+their+Demoralizing+Effects%2C+%281853%29+in+Works+Doctrinal+and+Practical+of+the+Rev.+Thomas+Houston%2C+D.D%2C+Knockbracken+%284+vols%2C+Edinburgh%3A+Andrew+Elliot%2C+1876%29%2C+4%3A+329.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fab89edfd4f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ab89edfd4f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/07/thomas-houston-on-the-abolition-of-british-slavery/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<blockquote><p>From that position it follows that the human will can do more than the divine, and can draw and temper it according to its own nod and pleasure. This is clear because whatever it wills, God fulfills: if it wills, the concurrence is present; if it does not will, it is absent. And God waits to see what it wills and does not act before its nod, nor operates contrary to its will… It elicits the act when it pleases and determines the divine concurrence according to its own judgment. Therefore the will does what the human will wills, not what the divine will wills. From which it follows that the will is mistress of the divine concurrences, which are ready — as those authors say — indifferently for the pleasure of the will… What is this but to drive God around in circles, as it were, and lead him about? Yet this is in no way permitted to God with respect to the creature, through which God is not allowed to act freely and to operate according to his own judgment.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francisco-macedo.html">Francisco Macedo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Collations of the Teachings of St. Thomas &amp; Scotus, with the Differences between the Two: with the Texts of Both Faithfully Presented, and the Sentences Subtly Examined, with the Commentaries of the Interpreters… vol. 2 tr. AI by Vertias (Padua: Frambotti, 1671), , bk. 2, Collation 9, pp. 361-429 | Contra Molinists</cite>, p. 378</span></figcaption>

<blockquote><p>XXX. These and many similar points [discussed above on Romanism generally] are elaborated at length by Louis de Molina in his Concord of Free Will with the Gifts of Grace, quest. 14, disp. 26. He first asserts that God concurs with secondary causes in their operations and effects in such a way that just as the secondary cause immediately elicits its operation and produces its term or effect, so God immediately influences with it in the same operation and produces the term or effect through that operation or action. Secondly, he asserts that when God concurs with secondary causes, He influences as a universal cause with an indifferent influence towards various actions and effects. This general influence is determined to specific kinds of actions and effects by the particular influence of the secondary causes, which varies according to the nature of each in acting. Just as the influence of the sun, which is also universal, is determined by the influence of a man to produce a human being, and by the influence of a horse to produce a horse. If the cause is free, it is in its power to influence in such a way that this action rather than that one is produced, such as willing rather than not willing or walking rather than sitting, and this effect rather than that one, namely this artifact rather than another. Or it may even suspend its influence entirely so that there is no action at all. Thirdly, he asserts that the influence of God through universal concurrence is not sufficient for the production of any effect without the particular influence of the secondary cause by which it is determined, nor is the particular influence of the secondary cause sufficient without the influence of God through universal concurrence by which it is assisted, which, according to the ordinary law, He never denies. These two influences mutually depend on each other to exist in nature. Indeed, there are not two actions but one numerically, which as it comes from God influencing in this way is called universal concurrence, but as it comes from the secondary cause, for example from fire causing heat, is called the concurrence or influence of the fire. This action is specified not because it is from God through universal concurrence but because it is from the fire with God cooperating through its particular power. XXXI. The doctors who hold this explanation of divine concurrence think they can easily show how such concurrence can be reconciled with the freedom of human actions. For since two kinds of freedom are usually attributed to the will—one concerning the exercise of the act and the other concerning its specification—this divine concurrence, as explained, prejudices neither. Not the former, which concerns the exercise, since this concurrence does not impose the necessity of acting on the will. For the will does not act because God acts but rather conversely, God acts because the will acts, although they both begin to act at the same moment in time and nature. Scholastic terms express this by saying that the will acts prior in nature to God, not by priority of the instant in which but of the order from which. XXXII. Although the will can do nothing at all without God concurring, according to the law established by God when He created it free, that concurrence is always available to it because God willed and decreed from eternity to concur with every work of the free will when it determines itself to act. Nevertheless, the will is equally free concerning the specification of its act. For that the will acts well or badly, avoids or seeks this rather than that, does not proceed from any power of divine concurrence but from the proper determination of the will, which freely uses the divine concurrence, indifferent in itself, to produce an action of this rather than that kind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan, vol. 1 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘How Divine Concurrence can be Reconciled with Free Will’, pp. 343-44 Latin Le Blanc (1614-1675) was a French reformed professor of theology at Sedan.</cite></span></figcaption>

</figure><figure class="quote" id="q-94813ced0a" data-kw="">
<blockquote><p>It would be to be wished that this contestation had not gone out of the schools of the Roman Communion, where it [the teaching of divine premotion] took birth. But by a misfortune that one could not deplore enough, it has passed even into ours, although with some difference. In effect in the Roman Church there is no one who has not taken sides on this, while in ours few writers have paid attention to this dispute, of which the matter is in effect quite metaphysical. When one reads the works of most of our theologians one has much difficulty perceiving that they have even heard speaking of it. The others [of the Reformed], to whom this contestation has not been unknown, have divided themselves on this. Most have declared themselves for premotion. This is what have done among the supralapsarians Piscator, Maccovius, Voet, Twisse, Rutherford and others, and among the infralapsarians Rivet, Maresius, Turrettin, etc. Several have said things quite opposed to this sentiment, like Junius, Pareus, the theologians of England deputies to the Synod of Dort, H. Alting, P. Ferri, M. Amyraut, M. Morus, etc. Some have explained themselves more clearly, and have positively rejected this dogma, like four of our philosophers, Gockenius, Rutgersius, Jacchæus and Burgersdijk. Some even have refuted it amply and solidly, like Robert Baron, Strangius, Baxter, Heidegger and M. Holsius. That alone makes it clear that it is more or less the same with the Roman Church as with ours, at least in this regard, that in one and in the other premotion has adversaries and partisans, from which one can conclude what is the injustice of the reproaches that the missionaries make to us on this in such an insulting manner. For finally if it is wrong for us to suffer the Predeterminants in our communion, by what right do the Pope and his councils suffer them in theirs?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-la-placette.html">Jean La Placette</a></span><span class="wk"><span class="lbl">Work:</span> <cite>La Placette vs. Naude on Premotion, Concurrence &amp; Decrees trans. from French by AI (Amsterdam: 1707 ff.), pp. 265-66 La Placette (1639-1718) was a French reformed minister who was against divine premotion.</cite></span></figcaption>

s+the+injustice+of+the+reproaches+that+the+missionaries+make+to+us+on+this+in+such+an+insulting+manner.+For+finally+if+it+is+wrong+for+us+to+suffer+the+Predeterminants+in+our+communion%2C+by+what+right+do+the+Pope+and+his+councils+suffer+them+in+theirs%3F%E2%80%9D%0A%0A%E2%80%94+Jean+La+Placette%2C+La+Placette+vs.+Naude+on+Premotion%2C+Concurrence+%26+Decrees+trans.+from+French+by+AI+%28Amsterdam%3A+1707+ff.%29%2C+pp.+265-66+La+Placette+%281639-1718%29+was+a+French+reformed+minister+who+was+against+divine+premotion.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F94813ced0a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/94813ced0a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-concurrence-secondary-causation-occasionalism/#:~:text=It%20would%20be%20to%20be%20wished,his%20councils%20suffer%20them%20in%20theirs&amp;text=It%20would%20be%20to%20be%20wished%20that%20this&amp;text=Pope%20and%20his%20councils%20suffer%20them%20in%20theirs" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5f0eaba27e" data-kw="Author of sin">
<blockquote><p>God by his influence is indeed the principal cause of the act itself, but man is the sole cause of the sin itself, which is in that act. … Nor can even one theologian be shown who has said that God is the author of lawlessness, or of sin insofar as it is sin.</p></blockquote>

</figure><figure class="quote" id="q-bc0effdd91" data-kw="">
<blockquote><p>And so that immediate and per se motion of the first cause upon the secondary cause is, so to speak, the secondary cause’s own and natural motion, absorbed into its very being and operation — so that in the common and accepted view, both causes operate through one single and individual action, and nothing is done by one that is not done by the other. Therefore it is not to be thought that the contingent and free mode of acting of the secondary cause is overturned or destroyed by the pure concurrence of the first cause antecedent in nature to the concurrence and determination of the secondary cause — since this is intimately absorbed into the very nature of the secondary cause itself. I speak plainly. To be determined by God is as much as to be determined by itself, since that determination pertains to the natural mode of operating of the secondary cause. This is urged and explained: because that antecedence of nature, since it is not a real priority, nor one of time, nor of a temporal instant, posits and imprints nothing antecedently in the secondary cause before it operates. Rather, it is a priority altogether conjoined with the action of the secondary cause, such that they exist simultaneously and operate in the same instant of time. The priority of nature is only on the side of the first cause, by reason of the subordination and dependence of the secondary cause upon the first — which all call consequential subsistence — so that just as the secondary cause depends upon the first in being, so also it depends upon it in operating. Thus it is true to say: the secondary cause operates because God operates, and not the converse…</p></blockquote>

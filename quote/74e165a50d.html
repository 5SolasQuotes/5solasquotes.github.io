<blockquote><p>And 1st, albeit there be errors, and errors of a heinous nature among some in a Church, this is not sufficient ground of separation from that Church, nay, not though these errors should remain uncensured. For, as was noticed above, there were some in the Church of Corinth who had drunk in this gross error, “That there is no resurrection of the body;” hence the apostle asks, “How say some among you, there is no resurrection of the dead?” (1 Cor. 15:12) The interrogation plainly intimates there were some among them who denied that great and fundamental doctrine of the Christian religion; and yet this Church of Corinth was a true Church of Christ, from which it was not lawful to separate. So, in the Church of Pergamos, there were some uncensured who held the doctrine of Balaam, and the doctrine of the Nicolaitans; and yet she was a true Church of Christ, right and approven in the main. So, in the Church of Thyatira, “that wicked woman” Jezebel was tolerated without being censured, though she taught the Lord’s servants to commit heinous iniquity. So, though there should be sundry persons leavened with gross errors in the Church of Scotland at this day, this is no sufficient ground for a secession or separation from her. I own it is a sin, and I think a very heinous sin in any Church, to wink at errors, or not to censure for, and be zealous against them, especially if of a heinous nature, as are some of these wherewith some among us have been charged… … And as [John] Owen justly (Exposition, p. 174) observes, “There may be a fundamental error in a true Church for a season, where the Church errs not fundamentally,” citing for proof of this, 1 Cor. 15; 2 Tim. 2:18.</p></blockquote>

<blockquote><p>I. We do each one for himself, profess our resolution, in the strength of Christ, to be faithful and diligent in the works of our ministry; and to live an holy and exemplary life, in piety, justice and charity, according to the measure of our abilities: Especially watching against those sins that tend to the corrupting or dividing of the Church, and to the hindering of our ministry; and to the dishonor of the Gospel, and of our holy profession. II. We do profess our agreement and resolution in the strength of Christ, to be faithful and diligent in public preaching the Gospel: And in the personal instructing of all in our parishes, or undertaken limits, that will submit thereto; teaching the ignorant the principles of religion; endeavoring in love, compassion and meekness, and yet with seriousness and zeal, to convince the erroneous and opposers, to awaken the presumptuous and secure, and help them to try the state of their souls, and to see and feel their sin and misery, and return to God by Christ that they may live: to strengthen the weak; to raise the fallen; to edify and confirm the strong; and to comfort such as need consolation; and to help them all to prepare for death and judgment, and for everlasting life: And all this, as frequently, constantly and orderly, as our strength, and time, and greater duties will permit. III. That the churches may be capable of the discipline of Christ, and constituted and ruled according to the Word of God, and the ends of our office and labors may be attained, we are agreed and resolved to take none for adult members of the churches committed to our special charge, nor admit them, as such, to church-communion and privileges, but those that have first made some personal credible profession of true Christianity, that is, of faith and obedience, and as members of those churches, submit to our pastoral oversight according to the Word of God. But all that make this profession of Christianity and consent to live in communion with the church, and under the ministry and discipline of Christ, we shall receive, though they be weak in knowledge, and utterance, and duties; and shall faithfully employ our ministerial abilities and care for their edification and salvation. IV. We are agreed and resolved in the strength of Christ, while we have ability and opportunity, to congregate the people and hold constant assemblies, especially on the Lord’s Days; and therein faithfully to perform the works of our office, in reading the holy Scripture, preaching, praying, baptizing, praising God, celebrating the sacrament of the Lord’s Supper, and guiding the people in the whole public worship of God: And to manage our work with as much prudence, and reverence, and love, and compassion to the people’s souls, and with as much plainness and convincing evidence, authority, seriousness, and zealous importunity as we can: Avoiding as far as we are able, such things as corrupt and dishonor God’s ordinances, and tend to corrupt the people’s minds with error, presumption, deadness, negligence, or other distempers, displeasing to the Lord. V. For the ends of our office, in obedience to the Lord, we agree and resolve in the strength of Christ, to exercise so much of church government and discipline, in the churches committed to our charge, as we discern to be our certain duty; that is, to keep order and decency in the holy assemblies, and see that all be done to edification: convicting seducers, and stopping the mouths of perverse gainsayers; overseeing the several members of our charge; and requiring them to walk obediently to Christ, and do their duties towards each other: to reprove the gross and scandalous offenders: and if they continue impenitent or unreformed, to tell the Church, or rebuke them before all; (and publicly pray for their recovery): And if they hear not the Church, but remain impenitent and unreformed, after sufficient reproof and patience, to put away such persons from among us, declaring against them the threatenings of the Lord, and requiring them to forbear communion with the Church, and requiring the church to avoid them, and have no familiarity or communion with them, as persons unmeet for the communion of saints. And those that credibly profess repentance, we are to absolve ministerially in the name of Christ, and comfort with the promises of grace; receiving them, and requiring the people to receive them, as brethren, into their communion: but warning them to watch and sin so no more, lest worse befall them. This holy discipline, by the help of God, we shall exercise faithfully and impartially, but yet with caution and moderation; neglecting no necessary consultations with other pastors, or concurrence of the Church: and consenting to be responsible for mal-administrations. VI. For the communion of churches, and the strengthening ourselves for the work of God, and helping one another therein, and maintaining unity, love and concord, we do consent to hold a brotherly communion and correspondency: And to that end, when necessity or greater duty hinders us not, we shall meet at such convenient times and places, as shall be appointed or agreed on from time to time; and shall labor to improve these meetings to our mutual edification, in such consultations, conferences or other holy exercises, as our present case shall most require. And we consent to deal faithfully in advising and admonishing one another; and for the satisfaction of the brethren (to the forementioned ends) to be responsible, if any shall charge us with heresy, scandal, schism, or mal-administration: And forbearing matters without our line, to study and endeavor the promoting of truth, and holiness, and unity among ourselves, and with other churches, as we have a call. And also we agree by communicatory letters upon all needful occasions, to certify our brethren and other churches of the state of our affairs, and of particular members, that those that justly have communion in one church, or are excluded, may have communion with other churches, or be refused by them accordingly, when there is just occasion. And if any brethren or Churches be prevailed over so far by temptation, as unjustly to deny us their communion, in this way of Association, assemblies, or correspondency, we shall not therefore deny them to be our brethren, or churches of Christ, but shall love and own them, and have so much communion with them as their distance shall leave them capable of, if they join with us in the profession and practice of true Christianity, and of the points that are necessary to church-constitution and communion, and are not proved guilty of heresy, ungodliness, or such kind of schism or scandalous sins for which the Scripture commands us to reject men and avoid them. But such as are thus guilty (though they offer themselves to associate with us) we shall refuse to hold communion with, till they credibly profess repentance, and manifest a reformation. VII. Because it is a matter of great concernment to the honor of Christ, the propagation of the Gospel, and the increase and welfare of the Church, that there be a provision of able, faithful ministers, and that unworthy persons be kept out; and because deceivers and unworthy men are forward to intrude, and the people ordinarily are insufficient of themselves to make such trial of men’s ability and soundness as is requisite to the safety of the Church; and the Church in all ages has received ministers by the ordination of other ministers of Christ: We do therefore agree to be careful and faithful in the discharge of our duties hereabout, so far as we can discern them, resolving that if any vacant church desire us to recommend a fit person to be their pastor, or to judge of any recommended to them, we will not recommend or approve of any, but such as we judge most agreeable to the will of Christ; nor will we prefer less fit and worthy men, for friendship or any carnal interest or respect. And if any intollerably unworthy person be about to intrude, or have intruded, or any neighbor church be about to choose, or have chosen such, if we have opportunity, we shall faithfully acquaint them with their sin and danger, and persuade them to a better course. And if we shall be called to invest any by solemn ordination in the sacred office of the ministry, we shall perform it, as near as we are able, according to the directions of the Word of God; admitting none that Christ excludes: And if it may be, we shall do it in that congregation which the person is to oversee, that so we may the better discern their mutual consent, inculcate their duties and engage them to a faithful performance thereof. And whereas it is much controverted of late whether the power of Ordination be given to the people or the pastors of a particular church, or the Associated neighbor pastors, and whether a stated president among these should not have a negative voice herein, we are agreed that leaving the people their due liberty of consent in the reception of their proper pastors, we will none of us singly ordain, without the assistance of other pastors: Nor will we join with any heretics or others, in unjust and impious ordinations that tend to the corrupting or dividing of the churches. And to avoid division upon a tolerable difference of opinions, where we may agree in practice, we consent that the Associations that have no stated presidents, or that give not to such a negative voice, shall receive into their communion those that are of the contrary opinion; giving them leave, if they desire it, to profess or record their opinion in that particular, so they will afterward walk among them in love and peace. And that the Associations that choose a stated president, and give him a negative voice in ordination, shall in like manner, and on like terms, receive into their communion, such as dissent in that particular, and having professed or recorded their dissent, will walk submissively in love and peace. Which liberty also of professing and recording their different principles, we desire may be allowed them, that join in synods, as being only for communion of churches, and them that join in them, as having a direct superior governing power over the particular pastors of the churches. VIII. Though it be the surest way to peace and concord to take up with these necessary things, and we cannot approve of the narrow dividing principles of those men that will impose things unnecessary, to the excluding of the necessary, yet if our lawful rulers shall command it, or the peace of the Church through the distempers of the brethren shall require it, we shall obey, and consent in things that God has not forbidden; and if we suffer for well-doing, and for obeying God rather than men, we shall endeavor to imitate our Lord, who being reviled, reviled not again, and when he suffered, threatened not; but committed all to Him that judges righteously, 1 Pet. 2:23.</p></blockquote>

— Richard Baxter, The Christian Religion expressed: I. briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II. more largely in a Profession taken out of the Holy Scriptures, containing 1. the articles of the Christian Belief, 2. our consent to the Gospel Covenant, 3. the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660) | The Agreement of the Associated Pastors">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI.+We+do+each+one+for+himself%2C+profess+our+resolution%2C+in+the+strength+of+Christ%2C+to+be+faithful+and+diligent+in+the+works+of+our+ministry%3B+and+to+live+an+holy+and+exemplary+life%2C+in+piety%2C+justice+and+charity%2C+according+to+the+measure+of+our+abilities%3A+Especially+watching+against+those+sins+that+tend+to+the+corrupting+or+dividing+of+the+Church%2C+and+to+the+hindering+of+our+ministry%3B+and+to+the+dishonor+of+the+Gospel%2C+and+of+our+holy+profession.+II.+We+do+profess+our+agreement+and+resolution+in+the+strength+of+Christ%2C+to+be+faithful+and+diligent+in+public+preaching+the+Gospel%3A+And+in+the+personal+instructing+of+all+in+our+parishes%2C+or+undertaken+limits%2C+that+will+submit+thereto%3B+teaching+the+ignorant+the+principles+of+religion%3B+endeavoring+in+love%2C+compassion+and+meekness%2C+and+yet+with+seriousness+and+zeal%2C+to+convince+the+erroneous+and+opposers%2C+to+awaken+the+presumptuous+and+secure%2C+and+help+them+to+try+the+state+of+their+souls%2C+and+to+see+and+feel+their+sin+and+misery%2C+and+return+to+God+by+Christ+that+they+may+live%3A+to+strengthen+the+weak%3B+to+raise+the+fallen%3B+to+edify+and+confirm+the+strong%3B+and+to+comfort+such+as+need+consolation%3B+and+to+help+them+all+to+prepare+for+death+and+judgment%2C+and+for+everlasting+life%3A+And+all+this%2C+as+frequently%2C+constantly+and+orderly%2C+as+our+strength%2C+and+time%2C+and+greater+duties+will+permit.+III.+That+the+churches+may+be+capable+of+the+discipline+of+Christ%2C+and+constituted+and+ruled+according+to+the+Word+of+God%2C+and+the+ends+of+our+office+and+labors+may+be+attained%2C+we+are+agreed+and+resolved+to+take+none+for+adult+members+of+the+churches+committed+to+our+special+charge%2C+nor+admit+them%2C+as+such%2C+to+church-communion+and+privileges%2C+but+those+that+have+first+made+some+personal+credible+profession+of+true+Christianity%2C+that+is%2C+of+faith+and+obedience%2C+and+as+members+of+those+churches%2C+submit+to+our+pastoral+oversight+according+to+the+Word+of+God.+But+all+that+make+this+profession+of+Christianity+and+consent+to+live+in+communion+with+the+church%2C+and+under+the+ministry+and+discipline+of+Christ%2C+we+shall+receive%2C+though+they+be+weak+in+knowledge%2C+and+utterance%2C+and+duties%3B+and+shall+faithfully+employ+our+ministerial+abilities+and+care+for+their+edification+and+salvation.+IV.+We+are+agreed+and+resolved+in+the+strength+of+Christ%2C+while+we+have+ability+and+opportunity%2C+to+congregate+the+people+and+hold+constant+assemblies%2C+especially+on+the+Lord%E2%80%99s+Days%3B+and+therein+faithfully+to+perform+the+works+of+our+office%2C+in+reading+the+holy+Scripture%2C+preaching%2C+praying%2C+baptizing%2C+praising+God%2C+celebrating+the+sacrament+of+the+Lord%E2%80%99s+Supper%2C+and+guiding+the+people+in+the+whole+public+worship+of+God%3A+And+to+manage+our+work+with+as+much+prudence%2C+and+reverence%2C+and+love%2C+and+compassion+to+the+people%E2%80%99s+souls%2C+and+with+as+much+plainness+and+convincing+evidence%2C+authority%2C+seriousness%2C+and+zealous+importunity+as+we+can%3A+Avoiding+as+far+as+we+are+able%2C+such+things+as+corrupt+and+dishonor+God%E2%80%99s+ordinances%2C+and+tend+to+corrupt+the+people%E2%80%99s+minds+with+error%2C+presumption%2C+deadness%2C+negligence%2C+or+other+distempers%2C+displeasing+to+the+Lord.+V.+For+the+ends+of+our+office%2C+in+obedience+to+the+Lord%2C+we+agree+and+resolve+in+the+strength+of+Christ%2C+to+exercise+so+much+of+church+government+and+discipline%2C+in+the+churches+committed+to+our+charge%2C+as+we+discern+to+be+our+certain+duty%3B+that+is%2C+to+keep+order+and+decency+in+the+holy+assemblies%2C+and+see+that+all+be+done+to+edification%3A+convicting+seducers%2C+and+stopping+the+mouths+of+perverse+gainsayers%3B+overseeing+the+several+members+of+our+charge%3B+and+requiring+them+to+walk+obediently+to+Christ%2C+and+do+their+duties+towards+each+other%3A+to+reprove+the+gross+and+scandalous+offenders%3A+and+if+they+continue+impenitent+or+unreformed%2C+to+tell+the+Church%2C+or+rebuke+them+before+all%3B+%28and+publicly+pray+for+their+recovery%29%3A+And+if+they+hear+not+the+Church%2C+but+remain+impenitent+and+unreformed%2C+after+sufficient+reproof+and+patience%2C+to+put+away+such+persons+from+among+us%2C+declaring+against+them+the+threatenings+of+the+Lord%2C+and+requiring+them+to+forbear+communion+with+the+Church%2C+and+requiring+the+church+to+avoid+them%2C+and+have+no+familiarity+or+communion+with+them%2C+as+persons+unmeet+for+the+communion+of+saints.+And+those+that+credibly+profess+repentance%2C+we+are+to+absolve+ministerially+in+the+name+of+Christ%2C+and+comfort+with+the+promises+of+grace%3B+receiving+them%2C+and+requiring+the+people+to+receive+them%2C+as+brethren%2C+into+their+communion%3A+but+warning+them+to+watch+and+sin+so+no+more%2C+lest+worse+befall+them.+This+holy+discipline%2C+by+the+help+of+God%2C+we+shall+exercise+faithfully+and+impartially%2C+but+yet+with+caution+and+moderation%3B+neglecting+no+necessary+consultations+with+other+pastors%2C+or+concurrence+of+the+Church%3A+and+consenting+to+be+responsible+for+mal-administrations.+VI.+For+the+communion+of+churches%2C+and+the+strengthening+ourselves+for+the+work+of+God%2C+and+helping+one+another+therein%2C+and+maintaining+unity%2C+love+and+concord%2C+we+do+consent+to+hold+a+brotherly+communion+and+correspondency%3A+And+to+that+end%2C+when+necessity+or+greater+duty+hinders+us+not%2C+we+shall+meet+at+such+convenient+times+and+places%2C+as+shall+be+appointed+or+agreed+on+from+time+to+time%3B+and+shall+labor+to+improve+these+meetings+to+our+mutual+edification%2C+in+such+consultations%2C+conferences+or+other+holy+exercises%2C+as+our+present+case+shall+most+require.+And+we+consent+to+deal+faithfully+in+advising+and+admonishing+one+another%3B+and+for+the+satisfaction+of+the+brethren+%28to+the+forementioned+ends%29+to+be+responsible%2C+if+any+shall+charge+us+with+heresy%2C+scandal%2C+schism%2C+or+mal-administration%3A+And+forbearing+matters+without+our+line%2C+to+study+and+endeavor+the+promoting+of+truth%2C+and+holiness%2C+and+unity+among+ourselves%2C+and+with+other+churches%2C+as+we+have+a+call.+And+also+we+agree+by+communicatory+letters+upon+all+needful+occasions%2C+to+certify+our+brethren+and+other+churches+of+the+state+of+our+affairs%2C+and+of+particular+members%2C+that+those+that+justly+have+communion+in+one+church%2C+or+are+excluded%2C+may+have+communion+with+other+churches%2C+or+be+refused+by+them+accordingly%2C+when+there+is+just+occasion.+And+if+any+brethren+or+Churches+be+prevailed+over+so+far+by+temptation%2C+as+unjustly+to+deny+us+their+communion%2C+in+this+way+of+Association%2C+assemblies%2C+or+correspondency%2C+we+shall+not+therefore+deny+them+to+be+our+brethren%2C+or+churches+of+Christ%2C+but+shall+love+and+own+them%2C+and+have+so+much+communion+with+them+as+their+distance+shall+leave+them+capable+of%2C+if+they+join+with+us+in+the+profession+and+practice+of+true+Christianity%2C+and+of+the+points+that+are+necessary+to+church-constitution+and+communion%2C+and+are+not+proved+guilty+of+heresy%2C+ungodliness%2C+or+such+kind+of+schism+or+scandalous+sins+for+which+the+Scripture+commands+us+to+reject+men+and+avoid+them.+But+such+as+are+thus+guilty+%28though+they+offer+themselves+to+associate+with+us%29+we+shall+refuse+to+hold+communion+with%2C+till+they+credibly+profess+repentance%2C+and+manifest+a+reformation.+VII.+Because+it+is+a+matter+of+great+concernment+to+the+honor+of+Christ%2C+the+propagation+of+the+Gospel%2C+and+the+increase+and+welfare+of+the+Church%2C+that+there+be+a+provision+of+able%2C+faithful+ministers%2C+and+that+unworthy+persons+be+kept+out%3B+and+because+deceivers+and+unworthy+men+are+forward+to+intrude%2C+and+the+people+ordinarily+are+insufficient+of+themselves+to+make+such+trial+of+men%E2%80%99s+ability+and+soundness+as+is+requisite+to+the+safety+of+the+Church%3B+and+the+Church+in+all+ages+has+received+ministers+by+the+ordination+of+other+ministers+of+Christ%3A+We+do+therefore+agree+to+be+careful+and+faithful+in+the+discharge+of+our+duties+hereabout%2C+so+far+as+we+can+discern+them%2C+resolving+that+if+any+vacant+church+desire+us+to+recommend+a+fit+person+to+be+their+pastor%2C+or+to+judge+of+any+recommended+to+them%2C+we+will+not+recommend+or+approve+of+any%2C+but+such+as+we+judge+most+agreeable+to+the+will+of+Christ%3B+nor+will+we+prefer+less+fit+and+worthy+men%2C+for+friendship+or+any+carnal+interest+or+respect.+And+if+any+intollerably+unworthy+person+be+about+to+intrude%2C+or+have+intruded%2C+or+any+neighbor+church+be+about+to+choose%2C+or+have+chosen+such%2C+if+we+have+opportunity%2C+we+shall+faithfully+acquaint+them+with+their+sin+and+danger%2C+and+persuade+them+to+a+better+course.+And+if+we+shall+be+called+to+invest+any+by+solemn+ordination+in+the+sacred+office+of+the+ministry%2C+we+shall+perform+it%2C+as+near+as+we+are+able%2C+according+to+the+directions+of+the+Word+of+God%3B+admitting+none+that+Christ+excludes%3A+And+if+it+may+be%2C+we+shall+do+it+in+that+congregation+which+the+person+is+to+oversee%2C+that+so+we+may+the+better+discern+their+mutual+consent%2C+inculcate+their+duties+and+engage+them+to+a+faithful+performance+thereof.+And+whereas+it+is+much+controverted+of+late+whether+the+power+of+Ordination+be+given+to+the+people+or+the+pastors+of+a+particular+church%2C+or+the+Associated+neighbor+pastors%2C+and+whether+a+stated+president+among+these+should+not+have+a+negative+voice+herein%2C+we+are+agreed+that+leaving+the+people+their+due+liberty+of+consent+in+the+reception+of+their+proper+pastors%2C+we+will+none+of+us+singly+ordain%2C+without+the+assistance+of+other+pastors%3A+Nor+will+we+join+with+any+heretics+or+others%2C+in+unjust+and+impious+ordinations+that+tend+to+the+corrupting+or+dividing+of+the+churches.+And+to+avoid+division+upon+a+tolerable+difference+of+opinions%2C+where+we+may+agree+in+practice%2C+we+consent+that+the+Associations+that+have+no+stated+presidents%2C+or+that+give+not+to+such+a+negative+voice%2C+shall+receive+into+their+communion+those+that+are+of+the+contrary+opinion%3B+giving+them+leave%2C+if+they+desire+it%2C+to+profess+or+record+their+opinion+in+that+particular%2C+so+they+will+afterward+walk+among+them+in+love+and+peace.+And+that+the+Associations+that+choose+a+stated+president%2C+and+give+him+a+negative+voice+in+ordination%2C+shall+in+like+manner%2C+and+on+like+terms%2C+receive+into+their+communion%2C+such+as+dissent+in+that+particular%2C+and+having+professed+or+recorded+their+dissent%2C+will+walk+submissively+in+love+and+peace.+Which+liberty+also+of+professing+and+recording+their+different+principles%2C+we+desire+may+be+allowed+them%2C+that+join+in+synods%2C+as+being+only+for+communion+of+churches%2C+and+them+that+join+in+them%2C+as+having+a+direct+superior+governing+power+over+the+particular+pastors+of+the+churches.+VIII.+Though+it+be+the+surest+way+to+peace+and+concord+to+take+up+with+these+necessary+things%2C+and+we+cannot+approve+of+the+narrow+dividing+principles+of+those+men+that+will+impose+things+unnecessary%2C+to+the+excluding+of+the+necessary%2C+yet+if+our+lawful+rulers+shall+command+it%2C+or+the+peace+of+the+Church+through+the+distempers+of+the+brethren+shall+require+it%2C+we+shall+obey%2C+and+consent+in+things+that+God+has+not+forbidden%3B+and+if+we+suffer+for+well-doing%2C+and+for+obeying+God+rather+than+men%2C+we+shall+endeavor+to+imitate+our+Lord%2C+who+being+reviled%2C+reviled+not+again%2C+and+when+he+suffered%2C+threatened+not%3B+but+committed+all+to+Him+that+judges+righteously%2C+1+Pet.+2%3A23.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Christian+Religion+expressed%3A+I.+briefly+in+the+Ancient+Creeds%2C+the+Ten+Commandments+%26+the+Lord%E2%80%99s+Prayer%2C+and%2C+II.+more+largely+in+a+Profession+taken+out+of+the+Holy+Scriptures%2C+containing+1.+the+articles+of+the+Christian+Belief%2C+2.+our+consent+to+the+Gospel+Covenant%2C+3.+the+Sum+of+Christian+Duty+according+to+the+primitive+simplicity%2C+purity%2C+and+practice%2C+fitted+to+the+right+instruction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29+%7C+The+Agreement+of+the+Associated+Pastors&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb9f6791d87.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b9f6791d87.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/that-union-in-at-least-christianitys-fundamentals-is-obliging/#:~:text=I.%20We%20do%20each%20one%20for,that%20judges%20righteously%2C%201%20Pet.%202%3A23&amp;text=I.%20We%20do%20each%20one%20for%20himself%2C%20profess&amp;text=to%20Him%20that%20judges%20righteously%2C%201%20Pet.%202%3A23" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Use 2: It may teach us what to judge of the Seperatists, or Brownists… 1. Because they seperate where Christ keeps fellowship, Rev. 1:18, and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? … 2. But they say that our Church consists of a mixed multitude, so was that 2 Chron. 20:13, when Jehoshaphat assembled all Judah before the Lord, there was a mixed multitude (Num. 11:4), and they did it out of fear, and yet it was a true Church, and so is ours, though there be a mixed multitude. And yet this falling off, because it is not from the main doctrine, but from the skirts, and some circumstantials, therefore they do not fall utterly from Christ, but yet it is not possible but they weaken their faith.</p></blockquote>

<blockquote><p>10. We have said that the symbols by which the Church is discerned are the preaching of the Word and the observance of the sacraments, for these cannot any where exist without producing fruit and prospering by the blessing of God… When the preaching of the gospel is reverently heard, and the sacraments are not neglected, there for the time the face of the Church appears without deception or ambiguity; and no man may with impunity spurn her authority… far less revolt from her, and violate her unity, (see Chap. II, sec. 1, 10, and Chap. VIII, sec. 12). For such is the value which the Lord sets on the communion of his Church, that all who contumaciously alienate themselves from any Christian society, in which the true ministry of his Word and sacraments is maintained, He regards as deserters of religion. So highly does He recommend her authority, that when it is violated He considers that his own authority is impaired. For there is no small weight in the designation given to her, “the house of God,” “the pillar and ground of the truth,” (1 Tim. 3:15)… 11… How perilous, then, nay, how fatal the temptation, when we even entertain a thought of separating ourselves from that assembly in which are beheld the signs and badges which the Lord has deemed sufficient to characterise his Church!… If it holds the order instituted by the Lord in Word and sacraments there will be no deception; we may safely pay it the honour due to a church: on the other hand, if it exhibit itself without Word and sacraments, we must in this case be no less careful to avoid the imposture… 12… in the administration of word and sacraments defects may creep in which ought not to alienate us from Its communion. For all the heads of true doctrine are not in the same position. Some are so necessary to be known, that all must hold them to be fixed and undoubted as the proper essentials of religion: for instance, that God is one, that Christ is God, and the Son of God, that our salvation depends on the mercy of God, and the like. Others, again, which are the subject of controversy among the churches, do not destroy the unity of the faith…</p></blockquote>

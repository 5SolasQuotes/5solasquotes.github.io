<main class="wrap"><figure class="quote" id="q-bd91d1e080" data-kw="">
<blockquote><p>Christ-God is more than grace, pardon, holiness, than created glory, as the Husband is excellenter then his marriage robe, bracelets, rings; and we are to lay our love and faith principally upon the Father and the Son, more than all created graces;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e8b87cac6e" data-kw="">
<blockquote><p>XV. …the orthodox maintain… the question here… (4) It is not whether any dissent of parents avaricious and through sheer obstinacy will not consent to the proper marriage of children and cannot give sufficient reasons for their dissent after the request has been made by their children that the latter are not absolutely bound to their will, but it is right for them to apply to a superior power to whom a judgment concerning the justice or injustice of the dissent belongs. Thus the matter being well considered, they may determine what the children ought to do and consult their interest by supplying in this point the defect of the consent of the parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 2, 11th Topic, ‘The Law of God’, Q. 16, ‘May Children Withdraw Themselves from the Power of Their Parents &amp; Marry Without their Consent? We Deny Against the Papists., p. 108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“XV. …the orthodox maintain… the question here… (4) It is not whether any dissent of parents avaricious and through sheer obstinacy will not consent to the proper marriage of children and cannot give sufficient reasons for their dissent after the request has been made by their children that the latter are not absolutely bound to their will, but it is right for them to apply to a superior power to whom a judgment concerning the justice or injustice of the dissent belongs. Thus the matter being well considered, they may determine what the children ought to do and consult their interest by supplying in this point the defect of the consent of the parents.”

</figure><figure class="quote" id="q-a627c16d2a" data-kw="">
<blockquote><p>There is a twofold consideration of the time, after which another wedlock is granted to the innocent person…</p></blockquote>

</figure><figure class="quote" id="q-c7d77a0489" data-kw="">
<blockquote><p>That power is given by the Presbyteries’ act of ordination, by order of nature, before the people’s formal act of election: As the husband who in a lapidaries shop chooses a gold ring for his wife, and puts it on her finger, presupposes it was a gold ring before his choosing thereof, neither does his choosing thereof make it a gold ring, but only makes it his wife’s gold ring by application to her: Just so, peoples election appropriates such a man who is already a pastor to such a charge, but does not make the pastor a pastor, but chooses him only to be their pastor.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Peaceable &amp; Temperate Plea for Paul’s Presbytery in Scotland</cite>, (1642), ch. 17, p. 267</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

</figure><figure class="quote" id="q-ad4c6f2e3d" data-kw="">
<blockquote><p>The godly man will remember that the peace between God and us was made by way of contract, whereby God gives Himself to us in his Son, and we give ourselves to Him. If then any refuse to give himself to God, there is no contract, God will not give Himself to him, and so no peace, for every contract must be mutual. When the one party offers to sign and seal, and the other refuses it, there is no agreement… For, since this covenant is often termed in Scripture a marriage, our soul which is the spouse of Christ must give herself to him as Christ gives Himself to her, else the marriage is void, for it is the mutual consent that makes the marriage.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jr-perre-du-moulin.html">Perre Du Moulin Jr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of Peace &amp; Contentment of Mind (London: 1657), ch. 9, ‘Of Good Conscience’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

<main class="wrap"><figure class="quote" id="q-d3ee86e352" data-kw="">
<blockquote><p>We learn, lastly, how dreadful is the end to which unbelief can bring man. Our Lord says to his enemies, “If ye believe not that I am He, ye shall die in your sins.”

These solemn words are invested with peculiar solemnity when we consider from whose lips they came. Who is this that speaks of men dying “in their sins,” unpardoned, unforgiven, unfit to meet God – of men going into another world with all their sins upon them? He that says this is no other than the Saviour of mankind, who laid down His life for His sheep – the loving, gracious, merciful, compassionate Friend of sinners. It is Christ Himself! Let this simple fact not be overlooked.

They are greatly mistaken who suppose that it is harsh and unkind to speak of hell and future punishment. How can such people get over such language as that which is before us? How can they account for many a like expression which our Lord used, and specially for such passages as those in which He speaks of the “worm that dieth not, and the fire that is not quenched”? (Mark 9:46.) They cannot answer these questions. Misled by a false charity and a morbid amiability, they are condemning the plain teaching of the Scripture, and are wise above that which is written.

Let us settle it in our minds, as one of the great foundation truths of our faith, that there is a hell. Just as we believe firmly that there is an eternal heaven for the godly, so let us believe firmly that there is an eternal hell for the wicked. Let us never suppose that there is any lack of charity in speaking of hell. Let us rather maintain that it is the highest love to warn men plainly of danger, and to beseech them to “flee from the wrath to come.” It was Satan, the deceiver, murderer, and liar, who said to Eve in the beginning, “Ye shall not surely die.” (Gen. 3:4.) To shrink from telling men, that except they believe they will “die in their sins,” may please the devil, but surely it cannot please God.

Finally, let us never forget that unbelief is the special sin that ruins men’s souls. Had the Jews believed on our Lord, all manner of sin and blasphemy might have been forgiven them. But unbelief bars the door in mercy’s face, and cuts off hope. Let us watch and pray hard against it. Immorality slays its thousands, but unbelief its tens of thousands. One of the strongest sayings ever used by our Lord was this–“He that believeth not shall be damned.” (Mark 16:16.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on John: Volume 2</cite>, (1869; Edinburgh: Banner of Truth, 1987), pp 101-02.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0b96ce840b" data-kw="">
<blockquote><p>It is a vain speculation, contrary to the analogy of faith, and destructive or the true nature of the oblation of Christ, and inconsistent with the dignity of his person, that he should carry with him into heaven a part of that material blood which was shed for us on the earth. This some have invented, to maintain a comparison in that wherein is none intended.

The design of the apostle is only to declare by virtue of what he entered as a priest into the holy place. And this was by virtue of his own blood when it was shed, when he offered himself unto God. This was that which the foundation of, and gave him right unto the administration of his priestly office in heaven. And hereby were all those good things procured which he effectually communicates unto us in and by that administration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews. With Preliminary Exercitations</cite>, ed. William H. Goold (1680; 7 vols, Edinburgh: Johnston and Hunter, 1854), 6: 280-81.</span></figcaption>

</figure><figure class="quote" id="q-4ad15fa0e7" data-kw="">
<blockquote><p>Heaven is that place alone where is to [be] obtained our highest end, and highest good. God hath made us for himself: “of God, and through God, and to God are all things” (Romans 11:36). Therefore then do we attain to our highest end, when we are brought to God. But that is by being brought to heaven, for that is God’s throne; that is the place of his special presence, and of his glorious residence. There is but a very imperfect union with God to be had in this world: a very imperfect knowledge of God in the midst of abundance of darkness, a very imperfect conformity to God, mingled with abundance of enmity and estrangement. Here we can serve and glorify God but in an exceeding imperfect manner, our service being mingled with much sin and dishonouring to God.

But when we get to heaven, if ever that be, there we shall be brought to a perfect union with God. There we shall have the clear views of God’s glory: we shall see face to face, and know as we are known [1 Corinthians 13:12]. There we shall be fully conformed to God, without any remains of sin: “we shall be like him; for we shall see him as he is” [1 John 3:2]. There we shall serve God perfectly. We shall glorify him in an exalted manner, and to the utmost of the powers and capacity of our nature. Then we shall perfectly give up ourselves to God; then will our hearts be wholly a pure and holy offering to God, offered all in the flame of divine love.

In heaven alone is attainment of our highest good. God is the highest good of the reasonable creature. The enjoyment of him is our proper happiness, and is the only happiness with which our souls can be satisfied. To go to heaven, fully to enjoy God, is infinitely better than the most pleasant accommodations here: better than fathers and mothers, husbands, wives, or children, or the company of any or all earthly friends. These are but shadows; but God is the substance. These are but scattered beams; but God is the sun. These are but streams; but God is the fountain. These are but drops; but God is the ocean.

Therefore, it becomes us to spend this life only as a journey towards heaven, as it becomes us to make the seeking of our highest end, and proper good, the whole work of our lives; and we should subordinate all the other concerns of life to it. Why should we labour for anything else, or set our hearts on anything else, but that which is our proper end, and true happiness?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Christian’s Life a Journey Towards Heaven</cite>, (1734) in Mark Valeri (ed.), Sermons and Discourses, 1730-1733: The Works of Jonathan Edwards Volume 17 (New Haven CN: Yale University Press, 2000), pp 437-38.</span></figcaption>

<blockquote><p>Strong efforts have been used by hell and earth in all ages, to put out the lamp of God’s Anointed, that his soul-captivating glory might not be seen by the sons of men. This is, and has been, the design of all the errors that were ever broached since the Christian church and the gospel-lamp was set up in the world.

The Arian heresy is designed to darken the glory of his supreme Deity. The Socinian error agrees with the Arians, and also overclouds, or rather obliterates, his satisfaction. The Arminian error darkens the freedom and efficacy of his grace, by exalting the freedom of man’s will in his depraved state. Papists and Legalists, of whatever denomination, they impugn and disparage his everlasting righteousness, by substituting something of their own legal workings, doings, or personal qualifications, in the room of it.

And now-a-days, the idol of self-love is substitute in the room of the glory of God, &amp;c. All these, and the like errors, are just like so many damps or mists cast out of hell, through the malice and subtlety of the old serpent, in order to darken and obscure the lamp of gospel-light, that men may not perceive the glory, fulness, and suitableness of Christ, and so believe in him, to the salvation of their souls.

However, through the over-ruling hand of God, these mists and clouds have only served in the issue to make the gospel-lamp, and the glory of God’s Anointed, to shine with the greater lustre; like the clouds in the air, which you observe have just now overcast the sun in the firmament, they obscure his light for a while, and yet serve only, in the event, as a foil to set off the glory of the sun, when he breaks through these clouds, and darts his beams down upon this earth among the children of men, &amp;c.</p></blockquote>

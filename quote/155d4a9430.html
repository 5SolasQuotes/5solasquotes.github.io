<blockquote><p>These Reconcilers are too far on in the way to Popery already; but if they will be fully reconciled with Papists, they must transport themselves altogether into their tents, because Papists will not come forth to meet them midway. […]

O strange and monstrous invention! that would reconcile Christ with antichrist, – agree the temple of God and idols, mix light and darkness together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A dispute against the English Popish ceremonies obtruded on the Church of Scotland</cite>, (1637; Edinburgh, 1844), p. 34.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

<blockquote><p>…we consider things circumstantial, as time, place, etc. And circumstances are either merely physical, or 2. merely moral, or 3. mixed, partly moral, partly physical. Circumstances merely physical are such adjuncts of divine worship as are common and inseparable concomitants of both civil, natural and religious or sacred actions performed by men, and as they are such, contribute no moral goodness or badness to the action or agent in the performance thereof, such as I take to be the seven individuall proprieties of every man: forma, figura, locus, tempus, strips, patria, nomen. Under form and figure, the first two, I comprehend such a proportion of body, a man of a high stature or low, a man beautiful or not beautiful, to which I crave leave to reduce all external forms of habits, as clothes, the head covered or not covered, the situation of the body, as as they are in themselves, mere physical acts, kneeling, sitting, standing, the eyes cast down to the earth or lifted up, the hands lifted up, or not lifted up, the knocking on the breast, or not knocking, motions of the soul, that are natural… 1. All these are common concomitants of civil, natural and religious actions, for all actions performed by man of what kind soever, as natural, to eat, sleep, or civil, to declaim an oration before the people, or religious, to preach or pray, must be done by some persons, John or Thomas, men of some family, in some time, in some place, for they are not actions eternal, and so must be done in time and place, so the agents must have some habit [garment], some gesture in the doing of all these actions, and they are unseparable adjuncts of all these actions because neither actions natural, civil, nor religious can be performed but by some persons in some habit and gesture, in some time, in some place: and lastly, they are mere circumstantials, and contribute no moral goodness or badness to the actions, as they are but common and inseparable circumstances; for because he preaches in time, or in place simply, the preaching is neither morally good, nor ill, better or worse, because Thomas prays in gown or cloak, in this place, rather than that place… the praying is neither the more or the less acceptable to God because of these common and unseparable adjuncts. … I did say that Christ Jesus has set down in the Word a perfect platform of Church-government in all morals; I say ‘in all morals’ because the Word does not teach us anything of circumstances, physical as physical. Scriptura talia non ponit, sed supponit [Scripture does not appoint such things, but supposes them]: The Scripture says not that the Worship of God must have a time, a place, when, and where it’s to be performed, a person, who is to perform it, a habit, or garments on the person that worships; the Scripture teaches none of these, but supposes that they are and must be, because nature teaches that without time, place, person, habit, gesture, it’s impossible that these or any human actions can be; and therefore Prelatical Formalists do without all sense or reason require that we should prove by Scripture, the lawfulness of time, place, person, habit, gesture in God’s worship; for these are presupposed in all actions, natural, civil, religious, private, public, lawful, unlawful, in acts of arts, sciences, of moral conversing and all…</p></blockquote>

<blockquote><p>§66… There is a second thing unlawful also, and that is the misdetermining of those same modes and circumstances which he is authorized to determine. For he is (as is said) to do it by God’s General Rule. Here therefore we must thus conclude:

1. That every misordering of such great affairs is the sin of them that do it.

2. But yet that the subject is not exempted from obedience by every such mistake of the governor: but by some, he is. §67. If the mischoosing of such circumstances by Church-governors be but an inconvenience and do not destroy the ordinance itself, or frustrate the ends of it, we are to obey: 1. For he is the judge in his own work, and not we: 2. the thing is not sinful, though inconvenient.

3. Obedience is commanded to our lawful governors… §68. But if a governor so misdetermine but a mode or circumstance as will overthrow the substance and ends of the worship, I would not obey, except some greater evil were likely to follow my not obeying at that particular season than the frustrating of the duty itself would come to. As for example: If a governor make a new sacrament, I will not obey, because his command is null and the thing [is] simply evil. If he miscommand a circumstance of time or place, or gesture, I will consider the consequents. If he command the solemn assemblies to be held a mile or two or three from the people, I will obey him, if it be but as far as I can go without frustrating the work itself. But if he command us all to go ten miles or twenty miles to worship, I would obey for some time to avoid a greater evil, but ordinarily I would no more obey than if he forbade all Christian assemblies, for it comes all to one. So if he command the assemblies to be at break of day or after sun-setting, I would obey. But if he command that we assemble only at midnight, what should I do then? The thing is not simply unlawful: He does but misdo his own work. And therefore for some times I would obey, if it were necessary to avoid a greater evil. But if he make it the ordinary case, I would not obey: because it destroys the worship itself in a manner, as if he simply forbade it, and this he has no power to do. An inconvenient gesture I would use in obedience and to avoid a greater evil: But I would not obey him that would command me to stand on my head always in hearing. An unhandsome vesture I would use in obedience to a lawful governor and to avoid a greater evil: But not so ridiculous a vesture as would set all the people on laughing so as to frustrate the work that we assemble for. §69. In all such cases where governors act not as usurpers in a matter that they have no authority in, but only misdo their own work, it much concerns the subjects to foresee what’s likely to be the consequents of their obeying or disobeying, and accordingly to do that which tends most to the ends of the work: still holding to this rule, that we must obey in all things lawful. §70. And when we do obey in a case of miscommanding, it is not a doing evil that good may come of it, as some do misconceive: But it is only a submitting to that which is ill commanded, but not evil in him that does submit. It is the determiner that is the cause of the inconvenience, and not the obeyer. Nor is it inconvenient for me to obey, though it be worse perhaps to him that commands. While he sins in commanding, he may make it my duty to obey.</p></blockquote>

<blockquote><p>As, therefore, our communion is termed the Lord’s Supper, because it was instituted of the Lord, for the remembrance of his death; so the Christian Sabbath is called the Lord’s day (Rev. i. 10), because it was ordained of the Lord, for the memorial of his resurrection.

And as the name of the Lord (1 Cor. xi. 10) honours the one, so does it the other; and as the Lord of the Sabbath, by his royal prerogative, and transcendent authority, could, so he had also reason to change the holy Sabbath from the seventh day to this, on which we keep it; for as concerning the seventh day, which followed the six days in which God finished the creation, there was no such precise institution, or necessity of sanctifying it perpetually, but such as by the same authority, or upon greater reason and occasion, it might very well be changed and altered to some other seventh day; for the commandment does not say, Remember to keep holy the seventh day next following the sixth day of the creation, or this or that seventh day; but indefinitely, Remember that thou keep holy a seventh day.

And to speak properly, as we take a day for the distinction of time, called either a day natural, consisting of twenty-four hours, or a day artificial, consisting of twelve hours, from sun rising to sun setting; and withal consider the sun standing still at noon, in Joshua’s time (Josh. x. 12, 43) the space of a whole day; and the sun going back ten degrees (2 Kings xx. 11), viz. five hours, almost half an artificial day, in Ezechiah’s time; the Jews themselves could not keep their Sabbath upon that precise and just distinction of time, called at the first the seventh day from the creation.

Add to this, that in respect of the diversity of meridians, and the unequal rising and setting of the sun, every day varies in some places a quarter, in some half, in others a whole day. Therefore the Jewish seventh day cannot precisely be kept at the same instant of time every where in the world.

Now our Lord Jesus having authority as Lord over the Sabbath (Matt. xii. 8), had likewise now far greater reason and occasion to translate the Sabbath from the Jewish seventh day to the first day on which Christians keep the Sabbath.

1. Because that by his resurrection from the dead, there is wrought a new spiritual creation of the world, without which all the sons of Adam had been turned to everlasting destruction, and all the works of the first creation had ministered no consolation to us (Isa. lxv. 17, &amp;c.; lxvi. 22; Psal. xc. 2.)

2. And in respect of this new spiritual creation, the Scripture saith, “That old things are passed away, and all things are become new,” (2 Cor. v. 17)—new creatures (Gal. vi. 15), new people (1 Pet. ii. 10), new men (Eph. iv. 24), new knowledge (Col. iii. 10), new testament (Matt. xxvi. 28), new commandment (John xii. 13), new names (Rev. ii. 17), new way (Heb. x. 10), new song (Rev. iii. 9), new garment (Luke v. 36, 37), new wine, new vessels (Rev. xxi. 2), new Jerusalem (2 Pet. iii. 13), new heaven, and a new earth (Isa. lxvi. 22) And therefore of necessity there must be, instead of the old, a new Sabbath-day (Heb. iv. 9), to honour and praise our Redeemer, and to meditate upon the work of our redemption, and to shew the new change of the Old Testament.

3. Because that on this day Christ rested from all the sufferings of his passion, and finished the glorious work of our redemption. If, therefore, the finishing of the work of the first creation, by which God mightily manifested himself to his creatures, deserved a sabbath to solemnize the memorial of so great a work, to the honour of the worker, and therefore calls it “mine holy day,” (Isa. lviii. 13;) much more does the new creation of the world, effected by the resurrection of Christ, whereby he mightily declared himself to be the Son of God (Rom. i. 4), deserve a sabbath, for the perpetual commemoration of it, to the honour of Christ, and therefore worthily called the Lord’s day (Rev. i. 10.)

For, as the deliverance out of the captivity of Babylon, being greater, took away the name from the deliverance out of the bondage of Egypt (Jer. xxiii. 7, 8;) so the day on which Christ finished the redemption of the world did more justly deserve to have the Sabbath kept on it, than on that day on which God ceased from creating the world. As, therefore, in the creation, the first day wherein it was finished, was consecrated for a sabbath; so in the time of redemption, the first day wherein it was perfected must be dedicated to a holy rest; but still a seventh day kept according to God’s moral commandment.

The Jews kept the last day of the week, beginning their Sabbath with the night (Gen. ii. 2; Lev. xxiii. 32; Neh. xiii. 19), when God rested; but Christians honour the Lord better, on the first day of the week (Matt. xxviii. 1), beginning the Sabbath with the day when the Lord arose (Acts xx. 7, 11.) They kept their Sabbath in remembrance, of the world’s creation; but Christians celebrate it in memorial of the world’s redemption; yea, the Lord’s day being the first of the creation and redemption, puts us in mind, both of the making of the old, and redeeming of the new world.

As, therefore, under the Old Testament, God, by the glory consisting of seven lamps, seven branches, &amp;c. (Exod. xxv. 31), put them in remembrance of the creation, light, and Sabbath’s rest; so, under the New Testament, Christ, the true light of the world, appears in the midst of the seven lamps, and seven golden candlesticks (Rev. i. 13), to put us in mind to honour our Redeemer in the light of the gospel of the Lord’s seventh day of rest. And seeing the redemption, both for might and mercy, so far exceeds the creation, it stood with great reason that the greater work should carry the honour of the day. Neither does the honourable title of the Lord’s day diminish the glory of the Sabbath; but rather, being added, augments the dignity of it; as the name Israel, added to Jacob, made the patriarch the more renowned (Gen. xxxii. 28.)

The reason taken from the example of God’s resting from the work of the creation of the world continued in force till the Son of God ceased from the work of the redemption of the world, and then the former gave place to the latter.</p></blockquote>

inishing+of+the+work+of+the+first+creation%2C+by+which+God+mightily+manifested+himself+to+his+creatures%2C+deserved+a+sabbath+to+solemnize+the+memorial+of+so+great+a+work%2C+to+the+honour+of+the+worker%2C+and+therefore+calls+it+%E2%80%9Cmine+holy+day%2C%E2%80%9D+%28Isa.+lviii.+13%3B%29+much+more+does+the+new+creation+of+the+world%2C+effected+by+the+resurrection+of+Christ%2C+whereby+he+mightily+declared+himself+to+be+the+Son+of+God+%28Rom.+i.+4%29%2C+deserve+a+sabbath%2C+for+the+perpetual+commemoration+of+it%2C+to+the+honour+of+Christ%2C+and+therefore+worthily+called+the+Lord%E2%80%99s+day+%28Rev.+i.+10.%29%0A%0AFor%2C+as+the+deliverance+out+of+the+captivity+of+Babylon%2C+being+greater%2C+took+away+the+name+from+the+deliverance+out+of+the+bondage+of+Egypt+%28Jer.+xxiii.+7%2C+8%3B%29+so+the+day+on+which+Christ+finished+the+redemption+of+the+world+did+more+justly+deserve+to+have+the+Sabbath+kept+on+it%2C+than+on+that+day+on+which+God+ceased+from+creating+the+world.+As%2C+therefore%2C+in+the+creation%2C+the+first+day+wherein+it+was+finished%2C+was+consecrated+for+a+sabbath%3B+so+in+the+time+of+redemption%2C+the+first+day+wherein+it+was+perfected+must+be+dedicated+to+a+holy+rest%3B+but+still+a+seventh+day+kept+according+to+God%E2%80%99s+moral+commandment.%0A%0AThe+Jews+kept+the+last+day+of+the+week%2C+beginning+their+Sabbath+with+the+night+%28Gen.+ii.+2%3B+Lev.+xxiii.+32%3B+Neh.+xiii.+19%29%2C+when+God+rested%3B+but+Christians+honour+the+Lord+better%2C+on+the+first+day+of+the+week+%28Matt.+xxviii.+1%29%2C+beginning+the+Sabbath+with+the+day+when+the+Lord+arose+%28Acts+xx.+7%2C+11.%29+They+kept+their+Sabbath+in+remembrance%2C+of+the+world%E2%80%99s+creation%3B+but+Christians+celebrate+it+in+memorial+of+the+world%E2%80%99s+redemption%3B+yea%2C+the+Lord%E2%80%99s+day+being+the+first+of+the+creation+and+redemption%2C+puts+us+in+mind%2C+both+of+the+making+of+the+old%2C+and+redeeming+of+the+new+world.%0A%0AAs%2C+therefore%2C+under+the+Old+Testament%2C+God%2C+by+the+glory+consisting+of+seven+lamps%2C+seven+branches%2C+%26c.+%28Exod.+xxv.+31%29%2C+put+them+in+remembrance+of+the+creation%2C+light%2C+and+Sabbath%E2%80%99s+rest%3B+so%2C+under+the+New+Testament%2C+Christ%2C+the+true+light+of+the+world%2C+appears+in+the+midst+of+the+seven+lamps%2C+and+seven+golden+candlesticks+%28Rev.+i.+13%29%2C+to+put+us+in+mind+to+honour+our+Redeemer+in+the+light+of+the+gospel+of+the+Lord%E2%80%99s+seventh+day+of+rest.+And+seeing+the+redemption%2C+both+for+might+and+mercy%2C+so+far+exceeds+the+creation%2C+it+stood+with+great+reason+that+the+greater+work+should+carry+the+honour+of+the+day.+Neither+does+the+honourable+title+of+the+Lord%E2%80%99s+day+diminish+the+glory+of+the+Sabbath%3B+but+rather%2C+being+added%2C+augments+the+dignity+of+it%3B+as+the+name+Israel%2C+added+to+Jacob%2C+made+the+patriarch+the+more+renowned+%28Gen.+xxxii.+28.%29%0A%0AThe+reason+taken+from+the+example+of+God%E2%80%99s+resting+from+the+work+of+the+creation+of+the+world+continued+in+force+till+the+Son+of+God+ceased+from+the+work+of+the+redemption+of+the+world%2C+and+then+the+former+gave+place+to+the+latter.%E2%80%9D%0A%0A%E2%80%94+Lewis+Bayly%2C+The+Practice+of+Piety%3A+Directing+a+Christian+to+walk%2C+that+he+may+please+God%2C+%281612%3B+Grand+Rapids+MI%3A+Soli+Deo+Gloria%2C+2019%29%2C+pp+161-64.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6b45180629.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6b45180629.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/12/15/lewis-bayly-on-the-christian-sabbath-as-the-lords-day/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-68230d520e" data-kw="">
<blockquote><p>And now, coming down to the time of the giving of the law, we find the Sabbath here, in this Fourth Commandment, “enshrined,” in the often-quoted words of Dr. [Thomas] Chalmers, “among the eternal sanctities of piety, and truth, and justice.” It stands associated with duties which are clearly and confessedly of permanent moral obligation, and no intimation is given that the requirement is only temporary. Is this fourth precept, then, to be regarded as an exception to the general principle, — as nothing more than a positive enactment, having no foundation in the nature of man as a moral being, and admitting, therefore, of being repealed at the will of the Lawgiver?

Surely the duties of worshipping God, cultivating holiness, preparing for the rest of heaven, are duties of a moral nature, and can there be anything more directly and properly moral than the setting apart of a certain portion of time for giving special attention to these duties? It is founded in man’s moral constitution. And what if the very proportion of time, which He who knows our frame has appointed for the purpose of rest — a seventh, rather than a sixth or an eighth part — should be, as eminent physiologists have told us, exactly the proportion that is requisite to restore the balance of the circulation, so as to secure a long life? Then the Fourth Commandment would have nothing positive in it at all; even the very proportion of time which God has fixed is moral, if such an arrangement be founded in the nature of man.</p></blockquote>

Surely the duties of worshipping God, cultivating holiness, preparing for the rest of heaven, are duties of a moral nature, and can there be anything more directly and properly moral than the setting apart of a certain portion of time for giving special attention to these duties? It is founded in man’s moral constitution. And what if the very proportion of time, which He who knows our frame has appointed for the purpose of rest — a seventh, rather than a sixth or an eighth part — should be, as eminent physiologists have told us, exactly the proportion that is requisite to restore the balance of the circulation, so as to secure a long life? Then the Fourth Commandment would have nothing positive in it at all; even the very proportion of time which God has fixed is moral, if such an arrangement be founded in the nature of man.”

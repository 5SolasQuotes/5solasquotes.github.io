<main class="wrap"><figure class="quote" id="q-e417576cb2" data-kw="">
<blockquote><p>The Mediator will carry on his work of saving sinful men, until he has gathered in his church, and completed the work according to the original plan and covenant between himself and his Father, and then will surrender his mediatorial commission and office. There will then no longer be any mediation going on between sinners and God.

The church will be forever united to their Divine Head in heaven, and the wicked will be shut up in the “outer darkness.” That Christ’s mediatorial work does not secure the salvation of all men during the appointed period in which it is carried on, is proved by the fact that when “the end cometh” some men are described as the “enemies” of Christ, and as being “put under his feet” (1 Cor. 15:24, 25). All of Christ’s redeemed “stand before his throne” (Rev. 14:3; 19:4-7; 21:3). They are in the “mansions” which he has “prepared” for them (John 14:2, 3). ·

The reason assigned for Christ’s surrender of bis mediatorial commission is, “that God may be all in all” (1 Cor. 15:28): not, that “God even the Father may be all in all” (1 Cor. 15:24). It is the Trinity that is to be supreme. To Christ, as an incarnate trinitarian person, and an anointed mediator, “all power is [temporarily] given in heaven and upon earth” (Matt. 28:19), for the purpose of saving sinners. As such, he accepts and holds a secondary position of condescension and humiliation, when compared with his original unincarnate position. In this reference, he receives a “commandment” (John 10:18) , and a “kingdom” (1 Cor. 15: 24). In this reference, as believers “are Christ’s,” so “Christ is God’s” (1 Cor. 3:23); and as “the head of the woman is the man, so the head of Christ is God” (1 Cor. 11:3).</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-47507b6785" data-kw="">
<blockquote><p>For justice being a virtue of God and all the divine virtues which are in God exist perfectly to an infinite degree, it was necessary that God’s justice demand a retribution in the fullest measure since Man’s sin was specifically committed against an infinite majesty … And it is impossible that He would reestablish man in a state of integrity and virtue without a previous satisfaction of His righteous justice. …

Man therefore not being able to provide his own satisfaction to God and no other creature being capable of such a great feat, God ordained to send his Son into the world and caused Him to put on our human nature for two purposes: the first is to satisfy the justice of God by the suffering of the penalties which we alone deserved, and by this, establishing our guarantee. …

Therefore, since He became man, He was capable of actually suffering dead, and, in fact – it having been so decided by the commandment of His Father – Christ willing submitted to death. Further, in that He was also eternally Holy God, He was able by His suffering to take the punishment for our offences equal to their demerit, and by this means to satisfy, by His infinite worth, God’s perfect justice.</p></blockquote>

<blockquote><p>What then is our foundation in Christ? Is it that he begins salvation and leaves us to complete it? Is it that he only opened up the way, and left us to follow it in our own strength? By no means, but as Paul had a little before declared, it is to acknowledge that he has been given us for righteousness. … in short, all things of his are ours, we have all things in him, he nothing in us.</p></blockquote>

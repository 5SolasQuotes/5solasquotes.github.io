<main class="wrap"><figure class="quote" id="q-d76a7c7f0e" data-kw="">
<blockquote><p>Aquinas tells us that, just as God sustains and moves a creature to act through the contingency of its nature, so too does he move the creature again in grace, analogically elevating the creature to attain an end beyond the scope of its original nature. (ST i- ii q. 109, aa. 1, 6, 9) By invoking the language of movement, Aquinas chooses to describe grace not only within the linguistic but also the causal categories that mark the analogical relationship between God and the world, where creation as really related to God participates in God in a way proportioned to its nature. (ST i q. 13, a. 7) And yet the participation indicated by grace is qualitatively different and much deeper than that of nature. Unlike a natural end, the end of those infused virtues that characterize the life of the baptized is not a natural similitude of divine goodness, but is in fact God himself. (ST i- ii q. 1) All natural creaturely perfections are said of both the creature and of God, analogically: that which is “good” or “true” in a given creature is necessarily said of God as well. God is goodness, and created “good things” are a kind of participated similitude of the divine goodness. (ST i qq. 6, 13) Grace represents a furthered participation, this time in Divine nature itself. Aquinas himself says clearly that “grace is nothing except a participated similitude of divine nature.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries</cite>, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), pp. 231-32 Lynch is a Dominican and writes in the Thomist tradition.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3fa18d27c5" data-kw="">
<blockquote><p>The first [way] argues that the existence, even for an instant, of composites of act and potency presupposes the simultaneous existence of that which is pure act; the second argues that the existence, even for an instant, of composites of essence and existence presupposes the simultaneous existence of that which is being or existence itself; the third argues that the existence, even for an instant, of composites of form and matter presupposes the simultaneous existence of an absolutely necessary being; the fourth argues that the existence, even for an instant, of things which are many and come in degrees of perfection presupposes the simultaneous existence of something one and absolutely perfect; and the fifth argues that the existence, even for an instant, of finality or directedness toward an end presupposes the simultaneous existence of a supreme ordering intellect.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Neo-Scholastic Essays</cite>, ch. 5, ‘Existential Inertia &amp; the Five Ways’ in Neo-Scholastic Essays (South Bend, IN: St. Augustine’s Press, 2015), pp. 87-88</span></figcaption>

</figure><figure class="quote" id="q-7ca6866edf" data-kw="">
<blockquote><p>The judgments of God do not always follow crimes, as thunder does lightning, but sometimes the space of many ages coming between. When the sun has shined fair the space of six days upon their tabernacle, we know not what clouds the seventh may bring. And when their punishment does come, let them make their account, in the greatness of their sufferings to pay the interest of that respite which has been given them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of Mr. Richard Hooker</cite>, … in Eight Books of Ecclesiastical Polity (d. 1600; London: Newcomb, 1666), A Remedy against Sorrow &amp; Fear, delivered in a Funeral Sermon, p. 546 Note Hooker’s use of the phrase here is not limited to natural days.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-b6781960e7" data-kw="">
<blockquote><p>Intellection can exist (as is plain from our own inner experience); but God, as supreme cause of everything outside himself, must have the perfection of his effects either formally or at least virtually. He does not have intellection merely virtually, because a being that is formally unknowing cannot be the sufficient reason of anything formally knowing, otherwise the effect would be more perfect than its cause; therefore he has intellection formally, which is [the] proposed conclusion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics</cite>, (Milwaukee: Bruce Publishing Co., 1958), pp. 93-95; p. 96</span></figcaption>

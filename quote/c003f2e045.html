<main class="wrap"><figure class="quote" id="q-c003f2e045" data-kw="">
<blockquote><p>Again, your subjoined text of Scripture [to your book], ‘If the Lord be God, follow Him; but if Baal’—for what purpose was it set there? What? to signify that the God of the dissenters and of the Established Church differ as the living God and Baal?… It was uncharitable. Uncharitable? That is a trifle in comparison; it was profane and most impious wit: yet you are mighty fond of the conceit and we have it over and over in the book that the conformists and dissenters serve two Gods—as the one of them is miscalled—and have two religions!… and, for aught appears you intend, in most of them [established churches], you blaspheme as a senseless idol—rebuke, and forgive you!</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe</cite>, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), p. 284</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Again, your subjoined text of Scripture [to your book], ‘If the Lord be God, follow Him; but if Baal’—for what purpose was it set there? What? to signify that the God of the dissenters and of the Established Church differ as the living God and Baal?… It was uncharitable. Uncharitable? That is a trifle in comparison; it was profane and most impious wit: yet you are mighty fond of the conceit and we have it over and over in the book that the conformists and dissenters serve two Gods—as the one of them is miscalled—and have two religions!… and, for aught appears you intend, in most of them [established churches], you blaspheme as a senseless idol—rebuke, and forgive you!”

— John Howe, ‘Some Consideration of a Preface to an Inquiry Concerning the Occasional Conformity of Dissenters, etc.’ in The Works of John Howe, vol. 5, Containing the Treatises: On Divine Prescience and the Trinity… (d. 1705; Religious Tract Society, 1863), p. 284">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAgain%2C+your+subjoined+text+of+Scripture+%5Bto+your+book%5D%2C+%E2%80%98If+the+Lord+be+God%2C+follow+Him%3B+but+if+Baal%E2%80%99%E2%80%94for+what+purpose+was+it+set+there%3F+What%3F+to+signify+that+the+God+of+the+dissenters+and+of+the+Established+Church+differ+as+the+living+God+and+Baal%3F%E2%80%A6+It+was+uncharitable.+Uncharitable%3F+That+is+a+trifle+in+comparison%3B+it+was+profane+and+most+impious+wit%3A+yet+you+are+mighty+fond+of+the+conceit+and+we+have+it+over+and+over+in+the+book+that+the+conformists+and+dissenters+serve+two+Gods%E2%80%94as+the+one+of+them+is+miscalled%E2%80%94and+have+two+religions%21%E2%80%A6+and%2C+for+aught+appears+you+intend%2C+in+most+of+them+%5Bestablished+churches%5D%2C+you+blaspheme+as+a+senseless+idol%E2%80%94rebuke%2C+and+forgive+you%21%E2%80%9D%0A%0A%E2%80%94+John+Howe%2C+%E2%80%98Some+Consideration+of+a+Preface+to+an+Inquiry+Concerning+the+Occasional+Conformity+of+Dissenters%2C+etc.%E2%80%99+in+The+Works+of+John+Howe%2C+vol.+5%2C+Containing+the+Treatises%3A+On+Divine+Prescience+and+the+Trinity%E2%80%A6+%28d.+1705%3B+Religious+Tract+Society%2C+1863%29%2C+p.+284&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc003f2e045.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c003f2e045.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Again%2C%20your%20subjoined%20text%20of%20Scripture,a%20senseless%20idol%E2%80%94rebuke%2C%20and%20forgive%20you&amp;text=Again%2C%20your%20subjoined%20text%20of%20Scripture%20%5Bto%20your&amp;text=blaspheme%20as%20a%20senseless%20idol%E2%80%94rebuke%2C%20and%20f </figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4bce4e3a71" data-kw="">
<blockquote><p>Let the prayer, thanksgiving, or blessing of the bread and wine, be to this effect: ‘With humble and hearty acknowledgment of the greatness of our misery, from which neither man nor angel was able to deliver us, and of our great unworthiness of the least of all God’s mercies; to give thanks to God for all his benefits… and for this sacrament in particular, by which Christ, and all his benefits, are applied and sealed up unto us, which, notwithstanding the denial of them unto others, are in great mercy continued unto us, after so much and long abuse of them all…&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Directory for Public Worship</cite>, Of the Celebration of the Communion, or Sacrament of the Lord’s Supper</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-8e9b37055c" data-kw="">
<blockquote><p>Baptism is fully and formally God’s ordinance, though the [sign of the] cross be needlessly and superstitiously added thereunto [on the baby’s head] and the parent (by virtue of whose interest in God’s Covenant, the child receives the seal) is unjustly excluded [in the Anglican practice], and a deputation of godfathers and godmothers is groundlessly imposed:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/zachary-crofton.html">Zachary Crofton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church</cite>, … in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 24</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“Baptism is fully and formally God’s ordinance, though the [sign of the] cross be needlessly and superstitiously added thereunto [on the baby’s head] and the parent (by virtue of whose interest in God’s Covenant, the child receives the seal) is unjustly excluded [in the Anglican practice], and a deputation of godfathers and godmothers is groundlessly imposed:”

— Zachary Crofton, Reformation, Not Separation, or, Mr. Crofton’s Plea for Communion with the Church… in a Letter, written July 20, 1661… (1662) Crofton (1626-1672) was a presbyterian and puritan born and raised in Ireland., p. 24">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBaptism+is+fully+and+formally+God%E2%80%99s+ordinance%2C+though+the+%5Bsign+of+the%5D+cross+be+needlessly+and+superstitiously+added+thereunto+%5Bon+the+baby%E2%80%99s+head%5D+and+the+parent+%28by+virtue+of+whose+interest+in+God%E2%80%99s+Covenant%2C+the+child+receives+the+seal%29+is+unjustly+excluded+%5Bin+the+Anglican+practice%5D%2C+and+a+deputation+of+godfathers+and+godmothers+is+groundlessly+imposed%3A%E2%80%9D%0A%0A%E2%80%94+Zachary+Crofton%2C+Reformation%2C+Not+Separation%2C+or%2C+Mr.+Crofton%E2%80%99s+Plea+for+Communion+with+the+Church%E2%80%A6+in+a+Letter%2C+written+July+20%2C+1661%E2%80%A6+%281662%29+Crofton+%281626-1672%29+was+a+presbyterian+and+puritan+born+and+raised+in+Ireland.%2C+p.+24&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8e9b37055c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8e9b37055c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=Baptism%20is%20fully%20and%20formally%20God%E2%80%99s,godfathers%20and%20godmothers%20is%20groundlessly%20imposed&amp;text=Baptism%20is%20fully%20and%20formally%20God%E2%80%99s%20ordinance%2C%20though&amp;text=deputation%20of%20godfathers%20and%20godmothers%20is%20groundlessly%20imposed" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-b150bf6217" data-kw="">
<blockquote><p>While the people with fear and joy see God lighting his own fire, fire from heaven, the two sons of Aaron, in a careless presumption, will be serving Him with a common flame; as if He might not have leave to choose the forms of his own worship. If this had been done some ages after, when the memory of the original of this heavenly fire had been worn out, it might have been excused with ignorance; but now, when God had newly sent his fire from above, newly commanded the continuance of it, either to let it go out, or, while it still flamed, to fetch profane coals to God’s altar, could savour of no less than presumption and sacrilege. … Speed of death is not always a judgment: suddenness, as it is ever justly suspicable, so then certainly argues anger, when it finds us in an act of sin. Leisure of repentance is an argument of favor. When God gives a man law, it implies that He would not have judgment surprise him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contemplations on the Historical Passages of the Old &amp; New Testaments</cite>, (1614; London: 1868), bk. 6, Contemplation 2, pp. 66-67</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-fb2974c366" data-kw="">
<blockquote><p>[Ex. 28] Verse 38. ‘That Aaron may bear the iniquity of the offerings.’… the words following in the end of the verse, ‘to make them acceptable before the Lord,’ show that the meaning is not that Aaron should be punished, but that by his office, their offerings, though otherwise imperfect, should be accepted.</p></blockquote>

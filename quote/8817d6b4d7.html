<main class="wrap"><figure class="quote" id="q-8817d6b4d7" data-kw="">
<blockquote><p>This same election took place, not on the basis of foreseen faith, of the obedience of faith, of holiness, or of any other good quality and disposition, as though it were based on a prerequisite cause or condition in the person to be chosen, but rather for the purpose of faith, of the obedience of faith, of holiness, and so on. Accordingly, election is the source of every saving good. Faith, holiness, and the other saving gifts, and at last eternal life itself, flow forth from election as its fruits and effects. As the apostle says, “He chose us” (not because we were, but) “so that we should be holy and blameless before him in love” (Eph. 1:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 9</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3eda47bbc3" data-kw="">
<blockquote><p>Our election … consisteth not in ourselves, but in the eternal and immutable good pleasure of God, and that in such absolute authority that it cannot be overthrown, neither by the raging storms of the world, nor by the assaults of Satan; neither yet by the wavering and weakness of our own flesh. Then only is our salvation in assurance, when we find the cause of the same in the bosom and counsel of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-knox.html">John Knox</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Predestination</cite>, p. 33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election/ground-of-election.html">Ground of Election</a> › <a href="../topics/election/ground-of-election/gods-good-pleasure.html">God&#x27;s good pleasure</a></span><span class="t"><a href="../topics/election/ground-of-election.html">Ground of Election</a> › <a href="../topics/election/ground-of-election/not-foreseen-faith-or-works.html">Not foreseen faith or works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Our election … consisteth not in ourselves, but in the eternal and immutable good pleasure of God, and that in such absolute authority that it cannot be overthrown, neither by the raging storms of the world, nor by the assaults of Satan; neither yet by the wavering and weakness of our own flesh. Then only is our salvation in assurance, when we find the cause of the same in the bosom and counsel of God.”

</figure><figure class="quote" id="q-c54f80c71b" data-kw="">
<blockquote><p>The cause of this undeserved election is exclusively the good pleasure of God. This does not involve God’s choosing certain human qualities or actions from among all those possible as a condition of salvation, but rather involves adopting certain particular persons from among the common mass of sinners as God’s own possession. As Scripture says, “When the children were not yet born, and had done nothing either good or bad . . . , she (Rebecca) was told, ‘The older will serve the younger.’ As it is written, ‘Jacob I loved, but Esau I hated’” (Rom. 9:11-13). Also, “All who were appointed for eternal life believed” (Acts 13:48).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/synod-of-dort.html">Synod of Dort</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Canons of Dort</cite>, Head 1, Art. 10</span></figcaption>

</figure><figure class="quote" id="q-11dffc7fdb" data-kw="">
<blockquote><p>The will of God is the supreme rule of righteousness, so that everything which he wills must be held to be righteous by the mere fact of his willing it. Therefore, when it is asked why the Lord did so, we must answer, Because he pleased. But if you proceed farther to ask why he pleased, you ask for something greater and more sublime than the will of God, and nothing such can be found.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 3.23.2</span></figcaption>

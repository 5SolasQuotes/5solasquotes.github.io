<main class="wrap"><figure class="quote" id="q-289675faa2" data-kw="">
<blockquote><p>It may seem to cursory readers of the New Testament, that our Lord abrogated the sabbath, and in his own conduct disregarded it. But this is far from being a correct view of the fact. The Pharisees insisted on such a rigid observation of the day of rest, as to prohibit works of real necessity and mercy. This superstitious and over-scrupulous opinion, our Saviour denounced, and showed, that healing the sick, and satisfying the cravings of hunger, were things lawful to be done on the sabbath.

And what renders it certain that this is a correct view of the matter is, that our Lord justifies his conduct by the practice of the saints in ancient times, when the sabbath was in full force by the acknowledgment of all, and by the provisions of the Levitical law itself, which required the priests to perform double labour on the sabbath. And he, moreover, showed, that the accusation against him, for a violation of the sabbath, was hypocritical; because, the very persons who made it, would pull an ox or sheep out of a pit into which it had fallen, on the sabbath day; and also, because they thought it no violation of the sacredness of the sabbath, to lead an ox or ass to watering, though they objected to the disciples satisfying their hunger on that day.

Our Lord was as much opposed to the perversion of the commandment as to disobedience. He had no respect for the superstitious and unduly rigorous opinions and practices of the self-righteous Pharisees. He taught—and exemplified it in his own conduct—that “the sabbath was made for man, and not man for the sabbath.” One of his expressions has evidently been misunderstood, by some interpreters. It is where he says, that “the Son of man is Lord also of the sabbath.” They have interpreted this to mean, that Christ claimed the right to do those things on the sabbath, which would be unlawful to others on that day. But this cannot be the meaning; for Christ was made under the law, and had bound himself to obey it. He came not to destroy the law, but to fulfil it. A breach of the fourth commandment would have been sin in him, as much as in any other. I take the meaning to be, that as he appointed the sabbath, so he best knew how to interpret his own law.

There is a text in Paul’s epistle to the Romans, which has been supposed to teach that it is a matter of indifference whether we observe the sabbath or not. — “One man esteemeth one day above another: another esteemeth every day alike. Let every man be fully persuaded in his own mind.” But evidently, the question here discussed relates to the ceremonial law. It relates not to the sabbath; which, as we have seen, was no part of the ceremonial law, but belonged to the moral code. The ceremonial law was virtually abrogated by the death of Christ; but all Christians were not yet enlightened to understand their Christian liberty; and such were indulged in their continued observance of these rites. The apostle is treating here of meats and drinks and festival days, the binding obligation of which had ceased.

But in the epistle to the Colossians, Paul says, “Let no man, therefore, judge you, in meat or drink, or in respect of a holy day, or of the new moon, or the sabbath days.” Here, again, the ceremonial law is obviously the subject of discourse. He is speaking of “meats,” “drinks,” “new moons,” and “sabbath days.” And the word sabbath relates to the numerous sabbaths of the ceremonial law, distinct from the weekly sabbath. Whenever a festival of the law continued eight days, the first and last were always kept as sabbaths. Or the reference might be to the sabbatical year, for the word days is not in the original.

But on supposition that the weekly sabbath was intended, the meaning might be that the Jewish sabbath, namely, the seventh day of the week, was no longer obligatory on Christians, since they had, by divine direction, adopted the first day for their day of sacred rest and of holding public assemblies for the worship of God. This leads to the inquiry, what evidence have we that such a change was ever made by divine authority?

The uniform practice of Christians, to meet on the first day of the week, from the very time of Christ’s resurrection, is strong evidence that this change was introduced by Christ and the apostles. It was suitable, that as the worship of God by his people, would have principally respect to the work of redemption, it should be celebrated on that day on which it was made manifest that this glorious work was completed. Accordingly, Christ having risen from the dead, always met his disciples on this day. And afterwards, the apostles and the churches were accustomed to come together on this day, “to break bread,” that is to celebrate the Lord’s supper. And when the apostle wrote his first epistle to the Corinthians, it was already established as a custom, not only in the church of Corinth, but in the churches of Macedonia and Galatia, that their contributions for the poor, should be collected on this day. From the apostolical practice, we rightly infer the divine authority for this change.

So generally was the first day of the week observed, in commemoration of Christ’s resurrection, and for the celebration of religious worship, that in the times of the apostles, it had obtained the significant denomination of the Lord’s Day. That this appellation really was applied to the first day of the week by the apostle John, in the Apocalypse, is evident, because it can, with no appearance of reason, be applied to any other day; and also, because this became a common appellation of that day among Christians in all subsequent ages to this time, as appears by the testimony of Justin Martyr, and others.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-alexander.html">Archibald Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Compend of Bible Truth</cite>, (Philadelphia PA: Presbyterian Board of Publication, 1846), pp 186-89.</span></figcaption>

<blockquote><p>Clearly the Westminster divines did not believe in the validity of instrumental worship.</p></blockquote>

— Nick Needham, Needham is a contemporary church historian who lectures for Highland Theological College in Scotland, ‘Westminster and Worship: Psalms, Hymns, and Musical Instruments,’ in The Westminster Confession into the 21st Century, vol. 2, ed. J. Ligon Duncan (Rossshire, Scotland: Christian Focus Publications, 2005), p. 291">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CClearly+the+Westminster+divines+did+not+believe+in+the+validity+of+instrumental+worship.%E2%80%9D%0A%0A%E2%80%94+Nick+Needham%2C+Needham+is+a+contemporary+church+historian+who+lectures+for+Highland+Theological+College+in+Scotland%2C+%E2%80%98Westminster+and+Worship%3A+Psalms%2C+Hymns%2C+and+Musical+Instruments%2C%E2%80%99+in+The+Westminster+Confession+into+the+21st+Century%2C+vol.+2%2C+ed.+J.+Ligon+Duncan+%28Rossshire%2C+Scotland%3A+Christian+Focus+Publications%2C+2005%29%2C+p.+291&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F55ae836a59.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/55ae836a59.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/musical-instruments/the-westminster-confession-and-musical-instruments-in-worship/#:~:text=Clearly%20the%20Westminster%20divines%20did%20not,in%20the%20validity%20of%20instrumental%20worship&amp;text=Clearly%20the%20Westminster%20divines%20did%20not%20believe%20in&amp;text=not%20believe%20in%20the%20validity%20of%20instrumental%20worship" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-941a633e90" data-kw="">
<blockquote><p>These verses show us how little the Jews of our Lord’s time understood the right use of the Sabbath day. We read that some of the Pharisees found fault because a blind man was miraculously healed on the Sabbath. They said, “This man is not of God, because He keepeth not the Sabbath day.” A good work had manifestly been done to a helpless fellow-creature. A heavy bodily infirmity had been removed. A mighty act of mercy had been performed. But the blind-hearted enemies of Christ could see no beauty in the act. They called it a breach of the Fourth Commandment!

These would-be wise men completely mistook the intention of the Sabbath. They did not see that it was “made for man,” and meant for the good of man’s body, mind, and soul. It was a day to be set apart from others, no doubt, and to be carefully sanctified and kept holy. But its sanctification was never intended to prevent works of necessity and acts of mercy. To heal a sick man was no breach of the Sabbath day. In finding fault with our Lord for so doing, the Jews only exposed their ignorance of their own law. They had forgotten that it is as great a sin to add to a commandment, as to take it away.

Here, as in other places, we must take care that we do not put a wrong meaning on our Lord’s conduct. We must not for a moment suppose that the Sabbath is no longer binding on Christians, and that they have nothing to do with the Fourth Commandment. This is a great mistake, and the root of great evil. Not one of the ten commandments has ever been repealed or put aside. Our Lord never meant the Sabbath to become a day of pleasure, or a day of business, or a day of traveling and idle dissipation. He meant it to be “kept holy” as long as the world stands.

It is one thing to employ the Sabbath in works of mercy, in ministering to the sick, and doing good to the distressed. It is quite another thing to spend the day in visiting, feasting, and self-indulgence. Whatever men may please to say, the way in which we use the Sabbath a sure test of the state of our religion. By the Sabbath may be found out whether we love communion with God. By the Sabbath may be found out whether we are in tune for heaven. By the Sabbath, in short, the secrets of many hearts are revealed. There are only too many of whom we may say with sorrow, “These men are not of God, because they keep not the Sabbath day.</p></blockquote>

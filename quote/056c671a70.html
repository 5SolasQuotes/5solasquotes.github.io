<main class="wrap"><figure class="quote" id="q-056c671a70" data-kw="">
<blockquote><p>Answer… nor were all these things [including the angelic “world”] created in the space of six days, as you untruly affirm. … Secondly, nor were the angels and their heavens created within the space of those six days, wherein all things of this world were made, Gen. 1.1—but long before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-parker.html">William Parker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Late Assembly of Divines’ Confession of Faith Examined: as it was Presented by Them unto the Parliament, wherein Many of their Excesses &amp; Defects of their Confusions &amp; Disorders, of their Errors and Contradictions, are Presented Both to Themselves &amp; Others (1651), ch. 4, ‘Of the Creation’</cite>, p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

— William Parker, The Late Assembly of Divines’ Confession of Faith Examined: as it was Presented by Them unto the Parliament, wherein Many of their Excesses &amp; Defects of their Confusions &amp; Disorders, of their Errors and Contradictions, are Presented Both to Themselves &amp; Others (1651), ch. 4, ‘Of the Creation’, p. 53">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnswer%E2%80%A6+nor+were+all+these+things+%5Bincluding+the+angelic+%E2%80%9Cworld%E2%80%9D%5D+created+in+the+space+of+six+days%2C+as+you+untruly+affirm.+%E2%80%A6+Secondly%2C+nor+were+the+angels+and+their+heavens+created+within+the+space+of+those+six+days%2C+wherein+all+things+of+this+world+were+made%2C+Gen.+1.1%E2%80%94but+long+before.%E2%80%9D%0A%0A%E2%80%94+William+Parker%2C+The+Late+Assembly+of+Divines%E2%80%99+Confession+of+Faith+Examined%3A+as+it+was+Presented+by+Them+unto+the+Parliament%2C+wherein+Many+of+their+Excesses+%26+Defects+of+their+Confusions+%26+Disorders%2C+of+their+Errors+and+Contradictions%2C+are+Presented+Both+to+Themselves+%26+Others+%281651%29%2C+ch.+4%2C+%E2%80%98Of+the+Creation%E2%80%99%2C+p.+53&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F056c671a70.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/056c671a70.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/creation/on-westminsters-in-the-space-of-six-days/#:~:text=Answer%E2%80%A6%20nor%20were%20all%20these%20things,were%20made%2C%20Gen.%201.1%E2%80%94but%20long%20before." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e60a53b20b" data-kw="">
<blockquote><p>Even though Calvin, Ames, and the authors of the Westminster Standards, with few exceptions, if any, undoubtedly understood the days to be ordinary days, there is no ground for supposing that they intended to exclude any and all other views, in particular the view that the days may be longer. Such views are outside their purview; their concern, in fact, moves in the opposite direction, against the instantaneous view that denies any length. This point bears emphasizing within the context of the current debate about the days of Genesis. To establish that the Standards mandate the six 24 hour days view requires more than demonstrating that the Divines, perhaps even to a man, held that the days were ordinary days. To demonstrate that of itself establishes nothing. What needs also to be shown, which we believe cannot be shown, is that they intended to exclude the views that the days are longer in some respect or that they represent a literary framework.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-theological-seminary-east-faculty.html">Westminster Theological Seminary, East, Faculty</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Westminster Theological Seminary &amp; the Days of Creation’ (1999) 5 pp.</cite>, p. 3</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

<blockquote><p>Question: Did God make the world in one instant? Answer: No: But by parts, in the space of six days. … Question: What was the first degree of his exaltation? Answer: His Resurrection, the third day, whereby his soul and body were brought together again by the power of the Godhead, and so He rose from death and appeared to his disciples, for the space of forty days.</p></blockquote>

</figure><figure class="quote" id="q-b3534ad0fd" data-kw="">
<blockquote><p>Creation is the action of God, whereby out of nothing He brought forth nature itself and all things in nature, both substances and accidents, in and with the substances, and finished them in the space of six days, both to his own glory and the salvation of the elect… Or thus, creation is a transient or external action of God, whereby in the beginning He made the world by a mere command out of his own free will in six days’ space to the glory of his name.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System or Body of Divinity (London: 1654), bk. 3, ch. 2</cite>, p. 225</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

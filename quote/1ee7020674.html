<main class="wrap"><figure class="quote" id="q-1ee7020674" data-kw="">
<blockquote><p>Howbeit, although the Sabbath was not a figure unto Adam of resting from sin, yet it was unto him a sign, that he should come to the kingdom of God, where should neither be eating, nor drinking, nor marrying: all which seeing Adam had, it is manifest that he was not in the kingdom of God as yet.

The Sabbath then did put him in mind, that he should not always be working, but that he should be translated, though not die: (for although he was created in innocence, yet not free from being translated to a better place at God his good time) but, as the Apostle saith, he should have been changed as were Enoch and Elijah, though after a more excellent manner.

We have now the Lord’s Day, which assureth us, that as now by faith and hope we enjoy the life to come: so hereafter these two ceasing, we shall more fully and perfectly enjoy the same: and as our Sacraments purely used, show a thing not to come, but already past; so this day truly kept, is a resemblance of a thing not past, but to come. For as on this day from the morning to evening we praise God, if we keep the day holy, and yet withdrawn and interrupted with many by-thoughts, and secret distractions: so in heaven being freed from worldly, carnal, fearful, and manifold affections and troubles, we shall more continually praise the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two</cite></span></figcaption>

ological-sign/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b75d1598ae" data-kw="">
<blockquote><p>To this add, in that the ancient bishops in the celebration of the Lord’s Supper did put on another garment than that they usually did wear, appertains nothing to the alteration of the Lord’s Supper: For Christ commanded not that we should celebrate his Supper with our usual garments, as He did, but only that we should do that which He did Himself. The like may be affirmed of sundry other things, as well in baptism as in the Supper of the Lord. The sum of all is this: Such things as are added, but yet as matters indifferent, for order, for decency and to edification, such matters do not change the substance of the sacraments, and therefore alter not the worship. But such things as are taken from the institution of Christ, or else are added as necessary, and appertaining to the substance, those things do corrupt the institution of the Lord, and so do establish another kind of worship.</p></blockquote>

<blockquote><p>10th Question: What duties are done by the minister? A. 1 Reading the Word. Acts 13:27; Col. 4:16 2 Preaching it. Lk. 4:20-21; Acts 13:15 3 Praying and praising God. 1 Cor. 14:15-16; Neh. 8:6 &amp; 9:5-6 4 Administering Sacraments. Mt. 28:19 &amp; 26:26; Acts 20:11 5. Blessing the people. Num. 6:23 In performing the two first (reading and preaching the Word) and the two last (administering Sacraments, and blessing the people) the Minister stands in God’s room, and is his mouth: but in the middlemost duty (praying to God and praising Him) he is the peoples’ mouth to God.</p></blockquote>

<blockquote><p>And then (saith he) it shall come to passe, that all the people of Israel shall be saved: which testimony of the Apostle is a sufficient argument to declare, that the Jews shall be restored again, if I be not deceived. … But the knowledge of the certain moments and appointed minutes of that time, we commit unto the Lord. This only we learn most assured out of S. Paul, that God hath decreed upon an infallible certainty of time, wherein the Gentiles shall mount to their fullness, and the Jews also after that fullness of time shall return unto the faith.

For speedy &amp; good success whereof, this one thing doth minister plentiful matter of good hope, yet our Lord Jesus Christ hath vouchsafed to cleanse his Churches every where almost so happily in these our days, &amp; purged them from all offences &amp; stumbling blocks, which occasioned the Jews to withdraw themselves so long from the participation of our faith.

And here I might use offered opportunity, to exclaim against the presumptuous boldness of those persons whatsoever they were, which presumed to thrust into Temples and Churches of Christians, images, and counterfeits of the saints and the saints at the first, and to convey the pure worshipping of the invisible God, to the representations of visible things, contrary to the prescript ordinance of the Law of God, contrary to reason &amp; nature, contrary to the approved custom of the elders, &amp; contrary to all example of the Patriarchs, Prophets &amp; Apostles: out of which puddle as issued wonderful stench, so amongst all other, nothing more noisome then those pestilent Botches of image worship, bread worship, wine worship, cross worship, signs &amp; portraits of visible creatures, the view whereof caused the true and sincere profession of the Christians to be loathsome to the Jews, to their great hindrance and prejudice.

For what marvel was it if the Jews (yet were taught by the prescript rule of God’s law to abhor worshipping of images) entering into the churches of Christians, &amp; beholding the walls, pillars, &amp; all the corners thereof, bedaubed with painted, &amp; carved idols, besides innumerable other bables of imagery, perceiving also open market to be made, not only of the picture of the crosse, but of the sacrament of bread &amp; wine also, displayed &amp; blazed abroad not after the manner of communicating, but gloriously vaunted with singular magnificence to be honoured and kneeled unto: what marvel was it (I say) if they being offended with this open idolatry, did so long refrain from us, and from the discipline of our faith?

But it is well now, thanked be Christ, yet these offensive baggage &amp; image worshippings are for yet more part defaced &amp; scraped out of Christian churches, &amp; the ancient purity of Christian profession, is begun to take so good footing, yet now amongst us remain no dregs in our temples, in our religion, nor in our doctrine, that may minister just occasion of offence to the Jews, or any other enemies, though they inveigh our religion never so much.

And I would to God, all other that profess the name of Christians, would yield their like endeavour to the abolishment of all corruptions of religion, and incivility of living out of their congregations, which may breed any further loathsomeness to the Jews. Truly this is much to be lamented, that our adversaries can find no blemish of just quarrel in the person of Christ Jesus, whose name we would seem to profess: and on the other side, to wit, in us nothing consonant, and agreeable to the true touchstone of Gods holy word, and Christ’s religion, whereof we bear the name, but all things repugnant and unlike the pure &amp; first pattern thereof. …

We have been plagued sufficiently enough by the Turks [Muslims] and Saracens for our idolatry, if we respect the sundry overthrows, famines, slaughters, and alterations of kingdoms, wherewith the Christians have been miserably tormented many hundred years, to the great delight of the Jews: neither is any hope almost of redress from great calamities, like to ensue, unless we cast away this worshipping of idols out of Christian congregations and Temples, (as I said before) and by this means enter upon a new course of better conversation and purer worshipping of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-foxe.html">John Foxe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached at the christening of a certain Jew at London by John Foxe. Containing an exposition of the xi. chapter of S. Paul to the Romans</cite>, trans. James Bell (London: Christopher Barker, 1578), unpaginated.</span></figcaption>

— John Foxe, A sermon preached at the christening of a certain Jew at London by John Foxe. Containing an exposition of the xi. chapter of S. Paul to the Romans, trans. James Bell (London: Christopher Barker, 1578), unpaginated.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAnd+then+%28saith+he%29+it+shall+come+to+passe%2C+that+all+the+people+of+Israel+shall+be+saved%3A+which+testimony+of+the+Apostle+is+a+sufficient+argument+to+declare%2C+that+the+Jews+shall+be+restored+again%2C+if+I+be+not+deceived.+%E2%80%A6+But+the+knowledge+of+the+certain+moments+and+appointed+minutes+of+that+time%2C+we+commit+unto+the+Lord.+This+only+we+learn+most+assured+out+of+S.+Paul%2C+that+God+hath+decreed+upon+an+infallible+certainty+of+time%2C+wherein+the+Gentiles+shall+mount+to+their+fullness%2C+and+the+Jews+also+after+that+fullness+of+time+shall+return+unto+the+faith.%0A%0AFor+speedy+%26+good+success+whereof%2C+this+one+thing+doth+minister+plentiful+matter+of+good+hope%2C+yet+our+Lord+Jesus+Christ+hath+vouchsafed+to+cleanse+his+Churches+every+where+almost+so+happily+in+these+our+days%2C+%26+purged+them+from+all+offences+%26+stumbling+blocks%2C+which+occasioned+the+Jews+to+withdraw+themselves+so+long+from+the+participation+of+our+faith.%0A%0AAnd+here+I+might+use+offered+opportunity%2C+to+exclaim+against+the+presumptuous+boldness+of+those+persons+whatsoever+they+were%2C+which+presumed+to+thrust+into+Temples+and+Churches+of+Christians%2C+images%2C+and+counterfeits+of+the+saints+and+the+saints+at+the+first%2C+and+to+convey+the+pure+worshipping+of+the+invisible+God%2C+to+the+representations+of+visible+things%2C+contrary+to+the+prescript+ordinance+of+the+Law+of+God%2C+contrary+to+reason+%26+nature%2C+contrary+to+the+approved+custom+of+the+elders%2C+%26+contrary+to+all+example+of+the+Patriarchs%2C+Prophets+%26+Apostles%3A+out+of+which+puddle+as+issued+wonderful+stench%2C+so+amongst+all+other%2C+nothing+more+noisome+then+those+pestilent+Botches+of+image+worship%2C+bread+worship%2C+wine+worship%2C+cross+worship%2C+signs+%26+portraits+of+visible+creatures%2C+the+view+whereof+caused+the+true+and+sincere+profession+of+the+Christians+to+be+loathsome+to+the+Jews%2C+to+their+great+hindrance+and+prejudice.%0A%0AFor+what+marvel+was+it+if+the+Jews+%28yet+were+taught+by+the+prescript+rule+of+God%E2%80%99s+law+to+abhor+worshipping+of+images%29+entering+into+the+churches+of+Christians%2C+%26+beholding+the+walls%2C+pillars%2C+%26+all+the+corners+thereof%2C+bedaubed+with+painted%2C+%26+carved+idols%2C+besides+innumerable+other+bables+of+imagery%2C+perceiving+also+open+market+to+be+made%2C+not+only+of+the+picture+of+the+crosse%2C+but+of+the+sacrament+of+bread+%26+wine+also%2C+displayed+%26+blazed+abroad+not+after+the+manner+of+communicating%2C+but+gloriously+vaunted+with+singular+magnificence+to+be+honoured+and+kneeled+unto%3A+what+marvel+was+it+%28I+say%29+if+they+being+offended+with+this+open+idolatry%2C+did+so+long+refrain+from+us%2C+and+from+the+discipline+of+our+faith%3F%0A%0ABut+it+is+well+now%2C+thanked+be+Christ%2C+yet+these+offensive+baggage+%26+image+worshippings+are+for+yet+more+part+defaced+%26+scraped+out+of+Christian+churches%2C+%26+the+ancient+purity+of+Christian+profession%2C+is+begun+to+take+so+good+footing%2C+yet+now+amongst+us+remain+no+dregs+in+our+temples%2C+in+our+religion%2C+nor+in+our+doctrine%2C+that+may+minister+just+occasion+of+offence+to+the+Jews%2C+or+any+other+enemies%2C+though+they+inveigh+our+religion+never+so+much.%0A%0AAnd+I+would+to+God%2C+all+other+that+profess+the+name+of+Christians%2C+would+yield+their+like+endeavour+to+the+abolishment+of+all+corruptions+of+religion%2C+and+incivility+of+living+out+of+their+congregations%2C+which+may+breed+any+further+loathsomeness+to+the+Jews.+Truly+this+is+much+to+be+lamented%2C+that+our+adversaries+can+find+no+blemish+of+just+quarrel+in+the+person+of+Christ+Jesus%2C+whose+name+we+would+seem+to+profess%3A+and+on+the+other+side%2C+to+wit%2C+in+us+nothing+consonant%2C+and+agreeable+to+the+true+touchstone+of+Gods+holy+word%2C+and+Christ%E2%80%99s+religion%2C+whereof+we+bear+the+name%2C+but+all+things+repugnant+and+unlike+the+pure+%26+first+pattern+thereof.+%E2%80%A6%0A%0AWe+have+been+plagued+sufficiently+enough+by+the+Turks+%5BMuslims%5D+and+Saracens+for+our+idolatry%2C+if+we+respect+the+sundry+overthrows%2C+famines%2C+slaughters%2C+and+alterations+of+kingdoms%2C+wherewith+the+Christians+have+been+miserably+tormented+many+hundred+years%2C+to+the+great+delight+of+the+Jews%3A+neither+is+any+hope+almost+of+redress+from+great+calamities%2C+like+to+ensue%2C+unless+we+cast+away+this+worshipping+of+idols+out+of+Christian+congregations+and+Temples%2C+%28as+I+said+before%29+and+by+this+means+enter+upon+a+new+course+of+better+conversation+and+purer+worshipping+of+God.%E2%80%9D%0A%0A%E2%80%94+John+Foxe%2C+A+sermon+preached+at+the+christening+of+a+certain+Jew+at+London+by+John+Foxe.+Containing+an+exposition+of+the+xi.+chapter+of+S.+Paul+to+the+Romans%2C+trans.+James+Bell+%28London%3A+Christopher+Barker%2C+1578%29%2C+unpaginated.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fce4875884b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/ce4875884b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/03/john-foxe-on-the-restoration-of-the-jews-and-images-in-churches/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

<main class="wrap"><figure class="quote" id="q-d8a938995a" data-kw="Spirit proceeds Filioque deity">
<blockquote><p>The Holy Spirit proceeds from the Father and the Son, and the reason is that He is called the Spirit of the Son in Galatians 4:6 and Romans 8. He who is called the Spirit of God is the same who is also called the Spirit of Christ. The second reason is that He is so the Spirit of the Son that He is sent by the Son (John 16:7, 14). But if one is sent, he is sent either by authority, or by counsel, or by natural production. He is not sent by authority, since He is God; nor by counsel, since He is also God—for one who is such is instructed by one wiser than himself. Therefore He is sent by natural procession.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-maccovius.html">Johannes Maccovius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Disputations on the Holy Spirit</cite>, II</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8d5cf3a7cf" data-kw="Spirit of both Filioque">
<blockquote><p>Scripture teaches that the Spirit proceeds from both the Father and the Son, in passages where He is called the Spirit of both. In Romans 8:9, He is called both the Spirit of God and the Spirit of Christ in the same verse. The Spirit is said to be sent by both the Father and the Son (John 15:26): &quot;The Comforter, whom I will send to you from the Father, the Spirit of truth, who proceeds from the Father.&quot; And in John 16:14: &quot;He will take what is mine and declare it to you.&quot; Reason also supports this.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXVII</span></figcaption>

— Pierre Du Moulin, Theological Theses on the One God and Three Persons, XXVII">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CScripture%20teaches%20that%20the%20Spirit%20proceeds%20from%20both%20the%20Father%20and%20the%20Son%2C%20in%20passages%20where%20He%20is%20called%20the%20Spirit%20of%20both.%20In%20Romans%208%3A9%2C%20He%20is%20called%20both%20the%20Spirit%20of%20God%20and%20the%20Spirit%20of%20Christ%20in%20the%20same%20verse.%20The%20Spirit%20is%20said%20to%20be%20sent%20by%20both%20the%20Father%20and%20the%20Son%20%28John%2015%3A26%29%3A%20%22The%20Comforter%2C%20whom%20I%20will%20send%20to%20you%20from%20the%20Father%2C%20the%20Spirit%20of%20truth%2C%20who%20proceeds%20from%20the%20Father.%22%20And%20in%20John%2016%3A14%3A%20%22He%20will%20take%20what%20is%20mine%20and%20declare%20it%20to%20you.%22%20Reason%20also%20supports%20this.%E2%80%9D%0A%0A%E2%80%94%20Pierre%20Du%20Moulin%2C%20Theological%20Theses%20on%20the%20One%20God%20and%20Three%20Persons%2C%20XXVII&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8d5cf3a7cf.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8d5cf3a7cf.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-7b33af83f5" data-kw="Spirit deity Ananias">
<blockquote><p>The title of God and the attribute of eternal Spirit, given in sacred Scripture, prove that the Spirit in whose name we are baptized is not a quality, grace, or effect. When Peter reproached Ananias for lying to the Holy Spirit, he said that Ananias had lied not to men but to God (Acts 5:4). Paul infers that we are the temple of God because the Spirit dwells in us (1 Cor. 3:16 and 6:19). As Augustine eloquently teaches in Epistle 66, if we were commanded to build a temple for God out of wood and stone, because such worship is due to Him alone, it would clearly argue His divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on the One God and Three Persons</cite>, XXV</span></figcaption>

</figure><figure class="quote" id="q-b183d1e261" data-kw="Spirit person dove">

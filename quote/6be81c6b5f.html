<main class="wrap"><figure class="quote" id="q-6be81c6b5f" data-kw="">
<blockquote><p>Thirdly, your cause is just also, agreeable to the Law of Nature; for, Conservatio sui ipsius est opus naturalissimum, to the Law of God: for David though not the representative body yet lawfully took up arms for his own defence; to the Law of the Kingdom, for what more legal then that the Houses of Parliament should bring in Delinquents to trial, and how can that be without Arms when the Delinquents betake themselves to their Arms? The Schoolmen say three things concur to a just war.

First, Jurisdictio indicentis, and for that you have the Authority of Parliament, which, as one writes, if you respect Antiquity, is of all Courts the most ancient; if dignity, is of all Courts the most honourable; if authority and jurisdiction, is of all Courts the most copious. Secondly, Offensio patientis, and for that you have matter too much, and your enemies too little, the great cause of their arms is but some peace of prerogative (if they pretend truly) a cause infinitely beneath so unkind &amp; bloody a war as this is. Thirdly, Intentïo boni convenientis, and for that I dare say you are bellando pacifici, your war being to prevent war, and your present bleeding to prevent some great sickness which this State would sink under.

Fourthly, your Forces live and march under as many prayers as ever English Armies did, you have preces armaras; and though Joshua fought valiantly, Exod. 17. yet the prayers of Moses (who was not in the fight) got the field.

Fifthly, If you do overcome, you shall not make your selves slaves by your own victories; we may truly say of some, Dum vincunt victi sunt: when they have overcome others, they are slaves themselves; your Religion, Laws, and Liberties stand all ready to reward your prowess.

And sixthly, If you be overcome and die, you die for God and your Country; who can bring his life into a better market? blessed are those that dye for the Lord, so that word is rather to be read, Rev. 14. 13. Wherefore as heretofore so now much more labour to hold forth the virtues of him that hath called you to this great employment. As Soldiers are more honoured then others, so they should be more virtuous; he had need carry much grace in his heart that doth daily carry his life in his hand; and your Soldiers should as well overcome the Countries with their good examples, as the Enemies with their swords.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bridge.html">William Bridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The truth of the times vindicated whereby the lawfulness of Parliamentary proceedings in taking up of arms, is justified, Doctor Ferne’s reply answered, and the case in question more fully resolved</cite>, (London: Ben. Allen, 1643), unpaginated.</span></figcaption>

<blockquote><p>The same command of fruitfulness that was given to man was also given to the land (Gen. 1:11-12; Psalm 107:37; Ezek. 36:29) and was called a blessing (Deut. 7:13; Ezek. 36:19). Is failing to make the land be fruitful every year a “despising of God’s blessings” or a violation of His Dominion Command? Obviously not. The land has been fruitful for six years, and taking a year off (spacing) in no way violates the command. If spacing crops does not violate the identical command to be fruitful and multiply, I fail to see how spacing children (whether by six months, 12 months, or more) violates that command. This is using the analogy of Scripture to understand the command to be fruitful and multiply… the [Levitical] law allowed the land to rest one year in seven… If the woman ‘who has many children has become feeble’ (1 Sam. 2:5), it might be time to let her strengthen… the burden of proof is upon those who say spacing babies is a sin… is it sinful to take days off beyond the Sabbath day in our yearly schedules?… What makes giving a very productive wife some rest from child-bearing a sin? Could this not justify spacing babies by one year or more to provide for the wife’s strength and health, and/or to save up money to be able to pay for the delivery costs of the next baby? Could it not be used to postpone having a child while the wife’s health was in jeopardy? If a woman was having chemotherapy for cancer, the chemo would endanger the baby’s life. This would certainly be a good time to exercise conception control.</p></blockquote>

<blockquote><p>The proof here of is evident if Christ’s words be weighed in the nineteenth Chapter of S. Matthew’s gospel. For when the Pharisees asking him a question, whether it were lawful for a man to put away his wife for every cause, received answer that it was not, and thereupon said unto him, Why did Moses then command to give a bill of divorcement and to put her a way: Our Saviour said unto them; Moses suffered you because of the hardness of your heart to put away your wives: But from the beginning it was not so. And I say unto you, that, whosoever shall put away his wife, except it be for whoredom, and shall marry another, doth commit adultery: and who so marrieth her that is put away, doth commit adultery.

Now in this sentence, the clause of exception [except it be for whoredom] doth argue that he commiteth not adultery, who, having put away his wife for whoredom marrieth another.

But he must needs commit it in doing so unless the band of marriage be loosed and dissolved. For who so marrieth another as long as he is bound to the former, is an adulterer. The band then of marriage is loosed &amp; dissolved between that man and wife who are put asunder and divorced for whoredom.

And if the band beloosed, the man may marry another: seeing it is written Art thou loosed from a wife? If thou marry thou sinnest not. Therefore it is lawful for him who hath put away his wife for whoredom to marry another.

This argument doth firmly and necessarily conclude the point in question, if the first part &amp; proposition of it be proved to be true. For there is no controversy of any of the rest: being all grounded on such undoubted principles of scripture &amp; reason, that our adversaries themselves admit and grant them all.

The first they deny to wit that the clause of exception in Christ’s speech [except it be for whoredom] doth argue that the man committeth not adultery, who, having put away his wife for whoredom, marrieth another. And to overthrow this proposition, they do bring sundry answers and evasions. The best of all which as Bellarmine avoucheth, is, that those words [except it be for whoredom] are not an exception. For Christ (saith he) meant those words [except for whoredom] not as an exception, but as a negation. So that the sense is whosoever shall put away his wife. except for whoredom; that is to say without the cause of whoredom, &amp; shall marry another doth commit adultery. Whereby it is affirmed that he is an adulterer who having put away his wife without the cause of whoredom, marrieth another: but nothing is said touching him who marrieth another, having put away his former wife for whore dome. In deed this evasion might have some colour for it, if these words of Christ [except it be for whoredom] were not an exception.

But neither hath Bellarmine ought that may suffice for the proof hereof and the very text of the Scripture it self is soe clear against him, that he must of necessity give over his hold. For the principal pillar wherewith he under propseth it, is S. Austin’s judgment, who hath so expounded it in his first book touching adulterous marriages: Now of that treatise S. Austin saith himself in his retractations I have written two books touching adulterous marriages, as near as I could according to the scriptures being desirous to open and loose the knots of a most difficult question. Which whether I have done so that no knot is left therein, I know not: nay rather I perceive that I have not done it perfectly, and thoroughly, although I have opened many creeks thereof, as whosoever readeth with judgment may discern. S. Augustin then acknowledgeth that there are some wants &amp; imperfections in that work which they may see who read with judgment.

And whether this that Bellarmine doth allege out of it, deserve not to fall within the compass of that censure I appeal to their judgment who have eyes to see: For S. Augustin thought that the word in the original of S. Matthew’s gospel, had, by the Proper signification of it, imported a negation rather then an exception. As he sheweth by saying that where the common Latin translation hath [except for whoredom] in the Greek text it is rather read without the cause of whoredom. Supposing belike (whether by slip of memory or rather oversight) that the same words, which were used before in the fifth Chapter of S. Matthew’s Gospel to the same purpose, were used also in this place: whereas here they differ, and are well expressed by that in the Latin by which S. Austin thought they were not so well. Howbeit, if they had been the same with the former: yet neither so might Bellarmine allow his opinion: considering that the common Latin translation (which Papists by there Council of Trent are bound to stand to under pain of curse) expresseth those likewise as a plain exception.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-rainolds.html">John Rainolds</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A defence of the judgment of the Reformed churches. That a man may lawfully not only put away his wife for her adultery, but also marry another. Wherein both Robert Bellarmine the Jesuits Latin treatise, and an English pamphlet of a nameless author maintaining the contrary are confuted by John Raino</cite>, (Dordrecht: George Walters, 1609), pp 2-4.</span></figcaption>

<div class="actions"><button class="copy" data-copy="“The proof here of is evident if Christ’s words be weighed in the nineteenth Chapter of S. Matthew’s gospel. For when the Pharisees asking him a question, whether it were lawful for a man to put away his wife for every cause, received answer that it was not, and thereupon said unto him, Why did Moses then command to give a bill of divorcement and to put her a way: Our Saviour said unto them; Moses suffered you because of the hardness of your heart to put away your wives: But from the beginning it was not so. And I say unto you, that, whosoever shall put away his wife, except it be for whoredom, and shall marry another, doth commit adultery: and who so marrieth her that is put away, doth commit adultery.

Now in this sentence, the clause of exception [except it be for whoredom] doth argue that he commiteth not adultery, who, having put away his wife for whoredom marrieth another.

But he must needs commit it in doing so unless the band of marriage be loosed and dissolved. For who so marrieth another as long as he is bound to the former, is an adulterer. The band then of marriage is loosed &amp; dissolved between that man and wife who are put asunder and divorced for whoredom.

And if the band beloosed, the man may marry another: seeing it is written Art thou loosed from a wife? If thou marry thou sinnest not. Therefore it is lawful for him who hath put away his wife for whoredom to marry another.

This argument doth firmly and necessarily conclude the point in question, if the first part &amp; proposition of it be proved to be true. For there is no controversy of any of the rest: being all grounded on such undoubted principles of scripture &amp; reason, that our adversaries themselves admit and grant them all.

The first they deny to wit that the clause of exception in Christ’s speech [except it be for whoredom] doth argue that the man committeth not adultery, who, having put away his wife for whoredom, marrieth another. And to overthrow this proposition, they do bring sundry answers and evasions. The best of all which as Bellarmine avoucheth, is, that those words [except it be for whoredom] are not an exception. For Christ (saith he) meant those words [except for whoredom] not as an exception, but as a negation. So that the sense is whosoever shall put away his wife. except for whoredom; that is to say without the cause of whoredom, &amp; shall marry another doth commit adultery. Whereby it is affirmed that he is an adulterer who having put away his wife without the cause of whoredom, marrieth another: but nothing is said touching him who marrieth another, having put away his former wife for whore dome. In deed this evasion might have some colour for it, if these words of Christ [except it be for whoredom] were not an exception.

But neither hath Bellarmine ought that may suffice for the proof hereof and the very text of the Scripture it self is soe clear against him, that he must of necessity give over his hold. For the principal pillar wherewith he under propseth it, is S. Austin’s judgment, who hath so expounded it in his first book touching adulterous marriages: Now of that treatise S. Austin saith himself in his retractations I have written two books touching adulterous marriages, as near as I could according to the scriptures being desirous to open and loose the knots of a most difficult question. Which whether I have done so that no knot is left therein, I know not: nay rather I perceive that I have not done it perfectly, and thoroughly, although I have opened many creeks thereof, as whosoever readeth with judgment may discern. S. Augustin then acknowledgeth that there are some wants &amp; imperfections in that work which they may see who read with judgment.

And whether this that Bellarmine doth allege out of it, deserve not to fall within the compass of that censure I appeal to their judgment who have eyes to see: For S. Augustin thought that the word in the original of S. Matthew’s gospel, had, by the Proper signification of it, imported a negation rather then an exception. As he sheweth by saying that where the common Latin translation hath [except for whoredom] in the Greek text it is rather read without the cause of whoredom. Supposing belike (whether by slip of memory or rather oversight) that the same words, which were used before in the fifth Chapter of S. Matthew’s Gospel to the same purpose, were used also in this place: whereas here they differ, and are well expressed by that in the Latin by which S. Austin thought they were not so well. Howbeit, if they had been the same with the former: yet neither so might Bellarmine allow his opinion: considering that the common Latin translation (which Papists by there Council of Trent are bound to stand to under pain of curse) expresseth those likewise as a plain exception.”

— John Rainolds, A defence of the judgment of the Reformed churches. That a man may lawfully not only put away his wife for her adultery, but also marry another. Wherein both Robert Bellarmine the Jesuits Latin treatise, and an English pamphlet of a nameless author maintaining the contrary are confuted by John Raino, (Dordrecht: George Walters, 1609), pp 2-4.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+proof+here+of+is+evident+if+Christ%E2%80%99s+words+be+weighed+in+the+nineteenth+Chapter+of+S.+Matthew%E2%80%99s+gospel.+For+when+the+Pharisees+asking+him+a+question%2C+whether+it+were+lawful+for+a+man+to+put+away+his+wife+for+every+cause%2C+received+answer+that+it+was+not%2C+and+thereupon+said+unto+him%2C+Why+did+Moses+then+command+to+give+a+bill+of+divorcement+and+to+put+her+a+way%3A+Our+Saviour+said+unto+them%3B+Moses+suffered+you+because+of+the+hardness+of+your+heart+to+put+away+your+wives%3A+But+from+the+beginning+it+was+not+so.+And+I+say+unto+you%2C+that%2C+whosoever+shall+put+away+his+wife%2C+except+it+be+for+whoredom%2C+and+shall+marry+another%2C+doth+commit+adultery%3A+and+who+so+marrieth+her+that+is+put+away%2C+doth+commit+adultery.%0A%0ANow+in+this+sentence%2C+the+clause+of+exception+%5Bexcept+it+be+for+whoredom%5D+doth+argue+that+he+commiteth+not+adultery%2C+who%2C+having+put+away+his+wife+for+whoredom+marrieth+another.%0A%0ABut+he+must+needs+commit+it+in+doing+so+unless+the+band+of+marriage+be+loosed+and+dissolved.+For+who+so+marrieth+another+as+long+as+he+is+bound+to+the+former%2C+is+an+adulterer.+The+band+then+of+marriage+is+loosed+%26+dissolved+between+that+man+and+wife+who+are+put+asunder+and+divorced+for+whoredom.%0A%0AAnd+if+the+band+beloosed%2C+the+man+may+marry+another%3A+seeing+it+is+written+Art+thou+loosed+from+a+wife%3F+If+thou+marry+thou+sinnest+not.+Therefore+it+is+lawful+for+him+who+hath+put+away+his+wife+for+whoredom+to+marry+another.%0A%0AThis+argument+doth+firmly+and+necessarily+conclude+the+point+in+question%2C+if+the+first+part+%26+proposition+of+it+be+proved+to+be+true.+For+there+is+no+controversy+of+any+of+the+rest%3A+being+all+grounded+on+such+undoubted+principles+of+scripture+%26+reason%2C+that+our+adversaries+themselves+admit+and+grant+them+all.%0A%0AThe+first+they+deny+to+wit+that+the+clause+of+exception+in+Christ%E2%80%99s+speech+%5Bexcept+it+be+for+whoredom%5D+doth+argue+that+the+man+committeth+not+adultery%2C+who%2C+having+put+away+his+wife+for+whoredom%2C+marrieth+another.+And+to+overthrow+this+proposition%2C+they+do+bring+sundry+answers+and+evasions.+The+best+of+all+which+as+Bellarmine+avoucheth%2C+is%2C+that+those+words+%5Bexcept+it+be+for+whoredom%5D+are+not+an+exception.+For+Christ+%28saith+he%29+meant+those+words+%5Bexcept+for+whoredom%5D+not+as+an+exception%2C+but+as+a+negation.+So+that+the+sense+is+whosoever+shall+put+away+his+wife.+except+for+whoredom%3B+that+is+to+say+without+the+cause+of+whoredom%2C+%26+shall+marry+another+doth+commit+adultery.+Whereby+it+is+affirmed+that+he+is+an+adulterer+who+having+put+away+his+wife+without+the+cause+of+whoredom%2C+marrieth+another%3A+but+nothing+is+said+touching+him+who+marrieth+another%2C+having+put+away+his+former+wife+for+whore+dome.+In+deed+this+evasion+might+have+some+colour+for+it%2C+if+these+words+of+Christ+%5Bexcept+it+be+for+whoredom%5D+were+not+an+exception.%0A%0ABut+neither+hath+Bellarmine+ought+that+may+suffice+for+the+proof+hereof+and+the+very+text+of+the+Scripture+it+self+is+soe+clear+against+him%2C+that+he+must+of+necessity+give+over+his+hold.+For+the+principal+pillar+wherewith+he+under+propseth+it%2C+is+S.+Austin%E2%80%99s+judgment%2C+who+hath+so+expounded+it+in+his+first+book+touching+adulterous+marriages%3A+Now+of+that+treatise+S.+Austin+saith+himself+in+his+retractations+I+have+written+two+books+touching+adulterous+marriages%2C+as+near+as+I+could+according+to+the+scriptures+being+desirous+to+open+and+loose+the+knots+of+a+most+difficult+question.+Which+whether+I+have+done+so+that+no+knot+is+left+therein%2C+I+know+not%3A+nay+rather+I+perceive+that+I+have+not+done+it+perfectly%2C+and+thoroughly%2C+although+I+have+opened+many+creeks+thereof%2C+as+whosoever+readeth+with+judgment+may+discern.+S.+Augustin+then+acknowledgeth+that+there+are+some+wants+%26+imperfections+in+that+work+which+they+may+see+who+read+with+judgment.%0A%0AAnd+whether+this+that+Bellarmine+doth+allege+out+of+it%2C+deserve+not+to+fall+within+the+compass+of+that+censure+I+appeal+to+their+judgment+who+have+eyes+to+see%3A+For+S.+Augustin+thought+that+the+word+in+the+original+of+S.+Matthew%E2%80%99s+gospel%2C+had%2C+by+the+Proper+signification+of+it%2C+imported+a+negation+rather+then+an+exception.+As+he+sheweth+by+saying+that+where+the+common+Latin+translation+hath+%5Bexcept+for+whoredom%5D+in+the+Greek+text+it+is+rather+read+without+the+cause+of+whoredom.+Supposing+belike+%28whether+by+slip+of+memory+or+rather+oversight%29+that+the+same+words%2C+which+were+used+before+in+the+fifth+Chapter+of+S.+Matthew%E2%80%99s+Gospel+to+the+same+purpose%2C+were+used+also+in+this+place%3A+whereas+here+they+differ%2C+and+are+well+expressed+by+that+in+the+Latin+by+which+S.+Austin+thought+they+were+not+so+well.+Howbeit%2C+if+they+had+been+the+same+with+the+former%3A+yet+neither+so+might+Bellarmine+allow+his+opinion%3A+considering+that+the+common+Latin+translation+%28which+Papists+by+there+Council+of+Trent+are+bound+to+stand+to+under+pain+of+curse%29+expresseth+those+likewise+as+a+plain+exception.%E2%80%9D%0A%0A%E2%80%94+John+Rainolds%2C+A+defence+of+the+judgment+of+the+Reformed+churches.+That+a+man+may+lawfully+not+only+put+away+his+wife+for+her+adultery%2C+but+also+marry+another.+Wherein+both+Robert+Bellarmine+the+Jesuits+Latin+treatise%2C+and+an+English+pamphlet+of+a+nameless+author+maintaining+the+contrary+are+confuted+by+John+Raino%2C+%28Dordrecht%3A+George+Walters%2C+1609%29%2C+pp+2-4.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa49a2c7086.html&amp;via=5Solas" target="_blank" rel="noopener"> <blockquote><p>7th Quest. And in the seventh place, we may and ought to be ready to lay down our lives for the commonwealth, for common good is to be preferred before private good. The hand doth endanger itself for the good of the head, and therefore a private man may venture himself to save a public person; and from hence is grounded the lawfulness of a Christian war.</p></blockquote>

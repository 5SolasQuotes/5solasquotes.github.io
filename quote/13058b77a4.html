<blockquote><p>…he [the opponent] was required to prove it significative of some spiritual duty [in order for it to be warrant for a human, significant ceremony in worship]: For it was in probability only a common sign of subjection, as well out of an oath, as in it, without any respect unto Christ. …but men’s conceits are no great proofs. He adds 2. that if it were a sign of subjection yet might it be significant of a spiritual duty. But may be and might be is no proof.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit against Human Ceremonies in God’s Worship… (1633), ch. 3 | section 7, ‘Concerning the Oath-Gesture of Abraham’s Servant’</cite>, pp. 304-9</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c7550de74c" data-kw="">
<blockquote><p>For the more clear opening of the ensuing treatise it is necessary to speak somewhat of worship and adoration, and especially of these: 1. honor. 2. praise. 3. glory, 4. reverence. 5. veneration. 6. devotion. 7. religion. 8. service. 9. worship. 10. love. 11. obedience. 12. adoration. 1. Honor, is a testification of the excellency of any, Aristotle, Ethics, bk. 8, ch. 8; Aquinas, Honos est signum quoddam excellentiae. ‘Honour is a sign or expression of excellency in any,’ it does not import any superiority in the party whom we honor, as adoration does. [2.] Praise is a special honoring of any, consisting in words. [3.] Glory is formally the effect of honor, though it be taken, pro claritate, ‘for the celebrity’ or renownedness of any; yet glory seems to be founded upon celebrity, as its foundation. [4.] Reverence is a sort of veneration of a person for excellency connotating a sort of fear. [5.] Veneration is a sort of fear, and reverencing of a person: I see not well any difference between reverence and veneration, except that veneration seems to be some more, and comes nearer to adoration. [6.] Devotion is the promptitude, cheerfulness, or spiritual propension of the will to serve God; [7.] Religion is formally in this, when a man subjects himself to God, as to his supreme Lord, and thence arises to give him honor, as his God and absolute Lord. The two integral parts of religion are the subjection of the reasonable creature to God. 2. An exhibition of honour… [8.] Service is from the bond of subjection, to reverence God as an inferior or servant does his Lord and Master: A servant does properly do the will of his master for the gain or profit that redounds to his master… [9.] For worship formally is to give reverence to God for his excellency; in one and the same act we may both worship God and serve Him. Only service does include the obligation of a servant to a lord. As concerning [10.] love, faith and hope, they are internal worship, not properly adoration: Love as love does rather import an equality with the thing loved, and a desire of an union, rather than a submission. It is true, there is a perfection in that which we love, but not essentially to perfect the lover… Faith and hope may suppose a resting on a helper as a helper, and so are internal worship; if they be adoration formally may be a question… [11.] Obedience is founded, not formally upon God’s excellency, properly so called, but upon his jurisdiction and authority to command. [12.] Adoration is the subjection or prostration of soul or body to God in the due recognition and acknowledgement of his absolute supremacy. There is no need, that Vasquez [a Romanist] should deny that there is any internal adoration, for that adoration is only an external and bodily worship of God, can hardly be defended… as external adoration is an act by which we offer our bodies to God and subject the utter man to him, in sign of service and reverence to so supreme a Lord, so there is a heart-prostration and inward bowing of the soul answerable thereunto.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government... (1646) | Introduction, Section 6, ‘What Honor, Praise, Glory, Reverence, Veneration, Devotion, Service, Worship, etc. are’</cite>, p. 83</span></figcaption>

<blockquote><p>IV. The Nonconformists are not of one mind about receiving the Lord’s Supper kneeling. Many judge it lawful, though neither necessary nor most eligible were they free; some judge it also most eligible: and some judge it, as things stand, unlawful. Their reasons are: [Those who think it unlawful:] 1. In doubtful cases duty lies on the surest side. But this to them is a doubtful case on one side, and to imitate Christ’s institution by such sitting as men use to do at meat is certainly lawful. 2. Because they think this kneeling violates the reasons of the Second Commandment, being used where, by whole countries of Papists round about us and many among us, it signifies bread-worship or idolatry by the same action at the same season used. For they suppose that the Second Commandment forbids images as being external, corporal, idolatry and symbolizing scandalously with idolators, though the mind intend the worshiping of the true God alone. And such they think this kneeling is, and that it encourages the Papists (as is instanced in a story in the Life of Bishop Hall). 3. Because they think that the tradition and custom of the catholic Church and the canons of the greatest general councils, not repealed by any other (as Nicea 1, can. 20 &amp; Can. Trull. etc.) are of stronger obligation than the canons of our convocation. And those canons, customs and tradition prohibit all adoration by genuflection on any Lord’s Day in the year and on any weekday else between Easter and Whitsuntide; and this custom continued 1,000 years as the tradition of the universal Church and was never repealed, but charged by degrees by contrary practice. They that think not that they are bound by these canons or customs at all, yet think that they are enough to nullify a contrary canon of a lower power; or, ad hominem, may excuse them. Yea the Constitutions called the Apostles seem to command all the people to receive the sacrament standing and to go for it, bk. 2, ch. 57. Having prescribed the order of worship (that after the old Scriptures read, they sing a psalm and then read the Acts and Epistles and the Gospels, and then that the presbyters one by one exhort the people first and the bishop last (for in those time every Church that had an altar had a bishop) he concludes: ‘Postea vero fiat sacrificium, cuncto populo Stante et silent•o precant•, et oblatione facta, quisque ordo sco• sim corpus Domini et preciosum sanguinem sumat, accedentes ordine cum pudore et reverentia ut ad corpus Regis. I•em mulieres operto capite, ut ordiaem earum decet, acc dant.’ That is: ‘After let the sacrifice be made, all the people standing and praying in silence: And the oblation being made, let every order apart take the body of Christ and his precious blood: Coming to it in order with modesty and reverence as to the body of the King. And let the women approach with covered heads as becomes their order.’ For such reasons as these set together, some nonconformists (lay and clergy) take this kneeling (while Papists about us by the same gesture adore the bread) to be unlawful, who yet profess as great reverence to Christ and the eucharist as any others. But other nonconformists say that they can answer all these arguments, but that they truly render the scruples of the dissenters tolerable, and the persons unmeet to be therefore excommunicated. 2. By the [Anglican] canon and rubric, no one of these dissenters must be admitted to the holy communion, Canon 27 says: ‘No minister when he celebrates the communion shall wittingly administer the same to any but to such as kneel, under pain of suspension.’ And the ministers covenant to use no form of administering the sacraments but according to the Liturgy.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), section 8, pp. 150-52 Baxter’s actual opinion, it appears, was that doing such was lawful; see a section below.</cite></span></figcaption>

— Richard Baxter, The Nonconformists’ Plea for Peace, or an Account of their Judgment in Certain Things in which they are Misunderstood… (London, 1679), section 8, pp. 150-52 Baxter’s actual opinion, it appears, was that doing such was lawful; see a section below.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIV.+The+Nonconformists+are+not+of+one+mind+about+receiving+the+Lord%E2%80%99s+Supper+kneeling.+Many+judge+it+lawful%2C+though+neither+necessary+nor+most+eligible+were+they+free%3B+some+judge+it+also+most+eligible%3A+and+some+judge+it%2C+as+things+stand%2C+unlawful.+Their+reasons+are%3A+%5BThose+who+think+it+unlawful%3A%5D+1.+In+doubtful+cases+duty+lies+on+the+surest+side.+But+this+to+them+is+a+doubtful+case+on+one+side%2C+and+to+imitate+Christ%E2%80%99s+institution+by+such+sitting+as+men+use+to+do+at+meat+is+certainly+lawful.+2.+Because+they+think+this+kneeling+violates+the+reasons+of+the+Second+Commandment%2C+being+used+where%2C+by+whole+countries+of+Papists+round+about+us+and+many+among+us%2C+it+signifies+bread-worship+or+idolatry+by+the+same+action+at+the+same+season+used.+For+they+suppose+that+the+Second+Commandment+forbids+images+as+being+external%2C+corporal%2C+idolatry+and+symbolizing+scandalously+with+idolators%2C+though+the+mind+intend+the+worshiping+of+the+true+God+alone.+And+such+they+think+this+kneeling+is%2C+and+that+it+encourages+the+Papists+%28as+is+instanced+in+a+story+in+the+Life+of+Bishop+Hall%29.+3.+Because+they+think+that+the+tradition+and+custom+of+the+catholic+Church+and+the+canons+of+the+greatest+general+councils%2C+not+repealed+by+any+other+%28as+Nicea+1%2C+can.+20+%26+Can.+Trull.+etc.%29+are+of+stronger+obligation+than+the+canons+of+our+convocation.+And+those+canons%2C+customs+and+tradition+prohibit+all+adoration+by+genuflection+on+any+Lord%E2%80%99s+Day+in+the+year+and+on+any+weekday+else+between+Easter+and+Whitsuntide%3B+and+this+custom+continued+1%2C000+years+as+the+tradition+of+the+universal+Church+and+was+never+repealed%2C+but+charged+by+degrees+by+contrary+practice.+They+that+think+not+that+they+are+bound+by+these+canons+or+customs+at+all%2C+yet+think+that+they+are+enough+to+nullify+a+contrary+canon+of+a+lower+power%3B+or%2C+ad+hominem%2C+may+excuse+them.+Yea+the+Constitutions+called+the+Apostles+seem+to+command+all+the+people+to+receive+the+sacrament+standing+and+to+go+for+it%2C+bk.+2%2C+ch.+57.+Having+prescribed+the+order+of+worship+%28that+after+the+old+Scriptures+read%2C+they+sing+a+psalm+and+then+read+the+Acts+and+Epistles+and+the+Gospels%2C+and+then+that+the+presbyters+one+by+one+exhort+the+people+first+and+the+bishop+last+%28for+in+those+time+every+Church+that+had+an+altar+had+a+bishop%29+he+concludes%3A+%E2%80%98Postea+vero+fiat+sacrificium%2C+cuncto+populo+Stante+et+silent%E2%80%A2o+precant%E2%80%A2%2C+et+oblatione+facta%2C+quisque+ordo+sco%E2%80%A2+sim+corpus+Domini+et+preciosum+sanguinem+sumat%2C+accedentes+ordine+cum+pudore+et+reverentia+ut+ad+corpus+Regis.+I%E2%80%A2em+mulieres+operto+capite%2C+ut+ordiaem+earum+decet%2C+acc+dant.%E2%80%99+That+is%3A+%E2%80%98After+let+the+sacrifice+be+made%2C+all+the+people+standing+and+praying+in+silence%3A+And+the+oblation+being+made%2C+let+every+order+apart+take+the+body+of+Christ+and+his+precious+blood%3A+Coming+to+it+in+order+with+modesty+and+reverence+as+to+the+body+of+the+King.+And+let+the+women+approach+with+covered+heads+as+becomes+their+order.%E2%80%99+For+such+reasons+as+these+set+together%2C+some+nonconformists+%28lay+and+clergy%29+take+this+kneeling+%28while+Papists+about+us+by+the+same+gesture+adore+the+bread%29+to+be+unlawful%2C+who+yet+profess+as+great+reverence+to+Christ+and+the+eucharist+as+any+others.+But+other+nonconformists+say+that+they+can+answer+all+these+arguments%2C+but+that+they+truly+render+the+scruples+of+the+dissenters+tolerable%2C+and+the+persons+unmeet+to+be+therefore+excommunicated.+2.+By+the+%5BAnglican%5D+canon+and+rubric%2C+no+one+of+these+dissenters+must+be+admitted+to+the+holy+communion%2C+Canon+27+says%3A+%E2%80%98No+minister+when+he+celebrates+the+communion+shall+wittingly+administer+the+same+to+any+but+to+such+as+kneel%2C+under+pain+of+suspension.%E2%80%99+And+the+ministers+covenant+to+use+no+form+of+administering+the+sacraments+but+according+to+the+Liturgy.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Nonconformists%E2%80%99+Plea+for+Peace%2C+or+an+Account+of+their+Judgment+in+Certain+Things+in+which+they+are+Misunderstood%E2%80%A6+%28London%2C+1679%29%2C+section+8%2C+pp.+150-52+Baxter%E2%80%99s+actual+opinion%2C+it+appears%2C+was+that+doing+such+was+lawful%3B+see+a+section+below.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F510fd3b37d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/510fd3b37d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-kneeling-in-receiving-the-lords-supper/#:~:text=IV.%20The%20Nonconformists%20are%20not%20of,sacraments%20but%20according%20to%20the%20Liturgy&amp;text=IV.%20The%20Nonconformists%20are%20not%20of%20one%20mind&amp;text=administering%20the%20sacraments%20but%20according%20to%20the%20Liturgy" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

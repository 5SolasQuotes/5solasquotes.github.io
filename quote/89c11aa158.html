<main class="wrap"><figure class="quote" id="q-89c11aa158" data-kw="">
<blockquote><p>This pattern of definition results in the understanding of mercy as an affection, although there remains among the Reformed orthodox the assumption that the inclination to aid the creature is so intrinsic to the divine nature that mercy also can be understood as an essential attribute of God: the disposition belongs to God essentially, although its transient revelation belongs to the category of affection. (Cf. Brakel, Redelijke Godsdienst, I.iii.35.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics (Baker Academic, 2003), vol. 3</cite>, p. 577</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-bc5b6209af" data-kw="">
<blockquote><p>This article will address the claim that Thomas Aquinas held to an Augustinian doctrine of predestination essentially compatible with that of the Reformed Churches, showing in what ways Thomas’s doctrine is compatible with the doctrine of the Reformed Churches and important ways in which it differs… Thomas did teach the perseverance of the elect, but not perseverance of the saints. What we mean by this is that he taught that all the elect will persevere, but that not only the elect, but many besides, are called to faith and given real conversion and grace, and eventually fall away. Their state in this life differs nothing from the elect. In keeping with this, one may not know in this life whether they are elect or reprobate.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-johnson.html">Charles Johnson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Thomas &amp; TULIP’ (2020) 20 paragraphs at Reformed Theology Delatinized</cite></span></figcaption>

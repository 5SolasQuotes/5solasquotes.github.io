<main class="wrap"><figure class="quote" id="q-c67f6c7c3c" data-kw="">
<blockquote><p>Having proved it [the Mosaic deliverance of the 10 Commandments] is a covenant, all the difficulty remains in declaring what covenant it is; for here is much difference of judgements, even with the learned and orthodox… Some explain it thus: God (say they) had a primary or antecedent will in giving of the Law, or a secondary and consequent: His primary will was to hold out perfect and exact righteousness, against which the apostle argues and proves no man can be justified thereby: but then God, knowing man’s impotency and inability, did secondarily command repentance and promises a gracious acceptance through Christ; and this [understanding] may be very well received, if it be not vexed with ill interpretations. But, lastly, this way I shall go: The Law (as to this purpose) may be considered more largely, as that whole doctrine delivered on Mount Sinai with the preface and promises adjoined and all things that may be reduced to it; or more strictly, as it is an abstracted rule of righteousness, holding forth life upon no terms but perfect obedience. Now take it in the former sense: it was a covenant of grace; take it in the later sense, as abstracted from Moses’s administration of it, and so it was not of grace, but works.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-burgess.html">Anthony Burgess</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciae legis, or a Vindication of the Moral Law &amp; the Covenants… (London: Underhill, 1647), Lecture 24, on Dt. 4:13</cite>, pp. 231-33</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fcd6562ca2" data-kw="">
<blockquote><p>But against this it may be objected what St. Peter [and Timothy] says: that He would have all men to be saved and to come to the knowledge of his will. (2 Pet. 3 [v. 9]; 1 Tim. 2:4) And therefore either there are diverse and contrary wills in God, or it is his will that all should be saved, but yet are not, because they will not believe. I answer: That the will of God is diversely distinguished by the doctors, as [John] Damascene (The will of God is not diverse, Damascene, bk. 2, ch. 46), into an: 1. Antecedent will 2. Consequent will Lombard and the Schoolmen (bk. 1, ch. 45) into his: 1. Signified will 2. Well-pleasing will Tertullian (Lib. Exhort. ad castitatem.), into his: 1. Efficient will 2. Permissive will Whereof he calls the first voluntas pura and the other voluntas indulgentiae. St. Augustine (Enchiridion, ch. 102 &amp; 103), into his: 1. Effectual working and omnipotent will 2. Not working, or not efficient will Others into his: Absolute will Conditional will Others into his Secret will Revealed will All which, and all such like distinctions of God’s will, if they be diligently observed and well understood, do fall into the same end and do no ways prove either diverse wills to be in God or any contradiction to be in the will of God. For it is most certain that as the essence of God is most simple, without composition or division, so the will of God, which is nothing else but his eternal decree concerning all things, is one and the selfsame immutable and unresistible: in so much that the wicked, who as much as in them lies, do resist the will of God revealed and commanded unto us in his Word, yet notwithstanding, will they, nill they, they fulfill the will of God decreed in Himself from all eternity; as you may see most plainly in the example of Pilate, Herod and the wicked Jews, who in crucifying Christ, rebelled and resisted the will of God revealed in his word, yet herein they did perform the secret will of God, which before all worlds He had determined should be done, as St. Peter shows (Acts 2:23; Augustine in Enchiridion, ch. 98), Et sic in hoc ipso quod contra voluntatem Dei fecerunt, de ipsis facta est voluntas eius: And so in this very thing wherein they did against God’s will, God effected his own will. (Idem, de cor. et gratia) Et de his qui faciunt quod non vult, facit ipse, quae vult: And touching these men which do against his will, He does whatsoever He will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gryffith.html">William Gryffith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Delights of the Saints… (London: Butter, 1622), pt. 1, pp. 11-13 Gryffith (c.1589–1672) was an Anglican bishop, opposed to the puritans.</cite></span></figcaption>

<blockquote><p>Objection V: God will not the death of a sinner, but rather that he repent and live, Eze. 18:23. Answer. Augustine in his 1st book to Simplicius, 2nd question, answers this question. You must, says he, distinguish betwixt man, as he is born man, and man as he is a sinner. For God is not delighted with the destruction of man, as he is man, but as he is a sinner: neither will He simply the death of any as he is a sinner, or as it is the ruin and destruction of his creature: but in that, by the detestation and revenge of sin with eternal death, his glory is exceedingly advanced. God therefore will the death of a sinner, but as it is a punishment, that is, as it is a means to declare and set out his divine justice: and therefore it is an untruth for a man to say that God would have none condemned. For whereas men are once condemned, it must be either with God’s will, or without it: if without it, then the will of God must needs suffer violence, the which to affirm is great impiety: if with his will, God must needs change his sentence before set down, but we must not presume to say so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Golden Chain: or The Description of Theology containing the order of the causes of salvation and damnation, according to God’s Word (Cambridge, 1600), ch. 54, ‘Concerning a New Devised Doctrine of Predestination, taught by some New and Late [Arminian] Divines’, the 1st Error, the Confutation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>Another reason is taken according to another way of distinguishing: because some are signs of the absolute divine will, others of the conditional. I say, therefore, that because one cannot act against the absolute will, one cannot act against the signs of the absolute will, such as are fulfillment and permission. But because one can act against the antecedent or conditional will, because man can turn away from the order to which he was created by his institution: hence it is that one can act against the will of the sign which signifies that, namely against prohibition, precept, and counsel.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-677425ee04" data-kw="">
<blockquote><p>Externally this covenant is made with every member of the Church, even with the parents and their children, so many as hear and embrace the promises of salvation, and give and dedicate their children unto God according to his direction; for the sacraments—what are they but seals of the covenant? But savingly, effectually, and in a special manner it is made only with them who are partakers of the benefits promised. And as the covenant is made outwardly or effectually, so some are the people of God externally, others internally and in truth. For they are the people of God with whom God has contracted a covenant, and who in like manner have sworn to the words of the covenant, God stipulating and the people receiving the condition; which is done two ways: [1] for either the covenant is made extrinsically, God by some sensible token gathering the people, and the people embracing the condition in the same manner, and so an external consociation of God and the people is made; [2] or the covenant is entered after an invisible manner, by the intervention of the Spirit, and that with so great efficacy that the condition of the covenant is received after an invisible manner, and so an internal consociation of God and the people is made up.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’, p. 24</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-965b1a1ef8" data-kw="">
<blockquote><p>That out of the whole human race (Gen. 26:4), from the beginning to the end of the world (John 10:10), the Son of God (Eph. 1:10–13), by His Spirit and Word (Rom. 1:16; Isa. 59:21; Rom. 10:14–17; Eph. 5:26), gathers, defends, and preserves for Himself unto everlasting life a chosen communion (Rom. 8:29–30; Matt. 16:18; Eph. 4:3–6) in the unity of the true faith… and that I am and forever shall remain a living member of this communion (1 John 3:21; 1 John 2:19).</p></blockquote>

</figure><figure class="quote" id="q-abd7767cf3" data-kw="">
<blockquote><p>Yea, many of great learning think that at the beginning of Reformation thousands being under popery baptized by midwives and private persons, were never rebaptized; not that they think such baptism valid, but where the sacrament is wanting, ex invincibili ignorantia facti, ‘out of an invincible ignorance of a fact’, such [by] that way [the] baptized do indeed want the Lord’s seal; but we cannot for that say that they are no better than infidels and unbaptized Turks and Jews, because:

1. Their being born in the visible Church gives a federal holiness, as all of Jewish parents had a federal right to circumcision and were, eatenus, ‘insofar’, separated from the womb.

2. Because their profession of that Covenant whereof baptism is a seal, separates them sufficiently from infidels, though they want the seal external. But our divines esteem, and that justly, baptism administrated by women or such as have no calling, to be no baptism at all; for which let the reader see Calvin, Institutes, bk. 4, ch. 15, sect. 20; Epistle 326; Beza, Libel., Questione de Baptism; the learned Rivet, in Cathol. Orthod., tome 2, tract 2, q. 7. We stand not for what Bellarmine, Maldonatus, Gretserus and other papists say on the contrary.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 1, pp. 204-8, 229, 235 irregular numbering</span></figcaption>

</figure><figure class="quote" id="q-3586497a7a" data-kw="">
<blockquote><p>…there is a twofold necessity; one absolute, the other conditional. Absolute, that is, when one thing is so necessarily required to another, as that it cannot be without it. Secondly, there is a necessity that is not absolute, but conditional; that is, when one thing is so necessary to another as that it cannot well be without it: of this latter sort, the necessity of this government in the Church of God is: for the Church may be without it in some kind of being, but it cannot have her well-being except this concur.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-randall.html">John Randall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Twenty-Nine Lectures of the Church</cite>, … (London, 1631), Lecture 14 Randall (1570–1622) was an English puritan who held that the particular form of Church government is not by divine-right., p. 235</span></figcaption>

</figure><figure class="quote" id="q-1d1f780a30" data-kw="">
<blockquote><p>Question: Whether are there rarer threatenings of temporal evils under the New Covenant than under the Old? Answer: It cannot be denied, except the threatenings of the sword, famine, pestilence on Jerusalem and the desolation upon the Jews, Mt. 23-24. But in place of all the diseases of Egypt, Lev. 26, and the long roll of dreadful judgments and curses temporal, Dt. 28, denounced against the transgressors of the former covenant, Christ and the apostles are more sparing in denouncing temporal plagues in the New Testament. (Threatenings under the New Testament more spiritual than under the Old) Christ says the worm never dies, the fire never goes out, the hypocrite is to be bound hand and foot and casten into utter darkness, Mt. 22:12, and the Holy Ghost, such shall not inherit the kingdom of heaven, 1 Cor. 6:9; Eph. 5:5; the apostate is near a curse, his end burning, Heb. 8:6; he is to look for judgment and fiery indignation, Heb. 10:27; to some is reserved the blackness of darkness for ever, Jude 7; the lake that burns with fire and brimstone, which is the second death, Rev. 21:8. Because: (1) temporal blessings and curses are more legal, and more easily believed, when the light was dimmer than now; when light is larger, convictions stronger, and men are more apt to believe everlasting wrath. (2) It is a more Gospel-way to bear in the threatening of everlasting wrath than of temporal rods. (3) Desertions and trials under the Law were more legal and sharp and sad upon David, Hezekiah, Job, Jeremiah, Heman, Ps. 6; 38; 77; 102; 88; Isa. 38; Jer. 20. But it is to be thought that in regard the day now has dawned, the Gospel desertions, ceteris paribus [all things being equal], for the abundance of light, are more sharp, nearer to despair; see 2 Cor. 1:8, ‘We were pressed out of measure above strength, in so much that we despaired even of life, having received the sentence of death.’ It is a doubt if Paul should be so pressed by a sentence of temporary death. Though there be a larger measure of faith, to bear up the soul under the New Testament; but it would appear there is more of Hell now than under that dispensation, and that the gospel-despair of Judas, and of these that cry for mountains and hills to cover them, Lk. 23:29-30, is more intolerable under the Gospel. (The saints are stronger to suffer under the New Testament than under the Old) (4) There is a more numerous company of these who have not loved their lives to the death, and the martyrs that suffered more exquisite torments for Christ under the persecuting emperors and reign of Antichrist than ever before; the constraining love of Christ, which is stronger than death or hell, has so swallowed up all temporary sufferings, the Spirit has such influence on the flesh. (A larger number of godly, of the rude and unlearned, than of the wise and learned according to the flesh) (5) When the world seeks wisdom, 1 Cor. 1, and Rabbis of the Jews and learning and arts abound all the world over, as the profound philosophers of the gentiles, the wonders of nature prove, yet not many wise are called, 1 Cor. 1:21, 26-27; and unlettered and ignorant are, in number, for godly spiritual knowledge, far beyond the godly learned, and make that true, Isa. 11:9, ‘The earth shall be filled with the knowledge of the Lord, as the waters cover the sea,’ and Isa. 30:26, ‘And the light of the moon shall be as the light of the sun, and the light of the sun shall be as the light of seven days;’ so hath the Lord darkened carnal learning, though of itself the good gift of God, with the shining of spiritual wisdom in the fools of the world, for so are they judged, 1 Cor. 1:27.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, … (Edinburgh: Anderson, 1655), pt. 1, ch. 12, pp. 66-67</span></figcaption>

pressed by a sentence of temporary death. Though there be a larger measure of faith, to bear up the soul under the New Testament; but it would appear there is more of Hell now than under that dispensation, and that the gospel-despair of Judas, and of these that cry for mountains and hills to cover them, Lk. 23:29-30, is more intolerable under the Gospel. (The saints are stronger to suffer under the New Testament than under the Old) (4) There is a more numerous company of these who have not loved their lives to the death, and the martyrs that suffered more exquisite torments for Christ under the persecuting emperors and reign of Antichrist than ever before; the constraining love of Christ, which is stronger than death or hell, has so swallowed up all temporary sufferings, the Spirit has such influence on the flesh. (A larger number of godly, of the rude and unlearned, than of the wise and learned according to the flesh) (5) When the world seeks wisdom, 1 Cor. 1, and Rabbis of the Jews and learning and arts abound all the world over, as the profound philosophers of the gentiles, the wonders of nature prove, yet not many wise are called, 1 Cor. 1:21, 26-27; and unlettered and ignorant are, in number, for godly spiritual knowledge, far beyond the godly learned, and make that true, Isa. 11:9, ‘The earth shall be filled with the knowledge of the Lord, as the waters cover the sea,’ and Isa. 30:26, ‘And the light of the moon shall be as the light of the sun, and the light of the sun shall be as the light of seven days;’ so hath the Lord darkened carnal learning, though of itself the good gift of God, with the shining of spiritual wisdom in the fools of the world, for so are they judged, 1 Cor. 1:27.”

— Samuel Rutherford, Covenant of Life Opened… (Edinburgh: Anderson, 1655), pt. 1, ch. 12, pp. 66-67">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CQuestion%3A+Whether+are+there+rarer+threatenings+of+temporal+evils+under+the+New+Covenant+than+under+the+Old%3F+Answer%3A+It+cannot+be+denied%2C+except+the+threatenings+of+the+sword%2C+famine%2C+pestilence+on+Jerusalem+and+the+desolation+upon+the+Jews%2C+Mt.+23-24.+But+in+place+of+all+the+diseases+of+Egypt%2C+Lev.+26%2C+and+the+long+roll+of+dreadful+judgments+and+curses+temporal%2C+Dt.+28%2C+denounced+against+the+transgressors+of+the+former+covenant%2C+Christ+and+the+apostles+are+more+sparing+in+denouncing+temporal+plagues+in+the+New+Testament.+%28Threatenings+under+the+New+Testament+more+spiritual+than+under+the+Old%29+Christ+says+the+worm+never+dies%2C+the+fire+never+goes+out%2C+the+hypocrite+is+to+be+bound+hand+and+foot+and+casten+into+utter+darkness%2C+Mt.+22%3A12%2C+and+the+Holy+Ghost%2C+such+shall+not+inherit+the+kingdom+of+heaven%2C+1+Cor.+6%3A9%3B+Eph.+5%3A5%3B+the+apostate+is+near+a+curse%2C+his+end+burning%2C+Heb.+8%3A6%3B+he+is+to+look+for+judgment+and+fiery+indignation%2C+Heb.+10%3A27%3B+to+some+is+reserved+the+blackness+of+darkness+for+ever%2C+Jude+7%3B+the+lake+that+burns+with+fire+and+brimstone%2C+which+is+the+second+death%2C+Rev.+21%3A8.+Because%3A+%281%29+temporal+blessings+and+curses+are+more+legal%2C+and+more+easily+believed%2C+when+the+light+was+dimmer+than+now%3B+when+light+is+larger%2C+convictions+stronger%2C+and+men+are+more+apt+to+believe+everlasting+wrath.+%282%29+It+is+a+more+Gospel-way+to+bear+in+the+threatening+of+everlasting+wrath+than+of+temporal+rods.+%283%29+Desertions+and+trials+under+the+Law+were+more+legal+and+sharp+and+sad+upon+David%2C+Hezekiah%2C+Job%2C+Jeremiah%2C+Heman%2C+Ps.+6%3B+38%3B+77%3B+102%3B+88%3B+Isa.+38%3B+Jer.+20.+But+it+is+to+be+thought+that+in+regard+the+day+now+has+dawned%2C+the+Gospel+desertions%2C+ceteris+paribus+%5Ball+things+being+equa lf+the+good+gift+of+God%2C+with+the+shining+of+spiritual+wisdom+in+the+fools+of+the+world%2C+for+so+are+they+judged%2C+1+Cor.+1%3A27.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+Covenant+of+Life+Opened%E2%80%A6+%28Edinburgh%3A+Anderson%2C+1655%29%2C+pt.+1%2C+ch.+12%2C+pp.+66-67&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1d1f780a30.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1d1f780a30.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-covenant-of-grace-is-with-the-visible-church/#:~:text=Question%3A%20Whether%20are%20there%20rarer%20threatenings,are%20they%20judged%2C%201%20Cor.%201%3A27&amp;text=Question%3A%20Whether%20are%20there%20rarer%20threatenings%20of%20temporal&amp;text=for%20so%20are%20they%20judged%2C%201%20Cor.%201%3A27" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

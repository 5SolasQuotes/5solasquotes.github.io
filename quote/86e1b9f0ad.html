<main class="wrap"><figure class="quote" id="q-86e1b9f0ad" data-kw="">
<blockquote><p>…the equation of application with efficacy was not so much the problem as the identification of sufficiency with impetration or accomplishment. That Christ’s death was sufficient for all did not imply that it had actually and intentionally accomplished salvation for all. In none of these theologies, Du Moulin notes, does this universal, general redemption involve the bestowing of faith on any individual—and yet there is no salvation apart from faith.[137] This general decree, which does not involve the gift of faith, also can be framed, Du Moulin indicates, quite absurdly, to mean that Christ has died for the reprobate according to divine “intention” but not according to “outcome [evenement].”[138] In a line of argument that cuts against Davenant’s version of hypothetical universalism as well as Amyraut’s, Du Moulin concludes that it is also quite unconvincing to argue that God might have a truly universal “intention” to save all human beings but also not will to save all: if God wills to save only some, it must clearly be the divine intention only to save some.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calvin and the Reformed Tradition</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

<blockquote><p>VIII. We do very much differ from this opinion [of Arminians]: We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted, or that salvation was purchased for him, whom God from eternity has decreed to condem: For this were a vaine purchase. We deny that election is after the death of Christ, as for many other causes, so also because Christ in the very agony of death gave a notable proof of election in the thief, whose heart He affected, and enlightned his mind after an unutterable manner; the other thief being left and neglected. And seeing Christ does everywhere say that He died for his sheep, and for those whom his Father gave Him, He does sufficiently declare that He died for the elect.

IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Anatomy of Arminianism</cite>, … (1619; London, 1635), ch. 27, ‘How far, and in what sense Christ died for all’, pp. 226-28</span></figcaption>

<blockquote><p>Whether a prince or magistrate may tolerate Jews in his city or province? Three things may be considered in the Jews. First, the sect and Jewish exercise. Second, usury. Third, hatred toward Christians. All these are evil and prohibited. The question is therefore whether a prince or magistrate may permit or tolerate these evils; and what may be a legitimate cause for permitting and tolerating them? I answer through the following conclusions: First Conclusion. A magistrate may permit the rites and exercises of the Jews if a sufficient cause is present. The Pope of Rome does this, as do many princes in their provinces. The cause may be threefold. First, that through Jewish rites the Christian truth may be shadowed forth and confirmed: St. Augustine, Of the City of God, bk. 18, ch. 46 and St. Thomas in pt. 2 of 2, quest. 10, art. 11, approve this cause. Second, that Jews who practice their rites and understand from the Christians among whom they dwell that those rites were merely shadows and figures of the Christian religion may more easily be converted to the Faith of Christ. St. Thomas, in the cited place, also approves this. Third, that Christian princes or magistrates, under the pretext of permission, may receive money and other gifts from the Jews to whom they permit the exercise. This is not lawful. For public sins, by which God is offended, cannot be permitted for the sake of temporal gain alone, which is hoped for from the permission. Second Conclusion. A magistrate may permit the usuries of the Jews if a sufficient cause is present. The Pope and other Christian princes also do this. The cause may be twofold. One, to prevent a greater evil. For if, as I said above, usuries were not permitted, many thefts, robberies, oppressions of the poor and similar inconveniences would occur. Therefore, to avoid these evils, usuries may be permitted as a lesser evil. The other, that Christian princes and magistrates who permit the usuries of the Jews may be participants in the profit. This is not lawful. For it is certain that usury is prohibited by natural and divine law; and the profit that is acquired through usury is mere theft. Just as, therefore, the Jews sin against justice by receiving usurious profit, so do the Christians who are participants in that profit. They are considered to be participants, however, when they permit usuries for the purpose of being able to receive profit therefrom. This conclusion must be limited in two ways: First, that common usuries may be permitted which do not exceed the profit permitted by law and custom, but not exorbitant usuries, of which I shall speak shortly. Second, that a Christian magistrate may not receive profit from usuries on account of the mere permission of usuries: although they may receive it under another title. And indeed under a double title: First, the title of punishment; because he may punish the Jews on account of usuries; and the profit that has been unjustly acquired from usuries he may either restore to its owners or convert to public utility. Then, the title of exaction; because he may exact an annual tribute or tax from the Jews, not by reason of the permission of usuries, but by reason of the granted habitation in a Christian place. Third Conclusion. A Christian magistrate or prince cannot with a good conscience permit or leave unpunished the hatred of Jews toward Christians. Note: Hatred is twofold: The one is internal; because since it is hidden, the magistrate cannot punish it. The other is external, which breaks out into open injury. This ought to be coerced by the magistrate. We say, therefore, that such hatred, when it is exercised by Jews against Christians, can in no way be permitted or tolerated, but must be severely punished: and the prince sins gravely if he does not punish those who commit offenses. The reason is that a prince is bound by his office to punish every public injury, if he is able, so that justice may be preserved: therefore, he is also bound to punish the injury which the Jews commit against Christians. This is, indeed, manifold: First, because they exact immoderate and intolerable usury from citizens, country folk, and the poor. Whatever they exact beyond the principal is theft. Therefore, they commit intolerable theft. Second, by exacting such usury, they harm the republic or the community greatly. For a republic cannot stand or flourish when the people are oppressed and exhausted by usury. Third, besides usury, another injury is added. For whatever is for sale in the market, the Jews snatch away from the Christians by offering a higher price to the sellers than other buyers are accustomed to offer; and afterwards, which is most iniquitous, Christians are forced to pay double the price to the Jews if they wish to buy what is necessary for feeding their families. Fourth, so that they may do all these things with impunity, they distribute gifts to the officials of princes so that they may be protected by them. Fifth, from this it happens that the people, who bear such injuries with difficulty, become prone to inciting sedition, both against the Jews themselves and against their defenders and patrons. Against the Jews, indeed, because they are thieves and plunderers; against the patrons, because they are partners of thieves and plunderers. If a prince or magistrate does not prevent or punish these great evils (to say nothing of the rest), he is a participant in the crime and is bound to restitution. He can, however, prevent them in three ways. First, if he expels the Jews entirely from his province or city. Second, if he does not indeed expel them, but forces them to agriculture, or to mechanical arts, or to exercise other works; and does not allow them to live in idleness and luxury, as they now live. Third, if he deprives them of all the money and wealth which they have received through usury. Would that these things were brought into practice. You will say, if the Jews are either expelled or do not accept usury, two inconveniences will follow: First, because Christian princes in time of necessity will not have money for war. For they are accustomed to seek this from the Jews. Then, the subjects of the princes, who are in need of money, will not be able to borrow. I respond: The contrary follows: First, because once the Jews are expelled, the citizens will be able to contribute more support than the Jews are accustomed to. For whatever the Jews contribute, they receive from the citizens through unjust usury. And not only this, but also whatever is necessary for them to sustain their lives. Therefore, they take two portions from the citizens: one, which they give to the prince; the other, by which they live. Certainly, if the Jews were expelled, the citizens would be prepared to give either both portions to their prince, or at least no less than they give to the Jews. Next, the subjects of princes are in greater need of money when the Jews are present than when they are absent. For when they are present and demanding intolerable usury, they are completely drained. If they were absent, or at least did not demand such immoderate usury, the subjects would be less drained, and consequently would be in less need of money. Our Adam Contzen has written extensively on this subject in his Politics.</p></blockquote>

<blockquote><p>It is reported, as some write, that up to a hundred thousand men and women of both sexes migrated to the Turks in those times. Moreover, it is handed down to memory that the Turkish Emperor was accustomed to say that he marveled at the stupidity of Christian kings, in that they preferred to expel such a great multitude—whom, if they did not wish to kill, they could nevertheless have retained in the place of slaves to perform useful and suitable services—rather than retain them for their own profit, according to the Horatian precept: When you can sell a captive, do not kill him; he will serve usefully.</p></blockquote>

<blockquote><p>§17. Now to the Political Means. I. Nothing is accomplished, indeed, things are done badly, by persecuting, harassing or oppressing the Jews, driving them away, or killing them. … Therefore, the better and more common opinion, both among theologians and among jurists, is that the Jews should be tolerated—not indeed enticed, but, where they are found, not treated more harshly. Thus: • Baldus, vol. 1, Consil, 315-16 • Rolandus a Valle, vol. 3, Consil, 25 • Alexander of Hales, Summa, pt. 2, Questions 179-80 • Vincent of Beauvais, Spec. Doctr., bk. 10, ch. 38, etc. • Johannes Gerhard, Common Places, On the Magistrate, p. 631 • Hottinger, Thesaurus Philologicus, bk. 1, ch. 1, section 2, question 1 And the one who treated this matter learnedly and extensively in a separate book, Georgius Theodorus, Counselor of Hesse, De jure et statu Iudæorum in Republica Christianorum [On the Law and Status of the Jews in the Republics of Christians].</p></blockquote>

<blockquote><p>It was a saying of Martin Luther, Se propter unum Judaeum crucifixum omnibus favere Judaeis [Due to one crucified Jew, there is favor to all the Jews]. And if we love them and desire their conversion and salvation (as in Christian charity certainly we ought), then the way to effect that will not be to banish them and prohibit their habitation amongst us, so compelling them to live amongst Turks, Pagans or Papists; The images and idolatry of which last has undeniably been the greatest scandal, and Remora, which has long hindered them from being Christians. Whereas (if they be permitted to live amongst us) that stumbling-block will be taken away. 2. For the conditions of their admission, for the restrictions and limitations to be put upon them, a great deal of caution and Christian prudence is to be used, lest while we pretend their good we do mischief to ourselves. For as to deny them all liberty and commerce with us, may be an act of unchristian and indeed inhumane cruelty; So to give them too much is an act of imprudence and folly. And indeed we find some sober men (not without good reason) complain of the too much liberty they have in some Christian commonwealths. In short, what qualifications and limitations are to be put upon them, I shall not take upon me to determine, but leave that to the piety and prudence of the State. Yet (with submission) I conceive such limitations as these will be convenient, if not necessary; the rather because I find in our histories, in the imperial and canon laws, and in the old capitulars and canons of councils that such restrictions have been anciently laid upon them, as: 1. No toleration ever was, or de jure can be given them to profess or practice anything against the Law of Nature. 2. No toleration should be given them to speak anything blasphemously or impiously against Jesus Christ and the gospel: For though we may tolerate them in the profession of a bad, yet not in that blasphemy of a good, religion. 3. They never were nor should be permitted to circumcise children of Christians, or seduce any Christians to their religion: Let them profess, but not propagate their religion. 4. They were not permitted to carry any office or dignity in the Christian commonweal, though it seems that sometimes even that was permitted them. 5. They were not permitted in any suit or difference between a Jew and a Christian to draw the Christian or his Cause before a Jewish magistrate: For ’tis a ruled case in the Imperial Law, Judaeus Actor vel reus, Forum sequitur Christianum. 6. They were never permitted to make marriages with Christians, and the Glossator gives the reason of it in Law, Quia matrimonium debet esse communicatio divini &amp; humani juris. Whereas a Jew and Christian, being of different religions, cannot communicare in sacis. And this is consonant to the Law of the Gospel, which forbids us to be unequally yoked. Upon which grounds, I believe all marriages with Papists to be unlawful, that is, Fieri non debuit, ’tis unlawful to make such matches, though that factum valet, when such a match is made, the contract is valid. 7. Their frequent divorcing their wives was tolerated. For though Moses seem to suffer it, yet the emperors by express edict forbid it. 8. By the Imperial Laws polygamy and plurality of wives was not tolerated in them. 9. If any of the Jews turn Christian (by civil law) in case the Jews endeavored to reduce him, and maliciously injured him, they were to be burned for it. 10. They might repair their old synagogues, but were not tolerated (by the Roman Laws) to build new. 11. They were not tolerated to have any Christian servants, nurses, or midwives. Can. Praesenti. 1. Extra de Judaeis. Ex concilio malis conenti. 12. By the Canon Law they might not come abroad on Good Friday. 13. They were not permitted to wear Garments exactly of the Christian fashion, but were to have distinct habits [garments], that all might know them to be Jews. 14. They might not be physicians or give physick to any Christian. 15. They were not permitted to be of the Roman militia (though they were permitted to be advocates) by the rescript of Honorius and Arcadius to Romulianus P. P. 16. The Jews, being the greatest usurers in the world, and believing they may justly take the highest use they can get (even Usurae centessimae, if they could have it) of us gentiles, it is all the reason in the world they should be limited in this particular and not permitted to take more of us than the law permits us to take one of another. 17. They should be enjoined to admit of friendly collations and disputations sometimes about gospel truths, and not obstinately to reject all means of conversion and conviction, and satisfaction of those seeming reasons which keep them off from embracing the truth: For there will be little hopes (or possibility) of their conversion, if they be permitted obstinately to refuse all means of doing it. But enough (if not too much) of this, I shall only add one old law concerning the Jews made before the Conquest (above 600 years ago) and confirmed by the conquerors amongst other the good laws of Edward the Confessor, and so continued law (for ought I know) in all the kings’ reigns till the banishment of the Jews, which was anno 18 Edwardi 1. The Law is this: Sciendum quoque quod omnes Judaei, ubicunque in Regno sunt, sub tutela et defensione Regis ligea debent esse; nec quilibet eorum alicui Diviti se potest subdere, sine Regis licentia. Judaei enim, et omnia sua Regis sunt, Quod si quisquis detinuerit eos, vel Pecuniam eorum, perquirat Rex si vult, tanquam suum proprium. [It should also be known that all Jews, wherever they are in the kingdom, ought to be under the protection and defense of the king’s liege authority; nor may any one of them submit himself to any rich man without the king’s permission. For the Jews, and everything belonging to them, are the king’s. And if anyone detains them, or their money, the king may recover it if he wishes, as his own property.] I wish the chief magistrate could admit them on these terms, for so they, and all theirs (omnia sua) should be suum proprium, which possibly might supply him with money and so save taxes. And upon these terms I (and I believe everybody else) will willingly consent to their readmission.</p></blockquote>

tly+laid+upon+them%2C+as%3A+1.+No+toleration+ever+was%2C+or+de+jure+can+be+given+them+to+profess+or+practice+anything+against+the+Law+of+Nature.+2.+No+toleration+should+be+given+them+to+speak+anything+blasphemously+or+impiously+against+Jesus+Christ+and+the+gospel%3A+For+though+we+may+tolerate+them+in+the+profession+of+a+bad%2C+yet+not+in+that+blasphemy+of+a+good%2C+religion.+3.+They+never+were+nor+should+be+permitted+to+circumcise+children+of+Christians%2C+or+seduce+any+Christians+to+their+religion%3A+Let+them+profess%2C+but+not+propagate+their+religion.+4.+They+were+not+permitted+to+carry+any+office+or+dignity+in+the+Christian+commonweal%2C+though+it+seems+that+sometimes+even+that+was+permitted+them.+5.+They+were+not+permitted+in+any+suit+or+difference+between+a+Jew+and+a+Christian+to+draw+the+Christian+or+his+Cause+before+a+Jewish+magistrate%3A+For+%E2%80%99tis+a+ruled+case+in+the+Imperial+Law%2C+Judaeus+Actor+vel+reus%2C+Forum+sequitur+Christianum.+6.+They+were+never+permitted+to+make+marriages+with+Christians%2C+and+the+Glossator+gives+the+reason+of+it+in+Law%2C+Quia+matrimonium+debet+esse+communicatio+divini+%26+humani+juris.+Whereas+a+Jew+and+Christian%2C+being+of+different+religions%2C+cannot+communicare+in+sacis.+And+this+is+consonant+to+the+Law+of+the+Gospel%2C+which+forbids+us+to+be+unequally+yoked.+Upon+which+grounds%2C+I+believe+all+marriages+with+Papists+to+be+unlawful%2C+that+is%2C+Fieri+non+debuit%2C+%E2%80%99tis+unlawful+to+make+such+matches%2C+though+that+factum+valet%2C+when+such+a+match+is+made%2C+the+contract+is+valid.+7.+Their+frequent+divorcing+their+wives+was+tolerated.+For+though+Moses+seem+to+suffer+it%2C+yet+the+emperors+by+express+edict+forbid+it.+8.+By+the+Imperial+Laws+polygamy+and+plurality+of+wives+was+not+tolerated+in+them.+9.+If+any+of+the+Jews+turn+Christian+%28by+civil+law%29+in+case+the+Jews+endeavored+to+reduce+him%2C+and+maliciously+injured+him%2C+they+were+to+be+burned+for+it.+10.+They+might+repair+their+old+synagogues%2C+but+were+not+tolerated+%28by+the+Roman+Laws%29+to+build+new.+11.+They+were+not+tolerated+to+have+any+Christian+servants%2C+nurses%2C+or+midwives.+Can.+Praesenti.+1.+Extra+de+Judaeis.+Ex+concilio+malis+conenti.+12.+By+the+Canon+Law+they+might+not+come+abroad+on+Good+Friday.+13.+They+were+not+permitted+to+wear+Garments+exactly+of+the+Christian+fashion%2C+but+were+to+have+distinct+habits+%5Bgarments%5D%2C+that+all+might+know+them+to+be+Jews.+14.+They+might+not+be+physicians+or+give+physick+to+any+Christian.+15.+They+were+not+permitted+to+be+of+the+Roman+militia+%28though+they+were+permitted+to+be+advocates%29+by+the+rescript+of+Honorius+and+Arcadius+to+Romulianus+P.+P.+16.+The+Jews%2C+being+the+greatest+usurers+in+the+world%2C+and+believing+they+may+justly+take+the+highest+use+they+can+get+%28even+Usurae+centessimae%2C+if+they+could+have+it%29+of+us+gentiles%2C+it+is+all+the+reason+in+the+world+they+should+be+limited+in+this+particular+and+not+permitted+to+take+more+of+us+than+the+law+permits+us+to+take+one+of+another.+17.+They+should+be+enjoined+to+admit+of+friendly+collations+and+disputations+sometimes+about+gospel+truths%2C+and+not+obstinately+to+reject+all+means+of+conversion+and+conviction%2C+and+satisfaction+of+those+seeming+reasons+which+keep+them+off+from+embracing+the+truth%3A+For+there+will+be+little+hopes+%28or+possibility%29+of+their+conversion%2C+if+they+be+permitted+obstinately+to+refuse+all+means+of+doing+it.+But+enough+%28if+not+too+much%29+of+this%2C+I+shall+only+add+one+old+law+concerning+the+Jews+made+before+the+Conquest+%28above+600+years+ago%29+and+confirmed+by+the+conquerors+amongst+other+the+good+laws+of+Edward+the+Confessor%2C+and+so+continued+law+%28for+ought+I+know%29+in+all+the+kings%E2%80%99+reigns+till+the+banishment+of+the+Jews%2C+which+was+anno+18+Edwardi+1.+The+Law+is+this%3A+Sciendum+quoque+quod+omnes+Judaei%2C+ubicunque+in+Regno+sunt%2C+sub+tutela+et+defensione+Regis+ligea+debent+esse%3B+nec+quilibet+eorum+alicui+Diviti+se+potest+subdere%2C+sine+Regis+licentia.+Judaei+enim%2C+et+omnia+sua+Regis+sunt%2C+Quod+si+quisquis+detinuerit+eos%2C+vel+Pecuniam+eorum%2C+perquirat+Rex+si+vult%2C+tanquam+suum+proprium.+%5BIt+should+also+be+known+that+all+Jews%2C+wherever+they+are+in+the+kingdom%2C+ought+to+be+under+the+protection+and+defense+of+the+king%E2%80%99s+liege+authority%3B+nor+may+any+one+of+them+submit+himself+to+any+rich+man+without+the+king%E2%80%99s+permission.+For+the+Jews%2C+and+everything+belonging+to+them%2C+are+the+king%E2%80%99s.+And+if+anyone+detains+them%2C+or+their+money%2C+the+king+may+recover+it+if+he+wishes%2C+as+his+own+property.%5D+I+wish+the+chief+magistrate+could+admit+them+on+these+terms%2C+for+so+they%2C+and+all+theirs+%28omnia+sua%29+should+be+suum+proprium%2C+which+possibly+might+supply+him+with+money+and+so+save+taxes.+And+upon+these+terms+I+%28and+I+believe+everybody+else%29+will+willingly+consent+to+their+readmission.%E2%80%9D%0A%0A%E2%80%94+Thomas+Barlow%2C+%E2%80%98The+Case+of+the+Jews%E2%80%99+in+Several+Miscellaneous+%26+Weighty+Cases+of+Conscience+Learnedly+%26+Judiciously+Resolved+%28d.+1691%3B+London%3A+1692%29%2C+pp.+3-78+For+the+many+marginal+references+in+the+quote+below%2C+see+the+original.%2C+pp.+65-75&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f760fe242.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4f760fe242.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/judaism#:~:text=It%20was%20a%20saying%20of%20Martin,will%20willingly%20consent%20to%20their%20readmission&amp;text=It%20was%20a%20saying%20of%20Martin%20Luther%2C%20Se&amp;text=everybody%20else%29%20will%20willingly%20consent%20to%20their%20readmission" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>earthly votes commend the divine faith, and Christ, destitute of his own virtue, is argued against, while ambition is reconciled to his name. The Church terrifies by exiles and prisons, and forces belief in itself, which was believed by exiles and prisons: it depends on the dignity of those who communicate, by which it is consecrated by the terror of those who persecute; it puts to flight priests, by which it was propagated by the priests who were put to flight: it loves itself, it boasts of the world (let the Jesuit note this and remember the argument of the first chapter of his famous pamphlet) by which Christ could not be, unless the world had hated him.</p></blockquote>

<blockquote><p>4. And therefore does the Scripture say, “These words the Lord spake to all the assembly of the children of Israel in the mount, and He added no more;” for, as I have already observed, He stood in need of nothing from them. And again Moses says: “And now Israel, what doth the LORD thy God require of thee, but to fear the LORD thy God, to walk in all His ways, and to love Him, and to serve the LORD thy God with all thy heart, and with all thy soul?” Now these things did indeed make man glorious, by supplying what was wanting to him, namely, the friendship of God; but they profited God nothing, for God did not at all stand in need of man’s love. For the glory of God was wanting to man, which he could obtain no other way than by serving God. And therefore Moses says to them again: “Choose life, that thou mayest live, and thy seed, to love the LORD thy God, to hear His voice, to cleave unto Him; for this is thy life, and the length of thy days.” Preparing man for this life, the Lord Himself did speak in His own person to all alike the words of the Decalogue; and therefore, in like manner, do they remain permanently with us, receiving by means of His advent in the flesh, extension and increase, but not abrogation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, 4.16.4</span></figcaption>

<blockquote><p>The word ‘recreation’ is equivocal. Indeed there is a recreation which is mercy, (viz.) the necessary refreshment of the body, as eating, drinking, resting itself, especially to those who have wearied themselves with labor; yea, to some sickly bodies, some ordinary, moderate and inoffensive recreations may be allowed, as a learned man observes. But there is a recreation which we call sports and pastimes, when there is no necessity; and to allow this is no work of mercy; and if it be a mercy to the body, it is severity to the soul…</p></blockquote>

</figure><figure class="quote" id="q-900968f3a8" data-kw="">
<blockquote><p>Nor can the context of public worship be completely divorced from the ethical sphere of common life, because the most fundamental law of nature is to pursue good and avoid evil (Ps. 34:14; Amos 5:14; 1 Pet. 3:11). This natural law, inherent to us, falls under moral obedience to God in the First Commandment. But public worship ordinances, being ceremonial in nature, and the Regulative Principle of Worship, are secondary to that and less fundamental, flowing out of the Second Commandment. Further, the good of persons’ salvation, besides being grounded in the First Commandment, also derives in significant part from the moral Sixth Commandment, both of which may override the ceremonies of the First Table of the Law. Thus moral obedience and serving the good of the cause of the Gospel (including through the principles we have been discussing) underlies, penetrates, takes precedence over and foundationally supports public worship. To deny this and affirm the opposite is to wrench the Great Commission backwards (Mt. 28:18–20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 50</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

<blockquote><p>John the Baptist was an occasional conformist to the Jewish Church: He went to Jerusalem to worship thrice a year at the solemn feasts, according to the Law [Dt. 16:16]; but at other times he held separate assemblies¹ in the wilderness of Judea at Jordan [Mk. 1:5], and at Aenon [Jn. 3:23], where he taught and baptized… ¹ [For a summary in English Church history after the Reformation of presbyterians and puritans who at times held separate assemblies from the established Anglican Church, yet still held communion with her, see James Owen, Moderation Still a Virtue, 1704, pp. 42-44.] Our Lord Jesus Christ, the Author of our holy religion, was also an occasional conformist. We find Him sometimes in the Temple and synagogues; at other times preaching in private houses, on mountains and in the wilderness, etc… He preached in separate congregations, was a dissenter from the imposed ceremonies and traditions of the elders, and vindicated his disciples in their non-conformity to them, telling his censorious accusers that they ‘taught for doctrine the commandments of men.’ (Mt. 15:1-9; Mk. 7:1-8) The apostles of our Lord Jesus, in imitation of their Master, were occasional conformists. One, while we find them in the Temple at public worship and teaching there (Acts 3:1; 4:1); another [time] while in a private meeting, or conventicle, as some would call it. St. Luke says, ‘They continued daily with one accord in the Temple’, and ‘broke bread from house to house.’ (Acts 2:46) St. Paul, the apostle of the gentiles, was eminent for occasional conformity. He exhorts the Christians to assert their freedom from the law of ceremonies (Gal. 5:1), lives himself after the manner of the gentiles (Gal. 2:14), and by consequence, in fellowship with them, yet occasionally purified himself in the Temple, according to the Law of Moses. (Acts 21:26) He was a dissenter from the ceremonies of the Law, and yet submits to them to avoid offense [Acts 16:3; 18:21]. He statedly communicated with the gentile Churches, but holds occasional communion with the national Jewish Church. He judged occasional communion lawful, but did not therefore conclude constant communion a duty, nay, it had been sinful to him and all other Christians; for then they must have separated from the fellowship of the Gospel [Acts 15:7-19; Gal. 2:9-21], and renounced Christianity… From this different constitutions of the Jewish [in Acts 15:21] and Gentile Churches, it follows: 1. That there was no exact uniformity in the Churches planted by the apostles. Nor did they make any laws of uniformity in lesser matters, as the condition of Christian communion; but left the believers to follow their different sentiments, and to approve themselves to God therein. Some were free to eat all things, others eat herbs, rather than forbidden flesh, or clean flesh dressed after the manner of the gentiles, some observed days, others not. (Rom. 14:2, 5) Here is a manifest difference in practice, and the rule or canon which the apostle gives about it, is not a rule of uniformity, but of charity, not to despise or judge one another. (Rom. 14:3)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-owen.html">James Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Occasional Communion</cite>, Moderation a Virtue, or, The Occasional Conformist Justified from the Imputation of Hypocrisy… (London: Baldwin, 1703), pp. 7-9 Owen (1654-1706) was an English, Independent puritan. By “occasional conformity,” Owen does not mean ever doing that which is sinful. | Lawfulness &amp; Need in Some Circumstances for Some Separation, while Maintaining Occasional Communion, or Conformity</span></figcaption>

.+St.+Luke+says%2C+%E2%80%98They+continued+daily+with+one+accord+in+the+Temple%E2%80%99%2C+and+%E2%80%98broke+bread+from+house+to+house.%E2%80%99+%28Acts+2%3A46%29+St.+Paul%2C+the+apostle+of+the+gentiles%2C+was+eminent+for+occasional+conformity.+He+exhorts+the+Christians+to+assert+their+freedom+from+the+law+of+ceremonies+%28Gal.+5%3A1%29%2C+lives+himself+after+the+manner+of+the+gentiles+%28Gal.+2%3A14%29%2C+and+by+consequence%2C+in+fellowship+with+them%2C+yet+occasionally+purified+himself+in+the+Temple%2C+according+to+the+Law+of+Moses.+%28Acts+21%3A26%29+He+was+a+dissenter+from+the+ceremonies+of+the+Law%2C+and+yet+submits+to+them+to+avoid+offense+%5BActs+16%3A3%3B+18%3A21%5D.+He+statedly+communicated+with+the+gentile+Churches%2C+but+holds+occasional+communion+with+the+national+Jewish+Church.+He+judged+occasional+communion+lawful%2C+but+did+not+therefore+conclude+constant+communion+a+duty%2C+nay%2C+it+had+been+sinful+to+him+and+all+other+Christians%3B+for+then+they+must+have+separated+from+the+fellowship+of+the+Gospel+%5BActs+15%3A7-19%3B+Gal.+2%3A9-21%5D%2C+and+renounced+Christianity%E2%80%A6+From+this+different+constitutions+of+the+Jewish+%5Bin+Acts+15%3A21%5D+and+Gentile+Churches%2C+it+follows%3A+1.+That+there+was+no+exact+uniformity+in+the+Churches+planted+by+the+apostles.+Nor+did+they+make+any+laws+of+uniformity+in+lesser+matters%2C+as+the+condition+of+Christian+communion%3B+but+left+the+believers+to+follow+their+different+sentiments%2C+and+to+approve+themselves+to+God+therein.+Some+were+free+to+eat+all+things%2C+others+eat+herbs%2C+rather+than+forbidden+flesh%2C+or+clean+flesh+dressed+after+the+manner+of+the+gentiles%2C+some+observed+days%2C+others+not.+%28Rom.+14%3A2%2C+5%29+Here+is+a+manifest+difference+in+practice%2C+and+the+rule+or+canon+which+the+apostle+gives+about+it%2C+is+not+a+rule+of+uniformity%2C+but+of+charity%2C+not+to+despise+or+judge+one+another.+%28Rom.+14%3A3%29%E2%80%9D%0A%0A%E2%80%94+James+Owen%2C+Occasional+Communion+%7C+Moderation+a+Virtue%2C+or%2C+The+Occasional+Conformist+Justified+from+the+Imputation+of+Hypocrisy%E2%80%A6+%28London%3A+Baldwin%2C+1703%29%2C+pp.+7-9+Owen+%281654-1706%29+was+an+English%2C+Independent+puritan.+By+%E2%80%9Coccasional+conformity%2C%E2%80%9D+Owen+does+not+mean+ever+doing+that+which+is+sinful.+%7C+Lawfulness+%26+Need+in+Some+Circumstances+for+Some+Separation%2C+while+Maintaining+Occasional+Communion%2C+or+Conformity&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2f0051a23a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2f0051a23a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-impurities-in-worship/#:~:text=John%20the%20Baptist%20was%20an%20occasional,or%20judge%20one%20another.%20%28Rom.%2014%3A3&amp;text=John%20the%20Baptist%20was%20an%20occasional%20conformist%20to&amp;text=to%20despise%20or%20judge%20one%20another.%20%28Rom.%2014%3A3" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

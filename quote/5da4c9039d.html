</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1e4abf0ed1" data-kw="">
<blockquote><p>Second, we confess that Christ indeed rules now, and possesses all authority, both in heaven and on earth, according to both natures. But not presently, as far as the flesh is concerned. The apostle says that we are absent from Christ now on earth, not at home, and desire to leave the body to be joined to him. On this account we say that he has indeed not yet come nor is present in his flesh, but will certainly appear again, visibly from the invisible, or rather will come for all to see.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, 1586, ed. Jeffrey Mallinson (St. Louis: Concordia Publishing House, 2017), ch. 2, ‘Person of Christ’, Response to Thesis 17, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Second, we confess that Christ indeed rules now, and possesses all authority, both in heaven and on earth, according to both natures. But not presently, as far as the flesh is concerned. The apostle says that we are absent from Christ now on earth, not at home, and desire to leave the body to be joined to him. On this account we say that he has indeed not yet come nor is present in his flesh, but will certainly appear again, visibly from the invisible, or rather will come for all to see.”

— Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard, 1586, ed. Jeffrey Mallinson (St. Louis: Concordia Publishing House, 2017), ch. 2, ‘Person of Christ’, Response to Thesis 17, pp. 253-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecond%2C+we+confess+that+Christ+indeed+rules+now%2C+and+possesses+all+authority%2C+both+in+heaven+and+on+earth%2C+according+to+both+natures.+But+not+presently%2C+as+far+as+the+flesh+is+concerned.+The+apostle+says+that+we+are+absent+from+Christ+now+on+earth%2C+not+at+home%2C+and+desire+to+leave+the+body+to+be+joined+to+him.+On+this+account+we+say+that+he+has+indeed+not+yet+come+nor+is+present+in+his+flesh%2C+but+will+certainly+appear+again%2C+visibly+from+the+invisible%2C+or+rather+will+come+for+all+to+see.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Lutheranism+vs.+Calvinism%3A+the+Classic+Debate+at+the+Colloquy+of+Montbeliard%2C+1586%2C+ed.+Jeffrey+Mallinson+%28St.+Louis%3A+Concordia+Publishing+House%2C+2017%29%2C+ch.+2%2C+%E2%80%98Person+of+Christ%E2%80%99%2C+Response+to+Thesis+17%2C+pp.+253-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e4abf0ed1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e4abf0ed1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-extent-of-christs-mediatorial-kingdom-2/#:~:text=Second%2C%20we%20confess%20that%20Christ%20indeed,will%20come%20for%20all%20to%20see&amp;text=Second%2C%20we%20confess%20that%20Christ%20indeed%20rules%20now&amp;text=or%20rather%20will%20come%20for%20all%20to%20see" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-799cf93f69" data-kw="">
<blockquote><p>If He had made intercession and sacrifice for reprobates too, then clearly, their sins having been paid for by the sacrifice of the Son of God, the justice of God would not allow Him to require a debt already paid by the Son, nor would the justice of God be able to punish them with eternal death for their sins inasmuch as satisfaction has been made by Him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/caspar-olevianus.html">Caspar Olevianus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De substantia foederis gratuiti inter deum et electos</cite>, (Geneva, 1585), pp. 67-72 as translated in G. Michael Thomas, The Extent of the Atonement… (Paternoster/Wipf &amp; Stock, 1997), p. 114</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“If He had made intercession and sacrifice for reprobates too, then clearly, their sins having been paid for by the sacrifice of the Son of God, the justice of God would not allow Him to require a debt already paid by the Son, nor would the justice of God be able to punish them with eternal death for their sins inasmuch as satisfaction has been made by Him.”

</figure><figure class="quote" id="q-df5b903686" data-kw="">

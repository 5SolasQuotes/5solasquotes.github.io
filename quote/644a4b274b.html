<main class="wrap"><figure class="quote" id="q-644a4b274b" data-kw="">
<blockquote><p>I. When two commandments of the moral law are opposite in respect of use as we can not do them both at the same time: then the lesser commandment gives place to the greater and does not bind for that instant. Example 1. God commands one thing, and the magistrate commands the flat contrary: in this case which of these two commandments must be obeyed, ‘Honor God,’ or, ‘Honor the Magistrate’? The answer is, that the latter must give place to the former, and the former must only be obeyed. Acts 4:19, ‘Whether it be right in the sight of God to obey you rather than God judge ye.’

II. The 4th Commandment prescribes rest on the Sabbath day. Now it [falls?] out that at the same time [that] a whole town set on fire, and the Sixth Commandment requires our help in saving our neighbor’s life and goods. Now of these two commandments, which must be obeyed? For both cannot. The answer is that the Fourth Commandment at this time is to give place, and the Sixth Commandment alone binds the conscience: so as then (if need should require) a man might labor all the day without offence to God. Mt. 9:13, ‘I will have mercy and not sacrifice.’ And the rule must not be omitted that charity towards our neighbor is subordinate to the love of God, and therefore must give place to it. For this cause the commandment concerning charity must give place to the commandment concerning love to God: and when the case so falls out that we must either offend our neighbor or God, we must rather offend our neighbor than God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience</cite>, … (Cambridge, 1596), pp. 14-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-lords-supper/preparation-celebration-reflection.html">Preparation, Celebration, Reflection</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0aad91c5a6" data-kw="">
<blockquote><p>For the manner of their [Independents’] celebration, they who have seen it profess it to be in a very dead and comfortless way: it is not as in New England, once in the month, but as at Amsterdam, once every Lord’s Day, which makes the action much less solemn than in any other of the Reformed Churches, and in this too much like the daily masses of the Church of Rome. They have no preparation of their flock before: they are so happy as to have all their members prepared always sufficiently for the Lord’s Table, from their first entrance into their Church to their dying day; for all this time there is no catechizing among them; this exercise is below their condition and altogether needless in any of their congregations. They will have no sermon in the week before, nor so much as any warning [fore-notice] of the Communion. This practice of New England, to give warning the Sabbath before, is disliked now at London: nor must there be any sermon of thanksgiving after that sacrament: They use not so much as a little application of the doctrine in the sermon before it to that occasion. When they come to the action, there is no more but one little discourse and one short prayer of the minister; all the time of the participation, there is nothing in the congregation but a dumb silence: no reading, no exhortation, no psalms; their people need no such means to furnish them in their sacramental meditations;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-baillie.html">Robert Baillie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dissuasive from the Errors of the Time</cite>, (1645), ch. 6, p. 121</span></figcaption>

<blockquote><p>3. By forgetting the difference between their private familiarity, where they are choosers of their company themselves, and their Church-communion, where the pastors are the rulers and judges of the fitness of the members. Or else not understanding that this use of the keys, and judging of the fitness of the members, is indeed the pastor’s office and not theirs.

4. By not considering that nothing must be done by discipline upon offenders but in a course of Church-justice, upon due accusations, summons, audience, proof and patient admonition: And not by casting out any irregularly upon the expectation of every one that will say that they are ungodly and scandalous. … 8. By forgetting that God has not left the Church at arbitrary liberty to judge any godly or ungodly at their pleasure; But has given us a set test or rule to judge them by, which is their sober profession of consent to the baptismal Covenant, upon which the adult and their infants have right to baptism; and being baptized have right to Church-communion in all the acts which their age and understanding makes them capable of: And it is Church-tyranny to refuse such as show this title, till they are openly proved to forfeit it, by impenitency in gross sin after public admonition and due means. This is the truth, and the method of Christ’s discipline, and the rule of our communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Second Admonition to Mr. Edward Bagshaw</cite>, (London: Simmons, 1671), ‘To those Readers…’, p. 3</span></figcaption>

<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Appendix, Intro to Scandal, question 6, pp. 81-83</span></figcaption>

l he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…”

<blockquote><p>As for the rest of the testimonies Dr. Burgess produces out of the Fathers for kneeling, I need not insist upon them for either they speak of the inward adoration of the heart, which we ought to direct unto Christ when we receive the Sacrament (and this none of us denies), or else they speak of adoring the sacrament: where by the word ‘adoration’ we may not understand any divine worship, inward or outward, but a reverence of another nature, called veneration. That this (which we deny not neither) and no more is meant by the Fathers when they speak of the adoration of the sacrament, Antonius de Dominis shows more copiously (Rep. Eccl., bk. 5, ch. 6).</p></blockquote>

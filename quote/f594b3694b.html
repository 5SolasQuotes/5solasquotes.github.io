<blockquote><p>Now on the other side, if after the truth shall be truly tried out, it shall be found, that the substance of bread is the natural substance of the Sacrament, although for the change of the use, office and dignity of the bread, the bread indeed sacramentally is changed into the body of Christ, as the water in Baptism is sacramentally changed into the fountain of regeneration, &amp; yet the natural substance thereof remaineth all one, as was before: if (I say) the true solution of that former question (whereupon all these controversies do hang) be, that the natural substance of bread, is the material substance in the Sacrament of Christ’s blessed body:

[T]han must it needs follow, of the former proposition (confessed of all that be named to be learned, so far as I do know, in England) which is, that there is but one material substance in the Sacrament of the body, and one only likewise in the Sacrament of the blood: that there is no such thing in deed and in truth, as they call Transubstantiation: for the substance of bread remaineth still in the Sacrament of the body: than also the natural substance of Christ’s human nature, which he took of the virgin Mary is in heaven, where it reigneth now in glory, and not here enclosed under the form of bread: than that godly honour, which is only due unto God the creator, may not be done unto the creature without idolatry and sacrilege, is not to be done unto the holy Sacrament.

Than also the wicked, I mean the impenitent murderer, adulterer, or such like, do not receive the natural substance of the blessed body &amp; blood of Christ. Finally than doth it follow, than Christ’s blessed body &amp; blood, which was once only offered &amp; shed upon the cross, being available for the sins of all the whole world, is offered up no more, in the natural substance thereof, neither by the priest nor any other thing.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-ridley.html">Nicholas Ridley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brief declaration of the Lord’s Supper, written by the singular learned man, and most constant martyr of Jesus Christ, Nicholas Ridley Bishop of London prisoner in Oxford, a little before he suffered death for the true testimony of Christ</cite>, (Emden: E. van der Erve, 1555), unpaginated.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b1da1a9cb3" data-kw="self-exam">
<blockquote><p>Christ used bread because with the divine blessing it is of all the elements the most efficacious for nourishing and strengthening the body; the most common, the most familiar and to be found everywhere, easily prepared and the most pleasant. However, the bread he used was unleavened; not from the necessity of the thing, but from an accidental circumstance of time, on account of the feast of the Passover, in which it was lawful neither to use nor to have any other (Ex. 12:19). Otherwise it was always fermented in Judea (whenever the Supper was celebrated outside of that time, Acts 2:42) as well as among the Gentiles (who used common and not unleavened bread). Hence it was called simply the “breaking of bread” (Acts 20:7; 1 Cor. 10:16; 11:26, 27). So that here so fierce a dispute on this subject falsely sprang up between the Greeks and Latins; the Greeks pressing the necessity of leavened, the latter of unleavened bread. The former were called “fermentarians” and the latter “azymites.” The thing is in itself indifferent (as many of the Romanists acknowledge); on account of which the peace of the church ought not to be disturbed, but it should be left to their freedom (as it is evident that both the ancient and also the modern uses vary).</p></blockquote>

</figure><figure class="quote" id="q-3fb15df988" data-kw="">
<blockquote><p>And let it not seem strange to you, we are not so much to deal with a promise here as with the thing promised, nor to feed on a promise as upon Christ himself by faith, to eat his flesh and drink his blood, This is my body, &amp;c. Christ is the meat here for the hand of faith to receive, the mouth of faith to eat, as he faith, My flesh is meat indeed, and my blood is drink indeed. You may make use of the promises here, the Sacrament is the seal to every promise in the covenant.

But the matter of the Sacrament indeed, and that whereon we are chiefly to feed, is Christ himself. Christ as he is laid out unto us in his death and sufferings, whereon feeding, we get spiritual nourishment for grace, and death of sin. The blood of Christ, like the waters appointed for the trial of jealousy, hath a double property, to kill and to make fruitful; to kill our sins, and make our graces grow; to rot our sins, and ripen our grace.

Well then, remember that the great dish thou feedest on at this Feast, be Christ himself. Thou canst not feed upon a promise, until thou first feed upon Christ; he doth not only give us title and interest in them, but appetite to them. If thou feed on him, thy stomach will be quicker to feed on them; nay, if thou feed on him, thou feedest on all the promises, and hast an interest in all the good of them, the sweet of all the promises is tasted in Christ. All the promises are folded up in Christ, and thou canst not feed on him, but thou feedest on all, and hast the blessing of every one in particular. The promises of justification, sanctification, subduing of corruptions, increase of grace, upholding in grace, interest in glory, they are all of them folded up in Christ, he is all.

The promise doth not, but Christ doth justify, Christ doth sanctify; you get nothing from the promise separate from Christ, but all the good of the promise comes in by Christ, and therefore here terminate your faith. And so much for the second, upon what object we must terminate our Faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-bolton.html">Samuel Bolton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guard of the tree of life, or, A sacramental discourse shewing a Christians privilege in approaching to God in ordinances, duty in his sacramental approaches, danger if he do not sanctify God in them</cite>, (London: A. Kemble, 1644), pp 52-54.</span></figcaption>

</figure><figure class="quote" id="q-efc52c85f3" data-kw="">
<blockquote><p>The second matter to be considered in reference to this sacrament is the external signs. We must here take note of the signs and the ceremonies associated with them. The signs are identical to those used in meals in order to nourish and refresh the body: bread and wine. One is to be neither superstitious nor concerned regarding the kind of bread and wine. The bread and wine which Christ used were such as were available and in common use. It is credible that in light of the Passover Christ used unleavened bread; but that was incidental, for leavened bread was neither permitted to be used nor was it available in Jerusalem at that time. It is therefore not necessary to follow suit in this respect. It must be bread which one commonly uses for nourishment, thus to typify the spiritual nourishment of the soul. The wafers of the Papists and the Lutherans consist more of foam than of bread, and are not suitable for nourishment and strengthening. This is contrary to the institution of the Lord’s Supper; Christ had no wafers, but took bread, broke off fragments, and gave them to the disciples. He did not give a wafer to anyone. … Common substances must be used without superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>This quote was compiled by Andy Webb</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The second matter to be considered in reference to this sacrament is the external signs. We must here take note of the signs and the ceremonies associated with them. The signs are identical to those used in meals in order to nourish and refresh the body: bread and wine. One is to be neither superstitious nor concerned regarding the kind of bread and wine. The bread and wine which Christ used were such as were available and in common use. It is credible that in light of the Passover Christ used unleavened bread; but that was incidental, for leavened bread was neither permitted to be used nor was it available in Jerusalem at that time. It is therefore not necessary to follow suit in this respect. It must be bread which one commonly uses for nourishment, thus to typify the spiritual nourishment of the soul. The wafers of the Papists and the Lutherans consist more of foam than of bread, and are not suitable for nourishment and strengthening. This is contrary to the institution of the Lord’s Supper; Christ had no wafers, but took bread, broke off fragments, and gave them to the disciples. He did not give a wafer to anyone. … Common substances must be used without superstition.”

— Wilhelmus à Brakel, This quote was compiled by Andy Webb">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+second+matter+to+be+considered+in+reference+to+this+sacrament+is+the+external+signs.+We+must+here+take+note+of+the+signs+and+the+ceremonies+associated+with+them.+The+signs+are+identical+to+those+used+in+meals+in+order+to+nourish+and+refresh+the+body%3A+bread+and+wine.+One+is+to+be+neither+superstitious+nor+concerned+regarding+the+kind+of+bread+and+wine.+The+bread+and+wine+which+Christ+used+were+such+as+were+available+and+in+common+use.+It+is+credible+that+in+light+of+the+Passover+Christ+used+unleavened+bread%3B+but+that+was+incidental%2C+for+leavened+bread+was+neither+permitted+to+be+used+nor+was+it+available+in+Jerusalem+at+that+time.+It+is+therefore+not+necessary+to+follow+suit+in+this+respect.+It+must+be+bread+which+one+commonly+uses+for+nourishment%2C+thus+to+typify+the+spiritual+nourishment+of+the+soul.+The+wafers+of+the+Papists+and+the+Lutherans+consist+more+of+foam+than+of+bread%2C+and+are+not+suitable+for+nourishment+and+strengthening.+This+is+contrary+to+the+institution+of+the+Lord%E2%80%99s+Supper%3B+Christ+had+no+wafers%2C+but+took+bread%2C+broke+off+fragments%2C+and+gave+them+to+the+disciples.+He+did+not+give+a+wafer+to+anyone.+%E2%80%A6+Common+substances+must+be+used+without+superstition.%E2%80%9D%0A%0A%E2%80%94+Wilhelmus+%C3%A0+Brakel%2C+This+quote+was+compiled+by+Andy+Webb&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fefc52c85f3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/efc52c85f3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/the-lords-supper/the-administration-of-the-lords-supper/quotes-on-common-bread-in-the-lords-supper/#:~:text=The%20second%20matter%20to%20be%20considered,substances%20must%20be%20used%20without%20superstition&amp;text=The%20second%20matter%20to%20be%20considered%20in%20reference&

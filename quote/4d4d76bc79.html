<main class="wrap"><figure class="quote" id="q-4d4d76bc79" data-kw="">
<blockquote><p>Vice prevailing greatly weakens a people and makes them far less able to uphold and defend themselves. It weakens them as it enfeebles their bodies, and so renders them the more unfit for the fatigue and hardship and warlike achievements necessary for the defence of a nation. It weakens them, as it thins their numbers. Proverbs 14:28, “In the multitude of people is the king’s honour: but in the want of people is the destruction of the prince.”

It weakens them as it enfeebles their minds and renders them effeminate. It weakens them as it consumes their wealth. The strength and power of a nation or kingdom consists very much in their wealth. It has ever been found by experience that nations or kingdoms [that] have been very much overrun with luxury and sensuality, that they have declined and have been an easy prey to their enemies.

Thus sin is a reproach to any people, as they thereby lose their power and influence, and so lose their honour and expose themselves to [the] contempt and the insults of their neighbours; and often by this means are reduced from a prosperous and flourishing state, to become subjects and slaves to foreigners’ honour.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jonathan-edwards.html">Jonathan Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sin and Wickedness bring Calamity and Misery on a People (1729) in Sermons and Discourses, 1723-1729</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

<blockquote><p>Job, when God visited him, desired to know wherefore God contended with Him: it is a sad thing to lie drowned under unknown and fatherless plagues, we being ignorant of the causes of God’s judgement; so we suffer blind crosses like the ox that bears the yoke and knows nothing of the art of husbandry [farming], or the horse killed in the battle, and yet is ignorant of State-affairs, and of the causes of war, and of disorders in Laws, Liberties, Religion in State and Church, we are like one smitten in the dark night by a spirit or a ghost, but he sees not who strikes. Oh it were good we would inquire, as the prophet does, Isa. 42:24, “Who gave Jacob for a spoil, and Israel to robbery?” and wherefore is all this come on us? why doth the Lord contend with us? O make us know our iniquities.</p></blockquote>

<blockquote><p>Concerning the Civil Magistrate … 2. For the due form of government, or power of governors in any nation, they believe God’s Word has fixed no universal rule, only confirming the just laws of kingdoms and polities, and they believe it their duty to be obedient to such governors in all places, as the laws in that place have established, and in the exercise of such power as those laws have given them. From the obedience to which no person upon the account of religion can pretend to an immunity; and in the exercise of which no magistrate ought by any to be resisted.</p></blockquote>

</figure><figure class="quote" id="q-b70c1d282f" data-kw="">
<blockquote><p>Primo Adami there was a government instituted by God immediately, of universal peace, civil, national, domestical, spiritual, corporal peace, nothing but peace, peace; yet Adam and Eve there, as Achan here, took but one bit of the excommunicated thing, that God had specially reserved, and thereby became Achans, troublers of all the peace public, so that he made himself and all the world anathema, an accursed thing thereby. After, when peace begun to be restored, and religion repaired in the Family of Seth, the sons of God offended in the execrable thing in marrying the Daughters of excommunicate Cain, and so not only disturbed, but brought ruin and destruction upon the whole World, Gen. 6. v. 2, 7.

When that great Law-giver Moses, with Laws judicial, moral and also Ceremonial, to tally divine, had settled the glory and peace of the Church, and Common-wealth of Israel, the people offending in the accursed thing of the Golden Calf, so disturbed all that notwithstanding Law and Government also, they were like to be consumed as one man and wholly extirpated, Exod. 32. Saul was a Monarch anointed of God himself, 2. Sam. 1. 15. elected by the vehement desire of all the subjects, yet offending in the execrable thing of Agag, reserving but one person which God had destinated to utter destruction, utterly ruinated his Government, and posterity. Solomon the Prince of peace, that had a Patent of peace, 1. Kings. 11. 11. and such skill in Governments as never any Monarch before him, or after him shall attain, yet by offending in the execrable thing of Chemosh and Milcom disturbed the peace public, and made such a rent in his Kingdom, as could never after be repaired.

Machiavelli himself in his Book De Repub: gives us one ground for this, whilst persuading Kings, above all things, if they mean to maintain obedience of their subjects to themselves, and peace one with another, to possess them with reverence of divine things, and fear of divine vengeance, as well as terror of human penalty: for, saith he, whosoever makes no scruples, to neglect or offend against these, will make much less, when occasion is offered, to plot sedition, to accommodate themselves to changes, to practice Treason, though to the utter overthrow of the whole Government. And surely he that is so loose conscience, and desperate, that he fears not with Achan to offend in the Babylonish Garment, though he doth thereby incur, and expose himself to the curse of the King of Heaven, hath no banks, or bonds to restrain him when occasion is offered, to ruin others, to disturb and trouble Church and Commonwealth, and to turn Traitor to the best established Government, or Governors on the Earth.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-fairclough.html">Samuel Fairclough</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The troublers troubled, or, Achan condemned and executed. A sermon preached before sundry of the honourable House of Commons at Westminster, April 4, 1641</cite>, (London: Henry Overton, 1641), pp 6-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

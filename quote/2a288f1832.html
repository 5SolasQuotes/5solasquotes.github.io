<main class="wrap"><figure class="quote" id="q-2a288f1832" data-kw="government particular concourse">
<blockquote><p>Is providence occupied only in the conservation and sustentation of things; or also in their government through which God himself acts and efficaciously concurs with them by a concourse not general and indifferent, but particular, specific and immediate? We deny the former and affirm the latter, against the Jesuits, Socinians and Remonstrants.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 6.4</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c3a4da0f42" data-kw="providence wisdom">
<blockquote><p>That there is a Providence. The wisdom of God would not be so perspicuous, were there not a providence in the world. It is eminent in the creation, but more illustrious in the government of the creatures. A musician discovers more skill in the touching an instrument, and ordering the strings, to sound what notes he pleaseth, than he doth in the first framing and making of it. All God’s providences are but his touch of the strings of this great instrument of the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Divine Providence</cite>, Discourse on Divine Providence</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/providence/providence-in-general.html">Providence in General</a> › <a href="../topics/providence/providence-in-general/against-epicureans-and-chance.html">Against Epicureans and chance</a></span><span class="t"><a href="../topics/providence/government.html">Government</a> › <a href="../topics/providence/government/of-nations.html">Of nations</a></span></div>

— Stephen Charnock, A Treatise on Divine Providence, Discourse on Divine Providence">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat%20there%20is%20a%20Providence.%20The%20wisdom%20of%20God%20would%20not%20be%20so%20perspicuous%2C%20were%20there%20not%20a%20providence%20in%20the%20world.%20It%20is%20eminent%20in%20the%20creation%2C%20but%20more%20illustrious%20in%20the%20government%20of%20the%20creatures.%20A%20musician%20discovers%20more%20skill%20in%20the%20touching%20an%20instrument%2C%20and%20ordering%20the%20strings%2C%20to%20sound%20what%20notes%20he%20pleaseth%2C%20than%20he%20doth%20in%20the%20first%20framing%20and%20making%20of%20it.%20All%20God%E2%80%99s%20providences%20are%20but%20his%20touch%20of%20the%20strings%20of%20this%20great%20instrument%20of%20the%20world.%E2%80%9D%0A%0A%E2%80%94%20Stephen%20Charnock%2C%20A%20Treatise%20on%20Divine%20Providence%2C%20Discourse%20on%20Divine%20Providence&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fc3a4da0f42.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c3a4da0f42.html">Permalink</a><a class="src" href="https://drive.google.com/file/d/1EGFsp7v9lcY8wh0YFHDNjVL2BvjyRV8o/view?usp=drivesdk" rel="noopener" target="_blank">Read it online · Drive (Nick&#x27;s copy)</a></div>
</figure><figure class="quote" id="q-90b2694bf6" data-kw="Sovereignty Satan">
<blockquote><p>The Lord God omnipotent reigneth. His government is exercised over inanimate matter, over the brute beasts, over the children of men, over angels good and evil, and over Satan himself. No revolving world, no shining of star, no storm, no creature moves, no actions of men, no errands of angels, no deeds of Devil—nothing in all the vast universe can come to pass otherwise than God has eternally purposed. Here is a foundation of faith. Here is a resting place for the intellect. Here is an anchor for the soul, both sure and steadfast. It is not blind fate, unbridled evil, man or Devil, but the Lord Almighty who is ruling the world, ruling it according to His own good pleasure and for His own eternal glory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-w-pink.html">Arthur W. Pink</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Sovereignty of God</cite>, ch. 3, “Sovereignty of God in Administration”</span></figcaption>

</figure><figure class="quote" id="q-5cdc07d4df" data-kw="Wisdom">
<blockquote><p>It is a marked proof of the wisdom of God that he can so direct all the affairs of the universe as, without need of special action, to accomplish all the events he chooses. All providence, therefore, is general, because operated through general laws. It is also special, because every individual event comes to pass under God&#x27;s own inspection, and through his own will and work.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-petigru-boyce.html">James Petigru Boyce</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abstract of Systematic Theology</cite>, ch. XXI, “Providence,” §IV.1</span></figcaption>

</figure><figure class="quote" id="q-5636806dec" data-kw="Sovereignty Author of sin Satan">
<blockquote><p>We believe that the same good God, after He had created all things, did not forsake them or give them up to fortune or chance, but that He rules and governs them according to His holy will, so that nothing happens in this world without His appointment; nevertheless, God neither is the author of nor can be charged with the sins which are committed. For His power and goodness are so great and incomprehensible that He orders and executes His work in the most excellent and just manner, even then when devils and wicked men act unjustly.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guido-de-bres.html">Guido de Brès</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Belgic Confession</cite>, Art. 13</span></figcaption>

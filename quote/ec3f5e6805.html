<main class="wrap"><figure class="quote" id="q-ec3f5e6805" data-kw="">
<blockquote><p>The next argument commonly urged by our Episcopal brethren in support of Prelacy is, that Timothy was evidently, in fact, Bishop of Ephesus, and Titus of Crete; and that this furnishes, of course, a plain example of an order of ministers superior to common pastors. This alleged fact is a cornerstone of the Episcopal fabric, and unless it can be supported, the whole edifice must fall to the ground.

But for this alleged Prelacy of Timothy and Titus, there is not only no positive proof, but there is not even a shadow of it, in the whole New Testament. There is no evidence whatever, that either of them ever had a fixed pastoral charge at Ephesus or Crete. There is no evidence that either of them ever performed the work of ordination alone. One of them, while at Ephesus, was expressly directed to “do the work of an evangelist,” and there is not the slightest intimation that either acted in any higher character. There is no hint that they performed any act, to which any regular minister of the Gospel is not fully competent.

In short, the whole Episcopal argument drawn from the charge to Timothy and Titus, is destitute of the semblance of proof from Scripture. All the premises on which it is founded, are taken for granted without evidence. All that appears to have been done by these evangelists, is done every day by evangelists authorized and sent forth by the Presbyterian Church; and no reason can be assigned for ascribing to the missionaries to Ephesus and Crete any higher character, than that the Episcopal cause demands it.

In truth, when thrown into the form of a regular syllogism, its amount is neither more nor less than the following: “None but diocesan Bishops can ordain ministers, and ‘set in order’ churches; but Timothy and Titus, discharged these offices; therefore, Timothy and Titus were diocesan Bishops.” But is not the very thing to be proved, viz: that diocesan Bishops alone can ordain, &amp;c., here taken for granted? Can there be a more gross begging of the whole question than this argument exemplifies?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-miller.html">Samuel Miller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Presbyterianism: The Truly Primitive and Apostolic Constitution of the Church of Christ</cite>, (Philadelphia PA: Presbyterian Tract and Sunday School Society, 1836), pp 49-50.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a054699443" data-kw="">
<blockquote><p>Although the editor of this blog is not opposed to home-schooling (indeed, it is often the only way for parents in our current circumstances to ensure their children get a Christian education), we reject the extremist notion that it is the only scriptural (or even the best) way to educate children. Our Reformed forebears did not believe this to be the case; you will even notice that Samuel Rutherford applies a favourite home-schooling “proof-text” to those who teach children in schools. This, moreover, also demonstrates that the Covenanters did not believe in Kuyperian notions of sphere-sovereignty. Since magistrates and school-teachers are also “fathers”, texts like Ephesians 6:4 could also be applied to them and not just to literal fathers. Hence they rejected the idea that education belonged to the “sphere” of the nuclear family alone :

There are with us Doctors of Divinity who teach in Schools and Universities, men tried to be holy and learned, and then put in office, as 1 Tim. 3. 10. under whose instruction are students aiming at the holy ministry called expectants, as in the Jewish Church in their Colleges, were young Prophets, or sons of the Prophets, as 1 Sam. 10. 5. 2 Kin. 4. 1. 1 King. 20. 35. These Doctors and also the teachers of human literature, who train up children in the nurture and admonition of the Lord, Pro. 22. 6. Ephes. 6.4. if they aim at the Ministry, prophesy in our presbyterial meetings, 1 Cor. 14.29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A peaceable and temperate plea for Paul’s Presbytery in</cite>, Scotland (London, 1642), p. 319.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

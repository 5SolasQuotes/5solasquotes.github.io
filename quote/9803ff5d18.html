<main class="wrap"><figure class="quote" id="q-9803ff5d18" data-kw="">
<blockquote><p>God promised to Eve, that the seed of a woman

Should tread down the head of the subtle serpent,

This Promise was fully accomplished than

When Christ became man and made the atonement.

This seed was of his mother and not from heaven sent

How can it be called the seed of a woman truly

Which taketh no substance, nor part of her body?

To Abraham and Jacob, the same seed was promised

The book of Genesis, is plain and manifest:

In thy seed, shall all the people of the world be blessed

Not brought from above, but born to perform the behest

Was Christ of his mother, and not from heaven sent

To this sense and meaning thy wits thou incline,

And mark well what is meant by this pronounce thine

How could it be their seed, which take not their substance

But came down from heaven, and was not of their kind?

The scripture containeth no such repugnance

Who shall be able by the same, to prove or to find

To warrant Christ’s humanity, or believe it in his mind?

If ye make it uncertain, of whom he did take it

It appeareth by this opinion the devil is awaked.

God promised to raise up the same seed to David

Of the fruit of his belly to sit on his seat.

In the second of Samuel and the seventh ye may have it

God is full Just and did not forget

To conquer the devil and his devise to defeat,

To vanquish his judgment and putt away sin,

Christ was this seed borne of his mother the virgin.

Esay [Isaiah] the prophet confirmed the same

A virgin shall conceive and bring forth a child,

With this the Gospel of Matthew doth frame

The fruit did grow in the womb undefiled

And the mother waxt great, nature was begild

This came not by fortune or casual chance

That Christ took of his mother his corporeal substance.

From the rote of Jesse proceed shall a bud,

And a flower of this rote, for so the prophet says.

This bud was Mary, of whose flesh and blood,

Came Christ the flower, my faith shall be always

The fruit of her womb which never decays,

And not as water which runs to a Conduit,

And passes through a pipe, as the Devil now hath found it.</p></blockquote>

<blockquote><p>Although they are not agreed as to the number (some making more, others fewer), still there are three principal ones upon which they build up the monastic life, continence, obedience and poverty. To these the three vows imposed upon monks correspond: of perpetual continence, regular obedience and voluntary poverty. Of the orthodox. II. On the other hand, the orthodox do not deny that there are certain indifferent works left to each one’s own will in the Scriptures, and with respect to which counsels may be given in the word of God, not improperly distinguished from the precepts necessarily to be obeyed: such as Paul’s counsel concerning a virgin’s marrying or not marrying (1 Cor. 7:26, 36); concerning the use of wine with regard to Timothy (1 Tim. 5:23*). Still they are of such a nature that they are not of themselves pleasing to God and when neglected, deserve no punishment; nor when observed, any reward. But they deny that there are any such counsels about moral things, since these fall under commands properly so called, not under counsels.</p></blockquote>

<blockquote><p>She who bare (really) bare; and although she was a virgin when she conceived, she was a wife when she brought forth her son. Now, as a wife, she was under the very law of opening the womb, wherein it was quite immaterial whether the birth of the male was by virtue of a husband’s co-operation or not; it was the same sex that opened her womb. Indeed, hers is the womb on account of which it is written of others also: ‘Every male that opens the womb shall be called holy to the Lord.&#x27;</p></blockquote>

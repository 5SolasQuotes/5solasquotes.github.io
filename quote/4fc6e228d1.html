<blockquote><p>The number of varying interpretations which have been offered of this passage might well deter one from presenting another. By evincing the fact that its meaning has not been settled, however, it rather acts as an incitement. We do not hope to settle it now; but we wish to contribute our mite. The meaning of the words themselves is simple. That they express primarily the simple thought, “But a mediator is not [in the nature of the case, a mediator] of one [person or party], but God is one,” most men have quickly seen and frankly expressed. That the εἷς must be taken in the same numerical sense as the ἑνὸς seems also plain. But, having got this translation, what does it mean? The following explanation of the contextual flow of argumentation will supply, it is thought, a natural and—may it be hoped?—probably the true account of the matter.

The apostle is arguing that the introduction of the law did not set aside the promise to Abraham. He states that the transaction with Abraham was of the nature of a covenant (v. 17). Now, when men once make a covenant, that covenant is fixed and not liable to alteration or destruction save on consent of both parties (v. 15). The covenant of the promises was made so long ago as Abraham’s day (v. 16), and, as it is incidentally stated, with two parties of the second part, Abraham himself, and his seed, who is explained to be Christ.

It follows, then, that since made with Abraham at that time, it was not liable to be summarily set aside (by the introduction of a law) by God alone four hundred and fifty years after, in the absence of both the parties of the second part, Abraham being dead and his seed not yet come. That a legal method of salvation would make void the promise is evident (v. 17). For, if the inheritance was given to Abraham by promise, as it certainly was, then, to make it to be of law by a new enactment would be to set aside the promise (v. 18).

But, if the law did not set aside the promise, and if the ἐπήγγελται was never meant to be by law—why, it may well be asked, was the law given at all? Verse 19 answers this question. The children of Abraham, provided for in the covenant, had ever since its institution been breaking their covenant engagement—by sinning. Yet, as the covenant could not be disannulled until the coming of the σπέρμα, who was one of its original parties, God could not cast off those children of Abraham. Therefore, on account of these transgressions, — to bring out and make evident their true character as transgressions,—the law was added—a document temporarily (ἄχρις) put forth by one of the parties to declare what was infringement of the covenant engagements, and therefore to stand as witness or norm of action on the other side until the coming of the σπέρμα.

The temporariness of the document was a matter of course; if the σπέρμα on his coming fulfilled the terms of the covenant, this would be full satisfaction for all infringements, and the protest (as it were), necessarily disappeared. Now, the apostle adds that this law was given ἐν χειρὶ μεσίτου. And, notice:—a mediator is not and cannot be a mediator of one party—there must be two concerned in it; yet God is only one party. Therefore, in giving the law by the hand of a mediator God makes an express admission that there were two parties involved, and a consequently implied acknowledgment that a law published only by one of them—so long, therefore, as the seed had not come—could not set aside the promissory covenant. The conclusion is, that the law in the nature of the case and by the direct implication of the method chosen for its publication, could not do away with the promise. It was not an ἐπιδιατάσσομαι, therefore not inconsistent with v. 15; but a simple declaratory document set forth by one party as an exhibit of his covenant rights.

Looking back on the whole argument the apostle asks, v. 21, if the law could, then, be against the promises, and answers, μὴ γένοιτο. No law had ever been given, meant to set aside the promise and offer salvation on other conditions. The law included in the Scriptures was designed, rather, to shut up all under sin—to define and make plain what was a violation of the covenant—and thus to bring all to Christ, the σπέρμα to come, to be according to promise justified through faith in Him. Thus, the law, so far from being κατὰ τῶν ἐπαγγελιῶν (v. 21), is seen to be rather παιδαγωγὸς εἰς Χριστόν (v. 24). And its service is over when the σπέρμα has come (v. 25).</p></blockquote>

<blockquote><p>And (1) we remark, that the Oath of God which we are to enter into, is not the Covenant of Grace, but it is a Covenant of Duty and Gratitude; and all that have taken hold of the Covenant of Grace are obliged to devote themselves to the Lord in a Covenant of Duty. There must be Faith in Christ in the first Place, and, in consequence of that, there ought to be an open Professing of our Faith in him and obedience to him. … We say it is not the Covenant of Grace, but a Covenant of Duty, which is founded upon, and consequential of our taking hold of the Covenant of Grace.

For, in the first Place, the Covenant of Grace is a Bundle of precious Promises, which God hath undertaken to perform to us for Christ’s Sake. The Covenant of Duty is a Bundle of Duties, which, as inflated in Christ our new Covenant and sanctifying Head, we do promise in his Strength to do and perform. 2dly. The Covenant of Grace never was, and never shall, nor can be broken, because the Parties contracting in it are Jehovah the Father on Heaven’s Side, and Jehovah the Son on Man’s Side, as my be seen in the 89 Psalm throughout. But our Covenant Duty and Gratitude is frequently broken, and needs to be renewed.

3dly. The Covenant of Grace, as it stands fast with Christ, is the Ground of all our Faith, Hope and Confidence before God: But our Covenant of Duty is neither in less nor more a Ground of Hope or Confidence to us. If we value ourselves less or more upon the Account of it, we do but idolize it. It is a Mean of God’s Appointment to impress deeply upon our Spirits a Sense of our Duty to God, a Sense of our Insufficiency to perform any Duty acceptably by any Ability or Power of our own, and to strengthen our Dependence upon Christ alone for Righteousness and Strength: But if we trust to it as a Ground of Hope, we pervert the End and Design of its Institution, and abuse it to perverse Ends of our own Invention.</p></blockquote>

+idolize+it.+It+is+a+Mean+of+God%E2%80%99s+Appointment+to+impress+deeply+upon+our+Spirits+a+Sense+of+our+Duty+to+God%2C+a+Sense+of+our+Insufficiency+to+perform+any+Duty+acceptably+by+any+Ability+or+Power+of+our+own%2C+and+to+strengthen+our+Dependence+upon+Christ+alone+for+Righteousness+and+Strength%3A+But+if+we+trust+to+it+as+a+Ground+of+Hope%2C+we+pervert+the+End+and+Design+of+its+Institution%2C+and+abuse+it+to+perverse+Ends+of+our+own+Invention.%E2%80%9D%0A%0A%E2%80%94+Alexander+Moncrieff%2C+The+Duty+of+National+Covenanting+Explained%3A+In+Some+Sermons+Preached+at+the+Renovation+of+Our+Covenants%2C+National+and+Solemn+League%2C+in+the+Bond+Adapted+to+our+Present+Situation+and+Circumstances+in+this+Period%2C+by+the+Associate+Presbytery%2C+at+Abernethy%2C+in+the+Month+of+July+1744%2C+%28Edinburgh%3A+David+Duncan%2C+1747%29%2C+pp+13-14.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd474a2bfcb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d474a2bfcb.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2018/09/28/alexander-moncrieff-national-covenants-are-not-the-unbreakable-covenant-of-grace/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

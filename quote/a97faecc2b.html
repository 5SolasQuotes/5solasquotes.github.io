<main class="wrap"><figure class="quote" id="q-a97faecc2b" data-kw="">
<blockquote><p>Rutherford’s position is that God by creating rational creatures… at once creates the common principles of the natural law. Since they are part of the very constitution of the rational creature these are unable to be effaced… However, taking up Menchaca’s own Ockhamist position, Rutherford agrees that it would have been quite possible for God to have created another species of rational creature distinct from man to whom he gave a diverse natural law… Rutherford’s position is that the love of God and the subjection of the creature to the Creator is an essential part of any kind of natural law. Rutherford therefore concurs with the prominent Dutch Reformed theologian Gisbertus Voetius that the dependency of the rational creature on its Creator in morality and in order to right reason is so necessary that its opposite implies a contradiction… this law… is immutable and antecedent to every act of the divine will [stemming from the divine nature], forming the cornerstone of the natural law. What is left open to the divine decree is simply to select whether a particular act or its omission should be considered as due subjection and obedience to God, or not. Thus while the divine will establishes the moral status of a complex act, it always does so against the backdrop of God’s own nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/simon-j-g-burton.html">Simon J.G. Burton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, ch. 7, ‘Samuel Rutherford’s Euthyphro Dilemma: A Reformed Perspective on the Scholastic Natural Law Tradition’ in d. Aaron C. Denlinger, Reformed Orthodoxy in Scotland: Essays on Scottish Theology, 1560-1775 (Bloomsbury, T&amp;T Clark, 2016), pt. 2, pp. 123-40, pp. 132-33</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1881f9940b" data-kw="">
<blockquote><p>It is queried whether a magistrate is authorized to impose capital punishment on the exceedingly shameful and murderers? Some Remonstrants [Arminians] deny… but others openly assert… We all affirm to authorize, and the contrary sentiments we condemn and reject as errors: 1. For Gen. 9:6, “Whoso sheds man’s blood, by man shall his blood be shed.” Ex. 21:14, “But if a man come presumptuously upon his neighbor, to slay him with guile; thou shalt take him from mine altar, that he may die.” Num. 35:31, “Moreover ye shall take no satisfaction for the life of a murderer, which is guilty of death: but he shall be surely put to death.” which is not a judicial law and temporary, but is clearly effected out of the Law of Nature, which innocent blood cannot be expiated as in the Ceremonial or Judicial Law [Dt. 21:1-9]. But it says ‘never’: Num. 35:33, “So ye shall not pollute the land wherein ye are: for blood it defileth the land: and the land cannot be cleansed of the blood that is shed therein, but by the blood of him that shed it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Rom</cite>, 13:4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-c3844dc234" data-kw="">
<blockquote><p>Hence that is a fiduciary power, or a power of trust, wherein the thing put in trust is not either his own proper heritage or gift, so as he may dispose of it as he pleases, as men dispose of their goods or heritage. But the king may not dispose of men as men, as he pleases; nor of laws as he pleases; nor of governing men, killing or keeping alive, punishing and rewarding, as he pleases… But tbe law is not the king’s own, but given to him in trust.</p></blockquote>

</figure><figure class="quote" id="q-5348ac5b40" data-kw="">

<blockquote><p>2. What rulers think good is not a rule for constitutions and for peoples obedience in matters circumstantial; but the rule of rulers here in making laws, and of people in obeying laws, is goodness itself, order, decency, aptitude to edify, in things that they command…

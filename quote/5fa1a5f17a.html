</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-03c94e9d27" data-kw="">
<blockquote><p>It is likely that Boethius (480-524) inaugurates, in Latin Christian theology, the consideration of personhood as such… a person is an individual substance of a rational nature… This chapter situates Boethius in relation to significant Christian theologians before and after him… In contemporary philosophy, there is a lot of attention paid to the rationality condition for personhood. But if we look at the text in which Boethius defines a person, we do not find any precise criteria for it… The intrusion of personhood into contemporary applied ethics with a focus on detailed and disputed criteria for rationality as a condition for personhood seems to be a modern development. From a Patristic and Medieval Christian theology point of view, trying to find just the right detailed criteria for rationality in order to define personhood is a wild goose chase… The chapter consists of six sections… 1. Origen of Alexandria and the Cappadocians: Basil of Caesarea and Gregory of Nyssa 2. Miaphysites: Severus of Antioch, John Philoponus, and Peter of Callinicum 3. Boethius and Rusticus the Deacon: Rationality, Subsistence, and the Invention of Personhood 4. Neo-Chalcedonians (II): Leontius of Byzantium and John of Damascus 5. Scholastic Neo-Chalcedonians (I): Gilbert of Poitiers, Richard of St. Victor,William of Auxerre, Alexander of Hales, Bonaventure, Thomas Aquinas, andWilliam of Ware 6. Scholastic Neo-Chalcedonians (II): Henry of Ghent, John Duns Scotus, andWilliam of Ockham</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scott-m-williams.html">Scott M. Williams</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Person’ in Patristic &amp; Medieval Christian Theology’</cite></span></figcaption>

</figure><figure class="quote" id="q-d6ff100697" data-kw="">
<blockquote><p>As the soul of Christ was separated from his body for the space of three days, was the Godhead likewise separated from them both, or was the Godhead joined with the soul, and severed from the body? Neyther, says [John] Damascenus (Of the Orthodox Faith): For the Godhead remained unseparable from both, and that which the Word once took upon, Him never afterwards left. But how could it be that the divine nature should continue united to the soul which was in Paradise, and the body which was in the earth? The divine nature of the Son, because it is both infinite and present in all places, remained whole and undivided, united to both together, that is as well to the soul of Christ which was in Paradise, as to the body which lay lifeless in the earth. For seeing the nature of God is most simple, and so not to be parted or divided, God is not to be said to have one part in heaven, and another in earth, but He is whole in heaven and whole in earth, not at several times and by succession, but both together, which thing no created nature can do. Hence comes the saying of Augustine: It is proper to the whole Trinity to be whole everywhere, in spaces of places not divided. Whether was Christ being now dead, true man? He was, for although the soul and body were separated, and so it was a true death, yet by the conjunction of personal union they remained together in one third, as it were, so that our life was truly hid in Christ, yea even when He was dead. Others answer that Christ in that three days was man materially, because He was truly soul and body: but at his resurrection (they say) he was man formally, after his soul rerurned into his body. Who therefore died, and what he the the adiuncts of his death? The son of God, at the mention of whom the whole frame and nature of things in this world trembled… But when the Lord died…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bucanus.html">William Bucanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutions of Christian Religion… (London, 1606), Common Place 23, ‘Of the Passion &amp; Death of Christ’</cite>, pp. 233-4</span></figcaption>

</figure><figure class="quote" id="q-b402491f0d" data-kw="">
<blockquote><p>I will speak distinctly… how to understand his being forsaken of God, which is not to be understood: 1. As if the union of the Godhead with the human nature had been dissolved, but so as it might still be compatible, and rightly stand with it. For it was not a forsaking in respect of the essence of the Godhead, but of his presence, and so in a way of sense. The Godhead was not separated, though the operation of comfort from the Godhead were sequestered. The union hypostatical continued still with his soul, now filled with the sorrows of death, as well as it did with his body when He lay in the grave. And so as although his body was united to the fountain of life, yet it might die in respect of a natural life: so his soul, although the hypostatical union continued, might yet want [lack] comfort, which is life.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ the Mediator, bk. 5, ch. 13</cite>, p. 279 in Works, vol. 5</span></figcaption>

— Thomas Goodwin, Christ the Mediator, bk. 5, ch. 13, p. 279 in Works, vol. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CI+will+speak+distinctly%E2%80%A6+how+to+understand+his+being+forsaken+of+God%2C+which+is+not+to+be+understood%3A+1.+As+if+the+union+of+the+Godhead+with+the+human+nature+had+been+dissolved%2C+but+so+as+it+might+still+be+compatible%2C+and+rightly+stand+with+it.+For+it+was+not+a+forsaking+in+respect+of+the+essence+of+the+Godhead%2C+but+of+his+presence%2C+and+so+in+a+way+of+sense.+The+Godhead+was+not+separated%2C+though+the+operation+of+comfort+from+the+Godhead+were+sequestered.+The+union+hypostatical+continued+still+with+his+soul%2C+now+filled+with+the+sorrows+of+death%2C+as+well+as+it+did+with+his+body+when+He+lay+in+the+grave.+And+so+as+although+his+body+was+united+to+the+fountain+of+life%2C+yet+it+might+die+in+respect+of+a+natural+life%3A+so+his+soul%2C+although+the+hypostatical+union+continued%2C+might+yet+want+%5Black%5D+comfort%2C+which+is+life.%E2%80%9D%0A%0A%E2%80%94+Thomas+Goodwin%2C+Christ+the+Mediator%2C+bk.+5%2C+ch.+13%2C+p.+279+in+Works%2C+vol.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb402491f0d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b402491f0d.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/#:~:text=I%20will%20speak%20distinctly,want%20%5Black%5D%20comfort%2C%20which%20is%20life&amp;text=I%20will%20speak%20distinctly&amp;text=might%20yet%20want%20%5Black%5D%20comfort%2C%20which%20is%20life" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2cba7293f0" data-kw="">
<blockquote><p>The Lutherans teach, and that rightly, that in death the soul of Christ was truly and really separated from His body, and that locally (although some expressly deny the same: as I have shown in the Exercitation). At the same time, they also teach, that, because of the personal union, His soul and body were necessarily wherever His divinity was. Graver in the supplement to article 3 of the Confessionis Augustanæ. Whence it follows, that His soul was not able to be separated locally from His body. For, as His divinity was not able to be separated from His body or soul: because it was everywhere: so neither was His body absent from His soul, nor His soul from His body, locally, that is, distant by an interval of space: because the soul of Christ was no less everywhere, than His divinity, nor was His body any less everywhere. But from this net Meisner attempt to extricate himself, Quæstionibus Vexatis 2, §32. Christ, says he, was truly dead, and so, where His body was, there His soul was not, on account of the natural separation made: but, nevertheless, these two, of which the one was physically and locally distant from the other, were not distant from each other hyperphysically and in the λόγῳ/Logos: since His hypostasis is infinite, illocal, indivisible, indistant. He says that this is a great mystery. Whence he orders the Calvinists to learn, that the mode of natural presence is one thing, of personal presence another: and that one thing is able to be present with another and to be absent from it in different respects, without ἀντιφάσει/contradiction. The argument, whereby he concludes this great mystery, and in the answering of which he wishes us to be exercised, is of this sort: Whatever things in the altogether simple λόγῳ/Logos are indistantly (ἀδιαστάτως, without distance, from each other) united; those in that third, in which (ἀδιαστάτως, without distance, from each other) they are united and subsist, are altogether present to each other. But the soul of Christ in the heavens, and the body of Christ on earth, which are naturally and locally most distant, in the perfectly simple and indistant λόγῳ/Logos, were united (ἀδιαστάτως, without distance, from each other). Therefore, the soul of Christ in the heavens, and the body of Christ on earth, which are naturally and locally most distant, were altogether present to each other in the hypostasis of the λόγου/Logos. And so the body and soul were able to be separated, although each was everywhere. Response: No laborious exercise is needed. We deny the minor, which Meisner was obliged clearly to prove, not to assume without demonstration. Indeed, the body and soul of Christ, at the time of His death, were united to the λόγῳ/Logos, but were not united with each other ἀδιαστάτως, without distance: seeing that they were at an incredible distance from each other. But, says our opponent, what things are united to a single, altogether simple, indivisible, and indistant third thing; those are united and present to each other (ἀδιαστάτως, without distance). Response: If that third altogether simple and indivisible thing be finite, we grant what our opponent maintains: but, if it be infinite and omnipresent, united to which were the body and soul of Christ at the time of His death, we do not at all grant it. The falsity is perfectly evident. Elijah and I are united to a third, altogether simple, indivisible, indistant, namely, God. But, who would say, that I, existing on the earth, am present by substantial proximity to Elijah, existing, not on earth, but in heaven? Therefore, the mystery vanishes. That personal presence, whereby body and soul, being locally separated by the whole heaven, were nevertheless altogether present to each other ἀδιαστάτως, without distance, in the λόγῳ/Logos, is not a great mystery, but a great and contradictory fiction. We turn that argument back upon our opponents. What in substance is everywhere, that is absent from no place with respect to essence or substance. But the soul of Christ, in the death of Christ, because of the union with the λόγῳ/Logos (according to the Lutheran hypothesis), in substance was everwhere. Therefore, the soul of Christ was absent from no place with respect to its substance: and by consequence, it was also in its body, and was united to it ἀδιαστάτως, without distance, and so was not separated from it: which the Suebi maintain: but Meisner with other Lutherans does not maintain it, against the Lutheran hypotheses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), Species of the Office of Christ, pt. 2</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“The Lutherans teach, and that rightly, that in death the soul of Christ was truly and really separated from His body, and that locally (although some expressly deny the same: as I have shown in the Exercitation). At the same time, they also teach, that, because of the personal union, His soul and body were necessarily wherever His divinity was. Graver in the supplement to article 3 of the Confessionis Augustanæ. Whence it follows, that His soul was not able to be separated locally from His body. For, as His divinity was not able to be separated from His body or soul: because it was everywhere: so neither was His body absent from His soul, nor His soul from His body, locally, that is, distant by an interval of space: because the soul of Christ was no less everywhere, than His divinity, nor was His body any less everywhere. But from this net Meisner attempt to extricate himself, Quæstionibus Vexatis 2, §32. Christ, says he, was truly dead, and so, where His body was, there His soul was not, on account of the natural separation made: but, nevertheless, these two, of which the one was physically and locally distant from the other, were not distant from each other hyperphysically and in the λόγῳ/Logos: since His hypostasis is infinite, illocal, indivisible, indistant. He says that this is a great mystery. Whence he orders the Calvinists to learn, that the mode of natural presence is one thing, of personal presence another: and that one thing is able to be present with another and to be absent from it in different respects, without ἀντιφάσει/contradiction. The argument, whereby he concludes this great mystery, and in the answering of which he wishes us to be exercised, is of this sort: Whatever things in the altogether simple λόγῳ/Logos are indistantly (ἀδιαστάτως, without distance, from each other) united; those in that third, in which (ἀδιαστάτως, without distance, from each other) they are united and subsist, are altogether present to each other. But the soul of Christ in the heavens, and the body of Christ on earth, which are naturally and locally most distant, in the perfectly simple and indistant λόγῳ/Logos, were united (ἀδιαστάτως, without distance, from each other). Therefore, the soul of Christ in the heavens, and the body of Christ on earth, which are naturally and locally most distant, were altogether present to each other in the hypostasis of the λόγου/Logos. And so the body and soul were able to be separated, although each was everywhere. Response: No laborious exercise is needed. We deny the minor, which Meisner was obliged clearly to prove, not to assume without demonstration. Indeed, the body and soul of Christ, at the time of His death, were united to the λόγῳ/Logos, but were not united with each other ἀδιαστάτως, without distance: seeing that they were at an incredible distance from each other. But, says our opponent, what things are united to a single, altogether simple, indivisible, and indistant third thing; those are united and present to each other (ἀδιαστάτως, without distance). Response: If that third altogether simple and indivisible thing be finite, we grant what our opponent maintains: but, if it be infinite and omnipresent, united to which were the body and soul of Christ at the time of His death, we do not at all grant it. The falsity is perfectly evident. Elijah and I are united to a third, altogether simple, indivisible, indistant, namely, God. But, who would say, that I, existing on the earth, am present by substantial proximity to Elijah, existing, not on earth, but in heaven? Therefore, the mystery vanishes. That personal presence, whereby body and soul, being locally separated by the whole heaven, were nevertheless altogether present to each other ἀδιαστάτως, without distance, in the λόγῳ/Logos, is not a great mystery, but a great and contradictory fiction. We turn that argument back upon our opponents. What in substance is everywhere, that is absent from no place with respect to essence or substance. But the soul of Christ, in the death of Christ, because of the union with the λόγῳ/Logos (according to the Lutheran hypothesis), in substance was everwhere. Therefore, the soul of Christ was absent from no place with respect to its substance: and by consequence, it was also in its body, and was united to it ἀδιαστάτως, without distance, and so was not separated from it: which the Suebi maintain: but Meisner with other Lutherans does not maintain it, against the Lutheran hypotheses.”

— Marcus F. Wendelin, Christian Theology 3rd ed. (1634), Species of the Office of Christ, pt. 2">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+Lutherans+teach%2C+and+that+rightly%2C+that+in+death+the+soul+of+Christ+was+truly+and+really+separated+from+His+body%2C+and+that+locally+%28although+some+expressly+deny+the+same%3A+as+I+have+shown+in+the+Exercitation%29.+At+the+same+time%2C+they+also+teach%2C+that%2C+because+of+the+personal+union%2C+His+soul+and+body+were+necessarily+wherever+His+divinity+was.+Graver+in+the+supplement+to+article+3+of+the+Confessionis+Augustan%C3%A6.+Whence+it+follows%2C+that+His+soul+was+not+able+to+be+separated+locally+from+His+body.+For%2C+as+His+divinity+was+not+able+to+be+separated+from+His+body+or+soul%3A+because+it+was+everywhere%3A+so+neither+was+His+body+absent+from+His+soul%2C+nor+His+soul+from+His+body%2C+locally%2C+that+is%2C+distant+by+an+interval+of+space%3A+because+the+soul+of+Christ+was+no+less+everywhere%2C+than+His+divinity%2C+nor+was+His+body+any+less+everywhere.+But+from+this+net+Meisner+attempt+to+extricate+himself%2C+Qu%C3%A6stionibus+Vexatis+2%2C+%C2%A732.+Christ%2C+says+he%2C+was+truly+dead%2C+and+so%2C+where+His+body+was%2C+there+His+soul+was+not%2C+on+account+of+the+natural+separation+made%3A+but%2C+nevertheless%2C+these+two%2C+of+which+the+one+was+physically+and+locally+distant+from+the+other%2C+were+not+distant+from+each+other+hyperphysically+and+in+the+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos%3A+since+His+hypostasis+is+infinite%2C+illocal%2C+indivisible%2C+indistant.+He+says+that+this+is+a+great+mystery.+Whence+he+orders+the+Calvinists+to+learn%2C+that+the+mode+of+natural+presence+is+one+thing%2C+of+personal+presence+another%3A+and+that+one+thing+is+able+to+be+present+with+another+and+to+be+absent+from+it+in+different+respects%2C+without+%E1%BC%80%CE%BD%CF%84%CE%B9%CF%86%CE%AC%CF%83%CE%B5%CE%B9%2Fcontradiction.+The+argument%2C+whereby+he+concludes+this+great+mystery%2C+and+in+the+answering+of+which+he+wishes+us+to+be+exercised%2C+is+of+this+sort%3A+Whatever+things+in+the+altogether+simple+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos+are+indistantly+%28%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%2C+from+each+other%29+united%3B+those+in+that+third%2C+in+which+%28%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%2C+from+each+other%29+they+are+united+and+subsist%2C+are+altogether+present+to+each+other.+But+the+soul+of+Christ+in+the+heavens%2C+and+the+body+of+Christ+on+earth%2C+which+are+naturally+and+locally+most+distant%2C+in+the+perfectly+simple+and+indistant+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos%2C+were+united+%28%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%2C+from+each+other%29.+Therefore%2C+the+soul+of+Christ+in+the+heavens%2C+and+the+body+of+Christ+on+earth%2C+which+are+naturally+and+locally+most+distant%2C+were+altogether+present+to+each+other+in+the+hypostasis+of+the+%CE%BB%CF%8C%CE%B3%CE%BF%CF%85%2FLogos.+And+so+the+body+and+soul+were+able+to+be+separated%2C+although+each+was+everywhere.+Response%3A+No+laborious+exercise+is+needed.+We+deny+the+minor%2C+which+Meisner+was+obliged+clearly+to+prove%2C+not+to+assume+without+demonstration.+Indeed%2C+the+body+and+soul+of+Christ%2C+at+the+time+of+His+death%2C+were+united+to+the+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos%2C+but+were+not+united+with+each+other+%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%3A+seeing+that+they+were+at+an+incredible+distance+from+each+other.+But%2C+says+our+opponent%2C+what+things+are+united+to+a+single%2C+altogether+simple%2C+indivisible%2C+and+indistant+third+thing%3B+those+are+united+and+present+to+each+other+%28%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%29.+Response%3A+If+that+third+altogether+simple+and+indivisible+thing+be+finite%2C+we+grant+what+our+opponent+maintains%3A+but%2C+if+it+be+infinite+and+omnipresent%2C+united+to+which+were+the+body+and+soul+of+Christ+at+the+time+of+His+death%2C+we+do+not+at+all+grant+it.+The+falsity+is+perfectly+evident.+Elijah+and+I+are+united+to+a+third%2C+altogether+simple%2C+indivisible%2C+indistant%2C+namely%2C+God.+But%2C+who+would+say%2C+that+I%2C+existing+on+the+earth%2C+am+present+by+substantial+proximity+to+Elijah%2C+existing%2C+not+on+earth%2C+but+in+heaven%3F+Therefore%2C+the+mystery+vanishes.+That+personal+presence%2C+whereby+body+and+soul%2C+being+locally+separated+by+the+whole+heaven%2C+were+nevertheless+altogether+present+to+each+other+%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%2C+in+the+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos%2C+is+not+a+great+mystery%2C+but+a+great+and+contradictory+fiction.+We+turn+that+argument+back+upon+our+opponents.+What+in+substance+is+everywhere%2C+that+is+absent+from+no+place+with+respect+to+essence+or+substance.+But+the+soul+of+Christ%2C+in+the+death+of+Christ%2C+because+of+the+union+with+the+%CE%BB%CF%8C%CE%B3%E1%BF%B3%2FLogos+%28according+to+the+Lutheran+hypothesis%29%2C+in+substance+was+everwhere.+Therefore%2C+the+soul+of+Christ+was+absent+from+no+place+with+respect+to+its+substance%3A+and+by+consequence%2C+it+was+also+in+its+body%2C+and+was+united+to+it+%E1%BC%80%CE%B4%CE%B9%CE%B1%CF%83%CF%84%CE%AC%CF%84%CF%89%CF%82%2C+without+distance%2C+and+so+was+not+separated+from+it%3A+which+the+Suebi+maintain%3A+but+Meisner+with+other+Lutherans+does+not+maintain+it%2C+against+the+Lutheran+hypotheses.%E2%80%9D%0A%0A%E2%80%94+Marcus+F.+Wendelin%2C+Christian+Theology+3rd+ed.+%281634%29%2C+Species+of+the+Office+of+Christ%2C+pt.+2&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F2cba7293f0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/2cba7293f0.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christ/the-human-and-divine-natures-of-christ/#:~:text=The%20L

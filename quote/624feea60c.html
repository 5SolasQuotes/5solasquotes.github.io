<main class="wrap"><figure class="quote" id="q-624feea60c" data-kw="">
<blockquote><p>…this exercise of discipline for restraining of scandals is to be subservient to the preaching of the Word: which is the main and great edifying ordinance; Therefore discipline would be ordered so as it may not mar, but further that. In reference to which, these things are to be adverted to: 1. That no censure would be blindly or implicitly made use of, but both in reference to the party, and others, there would be instruction, exhortation, conviction, etc. by the Word, going before, or alongst with the same. In which respect (though improperly) censures may be some way looked upon as sacraments in a large sense in these particular cases, because there is in them both some signifying and confirming use; They being considered with respect to the end wherefore they were appointed.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e3b73937d5" data-kw="">
<blockquote><p>There is a twofold judgement which discerns and judges of Faith. The one absolute, whereby the most high God, whose supreme Authority alone, binds us to believe whatsoever He propounds to be believed by us, has in his written Word pronounced, declared and established what He would have us to believe concerning Himself, or his worship. The other [is] limited and subordinate: which is either public or private. That which is public, is either ordinary or extraordinary. The Ministerial or subordinate public judgement, which I call ordinary, is the judgement of every pastor or doctor, who by reason of his public vocation and office, ought by his public ministry to direct and instruct the judgments of other men in matters of Faith. Which judgement of pastors and doctors is limited and restricted to the plain warrants and testimonies of Holy Scripture (Junius, Cont. 1, bk. 3, ch. 4, note 17), they themselves being only the ambassadors of the judge, to preach and publish the sentence which He has established, so that a pastor is not properly judex [a judge] but index [an informer]. The subordinate public judgment, which is extraordinary, is the judgement of a council, assembled for the more public and effectual establishment and declaration of one or more points of faith and heads of Christian doctrine, and that in opposition to all contrary heresy, or error, which is broached and set a foot in the Church. (M. Ant. De Dom. de Rep. Eccl., bk. 7, ch. 3, n. 32) From which council, no Christian man who is learned in the Scriptures may be excluded, but ought to be admitted to utter his judgement in the same. For in the indagation [investigation] or searching out of a matter of faith, they are not the persons of men which give authority to their sayings, but the reasons and documents which every one brings for his judgment. The subordinate judgement, which I call private, is the judgment of discretion (Davenant, Of the Judge of Controversies, ch. 25; Junius, as above), whereby every Christian, for the certain information of his own mind and the satisfaction of his own conscience, may and ought to try and examine, as well the decrees of councils as the doctrines of particular pastors, and insofar to receive and believe the same as he understands them to agree with the Scriptures.</p></blockquote>

</figure><figure class="quote" id="q-f01b2e689e" data-kw="">
<blockquote><p>If then nothing be good [simply] because rulers command it; but, by the contrary, they do lawfully command it because it is good. The Church’s power is one and the same in things indifferent, and necessary in matters of doctrine, discipline and order; for in both, the Church does not create goodness, but does by the light of the Word, or (which is a part of the Word) by nature’s light, find preexistent goodness in doctrine, discipline, and matters of order. Therefore, will of authority, as will, has no power to dispose of the east circumstance of time, place or person; but the Church’s power is ministerial and determined to what is good, expedient and convenient.</p></blockquote>

<blockquote><p>That which wicked men bind on earth is not bound in heaven… Excommunication, persecution, and imprisonment have generally been favorite weapons with ecclesiastical tyrants. Unable, like the Pharisees, to answer arguments, they have resorted to violence and injustice. Let the child of God console himself with the thought that there is a true Church out of which no man can cast him, and a Church-membership which no earthly power can take away. He only is blessed whom Christ calls blessed; and he only is accursed whom Christ shall pronounce accursed at the last day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-c-ryle.html">J. C. Ryle</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Expository Thoughts on the Gospels, on John ch. 9</cite>, verses 26-41</span></figcaption>

<blockquote><p>…we do not deny that faith can be called in a certain sense implicit, both in children and the uninstructed (who have only an obscure knowledge) and in the more advanced (in whom the light is always mixed with darkness…)… But the question is whether faith in its conception includes knowledge; if not a full, still a true and certain knowledge in its own order. …the question is whether that assent is blind, destitute of all knowledge, so that it may be better defined by ignorance and to believe is to assent to things unknown [or not].” – Institutes 3.565 Even children are to ‘obey’ their ‘parents in the Lord’ (Eph. 6:1), that is, in consistency with their knowledge of right and wrong and in faith to God. It should be apparent that if subordinates have, or should have, a rational trust in their superiors, the less the superiors need to pedantically instruct their subordinates in the reasons for their rules. However, if a subordinate has a grounded case of conscience against the command of the superior, and it is not an emergency (where the superior must act for the subordinate’s good regardless), then the superior(s) ought to make clear sufficient reasons as to the moral necessity of the command so as to persuade their conscience if at all possible. A rule (such as that of this webpage) may often be gone without as long as it may be appealed to and bind when necessary. To put it another way, it is not wrong to serve authorities or men, even though we do not have a full and explicit persuasion of the complete moral bindingness of their dictates from God’s natural and moral laws, if we are able, perhaps for other reasons, to serve them in the Lord. That is to say, passive obedience, where one is not fully convinced of the inherent bindingness of the precept itself, is acceptable if one is able to do it for other godly reasons. Paul said, for instance: 1 Cor. 9:19 “For though I be free from all men, yet have I made myself servant unto all, that I might gain the more.</p></blockquote>

elf servant unto all, that I might gain the more.”

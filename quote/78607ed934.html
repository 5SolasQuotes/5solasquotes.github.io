<main class="wrap"><figure class="quote" id="q-78607ed934" data-kw="">
<blockquote><p>Yet if the miscarriage be so great in the [authorities’] ordering even of these circumstances or in the manner of duties, as shall overthrow the duty itself and be inconsistent with the ends, or bring greater evils upon the Church than our refusing to obey… then… we are not bound to follow… in such a case, but otherwise we are.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Five Disputations of Church-Government &amp; Worship (London, 1659), 5th Disputation</cite>, ch. 12,; p. 461</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-46c286a640" data-kw="">
<blockquote><p>If superiors command that which is above their sphere to command, namely, things not necessary in genere [in their kind], yet if they be not simply evil, subjects may do those things, unless they be evil in their consequence to a higher degree than the not doing of them would be. In this case it is not formal obedience, but they are done for the end’s sake and to avoid evil.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-corbet.html">John Corbet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of Divine Worship, pt. 3, §6 in The Remains of the Reverend &amp; Learned Mr. John Corbet… (d. 1680; London: Thomas Parkhurst, 1684)</cite>, p. 218</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-b50da99f93" data-kw="">
<blockquote><p>To be precise, if we may consider frankly the actual system of virtue which Aristotle proposes, by which alone access to happiness is acquired, we will see that it is an arrogant supposition peddling the mere shadow of virtue, rather than that disposition of mind which comports with the human condition and its dependency on the most high God.</p></blockquote>

</figure><figure class="quote" id="q-260ed823a9" data-kw="">
<blockquote><p>When you accommodate your boss’s unnecessary restrictions at work for the greater good, are you sacrificing God’s divine-right of governance over you and you are guilty of your boss’s errors? Are you divinely obliged to suffer the consequences of getting fired and hazarding your family’s survival every time your company wants you to do something not fully in accord with God-prescribed, right reason?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists (1604; RBO, 2025)</cite>, p. 134</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>
<div class="actions"><button class="copy" data-copy="“When you accommodate your boss’s unnecessary restrictions at work for the greater good, are you sacrificing God’s divine-right of governance over you and you are guilty of your boss’s errors? Are you divinely obliged to suffer the consequences of getting fired and hazarding your family’s survival every time your company wants you to do something not fully in accord with God-prescribed, right reason?”

</figure><figure class="quote" id="q-c14cdac94a" data-kw="">
<blockquote><p>12. The whole law of nature, which was such to innocent man, did necessarily result from the nature of man, as related to God and his fellow-subjects, and as placed in the midst of such a world of objects; and so is legible in rerum natura [in the nature of things]… 13. There are some duties that are founded in the relation of our very rational nature to the holy, perfect nature of God… and some duties that are founded in the relation of our natures one to another, and some from the inseparable, innocent principle of self-love. All these have their necessary original with our natures, by resultancy therefrom… 14. There are some duties of the law of nature founded in natural, but mutable, accidents, relations, moods. These are indispensable duties, while these relations or other accidents remain, which are the foundation of them;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unreasonableness of Infidelity (London: R.W., 1655), An Advertisement Explicatory, pp. x-xi. For the relations of positive laws added into this mix, see Baxter’s larger discussion.</cite></span></figcaption>

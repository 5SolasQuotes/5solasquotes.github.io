<main class="wrap"><figure class="quote" id="q-7964ffdaea" data-kw="">
<blockquote><p>Use 2: It may teach us what to judge of the Seperatists, or Brownists… 1. Because they seperate where Christ keeps fellowship, Rev. 1:18, and that He walks with us, we argue, because He is still pleased to dispense to us the Word of Life, and edifies many souls thereby, and therefore surely Christ has fellowship, and shall man be more pure than his Maker? where Christ vouchsafes fellowship, shall man renounce it? … 2. But they say that our Church consists of a mixed multitude, so was that 2 Chron. 20:13, when Jehoshaphat assembled all Judah before the Lord, there was a mixed multitude (Num. 11:4), and they did it out of fear, and yet it was a true Church, and so is ours, though there be a mixed multitude. And yet this falling off, because it is not from the main doctrine, but from the skirts, and some circumstantials, therefore they do not fall utterly from Christ, but yet it is not possible but they weaken their faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Practical Commentary, or an Exposition with Observations, Reasons, and uses upon the First Epistle General of John (London: Parkhurst, 1658), on 1 Jn. 2:19</cite>, pp. 156-57</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-17b845c796" data-kw="">
<blockquote><p>Bucer’s thought categorized Christian theological truths (of the disputed doctrines of the day) into a hierarchy, the doctrine of justification being of high importance for the Church. As such, difficulties over other doctrines like the Lord’s Supper could be pragmatically defined and resolved so as to preserve the unity that was held in the truth of justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-lugioyo.html">Brian Lugioyo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Martin Bucer’s Doctrine of Justification: Reformation Theology &amp; Early Modern Irenicism (Oxford Univ. Press, 2010) 260 pp. ToC</cite>, p. 4</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“Bucer’s thought categorized Christian theological truths (of the disputed doctrines of the day) into a hierarchy, the doctrine of justification being of high importance for the Church. As such, difficulties over other doctrines like the Lord’s Supper could be pragmatically defined and resolved so as to preserve the unity that was held in the truth of justification.”

</figure><figure class="quote" id="q-9d904176a2" data-kw="">
<blockquote><p>That by giving out themselves in these meetings as the generality of the godly throughout the land, or delegates in a sort from them, they do cast an imputation upon the bulk of the national Church beside, who are against their way, and do not join with them in these courses, as not only wrong in that matter, but as not godly, some very few excepted. Which as we know to be a most false imputation (not many of these, of any rank, who owned the cause from the beginning, going along with them). So it is an evidence of a strange divisive and separating spirit in our Brethren.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-sharp.html">James Sharp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A True Representation of the Rise, Progress &amp; State of the Present Divisions of the Church of Scotland (London, 1657)</cite>, p. 33</span></figcaption>

</figure><figure class="quote" id="q-8ed0b72981" data-kw="">
<blockquote><p>Thus we see where at this day we may find the true Church of God. Now I come to the third question; and that is: At what time a man may with good conscience make separation from a Church. Answer: So long as a Church makes no separation from Christ, we must make no separation from it: and when it separates from Christ, we may also separate from it;</p></blockquote>

</figure><figure class="quote" id="q-620c90814e" data-kw="">
<blockquote><p>the constant and earnest wish of all good men for these hundred years past… that the Protestant Churches which differ one from another about some points of religion, laying aside or at least moderating on both sides their over-tenacious adhering to their own opinions, may now at length be united and made up into one body… we [the reformed and Lutherans] are not at variance about any fundamental point of Christian religion, or such wherein men may not safely be of either opinion without hazarding their salvation… we make no doubt but every man would then readily wish for this much-desired communion, which none ever shunned or refused but out of a kind of religion and conscience, conceiving it unlawful to entertain a communion with any that are not of the same belief and opinion with themselves: so soon as men on both sides shall be wrought off from this superstitious conceit, they will gladly run and rush (as it were) into one another’s arms and embraces… how foul and scandalous a thing, how hurtful to both sides, how dangerous and pernicious to the whole Christian world this Schism is which has hitherto divided and distracted us… seeing we confess that whatsoever is of necessity for salvation to be believed or done by us, it is all clearly and plainly laid down in this Gospel, what hinders why we may not jointly confirm and ratify those articles wherein we both agree? and for those other points about which we differ, we may express them in such words and phrases as the sacred Scriptures afford us…</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

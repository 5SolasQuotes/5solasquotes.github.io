<blockquote><p>2 Q. How many Commandments are there?

2. A. There are ten Commandments which are the sum and substance of all God’s perpetual Law. Deut. 10. 9. Exod. 34. 28.

Are there not ten?

Yes.

And, Are they not the sum and substance of all God’s perpetual Law?

Yes.

And, Hath not every one of them a general meaning and scope, and so encompasseth whatsoever tendeth to that?

Yes.

And, Do they not among them forbid all evil?

Yes.

And, Command all good?

Yes.

And, That in words &amp; thoughts as well as deeds?

Yes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An endeavour of making the principles of Christian religion, namely the Creed, the Ten Commandments, the Lord’s prayer, and the Sacraments, plain and easy tending to the more speedy instruction of the meanest capacities, and weakest memories, and for the making trial also of their understandings, wh</cite>, (3rd edn, London: Thomas Underhill, 1644), p. 24.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2699ea0f28" data-kw="">
<blockquote><p>Under this [Mosaic] Covenant, the natural seed of Abraham bore the face of the Church and state, and God had promised abundance of temporals, and of spiritual, a scantling; But all under the outward administration of the Covenant were not in like manner partakers of the blessings promised in Covenant. For some had their part in temporal blessings only, and the outward ordinances; others were partakers of the spiritual blessings promised. But whatever good thing any of them enjoyed either temporal or spiritual, it was conferred upon them freely according to the Covenant of Grace, and not for the dignity of their works. It is true, the promise is conditional, if they obey, they shall reap the good things of the Land: but obedience was not a causal condition, why they should inherit the Land… So that herein there appears no intexture of the Covenant of works with the Covenant of Grace, nor any moderation of the Law to the strength and power of nature for the obtaining of outward blessings. But rather that God out of his abundant goodness is pleased freely to confer outward blessings promised in the Covenant upon some that did not cleave to him unfeignedly [purely], that he might make good his promise unto the spiritual seed, which by word and oath he had confirmed unto the Fathers.</p></blockquote>

<blockquote><p>XXIII. Hence is easily gathered the reason why God wished to recall that [natural] law by Moses, to deliver it to his people viva voce, and proclaimed it in a solemn manner, committing it to writing and comprehending it in the decalogue. For although in upright nature there was no need of such a promulgation, still (after sin) so great was the blindness of mind, such the perversity of will and disturbance of the affections that only remains of this law survived in the hearts of all (like rubbed pictures of the same, which on that account ought to be retouched by the voice and hand of God as by a new brush).

Hence there were weighty causes for that promulgation. (1) That the natural law might be confirmed more and more, lest the remaining traces might gradually be obliterated by the vanity and wickedness of men or be considered as their uncertain and doubtful opinions. (2) That it might be corrected in those things in which it had been corrupted by the fall. (3) That it might be supplemented in those things which were wanting in it and had been obliterated. (4) That the necessity of a mediator might be understood and a desire for him to be enkindled more strongly every day on account of the weakness of man and of the law in the flesh (Rom. 3:20; 8:3; 10:4). (5) That the people of Israel might be joined by this law into one republic and be separated from all other nations (Dt. 4:6, 7; Ps. 147:19, 20; Rom. 9:4).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 11.1.23.</span></figcaption>

A%2F%2F5solasquotes.github.io%2Fquote%2Fcd6aeca99e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cd6aeca99e.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2019/07/21/francis-turretin-on-the-promulgation-of-the-law-of-nature-in-the-decalogue/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-a8a675fa03" data-kw="">
<blockquote><p>First for the word Testament, it doth signify the last Will of a man which he makes before his death, and leaves behind him either in word or writing, testified by seals and witnesses; By virtue of which Will he doth dispose his lands and possessions which he hath purchased, and all his goods which he hath gathered in his life time, and doth bequeath them as he himself will, and to whom he thinks fit, either freely or with condition, to have and hold them after his death, and not before; This is the true and proper meaning of the Word, and thus it is used by the Apostle, Hebr. 9. 16. And because the Apostle there calls the Covenant Christ’s Testament, and also elsewhere in his Epistles wheresoever he doth speak of the Old and New Covenant, that is, of the Covenant of the Law and of the Gospel, doth use the Greek word διαθήκη, even the same which there he useth for the last Will and Testament of a Testator, whereupon it comes to passe, that the Books of the Law and the Prophets, before Christ, and the Covenant in them are called the New Testament, and that very fitly in some respect, I mean in respect of Christ the Mediator.

For the truth is, that the Covenant of Grace more obscurely revealed to the Fathers in the writings of the Law and Prophets, and more plainly in the Gospel and writings of the Apostles, was never in force, neither could be ratified but by the death of Christ. It was before his coming sealed by his Blood in Types and Figures; and at his Death in his Flesh it was fully sealed and ratified by his very Blood it self actually, and indeed shed for our sins, and in this respect it may be fitly called the Testament. Because as a Testament is not in force till the Testator be dead, and where a Testament is, there the death of the Testator must come between to ratify it; So it is with the Covenant of Grace, and the promises therein made unto us.

Christ hath performed and purchased all things necessary for us, &amp; doth freely give to us himself, his righteousness, and all his treasures, as a man gives his Lands and Goods in his last Will, but they cannot be of force to bring us to heaven, till his death come between as a satisfaction for sin also; It is as necessary that Justice should be satisfied for sin by his Death, as righteousness of life performed, and salvation purchased by him for us. Secondly, as a man doth seal his Testament when he seeth or imagineth that his death is at hand; So Christ at his last Supper, by instituting the Sacrament of his Body and Blood, and by the outward Signs and Seales therein contained, did seal to his Church the Covenant of Grace.

Thus in respect of CHRIST the Mediator, God and Man, the Covenant of Grace, and the writings, Old and New, wherein it is contained, are called Testaments. But in respect of God the Father, and in respect of God, considered simply, or as the Maker of the Covenant with man, and the party between whom and man the Covenant is made; the Covenant and the Writing, Old and New, wherein it is comprehended, can in no case be called a Testament, because a Testament is of no force without the Testator’s death. But God the Father never died, nor can die, neither God simply considered, nor God the Maker of the Covenant with Man, and the other party in it which is opposed to Man. Only Christ died as he was Mediator, God and Man, and as he was made a partner with Man, and stood on his side in the Covenant, and as he is the Testator, and free giver of his Word in the Old and New Testament, and of his graces and gifts therein promised; so they are called Testaments, and in no other respect at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-walker.html">George Walker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The manifold wisdom of God In the divers dispensation of grace by Jesus Christ, In the Old New Testament. In the covenant of faith. In the covenant of works. Their agreement and difference</cite>, (London: John Bartlet, 1641), pp 11-15.</span></figcaption>

— George Walker, The manifold wisdom of God In the divers dispensation of grace by Jesus Christ, In the Old New Testament. In the covenant of faith. In the covenant of works. Their agreement and difference, (London: John Bartlet, 1641), pp 11-15.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst+for+the+word+Testament%2C+it+doth+signify+the+last+Will+of+a+man+which+he+makes+before+his+death%2C+and+leaves+behind+him+either+in+word+or+writing%2C+testified+by+seals+and+witnesses%3B+By+virtue+of+which+Will+he+doth+dispose+his+lands+and+possessions+which+he+hath+purchased%2C+and+all+his+goods+which+he+hath+gathered+in+his+life+time%2C+and+doth+bequeath+them+as+he+himself+will%2C+and+to+whom+he+thinks+fit%2C+either+freely+or+with+condition%2C+to+have+and+hold+them+after+his+death%2C+and+not+before%3B+This+is+the+true+and+proper+meaning+of+the+Word%2C+and+thus+it+is+used+by+the+Apostle%2C+Hebr.+9.+16.+And+because+the+Apostle+there+calls+the+Covenant+Christ%E2%80%99s+Testament%2C+and+also+elsewhere+in+his+Epistles+wheresoever+he+doth+speak+of+the+Old+and+New+Covenant%2C+that+is%2C+of+the+Covenant+of+the+Law+and+of+the+Gospel%2C+doth+use+the+Greek+word+%CE%B4%CE%B9%CE%B1%CE%B8%CE%AE%CE%BA%CE%B7%2C+even+the+same+which+there+he+useth+for+the+last+Will+and+Testament+of+a+Testator%2C+whereupon+it+comes+to+passe%2C+that+the+Books+of+the+Law+and+the+Prophets%2C+before+Christ%2C+and+the+Covenant+in+them+are+called+the+New+Testament%2C+and+that+very+fitly+in+some+respect%2C+I+mean+in+respect+of+Christ+the+Mediator.%0A%0AFor+the+truth+is%2C+that+the+Covenant+of+Grace+more+obscurely+revealed+to+the+Fathers+in+the+writings+of+the+Law+and+Prophets%2C+and+more+plainly+in+the+Gospel+and+writings+of+the+Apostles%2C+was+never+in+force%2C+neither+could+be+ratified+but+by+the+death+of+Christ.+It+was+before+his+coming+sealed+by+his+Blood+in+Types+and+Figures%3B+and+at+his+Death+in+his+Flesh+it+was+fully+sealed+and+ratified+by+his+very+Blood+it+self+actually%2C+and+indeed+shed+for+our+sins%2C+and+in+this+respect+it+may+be+fitly+called+the+Testament.+Because+as+a+Testament+is+not+in+force+till+the+Testator+be+dead%2C+and+where+a+Testament+is%2C+there+the+death+of+the+Testator+must+come+between+to+ratify+it%3B+So+it+is+with+the+Covenant+of+Grace%2C+and+the+promises+therein+made+unto+us.%0A%0AChrist+hath+performed+and+purchased+all+things+necessary+for+us%2C+%26+doth+freely+give+to+us+himself%2C+his+righteousness%2C+and+all+his+treasures%2C+as+a+man+gives+his+Lands+and+Goods+in+his+last+Will%2C+but+they+cannot+be+of+force+to+bring+us+to+heaven%2C+till+his+death+come+between+as+a+satisfaction+for+sin+also%3B+It+is+as+necessary+that+Justice+should+be+satisfied+for+sin+by+his+Death%2C+as+righteousness+of+life+performed%2C+and+salvation+purchased+by+him+for+us.+Secondly%2C+as+a+man+doth+seal+his+Testament+when+he+seeth+or+imagineth+that+his+death+is+at+hand%3B+So+Christ+at+his+last+Supper%2C+by+instituting+the+Sacrament+of+his+Body+and+Blood%2C+and+by+the+outward+Signs+and+Seales+therein+contained%2C+did+seal+to+his+Church+the+Covenant+of+Grace.%0A%0AThus+in+respect+of+CHRIST+the+Mediator%2C+God+and+Man%2C+the+Covenant+of+Grace%2C+and+the+writings%2C+Old+and+New%2C+wherein+it+is+contained%2C+are+called+Testaments.+But+in+respect+of+God+the+Father%2C+and+in+respect+of+God%2C+considered+simply%2C+or+as+the+Maker+of+the+Covenant+with+man%2C+and+the+party+between+whom+and+man+the+Covenant+is+made%3B+the+Covenant+and+the+Writing%2C+Old+and+New%2C+wherein+it+is+comprehended%2C+can+in+no+case+be+called+a+Testament%2C+because+a+Testament+is+of+no+force+without+the+Testator%E2%80%99s+death.+But+God+the+Father+never+died%2C+nor+can+die%2C+neither+God+simply+considered%2C+nor+God+the+Maker+of+the+Covenant+with+Man%2C+and+the+other+party+in+it+which+is+opposed+to+Man.+Only+Christ+died+as+he+was+Mediator%2C+God+and+Man%2C+and+as+he+was+made+a+partner+with+Man%2C+and+stood+on+his+side+in+the+Covenant%2C+and+as+he+is+the+Testator%2C+and+free+giver+of+his+Word+in+the+Old+and+New+Testament%2C+and+of+his+graces+and+gifts+therein+promised%3B+so+they+are+called+Testaments%2C+and+in+no+other+respect+at+all.%E2%80%9D%0A%0A%E2%80%94+George+Walker%2C+The+manifold+wisdom+of+God+In+the+divers+dispensation+of+grace+by+Jesus+Christ%2C+In+the+Old+New+Testament.+In+the+covenant+of+faith.+In+the+covenant+of+works.+Their+agreement+and+difference%2C+%28London%3A+John+Bartlet%2C+1641%29%2C+pp+11-15.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa8a675fa03.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a8a675fa03.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/02/10/george-walker-on-the-covenant-as-the-testament-of-christ/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-a7d6993795" data-kw="">
<blockquote><p>First here observe, that the Law of God is made perpetual and unchangeable: If any man ask how this can be, seeing the Apostle saith, The Law is changed?

Answer. The Law is threefold; Ceremonial, Judicial, and Moral, as hath been said: now that place is principally to be understood of the Ceremonial law, which indeed is abrogated, in regard of the observation of it in God’s worship; but in the scope and substance of it, which is Christ crucified, with his benefits, whom it shadowed out, it remaineth still, and is now more plain then ever it was.

As for the Judicial law, though it be abrogated unto us, so far forth as it was peculiar to the Jews; yet, as it agrees with common equity, and serves directly to establish the precepts of the Moral law, it is perpetual. If it be said, that Christ changed the Moral law, in changing the Sabbath day, from the seventh day to the eight: I answer, Christ did so indeed by his Apostles, but that is no change of the substance, but of the ceremony of the Sabbath: for the substance of that law is, the enjoining of a seventh day’s rest unto the Lord. Now though the seventh day from the creation be not kept, yet a seventh day is kept still.

If it be further said, that the Law it self is abrogated; for that every one that breaketh the Law is not accursed, according to the sentence thereof, Deut. 27. 26.

Answer. We must know that the Law is but one part of God’s word, and the Gospel another, revealing another part of Gods will, besides that which the Law made known; for it adds a qualification to the Law, moderating the rigour thereof, after this manner: He is accursed (saith the Law) that faileth in any commandment, except (saith the Gospel) he be reconciled again in Christ, and in him have the pardon of his transgressions. And yet the Moral law remains for ever a rule of obedience to every child of God, though he be not bound to bring the same obedience for his justification before God.</p></blockquote>

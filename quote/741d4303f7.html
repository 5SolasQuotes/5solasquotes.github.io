<main class="wrap"><figure class="quote" id="q-741d4303f7" data-kw="">
<blockquote><p>THE Anabaptists wresting scripture to serve their madness, among other foul errors, have this: that all things ought to be common, they image man to be of that purity that he was before the fall, that is, clean without sin, or that (if he will) he may so be: and that as when there was no sin, all things were common, so they ought now to be.

But this mingling of the state of man before the fall, and of him after the fall much deceiveth them. For by the fall, and ever after the fall, this corruptible flesh of man is clogged with sin, and shall never be rid of sin, as long as it is in this corrupt world, but shall be always disposed and prone to do that is evil. And therefore as one means to be the rather encumbered of the heap of sin, God ordained that man should get his living by the sweat of his brows: and that he should be the more forced to labour, the distinction of things and property (mine, and thine) was (contrary to Plato’s opinion) ordained, as appeareth by these two laws: Thou shalt not steal: Thou shall not covet thy neighbour’s wife, nor his servant, nor his maid, nor his ox, nor his Ass, nor any thing that is his.

Afterward indeed scripture speaketh of communion of things, not that they ought so to be (for so scripture should be directly against scripture) but that there was such charity among the people, that of their own free will, they gave and sold all they had, to relieve the misery of their poor brethren: who for impotency, or for multitude of children, were not with their labour able to get sufficient to relieve their necessity. Nor of this so given might every man take as much as him lusted, but to every one (according to his necessity) sufficient was distributed. So that it stood in the liberality of the giver, and not in the liberty of the taker.

But there be some in these days, not of the meanest or poorest sort, but of the chiefest and richest: that is, many wicked governors and rulers, who in this error excel the common Anabaptists. For the common Anabaptists do not only take other men’s goods as common, but are content to let their own also be common, which hath some smack of Charity: for they themselves do none other, but that they themselves are content to suffer.

But the evil governors and rulers will have all that their subjects have, common to themselves, but they themselves will depart with nothing, but where they ought not: no, not so much as pay for those things, that in words they pretend to buy of their subjects, nor pay those poor men their wages, whom they force to labour and toil in their works. But the manner of coming thereby is so diverse, that it maketh the justness of their doings much suspected. For some do it under pretence to do the people good: some by crafty and subtle means, colour their doings: and some of right (but without right) claim them for their own.

Of the first sort be those, that put great taxes and impositions on drink for forasmuch as the people with overmuch drinking become drunkards (and so sin against God) they would seme by making them pay as much or more to them as the drink is worthy, they should force them the rather to abstain from overmuch drinking, and so from sin. But in this it may appear, they seek not abstinence from sin, and the wealth of the people, but their own private profit. For if they had their eye to God’s glory and the benefit of the people, and the vice to be taken clean away: they would not crop off the branches of the tree, and let the root grow, but they would root up the root that it should no more grow. And so of this sort do it to this end, to make things better cheap. For (think they) if there were but little money, then must things be sold better cheap. As though it lay in them to make plenty and scarcity, and as though thone were not the bounteous benefit of God sent to them that fear and love him: and the other his plague justly poured on them that hate him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ponet.html">John Ponet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A short treatise of politick power and of the true obedience which subjects owe to kings and other civil governors, with an exhortation to all true natural English men</cite>, (Strasbourg: The heirs of W. Köpfel, 1556), unpaginated.</span></figcaption>

<blockquote><p>VI. It is asked, must theology be taught according to a certain method? As an example of excess, the [medieval] Scholastics, according to their philosophical theology, loved the philosophical method of Aristotle – whether it was his analytic or synthetic method – to the point of distraction.

As an example of deficiency, the Anabaptists, enthusiasts, and fanactics, due to ignorance and hatred of philosophy, reckon that all method should be eliminated from theological matters. One after another of our Reformed theologians, in proving their own points, opposed such persons.

The Reformed, against the Anabaptists and enthusiasts, demand a method, but not, precisely speaking, a philosophical one. They demand a natural method, that is, a method that is suitable for theological matters, and for assisting the judgment and strengthening the memory – however much that method might otherwise depend on the discretion of the writer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology Volume 1: Prolegomena</cite>, trans. Todd M. Rester, ed. Joel R. Beeke (1699; Grand Rapids MI: Reformation Heritage Books, 2018), 1.1.1.VI, p. 70.</span></figcaption>

<blockquote><p>13. Our indulgence ought to extend much farther in tolerating imperfection of conduct. Here there is great danger of falling, and Satan employs all his machinations to ensnare us. For there always have been persons who, imbued with a false persuasion of absolute holiness, as if they had already become a kind of aerial spirits, spurn the society of all in whom they see that something human still remains. Such of old were the Cathari and the Donatists, who were similarly infatuated Such in the present day are some of the Anabaptists, who would be thought to have made superior progress. Others, again, sin this respect, not so much from that insane pride as from inconsiderate zeal. Seeing that among those to whom the gospel is preached, the fruit produced is not in accordance with the doctrine, they forthwith conclude that there no church exists.</p></blockquote>

<blockquote><p>Anno, 1522. Did arise in Saxony Nicholas Stork, who boasted of dreams and visions and rejected the Scripture as being a carnal and literal rule. Antinomians call it carnal, literal, and legal. From him and others arose Thomas Muntzer, about anno 1524, who styled himself “Thomas Muntzer, the servant of God, with the sword of Gideon against the ungodly.” This man, being hungry for glory, hunted for Luther’s name to his new designs but not obtaining it, said but [unclear] Antichrist: that Luther’s carnal and literal gospel was worse than the pope and therefore cried down books and the letter of Scripture and said the Spirit was the leader and rule to believers.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Anno, 1522. Did arise in Saxony Nicholas Stork, who boasted of dreams and visions and rejected the Scripture as being a carnal and literal rule. Antinomians call it carnal, literal, and legal. From him and others arose Thomas Muntzer, about anno 1524, who styled himself “Thomas Muntzer, the servant of God, with the sword of Gideon against the ungodly.” This man, being hungry for glory, hunted for Luther’s name to his new designs but not obtaining it, said but [unclear] Antichrist: that Luther’s carnal and literal gospel was worse than the pope and therefore cried down books and the letter of Scripture and said the Spirit was the leader and rule to believers.”

</figure><figure class="quote" id="q-a5062932b0" data-kw="">
<blockquote><p>If some admirer of the sky and the stars – and what can one think of that is more beautiful than these bodies? – wanted to remove water from the nature of things, because it is no match for the brightness of the stars, would we not say that he is mad? If someone, out of admiration for the teachings of religion, ordered us to remove from our lives all laws and precepts of the state and all links of domestic life, would not all sane men judge it necessary for him to be suppressed by force and by the use of weapons?

And in these recent years we have seen some who were practising theology in an unholy way, madmen with fanatical opinions, punished for their errors. For you will remember Müntzer and the Anabaptists and other monsters of that kind. Consider those mad in the same way, who disturb the chorus and the harmony of the arts by neglect of, and contempt for, the lower arts. Therefore, just as when you think of the elements of writing you believe that the entire alphabet is necessary for discourse, so you will consider all the disciplines that are taught in the schools necessary for life.

For only he can have the right feelings about the arts, who, when he has noticed their order, understands that each art has been devised because of its certain usefulness. I have said this to remind young men of it, many of whom we see rushing unrestrainedly towards the higher disciplines, not only to their own detriment, but also to that of the state. For your studies do not concern only you, but also the state.

And you ought to keep in view the purpose of your studies, and decide that they are provided for giving of advice for the state, for teaching in the churches and for upholding the doctrine of religion. You will not be able to excel in any of those without perfect doctrine, and perfect doctrine is not granted to anyone without the lower disciplines.</p></blockquote>

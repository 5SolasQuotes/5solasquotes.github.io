</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-939396c332" data-kw="Infallibility of the church">
<blockquote><p>When they deny that the Church can err, their end and meaning are to this effect: Since the Church is governed by the Spirit of God, she can walk safely without the word; in whatever direction she moves, she cannot think or speak anything but the truth, and hence, if she determines anything without or beside the word of God, it must be regarded in no other light than if it were a divine oracle. If we grant the first point--viz. that the Church cannot err in things necessary to salvation--our meaning is, that she cannot err, because she has altogether discarded her own wisdom, and submits to the teaching of the Holy Spirit through the word of God. Here then is the difference. They place the authority of the Church without the word of God; we annex it to the word, and allow it not to be separated from it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.8.13</span></figcaption>

</figure><figure class="quote" id="q-c93bf87ff0" data-kw="">
<blockquote><p>As Christ is the only sovereign Ruler of the Church, His word is the only word that is law in the absolute sense. Consequently, all despotic power is contraband in the Church. There is no ruling power independent of Christ. The Pope of Rome stands condemned in that he, while professing to be Christ&#x27;s vicar on earth, virtually supplants Christ and supersedes His word by human innovations. He not only places tradition on an equal footing with Scripture, but also claims to be the infallible interpreter of both when speaking ex cathedra in matters of faith and morals.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, Part Five, The Doctrine of the Church, ch. III (Government of the Church)</span></figcaption>

</figure><figure class="quote" id="q-da2a25cf96" data-kw="">
<blockquote><p>We should, in our own churches, keep to apostolic precedent, and follow the rule of Christ in all things. No venerable name is sufficient authority for going aside from Holy Scripture. &quot;To the law and to the testimony;&quot; if a doctrine or a ceremony is not there, it is nowhere for you and for me. Our sole authority is the Word of the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/c-h-spurgeon.html">C. H. Spurgeon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An All Around Ministry</cite>, ch. 12, The Minister in These Times, pp. 404–405</span></figcaption>

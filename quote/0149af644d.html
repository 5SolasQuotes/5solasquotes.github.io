<blockquote><p>It is an untruth which [the Romanist] Raphael de la Torres, with other schoolmen say (tome •, in 22, question 81, article 4, the only disputation), that with the same religion by which we honor holy men, we honour God, upon this reason, because holiness in them is a participation of the divine nature; therefore God must be the intrinsical end and formal reason for which we honor the saints. For holiness in saints is a participation of the divine nature, but it is a temporary and a created participation; it is not the same very holiness that is in God, but [rather is] the created effect thereof: and so the love I bear to any creature, because there is somewhat of God in every creature, and the love to our neighbor, commanded in the Second Table of the Law, should be the love of God commanded in the First Table of the Law. 2. When I bow to the gray-haired and to the king; I then do an act of obedience to the Fifth Commandment: No man can say that when I bow to the king or to a holy man that I am then bowing to the God of heaven and worshipping God: No acts terminated upon saints, living or dead, are acts of worshipping God; yea, reverencing of the ordinances of God, as the delighting in, or trembling at the Word, are not properly acts of adoring God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) | Introduction, section 6, pp. 83-4</span></figcaption>

<blockquote><p>But even according to what was said above (A. 2), that these names signify the divine substance, although in an imperfect manner, it is also clear from what has been said (AA. 1, 2) that they have diverse meanings. For the idea signified by the name is the conception in the intellect of the thing signified by the name. But our intellect, since it knows God from creatures, in order to understand God, forms conceptions proportional to the perfections flowing from God to creatures, which perfections pre-exist in God unitedly and simply, whereas in creatures they are received and divided and multiplied. As therefore, to the different perfections of creatures, there corresponds one simple principle represented by different perfections of creatures in a various and manifold manner, so also to the various and multiplied conceptions of our intellect, there corresponds one altogether simple principle, according to these conceptions, imperfectly understood. Therefore although the names applied to God signify one thing, still because they signify that under many and different aspects, they are not synonymous.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 13 | art. 4, I answer that</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-cf82981ed3" data-kw="">
<blockquote><p>VII. II. An adjunct of the world is its goodness and perfection, by which the world is conformable to the divine will, and consists of all its parts. It is therefore perfect, not simply and absolutely, in which sense only God is good and perfect, Mk. 1018; but in a certain respect and in its own kind, because nothing is wanting in it which belongs to the world from the intention of the Creator. Gen. 1:31, “all things that God had made were very good.” Ps. 104:24 “how magnificent are your works, O Lord, you have made all things in wisdom: the earth is full of your possessions.” 1 Tim. 4:4, “Every creature of God is good.” cf. Ps. 8. And this is shown both by the order of the parts of the world, and by their varieties and integrity: which David praises in the whole of Ps. 104. Those things which seem viler and more imperfect are only such separately from the whole and comparatively, since they too were wisely and well made, and contribute to the perfection of the universe. To that which is wont to be asked: Whether God could have made the world more perfect; it must be said: The species of beings could indeed have been made accidentally more perfect, because their qualities and endowments can be increased, and they admit of more and less; yet they could not have been made essentially more perfect, their essences remaining safe and unchanged, because species are like numbers, to which if a unit is added or subtracted, the numbers are changed. If, therefore, God were to add an essential perfection to a certain species, that species would be changed, and would not remain such a species. Meanwhile, God could have produced other species, more perfect than those which He actually produced; since the power of God is infinite, and not exhausted by the production of the creatures actually existing in the world. It can also be said that God can make something better, not adverbially, because He made all things in the best way, but adjectivally, because He can make good things better and increase their accidental goodness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), ch. 2, On Creation, p. 20 trans. AI Latin</span></figcaption>

</figure><figure class="quote" id="q-0a0784f1ca" data-kw="">
<blockquote><p>Third, it is shown by the relation of effects to their cause. For effects proceed from the agent that causes them, in so far as they pre-exist in the agent; since every agent produces its like. Now effects pre-exist in their cause after the mode of the cause. Wherefore since the Divine Being is His own intellect, effects pre-exist in Him after the mode of intellect, and therefore proceed from Him after the same mode. Consequently, they proceed from Him after the mode of will, for His inclination to put in act what His intellect has conceived appertains to the will. Therefore the will of God is the cause of things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 19 | art. 4, I answer that</span></figcaption>

<blockquote><p>1st Conclusion. The relative expression of God which is in the works of God, is no formal ground of any adoration of the creatures.

1. Because adoration upon this ground, though the creatures, the host of heaven be excellent, is forbidden, Dt. 4:19.

2. [If it were the case, then] Not only images (which cannot represent God) and the sacraments, but all the creatures, even, rats, mice, flies, frogs, worms, Judas and wicked men, yea, and devils are to be worshipped, because all things having being are shadows and footsteps of God, their cause, first author and last end, Ps. 19:1; 103:22; Rom. 1:19-20; Acts 17:27-28; Prov. 16:4; Rev. 4:11; Rom. 11:36-37.

3. Because God is really, and by the diffusion of his blessed essence, present in all creatures, it follows not that we should adore them: The Formalists upon this ground, that Christ is really present in the sacrament, though the manner we know not, think that Christ should be adored in the sacrament, according to that, Verbum audimus, motum sentimus, modum nescimus. But if this be good logic, because we know not the way of the Spirit and how the bones grow in a woman with child, Eccl. 11:5, and God, where he works, is present by the immediation of essence and power, though we know not the way of his presence, we are to adore the soul of man and the bones of a young child in a woman’s belly; and though they should say that God-man Christ is in a more powerful and efficacious manner present in the sacrament than in the works of nature; yet should it follow that God is to be worshipped in the works of nature also, for magis et minus non variant speciem [greater or less does not vary the species]; for then we could not conclude any thing but this: Though there be not so real a ground of adoring lice and frogs as adoring of the sacrament, yet there is a ground, seeing God is, in the reality of his blessed essence, present in all creatures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (London, 1646) | section 2, p. 151, ch. 1, Question 5</span></figcaption>

1. Because adoration upon this ground, though the creatures, the host of heaven be excellent, is forbidden, Dt. 4:19.

2. [If it were the case, then] Not only images (which cannot represent God) and the sacraments, but all the creatures, even, rats, mice, flies, frogs, worms, Judas and wicked men, yea, and devils are to be worshipped, because all things having being are shadows and footsteps of God, their cause, first author and last end, Ps. 19:1; 103:22; Rom. 1:19-20; Acts 17:27-28; Prov. 16:4; Rev. 4:11; Rom. 11:36-37.

3. Because God is really, and by the diffusion of his blessed essence, present in all creatures, it follows not that we should adore them: The Formalists upon this ground, that Christ is really present in the sacrament, though the manner we know not, think that Christ should be adored in the sacrament, according to that, Verbum audimus, motum sentimus, modum nescimus. But if this be good logic, because we know not the way of the Spirit and how the bones grow in a woman with child, Eccl. 11:5, and God, where he works, is present by the immediation of essence and power, though we know not the way of his presence, we are to adore the soul of man and the bones of a young child in a woman’s belly; and though they should say that God-man Christ is in a more powerful and efficacious manner present in the sacrament than in the works of nature; yet should it follow that God is to be worshipped in the works of nature also, for magis et minus non variant speciem [greater or less does not vary the species]; for then we could not conclude any thing but this: Though there be not so real a ground of adoring lice and frogs as adoring of the sacrament, yet there is a ground, seeing God is, in the reality of his blessed essence, present in all creatures.”

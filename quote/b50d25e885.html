<main class="wrap"><figure class="quote" id="q-b50d25e885" data-kw="">
<blockquote><p>But what say you of the Greek Translation of the Old Testament, commonly called the Septuagint, approved by the Apostles themselves?

The same that we say of other Translations. For although the Apostles used that Translation, which was commonly received and read among the Gentiles and Jews that dwelt amongst them, where it differed not in sense from the true Hebrew: yet where it differed from it, they left it; as by many Examples may be confirmed, (Vide Hieronym. Prolog. in Mat.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A body of divinity: or, the sum and substance of Christian religion</cite>, ed. Michael Nevarr (1648; Herndon VA: Solid Ground Christian Books, 2007), p. 20.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a065e90440" data-kw="">
<blockquote><p>For seeing the Sabbath day is the school day, the fair day, the market day, the feeding day of the soul, when men purely knowing the use of it, separate it wholly from other days, they shall see how they may recover themselves from sins already past, arm themselves against sin to come, grow in knowledge, increase in faith, and how much they shall be strengthened in the inner man.

Wherefore in the book of God, when the Lord will urge the observation of the whole law, he often doth it under this one word of keeping the Sabbath. Again, when the Prophets sharply rebuke the people for their sins, they particularly lay before them, how the Sabbaths of the Lord are broken.

And to speak the truth, how can a man lie long in the liking of sin, who embraceth this doctrine in conscience, who willingly would have his sins discovered, his conscience unripped, the judgments of God against his sins threatened, whereby he might come to a loathing, and grow to a further misliking of his sins daily? Sure it is indeed, that as in other things, so in this, the ceremonial use little availeth. Howbeit, if for the ceremonial use of the Sabbath, because many so use it, therefore we should leave it, we might as well by the same reason put out of the doors of the Church the administration of the Sacraments, the making of prayer, the preaching of the word, because the most part of men use these things for a fashion: neither is it the question which we have in hand, what men do, but what they ought to do in the observation of the Sabbath.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-greenham.html">Richard Greenham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Sabbath in The Works of Richard Greenham – Volume Two</cite></span></figcaption>

</figure><figure class="quote" id="q-29bf998468" data-kw="">
<blockquote><p>On the Lord’s day] He calleth the first day of the week on which Christ rose again, the Lord’s day. He saw the revelation, on this day, which Christians kept holy to God, being by the authority of the Apostles set apart for Church meetings, instead of the Jewish Sabbaths: as we may gather from I Cor. 16.I: where the Apostle commandeth, that on the first day of the week, gathering be made in the Church, for the brethren in Judea. So Acts 20.7. In one of the Sabbaths, that is, the first day of the week the Christians are said to come together to break bread. So then the observation of the Lord’s day is warranted, by an Apostolical tradition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-pareus.html">David Pareus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary upon the Divine Revelation of the Apostle and Evangelist John</cite>, trans. Elias Arnold (Amsterdam, 1644), p. 20.</span></figcaption>

</figure><figure class="quote" id="q-4591854bf6" data-kw="">
<blockquote><p>If I have observed the sun when it shines, or the moon moving in brightness, so that my heart has been secretly enticed, and my mouth has kissed my hand; this also would be an iniquity deserving of judgment, for I would have denied God who is above. (Job 31:26-8)

26, and 27 Let me be accursed, if beholding the glittering face of the Sun, or looking upon the Moon shining in her brightness, I have, being deceived, so much as privily in my heart, much less openly, consented unto idolaters, and after the manner of their superstitious custom, by moving, and putting my hand to my mouth, yielded any worship unto those bodies. 28 For this is a most heinous sin, as by which I had flatly denied that God, who is above the sun and the very stars them selves, and therefore deserved most horrible and fearful punishments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Job Expounded: Partly in Manner of a Commentary, Partly in Manner of a Paraphrase. Faithfully Translated out of Latin into English</cite>, (Cambridge, 1589), unpaginated.</span></figcaption>

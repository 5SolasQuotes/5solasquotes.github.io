<blockquote><p>8th Practice. In some parish-churches where the sectaries are put in, they have put down all singing of psalms… and will not suffer the parishes to enjoy any singing of psalms; and in other places, they begin to put down all prayer in the public assemblies, and to say there must be only discoursing and preaching; and in places where they cannot prevail to shut out singing of psalms, they in a contemptuous manner clap on their hats in the time of singing of psalms, and having been pulled off, put them on again; yea in prayer also many of them keep on hats.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-edwards.html">Thomas Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The First &amp; Second Part of Gangræna, or a Catalogue &amp; Discovery of Many of the Errors, Heresies, Blasphemies &amp; Pernicious Practices of the Sectaries of this Time, Vented &amp; Acted in England in these Four Last Years</cite>, … (London, 1646), Catalogue, ‘Some Passages in the Prayers of the Sectaries’, pp. 56-57. See also the Third Part, New &amp; Further Discovery, ‘A Passage sent in a letter dated June 16, 1646…’, p. 96</span></figcaption>

</figure><figure class="quote" id="q-a989aad450" data-kw="">
<blockquote><p>1. …The apostle tells us there must be nudatio capitis, our heads must be uncovered. The wearing of a cap, pileo donari, among the Romans, was peculiar to free men only, and an hieroglyphic of honor, for once if a man cepisset pileum, he was free, and when he laid aside his cap, he was said deponere magnificentiam, to lay aside his honor and privilege whereby he was distinguished from a servant. So then, as servants are to be uncovered in their master’s service, so are we to be in God’s: and therefore Saint Paul (in the place before cited) tells us that it is a shame for a man to have his head covered at that time. … But in this point corruption is crept into our Church. Instead of humbling ourselves by prostration and kneeling, we are pleased to sit at our ease, and that in a proud manner: instead of the depositio magnificentiae, et nudatio capitis, kneeling and uncovering our heads, we sit, and with our heads covered too; this is not to enquire, at least not to imitate, the days of old… This sedentary prayer and proud fashion of covering the head cannot be warranted by any text in Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lancelot-andrewes.html">Lancelot Andrewes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Pattern of Catechistical Doctrine at Large; or a Learned &amp; Pious Exposition of the 10 Commandments</cite>, … (d. 1626; London, 1650), 2nd Commandment, ch. 7, pp. 215, 217</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

s-in-the-post-reformation-era/#:~:text=The%20apostle%20tells%20us%20there%20must,warranted%20by%20any%20text%20in%20Scripture&amp;text=The%20apostle%20tells%20us%20there%20must%20be%20nudatio&amp;text=cannot%20be%20warranted%20by%20any%20text%20in%20Scripture" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>V. 2. …and keep the ordinances] By the word [Greek] in the original, which signifies traditions, he means… particular ordinances of comeliness, and good order, which belong to ecclesiastical policy, which afterward were called canons. … V. 10. power on her head] That is, a vail or covering, in token of her husband’s power and authority over her; or a kind of warrant or pass to go abroad with credit and honesty: for there was no necessity of vailing or covering their head within doors, but if they went abroad without their vail, they were counted light and wanderers, like unto run-away servants, or soldiers that have no passe to show from their masters or captains… because of the Angels] Some by the angels understand the pastors of the congregations, who are termed angels, Mal. 2:7 and Rev. 1:20, and that the apostle draws his reason to enforce women’s modest carriage from the reverend respect the women ought to show, especially in the Church, to these angels of the Churches. Others take angels here in the proper sense for the coelestial spirits, which always attend upon Christ their Head, and are present in the congregation of the faithful, and are offended at all disorders and uncomeliness which may be used there… … V. 16. if any man seem to be contentious, we have no such custom] Either the meaning is, We have no such custom for women to pray uncovered; or, we have no such custom or the Churches of God to contend about matters of this nature, but willingly and cheerful to obey those that have the oversight of us in the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-featley.html">Daniel Featley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The English Annotations</cite>, (1645) on 1 Cor. 11 Featley wrote the comments on Paul’s epistles, and was an episcopalian, Westminster divine. This work was often known as The Westminster Annotations as 6 of the 11 contributors were Westminster divines.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/head-coverings-in-worship.html">Head Coverings in Worship</a></span></div>

</figure><figure class="quote" id="q-5cded7c21e" data-kw="">
<blockquote><p>Ver. 2. And keep the ordinances ] Gr. the traditions or doctrines by word of mouth. These are, 1. Dogmatic, concerning faith and practice, 2 Thess. 2:15 ; 2 Thess. 2:1-17 . Ritual; and these again are, 1. Perpetual, as that of the manner of administering the two sacraments. 2. Temporary, as that of abstaining from certain meats, Acts 15:28-29 . And those other pertaining to the observing of external order and decency in Church assemblies. And of these the apostle here speaketh. (Sclater) … Ver. 4. Dishonoureth his head] As they accounted it then and there. In other places it is otherwise. The French preach covered. The Turks neither kneel nor uncover the head at public prayer, as holding those postures unmanly. Several countries have their several customs. Basiliades, duke of Muscovy, showed himself a tyrant in nailing an ambassador’s hat to his head, for not uncovering it before him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-trapp.html">John Trapp</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on 1 Corinthians</cite>, ch. 11</span></figcaption>

<div class="actions"><button class="copy" data-copy="“Ver. 2. And keep the ordinances ] Gr. the traditions or doctrines by word of mouth. These are, 1. Dogmatic, concerning faith and practice, 2 Thess. 2:15 ; 2 Thess. 2:1-17 . Ritual; and these again are, 1. Perpetual, as that of the manner of administering the two sacraments. 2. Temporary, as that of abstaining from certain meats, Acts 15:28-29 . And those other pertaining to the observing of external order and decency in Church assemblies. And of these the apostle here speaketh. (Sclater) … Ver. 4. Dishonoureth his head] As they accounted it then and there. In other places it is otherwise. The French preach covered. The Turks neither kneel nor uncover the head at public prayer, as holding those postures unmanly. Several countries have their several customs. Basiliades, duke of Muscovy, showed himself a tyrant in nailing an ambassador’s hat to his head, for not uncovering it before him.”

<main class="wrap"><figure class="quote" id="q-6867dcfd5e" data-kw="">
<blockquote><p>So that before this text [Mal. 1:14, “cursed be the deceiver, which hath in his flock a male, and voweth, and sacrificeth unto the Lord a corrupt thing:”] can be opposed to what has been said, it must be proved: 1. That the things in question are corruptions, as much prohibited as the blind and lame under the Law. 2. That they are such as a person does choose, and it is in his power to help, and offers it when he has a male in his flock. 3. That such a corruption as affects not the substance of worship, does yet alter the nature of it, and makes the whole to be a corrupt thing and abominable to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/degrees-of-impurities.html">Degrees of Impurities</a></span><span class="wk"><span class="lbl">Work:</span> <cite>London Ministers</cite>, A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, John Williams, ‘The Non-Conformists’ Plea for Lay-Communion with the Church of England’ Williams (d. 1709) was an Anglican bishop., p. 38</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-6ed8f21cd7" data-kw="">
<blockquote><p>Come to churches and say, ‘You have these defects among you, and these things to be reformed;’ but if you will come and say, ‘Your churches and your ministers are Antichristian and come from Babylon,’ there is nothing [that] provokes more…. …and I have learned this principle, which I hope I shall never lay down till I am swallowed up of immortality; and that is that which I said before: To acknowledge every good thing, and hold communion with it, in men, in churches, or whatsoever else. I learn this from Paul; I learn this from Jesus Christ Himself: He fills all in all; He is in the hearts of his people, and fills them in his ordinances to this day; and where Jesus Christ fills, why should we deny an acknowledgment and a right hand of fellowship and communion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, 12 vols. (d. 1680; Edinburgh: Nichol, 1861), vol. 1, Exposition of Eph. 1 (1681), sermon 36, on 1:22-23, pp. 558-59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><figure class="quote" id="q-ce4e42e320" data-kw="">
<blockquote><p>14. God has by nature and Scripture obliged men themselves to choose and determine diverse subordinate expressions, significations, modes, circumstances or accidents of this universal religion which are not themselves meet for an universal and unchangeable obligation, but [for] local, temporary and mutable [circumstances and obligations]: Some of which every man may choose for himself, some the present pastor must choose, some the associated pastors may choose, and some the magistrate may choose. These must be added to the universal duties, so far is such addition from being sin. I have often named many particulars, as: The translation of the Scripture, which to choose: the version of the Psalms in rhyme or meter, the common use of new made hymns,¹ the dividing the Scripture into chapter and verse, the words of sermons, their method, the particular text to be chosen, what chapters to read, at what hour to begin, how long to preach, in what words to pray, whether the same oft or changed, whether forestudied or not, whether written or unwritten, whether studied and written by ourselves or by others, where the place shall be, where the pulpit, [baptismal] font, table, etc. shall stand; what ornaments they shall have, linen, silk, silver vessels or otherwise? ¹ [Elsewhere Baxter speaks of, “the choice of psalms and hymns: the use of David’s are lawful and so are others: but no institution ties us to one, but leaves us to choose.” Schism Detected in Both Extremes (1684), pt. 2, pp. 5-6. This is plainly false: Ex. 15:20-21; 2 Sam. 23:1; 1 Chron. 25:1-7; 2 Chron. 29:25-30; Neh. 12:45-46; Ps. 95:2; etc. See ‘Singing of Psalms’.] Whether we be bareheaded or covered at prayer, sacrament, etc. Whether we shall kneel, stand, sit or be prostrate at prayer, etc. What distinctive garments pastors shall use, by what signs of consent and obligation men vow and swear, whether by putting the hand under the thigh [Gen. 24:2, 9; 47:29], lifting it up [Gen. 14:22; Dt. 32:40], subscribing, laying it on the Book,² kissing the Book,³ etc. What catechisms to use, with many more such. ² [See ‘On Laying One’s Hand on the Bible to Swear’.] ³ [See ‘On Trembling at the Word, Weeping before the Bible, Kissing the Stake, etc.’] God has commanded men to choose such things as these by the rules of edification, love, peace, concord, order, decency, winning those without, etc. 15. These [things] may be called ‘worship’ in a sense subservient to God’s ordinances of worship¹ (as we worship men by putting off the hat, kneeling, bowing [Mt. 18:26; Lk. 14:10; Rev. 3:9], etc.). But if any will not call it ‘worship’, they must [then] not call it ‘false worship’, nor pretend that the controversy is any more than about the bare name. ¹ [For an explanation of this, see pp. 73-84 of Travis Fentiman, 1 Corinthians – Head-Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022).] 16. They that feign such things as these to be sinful additions and an invading of Christ’s office and denying his faithfulness, etc. condemn the Scripture that commands such determinations, and contradict the Law of Nature and the practice of all Churches on earth, and would exterminate all God’s worship, which cannot be performed without some such determinations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter</cite>, Detailed | Catholic Communion Doubly Defended by Dr. Owen’s Vindicator &amp; Richard Baxter… (London: Parkhurst, 1684), section 2, pp. 9-14 | Determination of Particular Circumstances</span></figcaption>

<blockquote><p>For although, as I said, I little approve it, yet I see that sometimes in these indifferent matters some things, although they be grievous and burdensome, are to be born so long as it is not permitted by law to deviate from them; lest, if we contend for them more bitterly than we ought, this may be a hindrance to the advancement of the Gospel, and those things which are in their nature indifferent may, by our vehement contention, be represented as ungodly. Now these things, unless I am deceived, bring with them two most heavy inconveniences. For, if we should first suffer the Gospel both to be spread abroad and to take deep root, men would perhaps be better and more easily persuaded to remove these outward appurtenances. While any one is sick, and is by little and little amending, he takes it very ill that certain slight and trifling things, as well in food as in drink, should be removed from him. But the same person, having recovered his health, rejects those things of his own accord as disagreeable and of little use. If England were first well and diligently instructed and confirmed in the most necessary heads of religion, she would not, in my opinion, at length take it in ill part that these things, however superfluous, should be removed. But at this time, since a change is being introduced in necessary points of religion, and that with so great difficulty, if we should also speak of those things as ungodly which are indifferent, the minds of almost all men would be so turned away from us, that they would no longer show themselves to be attentive and patient hearers of sound doctrine and necessary sermons… Do not however gather from hence that I think a minister of the Gospel should never strive to assert the truth of the Scriptures and of doctrines. This I do not affirm: [those] who daily come forward, both in public and private disputations, in the most weighty controversies for religion. But this I say, that these things which are of less moment ought not to be a hindrance through our contention… Further, if we proceed to oppose these indifferent things as destructive and ungodly, we condemn very many Churches that are not alien from the Gospel, and we too bitterly reprove innumerable Churches which are of old distinguished as most worthy of praise. I do not forget that the authority of Churches, whether present or past, ought not to be of such force, that by them the truth of God’s Word should be overborne: for that ought to remain unshaken and unmoved… But I contend that on account of things indifferent, this ought by no means to come to pass that churches should be condemned, or that we should speak unfavourably of them…</p></blockquote>

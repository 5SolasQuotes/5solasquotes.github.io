<main class="wrap"><figure class="quote" id="q-e8b87cac6e" data-kw="">
<blockquote><p>XV. …the orthodox maintain… the question here… (4) It is not whether any dissent of parents avaricious and through sheer obstinacy will not consent to the proper marriage of children and cannot give sufficient reasons for their dissent after the request has been made by their children that the latter are not absolutely bound to their will, but it is right for them to apply to a superior power to whom a judgment concerning the justice or injustice of the dissent belongs. Thus the matter being well considered, they may determine what the children ought to do and consult their interest by supplying in this point the defect of the consent of the parents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes (P&amp;R), vol. 2, 11th Topic, ‘The Law of God’, Q. 16, ‘May Children Withdraw Themselves from the Power of Their Parents &amp; Marry Without their Consent? We Deny Against the Papists.’</cite>, p. 108</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>
<div class="actions"><button class="copy" data-copy="“XV. …the orthodox maintain… the question here… (4) It is not whether any dissent of parents avaricious and through sheer obstinacy will not consent to the proper marriage of children and cannot give sufficient reasons for their dissent after the request has been made by their children that the latter are not absolutely bound to their will, but it is right for them to apply to a superior power to whom a judgment concerning the justice or injustice of the dissent belongs. Thus the matter being well considered, they may determine what the children ought to do and consult their interest by supplying in this point the defect of the consent of the parents.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-57e3ee3491" data-kw="">
<blockquote><p>The laws then which the Church in proper speech is said to make, are decrees concerning outward order and comeliness in the administration of the Word and sacraments, in the meetings of the congregation, etc. and such laws made according to the general rules of God’s Word (which require that all things be done to edification, in comeliness, for the avoiding of offence) are necessary to be observed, and the Word of God binds all men to them so far forth as the keeping of them maintains decent order, and prevents open offence. Yet if a law concerning some external rite or thing indifferent, be at some time upon some occasion omitted no offence given, not contempt showed to ecclesiastical authority, there is no breach made in the conscience: and that appears by the example before handled. The apostles guided by the Holy Ghost made a decree for the avoiding of offence necessary to be observed, namely that the Gentiles should abstain from strangled [animals] and blood and idolythites, and yet Paul out of the case of scandal and contempt, permits the Corinthians to do otherwise, 1 Cor. 8 &amp; 9, which he would not have done, if to do otherwise out of the case of scandal and contempt had been sin</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Conscience wherein is set Down the Nature, Properties and Differences thereof: as also the way to get and keep good conscience (1596)</cite>, pp. 67-68</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

od/#:~:text=The%20laws%20then%20which%20the%20Church,scandal%20and%20contempt%20had%20been%20sin&amp;text=The%20laws%20then%20which%20the%20Church%20in%20proper&amp;text=case%20of%20scandal%20and%20contempt%20had%20been%20sin" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-537c63a515" data-kw="">
<blockquote><p>The very ground of this assertion of master [Robert] Bellarmine’s [a Romanist], is that he thinks not the copulation of married folk to be of the substance of matrimony. And this he proves by some testimonies out of the fathers in that fifth chapter. But yet himself will not [have] that this his saying should be so understood as if that he said that the use of marriage is not any way of the substance of marriage. For afterwards he says that this their sacrament may have two respects. As it is made, and as it is continued. As it [is] made, that is, (if I be not deceived) as the mutual consent of parties joines them together by their promises, the consent expressed by such words, is the matter and form of their sacrament. And thus must we understand that common rule in their law, that consent makes marriages. And thus do the fathers understand that which they say concerning the substance of marriage to consist in the mutual consent: partly, because after such consent given, the parties are not free to change the choice which they have made: and partly because that even by God’s law, if parties after such consent given, should carnally know another, it was death for them so to do: which could not be, but because this their consent is after a sort the marriage itself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-bunny.html">Francis Bunny</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Truth &amp; Falsehood: Or a Comparison between the Truth now taught in England &amp; the Doctrine of the Romish Church… (London: Sims, 1595), ch. 19, ‘Of Matrimony, that it is not a Sacrament &amp; that it is Lawful for all’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/marriage-and-family.html">Marriage and Family</a></span></div>

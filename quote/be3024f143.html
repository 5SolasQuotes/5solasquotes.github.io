<main class="wrap"><figure class="quote" id="q-be3024f143" data-kw="">
<blockquote><p>I do not make depriving the people of this power a cause of separating, though I reckon it a notable grievance, and pray the Lord may move the hearts of the rulers to defend the people in this their right against them that take it from them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e363b7ec35" data-kw="">
<blockquote><p>XXVII. Self-interest, self-government and family-government are all antecedent to public government, which rules them for the common good, but has no authority to destroy them: No king or prelate can bind a man to do that which would damn his soul, nor to omit that which is needful to his salvation: All power is for edification: They are God’s ministers for God. XXVIII. As it belongs to self-government to choose our own diet, and clothes, and wives, and physicians, (though we may be restrained from doing public hurt on such pretences); And it belong to family government to educate our own children, and choose their tutors, callings, wives, etc. so it more nearly belongs to self-government to choose the most safe and profitable means of our own salvation, which no man may forbid us; and to avoid that which is pernicious or hurtful; and to family-government to do the like for our children.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Schism Detected in both Extremes</cite>, … (London: 1684), ch. 4, p. 26</span></figcaption>

</figure><figure class="quote" id="q-33ad752f4a" data-kw="">
<blockquote><p>If any particular Church shall tolerate, in her bowels, errors of a heinous nature, the House of the living God becomes thereby a Den of notorious thieves and robbers; and the Church may be made up of infidels, who deny the resurrection of the dead, or of Arians, Socinians and the very worst heretics.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindication of the Real Reformation Principles of the Church of Scotland concerning Separation, Contra the Seceders</cite>, 1740</span></figcaption>

</figure><figure class="quote" id="q-76a8f6ea15" data-kw="">
<blockquote><p>The second distinction is, between congregations ‘which have a competent and well-qualified eldership, and small congregations, who have but few office-bearers, and those, it may be, not sufficiently able for church government. In this case of insufficiency, a congregation may not independently, by itself, exercise jurisdiction, and not in re propis,” says Parker.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

</figure><figure class="quote" id="q-3542fa7ff7" data-kw="">
<blockquote><p>This separation in Corinth was in a Church from the idolatry in it; which separation we allow, but not a separation out of a Church, else the words would bear that Paul will have them to forsake the Church of Corinth for idolatrous tables in it and set up a new Church of their own, which the Separatists dare not say, and is contrary to other places, 1 Cor. 5:4; chs. 11 &amp; 14, where he commands and allows their meetings and public Church-communion: Therefore this place proves not their point. What logic is this? Separate from idols, therefore separate from a Church where the true worship of God is professed and taught.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-currie.html">John Currie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on Separation</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>

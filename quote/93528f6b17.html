<main class="wrap"><figure class="quote" id="q-93528f6b17" data-kw="">
<blockquote><p>Fifteenthly and lastly, It is clearly evident that the Lord Christ has a strong inclination to save sinners, by his giving out of Scripture in that way and manner as He has done; the Lord Christ has given out Scripture so as to answer the objections of men and women, to answer all the evils of their hearts, all the pleas of corruption, and of a guilty conscience, and of the Devil himself: The Lord has given out Scripture so as to answer all that might hinder their coming in unto Him… Is not here encouragement enough unto poor sinners: — So here in the next words, ‘Whosoever will let him come and drink of the water of life freely:’ It’s laid down so as to answer all your objections, and to take away all your pleas you have to stave you off from Christ. So then you see clear evidences that Christ is willing to save sinners.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-greenhill.html">William Greenhill</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons of Christ, his Last Discovery of Himself</cite>, ... (London: R.I., 1656), Christ’s Willingness to Save Sinners, 2nd Sermon, pp. 168-69</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c201986fef" data-kw="">
<blockquote><p>I believe it is the duty of every minister of Christ plainly and faithfully to preach the gospel to all who will hear it; and as I believe the inability of men to do spiritually good things to be wholly of the moral, and therefore of the criminal kind and that it is their duty to love the Lord Jesus Christ and trust in Him for salvation, though they do not; I therefore believe free and solemn and solemn addresses, invitations, calls, and warnings to them to be not only consistent, but directly adapted, as means, in the hand of the Spirit of God, to bring them to Christ. I consider it as part of my duty which I could not omit without being guilty of the blood of souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/preface.html">T. E. Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Summary of Andrew Fuller’s The Gospel Worthy of All Acceptation</cite>, in Puritan Papers, vol. 1 (1959)</span></figcaption>

</figure><figure class="quote" id="q-a721c77241" data-kw="">
<blockquote><p>Those invitations, when considered as calls, to perform the duties of believing and repenting, belong to the law; but when viewed as expressions of the readiness, or willingness of God, to bestow salvation on sinners, and, as affording them an additional warrant to trust in the compassionate Savior for it, they form a part of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel</cite>, p. 119</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“Those invitations, when considered as calls, to perform the duties of believing and repenting, belong to the law; but when viewed as expressions of the readiness, or willingness of God, to bestow salvation on sinners, and, as affording them an additional warrant to trust in the compassionate Savior for it, they form a part of the gospel.”

— John Colquhoun, A Treatise on the Law &amp; Gospel, p. 119">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThose+invitations%2C+when+considered+as+calls%2C+to+perform+the+duties+of+believing+and+repenting%2C+belong+to+the+law%3B+but+when+viewed+as+expressions+of+the+readiness%2C+or+willingness+of+God%2C+to+bestow+salvation+on+sinners%2C+and%2C+as+affording+them+an+additional+warrant+to+trust+in+the+compassionate+Savior+for+it%2C+they+form+a+part+of+the+gospel.%E2%80%9D%0A%0A%E2%80%94+John+Colquhoun%2C+A+Treatise+on+the+Law+%26+Gospel%2C+p.+119&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa721c77241.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a721c77241.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=Those%20invitations%2C%20when%20considered%20as%20calls,form%20a%20part%20of%20the%20gospel&amp;text=Those%20invitations%2C%20when%20considered%20as%20calls%2C%20to%20perform&amp;text=it%2C%20they%20form%20a%20part%20of%20the%20gospel" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7576bf8bff" data-kw="">
<blockquote><p>It must be admitted that if the expression [of God’s desiring the repentance and salvation of the reprobate] were intended to apply to the decretive will of God then there would be, at least, implicit contradiction. For to say that God desires the salvation of the reprobate and also that God wills the damnation of the reprobate and apply the former to the same thing as the latter, namely, the decretive will, would be contradiction; it would amount to averring of the same thing, viewed from the same aspect, God wills and God does not will. The question then is: what is implicit in, or lies back of; the full and free offer of the gospel to all without distinction? The word “desire” has come to be used in the debate, not because it is necessarily the most accurate or felicitous word but because it serves to set forth quite sharply a certain implication of the full and free offer of the gospel to all. This implication is that in the free offer there is expressed not simply the bare preceptive will of God but the disposition of lovingkindness on the part of God pointing to the salvation to be gained through compliance with the overtures of gospel grace. In other words, the gospel is not simply an offer or invitation but also implies that God delights that those to whom the offer comes would enjoy what is offered in all its fullness. And the word “desire” has been used in order to express the thought epitomized in Ezekiel 33:11, which is to the effect that God has pleasure that the wicked turn from his evil way and live. It might as well have been said, “It pleases God that the wicked repent and be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Report of the Committee on the Free Offer of the Gospel presented to the Fifteenth</cite>, (1948) General Assembly of the Orthodox Presbyterian Church’ | Introduction</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><figure class="quote" id="q-62ffb91a19" data-kw="">
<blockquote><p>The divine affections or virtues are not distinct dispositions or habits that stand as attributes or functions of will, as they do in human beings, but instead are divine perfections that have some analogy to the dispositions or habits of the human will: ‘for though, properly speaking, there are [no affections] in God, he being a most pure and simple act, free from all commotion and perturbation; yet there being some things said and done by him, which are similar to affections in intelligent beings, [sic] they [that] are ascribed to him; as love, pity, hatred, anger etc., from which must be removed everything that is carnal, sensual, or has any degree of imperfection in it.’ (Gill, Complete Body of Divinity, I, p. 112; cf. Synopsis purioris theologiae, VI.xxxix; Turretin, Inst. theol. elencticae, III.xix.1.) Several writers, most notably Venema, treat these affections not only in relation to the divine will, but also as the affective manifestations of the goodness and holiness of God… The basis for this understanding is the assumption that affections are not essential attributes or original properties but, rather, are ad extra manifestations in which God is known through his effects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, pp. 557-58</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

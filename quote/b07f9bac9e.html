<main class="wrap"><figure class="quote" id="q-b07f9bac9e" data-kw="">
<blockquote><p>We have also the holy scriptures which declare unto us the wonderful works of God, by which things we may be lead to the knowledge of God without painted or carved images. Now peradventure some will say that Christ has a body, and likewise have saints, and therefore of them we may have images although of God there can be made no image. And further they wil say that the cause why images were forbid was peril of idolatry, and worshipping of them. So that where there is no such peril, we may have images. Yet as I will not utterly deny but they may be had, so I think it more convenient for Christ’s religion that they should be taken out of Christian men’s churches than that they should be placed in the temple [church building] of God. And of this my opinion I will show you certain good grounds, to the intent that whan you be demanded why we English men have no images in our churches, you may be able to make thereunto a reasonable answer, and that also in time to come you may declare to your children what abuses have crept into the church by the occasion of images…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cranmer.html">Thomas Cranmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Instruction into Christian Religion</cite>, (London: 1548), A Short Instruction Concerning the Ten Commandments, First Sermon, no page numbers</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

tures%20which%20declare&amp;text=into%20the%20church%20by%20the%20occasion%20of%20images" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bded0e8fc8" data-kw="Mary Idolatry">
<blockquote><p>Giving divine honor to the holy Virgin, or worshipping her with adoration, as Protestants say, due to God alone; of ascribing all the titles of Christ unto her, turning Lord in the Psalms in most places into Lady; praying to her, not only to entreat, yea, to command her Son to help and save them, but to save them herself, as she to whom her Son hath committed the administration of mercy, keeping that of justice to himself; with many other the like horrid blasphemies, which he shall hear more of if he desire it.</p></blockquote>

</figure><figure class="quote" id="q-1e6551a841" data-kw="">
<blockquote><p>…the attitude of the early Fathers had been anything but friendly toward the images of art. They had rejected their use by Christians and had held a quite derogatory view of religious imagery. It was only in the age of the great Cappadocians, toward the end of the fourth century, when in religious literature and learning, too, the first phase of the fusion between Christianity and Hellenism was well-nigh completed, that religious imagery was no longer considered as idolatry by the leaders of Christian thought. But it remained for the [iconophiles in the] era of the Iconoclastic Controversy to give a thorough theoretical foundation to the distinction between idols and icons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gerhart-b-ladner.html">Gerhart B. Ladner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Concept of the Image in the Greek Fathers &amp; the Byzantine Iconoclastic Controversy’ in Dumbarton Oaks Papers</cite>, vol. 7 (1953), pp. 3-34, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

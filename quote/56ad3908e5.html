<main class="wrap"><figure class="quote" id="q-56ad3908e5" data-kw="">
<blockquote><p>It is thus perfectly clear that, according to the Confession, the preservation of the Scriptures in their purity is of as vital importance to the Church as their original inspiration. The Presbyterian Church is committed by its Confession of Faith […] to the doctrine that the inspired Scriptures have been preserved pure through the ages, as truly as to the doctrine that the Scriptures were given by the immediate inspiration of God. […] We must take the language of the Confession as it stands, and in its natural and historical meaning. […]

But Professor [Henry Preserved] Smith goes as far astray in the opposite direction, in misinterpreting the Confession, when he would urge us to believe that its language here asserts the absolute purity of every, or of any one, copy of Scripture. When he says, “What the Confession affirms, it affirms of the seventeenth century Hebrew and Greek editions which are more imperfect than our own,” he puts into the Confession something which its authors did not put there. Thus he would drive us into a dilemma and force us either to modify the Confession’s assertion of the truth of inspired Scriptures, or to declare, with what he affirms to be the meaning of the Confession, the “absolute purity” of every copy of Scripture.

It is not difficult to decline so factitious a dilemma. The Confession knows nothing of it. It does assert the preservation of Scripture in “absolute purity”: but it does not assert the “absolute purity” of “the seventeenth century editions,” or of every copy, or of any copy of Scripture. We scan the text of the Confession in vain for any allusion to such a monstrous assertion. It would be to convict its authors (who had variant copies in their hands) of incredible folly to suppose them capable of such an assertion. The most cursory appeal to their writings on the subject will exonerate them from so unheard-of a charge. They do assert the preservation of Scripture to the Church in absolute purity by God’s singular care and providence. But they did not find that Scripture, in all its purity, in any one copy in any one printer’s impression. They recognized the fallibilities of copyists and typesetters; and they looked for the pure text of Scripture, not in one copy, but in all copies. “What mistake is in one copy,” they declared through one of their number, “is corrected in another.” And so they proclaimed the perfect preservation of Scripture, in its absolute purity, through all ages, in entire consistency with the recognition that many copies might come from the press filled with corruptions, and that no copy would ever be made by men, wholly free from error.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Confession and the original autographs in Selected shorter writings of Benjamin B. Warfield</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5a492649a0" data-kw="">
<blockquote><p>The authority of the Word is derived from the Word itself. The church cannot be the foundation upon which one believes that the Scriptures are the Word of God, for: First, the church derives all its authority from the Word. … Thus, we do not believe the Word to be the Word of God because the church affirms it, but on the contrary, we believe the church to be the true church because the Word validates her as such.</p></blockquote>

</figure><figure class="quote" id="q-f06f0da33b" data-kw="hebrew greek">
<blockquote><p>The following arguments prove that the sources have not been corrupted. (1) The providence of God which could not permit books which it willed to be written by inspiration (theopneustois) for the salvation of men (and to continue unto the end of the world that they might draw from them waters of salvation) to become so corrupted as to render them unfit for this purpose. And since new revelations are not to be expected (after God has recorded in the Scriptures his entire will concerning the doctrine of salvation), what can be more derogatory to God (who has promised his constant presence with the church) than to assert that he has permitted the books containing this doctrine to become so corrupt that they cannot serve as a canon of faith? (2) The fidelity of the Christian church and unceasing labor in preserving the manuscripts; for since Christians have always labored with great zeal to keep this sacred deposit uncorrupted, it is not credible that they would either corrupt it themselves or suffer it to be corrupted by others. (3) The religion of the Jews who have bestowed upon the sacred manuscripts great care and labor amounting even to superstition.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.10</span></figcaption>

</figure><figure class="quote" id="q-c935b6c0c7" data-kw="">
<blockquote><p>Thus Paul treats this topic in a truly apostolic way, because no sophist or legalist or Jew or fanatic or anyone else speaks this way. Who would dare quote this passage from Moses, “Cursed be everyone who hangs on a tree,” and apply it to Christ Himself? By the same principle by which Paul applied this sentence, “Cursed be everyone, etc.,” to Christ, we can apply not only all of Deut. 27 but all collected curses of the Mosaic Law to Christ. For just as Christ for His own Person is innocent of this general Law, so He is of all others. And just as for us He violated this general Law and was hanged on the tree as a criminal, a blasphemer, a parricide, and a traitor, so He violated all other laws as well. For all the curses of the Law were gathered together in Him, and therefore He bore and sustained them in His own body for us. Consequently, He was not only accursed; but He became a curse for us. This is really the apostolic way to interpret the Scriptures. For without the Holy Spirit a man cannot speak this way; that is, he cannot include the entire Law in one word and gather it all at once in Christ, and, on the other hand, include all the promises of Scripture and say that these are fulfilled in Christ once and for all. Therefore this argument is apostolic and very powerful, based as it is, not on one passage in the Law but on all the laws; and Paul relies heavily on it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Luther’s Works</cite>, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 289.</span></figcaption>

</figure><figure class="quote" id="q-66d40d7be9" data-kw="">
<blockquote><p>The Council of Trent having stamped the Vulgate as ‘authentic,’ ordered that a correct edition of this authorized Vulgate should be published. But little was done in fulfilment of this decree for nearly forty years, when the task was undertaken by Pope Sixtus V., a Pontiff who seems really to have believed in his own infallibility. He employed a Board of learned men to act as revisers, but in complete subordination to himself. In his preface he claims the superiority to them which he exercised, as resulting from the singular privilege which he enjoyed as successor to Peter, the Prince of the Apostles, for whom Christ prayed that his faith should not fail, and who was charged to confirm the other Apostles in the faith. … But a glance at the volume was sufficient to convince any moderately learned man of the folly, not to say impiety, of such boastful presumption. Many passages were found covered with slips of paper on which new corrections had been printed; others were scratched out and merely corrected with a pen; and different copies were corrected in different ways. A closer examination showed those competent to judge that the edition had graver faults than could be accounted for by printers’ carelessness. Sixtus had changed the readings of those whom he had employed to report upon the text with the most arbitrary and unskilful hand; and it was scarcely an exaggeration to say with Bellarmine that his precipitate self-reliance had brought the Church into the most serious peril.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture XIV</span></figcaption>

<blockquote><p>Love to Christ delights in his ordinances, and leads the person in whom it dwells to observe them regularly and conscientiously. These are the places where he meets with his people, and holds communion with them. True love will fly with eagerness to seek its object wherever it is to be found, and will linger fondly about the spot where it expects to meet him. …

If a person is careless in waiting on public ordinances, if he can absent himself from them on the most trifling account, if he has more pleasure in loitering at home, in traversing the fields, or in visiting his friends, how dwelleth the love of Christ in that man?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Love to Christ in Sermons</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-81b1fed382" data-kw="">
<blockquote><p>Without vital godliness there can be no true zeal for God’s honour and glory; without It there can be no firm, lasting bond of union, no hearty, steady co-operation—no real, desirable peace. But let vital godliness prevail—let personal religion animate us, and every gracious result will flow from it; the glory of the Lord will be in the midst of us, and a wall of fire will encircle us.

Indeed, the Christian is not warranted to pray for temporal blessings for himself or for his country, but in connexion with, or subordination to, those that are spiritual; and that man who seeks and prays for his country’s spiritual and eternal weal, merits better of his country than the man who seeks and strives for her highest earthly glory and aggrandizement—aye, who is successful in securing it; for what, let me ask, is temporal weal to spiritual health—to eternal happiness?

What is all earthly good compared with a renewed and sanctified heart? What is peace with man compared with peace with God? What is deliverance from human oppression compared with rescue from the galling yoke of sin? What is security from the wrath of man to deliverance from the wrath of God? A compassionate heart bleeds for the poverty, the bondage, the carnage of his fellow-creatures; but a sanctified heart, not neglectful of these, feels more deeply for their ignorance, their guilt, their depravity, and the fearful consequences flowing from them. And how can we hope for this result, either personally or generally, but by vital godliness possessing the heart, by the spirit of vital religion pervading the land?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brown.html">Thomas Brown</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Duty of Prayer for the “Peace of Jerusalem. Preached at the opening of the General Assembly, 16th May 1844 in The Free Church Pulpit; Consisting of Discourses by the Most Eminent divines of the Free Church of Scotland. Vol. I.</cite></span></figcaption>

</figure><figure class="quote" id="q-747f77bf98" data-kw="">
<blockquote><p>Here followeth now the second part of the magistrates’ ordinance, which consisteth in making good laws for the preservation of honesty, justice, and public peace; which is likewise accomplished in good and upright laws. But some there are who think it mere tyranny to lay laws on free men’s backs, as it were a yoke upon necks not used to labour; supposing that every one ought rather to be left to his own will and discretion. The apostle indeed did say, “The law is not given for the just, but for the unjust:” but the cause, why the law is not given to the just, is because he is just; for the just worketh justice, and doth of his own accord the thing which the law exacteth of every mortal man. Wherefore the law is not troublesome to the just man, because it is agreeable to the mind and thoughts of upright livers, who do embrace it with all their hearts. But the unjust desireth nothing more than to live as he lusteth: he is not conformable in any point to the law, and therefore must he by the law be kept under, and bridled from marring himself and hurting other.

So then, since to good men the laws are no troublesome burden but an acceptable pleasure, which are also necessary for the unjust, as ordained for the bridling of lawless and unruly people; it followeth consequently, that they are good and profitable for all men, and not to be rejected of any man. What may be said of that, moreover, that God himself, who did forsee the disposition of us men, what we would be, and hath still favoured the true liberty which he desired always to have preserved among his people, as one that ever meant them good, and never did ordain the thing that should turn to their hinderance or discommodity; that God himself (I say) was their lawgiver, and hath not suffered any age at any time to live as people without a law? Yea too, those commonweals have been happy always, that have admitted laws, and submitted themselves to be governed by laws; when as, contrarily, those kingdoms have of all other been most miserable, and torn in pieces by civil dissensions and foreign enemies, which, having banished upright laws, did strive to maintain their own kind of freedom, their uncontrolled dealing and licentious liberty, that is, their beastly lust and uncivil rudeness. Good laws therefore are for the health and preservation of the people, and necessary for the peace and safeguard of commonweals and kingdoms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 337-8.</span></figcaption>

</figure><figure class="quote" id="q-0c22200806" data-kw="">
<blockquote><p>It has become almost an adage, that the Church has developed her theology mainly through conflict with error. This must be so from the nature of the case. Attention is not apt to be specially directed to what is undisputed, and our clearest judgments are derived from comparison. The contrast of truth and error, induced by the assertion of the latter, enhances our comprehension of both. The doctrine of the covenants constitutes no exception to this law.

It was not brought distinctly under investigation and formally developed until the period succeeding the Reformation. Luther grandly elucidated the cardinal doctrine of justification by faith alone. Justification he saw clearly. Imputation he perceived less distinctly; and he stopped short of the controlling principle of federal representation. Even Calvin, magnificently endowed as he was by his abilities and learning for a systematic treatment of revealed truth, although he produced a theological work distinguished for its comprehensive grasp of the doctrines of religion in their relation to each other, did not seem to have had his mind definitely turned to the federal scheme.

It was when Placæus [Joshua De La Place] broached his theory of the mediate imputation of Adam’s sin, that the attention of the Reformed Church was thoroughly aroused to the importance and scope of the federal theology. The theologians of the Dutch School, in their massive works, subjected it to a full, if not an exhaustive, consideration; and their example was followed by some of the most illustrious divines of England and Scotland.

And while Cunningham, Hodge, and our own Thornwell have trodden in their footsteps, and evinced in their discussions their sense of the importance of the federal system—a fact for which the present generation of Calvinists should be devoutly thankful—it is to be feared that indications are beginning to manifest themselves of a growing tendency towards a departure from this type of theology. Especially would it be for a lamentation should it disappear from the pulpit—the grand organ by which divine truth is brought into contact with the masses.

And as surely as the pulpit drifts away from it, will it more and more cast its instructions in the mould of a wretched legalism; or, losing the influence of this pervading genius of theological truth, and so lapsing from any thoroughgoing inculcation of doctrine, it will more and more neglect its heavenly call to be an instructor of Christ’s people, and sink its high didactic office into that of a vapid and sensational haranguer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-l-girardeau.html">John L. Girardeau</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Federal Theology: Its Import and its Regulative Influence in Memorial Volume of the Semi-Centennial of the Theological Seminary at Columbia, South Carolina</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

— John L. Girardeau, The Federal Theology: Its Import and its Regulative Influence in Memorial Volume of the Semi-Centennial of the Theological Seminary at Columbia, South Carolina">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+has+become+almost+an+adage%2C+that+the+Church+has+developed+her+theology+mainly+through+conflict+with+error.+This+must+be+so+from+the+nature+of+the+case.+Attention+is+not+apt+to+be+specially+directed+to+what+is+undisputed%2C+and+our+clearest+judgments+are+derived+from+comparison.+The+contrast+of+truth+and+error%2C+induced+by+the+assertion+of+the+latter%2C+enhances+our+comprehension+of+both.+The+doctrine+of+the+covenants+constitutes+no+exception+to+this+law.%0A%0AIt+was+not+brought+distinctly+under+investigation+and+formally+developed+until+the+period+succeeding+the+Reformation.+Luther+grandly+elucidated+the+cardinal+doctrine+of+justification+by+faith+alone.+Justification+he+saw+clearly.+Imputation+he+perceived+less+distinctly%3B+and+he+stopped+short+of+the+controlling+principle+of+federal+representation.+Even+Calvin%2C+magnificently+endowed+as+he+was+by+his+abilities+and+learning+for+a+systematic+treatment+of+revealed+truth%2C+although+he+produced+a+theological+work+distinguished+for+its+comprehensive+grasp+of+the+doctrines+of+religion+in+their+relation+to+each+other%2C+did+not+seem+to+have+had+his+mind+definitely+turned+to+the+federal+scheme.%0A%0AIt+was+when+Plac%C3%A6us+%5BJoshua+De+La+Place%5D+broached+his+theory+of+the+mediate+imputation+of+Adam%E2%80%99s+sin%2C+that+the+attention+of+the+Reformed+Church+was+thoroughly+aroused+to+the+importance+and+scope+of+the+federal+theology.+The+theologians+of+the+Dutch+School%2C+in+their+massive+works%2C+subjected+it+to+a+full%2C+if+not+an+exhaustive%2C+consideration%3B+and+their+example+was+followed+by+some+of+the+most+illustrious+divines+of+England+and+Scotland.%0A%0AAnd+while+Cunningham%2C+Hodge%2C+and+our+own+Thornwell+have+trodden+in+their+footsteps%2C+and+evinced+in+their+discussions+their+sense+of+the+importance+of+the+federal+system%E2%80%94a+fact+for+which+the+present+generation+of+Calvinists+should+be+devoutly+thankful%E2%80%94it+is+to+be+feared+that+indications+are+beginning+to+manifest+themselves+of+a+growing+tendency+towards+a+departure+from+this+type+of+theology.+Especially+would+it+be+for+a+lamentation+should+it+disappear+from+the+pulpit%E2%80%94the+grand+organ+by+which+divine+truth+is+brought+into+contact+with+the+masses.%0A%0AAnd+as+surely+as+the+pulpit+drifts+away+from+it%2C+will+it+more+and+more+cast+its+instructions+in+the+mould+of+a+wretched+legalism%3B+or%2C+losing+the+influence+of+this+pervading+genius+of+theological+truth%2C+and+so+lapsing+from+any+thoroughgoing+inculcation+of+doctrine%2C+it+will+more+and+more+neglect+its+heavenly+call+to+be+an+instructor+of+Christ%E2%80%99s+people%2C+and+sink+its+high+didactic+office+into+that+of+a+vapid+and+sensational+haranguer.%E2%80%9D%0A%0A%E2%80%94+John+L.+Girardeau%2C+The+Federal+Theology%3A+Its+Import+and+its+Regulative+Influence+in+Memorial+Volume+of+the+Semi-Centennial+of+the+Theological+Seminary+at+Columbia%2C+South+Carolina&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F0c22200806.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/0c22200806.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/09/15/john-lafayette-girardeau-on-the-danger-of-neglecting-federal-theology/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>

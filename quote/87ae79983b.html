<blockquote><p>These [circumstances] are such close adjuncts of religious worship that in a secondary sense they partake of the meaning and nature of it. Observance of them promotes not only the honor of God which is found in both the natural and the instituted worship of God, but also a certain special honor to Him in that their observance is connected with natural and instituted worship by his command and in a direct and immediate way.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, trans. John Eusden (1628; Grand Rapids: Baker, 1997), bk. 2, ch. 14, ‘The Manner of Divine Worship’, p. 283</span></figcaption>

<blockquote><p>…We ought not to worship God with any other external worship than what Himself has commanded and appointed us in his holy Word. The Scripture has set us our bounds for worship, to which we must not add, and from which we ought not to diminish; for whosoever does either the one or the other, must needs accuse the Rule either of defect in things necessary, or of superfluity in things unnecessary: which is an high affront to the wisdom of God, who as He is the object, so He is the Prescriber of all that worship which He will accept and reward. I well know that this rule has given (I cannot say cause, but) occasion to many hot disputes about ecclesiastical rites and constitutions; some condemning whatsoever is prescribed or used in the service of God, besides things expressly commanded in Scripture, for encroachments upon the authority of God, and additions unto his worship, which He requires to be performed according to the pattern in the mount, and the model He has delineated for it: Others again maintaining the privilege and authority of the Church in ordaining some things for the more decent and reverend performing of the service of God, which are not particularly required in the holy Scriptures. I shall not plunge myself into this angry and quarrelsome controversy: only give me leave to say and sadly to lament that the seamless coat of Christ is rent in pieces among them, whilst some think it more decent to sew on loops and fringes to it, and others will have none. And truly I think our differences are of no greater importance in themselves, though too woeful in their consequents, than this amounts unto. I shall clearly express my sense of this matter in a few words, without any reflection or bitterness, and so leave it to the judgment of every ordinary discretion. Things which belong to the worship of God, may be considered either as parts of that worship, or only as circumstances and modifications of it: First therefore, whatsoever is imposed on us as a substantial part of the worship of God, if it be not expresly required of us in the holy Scriptures, is to be not only refused, but abominated. For this is a plain addition to what God has commanded, and by it we lay an imputation upon Him as though He wanted [lacked] wisdom to ordain what is necessary for his own service. Then and then only is any constitution of man imposed for a part of divine worship when obedience unto it is urged upon us, not only from the authority enjoining it, but also from the necessity of the thing considered simply and nakedly in its own nature… Other things are necessary for our observance only because they are commanded by their authority, to whom we owe consciencious obedience in things lawful and indifferent. But we utterly deny that the imposition of any such things makes them any parts of worship, of which they are only circumstances, or that these observances are necessary to us or acceptable to God antecedently to the command of authority, or that the worship of God were imperfect, defective, unacceptable and invalid to the ends for which it is appointed were not these observances commanded and performed: If indeed we thought otherwise, the bitterest of all their invectives, and the loudest of all their exclamations in calling our worship “superstition,” “will-worship” and “idolatry” would not show so much passion as a just and rational zeal. But God forever forbid that any such ordinances of man should be introduced into our Church. We all join in this vote and do utterly renounce any such authority, and deny any such practice. We usurp not upon the consciences of any, nor endeavour to persuade them that that is in it self necessary which is not so by God’s commands or the Law of Nature, or that that is unlawful which is not condemned by either. We endeavor to keep ourselves and you as much from a positive, as a negative superstition: we endeavour to put due bounds between things simply necessary, either by the command of God or their own natural reason and goodness, and such as are in themselves indifferent. We say that nothing is a part of worship but what belongs to the former, but some things that belong to the latter may be used in worship as fit and decent circumstances: And when such things are imposed, they become necessary; not indeed in themselves (for no human authority can alter the nature of things), but to our practice, and our consciences are obliged to them: But how? not indeed simply and absolutely, so that it shall never be lawful to omit them, but only in two cases: in case of scandal and contempt. We ought not to omit them if we judge any offence will be taken by others at our neglect: we ought not to omit them at any time out of a contempt and disrespect towards them. And thus you see we put a vast difference between that which is a part of worship and that which is but a circumstance of worship: If any thing be commanded us by men, as a part of worship, which is not commanded us by God, we ought not to submit unto it. But: Secondly, if any thing be imposed on us not as a part of worship, but as a circumstance and modification of worship, we may and we ought to submit unto it: First, if the things so imposed be in themselves lawful and honest, which they are, if not condemned by the Scripture. Secondly, if they tend to order and decency in the Church. Of which certainly they are as fit to be judges who have authority both in Church and State, as every private and perhaps less-knowing Christian. Thirdly, if they are imposed by the command of a lawful power, to whom we ought to submit in all things that are lawful. Fourthly, if they are such as neither for their levity nor number eat out or distract the seriousness and devotion of our spiritual worship: Which I think cannot justly be imputed to the observances of our Church, being very few for number and very grave and modest for use. If such things as these be imposed upon us, the worship of God is not thereby either changed or adulterated, neither is there any addition made unto it, but the substance of that worship is still in conformity to God’s laws when yet the outward and indifferent manner of it is in conformity to man’s. Certainly it is no addition to baptism to give a name to the baptized, though we find no express command for it. And I much wonder among our carping brethren some or other had not scrupled this as well as another observance. It is no addition to the ordinances of Jesus Christ to appoint at what hour they shall be celebrated or in what garment, or in what decent posture, for all these things are extrinsical to the worship of God and fall under the cognizance and direction of our superiors. Certainly did we but rightly weigh what is required as a part of worship and what only as a circumstance of worship, a great deal of heat and contention, and uncharitable prejudice would be removed and prevented. It is true our Savior, Mt. 15:9, condemns the scribes and Pharisees, that taught for doctrines the commandments of men: that is, they taught those things which were but the traditions and ordinances of their elders to be in themselves absolutely necessary to the serving and worshipping of God. But certainly this reproof falls not upon these, who though they do enjoin what they judge fit for order, yet do not teach them for doctrines, and are so far from thinking their commandments an essential part of worship that they would abhor and anathematize all those that do so. Necessary they are to be submitted unto and practiced because enjoined by that authority to which God has committed the care of the First Table, as well as the Second, but [they are] not necessary in themselves as any part of the worship and service of God, without which, although they were not imposed by men, it would be unacceptable to Him: And whosoever thinks so, let him be accursed. And now that I have delivered my judgment without bitterness, give me leave to make some few lamentations in the grief and bitterness of my soul: Is it not to be bitterly lamented that in a Reformed and Orthodox Church there should be such schisms, rents and divisions, altar against altar, pulpit against pulpit, and one congregation against another? And what is all this contention and separation for? Oh, they will tell you it is for the purity of religion, for the true and sincere worship of God, that they may serve Him purely without human additions or inventions. Thus goes the cry; and a company of poor, ignorant, well-meaning souls, because it is very demurely and gravely spoken, take it up and join with it, never examining the grounds and bottom of it; but conclude that these must needs be in the right who complain of corruptions and pretend to a happy and glorious reformation. Alas, my brethren, was there ever any schism in the world that did not plead the same? Did not others upon the same pretences separate from their communion upon which they now separate from ours? And may not the same argument serve to crumble them into infinite fractions and subdivisions? till at last we come to have almost as many Churches as men, and scarce a man constant and coherent to himself. But what is it in our worship which they dislike? The substantials of it are all the same with their own: We utterly disavow that we make that any part of worship which the Scripture has not: and I think that man very much forsaken of reason and common understanding who shall endeavour to persuade us that we intend worship when we ourselves most earnestly and seriously profess the contrary. Is it then that we differ about mere accidents and circumstances? I confess we do: but assert withal that these things are not a just cause of separation from us. If we look back upon the primitive times, we shall find that almost every Church had its different rites and observances; and yet under that diversity maintained unity and communion: Yea, and at this day, the reformed Churches observe different customs one from another and yet they inviolably hold communion together and we with them. The Gallican, Belgic, Helvetian and German Churches reject us not, nor we them, although we differ in rites and discipline, and those things which are left to the prudence of every Church to constitute as they shall judge most necessary for order and edification. Now certainly if these different rites and observances be no ground for one national Church to separate from the communion of another, they can be no ground for private persons to separate from the communion of that Church to which they belonged. Nay, although they might with reason dislike many usages either as frivilous or incongruous, yet it becomes the temper and modesty of a pious Christian, in things merely circumstantial, to submit his practice to the judgment of that authority under which he lives and not to separate from the communion of the Church, to forsake its assemblies, to disown its administrations, only because he thinks some things might be more conveniently ordered according to the model of his own or other men’s apprehensions: Which in the folly and sad consequences of it, would be to act like him who took up a beetle [mallet], and struck with all his force to kill a fly that he saw on his friend’s forehead. What else were this but to rend the body of Christ by an angry contending about the fashion of its garments, and to tear away its limbs by a violent striving to strip off those clothes which they think indecent? For my part I freely profess that were my lot cast among any of the Reformed Churches beyond the seas, I would presently join in their communion and not at all scruple to conform myself to their received customs, although perhaps in my own private persuasion I may judge some of them to be less serious and less reverent than those of the Church of England, which are now so passionately decried and condemned. I have ever venerated that oracular advice of St. Ambrose to St. Augustine: ‘If thou wilt neither give offence, nor take offence, conform thyself to all the lawful customs of the Churches where thou comest.’ (Augustine to Januarius, epistle 118) But I will not farther enlarge on this choloric and touchy controversy; only I pray that our wanton dissensions about these less important matters may not provoke God to deprive us of the substance and essentials of our religion and reduce us to such a condition wherein we should be heartily glad could we enjoy the liberty of the Gospel and the ordinances of our Lord Jesus Christ under any of those forms of administration which are now so furiously debated amongst us. It were just with God to extinguish the light of his Gospel when we use it not to work by, but all our study and strife is how to snuff it.</p></blockquote>

to+the+judgment+of+every+ordinary+discretion.+Things+which+belong+to+the+worship+of+God%2C+may+be+considered+either+as+parts+of+that+worship%2C+or+only+as+circumstances+and+modifications+of+it%3A+First+therefore%2C+whatsoever+is+imposed+on+us+as+a+substantial+part+of+the+worship+of+God%2C+if+it+be+not+expresly+required+of+us+in+the+holy+Scriptures%2C+is+to+be+not+only+refused%2C+but+abominated.+For+this+is+a+plain+addition+to+what+God+has+commanded%2C+and+by+it+we+lay+an+imputation+upon+Him+as+though+He+wanted+%5Blacked%5D+wisdom+to+ordain+what+is+necessary+for+his+own+service.+Then+and+then+only+is+any+constitution+of+man+imposed+for+a+part+of+divine+worship+when+obedience+unto+it+is+urged+upon+us%2C+not+only+from+the+authority+enjoining+it%2C+but+also+from+the+necessity+of+the+thing+considered+simply+and+nakedly+in+its+own+nature%E2%80%A6+Other+things+are+necessary+for+our+observance+only+because+they+are+commanded+by+their+authority%2C+to+whom+we+owe+consciencious+obedience+in+things+lawful+and+indifferent.+But+we+utterly+deny+that+the+imposition+of+any+such+things+makes+them+any+parts+of+worship%2C+of+which+they+are+only+circumstances%2C+or+that+these+observances+are+necessary+to+us+or+acceptable+to+God+antecedently+to+the+command+of+authority%2C+or+that+the+worship+of+God+were+imperfect%2C+defective%2C+unacceptable+and+invalid+to+the+ends+for+which+it+is+appointed+were+not+these+observances+commanded+and+performed%3A+If+indeed+we+thought+otherwise%2C+the+bitterest+of+all+their+invectives%2C+and+the+loudest+of+all+their+exclamations+in+calling+our+worship+%E2%80%9Csuperstition%2C%E2%80%9D+%E2%80%9Cwill-worship%E2%80%9D+and+%E2%80%9Cidolatry%E2%80%9D+would+not+show+so+much+passion+as+a+just+and+rational+zeal.+But+God+forever+forbid+that+any+such+ordinances+of+man+should+be+introduced+into+our+Church.+We+all+join+in+this+vote+and+do+utterly+renounce+any+such+authority%2C+and+deny+any+such+practice.+We+usurp+not+upon+the+consciences+of+any%2C+nor+endeavour+to+persuade+them+that+that+is+in+it+self+necessary+which+is+not+so+by+God%E2%80%99s+commands+or+the+Law+of+Nature%2C+or+that+that+is+unlawful+which+is+not+condemned+by+either.+We+endeavor+to+keep+ourselves+and+you+as+much+from+a+positive%2C+as+a+negative+superstition%3A+we+endeavour+to+put+due+bounds+between+things+simply+necessary%2C+either+by+the+command+of+God+or+their+own+natural+reason+and+goodness%2C+and+such+as+are+in+themselves+indifferent.+We+say+that+nothing+is+a+part+of+worship+but+what+belongs+to+the+former%2C+but+some+things+that+belong+to+the+latter+may+be+used+in+worship+as+fit+and+decent+circumstances%3A+And+when+such+things+are+imposed%2C+they+become+necessary%3B+not+indeed+in+themselves+%28for+no+human+authority+can+alter+the+nature+of+things%29%2C+but+to+our+practice%2C+and+our+consciences+are+obliged+to+them%3A+But+how%3F+not+indeed+simply+and+absolutely%2C+so+that+it+shall+never+be+lawful+to+omit+them%2C+but+only+in+two+cases%3A+in+case+of+scandal+and+contempt.+We+ought+not+to+omit+them+if+we+judge+any+offence+will+be+taken+by+others+at+our+neglect%3A+we+ought+not+to+omit+them+at+any+time+out+of+a+contempt+and+disrespect+towards+them.+And+thus+you+see+we+put+a+vast+difference+between+that+which+is+a+part+of+worship+and+that+which+is+but+a+circumstance+of+worship%3A+If+any+thing+be+commanded+us+by+men%2C+as+a+part+of+worship%2C+which+is+not+commanded+us+by+God%2C+we+ought+not+to+submit+unto+it.+But%3A+Secondly%2C+if+any+thing+be+imposed+on+us+not+as+a+part+of+worship%2C+but+as+a+circumstance+and+modification+of+worship%2C+we+may+and+we+ought+to+submit+unto+it%3A+First%2C+if+the+things+so+imposed+be+in+themselves+lawful+and+honest%2C+which+they+are%2C+if+not+condemned+by+the+Scripture.+Secondly%2C+if+they+tend+to+order+and+decency+in+the+Church.+Of+which+certainly+they+are+as+fit+to+be+judges+who+have+authority+both+in+Church+and+State%2C+as+every+private+and+perhaps+less-knowing+Christian.+Thirdly%2C+if+they+are+imposed+by+the+command+of+a+lawful+power%2C+to+whom+we+ought+to+submit+in+all+things+that+are+lawful.+Fourthly%2C+if+they+are+such+as+neither+for+their+levity+nor+number+eat+out+or+distract+the+seriousness+and+devotion+of+our+spiritual+worship%3A+Which+I+think+cannot+justly+be+imputed+to+the+observances+of+our+Church%2C+being+very+few+for+number+and+very+grave+and+modest+for+use.+If+such+things+as+these+be+imposed+upon+us%2C+the+worship+of+God+is+not+thereby+either+changed+or+adulterated%2C+neither+is+there+any+addition+made+unto+it%2C+but+the+substance+of+that+worship+is+still+in+conformity+to+God%E2%80%99s+laws+when+yet+the+outward+and+indifferent+manner+of+it+is+in+conformity+to+man%E2%80%99s.+Certainly+it+is+no+addition+to+baptism+to+give+a+name+to+the+baptized%2C+though+we+find+no+express+command+for+it.+And+I+much+wonder+among+our+carping+brethren+some+or+other+had+not+scrupled+this+as+well+as+another+observance.+It+is+no+addition+to+the+ordinances+of+Jesus+Christ+to+appoint+at+what+hour+they+shall+be+celebrated+or+in+what+garment%2C+or+in+what+decent+posture%2C+for+all+these+things+are+extrinsical+to+the+worship+of+God+and+fall+under+the+cognizance+and+direction+of+our+superiors.+Certainly+did+we+but+rightly+weigh+what+is+required+as+a+part+of+worship+and+what+only+as+a+circumstance+of+worship%2C+a+great+deal+of+heat+and+contention%2C+and+uncharitable+prejudice+would+be+removed+and+prevented.+It+is+true+our+Savior%2C+Mt.+15%3A9%2C+condemns+the+scribes+and+Pharisees%2C+that+taught+for+doctrines+the+commandments+of+men%3A+that+is%2C+they+taught+those+things+which+were+but+the+traditions+and+ordinances+of+their+elders+to+be+in+themselves+absolutely+necessary+to+the+serving+and+worshipping+of+God.+But+certainly+this+reproof+falls+not+upon+these%2C+who+though+they+do+enjoin+what+they+judge+fit+for+order%2C+yet+do+not+teach+them+for+doctrines%2C+and+are+so+far+from+thinking+their+commandments+an+essential+part+of+worship+that+they+would+abhor+and+anathematize+all+those+that+do+so.+Necessary+they+are+to+be+submitted+unto+and+practiced+because+enjoined+by+that+authority+to+which+God+has+committed+the+care+of+the+First+Table%2C+as+well+as+the+Second%2C+but+%5Bthey+are%5D+not+necessary+in+themselves+as+any+part+of+the+worship+and+service+of+God%2C+without+which%2C+although+they+were+not+imposed+by+men%2C+it+would+be+unacceptable+to+Him%3A+And+whosoever+thinks+so%2C+let+him+be+accursed.+And+now+that+I+have+delivered+my+judgment+without+bitterness%2C+give+me+leave+to+make+some+few+lamentations+in+the+grief+and+bitterness+of+my+soul%3A+Is+it+not+to+be+bitterly+lamented+that+in+a+Reformed+and+Orthodox+Church+there+should+be+such+schisms%2C+rents+and+divisions%2C+altar+against+altar%2C+pulpit+against+pulpit%2C+and+one+congregation+against+another%3F+And+what+is+all+this+contention+and+separation+for%3F+Oh%2C+they+will+tell+you+it+is+for+the+purity+of+religion%2C+for+the+true+and+sincere+worship+of+God%2C+that+they+may+serve+Him+purely+without+human+additions+or+inventions.+Thus+goes+the+cry%3B+and+a+company+of+poor%2C+ignorant%2C+well-meaning+souls%2C+because+it+is+very+demurely+and+gravely+spoken%2C+take+it+up+and+join+with+it%2C+never+examining+the+grounds+and+bottom+of+it%3B+but+conclude+that+these+must+needs+be+in+the+right+who+complain+of+corruptions+and+pretend+to+a+happy+and+glorious+reformation.+Alas%2C+my+brethren%2C+was+there+ever+any+schism+in+the+world+that+did+not+plead+the+same%3F+Did+not+others+upon+the+same+pretences+separate+from+their+communion+upon+which+they+now+separate+from+ours%3F+And+may+not+the+same+argument+serve+to+crumble+them+into+infinite+fractions+and+subdivisions%3F+till+at+last+we+come+to+have+almost+as+many+Churches+as+men%2C+and+scarce+a+man+constant+and+coherent+to+himself.+But+what+is+it+in+our+worship+which+they+dislike%3F+The+substantials+of+it+are+all+the+same+with+their+own%3A+We+utterly+disavow+that+we+make+that+any+part+of+worship+which+the+Scripture+has+not%3A+and+I+think+that+man+very+much+forsaken+of+reason+and+common+understanding+who+shall+endeavour+to+persuade+us+that+we+intend+worship+when+we+ourselves+most+earnestly+and+seriously+profess+the+contrary.+Is+it+then+that+we+differ+about+mere+accidents+and+circumstances%3F+I+confess+we+do%3A+but+assert+withal+that+these+things+are+not+a+just+cause+of+separation+from+us.+If+we+look+back+upon+the+primitive+times%2C+we+shall+find+that+almost+every+Church+had+its+different+rites+and+observances%3B+and+yet+under+that+diversity+maintained+unity+and+communion%3A+Yea%2C+and+at+this+day%2C+the+reformed+Churches+observe+different+customs+one+from+another+and+yet+they+inviolably+hold+communion+together+and+we+with+them.+The+Gallican%2C+Belgic%2C+Helvetian+and+German+Churches+reject+us+not%2C+nor+we+them%2C+although+we+differ+in+rites+and+discipline%2C+and+those+things+which+are+left+to+the+prudence+of+every+Church+to+constitute+as+they+shall+judge+most+necessary+for+order+and+edification.+Now+certainly+if+these+different+rites+and+observances+be+no+ground+for+one+national+Church+to+separate+from+the+communion+of+another%2C+they+can+be+no+ground+for+private+persons+to+separate+from+the+communion+of+that+Church+to+which+they+belonged.+Nay%2C+although+they+might+with+reason+dislike+many+usages+either+as+frivilous+or+incongruous%2C+yet+it+becomes+the+temper+and+modesty+of+a+pious+Christian%2C+in+things+merely+circumstantial%2C+to+submit+his+practice+to+the+judgment+of+that+authority+under+which+he+lives+and+not+to+separate+from+the+communion+of+the+Church%2C+to+forsake+its+assemblies%2C+to+disown+its+administrations%2C+only+because+he+thinks+some+things+might+be+more+conveniently+ordered+according+to+the+model+of+his+own+or+other+men%E2%80%99s+apprehensions%3A+Which+in+the+folly+and+sad+consequences+of+it%2C+would+be+to+act+like+him+who+took+up+a+beetle+%5Bmallet%5D%2C+and+struck+with+all+his+force+to+kill+a+fly+that+he+saw+on+his+friend%E2%80%99s+forehead.+What+else+were+this+but+to+rend+the+body+of+Christ+by+an+angry+contending+about+the+fashion+of+its+garments%2C+and+to+tear+away+its+limbs+by+a+violent+striving+to+strip+off+those+clothes+which+they+think+indecent%3F+For+my+part+I+freely+profess+that+were+my+lot+cast+among+any+of+the+Reformed+Churches+beyond+the+seas%2C+I+would+presently+join+in+their+communion+and+not+at+all+scruple+to+conform+myself+to+their+received+customs%2C+although+perhaps+in+my+own+private+persuasion+I+may+judge+some+of+them+to+be+less+serious+and+less+reverent+than+those+of+the+Church+of+England%2C+which+are+now+so+passionately+decried+and+condemned.+I+have+ever+venerated+that+oracular+advice+of+St.+Ambrose+to+St.+Augustine%3A+%E2%80%98If+thou+wilt+neither+give+offence%2C+nor+take+offence%2C+conform+thyself+to+all+the+lawful+customs+of+the+Churches+where+thou+comest.%E2%80%99+%28Augustine+to+Januarius%2C+epistle+118%29+But+I+will+not+farther+enlarge+on+this+choloric+and+touchy+controversy%3B+only+I+pray+that+our+wanton+dissensions+about+these+less+important+matters+may+not+provoke+God+to+deprive+us+of+the+substance+and+essentials+of+our+religion+and+reduce+us+to+such+a+condition+wherein+we+should+be+heartily+glad+could+we+enjoy+the+liberty+of+the+Gospel+and+the+ordinances+of+our+Lord+Jesus+Christ+under+any+of+those+forms+of+administration+which+are+now+so+furiously+debated+amongst+us.+It+were+just+with+God+to+extinguish+the+light+of+his+Gospel+when+we+use+it+not+to+work+by%2C+but+all+our+study+and+strife+is+how+to+snuff+it.%E2%80%9D%0A%0A%E2%80%94+Ezekiel+Hopkins%2C+An+Exposition+on+the+Ten+Commandments%E2%80%A6+%28London%3A+Ranew%2C+1691%29%2C+Second+Commandment%2C+pp.+126-34&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd00680e9d7.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d00680e9d7.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=We%20ought%20not%20to%20worship%20God,strife%20is%20how%20to%20snuff%20it&amp;text=We%20ought%20not%20to%20worship%20God%20with%20any&amp;text=study%20and%20strife%20is%20how%20to%20snuff%20it" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Is this rational, that where two commands of the magistrate are joined, the one undoubtedly lawful to be obeyed, the other doubted of, that subjects should disobey the magistrate in that which is clearly lawful, because they have a doubt or unclearness anent obeying him in the other command? Does it not become subjects to go as far on in obedience to lawful authority as they see they may without sin against God? Then it is time to stop when anything is put to them by virtue of the king’s command which they clearly see they cannot do without sin.</p></blockquote>

<blockquote><p>They who write on this subject with judgment and understanding, use to distinguish three sorts of modes of men’s actions that are found in religion, viz. circumstances, rites and ceremonies. Circumstances are modifications of actions, as time, place, person; or, a circumstance is any thing that accompanies an action which is not of its essence, but is used with it, relates to it, and is an accident, or adjunct of it: and it may be such, either with respect to the pysical or moral being of the action: Circumstances use to be sorted in these memorial verses: ‘Quis, quid, ubi, quibus auxiliis, cur, quomodo, quando.’ And ‘forma, figura, locus, tempus, stirps, patria, nomen.’ Circumstance is a word of larger extent than rite, and that than ceremony; a rite is the manner of going about any action (chiefly that which is public or solemn) confirmed by law or custom.</p></blockquote>

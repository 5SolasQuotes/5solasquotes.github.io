<main class="wrap"><figure class="quote" id="q-a572ba3041" data-kw="">
<blockquote><p>Yet notwithstanding, I allow their constancy which strive for a just cause, being forced against their wills unto contention. I do worthily condemn frowardness which does hinder and stay the holy carefulness of reforming the Church. And as I behave myself gentle and tractable in mean [lowly] things (as external ceremonies), so do I not always judge it profitable to give place to their foolish stoutness which will forsake nothing of their old wonted [accustomed] custom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>William Whittingham, A Brief Discourse of the Troubles begun at Frankfurt in Germany, 1554, about the Book of Common Prayer &amp; Ceremonies, &amp; Continued by the English Men there to the end of Queen Mary’s Reign [1558] (1574), ‘The Answer &amp; Judgement of… John Calvin… touching the [Service] Book of England’</cite>, p. XXXV</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“Yet notwithstanding, I allow their constancy which strive for a just cause, being forced against their wills unto contention. I do worthily condemn frowardness which does hinder and stay the holy carefulness of reforming the Church. And as I behave myself gentle and tractable in mean [lowly] things (as external ceremonies), so do I not always judge it profitable to give place to their foolish stoutness which will forsake nothing of their old wonted [accustomed] custom.”

— John Calvin, William Whittingham, A Brief Discourse of the Troubles begun at Frankfurt in Germany, 1554, about the Book of Common Prayer &amp; Ceremonies, &amp; Continued by the English Men there to the end of Queen Mary’s Reign [1558] (1574), ‘The Answer &amp; Judgement of… John Calvin… touching the [Service] Book of England’, p. XXXV">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CYet+notwithstanding%2C+I+allow+their+constancy+which+strive+for+a+just+cause%2C+being+forced+against+their+wills+unto+contention.+I+do+worthily+condemn+frowardness+which+does+hinder+and+stay+the+holy+carefulness+of+reforming+the+Church.+And+as+I+behave+myself+gentle+and+tractable+in+mean+%5Blowly%5D+things+%28as+external+ceremonies%29%2C+so+do+I+not+always+judge+it+profitable+to+give+place+to+their+foolish+stoutness+which+will+forsake+nothing+of+their+old+wonted+%5Baccustomed%5D+custom.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+William+Whittingham%2C+A+Brief+Discourse+of+the+Troubles+begun+at+Frankfurt+in+Germany%2C+1554%2C+about+the+Book+of+Common+Prayer+%26+Ceremonies%2C+%26+Continued+by+the+English+Men+there+to+the+end+of+Queen+Mary%E2%80%99s+Reign+%5B1558%5D+%281574%29%2C+%E2%80%98The+Answer+%26+Judgement+of%E2%80%A6+John+Calvin%E2%80%A6+touching+the+%5BService%5D+Book+of+England%E2%80%99%2C+p.+XXXV&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa572ba3041.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a572ba3041.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/scottish-theology/free-church-of-scotland/quotes-on-the-right-of-continued-protest/#:~:text=Yet%20notwithstanding%2C%20I%20allow%20their%20constancy,of%20their%20old%20wonted%20%5Baccustomed%5D%20custom&amp;text=Yet%20notwithstanding%2C%20I%20allow%20their%20constancy%20which%20strive&amp;text=forsake%20nothing%20of%20their%20old%20wonted%20%5Baccustomed%5D%20custom" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-acd534d569" data-kw="">
<blockquote><p>For some went a great length in compliance with the defections of these times [1662-1688]; others durst not comply… ministers and people were obliged to withdraw from these courses which they were convinced in their conscience to be sinful… But this was without any design ever to own these things to be sufficient grounds of separation in a constitute Church, or when with personal safety application could be made to settled Church judicatories who were not under the tyrannical influence of enemies to the work of God… Also there are many alive to this day who know when the Informatory Vindication [1687] was to be printed, that it was sent to Holland to be showed to some of us who were then abroad; and that we declared we could never own the grounds of separation laid down therein to justify a separation from a settled Church in a peaceable state [such as after 1690]… and for this cause it is often added as a qualification to the grounds of withdrawing that they were to be understood ‘in the case of such differences and so circumstantiate[d].’ Informatory Vindication, page 67, ‘In this broken and declining sate of the Church,’ ibid., page 73, 76, 78, 80, 82, 84, 86, 87, 88. To which also the worthy martyr Mr. James Renwick, minister of the Gospel, assented.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/alexander-shields.html">Alexander Shields</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Enquiry into Church-Communion, or, A Treatise Against Separation from the Revolution Settlement of this National Church, as it was settled in 1689 2nd ed. (1706; Edinburgh: William Gray, 1747) 154 pp. no ToC</cite>, pp. v-vi</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“For some went a great length in compliance with the defections of these times [1662-1688]; others durst not comply… ministers and people were obliged to withdraw from these courses which they were convinced in their conscience to be sinful… But this was without any design ever to own these things to be sufficient grounds of separation in a constitute Church, or when with personal safety application could be made to settled Church judicatories who were not under the tyrannical influence of enemies to the work of God… Also there are many alive to this day who know when the Informatory Vindication [1687] was to be printed, that it was sent to Holland to be showed to some of us who were then abroad; and that we declared we could never own the grounds of separation laid down therein to justify a separation from a settled Church in a peaceable state [such as after 1690]… and for this cause it is often added as a qualification to the grounds of withdrawing that they were to be understood ‘in the case of such differences and so circumstantiate[d].’ Informatory Vindication, page 67, ‘In this broken and declining sate of the Church,’ ibid., page 73, 76, 78, 80, 82, 84, 86, 87, 88. To which also the worthy martyr Mr. James Renwick, minister of the Gospel, assented.”

</figure><figure class="quote" id="q-e8df1c9822" data-kw="">
<blockquote><p>I was a Protester, and I never saw cause to repent it; yet, if any minister would now revive that controversy, I would have all freedom to vote his deposition.</p></blockquote>

</figure><figure class="quote" id="q-0ed5b45341" data-kw="">
<blockquote><p>It’s no duty [to separate from an impure church], as he elsewhere says, because there is no command; it’s no duty, and therefore we read not this word, ‘come forth’, in any of the epistles written to the seven Churches [in Rev. 2-3], against which Christ says He has such and such things. They that lived in the impurer are not called forth into the purer, but there are promises made to them that keep themselves pure, and duties enjoined them toward the impurer part. For we may not make every disease the plague. Shall the sons of God, the angels, forsake the Lord’s Presence because Satan came also amongst them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On Sacrament, p. 246 &amp; p. 31 as quoted in A Collection of Cases &amp; other Discourses lately written to recover Dissenters to the communion of the Church of England by some Divines of the City of London (London, 1685), vol. 1, ‘The Non-Conformists Plea for Lay-Communion with the Church of England’</cite>, p. 55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/schism-and-separation.html">Schism and Separation</a></span></div>
<div class="actions"><button class="copy" data-copy="“It’s no duty [to separate from an impure church], as he elsewhere says, because there is no command; it’s no duty, and therefore we read not this word, ‘come forth’, in any of the epistles written to the seven Churches [in Rev. 2-3], against which Christ says He has such and such things. They that lived in the impurer are not called forth into the purer, but there are promises made to them that keep themselves pure, and duties enjoined them toward the impurer part. For we may not make every disease the plague. Shall the sons of God, the angels, forsake the Lord’s Presence because Satan came also amongst them?”

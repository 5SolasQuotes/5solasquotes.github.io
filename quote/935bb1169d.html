<main class="wrap"><figure class="quote" id="q-935bb1169d" data-kw="">
<blockquote><p>There being too many filthy Dreamers crept in among us, who by their filthy Dreams Blaspheme that worthy Name whereby we are called, renouncing that One Holy, Blessed and Eternal God in three Persons, the Father, the Son, and the Holy Spirit, into whose Name we are Baptized; and that one only Mediator between God and Man, that Man Christ Jesus, and the whole Doctrine of divine efficiency both in the decree, particularly Election and Reprobation, and the execution thereof in the fall and restitution in Redemption, and the application thereof, and so denying the resurrection and the last judgement, together with the authority of the holy Scriptures, yea, under the sacred words, Repent, Repent, calling upon men to renounce and deny all their Religion, and the profession and practise thereof, saying (as Edward Burrows in his Preface to George Foxes’ Mystery) that they have sufficient cause to cry against us, and to deny our ministry, our Church, our Worship, and our whole Religion:

And some of them (called and known by the name of Quakers) under the pretence of the light within them, and of the Spirit as their only Rule, having (even of their Women) been acted in a most beastly, shameful and horrid manner among us, against the very light of nature, and the common dictates of modesty, especially in that Sex, so as to go openly, and wholly naked, in the day time, in some of our most frequented streets, and of our public Assemblies. Another of them to transform her self into a deformed shape, as ’twere of the Devil, unto not only the disturbance and affrighting of others in the solemn Assembly for Worship, but to the hazarding thereby the lives of divers Women with Child, together with the fruit of the Womb, as happened on the Lord’s day in Boston on the 8th. of this month, (beside other practical abominations which their Principles lead them to.)</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9d2b6c7659" data-kw="">
<blockquote><p>It has often been said that the Puritans and Covenanters were strict Sabbatarians, while the continental Reformers took a more relaxed attitude to the Lord’s Day, even allowing people to indulge in recreation. Henry Bullinger, however, challenges this assumption:

They transgress this commandment, that cease not from evil works, but abuse the sabbath’s rest to the provoking of fleshly pleasures. For they keep the Sabbath to God, but work to the devil, in dicing, in drinking, in dancing, and feeding their humours with the vanities of this world, whereby we are not drawn from the company of the holy congregation, but do also defile our bodies, which we ought rather to sanctify and keep holy.</p></blockquote>

<blockquote><p>Bruce Winter has developed a case that elite Roman ‘new women’ brought into the church at Corinth a style of dress that was offensive and disruptive to church unity, as well as an affront to Rome itself. As a response to this avantgarde feminine independence, Winter situates the άγγέλοι of 1 Cor. 11.10 and the ίδιώται of 1 Cor. 14.23-24 as agents of the State who are sent to investigate the behavior of such Christian women at worship. This study considers Winter’s novel claim and concludes that the evidence does not justify such an interpretation.</p></blockquote>

<blockquote><p>God who is the Creator of all things is also the sovereign and perpetual Lord; he can never set aside his right. And when he distributes to men he always reserves for himself the power and authority to take them away and transfer them to whomever he please. This is the reason that Job, after having gone through so many losses, said, “The Lord has given, and the Lord has taken way; blessed be the name of the Lord.” He recognized that everything is at God’s disposition, and that whatever way he may use it, he never does us any wrong.</p></blockquote>

</figure><figure class="quote" id="q-a01a06ae7a" data-kw="">
<blockquote><p>The date of its publication is almost all that has been ascertained in regard to the circumstances in which this “Peace-offering” appeared. We are inclined to attach to it considerable value; and of all the writings of Owen in defence of Nonconformity, in the trying and critical period of its history when this tract was published (1667), there is none in which the case of the Nonconformists is more simply and conclusively argued, or more likely to produce a greater effect on the modern reader. Very earnest in its tone, and yet very moderate in its language,—calm, and yet most impressive in the appeal which it contains,—it affords a pleasing illustration alike of the meekness of wisdom and the wisdom of meekness.

It seems impossible to read it without a mingled feeling of regret and indignation that there ever should have been a time when men breathing the spirit which our author here breathes should have been denied religious freedom and the rights of conscience on the soil of Britain. The chief fault of the tract is its very moderation, as “a humble plea,”—for an “indulgence,” too, in the exercise of those rights which no government is either able to confer or entitled to withhold, and the protection of which is one of the highest ends of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-h-goold.html">William H. Goold</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Prefatory Note to John Owen, A Peace-Offering, in An Apology and Humble Plea for Indulgence and Liberty of Conscience: By Sundry Protestants Differing in some things from the Present Establishment about the Worship of God</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“The date of its publication is almost all that has been ascertained in regard to the circumstances in which this “Peace-offering” appeared. We are inclined to attach to it considerable value; and of all the writings of Owen in defence of Nonconformity, in the trying and critical period of its history when this tract was published (1667), there is none in which the case of the Nonconformists is more simply and conclusively argued, or more likely to produce a greater effect on the modern reader. Very earnest in its tone, and yet very moderate in its language,—calm, and yet most impressive in the appeal which it contains,—it affords a pleasing illustration alike of the meekness of wisdom and the wisdom of meekness.

It seems impossible to read it without a mingled feeling of regret and indignation that there ever should have been a time when men breathing the spirit which our author here breathes should have been denied religious freedom and the rights of conscience on the soil of Britain. The chief fault of the tract is its very moderation, as “a humble plea,”—for an “indulgence,” too, in the exercise of those rights which no government is either able to confer or entitled to withhold, and the protection of which is one of the highest ends of government.”

— William H. Goold, Prefatory Note to John Owen, A Peace-Offering, in An Apology and Humble Plea for Indulgence and Liberty of Conscience: By Sundry Protestants Differing in some things from the Present Establishment about the Worship of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+date+of+its+publication+is+almost+all+that+has+been+ascertained+in+regard+to+the+circumstances+in+which+this+%E2%80%9CPeace-offering%E2%80%9D+appeared.+We+are+inclined+to+attach+to+it+considerable+value%3B+and+of+all+the+writings+of+Owen+in+defence+of+Nonconformity%2C+in+the+trying+and+critical+period+of+its+history+when+this+tract+was+published+%281667%29%2C+there+is+none+in+which+the+case+of+the+Nonconformists+is+more+simply+and+conclusively+argued%2C+or+more+likely+to+produce+a+greater+effect+on+the+modern+reader.+Very+earnest+in+its+tone%2C+and+yet+very+moderate+in+its+language%2C%E2%80%94calm%2C+and+yet+most+impressive+in+the+appeal+which+it+contains%2C%E2%80%94it+affords+a+pleasing+illustration+alike+of+the+meekness+of+wisdom+and+the+wisdom+of+meekness.%0A%0AIt+seems+impossible+to+read+it+without+a+mingled+feeling+of+regret+and+indignation+that+there+ever+should+have+been+a+time+when+men+breathing+the+spirit+which+our+author+here+breathes+should+have+been+denied+religious+freedom+and+the+rights+of+conscience+on+the+soil+of+Britain.+The+chief+fault+of+the+tract+is+its+very+moderation%2C+as+%E2%80%9Ca+humble+plea%2C%E2%80%9D%E2%80%94for+an+%E2%80%9Cindulgence%2C%E2%80%9D+too%2C+in+the+exercise+of+those+rights+which+no+government+is+either+able+to+confer+or+entitled+to+withhold%2C+and+the+protection+of+which+is+one+of+the+highest+ends+of+government.%E2%80%9D%0A%0A%E2%80%94+William+H.+Goold%2C+Prefatory+Note+to+John+Owen%2C+A+Peace-Offering%2C+in+An+Apology+and+Humble+Plea+for+Indulgence+and+Liberty+of+Conscience%3A+By+Sundry+Protestants+Differing+in+some+things+from+the+Present+Establishment+about+the+Worship+of+God&amp;url=https%3A%2F%2F5solasqu

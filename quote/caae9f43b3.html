<main class="wrap"><figure class="quote" id="q-caae9f43b3" data-kw="">
<blockquote><p>God in his Word reveals Himself to be Jehovah Elohim, i.e. one God subsisting in three Persons. Though essence and subsistence, that is, the divine nature, and the Trinity of Persons in that nature, are the same thing, they being distinguished not as a Being and a Being, but as the manner of a Being or thing is distinguished from the Being or thing itself: yet for the help of our apprehension, God being pleased so far to condescend to our capacity (as delighting to be understood by us), we first consider of the essence, then of the subsistence.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-norton.html">John Norton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Orthodox Evangelist… (London: Macock, 1654), ch. 1, ‘Of the Divine Essence’</cite>, pp. 1-2</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-64e8d980e2" data-kw="">
<blockquote><p>This thesis presents a case for the traditional doctrine of divine simplicity by construing it along the lines that God exists as actus purus. My formulation of divine simplicity draws upon the medieval insight that God is what He is in virtue of what He does in one, eternal act of will with which He is identical. In chapter I, I survey the contemporary literature on divine simplicity. In chapter II, I critique Alvin Plantinga’s Platonic theory of the divine attributes… In chapter III, I provide rejoinders to all of Plantinga’s defeaters against divine simplicity… In chapter IV, I develop a viable theory of divine simplicity, given an actus purus conception of God, and I formulate a number of arguments supporting it… As such, I seek to demonstrate that the traditional understanding of the divine essence is something that is worthy for theists to embrace and to explore…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allen-stanley-gehring.html">Allen Stanley Gehring</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Simplicity as Actus Purus Ref (Texas A &amp; M University, 2005)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><figure class="quote" id="q-9441992a73" data-kw="">
<blockquote><p>For it is commonly conceded today that a composition in concepts does not argue to a real composition in the thing. For if the formal notion of one perfection (for example knowing, even if the knowing is omniscient) does not include the formal notion of another perfection (for example loving, even if the loving is altogether perfect), then to be sure this fact does not necessarily imply that both perfections have, in respect of the thing (e.g. God), the idea of parts and so the idea of being mutually perfectible. But this condition would be required for having composition on the part of the thing. If we were able to conclude anything from the conceptual separability of one perfection from another, then some non-identity on the part of the thing would be proved (as a virtual or so-called formal non-identity, which we will deal with in the treatment of the formal distinction). But such a non-identity implies neither composition nor imperfection in the being that has those perfections. At most, indeed, a reason is to be sought why one such perfection is found in the same thing along with another perfection not included in the formal concept of the first, but I do not know why the only adequate assignable reason for explaining it must be found in a mutual perfectability (a perfectibility after the manner of parts) that those perfections have on the side of the thing. But if anyone wishes to dispute this question, let him do so.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/allan-b-wolter.html">Allan B. Wolter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Little Summary of Metaphysics (Milwaukee: Bruce Publishing Co., 1958), pt. 1, article 2, pp. 17-18 Wolter was a Scotus scholar and writes from that perspective.</cite></span></figcaption>

<blockquote><p>III. Because the essence and attributes of the Deity are not immediately, adequately comprehended by the human mind, as they are in themselves, and so perfectly: but only through the way of negation, causality, eminence: for here the human mind conducts itself as the eyes of owls to the sun.</p></blockquote>

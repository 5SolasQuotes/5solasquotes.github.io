<main class="wrap"><figure class="quote" id="q-4a9991e9c3" data-kw="">
<blockquote><p>…faith is the beginning and root of all gospel righteousness, without which no virtue contributing to salvation can exist in a man, and which therefore, if it be not impeded, will attract all other virtues to it, so that Paul, when he expresses all the obedience described in the gospel under the name of faith, speaks in the same manner as the Latin writers do when they use hearing for obeying, as in Terence: “Shall I assist Pamphilus, or listen to the old man?” which figure is called the metonymy of the antecedent for the consequent;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-bull.html">George Bull</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Harmonia Apostolica, or the Mutual Agreement of St. Paul &amp; St. James, comprising a Complete View of Christian Justification</cite>, … tr. Thomas Wilkinson (1669-1670; London: Rivington, 1801) 320 pp. ToC, p. 95</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-754d50b87f" data-kw="">
<blockquote><p>…upon the first moment that a man believes he is justified, and all his sins-past are actually pardoned, his sins to come virtually, so that no following sin shall unjustify him; though it may take away his aptitude for heaven, yet not his right: and though his sin may deserve damnation, and without actual repentance and faith he cannot be saved, yet grace shall be given to enable him to repent and believe, so that though there must be nova remissio [a new remission], yet there is not nova justificatio [a new justification]; though a new remission is needful, yet not a new justification; pardon of sin is a continued act, but our justification quoad statum [as far as the state] is done simul et semel, ‘once and for all’; this you know to be the Orthodox opinion…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-warren.html">Thomas Warren</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Unbelievers No Subjects of Justification, Nor of Mystical Union to Christ</cite>, … (London, 1654), ch. 11, pp. 250-51</span></figcaption>

</figure><figure class="quote" id="q-971fd04fa4" data-kw="">
<blockquote><p>if heretics wanted only the merits of Christ to be imputed to us, because they are given to us, and we can offer them to God the Father for our sins, since Christ undertakes the burden of satisfying for us, and not reconciling us to God the Father, their opinion would be correct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses published at Various Times in the Academy of Sedan</cite>, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Imputed Righteousness’, pp. 259-61 Latin | XXXIII. Indeed, not even our way of speaking is dared to be simply condemned by the Roman School of Theology, for they concede that it can be said in a sound sense that the righteousness of Christ is imputed to us and becomes ours. Indeed, that sound sense according to which they interpret that expression is the very one that we intend. This is clearly evident from Bellarmine, bk. 2, On Justification, ch. 7, §4: “Fourth, it is refuted. For,” he says</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>
<div class="actions"><button class="copy" data-copy="“if heretics wanted only the merits of Christ to be imputed to us, because they are given to us, and we can offer them to God the Father for our sins, since Christ undertakes the burden of satisfying for us, and not reconciling us to God the Father, their opinion would be correct.”

— Louis Le Blanc, Theological Theses published at Various Times in the Academy of Sedan, vol. 2 3rd ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), ‘On Imputed Righteousness’, pp. 259-61 Latin | XXXIII. Indeed, not even our way of speaking is dared to be simply condemned by the Roman School of Theology, for they concede that it can be said in a sound sense that the righteousness of Christ is imputed to us and becomes ours. Indeed, that sound sense according to which they interpret that expression is the very one that we intend. This is clearly evident from Bellarmine, bk. 2, On Justification, ch. 7, §4: “Fourth, it is refuted. For,” he says">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9Cif+heretics+wanted+only+the+merits+of+Christ+to+be+imputed+to+us%2C+because+they+are+given+to+us%2C+and+we+can+offer+them+to+God+the+Father+for+our+sins%2C+since+Christ+undertakes+the+burden+of+satisfying+for+us%2C+and+not+reconciling+us+to+God+the+Father%2C+their+opinion+would+be+correct.%E2%80%9D%0A%0A%E2%80%94+Louis+Le+Blanc%2C+Theological+Theses+published+at+Various+Times+in+the+Academy+of+Sedan%2C+vol.+2+3rd+ed.+tr.+by+AI+by+Colloquia+Scholastica+at+Discord+%281675%3B+London%2C+1683%29%2C+%E2%80%98On+Imputed+Righteousness%E2%80%99%2C+pp.+259-61+Latin+%7C+XXXIII.+Indeed%2C+not+even+our+way+of+speaking+is+dared+to+be+simply+condemned+by+the+Roman+School+of+Theology%2C+for+they+concede+that+it+can+be+said+in+a+sound+sense+that+the+righteousness+of+Christ+is+imputed+to+us+and+becomes+ours.+Indeed%2C+that+sound+sense+according+to+which+they+interpret+that+expression+is+the+very+one+that+we+intend.+This+is+clearly+evident+from+Bellarmine%2C+bk.+2%2C+On+Justification%2C+ch.+7%2C+%C2%A74%3A+%E2%80%9CFourth%2C+it+is+refuted.+For%2C%E2%80%9D+he+says&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F971fd04fa4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/971fd04fa4.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/justification#:~:text=if%20heretics%20wanted%20only%20the%20merits,Father%2C%20their%20opinion%20would%20be%20correct&amp;text=if%20heretics%20wanted%20only%20the%20merits%20of%20Christ&amp;text=God%20the%20Father%2C%20their%20opinion%20would%20be%20correct" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2e9a0f1074" data-kw="">
<blockquote><p>We constantly want to justify ourselves before God, to be good enough without Christ. But God does not want us to trust in our goodness. He does not want us to make up for our past sins through present obedience. He does not want us to think that we are good enough to go to heaven by comparing ourselves to the Hitlers and Stalins of the world. Comparisons are useless when it comes to establishing righteousness before God. God crucified His one and only Son for our justification, and He wants us to trust in Him alone. When it comes to being justified, faith plus anything else is quicksand. The only ground for right standing before God is Christ Jesus grabbed ahold of by faith.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jay-harvey.html">Jay Harvey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Don’t Call it a Comeback</cite>, p. 101</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a></span></div>

</figure><figure class="quote" id="q-31ccf53a7e" data-kw="">
<blockquote><p>Justification has a positive and a negative element. It consists at once in the removal of guilt and the imputation, or granting, of righteousness. It rescues the sinner as a brand from the burning and at the same time gives him a title to Heaven. If it failed to do either of these, it would fail to do anything. For man, as a sinner against God, must have that enormous guilt somehow removed. But, at the same time, if he had the guilt removed, he would still be devoid of positive righteousness and with no title to Heaven and would also be certain to fall again into sin and condemnation. If Christ only cancelled out guilt, He would merely return the sinner to Adam’s original state without Adam’s original perfection of nature. There must be the “double cure.”</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-gerstner.html">John Gerstner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theology for Everyman</cite>, ch. 6</span></figcaption>

<main class="wrap"><figure class="quote" id="q-1d1a38ecd5" data-kw="">
<blockquote><p>Question: But surely the calling and promise are universal. Answer: Understand them to be indefinite (yea and that in respect of certain circumstances of which I have spoken) and thou shalt think the rightlier… Or else see, how very reason of necessity confutes that universal calling. For if ye mean it of the calling by the preaching of the Word: it is not true that all men are, or ever were, yea or ever shall be called so severally hereafter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Book of Christian Questions &amp; Answers</cite>, … (London, 1574), p. 79</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-724be95ba8" data-kw="">
<blockquote><p>Question. How many sorts of callings or calls are there? Answer. There is a double call, viz. particular [to an office] and general [to salvation]: … Secondly, there is a general call unto salvation, which is twofold, to wit, ineffectual and effectual: First, there is an effectual calling, which is twofold, to wit, a calling whereby God calls all men, and a call whereby He calls the outward Church: First, there is an effectual call whereby God calls all men, and this is twofold, to wit: First, the Word of God, which is said to call all, and that both because it speaks unto all without difference; ‘Come all,’ etc. Mk. 11:24 &amp; Acts 17:30 &amp; 10:35, and also because the sound thereof goes into all the world, or unto the utmost parts of the world. Rom. 10:17; Ps. 19:4: The book of the creatures for the invisible things of God are seen in the creation, Rom. 1:20, and there are some marks and impressions or prints of God in every creature: Secondly, there is an effectual call, whereby God calls the eternal Church, to wit, the whole Church professing the Gospel outwardly, whether they be Papists, Arians, Heretics, Anabaptists or Protestants: Whence we may learn that all in the outward Church are called, and therefore many are called; this is clear from this verse: and chap. 20:16; Lk. 14:16.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Canterbury’s Doom, or the first part of a complete history of the commitment, charge, trial, condemnation, execution of William Laud</cite>, ... (London: Macock, 1646), 73. ‘Passages razed out concerning our effectual vocation’, pp. 343-44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><figure class="quote" id="q-e12333728f" data-kw="">
<blockquote><p>…Whether pastors are to be believed or obeyed any farther than they show a Word of God revealing or commanding the particular thing? Divine faith and obedience is one thing, and human is another: 1. If as a preacher he say, ‘This is God’s Word, believe it and obey it as such,’ you must believe with a human faith that it is likelier that he knows what he says than you do (unless 1. you see evidence, 2. or the consent of more credible persons to be against him, and then you are not to believe him at all). Even as a child believes his teacher in order to learn the things himself, so you are so far to take his word while you are learning to know whether it be so or not. But not to rest in it as certain, nor to take your belief of him and obedience to him, to be a believing and obeying God formally, though a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, p. 889</span></figcaption>

<main class="wrap"><figure class="quote" id="q-d23323cc0e" data-kw="">
<blockquote><p>Some say the fundamentals amongst Lutherans are exponed in such a way as the foundation is everted? I answer: There is a twofold eversion of the foundation: 1. One theological, moral and ecclesiastic, as the doctrine of the Council of Trent, which is in a ministerial way, with professed obstinacy against the fundamental truths rightly exponed, and such an eversion of the foundation makes the Popish Church no Church truly visible, whose breasts we can suck. But for Lutherans, their subversion of the foundation by philosophic consequences without professed hatred to the fundamentals, and that not in an ecclesiastic and ministerial way, does not so evert the fundamentals, as that they be no visible Church. The learned [David] Pareus shows that there be no difference betwixt us and Lutherans in heads absolutely necessary to salvation, the dissention is in one point only anent the Lord’s Supper, not in the whole doctrine thereof, but in a part thereof, not necessary for salvation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries (London: Griffin, 1644), pt. 2, ch. 4, sect. 5, Question 3, In what cases it is lawful to separate from a Church?</cite>, pp. 230-31</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

ooks Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-c6c4db6eae" data-kw="">
<blockquote><p>Seeing the motion of furthering ecclesiastical reconcilement amongst Protestants has been hitherto very favourably entertained by foreign States and Churches… that there is a most laudable purpose intended, and a good inclination expressed towards the furthering of the good of all Protestants, for the preservation of true religion and the union of their Churches with ours in the same cause, against the common enemies, which by our divisions are encouraged to intend, and enabled to work out our destruction; which they will certainly bring to pass if the Fatherly providence of our good God, whose counsels are unsearchable, and his ways past finding out, does not prevent their malice, by our loving concurrence in the ways of brotherly union, for the maintaining of his glorious Gospel… Therefore your petitioner does humbly request, that in the order, which hopefully will be made for the observation of that day of fasting and praying, this purpose of ecclesiastical reconcilement of Protestants by the union of their spirits in the truth of God, and against the adversaries of Christ’s Gospel, may be expressly mentioned to be recommended unto God by the prayers of that public meeting. And also, that some divines may be thought upon and nominated unto your petitioner, to whom he should make his address to begin a spiritual correspondence, which in this purpose is necessary, for the preparing and ripening of such proposals, as by the grace of God will be able to bring the wished for union of Protestants in due time to some perfection.</p></blockquote>

</figure><figure class="quote" id="q-5c8d5afc64" data-kw="">
<blockquote><p>The voluntary and unnecessary dividing and separation from a true Church is schismatical. When we put bounds and partitions between it and ourselves, we sin (say some) as did these seducers here taxed by Jude. If the Church be not heretical or idolatrous, or do not by excommunication, persecution, etc. thrust us out of its communion; if it be such an one as Christ the head has communion with, we the members ought not by separation to rend and divide the body. To separate from congregations where the word of truth and Gospel of salvation are held forth in an ordinary way (1 Tim. 3:15), as the proclamations of princes are held forth upon pillars to which they are affixed; where the light of the truth is set up as upon a candlestick to guide passengers to heaven. (Rev. 1:13) To separate from them to whom belong the covenants, and where the sacraments, the seals of the Covenant, and for substance rightly dispensed, where Christ walks in the midst of his golden candlesticks, and discovers his presence in his ordinances, whereby they are made effectual to the conversion and edification of souls, in an ordinary way; where the members are saints by a professed subjection to Christ and his Gospel, and haply have promised this explicitly and openly; where there are sundry who in the judgment of charity may be conceived to have the work of grace really wrought in their hearts by walking in some measure answerable to their profession: I say to separate from these, as those with whom Church communion is not to be held and maintaind, is unwarrantable and schismatical.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-jenkyn.html">William Jenkyn</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of Jude (London: Maxey, 1654), on vv. 17-19</cite>, pp. 589-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

</figure><figure class="quote" id="q-6cd5f142fb" data-kw="">
<blockquote><p>Yea, and although difference in judgment about smaller matters ought not to cause that alienation of affection, and strangeness either among ministers or people, as with many it does; to the great hindrance of the growth of the Gospel; yet towards such as oppose themselves against the truth in main and fundamental articles thereof, Christians are bound to show themselves strange, to shun all voluntary and unnecessary familiarity with them, to show them no countenance. If we shall receive such into our houses, or bid them Godspeed, we make ourselves partakers of their sins, 2 Jn. 10-11.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/arthur-hildersham.html">Arthur Hildersham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>152 Lectures upon Psalm 51… (London: 1635), Lecture 48, on Ps. 51:4 (1626)</cite>, p. 243</span></figcaption>

<blockquote><p>13. And it greatly wrongs such men that they never had right apprehensions of the nature and great necessity of vanity among believers and the Churches of Christ. They cry out ‘Truth must not be sold for peace,’ when they neither know aright what is truth or peace. But by ‘truth’ they mean their own doubtful opinions and by ‘peace’ they mean their own quietness with men. We easily confess that as peace signifies our freedom from persecution or sufferings, or from the reproach of men, the least holy truth is to be preferred before it, and more tenaciously held than it: But if by ‘peace’ they mean the unity and concord of believers or of the Church of God, they speak dangerously and suppose a pernicious falsehood, that God’s truth and such peace or concord may at any time be separated: And it is no wiselier spoken than if they had said, A man’s eye-sight or health is to be preferred before the union of his soul and body, or before the concord of head and heart, or before the conjunction of his members. When as non cutis nulla est affectio [without skin there is no sensation]. Destroy the subject and you destroy the accidents. Without union of parts, the Church is no Church; dividing it is destroying it. A house or kingdom divided cannot stand. And when it is no Church, it has no truth as a Church, nor anything that dividers did contend for. An Integral member may rather be cut off, than the whole should perish: But what member will separate itself from the body? Or who but a murderer will on pretense of curing, be a divider and dissolver? … 16. And they forget that as the body must have its due magnitude, as well as its comely scite [position] of parts; so we must be zealous for the greatness, as well as the purity, the extensive as well as the intensive growth of the Church. And if Christ’s flock be little, they dishonor it that would make it tenfold less than indeed it is; Jer. 30:19, ‘And out of them shall proceed thanksgiving, and the voice of them that make merry: And I will multiply them, and they shall not be few, and I will glorify them, and they shall not be small.&#x27;</p></blockquote>

<div class="actions"><button class="copy" data-copy="“13. And it greatly wrongs such men that they never had right apprehensions of the nature and great necessity of vanity among believers and the Churches of Christ. They cry out ‘Truth must not be sold for peace,’ when they neither know aright what is truth or peace. But by ‘truth’ they mean their own doubtful opinions and by ‘peace’ they mean their own quietness with men. We easily confess that as peace signifies our freedom from persecution or sufferings, or from the reproach of men, the least holy truth is to be preferred before it, and more tenaciously held than it: But if by ‘peace’ they mean the unity and concord of believers or of the Church of God, they speak dangerously and suppose a pernicious falsehood, that God’s truth and such peace or concord may at any time be separated: And it is no wiselier spoken than if they had said, A man’s eye-sight or health is to be preferred before the union of his soul and body, or before the concord of head and heart, or before the conjunction of his members. When as non cutis nulla est affectio [without skin there is no sensation]. Destroy the subject and you destroy the accidents. Without union of parts, the Church is no Church; dividing it is destroying it. A house or kingdom divided cannot stand. And when it is no Church, it has no truth as a Church, nor anything that dividers did contend for. An Integral member may rather be cut off, than the whole should perish: But what member will separate itself from the body? Or who but a murderer will on pretense of curing, be a divider and dissolver? … 16. And they forget that as the body must have its due magnitude, as well as its comely scite [position] of parts; so we must be zealous for the greatness, as well as the purity, the extensive as well as the intensive growth of the Church. And if Christ’s flock be little, they dishonor it that would make it tenfold less than indeed it is; Jer. 30:19, ‘And out of them shall proceed thanksgiving, and the voice of them that make merry: And I will multiply them, and they shall not be few, and I will glorify them, and they shall not be small.&#x27;”

— Richard Baxter, A Second Admonition to Mr. Edward Bagshaw (London: Simmons, 1671), ‘To those Readers…’, pp. 7-8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C13.+And+it+greatly+wrongs+such+men+that+they+never+had+right+apprehensions+of+the+nature+and+great+necessity+of+vanity+among+believers+and+the+Churches+of+Christ.+They+cry+out+%E2%80%98Truth+must+not+be+sold+for+peace%2C%E2%80%99+when+they+neither+know+aright+what+is+truth+or+peace.+But+by+%E2%80%98truth%E2%80%99+they+mean+their+own+doubtful+opinions+and+by+%E2%80%98peace%E2%80%99+they+mean+their+own+quietness+with+men.+We+easily+confess+that+as+peace+signifies+our+freedom+from+persecution+or+sufferings%2C+or+from+the+reproach+of+men%2C+the+least+holy+truth+is+to+be+preferred+before+it%2C+and+more+tenaciously+held+than+it%3A+But+if+by+%E2%80%98peace%E2%80%99+they+mean+the+unity+and+concord+of+believers+or+of+the+Church+of+God%2C+they+speak+dangerously+and+suppose+a+pernicious+falsehood%2C+that+God%E2%80%99s+truth+and+such+peace+or+concord+may+at+any+time+be+separated%3A+And+it+is+no+wiselier+spoken+than+if+they+had+said%2C+A+man%E2%80%99s+eye-sight+or+health+is+to+be+preferred+before+the+union+of+his+soul+and+body%2C+or+before+the+concord+of+head+and+heart%2C+or+before+the+conjunction+of+his+members.+When+as+non+cutis+nulla+est+affectio+%5Bwithout+skin+there+is+no+sensation%5D.+Destroy+the+subject+and+you+destroy+the+accidents.+Without+union+of+parts%2C+the+Church+is+no+Church%3B+dividing+it+is+destroying+it.+A+house+or+kingdom+divided+cannot+stand.+And+when+it+is+no+Church%2C+it+has+no+truth+as+a+Church%2C+nor+anything+that+dividers+did+contend+for.+An+Integral+member+may+rather+be+cut+off%2C+than+the+whole+should+perish%3A+But+what+member+will+separate+itself+from+the+body%3F+Or+who+but+a+murderer+will+on+pretense+of+curing%2C+be+a+divider+and+dissolver%3F+%E2%80%A6+16.+And+they+forget+that+as+the+body+must+have+its+due+magnitude%2C+as+well+as+its+comely+scite+%5Bposition%5D+o

<main class="wrap"><figure class="quote" id="q-16bd4886a2" data-kw="">
<blockquote><p>And in the seventh chapter [Jn. 7:23], He defends this fact of his, saying, ‘If a man upon the Sabbath receive circumcision, that the law of Moses should not be broken; be ye angry with Me, because I haue made a man every whit whole on the Sabbath day?’ If the law of circumcision do bind men to minister and receive it upon the Sabbath, then much more does the law of love bind men to show mercy upon the Sabbath, seeing that it is appointed of God, not to hinder us from, but to further us in all his works, among which the relieving of them that be in necessity, is one of the chief and principal. And as the Lord Jesus Christ came not to destroy the law, but to fulfill it, so He observed it very carefully in this point, and being most full of compassion, did declare it abundantly, by taking all oportunity to succour them that were in misery, even upon the Sabbath, as the fittest time for it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-bownd.html">Nicholas Bownd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Sabbath Plainly Laid forth</cite>, … (London, 1595), | pt. 2, p. 249</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-51ba2af284" data-kw="">
<blockquote><p>Surely that which is most sweet to the soul of God should be most sweet to our souls: You would wonder to hear a man say that he takes as much delight and he can recreate himself as much in reading, in praying, in hearing sermons, in holy conference as you can do in all your good cheer, in playing and drinking of wine in bowls: You think that men are made to say that they have as much pleasure in those things, as playing at cards, and merriment, and music, and good cheer: you call upon them to play at cards with you, or be merry, you say to them, why should you be dumpish and never be merry? They tell you again that they can be as merry and as cheerful in hearing the Word, and praying, and reading, as you in all your playing, and all that you account delightful. You say to them that they have no recreation. They tell you that those things that are your burdens, are their recreation…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jeremiah-burroughs.html">Jeremiah Burroughs</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition with Practical Observations continued upon the Eighth, Ninth and Tenth Chapters of the Prophesy of Hosea</cite>, ... (London: Cole, 1650), pp. 164-65. The context of this does not regard the Sabbath specifically. Burroughs was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-71341c3740" data-kw="">
<blockquote><p>Lastly, if it were granted that Ambrose did entreat Count Arbogastes at a feast, whether will any believe it, who considers the austere life of Ambrose, chastising his body with that discipline (as Paulinus, ibidem) that he observed a daily fast, that he would distain himself with feasts on the Lord’s day which hindred the exercises of religion, either public or private? Nay, truly, He might perhaps dine on the Lord’s day, as the custom of the Church required: but we must not believe that the grave father did fare so daintily on that day as that he could not attend the duties of piety: concerning which nature of feasts we are here speaking: in which number that is to [be] reckoned, which Baronius mentions out of Gregor. Turonens, who tells us of a certain presbyter, invading the Bishopric of Avergue, after the death of Sidonius Apollinaris, who, when the Lord’s day came, having prepared a banquet, commanded that all the citizens should be invited into the Church: a wickedness indeed beseeming the author, that he who had ambitiously invaded the Bishops’ See, against the Canons of the Church, should violate the Lord’s solemnity by his feast, that hindered the duties of divine worship: which unlawful example, I hope nobody that relishes anything of Christ will follow. And now I will conclude with St. Austin [Augustine] (Epistle 86), that none can rightly deny that a Christian may on the Lord’s day be refreshed with a moderate and sober dinner, and also will affirm with that grave father, that those who fear God must not riot on the Lord’s Day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-young.html">Thomas Young</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Lord’s-Day, or a Succinct Narration compiled out of the Testimonies of Holy Scripture &amp; the Reverend Ancient Fathers</cite>, … (London: Leach, 1672), bk. 1, ch. 13, pp. 227-28 Young was a Westminster divine.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

</figure><figure class="quote" id="q-6b751f3b63" data-kw="">
<blockquote><p>As for the recreations, which are here said to serve lawfully to the refreshing of our spirits, this appellation [by an opponent] is very ambiguous; neither do I know any difference between the recreating of our spirits and the refreshing of our spirits: yet here the refreshing of our spirits is made the end of recreation. Again it were good to distinguish between recreation of the body, and recreation of the mind. I think the refreshing of spirits pertains to the recreation of the body; men’s spirits are natural and material things, and they are apt to be wasted first naturally… and spirits thus wasted are recreated, that is, repaired by eating and drinking. And thus provisions of victual are commonly called recreats. 2. Secondly they are wasted also by labour voluntarily undertaken, and these are repaired, as by the former way, so by rest also. And each way we are allowed to recreate our spirits on the Lord’s Day… But now adays many courses are called recreations, wherein there is found little rest; and the natural spirits of man are rather wasted, and his nature tired; far more than the one is repaired, or the other eased. And when all comes to all, I doubt the issue will be to style the pleasures of our senses by the cleanly name of recreations. Now the Jews were expressely forbidden to find their own pleasure on the Lord’s holy day, Isa. 58:13, yet were they not forbidden all pleasure, that belonged only to such a sabbath as was a fast; and therein indeed hypocrites are taxed for finding pleasure on that day, Isa. 58:3. But the weekly Sabbath was for pleasure and delight, but not for man’s own pleasure, nor for the doing of their own ways. But to delight in the Lord, which is spiritual pleasure, and the recreating of our souls in the Lord: this is a blessed rest, thus to rest unto Him; and the Word of God is the best food of the soul; No recreates like unto God’s holy ordinances.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Of the Morality of the Fourth Commandment as still in Force to Bind Christians… (London, 1641) | The Doctrine of the Sabbath Considered, section 8, p. 242</span></figcaption>

<blockquote><p>After dinner [lunch] Eliza Jane and Alice did the dishes, but Father and Mother and Royal and Almanzo did nothing at all. The whole afternoon they sat in the drowsy warm dining-room. Mother read the Bible and Eliza Jane read a book, and Father’s head nodded till he woke with a jerk, and then it began to nod again. Royal fingered the wooden chain that he could not whittle, and Alice looked for a long time out of the window. But Almanzo just sat. He had to. He was not allowed to do anything else, for Sunday was not a day for working or playing. It was a day for going to church and for sitting still. Almanzo was glad when it was time to do the chores.</p></blockquote>

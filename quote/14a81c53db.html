<main class="wrap"><figure class="quote" id="q-14a81c53db" data-kw="">
<blockquote><p>…the private preaching of the gospel, by which individual believers are bound by the common law of love to teach, to admonish and to lead their brethren and neighbors to faith and salvation; but concerning public preaching with authority, the necessity of which is laid upon those who by a special call are consecrated to the public work of the ministry.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, (P&amp;R), vol. 3, 18th Topic, Question 23, p. 215</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e12333728f" data-kw="">
<blockquote><p>…Whether pastors are to be believed or obeyed any farther than they show a Word of God revealing or commanding the particular thing? Divine faith and obedience is one thing, and human is another: 1. If as a preacher he say, ‘This is God’s Word, believe it and obey it as such,’ you must believe with a human faith that it is likelier that he knows what he says than you do (unless 1. you see evidence, 2. or the consent of more credible persons to be against him, and then you are not to believe him at all). Even as a child believes his teacher in order to learn the things himself, so you are so far to take his word while you are learning to know whether it be so or not. But not to rest in it as certain, nor to take your belief of him and obedience to him, to be a believing and obeying God formally, though a duty.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, p. 889</span></figcaption>

</figure><figure class="quote" id="q-6a847a1e60" data-kw="">
<blockquote><p>…as David without immediate revelation from Heaven to direct him, by only the Law of nature, did eat showbread; So is the case here, so answer the casuists and the schoolmen, that a positive law may yield in case of necessity to the good of the Church; so Thomas, Molina, Suarez, Vasquez, Vigverius, Sotus, Scotus, Altisiodorensis, Durand, Gabriel; and consider what the learned Voetius says in this: What if in an extreme case of necessity, a private man, endued with gifts and zeal should teach publicly, after the example of the faithful at Samosaten.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1646) | pt. 1, p. 8</span></figcaption>

</figure><figure class="quote" id="q-3199370867" data-kw="">
<blockquote><p>The officers which Christ hath appointed for the edification of his church, and the perfecting of the saints, are, some extraordinary, as apostles, evangelists, and prophets, which are ceased. Others ordinary and perpetual, as pastors, teachers, and other church-governors, and deacons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Westminster Form of Presbyterial Church-Government</cite></span></figcaption>

— Westminster Assembly, The Westminster Form of Presbyterial Church-Government">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+officers+which+Christ+hath+appointed+for+the+edification+of+his+church%2C+and+the+perfecting+of+the+saints%2C+are%2C+some+extraordinary%2C+as+apostles%2C+evangelists%2C+and+prophets%2C+which+are+ceased.+Others+ordinary+and+perpetual%2C+as+pastors%2C+teachers%2C+and+other+church-governors%2C+and+deacons.%E2%80%9D%0A%0A%E2%80%94+Westminster+Assembly%2C+The+Westminster+Form+of+Presbyterial+Church-Government&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3199370867.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3199370867.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-offices-of-apostles-prophets-evangelists/#:~:text=The%20officers%20which%20Christ%20hath%20appointed,teachers%2C%20and%20other%20church%2Dgovernors%2C%20and%20deacons&amp;text=The%20officers%20which%20Christ%20hath%20appointed%20for%20the&amp;text=as%20pastors%2C%20teachers%2C%20and%20other%20church%2Dgovernors%2C%20and%20deacons" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-13940a8abf" data-kw="">
<blockquote><p>Mr. Hooker [a congregationalist]: ‘If government by independent congregations be insufficient because it authorizes not persons to be pastors over pagans, government by synods is sick of the same disease.’ [Rutherford’s] Answer: [1.] We judge the essence of a pastor not to stand in the call and choice of those to whom they are pastors; for it makes Paul, Barnabas and the apostles to be no pastors to the gentiles and to the heathen, to whom they preach, and [it] makes the apostles as apostles to be no pastors. [Margin Note:] Evangelists are now ceased as well as apostles. 2. Synods from Acts 15 and Acts 13 may lend men, authorized with pastoral power, to heathens to spread the Gospel; and private men as no pastors, but as private men, are intruders [though] authorized by Mr. Hooker, for they have no promise, such as pastors have by Mt. 28:19-20; Mk. 16:15-17; Jer. 1:6,17-18, to plant Churches among the heathens; nor is there a warrant to say that evangelists are ordinary officers left by Christ to plant Churches. If Richard Hooker have any ground from Eusebius or Scripture for evangelists now, or in Trajan’s time, he must show that they have the gift of tongues: for how could evangelists be fellow-helpers to preach the Gospel to the Churches planted by the apostles if they were not an extraordinary office only? See those divines in the margin, and my learned and dear brother, Mr. George Gillespie, Miscellaneous Questions, ch. 7. If the Church should send any to the heathen any way rip[…] for the Gospel, these could be no other than ordinary pastors to them. [Margin Note:] Tilen, Syntagma, dis. 19, th. 38, Apostolorum vice, ubi res poscebat, fungebantur. Professors of Leided, in Synopsis of Pure Theology, dis. […], thesis 17, p. 605; Bucan, in loc., Com. 42, q. 45; Calvin, Commentary on Eph. 4, Apostolis proximi erant Evangelistae, &amp; munus affine habebant. Bullinger, ibid., In plebe potissimum e […]udienda; Zanchi, Com. ibid. Apostolorum Comites—non immediate mi […]—sed assumebantur. Dr. Robert Boyd from Trochoregia, Commentary on Eph. 4, p. 493, Apostolorum Comites modo huc, modo illuc missi, modo re vocati ab Apostolis, extraordinarii.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (London, 1658), p. 472</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span><span class="t"><a href="../topics/church-government-and-the-ministry/the-call-to-ministry.html">The Call to Ministry</a></span></div>

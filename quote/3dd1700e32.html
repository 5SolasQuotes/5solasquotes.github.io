<main class="wrap"><figure class="quote" id="q-3dd1700e32" data-kw="">
<blockquote><p>It is necessary to attribute providence to God. For all the good that is in created things has been created by God, as was shown above (Q. 6, A. 4). In created things good is found not only as regards their substance, but also as regards their order towards an end and especially their last end, which, as was said above, is the divine goodness (Q. 21, A. 4). This good of order existing in things created, is itself created by God. Since, however, God is the cause of things by His intellect, and thus it behooves that the type of every effect should pre-exist in Him, as is clear from what has gone before (Q. 19, A. 4), it is necessary that the type of the order of things towards their end should pre-exist in the divine mind.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa, pt. 1</cite>, quest. 22, art. 1, I answer that</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-bf633d9870" data-kw="">
<blockquote><p>It must first be reiterated that with extraordinary few exceptions no educated person in the history of Western Civilization from the third century B.C. onward believed that the earth was flat. A round earth appears at least as early as the sixth century BC with Pythagoras, who was followed by Aristotle, Euclid, and Aristarchus, among others in observing that the earth was a sphere. Although there were a few dissenters–Leukippos and Demokritos for example–by the time of Eratosthenes (3 c. BC), followed by Crates(2 c. BC), Strabo (3 c. BC), and Ptolemy (first c. AD), the sphericity of the earth was accepted by all educated Greeks and Romans. Nor did this situation change with the advent of Christianity. A fewóat least two and at most five–early Christian fathers denied the spherically of earth by mistakenly taking passages such as Ps. 104:2-3 as geographical rather than metaphorical statements. On the other side tens of thousands of Christian theologians, poets, artists, and scientists took the spherical view throughout the early, medieval, and modern church… No one before the 1830s believed that medieval people thought that the earth was flat… But now, why did the false accounts of Letronne and Irving become melded and then, as early as the 1860s, begin to be served up in schools and in schoolbooks as the solemn truth? The answer is that the falsehood about the spherical earth became a colorful and unforgettable part of a larger falsehood: the falsehood of the eternal war between science (good) and religion (bad) throughout Western history… The reason for promoting both the specific lie about the sphericity of the earth and the general lie that religion and science are in natural and eternal conflict in Western society, is to defend Darwinism. The answer is really only slightly more complicated than that bald statement. The flat-earth lie was ammunition against the creationists. The argument was simple and powerful, if not elegant: “Look how stupid these Christians are. They are always getting in the way of science and progress.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-b-russell.html">J.B. Russell</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Myth of the Flat Earth’</cite>, (1997) at The American Scientific Affiliation</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

</figure><figure class="quote" id="q-2ecfc7a88a" data-kw="">
<blockquote><p>Use 1. Did God make the world and that not from eternity, but in time, about almost six thousand years ago, and no longer? Then here we see He made it not because He needed it, because He wanted it, for if it had been necessary to God, it would have been from eternity…</p></blockquote>

<blockquote><p>‘The first day’ Here the error of those is manifestly refuted who maintain that the world was made in a moment. For it is too violent a cavil to contend that Moses distributes the work which God perfected at once into six days, for the mere purpose of conveying instruction. Let us rather conclude that God Himself took the space of six days, for the purpose of accommodating his works to the capacity of men.</p></blockquote>

</figure><figure class="quote" id="q-4027e08688" data-kw="">
<blockquote><p>When Moses writes that God created Heaven and Earth and whatever is in them in six days, then let this period continue to have been six days, and do not venture to devise any comment according to which six days were one day. But, if you cannot understand how this could have been done in six days, then grant the Holy Spirit the honor of being more learned than you are. For you are to deal with Scripture in such a way that you bear in mind that God Himself says what is written. But since God is speaking, it is not fitting for you wantonly to turn His word in the direction you wish to go.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>What Luther Says. A Practical In-Home Anthology for the Active Christian</cite>, ed. Ewald M. Plass (St. Louis: Concordia, 1959), p. 1523</span></figcaption>

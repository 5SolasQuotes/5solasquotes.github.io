<main class="wrap"><figure class="quote" id="q-c62361e910" data-kw="">
<blockquote><p>It should always be seen to that the song should not be light and frivolous, but that it have weight and majesty, as saith St. Augustine; and also that there is a great difference between the music that is employed for the enjoyment of men at table, and in their houses, and the psalms which they sing in church in the presence of God and his angels. But when the form here given is rightly judged of, we hope that it will be found holy and pure; seeing that it is simply constructed for the edification of which we have spoken, as well as that the use of singing may be greatly extended. So that even in the houses and in the fields, it may be to us an incitement and an instrument or means to praise God and raise our hearts to him; and to console us in meditating on his power, goodness, wisdom, and justice, which is more necessary for us than we know how to express. …This present book [the Genevan Psalter, 1543], for this cause, besides what otherwise has been said, ought to be particularly acceptable to every one who desires, without reproach, and according to God, to rejoice in seeing his own salvation, and the good of his neighbours; and thus has no need to be much recommended by me, as it carries in itself its own value and praise. Only let the world be well advised, that instead of songs partly vain and frivolous, partly foolish and dull, partly filthy and vile, and consequently wicked and hurtful, which it has heretofore used, it should accustom itself hereafter to sing these heavenly and divine songs, with good king David.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Preface to the 1543 Genevan Psalter</span></figcaption>

<blockquote><p>…the retaining and using of temples [church buildings] which have been polluted with idols, be not in itself unlawful, yet the retaining of every such temple is not ever necessary, but sometimes it is expedient for further extirpation of superstition to demolish and destroy some such temples as have been horribly abused to idolatry, as Calvin (Commentary on Dt. 12:2 [80th sermon on Dt., on 12:1-5, pp. 491-92]) also and Zanchius (On the 4th Commandment, col. 709 [in All the Theological Works (1649), vol. 4]) do plainly insinuate.</p></blockquote>

</figure><figure class="quote" id="q-c802b39c4c" data-kw="">
<blockquote><p>I say, we close our prayers ordinarily with praise and glory to the Father, the Son, and the Holy Ghost; because it is warrantable from Scripture-practice, to wit, in blessing; and agreeable to the truth and liberty of Gospel-worship; and yet we refuse it in singing (mark it, not in praising), because, for that exercise, the Lord having instructed us with a sufficient plenty of Divine composures, we think it neither needful nor acceptable that we should gratify an arbitrary imposition in receiving the supplement of a human addition: It is true, the words are Scriptural, but can you say that the Scripture bears any such allowance for their use in singing as it doth for the Psalms of David? Yea and many other spiritual songs in Scripture, whereof you might indeed with some reason reprehend our too great disuse:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist</cite>, … ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect., p. 279-80</span></figcaption>

<blockquote><p>Question. But if we see a fashion used in other countries that we like, may we not take it up? Answer. No… Paul taxes it as a great disorder in the Corinthians that men wore long hair, and women went uncovered, 1 Cor. 11.13-14.</p></blockquote>

<blockquote><p>There is a twofold worship: 1. A civil reverence we give to persons of honour, Gen. 23:7, ‘Abraham stood up and bowed himself to the children of Heth.’ Piety is no enemy to courtesy. 2. A divine worship, which we give to God, is his prerogative-royal, Neh. 8:6, ‘They bowed their heads, and worshipped the Lord with their faces towards the ground.’ This divine worship God is very jealous of; this is the apple of his eye, this is the pearl of his crown which He guards as he did the Tree of Life, with cherubims and a flaming sword, that no man may come near to violate it: Divine worship must be such as God Himself has appointed, else it is offering strange fire, Lev. 10:2.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-watson.html">Thomas Watson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Practical Divinity</cite>, … (London: Parkhurst, 1692), Q. 1, p. 2</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

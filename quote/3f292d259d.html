<main class="wrap"><figure class="quote" id="q-3f292d259d" data-kw="">
<blockquote><p>‘Who has made us fit’. Doctrine: We are neither naturally happy, nor universally so; not naturally, for we are made fit; not born so, not universally; for He has made [us] fit, not all men. Christ died for his sheep only (John 10), for his Church only (Eph. 1), not for the world (John 17). And therefore when the Scripture says, Christ died for all men, we must understand it: First, in respect of the sufficiency of his death, not in respect of the efficiency of it. Secondly, in respect of the common oblation of the benefits of his death externally in the Gospel unto all. Thirdly, as his death extends to all the Elect: for all, that is, for the Elect. Fourthly, for all, that is, for all that are saved, so that none that are justified and saved, are so, but by the virtue of his death. Fifthly, for all, that is for all indefinitely, for all sorts of men, not for every man of every sort. Lastly, He died for all, that is not for the Jews only, but for the Gentiles also.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/nicholas-byfield.html">Nicholas Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition Upon the Epistle to the Colossians</cite>, (1617), p. 99</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-5f83191034" data-kw="definite atonement elect">
<blockquote><p>The common opinion of the Reformed is that Christ (from the mere good-pleasure of the Father) was appointed and given as a Redeemer and head, not to all men, but to a certain number of men. By the election of God, these compose his mystical body. For these alone, Christ (perfectly acquainted with his call) in order to fulfill the decree of election and the counsel of the Father, was willing and determined to die; also to add to the infinite price of his death a most efficacious and special intention to substitute himself in their place and to acquire faith and salvation for them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 14.14.8</span></figcaption>

<blockquote><p>2. It is to be considered, how many ways Christ may be said to give Himself [Greek], a ransom for us, or in our place. … 2. Nor is it true that Christ’s dying for all and every one (which is a dream) makes salvation possible to all so that the Covenant is preachable to all upon condition of believing, Acts 10:43. ‘To Him’ (Jesus anointed, who went about doing good and so was man, v. 38) ‘to Him’ (who was slain in our nature, not for all and every man, v. 39, ‘to Him’) whom God raised up the third day, v. 40. To Him gave all the prophets witness (as it is, v. 43) that through his name, whoever believes in Him shall have remission of sins.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Covenant of Life Opened or A Treatise of the Covenant of Grace</cite>, ... (1655), p. 239 Rutherford is clearly arguing against the Arminian conception here.</span></figcaption>

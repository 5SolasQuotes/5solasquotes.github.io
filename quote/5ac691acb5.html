<blockquote><p>Sep. 25th 1849

My dear Doctor,

I should not have perpetuated the vanity of presenting you with my ugly phiz, had it not been put into my head by our mischievous friend Mrs Shaw. Perhaps however it may stir within your something of the “memory of joys that are past, pleasant and mournful to the soul.” It reminds me this moment of a very lovely one whom you thought like your second self, and who has had her place for years in the General Assembly of the church of the first born. Will you ever visit “Oauld Ireland” again? I am quite on classic ground now alongside Queen’s College and have a warm bed ready for you every day and every night. You will find that since your visit we have become quite scientific.

Most faithfully yours

John Edgar</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edgar.html">John Edgar</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to John Torrey, 25 September 1849 (LuEsther T. Mertz Library, New York Botanical Garden, John Torrey Papers).</cite></span></figcaption>

<blockquote><p>Christ has not made pastors under-kings to create any laws morally obliging the conscience to obedience in the court of God, which God has not made to their hand; if the king and synods only declare and propound, by a power of jurisdiction, that which God in the Law of Nature or the written Word has commanded; they are not the Law-makers, nor creators of that morality in the Law, which lays bonds on the conscience; yea, they have no organical, nor inferior influence in creating that morality, God only by an immediate act as the only immediate king, made the morality, and if king, parliaments and synods be under kings and under Law-givers, they must have an under-action, and a ministerial, subservient, active influence under Christ in creating as second causes, that which is the formal reason, and essence of all laws binding the conscience, and that is the morality that obliges the soul to eternal wrath, though king, parliament, pastors or synods should never command such a moral thing: Now to propound, or declare, that God’s will is to be done in such an act, or synodical directory or canon, and to command it to be observed under civil and ecclesiastical pain, is not to make a law, it is indeed to act authoritatively under Christ as King: but it makes them neither kings, nor Law-givers, no more than heralds are little kings, or inferior law-givers, and parliaments, because in the name and authority of king and parliament they promulgate the laws of king and parliament: The heralds are mere servants, and do indeed represent king and parliament, and therefore to wrong them, in the promulgation of laws, is to wrong king and parliament; but the heralds had no action, no hand at all in making the laws; they may be made when all the heralds are sleeping, and so by no propriety of speech can heralds be called mediate kings, under-Lawgivers, just so here, as touching the morality of all human laws, whether civil or ecclesiastical, God Himself immediately, yea, from eternity by an act of his free-pleasure made that without advice of men or angels; for who instructed Him? Neither Moses, nor prophet, nor apostle; yea, all here are meri precones, only heralds; Yet are not all these heralds, who declare the morality of laws, [for] equals may declare them charitative[ly], by way of charity to equals; but these only are to be obeyed as heralds of laws, whom God has placed in authority, as kings, parliaments, synods, the Church, masters, fathers, captains; And it follows no ways that we disclaim the authority of all these because we will not enthrone them in the chair of the Supreme and only Lawgiver, and head of the Church; they are not under-Law-givers and little kings to create laws, the morality of which binds the conscience (for this God only can do); therefore, there be no parliaments, no kings, no rulers that have authority over men, it is a most unjust consequence; for all our divines, against Papists, deny that human laws, as human, do bind the conscience; but they deny not, but assert the power of jurisdiction in kings, parliaments, synods, pastors.</p></blockquote>

<blockquote><p>But William III. was a great politician, and would have every thing in the kingdom managed by the court. And there are his correspondents. There sits William Carstares, the son of John Carstares. The father had been an old unbending covenanter, and the son had been so deeply implicated in some of the political movements against the Stuart dynasty, that he had been in danger of his life, and subjected to the torture of the thumb-kins to extort from him some confessions.

He is evidently of a more modern school than the father, and has all the air of a finished diplomatist. The bosom friend and councillor of King William, he is now the acknowledged leader of the Scottish Church, and an eyesore to the Jacobites, who hate him most cordially for his politics, while he is rather suspected by some of his friends of too much leaning to the court.

See how anxious he is to repress the sallies of his more zealous and less courtly brethren! He knows all the wheels within the wheels of the state engine, and the exact degree of pressure it is able to bear; and he is trembling lest some rash ebullition of clerical steam should produce an explosion, and run the newly started establishment off the rails! “He is a fat, sanguine-complexioned, fair man,” says a Jacobite spy, “always smiling when he designs most mischief; a good friend when he is sincere; turned of fifty years old.” “He delivers himself so gravely and distinctly,” writes an admirer, “with such an acceptable pathos and well-placed accent, and all the other advantages of a natural and easy eloquence.” “He is the cunningest dissembler in the world, with an air of sincerity,” say his political enemies. “He preserved,” say his friends, “through all vicissitudes of fortune, the same humble spirit and simple worth, the same zealous and sincere piety, the same amiable and affectionate heart.”

“I have known him long,” says King William, “I know him thoroughly, and I know him to be a truly honest man.” Alas, for human nature! both portraits may have been founded in truth. Carstares at his own fireside, and Carstares at the head of the Assembly, may have been very different characters! We shall always feel respect for the man who, when in London, and hearing that a royal mandate had been sent down to dissolve the Assembly in the king’s name, at the risk of his life intercepted the message, and rushing into the king’s bed-chamber in the middle of the night, threw himself on his knees to obtain his majesty’s pardon. Nor can we help loving the man who, on learning that his inveterate opponent, Curate Calder, the reviler of the Presbyterians, was in abject poverty, sent for him, and observing the seedy condition of his coat, affected to be in a great rage at his tailor for having made him a suit of clothes which did not fit him, and insisted upon Calder donning them on the spot.

We cannot, however, shut our eyes to his defects. Carstares was a partisan of the court. He is said to have been the first to introduce the custom, which has ever since been observed, of the Moderator opening the Assembly by a formal address. It would have been well had this been the only novelty he introduced; but there is reason to fear that to him may be traced the commencement of the policy which so long reigned dominant in that court, that of managing the affairs of the Church through a junto in close correspondence with government, and acting under its secret instructions.</p></blockquote>

th+an+air+of+sincerity%2C%E2%80%9D+say+his+political+enemies.+%E2%80%9CHe+preserved%2C%E2%80%9D+say+his+friends%2C+%E2%80%9Cthrough+all+vicissitudes+of+fortune%2C+the+same+humble+spirit+and+simple+worth%2C+the+same+zealous+and+sincere+piety%2C+the+same+amiable+and+affectionate+heart.%E2%80%9D%0A%0A%E2%80%9CI+have+known+him+long%2C%E2%80%9D+says+King+William%2C+%E2%80%9CI+know+him+thoroughly%2C+and+I+know+him+to+be+a+truly+honest+man.%E2%80%9D+Alas%2C+for+human+nature%21+both+portraits+may+have+been+founded+in+truth.+Carstares+at+his+own+fireside%2C+and+Carstares+at+the+head+of+the+Assembly%2C+may+have+been+very+different+characters%21+We+shall+always+feel+respect+for+the+man+who%2C+when+in+London%2C+and+hearing+that+a+royal+mandate+had+been+sent+down+to+dissolve+the+Assembly+in+the+king%E2%80%99s+name%2C+at+the+risk+of+his+life+intercepted+the+message%2C+and+rushing+into+the+king%E2%80%99s+bed-chamber+in+the+middle+of+the+night%2C+threw+himself+on+his+knees+to+obtain+his+majesty%E2%80%99s+pardon.+Nor+can+we+help+loving+the+man+who%2C+on+learning+that+his+inveterate+opponent%2C+Curate+Calder%2C+the+reviler+of+the+Presbyterians%2C+was+in+abject+poverty%2C+sent+for+him%2C+and+observing+the+seedy+condition+of+his+coat%2C+affected+to+be+in+a+great+rage+at+his+tailor+for+having+made+him+a+suit+of+clothes+which+did+not+fit+him%2C+and+insisted+upon+Calder+donning+them+on+the+spot.%0A%0AWe+cannot%2C+however%2C+shut+our+eyes+to+his+defects.+Carstares+was+a+partisan+of+the+court.+He+is+said+to+have+been+the+first+to+introduce+the+custom%2C+which+has+ever+since+been+observed%2C+of+the+Moderator+opening+the+Assembly+by+a+formal+address.+It+would+have+been+well+had+this+been+the+only+novelty+he+introduced%3B+but+there+is+reason+to+fear+that+to+him+may+be+traced+the+commencement+of+the+policy+which+so+long+reigned+dominant+in+that+court%2C+that+of+managing+the+affairs+of+the+Church+through+a+junto+in+close+correspondence+with+government%2C+and+acting+under+its+secret+instructions.%E2%80%9D%0A%0A%E2%80%94+Thomas+M%E2%80%99Crie+Jr.%2C+%E2%80%9CThe+Marrow+Controversy%3A+with+Notices+of+the+State+of+Scottish+Theology+in+the+beginning+of+the+last+century%E2%80%99%2C+British+and+Foreign+Evangelical+Review&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd4c84c8d6f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d4c84c8d6f.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/07/17/thomas-mccrie-the-younger-on-the-character-of-william-carstares/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-ea35493283" data-kw="">
<blockquote><p>There is much underhanded dealing against the cause and covenant of God. We did swear the extirpation of prelacy, popery and schism; now we preach, profess and print that liberty is to be given for consciences of men, and how can this be denied to papists and prelates? Not only every city, but every family almost has a new religion. The former unrepented will worship in the breasts of men, against the power of godliness, vanity in apparel, whoring, extortion, injustice to widows and orphans, whose husbands and parents were killed in the wars, drunkenness, excess, lying and cozening, unjust and false slanders and calumnies, trusting in the arm of men and multitudes, halting between God and Baal, postponing of Christ matters to the end of the day, as if religion and the house of God were of less concernment to us than liberties and civil laws, and as if both kingdoms miraculously defended by the right arm of God, against merciless and blood thirsty Babylon, were not more obliged to the Lord of Hosts, who has saved us, than that we should now be debtors to our own carnal ends […] Oh that our Lord would boil out on the fire the scum of both kingdoms […] our breach of our Covenant, denying justice to the oppressed, to the widow, strangers, and orphans, to the poor and needy […]</p></blockquote>

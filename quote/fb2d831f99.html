</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2b30abdfa1" data-kw="efficacy moral">
<blockquote><p>The opinion of the orthodox is far different. First, they admit no blotting out of sin in baptism, springing ex opere operato or from a virtue inherent in it (as was proved before when we considered the efficacy of the sacraments). Second, they say that the efficacy of baptism (taken oppositely for the element and its dispensation) is moral, as has already been set forth; but the efficacy of baptism considered compositely for the sign and thing signified is real with respect to the one receiving it, although it is not restricted to the moment of baptism. Third, they acknowledge in baptism the testification and sealing of the twofold grace promised in the gospel; both of justification (by which sin is taken away as to its guilt so that it is not imputed) and of sanctification (by which its pollution is lessened and corrected that it may no more rule in us in this life; not however that it is not absolutely or exists in us anymore). The grace of justification pardons all our sins: original, actual, past, present and future. However sanctification removes our inherent corruption; not at</p></blockquote>

<blockquote><p>In this matter of baptism — if I may be pardoned for saying it — I can only conclude that all the doctors have been in error from the time of the apostles. . . . All the doctors have ascribed to the water a power which it does not have and the holy apostles did not teach.</p></blockquote>

</figure><figure class="quote" id="q-ac29eba9a3" data-kw="">
<blockquote><p>The folly and falsehood of baptismal regeneration have been already pointed out in the former lecture. All the arguments there aimed against the opus operatum apply here. The error most probably grew as superstition increased in the primitive Church, out of the unguarded use of the sacramental language by the early fathers, whose doctrine on this point was sounder. We know that baptism, in supposed imitation of Titus 3:5, was currently called regeneration as early as Justin Martyr and Irenaeus. It is easy to see how, as men’s ideas of sacred subjects became more gross, this figurative use of the word introduced the real error.</p></blockquote>

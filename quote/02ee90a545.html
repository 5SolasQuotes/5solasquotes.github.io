<main class="wrap"><figure class="quote" id="q-02ee90a545" data-kw="">
<blockquote><p>We teach not that baptism constitutes the Church simply, as the Church, but that it is a seal of a visible membership; and all baptized by John Baptist and the disciples of Christ were thereby entered in a visible profession that they believed in Christ already come, and so were made members and citizens by that public symbol and seal that they were members of the Christian Church, though as yet it received not that name of a Christian Church, and they were members both of the Jewish and Christian Church: For these are not contrary incorporations, and they needed not to be baptized again when they were added to the Christian Church, for they were never added to the visible Christian Church, nor needed they to be added, seeing they were members of that Church before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 4, section 5, pp. 218-9</span></figcaption>

<blockquote><p>30. But those in whom true faith is found are all and only those who are predestined to eternal life. For that faith falls to them from the decree of divine election; and therefore it is called by Paul, “the faith of God’s elect,” Tit. 1:1. Whence it happens that without it no one can be saved, nor does anyone have it who does not obtain salvation. For that assent which imitates true faith in some of the reprobate is temporary faith, about which we spoke above: and it must be distinguished from justifying and saving faith.

31. But as to what is often asked here, whether elect and saved infants also have faith, it is plain indeed that they cannot have actual faith; but nothing prohibits a certain habitual faith, or rather the seed and root of faith, from being infused in them. And certainly it cannot happen that God does not cleanse from every stain of original sin all the infants whom he admits into his heavenly kingdom, into which nothing polluted or defiled enters. Since therefore original sin in infants includes a certain seed of unbelief, just as of all vices, while God cleanses them, He undoubtedly takes away that innate unbelief, and so infuses the principle and a certain seed of faith. For God does not purge his own from vices except by infusing the contrary habits of virtues.

32. Moreover, whatever that may be, whether faith or the root of faith and disposition to faith which can be found in infants, it is beyond controversy that it must be attributed to God alone, and that the offices of man do not concur with it: nor can it be called into doubt by anyone: but Scripture also manifestly teaches that the same must be thought about the faith of adults, for it calls faith the gift of God, Eph. 2:8, “By grace you have been saved through faith, and that not of yourselves, it is the gift of God.” And to the Philippians the apostle says that it was freely given to them to believe in Christ, Phil. 1:29.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-le-blanc.html">Louis Le Blanc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses Published at Various Times</cite>, ed. tr. by AI by Colloquia Scholastica at Discord (1675; London, 1683), vol. 2, ‘On Faith’, pp. 131-32 Latin</span></figcaption>

</figure><figure class="quote" id="q-feda7ad161" data-kw="">
<blockquote><p>…hence we seek a warrant, why these who were once members of the visible Church and baptized, as the Answer to the 32 [Questions, a previously published congregationalist work] says, and so [are] clean and holy, 1 Cor. 7:14; Rom. 11:16, (2) in covenant with God, Acts 2:38-39; Acts 15:14-15; Gen. 17:7; 2 Cor. 6:16-18, etc. (3) and so redeemed by the blood of Christ and baptized into his body, 1 Cor. 12:13, even unto Christ, Gal. 3:17; Acts 2:38-39, when they come to age, are for no scandal unchurched, and because they cannot give evidence of real conversion, yet for 60 or 80 years, and to their dying day, are no more Church-members than pagans? ([Margin note:] Our [congregationalist] Brethren cast out of the Church these who were baptized in their infancy, and members thereof, because visibly non-regenerated. What warrant for this censure?)</p></blockquote>

<main class="wrap"><figure class="quote" id="q-a79e38bdde" data-kw="">
<blockquote><p>If head-coverings were by a sovereign, positive, religious appointment, Paul might be expected to condemn their misuse as disobedience, lawlessness, a transgression, sin, iniquity or idolatry, possibly on par with… Saul’s religious treason (1 Sam. 15), Nadab and Abihu’s debacle (Lev. 10) or some of the Colossians’ and Galatians’ will-worship (Col. 2:16–23; Gal. 4:8–11). Instead his language is far different: Paul speaks of dishonor ([1 Cor. 11] v. 4), shame (vv. 6, 14), custom (v. 16), comeliness (v. 13), glory (v. 15) (also “becometh” in 1 Tim. 2:9–10), appeals for persons to judge within themselves (v. 13), and speaks of disagreements herein involving contention (v. 16). Peter associates women’s modest hair with an “ornament” and being “chaste” (1 Pet. 3:2–4). All these factors are common to nature’s light and society, arising therefrom.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>1 Corinthians – Head Coverings are Not Perpetual &amp; they were Hair-Buns, with or without Material: Proven (RBO, 2022), pt. 1, ch. 5, ‘1 Corinthians 11’, ‘A Matter of Decorum, Not Necessarily Sin’</cite>, p. 59</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/impurities-in-worship.html">Impurities in Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9faa36859e" data-kw="">
<blockquote><p>3rd Doctrine. Temporary obedience does often turn aside a temporary punishment. Verse 26. ‘So He departed from him, etc.’ Zipporah here not of any devotion, but of necessity, circumcised her son, yet it pleased God so to accept of this forced obedience that he spared Moses: So many times a temporary and external obedience does turn away a temporal punishment: as Ahab’s sackcloth put off the punishment threatened, that it came not in his days. So the Samaritans’ corrupt worship of God delivered them from the lions, 2 Kings 17 (vv. 24-33). [So Josias] Simler. [Johannes] Piscator. If God be so pleased sometime with outward service, accepting the small beginnings of those that are coming unto Him: how much more acceptable unto Him is the true spiritual worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-willet.html">Andrew Willet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Hexapla in Genesin &amp; Exodum… (d. 1621; London: 1633) | on Ex. 4, 4. Places of Doctrine</cite></span></figcaption>

</figure><figure class="quote" id="q-293341cf5f" data-kw="">
<blockquote><p>Those who exaggeratingly refer to other Christian ministers sound in the fundamentals, albeit erring in other respects, as the sons of Belial or priests of Baal worshipping in the high places (where literal idolatry was used and other gods sacrificed to, a matter of fundamentals or tending to overturn them),¹ as the Separatists did,² are not harmless, but slanderous; cure yourself of that warped intoxication and protect others from it. ¹ Lev. 26:30; Dt. 12:2; 1 Kn. 11:7; 14:23; 2 Kn. 18:4; 21:3, 5; 23:20; 2 Chron. 11:15; 14:3–5; 28:25; 2 Chron. 31:1; 33:3, 17–19; 34:3; Ps. 78:58; Jer. 32:35; 48:35; Eze. 6:6, 13. ² Robert Browne, An Answer to Master Cartwright… (London: 1585), p. 48; Henry Barrow, A Collection of Certain Letters &amp; Conferences… ([Dordrecht] 1590), p. 27; idem, A Plain Refutation of Mr. G. Giffard’s Reproachful Book (Dordrecht, 1591), pp. 2, 7, 63, 189, 216, 223.</p></blockquote>

</figure><figure class="quote" id="q-b150bf6217" data-kw="">
<blockquote><p>While the people with fear and joy see God lighting his own fire, fire from heaven, the two sons of Aaron, in a careless presumption, will be serving Him with a common flame; as if He might not have leave to choose the forms of his own worship. If this had been done some ages after, when the memory of the original of this heavenly fire had been worn out, it might have been excused with ignorance; but now, when God had newly sent his fire from above, newly commanded the continuance of it, either to let it go out, or, while it still flamed, to fetch profane coals to God’s altar, could savour of no less than presumption and sacrilege. … Speed of death is not always a judgment: suddenness, as it is ever justly suspicable, so then certainly argues anger, when it finds us in an act of sin. Leisure of repentance is an argument of favor. When God gives a man law, it implies that He would not have judgment surprise him.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/joseph-hall.html">Joseph Hall</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Contemplations on the Historical Passages of the Old &amp; New Testaments (1614; London: 1868), bk. 6, Contemplation 2</cite>, pp. 66-67</span></figcaption>

</figure><figure class="quote" id="q-b49b78d7ff" data-kw="">
<blockquote><p>…there being no greater affront to God in the world, nor any thing more destructive to ourselves, than thus presumptuously to sin both against Him and our own souls by presenting ourselves before Him so directly contrary to his nature and commands; for He has taken such care that his worship should be free from all such mixtures of hatred and malice, that He will rather for a time dispense with his worship itself and have it deferred than endure that it should be thus unduly performed: ‘For if thou bring thy gift to the altar, and there remember that thy brother has ought against thee, leave there thy gift before the altar, first, be reconciled unto thy brother, and then come and offer thy gift.’ (Mt. 5:23-24) Whereby it appears that the performance of any outward service unto God, without Love to our brother, is very displeasing unto Him, who requires mercy rather than sacrifice at our hands: For if the gift, when brought to the altar, must rather be left there than offered up, sure there can be no acceptance or reconciliation with God, unless we be also reconciled unto our brother, because that this must be done before the other can be begun. How many then have offered not only fruitless, but abominable sacrifices unto Him, and instead of pacifying, have but the rather provoked Him, nay, and have with all earnestness, even besought Him to ruin and destroy them?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-jekyll.html">Thomas Jekyll</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Peace &amp; Love Recommended &amp; Persuaded in Two Sermons… (1675) Jekyll (d. 1698) was an Anglican minister.</cite></span></figcaption>

<div class="actions"><button class="copy" data-copy="“…there being no greater affront to God in the world, nor any thing more destructive to ourselves, than thus presumptuously to sin both against Him and our own souls by presenting ourselves before Him so directly contrary to his nature and commands; for He has taken such care that his worship should be free from all such mixtures of hatred and malice, that He will rather for a time dispense with his worship itself and have it deferred than endure that it should be thus unduly performed: ‘For if thou bring thy gift to the altar, and there remember that thy brother has ought against thee, leave there thy gift before the altar, first, be reconciled unto thy brother, and then come and offer thy gift.’ (Mt. 5:23-24) Whereby it appears that the performance of any outward service unto God, without Love to our brother, is very displeasing unto Him, who requires mercy rather than sacrifice at our hands: For if the gift, when brought to the altar, must rather be left there than offered up, sure there can be no acceptance or reconciliation with God, unless we be also reconciled unto our brother, because that this must be done before the other can be begun. How many then have offered not only fruitless, but abominable sacrifices unto Him, and instead of pacifying, have but the rather provoked Him, nay, and have with all earnestness, even besought Him to ruin and destroy them?”

— Thomas Jekyll, Peace &amp; Love Recommended &amp; Persuaded in Two Sermons… (1675) Jekyll (d. 1698) was an Anglican minister.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6there+being+no+greater+affront+to+God+in+the+world%2C+nor+any+thing+more+destructive+to+ourselves%2C+than+thus+presumptuously+to+sin+both+against+Him+and+our+own+souls+by+presenting+ourselves+before+Him+so+directly+contrary+to+his+nature+and+commands%3B+for+He+has+taken+such+care+that+his+worship+should+be+free+from+all+such+mixtures+of+hatred+and+malice%2C+that+He+will+rather+for+a+time+dispense+with+his+worship+itself+and+have+it+deferred+than+endure+that+it+should+be+thus+unduly+performed%3A+%E2%80%98For+if+thou+bring+thy+gift+to+the+altar%2C+and+there+remember+that+thy+brother+has+ought+against+thee%2C+leave+there+thy+gift+before+the+altar%2C+first%2C+be+reconciled+unto+thy+brother%2C+and+then+come+and+offer+thy+gift.%E2%80%99+%28Mt.+5%3A23-24%29+Whereby+it+appears+that+the+performance+of+any+outward+service+unto+God%2C+without+Love+to+our+brother%2C+is+very+displeasing+unto+Him%2C+who+requires+mercy+rather+than+sacrifice+at+our+hands%3A+For+if+the+gift%2C+when+brought+to+the+altar%2C+must+rather+be+left+there+than+offered+up%2C+sure+there+can+be+no+acceptance+or+reconciliation+with+God%2C+unless+we+be+also+reconciled+unto+our+brother%2C+because+that+this+must+be+done+before+the+other+can+be+begun.+How+many+then+have+offered+not+only+fruitless%2C+but+abominable+sacrifices+unto+Him%2C+and+instead+of+pacifying%2C+have+but+the+rather+provoked+Him%2C+nay%2C+and+have+with+all+earnestness%2C+even+besought+Him+to+ruin+and+destroy+them%3F%E2%80%9D%0A%0A%E2%80%94+Thomas+Jekyll%2C+Peace+%26+Love+Recommended+%26+Persuaded+in+Two+Sermons%E2%80%A6+%281675%29+Jekyll+%28d.+1698%29+was+an+Anglican+minister.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb49b78d7ff.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote

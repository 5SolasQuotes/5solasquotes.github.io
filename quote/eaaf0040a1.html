<main class="wrap"><figure class="quote" id="q-eaaf0040a1" data-kw="">
<blockquote><p>But truly the Preservers [civil health officials appointed for the plague] shall in vain altogether with this travail [labor] and diligence look unto their commonwealth if they use not like wisdom in the receiving in or shutting out of either men or things that come from other places when as this sickness is now rife everywhere and is at this time in a great part of Germany. For what shall it avail to have removed the filth of our own places, if we will receive again the corruption from others? …even so also this magistrate of ours (whom in this case we have said must be a general physician [by metaphor]) must do his diligence in the universal and common body of the commonwealth and orderly provide for all, that not so much as the least piece of infection be received or left behind whereupon new wracks and dangers are to be feared. For (as the poet says) the flame that is not looked unto does straight again recover. … But if any man shall think that it is against charity for that I hold that men and such as are our brethren are to be shut out, of the which many fly unto us as unto a sanctuary, as it were from a deadly enemy: unto him I must make this answer, that I would have no man forsaken or in any case to be destitute of our help, but yet there ought to be a set and steadfast way and order in using of help. True charity begins at itself, but ends not in it self alone: But rather it stretches out itself as far as it can to every neighbor, and according unto her power, imparts her help with every man; and as Ambrose says of liberality, [it] is commended of her faith: cause, place and time. For what a kind of charity should this be, to receive one sick sheep into the fold and to bring the scab unto the whole flock?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johann-von-ewich.html">Johann von Ewich</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Duty of a Faithful and Wise Magistrate in Preserving and Delivering of the Commonwealth from Infection in the Time of the Plague or Pestilence, Two Books</cite>, (London, 1583) | bk. 1, ch. 10, ‘Of not Receiving of Travelers and Strangers into the City, nor of Bringing in of Things without a Testimonial of the Health of that Place from Whence they Come’</span></figcaption>

</figure><figure class="quote" id="q-5a8d4c7847" data-kw="">
<blockquote><p>…the King has sufficient power to oppose wasters of his kingdom and to require homage of his subjects. Suppose he have not an unlimited power to forbid these of other nations and Churches, and his own, to go to a synod, within or without his nation, for the settling of the Churches in necessary peace and truth, if the Churches must seek liberty and counsel for their souls good, and edification: nor has he any lawful power from God to hinder his own subjects to send commissioners to sound and godly synods for counsel and synodical light, more than Jeroboam could lawfully forbid the people to go and worship at Jerusalem, upon pretense that they might be persuaded to cleave to Rehoboam their lawful prince, and waste his new kingdom: nor hath the prince an unlimited and absolute power to exact such absolute homage of his people; nor such a power over their moving from place: ([Margin note:] The Lord of Life has principally in the First Table laid a law upon our locomotive, and all our actings, to honor and love Him first, and the prince only secondarily and subordinately to God; if God charge us first to go to public meetings to honor Him, the Prince under pretense of peace cannot forbid the people to go up to Jerusalem to worship; we are to obey God rather than man.) for so the [claimed] Church Independent of Jerusalem consisting of ten thousand, if not more, should have no intrinsic power to meet for the public worship of God; but the prince must have a lawful power to hinder their meeting, or then the Church cannot have a lawful power to meet; for the convening of ten thousands, if abused, is as dangerous for wasting of a kingdom in its own way, as the convening of a national synod, is, or may be destructive to peace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 4, ch. 12, ‘Of the Magistrate’s Power in Convocating Synods’, p. 499</span></figcaption>

</figure><figure class="quote" id="q-678f7064e9" data-kw="">
<blockquote><p>…hereafter we must see concerning the selling and buying of things necessary… it is a thing doubtless greatly material that not only things hurtful be not brought into the city, but also the things good and profitable should be brought, but with such a proviso that the things that are to be brought in be set abroad and sold with least danger. Here therefore laws are to be made [of] what kinds of meats [foods] may be lawful to be sold and what not… and a certain penalty by the Preservers [civil health officials appointed for the time of the plague] to be set upon the offenders. … Lastly, also as touching the place wherein all things pertaining unto meat and drink are to be sold, something must be added. For it seems not convenient that all things should be brought into one market. For so it must needs be that a mighty multitude of people should come together… the infection must with all diligence be shunned, as has been often said already. There must therefore be ordained many places in sundry parts of the city where those things must be set which pertain unto food and are needful for everyone. Let there also be a several [different] market for flesh and fish, for herbs and fruits, that all discommodities which may arise by the mingling together of a multitude of people and bringing of things sellable, may with all diligence be avoided.</p></blockquote>

<blockquote><p>Job, when God visited him, desired to know wherefore God contended with Him: it is a sad thing to lie drowned under unknown and fatherless plagues, we being ignorant of the causes of God’s judgement; so we suffer blind crosses like the ox that bears the yoke and knows nothing of the art of husbandry [farming], or the horse killed in the battle, and yet is ignorant of State-affairs, and of the causes of war, and of disorders in Laws, Liberties, Religion in State and Church, we are like one smitten in the dark night by a spirit or a ghost, but he sees not who strikes. Oh it were good we would inquire, as the prophet does, Isa. 42:24, “Who gave Jacob for a spoil, and Israel to robbery?” and wherefore is all this come on us? why doth the Lord contend with us? O make us know our iniquities.</p></blockquote>

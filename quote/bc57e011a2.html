<main class="wrap"><figure class="quote" id="q-bc57e011a2" data-kw="">
<blockquote><p>The truth of God is perfectly harmonious, and is one complete whole. All the parts of it fit into one another, and are mutually dependent upon each other; and as this edifice, so reared by God, is complete and compact in all its parts, so the subtle influence of Satan is often applied to the undermining of one part of the building, in the knowledge that if he should succeed, he can scarcely fail to effect the destruction of all the rest.

We might illustrate this by showing how error, in what at first sight may appear an unimportant point, ruins the whole system, and essentially affects the whole doctrines of the gospel. It may seem, for instance, that the dispute regarding the precise nature of saving faith is a comparatively unimportant point, and one on which Christian men may afford to differ; and yet an error on this point might easily be shown to affect the doctrines of God’s sovereignty, of human depravity, the extent and nature of the atonement, and justification by faith alone.

We might show, for example, that those who make justification by faith to consist in the belief of the fact that they are pardoned—who maintain that a man must believe that Christ died personally for him as an individual—are compelled necessarily to adopt a mode of statement in regard to the bearing of Christ’s death upon all men indiscriminately, and particularly upon the lost, which strikes at the root of the doctrine of personal substitution altogether, and makes it difficult, if not impossible, to believe that Christ actually suffered in the very room and stead of guilty sinners themselves.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cross of Christ; The Call of God; Saving Faith: An Inquiry into the Completeness and Extent of the Atonement. With especial reference to the Universal Offer of the Gospel, and the Universal Obligation to Believe</cite>, (2nd edn, Edinburgh: John Johnstone, 1845), pp 136-37.</span></figcaption>

<blockquote><p>After indicating that the Genevans, of course, wish and hope for the gospel to be spread everywhere, the letter states: “But we know well also what is within our compass, and we do not presume even to wish to reform extensive kingdoms.”… What is fascinating here is the apparent renouncing, on the part of the Genevans, of any connection to the evangelical movement within France or anywhere else. They would seem to wish for the king to believe that Geneva stays resolutely and quietly within its own geographical border and does not meddle in the work of reforming other parts of Europe, let alone France. In all of this, Geneva kept up a near-constant state of deception in regards to the French king and his government… Geneva was extremely effective at feigning obedience to French kings.</p></blockquote>

<blockquote><p>2. The anger, then, which in the Scripture is assigned to God, we say denotes two things:—

(1.) His vindictive justice, or constant and immutable will of rendering vengeance for sin. So God’s purpose of the demonstration of his justice is called his being “willing to show his wrath” or anger, Rom. ix. 22; so God’s anger and his judgments are placed together, Ps. vii. 6; and in that anger he judgeth, verse 8. And in this sense is the “wrath of God” said to be “revealed from heaven,” Rom. i. 18; that is, the vindictive justice of God against sin to be manifested in the effects of it, or the judgments sent and punishments inflicted on and throughout the world.

(2.) By anger, wrath, zeal, fury, the effects of anger are denoted: Rom. iii. 5, “Is God unrighteous who taketh vengeance?” … We say, then, anger is not properly ascribed to God, but metaphorically, denoting partly his vindictive justice, whence all punishments flow, partly the effects of it in the punishments themselves, either threatened or inflicted, in their terror and bitterness, upon the account of what is analogous therein to our proceeding under the power of that passion …

3. Properly, in the sense by him pointed to, anger, wrath, etc., are not in God. Anger is defined by the philosopher to be … “desire joined with grief of that which appears to be revenge, for an appearing neglect or contempt.” To this grief, he tells you, there is a kind of pleasure annexed, arising from the vehement fancy which an angry person hath of the revenge he apprehends as future, — which, saith he, “is like the fancy of them that dream,” — and he ascribes this passion mostly to weak, impotent persons. Ascribe this to God, and you leave him nothing else. There is not one property of his nature wherewith it is consistent. If he be properly and literally angry, and furious, and wrathful, he is moved, troubled, perplexed, desires revenge, and is neither blessed nor perfect. …

(2.) The apostle tells us that God is “blessed for ever,” Rom. ix. 5; “He is the blessed and only Potentate” 1 Tim. vi. 15; “God all-sufficient,” Gen. xvii. 1. That which is inconsistent with absolute blessedness and all-sufficiency is not to be ascribed to God; to do so casts him down from his excellency. But can he be blessed, is he all-sufficient, who is tossed up and down with hope, joy, fear, sorrow, repentance, anger, and the like? …

When we speak of the anger of God, his wrath, and his being appeased towards us, we speak after the manner of men; but yet by the allowance of God himself. Not that God is properly angry, and properly altered from that state and appeased, whereby he should properly be mutable and be actually changed; — but by the anger of God, which sometimes in Scripture signifieth his justice, from whence punishment proceeds, sometimes the effects of anger, or punishment itself, the obstacles before mentioned on the part of God, from his nature, justice, law, and truth, are intended; and by his being appeased towards us, his being satisfied as to all the bars so laid in the way of receiving us to favour, without the least alteration in him, his nature, will, or justice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Vindiciæ Evangelicæ; or, The Mystery of the Gospel Vindicated and Socinianism Examined</cite>, (Oxford, 1655) in William H. Goold (ed.), The Works of John Owen (1850-53; 16 vols, Edinburgh: Banner of Truth, 1966), xii, 111-12, 114-15, 533.</span></figcaption>

<blockquote><p>…where both [both things to be preserved] cannot be jointly put out of danger: but all this amounts not to a disobligement from the endeavor of preserving them all; nor to a liberty upon any emergency of active, direct and purposed making away or removing of any of them, though under pretense of securing the other. I have read of one Alcon, who finding his son fast on sleep upon the grass, and a serpent creeping upon his breast, he not apprehending how otherwise it was possible to save his son, took his bow and shot at the serpent upon the boys breast, which (though to the manifest endangering of his life) yet he chose rather to take that course than by suffering the serpent to leave his life to a more certain destruction; And either his art or good hap was such as that he prevented and slew the serpent and preserved his son: those whom we are bound and most solicitous to preserve, we may upon an extreme exigence put in some hazard that we may preserve them…</p></blockquote>

<blockquote><p>1. Whether every instituted worship and its parts and circumstances are prescribed by the Word of God? It is affirmed.

2. Whether any through pretended opinions, the authority of the Church or the power of the magistrate are able to impose these in part on consciences? It is denied.

3. Whether instituted worship is mutable? It is affirmed with a distinction.</p></blockquote>

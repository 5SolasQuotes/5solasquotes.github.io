<main class="wrap"><figure class="quote" id="q-d7c656a53b" data-kw="">
<blockquote><p>V. (3) The question is not whether a distinction relative to the administration of divine providence in the covenant of grace in punishing the sins of believers can be admitted; whether certain sins in believers can be called mortal because they are grievous and atrocious, which more deeply wound and injure conscience, hinder the act of justifying faith and take away present fitness for the kingdom of heaven (upon which therefore he denounces wrath and indignation; yea, threatens exclusion from the kingdom of heaven and eternal death, like those treated of in 1 Cor, 6:10 and Col. 3:5); whether others, however, may be called venial, which are lighter and of daily commission, not hindering the rule and operation of grace, nor taking away the sense of God’s favor or the confidence of the pardon of sin (such as the rebellious motions of concupiscence, of which Paul complains in Rom. 7–defects and blemishes adhering even to the best works of the renewed). There are some of our party who think the distinction of mortal and venial sin can be retained in this sense, as Robert Baron, following the theologians of Great Britain, in his Judicio de Perseverantia, although it does not seem sufficiently appropriate on account of our opponents; the distinction of heavy and light sins is better. The question simply concerns the nature of sins in themselves according to the strictness of the law. We think all are mortal, none truly venial.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6c7ba3e091" data-kw="">

</figure><figure class="quote" id="q-9444e4b8d6" data-kw="">
<blockquote><p>The sensitive appetite had, as it were, been made a participant in reason; but when the will fell away from God toward itself, the appetite—despising the command of reason—began to be its own master. From this arose innumerable desires, innumerable fears, and disorders. Hence it also came about that, since the intellect was darkened in the very first principle of its actions, and placed the ultimate end in a particular good, and—ignorant of its own dignity—plunged itself into the body and sense, and degenerated into the nature of the body, it established its end in the pursuit of bodily pleasures and the avoidance of pains.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gasparo-contarini.html">Gasparo Contarini</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On Free Will as the Latin is given in Richard Field, Of the Church (Oxford: Turner, 1628), bk. 3, Answer to Berely, ch. 5, p. 253, margin note tr. ChatGPT-5 Contarini (1483–1542) was an Italian diplomat, Roman Catholic cardinal and Bishop of Belluno. He advocated for dialogue with Protestants during the Reformation.</span></figcaption>

</figure><figure class="quote" id="q-196a46f455" data-kw="">
<blockquote><p>§40. The effects [of original sin] are either moral or physical evils. To the former is to be referred: 1. Concupiscence, not that natural and innate faculty by which, for our ordinate conservation, we desire necessary things like food, drink, sleep, etc.—for this was instilled in man by God—but the pravitious concupiscence derived into posterity through the fall, otherwise called the concupiscence of the flesh (Eph. 2:3; 1 Jn. 2:16; Gen. 8:21), which by its inordinate movements irritates man to evils, and is the cause, fuel, and fodder of sin and of all vices and outrages…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Schwartz, 1712), ch. 2, ‘On Original Sin’, pp. 14-15 Latin</span></figcaption>

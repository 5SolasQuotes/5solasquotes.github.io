<main class="wrap"><figure class="quote" id="q-11d9d7c658" data-kw="">
<blockquote><p>The central thesis of North’s critique is that there are certain industries that are crucial to [taking] dominion and the well-being of civilization that cannot be completely shut down on the sabbath. Therefore, if sabbatarians were to be consistent they would have to abandon modern culture with its comforts… we will see that North misunderstands sabbatarianism…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/brian-schwertley.html">Brian Schwertley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath &amp; Modern Industrial Civilization</cite>, (1999) 6 pp., p. 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>
<div class="actions"><button class="copy" data-copy="“The central thesis of North’s critique is that there are certain industries that are crucial to [taking] dominion and the well-being of civilization that cannot be completely shut down on the sabbath. Therefore, if sabbatarians were to be consistent they would have to abandon modern culture with its comforts… we will see that North misunderstands sabbatarianism…”

— Brian Schwertley, ‘The Sabbath &amp; Modern Industrial Civilization: A Critique of Gary North’s ‘The Economics of Sabbath Keeping” (1999) 6 pp., p. 1">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+central+thesis+of+North%E2%80%99s+critique+is+that+there+are+certain+industries+that+are+crucial+to+%5Btaking%5D+dominion+and+the+well-being+of+civilization+that+cannot+be+completely+shut+down+on+the+sabbath.+Therefore%2C+if+sabbatarians+were+to+be+consistent+they+would+have+to+abandon+modern+culture+with+its+comforts%E2%80%A6+we+will+see+that+North+misunderstands+sabbatarianism%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Brian+Schwertley%2C+%E2%80%98The+Sabbath+%26+Modern+Industrial+Civilization%3A+A+Critique+of+Gary+North%E2%80%99s+%E2%80%98The+Economics+of+Sabbath+Keeping%E2%80%9D+%281999%29+6+pp.%2C+p.+1&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F11d9d7c658.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/11d9d7c658.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-works-of-necessity-mercy-on-the-sabbath/#:~:text=The%20central%20thesis%20of%20North%E2%80%99s%20critique,will%20see%20that%20North%20misunderstands%20sabbatarianism&amp;text=The%20central%20thesis%20of%20North%E2%80%99s%20critique%20is%20that&amp;text=we%20will%20see%20that%20North%20misunderstands%20sabbatarianism" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2aa17737f1" data-kw="">
<blockquote><p>And it came to pass, as He went into the house of one of the chief Pharisees to eat bread on the sabbath day, that they watched Him… 7 And he put forth a parable to those which were bidden, when he marked how they chose out the chief rooms; saying unto them. 8 When thou art bidden of any man to a wedding, sit not down in the highest room; lest a more honourable man than thou be bidden of him… 12 Then said he also to him that bade him, When thou makest a dinner or a supper, call not thy friends, nor thy brethren, neither thy kinsmen, nor thy rich neighbours; lest they also bid thee again, and a recompence be made thee. 13 But when thou makest a feast, call the poor, the maimed, the lame, the blind… 15 And when one of them that sat at meat with him heard these things, he said unto him, Blessed is he that shall eat bread in the kingdom of God. 16 Then said he unto him, A certain man made a great supper, and bade many: 17 And sent his servant at supper time to say to them that were bidden, Come; for all things are now ready… 23 And the lord said unto the servant, Go out into the highways and hedges, and compel them to come in, that my house may be filled. 24 For I say unto you, That none of those men which were bidden shall taste of my supper.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/old-testament.html">The Bible</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lk. 14:1 7-8, 12-13, 15-17, 23-24</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

t=which%20were%20bidden%20shall%20taste%20of%20my%20supper" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-210141a3e0" data-kw="">
<blockquote><p>Therefore, if the activity is conducive to worship, then it is lawful. We cannot ignore the human conscience here either, since an activity that might be conducive for worship to one person may not be conducive to worship for someone else. To take one example, it is certainly wise to let small children let loose some of their excess energy on the Sabbath (contrary to Laura Ingalls Wilder’s Farmer Boy! [below]). Otherwise, they will not be able to sit still and pay attention in worship. One does not have to take the attitude of Almanzo Wilder’s father [in Farmer Boy] in order to have a Puritan view of what is acceptable on the Sabbath! It is certainly a work of necessity to do something about the energy of small children. We must avoid both extremes of legalism and antinomianism here, as well as everywhere in our treatment of the law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/lane-keister.html">Lane Keister</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Sabbath Day &amp; Recreations on the Sabbath</cite>, …’ in Confessional Presbyterian, #5 (2009), p. 323</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/the-lords-day.html">The Lord&#x27;s Day</a></span></div>

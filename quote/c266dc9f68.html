<main class="wrap"><figure class="quote" id="q-c266dc9f68" data-kw="">
<blockquote><p>We have thus vindicated this passage [Colossians 2:3] from the cavils of the Ubiquitarians [Lutherans]: We shall now refute their error by a few arguments; and that from their own principles.

1. They concede that each nature in Christ possesses and retains its own properties, so that the property of one nature can never become the property of the other: thus James Andreas, Colloq. Mompelg. But what is really communicated to one, that becomes the property of the other: Omniscience, therefore, being really communicated to the human nature of Christ, does not remain the property of the Divine nature alone; because it is found in the other nature.

2. The attributes of the Divine nature are not communicated essentially to the human nature; for were this the case, the human nature, upon the acknowledgment of [Martin] Chemnitz himself, would turn out Divine: for since the properties of Divinity are not accidents, but the essence of God himself, they cannot belong to, neither are they communicated, i. e. formally, habitually, or subjectively. But no other mode besides the essential and accidental can be desired: therefore the attributes of Divinity, among which our opponents themselves assign omniscience, are not communicated to the human soul. But they say they are communicated by an hypostatical union. Yet this is nothing to the purpose.

For the attributes of the natures are not transferred from one to the other by virtue of the hypostatic union; but the attribute of one nature is ascribed to the other in the concrete, for the sake of the identity of the thing supposed, As when we say that God suffered, or was crucified, or was born of a virgin; that the man Christ was omniscient, omnipotent, the Creator of the world: predications of this kind are true, not because the Divine nature in itself in any manner admits the possibilily of suffering; or the human nature the attribute of omnipotence and omniscience: but because that man who suffered was God; and God who is omnipotent, was also man in unity of person.

3. He who says that the human nature of Christ is omniscient, and is so by that omniscience which is the attribute of the Godhead, he assigns one and the same knowledge to the human soul and to the Divine nature. But our opponents themselves condemn the Monothelites, who ascribe the same will of Deity and humanity in Christ; why are they not also to be condemned, who hold that there is the same knowledge in both?

4. That rule of Leo which is contained in his tenth Epistle, viz. that either nature can perform what is peculiar to it with the concurrence of the other, is proved by the Ubiquitarians themselves: But if omniscience be communicated to the human nature of Christ, then the human nature performs what exclusively belongs to the Godhead; for it comprehends all things by the infinite power of the communicated omniscience.

In short; There is in the human nature of Christ, all that fulness of infused and created knowledge which is required for the ministration of our salvation; in his Divine nature absolute omniscience is found: and, consequently. In him are all the treasures of created and uncreated knowledge.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-davenant.html">John Davenant</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle of St. Paul to the Colossians</cite>, trans. Josiah Allport (1627; 2 vols, London: Hamilton, Adams, and Co., 1831), 1: 364-66.</span></figcaption>

<blockquote><p>I beg you, tell us whether according to your [Lutheran] ubiquity [of the human nature], if I understand with my mind and not my body and I hunger with my body and not my mind, do I therefore hunger or understand only verbally? Similarly when we say that Christ truly and suffered and died insofar as He was a man, you cannot rightly construe this as if He suffered and died only verbally… …although I deny that the Word of God really suffered and died, still I do not claim that the passion and death did not involve it at all, for the Word was present at the passion and death, as has been said, because of the hypostatic union, although in a quiescent way. It was not affected by any suffering or by a new quality. Hence it is not empty words that the Son of God suffered and died since that nature and flesh which He made his own and to which He was present by a union of Person, really and truly suffered and died. But I would never say, as you are used to asserting, that the Word [logon] Himself really and truly both suffered and died.</p></blockquote>

</figure><figure class="quote" id="q-eb27eb3ed6" data-kw="">
<blockquote><p>Till far on in the second half of the century of the Reformation there were, properly speaking, only Evangelicals or Protestants; and the names Lutherans, Zwinglians, Calvinists were by all authorities of that time entirely repudiated. (Zanchius in a letter complains of people applying to themselves such names.)… in Frankfort [Germany] those who held the views of the Swiss, by the advice of Dathen, let their children be baptized by the city clergy who held Lutheran opinions; and when Calvin in September, 1556, was called as arbitrator to Frankfort, the wine of honor was poured out to him. Moreover, the states of the empire that were inclined to the Swiss doctrine were not excluded, in the year 1555, in the compact entitled ‘the Religious Peace;’ and there was then in Germany only one Protestant Church which in that Peace received on the basis of the Augsburg Confession toleration, or rather equal authorization… The doctrine of predestination was nto then matter of dispute. (…Calvin writes in 1560 to Zerkint of Bern, that up to this year no one had taken exception to the doctrine of predestination (v. Op. Omnia, Strassburg edition, Vol. xvii, 238)…</p></blockquote>

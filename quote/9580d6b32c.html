<blockquote><p>…note that while the behavior of non-human animals is not deterministic, neither is it random or arbitrary. It is perfectly intelligible given their causal powers together with the powers of the things they interact with. Yet non-human animals do not have wills, much less free will… Aquinas’s answer is that the will is a power of the kind of thing whose activity arises from within it in a certain way–specifically, by way of having knowledge of the kind of which a rational substance alone is capable (Summa theologiae I-II.6.1-2). To act voluntarily is to know what you are doing in the way that human beings do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024), pt. 1, ch. 4, ‘The Will’; pp. 117-18</span></figcaption>

<blockquote><p>Here ye must observe, that in this work of the restitution of mankind, and that in all the parts thereof, there is but one only grace of God, which is the beginning and first cause of all these proceedings; but we, according to the variety of the eflfects thereof, do thus distinguish it, and consider of it diversely; like as the Spirit of God, which is one, 1 Cor. 12:4, in respect of the diversity of the gifts and effects thereof, is after a sort distinguished, for that In some respect, but not in deed and verity, He seems not to be one and the same, as it were, Rom. 8:15, ‘For you have not received the spirit of bondage to fear any more, but you have received the Spirit of adoption.’ By this that has been spoken, understand that there are, as it were, four graces of God in the restoring of mankind, and in the parts thereof. For whereas there is a double mercy of God in our effectual vocation, to wit: First, an offering of Christ with all his benefits in the covenant of grace, or the Gospel; secondly, faith to receive Christ being offered (under faith I comprehend hope and calling, repentance, which follow faith). Therefore, In our effectual calling two graces must be understood; the grace of our vocation, or of offering Christ unto us, and the grace of faith, or of receiving Christ by us. In justification we have a third grace, which we may call the grace of justification. And in glorification there is a fourth grace, which we may not unfitly call the grace of glorification. Hence we may see that the first grace, which they call preventing grace, is that grace whereby God first calls us to Himself by his Gospel; and the last grace, which is the complement of grace, to be that grace whereby God does glorify us together with his Son in his kingdom; for He begins the last grace in this life by regeneration, but reserves the full consummation thereof to another life by glorification. Thus much of the parts of the restitution of mankind, all which proceed from the mere grace of God, and are directed unto the glory of his grace. We must observe this in general, that all the blessings of God, as well those that were from all eternity as those that are in time, be founded upon the only and mere grace of God. And that in respect of grace there is no difference between those benefits of God that were before all worlds, as his prescience and predestination, and these which are in time, as our vocation, justification, glorification.</p></blockquote>

<blockquote><p>Of this intellectual treasure house [the conscience], we are to know these [things]: 1. That in the inner cabinet, the natural habit of moral principles lodges, the register of the common notions left in us by nature, the ancient records and chronicles which were in Adam’s time, the Law of Nature of two volumes [corresponding to both Tables of the Law]… All these are written in the soul, in deep letters, yet the ink is dim and old, and therefore this light is like the moon swimming through watery clouds, often under a shadow, and yet still in the firmament.</p></blockquote>

<blockquote><p>2. How many sorts of concupiscences there be Before the sin of our first parents, the concupiscence in our nature was simple, natural, orderly (and necessary, like as other affections were, so that it was subject unto no malice: such as that which is in us yet, as when we be hungry we be desire meat; when we thirst, drink; when we be a cold, we desire warmth; when we be too hot, we desire to be cooled; when we be in prison, we desire liberty; when we be sick, we desire health etc. and this we do by the only course of nature, without any matter of sin. But after that our first parents had drunk of the poison of the Serpent, this strength of concupiscence is depraved in our hearts, and thereby it came that (passing the limits of nature and necessity) it extends itself unto those things which it is not lawful to desire: for that it is not lawful to take things away which pertain to others. Therefore the affections of concupiscence are of two sorts, natural and corrupt. The natural be set in us by God, and so much not unlawful, but that they be also necessary. Wherefore they do very unadvisedly teach us which do refer the crying of infants when they be hungry and desire meat unto the forbidden concupiscence and do ascribe them unto original sin. The corrupt affections of concupiscence be they when the limits of necessity are exceeded and men follow pleasures, curiosity, glory, ambition and other vices, and that contrary unto the law of charity and the purity of holiness. This corruption of our concupiscence is gotten of the old serpent, not grafted in our flesh of God. Wherefore we must beware that we do not ascribe our whole concupiscence neither to God, neither to Satan. The strength of desiring is given us from God, the strength of evil desiring from Satan: like as we do take it of God that we do live, and that we live evil we take it of Satan, the beginner of our malice. By this distinction we do foresee that we do not deny the work of God in us for the work of Satan, nor attribute the work of Satan unto God.</p></blockquote>

— Wolfgang Musculus, Common Places of the Christian Religion (1560; London, 1563), The Tenth Precept, fol. 103.a – 104.a">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C2.+How+many+sorts+of+concupiscences+there+be+Before+the+sin+of+our+first+parents%2C+the+concupiscence+in+our+nature+was+simple%2C+natural%2C+orderly+%28and+necessary%2C+like+as+other+affections+were%2C+so+that+it+was+subject+unto+no+malice%3A+such+as+that+which+is+in+us+yet%2C+as+when+we+be+hungry+we+be+desire+meat%3B+when+we+thirst%2C+drink%3B+when+we+be+a+cold%2C+we+desire+warmth%3B+when+we+be+too+hot%2C+we+desire+to+be+cooled%3B+when+we+be+in+prison%2C+we+desire+liberty%3B+when+we+be+sick%2C+we+desire+health+etc.+and+this+we+do+by+the+only+course+of+nature%2C+without+any+matter+of+sin.+But+after+that+our+first+parents+had+drunk+of+the+poison+of+the+Serpent%2C+this+strength+of+concupiscence+is+depraved+in+our+hearts%2C+and+thereby+it+came+that+%28passing+the+limits+of+nature+and+necessity%29+it+extends+itself+unto+those+things+which+it+is+not+lawful+to+desire%3A+for+that+it+is+not+lawful+to+take+things+away+which+pertain+to+others.+Therefore+the+affections+of+concupiscence+are+of+two+sorts%2C+natural+and+corrupt.+The+natural+be+set+in+us+by+God%2C+and+so+much+not+unlawful%2C+but+that+they+be+also+necessary.+Wherefore+they+do+very+unadvisedly+teach+us+which+do+refer+the+crying+of+infants+when+they+be+hungry+and+desire+meat+unto+the+forbidden+concupiscence+and+do+ascribe+them+unto+original+sin.+The+corrupt+affections+of+concupiscence+be+they+when+the+limits+of+necessity+are+exceeded+and+men+follow+pleasures%2C+curiosity%2C+glory%2C+ambition+and+other+vices%2C+and+that+contrary+unto+the+law+of+charity+and+the+purity+of+holiness.+This+corruption+of+our+concupiscence+is+gotten+of+the+old+serpent%2C+not+grafted+in+our+flesh+of+God.+Wherefore+we+must+beware+that+we+do+not+ascribe+our+whole+concupiscence+neither+to+God%2C+neither+to+Satan.+The+strength+of+desiring+is+given+us+f

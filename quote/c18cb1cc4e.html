<blockquote><p>Vers. 12. And we beseech you brethren, to know them which labour among you, and are over you in the Lord, and admonish you:

Exhort. 3. Which appertains to the people; That they observe the Pastors and Presbyters, with the whole assembly of the Elders, teaching &amp; governing those which laboured amongst them in the Word and Doctrine, and who were over them in the Lord, ruling in Ecclesiastical affairs, and according to their duty, did admonish, when there was need: Concerning these he commands them, that as Saints, and as it became thankful persons, they acknowledge in heart, words, and deeds, all the Presbyters appointed for the Ministers of Christ to their salvation.

There are three Reasons of the Exhortation:

Reas. 1. Because I an Apostle do lovingly and earnestly desire this.

Did labour] Reas. 2. Because Ministers are worthy of this honour, in as much as they labour for your edification, and are over you, or govern you, in the name of Christ, in all Ecclesiastical matters, and those things which pertain to the worship of God, and do with authority admonish you of your duties both privately and publicly.

Vers. 13. And to esteem them very highly in love for their works sake. And bee at peace among your selves.

Reas. 3. Because the work of God for the salvation of believers, which the faithful Ministers earnestly endeavour, requireth, that after a singular manner they bee beloved by the people, and esteemed very highly,

And peace] Exhort. 4. Chiefly to the people; That they be at peace both amongst themselves, and with the Pastors from whom the Devil is wont to alienate the minds of the people, even when the Pastors deserve best at their hands.

Vers. 14. Now we exhort you, brethren, warn them that are unruly, comfort the feeble-minded, support the weak, be patient toward all men.

Exhort. 5. To the Presbyters (which in the former verse he distinguished from the people, and here he describes them from their Offices, which especially belong to the Government of the Church, from the authority of their Office) That they diligently execute their Office, by admonishing those that live dissolutely, of their duty, by comforting the feeble, by supporting the weak in their love; lastly by shewing a gentle mind towards all: Lest if they should do otherwise, abusing their authority, they hinder the work of the Lord which they intend.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), p. 151.</span></figcaption>

<blockquote><p>Notwithstanding, he did not suffer himself to be without witness. Paul and Barnabas take from the Gentiles in this place the cloak [pretext] of ignorance. For how greatly soever men please themselves in their own inventions, being at length convicted of error, they fly unto this fortress, [asylums] that they ought to bear no blame; but that God was rather cruel, who did not vouchsafe so much as. with one hiss to call those back whom he saw perish, [perishing.] Paul and Barnabas cut off this frivolous objection, when they show that God lay hid in such sort, that he [still] bare witness of himself and his divinity.

Notwithstanding, we must see how these two things can hang together; for if God bare witness of himself, he did not suffer (so much as in him lay) the world to err. I answer, that this kind of testimony, whereof mention is made, was such as that it made men without excuse, and yet was it not sufficient to salvation. For that of the apostle is true, that by faith it is understood that the worlds were ordained by the word of God, (Hebrews 11:3.) But faith is not conceived by the bare beholding of the heaven and earth, but by the hearing of the word. Whereupon it followeth, that men are brought by the direction of the word alone unto that knowledge of Almighty God which bringeth salvation. And yet this letteth not but that they may be made without excuse, even without the word, who, though they be naturally deprived of light, are blind notwithstanding, through their own malice, as Paul teacheth in the first chapter to the Romans.

Giving rain and fruitful seasons. God hath, indeed, revealed himself to all mankind by his word since [from] the beginning. But Paul and Barnabas show that there was no age on which God did not bestow benefits, which might testify that the world is governed by his government (and commandment;) and because the light of doctrine had been buried long then, therefore they say only, that God was showed by natural arguments, [evidences.] And it is to be thought that they did, in such sort, set forth the magnificence and greatness of the works of God as became them; but it was sufficient for Luke to touch the (sums and) chief points of matters.

Neither do I so understand it, that they intreated subtlety, and after the manner of the philosophers, of the secrets of nature, for they spake unto an unlearned multitude; therefore it behoved them to set that before them plainly which the most ignorant did know. Notwithstanding they take this principle, that in the order of nature there is a certain and evident manifestation of God, in that the earth is watered with rain; in that the heat of the sun doth comfort it; in that there cometh such abundance of fruit out of the same yearly, it is thereby gathered for a surety, that there is some God who governeth all things.

For even the heaven and earth are not moved or governed by their own motion, and much less by fortune. Therefore it remaineth, that this wonderful workmanship of nature doth manifestly show the providence of God; and those who said that the world was eternal spake not as they thought, but they went about by malicious and barbarous unthankfulness [ingratitude] to suppress the glory of God, wherein they betrayed their impudence.

Filling with meat and gladness. The ungodliness of men is more convict in that, if they knew not God, because he cloth not only set before their eyes testimonies of his glory in his works, but doth also appoint all things for their use. For why doth the sun and stars shine in the heavens, save only that they may serve men? Why doth the rain fall from heaven? Why doth the earth bring forth her increase, save only that they may minister food to men? Therefore, God hath not set man upon earth that he may be an idle beholder of his work, as being set upon a theatre, but to exercise himself in praising the liberality of God, whilst that he enjoyeth the riches of heaven and earth.

And now, is it not more than filthy forwardness [depravity] not to be moved with so great goodness of God in the manifold abundance of things? To fill the hearts with meat, doth signify nothing else but to give food which may satisfy the desires of men. By this word gladness, Paul and Barnabas do mean that God doth give more to men, according to his infinite goodness, than their necessity doth require; as if it had been said, that men have meat given them not only to refresh their strength, but also to make their hearts merry.

If any man do object that it falleth out so oftentimes that men do rather mourn, being hungry, then rejoice, being full; I answer, that that cometh to pass contrary to the order of nature; namely, when the Lord shutteth his hand because of the sins of men. For the liberality of God should flow unto us abundantly of his [its] own accord, as it is here described by Paul and Barnabas, unless it were kept back by the lets of our vices. And yet there was never so great barrenness wherein the blessing of God in feeding men did quite wither away.

It was, indeed, well said of the prophet, Open thy mouth, and I will fill it, (Psalm 81:10,) that we may know that we be hungry through our own fault, whilst that we do not admit the goodness of God. But how unworthy soever we be and straight, yet the fatherly love of God breaketh through even unto the unworthy. Especially the generality of mankind doth testify that the benefits of God do never cease, wherein he appeareth to be our Father.</p></blockquote>

— John Calvin, Commentary on the Acts of the Apostles, ed. Henry Beveridge, trans. Christopher Fetherstone (1560; London, 1585) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 19a: 18-20.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CNotwithstanding%2C+he+did+not+suffer+himself+to+be+without+witness.+Paul+and+Barnabas+take+from+the+Gentiles+in+this+place+the+cloak+%5Bpretext%5D+of+ignorance.+For+how+greatly+soever+men+please+themselves+in+their+own+inventions%2C+being+at+length+convicted+of+error%2C+they+fly+unto+this+fortress%2C+%5Basylums%5D+that+they+ought+to+bear+no+blame%3B+but+that+God+was+rather+cruel%2C+who+did+not+vouchsafe+so+much+as.+with+one+hiss+to+call+those+back+whom+he+saw+perish%2C+%5Bperishing.%5D+Paul+and+Barnabas+cut+off+this+frivolous+objection%2C+when+they+show+that+God+lay+hid+in+such+sort%2C+that+he+%5Bstill%5D+bare+witness+of+himself+and+his+divinity.%0A%0ANotwithstanding%2C+we+must+see+how+these+two+things+can+hang+together%3B+for+if+God+bare+witness+of+himself%2C+he+did+not+suffer+%28so+much+as+in+him+lay%29+the+world+to+err.+I+answer%2C+that+this+kind+of+testimony%2C+whereof+mention+is+made%2C+was+such+as+that+it+made+men+without+excuse%2C+and+yet+was+it+not+sufficient+to+salvation.+For+that+of+the+apostle+is+true%2C+that+by+faith+it+is+understood+that+the+worlds+were+ordained+by+the+word+of+God%2C+%28Hebrews+11%3A3.%29+But+faith+is+not+conceived+by+the+bare+beholding+of+the+heaven+and+earth%2C+but+by+the+hearing+of+the+word.+Whereupon+it+followeth%2C+that+men+are+brought+by+the+direction+of+the+word+alone+unto+that+knowledge+of+Almighty+God+which+bringeth+salvation.+And+yet+this+letteth+not+but+that+they+may+be+made+without+excuse%2C+even+without+the+word%2C+who%2C+though+they+be+naturally+deprived+of+light%2C+are+blind+notwithstanding%2C+through+their+own+malice%2C+as+Paul+teacheth+in+the+first+chapter+to+the+Romans.%0A%0AGiving+rain+and+fruitful+seasons.+God+hath%2C+indeed%2C+revealed+himself+to+all+mankind+by+his+word+since+%5Bfrom%5D+the+beginning.+But+Paul+and+Barnabas+show+that+there+was+no+age+on+which+God+did+not+bestow+benefits%2C+which+might+testify+that+the+world+is+governed+by+his+government+%28and+commandment%3B%29+and+because+the+light+of+doctrine+had+been+buried+long+then%2C+therefore+they+say+only%2C+that+God+was+showed+by+natural+arguments%2C+%5Bevidences.%5D+And+it+is+to+be+thought+that+they+did%2C+in+such+sort%2C+set+forth+the+magnificence+and+greatness+of+the+works+of+God+as+became+them%3B+but+it+was+sufficient+for+Luke+to+touch+the+%28sums+and%29+chief+points+of+matters.%0A%0ANeither+do+I+so+understand+it%2C+that+they+intreated+subtlety%2C+and+after+the+manner+of+the+philosophers%2C+of+the+secrets+of+nature%2C+for+they+spake+unto+an+unlearned+multitude%3B+therefore+it+behoved+them+to+set+that+before+them+plainly+which+the+most+ignorant+did+know.+Notwithstanding+they+take+this+principle%2C+that+in+the+order+of+nature+there+is+a+certain+and+evident+manifestation+of+God%2C+in+that+the+earth+is+watered+with+rain%3B+in+that+the+heat+of+the+sun+doth+comfort+it%3B+in+that+there+cometh+such+abundance+of+fruit+out+of+the+same+yearly%2C+it+is+thereby+gathered+for+a+surety%2C+that+there+is+some+God+who+governeth+all+things.%0A%0AFor+even+the+heaven+and+earth+are+not+moved+or+governed+by+their+own+motion%2C+and+much+less+by+fortune.+Therefore+it+remaineth%2C+that+this+wonderful+workmanship+of+nature+doth+manifestly+show+the+providence+of+God%3B+and+those+who+said+that+the+world+was+eternal+spake+not+as+they+thought%2C+but+they+went+about+by+malicious+and+barbarous+unthankfulness+%5Bingratitude%5D+to+suppress+the+glory+of+God%2C+wherein+they+betrayed+their+impudence.%0A%0AFilling+with+meat+and+gladness.+The+ungodliness+of+men+is+more+convict+in+that%2C+if+they+knew+not+God%2C+because+he+cloth+not+only+set+before+their+eyes+testimonies+of+his+glory+in+his+works%2C+but+doth+also+appoint+all+things+for+their+use.+For+why+doth+the+sun+and+stars+shine+in+the+heavens%2C+save+only+that+they+may+serve+men%3F+Why+doth+the+rain+fall+from+heaven%3F+Why+doth+the+earth+bring+forth+her+increase%2C+save+only+that+they+may+minister+food+to+men%3F+Therefore%2C+God+hath+not+set+man+upon+earth+that+he+may+be+an+idle+beholder+of+his+work%2C+as+being+set+upon+a+theatre%2C+but+to+exercise+himself+in+praising+the+liberality+of+God%2C+whilst+that+he+enjoyeth+the+riches+of+heaven+and+earth.%0A%0AAnd+now%2C+is+it+not+more+than+filthy+forwardness+%5Bdepravity%5D+not+to+be+moved+with+so+great+goodness+of+God+in+the+manifold+abundance+of+things%3F+To+fill+the+hearts+with+meat%2C+doth+signify+nothing+else+but+to+give+food+which+may+satisfy+the+desires+of+men.+By+this+word+gladness%2C+Paul+and+Barnabas+do+mean+that+God+doth+give+more+to+men%2C+according+to+his+infinite+goodness%2C+than+their+necessity+doth+require%3B+as+if+it+had+been+said%2C+that+men+have+meat+given+them+not+only+to+refresh+their+strength%2C+but+also+to+make+their+hearts+merry.%0A%0AIf+any+man+do+object+that+it+falleth+out+so+oftentimes+that+men+do+rather+mourn%2C+being+hungry%2C+then+rejoice%2C+being+full%3B+I+answer%2C+that+that+cometh+to+pass+contrary+to+the+order+of+nature%3B+namely%2C+when+the+Lord+shutteth+his+hand+because+of+the+sins+of+men.+For+the+liberality+of+God+should+flow+unto+us+abundantly+of+his+%5Bits%5D+own+accord%2C+as+it+is+here+described+by+Paul+and+Barnabas%2C+unless+it+were+kept+back+by+the+lets+of+our+vices.+And+yet+there+was+never+so+great+barrenness+wherein+the+blessing+of+God+in+feeding+men+did+quite+wither+away.%0A%0AIt+was%2C+indeed%2C+well+said+of+the+prophet%2C+Open+thy+mouth%2C+and+I+will+fill+it%2C+%28Psalm+81%3A10%2C%29+that+we+may+know+that+we+be+hungry+through+our+own+fault%2C+whilst+that+we+do+not+admit+the+goodness+of+God.+But+how+unworthy+soever+we+be+and+straight%2C+yet+the+fatherly+love+of+God+breaketh+through+even+unto+the+unworthy.+Especially+the+generality+of+mankind+doth+testify+that+the+benefits+of+God+do+never+cease%2C+whe

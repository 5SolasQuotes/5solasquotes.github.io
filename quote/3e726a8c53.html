<main class="wrap"><figure class="quote" id="q-3e726a8c53" data-kw="">
<blockquote><p>It is somewhat remarkable that in our [Scottish] Reformation documents there is no reference to instrumental music. While many Roman practices are condemned in the first Book of Discipline and the Confession of Faith, nothing whatever is said against the use of organs or other instruments of music in the worship of God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/sean-p-m-mcdonald.html">Sean P.M. McDonald</a></span><span class="wk"><span class="lbl">Work:</span> <cite>”I will not hear the melody of thy viols’: Opposition to Instrumental Music in Historic Presbyterian &amp; Puritan Worship’ M.A. thesis</cite>, (Liberty University, 2026) 138 pp. Covers Geneva, England, Scotland and the Netherlands, 1500’s to c. 1800, and touches upon Germany. | McDonald, from the second quote above, also appears to interpret silence in foundational Church documents as being against musical instruments. McMillan (p. 94), as quoted by McDonald (p. 33, fn. 74) relates:</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/musical-instruments-in-worship.html">Musical Instruments in Worship</a></span></div>
<div class="actions"><button class="copy" data-copy="“It is somewhat remarkable that in our [Scottish] Reformation documents there is no reference to instrumental music. While many Roman practices are condemned in the first Book of Discipline and the Confession of Faith, nothing whatever is said against the use of organs or other instruments of music in the worship of God;”

</figure><figure class="quote" id="q-4843d0e5f4" data-kw="">
<blockquote><p>A second characteristic of Puritan worship was its utter simplicity and sincerity. This unostentatious and modest form of worship found its appropriate domestic setting in meeting-houses… The Puritans refused to let the pealing organ blow To the full-voiced quire below In service high and anthems clear… in favour of the pedestrian metres of the Psalms so that all could memorize them and sing them in unison… their sense of holiness in approaching God was so strong that they could do without any theatrical or adventitious aids which would make tawdry the splendour of the Creator’s covenant mercies to his own.</p></blockquote>

</figure><figure class="quote" id="q-1ee9e51e3f" data-kw="">
<blockquote><p>…The reader will see that I only declared my dislike of organs in our churches, and therein I think I have better authority than those that are of another mind, forasmuch as in the Homily of the Place and time of Prayer (a book established and enjoined by the laws of the land) p. 131, they bring in some superstitious persons, complaining that they could not “hear the like piping, singing, chanting and playing upon the organs, that they could before”: To this is immediately answered thus; “But (dearly beloved) we ought greatly to rejoice and to give thanks to God, that our Churches are delivered out of those things which displeased God so sore, and filthily defiled his holy House”…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-poole.html">Matthew Poole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Evangelical Worship is Spiritual Worship as it was Discussed in a Sermon</cite>, (1660) | To the Reader</span></figcaption>

<blockquote><p>…there are some things which, though appointed by God and of intrinsic importance, do not so belong to the essence of an ordinance that their absence renders it utterly invalid… Now in the sense indicated, instrumental music in worship is incidental, for we do not hold that its combination with vocal music renders the worship utterly void; yet we protest against its use as an unwarrantable element, and, on that account, a corruption of the worship.</p></blockquote>

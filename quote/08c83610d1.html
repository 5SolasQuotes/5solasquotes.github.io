<main class="wrap"><figure class="quote" id="q-08c83610d1" data-kw="">
<blockquote><p>1. Voluntas essentialis and voluntas personalis. This is an admittedly rare distinction, given the Reformed orthodox unwillingness to speculate into the doctrine of the Trinity in a manner like that of the medieval doctors. This distinction parallels, of course, the basic distinction of properties of the Godhead into proprietates essentiales and proprietates personales. Thus, the voluntas essentialis is simply the will of God, understood as an essential property or as a faculty of the divine life. The ‘essential’ will of God can also be termed the voluntas realis, namely, will by which God discerns all things existent or nonexistent. The voluntas personalis, then, can only relate to the inward begetting and proceeding of the persons of the Trinity, understood as somehow belonging to the divine willing–as such, this language relates also to the concept of a necessary divine will, the voluntas necessaria. Thus, God the Father necessarily wills to beget God the Son.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>PRRD 2nd</cite>, ed. (Baker Academic, 2003), vol. 3, p. 453</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

<blockquote><p>34. The Will of God is the other faculty of the life of God, or the act that follows, by which God knows Himself and wills and approves of all good things as they agree unto the nature and order of his mind, the contraries He necessarily disapproves, which will is called approving; and out of which things He is able to do, some He freely wills, chooses and decrees by a foregoing wisdom, and does, which is the effecting will;…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/antonius-thysius.html">Antonius Thysius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thesis 34 in The Sixth of the Theological Disputations in On the Nature of God &amp; the Divine Attributes</cite>, (d. 1640; Leiden, 1620) This disputation is also in the Synopsis of Pure Theology as disputation 6.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-06dacfd041" data-kw="">
<blockquote><p>And so in all the commandments of God, we must understand the will of God to be either (Zanchi, Of the Nature of God, ch. 3):

1. Declarans [declaring]

2. Efficiens [effecting] The first is that which shows what should be done, and so the Law is called doctrina, a rule which shows us what pleases or displeases God. The second is that which causes us to do what is pleasing to Him, and so the Law is called mandatum [a commandment], when He makes the elect to walk in his paths (Eze. 11:20), or works faith in their hearts to believe in Christ. The 1. may be broken by the wicked. The 2. cannot: ‘For my counsel shall stand, and my will shall be done, says the Lord.’ (Isa. 46) But then it may be objected that the wicked sin not, because they do not break or do any thing against the absolute and proper will of God. I answer: That sin is not defined to be the transgressing of the secret will of God which cannot be broken, but of his declared and revealed will (Zanchi, bk. 3, ch. 4, Of the Nature of God), which only shows what is pleasing or displeasing to Him. Hereby then you see the will of God is only one, immutable and unchangeable, and that although He gives his Law unto all, yea, both legem operandi and lege credendi [the law to be worked and the law to be believed], to show what should be done and what should be believed; yet it is not his absolute will that all men should either do or believe the same, that they might be saved. For if it were, who could resist it? (Rom. 9:19)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gryffith.html">William Gryffith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Delights of the Saints</cite>, … (London: Butter, 1622), pt. 1, pp. 15-16 Gryffith (c.1589–1672) was an Anglican bishop, opposed to the puritans.</span></figcaption>

<blockquote><p>§ 53. But how comes it to pass then, that these blessed means of grace, these conveyances of the Spirit are so often ineffectual? Many men do daily pray, often hear and read the Word of God, have been engraffed into the body of Christ by baptism, and many times receive the blessed eucharist, and yet little or no news do they hear of the Spirit, very little stirrings of the heart, few good motions do they feel within, they are never the better, nor a whit the more enriched, either with spiritual gifts or graces for the use of these means: The cause whereof is the hardness of man’s heart, which receives not the impressions of the Spirit; the corruption of man’s nature, which quenches the sacred fires of piety and charity, before they be well enkindled in the soul; the exorbitant and unruly lusts of the flesh, and of the world, which resist the good motions, lustings, and strivings of the Spirit of God. Intus existens prohibet alienum; when the fruits of the flesh have overgrown the soul, there’s no room for the fruits of the Spirit to take rooting there: These two kinds of fruits cannot grow both in one heart, but the one will choak, overgrow, and destroy the other. To this outward means of grace then, and of the Spirit, the inward qualifications, the infitting of the soul to receive the impressions of the Spirit must be added…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sherlock.html">Richard Sherlock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Quakers’ Wild Questions Objected against the Ministers of the Gospel</cite>, … with Brief Answers Thereunto... (London: Cotes, 1654) Sherlock (1612–1689) was an Anglican clergyman., pp. 152-53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

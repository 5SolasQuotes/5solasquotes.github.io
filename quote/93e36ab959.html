<main class="wrap"><figure class="quote" id="q-93e36ab959" data-kw="">
<blockquote><p>If the Scriptures be what they claim to be, the word of God, they are the work of one mind, and that mind divine. From this it follows that Scripture cannot contradict Scripture. God cannot teach in one place anything which is inconsistent with what He teaches in another. Hence Scripture must explain Scripture. If a passage admits of different interpretations, that only can be the true one which agrees with what the Bible teaches elsewhere on the same subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/charles-hodge.html">Charles Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, vol. 1, Introduction, ch. 6, §6</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7469950696" data-kw="">
<blockquote><p>Now we determine that the supreme right, authority, and judgment of interpreting the scriptures, is lodged with the Holy Ghost and the scripture itself: for these two are not mutually repugnant. We say that the Holy Spirit is the supreme interpreter of scripture, because we must be illuminated by the Holy Spirit to be certainly persuaded of the true sense of scripture; otherwise, although we use all means, we can never attain to that full assurance which resides in the minds of the faithful. … As to external persuasion, we say that scripture itself is its own interpreter.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, Controversy 1, Q. 5, ch. 3 (p. 415)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture/interpretation.html">Interpretation</a> › <a href="../topics/holy-scripture/interpretation/the-interpreter-and-judge-of-controversies.html">The interpreter and judge of controversies</a></span><span class="t"><a href="../topics/holy-scripture/sufficiency.html">Sufficiency</a> › <a href="../topics/holy-scripture/sufficiency/scripture-alone.html">Scripture alone</a></span></div>

</figure><figure class="quote" id="q-b65e48dc5d" data-kw="">
<blockquote><p>In this matter there is no need of knowing immediately and a priori who has the Spirit, but only who speaks according to the Scriptures. When this becomes known by a reference to the Scriptures, we can readily judge a posteriori who utters the words of the Spirit and speaks from him. Thus the Bereans did not inquire a priori whether Paul who preached to them was moved by the Holy Spirit … but whether Paul spoke according to the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 2.20.35</span></figcaption>

</figure><figure class="quote" id="q-a2863a5000" data-kw="Judge of controversies">
<blockquote><p>It is not necessary that there should be in the church any external infallible judge by whom controversies of faith may be solved. It suffices for believers, for the tranquility and rest of their consciences, that there is an interior or divine definitive judgment (namely, of Christ and the Holy Spirit speaking in the Scriptures). An external human judgment, infallible and definitive in the church, is neither necessary nor possible. Controversies do not belong to external order but to the mental judgment for which a judge is necessary to enlighten the mind and sanctify the will (which an external and human judge cannot do because he has no power over the conscience).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.33.23</span></figcaption>

</figure><figure class="quote" id="q-ca480713e5" data-kw="">
<blockquote><p>Providence without the word is a dark enigma. None can solve it. The best commentary on Providence is the Bible. The best commentary on the Bible is Providence. The events of a godly man&#x27;s life are to him the fulfillings of the Scriptures. In a thousand ways they teach him the true sense of promises and threatenings, predictions and narratives, precepts and doctrines. They mightily confirm his belief of the truth.</p></blockquote>

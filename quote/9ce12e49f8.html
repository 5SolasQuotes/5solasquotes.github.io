<main class="wrap"><figure class="quote" id="q-9ce12e49f8" data-kw="">
<blockquote><p>The political law is what determines the duties of the governing officials and the subjects of the Israelite nation by means of certain civil regulations. It lends authority to them through the corporal punishment of those who rebel, in keeping with the norm of the Decalogue’s two tables, and in particular the second one.

The foremost use of this political law is that by the precise keeping of the precepts of the moral and ceremonial laws, justice might thrive in conjunction with piety especially among the Jews. Even to the present day governing officials and their subjects one and all are obliged to obey those precepts in this political law that belong to the universal law; however, the ones that belong to the particular Jewish [political] law have become obsolete along with the Mosaic system of government.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-polyander.html">Johannes Polyander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, trans. Riemer A. Faber, eds. William Den Boer and Riemer A. Faber (1625; 2 vols, Landrum SC: Davenant Press, 2023), 18.49-51, i, pp 188-89.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-94a10c0bd4" data-kw="">
<blockquote><p>Objection 9 [of a congregationalist to presbyterianism]: ‘From the church here spoken of [in Mt. 18] there is no appeal because the sentence is ratified in heaven. It inflicts the highest punishment: the censure of excommunication; and a higher judicature can do no more. There is no reason to appeal to a higher judicature because the inferior may err, because all above a congregation are courts which may err also. For presbyteries, provincial councils, national, and the universal council of the catholic Church may err.’ So Mr. Mather (Richard Mather &amp; William Tompson, Answer to Mr. Herle, ch. 2, pp. 13-14). [Rutherford’s] Answer [1.]: Because the sentence is ratified in heaven is no reason why we may not appeal from a congregation. The sentence of an inferior judge proceeding rightly is ratified in heaven, yet we may appeal from him. To appeal is but upon fears of ill administration; to desert a lower court and go to a higher court. So when we fear that a counsel and advice given by a sister church is not according to the Word of God, which yet is according to the Word of God, upon the supposal of that fear we decline that council and take another. Neither are we to appeal de jure, ‘from a just sentence,’ in a presbytery. Illud possumus quod jure possumus [‘What we can do, is that which we can do by law’]. What the inferior Sanhedrin of Israel did justly was ratified in heaven. Yet by God’s Law there might be an appeal from it to the highest Sanhedrin.

2. Nor is this a good reason: that we may not appeal from a judicature which may inflict the highest censure. For inferior judicatures in Israel had power of life and death, yet might man appeal from them.

3. The cause of appeals is not because inferior judicatures may err: for so we might appeal from all judicatures, even from a general council, for it may err. But the true grounding [of appeals] is:

1. Because rarius errant, they [higher councils] ‘do not so frequently err’.

2. They are not so inclined and disposed to err, ‘for many eyes see more than one,’ and many eyes do more seldom miscarry in not taking up the right object than one.

3. Because we conceive more equality and less partiality in higher courts.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, (1644), Part 1, ch. 10, sect. 10, pp. 315-316</span></figcaption>

<blockquote><p>4. Distinguish between the Moral, and Ceremonial, and Judicial Law: [1.] The first concerns manners, and the right ordering of a godly conversation; and because these things are of perpetual equity and rectitude, the obligation of this Law as to that is perpetual; and therefore in the expounding of it, these two terms, Moral, and of Perpetual Authority, are all one, and to be taken so.

2. The Judical Law is for regulating outward society, and for government, and does generally (excepting what was peculiar to the people of Israel) agree with the Moral Law; this as given to them is not perpetual, their policy being at an end.

3. The Ceremonial Law is in ceremonies, types, and shadows, pointing at a Savior to come; this is also abrogate[d], the substance being come; but there is this difference, that the Judicial Law is but mortua, ‘dead’; and may, where ’tis thought fit, with the foregoing caution, be used under the New Testament; but the Ceremonial Law is mortifera, ‘deadly’, and cannot without falling from grace, Gal. 5:2,4, be revived.</p></blockquote>

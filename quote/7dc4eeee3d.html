</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ed9d4ca90e" data-kw="">
<blockquote><p>Answer: You are neither to lay such a supposition down that either you are excluded from the number of those that Christ died for or included in that number: neither of the two are revealed to you, and secret things belong to the Lord. It is enough to you that: 1. you are not excluded, for anything that is revealed to you. 2. That thou have need of Christ, and are a guilty sinner. 3. That thou art commanded to believe: As for Christ’s not shedding of his blood for thee; say it were so: it’s no more absurd that you are obliged to believe on Christ as an all sufficient Redeemer for remission of sins (though remission be not purchased to you in Christ’s blood)…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (London: 1647), p. 445</span></figcaption>

</figure><figure class="quote" id="q-1e4abf0ed1" data-kw="">
<blockquote><p>Second, we confess that Christ indeed rules now, and possesses all authority, both in heaven and on earth, according to both natures. But not presently, as far as the flesh is concerned. The apostle says that we are absent from Christ now on earth, not at home, and desire to leave the body to be joined to him. On this account we say that he has indeed not yet come nor is present in his flesh, but will certainly appear again, visibly from the invisible, or rather will come for all to see.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lutheranism vs. Calvinism: The Classic Debate at the Colloquy of Montbeliard 1586</cite>, 1586, ed. Jeffrey Mallinson (St. Louis: Concordia Publishing House, 2017), ch. 2, ‘Person of Christ’, Response to Thesis 17, pp. 253-54</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>
<div class="actions"><button class="copy" data-copy="“Second, we confess that Christ indeed rules now, and possesses all authority, both in heaven and on earth, according to both natures. But not presently, as far as the flesh is concerned. The apostle says that we are absent from Christ now on earth, not at home, and desire to leave the body to be joined to him. On this account we say that he has indeed not yet come nor is present in his flesh, but will certainly appear again, visibly from the invisible, or rather will come for all to see.”

— Theodore Beza, Lutheranism vs. Calvinism: the Classic Debate at the Colloquy of Montbeliard, 1586, ed. Jeffrey Mallinson (St. Louis: Concordia Publishing House, 2017), ch. 2, ‘Person of Christ’, Response to Thesis 17, pp. 253-54">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CSecond%2C+we+confess+that+Christ+indeed+rules+now%2C+and+possesses+all+authority%2C+both+in+heaven+and+on+earth%2C+according+to+both+natures.+But+not+presently%2C+as+far+as+the+flesh+is+concerned.+The+apostle+says+that+we+are+absent+from+Christ+now+on+earth%2C+not+at+home%2C+and+desire+to+leave+the+body+to+be+joined+to+him.+On+this+account+we+say+that+he+has+indeed+not+yet+come+nor+is+present+in+his+flesh%2C+but+will+certainly+appear+again%2C+visibly+from+the+invisible%2C+or+rather+will+come+for+all+to+see.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Lutheranism+vs.+Calvinism%3A+the+Classic+Debate+at+the+Colloquy+of+Montbeliard%2C+1586%2C+ed.+Jeffrey+Mallinson+%28St.+Louis%3A+Concordia+Publishing+House%2C+2017%29%2C+ch.+2%2C+%E2%80%98Person+of+Christ%E2%80%99%2C+Response+to+Thesis+17%2C+pp.+253-54&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F1e4abf0ed1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/1e4abf0ed1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/the-extent-of-christs-mediatorial-kingdom-2/#:~:text=Second%2C%20we%20confess%20that%20Christ%20indeed,will%20come%20for%20all%20to%20see&amp;text=Second%2C%20we%20confess%20that%20Christ%20indeed%20rules%20now&amp;text=or%20rather%20will%20come%20for%20all%20to%20see" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cec55288b5" data-kw="">
<blockquote><p>Rejection of the errors of those: Who teach that Christ died for each and everyone sufficiently not only with regard to the worth, but even by reason of the intention, or for all conditionally if they believe; or who assert that Scripture teaches that Christ died for all men in general, and particularly that the Scripture passages Ezek. 18:21, etc., and 33:11; John 3:16; I Tim. 2:4; II Pet. 3:9 ought to extend to each and every man, and that the universality of love and grace is proved by them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/genevan.html">Donald Davis Grohman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism</cite>, Donald D. Grohman, The Genevan Reactions to the Saumur Doctrines of Hypothetical Universalism: 1635-1685 Th.D. diss, (Knox College in cooperation with Toronto School of Theology. 1971), pp. 231-35 For context see ‘Donald Grohman on Dort and the 1649 Genevan Articles’ at Calvin &amp; Calvinism and Grohman.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

</figure><figure class="quote" id="q-f1145c7e24" data-kw="">
<blockquote><p>Not all those who are called are predestined. For Christ said: ‘Many are called, but few are chosen’ (Mt. 22:14). But they contend that the calling is universal and that God would wish everyone saved. If it is understood as universal calling because it is offered to all and no one is excluded by name, it is true. If it is also called universal because the death of Christ and his redemption is sufficient for the whole world; that also is most true. But if this universality is meant so that He it is in everyone’s hand to receive the promises, I deny it: because to some it is given, to others it is not given. As if we did not see also that for a long time the very preaching of the Gospel was not given to many places, ages, and nations. God would have all to be saved, provided they believe. He gives faith to whom it seems good to Him. For He may justly do with his own what he will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Free Will &amp; Predestination” in Philosophical Works</cite>, trans. Joseph P. McLelland (Kirksville, MO: Sixteenth Century Essays &amp; Studies, 1994), vol 4, p. 332</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/priestly-office-satisfaction-and-atonement/extent-of-the-atonement.html">Extent of the Atonement</a></span></div>

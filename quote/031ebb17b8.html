<main class="wrap"><figure class="quote" id="q-031ebb17b8" data-kw="">
<blockquote><p>Some of us have understood Deuteronomy 22:28-9 to be referring to the punishment of rape (the NIV rendering gives this impression, as do various expounders of biblical law). However, Henry Bullinger appears to be on point when he argues that it is referring to the penalty for fornication, not rape. The latter is a form of kidnapping or manstealing, and should thus be punished with death:

Rapes and such villainies committed perforce the laws do punish with loss of life; but to him that doth deflour a maid, not violently the Lord doth say, “Marry and endow her.” [Deuteronomy 22:28-9]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 417.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-ea35493283" data-kw="">
<blockquote><p>There is much underhanded dealing against the cause and covenant of God. We did swear the extirpation of prelacy, popery and schism; now we preach, profess and print that liberty is to be given for consciences of men, and how can this be denied to papists and prelates? Not only every city, but every family almost has a new religion. The former unrepented will worship in the breasts of men, against the power of godliness, vanity in apparel, whoring, extortion, injustice to widows and orphans, whose husbands and parents were killed in the wars, drunkenness, excess, lying and cozening, unjust and false slanders and calumnies, trusting in the arm of men and multitudes, halting between God and Baal, postponing of Christ matters to the end of the day, as if religion and the house of God were of less concernment to us than liberties and civil laws, and as if both kingdoms miraculously defended by the right arm of God, against merciless and blood thirsty Babylon, were not more obliged to the Lord of Hosts, who has saved us, than that we should now be debtors to our own carnal ends […] Oh that our Lord would boil out on the fire the scum of both kingdoms […] our breach of our Covenant, denying justice to the oppressed, to the widow, strangers, and orphans, to the poor and needy […]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A sermon preached before the Right Honourable the House of Lords at their monthly fast, June 25, 1645, in the Abbey Church at Westminster in Chris Coldwell (ed.), Sermons preached before the English Houses of Parliament by the Scottish Commissioners to the Westminster Assembly of divines 1643-1645</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><figure class="quote" id="q-30a54e18ae" data-kw="">
<blockquote><p>Thirdly, add further what the Apostle doth, v. 4. [For he is the Minister of GOD to thee for good,] Is this true of persecuting Nero, in the case of his persecuting? Whereby the Apostle proves he will praise thee, doing that which is good? Surely in an over-ruling Work of GOD’S Grace, the very Devil is GOD’S instrument for GOOD, as to Job, (and we may say Minister too.) And Nero not a whit more in the Act of persecuting. But this far from St. Paul’s meaning: For he means a civil good, praising, and rewarding, and protecting. Nero did (St. Paul knew) quite contrary to this: He cannot then mean him as a Persecutor; and so never intends here to forbid resisting his Persecution.

Fourthly, go on one step further with the Apostle, which will yet make it more plain if more can be; [But if you do that which is evil then fear, for he bears not the Sword in vain, for he is the Minister of GOD, a Revenger to execute wrath on them that do evil) Evil contrary to Christianity is Idolatry, (for one thing,) and to make Christians Idolaters, did Nero and others persecute them, if they would cast in a grain of Incense into the Fire, by way of sacrifice to their Idols, they were freed.

Now is it St. Paul’s meaning, If you turn Idolater then fear, for Nero bears not the Sword in vain, for he is GOD’S Minister, a Revenger to execute Wrath upon them that commit Idolatry? Or is Christianity the evil they were to fear, as that which he used the Sword against, and that with great wrath and revenge? There is then nothing like the Dr’s Interpretation, In all these Arguments of the Apostle: but the clean contrary, besides what follows, v. 5, 6, 7.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herbert-palmer.html">Herbert Palmer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Scripture and reason pleaded for defensive arms: or The whole controversy about subjects taking up arms Wherein besides other pamphlets, an answer is punctually directed to Dr. Ferne’s book, entitled, Resolving of conscience, &amp;c. The scriptures alleged are fully satisfied. The rational discourses ar</cite>, (London: John White, 1643), pp 48-49.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

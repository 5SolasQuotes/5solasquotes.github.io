<main class="wrap"><figure class="quote" id="q-f6b187594f" data-kw="">
<blockquote><p>…the purpose of Christ while he said to the Pharisees, ‘The Law and the prophets were until John: from that time the Kingdom of God is preached.’ [Lk. 16:16] He had in the parable of the unjust steward, and in the application of the same, spoken somewhat contemptibly of riches: Which when the Pharisees heard, they derided him, and that for this pretended reason (as is evident from the answer which is returned unto them) because the Law promises the world’s goods, as rewards and blessings to the people of God, that by the temporal things, which are set forth for types and shadows of eternal things, they might be instructed, helped and lead as it were by the hand, to the contemplation, desire and expectation of those heavenly and eternal things, which are not seen. Now, Christ did not only rip up the hypocrisy of their hearts, verse 15, but also gave a formal answer to their pretended reason, by showing them how the Law is by Him perfected, verse 16, yet not destroyed, Verse 17. Then, will we observe how He teaches that the Law and the prophets are perfected, and so our point shall be plain. The Law and the prophets were until John. i.e. they did typify and prophesy concerning the things of the Kingdom of God until John, for before that time the faithful only saw those things afar off, and by types, shadows and figures, and the rudiments of the world were taught to know them; But from that time the Kingdom of God is preached. i.e. the people of God are no longer to be instructed concerning the things of the Kingdom of God by outward signs or visible shadows and figure, but only by the plain Word of the Gospel, for now the Kingdome of God [Greek], is not typified as before, but plainly preached, as a thing exhibited to us and present with us. Thus we see, that to us in the days of the Gospel the Word only is appointed to teach the things belonging to the Kingdom of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 5, pp. 83-84</span></figcaption>

</figure><figure class="quote" id="q-74af20edbe" data-kw="">
<blockquote><p>From this cause [native depravity] it proceeds, that many children, who have the opportunity of a good religious education, learn scarcely any thing of the most important truths of Christianity. If they are compelled to commit the Catechism to memory, they are wont to do this without ever thinking of the doctrines contained in the words which they recite; so that, when the attention is at any time awakened to the subject of religion, as a personal concern, they feel themselves to be completely ignorant of the system of divine truth taught in the Bible. Yet even to these, the truths committed to memory are now of great utility. They are like a treasure which has been hidden, but is now discovered. Of two persons under conviction of sin, one of whom has had sound religious instruction, and the other none, the former will have an unspeakable advantage over the latter in many respects.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/archibald-a-alexander.html">Archibald A. Alexander</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Thoughts on Religious Experience</cite>, (Philadelphia: Presbyterian Board of Publication, 1841), ch. 1, p. 13</span></figcaption>

</figure><figure class="quote" id="q-a24ec265da" data-kw="">
<blockquote><p>Reading of Homilies: Albeit that all learned and godly teachers do with one consent condemn an ignorant, unlearned slothful minister, and by all means do persuade to their uttermost endeavor in the furtherance and planting of a godly, learned and painful [characterized by taking many pains] ministry, as Calvin, Epist. 127, fol. 124 &amp; Epistle 87, fol. 164-65; Bucer, Censura, ch. 2, fol. 458 &amp; ch. 7, fol. 465 &amp; Epistle to Cranmer, fol. 683; Idem, On the Reign of Christ, bk. 1, ch. 15, fol. 52, 62; Beza, Epistle 12, fol. 95-96 &amp; Epistle 8, fol. 79; Hyperius, De Scriptur. lect., bk. 1, fol. 122-36 &amp; Tome 2, fol. 675-78; Peter Martyr, loc. inter Epist. fol. 1085; Danaeus, Isag., pt. 3, bk. 3, ch. 45, fol. 373; Zanchi, Obseruat. ad Confes., ch. 25, fol. 66-67; Whittaker, in Epistle Dedicatory contra Paraeus, with diverse others. Yet in a case of necessity, Bucer says that it is better that godly and learned homilies made by others should be rehearsed or read unto the people so long as preachers are wanting, which may holily and wholesomely teach and exhort them; Censura, ch. 7, fol. 465. Also in another place he commands the order used both in the primitive times among the Fathers, as also in England in his time of appointing readers in the Church, with condition, si idonei, if they be fit: if they read gravely, religiously, clearly, and to the people’s edification: if they be de singulari pietate commendati, of singular piety: Else he concludes Illos non esse Ministros Christi, that they are not the ministers of Christ which chop and mumble up their reading, as they cannot be understood with edification by the people: I script. Anglican. de vi et vsu ministerij, fol. 564-65. This Zanchi also cites and approves out of Bucer: Obseruat. ad confess., ch. 25, §10-11, fol. 65-67.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sprint.html">John Sprint</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation</cite>, (London: Bill, 1623), ‘Reformed Practices’, p. 157</span></figcaption>

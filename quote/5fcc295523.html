<main class="wrap"><figure class="quote" id="q-5fcc295523" data-kw="">
<blockquote><p>[T]he Socinian stands out here also, and denies it; alleging that the punishment of false prophets in the Old Testament was speciali jure ‘by special law’ granted to the Israelites, and therefore you must not look (says the Socinian) into the Old Testament for a rule of proceeding against false prophets and blasphemers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-vines.html">Richard Vines</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Authors, Nature &amp; Danger of Haeresy. Laid Open in a Sermon Preached before the Honourable House of Commons</cite>, … March 1646 (London, 1647), p. 64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-e09efd57c8" data-kw="">
<blockquote><p>In this treatise Hemmingsen [a Lutheran] argues that all particular rules of ethical conduct can be derived from immutable axioms or first principles. Though moral philosophy works according to its own rules, Hemmingsen shows that its conclusions, far from being at odds with the divine revelation of the moral law, are identical with the ethical commandments of Scripture. Thus Hemmingsen includes a section on the Decalogue, along with a lengthy account of the traditional cardinal virtues, supported by a myriad of quotations from classical Greek and Roman sources. This important treatise looks both backward to classical and medieval philosophy and forward to developments in the seventeenth century and beyond.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/niels-hemmingsen.html">Niels Hemmingsen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Law of Nature: A Demonstrative Method ed. &amp; trans. Hutchinson</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-3acdf84736" data-kw="">
<blockquote><p>The second note whereby we may discern a judicial law to be moral for his equity, is this: If it follow necessarily and immediately from the light, principles and conclusions of nature. For example, Dt. 22:5, ‘The man shall not put on the things that appertain to the woman, nor the woman the things that appertain to the man.’ This law is more than judicial: for it is a rule of common honesty: practiced in those countries, by the light of nature, where the written law was never known…. This I speak… to show how far judicial laws have morality in them and stand in force.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Commentary or Exposition, upon the Five First Chapters of the Epistle to the Galatians</cite>, (Cambridge, 1604), p. 234</span></figcaption>

</figure><figure class="quote" id="q-194310bf0d" data-kw="">
<blockquote><p>2. Though the Law of Ceremonies, given by Moses, does not oblige Christians, (Christ, the substance of those shadows, being come, Col. 2:17) nor yet the Judicial Law, which was given to the Jewish Commonwealth, and to stand and fall with it, Num. 36:6-7, yet, the Moral Law, or the Law of the Ten Commandments, as being never yet repealed by God, does stand in force, and is binding unto Christians: for, Paul does urge this duty of obedience unto parents upon children, because the Moral Law enjoins it: ‘Honor thy father and mother, which is the first commandment with promise.’ [Eph. 6:2]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Ephesians</cite>, 6:2</span></figcaption>

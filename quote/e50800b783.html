<main class="wrap"><figure class="quote" id="q-e50800b783" data-kw="">
<blockquote><p>I would learn of him what makes a lawful ordinance about matters of fact or things to be done? Not the will of superiors, else there shall be no unlawful ordinances (for every ordinance has the will of the ordainer). Not the lawfulness of the thing in itself which is ordained either, for then every ordinance which prescribes a thing lawful in itselfe, were it never so inexpedient in respect of supervenient circumstances, should be lawful. To a lawful ordinance, then, [is] required not only that the thing ordained be lawful in itself… [but] also that it be not inexpedient. So that a thing may be lawful in itself, yet not lawfully ordained, because the ordinance commands the doing of it; whereas there are many things lawful which ought not to be done, because they are not expedient, 1 Cor. 6:12. 3. Since it cannot be a lawful ordinance which ordains a thing inexpedient, it can not be a lawful obedience which is yielded to such an ordinance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies (1637) | pt. 2, ch. 9</cite>, pp. 41-42</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d330f3a329" data-kw="">
<blockquote><p>§ 10, Direction 7. Meddle not with lawsuits till you have offered an equal arbitration of indifferent men, or used all possible means of love to prevent them. Lawsuits are not the first, but the last remedy. Try all others before you use them. § 11, Direction 8. When you must needs go to law, compose your minds to unfeigned love towards him that you must contend with, and watch over your hearts with suspicion and the strictest care, lest secret disaffection get advantage by it; And go to your neighbor and labor to possess his heart also with love, and to demulce [pacify] his mind, that you may not use the courts of justice as soldiers do their weapons, to do the worst they can against another, as an enemy: but as loving friends do use an amicable arbitration, resolving contentedly to stand to what the judge determines, without any alienation of mind or abatement of brotherly love. § 12, Direction 9. Be not too confident of the righteousness of your own cause, but ask counsel of some understanding, godly and impartial men; and hear all that can be said, and patiently consider of the case, and do as you would have others do by you.</p></blockquote>

</figure><figure class="quote" id="q-40a4d88737" data-kw="">
<blockquote><p>I conclude the proof of this point with the saying of our Savior Christ, Matt 5:18, “Heaven and earth shall pass away, but not one jot or title of the Law shall pass away:” Mark, our Savior says there, that there shall not one jot or title of the Decalogue pass away. As for the Ceremonial, and Judicial Law, they stand not still, but the whole compass of them is removed, the Ceremonial Law is quite and clean abolished; and the Judicial Law, in many particulars; therefore our Savior meant it not of those two Laws, but he speaks of the Decalogue, and He says, Heaven and earth shall passe away, before one jot of it shall pass away, much less an whole branch be rooted out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fenner.html">William Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four Profitable Treatises; of the Sabbath (d. 1640; 1657)</cite>, p. 184</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-9b6f2c952e" data-kw="">
<blockquote><p>With respect to the particular laws by which the Jews were governed, the common sentiment of sound divines, and the best writers on the laws of nations, is, that although the judicial law is not binding as such upon Christian nations, so that they should be bound to regulate all their laws according unto it, yet it demands distinguished attention, and is to be regarded, as a pattern, in those laws which proceeded upon moral grounds. In it there was nothing inconsistent with the principles of equity and religion. God give unto Israel ‘right judgments and true laws, good statutes and commandments.’ All just laws among men are deductions from the moral law, applied to human affairs. But in the judicial law, the conclusions were deduced and applied, not by the fallible and corrupt reason of man (as in ordinary laws) but by unerring wisdom. These respected either the first or second table of the moral law, duties which immediately related to God or man. It is a radical mistake, on this subject, to suppose that the peculiarity of the judicial law did lie solely and properly in its reference to matters of religion, or the first table. It is to be observed also in those laws which related to things civil, or the duties of the second table. There is no more propriety in representing all the judicial laws respecting the first table as peculiar, than there is in representing all those which related to the second table as peculiar. Peculiarities there were in both; but after allowances are made for these, there remain moral grounds for both; and whatever proceeded upon moral grounds in the judicial law, whether it respected things immediately connected with religion, or with justice and civil order, is exemplary, and must be obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie.html">Thomas M’Crie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Statement of the Difference (Edinburgh: George Caw, 1807)</cite>, pp. 125-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

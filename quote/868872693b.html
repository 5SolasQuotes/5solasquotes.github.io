<main class="wrap"><figure class="quote" id="q-868872693b" data-kw="">
<blockquote><p>That the Reformed Presbytery are not rendering to God, according to the benefit done unto them. Is it not an inestimable blessing, that the present government doth not disturb us in the exercise of our holy religion, nor cause us to seek the food of our souls at the peril of our lives? And is not this blessing from a gracious God, who hath the heart of the king in his hand, as the rivers of water; he turneth it whethersoever he will? Is it not matter of thankfulness to the Father of mercies, that we may lead a quiet and peaceable life in all godliness and honesty under our civil rulers? Why then are not supplications, prayers, intercessions, and giving of thanks, made for all men, by the Reformed Presbytery? For kings, and for all that are in authority?

Ezra was as sensible, and as zealous a reformer, as any Presbyterian in Scotland can pretend to be, and we find him expressing the warmest gratitude to God, for the privileges, which the church of Israel enjoyed under the heathen kings of Persia. Ezra vii. 27. Blessed be the God of our fathers, who hath put such a thing as this in the king’s heart, to beautify the house of the Lord which is in Jerusalem. Chap. ix. 9. Our God hath extended mercy unto us in the sight of the kings of Persia, to give us a reviving to set up the house of our God, and to repair the desolations thereof, and to give us a wall in Judah and in Jerusalem.

The practice of this inspired reformer is worthy of imitation, even by a Reformed Presbytery. The example of this champion for the house of his God is recorded for our learning, upon whom the ends of the world are come. The peaceable possession of our civil, and religious privileges under the present government is of God. Praise thy God, O Zion, for he maketh peace in thy borders. Therefore if any man despise this blessing, he is reproved, or rather upbraided by an inspired apostle, Rom. ii. 4. Despisest thou the riches of his goodness, and forbearance, and long suffering; not knowing that the goodness of God leadeth thee to repentance?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fletcher.html">William Fletcher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scripture-Loyalist: Containing a Vindication of Obedience to the Present Civil Government, in things Lawful</cite>, (Carlisle: John McCarrell, 1806), pp 34-35.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2e7fe114e1" data-kw="">
<blockquote><p>Writing on behalf of American Synod to the moderator of the remnant of Old Light Reformed Presbyterians in Scotland, Samuel O. Wylie argued that those in the Scottish Synod who had voted for the removal of ecclesiastical censure from those who voted in British elections had defecting from the covenanting position and were guilty of schism:

[…] It is well known to us that for several years past, you have been enduring a great fight of affliction. The conflicts in opinion and judgment that have marked the meetings of your supreme Judicatory, for some time past, have not been unnoticed by us, not have we failed to observe in the published speeches and arguments of many of your ministers and members evidence of a radical and growing dereliction from a Covenanted faith and practice. We have watched with absorbed and painful interest the progress of events among you, and from the first dreaded the result.

The deliverance of your late Synod touching the Overture, and the political relations of its members and the people under its jurisdiction, though anticipated by us, has filled our hearts with unaffected sorrow. We mourn for the division in our Covenanted Zion, and we mourn, most of all, for the falling away of the Covenanted witnesses, and the dishonour done thereby to truth, and to the memory of a faithful and venerated ancestry. The defection scarcely perceptible in its incipient stages, in the progress of a natural development open and manifest of late to all, has culminated in actual schism, and in avowed departure from the distinctive article and feature in the faith and practice of the Reformed Presbyterian Church. Another dark page in Scotland’s history has been written.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-o-wylie.html">S. O. Wylie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to William Anderson, 3 June 1863 in Covenanter, vii, no. 9 (Sep. 1863), pp 232-3.</cite></span></figcaption>

<blockquote><p>And here also we consider things circumstantial, as time, place, etc. And circumstances are either merely physical [which are not regulated], or 2. merely moral [which are regulated], or 3. mixed, partly moral, partly physical [which are partly regulated]… … 3. There be some mixed circumstances [of worship], as these same physical circumstances, clothed with their own seasonable conveniences; so time for worship, and due and convenient time is required, there may be some scandalous and superstitious time for worship… a place is required for private worship, and a fit place, such as is not the market-street for private praying; the inconveniency of the circumstance may vitiate the worship.</p></blockquote>

</figure><figure class="quote" id="q-5e9be62b2a" data-kw="">
<blockquote><p>This leads me to say that the Board of Directors expects you to make this Seminary—in so far as you are able—thoroughly Presbyterian in its theology. We are well aware that you cannot control the personal convictions of the students, and that there will be men of other denominations in your class-room; but this does not apply to our Presbyterian students. Of course, no man will attempt to enter the Presbyterian ministry when he is at variance with the standards of the Church, which standards he solemnly vows to preach, teach, and defend—unless he be intellectually dishonest.

The Presbyterian student in this Seminary must be made a Presbyterian in faith and thought, and loyal to the distinctive doctrines of our Church, for the Church will not give her money or her endorsement to the institutions which do not believe, accept, and teach her standards. Wherefore, the formulated system of doctrines contained in the Confession of Faith, must be taught and defended; and if you fail in this, you fail in the object for which this Seminary is maintained, and for which its founders established it.

I believe, it would be the sentiment of the Board of Directors that the day when the professors of this institution cannot from conviction teach the standards of the Presbyterian Church, they should carry their talents to other fields, where they may teach that which they do believe, under other auspices than that of an institution whose founders desired to make of their graduates loyal, devout, consecrated, and powerful ministers of the Presbyterian Church. Therefore, it is expected that when the students of this Seminary apply to our Presbytery for licensure, they will not have difficulty in accepting our confessional statements, be- cause of any teaching they may have received in this Seminary.</p></blockquote>

+cause+of+any+teaching+they+may+have+received+in+this+Seminary.%E2%80%9D%0A%0A%E2%80%94+Maitland+Alexander%2C+Charge+to+Dr.+Snowden+in+Bulletin+of+the+Western+Theological+Seminary&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F5e9be62b2a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/5e9be62b2a.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2023/01/09/maitland-alexander-on-a-presbyterian-student-in-his-seminary/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d0d239f23f" data-kw="">
<blockquote><p>A man may be in some sort called by another to exercise some power which is not his that so called him. As when a physician is called by the civil magistrate or by a bishop to exercise such art as he has, among the people that are ruled by him. For no man I think will say that such a physician in giving of a potion does exercise a kingly or an episcopal power. So likewise is the case of a schoolmaster set in place by a bishops license and authority: in teaching of grammar, he does not exercise the power of a bishop.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-766387651f" data-kw="">
<blockquote><p>…when you hear the Lord saying, ‘Where I am, there shall also my servant be,’ do not think merely of good bishops and clergymen. But be yourselves also in your own way serving Christ, by good lives, by giving alms, by preaching his name and doctrine as you can; and every father of a family also, be acknowledging in this name the affection he owes as a parent to his family. For Christ’s sake, and for the sake of life eternal, let him be warning, and teaching, and exhorting, and correcting all his household;</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b3b7b5df6f" data-kw="">
<blockquote><p>The qualities in general requisite in all them, who should bear charge in the Kirk, consist in soundness of religion, and godliness of life, according as they are sufficiently set forth in the Word. … Ordination is the separation and sanctifying of the person appointed to God and his Kirk, after he be well tried and found qualified. … All thir [these], as they must be raised up by God, and by him made able for the work whereto they are called; so ought they know their message to be limited within God’s word, without the bounds of which they ought not to pass. … And generally thir [these] two things ought they all to respect: the glory of God, and edifying of his Kirk, in discharging their duties in their calling.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/second-book-of-discipline.html">Second Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Ch. 3, How the persons that bear Ecclesiastical functions are to be admitted to their office</span></figcaption>

<blockquote><p>The canons and doctrines of the apostles are the foundations whereupon the Church of Christ is built (Eph. 2:20), and contain that absolute certainty of divine truth, that If an angel from heaven should teach otherwise, he should be accursed.&#x27;</p></blockquote>

</figure><figure class="quote" id="q-6e13fc085d" data-kw="">
<blockquote><p>Conservatives argued that the Synod of Philadelphia was correct in interpreting the 1729 Adopting Act in terms of the ‘afternoon minute’ and the strict reinterpretation of 1736. Receiving and adopting the ‘system’ [a term used in 1788] of the [Westminster] Confession meant embracing the whole confession without exception, once the originally scrupled articles on the civil magistrate had been amended in 1788. A larger group of Presbyterians, recalling the original intent of the morning minute of 1729, believed the ‘system’ referred to the Confession’s Calvinistic doctrines; this body advocated the distinction between doctrines ‘essential’ to the system and those that were not. This was the spirit of the old Synod of New York. And there was a third small party, which held that ‘system of doctrine’ [in 1788] referred to the fundamental doctrines shared in common with all Christian churches. This minority expression drew inspiration from the 1729 language ‘systems of Christian doctrine’ [in the early morning session of the Adopting Act 1729]. Some of the early pre-1729 discussions about subscription had advocated this opinion, but, it ultimately had been rejected [Fortson claims] in the compromise of 1729. Nonetheless, a few voices would continue to herald a loose view of subscription which favored mere assent to catholic Christianity as the ‘substance’ of Westminster doctrines.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/s-donald-fortson-iii.html">S. Donald Fortson III</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘New School Calvinism &amp; the Presbyterian Creed’ in The Journal of Presbyterian History</cite>, (1997-), vol. 82, no. 4 (Winter 2004), pp. 221-43, p. 222</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>
<div class="actions"><button class="copy" data-copy="“Conservatives argued that the Synod of Philadelphia was correct in interpreting the 1729 Adopting Act in terms of the ‘afternoon minute’ and the strict reinterpretation of 1736. Receiving and adopting the ‘system’ [a term used in 1788] of the [Westminster] Confession meant embracing the whole confession without exception, once the originally scrupled articles on the civil magistrate had been amended in 1788. A larger group of Presbyterians, recalling the original intent of the morning minute of 1729, believed the ‘system’ referred to the Confession’s Calvinistic doctrines; this body advocated the distinction between doctrines ‘essential’ to the system and those that were not. This was the spirit of the old Synod of New York. And there was a third small party, which held that ‘system of doctrine’ [in 1788] referred to the fundamental doctrines shared in common with all Christian churches. This minority expression drew inspiration from the 1729 language ‘systems of Christian doctrine’ [in the early morning session of the Adopting Act 1729]. Some of the early pre-1729 discussions about subscription had advocated this opinion, but, it ultimately had been rejected [Fortson claims] in the compromise of 1729. Nonetheless, a few voices would continue to herald a loose view of subscription which favored mere assent to catholic Christianity as the ‘substance’ of Westminster doctrines.”

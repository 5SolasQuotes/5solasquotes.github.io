<main class="wrap"><figure class="quote" id="q-8d3b90c672" data-kw="">
<blockquote><p>The second question. But what if there be errors in the Church, or things amiss; may we not then separate ourselves? Answer: Things that may be amiss in the Church must be distinguished: for some faults concern the matter of religion: some the manner: the former respects doctrine principally: the latter the manners of men. First, for things amiss in the manners of men we may not separate; but with Lot have our righteous hearts vexed, and grieved with the wicked conuersation of those among whom we live. The Scribes and Pharisees sitting in Moses’s chair, teaching Moses’s doctrine must be heard; howsoever, the corruptions of their manners be such as they may not be imitated, Mt. 23:1. Yet here obserue further, that although we may not separate ourselves from such corrupt persons in the public assemblies, yet in private conversation we may abstain from them, 1. Cor. 5:11, ‘If any that is called a brother be a fornicator, or covetous, or an idolater, or a railer, or a drunkard, or an extortioner, with such a one eat not.’ That is, eat not privately. Secondly, if the Church err in matter of religion, then must we consider whether the error be in a more weighty and substantial point, or in matter of less importance. If it be in smaller points (the foundation being kept) we may not separate ourselves. 1 Cor. 3:15, ‘If any man’s work burn, he shall lose, but himself shall be safe, yet as if it were by fire.’ Now if the error of the Church be in substance of doctrine, or in the foundation, then we must consider whether it err of human frailty, or of obstinacy: if of frailty we may not separate. The Church of Galatia was through frailty quickly turned to another Gospel, and erred in the foundation, holding justification by works: yet Paul writes unto it as unto a Church of God. So likewise the Church of Corinth erred grievously, and overthrew the article of the Resurrection: and yet Paul behaved himself accordingly unto it. But if the Church err in the substance of religion obstinately, then with good conscience separation may be made. 1 Tim. 4:5, ‘If any man teach otherwise, and consent not to the wholesome doctrine, from such separate thyself.’ An example hereof we have in Acts 19:9, when Paul had preached in the synagogue of the Jews, and could not prevail with them, but they began to blaspheme and speak evil of the ways of God, then he withdrew himself and separated from them. 1 Chron. 11:14-16, when Jeroboam had set up the two calves to be worshipped, many of the best disposed Jews departed from him and came to Rehoboam, and joined themselves with Judah and Jerusalem in the true worship of the God of their fathers. Whence we see that no man may with good conscience separate himself from the Church of England; seeing it teaches, believes, and obeys the doctrine of the prophets and apostles. Further, consider the manner of the separation of these wicked men: there be three sorts of separation: First, by apostasy, when a man falls wholly from his religion, from the Church, and from common grace. Heb. 6:4, ‘It is impossible that they which were once enlightened, if they fall away,’ etc. Secondly, by heresy, when men err in the substance of doctrine and religion, and that of obstinacy. Thirdly, by schism; and that is when men hold the same faith and foundation, and yet disagree and separate in regard of order and ceremony.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Godly &amp; Learned Exposition upon the Whole Epistle of Jude</cite>, ... (d. 1602; London: Kyngston, 1606), on v. 19, pp. 125-26</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-21927d3120" data-kw="">
<blockquote><p>…the business about Easter and ceremonies… ordinarily such debates pretend some lawfulness or unlawfulness in the thing contended for and are to be counted amongst the jangling debates that the men of God are to eschew… 1. That, as there is a necessity of suffering some difference in doctrine, so is there also a necessity to bear with some differences in circumstances in the external manner of worship, etc. and men would not soon offend at every difference, nor be displeased if it proceed not from affectation of singularity, unfaithfulness or some other corrupt rise. And we will find great condescendency in the greatest men both of old and late in things that are not sinful in themselves for keeping of union in the Church: and thus far the apostles’ practice of becoming all things to all will warrant. Zanchius in an epistle to this purpose gives both many examples of and reasons for this. 2… the condemning of the way and manner used by others as having some great absurdity in it, and the pressing of their way, even in circumstances, upon others; These and such things are to be eschewed: and so indeed there is no way to peace in these things but to forbear; for it is more easy to forbear some new thing than to make others alter what is old, except there be some reason in the matter to move to this.</p></blockquote>

<blockquote><p>Let us 1. distinguish of opinions. Some are in the foundation, in those necessary doctrines upon which the House of God is built, 1 Cor. 3:9-10; Heb. 6:1; Mt. 7:24, the errors contrary wherereunto are pernicious and damnable, 2 Pet. 2:1. Some are only in the superstruction which do not so nearly touch the vitals and essentials of religion, which are not fidei but quaestionum, as Augustine somewhere distinguishes. Such were in the apostles’ time disputes touching meats, and drinks, and days, and things indifferent, Rom. 14:5-6, and in our days touching forms of discipline and government in the Church, wherein men abound in their own sense, with meekness and with submission to the spirits of the prophets.</p></blockquote>

<blockquote><p>The student of Christian doctrine, because he strives after exactness of phrase, because he is conscious of the inadequacy of any one human formula to exhaust the truth, will be filled with sympathy for every genuine endeavour towards the embodiment of right opinion. Partial views attract and exist in virtue of the fragment of truth—be it great or small—which they include; and it is the work of the theologian to seize this no less than to detect the first spring of error. It is easier and, in one sense, it is more impressive to make a peremptory and exclusive statement, and to refuse to allow any place beside it to divergent expositions; but this show of clearness and power is dearly purchased at the cost of the ennobling conviction that the whole truth is far greater than our individual minds. He who believes that every judgement on the highest matters different from his own is simply a heresy must have a mean idea of the faith; and while the qualifications, the reserve, the lingering sympathies of the real student make him in many cases a poor controversialist, it may be said that a mere controversialist cannot be a real theologian.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/b-f-westcott.html">B.F. Westcott</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lessons from Work</cite>, pp. 84–85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>
<div class="actions"><button class="copy" data-copy="“The student of Christian doctrine, because he strives after exactness of phrase, because he is conscious of the inadequacy of any one human formula to exhaust the truth, will be filled with sympathy for every genuine endeavour towards the embodiment of right opinion. Partial views attract and exist in virtue of the fragment of truth—be it great or small—which they include; and it is the work of the theologian to seize this no less than to detect the first spring of error. It is easier and, in one sense, it is more impressive to make a peremptory and exclusive statement, and to refuse to allow any place beside it to divergent expositions; but this show of clearness and power is dearly purchased at the cost of the ennobling conviction that the whole truth is far greater than our individual minds. He who believes that every judgement on the highest matters different from his own is simply a heresy must have a mean idea of the faith; and while the qualifications, the reserve, the lingering sympathies of the real student make him in many cases a poor controversialist, it may be said that a mere controversialist cannot be a real theologian.”

<main class="wrap"><figure class="quote" id="q-bda3c051e8" data-kw="">
<blockquote><p>A Christian of uncommon excellence to human view sometimes experiences a great affliction, while one of less devoutness, apparently, is only slightly afflicted, or perhaps not at all. This difference is not caused by the degree of demerit in each instance, but by what the Divine eye sees to be required in each case in order to the best development of character.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-g-t-shedd.html">William G.T. Shedd</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dogmatic Theology</cite>, (Edinburgh: T &amp; T Clark, 1889), 2: 417.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-f6e19a7a29" data-kw="">
<blockquote><p>But we see that the godly are visited with sore anguish and very heavy afflictions beyond others; for in this manner God wishes to try their faith, that, after having laid aside their desires and forsaken the world, they may serve him. Since, therefore, the Lord has a peculiar care of them, he must chastise them, while he permits wicked men to indulge in unbounded licentiousness.

Here we are also reminded that we must endure not merely one or another calamity, and must not imagine that, when we have endured some afflictions, there are none in reserve for us; for we ought always to be prepared to endure new ones. When God begins to chastise his people, he does not immediately cease. We shall “bring forth wind” when we think that the birth is at hand; other calamities will break out, and we shall be continually attacked by additional sorrows. We must therefore maintain this warfare so long as it shall please God to employ us in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), 7: 235.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

</figure><figure class="quote" id="q-a3d25cf4ed" data-kw="">
<blockquote><p>Though their Afflictions come to the heighest, that men can bring them to: Yet will they be infinitly below the Afflictions, that Christ suffered.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-brown-of-wamphray.html">John Brown of Wamphray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Life of Faith in Times of Trial and Affliction</cite>, [s.l.], 1679–80, pt. 2, Consideration 12, p. 137</span></figcaption>

</figure><figure class="quote" id="q-ec29dc9a77" data-kw="">
<blockquote><p>Under the humiliation of Christ are especially comprehended his sufferings, i. e. all those things which Christ endured for our sins, beyond the natural inclination of his will, although he voluntarily endured them; but especially those which he suffered at the end of his life, of which we must now speak. And in order that we may do it with precision, we observe that he not only suffered in body, but also in soul, as is evident, not only from the testimony of scripture, (Matt. xxvi. 38; John xii. 27,) but also because our salvation required that the surety of those sinners who had sinned in soul and body, and to whom the law threatened not only bodily, but also spiritual and internal sufferings, should also suffer both in soul and body. We observe, also, that these sufferings were very great and grievous, though not eternal; the sinner deserved eternal suffering, but the infinite dignity of Christ’s person was an equivalent to infinity of duration.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.10, p. 295.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/trials-the-cross-and-comfort/suffering-and-the-cross.html">Suffering and the Cross</a></span></div>

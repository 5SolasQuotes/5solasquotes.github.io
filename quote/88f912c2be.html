<main class="wrap"><figure class="quote" id="q-88f912c2be" data-kw="">
<blockquote><p>It’s the Law of Nature in general that the whole rule the part, but it follows not [that] therefore every member is to submit to every positive law of the whole though most unjust; the member is to submit to every Law of Nature commanded by the whole: The little finger infected with a gangrene is to submit to the whole man that it be cut off for the safety of the whole body, but its against particular nature that it be cut off, but most suitable to universal nature [regarding the whole]. So in the general it’s natural for the creature-rational to obey the Creator; but it follows not, but it’s a mere positive law that Peter give his life for the Gospel when God by a positive command calls him to it; and the law-positive, if divine, is not contrary to the law of universal-nature [of the whole].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (1658), p. 461</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>4. Distinguish between the Moral, and Ceremonial, and Judicial Law: [1.] The first concerns manners, and the right ordering of a godly conversation; and because these things are of perpetual equity and rectitude, the obligation of this Law as to that is perpetual; and therefore in the expounding of it, these two terms, Moral, and of Perpetual Authority, are all one, and to be taken so.

2. The Judical Law is for regulating outward society, and for government, and does generally (excepting what was peculiar to the people of Israel) agree with the Moral Law; this as given to them is not perpetual, their policy being at an end.

3. The Ceremonial Law is in ceremonies, types, and shadows, pointing at a Savior to come; this is also abrogate[d], the substance being come; but there is this difference, that the Judicial Law is but mortua, ‘dead’; and may, where ’tis thought fit, with the foregoing caution, be used under the New Testament; but the Ceremonial Law is mortifera, ‘deadly’, and cannot without falling from grace, Gal. 5:2,4, be revived.</p></blockquote>

<blockquote><p>7. We take it that the 15th Proposition contains the true mean between the usurped power of some pastors to bind the people, by a known erring sentence, to go against God’s Word; and the usurped power which many pretend to, of ruling the Church by their major vote. But how far the congregation should first have cognisance of the matter, or be heard in the debate; or how far the ministers must endeavor their consent, or suspend their own actions for want of their consent, we do not determine. And therefore all moderate presbyterians and Independents may well agree with us in this; because it’s no power that we deny the pastors, but a power of binding men to go against God’s Word; and it is not any of their liberty that we deny the people, but only ruling ministerial authority, which God never gave them, we must needs deny them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity</cite>, (London: A.M., 1653) | An Explication of Some Passages in the Propositions, p. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>In short, our Reformers [of the Scottish Church, specifically John Knox, c. 1560] maintained: That the doctrine of defensive arms was necessary: that passive obedience or non-resistance was sinful when people had means for resistance (Knox, History, pp. 389, 396, Append. p. 25, 107, Passim.) That Daniel and his fellows did not resist by the sword because God had not given them the power and the means (Ibid., p. 317) That the primitive Christians assisted their preachers, even against the rulers and magistrates, and suppressed idolatry wheresoever God gave them force (Ibid., p. 393). (d) They maintained that the Judicial Laws of Moses (though not adopted into the Christian system) in many considerable instances continued still obligatory; particularly that the laws punishing adultery, murder, idolatry with death, were binding; that in obedience to these laws, that sentence was to be executed not only on subjects, but on sovereigns (Ibid., pp. 391-393; Passim.) That whosoever executes God’s Law, on such criminals, is not only innocent, but in his duty…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-sage.html">John Sage</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fundamental Charter of Presbytery, as it has been lately Established in the Kingdom of Scotland</cite>, p. 337</span></figcaption>

<blockquote><p>Sometime he [Satan] tempts to lawful liberties, to ear, setting the Law of nature in opposition to the divine positive-law, Gen. 3. ‘The tree is good for meat;’ then God and Nature ordained it for food. In all which, holy Sovereignty gives influences natural to the tempter; nor will He have us to question his Sovereignty.</p></blockquote>

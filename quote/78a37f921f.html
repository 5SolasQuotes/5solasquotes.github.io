<main class="wrap"><figure class="quote" id="q-78a37f921f" data-kw="">
<blockquote><p>But it is not any one particular act or habit, nor must it be restricted to any one particular faculty of the soul, for it is a certain complex thing, consisting of various acts, which, without confusion pervade, and by a sweet and happy conjunction, mutually promote and assist one another; it imports a change of the whole man, is the spring of the whole spiritual life, and in fine, the holy energy and activity of the whole soul towards God, in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man: Comprehending a Complete Body of Divinity</cite>, 3.7.1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/faith/nature-of-saving-faith.html">Nature of Saving Faith</a></span></div>

</figure><figure class="quote" id="q-19f01e32d5" data-kw="">
<blockquote><p>Faith comprehends the knowledge of the mystery of God, and of Christ in the light of grace, the truth of which mystery the believer acknowledges with full assent of mind, on the authority of the testimony of God. And not only so, but he is also in love with that truth, exults therein and glorifies God; he likewise ardently desires communion with Christ … wherefore, when Christ is offered to him by the word and Spirit, he receives him with the greatest complacency of soul, leans and rests upon him, and gives and surrenders himself to him.</p></blockquote>

</figure><figure class="quote" id="q-2957ad874d" data-kw="">
<blockquote><p>Endeavour diligently to perform the great work of believing on Christ in a right manner without any delay, and then also to continue and increase in your most holy Faith, that so your enjoyment of Christ, Vnion and Fellowship with him, and all holiness by him, may be begun, continued, and increased in you.</p></blockquote>

</figure><figure class="quote" id="q-159b148544" data-kw="">
<blockquote><p>True saving faith does not consist in assenting to the promises of the gospel, but it consists in a heartfelt trust to be brought to salvation by Christ—this on the basis of His free offer and the promises made to those who trust in Him. We therefore immediately establish that faith is not seated in the intellect, but in the will.</p></blockquote>

<blockquote><p>Thirdly, James has spoken shortly before concerning regeneration, namely, that it occurs through the Gospel. For thus he says 1:18, ‘Of His own will begat He us with the Word of Truth, that we should be a kind of firstfruits of His creatures.’ When he says that we have been born again by the Gospel, he teaches that we have been born again and justified by faith. For the promise concerning Christ is apprehended only by faith, when we set it against the terrors of sin and of death. James does not, therefore, think that we are born again by our works. … but on account of His promise He forgives those who apprehend His promise. Neither do any apprehend His promise, except those who truly believe, and by faith overcome sin and death. These, being regenerated, ought to bring forth fruits worthy of repentance, just as John says, Mt. 3:8.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Apology of the Augsburg Confession</cite>, Trans. F. Bente &amp; W. H. T. Dau (1531; Project Gutenberg, 2004) | pt. 8</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-472d20d9b5" data-kw="">
<blockquote><p>But however it may be: Since among the Lutherans and the Reformed it is not a matter of controversy that:

1. After the Fall, man is intimately corrupt, dead in sins, and therefore utterly unfit to begin and to perfect any spiritual good.

2. Not only faith itself, but also the inclination and disposition to faith is a gratuitous gift of God.

3. Man, in the first moment of conversion, behaves purely passively, etc. From this it is clear that the Reformed and the Lutherans can be reconciled more easily than others concerning this matter. . ‘Theological Dissertation on the Free Will of Man’ trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), pp. 25-26 Latin §XIV… in the first moment of conversion, while the intellect is being illuminated, the will is being prepared, disposed, and changed, it behaves merely passively, with Scripture as witness. Ps. 119:18: God “reveals the eyes to consider the wondrous things of the Divine Law.” Lk. 24:45: he “opens the minds of men, that they may understand the Scriptures.” Acts 16:14: he “opens the heart, that they may attend to those things which are said by the ministers.” Eph. 1:17-18: he “gives the Spirit of Wisdom and of revelation, in the knowledge of Christ, the eyes of our heart being enlightened, that we may know what the hope is of our calling, and what are the riches of the glory of his inheritance in the saints.” Ps. 51:12 &amp; Eph. 2:10: He “creates a clean heart” in them, and “renews a right spirit” in their bowels. Eze. 36:26-27: he “gives a new heart and puts a new spirit in the midst of the converted: and takes away the stony heart out of their flesh, and gives them a heart of flesh, and puts his spirit in the midst of them, and causes them to walk in his commandments, and to keep his judgments, and do them.” Jn. 3:5 &amp; 1 Pet. 1:3: he regenerates from heaven. Jn. 6:44: he draws. Eph. 1:19-20: he “works on them according to the operation of the might of his power, which he wrought in Christ, raising him up from the dead.” Phil. 2:13: he works “both to will and to accomplish.” 2 Thess. 1:11: He “fulfills all the good pleasure of his goodness, and the work of faith in power” in them. Heb. 13:21: He “works in them that which is well pleasing in his sight through J.C.” Jer. 31:33: He “gives his law in their bowels, and will write it in their heart.” Whence Israel there sighs in vv. 18-19 “Convert thou me, and I shall be converted: for thou art the Lord my God. For after thou didst convert me, I did penance: and after thou didst show unto me, I struck my thigh.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Treatise on Predestination, Election &amp; Reprobation of Men</cite>, ed. tr. by AI by Nosferatu (Leiden, 1705), p. 163</span></figcaption>

">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d6bb455246" data-kw="">
<blockquote><p>In these commands God speaks to his Church, to his people who had long been his delight; therefore they must have been already regenerate; since, without regeneration no one can see or enter into the kingdom of God. Therefore by these commands God does not mean to bring about regeneration as it denotes the first infusion of the spiritual life, but the drawing forth of that life which is infused by regeneration into the second acts or consequent exercises (which is expressly mentioned in the passage, from whence the first of these commands is quoted) which is done in conversion, that follows upon regeneration, in which man, being drawn, runs after God; being turned, he actively converts and turns himself to God by the power of his grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Regeneration</cite>, … (New Haven, 1770), | section 25, pp. 36-37</span></figcaption>

</figure><figure class="quote" id="q-bd3525cc7f" data-kw="">
<blockquote><p>It is customary to consider this repentance in two ways: either as a spiritual disposition poured into our hearts by the Holy Spirit, or as an action from us that proceeds from that disposition. In the first way, it is properly speaking and in its strict sense called regeneration; in the second way, it is called repentance, taken in a more restricted sense, or penitence. And when the two are taken together it is called the circumcision of the heart, the conversion to God, the renewal of the Spirit, the sanctification of man, the new creation, and the first resurrection.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/anthony-walaeus.html">Antonius Walaeus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Synopsis of a Purer Theology</cite>, tr. Reimer Faber, ed. Henk van den Belt (Brill, 2016), Disputation 32, ‘On Repentance’, section 2, p. 277</span></figcaption>

<blockquote><p>In the work of our regeneration three graces be required: the preventing grace, the working grace and the co-working grace. The preventing grace is when God of his mercy sets and imprints in the mind a new light, in the will a new quality or inclination, in the heart new affections. The working grace is when God gives to the will the act of well-willing, namely the will to believe, the will to repent, the will to obey God in his Word. (Velle credere, velle resipiscere, velle obedire.) The co-working grace is when God gives the deed to the will, that is, the exercise and practice of faith and repentance. The first gives the power of doing good, the second the will, the third the deed: and all three together make the work of regeneration. (Augustine, Of Grace &amp; Free Will, ch. 17) Now the will of man in respect of operation does not concur with God’s preventing grace, but is merely patient as a subject to receive grace. For it is the proper work of God to set or imprint a new faculty or inclination in the will, and that without any action of the said will. Nevertheless the will being once renewed and prevented, concurs by his operation with the working and co-working grace of God. For the will being moved by grace, wills and does indeed that whereunto it is moved. And the will to obey God, or to perform any like duty, proceeds jointly from two causes. From grace: in that it moves and causes the will to will to believe. From the will of man: in that being prevented and moved by God, it wills to believe, or to do any like duty. And therefore the ancient saying has his truth, ‘He that made thee without thee, does not regenerate or save thee without thee’ (Augustine, Sermon 15, Of the Words of the Apostles), because our conversion is not without the motion and consent of will, as our creation was. And that we do not mistake in this point, the order that is between man’s will and God’s grace must here again be remembered. In respect of time they are both together, and concur in the very first moment of our regeneration: in respect of the order of nature, the will does not first begin that which is good, and then after borrow aid from grace: but grace prevents, renews, and moves the will, and then the will moved or changed wills to be converted and to be healed in the first instant of conversion.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-163b2a8c19" data-kw="">
<blockquote><p>Now it remaineth that I entreat of a Magistrate, who in my judgment may thus be described: namely, a person chosen by the institution of God, to keep the laws as touching outward discipline, in punishing of transgressors with punishment of the body, and to defend and make much of the good. There are undoubtedly many persons elected by the institution of God, which are not Magistrates: such as Ministers of Churches, which nevertheless are keepers of the word of God and of his law, but not only as touching outward discipline. Because it is the office of ministers, though the word of God to pierce even to the inward motions of the mind: because the holy Ghost joineth his power, both to the right preaching of his word, and also to the sacraments which are ministered in the Church. But the Magistrate only exerciseth outward discipline and punishment upon transgressors.

The minister in the name of God, bindeth the guilty and impenitent and in his name excludeth them from the kingdom of heaven, as long as they shall so remain. The Magistrate punisheth with outward punishments, and when need requireth, useth the sword. Both of them nourish the godly, but diversely. The Magistrate advanceth them with honours riches and dignities. The minister comforteth them with the promises of God &amp; with the sacraments. Wherefore the Magistrate is appointed to the end that the laws should be diligently kept, the guilty punished, and the good holpen and fostered. And certainly the law is as dumb Magistrate: and again, the Magistrate, is a living and speaking law, and is also the Minister of God (as Paul saith) to their praise which do well: and on the otherside he beareth the sword against the wicked as judge and revenger of God, neither tend these things to any other end than to the safety of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/peter-martyr-vermigli.html">Peter Martyr Vermigli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Loci Communes:</cite>, The Common Places, trans. Anthony Marten (2nd edn, London, 1583), 4.13.1, p. 226.</span></figcaption>

<blockquote><p>Moreover, the law of Moses is an example of the natural law, most suitably expressing the common notions of nature endowed by natural law. For the principles and conclusions of the natural law, that is, those common notions of nature, are perfectly expressed in the law of Moses. These common notions not only exist in the corrupted nature of man, but also existed in the pure and original nature.</p></blockquote>

</figure><figure class="quote" id="q-1926b08cf8" data-kw="">
<blockquote><p>I respond [to an Arminian]: Be it so, that the precept “Repent and believe the Gospel” binds all and every man; be it so, that that precept is proclaimable to all men by the will of God; yet since in fact it is not announced to all, and that by a special dispensation of God, such are excused by invincible ignorance, so that they do not exercise supernatural acts concerning supernatural objects. For invincible ignorance on this part rightly excuses. For positive precepts do not bind those to whom they are not promulgated. And therefore, such a one, as he can have no knowledge of any obligation, so he can be conscious to himself of no prevarication. (See Puteanus on pt. 1 of 2, q. 90, art. 4, concl. 1). 2… But for something to be imputed to a man as a fault, it must in some way be avoidable, voluntary, and known.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-ward.html">Samuel Ward</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Negative Infidelity</cite>, [of the Gospel] Condemns No One [due to Invincible Ignorance]’ in Theological Determinations in Works of Samuel Ward, ed. Seth Ward (d. 1643; Gallibrand, 1658), pp. 55-56</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-e1d97dcd68" data-kw="">
<blockquote><p>There is therefore need that both our hands should be employed in doing good. Now the two hands of a Christian Kingdom are the Magistracy and Ministry thereof. The business of Reformation calls for both. As we commonly use our hands for the washing and cleansing of each other. So if the Minister be extravagant, the Magistrate may correct him; then the right hand washeth the left: If the Magistrate do amiss, the Minister may admonish him, then the left hand clenseth the right.

But he that makes use of one hand to cut off the other with, destroys his body: such would our condition be, if either Ministers should suffer the Magistracy to be cried down; or Magistrates permit the Ministry to be debased. Scripture and experience bid us hope, that Amalek shall then be foiled, and Israel prevail, when faith in Christ, and zeal for truth shall support both these hands, as Aaron and Hur did those of Moses upon the mount.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-arrowsmith.html">John Arrowsmith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A great wonder in heaven, or, A lively picture of the militant church drawn by a divine pencil: Revel. 12, 1, 2: discoursed on in a sermon preached before the honourable House of Commons, at Margaret’s, Westminster, on the last monthly fast-day, January 27, 1646/7</cite>, (London: Samuel Man, 1647), p. 43.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

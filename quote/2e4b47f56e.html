<main class="wrap"><figure class="quote" id="q-2e4b47f56e" data-kw="">
<blockquote><p>The next thing to be considered, is the trial of the righteous, who are said to stand before Christ’s judgment-seat. Here it may be observed that no indictment shall be brought against them, at least, with the Judge’s approbation; for they were acquitted and discharged, when brought into a justified state; and as the consequence of their having been so, ‘none,’ as the apostle says, ‘shall lay any thing to their charge,’ since ‘it is God that justifieth.’ If any thing be alleged against them by the enemies of God, who loaded them with reproach, and laid many things to their charge in this world of which some have been just, and others unjust and malicious, the great and merciful Judge will appear as an advocate on their behalf, and will vindicate them from those charges which are ungrounded, and will farther allege, as a foundation of their discharge from the guilt of all others, that he has made a full atonement for them. Hence, when their sins are sought for, they shall not be found in judgment, or charged upon them to their shame, confusion, or condemnation; but they shall be pronounced righteous, as interested in Christ’s righteousness. The great Judge shall evince that they are so, by producing those graces which were wrought in them, which are inseparably connected with their justification, though not the foundation of it, that so the method of the divine proceedings may be vindicated, and it may appear that, as ‘without holiness no one shall see the Lord,’ so they are holy, and accordingly possess that internal quality which denotes them to be persons whom God designed to save. This I take to be the meaning of our Saviour’s address to the righteous, when he pronounces them ‘blessed,’ and invites them to ‘come and inherit the kingdom prepared for them from the foundation of the world; for I was an hungered, and ye gave me meat; I was thirsty, and ye gave me drink,’ &amp;c. Here the word ‘for’ is taken demonstratively, and not causally; and denotes that they were such as might expect to be admitted to this honour and blessedness, having those marks and characters of his children upon them to which the promise of salvation was annexed; not as though any thing done by them was the cause of their salvation. It hence appears that the graces of God’s people shall be published before angels and men, to the praise of the glory of him who was the author of them. But there is a difficult question proposed by some, namely, Whether shall the sins of God’s people be published in the great day; though it is certain they shall not be alleged against them to their condemnation? This is one of the secret things which belong to God, which he has not so fully or clearly revealed to us in his word; so that we can say little more about it than what is matter of conjecture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-ridgley.html">Thomas Ridgley</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Body of Divinity</cite>, vol. 2 (New York: Robert Carter &amp; Brothers, 1855), 277–78.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2fe58a00b8" data-kw="">
<blockquote><p>Therefore whoever knows well how to distinguish the Gospel from the Law should give thanks to God and know that he is a real theologian. I admit that in the time of temptation I myself do not know how to do this as I should. The way to distinguish the one from the other is to locate the Gospel in heaven and the Law on earth, to call the righteousness of the Gospel heavenly and divine and the righteousness of the Law earthly and human, and to distinguish as sharply between the righteousness of the Gospel and that of the Law as God distinguishes between heaven and earth or between light and darkness or between day and night. Let the one be like the light and the day, and the other like the darkness and the night. If we could only put an even greater distance between them! Therefore if the issue is faith, heavenly righteousness, or conscience, let us leave the Law out of consideration altogether and let it remain on the earth. But if the issue is works, then let us light the lamp of works and of the righteousness of the Law in the night. So let the sun and the immense light of the Gospel and of grace shine in the day, and let the lamp of the Law shine in the night. These two must be distinguished in your mind in such a way that when your conscience is completely terrified by a sense of sin, you will think of yourself. “At the moment you are busy on earth. Here let the ass work, let him serve and carry the burden that has been laid upon him; that is, let the body and its members be subject to the Law. But when you ascend into heaven, leave the ass with his burdens on earth; for the conscience has no relation to the Law or to works or to earthly righteousness. Thus the ass remains in the valley; but the conscience ascends the mountain with Isaac, knowing absolutely nothing about the Law or its works but looking only to the forgiveness of sins and the pure righteousness offered and given in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-luther.html">Martin Luther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures on Galatians</cite>, On Galatians 2:14 in Luther’s Works, Vol. 26: Lectures on Galatians, 1535, Chapters 1-4, ed. Jaroslav Jan Pelikan, Hilton C. Oswald, and Helmut T. Lehmann, vol. 26 (Saint Louis: Concordia Publishing House, 1999), 115–16</span></figcaption>

<blockquote><p>XIII… But, so that we may perceive this more easily and correctly, it must be maintained that: (1) good works, simply, confer entirely nothing to obtain for us the right to eternal life, because that is the pure, unadulterated [Greek; charisma], gift, of God (Rom. 6:23), impetrated by only the righteousness of Christ; but at the same time (2) their presence is required for many reasons, if not before all justification, at least with justification and after it. Hence, three stages of justification should be diligently observed here, namely: (1) Its constitution, wherein a person is first justified. Here is excluded not only the efficacy of good works to procure justification, but even their very presence, insofar as God justifies the sinner (Rom. 3:23) and the ungodly (Rom. 4:5). (2) Its continuation. Here though no efficacy of good works is admitted for justification, yet their presence is required (Gal. 5:6). And in this sense perhaps, James denies that we are justified by faith alone, but requires works in addition (James 2:14, 17–18, 20–22, 24–26). Finally, (3) Its consummation, wherein the right of eternal life conferred in the first stage and continued in the second is advanced also to its possession. Here, not only the presence of good works is required, but also some sort of efficacy of them, insofar at least as God does not will to confer the possession of eternal life, the right of which we already obtain by Christ’s merit alone, except, besides faith, with good works going before (Heb. 12:14; Matt. 7:21; 25:34–36; Rom. 2:7, 10).</p></blockquote>

%0A%0A%E2%80%94+Petrus+van+Mastricht%2C+Theoretical+Practical+Theology+%282nd+ed.+1698%3B+RHB%29%2C+vol.+5%2C+pt.+1%2C+bk.+6%2C+ch.+6%2C+%E2%80%98The+Justification+of+those+to+be+Redeemed%E2%80%99%2C+pp.+121&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3eaa37cff6.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3eaa37cff6.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-the-continuation-of-justification/#:~:text=But%2C%20so%20that%20we%20may%20perceive,Matt.%207%3A21%3B%2025%3A34%E2%80%9336%3B%20Rom.%202%3A7%2C%2010&amp;text=But%2C%20so%20that%20we%20may%20perceive%20this%20more&amp;text=Heb.%2012%3A14%3B%20Matt.%207%3A21%3B%2025%3A34%E2%80%9336%3B%20Rom.%202%3A7%2C%2010" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-a8d5e74bd6" data-kw="">
<blockquote><p>However, our inherent righteousness, which is begun in the renewal through the Holy Spirit, is not such on account of the adhering imperfection and impurity of the flesh. Therefore a different righteousness is necessary, by which, when it enters in and intercedes, we may be justified before God to life eternal. This indeed is the satisfaction and obedience, that is, the righteousness of Christ, the Mediator, which is offered through the ministry of the Word and of the sacraments, is apprehended by faith, and is imputed by God to the believers, so that we can interpose it between the judgment of God and our sins, so that we are protected under it as under a shield from the divine wrath which we have deserved, so that “covered by it we may now boldly and securely stand before the divine tribunal and thus be pronounced righteous to life eternal.”</p></blockquote>

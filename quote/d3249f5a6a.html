<main class="wrap"><figure class="quote" id="q-d3249f5a6a" data-kw="">
<blockquote><p>But the father, or nearest friend, whose daughter being a virgin is defloured, hath power by the law of God to compel the man that did that injury to marry his daughter; or if the father will not accept him by reason of his offence, then may he require the dowrie of his daughter; which if the offender be not able to pay, then ought the Civil Magistrate to punish his body in some other punishment.

And because that fornication, whoredom, and adultery, are sins most common in this Realm, We require of your Honours, in the name of the Eternal God, that severe punishment, according as God hath commanded, be executed against such wicked offenders; for we doubt not but such enormous crimes openly committed, provoketh the wrath of God, as the Apostle speaketh, not only upon offenders, but also upon such places as where, without punishment, they are committed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/first-scottish-book-of-discipline.html">First Scottish Book of Discipline</a></span><span class="wk"><span class="lbl">Work:</span> <cite>repr in The works of John Knox, ed. David Laing</cite>, (6 vols, Edinburgh, 1856), ii, 247.</span></figcaption>

<blockquote><p>Besides the moral law, God gave to Israel ceremonial and judicial laws; the two latter are of limited and temporary use; the former is of universal and perpetual obilgation. … 2. The judicial law respected the Jews in their political capacity, or as a nation, and consisted of those institutions which God prescribed to them for their civil government. This law, as far as the Jewish polity was peculiar, has also been entirely abolished; but as far as it contains any statute founded in the law of nature common to all nations, it is still obligatory.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-shaw.html">Robert Shaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Confession of Faith</cite>, 19.4</span></figcaption>

<blockquote><p>Q. How is man by sin in the state of death?

A. By the just sentence of God, delivering him for sin, into the power both of corporal and eternal death; signified by expelling our parents out of Paradise, and debarring them of the Sacramental tree of Life.

Q. What are we to understand by corporal death?

A. The separation of the soul, and body, with all evils that attend thereon, or make way thereto, as sorrow sickness, shame, servitude, penury, &amp;c. yea even blessings are cursed, and prosperity causeth ruin.

Q. What is eternal death?

A. It is the final separation of the whole man in hell for ever, from God’s favourable presence and fellowship; together with present bondage under Satan, hellish horrors, and such like fore-runners of damnation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-crooke.html">Samuel Crooke</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The guide unto true blessedness. Or, A body of the doctrine of the Scriptures, directing man to the saving knowledge of God</cite>, (London: John Pindley, 1613), pp 29-30.</span></figcaption>

</figure><figure class="quote" id="q-9da1a8adb5" data-kw="">
<blockquote><p>Their [Israel’s] Political Constitution was Monarchical, Aristocratical, and Democratical: and therefore most prudently and perfectly composed. 1. Monarchical, In that God would still have it Governed by One, as Supreme; viz. First by Moses, then by Joshua, then by Judges, then by Kings, then by Princes and Governors after the Captivity: The raising up and erecting of which Supreme Rulers, God reserved still to himself as Supreme over all.

2. Aristocratical. In that seventy chief, wise, understanding, and known men among their tribes were as Princes set over them as assistants to the Supreme Governor, Moses, &amp;c. 3. Democratical, In that these chief Heads were chosen by the people themselves out of every Tribe. This was the form of their Polity; the best form, and most excellently composed, for preventing of Anarchy, Popular Confusions and Divisions, Arbitrariness, and Tyranny.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-roberts.html">Francis Roberts</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mystery and Marrow of the Bible: God’s Covenants with Man</cite>, (London: George Calvert, 1657), 3.4.1.2.3, p. 674.</span></figcaption>

<blockquote><p>Answer. None of us do teach that it is against the light of nature that the adverse party be the judge; it might fall out in a general council lawfully convened, from which there is no provocation; yea and in a national council (for all councils may err) the adverse party may judge, as it was a lawful council according to a Church-constitution that condemned Christ of blasphemy, and they were also his enemies;</p></blockquote>

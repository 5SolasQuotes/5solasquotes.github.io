<main class="wrap"><figure class="quote" id="q-4b07a0e66a" data-kw="">
<blockquote><p>And not only Peter but also all the apostles, by making this confession—which they would soon proclaim in the midst of the world—laid the foundation of the church of Christ. Accordingly, figuratively speaking, along with Peter they were all of them the rock on which Christ built his church; or, in another application of the same image, Christ is the rock that the apostles by their preaching laid as the foundation of the church (Acts 4:11; Rom. 9:33; 1 Cor. 3:10–11; Eph. 2:20; 1 Pet. 2:5–6; Rev. 21:14).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics, vol. 4</cite>, §502</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-66d40d7be9" data-kw="">
<blockquote><p>The Council of Trent having stamped the Vulgate as ‘authentic,’ ordered that a correct edition of this authorized Vulgate should be published. But little was done in fulfilment of this decree for nearly forty years, when the task was undertaken by Pope Sixtus V., a Pontiff who seems really to have believed in his own infallibility. He employed a Board of learned men to act as revisers, but in complete subordination to himself. In his preface he claims the superiority to them which he exercised, as resulting from the singular privilege which he enjoyed as successor to Peter, the Prince of the Apostles, for whom Christ prayed that his faith should not fail, and who was charged to confirm the other Apostles in the faith. … But a glance at the volume was sufficient to convince any moderately learned man of the folly, not to say impiety, of such boastful presumption. Many passages were found covered with slips of paper on which new corrections had been printed; others were scratched out and merely corrected with a pen; and different copies were corrected in different ways. A closer examination showed those competent to judge that the edition had graver faults than could be accounted for by printers’ carelessness. Sixtus had changed the readings of those whom he had employed to report upon the text with the most arbitrary and unskilful hand; and it was scarcely an exaggeration to say with Bellarmine that his precipitate self-reliance had brought the Church into the most serious peril.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-salmon.html">George Salmon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Infallibility of the Church</cite>, Lecture XIV</span></figcaption>

ul%20hand%3B%20and%20it%20was%20scarcely%20an%20exaggeration%20to%20say%20with%20Bellarmine%20that%20his%20precipitate%20self-reliance%20had%20brought%20the%20Church%20into%20the%20most%20serious%20peril.%E2%80%9D%0A%0A%E2%80%94%20George%20Salmon%2C%20The%20Infallibility%20of%20the%20Church%2C%20Lecture%20XIV&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F66d40d7be9.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/66d40d7be9.html">Permalink</a><a class="src" href="https://archive.org/details/infallibilitych01salmgoog" rel="noopener" target="_blank">Read it online · Internet Archive</a></div>
</figure><figure class="quote" id="q-41deb671e7" data-kw="">
<blockquote><p>Finally, councils, fathers, popes, are men; and scripture testifies that all men are deceitful. How then shall I acquiesce in their sentence? How can my conscience certainly determine, so as to leave no room for my faith to waver, that whatever they may pronounce is true? This is surely to leave no difference between God and men. For I believe what God says to be true, because he says it, and seek no other reason; but when I hear scripture saying that “all men are liars,” I dare not ascribe so much to man, lest I make him equal to God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture</cite>, q. 5, ch. 8</span></figcaption>

</figure><figure class="quote" id="q-669e01d933" data-kw="">
<blockquote><p>Your see, however, which is called the Court of Rome, and which neither you nor any man can deny to be more corrupt than any Babylon or Sodom, and quite, as I believe, of a lost, desperate, and hopeless impiety, this I have verily abominated, and have felt indignant that the people of Christ should be cheated under your name and the pretext of the Church of Rome; and so I have resisted, and will resist, as long as the spirit of faith shall live in me.</p></blockquote>

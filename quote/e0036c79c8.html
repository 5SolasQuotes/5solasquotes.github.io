<main class="wrap"><figure class="quote" id="q-e0036c79c8" data-kw="">
<blockquote><p>An institution is that which is merely founded upon God’s will, raising up a thing beyond its own natural or moral efficacy, with an efficacy beyond it… Institutions are not only express commands in the letter of them; for examples and promises, hints and implicit intimations may hold forth the will of Christ. Neither is everything that is the will and command of Christ an institution… So also there are means of edification which are providential, and so occasionally will serve… So as the constant setting apart of such a thing, for such an end (though providentially and occasionally, it may serve for such an end) rises up to an institution also. …Institutions are but the will of Christ, declared concerning such things as are exercised above the common nature of them, to a further spiritual end. Therefore the declaring the will of God about them, holds in common with the declaration of God’s will in other commands… We do not make everything a promise is made to an institution… promises are the declaration of God’s will, be they made to what things soever; and if they fall upon such things as are raised up above natural and common efficacy, with promise of a supernatural power to accompany them, then they are institutions…. When there is a commission of power given, there is a declared institution.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Of the Constitution, Right, Order &amp; Government of the Churches of Christ (London: Snowden, 1696), ch. 4, pp. 17-19 in The Works of Thomas Goodwin… the Fourth Volume (London: Darby, 1697)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-04b739149d" data-kw="">
<blockquote><p>Hitherto concerning the causes of Christian theology: its parts follow, which are two: One, the knowledge of God: the other, His worship: both of which are directed toward the glory of God and the salvation of man. Explanation: Christian theology is rightly distributed into these parts: For theology is the doctrine of salvation: And our salvation and blessedness consists in these two parts: (1.) That we rightly know God. (2.) That we rightly worship Him, being rightly known. And so indeed we rightly know God, so that we might sincerely worship Him. Christ expresses these to parts in Mark 1:15, ‘repent ye, and believe the Gospel.’ Scripture expresses the same parts elsewhere by faith and love, 2 Timothy 1:13: by faith and a good conscience, 1 Timothy 1:19. Paul also distributed his Theology into these parts, Acts 24:14-16, I believe all things which are written, and have hope in GOD: and I do exercise myself to have a conscience void of offence. Whence the same Paul reprehends the Gentiles, because they glorified not God, neither were they thankful, Romans 1:21. Whence Athanasius, in an oration, unum esse Deum [There is one God], elegantly states: The whole salvation of Christians consists in believing and worshipping. Hence it is evident that theology is rather practical teaching, than theoretical, because its theory is directed toward practice, that is, the worship of God: on which pretext some prefer it to be called prudentiam/prudence, rather than scientiam/science or sapientiam/wisdom: even though it embraces the highest wisdom in itself… In the same sense, by others faith and good works are constituted as the parts of theology.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology (Hanau, 1634; 2nd ed., Amsterdam, 1657)</cite>, bk.1, ‘The Distribution of Theology’</span></figcaption>

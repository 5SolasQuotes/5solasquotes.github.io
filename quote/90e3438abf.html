<main class="wrap"><figure class="quote" id="q-90e3438abf" data-kw="">
<blockquote><p>Out of all which, I conclude that no law as a law does oblige the conscience, but that which has from the matter moral equity, and not from the intention of the lawgiver, as Cajetan, Silvester, Angelus and Corduba teach, which intention must take a rule from the matter of the law, and not give a rule. Gerson, no law (says he) is a law to be called as necessary to salvation (as all good laws should be) but that which de jure divino, is according to God’s law… And therefore his [Durandus’s] mind is that all obligation of conscience in human commandments comes from God’s will and law, that is, from the just and necessary matter of the law, not from the will of men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646)</cite>, Ch. 2, Question 2; p. 205</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-government-and-the-ministry/synods-and-assemblies.html">Synods and Assemblies</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-826115b327" data-kw="">
<blockquote><p>…we shall premise some common and known truths concerning Church-judicatories and their decrees and sentences, as: 1. That (to express it in Calvin’s words, in the eighth chapter of the fourth book of his Institutions) whatsoever reverence or dignity is by the Spirit of God in the Scriptures given, whether to the priests, or prophets, or apostles, or their successors, all of it is given not properly to men themselves, but to the ministry, wherewith they are clothed; or (to speak more expeditely) to the Word; the ministry whereof is committed unto them, Ex. 3:4; 14:31; Deut. 17:•; Mal. 2:46; Deut. 17:10; Eze. 3:17; Jer. 23:28; Jer. 1:6; Mt. 28:19; Acts 15:10; etc. 2. That as their authority is founded upon, and wholly derived from the Word of God, so in the administration and exercise thereof, they are in all things to walk according to this rule, Isa. 8:19-20; Mal. 2:6-7; Mt. 28:19. 3. That Church-power is not a lordly and magisterial power, but a lowly and ministerial-power, not an absolute and autocratoric, but a limited and hyperetic-[below-kind-of-]power; and that Church decrees and sentences are all of them regulae regulatae, [rules being regulated] rules that are subordinated, and do not bind but in the Lord, and so far as they are conform to that first inflexible and unerring-rule, prescribed by Himself, Lk. 22:24-27; Gal. 6:16; 1 Peter 5:2-3; 1 Tim. 3:15-17; 1 Thess. 5:12; Eph. 6:1.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-guthrie.html">James Guthrie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protesters No Subverters… (1658)</cite>, p. 95-6</span></figcaption>

</figure><figure class="quote" id="q-ec975dbf30" data-kw="Councils Authority of councils Sola Scriptura">
<blockquote><p>What, then, you will say, is there no authority in the definitions of councils? Yes, indeed; for I do not contend that all councils are to be condemned, and all their acts rescinded, or, as it is said, made one complete erasure. But you are bringing them all (it will be said) under subordination, and so leaving every one at liberty to receive or reject the decrees of councils as he pleases. By no means; but whenever the decree of a council is produced, the first thing I would wish to be done is, to examine at what time it was held, on what occasion, with what intention, and who were present at it; next I would bring the subject discussed to the standard of Scripture. … In this way, councils would be duly respected, and yet the highest place would be given to Scripture, everything being brought to it as a test.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, 4.9.8</span></figcaption>

</figure><figure class="quote" id="q-434a2843e4" data-kw="">
<blockquote><p>[Rutherford’s Anglican opponents said:] ‘Notwithstanding, that crossing, kneeling, surplice, human holy days occasion the soul-murder of him for whom Christ died, yet we the Prelates command the practice of the foresaid ceremonies as good and expedient for edification, for our commandment makes the murdering of our brethren, to be obedience to the Fifth Commandment.’ [Rutherford responds:] But if Prelates may command that which would be otherwise, without, or before the Commandment [of God], [even] spiritual murdering and scandalizing of our brother, they may command also that which would be otherwise without or before their command: adultery against the Seventh, and theft against the Eighth, and Perjury and lying against the Ninth Commandment, and concupiscence against the Tenth; for the Fifth Commandment has the precedency before the Seventh, Eighth, Ninth and Tenth Commandments no less than before the Sixth, which forbids the killing of our brother’s soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (1646), Question 4, ‘Whether the Precept of Obedience to Superiors, or the Precept of Eschewing Scandal be More Obligatory?’</cite>, p. 47</span></figcaption>

<blockquote><p>It shall be bound in heaven, and loosed in heaven: not that Christ has hereby obliged himself to confirm all church-censures, right or wrong; but such as are duly passed according to the Word, clave non errante [the key not erring]–the key turning the right way, such are sealed in heaven; that is, the word of the gospel, in the mouth of faithful ministers, is to be looked upon, not as the word of man, but as the word of God, and to be received accordingly, 1 Thess. 2:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/matthew-henry.html">Matthew Henry</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew 16, verse 19</cite></span></figcaption>

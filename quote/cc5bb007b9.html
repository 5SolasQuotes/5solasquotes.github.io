<main class="wrap"><figure class="quote" id="q-cc5bb007b9" data-kw="">
<blockquote><p>It has become fashionable in modern evangelical and “Reformed” circles to deny the classic catholic and confessional Reformed doctrines of God’s impassibility and simplicity. The early church father, Irenaeus of Lyon reminds us that these doctrines were also denied by the early Gnostic heretics:

By their manner of speaking, they ascribe those things which apply to men to the Father of all, whom they also declare to be unknown to all; and they deny that He himself made the world, to guard against attributing want of power to Him; while, at the same time, they endow Him with human affections and passions.

But if they had known the Scriptures, and been taught by the truth, they would have known, beyond doubt, that God is not as men are; and that His thoughts are not like the thoughts of men. For the Father of all is at a vast distance from those affections and passions which operate among men. He is a simple, uncompounded Being, without diverse members, and altogether like, and equal to himself, since He is wholly understanding, and wholly spirit, and wholly thought, and wholly intelligence, and wholly reason, and wholly hearing, and wholly seeing, and wholly light, and the whole source of all that is good—even as the religious and pious are wont to speak concerning God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/irenaeus-of-lyons.html">Irenaeus of Lyons</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Heresies</cite>, (c. 175-85), 2.13.3 in Ante-Nicene Fathers, 1: 374.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d4c0f223a0" data-kw="">
<blockquote><p>We understand these attributes to be one from God’s perspective, however, such that they can neither be divorced from the divine Being nor essentially and properly from each other as they exist in God, but are the simple, absolute Being of God Himself.

We, however, relate these attributes as distinct entities by themselves. Justice and mercy are one in God, but we differentiate between them in reference to the objects towards which they are manifested, and the effects of these manifestations. Our God is inimitable and incomprehensible in His perfection, and consequently is simple and indivisible.

In God there can be no differentiation between various matters, for whatever would be essentially distinct from God would render Him imperfect. Our limited comprehension must deal with each matter individually, however, and thus we assign distinct names to each attribute. Whatever we are capable of comprehending concerning God is according to truth and is consistent with His Being, but our finite understanding cannot penetrate its perfection and infinity</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/wilhelmus-a-brakel.html">Wilhelmus à Brakel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian’s Reasonable Service</cite>, trans. Bartel Elshout, ed. Joel R. Beeke (1700; Grand Rapids MI: Reformation Heritage Books, 1992), 1: 89.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><figure class="quote" id="q-697e2aa704" data-kw="">
<blockquote><p>This thesis offers a constructive account of the doctrine of divine simplicity in Christian theology. In its methodology, the thesis aims to present this divine perfection as an implicate of the scriptural portrayal of God, to draw upon the insights and conceptual resources of Thomas Aquinas and various Reformed orthodox theologians, and to respond to some objections to divine simplicity…. The case for God’s simplicity is made by examining God’s singularity, aseity, immutability, infinity, and act of creation in Holy Scripture and then tracing the ways in which these descriptions of God imply that he is (negatively) not composed of parts. Rather, he is (positively) actus purus and really identical with his own essence, existence, and attributes, each of which is identical with the whole being of the triune God considered under some aspect. In light of the constructive work, this study then addresses the three most pressing objections to divine simplicity: (1) that it denigrates God’s revelation of his many attributes in the economy; (2) that it eliminates God’s freedom in creating the world and acting in history; and (3) that it does not cohere with the doctrine of the Trinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-j-duby.html">Steven J. Duby</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Simplicity: a Dogmatic Account PhD diss</cite>, (Univ. of St. Andrews, 2014) 325 pp. Here is the pubilshed version of this dissertation: Divine Simplicity: a Dogmatic Account in T&amp;T Clark Studies in Systematic Theology, vol. 30 (Bloomsbury, 2010) 260 pp.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

hub.io%2Fquote%2F697e2aa704.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/697e2aa704.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divine-simplicity/#:~:text=This%20thesis%20offers%20a%20constructive%20account,with%20the%20doctrine%20of%20the%20Trinity&amp;text=This%20thesis%20offers%20a%20constructive%20account%20of%20the&amp;text=not%20cohere%20with%20the%20doctrine%20of%20the%20Trinity" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-ee337ad3d7" data-kw="">
<blockquote><p>What is God’s simplicity? That attribute of God whereby He is free of all composition and distinction. God is free: a) Of logical composition; in Him there is no distinction between genus and species. b) Of natural composition; in Him there is no distinction between substance and form. c) Of supernatural composition; in Him there is no distinction between slumbering capacity and action. Proof texts: 1 John 1:5; 4:8; Amos 4:2; 6:8. The Socinians and Vossius deny this attribute in order better to escape the Trinity, that is, the oneness in being of the three Persons.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/geerhardus-vos.html">Geerhardus Vos</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, trans. and ed. Richard B. Gaffin, Jr. (Bellingham: Lexham Press, 2020), 19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/simplicity.html">Simplicity</a></span></div>

</figure><figure class="quote" id="q-f732cb3bef" data-kw="">
<blockquote><p>The doctrine of divine simplicity has fallen on hard times in Reformed circles, which is largely owing to the lack of emphasis placed on this subject in the late 19th and early 20th centuries. One theologian who continued to hold the line on the subject was the Dutch-American theologian, Herman Hoeksema.

In accordance with the Thomistic-Reformed position on divine simplicity, he reminded us that the divine attributes were identical with the simple divine essence, and so identical with one another:

His virtues are … identical with that Essence, so are all His virtues one in Him. For even though we do not and cannot comprehend this simple divine Essence … this does not alter the fact that all God’s virtues are one in Him. Hence, His righteousness is His mercy, His holiness is His grace, His truth is His love. And therefore, this eternal Being, this independent, simple Essence that is called God is also the Immutable, in Whom there is no variableness, neither shadow of turning.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-hoeksema.html">Herman Hoeksema</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Reformed Dogmatics</cite>, (Grand Rapids: Reformed Free Publishing Association, 1966), p. 36.</span></figcaption>

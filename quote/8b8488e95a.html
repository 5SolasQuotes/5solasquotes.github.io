<main class="wrap"><figure class="quote" id="q-8b8488e95a" data-kw="">
<blockquote><p>Their own system was generally styled Universalismus Hypotheticus, an hypothetic or conditional universalism. They taught that there were two wills or purposes in God in respect to man’s salvation. The one will is a purpose to provide, at the cost of the sacrifice of his own Son, salvation for each and every human being without exception if they believe—a condition foreknown to be universally and certainly impossible. The other will is an absolute purpose, depending only upon his own sovereign good pleasure, to secure the certain salvation of a definite number… This view represents God as loving the non-elect sufficiently to give them his Son to die for them, but not loving them enough to give them faith and repentance… It represents God as willing at the same time that all men be saved and that only the elect be saved. It denies, in opposition to the Arminian, that any of God’s decrees are conditioned upon the self-determined will of the creature, and yet puts into the mouths of confessed Calvinists the very catch-words of the Arminian system, such as universal grace, the conditional will of God, universal redemption, etc. The language of Amyraldus, the ‘Marrow Men,’ Baxter, Wardlaw, Richards, and Brown is now used to cover much more serious departures from the truth. All really consistent Calvinists ought to have learned by now that the original position of the great writers and confessions of the Reformed Churches have only been confused, and neither improved, strengthened nor illustrated, by all the talk with which the Church has… been distracted as to the ‘double will’ of God, or the ‘double reference’ of the Atonement. If men will be consistent in their adherence to these ‘Novelties,’ they must become Arminians. If they would hold consistently to the essential principles of Calvinism, they must discard the ‘Novelties’.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/a-a-hodge.html">A. A. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Atonement (Grand Rapids, MI: Eerdmans,1953)</cite>, pp. 374-375</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-755e0e1434" data-kw="">
<blockquote><p>The first contains the preparation of the remedy necessary for man’s salvation; the second brings with it an application of the same. And consequently the one may well appertain to the common nature, which the Son assumed, when the other is a special privilege vouchsafed to such particular persons only, as the Father has given Him. And therefore we may safely conclude out of all these premises, that ‘the Lamb of God, offering Himself a sacrifice for the sins of the whole world,’ intended by giving sufficient satisfaction to God’s justice, to make the nature of man, which He assumed, a fit subject for mercy and to prepare a medicine for the sins of the whole world, which should be denied to none that intended to take the benefit of it: howsoever He intended not by applying this all-sufficient remedy unto every person in particular to make it effectual unto the salvation of all, or to procure thereby actual pardon for the sins of the whole world. So, in one respect He may be said to have died for all; yet so as in respect of his mercy He may be counted a kind of universal cause of the restoring of our nature, as Adam was of the depraving of it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-ussher.html">James Ussher</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Whole Works of the Most Rev. James Ussher… 17 vols. (Dublin: Hodges &amp; Smith, 1864), vol. 12 | ‘Of the True Intent &amp; Extent of Christ’s Death &amp; Satisfaction upon the Cross’ (1617), pp. 552-60</cite>, p. 559</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/amyraldians/hypothetical-universalism.html">Amyraldians: Hypothetical Universalism</a></span></div>

</figure><figure class="quote" id="q-87bc282954" data-kw="">
<blockquote><p>But if to believe that Christ died for oneself is the same thing as to believe that the death of Christ is sufficient of itself to expiate one’s sins, we do not deny that reprobates are also bound to believe this: which is perfectly true, whether they believe it, or not. For, the value of Christ’s death is such, that it is of itself sufficient for the altogether complete expiation of the sins of all men, even if they should be ten thousand times more: even if God did not determine it for the expiation of the sins of all. So indeed in this controversy it is customary among many to make a distinction, that they say, that Christ died sufficiently for all, even reprobates; but efficiently only for the elect: which words, suitably explained, and applied to amplify the value of the merit of Christ, we readily admit: even if we have not made use of this distinction from the beginning: because the impropriety in the words appears to be overly harsh. For to [have] died for someone, if we speak properly, is to die for the favor of someone, or in the place of someone, so that he might be delivered from death: and if a voluntary death is met for another, it presupposes the greatest possible love, as Christ testifies, Jn. 15:13. Now, if you should add, ‘sufficiently only, not efficiently’, this not very suitable sense will emerge: Christ, impelled by the greatest possible charity, died in the place of reprobates, so that they might be delivered from death, sufficiently indeed, but not efficiently, that is, they are never actually delivered. Those that say, that Christ dies also for reprobates, not indeed so that they might actually be delivered, but so that they might be able to be delivered, tacitly suppose (or they really do not say anything relevant), that it is in the power and ability of reprobates to apprehend Christ’s offered merit by faith: since without faith they are not even able to be delivered. Likewise (which I wish properly to be observed), that God decreed from eternity to save all men and each through Christ, under this condition, that they believe upon Christ, the Redeemer of all men and each. Which no Orthodox theologian would admit, as Pelagian or Semi-pelagian dogma. I leave unmentioned, that God foreknew from eternity, that a great many were not going to believe, and that He decreed that He was not going to give faith to them, which is not able to be had, except with Him freely giving. Why then would He have decree salvation, and have determined means of salvation, that is, the death of His Son, under a condition, which He foreknew that He was not going to fulfill, and the ability of the fulfilling of which He denied in His eternal decree. Not even man plans so imprudently. But let us dismiss these things. Nevertheless, we think that it is more rightly and plainly said, that the death of Christ is sufficient in itself for the expiation of all the sins of men, than, Christ died sufficiently for all, even reprobates.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/marcus-f-wendelin.html">Marcus F. Wendelin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology 3rd ed. (1634), Species of the Office of Christ, pt. 3 Wendelin admits that Christ died for the world to make a sufficient atonement for all, yet Christ dying for someone properly means to deliver them; hence he does not like the language of Christ dying for all sufficiently. He then argues against hypothetical universalism.</cite></span></figcaption>

<blockquote><p>VIII. We do very much differ from this opinion [of Arminians]: We acknowledge that Christ died for all; but we deny that by his death salvation and forgiveness of sin is obtained for all men: or that reconciliation is made for Cain, Pharaoh, Saul, Judas, etc. Neither do we think that remission of sins is obtained for anyone whose sins are not remitted, or that salvation was purchased for him, whom God from eternity has decreed to condem: For this were a vaine purchase. We deny that election is after the death of Christ, as for many other causes, so also because Christ in the very agony of death gave a notable proof of election in the thief, whose heart He affected, and enlightned his mind after an unutterable manner; the other thief being left and neglected. And seeing Christ does everywhere say that He died for his sheep, and for those whom his Father gave Him, He does sufficiently declare that He died for the elect. IX. And when we say that Christ died for all, we take it thus, to wit, that the death of Christ is sufficient to save whosoever do believe, yea, and that it is sufficient to save all men, if all men in the whole world did believe in Him: And that the cause why all men are not saved, is not in the insufficiency of the death of Christ, but in the wickedness and incredulity of man. Finally Christ may be said to reconcile all men to God by his death after the same manner that we say that the sun does enlighten the eyes of all men, although many are blind, many sleep, and many are hid in darkeness: Because if all and several men had their eyes and were awake, and were in the midst of the light, the light of the sun were sufficient to enlighten them. Neither is it any doubt but that it may be said, not only that Christ died for all men, but also that all men are saved by Christ, because among men, there is none saved but by Christ: After the same manner that the apostle says, 1 Cor. 15:20, that all men are made alive by Christ, because no man is made alive but by Him.</p></blockquote>

</figure><figure class="quote" id="q-76cf032e15" data-kw="">
<blockquote><p>We are often demanded whether every one that hears the Gospel be not bound to believe that Christ died for him? Now I say this phrase ‘Christ died for me’ includes many things, as the benefits which arise unto me by the death of Christ may be conceived to be many. But let these benefits be distinguished and we shall readily answer to the question made, and that perhaps differently, as namely, affirmatively to some, negatively to others; as thus: Do you speak of Christ’s dying for me, that is, for the pardon of my sins and for the salvation of my soul: I answer affirmatively and say I am bound to believe that Christ died for the procuring of these benefits unto me in such manner as God has ordained, to wit, not absolutely but conditionally, to wit, in case I do believe and repent. For God has not otherwise ordained that I should reap the benefit of pardon and salvation by virtue of Christ’s death and passion unless I believe in Him and repent. But if question be made whether I am bound to believe that Christ died for me to procure faith and repentance unto me: I do not say that I am bound, or that every one who hears the Gospel is bound to believe this.</p></blockquote>

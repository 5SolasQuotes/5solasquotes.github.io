<main class="wrap"><figure class="quote" id="q-0a34527964" data-kw="">
<blockquote><p>Rutherford, Brown, Gillespie, Durham, and generally all the best men of that school seek to multiply reasons against separation, and show themselves willing to bear the heaviest burdens and submit to the severest strain rather than take what to them is the most painful step in separation from communion with any body with which they had previously held church fellowship.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-macpherson.html">John MacPherson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Unity of the Church: the Sin of Schism (1901)</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-05d2f61e81" data-kw="">
<blockquote><p>38. Although therefore in some assembly, either in doctrine, or in the administration of the sacraments, the worship of God, and morals, some vice may creep in, nevertheless the assembly does not cease to be in the Church of God, as long as it retains the foundation, which is Christ. Just as Paul does not take away the name of the Church of God from the Corinthians and Galatians, even though false doctrines had begun to be spread among them, and some lived dissolutely. Nor is the Church to be denied immediately because of the neglect or cessation of ecclesiastical discipline.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/amandus-polanus.html">Amandus Polanus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A System of Christian Theology tr. ChatGPT-4 (Hanau, 1609-1610), bk. 7, Church &amp; its Government</cite>, p. 309</span></figcaption>

</figure><figure class="quote" id="q-564f28c69a" data-kw="">
<blockquote><p>She [Wisdom] is studious of ecclesiastical peace: to that end she knows how to distinguish between substantials and ceremonials; nor dares she rent Christ’s seameless coat because the fringe is not every way complete. Between fundamentals and circumstantials, matters Fidei Catholicae, et scientiae theologicae [of the catholic Faith and between theological wisdom], necessary to be believed, and problematically disputed, allowing a latitude of opinion in some things, to those who hold the foundation; in a word, she abhors, as to injure the truth of Christ by error, so to disturb the peace of the Church by schism.</p></blockquote>

</figure><figure class="quote" id="q-a15ced2a13" data-kw="">
<blockquote><p>Mr. de Cluse in his prophesy [preaching amongst the Brownists] labored to prove separation from a true Church for any corruption, obstinately stood in this doctrine, was by another in prophesying there showed to be absolutely contrary to the place, Rev. 2:24; which how unsoundly it was concluded by our teacher was then observed by many… If these things be so, and be not redressed by the 〈◊〉 of this prophesy we must (according to Mr. de Cluse’s doctrine) make a new separation. How oft do the [Brownist] Brethren except one against another’s prophesying, by which, much heart-burning and strife is kindled between them? These things being well considered, I pray you well to mind whether this new way of prophesying on the Lord’s Day can be for the edification of the Church or not.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ephraim-pagitt.html">Ephraim Pagitt</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Heresiography, or a Description of the Heretics &amp; Sectaries of these Latter Times (London: Wilson, 1645), ‘Of the Brownists’ | 18. ‘Of their Prophesying’</cite>, pp. 63-64</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

ne</a></div>
</figure><figure class="quote" id="q-a4ac9baa92" data-kw="">
<blockquote><p>7. A particular Church of any one denomination, may fail in some points of doctrine and manners, and yet continue a living member of the true Church, if it fail not in fundamentals, and things simply necessary to salvation: for the light of truth has its degrees with men, and so has saving grace its intentions and remissions. The moon in the wane is the same which we sometimes see in the full. The Church of Ephesus, lost her first love, Rev: 2:4. The Church of Galatia was transported by false apostles into some dangerous opinions, Gal. 1, etc. The Church of Israel in Elijah’s time had in a great part forsaken the very covenants of God, 1 Kings 19:14, yet were there some names left, 7000 knees which had not bent to Baal. Now though no particular Church is exempt from the censure of the catholic, yet a Church is not presently to be forsaken by particular members thereof for some foul blemishes, nor many wicked men therein, though we must know that God sometimes for such things removes the candlestick from certain places, as from those seven famous Churches of Asia. ‘Tis not the place, but the saints which make the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to the Holy City, or, Directions &amp; Helps to an Holy Life containing Rules of Religious Advice… (Oxford: Robinson, 1651), ch. 7</cite>, p. 53</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

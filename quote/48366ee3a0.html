<blockquote><p>§V. As to liberty itself; there remained in the will of lapsed man: 1. Immunity from the necessity of coaction, or external violence, by reason of elicited acts. 2. Immunity from internal physical necessity. 3. The liberty of exercise or of contradiction, which is between willing or not willing; loving or not loving; acting or not acting. 4. The liberty of specification, by which the will, from two or more things or species which can be recalled to the sphere of doable things in the state of corruption, can choose one and neglect another. §VI. The objects which pertain to the sphere of doable things in the state of reigning corruption, before conversion, are all those things which are subject to the senses and to natural reason, and do not surpass human grasp. And they are: 1. Actions merely natural and animal, e.g., to eat, to drink, to be awake, to sleep, to be moved from a place, to rest. 2. The inventions or apprehensions of sciences and arts, concerning which see Calvin, Institutes, bk. 2, ch. 2, §14. 3. Civil and economic actions, such as to care for a family and the commonwealth, and in them to do or omit one’s duty. 4. Moral actions of the natural order, and those which pertain to common ethics, Rom. 2:14-15… Hence the virtues of the gentiles, produced by the general aid of God, as to their substance, are true moral virtues of the natural order, consisting of the same internal form, object, means and acts; although by reason of their mode, adjuncts, circumstances, and also their end, they often had notable defects, in respect of which Augustine calls them, by a broad signification, ‘sins’, although elsewhere he commends the virtues of the gentiles, as in Of the Spirit &amp; the Letter, ch. 27; Epistle 99 to Evodius; also Epistle 130; and the book, On the Grace of Christ, ch. 24. See Dn. D. Samuel Strimesius, Praxiologia Apodictica, ch. 7, §5; D. Johann Fabricius, Systema Theologicum, locus 3, aphorism 2, p. 277. Nor does the passage Rom. 14:23 stand in the way, for there Paul by ‘faith’ does not understand saving faith, but the dictate of conscience, by which something is judged to be licit or illicit. §VII. But to this sphere in no way pertain spiritual actions, which cannot be elicited and performed except by the Spirit of God vivifying, illuminating, acting, operating, regenerating and sanctifying in certain degrees. In respect of these, we rightly teach that the natural powers of free will are not only bound, attenuated, impeded, wounded and broken, but plainly lost, destroyed, extinguished, and null, against the Pelagians, Semi-Pelagians, Socinians, Remonstrants, Mennonites; and in part also the Greeks, Synergists and Pontificists, of whom see Bellarmine, bk. 6 of On the Loss of Grace &amp; the State of Sin, ch. 16; Coster, Enchiridion, ch. 5, p. 190. §VIII. Against whom we assert that unregenerate man in the state of dominant corruption, or before his conversion, has from himself no natural powers, whether in the intellect or in the will, for… keep[ing] the precepts of God, and do[ing] good works, pleasing to God and saving for himself.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), ch. 2, pp. 20-22 Latin Holtzfus was a German reformed divine.</span></figcaption>

<blockquote><p>So a holy person rejoiceth that the way of holiness is the appointed way to Heaven… he delights in the Gospel-constitution, because it requires universal holiness… This is solid rational religion, fit to be depended upon, in opposition to the antinomian licentiousness, the freaks of enthusiasm, and the irrational flights of passion and imagination on the one hand; and in opposition to formality, mere morality, and the self-sprung religion of nature on the other… Men are naturally averse to this Gospel method of salvation… they will endeavor to widen the way to Heaven, and persuade themselves they shall attain it, notwithstanding their continuance in some known iniquity, and though their hearts have never been thoroughly sanctified… How many give up their hopes of Heaven rather than part with sin… and must not such degenerate creatures be renewed ere they can be holy, or see the Lord!</p></blockquote>

<blockquote><p>Good works are an instrumental cause of the possession of life eternal, for by these as by media and by the legitimate path God leads us into the possession of eternal life… The same truly are rightly able to be said to be an instrumental cause of eternal life, insofar as God leads us by them into eternal life.</p></blockquote>

</figure><figure class="quote" id="q-b1e37abc84" data-kw="">
<blockquote><p>We must accurately distinguish between a right to life, and the possession of life. The former must so be assigned to the obedience of Christ, that all the value of our holiness may be entirely excluded. But certainly our works, or rather these, which the Spirit of Christ worketh in us, and by us, contribute something to the latter… III. 1st, Scripture teacheth that man must do something, that he may obtain the possession of the salvation purchased by Christ. “Labour, (said he) for the meat which endureth unto everlasting life,” which indeed he interprets afterwards of faith, but so, that there he plainly reduces it to the catalogue of works; for justification is not the subject, John 6:27-29. And Paul expressly says, “Work out your own salvation with fear and trembling,” Phil. 2:12. And again, “Therefore my beloved brethren, be ye stedfast, immoveable, always abounding in the work of the Lord, forasmuch as ye know that your labour is not in vain in the Lord.” 1 Cor. 15:58 IV. Neither because Christ is the way to life, is the practice of Christian piety therefore not the way to life. Christ is the way to life, because he purchased us a right to life. The practice of Christian piety is the way to life, because thereby we go to the possession of the right obtained by Christ. For it is more than a hundred times designed by the name of life: again the way of righteousness, the good way, the way of peace; yea, that nothing might be wanting, it is called the way of life and salvation. Prov. 6:23, “The commandment is a lamp, and the law is light, and reproofs of instruction are the way of life.” And 10:17, “He is in the way unto life who keepeth instruction.” 15:24, “The way of life is above to the wise.” Ps. 50:23, “Whoso ordereth his way, I will cause him to enjoy the salvation of God.” And what does Christ himself understand by that narrow way which leadeth unto life, Mt. 7:14, but the strict practice of Christian religion? which is called the way of salvation, Acts 16:17.</p></blockquote>

ligion? which is called the way of salvation, Acts 16:17.”

— Herman Witsius, Conciliatory or Irenical Animadversions on the Controversies Agitated in Britain: under the unhappy names of Antinomians and Neonomians (Glasgow, 1807), pp. 161-163">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWe+must+accurately+distinguish+between+a+right+to+life%2C+and+the+possession+of+life.+The+former+must+so+be+assigned+to+the+obedience+of+Christ%2C+that+all+the+value+of+our+holiness+may+be+entirely+excluded.+But+certainly+our+works%2C+or+rather+these%2C+which+the+Spirit+of+Christ+worketh+in+us%2C+and+by+us%2C+contribute+something+to+the+latter%E2%80%A6+III.+1st%2C+Scripture+teacheth+that+man+must+do+something%2C+that+he+may+obtain+the+possession+of+the+salvation+purchased+by+Christ.+%E2%80%9CLabour%2C+%28said+he%29+for+the+meat+which+endureth+unto+everlasting+life%2C%E2%80%9D+which+indeed+he+interprets+afterwards+of+faith%2C+but+so%2C+that+there+he+plainly+reduces+it+to+the+catalogue+of+works%3B+for+justification+is+not+the+subject%2C+John+6%3A27-29.+And+Paul+expressly+says%2C+%E2%80%9CWork+out+your+own+salvation+with+fear+and+trembling%2C%E2%80%9D+Phil.+2%3A12.+And+again%2C+%E2%80%9CTherefore+my+beloved+brethren%2C+be+ye+stedfast%2C+immoveable%2C+always+abounding+in+the+work+of+the+Lord%2C+forasmuch+as+ye+know+that+your+labour+is+not+in+vain+in+the+Lord.%E2%80%9D+1+Cor.+15%3A58+IV.+Neither+because+Christ+is+the+way+to+life%2C+is+the+practice+of+Christian+piety+therefore+not+the+way+to+life.+Christ+is+the+way+to+life%2C+because+he+purchased+us+a+right+to+life.+The+practice+of+Christian+piety+is+the+way+to+life%2C+because+thereby+we+go+to+the+possession+of+the+right+obtained+by+Christ.+For+it+is+more+than+a+hundred+times+designed+by+the+name+of+life%3A+again+the+way+of+righteousness%2C+the+good+way%2C+the+way+of+peace%3B+yea%2C+that+nothing+might+be+wanting%2C+it+is+called+the+way+of+life+and+salvation.+Prov.+6%3A23%2C+%E2%80%9CThe+commandment+is+a+lamp%2C+and+the+law+is+light%2C+and+reproofs+of+instruction+are+ <blockquote><p>What is to be observed in the sayings of the Scriptures wherein justification, salvation and life eternal is ascribed to works? 1. Legal sentences are to be understood of perfect good works, such as none can be found in no creature; But evangelical sentences do always include faith in our works. And we must understand that by faith in the first place, justification is received, and acceptation to life eternal: afterward in the second place and by consequence, works are accepted as the fruits of faith, and life eternal is promised to these for Christ’s sake. 2. In such sayings, there are not brought forth arguments from the cause [as to] why the person is made partaker of eternal life, but it is showed from the effects or the adjuncts what person is partaker of remission of sins and life eternal (so Lk. 7:47). Christ plainly proves in way of resolution by this argument that the woman’s sins were pardoned because she loved much. But two diverse questions are at no hand to be confounded. The one to whom life eternal is given, the other for what cause it is given. To them that do well and meditate in the law of God, is happiness and life eternal promised, but yet it is given freely for Christ’s sake. 3. In this question we must remember to observe a rule of the Rabbins concerning the Holy Scriptures. In every place wherein thou lightest on an objection for an heretics, thou findest a medicine in the side thereof. So the scripture, wheresoever it ascribes eternal life to works as a reward, calls it an inheritance. 4. When as diverse effects do depend alike of one and the self same cause, the consequence from one effect avails to another because of their common dependence, as Lk. 7:47, the consequence from love avails (to prove) the remission of sins: because each of them depends on faith. 5. Where there is a subject there is his propriety, and on the contrary where there is a propriety there is his subject. So where there is faith there be works, and where there be good works there is faith. 6. Seeing good works do spring from faith, whatsoever is attributed to them, must needs be ascribed to the root (i.e. faith, whence they spring).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-6cf7cb9b23" data-kw="">
<blockquote><p>XIV. … The will of saving all men does not overthrow the decree of reprobation of passing by many because it is neither the decretive will, but only the preceptive and approving will; not the universal, which respects all and individuals, but only general, which is indiscriminately extended to any. So they can be called to the marriage by the preceptive will who nevertheless were excluded from eternity by the will of good pleasure. …

XVII. The passages which attribute a desire or wish to God do not immediately prove any ineffectual will in him, but things spoken after the manner of men must be understood in a manner becoming to God, unless we wish to adopt the deliriums of the Anthromorphites. …

XVIII. When God testifies that “he has no pleasure at all in the death of the sinner, but that he should return from his ways, and live” (Ezk. 18:23), this does not favour the inefficacious will or the feeble velleity of God because the word chpts (which occurs there) does not denote desire so much as delight and complacency. Thus God may be said not to delight in the punishment of the wicked inasmuch as it is the destruction of the creature, although he wills it as an exercise of his justice. So he is said to will the repentance of sinners approvingly and preceptively as a thing most pleasing to himself and expressed in his commands, although with respect to all of them he nills it decretively and effectively.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. G. M. Giger, ed. J. T. Dennison (1679; 3 vols, Phillipsburg, 1992), 3.16.14, 17-18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-23f7665f4c" data-kw="">
<blockquote><p>But thus they [medieval scholastics] expound themselves, that God works, decrees and wills the deformity that is found in the sins of commission, not by his antecedent will, whereby He works things out of his own liking, but by his consequent and conditional will, whereby presupposing the purpose of suffering his creature to avert and turn from Him, He still intends to move, impel and carry them forward, though being by their own fault out of the way, He carries them thither whither they should not go: first, say they, by substraction of grace, upon the withdrawing whereof He saw the creature would turn from Him, He purposed to suffer the sin of aversion or omission to enter: secondly, this purpose being presupposed, and foreseeing that which would follow upon it in his consequent and conditional will, He positively decreed the other, which is of commission. Man by creation was made to seek an infinite good, and love it infinitely; which if he omit to seek in God, then must he needs commit the contrary and seek it in himself: for so God decreed that man not continuing to adhere unto Him, should fall into self-love, pride and all evils of that kind. All this might be borne withal, save only they make deformity of the essence of an action, which cannot be borne withal…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-yates.html">John Yates</a></span><span class="wk"><span class="lbl">Work:</span> <cite>God’s Arraignment of Hypocrites with an Enlargement concerning God’s Decree in Ordering Sin</cite>, ... (Cambridge, 1615), pt. 3, Reasons Objected to make God the Author of Sin, p. 76</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/attributes-of-god/will-of-god.html">Will of God</a></span></div>

</figure><figure class="quote" id="q-53e29e8e2c" data-kw="">
<blockquote><p>The will of God,¹ as to all things, must always be fulfilled, – because as the Almighty can do everything possible, so, when the divine will is determined for positing something in being with final determination, it will be; but to will that with will of being well-pleased is to will it with the last determination that can be posited on the part of the omnipotent will willing the effect into being; therefore, in respect of whatever effect God is thus willing, it will be. ¹ The Vatican editors say this is against Scotus’ doctrine, and they refer to Rep. IA d. 46 nn. 17-18, 12-14, and to nn. 7-8 here below. …

7. To the first argument [n.1] I say that although the saying of the apostle [1 Tim. 2:4] could be expounded with a distribution accommodated for all those who will be saved – yet it could much better be expounded of antecedent will, thus: ‘he wills to save all men and that all are saved’, namely as far as concerns his own part and by his antecedent will, forasmuch as he has given them natural gifts and right laws and common aids sufficient for salvation.

8. Just as of a king, establishing good laws and prefixing ministers to guard those laws, it could be said that he wills all his subjects to live peaceably and quietly, as far as in him, and yet, if he see someone being unjustly oppressed, it would not be necessary that the king at once involve himself, to make him live quietly, unless he were turned over to him by a complaint of fact (he does indeed antecedently will everyone to live peaceably and quietly, but he does not will everyone immediately so to live), – so I say in the matter at hand, that although God [does] not have a will of being well-pleased to save this person, yet he wills for him the common aids to salvation, by which he too can live sufficiently well and be saved; on account of which it can be said that, as far as is on his part, he wills all to be saved.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-duns-scotus.html">John Duns Scotus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ordinatio</cite>, bk. 1, dist. 26-48 tr. Peter Simpson (2013 / 2023), dist. 46, Whether God’s Will of Good-Pleasure is always fulfilled? II. To the Principal Arguments, p. 197</span></figcaption>

</figure><figure class="quote" id="q-1ef4dac9cd" data-kw="">
<blockquote><p>To the arguments: To 2. To that which is objected [against election being eternally in God], that the will and love of God is without discretion, it must be said that there is an antecedent will and a consequent will: the antecedent, by which He wills as much as is in Him, and the consequent, by which He wills with the foreknowledge of our salvation; and the first is indeed of all, but the second is not. According to this mode, love is twofold: one, which regards the antecedent will, and with this He loves all; and there is another, which regards the consequent, and with this He loves all those to be saved, and this is election.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bonaventure.html">Bonaventure</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Sentences</cite>, (d. 1274), bk. 1 | dist. 40, art. 3, On Divine Election, quest. 1, ‘Whether election is in God from eternity, or in time.’</span></figcaption>

<div class="actions"><button class="copy" data-copy="“To the arguments: To 2. To that which is objected [against election being eternally in God], that the will and love of God is without discretion, it must be said that there is an antecedent will and a consequent will: the antecedent, by which He wills as much as is in Him, and the consequent, by which He wills with the foreknowledge of our salvation; and the first is indeed of all, but the second is not. According to this mode, love is twofold: one, which regards the antecedent will, and with this He loves all; and there is another, which regards the consequent, and with this He loves all those to be saved, and this is election.”

<blockquote><p>Francis Turretin held to the standard Reformed distinction between the secret and revealed will of God (it being a distinction in the one, simple will of God; cf. Institutes, third topic, fifteenth question). He rejected the distinction between the antecedent and consequent, or conditional and absolute will of God to which the Arminians and others subscribed. This view held that God had by an antecedent or conditional will purposed to save all men, but by consequent or absolute will decreed the salvation of believers and the damnation of unbelievers (see Institutes, 3.16.4).

Turretin responds to this heterodox position by arguing that it is dishonouring to God:

VI. This distinction is in many ways injurious to God: (1) because it attributes to him contrary wills (viz., that God wills the salvation of all and wills the salvation only of some); that from eternity he seriously willed the salvation of Judas and yet, at the same time in the same moment, knew that Judas never would believe; and that he did not will to give faith to Judas by which he might infallibly have been converted; yea, would permit him to remain in his unbelief and to perish. Who would dare to attribute such wills to a man of sound mind, as to say that he willed seriously and ardently what he knew never would happen, and indeed would not happen because he nilled to effect it, on whom alone the effect depends? …

VII. Second, this distinction cannot have place in God without ascribing to him not only folly and impotence (by making him intend seriously and desire with natural affection that which is not performed and cannot be performed through man because he himself does not will it); but also mutability because there can be no place for the consequent will until the antecedent is first rescinded. For how could God at the same time, by the same act of will, will to save all men and to damn the greater part of them? …

X. Fifth, it is repugnant to the gospel which constantly teaches that God wills to save not all simply, but only the elect and believers in Christ and that the means of salvation are not offered or conferred upon all, but only upon some. In fine, it overthrows the eternal election of God because it leaves it uncertain, founded not upon the good pleasure of God, but upon human will (than which nothing is more uncertain and changeable). It makes it such as that no execution can answer to it (i.e., makes it void and inefficacious).</p></blockquote>

<main class="wrap"><figure class="quote" id="q-4c3c4a994e" data-kw="">
<blockquote><p>You have, moreover, before you can consistently reject the divine authority of the Bible, to account for the fact that so many different persons as were concerned in writing it, living in different ages, in various states of society, and in circumstances to preclude the possibility of collusion, could have produced a book between whose various parts there is the most perfect, though evidently on their part the most undesigned, harmony.

If all the letters of which the Bible is composed were to be separated from each other, and thrown promiscuously into the air, and should fall to the earth in precisely the order which they originally held, making a regular and complete book, it would not be a greater anomaly in human experience, than would be found in the fact that such a book as the Bible is, in respect to the harmony of its parts, should have been made in the circumstances in which it was made, independently of divine inspiration.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-82d33e112a" data-kw="Pope as interpreter">
<blockquote><p>The cardinals attend the pope only in the way of ornament and pomp, and have no place in the settling of any definition. Yea, although all the cardinals were to say nay, yet the pope can define what he will. Therefore, although the Jesuit puts a council of pastors along with the pope, yet in reality this authority of interpretation is lodged with the pope alone; because, however much the rest oppose, yet his opinion shall always stand and prevail.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Disputation on Holy Scripture, Against the Papists, Especially Bellarmine &amp; Stapleton</cite>, Question 5, ch. 3</span></figcaption>

<blockquote><p>The genuine believer takes the whole of Scripture as a living organism produced by the Holy Spirit to present Christ to him. On every page of Scripture, he finds traits and traces of the Mediator.</p></blockquote>

</figure><figure class="quote" id="q-2b21ad437b" data-kw="">
<blockquote><p>For the Originals, though we have not the Primitive Copies written by the finger of God in the Tables, or by Moses and the Prophets in the Hebrew, or by the Apostles, and the rest in the Greek for the New Testament, yet we have Copies in both languages, which Copies vary not from the Primitive writings in any matter which may stumble any.

This concerns only the learned, and they know that by consent of all parties, the most learned on all sides amongst Christians do shake hands in this, that God by his providence hath preserved them uncorrupt. What if there be variety of readings in some Copies? and some mistakes in writing or Printing? this makes nothing against our doctrine, sith for all this the fountain runs clear, and if the fountain be not clear all translations must needs be muddy.

Besides, ’tis a saying of a wise Philosopher, That, what some say is like to be false, what many say, may be false; But what all say is more then like to be true. Now Christians of all parties do agree, as touching the Originals that they are kept pure: Only some of and among the Papists, passionate men do bite at the Originals; but herein they do but blot their own vulgar translation, sith they confess it to be drawn out of the Originals. I confess some men by their picking quarrels with the Originals, as a matter whereof they talk, as though there were no certainty of faith as touching them, have troubled the spirits of some men with a thorny tentation, which my businesses is to do what I can to remove, which I now endeavour to do as briefly as I can. …

But what of all this? Why it shows that the general consent of (in a manner) all Hebricians and Grecians in the Christian world, consenting that our Originals are by the good hand of God preserved uncorrupt, and pure, is a sufficient persuasion, to breed a moral certainty answerable to natural evidence, excluding all reasonable dubitation to the contrary.

That the Originals were for the provision and food of the souls of his Church kept pure and uncorrupt by the Prophets and Jews for the old; by the Apostles and Christian Churches for the New Testament, sealed up by St. John the Secretary of Christ, as Scotus calls him. Else the Lord must have been wanting to his Church, which cannot be imagined. And that acquired faith makes way for infused faith to act I have learned long since out of Scotus.

Thus the case stands. The Originals are to be received and believed. That the Hebrew and Greek are the true Originals we believe by human testimonies, which leave the mind without perplexity, without all doubting, and so it follows, that by man’s testimony the Originals are to be received, and believed by us, so that the heart stands free from any true cause of any doubting at all, which being equivalent to the highest certainty that is, it cannot but lay a foundation to build our faith upon, this certainty being a means by which we come to the other of the Scriptures, being the last ground on which we build our faith; we are not to look for demonstrations in arguments of this nature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-capel.html">Richard Capel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Capel’s remains being an useful appendix to his excellent Treatise of tentations, concerning the translations of the Holy Scriptures: left written with his own hand. By that incomparably learned and judicious divine, Mr. Richard Capel, sometimes fellow of Magdalen-College in Oxford; with a preface p</cite>, (London: John Bartlet, 1658), pp 19-21, 24-27.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-9603fbae23" data-kw="">
<blockquote><p>27. Yet the Scripture is not so tied to those first tongues, but that it may and ought also to be translated into other tongues, for the common use of the Church.

28. But among interpreters, neither, those seventy, who turned it into Greek, nor Heirome [Jerome], nor any such like did perform the office of a Prophet, so that he should be free from errors in interpreting.

29. Hence no persons are absolutely authenticall, but so far forth only as they do express the fountains, by which also they are to be tried.

30. Neither is there any authority in Earth whereby any version may be made simply authenticall.

31. Hence the providence of GOD in preserving the Fountains, hath been always famous, and to be adored, not only that they did not wholly perish, but also that they should not be maimed by the loss of any book, or deformed by any grievous fault, when in the mean while there is no one of the ancient versions that remains whole.

32. Nevertheless, from those human versions there may be all those things perceived which are absolutely necessary, if so be they agree with the fountains in essential parts, as all those versions that are received in the Churches are wont to do, although they differ, and are defective in the smaller things not a few.

33. Neither therefore must we always rest in any version that is received: but we must most religiously provide, that the most pure and faultless interpretation be put upon the Church.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3b2afe939f" data-kw="">
<blockquote><p>The Sabbath has been altered from the seventh, to the first day of the week, to commemorate redemption in union with creation. To devote some portion of the social time unto God, is a moral duty; and, therefore, of perpetual obligation. The proportion of time that is to be appropriated, and the particular day on which this shall be done, are positive enactments, and it is possible that either of them may be altered.

That the Sabbath has been changed from the seventh to the first day of the week has been generally admitted among Christians. It is of importance to have a clear idea of the principles, on which this alteration is vindicated.

First, though the change of Sabbath, from the seventh to the first day of the week, took place at the time when the Jewish economy ended, it should be distinctly understood, that it did not flow as a necessary consequence from that event; – when the Jewish economy ceased, it only abolished the ceremonial law, and such things in the judicial law as were in no degree dictated by the light of nature. That event, therefore, could not of itself alter either the proportion of time set apart for the divine service, or the particular day so set apart, because these were appointed long before either the judicial, or ceremonial law.

Secondly, It should also be borne in mind, that God only could authorise any change about the Sabbath. No man on earth,—and no class of men, have, had, or ever can have, a right to annul what God has enacted. Since, therefore, the Sabbath was once upon the seventh day of the week, and was so by divine appointment, we must have some authority from God, distinct from the abrogation of the Jewish economy, for changing it to the first day of the week, before we are warranted to acquiesce in such an alteration.

Thirdly, We should remember that it is not for us to dictate unto God, in what manner he shall reveal his will. In whatever way it seems meet to His infinite wisdom, to alter an old institution, or enact a new one, it is equally binding upon us. If, therefore, the alteration of Sabbath from the seventh to the first day of the week, can in any way be traced to God, it is our duty to sanctify the first instead of the seventh day.

Now we cannot shew a positive command for this alteration, but we can shew evidence which should satisfy us that it is authorised by God. We learn from scripture, that immediately after the resurrection of Christ, the first day of the week was set apart for the public worship of God. It would appear that this began on the very day the resurrection took place. John tells us, that “The same day at evening, being the first day of the week, when the doors were shut where the disciples were assembled for fear of the Jews, came Jesus, and stood in the midst, and saith unto them, Peace be unto you.” John xx. 19.

It may be thought that this was only an accidental meeting; but there is sufficient evidence that from henceforth it was the stated practice. In the 26th verse, he informs us, that “after eight days,” or on the eighth day thereafter, “again his disciples were within, and Thomas with them. Then came Jesus, the doors being shut, and stood in the midst, and said, Peace be unto you.” There is satisfactory evidence, that the first day of the week was set apart for divine worship, in the churches planted by the apostles among the Gentiles. This was the case at Troas, for we read, that “Upon the first day of the week, when the disciples came together to break bread, Paul preached unto them,” Acts xx . 7. It was also the case at Corinth and Galatia, as we learn from the following passage, “Now concerning the collection for the saints, as I have given order to the churches of Galatia, even so do ye. Upon the first day of the week let every one of you lay by him in store, as God hath prospered him.”

We learn from Ecclesiastical history, that the same practice was introduced into all the other churches, and has continued down to our day. This practice, being common to all the churches, must have been introduced by some authority acknowledged by all. As it began before our Lord left the earth, there seems to us no reason to doubt, that it was done by his authority, and being so, we have a divine warrant for this change. At any rate it was evidently sanctioned by apostolical authority, for the apostles only could introduce the custom into the Gentile churches of meeting for the worship of God, upon every first day of the week.

Now a positive command written by an apostle in the word, has no more evidence that it is from God, than an institution has, that was originated by an apostle. We believe that the apostolical epistles were given by inspiration from God, because the apostles shewed infallible credentials of inspiration; for the same reason, we believe, that whatever they sanctioned is authorised by God; and since the alteration of Sabbath can be traced to their days, it is our duty to devote the first day of the week to the service of God.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1ed3a9d77a" data-kw="">
<blockquote><p>As for the Love-feasts used in the primitive Church:

1. They had no religious state in divine worship, but were used only as moral signs of mutual charity. The Rhemists [Romanists] will have them called Coenas dominicas. But what-says Cartwright against them? ‘We grant that there were such feasts used in times past, but they were called by the name of [Greek] or Love-feasts, not by the name of the Lord’s Supper: neither could one without sacrilege give so holy a name to a common feast, which never had ground out of the Word, and which after for just cause was thrust out by the Word of God.’

2. If it be thought, that they were used as sacred signs of Christian charity, because they were eaten in the Church. I answer, the eating of them in the Church is forbidden by the apostle. ‘What?’ says he, ‘have ye not houses to eat and to drink in?’ or despise ye the Church of God? Aperte vetat, says [David] Pareus: commessationes in Ecclesia, quocunque fueo pingantur. Vocabant [Greek] charitates: sed nihil minus erant. Erant schismatum fomenta. Singulae enim sectae suas instituebant. And a little after: Aliquae Ecclesiae obtemperasse videntur. Nam Iustini temporibus Romana Ecclesia [Greek] non habuit. (Commentary in that place)</p></blockquote>

<blockquote><p>But this sacred and holy image [of the glorified Christ in Rev. 1] instructs in all these points all the faithful of Christ most fully. Howbeit this image of Christ is not to be set forth with colors, since that colors cannot attain to the majesty thereof: but with the ecclesiastical doctrine, which has the promises of the Spirit of Christ: And is therefore more evident, and only meet for the true expressing thereof. Let us also print the same image, not upon any dead table with colors that will perish and fade, but in our hearts through the lively Spirit of God, which may also keep it in our minds, never to be wiped out.</p></blockquote>

</figure><figure class="quote" id="q-bcd8e05fc5" data-kw="">
<blockquote><p>Read and do, read and practise what you read, or else all your reading will do you no good. He that hath a good book in his hand, but not a lesson of it in his heart or life, is like that ass that carrieth burdens, and feeds upon thistles. In divine account, a man knows no more than he doth. Profession without practice will but make a man twice told a child of darkness …

There is no fear of knowing too much, though there is much fear in practising too little; the most doing man shall be the most knowing man; the mightiest man in practice will in the end prove the mightiest man in Scripture, John vii. 16, 17, Ps. cxix. 98-100. … The true reason why many read so much and profit so little is, because they do not apply and bring home what they read to their own souls.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-brooks.html">Thomas Brooks</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Mute Christian under the Smarting Rod</cite>, (1684) in The Works of Thomas Brooks, ed. Alexander B. Grosart (6 vols, Edinburgh: Banner of Truth, 1980), i, 291-92.</span></figcaption>

</figure><figure class="quote" id="q-97cd29bf36" data-kw="">
<blockquote><p>From this passage let us learn, that we ought to contemplate the providence of God in such a manner as to ascribe to his almighty power the praise which it deserves for righteous government. Although the rectitude by which God regulates his judgments is not always apparent or made visible to us, still it is never lawful to separate his wisdom and justice from his power. But as the Scriptures very frequently state and clearly explain the reason why God does this or that, we ought carefully to examine the cause of his works.

That invention which the Schoolmen have introduced, about the absolute power of God, is shocking blasphemy. It is all one as if they said that God is a tyrant who resolves to do what he pleases, not by justice, but through caprice. Their schools are full of such blasphemies, and are not unlike the heathens, who said that God sports with human affairs. But in the school of Christ we are taught that the justice of God shines brightly in his works, of whatever kind they are, “that every mouth may be stopped,” (Romans 3:19,) and that glory may be ascribed to him alone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on the Book of the Prophet Isaiah: Volume Second</cite>, trans. William Pringle (Geneva, 1551) in Calvin’s Commentaries (22 vols, Grand Rapids: Baker, 1993), vii, 152.</span></figcaption>

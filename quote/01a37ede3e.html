<blockquote><p>§16. Rule 5. If I vow that I will do some duty better, I am not thereby disobliged from doing it at all when I am disabled from doing it better. Suppose a magistrate seeing much amiss in Church and commonwealth, does vow a reformation and vow against the abuses which he finds; If now the people’s obstinacy and rebellion disable him to perform that vow, it does not follow that he must lay down his scepter and cease to govern them at all because he cannot do it as he ought, if he were free. So if the pastors of any Church do vow the reformation of Church abuses, in their places, if they be hindered by their rulers, or by the people, it does not follow that they must lay down their callings and not worship God publicly at all because they cannot do it as they would and ought if they were free, as long as they may worship him without committing any sin. God’s first obligation on me is to worship Him, and the second for the manner, to do it as near his order as I can: Now if I cannot avoid the imperfections of worship, though I vowed it, I must not therefore avoid the worship itself (as long as corruptions destroy not the very nature of it and I am put myself upon no actual sin). For I was bound to worship God before my vows, and in order of nature before my obligation de modo: And my vow was made with an implied condition, that the thing were possible and lawful: And when that ceases to be possible or lawful which I vowed, I must nevertheless do that which still remains possible and lawful. To give over God’s solemn worship with the Church is no reformation. To prefer no worship before imperfect worship is a greater deformation and corruption than to prefer imperfect worship before that which is more perfect. And to prefer a worship imperfect in the manner, before no church worship at all, is a greater reformation than to prefer a more perfect manner of worship before a more imperfect and defective. To worship God decently and in order, supposes that He must be worshipped: And he that does not worship at all, does not worship Him decently. If a physician vow that he will administer a certain effectual antidote to all his patients that have the plague, and that he will not administer a certain less effectual preparation, which some apothecaries through covetousness or carelessness had brought into common use, to the injury of the sick: His vow is to be interpreted with these exceptions, ‘I will do it if I can, without dishonesty or a greater mischief: I will not administer the sophisticated antidote when I can have better: I vow this for my patients benefit and not for their destruction.’ Therefore if the sophisticated antidote is much better than none, and may save men’s lives, and the patients grow wilful and will take no other, or authority forbid the use of any other, the physicion is neither bound to forsake his calling rather than use it, nor to neglect the life of his patients: (If their lives indeed lie upon his care and they may not be in some good hopes without him, and the good of many require him not to neglect a few): But he must do what he can when he cannot do what he would, and only show that he consents not to the sophistication.</p></blockquote>

<blockquote><p>9. Whether any constitutions may be tolerated in the church which in their nature indeed are not impious, but do not, nevertheless, tend to edification? I answer that if those constitutions which the queen’s majesty wishes to impose upon you are free from any impiety, they are rather to be tolerated than that the churches should be deserted. For if the edifying of the church is the chief thing to be regarded in this matter, we shall do the church a greater injury by deserting it than by wearing the habits [garments]. And where there is no impiety, and the conscience is not wounded, it is proper to submit, even if some degree of bondage be imposed. In the meantime, however, it might be demanded on the other hand, whether the imposition of the habits, as far as it tends to decency and order, may justly come under the denomination of bondage? … 11, 12. The last two questions come more closely to the point. Whether it is more expedient thus to obey the church, or on account of disobedience to be cast out of the ministry? And, whether good pastors may lawfully be removed from the ministry on account of their non-compliance with such ceremonies? I answer, if in these ceremonies there is no superstition, no impiety, but yet they are imposed upon godly pastors, who would rather that they should not be imposed upon them, I will certainly allow, and that most fully, that a burden and bondage is imposed upon them; but I will not allow, and this for most just reasons, that their station or ministry is on that account to be deserted and place given to wolves, as was before observed, or to ministers less qualified than themselves: especially, since there remains the liberty of preaching, and care may be taken that no greater bondage shall be imposed; with many other things of this kind, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Zurich Letters… ed. Hastings Robinson for the Parker Society, 2nd ed. (Cambridge Univ. Press, 1846), Letter 104, Bullinger to L. Humphrey &amp; T. Sampson (1566)</cite>, pp. 222-23</span></figcaption>

<blockquote><p>Go to the Word of God, look what is written; and then the Lord will accept the service, when thou strivest to come near the commandment. See what is punctually required, and then diligently set thyself awork. The Lord will accept weak endeavors, so they be suitable to the command; so you do but endeavour to perform what is written, the Lord will accept it more than all the pomp and outside of those that would supererogate in the outward part… lookest to what God requires; though thou dost not come near it but in thy purposes and desires, the Lord will accept thee. All that the faithful could say for themselves in the prophet was, ‘The desire of our soul is to thy name, and to the remembrance of Thee,’ Isa. 26:8. And all that Nehemiah could urge for the best Jews was that they did desire to fear God’s name, Neh. 1:11. I say, see thou hast prepared to meet the Lord in his own ordinances, and wouldest feign do what is written: remember the death of the Lord Jesus after the due order and right manner, then the Lord will be pleased with thy sacrifice.</p></blockquote>

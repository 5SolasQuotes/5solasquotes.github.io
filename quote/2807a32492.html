<main class="wrap"><figure class="quote" id="q-2807a32492" data-kw="">
<blockquote><p>Now whereas it is not so apparently to be seen, that this book doth set forth Christ unto us, in all the commendations of these Judges: (who yet is the end of all books of Scripture) to such as demand about it, I answer: that Christ is not clearly set forth in any of those books of the old Testament first written: but darkly, and by types and figures, as God saw it meet for those ages: and so we are to think of this book, where the deliverances from so great enemies, as are mentioned herein, are types of that great deliverance and redemption of men wrought by Christ, out of the jaws of the devil.

And let the commending of sundry of those Judges by the holy Ghost satisfy us, that they could not have been good men, nor have lived by faith, as they were said to have done, if they had not believed in Christ, and been sanctified thereby. Besides, what authority shall we give to the old Testament, if they who are commended in it, to have been men of God, as divers Kings and Prophets, with many other, did not live and walk by faith, (seeing it is not expressly set down) without which they could not please God?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-rogers.html">Richard Rogers</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A commentary upon the whole book of Judges. Preached first and delivered in sundry lectures; since collected, and diligently perused, and now published. For the benefit generally of all such as desire to grow in faith and repentance, and especially of them, who would more clearly understand and make</cite>, (London: Thomas Man, 1615), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship.html">Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d2a78fca8a" data-kw="">
<blockquote><p>Prayer is to be made for things lawful… The reading of the Scriptures, preaching, and hearing the Word of God, singing of psalms; as also the administration of baptism and the Lord’s Supper, are all parts of religious worship of God, to be performed in obedience unto God with understanding, faith, reverence, and godly fear. Solemn humiliations, with fastings and thanksgivings upon special occasions, are in their several times and seasons to be used in a holy and religious manner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/congregationalists.html">Savoy Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Savoy Declaration of Faith &amp; Order</cite>, 22.4-5 (1658)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/public-worship.html">Public Worship</a></span></div>

</figure><figure class="quote" id="q-8a9f82966d" data-kw="">
<blockquote><p>Now those first ceremonial observations [of the Early Church with evangelical feasts] are guilty of opening that gate for all the human presumptions to enter into God’s house which pressed in after them: which gate could never be shut from that day to this. 2. Those very feasts made a composition or mixture of human institutions with divine, and therefore did not preserve simplicity. They also were from their first rise not only equalled unto, but also extolled above the Lord’s Day. Easter brought in a superstitious Lent to attend upon it, made baptism wait for her moon: and conformed our Lord’s Supper unto the Jewish Passover in unleavened bread, etc. [3.] It was the first apple of contention among Christians, the first weapon wherewith the Bishop of Rome played his prises [prices?] against other Churches, and after slew so many Britons with by Austin the monk. Holy-days in honor of Christ invited unto them saints’ holy days, etc. 4. It is presumtion to make men’s inventions as guiltless of evil consequences as God’s holy ordinances. They are active efficacious occasions given of evil: these [ordinances of God] are only passive occasions taken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Fresh Suit Against Human Ceremonies in God’s Worship, ‘An Addition of the two last reasons of the former reply’</cite>, (Amsterdam: Thorp, 1633), ch. 1, section 17, pp. 84-85</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

sonline.com/on-ceremonies/#:~:text=Now%20those%20first%20ceremonial%20observations%20%5Bof,God%5D%20are%20only%20passive%20occasions%20taken&amp;text=Now%20those%20first%20ceremonial%20observations%20%5Bof%20the%20Early&amp;text=ordinances%20of%20God%5D%20are%20only%20passive%20occasions%20taken" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-d29fc826aa" data-kw="">
<blockquote><p>Let every one of you, brethren, give thanks to God in his own order, living in all good conscience, with becoming gravity, and not going beyond the rule of the ministry prescribed to him. Not in every place, brethren, are the daily sacrifices offered, or the peace-offerings, or the sin-offerings and the trespass-offerings, but in Jerusalem only. And even there they are not offered in any place, but only at the altar before the temple, that which is offered being first carefully examined by the high priest and the ministers already mentioned. Those, therefore, who do anything beyond that which is agreeable to His will, are punished with death [Lev. 10]. You see, brethren, that the greater the knowledge that has been vouchsafed to us, the greater also is the danger to which we are exposed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/clement-of-rome.html">Clement of Rome</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistle to the Corinthians</cite>, ch. 41</span></figcaption>

</figure><figure class="quote" id="q-559c8504b3" data-kw="">

<main class="wrap"><figure class="quote" id="q-3d553aa4dc" data-kw="">
<blockquote><p>They then are the true children of Abraham which are his children in the faith, and they are truly the successors of the primitive Churches, which have succeeded them in the doctrine of the faith.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-20c40102e8" data-kw="Creeds and confessions">
<blockquote><p>To this power belongs the making of public creeds and confessions, which are usually and by synods and presbyteries to preserve the unity and agreement of faith and reject errors. They do not have the same authority as the Scriptures, since they must be compared with and corrected by them. Yet they have even their own memorable weight and ought to be valued very highly by the pious. Both because they contain the sum and foundation of the Christian doctrine and are like barriers against the errors and corruptions which can injure religion. And because they are the bonds of ecclesiastical communion and formulas of consent which testify of the unity of faith and the agreement of churches with each other and are distinguished from unbelievers, as soldiers by marks or watchwords from their enemies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 18.30.5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a> › <a href="../topics/the-church/creeds-confessions-and-councils/authority-of-creeds.html">Authority of creeds</a></span></div>

<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/particular-baptists.html">Particular Baptists</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Second London Baptist Confession of Faith</cite>, 1689, 26.15</span></figcaption>

</figure><figure class="quote" id="q-984762b173" data-kw="">
<blockquote><p>Neither has this variety [of catechisms] been looked upon as hurtful, for if so, then holy men would have kept to what they found, and have made conscience of increasing this evil by adding to the number; ‘I find’ (says Dr. Gouge, Epistle to his Catechism): ‘in all ages of the Church, God has stirred up many of his servants to publish several forms, all agreeable in the substance, and I observe among many other, these two good uses to arise from thence, etc.’ which there he specifies; nay, since this of the [Westminster] Assembly, composed by a synod of holy and learned men, approved of, and commended to the nation by the parliament then sitting, and received and settled in Scotland, yet men’s consciences have not been satisfied in this, as the only catechism fit to be used, as appears in the great number and variety of catechisms composed and printed since this was published, a greater number then in so short a time were ever published before.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-nye.html">Philip Nye</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beams of Former Light</cite>, Beams of Former Light: discovering how Evil it is to Impose doubtful and disputable forms or practices, upon ministers: especially under the penalty of ejection for non-conformity unto the same. As also something about catechizing. (London: 1660) This was published just before the Great Ejection of 1662., pp. 86-87</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

b173.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-subscription-to-confessions-by-church-officers/#:~:text=Neither%20has%20this%20variety%20%5Bof%20catechisms,a%20time%20were%20ever%20published%20before&amp;text=Neither%20has%20this%20variety%20%5Bof%20catechisms%5D%20been%20looked&amp;text=so%20short%20a%20time%20were%20ever%20published%20before" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5048cbc324" data-kw="">
<blockquote><p>…they were chosen to be faithful witnesses to the world of the doings, sufferings and doctrine of Christ: the Holy Ghost was sent to teach them in all truth. Here we may rest upon a sure foundation, against the which the gates of hell cannot prevail… To this antiquity of apostolic doctrine, let us firmly adhere. This is the clearest mirror whereinto the precepts of wholesome doctrine are contained. … those bishops and doctors following, who keep inviolably that form of wholesome doctrine which they received from the apostles, these, I say, alanerly are to be counted true successors of the apostles.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/patrick-simson.html">Patrick Simson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Short Compend of the History of the First Ten Persecutions moved against Christians</cite>, (Edinburgh: Hart, 1613) Simson (1566-1618) was a Scottish presbyterian minister.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

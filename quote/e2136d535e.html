<blockquote><p>[I]f you are very despondent and leaning towards melancholy, and you proceed to partake of the Lord’s Supper, see to it that you do not dwell on the disturbing and unsettling thoughts regarding your sins and failures. To you who are in a state of despondency, we say that we do not wish to apply this rule categorically, as if they who partake of the Lord’s Supper should refrain from reflecting upon their sins.

On the contrary! We believe that if someone comes to the Lord’s Table in a somewhat sluggish and dull heart to be broken so that the balm of grace may be all the more effective (Matt. 12:20). Nevertheless, concerning you who are of a melancholy and weak disposition, we believe that now, namely, the time of preparation for the Lord’s Supper, is not the time to prune and carve even more, but rather that you should solely pursue the healing and refreshing of your soul.

The reason why you so frequently leave the Lord’s Table without fruit and joy is because you have been wrongly engaged, having focused more on your sins and abominations than on the grace of Jesus Christ. Such a melancholy reflections will so oppress you and engulf your heart that the sunshine of God’s comfort cannot penetrate. The best way for you and all that are of a similar disposition is but to cast your souls, as wounded and broken as they may be, before the cross of Christ, longing and craving for the sweet efficacy of His healing blood. Do so before you inflict new wounds in your soul.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/guiljelmus-saldenus.html">Guiljelmus Saldenus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Efficacy of the Lord’s Supper to the Comfort and Sanctification of God’s Children</cite>, (1664), trans. Bartel Elshout in James A. De Jong (ed.), In Remembrance of Him: Profiting from the Lord’s Supper (Grand Rapids MI: Reformation Heritage Books, 2012), p. 31.</span></figcaption>

<blockquote><p>Vers. 23. For I have received of the Lord that which also I delivered unto you, that the Lord Jesus, the same night in which he was betrayed, took bread,

24. And when he had given thanks, he brake it, and said, Take, eat, this is my body which is broken for you: this do in remembrance of me.

That he may correct these errors; First he sets down the institution of the Sacrament, to vers. 27. and then he exhorts them to, and teaches them the lawful use of this Sacrament, to the end. As for the institution of the Supper, he shews that the Lord Jesus being about to suffer, by way of Testament, set his seal to the Covenant of Grace, which by his mediation he entered into between God and the Church: Whereby the glorious memory of his death might be celebrated in the world, till his second coming, and might be delivered to the faithful, and being delivered, it might judicially confirm a right to his person, and the benefits of his sufferings, and a living virtue flowing from his death, resurrection, and exaltation, to the sanctification and salvation of Believers, and that by the symbols of this holy Banquet, and holy Communion with God, and amongst themselves.

To which end Christ sitting at Table with his Disciples, after the eating of the Paschal Lamb; First, Took Bread, and sanctified it by giving of thanks, brake, and gave it to his Disciples, commanding them to take and eat; further, he declared the Bread received and eaten, to be his body represented after a Sacramental manner, that it being given for our Redemption, and after a judicial manner, applied to us; and lastly, he commanded that his Disciples, or all the faithful should imitate this his action in the Church, in remembrance of him, who had paid the price of Redemption by the sufferings of his body.

Vers. 25. After the same manner also he took the Cup, when he had supped, saying, This Cup is the New Testament in my blood: this do you, as oft as ye drink it, in remembrance of me.

That which concerns the other part of the Supper follows: In the same Supper, (viz. after the Paschal Supper) when the Bread was distributed, Christ took the Cup with Wine, sanctified by the giving of thanks, gave it to the Disciples to drink; further concerning the Cup he declared, That it being taken and drunk, was that new Covenant of Grace, between God and the Church, established Sacramentally by his blood, i. e. As it is ratified on God’s part that gives, so it is confirmed on the believers part that receives, and judicially applied and sealed: Lastly, He commanded that his Disciples should frequently imitate him in this action, in remembrance of him, who had paid the price of Redemption for the Church by the shedding of his blood.

Vers. 26. For as often as ye eat this Bread, and drink this Cup, ye do shew the Lord’s death till he come.

And that we might acknowledge, that of two Elements, Bread and Wine, one Supper (frequently to be celebrated in the Church) ought to be made; the Apostle would have perpetuated in the Church, a public commemoration of our Lord’s death, by the often reiteration of this Sacrament, and that because Christ would not be present in his body with the Church, before the last judgement, by this Sacrament he would that the memorial of the Churches redemption, by his death, might be preserved and celebrated, until he come out of Heaven in the last day.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-dickson.html">David Dickson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An exposition of all St. Paul’s epistles together with an explanation of those other epistles of the apostles St. James, Peter, John &amp; Jude: wherein the sense of every chapter and verse is analytically unfolded and the text enlightened</cite>, (London: Francis Eglesfield, 1659), pp 58-59.</span></figcaption>

</figure><figure class="quote" id="q-41b0c866d0" data-kw="">
<blockquote><p>That though there be most dispute betwixt us and the Papists, upon the with-holding of the Cup of the holy Communion, in the thing it self, there is no more necessity held (by either side) of the use of the one element, then of the other: nor is Christ less present to the faithful, in the one, then in the other, though methinks (besides other advantages on our part) this is of no small moment, that they have made choice of the bread rather then the wine in their half Communion: whereas (with more probability of reason) they might have pleaded for an half communion in wine, then in bread, both because, Our Saviour said expressly, Drink ye all of this, and said not so of the bread, Eat ye all of this, (though he meant no less.) Because that the Blood of Christ (not so much as it is in the body, as let out of the Veins, and made potable liquor) is the proper means of the remission of our sins, without which there is no remission.

Because in the blood, is the life of the creature, yea, it is called life it self, and is diffused all over the body, being the purer part of the nourishment (which we receive) whereof are produced the Spirits, which quicken the whole man in the motion and operation of all his parts, and faculties: so that (in this respect) her case is in my conceit more comfortable (who can take no bread, if she can drink the wine) then theirs, who (contrariwise) are disposed to a dry Communion, and not to a moist, who can eat the bread, but cannot drink the wine of the Sacrament.</p></blockquote>

— John Ley, A case of conscience, concerning the sacrament of the Lords Supper: when either the bread or wine is wanting, or when there is a desire, yet with an antipathy to them, or debility to receive them, (London: George Lathum, 1641), pp 17-18.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThat+though+there+be+most+dispute+betwixt+us+and+the+Papists%2C+upon+the+with-holding+of+the+Cup+of+the+holy+Communion%2C+in+the+thing+it+self%2C+there+is+no+more+necessity+held+%28by+either+side%29+of+the+use+of+the+one+element%2C+then+of+the+other%3A+nor+is+Christ+less+present+to+the+faithful%2C+in+the+one%2C+then+in+the+other%2C+though+methinks+%28besides+other+advantages+on+our+part%29+this+is+of+no+small+moment%2C+that+they+have+made+choice+of+the+bread+rather+then+the+wine+in+their+half+Communion%3A+whereas+%28with+more+probability+of+reason%29+they+might+have+pleaded+for+an+half+communion+in+wine%2C+then+in+bread%2C+both+because%2C+Our+Saviour+said+expressly%2C+Drink+ye+all+of+this%2C+and+said+not+so+of+the+bread%2C+Eat+ye+all+of+this%2C+%28though+he+meant+no+less.%29+Because+that+the+Blood+of+Christ+%28not+so+much+as+it+is+in+the+body%2C+as+let+out+of+the+Veins%2C+and+made+potable+liquor%29+is+the+proper+means+of+the+remission+of+our+sins%2C+without+which+there+is+no+remission.%0A%0ABecause+in+the+blood%2C+is+the+life+of+the+creature%2C+yea%2C+it+is+called+life+it+self%2C+and+is+diffused+all+over+the+body%2C+being+the+purer+part+of+the+nourishment+%28which+we+receive%29+whereof+are+produced+the+Spirits%2C+which+quicken+the+whole+man+in+the+motion+and+operation+of+all+his+parts%2C+and+faculties%3A+so+that+%28in+this+respect%29+her+case+is+in+my+conceit+more+comfortable+%28who+can+take+no+bread%2C+if+she+can+drink+the+wine%29+then+theirs%2C+who+%28contrariwise%29+are+disposed+to+a+dry+Communion%2C+and+not+to+a+moist%2C+who+can+eat+the+bread%2C+but+cannot+drink+the+wine+of+the+Sacrament.%E2%80%9D%0A%0A%E2%80%94+John+Ley%2C+A+case+of+conscience%2C+concerning+the+sacrament+of+the+Lords+Supper%3A+when+either+the+bread+or+wine+is+wanting%2C+or+when+there+is+a+desire%2C+yet+with+an+antipathy+to+them%2C+or+debility+to+receive+them%2C+%28London%3A+George+Lathum%2C+1641%29%2C+pp+17-18.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F41b0c866d0.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/41b0c866d0.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2022/06/23/john-ley-on-romes-dry-communion/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-8f9025adaf" data-kw="">
<blockquote><p>The elements of the sacrament are bread and wine. There is controversy between east and west on this point. The Greek Church says the bread must be leavened, the Latin unleavened, making this a point of serious importance. We believe that the bread used was paschal. But it was not Christ’s intention to give ritually a paschal character to the new sacrament; and bread is employed as the material element of nutrition, the one most familiar and universal. Hence, we regard all the disputes as to leaven, and the other minutiae made essential by the Romanist rubric (wheaten, mingled with proper water, not worm–eaten, etc.,) as non–essential.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-l-dabney.html">Robert L. Dabney</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 1898 | This quote was compiled by Andy Webb</span></figcaption>

</figure><figure class="quote" id="q-515d958d78" data-kw="">
<blockquote><p>In this sacrament there are two things, a visible sign, and an invisible grace: there is a visible sacramental sign of bread and wine; and there is the thing and matter signified, namely the body and blood of Christ: there is an earthly matter, and an heavenly matter.

The outward sacramental sign is common to all; as well the bad, as the good. Judas received the Lord’s bread; but not that bread, which is the Lord to the faithful receiver. The spiritual part, that which feedeth the soul only the faithful do receive.

For he cannot be partaker of the body of Christ, which is no member of Christ’s body. This food offered us at the Lord’s table is to feed our souls withal; it is meat for the mind, and not for the belly. Our souls being spiritual can neither receive, nor digest that which is corporal, they feed only upon spiritual food. It is the spiritual eating that giveth life. The flesh saith Christ, doeth nothing profit. We must lift up our selves from these external and earthly signs, and like Eagles fly up and sore aloft; there to feed on Christ, which sitteth on the right hand of his father, whom the heavens shall keep until the latter day.

From thence and from no other Altar shall he come, in his natural body to judge both quick and dead. His natural body is local, for else it were not a natural body; his body is there, therefore not here: for a natural body doth not occupy sundry places at once. Here we have a sacrament, a sign, a memorial, a commemoration, a representation, a figure effectual of the body and blood of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edwin-sandys.html">Edwin Sandys</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons made by the most reverend Father in God, Edwin, Archbishop of York, primate of England and metropolitan</cite>, (London: Henry Midleton, 1585), p. 75.</span></figcaption>

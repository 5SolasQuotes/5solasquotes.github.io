<main class="wrap"><figure class="quote" id="q-7ccb32f075" data-kw="">
<blockquote><p>VI. If any member of this Church do differ from us about the gesture in the Lord’s Supper (or any such circumstance) we desire them first to come to us and hear our reasons: and if we cannot satisfy them, we will not hinder them from receiving it in any decent gesture they desire.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/posture-and-gestures.html">Posture and Gestures</a></span></div>
<div class="actions"><button class="copy" data-copy="“VI. If any member of this Church do differ from us about the gesture in the Lord’s Supper (or any such circumstance) we desire them first to come to us and hear our reasons: and if we cannot satisfy them, we will not hinder them from receiving it in any decent gesture they desire.”

— Richard Baxter, The Christian Religion expressed: I, briefly in the Ancient Creeds, the Ten Commandments &amp; the Lord’s Prayer, and, II, more largely in a Profession taken out of the Holy Scriptures, containing 1, the articles of the Christian Belief, 2, our consent to the Gospel Covenant, 3, the Sum of Christian Duty according to the primitive simplicity, purity, and practice, fitted to the right instruction of the ignorant, the promoting of holiness, and the charitable concord of all true believers… (London: 1660), The Order &amp; Discipline of this Church, agreeable to the Word of God">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CVI.+If+any+member+of+this+Church+do+differ+from+us+about+the+gesture+in+the+Lord%E2%80%99s+Supper+%28or+any+such+circumstance%29+we+desire+them+first+to+come+to+us+and+hear+our+reasons%3A+and+if+we+cannot+satisfy+them%2C+we+will+not+hinder+them+from+receiving+it+in+any+decent+gesture+they+desire.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+The+Christian+Religion+expressed%3A+I%2C+briefly+in+the+Ancient+Creeds%2C+the+Ten+Commandments+%26+the+Lord%E2%80%99s+Prayer%2C+and%2C+II%2C+more+largely+in+a+Profession+taken+out+of+the+Holy+Scriptures%2C+containing+1%2C+the+articles+of+the+Christian+Belief%2C+2%2C+our+consent+to+the+Gospel+Covenant%2C+3%2C+the+Sum+of+Christian+Duty+according+to+the+primitive+simplicity%2C+purity%2C+and+practice%2C+fitted+to+the+right+instruction+of+the+ignorant%2C+the+promoting+of+holiness%2C+and+the+charitable+concord+of+all+true+believers%E2%80%A6+%28London%3A+1660%29%2C+The+Order+%26+Discipline+of+this+Church%2C+agreeable+to+the+Word+of+God&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ccb32f075.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7ccb32f075.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-kneeling-in-receiving-the-lords-supper/#:~:text=VI.%20If%20any%20member%20of%20this,in%20any%20decent%20gesture%20they%20desire&amp;text=VI.%20If%20any%20member%20of%20this%20Church%20do&amp;text=receiving%20it%20in%20any%20decent%20gesture%20they%20desire" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-08672052eb" data-kw="">
<blockquote><p>Hence, adoration is worship, but every worship is not adoration. Uncovering the head seems to be little older than Paul’s epistles to the Corinthians. The learned [Claudius] Salmasius [d. 1653, a French reformed classical scholar], thinks it but a national sign of honor, no ways universally received: But certainly it is not adoration: Though therefore we [men] receive the Supper of the Lord uncovered, no man can conclude from thence adoration of the elements, as we do from kneeling [before the Supper] conclude the same, as we shall [conclude] here for all bodily worship or expression of our affection to the means of graces (though these means be but creatures) is not adoration properly either of God, or of these means: It is lawful to tremble at the Word, and for Josiah to weep before the book of the Law read, and for the martyrs to kiss the stake, as the instrument by which they glorified God in dying for the truth; all these being objectam quo, and ‘means by the which’ they conveyed their worship to the true God, and natural and lawful expressions of their affection to God;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Divine Right of Church Government (London, 1646)</cite>, pp. 89-90</span></figcaption>

" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-9a8abecf28" data-kw="">
<blockquote><p>[The 2nd Commandment is practically broken] In respect of bodily posture, as if there were more religion in one posture than in another; as in receiving the Lord’s supper kneeling, or praying in such and such a posture, except in so far as it is decent, and otherwise rightly regulate[d] by rules of prudence and nature’s light.</p></blockquote>

</figure><figure class="quote" id="q-f05609036b" data-kw="">
<blockquote><p>I grant, that necessity or decency have introduced many things circumstanial, that are rational, and consequently upon some real antecedent ground, expressive of their use and end: as grave apparel in pastors, a becoming covering of pulpits, tables in sacred use, regulation of time, postures, gestures, and the like, without which worship cannot be performed; but to ascribe a liberty to the Church, of appointing ceremonies, having for reason of their signification the will of the instituter, and their use only in the representation, is so manifest an impingement upon divine authority…</p></blockquote>

<blockquote><p>But still I ask, are we absolutely and always bound to obey magistrates? Nay, but only when they command such things as are according to the rules of the Word, so that either they must be obeyed, or the Law of Charity shall be broken: in this case, and no other, we are bidden obey.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b571955e76" data-kw="">
<blockquote><p>…in the doctrine of scandal, which is more intricate and obscure than every divine conceives, God places acts of providential necessity as emergent significations of his approving will, which are so to us in place of a divine commandment of God’s revealed will, and these providential acts of necessity do no less oblige us to moral obedience than any of the express written commandments of God. I clear it thus: There is an express law, It is sin and unlawful for David, or any man, who is not one of the Lord’s priests, to eat showbread. But God comes in and puts David in such a posture of divine providence that if he eat not showbread, he shall be sinfully guilty of violating a higher moral law of God, who says, ‘I will have mercy and not sacrifice.’ Then David shall be cruel to his own life, and sin against the Sixth Commandment, ‘Thou shalt do no murder,’ if he eat not; for not to eat, when you are in a providential condition of starving, if you may have it, is to kill yourself, and this providential condition does no less oblige you to the moral obedience of the Sixth Command than if God in the letter of the Law should command you to eat. This fact of David was not done by any extraordinary impulsion of the Spirit, but by a constant channel that providence ordinarily runs in, according to which I, or any professor [of Christianity] must be obliged to prefer a work of mercy to sacrifice, that is, by which we are to give obedience to the Sixth Command, which is not to kill; even as without extraordinary impulsion, I may absent myself from hearing the Word when I find going to Church may endanger my life, for non-obedience to affirmatives [affirmative commands] in a greater necessity is ordinary. And therefore Christian prudence, with which the Wisdom of God keeps house, Prov. 8:12, does determine many things of scandal: And prudence is a virtue commanded in the Word of God, for a wise man observes times, and so will he observe all other circumstances… Now these [things against a positive divine law] we are upon no ordinary necessity to do, but such as may encroach upon the hazard of the loss of life, in which case an exigence of providence does stand for a command of non-murdering; had Saul and his army been reduced to a danger of starving in a wilderness, and could have no food except they should kill and eat the cattle of the Amalakites, conceive the Lord’s preferring of mercy before sacrifice should warrant them to eat of the Amalakites cattle, yet would this providential necessity be so limited as it may fall out that it stand not for a divine command, for it holds in affirmative commands only…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, ... (1646), Appendix, Intro to Scandal, question 6, pp. 81-83</span></figcaption>

</figure><figure class="quote" id="q-74b996f70a" data-kw="">
<blockquote><p>Since we have need of civil laws and the power of punishing, it will be wisest not to contemn those given by Moses; but seriously rather to consider what the meaning of God was in them, what he chiefly required, and how much it might be to the good of every nation, if they would borrow thence their manner of governing the commonwealth; yet freely all things and with the Spirit of Christ. For what Solon or Plato, or Aristotle, what lawyers or Caesars could make better laws than God? And it is no light argument, that many magistrates at this day do not enough acknowledge the Kingdom of Christ, though they would seem most Christian, in that they govern their States by laws so diverse from those of Moses.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/martin-bucer.html">Martin Bucer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Matthew</cite>, 5:19, as quoted by John Milton, A Complete Collection of the Historical, Political &amp; Miscellaneous Works of John Milton, vol. 1, p. 394</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><figure class="quote" id="q-258c414b3b" data-kw="">
<blockquote><p>But this right [of the civil government], as far as [it] pertains to its exercise in respect of the infliction of punishment, either tends to the good of the whole republic, as in ordinary cases, or, as in some extraordinary cases, gives place to its hurt; for it is possible that even the exaction of punishment, in a certain condition of a state, may be hurtful. In such a situation of things, the ruler or magistrate has a power not to use his right of government in respect of particular crimes; or rather, he ought to use it in such a manner as is the most likely to attain the end; for he is bound to regard principally the good of the whole and the safety of the people ought to be his supreme law. But he who affirms that in ordinary cases, a magistrate may renounce his right, when that renunciation cannot but turn out to the hurt of the public good, is a stranger to all right.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on Divine Justice</cite>, pp. 567-8 of A Dissertation on Divine Justice... ch. 9 in Works, vol. 10</span></figcaption>

<blockquote><p>Seventhly, are any of the Reformed Churches or any Churches or persons of the whole world so injurious to magistrates as their principles [that of the New England Independents, such as John Cotton] force them to be, who spoil Christian kings and parliaments of their whole legislative power? They will have us to believe, as good divinity, that it is not only unlawful for Church-assemblies to make ecclesiastic canons, but that it is alike unlawful for any prince or State to make a civil law, that the placing of a legislative power in kings or parliaments, is to usurp the property and prerogative of God. These principles cannot be very favorable to the State, which at one stroke annihilate all the acts of Parliament that now are in force, either in this or any other kingdom, and make it impossible (if they were believed) to have any more in any place of the earth, to the world’s end. Look back upon what I have cited from the chief of the Brownists’ writings. I grant the New English polishers of Brownism do not express their tenets in terms so hugely gross; yet see how near they come to them in substance, when they tell us that no magistrate may make any Laws about the bodies, lands, goods, liberties of the subject, which are not according to the laws and rules of Scripture, Scripture being given to men for a perfect rule, as well in matters of civil justice, as of devotion and holiness; and if so, then they must make it as unlawful and contrary to the Scripture’s perfection, for any man to make laws in matters of righteousness and of the State, as in matters of holiness and of the Church. That beside things in themselves good or evil, which Scripture determines by its laws expressly, things of an indifferent nature, whereupon the most of civil laws are made, must be regulated according to the Scripture rules of piety, charity, and conscience, so far that the expediency and reason of the law must ever carry and convince the conscience of the subject: that no man is obliged to the obedience of a civil Law in a thing never so indifferent by the authority of the lawgiver, but every man whose conscience is not convinced of the piety and charity of that Law, is free from all obedience and subjection thereto: Thus far Mr. Cotton.¹ ¹ Cotton’s Model of Power in The Bloody Tenet, p. 140. “The magistrate in making laws about civil and indifferent things in the commonwealth; First, he has no power given him of God to make what laws he pleases, either in restraining from or constraining to the use of indifferent things; because that which is indifferent in its nature, may sometimes be inexpedient in its use, and consequently unlawful: it is a prerogative proper to God to require obedience of the sons of men, because of his authority and will. It is an evil speech in some, that in some things the will of the law, not the reason of it, must be the rule of conscience to walk by: and that princes may forbid men to seek any other reason but their authority, yea when they command men frivola &amp; dura; and therefore it is the duty of the magistrate in all laws about indifferent things, to show the reasons, not only the will; to show the expediency as well as the indifferency of things of that nature; and because the judgement of expedient and inexpedient things, is often difficult and diverse, it is meet that such laws should not proceed without due consideration of the rules of expediency set down in the Word, which are these three: First, the rule of piety, that they may make for the glory of God, 1 Cor. 10:31. Secondly, the rule of charity, that no scandal come thereby to any weak brother, 1 Cor. 8:13. Thirdly, the rule of charity, that no man be forced to submit against his conscience, Rom. 14:14,23.</p></blockquote>

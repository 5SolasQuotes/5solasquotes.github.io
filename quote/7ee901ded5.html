<blockquote><p>3. This Covenant hath the promise of a circumcised heart, Deuteronomy 30:6, and of the word of faith that is near in the mouth, and of the righteousness of faith clearly differenced from the righteousness of the Law by doing. For so Paul, Romans 10:5-7, etc., expounds, Moses, Deuteronomy 30:11-14.

4. The Covenant of Works taught nothing of the way of expiation of sin by blood typifying the ransom of blood that Christ was to pay for our sins, as this covenant, all along had sacrifices and blood to confirm it. Exodus 24:8. And Moses took the blood and sprinkled it on the people, and said, behold this is the Blood of the Covenant which the Lord hath made with you, concerning all these words. Now the words were the Ten Commandments. See Hebrews 9:18-24.

(5.) This Covenant is made with Israel only, Exodus 20; Deuteronomy 5:6; Deuteronomy 6:5-7, 12. The Covenant of Works is made with all mankind. 6. No people under the Law can be justified and saved thereby, nor have their sins pardoned, Romans 3:9-11, 19-20; Romans 4:1-4; Romans 9; Romans 10; Psalms 130:3; Psalms 143:2; Galatians 3:1-3, 10-13. But in this Covenant, Abraham, David, Genesis 15; Psalm 32; Romans 4:1-9. And the Jews by faith, have remission of sins and salvation, as also the Gentiles have, Acts 10:43; Acts 15:11. […]

8. The Passover and Circumcision, Genesis 17:7, all along were seals of the Covenant, as Baptism on with circumcision in substance, Colossians 2:11, is the seal of the same Covenant, Acts 2:39-41. Now the Law required no Circumcision, no shedding of blood, no repentance, no new heart, but eternal condemnation followed the least breach thereof. Paul saith, Galatians 5:3, If ye be Circumcised (as the false Apostles would have, that thereby you may be justified and saved) you are debtors to keep the whole Law perfectly, as the only way to life, and by no other Covenant can you be justified and saved, now Abraham was not circumcised that way, circumcision did bind Abraham to keep the Law, as a Ceremony and Seal of the Covenant of Works doth command no ceremony, no sacrifice, no type of Christ Mediator at all.</p></blockquote>

<blockquote><p>And what are the leading characteristics, which it points out of this new covenant, as contradistinguished from that formerly made in the wilderness? They are chiefly two: first, that, according to this, provision should be distinctly made for the pardoning of iniquity, which the other, of itself, could not do, it being a simple revelation of law, threatening death for every transgression; and secondly, that, while under the old covenant, the law was only written upon tables of stone, and consequently was without then, by the new covenant it was to be put in “their inward parts, and written in their hearts.” [Jeremiah 31:33]

But what law is it that was thus to be changed from an outward into an inward testimony — transferred, as it were, from the tables of stone, into the “fleshly tables of the heart?” Not certainly the ceremonial law, as the Mosaic ritual is sometimes called, for this so far from being exalted into a higher place by Christ, was, in him, abolished, passing away like the shadow when the substance came. And, indeed, that outward ritual, though it is sometimes spoken of as a law, is never designated absolutely the law of God, and least of all, can it be meant when the law and covenant are considered, as they are here, in great measure identical, what was called pre-eminently the law, and what formed exclusively the old covenant, was simply the Ten Commandments— these wholly, and these alone.

It can scarcely, therefore, admit of a doubt, that these are what the Spirit of prophecy here foretold should, one day, viz., in the Gospel dispensation, be written by the finger of God upon the hearts of his people. Their relative position to man, indeed, was to be changed; they were no longer to be placed before him as a law of strict and unbending holiness, by conformity to which he was to make good his title to God’s favour and blessing; as a covenant, in that respect, they were to cease, having served, only while they stood through man’s inability to keep them, to multiply transgression; but as God was going to take the vindication of the law’s honour into his own hand, so that he could bestow pardon and righteousness, as a free gift, upon the guilty, he was at the same time to make provision for having that law, the image of his own holiness, impressed upon the hearts of his people by the living energy of his Spirit.

In short, by the terms of the new covenant, the people of God were not to have the law of the Ten Commandments imposed on them as the way by which they were to attain life, but breathed into them as the form and pattern of life already received from above; they were to become the law of the Spirit of life in Christ Jesus, because the law, in all the requirements of which he had perfected himself, and therefore that also, unto which they should be ever growing up, who, through the Spirit, were to be in all things “made conformable to his image.”

But if this be true of the Ten Commandments as a whole, it must, of course, be true of each individual part—of the Fourth Commandment, as well as any of the rest. This, undoubtedly, was included as an essential part of the law or covenant, which was formerly written without, and set up before, the people of God; but is now written within, and infused with living power into the feelings and affections of their heart.

Hence the framers of the English Liturgy, with a right understanding of this truth, have added, after the reading of the Ten Commandments in the public service, the following prayer, which is just the words of this prophecy turned into a petition, “And have mercy upon us, and write all these laws in our hearts”—a prayer which, with marvellous inconsistence, is constantly read by the ministers of that Church; while a vast proportion of them hold that the Fourth Commandment, one of these laws, is no longer binding upon the consciences of men. [1]

And is not the argument which we have drawn from the words of this prophecy, in favour of the Sabbath, strikingly confirmed by the records of experience? For how uniformly do those, who are admitted into the privileges of the new covenant, love and delight in the day of God? When he writes his law upon the heart, we never see the Fourth Commandment omitted. Nay, the more any one drinks into the spirit of the Gospel, and experiences the grace of God writing the law of holiness upon the tablet of his heart, the more invariably does he count the Sabbath “the holy of the Lord and honourable.” So far from disliking the restraints which it throws around his condition, and panting for a larger freedom amid the recreations or business of the world, he gladly hails its hallowed employments, and finds its weekly returns as so many “spring days” to his spiritual nature.</p></blockquote>

f+this+prophecy+turned+into+a+petition%2C+%E2%80%9CAnd+have+mercy+upon+us%2C+and+write+all+these+laws+in+our+hearts%E2%80%9D%E2%80%94a+prayer+which%2C+with+marvellous+inconsistence%2C+is+constantly+read+by+the+ministers+of+that+Church%3B+while+a+vast+proportion+of+them+hold+that+the+Fourth+Commandment%2C+one+of+these+laws%2C+is+no+longer+binding+upon+the+consciences+of+men.+%5B1%5D%0A%0AAnd+is+not+the+argument+which+we+have+drawn+from+the+words+of+this+prophecy%2C+in+favour+of+the+Sabbath%2C+strikingly+confirmed+by+the+records+of+experience%3F+For+how+uniformly+do+those%2C+who+are+admitted+into+the+privileges+of+the+new+covenant%2C+love+and+delight+in+the+day+of+God%3F+When+he+writes+his+law+upon+the+heart%2C+we+never+see+the+Fourth+Commandment+omitted.+Nay%2C+the+more+any+one+drinks+into+the+spirit+of+the+Gospel%2C+and+experiences+the+grace+of+God+writing+the+law+of+holiness+upon+the+tablet+of+his+heart%2C+the+more+invariably+does+he+count+the+Sabbath+%E2%80%9Cthe+holy+of+the+Lord+and+honourable.%E2%80%9D+So+far+from+disliking+the+restraints+which+it+throws+around+his+condition%2C+and+panting+for+a+larger+freedom+amid+the+recreations+or+business+of+the+world%2C+he+gladly+hails+its+hallowed+employments%2C+and+finds+its+weekly+returns+as+so+many+%E2%80%9Cspring+days%E2%80%9D+to+his+spiritual+nature.%E2%80%9D%0A%0A%E2%80%94+Patrick+Fairbairn%2C+The+Sabbath.+Part+IV.+in+Christian+Miscellany&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F92d3cc2db5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/92d3cc2db5.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2021/03/14/patrick-fairbairn-on-the-new-covenant-and-the-fourth-commandment/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-d29ae1160a" data-kw="">
<blockquote><p>The second thing to be gathered is that the fathers before Christ, ever since the Fall of Adam, and Christians in the times of the Gospel, did live under the same Covenant for substance, but not for manner of administration, which is most clear by evident testimonies of holy Scripture, and by the very form of the Covenant, which was one before and after the coming of Christ. The same God that calls us, called them to the hope of eternal life: they were endued with the same Spirit, and lived by the same faith. Their sacraments, for substance and signification, agree with ours; and they expected an inheritance everlasting and undefiled. Religion for substance was ever one and unchangeable, and such as were truly religious walked in the same way, and waited for the same heavenly inheritance and everlasting crown of glory. The Church before Christ may be considered as an heir, or as an infant, according to the substance of the covenant, or according to the manner of administration. In the first respect the Church is under the Covenant or promise, and her people are called a free and willing people, an heir of heavenly and spiritual blessings. In the latter respect she is under the Covenant, in respect of the different administration, and her people are called a servile people in comparison, an heir under tutors and governors, not differing from a servant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-ball.html">John Ball</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of the Covenant of Grace</cite>, … (London: 1645), ch. 3, ‘Of the Covenant of Grace in General’; p. 27</span></figcaption>

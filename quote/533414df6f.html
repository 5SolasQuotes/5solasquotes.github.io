<main class="wrap"><figure class="quote" id="q-533414df6f" data-kw="">
<blockquote><p>God shows here, by his prophet, that He was constrained by urgent necessity to deal sharply and roughly with the people. Nothing, we know, is more pleasing to God than to treat us kindly; for there is not found a father in the world who cherishes his children as tenderly: but we, being perverse, suffer Him not to follow the inclination of his nature. He is therefore constrained to put on, as it were, a new character, and to chide us severely, according to the way in which He here says, He had treated the Israelites; ‘I have cut them,’ He says, ‘by my prophets, and killed them by the words of my mouth.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Hosea</cite>, 6:5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b6bfd17c0d" data-kw="">
<blockquote><p>I come now to the next attribute expressed in this proclamation, merciful: ‘The Lord, the Lord God, strong, gracious, merciful, abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity, transgression, and sin,’ Ex. 34:6-7. Things attributed to God here are of three sorts:

1. The inward disposition or inclination, or aptitude and readiness to mercy, that is in the four first attributes, merciful, gracious, long-suffering, much in goodness, and truth is added.

2. There are his purposes and resolutions of mercy, keeping mercy for thousands; and they are immanent acts in God, kept and laid up in God’s own breast.

3. There are extrinsical acts of mercy issuing from both: ‘pardoning iniquity, transgression, and sin.’ The meaning plainly is, first, God is merciful as He is Jehovah; that is his nature. Secondly, He fully resolves to show mercy; there is his heart. Thirdly, He has done it, and does it every day, in pardoning sin; there is his wont and practice. So that God is every way merciful: in his nature, in his purposes, and in his deeds and performance.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-goodwin.html">Thomas Goodwin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Object &amp; Acts of Justifying Faith, pt. 1</cite>, bk. 1, ch. 8, on Ex. 34:6-7 in The Works (d. 1680; Edinburgh: James Nichol, 1864), vol. 8, p. 55</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>
<div class="actions"><button class="copy" data-copy="“I come now to the next attribute expressed in this proclamation, merciful: ‘The Lord, the Lord God, strong, gracious, merciful, abundant in goodness and truth, keeping mercy for thousands, forgiving iniquity, transgression, and sin,’ Ex. 34:6-7. Things attributed to God here are of three sorts:

nd%20in%20his%20deeds%20and%20performance&amp;text=I%20come%20now%20to%20the%20next%20attribute%20expressed&amp;text=his%20purposes%2C%20and%20in%20his%20deeds%20and%20performance" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-dec1e52d00" data-kw="">
<blockquote><p>No man was ever questioned by God for having too much grace; we may all complain of too little: More grace is the constant desire of every holy soul as there is a propensity in God to give it; ‘To him that has, more shall be given’: God loves to accumulate his favors, to load us with his benefits; he gives liberally that He may draw out our hope to follow Him for more and more still. ‘Let us then abound in hope, holding fast our confidence firm unto the end.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-cole.html">Thomas Cole</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse of Christian Religion</cite>, ... (London: R.R., 1692), Christ the Hope of Glory, ch. 6, p. 112</span></figcaption>

</figure><figure class="quote" id="q-30c6bb1512" data-kw="">
<blockquote><p>Thus, gratia Dei [the grace of God] is that perfection or attribute according to which God, out of a totally gracious and unmerited love, is conceived as willing to communicate himself to his creatures. (Rijssen, Summa Theol., III.xliii) Considered as affective, as ratione actus interni in Deo [a rule of the internal act in God], grace is a propensity of the divine will–while considered as effective it is the gifts of the Spirit graciously given to us by God, either the ordinary gifts of faith, hope, and love or the extraordinary gifts bestowed upon the church for its edification. (Rijssen, Summa theol., III.xliii.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-muller.html">Richard Muller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Post-Reformation Reformed Dogmatics</cite>, (Baker Academic, 2003), vol. 3, p. 571</span></figcaption>

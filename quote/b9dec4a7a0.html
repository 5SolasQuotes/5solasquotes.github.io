<main class="wrap"><figure class="quote" id="q-b9dec4a7a0" data-kw="">
<blockquote><p>As for the state to which sanctification brings us, we thought meet 1. To put down the manner and nature of the inclination itself, in the apostle’s words, ‘zealous of good works,’ lest any should think that the external work is all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Concord, or the Agreement of the Associated Pastors &amp; Churches of Worcestershire, with Richard Baxter’s Explication &amp; Defence of it, &amp; his Exhortation to Unity (London: A.M., 1653), ‘A Brief Explication of some Passages in the Profession’</cite>, p. 25</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a106ea2af5" data-kw="">
<blockquote><p>It followeth not, that they [good works] are con-causes, or joint-causes with Christ, but only conditions; just as a man’s journeying on foot or horse, to a city, or a kingdom to inherit it, is the way, condition, of his entering the city; But it is not his charter, or law-title, or right to enjoy the crown, as his inheritance; any effective influence to the title of the crown of Heaven, I dare not ascribe to any works in us, or to any but to Christ; but undeniably, good works are not so much as conditions of justification, they follow a man justified, but go not before justification; no more then the apple goeth before the tree, or the cistern before the fountain; nor are they the conditions of the Covenant of Grace: they are the conditions of covenanted ones, not of the Covenant.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism (London, 1648), pt. 2 | Sections 4-5 &amp; 6 Objections Answered in ch. 48, ‘Antinomians hold that the believer cannot sin against God…’, pp. 61-65</cite>, pp. 62-63</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“It followeth not, that they [good works] are con-causes, or joint-causes with Christ, but only conditions; just as a man’s journeying on foot or horse, to a city, or a kingdom to inherit it, is the way, condition, of his entering the city; But it is not his charter, or law-title, or right to enjoy the crown, as his inheritance; any effective influence to the title of the crown of Heaven, I dare not ascribe to any works in us, or to any but to Christ; but undeniably, good works are not so much as conditions of justification, they follow a man justified, but go not before justification; no more then the apple goeth before the tree, or the cistern before the fountain; nor are they the conditions of the Covenant of Grace: they are the conditions of covenanted ones, not of the Covenant.”

— Samuel Rutherford, A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism (London, 1648), pt. 2 | Sections 4-5 &amp; 6 Objections Answered in ch. 48, ‘Antinomians hold that the believer cannot sin against God…’, pp. 61-65, pp. 62-63">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CIt+followeth+not%2C+that+they+%5Bgood+works%5D+are+con-causes%2C+or+joint-causes+with+Christ%2C+but+only+conditions%3B+just+as+a+man%E2%80%99s+journeying+on+foot+or+horse%2C+to+a+city%2C+or+a+kingdom+to+inherit+it%2C+is+the+way%2C+condition%2C+of+his+entering+the+city%3B+But+it+is+not+his+charter%2C+or+law-title%2C+or+right+to+enjoy+the+crown%2C+as+his+inheritance%3B+any+effective+influence+to+the+title+of+the+crown+of+Heaven%2C+I+dare+not+ascribe+to+any+works+in+us%2C+or+to+any+but+to+Christ%3B+but+undeniably%2C+good+works+are+not+so+much+as+conditions+of+justification%2C+they+follow+a+man+justified%2C+but+go+not+before+justification%3B+no+more+then+the+apple+goeth+before+the+tree%2C+or+the+cistern+before+the+fountain%3B+nor+are+they+the+conditions+of+the+Covenant+of+Grace%3A+they+are+the+conditions+of+covenanted+ones%2C+not+of+the+Covenant.%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+A+Survey+of+the+Spiritual+Antichrist%2C+Opening+the+Secrets+of+Familism+%26+Antinomianism+%28London%2C+1648%29%2C+pt.+2+%7C+Sections+4-5+%26+6+Objections+Answered+in+ch.+48%2C+%E2%80%98Antinomians+hold+that+the+believer+cannot+sin+against+God%E2%80%A6%E2%80%99%2C+pp.+61-65%2C+pp.+62-63&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa106ea2af5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a106ea2af5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=It%20followeth%20not%2C%20that%20they%20%5Bgood,covenanted%20ones%2C%20not%20of%20the%20Covenant&amp;text=It%20followeth%20not%2C%20that%20they%20%5Bgood%20works%5D%20are&amp;text=conditions%20of%20covenanted%20ones%2C%20not%20of%20the%20Covenant" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-33c911faca" data-kw="">
<blockquote><p>Works are a cause of salvation: certainly [the term] ‘instrumental’ is more to be preferred than ‘efficient’.</p></blockquote>

</figure><figure class="quote" id="q-ddc852ad7f" data-kw="">
<blockquote><p>Doctrine: Sound knowledge and belief joined with sovereign fear and love, and both these crowned with sincere repentance and obedience, guided by the light and line of true religion, is the only way to true happiness. They are all of them in their places of absolute necessity, and without any one of them a man cannot attain to that happiness that we aim at, etc. 2. All these are required absolutely; take them divisively, by themselves, etc. Knowledge and faith are necessary as the very foundation and groundwork of the whole building; repentance and obedience, they are necessary too, as the very issue and product of all, as the evident demonstration of the other. Love and fear, those holy affections of the soul, they are necessary too as the very vital things, wherein I conceive grace does principally consist, etc. But yet if we speak comparatively, which of all these were the most necessary, and wherein lies the principality of these; I conceive in this former respect every one of them may claim a principality, and go for a principal. But yet simply and absolutely the most characteristical of all these is the qualification of the heart and soul, the changing and turning of the affections, when the bias of them is set Godward and heavenward, there lies the principal.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-stoughton.html">John Stoughton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as given in Richard Baxter, Richard Baxter’s Confession of his Faith… (London: 1655), ch. 3, pp. 397-98 Stoughton (1593?–1639) | Sermon 7</cite>, p. 51</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

</figure><figure class="quote" id="q-b3d711adc6" data-kw="">
<blockquote><p>By setting aside the contrary supposition, he proves his statement, that by grace we are saved, — that we have no remaining works by which we can merit salvation; for all the good works which we possess are the fruit of regeneration. Hence it follows, that works themselves are a part of grace.</p></blockquote>

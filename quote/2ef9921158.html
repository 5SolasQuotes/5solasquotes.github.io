<main class="wrap"><figure class="quote" id="q-2ef9921158" data-kw="">
<blockquote><p>That which overthrows the main difference, between the Law and Gospel, ought not be admitted; for the confounding of them will open an in-let to innumerable errors; nay by this means the Gospel itself will become a mere cypher. The Apostle [Paul] we see was exceeding[ly] careful to keep these doctrines distinct from each other.1 Endnotes 1. “Amongst such labors and endeavors (Christian reader) I commend to thy consideration, the ensuing Treatise and commit thee to the Lord.” —Westminster, Nov. 7, 1653. John Owen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-eyre.html">William Eyre</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Justification without Conditions; or Free Justification of a Sinner, (London: 1654), 57.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-law-of-god.html">The Law of God</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-7536d9eabe" data-kw="">
<blockquote><p>The Ten Commandments, accordingly, were published from Sinai in the form of a covenant, or federal, transaction. The Sinai transaction was a mixed dispensation. In it, the covenant of grace was repeated and published; the covenant of works was awfully displayed in subservience thereto; and a national covenant between God and the Israelites was also made as an appendage to the covenant of grace. Accordingly, the law of the Ten Commandments was thence promulgated by the Son of God, the glorious Mediator, as a rule of life to believers in a manner suited to the covenant of grace. The same law was repeated and displayed to the Israelites in the form of the covenant of works, and it was published to them as the matter of a national covenant, or covenant of peculiarity, between God and them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-colquhoun.html">John Colquhoun</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on the Law and Gospel (Grand Rapids: Reformation Heritage Books), 46.</cite></span></figcaption>

</figure><figure class="quote" id="q-faff82bb91" data-kw="ceremonial abrogation">
<blockquote><p>The ceremonial law can be viewed in two ways: either with regard to doctrine and signification; or with regard to obligation and observance. The question is not whether it was abrogated as to doctrine. We confess that it still remains and is useful in many ways among Christians; and that the mystical truth, hidden under this shell, is always the same and of perpetual necessity. Rather the question is whether it was abrogated as to obligation and obedience and whether believers are still in subjection to the ceremonial law. This was the opinion not only of the Jews of old, but also of the Judaizing false apostles in the time of the apostles. However we, with the apostles and the whole church, deny it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 11.25.1</span></figcaption>

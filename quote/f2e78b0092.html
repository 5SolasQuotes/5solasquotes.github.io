<blockquote><p>It is instructive to observe what [Charles G.] Finney asseverates that he “holds, and expressly teaches,” that the grounds of justification are not, set as they are in contrast with the one thing, the love of God, which he declares that the ground of justification is. The ground of justification he asseverates is not (1) the obedience of Christ for us; (2) our own obedience either to the law or to the gospel; (3) the atonement of Christ; (4) anything in the mediatorial work of Christ; (5) the work of the Holy Spirit in us. It is not anything that either Christ or we have done; and it is not anything that we have done or have become under the operations of the Spirit. It is solely the divine benevolence.

The Atonement, from the point of view of the Rectoral theory, which Finney teaches, naturally has no adaptation to serve immediately as the ground of any act of God. Its only immediate effect is to bring men to repentance and faith; and thus the entire work of Christ is reduced to inducing men to repent and believe. It is not so clear, however, that the repentance and faith to which men are thus brought, together with their resultant obedience, do not constitute the proper ground of their justification in this scheme.

No doubt “the fundamental reason” of justification lies in the love of God: nothing is required, in this scheme, to enable the benevolent God to forgive sin,—it flows spontaneously out of His benevolence alone. But the benevolent God is not free to act on this scheme out of His benevolence alone. He has tied Himself up with governmental obligations. The love of God cannot fulfil itself in the actual justification of sinners, therefore, consistently with his governmental obligations, except in the case of those who have been brought by the Atonement (serving the purposes here of punishment) to repentance and faith, with the consequent amendment of life which is sanctification.

This “reformation of life” is obviously in such a sense the “condition” of justification that it may properly be called its ground. It is not the ground of God’s impulse to justify, but it is the ground of God’s actually justifying, the sinner. In it the manifestation of His love to this or that particular sinner is grounded. It is the ground of justification in the same sense in which the righteousness of Christ — active and passive—is in the Reformation doctrine of justification, namely, that in view of which God pardons the sins of those whom He justifies and accepts as righteous in His sight. When Finney strenuously argues that God can accept as righteous no one who is not intrinsically righteous, it cannot be denied that he teaches a work-salvation, and has put man’s own righteousness in the place occupied in the Reformation doctrine of justification by the righteousness of Christ.

Finney, it must be confessed, exhibits no desire to conceal from himself the seriousness of his departure from the Reformation teaching in his doctrine of justification. One of the reasons for his constant insistence that the righteousness of man—no less than the atoning work of Christ—is only a condition, not the ground, of justification, is to escape from all implication of a forensic doctrine of justification. He fairly rages against this forensic doctrine. “Now,” he exclaims of it, “this is certainly ‘another gospel’ from the one I am inculcating. It is not a difference merely upon some speculative or theoretic point. It is a point fundamental to the gospel of salvation if any one can be.”

It is with full consciousness, therefore, that he ranges himself over against the doctrine of the Reformation, as teaching “another gospel.” And the precise point on which his opposition turns is that the Reformation doctrine, by interposing an imputation of the righteousness of Christ as the ground on which the sinner is accepted as righteous, does not require perfect intrinsic righteousness as the condition precedent of justification.

This he cries out against as a doctrine of justification “in sin.” “It certainly cannot be true,” he declares, “that God accepts and justifies the sinner in his sins. I may safely challenge the world for either reason or Scripture to support the doctrine of justification in sin, in any degree of present rebellion against God. The Bible everywhere represents justified persons as sanctified, and always expressly conditionates justification on sanctification, in the sense of present obedience to God.” “Present, full and entire consecration of heart and life to God, and to His service,” he says again, “is an unalterable condition of present pardon of past sin, and of present acceptance with God”; and “the penitent soul remains justified no longer than the full-hearted consecration continues.”

At an earlier point he lays down the proposition that God cannot in any sense “justify one ‘who does not yield a present and full obedience to the moral law,” and, pouring scorn on any “method of justification” which does not presuppose such an obedience, exclaims, “What good can result to God, or the sinner, or to the universe by this pardoning and justifying an unsanctified soul?” “If what has been said is true,” he then remarks, “we see that the Church has fallen into a great and ruinous mistake, in supposing that a state of present sinlessness is a very rare, if not impossible, attainment in this life. If the doctrine of this lecture be true, it follows that the very beginning of true religion in the soul, implies the renunciation of all sin. Sin ceases when holiness begins.”

And he closes with an invective against those who object to such as “teach that God justifies no one, but upon condition of present sinlessness”—than which we could have no more precise assertion that justification proceeds on the presupposition of sinlessness. The attainment of sinlessness with Finney is the first, not the last step of the religious life.</p></blockquote>

<blockquote><p>There is therefore a twofold justification. One whereby, in ourselves being sinners, we are justified before God, from without us: The other whereby being now justified before God from without us, we are justified before Him within ourselves. The first of these is the cause of the second. The second is the effect and demonstration of the first. The first is done by faith, the other by works. Both must concur that the righteousness of the Law may be fulfilled in us… Let us speak fullier of the second sort of justification. It is that whereby God, by regeneration given us, and the works of sincere faith which we performed, absolves us from the charge of hypocrisy, profaness and impiety, and no longer takes us for men dead in sin, servants of the Devil and children of the world, but for true believers, his sons restored to his image, endued with his life and translated into his Kingdom: which judgment of God, the Law also approves. Not that it [the Law] takes it self-satisfied by our works, but because being bereaved of its dominion and subjected to Christ our Lord, it cannot choose but [to] commend the works which come from faith in Christ and from his Spirit, and account them for true righteousness, though they are imperfect; and them that perform them, for truly righteous and sons pleasing to God. Let it be here enquired, seeing Scripture does often and expressly ascribe to us both these righteousnesses we speak of, and therefore we are in respect of them both to be judged righteous, not only with men, but with God, whether in the same sense as we are said to be justified by works, Jam. 2, and to be justified by words, Mt. 12, works may not be said to be imputed to us for righteousness? Not indeed as faith is imputed to righteousness: but as the fact of Phineas is said to be imputed to him for righteousness, Ps. 106:31.</p></blockquote>

not+only+with+men%2C+but+with+God%2C+whether+in+the+same+sense+as+we+are+said+to+be+justified+by+works%2C+Jam.+2%2C+and+to+be+justified+by+words%2C+Mt.+12%2C+works+may+not+be+said+to+be+imputed+to+us+for+righteousness%3F+Not+indeed+as+faith+is+imputed+to+righteousness%3A+but+as+the+fact+of+Phineas+is+said+to+be+imputed+to+him+for+righteousness%2C+Ps.+106%3A31.%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%2C+ch.+10%2C+sect.+3%2C+pp.+342-52+in+Richard+Baxter%E2%80%99s+Confession+of+his+Faith%E2%80%A6+%28London%3A+1655%29+The+page+numbering+is+misnumbered.+The+whole+of+sect.+3+has+more+on+this+topic%2C+as+Baxter+quotes+80+authors+in+support+of+his+views+on+the+necessity+of+works+for+believers+in+salvation.%2C+pp.+344-47&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F3658de9588.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/3658de9588.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-twofold-justification/#:~:text=There%20is%20therefore%20a%20twofold%20justification,to%20him%20for%20righteousness%2C%20Ps.%20106%3A31&amp;text=There%20is%20therefore%20a%20twofold%20justification.%20One%20whereby&amp;text=be%20imputed%20to%20him%20for%20righteousness%2C%20Ps.%20106%3A31" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

</figure><figure class="quote" id="q-3e4eba02e0" data-kw="">
<blockquote><p>That work of Christ naturally divides itself into three parts — His work of active obedience, His work of atonement, His work of renewing grace upon His people’s souls. By His active obedience He wrought out, in perfection, the very righteousness which the law requires.

By His atoning sacrifice He satisfied the penal demands of the law, and thereby vindicated its authority and took away its curse, from His people. By His renewing grace, in regenerating and sanctifying those whom His atoning blood has washed, and His imputed righteousness has justified, He brings them into personal conformity to the law; in other words, into that state of holiness without which no man shall see the Lord.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-buchanan.html">Robert Buchanan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>On the Relation of the Law, as Given to Israel, to the Mission and Work of Christ in Patrick Fairbairn et al., Divine Revelation Explained and Vindicated: A Course of Lectures for the Times, Delivered in Glasgow in the Spring of 1866</cite></span></figcaption>

</figure><figure class="quote" id="q-361678f0fc" data-kw="">
<blockquote><p>1. That justifying faith, or that faith whereby we are justified, is our receiving of Christ as our Lord and Saviour, trusting in him and yielding obedience to him.

2. That faith, in justifying, is not to be considered as a hand whereby we lay hold on the righteousness of another, or as an instrument, as though righteousness were provided for us and tendered unto us; which would overthrow all necessity of being righteous in ourselves.

3. Nor yet doth faith, repentance, or obedience, procure our justification, or is the efficient or meritorious cause thereof.

4. But the true use of our faith (and repentance), as to our justification before God, is that they are the “causa sine qua non,” or the condition whereby, according to the appointment of God, we come to be justified; and so is imputed to us.

5. That our justification is our absolution from the guilt of sin, and freedom from obnoxiousness unto punishment for it, and nothing else. Our regeneration is the condition of our absolution, and in them both, in several respects, is our righteousness.

6. That the way whereby we come to obtain this absolution is this: Jesus Christ, the only Son of God, being sent by him to reveal his love and grace to lost, sinful mankind, in that work yielding obedience unto God even unto death, was, for a reward of that obedience, exalted, and had divine authority over them for whom he died committed to him to pardon and save them; which accordingly he doth, upon the performance of the condition of faith and obedience by him prescribed to them, at once effecting a universal conditional application of all actually justifying every individual upon the performance of the condition.

7. That as to good works, and their place in this business, Paul speaks of the perfect works of the law and legal manner of justifying, which leave no place for grace or pardon; James, of gospel works of new obedience, which leave place for both.

8. That the denial of our faith and obedience to be the condition of our justification, or the asserting that we are justified by the obedience of Christ imputed to us, is the ready way to overthrow all obedience, and drive all holiness and righteousness out of the world.

9. That, as the beginning, so the continuance of our justification depends on the condition of our faith, repentance, and obedience, which are not fruits consequent of it, but conditions antecedent to it, Socin. Thes. de Justificat. p. 18; Fragm. de Justificat. p. 113. And therefore, in the first place, we are to be solicitous about what is within us, about our sanctification, before our absolution or justification, Socin. Ep. ad Ch. MN. de Fide et Operibus.

10. As to the death of Christ, our sins were the impulsive cause of it, and it was undergone for the forgiveness of sins, and occasioned by them only, and is in some sense the condition of our forgiveness.

11. That absolution and pardon of sin are by no means the immediate effects of the death of Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, ed. William H. Goold, vol. 12 (Edinburgh: T&amp;T Clark, n.d.), 597–601.</span></figcaption>

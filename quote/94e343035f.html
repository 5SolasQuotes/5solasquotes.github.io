<main class="wrap"><figure class="quote" id="q-94e343035f" data-kw="">
<blockquote><p>The errors and deficiencies one materially tolerates and accommodates for the time and circumstances under necessity, for the higher good in love, overlooking a multitude of sins (1 Pet. 4:8), without approving them, versus what one believes and the standard one seeks to reform unto, namely the spotless Word of God, are two different things which may consist with each other.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

<blockquote><p>11… Thus vices are treated in ethics per accidens of the opposite; and in vain would one have [them] investigated [in] another discipline in which vices are treated per se, since they are intelligible only by reason of the opposites.</p></blockquote>

</figure><figure class="quote" id="q-f194c6ee17" data-kw="">
<blockquote><p>However, “evil” is an ambiguous term and may stand for miserable or moral evils. One may morally choose to undergo and suffer certain miserable (though not moral) evils in necessity, other alternatives not being available, likely, reasonable or best. Choosing to eat expired food rather than starve is not wrong, though starving would be. That one must have the best or none at all, is against the greater good; miserable evils often contain a significant degree of good, and we ought not to choose the worst.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/travis-fentiman.html">Travis Fentiman</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Editor’s Extended Introduction” in English Puritans, A Refutation of the Errors of Separatists</cite>, (1604; RBO, 2025), p. 139</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

</figure><figure class="quote" id="q-de25237a54" data-kw="">
<blockquote><p>…we most heartily wish any disease of this Church to be timeously prevented and cured. But withal we wish this to be done without a rupture, and such a dangerous division… which in itself is a sore disease, and from which in holy Scripture we are often and very earnestly dehorted. Dionysius [†264], Bishop of Alexandria, in his epistle to Novatus, recorded by Eusebius, Histories, bk. 6, ch. 45, worthily says: ‘You ought rather to have suffered anything whatsoever for avoiding of cutting asunder the Kirk of God: and martyrdom for keeping the Kirk from schism is no less glorious than which is suffered for not committing idolatry. And in my opinion also it is greater: for in suffering martyrdom for not committing idolatry, a man suffers for one, even for his own soul; but here a man suffers martyrdom for the whole Kirk.’</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/scottish-aberdeen-doctors.html">Aberdeen Doctors</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Duplies of the Ministers &amp; Professors of Aberdeen to Second Answers of some Reverend Brethren, concerning the Late</cite>, [National] Covenant (Aberdeen: Raban, 1638), “First Duply”, p. 11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

 Online</a></div>
</figure><figure class="quote" id="q-db9ced9cfe" data-kw="">
<blockquote><p>2nd Rule: If we compare a greater moral necessity with a less moral necessity, the less necessity must yield to the greater. [If] a necessity of mercy must yield to a necessity of sacrificing: If David then should not have eaten the showbread in his providential necessity of famine, [then] he should have been guilty both of [the] active scandalizing [of] the souls of others in killing himself, and should have killed himself; and the less moral necessity ceases and is no necessity when a greater moral necessity intervenes.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government</cite>, … (1646), Appendix, p. 82</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/ethics-and-virtue.html">Ethics and Virtue</a></span></div>

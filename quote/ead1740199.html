<main class="wrap"><figure class="quote" id="q-ead1740199" data-kw="">
<blockquote><p>Answer [Bishop Sydserff]: How define ye worship? Opponent [Rutherford]: An act of man whereby God is immediately honored. Answer: Say also according to God’s command. Opponent: I will not say, when I define worship in general. If I should define lawful worship I would add this–that it be according to God’s command. I remit to your learning to think: If one thing can give nature both to genus and to species, you know good logic speaks against this. God’s command cannot but give being to worship and to this particular worship, to wit, to lawful worship; and [in] this [your] way I might say [that] idolatry, sacrificing to Satan as Indians do, slaying of children to Moloch, etc. shall not be false worship except they be urged as commanded of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Samuel Rutherford &amp; Thomas Sydserff, Bishop of Galloway, ‘An Discussing of Some Arguments Against Canons &amp; Ceremonies in God’s Worship’ 1636′ in Religious Controversy in Scotland</cite>, 1625-1639 ed. David G. Mullan in Scottish History Society, Fifth Series, vol 11 (Edinburgh: Scottish Historical Society, 1998), p. 98</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

0How%20define%20ye,be%20urged%20as%20commanded%20of%20God&amp;text=Answer%20%5BBishop%20Sydserff%5D%3A%20How%20define%20ye%20worship%3F%20Opponent&amp;text=except%20they%20be%20urged%20as%20commanded%20of%20God" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-27b9fb99a7" data-kw="">
<blockquote><p>There is a twofold worship due only to God, internal and external.… Internal, which consists in the acts of the soul and actions answerable thereto. When the mind is most taken up with an object, and the heart and affections most set upon it, this is soul worship, and this is due only to God.… Now according to this distinction of worship there are two sorts of idolatry, 1. Open, outward idolatry.… 2. Secret and soul idolatry, when the mind and heart is set upon anything more than God; when anything is more valued, more intended; anything more trusted, more loved, or our endeavours more for any other thing than God. Then is that soul worship, which is due only to God … given to other things besides him. And this is as true, as heinous idolatry, as the former, though not so open, discernible, nor so much observed.… Secret idolaters shall have no inheritance in the kingdom of God. Soul idolatry will exclude men out of heaven as well as open idolatry. He that serves his lusts is as uncapable of heaven as he that serves, worships idols of wood or stone.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-clarkson.html">David Clarkson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Soul Idolatry Excludes Men Out of Heaven</cite>, on Eph. 5:5 (definition of soul idolatry)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a> › <a href="../topics/worship/nature-of-worship/worship-in-spirit-and-truth.html">Worship in spirit and truth</a></span><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-a4670b4bbd" data-kw="">
<blockquote><p>…the last place, 2 Chron. 29, out of which no more can be drawn but that the people worshipped whiles the priests were yet offering the burnt-offering. Now the burnt-offering was but accidentally before the people in their worshipping, and only because it was offered at the same time when the song of the Lord was sung. Verse 27… Verse 36, Since then the song and the sacrifice were performed at the same time, we must note that the people worshipped at that time not because of the sacrifice which was a mediate worship, but because of the song of the Lord, which was an immediate worship. Now we all commend kneeling in an immediate worship. But this cannot content our Opposites, they will needs have it lawful to kneel in the hearing of the Word, purposely and with a respect to the Word preached, (though this be a mediate worship only. Their warrants are taken out of Ex. 4:30-31; 12:27; 2 Chron. 20:18; Mt. 17:6. From the first three places no more can be inferred but that these hearers bowed their heads and worshipped after that they had heard the Word of the Lord; Neither shall they ever warrant bowing and worshipping in the act of hearing. In the fourth place we read that the disciples fell on their faces when they heard God’s own immediate voice out of the cloud: What makes this for falling down to worship at the hearing of the Word preached by men? How long shall our Opposites not distinguish betwixt mediate and immediate worship?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English Popish Ceremonies</cite>, (1637), pt. 3, ch. 4; p. 72</span></figcaption>

</figure><figure class="quote" id="q-f9b2e72a0b" data-kw="">
<blockquote><p>The proper act of religion is to bestow honor upon God and is called worship and adoration, Ex. 12:25, 26; Jn. 4:23. It must bear a certain good towards God, otherwise it would not be observance towards Him. No intrinsic good can be added to God, but honor is an outward good–a testimony to the virtue of another which adds to his glory or esteem. This is all a creature can do for God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, ed. John Eusden (1639; Baker, 1997), bk. 2, ch. 4, ‘Religion’, section 23, p. 239 See also the chart on, pp. 72-73.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

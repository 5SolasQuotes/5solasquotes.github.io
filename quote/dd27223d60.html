<main class="wrap"><figure class="quote" id="q-dd27223d60" data-kw="">
<blockquote><p>Question 9: Is a man ever bound to accuse himself, and seek justice against himself? Answer 1: In many cases a man is bound to punish himself: As when the law against swearing, cursing or the like, does give the poor a certain mulct [fine] which is the penalty: He ought to give that money himself: And in cases where it is a necessary cure to himself: And in any case where the public good requires it: As if a magistrate offend whom none else will punish, or who is the judge in his own cause: he should so far punish himself as is necessary to the suppression of sin, and to the preserving of the honor of the laws: As I have heard of a justice that swore twenty oaths, and paid his twenty shillings for it.

2. A man may be bound in such a divine vengeance or judgment as seeks after his particular sin, to offer himself to be a sacrifice to justice, to stop the judgement: As Jonah and Achan did.

3. A man may be bound to confess his guilt and offer himself to justice to save the innocent, who is falsely accused and condemned for his crime.

4. But in ordinary cases a man is not bound to be his own public accuser or executioner. Question 10: May a witness voluntarily speak that truth which he knows will further an unrighteous cause, and be made use of to oppress the innocent? Answer: He may never do it as a confederate in that intention: Nor may he do it when he knows that it will tend to such an event (though threatened or commanded) except when some weightier accident does preponderate for the doing it (as the avoiding of a greater hurt to others than it will bring on the oppressed, etc.). Question 11: May a witness conceal some part of the truth? Answer: Not when he swears to deliver the whole truth: nor when a good cause is like[ly] to suffer, or a bad cause to be furthered by the concealment: nor when he is under any other obligation to reveal the whole.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Christian Directory, or a Sum of Practical Theology</cite>, … (London, 1673), pt 4, ch. 22, ‘Cases &amp; Directions Against Injurious Law-Suits, Witnessing &amp; Judgment’, p. 149</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-95f1337787" data-kw="">

<blockquote><p>What is warranted by the direction of nature’s light is warranted by the law of nature, and consequently by a divine law; for who can deny the law of nature to be a divine law?… All civil power is immediately from God in its root; in that, 1st, God has made man a social creature, and one who inclines to be governed by man; then certainly He must have put this power in man’s nature: so are we, by good reason, taught by Aristotle. 2nd, God and nature intends the policy and peace of mankind, then must God and nature have given to mankind a power to compass this end; and this must be a power of government… As domestic society is by nature’s instinct…</p></blockquote>

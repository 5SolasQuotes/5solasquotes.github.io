<main class="wrap"><figure class="quote" id="q-5b54395096" data-kw="">
<blockquote><p>Let them, if they will, expect eternal life for their good works; only let us on the authority of Paul hope for it from the grace of God. … Let the saying of Paul then stand fast — that “the inheritance is not of the law but of faith, that the promise according to grace may be sure to every one that believeth.” (Romans 4:14.)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Acts of the Council of Trent with the Antidote</cite>, Session 6, on canon 26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/efficient-cause.html">Efficient Cause: The Free Grace of God</a> › <a href="../topics/justification/efficient-cause/gods-free-grace.html">God’s free grace</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-is-by-grace.html">Justification is by grace</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-b49c3cf9d4" data-kw="">
<blockquote><p>“It is God that justifieth;” and, therefore, the continuation of our justification is his act also. And this, on his part, depends on the immutability of his counsel; the unchangeableness of the everlasting covenant, which is “ordered in all things, and sure;” the faithfulness of his promises; the efficacy of his grace; his complacency in the propitiation of Christ; with the power of his intercession, and the irrevocable grant of the Holy Ghost unto them that do believe.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, ch. 5</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/justification-and-perseverance.html">Justification and Perseverance</a></span><span class="t"><a href="../topics/justification/efficient-cause.html">Efficient Cause: The Free Grace of God</a> › <a href="../topics/justification/efficient-cause/gods-free-grace.html">God’s free grace</a></span><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-as-a-one-time-act.html">Justification as a one-time act</a></span></div>
<div class="actions"><button class="copy" data-copy="““It is God that justifieth;” and, therefore, the continuation of our justification is his act also. And this, on his part, depends on the immutability of his counsel; the unchangeableness of the everlasting covenant, which is “ordered in all things, and sure;” the faithfulness of his promises; the efficacy of his grace; his complacency in the propitiation of Christ; with the power of his intercession, and the irrevocable grant of the Holy Ghost unto them that do believe.”

— John Owen, The Doctrine of Justification by Faith, ch. 5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%9CIt%20is%20God%20that%20justifieth%3B%E2%80%9D%20and%2C%20therefore%2C%20the%20continuation%20of%20our%20justification%20is%20his%20act%20also.%20And%20this%2C%20on%20his%20part%2C%20depends%20on%20the%20immutability%20of%20his%20counsel%3B%20the%20unchangeableness%20of%20the%20everlasting%20covenant%2C%20which%20is%20%E2%80%9Cordered%20in%20all%20things%2C%20and%20sure%3B%E2%80%9D%20the%20faithfulness%20of%20his%20promises%3B%20the%20efficacy%20of%20his%20grace%3B%20his%20complacency%20in%20the%20propitiation%20of%20Christ%3B%20with%20the%20power%20of%20his%20intercession%2C%20and%20the%20irrevocable%20grant%20of%20the%20Holy%20Ghost%20unto%20them%20that%20do%20believe.%E2%80%9D%0A%0A%E2%80%94%20John%20Owen%2C%20The%20Doctrine%20of%20Justification%20by%20Faith%2C%20ch.%205&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb49c3cf9d4.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b49c3cf9d4.html">Permalink</a><a class="src" href="https://ccel.org/ccel/owen/just/just.ix.html" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-f9e1d8e3fb" data-kw="">
<blockquote><p>First, he asserts, that the salvation of the Ephesians was entirely the work, the gracious work of God. But then they had obtained this grace by faith. On one side, we must look at God; and, on the other, at man. God declares, that he owes us nothing; so that salvation is not a reward or recompense, but unmixed grace.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistles to the Galatians and Ephesians</cite>, Ephesians 2:8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/efficient-cause.html">Efficient Cause: The Free Grace of God</a> › <a href="../topics/justification/efficient-cause/gods-free-grace.html">God’s free grace</a></span><span class="t"><a href="../topics/good-works/merit-and-reward.html">Merit and Reward</a></span><span class="t"><a href="../topics/justification/nature-of-justification.html">Nature of Justification</a> › <a href="../topics/justification/nature-of-justification/justification-is-by-grace.html">Justification is by grace</a></span></div>
<div class="actions"><button class="copy" data-copy="“First, he asserts, that the salvation of the Ephesians was entirely the work, the gracious work of God. But then they had obtained this grace by faith. On one side, we must look at God; and, on the other, at man. God declares, that he owes us nothing; so that salvation is not a reward or recompense, but unmixed grace.”

— John Calvin, Commentaries on the Epistles to the Galatians and Ephesians, Ephesians 2:8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFirst%2C%20he%20asserts%2C%20that%20the%20salvation%20of%20the%20Ephesians%20was%20entirely%20the%20work%2C%20the%20gracious%20work%20of%20God.%20But%20then%20they%20had%20obtained%20this%20grace%20by%20faith.%20On%20one%20side%2C%20we%20must%20look%20at%20God%3B%20and%2C%20on%20the%20other%2C%20at%20man.%20God%20declares%2C%20that%20he%20owes%20us%20nothing%3B%20so%20that%20salvation%20is%20not%20a%20reward%20or%20recompense%2C%20but%20unmixed%20grace.%E2%80%9D%0A%0A%E2%80%94%20John%20Calvin%2C%20Commentaries%20on%20the%20Epistles%20to%20the%20Galatians%20and%20Ephesians%2C%20Ephesians%202%3A8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff9e1d8e3fb.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f9e1d8e3fb.html">Permalink</a><a class="src" href="https://ccel.org/ccel/calvin/calcom41" rel="noopener" target="_blank">Read it online · CCEL</a></div>
</figure><figure class="quote" id="q-f980f0e3eb" data-kw="">
<blockquote><p>God freely justifies the persons whom he effectually calls. He does this, not by infusing righteousness into them but by pardoning their sins and by accounting them, and accepting them as righteous. This He does for Christ’s sake alone and not for anything wrought in them or done by them. The righteousness which is imputed to them, that is, reckoned to their account, is neither their faith nor the act of believing nor any obedience to the gospel which they have rendered, but Christ’s obedience alone. Christ’s one obedience is twofold – His active obedience rendered to the entire divine law, and His passive obedience rendered in his death.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/westminster-assembly.html">Westminster Assembly</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Westminster Confession of Faith</cite>, 11.1 (modern English)</span></figcaption>

</figure><figure class="quote" id="q-6aef140aee" data-kw="">
<blockquote><p>It may however be hence inferred with certainty, that our salvation is altogether through the grace and mere beneficence of God. He might indeed have used other words -- that the wages of righteousness is eternal life; and then the two clauses would correspond: but he knew that it is through God&#x27;s gift we obtain it, and not through our own merits.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentaries on the Epistle to the Romans</cite>, Romans 6:23</span></figcaption>

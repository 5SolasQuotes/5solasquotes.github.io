<main class="wrap"><figure class="quote" id="q-92050b3eb5" data-kw="">
<blockquote><p>If the general must be warranted by the Word, so also specials under the general, else men’s will may make a horned bullock a decent sacrifice to represent Christ already come in the flesh; for if the written Word warrant not the specials of religious observances, a door is open for all human inventions:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Divine Right of Church Government… (London, 1646) Westminster divine</cite>, p. 119</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-748db3f4cb" data-kw="">
<blockquote><p>And thus have we made good our argument that the lawfulnss of the ceremonies cannot be warranted by any ecclesiastical law. If we had no more against them, this were enough, that they are but human additions and want the warrant of the Word. When Nadab and Abihu offered strange fire before the Lord (Lev. 10:1), and when the Jews burnt their sons and their daughters in the valley of the son of Hinnon, howsoever manifold wickedness might have been challenged in that which they did, yet if any would dispute with God upon the matter, He stops their mouths with this one answer, ‘I commanded it not, neither came it into my heart.’ (Jer. 7:31)</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>English-Popish Ceremonies (1637), bk. 3, ch. 7, section 14</cite>, p. 122</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-26081e435a" data-kw="">
<blockquote><p>With regard to the form to be observed in receiving the sacraments, it is not without reason that you entertain doubts and scruples, for nothing is better than to abide by that pure simplicity which we hold from the Son of God, whose ordinance ought to be our single rule, to which also the usage of the apostles was perfectly conformable. And indeed the moment we deviate ever so little from it, our admixture of human invention cannot fail to be a corruption. But it seems to us that your condition is different from that of the pastors of the place and the great body of the people. If the pastors did their duty, they would employ all their endeavours to retrench those superfluities which do not tend to edification, or rather which serve to obscure the clearness of the gospel. The [civil] governors on their part would also do well to see to it. It is a vice to be condemned so far as they are concerned, that they keep up these unmeaning mummeries — which are as it were a residue of Popish superstitions, the recollection of which we should strive as much as in us lies to exterminate. But in your capacity of private individuals, not only you may lawfully, but what is more, you should support and suffer such abuses as it is not in your power to correct. We do not hold lighted candles in the celebration of the eucharist, nor figured bread to be such indifferent things that we would willingly consent to their introduction, or approve of them, though we object not to accommodate ourselves to the use of them, where they have been already established, when we have no authority to oppose them. If we were called upon to receive such ceremonies, we should hold ourselves bound according to the position in which God has placed us, to admit of no compromise in resisting their introduction, and in maintaining constantly the purity which the church confided to us already possesses. But should our lot be cast in some place where a different form prevails, there is not one of us who from spite against a candle or a chasuble [a ministerial vestment] would consent to separate himself from the body of the church, and so deprive himself of the use of the sacrament.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letters, vol 3 (Philadelphia: Presbyterian Board of Publication), Letter 346, ‘To the Brethren of Wezel’, pp. 30-31. Calvin is speaking to reformed refugees attending Lutheran churches. See the whole letter in general.</cite></span></figcaption>

</figure><figure class="quote" id="q-187d739753" data-kw="">
<blockquote><p>There is no part of religion which Satan does not endeavor to destroy under pretense of promoting it: and his way is to overgo Christ and his apostles, and to seem more zealous than ever they were, and to mend their work by doing it better or doing more. Christ was not strict enough for the Pharisees, in keeping the Sabbath, nor in his company, nor in his diet. Satan has always two ways to destroy both truth and duty: The first is by direct opposing it; But when that will not do, the next is by overdoing and pretending to defend it. If he cannot destroy zeal, by scorning it and quenching it; he will try to do it by overheating and distempering it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Cure of Church Divisions… (London, 1670), pt. 1 | Direction 57</cite>, p. 270</span></figcaption>

</figure><figure class="quote" id="q-9093877d1c" data-kw="">
<blockquote><p>There is a twofold opinion concerning the reformation of Churches: some hold that nothing at all should be added to apostolical simplicity, and by consequence are of mind that whatsoever the apostles did, they think they are to do it, but whatsoever the Church after the apostles did add to the first rites, they think them fit even all at once to be abolished. There are others on the other side which hold that certain ancient rites (besides the apostolical ordinances) are to be retained, partly as profitable and necessary: partly also albeit not necessary, yet to be tolerated for concord sake’s. For mine own part I doubt not but the apostolical doctrine to be most absolutely perfect without all exception, to the which it is not lawful to add or to detract any thing; howbeit, touching ceremonies my judgement is otherwise. For first, it is certain that even the apostles themselves could not determinately set down what they judged to be expedient for the Churches in their first beginning: and therefore necessarily they proceeded by little and little, as the institution of deacons does make evident, inasmuch as they suffered for a season many Jewish ceremonies, as appears in the story of their Acts: again, to whom can it be doubtful that the apostles had exceeding regard unto their times, places and persons in external rites. Inasmuch as it is not profitable that the same rites were observed everywhere, as appears in that excellent epistle of Irenaeus to Victor. Besides, necessity itself abolished certain of their ordinances, as their common feasts of love. Wherefore whatsoever was performed by the apostles in rites and ceremonies, I do not judge that presently, neither yet without some exception, to be followed as a rule. And indeed I wonder not that those ancient fathers, having respect unto their own times, did take away some things, some things add and somewhat alter. Only herein (with their good leave be it spoken) they seem to me to have often failed, that they neither held any measure in their rites, neither had that due regard to Christian simplicity and purity as was meet.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Epistolarum theologicarum Theodori Bezae Vezelii, liber unus (Geneva: Vignon, 1575), Epistle 8, p. 70-71, as translated by John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1618), ‘Reformed Practices’, ‘Practice’</cite>, pp. 175-76</span></figcaption>

<div class="actions"><button class="copy" data-copy="“There is a twofold opinion concerning the reformation of Churches: some hold that nothing at all should be added to apostolical simplicity, and by consequence are of mind that whatsoever the apostles did, they think they are to do it, but whatsoever the Church after the apostles did add to the first rites, they think them fit even all at once to be abolished. There are others on the other side which hold that certain ancient rites (besides the apostolical ordinances) are to be retained, partly as profitable and necessary: partly also albeit not necessary, yet to be tolerated for concord sake’s. For mine own part I doubt not but the apostolical doctrine to be most absolutely perfect without all exception, to the which it is not lawful to add or to detract any thing; howbeit, touching ceremonies my judgement is otherwise. For first, it is certain that even the apostles themselves could not determinately set down what they judged to be expedient for the Churches in their first beginning: and therefore necessarily they proceeded by little and little, as the institution of deacons does make evident, inasmuch as they suffered for a season many Jewish ceremonies, as appears in the story of their Acts: again, to whom can it be doubtful that the apostles had exceeding regard unto their times, places and persons in external rites. Inasmuch as it is not profitable that the same rites were observed everywhere, as appears in that excellent epistle of Irenaeus to Victor. Besides, necessity itself abolished certain of their ordinances, as their common feasts of love. Wherefore whatsoever was performed by the apostles in rites and ceremonies, I do not judge that presently, neither yet without some exception, to be followed as a rule. And indeed I wonder not that those ancient fathers, having respect unto their own times, did take away some things, some things add and somewhat alter. Only herein (with their good leave be it spoken) they seem to me to have often failed, that they neither held any measure in their rites, neither had that due regard to Christian simplicity and purity as was meet.”

— Theodore Beza, Epistolarum theologicarum Theodori Bezae Vezelii, liber unus (Geneva: Vignon, 1575), Epistle 8, p. 70-71, as translated by John Sprint, Cassander Anglicanus, showing the Necessity of Conformity to the Prescribed Ceremonies of our Church in Case of Deprivation (London: Bill, 1618), ‘Reformed Practices’, ‘Practice’, pp. 175-76">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThere+is+a+twofold+opinion+concerning+the+reformation+of+Churches%3A+some+hold+that+nothing+at+all+should+be+added+to+apostolical+simplicity%2C+and+by+consequence+are+of+mind+that+whatsoever+the+apostles+did%2C+they+think+they+are+to+do+it%2C+but+whatsoever+the+Church+after+the+apostles+did+add+to+the+first+rites%2C+they+think+them+fit+even+all+at+once+to+be+abolished.+There+are+others+on+the+other+side+which+hold+that+certain+ancient+rites+%28besides+the+apostolical+ordinances%29+are+to+be+retained%2C+partly+as+profitable+and+necessary%3A+partly+also+albeit+not+necessary%2C+yet+to+be+tolerated+for+concord+sake%E2%80%99s.+For+mine+own+part+I+doubt+not+but+the+apostolical+doctrine+to+be+most+absolutely+perfect+without+all+exception%2C+to+the+which+it+is+not+lawful+to+add+or+to+detract+any+thing%3B+howbeit%2C+touching+ceremonies+my+judgement+is+otherwise.+For+first%2C+it+is+certain+that+even+the+apostles+themselves+could+not+determinately+set+down+what+they+judged+to+be+expedient+for+the+Churches+in+their+first+beginning%3A+and+therefore+necessarily+they+proceeded+by+little+and+little%2C+as+the+institution+of+deacons+does+make+evident%2C+inasmuch+as+they+suffered+for+a+season+many+Jewish+ceremonies%2C+as+appears+in+the+story+of+their+Acts%3A+again%2C+to+whom+can+it+be+doubtful+that+the+apostles+had+exceeding+regard+unto+their+times%2C+places+and+persons+in+external+rites.+Inasmuch+as+it+is+not+profitable+that+the+same+rites+were+observed+everywhere%2C+as+appears+in+that+excellent+epistle+of+Irenaeus+to+Victor.+Besides%2C+necessity+itself+abolished+certain+of+their+ordinances%2C+as+their+common+feasts+of+love.+Wherefore+whatsoever+was+performed+by+the+apostles+in+rites+and+ceremonies%2C+I+do+not+judge+that+presently%2C+neither+yet+without+some+exception%2C+to+be+followed+as+a+rule.+And+indeed+I+wonder+not+that+those+ancient+fathers%2C+having+respect+unto+their+own+times%2C+did+take+away+some+things%2C+some+things+add+and+somewhat+alter.+Only+herein+%28with+their+good+leave+be+it+spoken%29+they+seem+to+me+to+have+often+failed%2C+that+they+neither+held+any+measure+in+their+rites%2C+neither+had+that+due+regard+to+Christian+simplicity+and+purity+as+was+meet.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+Epistolarum+theologicarum+Theodori+Bezae+Vezelii%2C+liber+unus+%28Geneva%3A+Vignon%2C+1575%29%2C+Epistle+8%2C+p.+70-71%2C+as+translated+by+John+Sprint%2C+Cassander+Anglicanus%2C+showing+the+Necessity+of+Conformity+to+the+Prescribed+Ceremonies+of+our+Church+in+Case+of+Deprivation+%28London%3A+Bill%2C+1618%29%2C+%E2%80%98Reformed+Practices%E2%80%99%2C+%E2%80%98Practice%E2%80%99%2C+pp.+175-76&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F9093877d1c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/9093877d1c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-regulative-principle-of-worship/#:~:text=There%20is%20a%20twofold%20opinion%20concerning,simplicity%20and%20purity%20as%20was%20meet&amp;text=There%20is%20a%20twofold%20opinion%20concerning%20the%20reformation&amp;text=to%20Christian%20simplicity%20and%20purity%20as%20was%20meet" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

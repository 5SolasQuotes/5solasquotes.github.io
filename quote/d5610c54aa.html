<blockquote><p>Now it [theology] differs from other systems, and bodies of Sciences. 1 Because it is revealed from above; all other knowledge is gathered from things below. 2 Again, all other sciences are taught by men, but this is taught by the Holy Ghost. 3 All other knowledge is delivered in the writings of men, but this is revealed to us in the holy Word of God, which was written by God himself, though men were the mediate pen men of it; therefore I add that, to distinguish it from other Sciences; that, It is not revealed by men, but by the Holy Ghost, not in books written by men, but in the holy Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-preston.html">John Preston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Life Eternal or, A Treatise of the Knowledge of the Divine Essence and Attributes</cite>, (2nd edn, London: Nicholas Bourne, 1631), p. 2.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d232debef1" data-kw="">
<blockquote><p>Holy Scripture contains all things necessary for our salvation, and that clearly; and therefore nothing beyond its open testimony is to be admitted in religion as necessary either to believe or to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, On the Sufficiency of Scripture, Proposition 1</span></figcaption>

</figure><figure class="quote" id="q-b298d6ffdd" data-kw="">
<blockquote><p>XXV. This proposition that God can deceive if he will (although he neither will nor can will it), by whatever interpretation softened, is deservedly rejected as crude and dangerous. Yea it is openly repugnant also to the truth delivered in Scripture concerning God. For if God can deceive, he can also lie and sin if he so willed (which is opposed to his most perfect truth and holiness). For a long time, this concept was condemned therefore as blasphemous among the Scholastics.

To deceive another by words, what else is it than to lie or to speak falsely? Therefore if God can deceive by words, he can also lie (which is expressly repugnant to Scripture [Tit. 1:2; Heb. 6:18] and to the nature of God, in which there can be neither ignorance nor error of judgment nor malice nor any such thing from which a lie could take its origin). Yea, if we could say this, I shudder to relate, we could also say that God could be made not God; if God can deceive, he can sin; if he can sin, he can become not God because he who sins (or can sin) is not God. …

Now no one but an atheist will deny that God cannot will to deceive. … If he can deceive, our faith in the Scriptures would always be wavering. If the Scriptures were given by a God who can deceive, how could we persuade an atheist that he had not deceived? To no purpose would you say that he did not will to deceive, for how could he be assured of this?

Not from Scripture (which expressly says this) because he could immediately reply, this was said by that God who can deceive, and how do we know that he has not here given the effect which he is said to be able to give? Not from the nature of God because it is not repugnant to God’s nature to give that effect which he has the power to give. In vain also would you say that it is repugnant to his nature to will to effect it because if it is not repugnant to his nature to be able to perform it, neither will it be repugnant to his nature to be able to will to perform it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, trans. George M. Giger, ed. James T. Dennison (1679-85; 3 vols, Phillipsburg NJ: Presbyterian &amp; Reformed, 1992), 3.21.25.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/holy-scripture.html">Holy Scripture</a></span></div>

</figure><figure class="quote" id="q-61c1c18666" data-kw="">
<blockquote><p>But not only does Scripture give no countenance or authority to tradition as a recognised means of conveying to us the divine will, and not only does it virtually exclude tradition as a divine informant by plainly enough asserting its own sufficiency and perfection, but it also contains much that goes directly to disprove the authority and validity of tradition.

The pharisaic doctrine of tradition was the same as that of the Papists and Tractarians, and the use made of it by the Pharisees was precisely analogous to that made of it by their successors in the work of corrupting true religion, so that tradition is an old device of Satan; it met, as exhibited in the case of the Pharisees, with the most decided and emphatic condemnation from our Saviour, who not only himself refused to pay the smallest regard or respect to their traditions; in this as in everything else leaving us an example that we should follow his steps, but declared that they made the word of God of none effect by their traditions — a declaration just as applicable to the conduct of Papists and Tractarians as to that of those against whom it was originally directed.

When our Lord had so emphatically denounced this principle, and the use made of it, it might have been expected that Satan would scarcely have ventured to have again employed the same device for making the word of God of none effect among men who professed to honour Christ, and to submit to his authority. But the event has justified his wisdom and his knowledge of human nature. He has again succeeded, notwithstanding our Saviour’s warnings and denunciations, in making the word of God of none effect by tradition, in grievously corrupting the true religion by means of the devices and inventions of men.

We cannot recognise tradition as an authorised method of conveying to us the divine will, unless we have God’s own authority for regarding and trusting it as such. But God in his word has not only given it no such authority, but has, both by general principles and by specific statements, forbidden us to take it as our rule or guide.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-cunningham.html">William Cunningham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Lectures on Subjects Connected with Natural Theology, Evidences of Christianity, the Canon and Inspiration of Scripture</cite>, (New York: Robert Carter and Brothers, 1878), Lecture XXXIX, pp 485-86.</span></figcaption>

</figure><figure class="quote" id="q-877bc9e165" data-kw="">
<blockquote><p>5. We accept, secondly, on the topic of a rule:

I. That the rule or measure of a thing must be marked &amp; easy. Suarez, Metaphysics, pt. 2, distinction II, section 3, because it must be accommodated to the knowledge of a thing. Therefore, since the Scripture is a rule, it is not obscure and difficult, as the Papists will.

II. A rule has a parity of proportion to that thing that it is the rule of. If, therefore, the Scripture is the rule of faith, faith does not extend beyond the Scripture: and therefore, unwritten traditions do not at all pertain to faith.

III. A rule that is such by its nature has in itself the reason of its exemplary cause, and is therefore prior by nature to the thing it regulates. If, therefore, the Scripture is the rule of faith, it is indeed prior to faith: if it is prior to faith, then also to the faithful; and if to the faithful, then to the church, which is the congregation of the faithful, and so it is that the Roman church banishes it from that superior place in which it tends to set its own self with some nefarious presumption, as if it were ahead of and above the Scripture.

IV. A rule consists in something indivisible; that is, so constituted that the least bit is neither increased or diminished. They therefore violate the Scriptures who join to them their own traditions or abolish anything whatsoever prescribed by them: and the Roman Pontiffs are manifestly possessed of both these evils.

V. If Scripture is the rule of faith, then those who can err in the exposition of Scripture can indeed err in faith, and commend a false rule of faith to others. That, however, the Pope and the Roman church interpret many parts of Scripture insipidly and impiously is so manifest that it need not be proven. Therefore, the Roman Pontiff may shamefully err in his decrees, even concerning faith and morals.

VI. Since such is the nature of this rule, that it be a precept, anything admitted without the direction of this rule, of what species soever it otherwise be, is anomalous, and an aberration: and therefore, as much the supererogations of the Papists as their many dogmas (concerning the worship of images and creatures, purgatory, the mass itself, and the Roman Pontiff) must be acknowledged to necessarily be mere error.

VII. Since the Scripture is not indeed a single precept, but a system of precepts respecting the same thing (namely, that we live well to God), it is necessary that it contain within itself the whole doctrine of theology: therefore, what thing sover the Roman Pontiff obtrudes without Scripture must be alien to true theology.

VIII. Finally, since it is the rule of faith, they must be enemies of the faithful who snatch that rule from their hands.

      6. We accept those qualities conceded to Scripture from Bellarmine, that it is a certain and stable rule of faith. For:

I. If it is, in itself, a certain rule, then it can leave us certain of the will of God, without the definitions of the church.

II. Then all uncertainties, the lie of men, are by the decree of God to be examined according to that rule.

III. Then it does not admit various and uncertain senses.

IV. Then a certain determination is to be sought from Scripture of all controversies which are stirred up concerning the faith.

V. If it is indeed a stable rule, then nothing is necessary to be believed by us, or useful, which was unknown in the age of the apostles.

VI. Then the dispensations of the Papists are pernicious impostures.

VII. Then, finally, the stability of the church entirely depends upon this: if it constantly adheres to this rule.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>From ch. 1 of Bellarminus Enervatus</cite>, tr. Charles Johnson</span></figcaption>

<div class="actions"><button class="copy" data-copy="“5. We accept, secondly, on the topic of a rule:

I. That the rule or measure of a thing must be marked &amp; easy. Suarez, Metaphysics, pt. 2, distinction II, section 3, because it must be accommodated to the knowledge of a thing. Therefore, since the Scripture is a rule, it is not obscure and difficult, as the Papists will.

II. A rule has a parity of proportion to that thing that it is the rule of. If, therefore, the Scripture is the rule of faith, faith does not extend beyond the Scripture: and therefore, unwritten traditions do not at all pertain to faith.

III. A rule that is such by its nature has in itself the reason of its exemplary cause, and is therefore prior by nature to the thing it regulates. If, therefore, the Scripture is the rule of faith, it is indeed prior to faith: if it is prior to faith, then also to the faithful; and if to the faithful, then to the church, which is the congregation of the faithful, and so it is that the Roman church banishes it from that superior place in which it tends to set its own self with some nefarious presumption, as if it were ahead of and above the Scripture.

IV. A rule consists in something indivisible; that is, so constituted that the least bit is neither increased or diminished. They therefore violate the Scriptures who join to them their own traditions or abolish anything whatsoever prescribed by them: and the Roman Pontiffs are manifestly possessed of both these evils.

V. If Scripture is the rule of faith, then those who can err in the exposition of Scripture can indeed err in faith, and commend a false rule of faith to others. That, however, the Pope and the Roman church interpret many parts of Scripture insipidly and impiously is so manifest that it need not be proven. Therefore, the Roman Pontiff may shamefully err in his decrees, even concerning faith and morals.

VI. Since such is the nature of this rule, that it be a precept, anything admitted without the direction of this rule, of what species soever it otherwise be, is anomalous, and an aberration: and therefore, as much the supererogations of the Papists as their many dogmas (concerning the worship of images and creatures, purgatory, the mass itself, and the Roman Pontiff) must be acknowledged to necessarily be mere error.

VII. Since the Scripture is not indeed a single precept, but a system of precepts respecting the same thing (namely, that we live well to God), it is necessary that it contain within itself the whole doctrine of theology: therefore, what thing sover the Roman Pontiff obtrudes without Scripture must be alien to true theology.

VIII. Finally, since it is the rule of faith, they must be enemies of the faithful who snatch that rule from their hands.

      6. We accept those qualities conceded to Scripture from Bellarmine, that it is a certain and stable rule of faith. For:

I. If it is, in itself, a certain rule, then it can leave us certain of the will of God, without the definitions of the church.

II. Then all uncertainties, the lie of men, are by the decree of God to be examined according to that rule.

III. Then it does not admit various and uncertain senses.

IV. Then a certain determination is to be sought from Scripture of all controversies which are stirred up concerning the faith.

V. If it is indeed a stable rule, then nothing is necessary to be believed by us, or useful, which was unknown in the age of the apostles.

VI. Then the dispensations of the Papists are pernicious impostures.

VII. Then, finally, the stability of the church entirely depends upon this: if it constantly adheres to this rule.”

— William Ames, From ch. 1 of Bellarminus Enervatus, tr. Charles Johnson">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C5.+We+accept%2C+secondly%2C+on+the+topic+of+a+rule%3A+I.+That+the+rule+or+measure+of+a+thing+must+be+marked+%26+easy.+Suarez%2C+Metaphysics%2C+pt.+2%2C+distinction+II%2C+section+3%2C+because+it+must+be+accommodated+to+the+knowledge+of+a+thing.+Therefore%2C+since+the+Scripture+is+a+rule%2C+it+is+not+obscure+and+difficult%2C+as+the+Papists+will.+II.+A+rule+has+a+parity+of+proportion+to+that+thing+that+it+is+the+rule+of.+If%2C+therefore%2C+the+Scripture+is+the+rule+of+faith%2C+faith+does+not+extend+beyond+the+Scripture%3A+and+therefore%2C+unwritten+traditions+do+not+at+all+pertain+to+faith.+III.+A+rule+that+is+such+by+its+nature+has+in+itself+the+reason+of+its+exemplary+cause%2C+and+is+therefore+prior+by+nature+to+the+thing+it+regulates.+If%2C+therefore%2C+the+Scripture+is+the+rule+of+faith%2C+it+is+indeed+prior+to+faith%3A+if+it+is+prior+to+faith%2C+then+also+to+the+faithful%3B+and+if+to+the+faithful%2C+then+to+the+church%2C+which+is+the+congregation+of+the+faithful%2C+and+so+it+is+that+the+Roman+church+banishes+it+from+that+superior+place+in+which+it+tends+to+set+its+own+self+with+some+nefarious+presumption%2C+as+if+it+were+ahead+of+and+above+the+Scripture.+IV.+A+rule+consists+in+something+indivisible%3B+that+is%2C+so+constituted+that+the+least+bit+is+neither+increased+or+diminished.+They+therefore+violate+the+Scriptures+who+join+to+them+their+own+traditions+or+abolish+anything+whatsoever+prescribed+by+them%3A+and+the+Roman+Pontiffs+are+manifestly+possessed+of+both+these+evils.+V.+If+Scripture+is+the+rule+of+faith%2C+then+those+who+can+err+in+the+exposition+of+Scripture+can+indeed+err+in+faith%2C+and+commend+a+false+rule+of+faith+to+others.+That%2C+however%2C+the+Pope+and+the+Roman+church+interpret+many+parts+of+Scripture+insipidly+and+impiously+is+so+manifest+that+it+need+not+be+proven.+Therefore%2C+the+Roman+Pontiff+may+shamefully+err+in+his+decrees%2C+even+concerning+faith+and+morals.+VI.+Since+such+is+the+nature+of+this+rule%2C+that+it+be+a+precept%2C+anything+admitted+without+the+direction+of+this+rule%2C+of+what+species+soever+it+otherwise+be%2C+is+anomalous%2C+and+an+aberration%3A+and+therefore%2C+as+much+the+supererogations+of+the+Papists+as+their+many+dogmas+%28concerning+the+worship+of+images+and+creatures%2C+purgatory%2C+the+mass+itself%2C+and+the+Roman+Pontiff%29+must+be+acknowledged+to+necessarily+be+mere+error.+VII.+Since+the+Scripture+is+not+indeed+a+single+precept%2C+but+a+system+of+precepts+respecting+the+same+thing+%28namely%2C+that+we+live+well+to+God%29%2C+it+is+necessary+that+it+contain+within+itself+the+whole+doctrine+of+theology%3A+therefore%2C+what+thing+sover+the+Roman+Pontiff+obtrudes+without+Scripture+must+be+alien+to+true+theology.+VIII.+Finally%2C+since+it+is+the+rule+of+faith%2C+they+must+be+enemies+of+the+faithful+who+snatch+that+rule+from+their+hands.+6.+We+accept+those+qualities+conceded+to+Scripture+from+Bellarmine%2C+that+it+is+a+certain+and+stable+rule+of+faith.+For%3A+I.+If+it+is%2C+in+itself%2C+a+certain+rule%2C+then+it+can+leave+us+certain+of+the+will+of+God%2C+without+the+definitions+of+the+church.+II.+Then+all+uncertainties%2C+the+lie+of+men%2C+are+by+the+decree+of+God+to+be+examined+according+to+that+rule.+III.+Then+it+does+not+admit+various+and+uncertain+senses.+IV.+Then+a+certain+determination+is+to+be+sought+from+Scripture+of+all+controversies+which+are+stirred+up+concerning+the+faith.+V.+If+it+is+indeed+a+stable+rule%2C+then+nothing+is+necessary+to+be+believed+by+us%2C+or+useful%2C+which+was+unknown+in+the+age+of+the+apostles.+VI.+Then+the+dispensations+of+the+Papists+are+pernicious+impostures.+VII.+Then%2C+finally%2C+the+stability+of+the+church+entirely+depends+upon+this%3A+if+it+constantly+adheres+to+this+rule.%E2%80%9D%0A%0A%E2%80%94+William+Ames%2C+From+ch.+1+of+Bellarminus+Enervatus%2C+tr.+Charles+Johnson&amp;url=https%3A%2F%2F5so

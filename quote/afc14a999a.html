<blockquote><p>It is asked further: But since through faith the righteousness of Christ belongs to him who has been effectually called, cannot one be at least denominated righteous according to that righteousness which belongs to him through faith? I would not, indeed, completely deny that one who has been effectually called is already righteous through faith. But I would not admit that he can be called and named righteous, because the Judge’s sentence—which sentence evidently arises from some further grace—has not yet been delivered and pronounced concerning him. For it is entirely of grace that God pronounces righteous those who are already (in accordance with effectual calling) righteous through faith, and imputes to them another’s righteousness as if it were their own.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Treatise on Justification’</cite>, trans. Aaron Clay Denlinger &amp; Noah Phillips MAJT 27 (d. 1599; 2016), p. 103</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-0c28f715af" data-kw="">
<blockquote><p>We deny that regenerating grace is infused into slothful men, but into souls subdued by God’s Word and law, and after a manner disposed by the foregoing actions; yet we say that even these forgoing actions have their first motions from God; and the question is whether God does not first work a sight and sense of sin and an humiliation for it by his exciting grace, before He comes with his regenerating, quickening and saving grace into the soul; we say He does in his ordinary course of his dispensations. (Only I must here be safely understood that I speak according to man’s apprehension; for in respect of God, nothing is first or last; He works all in an instant, all graces together in the soul; but the question lies not whether God works the habit of repentance before the habit of faith, or no; for without question He works together all his works; but whether God makes humiliation act before faith, which we say he does. Esau and Jacob may be in their mother’s womb together, but Esau may come out and be seen in the world before Jacob: yet not tying up the Almighty to this method, who can and will work any way, even which way it pleases Him:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Spouse’s Hidden Glory &amp; Faithful Leaning upon her Well-Beloved, wherein is laid down the soul’s glory in Christ and the way by which the soul comes to Christ, delivered in two lecture sermons</cite>, … (London: 1646), pp. 25-26</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>

</figure><figure class="quote" id="q-5103928f02" data-kw="">
<blockquote><p>…and first of repentance the continual and inseparable companion of faith. For albeit it be daily made more perfect after justification, yet because no man is justified without repentance, and the beginning thereof goes before justification, therefore we have purposed in this first place to declare what our belief is concerning the same. I. To Justification, and therefore to the communion with Christ, repentance is necessary. We believe that to the true participation of Christ’s righteousness, and so to the communion with Christ, repentance is very needful: whereby being turned from sin and from the world, by changing our minds and wills, we are turned to God and are joined unto Him, and so obtain forgiveness of our sins in Him and by Him, and be clothed with his righteousness and holiness. For the first thing that John Baptist, yea that Christ Himself preached, was repentance for the remission of sins. (Mk. 1:4, 15) ‘And, except’ (says Christ) ‘ye repent, ye shall all likewise perish.’ (Lk. 13:3, 5) … V. A sum of the doctrine of repentance, everywhere and always necessary to all of years of discretion. …repentance is a changing of the mind and heart, stirred up in us through the Holy Ghost, by the Word both of the Law and the gospel: wherein we grieve from our heart: we detest: we lament: we lothe and bewail: confess before God all our sins, and even the corruption of our nature, as things utterly repugnant (as the law teaches) to the will of God, and to the cleansing whereof, the death of God’s own Son (as the gospel preaches) was needful: and do humbly pray and entreat for pardon and forgiveness of the same: and do earnestly resolve upon amendment of our life, and on a continual study and care of innocency and Christian virtues, and exercise ourselves in the same diligently all the days of our life: to the glory of God and edification of the Church.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Confession of the Christian Religion</cite>, … (1586; Cambridge, 1599), ch. 18. ’Of Repentance’, pp. 142-45</span></figcaption>

</figure><figure class="quote" id="q-e84f18d301" data-kw="">
<blockquote><p>…Libertines, who deny that justification, the Covenant of Grace and salvation have any the most gracious conditions in us; for that should obscure the freedom of Grace (they say)… But I hope faith is a work of free grace, and must presuppose conversion and a new heart as an essential condition, else with Pelagians they must say that out of the principles of nature all are to believe; and this obscures far more the freedom of the grace of God working faith in us than all the conditions of grace, which we hold to be subservient, not contrary to the freedom of grace.</p></blockquote>

</figure><figure class="quote" id="q-81aaec752a" data-kw="">
<blockquote><p>If here it be demanded which of these we do first receive, I answere that the spirit, the virtues of the Spirit, the habitual justice which is engrafted, the external justice of Jesus Christ, which is imputed: these we receice all at one and the same time; whensoever we have any of these, we haue all; they goe together. Yet since no man is justified except he believe, and no man believes except he have faith, and no man except he have received the spirit of adoption, has faith, for asmuch as they do necessarily infer justification, and justification does of necessity presuppose them: we must needs hold that imputed righteousness, in dignity being the chiefest, is notwithstanding in order the last of all these: but actual righteousness, which is the righteousness of good works, succeeds all, follows after all, both in order and time. Which being attentively marked, shows plainly how the faith of true believers cannot be divorced from hope and love; how faith is a part of sanctification, and yet unto justification necessary; how faith is perfected by good works, and no work of ours without faith;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-hooker.html">Richard Hooker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Learned Discourse of Justification, Works &amp; how the Foundation of Faith is Overthrown</cite>, (d. 1600; Oxford: Barnes, 1612), pp. 26-27</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/repentance-and-conversion/repentance-and-faith.html">Repentance and Faith</a></span></div>
<div class="actions"><button class="copy" data-copy="“If here it be demanded which of these we do first receive, I answere that the spirit, the virtues of the Spirit, the habitual justice which is engrafted, the external justice of Jesus Christ, which is imputed: these we receice all at one and the same time; whensoever we have any of these, we haue all; they goe together. Yet since no man is justified except he believe, and no man believes except he have faith, and no man except he have received the spirit of adoption, has faith, for asmuch as they do necessarily infer justification, and justification does of necessity presuppose them: we must needs hold that imputed righteousness, in dignity being the chiefest, is notwithstanding in order the last of all these: but actual righteousness, which is the righteousness of good works, succeeds all, follows after all, both in order and time. Which being attentively marked, shows plainly how the faith of true believers cannot be divorced from hope and love; how faith is a part of sanctification, and yet unto justification necessary; how faith is perfected by good works, and no work of ours without faith;”

<blockquote><p>1. Whether the sacred is founded in a special ordination and by divine mandate? It is affirmed.

2. Whether under the New Testament some things are relatively sacred, such as church-buildings, times (except the weekly Sabbath), utensils, tables, cups, lamps, pulpits, furnishings, cloths, garments of ministers? It is denied.

3. Whether under the New Testament, is the preaching of the Word, the water of baptism and the bread and wine in the eucharist sacred? It is affirmed.

4. Whether whatever external particular the Church has instituted is sacred? It is affirmed. See the disputation on benedictions and sacramental things.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations</cite>, On the sacred 780, vol. 4 (Utrecht, 1667), ‘On the 2nd Commandment’</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>3. When Christ commands his disciples to bless them that curse them and persecute them, He gives not therein a rule to public officers, whether in Church or commonweal, to suffer notorious sinners, either in life or doctrine, to pass away with a blessing: But to private Christians to suffer persecution patiently, yea and to pray for their persecutors. Again, it is true, Christ would have his disciples to be far from persecuting (for that is a sinful oppression of men for righteousness sake) but that hinders not but that He would have them execute upon all disobedience the judgement and vengeance required in the Word, 2 Cor. 10:6; Rom. 13:4.

4. Though it be true that wicked persons now may by the grace of God become true disciples and converts, yet we may not do evil that good may come thereof: And evil it would be to tolerate notorious evil-doers, whether seducing teachers or scandalous livers. Christ had something against the angel of the Church of Pergamus for tolerating them that held the doctrine of Balaam, and against the Church of Thiatira for tolerating Jezabel to teach and seduce, Rev. 2:14, 20.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cotton.html">John Cotton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Answer of Mr. John Cotton of Boston in New-England, to the aforesaid Arguments Against Persecution for Cause of Conscience</cite>, …’ in Roger Williams, The Blovdy Tenent of Persecution for Cause of Conscience, Discussed in a Conference… (London, 1644), p. 10</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>And one thing is surely right in Kant’s argument, which is that the experience of beauty, like the judgement in which it issues, is the prerogative of rational beings. Only creatures like us—with language, self-consciousness, practical reason, and moral judgement—can look on the world in this alert and disinterested way, so as to seize on the presented object and take pleasure in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/roger-scruton.html">Roger Scruton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Beauty: a Very Short Introduction Pre</cite>, (Oxford University Press, 2011), pp. 27-28</span></figcaption>

</figure><figure class="quote" id="q-70b462bc5a" data-kw="">
<blockquote><p>Q. What if by the wrong a man does me, I observe such infirmity, yea and iniquity to be in him, as by experience I find him to be a far other man than at first I supposed him to be, ought I notwithstanding to make such account of him as I did before? A. We must put difference betwixt a wrong done upon such an occasion as may afterwards be avoided, and that which is done upon an evil disposition, which remaining in a man, may be a means to make him continue to do more and more wrongs. The wrong of the former must be so forgiven, as the wrong doer be so accepted as if he had done no wrong at all. As for the latter, we are to try if he may be brought to sight of his evil disposition, and to repentance for the same. If he be, then ought we to esteem him as if he never had done us any hurt. But if obstinately he persist in that evil disposition, and be like, on all occasions, again and again to wrong us, though we do, as we ought, fully forgive all the wrongs done, and neither take any present revenge, nor keep them in mind and memory for any future revenge, yet may we in our judgment esteem him to be such an one as we find him to be. (Woe to them that call evil good: that put light for darkness, and sweet for bitter.) For example, if I find one of whom I have had a very good account, and thereupon used him very familiarly, to have no command of his tongue, but on all occasions to be ready to blab out, and blaze abroad whatsoever he sees or hears, if therein he have wronged me, I may forbear to use him so familiarly as I did before, and take heed what secrets I communicate to him, though I fully forgive the wrong that is past. Or if I have accounted one to be an entire friend to me, but by experience find him to be hollow-hearted, and maliciously minded against me, I ought wisely and warily to avoid his society, and to take heed of the snares which he lays for me. (For which we have the pattern of David, and Christ) yet so to pass by the wrongs done as if none had been done.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-gouge.html">William Gouge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Guide to Go to God: or, an Explanation of the Perfect Pattern of Prayer, the Lord’s Prayer</cite>, (London, 1626), §148. ‘Of a full forgiving one another,’, pp. 186-87</span></figcaption>

to+be+an+entire+friend+to+me%2C+but+by+experience+find+him+to+be+hollow-hearted%2C+and+maliciously+minded+against+me%2C+I+ought+wisely+and+warily+to+avoid+his+society%2C+and+to+take+heed+of+the+snares+which+he+lays+for+me.+%28For+which+we+have+the+pattern+of+David%2C+and+Christ%29+yet+so+to+pass+by+the+wrongs+done+as+if+none+had+been+done.%E2%80%9D%0A%0A%E2%80%94+William+Gouge%2C+A+Guide+to+go+to+God%3A+or+an+Explanation+of+the+Perfect+Pattern+of+Prayer%2C+the+Lord%E2%80%99s+Prayer+%28London%2C+1626%29%2C+%C2%A7148.+%E2%80%98Of+a+full+forgiving+one+another%2C%E2%80%99%2C+pp.+186-87&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F70b462bc5a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/70b462bc5a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-forgiveness/#:~:text=Q.%20What%20if%20by%20the%20wrong,as%20if%20none%20had%20been%20done&amp;text=Q.%20What%20if%20by%20the%20wrong%20a%20man&amp;text=wrongs%20done%20as%20if%20none%20had%20been%20done" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

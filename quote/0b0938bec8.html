<main class="wrap"><figure class="quote" id="q-0b0938bec8" data-kw="">
<blockquote><p>I do not say this of all, I am confident there be divers in the Honourable Houses, many in the Church and Kingdom, who abhor from their souls the ways of heresy, superstition, schism, Popery, prophanenesse, treachery, wicked policy, which never did so much prevail in this land as since we did swear to endeavour the extirpation of all these, and that though this Covenant were buried, it must rise from the dead again, and that the Lord must make his Jerusalem in Britain a cup of trembling, a burdensome stone, a hearth of fire among the wood, a torch of fire in a sheaf, against all her enemies, both Babylon without, and Edom within, that no weapon formed against them shall prosper, that every tongue that rise against them in judgement shall be condemned, and that the Lord shall clear the judgements of his chosen ones that they shall not finally be seduced, and shall bring the blind by a way that they know not, and return to a people of a poor language that they may all call upon the name of the Lord, and serve him with one shoulder, and the Lord may be one, and his name one, and his going forth, in the three Kingdoms, may be as the morning. O that the Lord who hath founded Zion, and hath chosen Jerusalem would do this in his time.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A brotherly and free epistle to the patrons and friends of pretended Liberty of Conscience in A survey of the spiritual antichrist</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society.html">Civil Government and Society</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-6f100d0a3b" data-kw="">
<blockquote><p>2. Calvin thinks their vow not lawful. Bucanus, Polyander and Willet think it the lawful vow of the Nazarites, commanded [in] Num. 6. What then? if by God’s Law of the Nazarites, they abstained from wine and the Passover? God is above his own Law… 3. How prove ye, they abstained from the Passover? being so divine a law, might not their vow suffer an exception for a greater law in eating the Passover? I think it might, for in case of necessity they [the Rechabites] came and dwelt at Jerusalem for fear of the army of the Chaldeans, Jer. 35:11, and yet their vow was to dwell in tents.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, … (London, 1644), pt. 2, ch. 4, section 5, p. 203</span></figcaption>

</figure><figure class="quote" id="q-723c1b85f2" data-kw="">
<blockquote><p>Ye would know that the law here intended is the moral law of the ten commandments, at first engraven upon the hearts of our first parents at their creation, and afterwards, because that edition or copy of it was much obliterated and defaced by the fall, published to Israel from the mouth of God upon Mount Sinai, and written upon tables of stone, and laid up in the ark for the use of Israel. This, I say, is the law here intended. The ceremonial and judicial laws were things peculiar unto the Jews, or commonwealth of Israel; but the moral law had a being so soon as man was created, and is binding upon all nations.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The broken law magnified and made honourable (first sermon) in The Whole Works of Ebenezer Erskine</cite></span></figcaption>

<blockquote><p>In case of undue exclusion from Church Ordinances, of such as Christ would not have excluded. Our Lord Jesus hath foretold, that the power of the keys should fall (sometimes) into such hands, as would so diametrically pervert the use of them, as that oft-times none should be excluded, but whom Christ would have admitted; nor admitted, but such as Christ would have shut out.

They shall put You out of their Synagogues, i. e. Excommunicate you: You, my Disciples; you, my Friends. Hard measure! I, but here is comfort; the time is coming, wherein all the Elect shall be Congregated into one universal Assembly, never to suffer exclusion or ejectment any more to all Eternity. And then their unrighteous Excommunicators shall be righteously Excommunicated.

Yea they shall be Excommunicated with the highest sort of Excommunication, (higher than any Church of Christ ever used) Excommunicated for ever; delivered unto Satan, not for the destruction of the flesh only, but to be punished with everlasting destruction from the presence of the Lord, and from the glory of his Power; (when he shall come to be glorified in his Saints): That’s a dreadful Excommunication indeed; the Anathema Maranatha in the highest sense: quum Dominus venit: quia Do∣mino quasi in manus citra veniae spem dedentur.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-case.html">Thomas Case</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Mount Pisgah, or, A prospect of heaven being an exposition on the fourth chapter of the first epistle of St. Paul to the Thessalonians, from the 13th verse, to the end of the chapter, divided into three parts</cite>, (London: Dorman Newman, 1670), pp 117-18.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44f3e13535" data-kw="">
<blockquote><p>3. But ordinarily no man ought to be excommunicate[d] for any sin whatsoever, unless impenitence be added to the sin. Because he is first to be admonished to repent, Mt. 18:15-16; Tit. 3:10; and repentance is the Gospel condition of pardon to believers.

4. A man is not to be excommunicated for every sin which he repents not of, because:

1. Else all men should be excommunicated. For there are in all men some errors about sin and duty, and so some sins which men cannot yet perceive to be sins.

2. And ministers are not infallible, and may take that for a sin which is no sin, and so should excommunicate the innocent.

3. And daily unavoidable infirmities, though repented of, yet awaken not the soul sometimes to a notable contrition; nor are they fit matter for the Church’s admonition. A man is not to be called openly to repentance before the Church for every idle word, or hour.

5. Therefore, to excommunication these two must concur:

1. A heinousness in the sin;

2. Impenitence after due admonition and patience.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, Part 3, Question 94, ‘For what sins may a man be denied communion or [be] excommunicated? Whether for impenitence in every little sin? Or for great sin without impenitence?’ in A Christian Directory: a Sum of Practical Theology and Cases of Conscience (1673)</span></figcaption>

f3e13535.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-excommunication/#:~:text=3.%20But%20ordinarily%20no%20man%20ought,Impenitence%20after%20due%20admonition%20and%20patience&amp;text=3.%20But%20ordinarily%20no%20man%20ought%20to%20be&amp;text=sin%3B%202.%20Impenitence%20after%20due%20admonition%20and%20patience" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-10e7eb0cf1" data-kw="">
<blockquote><p>It is uncharitable, and against the Word, to teach that when a church is dissolved, by no sin and scandal-visible, but by persecution or pestilence, that the dissolved members, though both real and visible converts, have no right to the ordinances: for if the formal cause, to wit, their confederacy into one visible body, as Mr. [Thomas] Hooker [a congregationalist] says, be removed, their visible and external right is removed. The like is to be said of visible professors, and of members of another congregation, and known godly sojourners [travelers]; these Mr. Hooker [by implication] excommunicates for no scandal, visible and invisible: for impossible it is that they can meet together in one place with their own church…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, … (London, 1658), bk. 1 | ch. 19, ‘Mr. [Thomas] Hooker [a congregationalist], his formal cause of a Church visible, or Church confederating, is considered’, pp. 96-104, p. 96</span></figcaption>

<blockquote><p>Auxilius, a fresh young Bishop, having excommunicated a person of good account with his whole family for infringing the liberties of his Church, as he supposed, saint Augustine treats with him by letters to know what ground he had out of the Scriptures to excommunicate the son for the father’s, the wife for the husband’s, the servants for their master’s offense; and amongst others uses these words (Augustine Epistle 75): ‘Lo, I am ready to learn, an old man of a young, a bishop of so long continuance, from my colleague, not yet a year’s standing: what good reason we may yield to God or to men, if for another man’s sin we endanger innocent souls with a spiritual punishment. If you can give a reason for it, vouchsafe by writing to acquaint me with it, that I may be able likewise; if you cannot, what is it for you to do (such a thing) upon an unadvised motion of the mind, whereof being asked, you are not able to yield a just reason? Neither think that uniust anger cannot overtake us, because we are bishops; but let us rather remember we live dangerously amidst the snares of temptations, because we are men.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-bilson.html">Thomas Bilson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Perpetual Government of Christ’s Church</cite>, (London, 1593), ch. 9, p. 121</span></figcaption>

<blockquote><p>Let men and devils curse the bride of Christ, he will bless her. Let her be excommunicate, or cast out of the Church unto the devil’s common, Christ will not affirm, but make void such sentences. In the ninth chapter of John, we read of a poor man born blind, whose eyes Christ had opened upon the Sabbath day, by making a little clay, and putting it upon his eyes. The Jewish Sanhedrin met; and under a very religious pretence of zeal for the Sabbath day, they convene the man before them, who professed Christ, in as far as he knew him; and thereupon they excommunicate him, and cast him out of the church, and held him as a Heathen man and a Publican.

Well, was this sentence bound in heaven? No; so far from that, that ver. 35. when Christ heard they had cast him out (or excommunicated him, as in the margin), Christ seeks him out, and finds him, and manifests himself the more to him, as you may see, ver. 35 — 38.: and, in the 39th verse, he passes a heavy doom and sentence upon them that had cast him out: “For judgement I am come into this world, that they who see not might see, and that they who see (or imagine that they are the only men that see things, or know them in a better light), might be made blind.” Thus Christ will take up and defend his bride, to the confusion of them that do her hurt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ebenezer-erskine.html">Ebenezer Erskine</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The wise virgins going forth to meet the bridegroom in The Whole Works of Ebenezer Erskine</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/church-discipline/excommunication.html">Excommunication</a></span></div>
<div class="actions"><button class="copy" data-copy="“Let men and devils curse the bride of Christ, he will bless her. Let her be excommunicate, or cast out of the Church unto the devil’s common, Christ will not affirm, but make void such sentences. In the ninth chapter of John, we read of a poor man born blind, whose eyes Christ had opened upon the Sabbath day, by making a little clay, and putting it upon his eyes. The Jewish Sanhedrin met; and under a very religious pretence of zeal for the Sabbath day, they convene the man before them, who professed Christ, in as far as he knew him; and thereupon they excommunicate him, and cast him out of the church, and held him as a Heathen man and a Publican.

Well, was this sentence bound in heaven? No; so far from that, that ver. 35. when Christ heard they had cast him out (or excommunicated him, as in the margin), Christ seeks him out, and finds him, and manifests himself the more to him, as you may see, ver. 35 — 38.: and, in the 39th verse, he passes a heavy doom and sentence upon them that had cast him out: “For judgement I am come into this world, that they who see not might see, and that they who see (or imagine that they are the only men that see things, or know them in a better light), might be made blind.” Thus Christ will take up and defend his bride, to the confusion of them that do her hurt.”

— Ebenezer Erskine, The wise virgins going forth to meet the bridegroom in The Whole Works of Ebenezer Erskine">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CLet+men+and+devils+curse+the+bride+of+Christ%2C+he+will+bless+her.+Let+her+be+excommunicate%2C+or+cast+out+of+the+Church+unto+the+devil%E2%80%99s+common%2C+Christ+will+not+affirm%2C+but+make+void+such+sentences.+In+the+ninth+chapter+of+John%2C+we+read+of+a+poor+man+born+blind%2C+whose+eyes+Christ+had+opened+upon+the+Sabbath+day%2C+by+making+a+little+clay%2C+and+putting+it+upon+his+eyes.+The+Jewish+Sanhedrin+met%3B+and+under+a+very+religious+pretence+of+zeal+for+the+Sabbath+day%2C+they+convene+the+man+before+them%2C+who+professed+Christ%2C+in+as+far+as+he+knew+him%3B+and+thereupon+they+excommunicate+him%2C+and+cast+him+out+of+the+church%2C+and+held+him+as+a+Heathen+man+and+a+Publican.%0A%0AWell%2C+was+this+sentence+bound+in+heaven%3F+No%3B+so+far+from+that%2C+that+ver.+35.+when+Christ+heard+they+had+cast+him+out+%28or+excommunicated+him%2C+as+in+the+margin%29%2C+Christ+seeks+him+out%2C+and+finds+him%2C+and+manifests+himself+the+more+to+him%2C+as+you+may+see%2C+ver.+35+%E2%80%94+38.%3A+and%2C+in+the+39th+verse%2C+he+passes+a+heavy+doom+and+sentence+upon+them+that+had+cast+him+out%3A+%E2%80%9CFor+judgement+I+am+come+into+this+world%2C+that+they+who+see+not+might+see%2C+and+that+they+who+see+%28or+imagine+that+they+are+the+only+men+that+see+things%2C+or+know+them+in+a+better+light%29%2C+might+be+made+blind.%E2%80%9D+Thus+Christ+will+take+up+and+defend+his+bride%2C+to+the+confusion+of+them+that+do+her+hurt.%E2%80%9D%0A%0A%E2%80%94+Ebenezer+Erskine%2C+The+wise+virgins+going+forth+to+meet+the+bridegroom+in+The+Whole+Works+of+Ebenezer+Erskine&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F212037016b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/212037016b.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress

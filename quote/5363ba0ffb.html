<main class="wrap"><figure class="quote" id="q-5363ba0ffb" data-kw="">
<blockquote><p>[1] If you interpret it of his divine love, the difficulty will not be great; for there is a general and common love, and a special love. With the first, God loves all his creatures, especially mankind, and amongst them those that have any strictures of his image in them more than others. But then there is a special love, and so all those are saved whom God thus loves…. Now this will easily solve the matter; there was a general love, or a liking and approbation of those moral virtues and good things which He saw in him [the rich young ruler], but not that special love which brings grace and salvation along with it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-manton.html">Thomas Manton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol. 16, p. 457 on Mk. 10:21-23, “Then Jesus beholding him loved him, and said unto him… And he was sad at that saying, and went away grieved.”</span></figcaption>

<blockquote><p>8. The application [of redemption] plainly has the same latitude as redemption itself, i.e., redemption applies to all those and only to those for whom it was obtained by the intention of Christ and the Father. Yet because of them the same temporal benefits of Christ overflow also to others. 9. As for the intention of application, it is rightly said that Christ made satisfaction only for those whom He saved, though in regard to the sufficiency in the mediation of Christ it may also rightly be said that Christ made satisfaction for each and all. Because these counsels of God are hidden to us, it is the part of charity to judge well of every one, although we may not say of all collectively that Christ equally pleads the cause of each before God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-ames.html">William Ames</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Marrow of Theology 3rd</cite>, tr. John D. Eusden (1623; Baker, 1997), bk. 1, ch. 24, ‘The Application of Christ’, p. 150</span></figcaption>

</figure><figure class="quote" id="q-2815a9cbdd" data-kw="">
<blockquote><p>Had not Christ interposed to satisfy the justice of God, man upon his sin had been actually bound over to punishment, as well as the fallen angels were upon theirs, and been fettered in chains as strong as those spirits feel. The reason why man was not hurled into the same deplorable condition upon his sin, as they were, is Christ’s promise of taking our nature, and not theirs. Had God designed Christ’s taking their nature, the same patience had been exercised towards them, and the same offers would have been made to them, as are made to us. In regard of the fruits of his patience, Christ is said to buy the wickedest apostates from him: 2 Peter 2:1, ‘Denying the Lord that bought them;’ such were bought by Him as ‘bring upon themselves just destruction, and whose damnation slumbers not,’ ver. 3; He purchased the continuance of their lives, and the stay of their execution, that offers of grace might be made to them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-charnock.html">Stephen Charnock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“On God’s Patience” in The Existence &amp; Attributes of God</cite>, (1682; Grand Rapids: Baker, 1996), 2:482</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

Books Online</a></div>
</figure><figure class="quote" id="q-bcce423899" data-kw="">
<blockquote><p>As we see from the Westminster Confession and the 1689 Baptist Confession the Puritans believed in the doctrines of grace such as election and particular redemption (Rom 8:28-30). They followed Calvin in resisting false human rationalisations. For instance they resisted the idea that God only loves the elect and hates the non-elect. This error is called hyper-Calvinism. It is a very serious error which is recurring today. The Puritans were experts in their understanding of the concept of common grace although they did not use that term.¹ Their teaching accords fully with the way in which the doctrine of Common Grace is expounded by Prof John Murray (cf Works). They believed that the Holy Spirit is constantly active in restraining evil and promoting good throughout society. The Puritans believed in the universal love of God for all mankind (1 Tim 2:1-6; 2 Peter 3:9). They believed in the universal provision of God for all mankind according to the covenant made with Noah as representative of the whole world (Gen 8:20-22 and Ps 145). ¹ [Webmaster’s note: This particular claim is not true. Following Calvin’s use of the term ‘general grace’, the puritans did use the term ‘common grace’, as is affirmed by Dr. Richard Muller below on p. 130, and as is instanced by James Durham (who has a whole section on ‘common grace’ in his Revelation commentary), Stephen Charnock (below), and John Bunyan (below).]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/erroll-hulse.html">Erroll Hulse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Example of the English Puritans”</cite>, (Reformation Today 153, Sept/Oct 1996)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/effectual-calling/common-grace.html">Common Grace</a></span></div>

</figure><figure class="quote" id="q-4f42522e02" data-kw="">
<blockquote><p>Now the book of life in this place must not be so strictly taken as if it included those only that were elect of God to eternal life, but must be understood of that book wherein are recorded the rules and bounds of visible church-communion; and so all those that, through the gifts and operations of special or common grace, do fall within the compass of those rules and bounds. Thus it was in the type at the return out of captivity, none were to be admitted entrance into the church but those that could show their privileges by genealogy and the records of the church; and to others it was said that they had neither portion, nor lot, nor memorial, in Jerusalem (Ezr. 2:62,63; Neh. 7:64,65; 2:20).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bunyan.html">John Bunyan</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Works</cite>, vol., 3:449</span></figcaption>

<blockquote><p>Indeed the Lord by a special institution given to Adam, Gen. 2. 1. had for the times before Christ appointed that they should reckon from the creation, which was the cause of that special institution; but this is no part of the Commandment; and in that institution God did two things:

1. He appointed the period from whence the seventh [day] should be accounted, which else Adam according to the Law infused into him would have taken otherwise, for those ten were written in Adam’s heart, as is signified by the writing them in Tables of Stone, and calling them the Tables of the Covenant, for God did not make one Covenant with Israel another with Adam but one and the same with both. Indeed the Covenant made with Israel was put in the Ark, to shew Christ to be the end of the Law, but yet it was the same Covenant for matter, and so all the parts of it were written in Adam’s heart.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A system or body of divinity consisting of ten books: wherein the fundamentals and main grounds of religion are opened, the contrary errors refuted, most of the controversies between us, the papists, Arminians, and Socinians discussed and handled, several Scriptures explained and vindicated from cor</cite>, (London: William Lee, 1654), IX.V, p. 814.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8f11c9c572" data-kw="">
<blockquote><p>The Reformed assert that there absolutely is a covenant of works, because: (1) it is expressly mentioned in Hosea 6:7, וְהֵמָּה כְּאָדָם עָבְרוּ בְרִית שָׁם בָּגְדוּ בִי, “And they, like Adam, have transgressed the covenant; there they have dealt faithlessly with me” (cf. Job 31:33). There the best translators—the Vulgate, the Zurich Bible, Pagnino, Castellio, the Dutch translators, and others—render כאדם not appellatively, but properly, although, I confess, there are not lacking those who prefer to render it appellatively.

(2) The apostle in Galatians mentions two covenants (4:24), the first of which is from the works of the law (2:16), demanding the most exact obedience (3:10), by aid of which no one has ever achieved life (2:16; 3:11), under which we all were, until the covenant of faith (3:23), and are, as long as we exist as children of the flesh (3:22, 29), a covenant which only produces slavery (3:24 with Heb. 2:14–15). And this is the very covenant that we call the covenant of works; the latter covenant is from the faith of the gospel. If you should say that the apostle is not speaking about the covenant in paradise, but about the covenant at Sinai, it may easily be responded that the apostle is speaking about the covenant in paradise insofar as it has been repeated and renewed at Sinai with Israel in the Decalogue, which had the content of the covenant of works.

(3) Synonyms for the covenant of works are evident in the New Testament (Rom. 3:27 and Gal. 2:16). Moreover, what is the “law of works” if not the covenant of works? What is “law” simply speaking, insofar as it is opposed to grace? (Rom. 8:3) What, I say, if not a legal covenant? For we are said to be not under law, but under grace (Rom. 6:14–15; 4:16), and what is this, if not that we are not under a legal covenant? At the least these are to us entirely synonymous.

(4) We have already demonstrated in the exegetical part that all the essentials of the covenant of works are contained in its first promulgation (Gen. 2:17).

(5) We can hardly secure very many heads of the Christian religion sufficiently—such as the propagation of original corruption, the satisfaction of Christ, and his subjection to the divine law (Rom. 8:3–4; Gal. 3:13; 4:4–5)—when the covenant of works is denied.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/petrus-van-mastricht.html">Petrus van Mastricht</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theoretical-Practical Theology. Volume 3: The Works of God and the Fall of Man</cite>, trans. Todd M. Rester, eds Joel R. Beeke and Michael T. Spangler (1682; Grand Rapids MI: Reformation Heritage Books, 2021), Book 3.12.23 (emphasis added).</span></figcaption>

<blockquote><p>XLVIII. Secondly, we more especially remark, that when the law was given from Mount Sinai or Horeb there was a repetition of the covenant of works. For those tremendous signs of thunders and lightnings, of an earthquake, a thick smoke and black darkness, were adapted to strike Israel with great terror. And the setting bounds and limits round about the mount, whereby the Israelites were kept at a distance from the presence of God, upbraided them with that separation which sin had made between God and them. “In a word, whatever we read, Exod. 19 (says Calvin, on Heb. 12:19) is intended to inform the people, that God then ascended his tribunal, and manifested himself as an impartial Judge. If an innocent animal happened to approach, he commanded it to be thrust through with a dart; how much sorer punishment were sinners liable to, who were conscious of their sins, nay, and knew themselves indicted by the law, as guilty of eternal death.” See the same author on Exod. 19:1, 16. And the apostle in this matter, Heb. 12:18–22, sets Mount Sinai in opposition to Mount Sion, the terrors of the law to the sweetness of the gospel.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-witsius.html">Herman Witsius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Economy of the Covenants between God and Man</cite>, (4.4.48), trans. William Crookshank, vol. 2 (London: T. Tegg &amp; Son, 1837), 188.</span></figcaption>

<blockquote><p>While Augustine of Hippo did not use the exact phrase “covenant of works” in the below extract, he clearly believed in the substance of the doctrine. It is interesting that he makes the below statement in his polemics with the Pelagians, which gives the lie to the Shepherdite/Federal Visionist slander that the doctrine is Pelagian:

If Adam by his great sin condemned all the human race in common, can an infant be born otherwise than condemned? And through whom except Christ is he freed from this condemnation? And if even in Lazarus he says that mortality, cast out from eternity, loved the world of the dead, who of mortals is not touched by this fault and mischance by which the first man fell from everlasting life, which he would have received if he had not sinned? If the Devil made mortal all who could have been immortal, why do even infants die if they are not subject to the sin of the first man? And even infants be saved from the power of death except through Him in whom all shall be made to live?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/augustine-of-hippo.html">Augustine of Hippo</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Against Julian</cite>, (c. 420), 1.6.24 in The Fathers of the Church: A New Translation, 35: 28-29.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-works.html">The Covenant of Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“While Augustine of Hippo did not use the exact phrase “covenant of works” in the below extract, he clearly believed in the substance of the doctrine. It is interesting that he makes the below statement in his polemics with the Pelagians, which gives the lie to the Shepherdite/Federal Visionist slander that the doctrine is Pelagian:

If Adam by his great sin condemned all the human race in common, can an infant be born otherwise than condemned? And through whom except Christ is he freed from this condemnation? And if even in Lazarus he says that mortality, cast out from eternity, loved the world of the dead, who of mortals is not touched by this fault and mischance by which the first man fell from everlasting life, which he would have received if he had not sinned? If the Devil made mortal all who could have been immortal, why do even infants die if they are not subject to the sin of the first man? And even infants be saved from the power of death except through Him in whom all shall be made to live?”

<blockquote><p>18. Q: Was this covenant of works renewed afterwards [after the Fall]?

A: It was continually renewed right from the creation and fall of man up until the advent of Christ: first, it was delivered by word of mouth; then, it was engraved by God’s own finger upon the tables of stone; afterwards, it was delivered and written by Moses; finally, it was repeated and written by the prophets, each in his own place and order, and so it is known [to us] from the Old Testament.

19. Q: In what manner and order was it renewed?

A: You have the order in Exodus 19 and 20. First, God says through Moses, “If you will observe my covenant (that is, my law), certainly you will be my own peculiar possession.” Then, the people said together, “Whatever Jehovah says we will do.” When Moses had reported the people’s counter obligation (restipulatione) to God, God promulgated his law — that is, the principal divisions of his covenant, which should be observed by the people — from Mount Sinai.

20. Q: But have you not just said that the law comes first, and the covenant follows after?

A: It is the same whether the words of the covenant (which words comprise the obligation and counter-obligation) precede the law — that is, the statement of the principal divisions of that condition which belongs to God’s covenant — or follow after it.

21. Q: To what end was the covenant of works renewed, after the fall of man, with the ancient Church and people, since, after the fall, the condition of good works proceeding from nature was impossible to man (Rom. 8:3)?

A: It was not repeated chiefly with the end that men should, by means of it, be justified and live, but to the end that men, convicted in their consciences and overwhelmed by that impossible condition of good works proceeding from nature, might flee to the covenant of grace (Deut. 10:16; Rom. 3:19; 7:7ff).

22. Q: So you mean that the covenant of works was renewed with the ancient people chiefly with the end that they should be prepared for the covenant of grace?

A: I do.

23. Q: But not all were prepared, neither did all flee to the covenant of grace?

A: True. But the elect were prepared. The reprobate, indeed, were reduced at length to desperation (Rom. 11:7).</p></blockquote>

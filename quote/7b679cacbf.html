<blockquote><p>The people of God doth very often swear under their kings, in making a covenant with God for the keeping of true religion.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Fifty godly and learned sermons divided into the five decades containing the chief and principal points of Christian religion</cite>, ed. Thomas Harding (1849-52 Parker edn; 4 vols, Grand Rapids, 2004), i, 246</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-8a06baff06" data-kw="">
<blockquote><p>Thirdly, it is cleared in this discourse that those who have gotten to be powers (though by force) yet ought to give justice to those whose government they have undertaken. And again, that the people may lawfully demand it. But is it possible that one or a few persons in supreme power can distribute justice to a whole nation without subordinate agents? So that to say, ‘None may lawfully act under the supreme power in distributing of justice, and government,’ were to say upon the matter that he should give no justice, and that the people should have no justice at all. And then how absurd is it to teach that the people may lawfully seek justice of him which they cannot receive? and that he is bound to give justice, but none are allowed by whom he may give it? Fourthly, this doctrine of not acting is the very doctrine of levelling. For when no man may act to give justice, may not every man take freely from his neighbor what he list, and so level the rich with the poor? unless this make it unlikely, because worse than levelling, that those who have most force will have most; yea some all, and others nothing; and so to avoid acting under a supposed tyrannical government unto justice and order; there shall be tyrants in every place or parish, who shall act to disorder and oppression, and no property, justice, nor government at all left amongst us. And surely I think David out of his love to Israel would not have wished such an estate to Israel under Absalom, had he the whole in possession and himself no force on foot to recover it; nor would he have desired such an unsettlement to procure his settlement. And hence arises that which they call an interpretative consent of the people; because it is understood and supposed that every rational man does consent, that there should be order, property and right given to every member of a commonwealth under a tyrant, rather than all to be under confusion oppression, robberies and murders. Fifthly, how could Ezra and Nehemiah justify their acting under the Persian monarch, who had no right to the crown of Judah either by blood or just conquest (Ezra 7:25)? Yet Ezra was authorized by him to set magistrates, fine and imprison and put to death (Ezra 10:7-8); And he exercises authority, in making the people of Israel to swear and to enter into a covenant, and in sending forth a proclamation to all the children of the captivity, that they should gather themselves together to Jerusalem; And that whosoever would not come within three days, all his substance should be forfeited. Nehemiah also acts as governor, and rebukes the nobles and rulers and sets a great assembly against them because of their usury. He also called the priests and took an oath to perform the promise of leaving that usury (Neh. 5. •. etc.). He acknowledges also that he was governor there about twelve years, and he gave his brother Hanani and Hanaiah ruler of the palace charge over Jerusalem (Neh. 7:2). So he did both act himself and others acted under him. We find also that at that time there were rulers of the people that dwelt at Jerusalem, and Nehemiah contended with the rulers and nobles, made treasurers, commanded the gates to be shut before the Sabbath, threatened to lay hands on the merchants that lay at the gates, smote certain of the Jews and plucked off their hair because having married wives of Ashdod, their children spake half in the language of Ashdod (Neh. 13). Sixthly, let us hear what before these times and before our case was in being hath been taught in point of acting; and upon what grounds it has been approved. An author eminently learned and skillful in the doctrine of lawgiving says thus: ‘No man may punish or condemn another even with a just punishment, except he have public power, which a tyrant cannot give. But in this there must be a consideration or subdistinction. For in rigor this is true as to the tyrant’s part; yet it so happens that the commonwealth because it cannot resist him, does tolerate him, and suffers itself to be governed by him; and does tacitly consent, and will that justice be administered by him, for the reason already touched, because it is a less evil to be governed by him, than altogether to want just coaction and direction; and then it shall not be a sin to obey even in the things aforesaid, because the consent of the commonwealth does supply the defect of the tyrant’s power.’ (Suarez, De Leg., bk. 3, ch. 10) Another thus: ‘That his sentences are valid, is proved. Because his sentences, and just commands although they have not force from a tyrannical power, yet they have it from elsewhere. First, and inchoatively from the law of nature, which such a state of things being supposed, does dictate that obedience must be given for the common good, otherwise all will be full of thefts and robberies. Secondly, and completely from the commonwealth; and that either because while that state endures, it gives authority to him by a tacit consent, while it will’s that he administer justice, and use his usurped office in a due manner, or rather because it does tacitly approve his commands, and acts being agreeable to the laws and common good, and will’s that his just sentences, whereby the suites of the people are decided, and the guilty are punished, shall be valid and bind the subjects; for except they were valid and did bind, no man would obey, but only in show but every man would secretly do the contrary with a great inconvenience to the commonwealth. Now the commonwealth may give this force to the sentences, and acts of a tyrant, because it is superior to all single persons, though it be oppressed with tyranny, and may account the just sentence of a tyrant as its own.’ (Lessius, De Justitia &amp; Jure, bk. 2, ch. 25, Dubitat. 9) Thou wilt ask whether a tyrant do sin the sin of murder, and be bound to restitution, if he put to death guilty persons, or deprive them of their goods according to law? I answer negatively; because the commonwealth does tacitly give him authority hereunto, while it does consent and desire that this should be done by him. Thus is the authority of acting in this case grounded upon a tacit or implied consent, which consent is the very dictate of nature or common reason, because it is better to have some justice than none at all, some coercive power and government than that all be left to disorder, violence and confusion.</p></blockquote>

<blockquote><p>It may be asked, how came these obnoxious and oppressive laws [concerning mandatory vaccination] to be placed upon our statute books? Did the people desire them or ask for them? No! Never. Without the knowledge or consent of the public these laws were clandestinely smuggled through indifferent, ignorant and incompetent Legislatures at the instance of a fraction of mercenary “lymph” manufacturers and politician-doctors, i. e., medicine-men who combine politics with physic in their business, men who have a stake in vaccination and are pecuniarily and professionally interested in the dissemination of disease among the people, men who regard the acquisition of the almighty “plunker” as of paramount importance to all considerations for the public health.

This language may sound harsh, but it is not too harsh to be literally true. Through the persistence of these medical factions and their accomplices (the “lymph” purveyors), these odious laws were lobbied through our various Legislatures without the knowledge or consent of the public. The members of politico-medical factions at whose instigation and for whose special benefit and pecuniary advantage these monopolitic laws were passed have the shield of the State thrown over them while they brazenly pose as benefactors of mankind.

These assassins of the public health have the assurance to ask the people to believe that these disease-prescribing laws were framed and passed in the interest of the public health. The pretext that these statutes were enacted in the interest of the public health is a hypocritical pretense. While that was the ostensible purpose of the law, they were actually passed for the selfish interest of and at the persistent solicitation of the venal clique of fee-hungry medical politicians and mercenary “lymph” manufacturers, who live and thrive at the expense of the public health.

Like many other pernicious practices which infest society, this State-supported practice has its pecuniary incentives. That the money-value is the principal motive which actuates many doctors in their advocacy of this ruinous practice cannot be doubted by any observer who has given the subject serious attention. Pecuniary interest, professional pride, reluctance to admit professional error are just as likely to lead astray members of the medical profession as those of any other business or profession by which men gain a livelihood.

If it were possible to eliminate the commercial feature from the vaccination enterprise, the solicitude of the vaccinating doctors and the “lymph” manufacturers for the welfare of “the dear people” would soon be found drooping. We all know how prone human nature is in this age of ultra-commercialism to nurse and cherish opinions so long as they favour our self-interest. Doctors are no exception to the general rule in this respect. They are human beings, no better and no worse than the members of other professions. Were it not that their pecuniary interests and professional credit are so intimately interwoven with the Jennerian delusion, they would gladly abandon the dreadful practice.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-w-hodge.html">J. W. Hodge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Practice of Medicine. State-Inflicted Disease in our Public Schools in Medical Century</cite></span></figcaption>

<blockquote><p>Whether they are sure that these superstitions of theirs may not run the round as other superstitions have done before them?… What if the next age should turn them into a dead formality? And what if the next age after that should make laws to enforce them? And then godly people first scruple them, and then fly from them as discerned superstition? And then the worst men be glad of that advantage to persecute those that would not submit to them? By this circulation, if the same men who invented… new and needless Church covenants, etc. could but live two or 300 years, they might come to be among the number of those who cry out of them as superstitious, and suffer persecution because they will not use them.</p></blockquote>

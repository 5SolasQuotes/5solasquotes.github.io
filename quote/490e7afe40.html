<main class="wrap"><figure class="quote" id="q-490e7afe40" data-kw="">
<blockquote><p>The eyes are witnesses that the heavens revolve in the space of twenty-four hours. But certain men, either from the love of novelty, or to make a display of ingenuity, have concluded that the earth moves; and they maintain that neither the [stars] nor the sun revolves… Now, it is a want of honesty and decency to assert such notions publicly, and the example is pernicious. It is the part of a good mind to accept the truth as revealed by God and to acquiesce in it.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/philip-melanchthon.html">Philip Melanchthon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>As quoted here.</cite></span></figcaption>

</figure><figure class="quote" id="q-c37d0825be" data-kw="">
<blockquote><p>§ 5. I have moreover insisted on the different apprehensions the old philosophers entertain concerning those insuperable difficulties that are about predetermination, etc. thereby to intimate that the confident [Medieval] schoolmen and their several sectators do but actum agere, and consume their strength on needless controversies, to the great disadvantage of true religion. These acting in divinity, as our virtuosi do in philosophy, who, by a zealous attempt to establish their new dogmata [dogmas] (as they call them) do not walk in any untrodden paths; The Copernican Hypothesis about the motion of the earth, as also the learned fancies about the earth, and inhabitants that are said to be in the moon, as well as that solid truth about the Antipodes, so much reproached by Lactantius [early Church father, c. 250 – c. 325, in The Divine Institutes, Bk. 3, ch. 24 in ANF 7.94-95], were all known in Cicero‘s, if not in Plato‘s, or Pythagoras‘s days. For this, consult Cicero, Quaest. Acad. l. 2: ‘Habitari ait Xenophanes in Luna, eamque esse terram multarum urbium, &amp; montium. Portenta videntur: sed tamen neque ille qui dixit jurare posset ita se rem habere, neque ego. Nonne etiam dicitis, esse è regione nobis, è contraria parte terrae, qui adversis vestigiis stent contra vestigia nostra, quos Antipodas vocatis? Cur mihi magis succensetis, qui ista non aspernor, quam eis, qui quum audiunt, desipere vos arbitrantur? Nicetas Syracusius, ut ait Theophrastus, Coelum, Solem, Lunam, Stellas, supera denique omnia stare censet, neque praeter terram rem ullam in mundo moveri: quae cùm circum axem se summa celeritate convertat, &amp; torqueat, eâdem effici omnia, quae si stante terra, Coelum moveretur. Atque hoc etiam Platonem in Timaeo dicere quidam arbitrantur, sed paulò obscuriùs.’ Thus both our New Philosophers, and the Old Schoolmen, do but trace the ancient heathen in their particular fancies, concerning things not only unrevealed, but moreover, too high for vain mortals to reach unto. The New Philosophers confidently solve, as they say, the insolvable phaenomena in the natural world… for the Schoolmen are as vain, and consequently as liable unto just rebukes, as are the New Philosophers; Do the New Philosophers revive the old dogmata of the heathen? so do the schoolmen: Do the New Philosophers disturb the world with their learned folly? so do the schoolmen. And must the New Philosopher be severely checked for his presumption in philosophy? then surely, much more so must the schoolman…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/stephen-lobb.html">Stephen Lobb</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Glory of Free Grace Displayed… (London, 1680), pp. x-xi. Lobb (c. 1647–1699) was an English, calvinistic, indpendent minister. He was prominent in the 1680’s as a court representative of the Independents to James II, and in the 1690s in polemics between the Presbyterian and Independent groups of nonconformists. His church in London is supposed to be the successor to the congregation of Thomas Goodwin.</cite></span></figcaption>

n-geocentricism-heliocentrism/#:~:text=5.%20I%20have%20moreover%20insisted,much%20more%20so%20must%20the%20schoolman&amp;text=5.%20I%20have%20moreover%20insisted%20on%20the&amp;text=then%20surely%2C%20much%20more%20so%20must%20the%20schoolman" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>4. Newness of being is essential to it [created being], or of its notion… 5. As also assiduous dependence on the First Being and containment or inexistence in it. But its being in God is threefold: eminent, ideal, intelligible. In that way it is in his power as in an efficient cause, conserving and governing: in that [ideal way] in the idea as in an exemplary cause: in this [intelligible way] in knowledge as in the knower, the most beautiful Himself bearing the beautiful world in mind, etc., Boethius sings. And divinely the apostle, Acts 17: ‘In Him we live, and move, and are:’ and, τοῦ γὰρ καὶ γένος ἐσμέν, as the apostle [cites] there from Aratus. [This is] Against Durandus and those of whom Augustine makes mention, bk. 5, On the Literal Meaning of Genesis, who denied concourse.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations | pt. 2, On Creation, pt. 2, p. 118</cite>, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648)</span></figcaption>

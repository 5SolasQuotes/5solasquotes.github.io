<main class="wrap"><figure class="quote" id="q-61b67163f4" data-kw="">
<blockquote><p>…consider the selection pressures which operated during his presumed rise from the apes… The first [problem] is that on this hypothesis, the only genes that are consistently passed on are the ones for traits which have adaptive value. But obviously this isn’t so. Tell me the adaptive value in seeking to know the meaning of life, or in the ability to be awed, humbled, and transported by the music of J.S. Bach. One eminent sociobiologist claims that we have genes for believing in God, which are adaptive because belief in God unites the social group. Apparently no one told him that believing different things about God can tear the group apart. Besides — why not just have genes for social unity?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/j-budziszewski.html">J. Budziszewski</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘What makes Men Men?’, pt. 1</cite>, (2019)</span></figcaption>

<blockquote><p>8. The object of God’s will to create man was nothing, in the sense that we now take an object in, that is, for the materia circa quam [matter around which]. But if you will call the intended effect the object, then the object of God’s will here (and in the rest) is the thing willed. But if you will needs presume to seek one higher in the mind of God (man knows by reception and so has ideas, but God can be no recipient), you must say that it was man as conceived fit to be, as well as possible. For we can think no otherwise of the divine conceptions and volitions but as we are led by the analogy of human acts. And so we must say that:

1. God’s power makes it possible for all things to be.

2. Next God knows them possible.

3. He knows what is convenient or fit to be made to his unsearchable ends.

4. He wills that they shall be, and man among the rest, and so on.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable</cite>, (London: White, 1675), pt. 2, 1st Day’s Conference, about Predestination, p. 13</span></figcaption>

<blockquote><p>7. And lastly, in what time or how many days did God create all things, in six days says the Scripture, and every day some thing says this place, till the seventh day, wherein He rested. Non uno momento, sed sex dierum spatio, ‘not in one moment, but in six days’ space.’ If you happily think or meet with Syrach’s words [in Ecclesiasticus], who says, ‘He that lives made all things together, the Lord who only is iust,’ etc., you must consider that he speaks not of the time, but of the multitude of creatures, meaning that God made them all together before He rested, and gave over creating, but not meaning that He made them all in one moment of time or in one day, for we see both this place and others against it: the Lord’s own commandment written with his own finger gives testimony that in six days the whole was made.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gervase-babington.html">Gervase Babington</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Certain Plain, Brief &amp; Comfortable Notes upon every Chapter of Genesis</cite>, (London: 1592), ch. 1, p. 6</span></figcaption>

<blockquote><p>Philo Judaeus, Origen, Athanasius, Hilary, Augustine, Procopius of Gaza, Arnold of Chartres, R. Moses ben Maimonides in Moreh Nebuchim, bk. 2, ch. 30, 72, Cajetan, Bodin and Melchior Canus willed that the work of creation was accomplished in a moment, not in six days, and they thought that the six-day period of Moses should be understood allegorically. To whom we oppose:

1. The history of Creation in Gen. 1:5 ff., which relates in clear words what things were created on each day.

2. The sanctification of the Sabbath, for which this reason is given, because God created the heaven and the earth in six days and rested on the seventh day; which could not be said if the work of creation had been accomplished in a moment. Nor is the contrary opinion proved from Sirach 18:1, “He that lives for ever created all things at once (κοινῇ)”; for the little word κοινῇ refers not to “created,” but to “all things,” so that the sense is that God created all things without exception, and it is a collective of all created species, not, however, of time to a moment, and is to be taken not chronologically (χρονικῶς), but as a summary (συναγωγικῶς). Whence 3. Other fathers rightly defend the six-day creation with us, e.g., Chrysostom, Basil, Nazianzen, Ambrose, Gregory; to whom 4. Almost all the Scholastics subscribe. See Becanus, Theologia Scholastica, pt. 1, tract 4, ch. 1; Boyvin, Philosophia Scoti, pt. 1, Physics, pt. 2, disp. 1, ch. 3, sect. 1, quest. 6, p. 460-61. To the question, however: “Could not at least the works of individual days have been produced in a single moment?” we respond: The works of the first creation, or the first and immediate creation, were made in a single moment and a very brief space of time. In the mediate and second creation also [through the rest of the week], the command itself or the fiat of God was accomplished in a single moment, to which the works of the subsequent days, conformably to the nature of things, some were made without delay, at least a protracted one, some with some delay, in such a way, however, that the work of each day was completed on each day. What was disputed concerning this question between Maresius and Wittich, read in Wittich, Theologia Pacifica, ch. 7, §71-73, pp. 52-53; cf. also Burmann, Synopsis Theologiae, bk. 1, ch. 42, §6.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706) Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation/the-six-days.html">The Six Days</a></span></div>

80%9CCould+not+at+least+the+works+of+individual+days+have+been+produced+in+a+single+moment%3F%E2%80%9D+we+respond%3A+The+works+of+the+first+creation%2C+or+the+first+and+immediate+creation%2C+were+made+in+a+single+moment+and+a+very+brief+space+of+time.+In+the+mediate+and+second+creation+also+%5Bthrough+the+rest+of+the+week%5D%2C+the+command+itself+or+the+fiat+of+God+was+accomplished+in+a+single+moment%2C+to+which+the+works+of+the+subsequent+days%2C+conformably+to+the+nature+of+things%2C+some+were+made+without+delay%2C+at+least+a+protracted+one%2C+some+with+some+delay%2C+in+such+a+way%2C+however%2C+that+the+work+of+each+day+was+completed+on+each+day.+What+was+disputed+concerning+this+question+between+Maresius+and+Wittich%2C+read+in+Wittich%2C+Theologia+Pacifica%2C+ch.+7%2C+%C2%A771-73%2C+pp.+52-53%3B+cf.+also+Burmann%2C+Synopsis+Theologiae%2C+bk.+1%2C+ch.+42%2C+%C2%A76.%E2%80%9D%0A%0A%E2%80%94+Barthold+Holtzfus%2C+%E2%80%98Theological+Dissertation+on+Creation%E2%80%99%2C+%28Frankfurt%3A+Steppinus%2C+1706%29+Latin&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fb51e8b1a95.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/b51e8b1a95.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-how-long-god-took-in-creating/#:~:text=Philo%20Judaeus%2C%20Origen%2C%20Athanasius%2C%20Hilary%2C%20Augustine,Theologiae%2C%20bk.%201%2C%20ch.%2042%2C%20%C2%A76&amp;text=Philo%20Judaeus%2C%20Origen%2C%20Athanasius%2C%20Hilary%2C%20Augustine%2C%20Procopius%20of&amp;text=Burmann%2C%20Synopsis%20Theologiae%2C%20bk.%201%2C%20ch.%2042%2C%20%C2%A76" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>As to the second part of my reflections, wherein I doubt concerning the earth’s moving about its axis, it may be I differ from you [John Woodward, a professor of physics, to whom the work is dedicated], and from the generality of Virtuosos [New Philosophers] at this day. But truly I am not so much a [Brahe] Tychonian as to forswear the Copernican Hypothesis: But the truth of the matter is this, when I was treating of the most substantial points of divinity, that is, when I was asserting and vindicating the being and providence of God, I was unwilling to found these or anything belonging to them upon an infirm and unstable basis, upon a dubious and disputable doctrine, and which had not long prevailed in the learned world. Such I take the opinion of the circumgyration of the earth to be: and therefore till I could be absolutely satisfied about the reality of it, I thought it was safest to aquiesce at present in the other doctrine, and the rather because it is suitable to the mundane system which Moses presents us with, whose literal sense of the account of it is not to be slighted by Christian philosophers.</p></blockquote>

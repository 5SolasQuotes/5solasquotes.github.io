<main class="wrap"><figure class="quote" id="q-77d9fbd74d" data-kw="">
<blockquote><p>This is the promise: The Spirit shall lead you into all truth. You are now searching into the deep things of God, which concern Religion; Live in the Spirit, and the Spirit shall bring all into your mind, and shew you the things of Jesus Christ. It behoves you to know the method of Satan; the stratagems and dark deeps of the Devil himself, in mysteries of State and Religion. Walk in the Spirit; he shall lead you into their chambers, as he did Ezekiel; and let you see what mischiefs they are there contriving in secret.

This is the promise: The Spirit of God and of glory shall rest on his servants, in their conflicts and sufferings. Sit still in all humble resignation of your selves, to the working of this Spirit; that he may rest on you: so shall he manage your counsels, finish your wars; and end all your sufferings with glory.

I shall conclude my Epistle with an humble Petition to your Honours: an hearty Prayer for you.

My humble Petition is, that You would ever remember to converse as Doves, among Doves; with this Dove; He is a tender Spirit, take heed of grieving this Spirit, where ever he dwells: For by him alone can your hopes be sealed to a day of full accomplishment.

My hearty Prayer is, that, as you sit debating in Parliament, the appearances of the Holy Ghost may be among you; as he was with the Apostles, sitting over them in the form of fiery tongues: that when you fight in the field, the Holy Ghost may be as a two-edged sword going forth from the mouth of the Lord Jesus into your enemy’s hearts: that you may never see upon the walls of your house, that hand-writing which made Belshazzer tremble; Your kingdom is divided; but in stead of this, that uniting and building Principle; Not by might, nor by power, but by my Spirit, saith the Lord. This is the fervent, constant prayer of

Your Honours humble servant in Christ, Peter Sterry.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-44144bd6cf" data-kw="">
<blockquote><p>For that, I shall desire you to consider that Jesus Christ is the only Head and King of his Church, that the government of his Church is a part of his Kingly office; that the government is committed into his hand, and the key of the house of David is laid upon his shoulders (Isa. 22:21-22); that the Father has set him as King upon his holy hill of Zion (Ps. 2:6), to reign over the house of Jacob for ever, and of his kingdom there shall be no end (Luke 1:33). As therefore he has fully and faithfully exercised his Priestly office in making atonement for our sins by the sacrifice of himself, and still making intercession in heaven for us; and his Prophetical office in revealing the whole counsel of God, and teaching his people by his word and Spirit, what he would have them to do; so he has no less fully and faithfully executed his Kingly office and legislative power, in providing statutes and ordinances for all the necessities of his Church; and appointing by whom and after what manner he will have his house governed, what spiritual courts and judicatories he would have erected, how he would have them constituted, by what rules to proceed, how to censure offenses. It is an old observation – they are the best laws, which leave the least to the power of the judge to do as he list [will]. It were a bad administration of the supreme power in any kingdom, if no certain kinds of subordinate officers, nor no certain kind of government were appointed, but all this left to the liberty of every country and city. Now Jesus Christ is more wise, and provident, and faithful, in the government of his whole Church, than ever King or Parliament was in the government of an earthly kingdom; and has therefore appointed officers, courts, censures, and laws, for the right ordering thereof; and has not left these things to be determined by this or that state at their pleasure. I should wish you and all that are of your mind, to study better the Kingly office and royal prerogative of Jesus Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-gillespie.html">George Gillespie</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A late dialogue between a civilian and a divine</cite>, (London, 1644) in The anonymous writings of George Gillespie, ed. Chris Coldwell (Dallas TX, 2008), pp 117-18.</span></figcaption>

</figure><figure class="quote" id="q-443e8d7f31" data-kw="">

<blockquote><p>We may only advert farther on this head, to the wonder that the friends of truth and reformation should be so divided in sentiment and communion.

Considering that these are so feeble in point of numbers, and that the force of their public testimony depends so much on their united exertions, it is truly surprising that so little of a spirit of enlightened and scriptural union should exist among them; and that so generally they should be on the watch to increase their own little parties, by fishing in disturbed waters, and picking up treasures from the wreck of ruined establishments.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-m-crie-sr.html">Thomas M’Crie Sr.</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Aspect of the Times. Delivered in May, 1834 in Sermons</cite></span></figcaption>

</figure><figure class="quote" id="q-5cb0ccd1ba" data-kw="">
<blockquote><p>…Calvin protested [to the French king] “in truth before God” that Geneva has “never attempted to send persons into your kingdom.” Explaining matters further, the letter declared: “that never with our knowledge and permission has someone gone from here to preach except one individual who was requested from us for the city of London… So then, the Genevan ministers say they encouraged some people to exercise their gifts everywhere. There is, however, the clear implication that was all they did. The explanation would appear to wish to persuade the king that what he has heard of as Geneva sending ministers into his kingdom is actually a simple case of free preachers and godly men wandering of their own free will into the king’s territory… The answers to both concerns are, according to Calvin and Beza’s own Augustinian understanding of lying, plainly speech contra mentem. They did send preachers into France and they were involved in dissensions of precisely the kind about which the king was asking.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jon-balserak.html">Jon Balserak</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Geneva’s Use of Lies, Deceit &amp; Simulation in Their Efforts to Reform France</cite>, 1536–1563’ HTR 112:1 (2019), pp. 76–100, p. 98</span></figcaption>

<div class="actions"><button class="copy" data-copy="“…Calvin protested [to the French king] “in truth before God” that Geneva has “never attempted to send persons into your kingdom.” Explaining matters further, the letter declared: “that never with our knowledge and permission has someone gone from here to preach except one individual who was requested from us for the city of London… So then, the Genevan ministers say they encouraged some people to exercise their gifts everywhere. There is, however, the clear implication that was all they did. The explanation would appear to wish to persuade the king that what he has heard of as Geneva sending ministers into his kingdom is actually a simple case of free preachers and godly men wandering of their own free will into the king’s territory… The answers to both concerns are, according to Calvin and Beza’s own Augustinian understanding of lying, plainly speech contra mentem. They did send preachers into France and they were involved in dissensions of precisely the kind about which the king was asking.”

<main class="wrap"><figure class="quote" id="q-ecb7aa4c29" data-kw="">
<blockquote><p>Mr. Hooker: ‘It shall follow that the Church of Rome is a true Church, for all the members of that Church have true baptism, which is the formal cause of a true Church: but that is false, that that Church is a true Church.’ [Rutherford’s] Answer: [1.] The conclusion of the connex proposition is nothing against me, who deny Baptism to be the formal cause of Membership. 2. Such a Baptism that is valid, as touching the substance of the seal, as is in Rome: such a Church according to the metaphysic entity and being of a Church, is Rome a Ministerial Church, teaching necessary fundamentals, though darkening and contradicting all; but it is not morally a true Church, but leprous and unclean. See what Junius, Whitaker, Calvin and Rivetus say hereupon: Mr. Hooker is far from their sound expressions…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Survey of that Sum of Church-Discipline Penned by Mr. Thomas Hooker</cite>, (1658), Book 1, ch. 21, pp. 119-120</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cb317aa3f1" data-kw="">
<blockquote><p>For that the doctrine there is most impure, we have demonstrated through its several parts. But if it is asked about morals, come, let the very histories of the Roman pontiffs (which the parasites of the pontiffs wrote) be compared with whatever monsters of men ever existed from the founding of the world, and it will be found that in this one seat more was permitted to Satan than in any tyranny that ever oppressed the world.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-beza.html">Theodore Beza</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian Faith</cite>, ch. 7</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a> › <a href="../topics/the-church/true-and-false-church/is-rome-a-true-church.html">Is Rome a true church?</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a></span></div>

— Theodore Beza, The Christian Faith, ch. 7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CFor+that+the+doctrine+there+is+most+impure%2C+we+have+demonstrated+through+its+several+parts.+But+if+it+is+asked+about+morals%2C+come%2C+let+the+very+histories+of+the+Roman+pontiffs+%28which+the+parasites+of+the+pontiffs+wrote%29+be+compared+with+whatever+monsters+of+men+ever+existed+from+the+founding+of+the+world%2C+and+it+will+be+found+that+in+this+one+seat+more+was+permitted+to+Satan+than+in+any+tyranny+that+ever+oppressed+the+world.%E2%80%9D%0A%0A%E2%80%94+Theodore+Beza%2C+The+Christian+Faith%2C+ch.+7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fcb317aa3f1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/cb317aa3f1.html">Permalink</a><span class="src none">No free online copy linked</span></div>
</figure><figure class="quote" id="q-c0b41dd003" data-kw="">
<blockquote><p>…at least we yield to them [Romanism] that they have baptism, that they have the substance of Christian religion… First concerning baptism, they confess that we have it, and that it may be amongst heretics: Antiquity believed it, and we believe it with antiquity. They reiterate [perform again] not the baptism administred by us, we reiterate not the baptism administered by them… The true circumcision was in the Church of the ten tribes, it was not for all that the true Church: [but] an heretical Church shall have baptism, and yet for all that not cease to be a false Church; not in respect of the baptism, but of her heresy: not in regard of that which is pure in her and of the Lord’s institution, but in regard of her rebellion against the Lord and her own impurity. That they haue baptism then we grant, but so we say have all heretics, so the ten tribes after their apostasy received circumcision; this exception then is frivolous when they pretend that we confess that they have the baptism, and craftily dissemble that which we add, that they have adulterated and depraved it as much as in them lies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-cameron.html">John Cameron</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Examination of those Plausible Appearances which seem most to commend the Romish Church, and to Prejudice the Reformed</cite>, … (Oxford, 1626), ch. 37, ‘In what sense we yield that the Church of Rome has the substance of true religion, and how she ceases not for all that to be a false Chuch’, pp. 146-47</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>
<div class="actions"><button class="copy" data-copy="“…at least we yield to them [Romanism] that they have baptism, that they have the substance of Christian religion… First concerning baptism, they confess that we have it, and that it may be amongst heretics: Antiquity believed it, and we believe it with antiquity. They reiterate [perform again] not the baptism administred by us, we reiterate not the baptism administered by them… The true circumcision was in the Church of the ten tribes, it was not for all that the true Church: [but] an heretical Church shall have baptism, and yet for all that not cease to be a false Church; not in respect of the baptism, but of her heresy: not in regard of that which is pure in her and of the Lord’s institution, but in regard of her rebellion against the Lord and her own impurity. That they haue baptism then we grant, but so we say have all heretics, so the ten tribes after their apostasy received circumcision; this exception then is frivolous when they pretend that we confess that they have the baptism, and craftily dissemble that which we add, that they have adulterated and depraved it as much as in them lies.”

github.io%2Fquote%2Fc0b41dd003.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/c0b41dd003.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/is-roman-catholic-baptism-valid/#:~:text=at%20least%20we%20yield%20to%20them,as%20much%20as%20in%20them%20lies&amp;text=at%20least%20we%20yield%20to%20them%20%5BRomanism%5D%20that&amp;text=depraved%20it%20as%20much%20as%20in%20them%20lies" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-7ebe514946" data-kw="">
<blockquote><p>Whence I observe, That all those who will be saved, must depart and separate themselves from the faith and religion of this present Church of Rome.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Reformed Catholic, The Eleventh Point</cite>, on Rev. 18:4, p. 8</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a> › <a href="../topics/the-church/true-and-false-church/is-rome-a-true-church.html">Is Rome a true church?</a></span><span class="t"><a href="../topics/rome/the-church.html">Rome: The Church</a> › <a href="../topics/rome/the-church/no-salvation-outside-the-church.html">No salvation outside the church</a></span></div>

— William Perkins, A Reformed Catholic, on Rev. 18:4, p. 8">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhence+I+observe%2C+That+all+those+who+will+be+saved%2C+must+depart+and+separate+themselves+from+the+faith+and+religion+of+this+present+Church+of+Rome.%E2%80%9D%0A%0A%E2%80%94+William+Perkins%2C+A+Reformed+Catholic%2C+on+Rev.+18%3A4%2C+p.+8&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F7ebe514946.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/7ebe514946.html">Permalink</a><a class="src" href="https://archive.org/details/bim_early-english-books-1475-1640_a-reformed-catholike_perkins-w_1597" rel="noopener" target="_blank">Read it online · Internet Archive (1597 ed.)</a></div>
</figure><figure class="quote" id="q-e1e86377b7" data-kw="">
<blockquote><p>2. [John] Robinson [a Separatist] says, ‘fundamental truths are holden and professed by as vile heretics as ever were since Christ’s days; a company of excommunicates may hold, teach and defend fundamental truths, yet are they not a true Church of God?’ [Rutherford’s] Answer. Papists hold fundamentals, and so do Jews hold all the Old Testament, and Papists hold both New and Old, but we know they so hold fundamentals that by their doctrine they overturn them; and though there be fundamentals taught in the Popish Church which may save if they were believed, yet they are not a true and ministerial Church simply, because, though they teach that there is one God, they teach also there is a thousand Gods whom they adore, and though they teach [that] there is one Mediator, yet do they substitute infinite Mediators with and besides Christ, so that the truth is, not a formal, ministerial and visible active external calling is in the Church of Rome, as it is a visible Church, in the which we can safely remain, though fundamentals be safe in Rome, and the books of the Old and New Testament be there, yet are they not there ministerially as in a mother whose breasts we can suck; for fundamental points falsely exponed, cease to be fundamental points; yea as they be ministerially in Rome, they be destructive of the foundation, though there be some ministerial acts valid in that Church, for the which the Church of Rome is called a true Church, [in Greek], in some respect, according to something essential to the true Church, yet never sine adjecto [without the adjunct], as if it were a true Church where we can worship God. Fundamentals are safe in Rome materially in themselves, so as some may be saved who believe these fundamentals; but fundamentals are not safe in Rome, Ecclesiastice, Ministeraliter, Pastoraliter [ecclesiastically, ministerially, pastorally], in a Church way, so as by believing these from their chairs so exponed, they can be saved who do believe them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries, ‘Acts 15, A Pattern of a Juridicial Synod’</cite>, ... (1644), | pt. 2, pp. 229-230</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/true-and-false-church.html">True and False Church</a></span></div>

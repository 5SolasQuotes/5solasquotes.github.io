<main class="wrap"><figure class="quote" id="q-7fe7a2742d" data-kw="">
<blockquote><p>That false ideas on the subject have been entertained by many, will not appear strange. Such as know no higher gratification than sensitive pleasure, will frame in their imagination, a Millennium bearing a resemblance to Mahomet’s paradise. This we find to have been the opinion of some, who lived in the early days of the Christian Church. To those who understand the nature of true religion, and the sources of a Christian’s felicity, a refutation of this system is needless: to mention it, is to refute it. Others have represented the Millennium as a state nearly equalling heaven. The reins have been thrown loose on the neck of a luxurious imagination, which abandoned to its own wayward fancies, has forsaken the path of sober reason, and wandered into fairy scenes of its own creation.

How wise and pious men could ever suppose that the saints, whose souls are now in heaven, should, after the resurrection of the body from the grave, descend to live on earth again; and that Jesus Christ should quit the throne of his glory above, and descend and reign personally over them here below, in distinguished splendour, for a thousand years, may justly excite our astonishment, since it is in direct opposition to the whole tenor of the doctrinal parts of the sacred volume. Such, however, have been the opinions of some great men. Happy will it be if we take warning from their aberrations; and from seeing them go so far astray, we are constantly on our guard against giving way to fancies, and exercise a holy caution and strict sobriety of judgment, in the interpretation of the sacred oracles, on this interesting but difficult subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/david-bogue.html">David Bogue</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Discourses on the Millennium</cite>, (London: T. Hamilton, 1818), pp 16-17.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/creation.html">Creation</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5ab5a74df0" data-kw="">
<blockquote><p>XI. At what time of the year the world began, whether in spring or in autumn, the learned disagree:

      1. Gerardus Mercator thinks the world was created in summer time.

      2. Many fathers and scholastics contend that it was founded in spring, with whom agree; from the Jews, R. Joshua, and from the Reformed, Alsted, Polanus, Keckermann, and Braun.

      3. But the rest of the Jews commonly, and very many of the Orthodox, for example Voet, Maresius, Cocceius, Burmann, Turretin, Rijssen, Mastricht, etc., state that the world was founded in autumn; whose opinion we approve:

      1. Because the civil year of the Israelites, which was also that of the patriarchs, was begun in the month of Tishri, Ex. 23:16, where the feast of the collection of all fruits from the fields is commanded to be celebrated at the end of the year.

      2. Because in Ex. 34:22, the Feast of Tabernacles is commanded to be celebrated in the seventh month, at the revolution of the year, i.e., in the month of Tishri.

      3. Because the sabbatical and jubilee year of the Jews was celebrated in the month of Tishri, which corresponds to our September or October, Lev. 25:9.

      4. Because the Jews to this day celebrate ראש השנה (Rosh Hashanah) in the month of Tishri, and with it they begin the year, and they explode the different opinion of R. Joshua as singular.

      5. Because in Gen. 7:11, the flood is said to have occurred in the second month; which, however, was most probably done at that time of year which is suitable for inundations, so that the second month should be computed from the autumnal equinox.

      6. Because in autumn the fruits of the trees are ripe and the plants are heavy with seeds, to sustain the first parents and the animals.

      7. The Egyptians, Persians, Greeks and all the Orientals begin the year from September, which it is not to be doubted they received from tradition.

      8. Because in the Gemara, Avodah Zarah, ch. 1, it is handed down that Adam, immediately after creation was made, noticed that the days were declining and becoming shorter; which could not have happened except in the month of September. See Menasseh ben Israel, Problems, 9, Of Creation, also The Conciliator, quest. 11 in Exodus, p. 118. For the rest, just as the Jews begin the civil year in the month of Tishri, so they begin the sacred year in the month of Nisan.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, (Frankfurt: Steppinus, 1706), ch. 2, On Creation, pp. 22-23 trans. AI Latin</span></figcaption>

</figure><figure class="quote" id="q-4f8dce999b" data-kw="">
<blockquote><p>As to the second part of my reflections, wherein I doubt concerning the earth’s moving about its axis, it may be I differ from you [John Woodward, a professor of physics, to whom the work is dedicated], and from the generality of Virtuosos [New Philosophers] at this day. But truly I am not so much a [Brahe] Tychonian as to forswear the Copernican Hypothesis: But the truth of the matter is this, when I was treating of the most substantial points of divinity, that is, when I was asserting and vindicating the being and providence of God, I was unwilling to found these or anything belonging to them upon an infirm and unstable basis, upon a dubious and disputable doctrine, and which had not long prevailed in the learned world. Such I take the opinion of the circumgyration of the earth to be: and therefore till I could be absolutely satisfied about the reality of it, I thought it was safest to aquiesce at present in the other doctrine, and the rather because it is suitable to the mundane system which Moses presents us with, whose literal sense of the account of it is not to be slighted by Christian philosophers.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-edwards.html">John Edwards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Brief Remarks upon Mr</cite>, [William] Whiston’s New Theory of the Earth &amp; upon an other Gentleman’s Objections Against Some Passages in a Discourse of the Existence &amp; Providence of God, Relating to the Copernican Hypothesis (London, 1697)</span></figcaption>

<div class="actions"><button class="copy" data-copy="“As to the second part of my reflections, wherein I doubt concerning the earth’s moving about its axis, it may be I differ from you [John Woodward, a professor of physics, to whom the work is dedicated], and from the generality of Virtuosos [New Philosophers] at this day. But truly I am not so much a [Brahe] Tychonian as to forswear the Copernican Hypothesis: But the truth of the matter is this, when I was treating of the most substantial points of divinity, that is, when I was asserting and vindicating the being and providence of God, I was unwilling to found these or anything belonging to them upon an infirm and unstable basis, upon a dubious and disputable doctrine, and which had not long prevailed in the learned world. Such I take the opinion of the circumgyration of the earth to be: and therefore till I could be absolutely satisfied about the reality of it, I thought it was safest to aquiesce at present in the other doctrine, and the rather because it is suitable to the mundane system which Moses presents us with, whose literal sense of the account of it is not to be slighted by Christian philosophers.”

— John Edwards, Brief Remarks upon Mr, [William] Whiston’s New Theory of the Earth &amp; upon an other Gentleman’s Objections Against Some Passages in a Discourse of the Existence &amp; Providence of God, Relating to the Copernican Hypothesis (London, 1697)">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CAs+to+the+second+part+of+my+reflections%2C+wherein+I+doubt+concerning+the+earth%E2%80%99s+moving+about+its+axis%2C+it+may+be+I+differ+from+you+%5BJohn+Woodward%2C+a+professor+of+physics%2C+to+whom+the+work+is+dedicated%5D%2C+and+from+the+generality+of+Virtuosos+%5BNew+Philosophers%5D+at+this+day.+But+truly+I+am+not+so+much+a+%5BBrahe%5D+Tychonian+as+to+forswear+the+Copernican+Hypothesis%3A+But+the+truth+of+the+matter+is+this%2C+when+I+was+treating+of+the+most+substantial+points+of+divinity%2C+that+is%2C+when+I+was+asserting+and+vindicating+the+being+and+providence+of+God%2C+I+was+unwilling+to+found+these+or+anything+belonging+to+them+upon+an+infirm+and+unstable+basis%2C+upon+a+dubious+and+disputable+doctrine%2C+and+which+had+not+long+prevailed+in+the+learned+world.+Such+I+take+the+opinion+of+the+circumgyration+of+the+earth+to+be%3A+and+therefore+till+I+could+be+absolutely+satisfied+about+the+reality+of+it%2C+I+thought+it+was+safest+to+aquiesce+at+present+in+the+other+doctrine%2C+and+the+rather+because+it+is+suitable+to+the+mundane+system+which+Moses+presents+us+with%2C+whose+literal+sense+of+the+account+of+it+is+not+to+be+slighted+by+Christian+philosophers.%E2%80%9D%0A%0A%E2%80%94+John+Edwards%2C+Brief+Remarks+upon+Mr%2C+%5BWilliam%5D+Whiston%E2%80%99s+New+Theory+of+the+Earth+%26+upon+an+other+Gentleman%E2%80%99s+Objections+Against+Some+Passages+in+a+Discourse+of+the+Existence+%26+Providence+of+God%2C+Relating+to+the+Copernican+Hypothesis+%28London%2C+1697%29&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F4f8dce999b.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/4f8dce999b.html">

<blockquote><p>Occasionally on this blog, I will make reference to the R2K error. This view is held by a number of modern “Reformed” scholars, especially from Westminster Seminary California. Although I gave a brief definition of what it was in a recent post by Samuel B. Wylie, nevertheless, it is always better to get something straight from the horses’ mouth in order to avoid accusations that you are erecting a straw-man of your opponent’s position. Michael Horton is by far the most learned, gifted, and pious of the R2K theologians I have come across. Consequently, I think it is safe to say that his definition of the dogma is probably accurate. In his recent work on systematic theology, Professor Horton provides us with the following definition of what R2Kers believe concerning God’s law and civil government: ‘God secretly governs the nations just as he does the church, although he governs the former through natural law and common grace and the latter through his Word written and preached. […] The Mosaic theocracy was limited to the old covenant and is no longer the blueprint for nation-states.’ [1]

As a forum for Reformed political theology and Covenanter Theonomy, this blog will repeatedly post material arguing that nations are to be governed by biblical law. Moreover, although we acknowledge that modern nations are not to be exact replicas of the Hebrew Republic, as the judicial laws of particular right to Israel have expired, we do believe that judicial laws of common equity in the Mosaic law, which act as an external fence to the Decalogue, bind all nations. While some posts will directly address the R2K error, others will refute it indirectly by dealing with themes relating to the establishment principle, biblical penal sanctions, social theocracy, and the Lordship of Christ over the state. In light of the writings of our Reformed forebears on these themes, one can be in no doubt that there is no place for R2K at the Reformed table, as R2K is not Reformed.[2]</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-horton.html">Michael Horton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Christian faith: a systematic theology for pilgrims on the way</cite>, (Grand Rapids, 2011), pp 366-7.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3b47021f5c" data-kw="">
<blockquote><p>As to the political law of the Jews, that has been abolished in two respects; first, as it served to distinguish the Jewish commonwealth from all others, and as it was a type of the Redeemer’s kingdom. Now there is no longer any difference between Jews and Gentiles in Christ, (Gal. iii. 28,) and the Messiah having appeared, there is no need for his kingdom to be typified.

Secondly, it is abrogated in those things which are of particular obligation, and which were only applicable to the Jews; as the law concerning the marriage of a brother’s wife, the law of divorce, the jubilee, the first-born, the sowing of fields with different seeds, &amp;c. &amp;c.

But it is not abrogated in those things which are of universal obligation, being founded on the law of nature; which serve for the explanation of the Decalogue, and are found in the New Testament. The Jewish nation may be considered in two characters, as a people, and as the Jewish people; whatever applies to them simply as a nation, can be applicable to others; but whatever applies to them as the Jewish nation, is of no more obligation upon us, than the laws of the ancient Assyrians, Persians, Greeks, and Romans, or the municipal laws of any foreign nation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benedict-pictet.html">Benedict Pictet</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christian Theology</cite>, trans. Frederick Reyroux (1696; London, 1834), 6.18, p. 333.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/natural-law-and-civil-law.html">Natural Law and Civil Law</a></span></div>

<blockquote><p>That is, the General Assembly decided that appeals cannot lie except in judicial cases. It is really a matter of importance. It would be a hard case if a party, suffering under a grievous wrong, should be turned away from the bar of our highest judicatory, merely on the ground that he had mistaken the nature of his remedy… We have had a superior judicatory in our Church for more than a hundred and twenty years. During about seventy years of this period, our discipline was conducted according to the Westminster Directory. In 1789 our present constitution went into operation; which was submitted to an extensive revision and alteration, as to matters of detail, in 1821. Under these several systems, appeals and complaints were allowed, without hindrance or contradiction, from any kind of decision in an inferior judicatory by a person who felt himself aggrieved, until 1834. Then, for the first time in our history, as far as we know, the idea was started that appeals and complaints could be made only in cases strictly judicial. …That this novel doctrine was not at that time the doctrine of the synod, which the Rev. gentleman defended, is plain… Though the synod was thus free from this new doctrine in May 1834, it grew in such sudden favour, that when that body met the following autumn, they decided not merely that appeals and com- plaints could not lie except in judicial cases, but even that protests were in the same predicament. This is an instructive illustration of the fact that the wisest and best men sometimes allow themselves to be run away with by a plausible idea, though contrary to all their own previous professions and practice. This, however, was a mere temporary delusion. The members of that synod who had signed or allowed protests in all kinds of cases before, still continued to sign or allow them, with equal freedom, their own decision to the contrary notwithstanding… We found its very authors and advocates disregarding it the very next year; acting as though no such doctrine had ever been broached. If they practically abandoned it as untenable… The Synod of Philadelphia extended the [new] doctrine to appeals, complaints and protests. Thus putting minorities completely under the feet of majorities, not allowing them even the right of recording their dissent with the reasons for it… …There is a good deal of confusion and error often occasioned by the mere designation of our ecclesiastical bodies as courts or judicatories. They are so called Avhen not sitting in judicial capacity… Our courts are bodies sui generis [of their kind]; they include within themselves legislative, executive and judicial powers. Yet this division is in a great measure arbitrary. These several powers are but different modes of exercising the general governing authority in the Church; and it is often very difficult to say whether a particular act should be placed under the one or the other of these heads… An appeal supposes an aggrieved party, but he may appeal from any kind of decision which directly affects himself. A complaint supposes some kind of impropriety in the act complained of, but it may be entered against any kind of act alleged to be improper. So that any kind of decision may be regularly brought up in each of the several ways specified above. That this is the true meaning of this article, might be inferred with certainty from the fact that it has always been so understood and acted upon; and that it is almost a literal transcript of the Scottish rule on the same subject, which has always been interpreted and applied in the same way… In the first place, these technical terms are to be understood, not according to their use in civil courts, but according to our own ecclesiastical usage. Our bodies are called courts; their decisions are called judgments; the matters brought before them are called cases. Are we to infer from this, as has been done by the New School lawyers and brethren, that they have nothing but judicial powers… In the second place, our rules were drawn up with special reference to that class of cases which is of most frequent occurrence, and hence the language employed is adapted to such cases… In the third place it is a fallacy running through this argument that there can be no judicial investigation of anything but a judicial act… There is, therefore, no foundation in our constitution for this new doctrine. Every letter of the rules may be, and has been fully complied with in a multitude of cases, where the decision appealed from was merely an executive act… We shall proceed to show that this new doctrine, especially if applied to complaints as well as appeals (and we have seen that the two cannot in this matter be consistently separated), is subversive of the fundamental principles of Presbyterianism, and inconsistent with the uniform practice of the Church… This doctrine is at variance also with the undeviating practice of our own and all other Presbyterian Churches. This of itself is a fatal objection to any new doctrine. The fact that we have been going on in accordance with the usage of all other Presbyterian bodies, for a hundred and twenty years, interpreting and administering our constitution in a certain way, is answer enough… The words of our book have the sense which they were intended to bear; and they were intended to bear the sense in which its authors and administrators have ever understood and applied them… That the practice of our Church has been uniform on this subject, is admitted… There is not then, upon our Minutes, a single case of an appeal or complaint, which was rejected on the ground that it did not refer to a judicial sentence. We have been going on for a hundred and twenty years entertaining such appeals without any one dreaming of their being irregular… If after all this a new and opposite doctrine is to be introduced, there never can be any stability or security with regard to any principle of Presbyterian Church government… Nothing short of a plain and intelligible denial of the right to complain of oppressive and unconstitutional acts; or to appeal from unrighteous decisions, though they may not be judicial, will induce Presbyterians to forego a privilege which they have enjoyed from the very foundation of their Church… If it is to be applied to appeals, we see not how any one can fail to apply it to complaints and references, and if so applied, all must acknowledge that our system of government would be completely overturned. The right of appeal is already restricted within very harrow limits. It is not the privilege of any member of the court. It belongs exclusively to an aggrieved party; to those whose character or interests are immediately concerned in the decision. And to all such it is a right guaranteed by the constitution and by the undeviating practice of the Church.</p></blockquote>

however%2C+was+a+mere+temporary+delusion.+The+members+of+that+synod+who+had+signed+or+allowed+protests+in+all+kinds+of+cases+before%2C+still+continued+to+sign+or+allow+them%2C+with+equal+freedom%2C+their+own+decision+to+the+contrary+notwithstanding%E2%80%A6+We+found+its+very+authors+and+advocates+disregarding+it+the+very+next+year%3B+acting+as+though+no+such+doctrine+had+ever+been+broached.+If+they+practically+abandoned+it+as+untenable%E2%80%A6+The+Synod+of+Philadelphia+extended+the+%5Bnew%5D+doctrine+to+appeals%2C+complaints+and+protests.+Thus+putting+minorities+completely+under+the+feet+of+majorities%2C+not+allowing+them+even+the+right+of+recording+their+dissent+with+the+reasons+for+it%E2%80%A6+%E2%80%A6There+is+a+good+deal+of+confusion+and+error+often+occasioned+by+the+mere+designation+of+our+ecclesiastical+bodies+as+courts+or+judicatories.+They+are+so+called+Avhen+not+sitting+in+judicial+capacity%E2%80%A6+Our+courts+are+bodies+sui+generis+%5Bof+their+kind%5D%3B+they+include+within+themselves+legislative%2C+executive+and+judicial+powers.+Yet+this+division+is+in+a+great+measure+arbitrary.+These+several+powers+are+but+different+modes+of+exercising+the+general+governing+authority+in+the+Church%3B+and+it+is+often+very+difficult+to+say+whether+a+particular+act+should+be+placed+under+the+one+or+the+other+of+these+heads%E2%80%A6+An+appeal+supposes+an+aggrieved+party%2C+but+he+may+appeal+from+any+kind+of+decision+which+directly+affects+himself.+A+complaint+supposes+some+kind+of+impropriety+in+the+act+complained+of%2C+but+it+may+be+entered+against+any+kind+of+act+alleged+to+be+improper.+So+that+any+kind+of+decision+may+be+regularly+brought+up+in+each+of+the+several+ways+specified+above.+That+this+is+the+true+meaning+of+this+article%2C+might+be+inferred+with+certainty+from+the+fact+that+it+has+always+been+so+understood+and+acted+upon%3B+and+that+it+is+almost+a+literal+transcript+of+the+Scottish+rule+on+the+same+subject%2C+which+has+always+been+interpreted+and+applied+in+the+same+way%E2%80%A6+In+the+first+place%2C+these+technical+terms+are+to+be+understood%2C+not+according+to+their+use+in+civil+courts%2C+but+according+to+our+own+ecclesiastical+usage.+Our+bodies+are+called+courts%3B+their+decisions+are+called+judgments%3B+the+matters+brought+before+them+are+called+cases.+Are+we+to+infer+from+this%2C+as+has+been+done+by+the+New+School+lawyers+and+brethren%2C+that+they+have+nothing+but+judicial+powers%E2%80%A6+In+the+second+place%2C+our+rules+were+drawn+up+with+special+reference+to+that+class+of+cases+which+is+of+most+frequent+occurrence%2C+and+hence+the+language+employed+is+adapted+to+such+cases%E2%80%A6+In+the+third+place+it+is+a+fallacy+running+through+this+argument+that+there+can+be+no+judicial+investigation+of+anything+but+a+judicial+act%E2%80%A6+There+is%2C+therefore%2C+no+foundation+in+our+constitution+for+this+new+doctrine.+Every+letter+of+the+rules+may+be%2C+and+has+been+fully+complied+with+in+a+multitude+of+cases%2C+where+the+decision+appealed+from+was+merely+an+executive+act%E2%80%A6+We+shall+proceed+to+show+that+this+new+doctrine%2C+especially+if+applied+to+complaints+as+well+as+appeals+%28and+we+have+seen+that+the+two+cannot+in+this+matter+be+consistently+separated%29%2C+is+subversive+of+the+fundamental+principles+of+Presbyterianism%2C+and+inconsistent+with+the+uniform+practice+of+the+Church%E2%80%A6+This+doctrine+is+at+variance+also+with+the+undeviating+practice+of+our+own+and+all+other+Presbyterian+Churches.+This+of+itself+is+a+fatal+objection+to+any+new+doctrine.+The+fact+that+we+have+been+going+on+in+accordance+with+the+usage+of+all+other+Presbyterian+bodies%2C+for+a+hundred+and+twenty+years%2C+interpreting+and+administering+our+constitution+in+a+certain+way%2C+is+answer+enough%E2%80%A6+The+words+of+our+book+have+the+sense+which+they+were+intended+to+bear%3B+and+they+were+intended+to+bear+the+sense+in+which+its+authors+and+administrators+have+ever+understood+and+applied+them%E2%80%A6+That+the+practice+of+our+Church+has+been+uniform+on+this+subject%2C+is+admitted%E2%80%A6+There+is+not+then%2C+upon+our+Minutes%2C+a+single+case+of+an+appeal+or+complaint%2C+which+was+rejected+on+the+ground+that+it+did+not+refer+to+a+judicial+sentence.+We+have+been+going+on+for+a+hundred+and+twenty+years+entertaining+such+appeals+without+any+one+dreaming+of+their+being+irregular%E2%80%A6+If+after+all+this+a+new+and+opposite+doctrine+is+to+be+introduced%2C+there+never+can+be+any+stability+or+security+with+regard+to+any+principle+of+Presbyterian+Church+government%E2%80%A6+Nothing+short+of+a+plain+and+intelligible+denial+of+the+right+to+complain+of+oppressive+and+unconstitutional+acts%3B+or+to+appeal+from+unrighteous+decisions%2C+though+they+may+not+be+judicial%2C+will+induce+Presbyterians+to+forego+a+privilege+which+they+have+enjoyed+from+the+very+foundation+of+their+Church%E2%80%A6+If+it+is+to+be+applied+to+appeals%2C+we+see+not+how+any+one+can+fail+to+apply+it+to+complaints+and+references%2C+and+if+so+applied%2C+all+must+acknowledge+that+our+system+of+government+would+be+completely+overturned.+The+right+of+appeal+is+already+restricted+within+very+harrow+limits.+It+is+not+the+privilege+of+any+member+of+the+court.+It+belongs+exclusively+to+an+aggrieved+party%3B+to+those+whose+character+or+interests+are+immediately+concerned+in+the+decision.+And+to+all+such+it+is+a+right+guaranteed+by+the+constitution+and+by+the+undeviating+practice+of+the+Church.%E2%80%9D%0A%0A%E2%80%94+Charles+Hodge%2C+Discussions+in+Church+Polity%2C+%E2%80%A6+%28NY%3A+Scribner%E2%80%99s+Sons%2C+1878%29%2C+pt.+2%2C+ch.+16%2C+%E2%80%98Discipline%E2%80%99%2C+section+3%2C+%E2%80%98Appeals+%26+Complaints%E2%80%99+%7C+a.+%E2%80%98Appeals+in+Cases+Not+Judicial%E2%80%99+470&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F104eb0485a.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/104eb0485a.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-jurisprudence/#:~:text=Th <blockquote><p>Question 8: May a guilty person plead not guilty, or deny the fact? Answer: Common use is the interpreter of words: If the common use of those words does make their public sense a lie, it may not be done. But if the forensic [legal] common use of the denial is taken to signify no more but this, ‘Let him that accuses me, prove it’ [then]: I am not bound to accuse my self, or, in foro [in court] I am not guilty till it be proved, then it is lawful to plead ‘not-guilty’ and deny the fact, except in cases wherein you are bound to an open confession, or in which the scandal will do more hurt than the denial will do good.</p></blockquote>

<blockquote><p>9. The prime Positive Law of God is the Judicial Law, which God by the ministry of Moses, prescribed to the people of Israel, wherein the Lord was pleased to be the particular Lawgiver and Judge of that people, whom He had chosen from among all nations for a peculiar people to Himself, and to whose inclinations it is befitted. There are not a few who esteem the Judicial Law obliging unto all nations, mainly, because it does not appear in the Gospel, to be abolished as the Ceremonial Laws are, and because of its excellency beyond the laws of heathens, or other men, who might not only err in expediency, rendering their laws unprofitable, but also might make them unjust and inconsistent with the immutable moral Law of Nature; which reasons do sufficiently infer, that in the constitution of human laws, chief respect ought to be had to the Judicial Laws of God, and they assumed where the inclination of the people and their condition do not render them inconvenient. But that these laws were accommodat[ed] unto the Jews proper temper, is evident in the law concerning the bill of divorcement [Dt. 24:1-4], which bears, to be permitted for the hardness of their hearts; which was natural and peculiar to them, of jealousy and bitterness against their wives, therefore the Lord not only appointed trial, neither natural, necessary, nor accustomed elsewhere, by those tokens of virginity, for evidencing the wife’s unfaithfulness in not giving a polluted woman for a chaste [Dt. 22:14-20], but also the extraordinary and miraculous trial, by the water of jealousy [Num. 5:12-31], and therefore Christ did expressly abrogate that law [Mt. 5:31-32] and show us that Moses did not command to divorce, but for the hardness of their hearts only permitted it, and did command that when the husband would put away his wife, he should give her a bill of divorce, but it does not follow that the Judicial Law is in itself a Law to all nations, or that the Lord purposed it so to her, but on the contrair, it appears that his purpose was only to deliver it, for a peculiar Law to Israel, when He says, ‘What nation is so great that has statutes and judgments so righteous, as is all this Law, which I set before you this day,’ Dt. 4:8. And again ‘He shows his Word unto Jacob, his statutes and judgments to Israel, He has not dealt so with every nation, and as for his Judgments, they have not known them.’ Ps. 147:19 And therefore the same Law was not to Israelites and to strangers, even to proselytes; as appears in the matter of usury and bondage, which were allowed to strangers, but the former simply forbidden, and the latter limited as to Israelites: Neither is there any necessity of an express abolition of this Law in the Gospel, seeing it was not given to all nations; and it does yet bind the Jews so far as it does not build upon the Ceremonial Law: And therefore that part of the Judicial Law, which is founded upon, or conducible to the Moral Law may be well received by other nations, to whose inclination the same expediences will agree as most of the criminal laws are…</p></blockquote>

itted+it%2C+and+did+command+that+when+the+husband+would+put+away+his+wife%2C+he+should+give+her+a+bill+of+divorce%2C+but+it+does+not+follow+that+the+Judicial+Law+is+in+itself+a+Law+to+all+nations%2C+or+that+the+Lord+purposed+it+so+to+her%2C+but+on+the+contrair%2C+it+appears+that+his+purpose+was+only+to+deliver+it%2C+for+a+peculiar+Law+to+Israel%2C+when+He+says%2C+%E2%80%98What+nation+is+so+great+that+has+statutes+and+judgments+so+righteous%2C+as+is+all+this+Law%2C+which+I+set+before+you+this+day%2C%E2%80%99+Dt.+4%3A8.+And+again+%E2%80%98He+shows+his+Word+unto+Jacob%2C+his+statutes+and+judgments+to+Israel%2C+He+has+not+dealt+so+with+every+nation%2C+and+as+for+his+Judgments%2C+they+have+not+known+them.%E2%80%99+Ps.+147%3A19+And+therefore+the+same+Law+was+not+to+Israelites+and+to+strangers%2C+even+to+proselytes%3B+as+appears+in+the+matter+of+usury+and+bondage%2C+which+were+allowed+to+strangers%2C+but+the+former+simply+forbidden%2C+and+the+latter+limited+as+to+Israelites%3A+Neither+is+there+any+necessity+of+an+express+abolition+of+this+Law+in+the+Gospel%2C+seeing+it+was+not+given+to+all+nations%3B+and+it+does+yet+bind+the+Jews+so+far+as+it+does+not+build+upon+the+Ceremonial+Law%3A+And+therefore+that+part+of+the+Judicial+Law%2C+which+is+founded+upon%2C+or+conducible+to+the+Moral+Law+may+be+well+received+by+other+nations%2C+to+whose+inclination+the+same+expediences+will+agree+as+most+of+the+criminal+laws+are%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+James+Dalrymple%2C+The+Institutions+of+the+Law+of+Scotland%2C+vol.+1%2C+p.+5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F16ee5f6fb3.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/16ee5f6fb3.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/covenant-of-grace/the-mosaic-covenant/the-civil-law/#:~:text=9.%20The%20prime%20Positive%20Law%20of,most%20of%20the%20criminal%20laws%20are&amp;text=9.%20The%20prime%20Positive%20Law%20of%20Go

<main class="wrap"><figure class="quote" id="q-59f4555384" data-kw="">
<blockquote><p>Christ’s first disciples were chosen by Him in order that they might disperse throughout the whole world, and preach His faith everywhere, according to Mt. 28:19, “Going… teach ye all nations.” Now it was not fitting that they who were being sent to teach others should need to be taught by others, either as to how they should speak to other people, or as to how they were to understand those who spoke to them; and all the more seeing that those who were being sent were of one nation, that of Judea, according to Is. 27:6, “When they shall rush out from Jacob [*Vulg.: ‘When they shall rush in unto Jacob,’ etc.]… they shall fill the face of the world with seed.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Summa</cite>, trans. Fathers of the English Dominican Province (Benziger Bros., 1947), 2nd part of 2nd part, Question 176, ‘Of the Grace of Tongues’, Article 1</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-5b319948f7" data-kw="">
<blockquote><p>But that gift of healing, like the rest of the miracles, which the Lord willed to be brought forth for a time, has vanished away in order to make the new preaching of the gospel marvelous forever. Therefore, even if we grant to the full that anointing was a sacrament of those powers which were then administered by the hands of the apostles, it now has nothing to do with us, to whom the administering of such powers has not been committed. … Therefore, they make themselves ridiculous when they boast that they are endowed with the gift of healing. The Lord is indeed present with his people in every age; and He heals their weaknesses as often as necessary, no less than of old; still He does not put forth these manifest powers, nor dispense miracles through the apostles’ hands. For that was a temporary gift, and also quickly perished partly on account of men’s ungratefulness.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of the Christian Religion</cite>, Calvin: Institutes of the Christian Religion, ed. John T. McNeill, trans. Ford Lewis Battles in The Library of Christian Classics, vol. 21 (Philadelphia: Westminster Press, 1960), vol. 2, bk. 4, ch. 19, sections 18-19, p. 1467</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/modern-errors.html">Modern Errors</a></span></div>

</figure><figure class="quote" id="q-20c8220a8a" data-kw="">
<blockquote><p>There is no more ground for such a ministration in this life [of the Spirit without Church ordinances] than there is for no death, no crying, no sorrow, no pain in this life, Rev. 21:4, no sun, nor moon, v. 23, no unclean thing, no sin, v. 27 and no more warrant for delivering up the Kingdom, in this life, 1 Cor. 15, than for the Resurrection of the Dead, 23:37, and the blowing of the Last Trumpet, [v.] 52, and the swallowing up of death in victory, 55-57, as if all these should come to pass in this life agreeable to this, says H. Nicholas, Evangel. ch. 35. sec. 9. In which Resurrection of the Dead, God shows unto us that the time is now fulfilled, that his dead, or the dead which are fallen asleep in the Lord, rise up in this day of his judgement and appear unto us in godly glory, which shall also henceforth live in us everlastingly with Christ, and reign upon the earth, wherein the Scripture comes to be fulfilled in this present day. And Saltmarsh wills these that are as spiritual as himself and his Familists, to believe this and receive it, that is, except, we make shipwreck of faith and say the Resurrection is past in this life, as did Hymeneus and Philetus, we are all legal, literal men and void of the Spirit.

2. Saltmarsh is unwilling to contradict the truth of God, 1 Cor. 15:24, too openly, to wit, that in the end the Kingdom shall be delivered up: Now whether this be meant of Christ’s reigning no more in his Church in this life by ordidinances, or as Chrysostom does expound the place, it be the rendering up to the Father his conquished and purchased people, as it is most agreeable to Eph. 5:27, I dispute not now, but Saltmarsh says faintly, This is not only done on the whole body of Christ at the last, but also here. He dares not say this rendering up is not only at the Last Day, but also in this life; yet the apostle is clear, he thought of no rendering up of the Kingdome in this life, as Saltmarsh by this new spirit supposes, for the text is clear, v. 22-23, every man shall rise again from the dead, Christ first and then his members [Greek], ‘Then is the end when He shall deliver up the Kingdom to the Father.’ Then: [1.] there is no rendering up till the dead in Christ be raised, vv. 23-24, but the dead in Christ in their bodies (of which undoubtedly the apostle speaks, 1 Cor. 15:1-4, etc. do not rise in this life.

2. This rendering up is not till the end, then shall the end be.

3. It is when all rule and authority shall be put down, v. 27; this is not in this life.

4. It is when the last enemy shall be subdued, v. 26.

5. When God shall be all in all, v. 28. These are not in this life, therefore Saltmarsh dreams.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Survey of the Spiritual Antichrist, Opening the Secrets of Familism &amp; Antinomianism</cite>, ... (London, 1648) | pt. 1 | ch. 34, ‘A taste of the wild allegoric interpretations of Scripture that are in this piece of Saltmarsh, which he fathers upon the pure immediate actings of the Spirit beyond Law and Gospel’, pp. 287-88</span></figcaption>

<blockquote><p>Fecundity: “increase and multiply.” These words can have: (1) an imperative sense, in which way the ancient Hebrews wanted there to be here a universal precept, placed upon all people, of contracting marriage, which they call ונמה פיריה מצות” ,the commandment of fruitfulness and multiplication,” because one who does not confirm this commandment has no part, they say, in the age to come. But in this way the commandment would fall even upon brute beasts, since the same thing is said of them in verse 22; in this way also there would be a commandment to have dominion over the fish, “have dominion over the fish of the sea,” and so forth. (2) A concessive sense, just as in Genesis 2:16 and Deuteronomy 14:11, 20. Finally, (3) a promissory sense, so that the imperative stands in place of the future, “increase” in place of “you will increase,” and so forth, such that he is promising fertility, power, and appetite to beget what is similar to them; hence this is said only of fecund things, but not of light, stars, plants, and so forth.</p></blockquote>

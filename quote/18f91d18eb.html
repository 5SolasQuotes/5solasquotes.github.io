<main class="wrap"><figure class="quote" id="q-18f91d18eb" data-kw="">
<blockquote><p>Let every man consider his own sins, which he himself is guilty of. Have we not broken the holy, and righteous Commandments of God a thousand times, and shall not this break our hearts? Have we not broken our vows and covenants which we have often made with God, and will not the meditation of this break our hearts? God in Scripture is said to have a bag and a bottle. A bag to put our sins in, and a bottle to put our tears in. Have we not filled God’s bag with our sins, and shall we not now fill Gods bottle with our tears?

Doth it not grieve us, that we have so often grieved the Holy Spirit of God? Are we not heavy laden with those sins, with which God himself is pressed as a Cart with sheaves? Is not God himself broken with our whorish hearts, and will not this break our hard hearts? Have we not had years of sinning? Oh let us have one Day of mourning! Have we not trampled the blood of Christ under our feet, and shall not the blood of this Scapegoat melt our adamantine hearts?

It is an excellent saying, That in all the sins we commit, we must not so much consider the sin that is committed, as the God against whom it is committed. And this will provoke us to great Humiliation for little sins, as well as great sins. For there is no sin simply little. [1] There is no little God to sin against. The lest minimum spiritual, the least offence is committed against an infinite God; and therefore deserves [2] infinite punishment. There was no little price paid for little sins; the least sin cost the shedding of the blood of the eternal God. [3] There is no little disobedience in a little sin. For as there is the same rotundity in a little round Ball, as in a great one: So there is the same disobedience against God, in a little sin, [4] as well as in a great one. To disobey God in a little, is no little disobedience. There is no little unthankfulness in a little sin. For the lesser the thing is, in which we offend God, the greater is the unthankfulness, that we will sin against God, for so little a matter. There is no little [5] pollution and defilement, in a little sin. A little puddle may dirty a man, as well as a great one. A little Bodkin may wound a Caesar to death. [6] There is no little punishment, for little sins; For the wages of sin is death. The wages of sin as sin, and therefore of every sin. A quatenus ad omne valet consequentia. Non est distinguendum ubilex non distinguit.

And therefore let us I beseech you, mourn with a great lamentation, for our little oaths, our idle words, our omissions of good duties, and defects in good duties, &amp;c. Can we mourn for the loss of our estates, for the death of our Children? And shall we not mourn that we have lost God, and the peace of a good conscience by our sins; and that our hearts are so dead and dull to goodness?

Can we cry for the stone in the bladder, and not for a stony heart? The stone in the bladder can but kill the body; but a stony heart will cast body and soul into Hell. Weep for those diseases that will destroy soul and body for ever. We have been often in the valley of Hinnon, sacrificing our sons and daughters unto Devils, by their wicked educations; improving our parts and mercies, to the service of the Devil. Oh, let us this day descend into the Valley of Bacah, and let us make this Church a Bochim, a place of weeping. We have many Church-sins, Sermon sins, Sacrament-sins. Let us have Church-tears for our Church-sins.</p></blockquote>

<blockquote><p>The sin against the Holy Ghost indeed is distinct and something different from this sin unto death that our apostle [John] speaks of… It is true indeed that a sin in which a man continues unrepenting until his death and in which he dies, may very justly be called ‘a sin to death,’ that is, ‘a sin until his death,’ and it will prove a sin to death eternal, but that the apostle means here a particular sin, and that he estimates it not by its length but by its weight, not by how long the party continues in it, but by how grievous the sin is in itself, will appear as we go along, partly by discovery of the reason of the title he puts upon it, and partly by discovery of the very sin itself that is here intended…</p></blockquote>

<blockquote><p>The predicate; “They have crucified the flesh, with the affections and lusts.” By flesh we are here to understand carnal concupiscence, the workings and motions of corrupt nature; and by the affections we are to understand, not the natural, but the inordinate affections; for Christ does not abolish and destroy, but correct and regulate the affections of those that are in him:

And by crucifying the flesh, we are not to understand the total extinction or perfect subduing of corrupt nature, but only the deposing of corruption from its regency and dominion in the soul; its dominion is taken away, though its life be prolonged for a season; but yet, as death surely, though slowly, follows crucifixion, (the life of crucified persons gradually departing frown them, with their blood) it is just so in the mortification of sin; and therefore what the apostle in this place calls crucifying, he calls in Rom. 8:13. mortifying. “If ye, through the Spirit, do mortify,” … if ye put to death the deeds of the body:

But he chuses, in this place, to call it crucifying, to show not only the conformity there is betwixt the death of Christ and the death of sin, in respect of shame, pain, and lingering slowness; but to denote also the principal means and instruments of mortification, viz. the death, or cross of Jesus Christ, in the virtue whereof believers do mortify the corruptions of their flesh; the great arguments and persuasives to mortification being drawn from the sufferings of Christ for sin. In a word, he does not say, They that believe Christ was crucified for sin, are Christ’s; but they, and they only, are his, who feel as well as profess the power and efficacy of the sufferings of Christ, in the mortification and subduing of their lusts and sinful affections.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Method of Grace in the Gospel-Redemption</cite>, (1699) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 369.</span></figcaption>

— John Flavel, The Method of Grace in the Gospel-Redemption, (1699) in The Works of John Flavel (1820; 6 vols, London: Banner of Truth: 1968), 2: 369.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+predicate%3B+%E2%80%9CThey+have+crucified+the+flesh%2C+with+the+affections+and+lusts.%E2%80%9D+By+flesh+we+are+here+to+understand+carnal+concupiscence%2C+the+workings+and+motions+of+corrupt+nature%3B+and+by+the+affections+we+are+to+understand%2C+not+the+natural%2C+but+the+inordinate+affections%3B+for+Christ+does+not+abolish+and+destroy%2C+but+correct+and+regulate+the+affections+of+those+that+are+in+him%3A%0A%0AAnd+by+crucifying+the+flesh%2C+we+are+not+to+understand+the+total+extinction+or+perfect+subduing+of+corrupt+nature%2C+but+only+the+deposing+of+corruption+from+its+regency+and+dominion+in+the+soul%3B+its+dominion+is+taken+away%2C+though+its+life+be+prolonged+for+a+season%3B+but+yet%2C+as+death+surely%2C+though+slowly%2C+follows+crucifixion%2C+%28the+life+of+crucified+persons+gradually+departing+frown+them%2C+with+their+blood%29+it+is+just+so+in+the+mortification+of+sin%3B+and+therefore+what+the+apostle+in+this+place+calls+crucifying%2C+he+calls+in+Rom.+8%3A13.+mortifying.+%E2%80%9CIf+ye%2C+through+the+Spirit%2C+do+mortify%2C%E2%80%9D+%E2%80%A6+if+ye+put+to+death+the+deeds+of+the+body%3A%0A%0ABut+he+chuses%2C+in+this+place%2C+to+call+it+crucifying%2C+to+show+not+only+the+conformity+there+is+betwixt+the+death+of+Christ+and+the+death+of+sin%2C+in+respect+of+shame%2C+pain%2C+and+lingering+slowness%3B+but+to+denote+also+the+principal+means+and+instruments+of+mortification%2C+viz.+the+death%2C+or+cross+of+Jesus+Christ%2C+in+the+virtue+whereof+believers+do+mortify+the+corruptions+of+their+flesh%3B+the+great+arguments+and+persuasives+to+mortification+being+drawn+from+the+sufferings+of+Christ+for+sin.+In+a+word%2C+he+does+not+say%2C+They+that+believe+Christ+was+crucified+for+sin%2C+are+Christ%E2%80%99s%3B+but+they%2C+and+they+only%2C+are+his%2C+who+feel+as+well+as+profess+the+power+and+efficacy+of+the+sufferings+of+Christ%2C+in+the+mortification+and+subduing+of+their+lusts+and+sinful+affections.%E2%80%9D%0A%0A%E2%80%94+John+Flavel%2C+The+Method+of+Grace+in+the+Gospel-Redemption%2C+%281699%29+in+The+Works+of+John+Flavel+%281820%3B+6+vols%2C+London%3A+Banner+of+Truth%3A+1968%29%2C+2%3A+369.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6586ea429d.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6586ea429d.html">Permalink</a><a class="src" href="https://reformedcovenanter.wordpress.com/2020/01/18/john-flavel-on-carnal-concupiscence/" rel="noopener" target="_blank">Read it online · Reformed Covenanter</a></div>
</figure><figure class="quote" id="q-892fa01c51" data-kw="">
<blockquote><p>Seeing that bold and rash men overshoot them selves so far, as to give judgement of that which is known to one only God, and oft forgetting what they them selves ought to be, and how they ought to live according to God’s will, cruelly condemn those on whom the Lord will have mercy: It is good first to note that not all sin which seemeth to be against the holy Ghost, is sin against the holy Ghost in deed: for there are many that resist the truth of the Gospel, whereof it seemeth they have had some knowledge, which nevertheless sin not against the holy Ghost, in as much as it is joined with some ignorance which exempteth them from this horrible sin which is not pardoned in this world, nor in the world to come. Which S. Paul signifieth, saying: that he obtained pardon, because that through ignorance and for lack of faith he had been a blasphemer, a persecutor and oppressor: whereby it followeth that not all sin (wherewith man resisteth the truth of God) is sin against the holy Ghost.

But when man is so touched with the light of the truth, that he cannot pretend ignorance, and nevertheless of determinate malice resisteth, then he sinneth against the holy Ghost, and it is not possible for him to be renewed by repentance, in that he hath forsaken God and is become an Apostate or forsaker of Christianity. Such were the Scribes and Pharisees, who having the knowledge of the Law, and seeing the manifest works of the power of God, attributed the miracles which Jesus Christ wrought, to Beelzebub.

Such were they also which resisted S. Stephen, and of determinate purpose blamed that doctrine, whereof they could not be ignorant but that it proceeded from God: as that holy Martyr likewise reproved them, when he was ready to shed his blood in the defence of the doctrine of the Gospel. For if S. Stephen had delt with ignorant men, he would have used them otherwise. But seeing that they raged against God, and went about to rob God of his honour, he boldly pronounceth that they withstand the holy Ghost, let us then conclude that they sin against the holy Ghost, who having the knowledge of God truth, doo nevertheless of determinate malice resist the same.</p></blockquote>

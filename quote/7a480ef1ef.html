<main class="wrap"><figure class="quote" id="q-7a480ef1ef" data-kw="">
<blockquote><p>…the word ‘worship’ is taken for the inward worship of God commanded in the First Commandment, also comprehending our fear, love of God and joy in Him, issuing from the knowledge of the true God. All our obedience issuing herefrom is worship of God, including our duties to man, in obedience and relation to God’s Commandment. The ground of this obedience and worship is the relation between God and the reasonable creature, being the image of God…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-sibbes.html">Richard Sibbes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Third Chapter of the Epistle of St. Paul to the Philippians</cite>, … (London: Cotes, 1639), verse 3, ‘which worship God’, p. 44</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-3c364f2acd" data-kw="">
<blockquote><p>For principally and properly God is worshipped in our spirit: Jn. 4:24, ‘The true worshippers shall worship the Father in spirit.’ Rom. 1:9, ‘Whom I serve in my spirit.’ 1 Pet. 3:15, ‘Sanctify God in your hearts.’ By the ‘spirit’ I understand the thought of the mind, the consience and the affections of the heart. For in these is the first and principal seat of divine and spiritual worship. As for the body, it is but a secondary instrument of the service of God… the true religion of the New Testament has but few prescribed ceremonies and for the most part is divine and spiritual.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-perkins.html">William Perkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘A Warning Against the Idolatry of the Last Times, &amp; an Instruction touching Religious or Divine Worship’ in The Works</cite>, (London: Legatt, 1626), vol. 1, p. 700</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/nature-of-worship.html">Nature of Worship</a></span></div>

</figure><figure class="quote" id="q-447a4bfa17" data-kw="">
<blockquote><p>Too high an estimation of any peculiar way of worship is apt to entice the minds of some into a hurtful confidence in these things. Having an apprehension that they alone have attained unto the right way of gospel worship and the administration of its ordinances, and that, perhaps, on such accounts as wherein they are eminently deceived, they begin first greatly to value themselves, and then to despise all others, and, if they can, to persecute them. This insensibly works them into a trust in that which they esteem so excellent, and that unto an open neglect of things of a greater weight and moment. Thus is it not unusual to see persons who are under the power of some singular opinion and practice in religion to make one thing almost their whole business, the measure of other things and persons, the rule of communion and of all sincere love;—to value and esteem themselves and others according unto their embracing or not embracing of that opinion… Wherefore, although we ought greatly to prize and to endeavour after the true order of the church of Christ, the purity of worship, and regular administration of ordinances, yet let us take heed that we prize not ourselves too much on what we have attained; for if we do so, we shall be very apt to countenance ourselves in other neglects thereby, which will certainly bring us into a spiritual sickness and declension.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Owen</cite>, (NY: Robert Carter, 1852), vol. 7, Nature &amp; Causes of Apostasy from the Gospel, ch. 12, pp. 252-53</span></figcaption>

17.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/#:~:text=Too%20high%20an%20estimation%20of%20any,into%20a%20spiritual%20sickness%20and%20declension&amp;text=Too%20high%20an%20estimation%20of%20any%20peculiar%20way&amp;text=bring%20us%20into%20a%20spiritual%20sickness%20and%20declension" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-99a9ac7b49" data-kw="">
<blockquote><p>All means of worship devised by men pretending holiness, by teaching, exciting our dull affections to devotion, as if they were powerful means of grace, and did lay a band on the conscience, when as yet they be no such thing, and want all warrant from God, and are contrary to devotion, are unlawful.</p></blockquote>

</figure><figure class="quote" id="q-2fec549f42" data-kw="">
<blockquote><p>The internal worship may be considered either as habitual or actual. As habitual, and so we are bound to worship God at all times, the obligation holding both semper et ad semper [always and to all times]. As actual, and so we are bound to worship Him on all occasions the circumstances whereof make it a duty so to do.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-stoddon.html">Samuel Stoddon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Essay on a Question Relating to Divine Worship viz. Whether it be Contrary to the Apostolical Laws of Decency &amp; Reverence for a Man to have his Head Covered</cite>, … (London: Maxwell, 1682), p. 5 Stoddon was an English, congregationalist minister.</span></figcaption>

<main class="wrap"><figure class="quote" id="q-34356f5269" data-kw="">
<blockquote><p>THERE is one general remark on our Lord’s teaching as to the Sabbath, which may fitly precede the consideration of the special argument in the text. The remark is this: Often as our Lord was assailed and annoyed with questions about the Sabbath, he never once gave the slightest hint of there being any intention on his part to abolish the institution. This is the more remarkable, when we consider that he had no reserve in announcing the coming changes as to the place of worship, and the manner of worship.

As to the place of worship, – in conversing with the woman of Samaria (John iv.), when she asked whether Jerusalem or her own mountain was the ordained and sanctioned seat of worship, the Lord decides the controversy in favour of the Jews. But he takes care to add that the occasion of the controversy was about to disappear; the consecration of Jerusalem, or of any particular spot, as pre-eminently a centre of religious influence or authority, is to cease: “Woman, believe me, the hour cometh, when ye shall neither in this mountain, nor yet at Jerusalem, worship the Father. Ye worship ye know not what we know what we worship: for salvation is of the Jews. But the hour cometh, and now is, when the true worshippers shall worship the Father in spirit and in truth: for the Father seeketh such to worship him. God is a spirit: and they that worship him. must worship him in spirit and in truth.” (John iv. 21-24.)

So also in regard to the manner of worship; the Lord seems almost anxious to press the announcement that the temple worship is to be superseded and abolished. Once and again he figuratively puts himself in the place of the temple, and makes his own death and resurrection represent the ruin of one religious structure or economy, and the erection of another in its stead. And in a literal prophecy of great solemnity, he foretells the utter overthrow of the building; and, in consequence, the final abrogation of its services. All the more striking, on that account, is the silence of our Lord as to any contemplated alteration in the stated time of worship, any prospective repeal of the law of the Sabbath. Not a hint of the sort occurs in any one of the many conversations which he had to carry on, with reference to that very matter.

For my part, I am altogether at a loss to imagine how Christ, – I say not as a divine teacher, but simply as a fair teacher, could so often discuss points of debate about the manner of keeping the Sabbath, without uttering so much as a single word to indicate that, in his kingdom, the very bone of contention itself the institution to which the controversy related-was to be materially modified at least, if not to be taken bodily out of the way. If a change of that sort had really been in contemplation, I cannot conceive how He who is “the faithful witness,” could say so much about the Sabbath and the way of keeping it, without the shadow of a warning that, under his reign, the Sabbath is to cease, or its character is to be changed.

It would be impossible here to consider collateral arguments. Old Testament prophecy (Ps. cxviii. 22-24) seems to predict, and New Testament phraseology, speaking of “the Lord’s day,” seems to imply, the change which has taken place from the seventh day of the week to the first; and good reasons can be given for that change not being more abruptly and formally enjoined. The analogy of the Scriptures as a whole may be powerfully urged, in favour of the continued obligation of a weekly day of rest.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-candlish.html">Robert Candlish</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Letter to the Sabbath: The Sabbath made for Man; The Son of Man Lord of it. A Sermon (Edinburgh: Johnstone &amp; Hunter, 1856), pp 7-11.</cite></span></figcaption>

<blockquote><p>…one of our doctors objects that we lift up our eyes and our hands to heaven and worship God, yet do not worship the heaven: that a man going to bed prays before his bed: that David offered the sacrifices of thanksgiving in the presence of all the people, Ps. 116, that Paul having taken bread gave thanks before all them who were in the ship, Acts 27:35, that the Israelites worshipped before Moses and Aaron, Ex. 4:31. Hereupon another doctor harping on the same string tells us that when we kneel in the act of receiving the sacrament, we kneel no more to bread than to the pulpit when we join our prayers with the ministers. Oh, unworthy instances and reproachful to doctors! All these things were and are accidentally present to the worshippers and not purposely before them, not respected as having a religious state in the worship. What? do we worship before the bread in the sacrament even as before a pulpit, a bed, etc? Nay, graduate men should understand better what they speak of.</p></blockquote>

<blockquote><p>We say that it is a superstition to esteem one day more holy than another. or to think that to abstain from labor is something which, in itself, pleases God (Rom 14:5, 6; Col 2:16, 17). But, following what the Lord has commanded, we sanctify one of the seven days (Gen 2:3). We devote it entirely to ecclesiastical assemblies to hear the Word of God; yet, as we have said, there is with us not Judaistic ceremony or stupid superstition. This is why we have not chosen the Jewish Sabbath, Saturday, but Sunday, following the custom of the early church (1 Cor 16:2; Acts 20:7; Rev 1:10). As for other festival days, we have removed them as much as possible from us, especially those which have been introduced through manifest idolatry. We have done this so as to correct the innumerable abuses which flowed from such, and to relieve the poverty of many. Nevertheless, because there are certain festivals devoted, since ancient times, to the celebration of certain mysteries concerning our redemption, we use Christian liberty, and submit all to edification, according to the different circumstances of pleas, times, and persons.</p></blockquote>

<blockquote><p>The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day [Ex. 35:3] was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsettled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“The reasons by which it appears that this restraint of kindling a fire [by the Israelites in the wilderness] on the Sabbath day [Ex. 35:3] was only temporary, are these: … Secondly, this seems to cross our Savior’s general rule, Mk. 2:27, that the Sabbath was made for man, and not man for the Sabbath; He means for man’s comfort and refreshing, for which kindling of fire and dressing of meat may be, and are in a sort necessary. Thirdly, our Savior allows the loosing of a beast from the stall, and leading of him to the water on the Sabbath day: now we know, the beast might be provided for by setting water in the stall overnight, which would refresh it sufficiently, and better than meat dressed overnight could comfort many men. Fourthly, we find our Savior present at a great feast, Lk. 14:1, where many, and it seems persons of quality, verses 7, 12, were bidden: now it is very unlikely that the provisions for that feast were dressed over night; and if it were dressed on that day, neither would the Pharisee have permitted, nor our Savior have countenanced the dinner with his presence, if dressing of meat, kindling of fires on the Sabbath day, had been forbidden by the law. Now why the dressing of manna, while the Israelites were in their peregrination in the wilderness was forbidden, though the dressing of other meats might be allowed afterwards, there may be some reason given. For manna it may be… as good and comfortable eaten cold as hot, and the preparing overnight, might be no inconvenience at all; howsoever it is out of question that in that unsettled condition of the Israelites wandering in the wilderness, when they were enforced to pick up fuel, where they could get it, baking and boiling must needs be more troublesome and laborious than it was afterwards in Canaan, where being settled in their dwellings, they had all things whereof they were to make use for such works provided and ready at hand.”

— John White, A Way to the Tree of Life Discovered in Sundry Directions for the Profitable Reading of the Scriptures, ... (1647), A Digression concerning the Morality of the Fourth Commandement, Section III, ‘The Morality &amp; Perpetuity of the Sabbath Proved out of the Fourth Commandement’, pp. 294-95 White was a Westminster divine.">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CThe+reasons+by+which+it+appears+that+this+restraint+of+kindling+a+fire+%5Bby+the+Israelites+in+the+wilderness%5D+on+the+Sabbath+day+%5BEx.+35%3A3%5D+was+only+temporary%2C+are+these%3A+%E2%80%A6+Secondly%2C+this+seems+to+cross+our+Savior%E2%80%99s+general+rule%2C+Mk.+2%3A27%2C+that+the+Sabbath+was+made+for+man%2C+and+not+man+for+the+Sabbath%3B+He+means+for+man%E2%80%99s+comfort+and+refreshing%2C+for+which+kindling+of+fire+and+dressing+of+meat+may+be%2C+and+are+in+a+sort+necessary.+Thirdly%2C+our+Savior+allows+the+loosing+of+a+beast+from+the+stall%2C+and+leading+of+him+to+the+water+on+the+Sabbath+day%3A+now+we+know%2C+the+beast+might+be+provided+for+by+setting+water+in+the+stall+overnight%2C+which+would+refresh+it+sufficiently%2C+and+better+than+meat+dressed+overnight+could+comfort+many+men.+Fourthly%2C+we+find+our+Savior+present+at+a+great+feast%2C+Lk.+14%3A1%2C+where+many%2C+and+it+seems+persons+of+quality%2C+verses+7%2C+12%2C+were+bidden%3A+now+it+is+very+unlikely+that+the+provisions+for+that+feast+were+dressed+over+night%3B+and+if+it+were+dressed+on+that+day%2C+neither+would+the+Pharisee+have+permitted%2C+nor+our+Savior+have+countenanced+the+dinner+with+his+presence%2C+if+dressing+of+meat%2C+kindling+of+fires+on+the+Sabbath+day%2C+had+been+forbidden+by+the+law.+Now+why+the+dressing+of+manna%2C+while+the+Israelites+were+in+their+peregrination+in+the+wilderness+was+forbidden%2C+though+the+dressing+of+other+meats+might+be+allowed+afterwards%2C+there+may+be+some+reason+given.+For+manna+it+may+be%E2%80%A6+as+good+and+comfortable+eaten+cold+as+hot%2C+and+the+preparing+overnight%2C+might+be+no+inconvenience+at+all%3B+howsoever+it+is+out+of+question+that+in+that+unsettled+condition+of+the+Israelites+wandering+in+the+wilderness%2C+when+they+were+enforced+to+pick+up+fuel%2C+where+they+could+get+it%2C+baking+and+boiling+must+needs+be+more+troublesome+and+laborious+than+it+was+afterwards+in+Canaan%2C+where+being+settled+in+their+dwellings%2C+they+had+all+things+whereof+they+were+to+make+use+for+such+works+provided+and+ready+at+hand.%E2%80%9D%0A%0A%E2%80%94+John+White%2C+A+Way+to+the+Tree+of+Life+Discovered+in+Sundry+Directions+for+the+Profitable+Reading+of+the+Scriptures%2C+...+%281647%29%2C+A+Digression+concerning+the+Morality+of+the+Fourth+Commandement%2C+Section+III%2C+%E2%80%98The+Morality+%26+Perpetuity+of+the+Sabbath+Proved+out+of+the+Fourth+Commandement%E2%80%99%2C+pp.+294-95+White+was+a+Westminster+divine.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd42f7d329e.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/d42f7d329e.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/what-does-keeping-the-lords-day-entail/#:~:text=The%20reasons%20by%20which%20it%20appears,works%20provided%20and%20ready%20at%20hand&amp;text=The%20reasons%20by%20which%20it%20appears%20that%20this&amp;text=for%20such%20works%20provided%20and%20ready%20at%20hand" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<main class="wrap"><figure class="quote" id="q-26e61ab33a" data-kw="">
<blockquote><p>The moral inability is not less because there is no want [lack] of natural ability, members, senses, or faculties in man. The need of a nature, principle, and disposition to act in a holy manner is as great an inability to it as if there was a want [lack] of members or faculties to operate in a natural manner. As the body cannot act without the soul, so the soul cannot do anything that is holy without the divine nature. 2 Peter 1:4. As the eye cannot behold any thing without the humor [transparent fluid in the eye], so the soul cannot act in a holy manner, though possessed of all the faculties, without a holy principle and disposition to do so. A spiritual life is as necessary to act in a holy manner, as natural life is for its actions…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-elias.html">John Elias</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Moral Inability of Man’</cite>, 1847, reprinted 1973, Banner of Truth, p. 365</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4d9204281e" data-kw="">
<blockquote><p>We ought to take care, on the other hand, lest, by proving that it is not the lack of members, senses, or faculties that accounts for man’s inability to act in a spiritual manner, we should set forth that weakness as something small, and that man may remove it by some endeavor of his own…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-elias.html">John Elias</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘On the Moral Inability of Man’</cite>, 1847, reprinted 1973, Banner of Truth, p. 367</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/free-will-and-inability/liberty-and-necessity.html">Liberty and Necessity</a></span></div>

</figure><figure class="quote" id="q-4a2e857a3c" data-kw="">
<blockquote><p>…the will, for Aquinas, just is the inclination of a rational substance toward what the intellect judges to be good… for Aquinas the will inclines of necessity toward what the intellect judges to be good, and in particular at what we judge will bring happiness. That does not entail that we cannot will what we judge to be in some way bad. Aquinas’s view is rather that whenever we will some end, it is because of some good we judge it to have, even if the intellect acknowledges it to be bad in other respects. At the moment of choice, it is the good that the intellect sees in it that it focuses on, and the will opts for it under that aspect. Though I follow here the common practice of speaking about what the intellect sees, what the will opts for, and so on, it is important to emphasize that strictly sepaking, it is the person or rational substance who does these things. The intellect and will are powers or capacities of this substance rather than substances in their own right. When it is said that the intellect knows something, this is to be understood as a shorthand way of saying that the person knows it, by virtue of his intellect. Similarly, when it is said that the will chooses some end, this is a shorthand way of saying that the person chooses it, by virtue of his will. Now many ends are pursued for the sake of further ends. You labor in order to earn an income… But Aquinas holds that there must be one ultimate end toward which all our actions are directed… he hold that that end is happiness. Moreover, he argues that what alone can bring happiness is to know and love God. That is not to deny that people disagree about what will bring happiness, and that many seek it in something other than God. The point is that whatever ultimate end they seek, they seek it as that which they suppose will bring happiness. And, Aquinas holds, what alone can really bring it is in fact God, even if some do not see that.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Immortal Souls: a Treatise on Human Nature</cite>, (Editiones Scholasticae, 2024), pt. 4, ‘What is the Soul’ Feser is an Analytical Thomist., ch. 10, ‘Immortality’, pp. 478-79</span></figcaption>

</figure><figure class="quote" id="q-be619dae70" data-kw="">
<blockquote><p>§X. Impotence is wont to be distinguished into physical or natural, and moral: The former arises from a defect of the natural faculty required for doing something; e.g., in the deaf for hearing; in the blind for seeing; in a wall for speaking. The latter has its origin from a voluntary evil disposition of the soul and a perverse custom, such as is in a drunken man, a gambler, and a thief; of whom the first cannot abstain from drink, the second from gaming, the third from theft. If these things are applied to the present theological matter; the impotence which is congenital to man after the Fall, and is in him from his very birth, can be called natural, not because it is a destruction of the will and of the natural liberty of the will, but because, having arisen from the first sin of Adam, it has degenerated as it were into nature and is transmitted to posterity: as if leprosy, a stone, epilepsy, or another kind of disease is propagated from parents to children by the contagion of nature through natural generation.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/barthold-holtzfus.html">Barthold Holtzfus</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Theological Dissertation on Creation’</cite>, trans. AI by Nosferatu (Frankfurt: Zeitler, 1707), p. 24 Latin</span></figcaption>

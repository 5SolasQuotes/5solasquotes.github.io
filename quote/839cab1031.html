<main class="wrap"><figure class="quote" id="q-839cab1031" data-kw="">
<blockquote><p>779. Now besides this justification of the sinner which has its place in the first conversion of the sinner to God and which is renewed so long as he repents (for the faithful life is the continual exercise of faith), he is also given a justification of the just which is by works, which James discusses. 780. By this we understand the declaration of God with respect to the accusation of Satan, since in the regenerated sinner are true, colored, and indubitable signs and proofs of true faith which are pleasing to Him, and which are required among the heirs of the goods of grace. 781. This second justification is necessarily connected with the first (it is necessary to distinguish this from the variation of the Papists) so that it cannot be separated from it for any reason.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/campegius-vitringa.html">Campegius Vitringa</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Fundamentals of Sacred Theology Pre</cite>, (d. 1722; RHB, 2024), ch. 21, ‘Justification…’, p. 186 Note Vitringa does not clearly join these two justifications as one, and it is said by the editor in a footnote that he later dropped the language of a “second” justification.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>26. Therefore, every true Christian who has actually returned into the grace of God, being now constituted in a state of grace, has a twofold righteousness—not acquired by his own free will or the powers of nature, but given to him by God through Christ—and both are necessary for his salvation: one imputed, the other inherent. The imputed is that which Christ has performed for him, to satisfy for all sins committed by him throughout his whole life; the inherent is that by which, through divine grace in Christ, he begins inwardly more and more to cease from sins to be committed hereafter, and strives most diligently to observe the divine law exactly. For by that imputed righteousness of Christ he is not freed from the keeping of the law, but rather bound to it more closely.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-bradshaw.html">William Bradshaw</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Dissertation on the Doctrine of Justification, in which a plain way is built up to the concord of them which vary on this thing</cite>, (d. 1618; Leiden, 1684), trans. ChatGPT-5, ch. 24, ‘Of the Effects of Justification’; sect. 26, pp. 114-15</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

</figure><figure class="quote" id="q-0faa64e055" data-kw="">
<blockquote><p>The word ‘justification’ I take in a wide sense, so as to embrace whatever we obtain from Christ, whether by imputation, or by the efficacy of the Spirit in sanctifying us… Thus also the word ‘to justify’ is taken in Rom. 8:30.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

<blockquote><p>4. That the promises concerning perseverance (as has been often intimated) are of two sorts. The first, of the continuance of the favor of God to us, which respects our justification. The other, of the continuance of our obedience unto God, which respects our sanctification… … 2. For those of the first sort, which I shall now handle… I shall propose only some few things unto consideration… … 2. That these promises of God do not properly, and as to their original rise, depend on any conditions in believers or by them to be fulfilled, but are the fountains and springs of all conditions whatever that are required to be in them or expected from them; though the grace and obedience of believers are often mentioned in them, as the means, whereby they are carried on according to the appointment of God unto the enjoyment (or continued in it) of what is promised.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of the Saints’ Perseverance, Explained &amp; Confirmed</cite>, ... (London, 1654), ch. 5, pp. 118-120</span></figcaption>

<blockquote><p>(2) Works required by the Law are either wrought before faith, without the aid of grace; or after believing, by the help of the Holy Ghost. The former are excluded from our justification, but not the latter. (3) Works of Obedience wrought after grace received, may be considered either as sincere only, or absolutely perfect according to what was originally required in the Covenant of Works. Those of the latter sort are excluded from any place in our justification, but not those of the former. … (5) Justification may be considered either as to its beginning or as unto its continuation, and so it has diverse causes under these diverse respects. (6) Works may be considered either as meritorious ex condigno, so as their merit should arise from their own intrinsic worth, or ex congruo only with respect unto the Covenant and promise of God. Those of the first sort are excluded at least from the first justification; the latter may have place both in the first and second. (7) Moral causes may be of many sorts; preparatory, dispository, meritorious, conditionally efficient, or only sine quibus non [without which nothing]. And we must diligently inquire in what sense, under the notion of what cause or causes, our works are excluded from our justification and under what notions they are necessary thereunto. And there is no one of these distinctions but it needs many more to explain it, which accordingly are made use of by learned men.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Doctrine of Justification by Faith</cite>, … (London: Boulter, 1677), p. 34</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/justification/twofold-justification.html">Twofold Justification and Its Increase</a></span></div>

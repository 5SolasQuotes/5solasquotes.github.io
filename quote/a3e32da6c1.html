<blockquote><p>3… For whereas hitherto you [John Cotton] have proposed a will of God only conditionate, the place of Scripture alleged [Eze. 18:23] mentions no such conditionate will, which is indifferent to pass either upon the life or death of a man accordingly as he shall be found to repent or not to repent, but rather intimates a will of God inclining to affect rather the life of man than his death, as it is manifested in these words, ‘I have no pleasure in the wicked man’s death, but rather that he repent and live.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, [John] Cotton’s clearing certain doubts concerning Predestination, together with an Examination Thereof (London: J.D., 1646), Question 2, p. 58</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f86a15fe0c" data-kw="">
<blockquote><p>But as it cannot be but that God will smite us with his rods, not only because we deserve to be smitten, but also because it is expedient, it is necessary to flee to this consolation which is offered to us, even that God having afflicted us with grief will again shew us compassion, even ‘according to the multitude of his mercies.’ He confirms the truth of what he alleges by a reference to the very nature of God Himself. Hence, that the faithful might not debate with themselves whether God would be propitious to them, after having inflicted on them a temporary punishment, the prophet comes to their aid, and sets before them the mercy of God, or rather mercies, in the plural number; as though he had said, that it could not be that God should deny Himself, and that therefore He would be always merciful to his people; for otherwise his mercy would be obliterated, yea, that mercy which is inseparable from his eternal essence and divinity.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Lamentations</cite>, 3 | verse 32, “But though he cause grief, yet will he have compassion according to the multitude of his mercies.”</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace/the-gospel-offer.html">The Gospel Offer</a></span></div>

Reformed Books Online</a></div>
</figure><figure class="quote" id="q-099f204dae" data-kw="">
<blockquote><p>As many as are called by the gospel are unfeignedly called. For God has most earnestly and truly declared in His Word what is acceptable to Him, namely, that those who are called should come unto Him. He also seriously promises rest of soul and eternal life to all who come to Him and believe.</p></blockquote>

</figure><figure class="quote" id="q-c8942359ec" data-kw="">
<blockquote><p>It is admitted that God’s love to man is in one sense universal. He bears good-will towards them, as the work of his hands; but it does not follow thence that He must do all that he could do for their salvation… As to God’s willingness that all should turn and live, as God’s will has been observed sometimes expresses what He approves, and sometimes what He purposes. God wills, approves and desires a sinner’s turning unto Him. It is that which, through the whole Bible, is required of him; and whosoever thus returns shall live. I may add, God is willing to receive and forgive every sinner that returns to Him through Jesus Christ. He desires not the death of a sinner, but rather that he would repent and live. But He has not purposed the salvation of every sinner, or to incline his heart to embrace the salvation exhibited in the gospel. In this sense, the salvation of some is neither desired nor designed: if it were, it would be effected; for “his counsel shall stand, and He will do all his pleasure.”–“Whatsoever his soul desires, even that he does,” Isa. 46:10; Job 23:13.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/andrew-fuller.html">Andrew Fuller</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“The Reality and Efficacy of Divine Grace”</cite>, (1815) in The Complete Works of Andrew Fuller (Harrisonburg, Virginia: Sprinkle Publications, 1988), 2:554</span></figcaption>

<blockquote><p>8. He invites, Isa. 55:1-3, ‘Ho, every one that thirsteth come ye to the waters, and he that hath no money come, yea buy and eat without money, and without price;’ and again, verse 3, ‘Incline your ear and come unto Me, and your soul shall live;’ Hark how He calls, Mt. 11:29, ‘Come unto Me all ye that are weary, and heavy laden, and I will ease you.’ The Father says come, the Son says come, the Spirit says come; you that are in the hedges come; He sends out his servants to highway-people, Mt. 22:9. To as many as are found there: Why stay you disputing his will when He so often says ‘Come, come‘? Rev. 22:17, ‘The Spirit and the Bride say ‘Come,’ and let him that heareth say ‘Come,’ and let him that is athirst come, and whosoever will let him drink of the water of life freely.’ Is not all this enough to let thee know God is willing, and Christ is willing to receive thee? Lo, Christ will come to thee.

9. See that essence of glory bowing the heavens and coming down, laying aside his robes of majesty, and putting on thy filthy garments; see Him tiring Himself in going about from place to place upon no other errand than this, to cry at the markets, ‘Oh, if any sinners love life, happiness; if any will go to heaven: let them come to Me; I will show them the way to my father’s bosom and endear them to my fathers heart.’ Read his sermons, observe his pains; thou wilt find a willing Savior, not excepting publicans and harlots from the kingdom of God.

10. Wouldst thou have more tokens of his will yet? See Him dying, hanging upon the cross, dropping out his last blood, breathing out his last breath, stretching out his dying arms to encircle sinners should run in to Him, breathing out the breath of free grace in his very last act upon a thief that had not an hour to live; Who shall despair? who shall say Christ is not willing to save him, and not blaspheme eternal love? Speak truth! corrupt heart say thou art not willing to be saved.

11. Is not this yet enough? Observe Him setting ministers in his Church, lest thou shouldst not read, and none should tell thee the truth of his eternal love, to speak out his good will in thine ears: All our errand is nothing but this: Sinners, Christ is willing to save you; And as ambassadors for Christ, as though God did beseech you by us, we pray you in Christ’s stead to be ye reconciled to God, 2 Cor. 5:20. Why canst thou not believe his will? Consider in thy Savior’s will there is not only a latitude for, but an eagerness of thy eternal salvation: Why therefore dost thou say, ‘My sins are so great that God will not pardon me?’ Believe; O blaspheme not the God of infinite good-will.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-collinges.html">John Collinges</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Works of John Collings</cite>, vol. 1 (London: Tomlins, 1655), A Cordial for a Fainting Soul, pp. 57–58</span></figcaption>

his+last+blood%2C+breathing+out+his+last+breath%2C+stretching+out+his+dying+arms+to+encircle+sinners+should+run+in+to+Him%2C+breathing+out+the+breath+of+free+grace+in+his+very+last+act+upon+a+thief+that+had+not+an+hour+to+live%3B+Who+shall+despair%3F+who+shall+say+Christ+is+not+willing+to+save+him%2C+and+not+blaspheme+eternal+love%3F+Speak+truth%21+corrupt+heart+say+thou+art+not+willing+to+be+saved.+11.+Is+not+this+yet+enough%3F+Observe+Him+setting+ministers+in+his+Church%2C+lest+thou+shouldst+not+read%2C+and+none+should+tell+thee+the+truth+of+his+eternal+love%2C+to+speak+out+his+good+will+in+thine+ears%3A+All+our+errand+is+nothing+but+this%3A+Sinners%2C+Christ+is+willing+to+save+you%3B+And+as+ambassadors+for+Christ%2C+as+though+God+did+beseech+you+by+us%2C+we+pray+you+in+Christ%E2%80%99s+stead+to+be+ye+reconciled+to+God%2C+2+Cor.+5%3A20.+Why+canst+thou+not+believe+his+will%3F+Consider+in+thy+Savior%E2%80%99s+will+there+is+not+only+a+latitude+for%2C+but+an+eagerness+of+thy+eternal+salvation%3A+Why+therefore+dost+thou+say%2C+%E2%80%98My+sins+are+so+great+that+God+will+not+pardon+me%3F%E2%80%99+Believe%3B+O+blaspheme+not+the+God+of+infinite+good-will.%E2%80%9D%0A%0A%E2%80%94+John+Collinges%2C+The+Works+of+John+Collings%2C+vol.+1+%28London%3A+Tomlins%2C+1655%29%2C+A+Cordial+for+a+Fainting+Soul%2C+pp.+57%E2%80%9358&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa777c354c8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a777c354c8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-a-divine-disposition-inclination-willingness/#:~:text=8.%20He%20invites%2C%20Isa.%2055%3A1%2D3%2C%20%E2%80%98Ho,not%20the%20God%20of%20infinite%20good%2Dwill&amp;text=8.%20He%20invites%2C%20Isa.%2055%3A1%2D3%2C%20%E2%80%98Ho%2C%20every%20one&amp;text=O%20blaspheme%20not%20the%20God%20of%20infinite%20good%2Dwill" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

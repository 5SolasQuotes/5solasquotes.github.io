<blockquote><p>39. It is a dreadful thing to be over-bold, rash and presumptuous, in speaking and asserting anything without clear proof, of God’s knowledge and will, especially to reduce them to all the modes and methods of a man, even as to the order of his acts: seeing we are forced to confess that even intellection and volition are spoken of God with exceeding great impropriety, and man’s acts, which are the prius significatum [the primary meaning], are further below God’s than a worm is below a man. Therefore were it not that the presumption of the schools and polemical writers has made that necessary as defensive, which else would not be so, I should scarce dare to say this little following.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Catholic Theology Plain, Pure, Peaceable, for pacification of the dogmatical Word-Warriors who</cite>, (London: White, 1675), sect. 4, ‘Of God’s relations to the creature…’</span></figcaption>

<blockquote><p>Ancient and medieval philosophy in general, and Thomism in particular, emphasized metaphysics over epistemology, and objective reality over our subjective awareness of it. The right order of inquiry, from this point of view, is first to determine the nature of the world and the place of human beings within it, and then on that basis to investigate how human beings come to acquire knowledge of the world. Modern philosophy, beginning with Rene Descartes (1596-1650), reverses this approach, tending as it does to start with questions about how we can come to have knowledge of the world and only then going on to consider what the world must be like, based on an account of our knowledge of it. In particular, both Descartes’ rationalism and the empiricism of writers like Locke, Berkeley, and Hume begin with the individual conscious subject or self, develop a theory about how that self can know anything, and then determine what reality in general must be like in line with their respective theories of knowledge. One result of this subjectivist method was to make objective reality and common sense problematic in a way they had not been for Aristotle and Aquinas; skepticism thus came to seem a serious threat, and idealism (the view that the material world is an illusion and that mind alone is real) came to seem a serious option. Another consequence was that even when some sort of objective reality was acknowledged, doubts were raised about the possibility of knowing much about it beyond what the senses could tell us directly. Accordingly, grand metaphysical systems of the sort presented by Plato, Aristotle, and Aquinas were called into question. The philosophy of Immanuel Kant (1724-1804) was an especially influential expression of hostility to traditional metaphysics, distinguishing as it does between ‘phenomena’ (the world as it appears to us, of which we can have knowledge) and ‘noumena’ (the world as it exists in itself, which we cannot know).</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘The Thomistic tradition, Part I’</cite>, (2009) Feser is an Analytical Thomist.</span></figcaption>

<blockquote><p>…For like every other natural phenomenon, practical reason has a natural end or goal toward which it is ordered, and that end or goal is just whatever it is the intellect perceives to be good or worth pursuing. Now given what has already been said, human beings, like everything else in nature, have various capacities and ends the fulfillment of which is good for them and the frustrating of which is bad, as a matter of objective fact. A rational intellect apprised of the facts will therefore perceive that it is good to realize these ends and bad to frustrate them. It follows, then, that a rational person will pursue the realization of these ends and avoid their frustration. In short, practical reason is directed by nature toward the pursuit of what the intellect perceives to be good; what is in fact good is the realization of the various ends inherent in human nature; and thus a rational and correctly informed person will perceive this and, accordingly, direct his actions towards the realization or fulfillment of those ends. In this sense, good action is just that which is “in accord with reason” (Summa Theologiae I-II.21.1; cf. Summa Theologiae I-II.90.1), and the moral skeptic’s question “Why should I do what is good?” has an obvious answer: Because to be rational just is (in part) to do what is good, to fulfill the ends set for us by nature. Natural law ethics as a body of substantive moral theory is the formulation of general moral principles on the basis of an analysis of the various human capacities and ends and the systematic working out of their implications. So, to take just one example, when we consider that human beings have intellects and that the natural end or function of the intellect is to grasp the truth about things, it follows that it is good for us—it fulfills our nature—to pursue truth and avoid error…</p></blockquote>

<blockquote><p>…non-rational animals pursue the good in its most practical and immediate aspect, according to their (non- rational) desires and motivations. Only the rational creature, however, can desire the good as abstracted from practical desires and circumstances, pursuing goodness in its universal form as an end in itself. It is the intellectual and volitional capacity within the human person that makes him the image of God, distinct from other creatures who reflect God’s goodness in lesser ways. It is in the human soul precisely as rational that the image of God reaches its pinnacle in the created order. By extension, there is a sense in which God’s causal intimacy with created causes also finds a kind of special intimacy in the case of human willing. Because of the volitional capacity of the rational soul, our participation in the similitude of divine goodness is far deeper than that of any other creature.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/reginald-m-lynch.html">Reginald M. Lynch</a></span><span class="wk"><span class="lbl">Work:</span> <cite>“Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries</cite>, “Divine Causality &amp; Human Freedom: Aquinas, Banez and Premotion after Descartes” in eds. Ballor, Gaetano &amp; Sytsma, Beyond Dordt &amp; De Auxiliis: the Dynamics of Protestant &amp; Catholic Soteriology in the Sixteenth &amp; Seventeenth Centuries (Brill, 2019), p. 229 Lynch is a Dominican and writes in the Thomist tradition.</span></figcaption>

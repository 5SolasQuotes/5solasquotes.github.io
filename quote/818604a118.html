<blockquote><p>Conclusion 9: All the divine attributes, although they are really the same and can be predicated of each other in the identical sense, and also the proper effects and determinations of any one attributed to any other attribute, yet in the formal sense they are not predicated of each other without implication of contradiction. For example, the mercy of God formally is His anger or corrective and punitive justice, God hates sin, and condemns and afflicts the sinner with eternal punishments through mercy. But the reason for this implication is because the divine attributes are virtually distinguished, and insofar as they are distinguished they cannot formally be one and the same thing, because their formal effects, for example, to hate and to pity, to save Peter, and to punish Judas, are not formally the same.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Select Theological Disputations, vol. 1 tr. AI by Onku (Utrecht: Johannes a Waesberg, 1648), pt. 1 Latin | On the Power of God, pt. 2</cite>, p. 372</span></figcaption>

<blockquote><p>The analogical use of terms is crucial to understanding God’s knowledge properly in another respect. I have spoken of various concepts and propositions existing in the divine intellect, but they cannot exist there in exactly the same sense in which they exist in our intellects. For in our intellects they exist as distinct thoughts, and there cannot be any such distinctions in God consistent with his simplicity. To a first approximation, we might think instead in terms of a conjunction of all propositions, and say that there is in the divine intellect something like a single thought with this one gigantic conjunctive proposition as its content. But even that cannot be quite right, because this single conjunctive proposition will itself have component parts. A better, though still imperfect, way to understand the nature of God’s knowledge would be to think in terms of analogies like the following. From a beam of white light, various beams of colored light can be derived by passing it through a prism. Though the colors are not separated out until the beam reaches the prism, they are still in the white light in a unified way. From a lump of dough, cookies of various shapes can be derived by means of cookie cutters. Though the various cookies with their particular shapes are not separated out until the cutters are applied to the dough, they are still in the uncut dough virtually. Now, God is pure actuality, whereas each kind of created thing represents a different way in which actuality might be limited by potentiality. That is to say, each created thing is comparable to one of the different specific colors that might be derived from the white light that contains all of them, or is like one of the many cookie shapes which might be derived from the dough which contains all of them. God’s creation of the world is thus like the passing of white light through a prism or the application of the cutters to the dough. The prism draws out, from the color spectrum which is contained in a unified way in the white light, a particular beam of this color and a particular beam of that color; and the cutters draw out, from the variety of possible cookies contained in a unified way in the lump of dough, a cookie of this particular shape and a cookie of that particular shape… Now, just as if you knew the white light perfectly, you would know all the colors which could be derived from it, and if you knew the lump of dough perfectly, you would know all the shapes which might be carved out of it, so too, perfectly to know that which is pure actuality would entail knowing all the various limited ways of being actual which might be derived from it. And that is how God knows all the various kinds of finitely actual things which exist or might exist—by virtue of perfectly knowing himself as that which is pure or unlimited actuality. That is not to say that his knowledge is exactly like that of someone who grasps the nature of white light or of dough, but it is analogous to that. And even if the analogy is imperfect, that is, as I have said, only to be expected given how very far beyond its ordinary sphere of operation reason has to push itself when seeking ultimate explanations.</p></blockquote>

<blockquote><p>Something Composite to: the Ineffectible, Efficient Cause is Simple [see p. 72 of the Summary] . 54. Every composite depends on its parts as on a material cause; for the parts are the principles of which the composite consists. Hence parts are the material principle of a composite. Simple being is that which lacks parts. Composite being, on the other hand, is that which consists of parts united with each other. There is a physical composite if the thing consists of parts really distinct. There is a metaphysical composite if the thing consists of formalities that are united in such a way with each other that they have the idea of parts, as genus and difference. Formalities that do not have the idea of parts do not impede simplicity in a being, as science [knowledge] and will in God. 55. Every composite is an effect. This point follows from conclusion 21, because a composite is something that is matter-ed (see the preceding conclusion). 56. Every composite is composed ultimately of simple elements. From conclusion 16, we cannot proceed infinitely with respect to material causes essentially ordered. Therefore we must reach some matter-ing that is not matter-ed, that is, to a material cause that is not materially caused. But this non-matter-ed material cause is nothing other than a part that is not composed in its turn of other parts, which is the conclusion proposed. 57. An independent or uncausable being, because it is not an effect, is not composite; therefore such a being is simple. This follows from conclusion 55. 58. If there is something composite, there is something simple. This follows from conclusion 56 with respect to a first being in the order of material causality. But from the existence of the composite we can also infer the existence of a first being in the order of efficient causality. For if something is composite it is also an effect (from conclusion 55), and dependent (from conclusion 28). Therefore some ineffectible efficient cause is required (from conclusions 23 to 27). But every ineffectible being is simple (from conclusion 57). . Part 3, An Infinite, Perfect Being Imperfect Composites to Pure Perfections [see pp. 73-74 of the Summary] 59. Every composite consists of act and potency. For parts have in their formal concept the idea of mutual perfectibility, and so are in potency to the whole. 60. Hence composition is a mixed perfection. This follows from the preceding conclusion and also from the fact that a composite is caused and dependent on another; for being a dependent being involves some imperfection in the dependent being. Simplicity, on the contrary, involves no such imperfection. 61. Every mixed perfection can be reduced to one or several pure perfections that exist concretely in a limited degree. The reason is that the imperfection by virtue of which some perfection is said to [be] mixed is nothing other than the lack of being-ness. Therefore in itself formally, imperfection is something negative and not positive; for it is the negation of some positive perfection. Therefore it always involves something else, namely a positive being-ness of which there is a limitation. This positive being-ness in its formal concept either includes imperfection and hence is a mixed perfection, or does not include imperfection and hence is a pure perfection. If it is a pure perfection the conclusion is gained. If it is mixed, the same question will return: Is the positive perfection in which the imperfection of this mixed perfection inheres a pure perfection or a mixed one? So either there would be an infinite regress and so there would be no perfection, or a stand would be made in some pure perfection, which is the conclusion intended. So, for example, reasoning, which is formally a mixed perfection, can be reduced to understanding, which is a pure perfection. Likewise, the extension of parts beyond parts can be reduced to simples that have a definitive presence in space, etc. 62. No pure perfection is incompatible with another pure perfection. This is plain from the definition of pure perfection; for a pure perfection or a perfection simply is that whose formal idea does not involve limitation or imperfection. Therefore of itself such a perfection cannot limit the being-ness of the subject in which it is, and so neither can it exclude from its subject other perfections simply.</p></blockquote>

the+existence+of+a+first+being+in+the+order+of+efficient+causality.+For+if+something+is+composite+it+is+also+an+effect+%28from+conclusion+55%29%2C+and+dependent+%28from+conclusion+28%29.+Therefore+some+ineffectible+efficient+cause+is+required+%28from+conclusions+23+to+27%29.+But+every+ineffectible+being+is+simple+%28from+conclusion+57%29.+.+Part+3%2C+An+Infinite%2C+Perfect+Being+Imperfect+Composites+to+Pure+Perfections+%5Bsee+pp.+73-74+of+the+Summary%5D+59.+Every+composite+consists+of+act+and+potency.+For+parts+have+in+their+formal+concept+the+idea+of+mutual+perfectibility%2C+and+so+are+in+potency+to+the+whole.+60.+Hence+composition+is+a+mixed+perfection.+This+follows+from+the+preceding+conclusion+and+also+from+the+fact+that+a+composite+is+caused+and+dependent+on+another%3B+for+being+a+dependent+being+involves+some+imperfection+in+the+dependent+being.+Simplicity%2C+on+the+contrary%2C+involves+no+such+imperfection.+61.+Every+mixed+perfection+can+be+reduced+to+one+or+several+pure+perfections+that+exist+concretely+in+a+limited+degree.+The+reason+is+that+the+imperfection+by+virtue+of+which+some+perfection+is+said+to+%5Bbe%5D+mixed+is+nothing+other+than+the+lack+of+being-ness.+Therefore+in+itself+formally%2C+imperfection+is+something+negative+and+not+positive%3B+for+it+is+the+negation+of+some+positive+perfection.+Therefore+it+always+involves+something+else%2C+namely+a+positive+being-ness+of+which+there+is+a+limitation.+This+positive+being-ness+in+its+formal+concept+either+includes+imperfection+and+hence+is+a+mixed+perfection%2C+or+does+not+include+imperfection+and+hence+is+a+pure+perfection.+If+it+is+a+pure+perfection+the+conclusion+is+gained.+If+it+is+mixed%2C+the+same+question+will+return%3A+Is+the+positive+perfection+in+which+the+imperfection+of+this+mixed+perfection+inheres+a+pure+perfection+or+a+mixed+one%3F+So+either+there+would+be+an+infinite+regress+and+so+there+would+be+no+perfection%2C+or+a+stand+would+be+made+in+some+pure+perfection%2C+which+is+the+conclusion+intended.+So%2C+for+example%2C+reasoning%2C+which+is+formally+a+mixed+perfection%2C+can+be+reduced+to+understanding%2C+which+is+a+pure+perfection.+Likewise%2C+the+extension+of+parts+beyond+parts+can+be+reduced+to+simples+that+have+a+definitive+presence+in+space%2C+etc.+62.+No+pure+perfection+is+incompatible+with+another+pure+perfection.+This+is+plain+from+the+definition+of+pure+perfection%3B+for+a+pure+perfection+or+a+perfection+simply+is+that+whose+formal+idea+does+not+involve+limitation+or+imperfection.+Therefore+of+itself+such+a+perfection+cannot+limit+the+being-ness+of+the+subject+in+which+it+is%2C+and+so+neither+can+it+exclude+from+its+subject+other+perfections+simply.%E2%80%9D%0A%0A%E2%80%94+Allan+Wolter%2C+%E2%80%98Allan+Wolter%E2%80%99s+Conclusions+respecting+Reality%2C+Proving+God%E2%80%99+%281958%29%2C+%E2%80%98Conclusions+respecting+Reality%E2%80%99&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F6498434d6c.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/6498434d6c.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-divine-simplicity/#:~:text=Something%20Composite%20to%3A%20the%20Ineffectible%2C%20Efficient,from%20its%20subject%20other%20perfections%20simply&amp;text=Something%20Composite%20to%3A%20the%20Ineffectible%2C%20Efficient%20Cause%20is&amp;text=it%20exclude%20from%20its%20subject%20other%20perfections%20simply" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>God in his Word reveals Himself to be Jehovah Elohim, i.e. one God subsisting in three Persons. Though essence and subsistence, that is, the divine nature, and the Trinity of Persons in that nature, are the same thing, they being distinguished not as a Being and a Being, but as the manner of a Being or thing is distinguished from the Being or thing itself: yet for the help of our apprehension, God being pleased so far to condescend to our capacity (as delighting to be understood by us), we first consider of the essence, then of the subsistence.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-0f05c8b204" data-kw="">
<blockquote><p>Lay no weight on the quantity of your prayers; that is to say, how long or how many they are. These things avail nothing with God, by whom prayers are not measured, but weighed. And what makes the weight in them is the faith, fervency, and humility therein; so that one of those groanings mentioned, Rom. viii. 26, will down-weigh a whole day’s prayers, in which these things are wanting. Do you labour to get near God in prayer, and press forward to obtain that.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Memorial Concerning Personal and Family Fasting and Humiliation</cite>, (1756) in The Whole Works of the Late Reverend Thomas Boston of Ettrick, ed. Samuel McMillan (12 vols, Aberdeen: George and Robert King, 1852), 11: 383.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-88e57b938a" data-kw="">
<blockquote><p>BEING minded, through the help of God, for mine own comfort and encouraging of others, to speak something of Death (at whose doors though I have stand a great while, yet never so near, to man’s judgement, as I do now) I think it most requisite to call &amp; cry for thy help, Oh blessed saviour Jesus Christ, which hast destroyed death by thy death, &amp; brought in place thereof, life and immortality, as by the gospel it appereath: grant to me true &amp; lively faith, wherethrough men pass from death to eternal life, that of practise and not of naked speculation, I may something write concerning death (which is dreadful out of thee &amp; in it self) to the glory of thy holy name, to mine own comfort in thee, and to the edifying of all them, to whom this writing shall come, to be read or heard. Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-bradford.html">John Bradford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A fruitful treatise and full of heavenly consolation against the fear of death. Whereunto are annexed certain sweet meditations of the kingdom of Christ, of life everlasting, and of the blessed state &amp; felicity of the same</cite>, (London: William Powell, 1564), unpaginated.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><figure class="quote" id="q-68720784c2" data-kw="">
<blockquote><p>Now let us prostrate ourselves before the majesty of our good God, recognizing the infinite faults of which we are guilty, praying that it will please him to make us feel them more and more, so that we may ask him to pardon them. And may we recognize ourselves as we truly are, in order to compel ourselves to reform by correcting all the vices which are still in us, and to submit ourselves to his holy will, so that we may not cease blessing him in our afflictions. Thus, may we recognize our offenses and, at the same time, may we ever taste the fatherly love he shows us, so that we may invoke his name and call upon him until he shows us signs of his favour, after we have felt his wrath. May he show his grace not only to us, but also to all the people and nations of the Earth…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Sermons On Second Samuel Chapters 1–13</cite>, trans. Douglas Kelly (Edinburgh: The Banner of Truth Trust, 1992), 15..</span></figcaption>

</figure><figure class="quote" id="q-4dd6316407" data-kw="">
<blockquote><p>A Prayer for the King and Parliament, fit to be used by all good Christians daily in their Houses.

O God, the great Protector and guider of all Kings and Kingdoms, mercifully look with thy favourable eyes of mercy, upon this distressed Kingdom, and so inspire the heart of our Royal King Charles, whom thou hast called to the state and government of this Kingdom, and who through thy mercy, hath taken upon him the same, that he may effect all things to the honour and glory of thy name, and that he may receive the increase of all virtues, wherewith being decently adorned, he may both be able to avoid the monstrousness of vices, as also to come unto thee right gracious: and grant O merciful God, that there may be a true peace, and unity between Him and His Parliament and that thou O God, so inspire him with thy holy spirit, that he may hearken to his Parliament, and be ruled by them in all things that may be for the good of His sacred Person? and for His whole Kingdom[.]

[A]nd with the same holy spirit so inspire the hearts of this Parliament, whom it bath pleased thee to call together from several parts of this Kingdom, for the general good of the same, that they may do nothing but what may be to thy honour and glory, and that they may grow and persevere in all manner of virtue, setting all things in due order for the good of the kingdom; and that thy true Religion may here again be thoroughly settled amongst all men: Thou wouldst O God that none should perish, favourably look upon the souls deceived by devilish deceit of heretical Popish Sectaries and impiety, and remove from their hearts all such foulness, that they may be united to thy holy Church; and that all manner of wars or dissenions amongst thy people may be purged, and that thy servants earnestly craving thy mercy, the cruelty of their enemies be dispersed, thy Church truly settled, our king and Parliament faithfully united, we may evermore praise thee with incessant thankfulness, who livest and reignest one true and living God, world without end, Amen.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/adoniram-byfield.html">Adoniram Byfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A letter sent from a worthy divine to the Right Honourable the Lord Mayor of the city of London being a true relation of the battle fought between His Majesty and His Excellency the Earl of Essex: from Warwick castle the 24 of October 1642, at two a clock in the morning: together with a prayer for t</cite>, (London: Robert Wood, 1642), unpaginated.</span></figcaption>

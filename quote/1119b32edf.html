<main class="wrap"><figure class="quote" id="q-1119b32edf" data-kw="">
<blockquote><p>…views like Ockham’s prefigured themes that would come to define modern philosophy, and modern civilization more generally. The idea that only particular individual things exist and share no universal natures in common… Aristotelian metaphysics involves a number of complex distinctions which require for their expression an equally complex technical vocabulary; and this complexity only grew as Aquinas and other Aristotelian Scholastic philosophers of the Middle Ages developed Aristotle’s views further. This is unfortunate for the student of philosophy, but unavoidable given that the real world just is, Aristotelians would say, as complex as the vocabulary needed to describe it. But suppose that we interpreted this vocabulary in terms of a nominalist or conceptualist metaphysics, rather than a realist one. Then all those complicated technicalities would reflect, not objective reality, but only our subjective ideas or the way we decided to use words. The Scholastic philosophy that inherited this terminology would come to seem an exercise in mere wordplay and irrelevant hair-splitting, rather than a serious investigation of the real world. And that is exactly what happened as views like Ockham’s started to proliferate within Scholasticism. The early modern philosophers who rejected Aristotle and his Scholastic successors as mere sophists…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-feser.html">Edward Feser</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Last Superstition: a Refutation of the New Atheism</cite>, (St. Augustine’s Press, 2008), ch. 5, p. 170-71</span></figcaption>

</figure><figure class="quote" id="q-81fb419190" data-kw="">
<blockquote><p>We should not immediately reject a doctrine, or even doubt it, just for the sake of mental exercise… Problem 1. In order to do theology freely and skillfully, should we clear our minds of all preconceptions to the point that we doubt everything we have learned through diligent study, meditation, and the teaching of our instructors, and treat it all as false (even if it is not), until the truth is inscribed anew on our minds like a blank slate, after proper and methodical inquiry and demonstration based on certain principles? Answer: No. The Remonstrants wanted the National Synod to revise the Confession and Catechism, and they wanted the Synod members to be released from affirming the Belgic Catechism and Confession in the meantime, supposedly so they would not be hindered by any preconceptions in perceiving and judging the truth. Therefore, should we have temporarily suspended our agreement with, belief in, and profession of the truths attested by our affirmation (e.g., in articles 1 and 2 of the Confession)? Therefore, should the Reformed Synod have re-examined and investigated the article or thesis ‘That there is a God?’ I ask the same about the truths and theses of natural theology or philosophy concerning God, his attributes and works, providence, the distinction between moral good and evil, the honorable and the base, etc. I ask the same about the basic catechetical elements instilled and proven from God’s word in infancy, childhood, and adolescence, before someone devoted himself to theological studies in an academic program.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Disputation on the Ways of Knowing God, pt. 1</cite>, tr. Michael Lynch (1665; 2024) at Translationes Lyncei</span></figcaption>

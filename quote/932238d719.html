<main class="wrap"><figure class="quote" id="q-932238d719" data-kw="">
<blockquote><p>Seing that we and our household have subscribed, and given this public confession of our faith, to the good example of our subjects, we command and charge all commissioners and ministers to crave the same confession of their parishoners, and proceed against the refusers [i.e. commissioners and ministers] according to our laws, and order of the Kirk; delivering their names and lawful process to the ministers of our house, with all haste and diligence, under the pain of fourty pound, to be taken from their stipends; that we, with advice of our counsel, may take order with such proud contemners of God and our laws. Subscribed with our hand, at Holyroodhouse, the second day of March, 1580 (now 1581), the 14th year of our reign.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/civil-record.html">Civil Record</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Calderwood, The History of the Kirk of Scotland, ed. Thomas Thomson (Edinburgh: Wodrow Society, 1843), vol. 3, pp. 501-5 | A charge was subscribed by the king at Holyroodhouse, the second day of March, whereby subjects of all ranks were charged to subscrive the said Confession, the tenor wherof follows:—</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-1fbe464489" data-kw="">
<blockquote><p>It seems to the present writer that to demand acceptance of every proposition in so extensive a series of documents [as the Westminster Confession and Catechisms] would be incompatible with the avowal made in answer to the first question to the formula of subscription and comes dangerously close to the error of placing human documents on a par with holy Scripture.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-murray.html">John Murray</a></span><span class="wk"><span class="lbl">Work:</span> <cite>as quoted in Morton H. Smith, Subscription to the Westminster Standards in the Presbyterian Church in America, p. 80[?]</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

</figure><figure class="quote" id="q-a495b14ff1" data-kw="">
<blockquote><p>Article 1… the Sieur de la Milletiere… a fellow who would not submit himself unto their judgment and authority, and who has told the world that for these two last years he had no other intention than to incorporate himself into the communion of the Church of Rome, and to form a party against all the Reformed Churches, impugning with might and main the common confessions of all Protestants, perpetually accusing them of contemning the Catholic, that is, his Romish Church, and of schism from it, and propounding to them for the Rule of their Faith the Acts and Canons of the Council of Trent… But the said de la Milletiere having given it under his own hand in writing that he would submit himself unto the judgment of this synod; when as the commissioners, whom he himself had nominated, brought in their report… the Synod did once more refuse him, especially, because that he had fully opened his intentions, and in formal words declared that by that writing subscribed with his own hand, he never promised to submit his doctrine, but himself and person to the judgment of the Assembly; who taking, as in truth they could not but take this distinction, such an one as it was, in any other sense than a notorious scorn of their just and charitable endeavours for his eternal welfare; They told him plainly, that neither they nor any of their commissioners would waste a moment more of their precious time about him, and adjured him… to give Glory unto God, and to relinquish his most impious designs; and added farther, that they did as the National Synod of Alanson had done before them, declare, that for diverse years past he was not to be reputed a member of our Reformed Churches.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/disciplinary-cases.html">Disciplinary Cases</a></span><span class="wk"><span class="lbl">Work:</span> <cite>ed. John Quick, Synodicon (London, 1692), 3rd National Synod of Charenton</cite>, ch. 15, pp. 476-77</span></figcaption>

4+Disciplinary+Cases%2C+ed.+John+Quick%2C+Synodicon+%28London%2C+1692%29%2C+3rd+National+Synod+of+Charenton%2C+ch.+15%2C+pp.+476-77&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fa495b14ff1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/a495b14ff1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-confessional-subscription-in-the-post-reformation-french-reformed-churches/#:~:text=the%20Sieur%20de%20la%20Milletiere,a%20member%20of%20our%20Reformed%20Churches&amp;text=the%20Sieur%20de%20la%20Milletiere&amp;text=be%20reputed%20a%20member%20of%20our%20Reformed%20Churches" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-f4042b8944" data-kw="">
<blockquote><p>While [John] Thomson has been portrayed as a strict Subscriber his overture [in 1727, which led to the Adopting Act] recognizes a need to deal with exceptions, ‘if any minister within our bounds shall take upon him to teach or preach any thing contrary to any of the said Articles, unless first he propose the said point to the Presbytery or Synod, to be by them discussed, he shall be censured’. And as he closed the preface: ‘if there should be any paragraphs or clauses at which some may scruple, there are rational methods according to charity and piety, to have such scruples removed in a regular way, and it’s a pity to deprive a whole Church of the benefit of such and excellent Confession, for the scruples perhaps of a few, or for a few scruples about some particular and lesser points of religion.&#x27;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/before-the-adopting-act-of.html">Before the Adopting Act of</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Charles S. Sealy, Church Authority &amp; Non-Subscription Controversies in Early 18th Century Presbyterianism PhD thesis (Univ. of Glasgow, 2010), p. 176 quoting [John Thomson], An Overture Presented to the Reverend Synod of Dissenting Ministers, Sitting in Philadelphia, in the Month of September, 1728… (n.l., 1729)</cite>, pp. 24, 32</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/creeds-confessions-and-councils.html">Creeds, Confessions and Councils</a></span></div>

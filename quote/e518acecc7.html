<blockquote><p>I deny that want [lack] of future obedience in personal transgessions does argue that no Covenant has been made, or then to be disanulled: if so be, first, that the fundamental points of the Covenant be held by us, that is, that we do profess Him our God and no other; hold his Word to be our rule and none other; his sacraments to be the seals and none other: for in these three is the foundation of the Covenant, the persons one and the same, the writings one and the same, the seals one and the same: this binds each party to [the] other to perform the particulars of the Covenant thus made, and the party offending in some things for matter of fact, not disanulling any of these three, is only liable to reproof and punishment, but yet the Covenant does stand firm. A man and a woman do covenant together lawfully in marriage, the word of mutual promise passes solemnly between them to performe mutual duties, and the man gives a token to confirm the profession of his love and truth therein, which she receives: now she after is a very disobedient wife, and breaks the particulars of the covenant; but herein is she just, she holds none other [than] her husband; she stands unto the general covenant, and she keeps the token thereof: Though she be disobedient otherwise in many things, yet is there a covenant made and remains, so as yet there is true man and wife. And thus is it with his Church, as the example of the Israelites does show; of whom it is said that they were a stiff-necked people, Dt. 9:6, who often provoked God to anger, Ps. 95, and always resisted the Holy Ghost: Acts 7:51, yet had they covenanted with God, as Dt. 26:17, Moses tells them. Secondly, if the Lord on his part break not, the Covenant holds: for though the Lord complain that Israel had broken Covenant, yet were they for all that his people, until He cast them off and chose another to serve Him. It cannot be proved therefore that a people have not covenanted with God because of their personal evils in the Church; nor that therefore they be none of the Lord’s people, except it can be also proved that God has cast them off and chosen others. Now also I assume the latter part of the consequence, which is this: We have visibly covenanted with God to have Him for our God. We do hear the Word preached, we do profess faith to that Word, we entertain it as God’s Word; and we do receive the sacraments; our words, writings, and practice show this to be true. And therefore if these have made other people to be in Covenant with God, then the same do so make us in Covenant with God. And therefore also have we the form of a true Church.</p></blockquote>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-a9d41009ae" data-kw="">
<blockquote><p>It is true indeed, the apostle in his epistle to the Galatians, is very severe against some false teachers; which yet does not weaken, but really confirm the necessity of this forbearance and toleration. For those teachers were themselves against tolerating others, and would have the ceremonies of the Law imposed upon all Christians, as things necessary to salvation; by which means the Christian faith would have been greatly corrupted. And at the same time that he so sharply inveighs against these teachers, he is very large in recommending charity and forbearance, even in so freat a diversity of opinions as this was; and commands that “they who were overtaken in a fault, should be restored in the spirit of meekness;” (Gal. 5:13-15) and that “they should bear one another’s burdens.” (Gal. 6:1-2) And at last, when he had told them that the essence of Christianity did not consist in circumcision, or uncircumcision, i.e. in observing or omitting the ceremonies of the Law, but “in the new creature,” i.e. in true and real holiness; he adds these words, wherein he most affectionately desires, as well as commands, a mutual forbearance among persons who differ in things not fundamental; “and as many as walk according to this rule,” i.e. that agree in the essentials of Christianity, and form their lives according to this rule, “Peace be upon them, and mercy, and upon the Israel of God.” (Gal. 6:15-16)… And if we turn out thoughts to the following circumstances, we shall plainly perceive of how great weight these things are to recommend the like forbearance among Christians in these days:

1. The apostles were infallible, and if they would not attempt to compose these differences by exerting their authority, but chose to recommend forbearance on both sides, how much more should we take the like course, who have not the least pretences to infallibility?

2. The dispute was not about a trifle, but a very weighty affair, even the difference between the Law and the Gospel; a thing that did not consist in mere speculation, but had a great influence both upon practice and worship. Alas! How many trivial controversies in comparison of this do sour the minds of Christians in these days?

3. Both sides were furnished with very considerable arguments, the one a Law given by God, the other the defense of Christian liberty.

4. St. Paul himself, who so strenuously urged this forbearance, had before such a flaming zeal for the Law, that he was even mad for it.

5. Lastly, these precepts of forbearance were given after the vision from Heaven to Peter, and after the apostolic synod; so that these controversies had been sufficiently determined already, by this vision, and by the decree of the apostles. Whoever therefore shall seriously consider these circumstances, and weigh them impartially, can’t surely but conclude that these apostolical precepts of forbearance, if they had any weight in their times, ought to have much more in our times, and in the present controversies.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jean-alphonse-turretin.html">Jean-Alphonse Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Discourse concerning Fundamental Articles in Religion</cite>, (London: Darby, 1720), ch. 7, ‘Church communion ought to be had among those not differing in fundamentals’</span></figcaption>

<blockquote><p>2. None of the corruptions which they falsely term, are of that high nature as to call for a personal separation, because none of them are fundamental. The least corruption that we can certainly espy, which yet is not in constitution, but in execution, we must separate from, in judgment, in affection, in practice, but to separate personally for any error not fundamental, let them teach it them to whom all errors are alike, but we may not be so dull.</p></blockquote>

</figure><figure class="quote" id="q-2e42f7190c" data-kw="">
<blockquote><p>Things about the foundation, circa-fundamentalia, are all things revealed in the Word of God, as all histories, miracles, chronologies, things about Orion, the Pleiades, the North Stars (Job 38:31-32), that Paul left his cloak at Troas. The knowledge of these is considered three ways:

1. As necessary, by necessity of a mean, necessitate medii, and the knowledge so is not necessary to salvation. Many are in glory (I doubt not) who lived in the visible church, and yet knew never that Sampson killed a lion. But the knowledge of all these is necessary, necessitate præcepti [by a necessity of precept], because all in the visible church are obliged to know these things; therefore the ignorance of these only, does not actually condemn, but virtually and by demerit leads to condemnation.

2. This knowledge is considered as commanded in the excellency thereof, and so error and bad opinions about these are sinfully ill, though [are] in the regenerate, by accident; such errors condemn not [to damnation] where the foundation is held.

3. The knowledge of these is considered as commended and enjoined to us with the submission of faith, for the authority of God the speaker, and the malicious opposing of these is a fundamental error, not formally, but by evident consequence. For though the matter of these errors is not fundamental, yet the malicious opposing of these is a fundamental error against this principle: Whatever God has said is true. But God says…</p></blockquote>

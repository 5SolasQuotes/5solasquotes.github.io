<main class="wrap"><figure class="quote" id="q-312d4a612c" data-kw="">
<blockquote><p>I shall address my self to honest, well-meaning Householders, who make conscience of serving God with their Families. You may look on this as your privilege, as well as duty; I hope you do. David thought it a great mercy that he and his People had any thing to offer, and any hopes of entertainment: Oh what an honour is it that the King of Heaven gives you any admittance into his Presence-Chamber with your Families twice a day! to confess your sins, beg pardon, supplies of mercy; to give him the glory of his Goodness, to lay your Load on him, and get ease; I hope you will never be unwilling to it, or weary of it, God forbid you should: You are not weary of Mealtimes, if you be healthful; know and keep these appointed times of coming to God.

If you promise to meet a Person of Quality at such an hour, when the Clock strikes, you rush up, crave pardon, and tell the company, one tarries for you, you must be gone: Oh make not more bold with God than you would do with Men; and keep your hearts continually in a frame for duty: Rambling in the day indisposeth your spirits for duty at night: So act, as to think you must go to an heart-searching God before you sleep; and so pray, as if it were the last time you should approach to God with your Family in this World: Study the frame of your hearts; be not content with lip-labour: Rest not in the work done, without communion with God: Presume not upon your own goodness, you that are the holiest: Despair not because of your wickedness, or guiltiness, you that think your selves the worst of men: Remember, Manasseh prayed, and God was intreated of him, when he humbled himself greatly.

Be not discouraged because you cannot do so well as others: God despiseth not the day of small things: God hath babes in his Family, that chatter like a Crane or Swallow. A Child’s lisping is understood by an indulgent Father: And if a distempered Child stoop down, and reach us up any small thing, we take it kindly; so doth God when a sick Soul falls low in Humility, and reacheth high in Heavenly-mindedness. You cannot be always actually on your knees, or speaking with your tongues, but still maintain a praying-frame of heart.

Mr. [Richard] Greenham saith, When one asks how your Family doth, let this put you in mind to pray for them; thank God for mercies; reflect on your selves, What have I done for their welfare? how are the Souls of my Children, Servants? and lift up an Ejaculation for them: Be much in Prayer: Give your selves to Prayer: Prayer is your Physic, your Armoury, Ammunition, your Antidote against Satan, World, Flesh: This is your way of Trading with God for the richest Commodities for your selves and yours; the profit will be yours, the glory God’s.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/oliver-heywood.html">Oliver Heywood</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A family altar erected to the honour of the eternal God, or, A solemn essay to promote the worship of God in private houses being some meditations on Genesis 35. 2, 3</cite>, (London: T. Parkhurst, 1693), epistle dedicatory.</span></figcaption>

<blockquote><p>And now especially in this solemn transaction, endeavour to render God great to your selves: Enlarge your minds, that as far as is possible and needful, they may take in the entire notion of him. As to what he is in himself, you must conceive of him as a Spirit, as his own Word, which can best tell us what he is, instructs us; and so as a Being of far higher excellency than any thing you can see with your eyes, or touch with your hands, or than can come under the notice of any of your senses.

You may easily apprehend Spiritual Being to be the source and spring of life, and self-moving power. This World were all a dead unmoving lump, if there were no such thing as Spirit; as your bodies when the soul is fled. You must conceive him to be an Eternal, Self-subsisting Spirit, not sprung up into Being from another, as our souls are: But who from the excellency of his own Being, was necessarily of, and from himself; comprehending originally and eternally in himself the fulness of all Life and Being.

I would fain lead you here, as by the hand, a few plain and easy steps. You are sure that somewhat now is, of this you can be in no doubt; and next you may be as sure that somewhat hath, of it self, ever been: For if nothing at all now were, you can easily apprehend it impossible that any thing should ever be, or of it self now begin to be, and spring up out of nothing. Do but make this supposition in your own minds, and the matter will be as plain to you as any thing can be, that if nothing at all were now in being, nothing could ever come into being; wherefore you may be sure, that because there is somewhat now in being, there must have been somewhat or other always in being, that was eternally of it self. And then to go a little farther, since you know there are many things in being that were not of themselves, you may be sure that what was always of it self, had in it a sufficiency of active power to produce other things, otherwise nothing that is not of it self could ever be. As you know that we were not of our selves; and the case is the same as to whatsoever else our eyes behold.

You must conceive of God therefore as comprehending originally in his own Being, which is most peculiar to himself, a power to produce all whatsoever Being, Excellency and Perfection is to be found in all the whole Creation. For there can be nothing which either is not, or arises not from, what was of it self. And therefore that he is an absolutely, universally, and infinitely perfect Being, and therefore that Life, Knowledge, Wisdom, Power, Goodness, Holiness, Justice, Truth, and whatsoever other conceivable Excellencies, do all in highest perfection, belong, as necessary Attributes, unchangeably and without possibility of diminution unto him. And all which his own Word (agreeably to the plain reason of things) doth in multitudes of places ascribe to him; as you that are acquainted with the Bible cannot but know. You must therefore conceive of him, as the All in All. So great, so excellent, so glorious a One he is, to whom you are to surrender and yield your selves.

You are to conceive of him as most essentially One, for there can be but one All. And so his Word teaches you to conceive. Hear, O Israel! the Lord our God is one Lord, Deut. 6. 4. We know there is no other God but one, &amp;c. 1 Cor. 8. 4, 5, 6. Your thoughts therefore need not be divided within you, nor your minds hang in doubt, to whom you are to betake and yield your selves: there is no place or pretence for halting between two Opinions. He most righteously lays the sole claim to you, a just God and a Saviour, and there is none besides him, Isa. 45. 21.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-howe.html">John Howe</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Two sermons preached at Thurlow in Suffolk on those words, Rom. 6.13 “Yield your selves to God”</cite>, (London: Tho. Parkhurst, 1688), pp 5-8.</span></figcaption>

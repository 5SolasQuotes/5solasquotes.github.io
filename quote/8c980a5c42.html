<main class="wrap"><figure class="quote" id="q-8c980a5c42" data-kw="">
<blockquote><p>The man of business – the merchant and the tradesman, must have respect to the law of Christ, and see that so far as their authority and influence extend, his law be not violated, nor his name dishonoured with their connivance, much less sanction and example. Angels are commanded to worship him [Heb. 1:6]. He employs them as his ministers in advancing the interests of his kingdom. Are magistrates, wielding, as the nation’s representatives, the national power and influence, exempted from this universal law?

Is civil government, which God has ordained for his own glory, and for good to man, to be the only exception? Are civil rulers not to be called upon to “serve him” to whom angels minister? are they alone of all moral agents at liberty to refuse to promote the ends of the mediatorial administration? It cannot be.

“All kings shall fall down before him: all nations shall serve him,” Ps. lxxii. 11. They must “serve him,” by so directing their measures, and so employing their resources, as to facilitate the spread of truth, and throw on its side the influence of the national sanction; by furnishing aid to the church in executing her righteous schemes of piety and benevolence; by removing every outward hindrance, so far as it can be done; by restraining gross violators of the moral law of both tables; thus infusing into the whole frame and actings of the machinery of the government a spirit of opposition to error, and wrong, and impiety, and of favour to truth, and morality, and godliness.

This they can never do, unless they acknowledge, and honour, and defend, and support the Christian church. The magistrate may not, indeed, interfere with the church’s independence, or attempt to discharge spiritual functions, but he is to aid the church in effecting the ends of her organization, and thus promote the knowledge and service of God the Redeemer.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-m-willson.html">James M. Willson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Bible magistracy: or Christ’s dominion over the nations: with an examination of the civil institutions of the</cite>, United States (Philadelphia: Missionary Society of the Reformed Presbyterian Church, 1842), pp 58-59.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-4ef8944025" data-kw="">
<blockquote><p>But perhaps they will object the apostles determination (Acts 15) concerning the Gentiles newly converted to Christianity, that they should abstain from eating of blood and things strangled, which was a Mosaical rite. To which I answer: First, that the apostles in the same place (v. 10) do show, that that burden of legal ceremonies was removed by the death of Christ and buried in his grave. Secondly, they did this in regard of the Jews which dwelt among those Christians for the time, being for peace’s sake, until the Christian Jews were better confirmed in the faith and knowledge of Christ (v. 21). Thirdly, they did it by the special direction of the Holy Ghost (v. 28), for the reason alleged. So as that example being extraordinary, and for the time of the infancy of the Gospel, it is no rule for us to follow now after so long a shining forth of the Gospel. And I might add this moreover, that the apostles did not this alone, but with the whole congregation, the presbyters, or elders, and brethren being joined with them. Whereas our prelates, though, they confess that a General Council has no immediate institution from Christ to determine controversies; but that it was prudently taken up in the Church from the apostles’ example, Acts 15. Yet for all their prudence in taking up that which belongs not unto them, they shew themselves very unfaithful, while they follow not the example of the apostles in determining alone, and not with the whole congregation; and therefore Christians have the less reason to captivate their faith to prelatical decrees, either in a General Council where the Pope of Rome and of Canterbury are the rulers of the rost, or in a convocation, where the Pope of Canterbury is Prime, Primate, Metropolitan, and All, who without the Holy Ghost (which is never given to any such Antichristian assemblies) whatever they decree in point of faith or otherwise, be it never so erroneous, yet they enjoin obedience thereunto by all men, as our Prelate affirms.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-prynne.html">William Prynne</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lord Bishops, None of the Lord’s Bishops. Or A Short Discourse</cite>, (1640), ch. 7. Prynne was a prominent Erastian.</span></figcaption>

</figure><figure class="quote" id="q-1b7b784010" data-kw="">
<blockquote><p>For rulers are not a terror to good works, but to evil. Do you want to be unafraid of the authority? Do what is good, and you will have praise from the same. (Romans 13:3)

The rewards for well-doing are, in the apostle’s language, expressed by the term “praise,” to signify benignant regards, careful protection, sure defence, and advancement in comfort and happiness; and this, after the example of that divine providence to which humble and faithful servants of God look up with trust and confidence, enjoying a constant peace, and resting in the assurance of the ever-watchful care of their great Master.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-craig.html">Robert Craig</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theocracy or the principles of the Jewish religion and polity adapted to all nations and times</cite>, (Edinburgh, 1848), pp 279-80.</span></figcaption>

</figure><figure class="quote" id="q-993670cede" data-kw="">
<blockquote><p>What is warranted by the direction of nature’s light is warranted by the law of nature, and consequently by a divine law; for who can deny the law of nature to be a divine law?… All civil power is immediately from God in its root; in that, 1st, God has made man a social creature, and one who inclines to be governed by man; then certainly He must have put this power in man’s nature: so are we, by good reason, taught by Aristotle. 2nd, God and nature intends the policy and peace of mankind, then must God and nature have given to mankind a power to compass this end; and this must be a power of government… As domestic society is by nature’s instinct…</p></blockquote>

<blockquote><p>Josiah … did not only restore the religion, but did further destroy all monuments of idolatry which of long time had remained … not only in Judah, but also in Bethel where Jeroboam had erected his idolatry. Yea, he further proceeded and did kill the priests of the high places who were idolaters and had deceived the people; he did kill them, I say, and did burn their bones upon their own altars, and so returned to Jerusalem. This reformation made Josiah, and for the same obtained this testimony of the Holy Ghost, that neither before him neither after him was there any such king who returned to God with his whole soul and with all his strength according to all the law of Moses.

Of which histories it is evident that the reformation of religion in all points, together with the punishment of false teachers, doth appertain to the power of the civil magistrate. For what God required of them, His justice must require of others having the like charge and authority; what He did approve in them, He cannot but approve in all others who with like zeal and sincerity do enterprise to purge the Lord’s temple and sanctuary. What God required to them, it is before declared, to wit, that most diligently they should observe His law, statutes and ceremonies.

[…] And therefore of necessity it is speedily ye provide for reformation or else ye declare yourselves not only void of love towards your subjects, but also to live without care of your own salvation, yea, without all fear and true reverence of God.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“Josiah … did not only restore the religion, but did further destroy all monuments of idolatry which of long time had remained … not only in Judah, but also in Bethel where Jeroboam had erected his idolatry. Yea, he further proceeded and did kill the priests of the high places who were idolaters and had deceived the people; he did kill them, I say, and did burn their bones upon their own altars, and so returned to Jerusalem. This reformation made Josiah, and for the same obtained this testimony of the Holy Ghost, that neither before him neither after him was there any such king who returned to God with his whole soul and with all his strength according to all the law of Moses.

Of which histories it is evident that the reformation of religion in all points, together with the punishment of false teachers, doth appertain to the power of the civil magistrate. For what God required of them, His justice must require of others having the like charge and authority; what He did approve in them, He cannot but approve in all others who with like zeal and sincerity do enterprise to purge the Lord’s temple and sanctuary. What God required to them, it is before declared, to wit, that most diligently they should observe His law, statutes and ceremonies.

<blockquote><p>A lamb is both clothes and meat; Christ is clothing to us by his righteousness to cover our nakedness, and food to us by his body and blood to satisfy our appetite, a sacrifice and a feast for us.</p></blockquote>

</figure><figure class="quote" id="q-edbc3687c1" data-kw="">
<blockquote><p>I respond that it was a part of the obedience to the divinely given ceremonial laws until the death of Christ, and a fulfilling of the time of correction (Col. 2; Heb. 9). But by the death of Christ, it being one with the other ceremonials, became defunct as to observing it in conscience, yet not however until it had an honest funeral, but from reason of the scandal of the weak from amongst the circumcision, some of them were to observe them in parts till the Jews may be fully and plainly convicted of the cessation of the ceremonial law.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, (Amsterdam, 1663-1676) | vol. 1, pt 1, bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’ | ch. 8. ‘Questions on Some Rituals in Particular: on the Laying on of Hands, the [Holy] Kiss, Abstinence from Things Strangled &amp; Blood, the Marriage Rite, Anointing, Shaking the Feet of Dust, Love Feasts, the Rite of Covenanting &amp; of the Washing of Feet.’, pp. 460-81 3 sections | Section 3 | Problem 3, ‘What ought to be made of abstinence from suffocated things and blood (Acts 15)?, p. 471</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>
<div class="actions"><button class="copy" data-copy="“I respond that it was a part of the obedience to the divinely given ceremonial laws until the death of Christ, and a fulfilling of the time of correction (Col. 2; Heb. 9). But by the death of Christ, it being one with the other ceremonials, became defunct as to observing it in conscience, yet not however until it had an honest funeral, but from reason of the scandal of the weak from amongst the circumcision, some of them were to observe them in parts till the Jews may be fully and plainly convicted of the cessation of the ceremonial law.”

uotes.github.io%2Fquote%2Fedbc3687c1.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/edbc3687c1.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-ceremonies/#:~:text=I%20respond%20that%20it%20was%20a,the%20cessation%20of%20the%20ceremonial%20law&amp;text=I%20respond%20that%20it%20was%20a%20part%20of&amp;text=convicted%20of%20the%20cessation%20of%20the%20ceremonial%20law" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-e7365a5b06" data-kw="">
<blockquote><p>I respond: It was a common rite, in species and form, from custom or practice then and there received; it was accustomed to be used as a sign of love, friendship, familiarity, even of subjection, etc. On this rite: the Philology &amp; Antiquary of [John de] Pineda [1558–1637, a Jesuit] on Job 31:27 has informed. Out of theologians other than Pineda: Aretius, pt. 3, [Jean de] Lorinus [1559-1634, a Jesuit] and [Andrew] Rivet on Ps. 2; and Lorinus in the same has cited Joseph Stephanus in the Tractate on Kissing the Feet of the Pontiff.”, p. 466 Gyongyosi, Paul – Kisses of Love &amp; Hate, on Song 1:2 &amp; 6:3 &amp; Prov. 27:6; a Dissertation on the Holy Kiss (Rom. 16:17) &amp; its Opposite, the Kiss of Jude (Lk. 22:48) &amp; of the Mysteries of them Illustrated by the Sacred Scriptures, by Christ the Lord of Love, Grace &amp; Eternal Wrath… (Frankfurt, 1738) 18 pp. Gyongyosi (1668-1743) was a German reformed professor of theology at Frankfurt, Germany. . Lutheran Willemer, Johann Helvicus – Out of the Words of Ps. 2:12, ‘Kiss the Son’, Against Some of the Borne Distortions of the Jews (Wittenburg, 1704) 35 pp. Mayer, Johann Friedrich – A Tract on Kissing the Feet of the Roman Pointiff 2nd ed. (Leipzig, 1714) Mayer (1650-1712) was a German, Lutheran professor of theology at Wittenberg, Kiel and Greifswald. . . On Foot Washing &amp; Shaking the Dust Off of One’s Feet Bible Verses Dust of the Feet Isa. 49:23 “And kings shall be thy nursing fathers, and their queens thy nursing mothers: they shall bow down to thee with their face toward the earth, and lick up the dust of thy feet;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gisbertus-voetius.html">Gisbertus Voetius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesiastical Politics</cite>, Section 2, ‘We come now to the rite of the kiss (Rom. 16:16; 1 Cor. 16:20; 2 Cor. 13:12; 1 Thess. 5:26; 1 Pet. 5:14), of which it is queried, whether it may be a mystical or sacred rite, and have been by divine law imposed?’ in ch. 8. ‘Questions on Some Rituals in Particular…’ in Ecclesiastical Politics, vol. 1 (Amsterdam, 1663-1676), Pt 1, Bk. 2, ‘Of Ecclesiastical Things, or Acts &amp; Exercises’, Tract 1, ‘Of Formularies, or Liturgies &amp; Rituals’, ch. 1, ‘Of Formularies, or Liturgies’, pp. 466-471</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/ceremonies-and-things-indifferent.html">Ceremonies and Things Indifferent</a></span></div>

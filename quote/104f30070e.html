<main class="wrap"><figure class="quote" id="q-104f30070e" data-kw="">
<blockquote><p>DEARLY Beloved in God, after you have heard so eagerly the Gospel and the teachings of the holy Apostles, now for the fourth year, teachings which Almighty God has been merciful enough to publish to you through my weak efforts, the majority of you, thank God, have been greatly fired with the love of God and of your neighbour. You have also begun faithfully to embrace and to take unto yourselves the teachings of the Gospel and the liberty which they give, so that after you have tried and tasted the sweetness of the heavenly bread by which man lives, no other food has since been able to please you. And, as when the children of Israel were led out of Egypt, at first impatient and unaccustomed to the hard journey, they sometimes in vexation wished themselves back in Egypt, with the food left there, such as garlic, onions, leeks, and flesh-pots, they still entirely forgot such complaints when they had come into the promised land and had tasted its luscious fruits: thus also some among us leapt and jumped unseemly at the first spurring—as still some do now, who like a horse neither are able nor ought to rid themselves of the spur of the Gospel;—still, in time they have become so tractable and so accustomed to the salt and good fruit of the Gospel, which they find abundantly in it, that they not only avoid the former darkness, labour, food, and yoke of Egypt, but also are vexed with all brothers, that is, Christians, wherever they do not venture to make free use of Christian liberty. And in order to show this, some have issued German poems, some have entered into friendly talks and discussions in public rooms and at gatherings; some now at last during this fast—and it was their opinion that no one else could be offended by it—at home, and when they were together, have eaten meat, eggs, cheese, and other food hitherto unused in fasts. But this opinion of theirs was wrong; for some were offended, and that, too, from simple good intentions; and others, not from love of God or of his commands (as far as I can judge), but that they might reject that which teaches and warns common men, and they might not agree with their opinions, acted as though they were injured and offended, in order that they might increase the discord. The third part of the hypocrites of a false spirit did the same, and secretly excited the civil authorities, saying that such things neither should nor would be allowed, that it would destroy the fasts, just as though they never could fast, if the poor labourer, at this time of spring, having to bear most heavily the burden and heat of the day, ate such food for the support of his body and on account of his work. Indeed, all these have so troubled the matter and made it worse, that the honourable Council of our city was obliged to attend to the matter. And when the previously mentioned evangelically instructed people found that they were likely to be punished, it was their purpose to protect themselves by means of the Scriptures, which, however, not one of the Council had been wise enough to understand, so that he could accept or reject them. What should I do, as one to whom the care of souls and the Gospel have been entrusted, except search the Scriptures, particularly again, and bring them as a light into this darkness of error, so that no one, from ignorance or lack of recognition, injuring or attacking another come into great regret, especially since those who eat are not triflers or clowns, but honest folk and of good conscience? Wherefore, it would stand very evil with me, that I, as a careless shepherd and one only for the sake of selfish gain, should treat the sheep entrusted to my care, so that I did not strengthen the weak and protect the strong. I have therefore made a sermon about the choice or difference of food, in which sermon nothing but the Holy Gospels and the teachings of the Apostles have been used, which greatly delighted the majority and emancipated them. But those, whose mind and conscience is defiled, as Paul says [Titus, 1:15], it only made mad. But since I have used only the above-mentioned Scriptures, and since those people cry out none the less unfairly, so loud that their cries are heard elsewhere, and since they that hear are vexed on account of their simplicity and ignorance of the matter, it seems to me to be necessary to explain the thing from the Scriptures, so that every one depending on the Divine Scriptures may maintain himself against the enemies of the Scriptures.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/huldrych-zwingli.html">Huldrych Zwingli</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Latin Works and The Correspondence of Huldreich Zwingli</cite>, ed. Samuel Macauley Jackson, trans. Henry Preble, Walter Lichtenstein, and Lawrence A. McLouth, vol. 1 (New York; London: G. P. Putnam’s Sons; Knickerbocker Press, 1912), 71–73.</span></figcaption>

<blockquote><p>…as Didoclavius [David Calderwood] observes (Altar of Damascus, ch. 10, p. 878), aliud est deputare, aliud dedicare, aliud sanctificare; Designation or deputation is when a man appoints a thing for such a use, still reserving power and right to put it to another use, if he please; so the Church appoints times and hours for preaching upon the week days, yet reserving power to employ those times otherwise when she shall think fit. Dedication is when a man so devotes a thing to some pious or civil use that he denudes himself of all right and title which thereafter he might claim unto it: as when a man dedicates a sum of money for the building of an exchange, a judgment-hall, etc. or a parcel of ground for a Church, a Church-yard, a glebe, a school, a hospital; he can claim no longer right to the dedicated thing. Sanctification is the setting apart of a thing for a holy or religious use in such sort that thereafter it may be put to no other use, Prov. 20:25. Now, whereas times set apart for ordinary and weekly preaching are only designed by the Church for this end and purpose, so that they are not holy, but only for the present they are applied to a holy use; neither is the worship appointed as convenient or beseeming for those times, but the times are appointed as convenient for the worship: festival days are holy both by dedication and consecration of them.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“…as Didoclavius [David Calderwood] observes (Altar of Damascus, ch. 10, p. 878), aliud est deputare, aliud dedicare, aliud sanctificare; Designation or deputation is when a man appoints a thing for such a use, still reserving power and right to put it to another use, if he please; so the Church appoints times and hours for preaching upon the week days, yet reserving power to employ those times otherwise when she shall think fit. Dedication is when a man so devotes a thing to some pious or civil use that he denudes himself of all right and title which thereafter he might claim unto it: as when a man dedicates a sum of money for the building of an exchange, a judgment-hall, etc. or a parcel of ground for a Church, a Church-yard, a glebe, a school, a hospital; he can claim no longer right to the dedicated thing. Sanctification is the setting apart of a thing for a holy or religious use in such sort that thereafter it may be put to no other use, Prov. 20:25. Now, whereas times set apart for ordinary and weekly preaching are only designed by the Church for this end and purpose, so that they are not holy, but only for the present they are applied to a holy use; neither is the worship appointed as convenient or beseeming for those times, but the times are appointed as convenient for the worship: festival days are holy both by dedication and consecration of them.”

— George Gillespie, English Popish Ceremonies (1637), pt. 3, ch. 1, pp. 6-7">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6as+Didoclavius+%5BDavid+Calderwood%5D+observes+%28Altar+of+Damascus%2C+ch.+10%2C+p.+878%29%2C+aliud+est+deputare%2C+aliud+dedicare%2C+aliud+sanctificare%3B+Designation+or+deputation+is+when+a+man+appoints+a+thing+for+such+a+use%2C+still+reserving+power+and+right+to+put+it+to+another+use%2C+if+he+please%3B+so+the+Church+appoints+times+and+hours+for+preaching+upon+the+week+days%2C+yet+reserving+power+to+employ+those+times+otherwise+when+she+shall+think+fit.+Dedication+is+when+a+man+so+devotes+a+thing+to+some+pious+or+civil+use+that+he+denudes+himself+of+all+right+and+title+which+thereafter+he+might+claim+unto+it%3A+as+when+a+man+dedicates+a+sum+of+money+for+the+building+of+an+exchange%2C+a+judgment-hall%2C+etc.+or+a+parcel+of+ground+for+a+Church%2C+a+Church-yard%2C+a+glebe%2C+a+school%2C+a+hospital%3B+he+can+claim+no+longer+right+to+the+dedicated+thing.+Sanctification+is+the+setting+apart+of+a+thing+for+a+holy+or+religious+use+in+such+sort+that+thereafter+it+may+be+put+to+no+other+use%2C+Prov.+20%3A25.+Now%2C+whereas+times+set+apart+for+ordinary+and+weekly+preaching+are+only+designed+by+the+Church+for+this+end+and+purpose%2C+so+that+they+are+not+holy%2C+but+only+for+the+present+they+are+applied+to+a+holy+use%3B+neither+is+the+worship+appointed+as+convenient+or+beseeming+for+those+times%2C+but+the+times+are+appointed+as+convenient+for+the+worship%3A+festival+days+are+holy+both+by+dedication+and+consecration+of+them.%E2%80%9D%0A%0A%E2%80%94+George+Gillespie%2C+English+Popish+Ceremonies+%281637%29%2C+pt.+3%2C+ch.+1%2C+pp.+6-7&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F03a9544991.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/03a9544991.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/christian-living/religious-holidays/#:~:text=as%20Didoclavius%20%5BDavid%20Calderwood%5D%20observes%20%28Altar,by%20dedication%20and%20consecration%20of%20them&amp;text=as%20Didoclavius%20%5BDavid%20Calderwood%5D%20observes%20%28Altar%20of%20Damascus&amp;text=holy%20both%20by%20dedication%20and%20consecration%20of%20them" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>The Religion, Doctrine and Discipline received, believed and defended by the Church of Scotland, and namely the public ministration of Baptism, and the Lord’s Supper, sitting at the table in the act of receiving the bread and wine of that Sacrament, the observation of the Lord’s Day, and the examination of children, for the first time at the ninth year of their age, for the second at the twelfth, for the third at the fourteenth, excluding and abhorring private baptism, private communion, kneeling in the act of receiving the Supper, holy days, or feast of Christmas, Passion, Resurrection, Ascension and sending down of the Holy Ghost: were brought in at the reformation of religion [in 1560], and enjoyed ever since in manner and form as follows. After due trial and advertisement taken of the heads in general and particular above written, the whole church was of one heart and judgment concerning the same…</p></blockquote>

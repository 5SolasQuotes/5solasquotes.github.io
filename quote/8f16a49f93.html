<blockquote><p>HUMAN NATURE in its FOURFOLD STATE, was the first production of my venerable Ancestor, introduced to the Public. It made its first appearance in the year 1720. Since that period, it has undergone at an average, One complete Edition every two years. Twenty thousand Copies of it have been exported to America, from one single City in Scotland, besides those that have been sent to the Continent from England and Ireland.

The rapid sale of the Book upon its first Publication, is a demonstrative proof of the esteem in which it was then held: and the uninterrupted demand for it still, shows that the Principles it inculcates, are yet held in repute. All that I need further to add, is, That the present Edition is printed from that one Revised and Corrected by the Author himself, and may therefore be esteemed correct.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/michael-boston.html">Michael Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Recommendation in Thomas Boston, Human nature in its fourfold state, of primitive integrity, subsisting in the parents of Mankind in paradise. Entire depravation, subsisting in the unregenerate. Begun recovery, subsisting in the regenerate. And consummate happiness or misery, subsisting in all man</cite></span></figcaption>

enanter</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-f6dd3ca899" data-kw="">
<blockquote><p>WHEN the Son of God became the Son of man, he so became the Son of man as still to remain the Son of God. He did not lay aside his Divine nature to assume the human; but he assumed the human nature into the Divine, not as it was corrupted by sin, but as it was at first created by God. For as it was corrupted by sin, it was corrupted with the worst of evils, and therefore, as such, both unworthy and uncapable of being united to God, the best of goods. Who therefore assuming the human nature into the unity of his Divine Person, assumed only what was worthy and capable of such assumption, to wit, the perfect nature of man as it was in its first creation, not as it was in its sinful corruption. And so he that was perfectly God as well as perfectly man, was a perfect man also as well as a perfect God.

Because it was the perfect nature of man which he assumed from his mother in time, as it was the perfect nature of God which he received of his Father from eternity. And therefore as he in the truth of the Divine nature was begotten like unto the Father in all things, his personal properties only excepted; so in the truth of the human nature he was made like unto us in all things, our sinful infirmities only excepted. He was in all things but sin like unto us; but in sin he was altogether unlike us. For we both in flesh and spirit are naturally full of sin, but he was clearly void of sin both in his flesh and spirit.

For he came to be a Lamb without spot, who by sacrifice of himself once made should take away the sins of the world: whereas had he been guilty of sin in himself, he could never have taken it away from us. … As God, he was infinitely contrary unto sin; and as man, he was perfectly void of it: yea he was therefore as man perfectly void of sin, because as God he was infinitely contrary to it; it being impossible that such things as are infinitely contrary to one another should be ever united together.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-beveridge.html">William Beveridge</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Ecclesia Anglicana Ecclesia Catholica; or, The Doctrine of the Church of England Consonant to Scripture, Reason, and Fathers: In a Discourse upon the Thirty-Nine Articles Agreed upon in the Convocation held at London MDLXII</cite>, in The Theological Works of William Beveridge, D.D. (12 vols, Oxford: John Henry Parker, 1842-48), 7: 326-28.</span></figcaption>

</figure><figure class="quote" id="q-a6d6a91339" data-kw="">
<blockquote><p>III. The law of the decalogue or ten commandments is a declaration of the law of nature and a picture of the image of God.

We also believe that this law is a declaration of the law of nature, which was written in the hearts of the first men perfectly, of others imperfectly and but in part, and therefore by this law is condemned whatsoever is not agreeable to that image of God, whereunto man was created, and is commanded whatsoever is agreeable to the same.

For God would shew by that law what man was in his first estate and what he was made in the second estate and what manner one he ought to be and further what he should afterwards be in the third estate in part, and what perfectly in the fourth by Christ. So that the law is nothing else but a true and lively picture of the image of God, to which man was created, whereby we are instructed what we were, what we are, what we ought to be and indeed what we shall be, if we trust in Christ.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/jerome-zanchi.html">Jerome Zanchi</a></span><span class="wk"><span class="lbl">Work:</span> <cite>De religione christiana fides – Confession of Christian Religion</cite>, ed. Luca Baschera and Christian Moser, Studies in the History of Christian Traditions, vol. 135 (1585; 2 vols, Leiden: Brill, 2007), X.III, 1: 191.</span></figcaption>

<blockquote><p>4. The gospel holds forth the greatest example of self-denial that ever was in the world, and by all ways that ever God has made known his mind, He never has revealed his will in an example of self-denial so as He has done in the Gospel, and that is in the example of the Lord Jesus Christ: God evidences there such a work of self-denial as never was: and ’tis impossible to apprehend a greater example of self-denial than that is: though Christ thought it no robbery to be equal with God; read but the second of the Philippians, vv. 7-8, and there you may see what Christ was, and yet how He emptied Himself, how He denied Himself in his honor, how vile He was made in the world, though He was the brightness of his father’s glory, yet He was made of no reputation; how He denied Himself in riches. Christ that was the heir of all things, though He were rich, yet He was made poor for us; how He denied Himself in his pleasures, He was the delight of the Father from all eternity, and yet he was made a man of sorrows; He denied Himself in his life, for He was the Lord of life, and yet He subjected Himself to death, to a cursed death for us: Oh the example of Christ in self-denial is the greatest that ever was: and this seems to be one great end of the humiliation of Jesus Christ to hold forth a preaching pattern of self-denial to the world: And there’s a great deal more power in the pattern and example of self-denial, then in the commands of self-denial. I only present this to show you that it is the most unbeseeming the gospel for anyone that professes the gospel to be selfish, altogether scraping for themselves; and whatsoever service they are put upon, except self may have an oar in it, they have no mind to it; Oh ’tis becoming the gospel of Jesus Christ for men and women to be emptied of themselves, no matter what becomes of ourselves, but be willing to give up ourselves for public good, to venture your estates and lives, and all your comforts, yea to be swallowed up in the glory of God, to be nothing, that Christ may be all. In the gospel of Christ, we find that Christ, He was swallowed up with the glory of his Father; and He came not to do his own will, but the will of his father that sent Him; and though He was one that had infinitely more excellency than all men and angels in heaven and earth, yet He was content for the honor of his Father to be made as a worm and no man, to be trampled under foot, to endure the greatest extremities of all sorts; this holds out an example to us, that while we live in this world we should be taken off from ourselves: Oh this self-love sticks much in the hearts of men and women: now upon the example of Christ’s self-denial, we are required to deny ourselves, and it is the proper lesson of the Gospel, ‘He that will follow me, let him deny himself,’ you never read of such a precept in all the Old Testament;(though no question the people of God did deny themselves then), but in expresse terms so fully you have not such a thing there: and there’s no such rules among the heathens for a man to deny himself. ‘Let him deny himself;’ those that know the original, know that the word is, not only to deny, but there is that joined to it that does increase the signification, let them deny themselves, thoroughly, there is a preposition put to the word, to show that those that will come to Christ must deny themselves, and that thoroughly, it is a proper lesson of the gospel, and the first lesson. Oh when our Lord and Master has thus denied Himself, and emptied Himself for good to us, what is beseeming this gospel, but that all that are professors of it should deny themselves? It is very unbeseeming the glorious gospel, for a Christian to be selfish, to have his self-ends, and self-ways, and interests in everything, as generally almost all men in the world they are acted by self, some self-ends, or self-excellency carries them on in their actions, or else they have no heart to do anything; this is unbecoming the gospel. But now I say, one that would live as becomes the Gospel, must be wholly emptied of himself, whatsoever parts, estate, credit, or honor he has in the world, must be melted into the glory of God; Jesus Christ for the glory of His Father, was content infinitly to deny Himself more than we can; For what have we to deny ourselves of? Do you or I live as becomes the gospel? when (I say) all that we apprehend to have any excellency in, we have it all swallowed up in the glory of God, when we can dedicate and consecrate our lives, honors, liberties, estates, comforts, and all to the glory of God, and be as nothing to ourselves, and let God be all in all to us. Ministers may bring many reasons why we should deny ourselves, but all these reasons comes to nothing, till the soul comes to behold the clear light of the gospel, and there beholds the Son of God by faith, how He did empty Himself; nay then, says a believing soul, if the Son of God did deny Himself, was emptied thus for me, Oh then let me be wholly taken off from myself, and venture wholly upon God, I must not live in myself, nor live for myself, nor live to myself; but wholly live in God, and for God, and to God, and upon God: Oh this is that which becomes the gospel of Jesus Christ.</p></blockquote>

and all your comforts, yea to be swallowed up in the glory of God, to be nothing, that Christ may be all. In the gospel of Christ, we find that Christ, He was swallowed up with the glory of his Father; and He came not to do his own will, but the will of his father that sent Him; and though He was one that had infinitely more excellency than all men and angels in heaven and earth, yet He was content for the honor of his Father to be made as a worm and no man, to be trampled under foot, to endure the greatest extremities of all sorts; this holds out an example to us, that while we live in this world we should be taken off from ourselves: Oh this self-love sticks much in the hearts of men and women: now upon the example of Christ’s self-denial, we are required to deny ourselves, and it is the proper lesson of the Gospel, ‘He that will follow me, let him deny himself,’ you never read of such a precept in all the Old Testament;(though no question the people of God did deny themselves then), but in expresse terms so fully you have not such a thing there: and there’s no such rules among the heathens for a man to deny himself. ‘Let him deny himself;’ those that know the original, know that the word is, not only to deny, but there is that joined to it that does increase the signification, let them deny themselves, thoroughly, there is a preposition put to the word, to show that those that will come to Christ must deny themselves, and that thoroughly, it is a proper lesson of the gospel, and the first lesson. Oh when our Lord and Master has thus denied Himself, and emptied Himself for good to us, what is beseeming this gospel, but that all that are professors of it should deny themselves? It is very unbeseeming the glorious gospel, for a Christian to be selfish, to have his self-ends, and self-ways, and interests in everything, as generally almost all men in the world they are acted by self, some self-ends, or self-excellency carries them on in their actions, or else they have no heart to do anything; this is unbecoming the gospel. But now I say, one that would live as becomes the Gospel, must be wholly emptied of himself, whatsoever parts, estate, credit, or honor he has in the world, must be melted into the glory of God; Jesus Christ for the glory of His Father, was content infinitly to deny Himself more than we can; For what have we to deny ourselves of? Do you or I live as becomes the gospel? when (I say) all that we apprehend to have any excellency in, we have it all swallowed up in the glory of God, when we can dedicate and consecrate our lives, honors, liberties, estates, comforts, and all to the glory of God, and be as nothing to ourselves, and let God be all in all to us. Ministers may bring many reasons why we should deny ourselves, but all these reasons comes to nothing, till the soul comes to behold the clear light of the gospel, and there beholds the Son of God by faith, how He did empty Himself; nay then, says a believing soul, if the Son of God did deny Himself, was emptied thus for me, Oh then let me be wholly taken off from myself, and venture wholly upon God, I must not live in myself, nor live for myself, nor live to myself; but wholly live in God, and for God, and to God, and upon God: Oh this is that which becomes the gospel of Jesus Christ.”

— Jeremiah Burroughs, Gospel Conversation, (London: Cole, 1650), sermon 5, on Phil. 1:27, pp. 93-5">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C4.+The+gospel+holds+forth+the+greatest+example+of+self-denial+that+ever+was+in+the+world%2C+and+by+all+ways+that+ever+God+has+made+known+his+mind%2C+He+never+has+revealed+his+will+in+an+example+of+self-denial+so+as+He+has+done+in+the+Gospel%2C+and+that+is+in+the+example+of+the+Lord+Jesus+Christ%3A+God+evidences+there+such+a+work+of+self-denial+as+never+was%3A+and+%E2%80%99tis+impossible+to+apprehend+a+greater+example+of+self-denial+than+that+is%3A+though+Christ+thought+it+no+robbery+to+be+equal+with+God%3B+read+but+the+second+of+the+Philippians%2C+vv.+7-8%2C+and+there+you+may+see+what+Christ+was%2C+and+yet+how+He+emptied+Himself%2C+how+He+denied+Himself+in+his+honor%2C+how+vile+He+was+made+in+the+world%2C+though+He+was+the+brightness+of+his+father%E2%80%99s+glory%2C+yet+He+was+made+of+no+reputation%3B+how+He+denied+Himself+in+riches.+Christ+that+was+the+heir+of+all+things%2C+though+He+were+rich%2C+yet+He+was+made+poor+for+us%3B+how+He+denied+Himself+in+his+pleasures%2C+He+was+the+delight+of+the+Father+from+all+eternity%2C+and+yet+he+was+made+a+man+of+sorrows%3B+He+denied+Himself+in+his+life%2C+for+He+was+the+Lord+of+life%2C+and+yet+He+subjected+Himself+to+death%2C+to+a+cursed+death+for+us%3A+Oh+the+example+of+Christ+in+self-denial+is+the+greatest+that+ever+was%3A+and+this+seems+to+be+one+great+end+of+the+humiliation+of+Jesus+Christ+to+hold+forth+a+preaching+pattern+of+self-denial+to+the+world%3A+And+there%E2%80%99s+a+great+deal+more+power+in+the+pattern+and+example+of+self-denial%2C+then+in+the+commands+of+self-denial.+I+only+present+this+to+show+you+that+it+is+the+most+unbeseeming+the+gospel+for+anyone+that+professes+the+gospel+to+be+selfish%2C+altogether+scraping+for+themselves%3B+and+whatsoever+service+they+are+put+upon%2C+except+self+may+have+an+oar+in+it%2C+they+have+no+mind+to+it%3B+Oh+%E2%80%99tis+becoming+the+gospel+of+Jesus+Christ+for+men+and+women+to+be+emptied+of+themselves%2C+no+matter+what+becomes+of+ourselves%2C+but+be+willing+to+give+up+ourselves+for+public+good%2C+to+venture+your+estates+and+lives%2C+and+all+your+comforts%2C+yea+to+be+swallowed+up+in+the+glory+of+God%2C+to+be+nothing%2C+that+Christ+may+be+all.+In+the+gospel+of+Christ%2C+we+find+that+Christ%2C+He+was+swallowed+up+with+the+glory+of+his+Father%3B+and+He+came+not+to+do+his+own+will%2C+but+the+will+of+his+father+that+sent+Him%3B+and+though+He+was+one+that+had+infinitely+more+excellency+than+all+men+and+angels+in+heaven+and+earth%2C+yet+He+was+content+for+the+honor+of+his+Father+to+be+made+as+a+worm+and+no+man%2C+to+be+trampled+under+foot%2C+to+endure+the+greatest+extremities+of+all+sorts%3B+this+holds+out+an+example+to+us%2C+that+while+we+live+in+this+world+we+should+be+taken+off+from+ourselves%3A+Oh+this+self-love+sticks+much+in+the+hearts+of+men+and+women%3A+now+upon+the+example+of+Christ%E2%80%99s+self-denial%2C+we+are+required+to+deny+ourselves%2C+and+it+is+the+proper+lesson+of+the+Gospel%2C+%E2%80%98He+that+will+follow+me%2C+let+him+deny+himself%2C%E2%80%99+you+never+read+of+such+a+precept+in+all+the+Old+Testament%3B%28though+no+question+the+people+of+God+did+deny+themselves+then%29%2C+but+in+expresse+terms+so+fully+you+have+not+such+a+thing+there%3A+and+there%E2%80%99s+no+such+rules+among+the+heathens+for+a+man+to+deny+himself.+%E2%80%98Let+him+deny+himself%3B%E2%80%99+those+that+know+the+original%2C+know+that+the+word+is%2C+not+only+to+deny%2C+but+there+is+that+joined+to+it+that+does+increase+the+signification%2C+let+them+deny+themselves%2C+thoroughly%2C+there+is+a+preposition+put+to+the+word%2C+to+show+that+those+that+will+come+to+Christ+must+deny+themselves%2C+and+that+thoroughly%2C+it+is+a+proper+lesson+of+the+gospel%2C+and+the+first+lesson.+Oh+when+our+Lord+and+Master+has+thus+denied+Himself%2C+and+emptied+Himself+for+good+to+us%2C+what+is+beseeming+this+gospel%2C+but+that+all+that+are+professors+of+it+should+deny+themselves%3F+It+is+very+unbeseeming+the+glorious+gospel%2C+for+a+Christian+to+be+selfish%2C+to+have+his+self-ends%2C+and+self-ways%2C+and+interests+in+everything%2C+as+generally+almost+all+men+in+the+world+they+are+acted+by+self%2C+some+self-ends%2C+or+self-excellency+carries+them+on+in+their+actions%2C+or+else+they+have+no+heart+to+do+anything%3B+this+is+unbecoming+the+gospel.+But+now+I+say%2C+one+that+would+live+as+becomes+the+Gospel%2C+must+be+wholly+emptied+of+himself%2C+whatsoever+parts%2C+estate%2C+credit%2C+or+honor+he+has+in+the+world%2C+must+be+melted+into+the+glory+of+God%3B+Jesus+Christ+for+the+glory+of+His+Father%2C+was+content+infinitly+to+deny+Himself+more+than+we+can%3B+For+what+have+we+to+deny+ourselves+of%3F+Do+you+or+I+live+as+becomes+the+gospel%3F+when+%28I+say%29+all+that+we+apprehend+to+have+any+excellency+in%2C+we+have+it+all+swallowed+up+in+the+glory+of+God%2C+when+we+can+dedicate+and+consecrate+our+lives%2C+honors%2C+liberties%2C+estates%2C+comforts%2C+and+all+to+the+glory+of+God%2C+and+be+as+nothing+to+ourselves%2C+and+let+God+be+all+in+all+to+us.+Ministers+may+bring+many+reasons+why+we+should+deny+ourselves%2C+but+all+these+reasons+comes+to+nothing%2C+till+the+soul+comes+to+behold+the+clear+light+of+the+gospel%2C+and+there+beholds+the+Son+of+God+by+faith%2C+how+He+did+empty+Himself%3B+nay+then%2C+says+a+believing+soul%2C+if+the+Son+of+God+did+deny+Himself%2C+was+emptied+thus+for+me%2C+Oh+then+let+me+be+wholly+taken+off+from+myself%2C+and+venture+wholly+upon+God%2C+I+must+not+live+in+myself%2C+nor+live+for+myself%2C+nor+live+to+myself%3B+but+wholly+live+in+God%2C+and+for+God%2C+and+to+God%2C+and+upon+God%3A+Oh+this+is+that+which+becomes+the+gospel+of+Jesus+Christ.%E2%80%9D%0A%0A%E2%80%94+Jeremiah+Burroughs%2C+Gospel+Conversation%2C+%28London%3A+Cole%2C+1650%29%2C+sermon+5%2C+on+Phil.+1%3A27%2C+pp.+93-5&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd8ea214094.html&amp;via=5Solas" tar

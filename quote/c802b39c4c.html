<main class="wrap"><figure class="quote" id="q-c802b39c4c" data-kw="">
<blockquote><p>I say, we close our prayers ordinarily with praise and glory to the Father, the Son, and the Holy Ghost; because it is warrantable from Scripture-practice, to wit, in blessing; and agreeable to the truth and liberty of Gospel-worship; and yet we refuse it in singing (mark it, not in praising), because, for that exercise, the Lord having instructed us with a sufficient plenty of Divine composures, we think it neither needful nor acceptable that we should gratify an arbitrary imposition in receiving the supplement of a human addition: It is true, the words are Scriptural, but can you say that the Scripture bears any such allowance for their use in singing as it doth for the Psalms of David? Yea and many other spiritual songs in Scripture, whereof you might indeed with some reason reprehend our too great disuse:</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-macward.html">Robert MacWard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The True Non-Conformist… ([Amsterdam], 1671), The Fifth Dialogue Answered. MacWard was the protege of Samuel Rutherford. He does not explicitly cite Eph. 5:19 &amp; Col. 3:16 below, but the allusions to those passages are obvious. He appears to allow for singing Scripture songs in some respect.</cite>, p. 279-80</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-63c4a4c1f1" data-kw="">
<blockquote><p>The oldest of the Conclusions, so far as is known, is that to Psalm 148 [only], which is found in the 1575 edition by Bassandyne, at the very end of the volume… Though the introduction of these compositions is involved in obscurity, it cannot be supposed that they were forced into the Psalm Book against the wishes of the church authorities… It is more conceivable that they were inserted quietly, on the printer’s own responsibility or that of other private parties; and their disappearance from most of the subsequent editions lends countenance to this conjecture. Even those for common metre are wanting in so important an edition of 1615. Very possibly those who had Episcopal leanings had most to do with their first introduction; but the absence of any trace of controversy on the subject warrants the inference that other parties acquiesced, so far at least as to make the use of them a matter of forebearance. It may also be inferred from the state of the psalm books that they were used only to a partial extent till after 1615.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/neil-livingston.html">Neil Livingston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Scottish Psalter of 1635 (1864) | ‘3. Conclusions’, pp. 35-37 in II – ‘Appendages to Metrical Psalms’ in Dissertation III, ‘The Literary Materials of the Psalter’</cite>, p. 37</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

sions%2C%20so,a%20partial%20extent%20till%20after%201615&amp;text=The%20oldest%20of%20the%20Conclusions%2C%20so%20far%20as&amp;text=only%20to%20a%20partial%20extent%20till%20after%201615" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-5af298c280" data-kw="">
<blockquote><p>Our songs must be spiritual: 1. For matter, not profane. 2. They must proceed from God’s Spirit, as the Author of them (see v. 17 and Ps. 37:4). 3. Must be framed with honest and gracious words beseeming the Spirit…</p></blockquote>

</figure><figure class="quote" id="q-a9beea392e" data-kw="">
<blockquote><p>When a sanctified man reads David’s psalms, or Paul’s epistles, how is he surprised with wonder to find the very workings of his own heart so exactly deciphered and fully expressed there! O, saith he, this is my very case, these holy men speak what my heart hath felt.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-flavel.html">John Flavel</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Flavel on the Content of Singing Public Praise to God | Method of Grace, p. 309</cite>, vol. 1; vol. 2</span></figcaption>

</figure><figure class="quote" id="q-aafb2b9365" data-kw="">
<blockquote><p>Let the most bitter-spirited antagonist ingenuously say, ‘Is not the whole Book of Psalms (so often avowed, cited, and used by Christ) Sepher-Tehillim, a Book of Praises, composed for the Churches use unto the end of time [in contrast to adding instrumentation]?’ or think you that this so excellent a part of Scripture was written only to inform us what the saints of God did before us, but not what we also must do by their example [of playing instruments in worship]? As for the abuse of music, we abominate it…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-reading.html">John Reading</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Sermon Delivered in the Cathedral Church of Canterbury, concerning church-music (London, 1663), p. 15. This sermon was given shortly after the Restoration and Great Ejection of 1662, in order to defend in Reading’s church, the cathedral church in Canterbury, that instruments were lawful in public worship, contra the dissenting puritans. Cathedral churches usually had more ornate music than parish churches.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>

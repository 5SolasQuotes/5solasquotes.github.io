<main class="wrap"><figure class="quote" id="q-6cbd577fcb" data-kw="">
<blockquote><p>That all the members of the catholic Church should meet together to hear one sermon, to partake of one sacrament, etc. as it was possible once, when their number was but an 120, Acts 1, so they are bound still, but that the multitude makes it impossible. That the particular congregations should join together in the same specifical ordinances, and have officers over them alike, is certainly an institution of Jesus Christ, as well, as to make the same profession of faith, and hope. Indeed, that, being so numerous, they should have one officer over them all, and join to hear one sermon, or receive the same sacrament numerical (as he [Owen] speaks) is a ridiculous fancy; and not only false, but impossible. But I would gladly know a reason why 40 or more members of no particular church, but only of the catholic, meeting together, and having a minister among them, may not join together to worship God in prayer, preaching and partaking of the sacrament, as well as the members of several particular churches, and himself [Owen] among them, may do the same; as they do often at London and Oxford when he preaches, unless he will count those ordinances then and there administered no acts of instituted worship; And if he grant them to be worship, how can he deny [on his principles] that assembly to be a particular church, though it be not fixed nor gathered and united by any explicit covenant, or consent to live and die together [as congregationalists held]. I shall only note again, that herein he deserts his [congregationalist] friends in New England…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-cawdrey.html">Daniel Cawdrey</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Independency a Great Schism Proved Against Dr. [John] Owen… (London, 1657), ch. 5</cite>, pp. 89-90</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

<blockquote><p>2. Whatever defects do not make union with a church and her ordinances sinful do not warrant separation… 3. Union with a church is lawful for those (i) whose callings lead them to a particular church and (ii) they can fulfill the duty of their callings without impediment, even if others fail to fulfill their duty… 4. Union must be maintained even if principles generally acknowledged in a church are not applied in practice… 5. Union must be maintained when the inconveniences following from separation are more harmful to the church than the inconveniences following union, provided that nothing makes union with a church and her ordinances sinful… 6. Union must be maintained when union with a church and her ordinances doesn’t require (i) personal sin or (ii) complicity in others’ sin.</p></blockquote>

</figure><figure class="quote" id="q-f4bd629bc5" data-kw="">
<blockquote><p>For Rom. 4:11, Abraham is there called the father of all them that believe, whether they were members of a particular visible Church or not. And for ought we find in the holy story, there might be some believers even in Abraham’s own time that were neither members of Abraham’s family, nor yet under the government or guidance of any particular church. If a son or bond-servant of Ephron the Hittite, or of any other Amorite or Canaanite were then brought unto the knowledge of the true God, and to wait for the promise, why might not the infant of such an one have then been circumcised, though not living in a visible Church? … 3. Those that for the present live not under the discipline and a particular Church, and yet make profession of true religion with the true visible Churches, and bring their children to them to be baptised, making solemn promise to bring up their children in the faith that is professed in those Churches; of which sort there are a great number in these Low-countries [the Netherlands], because none here are compelled to the sacraments, nor to subjection under the discipline: These in special are the persons that in our question are ‘without’ [the Church in a certain sense]. These parents, though in regard of that Church where they received their own baptism, and in regard of that Church whereunto they bring their infants to be baptized, they profess and practice some imperfect communion therewith, and therefore in some sense may be said to be of such Churches; yet because for the present they live not within the pale of any ecclesiastical government, neither are subject unto the discipline, either of one or other Church, in this regard are such here commonly said to be ‘without’. Now how Mr. Davenport will deduct and infer from the place alleged [1 Cor. 5:12] that these kind of parents are not to have the privilege of Christians, so far that their infants may be baptized, that cannot I comprehend: this remains to be manifested by him. Those only, according to the order of these Reformed Churches, are admitted for complete members of the Church, who bringing testimony of their good conversation, after examination and profession of their agreement with us in the same faith and religion, and after solemn covenant and promise of submission unto that discipline and government exercised amongst them, have their names published before the whole congregation the Lord’s-Day following, and when no just exception comes against them, are then received and confirmed for members of such particular churches. But that the children of these only are to be baptized, that is not made to appear from the sentence of Paul, 1 Cor. 5:12. For this third sort of persons without, though their fault be great in not joining unto some particular church when opportunity permits, though some through ignorance and error, and some for their carnal case and other sinister respects, do abstain from joining themselves unto the church: yet even among these also some have more knowledge of the truth and are more frequent in attending upon the public worship of God, and are otherwise more unblameable in their conversation than some of those…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-paget.html">John Paget</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Answer to the Unjust Complaints of William Best &amp; of such Other as have Subscribed Thereunto. Also an Answer to Mr. John Davenport [a congregationalist]… his Allegations of Scripture Against the Baptizing of Some Kind of Infants (Amsterdam, 1635), ‘An Answer to the Allegations of Scripture brought by Mr. Davenport, Against the Baptizing of such Infants whose Parents Appear to be Christians…’, p. 141 ff. Paget (c.1574–1638 or 1640) was an English puritan and presbyterian minister in Amsterdam, firmly opposed to the English separatistic and Independent churches that had magnetized to Amsterdam.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-membership.html">Church Membership</a></span></div>

ts%2C+though+in+regard+of+that+Church+where+they+received+their+own+baptism%2C+and+in+regard+of+that+Church+whereunto+they+bring+their+infants+to+be+baptized%2C+they+profess+and+practice+some+imperfect+communion+therewith%2C+and+therefore+in+some+sense+may+be+said+to+be+of+such+Churches%3B+yet+because+for+the+present+they+live+not+within+the+pale+of+any+ecclesiastical+government%2C+neither+are+subject+unto+the+discipline%2C+either+of+one+or+other+Church%2C+in+this+regard+are+such+here+commonly+said+to+be+%E2%80%98without%E2%80%99.+Now+how+Mr.+Davenport+will+deduct+and+infer+from+the+place+alleged+%5B1+Cor.+5%3A12%5D+that+these+kind+of+parents+are+not+to+have+the+privilege+of+Christians%2C+so+far+that+their+infants+may+be+baptized%2C+that+cannot+I+comprehend%3A+this+remains+to+be+manifested+by+him.+Those+only%2C+according+to+the+order+of+these+Reformed+Churches%2C+are+admitted+for+complete+members+of+the+Church%2C+who+bringing+testimony+of+their+good+conversation%2C+after+examination+and+profession+of+their+agreement+with+us+in+the+same+faith+and+religion%2C+and+after+solemn+covenant+and+promise+of+submission+unto+that+discipline+and+government+exercised+amongst+them%2C+have+their+names+published+before+the+whole+congregation+the+Lord%E2%80%99s-Day+following%2C+and+when+no+just+exception+comes+against+them%2C+are+then+received+and+confirmed+for+members+of+such+particular+churches.+But+that+the+children+of+these+only+are+to+be+baptized%2C+that+is+not+made+to+appear+from+the+sentence+of+Paul%2C+1+Cor.+5%3A12.+For+this+third+sort+of+persons+without%2C+though+their+fault+be+great+in+not+joining+unto+some+particular+church+when+opportunity+permits%2C+though+some+through+ignorance+and+error%2C+and+some+for+their+carnal+case+and+other+sinister+respects%2C+do+abstain+from+joining+themselves+unto+the+church%3A+yet+even+among+these+also+some+have+more+knowledge+of+the+truth+and+are+more+frequent+in+attending+upon+the+public+worship+of+God%2C+and+are+otherwise+more+unblameable+in+their+conversation+than+some+of+those%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+John+Paget%2C+An+Answer+to+the+Unjust+Complaints+of+William+Best+%26+of+such+Other+as+have+Subscribed+Thereunto.+Also+an+Answer+to+Mr.+John+Davenport+%5Ba+congregationalist%5D%E2%80%A6+his+Allegations+of+Scripture+Against+the+Baptizing+of+Some+Kind+of+Infants+%28Amsterdam%2C+1635%29%2C+%E2%80%98An+Answer+to+the+Allegations+of+Scripture+brought+by+Mr.+Davenport%2C+Against+the+Baptizing+of+such+Infants+whose+Parents+Appear+to+be+Christians%E2%80%A6%E2%80%99%2C+p.+141+ff.+Paget+%28c.1574%E2%80%931638+or+1640%29+was+an+English+puritan+and+presbyterian+minister+in+Amsterdam%2C+firmly+opposed+to+the+English+separatistic+and+Independent+churches+that+had+magnetized+to+Amsterdam.&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff4bd629bc5.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f4bd629bc5.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/local-church-membership-is-not-necessary-to-partake-of-the-sacraments/#:~:text=For%20Rom.%204%3A11%2C%20Abraham%20is%20there,their%20conversation%20than%20some%20of%20those%E2%80%A6" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>Question 3: Whether do you not hold all visible believers to be within the visible Church as members thereof, and not ‘without’, in the apostle’s sense, 1 Cor. 5, and therefore ought so to be acknowledged and accepted in all congregations wheresoever they shall come, and are so known: and ought (if they desire and be not otherwise unfit) of right to be permitted to partake in all God’s ordinances and Church privileges there, so far as they personally concern themselves, although they be not as yet fixed members in particular covenant, either with that congregation where for the present they reside, nor with any other? Question 4: Whether you do not hold that baptism rightly (for substance) partaked does make them that are so baptized, members of the visible Church: and so to have right (at least quoad nos [as far as to us]) to all the privileges thereof (so far as they are otherwise fit) until they be cast out (if they so deserve) by excommunication.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-bernard.html">Richard Bernard</a></span><span class="wk"><span class="lbl">Work:</span> <cite>32 Questions (1639) in Richard Mather, Church-Government &amp; Church-Covenant Discussed, in an Answer of the Elders of the Several Churches in New-England to Two &amp; Thirty Questions Sent Over to Them by Diverse Ministers in England, to Declare their Judgments Therein… (London, 1643) Bernard was an English puritan. These questions were answered by the New England congregationalists, but it does not appear that Bernard ever published a response (at least that is on the internet) to those answers.</cite></span></figcaption>

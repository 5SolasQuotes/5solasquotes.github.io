<main class="wrap"><figure class="quote" id="q-462cfb8246" data-kw="">
<blockquote><p>Worldly masters will not cast a way their faithful servants, but maintain them as they may, and thinkest thou that God will forsake his servants? Thinkest thou a mortal wretched man to be more loving to thee then the eternal God and merciful father that made thee, feedeth thee, and defendeth thee, when man cannot help thee? yea loveth the better then thou lovest thy self, and stayeth thee from running from him, when thou wouldest willingly seek thine own destruction wilfully.

Stand to him boldly, forsake him not cowardly. Polycarpus, an old man, when he should suffer martyrdom, was advised by some to have pity on his old age, and not so stiffly to stand out. Nay, saith he, I have served my Master Christ these 86. years, and he did me never harm, I will not forsake him now in my last days. Thus Nehemiah stoutly answering them, and boldly encouraging his fellows, goeth forward with the work, contemneth their mocking and false accusations, and falleth to his building again; so must all good builders of God’s house neither be afraid nor weary of scornful mockers, threatenings, accusations or violence, but manfully go forwards to the end, knowing that their God is stronger, wiser, and more willing to defend his people, then his enemies shall be to hurt them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-durham.html">James Durham</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Parliament’s commission: delivered in a sermon, upon Nehemiah chap. 2 vers. 19, 20</cite>, (London: R. Austin, 1643), pp 6-7.</span></figcaption>

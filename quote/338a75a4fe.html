<main class="wrap"><figure class="quote" id="q-338a75a4fe" data-kw="">
<blockquote><p>The philosophy which denies mind a place in the universe ought to be able to support its terrible conclusions by the presentation of evidence. But when asked on what authority they deny the universal beliefs of mankind, these philosophers have very little to say. To be sure, they are able to show that there is an intimate connection between mind and body, and they talk learnedly about nerve-currents and the grey matter of the brain.

But between matter and thought, between nerve-currents and personality, there is a breach which this philosophy does not fill. The belief in mind is a necessity of thought—a necessity felt none the less by those who write books to prove that mind does not exist. The materialist has encountered two barriers which rise mountain-like to dispute his passage into the realm of mind: the one is the mystery of life, and the other is the mystery of personality. The attempt to bring a living thing out of dead matter and to make mind a department of physiology has been a failure.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-l-patton.html">Francis L. Patton</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Summary of Christian Doctrine</cite>, (Philadelphia: The Westminster Press, 1901), p. 8.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-d85217bb9a" data-kw="">
<blockquote><p>1. A different rationale belongs to Theology and to the other disciplines which we have just mentioned: α. Theology, having God Himself as its object, in dignity far excels the remaining disciplines, and pertains to the Image of God primarily; the remaining disciplines only secondarily. β. God has not to such an extent delineated to us an express type of the other disciplines, as He has in the case of Theology, especially as it is revealed in His Word, unto which norm our Knowledge ought to be conformed.

2. Nevertheless, if anyone should wish to recognize a certain Archetypal Knowledge in God, and Ectypal in creatures, in the other arts and sciences also; it would be allowed by us, although in a less emphatic sense.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/bernard-de-moor.html">Bernardinus de Moor</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Continuous Commentary on Johannes Marckius’ Didactico-Elenctic Compendium of Christian Theology. Volume 1: Concerning the Word and Definition of Theology</cite>, trans. Steven Dilday (1761; Central SC: From Reformation to Reformation Translations, 2017), Ch. 1, § 7, p. 87.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>

</figure><figure class="quote" id="q-b0c8055d1d" data-kw="">
<blockquote><p>I answer that there were in the law some precepts that were purely ceremonial, as circumcision, the immolation of the lamb, and so on. Such laws, since they were only figurative, it is no longer licit to observe, for they were a figure of something to come; hence, anyone who observes them now would be signifying that Christ is still to come. But others were purely moral, and these must be observed now. …

But others were partly ceremonial and partly moral, as the judicial precepts. These laws are no longer to be used in regard to what is ceremonial; but in regard to what is moral, they must be obeyed. Yet it is not necessary that they be observed in their proper form.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-aquinas.html">Thomas Aquinas</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Super Epistolam B. Pauli ad Hebraeos lectura</cite>, (c. 1273), C. 7, L. 2, 339.</span></figcaption>

</figure><figure class="quote" id="q-33dc49d682" data-kw="">
<blockquote><p>…it’s possible to articulate Christian doctrine without formally invoking concepts like “essence,” “substance” and so on. Instead of saying, for example, that in the incarnation there is one hypostasis subsisting in two distinct natures, one can say that there is just Jesus and not someone else and that Jesus always remains both truly God and truly human. However, the fact that the use of the metaphysical language is not absolutely necessary does not mean that the metaphysical resources in question are detached from reality. It does not mean that what they offer us is just a set of coherent rules for saying things – rules that we might either take or leave. On the contrary, the classical metaphysical tradition developed by Christian thinkers like John of Damascus, Thomas Aquinas or the early Reformed theologians and philosophers involves a knowledge of how things are. Indeed, it is fundamentally an exposition of things human beings know to be true prior to engaging in any formal academic work. For example, things do have natures by virtue of which they are similar to other things. There really are substances in which accidents inhere… As we seek ways to express what God is like according to scriptural teaching, we should look to this philosophical tradition, not Kant or Hegel, because it sheds light on reality.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/steven-j-duby.html">Steven J. Duby</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘In Defense of Christian Philosophy</cite>, (2018) 22 paragraphs</span></figcaption>

</figure><figure class="quote" id="q-672ce0b2da" data-kw="">
<blockquote><p>…this being a case with them [“our Romanists”] resolved, that ‘if Purgatory be not admitted after death, prayer for the dead must be unprofitable.’ But though Thomas Aquinas and his abettors determine so…” (Answer to a Jesuit, pp. 243-44) . Indulgences are a Fancy Thomas, Summa, suppl., q. 25. For the Reformed: ‘On Indulgences’. . Limbos of the Fathers (Old Testament Saints) &amp; Damned Infants Disagreements The Limbos do Not Exist Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) Mastricht and “the common opinion of the Reformed” held that justification was fundamentally uniform under both Testaments. The papists, with Thomas cited, “think that the Old Testament fathers were until Christ’s actual satisfaction under the guilt of their sins, and therefore were not admitted into heaven, but were kept detained in a limbo particularly for them until Christ after his death lead them from there into heaven.” (TPT, vol. 5, ch. 6, §29) . Christ did Not Liberate the Fathers from Limbo at his Death Thomas did not believe in a local descent of Christ’s soul to Hell. He said, “Christ… penetrated to all the lower parts of the earth, not passing through them locally with His soul, but by spreading the effects of His power in a measure to them all…” (Summa, pt. 3, q. 52, art. 2, reply to obj. 1) He did believe, though that Christ delivered the Old Testament saints in the Limbo of the Fathers to Heaven (Summa, pt. 3, q. 52, art. 5). The Reformed, contra the Romanists, believed, ‘The Old Testament Saints went Directly to Heaven upon Death’ and denied any ‘Limbo of the Fathers’. . Hell Agreement Eternal Punishment Thomas, Summa, suppl., q. 99 For the Reformed: ‘Hell’. . The Damned shall Sinfully Blaspheme Leigh: “Its a question among the Schoolmen, Whether the damned blaspheme? Aquinas thinks it credible that after the resurrection they shall vocally blaspheme, as the saints shall vocally praise God: And some say, ‘So long as the damned blaspheme God, in this they sin, because they are bound to an eternal law.’ After this life the demerit of sin ceases, [as] you shall give an account for the things done in the body, 2 Cor. 5:10. The soul sins after, but shall not be judged for those sins; as in Heaven good actions ‘pertain to the reward of blessedness,’ so in hell evil actions ‘pertain to the penalty of damnation,’ says Aquinas in the same place.” (System of Divinity, p. 344) . Disagreements No Fourfold Hell Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) . Nature of Hell-Fire is Not Clearly Determinable Thomas: “…they will be punished in a physical fire.” (Sentences, bk. 4, dist. 44, q. 3, art. 2, quaestiuncula 2) Voet: “Whether true fire is given in Hell, or whether it is only metaphorical? It is not said and it is permitted to be inquired into. Whether it is corporal or rather spiritual? The question is inept. Whether it is of the same species with our fire? The question is curious… Is it an error of the Faith to suppose an incorporeal and immaterial infernal fire? The question is absurd.” (Syllabus, sect. 2, tract 6, title 6, subtitle 2, ‘Of Infernal Fire’) . Heaven Agreements Saints do Not See All Things on Earth through God Turretin contends against, “as the papists wish… the imaginary mirror of the Trinity, which they feign (as if saints, seeing all things in the essence of God saw all things done here) [to support the intercession of the saints]… It displeased not a few of the distinguished papists: Lombard, Thomas Aquinas [Summa, suppl. 92, art. 3]…” (2.43) . Saints will See Punishment of the Damned Leigh: “Aquinas has this question, Whether the blessed which are in the Fatherland see the punishment of the damned? and resolves they shall, because it makes to the perfection of their blessedness, ‘Opposites placed next to each other shine forth more brightly.’ They shall perfectly see the punishment of the wicked, that their blessedness may the more content them and they may give more abundant thanks to God.” (System of Divinity, p. 872) . The Heaven of God’s Throne Room will Not be Renovated with Fire Thomas: “…the higher heavens will not be cleansed by that fire… The cleansing of the world will be for the purpose of removing from bodies the disposition contrary to the perfection of glory… Peter explains himself to which heavens he refers… ‘the heavens first, and the earth through water perished, which now by the same word are kept in store, reserved unto fire unto the day of judgment’ (2 Pet 5:5–7)… Nor did the empyrean heaven contract any stain…” (Summa, suppl., q. 74, art. 4) For the Reformed: ‘On the Renovation, New Heavens &amp; Earth’. . Mixed Deification Thomas affirmed a kind of deification of heavenly saints with respect to the light of glory and the beatific vision. Yet for Thomas, “the light of glory, like the habit of grace, is something created. So in either state, pre- or post-mortem, deification is something created.” (p. 32) This is in contrast to deification being grounded in uncreated grace, per the Eastern Orthodox, which entails the host of problems often associated with the term. See Richard Cross, ‘Deification in Aquinas’. Yet many of the Reformed were hesitant or contrary to accepting Thomas’s exact method and paradigm of how saints see God. See on the Beatific Vision below. Yet, Carl Mosser has found the concept and/or terminology of deification, in protestant senses, in Martin Luther, Ulrich Zwingli, Martin Bucer, Henry Bullinger, John Calvin, Richard Hooker and Jonathan Edwards: ‘Deification: a Truly Ecumenical Concept’ and ‘Recovering the Reformation’s Ecumenical Vision of Redemption as Deification and Beatific Vision’. Using the term of deification for growing more and more into the image of God, through beholding Him, for all eternity, is not to no purpose. 2 Pet. 1:4 says “that by these,” including godliness, all graces and the promises of God, including that of glorification, “ye might be partakers of the divine nature”. Ps. 17:15: “As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.</p></blockquote>

<div class="meta"><span class="t"><a href="../topics/theology/faith-and-reason.html">Faith and Reason</a></span></div>
<div class="actions"><button class="copy" data-copy="“…this being a case with them [“our Romanists”] resolved, that ‘if Purgatory be not admitted after death, prayer for the dead must be unprofitable.’ But though Thomas Aquinas and his abettors determine so…” (Answer to a Jesuit, pp. 243-44) . Indulgences are a Fancy Thomas, Summa, suppl., q. 25. For the Reformed: ‘On Indulgences’. . Limbos of the Fathers (Old Testament Saints) &amp; Damned Infants Disagreements The Limbos do Not Exist Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) Mastricht and “the common opinion of the Reformed” held that justification was fundamentally uniform under both Testaments. The papists, with Thomas cited, “think that the Old Testament fathers were until Christ’s actual satisfaction under the guilt of their sins, and therefore were not admitted into heaven, but were kept detained in a limbo particularly for them until Christ after his death lead them from there into heaven.” (TPT, vol. 5, ch. 6, §29) . Christ did Not Liberate the Fathers from Limbo at his Death Thomas did not believe in a local descent of Christ’s soul to Hell. He said, “Christ… penetrated to all the lower parts of the earth, not passing through them locally with His soul, but by spreading the effects of His power in a measure to them all…” (Summa, pt. 3, q. 52, art. 2, reply to obj. 1) He did believe, though that Christ delivered the Old Testament saints in the Limbo of the Fathers to Heaven (Summa, pt. 3, q. 52, art. 5). The Reformed, contra the Romanists, believed, ‘The Old Testament Saints went Directly to Heaven upon Death’ and denied any ‘Limbo of the Fathers’. . Hell Agreement Eternal Punishment Thomas, Summa, suppl., q. 99 For the Reformed: ‘Hell’. . The Damned shall Sinfully Blaspheme Leigh: “Its a question among the Schoolmen, Whether the damned blaspheme? Aquinas thinks it credible that after the resurrection they shall vocally blaspheme, as the saints shall vocally praise God: And some say, ‘So long as the damned blaspheme God, in this they sin, because they are bound to an eternal law.’ After this life the demerit of sin ceases, [as] you shall give an account for the things done in the body, 2 Cor. 5:10. The soul sins after, but shall not be judged for those sins; as in Heaven good actions ‘pertain to the reward of blessedness,’ so in hell evil actions ‘pertain to the penalty of damnation,’ says Aquinas in the same place.” (System of Divinity, p. 344) . Disagreements No Fourfold Hell Turretin notes how “the papists make a fourfold hell,” including (1) hell proper, (2) purgatory, (3) the eternal limbo of infants with the suffering, not of sense, but of loss, and (4) the limbo of the Old Testament fathers, temporally suffering loss only, till Christ delivered them by his death, citing Thomas and others, and argues at length specifically against the limbo of the fathers. (2.257) . Nature of Hell-Fire is Not Clearly Determinable Thomas: “…they will be punished in a physical fire.” (Sentences, bk. 4, dist. 44, q. 3, art. 2, quaestiuncula 2) Voet: “Whether true fire is given in Hell, or whether it is only metaphorical? It is not said and it is permitted to be inquired into. Whether it is corporal or rather spiritual? The question is inept. Whether it is of the same species with our fire? The question is curious… Is it an error of the Faith to suppose an incorporeal and immaterial infernal fire? The question is absurd.” (Syllabus, sect. 2, tract 6, title 6, subtitle 2, ‘Of Infernal Fire’) . Heaven Agreements Saints do Not See All Things on Earth through God Turretin contends against, “as the papists wish… the imaginary mirror of the Trinity, which they feign (as if saints, seeing all things in the essence of God saw all things done here) [to support the intercession of the saints]… It displeased not a few of the distinguished papists: Lombard, Thomas Aquinas [Summa, suppl. 92, art. 3]…” (2.43) . Saints will See Punishment of the Damned Leigh: “Aquinas has this question, Whether the blessed which are in the Fatherland see the punishment of the damned? and resolves they shall, because it makes to the perfection of their blessedness, ‘Opposites placed next to each other shine forth more brightly.’ They shall perfectly see the punishment of the wicked, that their blessedness may the more content them and they may give more abundant thanks to God.” (System of Divinity, p. 872) . The Heaven of God’s Throne Room will Not be Renovated with Fire Thomas: “…the higher heavens will not be cleansed by that fire… The cleansing of the world will be for the purpose of removing from bodies the disposition contrary to the perfection of glory… Peter explains himself to which heavens he refers… ‘the heavens first, and the earth through water perished, which now by the same word are kept in store, reserved unto fire unto the day of judgment’ (2 Pet 5:5–7)… Nor did the empyrean heaven contract any stain…” (Summa, suppl., q. 74, art. 4) For the Reformed: ‘On the Renovation, New Heavens &amp; Earth’. . Mixed Deification Thomas affirmed a kind of deification of heavenly saints with respect to the light of glory and the beatific vision. Yet for Thomas, “the light of glory, like the habit of grace, is something created. So in either state, pre- or post-mortem, deification is something created.” (p. 32) This is in contrast to deification being grounded in uncreated grace, per the Eastern Orthodox, which entails the host of problems often associated with the term. See Richard Cross, ‘Deification in Aquinas’. Yet many of the Reformed were hesitant or contrary to accepting Thomas’s exact method and paradigm of how saints see God. See on the Beatific Vision below. Yet, Carl Mosser has found the concept and/or terminology of deification, in protestant senses, in Martin Luther, Ulrich Zwingli, Martin Bucer, Henry Bullinger, John Calvin, Richard Hooker and Jonathan Edwards: ‘Deification: a Truly Ecumenical Concept’ and ‘Recovering the Reformation’s Ecumenical Vision of Redemption as Deification and Beatific Vision’. Using the term of deification for growing more and more into the image of God, through beholding Him, for all eternity, is not to no purpose. 2 Pet. 1:4 says “that by these,” including godliness, all graces and the promises of God, including that of glorification, “ye might be partakers of the divine nature”. Ps. 17:15: “As for me, I will behold thy face in righteousness: I shall be satisfied, when I awake, with thy likeness.”

— Travis Fentiman, Where Reformed Orthodox Writers Agreed &amp; Disagreed with Aquinas, Purgatory is Not Real, Ussher:">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C%E2%80%A6this+being+a+case+with+them+%5B%E2%80%9Cour+Romanists%E2%80%9D%5D+resolved%2C+that+%E2%80%98if+Purgatory+be+not+admitted+after+death%2C+prayer+for+the+dead+must+be+unprofitable.%E2%80%99+But+though+Thomas+Aquinas+and+his+abettors+determine+so%E2%80%A6%E2%80%9D+%28Answer+to+a+Jesuit%2C+pp.+243-44%29+.+Indulgences+are+a+Fancy+Thomas%2C+Summa%2C+suppl.%2C+q.+25.+For+the+Reformed%3A+%E2%80%98On+Indulgences%E2%80%99.+.+Limbos+of+the+Fathers+%28Old+Testament+Saints%29+%26+Damned+Infants+Disagreements+The+Limbos+do+Not+Exist+Turretin+notes+how+%E2%80%9Cthe+papists+make+a+fourfold+hell%2C%E2%80%9D+including+%281%29+hell+proper%2C+%282%29+purgatory%2C+%283%29+the+eternal+limbo+of+infants+with+the+suffering%2C+not+of+sense%2C+but+of+loss%2C+and+%284%29+the+limbo+of+the+Old+Testament+fathers%2C+temporally+suffering+loss+only%2C+till+Christ+delivered+them+by+his+death%2C+citing+Thomas+and+others%2C+and+argues+at+length+specifically+against+the+limbo+of+the+fathers.+%282.257%29+Mastricht+and+%E2%80%9Cthe+common+opinion+of+the+Reformed%E2%80%9D+held+that+justification+was+fundamentally+uniform+under+both+Testaments.+The+papists%2C+with+Thomas+cited%2C+%E2%80%9Cthink+that+the+Old+Testament+fathers+were+until+Christ%E2%80%99s+actual+satisfaction+under+the+guilt+of+their+sins%2C+and+therefore+were+not+admitted+into+heaven%2C+but+were+kept+detained+in+a+limbo+particularly+for+them+until+Christ+after+his+death+lead+them+from+there+into+heaven.%E2%80%9D+%28TPT%2C+vol.+5%2C+ch.+6%2C+%C2%A729%29+.+Christ+did+Not+Liberate+the+Fathers+from+Limbo+at+his+Death+Thomas+did+not+believe+in+a+local+descent+of+Christ%E2%80%99s+soul+to+Hell.+He+said%2C+%E2%80%9CChrist%E2%80%A6+penetrated+to+all+the+lower+parts+of+the+earth%2C+not+passing+through+them+locally+with+His+soul%2C+but+by+spreading+the+effects+of+His+power+in+a+measure+to+them+all%E2%80%A6%E2%80%9D+%28Summa%2C+pt.+3%2C+q.+52%2C+art.+2%2C+reply+to+obj.+1%29+He+did+believe%2C+though+that+Christ+delivered+the+Old+Testament+saints+in+the+Limbo+of+the+Fathers+to+Heaven+%28Summa%2C+pt.+3%2C+q.+52%2C+art.+5%29.+The+Reformed%2C+contra+the+Romanists%2C+believed%2C+%E2%80%98The+Old+Testament+Saints+went+Directly+to+Heaven+upon+Death%E2%80%99+and+denied+any+%E2%80%98Limbo+of+the+Fathers%E2%80%99.+.+Hell+Agreement+Eternal+Punishment+Thomas%2C+Summa%2C+suppl.%2C+q.+99+For+the+Reformed%3A+%E2%80%98Hell%E2%80%99.+.+The+Damned+shall+Sinfully+Blaspheme+Leigh%3A+%E2%80%9CIts+a+question+among+the+Schoolmen%2C+Whether+the+damned+blaspheme%3F+Aquinas+thinks+it+credible+that+after+the+resurrection+they+shall+vocally+blaspheme%2C+as+the+saints+shall+vocally+praise+God%3A+And+some+say%2C+%E2%80%98So+long+as+the+damned+blaspheme+God%2C+in+this+they+sin%2C+because+they+are+bound+to+an+eternal+law.%E2%80%99+After+this+life+the+demerit+of+sin+ceases%2C+%5Bas%5D+you+shall+give+an+account+for+the+things+done+in+the+body%2C+2+Cor.+5%3A10.+The+soul+sins+after%2C+but+shall+not+be+judged+for+those+sins%3B+as+in+Heaven+good+actions+%E2%80%98pertain+to+the+reward+of+blessedness%2C%E2%80%99+so+in+hell+evil+actions+%E2%80%98pertain+to+the+penalty+of+damnation%2C%E2%80%99+says+Aquinas+in+the+same+place.%E2%80%9D+%28System+of+Divinity%2C+p.+344%29+.+Disagreements+No+Fourfold+Hell+Turretin+notes+how+%E2%80%9Cthe+papists+make+a+fourfold+hell%2C%E2%80%9D+including+%281%29+hell+proper%2C+%282%29+purgatory%2C+%283%29+the+eternal+limbo+of+infants+with+the+suffering%2C+not+of+sense%2C+but+of+loss%2C+and+%284%29+the+limbo+of+the+Old+Testament+fathers%2C+temporally+suffering+loss+only%2C+till+Christ+delivered+them+by+his+death%2C+citing+Thomas+and+others%2C+and+argues+at+length+specifically+against+the+limbo+of+the+fathers.+%282.257%29+.+Nature+of+Hell-Fire+is+Not+Clearly+Determinable+Thomas%3A+%E2%80%9C%E2%80%A6they+will+be+punished+in+a+physical+fire.%E2%80%9D+%28Sentences%2C+bk.+4%2C+dist.+44%2C+q.+3%2C+art.+2%2C+quaestiuncula+2%29+Voet%3A+%E2%80%9CWhether+true+fire+is+given+in+Hell%2C+or+whether+it+is+only+metaphorical%3F+It+is+not+said+and+it+is+permitted+to+be+inquired+into.+Whether+it+is+corporal+or+rather+spiritual%3F+The+question+is+inept.+Whether+it+is+of+the+same+species+with+our+fire%3F+The+question+is+curious%E2%80%A6+Is+it+an+error+of+the+Faith+to+suppose+an+incorporeal+and+immaterial+infernal+fire%3F+The+question+is+absurd.%E2%80%9D+%28Syllabus%2C+sect.+2%2C+tract+6%2C+title+6%2C+subtitle+2%2C+%E2%80%98Of+Infernal+Fire%E2%80%99%29+.+Heaven+Agreements+Saints+do+Not+See+All+Things+on+Earth+through+God+Turretin+contends+against%2C+%E2%80%9Cas+the+papists+wish%E2%80%A6+the+imaginary+mirror+of+the+Trinity%2C+which+they+feign+%28as+if+saints%2C+seeing+all+things+in+the+essence+of+God+saw+all+things+done+here%29+%5Bto+support+the+intercession+of+the+saints%5D%E2%80%A6+It+displeased+not+a+few+of+the+distinguished+papists%3A+Lombard%2C+Thomas+Aquinas+%5BSumma%2C+suppl.+92%2C+art.+3%5D%E2%80%A6%E2%80%9D+%282.43%29+.+Saints+will+See+Punishment+of+the+Damned+Leigh%3A+%E2%80%9CAquinas+has+this+question%2C+Whether+the+blessed+which+are+in+the+Fatherland+see+the+punishment+of+the+damned%3F+and+resolves+they+shall%2C+because+it+makes+to+the+perfection+of+their+blessedness%2C+%E2%80%98Opposites+placed+next+to+each+other+shine+forth+more+brightly.%E2%80%99+They+shall+perfectly+see+the+punishment+of+the+wicked%2C+that+their+blessedness+may+the+more+content+them+and+they+may+give+more+abundant+thanks+to+God.%E2%80%9D+%28System+of+Divinity%2C+p.+872%29+.+The+Heaven+of+God%E2%80%99s+Throne+Room+will+Not+be+Renovated+with+Fire+Thomas%3A+%E2%80%9C%E2%80%A6the+higher+heavens+will+not+be+cleansed+by+that+fire%E2%80%A6+The+cleansing+of+the+world+will+be+for+the+purpose+of+removing+from+bodies+the+disposition+contrary+to+the+perfection+of+glory%E2%80%A6+Peter+explains+himself+to+which+heavens+he+refers%E2%80%A6+%E2%80%98the+heavens+first%2C+and+the+earth+through+water+perished%2C+which+now+by+the+same+word+are+kept+in+store%2C+reserved+unto+fire+unto+the+day+of+judgment%E2%80%99+%282+Pet+5%3A5%E2%80%937%29%E2%80%A6+Nor+did+the+empyrean+heaven+contract+any+stain%E2%80%A6%E2%80%9D+%28Summa%2C+suppl.%2C+q.+74%2C+art.+4%29+For+the+Reformed%3A+%E2%80%98On+the+Renovation%2C+New+Heavens+%26+Earth%E2%80%99.+.+Mixed+Deification+Thomas+affirmed+a+kind+of+deification+of+heavenly+saints+with+respect+to+the+light+of+glory+and+the+beatific+vision.+Yet+for+Thomas%2C+%E2%80%9Cthe+light+of+glory%2C+like+the+habit+of+grace%2C+is+something+created.+So+in+either+state%2C+pre-+or+post-mortem%2C+deification+is+something+created.%E2%80%9D+%28p.+32%29+This+is+in+contrast+to+deification+being+grounded+in+uncreated+grace%2C+per+the+Eastern+Orthodox%2C+which+entails+the+host+of+problems+often+associated+with+the+term.+See+Richard+Cross%2C+%E2%80%98Deification+in+Aquinas%E2%80%99.+Yet+many+of+the+Reformed+were+hesitant+or+contrary+to+accepting+Thomas%E2%80%99s+exact+method+and+paradigm+of+how+saints+see+God.+See+on+the+Beatific+Vision+below.+Yet%2C+Carl+Mosser+has+found+the+concept+and%2For+terminology+of+deification%2C+in+protestant+senses%2C+in+Martin+Luther%2C+Ulrich+Zwingli%2C+Martin+Bucer%2C+Henry+Bullinger%2C+John+Calvin%2C+Richard+Hooker+and+Jonathan+Edwards%3A+%E2%80%98Deification%3A+a+Truly+Ecumenical+Concept%E2%80%99+and+%E2%80%98Recovering+the+Reformation%E2%80%99s+Ecumenical+Vision+of+Redemption+as+Deification+and+Beatific+Vision%E2%80%99.+Using+the+term+of+deification+for+growing+more+and+more+into+the+image+of+God%2C+through+beholding+Him%2C+for+all+eternity%2C+is+not+to+no+purpose.+2+Pet.+1%3A4+says+%E2%80%9Cthat+by+these%2C%E2%80%9D+including+godliness%2C+all+graces+and+the+promises+of+God%2C+including+that+of+glorification%2C+%E2%80%9Cye+might+be+partakers+of+the+divine+nature%E2%80%9D.+Ps.+17%3A15%3A+%E2%80%9CAs+for+me%2C+I+will+behold+thy+face+in+righteousness%3A+I+shall+be+satisfied%2C+when+I+awake%2C+with+thy+likeness.%E2%80%9D%0A%0A%E2%80%94+Travis+Fentiman%2C+Where+Reformed+Orthodox+Writers+Agreed+%26+Disagreed+with+Aquinas%2C+Purgatory+is+Not+Real%2C+Ussher%3A&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F672ce0b2da.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/672ce0b2da.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/where-reformed-orthodox-writers-agreed-disagreed-with-aquinas/#:~:text=this%20being%20a%20case%20with%20them,when%20I%20awake%2C%20with%20thy%20likeness&amp;text=this%20being%20a%20case%20with%20them%20%5B%E2%80%9Cour%20Romanists&amp;text=be%20satisfied%2C%20when%20I%20awake%2C%20with%20thy%20likeness" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

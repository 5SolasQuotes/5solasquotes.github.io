<blockquote><p>[Margin Note:] What sparkles of grace all have For the first: God engages all men as Christ’s debtors thus far: that it is mercy that they live or have any opportunity of seeking God, whatever be the means, natural or supernatural; whereas for the sin of Adam God might by a like justice have destroyed the world and all mankind, vanity is penally inflicted on all the servants for treason of the master against the King of Heaven and earth; but in Christ there be two mitigations:

1. One is that the servants are not destroyed for the sin of the master.

2. That as the forefated lord is restored, so the sick servants groaning under vanity shall be delivered from that bondage they come under for the sin of man, Rom. 8:20-22. Hence it is, though we be outlaws by nature, that now by a privilige of grace from the Mediator, the tenants receive and lodge the master because Christ has taken off the statute and act of forfeiture.

2. No man living on earth, but he is beholding to Christ (though many know Him not) for common helps of providence, and experiences do teach him some more of God by nature.

3. The sound of Christ, God revealed in the Gospel in the apostles’ ministry, is declared and is gone to the ends of the earth and to the nations, Ps. 19:4; Rom. 10:18.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Christ Dying &amp; Drawing Sinners to Himself</cite>, (1647), p. 365</span></figcaption>

<blockquote><p>The origin of the doctrine of common grace was occasioned by the fact that there is in the world, alongside of the course of the Christian life with all its blessings, a natural course of life, which is not redemptive and yet exhibits many traces of the true, the good, and the beautiful. The question arose, How can we explain the comparatively orderly life in the world, seeing that the whole world lies under the curse of sin? How is it that the earth yields precious fruit in rich abundance and does not simply bring forth thorns and thistles? How we can we account for it that sinful man still retains some knowledge of God, of natural things, and of the difference between good and evil, and shows some regard for virtue and for good outward behavior? What explanation can be given for the special gifts and talents that with which the natural man is endowed, and of the development of science and art by those who are entirely devoid of the new life that is in Christ Jesus? How can we explain the religious aspirations of men everywhere, even of those who did not come in touch with the Christian religion? How can the unregenerate still speak truth, do good to others, and lead outwardly virtuous lives?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/louis-berkhof.html">Louis Berkhof</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Systematic Theology</cite>, (Eerdmans, 1968), pp. 432-46</span></figcaption>

</figure><figure class="quote" id="q-6232a66583" data-kw="">

</figure><figure class="quote" id="q-f3d1a654ef" data-kw="">
<blockquote><p>4…. but the conscience is more dull in apprehending that spiritual vengeance follows such spiritual sins as unbelief, because until there be some supernatural revelation, we are dead to the Gospel truths, and Gospel sins, but when a common grace heightens the soul to a supernatural assent, that Christ is a Teacher sent of God (Jn. 7:28; Jn. 3:2), the conviction is more strong: But because it is more supernatural, and in stead of kindly affection of love which it wants [lacks], it is mixed with hatred and anger and so degenerates into fiery indignation against the Holy Ghost, as Jn. 15:24 compared with Mt.12:15; 26:31 clears.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-3c6486d6d5" data-kw="">
<blockquote><p>That though many of the professors of the truth lead a life contrary to that which they professed, and yet the governors use not the rod of discipline to censure them, the members, notwithstanding, ought not to separate from the Church and worship, but to stay and plead with their mother.</p></blockquote>

<blockquote><p>‘That the prevailing strength of the Cameronian party was the occasion of all’ that here he [the episcopal opponent] complains of, even the abolishing of episcopacy [at 1690]. [On the contrary.] All the presbyterians in Scotland did contribute their endeavors to this, as also did many who formerly had gone along with the courses that the episcopalians promoted: Now to call all the presbyterians, or most of them Cameronians, is as remote from truth as anything can be… The men of most note and zeal for presbytery did what in them lay to allay that forwardness of the people [around 1689], that the Church might be reformed in a more legal way.</p></blockquote>

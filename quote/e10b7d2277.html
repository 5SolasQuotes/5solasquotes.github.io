<main class="wrap"><figure class="quote" id="q-e10b7d2277" data-kw="">
<blockquote><p>When he [Thomas Hobbes] saith, [That whatsoever the Prince doth, can be no injury to the subject, nor ought he to be accused by any of them of injustice; for he that doth any thing by authority from another, doth therein no injury to him by whose authority he acteth.] This doctrine will hardly down with free born people, who choose to themselves Princes, not to tyrannise over them, but like good shepherds, or fathers of their Country, to rule them; the people were not mad to give their power so to Princes, as to be their slaves; or to think that tyrannical cruelties and oppressions are not injuries to the subject, or that tyrants must not be accused of injustice, for although the Prince acteth by the peoples authority in things lawful, yet in his lawless exorbitancies, he acteth by his own tyrannising power, not by the peoples’ authority; for they be authors of his lawful power, yet they are no ways authors of his exorbitancies: and it is ridiculous when he saith, [No man can do injury to himself, and that the Prince may commit iniquity but not injustice or injury.]

For its too apparent, that most men are too injurious to themselves, nemo laeditur nisi à seipso, O, Israel, thy destruction is of thy self: And I would fain know what true difference there is between injustice and iniquity, or injury, for jus and aequum signi∣fie the same thing in Latin, whence we borrow the words injustice, injury, iniquity: I know some put a difference between jus and aequum, but to little purpose; for doubtless, every injury is unjust, and each unjust act is an injury, and an iniquity either against God or man; he is also injurious to good Princes, when he makes no difference between them and tyrants, Part 2. cap. 20. [between despotical and paternal dominions, making tyrants and Sovereigns by institution all one in rights and consequences.]

This is to put no difference between the Father and Butcher of his Country, between the Shepherd and the wolf, between sharing and fleeing of the sheep. A King governs, and is governed by laws; a tyrant hath no law but his will; jus est in armis, opprimit leges timor. This his absurd assertion he would patronise by Scripture, which describeth to us, 1 Sam. 8. 11, 12. verses, the manner of Kings; namely, to take your sons and daughters to drive his chariot, &amp;c. To take your fields and Vineyards, &amp;c. But in that he mistakes himself; for in that chapter the Scriptures describes unto us, not the qualities of Kings, but of tyrants, such as the neighbouring Nations had, which dwelt about Judea: but if he will see the qualities of a good King, and such as the Lord would choose; let him read the 17. chapter of Deuteronomy, there he shall find a King that must be regulated by the law of God, and not by his own will.</p></blockquote>

<blockquote><p>24. But as we have hitherto described the magistrate who truly is what he is called-viz. the father of his country, and (as the Poet speaks) the pastor of the people, the guardian of peace, the president of justice, the vindicator of innocence, he is justly to be deemed a madman who disapproves of such authority. And since in almost all ages we see that some princes, careless about all their duties on which they ought to have been intent, live, without solicitude, in luxurious sloth; others, bent on their own interest, venally prostitute all rights, privileges, judgments, and enactments; others pillage poor people of their money, and afterwards squander it in insane largesses; others act as mere robbers, pillaging houses, violating matrons, and slaying the innocent; many cannot be persuaded to recognize such persons for princes, whose command, as far as lawful, they are bound to obey. For while in this unworthy conduct, and among atrocities so alien, not only from the duty of the magistrate, but also of the man, they behold no appearance of the image of God, which ought to be conspicuous in the magistrate, while they see not a vestige of that minister of God, who was appointed to be a praise to the good and a terror to the bad, they cannot recognize the ruler whose dignity and authority Scripture recommends to us. And, undoubtedly, the natural feeling of the human mind has always been not less to assail tyrants with hatred and execration, than to look up to just kings with love and veneration.

25. But if we have respect to the Word of God, it will lead us farther, and make us subject not only to the authority of those princes who honestly and faithfully perform their duty toward us, but all princes, by whatever means they have so become, although there is nothing they less perform than the duty of princes. For though the Lord declares that a ruler to maintain our safety is the highest gift of his beneficence, and prescribes to rulers themselves their proper sphere, He at the same time declares, that of whatever description they may be, they derive their power from none but Him. Those, indeed, who rule for the public good, are true examples and specimens of his beneficence, while those who domineer unjustly and tyrannically are raised up by him to punish the people for their iniquity. Still all alike possess that sacred majesty with which he has invested lawful power. I will not proceed further without subjoining some distinct passages to this effect (Job 34:30; Hos. 13:11; Isa. 3:4; 10:5; Deut. 28:29). We need not labor to prove that an impious king is a mark of the Lord’s anger, since I presume no one will deny it, and that this is not less true of a king than of a robber who plunders your goods, an adulterer who defiles your bed, and an assassin who aims at your life, since all such calamities are classed by Scripture among the curses of God. But let us insist at greater length in proving what does not so easily fall in with the views of men, that even an individual of the worst character, one most unworthy of all honor, if invested with public authority, receives that illustrious divine power which the Lord by his Word devolved on the ministers of his justice and judgment, and that, accordingly, in so far as public obedience is concerned, he is to be held in the same honor and reverence as the best of kings. … 27. …If we constantly keep before our eyes and minds the fact, that even the most iniquitous kings are appointed by the same decree which establishes all regal authority, we will never entertain the seditious thought, that a king is to be treated according to this deserts, and that we are not bound to act the part of good subjects to him who does not in his turn act the part of a king to us. … 29. This feeling of reverence, and even of piety, we owe to the utmost to all our rulers, be their characters what they may. This I repeat the oftener, that we may learn not to consider the individuals themselves, but hold it to be enough that by the will of the Lord they sustain a character on which he has impressed and engraven inviolable majesty. But rulers, you will say, owe mutual duties to those under them. This I have already confessed. But if from this you conclude that obedience is to be returned to none but just governors, you reason absurdly.</p></blockquote>

— John Calvin, Institutes of the Christian Religion, bk. 4, ch. 20">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C24.+But+as+we+have+hitherto+described+the+magistrate+who+truly+is+what+he+is+called-viz.+the+father+of+his+country%2C+and+%28as+the+Poet+speaks%29+the+pastor+of+the+people%2C+the+guardian+of+peace%2C+the+president+of+justice%2C+the+vindicator+of+innocence%2C+he+is+justly+to+be+deemed+a+madman+who+disapproves+of+such+authority.+And+since+in+almost+all+ages+we+see+that+some+princes%2C+careless+about+all+their+duties+on+which+they+ought+to+have+been+intent%2C+live%2C+without+solicitude%2C+in+luxurious+sloth%3B+others%2C+bent+on+their+own+interest%2C+venally+prostitute+all+rights%2C+privileges%2C+judgments%2C+and+enactments%3B+others+pillage+poor+people+of+their+money%2C+and+afterwards+squander+it+in+insane+largesses%3B+others+act+as+mere+robbers%2C+pillaging+houses%2C+violating+matrons%2C+and+slaying+the+innocent%3B+many+cannot+be+persuaded+to+recognize+such+persons+for+princes%2C+whose+command%2C+as+far+as+lawful%2C+they+are+bound+to+obey.+For+while+in+this+unworthy+conduct%2C+and+among+atrocities+so+alien%2C+not+only+from+the+duty+of+the+magistrate%2C+but+also+of+the+man%2C+they+behold+no+appearance+of+the+image+of+God%2C+which+ought+to+be+conspicuous+in+the+magistrate%2C+while+they+see+not+a+vestige+of+that+minister+of+God%2C+who+was+appointed+to+be+a+praise+to+the+good+and+a+terror+to+the+bad%2C+they+cannot+recognize+the+ruler+whose+dignity+and+authority+Scripture+recommends+to+us.+And%2C+undoubtedly%2C+the+natural+feeling+of+the+human+mind+has+always+been+not+less+to+assail+tyrants+with+hatred+and+execration%2C+than+to+look+up+to+just+kings+with+love+and+veneration.+25.+But+if+we+have+respect+to+the+Word+of+God%2C+it+will+lead+us+farther%2C+and+make+us+subject+not+only+to+the+authority+of+those+princes+who+honestly+and+faithfully+perform+their+duty+toward+us%2C+but+all+princes%2C+by+whatever+means+they+have+so+become%2C+although+there+is+nothing+they+less+perform+than+the+duty+of+princes.+For+though+the+Lord+declares+that+a+ruler+to+maintain+our+safety+is+the+highest+gift+of+his+beneficence%2C+and+prescribes+to+rulers+themselves+their+proper+sphere%2C+He+at+the+same+time+declares%2C+that+of+whatever+description+they+may+be%2C+they+derive+their+power+from+none+but+Him.+Those%2C+indeed%2C+who+rule+for+the+public+good%2C+are+true+examples+and+specimens+of+his+beneficence%2C+while+those+who+domineer+unjustly+and+tyrannically+are+raised+up+by+him+to+punish+the+people+for+their+iniquity.+Still+all+alike+possess+that+sacred+majesty+with+which+he+has+invested+lawful+power.+I+will+not+proceed+further+without+subjoining+some+distinct+passages+to+this+effect+%28Job+34%3A30%3B+Hos.+13%3A11%3B+Isa.+3%3A4%3B+10%3A5%3B+Deut.+28%3A29%29.+We+need+not+labor+to+prove+that+an+impious+king+is+a+mark+of+the+Lord%E2%80%99s+anger%2C+since+I+presume+no+one+will+deny+it%2C+and+that+this+is+not+less+true+of+a+king+than+of+a+robber+who+plunders+your+goods%2C+an+adulterer+who+defiles+your+bed%2C+and+an+assassin+who+aims+at+your+life%2C+since+all+such+calamities+are+classed+by+Scripture+among+the+curses+of+God.+But+let+us+insist+at+greater+length+in+proving+what+does+not+so+easily+fall+in+with+the+views+of+men%2C+that+even+an+individual+of+the+worst+character%2C+one+most+unworthy+of+all+honor%2C+if+invested+with+public+authority%2C+receives+that+illustrious+divine+power+which+the+Lord+by+his+Word+devolved+on+the+ministers+of+his+justice+and+judgment%2C+and+that%2C+accordingly%2C+in+so+far+as+public+obedience+is+concerned%2C+he+is+to+be+held+in+the+same+honor+and+reverence+as+the+best+of+kings.+%E2%80%A6+27.+%E2%80%A6If+we+constantly+keep+before+our+eyes+and+minds+the+fact%2C+that+even+the+most+iniquitous+kings+are+appointed+by+the+same+decree+which+establishes+all+regal+authority%2C+we+will+never+entertain+the+seditious+thought%2C+that+a+king+is+to+be+treated+according+to+this+deserts%2C+and+that+we+are+not+bound+to+act+the+part+of+good+subjects+to+him+who+does+not+in+his+turn+act+the+part+of+a+king+to+us.+%E2%80%A6+29.+This+feeling+of+reverence%2C+and+even+of+piety%2C+we+owe+to+the+utmost+to+all+our+rulers%2C+be+their+characters+what+they+may.+This+I+repeat+the+oftener%2C+that+we+may+learn+not+to+consider+the+individuals+themselves%2C+but+hold+it+to+be+enough+that+by+the+will+of+the+Lord+they+sustain+a+character+on+which+he+has+impressed+and+engraven+inviolable+majesty.+But+rulers%2C+you+will+say%2C+owe+mutual+duties+to+those+under+them.+This+I+have+already+confessed.+But+if+from+this+you+conclude+that+obedience+is+to+be+returned+to+none+but+just+governors%2C+you+reason+absurdly.%E2%80%9D%0A%0A%E2%80%94+John+Calvin%2C+Institutes+of+the+Christian+Religion%2C+bk.+4%2C+ch.+20&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F301302d040.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/301302d040.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/against-separation-from-impure-civil-governments/#:~:text=24.%20But%20as%20we%20have%20hitherto,but%20just%20governors%2C%20you%20reason%20absurdly&amp;text=24.%20But%20as%20we%20have%20hitherto%20described%20the&amp;text=to%20none%20but%20just%20governors%2C%20you%20reason%20absurdly" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

<blockquote><p>…especially seeing his Majesty shall ever find that he has none more loyal and true subjects, who will more gladly employ and bestow their lives, lands, houses, holds, goods, gear, rents, revenues, places, privileges, means, moities and all, in his Highness’s service and mantainance of his royal crown; and moreover, have so deeply conceived a strong and full persuasion of his Majesty’s princely virtues, and much renowned propension to piety, and equity, that they will urge their consciences, by all good and lawful means, to assent unto every thing which he enjoins, as right and convenient; and when the just aversation [aversion] of conscience upon evident reasons is invincible, will notwithstanding be more willing to all other duties of subjection, and more averse from the least show of contempt.</p></blockquote>

</figure><figure class="quote" id="q-e77df7bdf0" data-kw="">
<blockquote><p>Mr. Ashcam… lays down four cases wherein he says subjects are freed from their sworn allegiance. His three first (viz:

1. If a prince abandon.

2. If he alienate.

3. If Nero-like through mad fury or folly, he seek in an hostile way the destruction of his whole kingdom) will I presume be taken not to concern our case in hand; the fourth possibly may be judged applicable to it… Fourthly, (says he) if the prince have part of the supreme right, and the people the other part, then notwithstanding an oath of allegiance to him, he may be opposed if he invade the other part of supreme right… And in the next section he says of all those four cases, and therefore of this, that they show how we are absolved in our own consciences from all oath and contract when one party forfeits his conditions first. The defensive opposing of a prince, invading his compeers’ part by the party invaded where the supreme right is so shared (supposing the oath of allegiance to be cautioned according to that sharing), I shall not dispute…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-gee.html">Edward Gee</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exercitation concerning Usurped Powers</cite>, … (London, 1650), ch. 4, pp. 47-48</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

<blockquote><p>And what can train us to likeness to Christ so much as prayers in which all thought of self being cast aside we pour out our hearts in manifestation of our love to our brethren, and in longings for the extension of the Redeemer’s Kingdom in the world. And surely the higher advances any makes in the spiritual life, the more he rises above self, the larger space will requests for others occupy in his devotions.</p></blockquote>

</figure><figure class="quote" id="q-ad8d89aeae" data-kw="">
<blockquote><p>O Jehovah! God of my salvation! Let me call upon you particularly to notice what I have just now stated, That although the prophet simply, and without hyperbole, recites the agony which he suffered from the greatness of his sorrows, yet his purpose was at the same time to supply the afflicted with a form of prayer that they might not faint under any adversities, however severe, which might befall them. We will hear him by and by bursting out into vehement complaints on account of the grievousness of his calamities; but he seasonably fortifies himself by this brief exordium, lest, carried away with the heat of his feelings, he might become chargeable with complaining and murmuring against God, instead of humbly supplicating Him for pardon. By applying to Him the appellation of the God of his salvation, casting, as it were, a bridle upon himself, he restrains the excess of his sorrow, shuts the door against despair, and strengthens and prepares himself for the endurance of the cross.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-calvin.html">John Calvin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Commentary on Psalms</cite>, 88, trans. James Anderson.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

</figure><figure class="quote" id="q-be86fa89a6" data-kw="">
<blockquote><p>And first, learn, concerning prayer: All prayer for things heavenly and spiritual concerning the life to come (I speak not of the worldly things, but things heavenly and spiritual) should arise on some certainty and assurance of the heart, that God will grant to us the things we ask.

Therefore James in his Epistle last chap. 15. verse. he calls prayer, the prayer of faith, that is, that rises of faith and assurance in the heart, that God will grant us the thing we ask. John in his first Epistle, last chap. 14. verse, he joins these two together, confidence or assurance, and prayer, and he says. This is that confidence we have in the Lord, that, if We aske any thing according to his will, he will hear us:

There is confidence in prayer, that, when we pray, we should have that assurance that God will give us these things we seek, not according to our will, but according to his own will. It is his will that we should have these heavenly things, through the blood of Christ. And therefore our prayer for them should rise on confidence, that God will grant them for Christ’s sake.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/robert-rollock.html">Robert Rollock</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lectures upon the first and second Epistles of Paul to the Thessalonians</cite>, (Edinburgh: Robert Charteris, 1606), p. 335.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/prayer.html">Prayer</a></span></div>

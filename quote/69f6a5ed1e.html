<main class="wrap"><figure class="quote" id="q-69f6a5ed1e" data-kw="">
<blockquote><p>But people evaluate things also according to the standard of beauty and ugliness… But the beautiful is nevertheless essentially distinct from the pleasant. People do not argue about what is pleasant. One person finds this food and that drink enjoyable, but another does not. People are comfortable with this and do not argue about these differences. However, in connection with what is beautiful, people tend not to be satisfied with the notion that something attracts one person but not another; people attempt to account for beauty to themselves and others and attempt, as it were, to demonstrate why something is attractive. People proceed from the notion that what is genuinely beautiful should be attractive to everyone, given sufficient enlightenment and education.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921)</cite>, p. 163</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-fbaca9017f" data-kw="">
<blockquote><p>But I answer, the place 2 Cor. 2:10 is controverted, and we doubt not, but [that it is] of that same nature with the power of excommunicating, 1 Cor. 5:4. But for private forgiving, it is not the Church-forgiving here meant, because: 1. The private forgiving is a duty of charity commanded in the Law of Nature to all, even out[side] of [a] Church-state, and obliges the excommunicate[d], who, though they be cast out of the Church, are not exempted from the Law that binds all, Mt. 6:12,14-15; Mt. 5:44-45, but the Church-forgiving is an act of obedience to a positive Church-Law of Christ. 2. Private Christians are to forgive their enemies whether they repent or not, even as Christ forgave those who crucified Him, Col. 3:13; Lk. 23:34; and when the party repents not, this forgiveness is not ratified in Heaven, yet are we obliged to forgive and to commit vengeance to God; But the authoritative forgiving is a thing that the Church is not obliged unto, absolutely; nor may they, or can they forgive, except the offender repent: and if they see that he repents not, they cannot lawfully forgive; but, being in God’s room, must take vengeance on all disobedience, and their retaining of sin and forgiving is valid in Heaven, because they are in God’s place. Now any forgiving or retaining of sin but these two, together with God’s forgiving and retaining, we know not. But Peter’s forgiving his offending brother seventy times seven times, is common to all private Christians, even out[side] of [a] Church-state…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Due Right of Presbyteries… (1642), pt. 1, ch. 1, section 1</cite>, p. 16</span></figcaption>

</figure><figure class="quote" id="q-7520e35a4a" data-kw="">
<blockquote><p>What is desired ceases to be beautiful to the extent that it is desired. The starry heaven is unspeakably beautiful, said Schopenhauer, because it is desired by no one. Beauty delights us not because it is profitable to us. Our delight in beauty is entirely disinterested. Beauty awakens the kind of movement within our faculty of desiring that creates enjoyment in pure, disinterested, beholding, whether such beholding is physical or spiritual. Truth satisfies our understanding. The good fulfills our desires and awakens our love. Beauty provides rest and delight. Materially and objectively they are one. The true, the good, and the beautiful form one unbreakable triad. All that is, in the same measure that it is, is also true, good and beautiful. This unity can disintegrate only temporarily, in this world of disharmonies… Nonetheless, these three are materially one… The true, the good, and the beautiful differ only formally, insofar as the same thing exists in a varied relationship to the rich organization of our spirit. After all, God Himself is also the truth, the holy [good], and the glory [beautiful].</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/herman-bavinck.html">Herman Bavinck</a></span><span class="wk"><span class="lbl">Work:</span> <cite>pp. 157-66 of ch. 7, H. ‘Conscience &amp; the Idea of Beauty’ in Foundations of Psychology trans. Born, Kloosterman &amp; Bolt 2nd ed. (1897; 1921)</cite>, p. 165</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-christian-life/obedience-and-profession.html">Obedience and Profession</a></span></div>

<blockquote><p>1. Whether the sacred is founded in a special ordination and by divine mandate? It is affirmed. 2. Whether under the New Testament some things are relatively sacred, such as church-buildings, times (except the weekly Sabbath), utensils, tables, cups, lamps, pulpits, furnishings, cloths, garments of ministers? It is denied. 3. Whether under the New Testament, is the preaching of the Word, the water of baptism and the bread and wine in the eucharist sacred? It is affirmed. 4. Whether whatever external particular the Church has instituted is sacred? It is affirmed. See the disputation on benedictions and sacramental things.</p></blockquote>

<blockquote><p>3. When Christ commands his disciples to bless them that curse them and persecute them, He gives not therein a rule to public officers, whether in Church or commonweal, to suffer notorious sinners, either in life or doctrine, to pass away with a blessing: But to private Christians to suffer persecution patiently, yea and to pray for their persecutors. Again, it is true, Christ would have his disciples to be far from persecuting (for that is a sinful oppression of men for righteousness sake) but that hinders not but that He would have them execute upon all disobedience the judgement and vengeance required in the Word, 2 Cor. 10:6; Rom. 13:4. 4. Though it be true that wicked persons now may by the grace of God become true disciples and converts, yet we may not do evil that good may come thereof: And evil it would be to tolerate notorious evil-doers, whether seducing teachers or scandalous livers. Christ had something against the angel of the Church of Pergamus for tolerating them that held the doctrine of Balaam, and against the Church of Thiatira for tolerating Jezabel to teach and seduce, Rev. 2:14, 20.</p></blockquote>

<div class="actions"><button class="copy" data-copy="“3. When Christ commands his disciples to bless them that curse them and persecute them, He gives not therein a rule to public officers, whether in Church or commonweal, to suffer notorious sinners, either in life or doctrine, to pass away with a blessing: But to private Christians to suffer persecution patiently, yea and to pray for their persecutors. Again, it is true, Christ would have his disciples to be far from persecuting (for that is a sinful oppression of men for righteousness sake) but that hinders not but that He would have them execute upon all disobedience the judgement and vengeance required in the Word, 2 Cor. 10:6; Rom. 13:4. 4. Though it be true that wicked persons now may by the grace of God become true disciples and converts, yet we may not do evil that good may come thereof: And evil it would be to tolerate notorious evil-doers, whether seducing teachers or scandalous livers. Christ had something against the angel of the Church of Pergamus for tolerating them that held the doctrine of Balaam, and against the Church of Thiatira for tolerating Jezabel to teach and seduce, Rev. 2:14, 20.”

— John Cotton, ‘The Answer of Mr. John Cotton of Boston in New-England, to the aforesaid Arguments Against Persecution for Cause of Conscience…’ in Roger Williams, The Blovdy Tenent of Persecution for Cause of Conscience, Discussed in a Conference… (London, 1644), p. 10">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9C3.+When+Christ+commands+his+disciples+to+bless+them+that+curse+them+and+persecute+them%2C+He+gives+not+therein+a+rule+to+public+officers%2C+whether+in+Church+or+commonweal%2C+to+suffer+notorious+sinners%2C+either+in+life+or+doctrine%2C+to+pass+away+with+a+blessing%3A+But+to+private+Christians+to+suffer+persecution+patiently%2C+yea+and+to+pray+for+their+persecutors.+Again%2C+it+is+true%2C+Christ+would+have+his+disciples+to+be+far+from+persecuting+%28for+that+is+a+sinful+oppression+of+men+for+righteousness+sake%29+but+that+hinders+not+but+that+He+would+have+them+execute+upon+all+disobedience+the+judgement+and+vengeance+required+in+the+Word%2C+2+Cor.+10%3A6%3B+Rom.+13%3A4.+4.+Though+it+be+true+that+wicked+persons+now+may+by+the+grace+of+God+become+true+disciples+and+converts%2C+yet+we+may+not+do+evil+that+good+may+come+thereof%3A+And+evil+it+would+be+to+tolerate+notorious+evil-doers%2C+whether+seducing+teachers+or+scandalous+livers.+Christ+had+something+against+the+angel+of+the+Church+of+Pergamus+for+tolerating+them+that+held+the+doctrine+of+Balaam%2C+and+against+the+Church+of+Thiatira+for+tolerating+Jezabel+to+teach+and+seduce%2C+Rev.+2%3A14%2C+20.%E2%80%9D%0A%0A%E2%80%94+John+Cotton%2C+%E2%80%98The+Answer+of+Mr.+John+Cotton+of+Boston+in+New-England%2C+to+the+aforesaid+Arguments+Against+Persecution+for+Cause+of+Conscience%E2%80%A6%E2%80%99+in+Roger+Williams%2C+The+Blovdy+Tenent+of+Persecution+for+Cause+of+Conscience%2C+Discussed+in+a+Conference%E2%80%A6+%28London%2C+1644%29%2C+p.+10&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Fd8eea88569.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perm

<main class="wrap"><figure class="quote" id="q-7d230d796b" data-kw="">
<blockquote><p>In all ages there have been persons who supposed that we ought not to preach upon the subject of predestination, or of eternal election to the people, that that great and impenetrable mystery ought not to be noticed in the public discourses of ministers, but rather that it should be treated as a fathomless abyss, on the edge of which we should pause, and content ourselves with merely gazing …

And why, let me ask, conceal or suppress the doctrine of predestination, – a doctrine which so clearly and manifestly glorifies God, – which attributes to him all the honour and all the praise of our salvation, – which keeps us humble, – which fills us with gratitude, – which inflames our love towards the author of our being, – which leads us with reverential homage to cast our crowns at his feet, and excites to the performance of good works as the necessary means of reaching that end to which predestination appoints us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-bosc.html">Pierre Du Bosc</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Protestantism. Being a Series of Discourses on a Portion of the Epistle to the Ephesians</cite>, trans. J. B. Law (1699; London: A. Hall, Virtue, &amp; Co., 1853), pp 166, 170-71.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election.html">Election</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-2418cd50e4" data-kw="">
<blockquote><p>Salvation we know is to be conferred on none of ripe years but such as believe and repent; and undoubtedly if all and every one should believe and repent, all and every one should be saved by Him: on the other side, if not one should believe and repent, not one should be saved by Him.</p></blockquote>

/a></div>
</figure><figure class="quote" id="q-872ce39473" data-kw="">
<blockquote><p>There is no universal redemption, nor universal atonement. Jesus Christ died not for all and every individual person of mankind; but for the elect only. The contrary doctrine may consist with the opinion which holds the covenant of redemption, and the covenant of grace, to be two distinct covenants; the former made with Christ, and the latter with believers; the condition of the one undertaken and performed by him, the condition of the other undertaken and performed by us. Accordingly that opinion concerning the covenant, is readily embraced by Universalists of different denominations.

But that doctrine is utterly inconsistent with this account of the covenant, which doth at once overthrow universal redemption or atonement, together with the federal conditionality of our holiness and good works, in the covenant of grace. For if the covenant of grace was made with Christ as a representative, and the elect only were the party represented by him in it; then surely the conditions of the covenant, his doing and dying, were accomplished for them only; and he died for no other: as when one hath entered into a bond of suretyship, his payment of that bond can never be reckoned a payment of their debt, whose names were not in the bond, and whom he was not surety for.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/thomas-boston.html">Thomas Boston</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A View of the Covenant of Grace, from the Sacred Records</cite>, (1734) in The Works of Thomas Boston, ed. Samuel McMillan (12 vols, London, 1853), viii, 404-05.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/election.html">Election</a></span></div>

</figure><figure class="quote" id="q-280ccb1fb4" data-kw="foreknew believe election grace">
<blockquote><p>Assuredly, if this were said because God foreknew that they would believe, not because He Himself would make them believers, the Son is speaking against such a foreknowledge as that when He says, &quot;Ye have not chosen me, but I have chosen you;&quot; when God should rather have foreknown this very thing, that they themselves would have chosen Him, so that they might deserve to be chosen by Him.</p></blockquote>

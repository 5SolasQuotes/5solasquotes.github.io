<main class="wrap"><figure class="quote" id="q-df89eeafae" data-kw="">
<blockquote><p>Thus, some would have baptism to be regeneration itself, and that there is no other evangelical regeneration but that alone, with the profession which is made thereon. Every one who is baptized is thereby regenerated. The sign and figure of grace, they would have to be the grace itself. Nothing can be invented more pernicious unto the souls of men; for all sorts of persons may be brought to a ruinous security about their spiritual condition by it, and diverted from endeavours after that real internal work, in the change of their hearts and natures, without which none shall see God. This is to put that into it which God never placed there. Some suppose it to be such a distinguishing, or rather separating ordinance, that the administration of it in such a way or at such a season, is the fundamental rule of all church fellowship and communion; whereas God never designed it unto any such end.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-owen.html">John Owen</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Exposition of the Epistle to the Hebrews in the Works of John Owen (Edinburg: The Banner of Truth Trust, 1991), 22:39.</cite></span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9e6ca3df15" data-kw="">
<blockquote><p>From all this it follows clearly, that the children of Christian parents are Church-members; and, being Church-members, they have a right to Baptism, which is appointed by Christ to be the standing ordinance for solemn admission into the visible Church. So that, when they are in our Catechism said to be made members of Christ in their Baptism, the meaning only is, that now they are owned and publicly acknowledged to be such, by their solemn admission into the society of Christians. They are Christians nati; born Christians, by the covenant; Christianity is their birthright, and their native privilege.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/ezekiel-hopkins.html">Ezekiel Hopkins</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Infants are members of the Church of Christ; and, therefore, to be baptized.’, pp. 303-304 in The Doctrine of the Two Sacraments in Works, vol. 2 ed. Quick (Philadelphia, 1874)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/baptism/subjects-of-baptism.html">Subjects of Baptism</a></span></div>

</figure><figure class="quote" id="q-31b20949f7" data-kw="">
<blockquote><p>The Reformed churches observe the same order in admitting to the Lord’s table, either the children of Christians, or strangers from other parts: they admit them not but with prayers and after due examination of their knowledge, and personal profession of the known truth. The Church of Scotland at the first reformation ordained that children should be examined for the first time at the ninth year of their age; for the second, at the twelfth, for the third at the fourteenth, and since has practiced continual examination in the catechetical doctrine with prayers reiterate, for their growth in knowledge and sanctification; and without sufficient trial they were not admitted to the Lord’s Table.</p></blockquote>

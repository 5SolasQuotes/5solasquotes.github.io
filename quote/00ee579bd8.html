<blockquote><p>But he that will join in no good that is mixed by men with faultiness and evil must separate from all the world, and all from him: But how will he separate from himself?</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/richard-baxter.html">Richard Baxter</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen</cite>, (1684; RBO, 2024), p. 14</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>
<div class="actions"><button class="copy" data-copy="“But he that will join in no good that is mixed by men with faultiness and evil must separate from all the world, and all from him: But how will he separate from himself?”

— Richard Baxter, Richard Baxter on Worship &amp; Catholicity against Separatism &amp; John Owen (1684; RBO, 2024), p. 14">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+he+that+will+join+in+no+good+that+is+mixed+by+men+with+faultiness+and+evil+must+separate+from+all+the+world%2C+and+all+from+him%3A+But+how+will+he+separate+from+himself%3F%E2%80%9D%0A%0A%E2%80%94+Richard+Baxter%2C+Richard+Baxter+on+Worship+%26+Catholicity+against+Separatism+%26+John+Owen+%281684%3B+RBO%2C+2024%29%2C+p.+14&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F00ee579bd8.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/00ee579bd8.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-cooperation-with-evil/#:~:text=But%20he%20that%20will%20join%20in,how%20will%20he%20separate%20from%20himself&amp;text=But%20he%20that%20will%20join%20in%20no%20good&amp;text=him%3A%20But%20how%20will%20he%20separate%20from%20himself" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-09822e2260" data-kw="">
<blockquote><p>God gives kingdoms to whom He will. What then?… and He gives tyrannous conquests to whom He will: and it is Nebuchadnezzar to whom Daniel speaks that from the Lord [Dan. 5:21], and he had no just title to many kingdoms, especially to the kingdom of Judah, which yet God, the King of kings, gave to him because it was his good pleasure; and if God had not commanded them by the mouth of his prophet Jeremiah, might they not have risen, and, with the sword, have vindicated themselves and their own liberty, no less than they lawfully, by the sword, vindicated themselves from under Moab, (Judges 3) and from under Jabin, king of Canaan, who, twenty years, mightily oppressed the children of Israel, Judges 4. Now this Popish Prelate [John Maxwell], by all these instances, making heathen kings to be kings by as good a title as David and Hezekiah, [implicitly] condemns the people of God as rebels, if, being subdued and conquered by the Turk and Spanish king, they should, by the sword, recover their own liberty [such as happened the Reformation in the Netherlands]; and that Israel, and the saviours which God raised to them, had not warrant from the law of nature to vindicate themselves to liberty, which was taken from them violently and unjustly by the sword… for Nebuchadnezzar’s sovereignty over the people of God, and many other kingdoms also, was revenged of God as tyranny, Jer. 1:6-7; and therefore the vengeance of the Lord, and the vengeance of his temple, came upon him and his land, Jer. 1:16, etc. It is true the people of God were commanded of God to submit to the king of Babylon, to serve him, and to pray for him, and to do the contrary was rebellion; but this was not because the king of Babylon was their king, and because the king of Babylon had a command of God so to bring under his yoke the people of God. So Christ had a commandment to suffer the death of the cross (John 10:18) but had Herod and Pilate any warrant to crucify him? None at all.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, ... (1644; Edinburgh: Ogle, 1843), p. 16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/civil-government-and-society/resistance-to-tyranny-and-lawful-authority.html">Resistance to Tyranny and Lawful Authority</a></span></div>

</figure><figure class="quote" id="q-8bb454fa24" data-kw="">
<blockquote><p>Here be two questions. The first is: whether the tyrant must be removed from his room or not? The second: how, and by whom. Therefore I do not deny but that a wicked magistrate must be put down, but not the same way that thou wilt. No man ought to kill him, nor to stir up war and sedition against him, we must go to work, another manner of way, the matter must be attempted and assayed by lawful means, for God has called us in peace, 1 Corinthians the seventh chapter. The tyrant must be taken away (that do I not deny), for Samuel does depose Saul from his office, and does anoint David king over the people of Israel. Jehoiada puts forth Athalia from the ruledom and makes Joash a king. If then a king be made by the common assent of all the people, and begins to be wicked, let him agayn be put downe with common assent of the people, except they will all be punished with him. And if he be chosen by the consent and election of few princes, let the people signify and show unto them, the wicked and ungodly life of this king, and that it ought to be born or suffered no longer, let them be commanded, that have chosen him, to put him down again. … But first and foremost, the prophets, that is to say, the ministers of God’s Word, must be bold to rebuke the sins and wicked facts of princes and rulers: none other way more commodious to overcome tyrants can be, than if the preachers of the truth do once determine to die, they must put their bodies and lives to jeopardy. … Finally, and last of all, that we thirst for righteousness, that we amend our lives, and change our conditions. For if we be godly and righteous, it is impossible that a tyrant do reign long.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/heinrich-bullinger.html">Heinrich Bullinger</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Other citations (work not named)</cite>, 4th Dialogue, ‘Whether it be lawful to resist the magistrate, where we do write against them that do rebel against magistrates and rulers’ in A Most Necessary &amp; Fruitful Dialogue, between [the] seditious libertine or rebel Anabaptist, and the true obedient Christian… (1551) no page numbering</span></figcaption>

+thirst+for+righteousness%2C+that+we+amend+our+lives%2C+and+change+our+conditions.+For+if+we+be+godly+and+righteous%2C+it+is+impossible+that+a+tyrant+do+reign+long.%E2%80%9D%0A%0A%E2%80%94+Heinrich+Bullinger%2C+4th+Dialogue%2C+%E2%80%98Whether+it+be+lawful+to+resist+the+magistrate%2C+where+we+do+write+against+them+that+do+rebel+against+magistrates+and+rulers%E2%80%99+in+A+Most+Necessary+%26+Fruitful+Dialogue%2C+between+%5Bthe%5D+seditious+libertine+or+rebel+Anabaptist%2C+and+the+true+obedient+Christian%E2%80%A6+%281551%29+no+page+numbering&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F8bb454fa24.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/8bb454fa24.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/civil-government/resistance-to-tyrrany/historic-treatises-on-resistance-to-tyranny/#:~:text=Here%20be%20two%20questions.%20The%20first,that%20a%20tyrant%20do%20reign%20long&amp;text=Here%20be%20two%20questions.%20The%20first%20is%3A%20whether&amp;text=is%20impossible%20that%20a%20tyrant%20do%20reign%20long" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>

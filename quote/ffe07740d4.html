<blockquote><p>In judging of cases of scandal, we are not so much to look at the event, what that is, or may be; as at the cause, [from] whence it comes; for sometimes there is given just cause of scandal, and yet no scandal follows, because it is not taken: sometimes scandal is taken, and yet no just cause given; and sometimes there is both cause of scandal given, and scandal thereat taken; But no man is concerned in any scandal that happens to another by occasion of anything done by him, neither is [he] chargeable with it, farther than he is guilty of having given it. If then we give scandal to others, and they take it not, we are to bear a share in the blame as well as they, and that a deeper share too (‘Vae homini’, ‘Woe to the man by whom the offence cometh,’ Mt. 8:7); but if they take offence when we give none, it is a thing we cannot help; therefore the whole blame must lie upon them. …

4. The third way [in which a man may be guilty of giving scandal] is, when a man does something before another, which in itself is not evil, but indifferent, and so according to the Rule of Christian Liberty, lawful for him to do, or not to do, as he shall see cause (yea, and perhaps otherwise commodious and convenient for him to do), yet whereat he probably foresees the other will take scandal, and be occasioned thereby to do evil. In such case, if the thing to be done, be not in some degree (at least prudentially) necessary for him to do, but that he might without great inconvenience and prejudice to himself and any third person, leave it undone, he is bound in charity and compassion to his brother’s soul (for whom Christ died) and for the avoiding of scandal to abridge himself in the exercise of his Christian Liberty for that time so far, as rather to suffer some inconvenience himself by the not doing of it than by doing of it to cause his brother to offend; the very case which is so often, and so largely, and so earnestly insisted upon by St. Paul, Rom. 14:13,21 and 15:1,3; 1 Cor. 8:7,13 and 9:12,22 and 10:23,33. Here the rule is, Do nothing that may be reasonably forborne, whereat it is like[ly] scandal will be taken.

5. The last way is, when a man does something before another which is not only lawful, but (according to the exigencies of present circumstances pro hic et nunc [for here and now]) very behoveful, and in some sort (prudentially) necessary for him to do, but foresees in the beholder a propension to make an ill use of it and to take encouragement thereby to commit sin; if there be not withal a great care had to prevent, as much as is possible, the scandal that might be taken thereat: for, Qui non prohibet peccare cum potest, jubet [He who does not prohibit sinning when able, enjoins it]. In such case the bare neglect of his brother, and not using his utmost endeavor to prevent the evil that might ensue, making him guilty, upon which consideration stands the equity of the [particular] judicial law given to the Jews, Ex. 21:33,34, which orders that in [the] case a man dig a pit or well for the use of his family, and (looking no farther than his own conveniency) put no cover on it, but leave it open, whereby it happens [that] his neighbor’s beast do fall therein and perish, the owner of the pit is to make it good, inasmuch as he was the occasioner of that loss unto his neighbor, which he might and ought to have prevented: In this last case the thing is not (for the danger of the scandal) to be left undone, supposing it (as we now do) otherwise behoveful to be done; but the action is to be ordered and carried on by us, for the manner of doing, and in all respects and circumstances thereunto belonging, with so much clearness, tenderness, and moderation and wisdom, that so many as are willing to take notice of it may be satisfied that there was on our part a reason of just necessity that the thing should be done;</p></blockquote>

<blockquote><p>4. I perceive he [Gillespie’s opponent] would say that the scandal of non-conformity is a greater scandal than the scandal of conformity; He is bold to object [that] where one is offended with our practise of kneeling, twenty, I may say ten thousand, are offended with your refusal. O adventurous arithmetique! O huge hyperbole! O desultorious declamation! O roving rhetoric! O prodigal paradox! Yet I reply: 1. Though sundry (yet not ten thousand for one) are displeased by our refusal, who can show us that any are thereby scandalized, that is, made worse and induced to ruin? …

5. We know many are grieved and displeased with our non-conformity, yet that every one who is grieved is not by and by scandalized, the Bishop of Winchester [an opponent] teaches as well as we. ‘Many times’ says he, ‘men are grieved with that which is for their good, and earnestly set on that which is not expedient for them.’ But in good earnest, what do they mean who say they are scandalized or made worse by our non-conformity? For neither do we make them condemn our lawful deed as unlawful, nor yet do we animate them by our example to do that which in their consciences they judge unlawful.</p></blockquote>

<blockquote><p>That to scandalize, is not merely to displease or grieve another: For many a man is displeased through his folly and vice, by that which tends to his good: and many a man is tempted (that is, scandalized) by that which pleases him… The most censorious and humorous sort of men have got a notion, that what ever offends or displeases them is scandalous! And they think that no man must do any thing which grieves or displeases them, lest he be guilty of scandal: And by this trick who ever can purchase impatiency and peevishness enough to be always displeased with the actions of others, shall rule the world. But the truth is, the ordinary way of scandalizing these men is by pleasing them. §. 4. I will give you one instance of scandal in Scripture, which may help this sort of people better to understand it. Gal. 2:10-16, Peter there gives true scandal to the Jews and Gentiles: He walked not uprightly according to the truth of the Gospel, but laid a stumbling block before the Jews and Gentiles: And this was not by displeasing the Jews, but by pleasing them… Peter knew the contrary, but for fear of them of the circumcision, lest they should be offended at him as a sinner, he withdrew and separated himself. This scandal tended to harden the Jews… and to seduce the Gentiles into a conceit… and Barnabas was carried away with the dissimulation… We scandalize them [Baxter’s opponents] and others even by pleasing them, and by avoiding that which they falsely called scandalous. And if we would not scandalize them, we must do that which is just, and not by our practice hide the sound doctrine which is contrary to their separating error. … And this [scandalizing] is done more seldom by committing open disgraceful sins and doing that which will make the doer evil spoken of: For by that means others are the more assisted against the temptation of imitating him: But scandal is most commonly found in those actions, which are under least reproach among men, or which have the most plausible appearance of good in them, when they are evil! For these are apter to deceive and overthrow another. §6. 3. And it is also apparent, that it is no sinful scandalizing to do a duty or necessary action which I have not power to forbear, though I know that another will be offended, or fall by it into sin. If God have made it my duty, even at this time, I must not disobey Him and omit my duty because another will make it an occasion of his sin. It must be either a sinful or an indifferent action that is scandal, or something that is in my own power to do or to forbear… § 7. III. …Those that are careless of the consequent of their actions, and contemn the souls of other men, and will go their own way, come of it what will, and say ‘Let other men look to themselves,’ are the commonest sort of scandalizers; and are as culpable as a servant that would leave hot water or fire when the children are like[ly] to fall into it; or that would leave straw or gunpowder near the fire, or would leave open the doors, though not of purpose to let in the thieves. §8.

2. Scandal is that which tends to another’s fall, either directly or indirectly, immediately or remotely! The former may easily be foreseen; but the latter requires a large foreseeing comparing understanding: Yet this kind of scandal also must be avoided; and wise-men that would not undo men’s souls while they think no harm, must look far before them and foresee what is like[ly] to be the consequent of their actions at the greatest distance and at many removes.

3. Scandals also are Aptitudinal or Actual: Many things are apt to tempt and occasion the ruin of another which yet never attain so bad an end, because God disappoints them: But that is no thanks to them that give the scandal.</p></blockquote>

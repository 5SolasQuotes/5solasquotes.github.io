<main class="wrap"><figure class="quote" id="q-cd248974b1" data-kw="">
<blockquote><p>XIX. The following things must belong to fundamental articles: (1) that they be catholic, for the things necessary for the salvation of everyone are required for a universal faith (according to the Athanasian Creed “whoever wishes to be saved must above all things hold the catholic faith; for unless it is held entire and inviolate he will perish forever” [cf. Schaff, 2:66]); (2) that the belief of the catholic truths necessarily draws salvation after it; and the ignorance of them, the entire doubt of danger, the impious and heretical denial, is damnable; (3) that believers cherish a true consent to them, nor do some think differently from others because if anyone thinks or speaks otherwise he is subjected to the curse (Gal. 1:8). Hence where a difference in fundamentals exists, there cannot be union. (4) That all theological doctrines be reduced to them as to a rule which the apostle calls the analogy of faith (analogian pisteōs); (5) that they be primary and principal truths upon which all others are built as upon a foundation—and being removed, faith itself is overthrown; not secondary and less principal, by the removal of which faith is only shaken.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, ed. James T. Dennison Jr., trans. George Musgrave Giger, vol. 1 (Phillipsburg, NJ: P&amp;R Publishing, 1992–97), 1.14.19.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-church/church-unity-and-fundamentals.html">Church Unity and Fundamentals</a></span></div>

<blockquote><p>Matters of faith I reduce to three:

3. Circa-fundamentalia, things about matters of faith. For præter fundamentalia, things indifferent and beside the foundation in matters of religion, and moral carriage, I acknowledge none. Fundamentals are the vital and noble parts or the soul of divinity.</p></blockquote>

<blockquote><p>Those articles of religion wherein the divines of both sides [of the reformed and Lutherans] do fully agree are abundantly sufficient, both for a Christian man’s salvation and likewise for the establishing of a firm and lasting peace in the Churches of God. As for the rest… they are such as may perhaps not unfitly be sent to the divinity-schools, there to be thoroughly discussed: but by no means ought they to disquiet the peace either of any Christian soul or of God’s holy Church… our good and gracious Savior passed over with silence and toleration great and grievous errors in comparison of these… and that too even in such as were of his own household and retinue.</p></blockquote>

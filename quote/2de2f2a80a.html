<main class="wrap"><figure class="quote" id="q-2de2f2a80a" data-kw="">
<blockquote><p>I presuppose that the division of goods does not necessarily flow from the law of nature, for God made man, before the Fall, lord of the creatures indefinitely [Gen. 1:26-30]; but what goods be Peter’s, and not Paul’s, we know not [from nature’s law]… If I have leave to permit that, in time of necessity, all things are common by God’s law, [then] a man travelling might eat grapes in his neighbor’s vineyard, though he was not licensed to carry any [a]way. I doubt if David, wanting [lacking] money, was necessitated to pay money for the showbread, or for Goliath’s sword, supposing these to be the very goods of private men and ordinarily to be bought and sold. Nature’s law in extremity, for self-preservation, has rather a prerogative royal above all laws of nations and all civil laws than any moral king. In this meaning:

1. Any one man is obliged to give all he has for the good of the commonwealth, and so far the good of the king, inasfar as he is head and father of the commonwealth.

2. All things are the king’s, in regard of his public power to defend all men and their goods from unjust violence.

3. All are the king’s, in regard of his act of conservation of goods, for the use of the just owner.

4. All are the king’s in regard of a legal limitation, in case of a damage offered to the commonwealth. Justice requires confiscation of goods for a fault; but confiscated goods are to help the interested commonwealth, and the king, not as a man (to bestow them on his children) but as a king. To this we may refer these called bona caduca et inventa [goods fallen and found], things lost by shipwreck or any other providences…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Lex Rex</cite>, (1644; Edinburgh: Ogle, 1843) | question 16, p. 67</span></figcaption>

</figure><figure class="quote" id="q-40a4d88737" data-kw="">
<blockquote><p>I conclude the proof of this point with the saying of our Savior Christ, Matt 5:18, “Heaven and earth shall pass away, but not one jot or title of the Law shall pass away:” Mark, our Savior says there, that there shall not one jot or title of the Decalogue pass away. As for the Ceremonial, and Judicial Law, they stand not still, but the whole compass of them is removed, the Ceremonial Law is quite and clean abolished; and the Judicial Law, in many particulars; therefore our Savior meant it not of those two Laws, but he speaks of the Decalogue, and He says, Heaven and earth shall passe away, before one jot of it shall pass away, much less an whole branch be rooted out.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-fenner.html">William Fenner</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Four Profitable Treatises; of the Sabbath</cite>, (d. 1640; 1657), p. 184</span></figcaption>

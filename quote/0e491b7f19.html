<main class="wrap"><figure class="quote" id="q-0e491b7f19" data-kw="">
<blockquote><p>This passage [Galatians 2:6] reminds us that we should not condemn or reject people on the basis of their former life. Just as the apostles were no better than Paul merely because they had known Christ personally during his earthly life, so he was no worse or inferior to them merely because he had lived his life from childhood according to the whims of the Pharisees and had been a persecutor of the church.

The radiance of God’s grace could not have shone more brightly in him and (as he writes about himself) his only boast was Jesus Christ. He wanted to show that all mercy was found in him and be an example to those who would in the future believe in eternal life. God does not look on people as they once were but only as they now are.…

Again, and on the other end of the spectrum, God does not spare anyone merely because of his former virtues and achievements if they take a turn for the worse, abandon the station in which God has placed them and move over to the devil’s camp. Their condition is worse and their ingratitude detestable, because they have ignominiously trampled on the free gifts of God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/rudolf-gwalther.html">Rudolf Gwalther</a></span><span class="wk"><span class="lbl">Work:</span> <cite>In Divi Pauli Apostoli Epistolam ad Galatas Homiliae LXI</cite>, (Zurich, 1576). Quoted in Gerald L. Bray, Timothy F. George, Scott M. Manetsch (eds), Reformation Commentary on Scripture X: Galatians, Ephesians (Downers Grove IL: IVP Academic, 2011), p. 59.</span></figcaption>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-9f4eeb7fe6" data-kw="noah">
<blockquote><p>The Remonstrants in the declaration of their opinion about this set forth their opinion thus: “Christ by the merit of his death thus far reconciled God, the Father, to the whole human race, that the Father on account of that merit, without injury to his own justice and truth, could and willed to enter into and sanction a new covenant of grace with sinners and men exposed to damnation” (cf. Acta Synodi Nationalis … Dordrechti (1620), Pt. I, pp. 115–16, on Article 2, “Concerning the Death of Christ”). Now this new covenant, they maintain, was so made with the whole human race that no nation and no individual ought to be said to be excluded from it. “The nations living under the Old Testament, although the covenant was not revealed to them in the same manner as to the Jews, ought not forthwith to be considered as having been absolutely excluded from the covenant, who in some way at least are called that they may seek God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/francis-turretin.html">Francis Turretin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Institutes of Elenctic Theology</cite>, 12</span></figcaption>

</figure><figure class="quote" id="q-98ca1df46e" data-kw="">
<blockquote><p>We are astonished at the man who is wholly intent on the pursuit of gain, while he neglects the salvation of his soul, “a good all price beyond.” But are none of us treading in his steps? The heart is deceitful above all things, and a covetous heart, perhaps, the most deceitful of all. On no subject do men more frequently mistake their own character.

We often see those over whom this vice reigns with the most unlimited sway, apparently as unconscious of the fact, as if their souls were baptised with the purest charity. They may even become a proverb for their covetousness without suspecting that this disposition has ever found its way into their hearts. But how is it with us? Are we so far absorbed in the world as to have neither time nor inclination to attend to the great duties of religion? Do we plead the multiplicity of our worldly cares as an excuse for neglecting the great and solemn concerns of our souls?

Then are we covetous. We indulge an inordinate desire for the good things of this world, and we are not willing to cast our care on divine providence in the humble discharge of our duty. We are not willing to seek the kingdom of God and his righteousness first of all, leaving it to the Lord to supply us with whatever is needful, according to his good promise. We tread in the steps of the rich worldling, whose heart was supremely set upon the acquisition and enjoyment of the present life.

But suppose we do not neglect the duties of religion altogether — yet if we attend to them only as our worldly interest and convenience will admit — if we subordinate them to the pursuits and acquisitions of the world, we are among the covetous, whom the Lord abhorreth. I will go farther. Suppose we are scrupulously attentive to all the external duties of religion, yet if our souls are not in them, what will it avail? If our hearts are not in heaven but on earth, are we not earthly?

The Pharisees abounded in the rites and forms of religion, while they devoured widows’ houses and gave other signs of the most deep rooted covetousness. Whoever toils chiefly for the body, not for the soul, is like the man in the parable, who hid up treasure for himself, but was not rich towards God.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-richards.html">James Richards</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Danger and Folly of Indulging a Covetous Temper in The New-Jersey Preacher: or, Sermons on Plain &amp; Practical Subjects. By some of the Ministers of the Gospel, Residing in the State of New-Jersey. Vol. I.</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/the-covenant-of-grace.html">The Covenant of Grace</a></span></div>

<blockquote><p>Come we to your [John Cotton‘s] proper opinion: You ‘do not acknowledge any unwillingness in God to reward the men of this world with life, upon any condition whatsoever.‘ I know no reason why you should conceive any of our divines to differ from you in this, although you had spoken out your meaning never so plainly and fully: not only denying unwillingness, but acknowledging a willingness, as afterwards you do; not a willingness only, which may have place though joined with a will to the contrary, as in all mixed actions, which yet are not incident to God, though they are to a creature, as who sometimes does some thing volens nolens [willingly not willingly]: for certainly God will save any man upon condition he believes and repents: and on the other side, neither is there any unwillingness in God, but a willingness rather, yea and that a resolute will to damn any man in case he dies in infidelity and impenitency. For we have the clear word of God to justify us herein, professing most evidently that ‘Whosoever believeth shall be saved; whosoever believeth not shall be damned.’ So that I wonder not a little whereto these expressions [of Cotton’s] tend, save that commonly such is the issue of imperfect conceptions, all preparations to the justifying of them fall miserably short of that whereunto they aim.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-twisse.html">William Twisse</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Mr. Cotton’s clearing certain doubts concerning Predestination together with an Examination thereof</cite>, [John] Cotton’s clearing certain doubts concerning Predestination, together with an Examination Thereof (London: J.D., 1646), Question 2, pp. 54-55</span></figcaption>

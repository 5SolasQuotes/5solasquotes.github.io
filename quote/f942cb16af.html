<main class="wrap"><figure class="quote" id="q-f942cb16af" data-kw="">
<blockquote><p>VI… And certainly, everything begotten is similar to the one begetting, not only according to essence, but also according to the accidents proper to the species, whether innate or adventitious. But we are all born of corrupt parents; whence Adam is said to have begotten a son in his own likeness (Gen. 5:3). Finally, the actual sins which flourish in all necessarily require some cause: where there are bad fruits, there is a rotten tree (Mt. 7:17). … VIII. Whence it follows that it [original sin] is… an accidental or adventitious contagion adhering in human nature, rendering it both evil and guilty. … XXIII. As to the mode by which this sin is derived into posterity, we confess that this cannot be explained with sufficient precision. Augustine advises that nothing should be rashly asserted in such a question; and certainly, one should rather ask by what way we can escape from that evil, than how it has come down to us.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodore-tronchin.html">Theodore Tronchin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theological Theses on Original Sin</cite>, trans. AI (Geneva: de la Planche, 1625), pp. 4, 7 Tronchin (1582-1657) was a professor of Hebrew and theology at Geneva.</span></figcaption>

>Read it online · Reformed Books Online</a></div>
</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-464b7d353a" data-kw="">
<blockquote><p>Nor indeed would God impute the sin of Adam to his posterity, unless they had in themselves something that was truly sin, and unless they were by nature evil; for he who was entirely free from sin would be unjustly punished with death. Only then can the sin of another be justly imputed to an innocent person, when he stands as a surety for the sinner.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/pierre-du-moulin.html">Pierre Du Moulin</a></span><span class="wk"><span class="lbl">Work:</span> <cite>An Untying of Grave Questions</cite>, (Leiden: Elzevirana, 1632), Treatise 5, on Original Sin, ch. 1, p. 13 trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><figure class="quote" id="q-3d9cea5587" data-kw="">
<blockquote><p>La Place’s innovation was as a matter of course condemned by the Reformed world, formally at the Synod of Charenton (1644-1645) and in the Helvetic Consensus (1675) and by argument at the hands of the leading theologians — Rivetus, Turretin, Maresius, Driessen, Leydecker, and Marck. But the tendencies of the time were in its favor and it made its way. It was adopted by theologians like Wyttenbach, Endemann, Stapfer, Roell, Vitringa, Venema; and after a while it found its way through Britain to America, where it has had an interesting history — forming one of the stages through which the New England Theology (q.v.) passed on its way to its ultimate denial of the quality of sin involving guilt to anything but the voluntary acts of a free agent; and finally becoming one of the characteristic tenets of the so-called “New School Theology” of the Presbyterian Churches. Thus it has come about that there has been much debate in America upon “imputation,” in the sense of the imputation of Adam’s sin, and diverse types of theology have been framed, especially among the Congregationalists and Presbyterians, centering in differences of conception of this doctrine. Among the Presbyterians, for example, four such types are well marked, each of which has been taught by theologians of distinction. These are (1) the ‘Federalistic,’ characterized by its adherence to the doctrine of ‘immediate imputation,’ represented, for example, by Dr. Charles Hodge; (2) the ‘New School,’ characterized by its adherence to the doctrine of ‘mediate imputation,’ represented, for example, by Dr. Henry B. Smith; (3) the ‘Realistic,’ which teaches that all mankind were present in Adam as generic humanity, and sinned in him, and are therefore guilty of his and their common sin, represented, for example, by Dr. W. G. T. Shedd; and (4) one which may be called the ‘Agnostic,’ characterized by an attempt to accept the fact of the transmission of both guilt and depravity from Adam without framing a theory of the mode of their transmission or of their relations one to the other, represented, for example, by Dr. R. W. Landis.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/benjamin-b-warfield.html">Benjamin B. Warfield</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Imputation’, ‘6. La Place &amp; Later Theologians &amp; Schools’</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><figure class="quote" id="q-ab3fa7fc2b" data-kw="">
<blockquote><p>That original sin is derived to us, and inheres deeply fixed within us, is more than clear enough; but how it was propagated from Adam to his posterity ought to be believed rather than investigated, and can be investigated more easily than it can be understood, and is better understood than it is explained. It is not so much our concern now to care how we fell into this evil, as to be freed from it; just as Augustine relates of the one who had fallen into a well: to someone admiring how he could have fallen into the well, he said, “You think about how to free me from here, not ask how I fell in here.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/william-whitaker.html">William Whitaker</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise on Original Sin</cite>, … against the three first books of Thomas Stapleton on the Whole Doctrine of Justification presently controverted (d. 1595; Legat, 1600), bk. 1, ch. 8, ‘How original sin is derived to us and contracted by us’, p. 31 trans. AI Latin</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/sin/original-sin.html">Original Sin</a></span></div>

</figure><figure class="quote" id="q-7c2b4a999d" data-kw="Original Sin Depravity Author of sin">
<blockquote><p>In order to account for a sinful corruption of nature, yea, a total native depravity of the heart of man, there is not the least need of supposing any evil quality, infused, implanted, or wrought into the nature of man, by any positive cause, or influence whatsoever, either from God, or the creature; or of supposing, that man is conceived and born with a fountain of evil in his heart, such as is any thing properly positive.</p></blockquote>

<blockquote><p>Titus 3:. Therefore to the obtaining of eternal life two things are necessary. the first is to believe well; the second is, to live well. By the first we are justified in the sight of God, for he respects our faith; by the second we are justified in the sight of men, for they regard our works. And thus are the apostles Paul and James reconciled.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/henry-smith.html">Henry Smith</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Good Works are the Way to Heaven’ in The Lawyer’s Question: In Three Sermons (1595) in The Works of Henry Smith; Including Sermons, Treatises, Prayers, and Poems, ed. Thomas Fuller (2 vols, Edinburgh: James Nichol, 1866), 2: 107-09</cite>, pp. 110-11</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>
<div class="actions"><button class="copy" data-copy="“Titus 3:. Therefore to the obtaining of eternal life two things are necessary. the first is to believe well; the second is, to live well. By the first we are justified in the sight of God, for he respects our faith; by the second we are justified in the sight of men, for they regard our works. And thus are the apostles Paul and James reconciled.”

</figure><figure class="quote" id="q-67b406b6a2" data-kw="">
<blockquote><p>But the consequent conditions are added to the antecedent, as following from them: which indeed are mutual between the parties, but oblige the one only so that the other is bound to do no more on their account: As if one having given or sold a plot of ground, should assign an annuity to be laid out upon the poor. Now conditions of that kind, when not performed, usually disannul the contract: and yet they do not constitute it. Nay, there would be no annuity, except the sale were already full and complete.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/daniel-chamier.html">Daniel Chamier</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Book 15, ‘Of the Necessity of Works’, 5 chapters in Panstratiae Catholicae (Geneva, 1626), vol. 3, place 3, question 3, pp. 509-22 as tr. Herman Witsius, Animadversions</cite>, p. 150</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/good-works/necessity-of-good-works.html">Necessity of Good Works</a></span></div>

— Daniel Chamier, Book 15, ‘Of the Necessity of Works’, 5 chapters in Panstratiae Catholicae (Geneva, 1626), vol. 3, place 3, question 3, pp. 509-22 as tr. Herman Witsius, Animadversions, p. 150">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBut+the+consequent+conditions+are+added+to+the+antecedent%2C+as+following+from+them%3A+which+indeed+are+mutual+between+the+parties%2C+but+oblige+the+one+only+so+that+the+other+is+bound+to+do+no+more+on+their+account%3A+As+if+one+having+given+or+sold+a+plot+of+ground%2C+should+assign+an+annuity+to+be+laid+out+upon+the+poor.+Now+conditions+of+that+kind%2C+when+not+performed%2C+usually+disannul+the+contract%3A+and+yet+they+do+not+constitute+it.+Nay%2C+there+would+be+no+annuity%2C+except+the+sale+were+already+full+and+complete.%E2%80%9D%0A%0A%E2%80%94+Daniel+Chamier%2C+Book+15%2C+%E2%80%98Of+the+Necessity+of+Works%E2%80%99%2C+5+chapters+in+Panstratiae+Catholicae+%28Geneva%2C+1626%29%2C+vol.+3%2C+place+3%2C+question+3%2C+pp.+509-22+as+tr.+Herman+Witsius%2C+Animadversions%2C+p.+150&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F67b406b6a2.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/67b406b6a2.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/good-works/#:~:text=But%20the%20consequent%20conditions%20are%20added,sale%20were%20already%20full%20and%20complete." rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2d653748b1" data-kw="">
<blockquote><p>Answer 2. Necessary, though not necessitate efficientiae as causes; yet necessitate presentiae, as necessary consequents of justification, and as necessary antecedents of glorification. They are necessary, I say, by a necessity not only privative (if I may so speak) but also positive… Answer 3. They are necessary also by a positive necessity, and that manifold. As first by the necessity of infallibility, in respect of God’s decree, Word, oath. … Answer 6. Secondly, they are necessary necessitate pracepti, imposing a necessity of duty, towards God, our neighbor, ourselves. … Argument 8. Thirdly, they are necessary, necessitate signi, as necessary signs and evidences, whereby we are to gather assurance to ourselves of our justification, whereby our faith is to be demonstrated, whereby we are to make our calling, and our election sure. … Argument 9. Lastly, they are necessary necessitate medii, and as that, which, though it be no cause, is called causa sine qua non. And thus they are necessary: First, as the way, which leadeth to life eternal, via qua nos perducturus est ad finem itsum quem promisit (Aug. in Ps. 109), the way by which He will bring us unto that end which He hath promised, saith Augustine. For those that are justified, and by justification entitled to the Kingdom of Heaven, they are to go in the way of sanctification towards their glorification, Eph. 2:10; good works therefore, though they be not the cause of reigning yet they are the way to the Kingdom. Secondly, as necessary fruits of our election, for we are elected to that end that we should be holy, Eph. 1:4, as necessary fruits of faith, without which it is judged to be dead, James 2:26, as unseparable consequents of our redemption and justification, Luk. 1:74. And as they are necessary consequents of our justification, so they are necessary forerunners of salvation, by which we are fitted for God’s Kingdom, because no unclean thing can enter into the Kingdom of heaven, Apoc. 21:27, and finally so necessary is a godly life that without it no man shall see God, Heb. 12:14. I conclude with Bernard (De Gratia et Libero Arbitrio) that good works are… of our secret predestination, presages of our future happiness, the way to the Kingdom, but not the cause of our obtaining that Kingdom. For howsoever good works are necessary in many respects, as I have showed, necessitate presentiae; yet they are not necessary necessitate efficientiae, as causes of our justification.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/george-downame.html">George Downame</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Treatise of Justification (London, 1633) Book 7, ‘Concerning Good Works’ | Ch. 1 – To avoid Popish calumniations, it is shewed, that we doe hold the necessity of good works, and do urge the same by better arguments than the Popish religion doth afford.</cite></span></figcaption>

</figure><figure class="quote" id="q-62db74b4f4" data-kw="">
<blockquote><p>We are created unto good works which God hath ordained, that we should walk in them as the elect vessels of God, not thereby to merit salvation, but to signify unto the world that we be the elect of God, who being possessed with faith, show forth the fruits of faith, which are our good works, to the example of others, that they may follow in well-doing.</p></blockquote>

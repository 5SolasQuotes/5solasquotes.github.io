<blockquote><p>8. In the last rubric after Communion of the Sick, it is said: ‘In the time of the plague, sweat, or such other like contagious times of sicknesses or diseases, when none of the parish, or neighbors, can be gotten to communicate with the sick in their houses, for fear of the infection, upon special request of the diseased, the minister may only communicate with him.’ By this, the minister is bound not only to visit every person sick of the plague, etc. (standing at some distance) but, to administer the Lord’s Supper also to him, if he desire it; and that alone, if none else will join, as it is not to be expected they should. This is no way agreeable to Christianity, or common humanity. Not to Christianity: for, first, the very nature of the sacrament requires a public administration, because there must be a Communion of more than two persons in the receiving of it. This appears plainly by several other rubrics of the same book. For: 1. in the first rubric after the public Communion, it is ordered, that, ‘if there be not above twenty persons in the parish, of discretion to receive the Communion, yet there shall be no Communion, except four, or three at the least communicate with the priest.’ If it be said, this is the order for public Communions; but, it concerns not private Communions of the sick: it is answered, 1. that it appears not by the Word, that there is any warrant, much less necessity for such private Communions: for, the first rubric after Communion of the sick, directs the minister thus: ‘If a man, either by extremity of sickness, or for want of warning in due time to the curate, or for lack of company to receive with him, or by any other just impediment, do not receive the sacrament of Christ’s Body and Blood; then the curate shall instruct him, that if he do truly repent of his sins, and steadfastly believe that Jesus Christ hath suffered death upon the cross for him, and shed his Blood for his Redemption, earnestly remembering the benefits he has thereby, and giving him hearty thanks therefore’ (without all which, what good will be get by receiving the sacrament?) ‘he does eat and drink the body and blood of our Savior Christ profitably to his soul’s health, although he do not receive the sacrament with his mouth.’ 2. In the rubric before the Communion of the sick, this order is given, that the curate having ‘knowledge overnight, or early in the morning,’ of the desire of the sick person to receive the Communion, and being signified ‘also how many be appointed to communicate with him, and having a convenient place in the sick man’s house, where the curate may reverently minister, and a good number to receive the Communion with the sick person, with all things necessary for the same, he shall there minister the holy Communion.’ Therefore by these rubrics, no Communion is to be ministered to the sick, where there be but two to receive it. Secondly, this is also no way agreeable to humanity. Must a minister, who has the charge of many souls, adventure his health, and life, to gratify an infectious person in that which (as by what has been before alleged) is no way of necessity to the sick man’s salvation? Must the minister do this, or be punished with deprivation, or otherwise? What cruelty is this? Nay, the very Canons of 1603, Canon 67, provided more mercifully than so; which runs thus: ‘When any person is dangerously sick in any parish, the minister or curate (having knowledge thereof) shall resort to him or her, (if the disease be not known, or probably suspected to be infectious) to instruct and comfort them,’ etc. Here is a dispensation in case of the plague, or other infectious disease, for so much as visiting the sick: and no word at all of giving the Holy Communion. So much shall at present suffice to be spoken of the rubrics.</p></blockquote>

<blockquote><p>VI. The agents by whom sacraments are administered, are ministers who have been legitimately called.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/johannes-wolleb.html">Johannes Wollebius</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Abridgment of Christian Divinity</cite>, (London, 1626) in ed. John Beardslee, Reformed Dogmatics: J. Wollebius, G. Voetius &amp; F. Turretin (Oxford Univ. Press, 1965), ch. 22, ‘The Seals or Sacraments…’, p. 121; ch. 23, p. 129.</span></figcaption>

</figure><figure class="quote" id="q-27784aaa36" data-kw="">
<blockquote><p>When you [congregationalists] say that ‘a seal does not make a thing that was not, but confirm a thing that was,’ while you would seem to refute Papists, who vainly teach that sacraments do confer grace ex opere operato, by the deed done, yet do you make the sacrament but a naked sign and take part with Arminians and Socinians, whose very arguments in express words you use, for Socinius goes before you in this argument, and so does Smalcius follow him: ‘To obsignation and sealing there is required the trying of the thing, and some teaching or document; but that ceremony (a baptism) and that rite, though it be holy, does nothing to the remission of sins, but it does only shadow out, and as it were delineate and point forth remission of sins by the washing of water exponed in the Word of God.’ You say, ‘Sacraments do not make a thing that was not, but confirm a thing that was before;’ you can have no other meaning than to deny all causality and all real exhibition of grace in the sacraments: for if a sacrament make not a thing that was not before, or if God give not, and really produce, confer and exhibit grace, and a stronger measure of faith, and assurance of remission of sins, at the due and right use of the sacrament [that is with faith], the Sacrament is a naked sign, and not an exhibitive seal. But if† Christ give and in the present exhibit as surely remission of sins, as the infant is washen with water, as our divines and the Palatinate [Heidelberg] Catechism teaches, yea and the [Belgic] confession thereof, and the Synod of Dort teaches, then by the sacrament of baptism, a thing is made that which it was not. † [That is, this does not necessarily always occur, but if it does, then etc.] It is true a civil seal, as I said before, adds no new lands to the owner of the charter, but if Christ by his seals rightly and in faith used, do not only confirm grace and pardon, but also really exhibit and give grace and pardon in a further degree, and a new measure of assurance to the conscience which there was not before, you go not a streas [star’s?] breadth from Arminians and Socinians, especially seeing Episcopius, Henricus Welsingius say that remission of sins is not sealed by baptism, but signified only, and the Remonstrants in their Apology, while they expone our communion with Christ in the Lord’s Supper, and will reject a physical union of our souls with the physical substance of Christ’s body, which we also reject, they say that communion signifies, ‘only a profession of one and the same worship, whereby Christians solemnly testify that they adhere to Christ as to be partaker of the table of devils and of devils themselves, 1 Cor. 10:18,20, is a testimony of a communion with the devils’: But the Word of God says more, Gal. 3:17, ‘As many of you as are baptized have put on Christ;’ So Rom. 6:3, ‘Therefore we are buried with Him by baptism unto his death, that like as Christ was raised up from the dead, by the glory of the Father, even so we also should walk in newness of life,’ Eph. 5:26, ‘That He might sanctify and cleanse his Church with the washing of water by the Word,’ Tit. 3:5, and 1 Pet. 3:21, ‘The like figure whereunto even baptism does also now save us, etc.’ All this is more than a naked signification, otherwise manna saved Israel, and the water of the rock did wash them from their sins, and the sacrifice of bulls and goats did cleanse from sin, and open Heaven to sinners. Therefore by baptism and the Lord’s Supper something is made what it was not before, as by partaking of the table of devils, the partaker is really made a partaker with the devil, and an idolater; and his idolatry that he committed before was not only confirmed and signified to be what it was before. And in this civil seals and sacraments differ…</p></blockquote>

— Samuel Rutherford, The Due Right of Presbyteries... (London, 1644), pt. 2, ch. 4, section 5, pp. 216-18">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CWhen+you+%5Bcongregationalists%5D+say+that+%E2%80%98a+seal+does+not+make+a+thing+that+was+not%2C+but+confirm+a+thing+that+was%2C%E2%80%99+while+you+would+seem+to+refute+Papists%2C+who+vainly+teach+that+sacraments+do+confer+grace+ex+opere+operato%2C+by+the+deed+done%2C+yet+do+you+make+the+sacrament+but+a+naked+sign+and+take+part+with+Arminians+and+Socinians%2C+whose+very+arguments+in+express+words+you+use%2C+for+Socinius+goes+before+you+in+this+argument%2C+and+so+does+Smalcius+follow+him%3A+%E2%80%98To+obsignation+and+sealing+there+is+required+the+trying+of+the+thing%2C+and+some+teaching+or+document%3B+but+that+ceremony+%28a+baptism%29+and+that+rite%2C+though+it+be+holy%2C+does+nothing+to+the+remission+of+sins%2C+but+it+does+only+shadow+out%2C+and+as+it+were+delineate+and+point+forth+remission+of+sins+by+the+washing+of+water+exponed+in+the+Word+of+God.%E2%80%99+You+say%2C+%E2%80%98Sacraments+do+not+make+a+thing+that+was+not%2C+but+confirm+a+thing+that+was+before%3B%E2%80%99+you+can+have+no+other+meaning+than+to+deny+all+causality+and+all+real+exhibition+of+grace+in+the+sacraments%3A+for+if+a+sacrament+make+not+a+thing+that+was+not+before%2C+or+if+God+give+not%2C+and+really+produce%2C+confer+and+exhibit+grace%2C+and+a+stronger+measure+of+faith%2C+and+assurance+of+remission+of+sins%2C+at+the+due+and+right+use+of+the+sacrament+%5Bthat+is+with+faith%5D%2C+the+Sacrament+is+a+naked+sign%2C+and+not+an+exhibitive+seal.+But+if%E2%80%A0+Christ+give+and+in+the+present+exhibit+as+surely+remission+of+sins%2C+as+the+infant+is+washen+with+water%2C+as+our+divines+and+the+Palatinate+%5BHeidelberg%5D+Catechism+teaches%2C+yea+and+the+%5BBelgic%5D+confession+thereof%2C+and+the+Synod+of+Dort+teaches%2C+then+by+the+sacrament+of+baptism%2C+a+thing+is+made+that+which+it+was+not.+%E2%80%A0+%5BThat+is%2C+this+does+not+necessarily+always+occur%2C+but+if+it+does%2C+then+etc.%5D+It+is+true+a+civil+seal%2C+as+I+said+before%2C+adds+no+new+lands+to+the+owner+of+the+charter%2C+but+if+Christ+by+his+seals+rightly+and+in+faith+used%2C+do+not+only+confirm+grace+and+pardon%2C+but+also+really+exhibit+and+give+grace+and+pardon+in+a+further+degree%2C+and+a+new+measure+of+assurance+to+the+conscience+which+there+was+not+before%2C+you+go+not+a+streas+%5Bstar%E2%80%99s%3F%5D+breadth+from+Arminians+and+Socinians%2C+especially+seeing+Episcopius%2C+Henricus+Welsingius+say+that+remission+of+sins+is+not+sealed+by+baptism%2C+but+signified+only%2C+and+the+Remonstrants+in+their+Apology%2C+while+they+expone+our+communion+with+Christ+in+the+Lord%E2%80%99s+Supper%2C+and+will+reject+a+physical+union+of+our+souls+with+the+physical+substance+of+Christ%E2%80%99s+body%2C+which+we+also+reject%2C+they+say+that+communion+signifies%2C+%E2%80%98only+a+profession+of+one+and+the+same+worship%2C+whereby+Christians+solemnly+testify+that+they+adhere+to+Christ+as+to+be+partaker+of+the+table+of+devils+and+of+devils+themselves%2C+1+Cor.+10%3A18%2C20%2C+is+a+testimony+of+a+communion+with+the+devils%E2%80%99%3A+But+the+Word+of+God+says+more%2C+Gal.+3%3A17%2C+%E2%80%98As+many+of+you+as+are+baptized+have+put+on+Christ%3B%E2%80%99+So+Rom.+6%3A3%2C+%E2%80%98Therefore+we+are+buried+with+Him+by+baptism+unto+his+death%2C+that+like+as+Christ+was+raised+up+from+the+dead%2C+by+the+glory+of+the+Father%2C+even+so+we+also+should+walk+in+newness+of+life%2C%E2%80%99+Eph.+5%3A26%2C+%E2%80%98That+He+might+sanctify+and+cleanse+his+Church+with+the+washing+of+water+by+the+Word%2C%E2%80%99+Tit.+3%3A5%2C+and+1+Pet.+3%3A21%2C+%E2%80%98The+like+figure+whereunto+even+baptism+does+also+now+save+us%2C+etc.%E2%80%99+All+this+is+more+than+a+naked+signification%2C+otherwise+manna+saved+Israel%2C+and+the+water+of+the+rock+did+wash+them+from+their+sins%2C+and+the+sacrifice+of+bulls+and+goats+did+cleanse+from+sin%2C+and+open+Heaven+to+sinners.+Therefore+by+baptism+and+the+Lord%E2%80%99s+Supper+something+is+made+what+it+was+not+before%2C+as+by+partaking+of+the+table+of+devils%2C+the+partaker+is+really+made+a+partaker+with+the+devil%2C+and+an+idolater%3B+and+his+idolatry+that+he+committed+before+was+not+only+confirmed+and+signified+to+be+what+it+was+before.+And+in+this+civil+seals+and+sacraments+differ%E2%80%A6%E2%80%9D%0A%0A%E2%80%94+Samuel+Rutherford%2C+The+Due+Right+of+Presbyteries...+%28London%2C+1644%29%2C+pt.+2%2C+ch.+4%2C+section+5%2C+pp.+216-18&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F27784aaa36.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/27784aaa36.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/topics/topics-by-subject/worship/the-sacraments#:~:text=When%20you%20%5Bcongregationalists%5D%20say%20that%20%E2%80%98a,this%20civil%20seals%20and%20sacraments%20differ&amp;text=When%20you%20%5Bcongregationalists%5D%20say%20that%20%E2%80%98a%20seal%20does&amp;text=And%20in%20this%20civil%20seals%20and%20sacraments%20differ" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-2a2fa673ee" data-kw="">
<blockquote><p>In the time of Justin the Deacon some did carry that which was left of the Communion, at what time the Lord’s Supper was celebrated, to them which were absent by reason of their disease, from the public assembly or unto strangers, and outlandish bishops into their inn. And as Eusebius reports (Church History, Ch. 5, bk. 24), the bishop of Rome was wont to do so, but without superstition, and for no other end but for a token of concord and consent in doctrine and in the whole profession: but because we say that we must not so much enquire whether those fragments were sent, or but whether they were well sent. And that custom has degenerated into superstition, whereby at this day the host is carried to them alone which are about to die, and that for certain gain and advantage, as also in a vain persuasion of a certain necessary provision for their journey, that custom of carrying the Supper to the absent, is worthily taken away in our Churches. Cyprian in the administration of this sacrament, ‘We ought to do no other thing than that which Christ did.&#x27;</p></blockquote>

<blockquote><p>If any good Christian visited with long sickness and known to the pastor, by reason of his present infirmity [be] unable to resort to the church for receiving of the holy Communion, or being sick shall declare to the pastor upon his conscience that he thinks his sickness to be deadly, and shall earnestly desire to receive the same in his house: The minister shall not deny to him so great a comfort, lawful warning being given to him upon the night before, and that there be three or four [persons] of good religion and conversation, free of lawful impediments, present with the sick person to communicate with him, who must also provide a convenient place in his house and all things necessary for the reverend administration thereof, according to the order prescribed in the Church.</p></blockquote>

<main class="wrap"><figure class="quote" id="q-9cc09eb96d" data-kw="">
<blockquote><p>6. The psalms of David, and other scriptural songs in the Old Testament, may, and ought to be sung in this part of gospel-worship: for saith he, ‘in psalms, hymns, and spiritual songs, singing,’ etc. or rather, ‘singing in psalms, hymns,’ etc. for so the words may be rendered: now all agree that hereby are designed the psalms of David, and other scriptural songs, though there be some difference about the kind of songs which are intended to be expressed by every one of those in particular.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/james-fergusson.html">James Fergusson</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Brief Exposition of the Epistles of Paul to the Galatians, Ephesians, Philippians, Colossians, and Thessalonians</cite>, (1656-1674; London, 1841), p. 239 &amp; 365 | On Col., 3:16</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“6. The psalms of David, and other scriptural songs in the Old Testament, may, and ought to be sung in this part of gospel-worship: for saith he, ‘in psalms, hymns, and spiritual songs, singing,’ etc. or rather, ‘singing in psalms, hymns,’ etc. for so the words may be rendered: now all agree that hereby are designed the psalms of David, and other scriptural songs, though there be some difference about the kind of songs which are intended to be expressed by every one of those in particular.”

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-cf628fee0b" data-kw="">
<blockquote><p>Teaching and admonishing one another in Psalms, and Hymns, and spiritual Songs] See Eph. 5:19. In both which places, as the Apostle exhorteh us to singing, so he instructs what the matter of our song should be,† viz. Psalms, Hymns, and spiritual Songs. Those three are the titles of the songs of David, as they are delivered to us by the Holy Ghost Himself; some of them are called Mizmorim, Psalms; some Tehillim, Hymns; some Shirim, Songs, Spiritual Songs. †Mr. Cotton of singing of Psalms, ch. 4, and on 1 Cant., Psalmus est in quo concinendo adhibetia musicum aliquod instrumentum praeter linguam. Hymnus propriè est laudis canticum, sive alta voce, sive aliter canatur. Oda non laudes tantum continet, sed paraeneses &amp; alia argumenta. Calvinus.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/edward-leigh.html">Edward Leigh</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Annotations upon all the New Testament, Philological &amp; Theological</cite>, (London: 1650) | on Col. ch. 3, verse 16, p. 306</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“Teaching and admonishing one another in Psalms, and Hymns, and spiritual Songs] See Eph. 5:19. In both which places, as the Apostle exhorteh us to singing, so he instructs what the matter of our song should be,† viz. Psalms, Hymns, and spiritual Songs. Those three are the titles of the songs of David, as they are delivered to us by the Holy Ghost Himself; some of them are called Mizmorim, Psalms; some Tehillim, Hymns; some Shirim, Songs, Spiritual Songs. †Mr. Cotton of singing of Psalms, ch. 4, and on 1 Cant., Psalmus est in quo concinendo adhibetia musicum aliquod instrumentum praeter linguam. Hymnus propriè est laudis canticum, sive alta voce, sive aliter canatur. Oda non laudes tantum continet, sed paraeneses &amp; alia argumenta. Calvinus.”

</figure><figure class="quote" id="q-f31f72356f" data-kw="">
<blockquote><p>He falls next on the doxology… We [Scottish presbyterians] do not use it, but we never laid such weight on using it as to forbear all communion with a congregation where it is used; I called it a ‘human composure’… for I think neither ancient nor modern divines will call them schismatics who cordially join with the Church where they live in all of her worship, except this;</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/gilbert-rule.html">Gilbert Rule</a></span><span class="wk"><span class="lbl">Work:</span> <cite>The Good Old Way Defended</cite>, … (Edinburgh: 1697), sect. 10, p. 258</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“He falls next on the doxology… We [Scottish presbyterians] do not use it, but we never laid such weight on using it as to forbear all communion with a congregation where it is used; I called it a ‘human composure’… for I think neither ancient nor modern divines will call them schismatics who cordially join with the Church where they live in all of her worship, except this;”

— Gilbert Rule, The Good Old Way Defended… (Edinburgh: 1697), sect. 10, p. 258">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CHe+falls+next+on+the+doxology%E2%80%A6+We+%5BScottish+presbyterians%5D+do+not+use+it%2C+but+we+never+laid+such+weight+on+using+it+as+to+forbear+all+communion+with+a+congregation+where+it+is+used%3B+I+called+it+a+%E2%80%98human+composure%E2%80%99%E2%80%A6+for+I+think+neither+ancient+nor+modern+divines+will+call+them+schismatics+who+cordially+join+with+the+Church+where+they+live+in+all+of+her+worship%2C+except+this%3B%E2%80%9D%0A%0A%E2%80%94+Gilbert+Rule%2C+The+Good+Old+Way+Defended%E2%80%A6+%28Edinburgh%3A+1697%29%2C+sect.+10%2C+p.+258&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2Ff31f72356f.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/f31f72356f.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/singing-of-praise#:~:text=He%20falls%20next%20on%20the%20doxology,all%20of%20her%20worship%2C%20except%20this&amp;text=He%20falls%20next%20on%20the%20doxology&amp;text=live%20in%20all%20of%20her%20worship%2C%20except%20this" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-16fbe9387d" data-kw="">
<blockquote><p>And for singing of David’s Psalms in meter, establisheth a concord in the harmony; and the matter being the same, it is nothing to the lawfulness or unlawfulness of the thing… and for singing psalms (Mt. 26:30; Acts 16:26; Col. 3:16), we have the practice of our Savior Himself, Paul, Silas, and the recommendation of James, and of Paul also; and ’tis reported of Theodorus, that under the cruel persecution of Julius the Apostate, suffered much in martyrdom, and being on the rack, to the amazement of all the beholders, sung psalms most harmoniously; and if there can be any song spiritual, and yet unlawful, why then did Paul admonish us to exhort one another in psalms, and hymns, and spiritual songs? and there can be no song, but there must be meter, for so the word signifies, and therefore take them as songs, our practice is justified. And if you look for more, I refer you to them who have writ largely on this subject.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-deacon.html">John Deacon</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Nayler’s Blasphemies Discovered, or, Several Queries to him proposed with his own answers thereunto</cite>, (1657), ‘Answer to the 13th Query’, pp. 50-51. Deacon appears to have been a presbyterian (p. 10 &amp; 54) writing against a Quaker, who did not publicly sing praise at all.</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/psalmody.html">Psalmody</a></span></div>
<div class="actions"><button class="copy" data-copy="“And for singing of David’s Psalms in meter, establisheth a concord in the harmony; and the matter being the same, it is nothing to the lawfulness or unlawfulness of the thing… and for singing psalms (Mt. 26:30; Acts 16:26; Col. 3:16), we have the practice of our Savior Himself, Paul, Silas, and the recommendation of James, and of Paul also; and ’tis reported of Theodorus, that under the cruel persecution of Julius the Apostate, suffered much in martyrdom, and being on the rack, to the amazement of all the beholders, sung psalms most harmoniously; and if there can be any song spiritual, and yet unlawful, why then did Paul admonish us to exhort one another in psalms, and hymns, and spiritual songs? and there can be no song, but there must be meter, for so the word signifies, and therefore take them as songs, our practice is justified. And if you look for more, I refer you to them who have writ largely on this subject.”

<main class="wrap"><figure class="quote" id="q-9dc25e1453" data-kw="">
<blockquote><p>2. We then might well suffer the images of Jupiter, Dagon and Ashtarosh to stand before the people publicly, so [long as] they do no harm, and Papists and Lutherans say the images of Christ and the saints do no harm when the pastors carefully teach the people that there is no deity nor Godhead dwelling in them.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/samuel-rutherford.html">Samuel Rutherford</a></span><span class="wk"><span class="lbl">Work:</span> <cite>A Dispute Touching Scandal &amp; Christian Liberty, pp. 89-90 in The Divine Right of Church Government (1646)</cite></span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><h2 class="sect">Related quotations</h2><figure class="quote" id="q-39f76ddc6f" data-kw="">
<blockquote><p>Till divine worship be given to a creature, it is not idolatry, although in the kind or means of worship there may be will-worship; and in the opinion of those that count their act or the object to be holy, when it is not, there may be superstition of the mind; and in the use of such things, or forbearing their use, superstition in the members…</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/john-tombes.html">John Tombes</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Theodulia, or a Just Defence of Hearing the Sermons &amp; other teaching of the present Ministers of England… (London: E. Cotes, 1667), ch. 7, section 15, ‘Kneeling in receiving the sacramental elements is not idolatry’</cite>, p. 259 Tombes (c. 1603–1676)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>

</figure><figure class="quote" id="q-21f55b1030" data-kw="">
<blockquote><p>Beginning in the second half of the sixth century, a slow but steady diffusion of icons of saints, of Christ, and of the Virgin is evident in the Empire… These icons do not, however, indicate the prevalence of a form of icon worship during this period, for most of them were, in fact, ‘simple commemorative and ex voto images,’ with the exception of some that were considered relics and therefore endowed with miraculous or intercessory powers. The origin of the cult of icons apparently dates to a later time, probably toward the end of the seventh century.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/juan-s-codoner.html">Juan S. Codoñer</a></span><span class="wk"><span class="lbl">Work:</span> <cite>‘Melkites &amp; Icon Worship during the Iconoclastic Period’ in Dumbarton Oaks Papers, vol. 67 (2013), pp. 135-87</cite>, p. 135</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
<div class="actions"><button class="copy" data-copy="“Beginning in the second half of the sixth century, a slow but steady diffusion of icons of saints, of Christ, and of the Virgin is evident in the Empire… These icons do not, however, indicate the prevalence of a form of icon worship during this period, for most of them were, in fact, ‘simple commemorative and ex voto images,’ with the exception of some that were considered relics and therefore endowed with miraculous or intercessory powers. The origin of the cult of icons apparently dates to a later time, probably toward the end of the seventh century.”

— Juan S. Codoñer, ‘Melkites &amp; Icon Worship during the Iconoclastic Period’ in Dumbarton Oaks Papers, vol. 67 (2013), pp. 135-87, p. 135">Copy</button><a class="share" href="https://x.com/intent/post?text=%E2%80%9CBeginning+in+the+second+half+of+the+sixth+century%2C+a+slow+but+steady+diffusion+of+icons+of+saints%2C+of+Christ%2C+and+of+the+Virgin+is+evident+in+the+Empire%E2%80%A6+These+icons+do+not%2C+however%2C+indicate+the+prevalence+of+a+form+of+icon+worship+during+this+period%2C+for+most+of+them+were%2C+in+fact%2C+%E2%80%98simple+commemorative+and+ex+voto+images%2C%E2%80%99+with+the+exception+of+some+that+were+considered+relics+and+therefore+endowed+with+miraculous+or+intercessory+powers.+The+origin+of+the+cult+of+icons+apparently+dates+to+a+later+time%2C+probably+toward+the+end+of+the+seventh+century.%E2%80%9D%0A%0A%E2%80%94+Juan+S.+Codo%C3%B1er%2C+%E2%80%98Melkites+%26+Icon+Worship+during+the+Iconoclastic+Period%E2%80%99+in+Dumbarton+Oaks+Papers%2C+vol.+67+%282013%29%2C+pp.+135-87%2C+p.+135&amp;url=https%3A%2F%2F5solasquotes.github.io%2Fquote%2F21f55b1030.html&amp;via=5Solas" target="_blank" rel="noopener">Share on X</a><a class="perma" href="../quote/21f55b1030.html">Permalink</a><a class="src" href="https://reformedbooksonline.com/on-iconoclasm/#:~:text=Beginning%20in%20the%20second%20half%20of,the%20end%20of%20the%20seventh%20century&amp;text=Beginning%20in%20the%20second%20half%20of%20the%20sixth&amp;text=probably%20toward%20the%20end%20of%20the%20seventh%20century" rel="noopener" target="_blank">Read it online · Reformed Books Online</a></div>
</figure><figure class="quote" id="q-cd3a190048" data-kw="">
<blockquote><p>Universus locus demonstrat deum esse, qui apparuit. Dicitur Angelus, ut cognoscamus, quod is, qui visus est, non est Deus Pater (cuius enim Angelus esset Pater) sed unigenitus Filius, qui magni consilij est angelus, qui sacris discipulis dixit; Omnia quaecun{que} audiui apatre meo, nota fecivobis. Quemadmodum autem angeli nomen posuit, non quidem volens ministrorum quempiam innuere, sed personam unigeniti demonstrare: sic iterum ipsius tum naturam, tum potentiam praedicat, inquiens ipsum dixisse: Ego sum qui sum, et Ego Deus Abraham, Deus Isaack, Deus Iacob, etc.</p></blockquote>
<figcaption><span class="by"><span class="lbl">Author:</span> <a href="../authors/theodoret.html">Theodoret</a></span><span class="wk"><span class="lbl">Work:</span> <cite>Quoted in Gervase Babington, Comfortable Notes upon the books of Exodus &amp; Leviticus... (London: Chard, 1604), ch. 3</cite>, p. 32 Theodoret (c. 393–c. 458/466)</span></figcaption>
<div class="meta"><span class="t"><a href="../topics/worship/idolatry-and-images.html">Idolatry and Images</a></span></div>
